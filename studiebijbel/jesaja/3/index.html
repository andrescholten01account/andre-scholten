aanstellen als leiders over duizend, en als leiders over vijftigtallen; en hij zal hen zijn akker laten ploegen, en zijn oogst laten oogsten, en zijn oorlogswapens laten maken, alsook zijn wagentuig.", "Gen 2:17": "Maar van de boom van de kennis van goed en kwaad, daarvan mag u niet eten; want op de dag dat u daarvan eet, zult u de dood sterven.", "Lev 14:56": "alsook voor gezwel, en voor gezweer, en voor blaren;", "Jer 5:17": "En het zal uw oogst en uw brood opeten, dat uw zonen en uw dochters zouden eten; het zal uw schapen en uw runderen opeten; het zal uw wijnstok en uw vijgenboom opeten; uw vaste steden, waarop u vertrouwt, zal het arm maken door het zwaard.", "Jer 6:26": "O dochter van Mijn volk! Gord een zak aan, en wentel u in de as, bedrijf rouw als om een enige zoon, een zeer bitter misbaar; want de verstoorder zal ons snel overkomen.", "Matt 21:33-36": "Hoor een andere gelijkenis. Er was een heer des huizes, die een wijngaard plantte en er een omheining omheen zette, en er een wijnpersbak in groef, en een toren bouwde, en hem verhuurde aan landbouwers, en op reis ging naar het buitenland. Toen nu de tijd van de vruchten naderde, stuurde hij zijn dienstknechten naar de landbouwers, om zijn vruchten te ontvangen. En de landbouwers grepen zijn dienstknechten en sloegen de een, en doodden een ander, en stenigden een derde.", "Jes 10:18": "Ook zal Hij verteren de heerlijkheid van zijn woud en van zijn vruchtbare veld; van de ziel af, tot het vlees toe; en hij zal zijn, zoals wanneer een vaandeldrager versmelt.", "Ps 111:5": "Teth. Hij heeft hun die Hem vrezen, spijs gegeven; Jod. Hij gedenkt in eeuwigheid aan Zijn verbond.", "Openb 10:6": "En hij zwoer bij Hem Die leeft in alle eeuwigheid, Die de hemel geschapen heeft en wat daarin is, en de aarde en wat daarin is, en de zee en wat daarin is, dat er geen tijd meer zal zijn;", "Jer 22:17": "Maar uw ogen en uw hart zijn nergens op gericht dan op uw hebzucht, en op onschuldig bloed, om dat te vergieten, en op verdrukking en geweld, om die te doen.", "Joh 10:1": "Voorwaar, voorwaar zeg Ik u: die niet door de deur ingaat in de schaapskooi, maar van elders inklimt, die is een dief en rover.", "Ps 64:9": "En hun tong zal hen doen struikelen tegen zichzelf; ieder, die hen ziet, zal wegvluchten.", "Micha 1:11": "Ga door, u inwoonster van Safir! Met blote schaamte; de inwoonster van Zaanan gaat niet uit; rouwklaagt is te Beth-haezel; hij zal zijn stand van u nemen.", "Luk 22:24": "En er ontstond ook twist onder hen, wie van hen scheen de meeste te zijn.", "Ps 89:32": "als zij Mijn inzettingen ontheiligen, en Mijn geboden niet houden;", "Ps 107:17": "De zotten worden geplaagd om de weg van hun overtreding, en om hun ongerechtigheden;", "Rom 14:23": "Maar hij die twijfelt, is veroordeeld als hij eet, omdat hij niet uit het geloof eet. En alles wat niet uit het geloof is, dat is zonde.", "Luk 23:31": "Want als zij dit doen aan het groene hout, wat zal er dan aan het dorre gebeuren?", "Ps 78:19-22": "En zij spraken tegen God, zij zeiden: Zou God een tafel kunnen aanrichten in de woestijn? Zie, Hij heeft de rotssteen geslagen, zodat er water uitvloeide, en beken overvloedig uitbraken, zou Hij ook brood kunnen geven? Zou Hij aan Zijn volk vlees toebereiden? Daarom hoorde de HEERE, en werd verbolgen; en een vuur werd ontstoken tegen Jakob, en ook toorn ging op tegen Israël;", "Jes 33:14": "De zondaars in Sion zijn verschrikt; beving heeft de huichelaars aangegrepen; zij zeggen: Wie onder ons kan bij een verterend vuur wonen? Wie onder ons kan bij een eeuwige gloed wonen?", "Amos 6:13": "U, die blij bent over een nietig ding; u, die zegt: Hebben wij niet door onze eigen kracht hoorns voor onszelf verkregen?", "1 Joh 3:8": "Die de zonde doet, is uit de duivel; want de duivel zondigt vanaf het begin. Hiertoe is de Zoon van God geopenbaard, opdat Hij de werken van de duivel zou verbreken.", "Hand 23:3": "Toen zei Paulus tegen hem: God zal u slaan, u witgepleisterde muur! Zit u daar om mij naar de wet te oordelen, en beveelt u, tegen de wet in, dat men mij zal slaan?", "2 Tess 1:5-9": "Een bewijs van het rechtvaardige oordeel van God, opdat u waardig geacht wordt voor het Koninkrijk van God, waarvoor u ook lijdt; Aangezien het recht is bij God, verdrukking te vergelden aan hen die u verdrukken; En aan u, die verdrukt wordt, verkwikking te geven met ons, bij de openbaring van de Heere Jezus vanuit de hemel met de engelen van Zijn kracht;", "Jer 13:16": "Geeft eer aan de HEERE, uw God, voor Hij het duister maakt, en voor uw voeten zich stoten aan de schemerende bergen; terwijl u naar licht uitkijkt, en Hij dat tot een schaduw van de dood maakt, en tot diepe duisternis zet.", "Deut 32:10": "Hij vond hem in een land van de woestijn, en in een woeste huilende wildernis; Hij voerde hem rondom, Hij onderwees hem, Hij bewaarde hem als Zijn oogappel.", "Spr 28:25": "Wie hoogmoedig van hart is, verwekt ruzie; maar wie op de HEERE vertrouwt, zal welvarend worden.", "Jer 5:16": "Zijn pijlkoker is als een open graf; zij zijn allemaal helden.", "Spr 11:5-8": "De gerechtigheid van de oprechte maakt zijn weg recht; maar de goddeloze valt door zijn goddeloosheid. De gerechtigheid van de vromen zal hen redden; maar de trouwelozen worden gevangen in hun eigen verkeerdheid. Als de goddeloze mens sterft, vergaat zijn verwachting; zelfs de allersterkste hoop is vergaan.", "Pred 12:14": "Want God zal ieder werk in het gericht brengen, met alles wat verborgen is, hetzij goed, of hetzij kwaad.", "2 Kon 14:10": "U hebt de Edomieten inderdaad geslagen, daarom heeft uw hart u verheven; heb de eer, en blijf in uw huis; want waarom zou u zich in het kwade mengen, zodat u zou vallen, u en Juda met u?", "Ezech 28:2-9": "Mensenkind! Zeg tegen de vorst van Tyrus: Zo zegt de Heere HEERE: Omdat uw hart zich verheft en u zegt: Ik ben God, ik zit in de zetel van God, in het hart van de zeeën! terwijl u een mens bent en geen God, stelt u toch uw hart als het hart van God. Zie, u bent wijzer dan Daniël; zij hebben niets van het toegesloten voor u verborgen. Door uw wijsheid en door uw verstand hebt u vermogen voor uzelf verkregen; ja, u hebt goud en zilver verkregen in uw schatten.", "Zef 3:3": "Haar vorsten zijn brullende leeuwen in haar midden; haar rechters zijn avondwolven, die de beenderen niet breken tot aan de morgen.", "Luk 12:8": "En Ik zeg u: ieder die Mij belijden zal voor de mensen, die zal ook de Zoon des mensen belijden voor de engelen van God.", "Ezech 33:30": "En u, o mensenkind! De kinderen van uw volk spreken voortdurend over u bij de muren en in de deuren van de huizen; en de een spreekt met de ander, ieder met zijn broeder, en zegt: Kom toch en luister wat het woord is dat van de HEERE komt.", "Ex 32:2": "Aäron zei tegen hen: Rukt de gouden oorringen af, die in de oren van uw vrouwen, uw zonen en uw dochters zijn, en breng ze bij mij.", "Num 15:30": "Maar de ziel die iets doet met opgeheven hand, hetzij van inboorlingen of van vreemdelingen, die smaadt de HEERE; en die ziel zal uitgeroeid worden uit het midden van haar volk;", "Rom 1:32": "die, hoewel zij het recht van God kennen, namelijk dat zij die zulke dingen doen de dood waard zijn, deze dingen niet alleen doen, maar ook nog instemming betonen aan hen die ze doen.", "Spr 25:27": "Veel honig eten is niet goed; maar het onderzoeken van de eigen eer is geen eer.", "Ps 18:25": "Zo gaf mij de HEERE weer naar mijn gerechtigheid, naar de reinheid van mijn handen, voor Zijn ogen.", "Ps 107:34": "Het vruchtbare land tot zoute grond, om de boosheid van hen die daarin wonen.", "Micha 6:13": "zo zal Ik u ook slaan met ziekte, u treffend, en u verwoestend om uw zonden.", "Lev 13:30": "En de priester de plaag bekeken zal hebben, dat, zie, haar aanzien dieper is dan het vel, en geelachtig, dun haar erop is, zal de priester hem onrein verklaren; het is schurftheid, het is melaatsheid van het hoofd of van de baard.", "Job 15:20-24": "Al zijn dagen doet de goddeloze zichzelf weedom aan; en weinige jaren in getal zijn voor de tiran weggelegd. Het geluid van verschrikkingen is in zijn oren; in de vrede zelf komt de verwoester hem over. Hij gelooft niet uit de duisternis terug te keren, maar dat hij beloerd wordt voor het zwaard.", "Spr 30:14": "Een geslacht wiens tanden zwaarden zijn, en wiens baktanden messen zijn, om de ellendigen van de aarde en de behoeftigen onder de mensen te verslinden.", "Spr 13:21": "Het kwaad zal de zondaars vervolgen; maar de rechtvaardige zal men met goed vergelden.", "Joh 3:18-20": "Wie in Hem gelooft, wordt niet veroordeeld, maar wie niet gelooft, is al veroordeeld, omdat hij niet geloofd heeft in de Naam van de eniggeboren Zoon van God. En dit is het oordeel: dat het licht in de wereld gekomen is, en de mensen hebben de duisternis liever gehad dan het licht; want hun werken waren slecht. Want ieder die kwaad doet, haat het licht en komt niet tot het licht, opdat zijn werken niet bestraft worden.", "2 Tim 2:13": "als wij ontrouw zijn, blijft Hij trouw; Hij kan Zichzelf niet verloochenen.", "1 Tim 6:4": "is hij opgeblazen en weet hij niets, maar hij raakt bezeten van twistvragen en woordenstrijd; daaruit komen nijd, twist, lasteringen, kwade vermoedens,", "2 Kor 5:10": "Want wij moeten allen geopenbaard worden voor de rechterstoel van Christus, opdat ieder ontvangt wat door het lichaam gedaan is, naarmate hij gedaan heeft, hetzij goed, hetzij kwaad.", "Jes 5:7": "Want de wijngaard van de HEERE van de heerscharen is het huis van Israël, en de mannen van Juda zijn een plant van Zijn welbehagen; en Hij heeft gewacht op recht, maar zie, het is onderdrukking; op gerechtigheid, maar zie, het is geschreeuw.", "Hos 4:8": "Zij eten de zonde van Mijn volk, en verlangen, ieder met zijn ziel, naar hun ongerechtigheid.", "Ps 64:6": "Zij sterken zichzelf in een boze zaak; zij overleggen om strikken te verbergen; zij zeggen: Wie zal ze zien?", "Kol 3:25": "Maar wie onrecht doet, zal het onrecht dragen dat hij gedaan heeft; en er is geen aanneming van het persoon.", "2 Sam 23:7": "maar ieder die ze zal aantasten, voorziet zich met ijzer en het hout van een speer; en zij zullen helemaal met vuur verbrand worden, op dezelfde plaats.", "Matt 21:44": "En wie op deze steen valt, zal verpletterd worden; en op wie hij valt, die zal hij vermorzelen.", "Jes 3:16-23": "Verder zegt de HEERE: Omdat de dochters van Sion zich verheffen, en gaan met uitgestrekte hals, en lonken met de ogen, al gaande en trippelende daarheen treden, en alsof haar voeten gebonden waren. Zo zal de Heere de schedel van de dochters van Sion schurftig maken, en de HEERE zal haar schaamte ontbloten. Op diezelfde dag zal de Heere wegnemen het sieraad van de kousebanden, en de netjes, en de maantjes,", "Jer 23:25-39": "Ik heb gehoord wat de profeten zeggen, die in Mijn Naam leugen profeteren, en zeggen: Ik heb gedroomd, ik heb gedroomd. Hoe lang? Is er dan een droom in het hart van de profeten, die de leugen profeteren? Ja, het zijn profeten van de bedriegerij van hun eigen hart. Die daar denken om Mijn volk Mijn Naam te doen vergeten, door hun dromen, die zij, ieder aan zijn naaste, vertellen; net zoals hun vaders Mijn Naam vergeten hebben door Baäl.", "Joh 12:40": "Hij heeft hun ogen verblind, en hun hart verhard; opdat zij met de ogen niet zien, en met het hart niet verstaan, en zij zich bekeren, en Ik hen genees.", "Ezech 5:8-17": "Daarom zegt de Heere HEERE zo: Zie, Ik wil tegen u, ja Ik, want Ik zal gerichten in het midden van u oefenen, voor de ogen van die heidenvolken. En Ik zal onder u doen, wat Ik niet gedaan heb, en zoals Ik voortaan niet meer doen zal, vanwege al uw gruwelen. Daarom zullen de vaders de kinderen eten in het midden van u, en de kinderen zullen hun vaders eten; en Ik zal gerichten onder u oefenen, en al uw overblijfsel zal Ik naar alle windrichtingen verstrooien.", "Ps 120:4": "Scherpe pijlen van een machtige, alsook gloeiende jeneverkolen.", "Spr 13:25": "De rechtvaardige eet tot verzadiging van zijn ziel toe; maar de buik van de goddelozen zal gebrek hebben.", "Gen 38:25": "Toen zij naar buiten werd gebracht, liet zij aan haar schoonvader zeggen: Van de man van wie deze dingen zijn, ben ik zwanger; en zij zei: Herken toch, van wie deze zegelring, en dit snoer, en deze staf zijn.", "Jer 9:3-6": "En zij spannen hun tong als hun boog voor leugen; zij worden geweldig in het land, maar niet voor waarheid; want zij gaan voort van slechtheid tot slechtheid, maar Mij kennen zij niet, spreekt de HEERE. Wacht u, ieder voor zijn vriend, en vertrouw niet op enige broeder; want elke broeder doet niet dan bedriegen, en elke vriend gaat om met achterklap. En zij bedriegen, ieder zijn vriend, en spreken de waarheid niet; zij leren hun tong leugen spreken, zij maken zich moe met verkeerd te handelen.", "Spr 12:15": "De weg van de dwaas is recht in zijn eigen ogen; maar wie naar raad hoort, is wijs.", "Spr 1:22": "U eenvoudigen! hoe lang zult u de eenvoudigheid liefhebben, en de spotters voor zichzelf de spotternij begeren, en de dwazen wetenschap haten?", "Matt 23:6-8": "En zij houden van de belangrijkste plaats bij de maaltijden, en de voorste stoelen in de synagogen; ook de begroetingen op de markten, en om door de mensen genoemd te worden: Rabbi, Rabbi! Maar u moet niet Rabbi genoemd worden; want Eén is uw Meester, namelijk Christus; en u bent allemaal broeders.", "1 Kor 15:21": "Want omdat de dood door een mens is, is ook de opstanding van de doden door een Mens.", "Deut 28:23": "En uw hemel, die boven uw hoofd is, zal koper zijn, en de aarde, die onder u is, zal ijzer zijn.", "Matt 13:30": "Laat ze beide samen opgroeien tot de oogst, en in de tijd van de oogst zal ik tegen de maaiers zeggen: Verzamel eerst het onkruid, en bind het in bundels om het te verbranden; maar breng de tarwe samen in mijn schuur.", "Jer 23:14": "Maar in de profeten van Jeruzalem zie Ik afschuwelijkheid; zij plegen overspel, en gaan om met valsheid, en sterken de handen van de boosdoeners, zodat zij zich niet bekeren, ieder van zijn boosheid; zij zijn Mij allen als Sodom, en haar inwoners als Gomorra.", "Hos 6:9": "Zoals de benden van straatrovers op iemand wachten, zo is het gezelschap van de priesters; zij moorden op de weg naar Sichem, waarlijk, zij doen schandelijke daden.", "Ex 17:1-3": "Daarna trok de hele gemeenschap van de kinderen van Israël, volgens hun dagreizen, uit de woestijn Sin, op bevel van de HEERE, en zij legerden zich bij Rafidim. Daar was echter geen water voor het volk om te drinken. Toen maakte het volk ruzie met Mozes, en zei: Geef ons water, zodat wij kunnen drinken! Mozes zei tegen hen: Waarom maakt u ruzie met mij? Waarom stelt u de HEERE op de proef? Toen het volk daar dorstte naar water, morde het volk tegen Mozes, en het zei: Waarom hebt u ons nu uit Egypte laten wegtrekken, om mij, en mijn kinderen, en mijn vee, van dorst te laten sterven?", "Zef 3:11": "Op die dag zult u niet beschaamd zijn vanwege al uw handelingen, waarmee u tegen Mij overtreden hebt; want dan zal Ik uit uw midden wegnemen wie van vreugde opspringen over uw hoogmoed, en u zult zich voortaan niet meer verheffen om Mijn heilige berg.", "Ezech 24:14": "Ik, de HEERE, heb het gesproken; het zal komen, en Ik zal het doen; Ik zal er niet van wijken, en Ik zal niet sparen, en geen berouw hebben; naar uw wegen en naar uw daden zullen zij u oordelen, spreekt de Heere HEERE.", "Ps 50:6": "En de hemelen verkondigen Zijn gerechtigheid; want God Zelf is Rechter. Sela.", "Jer 47:5": "Kaalheid is op Gaza gekomen; Askelon is uitgeroeid, met het overblijfsel van hun dal; hoe lang zult u uzelf insnijdingen maken?", "2 Tim 4:3": "Want er zal een tijd komen dat zij de gezonde leer niet zullen verdragen, maar doordat hun oren jeuken, zullen zij zich naar hun eigen begeerten leraars in menigte bijeenzoeken;", "Spr 11:19": "Zo is de gerechtigheid ten leven, zoals wie het kwade najaagt, naar zijn eigen dood jaagt.", "Gen 24:53": "En de knecht haalde zilveren sieraden, en gouden sieraden, en kleren tevoorschijn, en hij gaf die aan Rebekka; hij gaf ook aan haar broer en haar moeder kostbare geschenken.", "2 Kor 11:1-31": "Och, of u mij een weinig verdroeg in de onwijsheid; ja, verdraag mij ook! Want ik ben ijverig over u met een ijver van God; want ik heb u toebereid om u als een reine maagd aan één man voor te stellen, namelijk aan Christus. Doch ik vrees dat, zoals de slang Eva door haar arglistigheid bedrogen heeft, zo ook uw gedachten op enigerlei wijze bedorven worden, om af te wijken van de eenvoudigheid die in Christus is.", "Job 22:9-11": "De weduwen hebt u met lege handen weggezonden, en de armen van de wezen zijn verbrijzeld. Daarom zijn er strikken rondom u, en angst heeft u haastig overvallen. Of u ziet de duisternis niet, en een overvloed van water bedekt u.", "2 Tess 1:4-6": "Zodat wij zelf over u roemen in de Gemeenten van God, over uw volharding en geloof in al uw vervolgingen en verdrukkingen, die u verdraagt; Een bewijs van het rechtvaardige oordeel van God, opdat u waardig geacht wordt voor het Koninkrijk van God, waarvoor u ook lijdt; Aangezien het recht is bij God, verdrukking te vergelden aan hen die u verdrukken;", "Amos 6:9": "En het zal gebeuren, als er tien mannen in één huis zijn overgebleven, dat zij zullen sterven.", "Jes 28:24-28": "Ploegt de ploeger de hele dag om te zaaien? Opent en egt hij zijn land de hele dag? Is het niet zo? Wanneer hij het bovenste ervan gelijk gemaakt heeft, dan strooit hij wikken, en spreidt komijn uit, of hij werpt er de beste tarwe in, of uitgelezen gerst, of spelt, elk op zijn plaats. En zijn God onderricht hem over de juiste wijze, Hij leert het hem.", "1 Kor 11:5": "maar iedere vrouw die bidt of profeteert met ongedekt hoofd, onteert haar eigen hoofd; want het is een en hetzelfde, alsof haar het haar afgesneden was.", "Matt 11:23": "En u, Kapernaüm! Die tot de hemel toe verhoogd bent, u zult tot de hel toe neergestoten worden. Want als in Sodom die krachten gebeurd waren die in u gebeurd zijn, zouden zij tot op deze huidige dag gebleven zijn.", "Luk 20:45-47": "En terwijl al het volk luisterde, zei Hij tegen Zijn discipelen: Wacht u voor de Schriftgeleerden, die graag rondlopen in lange gewaden, en die de begroetingen op de markten graag hebben, en de voorste plaatsen in de synagogen, en de ereplaatsen bij de maaltijden; die de huizen van de weduwen opeten, en voor de schijn lange gebeden uitspreken; zij zullen een des te zwaarder oordeel ontvangen.", "Spr 21:12": "De rechtvaardige let verstandig op het huis van de goddeloze, als God de goddelozen in het kwaad stort.", "1 Tim 2:9-15": "Evenzo ook, dat de vrouwen, in eerbaar gewaad, zichzelf sieren met schaamte en ingetogenheid, niet met vlechtingen van het haar, of goud, of parels, of kostbare kleding; maar (wat past bij vrouwen die de godsvrucht belijden) door goede werken. Een vrouw moet zich laten leren in stilte, in alle onderdanigheid.", "Ezech 12:22": "Mensenkind, wat is dit voor een spreekwoord dat u hebt in het land Israël, namelijk: de dagen worden verlengd, en elk visioen vervalt?", "Ezech 16:48": "Zo waar Ik leef, spreekt de Heere HEERE, Sodom, uw zuster, heeft niet gedaan, zij en haar dochters niet, zoals u gedaan hebt, u en uw dochters!", "Joël 2:2-10": "Een dag van duisternis en donkerheid, een dag van wolken en dikke duisternis, als de dageraad uitgespreid over de bergen; een groot en machtig volk, zoals er van oude tijden af niet geweest is, en na hen niet meer zal zijn tot in jaren van vele geslachten. Voor hen verteert een vuur, en achter hen brandt een vlam; het land is voor hen als een lusthof, maar achter hen een woeste wildernis, en ook is er geen ontkomen aan hen. Hun gedaante is als de gedaante van paarden, en als ruiters, zo zullen zij lopen.", "2 Sam 3:39": "Maar ik ben vandaag teder, hoewel tot koning gezalfd, en deze mannen, de zonen van Zeruja, zijn te hard voor mij; de HEERE zal de boosdoener vergelden naar zijn boosheid.", "Ps 23:5": "U richt de tafel voor mij aan, tegenover mijn tegenstanders; U maakt mijn hoofd vet met olie, mijn beker vloeit over.", "Jes 47:2": "Neem de molen en maal meel; ontdek uw vlechten, ontbloot de enkels, ontdek de schenkels, ga door de rivieren.", "2 Kron 36:9": "Acht jaar was Jojachin oud, toen hij koning werd, en hij regeerde drie maanden en tien dagen te Jeruzalem, en deed wat slecht was in de ogen van de HEERE.", "Jer 43:2": "Toen zei Azaria, de zoon van Hosaja, en Johanan, de zoon van Kareah, en alle trotse mannen, tegen Jeremia: U spreekt leugen; de HEERE, onze God, heeft u niet gezonden, om te zeggen: U zult niet naar Egypte gaan, om daar als vreemdelingen te verblijven.", "Hebr 12:25": "Zie erop toe dat u Hem, Die spreekt, niet verwerpt; want als dezen niet ontkomen zijn, die hem verwierpen die op aarde Goddelijke antwoorden gaf, hoeveel te meer zullen wij niet ontkomen, als wij ons afkeren van Hem Die van de hemelen is;", "Richt 9:56": "Zo liet God het kwaad van Abimelech, dat hij aan zijn vader gedaan had door zijn zeventig broers te doden, op hem terugkomen.", "Ps 55:20": "God zal horen, en zal hen vernederen, Hij die van oudsher zit, Sela; omdat er bij hen helemaal geen verandering is, en zij God niet vrezen.", "Rom 8:5": "Want wie naar het vlees zijn, bedenken de dingen van het vlees; maar wie naar de Geest zijn, bedenken de dingen van de Geest.", "Ps 94:13": "Om hem rust te geven van de kwade dagen; totdat de kuil voor de goddeloze gegraven wordt.", "Job 14:4": "Wie kan een reine geven uit een onreine? Niemand.", "2 Kon 14:9": "Maar Joas, de koning van Israël, zond naar Amazia, de koning van Juda, en zei: De distel die op de Libanon staat, zond naar de ceder die op de Libanon staat, en zei: Geef uw dochter aan mijn zoon tot vrouw; maar het wilde dier van het veld, dat op de Libanon was, kwam voorbij en vertrapte de distel.", "Jes 26:20": "Ga heen, mijn volk, ga in uw binnenkamers, en sluit uw deuren achter u toe; verberg u voor een klein ogenblik, totdat de gramschap voorbijgaat.", "Spr 2:22": "Maar de goddelozen zullen van de aarde uitgeroeid worden, en de trouwelozen zullen eruit weggerukt worden.", "Hos 9:15": "Al hun slechtheid is in Gilgal, want daar heb Ik ze gehaat, om de slechtheid van hun daden; Ik zal ze uit Mijn huis verdrijven, Ik zal ze voortaan niet meer liefhebben; al hun vorsten zijn afvalligen.", "Jes 10:3": "Maar wat zult u doen op de dag van de bezoeking, en van de verwoesting, die van verre komen zal? Naar wie zult u vluchten om hulp, en waar zult u uw heerlijkheid laten?", "Job 20:19-21": "Omdat hij de armen onderdrukt en verlaten heeft, een huis geroofd heeft dat hij niet gebouwd had; Omdat hij geen rust in zijn buik gekend heeft, zal hij van wat hij begeerde niets behouden. Er zal niets overblijven om te eten; daarom zal hij niet uitzien naar zijn goed.", "Ezech 22:6": "Zie, de vorsten van Israël zijn in u geweest, ieder naar zijn kracht, om bloed te vergieten.", "2 Petr 1:10": "Span u daarom, broeders, des te meer in om uw roeping en verkiezing vast te maken; want als u dat doet, zult u nooit struikelen.", "Jer 6:14": "En zij genezen de breuk van de dochter van Mijn volk op het lichtste, en zeggen: Vrede, vrede! Doch daar is geen vrede.", "Zef 3:7": "Ik zei: Zeker zult u Mij vrezen, u zult de tucht aannemen, opdat haar woning niet uitgeroeid zou worden; alles waarmee Ik haar bezocht heb¹, waarlijk, zij hebben zich vroeg opgemaakt, zij hebben al hun handelingen verdorven.", "Matt 12:24": "Maar de Farizeeën hoorden dit en zeiden: Deze werpt de duivels niet anders uit dan door Beëlzebul, de leider van de duivels.", "1 Kor 14:34": "Laat uw vrouwen in de Gemeenten zwijgen; want het is haar niet toegestaan te spreken, maar bevolen onderworpen te zijn, zoals ook de wet zegt.", "Openb 2:12": "En schrijf aan de engel van de gemeente die in Pergamus is: Dit zegt Hij, Die het tweesnijdend scherpe zwaard heeft:", "2 Kor 7:10": "Want de droefheid naar God werkt een onberouwelijke bekering tot zaligheid; maar de droefheid van de wereld werkt de dood.", "Jes 5:24": "Daarom, zoals de tong van het vuur de stoppel verteert, en het kaf door de vlam verteerd wordt, zo zal hun wortel als verrotting zijn; en hun bloesem zal als stof opstijgen; omdat zij de wet van de HEERE van de heerscharen verwerpen, en het woord van de Heilige van Israël versmaden.", "Jer 22:3": "Zo zegt de HEERE: Doe recht en gerechtigheid, en red de beroofde uit de hand van de verdrukker; en onderdruk de vreemdeling niet, de wees, noch de weduwe; doe geen geweld en vergiet geen onschuldig bloed op deze plaats.", "2 Kron 28:22": "Ja, in de tijd toen men hem benauwde, ging hij nog meer overtreden tegen de HEERE; dit was koning Achaz.", "Ps 94:10": "Zou Hij, Die de heidenen tuchtigt, niet straffen, Hij, Die de mens wetenschap leert?", "Richt 11:6-8": "En zij zeiden tegen Jeftha: Kom, en word onze aanvoerder, zodat wij kunnen strijden tegen de kinderen van Ammon. Maar Jeftha zei tegen de oudsten van Gilead: Hebt u mij niet gehaat, en mij uit het huis van mijn vader verstoten? Waarom bent u dan nu naar mij toegekomen, nu u in benauwdheid verkeert? En de oudsten van Gilead zeiden tegen Jeftha: Daarom zijn wij nu naar u teruggekomen, dat u met ons meegaat en tegen de kinderen van Ammon strijdt; en u zult ons tot hoofd zijn, over alle inwoners van Gilead.", "Ps 75:9": "Want in de hand van de HEERE is een beker, en de wijn is beroerd, vol van mengeling, en Hij schenkt daaruit; doch alle goddelozen van de aarde zullen zijn droesems drinken, terwijl ze die uitzuigen.", "Amos 8:4-6": "Hoor dit, u die de nooddruftige opslokt! en die de ellendigen van het land wil vernielen; En zegt: Wanneer is de nieuwe maan voorbij, zodat wij koren mogen verkopen? en de sabbat, zodat wij graan mogen aanbieden? terwijl u de efa verkleint en de sikkel vergroot, en verkeerd handelt met bedrieglijke weegschalen; Zodat wij de armen voor geld mogen kopen, en de nooddruftige om een paar schoenen; en dan zullen wij het kaf van het koren verkopen.", "Mark 4:12": "opdat zij ziende zien, en niet opmerken; en horende horen, en niet verstaan; opdat zij zich niet op enig moment bekeren en hun de zonden vergeven worden.", "Openb 16:2": "En de eerste ging heen, en goot zijn schaal uit op de aarde; en er kwam een kwaad en boosaardig gezwel aan de mensen, die het merkteken van het beest hadden, en die zijn beeld aanbaden.", "Ps 107:12": "Daarom heeft Hij hun hart door zwarigheid vernederd; zij zijn gestruikeld, en er was geen helper.", "Zach 13:2-5": "En het zal op die dag gebeuren, spreekt de HEERE van de heerscharen, dat Ik de namen van de afgoden uit het land zal uitroeien, zodat er niet meer aan gedacht wordt; en ook de profeten en de onreine geest zal Ik uit het land wegdoen. En het zal gebeuren, wanneer iemand nog profeteert, dat zijn vader en zijn moeder, die hem verwekt hebben, tegen hem zullen zeggen: U zult niet leven, omdat u leugens gesproken hebt in de Naam van de HEERE; en zijn vader en zijn moeder, die hem verwekt hebben, zullen hem doorsteken, wanneer hij profeteert. En het zal op die dag gebeuren, dat die profeten beschaamd zullen worden, ieder vanwege zijn visioen, wanneer hij profeteert; en zij zullen geen haren mantel aandoen om te liegen.", "Jona 1:6": "En de opperschipper kwam naar hem toe, en zei tegen hem: Wat is er met u, harde slaper? Sta op, roep tot uw God; misschien zal die God aan ons denken, zodat wij niet vergaan.", "Ps 76:9": "U deed een oordeel horen uit de hemel; de aarde vreesde en werd stil,", "Ps 9:5": "Want Gij hebt mijn recht en mijn rechtszaak afgedaan; Gij hebt gezeten op de troon, o Rechter der gerechtigheid.", "Ezech 14:10": "En zij zullen hun ongerechtigheid dragen; zoals de ongerechtigheid van de vrager zal zijn, zo zal de ongerechtigheid van de profeet zijn;", "1 Joh 1:9": "Als wij onze zonden belijden: Hij is getrouw en rechtvaardig, om ons de zonden te vergeven, en ons te reinigen van alle ongerechtigheid.", "Matt 10:28": "En weest niet bang voor hen die het lichaam doden, en de ziel niet kunnen doden; maar vreest veel meer Hem, Die zowel ziel als lichaam kan verderven in de hel.", "Rom 9:22": "En wat nu, als God, terwijl Hij Zijn toorn wilde bewijzen en Zijn macht bekend wilde maken, met veel geduld de vaten van de toorn verdragen heeft, die klaargemaakt zijn tot verderf;", "Job 20:12": "Al is het kwaad zoet in zijn mond, al verbergt hij dat onder zijn tong,", "Spr 23:22": "Hoor naar uw vader, die u verwekt heeft; en veracht uw moeder niet, als zij oud geworden is.", "Deut 27:12-26": "Dezen zullen staan om het volk te zegenen op de berg Gerizim, wanneer u over de Jordaan gegaan bent: Simeon, en Levi, en Juda, en Issaschar, en Jozef, en Benjamin. En dezen zullen staan voor de vervloeking op de berg Ebal: Ruben, Gad en Aser, Zebulon, Dan en Naftali. En de Levieten zullen zich uitspreken en zeggen tegen alle mannen van Israël, met verheven stem:", "Obadja 1:1": "Het visioen van Obadja. Zo zegt de Heere HEERE van Edom: Wij hebben een bericht gehoord van de HEERE, en er is een gezant gestuurd onder de heidenvolken: Sta op, en laten wij tegen haar opstaan ten strijde.", "Ps 37:10": "Vau. En nog een korte tijd, en de goddeloze zal er niet zijn; en u zult goed opletten op zijn plaats, maar hij zal er niet zijn.", "Luk 19:10": "Want de Zoon des mensen is gekomen om te zoeken en zalig te maken wat verloren was.", "Jer 25:33": "En de verslagenen van de HEERE zullen op die dag liggen van het ene einde van de aarde tot aan het andere einde van de aarde; zij zullen niet beklaagd, noch verzameld, noch begraven worden; tot mest op de aardbodem zullen zij zijn.", "Mark 12:39": "en de voorste plaatsen willen hebben in de synagogen, en de ereplaatsen bij de maaltijden;", "Jer 2:31": "Geslacht, let toch op het woord van de HEERE! Ben Ik Israël een woestijn geweest, of een land van de uiterste donkerheid? Waarom zegt Mijn volk dan: Wij zijn heren, wij zullen niet meer tot U komen?", "Jes 51:22": "Zo zegt de Heere, de HEERE en uw God, Die de zaak van Zijn volk twisten zal: Zie, Ik neem de beker van de zwijmeling van uw hand, de droesem van de beker van Mijn grimmigheid; u zult die voortaan niet meer drinken.", "Ps 28:5": "Omdat zij niet letten op de daden van de HEERE, en ook niet op het werk van Zijn handen, zal Hij hen afbreken en niet meer opbouwen.", "Judas 1:15": "Om over allen gericht te houden, en alle goddelozen onder hen te straffen, vanwege al hun goddeloze werken, die zij goddeloos gedaan hebben, en vanwege alle harde woorden die de goddeloze zondaars tegen Hem gesproken hebben.", "Rom 1:20-32": "Want Zijn onzichtbare dingen worden, vanaf de schepping van de wereld, uit de schepselen begrepen en doorzien, namelijk Zijn eeuwige kracht en Goddelijkheid, opdat zij niet te verontschuldigen zouden zijn. Omdat zij, hoewel zij God kenden, Hem niet als God verheerlijkt of gedankt hebben; maar in hun overleggingen zijn zij verijdeld geworden, en hun onverstandig hart is verduisterd geworden; terwijl zij zich voor wijzen uitgaven, zijn zij dwaas geworden;", "Deut 24:19": "Wanneer u uw oogst op uw akker afgeoogst hebt, en een garf op de akker vergeten bent, zult u niet terugkeren om die op te halen; voor de vreemdeling, voor de wees en voor de weduwe zal die zijn; opdat de HEERE, uw God, u zegent in al het werk van uw handen.", "Micha 7:10": "En mijn vijandin zal het zien, en schaamte zal haar bedekken; zij die tegen mij zegt: Waar is de HEERE, uw God? Mijn ogen zullen op haar neerzien; nu zal zij worden tot vertreding, als slijk van de straten.", "Deut 11:26": "Zie, ik stel u heden voor: zegen en vloek:", "Spr 22:15": "De dwaasheid zit gebonden in het hart van de jongen; de roede van de tucht zal ze ver van hem wegdoen.", "Matt 25:14-30": "Want het is net als bij een mens, die naar het buitenland reisde, zijn dienstknechten riep, en hun zijn bezittingen toevertrouwde. En aan de één gaf hij vijf talenten, en aan de ander twee, en aan de derde één, ieder naar zijn vermogen, en hij vertrok meteen. Hij nu die de vijf talenten ontvangen had, ging op weg, en handelde daarmee, en verdiende er andere vijf talenten bij.", "Ps 10:13": "Waarom lastert de goddeloze God? Hij zegt in zijn hart: U zult het niet zoeken?", "Joh 5:43": "Ik ben gekomen in de Naam van Mijn Vader, en u neemt Mij niet aan; als een ander komt in zijn eigen naam, die zult u aannemen.", "Jes 57:9": "En u trekt met olie naar de koning, en u vermeerdert uw welriekende zalven; en u zendt uw gezanten ver weg, en vernedert u tot in het dodenrijk toe.", "2 Petr 1:11": "Want zo zal u rijkelijk de ingang worden verleend in het eeuwige Koninkrijk van onze Heere en Zaligmaker, Jezus Christus.", "Jes 9:4": "Toen de hele strijd van hen die streden, met gedruis gebeurde, en de kleren in het bloed gewenteld en verbrand werden, tot een voedsel van het vuur.", "Jes 26:7": "Het pad van de rechtvaardige is geheel effen, de gang van de rechtvaardige weegt U recht.", "Dan 3:15": "Nu dan, als u gereed bent om, op het moment dat u het geluid zult horen van de hoorn, de pijp, de citer, de vedel, de psalters, en het akkoordgezang, en allerlei soort muziek, neer te vallen en het beeld te aanbidden dat ik gemaakt heb, dan is het goed; maar als u het niet aanbidt, zult u op datzelfde moment geworpen worden in het midden van de brandende vuuroven; en wie is de god die u uit mijn handen zou kunnen verlossen?", "Jes 33:12": "En de volken zullen zijn als de verbrandingen van het kalk; als afgehouwen doornen zullen zij met het vuur verbrand worden.", "Ps 9:6": "Gij hebt de heidenen gescholden, de goddeloze verdaan, hun naam uitgedelgd, tot in eeuwigheid en altoos.", "Openb 19:17-21": "En ik zag een engel, staande in de zon; en hij riep met een grote stem, en zei tegen alle vogels, die in het midden van de hemel vlogen: Kom hierheen, en verzamel u tot het avondmaal van de grote God; Opdat u eet het vlees van de koningen, en het vlees van de aanvoerders over duizend, en het vlees van de sterken, en het vlees van de paarden en van hen die daarop zitten; en het vlees van alle vrijen en dienstknechten, en kleinen en groten. En ik zag het beest, en de koningen van de aarde, en hun legers verzameld, om krijg te voeren tegen Hem, Die op het paard zat, en tegen Zijn legers.", "Jer 44:23": "Vanwege dat u wierook gebrand hebt, en dat u tegen de HEERE gezondigd hebt, en de stem van de HEERE niet gehoorzaam bent geweest, en in Zijn wet en in Zijn inzettingen, en in Zijn getuigenissen niet hebt gewandeld; daarom is u dit kwaad overkomen, zoals het is op deze dag.", "Ps 11:4": "De HEERE is in het paleis van Zijn heiligheid, de troon van de HEERE is in de hemel; Zijn ogen aanschouwen, Zijn oogleden beproeven de mensenkinderen.", "Ezech 30:6": "Zo zegt de HEERE: Ja, zij zullen vallen, die Egypte ondersteunen, en de hoogmoed van zijn sterkte zal neerdalen; van de toren van Syene af zullen zij daarin door het zwaard vallen, spreekt de Heere HEERE.", "Ps 1:4-6": "Zo zijn de goddelozen niet, maar als het kaf dat de wind wegdrijft. Daarom zullen de goddelozen niet standhouden in het gericht, noch de zondaars in de vergadering van de rechtvaardigen. Want de HEERE kent de weg van de rechtvaardigen; maar de weg van de goddelozen zal vergaan.", "Hand 17:32": "Toen zij nu van de opstanding van de doden hoorden, spotten sommigen daarmee; en sommigen zeiden: Wij zullen u hierover een andere keer horen.", "Lev 22:22": "Het blinde, of gebrokene, of verlamde, of dat een wrat heeft, of droge schurftheid, of etterige schurftheid, deze zult u de HEERE niet offeren, en daarvan zult u de HEERE geen vuuroffer op het altaar geven.", "Spr 16:5": "Ieder die hoog van hart is, is de HEERE een gruwel; al slaat hij de handen ineen, hij zal niet onschuldig blijven.", "Mark 10:43": "Maar zo zal het onder u niet zijn; maar wie onder u groot wil worden, die zal uw dienaar zijn.", "Jer 32:30": "Want de kinderen van Israël en de kinderen van Juda hebben van hun jeugd af alleen maar gedaan wat kwaad was in Mijn ogen; want de kinderen van Israël hebben Mij door het werk van hun handen alleen maar vertoornd, spreekt de HEERE.", "2 Kron 6:22": "Wanneer iemand tegen zijn naaste zal gezondigd hebben, en die hem een eed van de vloek opgelegd zal hebben om zichzelf te vervloeken, en de eed van de vloek voor Uw altaar in dit huis komen zal;", "Joh 7:34": "U zult Mij zoeken en u zult Mij niet vinden; en waar Ik ben, kunt u niet komen.", "2 Kor 10:18": "Want niet wie zichzelf prijst, die is beproefd, maar wie de Heere prijst.", "1 Petr 5:5": "Evenzo, u jongeren, wees de ouderen onderdanig; en wees allen elkaar onderdanig; bekleed u met nederigheid; want God weerstaat de hoogmoedigen, maar aan de nederigen geeft Hij genade.", "Nahum 1:2": "Een ijverig God en een wreker is de HEERE, een wreker is de HEERE, en zeer grimmig; een wreker is de HEERE aan Zijn tegenstanders, en Hij bewaart de toorn voor Zijn vijanden.", "Micha 7:6": "Want de zoon veracht de vader, de dochter staat op tegen haar moeder, de schoondochter tegen haar schoonmoeder; iemands vijanden zijn zijn huisgenoten.", "Deut 11:28": "Maar de vloek, als u niet zult horen naar de geboden van de HEERE, uw God, en afwijkt van de weg, die ik u heden gebied, om andere goden na te wandelen, die u niet gekend hebt.", "Jak 5:20": "Laat die weten, dat wie een zondaar van de dwaling van zijn weg bekeert, een ziel van de dood zal behouden, en een menigte van zonden zal bedekken.", "1 Sam 8:10-18": "Samuël nu zei al de woorden van de HEERE aan het volk, dat een koning van hem begeerde. En hij zei: Dit zal de wijze van de koning zijn, die over u regeren zal: hij zal uw zonen nemen, en hen voor zichzelf aanstellen, voor zijn wagen en tot zijn ruiters, zodat zij voor zijn wagen uit zullen lopen; en hij zal hen voor zich aanstellen als leiders over duizend, en als leiders over vijftigtallen; en hij zal hen zijn akker laten ploegen, en zijn oogst laten oogsten, en zijn oorlogswapens laten maken, alsook zijn wagentuig.", "Matt 11:24": "Maar Ik zeg u, dat het het land van Sodom draaglijker zal zijn op de dag van het oordeel, dan u.", "Jes 30:9-11": "Want het is een opstandig volk; het zijn leugenachtige kinderen; kinderen die de wet van de HEERE niet willen horen. Die tegen de zieners zeggen: Ziet niet; en tegen de schouwers: Schouwt ons niet wat recht is; spreekt tot ons zachte dingen, schouwt ons bedriegerijen. Wijkt af van de weg, maakt u van het pad; laat de Heilige van Israël van ons ophouden!", "Ps 104:35": "De zondaars zullen van de aarde weggevaagd worden, en de goddelozen zullen niet meer zijn. Loof de HEERE, mijn ziel! Hallelujah!", "Job 13:26": "Want U schrijft bittere dingen tegen mij, en U doet mij de misdaden van mijn jeugd erven.", "1 Kor 11:3-15": "Maar ik wil dat u weet, dat Christus het Hoofd is van iedere man, en de man het hoofd van de vrouw, en God het Hoofd van Christus. Iedere man die bidt of profeteert met iets op het hoofd, onteert zijn eigen hoofd; maar iedere vrouw die bidt of profeteert met ongedekt hoofd, onteert haar eigen hoofd; want het is een en hetzelfde, alsof haar het haar afgesneden was.", "Jes 9:17": "Want de goddeloosheid brandt als vuur, doornen en distels zal zij verteren, en zal aansteken de verwarde struiken van het woud, die zich verheven hebben als de verheffing van de rook.", "1 Kor 14:35": "En als zij iets willen leren, laat hen thuis hun eigen mannen vragen; want het staat lelijk voor de vrouwen dat zij in de Gemeente spreken.", "Job 34:9": "Want hij heeft gezegd: Het baat een man niet, als hij welbehagen heeft aan God.", "Job 27:17": "Hij zal ze bereiden, maar de rechtvaardige zal ze aantrekken, en de onschuldige zal het zilver delen.", "Jer 25:12": "Maar het zal gebeuren, als de zeventig jaren vervuld zijn, dan zal Ik over de koning van Babel, en over dat volk, spreekt de HEERE, hun ongerechtigheid bezoeken, alsook over het land van de Chaldeeën, en zal dat stellen tot eeuwige verwoestingen.", "Spr 11:22": "Een mooie vrouw die geen verstand heeft, is een gouden ring in een varkenssnuit.", "Klaagl 1:7": "Zain. Jeruzalem is, in de dagen van haar ellende en haar veelvuldige ballingschap, indachtig geworden aan al haar gewenste dingen, die zij van oude dagen af gehad heeft; omdat haar volk door de hand van de tegenstander valt, en zij geen helper heeft; de tegenstanders zien haar aan, zij spotten met haar rustdagen.", "Amos 6:10": "En de naaste bloedverwant zal ieder van hen opnemen, degene die hem verbrandt, om de beenderen uit het huis naar buiten te brengen, en zal zeggen tegen hem die binnen in het huis is: Is er nog iemand bij u? En hij zal zeggen: Niemand. Dan zal hij zeggen: Zwijg! Want wij mogen de Naam van de HEERE niet noemen.", "1 Kor 3:12-15": "En als iemand op dit fundament bouwt: goud, zilver, kostbare stenen, hout, hooi, stoppels; Ieders werk zal openbaar worden; want de dag zal het aan het licht brengen, omdat het door vuur ontdekt wordt; en hoedanig ieders werk is, zal het vuur beproeven. Als iemands werk blijft, dat hij daarop gebouwd heeft, die zal loon ontvangen.", "Openb 19:2": "Want Zijn oordelen zijn waarachtig en rechtvaardig; omdat Hij de grote hoer geoordeeld heeft, die de aarde verdorven heeft met haar hoererij, en Hij het bloed van Zijn dienaren van haar hand gewroken heeft.", "2 Kor 10:5": "Waarbij wij de overleggingen neerwerpen, en alle hoogte die zich verheft tegen de kennis van God, en elke gedachte gevangennemen tot de gehoorzaamheid van Christus;", "Ps 58:4-6": "De goddelozen zijn vervreemd van de moederschoot af; de leugensprekers dolen van de moederbuik af. Zij hebben vurig gif, gelijk vurig slangengif; zij zijn als een dove adder, die zijn oren toestopt, opdat hij niet hoort naar de stem van de bezweerders, van hem die ervaren is in het uitvoeren van bezweringen.", "Jes 26:21": "Want zie, de HEERE zal uit Zijn plaats uitgaan, om de ongerechtigheid van de inwoners van de aarde over hen te bezoeken; en de aarde zal haar bloed onthullen, en zal haar gedoden niet langer bedekt houden.", "Matt 26:24": "De Zoon des mensen gaat wel heen, zoals over Hem geschreven is; maar wee die mens door wie de Zoon des mensen verraden wordt; het zou beter voor hem geweest zijn als die mens niet geboren was.", "Kol 2:8": "Kijk uit dat niemand u als een roof meesleept door de filosofie en loze verleiding, naar de overlevering van de mensen, naar de eerste beginselen van de wereld, en niet naar Christus;", "Spr 15:20": "Een wijze zoon verblijdt de vader; maar een dwaas mens veracht zijn moeder.", "Jer 22:4": "Want als u deze zaak ernstig zult doen, dan zullen door de poorten van dit huis koningen binnengaan, zittend op de troon van David, rijdend op wagens en op paarden, hij, en zijn dienaren, en zijn volk.", "Joh 8:21": "Jezus zei dan weer tegen hen: Ik ga heen, en u zult Mij zoeken, en in uw zonden zult u sterven; waar Ik heenga, kunt u niet komen.", "Ezech 16:50": "En zij verhieven zich, en deden gruwelijkheid voor Mijn aangezicht; daarom deed Ik ze weg, nadat Ik het gezien had.", "Openb 19:8": "En haar is gegeven dat zij bekleed wordt met rein en blinkend fijn linnen; want dit fijne linnen is de rechtvaardigmakingen van de heiligen.", "Jer 4:19-31": "O mijn binnenste, mijn binnenste! ik heb weeën, o wanden van mijn hart! Mijn hart maakt getier in mij, ik kan niet zwijgen; want u, mijn ziel! hoort het geluid van de bazuin en het krijgsgeschreeuw. Ondergang op ondergang wordt uitgeroepen; want het hele land is verwoest; haastig zijn mijn tenten verwoest, mijn gordijnen in een ogenblik! Hoe lang zal ik de banier zien, het geluid van de bazuin horen?", "2 Tim 2:14-18": "Breng deze dingen in gedachtenis, en houd hun voor, voor de Heere, dat zij geen woordenstrijd voeren, wat tot niets nut is, dan tot verderf van de toehoorders. Beijver u om uzelf voor God beproefd te tonen, als een arbeider die zich niet hoeft te schamen, die het Woord van de waarheid recht snijdt. Maar verzet u tegen het ongoddelijk ijdel geklets; want zij zullen in meerdere goddeloosheid toenemen.", "Ps 106:18": "En een vuur brandde onder hun groep, een vlam stak de goddelozen in brand.", "Spr 21:15": "Het is voor de rechtvaardige een blijdschap recht te doen; maar voor de werkers van de ongerechtigheid is het verschrikking.", "Luk 12:5": "Maar Ik zal u tonen voor wie u bang moet zijn: wees bang voor Hem, Die, nadat Hij gedood heeft, ook macht heeft om in de hel te werpen; ja, Ik zeg u, wees bang voor Hem!", "Jer 49:4": "Wat beroemt u zich op uw dalen? Uw dal is weggevloeid, u afkerige dochter! die op haar schatten vertrouwt en zegt: Wie zou tegen mij komen?", "Jer 50:29": "Laat u horen tegen Babel, u schutters! U allen die de boog spant! Leger u tegen haar rondom, laat niemand van hen ontkomen; vergeld haar naar haar werk, doe haar naar alles wat zij gedaan heeft; want zij heeft trots gehandeld tegen de HEERE, tegen de Heilige van Israël.", "Ps 32:10": "De goddeloze heeft veel smarten, maar wie op de HEERE vertrouwt, die zal de goedertierenheid omringen.", "Ps 11:6": "Hij zal op de goddelozen strikken doen regenen, vuur en zwavel; en een geweldige stormwind zal het deel van hun beker zijn.", "Ezech 13:1-23": "En het woord van de HEERE gebeurde tot mij, en zei: Mensenkind, profeteer tegen de profeten van Israël, die profeteren, en zeg tegen hen die uit hun eigen hart profeteren: Hoor het woord van de HEERE. Zo zegt de Heere HEERE: Wee over die dwaze profeten, die hun eigen geest nawandelen, en wat zij niet gezien hebben!", "Ps 144:11": "Bevrijd mij en red mij van de hand van vreemden, wier mond leugens spreekt, en wier rechterhand een rechterhand van bedrog is;", "1 Joh 4:1-3": "Geliefden, geloof niet elke geest, maar beproef de geesten, of zij uit God zijn; want veel valse profeten zijn uitgegaan in de wereld. Hieraan herkent u de Geest van God: elke geest die belijdt dat Jezus Christus in het vlees gekomen is, die is uit God; en elke geest die niet belijdt dat Jezus Christus in het vlees gekomen is, die is niet uit God; maar dit is de geest van de antichrist, waarvan u gehoord hebt dat hij komen zou, en die nu al in de wereld is.", "Ps 73:4-12": "Want er zijn geen boeien tot hun dood toe, en hun kracht is fris. Zij zijn niet in de moeite zoals andere mensen, en worden niet met andere mensen geplaagd. Daarom omringt hen de hoogmoed als een keten; het geweld bedekt hen als een gewaad.", "Job 18:3": "Waarom worden wij beschouwd als beesten, en zijn wij onrein in uw ogen?", "Ps 10:4": "De goddeloze zoekt God niet, zoals hij zijn neus omhoog steekt; al zijn gedachten zijn dat er geen God is.", "Matt 25:33": "En Hij zal de schapen aan Zijn rechterhand zetten, maar de bokken aan Zijn linkerhand.", "Jes 26:5": "Want Hij buigt de hooggezetenen neer, de verheven stad; Hij vernedert haar, Hij vernedert haar tot de aarde toe, Hij doet haar tot aan het stof reiken.", "Matt 23:33": "Slangen, addergebroed! Hoe zou u de helse verdoemenis ontvluchten?", "Openb 18:5": "Want haar zonden zijn de een na de ander gevolgd tot aan de hemel toe, en God is haar ongerechtigheden gaan gedenken.", "Micha 3:12": "Daarom, om uwentwil, zal Sion als een akker geploegd worden, en Jeruzalem zal tot steenhopen worden, en de berg van dit huis tot hoogten van een woud.", "Ps 5:6": "De onzinnigen zullen voor Uw ogen niet bestaan; U haat alle werkers van de ongerechtigheid.", "Job 34:23": "Zeker, Hij legt de mens niet te veel op, dat hij tegen God in het gericht zou mogen treden.", "Ps 10:11": "Hij zegt in zijn hart: God heeft het vergeten, Hij heeft Zijn aangezicht verborgen, Hij ziet het nooit.", "Hebr 2:2": "Want als het woord, dat door de engelen gesproken is, vast is geweest, en elke overtreding en ongehoorzaamheid rechtvaardige vergelding ontvangen heeft,", "Jer 23:21": "Ik heb die profeten niet gezonden, toch hebben zij gelopen; Ik heb tot hen niet gesproken, toch hebben zij geprofeteerd.", "Matt 10:14": "En als iemand u niet ontvangt, en uw woorden niet hoort, schudt dan bij het verlaten van dat huis of die stad het stof van uw voeten af.", "Job 34:17-19": "Zou Hij ook, Die het recht haat, de gewonde verbinden, en zou u de zeer Rechtvaardige veroordelen? Zou men tot een koning zeggen: U bent Belial; tot de vorsten: U bent goddelozen! Hoe dan tot Hem, Die het aangezicht van de vorsten niet aanneemt, en de rijke voor de arme niet kent? Want zij zijn allen het werk van Zijn handen.", "Amos 7:17": "Daarom zegt de HEERE zo: Uw vrouw zal in de stad hoereren, en uw zonen en uw dochters zullen door het zwaard vallen, en uw land zal met het meetsnoer verdeeld worden; en u zult in een onrein land sterven, en Israël zal zeker uit zijn land gevankelijk worden weggevoerd.", "Rom 16:18": "Want zulke mensen dienen onze Heere Jezus Christus niet, maar hun eigen buik; en zij verleiden door schoonspreken en prijzen de harten van de eenvoudigen.", "Job 15:26": "Hij loopt tegen Hem aan met de hals, met zijn dikke, hoog verheven schilden;", "1 Kon 20:28": "En de man van God trad toe, en sprak tegen de koning van Israël, en zei: Zo zegt de HEERE: Omdat de Syriërs gezegd hebben: De HEERE is een God van de bergen, en Hij is niet een God van de laagten; zo zal Ik al deze grote menigte in uw hand geven, opdat u weet, dat Ik de HEERE ben.", "Ps 55:24": "Maar U, o God! zult hen doen neerdalen in de put van het verderf; de mannen van het bloed en het bedrog zullen hun dagen niet tot de helft brengen; ik, daarentegen, zal op U vertrouwen.", "Gen 6:13": "Daarom zei God tegen Noach: Het einde van alle vlees is voor Mijn aangezicht gekomen; want de aarde is door hen vervuld met geweld; en zie, Ik zal hen met de aarde verderven.", "Hand 8:21": "U hebt geen deel en geen aandeel in dit woord, want uw hart is niet recht voor God.", "Ps 91:8": "Alleen zult u het met uw ogen aanschouwen; en u zult de vergelding van de goddelozen zien.", "Ps 10:2": "De goddeloze vervolgt in hoogmoed heftig de ellendige; laat hen gegrepen worden in de plannen die zij bedacht hebben.", "Rom 2:19-25": "En u vertrouwt van uzelf dat u een leidsman van de blinden bent, een licht van hen die in duisternis zijn, Een onderrichter van de onwijzen, en een leermeester van de onwetenden, terwijl u de vorm van de kennis en van de waarheid in de wet hebt. Die dan een ander leert, leert u uzelf niet? Die predikt dat men niet zal stelen, steelt u?", "Jak 2:9": "maar als u de persoon aanneemt, doet u zonde, en wordt u door de wet als overtreders bestraft.", "Joh 5:14": "Daarna vond Jezus hem in de tempel, en zei tegen hem: Zie, u bent gezond geworden; zondig niet meer, opdat u niet iets ergers overkomt.", "Lev 26:16-39": "Dan zal Ik u dit ook doen: Ik zal over u schrik stellen, tering en koorts, die de ogen verteren en de ziel pijnigen; u zult ook uw zaad tevergeefs zaaien, en uw vijanden zullen dat opeten. Daartoe zal Ik Mijn aangezicht tegen u zetten, zodat u geslagen zult worden voor het aangezicht van uw vijanden; en uw haters zullen over u heersen, en u zult vluchten, ook al vervolgt u niemand. En als u Mij ook na deze dingen niet zult horen, zal Ik nog daaraan toedoen, om u zevenvoudig over uw zonden te tuchtigen.", "Ezech 44:10": "Maar de Levieten die ver van Mij weggegaan zijn, toen Israël ging dolen, die van Mij zijn afgedwaald, hun drekgoden  achterna, zullen wel hun ongerechtigheid dragen;", "2 Kron 28:19": "Want de HEERE vernederde Juda, om Achaz, de koning van Israël; want hij had Juda losgelaten van de HEERE, zodat het geheel zwaar overtrad tegen de HEERE.", "Job 36:3": "Ik zal mijn kennis van verre ophalen, en mijn Schepper gerechtigheid toewijzen.", "Jer 19:9": "En Ik zal hun het vlees van hun zonen en het vlees van hun dochters doen eten, en zij zullen eten, ieder het vlees van zijn naaste, in de belegering en in de benauwing, waarmee hun vijanden, en zij die hun ziel zoeken, hen benauwen zullen.", "Ps 119:119": "U doet alle goddelozen van de aarde weg als schuim, daarom heb ik Uw getuigenissen lief.", "Jes 5:12": "En harp en luit, tamboerijn en fluit, en wijn zijn bij hun feesten; maar zij letten niet op het werk van de HEERE, en zij zien niet op het maaksel van Zijn handen.", "Ef 4:17": "Ik zeg dan dit, en betuig het in de Heere, dat u niet meer wandelt zoals de andere heidenen wandelen, in de zinloosheid van hun gemoed.", "Micha 2:11": "Als er iemand is die met wind omgaat en vals liegt, en zegt: Ik zal u profeteren van wijn en van sterke drank! dan is dat een profeet voor dit volk.", "Jer 3:3": "Daarom zijn de regendruppels ingehouden, en is er geen late regen geweest. Maar u hebt een hoerenvoorhoofd, u weigert schaamrood te worden.", "Jer 5:27": "Zoals een kooi vol is van vogels, zo zijn hun huizen vol van bedrog; daarom zijn zij groot en rijk geworden.", "Jes 14:30": "En de eerstgeborenen van de armen zullen weiden, en de behoeftigen zullen zeker neerliggen; uw wortel daarentegen zal Ik door de honger doden, en uw overblijfsel zal hij ombrengen.", "Jes 8:19": "Wanneer zij dan tegen u zeggen zullen: Vraag waarzeggers en duivelskunstenaars, die daar piepen en binnensmonds mompelen; zo zeg: Zal een volk niet zijn God vragen? Zal men voor de levenden de doden vragen?", "Spr 28:15": "De goddeloze, heersend over een arm volk, is een brullende leeuw, en een beer, die heen en weer rondloopt.", "Matt 24:26": "Als zij dan tegen u zullen zeggen: Kijk, hij is in de woestijn, ga er niet heen; Kijk, hij is in de binnenkamers, geloof het niet.", "Job 22:14": "De wolken zijn voor Hem een verberging, zodat Hij niet ziet; en Hij wandelt op de omgang van de hemel.", "Jes 56:10-12": "Hun wachters zijn allemaal blind, zij weten niets; zij zijn allemaal stomme honden, zij kunnen niet blaffen; zij zijn slaperig, zij liggen neer, zij hebben het sluimeren lief. En deze honden zijn sterk van begeerte, zij kunnen niet verzadigd worden, ja, het zijn herders die niets kunnen begrijpen; zij keren zich allemaal naar hun eigen weg, ieder naar zijn eigen winst, elk uit zijn eigen hoek. Kom hier, zeggen zij: ik zal wijn halen, en wij zullen ons vol drinken met sterke drank; en de dag van morgen zal zijn als deze, ja, nog groter, veel overvloediger.", "Kol 1:21": "En u, die eertijds vervreemd was en vijanden door het verstand in de boze werken, heeft Hij nu ook verzoend,", "Zach 1:6": "Nochtans Mijn woorden en Mijn inzettingen, die Ik Mijn knechten, de profeten, geboden had, hebben die uw vaders niet getroffen? Zodat zij terugkerend zeiden: Zoals de HEERE van de heerscharen Zich voorgenomen had ons te doen, naar onze wegen en naar onze daden, zo heeft Hij met ons gedaan.", "Ezech 9:4": "En de HEERE zei tot hem: Ga door, door het midden van de stad, door het midden van Jeruzalem, en zet een teken op de voorhoofden van de mensen die zuchten en uitroepen over al die gruwelen die in haar midden gedaan worden.", "Spr 30:22": "Om een knecht, als hij regeert; en een dwaas, als hij verzadigd is met brood;", "Deut 15:9-11": "Wacht ervoor dat er in uw hart geen verdorven gedachte is, om te zeggen: Het zevende jaar, het jaar van de vrijlating, komt dichtbij; zodat uw oog kwaadaardig is tegen uw broeder die arm is, en dat u hem niets geeft; en hij over u roept tot de HEERE, en er zonde in u is. U zult hem zeker geven, en uw hart zal niet kwaad zijn als u hem geeft; want om deze reden zal de HEERE, uw God, u zegenen in al uw werk, en in alles waar u uw hand aan slaat. Want de arme zal niet ophouden te bestaan in het land; daarom gebied ik u en zeg: U zult uw hand mild opendoen voor uw broeder, voor uw bedrukten en voor uw armen in uw land.", "Ps 97:2": "Rondom Hem zijn wolken en donkerheid, gerechtigheid en recht zijn de vastigheid van Zijn troon.", "2 Kon 2:23": "En hij ging vandaar op naar Beth-el. Toen hij nu de weg opging, kwamen er kleine jongens uit de stad; die bespotten hem, en zeiden tegen hem: Kaalkop, ga op, kaalkop, ga op!", "Ps 35:24": "Doe mij recht naar Uw gerechtigheid, HEERE, mijn God! En laat hen zich over mij niet verblijden.", "Jer 9:11": "En Ik zal Jeruzalem stellen tot steenhopen, tot een woning voor jakhalzen; en de steden van Juda zal Ik stellen tot een verwoesting, zonder inwoner.", "Rom 1:30": "kwaadsprekers, lasteraars, haters van God, smaders, hoogmoedigen, laatdunkende, vinders van kwade dingen, ongehoorzaam aan hun ouders;", "Jes 28:9": "Aan wie zou Hij dan de kennis leren, en aan wie zou Hij het gehoorde te verstaan geven? Aan hen die van de melk gespeend zijn, die van de borsten weggehaald zijn?", "Jes 57:21": "De goddelozen, zegt mijn God, hebben geen vrede.", "Hos 5:13": "Toen Efraïm zijn ziekte zag, en Juda zijn gezwel, ging Efraïm naar Assur, en hij stuurde iemand naar koning Jareb; maar die zal u niet kunnen genezen, en zal het gezwel van u niet helen.", "2 Kron 6:23": "Hoor U dan uit de hemel, en doe, en richt Uw knechten, door de goddeloze te vergelden en zijn weg op zijn hoofd te leggen, en door de rechtvaardige recht te doen en hem naar zijn gerechtigheid te geven.", "Jer 15:9": "Zij die zeven kinderen baarde, is zwak geworden; zij heeft haar ziel uitgeblazen, haar zon is ondergegaan, toen het nog dag was; zij is beschaamd en te schande geworden; en hun overblijfsel zal Ik aan het zwaard overgeven, voor het aangezicht van hun vijanden, spreekt de HEERE.", "Ezech 22:7": "Vader en moeder hebben zij in u licht geacht; met de vreemdeling hebben zij in uw midden door verdrukking gehandeld; zij hebben in u de wees en de weduwe verdrukt.", "Pred 7:17": "Wees niet al te goddeloos, en wees ook niet al te dwaas; waarom zou u sterven vóór uw tijd?", "Spr 31:10-31": "Aleph. Wie zal een deugdelijke huisvrouw vinden? Want haar waarde gaat ver boven de robijnen. Beth. Het hart van haar man vertrouwt op haar, zodat het hem aan geen goed zal ontbreken. Gimel. Zij doet hem goed en geen kwaad, al de dagen van haar leven.", "Deut 18:20-22": "Maar de profeet die hoogmoedig handelt door een woord te spreken in Mijn Naam, dat Ik hem niet geboden heb te spreken, of die zal spreken in de naam van andere goden, die profeet zal sterven. Als u dan in uw hart zou zeggen: Hoe zullen wij het woord kennen dat de HEERE niet gesproken heeft? Wanneer die profeet in de Naam van de HEERE gesproken heeft, en dat woord gebeurt niet en komt niet uit, dan is dat het woord dat de HEERE niet gesproken heeft; door trots heeft die profeet dat gesproken; u hoeft niet bevreesd voor hem te zijn.", "Jes 1:23": "Uw vorsten zijn afvalligen, en metgezellen van dieven, ieder van hen heeft geschenken lief, en zij jagen de vergeldingen na; de wezen doen zij geen recht, en de rechtszaak van de weduwen komt voor hen niet.", "Jes 40:23": "Die de vorsten teniet maakt; de rechters van de aarde maakt Hij tot ijdelheid.", "1 Sam 2:3-5": "Maak het niet te veel, dat u hoog, hoog zou spreken, dat iets hards uit uw mond zou gaan; want de HEERE is een God van wetenschappen, en Zijn daden zijn recht gedaan. De boog van de sterken is gebroken; en zij die struikelden, zijn met sterkte omgord. Zij die verzadigd waren, hebben zich verhuurd om brood, en zij die hongerig waren, hebben opgehouden; totdat de onvruchtbare zeven heeft gebaard, en zij die veel kinderen had, krachteloos is geworden.", "Jer 8:11": "En zij genezen de breuk van de dochter van Mijn volk op het lichtste, en zeggen: Vrede, vrede! Terwijl er geen vrede is.", "Ezech 11:21": "Maar van hen wier hart het hart van hun verfoeiselen en hun gruwelen navolgt, zal Ik de weg daarvan op hun hoofd geven, spreekt de Heere HEERE.", "1 Kon 12:31": "Hij maakte ook een huis der hoogten; en maakte priesters van de geringste mensen van het volk, die niet uit de zonen van Levi waren.", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "Deut 7:10": "En Hij vergeldt ieder van hen die Hem haten, in zijn aangezicht, om hem te verderven; Hij zal het voor wie Hem haat niet uitstellen, in zijn aangezicht zal Hij het hem vergelden.", "Job 22:5": "Is uw boosheid niet groot, en is er geen einde aan uw ongerechtigheden?", "Ps 59:8": "Zie, zij storten overvloedig uit met hun mond; zwaarden zijn op hun lippen; want wie hoort het?", "Deut 6:3": "Hoor dan, Israël! en let erop dat u ze doet, opdat het u goed gaat, en opdat u zeer vermenigvuldigt (zoals de HEERE, de God van uw vaderen, u gesproken heeft) in het land, dat overvloeit van melk en honing.", "Spr 12:7": "De goddelozen worden omgekeerd, zodat zij niet meer zijn; maar het huis van de rechtvaardigen zal bestaan.", "Jer 14:10": "Zo zegt de HEERE van dit volk: Zij hebben zo liefgehad om te zwerven, zij hebben hun voeten niet bedwongen; daarom heeft de HEERE geen welgevallen aan hen, nu zal Hij aan hun ongerechtigheden denken, en hun zonden bezoeken.", "Jes 5:16": "Doch de HEERE van de heerscharen zal verhoogd worden door het recht; en God, die Heilige, zal geheiligd worden door gerechtigheid.", "Openb 18:9": "En de koningen van de aarde, die met haar gehoereerd en in weelde geleefd hebben, zullen haar bewenen, en rouw over haar bedrijven, wanneer zij de rook van haar brand zullen zien;", "Mark 12:38": "En Hij zei tegen hen in Zijn onderwijs: Pas op voor de Schriftgeleerden, die graag in lange kleren willen rondlopen, en gegroet willen worden op de markten;", "Ps 94:7-9": "En zeggen: De HEERE ziet het niet, en de God van Jakob merkt het niet. Let op, u onverstandigen onder het volk! En u dwazen! Wanneer zult u verstandig worden? Zou Hij, Die het oor plant, niet horen? Zou Hij, Die het oog vormt, niet zien?", "Lev 13:44": "Is die man melaats, hij is onrein; de priester zal hem helemaal onrein verklaren, zijn plaag is op zijn hoofd.", "Jes 47:11": "Daarom zal er over u een kwaad komen, u zult de dageraad daarvan niet weten; en een verderf zal er op u vallen, dat u niet zult kunnen verzoenen; want er zal snel een onstuimige verwoesting over u komen, zodat u het niet weten zult.", "Jes 4:4": "wanneer de Heere de drek van de dochters van Sion zal hebben afgewassen, en de bloedschuld van Jeruzalem uit haar midden zal hebben verdreven, door de Geest van het oordeel en door de Geest van de uitbranding.", "Ps 119:78": "Laat de hoogmoedigen beschaamd worden, omdat zij mij met leugen neergestoten hebben; doch ik betracht Uw geboden.", "Jes 64:5-7": "U ontmoet de vrolijke, en die gerechtigheid doet, hun die aan U denken op Uw wegen; zie, U was verbolgen, omdat wij gezondigd hebben; daarin is de eeuwigheid, opdat wij behouden werden. Doch wij allen zijn als een onreine, en al onze gerechtigheden zijn als een wegwerpkleed; en wij allen vallen af als een blad, en onze misdaden voeren ons weg als een wind. En er is niemand, die Uw Naam aanroept, die zichzelf opwekt, dat hij U aangrijpt; want U verbergt Uw aangezicht voor ons, en U doet ons smelten, door middel van onze ongerechtigheden.", "Jes 30:1": "Wee de kinderen die afvallen, spreekt de HEERE, om een raadslag te maken, maar niet uit Mij, en om zich met een bedekking te bedekken, maar niet uit Mijn Geest, om zonde tot zonde te doen;", "1 Kor 5:2": "En u bent nog opgeblazen, en hebt niet veel meer verdriet gehad, zodat hij die deze daad begaan heeft, uit uw midden weggedaan zou worden?", "Ps 71:19": "Ook is Uw gerechtigheid, o God, tot in de hoogte; Gij, Die grote dingen gedaan hebt; o God! wie is U gelijk?", "Ps 64:8": "Maar God zal hen haastig met een pijl schieten; hun plagen zijn er.", "Jer 5:14": "Daarom zegt de HEERE, de God van de heerscharen, zo, omdat u dit woord spreekt: Zie, Ik zal Mijn woorden in uw mond tot vuur maken, en dit volk tot hout, en het zal hen verteren.", "Spr 28:24": "Wie zijn vader of zijn moeder berooft, en zegt: Het is geen overtreding; die is de metgezel van een verwoestend man.", "Ef 2:1-3": "En u heeft Hij mede levend gemaakt, terwijl u dood was door de misdaden en de zonden; waarin u eertijds gewandeld hebt, naar de eeuw van deze wereld, naar de leider van de macht van de lucht, van de geest die nu werkt in de kinderen van de ongehoorzaamheid; onder wie ook wij allen eertijds verkeerd hebben, in de begeerten van ons vlees, terwijl wij deden de wil van het vlees en van de gedachten; en wij waren van nature kinderen van de toorn, net als ook de anderen;", "Jer 50:31": "Zie, Ik wil tegen u, u trotse! spreekt de Heere, de HEERE van de heerscharen; want uw dag is gekomen, de tijd dat Ik u bezoeken zal.", "Openb 20:10": "En de duivel, die hen verleidde, werd geworpen in de poel van het vuur en sulfer, waar het beest en de valse profeet zijn; en zij zullen gepijnigd worden dag en nacht in alle eeuwigheid.", "Gen 6:7": "En de HEERE zei: Ik zal de mens, die Ik geschapen heb, wegvagen van de aardbodem, van de mens tot het vee, tot het kruipend gedierte, en tot het gevogelte van de hemel toe; want het berouwt Mij dat Ik hen gemaakt heb.", "Neh 5:7-9": "En mijn hart beraadslaagde in mij; daarna berispte ik de edelen en de overheden, en zei tegen hen: U vordert een last, ieder van zijn broeder. Vervolgens riep ik een grote vergadering tegen hen bijeen. En ik zei tegen hen: Wij hebben onze broeders, de Joden, die aan de heidenen verkocht waren, naar ons vermogen teruggekocht; en zouden u ook uw broeders verkopen, of zouden zij aan ons verkocht worden? Toen zwegen zij en vonden geen antwoord. Verder zei ik: De zaak die u doet, is niet goed; zou u niet wandelen in de vreze van onze God, om de smaad van de heidenen, onze vijanden?", "Jes 2:13-15": "En tegen alle hoge en verhevene ceders van Libanon, en tegen alle eiken van Basan; En tegen alle hoge bergen, en tegen alle verheven heuvels; En tegen elke hoge toren, en tegen elke versterkte muur;", "Job 12:2": "Trouwens, omdat u het volk bent, zal de wijsheid met u sterven!", "Mark 10:21": "En Jezus keek hem aan en had hem lief, en zei tegen hem: Eén ding ontbreekt u; ga heen, verkoop alles wat u hebt, en geef het aan de armen, en u zult een schat hebben in de hemel; en kom, neem het kruis op, en volg Mij.", "Ps 53:2": "De dwaas zegt in zijn hart: Er is geen God; zij verderven het, en zij bedrijven gruwelijk onrecht; er is niemand die goed doet.", "Amos 9:10": "Alle zondaars van Mijn volk zullen door het zwaard sterven; zij die zeggen: Het kwaad zal ons niet naderen, en ons niet treffen.", "Luk 13:24": "Strijd om binnen te gaan door de nauwe poort; want velen, zeg Ik u, zullen zoeken binnen te gaan en zullen dat niet kunnen;", "Luk 1:51": "Hij heeft een krachtig werk gedaan met Zijn arm; Hij heeft de hoogmoedigen verstrooid in de gedachten van hun hart.", "Luk 17:1": "En Hij zei tegen de discipelen: Het kan niet anders, dan dat er ergernissen komen; maar wee hem, door wie ze komen.", "Hoogl 5:14": "Zijn handen zijn als gouden ringen, gevuld met turkoois; Zijn buik is als blinkend ivoor, overtrokken met saffieren.", "Spr 13:1": "Een wijze zoon hoort de tucht van de vader; maar een spotter hoort de bestraffing niet.", "Ps 50:22": "Verstaat dit toch, u die God vergeet! opdat Ik niet verscheur en niemand redt.", "1 Tess 5:3": "Want wanneer zij zullen zeggen: Het is vrede en veilig; dan zal een plotseling verderf hun overkomen, zoals de barensweeën een zwangere vrouw overkomen; en zij zullen het geenszins ontvluchten;", "Gen 4:7": "Is het niet zo: als u goed doet, wordt u aanvaard? En als u niet goed doet, ligt de zonde aan de deur. Naar u gaat zijn begeerte uit, en u zult over hem heersen.", "Ps 145:15": "Ain. Aller ogen wachten op U; en U geeft hun hun voedsel op de juiste tijd.", "Jes 6:11": "Toen zei ik: Hoe lang, Heere? En Hij zei: Totdat de steden verwoest worden, zodat er geen inwoner meer is, en de huizen, zodat er geen mens meer is, en het land met verwoesting verstrooid wordt.", "Job 27:8-23": "Want wat is de verwachting van de huichelaar, als hij gierig geweest zal zijn, wanneer God zijn ziel zal uittrekken? Zal God zijn geroep horen, als benauwdheid over hem komt? Zal hij zich verlustigen in de Almachtige? Zal hij God aanroepen te aller tijd?", "Ezech 22:26": "Haar priesters doen Mijn wet geweld aan, en zij ontheiligen Mijn heilige dingen; tussen het heilige en het onheilige maken zij geen onderscheid, en het verschil tussen het onreine en het reine geven zij niet te kennen; daarbij verbergen zij hun ogen voor Mijn sabbatten; ja, Ik word in hun midden ontheiligd.", "Luk 21:8": "En Hij zei: Kijkt uit, dat u niet verleid wordt; want velen zullen komen onder Mijn Naam, en zeggen: Ik ben de Christus; en de tijd is nabij gekomen. Ga hen dan niet na.", "1 Kor 8:2": "En als iemand meent iets te weten, die heeft nog niets gekend, zoals men behoort te kennen.", "Ps 68:2": "God zal opstaan, Zijn vijanden zullen verstrooid worden, en Zij die Hem haten zullen van Zijn aangezicht vluchten.", "Jer 26:6": "Zo zal Ik dit huis stellen als Silo, en deze stad zal Ik stellen tot een vloek voor alle volken van de aarde.", "Openb 2:14": "Maar Ik heb enkele weinige dingen tegen u, dat u daar mensen hebt die de leer van Balaäm vasthouden, die Balak leerde de kinderen van Israël een aanstoot voor te werpen, opdat zij afgodenoffer zouden eten en hoereren.", "Matt 5:19-30": "Wie dan een van deze minste geboden afschaft, en de mensen zo leert, die zal de minste genoemd worden in het Koninkrijk der hemelen; maar wie ze doet en leert, die zal groot genoemd worden in het Koninkrijk der hemelen. Want Ik zeg u: als uw gerechtigheid niet overvloediger is dan die van de Schriftgeleerden en de Farizeeën, zult u het Koninkrijk der hemelen beslist niet binnengaan. U hebt gehoord dat tot de ouden gezegd is: U zult niet doden; en wie doodt, die zal strafbaar zijn voor het gericht.", "Matt 7:27": "En de slagregen is neergevallen, en de waterstromen zijn gekomen, en de winden hebben gewaaid en zijn tegen dat huis aangeslagen, en het is gevallen, en zijn val was groot.", "Dan 8:25": "En door zijn sluwheid zal hij de bedrieglijkheid doen slagen in zijn hand; en hij zal zich in zijn hart verheffen; en in een tijd van schijnbare rust zal hij velen te gronde richten, en hij zal opstaan tegen de Vorst der vorsten, maar hij zal gebroken worden, zonder mensenhand.", "Ex 32:33-35": "Toen zei de HEERE tegen Mozes: Wie tegen Mij zondigt, die zal Ik uit Mijn boek delgen. Ga nu heen, leid dit volk naar waar Ik u gezegd heb; zie, Mijn Engel zal voor u uit gaan! Maar op de dag van het bezoeken zal Ik hun zonde over hen bezoeken! Zo trof de HEERE dit volk met een plaag, omdat zij dat kalf gemaakt hadden, dat Aäron gemaakt had.", "Jer 50:6": "Mijn volk waren verloren schapen, hun herders hadden hen verleid, zij hadden hen naar de bergen gevoerd, zij gingen van berg tot heuvel, zij vergaten hun rustplaats.", "Matt 7:15": "Maar wacht u voor de valse profeten, die in schaapskleren naar u toe komen, maar van binnen zijn het roofzuchtige wolven.", "1 Tim 2:10": "maar (wat past bij vrouwen die de godsvrucht belijden) door goede werken.", "Ps 103:5": "Die uw mond verzadigt met het goede, uw jeugd vernieuwt als die van een arend.", "Ezech 33:27": "Zo zult u tegen hen zeggen: Zo zegt de Heere HEERE: Zo waarachtig als Ik leef, wie in die verwoeste plaatsen zijn, zullen door het zwaard vallen, en wie op het open veld is, die zal Ik aan het wilde gedierte overgeven om hem te verslinden, en wie in de vestingen en in de holen zijn, zullen door de pest sterven!", "1 Joh 2:18": "Kinderen, het is het laatste uur; en zoals u gehoord hebt, dat de antichrist komt, zo zijn er nu ook al veel antichristen gekomen; waaraan wij weten, dat het het laatste uur is.", "Amos 3:2": "Uit alle geslachten van de aardbodem heb Ik u alleen gekend; daarom zal Ik al uw ongerechtigheden over u bezoeken.", "Dan 7:10": "Een vurige rivier vloeide, en ging voor Hem uit, duizendmaal duizenden dienden Hem, en tien duizendmaal tien duizenden stonden voor Hem; het gericht zette zich, en de boeken werden geopend.", "Openb 2:25-28": "Maar wat u hebt, houd dat vast, totdat Ik zal komen. En wie overwint, en Mijn werken tot het einde toe bewaart, hem zal Ik macht geven over de heidenen; En hij zal hen hoeden met een ijzeren staf; zij zullen als pottenbakkersvaten vermorzeld worden; zoals ook Ik van Mijn Vader ontvangen heb.", "Jes 2:22": "Laat u dan af van de mens, wiens adem in zijn neus is, want waarin is hij te achten?", "Amos 6:12": "Zullen paarden ook rennen op een steenrots? Zal men daarop ook met runderen ploegen? Want u hebt het recht in gal veranderd, en de vrucht van de gerechtigheid in alsem.", "Jer 48:37": "Want alle hoofden zijn kaal, en alle baarden afgeknipt; op alle handen zijn insnijdingen, en op de lenden is een rouwkleed.", "Gen 18:20": "Verder zei de HEERE: Omdat het geroep van Sodom en Gomorra groot is, en omdat hun zonde zeer zwaar is,", "Jer 9:24": "Maar wie zich beroemt, beroemt zich hierin, dat hij begrijpt, en Mij kent, dat Ik de HEERE ben, Die weldadigheid, recht en gerechtigheid doe op de aarde, want in die dingen heb Ik behagen, spreekt de HEERE.", "Micha 3:11": "Haar hoofden rechtspreken om geschenken, en haar priesters leren om loon, en haar profeten waarzeggen om geld; nog steunen zij op de HEERE, en zeggen: Is de HEERE niet in ons midden? Ons zal geen kwaad overkomen.", "Jer 8:12-14": "Zijn zij beschaamd, omdat zij gruwel bedreven hebben? Nee, zij schamen zich in het geheel niet, en weten niet hoe ze schaamrood moeten worden; daarom zullen zij vallen onder de vallende; ten tijde van hun bezoeking zullen zij struikelen, zegt de HEERE. Ik zal hen voorzeker wegrapen, spreekt de HEERE; er zijn geen druiven aan de wijnstok, en geen vijgen aan de vijgenboom, ja, het blad is afgevallen; en de geboden die Ik hun gegeven heb, die overtreden zij. Waarom blijven wij zitten? Verzamel u, en laat ons ingaan in de versterkte steden, en daar stilzwijgen; zeker heeft de HEERE, onze God, ons doen stilzwijgen, en ons met gallewater gedrenkt, omdat wij tegen de HEERE gezondigd hebben.", "Jes 5:18": "Wee hun die de ongerechtigheid trekken met koorden van ijdelheid, en de zonde als met dikke wagentouwen!", "Jes 44:20": "Hij voedt zich met as, het bedrogen hart heeft hem terzijde afgeleid; zodat hij zijn ziel niet redden kan, en ook niet kan zeggen: Is er niet een leugen in mijn rechterhand?", "Amos 5:16": "Daarom, zo zegt de HEERE, de God van de heerscharen, de Heere: Op alle straten zal rouwklacht zijn, en in alle wijken zullen zij zeggen: Och! Och! en zij zullen de landbouwer roepen om te treuren, en rouwklacht zal zijn bij hen die verstand van klagen hebben.", "Ex 20:5": "U zult zich daarvoor niet buigen, en ze niet dienen; want Ik, de HEERE, uw God, ben een ijverig God, Die de misdaad van de vaders bezoek aan de kinderen, aan het derde en aan het vierde geslacht van hen die Mij haten;", "Gal 6:7": "Dwaal niet; God laat Zich niet bespotten; want wat de mens ook zaait, dat zal hij ook maaien.", "Gal 5:10": "Ik vertrouw van u in de Heere, dat u niet anders zult denken; maar wie u in verwarring brengt, zal het oordeel dragen, wie hij ook is.", "Jes 26:11": "HEERE, is Uw hand verhoogd, zij zien het niet; maar zij zullen het zien, en beschaamd worden, vanwege de ijver over Uw volk, ook zal het vuur Uw tegenstanders verteren.", "Luk 11:15": "Maar sommigen van hen zeiden: Hij drijft de demonen uit door Beëlzebul, de leider van de demonen.", "Jes 26:10": "Wordt de goddeloze genade bewezen, dan leert hij toch geen gerechtigheid; hij doet onrecht in een geheel rechtvaardig land, en hij ziet de hoogheid van de HEERE niet aan.", "Ps 52:3-6": "Wat beroemt u zich in het kwaad, o u geweldige? Gods goedertierenheid duurt toch de hele dag. Uw tong denkt enkel schade uit, als een geslepen scheermes, en werkt bedrog. U hebt het kwade liever dan het goede, de leugen liever dan gerechtigheid te spreken. Sela.", "Hos 13:1": "Toen Efraïm sprak, beefde men; hij heeft zich verheven in Israël; maar hij is schuldig geworden aan de Baäl en is gestorven.", "Spr 28:3": "Een arme man, die de geringen verdrukt, is een wegvagende regen, zodat er geen brood is.", "Spr 28:11": "Een rijk man is wijs in zijn eigen ogen; maar de arme, die verstandig is, doorziet hem.", "Rom 12:16": "Wees eensgezind onder elkaar. Streef niet naar de hoge dingen, maar voeg u naar het nederige. Wees niet wijs bij uzelf.", "Mal 1:7": "U brengt op Mijn altaar verontreinigd brood, en zegt: Waarmee verontreinigen wij U? Daarmee, dat u zegt: De tafel van de HEERE is verachtelijk.", "Hebr 10:29": "hoeveel zwaarder straf, denkt u, zal hij waard geacht worden, die de Zoon van God met voeten heeft getreden, en het bloed van het testament, waardoor hij geheiligd was, als onrein heeft beschouwd, en de Geest van de genade smaad heeft aangedaan?", "1 Joh 3:10": "Hierin zijn de kinderen van God en de kinderen van de duivel openbaar. Ieder die de rechtvaardigheid niet doet, is niet uit God; en ook wie zijn broeder niet liefheeft,", "Jer 37:21": "Toen gaf koning Zedekia bevel, en zij brachten Jeremia onder in het voorhof van de gevangenis, en men gaf hem dagelijks een bol brood uit de Bakkerstraat, totdat al het brood van de stad op was. Zo bleef Jeremia in het voorhof van de gevangenis.", "Job 24:7-10": "De naakten laten zij overnachten zonder kleding, die geen bedekking hebben tegen de koude. Van de stromen op de bergen worden zij nat, en zonder toevlucht omhelzen zij de rotsen. Zij rukken het weesje van de borst, en wat de arme toebehoort, nemen zij te pand.", "Richt 9:14": "Toen zeiden alle bomen tegen de doornstruik: Kom u, wees koning over ons.", "Ps 18:26": "Bij de goedertierene houdt U Zich goedertieren, bij de oprechte man houdt U Zich oprecht.", "Pred 8:13": "Maar de goddeloze zal het niet goed gaan, en hij zal zijn dagen niet verlengen; hij zal zijn als een schaduw, omdat hij niet vreest voor het aangezicht van God.", "Lev 13:6-8": "En de priester zal hem opnieuw op de zevende dag bekijken; indien, zie, de plaag ingetrokken is, en de plaag in het vel niet uitgespreid is, zal de priester hem rein verklaren; het was een verzwering; en hij zal zijn kleren wassen, zo is hij rein. Maar als de verzwering in het vel helemaal uitgespreid is, nadat hij aan de priester tot zijn reiniging vertoond is, zal hij opnieuw aan de priester vertoond worden. Indien de priester zal merken, dat, zie, de verzwering in het vel uitgespreid is, zal de priester hem onrein verklaren; het is melaatsheid.", "Joël 2:1": "Waait op de bazuin te Sion, en roept luide op de berg van Mijn heiligheid; laat alle inwoners van het land beroerd zijn, want de dag van de HEERE komt, want hij is nabij.", "Spr 30:8": "Ijdelheid en leugentaal, doe die ver van mij; armoede of rijkdom, geef mij niet; voed mij met het brood dat mij toebedeeld is;", "Job 24:2-7": "Zij verzetten de landpalen; de kudden roven zij, en weiden ze. De ezel van de wezen drijven zij weg; de os van een weduwe nemen zij te pand. Zij doen de behoeftigen wijken van de weg; samen verstoppen zich de ellendigen van het land.", "Openb 18:8": "Daarom zullen haar plagen op één dag komen, namelijk dood, en rouw, en honger, en zij zal met vuur verbrand worden; want sterk is de Heere God, Die haar oordeelt.", "Mark 13:21": "En dan, als iemand tegen u zal zeggen: Zie, hier is de Christus; of: Zie, Hij is daar; geloof het niet.", "Spr 25:24": "Het is beter te wonen op een hoek van het dak, dan met een twistzieke huisvrouw, en dat in een huis vol gezelschap.", "Spr 15:5": "Een dwaas zal de tucht van zijn vader versmaden; maar wie de bestraffing ter harte neemt, zal kloekzinnig handelen.", "1 Tim 4:7": "Maar wijs de ongoddelijke en oudwijfse verzinsels af; oefen uzelf in plaats daarvan in godvruchtigheid.", "Luk 19:27": "Maar breng die vijanden van mij, die niet wilden dat ik koning over hen zou zijn, hier, en dood ze hier voor mij.", "Jes 28:10": "Want het is gebod op gebod, gebod op gebod, regel op regel, regel op regel, hier een weinig, daar een weinig.", "Spr 28:7": "Wie de wet bewaart, is een verstandige zoon; maar wie een metgezel van vraten is, beschaamt zijn vader.", "Spr 30:11": "Er is een geslacht dat zijn vader vervloekt, en zijn moeder niet zegent;", "Spr 16:2": "Alle wegen van een man zijn zuiver in zijn eigen ogen; maar de HEERE weegt de geesten.", "Jes 23:9": "De HEERE van de heerscharen heeft het besloten, om de hoogmoed van alle luister te ontheiligen, om alle heerlijksten van de aarde verachtelijk te maken.", "Pred 8:11": "Omdat het oordeel over de boze
