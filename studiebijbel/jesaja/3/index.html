-l=\"L1\" data-code=\"H6607\">poorten</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H578\">zullen</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H578\">treuren</span>, <span class=\"wl\" data-l=\"L3\" data-code=\"H56\">en</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H56\">leed</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H56\">dragen</span>, <span class=\"wl\" data-l=\"L4\" data-code=\"H5352\">en</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H5352\">zij</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H5352\">zal</span>, leeggemaakt, op <span class=\"wl\" data-l=\"L5\" data-code=\"H776\">de</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H776\">aarde</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H3427\">zitten</span>."}, "koppeling_kjv": {"1": "For, behold, the <span class=\"wl wl-kjv\" data-code=\"H113\">Lord,</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> doth take <span class=\"wl wl-kjv\" data-code=\"H5493\">away</span> from <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> and from <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> the <span class=\"wl wl-kjv\" data-code=\"H4937\">stay</span> and the <span class=\"wl wl-kjv\" data-code=\"H4938\">staff,</span> the whole <span class=\"wl wl-kjv\" data-code=\"H4937\">stay</span> of <span class=\"wl wl-kjv\" data-code=\"H3899\">bread,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3605\">whole</span> <span class=\"wl wl-kjv\" data-code=\"H4937\">stay</span> of water,", "2": "The mighty <span class=\"wl wl-kjv\" data-code=\"H1368\">man,</span> and the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H4421\">war,</span> the <span class=\"wl wl-kjv\" data-code=\"H8199\">judge,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7080\">prudent,</span> and the ancient,", "3": "The <span class=\"wl wl-kjv\" data-code=\"H8269\">captain</span> of <span class=\"wl wl-kjv\" data-code=\"H2572\">fifty,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5375\">honourable</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">man,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3289\">counsellor,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2450\">cunning</span> <span class=\"wl wl-kjv\" data-code=\"H2791\">artificer,</span> and the <span class=\"wl wl-kjv\" data-code=\"H995\">eloquent</span> orator.", "4": "And I will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> <span class=\"wl wl-kjv\" data-code=\"H5288\">children</span> to be their <span class=\"wl wl-kjv\" data-code=\"H8269\">princes,</span> and <span class=\"wl wl-kjv\" data-code=\"H8586\">babes</span> shall rule", "5": "And the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> shall be <span class=\"wl wl-kjv\" data-code=\"H5065\">oppressed,</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> by <span class=\"wl wl-kjv\" data-code=\"H376\">another,</span> and every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> by his <span class=\"wl wl-kjv\" data-code=\"H7453\">neighbour:</span> the <span class=\"wl wl-kjv\" data-code=\"H5288\">child</span> shall behave himself <span class=\"wl wl-kjv\" data-code=\"H7292\">proudly</span> against the <span class=\"wl wl-kjv\" data-code=\"H2205\">ancient,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7034\">base</span> against the honourable.", "6": "When a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> shall take <span class=\"wl wl-kjv\" data-code=\"H8610\">hold</span> of his <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of his <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> saying, Thou hast <span class=\"wl wl-kjv\" data-code=\"H8071\">clothing,</span> be thou our <span class=\"wl wl-kjv\" data-code=\"H7101\">ruler,</span> and let this <span class=\"wl wl-kjv\" data-code=\"H4384\">ruin</span> be under thy hand:", "7": "In that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> shall he <span class=\"wl wl-kjv\" data-code=\"H5375\">swear,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> I will not be an <span class=\"wl wl-kjv\" data-code=\"H2280\">healer;</span> for in my <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> is neither <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> nor <span class=\"wl wl-kjv\" data-code=\"H8071\">clothing:</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">make</span> me not a <span class=\"wl wl-kjv\" data-code=\"H7101\">ruler</span> of the people.", "8": "For <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> is <span class=\"wl wl-kjv\" data-code=\"H3782\">ruined,</span> and <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> is <span class=\"wl wl-kjv\" data-code=\"H5307\">fallen:</span> because their <span class=\"wl wl-kjv\" data-code=\"H3956\">tongue</span> and their <span class=\"wl wl-kjv\" data-code=\"H4611\">doings</span> are against the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> to <span class=\"wl wl-kjv\" data-code=\"H4784\">provoke</span> the <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> of his glory.", "9": "The <span class=\"wl wl-kjv\" data-code=\"H1971\">shew</span> of their <span class=\"wl wl-kjv\" data-code=\"H6440\">countenance</span> doth witness against <span class=\"wl wl-kjv\" data-code=\"H6030\">them;</span> and they <span class=\"wl wl-kjv\" data-code=\"H5046\">declare</span> their <span class=\"wl wl-kjv\" data-code=\"H2403\">sin</span> as <span class=\"wl wl-kjv\" data-code=\"H5467\">Sodom,</span> they <span class=\"wl wl-kjv\" data-code=\"H3582\">hide</span> it not. <span class=\"wl wl-kjv\" data-code=\"H188\">Woe</span> unto their <span class=\"wl wl-kjv\" data-code=\"H5315\">soul!</span> for they have <span class=\"wl wl-kjv\" data-code=\"H1580\">rewarded</span> evil", "10": "<span class=\"wl wl-kjv\" data-code=\"H559\">Say</span> ye to the <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous,</span> that it shall be <span class=\"wl wl-kjv\" data-code=\"H2896\">well</span> with him: for they shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> the <span class=\"wl wl-kjv\" data-code=\"H6529\">fruit</span> of their doings.", "11": "<span class=\"wl wl-kjv\" data-code=\"H188\">Woe</span> unto the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked!</span> it shall be <span class=\"wl wl-kjv\" data-code=\"H7451\">ill</span> with him: for the <span class=\"wl wl-kjv\" data-code=\"H1576\">reward</span> of his <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> shall be given", "12": "As for my <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> <span class=\"wl wl-kjv\" data-code=\"H5953\">children</span> are their <span class=\"wl wl-kjv\" data-code=\"H5065\">oppressors,</span> and <span class=\"wl wl-kjv\" data-code=\"H802\">women</span> <span class=\"wl wl-kjv\" data-code=\"H4910\">rule</span> over them. O my <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> they which <span class=\"wl wl-kjv\" data-code=\"H833\">lead</span> thee cause thee to <span class=\"wl wl-kjv\" data-code=\"H8582\">err,</span> and <span class=\"wl wl-kjv\" data-code=\"H1104\">destroy</span> the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of thy paths.", "13": "The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> standeth <span class=\"wl wl-kjv\" data-code=\"H5324\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H7378\">plead,</span> and <span class=\"wl wl-kjv\" data-code=\"H5975\">standeth</span> to <span class=\"wl wl-kjv\" data-code=\"H1777\">judge</span> the people.", "14": "The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will <span class=\"wl wl-kjv\" data-code=\"H935\">enter</span> into <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment</span> with the <span class=\"wl wl-kjv\" data-code=\"H2205\">ancients</span> of his <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> thereof: for ye have eaten <span class=\"wl wl-kjv\" data-code=\"H1197\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyard;</span> the <span class=\"wl wl-kjv\" data-code=\"H1500\">spoil</span> of the <span class=\"wl wl-kjv\" data-code=\"H6041\">poor</span> is in your houses.", "15": "What mean ye that ye <span class=\"wl wl-kjv\" data-code=\"H1792\">beat</span> my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> to <span class=\"wl wl-kjv\" data-code=\"H1792\">pieces,</span> and <span class=\"wl wl-kjv\" data-code=\"H2912\">grind</span> the <span class=\"wl wl-kjv\" data-code=\"H6440\">faces</span> of the <span class=\"wl wl-kjv\" data-code=\"H6041\">poor?</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD</span> of hosts.", "16": "Moreover the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saith,</span> <span class=\"wl wl-kjv\" data-code=\"H3282\">Because</span> the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> of <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion</span> are <span class=\"wl wl-kjv\" data-code=\"H1361\">haughty,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">walk</span> with stretched <span class=\"wl wl-kjv\" data-code=\"H5186\">forth</span> <span class=\"wl wl-kjv\" data-code=\"H1627\">necks</span> and <span class=\"wl wl-kjv\" data-code=\"H8265\">wanton</span> <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">walking</span> and <span class=\"wl wl-kjv\" data-code=\"H2952\">mincing</span> as they <span class=\"wl wl-kjv\" data-code=\"H3212\">go,</span> and making a <span class=\"wl wl-kjv\" data-code=\"H5913\">tinkling</span> with their feet:", "17": "Therefore the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> will smite with a <span class=\"wl wl-kjv\" data-code=\"H5596\">scab</span> the crown of the <span class=\"wl wl-kjv\" data-code=\"H6936\">head</span> of the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> of <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will <span class=\"wl wl-kjv\" data-code=\"H6168\">discover</span> their secret parts.", "18": "In that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> will take <span class=\"wl wl-kjv\" data-code=\"H5493\">away</span> the <span class=\"wl wl-kjv\" data-code=\"H8597\">bravery</span> of their tinkling <span class=\"wl wl-kjv\" data-code=\"H5914\">ornaments</span> about their feet, and their <span class=\"wl wl-kjv\" data-code=\"H7636\">cauls,</span> and their round tires like the moon,", "19": "The <span class=\"wl wl-kjv\" data-code=\"H5188\">chains,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8285\">bracelets,</span> and the mufflers,", "20": "The <span class=\"wl wl-kjv\" data-code=\"H6287\">bonnets,</span> and the ornaments of the <span class=\"wl wl-kjv\" data-code=\"H6807\">legs,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7196\">headbands,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5315\">tablets,</span> and the earrings,", "21": "The <span class=\"wl wl-kjv\" data-code=\"H2885\">rings,</span> and <span class=\"wl wl-kjv\" data-code=\"H639\">nose</span> jewels,", "22": "The changeable suits of <span class=\"wl wl-kjv\" data-code=\"H4254\">apparel,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4595\">mantles,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4304\">wimples,</span> and the crisping pins,", "23": "The <span class=\"wl wl-kjv\" data-code=\"H1549\">glasses,</span> and the fine <span class=\"wl wl-kjv\" data-code=\"H5466\">linen,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6797\">hoods,</span> and the vails.", "24": "And it shall come to pass, that instead of sweet <span class=\"wl wl-kjv\" data-code=\"H1314\">smell</span> there shall be <span class=\"wl wl-kjv\" data-code=\"H4716\">stink;</span> and instead of a <span class=\"wl wl-kjv\" data-code=\"H2290\">girdle</span> a <span class=\"wl wl-kjv\" data-code=\"H5364\">rent;</span> and instead of well <span class=\"wl wl-kjv\" data-code=\"H4639\">set</span> <span class=\"wl wl-kjv\" data-code=\"H4748\">hair</span> <span class=\"wl wl-kjv\" data-code=\"H7144\">baldness;</span> and instead of a <span class=\"wl wl-kjv\" data-code=\"H6614\">stomacher</span> a <span class=\"wl wl-kjv\" data-code=\"H4228\">girding</span> of <span class=\"wl wl-kjv\" data-code=\"H8242\">sackcloth;</span> and <span class=\"wl wl-kjv\" data-code=\"H3587\">burning</span> instead of beauty.", "25": "Thy <span class=\"wl wl-kjv\" data-code=\"H4962\">men</span> shall <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> by the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H1369\">mighty</span> in the war.", "26": "And her <span class=\"wl wl-kjv\" data-code=\"H6607\">gates</span> shall <span class=\"wl wl-kjv\" data-code=\"H578\">lament</span> and <span class=\"wl wl-kjv\" data-code=\"H56\">mourn;</span> and she being <span class=\"wl wl-kjv\" data-code=\"H5352\">desolate</span> shall <span class=\"wl wl-kjv\" data-code=\"H3427\">sit</span> upon the ground."}};

    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    let h = '<div class="verg-kop">Grondwoorden</div>';
    if (!heeftB && !heeftK) {
      h += '<em>Nog geen woordkoppeling voor dit vers.</em>';
    } else {
      if (heeftB) h += `<div class="tsk-kop">SVnu</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      h += '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
    }
    h += '<div class="verg-kop" style="margin-top:1.4rem">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vergelijk</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
</html>
