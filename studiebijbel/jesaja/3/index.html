 daad niet snel wordt uitgevoerd, daarom is het hart van de mensenkinderen in hen vol om kwaad te doen.", "Ezech 18:19-32": "Maar u zegt: Waarom draagt de zoon niet de ongerechtigheid van de vader? Zeker zal de zoon, die recht en gerechtigheid gedaan heeft, en al Mijn inzettingen onderhouden heeft, en die gedaan heeft, zeker leven. De ziel die zondigt, die zal sterven; de zoon zal niet dragen de ongerechtigheid van de vader, en de vader zal niet dragen de ongerechtigheid van de zoon; de gerechtigheid van de rechtvaardige zal op hem zijn, en de goddeloosheid van de goddeloze zal op hem zijn. Maar wanneer de goddeloze zich bekeert van al zijn zonden, die hij gedaan heeft, en al Mijn inzettingen onderhoudt, en recht en gerechtigheid doet, hij zal zeker leven, hij zal niet sterven.", "Klaagl 5:4": "Ons water moeten wij voor geld drinken; ons hout komt ons op prijs te staan.", "Jes 33:1": "Wee u, verwoester, die zelf niet verwoest bent, en u, die trouweloos handelt, terwijl men niet trouweloos tegen u gehandeld heeft! Als u het verwoesten volbracht zult hebben, zult u verwoest worden; als u het trouweloos handelen voltooid zult hebben, zal men trouweloos tegen u handelen.", "1 Sam 12:25": "Maar als u toch kwaad blijft doen, zult u, evengoed als uw koning, omkomen.", "2 Kron 28:5-7": "Daarom gaf de HEERE, zijn God, hem in de hand van de koning van Syrië, zodat zij hem versloegen en van hem een grote menigte gevangenen wegvoerden, die zij naar Damascus brachten. En hij werd ook gegeven in de hand van de koning van Israël, die hem versloeg met een grote slachting. Want Pekah, de zoon van Remalia, doodde in Juda honderdtwintigduizend man op één dag, allen strijdbare mannen, omdat zij de HEERE, de God van hun vaderen, verlaten hadden. En Zichri, een geweldig man van Efraïm, doodde Maaseja, de zoon van de koning, en Azrikam, de leider van het huis, alsook Elkana, de tweede na de koning.", "Job 24:2-24": "Zij verzetten de landpalen; de kudden roven zij, en weiden ze. De ezel van de wezen drijven zij weg; de os van een weduwe nemen zij te pand. Zij doen de behoeftigen wijken van de weg; samen verstoppen zich de ellendigen van het land.", "Spr 17:25": "Een dwaze zoon is een verdriet voor zijn vader, en bittere droefheid voor haar die hem gebaard heeft.", "Richt 8:18": "Daarna zei hij tegen Zebah en Tsalmuna: Wat voor mannen waren het die u bij Tabor gedood hebt? En zij zeiden: Zoals u, zo waren zij, allen leken ze op koningszonen.", "Joh 3:15": "Opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft.", "Hos 5:9": "Efraïm zal tot verwoesting worden, op de dag van de straf; onder de stammen van Israël heb Ik bekendgemaakt wat zeker is.", "Luk 10:12-15": "En Ik zeg u dat het voor Sodom draaglijker zal zijn op die dag dan voor die stad. Wee u, Chorazin, wee u, Bethsaïda, want als in Tyrus en Sidon de krachten waren gebeurd die in u gebeurd zijn, zouden zij zich allang, in zak en as zittend, bekeerd hebben. Maar het zal voor Tyrus en Sidon draaglijker zijn in het oordeel dan voor u.", "Ps 31:24": "Heb de HEERE lief, u, al Zijn gunstgenoten! Want de HEERE behoedt de gelovigen, en vergeldt overvloedig hem die hoogmoed bedrijft.", "1 Joh 3:15": "Ieder die zijn broeder haat, is een moordenaar; en u weet dat geen moordenaar het eeuwige leven in zich heeft blijven.", "Ps 76:10": "Toen God opstond ten oordeel, om alle zachtmoedigen van de aarde te verlossen. Sela.", "Gen 1:29": "En God zei: Zie, Ik heb u al het zaadvormende gewas gegeven dat op de hele aarde is, en alle bomen waaraan zaaddragende boomvruchten zitten; het zal u tot voedsel zijn.", "Jes 32:11": "Beeft, u geruste vrouwen; wees beroerd, dochters, die zo zeker bent; trek u uit, en ontbloot u, en gord zakken om uw middel.", "Hos 4:2": "Maar vloeken en liegen, en doodslaan, en stelen, en overspel plegen; zij breken door, en bloedschuld raakt aan bloedschuld.", "Matt 10:33": "Maar wie Mij verloochend zal hebben voor de mensen, die zal Ik ook verloochenen voor Mijn Vader, Die in de hemelen is.", "Spr 28:16": "Een vorst, die alle verstand mist, is ook zeer onderdrukkend; maar wie de hebzucht haat, zal de dagen verlengen.", "Deut 13:1-5": "Wanneer een profeet, of iemand die dromen droomt, in uw midden opstaat, en u een teken of wonder geeft; en dat teken of dat wonder komt uit, waarover hij tot u gesproken had, en zei: Laat ons andere goden, die u niet gekend hebt, navolgen en hen dienen; dan zult u naar de woorden van die profeet, of naar die dromen-dromer, niet horen; want de HEERE, uw God, beproeft u, om te weten of u de HEERE, uw God, liefhebt met heel uw hart en met heel uw ziel.", "Ps 12:5": "Die zeggen: Wij zullen de overhand hebben met onze tong; onze lippen zijn onze! Wie is heer over ons?", "Ezech 9:10": "Daarom ook, wat Mij aangaat, Mijn oog zal niet verschonen, en Ik zal niet sparen; Ik zal hun weg op hun hoofd geven.", "2 Kron 29:34": "Doch van de priesters waren er te weinig, en zij konden niet van al de brandoffers de huid aftrekken; daarom hielpen hun broeders, de Levieten, hen, totdat het werk beëindigd was, en totdat de andere priesters zich geheiligd hadden; want de Levieten waren oprechter van hart om zich te heiligen, dan de priesters.", "Pred 3:16": "Verder heb ik ook gezien onder de zon, op de plaats van het gericht, daar was goddeloosheid; en op de plaats van de gerechtigheid, daar was goddeloosheid.", "Jer 5:4": "Toch zei ik: Zeker, dit zijn de armen; zij handelen dwaas, omdat zij de weg van de HEERE, het recht van hun God, niet kennen.", "Hebr 12:2": "Ziende op Jezus, de Leidsman en Voleinder van het geloof, Die om de vreugde die Hem voorgesteld was, het kruis heeft verdragen, en schande veracht heeft, en gezeten is aan de rechterhand van de troon van God.", "Pred 3:17": "Ik zei in mijn hart: God zal de rechtvaardige en de goddeloze oordelen; want daar is de tijd voor alle voornemen, en over alle werk.", "1 Kor 4:10": "Wij zijn dwazen om Christus' wil, maar u bent wijzen in Christus; wij zijn zwakken, maar u sterken; u bent heerlijke mensen, maar wij worden veracht.", "Jes 1:24": "Daarom spreekt de Heere, HEERE van de heerscharen, de Machtige van Israël: O wee! Ik zal Mij troosten over Mijn tegenstanders. Ik zal Mij wreken op Mijn vijanden.", "Spr 14:1": "Elke wijze vrouw bouwt haar huis; maar wie zeer dwaas is, breekt het met eigen handen af.", "Jer 26:18": "Micha, de Morastiet, heeft in de dagen van Hizkia, koning van Juda, geprofeteerd, en tot al het volk van Juda gesproken, en gezegd: Zo zegt de HEERE van de heerscharen: Sion zal als een akker geploegd worden, en Jeruzalem tot steenhopen worden, en de berg van dit huis tot hoogten van het woud.", "Ezech 16:47": "Toch hebt u niet in hun wegen gewandeld, noch naar hun gruwelen gedaan; het was iets van het geringe, een verdriet; maar u hebt het meer verdorven dan zij, in al uw wegen.", "Lev 13:29": "Verder, als er in een man of vrouw een plaag zal zijn in het hoofd, of in de baard;", "Ps 2:9": "U zult hen verpletteren met een ijzeren scepter; U zult hen in stukken slaan als een pottenbakkersvat.", "Matt 16:24-27": "Toen zei Jezus tegen Zijn discipelen: Als iemand achter Mij aan wil komen, laat hij zichzelf verloochenen, en zijn kruis opnemen, en Mij volgen. Want wie zijn leven zal willen behouden, die zal het verliezen; maar wie zijn leven zal verliezen om Mijnentwil, die zal het vinden. Want wat baat het een mens, als hij de hele wereld wint, en schade lijdt aan zijn ziel? Of wat zal een mens geven, als losprijs voor zijn ziel?", "Ezech 18:12": "De ellendige en de arme verdrukt, veel van het roof rooft, het pand niet teruggeeft, en zijn ogen opheft tot de drekgoden, gruwel doet;", "Ex 18:10": "En Jethro zei: Gezegend zij de HEERE, Die u verlost heeft uit de hand van de Egyptenaren, en uit de hand van Farao; Die dit volk van onder de hand van de Egyptenaren verlost heeft!", "Zef 1:8": "En het zal gebeuren in de dag van het slachtoffer van de HEERE, dat Ik bezoeking zal doen over de vorsten, en over de kinderen van de koning, en over allen die zich kleden met vreemde kleding.", "2 Tim 3:6-9": "Want tot hen behoren zij die de huizen binnensluipen en de vrouwtjes gevangen nemen die met zonden beladen zijn en door allerlei begeerten gedreven worden, vrouwtjes die altijd leren, en nooit tot kennis van de waarheid kunnen komen. Zoals Jannes en Jambres Mozes tegenstonden, zo staan ook dezen de waarheid tegen; mensen, verdorven van verstand, verwerpelijk wat het geloof betreft.", "Ps 119:155": "Het heil is ver van de goddelozen, want zij zoeken Uw inzettingen niet.", "Jer 48:42": "Want Moab zal verdelgd worden, zodat hij geen volk meer is, omdat hij zich groot gemaakt heeft tegen de HEERE.", "Jes 9:13-15": "Daarom zal de HEERE uit Israël afhouwen de kop en de staart, de tak en de biezen, op één dag. (De oude en aanzienlijke, die is de kop; maar de profeet die valsheid leert, die is de staart.) Want de leiders van dit volk zijn verleiders, en die door hen geleid worden, worden ingeslokt.", "Jer 10:20": "Mijn tent is verstoord, en al mijn touwen zijn verscheurd; mijn kinderen zijn van mij uitgegaan, en zij zijn er niet; er is niemand meer, die mijn tent uitspant, en mijn gordijnen opricht.", "Jes 3:17-23": "Zo zal de Heere de schedel van de dochters van Sion schurftig maken, en de HEERE zal haar schaamte ontbloten. Op diezelfde dag zal de Heere wegnemen het sieraad van de kousebanden, en de netjes, en de maantjes, De reukdoosjes, en de kleine ketentjes, en de glinsterende kledingen,", "Jes 24:2": "En zoals het met het volk zal gaan, zo zal het met de priester zijn; zoals met de knecht, zo met zijn heer; zoals met de dienstmaagd, zo met haar vrouw; zoals met de koper, zo met de verkoper; zoals met de lener, zo met de ontlener; zoals met de woekeraar, zo met hem van wie hij woeker ontvangt.", "Job 18:5-21": "Ja, het licht van de goddelozen zal uitgeblust worden, en de vonk van zijn vuur zal niet glinsteren. Het licht zal verduisteren in zijn tent, en zijn lamp zal boven hem uitgeblust worden. De stappen van zijn kracht zullen beperkt worden, en zijn eigen plan zal hem neerwerpen.", "Luk 20:47": "die de huizen van de weduwen opeten, en voor de schijn lange gebeden uitspreken; zij zullen een des te zwaarder oordeel ontvangen.", "Matt 18:35": "Zo zal ook Mijn hemelse Vader met u doen, als u niet ieder van harte uw broeder zijn misdaden vergeeft.", "Ps 36:2-5": "De overtreding van de goddeloze spreekt in het binnenste van mijn hart: Er is geen vreze van God voor zijn ogen. Want hij vleit zichzelf in zijn ogen, als men zijn ongerechtigheid bevindt, die te haten is. De woorden van de mond van hem zijn onrecht en bedrog; hij laat na te verstaan tot weldoen.", "Jer 2:8": "De priesters zeiden niet: Waar is de HEERE? en die de wet hanteerden, kenden Mij niet; en de herders overtraden tegen Mij; en de profeten profeteerden door Baäl, en wandelden naar dingen die geen nut doen.", "Ps 85:11": "De goedertierenheid en waarheid zullen elkaar ontmoeten; de gerechtigheid en vrede zullen elkaar kussen.", "Hos 14:1": "Samaria zal woest worden, want zij is opstandig geweest tegen haar God; zij zullen door het zwaard vallen, hun kinderen zullen verpletterd, en hun zwangere vrouwen zullen opengesneden worden.", "Klaagl 1:18": "Tsade. De HEERE is rechtvaardig, want ik ben Zijn mond opstandig geweest; hoort toch, alle volken, en ziet mijn smart; mijn jonkvrouwen en mijn jongelingen zijn in de gevangenschap gegaan.", "Ef 6:7": "terwijl u dient met goedwilligheid de Heere, en niet de mensen;", "Ps 9:9": "En Hij Zelf zal de wereld richten in gerechtigheid, en de volken oordelen in rechtmatigheden.", "Amos 1:13": "Zo zegt de HEERE: Om drie overtredingen van de kinderen van Ammon, en om vier zal Ik dat niet afwenden; omdat zij de zwangere vrouwen van Gilead hebben opengesneden, om hun grondgebied te vergroten.", "Jes 33:9": "Het land treurt, het kwijnt weg; de Libanon schaamt zich, hij verwelkt; Saron is geworden als een woestijn; zo zijn Basan en Karmel geschud.", "Luk 11:43": "Wee u, Farizeeën, want u houdt van de voorste plaatsen in de synagogen, en van de begroetingen op de markten.", "Jes 24:17": "De angst, en de kuil, en de strik over u, o inwoners van het land!", "2 Kon 9:30": "En Jehu kwam te Jizreël. Toen Izebel dat hoorde, blankette zij haar gezicht, en versierde haar hoofd, en keek uit het venster.", "Openb 2:1": "Schrijf aan de engel van de gemeente van Efeze: Dit zegt Hij, Die de zeven sterren in Zijn rechterhand houdt, Die in het midden van de zeven gouden kandelaren wandelt:", "Fil 3:18": "Want velen wandelen anders; over wie ik u dikwijls gezegd heb, en nu ook wenend zeg, dat zij vijanden zijn van het kruis van Christus;", "Pred 8:12": "Hoewel een zondaar honderd maal kwaad doet, en God zijn dagen verlengt, weet ik toch zeker, dat het hun goed zal gaan die God vrezen, die voor Zijn aangezicht vrezen.", "Matt 25:30": "En werp de nutteloze dienstknecht buiten, in de uiterste duisternis; daar zal geween zijn en het geknars van de tanden.", "Matt 23:14": "Wee u, Schriftgeleerden en Farizeeën, huichelaars, want u eet de huizen van de weduwen op, en dat onder de schijn van lang te bidden; daarom zult u des te zwaarder oordeel ontvangen.", "Luk 19:26": "Want ik zeg u dat ieder die heeft, gegeven zal worden; maar van hem die niet heeft, zal ook wat hij heeft afgenomen worden.", "Nahum 3:3": "De ruiter steekt omhoog, zo het vlammende zwaard, als de bliksemende speer, en er zal een veelheid van verslagenen zijn, en een zware menigte dode lichamen; ja, er zal geen einde zijn aan de lichamen, men zal over hun lichamen struikelen;", "Ps 145:17": "Tsade. De HEERE is rechtvaardig in al Zijn wegen, en goedertieren in al Zijn werken.", "Mark 7:21": "Want van binnenuit, uit het hart van de mensen, komen voort kwade gedachten, overspel, hoererijen, moorden,", "2 Kron 29:9": "Want zie, onze vaders zijn door het zwaard gevallen; daarbij zijn onze zonen, en onze dochters, en onze vrouwen daarom in gevangenschap geweest.", "2 Petr 3:3-5": "Dit moet u eerst weten, dat er in de laatste dagen spotters zullen komen, die naar hun eigen begeerten zullen wandelen, En zeggen: Waar is de belofte van Zijn komst? Want vanaf de dag dat de vaders ontslapen zijn, blijven alle dingen zo, net zoals vanaf het begin van de schepping. Want willens en wetens is dit hun onbekend, dat door het woord van God de hemelen er van oudsher geweest zijn, en de aarde ontstaan is uit het water en door het water in stand blijft;", "Zef 2:15": "Dit is de stad, die opspringt van vreugde, die zorgeloos woont, die in haar hart zegt: Ik ben het, en buiten mij is er niemand meer; hoe is zij geworden tot woestheid, een rustplaats voor het gedierte! Ieder die daar voorbij trekt, zal haar aanfluiten, hij zal zijn hand bewegen.", "Ps 92:16": "Om te verkondigen dat de HEERE recht is; Hij is mijn Rotssteen, en in Hem is geen onrecht.", "Jer 4:8": "Hierom, doe zakken aan, bedrijf misbaar en huil; want de gloed van de toorn van de HEERE is niet van ons afgekeerd.", "Ps 51:6": "Tegen U, U alleen, heb ik gezondigd, en gedaan wat kwaad is in Uw ogen; opdat U rechtvaardig bent in Uw spreken, en rein bent in Uw oordelen.", "Job 2:8": "En hij nam zich een potscherf om zich daarmee te schrapen, en hij zat neer in het midden van de as.", "Micha 2:3": "Daarom, zo zegt de HEERE: Zie, Ik bedenk een kwaad over dit geslacht, waaruit u uw halzen niet zult uittrekken, en zo rechtop niet zult gaan; want het zal een boze tijd zijn.", "Joz 8:33": "En heel Israël met zijn oudsten, en opzichters, en zijn rechters, stonden aan deze en aan gene kant van de ark, tegenover de Levitische priesters die de ark van het verbond van de HEERE droegen, zowel vreemdelingen als geboren Israëlieten, de ene helft daarvan tegenover de berg Gerizim, en de andere helft daarvan tegenover de berg Ebal, zoals Mozes, de knecht van de HEERE, eerder bevolen had, om het volk van Israël te zegenen.", "Jes 31:2": "Toch is Hij ook wijs, en Hij doet het kwaad komen, en trekt Zijn woorden niet terug; maar Hij zal Zich opmaken tegen het huis van de boosdoeners, en tegen de hulp van hen die ongerechtigheid werken.", "Ps 119:118": "U vertreedt allen, die van Uw inzettingen afdwalen, want hun bedrog is leugen.", "Job 36:19": "Zou Hij uw rijkdom achten, zodat u niet in benauwdheid zou zijn; of alle versterkingen van kracht?", "Hebr 11:26": "en achtte hij de smaad van Christus een grotere rijkdom dan de schatten in Egypte; want hij keek uit naar de vergelding van het loon.", "Jes 10:2": "om de armen van het recht af te wenden, en om het recht van de ellendigen van Mijn volk te roven, opdat de weduwen hun buit worden, en opdat zij de wezen mogen plunderen!", "1 Petr 1:17": "En als u Hem als Vader aanroept, Die zonder aanzien des persoons oordeelt naar ieders werk, leef dan in ontzag gedurende de tijd van uw verblijf hier als vreemdeling;", "Job 21:7-33": "Waarom leven de goddelozen, worden oud, ja, worden geweldig in vermogen? Hun nakomelingen zijn bestendig bij hen voor hun ogen, en hun spruiten voor hun aangezicht. Hun huizen hebben vrede zonder vrees, en de roede van God is niet op hen.", "Ezech 7:27": "De koning zal rouw bedrijven, en de vorsten zullen met verwoesting bekleed zijn, en de handen van het volk van het land zullen verschrikt zijn; Ik zal hun doen naar hun weg, en met hun rechten zal Ik ze richten; en zij zullen weten dat Ik de HEERE ben.", "Jer 49:12": "Want zo zegt de HEERE: Zie, van hen wier oordeel het niet is de beker te drinken, zullen er helemaal drinken; en zou u dan enigszins ongestraft blijven? U zult niet ongestraft blijven, maar u zult helemaal drinken.", "Spr 10:17": "Het pad naar het leven is voor hem die de tucht bewaart; maar wie de bestraffing verlaat, doet dwalen.", "Job 22:4": "Is het om uw vrees dat Hij u bestraft, dat Hij met u in het gericht komt?", "Openb 22:12": "En zie, Ik kom haastig, en Mijn loon is met Mij, om ieder te vergelden zoals zijn werk zal zijn.", "Jer 20:12": "Gij dan, o HEERE van de heerscharen, Die de rechtvaardige beproeft, Die de nieren en het hart ziet, laat mij Uw wraak op hen zien, want ik heb U mijn rechtszaak voorgelegd.", "Matt 10:32": "Ieder dan die Mij belijden zal voor de mensen, die zal Ik ook belijden voor Mijn Vader, Die in de hemelen is.", "2 Petr 2:10-19": "maar vooral hen, die naar het vlees wandelen in onreine begeerte, en het gezag verachten; die vermetel zijn, zichzelf behagen, en die er niet voor terugschrikken de heerlijkheden te lasteren; terwijl de engelen, die in sterkte en kracht groter zijn, geen lasterlijk oordeel tegen hen uitspreken voor de Heere. Maar dezen, als onredelijke dieren, die de natuur volgen en geboren zijn om gevangen en gedood te worden, lasteren wat zij niet begrijpen, en zullen in hun verdorvenheid ook zelf verdorven worden;", "Job 30:1-12": "Maar nu lachen zij die jonger zijn dan ik, om mij, van wie ik hun vaderen versmaad zou hebben, om ze bij de honden van mijn kudde te zetten. Waartoe zou mij ook de kracht van hun handen geweest zijn? Zij waren door ouderdom in hen vergaan. Die door gebrek en honger eenzaam waren, vluchtend naar dorre plaatsen, in het donkere, woeste en verwoeste land.", "Deut 11:18-21": "Leg dan deze mijn woorden in uw hart, en in uw ziel, en bind ze tot een teken op uw hand, dat zij tot voorhoofdsbanden zijn tussen uw ogen; En leer ze uw kinderen, en spreek erover, als u in uw huis zit, en als u onderweg gaat, en als u neerligt, en als u opstaat; En schrijf ze op de posten van uw huis, en aan uw poorten;", "Ps 92:8": "Dat de goddelozen groeien als het gras, en al de werkers van de ongerechtigheid bloeien, opdat zij tot in eeuwigheid weggevaagd worden.", "Amos 5:12": "Want Ik weet dat uw overtredingen talrijk, en uw zonden machtig veel zijn; zij benauwen de rechtvaardige, nemen steekpenningen aan, en verdringen de behoeftigen in de poort.", "Spr 21:24": "Wie een hovaardige pocher is, zijn naam is spotter; hij gaat met hovaardige verbolgenheid te werk.", "1 Sam 24:16": "Doch de HEERE zal Rechter zijn, en rechtspreken tussen mij en tussen u, en zien daarin, en mijn geschil beslechten, en mij redden uit uw hand.", "Amos 4:1": "Hoor dit woord, koeien van Basan, u die op de berg van Samaria bent, die de armen verdrukt, die de behoeftigen verplettert; u die tegen uw heren zegt: Breng aan, opdat wij drinken.", "Jer 17:15": "Zie, zij zeggen tegen mij: Waar is het woord van de HEERE? Laat het nu komen!", "Ps 46:9": "Komt, aanschouwt de daden van de HEERE, Die verwoestingen op aarde aanricht.", "Ezech 3:7": "Maar het huis Israëls wil naar u niet horen, omdat zij naar Mij niet willen horen; want het hele huis Israëls is stijf van voorhoofd, en hard van hart zijn zij.", "Matt 26:67": "Toen spuugden zij in Zijn gezicht en sloegen Hem met vuisten.", "Spr 22:22": "Beroof de arme niet, omdat hij arm is; en verbrijzel de ellendige niet in de poort.", "1 Kron 10:14": "en de HEERE niet gezocht had; daarom doodde Hij hem, en keerde het koninkrijk tot David, de zoon van Isaï.", "Hos 7:16": "Zij keren zich om, maar niet naar de Allerhoogste, zij zijn als een bedrieglijke boog; hun vorsten vallen door het zwaard, vanwege de woede van hun tong; dit zal hun bespotting zijn in het land Egypte.", "1 Kron 16:33": "Dan zullen de bomen van het woud juichen voor het aangezicht van de HEERE, omdat Hij komt om de aarde te richten.", "Jes 24:18": "En het zal gebeuren: wie voor het geluid van de angst vlucht, die zal in de kuil vallen; en wie uit de kuil opklimt, die zal in de strik gevangen worden; want de sluizen in de hoogte zijn opengedaan, en de fundamenten van de aarde zullen beven.", "Amos 2:12": "Maar u hebt aan de nazireeërs wijn te drinken gegeven, en u hebt de profeten geboden en gezegd: U zult niet profeteren.", "Ezech 39:24": "Naar hun onreinheid en naar hun overtredingen heb Ik met hen gehandeld, en Ik heb Mijn aangezicht voor hen verborgen.", "Ps 146:9": "De HEERE bewaart de vreemdelingen; Hij houdt de wees en de weduwe staande; maar de weg van de goddelozen keert Hij om.", "Ezech 5:4": "En nog zult u daarvan nemen, en dat werpen in het midden van het vuur, en zult ze verbranden met vuur; daaruit zal een vuur voortkomen tegen het hele huis van Israël.", "Openb 19:14": "En de legers in de hemel volgden Hem op witte paarden, gekleed met wit en rein fijn linnen.", "Jes 59:15": "Ja, de waarheid ontbreekt, en wie van het boze wijkt, wordt tot een prooi; en de HEERE zag het, en het was kwaad in Zijn ogen, dat er geen recht was.", "Hebr 10:36": "Want u hebt volharding nodig, opdat u, wanneer u de wil van God gedaan hebt, de belofte moogt ontvangen;", "Openb 19:17": "En ik zag een engel, staande in de zon; en hij riep met een grote stem, en zei tegen alle vogels, die in het midden van de hemel vlogen: Kom hierheen, en verzamel u tot het avondmaal van de grote God;", "Hand 2:13": "En anderen zeiden spottend: Zij zijn vol zoete wijn.", "1 Tim 6:21": "waarmee sommigen, terwijl zij die beleden, van het geloof zijn afgeweken. De genade zij met u. Amen. De eerste brief aan Timotheüs werd geschreven vanuit Laodicea, de voornaamste stad in Frygië Pacatania.", "Jer 51:10": "De HEERE heeft onze gerechtigheden hervoor gebracht; kom en laat ons in Sion het werk van de HEERE, onze God, vertellen!", "Spr 6:16": "Deze zes dingen haat de HEERE; ja, zeven zijn een gruwel voor Zijn ziel:", "Neh 5:17": "Ook zijn van de Joden en van de overheden honderdvijftig man, en zij die van de heidenen die rondom ons zijn tot ons kwamen, aan mijn tafel geweest.", "Rom 5:12": "Daarom, zoals door één mens de zonde in de wereld ingekomen is, en door de zonde de dood; en zo de dood tot alle mensen doorgegaan is, doordat allen gezondigd hebben.", "Job 15:1-13": "Toen antwoordde Elifaz, de Themaniet, en zei: Zal een wijs man winderige wetenschap voor antwoord geven, en zal hij zijn buik vullen met oostenwind? Bestraffend door woorden, die niet baten, en door redenen, waarmee hij geen voordeel doet?", "Luk 12:45": "Maar als die dienstknecht in zijn hart zou zeggen: Mijn heer blijft nog lang weg voor hij komt; en zou beginnen de knechten en de dienstmeisjes te slaan, en te eten en te drinken en dronken te worden;", "Pred 10:16": "Wee u, land, waarvan de koning een kind is, en waarvan de vorsten al in de morgenstond eten!", "Ps 136:25": "Die alle vlees voedsel geeft; want Zijn goedertierenheid is voor eeuwig.", "Zef 3:4": "Haar profeten zijn lichtvaardig, geheel trouweloze mannen; haar priesters verontreinigen het heilige, zij doen de wet geweld aan.", "Job 23:7": "Daar zou de oprechte met Hem pleiten; en ik zou mij voor eeuwig van mijn Rechter vrijmaken.", "Hos 9:9": "Zij hebben zich zeer diep verdorven, zoals in de dagen van Gibea; Hij zal aan hun ongerechtigheid denken, Hij zal hun zonden straffen.", "Jer 11:15": "Wat heeft Mijn beminde in Mijn huis te doen, terwijl zij die schandelijke daad met velen doet, en het heilige vlees van u geweken is? Wanneer u kwaad doet, dan springt u op van vreugde.", "Spr 14:21": "Wie zijn naaste veracht, zondigt; maar wie zich over de nederigen ontfermt, die is gelukkig.", "2 Petr 2:12-19": "Maar dezen, als onredelijke dieren, die de natuur volgen en geboren zijn om gevangen en gedood te worden, lasteren wat zij niet begrijpen, en zullen in hun verdorvenheid ook zelf verdorven worden; en zij zullen het loon van de onrechtvaardigheid ontvangen, omdat zij het als een genot beschouwen dagelijks in weelde te leven; zij zijn vlekken en smetten, en genieten uitbundig van hun eigen bedrog, terwijl zij met u aan de maaltijd zijn; zij hebben ogen vol overspel, die niet ophouden met zondigen; zij verleiden onvaste zielen, hebben een hart geoefend in hebzucht, en zijn kinderen van de vervloeking;", "Klaagl 4:6": "Vau. En de ongerechtigheid van de dochter van mijn volk is groter dan de zonden van Sodom, dat als in een ogenblik omgekeerd werd, zonder dat er handen naar haar uitgestoken werden.", "Ps 73:11": "Zodat zij zeggen: Hoe zou God het weten, en zou er kennis zijn bij de Allerhoogste?", "Jer 49:16": "Uw verschrikkelijkheid heeft u bedrogen, en de trots van uw hart, u die woont in de kloven van de steenrotsen, die de hoogte van de heuvels vasthoudt! Al zou u uw nest zo hoog maken als de arend, toch zal Ik u vandaar neerstoten, spreekt de HEERE.", "Openb 19:15": "En uit Zijn mond ging een scherp zwaard, opdat Hij daarmee de heidenen slaan zou. En Hij zal hen hoeden met een ijzeren staf; en Hij treedt de wijnpersbak van de wijn van de toorn en van de gramschap van de Almachtige God.", "Ezech 18:25": "Nog zegt u: De weg van de Heere is niet recht; hoor nu, o huis van Israël! Is Mijn weg niet recht? Zijn niet uw wegen onrecht?", "Hos 7:13": "Wee hen, want zij zijn van Mij afgezworven; verwoesting over hen, want zij hebben tegen Mij overtreden! Ik zou hen wel verlossen, maar zij spreken leugens tegen Mij.", "1 Joh 3:14": "Wij weten dat wij overgegaan zijn uit de dood in het leven, omdat wij de broeders liefhebben; wie zijn broeder niet liefheeft, blijft in de dood.", "Dan 7:9": "Dit zag ik, totdat er tronen gezet werden, en de Oude van dagen Zich zette, Wiens kleed wit was als de sneeuw, en het haar van Zijn hoofd als zuivere wol; Zijn troon was vuurvonken, de raderen ervan een brandend vuur.", "2 Kron 28:18": "Daartoe waren de Filistijnen ingevallen in de steden van het laagland en het zuiden van Juda, en hadden ingenomen Beth-Semes, en Ajalon, en Gederoth, en Socho met haar bijbehorende plaatsen, en Timna met haar bijbehorende plaatsen, en Gimzo met haar bijbehorende plaatsen; en zij woonden daar.", "Lev 18:25": "Zodat het land onrein is, en Ik over hen zijn ongerechtigheid bezoek, en het land zijn inwoners uitspuwt.", "Jer 6:15": "Zijn zij beschaamd, omdat zij gruwel bedreven hebben? Ja, zij schamen zich in het minste niet, weten ook niet van schaamrood te maken; daarom zullen zij vallen onder de vallende, ten tijde als Ik hen bezoeken zal, zullen zij struikelen, zegt de HEERE.", "Dan 11:37": "En op de goden van zijn vaderen zal hij geen acht geven, noch op de begeerte van de vrouwen; hij zal ook op geen God acht geven, maar hij zal zich boven alles groot maken.", "Job 12:3": "Ik heb ook een hart, net zoals u; ik ben niet minder dan u; en bij wie zijn niet zulke dingen bekend?", "Num 21:5": "En het volk sprak tegen God en tegen Mozes: Waarom hebt u ons laten optrekken uit Egypte, opdat wij zouden sterven in de woestijn? Want hier is geen brood, ook geen water, en onze ziel walgt van dit zeer lichte brood.", "Job 15:28-30": "En heeft verdelgde steden bewoond, en huizen die men niet bewoonde, die gereed waren om een puinhoop te worden. Hij zal niet rijk worden, en zijn vermogen zal niet bestaan; en hun volmaaktheid zal zich niet uitbreiden op de aarde. Hij zal van de duisternis niet ontwijken, de vlam zal zijn scheut verdrogen; hij zal wijken door het geblaas van zijn mond.", "Ps 120:3": "Wat zal U de bedrieglijke tong geven, of wat zal zij U toevoegen?", "Ezech 7:4": "En Mijn oog zal u niet verschonen, en Ik zal niet sparen; maar Ik zal uw wegen op u brengen, en uw gruwelen zullen in het midden van u zijn, en u zult weten dat Ik de HEERE ben.", "Gen 48:15": "En hij zegende Jozef, en zei: De God, voor Wiens aangezicht mijn vaders, Abraham en Izak, gewandeld hebben, die God, Die mij gevoed heeft, van mijn jeugd af tot op deze dag;", "Dan 7:20": "En aangaande de tien horens die op zijn hoofd waren, en de andere, die opkwam, en voor wie er drie afgevallen waren, namelijk die horen, die ogen had, en een mond, die grote dingen sprak, en wiens aanzien groter was dan van zijn metgezellen.", "2 Kron 36:17-19": "Want Hij deed tegen hen opkomen de koning van de Chaldeeën, die hun jongemannen met het zwaard doodde in het huis van hun heiligdom, en hij spaarde de jongemannen niet, noch de meisjes, de ouden noch de stokoude; Hij gaf hen allen in zijn hand. En alle voorwerpen van het huis van God, de grote en de kleine, en de schatten van het huis van de HEERE, en de schatten van de koning en zijn vorsten, dit alles bracht hij naar Babel. En zij verbrandden het huis van God, en zij braken de muur van Jeruzalem af, en al de paleizen daarvan verbrandden zij met vuur, en vernietigden ook alle kostbare voorwerpen daarvan.", "Amos 5:10": "Zij haten in de poort hem die bestraft, en verafschuwen hem die oprecht spreekt.", "Ps 64:4-7": "Die hun tong scherpen als een zwaard, een bitter woord richten als hun pijl; Om in verborgen plaatsen de oprechte te schieten; haastig schieten zij naar hem, en vrezen niet. Zij sterken zichzelf in een boze zaak; zij overleggen om strikken te verbergen; zij zeggen: Wie zal ze zien?", "Spr 3:33": "De vloek van de HEERE is in het huis van de goddeloze; maar de woning van de rechtvaardigen zal Hij zegenen.", "Ps 37:9": "Want de boosdoeners zullen uitgeroeid worden, maar wie de HEERE verwachten, die zullen de aarde erfelijk bezitten.", "Hos 7:12": "Wanneer zij zullen heengaan, zal Ik Mijn net over hen uitspreiden, Ik zal ze als vogels van de hemel doen neerdalen. Ik zal ze tuchtigen, zoals gehoord is in hun samenkomst.", "Ezech 16:11": "Ook versierde Ik u met sieraad, en deed armringen aan uw handen, en een keten om uw hals.", "Ps 10:8-10": "Hij zit in de hinderlaag bij de hoeven, in verborgen plaatsen doodt hij de onschuldige; zijn ogen verbergen zich tegen de arme. Hij legt lagen in een verborgen plaats, zoals een leeuw in zijn hol; hij legt lagen om de ellendige te roven; hij rooft de ellendige als hij hem trekt in zijn net. Hij duikt neer, hij buigt zich; en de arme drom valt in zijn sterke poten.", "Jer 44:17": "Maar wij zullen zeker doen al wat uit onze mond is uitgegaan, terwijl wij wierook branden voor de koningin van de hemel, en haar drankoffers offeren, zoals wij gedaan hebben, wij en onze vaders, onze koningen en onze vorsten, in de steden van Juda en in de straten van Jeruzalem; toen werden wij met brood verzadigd, en waren vrolijk, en zagen geen kwaad.", "Ezech 11:12": "En u zult weten dat Ik de HEERE ben, omdat u in Mijn inzettingen niet gewandeld hebt, en Mijn rechten niet gedaan hebt, maar naar de rechten van de heidenvolken die rondom u zijn, gedaan hebt.", "Ps 68:3": "U zult hen verdrijven, zoals rook verdreven wordt; zoals was voor het vuur smelt, zullen de goddelozen vergaan van Gods aangezicht.", "Jer 38:9": "Mijn heer koning! Deze mannen hebben slecht gehandeld in alles wat zij gedaan hebben aan de profeet Jeremia, die zij in de kuil geworpen hebben; want hij zou daar ter plaatse gestorven zijn van de honger, omdat er geen brood meer in de stad is.", "Ezech 14:23": "Zo zullen zij u vertroosten, wanneer u hun weg en hun handelingen zult zien; en u zult weten dat Ik niet zonder reden heb gedaan al wat Ik in haar gedaan heb, spreekt de Heere HEERE.", "Ps 9:8": "Maar de HEERE zal in eeuwigheid zitten; Hij heeft Zijn troon bereid ten gerichte.", "Hos 7:3": "Zij verblijden de koning met hun boosheid, en de vorsten met hun leugens.", "Openb 9:8": "En zij hadden haar als haar van vrouwen, en hun tanden waren als tanden van leeuwen.", "Ps 34:17": "Pe. Het aangezicht van de HEERE is tegen hen die kwaad doen, om hun gedachtenis van de aarde uit te roeien.", "Micha 3:2": "Zij haten het goede, en hebben het kwade lief; zij roven hun huid van hen af, en hun vlees van hun beenderen.", "Jes 57:4": "Over wie maakt u zich vrolijk, tegen wie sperrt u de mond wijd open en steekt u de tong lang uit? Bent u geen kinderen van de overtreding, een nageslacht van de valsheid?", "2 Petr 2:1-22": "Maar er zijn ook valse profeten onder het volk geweest, zoals er ook onder u valse leraars zullen zijn, die verderfelijke ketterijen in het geheim zullen invoeren, en zelfs de Heere, Die hen gekocht heeft, verloochenen, en zo een snel verderf over zichzelf brengen; En velen zullen hun verderfelijke wegen navolgen, waardoor de weg van de waarheid belasterd zal worden. En zij zullen door hebzucht, met gemaakte woorden, van u een koopwaar maken; over hen is het oordeel van lang geleden niet werkeloos, en hun verderf sluimert niet.", "Gen 24:30": "En het gebeurde, toen hij dat voorhoofdsieraad gezien had, en de armringen aan de handen van zijn zuster; en toen hij de woorden van zijn zuster Rebekka gehoord had, die zei: Zo heeft die man tot mij gesproken, toen kwam hij naar die man, en zie, hij stond bij de kamelen, bij de bron.", "Gen 15:13": "Toen zei Hij tegen Abram: Weet voorzeker dat uw nageslacht vreemdeling zal zijn in een land dat niet van hen is, en zij zullen hen dienen, en zij zullen hen verdrukken, vierhonderd jaar.", "Jes 5:1-6": "Nu zal ik voor mijn Beminde een lied van mijn Liefste zingen, over Zijn wijngaard. Mijn Beminde heeft een wijngaard op een vruchtbare heuvel. En Hij heeft die omtuind en van stenen gezuiverd, en Hij heeft hem beplant met edele wijnstokken; en Hij heeft in het midden ervan een toren gebouwd, en ook een wijnbak daarin uitgehouwen; en Hij heeft verwacht dat hij goede druiven zou voortbrengen, maar hij heeft stinkende druiven voortgebracht. Nu dan, u, inwoners van Jeruzalem, en u, mannen van Juda, oordeel toch tussen Mij en tussen Mijn wijngaard.", "Jes 9:14": "(De oude en aanzienlijke, die is de kop; maar de profeet die valsheid leert, die is de staart.)", "Ezech 22:25": "De samenzwering van haar profeten heerst in haar midden als een brullende leeuw die een prooi rooft; zij eten de zielen op, de schat en het kostbare nemen zij weg; haar weduwen vermenigvuldigen zij in haar midden.", "Luk 15:22": "Maar de vader zei tegen zijn dienaren: Breng hier het beste kleed, en trek het hem aan, en geef hem een ring aan zijn hand, en schoenen aan zijn voeten;", "Ps 94:23": "En Hij zal hun ongerechtigheid op hen doen terugkeren, en Hij zal hen in hun boosheid verdelgen; de HEERE, onze God, zal hen verdelgen.", "Matt 20:1-16": "Want het Koninkrijk der hemelen is gelijk aan een heer des huizes, die 's morgens vroeg uitging om arbeiders te huren voor zijn wijngaard. En toen hij met de arbeiders overeengekomen was voor een penning per dag, stuurde hij hen naar zijn wijngaard. En hij ging uit, omtrent het derde uur, en zag anderen werkloos staan op de markt.", "2 Kron 36:2": "Drieëntwintig jaar was Joahaz oud, toen hij koning werd, en hij regeerde drie maanden te Jeruzalem.", "Job 21:14": "Toch zeggen zij tegen God: Ga weg van ons, want in de kennis van Uw wegen hebben wij geen behagen.", "Dan 9:7": "Bij U, o Heere! is de gerechtigheid, maar bij ons de schaamte van het gezicht, zoals het is op deze dag; bij de mannen van Juda, en de inwoners van Jeruzalem, en heel Israël, die dichtbij en die ver weg zijn, in alle landen waarheen U hen verdreven hebt, om hun overtreding waarmee zij tegen U overtreden hebben.", "Deut 28:24": "De HEERE, uw God, zal stof en poeder tot regen van uw land geven; vanuit de hemel zal het op u neerdalen, totdat u verdelgd wordt.", "1 Tim 6:3": "Als iemand een andere leer leert en niet overeenkomt met de gezonde woorden van onze Heere Jezus Christus, en met de leer die overeenkomt met de godsvrucht,", "Jes 52:5": "En nu, wat heb Ik hier te doen? spreekt de HEERE, omdat Mijn volk voor niets is weggenomen, en degenen die over hen heersen, hen laten huilen, spreekt de HEERE, en Mijn Naam voortdurend de hele dag gelasterd wordt;", "Spr 29:23": "De hoogmoed van de mens zal hem vernederen; maar wie nederig van geest is, zal de eer vasthouden.", "Deut 27:19": "Vervloekt is hij die het recht van de vreemdeling, van de wees en van de weduwe buigt! En heel het volk zal zeggen: Amen.", "Matt 23:3": "daarom, alles wat zij u zeggen dat u houden moet, houd dat en doe het; maar doe niet naar hun werken, want zij zeggen het, en doen het niet.", "Gen 38:18": "Toen zei hij: Wat voor onderpand zal ik u geven? En zij zei: Uw zegelring en uw snoer en uw staf, die u in uw hand heeft; dat gaf hij haar, en hij ging bij haar in, en zij werd zwanger van hem.", "1 Tim 4:1-3": "De Geest zegt uitdrukkelijk dat in de laatste tijden sommigen zullen afvallen van het geloof, doordat zij zich gaan richten op verleidende geesten en leringen van demonen, door de huichelarij van leugensprekers, die hun eigen geweten als met een brandijzer hebben dichtgeschroeid; die verbieden te trouwen, en gebieden dat men zich onthoudt van voedsel dat God geschapen heeft om met dankzegging genuttigd te worden door de gelovigen, die de waarheid hebben leren kennen.", "Mark 13:13": "En u zult door allen gehaat worden, omwille van Mijn Naam; maar wie zal volharden tot het einde, die zal behouden worden.", "Hand 3:23": "En het zal gebeuren dat iedere ziel die niet naar deze Profeet zal hebben geluisterd, uitgeroeid zal worden uit het volk.", "Deut 32:35": "Aan Mij is de wraak en de vergelding, op de tijd dat hun voet zal wankelen; want de dag van hun ondergang is nabij, en de dingen die hun zullen gebeuren, haasten zich.", "Ezech 16:56": "Ja, uw zuster Sodom is in uw mond niet genoemd geweest, in de dagen van uw grote hoogmoed,", "Spr 12:9": "Beter is hij die zich gering acht en een knecht heeft, dan hij die zichzelf eert en gebrek heeft aan het brood.", "Ezech 11:3": "Die zeggen: Men moet niet snel huizen bouwen; deze stad is de pot, en wij zijn het vlees.", "Luk 22:64": "En toen zij Hem geblinddoekt hadden, sloegen zij Hem in het gezicht, en vroegen Hem: Profeteer, wie is het die U geslagen heeft?", "Ps 106:25": "Maar zij morden in hun tenten; naar de stem van de HEERE luisterden zij niet.", "Joh 10:8": "Allen die vóór Mij zijn gekomen, zijn dieven en rovers; maar de schapen hebben hen niet gehoord.", "Hos 10:10": "Het is Mijn wens, dat Ik hen zal tuchtigen; en volken zullen tegen hen verzameld worden, wanneer Ik hen bind in hun twee voren.", "Luk 16:22-28": "En het gebeurde dat de bedelaar stierf, en door de engelen gedragen werd in de schoot van Abraham; en de rijke stierf ook, en werd begraven. En toen hij in de hel zijn ogen ophief, terwijl hij in de pijn was, zag hij Abraham van verre, en Lazarus in zijn schoot. En hij riep en zei: Vader Abraham, ontferm u over mij, en zend Lazarus, dat hij het uiterste puntje van zijn vinger in het water dompelt, en mijn tong verkoelt; want ik lijd pijn in deze vlam.", "Rom 6:16": "Weet u niet dat aan wie u uzelf ter beschikking stelt als dienstknechten tot gehoorzaamheid, u dienstknechten bent van hem die u gehoorzaamt, óf van de zonde tot de dood, óf van de gehoorzaamheid tot gerechtigheid?", "Matt 7:23": "En dan zal Ik hun openlijk zeggen: Ik heb u nooit gekend; ga weg van Mij, u die de ongerechtigheid werkt!", "2 Sam 2:26": "Toen riep Abner naar Joab en zei: Zal het zwaard dan eeuwig verslinden? Weet u niet, dat het uiteindelijk bitterheid zal zijn? En hoe lang zal het duren voordat u het volk zegt dat zij terugkeren van hun broeders te vervolgen?", "Spr 14:12": "Er is een weg die iemand recht schijnt; maar het einde ervan is de weg van de dood.", "Jer 11:22": "Daarom, zo zegt de HEERE van de heerscharen¹: Zie, Ik zal met een bezoeking over hen komen: de jongemannen zullen door het zwaard sterven, hun zonen en hun dochters zullen van honger sterven.", "1 Kon 22:24": "Toen kwam Zedekia, de zoon van Kenaana, dichterbij en sloeg Micha op de wang, en hij zei: Langs welke weg is de geest van de HEERE van mij weggegaan om u aan te spreken?", "Hos 13:3": "Daarom zullen zij zijn als een morgenwolk, en als een vroege dauw, die heengaat; als kaf van de dorsvloer, en als rook uit de schoorsteen, weggejaagd door de wind.", "2 Tim 3:6": "Want tot hen behoren zij die de huizen binnensluipen en de vrouwtjes gevangen nemen die met zonden beladen zijn en door allerlei begeerten gedreven worden,", "Mal 3:13": "Uw woorden zijn tegen Mij te sterk geworden, zegt de HEERE; maar u zegt: Wat hebben wij tegen U gesproken?", "Hos 4:9": "Daarom, zoals het volk, zo zal de priester zijn; en Ik zal zijn wegen aan hem bezoeken¹, en zijn daden hem vergelden.", "Micha 2:2": "En zij begeren akkers en roven ze, en huizen, en nemen ze weg; zo doen zij de man en zijn huis geweld aan, ja, ieder en zijn erfenis.", "Jes 5:20": "Wee hun die het kwade goed noemen, en het goede kwaad; die duisternis tot licht stellen, en het licht tot duisternis; die het bittere tot zoet stellen, en het zoete tot bitterheid!", "Ps 36:13": "Daar zijn de werkers van de ongerechtigheid gevallen; zij zijn neergestoten, en kunnen niet weer opstaan.", "Ps 42:4": "Mijn tranen zijn mij tot voedsel, dag en nacht, omdat ze de hele dag tegen mij zeggen: Waar is uw God?", "1 Tim 6:20": "O Timotheüs, bewaar het pand dat u toevertrouwd is, en keer u af van het ongoddelijk zinloos gepraat en van de tegenstellingen van de ten onrechte zo genoemde wetenschap;", "Ezech 20:49": "En ik zei: Ach, Heere HEERE, zij zeggen van mij: Spreekt hij niet in gelijkenissen?", "Job 36:17": "Maar u hebt het oordeel van de goddeloze vervuld; het oordeel en het recht houden u vast.", "Ex 34:7": "Die de goedertierenheid bewaart aan vele duizenden, Die de ongerechtigheid, en overtreding, en zonde vergeeft; Die de schuldige geenszins onschuldig houdt, en de ongerechtigheid van de vaders bezoekt aan de kinderen, en aan de kindskinderen, tot in het derde en vierde geslacht.", "Ezech 39:17-19": "U dan, mensenkind! Zo zegt de Heere HEERE: Zeg tegen het gevogelte van elke vleugel, en tegen alle dieren van het veld: Verzamel u, en kom aan, verzamel u van rondom, bij Mijn slachtoffer dat Ik voor u geslacht heb, een groot slachtoffer, op de bergen van Israël, en eet vlees, en drink bloed. Het vlees van de helden zult u eten, en het bloed van de vorsten van de aarde drinken; van rammen, van lammeren, en bokken, en stieren, die allemaal gemest zijn van Basan. En u zult het vet eten tot verzadiging toe, en bloed drinken tot dronkenschap toe; van Mijn slachtoffer, dat Ik voor u geslacht heb.", "Jes 65:13-15": "Daarom zegt de Heere HEERE zo: Zie, Mijn knechten zullen eten, maar u zult hongeren; zie, Mijn knechten zullen drinken, maar u zult dorsten; zie, Mijn knechten zullen blij zijn, maar u zult beschaamd zijn. Zie, Mijn knechten zullen juichen van een goed hart, maar u zult schreeuwen van harteleed, en van verbreking van de geest zult u huilen. En u zult uw naam voor Mijn uitverkorenen tot een vervloeking laten; en de Heere HEERE zal u doden, maar Zijn knechten zal Hij met een andere naam noemen;", "Spr 20:20": "Wie zijn vader of zijn moeder vervloekt, diens lamp zal uitgeblust worden in zwarte duisternis.", "2 Sam 16:5-9": "Toen koning David tot bij Bahurim kwam, zie, daar kwam een man vandaan uit het geslacht van het huis van Saul, van wie de naam Simeï was, de zoon van Gera; hij liep almaar door en vloekte. En hij gooide David met stenen, en ook alle knechten van koning David, hoewel al het volk en alle helden aan zijn rechter- en aan zijn linkerhand waren. Zo zei Simeï, terwijl hij vloekte: Ga weg, ga weg, man van bloed, en man van Belial!", "Deut 10:17": "Want de HEERE, uw God, is een God der goden, en een Heere der heren; die grote, die machtige, en die ontzagwekkende God, Die niemand aanziet naar het aangezicht, en geen geschenk aanneemt;", "Job 20:13": "Al spaart hij het en laat het niet los, maar houdt het midden in zijn gehemelte binnen;", "Ps 128:2": "Want u zult eten van het werk van uw handen; gelukkig zult u zijn, en het zal u goed gaan.", "Amos 2:3": "En Ik zal de rechter uit het midden van haar uitroeien; en al haar vorsten zal Ik met hem doden, zegt de HEERE.", "Richt 11:27": "Ik heb ook niet tegen u gezondigd, maar u doet mij onrecht aan door tegen mij te strijden. De HEERE, Die Rechter is, oordele vandaag tussen de kinderen van Israël en de kinderen van Ammon!", "Matt 21:5": "Zeg tegen de dochter van Sion: Zie, uw Koning komt naar u toe, zachtmoedig en gezeten op een ezelin, en een veulen, het jong van een lastdier.", "Rom 8:8": "En zij die in het vlees zijn, kunnen God niet behagen.", "Zach 10:3": "Tegen de herders was Mijn toorn ontstoken, en over de bokken heb Ik bezoeking gedaan; maar de HEERE van de heerscharen³ zal Zijn kudde bezoeken, het huis van Juda, en Hij zal hen stellen als het paard van Zijn majesteit in de strijd.", "Ps 21:10": "U zult hen zetten als een vurige oven ter tijd van uw toornige aangezicht; de HEERE zal hen in Zijn toorn verslinden, en het vuur zal hen verteren.", "Rom 16:17": "En ik bid u, broeders, let op degenen die tweedracht en ergernissen veroorzaken, tegen de leer die u geleerd hebt; en blijf bij hen vandaan.", "Ezech 18:9-19": "In Mijn inzettingen wandelt, en Mijn rechten onderhoudt, om trouw te handelen; die rechtvaardige zal zeker leven, spreekt de Heere HEERE. Heeft hij nu een zoon voortgebracht, die een inbreker is, die bloed vergiet, die zijn broeder een van deze dingen aandoet; En die al die dingen zelf niet doet; maar ook eet op de bergen, en de vrouw van zijn naaste onteert;", "1 Sam 15:32": "Toen zei Samuël: Breng Agag, de koning van de Amalekieten, hier bij mij. Agag nu ging vol vertrouwen naar hem toe; en Agag zei: Voorwaar, de bitterheid van de dood is geweken!", "Spr 25:14": "Een man die zichzelf beroemt op een valse gift, is als wolken en wind, waar geen regen bij is.", "Jes 45:9": "Wee hem die met zijn Formeerder twist, zoals een potscherf met aarden potscherven! Zal ook het leem tegen zijn formeerder zeggen: Wat maakt u? of zal uw werk zeggen: Hij heeft geen handen?", "Spr 21:19": "Het is beter te wonen in een woest land, dan bij een zeer kijfachtige en toornige vrouw.", "Jer 7:18": "De kinderen rapen hout, en de vaders steken het vuur aan, en de vrouwen kneden het deeg, om koeken te maken voor de koningin van de hemel, en drankoffers te offeren aan andere goden, om Mij verdriet aan te doen.", "Jes 3:1-8": "Want zie, de Heere, HEERE van de heerscharen, zal van Jeruzalem en van Juda wegnemen de stok en de staf, elke stok van het brood, en elke stok van het water; De held en de krijgsman, de rechter en de profeet, en de waarzegger, en de oude; De leider van vijftig, en de aanzienlijke, en de raadsman, en de wijze onder de werkmeesters, en hem die welbespraakt is.", "Job 4:17": "Zou een mens rechtvaardiger zijn dan God? Zou een man reiner zijn dan zijn Maker?", "Spr 12:2": "De goede zal een welgevallen krijgen van de HEERE; maar een man van schandelijke verdichtsels zal Hij verdoemen.", "Num 31:50": "Daarom hebben wij een offergave voor de HEERE gebracht, ieder wat hij gekregen heeft: een gouden voorwerp, een keten, of een armring, een vingerring, een oorring, of een hangende sieraad, om voor onze zielen verzoening te doen voor het aangezicht van de HEERE.", "1 Kor 3:18": "Niemand bedriegt zichzelf. Als iemand onder u denkt dat hij wijs is in deze wereld, die moet dwaas worden, opdat hij wijs mag worden.", "Gen 19:5-9": "En zij riepen Lot toe, en zeiden tegen hem: Waar zijn die mannen die deze nacht bij u gekomen zijn? Breng hen naar buiten, naar ons toe, opdat wij met hen gemeenschap hebben. Toen ging Lot naar buiten naar hen toe, bij de deur, en hij sloot de deur achter zich toe; en hij zei: Mijn broeders! Doe toch geen kwaad!", "Neh 9:34-37": "En onze koningen, onze vorsten, onze priesters en onze vaders hebben Uw wet niet gedaan; en zij hebben niet geluisterd naar Uw geboden, en naar Uw getuigenissen, waarmee U tegen hen getuigde. Want zij hebben U niet gediend in hun koninkrijk, en in Uw overvloedige goed, dat U hun gaf, en in dat wijde en dat vette land, dat U voor hun aangezicht gegeven had; en zij hebben zich niet bekeerd van hun slechte werken. Zie, wij zijn heden knechten; ja, het land, dat U onze vaderen gegeven hebt, om de vrucht daarvan, en het goede daarvan te eten, zie, daarin zijn wij knechten.", "Spr 27:22": "Al stampte u de dwaas in een vijzel met een stamper, midden tussen het gestoten graan, zijn dwaasheid zou niet van hem wijken.", "Rom 8:13": "Want als u naar het vlees leeft, zult u sterven; maar als u door de Geest de daden van het lichaam doodt, zult u leven.", "Luk 8:18": "Let er dan op hoe u hoort; want wie heeft, aan hem zal gegeven worden; en wie niet heeft, ook wat hij meent te hebben zal van hem afgenomen worden.", "Jer 10:10": "Maar de HEERE God is de Waarheid, Hij is de levende God, en een eeuwige Koning; van Zijn verbolgenheid beeft de aarde, en de heidenen kunnen Zijn gramschap niet verdragen.", "Luk 12:4": "En Ik zeg u, Mijn vrienden: wees niet bang voor hen die het lichaam doden, en daarna niets meer kunnen doen.", "Matt 12:34": "Adderengebroed! Hoe kunt u goede dingen spreken, terwijl u slecht bent? Want uit de overvloed van het hart spreekt de mond.", "2 Kron 33:6": "En hij deed zijn zonen door het vuur gaan, in het dal van de zoon van Hinnom, en pleegde toverij, en gaf op vogelgeschrei acht, en toverde, en hij stelde waarzeggers en duivelskunstenaars aan; en hij deed zeer veel kwaads in de ogen van de HEERE, om Hem tot toorn te verwekken.", "Hos 2:8-12": "Daarom zal Ik terugkomen, en Mijn koren wegnemen op zijn tijd, en Mijn nieuwe wijn op zijn vastgestelde tijd; en Ik zal Mijn wol en Mijn vlas wegrukken, dat diende om haar naaktheid te bedekken. En nu zal Ik haar schaamteloosheid ontdekken voor de ogen van haar minnaars; en niemand zal haar uit Mijn hand redden. En Ik zal al haar vrolijkheid doen ophouden, haar feesten, haar nieuwe maanden, en haar sabbatten, ja, al haar vastgestelde hoogtijden.", "1 Kor 15:22": "Want zoals zij allen in Adam sterven, zo zullen zij ook in Christus allen levend gemaakt worden.", "Jes 32:6": "Want een dwaas spreekt dwaasheid, en zijn hart doet ongerechtigheid, om huichelarij te plegen, en om dwaling te spreken tegen de HEERE, om de ziel van de hongerige leeg te laten, en de dorstige drank te doen ontbreken.", "1 Kor 11:18": "Want eerst, als u samenkomt in de Gemeente, hoor ik dat er scheuringen onder u zijn; en ik geloof het ten dele;", "Dan 8:10": "En hij werd groot tot aan het leger van de hemel; en hij wierp sommigen van dat leger, namelijk van de sterren, neer ter aarde, en vertrapte ze.", "Jer 23:1": "Wee de herders, die de schapen van Mijn weide ombrengen en verstrooien! spreekt de HEERE.", "Luk 21:20-26": "Maar wanneer u zult zien dat Jeruzalem door legers omsingeld wordt, weet dan, dat haar verwoesting nabij gekomen is. Laten dan zij die in Judea zijn, vluchten naar de bergen; en zij die in het midden ervan zijn, daaruit trekken; en zij die op de velden zijn, daar niet in komen. Want dit zijn dagen van wraak, opdat alles vervuld wordt wat geschreven is.", "1 Petr 3:4": "maar de verborgen mens van het hart, in het onverderfelijke sieraad van een zachtmoedige en stille geest, die kostbaar is voor God.", "1 Kron 21:12": "Of drie jaren honger, of drie maanden verteerd te worden voor het aangezicht van uw tegenstanders, en dat het zwaard van uw vijanden u achterhaalt; of drie dagen het zwaard van de HEERE, dat is, de pestilentie in het land, en een verdervende engel van de HEERE in al de gebieden van Israël? Zo bezie nu goed, wat antwoord ik Hem zal teruggeven, Die mij gezonden heeft.", "Lev 21:20": "Of die een bochel heeft, of een dwerg is, of een vlies op zijn oog heeft, of droge schurftheid, of etterige schurftheid, of die gebroken is aan zijn geslachtsdeel.", "Jes 28:14": "Daarom, hoor het woord van de HEERE, u bespotters, u die heersen over dit volk, dat in Jeruzalem is!", "2 Kor 2:16": "voor de laatsten een geur van dood tot dood, maar voor de eersten een geur van leven tot leven. En wie is hiertoe bekwaam?", "Job 13:2": "Zoals u het weet, weet ik het ook; ik zwicht niet voor u.", "Ps 103:6": "De HEERE doet gerechtigheid en recht aan allen die onderdrukt worden.", "Rom 6:21": "Wat voor vrucht had u toen van die dingen waarover u zich nu schaamt? Want het einde daarvan is de dood.", "Jak 2:13": "Want een onbarmhartig oordeel zal komen over hem die geen barmhartigheid bewezen heeft; en de barmhartigheid triomfeert over het oordeel.", "Ezech 18:4-9": "Zie, alle zielen zijn van Mij; zoals de ziel van de vader, zo is ook de ziel van de zoon van Mij; de ziel die zondigt, die zal sterven. Wanneer nu iemand rechtvaardig is, en recht en gerechtigheid doet; Niet eet op de bergen, en zijn ogen niet opheft tot de drekgoden van het huis van Israël; noch de vrouw van zijn naaste onteert, noch tot een vrouw tijdens haar menstruatie nadert;", "Jes 14:4-20": "dan zult u deze spreuk aanheffen tegen de koning van Babel, en zeggen: Hoe houdt de onderdrukker op! Hoe houdt de gouden stad op! De HEERE heeft de stok van de goddelozen gebroken, de scepter van de heersers. Die de volken sloeg in verbolgenheid met een plaag zonder ophouden, die in toorn over de heidenvolken heerste, wordt vervolgd, zonder dat iemand het kan afweren.", "Mal 2:9": "Daarom heb Ik u ook verachtelijk en onwaard gemaakt voor heel het volk, omdat u Mijn wegen niet houdt, maar partijdig bent in de wet.", "Ps 4:7": "Velen zeggen: Wie zal ons het goede laten zien? Verhef U over ons het licht van uw aangezicht, o HEERE!", "Jes 29:20": "Wanneer de tiran een einde zal hebben, en het met de spotter voorbij zal zijn, en allen die op ongerechtigheid loeren, uitgeroeid zullen zijn;", "Mark 9:43": "En als uw hand u doet struikelen, hak hem af; het is beter voor u verminkt het leven in te gaan, dan met twee handen naar de hel te gaan, in het onblusbare vuur;", "Jer 29:19": "Omdat zij naar Mijn woorden niet geluisterd hebben, spreekt de HEERE, toen Ik Mijn knechten, de profeten, tot hen zond, vroeg opstaand en zendend; maar u hebt niet geluisterd, spreekt de HEERE.", "Spr 7:17": "Ik heb mijn bed met mirre, aloë en kaneel geurig gemaakt;", "Job 36:12": "Maar als zij niet horen, dan gaan zij door het zwaard om, en geven zij de geest zonder kennis.", "Num 20:2": "En er was geen water voor de vergadering; toen verzamelden zij zich tegen Mozes en tegen Aäron.", "Ezech 22:21": "Ja, Ik zal u bijeenbrengen, en op u blazen in het vuur van Mijn verbolgenheid, zodat u in het midden ervan zult smelten.", "Job 5:14": "Overdag ontmoeten zij de duisternis, en zoals 's nachts tasten zij rond in de middag.", "Spr 14:9": "Elke dwaas maakt de schuld belachelijk; maar onder de oprechten is goedwilligheid.", "Pred 2:26": "Want Hij geeft wijsheid, kennis en vreugde aan de mens die goed is voor Zijn aangezicht; maar aan de zondaar geeft Hij de bezigheid om te verzamelen en te vergaderen, opdat Hij het geeft aan wie goed is voor Gods aangezicht. Dit is ook ijdelheid en kwelling van de geest.", "1 Kor 1:29": "Opdat geen vlees zou roemen voor Hem.", "1 Tim 2:9": "Evenzo ook, dat de vrouwen, in eerbaar gewaad, zichzelf sieren met schaamte en ingetogenheid, niet met vlechtingen van het haar, of goud, of parels, of kostbare kleding;", "Job 11:20": "Maar de ogen van de goddelozen zullen bezwijken, en de toevlucht zal van hen vergaan; en hun verwachting zal zijn de laatste ademtocht.", "Ps 82:2": "Hoelang zult u onrecht oordelen, en het aangezicht van de goddelozen aannemen? Sela.", "Job 35:9": "Vanwege de grootheid van hun onderdrukking doen zij de onderdrukten roepen; zij schreeuwen vanwege de arm van de groten.", "Job 9:15": "Aan wie ik, ook al was ik rechtvaardig, niet zou antwoorden; mijn Rechter zal ik om genade bidden.", "Jak 1:15": "Daarna, als de begeerte ontvangen is, baart zij zonde; en als de zonde volgroeid is, baart zij de dood.", "Luk 6:23": "Verblijd u op die dag, en wees vrolijk; want zie, uw loon is groot in de hemel; want hun vaders deden hetzelfde met de profeten.", "Hand 13:10": "O kind van de duivel, vol van alle bedrog en van alle arglistigheid, vijand van alle gerechtigheid, zult u niet ophouden de rechte wegen van de Heere te verdraaien?", "Luk 16:14": "En al deze dingen hoorden ook de Farizeeën, die geldgierig waren, en zij beschimpten Hem.", "Ps 37:12": "Zain. De goddeloze bedenkt listige plannen tegen de rechtvaardige, en knerst met zijn tanden over hem.", "2 Petr 3:16": "Zoals hij ook in alle brieven doet, wanneer hij daarin over deze dingen spreekt; waarin sommige dingen moeilijk te begrijpen zijn, die de onkundige en onstandvastige mensen verdraaien, zoals ook de andere Schriften, tot hun eigen verderf.", "Spr 27:15": "Een aanhoudend druppelen op een dag van slagregen en een twistzieke huisvrouw zijn precies gelijk.", "2 Kron 33:7": "Hij stelde ook de gelijkenis van een gesneden beeld, dat hij gemaakt had, in het huis van God, waarvan God gezegd had tot David en tot zijn zoon Salomo: In dit huis, en te Jeruzalem, dat Ik uit alle stammen van Israël verkozen heb, zal Ik Mijn Naam zetten tot in eeuwigheid.", "2 Petr 2:21": "Want het zou beter voor hen geweest zijn de weg van de gerechtigheid niet gekend te hebben, dan die gekend te hebben en zich weer af te keren van het heilige gebod dat hun overgeleverd was.", "Rom 9:14": "Wat zullen wij dan zeggen? Is er onrechtvaardigheid bij God? Dat zij verre.", "Ps 7:15-17": "Zie, hij is zwanger van onrecht, en heeft moeite ontvangen, hij zal leugen baren. Hij heeft een kuil gegraven, en hem uitgegraven, maar hij is gevallen in de groeve, die hij gemaakt heeft. Zijn moeite zal op zijn eigen hoofd terugkeren, en zijn geweld op zijn eigen schedel neerdalen.", "Jer 49:3": "Huil, o Hesbon! want Ai is verwoest; roep, dochters van Rabba, gord zakken aan, drijf misbaar, en loop heen en weer bij de tuinen; want Malcham zal wandelen in gevangenschap, zijn priesters en zijn vorsten samen.", "Lev 26:16": "Dan zal Ik u dit ook doen: Ik zal over u schrik stellen, tering en koorts, die de ogen verteren en de ziel pijnigen; u zult ook uw zaad tevergeefs zaaien, en uw vijanden zullen dat opeten.", "Ex 20:6": "en Die barmhartigheid doe aan duizenden van hen die Mij liefhebben en Mijn geboden onderhouden.", "Jes 22:19": "En Ik zal u wegstoten van uw positie, en van uw plaats zal Hij u neerhalen.", "Zach 5:2-4": "En Hij zei tegen mij: Wat ziet u? En ik zei: Ik zie een vliegende rol, de lengte ervan is twintig el, en de breedte ervan tien el. Toen zei Hij tegen mij: Dit is de vloek die uitgaan zal over heel het land; want ieder die steelt, zal hiervandaan, volgens deze vloek, uitgeroeid worden; en ieder die valselijk zweert, zal hiervandaan, volgens deze vloek, uitgeroeid worden. Ik breng deze vloek naar buiten, spreekt de HEERE van de heerscharen, dat hij komt in het huis van de dief, en in het huis van hem die bij Mijn Naam vals zweert; en hij zal midden in zijn huis overnachten, en hij zal het verteren, met zijn hout en zijn stenen.", "Ps 56:8": "Zouden zij om hun ongerechtigheid vrijuit gaan? Stort de volken neder in toorn, o God!", "Amos 8:14": "Zij die zweren bij de schuld van Samaria, en zeggen: Zo waarachtig als uw God van Dan leeft, en de weg van Berseba leeft! zij zullen vallen, en niet meer opstaan.", "Openb 16:9": "En de mensen werden verhit met grote hitte, en lasterden de Naam van God, Die macht heeft over deze plagen; en zij bekeerden zich niet, om Hem eer te geven.", "Spr 30:17": "Het oog dat de vader bespot, of de gehoorzaamheid aan de moeder veracht, dat zullen de raven van de beek uitpikken, en de jongen van de arend zullen het eten.", "Jer 18:21": "Daarom, geef hun zonen over aan de honger, en doe hen wegvloeien door het geweld van het zwaard, en laat hun vrouwen van kinderen beroofd en weduwe worden, en laat hun mannen door de dood omgebracht worden, en hun jongemannen met het zwaard geslagen worden in de strijd.", "Luk 11:35": "Kijk dan uit, dat niet het licht dat in u is, duisternis is.", "Klaagl 2:14": "Nun. Uw profeten hebben u ijdelheid en ongerijmdheid gezien, en zij hebben u uw ongerechtigheid niet geopenbaard, om uw gevangenschap af te wenden, maar zij hebben voor u gezien ijdele lasten en uitstotingen.", "Matt 20:20-27": "Toen kwam de moeder van de zonen van Zebedeüs met haar zonen naar Hem toe, boog zich voor Hem neer, en vroeg Hem iets. En Hij zei tegen haar: Wat wilt u? Zij zei tegen Hem: Zeg dat deze twee zonen van mij mogen zitten, de een aan Uw rechterhand en de ander aan Uw linkerhand in Uw Koninkrijk. Maar Jezus antwoordde en zei: U weet niet wat u vraagt; kunt u de drinkbeker drinken die Ik drinken zal, en met de doop gedoopt worden waarmee Ik gedoopt word? Zij zeiden tegen Hem: Wij kunnen dat.", "Ezech 7:4-6": "En Mijn oog zal u niet verschonen, en Ik zal niet sparen; maar Ik zal uw wegen op u brengen, en uw gruwelen zullen in het midden van u zijn, en u zult weten dat Ik de HEERE ben. Zo zegt de Heere HEERE: Een kwaad, een enig kwaad, zie, is gekomen; Een einde is er gekomen, dat einde is gekomen, het is opgewaakt tegen u; zie, het kwaad is gekomen!", "Gal 1:6-8": "Ik verwonder mij dat u zo snel, wijkend van hem die u in de genade van Christus geroepen heeft, overgebracht wordt naar een ander evangelie; terwijl er geen ander is; maar er zijn sommigen die u in verwarring brengen, en het Evangelie van Christus willen verdraaien. Maar al zouden wij, of een engel uit de hemel, u een evangelie verkondigen naast wat wij u verkondigd hebben, laat hij vervloekt zijn.", "Spr 17:15": "Wie de goddeloze rechtvaardigt, en de rechtvaardige veroordeelt, zijn de HEERE een gruwel, zij beiden.", "1 Kor 4:5": "Oordeel dan niets vóór de tijd, totdat de Heere gekomen zal zijn, Die ook in het licht zal brengen wat in de duisternis verborgen is, en de plannen van de harten openbaar zal maken; en dan zal ieder lof van God ontvangen.", "Hab 2:5": "En ook omdat hij trouweloos handelt bij de wijn, een trots man is, en niet in zijn woning blijft; die zijn ziel wijd opendoet als het graf, en is als de dood, die niet verzadigd wordt, en tot zich verzamelt alle heidenvolken, en tot zich bijeenbrengt alle volken.", "1 Kor 5:6": "Uw roem is niet goed. Weet u niet dat een beetje zuurdesem het hele deeg zuur maakt?", "Jes 30:33": "Want Tofeth is van oudsher bereid; ja, hij is ook voor de koning bereid; Hij heeft hem diep en wijd gemaakt, het vuur en hout van zijn brandstapel is veel; de adem van de HEERE zal hem aansteken als een zwavelstroom.", "Ps 105:16": "Hij riep ook een honger over het land; Hij brak elke staf van het brood.", "Jes 58:4": "Zie, tot twist en gekijf vast u, en om goddeloos met de vuist te slaan; vast niet zoals vandaag, om uw stem te doen horen in de hoogte.", "Job 5:3": "Ik heb een dwaas gezien die wortel schoot; doch meteen vervloekte ik zijn woning.", "Spr 11:3": "De oprechtheid van de oprechten leidt hen; maar de verkeerdheid van de trouwelozen verstoort hen.", "Ezech 44:8": "En u hebt de wacht van Mijn heilige dingen niet in acht genomen; maar u hebt uzelf enigen tot wachters van Mijn wacht gesteld in Mijn heiligdom.", "Hand 13:45": "Doch de Joden, die de menigten zagen, werden vervuld met afgunst, en weerspraken wat door Paulus gezegd werd, en tegenspraken en lasterden.", "Ezech 7:18": "Ook zullen zij zakken aangorden, gruwen zal hen bedekken, en over alle gezichten zal schaamte zijn, en op al hun hoofden kaalheid.", "Jer 15:8": "Hun weduwen zijn Mij meer geworden dan het zand van de zeeën; Ik heb hun over de moeder een jongeman doen komen, een verwoester op de middag; Ik heb hem haastig hen doen overvallen, de stad met verschrikkingen.", "Luk 13:9": "en als hij dan vrucht draagt, laat hem staan; maar zo niet, dan kunt u hem daarna omhakken.", "Jer 48:10": "Vervloekt is hij die het werk van de HEERE bedrieglijk doet; ja, vervloekt is hij die zijn zwaard van het bloed onthoudt!", "Ps 33:18": "Zie, het oog van de HEERE is over hen die Hem vrezen, op hen die op Zijn goedertierenheid hopen.", "Luk 19:12-27": "Hij zei dan: Een man van hoge afkomst reisde naar een ver land om voor zichzelf een koninkrijk te ontvangen, en dan terug te keren. En hij riep zijn tien dienstknechten, gaf hun tien ponden, en zei tegen hen: Doe er zaken mee totdat ik terugkom. Maar zijn burgers haatten hem, en stuurden gezanten achter hem aan, die zeiden: Wij willen niet dat deze man koning over ons wordt.", "Matt 25:24-27": "Maar hij die het ene talent ontvangen had, kwam ook en zei: Heer, ik kende u, dat u een hard mens bent, die maait waar u niet gezaaid hebt, en verzamelt vandaar waar u niet gestrooid hebt; En ik was bang, en ben weggegaan, en heb uw talent verborgen in de aarde; zie, u hebt het uwe. Maar zijn heer antwoordde en zei tegen hem: U slechte en luie dienstknecht! U wist dat ik maai waar ik niet gezaaid heb, en vandaar verzamel waar ik niet gestrooid heb.", "Hos 13:9": "Het heeft u te gronde gericht, o Israël! Want in Mij is uw hulp.", "Jes 29:16": "Uw omkeren van de dingen is, alsof de pottenbakker geacht werd als leem, dat het maaksel zei van zijn maker: Hij heeft mij niet gemaakt; en het gevormde vat zei van zijn pottenbakker: Hij begrijpt het niet.", "Matt 25:34-46": "Dan zal de Koning zeggen tegen hen die aan Zijn rechterhand zijn: Kom, u gezegenden van Mijn Vader! Beërf het Koninkrijk dat voor u bereid is vanaf de grondlegging van de wereld. Want Ik ben hongerig geweest, en u hebt Mij te eten gegeven; Ik ben dorstig geweest, en u hebt Mij te drinken gegeven; Ik was een vreemdeling, en u hebt Mij een onderkomen gegeven. Ik was naakt, en u hebt Mij gekleed; Ik ben ziek geweest, en u hebt Mij bezocht; Ik was in de gevangenis, en u bent bij Mij gekomen.", "Luk 13:27": "En Hij zal zeggen: Ik zeg u, Ik weet niet waar u vandaan komt; ga weg van Mij, allen die ongerechtigheid werken!", "Job 4:9": "Van de adem van God komen zij om, en van het geblaas van Zijn neus worden zij verdaan.", "Joël 3:13-16": "Sla de sikkel erin, want de oogst is rijp geworden; kom, daal af, want de pers is vol, en de perskuipen lopen over; want hun slechtheid is groot. Menigten, menigten in het dal van de beslissing; want de dag van de HEERE is nabij, in het dal van de beslissing. De zon en de maan zijn zwart geworden, en de sterren hebben hun glans ingetrokken.", "Mal 3:18": "Dan zult u opnieuw zien het onderscheid tussen de rechtvaardige en de goddeloze, tussen wie God dient, en wie Hem niet dient.", "Jer 6:7": "Zoals een bornput zijn water opgeeft, zo geeft zij haar boosheid op; geweld en verstoring wordt in haar gehoord, weedom en plaging is voortdurend voor Mijn aangezicht.", "Lev 26:26": "Als Ik u de staf van het brood zal hebben gebroken, dan zullen tien vrouwen uw brood in één oven bakken, en zullen uw brood bij het gewicht teruggeven; en u zult eten, maar niet verzadigd worden.", "Gal 6:5-10": "Want ieder zal zijn eigen pak dragen. En wie onderwezen wordt in het Woord, moet delen van alle goederen met hem die hem onderwijst. Dwaal niet; God laat Zich niet bespotten; want wat de mens ook zaait, dat zal hij ook maaien.", "Joh 3:19": "En dit is het oordeel: dat het licht in de wereld gekomen is, en de mensen hebben de duisternis liever gehad dan het licht; want hun werken waren slecht.", "Amos 8:10": "En Ik zal uw feesten in rouw veranderen, en al uw liederen in weeklacht, en op alle lendenen een zak brengen, en op elk hoofd kaalheid; en Ik zal het land in rouw brengen als over een enige zoon, en het einde ervan als een bittere dag.", "Luk 6:22": "Zalig bent u, wanneer de mensen u haten, en wanneer zij u buitensluiten, en u smaden, en uw naam als kwaad verwerpen, omwille van de Zoon des mensen.", "Spr 21:9": "Het is beter te wonen op een hoek van het dak, dan met een kijfachtige vrouw, en dat in een huis van gezelschap.", "2 Tim 3:2": "Want de mensen zullen zijn: liefhebbers van zichzelf, geldgierig, grootsprakerig, hoogmoedig, lasteraars, aan hun ouders ongehoorzaam, ondankbaar, onheilig,", "1 Kon 4:23": "Tien vette runderen, en twintig weiderunderen, en honderd schapen; niet meegerekend de herten, en reeën, en buffels, en gemeste vogels.", "Jes 63:19": "Wij zijn geworden als zij over wie U van ouds niet hebt geheerst, en die naar Uw Naam niet genoemd zijn.", "Jer 7:33": "En de dode lichamen van dit volk zullen voedsel zijn voor het gevogelte van de hemel en het gedierte van de aarde, en niemand zal ze verjagen.", "Jes 1:15": "En als u uw handen uitspreidt, verberg Ik Mijn ogen voor u; ook wanneer u het gebed vermenigvuldigt, hoor Ik niet; want uw handen zijn vol bloed.", "Jer 2:22-25": "Want, al wast u zich met salpeter, en nam u veel zeep, toch is uw ongerechtigheid voor Mijn aangezicht getekend, spreekt de Heere HEERE. Hoe zegt u: Ik ben niet verontreinigd, ik heb de Baäls niet nagewandeld? Zie uw weg in het dal, ken wat u gedaan hebt, u lichte, snelle kemelin, die haar wegen verdraait! Zij is een woudezelin, gewend aan de woestijn, naar de lust van haar ziel schept zij de wind; wie zou haar ontmoeting kunnen afkeren? Allen die haar zoeken, zullen niet moe worden, in haar maand zullen zij haar vinden.", "Spr 28:18": "Wie oprecht wandelt, zal behouden worden; maar wie zich verkeerd gedraagt op twee wegen, zal op een van de twee vallen.", "1 Sam 24:14": "Zoals het spreekwoord van de ouden zegt: Van de goddelozen komt goddeloosheid voort; maar mijn hand zal niet tegen u zijn.", "Amos 4:2": "De Heere HEERE heeft gezworen bij Zijn heiligheid, dat er, zie, dagen over u zullen komen, dat men u zal optrekken met haken, en uw nakomelingen met visangels.", "Ps 75:11": "En ik zal alle hoorns van de goddelozen afhouwen; de hoorns van de rechtvaardige zullen verhoogd worden.", "Spr 15:9": "De weg van de goddelozen is de HEERE een gruwel; maar hem die de gerechtigheid najaagt, zal Hij liefhebben.", "1 Kor 3:8": "En hij die plant en hij die nat maakt, zijn één; maar ieder zal zijn loon ontvangen naar zijn arbeid.", "Ps 144:8": "wier mond leugens spreekt, en wier rechterhand een rechterhand van bedrog is.", "Spr 15:12": "De spotter zal hem die hem bestraft niet liefhebben; hij zal niet naar de wijzen gaan.", "Zach 11:17": "Wee de nietige herder, die de kudde verlaat! Het zwaard zal over zijn arm zijn, en over zijn rechteroog; zijn arm zal helemaal verdorren, en zijn rechteroog zal helemaal donker worden.", "Jes 13:9": "Zie, de dag van de HEERE komt, gruwelijk, met verbolgenheid en hevige toorn, om het land tot verwoesting te stellen, en de zondaars daaruit te verdelgen.", "Hab 2:4": "Zie, wie zich verheft, zijn ziel is niet oprecht in hem; maar de rechtvaardige zal door zijn geloof leven.", "2 Petr 2:9": "dan weet de Heere hoe Hij de godvruchtigen uit de verzoeking moet verlossen, en de onrechtvaardigen moet bewaren tot de dag van het oordeel om gestraft te worden;", "Gen 2:21-24": "Toen deed de HEERE God een diepe slaap op Adam vallen, en hij sliep; en Hij nam een van zijn ribben, en sloot de plaats daarvan toe met vlees. En de HEERE God bouwde de rib, die Hij van Adam genomen had, tot een vrouw, en Hij bracht haar bij Adam. Toen zei Adam: Dit is ditmaal been van mijn benen, en vlees van mijn vlees! Men zal haar Manninne noemen, omdat zij uit de man genomen is.", "Jer 23:2": "Daarom zegt de HEERE, de God van Israël, zo van de herders, die Mijn volk weiden: U hebt Mijn schapen verstrooid, en hebt ze verdreven, en hebt niet naar hen omgezien; zie, Ik zal over u de boosheid van uw handelingen bezoeken, spreekt de HEERE.", "Ezech 16:12": "Ook deed Ik een voorhoofdsieraad aan uw gezicht, en oorringen aan uw oren, en een kroon van heerlijkheid op uw hoofd.", "Hand 23:8": "Want de Sadduceeën zeggen dat er geen opstanding is, en ook geen engel of geest; maar de Farizeeën belijden het beide.", "1 Kron 15:27": "David nu was gekleed met een mantel van fijn linnen; ook alle Levieten die de ark droegen, en de zangers, en Chenanja, de leider van het opheffen van de zang; ook had David een lijfrok van linnen aan.", "Job 36:23": "Wie heeft Hem gesteld over Zijn weg? Of wie heeft gezegd: U hebt onrecht gedaan?", "Ps 50:17-20": "Omdat u de kastijding haat, en Mijn woorden achter u weggooit. Als u een dief ziet, dan loopt u met hem mee; en uw deel is met de overspelers. Uw mond zet u in voor het kwade, en uw tong koppelt bedrog.", "Matt 24:24": "Want er zullen valse christussen en valse profeten opstaan, en zij zullen grote tekenen en wonderen doen, zodat zij, als het mogelijk was, ook de uitverkorenen zouden misleiden.", "Jer 8:16": "Vanuit Dan wordt het gesnuif van zijn paarden gehoord; het hele land beeft van het geluid van het gebries van zijn sterke dieren; en zij komen daarheen om het land op te eten en al wat het bevat, de stad en wie daarin wonen.", "Rom 14:21": "Het is goed geen vlees te eten, en geen wijn te drinken, en niets waaraan uw broeder zich stoot, of geërgerd wordt, of waarin hij zwak is.", "Ezech 22:28": "Haar profeten nu pleisteren hen met loze kalk; zij zien ijdelheid en voorzeggen hun leugen, en zeggen: Zo zegt de Heere HEERE! terwijl de HEERE niet gesproken heeft.", "Ps 9:18": "De goddelozen zullen terugkeren, naar de hel toe, alle heidenen die God vergeten zijn.", "Ps 53:2-6": "De dwaas zegt in zijn hart: Er is geen God; zij verderven het, en zij bedrijven gruwelijk onrecht; er is niemand die goed doet. God heeft uit de hemel neergezien op de mensenkinderen, om te zien of iemand verstandig was, die God zocht. Een ieder van hen is teruggekeerd, samen zijn zij stinkend geworden, er is niemand die goed doet, ook niet één.", "Mark 12:40": "die de huizen van weduwen opeten, en dat onder de schijn van lang te bidden. Dezen zullen een zwaarder oordeel ontvangen.", "Ps 73:6": "Daarom omringt hen de hoogmoed als een keten; het geweld bedekt hen als een gewaad.", "Jes 32:14": "Want het paleis zal verlaten zijn, het gewoel van de stad zal ophouden; Ofel en de wachttorens zullen tot spelonken zijn, tot in eeuwigheid, een vreugde van de woudezels, een weide voor de kudden.", "2 Kor 2:17": "Want wij verkopen niet, zoals velen, het Woord van God, maar wij spreken het in Christus als uit oprechtheid, als uit God, in de tegenwoordigheid van God.", "Joh 3:18": "Wie in Hem gelooft, wordt niet veroordeeld, maar wie niet gelooft, is al veroordeeld, omdat hij niet geloofd heeft in de Naam van de eniggeboren Zoon van God.", "Joël 1:15": "Ach, die dag! Want de dag van de HEERE is nabij, en zal als een verwoesting komen van de Almachtige.", "Ezech 9:9": "Toen zei Hij tot mij: De ongerechtigheid van het huis van Israël en van Juda is heel erg groot, en het land is met bloed vervuld, en de stad is vol van afwijking; want zij zeggen: De HEERE heeft het land verlaten, en de HEERE ziet niet.", "Jer 13:22": "Wanneer u dan in uw hart zult zeggen: Waarom zijn mij deze dingen overkomen? Om de veelheid van uw ongerechtigheid zijn uw zomen ontbloot, en uw hielen hebben geweld geleden.", "Ps 14:1": "Een psalm van David, voor de koorleider. De dwaas zegt in zijn hart: Er is geen God. Zij verderven het, zij maken het gruwelijk met hun werk; er is niemand die goed doet.", "Ps 50:4": "Hij zal roepen tot de hemel van boven, en tot de aarde, om Zijn volk te oordelen.", "Rom 14:14": "Ik weet en ben verzekerd in de Heere Jezus, dat niets onrein is op zichzelf; behalve voor hem die iets acht onrein te zijn, voor hem is het onrein.", "Ps 62:13": "En de goedertierenheid, o Heere! is van U; want U zult ieder vergelden naar zijn werk.", "Jer 9:10-21": "Ik zal een geween en een klaagzang aanheffen over de bergen, en een klaaglied over de herdershutten van de woestijn; want zij zijn afgebrand, zodat er niemand doorgaat, en men hoort er geen stem van vee; van de vogels van de hemel tot de dieren toe zijn zij weggevlucht, weggegaan! En Ik zal Jeruzalem stellen tot steenhopen, tot een woning voor jakhalzen; en de steden van Juda zal Ik stellen tot een verwoesting, zonder inwoner. Wie is de wijze man, die dit begrijpt? En tot wie heeft de mond van de HEERE gesproken, dat hij het verkondigt, waarom het land vergaat en afgebrand is als een woestijn, zodat er niemand doorgaat?", "Gal 6:8": "Want die in zijn eigen vlees zaait, zal uit het vlees verderf maaien; maar die in de Geest zaait, zal uit de Geest het eeuwige leven maaien.", "Ps 18:28": "Want U verlost het bedrukte volk, maar de hoge ogen vernedert U.", "Ps 119:69": "De hoogmoedigen hebben leugens tegen mij gestoffeerd; doch ik bewaar Uw bevelen van ganser harte.", "Spr 13:6": "De gerechtigheid bewaart de oprechte op de weg; maar de goddeloosheid zal de zondaar omkeren.", "Jes 10:15": "Zal een bijl zich beroemen tegen hem die daarmee houwt? Zal een zaag pochen tegen hem die ze trekt? Alsof een staf beweegt wie hem opheffen? Als men een stok opheft, is het geen hout?", "Matt 15:13": "Maar Hij antwoordde en zei: Elke plant die Mijn hemelse Vader niet geplant heeft, zal uitgeroeid worden.", "Jes 5:30": "En zij zullen op die dag tegen hen bruisen, als het bruisen van de zee. Als men dan naar het land kijkt, zie, dan is er duisternis en benauwdheid, en het licht zal verduisterd worden in de wolken erboven.", "Amos 9:8": "Zie, de ogen van de Heere HEERE zijn tegen dit zondige koninkrijk, zodat Ik het van de aardbodem verdelg; behalve dat Ik het huis van Jakob niet helemaal zal verdelgen, spreekt de HEERE.", "Matt 8:12": "maar de kinderen van het koninkrijk zullen uitgeworpen worden in de buitenste duisternis; daar zal gehuil zijn, en het geknars van de tanden.", "Jes 10:5-16": "Wee de Assyriër, die de roede van Mijn toorn is, en Mijn grimmigheid is een stok in hun hand! Ik zal hem zenden tegen een huichelachtig volk, en Ik zal hem bevel geven tegen het volk van Mijn verbolgenheid; opdat hij de roof rooft, en plundert de plundering, en het stelt ter vertreding, als het slijk van de straten. Hoewel hij het zo niet meent, en zijn hart zo niet denkt, maar hij zal in zijn hart hebben te verdelgen, en niet weinige volken uit te roeien.", "Jes 24:21": "En het zal gebeuren op die dag, dat de HEERE bezoeking zal doen over de heerscharen van de hoge in de hoogte, en over de koningen van de aardbodem op de aardbodem.", "1 Joh 2:26": "Dit heb ik u geschreven over hen, die u verleiden.", "Hos 2:12": "En Ik zal aan haar de dagen van de Baäl bezoeken, waarin zij hem wierook gebracht heeft, en zich versierd heeft met haar voorhoofdsieraad, en haar halssieraad, en haar minnaars is nagegaan, maar Mij heeft vergeten, spreekt de Heere.", "Pred 10:5-7": "Er is nog een kwaad dat ik gezien heb onder de zon, als een dwaling die van het aangezicht van de leider voortkomt. Een dwaas wordt gezet in grote hoogheden, maar de rijken zitten in de laagte. Ik heb knechten te paard gezien, en vorsten die als knechten op de aarde gingen.", "Jes 43:27": "Uw eerste vader heeft gezondigd, en uw uitleggers hebben tegen Mij overtreden.", "2 Kor 11:15": "Zo is het dan niets groots, als ook zijn dienaars zich veranderen als waren zij dienaars van de gerechtigheid; van wie het einde zal zijn naar hun werken.", "1 Sam 2:3"
