l":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Wee u, verwoester, die zelf niet verwoest bent, en u, die trouweloos handelt, terwijl men niet trouweloos tegen u gehandeld heeft! Als u het verwoesten volbracht zult hebben, zult u verwoest worden; als u het trouweloos handelen voltooid zult hebben, zal men trouweloos tegen u handelen.","2":"HEERE, wees ons genadig, wij hebben op U gewacht; wees hun arm elke morgen, en ook onze redding in tijd van benauwdheid.","3":"Van het geluid van het rumoer zullen de volken wegvluchten; van Uw verhoging zullen de heidenvolken verstrooid worden.","4":"Dan zal uw buit verzameld worden, zoals de kevers verzameld worden; men zal daarin heen en weer huppelen, zoals de sprinkhanen heen en weer huppelen.","5":"De HEERE is verheven, want Hij woont *in* de hoogte; Hij heeft Sion vervuld met recht en gerechtigheid.","6":"En het zal gebeuren, dat de vastheid van uw tijden, de sterkte van *uw* redding, wijsheid en kennis zal zijn; de vrees voor de HEERE zal Zijn schat zijn.","7":"Zie, hun allersterkste roepen daar buiten; de boden van de vrede huilen bitter.","8":"De gebaande wegen zijn verwoest, wie over de paden gaat, houdt op; hij vernietigt het verbond, hij veracht de steden, hij telt geen mens.","9":"Het land treurt, het kwijnt weg; de Libanon schaamt zich, hij verwelkt; Saron is geworden als een woestijn; zo zijn Basan en Karmel geschud.","10":"Nu zal Ik opstaan, zegt de HEERE, nu zal Ik verhoogd worden, nu zal Ik verheven worden.","11":"U gaat met stro zwanger, u zult stoppels baren; uw geest zal u *als* vuur verslinden.","12":"En de volken zullen zijn *als* de verbrandingen van het kalk; *als* afgehouwen doornen zullen zij met het vuur verbrand worden.","13":"Hoort, u die ver weg bent, wat Ik gedaan heb; en u, die nabij bent, erken Mijn macht!","14":"De zondaars in Sion zijn verschrikt; beving heeft de huichelaars aangegrepen; *zij zeggen*: Wie onder ons kan bij een verterend vuur wonen? Wie onder ons kan bij een eeuwige gloed wonen?","15":"Wie in gerechtigheid wandelt, en wat recht is spreekt; wie de winst van onderdrukking verwerpt; wie zijn handen uitschudt, zodat zij geen geschenken vasthouden; wie zijn oor dichtstopt, zodat hij geen bloedschuld hoort, en zijn ogen dichtdoet; zodat hij het kwade niet aanziet;","16":"Die zal in de hoogten wonen, de sterkten van de steenrotsen zullen zijn hoge schuilplaats zijn; zijn brood wordt hem gegeven, zijn water is gewis.","17":"Uw ogen zullen de Koning zien in Zijn schoonheid; zij zullen een ver gelegen land zien.","18":"Uw hart zal de verschrikking overdenken, *en zeggen*: Waar is de schrijver? Waar is de belastinginner? Waar is hij, die de torens telt?","19":"U zult niet *meer* dat stuurse volk zien, het volk, dat zo diep van spraak is, dat men het niet horen kan, met een belachelijke tong, die men niet verstaan kan.","20":"Bekijk Sion, de stad van onze samenkomsten; uw ogen zullen Jeruzalem zien, een rustige woonplaats, een tent, die niet neergehaald zal worden, waarvan de pinnen in eeuwigheid niet uitgetrokken zullen worden, en waarvan geen touwen verscheurd zullen worden.","21":"Maar de HEERE zal daar bij ons heerlijk zijn, het zal een plaats zijn van rivieren, van wijde stromen; geen roeischuit zal daar doorvaren, en geen praalschip zal daar overvaren.","22":"Want de HEERE is onze Rechter, de HEERE is onze Wetgever, de HEERE is onze Koning. Hij zal ons redden.","23":"Uw touwen zijn slap geworden, zij zullen hun mast niet goed stijf kunnen houden, zij zullen het zeil niet kunnen uitspannen; dan zal de roof van een overvloedige buit uitgedeeld worden, *zelfs* zullen de lammen de roof roven.","24":"En geen inwoner zal zeggen: Ik ben ziek, *want* het volk, dat daarin woont, zal vergeving van ongerechtigheid ontvangen."},"SV":{"1":"Wee u, gij verwoester, die niet verwoest zijt, en gij, die trouwelooslijk handelt, waar men niet trouwelooslijk tegen u gehandeld heeft! Als gij het verwoesten zult volbracht hebben, zult gij verwoest worden; als gij het trouweloos handelen zult voleind hebben, zal men trouwelooslijk tegen u handelen.","2":"HEERE, wees ons genadig, wij hebben op U gewacht; wees hun arm allen morgen, daartoe onze behoudenis ten tijde der benauwdheid.","3":"Van het geluid des rumoers zullen de volken wegvlieden; van Uw verhoging zullen de heidenen verstrooid worden.","4":"Dan zal ulieder buit verzameld worden, gelijk de kevers verzameld worden; men zal daarin ginds en weder huppelen, gelijk de sprinkhanen ginds en weder huppelen.","5":"De HEERE is verheven, want Hij woont *in* de hoogte; Hij heeft Sion vervuld met gericht en gerechtigheid.","6":"En het zal geschieden, dat de vastigheid uwer tijden, de sterkte van *uw* behoudenissen zal zijn wijsheid en kennis; de vreze des HEEREN zal zijn schat zijn.","7":"Ziet, hun allersterksten roepen daar buiten; de boden des vredes wenen bitterlijk.","8":"De gebaande wegen zijn verwoest, die door de paden gaat, houdt op; hij vernietigt het verbond, hij veracht de steden, hij acht geen mens.","9":"Het land treurt, het kweelt; de Libanon schaamt zich, hij verwelkt; Saron is geworden als een woestijn; zo Basan als Karmel zijn geschud.","10":"Nu zal Ik opstaan, zegt de HEERE, nu zal Ik verhoogd worden, nu zal Ik verheven worden.","11":"Gijlieden gaat met stro zwanger, gij zult stoppelen baren; uw geest zal u *als* vuur verslinden.","12":"En de volken zullen zijn *als* de verbrandingen des kalks; *als* afgehouwen doornen zullen zij met het vuur verbrand worden.","13":"Hoort gijlieden, die verre zijt, wat Ik gedaan heb; en gijlieden, die nabij zijt, bekent Mijn macht!","14":"De zondaren te Sion zijn verschrikt; beving heeft de huichelaren aangegrepen; *zij* *zeggen*: Wie is er onder ons, die bij een verterend vuur wonen kan? Wie is er onder ons, die bij een eeuwigen gloed wonen kan?","15":"Die in gerechtigheden wandelt, en die billijkheden spreekt; die het gewin der onderdrukkingen verwerpt; die zijn handen uitschudt, dat zij geen geschenken behouden; die zijn oor stopt, dat hij geen bloedschulden hore, en zijn ogen toesluit; dat hij het kwade niet aanzie;","16":"Die zal in de hoogten wonen, de sterkten der steenrotsen zullen zijn hoog vertrek zijn; zijn brood wordt hem gegeven, zijn wateren zijn gewis.","17":"Uw ogen zullen den Koning zien in Zijn schoonheid; zij zullen een ver gelegen land zien.","18":"Uw hart zal de verschrikking overdenken, *zeggende*: Waar is de schrijver? Waar is de betaalsheer? Waar is hij, die de torens telt?","19":"Gij zult niet *meer* dat stuurse volk zien, het volk, dat zo diep van spraak is, dat men het niet horen kan, van belachelijke tong, hetwelk men niet verstaan kan.","20":"Schouwt Sion aan, de stad onzer bijeenkomsten; uw ogen zullen Jeruzalem zien, een geruste woonplaats, een tent, die niet ter neder geworpen zal worden, welker pinnen in der eeuwigheid niet zullen uitgetogen worden, en van welker zelen geen verscheurd worden.","21":"Maar de HEERE zal aldaar bij ons heerlijk zijn, het zal zijn een plaats van rivieren, van wijde stromen; geen roeischuit zal daar doorvaren, en geen treffelijk schip zal daar overvaren.","22":"Want de HEERE is onze Rechter, de HEERE is onze Wetgever, de HEERE is onze Koning. Hij zal ons behouden.","23":"Uw touwen zijn slap geworden, zij zullen hun mastboom niet kunnen recht stijf houden, zij zullen het zeil niet uitspannen; dan zal de roof van een overvloedigen buit uitgedeeld worden, *zelfs* zullen de lammen den roof roven.","24":"En geen inwoner zal zeggen: Ik ben ziek, *want* het volk, dat daarin woont, zal vergeving van ongerechtigheid hebben."},"KJV":{"1":"Woe to thee that spoilest, and thou *wast* not spoiled; and dealest treacherously, and they dealt not treacherously with thee! when thou shalt cease to spoil, thou shalt be spoiled; *and* when thou shalt make an end to deal treacherously, they shall deal treacherously","2":"O LORD, be gracious unto us; we have waited for thee: be thou their arm every morning, our salvation also in the time of trouble.","3":"At the noise of the tumult the people fled; at the lifting up of thyself the nations were scattered.","4":"And your spoil shall be gathered *like* the gathering of the caterpiller: as the running to and fro of locusts shall he run","5":"The LORD is exalted; for he dwelleth on high: he hath filled Zion with judgment and righteousness.","6":"And wisdom and knowledge shall be the stability of thy times, *and* strength of salvation: the fear of the LORD *is* his treasure.","7":"Behold, their valiant ones shall cry without: the ambassadors of peace shall weep bitterly.","8":"The highways lie waste, the wayfaring man ceaseth: he hath broken the covenant, he hath despised the cities, he regardeth no man.","9":"The earth mourneth *and* languisheth: Lebanon is ashamed *and* hewn down: Sharon is like a wilderness; and Bashan and Carmel shake off","10":"Now will I rise, saith the LORD; now will I be exalted; now will I lift up","11":"Ye shall conceive chaff, ye shall bring forth stubble: your breath, *as* fire, shall devour","12":"And the people shall be *as* the burnings of lime: *as* thorns cut up shall they be burned in the fire.","13":"Hear, ye *that are* far off, what I have done; and, ye *that are* near, acknowledge my might.","14":"The sinners in Zion are afraid; fearfulness hath surprised the hypocrites. Who among us shall dwell with the devouring fire? who among us shall dwell with everlasting burnings?","15":"He that walketh righteously, and speaketh uprightly; he that despiseth the gain of oppressions, that shaketh his hands from holding of bribes, that stoppeth his ears from hearing of blood, and shutteth his eyes from seeing evil;","16":"He shall dwell on high: his place of defence *shall be* the munitions of rocks: bread shall be given him; his waters *shall be* sure.","17":"Thine eyes shall see the king in his beauty: they shall behold the land that is very far off.","18":"Thine heart shall meditate terror. Where *is* the scribe? where *is* the receiver? where *is* he that counted the towers?","19":"Thou shalt not see a fierce people, a people of a deeper speech than thou canst perceive; of a stammering tongue, *that thou canst* not understand.","20":"Look upon Zion, the city of our solemnities: thine eyes shall see Jerusalem a quiet habitation, a tabernacle *that* shall not be taken down; not one of the stakes thereof shall ever be removed, neither shall any of the cords thereof be broken.","21":"But there the glorious LORD *will be* unto us a place of broad rivers *and* streams; wherein shall go no galley with oars, neither shall gallant ship pass","22":"For the LORD *is* our judge, the LORD *is* our lawgiver, the LORD *is* our king; he will save","23":"Thy tacklings are loosed; they could not well strengthen their mast, they could not spread the sail: then is the prey of a great spoil divided; the lame take the prey.","24":"And the inhabitant shall not say, I am sick: the people that dwell therein *shall be* forgiven *their* iniquity."}},"tsk":{"1":[{"kopje":"u, die","refs":["Jes 10:5","Jes 10:6","Jes 17:14","Jes 24:16","2 Kon 18:13-17","2 Kron 28:16-21","Hab 2:5-8"]},{"kopje":"als u het verwoesten volbracht zult hebben","refs":["Jes 10:12","Jes 21:2","Jes 37:36-38","Richt 1:7","Jer 25:12-14","Obadja 1:10-16","Zach 14:1-3","Matt 7:2","Openb 13:10","Openb 16:6","Openb 17:12-14","Openb 17:17"]}],"2":[{"kopje":"wees ons genadig","refs":["Jes 25:9","Jes 26:8","Jes 30:18","Jes 30:19","Ps 27:13","Ps 27:14","Ps 62:2","Ps 62:6","Ps 62:9","Ps 123:2","Ps 130:4-8","Klaagl 3:25","Klaagl 3:26","Hos 14:3"]},{"kopje":"wees","refs":["Jes 25:4","Ex 14:27","Ps 25:3","Ps 143:8","Klaagl 3:2 "H5971\">people,</span> a <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of a <span class=\"wl wl-kjv\" data-code=\"H6012\">deeper</span> <span class=\"wl wl-kjv\" data-code=\"H8193\">speech</span> than thou canst <span class=\"wl wl-kjv\" data-code=\"H8085\">perceive;</span> of a <span class=\"wl wl-kjv\" data-code=\"H3932\">stammering</span> <span class=\"wl wl-kjv\" data-code=\"H3956\">tongue,</span> that thou canst not understand.","20":"<span class=\"wl wl-kjv\" data-code=\"H2372\">Look</span> upon <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion,</span> the <span class=\"wl wl-kjv\" data-code=\"H7151\">city</span> of our <span class=\"wl wl-kjv\" data-code=\"H4150\">solemnities:</span> thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> shall <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> a <span class=\"wl wl-kjv\" data-code=\"H7600\">quiet</span> <span class=\"wl wl-kjv\" data-code=\"H5116\">habitation,</span> a <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> that shall not be taken <span class=\"wl wl-kjv\" data-code=\"H6813\">down;</span> not one of the <span class=\"wl wl-kjv\" data-code=\"H3489\">stakes</span> thereof shall <span class=\"wl wl-kjv\" data-code=\"H5331\">ever</span> be <span class=\"wl wl-kjv\" data-code=\"H5265\">removed,</span> neither shall any of the <span class=\"wl wl-kjv\" data-code=\"H2256\">cords</span> thereof be broken.","21":"But there the <span class=\"wl wl-kjv\" data-code=\"H117\">glorious</span> <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will be unto us a <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> of <span class=\"wl wl-kjv\" data-code=\"H7342\">broad</span> <span class=\"wl wl-kjv\" data-code=\"H5104\">rivers</span> and <span class=\"wl wl-kjv\" data-code=\"H2975\">streams;</span> wherein shall <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> <span class=\"wl wl-kjv\" data-code=\"H1077\">no</span> <span class=\"wl wl-kjv\" data-code=\"H590\">galley</span> with <span class=\"wl wl-kjv\" data-code=\"H7885\">oars,</span> neither shall <span class=\"wl wl-kjv\" data-code=\"H117\">gallant</span> <span class=\"wl wl-kjv\" data-code=\"H6716\">ship</span> pass","22":"For the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is our <span class=\"wl wl-kjv\" data-code=\"H8199\">judge,</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is our <span class=\"wl wl-kjv\" data-code=\"H2710\">lawgiver,</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is our <span class=\"wl wl-kjv\" data-code=\"H4428\">king;</span> he will save","23":"Thy <span class=\"wl wl-kjv\" data-code=\"H2256\">tacklings</span> are <span class=\"wl wl-kjv\" data-code=\"H5203\">loosed;</span> they could not <span class=\"wl wl-kjv\" data-code=\"H3653\">well</span> <span class=\"wl wl-kjv\" data-code=\"H2388\">strengthen</span> their <span class=\"wl wl-kjv\" data-code=\"H8650\">mast,</span> they could not <span class=\"wl wl-kjv\" data-code=\"H6566\">spread</span> the <span class=\"wl wl-kjv\" data-code=\"H5251\">sail:</span> then is the <span class=\"wl wl-kjv\" data-code=\"H5706\">prey</span> of a <span class=\"wl wl-kjv\" data-code=\"H4766\">great</span> <span class=\"wl wl-kjv\" data-code=\"H7998\">spoil</span> <span class=\"wl wl-kjv\" data-code=\"H2505\">divided;</span> the <span class=\"wl wl-kjv\" data-code=\"H6455\">lame</span> <span class=\"wl wl-kjv\" data-code=\"H962\">take</span> the prey.","24":"And the <span class=\"wl wl-kjv\" data-code=\"H7934\">inhabitant</span> shall not <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> I am <span class=\"wl wl-kjv\" data-code=\"H2470\">sick:</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> therein shall be <span class=\"wl wl-kjv\" data-code=\"H5375\">forgiven</span> their iniquity."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"gij verwoester,","tekst":"Te weten gij Sanherib, koning van Assyrië. Doch het wordt ook gesproken tot alle vervolgers van de kerk Gods."},{"catchword":"Als gij","tekst":"Als gij aan het einde, hetwelk u God gesteld heeft, zult gekomen zijn, dat is als gij uw maat zult vervuld hebben, als de straffen, met welke God zijn volk zal bezoeken, een einde nemen zullen."},{"catchword":"zult gij verwoest","tekst":"Te weten vooreerst uw leger door den engel; daarna bijzelf door uwe zonen, zie 2Ki 19:35 , enz., eindelijk uwe stad Nineve door de Chaldeën."},{"catchword":"zal men trouwelooslijk","tekst":"Het schijnt dat dit te duiden is op de zonen van Sanherib, die hem in zijn afgodischen tempel hebben vermoord; 2Ki 19:37 ."}],"2":[{"catchword":"ons genadig,","tekst":"Te weten uw heilige kerk, of [ ons ], die uw volk zijn."},{"catchword":"wij hebben","tekst":"Te weten, dat Gij ons zoudt helpen en verlossen."},{"catchword":"hun arm","tekst":"Te weten der vrome Joden arm. De zin is: wees een voorvechter en beschermer van uw volk, tegen de Assyriërs."},{"catchword":"allen morgen,","tekst":"Hebreeuws, in de morgenstonden; dat is allen morgen, steeds, altoos, gelijk Psa 90:14 ; zie de aantekening Psa 73:14 ; of, als zij U ten tijde van het morgenoffer aanroepen."}],"3":[{"catchword":"Van het geluid","tekst":"Te weten als de engel hen zal overvallen. Zie 2Ki 19:35 ."},{"catchword":"de volken","tekst":"Te weten het krijgsvolk in het heir van den koning van Assyrië, bestaande uit verscheidene volken en natiën."},{"catchword":"van Uw verhoging","tekst":"Als Gij, o Heere, U als op uw rechterstoel zetten en gericht oefenen zult over de vijanden uws volks."}],"4":[{"catchword":"Dan zal","tekst":"Eene aanspraak tot de Assyriërs. De zin is: Gij, Assyriërs, zult van den engel des Heeren verslagen en dan van de Joden beroofd worden."},{"catchword":"ulieder buit","tekst":"Dat is, de buit, dien gij, Assyriërs, van andere volken geroofd hebt, zal van ulieden wedergenomen worden."},{"catchword":"gelijk","tekst":"Hebreeuws, met ene verzameling des kevers."},{"catchword":"daarin","tekst":"Te weten in uwen roof; dat is, in den roof, dien men u zal afnemen. Daarin zal men onder en over, door en weer door huppelen en springen, met vreugde, met blijdschap en gejuich."}],"5":[{"catchword":"in de hoogte;","tekst":"Dat is, in den hemel."},{"catchword":"Hij heeft Sion","tekst":"Of, Hij zal Zion vervullen, enz., te weten na de verdelging der Assyriërs ten tijde aan Hizkia."}],"6":[{"catchword":"de vastigheid","tekst":"Hier wendt de profeet zijne rede tot den koning Hizkia. Anderen verstaan dat het ene aanspraak is aan de kerk Gods; alsof de profeet zeide: Wat de kerk zal doen vaststaan, zal zijn de kennis van de goedertierenheid en gunst des Heeren."},{"catchword":"uwer tijden,","tekst":"Dat is, uwer regering, o Hizkia, of, o gemeente Gods."},{"catchword":"de sterkte","tekst":"Of, [uw] heilzame sterkte, of de sterkte des veelvoudigen heils."},{"catchword":"zal zijn","tekst":"[Zal zijn] of, is."},{"catchword":"zijn schat","tekst":"Te weten van den koning Hizkia. Alsof hij zeide: Omdat hij den Heere vreest, zo zal Hij hem zegenen met rijkdom. Zie 2Ki 20:13 , en 2Ch 32:27-29 . Anders, zijnen, of haren; te weten der kerk Gods. Indien men deze woorden op den koning Hizkia duidt, zo wijzen zij tegelijk aan, welke en hoedanig de wijsheid van den koning Hizkia geweest is, waarvan te lezen is 2Ki 19:1 , 2Ki 19:14 , en 2Ki 18:4-6 ."}],"7":[{"catchword":"hun","tekst":"Te weten van Sanherib en zijne vorsten. Zie onder Isa 36:13 , enz. en Isa 37:10 , enz."},{"catchword":"allersterksten","tekst":"Of, ambassadeurs, gezanten; te weten die, welken Sanherib aan den koning Hizkia en de inwoners van Jeruzalem gezonden heeft; 2Ki 18:17-18 ."},{"catchword":"daar buiten;","tekst":"Te weten buiten de stad Jeruzalem, gelijk te lezen is 2Ki 18:17-18 , enz."},{"catchword":"de boden","tekst":"Te weten die mannen, die Hizkia had gezonden aan Sanherib om hem den vrede af te bidden, 2Ki 18:14 ."}],"8":[{"catchword":"De gebaande wegen","tekst":"Te weten in het land Juda. De zin is: Niemand durft zich in het land Juda op de gewone herenstraten laten vinden, of reizen, vanwege den inval der Assyriërs. Vergelijk Jdg 5:6 , en de aantekening aldaar."},{"catchword":"zijn verwoest,","tekst":"Te weten van de Assyriërs."},{"catchword":"hij vernietigt","tekst":"Te weten Sanherib."},{"catchword":"het verbond,","tekst":"Te weten hetwelk hij gemaakt had, belovende af te trekken, als Hizkia hem de som geld, die hij hem opgelegd had, zou betaald hebben. Zie 2Ki 18:14 , enz."},{"catchword":"de steden,","tekst":"Te weten de steden in Juda."}],"9":[{"catchword":"Het land","tekst":"Te weten het Joodse land, hetwelk van de Assyriërs verwoest is."},{"catchword":"de Libanon","tekst":"De naam van een berg, en door dezen, als andere hier genaamde plaatsen, liggende aan de grenzen des lands, wordt te kennen gegeven, dat het ganse land verwoest was."},{"catchword":"schaamt zich,","tekst":"Te weten omdat hij van zijn schone hoge cederbomen ontbloot is, die door de Assyriërs zijn afgehouwen, waarmede hij tevoren versierd en als opgepronkt was."},{"catchword":"hij verwelkt;","tekst":"Of, hij is nedergehouwen."},{"catchword":"Saron","tekst":"Een land, waar goede tarwe pleegt te wassen. Zie 1Ch 27:29 , maar het was jammerlijk verwoest als de profeet dit schreEf."},{"catchword":"Basan","tekst":"In Basan was goede weide. Zie Deu 32:14 ; Psa 22:13 . Dit gebergte lag niet in den stam van Juda, maar in den halven stam van Manasse; Jos 13:30 ."},{"catchword":"Karmel","tekst":"Hier was ook goed weideland. Zie 1Sa 25:2 ."},{"catchword":"zijn geschud","tekst":"Of, werpen af; te weten hunne vruchten. Anders: ruchelt; dat roept als een ezel, dat is, schreit verschrikkelijk, namelijk omdat de beesten, die daar plachten te weiden, nu verdreven en geroofd waren."}],"10":[{"catchword":"opstaan,","tekst":"Of, mij opmaken; te weten tegen de Assyriërs."},{"catchword":"verhoogd worden,","tekst":"Te weten door het ombrengen der Assyriërs."}],"11":[{"catchword":"Gijlieden","tekst":"Dit spreekt de Heere tot de Assyriërs; alsof Hij zeide: Gij hebt wel wat groots voor, te weten Jeruzalem in te nemen en te verdelgen; maar het zal u niet gelukken, gij zult zelf te schande en ten verderve komen."},{"catchword":"gij zult","tekst":"Uwe aanslagen zullen zo weinig vermogen, alsof zij van stro en stoppels waren."},{"catchword":"uw geest","tekst":"Dat is, uwe hoogheid zal mij bewegen ulieden te verderven, te weten door mijn slaanden engel; zie 2Ki 18:19 , enz., en 2Ki 19:9 , enz."}],"12":[{"catchword":"de volken","tekst":"Te weten het krijgsvolk in het leger van de Assyriërs zal verdelgd worden gelijk de kalk in den kalkoven gebrand word; zie 2Ki 19:35 . Anders: zullen in kalkovens gelegd worden, namelijk om tot kalk verbrand te worden."}],"13":[{"catchword":"Hoort","tekst":"Dit is ene voorrede op hetgeen hier volgt, namelijk ene vermaning aan de vreemde natiën, dat zij den waren God zouden eren vanwege het vernielen der Assyriërs."},{"catchword":"wat Ik","tekst":"Te weten hoe wonderbaar Ik de Assyriërs door een engel verdelgd heb."},{"catchword":"bekent","tekst":"Dat is, merkt en roemt mijn grote macht."}],"14":[{"catchword":"De zondaren","tekst":"Dat is, de goddelozen onder de Joden, die alle vermaningen veracht hebben."},{"catchword":"te Sion","tekst":"Dat is, te Jeruzalem."},{"catchword":"zijn verschrikt;","tekst":"Te weten als Ik hen door de Assyriërs bezocht heb, die zich niet verschrikten als Ik hen door den profeet Jesaja gedreigd heb; zie 2Ki 18:37 ; en 2Ki 19:14 ."},{"catchword":"bij een verterend","tekst":"Dat is, bij God, als Hij vertoornd is. Zie Deu 4:24 , en Deu 9:3 ; Heb 12:29 . Sommigen nemen deze woorden als gesproken zijnde door den profeet. Vergelijk Psa 15:1 ."}],"15":[{"catchword":"Die in","tekst":"Hier antwoordt de profeet, of God door den profeet, op de voorgaande vraag der goddeloze Joden; en Hij wijst aan dat zij geen oorzaak hebben om over Gods gestrengheid te klagen, maar wel over hun goddeloos leven, waarmede zij God tot straffen veroorzaken."},{"catchword":"het gewin","tekst":"Dat is het onrechtvaardig gewin, hetwelk men neemt om zijnen naaste te helpen onderdrukken."},{"catchword":"geen geschenken","tekst":"Te weten die hem, als rechter, gegeven worden om een goede zaak kwaad te maken."},{"catchword":"dat hij geen","tekst":"Dat is, dat hij de raadslagen van onschuldig bloedvergieten niet bijwone; zie Psa 51:16 ."},{"catchword":"niet aanzie;","tekst":"Te weten met lust en met behagen. Zie Psa 22:18 ."}],"16":[{"catchword":"in de hoogten","tekst":"Dat is, zeker en vast, buiten gevaar, onder de beschutting des Allerhoogsten. Vergelijk Psa 91:1 ."},{"catchword":"zijn brood","tekst":"Dat is, het brood, hetwelk hij behoeft, of wenst te hebben. De zin is: hem zal niets ontbreken."},{"catchword":"zijn gewis","tekst":"Dat is, de Heere zal hem gewisselijk van drank verzorgen."}],"17":[{"catchword":"Uw ogen","tekst":"Hier spreekt de profeet hen aan, die hij vs.15 beschreven heeft, te weten de godzaligen onder de Joden."},{"catchword":"den Koning","tekst":"Eenigen verstaan hier den koning Hizkia, anderen den Heere Christus."},{"catchword":"zien","tekst":"Of, aanschouwen, met blijdschap, te weten na de heerlijke victorie over de Assyriërs, want tevoren, toen hem de Assyriërs in het land gevallen waren, was hij in een treurigen en bedroefden staat; zie 2Ch 32:23 , 2Ch 32:27 ."},{"catchword":"zij zullen","tekst":"Hebreeuws, het land der verheden. De zin is: Zij, te weten de burgers van Jeruzalem, zullen niet meer zo verschrikkelijk binnen hunne stad moeten besloten en als gevangen blijven, maar zij zullen mogen reizen en trekken waar het hun belieft door het ganse land."}],"18":[{"catchword":"Uw hart","tekst":"Hier spreekt de profeet alle godzalige Joden in het bijzonder aan."},{"catchword":"zal de verschrikking","tekst":"Of, het zal dichten van die verschrikking; te weten van die verschrikkingen, waarmede gij zijt bevangen geweest vanwege de Assyriërs, en van welke gij wonderbaarlijk, door Gods kracht en genade, zult verlost worden."},{"catchword":"Waar","tekst":"Dit zijn de woorden der Joden, de Assyriërs trotserende na verkregen victorie; alsof zij zeiden: Waar zijn nu al die grote meesters en officieren van den koning Sanherib? Zij zijn nu allen vernield en verdelgd, wij passen nu niet langer op hen, zij kunnen ons niet hinderen noch schaden. Sommigen nemen dit als woorden van de Joden, alsof zij in de aankomst der Assyriërs uit verbaasdheid en radeloosheid vraagden: Waar zijn nu de officieren, die op onze bescherming moesten letten en op alles orde stellen?"},{"catchword":"is de schrijver?","tekst":"Te weten monsterschrijver, of krijgssecretaris, te weten van den koning Sanherib."},{"catchword":"de betaalsheer?","tekst":"Of, de penningmeester, thesaurier, betaalmeester. Hebreeuws, de weger, of die daar weegt; te weten het geld; dat is, die den soldaten hunne soldij betaalt. Aangaande het wegen, zie Gen 23:16 ."},{"catchword":"die de torens","tekst":"Dat is, de bouwmeester of ingenieur, wiens ambt het is te tellen en te ordineren hoeveel torens, sterkten, schansen of bolwerken men moet maken tot verdediging ener belegerde stad, of om ene stad te belegeren en te besluiten."}],"19":[{"catchword":"niet meer","tekst":"Want de engel des Heeren zal hen ten dele verslaan, ten dele op de vlucht jagen; zie 2Ki 19:35-36 ."},{"catchword":"dat stuurse","tekst":"Of, wreed volk, of barbaars volk. Hebreeuws, gesterkt, verhard volk. Zie Deu 28:50 ; Jdg 14:4 , en Psa 114:1 ."},{"catchword":"van spraak","tekst":"Hebreeuws, van lip, gelijK Gen 11:1 ; dat is, een volk, dat een onbekende spraak heeft."},{"catchword":"horen kan,","tekst":"Dat is, verstaan kan; zie Gen 11:7 ."},{"catchword":"belachelijke tong,","tekst":"Zie Isa 28:11 . Anders, van stamelende tong."}],"20":[{"catchword":"Schouwt","tekst":"Hier spreekt de profeet nog de godzalige Joden aan."},{"catchword":"de stad","tekst":"Te weten Jeruzalem, waar het volk Gods gewoon was, inzonderheid op de hoge feestdagen, samen te komen."},{"catchword":"een tent,","tekst":"Versta hier, de Christelijke kerk, die steeds vast blijft staande, ofschoon zij hard wordt bestreden van hare vijanden. Het aardse Jeruzalem is van de Romeinen verwoest."},{"catchword":"in der eeuwigheid","tekst":"Dat is, nimmermeer."},{"catchword":"zullen uitgetogen","tekst":"Hebreeuws, niet zullen verreizen."}],"21":[{"catchword":"heerlijk zijn,","tekst":"Zie van het woord heerlijk, Psa 8:2 ."},{"catchword":"het zal zijn","tekst":"Te weten Jeruzalem; wel verstaande het geestelijke Jeruzalem; dat is, de gemeente der uitverkorenen."},{"catchword":"wijde stromen;","tekst":"Of, brede. Hebreeuws, wijd van handen; dat is, wijd van ruimte, gelijk Gen 34:21 ; Jdg 18:10 ; Psa 104:25 ; zie de aantekening aldaar."},{"catchword":"schip","tekst":"Of, galei."},{"catchword":"zal daar","tekst":"Of, daarover komen. De zin van dit vs. is: De kerk zal zijn als een stad, rondom welke wijde grachten gaan, alzo dat de vijanden tegen haar niet zullen vermogen, maar alle uitverkorenen zullen in haar zeker en gewis zijn."}],"22":[{"catchword":"behouden","tekst":"Of, verlossen, of zalig maken."}],"23":[{"catchword":"Uw touwen","tekst":"De profeet spreekt hier de Assyriërs aan, alsof zij altegaar in een schip waren, hetwelk in groot gevaar is; alsof hij zeide: O gij Assyriërs, al uw macht en voornemen tegen Gods kerk zal ijdel en tevergeefs zijn, gelijk men niet zeilen kan noch voortkomen, als de touwen en zeilen, bij gebrek van wind, niet stijf kunnen uitstaan of door storm gebroken worden."},{"catchword":"zijn slap","tekst":"Of, los geworden, geslaakt."},{"catchword":"zij zullen hun mastboom","tekst":"Te weten de vijanden, of de touwen."},{"catchword":"recht","tekst":"Of, recht overeind houden."},{"catchword":"zij zullen het zeil","tekst":"Of de vlag, of vaan uitbreiden."},{"catchword":"dan","tekst":"Te weten als de vijanden, die Gods kerk wilden verstoren, van den Heere zullen verslagen en te schande gemaakt worden."},{"catchword":"zal de roof","tekst":"Anders: dan zal er uitgedeeld worden tot een groten roof toe. De zin is: De burgers der Christelijke kerk [te weten de gelovigen] zullen zich grotelijks verheugen. Vergelijk dit met Isa 9:2 ."},{"catchword":"zelfs","tekst":"De zin is: Het zal met de vijanden der kerk Gods alzo gesteld zijn, dat zelfs de allerzwaksten machtig genoeg zullen zijn om hen te beroven. Zie Psa 68:13 ."}],"24":[{"catchword":"geen inwoner","tekst":"Te weten van de stad Jeruzalem; dat is van de Christelijke kerk."},{"catchword":"ziek,","tekst":"Of, zwak, of krank, want de Heere heelt al onze gebreken en Hij vergeeft ons onze misdaden."},{"catchword":"zal vergeving","tekst":"Hebreeuws, zal ontlast zijn van ongerechtigheid; God zal hen ontlasten; dat is, God zal hun hunne zonden vergeven en derhalve maakt Hij hen sterk en wakker. Zie de aantekening Psa 32:1 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Wo unto thee thou waster, [To wit, thou Senacherib King of the Assyrians: but it is spoken also to all persecutors of the Church of God] thou that wast not wasted, and thou that dealest unfaithfully where one hath not dealt unfaithfully against thee: when thou shalt have finished the wasting, [when thou shalt be come to the end which God hath appointed: that is, when thou shalt have filled up thy measure, and when the judgements wherewith God will visit his people, shall have an end] thou shalt be wasted: [to wit, first thy Army shall be wasted and destroyed by the Angel. Secondly, thou thy self shalt be destroyed by thine own sons. See 2 King.19.35, &c. Lastly, thy City Nineve shall be wasted or destroyed by the Chaldeans] when thou shalt have made an end of dealing unfaithful, one shall deal unfaithfully against thee. [It seemeth that this is to be understood of Sennacheribs sons, who murdered him in his Idolatrous Temple, 2 Kings 19.37.]"}],"2":[{"catchword":null,"tekst":"LORD be gracious unto us, [To wit, thy holy Church: or, unto us, we that are thy people] we have waited for thee: [to wit, that thou shouldest help and deliver us] be (thou) their arm [to wit, the arm of the godly Jews. The meaning is, be thou the defender and Protector of thy people against the Assyrians] every morning, [Heb. In the mornings: that is, every morning, continually, always, as Psal.90.14. See the Annotat. Psal.73.on vers.14. Or, when they call upon thee at the time of the morning sacrifice] besides our preservation in the time of trouble."}],"3":[{"catchword":null,"tekst":"At the sound of the Tumult [To wit, when the Annot angel shall fall upon them. See 2 Kings 19.35.] shall the Nations flee away: [to wit, the souldiery in the Army of the King of Assyria, which consisted of divers people and nations] at thine exaltation [when thou O Lord, shall set thy self as it were upon thy judgement-seat, and shalt execute judgement upon the enemies of thy people] shall the Heathen be scattered."}],"4":[{"catchword":null,"tekst":"Then shall your spoil be gathered as the Caterpillars are gathered: [This is a speech made to the Assyrians. The meaning is, the Assyrians shall be slain by the Angel of the Lord, and be spoiled and plundered by the Jews. (your spoil, &c.) That is, the spoil or prey which the Assyrians plundered and took away from other Nations, the same shall be again taken away from you. (as the Caterpillers are gathered:) Heb. With a gathering of the Caterpiller] they shall skip to and fro upon it, as the Grasshoppers do skip to and fro [Upon it; to wit, upon your spoil or prey; that is, upon the spoil or prey which shall be taken away from you. Upon it shall they skip and leap to and fro, and dance often upon it, with joy, again and again and with gladness, and with shouting.]"}],"5":[{"catchword":null,"tekst":"The LORD is exalted, for he dwelleth (on) high: [That is, in heaven] he hath filled Zion with judgement and righteo [{"catchword":null,"tekst":"Thine heart shall meditate terror, [Here the Prophet speaketh to all the godly Jews in particular, (thine heart shall mediate terror,) or, it shall endite of that terror; to wit, of those terrors wherewith thou wast surprised because of the Assyrians, and from which thou shalt be wonderfully delivered by the power and grace of God] (saying,) where is the scribe? Where is the pay-master? Where is he that counteth the towers? [These are the words of the Jews, defying the Assyrians after they had gotten the victory. As if they had said, where are now all those great masters and offices of King Sennacherib? They are now all consumed and destroyed, we care now no more for them, they cannot hinder not hurt us. Some take these as words spoken by the Jews in this manner, to wit, as of when the Assyrians came against them, they had through astonishment and so want o counsel asked where are now the Officers and Trustees that should heed our safety and protection, and take care and order concerning all things? (Where is the (crib?) to wit, clerk of the muster, or secretary of the army, to wit, of King Sennacheribs army (where is the pay-master?) or, the receiver, treasurer, cash-keeper, or keeper of the treasure. Heb. The weighed, or he that weigheth, to wit, the money; that is, he that payeth the Souldiers their wages or Salary. Concerning the weighing of money see Genes.23.on vers.16. (where is he that counteth the towers?) that is, the Surveyor or Engineer, whose office is that is, the Surveyor or Engineer, whose office is to count and ordain how many towers, strongholds, sorts, or bulwarks ought to be made for the maintaining of a siege against a city, or to defend a city besieged."}],"19":[{"catchword":null,"tekst":"Thou shalt not see (any more) that surely people, [For the Angel of the Lord shall partly them, and partly put them to flight. See 2 kings 19.35,36. (that surely people,) or, cruel people, or, Barbarous people. Heb. Strengthened, ha /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };

})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
