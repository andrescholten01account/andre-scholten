; zeker zal Hij u genadig zijn op de stem van uw geroep; zodra Hij het horen zal, zal Hij u antwoorden.", "Hebr 9:11": "Maar Christus, de Hogepriester van de toekomstige goederen, gekomen zijnde, is door de grotere en volmaaktere tabernakel, niet met handen gemaakt, dat is, niet van deze schepping,", "Gen 30:13": "Toen zei Lea: Tot mijn geluk! Want de dochters zullen mij gelukkig noemen; en zij noemde zijn naam Aser.", "Ex 33:16": "Want waaraan zou nu bekend worden dat ik genade gevonden heb in Uw ogen, ik en Uw volk? Is het niet daaraan, dat U met ons meegaat? Zo zullen wij afgezonderd worden, ik en Uw volk, van alle volk dat op de aardbodem is.", "Ps 30:8": "Want, HEERE! U had mijn berg door Uw goedgunstigheid vast doen staan; maar toen U Uw aangezicht verborg, werd ik verschrikt.", "1 Tess 4:4": "Dat ieder van u weet zijn eigen lichaam te bezitten in heiliging en eer;", "Spr 16:6": "Door goedertierenheid en trouw wordt de misdaad verzoend; en door de vreze van de HEERE wijkt men af van het kwade.", "Rom 8:2-6": "Want de wet van de Geest van het leven in Christus Jezus heeft mij vrijgemaakt van de wet van de zonde en van de dood. Want wat voor de wet onmogelijk was, omdat zij door het vlees krachteloos was, dat heeft God gedaan: Hij heeft Zijn eigen Zoon gezonden in de gelijkenis van het zondige vlees, en dat voor de zonde, en Hij heeft de zonde veroordeeld in het vlees. Opdat het recht van de wet vervuld zou worden in ons, die niet naar het vlees wandelen, maar naar de Geest.", "Deut 8:2": "En u zult denken aan heel de weg, die de HEERE, uw God, u deze veertig jaar in de woestijn geleid heeft; opdat Hij u verootmoedigt, om u te beproeven, om te weten wat in uw hart was, of u Zijn geboden zou houden, of niet.", "Jes 32:17": "En het werk van de gerechtigheid zal vrede zijn; en de uitwerking van de gerechtigheid zal rust en zekerheid zijn, tot in eeuwigheid.", "Jes 25:6-8": "En de HEERE van de heerscharen zal op deze berg voor alle volken een vette maaltijd maken, een maaltijd van reine wijn, van vet vol merg, van reine wijnen, die gezuiverd zijn. En Hij zal op deze berg verslinden het bewindsel van het aangezicht, waarmee alle volken bewonden zijn, en het deksel, waarmee alle naties bedekt zijn. Hij zal de dood verslinden tot overwinning, en de Heere HEERE zal de tranen van alle aangezichten afwissen; en Hij zal de smaad van Zijn volk van de hele aarde wegnemen; want de HEERE heeft het gesproken.", "Amos 9:9-15": "Want zie, Ik geef bevel, en Ik zal het huis van Israël onder alle heidenvolken schudden, zoals graan geschud wordt in een zeef; en niet één steentje zal er op de aarde vallen. Alle zondaars van Mijn volk zullen door het zwaard sterven; zij die zeggen: Het kwaad zal ons niet naderen, en ons niet treffen. Op die dag zal Ik de vervallen hut van David weer oprichten, en Ik zal haar scheuren dichtmaken, en wat aan haar is afgebroken weer oprichten, en zal haar bouwen, als in de dagen van vroeger;", "Ps 126:1": "Een lied Hammaäloth. Toen de HEERE de gevangenen van Sion terugbracht, waren wij als mensen die dromen.", "Ef 1:14": "Die het onderpand is van onze erfenis, tot de verkregen verlossing, tot prijs van Zijn heerlijkheid.", "Ps 119:52": "Ik heb gedacht, o HEERE! aan Uw oordelen van oudsher, en heb mij getroost.", "Jes 49:13": "Juicht, hemelen! En verheug u, aarde! En bergen! Maakt gedreun met gejuich; want de HEERE heeft Zijn volk vertroost, en Hij zal Zich over Zijn ellendigen ontfermen.", "Ps 31:25": "Wees sterk, en Hij zal uw hart versterken, allen u, die op de HEERE hoopt!", "Spr 3:6": "Ken Hem in al uw wegen, en Hij zal uw paden recht maken.", "Jes 66:8": "Wie heeft ooit zoiets gehoord? Wie heeft dergelijke dingen gezien? Zou een land geboren kunnen worden op één dag? Zou een volk geboren kunnen worden in één keer? Maar Sion heeft weeën gekregen, en zij heeft haar zonen gebaard.", "Rom 15:19": "door kracht van tekenen en wonderen, en door de kracht van de Geest van God, zodat ik, van Jeruzalem af en rondom, tot Illyricum toe, het Evangelie van Christus vervuld heb.", "Openb 2:10": "Vrees niets van de dingen die u lijden zult. Zie, de duivel zal sommigen van u in de gevangenis werpen, opdat u beproefd wordt; en u zult een verdrukking hebben van tien dagen. Wees getrouw tot de dood, en Ik zal u de kroon des levens geven.", "Spr 16:9": "Het hart van de mens overdenkt zijn weg; maar de HEERE bestuurt zijn gang.", "Gal 4:6": "En omdat u kinderen bent, heeft God de Geest van Zijn Zoon uitgezonden in uw harten, Die roept: Abba, Vader!", "Ezech 43:12": "Dit is de wet van het huis: op de top van de berg zal zijn hele grens, rondom heen, een allerheiligst gebied zijn; zie, dit is de wet van het huis.", "Joh 10:16": "Ik heb nog andere schapen, die niet van deze schaapskooi zijn; ook die moet Ik toebrengen; en zij zullen Mijn stem horen; en het zal worden één kudde, en één Herder.", "Jer 31:7-9": "Want zo zegt de HEERE: Roept luide over Jakob met vreugde, en juicht vanwege het hoofd van de heidenvolken; laat het horen, lofzingt, en zegt: O HEERE! Behoud Uw volk, het overblijfsel van Israël. Zie, Ik zal ze aanbrengen uit het land van het noorden, en zal hen verzamelen van de einden van de aarde; onder hen zullen blinden en lammen zijn, zwangere vrouwen en barenden samen; met een grote menigte zullen zij hierheen terugkomen. Zij zullen komen met geween, en met smekingen zal Ik hen leiden; Ik zal hen leiden aan de waterbeken, op een rechte weg, waarop zij zich niet zullen stoten; want Ik ben Israël tot een Vader, en Efraïm is Mijn eerstgeborene.", "Ex 16:15": "Toen de Israëlieten het zagen, zeiden zij tegen elkaar: Wat is dit? Want zij wisten niet wat het was. Mozes dan zei tegen hen: Dit is het brood, dat de HEERE u te eten gegeven heeft.", "Jes 54:14": "U zult door gerechtigheid bevestigd worden; wees ver van verdrukking, want u zult niet vrezen; en ver van verschrikking, want zij zal tot u niet naderen.", "Gal 5:5": "Want wij verwachten door de Geest, uit het geloof, de hoop van de rechtvaardigheid.", "Ef 3:21": "Hem, zeg ik, zij de heerlijkheid in de Gemeente, door Christus Jezus, tot in alle geslachten, tot in alle eeuwigheid. Amen.", "1 Joh 2:17": "En de wereld gaat voorbij, en haar begeerte; maar wie de wil van God doet, blijft tot in eeuwigheid.", "Openb 17:8": "Het beest dat u gezien hebt, was en is niet; en het zal opkomen uit de afgrond, en naar het verderf gaan; en zij die op de aarde wonen, van wie de namen niet geschreven zijn in het boek van het leven van vóór de grondlegging van de wereld, zullen zich verwonderen als zij het beest zien, dat was en niet is, hoewel het is.", "Jes 31:4": "Want zo heeft de HEERE tegen mij gezegd: Zoals een leeuw, en een jonge leeuw over zijn prooi brult, wanneer ook een volle menigte herders tegen hem samengeroepen wordt, verschrikt hij voor hun stem niet, en vernedert zich niet vanwege hun grote aantal; zo zal de HEERE van de heerscharen neerdalen, om te strijden voor de berg Sion en voor haar heuvel.", "Openb 14:13": "En ik hoorde een stem uit de hemel, die tegen mij zei: Schrijf, zalig zijn de doden die in de Heere sterven, van nu aan. Ja, zegt de Geest, opdat zij rusten van hun arbeid; en hun werken volgen met hen.", "Ex 39:30": "Zij maakten ook de plaat van de heilige kroon van zuiver goud, en zij schreven daarop een schrift, gegraveerd zoals een zegel gegraveerd wordt: HEILIGHEID VAN DE HEERE.", "Ps 32:6": "Hierom zal iedere heilige U aanbidden in de tijd dat U te vinden bent; ja, in een overstroming van grote wateren zullen zij hem niet aanraken.", "1 Joh 1:6": "Als wij zeggen dat wij gemeenschap met Hem hebben, en wij in de duisternis wandelen, dan liegen wij, en doen de waarheid niet.", "Ef 2:8": "Want uit genade bent u zalig geworden door het geloof; en dat niet uit u, het is Gods gave;", "Ps 84:11": "Want een dag in Uw voorhoven is beter dan duizend elders; ik koos liever aan de drempel in het huis van mijn God te zijn, dan lang te wonen in de tenten van de goddeloosheid.", "Ex 14:29": "Maar de kinderen van Israël gingen op het droge, in het midden van de zee; en de wateren waren hun een muur, aan hun rechterhand en aan hun linkerhand.", "Ps 68:23": "De Heere heeft gezegd: Ik zal terugbrengen uit Basan; Ik zal terugbrengen uit de diepten van de zee;", "Openb 20:15": "En zo iemand niet gevonden werd geschreven in het boek van het leven, die werd geworpen in de poel van het vuur.", "Jes 14:32": "Wat zal men dan antwoorden aan de boden van het volk? Dat de HEERE Sion gegrond heeft, opdat de bedrukten van Zijn volk daarin een toevlucht zouden hebben.", "Openb 11:11": "En na die drie dagen en een halve is een geest van leven uit God in hen gegaan; en zij stonden op op hun voeten; en er is grote vrees gevallen op hen die hen aanschouwden.", "Ps 62:2": "Zeker, mijn ziel is stil bij God; van Hem is mijn heil.", "2 Tim 2:21": "Als iemand zichzelf dan van deze dingen reinigt, zal hij een voorwerp zijn tot eer, geheiligd en bruikbaar voor de Heere, toebereid tot alle goed werk.", "Ezech 37:9": "En Hij zei tot mij: Profeteer tot de geest; profeteer, mensenkind! En zeg tot de geest: Zo zegt de Heere HEERE: Geest! Kom van de vier winden, en blaas in deze gedoden, zodat zij levend worden.", "Ezech 16:9": "Daarna waste Ik u met water, en Ik spoelde uw bloed van u af, en zalfde u met olie.", "Joh 14:18": "Ik zal u niet als wezen achterlaten; Ik kom weer naar u toe.", "Deut 30:20": "door de HEERE, uw God, lief te hebben, Zijn stem gehoorzaam te zijn, en Hem aan te hangen; want Hij is uw leven en de lengte van uw dagen; opdat u blijft in het land dat de HEERE uw vaderen, Abraham, Izak en Jakob, gezworen heeft hun te zullen geven.", "Mal 4:3": "En u zult de goddelozen vertreden, want zij zullen as worden onder de zolen van uw voeten, op die dag die Ik maken zal, zegt de HEERE van de heerscharen.", "Hand 10:19": "En terwijl Petrus over dat gezicht nadacht, zei de Geest tegen hem: Zie, drie mannen zoeken u;", "Klaagl 3:57": "Koph. U bent tot mij genaderd op de dag dat ik U aanriep; U hebt gezegd: Vrees niet!", "Zach 14:3-21": "En de HEERE zal uittrekken, en Hij zal strijden tegen die heidenen, zoals ten dage dat Hij gestreden heeft, ten dage van het strijd. En Zijn voeten zullen op die dag staan op de Olijfberg, die voor Jeruzalem ligt, tegen het oosten; en de Olijfberg zal in tweeën gespleten worden naar het oosten en naar het westen, zodat er een zeer grote vallei zal zijn; en de ene helft van de berg zal wijken naar het noorden, en de helft daarvan naar het zuiden. Dan zult u vluchten door de vallei van Mijn bergen (want deze vallei van de bergen zal reiken tot Azal), en u zult vluchten, zoals u vluchtte voor de aardbeving in de dagen van Uzzia, de koning van Juda; dan zal de HEERE, mijn God, komen, en al de heiligen met U, o Heere!", "Zef 3:17": "De HEERE, uw God, is in uw midden, een Held, Die verlossen zal; Hij zal Zich over u verblijden met blijdschap, Hij zal zwijgen in Zijn liefde, Hij zal Zich over u verheugen met gejuich.", "Joh 4:14": "maar wie gedronken zal hebben van het water dat Ik hem geven zal, die zal in eeuwigheid geen dorst meer krijgen; maar het water dat Ik hem zal geven, zal in hem worden een fontein van water, opwellend tot in het eeuwige leven.", "Rom 10:9": "namelijk: als u met uw mond de Heere Jezus belijdt, en met uw hart gelooft dat God Hem uit de doden heeft opgewekt, zult u zalig worden.", "Ps 68:14": "Al lag u tussen twee rijen stenen, toch zult u worden als vleugels van een duif, overdekt met zilver, en waarvan de veren zijn van uitgegraven goudgeel goud.", "Ef 4:21-24": "Als u naar Hem hebt geluisterd, en door Hem geleerd bent, zoals de waarheid in Jezus is; Namelijk dat u zou afleggen, wat betreft de vorige levenswandel, de oude mens, die verdorven wordt door de begeerten van de verleiding; En dat u vernieuwd zou worden in de geest van uw gemoed,", "Ps 87:6": "De HEERE zal hen rekenen bij het opschrijven van de volken, en zeggen: Deze is daar geboren. Sela.", "Spr 12:28": "In het pad van de gerechtigheid is het leven; en op de weg van haar voetpad is de dood niet.", "Ezech 37:12": "Daarom, profeteer en zeg tot hen: Zo zegt de Heere HEERE: Zie, Ik zal uw graven openen en zal u uit uw graven laten opkomen, o Mijn volk! En Ik zal u brengen in het land van Israël.", "Rom 12:1": "Ik smeek u dan, broeders, door de ontfermingen van God, dat u uw lichamen stelt tot een levend, heilig en Gode welbehaaglijk offer, dat is uw redelijke godsdienst.", "Ps 91:9-12": "Want U, HEERE, bent mijn Toevlucht! De Allerhoogste hebt u gesteld tot uw Vertrek; U zal geen kwaad overkomen, en geen plaag zal uw tent naderen. Want Hij zal Zijn engelen aangaande u bevelen, dat zij u bewaren op al uw wegen.", "Jes 3:16-26": "Verder zegt de HEERE: Omdat de dochters van Sion zich verheffen, en gaan met uitgestrekte hals, en lonken met de ogen, al gaande en trippelende daarheen treden, en alsof haar voeten gebonden waren. Zo zal de Heere de schedel van de dochters van Sion schurftig maken, en de HEERE zal haar schaamte ontbloten. Op diezelfde dag zal de Heere wegnemen het sieraad van de kousebanden, en de netjes, en de maantjes,", "Ps 23:3": "Hij verkwikt mijn ziel; Hij leidt mij in het spoor van de gerechtigheid, omwille van Zijn Naam.", "Spr 16:7": "Als iemands wegen de HEERE behagen, zo zal Hij ook zijn vijanden met hem verzoenen.", "Ezech 17:22-24": "Zo zegt de Heere HEERE: Ik zal ook van de opperste tak van de hoge ceder nemen, dat Ik zal planten; van de top van zijn jonge takjes zal Ik een teer takje afplukken, dat Ik op een hoge en verheven berg planten zal; op de berg van de hoogte van Israël zal Ik hem planten; en hij zal takken voortbrengen, en vrucht dragen, en hij zal tot een heerlijke ceder worden, zodat onder hem alle vogels van allerlei vleugel zullen wonen; in de schaduw van zijn takken zullen zij wonen. Zo zullen alle bomen van het veld weten dat Ik, de HEERE, de hoge boom vernederd heb, de nederige boom verheven heb, de groene boom verdroogd heb, en de droge boom bloeiend gemaakt heb; Ik, de HEERE, heb het gesproken, en zal het doen.", "Jes 27:3": "Ik, de HEERE, behoed die, elk ogenblik zal Ik hem bevochtigen; opdat de vijand hem niet bezoekt, zal Ik hem bewaren, nacht en dag.", "Hebr 2:4": "terwijl God erbij getuigde door tekenen en wonderen, en allerlei krachten en gaven van de Heilige Geest, naar Zijn wil.", "Ps 69:21": "De smaad heeft mijn hart gebroken, en ik ben zeer zwak; en ik heb gewacht op medelijden, maar er is geen; en op vertroosters, maar heb ze niet gevonden.", "Jer 18:15-17": "Toch heeft Mijn volk Mij vergeten, zij branden reukwerk voor de ijdelheid; want zij hebben hen doen struikelen op hun wegen, op de oude paden, om te wandelen in stegen van een weg die niet opgehoogd is; Om hun land te maken tot een verschrikking, tot eeuwige aanfluitingen; ieder die daar voorbijgaat, zal ontzet zijn, en met zijn hoofd schudden. Als een oostenwind zal Ik hen verstrooien voor het aangezicht van de vijand; Ik zal hun de nek en niet het aangezicht laten zien, op de dag van hun verderf.", "2 Kor 12:7": "En opdat ik mij door de overvloed van de openbaringen niet zou verheffen, is mij een scherpe doorn in het vlees gegeven, namelijk een engel van de satan, om mij met vuisten te slaan, opdat ik mij niet zou verheffen.", "1 Kor 15:24-28": "Daarna zal het einde zijn, wanneer Hij het Koninkrijk aan God en de Vader zal hebben overgegeven; wanneer Hij alle heerschappij, alle macht en kracht zal hebben tenietgedaan. Want Hij moet als Koning heersen, totdat Hij alle vijanden onder Zijn voeten zal hebben gelegd. De laatste vijand die tenietgedaan wordt, is de dood.", "Luk 21:27": "En dan zullen zij de Zoon des mensen zien komen in een wolk, met grote kracht en heerlijkheid.", "Dan 11:30-45": "Want er zullen schepen van Chittim tegen hem komen, daarom zal hij door smart getroffen worden, en hij zal terugkeren, en gram worden tegen het heilige verbond, en hij zal het doen; want bij zijn terugkeer zal hij aandacht geven aan hen die het heilige verbond verlaten. En er zullen legers uit hem ontstaan, en zij zullen het heiligdom ontheiligen, en de sterkte, en zij zullen het voortdurende offer wegnemen, en een verwoestende gruwel opstellen. En hen die goddeloos handelen tegen het verbond, zal hij door vleierijen doen huichelen; maar het volk dat hun God kent, zal standhouden, en zal het doen.", "Ps 66:13": "Ik zal met brandoffers Uw huis binnengaan; ik zal U mijn geloften betalen,", "Ps 86:9": "Al de heidenen, Heere! die Gij gemaakt hebt, zullen komen, en zullen zich voor Uw aangezicht neerbuigen, en Uw Naam eren.", "Spr 16:1": "De mens heeft plannen van het hart; maar het antwoord van de tong is van de HEERE.", "Hebr 1:14": "Zijn zij niet allemaal dienende geesten, die uitgezonden worden om te dienen, om hen die de zaligheid zullen beërven?", "Jer 17:14": "Genees mij, HEERE! zo zal ik genezen worden, behoud mij, zo zal ik behouden worden; want Gij zijt mijn Lof.", "Ps 68:36": "O God! U bent ontzagwekkend vanuit Uw heiligdommen; de God van Israël, Die aan het volk sterkte en krachten geeft. Geloofd zij God!", "Hand 2:35": "Totdat Ik Uw vijanden tot een voetbank voor Uw voeten gezet zal hebben.", "1 Kor 1:8": "Die God u ook zal bevestigen tot het einde toe, om onberispelijk te zijn in de dag van onze Heere Jezus Christus.", "Openb 1:4": "Johannes aan de zeven gemeenten die in Azië zijn: genade zij u en vrede van Hem, Die is, en Die was, en Die komen zal; en van de zeven geesten die voor Zijn troon zijn;", "Hand 2:34": "Want David is niet opgevaren naar de hemel; maar hij zegt zelf: De Heere heeft gesproken tot mijn Heere: Zit aan Mijn rechterhand,", "Jes 11:6-9": "En de wolf zal bij het lam wonen, en de luipaard zal bij de geitenbok neerliggen; en het kalf, en de jonge leeuw, en het mestvee samen, en een klein jongetje zal ze drijven. De koe en de berin zullen samen weiden, hun jongen zullen samen neerliggen, en de leeuw zal stro eten, net als de os. En een zuigeling zal zich vermaken bij het hol van een adder; en een gespeend kind zal zijn hand uitsteken naar de kuil van de basilisk.", "Ps 46:11": "Laat af, en weet, dat Ik God ben; Ik zal verhoogd worden onder de heidenen, Ik zal verhoogd worden op de aarde.", "Luk 1:15": "Want hij zal groot zijn voor de Heere; hij zal geen wijn en geen sterke drank drinken, en hij zal met de Heilige Geest vervuld worden, al vanaf de moederschoot.", "Rom 8:13-16": "Want als u naar het vlees leeft, zult u sterven; maar als u door de Geest de daden van het lichaam doodt, zult u leven. Want zovelen als er door de Geest van God geleid worden, die zijn kinderen van God. Want u hebt niet de geest van slavernij ontvangen, om opnieuw te vrezen, maar u hebt de Geest van aanneming tot kinderen ontvangen, door Wie wij roepen: Abba, Vader!", "Ps 18:3": "De HEERE is mijn Steenrots, en mijn Burg, en mijn Uithelper; mijn God, mijn Rots, op Wie ik vertrouw; mijn Schild, en de Hoorn van mijn heil, mijn Hoog Vertrek.", "Ps 111:5": "Teth. Hij heeft hun die Hem vrezen, spijs gegeven; Jod. Hij gedenkt in eeuwigheid aan Zijn verbond.", "Zach 2:10": "Juich en verblijd u, dochter van Sion; want zie, Ik kom, en Ik zal in het midden van u wonen, spreekt de HEERE.", "2 Kon 20:17": "Zie, de dagen komen dat alles wat in uw huis is, en wat uw vaderen tot op deze dag opgeslagen hebben, naar Babel weggevoerd zal worden; er zal niets overblijven, zegt de HEERE.", "Neh 8:11": "Verder zei hij tegen hen: Ga, eet het vette, en drink het zoete, en stuur delen aan hen voor wie niets bereid is, want deze dag is heilig voor onze Heere; wees dus niet bedroefd, want de blijdschap van de HEERE, die is uw sterkte.", "Jes 2:1-5": "Het woord dat Jesaja, de zoon van Amoz, gezien heeft over Juda en Jeruzalem. En het zal gebeuren in de laatste dagen, dat de berg van het huis van de HEERE vastgesteld zal zijn op de top van de bergen, en dat hij verheven zal worden boven de heuvels, en tot hem zullen alle heidenvolken toevloeien. En veel volken zullen heengaan en zeggen: Kom, laat ons opgaan tot de berg van de HEERE, tot het huis van de God van Jakob, opdat Hij ons leert van Zijn wegen, en dat wij wandelen in Zijn paden; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem.", "Mark 13:27": "En dan zal Hij Zijn engelen uitzenden, en Zijn uitverkorenen bijeenverzamelen uit de vier windstreken, van het uiterste van de aarde, tot het uiterste van de hemel.", "Jes 1:25-27": "En Ik zal Mijn hand tegen u keren, en Ik zal uw schuim tot het allerreinste afzuiveren, en Ik zal al uw tin wegnemen. En Ik zal u uw rechters teruggeven, als in het begin, en uw raadslieden als in het begin; daarna zult u een stad van de gerechtigheid, een trouwe stad, genoemd worden. Sion zal door recht verlost worden, en haar wederkerende bewoners door gerechtigheid.", "Joh 15:18": "Als de wereld u haat, weet dan, dat zij Mij eerder dan u gehaat heeft.", "Jes 30:29": "Er zal een lofzang bij u zijn, zoals in de nacht wanneer het feest geheiligd wordt; en blijdschap van het hart, zoals van iemand die met pijpen wandelt, om te komen tot de berg van de HEERE, tot de Rotssteen van Israël.", "Jes 49:6-12": "Verder zei Hij: Het is te gering, dat U Mij een Knecht zou zijn, om op te richten de stammen van Jakob, en om terug te brengen de bewaarden in Israël; Ik heb U ook gegeven tot een Licht van de heidenen, om Mijn heil te zijn tot aan het einde van de aarde. Zo zegt de HEERE, de Verlosser van Israël, Zijn Heilige, tegen de veracht ziel, tegen Hem aan Wie het volk een gruwel heeft, tegen de Knecht van hen die heersen: Koningen zullen het zien en opstaan, ook vorsten, en zij zullen zich voor U buigen; om de wil van de HEERE, Die getrouw is, om de Heilige van Israël, Die U verkozen heeft. Zo zegt de HEERE: In de tijd van het welbehagen heb Ik U verhoord, en op de dag van het heil heb Ik U geholpen; en Ik zal U bewaren, en Ik zal U geven tot een verbond van het volk, om het aardrijk op te richten, om de verwoeste erfenissen te doen beërven;", "Ezech 22:13-22": "Zie dan, Ik heb Mijn hand geslagen om uw gierigheid die u bedreven hebt, en om uw bloed dat in uw midden geweest is. Zal uw hart standhouden? Zullen uw handen sterk zijn, in de dagen dat Ik met u zal handelen? Ik, de HEERE, heb het gesproken, en zal het doen. En Ik zal u verstrooien onder de heidenvolken, en u verspreiden in de landen, en uw onreinheid uit u wegnemen.", "Hand 17:28": "Want in Hem leven wij, en bewegen wij ons, en zijn wij; zoals ook enkelen van uw eigen dichters gezegd hebben: Want wij zijn ook Zijn geslacht.", "Jes 33:14": "De zondaars in Sion zijn verschrikt; beving heeft de huichelaars aangegrepen; zij zeggen: Wie onder ons kan bij een verterend vuur wonen? Wie onder ons kan bij een eeuwige gloed wonen?", "Job 11:19": "En u zult neerliggen, en niemand zal u verschrikken; en velen zullen uw gezicht smeken.", "Jes 8:14": "Dan zal Hij u tot een Heiligdom zijn; maar tot een steen des aanstoots en tot een rots der struikeling voor de twee huizen van Israël, tot een strik en tot een net voor de inwoners van Jeruzalem.", "Zef 3:20": "In die tijd zal Ik u hierheen brengen, in de tijd namelijk dat Ik u verzamelen zal; zeker zal Ik u stellen tot een naam en tot een lof, onder alle volken van de aarde, als Ik uw gevangenschap voor uw ogen terugbrengen zal, zegt de HEERE.", "Jes 30:1-17": "Wee de kinderen die afvallen, spreekt de HEERE, om een raadslag te maken, maar niet uit Mij, en om zich met een bedekking te bedekken, maar niet uit Mijn Geest, om zonde tot zonde te doen; Die gaan om af te trekken naar Egypte, en vragen Mijn mond niet; om zich te sterken met de macht van Farao, en om hun toevlucht te nemen onder de schaduw van Egypte. Want de sterkte van Farao zal u tot schaamte zijn, en die toevlucht onder de schaduw van Egypte tot schande.", "Joh 6:51": "Ik ben het levende Brood, dat uit de hemel neergedaald is; als iemand van dit Brood eet, zal hij eeuwig leven. En het Brood dat Ik geven zal, is Mijn vlees, dat Ik geven zal voor het leven van de wereld.", "Jes 51:11": "Zo zullen de vrijgekochte van de HEERE terugkeren, en met gejuich naar Sion komen; en eeuwige blijdschap zal op hun hoofd zijn; vreugde en blijdschap zullen zij aangrijpen, treuring en zuchten zullen wegvluchten.", "Joh 21:19": "En dit zei Hij, om aan te duiden met wat voor dood hij God verheerlijken zou. En toen Hij dit gezegd had, zei Hij tegen hem: Volg Mij.", "Deut 32:10": "Hij vond hem in een land van de woestijn, en in een woeste huilende wildernis; Hij voerde hem rondom, Hij onderwees hem, Hij bewaarde hem als Zijn oogappel.", "Rom 1:5-7": "(Door Wie wij genade en het apostelschap hebben ontvangen, tot gehoorzaamheid van het geloof onder alle heidenen, voor Zijn Naam; onder wie u ook bent, geroepenen van Jezus Christus!) Aan allen die in Rome zijn, geliefden van God, en geroepen heiligen: genade zij u, en vrede van God, onze Vader, en de Heere Jezus Christus.", "2 Petr 1:4": "Door Wie ons de grootste en kostbare beloften geschonken zijn, opdat u door deze deel zou krijgen aan de goddelijke natuur, nadat u ontkomen bent aan het verderf dat in de wereld is door de begeerte.", "Spr 28:25": "Wie hoogmoedig van hart is, verwekt ruzie; maar wie op de HEERE vertrouwt, zal welvarend worden.", "Deut 30:1-3": "Verder zal het gebeuren, wanneer al deze dingen over u gekomen zijn, deze zegen of deze vloek, die ik u voorgesteld heb; zo zult u het weer ter harte nemen, onder alle volken, waarheen de HEERE, uw God, u gedreven heeft; En u zult zich bekeren tot de HEERE, uw God, en Zijn stem gehoorzaam zijn, naar alles wat ik u heden gebied, u en uw kinderen, met uw ganse hart en met uw ganse ziel. En de HEERE, uw God, zal uw gevangenschap wenden, en Zich over u ontfermen; en Hij zal u weer bijeenbrengen uit al de volken waarheen de HEERE, uw God, u verstrooid had.", "Ps 126:6": "Die het zaad draagt om te zaaien, gaat al gaande en wenende; maar hij zal zeker met gejuich terugkomen, terwijl hij zijn schoven draagt.", "1 Petr 5:10": "En de God van alle genade, Die ons geroepen heeft tot Zijn eeuwige heerlijkheid in Christus Jezus, nadat u een tijdlang geleden zult hebben, Hij zal u volmaken, bevestigen, versterken en funderen.", "Jes 65:17-25": "Want zie, Ik schep nieuwe hemelen en een nieuwe aarde; en de vorige dingen zullen niet meer gedacht worden, en zullen in het hart niet opkomen. Maar wees u vrolijk, en verheug u tot in eeuwigheid over hetgeen Ik schep; want zie, Ik schep Jeruzalem een verheuging, en haar volk een vrolijkheid. En Ik zal Mij verheugen over Jeruzalem, en vrolijk zijn over Mijn volk; en in haar zal niet meer gehoord worden de stem van het wenen, noch de stem van het geschreeuw.", "Jer 13:23": "Zal een Moorman zijn huid veranderen? Of een luipaard zijn vlekken? Zo zult u ook goed kunnen doen, u die geleerd hebt kwaad te doen.", "Ps 84:2-5": "Hoe lieflijk zijn Uw woningen, o HEERE van de heerscharen! Mijn ziel is begerig, en bezwijkt ook van verlangen, naar de voorhoven van de HEERE; mijn hart en mijn vlees roepen uit tot de levende God. Zelfs vindt de mus een huis, en de zwaluw een nest voor zich, waar zij haar jongen legt, bij Uw altaren, HEERE van de heerscharen, mijn Koning, en mijn God!", "Jes 49:1-26": "Hoort naar Mij, eilanden! En luistert toe, volken van verre! De HEERE heeft Mij geroepen van de buik af, van het ingewand van Mijn moeder af heeft Hij Mijn Naam vermeld. En Hij heeft Mijn mond gemaakt als een scherp zwaard, onder de schaduw van Zijn hand heeft Hij Mij bedekt; en Hij heeft Mij tot een gezuiverde pijl gesteld, in Zijn pijlkoker heeft Hij Mij verborgen. En Hij heeft tegen Mij gezegd: U bent Mijn Knecht, Israël, door Wie Ik verheerlijkt zal worden.", "Spr 2:8": "Opdat zij de paden van het recht bewaren; en Hij zal de weg van Zijn gunstgenoten bewaren.", "Ezech 37:14": "En Ik zal Mijn Geest in u geven, en u zult leven, en Ik zal u in uw land zetten; en u zult weten dat Ik, de HEERE, dit gesproken en gedaan heb, spreekt de HEERE.", "Spr 16:17": "De weg van de oprechten is van het kwaad af te wijken; hij bewaart zijn ziel, die zijn weg bewaakt.", "Hand 17:25": "En wordt ook niet door mensenhanden gediend, alsof Hij iets nodig zou hebben, omdat Hij Zelf aan allen het leven, en de adem, en alle dingen geeft;", "Gen 1:2": "De aarde nu was woest en leeg, en duisternis lag op de diepte; en de Geest van God zweefde over de wateren.", "Pred 5:1": "Wees niet te snel met uw mond, en laat uw hart niet haasten om een woord voort te brengen voor Gods aangezicht; want God is in de hemel, en u bent op de aarde; daarom laat uw woorden weinig zijn.", "Ps 140:13": "Ik weet dat de HEERE de rechtszaak van de ellendigen, en het recht van de behoeftigen, zal uitvoeren.", "1 Petr 1:11": "en onderzochten op welke of wat voor tijd de Geest van Christus, Die in hen was, doelde, toen Hij vooraf getuigde van het lijden dat over Christus zou komen, en de heerlijkheid daarna.", "Ps 27:5": "Want Hij verbergt mij in Zijn hut, op de dag van het kwaad; Hij verbergt mij in het verborgene van Zijn tent; Hij verhoogt mij op een rotssteen.", "Jer 4:5-31": "Verkondig het in Juda, en laat het horen te Jeruzalem, en zeg het; ja, blaas de bazuin in het land; roep met volle stem en zeg: Verzamel u, en laten wij ingaan in de versterkte steden! Werp de banier op naar Sion, vlucht met spoed, blijf niet staan! Want Ik breng een kwaad aan van het noorden, en een grote ondergang. De leeuw is opgekomen uit zijn schuilplaats, en de verwoester van de heidenvolken is opgetrokken, hij is uitgegaan uit zijn plaats, om uw land te maken tot een woestenij; uw steden zullen verwoest worden, zodat er niemand in woont.", "Hebr 12:11": "En alle kastijding schijnt, terwijl zij aan de gang is, geen zaak van vreugde te zijn, maar van droefheid; maar daarna geeft zij aan hen die erdoor geoefend zijn een vreedzame vrucht van gerechtigheid.", "2 Kon 23:27": "En de HEERE zei: Ik zal Juda ook van Mijn aangezicht wegdoen, zoals Ik Israël weggedaan heb; en Ik zal deze stad Jeruzalem verwerpen, die Ik verkoren heb, en het huis waarvan Ik gezegd heb: Mijn Naam zal daar zijn.", "Ps 1:3": "Want hij zal zijn als een boom, geplant aan waterbeken, die zijn vrucht geeft op zijn tijd, en waarvan het blad niet afvalt; en alles wat hij doet, zal goed gelukken.", "1 Kor 6:12": "Alle dingen zijn mij toegestaan, maar niet alle dingen zijn nuttig; alle dingen zijn mij toegestaan, maar ik zal mij door niets onder de macht laten brengen.", "1 Petr 5:4": "En als de opperste Herder verschenen zal zijn, zult u de onverwelkbare kroon van de heerlijkheid ontvangen.", "Deut 1:30": "De HEERE, uw God, Die voor u uit gaat, Die zal voor u strijden, naar alles wat Hij voor uw ogen in Egypte voor u gedaan heeft.", "Openb 1:20": "de verborgenheid van de zeven sterren die u gezien hebt in Mijn rechterhand, en de zeven gouden kandelaren. De zeven sterren zijn de engelen van de zeven gemeenten; en de zeven kandelaren die u gezien hebt, zijn de zeven gemeenten.", "Jes 53:10-12": "Maar het behaagde de HEERE Hem te verbrijzelen; Hij heeft Hem ziek gemaakt. Als Zijn ziel Zich tot een schuldoffer gesteld zal hebben, zal Hij nageslacht zien, Hij zal de dagen verlengen; en het welbehagen van de HEERE zal door Zijn hand voorspoedig voortgaan. Om de arbeid van Zijn ziel zal Hij het zien en verzadigd worden; door Zijn kennis zal Mijn Knecht, de Rechtvaardige, velen rechtvaardig maken, want Hij zal hun ongerechtigheden dragen. Daarom zal Ik Hem een deel geven onder velen, en Hij zal de machtigen als buit verdelen, omdat Hij Zijn ziel uitgestort heeft in de dood, en onder de overtreders geteld is geweest, en Hij de zonden van velen gedragen heeft, en voor de overtreders gebeden heeft.", "Openb 15:4": "Wie zou U niet vrezen, Heere, en Uw Naam niet verheerlijken? Want Gij alleen zijt heilig; want alle volken zullen komen, en voor U aanbidden; want Uw oordelen zijn openbaar geworden.", "Jes 58:8": "Dan zal uw licht voortbreken als de dageraad, en uw genezing zal snel uitspruiten; en uw gerechtigheid zal voor uw aangezicht heengaan, en de heerlijkheid van de HEERE zal uw achterhoede zijn.", "Jak 1:5": "En als iemand van u wijsheid ontbreekt, laat hij die van God vragen, Die ieder mild geeft en niet verwijt; en ze zal hem gegeven worden.", "Job 33:18": "Dat Hij zijn ziel van het verderf afhoudt; en zijn leven, dat het door het zwaard niet doorga.", "Luk 9:34": "Terwijl hij dit zei, kwam er een wolk en overschaduwde hen; en zij werden bang toen zij de wolk in gingen.", "2 Kor 13:8": "Want wij vermogen niets tegen de waarheid, maar wel voor de waarheid.", "Mark 12:36": "Want David zelf heeft door de Heilige Geest gezegd: De Heere heeft gezegd tegen mijn Heere: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gemaakt heb.", "Jer 3:15": "En Ik zal u herders geven naar Mijn hart; die zullen u weiden met kennis en verstand.", "Ps 31:8": "Ik zal mij verheugen en verblijden in Uw goedertierenheid, omdat U mijn ellende hebt aangezien, en mijn ziel in benauwdheden gekend hebt;", "Joh 6:39": "En dit is de wil van de Vader, Die Mij gezonden heeft: dat Ik van alles wat Hij Mij gegeven heeft, niets verlies, maar het opwek op de laatste dag.", "Dan 3:28": "Nebukadnezar antwoordde en zei: Geloofd zij de God van Sadrach, Mesach en Abed-nego, Die Zijn engel gezonden en Zijn dienaren verlost heeft, die op Hem vertrouwd hebben, en het woord van de koning hebben veranderd, en hun lichamen overgegeven hebben, opdat zij geen god zouden eren of aanbidden dan hun eigen God.", "Jes 52:7-12": "Hoe lieflijk zijn op de bergen de voeten van hem die het goede nieuws brengt, die de vrede laat horen; van hem die goed nieuws brengt van het goede, die heil laat horen; van hem die tegen Sion zegt: Uw God is Koning. Er is een stem van uw wachters; zij verheffen de stem, zij juichen samen; want zij zullen oog in oog zien, wanneer de HEERE Sion terugbrengen zal. Maakt een geschal, juicht samen, u woeste plaatsen van Jeruzalem! Want de HEERE heeft Zijn volk getroost, Hij heeft Jeruzalem verlost.", "1 Petr 2:6": "Daarom staat er ook in de Schrift: Zie, Ik leg in Sion een uitverkoren, kostbare hoeksteen; en wie in Hem gelooft, zal niet beschaamd worden.", "Ps 9:12": "Zingt psalmen voor de HEERE, Die te Sion woont; verkondigt onder de volken Zijn daden.", "Luk 24:49": "En zie, Ik zend de belofte van Mijn Vader over u; maar blijft u in de stad Jeruzalem, totdat u bekleed wordt met kracht uit de hoogte.", "Ef 1:22": "En heeft alle dingen aan Zijn voeten onderworpen, en heeft Hem aan de Gemeente gegeven tot een Hoofd boven alle dingen;", "2 Petr 3:14": "Daarom, geliefden, terwijl u deze dingen verwacht, doe uw best om onbevlekt en onberispelijk door Hem bevonden te worden, in vrede;", "Ps 95:6": "Komt, laat ons aanbidden en neerbukken; laat ons knielen voor de HEERE, Die ons gemaakt heeft.", "1 Kon 18:44": "En het gebeurde bij de zevende keer, dat hij zei: Zie, een kleine wolk, als de hand van een man, komt op vanuit de zee. En hij zei: Ga op, zeg tegen Achab: Span aan, en kom naar beneden, zodat de regen u niet ophoudt.", "Ef 1:10": "Om in de bedeling van de volheid der tijden alles weer tot één te vergaderen in Christus, zowel wat in de hemel is, als wat op de aarde is;", "Jes 10:20": "En het zal gebeuren op die dag, dat het overblijfsel van Israël, en wie ontkomen waren van het huis van Jakob, niet meer zullen steunen op hem die ze geslagen heeft; maar zij zullen steunen op de HEERE, de Heilige van Israël, oprecht.", "Rom 8:4": "Opdat het recht van de wet vervuld zou worden in ons, die niet naar het vlees wandelen, maar naar de Geest.", "Ef 2:22": "op Wie ook u mede gebouwd wordt tot een woonplaats van God in de Geest.", "Hebr 13:6": "Zodat wij vrijmoedig durven zeggen: De Heere is mij een Helper, en ik zal niet vrezen wat een mens mij zal doen.", "1 Kor 13:10-12": "Maar wanneer het volmaakte gekomen zal zijn, dan zal wat ten dele is, tot niets gemaakt worden. Toen ik een kind was, sprak ik als een kind, was ik gezind als een kind, overlegde ik als een kind; maar toen ik een man geworden ben, heb ik wat bij een kind hoort tot niets gemaakt. Want wij zien nu door een spiegel in een duistere afspiegeling, maar dan zullen wij zien van aangezicht tot aangezicht; nu ken ik ten dele, maar dan zal ik kennen, zoals ik ook gekend ben.", "Job 23:6": "Zou Hij naar de grootheid van Zijn macht met mij twisten? Nee; maar Hij zou acht op mij slaan.", "1 Joh 5:21": "Kinderen, bewaar uzelf voor de afgoden. Amen.", "Amos 5:9": "Die verwoesting brengt over een sterke, zodat de verwoesting komt over een vesting.", "Joh 17:2": "Zoals U Hem macht gegeven hebt over alle vlees, opdat Hij aan allen die U Hem gegeven hebt, het eeuwige leven geeft.", "Deut 31:3": "De HEERE, uw God, Die zal voor u overtrekken; Die zal deze volken van voor u wegvagen, zodat u hen erfelijk bezit. Jozua zal voor u overtrekken, zoals de HEERE gesproken heeft.", "Lev 10:3": "En Mozes zei tegen Aäron: Dit is het wat de HEERE gesproken heeft: In hen die tot Mij naderen zal Ik geheiligd worden, en voor het aangezicht van heel het volk zal Ik verheerlijkt worden. Maar Aäron zweeg stil.", "Matt 28:10": "Toen zei Jezus tegen hen: Wees niet bang; ga heen, vertel Mijn broeders dat zij naar Galilea moeten gaan, en daar zullen zij Mij zien.", "Jes 51:7": "Hoor naar Mij, u die de gerechtigheid kent, u volk, in wiens hart Mijn wet is! Vrees niet de smaad van de mens, en voor hun smaadredenen hoeft u niet ontzet te zijn.", "2 Tess 1:7": "En aan u, die verdrukt wordt, verkwikking te geven met ons, bij de openbaring van de Heere Jezus vanuit de hemel met de engelen van Zijn kracht;", "Ps 138:8": "De HEERE zal het voor mij voleinden; Uw goedertierenheid, HEERE! is in eeuwigheid; en laat de werken van Uw handen niet varen.", "Deut 28:9": "De HEERE zal u voor Zichzelf tot een heilig volk bevestigen, zoals Hij u gezworen heeft, wanneer u de geboden van de HEERE, uw God, houdt, en in Zijn wegen wandelt.", "Ps 119:32": "Ik zal de weg van Uw geboden lopen, als U mijn hart verwijd zult hebben.", "1 Tess 5:23": "En de God van de vrede Zelf heilige u geheel en al; en uw geheel oprechte geest, en ziel, en lichaam moeten onberispelijk bewaard worden bij de komst van onze Heere Jezus Christus.", "Gal 3:3": "Bent u zo onverstandig? U bent met de Geest begonnen, gaat u nu voleindigen met het vlees?", "Gal 5:23": "Tegen zulke mensen is de wet niet.", "Zach 1:14-21": "En de Engel Die met mij sprak, zei tegen mij: Roep uit en zeg: Zo zegt de HEERE van de heerscharen: Ik ijver over Jeruzalem en over Sion met een grote ijver. En Ik ben met een zeer grote toorn vertoornd tegen die geruste heidenen; want Ik was een weinig toornig, maar zij hebben tot het kwade meegeholpen. Daarom zegt de HEERE zo: Ik ben tot Jeruzalem teruggekeerd met ontfermingen; Mijn huis zal daarin gebouwd worden, spreekt de HEERE van de heerscharen, en het meetlint zal over Jeruzalem uitgespannen worden.", "Ps 107:10": "Die in duisternis en de schaduw van de dood zaten, gebonden met verdrukking en ijzer;", "2 Kor 12:9": "En Hij heeft tegen mij gezegd: Mijn genade is u genoeg; want Mijn kracht wordt in zwakheid volbracht. Zo zal ik dan veel liever roemen in mijn zwakheden, opdat de kracht van Christus in mij woont.", "Hand 13:2": "En terwijl zij de Heere dienden en vastten, zei de Heilige Geest: Zonder Mij Barnabas en Saulus af voor het werk waartoe Ik hen geroepen heb.", "Ps 94:13": "Om hem rust te geven van de kwade dagen; totdat de kuil voor de goddeloze gegraven wordt.", "Spr 10:29": "De weg van de HEERE is sterkte voor de oprechte; maar ondergang voor de werkers van ongerechtigheid.", "Ezech 34:11-16": "Want zo zegt de Heere HEERE: Zie, Ik, ja, Ik zal naar Mijn schapen vragen, en zal ze opzoeken. Zoals een herder zijn kudde opzoekt, op de dag dat hij te midden van zijn verspreide schapen is, zo zal Ik Mijn schapen opzoeken; en Ik zal ze redden uit al de plaatsen, waarheen zij verstrooid zijn, op de dag van de wolk en de donkerheid. En Ik zal ze uitvoeren van de volken, en zal ze verzamelen uit de landen, en ze in hun land brengen; en Ik zal ze weiden op de bergen van Israël, bij de stromen en in alle bewoonbare plaatsen van het land.", "Jes 26:20": "Ga heen, mijn volk, ga in uw binnenkamers, en sluit uw deuren achter u toe; verberg u voor een klein ogenblik, totdat de gramschap voorbijgaat.", "Ps 37:34": "Koph. Wacht op de HEERE, en houd Zijn weg, en Hij zal u verhogen om de aarde erfelijk te bezitten; u zult zien dat de goddelozen worden uitgeroeid.", "Ezech 20:40": "Want op Mijn heilige berg, op de hoge berg van Israël, spreekt de Heere HEERE, daar zal Mij het hele huis van Israël in het land dienen, zij allen; daar zal Ik welgevallen aan hen hebben, en daar zal Ik uw hefoffers eisen, en de eerstelingen van uw heffingen met al uw geheiligde dingen.", "Ps 149:1": "Halleluja! Zing de HEERE een nieuw lied; Zijn lof zij in de gemeente van Zijn gunstgenoten.", "Jer 39:17": "Maar Ik zal u op die dag redden, spreekt de HEERE; en u zult niet overgegeven worden in de hand van de mannen, voor wier aangezicht u vreest.", "Ps 132:7": "Wij zullen in Zijn woningen ingaan, wij zullen ons neerbuigen voor de voetbank van Zijn voeten.", "Joh 1:13": "Die niet uit bloed, niet uit de wil van het vlees, en niet uit de wil van een man, maar uit God geboren zijn.", "Hand 2:33": "Hij dan, door de rechterhand van God verhoogd, en de belofte van de Heilige Geest ontvangen hebbend van de Vader, heeft dit uitgestort, wat u nu ziet en hoort.", "Jes 32:3": "En de ogen van hen die zien, zullen niet terugzien, en de oren van hen die horen, zullen opmerken.", "Rom 9:23": "en opdat Hij de rijkdom van Zijn heerlijkheid bekend zou maken over de vaten van de barmhartigheid, die Hij van tevoren klaargemaakt heeft tot heerlijkheid?", "1 Kor 12:31": "Streef daarom naar de beste gaven; en ik wijs u nog een weg, die voortreffelijker is.", "Jak 4:15": "In plaats daarvan zou u moeten zeggen: Als de Heere het wil, en wij leven, zullen wij dit of dat doen.", "2 Petr 1:10": "Span u daarom, broeders, des te meer in om uw roeping en verkiezing vast te maken; want als u dat doet, zult u nooit struikelen.", "Zach 3:4": "Toen antwoordde Hij, en sprak tot hen die voor Zijn aangezicht stonden: Doe deze vuile kleren van hem weg. Daarna sprak Hij tot hem: Zie, Ik heb uw ongerechtigheid van u weggenomen, en Ik zal u stellen (extra) kleren aandoen.", "Ps 102:14": "U zult opstaan, U zult U ontfermen over Sion, want de tijd om haar genadig te zijn, want de bestemde tijd is gekomen.", "Dan 7:18": "Maar de heiligen van de hoge plaatsen zullen dat Koninkrijk ontvangen, en zij zullen het Rijk bezitten tot in eeuwigheid, ja, tot in eeuwigheid der eeuwigheden.", "Hand 4:31": "En toen zij gebeden hadden, werd de plaats waarin zij bijeen waren, geschud. En zij werden allen vervuld met de Heilige Geest, en spraken het Woord van God met vrijmoedigheid.", "Jes 55:1-13": "O, alle dorstigen, kom tot de wateren, en u die geen geld heeft, kom, koop en eet, ja kom, koop zonder geld en zonder prijs, wijn en melk! Waarom weegt u geld uit voor wat geen brood is, en uw arbeid voor wat niet verzadigen kan? Hoor aandachtig naar Mij, en eet het goede, en laat uw ziel zich verlustigen in vettigheid. Neig uw oor, en kom tot Mij, hoor en uw ziel zal leven; want Ik zal met u een eeuwig verbond maken, en u geven de zekere weldaden van David.", "Openb 19:11-21": "En ik zag de hemel geopend; en zie, een wit paard, en Die daarop zat, werd genoemd Getrouw en Waarachtig, en Hij oordeelt en voert krijg in gerechtigheid. En Zijn ogen waren als een vlam van het vuur, en op Zijn hoofd waren veel koninklijke hoeden; en Hij had een naam geschreven, die niemand wist, dan Hij Zelf. En Hij was bekleed met een kleed, dat met bloed geverfd was; en Zijn naam wordt genoemd het Woord van God.", "1 Petr 4:12-14": "Geliefden, houd u niet vreemd over de hitte van de verdrukking onder u, die u overkomt tot beproeving, alsof u iets vreemds overkwam; maar zoals u gemeenschap hebt aan het lijden van Christus, zo verblijdt u; opdat u ook in de openbaring van Zijn heerlijkheid u mag verblijden en verheugen. Als u gesmaad wordt om de Naam van Christus, dan bent u gelukkig; want de Geest van de heerlijkheid, en de Geest van God, rust op u. Wat hen aangaat, Hij wordt wel gelasterd, maar wat u aangaat, Hij wordt verheerlijkt.", "Ps 19:15": "Laat de redenen van mijn mond, en de overdenking van mijn hart welgevallig zijn voor Uw aangezicht, o HEERE, mijn Rotssteen en mijn Verlosser!", "1 Kor 15:48-57": "Zoals de aardse is, zo zijn ook de aardsen; en zoals de Hemelse is, zo zijn ook de hemelsen. En zoals wij het beeld van de aardse gedragen hebben, zo zullen wij ook het beeld van de Hemelse dragen. Maar dit zeg ik, broeders, dat vlees en bloed het Koninkrijk van God niet kunnen beërven, en de vergankelijkheid beërft de onvergankelijkheid niet.", "1 Joh 1:9": "Als wij onze zonden belijden: Hij is getrouw en rechtvaardig, om ons de zonden te vergeven, en ons te reinigen van alle ongerechtigheid.", "Ezech 14:10": "En zij zullen hun ongerechtigheid dragen; zoals de ongerechtigheid van de vrager zal zijn, zo zal de ongerechtigheid van de profeet zijn;", "2 Tess 1:4": "Zodat wij zelf over u roemen in de Gemeenten van God, over uw volharding en geloof in al uw vervolgingen en verdrukkingen, die u verdraagt;", "1 Kor 7:23": "U bent duur gekocht, word geen dienstknechten van mensen.", "Ps 61:7": "U zult dagen tot de dagen van de koning toedoen; zijn jaren zullen zijn als van geslacht tot geslacht;", "1 Joh 4:7": "Geliefden, laten wij elkaar liefhebben, want de liefde is uit God; en ieder die liefheeft, is uit God geboren, en kent God.", "Hand 20:32": "En nu, broeders, ik vertrouw u toe aan God, en aan het woord van Zijn genade, dat machtig is u op te bouwen, en u een erfdeel te geven onder alle geheiligden.", "Spr 15:29": "De HEERE is ver van de goddelozen; maar het gebed van de rechtvaardigen zal Hij verhoren.", "Obadja 1:1": "Het visioen van Obadja. Zo zegt de Heere HEERE van Edom: Wij hebben een bericht gehoord van de HEERE, en er is een gezant gestuurd onder de heidenvolken: Sta op, en laten wij tegen haar opstaan ten strijde.", "Jes 26:12": "HEERE, U zult ons vrede geven, want U hebt ook al onze zaken voor ons volbracht.", "Jak 4:4": "Overspelers en overspeleressen, weet u niet dat de vriendschap met de wereld vijandschap tegen God is? Wie dan ook een vriend van de wereld wil zijn, wordt daarmee een vijand van God.", "Zach 14:9": "En de HEERE zal Koning zijn over de hele aarde; op die dag zal de HEERE één zijn, en Zijn Naam één.", "Jes 51:22": "Zo zegt de Heere, de HEERE en uw God, Die de zaak van Zijn volk twisten zal: Zie, Ik neem de beker van de zwijmeling van uw hand, de droesem van de beker van Mijn grimmigheid; u zult die voortaan niet meer drinken.", "Mal 3:12": "En alle heidenen zullen u gelukzalig noemen; want u zult een lustig land zijn, zegt de HEERE van de heerscharen.", "Luk 10:20": "Maar verblijd u daar niet in, dat de geesten zich aan u onderwerpen; verblijd u veel meer dat uw namen opgeschreven zijn in de hemelen.", "1 Joh 5:12": "Wie de Zoon heeft, die heeft het leven; wie de Zoon van God niet heeft, die heeft het leven niet.", "Kol 3:4": "Wanneer nu Christus geopenbaard zal zijn, Die ons leven is, dan zult ook u met Hem geopenbaard worden in heerlijkheid.", "Ef 1:4": "Zoals Hij ons uitverkoren heeft in Hem, voor de grondlegging van de wereld, opdat wij heilig en onberispelijk zouden zijn voor Hem in de liefde;", "Openb 2:11": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, zal van de tweede dood geen schade lijden.", "Luk 19:43": "Want er zullen dagen over u komen, dat uw vijanden een wal rondom u zullen opwerpen, en u zullen omsingelen, en u van alle kanten in het nauw drijven;", "Zach 2:8": "Want zo zegt de HEERE van de heerscharen: Naar de heerlijkheid over u, heeft Hij mij gezonden tot die heidenen, die u beroofd hebben; want die u aanraakt, die raakt Zijn oogappel aan.", "Jes 32:15-20": "Totdat over ons de Geest uit de hoogte uitgegoten wordt; dan zal de woestijn tot een vruchtbaar veld worden, en het vruchtbare veld zal voor een woud gerekend worden. En het recht zal in de woestijn wonen, en de gerechtigheid zal op het vruchtbare veld verblijven. En het werk van de gerechtigheid zal vrede zijn; en de uitwerking van de gerechtigheid zal rust en zekerheid zijn, tot in eeuwigheid.", "Deut 8:16": "Die u in de woestijn voedde met manna, dat uw vaderen niet gekend hadden; om u te verootmoedigen, en om u te beproeven, opdat Hij u uiteindelijk goeddeed;", "Kol 3:10": "en de nieuwe mens hebt aangedaan, die vernieuwd wordt tot kennis, naar het evenbeeld van Hem die hem geschapen heeft;", "Job 5:6-27": "Want uit het stof komt het verdriet niet voort, en de moeite spruit niet uit de aarde; Maar de mens wordt tot moeite geboren; zoals de vonken van het vuur zich verheffen om te vliegen. Doch ik zou God zoeken, en tot God mijn aanspraak richten;", "2 Petr 1:11": "Want zo zal u rijkelijk de ingang worden verleend in het eeuwige Koninkrijk van onze Heere en Zaligmaker, Jezus Christus.", "Jes 9:4": "Toen de hele strijd van hen die streden, met gedruis gebeurde, en de kleren in het bloed gewenteld en verbrand werden, tot een voedsel van het vuur.", "Jes 26:7": "Het pad van de rechtvaardige is geheel effen, de gang van de rechtvaardige weegt U recht.", "Lev 10:8-10": "En de HEERE sprak tegen Aäron: Wijn en sterke drank mag u niet drinken, u, en ook uw zonen niet, als u de tent van de samenkomst ingaat, zodat u niet sterft; het is een eeuwige inzetting onder uw generaties; En om onderscheid te maken tussen het heilige en het onheilige, en tussen het onreine en het reine;", "Ps 87:2": "De HEERE heeft de poorten van Sion lief, boven alle woningen van Jakob.", "Jes 32:1-20": "Zie, een koning zal regeren in gerechtigheid, en de vorsten zullen heersen naar recht. En die man zal zijn als een schuilplaats tegen de wind, en een schuilplaats tegen de storm, als waterbeken in een dorre plaats, als de schaduw van een zware rotssteen in een dorstig land. En de ogen van hen die zien, zullen niet terugzien, en de oren van hen die horen, zullen opmerken.", "Mark 5:19": "Maar Jezus stond hem dat niet toe, maar zei tegen hem: Ga naar uw huis, naar de uwen, en vertel hun wat grote dingen de Heere aan u gedaan heeft, en hoe Hij Zich over u ontfermd heeft.", "Hebr 2:10-18": "Want het paste Hem, om Wie alle dingen zijn, en door Wie alle dingen zijn, dat Hij, veel kinderen naar de heerlijkheid leidend, de leidsman van hun zaligheid door lijden zou volmaken. Want Hij Die heiligt, en zij die geheiligd worden, zijn allen uit één; om die reden schaamt Hij Zich niet hen broeders te noemen, En Hij zegt: Ik zal Uw naam aan Mijn broeders verkondigen; in het midden van de Gemeente zal Ik U lofzingen.", "Joh 1:14": "En het Woord is vlees geworden, en heeft onder ons gewoond (en wij hebben Zijn heerlijkheid aanschouwd, een heerlijkheid als van de Eniggeborene van de Vader), vol van genade en waarheid.", "Ps 118:13": "U had mij zeer hard gestoten, tot vallen toe, maar de HEERE heeft mij geholpen.", "Ps 68:19": "U bent opgevaren in de hoogte; U hebt de gevangenis gevankelijk weggevoerd; U hebt gaven genomen om uit te delen onder de mensen; ja, ook de opstandigen, om bij U te wonen, o HEERE God!", "Ef 3:16": "opdat Hij u geeft, naar de rijkdom van Zijn heerlijkheid, met kracht versterkt te worden door Zijn Geest in de innerlijke mens;", "Openb 7:9-14": "Hierna zag ik, en zie, een grote menigte, die niemand tellen kon, uit alle naties, en geslachten, en volken, en talen, die stond voor de troon en voor het Lam, bekleed met lange witte kleren, en takken van palmen waren in hun handen. En zij riepen met luide stem: De zaligheid is van onze God, Die op de troon zit, en van het Lam. En alle engelen stonden rond de troon, en rond de oudsten en de vier dieren; en zij vielen voor de troon neer op hun gezicht, en aanbaden God,", "Deut 13:17": "Ook zal er niets van het verbannene aan uw hand kleven, opdat de HEERE Zich wendt van de hitte van Zijn toorn, en u barmhartigheid geeft, en Zich over u erbarmt, en u vermenigvuldigt, zoals Hij uw vaders gezworen heeft;", "Luk 2:8": "En er waren herders in diezelfde landstreek, die in het veld verbleven en 's nachts de wacht hielden over hun kudde.", "Luk 18:30": "die niet veel meer terug zal ontvangen in deze tijd, en in de toekomende eeuw het eeuwige leven.", "Matt 24:2": "En Jezus zei tegen hen: Ziet u niet al deze dingen? Voorwaar, Ik zeg u: hier zal geen steen op de andere steen gelaten worden, die niet zal worden afgebroken.", "Ps 73:24": "U zult mij leiden door Uw raad; en daarna zult U mij in heerlijkheid opnemen.", "Ps 72:14": "Hij zal hun zielen van list en geweld bevrijden, en hun bloed zal dierbaar zijn in zijn ogen.", "Ps 99:2": "De HEERE is groot in Sion, en Hij is hoog boven alle volken.", "Hebr 9:14": "hoeveel te meer zal het bloed van Christus, Die door de eeuwige Geest Zichzelf onberispelijk aan God geofferd heeft, uw geweten reinigen van dode werken, om de levende God te dienen?", "Tit 2:9": "Vermaan de dienstknechten dat zij hun eigen heren onderdanig zijn, dat zij in alles welgevallig zijn, niet tegensprekend;", "Jak 5:20": "Laat die weten, dat wie een zondaar van de dwaling van zijn weg bekeert, een ziel van de dood zal behouden, en een menigte van zonden zal bedekken.", "Ps 37:18": "Jod. De HEERE kent de dagen van de oprechten; en hun erfenis zal in eeuwigheid blijven.", "Jes 62:1-12": "Om Sion zal Ik niet zwijgen, en om Jeruzalem zal Ik niet stil zijn; totdat haar gerechtigheid voortkomt als een glans, en haar heil als een fakkel, die brandt. En de heidenen zullen uw gerechtigheid zien, en alle koningen uw heerlijkheid; en u zult met een nieuwe naam genoemd worden, die de mond van de HEERE nauwkeurig noemen zal. En u zult een sierlijke kroon zijn in de hand van de HEERE, en een koninklijke hoed in de hand van uw God.", "Jes 51:4-6": "Luister naar Mij, Mijn volk! En Mijn lieden, neig naar Mij het oor! Want een wet zal van Mij uitgaan, en Ik zal Mijn recht doen rusten tot een licht van de volken. Mijn gerechtigheid is nabij, Mijn heil trekt uit, en Mijn armen zullen de volken richten; op Mij zullen de eilanden wachten, en op Mijn arm zullen zij hopen. Hef uw ogen op naar de hemel, en kijk naar de aarde beneden; want de hemel zal als rook verdwijnen, en de aarde zal als een kleed verouderen, en haar inwoners zullen op dezelfde manier sterven; maar Mijn heil zal in eeuwigheid zijn, Mijn gerechtigheid zal niet verbroken worden.", "Jes 31:9": "En hij zal van angst voorbijgaan naar zijn rots, en zijn vorsten zullen voor de banier verschrikken, spreekt de HEERE, Die te Sion vuur, en te Jeruzalem een oven heeft.", "Jes 30:23": "Dan zal Hij uw zaad, waarmee u het land bezaaid hebt, regen geven, en brood van de opbrengst van het land, en dat zal vet en overvloedig zijn; uw vee zal op die dag in een wijde landouwe weiden.", "Jes 12:5": "Zingt psalmen voor de HEERE, want Hij heeft heerlijke dingen gedaan; laat dat bekend zijn op de hele aardbodem.", "Spr 29:25": "De angst voor mensen legt een strik; maar wie op de HEERE vertrouwt, zal veilig gesteld worden.", "Hos 2:22": "En Ik zal ze Mij op de aarde zaaien, en Ik zal Mij ontfermen over Lo-Ruchama; en Ik zal zeggen tegen Lo-Ammi: U bent Mijn volk; en dat zal zeggen: O, mijn God!", "Jes 26:2": "Doe de poorten open, zodat het rechtvaardige volk daarin gaat, dat de trouw bewaart.", "Luk 11:10": "Want ieder die bidt, die ontvangt; en die zoekt, die vindt; en die klopt, voor die zal opengedaan worden.", "2 Kor 10:5": "Waarbij wij de overleggingen neerwerpen, en alle hoogte die zich verheft tegen de kennis van God, en elke gedachte gevangennemen tot de gehoorzaamheid van Christus;", "Ex 29:43": "En daar zal Ik komen tot de kinderen van Israël; opdat zij geheiligd worden door Mijn heerlijkheid.", "Jes 26:21": "Want zie, de HEERE zal uit Zijn plaats uitgaan, om de ongerechtigheid van de inwoners van de aarde over hen te bezoeken; en de aarde zal haar bloed onthullen, en zal haar gedoden niet langer bedekt houden.", "Ef 4:20-24": "Maar u hebt Christus zo niet geleerd; Als u naar Hem hebt geluisterd, en door Hem geleerd bent, zoals de waarheid in Jezus is; Namelijk dat u zou afleggen, wat betreft de vorige levenswandel, de oude mens, die verdorven wordt door de begeerten van de verleiding;", "Jes 60:7-9": "Al de schapen van Kedar zullen tot u verzameld worden; de rammen van Nebajoth zullen u dienen; zij zullen met welgevallen op Mijn altaar komen, en Ik zal het huis van Mijn heerlijkheid heerlijk maken. Wie zijn deze, die daar komen aangevlogen als een wolk, en als duiven naar hun vensters? Want de eilanden zullen Mij verwachten, en de schepen van Tarsis vooreerst, om uw kinderen van verre te brengen, hun zilver en hun goud met hen, tot de Naam van de HEERE, uw God, en tot de Heilige van Israël, omdat Hij u heerlijk gemaakt heeft.", "Hebr 9:15": "En daarom is Hij de Middelaar van het nieuwe testament, opdat, nu de dood daartussen gekomen is, tot verzoening van de overtredingen die er waren onder het eerste testament, degenen die geroepen zijn de belofte van de eeuwige erfenis zouden ontvangen.", "Openb 1:7": "Zie, Hij komt met de wolken en elk oog zal Hem zien, ook zij die Hem doorstoken hebben; en alle geslachten van de aarde zullen over Hem rouw bedrijven; ja, amen.", "Ps 48:10": "O God! wij gedenken Uw weldadigheid, in het midden van Uw tempel.", "Ps 145:11": "Caph. Zij zullen de heerlijkheid van Uw Koninkrijk vermelden, en Uw macht zullen zij uitspreken.", "Openb 19:8": "En haar is gegeven dat zij bekleed wordt met rein en blinkend fijn linnen; want dit fijne linnen is de rechtvaardigmakingen van de heiligen.", "Spr 21:15": "Het is voor de rechtvaardige een blijdschap recht te doen; maar voor de werkers van de ongerechtigheid is het verschrikking.", "Hand 5:9": "En Petrus zei tot haar: Wat is het, dat u onderling hebt afgesproken om de Geest van de Heere te verzoeken? Zie, de voeten van hen die uw man begraven hebben, zijn voor de deur, en zullen u uitdragen.", "Ps 32:10": "De goddeloze heeft veel smarten, maar wie op de HEERE vertrouwt, die zal de goedertierenheid omringen.", "Lev 20:26": "En u zult Mij heilig zijn, want Ik, de HEERE, ben heilig; en Ik heb u van de volken afgezonderd, opdat u van Mij zou zijn.", "Luk 1:75": "in heiligheid en gerechtigheid voor Hem, al de dagen van ons leven.", "Ps 34:11": "Caph. De jonge leeuwen lijden armoede en honger; maar die de HEERE zoeken hebben geen gebrek aan enig goed.", "Ex 3:8": "Daarom ben Ik neergekomen, om het te verlossen uit de hand van de Egyptenaren, en het op te voeren uit dit land, naar een goed en ruim land, naar een land dat overvloeit van melk en honing, naar de plaats van de Kanaänieten, en de Hethieten, en de Amorieten, en de Ferezieten, en de Hevieten, en de Jebusieten.", "1 Kor 8:3": "Maar als iemand God liefheeft, die is door Hem gekend.", "Hagg 2:6": "Met het woord, waarmee Ik met u een verbond gemaakt heb, toen u uit Egypte trok, en met Mijn Geest, die in uw midden staat: wees niet bevreesd!", "Tit 3:7": "Opdat wij, gerechtvaardigd door Zijn genade, erfgenamen zouden worden naar de hoop van het eeuwige leven.", "Spr 20:24": "De treden van de man zijn van de HEERE; hoe zou een mens dan zijn weg begrijpen?", "Jer 24:5": "Zo zegt de HEERE, de God van Israël: Zoals die goede vijgen, zo zal Ik de weggevoerden van Juda erkennen, die Ik uit deze plaats naar het land van de Chaldeeën heb weggestuurd, tot hun eigen goed.", "Ps 18:2": "Hij zei dan: Ik zal U hartelijk liefhebben, HEERE, mijn Sterkte!", "1 Tess 4:16-18": "Want de Heere Zelf zal met een geroep, met de stem van de aartsengel, en met de bazuin van God neerdalen van de hemel; en zij die in Christus gestorven zijn, zullen eerst opstaan; Daarna zullen wij, die levend overgebleven zijn, samen met hen opgenomen worden in de wolken, de Heere tegemoet, in de lucht; en zo zullen wij altijd bij de Heere zijn. Zo dan, vertroost elkaar met deze woorden.", "Jes 25:7": "En Hij zal op deze berg verslinden het bewindsel van het aangezicht, waarmee alle volken bewonden zijn, en het deksel, waarmee alle naties bedekt zijn.", "Ps 46:8": "De HEERE van de heerscharen is met ons; de God van Jakob is ons een Hoog Vertrek. Sela.", "Hebr 9:9": "dat was een afbeelding voor de toenmalige tijd, waarin gaven en offers gebracht werden die degene die de dienst uitoefende niet konden volmaken naar het geweten;", "Matt 25:33": "En Hij zal de schapen aan Zijn rechterhand zetten, maar de bokken aan Zijn linkerhand.", "Ps 34:18": "Tsade. Zij roepen, en de HEERE hoort, en Hij redt hen uit al hun benauwdheden.", "Mark 4:26-29": "En Hij zei: Zo is het Koninkrijk van God, alsof een mens het zaad in de aarde wierp; en vervolgens sliep en opstond, nacht en dag; en het zaad ontkiemde en groeide op, terwijl hij zelf niet wist hoe. Want de aarde brengt uit zichzelf vruchten voort: eerst het kruid, daarna de aar, daarna het volle koren in de aar.", "Num 11:25": "Toen kwam de HEERE neer in de wolk, en sprak tot hem, en Hij nam van de Geest die op hem was, en legde die op de zeventig mannen, de oudsten; en het gebeurde, toen de Geest op hen rustte, dat zij profeteerden, maar daarna niet meer.", "Joh 10:10": "De dief komt niet dan om te stelen, en te slachten, en te verderven; Ik ben gekomen, opdat zij het leven hebben, en overvloed hebben.", "Ezech 36:29": "En Ik zal u verlossen van al uw onreinheden; en Ik zal roepen tot het koren, en zal dat vermenigvuldigen, en Ik zal geen honger op u leggen.", "Klaagl 5:6": "Wij hebben de Egyptenaar de hand gegeven, en de Assyriër, om met brood verzadigd te worden.", "Gen 15:1": "Na deze dingen kwam het woord van de HEERE tot Abram in een visioen, en Hij zei: Vrees niet, Abram! Ik ben u een Schild, uw Loon zeer groot.", "Kol 3:12-15": "Doe dan aan, als uitverkorenen van God, heiligen en geliefden, de innerlijke bewegingen van barmhartigheid, goedertierenheid, ootmoedigheid, zachtmoedigheid, geduld; verdraag elkaar en vergeef elkaar, als iemand tegen iemand enige klacht heeft; zoals ook Christus u vergeven heeft, doe ook u zo. En doe boven dit alles de liefde aan, die de band van de volmaaktheid is.", "Jes 40:29": "Hij geeft de moede kracht, en Hij vermeerdert de sterkte van wie geen krachten heeft.", "Hand 13:52": "En de discipelen werden vervuld met blijdschap en met de Heilige Geest.", "Ps 24:3-5": "Wie zal klimmen op de berg van de HEERE, en wie zal staan in de plaats van Zijn heiligheid? Die rein van handen, en zuiver van hart is, die zijn ziel niet opheft tot ijdelheid, en die niet bedrieglijk zweert; die zal de zegen ontvangen van de HEERE, en gerechtigheid van de God van zijn heil.", "Joh 5:14": "Daarna vond Jezus hem in de tempel, en zei tegen hem: Zie, u bent gezond geworden; zondig niet meer, opdat u niet iets ergers overkomt.", "Micha 4:1-7": "Maar in het laatste van de dagen zal het gebeuren, dat de berg van het huis van de HEERE vastgesteld zal zijn op de top van de bergen; en hij zal verheven zijn boven de heuvels, en de volken zullen naar hem toestromen. En veel heidenvolken zullen heengaan en zeggen: Kom, laat ons opgaan naar de berg van de HEERE, en naar het huis van de God van Jakob, opdat Hij ons zijn wegen leert, en wij op Zijn paden wandelen; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem. En Hij zal onder grote volken rechtspreken, en machtige heidenvolken straffen, tot ver weg toe; en zij zullen hun zwaarden omsmeden tot ploegscharen, en hun speren tot snoeimessen; het ene volk zal tegen het andere volk geen zwaard opheffen, en zij zullen de oorlog niet meer leren.", "Ezech 11:22": "Toen tilden de cherubs hun vleugels op, en de raderen tegenover hen; en de heerlijkheid van de God van Israël was van boven over hen.", "Ps 48:3": "Schoon van ligging, een vreugde van de hele aarde is de berg Sion, aan de zijden van het noorden; de stad van de grote Koning.", "Gen 14:20": "En gezegend zij de allerhoogste God, Die uw vijanden in uw hand overgeleverd heeft! En hij gaf hem het tiende deel van alles.", "2 Kor 4:11": "Want wij, die leven, worden altijd om Jezus' wil in de dood overgegeven, opdat ook het leven van Jezus in ons sterfelijk vlees openbaar zou worden.", "Kol 1:5": "Vanwege de hoop die voor u weggelegd is in de hemelen, waarvan u eerder gehoord hebt door het Woord van de waarheid, namelijk van het Evangelie;", "Jes 27:6": "In de toekomst zal Jakob wortelen schieten, Israël zal bloeien en groeien; en zij zullen de wereld met inkomsten vervullen.", "Jes 2:17": "En de hoogheid van de mensen zal gebogen worden, en de hoogheid van de mannen zal vernederd worden; en de HEERE alleen zal op die dag verheven zijn.", "Ezech 34:22-31": "Daarom zal Ik Mijn schapen verlossen, zodat zij niet meer tot een roof zullen zijn; en Ik zal richten tussen klein vee en klein vee. En Ik zal één Herder over hen doen opstaan, en Hij zal hen weiden, namelijk Mijn knecht David; die zal ze weiden, en Die zal hun tot een Herder zijn. En Ik, de HEERE, zal hun tot een God zijn; en Mijn knecht David zal Vorst zijn te midden van hen, Ik, de HEERE, heb het gesproken.", "Ps 48:4": "God is in haar paleizen; Hij is er bekend voor een Hoog Vertrek.", "Ezra 3:10-13": "Toen nu de bouwers de grond van de tempel van de HEERE legden, stelden zij de priesters op, gekleed in hun ambtskleding, met trompetten, en de Levieten, de zonen van Asaf, met cimbalen, om de HEERE te loven, naar de instelling van David, de koning van Israël. En zij zongen bij beurten, om de HEERE te loven en te danken, omdat Hij goed is en Zijn goedertierenheid tot in eeuwigheid is over Israël. En heel het volk juichte met groot gejuich, toen men de HEERE loofde vanwege de grondlegging van het huis van de HEERE. Maar velen van de priesters en de Levieten en hoofden van de families, die oud waren en het eerste huis gezien hadden, weenden met luide stem toen dit huis in hun grondlegging voor hun ogen was; maar velen verhieven de stem met gejuich en met vreugde.", "Ps 119:143": "Benauwdheid en angst hebben mij getroffen, doch Uw geboden zijn mijn vermakingen.", "Jes 66:7-23": "Voordat zij barensnood had, heeft zij gebaard, voordat haar smart kwam, is zij al van een jongetje bevrijd. Wie heeft ooit zoiets gehoord? Wie heeft dergelijke dingen gezien? Zou een land geboren kunnen worden op één dag? Zou een volk geboren kunnen worden in één keer? Maar Sion heeft weeën gekregen, en zij heeft haar zonen gebaard. Zou Ik de baarmoeder openbreken, en niet laten baren? zegt de HEERE; zou Ik, Die laat baren, voortaan toesluiten? zegt uw God.", "Ps 139:7": "Waar zou ik heengaan voor Uw Geest, en waar zou ik heenvlieden voor Uw aangezicht?", "Ps 46:2": "God is ons een Toevlucht en Sterkte; Hij is met kracht bevonden een Hulp in benauwdheden.", "Joh 14:27": "Vrede laat Ik u na, Mijn vrede geef Ik u; niet zoals de wereld die geeft, geef Ik hem u. Laat uw hart niet ontroerd worden en niet bevreesd zijn.", "Luk 18:17": "Voorwaar, Ik zeg u: wie het Koninkrijk van God niet ontvangt als een kind, zal daar geenszins ingaan.", "1 Petr 2:3": "Als u tenminste geproefd hebt dat de Heere goedertieren is.", "Ps 62:9": "Vertrouw op Hem te allen tijde, o volk! Stort uw hart uit voor Zijn aangezicht; God is ons een Toevlucht. Sela.", "Luk 11:9": "En Ik zeg u: Bid, en u zal gegeven worden; zoek, en u zult vinden; klop, en u zal opengedaan worden.", "Ps 128:1-6": "Een lied Hammaaloth. Gelukkig is ieder die de HEERE vreest, die in Zijn wegen wandelt. Want u zult eten van het werk van uw handen; gelukkig zult u zijn, en het zal u goed gaan. Uw vrouw zal zijn als een vruchtbare wijnstok aan de zijkant van uw huis; uw kinderen als olijfplanten rondom uw tafel.", "Ezech 9:4": "En de HEERE zei tot hem: Ga door, door het midden van de stad, door het midden van Jeruzalem, en zet een teken op de voorhoofden van de mensen die zuchten en uitroepen over al die gruwelen die in haar midden gedaan worden.", "2 Kor 4:8-10": "Als mensen die in alles verdrukt worden, maar niet benauwd; twijfelmoedig, maar niet mismoedig; Vervolgd, maar daarin niet verlaten; neergeworpen, maar niet verdorven; Altijd de doding van de Heere Jezus in het lichaam met ons omdragend, opdat ook het leven van Jezus in ons lichaam openbaar zou worden.", "Kol 1:12": "terwijl u de Vader dankt, Die ons bekwaam gemaakt heeft om deel te hebben aan de erfenis van de heiligen in het licht;", "1 Tess 4:7": "Want God heeft ons niet geroepen tot onreinheid, maar tot heiliging.", "Matt 12:44": "Dan zegt hij: Ik zal teruggaan naar mijn huis, waar ik vandaan gekomen ben; en als hij komt, vindt hij het leeg, schoongeveegd en versierd.", "Joh 4:23": "Maar het uur komt, en is er nu, waarop de ware aanbidders de Vader zullen aanbidden in geest en waarheid; want de Vader zoekt ook zulke aanbidders.", "Jes 29:18": "En op die dag zullen de doven de woorden van het boek horen; en de ogen van de blinden, die uit de donkerheid en uit de duisternis zijn, zullen zien.", "Matt 12:43": "En wanneer de onreine geest van de mens is uitgegaan, gaat hij door dorre plaatsen, op zoek naar rust, en vindt die niet.", "Ps 14:7": "Och, dat Israëls verlossing uit Sion kwam! Als de HEERE de gevangenen van Zijn volk zal doen terugkeren, dan zal Jakob zich verheugen, Israël zal blij zijn.", "Matt 23:37": "Jeruzalem, Jeruzalem! U die de profeten doodt, en stenigt hen die tot u gezonden zijn! Hoe vaak heb Ik uw kinderen bijeen willen brengen, zoals een hen haar kuikens bijeenbrengt onder de vleugels; en u hebt niet gewild.", "Deut 31:15": "Toen verscheen de HEERE in de tent, in de wolkkolom; en de wolkkolom stond boven de deur van de tent.", "2 Kor 5:17": "Dus als iemand in Christus is, is hij een nieuw schepsel; het oude is voorbijgegaan, zie, het is alles nieuw geworden.", "Hand 2:16-21": "Maar dit is wat gesproken is door de profeet Joël: En het zal gebeuren in de laatste dagen, zegt God, dat Ik van Mijn Geest zal uitstorten op alle vlees; en uw zonen en uw dochters zullen profeteren, en uw jongemannen zullen visioenen zien, en uw ouden zullen dromen dromen. En ook op Mijn dienstknechten, en op Mijn dienstmaagden, zal Ik in die dagen van Mijn Geest uitstorten, en zij zullen profeteren.", "Tit 2:10": "Niet ontvreemdend, maar alle goede trouw bewijzend; opdat zij de leer van God, onze Zaligmaker, in alles sieren.", "Openb 21:24": "En de volken die zalig worden, zullen in haar licht wandelen; en de koningen van de aarde brengen hun heerlijkheid en eer in haar.", "Ef 4:16": "Uit Wie het hele lichaam bekwaam samengevoegd en samen vastgemaakt wordt, door alle gewrichten die het voeden, naar de werking van ieder deel in zijn maat, groei van het lichaam bereikt, tot opbouw van zichzelf in de liefde.", "Pred 7:1": "Beter is een goede naam dan goede olie, en de dag van de dood dan de dag dat iemand geboren wordt.", "Jer 30:7": "O wee! Want die dag is zo groot, dat er zijn gelijke niet geweest is; en het is een tijd van benauwdheid voor Jakob; toch zal hij daaruit verlost worden.", "Joh 6:50": "Dit is het Brood dat uit de hemel neerdaalt, zodat de mens ervan eet en niet sterft.", "Ezech 14:11": "Opdat het huis van Israël niet meer van achter Mij afdwaalt, en zij zich niet meer verontreinigen met al hun overtredingen; dan zullen zij Mij tot een volk zijn, en Ik zal hun tot een God zijn, spreekt de Heere HEERE.", "Gen 30:23": "En zij werd zwanger, en baarde een zoon; en zij zei: God heeft mijn smaad weggenomen!", "Mark 10:15": "Voorwaar, Ik zeg u: Wie het Koninkrijk van God niet ontvangt als een kind, die zal er geenszins ingaan.", "Ps 37:33": "Maar de HEERE laat hem niet in zijn hand; en Hij veroordeelt hem niet, als hij geoordeeld wordt.", "Deut 28:1-13": "En het zal gebeuren, als u naar de stem van de HEERE, uw God, vlijtig luistert en oplet dat u al Zijn geboden doet, die ik u heden gebied, zo zal de HEERE, uw God, u hoog boven alle volken van de aarde plaatsen. En al deze zegeningen zullen over u komen, en u aantreffen, wanneer u naar de stem van de HEERE, uw God, luistert. Gezegend zult u zijn in de stad, en gezegend zult u zijn op het veld.", "Ps 37:24": "Als hij valt, wordt hij niet weggeworpen, want de HEERE ondersteunt zijn hand.", "Ex 32:32": "Nu dan, als Gij hun zonde wilt vergeven! Maar zo niet, delg mij dan nu uit Uw boek, dat Gij geschreven hebt.", "1 Kor 10:13": "U heeft geen verzoeking overvallen dan een menselijke; en God is getrouw, Die niet zal toelaten dat u verzocht wordt boven wat u kunt dragen; maar Hij zal met de verzoeking ook de uitkomst geven, zodat u het kunt verdragen.", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "Ps 46:6": "God is in het midden van haar, zij zal niet wankelen; God zal haar helpen bij het aanbreken van de morgenstond.", "Mal 3:16-18": "Toen spraken zij die de HEERE vrezen, ieder tot zijn naaste: De HEERE merkt er toch op en hoort, en er is een gedenkboek voor Zijn aangezicht geschreven, voor hen die de HEERE vrezen, en voor hen die aan Zijn Naam denken. En zij zullen, zegt de HEERE van de heerscharen, op die dag, die Ik maken zal, Mij een eigendom zijn; en Ik zal hen verschonen, zoals een man zijn zoon verschoont, die hem dient. Dan zult u opnieuw zien het onderscheid tussen de rechtvaardige en de goddeloze, tussen wie God dient, en wie Hem niet dient.", "Hebr 12:15": "Let er goed op dat niemand verachtert van de genade van God; dat niet enige wortel van bitterheid, die opwaarts uitspruit, opschudding maakt en daardoor velen ontreinigd worden.", "Ps 132:13": "Want de HEERE heeft Sion verkozen, Hij heeft het begeerd tot Zijn woonplaats, en zei:", "Fil 1:11": "Vervuld met vruchten van de gerechtigheid, die door Jezus Christus zijn tot heerlijkheid en lof van God.", "Tit 2:12": "En onderwijst ons dat wij, doordat we de goddeloosheid en de wereldse begeerten verzaken, matig en rechtvaardig en godvruchtig zouden leven in deze tegenwoordige wereld;", "Rom 5:17": "Want als door de misdaad van één de dood geheerst heeft door die ene, zullen zij die de overvloed van de genade en van de gave van de rechtvaardigheid ontvangen, des te meer in het leven heersen door die Ene, namelijk Jezus Christus.", "Openb 3:21": "Wie overwint, hem zal Ik geven met Mij te zitten op Mijn troon, zoals Ik ook overwonnen heb, en Mij gezet heb met Mijn Vader op Zijn troon.", "Ps 107:17-21": "De zotten worden geplaagd om de weg van hun overtreding, en om hun ongerechtigheden; Hun ziel gruwde van alle voedsel, en zij waren tot aan de poorten van de dood gekomen. Toen riepen zij tot de HEERE in de benauwdheid die zij hadden, en Hij verloste hen uit hun angsten.", "Luk 4:8": "En Jezus antwoordde en zei tegen hem: Ga weg van Mij, satan, want er is geschreven: U zult de Heere, uw God, aanbidden, en Hem alleen dienen.", "Joh 9:31": "En wij weten dat God de zondaars niet hoort; maar als iemand godvruchtig is en Zijn wil doet, die hoort Hij.", "Jes 63:11": "Toch dacht Hij aan de dagen van ouds, aan Mozes en Zijn volk; maar nu, waar is Hij, Die hen uit de zee opgebracht heeft, met de herders van Zijn kudde? Waar is Hij, Die Zijn Heilige Geest in het midden van hen stelde?", "Job 1:10": "Hebt U niet een omheining gemaakt om hem heen, en om zijn huis, en om alles wat hij heeft rondom? Het werk van zijn handen hebt U gezegend, en zijn vee heeft zich in menigte uitgebreid in het land.", "Job 36:16": "Zo zou Hij ook u afgekeerd hebben van de mond van de benauwdheid naar de ruimte, waaronder geen benauwing zou zijn geweest; en het gerecht van uw tafel zou vol vettigheid zijn geweest.", "1 Kor 5:7": "Zuiver dan de oude zuurdesem weg, opdat u een nieuw deeg mag zijn, zoals u ongezuurd bent. Want ook ons Pascha is voor ons geslacht, namelijk Christus.", "Openb 11:1": "En mij werd een rietstok gegeven, een meetroede gelijk; en de engel stond en zei: Sta op, en meet de tempel van God en het altaar, en hen die daarin aanbidden.", "Openb 5:10": "en U hebt ons voor onze God gemaakt tot koningen en priesters; en wij zullen als koningen heersen op de aarde.", "Matt 8:11": "Maar Ik zeg u dat velen zullen komen van oost en west, en met Abraham, en Izak, en Jakob, zullen aanzitten in het Koninkrijk der hemelen;", "2 Kron 20:15": "En hij zei: Merk op, heel Juda, en u, inwoners van Jeruzalem, en u, koning Josafat! Zo zegt de HEERE tegen u: Wees niet bevreesd en wees niet ontzet vanwege deze grote menigte; want de strijd is niet van u, maar van God.", "Ps 145:18-21": "Koph. De HEERE is nabij allen die Hem aanroepen, allen die Hem aanroepen in waarheid. Resch. Hij doet het welbehagen van hen die Hem vrezen, en Hij hoort hun geroep, en verlost hen. Schin. De HEERE bewaart allen die Hem liefhebben; maar Hij verdelgt alle goddelozen.", "Jes 30:1": "Wee de kinderen die afvallen, spreekt de HEERE, om een raadslag te maken, maar niet uit Mij, en om zich met een bedekking te bedekken, maar niet uit Mijn Geest, om zonde tot zonde te doen;", "1 Joh 4:13": "Hieraan herkennen wij dat wij in Hem blijven, en Hij in ons, omdat Hij ons van Zijn Geest gegeven heeft.", "Jes 28:6": "en tot een Geest van het oordeel voor hem die te oordelen zit, en tot een sterkte voor hen die de strijd terugdrijven tot aan de poort toe.", "Jes 46:4": "En tot de ouderdom toe zal Ik Dezelfde zijn, ja, tot de grijsheid toe zal Ik u dragen; Ik heb het gedaan, en Ik zal u opnemen, en Ik zal dragen en redden.", "Jes 52:12": "Want u zult niet haastig weggaan, en ook niet vluchtend heengaan; want de HEERE zal voor uw aangezicht heentrekken, en de God van Israël zal uw achterhoede zijn.", "Rom 7:6": "Maar nu zijn wij vrijgemaakt van de wet, omdat wij gestorven zijn aan datgene waaronder wij vastgehouden werden; zodat wij dienen in nieuwheid van de Geest, en niet in de oudheid van de letter.", "Jes 54:17": "Elk instrument dat tegen u gemaakt wordt, zal niet gelukken, en elke tong, die in het gericht tegen u opstaat, zult u verdoemen; dit is het erfdeel van de knechten van de HEERE, en hun gerechtigheid is uit Mij, spreekt de HEERE.", "Matt 12:33-35": "Of maak de boom goed en zijn vrucht goed; of maak de boom slecht en zijn vrucht slecht; want aan de vrucht wordt de boom gekend. Adderengebroed! Hoe kunt u goede dingen spreken, terwijl u slecht bent? Want uit de overvloed van het hart spreekt de mond. De goede mens brengt goede dingen voort uit de goede schat van het hart, en de slechte mens brengt slechte dingen voort uit de slechte schat.", "1 Tess 2:12": "en betuigden dat u zou wandelen op een wijze die God waardig is, Die u roept tot Zijn Koninkrijk en heerlijkheid.", "Luk 13:34": "Jeruzalem, Jeruzalem! U die de profeten doodt en stenigt hen die naar u toe gezonden zijn, hoe vaak heb Ik uw kinderen bijeen willen brengen, zoals een hen haar kuikens onder haar vleugels verzamelt; en u hebt niet gewild?", "Jes 41:27": "Ik, de Eerste, zeg tegen Sion: Zie, zie ze daar! En tegen Jeruzalem: Ik zal iemand geven die een blijde boodschap brengt.", "Joh 15:20": "Denk aan het woord dat Ik u gezegd heb: Een dienstknecht is niet meer dan zijn heer. Als zij Mij vervolgd hebben, zullen zij ook u vervolgen; als zij Mijn woord bewaard hebben, zullen zij ook het uwe bewaren.", "Hab 3:19": "De HEERE Heere is mijn Sterkte; en Hij zal mijn voeten maken als die van de hinden, en Hij zal mij doen treden op mijn hoogten. Voor de koorleider, op mijn Neginoth.", "Mark 10:21": "En Jezus keek hem aan en had hem lief, en zei tegen hem: Eén ding ontbreekt u; ga heen, verkoop alles wat u hebt, en geef het aan de armen, en u zult een schat hebben in de hemel; en kom, neem het kruis op, en volg Mij.", "Jes 19:24": "Op die dag zal Israël de derde zijn met de Egyptenaren en met de Assyriërs, een zegen in het midden van het land.", "2 Kor 10:4": "Want de wapens van onze strijd zijn niet vleselijk, maar krachtig door God, tot het neerwerpen van bolwerken;", "1 Kor 3:9": "Want wij zijn medearbeiders van God; akkerwerk van God, gebouw van God bent u.", "Ps 116:12-14": "Wat zal ik de
