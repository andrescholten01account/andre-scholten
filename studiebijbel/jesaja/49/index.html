<style>

l":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Hoort naar Mij, eilanden! En luistert toe, volken van verre! De HEERE heeft Mij geroepen van de buik af, van het ingewand van Mijn moeder af heeft Hij Mijn Naam vermeld.","2":"En Hij heeft Mijn mond gemaakt als een scherp zwaard, onder de schaduw van Zijn hand heeft Hij Mij bedekt; en Hij heeft Mij tot een gezuiverde pijl gesteld, in Zijn pijlkoker heeft Hij Mij verborgen.","3":"En Hij heeft tegen Mij gezegd: U bent Mijn Knecht, Israël, door Wie Ik verheerlijkt zal worden.","4":"Doch Ik zei: Ik heb tevergeefs gearbeid, Ik heb Mijn kracht nutteloos en tevergeefs besteed; zeker, Mijn recht is bij de HEERE, en Mijn loon is bij Mijn God.","5":"En nu zegt de HEERE, Die Mij van *moeders* buik af tot een Knecht gevormd heeft, dat Ik Jakob tot Hem terugbrengen zou; maar Israël zal zich niet laten verzamelen; toch zal Ik verheerlijkt worden in de ogen van de HEERE, en Mijn God zal Mijn Sterkte zijn.","6":"Verder zei Hij: Het is te gering, dat U Mij een Knecht zou zijn, om op te richten de stammen van Jakob, en om terug te brengen de bewaarden in Israël; Ik heb U ook gegeven tot een Licht van de heidenen, om Mijn heil te zijn tot aan het einde van de aarde.","7":"Zo zegt de HEERE, de Verlosser van Israël, Zijn Heilige, tegen de veracht ziel, tegen Hem aan Wie het volk een gruwel heeft, tegen de Knecht van hen die heersen: Koningen zullen het zien en opstaan, *ook* vorsten, en zij zullen zich *voor* *U* buigen; om de wil van de HEERE, Die getrouw is, om de Heilige van Israël, Die U verkozen heeft.","8":"Zo zegt de HEERE: In de tijd van het welbehagen heb Ik U verhoord, en op de dag van het heil heb Ik U geholpen; en Ik zal U bewaren, en Ik zal U geven tot een verbond van het volk, om het aardrijk op te richten, om de verwoeste erfenissen te doen beërven;","9":"Om te zeggen tegen de gebondenen: Gaat uit; tegen hen die in duisternis zijn: Komt te voorschijn; zij zullen op de wegen weiden, en op alle hoge plaatsen zal hun weide zijn.","10":"Zij zullen niet hongeren, noch dorsten, en de hitte en de zon zal hen niet steken; want hun Ontfermer zal ze leiden, en Hij zal hen bij de springaders van het water zachtjes leiden.","11":"En Ik zal al Mijn bergen tot een weg maken, en Mijn banen zullen verhoogd zijn.","12":"Zie, dezen zullen van verre komen; en zie, die van het noorden en van het westen, en dezen uit het land van Sinim.","13":"Juicht, hemelen! En verheug u, aarde! En bergen! Maakt gedreun met gejuich; want de HEERE heeft Zijn volk vertroost, en Hij zal Zich over Zijn ellendigen ontfermen.","14":"Doch Sion zegt: De HEERE heeft mij verlaten, en de Heere heeft mij vergeten.","15":"Kan ook een vrouw haar zuigeling vergeten, dat zij zich niet ontfermt over de zoon van haar buik? Ofschoon deze zou vergeten, zo zal Ik u toch niet vergeten.","16":"Zie, Ik heb u in de beide handpalmen gegraveerd; uw muren zijn steeds voor Mij.","17":"Uw zonen zullen zich haasten; *maar* uw verstoorders en uw verwoesters zullen van u uitgaan.","18":"Hef uw ogen op rondom, en zie, al dezen verzamelen zich, zij komen tot u; *Zo* *waarachtig* *als* Ik leef, spreekt de HEERE, zeker zult u zich met al dezen als met een sieraad bekleden, en u zult ze *u* aanbinden, zoals een bruid.","19":"Want *in* uw woeste en uw eenzame plaatsen, en uw verwoeste land, zeker, nu zult u benauwd worden van inwoners; en zij die u verslonden, zullen zich ver van u maken.","20":"Nog zullen de kinderen, waarvan u beroofd was, zeggen voor uw oren: De plaats is mij te nauw, wijk van mij, dat ik wonen mag.","21":"En u zult zeggen in uw hart: Wie heeft mij dezen voortgebracht, aangezien ik van kinderen beroofd en eenzaam was? Ik was in gevangenschap gegaan, en weggeweken; wie heeft mij dan dezen opgevoed? Zie, ik was alleen overgelaten, waar waren dezen?","22":"Zo zegt de Heere HEERE: Zie, Ik zal Mijn hand opheffen naar de heidenen, en naar de volken zal Ik Mijn banier opsteken; dan zullen zij uw zonen in de armen brengen, en uw dochters zullen op de schouder gedragen worden.","23":"En koningen zullen uw voedsterheren zijn, hun vorstinnen uw zoogvrouwen; zij zullen zich voor u buigen met het aangezicht ter aarde, en zij zullen het stof van uw voeten likken; en u zult weten, dat Ik de HEERE ben, dat zij niet beschaamd zullen worden die Mij verwachten.","24":"Zou ook een machtige de vangst ontnomen worden, of zouden de gevangenen van een rechtvaardige ontkomen?","25":"Doch zo zegt de HEERE: Ja, de gevangenen van de machtige zullen *hem* ontnomen worden, en de vangst van de tiran zal ontkomen; want met hen die u bestrijden zal Ik strijden, en uw kinderen zal Ik verlossen.","26":"En Ik zal uw verdrukkers spijzen met hun eigen vlees, en van hun eigen bloed zullen zij dronken worden, als van zoete wijn; en alle vlees zal gewaarworden, dat Ik, de HEERE, uw Heiland ben, en uw Verlosser, de Machtige van Jakob."},"SV":{"1":"Hoort naar Mij, gij eilanden! en luistert toe, gij volken van verre! De HEERE heeft Mij geroepen van den buik af, van Mijner moeders ingewand af heeft Hij Mijn Naam gemeld.","2":"En Hij heeft Mijn mond gemaakt als een scherp zwaard, onder de schaduw Zijner hand heeft Hij Mij bedekt; en Hij heeft Mij tot een zuiveren pijl gesteld, in Zijn pijlkoker heeft Hij Mij verborgen.","3":"En Hij heeft tot Mij gezegd: Gij zijt Mijn Knecht, Israël, door Welken Ik verheerlijkt zal worden.","4":"Doch Ik zeide: Ik heb te vergeefs gearbeid, Ik heb Mijn kracht onnuttelijk en ijdellijk toegebracht; gewisselijk, Mijn recht is bij den HEERE, en Mijn werkloon is bij Mijn God.","5":"En nu zegt de HEERE, Die Mij Zich van *moeders* buik af tot een Knecht geformeerd heeft, dat Ik Jakob tot Hem wederbrengen zou; maar Israël zal zich niet verzamelen laten; nochtans zal Ik verheerlijkt worden in de ogen des HEEREN, en Mijn God zal Mijn Sterkte zijn.","6":"Verder zeide Hij: Het is te gering, dat Gij Mij een Knecht zoudt zijn, om op te richten de stammen van Jakob, en om weder te brengen de bewaarden in Israël; Ik heb U ook gegeven tot een Licht der heidenen, om Mijn heil te zijn tot aan het einde der aarde.","7":"Alzo zegt de HEERE, de Verlosser van Israël, Zijn Heilige, tot de verachte ziel, tot Dien, aan Welken het volk een gruwel heeft, tot den Knecht dergenen, die heersen: Koningen zullen het zien en opstaan, *ook* vorsten, en zij zullen zich *voor* *U* buigen; om des HEEREN wil, Die getrouw is, om den Heilige Israëls, Die U verkoren heeft.","8":"Alzo zegt de HEERE: In dien tijd des welbehagens heb Ik U verhoord, en ten dage des heils heb Ik U geholpen; en Ik zal U bewaren, en Ik zal U geven tot een verbond des volks, om het aardrijk op te richten, om de verwoeste erfenissen te doen beërven;","9":"Om te zeggen tot de gebondenen: Gaat uit; tot hen, die in duisternis zijn: Komt te voorschijn; zij zullen op de wegen weiden, en op alle hoge plaatsen zal hun weide wezen.","10":"Zij zullen niet hongeren, noch dorsten, en de hitte en de zon zal hen niet steken; want hun Ontfermer zal ze leiden, en Hij zal hen aan de springaders der wateren zachtjes leiden.","11":"En Ik zal al Mijn bergen tot een weg maken, en Mijn banen zullen verhoogd zijn.","12":"Zie, dezen zullen van verre komen; en zie, die van het noorden en van het westen, en geen uit het land van Sinim.","13":"Juicht, gij hemelen! en verheug u, gij aarde! en gij bergen! maakt gedreun met gejuich; want de HEERE heeft Zijn volk vertroost, en Hij zal Zich over Zijn ellendigen ontfermen.","14":"Doch Sion zegt: De HEERE heeft mij verlaten, en de Heere heeft mij vergeten.","15":"Kan ook een vrouw haar zuigeling vergeten, dat zij zich niet ontferme over den zoon haars buiks? Ofschoon deze vergate, zo zal Ik toch u niet vergeten.","16":"Zie, Ik heb u in de beide handpalmen gegraveerd; uw muren zijn steeds voor Mij.","17":"Uw zonen zullen zich haasten; *maar* uw verstoorders en uw verwoesters zullen van u uitgaan.","18":"Hef uw ogen op rondom, en zie, alle deze vergaderen zich, zij komen tot u; *Zo* *waarachtig* *als* Ik leef, spreekt de HEERE, zekerlijk, gij zult u met alle dezen als met een sieraad bekleden, en gij zult ze *u* aanbinden, gelijk een bruid.","19":"Want *in* uw woeste en uw eenzame plaatsen, en uw verstoord land, gewisselijk, nu zult gij benauwd worden van inwoners; en die u verslonden, zullen zich verre van u maken.","20":"Nog zullen de kinderen, waarvan gij beroofd waart, zeggen voor uw oren: De plaats is mij te nauw, wijk van mij, dat ik wonen moge.","21":"En gij zult zeggen in uw hart: Wie heeft mij dezen gegenereerd, aangezien ik van kinderen beroofd en eenzaam was? Ik was in de gevangenis gegaan, en weggeweken; wie heeft mij dan dezen opgevoed? Ziet, ik was alleen overgelaten, waar waren dezen?","22":"Alzo zegt de Heere HEERE: Ziet, Ik zal Mijn hand opheffen tot de heidenen, en tot de volken zal Ik Mijn banier opsteken; dan zullen zij uw zonen in de armen brengen, en uw dochters zullen op den schouder gedragen worden.","23":"En koningen zullen uw voedsterheren zijn, hun vorstinnen uw zoogvrouwen; zij zullen zich voor u buigen met het aangezicht ter aarde, en zij zullen het stof uwer voeten lekken; en gij zult weten, dat Ik de HEERE ben, dat zij niet beschaamd zullen worden die Mij verwachten.","24":"Zou ook een machtige de vangst ontnomen worden, of zouden de gevangenen eens rechtvaardigen ontkomen?","25":"Doch alzo zegt de HEERE: Ja, de gevangenen des machtigen zullen *hem* ontnomen worden, en de vangst des tirans zal ontkomen; want met uw twisters zal Ik twisten, en uw kinderen zal Ik verlossen.","26":"En Ik zal uw verdrukkers spijzen met hun eigen vlees, en van hun eigen bloed zullen zij dronken worden, als van zoeten wijn; en alle vlees zal gewaar worden, dat Ik, de HEERE, uw Heiland ben, en uw Verlosser, de Machtige Jakobs."},"KJV":{"1":"Listen, O isles, unto me; and hearken, ye people, from far; The LORD hath called me from the womb; from the bowels of my mother hath he made mention of my name.","2":"And he hath made my mouth like a sharp sword; in the shadow of his hand hath he hid me, and made me a polished shaft; in his quiver hath he hid","3":"And said unto me, Thou *art* my servant, O Israel, in whom I will be glorified.","4":"Then I said, I have laboured in vain, I have spent my strength for nought, and in vain: *yet* surely my judgment *is* with the LORD, and my work with my God.","5":"And now, saith the LORD that formed me from the womb *to be* his servant, to bring Jacob again to him, Though Israel be not gathered, yet shall I be glorious in the eyes of the LORD, and my God shall be my strength.","6":"And he said, It is a light thing that thou shouldest be my servant to raise up the tribes of Jacob, and to restore the preserved of Israel: I will also give thee for a light to the Gentiles, that thou mayest be my salvation unto the end of the earth.","7":"Thus saith the LORD, the Redeemer of Israel, *and* his Holy One, to him whom man despiseth, to him whom the nation abhorreth, to a servant of rulers, Kings shall see and arise, princes also shall worship, because of the LORD that is faithful, *and* the Holy One of Israel, and he shall choose","8":"Thus saith the LORD, In an acceptable time have I heard thee, and in a day of salvation have I helped thee: and I will preserve thee, and give thee for a covenant of the people, to establish the earth, to cause to inherit the desolate heritages;","9":"That thou mayest say to the prisoners, Go forth; to them that *are* in darkness, Shew yourselves. They shall feed in the ways, and their pastures *shall be* in all high places.","10":"They shall not hunger nor thirst; neither shall the heat nor sun smite them: for he that hath mercy on them shall lead them, even by the springs of water shall he guide","11":"And I will make all my mountains a way, and my highways shall be exalted.","12":"Behold, these shall come from far: and, lo, these from the north and from the west; and these from the land of Sinim.","13":"Sing, O heavens; and be joyful, O earth; and break forth into singing, O mountains: for the LORD hath comforted his people, and will have mercy upon his afflicted.","14":"But Zion said, The LORD hath forsaken me, and my Lord hath forgotten","15":"Can a woman forget her sucking child, that she should not have compassion on the son of her womb? yea, they may forget, yet will I not forget","16":"Behold, I have graven thee upon the palms of *my* hands; thy walls *are* continually","17":"Thy children shall make haste; thy destroyers and they that made thee waste shall go forth","18":"Lift up thine eyes round about, and behold: all these gather themselves together, *and* come to thee. *As* I live, saith the LORD, thou shalt surely clothe thee with them all, as with an ornament, and bind them *on thee*, as a bride","19":"For thy waste and thy desolate places, and the land of thy destruction, shall even now be too narrow by reason of the inhabitants, and they that swallowed thee up shall be far away.","20":"The children which thou shalt have, after thou hast lost the other, shall say again in thine ears, The place *is* too strait for me: give place to me that I may dwell.","21":"Then shalt thou say in thine heart, Who hath begotten me these, seeing I have lost my children, and am desolate, a captive, and removing to and fro? and who hath brought up these? Behold, I was left alone; these, where","22":"Thus saith the Lord GOD, Behold, I will lift up mine hand to the Gentiles, and set up my standard to the people: and they shall bring thy sons in *their* arms, and thy daughters shall be carried upon *their* shoulders.","23":"And kings shall be thy nursing fathers, and their queens thy nursing mothers: the 5\">up</span> mine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> to the <span class=\"wl wl-kjv\" data-code=\"H1471\">Gentiles,</span> and set <span class=\"wl wl-kjv\" data-code=\"H7311\">up</span> my <span class=\"wl wl-kjv\" data-code=\"H5251\">standard</span> to the <span class=\"wl wl-kjv\" data-code=\"H5971\">people:</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> thy <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> in their <span class=\"wl wl-kjv\" data-code=\"H2684\">arms,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> shall be <span class=\"wl wl-kjv\" data-code=\"H5375\">carried</span> upon their shoulders.","23":"And <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> shall be thy nursing <span class=\"wl wl-kjv\" data-code=\"H539\">fathers,</span> and their <span class=\"wl wl-kjv\" data-code=\"H8282\">queens</span> thy nursing <span class=\"wl wl-kjv\" data-code=\"H3243\">mothers:</span> they shall bow <span class=\"wl wl-kjv\" data-code=\"H7812\">down</span> to thee with their <span class=\"wl wl-kjv\" data-code=\"H639\">face</span> toward the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> and lick <span class=\"wl wl-kjv\" data-code=\"H3897\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H6083\">dust</span> of thy <span class=\"wl wl-kjv\" data-code=\"H7272\">feet;</span> and thou shalt <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> for they shall not be <span class=\"wl wl-kjv\" data-code=\"H954\">ashamed</span> that wait","24":"Shall the <span class=\"wl wl-kjv\" data-code=\"H4455\">prey</span> be <span class=\"wl wl-kjv\" data-code=\"H3947\">taken</span> from the <span class=\"wl wl-kjv\" data-code=\"H1368\">mighty,</span> or the <span class=\"wl wl-kjv\" data-code=\"H6662\">lawful</span> <span class=\"wl wl-kjv\" data-code=\"H7628\">captive</span> delivered?","25":"But thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> Even the <span class=\"wl wl-kjv\" data-code=\"H7628\">captives</span> of the <span class=\"wl wl-kjv\" data-code=\"H1368\">mighty</span> shall be taken <span class=\"wl wl-kjv\" data-code=\"H3947\">away,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4455\">prey</span> of the <span class=\"wl wl-kjv\" data-code=\"H6184\">terrible</span> shall be <span class=\"wl wl-kjv\" data-code=\"H4422\">delivered:</span> for I will <span class=\"wl wl-kjv\" data-code=\"H7378\">contend</span> with him that <span class=\"wl wl-kjv\" data-code=\"H3401\">contendeth</span> with thee, and I will <span class=\"wl wl-kjv\" data-code=\"H3467\">save</span> thy children.","26":"And I will <span class=\"wl wl-kjv\" data-code=\"H398\">feed</span> them that <span class=\"wl wl-kjv\" data-code=\"H3238\">oppress</span> thee with their own <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh;</span> and they shall be <span class=\"wl wl-kjv\" data-code=\"H7937\">drunken</span> with their own <span class=\"wl wl-kjv\" data-code=\"H1818\">blood,</span> as with sweet <span class=\"wl wl-kjv\" data-code=\"H6071\">wine:</span> and all <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> am thy <span class=\"wl wl-kjv\" data-code=\"H3467\">Saviour</span> and thy <span class=\"wl wl-kjv\" data-code=\"H1350\">Redeemer,</span> the mighty <span class=\"wl wl-kjv\" data-code=\"H46\">One</span> of Jacob."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"naar Mij,","tekst":"Dit spreekt Christus."},{"catchword":"gij eilanden","tekst":"Zie boven Isa 41:1 ."},{"catchword":"Mij geroepen","tekst":"Te weten tot een Middelaar en Heiland van zijn volk."},{"catchword":"Mijner moeders","tekst":"Dat is, zo haast als mijne moeder mij heeft ontvangen en ter wereld gebracht; zie Mat 1:20-21 ; Luk 1:31 , en Luk 2:21 ."},{"catchword":"Mijn Naam","tekst":"Dat is, mij."},{"catchword":"gemeld","tekst":"Te weten bij zijn uitverkoren volk in Juda. Zie Luk 1:70 ."}],"2":[{"catchword":"gemaakt","tekst":"Hebreeuws, gesteld; dat is, Hij heeft mij bevolen te prediken boete en vergeving der zonden en Hij werkt alzo door mijne predikatiën, dat zij de toehoorders door het hart snijden. Vergelijk Luk 24:32 ; Act 2:37 ; Heb 4:12 ; Rev 1:16 ."},{"catchword":"onder de schaduw","tekst":"Of, met de schaduw, enz. zie Isa 51:16 ."},{"catchword":"heeft Hij Mij bedekt;","tekst":"Dat is, Hij heeft mij bewaard tegen de listen der schriftgeleerden en farizeën, dat zij mij tegen mijnen wil en eer het tijd was niet hebben kunnen vangen noch doden."},{"catchword":"tot een zuiveren","tekst":"Een zuivere gladde pijl gaat lichter ergens door dan een verroeste doet."},{"catchword":"pijl gesteld,","tekst":"Pijl betekent hier zoveel als straks tevoren zwaard. Zie Psa 45:6 ."}],"3":[{"catchword":"Gij zijt Mijn Knecht,","tekst":"Zie boven Isa 42:1 , en Isa 51:16 . De zin dezer woorden is: O Christus, Gij zijt niet alleen mijn knecht; maar Gij zijt ook de rechte Israël, die met God en zijn machtigen toorn strijdende, de overwinning behouden zult, waarvan Jakob alleen een voorbeeld geweest is als hij, met den engel des Heeren strijdende, dien overwonnen heeft, waarvan hij den naam Israël gekregen heeft."},{"catchword":"door Welken Ik","tekst":"Of, in welken. Anders: Israël [is degene] van welken Ik mij door u roemen zal. De zin is: Ik beveel U dat gij vooreerst mijn heerlijk woord zult voordragen den Israëlieten, of dat gij onder hen allereerst mijne heerlijkheid zult verkondigen. Zie Mat 10:6 , en Mat 15:24 ; Act 13:46 , en Act 28:25 , enz."}],"4":[{"catchword":"Ik zeide","tekst":"Te weten, de Heere Christus, die hier klaagt over het ongeloof en de boosheid van het grootste deel der Joden."},{"catchword":"te vergeefs","tekst":"Te weten met mijne predikatiën, bij de verstokte Joden."},{"catchword":"onnuttelijk","tekst":"Hebreeuws, in het woeste."},{"catchword":"toegebracht;","tekst":"Hebreeuws, verteerd, dat is gebruikt."},{"catchword":"gewisselijk,","tekst":"Of, nochtans is mijn recht bij den Heere."},{"catchword":"Mijn recht","tekst":"Dat is, mijn loon, dat mij met recht toekomt. Alsof Christus zeide: Hoewel mijne arbeid zulke vruchten niet heeft voortgebracht als Ik wel wenste, zo getroost Ik mij daarmede, dat Ik mijn hemelsen Vader getrouwelijk heb gediend in het ambt, dat Hij mij heeft opgelegd, en het is Hem ook wel bekend. Vergelijk Mat 23:37 . In het volgende werkloon. Hebreeuws eigenlijk: werk, of arbeid, en het wordt voor arbeidsloon genomen. Zie Jer 22:13 ."}],"5":[{"catchword":"Jakob","tekst":"Dat is, de Joden."},{"catchword":"maar Israël","tekst":"Anders, [en Israël, dat niet verzameld wordt, opdat Ik verheerlijkt worde in de ogen des Heeren, en dat mijn God mijne sterkte zou wezen. Israël dat niet verzameld wordt,] dat is, het verstrooide Israël. Zie Mat 23:37 ."},{"catchword":"niet verzamelen laten;","tekst":"Zich tot mij bekerende; Mat 23:37 ; Joh 1:11 . Anders, Israël verzamelt zich niet. Anders, en Israël zal tot hem vergaderd worden."},{"catchword":"nochtans","tekst":"De zin is: Onaangezien de onboetvaardigheid van het grootste deel van het volk van Israël, zal mijn getrouwe arbeid en naarstigheid in de bediening van mijn predikambt bij mijn hemelsen Vader in waarde zijn en blijven."},{"catchword":"zal Mijn Sterkte zijn","tekst":"Of, is mijne sterkte geworden; dat is, God troost mij door zijn Heiligen Geest tegen de ondankbaarheid der Joden. Vergelijk Mat 11:25-26 ; Joh 6:36-37 , en Joh 10:26-27 ."}],"6":[{"catchword":"Het is te gering,","tekst":"Hebreeuws, het is te licht. Alsof Hij zeide: de waardigheid van uw persoon, als die daar zijt de eeuwige en enige Zoon van God de Vader, alsook het hoge ambt waartoe Ik U beroepen hebt, vereist wat meer en wat voortreffelijkers, dan dat Gij alleen het volk van Israël zoudt oprichten en weder terechtbrengen. Ik heb U tot een Zaligmaker der ganse wereld verordineerd; daarom, ofschoon U het grootste deel onder de Joden niet wil kennen noch aannemen, zo zullen er velen onder de heidenen gevonden worden, die het doen zullen, en zal de Christelijke kerk des te minder niet zijn, maar veel meer zal zij daardoor vermeerderd worden."},{"catchword":"op te richten","tekst":"Te weten door de predikatie van het heilig Evangelie."},{"catchword":"de bewaarden","tekst":"Dat is, degenen, die Ik totnogtoe met grote zorg en naarstigheid bewaard heb, als zijnde mijn erfdeel, ja de appel mijner ogen, Deu 32:10 ."},{"catchword":"ten Licht","tekst":"Dit is een klare profetie van de bekering der heidenen tot Christus. Zie boven Isa 42:6 ; Luk 2:32 ; Act 13:46-47 , en Act 26:17-18 ."},{"catchword":"Mijn heil","tekst":"Dat is, een heil der heidenen, van mij verordineerd."}],"7":[{"catchword":"Zijn Heilige,","tekst":"Dat is, die de Heilige van Israël is, gelijk boven Isa 10:17 ."},{"catchword":"de verachte ziel,","tekst":"Hebreeuws, den verachte van ziel; dat is tot Christus, die in deze wereld van alle goddelozen [die te aller tijd verre de meesten zijn geweest] is veracht geweest. Anders: dien een ieder veracht. Anders: tot [dien] welken de ziel, [dat is schier ieder man, de grootste en voornaamste hoop der Joden] veracht. Zie Isa 53:3 ; Mat 27:22-23 , Mat 27:29 , Mat 27:40 ; Joh 7:48 ."},{"catchword":"het volk","tekst":"Te weten het boze Joodse volk."},{"catchword":"tot den Knecht","tekst":"Dat is, tot Christus, die in de gedaante van een knecht in deze wereld verschenen is."},{"catchword":"die heersen","tekst":"Te weten te Jeruzalem, als Herodes, Pontius Pilatus, enz."},{"catchword":"zullen het zien","tekst":"Of, zullen U zien; dat is, kennen en eren voor den Heiland en Zaligmaker der wereld. Zie Psa 71:10-11 ."},{"catchword":"opstaan,","tekst":"Tot een teken van eerbieding, gelijk Lev 19:32 ."},{"catchword":"zij zullen zich","tekst":"Of, en zullen U aanbidden."},{"catchword":"om des HEEREN wil,","tekst":"God den Vader in den Zoon erende."},{"catchword":"Die getrouw is,","tekst":"Die zijne belofte van de zending van zijn Zoon Jezus Christus in het vlees getrouwelijk houden zal."},{"catchword":"den Heilige Israëls,","tekst":"Dit is, om desgenen wil, die de Heilige Israëls is; zie boven in vs.7."},{"catchword":"Die U verkoren heeft","tekst":"Te weten tot zijn knecht en Middelaar der uitverkorenen. Hier is verandering van persoon, want tevoren heeft hij van Christus gesproken in den derden persoon, hier in den tweeden."}],"8":[{"catchword":"de HEERE","tekst":"Te weten God de Vader."},{"catchword":"In dien tijd","tekst":"Dat is, ten tijde als Ik mijne genade en goedertierenheid heb willen openbaren door de predikatie van het heilig Evangelie, en Ik U gezonden heb tot een Heiland der wereld om te lijden voor de zonden van mijn volk; 2Co 6:2 ."},{"catchword":"heb Ik","tekst":"Dit wordt gesproken in den verleden tijd; maar het is te verstaan in den toekomenden tijd."},{"catchword":"U verhoord,","tekst":"O Christus."},{"catchword":"en ten dage","tekst":"Dit si met andere woorden hetgeen straks gezegd is."},{"catchword":"heb Ik U","tekst":"Dat is, Ik heb u ondersteund toen gij in de pijnen der hel waart, en heb uw lichaam voor verderf bewaard toen gij in het graf laagt; ja Ik heb u van de doden opgewekt en aan mijne rechterhand gesteld. Zie 2Co 6:2 ."},{"catchword":"bewaren,","tekst":"Te weten tegen al uwe vijanden, dat gij van geen derzelven overwonnen wordt."},{"catchword":"tot een verbond","tekst":"Dat is, tot een Middelaar des verbonds, gelijk boven Isa 42:6 ."},{"catchword":"des volks,","tekst":"Te weten van het volk Gods."},{"catchword":"het aardrijk","tekst":"Dat is, de inwoners der aarde, te weten de uitverkorenen. De zin is: Opdat Gij, Jezus Christus, uw kerk, die uw erve is, wederom opricht en daarin woont."},{"catchword":"de verwoeste","tekst":"Men kan hier door de verwoeste erfenissen verstaan, eerst het land Kanaän, dat ten tijde der Babylonische gevangenschap verwoest was; zie vs.19 en voorts de zaligheid, waarvan de duivel de uitverkorenen poogde te onterven, te beroven, en hun dezelve woest te maken."}],"9":[{"catchword":"tot de gebondenen","tekst":"Dat is, de gevangenen, als boven Isa 42:7 ."},{"catchword":"die in duisternis zijn","tekst":"Dat is, die in onwetendheid en in geestelijke treurigheid leven."},{"catchword":"Komt te voorschijn;","tekst":"Of, komt hervoor, openbaart u. Hebreeuws eigenlijk, wordt ontdekt, of geopenbaard."},{"catchword":"zij zullen","tekst":"Te weten, die van u krachtiglijk zullen beroepen zijn."},{"catchword":"op de wegen","tekst":"Dat is, aan alle hoeken en kanten. De zin is: Nadat zij uit de geestelijke gevangenschap der zonden en des duivels verlost zijn, zullen zij rijkelijk aan de ziel en aan het lichaam gezegend worden, en zij zullen deze zegeningen overal genieten."}],"10":[{"catchword":"Zij zullen niet","tekst":"Hetgeen God hier zegt, zal in den hemel vervuld worden. Zie Rev 7:16 . De mening is dat de uitverkorenen in den hemel geen ongemak lijden zullen; maar dat zij volkomen gelukzalig zijn zullen, waarvan de genieting van het manna en het water uit den rotssteen in de woestijn een voorbeeld geweest is."},{"catchword":"niet steken;","tekst":"Hebreeuws, niet slaan."},{"catchword":"Ontfermer","tekst":"Dat is, de Heere Christus zal hen leiden gelijk een herder zijne schapen leidt; gelijk Isa 40:11 ."},{"catchword":"Hij zal hen","tekst":"Dat is, Hij zal hen verkwikken door den troost des Heiligen Geestes, daartoe gebruikende de troostelijke beloftenissen, die God den zijnen is doende."}],"11":[{"catchword":"Ik zal","tekst":"Dat is, Ik zal alle hindernissen uit den weg nemen; daarentegen zal Ik alle behulp en bevordering doen, opdat mijne uitverkorenen uit alle hoeken en einden der ganse wereld tot de gemeenschap van het volk Gods gebracht worden. Het zijn de woorden van God den Vader."},{"catchword":"zijn","tekst":"Of, worden."}],"12":[{"catchword":"van het westen,","tekst":"Hebreeuws, van de zee; zie de aantekening Gen 12:8 ."},{"catchword":"Sinim","tekst":"Of, der Sinieten. Dezen wordt ook gedacht Gen 10:17 . Eenigen menen dat deze volken wel mochten zijn de Chinezen."}],"13":[{"catchword":"Juicht,","tekst":"Zie Rom 8:19 ."},{"catchword":"gij bergen","tekst":"Zie Isa 35:1 , en Isa 44:23 ."}],"14":[{"catchword":"Sion zegt","tekst":"Dat is, de gelovige Joden, die dit spreken, hard geperst zijnde door de grote en menigvuldige ellenden, die hen overvielen."}],"15":[{"catchword":"haar zuigeling","tekst":"Of, van haar zuigkind, of van haar klein kind; gelijk Isa 65:20 ."},{"catchword":"zoon","tekst":"Zie gelijke manier van spreken Pro 21:2 ."},{"catchword":"Ofschoon","tekst":"Of, ja dezelve; te weten vrouwen; anders: nog kunnen dezen vergeten, of maar of zij ze vergaten, zo zal Ik nochtans, enz."},{"catchword":"vergate,","tekst":"Te weten haar kind of kinderen. Zie Psa 27:10 ."},{"catchword":"u niet vergeten","tekst":"O Zion, o Jeruzalem, dat is, o mijne kerk, mijn volk. Versta dit niet zozeer van een lichamelijke als van een geestelijke verlossing; Rom 9:6-7 ."}],"16":[{"catchword":"Ik heb u","tekst":"Dat is, Ik zal altijd uwer gedachtig zijn en zorg voor u dragen."},{"catchword":"gegraveerd;","tekst":"Of, geschreven, getekend."},{"catchword":"uw muren","tekst":"O Jeruzalem."},{"catchword":"zijn steeds","tekst":"Alsof de Heere zeide: Gelijk Ik de muren van Jeruzalem, door de Chaldeën verwoest zijnde, zal herbouwen, alzo zal Ik het geestelijk Jeruzalem, mijne kerk, die nu klein, ja schier geheel vervallen is, weder opbouwen en beschermen."}],"17":[{"catchword":"zonen","tekst":"Of, kinderen; dat is de uitverkorenen, die in u door het zaad van het Woord Gods zullen geboren worden, die zullen met grote begeerte haastelijk komen tot de gemeenschap der gemeente."},{"catchword":"uw verstoorders","tekst":"Dat is, de valse leraars en twistmakers, als schriftgeleerden en farizeën, mitsgaders al degenen, die door hun valse leer en ergerlijk leven u schadelijk zijn en afbreuk doen."},{"catchword":"van u uitgaan","tekst":"Of, uit u."}],"18":[{"catchword":"alle deze","tekst":"Versta, de bekeerde heidenen, die de kerk zullen vermeerderen en versieren, zich tezamen onder enen herder vervoegende."},{"catchword":"tot u;","tekst":"Of, uwenthalve."},{"catchword":"met alle dezen","tekst":"Te weten met al de uitverkorenen, die de Heere onder zijne gehoorzaamheid brengen zal, zo uit de Joden als uit de heidenen."},{"catchword":"als met een sieraad","tekst":"Het grote getal der ware Christengelovigen is het sieraad der kerk."},{"catchword":"gelijk een bruid","tekst":"Dat is, gelijk ene bruid haar sieraad aandoet, of om zich bindt, als zij zich oppronkt."}],"19":[{"catchword":"in","tekst":"De zin is: De menigte dergenen, die zich tot de Christelijke gemeente begeven zullen, zal zo grote zijn dat de kerk, die tevoren als een woeste en eenzame plaats geweest is, zal vervuld, ja schier te eng worden om al de aankomende Christengelovigen uit de heidenen te bevatten, want de gelovigen zullen door de ganse wereld verspreid worden."},{"catchword":"verstoord","tekst":"Het Joodse land is verstoord geworden, zo door de Babyloniërs als door de Romeinen en andere natiën."},{"catchword":"nu zult gij","tekst":"Dat is, dan, of al haast. Zie de aantekening Hos 10:3 ."},{"catchword":"benauwd","tekst":"Of, geprangd, geperst worden; te weten als de uitverkoren heidenen tot u zullen inkomen en zich tot de gemeente vervoegen zullen."},{"catchword":"die u verslonden,","tekst":"Dat is, die u tevoren schenen te willen verslinden door hun tirannische vervolging en leer, als daar waren de schriftgeleerden, farizeën en tirannen, enz."}],"20":[{"catchword":"de kinderen,","tekst":"Hebreeuws, de kinderen uwer kinderberoving; dat is, uwer onvruchtbaarheid, namelijk de heidenen, die wel eigenlijk uwe kinderen niet zijn, als van u lichamelijk niet gegenereerd zijnde, maar nu door het geloof kinderen der gemeente geworden zijn, nadat gij, Joden, vanwege de ongelovigheid en onboetvaardigheid als kinderloos en onvruchtbaar voor het meeste deel te achten zijt. Anderen vertalen dit vs. aldus: De kinderen, die gij krijgen zult, toen gij van uwe kinderen beroofd waart, zullen nog zeggen voor uwe oren; dat is dat gij het hoort."},{"catchword":"De plaats","tekst":"Dit betekent den groten aanwas der Christelijke kerk."},{"catchword":"wijk van mij,","tekst":"Of, geef mij plaats."}],"21":[{"catchword":"gij zult zeggen","tekst":"Te weten gij Joodse kerk, zult u bij uzelve verwonderen over de grote menigte der heidenen, die zich tot de kerk Gods vervoegen zullen."},{"catchword":"in de gevangenis","tekst":"Te weten in de Babylonische gevangenschap."},{"catchword":"weggeweken;","tekst":"Te weten uit mijn land."}],"22":[{"catchword":"Ik zal Mijn hand","tekst":"Dat is, Ik zal de heidenen krachtiglijk beroepen door de predikatie van het heilig Evangelie en de innerlijke werking van den Heiligen Geest."},{"catchword":"opsteken;","tekst":"Of, opwerpen, of verheffen."},{"catchword":"dan zullen zij","tekst":"Dat is, jongen en ouden, mannen en vrouwen zullen komen, en zich in de gemeenschap der heiligen begeven, en de een zal den ander met goede vermaningen en onderwijzingen, en ook met een goed voorbeeld, voorgaan; Isa 60:4 , en Isa 66:12 ."}],"23":[{"catchword":"koningen","tekst":"De zin is dat de koningen niet alleen zich tot de gemeente van Christus zullen vervoegen; maar zij zullen ook hunne macht en autoriteit gebruiken tot aanwas en bescherming derzelve."},{"catchword":"hun vorstinnen","tekst":"Dat is, der koningen huisvrouwen."},{"catchword":"zoogvrouwen;","tekst":"Of, zoogammen."},{"catchword":"zij zullen zich","tekst":"Dat is, zij zullen u burgerlijke eerbieding doen; zij zullen zich voor u verootmoedigen en zich aan u onderwerpen. Die zullen zij doen om Christus wil, die het Hoofd zijner kerk is."},{"catchword":"zullen het stof","tekst":"De zin is: Zij zullen zich zo laag voor u buigen, dat hun mond tot aan de aarde naken zal, alsof zij de aarde wilden oplekken. Zie Psa 72:9 ."}],"24":[{"catchword":"Zou ook","tekst":"Dit spreekt de vervolgde en van de tirannen bedrangde kerk, ten aanzien van het geweld der vervolgers."},{"catchword":"eens rechtvaardigen","tekst":"Die met enig recht, hetzij van oorlog of anderszins iemand in vaste gevangenschap houdt."}],"25":[{"catchword":"Ja,","tekst":"Versta dit gesproken te zijn niet alleen van de gevangen Joden in de Babylonische gevangenschap, die de machtige koningen van Babel door krijgsrecht of geweld onder hunne heerschappij alzo gebracht hadden dat het onmogelijk scheen hen daaruit te verlossen; maar versta dit ook, onder een voorbeeld gesproken te zijn van den duivel, hel, dood, onder welker heerschappij God ons door zijn rechtvaardig oordeel had overgegeven om onze zonden; Christus heeft ons uit hun geweld verlost, aan God zijnen hemelsen Vader voor ons betalende; Hij is sterker dan al onze vijanden."},{"catchword":"ontkomen;","tekst":"Of, vrij en losgemaakt worden."},{"catchword":"met uw twisters","tekst":"Zie Psa 35:1 ."},{"catchword":"verlossen","tekst":"Of, bewaren, behouden."}],"26":[{"catchword":"Ik zal uw","tekst":"Dat is, Ik zal maken dat uwe vijanden en vervolgers, te weten de vijanden mijner kerk, hun eigen vlees zullen eten, dat zij elkander zullen verscheuren en verslinden. Ik zal met hen handelen gelijk ik eertijds met de Midianieten en andere van mijne vijanden gehandeld heb."},{"catchword":"alle vlees","tekst":"Dat is, alle mensen, van wat staat of rang dat zij zijn."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Hearken to me, [Christ speaketh this] ye Isles, [See above chap.41.ver.1.] and listen ye nations from far, the LORD hath called me [to wit, to be a Mediator and Saviour of his people] from the womb, from the bowels of my mother [that is, as soon as my mother conceived me, and brought me into the world. See Math.1.20,21. Luk 1:31. and 2.9.] hath he made mention [to wit, to his chosen people in Juda. See Luk 1:70.] of my Name. [that is, of me.]"}],"2":[{"catchword":null,"tekst":"And he hath made [Heb. Set] my mouth like a sharp sword, [That is, he hath commanded me to preach repentance and forgiveness of sins, and he worketh so by my sermons, as that they cut and pierce the rough the hearts of the hearers. Compare Luk 24:32. Act.2.37. Heb 4:12. Revel.1.16.] under the shadow of his hand [Or, or with the shadow of his hand, etc. See below chap.51.16.] hath he covered me: [that is, he hath kept and protected me against the wiles and subtitles of the Scribes and Pharisees, that they could not apprehend and kill me against my own will, and before my time was come] and made me a pure arrow, [ a pure smooth arrow pierceth easier through anything, then a rusty one doth. Arrow or shaft signifieth here as much as sword a little before. See Psal.45.6.] in his quiver hath he hid me."}],"3":[{"catchword":null,"tekst":"And he said unto me, Thou art my servant Israel, [See above chap.42. 1. And below chap.51.16. The meaning of these words is, O Christ, thou art not only my servant, but thou art also the true Israel, who striving and wrestling with God and with his mighty anger, shalt obtain the victory, whereof Jacob was but a type, when wrestling with the Angel, he overcame him, from whence he got the name of Israel [Or, in whom] I will be glorified. The name of Israel [Or, in whom] I will be glorified. [Others, Israel (is he) of whom I will glory by thee. The meaning is, I command thee that thou first of all offer and tender my glorious word unto the Israelites, or that thou first of all preach and publish my glory among them. See Mat 10:6. and 15.24. Act 13:46. and 28.25, &c.]"}],"4":[{"catchword":null,"tekst":"But I said, [I, to wit, the Lord Christ, who complaineth here of the unbelief and wickedness of the greatest part of the Jews] I have laboured in vain, [to wit, with my sermons preached to the obstinate and // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte

function bereaHtml(n) {

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
