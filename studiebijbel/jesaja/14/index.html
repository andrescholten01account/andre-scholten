l":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Want de HEERE zal Zich over Jakob ontfermen, en Hij zal Israël nog verkiezen, en Hij zal hen in hun land zetten; en de vreemdeling zal zich bij hen voegen, en zij zullen het huis van Jakob aanhangen.","2":"En de volken zullen hen aannemen, en naar hun plaats brengen; en het huis van Israël zal hen erfelijk bezitten in het land van de HEERE tot knechten en tot dienstmeisjes; en zij zullen gevangen houden wie hen gevangen hielden, en zij zullen heersen over hun onderdrukkers.","3":"En het zal gebeuren op de dag, wanneer de HEERE u rust zal geven van uw smart, en van uw onrust, en van de harde dienstbaarheid waarin men u heeft laten dienen,","4":"dan zult u deze spreuk aanheffen tegen de koning van Babel, en zeggen: Hoe houdt de onderdrukker op! *Hoe* houdt de gouden stad op!","5":"De HEERE heeft de stok van de goddelozen gebroken, de scepter van de heersers.","6":"Die de volken sloeg in verbolgenheid met een plaag zonder ophouden, die in toorn over de heidenvolken heerste, wordt vervolgd, zonder dat iemand het kan afweren.","7":"De hele aarde rust, ze is stil; ze maken luid geschal met gejuich.","8":"Ook verheugen de dennen zich over u, *en* de ceders van Libanon, *en zeggen*: Sinds u daar neerligt, komt niemand tegen ons op die ons afhouwt.","9":"Het rijk van de dood van onderen is beroerd om uwentwil, om *u* tegemoet te gaan, toen u kwam; het wekt om uwentwil de doden op, al de bokken van de aarde; het doet al de koningen van de heidenvolken van hun tronen opstaan.","10":"Die allemaal zullen antwoorden, en tegen u zeggen: Bent u ook zwak geworden, zoals wij, bent u ons gelijk geworden?","11":"Uw hoogmoed is in het rijk van de dood neergestort, *met* het geschal van uw luiten; de maden zullen onder u gestrooid worden, en de wormen zullen u bedekken.","12":"Hoe bent u uit de hemel gevallen, o morgenster, u zoon van het dageraad! *hoe* bent u ter aarde neergehouwen, u die de heidenvolken verzwakte!","13":"En u zei in uw hart: Ik zal ten hemel opklimmen, ik zal mijn troon boven de sterren van God verhogen; en ik zal mij zetten op de berg van de samenkomst aan de zijden van het noorden.","14":"Ik zal boven de hoogten van de wolken klimmen, ik zal de Allerhoogste gelijk worden.","15":"Ja, in het rijk van de dood zult u neergestoten worden, aan de zijden van de kuil!","16":"Wie u zullen zien, zullen u aanschouwen, ze zullen op u letten, *en zeggen*: Is dat die man, die de aarde deed beroeren, die de koninkrijken deed beven?","17":"Die de wereld als een woestijn stelde, en daarvan de steden verstoorde, die zijn gevangenen niet liet gaan naar huis toe?","18":"Al de koningen van de heidenvolken, zij liggen allemaal neer met eer, ieder in zijn huis;","19":"maar u bent verworpen van uw graf, als een gruwelijke scheut, *als* een kleed van de gedoden, die met het zwaard doorstoken zijn; *als* wie neerdalen in een steenkuil, als een vertreden dood lichaam.","20":"U zult niet bij hen gevoegd worden in de begrafenis; want u hebt uw land verdorven, *en* uw volk gedood; het nageslacht van de boosdoeners zal in eeuwigheid niet genoemd worden.","21":"Maak de slachting voor zijn kinderen gereed, om de ongerechtigheid van hun vaderen; opdat zij niet opstaan, en de aarde erven, en de wereld vervullen met steden;","22":"want Ik zal tegen hen opstaan, spreekt de HEERE van de heerscharen[1], en Ik zal van Babel de naam en het overblijfsel uitroeien, en de zoon en de kleinzoon, spreekt de HEERE.","23":"En Ik zal hen stellen tot een erfbezit van de nachtuilen, en *tot* waterpoelen; en Ik zal hen met een bezem van het verderf wegvegen, spreekt de HEERE van de heerscharen.","24":"De HEERE van de heerscharen heeft gezworen: Voorzeker, zoals Ik gedacht heb, zo zal het gebeuren, en zoals Ik beraadslaagd heb, zo zal het bestaan!","25":"Dat Ik Assur in Mijn land zal verbreken, en hem op Mijn bergen vertreden; opdat zijn juk van hen afwijkt, en zijn last van hun schouder wijkt.","26":"Dit is de raadslag, die beraadslaagd is over dat hele land; en dit is de hand, die uitgestrekt is over alle volken.","27":"Want de HEERE van de heerscharen heeft het in Zijn raad besloten, wie zal het dan verbreken? en Zijn hand is uitgestrekt, wie zal die dan keren?","28":"In het jaar dat koning Achaz stierf, gebeurde deze last.","29":"Verheug u niet, u helemaal Palestina! dat de roede die u sloeg, gebroken is; want uit de wortel van de slang zal een basilisk voortkomen, en haar vrucht zal een vurige vliegende draak zijn.","30":"En de eerstgeborenen van de armen zullen weiden, en de behoeftigen zullen zeker neerliggen; uw wortel daarentegen zal Ik door de honger doden, en uw overblijfsel zal hij ombrengen.","31":"Huil, u poort, schreeuw, u stad! u bent gesmolten, u helemaal Palestina! want van het noorden komt een rook, en er is geen eenzame in zijn samenkomsten.","32":"Wat zal men dan antwoorden aan de boden van het volk? Dat de HEERE Sion gegrond heeft, opdat de bedrukten van Zijn volk daarin een toevlucht zouden hebben."},"SV":{"1":"Want de HEERE zal Zich over Jakob ontfermen, en Hij zal Israël nog verkiezen, en Hij zal hen in hun land zetten; en de vreemdeling zal zich tot hen vervoegen, en zij zullen het huis van Jakob aanhangen.","2":"En de volken zullen hen aannemen, en in hun plaats brengen; en het huis Israëls zal hen erfelijk bezitten in het land des HEEREN tot knechten en tot maagden; en zij zullen gevangen houden degenen, die hen gevangen hielden, en zij zullen heersen over hun drijvers.","3":"En het zal geschieden ten dage, wanneer u de HEERE rust geven zal van uw smart, en van uw beroering, en van de harde dienstbaarheid, waarin men u heeft doen dienen;","4":"Dan zult gij deze spreuk opnemen tegen den koning van Babel, en zeggen: Hoe houdt de drijver op? *Hoe* houdt de goudene op?","5":"De HEERE heeft den stok der goddelozen gebroken, den scepter der heersers.","6":"Die de volken plaagde in verbolgenheid met een plaag zonder ophouden, die in toorn over de heidenen heerste, die wordt vervolgd, zonder dat het iemand afweren kan.","7":"De ganse aarde rust, zij is stil; zij maken groot geschal met gejuich.","8":"Ook verheugen zich de dennen over u, *en* de cederen van Libanon, *zeggende*: Sinds dat gij daar nederligt, komt niemand tegen ons op, die ons afhouwe.","9":"De hel van onderen was beroerd om uwentwil, om *u* tegemoet te gaan, als gij kwaamt; zij wekt om uwentwil de doden op, al de bokken der aarde; zij doet al de koningen der heidenen van hun tronen opstaan.","10":"Die altegader zullen antwoorden, en tot u zeggen: Gij zijt ook krank geworden, gelijk wij, gij zijt ons gelijk geworden.","11":"Uw hovaardij is in de hel nedergestort, *met* het geklank uwer luiten; de maden zullen onder u gestrooid worden, en de wormen zullen u bedekken.","12":"Hoe zijt gij uit den hemel gevallen, o morgenster, gij zoon des dageraads! *hoe* zijt gij ter aarde nedergehouwen, gij, die de heidenen krenktet!","13":"En zeidet in uw hart: Ik zal ten hemel opklimmen, ik zal mijn troon boven de sterren Gods verhogen; en ik zal mij zetten op den berg der samenkomst aan de zijden van het noorden.","14":"Ik zal boven de hoogten der wolken klimmen, ik zal den Allerhoogste gelijk worden.","15":"Ja, in de hel zult gij nedergestoten worden, aan de zijden van den kuil!","16":"Die u zien zullen, zullen u aanschouwen, zij zullen op u letten, *en* *zeggen*: Is dat die man, die de aarde beroerde, die de koninkrijken deed beven?","17":"Die de wereld als een woestijn stelde, en derzelver steden verstoorde, die zijn gevangenen niet liet los *gaan* naar huis toe?","18":"Al de koningen der heidenen, zij allen liggen neder met eer, een iegelijk in zijn huis;","19":"Maar gij zijt verworpen van uw graf, als een gruwelijke scheut, *als* een kleed der gedoden, die met het zwaard doorstoken zijn; *als* die nederdalen in een steenkuil, als een vertreden dood lichaam.","20":"Gij zult bij dezelve niet gevoegd worden in de begrafenis; want gij hebt uw land verdorven, *en* uw volk gedood; het zaad der boosdoeners zal in der eeuwigheid niet genoemd worden.","21":"Maakt de slachting voor zijn kinderen gereed, om hunner vaderen ongerechtigheid wil; dat zij niet opstaan, en de aarde erven, en de wereld vervullen met steden;","22":"Want Ik zal tegen hen opstaan, spreekt de HEERE der heirscharen, en Ik zal van Babel uitroeien den naam en het overblijfsel, en den zoon en den zoonszoon, spreekt de HEERE.","23":"En Ik zal hen stellen tot een erve der nachtuilen, en *tot* waterpoelen; en Ik zal hen met een bezem des verderfs uitvagen, spreekt de HEERE der heirscharen.","24":"De HEERE der heirscharen heeft gezworen, zeggende: Indien niet, gelijk Ik gedacht heb, het alzo geschiede, en gelijk Ik beraadslaagd heb, het bestaan zal!","25":"Dat Ik Assur in Mijn land zal verbreken, en hem op Mijn bergen vertreden; opdat zijn juk van hen afwijke, en zijn last van hun schouder wijke.","26":"Dit is de raadslag, die beraadslaagd is over dat ganse land; en dit is de hand, die uitgestrekt is over alle volken.","27":"Want de HEERE der heirscharen heeft het in Zijn raad besloten, wie zal het dan verbreken? en Zijn hand is uitgestrekt, wie zal ze dan keren?","28":"In het jaar, toen de koning Achaz stierf, geschiedde deze last.","29":"Verheug u niet, gij gans Palestina! dat de roede die u sloeg, gebroken is; want uit de wortel der slang zal een basilisk voortkomen, en haar vrucht zal een vurige vliegende draak zijn.","30":"En de eerstgeborenen der armen zullen weiden, en de nooddruftigen zullen zeker nederliggen; uw wortel daarentegen zal Ik door den honger doden, en uw overblijfsel zal hij ombrengen.","31":"Huil, gij poort, schreeuw, gij stad! gij zijt gesmolten, gij gans Palestina! want van het noorden komt een rook, en er is geen eenzame in zijn samenkomsten.","32":"Wat zal men dan antwoorden den boden des volks? Dat de HEERE Sion gegrond heeft, opdat de bedrukten Zijns volks een toevlucht daarin hebben zouden."},"KJV":{"1":"For the LORD will have mercy on Jacob, and will yet choose Israel, and set them in their own land: and the strangers shall be joined with them, and they shall cleave to the house of Jacob.","2":"And the people shall take them, and bring them to their place: and the house of Israel shall possess them in the land of the LORD for servants and handmaids: and they shall take them captives, whose captives they were; and they shall rule over their oppressors.","3":"And it shall come to pass in the day that the LORD shall give thee rest from thy sorrow, and from thy fear, and from the hard bondage wherein thou wast made to serve,","4":"That thou shalt take up this proverb against the king of Babylon, and say, How hath the oppressor ceased! the golden city ceased!","5":"The LORD hath broken the staff of the wicked, *and* the sceptre of the rulers.","6":"He who smote the people in wrath with a continual stroke, he that ruled the nations in anger, is persecuted, *and* none hindereth.","7":"The whole earth is at rest, *and* is quiet: they break forth into singing.","8":"Yea, the fir trees rejoice at thee, *and* the cedars of Lebanon, *saying*, Since thou art laid down, no feller is come up","9":"Hell from beneath is moved for thee to meet *thee* at thy coming: it stirreth up the dead for thee, *even* all the chief ones of the earth; it hath raised up from their thrones all the kings of the nations.","10":"All they shall speak and say unto thee, Art thou also become weak as we? art thou become like","11":"Thy pomp is brought down to the grave, *and* the noise of thy viols: the worm is spread under thee, and the worms cover","12":"How art thou fallen from heaven, O Lucifer, son of the morning! *how* art thou cut down to the ground, which didst weaken the nations!","13":"For thou hast said in thine heart, I will ascend into heaven, I will exalt my throne above the stars of God: I will sit also upon the mount of the congregation, in the sides of the north:","14":"I will ascend above the heights of the clouds; I will be like the most High.","15":"Yet thou shalt be brought down to hell, to the sides of the pit.","16":"They that see thee shall narrowly look upon thee, *and* consider thee, *saying, Is* this the man that made the earth to tremble, that did shake kingdoms;","17":"*That* made the world as a wilderness, and destroyed the cities thereof; *that* opened not the house of his prisoners?","18":"All the kings of the nations, *even* all of them, lie in glory, every one in his own house.","19":"But thou art cast out of thy grave like an abominable branch, *and as* the raiment of those that are slain, thrust through with a sword, that go down to the stones of the pit; as a carcase trodden under feet.","20":"Thou shalt not be joined with them in burial, because thou hast destroyed thy land, *and* slain thy people: the seed of evildoers shall never be renowned.","21":"Prepare slaughter for his children for the iniquity of their fathers; that they do not rise, nor possess the land, nor fill the face of the world with cities.","22":"For I will rise up against them, saith the LORD of hosts, and cut off from Babylon the name, and remnant, and son, and nephew, saith the LORD.","23":"I will also make it a possession for the bittern, and pools of water: and I will sweep it with the besom of destruction, saith the LORD of hosts.","24":"The LORD of hosts hath sworn, saying, Surely as I have thought, so shall it come to pass; and as I have purposed, *so* shall it stand:","25":"That I will break the Assyrian in my land, and upon my mountains tread him under foot: then shall his yoke depart from off them, and his burden depart from off their shoulders.","26":" up</span> the <span class=\"wl wl-kjv\" data-code=\"H7496\">dead</span> for thee, even all the chief <span class=\"wl wl-kjv\" data-code=\"H6260\">ones</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth;</span> it hath raised <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> from their <span class=\"wl wl-kjv\" data-code=\"H3678\">thrones</span> all the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of the nations.","10":"All they shall <span class=\"wl wl-kjv\" data-code=\"H6030\">speak</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto thee, Art thou also become <span class=\"wl wl-kjv\" data-code=\"H2470\">weak</span> as we? art thou become like","11":"Thy <span class=\"wl wl-kjv\" data-code=\"H1347\">pomp</span> is brought <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to the <span class=\"wl wl-kjv\" data-code=\"H7585\">grave,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1998\">noise</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5035\">viols:</span> the <span class=\"wl wl-kjv\" data-code=\"H7415\">worm</span> is <span class=\"wl wl-kjv\" data-code=\"H3331\">spread</span> under thee, and the <span class=\"wl wl-kjv\" data-code=\"H8438\">worms</span> cover","12":"How art thou <span class=\"wl wl-kjv\" data-code=\"H5307\">fallen</span> from <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> O <span class=\"wl wl-kjv\" data-code=\"H1966\">Lucifer,</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of the <span class=\"wl wl-kjv\" data-code=\"H7837\">morning!</span> how art thou cut <span class=\"wl wl-kjv\" data-code=\"H1438\">down</span> to the <span class=\"wl wl-kjv\" data-code=\"H776\">ground,</span> which didst <span class=\"wl wl-kjv\" data-code=\"H2522\">weaken</span> the nations!","13":"For thou hast <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> in thine <span class=\"wl wl-kjv\" data-code=\"H3824\">heart,</span> I will <span class=\"wl wl-kjv\" data-code=\"H5927\">ascend</span> into <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> I will <span class=\"wl wl-kjv\" data-code=\"H7311\">exalt</span> my <span class=\"wl wl-kjv\" data-code=\"H3678\">throne</span> <span class=\"wl wl-kjv\" data-code=\"H4605\">above</span> the <span class=\"wl wl-kjv\" data-code=\"H3556\">stars</span> of <span class=\"wl wl-kjv\" data-code=\"H410\">God:</span> I will <span class=\"wl wl-kjv\" data-code=\"H3427\">sit</span> also upon the <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> of the <span class=\"wl wl-kjv\" data-code=\"H4150\">congregation,</span> in the <span class=\"wl wl-kjv\" data-code=\"H3411\">sides</span> of the north:","14":"I will <span class=\"wl wl-kjv\" data-code=\"H5927\">ascend</span> above the <span class=\"wl wl-kjv\" data-code=\"H1116\">heights</span> of the <span class=\"wl wl-kjv\" data-code=\"H5645\">clouds;</span> I will be <span class=\"wl wl-kjv\" data-code=\"H1819\">like</span> the most High.","15":"Yet thou shalt be brought <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to <span class=\"wl wl-kjv\" data-code=\"H7585\">hell,</span> to the <span class=\"wl wl-kjv\" data-code=\"H3411\">sides</span> of the pit.","16":"They that <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> thee shall narrowly <span class=\"wl wl-kjv\" data-code=\"H7688\">look</span> upon thee, and <span class=\"wl wl-kjv\" data-code=\"H995\">consider</span> thee, saying, Is this the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> that made the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> to <span class=\"wl wl-kjv\" data-code=\"H7264\">tremble,</span> that did <span class=\"wl wl-kjv\" data-code=\"H7493\">shake</span> kingdoms;","17":"That <span class=\"wl wl-kjv\" data-code=\"H7760\">made</span> the <span class=\"wl wl-kjv\" data-code=\"H8398\">world</span> as a <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness,</span> and <span class=\"wl wl-kjv\" data-code=\"H2040\">destroyed</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> thereof; that <span class=\"wl wl-kjv\" data-code=\"H6605\">opened</span> not the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of his prisoners?","18":"All the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations,</span> even all of them, <span class=\"wl wl-kjv\" data-code=\"H7901\">lie</span> in <span class=\"wl wl-kjv\" data-code=\"H3519\">glory,</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> in his own house.","19":"But thou art cast <span class=\"wl wl-kjv\" data-code=\"H7993\">out</span> of thy <span class=\"wl wl-kjv\" data-code=\"H6913\">grave</span> like an <span class=\"wl wl-kjv\" data-code=\"H8581\">abominable</span> <span class=\"wl wl-kjv\" data-code=\"H5342\">branch,</span> and as the <span class=\"wl wl-kjv\" data-code=\"H3830\">raiment</span> of those that are <span class=\"wl wl-kjv\" data-code=\"H2026\">slain,</span> thrust <span class=\"wl wl-kjv\" data-code=\"H2944\">through</span> with a <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> that go <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to the <span class=\"wl wl-kjv\" data-code=\"H68\">stones</span> of the <span class=\"wl wl-kjv\" data-code=\"H953\">pit;</span> as a <span class=\"wl wl-kjv\" data-code=\"H6297\">carcase</span> trodden under feet.","20":"Thou shalt not be <span class=\"wl wl-kjv\" data-code=\"H3161\">joined</span> with them in <span class=\"wl wl-kjv\" data-code=\"H6900\">burial,</span> because thou hast <span class=\"wl wl-kjv\" data-code=\"H7843\">destroyed</span> thy <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and <span class=\"wl wl-kjv\" data-code=\"H2026\">slain</span> thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people:</span> the <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> of <span class=\"wl wl-kjv\" data-code=\"H7489\">evildoers</span> shall <span class=\"wl wl-kjv\" data-code=\"H5769\">never</span> be renowned.","21":"<span class=\"wl wl-kjv\" data-code=\"H3559\">Prepare</span> <span class=\"wl wl-kjv\" data-code=\"H4293\">slaughter</span> for his <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> for the <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity</span> of their <span class=\"wl wl-kjv\" data-code=\"H1\">fathers;</span> that they do <span class=\"wl wl-kjv\" data-code=\"H1077\">not</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">rise,</span> nor <span class=\"wl wl-kjv\" data-code=\"H3423\">possess</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> nor <span class=\"wl wl-kjv\" data-code=\"H4390\">fill</span> the <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> of the <span class=\"wl wl-kjv\" data-code=\"H8398\">world</span> with <span class=\"wl wl-kjv\" data-code=\"H6145\">cities.</span>","22":"For I will rise <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> against them, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> and cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> from <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> the <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> and <span class=\"wl wl-kjv\" data-code=\"H7605\">remnant,</span> and <span class=\"wl wl-kjv\" data-code=\"H5209\">son,</span> and <span class=\"wl wl-kjv\" data-code=\"H5220\">nephew,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.","23":"I will also <span class=\"wl wl-kjv\" data-code=\"H7760\">make</span> it a <span class=\"wl wl-kjv\" data-code=\"H4180\">possession</span> for the <span class=\"wl wl-kjv\" data-code=\"H7090\">bittern,</span> and <span class=\"wl wl-kjv\" data-code=\"H98\">pools</span> of <span class=\"wl wl-kjv\" data-code=\"H4325\">water:</span> and I will <span class=\"wl wl-kjv\" data-code=\"H2894\">sweep</span> it with the <span class=\"wl wl-kjv\" data-code=\"H4292\">besom</span> of <span class=\"wl wl-kjv\" data-code=\"H8045\">destruction,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of hosts.","24":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts</span> hath <span class=\"wl wl-kjv\" data-code=\"H7650\">sworn,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Surely as I have <span class=\"wl wl-kjv\" data-code=\"H1819\">thought,</span> so shall it come to pass; and as I have <span class=\"wl wl-kjv\" data-code=\"H3289\">purposed,</span> so shall it stand:","25":"That I will <span class=\"wl wl-kjv\" data-code=\"H7665\">break</span> the <span class=\"wl wl-kjv\" data-code=\"H804\">Assyrian</span> in my <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and upon my <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains</span> tread him under <span class=\"wl wl-kjv\" data-code=\"H947\">foot:</span> then shall his <span class=\"wl wl-kjv\" data-code=\"H5923\">yoke</span> <span class=\"wl wl-kjv\" data-code=\"H5493\">depart</span> from off them, and his <span class=\"wl wl-kjv\" data-code=\"H5448\">burden</span> <span class=\"wl wl-kjv\" data-code=\"H5493\">depart</span> from off their shoulders.","26":"This is the <span class=\"wl wl-kjv\" data-code=\"H6098\">purpose</span> that is <span class=\"wl wl-kjv\" data-code=\"H3289\">purposed</span> upon the whole <span class=\"wl wl-kjv\" data-code=\"H776\">earth:</span> and this is the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> that is stretched <span class=\"wl wl-kjv\" data-code=\"H5186\">out</span> upon all the nations.","27":"For the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts</span> hath <span class=\"wl wl-kjv\" data-code=\"H3289\">purposed,</span> and who shall <span class=\"wl wl-kjv\" data-code=\"H6565\">disannul</span> it? and his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> is stretched <span class=\"wl wl-kjv\" data-code=\"H5186\">out,</span> and who shall turn it back?","28":"In the <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> that <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H271\">Ahaz</span> <span class=\"wl wl-kjv\" data-code=\"H4194\">died</span> was this burden.","29":"<span class=\"wl wl-kjv\" data-code=\"H8055\">Rejoice</span> not thou, whole <span class=\"wl wl-kjv\" data-code=\"H6429\">Palestina,</span> because the <span class=\"wl wl-kjv\" data-code=\"H7626\">rod</span> of him that <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> thee is <span class=\"wl wl-kjv\" data-code=\"H7665\">broken:</span> for out of the <span class=\"wl wl-kjv\" data-code=\"H5175\">serpent's</span> <span class=\"wl wl-kjv\" data-code=\"H8328\">root</span> shall come <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> a <span class=\"wl wl-kjv\" data-code=\"H6848\">cockatrice,</span> and his <span class=\"wl wl-kjv\" data-code=\"H6529\">fruit</span> shall be a <span class=\"wl wl-kjv\" data-code=\"H8314\">fiery</span> <span class=\"wl wl-kjv\" data-code=\"H5774\">flying</span> serpent.","30":"And the <span class=\"wl wl-kjv\" data-code=\"H1060\">firstborn</span> of the <span class=\"wl wl-kjv\" data-code=\"H1800\">poor</span> shall <span class=\"wl wl-kjv\" data-code=\"H7462\">feed,</span> and the <span class=\"wl wl-kjv\" data-code=\"H34\">needy</span> shall lie <span class=\"wl wl-kjv\" data-code=\"H7257\">down</span> in <span class=\"wl wl-kjv\" data-code=\"H983\">safety:</span> and I will <span class=\"wl wl-kjv\" data-code=\"H4191\">kill</span> thy <span class=\"wl wl-kjv\" data-code=\"H8328\">root</span> with <span class=\"wl wl-kjv\" data-code=\"H7458\">famine,</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H2026\">slay</span> thy remnant.","31":"<span class=\"wl wl-kjv\" data-code=\"H3213\">Howl,</span> O <span class=\"wl wl-kjv\" data-code=\"H8179\">gate;</span> <span class=\"wl wl-kjv\" data-code=\"H2199\">cry,</span> O <span class=\"wl wl-kjv\" data-code=\"H5892\">city;</span> thou, whole <span class=\"wl wl-kjv\" data-code=\"H6429\">Palestina,</span> art <span class=\"wl wl-kjv\" data-code=\"H4127\">dissolved:</span> for there shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> from the <span class=\"wl wl-kjv\" data-code=\"H6828\">north</span> a <span class=\"wl wl-kjv\" data-code=\"H6227\">smoke,</span> and none shall be <span class=\"wl wl-kjv\" data-code=\"H909\">alone</span> in his appointed times.","32":"What shall one then <span class=\"wl wl-kjv\" data-code=\"H6030\">answer</span> the <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> of the <span class=\"wl wl-kjv\" data-code=\"H1471\">nation?</span> That the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H3245\">founded</span> <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6041\">poor</span> of his <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> shall trust"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"de HEERE","tekst":"Hier geeft de profeet reden waarom God de Babyloniërs door de Meden en Perzen verstoren zou, gelijk Isa 13 gezegd is; te weten opdat Hij door zulk een middel zijn volk uit de Babylonische gevangenschap verlossen zou."},{"catchword":"over Jakob","tekst":"Dat is, over de Joden in Babylon gevangen zijnde."},{"catchword":"ontfermen,","tekst":"Dit is niet alleen te verstaan van een lichamelijke verlossing uit de Babylonische gevangenschap, maar ook van de geestelijke verlossing van het volk Gods door Christus Jezus."},{"catchword":"Hij zal Israël","tekst":"De Heere."},{"catchword":"nog","tekst":"Of, verder, voortaan."},{"catchword":"verkiezen,","tekst":"Dat is, Hij zal zich Israël zijn uitverkoren vol [hetwelk Hij straks Jakob genoemd heeft] nog verder aannemen, metterdaad bewijzende en doende blijken dat Hij Israël heeft uitverkoren tot zijn eigen volk."},{"catchword":"zal hen","tekst":"Te weten Jakob en Israël, dat is de Joden."},{"catchword":"in hun land","tekst":"Te weten in het Joodse land, hen verlossende uit de Babylonische gevangenschap."},{"catchword":"de vreemdeling","tekst":"Te weten enigen uit de heidenen, zelfs uit de Babyloniërs. Dit is ene belofte aangaande de beroeping der heidenen tot Christus, door de predikatie van het heilig Evangelie. Zie Rom 11 ."}],"2":[{"catchword":"de volken","tekst":"Dit is eerst vervuld als enige volken onder de heidenen den Joden, toen zij naar Jeruzalem weder optogen, alle hulp en dienst bewezen hebben; Ezr 1:6 . Daarna, als vele heidenen door de gelovige Joden [door de apostelen, hunne medehelpers en navolgers] tot de gehoorzaamheid des Evangelies en tot de gemeenschap der Christelijke kerk zijn gebracht geworden. Zie boven Isa 11:14 , en onder Isa 66:20 ."},{"catchword":"in hun plaats","tekst":"Of, aan hunne plaats; dat is in hun vaderland."},{"catchword":"het huis Israëls","tekst":"De Israëlieten zullen de volken zo onder hun gebied hebben, alsof zij hunne dienstboden waren. Doch dit is te verstaan van een vrijwillige dienstbaarheid, daar herkomende, dat de vreemdelingen de religie der Joden, en daarna de Christelijke religie, zouden aannemen."},{"catchword":"in het land","tekst":"Dat is, in Judea, hetwelk aldus genoemd wordt omdat God dat land ten erve gegeven had en dat Hij zijne rust in den tempel te Jeruzalem genomen had."},{"catchword":"zij zullen","tekst":"Dit is voltrokken als de heidenen, door de predikatie der apostelen, zich Christus hebben onderworpen. Zie 2Co 10:5-6 ."}],"3":[{"catchword":"u de HEERE","tekst":"O mijn volk van Israël."}],"4":[{"catchword":"opnemen","tekst":"Dat is, gebruiken, in den mond nemen, gelijk Psa 50:16 ."},{"catchword":"tegen den koning","tekst":"Of, van, of over."},{"catchword":"Hoe houdt","tekst":"Alsof men zeide: Hoe is het mogelijk, dat zulk een machtig en zulk een groot koninkrijk in een nacht zo vervallen is? Van hier af tot op vs.21, worden beschreven de vrolijke woorden van het volk Gods, vanwege den ondergang der Babyloniërs."},{"catchword":"de drijver op?","tekst":"Dit is, dien tiran, dien wreden heerser."},{"catchword":"de goudene","tekst":"Versta hier door de goudene de stad Babel, die rijk en prachtig was, harer inwoners klederen en huisraad blinkende van goud en zilver. Zie Dan 2:3 . Anders: gouddorstige, of goudschatterin. Het komt van een Chaldeeuws woord, dat goud betekent. De profeet bespot Babel, de hoofdstad van Chaldea, met een woord uit de Chaldeeuwse spraak genomen."}],"5":[{"catchword":"den stok","tekst":"Of, staf. Dat is, die harde en wrede heerschappij der Babyloniërs. Dit is een antwoord op de vraag in vs.4 te kennen gevende dat God de Babyloniërs vernielen zou, hoe onmogelijk dat het in het oordeel der mensen was."}],"6":[{"catchword":"met een plaag","tekst":"Anders: met ene plaag, die niet is af te weren, enz."},{"catchword":"vervolgd,","tekst":"Te weten van de Perzen en Meden, zonder dat hij het kan weren; ja noch hij noch iemand anders. Anders: werd iemand vervolgd, of verdrukt, hij belette het niet. Versta hierbij, maar hij liet een ieder geweld drijven naar zijn welgevallen."}],"7":[{"catchword":"aarde","tekst":"Dat is, de inwoners der aarde; daarom volgt er: zij maken, enz. in het veelvoudig getal."},{"catchword":"rust,","tekst":"De zin is: Nu de roverse stad en het land van Babel ten ondergebracht en verdelgd zijn, zo is de ganse wereld in rust en vrede."}],"8":[{"catchword":"Ook verheugen","tekst":"Dit zijn de woorden van het volk tot den koning te Babel, gebruikende allegorische en poëtische manieren van spreken, die vooreerst aldus kunnen genomen worden: Dat na de vestoring van het Babylonische rijk de bossen en bomen oorzaak zouden hebben om zich te verheugen, dewijl men ze voortaan zo niet afhouwen zou, tot allerlei timmer en krijgsgereedschappen, gelijk placht te geschieden als dat rijk nog in zijn fleur was. Men kan ook door de dennen en cederen verstaan de koningen en prinsen, welke de koning te Babel had ten ondergebracht."},{"catchword":"daar nederligt,","tekst":"Of, slaapt, dat is dood zijn."},{"catchword":"afhouwe","tekst":"Of, uitroeie."}],"9":[{"catchword":"De hel","tekst":"Of, het graf."},{"catchword":"om u","tekst":"Gelijk men de grote heren en prinsen pleegt te doen."},{"catchword":"als gij kwaamt;","tekst":"Te weten toen gij, dood zijnde, tot hen in het graf of in de hel kwaamt. Alsof hij zeide: Dewijl gij bij de mensen op de aarde al uw eer en aanzien verloren hebt, zo willen u de doden en die in de hel zijn eer bewijzen. Zie dergelijke oneigene en poëtische manieren van spreken Eze 31:16 , en Eze 32:18 en elders meer."},{"catchword":"zij wekt","tekst":"Te weten de hel, of het graf."},{"catchword":"de doden op,","tekst":"Anders: de reuzen. Zie Gen 14:5 ; Job 26:5 ."},{"catchword":"al de bokken","tekst":"Dat is, prinsen, vorsten, regenten, die bokken genoemd worden, omdat gelijk de viervoetige bokken of rammen voor aan de kudde gaan en sterk zijn, alzo ook de prinsen enz. Zie Jer 50:8 ; Dan 8:5 ; Zec 10:3 . En versta hier, de prinsen, die in de graven liggen."},{"catchword":"tronen opstaan","tekst":"De graven zijn de tronen, bedden en stoelen der dode koningen."}],"10":[{"catchword":"antwoorden,","tekst":"Dat is, spreken; zie de aantekening Jdg 18:14 ."},{"catchword":"Gij zijt ook","tekst":"Anders: zijt gij ook krank, of zwak geworden? [dat is van uw grote macht beroofd] gelijk wij? dat is zowel als wij; zijt gij ons gelijk geworden? Het is een spotrede met verwondering."}],"11":[{"catchword":"in de hel","tekst":"Anders, in het graf."},{"catchword":"nedergestort,","tekst":"Nedergevaren, nedergestoten, nedergedrukt."},{"catchword":"met","tekst":"Dat is, met het lieflijk muziekspel, genoegen en pleizier, die gij op aarde placht te hebben. Zie Dan 3:5 , Dan 3:10 , Dan 3:15 ."},{"catchword":"de maden . . . de wormen","tekst":"Alsof hij zeide: Dit zullen uwe tapijten, kostelijke spreien en deksels zijn."}],"12":[{"catchword":"uit den hemel","tekst":"Of, van den hemel. Door den hemel moet men hier verstaan de koninklijke heerlijkheid, glans en schoonheid."},{"catchword":"o morgenster,","tekst":"Aldus noemt de profeet den koning te Babel, omdat zijne heerlijkheid hier op aarde was als de glans der morgenster aan den hemel, klaarder schijnende dan enige andere sterren des hemels, alzo dat zij alleen schaduw van zich geeft."},{"catchword":"gij, die de heidenen","tekst":"Anders: gij zijt verlamd boven andere natiën; dat is, God heeft u harder aangestoten dan enige andere koningen der heidenen."}],"13":[{"catchword":"Ik zal","tekst":"Alsof hij zeide: Ik wil den stoel, eer, glorie en macht Gods aan mij nemen."},{"catchword":"de sterren","tekst":"Dat is, boven de allerhoogste en schoonste sterren."},{"catchword":"den berg","tekst":"Aldus noemt hij den berg Zion, aan welken de stad Jeruzalem lag en daarnevens de tempel op den berg Moria, waar het volk samenkwam tot den godsdienst. En met deze woorden wordt aangewezen de vermetelheid der koningen te Babel, die zichzelven inbeeldden dat, wanneer zij Jeruzalem overmeesterd hebben, zij alsdan op den troon van God zouden geplant zijn, en dat men hun die eer zou aandoen, die men den waren God aldaar pleegt te doen."},{"catchword":"aan de zijden","tekst":"Hier lag de berg Moria, op welken de tempel gebouwd was."}],"15":[{"catchword":"Ja,","tekst":"Hier spreekt de profeet weder in zijn eigen persoon."},{"catchword":"in de hel","tekst":"Of, in het graf."},{"catchword":"nedergestoten","tekst":"Te weten van de Perzen en Meden."}],"16":[{"catchword":"Die u zien zullen,","tekst":"Te ewten de doden, die alrede begraven zijn."},{"catchword":"zullen u aanschouwen,","tekst":"Te weten met verwondering. Anders: zullen u nauw bezien."},{"catchword":"zij zullen op u letten,","tekst":"Als hij zeide: Zij zullen zeer verwonderd staan, twijfelen of gij die trotse koning van Babel zijt."}],"17":[{"catchword":"die zijn gevangenen","tekst":"De zin is: Die zo wreed en onverzoenlijk was, dat hij degenen, die hij eens gevankelijk kreeg, nimmermeer losliet."}],"18":[{"catchword":"zij allen","tekst":"Dat is zoveel als hunner zijn."},{"catchword":"liggen neder","tekst":"Dat is, zij zijn in eer gestorven en zijn begraven in de graven, die zij, of hunne voorouders, voor hen en voor hun huisgezin bereid hebben."}],"19":[{"catchword":"van uw graf,","tekst":"Dat is, van het graf, in hetwelk gij meent te zullen begraven worden; of, gij zijt verworpen of verstoken, dat gij in geen koninklijk graf met koninklijke eer begraven zijt."},{"catchword":"een gruwelijke scheut,","tekst":"Dat is, als een vuil, verrot, verachtzaam hout. Anderen nemen dit alzo: Gij zijt een onaardige, kwade spruit; dat is zoon of nakomeling, niet waardig bij zijne voorouders begraven te worden."},{"catchword":"als een kleed","tekst":"Hetwelk gescheurd en vol gaten is, lelijk en vuil gemaakt met bloed en slijk, dat derhalve van gene waarde is; maar het wordt met het dode lichaam in het graf geworpen."},{"catchword":"met het zwaard","tekst":"Hebreeuws, de doorstokenen van het zwaard. Anders: beladenen, of toegedekten van het zwaard, die met zwaarden beladen of toegedekt zijn. In onze spraak zeggen wij ook dat iemand met zwaarden, of stokken dapper toegedekt, dat is geslagen en gewond is."},{"catchword":"nederdalen","tekst":"Dat is, gij zult niet eerlijk, of naar de gemene wijze begraven worden; maar men zal u boven op de aarde laten liggen, en slechts een hoop stenen op u werpen, gelijk men een dood aas met aarde, stenen en drek bedekt."},{"catchword":"in een steenkuil,","tekst":"Hebreeuws, tot de stenen des kuils."}],"20":[{"catchword":"bij dezelve","tekst":"Te weten bij de andere koningen der heidenen, gelijk vs.18. Dat is, gij zult met zulke eer en pracht niet begraven worden, gelijk zij zijn begraven geweest."},{"catchword":"uw land . . . uw volk","tekst":"Te weten uw eigen land en uw eigen volk."},{"catchword":"zaad der","tekst":"Dat is de kinderen, of het geslacht."},{"catchword":"boosdoeners","tekst":"Hoedanig geweest is Belsazar en andere voorouders van dezen koning. Of, der boosdoeners; dat is, uw zaad; versta hierbij: maar het zal uitgeroeid worden."},{"catchword":"in der eeuwigheid","tekst":"Dat is, niet altoos."},{"catchword":"niet genoemd worden","tekst":"Dat is, niet gedacht worden, te weten ter ere, of met prijs en roem, maar met verachtzaamheid en met smaad en met oneer."}],"21":[{"catchword":"Maakt de slachting","tekst":"Of, bereid. De zin is: Gij Perzen en Meden schikt en bereidt u daartoe, dat gij zijns, te weten des konings van Babels kinderen, of zonen, slacht en doodt. Want God spreekt hier de Perzen en Meden aan, mitsgaders al degenen, die Hij nevens hen wilde gebruiken om den koning en de zijnen te doden en uit te roeien."},{"catchword":"erven,","tekst":"Of, erfelijk bezitten."},{"catchword":"vervullen","tekst":"Dat is, zich zo niet vermeerderen en vermenigvuldigen, dat zij steden bouwen, die met mensen vervullen, en hun gebied uitbreiden."},{"catchword":"met steden;","tekst":"Anders, met vijanden; te weten met vijanden en vervolgers der kerk Gods en van alle vromen."}],"22":[{"catchword":"tegen hen","tekst":"Te weten tegen de kinderen van den koning te Babel."},{"catchword":"en het overblijfsel,","tekst":"Dat is, de overgeblevenen."},{"catchword":"den zoon","tekst":"Anders: zo den zoon als den neEf."}],"23":[{"catchword":"stellen","tekst":"Te weten de stad Babel."},{"catchword":"tot een erve","tekst":"Anders: tot een erfelijke bezitting."},{"catchword":"der nachtuilen,","tekst":"Anders: der ijzeren varkens; of zwijnegels; anders putoors; anders bevers; anders poelarenden. De profeet wil zeggen dat Babel zo woest liggen zal, dat er niets dan wilde wrede beesten wonen zullen."}],"24":[{"catchword":"Indien niet,","tekst":"Anders: Zekerlijk, het zal geschieden, enz. Het is ene manier van eedzweren; zie Psa 89:36 ."},{"catchword":"beraadslaagd heb,","tekst":"Of, in [mijn] raad besloten heb."}],"25":[{"catchword":"Assur","tekst":"Dat is, de Assyriërs, onder Sanherib. Anderen verstaan hier de Babyloniërs, die hier aldus genoemd worden omdat zij toen bezaten hetgeen eertijds de Assyriërs bezeten hadden, dezen onder hunne gehoorzaamheid gebracht hebbende; zie dergelijke manier van spreken Ezr 6:22 ."},{"catchword":"in Mijn land","tekst":"Te weten in het Joodse land, voor Libna, of op den tocht naar Jeruzalem; 2Ki 19:8 , 2Ki 19:35 ."},{"catchword":"Mijn bergen","tekst":"Dat is, op de bergen, die in het Joodse land, hetwelk Gods land was, liggen. Zie Psa 125:2 ."},{"catchword":"opdat","tekst":"Anders: dan zal zijn juk van hen afwijken."},{"catchword":"zijn juk","tekst":"Te weten het juk van den koning van Assyrië; dat is, de dienstbaarheid waarmede hij de Joden drukt, hen dwingende hem schatting te geven."},{"catchword":"van hen afwijke,","tekst":"Te weten van de Joden, die daar te lande woonden."},{"catchword":"zijn last","tekst":"Te weten van den koning van Assyrië."},{"catchword":"hun schouder","tekst":"Te weten van mijn volk."}],"26":[{"catchword":"beraadslaagd is","tekst":"Te weten van den Heere."},{"catchword":"over dat ganse land;","tekst":"Te weten over het land van Babylonië en deszelfs onderzaten of inwoners."},{"catchword":"over alle volken","tekst":"Te weten over al de volken, behorende onder de monarchie van den koning van Babel, die schier over alle volken en natiën heerste."}],"27":[{"catchword":"breken?","tekst":"Of, vernietigen."},{"catchword":"keren?","tekst":"Of, afwenden."},{"catchword":"*","tekst":"Eenigen eindigen hier het 14 hfdst. en zij maken een bijzonder hoofdstuk van de naastvolgende vijf verzen."}],"28":[{"catchword":"geschiedde","tekst":"Dat is, werd geopenbaard, te weten aan den profeet Jesaja, in een goddelijk gezicht."},{"catchword":"last","tekst":"Dat is, voorzegging der straf, die over de Filistijnen komen zou. Zie Isa 13:1 ."}],"29":[{"catchword":"de roede","tekst":"Versta hier door de roede of staf den koning Uzzia, 2Ch 26:6 , die den Filistijn als een slang gestoken en bezeerd heeft. De zin is: Verheugt u daarin niet, dat gij meent vrij te zijn vanwege den dood van den koning Uzzia, want uit hem zal een andere koning, [te weten, Hizkia] voortkomen, die u nog harder plagen zal."},{"catchword":"die u sloeg,","tekst":"Anders: desgenen die u sloeg."},{"catchword":"een basilisk","tekst":"Versta, den koning Hizkia, Achaz zoon, die zich tegen de Filistijnen zou stellen, als een basilisk hen meer beschadigende dan zijn grootvader Uzzia gedaan had. Zie 2Ki 18:8 ."},{"catchword":"haar","tekst":"Te weten dier slang."},{"catchword":"vrucht","tekst":"Te weten de koning Hizkia, die uit Uzzia gesproten is."},{"catchword":"een vurige vliegende draak","tekst":"Dusdanige slangen of serpenten worden er gevonden in Egypte, Lybië en elders. Zie de aantekening Num 21:6 ."}],"30":[{"catchword":"de eerstgeborenen","tekst":"Dat is, de voornaamsten onder de geringen; dat is de allerarmsten of geringsten, namelijk in het koninkrijk Juda. Zie Job 18:13 . Of versta hier door de eerstgeborenen der armen de Joden in het algemeen, die een tijdlang de ellendigsten onder de ellendigen geweest zijn. Dezen zullen ten tijde van den koning Hizkia zeker wonen en welvaren. Dit wordt te kennen gegeven door het woord weiden, gelijk Isa 5:17 ."},{"catchword":"zullen zeker","tekst":"Te weten, gelijk het vee doet, als het genoeg geweid en zich zat gegeten heeft."},{"catchword":"uw wortel","tekst":"De zin is: O gij Filistijnen, Ik zal u tot den wortel toe door den honger verdelgen, zo de ouden als de jongen, burgers en boeren."},{"catchword":"hij ombrengen","tekst":"Te weten, die basilisk, de koning Hizkia. Zie de vervulling dezer profetie 2Ki 18:8 ."}],"31":[{"catchword":"gij poort,","tekst":"Versta hier door de poort de regenten en voornaamsten der Filistijnen, die in de stadspoorten samenkwamen."},{"catchword":"gij stad","tekst":"Dat is, gij steden; te weten in het land der Filistijnen gelegen."},{"catchword":"gesmolten,","tekst":"Te weten, van schrik en vrees."},{"catchword":"van het noorden","tekst":"Dat is, uit Judea, hetwelk tegen het noorden van de Filistijnen gelegen is."},{"catchword":"een rook,","tekst":"Dat is, een krijgsheir, hetwelk doorbijten en doordringen zal als de rook; te weten Hizkia met zijn leger."},{"catchword":"er is geen eenzame","tekst":"De zin is: Daar zal zich niemand verwijderen, maar de Joden zullen u eendrachtig en met hopen aanvallen en overvallen; zij zullen gelijkelijk gereed zijn om u te overvallen."},{"catchword":"in zijn samenkomsten","tekst":"Dat is, in zijn heirleger. Anders: in zijn bestemde tijden; dat is, als die dag, dien de Heere bestemt, zal gekomen zijn, om voort te trekken."}],"32":[{"catchword":"den boden","tekst":"Of, gezanten, of ambassadeurs; en versta hier de ambassadeurs der Filistijnen, die begeren zouden dat Hizkia zou willen aflaten van hun te bekrijgen; of om te bespreken het recht dat zij voorgaven over het land van Juda te hebben; of wat recht Hizkia op hen had."},{"catchword":"Dat de HEERE","tekst":"Dat is het antwoord op de vraag."},{"catchword":"Sion","tekst":"Zie Psa 87:1 , Psa 87:5 , en Psa 102:17 ."},{"catchword":"opdat de bedrukten","tekst":"Hij wil zeggen dat God het land van Juda zijn volk tot een erfdeel gegeven heeft, en dat Hij het door zijne kracht daarin wel zal weten te handhaven en te beschermen."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"For the LORD will have mercy on Jacob, and he will yet choose Israel, and he will set them in their (own) land: [Here the Prophet giveth a reason wherefore God would destroy the Babylonians by the Medes and Persians, as is said, ch.13.to wit, that by such means he might deliver his people out of the Babylonish captivity. (For the LORD will have mercy on Jacob) that is, on the Jews that are in captivity in Babylon. (will have mercy) This is not onely to be understood of a temporal deliverance from the Babylonish captivity; but also of the spiritual deliverance of the people of God by Jesus Christ. (and he) to wit, the Lord. (will yet) or, further, henceforth. (choose Israel) that is, will yet further accept of Israel his chosen people, whom he even now called Jacob, making it really appear, that he made choice of Israel to be his own peculiar people. (and he will set them) to wit, Jacob and Israel, that is the Jews. (in their (own) land) [to wit, in the land of Juda, delivering them out of the Babylonish captivity] and the stranger shall join himself unto them, and they shall cleave to the house of Jacob. [The stranger, etc. That is, some of the Heathen or Gentiles, yea, even of the Babylonians. This is a promise concerning the calling of the Gentiles unto Christ, by the Preaching of the Gospel. See Rom.ch.11.]"}],"2":[{"catchword":null,"tekst":"And the nations shall receive them, and bring them into their place, [Or, to their place; that is, into their own Country] and the house of Israel shall possess the hereditarily in the land of the LORD, [that is, in Juda, thus called, because God had given them that land for an inheritance, and taken up his rest in the temple at Jerusalem] for servants, and for handmaids: and they shall rule over their drivers (or oppressors) [This was first accomplished, when certain nations among the Heathen afforded all possible aid and service unto the Jews, when they returned out of captivity unto Jerusalem, Ezra.1.6. and afterward, when many heathen were by the believing Jews (by the Apostles, their fellow-helpers and followers) brought to the obedience of the Gospel, and to the fellowship of the Christian Church. See above, ch.11.v.14. and below, ch.66.v.20. (and the house of Israel shall possess them hereditarily, etc.) that is, the Israelites shall have the nations so under their authority and command, as if they were their servant and bondmen. But this to be meant of a voluntary or willing serviceableness, proceeding from thence, that the strangers should embrace the religion of the Jews, and afterward the Christian Religion. (In the land of the LORD,) that is, in Juda; which is so called, because the LORD had given the Jews that land for an inheritance, and because he had taken up his rest in the temple at Jerusalem. (and they shall keep those captives, or prisoners, that kept them Prisoners, etc.) This was accomplished, when the Gentiles by the Preaching of the Apostles were brought in subjection unto Christ. See 2 Cor.v.5,6.]"}],"3":[{"catchword":null,"tekst":"And it shall come to pass in the day, when the LORD shall give thee [Namely, O my people of Israel] rest from thy sorrow, and from thy commotion, and from the hard bondage, wherein thou wast made to serve: [See Deut.28.48.]"}],"4":[{"catchword":null,"tekst":"Then shalt thou take up [That is, use, take into thy mouth, as Psal.50.16.] This proverb against [or, of, or, concerning] the King of Babel, and say, how doth the Driver (or, Oppressor) [that is, that tyrant, that cruel ruler] cease? [As if they should say, how is it possible, that so mighty and so great a Kingdom should be ruined and destroyed in one night? From this place unto the 21th. Verse, are described the joyful words of the people of God, concerning the ruine and destruction of the Babylonians] how doth the Golden one cease? [understand here by the golden, the City of Babel, which was rich and stately, the garments and household-stuff of her inhabitants glistering of gold and silver. See Dan.chap.2. and chap.3. Oth. The gold-thristy, or the gold-exacting. It cometh from a Chaldee word, which signifieth gold. The Prophet mocketh at Babel, the Chief City of Chaldea, in a word taken from the Chaldee tongue.]"}],"5":[{"catchword":null,"tekst":"The LORD (function bouwHfdnav() {

  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |

  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +

    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +

  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte

function bereaHtml(n) {

  return md(D.vertalingen.SVnu[n] || '—');
}

    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
