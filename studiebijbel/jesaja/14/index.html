adden, maar gaven zichzelf eerst aan de Heere en daarna aan ons, door de wil van God.", "Jes 57:14": "En men zal zeggen: Verhoog de weg, verhoog de weg, bereid de weg, neem de struikelblokken weg uit de weg van Mijn volk.", "Zach 8:22": "Zo zullen veel volken, en machtige heidenvolken komen, om de HEERE van de heerscharen te Jeruzalem te zoeken, en om het aangezicht van de HEERE te smeken.", "1 Tim 6:19": "en zo voor zichzelf een schat wegleggen, een goed fundament voor de toekomst, opdat zij het eeuwige leven verkrijgen mogen.", "Ps 74:2": "Denk aan Uw vergadering, die U vanouds verworven hebt; de roede van Uw erfenis, die U verlost hebt; de berg Sion, waar U gewoond hebt.", "Jes 2:4": "En Hij zal rechtspreken onder de heidenvolken, en bestraffen veel volken; en zij zullen hun zwaarden slaan tot spaden, en hun speren tot snoeimessen; het ene volk zal tegen het andere volk geen zwaard opheffen, en zij zullen geen oorlog meer leren.", "Hebr 2:18": "Want doordat Hij Zelf, beproefd zijnde, geleden heeft, kan Hij hun die beproefd worden, te hulp komen.", "Klaagl 3:37": "Mem. Wie zegt iets, en het gebeurt, als de Heere het niet beveelt?", "Ezech 4:17": "Opdat zij gebrek hebben aan brood en water, en de een met de ander verbaasd worden, en in hun ongerechtigheid wegkwijnen.", "Spr 21:31": "Het paard wordt bereid tegen de dag van het strijd; maar de overwinning is van de HEERE.", "Micha 7:4": "De beste van hen is als een doorn; de oprechtste is scherper dan een doornheg; de dag van uw wachters, uw bezoeking, is gekomen; nu zal hun verwarring zijn.", "Ps 79:11": "Laat het gekerm van de gevangenen voor Uw aangezicht komen; behoud, naar de grootheid van Uw arm, hen die tot de dood bestemd zijn.", "Jes 47:7-10": "En u zei: Ik zal koningin zijn in eeuwigheid; tot nog toe hebt u deze dingen niet in uw hart genomen, u hebt aan het einde daarvan niet gedacht. Nu dan, hoor dit, weelderige! Die zo zeker woont, die in haar hart zegt: Ik ben het, en niemand meer dan ik: ik zal geen weduwe zitten, en de beroving van kinderen niet kennen. Toch zullen deze beide dingen u in een ogenblik overkomen, op één dag, de beroving van kinderen en weduwschap; volkomen zullen zij u overkomen, vanwege de veelheid van uw toverijen, vanwege de grote menigte van uw bezweringen.", "Rom 12:12": "Verblijd u in de hoop. Wees geduldig in de verdrukking. Volhard in het gebed.", "Ezech 45:9": "Zo zegt de Heere HEERE: Het is genoeg voor u, vorsten van Israël! Doe geweld en verwoesting weg, en doe recht en gerechtigheid; neem uw uitstotingen weg van Mijn volk, spreekt de Heere HEERE.", "Mark 12:26": "Maar wat de doden betreft, dat zij opgewekt zullen worden: hebt u niet gelezen in het boek van Mozes, hoe God in de doornstruik tot hem gesproken heeft: Ik ben de God van Abraham, en de God van Izak, en de God van Jakob?", "Luk 14:8": "Wanneer u door iemand op een bruiloft genodigd wordt, ga dan niet op de eerste plaats zitten; anders zou misschien iemand die voornamer is dan u door hem genodigd zijn,", "Jes 5:8": "Wee hun die huis aan huis trekken, akker aan akker brengen, totdat er geen plaats meer is, en u alleen wonend achterblijft in het midden van het land!", "2 Kron 25:18": "Maar Joas, de koning van Israël, zond tot Amazia, de koning van Juda, om te zeggen: De distel die op de Libanon is, zond tot de ceder die op de Libanon is, om te zeggen: Geef uw dochter aan mijn zoon tot vrouw; maar het gedierte van het veld, dat op de Libanon is, kwam voorbij, en vertrapte de distel.", "Dan 4:10-26": "De visioenen van mijn hoofd op mijn bed waren deze: ik zag, en zie, er was een boom in het midden van de aarde, en zijn hoogte was groot. De boom werd groot en sterk; en zijn hoogte reikte aan de hemel, en hij werd gezien tot aan het einde van de hele aarde; Zijn loof was mooi, en zijn vruchten veel, en er was voedsel aan voor allen; onder hem vond het gedierte van het veld schaduw, en de vogels van de hemel woonden in zijn takken, en alle vlees werd daarvan gevoed.", "Ezech 28:8": "Naar de groeve zullen zij u doen neerdalen; en u zult sterven de dood van een verslagene, in het hart van de zeeën.", "Rom 8:28": "En wij weten dat voor hen die God liefhebben, alle dingen meewerken ten goede, namelijk voor hen die naar Zijn voornemen geroepen zijn.", "Ps 104:33": "Ik zal de HEERE zingen in mijn leven; ik zal mijn God psalmzingen, zolang ik nog ben.", "Ps 34:23": "De HEERE verlost de ziel van Zijn knechten; en allen die op Hem vertrouwen, zullen niet schuldig verklaard worden.", "Jes 39:1": "In die tijd stuurde Merodach-Baladan, de zoon van Baladan, de koning van Babel, brieven en een geschenk aan Hizkia; want hij had gehoord dat hij ziek was geweest en weer sterk geworden was.", "Job 37:24": "Daarom vrezen de mensen Hem; Hij ziet geen enkele wijze van hart aan.", "Jes 65:5": "Die daar zeggen: Houd u tot uzelf, en kom niet bij mij, want ik ben heiliger dan u. Deze zijn een rook in Mijn neus, een vuur, dat de hele dag brandt.", "Matt 5:4": "Zalig zijn zij die treuren, want zij zullen vertroost worden.", "Ezech 39:25-29": "Daarom zegt de Heere HEERE zo: Nu zal Ik de gevangenen van Jakob terugbrengen, en Ik zal Mij ontfermen over heel het huis van Israël, en Ik zal ijveren voor Mijn heilige Naam; wanneer zij hun schande zullen gedragen hebben, en al hun overtreding waarmee zij tegen Mij hebben overtreden, toen zij veilig in hun land woonden, en er niemand was die hen schrik aanjoeg. Wanneer Ik hen zal hebben teruggebracht uit de volken, en hen zal hebben verzameld uit de landen van hun vijanden, en Ik aan hen geheiligd zal zijn voor de ogen van veel heidenen;", "Klaagl 5:5": "Wij worden vervolgd, met een juk op onze nek; zijn wij moe, men laat ons geen rust.", "Ps 14:6": "U beschaamt de raad van de ellendige, omdat de HEERE zijn Toevlucht is.", "Jes 26:19": "Uw doden zullen leven, ook mijn dode lichaam, zij zullen opstaan; waak op en juich, u die in het stof woont! Want uw dauw zal zijn als een dauw van de moeskruiden, en het land zal de overledenen uitwerpen.", "Obadja 1:3": "De trots van uw hart heeft u bedrogen; u die woont in de kloven van de rotsen, in uw hoge woning; die in uw hart zegt: Wie zou mij ter aarde neerstoten?", "Ps 40:5": "Gelukkig is de man die de HEERE tot zijn vertrouwen stelt, en niet omziet naar de hoogmoedigen, en die tot leugen afwijken.", "Luk 1:52": "Hij heeft machtigen van de tronen afgezet, en nederigen heeft Hij verhoogd.", "Gen 15:14": "Maar Ik zal ook het volk rechten dat zij zullen dienen; en daarna zullen zij uittrekken met veel bezit.", "Ps 137:1-6": "Aan de rivieren van Babel, daar zaten wij, ook weenden wij, als wij dachten aan Sion. Wij hebben onze harpen gehangen aan de wilgen, die daar zijn. Toen zij die ons daar gevangen hielden, de woorden van een lied van ons vroegen, en zij die ons overhoop hadden geworpen, vreugde, en zeiden: Zingt ons een van de liederen van Sion;", "Jer 8:1": "In die tijd, spreekt de HEERE, zullen ze de beenderen van de koningen van Juda, en de beenderen van hun vorsten, en de beenderen van de priesters, en de beenderen van de profeten, en de beenderen van de inwoners van Jeruzalem, uit hun graven halen.", "Amos 9:9": "Want zie, Ik geef bevel, en Ik zal het huis van Israël onder alle heidenvolken schudden, zoals graan geschud wordt in een zeef; en niet één steentje zal er op de aarde vallen.", "Deut 7:21": "Schrik niet terug voor hen; want de HEERE, uw God, is in uw midden, een groot en ontzagwekkend God.", "Job 10:12": "Naast het leven hebt U goedertierenheid aan mij bewezen, en Uw zorg heeft mijn geest bewaard.", "1 Kor 13:4": "De liefde is geduldig, zij is vriendelijk; de liefde is niet afgunstig; de liefde handelt niet lichtvaardig, zij is niet opgeblazen;", "Job 38:8": "Of wie heeft de zee met deuren toegesloten, toen zij uitbrak, en uit de baarmoeder voortkwam?", "Luk 1:73": "en aan de eed die Hij Abraham, onze vader, gezworen heeft, om ons te geven", "Jer 9:23": "Zo zegt de HEERE: Een wijze beroemt zich niet op zijn wijsheid, en de sterke beroemt zich niet op zijn sterkte; een rijke beroemt zich niet op zijn rijkdom;", "Amos 5:17": "Ja, in alle wijngaarden zal rouwklacht zijn; want Ik zal door uw midden trekken, zegt de HEERE.", "Jer 16:15": "Maar: Zo waarachtig als de HEERE leeft, Die de kinderen van Israël heeft opgevoerd uit het land van het noorden, en uit al de landen waarheen Hij hen gedreven had! Want Ik zal hen terugbrengen in hun land, dat Ik hun vaderen gegeven heb.", "Ex 17:7": "En hij noemde die plaats Massa en Meriba, vanwege de ruzie van de kinderen van Israël, en omdat zij de HEERE op de proef gesteld hadden door te zeggen: Is de HEERE in ons midden, of niet?", "1 Sam 6:18": "Ook gouden muizen, naar het aantal van alle steden van de Filistijnen onder de vijf vorsten, van de versterkte steden af tot aan de dorpen zonder muur; en tot aan Abel, de grote steen, waarop zij de ark van de HEERE neergezet hadden, die tot op deze dag op de akker van Jozua, de Beth-Semiet, is.", "Jes 60:16": "En u zult de melk van de heidenen zuigen, en u zult de borsten van de koningen zuigen; en u zult weten dat Ik de HEERE ben, uw Heiland, en uw Verlosser, de Machtige van Jakob.", "Ef 4:8": "Daarom zegt Hij: Toen Hij opgevaren is in de hoogte, heeft Hij de gevangenis gevangengenomen, en heeft Hij de mensen gaven gegeven."}, "noten": {"1": "D.i. legermachten"}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H3290\">Want</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H3290\">de</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H3290\">HEERE</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H3290\">zal</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H3290\">Zich</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H3290\">over</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H3290\">Jakob</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H7355\">ontfermen</span>, <span class=\"wl\" data-l=\"L3\" data-code=\"H3478\">en</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H3478\">Hij</ ">Israel</span> shall <span class=\"wl wl-kjv\" data-code=\"H5157\">possess</span> them in the <span class=\"wl wl-kjv\" data-code=\"H127\">land</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> for <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> and <span class=\"wl wl-kjv\" data-code=\"H8198\">handmaids:</span> and they shall take them <span class=\"wl wl-kjv\" data-code=\"H7617\">captives,</span> whose <span class=\"wl wl-kjv\" data-code=\"H7617\">captives</span> they were; and they shall <span class=\"wl wl-kjv\" data-code=\"H7287\">rule</span> over their oppressors.", "3": "And it shall come to pass in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall give thee <span class=\"wl wl-kjv\" data-code=\"H5117\">rest</span> from thy <span class=\"wl wl-kjv\" data-code=\"H6090\">sorrow,</span> and from thy <span class=\"wl wl-kjv\" data-code=\"H7267\">fear,</span> and from the <span class=\"wl wl-kjv\" data-code=\"H7186\">hard</span> <span class=\"wl wl-kjv\" data-code=\"H5656\">bondage</span> wherein thou wast made to serve,", "4": "That thou shalt take <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> this <span class=\"wl wl-kjv\" data-code=\"H4912\">proverb</span> against the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> How hath the <span class=\"wl wl-kjv\" data-code=\"H5065\">oppressor</span> <span class=\"wl wl-kjv\" data-code=\"H7673\">ceased!</span> the golden <span class=\"wl wl-kjv\" data-code=\"H4062\">city</span> ceased!", "5": "The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H7665\">broken</span> the <span class=\"wl wl-kjv\" data-code=\"H4294\">staff</span> of the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7626\">sceptre</span> of the rulers.", "6": "He who <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> in <span class=\"wl wl-kjv\" data-code=\"H5678\">wrath</span> with a <span class=\"wl wl-kjv\" data-code=\"H1115\">continual</span> <span class=\"wl wl-kjv\" data-code=\"H4347\">stroke,</span> he that <span class=\"wl wl-kjv\" data-code=\"H7287\">ruled</span> the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> in <span class=\"wl wl-kjv\" data-code=\"H639\">anger,</span> is <span class=\"wl wl-kjv\" data-code=\"H4783\">persecuted,</span> and <span class=\"wl wl-kjv\" data-code=\"H1097\">none</span> hindereth.", "7": "The whole <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> is at <span class=\"wl wl-kjv\" data-code=\"H5117\">rest,</span> and is <span class=\"wl wl-kjv\" data-code=\"H8252\">quiet:</span> they break <span class=\"wl wl-kjv\" data-code=\"H6476\">forth</span> into singing.", "8": "Yea, the fir <span class=\"wl wl-kjv\" data-code=\"H1265\">trees</span> <span class=\"wl wl-kjv\" data-code=\"H8055\">rejoice</span> at thee, and the <span class=\"wl wl-kjv\" data-code=\"H730\">cedars</span> of <span class=\"wl wl-kjv\" data-code=\"H3844\">Lebanon,</span> saying, Since thou art laid <span class=\"wl wl-kjv\" data-code=\"H7901\">down,</span> no <span class=\"wl wl-kjv\" data-code=\"H3772\">feller</span> is come up", "9": "<span class=\"wl wl-kjv\" data-code=\"H7585\">Hell</span> from beneath is <span class=\"wl wl-kjv\" data-code=\"H7264\">moved</span> for thee to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> thee at thy <span class=\"wl wl-kjv\" data-code=\"H935\">coming:</span> it stirreth <span class=\"wl wl-kjv\" data-code=\"H5782\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H7496\">dead</span> for thee, even all the chief <span class=\"wl wl-kjv\" data-code=\"H6260\">ones</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth;</span> it hath raised <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> from their <span class=\"wl wl-kjv\" data-code=\"H3678\">thrones</span> all the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of the nations.", "10": "All they shall <span class=\"wl wl-kjv\" data-code=\"H6030\">speak</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto thee, Art thou also become <span class=\"wl wl-kjv\" data-code=\"H2470\">weak</span> as we? art thou become like", "11": "Thy <span class=\"wl wl-kjv\" data-code=\"H1347\">pomp</span> is brought <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to the <span class=\"wl wl-kjv\" data-code=\"H7585\">grave,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1998\">noise</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5035\">viols:</span> the <span class=\"wl wl-kjv\" data-code=\"H7415\">worm</span> is <span class=\"wl wl-kjv\" data-code=\"H3331\">spread</span> under thee, and the <span class=\"wl wl-kjv\" data-code=\"H8438\">worms</span> cover", "12": "How art thou <span class=\"wl wl-kjv\" data-code=\"H5307\">fallen</span> from <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> O <span class=\"wl wl-kjv\" data-code=\"H1966\">Lucifer,</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of the <span class=\"wl wl-kjv\" data-code=\"H7837\">morning!</span> how art thou cut <span class=\"wl wl-kjv\" data-code=\"H1438\">down</span> to the <span class=\"wl wl-kjv\" data-code=\"H776\">ground,</span> which didst <span class=\"wl wl-kjv\" data-code=\"H2522\">weaken</span> the nations!", "13": "For thou hast <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> in thine <span class=\"wl wl-kjv\" data-code=\"H3824\">heart,</span> I will <span class=\"wl wl-kjv\" data-code=\"H5927\">ascend</span> into <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> I will <span class=\"wl wl-kjv\" data-code=\"H7311\">exalt</span> my <span class=\"wl wl-kjv\" data-code=\"H3678\">throne</span> <span class=\"wl wl-kjv\" data-code=\"H4605\">above</span> the <span class=\"wl wl-kjv\" data-code=\"H3556\">stars</span> of <span class=\"wl wl-kjv\" data-code=\"H410\">God:</span> I will <span class=\"wl wl-kjv\" data-code=\"H3427\">sit</span> also upon the <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> of the <span class=\"wl wl-kjv\" data-code=\"H4150\">congregation,</span> in the <span class=\"wl wl-kjv\" data-code=\"H3411\">sides</span> of the north:", "14": "I will <span class=\"wl wl-kjv\" data-code=\"H5927\">ascend</span> above the <span class=\"wl wl-kjv\" data-code=\"H1116\">heights</span> of the <span class=\"wl wl-kjv\" data-code=\"H5645\">clouds;</span> I will be <span class=\"wl wl-kjv\" data-code=\"H1819\">like</span> the most High.", "15": "Yet thou shalt be brought <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to <span class=\"wl wl-kjv\" data-code=\"H7585\">hell,</span> to the <span class=\"wl wl-kjv\" data-code=\"H3411\">sides</span> of the pit.", "16": "They that <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> thee shall narrowly <span class=\"wl wl-kjv\" data-code=\"H7688\">look</span> upon thee, and <span class=\"wl wl-kjv\" data-code=\"H995\">consider</span> thee, saying, Is this the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> that made the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> to <span class=\"wl wl-kjv\" data-code=\"H7264\">tremble,</span> that did <span class=\"wl wl-kjv\" data-code=\"H7493\">shake</span> kingdoms;", "17": "That <span class=\"wl wl-kjv\" data-code=\"H7760\">made</span> the <span class=\"wl wl-kjv\" data-code=\"H8398\">world</span> as a <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness,</span> and <span class=\"wl wl-kjv\" data-code=\"H2040\">destroyed</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> thereof; that <span class=\"wl wl-kjv\" data-code=\"H6605\">opened</span> not the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of his prisoners?", "18": "All the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations,</span> even all of them, <span class=\"wl wl-kjv\" data-code=\"H7901\">lie</span> in <span class=\"wl wl-kjv\" data-code=\"H3519\">glory,</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> in his own house.", "19": "But thou art cast <span class=\"wl wl-kjv\" data-code=\"H7993\">out</span> of thy <span class=\"wl wl-kjv\" data-code=\"H6913\">grave</span> like an <span class=\"wl wl-kjv\" data-code=\"H8581\">abominable</span> <span class=\"wl wl-kjv\" data-code=\"H5342\">branch,</span> and as the <span class=\"wl wl-kjv\" data-code=\"H3830\">raiment</span> of those that are <span class=\"wl wl-kjv\" data-code=\"H2026\">slain,</span> thrust <span class=\"wl wl-kjv\" data-code=\"H2944\">through</span> with a <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> that go <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to the <span class=\"wl wl-kjv\" data-code=\"H68\">stones</span> of the <span class=\"wl wl-kjv\" data-code=\"H953\">pit;</span> as a <span class=\"wl wl-kjv\" data-code=\"H6297\">carcase</span> trodden under feet.", "20": "Thou shalt not be <span class=\"wl wl-kjv\" data-code=\"H3161\">joined</span> with them in <span class=\"wl wl-kjv\" data-code=\"H6900\">burial,</span> because thou hast <span class=\"wl wl-kjv\" data-code=\"H7843\">destroyed</span> thy <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and <span class=\"wl wl-kjv\" data-code=\"H2026\">slain</span> thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people:</span> the <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> of <span class=\"wl wl-kjv\" data-code=\"H7489\">evildoers</span> shall <span class=\"wl wl-kjv\" data-code=\"H5769\">never</span> be renowned.", "21": "<span class=\"wl wl-kjv\" data-code=\"H3559\">Prepare</span> <span class=\"wl wl-kjv\" data-code=\"H4293\">slaughter</span> for his <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> for the <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity</span> of their <span class=\"wl wl-kjv\" data-code=\"H1\">fathers;</span> that they do <span class=\"wl wl-kjv\" data-code=\"H1077\">not</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">rise,</span> nor <span class=\"wl wl-kjv\" data-code=\"H3423\">possess</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> nor <span class=\"wl wl-kjv\" data-code=\"H4390\">fill</span> the <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> of the <span class=\"wl wl-kjv\" data-code=\"H8398\">world</span> with <span class=\"wl wl-kjv\" data-code=\"H6145\">cities.</span>", "22": "For I will rise <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> against them, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> and cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> from <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> the <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> and <span class=\"wl wl-kjv\" data-code=\"H7605\">remnant,</span> and <span class=\"wl wl-kjv\" data-code=\"H5209\">son,</span> and <span class=\"wl wl-kjv\" data-code=\"H5220\">nephew,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.", "23": "I will also <span class=\"wl wl-kjv\" data-code=\"H7760\">make</span> it a <span class=\"wl wl-kjv\" data-code=\"H4180\">possession</span> for the <span class=\"wl wl-kjv\" data-code=\"H7090\">bittern,</span> and <span class=\"wl wl-kjv\" data-code=\"H98\">pools</span> of <span class=\"wl wl-kjv\" data-code=\"H4325\">water:</span> and I will <span class=\"wl wl-kjv\" data-code=\"H2894\">sweep</span> it with the <span class=\"wl wl-kjv\" data-code=\"H4292\">besom</span> of <span class=\"wl wl-kjv\" data-code=\"H8045\">destruction,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of hosts.", "24": "The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts</span> hath <span class=\"wl wl-kjv\" data-code=\"H7650\">sworn,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Surely as I have <span class=\"wl wl-kjv\" data-code=\"H1819\">thought,</span> so shall it come to pass; and as I have <span class=\"wl wl-kjv\" data-code=\"H3289\">purposed,</span> so shall it stand:", "25": "That I will <span class=\"wl wl-kjv\" data-code=\"H7665\">break</span> the <span class=\"wl wl-kjv\" data-code=\"H804\">Assyrian</span> in my <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and upon my <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains</span> tread him under <span class=\"wl wl-kjv\" data-code=\"H947\">foot:</span> then shall his <span class=\"wl wl-kjv\" data-code=\"H5923\">yoke</span> <span class=\"wl wl-kjv\" data-code=\"H5493\">depart</span> from off them, and his <span class=\"wl wl-kjv\" data-code=\"H5448\">burden</span> <span class=\"wl wl-kjv\" data-code=\"H5493\">depart</span> from off their shoulders.", "26": "This is the <span class=\"wl wl-kjv\" data-code=\"H6098\">purpose</span> that is <span class=\"wl wl-kjv\" data-code=\"H3289\">purposed</span> upon the whole <span class=\"wl wl-kjv\" data-code=\"H776\">earth:</span> and this is the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> that is stretched <span class=\"wl wl-kjv\" data-code=\"H5186\">out</span> upon all the nations.", "27": "For the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts</span> hath <span class=\"wl wl-kjv\" data-code=\"H3289\">purposed,</span> and who shall <span class=\"wl wl-kjv\" data-code=\"H6565\">disannul</span> it? and his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> is stretched <span class=\"wl wl-kjv\" data-code=\"H5186\">out,</span> and who shall turn it back?", "28": "In the <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> that <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H271\">Ahaz</span> <span class=\"wl wl-kjv\" data-code=\"H4194\">died</span> was this burden.", "29": "<span class=\"wl wl-kjv\" data-code=\"H8055\">Rejoice</span> not thou, whole <span class=\"wl wl-kjv\" data-code=\"H6429\">Palestina,</span> because the <span class=\"wl wl-kjv\" data-code=\"H7626\">rod</span> of him that <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> thee is <span class=\"wl wl-kjv\" data-code=\"H7665\">broken:</span> for out of the <span class=\"wl wl-kjv\" data-code=\"H5175\">serpent's</span> <span class=\"wl wl-kjv\" data-code=\"H8328\">root</span> shall come <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> a <span class=\"wl wl-kjv\" data-code=\"H6848\">cockatrice,</span> and his <span class=\"wl wl-kjv\" data-code=\"H6529\">fruit</span> shall be a <span class=\"wl wl-kjv\" data-code=\"H8314\">fiery</span> <span class=\"wl wl-kjv\" data-code=\"H5774\">flying</span> serpent.", "30": "And the <span class=\"wl wl-kjv\" data-code=\"H1060\">firstborn</span> of the <span class=\"wl wl-kjv\" data-code=\"H1800\">poor</span> shall <span class=\"wl wl-kjv\" data-code=\"H7462\">feed,</span> and the <span class=\"wl wl-kjv\" data-code=\"H34\">needy</span> shall lie <span class=\"wl wl-kjv\" data-code=\"H7257\">down</span> in <span class=\"wl wl-kjv\" data-code=\"H983\">safety:</span> and I will <span class=\"wl wl-kjv\" data-code=\"H4191\">kill</span> thy <span class=\"wl wl-kjv\" data-code=\"H8328\">root</span> with <span class=\"wl wl-kjv\" data-code=\"H7458\">famine,</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H2026\">slay</span> thy remnant.", "31": "<span class=\"wl wl-kjv\" data-code=\"H3213\">Howl,</span> O <span class=\"wl wl-kjv\" data-code=\"H8179\">gate;</span> <span class=\"wl wl-kjv\" data-code=\"H2199\">cry,</span> O <span class=\"wl wl-kjv\" data-code=\"H5892\">city;</span> thou, whole <span class=\"wl wl-kjv\" data-code=\"H6429\">Palestina,</span> art <span class=\"wl wl-kjv\" data-code=\"H4127\">dissolved:</span> for there shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> from the <span class=\"wl wl-kjv\" data-code=\"H6828\">north</span> a <span class=\"wl wl-kjv\" data-code=\"H6227\">smoke,</span> and none shall be <span class=\"wl wl-kjv\" data-code=\"H909\">alone</span> in his appointed times.", "32": "What shall one then <span class=\"wl wl-kjv\" data-code=\"H6030\">answer</span> the <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> of the <span class=\"wl wl-kjv\" data-code=\"H1471\">nation?</span> That the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H3245\">founded</span> <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6041\">poor</span> of his <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> shall trust"}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
