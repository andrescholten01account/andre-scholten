oeg in verbolgenheid met een plaag zonder ophouden, die in toorn over de heidenvolken heerste, wordt vervolgd, zonder dat iemand het kan afweren.", "7": "De hele aarde rust, ze is stil; ze maken luid geschal met gejuich.", "8": "Ook verheugen de dennen zich over u, *en* de ceders van Libanon, *en zeggen*: Sinds u daar neerligt, komt niemand tegen ons op die ons afhouwt.", "9": "Het rijk van de dood van onderen is beroerd om uwentwil, om *u* tegemoet te gaan, toen u kwam; het wekt om uwentwil de doden op, al de bokken van de aarde; het doet al de koningen van de heidenvolken van hun tronen opstaan.", "10": "Die allemaal zullen antwoorden, en tegen u zeggen: Bent u ook zwak geworden, zoals wij, bent u ons gelijk geworden?", "11": "Uw hoogmoed is in het rijk van de dood neergestort, *met* het geschal van uw luiten; de maden zullen onder u gestrooid worden, en de wormen zullen u bedekken.", "12": "Hoe bent u uit de hemel gevallen, o morgenster, u zoon van het dageraad! *hoe* bent u ter aarde neergehouwen, u die de heidenvolken verzwakte!", "13": "En u zei in uw hart: Ik zal ten hemel opklimmen, ik zal mijn troon boven de sterren van God verhogen; en ik zal mij zetten op de berg van de samenkomst aan de zijden van het noorden.", "14": "Ik zal boven de hoogten van de wolken klimmen, ik zal de Allerhoogste gelijk worden.", "15": "Ja, in het rijk van de dood zult u neergestoten worden, aan de zijden van de kuil!", "16": "Wie u zullen zien, zullen u aanschouwen, ze zullen op u letten, *en zeggen*: Is dat die man, die de aarde deed beroeren, die de koninkrijken deed beven?", "17": "Die de wereld als een woestijn stelde, en daarvan de steden verstoorde, die zijn gevangenen niet liet gaan naar huis toe?", "18": "Al de koningen van de heidenvolken, zij liggen allemaal neer met eer, ieder in zijn huis;", "19": "maar u bent verworpen van uw graf, als een gruwelijke scheut, *als* een kleed van de gedoden, die met het zwaard doorstoken zijn; *als* wie neerdalen in een steenkuil, als een vertreden dood lichaam.", "20": "U zult niet bij hen gevoegd worden in de begrafenis; want u hebt uw land verdorven, *en* uw volk gedood; het nageslacht van de boosdoeners zal in eeuwigheid niet genoemd worden.", "21": "Maak de slachting voor zijn kinderen gereed, om de ongerechtigheid van hun vaderen; opdat zij niet opstaan, en de aarde erven, en de wereld vervullen met steden;", "22": "want Ik zal tegen hen opstaan, spreekt de HEERE van de heerscharen[1], en Ik zal van Babel de naam en het overblijfsel uitroeien, en de zoon en de kleinzoon, spreekt de HEERE.", "23": "En Ik zal hen stellen tot een erfbezit van de nachtuilen, en *tot* waterpoelen; en Ik zal hen met een bezem van het verderf wegvegen, spreekt de HEERE van de heerscharen.", "24": "De HEERE van de heerscharen heeft gezworen: Voorzeker, zoals Ik gedacht heb, zo zal het gebeuren, en zoals Ik beraadslaagd heb, zo zal het bestaan!", "25": "Dat Ik Assur in Mijn land zal verbreken, en hem op Mijn bergen vertreden; opdat zijn juk van hen afwijkt, en zijn last van hun schouder wijkt.", "26": "Dit is de raadslag, die beraadslaagd is over dat hele land; en dit is de hand, die uitgestrekt is over alle volken.", "27": "Want de HEERE van de heerscharen heeft het in Zijn raad besloten, wie zal het dan verbreken? en Zijn hand is uitgestrekt, wie zal die dan keren?", "28": "In het jaar dat koning Achaz stierf, gebeurde deze last.", "29": "Verheug u niet, u helemaal Palestina! dat de roede die u sloeg, gebroken is; want uit de wortel van de slang zal een basilisk voortkomen, en haar vrucht zal een vurige vliegende draak zijn.", "30": "En de eerstgeborenen van de armen zullen weiden, en de behoeftigen zullen zeker neerliggen; uw wortel daarentegen zal Ik door de honger doden, en uw overblijfsel zal hij ombrengen.", "31": "Huil, u poort, schreeuw, u stad! u bent gesmolten, u helemaal Palestina! want van het noorden komt een rook, en er is geen eenzame in zijn samenkomsten.", "32": "Wat zal men dan antwoorden aan de boden van het volk? Dat de HEERE Sion gegrond heeft, opdat de bedrukten van Zijn volk daarin een toevlucht zouden hebben."}, "SV": {"1": "Want de HEERE zal Zich over Jakob ontfermen, en Hij zal Israël nog verkiezen, en Hij zal hen in hun land zetten; en de vreemdeling zal zich tot hen vervoegen, en zij zullen het huis van Jakob aanhangen.", "2": "En de volken zullen hen aannemen, en in hun plaats brengen; en het huis Israëls zal hen erfelijk bezitten in het land des HEEREN tot knechten en tot maagden; en zij zullen gevangen houden degenen, die hen gevangen hielden, en zij zullen heersen over hun drijvers.", "3": "En het zal geschieden ten dage, wanneer u de HEERE rust geven zal van uw smart, en van uw beroering, en van de harde dienstbaarheid, waarin men u heeft doen dienen;", "4": "Dan zult gij deze spreuk opnemen tegen den koning van Babel, en zeggen: Hoe houdt de drijver op? *Hoe* houdt de goudene op?", "5": "De HEERE heeft den stok der goddelozen gebroken, den scepter der heersers.", "6": "Die de volken plaagde in verbolgenheid met een plaag zonder ophouden, die in toorn over de heidenen heerste, die wordt vervolgd, zonder dat het iemand afweren kan.", "7": "De ganse aarde rust, zij is stil; zij maken groot geschal met gejuich.", "8": "Ook verheugen zich de dennen over u, *en* de cederen van Libanon, *zeggende*: Sinds dat gij daar nederligt, komt niemand tegen ons op, die ons afhouwe.", "9": "De hel van onderen was beroerd om uwentwil, om *u* tegemoet te gaan, als gij kwaamt; zij wekt om uwentwil de doden op, al de bokken der aarde; zij doet al de koningen der heidenen van hun tronen opstaan.", "10": "Die altegader zullen antwoorden, en tot u zeggen: Gij zijt ook krank geworden, gelijk wij, gij zijt ons gelijk geworden.", "11": "Uw hovaardij is in de hel nedergestort, *met* het geklank uwer luiten; de maden zullen onder u gestrooid worden, en de wormen zullen u bedekken.", "12": "Hoe zijt gij uit den hemel gevallen, o morgenster, gij zoon des dageraads! *hoe* zijt gij ter aarde nedergehouwen, gij, die de heidenen krenktet!", "13": "En zeidet in uw hart: Ik zal ten hemel opklimmen, ik zal mijn troon boven de sterren Gods verhogen; en ik zal mij zetten op den berg der samenkomst aan de zijden van het noorden.", "14": "Ik zal boven de hoogten der wolken klimmen, ik zal den Allerhoogste gelijk worden.", "15": "Ja, in de hel zult gij nedergestoten worden, aan de zijden van den kuil!", "16": "Die u zien zullen, zullen u aanschouwen, zij zullen op u letten, *en* *zeggen*: Is dat die man, die de aarde beroerde, die de koninkrijken deed beven?", "17": "Die de wereld als een woestijn stelde, en derzelver steden verstoorde, die zijn gevangenen niet liet los *gaan* naar huis toe?", "18": "Al de koningen der heidenen, zij allen liggen neder met eer, een iegelijk in zijn huis;", "19": "Maar gij zijt verworpen van uw graf, als een gruwelijke scheut, *als* een kleed der gedoden, die met het zwaard doorstoken zijn; *als* die nederdalen in een steenkuil, als een vertreden dood lichaam.", "20": "Gij zult bij dezelve niet gevoegd worden in de begrafenis; want gij hebt uw land verdorven, *en* uw volk gedood; het zaad der boosdoeners zal in der eeuwigheid niet genoemd worden.", "21": "Maakt de slachting voor zijn kinderen gereed, om hunner vaderen ongerechtigheid wil; dat zij niet opstaan, en de aarde erven, en de wereld vervullen met steden;", "22": "Want Ik zal tegen hen opstaan, spreekt de HEERE der heirscharen, en Ik zal van Babel uitroeien den naam en het overblijfsel, en den zoon en den zoonszoon, spreekt de HEERE.", "23": "En Ik zal hen stellen tot een erve der nachtuilen, en *tot* waterpoelen; en Ik zal hen met een bezem des verderfs uitvagen, spreekt de HEERE der heirscharen.", "24": "De HEERE der heirscharen heeft gezworen, zeggende: Indien niet, gelijk Ik gedacht heb, het alzo geschiede, en gelijk Ik beraadslaagd heb, het bestaan zal!", "25": "Dat Ik Assur in Mijn land zal verbreken, en hem op Mijn bergen vertreden; opdat zijn juk van hen afwijke, en zijn last van hun schouder wijke.", "26": "Dit is de raadslag, die beraadslaagd is over dat ganse land; en dit is de hand, die uitgestrekt is over alle volken.", "27": "Want de HEERE der heirscharen heeft het in Zijn raad besloten, wie zal het dan verbreken? en Zijn hand is uitgestrekt, wie zal ze dan keren?", "28": "In het jaar, toen de koning Achaz stierf, geschiedde deze last.", "29": "Verheug u niet, gij gans Palestina! dat de roede die u sloeg, gebroken is; want uit de wortel der slang zal een basilisk voortkomen, en haar vrucht zal een vurige vliegende draak zijn.", "30": "En de eerstgeborenen der armen zullen weiden, en de nooddruftigen zullen zeker nederliggen; uw wortel daarentegen zal Ik door den honger doden, en uw overblijfsel zal hij ombrengen.", "31": "Huil, gij poort, schreeuw, gij stad! gij zijt gesmolten, gij gans Palestina! want van het noorden komt een rook, en er is geen eenzame in zijn samenkomsten.", "32": "Wat zal men dan antwoorden den boden des volks? Dat de HEERE Sion gegrond heeft, opdat de bedrukten Zijns volks een toevlucht daarin hebben zouden."}, "KJV": {"1": "For the LORD will have mercy on Jacob, and will yet choose Israel, and set them in their own land: and the strangers shall be joined with them, and they shall cleave to the house of Jacob.", "2": "And the people shall take them, and bring them to their place: and the house of Israel shall possess them in the land of the LORD for servants and handmaids: and they shall take them captives, whose captives they were; and they shall rule over their oppressors.", "3": "And it shall come to pass in the day that the LORD shall give thee rest from thy sorrow, and from thy fear, and from the hard bondage wherein thou wast made to serve,", "4": "That thou shalt take up this proverb against the king of Babylon, and say, How hath the oppressor ceased! the golden city ceased!", "5": "The LORD hath broken the staff of the wicked, *and* the sceptre of the rulers.", "6": "He who smote the people in wrath with a continual stroke, he that ruled the nations in anger, is persecuted, *and* none hindereth.", "7": "The whole earth is at rest, *and* is quiet: they break forth into singing.", "8": "Yea, the fir trees rejoice at thee, *and* the cedars of Lebanon, *saying*, Since thou art laid down, no feller is come up", "9": "Hell from beneath is moved for thee to meet *thee* at thy coming: it stirreth up the dead for thee, *even* all the chief ones of the earth; it hath raised up from their thrones all the kings of the nations.", "10": "All they shall speak and say unto thee, Art thou also become weak as we? art thou become like", "11": "Thy pomp is brought down to the grave, *and* the noise of thy viols: the worm is spread under thee, and the worms cover", "12": "How art thou fallen from heaven, O Lucifer, son of the morning! *how* art thou cut down to the ground, which didst weaken the nations!", "13": "For thou hast said in thine heart, I will ascend into heaven, I will exalt my throne above the stars of God: I will sit also upon the mount of the congregation, in the sides of the north:", "14": "I will ascend above the heights of the clouds; I will be like the most High.", "15": "Yet thou shalt be brought down to hell, to the sides of the pit.", "16": "They that see thee shall narrowly look upon thee, *and* consider thee, *saying, Is* this the man that made the earth to tremble, that did shake kingdoms;", "17": "*That* made the world as a wilderness, and destroyed the cities thereof; *that* opened not the house of his prisoners?", "18": "All the kings of the nations, *even* all of them, lie in glory, every one in his own house.", "19": "But thou art cast out of thy grave like an abominable branch, *and as* the raiment of those that are slain, thrust through with a sword, that go down to the stones of the pit; as a carcase trodden under feet.", "20": "Thou shalt not be joined with them in burial, because thou hast destroyed thy land, *and* slain thy people: the seed of evildoers shall never be renowned.", "21": "Prepare slaughter for his children for the iniquity of their fathers; that they do not rise, nor possess the land, nor fill the face of the world with cities.", "22": "For I will rise up against them, saith the LORD of hosts, and cut off from Babylon the name, and remnant, and son, and nephew, saith the LORD.", "23": "I will also make it a possession for the bittern, and pools of water: and I will sweep it with the besom of destruction, saith the LORD of hosts.", "24": "The LORD of hosts hath sworn, saying, Surely as I have thought, so shall it come to pass; and as I have purposed, *so* shall it stand:", "25": "That I will break the Assyrian in my land, and upon my mountains tread him under foot: then shall his yoke depart from off them, and his burden depart from off their shoulders.", "26": "This *is* the purpose that is purposed upon the whole earth: and this *is* the hand that is stretched out upon all the nations.", "27": "For the LORD of hosts hath purposed, and who shall disannul *it*? and his hand *is* stretched out, and who shall turn it back?", "28": "In the year that king Ahaz died was this burden.", "29": "Rejoice not thou, whole Palestina, because the rod of him that smote thee is broken: for out of the serpent's root shall come forth a cockatrice, and his fruit *shall be* a fiery flying serpent.", "30": "And the firstborn of the poor shall feed, and the needy shall lie down in safety: and I will kill thy root with famine, and he shall slay thy remnant.", "31": "Howl, O gate; cry, O city; thou, whole Palestina, *art* dissolved: for there shall come from the north a smoke, and none *shall be* alone in his appointed times.", "32": "What shall *one* then answer the messengers of the nation? That the LORD hath founded Zion, and the poor of his people shall trust"}}, "tsk": {"1": [{"kopje": "de HEERE", "refs": ["Jes 40:1", "Jes 40:2", "Jes 44:21", "Jes 44:22", "Jes 54:7", "Jes 54:8", "Lev 26 null}], "kinderen": []}]}]}}, "extern": {"Ef 6:16": "bovenal aangenomen hebbende het schild van het geloof, waarmee u al de vurige pijlen van de boze zult kunnen uitblussen.", "Jes 21:5": "Bereid de tafel, houd de wacht, wachter! Eet, drink; maak u op, vorsten, bestrijk het schild!", "Zach 14:3": "En de HEERE zal uittrekken, en Hij zal strijden tegen die heidenen, zoals ten dage dat Hij gestreden heeft, ten dage van het strijd.", "Ps 104:16": "De bomen van de HEERE worden verzadigd, de cederbomen van Libanon, die Hij geplant heeft;", "Joh 14:16": "En Ik zal de Vader bidden, en Hij zal u een andere Trooster geven, opdat Hij bij u blijft tot in eeuwigheid;", "Dan 12:1": "En in die tijd zal Michaël opstaan, die grote vorst, die voor de kinderen van uw volk staat, als het zo'n tijd van benauwdheid zal zijn, als er niet geweest is sinds er een volk geweest is, tot op die tijd toe; en in die tijd zal uw volk verlost worden, ieder die gevonden wordt geschreven te zijn in het boek.", "Hebr 7:28": "Want de wet stelt tot hogepriesters mensen aan, die zwakheid hebben; maar het woord van de eedzwering, dat na de wet gekomen is, stelt de Zoon aan, Die in eeuwigheid volmaakt gemaakt is.", "Ps 93:1": "De HEERE regeert, Hij is met majesteit bekleed; de HEERE is bekleed met sterkte, Hij heeft Zich omgord. Ook is de wereld bevestigd, zij zal niet wankelen.", "Ps 95:1": "Komt, laat ons de HEERE vrolijk zingen; laat ons juichen voor de Rotssteen van ons heil.", "Kol 1:6": "dat tot u gekomen is, zoals ook in de hele wereld, en het brengt vruchten voort, zoals ook onder u, vanaf de dag dat u het gehoord hebt en de genade van God in waarheid hebt leren kennen.", "2 Kor 4:16": "Daarom worden wij niet moedeloos; maar hoewel onze uitwendige mens verdorven wordt, wordt toch de inwendige vernieuwd van dag tot dag.", "1 Petr 1:7": "opdat de beproeving van uw geloof — die veel kostbaarder is dan goud, dat vergaat en toch door het vuur beproefd wordt — bevonden wordt te zijn tot lof, eer en heerlijkheid bij de openbaring van Jezus Christus;", "Hab 2:5-13": "En ook omdat hij trouweloos handelt bij de wijn, een trots man is, en niet in zijn woning blijft; die zijn ziel wijd opendoet als het graf, en is als de dood, die niet verzadigd wordt, en tot zich verzamelt alle heidenvolken, en tot zich bijeenbrengt alle volken. Zouden die allen dan niet een spreekwoord over hem opnemen, en een spottende uitlegging over hem? En men zal zeggen: Wee hem die vermeerdert wat het zijne niet is (hoe lang nog!), en hem die op zich laadt dik slijk! Zullen niet onvoorziens opstaan die u zullen bijten, en ontwaken die u zullen doen beven, en zult u hun niet tot buit worden?", "Spr 25:6": "Praal niet voor het aangezicht van de koning, en sta niet op de plaats van de groten;", "Jes 41:14": "Vrees niet, wormpje Jakob, volkje Israël! Ik help u, spreekt de HEERE, en uw Verlosser is de Heilige van Israël!", "Ps 49:12": "Hun diepste gedachte is dat hun huizen er voor eeuwig zullen zijn, hun woningen van geslacht tot geslacht; zij noemen de landen naar hun namen.", "Ps 138:6": "Want de HEERE is hoog, toch ziet Hij de nederige aan, en de verhevene kent Hij van verre.", "Ps 23:6": "Zeker, het goede en de weldadigheid zullen mij volgen al de dagen van mijn leven; en ik zal in het huis van de HEERE blijven, tot in lengte van dagen.", "Matt 20:26": "Maar zo zal het onder u niet zijn; maar wie onder u groot wil worden, die moet uw dienaar zijn;", "Job 20:11": "Zijn beenderen zullen vol zijn van zijn zonden uit zijn jeugd; die zullen met hem in het stof neerliggen.", "Zach 2:5": "En Ik zal haar wezen, spreekt de HEERE, een vurige muur rondom; en Ik zal tot heerlijkheid wezen in het midden van haar.", "Ex 17:16": "En hij zei: Omdat de hand op de troon van de HEERE is, zal er oorlog van de HEERE tegen Amalek zijn, van geslacht tot geslacht!", "Luk 10:18": "En Hij zei tegen hen: Ik zag de satan als een bliksem uit de hemel vallen.", "Ps 121:3-8": "Hij zal uw voet niet laten wankelen; uw Bewaarder zal niet sluimeren. Zie, de Bewaarder van Israël zal niet sluimeren, ook niet slapen. De HEERE is uw Bewaarder, de HEERE is uw Schaduw, aan uw rechterhand.", "Jer 48:14": "Hoe kunt u zeggen: Wij zijn helden en dappere mannen voor de strijd?", "Job 31:19-22": "Als ik iemand heb zien omkomen, omdat hij zonder kleding was, en dat de nooddruftige geen deksel had; Als zijn lenden mij niet gezegend hebben, toen hij van de vellen van mijn lammeren verwarmd werd; Als ik mijn hand tegen de wees bewogen heb, omdat ik in de poort mijn hulp zag;", "Jer 25:9-14": "Zie, Ik zal zenden, en nemen alle geslachten van het noorden, spreekt de HEERE; en tot Nebukadnezar, de koning van Babel, Mijn dienstknecht; en zal ze brengen over dit land, en over de inwoners daarvan, en over al deze volken rondom; en Ik zal ze met de ban verdelgen, en zal ze stellen tot een ontzetting, en tot een aanfluiting, en tot eeuwige woestheden. En Ik zal van hen doen vergaan de stem van de vrolijkheid en de stem van de vreugde, de stem van de bruidegom en de stem van de bruid, het geluid van de molens en het licht van de lamp. En dit hele land zal worden tot een woestheid, tot een ontzetting; en deze volken zullen de koning van Babel dienen zeventig jaren.", "Ps 21:5": "Het leven heeft hij van U begeerd. U hebt het hem gegeven; lengte van dagen, eeuwig en altoos.", "Matt 19:16": "En zie, er kwam iemand naar Hem toe, en zei tegen Hem: Goede Meester! Wat goeds zal ik doen, opdat ik het eeuwige leven heb?", "Luk 1:72-74": "om barmhartigheid te bewijzen aan onze vaderen, en Zijn heilig verbond te gedenken; en aan de eed die Hij Abraham, onze vader, gezworen heeft, om ons te geven dat wij, verlost uit de hand van onze vijanden, Hem zonder vrees zouden dienen,", "Spr 24:20": "Want de kwade zal geen beloning hebben, de lamp van de goddelozen zal uitgeblust worden.", "Dan 4:30": "Sprak de koning, en zei: Is dit niet het grote Babel, dat ik gebouwd heb tot een huis van het koninkrijk, door de sterkte van mijn macht, en tot eer van mijn heerlijkheid!", "2 Sam 19:35": "Ik ben vandaag tachtig jaar oud; zou ik nog kunnen onderscheiden tussen goed en kwaad? Zou uw knecht kunnen proeven wat ik eet en wat ik drink? Zou ik nog kunnen horen naar de stem van zangers en zangeressen? En waarom zou uw knecht mijn heer de koning nog langer tot last zijn?", "2 Kron 20:19": "En de Levieten uit de kinderen van de Kahathieten en uit de kinderen van de Korachieten stonden op om de HEERE, de God van Israël, met luide stem uitbundig te prijzen.", "Ps 150:1-6": "Halleluja! Loof God in Zijn heiligdom; loof Hem in het uitspansel van Zijn sterkte! Loof Hem vanwege Zijn machtige daden; loof Hem naar de overvloed van Zijn grootheid! Loof Hem met geschal van de bazuin; loof Hem met de luit en met de harp!", "Openb 11:11-18": "En na die drie dagen en een halve is een geest van leven uit God in hen gegaan; en zij stonden op op hun voeten; en er is grote vrees gevallen op hen die hen aanschouwden. En zij hoorden een grote stem uit de hemel, die tegen hen zei: Kom hier boven. En zij voeren op naar de hemel, in de wolk; en hun vijanden aanschouwden hen. En op datzelfde uur gebeurde er een grote aardbeving, en het tiende deel van de stad viel, en er werden in de aardbeving zevenduizend namen van mensen gedood, en de overigen werden zeer bevreesd, en gaven de God van de hemel heerlijkheid.", "Jak 5:8": "Wees ook u geduldig, versterk uw harten; want de komst van de Heere is nabij.", "Ps 94:21": "Zij rotten samen tegen de ziel van de rechtvaardige, en zij veroordelen onschuldig bloed.", "2 Kron 20:6": "En hij zei: HEERE, God van onze vaderen, bent U niet de God in de hemel? Ja, U heerst over alle koninkrijken van de heidenvolken; en in Uw hand is kracht en sterkte, zodat niemand tegen U stand kan houden.", "Spr 15:19": "De weg van de luiaard is als een doornheg; maar het pad van de oprechten is welgebaand.", "Jer 13:15": "Hoort en neemt het ter ore, verhef u niet; want de HEERE heeft het gesproken.", "Ex 14:12": "Is dit niet het woord dat wij in Egypte tot u spraken en zeiden: Houd op met ons, en laat ons de Egyptenaren dienen? Want het was ons beter geweest de Egyptenaren te dienen, dan in deze woestijn te sterven.", "1 Kon 20:11": "Maar de koning van Israël antwoordde en zei: Spreekt tot hem: Die zich aangordt, beroemt zich niet, als die zich los maakt.", "Ps 16:11": "U zult mij het pad van het leven bekendmaken; overvloed van vreugde is bij Uw aangezicht; liefelijkheden zijn in Uw rechterhand, eeuwig.", "Ef 1:20": "Die Hij gewrocht heeft in Christus, toen Hij Hem uit de doden heeft opgewekt; en Hem heeft gezet aan Zijn rechterhand in de hemel;", "Rom 15:13": "De God nu van de hoop vervult u met alle blijdschap en vrede in het geloven, opdat u overvloedig mag zijn in de hoop, door de kracht van de Heilige Geest.", "1 Sam 2:7": "De HEERE maakt arm en maakt rijk; Hij vernedert, ook verhoogt Hij.", "Jer 50:23": "Hoe is de hamer van de hele aarde zo afgehouwen en verbroken! Hoe is Babel geworden tot een ontzetting onder de heidenvolken.", "Ex 15:16": "Verschrikking en vrees zal op hen vallen; door de grootheid van Uw arm zullen zij verstommen als een steen, totdat Uw volk, HEERE, erdoor is getrokken; totdat dit volk erdoor is getrokken, dat U verworven hebt.", "Hab 2:17": "Want het geweld dat tegen Libanon begaan is, zal u bedekken, en de verwoesting van de dieren zal u verschrikken, vanwege het bloed van de mensen, en het geweld in het land, de stad, en aan alle inwoners daarvan.", "Jes 9:11": "De Syriërs van voren, en de Filistijnen van achteren, zodat zij Israël opeten met volle mond. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.", "Ef 2:3": "onder wie ook wij allen eertijds verkeerd hebben, in de begeerten van ons vlees, terwijl wij deden de wil van het vlees en van de gedachten; en wij waren van nature kinderen van de toorn, net als ook de anderen;", "2 Sam 12:23": "Maar nu is het dood, waarom zou ik nu vasten? Zal ik het nog kunnen terughalen? Ik zal wel naar hem toe gaan, maar hij zal niet naar mij terugkomen.", "Jer 17:7": "Gezegend daarentegen is de man die op de HEERE vertrouwt, en wiens vertrouwen de HEERE is!", "Amos 3:10": "Want zij weten niet te doen wat recht is, spreekt de HEERE; zij die in hun paleizen schatten vergaren door geweld en verwoesting.", "Dan 11:45": "En hij zal de tenten van zijn paleis planten tussen de zeeën, bij de berg van het heilige sieraad; en hij zal tot zijn einde komen, en zal geen helper hebben.", "Jes 62:12": "En zij zullen hen noemen het heilige volk, de verlosten van de HEERE; en u zult genoemd worden de gezochte, de stad, die niet verlaten is.", "Ef 3:15": "uit Wie heel het geslacht in de hemelen en op de aarde genoemd wordt,", "Ps 111:6": "Caph. Hij heeft de kracht van Zijn werken aan Zijn volk bekendgemaakt; Lamed. door hun de erve van de heidenen te geven.", "1 Kor 4:6-8": "En deze dingen, broeders, heb ik op mijzelf en Apollos bij wijze van voorbeeld toegepast, om uwentwil; opdat u van ons zou leren niet te denken boven wat geschreven is, opdat u niet, de een om de ander, opgeblazen wordt tegen elkaar. Want wie maakt onderscheid ten aanzien van u? En wat hebt u, dat u niet hebt ontvangen? En als u het ook ontvangen hebt, waarom roemt u, alsof u het niet ontvangen had? Al bent u verzadigd, al bent u rijk geworden, zonder ons hebt u geheerst; en och, was het maar zo dat u heerste, opdat ook wij met u heersen mochten!", "Jes 43:21": "Dit volk heb Ik Mij geformeerd, zij zullen Mijn lof vertellen.", "Zef 2:14": "En in haar midden zullen de kudden liggen, al het gedierte van de volken; ook de roerdomp, ook de nachtuil zullen op haar granaatappels overnachten; een stem zal in het venster zingen, verwoesting zal op de drempel zijn, wanneer Hij haar cederwerk zal hebben blootgelegd.", "Ps 36:10": "Want bij U is de fontein van het leven; in Uw licht zien wij het licht.", "Openb 13:15-17": "En hem werd macht gegeven om aan het beeld van het beest een geest te geven, zodat het beeld van het beest ook zou spreken, en zou maken dat allen die het beeld van het beest niet zouden aanbidden, gedood zouden worden. En het maakt dat het aan allen, kleinen en groten, rijken en armen, vrijen en dienstknechten, een merkteken geeft op hun rechterhand of op hun voorhoofd; En dat niemand mag kopen of verkopen, dan wie dat merkteken heeft, of de naam van het beest, of het getal van zijn naam.", "Jer 43:7": "en zij trokken naar Egypteland, want zij waren aan de stem van de HEERE niet gehoorzaam; en zij kwamen tot Tachpanhes.", "Ezech 2:3-5": "En Hij zei tegen mij: Mensenkind! Ik zend u tot de kinderen van Israël, tot de rebellerende volken, die tegen Mij gerebelleerd hebben; zij en hun vaderen hebben tegen Mij overtreden tot op deze huidige dag. En deze kinderen zijn hard van gezicht, en stijf van hart; Ik zend u tot hen, en u zult tegen hen zeggen: Zo zegt de Heere HEERE! En zij, hetzij dat zij het horen zullen, of hetzij dat zij het laten zullen (want zij zijn een opstandig huis), zo zullen zij weten, dat er een profeet in hun midden geweest is.", "Hab 1:7": "Schrikkelijk en vreselijk is het; zijn recht en zijn hoogheid gaan van hemzelf uit.", "1 Sam 2:10": "Zij die met de HEERE twisten, zullen verpletterd worden; Hij zal in de hemel over hen donderen; de HEERE zal de einden van de aarde richten, en zal Zijn Koning sterkte geven, en de hoorn van Zijn Gezalfde verhogen.", "1 Kon 21:19": "En u zult tot hem spreken en zeggen: Zo zegt de HEERE: Hebt u doodgeslagen, en ook een erfelijke bezitting ingenomen? Daartoe zult u tot hem spreken en zeggen: Zo zegt de HEERE: Op de plaats waar de honden het bloed van Naboth gelekt hebben, zullen de honden ook uw bloed lekken, ja, het uwe!", "Jak 3:1": "Wees niet met velen leraar, mijn broeders, wetend dat wij een des te zwaarder oordeel zullen ontvangen.", "Ex 15:2": "De HEERE is mijn Kracht en Lied, en Hij is mij tot een Heil geweest; Deze is mijn God; daarom zal ik Hem een liefelijke woning maken; Hij is de God van mijn vader, daarom zal ik Hem verheffen!", "Num 14:18": "De HEERE is geduldig en groot van goedertierenheid, Hij vergeeft de ongerechtigheid en overtreding, maar houdt de schuldige geenszins onschuldig, en bezoekt de ongerechtigheid van de vaderen aan de kinderen, tot het derde en vierde geslacht.", "Jes 43:14": "Zo zegt de HEERE, uw Verlosser, de Heilige van Israël: Om uw wil heb Ik naar Babel gezonden, en heb hen allen als vluchtelingen doen neerdalen, te weten de Chaldeeën, in de schepen, waarop zij juichten.", "1 Kon 2:33": "Zo zal hun bloed terugkeren op het hoofd van Joab, en op het hoofd van zijn nakomelingen voor eeuwig; maar David, en zijn nakomelingen, en zijn huis, en zijn troon zal vrede hebben van de HEERE tot in eeuwigheid.", "Gen 26:17": "Toen ging Izak daarvandaan, en hij legerde zich in het dal van Gerar, en woonde daar.", "Jes 37:23": "Wie hebt u gehoond en gelasterd, en tegen wie hebt u de stem verheven en uw ogen omhoog opgeheven? Tegen de Heilige van Israël!", "Hos 2:13": "Daarom, zie, Ik zal haar lokken, en haar leiden in de woestijn; en Ik zal naar haar hart spreken.", "1 Tim 2:15": "Toch zal zij zalig worden door het baren van kinderen, als zij blijft in het geloof, en liefde, en heiliging, met ingetogenheid.", "Zef 3:8": "Daarom, verwacht Mij, spreekt de HEERE, op de dag dat Ik Mij opmaak² tot de roof; want Mijn oordeel is, de heidenen te verzamelen, de koninkrijken te vergaderen, om over hen Mijn gramschap, de gehele gloed van Mijn toorn, uit te storten; want dit gehele land zal door het vuur van Mijn na-ijver verteerd worden.", "Ps 114:2": "Werd Juda tot Zijn heiligdom, Israël Zijn volkomen heerschappij.", "Spr 26:16": "De luiaard is wijzer in zijn eigen ogen, dan zeven die met verstand antwoorden.", "Job 5:11": "Om de vernederden te stellen in het hoge; dat de rouwdragenden door heil verheven worden.", "Zef 2:13": "Hij zal ook Zijn hand uitstrekken tegen het noorden, en Hij zal Assur verdoen; en Hij zal Ninevé stellen tot een verwoesting, droog als een woestijn.", "Ezech 34:2-4": "Mensenkind! Profeteer tegen de herders van Israël; profeteer en zeg tot hen, tot de herders: Zo zegt de Heere HEERE: Wee de herders van Israël, die zichzelf weiden! Zullen niet de herders de schapen weiden? U eet het vette, en bekleedt u met de wol, u slacht het gemeste, maar de schapen weidt u niet. De zwakke sterkt u niet, en het zieke heelt u niet, en het gebrokene verbindt u niet, en het weggedrevene brengt u niet terug, en het verlorene zoekt u niet; maar u heerst over hen met strengheid en met hardheid.", "Jes 66:18": "Hun werken en hun gedachten! Het komt, dat Ik alle heidenen en talen zal verzamelen, en zij zullen komen, en zij zullen Mijn heerlijkheid zien.", "Ps 144:5": "Buig Uw hemelen, HEERE, en daal neer; raak de bergen aan, zodat ze roken.", "Jes 30:27-33": "Ziet, de Naam van de HEERE komt van verre, Zijn toorn brandt, en de last is zwaar; Zijn lippen zijn vol gramschap, en Zijn tong als een verterend vuur; En Zijn adem is als een overlopende beek, die tot aan de hals toe raakt; om de heidenen te schudden met een schudding van de ijdelheid, en als een misleidende toom in het kinnebakken van de volken. Er zal een lofzang bij u zijn, zoals in de nacht wanneer het feest geheiligd wordt; en blijdschap van het hart, zoals van iemand die met pijpen wandelt, om te komen tot de berg van de HEERE, tot de Rotssteen van Israël.", "Ps 69:34": "Want de HEERE hoort de behoeftigen, en Hij veracht Zijn gevangenen niet.", "Ps 138:3": "Ten dage, als ik riep, hebt Gij mij verhoord; Gij hebt mij versterkt met kracht in mijn ziel.", "Job 11:12": "Dan zal een verstandeloos man verstandig worden; hoewel de mens als het veulen van een woudezel geboren is.", "Job 4:17-21": "Zou een mens rechtvaardiger zijn dan God? Zou een man reiner zijn dan zijn Maker? Zie, op Zijn knechten zou Hij niet vertrouwen; ook Zijn engelen heeft Hij van dwaasheid beschuldigd. Hoeveel te meer dan hen die in lemen huizen wonen, waarvan de grondslag in het stof is? Zij worden verbrijzeld voor de mot.", "Amos 5:11": "Daarom, omdat u de arme vertreedt en een last koren van hem neemt, hebt u wel huizen gebouwd van gehouwen steen, maar u zult daarin niet wonen; u hebt heerlijke wijngaarden geplant, maar u zult de wijn daarvan niet drinken.", "Spr 5:22": "De goddeloze zullen zijn eigen ongerechtigheden vangen, en met de banden van zijn zonden zal hij vastgehouden worden.", "Amos 9:6": "Die Zijn bovenzalen in de hemel bouwt, en Zijn gewelf heeft Hij op de aarde gegrondvest; Die de wateren van de zee roept, en giet ze uit over de aardbodem; HEERE is Zijn Naam.", "Ex 14:13": "Doch Mozes zei tegen het volk: Vrees niet, sta vast, en zie het heil van de HEERE, dat Hij heden aan u doen zal, want de Egyptenaren die u heden gezien hebt, zult u niet meer zien in eeuwigheid.", "Jes 45:10": "Wee hem die tegen zijn vader zegt: Wat verwekt u? en tegen de vrouw: Wat baart u?", "Job 34:28": "Opdat Hij op hem het geroep van de arme brengt, en het geroep van de ellendigen verhoort.", "1 Kor 12:8": "Want aan de een wordt door de Geest het woord van wijsheid gegeven, en aan een ander het woord van kennis, door dezelfde Geest;", "Ezech 32:31": "Farao zal hen zien, en zich troosten over zijn hele menigte; de verslagenen van het zwaard van Farao en zijn hele leger, spreekt de Heere HEERE.", "Ps 132:13-16": "Want de HEERE heeft Sion verkozen, Hij heeft het begeerd tot Zijn woonplaats, en zei: Dit is Mijn rust tot in eeuwigheid, hier zal Ik wonen, want Ik heb het begeerd. Ik zal haar voedsel rijkelijk zegenen, haar behoeftigen zal Ik met brood verzadigen.", "Hebr 11:13-16": "Deze allen zijn in het geloof gestorven, zonder de beloften ontvangen te hebben, maar zij hebben ze van verre gezien, en geloofd, en begroet, en beleden dat zij gasten en vreemdelingen op de aarde waren. Want wie zulke dingen zeggen, laten daarmee duidelijk zien dat zij een vaderland zoeken. En als zij aan dat vaderland gedacht hadden waar zij uit weggegaan waren, zouden zij de tijd gehad hebben om terug te keren;", "Gen 26:33": "En hij noemde hem Seba; daarom is de naam van die stad Berseba, tot op deze dag.", "Ps 55:23": "Werp uw zorg op de HEERE, en Hij zal u onderhouden; Hij zal in eeuwigheid niet toelaten dat de rechtvaardige wankelt.", "Jes 33:20-24": "Bekijk Sion, de stad van onze samenkomsten; uw ogen zullen Jeruzalem zien, een rustige woonplaats, een tent, die niet neergehaald zal worden, waarvan de pinnen in eeuwigheid niet uitgetrokken zullen worden, en waarvan geen touwen verscheurd zullen worden. Maar de HEERE zal daar bij ons heerlijk zijn, het zal een plaats zijn van rivieren, van wijde stromen; geen roeischuit zal daar doorvaren, en geen praalschip zal daar overvaren. Want de HEERE is onze Rechter, de HEERE is onze Wetgever, de HEERE is onze Koning. Hij zal ons redden.", "1 Kron 25:1": "David, alsook de leiders van het leger, wees af voor de dienst enkele van de kinderen van Asaf, en van Heman, en van Jeduthun, die met harpen, met luiten en met cimbalen zouden profeteren; en zij die onder hen geteld werden, waren mannen die bekwaam waren tot het werk van hun dienst.", "Jes 48:13": "Ook heeft Mijn hand de aarde gegrond, en Mijn rechterhand heeft de hemelen met de palm afgemeten; wanneer Ik ze roep, staan zij daar samen.", "Spr 22:12": "De ogen van de HEERE bewaren de kennis; maar de zaken van de trouweloze zal Hij omkeren.", "Jes 51:10": "Bent U het niet, Die de zee, het water van het grote afgrond, droog gemaakt hebt? Die de diepten van de zee gemaakt hebt tot een weg, opdat de verlosten daardoor gingen?", "Jes 66:13": "Zoals iemand die zijn moeder troost, zo zal Ik u troosten; ja, u zult in Jeruzalem getroost worden.", "Jes 44:23": "Zing met vreugde, u hemelen! Want de HEERE heeft het gedaan; juich, u onderste delen van de aarde! U bergen! Maak een groot gedreun met vreugdegezang, u bossen, en al het geboomte daarin! Want de HEERE heeft Jakob verlost, en Zich heerlijk gemaakt in Israël.", "Ps 132:15": "Ik zal haar voedsel rijkelijk zegenen, haar behoeftigen zal Ik met brood verzadigen.", "1 Kon 17:1": "En Elia, de Thisbiet, van de inwoners van Gilead, zei tegen Achab: Zo waarachtig als de HEERE, de God van Israël, leeft, voor Wiens aangezicht ik sta, indien deze jaren dauw of regen zijn zal, tenzij dan naar mijn woord!", "Luk 17:5": "En de apostelen zeiden tegen de Heere: Vermeerder ons geloof.", "Jes 9:9": "De tichelstenen zijn gevallen, maar met uitgehouwen stenen zullen wij opnieuw bouwen; de wilde vijgenbomen zijn afgehouwen, maar wij zullen ze in cederen veranderen;", "Matt 25:46": "En dezen zullen weggaan in de eeuwige pijn; maar de rechtvaardigen in het eeuwige leven.", "Jer 31:7": "Want zo zegt de HEERE: Roept luide over Jakob met vreugde, en juicht vanwege het hoofd van de heidenvolken; laat het horen, lofzingt, en zegt: O HEERE! Behoud Uw volk, het overblijfsel van Israël.", "1 Tess 5:8": "Maar wij, die van de dag zijn, laten wij nuchter zijn, terwijl wij aandoen het borstwapen van het geloof en de liefde, en tot een helm de hoop van de zaligheid.", "Jes 45:2": "Ik zal voor uw aangezicht gaan, en Ik zal de kromme wegen recht maken; de koperen deuren zal Ik verbreken, en de ijzeren grendels zal Ik in stukken slaan.", "Jer 5:28": "Zij zijn vet, zij zijn glad, zelfs de daden van de bozen gaan zij te boven; de rechtszaak richten zij niet, zelfs de rechtszaak van de wees niet, toch is het hun voorspoedig; ook oordelen zij het recht van de behoeftigen niet.", "1 Sam 2:9": "Hij zal de voeten van Zijn gunstgenoten bewaren; maar de goddelozen zullen zwijgen in duisternis; want een man vermag niet door kracht.", "Jes 2:11-17": "De hoge ogen van de mensen zullen vernederd worden, en de hoogheid van de mannen zal neergebogen worden; en de HEERE alleen zal op die dag verheven zijn. Want de dag van de HEERE van de heerscharen zal zijn tegen alle hovaardige en hoge, en tegen alle verhevene, opdat hij vernederd wordt; En tegen alle hoge en verhevene ceders van Libanon, en tegen alle eiken van Basan;", "Ezech 33:32": "En zie, u bent voor hen als een liefdeslied, als iemand die mooi zingt of goed op een instrument speelt; daarom horen zij uw woorden, maar zij doen ze niet.", "Ezech 6:14": "Daarom zal Ik Mijn hand over hen uitstrekken, en zal het land woest maken, ja, woester dan de woestijn, tot Diblath toe, in al hun woonplaatsen; en zij zullen bevinden dat Ik de HEERE ben.", "Ezech 32:11": "Want zo zegt de Heere HEERE: Het zwaard van de koning van Babel zal u overkomen.", "Jer 32:37-41": "Zie, Ik zal hen verzamelen uit al de landen waarheen Ik hen verdreven zal hebben in Mijn toorn, en in Mijn grimmigheid, en in grote verbolgenheid; en Ik zal hen naar deze plaats terugbrengen, en zal hen zeker doen wonen. Ja, zij zullen Mij tot een volk zijn, en Ik zal hun tot een God zijn. En Ik zal hun één hart en één weg geven, om Mij te vrezen alle dagen, hun ten goede, alsook hun kinderen na hen.", "Ps 128:6": "En u zult uw kleinkinderen zien. Vrede over Israël!", "2 Kon 9:25": "Toen zei Jehu tegen Bidkar, zijn hoofdman: Neem hem op, werp hem op dat stuk land van Naboth, de Jizreëliet; want gedenk, toen ik en u samen achter zijn vader Achab reden, dat de HEERE hem deze last oplegde, en zei:", "Jes 13:1-22": "De last van Babel, die Jesaja, de zoon van Amoz, gezien heeft. Hef een banier op, op een hoge berg; verhef een stem tot hen; beweeg de hand omhoog, dat zij binnengaan door de deuren van de vorsten. Ik heb Mijn geheiligden bevel gegeven; ook heb Ik tot Mijn toorn geroepen Mijn helden, hen die zich verheugen in Mijn hoogheid.", "Ps 113:8": "Om hem te doen zitten bij de vorsten, bij de vorsten van Zijn volk.", "Pred 4:14": "Want de een komt uit de gevangenis om koning te worden; terwijl ook iemand die in zijn koninkrijk geboren is, verarmt.", "Jes 40:24": "Ja, zij worden niet geplant, ja, zij worden niet gezaaid, ja, hun afgehouwen stam wortelt niet in de aarde; ook als Hij op hen waait, zullen zij verdorren, en een stormwind zal hen als een stoppel wegnemen.", "Micha 7:3": "Om met beide handen goed hun best te doen om kwaad te doen, zo eist de vorst, en de rechter oordeelt om vergelding; en de grote spreekt de verderving van zijn ziel uit, en zij draaien het samen dicht ineen.", "Openb 14:8": "En er is een andere engel gevolgd, die zei: Zij is gevallen, zij is gevallen, Babylon, die grote stad, omdat zij uit de wijn van de toorn van haar hoererij alle volken heeft laten drinken.", "Jes 9:8": "En dit hele volk zal het gewaar worden, Efraïm en de inwoner van Samaria; in hoogmoed en grootsheid van hart, en zij zeiden:", "Jes 43:2": "Wanneer u door het water zult gaan, Ik zal bij u zijn, en door de rivieren, zij zullen u niet overstromen; wanneer u door het vuur zult gaan, zult u niet verbranden, en de vlam zal u niet aansteken.", "Jer 21:4-10": "Zo zegt de HEERE, de God van Israël: Zie, Ik zal de oorlogswapens omkeren, die in uw hand zijn, waarmee u strijdt tegen de koning van Babel en tegen de Chaldeeën, die u belegeren, van buiten aan de muur; en Ik zal ze verzamelen in het midden van deze stad. En Ik Zelf zal tegen u strijden, met een uitgestrekte hand en met een sterke arm, ja, met toorn, en met grimmigheid, en met grote verbolgenheid. En Ik zal de inwoners van deze stad slaan, zowel de mensen als de dieren; door een grote pest zullen zij sterven.", "Ezech 21:19": "U nu, mensenkind, stel u twee wegen voor, waardoor het zwaard van de koning van Babel komt; uit één land zullen zij beide voortkomen; en kies een plaats, kies die aan het hoofd van de weg naar de stad.", "Ezech 28:10": "U zult de dood van de onbesnedenen sterven, door de hand van vreemden; want Ik heb het gesproken, spreekt de Heere HEERE.", "Ezra 1:2-4": "Zo zegt Kores, koning van Perzië: De HEERE, de God van de hemel, heeft mij alle koninkrijken van de aarde gegeven; en Hij heeft mij opgedragen Hem een huis te bouwen te Jeruzalem, dat in Juda is. Wie is er onder u van al Zijn volk? Zijn God zij met hem, en hij trekt op naar Jeruzalem, dat in Juda is, en hij bouwt het huis van de HEERE, de God van Israël; Hij is de God, Die te Jeruzalem woont. En ieder die achterblijft in een van de plaatsen waar hij als vreemdeling verblijft, die zullen de mensen van zijn plaats bijstaan met zilver, en met goud, en met bezit, en met vee; benevens een vrijwillige gave, voor het huis van God, Die te Jeruzalem woont.", "Amos 6:3-7": "U, die de kwade dag ver weg zet, en de zetel van het geweld dichtbij brengt. Die daar liggen op ivoren bedsteden, en weelderig zijn op hun rustbanken, en de lammeren van de kudde eten, en de kalveren uit het midden van de meststal. Die bij het geschal van de luit kwinkeleren, en zichzelf instrumenten van muziek bedenken, zoals David;", "Jes 23:11": "Hij heeft Zijn hand uitgestrekt over de zee, Hij heeft de koninkrijken doen beven; de HEERE heeft bevel gegeven tegen Kanaän, om haar vestingen te vernietigen.", "Ps 107:25": "Als Hij spreekt, doet Hij een stormwind opsteken, die haar golven omhoog verheft.", "Jes 14:4-26": "dan zult u deze spreuk aanheffen tegen de koning van Babel, en zeggen: Hoe houdt de onderdrukker op! Hoe houdt de gouden stad op! De HEERE heeft de stok van de goddelozen gebroken, de scepter van de heersers. Die de volken sloeg in verbolgenheid met een plaag zonder ophouden, die in toorn over de heidenvolken heerste, wordt vervolgd, zonder dat iemand het kan afweren.", "Ps 77:15": "U bent die God, Die wonderen doet; U hebt Uw sterkte bekendgemaakt onder de volken.", "Ps 62:3": "Zeker, Hij is mijn Rots en mijn Heil, mijn Hoog Vertrek, ik zal niet erg wankelen.", "Ezech 18:19": "Maar u zegt: Waarom draagt de zoon niet de ongerechtigheid van de vader? Zeker zal de zoon, die recht en gerechtigheid gedaan heeft, en al Mijn inzettingen onderhouden heeft, en die gedaan heeft, zeker leven.", "Jer 51:14": "De HEERE van de heerscharen heeft gezworen bij Zijn ziel: Ofschoon Ik u met mensen als met kevers vervuld heb, toch zullen zij elkaar een vreugdegeroep over u toeroepen!", "Hebr 12:1-4": "Daarom dan ook, omdat wij zo'n grote wolk van getuigen om ons heen hebben liggen, laten wij alle last afleggen, en de zonde die ons gemakkelijk omringt, en laten wij met volharding de wedloop lopen die ons voorgesteld is; Ziende op Jezus, de Leidsman en Voleinder van het geloof, Die om de vreugde die Hem voorgesteld was, het kruis heeft verdragen, en schande veracht heeft, en gezeten is aan de rechterhand van de troon van God. Want let op Hem, Die zo'n tegenspreken van de zondaren tegen Zich heeft verdragen, opdat u niet verflauwt en bezwijkt in uw zielen.", "Job 10:7": "Het is Uw wetenschap, dat ik niet goddeloos ben; nochtans is er niemand, die uit Uw hand verlost.", "Ps 25:12": "Mem. Wie is de man, die de HEERE vreest? Hij zal hem onderwijzen in de weg, die hij zal hebben te verkiezen.", "Ps 48:12-14": "Laat de berg Sion blijde zijn; laat de dochters van Juda zich verheugen, om Uw oordelen wil. Ga rondom Sion, en omring haar; tel haar torens; Zet uw hart op haar vesting; beschouw nauwkeurig haar paleizen, opdat u het aan het volgende geslacht vertelt.", "Mark 11:24": "Daarom zeg Ik u: Alle dingen die u in het gebed vraagt, geloof dat u ze ontvangen zult, en ze zullen u gegeven worden.", "Spr 25:7": "Want het is beter dat men tegen u zegt: Kom hier bovenaan, dan dat men u vernedert voor het aangezicht van een vorst, die uw ogen gezien hebben.", "Jer 50:1-51": "Het woord dat de HEERE gesproken heeft tegen Babel, tegen het land van de Chaldeeën, door de dienst van de profeet Jeremia. Verkondig het onder de heidenvolken, en laat het horen, en steek een banier op, laat het horen, verberg het niet; zeg: Babel is ingenomen, Bel is beschaamd, Merodach is verpletterd, haar afgoden zijn beschaamd, haar drekgoden zijn verpletterd! Want een volk komt tegen haar op vanuit het noorden; dat zal haar land tot een verwoesting maken, zodat er geen inwoner in zal zijn; van de mensen tot de dieren toe zijn zij weggezworven, doorgegaan!", "Jes 59:5": "Zij broeden basiliskuseieren uit, en zij weven spinnenwebben; wie van hun eieren eet, moet sterven, en als het in stukken gedrukt wordt, barst er een adder uit.", "Gen 48:16": "Die Engel, Die mij verlost heeft van alle kwaad, zegent deze jongens, en laat in hen mijn naam genoemd worden, en de naam van mijn vaders Abraham en Izak, en laat hen vermenigvuldigen als vissen in menigte, midden in het land!", "Jes 61:1-3": "De Geest van de Heere HEERE is op Mij, omdat de HEERE Mij gezalfd heeft, om een blijde boodschap te brengen aan de zachtmoedigen; Hij heeft Mij gezonden om te verbinden de gebrokenen van hart, om de gevangenen vrijheid uit te roepen, en de gebondenen opening van de gevangenis; Om uit te roepen het jaar van het welbehagen van de HEERE, en de dag van de wraak van onze God; om alle treurenden te troosten; Om de treurenden van Sion te geven, dat hun sieraad gegeven wordt voor as, vreugdeolie voor treurigheid, het gewaad van lof voor een benauwde geest; opdat zij eikenbomen van de gerechtigheid genoemd worden, een planting van de HEERE, opdat Hij verheerlijkt wordt.", "Ps 77:17": "De wateren zagen U, o God! De wateren zagen U, zij beefden; ook waren de afgronden beroerd.", "Zef 3:19": "Zie, Ik zal in die tijd al uw verdrukkers verdoen; en Ik zal de hinkende behoeden, en de uitgestotenen verzamelen; en Ik zal ze stellen tot een lof, en tot een naam, in het gehele land, waar zij beschaamd zijn geweest.", "Spr 12:13": "In de overtreding van de lippen is de strik van de boze; maar de rechtvaardige zal uit de benauwdheid komen.", "Job 24:19": "De droogte alsook de hitte nemen de sneeuwwateren weg; zo neemt het graf hen weg die gezondigd hebben.", "Jer 12:15": "En het zal gebeuren, nadat Ik hen zal hebben uitgerukt, dat Ik zal terugkeren, en Mij over hen zal ontfermen; en Ik zal hen terugbrengen, ieder tot zijn erfenis, en ieder tot zijn land.", "Zach 11:2": "Huil, u dennen! Omdat de ceders gevallen zijn, omdat die heerlijke bomen verwoest zijn; huil, u eiken van Basan! Omdat het sterke woud neergevallen is.", "Hos 5:10": "De vorsten van Juda zijn geworden als zij die de grenzen verleggen; Ik zal Mijn verbolgenheid als water over hen uitgieten.", "Jes 48:14": "Verzamel u, u allen, en hoor; wie onder hen heeft deze dingen verkondigd? De HEERE heeft hem lief, Hij zal Zijn welbehagen tegen Babel doen, en Zijn arm zal tegen de Chaldeeën zijn.", "Jes 1:27": "Sion zal door recht verlost worden, en haar wederkerende bewoners door gerechtigheid.", "Matt 22:29": "Maar Jezus antwoordde en zei tegen hen: U dwaalt, omdat u de Schriften niet kent, noch de kracht van God.", "Jer 3:4": "Zult u niet van nu af aan tot Mij roepen: Mijn Vader! U bent de leidsman van mijn jeugd!", "Ps 125:1": "Een lied Hammaaloth. Wie op de HEERE vertrouwen, zijn als de berg Sion, die niet wankelt, maar blijft in eeuwigheid.", "Ps 25:8": "Teth. De HEERE is goed en recht; daarom zal Hij de zondaars onderwijzen in de weg.", "Lev 26:39-42": "En de overgeblevenen onder u zullen om hun ongerechtigheid in de landen van uw vijanden wegteren; ja, ook om de ongerechtigheden van hun vaderen zullen zij met hen wegteren. Dan zullen zij hun ongerechtigheid belijden, en de ongerechtigheid van hun vaderen met hun overtredingen, waarmee zij tegen Mij overtreden hebben, en ook dat zij tegen Mij in gewandeld hebben. Dat Ik ook tegen hen in gewandeld heb, en hen in het land van hun vijanden gebracht heb. Als dan hun onbesneden hart gebogen wordt, en zij dan de straf voor hun ongerechtigheid aanvaarden;", "Jer 25:16-20": "Dat zij drinken, en beven, en dol worden, vanwege het zwaard, dat Ik onder hen zal zenden. En ik nam de beker uit de hand van de HEERE, en ik gaf te drinken aan alle volken, tot wie de HEERE mij gezonden had; Namelijk Jeruzalem en de steden van Juda, en haar koningen, en haar vorsten; om die te stellen tot een woestheid, tot een ontzetting, tot een aanfluiting en tot een vloek, zoals het is op deze dag;", "Jak 4:13-16": "Kom nu, u die zegt: Wij zullen vandaag of morgen naar die en die stad reizen, en daar een jaar doorbrengen, en handel drijven, en winst maken. U weet niet wat morgen gebeuren zal, want hoe is uw leven? Het is immers een damp, die voor een korte tijd zichtbaar is, en daarna verdwijnt. In plaats daarvan zou u moeten zeggen: Als de Heere het wil, en wij leven, zullen wij dit of dat doen.", "Matt 28:5": "Maar de engel antwoordde en zei tegen de vrouwen: Wees u niet bang; want ik weet dat u Jezus zoekt, Die gekruisigd was.", "Ps 84:12": "Want God, de HEERE, is een Zon en Schild; de HEERE zal genade en eer geven; Hij zal het goede niet onthouden aan hen die in oprechtheid wandelen.", "Jes 26:14": "Zij die dood zijn, zullen niet opnieuw leven, overledenen zullen niet opstaan; daarom hebt U hen bezocht en hebt U hen verdelgd, en U hebt al hun gedachtenis doen vergaan.", "1 Sam 18:6": "Het gebeurde nu, toen zij kwamen, en David terugkeerde van het verslaan van de Filistijn, dat de vrouwen uit al de steden van Israël uitgingen, met gezang en reidansen, koning Saul tegemoet, met tamboerijnen, met vreugde en met muziekinstrumenten.", "Jer 2:20": "Toen Ik van oude tijden af uw juk verbroken, en uw banden verscheurd had, zei u: Ik zal niet dienen; maar op alle hoge heuvels en onder elke groene boom loopt u om, hoererend.", "Jes 2:3": "En veel volken zullen heengaan en zeggen: Kom, laat ons opgaan tot de berg van de HEERE, tot het huis van de God van Jakob, opdat Hij ons leert van Zijn wegen, en dat wij wandelen in Zijn paden; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem.", "Jes 22:2": "U, die vol was van groot rumoer, u woelige stad, u, vrolijk huppelende stad, uw gesneuvelden zijn niet gesneuveld door het zwaard, en ook niet gestorven in de strijd.", "Jak 4:6": "Ja, Hij geeft meer genade. Daarom zegt de Schrift: God weerstaat de hoogmoedigen, maar de nederigen geeft Hij genade.", "Deut 28:38-42": "U zult veel zaad naar de akker uitbrengen, maar u zult weinig inzamelen; want de sprinkhaan zal het opeten. Wijngaarden zult u planten en bewerken, maar u zult geen wijn drinken, noch iets vergaren; want de worm zal het opeten. Olijfbomen zult u hebben binnen al uw grondgebied, maar u zult u met olie niet zalven; want uw olijfboom zal zijn vrucht afwerpen.", "Jes 60:17": "Voor koper zal Ik goud brengen, en voor ijzer zal Ik zilver brengen, en voor hout koper, en voor stenen ijzer; en Ik zal uw opzieners vreedzaam maken, en uw drijvers rechtvaardig.", "Spr 16:33": "Het lot wordt in de schoot geworpen; maar de hele beschikking daarover is van de HEERE.", "Joël 2:11": "En de HEERE verheft Zijn stem voor Zijn leger uit; want Zijn leger is zeer groot, want Hij is machtig, Hij die Zijn woord uitvoert; want de dag van de HEERE is groot en zeer vreselijk, en wie zal hem kunnen verdragen?", "Zef 3:18": "De bedroefden, om de bijeenkomst, zal Ik verzamelen, zij zijn uit u; de smaad is een last op haar.", "Jes 42:13": "De HEERE zal uittrekken als een held; Hij zal de ijver opwekken als een krijgsman; Hij zal juichen, ja, Hij zal een groot geschreeuw maken; Hij zal Zijn vijanden overweldigen.", "Jer 22:19": "Met een ezelsbegrafenis zal hij begraven worden; men zal hem slepen en wegwerpen, ver weg van de poorten van Jeruzalem.", "Jes 7:22": "En het zal gebeuren, dat hij vanwege de overvloed van de melk, die zij geven zullen, boter zal eten; ja, ieder die overgebleven is in het midden van het land, die zal boter en honing eten.", "Jes 41:17": "De ellendigen en behoeftigen zoeken water, maar er is geen; hun tong versmacht van dorst; Ik, de HEERE, zal hen verhoren, Ik, de God van Israël, zal hen niet verlaten.", "1 Kron 6:31": "Dezen nu zijn het die David heeft aangesteld voor het ambt van het gezang in het huis van de HEERE, nadat de ark tot rust was gekomen.", "Joh 3:6": "Wat uit het vlees geboren is, dat is vlees; en wat uit de Geest geboren is, dat is geest.", "Spr 30:12": "Een geslacht dat rein is in zijn eigen ogen, en toch niet gewassen is van zijn vuiligheid;", "Job 9:10": "Die grote dingen doet, die men niet doorzoeken kan; en wonderen, die men niet tellen kan.", "Rom 2:7": "Hun die volhardend goeddoen en heerlijkheid, en eer, en onvergankelijkheid zoeken, het eeuwige leven;", "Dan 4:35": "En alle inwoners van de aarde worden als niets geacht, en Hij doet naar Zijn wil met het leger van de hemel en de inwoners van de aarde, en er is niemand die Zijn hand kan tegenhouden, of tegen Hem kan zeggen: Wat doet U?", "Jer 14:15-22": "Daarom zegt de HEERE zo: Aangaande de profeten, die in Mijn Naam profeteren, terwijl Ik hen niet gezonden heb, en zij toch nog zeggen: Er zal geen zwaard noch honger in dit land zijn; diezelfde profeten zullen door het zwaard en door de honger verteerd worden. En het volk, tot wie zij profeteren, zal op de straten van Jeruzalem weggeworpen zijn vanwege de honger en het zwaard; en er zal niemand zijn die hen kan begraven, hen, hun vrouwen, en hun zonen, en hun dochters; zo zal Ik hun slechtheid over hen uitstorten. Daarom zult u dit woord tegen hen zeggen: Mijn ogen zullen van tranen neerdalen, nacht en dag, en niet ophouden; want de jonkvrouw, de dochter van Mijn volk, is gebroken met een grote breuk, een plaag die zeer smartelijk is.", "1 Tim 3:15": "maar als ik langer wegblijf, opdat u weet hoe men zich moet gedragen in het huis van God, dat is de Gemeente van de levende God, een pilaar en fundament van de waarheid.", "Rom 6:23": "Want het loon van de zonde is de dood, maar de genadegift van God is het eeuwige leven, door Jezus Christus, onze Heere.", "2 Kron 16:9": "Want wat de HEERE betreft, Zijn ogen doorlopen de hele aarde, om Zich sterk te bewijzen aan hen wier hart volkomen is tot Hem; hierin heeft u dwaas gedaan; want van nu af zullen er oorlogen tegen u zijn.", "2 Petr 2:10": "maar vooral hen, die naar het vlees wandelen in onreine begeerte, en het gezag verachten; die vermetel zijn, zichzelf behagen, en die er niet voor terugschrikken de heerlijkheden te lasteren;", "Jes 7:3": "En de HEERE zei tegen Jesaja: Ga nu uit, Achaz tegemoet, u en uw zoon, Schear-Jaschub, aan het einde van de watergang van de bovenste vijver, aan de hoge weg van het veld van de voller;", "Jak 1:12": "Gelukkig is de man die verzoeking verdraagt; want als hij beproefd zal zijn geweest, zal hij de kroon van het leven ontvangen, die de Heere beloofd heeft aan hen die Hem liefhebben.", "Hab 3:15": "U betrad met Uw paarden de zee; het geweldige water werd een hoop.", "Jer 32:28": "Daarom zegt de HEERE zo: Zie, Ik geef deze stad in de hand van de Chaldeeën, en in de hand van Nebukadnezar, de koning van Babel, en hij zal haar innemen.", "Ezra 8:23": "Zo vastten wij en verzochten dat van onze God; en Hij liet Zich door ons verbidden.", "Jer 50:32": "Dan zal de trotse aanstoten en vallen, en er zal niemand zijn die hem opricht; ja, Ik zal een vuur aansteken in zijn steden, dat zal alle plaatsen rondom hem verteren.", "1 Kron 25:5": "Deze allen waren kinderen van Heman, de ziener van de koning, in de woorden van God, om de hoorn te verheffen; want God had Heman veertien zonen gegeven, en drie dochters.", "Jer 8:2": "En zij zullen ze uitspreiden voor de zon, en voor de maan, en voor het hele heerleger van de hemel, die zij liefgehad hebben, en die zij gediend hebben, en die zij nagevolgd hebben, en die zij gezocht hebben, en voor wie zij zich neergebogen hebben; zij zullen niet verzameld noch begraven worden; tot mest op de aardbodem zullen zij zijn.", "1 Sam 9:16": "Morgen omstreeks deze tijd zal Ik naar u een man sturen uit het land van Benjamin, die zult u tot voorganger zalven over Mijn volk Israël; en hij zal Mijn volk verlossen uit de hand van de Filistijnen, want Ik heb naar Mijn volk omgezien, omdat hun geroep tot Mij gekomen is.", "Ex 11:7": "Maar bij alle kinderen van Israël zal geen hond zijn tong bewegen, van de mensen af tot de beesten toe; opdat u weet dat de HEERE tussen de Egyptenaren en tussen de Israëlieten een afzondering maakt.", "Ezech 34:25-28": "En Ik zal een verbond van vrede met hen maken, en zal het boze gedierte uit het land doen ophouden; en zij zullen zeker wonen in de woestijn, en slapen in de wouden. Want Ik zal hen, en de plaatsen rondom Mijn heuvel, stellen tot een zegen; en Ik zal de plasregen doen neerdalen op zijn tijd, plasregens van zegen zullen er zijn. En het geboomte van het veld zal zijn vrucht geven, en het land zal zijn opbrengst geven, en zij zullen zeker zijn in hun land; en zullen weten, dat Ik de HEERE ben, als Ik de disselbomen van hun juk zal hebben verbroken, en hen gered heb uit de hand van hen die zich door hen deden dienen.", "Jes 13:21": "Maar daar zullen de wilde dieren van de woestijnen neerliggen, en hun huizen zullen vervuld worden met angstaanjagende dieren, en daar zullen de jonge struisvogels wonen, en de bokachtige demonen zullen er springen.", "1 Kor 8:1": "Wat betreft de dingen die aan de afgoden geofferd zijn: wij weten dat wij allemaal samen kennis hebben. De kennis maakt opgeblazen, maar de liefde sticht.", "Jes 29:15": "Wee hun die zich diep willen verbergen voor de HEERE, hun raad verbergend; en wier werken in duisternis gebeuren, en zij zeggen: Wie ziet ons, en wie kent ons?", "Ps 145:6": "Vau. En zij zullen vermelden de kracht van Uw ontzagwekkende daden; en Uw grootheid, die zal ik vertellen.", "Ps 147:11": "De HEERE schept vreugde in hen die Hem vrezen, die op Zijn goedertierenheid hopen.", "Job 31:15": "Heeft Hij niet, Die mij in de buik maakte, hem ook gemaakt en Een ons in de baarmoeder bereid?)", "Jes 43:13": "Ook eer de dag was, ben Ik, en er is niemand, die uit Mijn hand redden kan; Ik zal werken, en wie zal het keren?", "Spr 17:19": "Die het gekijf liefheeft, heeft de overtreding lief; die zijn deur verhoogt, zoekt zijn ondergang.", "1 Tim 6:17": "Beveel de rijken in deze tegenwoordige wereld dat zij niet hoogmoedig zijn, en ook niet hun hoop stellen op de onzekerheid van de rijkdom, maar op de levende God, Die ons alle dingen rijkelijk verleent om ervan te genieten;", "2 Kron 28:8-15": "En de kinderen van Israël voerden van hun broeders tweehonderdduizend gevangenen weg, vrouwen, zonen en dochters, en plunderden ook veel roof van hen; en zij brachten de roof naar Samaria. Daar nu was een profeet van de HEERE, wiens naam Oded was; die ging naar buiten, het leger tegemoet dat naar Samaria kwam, en zei tegen hen: Zie, door de grimmigheid van de HEERE, de God van uw vaderen, over Juda, heeft Hij hen in uw hand gegeven, en u hebt hen doodgeslagen in een toorn die tot aan de hemel raakt. Daartoe denkt u er nu aan om de kinderen van Juda en Jeruzalem u tot slaven en slavinnen te onderwerpen; bent u het zelf niet die schuldig staan? Bij u zijn schulden tegen de HEERE, uw God.", "2 Kon 20:19": "Maar Hizkia zei tegen Jesaja: Het woord van de HEERE, dat u gesproken hebt, is goed. Ook zei hij: Zou het niet goed zijn, als er vrede en waarheid in mijn dagen zal zijn?", "Job 27:19-23": "Rijk ligt hij neder, en wordt niet weggenomen; doet hij zijn ogen open, zo is hij er niet. Verschrikkingen zullen hem als water aangrijpen; 's nachts zal hem een wervelwind wegstelen. De oostenwind zal hem wegvoeren, dat hij heengaat, en zal hem wegstormen uit zijn plaats.", "Job 14:13": "Och, wilde U mij toch in het graf verbergen, mij verstoppen, totdat Uw toorn zich afkeerde; dat U mij een vaste tijd stelde, en aan mij zou denken!", "Obadja 1:4": "Al verheft u zich als de arend, en al zet u uw nest tussen de sterren, toch zal Ik u vandaar neerstoten, spreekt de HEERE.", "Mark 6:50": "want zij zagen Hem allen, en werden verschrikt; en meteen sprak Hij met hen, en zei tegen hen: Heb goede moed, Ik ben het; vrees niet.", "Nahum 1:7": "De HEERE is goed, Hij is een sterkte op de dag van benauwdheid, en Hij kent hen die op Hem vertrouwen.", "Ezech 39:25": "Daarom zegt de Heere HEERE zo: Nu zal Ik de gevangenen van Jakob terugbrengen, en Ik zal Mij ontfermen over heel het huis van Israël, en Ik zal ijveren voor Mijn heilige Naam;", "Luk 21:11": "En er zullen grote aardbevingen zijn op verscheidene plaatsen, en hongersnoden, en pestilentiën; er zullen ook schrikwekkende dingen, en grote tekenen van de hemel gebeuren.", "1 Kor 1:21": "Want omdat de wereld God, in de wijsheid van God, niet door de wijsheid heeft gekend, heeft het God behaagd om door de dwaasheid van de prediking zalig te maken hen die geloven;", "Spr 3:23": "Dan zult u uw weg zeker gaan, en u zult uw voet niet stoten.", "Ps 34:20": "Resch. Veel is de tegenspoed van de rechtvaardige; maar uit dat alles redt de HEERE hem.", "Jes 43:17": "Die wagens en paarden, leger en macht voortbracht; samen zijn zij neergelegen, zij zullen niet weer opstaan, zij zijn uitgeblust, als een vlaswiek zijn zij uitgegaan.", "Amos 5:8": "Die het Zevengesternte en de Orion maakt, en de doodsschaduw in de morgen verandert, en de dag als de nacht verduistert; Die de wateren van de zee roept, en ze uitgiet over de aardbodem, HEERE is Zijn Naam.", "Joh 3:14-16": "En zoals Mozes de slang in de woestijn verhoogd heeft, zo moet de Zoon des mensen verhoogd worden; Opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft. Want zo lief heeft God de wereld gehad, dat Hij Zijn eniggeboren Zoon gegeven heeft, opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft.", "Matt 19:17": "En Hij zei tegen hem: Wat noemt u Mij goed? Niemand is goed dan Eén, namelijk God. Maar wilt u het leven ingaan, onderhoud de geboden.", "Spr 29:13": "De arme en de bedrieger ontmoeten elkaar; de HEERE verlicht hun beider ogen.", "Ps 145:20": "Schin. De HEERE bewaart allen die Hem liefhebben; maar Hij verdelgt alle goddelozen.", "Jes 28:16": "Daarom, zo zegt de Heere HEERE: Zie, Ik leg een grondsteen in Sion, een beproefde steen, een kostbare hoeksteen, die stevig gegrondvest is; wie gelooft, die zal niet haasten.", "Hebr 11:10": "Want hij verwachtte de stad die fundamenten heeft, waarvan God de Ontwerper en Bouwer is.", "2 Sam 22:13": "Van de glans voor Hem heen werden kolen van het vuur aangestoken.", "Hos 7:10": "Daarom zal de hoogmoed van Israël in zijn aangezicht getuigen; omdat zij zich niet bekeren tot de Heere, hun God, en Hem ook niet zoeken bij dit alles.", "Jes 49:16-23": "Zie, Ik heb u in de beide handpalmen gegraveerd; uw muren zijn steeds voor Mij. Uw zonen zullen zich haasten; maar uw verstoorders en uw verwoesters zullen van u uitgaan. Hef uw ogen op rondom, en zie, al dezen verzamelen zich, zij komen tot u; Zo waarachtig als Ik leef, spreekt de HEERE, zeker zult u zich met al dezen als met een sieraad bekleden, en u zult ze u aanbinden, zoals een bruid.", "Job 21:19": "Dat God Zijn geweld weglegt voor Zijn kinderen, hem vergeldt, zodat hij het gewaarwordt;", "Ps 135:2": "U, die staat in het huis van de HEERE, in de voorhoven van het huis van onze God!", "Joh 16:33": "Deze dingen heb Ik tot u gesproken, opdat u in Mij vrede hebt. In de wereld zult u verdrukking hebben, maar heb goede moed, Ik heb de wereld overwonnen.", "Ezech 25:15-17": "Zo zegt de Heere HEERE: Omdat de Filistijnen uit wraak gehandeld hebben, en van harte wraak geoefend hebben door plundering, om te vernielen vanuit een eeuwige vijandschap; Daarom, zo zegt de Heere HEERE: Zie, Ik strek Mijn hand uit tegen de Filistijnen, en Ik zal de Cherethieten uitroeien, en het overblijfsel van de zeehaven doen verdwijnen. En Ik zal grote wraak met grimmige straffen onder hen voltrekken; en zij zullen weten dat Ik de HEERE ben, wanneer Ik Mijn wraak aan hen zal hebben voltrokken.", "Ezech 34:22": "Daarom zal Ik Mijn schapen verlossen, zodat zij niet meer tot een roof zullen zijn; en Ik zal richten tussen klein vee en klein vee.", "Joh 14:1": "Laat uw hart niet ontroerd worden; u gelooft in God, geloof ook in Mij.", "1 Sam 14:6": "Jonathan nu zei tegen de jongen die zijn wapens droeg: Kom, laten we naar de bezetting van deze onbesnedenen oversteken; misschien zal de HEERE voor ons werken, want bij de HEERE is geen belemmering om te verlossen door velen of door weinigen.", "2 Kon 21:13": "En Ik zal over Jeruzalem het meetsnoer van Samaria trekken, alsook het paslood van het huis van Achab; en Ik zal Jeruzalem uitwissen, zoals men een schotel uitwist; men wist hem uit, en men keert hem om op zijn holle kant.", "Jer 13:9": "Zo zegt de HEERE: Zo zal Ik de hoogmoed van Juda verderven, en die grote hoogmoed van Jeruzalem.", "Matt 25:34-36": "Dan zal de Koning zeggen tegen hen die aan Zijn rechterhand zijn: Kom, u gezegenden van Mijn Vader! Beërf het Koninkrijk dat voor u bereid is vanaf de grondlegging van de wereld. Want Ik ben hongerig geweest, en u hebt Mij te eten gegeven; Ik ben dorstig geweest, en u hebt Mij te drinken gegeven; Ik was een vreemdeling, en u hebt Mij een onderkomen gegeven. Ik was naakt, en u hebt Mij gekleed; Ik ben ziek geweest, en u hebt Mij bezocht; Ik was in de gevangenis, en u bent bij Mij gekomen.", "Matt 10:29-31": "Worden niet twee musjes voor een penninkje verkocht? En niet één daarvan zal op de aarde vallen zonder uw Vader. En ook uw haren van het hoofd zijn alle geteld. Vreest dan niet; u gaat vele musjes te boven.", "Job 37:1-23": "Ook hierover beeft mijn hart, en springt op uit zijn plaats. Hoort met aandacht naar de beweging van Zijn stem, en het geluid dat uit Zijn mond uitgaat! Dat zendt Hij rechtuit onder de hele hemel, en Zijn licht over de einden der aarde.", "Ps 52:9": "Zie de man, die God niet tot Zijn Sterkte stelde, maar vertrouwde op de overvloed van het rijkdom; hij was sterk geworden door zijn beschadigen.", "Openb 7:3": "en hij zei: Breng de aarde geen schade toe, of de zee, of de bomen, totdat wij de dienstknechten van onze God verzegeld hebben aan hun voorhoofden.", "Ps 112:7": "Mem. Hij zal voor geen kwaad gerucht bang zijn; Nun. zijn hart is vast, vertrouwend op de HEERE.", "Ps 49:8-10": "niemand van hen zal zijn broeder ooit kunnen verlossen; hij zal aan God zijn losprijs niet kunnen geven; (want de verlossing van hun ziel is te kostbaar, en zal voor eeuwig ophouden); dat hij ook voortaan voor altijd zou leven, en de vergankelijkheid niet zien.", "Ps 72:2": "Zo zal hij Uw volk richten met gerechtigheid, en Uw ellendigen met recht.", "Jes 11:15": "Ook zal de HEERE de inham van de zee van Egypte verbannen, en Hij zal Zijn hand bewegen tegen de rivier, door de sterkte van Zijn wind; en Hij zal die slaan in de zeven stromen, en Hij zal maken dat men er met schoenen doorheen zal gaan.", "1 Kor 10:12": "Wie dan meent te staan, laat hij toezien dat hij niet valt.", "Jes 41:10": "Vrees niet, want Ik ben met u; wees niet verbaasd, want Ik ben uw God; Ik sterk u, ook help Ik u, ook ondersteun Ik u met de rechterhand van Mijn gerechtigheid.", "Spr 21:30": "Er is geen wijsheid, en er is geen verstand, en er is geen raad tegen de HEERE.", "2 Kon 19:23": "Door uw boden hebt u de Heere gehoond, en gezegd: Ik heb met de menigte van mijn wagens de hoogten van de bergen beklommen, de flanken van de Libanon; en ik zal zijn hoge cederbomen en zijn uitgelezen dennenbomen omhakken; en ik zal komen tot in zijn verste herberg, in het woud van zijn mooie veld.", "Jes 23:7": "Is dit uw vrolijk huppelende stad? Wier oudheid van oude dagen af is; maar haar eigen voeten zullen haar ver wegdragen, om als vreemdeling te verblijven.", "Ezech 31:11": "daarom gaf Ik hem in de hand van de machtigste van de heidenvolken, zodat die hem naar recht zou behandelen; Ik dreef hem uit om zijn goddeloosheid.", "Jes 33:3": "Van het geluid van het rumoer zullen de volken wegvluchten; van Uw verhoging zullen de heidenvolken verstrooid worden.", "Dan 4:37": "Nu prijs ik, Nebukadnezar, en verhoog, en verheerlijk de Koning van de hemel, omdat al Zijn werken waarheid, en Zijn paden gerechtigheid zijn; en Hij is machtig te vernederen wie in hoogmoed wandelen.", "Hebr 12:23": "Tot de algemene vergadering en de gemeente van de eerstgeborenen, die in de hemelen opgeschreven zijn, en tot God, de Rechter over allen, en de geesten van de rechtvaardigen die volmaakt gemaakt zijn;", "2 Tim 4:8": "Verder ligt voor mij de kroon van de rechtvaardigheid klaar, die de Heere, de rechtvaardige Rechter, mij op die dag geven zal; en niet alleen mij, maar ook allen die Zijn verschijning hebben liefgehad.", "Spr 29:4": "Een koning houdt het land staande door recht; maar wie tot geschenken geneigd is, verstoort het.", "Gal 6:2": "Draag elkaars lasten, en vervul zo de wet van Christus.", "Amos 1:6-8": "Zo zegt de HEERE: Om drie overtredingen van Gaza, en om vier zal Ik dat niet afwenden; omdat zij Mijn volk als gevangenen hebben weggevoerd, met een volledige wegvoering, om aan Edom over te leveren. Daarom zal Ik een vuur zenden in de muur van Gaza, dat zal haar paleizen verteren. En Ik zal de inwoner uitroeien uit Asdod, en hem die de scepter houdt, uit Askelon; en Ik zal Mijn hand keren tegen Ekron, en het overblijfsel van de Filistijnen zal vergaan, zegt de Heere HEERE.", "Openb 22:7": "Zie, Ik kom haastig; zalig is hij die de woorden van de profetie van dit boek bewaart.", "Amos 5:23": "Doe het lawaai van uw liederen van Mij weg; ook wil Ik het spel van uw luiten niet horen.", "Jes 59:19": "Dan zullen zij de Naam van de HEERE vrezen vanaf de neergang, en Zijn heerlijkheid vanaf de opgang van de zon; als de vijand zal komen als een stroom, zal de Geest van de HEERE de banier tegen hem oprichten.", "Jes 14:1-3": "Want de HEERE zal Zich over Jakob ontfermen, en Hij zal Israël nog verkiezen, en Hij zal hen in hun land zetten; en de vreemdeling zal zich bij hen voegen, en zij zullen het huis van Jakob aanhangen. En de volken zullen hen aannemen, en naar hun plaats brengen; en het huis van Israël zal hen erfelijk bezitten in het land van de HEERE tot knechten en tot dienstmeisjes; en zij zullen gevangen houden wie hen gevangen hielden, en zij zullen heersen over hun onderdrukkers. En het zal gebeuren op de dag, wanneer de HEERE u rust zal geven van uw smart, en van uw onrust, en van de harde dienstbaarheid waarin men u heeft laten dienen,", "Matt 23:35": "opdat over u komt al het rechtvaardige bloed dat vergoten is op de aarde, vanaf het bloed van de rechtvaardige Abel tot het bloed van Zacharia, de zoon van Barachia, die u gedood hebt tussen de tempel en het altaar.", "Jer 34:2": "Zo zegt de HEERE, de God van Israël: Ga heen en spreek tot Zedekia, de koning van Juda, en zeg tegen hem: Zo zegt de HEERE: Zie, Ik geef deze stad in de hand van de koning van Babel, en hij zal ze met vuur verbranden.", "Ps 22:27": "De zachtmoedigen zullen eten en verzadigd worden; zij zullen de HEERE prijzen, die Hem zoeken; uw hart zal in eeuwigheid leven.", "Jes 66:20": "En zij zullen al uw broeders uit alle heidenen naar de HEERE brengen als spijsoffer, op paarden, en op wagens, en op draagstoelen, en op muildieren, en op snelle lopers, naar Mijn heilige berg toe, naar Jeruzalem, zegt de HEERE, zoals de kinderen van Israël het spijsoffer in een rein vat brengen naar het huis van de HEERE.", "Spr 13:10": "Door hoogmoed maakt men niet dan gekijf; maar bij hen die zich laten raden is wijsheid.", "Luk 9:25": "Want wat baat het een mens als hij de hele wereld zou winnen, en zichzelf verliezen of schade lijden?", "Nahum 3:19": "Er is geen genezing voor uw breuk, uw plaag is smartelijk; allen die het gerucht van u horen, zullen de handen over u klappen; want over wie is uw boosheid niet voortdurend gegaan?", "Jes 42:3": "Het geknakte riet zal Hij niet breken, en de rokende vlaswiek zal Hij niet uitblussen; met waarheid zal Hij het recht voortbrengen.", "Spr 11:8": "De rechtvaardige wordt uit benauwdheid bevrijd; en de goddeloze komt in zijn plaats.", "Spr 29:8": "Spotters brengen een stad in vuur en vlam; maar de wijzen keren de toorn af.", "Hebr 11:5": "Door het geloof is Henoch weggenomen, zodat hij de dood niet zou zien; en hij werd niet gevonden, omdat God hem weggenomen had; want vóór zijn wegneming had hij het getuigenis dat hij God behaagde.", "Luk 20:36-38": "want zij kunnen niet meer sterven, want zij zijn gelijk aan de engelen; en zij zijn kinderen van God, omdat zij kinderen van de opstanding zijn. En dat de doden opgewekt zullen worden, heeft ook Mozes aangewezen bij de doornstruik, toen hij de Heere de God van Abraham noemt, en de God van Izak, en de God van Jakob. God is niet een God van de doden, maar van de levenden; want voor Hem leven zij allen.", "Jes 38:19": "De levende, de levende, die zal U loven, zoals ik heden doe; de vader zal aan de kinderen Uw waarheid bekendmaken.", "Zef 2:10": "Dat zullen zij hebben in plaats van hun hoogmoed; want zij hebben beschimpt, en zich groot gemaakt tegen het volk van de HEERE van de heerscharen.", "Jer 9:14": "Maar hebben gewandeld naar het goeddunken van hun hart, en naar de Baäls, wat hun vaders hun geleerd hadden.", "Zach 4:7": "Wie bent u, o grote berg? Voor het aangezicht van Zerubbabel zult u worden tot een vlak veld; want hij zal de hoofdsteen naar voren brengen onder toeroepingen: Genade, genade zij hem!", "1 Kor 2:5": "Opdat uw geloof niet zou berusten op wijsheid van mensen, maar op de kracht van God.", "Jes 5:15": "Dan zal de gewone man neergebogen worden, en de aanzienlijke man zal vernederd worden, en de ogen van de hoogmoedigen zullen vernederd worden.", "Luk 18:14": "Ik zeg u: deze ging gerechtvaardigd naar zijn huis, meer dan die ander; want ieder die zichzelf verhoogt, zal vernederd worden, en die zichzelf vernedert, zal verhoogd worden.", "Openb 3:9": "Zie, Ik geef u er sommigen uit de synagoge van de satan, van hen die zeggen dat zij Joden zijn, en het niet zijn, maar liegen; zie, Ik zal maken dat zij zullen komen, en aanbidden voor uw voeten, en erkennen dat Ik u liefheb.", "Num 23:23": "Want er is geen toverij tegen Jakob, en geen waarzeggerij tegen Israël. Op dit moment zal van Jakob gezegd worden, en van Israël, wat God tot stand gebracht heeft.", "Mal 4:1": "Want zie, die dag komt, brandend als een oven. Dan zullen alle hoogmoedigen, en ieder die goddeloosheid doet, een stoppel zijn, en de komende dag zal ze in vlam zetten, zegt de HEERE van de heerscharen, Die hun noch wortel, noch tak laten zal.", "Jes 13:11": "Want Ik zal over de wereld de boosheid bezoeken, en over de goddelozen hun ongerechtigheid; en Ik zal de hoogmoed van de trotsen doen ophouden, en de hovaardij van de tirannen zal Ik vernederen.", "Num 16:41": "Maar de volgende dag morde de hele vergadering van de kinderen van Israël tegen Mozes en tegen Aäron, en zei: U hebt het volk van de HEERE gedood!", "Jes 54:4": "Vrees niet, want u zult niet beschaamd worden, en word niet schaamrood, want u zult niet te schande worden; maar u zult de schaamte van uw jonkheid vergeten, en de smaad van het weduwschap zult u niet meer gedenken.", "2 Sam 22:28": "En U verlost het bedrukte volk; maar Uw ogen zijn tegen de hoogmoedigen, U zult hen vernederen.", "Ps 102:18": "Zich gewend zal hebben tot het gebed van hem die geheel ontbloot is, en niet versmaad hebben hun gebed;", "Zach 4:6": "Toen antwoordde Hij en sprak tegen mij: Dit is het woord van de HEERE tot Zerubbabel: Niet door kracht, ook niet door geweld, maar door Mijn Geest zal het gebeuren, zegt de HEERE van de heerscharen.", "Ps 104:29": "Verbergt U Uw gezicht, zij worden angstig; neemt U hun adem weg, zij sterven, en zij keren terug tot hun stof.", "Jer 12:16": "En het zal gebeuren, als zij de wegen van Mijn volk vlijtig zullen leren, zwerend bij Mijn Naam: Zo waarachtig als de HEERE leeft! – zoals zij Mijn volk geleerd hebben te zweren bij Baäl – dan zullen zij te midden van Mijn volk gebouwd worden.", "Jes 47:1-15": "Daal af en ga zitten in het stof, jonkvrouw, dochter van Babel! Zit op de aarde, er is geen troon meer, dochter van de Chaldeeën! Want u zult niet meer genoemd worden de tedere, of de wellustige. Neem de molen en maal meel; ontdek uw vlechten, ontbloot de enkels, ontdek de schenkels, ga door de rivieren. Uw schaamte zal ontdekt worden, ook zal uw schande gezien worden; Ik zal wraak nemen, en Ik zal u niet aanvallen als een mens.", "Jes 54:15": "Zie, zij zullen zich zeker verzamelen, maar niet uit Mij; wie zich tegen u verzamelen zal, die zal om uw wil vallen.", "Ps 129:5": "Laat hen beschaamd worden en achteruitgedreven, allen die Sion haten.", "2 Kron 25:9": "En Amazia zei tegen de man van God: Maar wat moet men doen met de honderd talenten, die ik aan de troepen van Israël gegeven heb? En de man van God zei: De HEERE heeft meer dan dit, om u te geven.", "Ps 126:1-3": "Een lied Hammaäloth. Toen de HEERE de gevangenen van Sion terugbracht, waren wij als mensen die dromen. Toen was onze mond vol lachen, en onze tong vol gejuich; toen zei men onder de heidenvolken: De HEERE heeft grote dingen aan hen gedaan. De HEERE heeft grote dingen bij ons gedaan; daarom zijn wij verblijd.", "Jer 50:8": "Vlucht weg uit het midden van Babel, en trek uit het land van de Chaldeeën, en wees als de bokken vooraan de kudde.", "Joh 6:44": "Niemand kan tot Mij komen, als de Vader, Die Mij gezonden heeft, hem niet trekt; en Ik zal hem opwekken op de laatste dag.", "Dan 3:17": "Als het zo is, onze God, Die wij eren, is machtig om ons te verlossen uit de brandende vuuroven, en Hij zal ons uit uw hand, o koning, verlossen.", "1 Petr 3:13": "En wie is het die u kwaad zal doen, als u navolgers bent van het goede?", "Fil 2:3": "Doe niets uit twist of ijdele eer, maar acht door ootmoedigheid de een de ander voortreffelijker dan uzelf.", "Jer 51:62-64": "En u zult zeggen: O HEERE, U hebt over deze plaats gesproken, dat U ze zult uitroeien, zodat er geen inwoner in is, van de mens tot het dier, maar dat zij zal worden tot eeuwige woestenijen. En het zal gebeuren, als u deze rol geheel gelezen hebt, dat u er een steen aan zult binden, en hem zult werpen in het midden van de Eufraat; En zult zeggen: Zo zal Babel zinken, en niet meer opkomen, vanwege het kwaad dat Ik over haar zal brengen, en zij zullen moe worden. Tot hiertoe zijn de woorden van Jeremia.", "Hos 2:14": "En Ik zal haar haar wijngaarden geven van daaraf, en het dal Achor, tot een deur van hoop; en daar zal zij zingen, als in de dagen van haar jeugd, e
