:"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"In die dagen werd Hizkia ziek tot de dood toe; en de profeet Jesaja, de zoon van Amoz, kwam bij hem en zei tegen hem: Zo zegt de HEERE: Regel uw zaken; want u zult sterven en niet leven.","2":"Toen keerde Hizkia zijn gezicht om naar de wand, en hij bad tot de HEERE.","3":"En hij zei: Och HEERE, denk er toch aan dat ik voor Uw gezicht in waarheid en met een volkomen hart gewandeld heb, en dat ik gedaan heb wat goed is in Uw ogen. En Hizkia huilde erg hard.","4":"Toen kwam het woord van de HEERE tot Jesaja en Hij zei:","5":"Ga heen en zeg tegen Hizkia: Zo zegt de HEERE, de God van uw vader David: Ik heb uw gebed gehoord, Ik heb uw tranen gezien; zie, Ik zal vijftien jaren aan uw dagen toevoegen;","6":"En Ik zal u uit de hand van de koning van Assyrië verlossen, alsook deze stad; en Ik zal deze stad beschermen.","7":"En dit zal u een teken zijn van de HEERE, dat de HEERE het woord dat Hij gesproken heeft, doen zal:","8":"Zie, Ik zal de schaduw van de graden, die met de zon in de graden van de *zonnewijzer* van Achaz omlaag gegaan is, tien graden achterwaarts doen keren. Zo is de zon tien graden teruggekeerd, in de graden die zij omlaag gegaan was.","9":"*Dit* is het schrift van Hizkia, koning van Juda, toen hij ziek geweest was en van zijn ziekte genezen was.","10":"Ik zei: Vanwege het afsnijden van mijn dagen zal ik naar de poorten van het graf gaan, ik word beroofd van wat er nog over is van mijn jaren.","11":"Ik zei: Ik zal de HEERE niet *meer* zien, de HEERE, in het land van de levenden; ik zal de mensen niet meer aanschouwen met de inwoners van de wereld.","12":"Mijn levenstijd is weggetrokken, en van mij weggevoerd als de tent van een herder; ik heb mijn leven afgesneden, zoals een wever *zijn* *weefsel*; Hij zal mij afsnijden, als van de drom; van de dag tot de nacht zult U mij ten einde gebracht hebben.","13":"Ik stelde mij gerust tot de morgenstond toe; zoals een leeuw, zo zal Hij al mijn beenderen breken; van de dag tot de nacht zult U mij ten einde gebracht hebben.","14":"Zoals een kraanvogel *of* zwaluw, zo piepte ik; ik kirde als een duif; mijn ogen keken smachtend omhoog; o HEERE! ik word onderdrukt, wees Gij mijn Borg.","15":"Wat zal ik spreken? Zoals Hij het mij heeft toegezegd, zo heeft Hij het gedaan; ik zal *nu* al zoetjes voortgaan al mijn jaren, vanwege de bitterheid van mijn ziel.","16":"Heere, door deze dingen leeft men, en in dit alles is het leven van mijn geest; want Gij hebt mij gezond gemaakt en mij genezen.","17":"Zie, in vrede is mij de bitterheid bitter geweest; maar Gij hebt mijn ziel liefdevol omhelsd, zodat zij niet in de groeve van de vertering kwam; want Gij hebt al mijn zonden achter Uw rug geworpen.","18":"Want het graf zal U niet loven, de dood zal U *niet* prijzen; wie in de kuil neerdalen, zullen op Uw waarheid niet hopen.","19":"De levende, de levende, die zal U loven, zoals ik heden *doe*; de vader zal aan de kinderen Uw waarheid bekendmaken.","20":"De HEERE was *gereed* om mij te verlossen; daarom zullen wij op mijn snarenspel spelen, al de dagen van ons leven, in het huis van de HEERE.","21":"Jesaja nu had gezegd: Laat men een klomp vijgen nemen en tot een pleister op het gezwel maken, en hij zal genezen.","22":"En Hizkia had gezegd: Wat zal het teken zijn dat ik naar het huis van de HEERE zal opgaan?"},"SV":{"1":"In die dagen werd Hizkia krank tot stervens toe; en de profeet Jesaja, de zoon van Amoz, kwam tot hem, en zeide tot hem: Alzo zegt de HEERE: Geef bevel aan uw huis; want gij zult sterven, en niet leven.","2":"Toen keerde Hizkia zijn aangezicht om naar den wand, en hij bad tot den HEERE.","3":"En hij zeide: Och HEERE, gedenk toch, dat ik voor Uw aangezicht in waarheid en met een volkomen hart gewandeld, en wat goed in Uw ogen is, gedaan heb. En Hizkia weende gans zeer.","4":"Toen geschiedde het woord des HEEREN tot Jesaja, zeggende:","5":"Ga henen, en zeg tot Hizkia: Zo zegt de HEERE, de God van uw vader David: Ik heb uw gebed gehoord, Ik heb uw tranen gezien; zie, Ik zal vijftien jaren tot uw dagen toedoen;","6":"En Ik zal u uit de hand des konings van Assyrië verlossen, mitsgaders deze stad; en Ik zal deze stad beschermen.","7":"En dit zal u een teken zijn van den HEERE, dat de HEERE het woord, dat Hij gesproken heeft, doen zal:","8":"Zie, Ik zal de schaduw der graden, die met de zon in de graden van Achaz’ *zonnewijzer* nederwaarts gegaan is, tien graden achterwaarts doen keren. Dies is de zon tien graden teruggekeerd, in de graden, die zij nederwaarts gegaan was.","9":"*Dit* is het schrift van Hizkia, koning van Juda, toen hij ziek geweest en van zijn ziekte genezen was.","10":"Ik zeide: Vanwege de afsnijding mijner dagen, zal ik tot de poorten des grafs heengaan, ik word beroofd van het overige mijner jaren.","11":"Ik zeide: Ik zal den HEERE niet *meer* zien, den HEERE, in het land der levenden; ik zal de mensen niet meer aanschouwen met de inwoners der wereld.","12":"Mijn levenstijd is weggetogen, en van mij weggevoerd gelijk eens herders hut; ik heb mijn leven afgesneden, gelijk een wever *zijn* *web*; Hij zal mij afsnijden, *als* van den drom; van den dag tot den nacht zult Gij mij ten einde gebracht hebben.","13":"Ik stelde mij voor tot den morgenstond toe; gelijk een leeuw, alzo zal Hij al mijn beenderen breken; van den dag tot den nacht zult Gij mij ten einde gebracht hebben.","14":"Gelijk een kraan *of* zwaluw, alzo piepte ik; ik kirde als een duif; mijn ogen verhieven zich omhoog; o HEERE! ik word onderdrukt, wees Gij mijn Borg.","15":"Wat zal ik spreken? Gelijk Hij het mij heeft toegezegd, alzo heeft Hij het gedaan; ik zal *nu* al zoetjes voorttreden al mijn jaren, vanwege de bitterheid mijner ziel.","16":"Heere, bij deze dingen leeft men, en in dit alles is het leven van mijn geest; want Gij hebt mij gezond gemaakt en mij genezen.","17":"Zie, in vrede is mij de bitterheid bitter geweest; maar Gij hebt mijn ziel liefelijk omhelsd, dat zij in de groeve der vertering niet kwame; want Gij hebt al mijn zonden achter Uw rug geworpen.","18":"Want het graf zal U niet loven, de dood zal U *niet* prijzen; die in den kuil nederdalen, zullen op Uw waarheid niet hopen.","19":"De levende, de levende, die zal U loven, gelijk ik heden *doe*; de vader zal den kinderen Uw waarheid bekend maken.","20":"De HEERE was *gereed* om mij te verlossen; daarom zullen wij op mijn snarenspel spelen; al de dagen onzes levens, in het huis des HEEREN.","21":"Jesaja nu had gezegd: Laat men nemen een klomp vijgen, en tot een pleister op het gezwel maken, en hij zal genezen.","22":"En Hizkia had gezegd: Welk zal het teken zijn, dat ik ten huize des HEEREN zal opgaan?"},"KJV":{"1":"In those days was Hezekiah sick unto death. And Isaiah the prophet the son of Amoz came unto him, and said unto him, Thus saith the LORD, Set thine house in order: for thou shalt die, and not live.","2":"Then Hezekiah turned his face toward the wall, and prayed unto the LORD,","3":"And said, Remember now, O LORD, I beseech thee, how I have walked before thee in truth and with a perfect heart, and have done *that which is* good in thy sight. And Hezekiah wept sore.","4":"Then came the word of the LORD to Isaiah, saying,","5":"Go, and say to Hezekiah, Thus saith the LORD, the God of David thy father, I have heard thy prayer, I have seen thy tears: behold, I will add unto thy days fifteen years.","6":"And I will deliver thee and this city out of the hand of the king of Assyria: and I will defend this city.","7":"And this *shall be* a sign unto thee from the LORD, that the LORD will do this thing that he hath spoken;","8":"Behold, I will bring again the shadow of the degrees, which is gone down in the sun dial of Ahaz, ten degrees backward. So the sun returned ten degrees, by which degrees it was gone down.","9":"The writing of Hezekiah king of Judah, when he had been sick, and was recovered of his sickness:","10":"I said in the cutting off of my days, I shall go to the gates of the grave: I am deprived of the residue of my years.","11":"I said, I shall not see the LORD, *even* the LORD, in the land of the living: I shall behold man no more with the inhabitants of the world.","12":"Mine age is departed, and is removed from me as a shepherd's tent: I have cut off like a weaver my life: he will cut me off with pining sickness: from day *even* to night wilt thou make an end","13":"I reckoned till morning, *that*, as a lion, so will he break all my bones: from day *even* to night wilt thou make an end","14":"Like a crane *or* a swallow, so did I chatter: I did mourn as a dove: mine eyes fail *with looking* upward: O LORD, I am oppressed; undertake","15":"What shall I say? he hath both spoken unto me, and himself hath done *it*: I shall go softly all my years in the bitterness of my soul.","16":"O Lord, by these *things men* live, and in all these *things is* the life of my spirit: so wilt thou recover me, and make me to live.","17":"Behold, for peace I had great bitterness: but thou hast in love to my soul *delivered it* from the pit of corruption: for thou hast cast all my sins behind thy back.","18":"For the grave cannot praise thee, death can *not* celebrate thee: they that go down into the pit cannot hope for thy truth.","19":"The living, the living, he shall praise thee, as I *do* this day: the father to the children shall make known thy truth.","20":"The LORD *was ready* to save me: therefore we will sing my songs to the stringed instruments all the days of our life in the house of the LORD.","21":"For Isaiah had said, Let them take a lump of figs, and lay *it* for a plaister upon the boil, and he shall recover.","22":"Hezekiah also had said, What *is* the sign that I shall go up to the house of the LORD?"}},"tsk":{"1":[{"kopje":"werd Hizkia","refs":["2 Kon 20:1-11","2 Kron 32:24","Joh 11:1-5","Hand 9:37","Fil 2:27-30"]},{"kopje":"en de profeet Jesaja","refs":["Jes 37:21","Jes 39:3","Jes 39:4"]},{"kopje":"Regel uw zaken","refs":["2 Sam 17:23","Pred 9:10"]},{"kopje":"want u","refs":["Jer 18:7-10","Jona 3:4","Jona 3:10"]}],"2":[{"kopje":"keerde","refs":["1 Kon 8:30","Ps 50:15","Ps 91:15","Matt 6:6"]}],"3":[{"kopje":"denk er toch aan","refs":["Neh 5:19","Neh 13:14","Neh 13:22","Neh 13:31","Ps 18:21-28","Ps 20:2-4","Hebr 6:10"]},{"kopje":"ik gedaan heb","refs":["Gen 5:22","Gen 5:23","Gen 6:9","Gen 17:1","1 Kon 2:4","2 Kron 31:20","2 Kron 31:21","Job 23:11","Job 23:12","Ps 16:8","Ps 32:2","Joh 1:48","2 Kor 1:12","1 Joh 3:21","1 Joh 3:22"]},{"kopje":"een volkomen","refs":["1 Kon 15:14","1 Kron 29:9","1 Kron 29:19","2 Kron 16:9","2 Kron 25:2","Ps 101:2","Ps 119:80"]},{"kopje":"huilde","refs":["2 Sam 12:21","2 Sam 12:22","Ezra 10:1","Neh 1:4","Ps 6:9","Ps 102:10","Hos 12:5","Hebr 5:7"]}],"5":[{"kopje":"en zeg","refs":["2 Sam 7:3-5","1 Kron 17:2-4"]},{"kopje":"God","refs":["Jes 7:13","Jes 7:14","1 Kon 8:25","1 Kon 9:4","1 Kon 9:5","1 Kon 11:12","1 Kon 11:13","1 Kon 15:4","2 Kron 34:3","Ps 89:4","Ps 89:5","Matt 22:32"]},{"kopje":"Ik heb gehoord","refs":["2 Kon 19:20","Ps 34:6","Ps 34:7","Luk 1:13","1 Joh 5:14","1 Joh 5:15"]},{"kopje":"Ik heb gezien","refs":["Ps 39:13","Ps 56:9","Ps 147:3","2 Kor 7:6","Openb 7:17"]},{"kopje":"Ik zal","refs":["Job 14:5","Ps 116:15","Hand 27:24"]}],"8":[{"kopje":"Ik zal doen keren","refs":["Joz 10:12-14","2 Kon 20:11","2 Kron 32:24","2 Kron 32:31","Matt 16:1"]}],"9":[{"kopje":"schrift","refs":["Jes 12:1-6","Ex 15:1-21","Richt 5:1-31","1 Sam 2:1-10","Ps 18:2","Ps 30:12","Ps 30:13","Ps 107:17-22","Ps 116:1-4","Ps 118:18","Ps 118:19","Jona 2:1-9"]},{"kopje":"hij geweest was","refs":["Deut 32:39","1 Sam 2:6","Job 5:18","Hos 6:1","Hos 6:2","2 Kron 29:30" ass=\"wl wl-kjv\" data-code=\"H2396\">Hezekiah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> when he had been <span class=\"wl wl-kjv\" data-code=\"H2470\">sick,</span> and was <span class=\"wl wl-kjv\" data-code=\"H2421\">recovered</span> of his sickness:","10":"I <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> in the cutting <span class=\"wl wl-kjv\" data-code=\"H1824\">off</span> of my <span class=\"wl wl-kjv\" data-code=\"H3117\">days,</span> I shall <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> to the <span class=\"wl wl-kjv\" data-code=\"H8179\">gates</span> of the <span class=\"wl wl-kjv\" data-code=\"H7585\">grave:</span> I am <span class=\"wl wl-kjv\" data-code=\"H6485\">deprived</span> of the <span class=\"wl wl-kjv\" data-code=\"H3499\">residue</span> of my years.","11":"I <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I shall not <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> the <span class=\"wl wl-kjv\" data-code=\"H3050\">LORD,</span> even the <span class=\"wl wl-kjv\" data-code=\"H3050\">LORD,</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of the <span class=\"wl wl-kjv\" data-code=\"H2416\">living:</span> I shall <span class=\"wl wl-kjv\" data-code=\"H5027\">behold</span> <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> no more with the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of the world.","12":"Mine <span class=\"wl wl-kjv\" data-code=\"H1755\">age</span> is <span class=\"wl wl-kjv\" data-code=\"H5265\">departed,</span> and is <span class=\"wl wl-kjv\" data-code=\"H1540\">removed</span> from me as a <span class=\"wl wl-kjv\" data-code=\"H7473\">shepherd's</span> <span class=\"wl wl-kjv\" data-code=\"H168\">tent:</span> I have cut <span class=\"wl wl-kjv\" data-code=\"H7088\">off</span> like a <span class=\"wl wl-kjv\" data-code=\"H707\">weaver</span> my <span class=\"wl wl-kjv\" data-code=\"H2416\">life:</span> he will cut me <span class=\"wl wl-kjv\" data-code=\"H1214\">off</span> with pining <span class=\"wl wl-kjv\" data-code=\"H1803\">sickness:</span> from <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> even to <span class=\"wl wl-kjv\" data-code=\"H3915\">night</span> wilt thou make an end","13":"I <span class=\"wl wl-kjv\" data-code=\"H7737\">reckoned</span> till <span class=\"wl wl-kjv\" data-code=\"H1242\">morning,</span> that, as a <span class=\"wl wl-kjv\" data-code=\"H738\">lion,</span> so will he <span class=\"wl wl-kjv\" data-code=\"H7665\">break</span> all my <span class=\"wl wl-kjv\" data-code=\"H6106\">bones:</span> from <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> even to <span class=\"wl wl-kjv\" data-code=\"H3915\">night</span> wilt thou make an end","14":"Like a <span class=\"wl wl-kjv\" data-code=\"H5483\">crane</span> or a <span class=\"wl wl-kjv\" data-code=\"H5693\">swallow,</span> so did I <span class=\"wl wl-kjv\" data-code=\"H6850\">chatter:</span> I did <span class=\"wl wl-kjv\" data-code=\"H1897\">mourn</span> as a <span class=\"wl wl-kjv\" data-code=\"H3123\">dove:</span> mine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> <span class=\"wl wl-kjv\" data-code=\"H1809\">fail</span> with looking <span class=\"wl wl-kjv\" data-code=\"H4791\">upward:</span> O <span class=\"wl wl-kjv\" data-code=\"H136\">LORD,</span> I am <span class=\"wl wl-kjv\" data-code=\"H6234\">oppressed;</span> undertake","15":"What shall I <span class=\"wl wl-kjv\" data-code=\"H1696\">say?</span> he hath both <span class=\"wl wl-kjv\" data-code=\"H559\">spoken</span> unto me, and himself hath <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> it: I shall go <span class=\"wl wl-kjv\" data-code=\"H1718\">softly</span> all my <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> in the <span class=\"wl wl-kjv\" data-code=\"H4751\">bitterness</span> of my soul.","16":"O <span class=\"wl wl-kjv\" data-code=\"H136\">Lord,</span> by these things men <span class=\"wl wl-kjv\" data-code=\"H2421\">live,</span> and in all these things is the <span class=\"wl wl-kjv\" data-code=\"H2416\">life</span> of my <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit:</span> so wilt thou <span class=\"wl wl-kjv\" data-code=\"H2492\">recover</span> me, and make me to live.","17":"Behold, for <span class=\"wl wl-kjv\" data-code=\"H7965\">peace</span> I had great <span class=\"wl wl-kjv\" data-code=\"H4751\">bitterness:</span> but thou hast in <span class=\"wl wl-kjv\" data-code=\"H2836\">love</span> to my <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> delivered it from the <span class=\"wl wl-kjv\" data-code=\"H7845\">pit</span> of <span class=\"wl wl-kjv\" data-code=\"H1097\">corruption:</span> for thou hast <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> all my <span class=\"wl wl-kjv\" data-code=\"H2399\">sins</span> <span class=\"wl wl-kjv\" data-code=\"H310\">behind</span> thy back.","18":"For the <span class=\"wl wl-kjv\" data-code=\"H7585\">grave</span> cannot <span class=\"wl wl-kjv\" data-code=\"H3034\">praise</span> thee, <span class=\"wl wl-kjv\" data-code=\"H4194\">death</span> can not <span class=\"wl wl-kjv\" data-code=\"H1984\">celebrate</span> thee: they that go <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> into the <span class=\"wl wl-kjv\" data-code=\"H953\">pit</span> cannot <span class=\"wl wl-kjv\" data-code=\"H7663\">hope</span> for thy truth.","19":"The <span class=\"wl wl-kjv\" data-code=\"H2416\">living,</span> the <span class=\"wl wl-kjv\" data-code=\"H2416\">living,</span> he shall <span class=\"wl wl-kjv\" data-code=\"H3034\">praise</span> thee, as I do this <span class=\"wl wl-kjv\" data-code=\"H3117\">day:</span> the <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> to the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> shall make <span class=\"wl wl-kjv\" data-code=\"H3045\">known</span> thy truth.","20":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was ready to <span class=\"wl wl-kjv\" data-code=\"H3467\">save</span> me: therefore we will sing my <span class=\"wl wl-kjv\" data-code=\"H5058\">songs</span> to the stringed <span class=\"wl wl-kjv\" data-code=\"H5059\">instruments</span> all the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of our <span class=\"wl wl-kjv\" data-code=\"H2416\">life</span> in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the LORD.","21":"For <span class=\"wl wl-kjv\" data-code=\"H3470\">Isaiah</span> had <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Let them <span class=\"wl wl-kjv\" data-code=\"H5375\">take</span> a <span class=\"wl wl-kjv\" data-code=\"H1690\">lump</span> of <span class=\"wl wl-kjv\" data-code=\"H8384\">figs,</span> and lay it for a <span class=\"wl wl-kjv\" data-code=\"H4799\">plaister</span> upon the <span class=\"wl wl-kjv\" data-code=\"H7822\">boil,</span> and he shall recover.","22":"<span class=\"wl wl-kjv\" data-code=\"H2396\">Hezekiah</span> also had <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> What is the <span class=\"wl wl-kjv\" data-code=\"H226\">sign</span> that I shall go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the LORD?"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"die dagen","tekst":"Wat hier verhaald wordt, is geschied kort nadat het leger der Assyriërs van God door den engel verslagen was."}],"2":[{"catchword":"bad tot den HEERE","tekst":"Zijn gebed volgt hier straks, van vs.3; zie 2Ki 20:1 , enz."}],"3":[{"catchword":"wat goed in Uw ogen is,","tekst":"Dit is als een getuigenis van een goede conscientie, berustende alleen op de barmhartigheid Gods, zonder enige aanmatiging van eigen gerechtigheid; zie onder vs.17, en Jezua Sirach 48:25-26."},{"catchword":"gedaan heb","tekst":"Zie 2Ki 18:3 , enz."},{"catchword":"weende","tekst":"Hebreeuws, weende een groot geween."}],"5":[{"catchword":"tot uw dagen","tekst":"Dat is, tot de dagen uws levens."}],"6":[{"catchword":"Ik zal u","tekst":"God de Heere belooft dezen koning, boven de verlenging van zijn leven, ook rust en vrede in zijn koninkrijk en bescherming tegen de machtige Assyriërs, die wederom een heirleger hadden kunne op de been brengen om hem te bekrijgen en Jeruzalem te belegeren."}],"7":[{"catchword":"het woord,","tekst":"Of, deze zaak."}],"8":[{"catchword":"Zie, Ik zal","tekst":"Zie de aantekening op vs.8 passende, 2Ki 20:9-11 ."}],"9":[{"catchword":"genezen was","tekst":"Hebreeuws, levend geworden was, gelijk vs.21."}],"10":[{"catchword":"Ik zeide","tekst":"Dat is, ik dacht en overlegde bij mijzelven aldus."},{"catchword":"Vanwege","tekst":"Of, in de afsnijding mijner dagen; dat is, toen mijne dagen afgesneden of verkort werden; of toen mij verkondigd werd, dat mijne dagen haast zouden afgesneden worden; dat is, dat ik haast sterven zou. Het is ene gelijkenis, genomen van de wevers, die hun web afgeweven hebbende, zo snijden zij hetzelve af."},{"catchword":"zal ik tot","tekst":"Dat is, ik moest haast sterven."},{"catchword":"ik word beroofd","tekst":"Dat is, het overschot mijner jaren wordt mij ontnomen, of men doet mij ontberen het overschot, of het resteren mijner dagen; dat is, wat er tekortkomt aan mijne jaren, te weten dier jaren, die ik, naar den loop der natuur, nog kon leven, of nog behoorde te leven, gelijk ik mijzelven had ingebeeld."}],"11":[{"catchword":"den HEERE niet meer zien,","tekst":"Dat is, voor den Heere verschijnen in het heiligdom en bij den gansen godsdienst, die gedaan werd als de godzaligen in den tempel samenkwamen."},{"catchword":"in het land","tekst":"Dat is, in deze wereld, of in dit leven; zie deze manier van spreken ook Job 28:13 ; Psa 27:13 ; met de aantekening, alsook Psa 142:6 , en onder Isa 53:8 ."},{"catchword":"met de inwoners","tekst":"Dat is, bij degenen, die in de wereld wonen, bij de mensen, die nu leven; zie Psa 27:13 , en Psa 116:9 ."}],"12":[{"catchword":"Mijn levenstijd","tekst":"Of, mijn leeftijd; anders mijne woning, mijn verblijftijd. Hebreeuws, dor; zie Psa 12:8 ."},{"catchword":"weggetogen,","tekst":"Of, weggerukt."},{"catchword":"eens herders hut;","tekst":"Die niet vast of gestadig op ene plaats blijft, maar van de ene plaats op de andere gebracht wordt, naar gelegenheid van zaken; zie Job 27:18 ."},{"catchword":"afgesneden,","tekst":"Of, afgeknipt, afgescheurd, afgebroken. De zin is: Ik heb den Heere, door mijne zonden, daartoe oorzaak gegeven, dat Hij mijn leven vóór den natuurlijken tijd wil afsnijden."},{"catchword":"zijn web ;","tekst":"Te weten als hij het afgeweven heeft."},{"catchword":"Hij zal mij afsnijden,","tekst":"Te weten de Heere. Hier is verandering van persoon, want hij spreekt van God somwijlen in den derden persoon, somwijlen tot God in den tweeden persoon."},{"catchword":"den drom;","tekst":"Dit woord betekent ook bij de Hebreën een haarband, Son 7:5 , zie de aantekening aldaar. Anders, als een dunnen draad."},{"catchword":"van den dag","tekst":"Dat is, haast, in korten tijd, eer de dag voorbijgaat en het avond wordt, alzo ook vs.13."},{"catchword":"Gij mij","tekst":"O Heere."},{"catchword":"ten einde","tekst":"Of, afweven, en dan afsnijden, alzo ook vs.13."}],"13":[{"catchword":"mij voor","tekst":"Te weten in mijne gedachten; dat is, ik dacht. Anders: ik rekende tot den morgen, dat Hij als een leeuw al mijne beenderen zou breken. Of aldus: ik stelde mij hem tot den morgen toe, als een leeuw, dat Hij alzo al mijne beenderen zou breken, enz."},{"catchword":"tot den morgenstond","tekst":"Te weten mag ik leven, of mocht ik toch tot morgen leven. Het volgende nemen anderen aldus: [doch] Hij brak gelijk een leeuw al mijn beenderen."},{"catchword":"Hij al mijn","tekst":"Te weten God, of zij; te weten de ziekte, of de ellende; zie Job 10:16 ."},{"catchword":"beenderen","tekst":"Zie Job 7:15 ."},{"catchword":"van den dag","tekst":"Dat is, nog heden, eer de nacht komt."},{"catchword":"mij ten einde","tekst":"Dat is, mijn leven, mijne jaren."}],"14":[{"catchword":"kirde als een duif;","tekst":"Of, korde, steende."},{"catchword":"verhieven","tekst":"Te weten naar den hemel, of tot God, wien ik aanriep. Anders: werden uitgemergeld of uitgeschept; dat is, de krachten mijner ogen werden verdorven. Of, zij bezweken; te weten van opwaarts ten hemel te zien."},{"catchword":"ik word onderdrukt,","tekst":"Hebreeuws, mij is onderdrukking; te weten door deze mijne krankheid, die mij met geweld zo onderdrukt, dat ik mijn loop niet zal kunnen eindigen, tenzij dat Gij, Heere, U over mij ontfermt."},{"catchword":"wees Gij mijn Borg","tekst":"Dat is, stel U tussen mij en mijne krankheid, gelijk zich een borg stelt tussen den schuldheer en den schuldenaar, om hem te bevrijden dat hij niet in de gevangenis geworpen worde; zie Psa 119:122 . Anders: wees mij lieflijk; anders: weef mij af; dat is, strek mijn leven uit, totdat ik oud en krachteloos word en door natuurlijke zwakheid sterf, en snijd den draad mijns levens niet af eer hij ten einde gelopen is; een manier van spreken aan de wevers ontleend."}],"15":[{"catchword":"Wat zal ik spreken?","tekst":"Dat is, hoe zal ik God genoegzaam kunnen danken voor zijn grote genade. Hij heeft mij wel den dood laten aanzeggen; maar als ik hem bad, heeft Hij mij het leven wederom genadig geschonken. Anders: wat ik sprak, dat zeide Hij mij toe; te weten door den profeet Jesaja, vs.5. De zin is: Als ik den Heere bad, dat Hij mijn borg wilde blijven, of dat Hij mij wilde afweven [ Isa 38:14 ] , dat is, dat Hij mij nog meer jaren wilde laten leven, Hij heeft het mij straks toegezegd."},{"catchword":"al zoetjes","tekst":"Of, al zachtjes; zie Psa 42:5 . Eenigen menen dat het betekent een zachten voortgang, gelijk wanneer ene moeder haar kind voortleidt; en dat dit hier de zin is: Mijn voorgaande benauwdheid zal mij hierna bedachtzamer doen wandelen. Alzo wordt integendeel rasheid gesteld voor onbedachtzaamheid, of onvoorzichtigheid; Isa 32:4 ."},{"catchword":"al mijn jaren,","tekst":"Dat is, mijn leven lang."},{"catchword":"vanwege","tekst":"Dewijl ik die dodelijke en bittere smarten dier pijnlijke ziekte heb uitgestaan."}],"16":[{"catchword":"bij deze dingen","tekst":"Of, in, of door deze dingen, of, gelijk enigen, woorden; dat is, door uwe goedertierenheid, beloften en verzegeling uwer beloften en weldaden."},{"catchword":"mijn geest;","tekst":"Dat is, mijner ziel, en het leven mijner ziel; dat is, een vrolijk en gerust leven."},{"catchword":"gezond gemaakt","tekst":"Of, verkwikt en levend gemaakt. Hebreeuws, mij levend maken, of in het leven behouden; hetwelk, naar den aard van de Hebreeuwse taal, zoveel is, als: Gij hebt mij in het leven behouden, of genezen; dat is, Gij hebt mij mijn vorige sterkte wedergegeven, die ik geheel verloren had in die zware ziekte. Anderen vertalen dit duistere vers aldus: Die zullen leven, voor welken (of over welken) de Heere is; dat is, welker beschermer de Heere is, en allen die daarin zijn, (of, en allen die in die zaken zijn, dat is die in zulk een staat leven dat zij God met zich hebben) die zullen hetzelfde leven verkrijgen, dat nu mijn geest heeft. Opdat dit blijke, maak mij gezond en genees mij."}],"17":[{"catchword":"in vrede","tekst":"Te weten nadat Gij mij vrede gegeven hadt, namelijk door het verdelgen der Assyriërs, zo kwam mij ene bitterheid, te weten deze zware ziekte. Anders, op den vrede; dat is, opdat het ten beste dienen zou, kwam mij een bittere bitterheid over, te weten die zware krankheid."},{"catchword":"maar Gij hebt","tekst":"Anders: maar het heeft U behaagd mijne ziel; dat is, mij [te verlossen] uit de groeve der vertering."},{"catchword":"de groeve","tekst":"Dat is, het graf, waarin het dode lichaam van de wormen opgegeten en verteerd wordt."},{"catchword":"al mijn zonden","tekst":"Door welke ik deze krankheid en andere straffen verdiend heb. Had hij niet gezondigd, zo zou hij gene krankheid hebben gehad, noch gestorven zijn; want de dood met alle aanklevende ellenden heeft zijn oorsprong uit de zonde. Daarom spreekt Christus: Zoon uwe zonden zijn u vergeven, sta op, enz."},{"catchword":"achter Uw rug","tekst":"Dat is, Gij hebt ze mij vergeven, alzo dat zij niet meer voor uwe ogen komen zullen."}],"18":[{"catchword":"het graf","tekst":"Dat is, de doden in het graf kunnen uwen lof niet verkondigen hier in deze wereld bij de levenden. Zie Psa 6:6 , en Psa 30:10 , en Psa 88:11 , en Psa 115:17 ."},{"catchword":"de dood","tekst":"Dat is, de doden; anders de hel; dat is, die in de hel of in het graf zijn."},{"catchword":"hopen","tekst":"Of, wachten, of vertrouwen."}],"19":[{"catchword":"Uw waarheid","tekst":"Of, van uwe waarheid kennis doen hebben. Het Hebreeuwse woord el wordt ook voor eth gevonden; en uwe waarheid; dat is, dat Gij mij hebt gezond gemaakt, gelijk Gij mij beloofd hebt."}],"20":[{"catchword":"was gereed","tekst":"Of, is gekomen om mij te verlossen, of zal mij verlossen, of heeft mij verlost."}],"21":[{"catchword":"op het gezwel maken,","tekst":"Of, op de zweer; te weten van den koning Hizkia."}],"22":[{"catchword":"Welk zal het teken zijn,","tekst":"Dit verzocht hij niet door ongeloof of mistrouwen op de beloften van God, maar opdat zijn geloof daardoor mocht versterkt worden, alzo die belofte geheel scheen te strijden met Gods dreigement, vs.1."},{"catchword":"dat ik ten huize","tekst":"Dat is, dat ik gezond zal worden en in het huis des Heeren gaan, om Hem in het midden zijner gemeente voor mijne gezondheid te loven en te danken. Dit is geschied ten derden dage, naar de belofte Gods door Jesaja; 2Ki 20:5 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"In those days was Hezekiah sick unto death: and the Prophet Isaiah the son of Amoz came unto him, and said unto him: Thus saith the LORD, give command unto thine house, for thou shalt die, and not live. [That which is related here, happened shortly after that the camp of the Assyrians was smitten of God by the Angel.]"}],"2":[{"catchword":null,"tekst":"Then Hezekiah turned his face about toward the wall, and he prayed unto the Lord, [His prayer followeth here presently in vers.3. See 2 Kings 20.1, &c.]"}],"3":[{"catchword":null,"tekst":"And he said, O LORD, remember, I beseech thee, that I have walked before thy face in truth, and with a perfect heart, and (have) done that which is good in thine eyes: [This is as it were a testimony of a good conscience, resting and relying onely on the mercy of God, without any presumption of a mans own righteousness. See below vers.17. and Ecc 48:25,26. See also 2 Kings 18.3, &c.] and Hezekiah wept very sore. [Heb. Wept a great weeping.]"}],"4":[{"catchword":null,"tekst":"Then came the word of the Lord to Isaiah, saying:"}],"5":[{"catchword":null,"tekst":"Go thy ways, and say to Hezekiah, thus saith the LORD, the God of David thy father, I have heard thy prayer, I have seen thy tears; behold I will add unto thy days [That is unto the days of thy life] fifteen years."}],"6":[{"catchword":null,"tekst":"And I will deliver thee out of the hand of the King of Assyria, together with this city, and I will defend this city. [The Lord promiseth to this King, besides the lengthening out of his life, also rest and peace in his kingdom, and defence against the mighty Assyrians, which might again have raised an army to fight against him, and to besiege Jerusalem.]"}],"7":[{"catchword":null,"tekst":"And this shall be a token unto thee from the Lord, that the Lord will do the word, [Or this thing] that be he hath spoken."}],"8":[{"catchword":null,"tekst":"Behold, I will cause the shadow of the degrees that is gone down with the sun in the degrees of (the sun-dial of Ahaz,) to return ten degrees of (the sun-dial of Ahaz,) to return ten degrees backward: so the sun turned back ten degrees, in the degrees which was gone down. [See the Annot. Sitting this eighteth verse, 2 Kings 20.vers.9,10,11.]"}],"9":[{"cat // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;

  try {
    const res = await fetch(`../../${map}/${code}.json`);

  } catch (e) { cache[code] = null; }

}

    }).join('');
}

        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
