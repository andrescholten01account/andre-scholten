l":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Zwijg voor Mij, eilanden! En laat de volken hun kracht vernieuwen; laat ze naderbij komen, laat ze dan spreken; laat ons samen tot het gericht naderen.","2":"Wie heeft van de opgang die rechtvaardige verwekt? Heeft hem geroepen om hem op zijn voet te doen staan? De heidenvolken voor zijn aangezicht gegeven, en gemaakt dat hij over koningen heerste? Heeft hun zijn zwaard gegeven als stof, zijn boog als een voortgedreven stoppel?","3":"Zodat hij ze najoeg en veilig doortrok, over een pad dat hij met zijn voeten niet eerder gegaan had?","4":"Wie heeft dit gedaan en tot stand gebracht, terwijl Hij de geslachten riep van het begin af? Ik, de HEERE, Die de Eerste ben, en met de Laatste ben Ik Dezelfde.","5":"De eilanden zagen het, en zij vreesden; de einden van de aarde beefden; zij naderden en kwamen toe.","6":"De een hielp de ander, en zei tegen zijn metgezel: Wees sterk!","7":"En de werkmeester versterkte de goudsmid; hij die met de hamer glad maakt, hem die op het aambeeld slaat, en zei van het soldeersel: Het is goed; daarna maakt hij het vast met spijkers, zodat het niet wankelt.","8":"Maar u, Israël, Mijn knecht! U, Jakob, die Ik uitgekozen heb! Het nageslacht van Abraham, die Mij liefheeft!","9":"U, die Ik gegrepen heb van de einden van de aarde, en uit haar voornaamste mannen geroepen heb; en tegen wie Ik zei: U bent Mijn knecht; u heb Ik uitverkoren, en Ik heb u niet verworpen.","10":"Vrees niet, want Ik ben met u; wees niet verbaasd, want Ik ben uw God; Ik sterk u, ook help Ik u, ook ondersteun Ik u met de rechterhand van Mijn gerechtigheid.","11":"Zie, zij zullen beschaamd worden en te schande gemaakt, allen die tegen u in woede ontstoken zijn; zij zullen worden als niets, en de mensen die met u twisten, zullen vergaan.","12":"U zult hen zoeken, maar zult hen niet vinden, de mensen die met u kijven; zij zullen worden als niets, en de mensen die met u oorlogen, als een nietig ding.","13":"Want Ik, de HEERE, uw God, grijp uw rechterhand aan, Die tegen u zeg: Vrees niet, Ik help u.","14":"Vrees niet, wormpje Jakob, volkje Israël! Ik help u, spreekt de HEERE, en uw Verlosser is de Heilige van Israël!","15":"Zie, Ik heb u gemaakt tot een scherpe nieuwe dorsslede, die scherpe punten heeft; u zult bergen dorsen en verpulveren, en heuvels zult u maken als kaf.","16":"U zult ze wannen, en de wind zal ze wegvoeren, en de stormwind zal ze verstrooien; maar u zult u verheugen in de HEERE; in de Heilige van Israël zult u zich beroemen.","17":"De ellendigen en behoeftigen zoeken water, maar er is geen; hun tong versmacht van dorst; Ik, de HEERE, zal hen verhoren, Ik, de God van Israël, zal hen niet verlaten.","18":"Ik zal rivieren openen op de hoge plaatsen, en bronnen in het midden van de valleien; Ik zal de woestijn tot een waterpoel maken, en het dorre land tot waterbronnen.","19":"Ik zal in de woestijn de cederboom, de sittimboom, en de mirteboom, en de olieboom zetten; Ik zal in de wildernis de denneboom, de beuk, en de busboom samen plaatsen;","20":"Opdat zij zien, en beseffen, en overwegen, en samen begrijpen, dat de hand van de HEERE dit gedaan heeft, en dat de Heilige van Israël dit geschapen heeft.","21":"Breng uw twistzaak naar voren, zegt de HEERE; breng uw vaste bewijsredenen bij, zegt de Koning van Jakob.","22":"Laat hen naar voren brengen en ons verkondigen wat er gebeuren zal; verkondig de vorige dingen, wat die geweest zijn, opdat wij het ter harte nemen, en het einde ervan weten; of laat ons de toekomende dingen horen.","23":"Verkondig de dingen die hierna komen zullen, opdat wij weten dat u goden bent; ja, doe goed, of doe kwaad, zodat wij verbaasd staan, en samen toezien.","24":"Zie, u bent minder dan niets, en uw werk is erger dan een adder; hij is een gruwel, die u verkiest.","25":"Ik verwek er een uit het noorden, en hij zal komen; van de opgang van de zon zal hij Mijn Naam aanroepen; en hij zal komen over de vorsten als over leem, en zoals een pottenbakker het slijk vertreedt.","26":"Wie heeft iets verkondigd van het begin af aan, zodat wij het weten mogen, of van tevoren, zodat wij mogen zeggen: Hij is rechtvaardig? Maar er is niemand die het verkondigt, ook niemand die iets laat horen, ook niemand die uw woorden hoort.","27":"Ik, de Eerste, zeg tegen Sion: Zie, zie ze daar! En tegen Jeruzalem: Ik zal iemand geven die een blijde boodschap brengt.","28":"Want Ik zag toe, maar er was niemand, zelfs onder hen niet; er was geen raadgever, zodat Ik hen zou kunnen vragen, en zij Mij antwoord zouden geven.","29":"Zie, zij zijn allemaal ijdelheid, hun werken zijn een nietig ding, hun gegoten beelden zijn wind en een ijdel ding."},"SV":{"1":"Zwijgt voor Mij, gij eilanden! en laat de volken de kracht vernieuwen; laat ze toetreden, laat ze dan spreken; laat ons samen ten gerichte naderen.","2":"Wie heeft van den opgang dien rechtvaardige verwekt? heeft hem geroepen op zijn voet? de heidenen voor zijn aangezicht gegeven, en gemaakt, dat hij *over* koningen heerste? heeft ze zijn zwaard gegeven als stof, zijn boog als een voortgedreven stoppel?","3":"Dat hij ze najaagde *en* doortrok *met* vrede, door een pad, *hetwelk* hij met zijn voeten niet gegaan had?","4":"Wie heeft *dit* gewrocht en gedaan, roepende de geslachten van den beginne? Ik, de HEERE, Die de Eerste ben, en met den Laatste ben Ik Dezelfde.","5":"De eilanden zagen het, en zij vreesden; de einden der aarde beefden; zij naderden en kwamen toe;","6":"De een hielp den ander, en zeide tot zijn metgezel: Wees sterk!","7":"En de werkmeester versterkte den goudsmid; die met den hamer glad maakt, dien, die op het aambeeld slaat, zeggende van het soldeersel: Het is goed; daarna maakt hij het vast met nagelen, dat het niet wankele.","8":"Maar gij, Israël, Mijn knecht! gij Jakob, dien Ik verkoren heb! het zaad van Abraham, Mijn liefhebber!","9":"Gij, welken Ik gegrepen heb van de einden der aarde, en uit haar bijzonderste geroepen heb; en zeide tot u: Gij zijt Mijn knecht; u heb Ik uitverkoren, en heb u niet verworpen.","10":"Vrees niet, want Ik ben met u; zijt niet verbaasd, want Ik ben uw God; Ik sterk u, ook help Ik u, ook ondersteun Ik u met de rechterhand Mijner gerechtigheid.","11":"Ziet, zij zullen beschaamd en te schande worden, allen, die tegen u ontstoken zijn; zij zullen worden als niet, en die lieden, die met u twisten, zullen vergaan.","12":"Gij zult hen zoeken, maar zult hen niet vinden; de lieden, die met u kijven, zullen worden als niet, en die lieden, die met u oorlogen, als een nietig ding.","13":"Want Ik, de HEERE, uw God, grijp uw rechterhand aan, Die tot u zeg: Vrees niet, Ik help u.","14":"Vrees niet, gij wormpje Jakobs, gij volkje Israëls! Ik help u, spreekt de HEERE, en uw Verlosser is de Heilige Israëls!","15":"Ziet, Ik heb u tot een scherpe nieuwe dorsslede gesteld, die scherpe pinnen heeft; gij zult bergen dorsen en vermalen, en heuvelen zult gij stellen gelijk kaf.","16":"Gij zult ze wannen, en de wind zal ze wegnemen, en de stormwind zal ze verstrooien; maar gij zult u verheugen in den HEERE; in den Heilige Israëls zult gij u roemen.","17":"De ellendigen en nooddruftigen zoeken water, maar er is geen, hun tong versmacht van dorst; Ik, de HEERE zal hen verhoren, Ik, de God Israëls, zal hen niet verlaten.","18":"Ik zal rivieren op de hoge plaatsen openen, en fonteinen in het midden der valleien; Ik zal de woestijn tot een waterpoel zetten, en het dorre land tot watertochten.","19":"Ik zal in de woestijn den cederboom, den sittimboom, en den mirteboom, en den olieachtigen boom zetten; Ik zal in de wildernis stellen den denneboom, den beuk, en den busboom te gelijk;","20":"Opdat zij zien, en bekennen, en overleggen, en te gelijk verstaan, dat de hand des HEEREN zulks gedaan, en dat de Heilige Israëls zulks geschapen heeft.","21":"Brengt ulieder twistzaak voor, zegt de HEERE; brengt uw vaste bewijsredenen bij, zegt de Koning van Jakob.","22":"Laat hen voortbrengen en ons verkondigen de dingen, die gebeuren zullen; verkondigt de vorige dingen, welke die geweest zijn, opdat wij het ter harte nemen, en het einde daarvan weten; of doet ons de toekomende dingen horen.","23":"Verkondigt dingen, die hierna komen zullen, opdat wij weten, dat gij goden zijt; ja, doet goed, en doet kwaad, dat wij verbaasd staan, en te zamen toezien.","24":"Ziet, gijlieden zijt minder dan niet, en ulieder werk is erger dan een adder; hij is een gruwel, die ulieden verkiest.","25":"Ik verwek *een* van het noorden, en hij zal opkomen van den opgang der zon; hij zal Mijn Naam aanroepen; en hij zal komen *over* de overheden als *over* leem, en gelijk een pottenbakker het slijk treedt.","26":"Wie heeft *wat* verkondigd van den beginne aan, dat wij het weten mogen, of van te voren, dat wij zeggen mogen: Hij is rechtvaardig; maar er is niemand, die het verkondigt, ook niemand, die *wat* horen doet, ook niemand, die ulieder woorden hoort.","27":"*Ik*, de Eerste *zeg* tot Sion: Zie, zie ze *daar*! en tot Jeruzalem: Ik zal een blijden boodschapper geven.","28":"Want Ik zag toe, maar er was niemand, zelfs onder dezen, maar er was geen raadgever, dat Ik hen zou vragen, en zij Mij antwoord geven zouden.","29":"Ziet, zij zijn altemaal ijdelheid, hun werken zijn een nietig ding, hun gegoten beelden zijn wind, en een ijdel ding."},"KJV":{"1":"Keep silence before me, O islands; and let the people renew *their* strength: let them come near; then let them speak: let us come near together to judgment.","2":"Who raised up the righteous *man* from the east, called him to his foot, gave the nations before him, and made *him* rule over kings? he gave *them* as the dust to his sword, *and* as driven stubble to his bow.","3":"He pursued them, *and* passed safely; *even* by the way *that* he had not gone with his feet.","4":"Who hath wrought and done *it*, calling the generations from the beginning? I the LORD, the first, and with the last;","5":"The isles saw *it*, and feared; the ends of the earth were afraid, drew near, and came.","6":"They helped every one his neighbour; and *every one* said to his brother, Be of good courage.","7":"So the carpenter encouraged the goldsmith, *and* he that smootheth *with* the hammer him that smote the anvil, saying, It *is* ready for the sodering: and he fastened it with nails, *that* it should not be moved.","8":"But thou, Israel, *art* my servant, Jacob whom I have chosen, the seed of Abraham my friend.","9":"*Thou* whom I have taken from the ends of the earth, and called thee from the chief men thereof, and said unto thee, Thou *art* my servant; I have chosen thee, and not cast thee away.","10":"Fear thou not; for I *am* with thee: be not dismayed; for I *am* thy God: I will strengthen thee; yea, I will help thee; yea, I will uphold thee with the right hand of my righteousness.","11":"Behold, all they that were incensed against thee shall be ashamed and confounded: they shall be as nothing; and they that strive with thee shall perish.","12":"Thou shalt seek them, and shalt not find them, *even* them that contended with thee: they that war against thee shall be as nothing, and as a thing of nought.","13":"For I the LORD thy God will hold thy right hand, saying unto thee, Fear not; I will help","14":"Fear not, thou worm Jacob, *and* ye men of Israel; I will help thee, saith the LORD, and thy redeemer, the Holy One of Israel.","15":"Behold, I will make thee a new sharp threshing instrument having teeth: thou shalt thresh the mountains, and beat *them* small, and shalt make the hills as chaff.","16":"Thou shalt fan them, and the wind shall carry them away, and the whirlwind shall scatter them: and thou shalt rejoice in the LORD, *and* shalt glory in the Holy One of Israel.","17":"*When* the poor and needy seek water, and *there is* none, *and* their tongue faileth for thirst, I the LORD will hear them, I the God of Israel will not forsake","18":"I will open rivers in high places, and fountains in the midst of the valleys: I will make the wilderness a pool of water, and the dry land springs of water.","19":"I will plant in the wilderness the cedar, the shittah tree, and the myrtle, and the oil tree; I will set in the desert the fir tree, *and* the pine, and the box tree together:","20":"That they may see, and know, and consider, and understand together, that the hand of the LORD hath done this, and the Holy One of Israel hath created","21":"Produce your cause, saith the LORD; bring forth your strong *reasons*, saith the King of Jacob.","22":"Let them bring *them* forth, and shew us what shall happen: let them shew the former things, what they *be*, that we may consider them, and know the latter end of them; or declare us things for to come.","23":"Shew the things that are to come hereafter, that we may know that ye *are* gods: yea, do good, or do evil, that we may be dismayed, and behold *it* together.","24":"Behold, ye *are* of nothing, and your work of nought: an abomination *is he that* chooseth","25":"I have raised up *one* from the north, and he shall come: from the rising of the sun shall he call upon my name: and he shall come upon princes as *upon* morter, and as the potter treadeth clay.","26":"Who hath declared from the beginning, that we may know? and beforetime, that we may say, *He is* righteous? yea, *there is* none that sheweth, yea, *there is* none that declareth, yea, *there is* none that heareth your words.","27":"The first *shall say* to Zion, Behold, behold them: and I will give to Jerusalem one that bringeth good tidings.","28":"For I beheld, and *there was* no man; even among them, and *there was* no counsellor, that, when I asked of them, could answ " data-code=\"H5414\">gave</span> the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him, and made him <span class=\"wl wl-kjv\" data-code=\"H7287\">rule</span> over <span class=\"wl wl-kjv\" data-code=\"H4428\">kings?</span> he <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> them as the <span class=\"wl wl-kjv\" data-code=\"H6083\">dust</span> to his <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> and as <span class=\"wl wl-kjv\" data-code=\"H5086\">driven</span> <span class=\"wl wl-kjv\" data-code=\"H7179\">stubble</span> to his bow.","3":"He <span class=\"wl wl-kjv\" data-code=\"H7291\">pursued</span> them, and <span class=\"wl wl-kjv\" data-code=\"H5674\">passed</span> <span class=\"wl wl-kjv\" data-code=\"H7965\">safely;</span> even by the <span class=\"wl wl-kjv\" data-code=\"H734\">way</span> that he had not <span class=\"wl wl-kjv\" data-code=\"H935\">gone</span> with his feet.","4":"Who hath <span class=\"wl wl-kjv\" data-code=\"H6466\">wrought</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> it, <span class=\"wl wl-kjv\" data-code=\"H7121\">calling</span> the <span class=\"wl wl-kjv\" data-code=\"H1755\">generations</span> from the <span class=\"wl wl-kjv\" data-code=\"H7218\">beginning?</span> I the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> the <span class=\"wl wl-kjv\" data-code=\"H7223\">first,</span> and with the last;","5":"The <span class=\"wl wl-kjv\" data-code=\"H339\">isles</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> it, and <span class=\"wl wl-kjv\" data-code=\"H3372\">feared;</span> the <span class=\"wl wl-kjv\" data-code=\"H7098\">ends</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> were <span class=\"wl wl-kjv\" data-code=\"H2729\">afraid,</span> drew <span class=\"wl wl-kjv\" data-code=\"H7126\">near,</span> and came.","6":"They <span class=\"wl wl-kjv\" data-code=\"H5826\">helped</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> his <span class=\"wl wl-kjv\" data-code=\"H7453\">neighbour;</span> and every one <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to his <span class=\"wl wl-kjv\" data-code=\"H251\">brother,</span> Be of good courage.","7":"So the <span class=\"wl wl-kjv\" data-code=\"H2796\">carpenter</span> <span class=\"wl wl-kjv\" data-code=\"H2388\">encouraged</span> the <span class=\"wl wl-kjv\" data-code=\"H6884\">goldsmith,</span> and he that <span class=\"wl wl-kjv\" data-code=\"H2505\">smootheth</span> with the <span class=\"wl wl-kjv\" data-code=\"H6360\">hammer</span> him that <span class=\"wl wl-kjv\" data-code=\"H1986\">smote</span> the <span class=\"wl wl-kjv\" data-code=\"H6471\">anvil,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> It is <span class=\"wl wl-kjv\" data-code=\"H2896\">ready</span> for the <span class=\"wl wl-kjv\" data-code=\"H1694\">sodering:</span> and he <span class=\"wl wl-kjv\" data-code=\"H2388\">fastened</span> it with <span class=\"wl wl-kjv\" data-code=\"H4548\">nails,</span> that it should not be moved.","8":"But thou, <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> art my <span class=\"wl wl-kjv\" data-code=\"H5650\">servant,</span> <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> whom I have <span class=\"wl wl-kjv\" data-code=\"H977\">chosen,</span> the <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> of <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> my friend.","9":"Thou whom I have <span class=\"wl wl-kjv\" data-code=\"H2388\">taken</span> from the <span class=\"wl wl-kjv\" data-code=\"H7098\">ends</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> and <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> thee from the chief <span class=\"wl wl-kjv\" data-code=\"H678\">men</span> thereof, and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto thee, Thou art my <span class=\"wl wl-kjv\" data-code=\"H5650\">servant;</span> I have <span class=\"wl wl-kjv\" data-code=\"H977\">chosen</span> thee, and not cast thee away.","10":"<span class=\"wl wl-kjv\" data-code=\"H3372\">Fear</span> thou not; for I am with thee: be not <span class=\"wl wl-kjv\" data-code=\"H8159\">dismayed;</span> for I am thy <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> I will <span class=\"wl wl-kjv\" data-code=\"H553\">strengthen</span> thee; yea, I will <span class=\"wl wl-kjv\" data-code=\"H5826\">help</span> thee; yea, I will <span class=\"wl wl-kjv\" data-code=\"H8551\">uphold</span> thee with the right <span class=\"wl wl-kjv\" data-code=\"H3225\">hand</span> of my righteousness.","11":"Behold, all they that were <span class=\"wl wl-kjv\" data-code=\"H2734\">incensed</span> against thee shall be <span class=\"wl wl-kjv\" data-code=\"H954\">ashamed</span> and <span class=\"wl wl-kjv\" data-code=\"H3637\">confounded:</span> they shall be as nothing; and <span class=\"wl wl-kjv\" data-code=\"H582\">they</span> that <span class=\"wl wl-kjv\" data-code=\"H7379\">strive</span> with thee shall perish.","12":"Thou shalt <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> them, and shalt not <span class=\"wl wl-kjv\" data-code=\"H4672\">find</span> them, even <span class=\"wl wl-kjv\" data-code=\"H582\">them</span> that <span class=\"wl wl-kjv\" data-code=\"H4695\">contended</span> with thee: they that <span class=\"wl wl-kjv\" data-code=\"H4421\">war</span> against thee shall be as nothing, and as a thing of nought.","13":"For I the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> will <span class=\"wl wl-kjv\" data-code=\"H2388\">hold</span> thy right <span class=\"wl wl-kjv\" data-code=\"H3225\">hand,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying</span> unto thee, <span class=\"wl wl-kjv\" data-code=\"H3372\">Fear</span> not; I will help","14":"<span class=\"wl wl-kjv\" data-code=\"H3372\">Fear</span> not, thou <span class=\"wl wl-kjv\" data-code=\"H8438\">worm</span> <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> and ye <span class=\"wl wl-kjv\" data-code=\"H4962\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> I will <span class=\"wl wl-kjv\" data-code=\"H5826\">help</span> thee, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H1350\">redeemer,</span> the Holy <span class=\"wl wl-kjv\" data-code=\"H6918\">One</span> of Israel.","15":"Behold, I will <span class=\"wl wl-kjv\" data-code=\"H7760\">make</span> thee a <span class=\"wl wl-kjv\" data-code=\"H2319\">new</span> <span class=\"wl wl-kjv\" data-code=\"H2742\">sharp</span> <span class=\"wl wl-kjv\" data-code=\"H4173\">threshing</span> instrument <span class=\"wl wl-kjv\" data-code=\"H1167\">having</span> <span class=\"wl wl-kjv\" data-code=\"H6374\">teeth:</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H1758\">thresh</span> the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains,</span> and beat them <span class=\"wl wl-kjv\" data-code=\"H1854\">small,</span> and shalt <span class=\"wl wl-kjv\" data-code=\"H7760\">make</span> the <span class=\"wl wl-kjv\" data-code=\"H1389\">hills</span> as chaff.","16":"Thou shalt <span class=\"wl wl-kjv\" data-code=\"H2219\">fan</span> them, and the <span class=\"wl wl-kjv\" data-code=\"H7307\">wind</span> shall carry them <span class=\"wl wl-kjv\" data-code=\"H5375\">away,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5591\">whirlwind</span> shall <span class=\"wl wl-kjv\" data-code=\"H6327\">scatter</span> them: and thou shalt <span class=\"wl wl-kjv\" data-code=\"H1523\">rejoice</span> in the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and shalt <span class=\"wl wl-kjv\" data-code=\"H1984\">glory</span> in the Holy <span class=\"wl wl-kjv\" data-code=\"H6918\">One</span> of Israel.","17":"When the <span class=\"wl wl-kjv\" data-code=\"H6041\">poor</span> and <span class=\"wl wl-kjv\" data-code=\"H34\">needy</span> <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and there is none, and their <span class=\"wl wl-kjv\" data-code=\"H3956\">tongue</span> <span class=\"wl wl-kjv\" data-code=\"H5405\">faileth</span> for <span class=\"wl wl-kjv\" data-code=\"H6772\">thirst,</span> I the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will <span class=\"wl wl-kjv\" data-code=\"H6030\">hear</span> them, I the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> will not forsake","18":"I will <span class=\"wl wl-kjv\" data-code=\"H6605\">open</span> <span class=\"wl wl-kjv\" data-code=\"H5104\">rivers</span> in high <span class=\"wl wl-kjv\" data-code=\"H8205\">places,</span> and <span class=\"wl wl-kjv\" data-code=\"H4599\">fountains</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H1237\">valleys:</span> I will <span class=\"wl wl-kjv\" data-code=\"H7760\">make</span> the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> a <span class=\"wl wl-kjv\" data-code=\"H98\">pool</span> of <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6723\">dry</span> <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> <span class=\"wl wl-kjv\" data-code=\"H4161\">springs</span> of water.","19":"I will <span class=\"wl wl-kjv\" data-code=\"H5414\">plant</span> in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> the <span class=\"wl wl-kjv\" data-code=\"H730\">cedar,</span> the shittah <span class=\"wl wl-kjv\" data-code=\"H7848\">tree,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1918\">myrtle,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8081\">oil</span> <span class=\"wl wl-kjv\" data-code=\"H6086\">tree;</span> I will <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> in the <span class=\"wl wl-kjv\" data-code=\"H6160\">desert</span> the fir <span class=\"wl wl-kjv\" data-code=\"H1265\">tree,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8410\">pine,</span> and the box <span class=\"wl wl-kjv\" data-code=\"H8391\">tree</span> together:","20":"That they may <span class=\"wl wl-kjv\" data-code=\"H7200\">see,</span> and <span class=\"wl wl-kjv\" data-code=\"H3045\">know,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">consider,</span> and <span class=\"wl wl-kjv\" data-code=\"H7919\">understand</span> <span class=\"wl wl-kjv\" data-code=\"H3162\">together,</span> that the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> this, and the Holy <span class=\"wl wl-kjv\" data-code=\"H6918\">One</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> hath created","21":"<span class=\"wl wl-kjv\" data-code=\"H7126\">Produce</span> your <span class=\"wl wl-kjv\" data-code=\"H7379\">cause,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> bring <span class=\"wl wl-kjv\" data-code=\"H5066\">forth</span> your <span class=\"wl wl-kjv\" data-code=\"H6110\">strong</span> reasons, <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">King</span> of Jacob.","22":"Let them bring them <span class=\"wl wl-kjv\" data-code=\"H5066\">forth,</span> and <span class=\"wl wl-kjv\" data-code=\"H5046\">shew</span> us what shall <span class=\"wl wl-kjv\" data-code=\"H7136\">happen:</span> let them <span class=\"wl wl-kjv\" data-code=\"H5046\">shew</span> the former <span class=\"wl wl-kjv\" data-code=\"H7223\">things,</span> what they be, that we may <span class=\"wl wl-kjv\" data-code=\"H7760\">consider</span> them, and <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> the latter <span class=\"wl wl-kjv\" data-code=\"H319\">end</span> of them; or <span class=\"wl wl-kjv\" data-code=\"H8085\">declare</span> us things for to come.","23":"<span class=\"wl wl-kjv\" data-code=\"H5046\">Shew</span> the things that are to <span class=\"wl wl-kjv\" data-code=\"H857\">come</span> <span class=\"wl wl-kjv\" data-code=\"H268\">hereafter,</span> that we may <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that ye are <span class=\"wl wl-kjv\" data-code=\"H430\">gods:</span> yea, do <span class=\"wl wl-kjv\" data-code=\"H3190\">good,</span> or do <span class=\"wl wl-kjv\" data-code=\"H7489\">evil,</span> that we may be <span class=\"wl wl-kjv\" data-code=\"H8159\">dismayed,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">behold</span> it together.","24":"Behold, ye are of <span class=\"wl wl-kjv\" data-code=\"H369\">nothing,</span> and your <span class=\"wl wl-kjv\" data-code=\"H6467\">work</span> of <span class=\"wl wl-kjv\" data-code=\"H659\">nought:</span> an <span class=\"wl wl-kjv\" data-code=\"H8441\">abomination</span> is he that chooseth","25":"I have raised <span class=\"wl wl-kjv\" data-code=\"H5782\">up</span> one from the <span class=\"wl wl-kjv\" data-code=\"H6828\">north,</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H857\">come:</span> from the <span class=\"wl wl-kjv\" data-code=\"H4217\">rising</span> of the <span class=\"wl wl-kjv\" data-code=\"H8121\">sun</span> shall he <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> upon my <span class=\"wl wl-kjv\" data-code=\"H8034\">name:</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> upon <span class=\"wl wl-kjv\" data-code=\"H5461\">princes</span> as upon <span class=\"wl wl-kjv\" data-code=\"H2563\">morter,</span> and as the <span class=\"wl wl-kjv\" data-code=\"H3335\">potter</span> <span class=\"wl wl-kjv\" data-code=\"H7429\">treadeth</span> clay.","26":"Who hath <span class=\"wl wl-kjv\" data-code=\"H5046\">declared</span> from the <span class=\"wl wl-kjv\" data-code=\"H7218\">beginning,</span> that we may <span class=\"wl wl-kjv\" data-code=\"H3045\">know?</span> and <span class=\"wl wl-kjv\" data-code=\"H6440\">beforetime,</span> that we may <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> He is <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous?</span> yea, there is none that <span class=\"wl wl-kjv\" data-code=\"H5046\">sheweth,</span> yea, there is none that <span class=\"wl wl-kjv\" data-code=\"H8085\">declareth,</span> yea, there is none that <span class=\"wl wl-kjv\" data-code=\"H8085\">heareth</span> your words.","27":"The <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> shall say to <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion,</span> <span class=\"wl wl-kjv\" data-code=\"H2009\">Behold,</span> <span class=\"wl wl-kjv\" data-code=\"H2009\">behold</span> them: and I will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> to <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> one that bringeth good tidings.","28":"For I <span class=\"wl wl-kjv\" data-code=\"H7200\">beheld,</span> and there was no <span class=\"wl wl-kjv\" data-code=\"H376\">man;</span> even among them, and there was no <span class=\"wl wl-kjv\" data-code=\"H3289\">counsellor,</span> that, when I <span class=\"wl wl-kjv\" data-code=\"H7592\">asked</span> of them, could <span class=\"wl wl-kjv\" data-code=\"H7725\">answer</span> a word.","29":"Behold, they are all <span class=\"wl wl-kjv\" data-code=\"H205\">vanity;</span> their <span class=\"wl wl-kjv\" data-code=\"H4639\">works</span> are <span class=\"wl wl-kjv\" data-code=\"H657\">nothing:</span> their molten <span class=\"wl wl-kjv\" data-code=\"H5262\">images</span> are <span class=\"wl wl-kjv\" data-code=\"H7307\">wind</span> and confusion."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"voor Mij,","tekst":"Dit zijn de woorden des Heeren."},{"catchword":"gij eilanden","tekst":"Dat is, gij inwoners der eilanden, dat is, die ver af, aan gene zijde der zee woont. Zie Gen 10:5 , en Psa 72:10 . Zwijgt en hoort met aandacht wat Ik, de Heere, u zeggen zal. Met welke woorden God de Heere alle afgodendienaars als voor het recht daagt, om hen te overtuigen van hunne dwaasheid, dat zij hulp zoeken bij de afgoden."},{"catchword":"laat de volken","tekst":"De zin is: Laat hen hun best doen dat zij zich voor mij verweren, zij zullen eindelijk bevinden dat zij tegen mij niets vermogen."}],"2":[{"catchword":"van den opgang","tekst":"Versta, den opgang der zon, namelijk, uit Ur der Chaldeën land. Zie Gen 11:31 , en Gen 12:1 ; Jos 24:2 ."},{"catchword":"dien rechtvaardige","tekst":"Te weten Abraham, die door het geloof is gerechtvaardigd geworden, en wiens gerechtigheid van Mozes geroemd wordt. Zie Gen 15:6 , en Gen 18:19 , en Gen 22:16 . Hebreeuws, die gerechtigheid verwekt. Zie van zulke manieren van spreken Job 35:13 ."},{"catchword":"verwekt?","tekst":"Dat is, vermaand en verwekt daartoe, dat hij naar een ander land trekken zou."},{"catchword":"zijn voet?","tekst":"Dat is, dat hij hem op den voet zou volgen en dienen."},{"catchword":"de heidenen","tekst":"Dat is, wie gaf hem de overwinning over de heidenen, die Sodom en Gomorra geplunderd hadden? Zie Gen 14:14 ."},{"catchword":"gemaakt,","tekst":"Dat is, gaf hem overwinning, te weten over de vier koningen, van wie gesproken wordt Gen 14 ."},{"catchword":"heeft hen zijn zwaard","tekst":"Dat is, maakte dat zij voor zijn zwaard zo lichtelijk waren door te houwen alsof zij stof waren geweest. Anders: en heeft hunne; te weten dier koningen, zwaarden gemaakt als stof, en hunne bogen als stoppelen die van den wind [voortgedreven worden]."}],"3":[{"catchword":"niet gegaan had?","tekst":"Anders: nooit gekomen was. Sommigen duiden dit vs. en het voorgaande op Cyrus, als een voorbeeld van Christus, sommigen op Christus alleen."}],"4":[{"catchword":"roepende","tekst":"Of, [wie] roept, enz., dat is, wie maakt dat de mensen, het ene geslacht voor, het andere na, elkander volgen, en dat alzo de wereld nimmermeer zonder bewoners is?"},{"catchword":"van den beginne?","tekst":"Hebreeuws, van het hoofd af; te weten van den beginne der wereld."},{"catchword":"met den Laatste","tekst":"Anders: en bij de laatste, Ik ben dezelfde. vs.4 mag ook aldus vertaald worden: Wie heeft gewrocht en gemaakt, [en] roept de eeuwen, die van den beginne geweest zijn? Ik de Heere, die de eerste ben; en die na dezen zijn zullen. Ik dezelfde."}],"5":[{"catchword":"De eilanden","tekst":"De zin is: De inwoners der eilanden, ziende en bevindende de macht, die God ten allen tijde heeft betoond tot beschutting zijner kerk, zijn verschrikt en verbaasd geworden, en hebben wel enigermate zich aangesteld alsof zij zich den waren God wilden onderwerpen; maar inplaats van zich oprecht te schikken om alleen te dienen den waren God, zijn zij ijdel geworden in hunne gedachten, nog evenwel afgoden makende en gevende de eer van den waren God hunnen afgoden."},{"catchword":"de einden","tekst":"Dat is, degenen, die aan de uiterste einden der wereld woonden."}],"6":[{"catchword":"De een hielp","tekst":"Te weten in het bevorderen der afgoderij. Hebreeuws, de man hielp zijnen metgezel."},{"catchword":"metgezel","tekst":"Hebreeuws, broeder."},{"catchword":"Wees sterk","tekst":"Alsof zij zeiden: Heb goeden moed, val er aan, laat ons elkander lustig bijstaan, te weten in het maken, oprichten en vereren der afgoden."}],"7":[{"catchword":"versterkte","tekst":"Dat is, gaf moed, vermanende tot voltrekking van het werk."},{"catchword":"den goudsmid;","tekst":"Hebreeuws eigenlijk, den smelter."},{"catchword":"die op het aambeeld","tekst":"Dat is, die op het goud slaat, hetwelk op het aanbeeld ligt om tot een plaats geslagen te worden. Anders: met het slaan op het aanbeeld."},{"catchword":"hij het vast","tekst":"Te weten het beeld."}],"8":[{"catchword":"gij, Israël,","tekst":"Dat is, gij mij volk Israël."},{"catchword":"gij Jakob,","tekst":"Dat is, gij nakomelingen van Jakob."},{"catchword":"het zaad van Abraham,","tekst":"Dat is, gij kinderen van Abraham."},{"catchword":"Mijn liefhebber","tekst":"Dat is, die mij liefgehad heeft; 2Ch 20:7 . Of, van mijn vriend; dat is, dien Ik liefgehad heb; zie Jam 2:23 ."}],"9":[{"catchword":"welken Ik","tekst":"Dat is, welken Ik gegrepen en uitgeleid heb."},{"catchword":"van de einden","tekst":"Dat is, uit wijdgelegen landen, te weten uit Chaldea, toen gijlieden, die nu leeft, in de lenden van Abraham waart."},{"catchword":"haar","tekst":"Te weten der aarde."},{"catchword":"bijzonderste","tekst":"Of, uitgelezenen; dat is van de aanzienlijkste, rijkste, voornaamste lieden. Zie Exo 24:11 . Anders: voor hunne bijzondersten, alsof Hij zeide: Ik heb u verkoren voor de voortreffelijksten en allergrootsten van het aardrijk."}],"10":[{"catchword":"wees niet verbaasd,","tekst":"Of, ontzet u niet, wees niet bedwelmd en bezwijk niet en verschrik niet, en versmelt niet, te weten als was; en vrees niet. Alle deze, en nog meer verscheidene uitleggingen worden over dit woord bijgebracht."},{"catchword":"met de rechterhand","tekst":"Of, met mijne gerechtige rechterhand; dat is, door mijn goddelijke kracht, die gerechtigheid oefent, straffende de goddelozen en beschermende de vromen."}],"11":[{"catchword":"ontstoken zijn;","tekst":"Of, ontbranden; te weten met toorn."},{"catchword":"en die lieden,","tekst":"Hebreeuws, de mannen van uwen twist; dat is, die met u twisten; alzo vs.12"}],"14":[{"catchword":"gij wormpje Jakobs,","tekst":"Dat is, gij volk, dat afkomstig is van Jakob, maar nu zo verachtzaam zijt in de ogen uwer vijanden, als een wormken. Zie Psa 22:7 ."},{"catchword":"gij volkje Israëls","tekst":"Of, gij mensen Israëls."}],"15":[{"catchword":"Ik heb u","tekst":"Dat is, Ik heb u zulke macht en vermogen gegeven, dat gij zult vertreden en vermorzelen al degenen, die zich tegen u verheffen. Zie 2Co 10:4-5 ."},{"catchword":"scherpe nieuwe dorsslede","tekst":"Of, snedige; dat is, die bekwaam is om scherp te snijden."},{"catchword":"die scherpe pinnen","tekst":"Hebreeuws, die een heer of bezitter der monden is; dat is, die als met monden, dat is scherpe pinnen, wel voorzien is, om te bijten, te kwetsen en te beschadigen."},{"catchword":"gij zult bergen","tekst":"Dat is, de hogen, groten, verhevenen en aanzienlijken in het land zult gij vernielen, die u bevechten zullen; of, ik zal het in uwen naam en om uwentwil doen. Vergelijk Rev 17:14 , en Rev 19:18 , en Rev 20:8-9 ."}],"16":[{"catchword":"in den HEERE;","tekst":"Dat is, vanwege den Heere, te weten omdat Hij u zo goedertieren voor de zijnen kent en aanneemt."},{"catchword":"in den Heilige Israëls","tekst":"Dat is, in dien, welken de Israëlieten voor hun heiligen God kennen, eren en vrezen."}],"17":[{"catchword":"De ellendigen","tekst":"Te weten die arm van geest zijn, en die honger en dorst hebben naar de gerechtigheid, dat is, die hun geestelijke armoede gevoelende en bekennende, daarbij weten dat er gene gerechtigheid bij hen is, en daarom hongeren en dorsten naar de gerechtigheid Gods. Dezen belooft de Heere dat Hij hen zal verkwikken en verzadigen."},{"catchword":"water,","tekst":"Dat is, hulp, troost, verkwikking in hun nood en benauwdheden."},{"catchword":"er is geen,","tekst":"Noch bij henzelven, noch bij andere mensen, zij zijn dan schriftgeleerden of farizeën, of hoe zij heten mogen."}],"18":[{"catchword":"rivieren","tekst":"Versta hier door de rivieren, fonteinen, enz. een zeer groten overvloed van geestelijke zegeningen; zie de aantekening Job 20:17 . De zin is: Ik zal hen verkwikken door de predikatie van het heilig Evangelie en de kracht des Heiligen Geestes, hen troostende tegen het aanklagen hunner eigen conscientie. Zie Isa 35:7 , en Isa 44:3 ; Joh 4:10 , en Joh 7:37 ."},{"catchword":"tot een waterpoel","tekst":"Zie de aantekening Psa 107:35 ."}],"19":[{"catchword":"Ik zal in de woestijn","tekst":"De zin is: Ik zal mijne kerk, die tevoren als ene woestijn was, vervullen en versieren met vele gelovige en godzalige personen, die in dezelve zullen zijn als schone, sierlijke en vruchtbare bomen."},{"catchword":"den sittimboom,","tekst":"Dit is een soort van cederboom, in deze onze landen onbekend. Zie de aantekening Exo 25:5 ; van dit hout was gemaakt de ark des verbonds en de heilige tafel; Exo 25:10 , Exo 25:23 ."},{"catchword":"den beuk,","tekst":"Of, hartsboom."},{"catchword":"den busboom","tekst":"Anders, witte populierboom. Eenigen menen dat hierdoor te verstaan zijn alle bomen, die grote schaduw geven. Het Hebreeuwse woord, dat hier in den tekst staat, wordt alleen hier gevonden en Isa 60:13 ."}],"20":[{"catchword":"overleggen,","tekst":"Of, ter harte nemen."},{"catchword":"zulks","tekst":"Te weten, dat Hij zijne kerk wonderbaar heeft bewaard en versierd."}],"21":[{"catchword":"Brengt ulieder","tekst":"Hier spreekt wederom de Heere de afgodendienaars aan, gelijk vs.1, en Hij beroept hen voor zijn gericht [zie onder Isa 45:20 , en Isa 48:14 ] , te weten om hen aan te wijzen de ijdelheid hunner bijgelovigheden, en om alzo de godzaligen een afkeer te doen hebben van al zulke gruwelen."},{"catchword":"bewijsredenen","tekst":"Hebreeuws, sterkten, vastigheden; dat is, bewijsstukken, documenten, te weten om te bewijzen en te doen blijken dat uwe afgoden ware goden zijn, en dat gijlieden recht en wel doet dat gij hen eert en aanbidt."},{"catchword":"Jakob","tekst":"Dat is, van het volk, dat uit Jakob afkomstig is."}],"22":[{"catchword":"Laat hen","tekst":"Te weten uw valse goden en die hen aanhangen, hervoortreden en bewijzen dat zij goden zijn, hetwelk geschieden zal indien zij doen blijken dat zij toekomende en gepasseerde dingen weten."},{"catchword":"ons verkondigen","tekst":"Te weten mij den Heere en den gelovigen, die mij aanhangen."},{"catchword":"verkondigt","tekst":"Hier wendt de Heere zijne rede tot de valse goden, gelijk ook vs.23,24."},{"catchword":"de vorige dingen,","tekst":"Dat is, welke zich tevoren hebben toegedragen. Anders: de eerste dingen, welke die zullen zijn; te weten in het toekomende."},{"catchword":"het ter harte","tekst":"Hebreeuws, ons hart te leggen, of te stellen; te weten daarop; dat is, dat wij met ons hart terdege daarop letten."},{"catchword":"het einde","tekst":"Dat is, opdat wij weten wat daarop volgen zal."},{"catchword":"doet ons","tekst":"Dat is, vertelt ons de toekomende dingen."}],"23":[{"catchword":"doet goed,","tekst":"De zin is: Laat uwe macht blijken, doet goed dengenen die u eren, of doet kwaad dengenen die u verachten. Aldus spot Hij met de afgoden, die leven noch macht hebben, en derhalve niemand goed of kwaad doen kunnen."},{"catchword":"toezien","tekst":"Of, daarop letten."}],"24":[{"catchword":"dan een adder;","tekst":"Of, dan [het werk] ener adder, of van een basilisk. Of aldus: Ulieder werk is uit een adder; dat is uit den duivel. Anders: minder dan een nietig ding."},{"catchword":"verkiest","tekst":"Te weten om ulieder als goden te eren en te aanbidden. Anders: Dat men u uitkiezen zal, is een gruwel."}],"25":[{"catchword":"Ik verwek","tekst":"Te weten Ik de Vader, verwek enen, te weten mijnen Zoon Jezus Christus, die van het noorden, enz.; dat is, wiens gebied strekken zal van het ene einde der wereld tot het andere. Vergelijk dit met Mat 8:11 . Onder deze twee gewesten moet men hier alle gewesten verstaan. Anderen: Ik verwek een [volk], te weten dat volk, mijne kerk, die uit alle hoeken der wereld zal verzameld worden, ten tijde der komst van den Messias, door welken het rijk van den Satan en der zonde ten enenmale zal teniet gedaan worden. Sommigen duiden het op Cyrus als een voorbeeld van onzen Heere Christus."},{"catchword":"hij zal komen","tekst":"Te weten, om hen te beschamen. Zie 2Co 10:4-6 ."},{"catchword":"overheden","tekst":"Of, regenten, zo kerkelijk als politieke, te weten tegen al degenen, die zich zullen stellen tegen Jezus Christus."},{"catchword":"slijk","tekst":"Dat is klei."},{"catchword":"treedt","tekst":"Versta hierbij: Zal Hij hen vertreden en te schande maken."}],"26":[{"catchword":"Wie heeft wat","tekst":"Te weten onder al de afgoden."},{"catchword":"van den beginne aan,","tekst":"Hebreeuws, van het hoofd; dat is, van zulks als er in den beginne der wereld geschied is."},{"catchword":"van te voren,","tekst":"Hebreeuws, van de aangezichten; dat is, van tevoren, of van den beginne."},{"catchword":"Hij is","tekst":"Of, [Gij zijt] rechtvaardig; dat is, Gij hebt u met recht voor een god uitgegeven."},{"catchword":"rechtvaardig;","tekst":"Of, [ waarachtig ] omdat de gerechtigheid de waarheid vereist. Anderen vertalen de eerste woorden van dit vs. aldus: Wie zal de vorige dingen verkongigen? Wij zullen het vernemen, en hetgeen voor dezen geweest is? Wij zullen zeggen: hij is waarachtig."},{"catchword":"er is niemand,","tekst":"Te weten onder de vals goden of onder de mensen."},{"catchword":"niemand,","tekst":"Te weten on de afgoden."},{"catchword":"die ulieder","tekst":"Want de afgoden hebben oren, maar horen niet. Zie Psa 135:16 ."}],"27":[{"catchword":"Ik ,","tekst":"Dat is, Ik, die God ben, kan tot Zion zeggen, te weten Ik de Heere, maar de afgoden niet."},{"catchword":"zie ze daar","tekst":"Te weten die dingen, die Ik tevoren gezegd heb. Anderen aldus: Ik de eerste zal Zion en Jeruzalem een blijde boodschapper geven, ziet, ziet ze daar. De ware God heeft straks tevoren al de afgoden der heidenen getrotseerd dat zij toekomende dingen zouden voorzeggen, zich verheffende dat niemand van hen allen zulks kon doen; maar Ik, [zegt nu God] Ik zal de eerste zijn, die Zion en Jeruzalem enen geven zal, die, een blijde boodschap brengende, zeggen zal: Ziet, ziet ze daar, die dingen, die God voorzegd heeft, zijn nu tegenwoordig daar en geschieden voor onze ogen."},{"catchword":"blijden boodschapper","tekst":"Of, een evangelist, een verkondiger van het heilige Evangelie, sprekende van de genade en barmhartigheid Gods over de boetvaardige zondaars; en versta dit voornamelijk van Christus, en wijders uit het voorgaande, dat deze belofte zo zekerlijk zal voorgesteld en volbracht worden, alsof het alreeds voor ogen ware. Vergelijk onder Isa 42:9 ."},{"catchword":"geven","tekst":"Versta hierbij, uit het naastvoorgaande lid: En ziet hij is daar."}],"28":[{"catchword":"Ik zag toe,","tekst":"Te weten naar een man, die mijn volk zou kunnen helpen of zaligmaken."},{"catchword":"zelfs onder dezen,","tekst":"Of, ook geen van dezen; te weten die tot mijn volk behoren."},{"catchword":"er was geen raadgever,","tekst":"Te weten, die de verslagen conscientiën enigen goeden raad zou kunnen geven; de raadgever, die zulk terecht zou doen, was Christus. Zie Isa 9:5 ."}],"29":[{"catchword":"zij zijn altemaal","tekst":"Te weten die afgoden."},{"catchword":"gegoten beelden","tekst":"Versta onder deze ook beelden van hout en van steen. Anders: hunne besprengingen zijn wind, enz."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Keep silence before me ye Islands, and let the nations renew their strength: let them come neer, then let them speak: let us come neer together to judgement. [These are the words of God. (keep silence before me ye Islands, etc.) That is, ye inhabitants of the Islands; that is, ye that dwell afar off, on that side of the Sea, (see Genes.10.on ver.5. and Psal.72.on ver.10.) keep silence and hearken with diligent, attention what I the Lord shall say unto you. In which words God summoneth all Idolaters as it were before the Judgement-seat, to convince them of their folly in seeking and craving help of Idols, (and let the nations renew (their) strength:) the meaning is, let them do their best to defend themselves against me, they shall find as last that they shall not be able to stand it out, or to prevail against me.]"}],"2":[{"catchword":null,"tekst":"Who raised up the righteous man [To wit, Abraham, who was justified by faith, and whose righteousness is highly commended and extolled by Moses. See Gen 15:6. and 18.19. and 22.16. Heb. Raised up that righteousness. See of such kind of phrase, Job 35.on ver.13. (raised up) that is, exhorted and stirred him up to go to another country] from the rising? [Meaning the rising of the Sun, namely from Ur the land of the Chaldeans. See Genes.11.31. and 12.1. Jos.24.2. [called him on his foot? [that is, the he should follow and serve him on the foot; that is, forthwith without delay] gave the heathen before his face, [that is, who gave him the victory over the heathen that had plundered Sodom and Gommorrah? See Genes.14.14. [and made him rule (over) Kings? That is, gave him victory, to wit, over those four Kings of whom mention is made, Genes.chap.14. [gave them as dust to his sword, as driven stubble to his bow? [that is, made them to be as easy to be cut asunder by his sword, as if they had been dust, &c. Others, and made their swords (to wit, the sword of those Kings) as dust, and their bows as stubble, that is driven (by the wind)]"}],"3":[{"catchword":null,"tekst":"That he pursued them, and passed through (in) peace, by the path (which) he had not gone with his feet? [Others, had never gone, or, never came: Some apply this verse and the former to Cyrus, as a type of Christ: a some onely unto Christ.]"}],"4":[{"catchword":null,"tekst":"Who hath wrought and done (this), calling the generations from the beginning? [Or (who) valleth, etc. that is, who causeth men to succeed one another, one generation to follow after another successively, so that the world is never without inhabitants (from the beginning) Heb. From the head; to wit, from the beginning of the world] I the Lord that am the first, and with the last, I am the same,, [others, and among the last I am the same. This fourth verse may be likewise rendered thus, who hath wrought and made (and) called the ages that have been fr /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +

    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };

  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
