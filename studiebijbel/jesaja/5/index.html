ten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Nu zal ik voor mijn Beminde een lied van mijn Liefste zingen, over Zijn wijngaard. Mijn Beminde heeft een wijngaard op een vruchtbare heuvel.","2":"En Hij heeft die omtuind en van stenen gezuiverd, en Hij heeft hem beplant met edele wijnstokken; en Hij heeft in het midden ervan een toren gebouwd, en ook een wijnbak daarin uitgehouwen; en Hij heeft verwacht dat hij *goede* druiven zou voortbrengen, maar hij heeft stinkende druiven voortgebracht.","3":"Nu dan, u, inwoners van Jeruzalem, en u, mannen van Juda, oordeel toch tussen Mij en tussen Mijn wijngaard.","4":"Wat is er meer te doen aan Mijn wijngaard, wat Ik daaraan niet gedaan heb? Waarom heb Ik verwacht dat hij *goede* druiven voortbrengen zou, terwijl hij stinkende druiven heeft voortgebracht?","5":"Nu dan, Ik zal u nu bekendmaken wat Ik met Mijn wijngaard doen zal: Ik zal zijn omheining wegnemen, zodat hij kaalgevreten wordt; zijn muur zal Ik afbreken, zodat hij vertrapt wordt.","6":"En Ik zal hem tot een woestenij maken; hij zal niet gesnoeid, noch omgespit worden, maar distels en doornen zullen erin opkomen; en Ik zal de wolken gebieden dat zij er geen regen op laten regenen.","7":"Want de wijngaard van de HEERE van de heerscharen is het huis van Israël, en de mannen van Juda zijn een plant van Zijn welbehagen; en Hij heeft gewacht op recht, maar zie, het is onderdrukking; op gerechtigheid, maar zie, het is geschreeuw.","8":"Wee hun die huis aan huis trekken, akker aan akker brengen, totdat er geen plaats meer is, en u alleen wonend achterblijft in het midden van het land!","9":"Voor mijn oren heeft de HEERE van de heerscharen gesproken: Voorwaar, veel huizen zullen tot verwoesting worden, de grote en de mooie, zonder bewoner!","10":"Ja, tien bunders wijngaard zullen maar één bath geven, en een homer zaad zal een efa[1] geven.","11":"Wee hun die zich vroeg in de morgen opmaken om sterke drank na te jagen, en die doorgaan tot in de schemering, totdat de wijn hen verhit heeft!","12":"En harp en luit, tamboerijn en fluit, en wijn zijn bij hun feesten; maar zij letten niet op het werk van de HEERE, en zij zien niet op het maaksel van Zijn handen.","13":"Daarom zal mijn volk gevankelijk weggevoerd worden, omdat het geen kennis heeft; en zijn heerlijke mannen zullen honger lijden, en zijn menigte zal verdorren van dorst.","14":"Daarom zal het graf zichzelf wijd opensperren, en zijn mond zonder maat opendoen; zodat haar heerlijkheid, en haar menigte, met haar gedruis, en wie daarin van vreugde opspringt, erin neerdaalt.","15":"Dan zal de gewone man neergebogen worden, en de aanzienlijke man zal vernederd worden, en de ogen van de hoogmoedigen zullen vernederd worden.","16":"Doch de HEERE van de heerscharen zal verhoogd worden door het recht; en God, die Heilige, zal geheiligd worden door gerechtigheid.","17":"En de lammeren zullen weiden naar hun gewoonte, en de vreemdelingen zullen de woeste plaatsen van de vetgemesten eten.","18":"Wee hun die de ongerechtigheid trekken met koorden van ijdelheid, en de zonde als met dikke wagentouwen!","19":"Die zeggen: Laat Hij haasten, laat Hij Zijn werk bespoedigen, opdat wij het zien; en laat het raadsbesluit van de Heilige van Israël naderen en komen, opdat wij het vernemen!","20":"Wee hun die het kwade goed noemen, en het goede kwaad; die duisternis tot licht stellen, en het licht tot duisternis; die het bittere tot zoet stellen, en het zoete tot bitterheid!","21":"Wee hun die in hun eigen ogen wijs, en naar hun eigen oordeel verstandig zijn!","22":"Wee hun die helden zijn om wijn te drinken, en die dappere mannen zijn om sterke drank te mengen!","23":"Die de goddeloze rechtvaardigen om een geschenk, en de gerechtigheid van de rechtvaardigen van hen afwenden.","24":"Daarom, zoals de tong van het vuur de stoppel verteert, en het kaf door de vlam verteerd wordt, zo zal hun wortel als verrotting zijn; en hun bloesem zal als stof opstijgen; omdat zij de wet van de HEERE van de heerscharen verwerpen, en het woord van de Heilige van Israël versmaden.","25":"Daarom is de toorn van de HEERE ontstoken tegen Zijn volk, en heeft Hij Zijn hand tegen hen uitgestrekt, en heeft Hij hen geslagen, zodat de bergen hebben gebeefd, en hun dode lichamen zijn geworden als vuil in het midden van de straten. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.","26":"Want Hij zal een banier opwerpen voor de heidenvolken van ver, en Hij zal hen hierheen lokken met een fluitsignaal, van het einde van de aarde; en zie, haastig, snel zullen zij aankomen.","27":"Geen vermoeide, en geen struikelende zal onder hen zijn; niemand zal sluimeren noch slapen, noch zal de gordel om zijn heupen losraken, noch zal de schoenriem van zijn schoenen afscheuren.","28":"Hun pijlen zullen scherp zijn, en al hun bogen gespannen; de hoeven van hun paarden zullen als een rots geacht worden, en hun wielen als een wervelwind.","29":"Hun gebrul zal zijn als van een oude leeuw, en zij zullen brullen als de jonge leeuwen, en zij zullen grommen, en de prooi grijpen en wegvoeren; en er zal niemand zijn die redt.","30":"En zij zullen op die dag tegen hen bruisen, als het bruisen van de zee. Als men dan naar het land kijkt, zie, dan is er duisternis en benauwdheid, en het licht zal verduisterd worden in de wolken erboven."},"SV":{"1":"Nu zal ik mijn Beminde een lied mijns Liefsten zingen van Zijn wijngaard; Mijn Beminde heeft een wijngaard op een vetten heuvel.","2":"En Hij heeft dien omtuind, en van stenen gezuiverd, en Hij heeft hem beplant *met* edele wijnstokken; en Hij heeft in deszelfs midden een toren gebouwd, en ook een wijnbak daarin uitgehouwen; en Hij heeft verwacht, dat hij *goede* druiven zou voortbrengen, maar hij heeft stinkende druiven voortgebracht.","3":"Nu dan, gij inwoners van Jeruzalem, en gij mannen van Juda, oordeelt toch tussen Mij en tussen Mijn wijngaard.","4":"Wat is er meer te doen aan Mijn wijngaard, hetwelk Ik aan hem niet gedaan heb? Waarom heb Ik verwacht, dat hij *goede* druiven voortbrengen zou, en hij heeft stinkende druiven voortgebracht?","5":"Nu dan, Ik zal ulieden nu bekend maken, wat Ik Mijn wijngaard doen zal; Ik zal zijn tuin wegnemen, opdat hij zij tot afweiding; zijn muur zal Ik verscheuren, opdat hij zij tot vertreding.","6":"En Ik zal hem *tot* woestheid maken; hij zal niet besnoeid, noch omgehakt worden, maar distelen en doornen zullen *daarin* opgaan; en Ik zal den wolken gebieden, dat zij geen regen daarop regenen.","7":"Want de wijngaard van den HEERE der heirscharen is het huis van Israël, en de mannen van Juda zijn een plant zijner verlustigingen; en Hij heeft gewacht naar recht, maar ziet, het is schurftheid, naar gerechtigheid, maar ziet, het is geschreeuw.","8":"Wee dengenen, die huis aan huis trekken, akker aan akker brengen, totdat er geen plaats meer zij, en dat gijlieden alleen inwoners gemaakt wordt in het midden des lands!","9":"Voor mijn oren *heeft* de HEERE der heirscharen *gesproken*: Zo niet vele huizen tot verwoesting zullen worden, de grote en de treffelijke zonder inwoner!","10":"Ja, tien bunderen wijngaards zullen een enig bath geven, en een homer zaads zal een efa geven.","11":"Wee dengenen, die, zich vroeg opmakende in den morgenstond, sterken drank najagen, *en* vertoeven tot in de schemering, *totdat* de wijn hen heeft verhit!","12":"En harpen en luiten, trommelen en pijpen, en wijn zijn *in* hun maaltijden; maar zij aanschouwen het werk des HEEREN niet, en zij zien niet op het maaksel Zijner handen.","13":"Daarom zal mijn volk gevankelijk weggevoerd worden, omdat het geen wetenschap heeft; en deszelfs heerlijken zullen honger lijden, en hun menigte zal verdorren van dorst.","14":"Daarom zal het graf zichzelf wijd opensperren, en zijn mond opendoen, zonder maat; opdat nederdale haar heerlijkheid, en haar menigte, met haar gedruis, en die in haar van vreugde opspringt.","15":"Dan zal de gemene man nedergebogen worden, en de aanzienlijke man zal vernederd worden, en de ogen der hovaardigen zullen vernederd worden.","16":"Doch de HEERE der heirscharen zal verhoogd worden door het recht; en God, die Heilige, zal geheiligd worden door gerechtigheid.","17":"En de lammeren zullen weiden naar hun wijze, en de vreemdelingen zullen de woeste plaatsen der vetten eten.","18":"Wee dengenen, die de ongerechtigheid trekken met koorden der ijdelheid, en de zonde als *met* dikke wagenzelen!","19":"Die daar zeggen: Dat Hij haaste, dat Hij Zijn werk bespoedige, opdat wij het zien; en laat naderen en komen den raadslag des Heiligen van Israël, dat wij *het* vernemen!","20":"Wee dengenen, die het kwade goed heten, en het goede kwaad; die duisternis tot licht stellen, en het licht tot duisternis; die het bittere tot zoet stellen, en het zoete tot bitterheid!","21":"Wee dengenen, die in hun ogen wijs, en bij zichzelven verstandig zijn!","22":"Wee dengenen, die helden zijn om wijn te drinken, en die kloeke mannen zijn om sterken drank te mengen!","23":"Die den goddeloze rechtvaardigen om een geschenk, en de gerechtigheid der rechtvaardigen van dezelven afwenden.","24":"Daarom, gelijk de tong des vuurs den stoppel verteert, en het kaf door de vlam verdaan wordt, *alzo* zal hun wortel als een uittering wezen; en hun bloem zal als stof opvaren; omdat zij verwerpen de wet des HEEREN der heirscharen, en de rede des Heiligen van Israël versmaden.","25":"Daarom is de toorn des HEEREN ontstoken tegen Zijn volk, en Hij heeft tegen hetzelve Zijn hand uitgestrekt, en Hij heeft het geslagen, zodat de bergen hebben gebeefd, en hun dode lichamen zijn geworden als drek in het midden der straten. Om dit alles keert zich Zijn toorn niet af, maar Zijn hand is nog uitgestrekt.","26":"Want Hij zal een banier opwerpen onder de heidenen van verre, en Hij zal hen *herwaarts* sissen van het einde der aarde; en ziet, haastelijk, snellijk zullen zij aankomen.","27":"Geen moede, en geen struikelende zal onder hen wezen; niemand zal sluimeren noch slapen, noch de gordel zijner lendenen ontbonden worden, noch de schoenriem zijner schoenen afgescheurd worden.","28":"Welker pijlen scherp zullen zijn, en al hun bogen gespannen; hunner paarden hoeven zullen als een rots geacht zijn, en hun raderen als een wervelwind.","29":"Hun gebrul zal zijn als van een ouden leeuw, en zij zullen brullen als de jonge leeuwen, en zij zullen briesen, en den roof aangrijpen en wegvoeren; en er zal geen verlosser zijn.","30":"En zij zullen tegen hetzelve te dien dage bruisen, als het bruisen der zee. Dan zal men de aarde aanzien, maar ziet, er zal duisternis *en* benauwdheid zijn, en het licht zal verduisterd worden in hun verwoestingen."},"KJV":{"1":"Now will I sing to my wellbeloved a song of my beloved touching his vineyard. My wellbeloved hath a vineyard in a very fruitful hill:","2":"And he fenced it, and gathered out the stones thereof, and planted it with the choicest vine, and built a tower in the midst of it, and also made a winepress therein: and he looked that it should bring forth grapes, and it brought forth wild grapes.","3":"And now, O inhabitants of Jerusalem, and men of Judah, judge, I pray you, betwixt me and my vineyard.","4":"What could have been done more to my vineyard, that I have not done in it? wherefore, when I looked that it should bring forth grapes, brought it forth wild grapes?","5":"And now go to; I will tell you what I will do to my vineyard: I will take away the hedge thereof, and it shall be eaten up; *and* break down the wall thereof, and it shall be trodden down:","6":"And I will lay it waste: it shall not be pruned, nor digged; but there shall come up briers and thorns: I will also command the clouds that they rain no rain","7":"For the vineyard of the LORD of hosts *is* the house of Israel, and the men of Judah his pleasant plant: and he looked for judgment, but behold oppression; for righteousness, but behold a cry.","8":"Woe unto them that join house to house, *that* lay field to field, till *there be* no place, that they may be placed alone in the midst of the earth!","9":"In mine ears *said* the LORD of hosts, Of a truth many houses shall be desolate, *even* great and fair, without inhabitant.","10":"Yea, ten acres of vineyard shall yield one bath, and the seed of an homer shall yield an ephah.","11":"Woe unto them that rise up early in the morning, *that* they may follow strong drink; that continue until night, *till* wine inflame","12":"And the harp, and the viol, the tabret, and pipe, and wine, are in their feasts: but they regard not the work of the LORD, neither consider the operation of his hands.","13":"Therefore my people are gone into captivity, because *they have* no knowledge: and their honourable men *are* famished, and their multitude dried up with thirst.","14":"Therefore hell hath enlarged herself, and opened her mouth without measure: and their glory, and their multitude, and their pomp, and he that rejoiceth, shall descend","15":"And the mean man shall be brought down, and the mighty man shall be humbled, and the eyes of the lofty shall be humbled:","16":"But the LORD of hosts shall be exalted in judgment, and God that is holy shall be sanctified in righteousness.","17":"Then shall the lambs feed after their manner, and the waste places of the fat ones shall strangers eat.","18":"Woe unto them that draw iniquity with cords of vanity, and sin as it were with a cart rope:","19":"That say, Let him make speed, *and* hasten his work, that we may see *it*: and let the counsel of the Holy One of Israel draw nigh and come, that we may know","20":"Woe unto them that call evil good, and good evil; that put darkness for light, and light for darkness; that put bitter for sweet, and sweet for bitter!","21":"Woe unto *them that are* wise in their own eyes, and prudent in their own sight!","22":"Woe unto *them that are* mighty to drink wine, and men of strength to mingle strong drink:","23":"Which justify the wicked for reward, and take away the righteousness of the righteous","24":"Therefore as the fire devoureth the stubble, and the flame consumeth the chaff, *so* their root shall be as rottenness, and their blossom shall go up as dust: because they have cast away the law of the LORD of hosts, and despised the word of the Holy One of Israel.","25":"Therefore is the anger of the LORD kindled against his people, and he hath stretched forth his hand against them, and hath smitten them: and the hills did tremble, and their carcases *were* torn in the midst of the streets. For all this his anger is not turned away, but his hand *is* stretched out","26":"And he will lift up an ensign to the nations from far, and will hiss unto them from the end of the earth: and, behold, they shall come with speed swiftly:","27":"None shall be weary nor stumble among them; none shall slumber nor sleep; neither shall the girdle of their loins be loosed, nor the latchet of their shoes be broken:","28":"Whose arrows *are* sharp, and all their bows bent, their horses' hoofs shall be counted like flint, and their wheels like a whirlwind:","29":"Their roaring *shall be* like a lion, they shall roar like young lions: yea, they shall roar, and lay hold of the prey, and shall carry *it* away safe, and none shall deliver","30":"And in that day they shall roar against them like the roaring of the sea: and if *one* look unto the land, behold darkness *and* sorrow, and the light is darkened in the heavens"}},"tsk":{"1":[{"kopje":"Nu","refs":["Deut 31:19-22","Richt 5:1-31","Ps 45:2","Ps 101:1"]},{"kopje":"Beminde","refs":["Hoogl 2:16","Hoogl 5:2","Hoogl 5:16","Hoogl 6:3"]},{"kopje":"over","refs":["Jes 27:2","Jes 27:3","Ps 80:9","Hoog pan> without <span class=\"wl wl-kjv\" data-code=\"H2706\">measure:</span> and their <span class=\"wl wl-kjv\" data-code=\"H1926\">glory,</span> and their <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude,</span> and their <span class=\"wl wl-kjv\" data-code=\"H7588\">pomp,</span> and he that <span class=\"wl wl-kjv\" data-code=\"H5938\">rejoiceth,</span> shall descend","15":"And the mean <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> shall be brought <span class=\"wl wl-kjv\" data-code=\"H7817\">down,</span> and the mighty <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> shall be <span class=\"wl wl-kjv\" data-code=\"H8213\">humbled,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> of the <span class=\"wl wl-kjv\" data-code=\"H1364\">lofty</span> shall be humbled:","16":"But the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts</span> shall be <span class=\"wl wl-kjv\" data-code=\"H1361\">exalted</span> in <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment,</span> and <span class=\"wl wl-kjv\" data-code=\"H410\">God</span> that is <span class=\"wl wl-kjv\" data-code=\"H6918\">holy</span> shall be <span class=\"wl wl-kjv\" data-code=\"H6942\">sanctified</span> in righteousness.","17":"Then shall the <span class=\"wl wl-kjv\" data-code=\"H3532\">lambs</span> <span class=\"wl wl-kjv\" data-code=\"H7462\">feed</span> after their <span class=\"wl wl-kjv\" data-code=\"H1699\">manner,</span> and the waste <span class=\"wl wl-kjv\" data-code=\"H2723\">places</span> of the fat <span class=\"wl wl-kjv\" data-code=\"H4220\">ones</span> shall <span class=\"wl wl-kjv\" data-code=\"H1481\">strangers</span> eat.","18":"<span class=\"wl wl-kjv\" data-code=\"H1945\">Woe</span> unto them that <span class=\"wl wl-kjv\" data-code=\"H4900\">draw</span> <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity</span> with <span class=\"wl wl-kjv\" data-code=\"H2256\">cords</span> of <span class=\"wl wl-kjv\" data-code=\"H7723\">vanity,</span> and <span class=\"wl wl-kjv\" data-code=\"H2403\">sin</span> as it were with a <span class=\"wl wl-kjv\" data-code=\"H5699\">cart</span> rope:","19":"That <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Let him make <span class=\"wl wl-kjv\" data-code=\"H4116\">speed,</span> and <span class=\"wl wl-kjv\" data-code=\"H2363\">hasten</span> his <span class=\"wl wl-kjv\" data-code=\"H4639\">work,</span> that we may <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> it: and let the <span class=\"wl wl-kjv\" data-code=\"H6098\">counsel</span> of the Holy <span class=\"wl wl-kjv\" data-code=\"H6918\">One</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> draw <span class=\"wl wl-kjv\" data-code=\"H7126\">nigh</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> that we may know","20":"<span class=\"wl wl-kjv\" data-code=\"H1945\">Woe</span> unto them that <span class=\"wl wl-kjv\" data-code=\"H559\">call</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">good,</span> and <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil;</span> that <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> <span class=\"wl wl-kjv\" data-code=\"H2822\">darkness</span> for <span class=\"wl wl-kjv\" data-code=\"H216\">light,</span> and <span class=\"wl wl-kjv\" data-code=\"H216\">light</span> for <span class=\"wl wl-kjv\" data-code=\"H2822\">darkness;</span> that <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> <span class=\"wl wl-kjv\" data-code=\"H4751\">bitter</span> for <span class=\"wl wl-kjv\" data-code=\"H4966\">sweet,</span> and <span class=\"wl wl-kjv\" data-code=\"H4966\">sweet</span> for bitter!","21":"<span class=\"wl wl-kjv\" data-code=\"H1945\">Woe</span> unto them that are <span class=\"wl wl-kjv\" data-code=\"H2450\">wise</span> in their o 120\">speed</span> swiftly:","27":"None shall be <span class=\"wl wl-kjv\" data-code=\"H5889\">weary</span> nor <span class=\"wl wl-kjv\" data-code=\"H3782\">stumble</span> among them; none shall <span class=\"wl wl-kjv\" data-code=\"H5123\">slumber</span> nor <span class=\"wl wl-kjv\" data-code=\"H3462\">sleep;</span> neither shall the <span class=\"wl wl-kjv\" data-code=\"H232\">girdle</span> of their <span class=\"wl wl-kjv\" data-code=\"H2504\">loins</span> be <span class=\"wl wl-kjv\" data-code=\"H6605\">loosed,</span> nor the <span class=\"wl wl-kjv\" data-code=\"H8288\">latchet</span> of their <span class=\"wl wl-kjv\" data-code=\"H5275\">shoes</span> be broken:","28":"Whose <span class=\"wl wl-kjv\" data-code=\"H2671\">arrows</span> are <span class=\"wl wl-kjv\" data-code=\"H8150\">sharp,</span> and all their <span class=\"wl wl-kjv\" data-code=\"H7198\">bows</span> <span class=\"wl wl-kjv\" data-code=\"H1869\">bent,</span> their <span class=\"wl wl-kjv\" data-code=\"H5483\">horses'</span> <span class=\"wl wl-kjv\" data-code=\"H6541\">hoofs</span> shall be <span class=\"wl wl-kjv\" data-code=\"H2803\">counted</span> like <span class=\"wl wl-kjv\" data-code=\"H6862\">flint,</span> and their <span class=\"wl wl-kjv\" data-code=\"H1534\">wheels</span> like a whirlwind:","29":"Their <span class=\"wl wl-kjv\" data-code=\"H7581\">roaring</span> shall be like a <span class=\"wl wl-kjv\" data-code=\"H3833\">lion,</span> they shall <span class=\"wl wl-kjv\" data-code=\"H7580\">roar</span> like young <span class=\"wl wl-kjv\" data-code=\"H3715\">lions:</span> yea, they shall <span class=\"wl wl-kjv\" data-code=\"H5098\">roar,</span> and lay <span class=\"wl wl-kjv\" data-code=\"H270\">hold</span> of the <span class=\"wl wl-kjv\" data-code=\"H2964\">prey,</span> and shall carry it away <span class=\"wl wl-kjv\" data-code=\"H6403\">safe,</span> and none shall deliver","30":"And in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> they shall <span class=\"wl wl-kjv\" data-code=\"H5098\">roar</span> against them like the <span class=\"wl wl-kjv\" data-code=\"H5100\">roaring</span> of the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea:</span> and if one <span class=\"wl wl-kjv\" data-code=\"H5027\">look</span> unto the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> behold <span class=\"wl wl-kjv\" data-code=\"H2822\">darkness</span> and <span class=\"wl wl-kjv\" data-code=\"H6862\">sorrow,</span> and the <span class=\"wl wl-kjv\" data-code=\"H216\">light</span> is <span class=\"wl wl-kjv\" data-code=\"H2821\">darkened</span> in the heavens"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"mijn Beminde","tekst":"Aldus noemt de profeet Jezus Christus driemaal in vs.1. De zin is: Hij is de Bruidegom zijner gemeente; ik ben zijn dienaar en vriend; Son 2:2 ; Joh 3:29 ."},{"catchword":"een lied","tekst":"Dat is, een lied, hetwelk Hij mij zelf heeft ingegeven en in mijnen mond gelegd, dit zal ik zingen en ook beschrijven, opdat het niet vergeten worde, maar van allen man moge onthouden, gelezen en gezongen worden, gelijk Mozes ook te dien einde een lied gemaakt heeft, Deu 32 ."},{"catchword":"van Zijn wijngaard;","tekst":"Dat is, van zijne gemeente. Zie dergelijke manier van spreken onder vs.7, en Exo 15:17 ; Psa 44:3 , en Psa 80:9 ; Isa 27:2 ; Jer 2:21 ; Mat 21:33 ; Mar 12:1 ; Luk 20:9 ; Joh 15:1 ."},{"catchword":"op een vetten heuvel","tekst":"Hebreeuws, op een hoorn van een zoon der olie, of vettigheid; dat is, in een uitnemende plaats van vetten vruchtbaren grond. Zie Job 5:7 ."}],"2":[{"catchword":"En Hij heeft dien","tekst":"In vs.2 wordt met verbloemde woorden beschreven de zorg Gods over zijne gemeente."},{"catchword":"omtuind,","tekst":"Hebreeuws eigenlijk gesterkt; te weten met een muur of heg, zie vs.5, dat is, beschut en beschermd tegen het geweld van al de vijanden van hem en zijne kerk."},{"catchword":"een toren","tekst":"Te weten, om de wacht daarin te houden, om op de dieven en wilde dieren te passen en die te verdrijven."},{"catchword":"wijnbak","tekst":"Anders, een wijnpers."},{"catchword":"Hij heeft verwacht,","tekst":"Vergelijk onder vs.7."},{"catchword":"druiven","tekst":"Of, beziën, of vruchten."},{"catchword":"voortbrengen","tekst":"Hebreeuws, maken en zo terstond wederom in vs.2 en onder vs.10, twee maal; gelijk Mat 3:8 , Mat 3:10 , en Mat 7:17-19 ; vergelijk Psa 1:3 ."},{"catchword":"stinkende druiven","tekst":"Of, zure, onrijpe, ontijdige, wilde druiven, of wrange. Doch het Hebreeuwse woord komt van stinken."}],"3":[{"catchword":"Nu dan,","tekst":"Hier spreekt God de Heere, en Hij geeft het oordeel over, zelfs dien, over wien Hij klaagt."}],"4":[{"catchword":"Wat is er","tekst":"Alsof God zeide: Dewijl Ik mijn volk zoveel weldaden bewezen heb, en zij zo ondankbaar zijn geweest, zo oordeelt gijzelf wat er in het toekomende anders te doen zij dan dat Ik mijn ondeugenden wijngaard verwoest? Vergelijk Mat 21:40-41 , waar de Heere Christus bijkans dezelfde gelijkenis den overpriesters en oudsten der Joden voorgesteld hebbende, aan henzelven het oordeel vraagsgewijze voorstelt, en daarop gelijk antwoord van hen ontvangt, gelijk God hier, vs.5, geeft. Anderen nemen het aldus, dat God met deze woorden wil te kennen geven: Hij heeft zoveel goeds aan zijn volk, boven andere natiën, gedaan, dat zij in alle manieren dankbaar behoorden te zijn; maar dewijl zij ondankbaar waren, dat zij zelfs, zo van hunne verdorvenheid als van de rechtvaardigheid der verdiende straffen moesten overtuigd zijn. Van de krachtige inwendige werking van den Heiligen Geest wordt in deze gelijkenis, die alleenlijk slaat op de uitwendige beroeping (genomen zijnde van den uitwendigen arbeid des wijngaardeniers) niet gesproken."},{"catchword":"Waarom","tekst":"Menselijkerwijze gesproken; gelijk mensen hun misnoegen plegen te tonen, wanneer zij veel goeds aan een onwaardige en ondankbare gedaan hebben en zeer kwalijk beloond worden. Hierop volgt het vonnis van God, vs.5."},{"catchword":"voortgebracht?","tekst":"Hebreeuws, gemaakt."}],"5":[{"catchword":"wat Ik","tekst":"Dat is, hoe Ik de ondankbaarheid van mijn volk straffen zal."},{"catchword":"Ik zal zijn","tekst":"Dat is, Ik zal dit volk voortaan niet beschermen tegen zijne vijanden, maar Ik zal het laten verderven en te schande komen."},{"catchword":"tuin wegnemen,","tekst":"Of, haag, of heg."},{"catchword":"opdat hij zij","tekst":"Of, opdat hij vertreden worde."}],"6":[{"catchword":"Ik zal hem","tekst":"Of, Ik zal hem woest maken; dat is, Ik zal Juda beroven van zijne regering, die totnogtoe in het land is onderhouden geweest, achtervolgens de wijze in mijne wet voorgeschreven."},{"catchword":"hij zal niet","tekst":"Dat is, de kerkedienst en andere heilige oefeningen zullen ophouden."},{"catchword":"besnoeid,","tekst":"Of, gezuiverd, gewied worden."},{"catchword":"distelen en doornen","tekst":"De zin is: Van een wijngaard zal het een doornbos worden, dat is, heel woest en wild liggen."},{"catchword":"Ik zal den wolken","tekst":"Alsof God zeide: Ik zal dit volk niet meer verkwikken, gelijk Ik tevoren gedaan heb, maar zal hen in Babylon en elders in droefenis laten verdwijnen; zie Psa 137 zie ook Job 36:32 ."}],"7":[{"catchword":"Want","tekst":"Anders: zekerlijk. In vs.7 verklaart de profeet de bovenverhaalde gelijkenis."},{"catchword":"de mannen","tekst":"Dat is, mannen tot den stam van Juda behorende."},{"catchword":"een plant","tekst":"Of plantsoenen, of plantingen; versta, het volk over hetwelk de Heere zich placht te vermaken."},{"catchword":"naar recht,","tekst":"Dat is, dat de rechters den onderdrukten zouden recht doen."},{"catchword":"schurftheid,","tekst":"Dat is, de rechters zijn schurftig, dat is goddeloos en kwellen het arme verdrukte volk, gelijk de schurftheid de mensen kwelt."},{"catchword":"naar gerechtigheid,","tekst":"Alsof Hij zeide: Ik heb gewacht dat men weduwen en wezen, alsook andere verdrukten, tot hun recht zou helpen; maar, enz."},{"catchword":"geschreeuw","tekst":"Of, geschrei, geroep, gekrijt; te weten der armen, die geweldiglijk onderdrukt worden, tot God schreiende en hem met tranen klagende den overlast en het ongelijk, dat hun wordt aangedaan. Zie Gen 18:20 . Eenigen verstaan dit van de klachten der armen, die onderdrukt worden door de lange rechtsgedingen, onder voorwendsel van de formaliteiten, die onder het pleiten gebruikt worden."}],"8":[{"catchword":"trekken,","tekst":"Of, doen strekken, of voegen; te weten onrechtvaardiglijk en met schade van hunnen naaste."},{"catchword":"geen plaats","tekst":"Te weten, waar de arme moge wonen, of akkeren."}],"9":[{"catchword":"Voor mijn oren","tekst":"Dat is, de Heere heeft het mij geopenbaard, of Hij heeft het gezegd dat ik het gehoord heb."},{"catchword":"Zo niet vele","tekst":"Dit is een wijze of manier van zweren. Zie Gen 14:23 . Anders: zekerlijk, of voorwaar vele huizen zullen, enz."},{"catchword":"de treffelijke","tekst":"Hebreeuws, de goede; dat is treffelijke, schone."},{"catchword":"zonder inwoner","tekst":"Terwijl daar niemand zijn zal die ze bewoont."}],"10":[{"catchword":"Ja, tien","tekst":"God de Heere dreigt in vs.10 dat Hij, vanwege de gruwelijke zonden des volks, het land onvruchtbaar zou maken, alzo dat zij van het gezaaide en geplante het tiende deel niet inoogsten zouden."},{"catchword":"bunderen","tekst":"Een bunder is zoveel land als een paar ossen op een dag kan omploegen. Anders, tien juk ossen; dat is, zoveel lans als tien juk ossen op een dag kunnen omploegen."},{"catchword":"Bath . . . efa","tekst":"Bath en efa waren even groot, maar bath was een maat, waar men natte dingen mede mat, al wijn, olie, enz., en efa was een maat, waar men droge dingen mede mat, als koren, enz. Van bath zie 1Ki 7:26 , en van efa Lev 5:11 ."},{"catchword":"homer zaads","tekst":"Van homer, [anders, cor] zie de aantekening 1Ki 4:22 , en Eze 45:11 , Eze 45:14 ."},{"catchword":"geven","tekst":"Hebreeuws, maken. Alsook in het voorgaande."}],"11":[{"catchword":"sterken drank","tekst":"Hebreeuws, Schechar; zie onder vs.22."},{"catchword":"vertoeven","tekst":"Of, houden zich op."},{"catchword":"de schemering,","tekst":"Het Hebreeuwse woord betekent zowel de morgenschemering als de avondschemering, gelijk Job 7:4 ; Pro 7:9 ."}],"12":[{"catchword":"zij aanschouwen","tekst":"Dat is, zij geven geen acht op het werk des Heeren, dat is op de gevankelijke wegvoering der tien stammen naar Assyrië, te weten door Salmanasser; 2Ki 17:6 , en 2Ki 18:12 ; Amo 6:6 . Anderen nemen het woord werk algemener in dezen zin: Zij zien niet op zijne gerichten, die Hij in het werk stellen zal, dat is, op de straffen, die hun zullen overkomen, welke zij wel behoorden voor te komen met berouw en hartelijk leedwezen."},{"catchword":"zij zien niet","tekst":"Dit verstaan sommigen van het aanschouwen der zon, maan, sterren, enz., die ons des Heeren macht en wijsheid voor ogen stellen, en die ons behoorden te verwekken om God te eren, te loven en te prijzen."}],"13":[{"catchword":"zal mijn volk","tekst":"Hebreeuws, is mijn volk weggevoerd. Dit was wel te dezer tijd nog niet geschied; maar de profeten zijn gewoon te spreken van toekomstige dingen alsof zij alrede geschied en voltrokken waren, ten aanzien van de zekerheid der voorzeggingen Gods."},{"catchword":"gevankelijk","tekst":"Te weten, naar Babel."},{"catchword":"omdat","tekst":"Dat is, dewijl het des Heeren werk niet gekend noch in acht genomen heeft."},{"catchword":"en deszelfs heerlijken","tekst":"Hebreeuws, en zijne eer zullen mannen, of lieden des hongers zijn; dat is, de heerlijksten en voornaamsten onder het volk zullen honger lijden."},{"catchword":"hun menigte","tekst":"Dat is, het gemene volk, gelijk vs.14. Anders: en hun rijkdom zal verdorren van dorst, alzo ook vs.14."}],"14":[{"catchword":"Daarom","tekst":"De profeet wil zeggen dat er velen zullen omkomen, hetzij door honger en kommer, of door het zwaard. Anders: het graf heeft zichzelf wijd opengesperd, en zo doorgaans."},{"catchword":"zich wijd opensperren,","tekst":"Hebreeuws, zijne ziel; dat is, zichzelven. Anders: zijnen lust; [namelijk, die het graf heeft om vele mensen in te slokken en te verteren] gelijk Psa 27:12 , en Psa 41:3 , en Psa 105:22 ; Eze 16:27 ."},{"catchword":"zonder maat;","tekst":"Anders: boven gewoonte; zie de aantekening Jdg 11:39 ."},{"catchword":"nederdale","tekst":"Te wete in het graf."},{"catchword":"haar heerlijkheid,","tekst":"Te weten Jeruzalem, doch men kan hieronder het ganse Joodse volk verstaan."},{"catchword":"menigte,","tekst":"Dat is, het gemene volk, of hun rijkdom; gelijk boven vs.13."},{"catchword":"met haar gedruis,","tekst":"Te weten met die woeling, of het gedruis, hetwelk het heilloze gezin maakt in zijne brasserijen. Zie boven vs.11,12."},{"catchword":"die in haar","tekst":"Te weten, vrolijk zijnde in zijne brasserijen en wellusten binnen Jeruzalem, en voorts in het Joodse land."}],"15":[{"catchword":"de gemene man","tekst":"Zie boven Isa 2:9 , Isa 2:11 , Isa 2:17 ."},{"catchword":"zullen vernederd worden","tekst":"Te weten nadat zij met honger, pest, het zwaard en de gevangenschap bezocht zullen wezen."}],"16":[{"catchword":"door het recht;","tekst":"Te weten als Hij zichzelven zal betonen rechter te zijn, straffende de boosdoeners vanwege hunne zonden."},{"catchword":"zal geheiligd worden","tekst":"Dat is, God zal voor heilig erkend en geroemd worden, nadat Hij recht en gerechtigheid over de boze mensen zal geoefend hebben, straffende de boosdoeners en voorstaande degenen, die men met geweld is onderdrukkende."}],"17":[{"catchword":"En","tekst":"Hier stelt nu de profeet ene vertroosting na de dreigementen, willende te kennen geven dat God zijn volk eindelijk zal redden."},{"catchword":"de lammeren","tekst":"Anders: schapen; dat is de vrome, onnozele armen, die tevoren van de rijke goddelozen verdrukt werden."},{"catchword":"zullen weiden","tekst":"Dat is, God de Heere zal hen in zulken algemenen nood onderhouden en van nooddruft verzorgen."},{"catchword":"naar hun wijze,","tekst":"Hebreeuws, naar hunne leiding; dat is, gelijk zij tevoren gewoon waren te doen."},{"catchword":"de vreemdelingen","tekst":"Versta hier ook de vrome armen, die een tijdlang van de rijke goddelozen als vreemdelingen zijn geacht geweest, of die van de goddelozen of tirannen alzo zijn gekweld geweest, dat zij huis en hof hebben moeten verlaten. Anders: en zij zullen de verwoeste plaatsen der vette vreemdelingen eten."},{"catchword":"zullen de woeste plaatsen","tekst":"Dat is, genieten of bezitten de woeste plaatsen der vetten; dat is de huizen en akker, die de rijken hebben moeten verlaten, daaruit verdreven en gevankelijk weggevoerd zijnde."},{"catchword":"vetten eten","tekst":"Vetten voor rijke weelderige personen, wordt ook gebruikt Psa 22:30 ; Isa 10:16 . Zij worden Amo 4:1 genoemd koeien van Basan."}],"18":[{"catchword":"trekken","tekst":"Anders, [tot zich] trekken."},{"catchword":"met koorden","tekst":"Of, met zelen, of strikken, of banden der leugen. De zin is, die met schoonschijnende redenen, onder dezen of dien dekmantel, boosheid oefenen en als aanhalen en aanhouden, zichzelven inbeeldende dat het hun altijd wel zal gaan, en dat alles wat de profeten hun dreigen en prediken van de aanstaande straffen Gods, maar verbeelding is. Het is ene manier van spreken, genomen van degenen, die een schip of wagen met koorden aanhalen."}],"19":[{"catchword":"zeggen","tekst":"Te weten al spottende. Alsof zij zeiden: Men dreigt ons elke reis, maar daar volgt niets op. Is het God ernst, zo laat Hem spoeden, enz.; wij vragen naar uwe dreigementen niet, laat God vrij komen als Hij wil. Aldus bespottende de lankmoedigheid des Heeren; zie boven vs.12."},{"catchword":"Zijn werk","tekst":"Dat is, zijne straffen, waarmede gij ons zo dikwijls dreigt."},{"catchword":"den raadslag","tekst":"Of, den raad; dat is, hetgeen Hij in zijnen raad besloten heeft."},{"catchword":"des Heiligen","tekst":"Dat is, van God den Heere, die daar is die Heilige, die men schuldig is te eren en te vrezen. Zie boven Isa 1:4 ."},{"catchword":"dat wij het","tekst":"Alsof zij zeiden: Gij, Jesaja en andere profeten, vervaart ons met ijdele dreigementen; doch God heeft tegen ons niets kwaads voor."},{"catchword":"vernemen","tekst":"Of, wijs worden, of weten mogen."}],"20":[{"catchword":"die het kwade","tekst":"Hebreeuws, die zeggen tot, of van het kwade goed, enz.; vergelijk boven Isa 4:3 . Dat is, die door hun arglistige redenen de onervarenen wijs maken dat het goede kwaad en het kwade goed is."},{"catchword":"die duisternis","tekst":"Dat is, die stoutelijk en onbeschaamdelijk durven zeggen dat de duisternis licht is en het licht duisternis."}],"21":[{"catchword":"in hun ogen","tekst":"Dat is, in hun eigen oordeel; alzo in het volgende. Hebreeuws, voor hun aangezicht; dat is, bij zichzelven."}],"22":[{"catchword":"sterken drank","tekst":"Hebreeuws, Schechar. Eenigen menen dat dit woord ook den wijn insluit en begrijpt. Anderen menen dat het allerlei sterken drank betekent, behalve den wijn. Zie de aantekening Lev 10:9 ."},{"catchword":"te mengen","tekst":"De Joden, alsook andere natiën in de oosterse landen, plachten eertijds, gelijk nu nog, hun wijn met water of specerijen te vermengen; maar het Hebreeuwse woord betekent hier zoveel als uitdrinken; want daar is gene kloekheid of dapperheid in het inschenken of vermengen van den wijn gelegen."}],"23":[{"catchword":"rechtvaardigen","tekst":"Dat is, recht geven daar hij onrecht heeft. Zie Num 35:31 ; Deu 25:1 ."},{"catchword":"afwenden","tekst":"Mits hun onrecht gevende, alsof zij enige onrechtvaardige zaken voorhadden."}],"24":[{"catchword":"de tong","tekst":"Dat is, de vlam des vuurs, die enige gedaante der tong heeft; ook schijnt ze te lekken gelijk de tong doet."},{"catchword":"verteert,","tekst":"Hebreeuws, opeten, dat is verteert, verslindt."},{"catchword":"verdaan wordt,","tekst":"Hebreeuws, verslapt wordt, of afneemt, of verzwakt wordt."},{"catchword":"wortel","tekst":"Eenigen verstaan hier door den wortel de ouders, door de bloemen de kinderen. Anderen menen dat hier in het algemeen te verstaan zij de nietigheid en verdwijning der goddelozen; alzo dat opvaren, opgaan [hetwelk in het Hebreeuws staat] hier betekent tenietgaan, verdwijnen, verzwinden, gelijk een opgaande rook."},{"catchword":"als een uittering","tekst":"Anders, als snot worden, dat is, hun wortel zal vervuilen en als snot worden; want de vervuilende wortelen worden als witte snot."},{"catchword":"bloem","tekst":"Of, bot, knop."}],"25":[{"catchword":"uitgestrekt,","tekst":"Te weten om hetzelve te slaan. Zie boven Isa 1:5 ."},{"catchword":"de bergen","tekst":"Dit is een overtollige manier van spreken, hyperbole in de scholen genoemd. Het is een voorzegging van de aanstaande verwoesting van het Joodse volk."},{"catchword":"hun dode lichamen","tekst":"Te weten die van de vijanden verslagen zijn."},{"catchword":"zijn geworden","tekst":"Of, zijn verscheurd, of verdelgd, in het midden der straten."},{"catchword":"Om dit","tekst":"Of, met dit al. Alsof hij zeide: Al is het dat de Heere zijn volk zo zwaarlijk gestraft heeft, gelijk straks verhaald is, en mocht schijnen derhalve met hetzelve verzoend te wezen; nochtans blijft Hij nog evenwel op hetzelve vertoorn; aangezien het zich tot God niet keert; alzo onder Isa 9:11-12 ."},{"catchword":"uitgestrekt","tekst":"Om verder te slaan; zie Lev 26:14-15 , enz."}],"26":[{"catchword":"Want Hij","tekst":"Hier verhaalt nu de profeet verder hetgeen hij op het einde van vs.25 begonnen heeft te zeggen, te weten dat de hand des Heeren verheven is."},{"catchword":"een banier","tekst":"Dat is, een leger van vijanden."},{"catchword":"opwerpen","tekst":"Dat is, Hij zal hun een teken geven, dat zij komen en het Joodse volk overvallen. Of, Hij zal de Chaldeën, Babyloniërs, Assyriërs [die hier onder den naam van heidenen te verstaan zijn] door zijn heimelijke en rechtvaardige regering aanlokken en tegen de Joden opmaken."},{"catchword":"onder de heidenen","tekst":"Of, onder de heidenen, die verre zijn; dat is, die van verre komen zullen."},{"catchword":"sissen","tekst":"Of, schuifelen, sijfelen, fluiten. Anders: Hij zal hen tot hem sissen. De zin is: Dat het God den Heer zeer licht is een groot heir op de been te brengen tot uitvoering van zijne oordelen over degenen, die Hij straffen wil. Zie dergelijke manier van spreken Isa 7:18 ; Zec 10:8 ."},{"catchword":"ziet,","tekst":"Dit ziet op hetgeen boven vs.19 staat. Alsof hij hier zeide: Gijlieden bespot mijne dreigementen, zeggende: Dat Hij haaste, dat Hij zijn werk bespoedige, enz. Zie nu zal Hij haasten, teweegbrengende dat haastelijk, snellijk, de vijand komen zal om u te verdelgen."},{"catchword":"zullen zij aankomen","tekst":"Hebreeuws, zal zij komen, te weten de banier met het volk daaronder behorende. Anders, hij, te weten de koning van Babel met zijn leger. Anders, het, te weten het volk."}],"27":[{"catchword":"Geen moede,","tekst":"Hij wil zeggen: Dat er niemand in dat leger, of onder dat krijgsvolk, moede zal worden in het marcheren op die lange reis; aldus te kennen gevende de gewillige gehoorzaamheid der volkeren, die God tewerk stellen zou."},{"catchword":"niemand","tekst":"Zij zullen altegaar wakker en in hunne aanslagen voorzichtig zijn."},{"catchword":"noch de gordel","tekst":"Dat is, zij zullen steeds vaardig zijn om te strijden, staande gewapend tot aller ure."}],"28":[{"catchword":"Welker pijlen","tekst":"Hebreeuws, welker, te weten volks, namelijk dat in het leger zijn zal. Alzo wordt in het volgende het getal van een gesteld voor het getal van velen. De profeet wil zeggen dat het volk, hetwelk God gebruiken zal om strafoefening te doen, welgewapend en toegerust zal wezen."},{"catchword":"gespannen;","tekst":"Hebreeuws, getreden; omdat men den voet op en kruisboog zet als men hem spant. Zie Psa 7:13 ."},{"catchword":"hoeven","tekst":"Hebreeuws, klauwen."},{"catchword":"een rots","tekst":"Te weten zo scherp en zo hard als een kei of rotssteen, zodat zij van lopen en rennen niet verslijten zullen. Het tegendeel is geschied Jdg 5:22 ."},{"catchword":"hun raderen","tekst":"Dat is, hunne wagens zullen zeer snellijk aankomen."}],"29":[{"catchword":"Hun gebrul","tekst":"Met deze woorden beschrijft de profeet de wreedheid van het volk, hetwelk de Heere tegen de Joden zou zenden om hen te vernielen."},{"catchword":"ouden leeuw,","tekst":"Of, fellen, of gruwelijken leeuw."},{"catchword":"den roof","tekst":"Het Hebreeuwse woord betekent eigenlijk een dier, hetwelk met de tanden en klauwen van een ander dier verscheurd is."}],"30":[{"catchword":"zij zullen","tekst":"Te weten die vreemde natiën, de Chaldeën en anderen."},{"catchword":"tegen hetzelve","tekst":"Te weten tegen het Joodse volk, dat zo jammerlijk zal mishandeld wezen."},{"catchword":"Dan zal men","tekst":"Dit is ene gelijkenis, genomen van degenen, die in storm en onweder op zee in groot gevaar van hun leven zijnde, van verre het land aanzien, wensende dat zij ergens konden aanvaren en aanlanden. Zij zien ook dikwijls opwaarts ten hemel of het weder niet opklaart; alzo zullen die van Jeruzalem, als zij van hunne vijanden aangevallen worden, rondom zich zien of er nergens gene hulp voor hen te vinden is, maar tevergeefs, zij zullen gene vinden."},{"catchword":"er zal duisternis","tekst":"Anders: daar is duisternis der benauwdheid. De zin is, daar zal gene hoop voorhanden zijn; wat gemeenlijk vreugde pleegt aan te brengen, dat zal hun angst aanbrengen."},{"catchword":"in haar verwoestingen","tekst":"Anders, in, of, aan, of onder hunnen hemel; dat is, aan den hemel, waaronder het land van Judea gelegen is. Van duisternis, zie Gen 15:12 ; van het licht, Job 18:5 ; van beiden, Job 30:26 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Now will I sing to my Belong [Thus the Prophet calleth Jesus Christ three times in this verse. The meaning is, he is the Bridegroom of his Church, I am his minister, and Friend; Can.2.2. Job 3:29.] a song of my best beloved [that is, a song which he himself endited to me, and put into my mouth; this song will I sing, and also set down in writing, that it may not be forgotten, but may be remembered, read, and sung by all, as Moses also penned a song for the same end and purpose, Deut.32.] concerning his Vineyard: [that is, concerning his church. See the like phrase, below v.7. and Exo.15.17. Ps.44.3. & 80.9. Isa 27:2. Jer 2:21. Mat 21:33. Mar.12.1. Luk 20:9. Job 15:5.] My Beloved hath a vineyard on a far hill. [Hebr. On a fat hill. [Hebr. On a horn of a son oil, or fatness; that is, in an excellent place of fat fruitful ground. See Job 5.on vers.7.]"}],"2":[{"catchword":null,"tekst":"And he hedged the fence about, [Hebr. Properly, strengthened it; to wit, with a wall or hedge. See vers.5. That is, fenced & protected it against the power and violence, of all his and his Churches enemies] and cleansed (it) of the stones (thereof,) and be planted it, (with) noble vines: and he built a tower in the midst of it, [To wit, to keep watch in it, to watch thieves and wild beasts, and to drive and hunt them away] and also hewed out a wine-fat [Oth. A wine-press] therein: [In this verse is described in Rhetorical terms, Gods care for his church] and he looked, that it should bring forth, [Hebr. Make: and so again twice in this verse; that is, bring forth yield bear, as Mat 3:8. and chap.7. vers.17,18,19. Compare Psal.1.on vers.3.] (good grapes) [Or, berries, or, fruits] but it brought forth stinking grapes. [Or, sower, unripe, untimely, unseasonable, wile or, harsh grapes. Yet the Hebrew word is derived from stinking. Compare the two last clauses of this verse with below vers.7.]"}],"3":[{"catchword":null,"tekst":"Now then, the inhabitants of Jerusalem, and the men of Juda, judge, I pray you, between me, and between my vineyard. [Here God himself speaketh, and he refers the matter to be judged of, even by those, of whom he complaineth]"}],"4":[{"catchword":null,"tekst":"What is there to be done more to my vineyard, which I have not done to it? [As if the Lord had said: Seeing I have bestowed so many blessings and favours upon my people, and they have been so unthankful towards me for the same; therefore Judge ye now your selves, what else can be done for time to come; but that I should lay my unprofitable vineyard waste? Compare Mat 21:40,41. Where our Saviour Christ having propounded almost the same parable unto the High Priest and Eldest of the Jews, maketh them by way interrogation Judges of the cause, and thereupon receiveth the like answer, as the Lord here giveth, vers. 5. Others take it thus, that God will signify by these words, that he had done so much good unto his people, above other nations, that they ought every way to be thankful for it: but in regard they were unthankful, they were to be convinced as well of their own corruption and sinfulness, as of the justice of the punishments which they had deserved. Of the inward powerful working of the Holy Ghost is not spoken in this parable, which onely looketh at the outward calling, being taken from the outward labour and pains of the Lord or owner of the vineyard] wherefore did I look that it should bring forth (good) grapes, and it hath brought forth [Hebr. Made] stinking grapes? [Spoken after the manner of men: as men are wont to shew themselves to be fore discontented, when they have done much good to an unthankful and undeserving person, and are ill rewarded by him. Hereupon followeth the sentence of God, vers.5.]"}],"5":[{"catchword":null,"tekst":"Now then, I will tell you now, what I will do to my vineyard: [That is, how I will punish the unthankfulness of my people] I will take away the Hegde [or, fence] thereof, that it may be for a feeding of cattle, I will rent the wall thereof, that is may be for a treading down. [Or, that it may be trodden down. That is, I will not hence forward defend this people against their enemies, but I will suffer them to be wasted and destroyed]"}],"6":[{"catchword":null,"tekst":"And I will make it ( to be) a desolation, [Or, I will make it desolate, or, lay it waste; That is, I will deprive Juda of their government, which hitherto hath been maintain in the Land, according to the manner and custom prescribed in my law] it shall not be pruned, nor digged about, [Or, be cleansed, weeded. That is, the Ministry, and other holy exercises shall cease] but briers and thrones shall come up (in it:) [The meaning is, It shall be turned from a vineyard into a thorn ground; that is, lie utterly waste and wild] and I will command the clouds, that they rain no rain upon it. [As if the Lord had said, I will no more comfort and refresh this people, as I have done in former times, but will suffer them to pine away in grief and sorrow in Babylon and elsewhere. See Psal.137. See also Job 36.on vers.32.]"}],"7":[{"catchword":null,"tekst":"For [Oth. Surely] the vineyard of the LORD of Hosts is the house of Israel, [In this verse the Prophet expoundeth the above mentioned parable. Compare Psa 80:9.] and the men of Juda [That is, the men pertaining to the tribe of Juda] are a plant [Or, plants, plantings] of his delights: [Meaning the people in whom the Lord was wont to take delight] and he looked for judgement, [that is, that the judges should do justice, and relieve the oppressed] but behold it is scabbiness, [that is, the Judges are scabby; that is, wicked, and do vex and torment the poor oppressed people, as the itch or scabbiness doth vex and torment men] for righteousness, [As if he should say, I looked that they should help widows, and fatherless, and others that were oppressed, to their right: but, etc.] but behold it is a cry. [Or, crying out, clamour, roaring; To wit, of the poor that are mightily oppressed, crying unto God, and complaining to him with tears of the oppression, and wrong that is done unto them. See Genes.18.20. Some understand this of the complaints of the poor, that are oppressed by long and tedious suites, under a pretence of formalities that are to be used in pleading of causes.]"}],"8":[{"catchword":null,"tekst":"Wo unto them that draw [Or, cause to stretch, or, join] house to house, bring field to field, [To wit, unjustly, and with the harm and damage of their neighbour] till there be no more place. [To wit, where the poor may dwell, or no more fields] and that ye may he be made inhabitants alone in the midst of the Land. [Compare Mic 2:2.]"}],"9":[{"catchword":null,"tekst":"The LORD of Hosts (spake) before mine ears; [That is, the Lord revealed it unto me, or he said it in my hearing] If not many houses shall be for a desolation [This is a form or kind of an oath, see 14.23. Oth. Surely or verily, many houses shall be, etc.] the great, and the excellent (houses) [Hebr. The good, that is, the excellent, or fair houses] without inhabitant ! [Because there shall be none to inhabit them.]"}],"10":[{"catchword":null,"tekst":"Yea ten acres of vineyard, shall yield one Bath; and an Homer of seed, shall yield [Hebr. Make, So likewise in the former clause] an Epha. [The Lord threateneth in this verse, to make the land barren; because of the abominable sins of the people, so that they should not reap the tenth part of what they had sowen and planted. An acre is so much land, as a couple of oxen are able to plow in one day. Oth. Ten yoke of oxen; that is, as much land as ten yoke of oxen are able to plow in one day. Bath and Epha were of one size and bigness: but bath was a measure to mete moist commodities by, as wine, oil, etc. And Epha was a measure to mete dry commodities by, as corn, grain, etc. Of Bath see 1 Kings 7.on vers.26. and of Epha, Levit.5.on vers.11. Of Homer called otherwise (or) see the annotation, 1 Kings 4.22. and Ezech.45.11,14.]"}],"11":[{"catchword":null,"tekst":"Wo unto them that getting up early in the morning, hunt after strong drink, [Hebr. Schecher. See below on vers.22.] and continue [or, tarry up] until twilight, [The Hebrew word signifieth as well the morning twilight, or glimmering, as the evening twilight or glimmering, as Job 7:4. Pro 7:9.] till the wine hath inflamed them. [Compare Pro 23:19,20.]"}],"12":[{"catchword":null,"tekst":"And harps, and lutes, tabrets and pipes, and wine are (in) their feasts: but they behold not the work of the LORD, [That is, they give no heed to the work of the Lord; that is, to the carrying away of the ten tribes captive into Assyria; to wit, by Salmanasser, 2 Kings 17.6. and 18.12. Compare Amos.6.6. Others take the word work more generally, in this sense. They consider not his judgements, which he will put in practice; that is, the punishments which shall overtake them, which indeed they ought to prevent by hearty sorrow and reprentance] neither do they look upon the operation of his hands, [some understand this of beholding the Sun, Moon, Stars, &c. Which do set before our eyes the power and wisdom of God, and which ought to excite and stir us up to honour, praise, and magnify him.]"}],"13":[{"catchword":null,"tekst":"Therefore my people shall be carried away captive [To wit, to Babel. Heb. My people is carried away. This was not yet done at this time; but the Prophets are wont to speak of things to come, as if they had been already done and performed, in respect of the certainty of Gods predictions] because they have no knowledge: [that is, because they have not known nor considered the work of the Lord] and their honourable men shall suffer famine, [Heb. And his honour shall be men or persons of famine; that is, the most honourable and chiefest among the people shall suffer famine] and the multitude [that is, the common people, as v.14.] shall wither for thirst. [oth. And their cities shall wither for thirst. So also, vers.14.]"}],"14":[{"catchword":null,"tekst":"Therefore the grave shall spread it self wide, [Heb. His soul, etc. That is, shall enlarge her self, or spread her self wide. Oth. Her lust or desire, (namely, the lust or desire which the grave hath to swallow up and devour many men) as Psal.17.v.12. and 41.3. and 105.22. Eze 16:27.] and open her mouth without measure: [oth. Above or beyond custom. See the annotate. Judg.11.39. The Prophet doth intimate hereby, that very many shall perish and fall, either by famine and strait, or by the sword. Oth. The graveth hath spread it self wide, and so in the sequel] that her glory [to wit, Jerusalems glory; but hereby may be understood all the people of the Jews] and her multitude [that is, the common people: or, their riches, as above, v.13.] with their noise [to wit, with that stir and loud noise, which the wicked and ungodly crew make in their carousing and rioting, see above, v.11,12.] and he that leapeth up for joy in her, [to wit, being merry and jovial in his carousing&acirc;&euro;&trade;s & carnal delights within the city of Jerusalem, and consequently, in all the land of Juda] may descend (into it.)"}],"15":[{"catchword":null,"tekst":"Then the common (or mean) man shall be bowed down, and the honourable man shall he humbled, [See above, chap.2 9,11,17.] and the eyes of the proud shall be humbled. [to wit, after they shall be visited with famine, pestilence, sword, and captivity.]"}],"16":[{"catchword":null,"tekst":"But the LORD of hosts shall be exalted by judgement: [To wit, when he shall shew himself to be judge, punishing evil doers for their sins] and God that holy one, shall be hallowed by righteousness. [That is, God shall be acknowledged and extolled to be holy, after he shall have exercised judgement and justice upon wicked men, punishing evil doers, & defending those that are violently wronged and oppressed.]"}],"17":[{"catchword":null,"tekst":"And the lambs shall feed after their manner, and the strangers shall eat the waist places of the fat ones. [Here now the Prophet layeth down a comfort or consolation, after the afore-mentioned threatening, hereby to intimate that God will at length save and deliver his people. (And the lambs) Oth. Sheep: that is, the godly innocent, harmless poor, which were formerly wronged & oppressed by wicked rich men. (Shall feed) that is, God will sustain and preserve them in such a common and general calamity, and will supply them with necessaries. (After their manner) Heb. After their leading; that is, as they were wont to do in former time. (And the strangers) understand here also the godly poor, who for a while were counted as strangers by wicked rich men, or those that were so vexed and molested by wicked men or tyrants, that they were fain to forsake house and home, because of them, (Shall eat) that is, enjoy, possess (The waist places of the fat ones) that is, the houses, or fields, and lands, which the rich were fain to forsaken, being driven out of them, and carried away captive. Fat for rich men living in pleasure and delight, is also used, Psal.22.v.30. Isa 10:16. Amos 4.1. they are called Kine of Basan. Oth. And they shall eat the waste places of fat strangers.]"}],"18":[{"catchword":null,"tekst":"Wo unto them that draw [Oth. Draw toward themselves] iniquity with cords of vanity , and sin as it were (with) thick cart-ropes. [With cords of vanity, or with cords or snares, or bonds lying. The meaning is, that with fair and smooth speech&acirc;&euro;&trade;s, under this or that cloak or covering, practise wickedness, and as it shall always prosper, and that all that the Prophets threaten, and preach unto them concerning the approaching judgements of God, are but mere fancies. It is a phrase borrowed from those that pull or hale a ship or cart towards them with strong cords or ropes.]"}],"19":[{"catchword":null,"tekst":"That say, let him make speed, let him hasten his work, that we may see it: and let the counsel of the holy one of Israel draw nigh and come, that we may perceive (it.) [That say, &c. To wit, in a jeering and flouting way. As if they had said. They threaten us every time, but we seeing nothing follow. If God be in earnest, then let him make hast, etc., we care not for thy threatening, let God come when he will. Thus they scoff and mock at the patience and forbearance of the LORD. See above, v.12. (Let him hasten his work) That is, his judgements, wherewith thou threatenest us so often. (Let the counsel) or advice, decree; that is, that which he hath decreed or determined in his counsel. (of the holy one of Israel) that is, of God, who is that holy one, whom men ought to honour and fear, see above, ch.1.on v.4. know it. As if they had said, thou Isaiah, and other Prophets, you scare us with vain and idle threatening: but God meaneth no harm towards us.]"}],"20":[{"catchword":null,"tekst":"Wo unto them that call evil good, and good evil: [Heb. That say to, or of evil good, &c. Compare above, chap.4.3. That is, who by their cunning and crafty discourses make poor simple people believe, that evil is good, and good is evil] that is, who dare boldly and impudently say, that darkness is light, and light darkness] that put bitter for sweet, and sweet for bitterness,"}],"21":[{"catchword":null,"tekst":"Wo unto them that are wise in their (own) eyes [That is, in their own conceit, or judgement; so in the sequel. Heb. Before their (own) face; that is, in their own sight. [compare Pro 3:7. Rom 12:16.]"}],"22":[{"catchword":null,"tekst":"Wo unto them that are champions to drink wine: and that are valiant men to mingle strong drink. [The Jews, as also other Nations in the Eastern countries, were wont in former time, as also at this present day, to mingle their wine with water, or with spices. But the Hebrew word signifieth here as much as to drink it off: for no strength or valour consisteth in filling of wine, or mingling of it] strong drink, [Heb. Schechar. Some think that this word includes the wine also; but others, that it signifieth all manner of strong drink, besides wine. See Levit.10.on v.9.]"}],"23":[{"catchword":null,"tekst":"Which justify the wicked for a gift, [That is, pronounce him righteous or innocent, whereas he is guilty, see Num 35:31. Deut.25.1.] and turn away the righteousness of the righteous from him. [by condemning them, as if they were guilty of some heinous crime. Compare Pro 17:15. and 24.24.]"}],"24":[{"catchword":null,"tekst":"Therefore as the tongue of fire [That is, the flame of fire, which hath some resemblance with a tongue: and likewise it seemeth to lick, as the tongue doth] consumeth [Heb. Eateth up, that is, consumeth, devoureth] the stubble, and the chaste is consumed [Heb. Is slackened, or decreaseth, or is weakened] by the flame: (so) their root shall be as a consumption, and their flower [or bud] shall rise up as dust: [Some understand here by the root the garments, by the flowers the children. Oth. Conceive that here is to be understood in general the vanity and vanishing away of wicked. So that to ascend or go up (which is used in the Hebrew text) signifieth here to come to nothing, to vanishing away, to perish, as a smoak that goeth up. (their root shall not be as a consumption.) Oth. Shall become as snot; that is, their root shall putrefying roots become like unto white snot.]"}],"25":[{"catchword":null,"tekst":"Therefore is the anger of the LORD kindled against his people, and he hath stretched forth his hand against them, [To wit, to smite them, see above, ch.1.5.] and he hath smitten them, so that the mountains did tremble, [this is an excessive kind of speech, called in the Schools, Hyperbole. It is a prediction of the approaching ruin and destruction of the people of the Jews] and their carcases [to wit, which were slain by the enemies] became as dung in the midst of the streets: [Or, were torn or destroyed in the midst of the streets. Compare below, chap.10.6.] for all this his anger turneth not away, but his hand is stretched out still. [to smite them yet more, see Levit.26.v.14,15, &c. Or, with all this, &c. As if he had said, Although the LORD hath punished his people so severely, as is even now related, and therefore might seem to be appeased and reconciled with them: Yet notwithstanding he continueth still incensed against them; forasmuch as they turn not unto God. So below, chap.9.11,12,17,21, and 10.4.]"}],"26":[{"catchword":null,"tekst":"For he will lift up a banner among the heathen from far, and he will hiss them (hither) from the end of the earth, and behold they shall come on hastily, swiftly. [Here the Prophet doth now further relate that whereof he had begun to speak in the end of the foregoing 25th. Verse; to wit, that the Lords hand was lifted up. (For he will lift up, (or raise up) a banner.] That is, an army of enemies. (among the heathen from far.) That is, he will give them a token for to come and fall upon the people of the Jews. Or, he will allure and entice the Chaldeans, Babylonians, Assyrians, (which are here meant by the name of heathen) by his secret and righteous providence, and will provoke and stir them up against the Jews. (among the heathen from far) or, among the heathen that are afar off; that is, that shall come from a far country. (and he will hiss them (hither) etc.) Or, will whistle pipe, etc. Oth. He will hiss them to him. The meaning is, that God can soon, yea easily, raise up an huge army to execute his judgements upon those whom he intendeth to punish. See the like phrase, Isa 7:18. Zach.10.8. (and behold, they shall come hastily, swiftly.) This hath relation to that which was said above, vers.19. As if he should say here, Ye flout and mock at my threatening, saying, Let him make speed, let him hasten his work, etc. Behold, now he will make hast, procuring that the enemies shall come speedily and swiftly, for to destroy you (they shall come) Heb. It shall come; to wit, the banner or ensign, with the people that beholding to it. Oth. He; to wit, the King of Babel, with his army. Oth. It; to wit, the people.]"}],"27":[{"catchword":null,"tekst":"No weary nor stumbling person shall be amongst them: [Intimating, that none in that camp, or among those souldiers should be weary of marching in that long journey, thereby declaring the willingness and forwardness of those Nations whom the LORD should employ or set on work] none shall slumber nor sleep, [they shall be all wakeful and prudent in their enterprises] neither (shall) the girdle of his loins be loosed, nor the shoe-string of his shoes be torn off. [That is, they shall be continually ready for to fight, being always armed.]"}],"28":[{"catchword":null,"tekst":"Whose arrows shall be sharp, and all their bows bent: [Heb. Whose in the singular number; to wit, peoples, which shall be in the camp or army. So in the sequel the singular number is put for the plural. The Prophet by these words doth intimate, that the people or nation whom the Lord will make use of to do execution upon his own people, shall be well armed, and well sitted and prepared for the work. (their bows bent) Heb. Trodden, because they use to set their foot upon the cross-bow, when they bend it. See Psal.7.13.] their horses hoofs [Heb. Claws] shall be counted like a rock, [to wit, they shall be esteemed to be as sharp and as hard as a flint or rock, so that they shall not wear cut with running and galloping. The contrary happened, Judg.5.22.] and their wheels like a whirl-wind. [that is, their charets shall come very swiftly.]"}],"29":[{"catchword":null,"tekst":"Their roaring shall be like (the roaring) of an old lion, [or fierce, or cruel, or terrible Lion] and they shall roar like the young lions, and they shall make a noise, and lay hold on the prey, [The Hebrew word rendered here prey, signifieth properly a beast that is rent and torn in pieces with the teeth and claws of another beast] and carry (it) away, and there shall be no deliverer. [in the words of this verse the Prophet describeth the cruelty of the people or nation whom the Lord would send against the Jews for to destroy them.]"}],"30":[{"catchword":null,"tekst":"And in that day they [To wit, those strange nations, the Chaldeans and others] shall roar against them, [to wit, against the peopl // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

function bouwRijen() {

  for (const n of nummers) {

    rij.className = 'vers'; rij.id = 'v' + n;
