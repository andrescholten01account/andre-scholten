:"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Wie is Deze, Die van Edom komt met bespatte kleren, van Bozra? Deze, Die praalt in Zijn gewaad? Die voorttrekt in Zijn grote kracht? Ik ben het, Die in gerechtigheid spreek, Die machtig ben om te verlossen.","2":"Waarom bent U rood aan Uw gewaad, en Uw kleren als van iemand die in de wijnpers treedt?","3":"Ik heb de pers alleen getreden, en er was niemand van de volken met Mij; en Ik heb hen getreden in Mijn toorn, en heb hen vertrapt in Mijn grimmigheid; en hun bloed is gesprenkeld op Mijn kleren, en heel Mijn gewaad heb Ik bezoedeld.","4":"Want de dag van de wraak was in Mijn hart, en het jaar van Mijn verlosten was gekomen.","5":"En Ik zag toe, en er was niemand die hielp; en Ik ontzette Mij, en er was niemand die ondersteunde; daarom heeft Mijn arm Mij heil beschikt, en Mijn grimmigheid heeft Mij ondersteund,","6":"En Ik heb de volken vertreden in Mijn toorn, en Ik heb hen dronken gemaakt in Mijn grimmigheid; en Ik heb hun kracht ter aarde doen neerdalen.","7":"Ik zal de blijken van goedertierenheid van de HEERE vermelden, de veelvoudige lof van de HEERE, naar alles wat de HEERE ons heeft bewezen, en de grote goedheid aan het huis van Israël, die Hij hun bewezen heeft, naar Zijn barmhartigheden, en naar de veelheid van Zijn blijken van goedertierenheid.","8":"Want Hij zei: Zij zijn zeker Mijn volk, kinderen die niet liegen zullen? Zo is Hij hun geworden tot een Heiland.","9":"In al hun benauwdheid was Hij benauwd, en de Engel van Zijn aangezicht heeft hen behouden; door Zijn liefde en door Zijn genade heeft Hij hen verlost; en Hij nam hen op, en Hij droeg hen al de dagen van ouds.","10":"Maar zij zijn opstandig geworden, en zij hebben Zijn Heilige Geest smarten aangedaan; daarom is Hij hun in een vijand veranderd, Hij Zelf heeft tegen hen gestreden.","11":"Toch dacht Hij aan de dagen van ouds, aan Mozes en Zijn volk; maar nu, waar is Hij, Die hen uit de zee opgebracht heeft, met de herders van Zijn kudde? Waar is Hij, Die Zijn Heilige Geest in het midden van hen stelde?","12":"Die de arm van Zijn heerlijkheid heeft laten gaan aan de rechterhand van Mozes; Die de wateren voor hun aangezicht kliefde, opdat Hij Zich een eeuwige Naam maakte?","13":"Die hen leidde door de afgronden; als een paard in de woestijn, struikelden zij niet.","14":"Zoals een dier dat afgaat in de valleien, heeft de Geest van de HEERE hun rust gegeven. Zo hebt U Uw volk geleid, opdat U Uzelf een heerlijke Naam zou maken.","15":"Zie neer van de hemel, en aanschouw van Uw heilige en Uw heerlijke woning; waar zijn Uw ijver en Uw krachten, het gerommel van Uw ingewand en van Uw barmhartigheden? Zij houden zich tegen mij in.","16":"U bent toch onze Vader, want Abraham weet van ons niet, en Israël kent ons niet; U, o HEERE, bent onze Vader, onze Verlosser van ouds af is Uw Naam.","17":"HEERE! Waarom laat U ons van Uw wegen dwalen, waarom verstokt U ons hart, zodat wij U niet vrezen? Keer terug om Uw dienaren wil, de stammen van Uw erfdeel.","18":"Uw heilig volk heeft het maar een korte tijd bezeten; onze tegenstanders hebben Uw heiligdom vertreden.","19":"Wij zijn geworden als zij over wie U van ouds niet hebt geheerst, en die naar Uw Naam niet genoemd zijn."},"SV":{"1":"Wie is Deze, Die van Edom komt met besprenkelde klederen, van Bozra? Deze, Die versierd is in Zijn gewaad? Die voorttrekt in Zijn grote kracht? Ik ben het, Die in gerechtigheid spreek, Die machtig ben te verlossen.","2":"Waarom zijt Gij rood aan Uw gewaad, en Uw klederen als van een, die in de wijnpers treedt?","3":"Ik heb de pers alleen getreden, en er was niemand van de volken met Mij; en Ik heb hen getreden in Mijn toorn, en heb hen vertrapt in Mijn grimmigheid; en hun kracht is gesprengd op Mijn klederen, en al Mijn gewaad heb Ik bezoedeld.","4":"Want de dag der wraak was in Mijn hart, en het jaar Mijner verlosten was gekomen.","5":"En Ik zag toe, en er was niemand die hielp; en Ik ontzette Mij, en er was niemand, die ondersteunde; daarom heeft Mijn arm Mij heil beschikt, en Mijn grimmigheid heeft Mij ondersteund,","6":"En Ik heb de volken vertreden in Mijn toorn, en Ik heb hen dronken gemaakt in Mijn grimmigheid; en Ik heb hun kracht ter aarde doen nederdalen.","7":"Ik zal de goedertierenheden des HEEREN vermelden, den veelvoudigen lof des HEEREN, naar alles, wat de HEERE ons heeft bewezen, en de grote goedigheid aan het huis van Israël, die Hij hun bewezen heeft, naar Zijn barmhartigheden, en naar de veelheid Zijner goedertierenheden.","8":"Want Hij zeide: Zij zijn immers Mijn volk, kinderen, *die* niet liegen zullen? Alzo is Hij hun geworden tot een Heiland.","9":"In al hun benauwdheid was Hij benauwd, en de Engel Zijns aangezichts heeft hen behouden; door Zijn liefde en door Zijn genade heeft Hij hen verlost; en Hij nam hen op, en Hij droeg hen al de dagen van ouds.","10":"Maar zij zijn wederspannig geworden, en zij hebben Zijn Heiligen Geest smarten aangedaan; daarom is Hij hun in een vijand verkeerd, Hij Zelf heeft tegen hen gestreden.","11":"Nochtans dacht Hij aan de dagen van ouds, aan Mozes *en* Zijn volk; *maar* *nu*, waar is Hij, Die hen uit de zee opgebracht heeft, met de herders Zijner kudde? Waar is Hij, Die Zijn Heiligen Geest in het midden van hen stelde?","12":"Die den arm Zijner heerlijkheid heeft doen gaan aan de rechterhand van Mozes; Die de wateren voor hunlieder aangezichten kliefde opdat Hij Zich een eeuwigen Naam maakte?","13":"Die hen leidde door de afgronden; als een paard in de woestijn, struikelden zij niet.","14":"Gelijk een beest, *dat* afgaat in de valleien, heeft hun de Geest des HEEREN rust gegeven. Alzo hebt Gij Uw volk geleid, opdat Gij U een heerlijken Naam zoudt maken.","15":"Zie van den hemel af, en aanschouw van Uw heilige en Uw heerlijke woning; waar zijn Uw ijver en Uw mogendheden, het gerommel Uws ingewands en Uwer barmhartigheden? Zij houden zich tegen mij in.","16":"Gij zijt toch onze Vader, want Abraham weet van ons niet, en Israël kent ons niet; Gij, o HEERE! zijt onze Vader, onze Verlosser van ouds af is Uw Naam.","17":"HEERE! waarom doet Gij ons van Uw wegen dwalen, *waarom* verstokt Gij ons hart, dat wij U niet vrezen? Keer weder om Uwer knechten wil, de stammen Uws erfdeels.","18":"Uw heilig volk heeft *het* *maar* een weinig tijds bezeten; onze wederpartijders hebben Uw heiligdom vertreden.","19":"Wij zijn geworden *als* *die*, over welke Gij van ouds niet hebt geheerst, en die naar Uw Naam niet zijn genoemd."},"KJV":{"1":"Who *is* this that cometh from Edom, with dyed garments from Bozrah? this *that is* glorious in his apparel, travelling in the greatness of his strength? I that speak in righteousness, mighty to save.","2":"Wherefore *art thou* red in thine apparel, and thy garments like him that treadeth in the winefat?","3":"I have trodden the winepress alone; and of the people *there was* none with me: for I will tread them in mine anger, and trample them in my fury; and their blood shall be sprinkled upon my garments, and I will stain all my raiment.","4":"For the day of vengeance *is* in mine heart, and the year of my redeemed is come.","5":"And I looked, and *there was* none to help; and I wondered that *there was* none to uphold: therefore mine own arm brought salvation unto me; and my fury, it upheld","6":"And I will tread down the people in mine anger, and make them drunk in my fury, and I will bring down their strength to the earth.","7":"I will mention the lovingkindnesses of the LORD, *and* the praises of the LORD, according to all that the LORD hath bestowed on us, and the great goodness toward the house of Israel, which he hath bestowed on them according to his mercies, and according to the multitude of his lovingkindnesses.","8":"For he said, Surely they *are* my people, children *that* will not lie: so he was their Saviour.","9":"In all their affliction he was afflicted, and the angel of his presence saved them: in his love and in his pity he redeemed them; and he bare them, and carried them all the days of old.","10":"But they rebelled, and vexed his holy Spirit: therefore he was turned to be their enemy, *and* he fought","11":"Then he remembered the days of old, Moses, *and* his people, *saying*, Where *is* he that brought them up out of the sea with the shepherd of his flock? where *is* he that put his holy Spirit within","12":"That led *them* by the right hand of Moses with his glorious arm, dividing the water before them, to make himself an everlasting name?","13":"That led them through the deep, as an horse in the wilderness, *that* they should not stumble?","14":"As a beast goeth down into the valley, the Spirit of the LORD caused him to rest: so didst thou lead thy people, to make thyself a glorious name.","15":"Look down from heaven, and behold from the habitation of thy holiness and of thy glory: where *is* thy zeal and thy strength, the sounding of thy bowels and of thy mercies toward me? are they restrained?","16":"Doubtless thou *art* our father, though Abraham be ignorant of us, and Israel acknowledge us not: thou, O LORD, *art* our father, our redeemer; thy name *is* from everlasting.","17":"O LORD, why hast thou made us to err from thy ways, *and* hardened our heart from thy fear? Return for thy servants' sake, the tribes of thine inheritance.","18":"The people of thy holiness have possessed *it* but a little while: our adversaries have trodden down thy sanctuary.","19":"We are *thine*: thou never barest rule over them; they were not called by thy name."}},"tsk":{"1":[{"kopje":"Wie is Deze","refs":["Ps 24:7-10","Hoogl 3:6","Hoogl 6:10","Hoogl 8:5","Matt 21:10"]},{"kopje":"van Edom komt","ref -code=\"H2220\">arm</span> brought <span class=\"wl wl-kjv\" data-code=\"H3467\">salvation</span> unto me; and my <span class=\"wl wl-kjv\" data-code=\"H2534\">fury,</span> it upheld","6":"And I will tread <span class=\"wl wl-kjv\" data-code=\"H947\">down</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> in mine <span class=\"wl wl-kjv\" data-code=\"H639\">anger,</span> and make them <span class=\"wl wl-kjv\" data-code=\"H7937\">drunk</span> in my <span class=\"wl wl-kjv\" data-code=\"H2534\">fury,</span> and I will bring <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> their <span class=\"wl wl-kjv\" data-code=\"H5332\">strength</span> to the earth.","7":"I will <span class=\"wl wl-kjv\" data-code=\"H2142\">mention</span> the <span class=\"wl wl-kjv\" data-code=\"H2617\">lovingkindnesses</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8416\">praises</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> according to all that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H1580\">bestowed</span> on us, and the <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> <span class=\"wl wl-kjv\" data-code=\"H2898\">goodness</span> toward the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> which he hath <span class=\"wl wl-kjv\" data-code=\"H1580\">bestowed</span> on them according to his <span class=\"wl wl-kjv\" data-code=\"H7356\">mercies,</span> and according to the <span class=\"wl wl-kjv\" data-code=\"H7230\">multitude</span> of his lovingkindnesses.","8":"For he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Surely they are my <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> that will not <span class=\"wl wl-kjv\" data-code=\"H826 y</span> <span class=\"wl wl-kjv\" data-code=\"H7307\">Spirit</span> within","12":"That <span class=\"wl wl-kjv\" data-code=\"H3212\">led</span> them by the right <span class=\"wl wl-kjv\" data-code=\"H3225\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> with his <span class=\"wl wl-kjv\" data-code=\"H8597\">glorious</span> <span class=\"wl wl-kjv\" data-code=\"H2220\">arm,</span> <span class=\"wl wl-kjv\" data-code=\"H1234\">dividing</span> the <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> them, to <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> himself an <span class=\"wl wl-kjv\" data-code=\"H5769\">everlasting</span> name?","13":"That <span class=\"wl wl-kjv\" data-code=\"H3212\">led</span> them through the <span class=\"wl wl-kjv\" data-code=\"H8415\">deep,</span> as an <span class=\"wl wl-kjv\" data-code=\"H5483\">horse</span> in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness,</span> that they should not stumble?","14":"As a <span class=\"wl wl-kjv\" data-code=\"H929\">beast</span> goeth <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> into the <span class=\"wl wl-kjv\" data-code=\"H1237\">valley,</span> the <span class=\"wl wl-kjv\" data-code=\"H7307\">Spirit</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> caused him to <span class=\"wl wl-kjv\" data-code=\"H5117\">rest:</span> so didst thou <span class=\"wl wl-kjv\" data-code=\"H5090\">lead</span> thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> to <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> thyself a <span class=\"wl wl-kjv\" data-code=\"H8597\">glorious</span> name.","15":"Look <span class=\"wl wl-kjv\" data-code=\"H5027\">down</span> from <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">behold</span> from the <span class=\"wl wl-kjv\" data-code=\"H2073\">habitation</span> of thy <span class=\"wl wl-kjv\" data-code=\"H6944\">holiness</span> and of thy <span class=\"wl wl-kjv\" data-code=\"H8597\">glory:</span> where is thy <span class=\"wl wl-kjv\" data-code=\"H7068\">zeal</span> and thy <span class=\"wl wl-kjv\" data-code=\"H1369\">strength,</span> the <span class=\"wl wl-kjv\" data-code=\"H1995\">sounding</span> of thy <span class=\"wl wl-kjv\" data-code=\"H4578\">bowels</span> and of thy <span class=\"wl wl-kjv\" data-code=\"H7356\">mercies</span> toward me? are they restrained?","16":"<span class=\"wl wl-kjv\" data-code=\"H3588\">Doubtless</span> thou art our <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> though <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> be <span class=\"wl wl-kjv\" data-code=\"H3808\">ignorant</span> of us, and <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H5234\">acknowledge</span> us not: thou, O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> art our <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> our <span class=\"wl wl-kjv\" data-code=\"H1350\">redeemer;</span> thy <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> is from everlasting.","17":"O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> why hast thou made us to <span class=\"wl wl-kjv\" data-code=\"H8582\">err</span> from thy <span class=\"wl wl-kjv\" data-code=\"H1870\">ways,</span> and <span class=\"wl wl-kjv\" data-code=\"H7188\">hardened</span> our <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> from thy <span class=\"wl wl-kjv\" data-code=\"H3374\">fear?</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">Return</span> for thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants'</span> sake, the <span class=\"wl wl-kjv\" data-code=\"H7626\">tribes</span> of thine inheritance.","18":"The <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of thy <span class=\"wl wl-kjv\" data-code=\"H6944\">holiness</span> have <span class=\"wl wl-kjv\" data-code=\"H3423\">possessed</span> it but a little <span class=\"wl wl-kjv\" data-code=\"H4705\">while:</span> our <span class=\"wl wl-kjv\" data-code=\"H6862\">adversaries</span> have trodden <span class=\"wl wl-kjv\" data-code=\"H947\">down</span> thy sanctuary.","19":"We are thine: thou <span class=\"wl wl-kjv\" data-code=\"H5769\">never</span> barest <span class=\"wl wl-kjv\" data-code=\"H4910\">rule</span> over them; they were not <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> by thy name."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"is Deze,","tekst":"Dit nemen enigen voor de woorden van Jesaja, die in een visioen, ziende de rechtvaardige straf van God over zijne vijanden, zeer verwonderd en als verbaasd staat; doch anderen menen dat de kerk hier spreekt, zich verwonderende over het groot geweld van Christus tegen zijne vijanden in zijn dood en opstanding uit de doden."},{"catchword":"van Edom","tekst":"Dat is, uit der Edomieten land, of van de Edomieten. Versta dit, van de vijanden van het volk van God in het algemeen, doch inzonderheid van de geestelijke vijanden, te weten den duivel en de dienaren van den Antichrist; gelijk boven Isa 34:5 ."},{"catchword":"met besprenkelde","tekst":"Hebreeuws, gezuurdeegd van klederen. Zie de aantekening Psa 71:4 , en Psa 73:21 . De Griekse overzetters en anderen, met rood geverwde klederen, betekenende zijn toorn tegen zijne vijanden, met welker bloed zijne klederen besprenkeld waren. Vergelijk Rev 19:13 ."},{"catchword":"Bozra?","tekst":"Dit was de hoofdstad van het land der Edomieten, waarvan ook melding gemaakt wordt Isa 34:6 ; Jer 49:13 , Jer 49:22 ; en hier kan men door Bozra verstaan de hoofdstad van alle vijanden van Gods kerk."},{"catchword":"versierd is","tekst":"Versta hier door het sieraad de heiligheid van Christus en zijn koninklijke heerlijkheid in zijn triomf over de vijanden."},{"catchword":"voorttrekt","tekst":"Het Hebreeuwse woord betekent zoveel als in een vreemd land op en neder trekken, gelijk Jer 48:12 ."},{"catchword":"in Zijn grote kracht?","tekst":"Te weten in de kracht zijner godheid."},{"catchword":"Ik ben het,","tekst":"Hier antwoordt Christus de grote profeet, die in de wereld komen zou, gelijk beloofd wordt Deu 18:15 ."},{"catchword":"Die in gerechtigheid spreek,","tekst":"Of, die met, of van gerechtigheid spreek; dat is, die de vijanden van het volk Gods, met de rechtvaardige straffen dreig."},{"catchword":"Die machtig ben","tekst":"Of, die genoegzaam ben om te verlossen. Want Hem is gegeven alle macht in den hemel en op de aarde, Hij is een almachtig God met den Vader en den Heiligen Geest."}],"2":[{"catchword":"Waarom","tekst":"Hier spreekt de kerk wederom, of de profeet, tot Christus, zeggende: waarom zijt gij, enz. De zin is: Waarom zijn de klederen rood, die gij aanhebt? Vergelijk Rev 19:13 ."},{"catchword":"die in de wijnpers","tekst":"Versta hierbij: en wiens klederen met roden wijn besprenkeld zijn. Deze gelijkenis wordt elders meer gebruikt, betekenende wraak; Lam 1:15 ; Rev 14:19-20 ."}],"3":[{"catchword":"Ik heb","tekst":"Hier spreekt Christus wederom, beantwoordende de vorige vraag aangaande zijne macht in het onderdrukken zijner vijanden en het verlossen zijner uitverkorenen."},{"catchword":"de pers","tekst":"Te weten de pers van den toorn Gods, gelijk af te nemen is uit Rev 14:19 , en Rev 19:15 . De zin is: Ik heb alleen, zonder menselijke hulp, den wil en het bevel van mijn hemelsen Vader, aangaande het straffen en verdelgen der vijanden zijner kerk, uitgericht."},{"catchword":"er was niemand","tekst":"Of, daar is niemand van de volken bij mij geweest, om mij te helpen de vijanden te bestrijden en te overwinnen. Versta hier zo de geestelijke als de lichamelijke vijanden."},{"catchword":"hun kracht","tekst":"Dat is hun bloed, waarin de sterkte van den mens bestaat. Of, hun bloed, dat is het bloed hunner sterke helden. Anders: en hunne victorie is op mijne klederen besprenkeld; dat is hun bloed, een teken mijner victorie over hen."}],"4":[{"catchword":"de dag der wraak","tekst":"Te weten dien dag, die van God bestemd was ter wraak, om de vijanden der kerk te straffen en de uitverkorenen te redden. Zie Isa 34:8 , en Isa 61:2 ."},{"catchword":"het jaar","tekst":"Dat is, het jaar of de tijd dergenen, die van mij zouden vrijgekocht of verlost worden. Het schijnt dat de profeet ziet op het geestelijke jubeljaar."}],"5":[{"catchword":"En Ik zag toe,","tekst":"Of, toen Ik omzag, dat er geen helper was, enz. Christus alleen is onze Helper, Heiland en Verlosser, die ons uit het geweld van den duivel en van den eeuwigen dood verlost heeft. Zie Isa 59:16 , en Isa 61:2 ."},{"catchword":"en Ik ontzette Mij,","tekst":"Te weten naar mijn menselijke natuur. Zie Mat 26:38 ."},{"catchword":"daarom heeft","tekst":"Dat is, mijn goddelijke kracht heeft mij onderstut in mijn zwaar lijden, dat Ik onder den zwaren last van den toorn Gods niet ben bezweken, maar dien gedragen, en mijn volk daarvan verlost en al hunne vijanden overwonnen heb."},{"catchword":"Mijn grimmigheid","tekst":"Te weten de grimmigheid, waarmede Ik onstoken ben tegen de vijanden mijner kerk."}],"6":[{"catchword":"Ik heb de volken","tekst":"Dat is, Ik heb de geestelijke vijanden overwonnen, daartoe bewogen zijnde door mijnen ijver tot de ere Gods en het heil zijner uitverkorenen."},{"catchword":"Ik heb hen dronken","tekst":"Te weten met den drinkbeker mijner grimmigheid, tot hun verderf. Zie deze gelijkenis ook Psa 60:5 , en Isa 24:20 , en Isa 49:26 , en Isa 51:17 , Isa 51:21 ; Jer 51:57 , en elders."},{"catchword":"hun kracht","tekst":"Zie boven vs.3."}],"7":[{"catchword":"Ik zal","tekst":"Dit spreekt het volk Gods, zijnde nu onderwezen van Christus en zijn grote daden, Hem tegelijk dankende voor de weldaden, die zij van Hem ontvangen hadden, wensende en biddende om den voortgang derzelve."},{"catchword":"den veelvoudigen lof","tekst":"Of, menigvuldigen, of menigerlei lof, te weten den lof vanwege het goede, hetwelk mij de Heere gedaan heeft."},{"catchword":"naar alles,","tekst":"Hebreeuws, als naar alles, te weten naar alles goeds. Van de betekenis van het woord bewezen, zie Psa 13:6 ."}],"8":[{"catchword":"Hij zeide","tekst":"Te weten toen Hij met onze voorouders een verbond maakte."},{"catchword":"die","tekst":"Of, die niet vals zijn zullen. God spreekt hier naar de wijze der mensen, die het beste van hunne kinderen hopen; en versta hierbij: maar zij zullen mij oprechtelijk dienen, als oprechte Israëlieten, in wie geen bedrog is. Anders: zij zullen niet ontaarden, of, verbasteren; te weten, nadat Ik hen zal herboren hebben door mijnen Heiligen Geest."},{"catchword":"is Hij hun","tekst":"Dat is, Hij heeft hen van hunne vijanden verlost."}],"9":[{"catchword":"In al hun","tekst":"Dat is, Hij was benauwd of bedroefd vanwege hunne ellenden, die zij in Egypte leden. Alzo wordt Christus vervolgd in zijn heilige ledematen; Act 9:4 . Zie ook Zec 2:8 ; Mat 25:45 . Anders: in al hunne benauwdheid was gene benauwdheid; versta hierbij: maar een goedertierene vaderlijke kastijding. Of aldus: in al hunne benauwdheid is hij geen vijand of tegenpartijder geweest; maar de engel zijns aangezichts heeft hen behouden. De zin is: Hij heeft hen wel benauwd, maar niet als hun vijand zijnde."},{"catchword":"de Engel","tekst":"Dat is de engel, die voor zijn aangezicht is, die voor hunne zaligheid zorg draagt, te weten Christus. Zie de aantekening Exo 23:20 ."},{"catchword":"door Zijn liefde","tekst":"Dat is, Hij heeft hen verlost omdat Hij hen beminde; Deu 7:7-8 ."},{"catchword":"Hij nam hen op,","tekst":"Alsof hij zeide: Hij heeft hen op den rug geladen en gedragen, gelijk een arend zijne jongen draagt. Vergelijk dit met Deu 32:11 , en zie ook Isa 46:4 ."},{"catchword":"al de dagen","tekst":"Hebreeuws, al de dagen der oudheid, of eeuw, gelijk vs.11, 16, 19. Dat is, van dien tijd af dat Ik hen geroepen heb mijn volk te zijn. Zie van het Hebreeuwse woord de aantekening Jer 2:20 ."}],"10":[{"catchword":"Maar","tekst":"Of, maar zij, zij rebelleerden; Num 14:22 staat dat zij den Heere tienmaal verkocht hebben. Zie de aantekening aldaar. Zie ook Psa 78:40 , Psa 78:57 , en Psa 95:9 ."},{"catchword":"Zijn Heiligen Geest","tekst":"Hebreeuws, den Geest zijner heiligheid. Dezen bedroefden zij, doordien zij den wil Gods, welken de Heilige Geest door het woord hun geopenbaard had, moedwilliglijk tegenstonden. Zie Eph 4:30 ."},{"catchword":"smarten","tekst":"Anders: bedroefd. Zie Gen 6:6 ."},{"catchword":"daarom is Hij","tekst":"Dat is, Hij heeft zich aangesteld alsof Hij hun vijand geweest ware, toen Hij hen in de woestijn versloeg. Zie Psa 78:31 , Psa 78:3133 , Psa 78:3159-60 , enz."}],"11":[{"catchword":"aan de dagen","tekst":"In welke Hij hen wel om hunner zonden wil geslagen, maar zich nochtans wederom over hen ontfermd heeft, zonder dat Hij hen geheel heeft verdelgd."},{"catchword":"waar is Hij,","tekst":"Deze en de volgende woorden schijnt de kerk Gods tot God te spreken klagenderwijze. Anderen nemen het als woorden van God; alsof God zeide: Waaraan zou de heerlijkheid des Heeren blijken? te weten, indien Ik alzo wil voortvaren mijn volk naar hunne verdiensten te straffen. Aldus zou de profeet hier God den Heere invoeren, als met zichzelven twistende over zijne eer; vergelijk Exo 32:11-12 ."},{"catchword":"uit de zee","tekst":"Te weten uit de Rode zee; Exo 14:21 , enz. De zin is: Hoe zou dat staan, dat Ik hen eertijds zou getrouwelijk uit allen nood en gevaar gevoerd en verlost heb?"},{"catchword":"met de herders","tekst":"Aldus noemt Hij Mozes en Aäron, die het volk van Israël door de woestijn gevoerd hebben, gelijk de herders hunne schapen doen. Zie Psa 77:21 ."},{"catchword":"Zijner kudde?","tekst":"Dat is, van de kinderen Israëls."},{"catchword":"hen stelde?","tekst":"Te weten van het volk, gelijk vs.14."}],"12":[{"catchword":"Die den arm","tekst":"Of, die hen leidde aan de rechterhand van Mozes [met] zijn heerlijken arm; dat is, die Mozes in zijn zwaren dienst met zijn heerlijke macht en goddelijke hulp bijstond."},{"catchword":"de wateren","tekst":"Te weten van de Rode zee, Exo 14:21 , en daarna van de Jordaan; Jos 3:15-16 ."}],"13":[{"catchword":"leidde","tekst":"Te weten zachtjes en zoetjes, gelijk men een paard leidt bij den toom."},{"catchword":"door de afgronden;","tekst":"Zie Exo 15:5 ; Psa 106:9 ."},{"catchword":"struikelden","tekst":"Anders: dat zij niet zouden struikelen."}],"14":[{"catchword":"Gelijk","tekst":"Hier spreekt wederom het volk Gods."},{"catchword":"een beest,","tekst":"Hetzij paard of koe."},{"catchword":"heeft hun de Geest","tekst":"Te weten het volk."},{"catchword":"rust gegeven","tekst":"Of, zacht geleid."},{"catchword":"Gij Uw volk","tekst":"O Heere. De gemeente wendt nu hare aanspraak tot God, en zij bidden Hem dat Hij met zijn gewone goedheid wil voortvaren."}],"15":[{"catchword":"van Uw heilige","tekst":"Dat is van den hemel, die ook Deu 26:15 genoemd wordt de woning zijner heiligheid."},{"catchword":"Uw ijver","tekst":"Over uw volk en tegen uwe vijanden? Menselijkerwijze van God gesproken. Zie boven Isa 9:6 ."},{"catchword":"Uw mogendheden,","tekst":"Of, uwe machten, dat is, uw krachtige werken, of wonderen, gelijk Mat 13:58 ."},{"catchword":"het gerommel","tekst":"Of, het gewoel, het geluid. Anders: de veelheid."},{"catchword":"Uws ingewands","tekst":"Dat is, van uw hart."},{"catchword":"Zij houden zich","tekst":"Of, zij houden zich tegen mij gesloten; dat is, zij laten zich tegen mij niet blijken, gelijk in voortijden. Anders: houden zij zich tegen mij gesloten?"}],"16":[{"catchword":"Gij zijt toch","tekst":"Of, Voorwaar, Gij zijt onze Vader."},{"catchword":"onze Verlosser","tekst":"Dat is, Gij zijt vanouds, of van eeuwigheid af onze Verlosser geweest."}],"17":[{"catchword":"doet Gij","tekst":"De gelovigen spreken hier van de meeste menigte van het volk. Van God wordt gezegd dat Hij de mensen doet dwalen en dat Hij hunne harten verhardt, niet dat Hij enige dwaling instort, maar de mensen rechtvaardiglijk in hun verkeerden zin en aan den dwaalgeest overgeeft, die hun hart vet en hard maakt; Joh 12:39-40 ; Rom 11:8 ; 2Th 2:11 ; maar de mensen verharden hunne harten en dwalen af door de zonde te begaan; Psa 95:8 , Psa 95:10 ."},{"catchword":"verstokt","tekst":"Of, verhardt. Het Hebreeuwse woord vindt men alleen hier en Job 39:19 ."},{"catchword":"dat wij","tekst":"Hebreeuws, van uwe vrees."},{"catchword":"Keer weder","tekst":"Dat is, doe ons wederom goed."},{"catchword":"om Uwer knechten wil,","tekst":"Dat is, onzenthalve, die Gij tot uwe knechten hebt verkoren. Of, die uwe knechten zijn, ten aanzien van het verbond, dat Gij met Abraham, Izak en Jakob gemaakt hebt, hun belovende dat Gij de God huns zaad zoudt wezen."},{"catchword":"de stammen","tekst":"Te weten de twaalf stammen, in welken het volk Gods afgedeeld was."},{"catchword":"Uws erfdeels","tekst":"Dat is, die Gij tot uwe erve hebt aangenomen en bezit, gelijk Deu 32:9 ."}],"18":[{"catchword":"het","tekst":"Te weten uw land, het land Kanaän, hetwelk Gij hun gegeven hadt. Of, uw heiligdom, gelijk hier straks volgt: zijnde zo het een als het ander tekenen van Gods gunst."},{"catchword":"maar een weinig tijds","tekst":"Versta dit aldus, dat zij het maar een korten tijd in rust en in vrede bezeten hebben. Hiervan waren hunne zonden de oorzaak, gelijk te zien is Deu 11:8-9 , Deu 11:17 ."},{"catchword":"onze wederpartijders","tekst":"Te weten de Babyloniërs."},{"catchword":"Uw heiligdom","tekst":"Dat is, uw heiligen tempel, bestaande nevens de voorhoven, uit het heilige en het heilige der heiligen."}],"19":[{"catchword":"Wij zijn","tekst":"Te weten Uw volk, of die, over welken Gij heerst."},{"catchword":"geworden","tekst":"Te weten vanwege onze zonden en overtredingen."},{"catchword":"die naar Uw Naam","tekst":"Of, gelijk de Hebreeuwse woorden luiden, over welken uw naam niet is aangeroepen geworden. Zie deze manier van spreken Deu 28:10 ; Isa 4:1 ; Dan 9:10 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Who is this that cometh from Edom, with sprinkled garments from Bozra? [some take these to be words of the prophet Isaiah, who seeing in a vision the just judgement of God upon his enemies wondereth greatly, and standeth as it were amazed: but others are of opinion, that the church speaketh here wondering at the great power of Christ against his enemies, in his death and resurrection from the dead. (who is this, who is that cometh from Edom) that is, from the land of the Edomites or from the Edomites. Understand this of the enemies of Gods people in general, but especially of their spiritual enemies; to wit, the devil and the ministers of Anti Christ, as above chap.34.5 (with sprinkled garments) Heb. Leavened of garments. See the Annotat. Psal. 71 on ver. 4 and 73. On ver. 21. The Great interpreters and others, with red died garments signifying his wrath against his enemies, with whose blood his garments were sprinkled: compare Revel. 19.13. (from Bozra?) this was the chief city in the land of the Edomites, whereof also mention is made above chap.34.6 and Jerem. 49.13.22 and here by Bozra may be understood the chief city of all the enemies of the church of God] this is adorned in apparel? [understand here by the ornament the holiness of Christ and his Royal glory in his triumph over his enemies] that marcheth forth [the Hebrew word signifieth as much to march up and down in a strange country, as Jer 48:12.] in his great strength? [to wit. In the strength of his Godhead] i am he that speak in righteousness, [here Christ the great prophet that should come into the world, as was promises. Deut.18.15. maketh answer (that speaketh righteousness) or, that speak with, or of righteous; that is, that threatneth the enemies of Gods people with the just judgement of God] that am mighty to deliver. [Or, that am sufficient to deliver: for unto him is given all power both in heaven and on earth; he is an almighty God the Father and the holy Ghost.]"}],"2":[{"catchword":null,"tekst":"Wherefore art thou red in thine apparel? [Here the Church speaketh again, or the prophet, unto Christ, saying, wherefore art thou, the meaning is, wherefore are the garments which thou hast on red? Compare Rev. 19.13.] and thy garments as of one that treadeth in the wine-press? [Understand withal and whose garments are sprinkled with red wine. This similitude is elsewhere used, signifying vengeance, Lament.1.5. Revel. 14.19, 20."}],"3":[{"catchword":null,"tekst":"I have trodden the pressed alone, and there was none of the nations with me; [Here Christ speaketh again, answering the former question concerning his power in subduing his enemies and redeeming his elect. (i have trodden the press alone) to wit, the press of God&acirc;&euro;&trade;s wrath, as may be gathered from Revel. 14.19. and 19.15. The meaning is, i have alone, without the help of man, executed the will and command of my heavenly father, concerning the punishing and destroying of the enemies of his church] there was none of the nations with me] Or, there hath been none of the nations by me, to help me to fight against the enemies and to conquer them. Understand here both spiritual and corporal enemies] and i have trodden them in mine anger, and have trampled them in my fury: and their strength is sprinkled upon my garments, [their power; that is, their blood, wherein in the strength of men confisteth. Or, their blood; that is; that is, the blood of their strong champions, others, their victory is sprinkled upon my garments; that is, their blood, a token of my victory over them] i have strained all raiment."}],"4":[{"catchword":null,"tekst":"For the day of vengeance [To wit, that day which was ordained by God for vengeance, to punish the enemies of the church, and to deliver the elect. See above chap.34.8 and 61.2.] was in my heart: and they are of may redeemed was come. [That is the year, or the time of those that should be ran formed or redeemed by me. It seemeth that the prophet hath respect to the spiritual year of Jubilee.]"}],"5":[{"catchword":null,"tekst":"And i looked and there was none that helped; [Or when i looked about, and that there was no helper. Christ alone is our helper, Saviour and Redeemer, who hath developed us from the power of the devil and of eternal death. See above chap. 59.16 and 61.2] and i was astonished, [to wit, according to my humane nature. See math.26.38.] and there was none that supposed, therefore mine (own) arm brought salvation unto me, [That is, my divine power sustained me in my fore passion, that i fainted not under the heavy burden of Gods wrath, but bare the fame, and delivered my people from it and conquered all their enemies] and my fury [to wit, the fury wherewith i am incensed against the enemies of my church] it upheld me."}],"6":[{"catchword":null,"tekst":"And i have trodden down the nations in mine anger, [That is, i have conquered the spiritual enemies being moved thereto by my zeal for Gods glory, and for the salvation of his elect] and i have made them drunk in my fury: [to wit, with the cup of my wrath, to their destruction. See this similitude likewise Psal. 60.5 and above chap. 24.20 and 49.26. and 51.17, 21, Jer 51:57. elsewhere] & i have caused their strength. [see above ver.3] to fall down to the earth."}],"7":[{"catchword":null,"tekst":"I will mention the loving kindness of the Lord, the manifold praise of the Lord, according to all that the Lord hath shewed us, and the great goodness towards the house of Isreal, which he hath shewed them, according to his mercies, and according to the multitude of his loving kindness. [this the people of God speaketh, being now instructed concerning Christ, and his great acts, praising acts, praising him withal for the mercies which they had received of him, wishing and praying that they might be continued unto them. (the manifold praise of the Lord) Or various praise of the Lord: to wit, the praise for the good which th // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
