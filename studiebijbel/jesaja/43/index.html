l":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Maar nu, zo zegt de HEERE, uw Schepper, o Jakob! en uw Formeerder, o Israël! Vrees niet, want Ik heb u verlost; Ik heb u bij uw naam geroepen, u bent van Mij.","2":"Wanneer u door het water zult gaan, Ik zal bij u zijn, en door de rivieren, zij zullen u niet overstromen; wanneer u door het vuur zult gaan, zult u niet verbranden, en de vlam zal u niet aansteken.","3":"Want Ik ben de HEERE, uw God, de Heilige van Israël, uw Heiland; Ik heb Egypte, Morenland en Seba gegeven *tot* uw losgeld in uw plaats.","4":"Van toen af, dat u kostbaar bent geweest in Mijn ogen, bent u verheerlijkt geweest, en Ik heb u liefgehad; daarom heb Ik mensen in uw plaats gegeven, en volken in plaats van uw ziel.","5":"Vrees niet, want Ik ben met u; Ik zal uw nageslacht van de opgang brengen, en Ik zal u verzamelen van de ondergang.","6":"Ik zal zeggen tot het noorden: Geef; en tot het zuiden: Houd niet terug; breng Mijn zonen van verre, en Mijn dochters van het einde der aarde;","7":"ieder, die naar Mijn Naam genoemd is, en die Ik geschapen heb tot Mijn eer, die Ik geformeerd heb, die Ik ook gemaakt heb.","8":"Breng voort het blinde volk, dat ogen heeft, en de doven, die oren hebben.","9":"Laat alle heidenvolken samen vergaderd worden, en laat de volken verzameld worden; wie onder hen zal dit verkondigen? Of laat hen ons de vorige dingen doen horen, laat hen hun getuigen voortbrengen, opdat zij gerechtvaardigd worden, en men het hoort en zegt: Het is de waarheid.","10":"U bent Mijn getuigen, spreekt de HEERE, en Mijn knecht, die Ik uitverkoren heb; opdat u het weet, en Mij gelooft, en verstaat, dat Ik Dezelfde ben, *dat* er vóór Mij geen God geformeerd is, en na Mij geen zijn zal.","11":"Ik, Ik ben de HEERE, en er is geen Heiland behalve Mij.","12":"Ik heb verkondigd, en Ik heb verlost, en Ik heb *het* doen horen, en geen vreemde *god* was onder u; en u bent Mijn getuigen, spreekt de HEERE, dat Ik God ben.","13":"Ook eer de dag was, ben Ik, en er is niemand, die uit Mijn hand redden kan; Ik zal werken, en wie zal het keren?","14":"Zo zegt de HEERE, uw Verlosser, de Heilige van Israël: Om uw wil heb Ik naar Babel gezonden, en heb hen allen als vluchtelingen doen neerdalen, te weten de Chaldeeën, in de schepen, waarop zij juichten.","15":"Ik ben de HEERE, uw Heilige; de Schepper van Israël, uw Koning.","16":"Zo zegt de HEERE, Die in de zee een weg, en in de sterke wateren een pad maakte;","17":"Die wagens en paarden, leger en macht voortbracht; samen zijn zij neergelegen, zij zullen niet weer opstaan, zij zijn uitgeblust, als een vlaswiek zijn zij uitgegaan.","18":"Denkt aan de vorige *dingen* niet, en overweegt de oude dingen niet.","19":"Ziet, Ik zal iets nieuws maken, nu zal het uitspruiten, zult u dat niet weten? Ja, Ik zal in de woestijn een weg leggen, *en* rivieren in de wildernis.","20":"Het gedierte van het veld zal Mij eren, de jakhalzen en de jonge struisvogels; want Ik zal in de woestijn water geven, *en* rivieren in de wildernis, om Mijn volk, Mijn uitverkorenen te drinken te geven.","21":"Dit volk heb Ik Mij geformeerd, zij zullen Mijn lof vertellen.","22":"Doch u hebt Mij niet aangeroepen, o Jakob! toen u zich tegen Mij vermoeid hebt, o Israël!","23":"Mij hebt u niet gebracht het kleinvee van uw brandoffers, en *met* uw slachtoffers hebt u Mij niet geëerd; Ik heb u *Mij* niet doen dienen met spijsoffer, en Ik heb u niet vermoeid met wierook.","24":"Mij hebt u geen kalmoes voor geld gekocht, en met het vet van uw slachtoffers hebt u Mij niet gedrenkt; maar u hebt Mij arbeid gemaakt met uw zonden, u hebt Mij vermoeid met uw ongerechtigheden.","25":"Ik, Ik ben het, Die uw overtredingen uitwis, om Mijnentwil, en Ik denk aan uw zonden niet.","26":"Herinnert Mij, laten wij samen richten, vertelt u *uw* *redenen*, opdat u gerechtvaardigd mag worden.","27":"Uw eerste vader heeft gezondigd, en uw uitleggers hebben tegen Mij overtreden.","28":"Daarom zal Ik de leiders van het heiligdom ontheiligen, en Jakob ten ban overgeven, en Israël tot beschimpingen."},"SV":{"1":"Maar nu, alzo zegt de HEERE, uw Schepper, o Jakob! en uw Formeerder, o Israël! vrees niet, want Ik heb u verlost; Ik heb u bij uw naam geroepen, gij zijt Mijn.","2":"Wanneer gij zult gaan door het water, Ik zal bij u zijn, en door de rivieren, zij zullen u niet overstromen; wanneer gij door het vuur zult gaan, zult gij niet verbranden, en de vlam zal u niet aansteken.","3":"Want Ik ben de HEERE, uw God, de Heilige Israëls, uw Heiland; Ik heb Egypte, Morenland en Seba gegeven *tot* uw losgeld in uw plaats.","4":"Van toen af, dat gij kostelijk zijt geweest in Mijn ogen, zijt gij verheerlijkt geweest, en Ik heb u liefgehad; daarom heb Ik mensen in uw plaats gegeven, en volken in plaats van uw ziel.","5":"Vrees niet, want Ik ben met u; Ik zal uw zaad van den opgang brengen, en Ik zal u verzamelen van den ondergang.","6":"Ik zal zeggen tot het noorden: Geef; en tot het zuiden: Houd niet terug; breng Mijn zonen van verre, en Mijn dochters van het einde der aarde;","7":"Een ieder, die naar Mijn Naam genoemd is, en dien Ik geschapen heb tot Mijn eer, dien Ik geformeerd heb, dien Ik ook gemaakt heb.","8":"Breng voort het blinde volk, hetwelk ogen heeft, en de doven, die oren hebben.","9":"Laat al de heidenen samen vergaderd worden, en laat de volken verzameld worden; wie onder hen zal dit verkondigen? Of laat hen ons doen horen de vorige dingen, laat hen hun getuigen voortbrengen, opdat zij gerechtvaardigd worden, en men het hore en zegge: Het is de waarheid.","10":"Gijlieden zijt Mijn getuigen, spreekt de HEERE, en Mijn knecht, dien Ik uitverkoren heb; opdat gij het weet, en Mij gelooft, en verstaat, dat Ik Dezelve ben, *dat* voor Mij geen God geformeerd is, en na Mij geen zijn zal.","11":"Ik, Ik ben de HEERE, en er is geen Heiland behalve Mij.","12":"Ik heb verkondigd, en Ik heb verlost, en Ik heb *het* doen horen, en geen vreemd *god* was onder ulieden; en gij zijt Mijn getuigen, spreekt de HEERE, dat Ik God ben.","13":"Ook eer de dag was, ben Ik, en er is niemand, die uit Mijn hand redden kan; Ik zal werken, en wie zal het keren?","14":"Alzo zegt de HEERE, uw Verlosser, de Heilige Israëls: Om ulieder wil heb Ik naar Babel gezonden, en heb hen allen vluchtig doen nederdalen, te weten de Chaldeen, in de schepen, op welke zij juichten.","15":"Ik ben de HEERE, uw Heilige; de Schepper van Israël, ulieder Koning.","16":"Alzo zegt de HEERE, Die in de zee een weg, en in de sterke wateren een pad maakte;","17":"Die wagenen en paarden, heir en macht voortbracht; te zamen zijn zij nedergelegen, zij zullen niet weder opstaan, zij zijn uitgeblust, gelijk een vlaswiek zijn zij uitgegaan.","18":"Gedenkt der vorige *dingen* niet, en overlegt de oude dingen niet.","19":"Ziet, Ik zal wat nieuws maken, nu zal het uitspruiten, zult gijlieden dat niet weten? Ja, Ik zal in de woestijn een weg leggen, *en* rivieren in de wildernis.","20":"Het gedierte des velds zal Mij eren, de draken en de jonge struisen; want Ik zal in de woestijn wateren geven, *en* rivieren in de wildernis, om Mijn volk, Mijn uitverkorenen drinken te geven.","21":"Dit volk heb Ik Mij geformeerd, zij zullen Mijn lof vertellen.","22":"Doch gij hebt Mij niet aangeroepen, o Jakob! als gij u tegen Mij vermoeid hebt, o Israël!","23":"Mij hebt gij niet gebracht het kleine vee uwer brandofferen, en *met* uw slachtofferen hebt gij Mij niet geëerd; Ik heb u *Mij* niet doen dienen met spijsoffer, en Ik heb u niet vermoeid met wierook.","24":"Mij hebt gij geen kalmus voor geld gekocht, en met het vette uwer slachtoffers hebt gij Mij niet gedrenkt; maar gij hebt Mij arbeid gemaakt, met uw zonden, gij hebt Mij vermoeid met uw ongerechtigheden.","25":"Ik, Ik ben het, Die uw overtredingen uitdelg, om Mijnentwil, en Ik gedenk uwer zonden niet.","26":"Maakt Mij indachtig, laat ons te zamen richten, vertelt gij *uw* *redenen*, opdat gij moogt gerechtvaardigd worden.","27":"Uw eerste vader heeft gezondigd, en uw uitleggers hebben tegen Mij overtreden.","28":"Daarom zal Ik de oversten des heiligdoms ontheiligen, en Jakob ten ban overgeven, en Israël tot beschimpingen."},"KJV":{"1":"But now thus saith the LORD that created thee, O Jacob, and he that formed thee, O Israel, Fear not: for I have redeemed thee, I have called *thee* by thy name;","2":"When thou passest through the waters, I *will be* with thee; and through the rivers, they shall not overflow thee: when thou walkest through the fire, thou shalt not be burned; neither shall the flame kindle","3":"For I *am* the LORD thy God, the Holy One of Israel, thy Saviour: I gave Egypt *for* thy ransom, Ethiopia and Seba","4":"Since thou wast precious in my sight, thou hast been honourable, and I have loved thee: therefore will I give men for thee, and people for thy life.","5":"Fear not: for I *am* with thee: I will bring thy seed from the east, and gather thee from the west;","6":"I will say to the north, Give up; and to the south, Keep not back: bring my sons from far, and my daughters from the ends of the earth;","7":"*Even* every one that is called by my name: for I have created him for my glory, I have formed him; yea, I have made","8":"Bring forth the blind people that have eyes, and the deaf that have ears.","9":"Let all the nations be gathered together, and let the people be assembled: who among them can declare this, and shew us former things? let them bring forth their witnesses, that they may be justified: or let them hear, and say, *It is* truth.","10":"Ye *are* my witnesses, saith the LORD, and my servant whom I have chosen: that ye may know and believe me, and understand that I *am* he: before me there was no God formed, neither shall there be after","11":"I, *even* I, *am* the LORD; and beside me *there is* no saviour.","12":"I have declared, and have saved, and I have shewed, when *there was* no strange *god* among you: therefore ye *are* my witnesses, saith the LORD, that I *am* God.","13":"Yea, before the day *was* I *am* he; and *there is* none that can deliver out of my hand: I will work, and who shall let","14":"Thus saith the LORD, your redeemer, the Holy One of Israel; For your sake I have sent to Babylon, and have brought down all their nobles, and the Chaldeans, whose cry *is* in the ships.","15":"I *am* the LORD, your Holy One, the creator of Israel, your King.","16":"Thus saith the LORD, which maketh a way in the sea, and a path in the mighty waters;","17":"Which bringeth forth the chariot and horse, the army and the power; they shall lie down together, they shall not rise: they are extinct, they are quenched as tow.","18":"Remember ye not the former things, neither consider the things of old.","19":"Behold, I will do a new thing; now it shall spring forth; shall ye not know it? I will even make a way in the wilderness, *and* rivers in the desert.","20":"The beast of the field shall honour me, the dragons and the owls: because I give waters in the wilderness, *and* rivers in the desert, to give drink to my people, my chosen.","21":"This people have I formed for myself; they shall shew forth my praise.","22":"But thou hast not called upon me, O Jacob; but thou hast been weary of me, O Israel.","23":"Thou hast not brought me the small cattle of thy burnt offerings; neither hast thou honoured me with thy sacrifices. I have not caused thee to serve with an offering, nor wearied thee with incense.","24":"Thou hast bought me no sweet cane with money, neither hast thou filled me with the fat of thy sacrifices: but thou hast made me to serve with thy sins, thou hast wearied me with thine iniquities.","25":"I, *even* I, *am* he that blotteth out thy transgressions for mine own sake, and will not remember thy sins.","26":"Put me in remembrance: let us plead together: declare thou, that thou mayest be justified.","27":"Thy first father hath sinned, and thy teachers have transgressed","28":"Therefore I have profaned the princes of the sanctuary, and have given Jacob to the curse, and Israel to reproaches."}},"tsk":{"1":[{"kopje":"Schepper","refs":["Jes 43:7","Jes 43:15","Jes 43:21","Jes 44:2","Jes 44:21","Ps 100:3","Ps 102:19","Jer 31:3","Jer 33:24","Jer 33:26","Ef 2:10"]},{"kopje":"Vrees niet","refs":["Jes 43:14","Jes 35:9","Jes 35:10","Jes 41:14","Jes 44:6","Jes 44:22-24","Jes 48:17","Jes 54:4","Jes 54:5","Jes 62:12","Jes 63:16","Ex 15:13","Jer 50:34","Tit 2:14","Openb 5:9"]},{"kopje":"Ik heb geroepen","refs":["Jes 42:6","Jes 44:5","Jes 45:4","Jes 49:1","Ex 33:17","Hand 27:20","Hand 27:25"]},{"kopje":"u bent van Mij","refs":["Ex 19:5","Ex 19:6","Deut 32:9","Ezech 16:8","Zach 13:9","Mal 3:17","2 Tim 2:19","Hebr 8:8-10"]}],"2":[{"kopje":"zult gaan","refs":["Jes 8:7-10","Jes 11:15","Jes 11:16","Ex 14:29","Joz 3:15-17","Ps 66:10","Ps 66:12","Ps 91:3-5","Amos 9:8","Amos 9:9","Matt 7:25-27","Hebr 11:29"]},{"kopje":"zal bij u zijn","refs":["Jes 41:10","Jes 41:14","Deut 31:6-8","Joz 1:5","Joz 1:9","Ps 23:4","Ps 46:5-8","Ps 91:15","Matt 1:23","2 Kor 12:9","2 Kor 12:10","2 Tim 4:17","2 Tim 4:22"]},{"kopje":"Wanneer u zult gaan","refs":["Dan 3:25-27","Zach 13:9","Mal 3:2","Mal 3:3","Mal 4:1","Luk 21:12-18","1 Kor 3:13-15","Hebr 11:33-38","1 Petr 4:12","1 Petr 4:13"]}],"3":[{"kopje":"de Heilige van Israël","refs":["Jes 30:11","Jes 41:14","Jes 45:15","Jes 45:21","Jes 49:26","Jes 60:16","Hos 13:4","Tit 2:10-14","Tit 3:4-6","Judas 1:25"]},{"kopje":"Ik heb gegeven","refs":["Ex 10:7","2 Kron 14:9-14","Spr 11:8","Spr 21:18"]}],"4":[{"kopje":"kostbaar","refs":["Ex 19:5","Ex 19:6","Deut 7:6-8","Deut 14:2","Deut 26:18","Deut 32:9-14","Ps 135:4","Mal 3:17","Tit 2:14","1 Petr 2:9"]},{"kopje":"u bent geweest","refs":["Gen 12:2", > u <em>uw</em> <em>redenen</em>, <span class=\"wl\" data-l=\"L5\" data-code=\"H6663\">opdat</span> u <span class=\"wl\" data-l=\"L5\" data-code=\"H6663\">gerechtvaardigd</span> mag worden.","27":"<span class=\"wl\" data-l=\"L1\" data-code=\"H7223\">Uw</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H7223\">eerste</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H1\">vader</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H1\">heeft</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H2398\">gezondigd</span>, <span class=\"wl\" data-l=\"L4\" data-code=\"H3887\">en</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H3887\">uw</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H3887\">uitleggers</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H3887\">hebben</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H6586\">tegen</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H6586\">Mij</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H6586\">overtreden</span>.","28":"<span class=\"wl\" data-l=\"L1\" data-code=\"H8269\">Daarom</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H8269\">zal</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H8269\">Ik</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H8269\">de</span> leiders van <span class=\"wl\" data-l=\"L2\" data-code=\"H6944\">het</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H6944\">heiligdom</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H2490\">ontheiligen</span>, <span class=\"wl\" data-l=\"L4\" data-code=\"H3290\">en</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H3290\">Jakob</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H2764\">ten</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H2764\">ban</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H8269\">overgeven</span>, <span class=\"wl\" data-l=\"L6\" data-code=\"H3478\">en</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H3478\">Israël</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H3478\">tot</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H1421\">beschimpingen</span>."},"koppeling_kjv":{"1":"But now thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> that <span class=\"wl wl-kjv\" data-code=\"H1254\">created</span> thee, O <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> and he that <span class=\"wl wl-kjv\" data-code=\"H3335\">formed</span> thee, O <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H3372\">Fear</span> not: for I have <span class=\"wl wl-kjv\" data-code=\"H1350\">redeemed</span> thee, I have <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> thee by thy name;","2":"When thou passest <span class=\"wl wl-kjv\" data-code=\"H5674\">through</span> the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters,</span> I will be with thee; and through the <span class=\"wl wl-kjv\" data-code=\"H5104\">rivers,</span> they shall not <span class=\"wl wl-kjv\" data-code=\"H7857\">overflow</span> thee: when thou <span class=\"wl wl-kjv\" data-code=\"H3212\">walkest</span> <span class=\"wl wl-kjv\" data-code=\"H1119\">through</span> the <span class=\"wl wl-kjv\" data-code=\"H784\">fire,</span> thou shalt not be <span class=\"wl wl-kjv\" data-code=\"H3554\">burned;</span> neither shall the <span class=\"wl wl-kjv\" data-code=\"H3852\">flame</span> kindle","3":"For I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> the Holy <span class=\"wl wl-kjv\" data-code=\"H6918\">One</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> thy <span class=\"wl wl-kjv\" data-code=\"H3467\">Saviour:</span> I <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> for thy <span class=\"wl wl-kjv\" data-code=\"H3724\">ransom,</span> <span class=\"wl wl-kjv\" data-code=\"H3568\">Ethiopia</span> and Seba","4":"Since thou wast <span class=\"wl wl-kjv\" data-code=\"H3365\">precious</span> in my <span class=\"wl wl-kjv\" data-code=\"H5869\">sight,</span> thou hast been <span class=\"wl wl-kjv\" data-code=\"H3513\">honourable,</span> and I have <span class=\"wl wl-kjv\" data-code=\"H157\">loved</span> thee: therefore will I <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> <span class=\"wl wl-kjv\" data-code=\"H120\">men</span> for thee, and <span class=\"wl wl-kjv\" data-code=\"H3816\">people</span> for thy life.","5":"<span class=\"wl wl-kjv\" data-code=\"H3372\">Fear</span> not: for I am with thee: I will <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> thy <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> from the <span class=\"wl wl-kjv\" data-code=\"H4217\">east,</span> and <span class=\"wl wl-kjv\" data-code=\"H6908\">gather</span> thee from the west;","6":"I will <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> to the <span class=\"wl wl-kjv\" data-code=\"H6828\">north,</span> Give <span class=\"wl wl-kjv\" data-code=\"H5414\">up;</span> and to the <span class=\"wl wl-kjv\" data-code=\"H8486\">south,</span> Keep not <span class=\"wl wl-kjv\" data-code=\"H3607\">back:</span> <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> my <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> from <span class=\"wl wl-kjv\" data-code=\"H7350\">far,</span> and my <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> from the <span class=\"wl wl-kjv\" data-code=\"H7097\">ends</span> of the earth;","7":"Even every <span class=\"wl wl-kjv\" data-code=\"H3605\">one</span> that is <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> by my <span class=\"wl wl-kjv\" data-code=\"H8034\">name:</span> for I have <span class=\"wl wl-kjv\" data-code=\"H1254\">created</span> him for my <span class=\"wl wl-kjv\" data-code=\"H3519\">glory,</span> I have <span class=\"wl wl-kjv\" data-code=\"H3335\">formed</span> him; yea, I have made","8":"Bring <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> the <span class=\"wl wl-kjv\" data-code=\"H5787\">blind</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that <span class=\"wl wl-kjv\" data-code=\"H3426\">have</span> <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2795\">deaf</span> that have ears.","9":"Let all the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> be <span class=\"wl wl-kjv\" data-code=\"H6908\">gathered</span> <span class=\"wl wl-kjv\" data-code=\"H3162\">together,</span> and let the <span class=\"wl wl-kjv\" data-code=\"H3816\">people</span> be <span class=\"wl wl-kjv\" data-code=\"H622\">assembled:</span> who among them can <span class=\"wl wl-kjv\" data-code=\"H5046\">declare</span> this, and <span class=\"wl wl-kjv\" data-code=\"H8085\">shew</span> us former <span class=\"wl wl-kjv\" data-code=\"H7223\">things?</span> let them bring <span class=\"wl wl-kjv\" data-code=\"H5414\">forth</span> their <span class=\"wl wl-kjv\" data-code=\"H5707\">witnesses,</span> that they may be <span class=\"wl wl-kjv\" data-code=\"H6663\">justified:</span> or let them <span class=\"wl wl-kjv\" data-code=\"H8085\">hear,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> It is truth.","10":"Ye are my <span class=\"wl wl-kjv\" data-code=\"H5707\">witnesses,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and my <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> whom I have <span class=\"wl wl-kjv\" data-code=\"H977\">chosen:</span> that ye may <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> and <span class=\"wl wl-kjv\" data-code=\"H539\">believe</span> me, and <span class=\"wl wl-kjv\" data-code=\"H995\">understand</span> that I am he: <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> me there was no <span class=\"wl wl-kjv\" data-code=\"H410\">God</span> <span class=\"wl wl-kjv\" data-code=\"H3335\">formed,</span> neither shall there be after","11":"I, even I, am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> and <span class=\"wl wl-kjv\" data-code=\"H1107\">beside</span> me there is no saviour.","12":"I have <span class=\"wl wl-kjv\" data-code=\"H5046\">declared,</span> and have <span class=\"wl wl-kjv\" data-code=\"H3467\">saved,</span> and I have <span class=\"wl wl-kjv\" data-code=\"H8085\">shewed,</span> when there was no <span class=\"wl wl-kjv\" data-code=\"H2114\">strange</span> god among you: therefore ye are my <span class=\"wl wl-kjv\" data-code=\"H5707\">witnesses,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> that I am God.","13":"Yea, before the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> was I am he; and there is none that can <span class=\"wl wl-kjv\" data-code=\"H5337\">deliver</span> out of my <span class=\"wl wl-kjv\" data-code=\"H3027\">hand:</span> I will <span class=\"wl wl-kjv\" data-code=\"H6466\">work,</span> and who shall let","14":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> your <span class=\"wl wl-kjv\" data-code=\"H1350\">redeemer,</span> the Holy <span class=\"wl wl-kjv\" data-code=\"H6918\">One</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> For your sake I have <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> to <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> and have brought <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> all their <span class=\"wl wl-kjv\" data-code=\"H1281\">nobles,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3778\">Chaldeans,</span> whose <span class=\"wl wl-kjv\" data-code=\"H7440\">cry</span> is in the ships.","15":"I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> your Holy <span class=\"wl wl-kjv\" data-code=\"H6918\">One,</span> the <span class=\"wl wl-kjv\" data-code=\"H1254\">creator</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> your King.","16":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> which <span class=\"wl wl-kjv\" data-code=\"H5414\">maketh</span> a <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> in the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea,</span> and a <span class=\"wl wl-kjv\" data-code=\"H5410\">path</span> in the <span class=\"wl wl-kjv\" data-code=\"H5794\">mighty</span> waters;","17":"Which bringeth <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> the <span class=\"wl wl-kjv\" data-code=\"H7393\">chariot</span> and <span class=\"wl wl-kjv\" data-code=\"H5483\">horse,</span> the <span class=\"wl wl-kjv\" data-code=\"H2428\">army</span> and the <span class=\"wl wl-kjv\" data-code=\"H5808\">power;</span> they shall lie <span class=\"wl wl-kjv\" data-code=\"H7901\">down</span> <span class=\"wl wl-kjv\" data-code=\"H3162\">together,</span> they shall not <span class=\"wl wl-kjv\" data-code=\"H6965\">rise:</span> they are <span class=\"wl wl-kjv\" data-code=\"H1846\">extinct,</span> they are <span class=\"wl wl-kjv\" data-code=\"H3518\">quenched</span> as tow.","18":"<span class=\"wl wl-kjv\" data-code=\"H2142\">Remember</span> ye not the former <span class=\"wl wl-kjv\" data-code=\"H7223\">things,</span> neither <span class=\"wl wl-kjv\" data-code=\"H995\">consider</span> the things of old.","19":"Behold, I will <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> a new <span class=\"wl wl-kjv\" data-code=\"H2319\">thing;</span> now it shall spring <span class=\"wl wl-kjv\" data-code=\"H6779\">forth;</span> shall ye not <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> it? I will even <span class=\"wl wl-kjv\" data-code=\"H7760\">make</span> a <span clas >given</span> <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> to the <span class=\"wl wl-kjv\" data-code=\"H2764\">curse,</span> and <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> to reproaches."}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
