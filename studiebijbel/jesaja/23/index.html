:"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"De last[1] van Tyrus. Huil, u schepen van Tarsis! Want zij is verwoest, zodat er geen huis meer is, zodat niemand er meer in kan gaan; uit het land Chittim is het aan hen bekendgemaakt.","2":"Zwijg, u inwoners van het eiland! U, die de kooplieden van Sidon, die over zee voeren, rijk maakten,","3":"En wiens inkomsten het zaad van Sichor was over het grote water, de oogst van de rivier; en zij was de markt van de heidenvolken.","4":"Word beschaamd, o Sidon! Want de zee spreekt, *ja*, de sterkte van de zee, en zegt: Ik heb geen weeën gehad, ik heb ook niet gebaard, en ik heb geen jongemannen groot gemaakt, *en* geen jonge meisjes opgevoed.","5":"Zoals het geweest is bij de tijding over Egypte, zo zal men ook in pijn zijn, als men over Tyrus horen zal.","6":"Vaar over naar Tarsis, huil, u inwoners van het eiland!","7":"Is dit uw vrolijk huppelende *stad*? Wier oudheid van oude dagen af is; *maar* haar eigen voeten zullen haar ver wegdragen, om als vreemdeling te verblijven.","8":"Wie heeft dit besloten tegen Tyrus, de stad die anderen kroont[2], wier kooplieden vorsten zijn, wier handelaars de heerlijkste van het land zijn?","9":"De HEERE van de heerscharen[3] heeft het besloten, om de hoogmoed van alle luister te ontheiligen, om alle heerlijksten van de aarde verachtelijk te maken.","10":"Ga door uw land, als een rivier, dochter van Tarsis! Er is geen gordel meer.","11":"Hij heeft Zijn hand uitgestrekt over de zee, Hij heeft de koninkrijken doen beven; de HEERE heeft bevel gegeven tegen Kanaän, om haar vestingen te vernietigen.","12":"En Hij heeft gezegd: U zult niet meer vrolijk huppelen, o u verdrukte maagd, dochter van Sidon! Maak u op naar Chittim, vaar over; ook daar zult u geen rust hebben.","13":"Zie, het land van de Chaldeeën; dit volk bestond niet; Assur heeft het gegrondvest voor hen die in de wildernissen woonden; zij richtten hun vestingtorens op, *en* bouwden hun paleizen, *maar* Hij heeft het tot een vervallen puinhoop gemaakt.","14":"Huil, u schepen van Tarsis! Want uw sterkte is verwoest.","15":"En het zal op die dag gebeuren, dat Tyrus zeventig jaren vergeten zal worden, zoals de dagen van één koning; *maar* aan het einde van zeventig jaren zal het met Tyrus zijn als in het lied van een hoer:","16":"Neem de harp, ga rond door de stad, u vergeten hoer! Speel mooi, zing veel liederen, opdat men weer aan u denkt!","17":"Want het zal gebeuren aan het einde van zeventig jaren, dat de HEERE Tyrus zal bezoeken[4], en dat zij zal terugkeren tot haar hoerenloon, en zij zal hoererij bedrijven met alle koninkrijken van de aarde, die op de aardbodem zijn.","18":"En haar koophandel en haar hoerenloon zullen de HEERE heilig zijn, het zal niet als schat verzameld worden, en ook niet weggesloten; maar haar koophandel zal er zijn voor hen die voor het aangezicht van de HEERE wonen, opdat zij tot verzadiging eten, en opdat zij duurzame kleding hebben."},"SV":{"1":"De last van Tyrus. Huilt, gij schepen van Tarsis! want zij is verwoest, dat er geen huis meer is, dat niemand er meer ingaat; uit het land Chittim is het aan hen openbaar geworden.","2":"Zwijgt, gij inwoners des eilands! gij, die de kooplieden van Sidon, over zee varende, vervulden,","3":"En wiens inkomst was het zaad van Sichor over de grote wateren, de oogst der rivier; en zij was de markt der heidenen.","4":"Word beschaamd, o Sidon! want de zee spreekt, *ja*, de sterkte der zee, zeggende: Ik heb geen barensnood gehad, ik heb ook niet gebaard, en ik heb geen jongelingen groot gemaakt, *en* geen jonge dochters opgebracht.","5":"Gelijk als geweest is de tijding van Egypte, zal men ook in weedom zijn, als men van Tyrus horen zal.","6":"Vaart over naar Tarsis, huilt, gij inwoners des eilands!","7":"Is dit uw vrolijk huppelende *stad*? welker oudheid *wel* van oude dagen af is; *maar* haar eigen voeten zullen haar verre wegdragen, om in vreemdelingschap te verkeren.","8":"Wie heeft dit beraadslaagd over Tyrus, die kronende *stad*, welker kooplieden vorsten zijn, welker handelaars de heerlijkste in het land zijn?","9":"De HEERE der heirscharen heeft het beraadslaagd, opdat Hij ontheilige de hovaardij van alle sieraad, om al de heerlijksten der aarde verachtelijk te maken.","10":"Ga door *naar* uw land, als een rivier, gij dochter van Tarsis! er is geen gordel meer.","11":"Hij heeft Zijn hand uitgestrekt over de zee, Hij heeft de koninkrijken beroerd; de HEERE heeft bevel gegeven tegen Kanaän, om haar sterkten te verdelgen.","12":"En Hij heeft gezegd: Gij zult niet meer vrolijk huppelen, o gij verdrukte maagd, gij dochter van Sidon! Naar Chittim toe, maak u op, vaar over; ook zult gij aldaar geen rust hebben.","13":"Ziet, het land der Chaldeen; dit volk was er niet; Assur heeft het gefondeerd voor degenen, die in de wildernissen woonden; zij richtten hun sterkten op, *en* bouwden hun paleizen, *maar* Hij heeft het tot een vervallen hoop gesteld.","14":"Huilt, gij schepen van Tarsis! want ulieder sterkte is verstoord.","15":"En het zal geschieden te dien dage, dat Tyrus zal vergeten worden zeventig jaren, gelijk eens konings dagen; *maar* ten einde van zeventig jaren zal in Tyrus als een hoerenlied zijn:","16":"Neem de harp, ga in de stad rondom, gij vergeten hoer! speel wel, zing veel liederen, opdat uwer gedacht worde!","17":"Want het zal geschieden ten einde van zeventig jaren, dat de HEERE Tyrus zal bezoeken, en dat zij wederkeren zal tot haar hoerenloon, en zij zal hoererij bedrijven met alle koninkrijken der aarde, die op den aardbodem zijn.","18":"En haar koophandel en haar hoerenloon zal den HEERE heilig zijn, het zal niet ten schat vergaderd noch opgesloten worden; maar haar koophandel zal wezen voor hen, die voor den HEERE wonen, opdat zij eten tot verzadiging, en dat zij durig deksel hebben."},"KJV":{"1":"The burden of Tyre. Howl, ye ships of Tarshish; for it is laid waste, so that there is no house, no entering in: from the land of Chittim it is revealed","2":"Be still, ye inhabitants of the isle; thou whom the merchants of Zidon, that pass over the sea, have replenished.","3":"And by great waters the seed of Sihor, the harvest of the river, *is* her revenue; and she is a mart of nations.","4":"Be thou ashamed, O Zidon: for the sea hath spoken, *even* the strength of the sea, saying, I travail not, nor bring forth children, neither do I nourish up young men, *nor* bring up virgins.","5":"As at the report concerning Egypt, *so* shall they be sorely pained at the report of Tyre.","6":"Pass ye over to Tarshish; howl, ye inhabitants of the isle.","7":"*Is* this your joyous *city*, whose antiquity *is* of ancient days? her own feet shall carry her afar off to sojourn.","8":"Who hath taken this counsel against Tyre, the crowning *city*, whose merchants *are* princes, whose traffickers *are* the honourable of the earth?","9":"The LORD of hosts hath purposed it, to stain the pride of all glory, *and* to bring into contempt all the honourable of the earth.","10":"Pass through thy land as a river, O daughter of Tarshish: *there is* no more strength.","11":"He stretched out his hand over the sea, he shook the kingdoms: the LORD hath given a commandment against the merchant *city*, to destroy the strong holds","12":"And he said, Thou shalt no more rejoice, O thou oppressed virgin, daughter of Zidon: arise, pass over to Chittim; there also shalt thou have no rest.","13":"Behold the land of the Chaldeans; this people was not, *till* the Assyrian founded it for them that dwell in the wilderness: they set up the towers thereof, they raised up the palaces thereof; *and* he brought it to ruin.","14":"Howl, ye ships of Tarshish: for your strength is laid waste.","15":"And it shall come to pass in that day, that Tyre shall be forgotten seventy years, according to the days of one king: after the end of seventy years shall Tyre sing as an harlot.","16":"Take an harp, go about the city, thou harlot that hast been forgotten; make sweet melody, sing many songs, that thou mayest be remembered.","17":"And it shall come to pass after the end of seventy years, that the LORD will visit Tyre, and she shall turn to her hire, and shall commit fornication with all the kingdoms of the world upon the face of the earth.","18":"And her merchandise and her hire shall be holiness to the LORD: it shall not be treasured nor laid up; for her merchandise shall be for them that dwell before the LORD, to eat sufficiently, and for durable clothing."}},"tsk":{"1":[{"kopje":"last","refs":["Jer 25:15","Jer 25:22","Jer 47:4","Ezech 26:1","Ezech 28:25","Joël 3:4-8","Amos 1:9","Amos 1:10","Zach 9:2","Zach 9:4"]},{"kopje":"Huil","refs":["Jes 15:2","Jes 15:8","Openb 18:17-19"]},{"kopje":"u schepen","refs":["Jes 2:16","Jes 60:9","1 Kon 22:49","2 Kron 9:21","Ps 48:8","Ezech 27:25"]},{"kopje":"want zij is","refs":["Jes 15:1","Jer 25:10","Jer 25:11","Openb 18:22","Openb 18:23"]},{"kopje":"het land","refs":["Jes 23:12","Num 24:24","Jer 2:10","Ezech 27:6","Dan 11:30"]}],"2":[{"kopje":"Zwijg","refs":["Jes 41:1","Jes 47:5","Ps 46:11","Hab 2:20"]},{"kopje":"het eiland","refs":["Ezech 27:3","Ezech 27:4","Ezech 28:2"]},{"kopje":"de kooplieden","refs":["Ezech 27:8-36"]}],"3":[{"kopje":"Sichor","refs":["1 Kron 13:5","Jer 2:18"]},{"kopje":"de oogst","refs":["Jes 32:20","Deut 11:10"]},{"kopje":"zij was","refs":["Jes 23:8","Ezech 27:33","Ezech 28:4","Joël 3:5","Openb 18:11-13"]}],"4":[{"kopje":"Ik heb geen weeën gehad","refs":["Jer 47:3","Jer 47:4","Ezech 26:3-6","Hos 9:11-14","Openb 18:23"]}],"5":[{"kopje":"over","refs":["Jes 19:16","Ex 15:14-16","Joz 2:9-11"]},{"kopje":"zo zal","refs":["Ezech 26:15-21","Ezech 27:29-36" span> of the <span class=\"wl wl-kjv\" data-code=\"H339\">isle;</span> thou whom the <span class=\"wl wl-kjv\" data-code=\"H5503\">merchants</span> of <span class=\"wl wl-kjv\" data-code=\"H6721\">Zidon,</span> that pass <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea,</span> have replenished.","3":"And by <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> the <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> of <span class=\"wl wl-kjv\" data-code=\"H7883\">Sihor,</span> the <span class=\"wl wl-kjv\" data-code=\"H7105\">harvest</span> of the <span class=\"wl wl-kjv\" data-code=\"H2975\">river,</span> is her <span class=\"wl wl-kjv\" data-code=\"H8393\">revenue;</span> and she is a <span class=\"wl wl-kjv\" data-code=\"H5505\">mart</span> of nations.","4":"Be thou <span class=\"wl wl-kjv\" data-code=\"H954\">ashamed,</span> O <span class=\"wl wl-kjv\" data-code=\"H6721\">Zidon:</span> for the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea</span> hath <span class=\"wl wl-kjv\" data-code=\"H559\">spoken,</span> even the <span class=\"wl wl-kjv\" data-code=\"H4581\">strength</span> of the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> I <span class=\"wl wl-kjv\" data-code=\"H2342\">travail</span> not, nor bring forth <span class=\"wl wl-kjv\" data-code=\"H3205\">children,</span> neither do I nourish <span class=\"wl wl-kjv\" data-code=\"H1431\">up</span> young <span class=\"wl wl-kjv\" data-code=\"H970\">men,</span> nor bring <span class=\"wl wl-kjv\" data-code=\"H7311\">up</span> virgins.","5":"As at the <span class=\"wl wl-kjv\" data-code=\"H8088\">report</span> concerning <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> so shall they be sorely <span class=\"wl wl-kjv\" data-code=\"H2342\">pained</span> at the <span class=\"wl wl-kjv\" data-code=\"H8088\">report</span> of Tyre.","6":"Pass ye <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> to <span class=\"wl wl-kjv\" data-code=\"H8659\">Tarshish;</span> <span class=\"wl wl-kjv\" data-code=\"H3213\">howl,</span> ye <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of the isle.","7":"Is this your <span class=\"wl wl-kjv\" data-code=\"H5947\">joyous</span> city, whose <span class=\"wl wl-kjv\" data-code=\"H6927\">antiquity</span> is of <span class=\"wl wl-kjv\" data-code=\"H6924\">ancient</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days?</span> her own <span class=\"wl wl-kjv\" data-code=\"H7272\">feet</span> shall <span class=\"wl wl-kjv\" data-code=\"H2986\">carry</span> her afar <span class=\"wl wl-kjv\" data-code=\"H7350\">off</span> to sojourn.","8":"Who hath taken this <span class=\"wl wl-kjv\" data-code=\"H3289\">counsel</span> against <span class=\"wl wl-kjv\" data-code=\"H6865\">Tyre,</span> the <span class=\"wl wl-kjv\" data-code=\"H5849\">crowning</span> city, whose <span class=\"wl wl-kjv\" data-code=\"H5503\">merchants</span> are <span class=\"wl wl-kjv\" data-code=\"H8269\">princes,</span> whose <span class=\"wl wl-kjv\" data-code=\"H3667\">traffickers</span> are the <span class=\"wl wl-kjv\" data-code=\"H3513\">honourable</span> of the earth?","9":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts</span> hath <span class=\"wl wl-kjv\" data-code=\"H3289\">purposed</span> it, to <span class=\"wl wl-kjv\" data-code=\"H2490\">stain</span> the <span class=\"wl wl-kjv\" data-code=\"H1347\">pride</span> of all <span class=\"wl wl-kjv\" data-code=\"H6643\">glory,</span> and to bring into <span class=\"wl wl-kjv\" data-code=\"H7043\">contempt</span> all the <span class=\"wl wl-kjv\" data-code=\"H3513\">honourable</span> of the earth.","10":"<span class=\"wl wl-kjv\" data-code=\"H5674\">Pass</span> through thy <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> as a <span class=\"wl wl-kjv\" data-code=\"H2975\">river,</span> O <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H8659\">Tarshish:</span> there is no more strength.","11":"He stretched <span class=\"wl wl-kjv\" data-code=\"H5186\">out</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> over the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea,</span> he <span class=\"wl wl-kjv\" data-code=\"H7264\">shook</span> the <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdoms:</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath given a <span class=\"wl wl-kjv\" data-code=\"H6680\">commandment</span> against the <span class=\"wl wl-kjv\" data-code=\"H3667\">merchant</span> city, to <span class=\"wl wl-kjv\" data-code=\"H8045\">destroy</span> the <span class=\"wl wl-kjv\" data-code=\"H4581\">strong</span> holds","12":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Thou shalt no <span class=\"wl wl-kjv\" data-code=\"H3254\">more</span> <span class=\"wl wl-kjv\" data-code=\"H5937\">rejoice,</span> O thou <span class=\"wl wl-kjv\" data-code=\"H6231\">oppressed</span> <span class=\"wl wl-kjv\" data-code=\"H1330\">virgin,</span> <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H6721\">Zidon:</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">arise,</span> pass <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> to <span class=\"wl wl-kjv\" data-code=\"H3794\">Chittim;</span> there also shalt thou have no rest.","13":"Behold the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of the <span class=\"wl wl-kjv\" data-code=\"H3778\">Chaldeans;</span> this <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> was not, till the <span class=\"wl wl-kjv\" data-code=\"H804\">Assyrian</span> <span class=\"wl wl-kjv\" data-code=\"H3245\">founded</span> it for them that dwell in the <span class=\"wl wl-kjv\" data-code=\"H6728\">wilderness:</span> they set <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H971\">towers</span> thereof, they raised <span class=\"wl wl-kjv\" data-code=\"H6209\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H759\">palaces</span> thereof; and he <span class=\"wl wl-kjv\" data-code=\"H7760\">brought</span> it to ruin.","14":"<span class=\"wl wl-kjv\" data-code=\"H3213\">Howl,</span> ye <span class=\"wl wl-kjv\" data-code=\"H591\">ships</span> of <span class=\"wl wl-kjv\" data-code=\"H8659\">Tarshish:</span> for your <span class=\"wl wl-kjv\" data-code=\"H4581\">strength</span> is laid waste.","15":"And it shall come to pass in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> that <span class=\"wl wl-kjv\" data-code=\"H6865\">Tyre</span> shall be <span class=\"wl wl-kjv\" data-code=\"H7911\">forgotten</span> <span class=\"wl wl-kjv\" data-code=\"H7657\">seventy</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years,</span> according to the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king:</span> after the <span class=\"wl wl-kjv\" data-code=\"H7093\">end</span> of <span class=\"wl wl-kjv\" data-code=\"H7657\">seventy</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> shall <span class=\"wl wl-kjv\" data-code=\"H6865\">Tyre</span> <span class=\"wl wl-kjv\" data-code=\"H7892\">sing</span> as an harlot.","16":"<span class=\"wl wl-kjv\" data-code=\"H3947\">Take</span> an <span class=\"wl wl-kjv\" data-code=\"H3658\">harp,</span> go <span class=\"wl wl-kjv\" data-code=\"H5437\">about</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> thou <span class=\"wl wl-kjv\" data-code=\"H2181\">harlot</span> that hast been <span class=\"wl wl-kjv\" data-code=\"H7911\">forgotten;</span> make <span class=\"wl wl-kjv\" data-code=\"H3190\">sweet</span> <span class=\"wl wl-kjv\" data-code=\"H5059\">melody,</span> sing <span class=\"wl wl-kjv\" data-code=\"H7235\">many</span> <span class=\"wl wl-kjv\" data-code=\"H7892\">songs,</span> that thou mayest be remembered.","17":"And it shall come to pass after the <span class=\"wl wl-kjv\" data-code=\"H7093\">end</span> of <span class=\"wl wl-kjv\" data-code=\"H7657\">seventy</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years,</span> that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will <span class=\"wl wl-kjv\" data-code=\"H6485\">visit</span> <span class=\"wl wl-kjv\" data-code=\"H6865\">Tyre,</span> and she shall <span class=\"wl wl-kjv\" data-code=\"H7725\">turn</span> to her <span class=\"wl wl-kjv\" data-code=\"H868\">hire,</span> and shall commit <span class=\"wl wl-kjv\" data-code=\"H2181\">fornication</span> with all the <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdoms</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">world</span> upon the <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> of the earth.","18":"And her <span class=\"wl wl-kjv\" data-code=\"H5504\">merchandise</span> and her <span class=\"wl wl-kjv\" data-code=\"H868\">hire</span> shall be <span class=\"wl wl-kjv\" data-code=\"H6944\">holiness</span> to the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> it shall not be <span class=\"wl wl-kjv\" data-code=\"H686\">treasured</span> nor laid <span class=\"wl wl-kjv\" data-code=\"H2630\">up;</span> for her <span class=\"wl wl-kjv\" data-code=\"H5504\">merchandise</span> shall be for them that <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> to <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> <span class=\"wl wl-kjv\" data-code=\"H7654\">sufficiently,</span> and for <span class=\"wl wl-kjv\" data-code=\"H6266\">durable</span> clothing."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"last","tekst":"De zin is: Dit is een bezwaarlijke profetie, voorzeggende welke ellende Tyrus zal overkomen. Zie Isa 13:1 ."},{"catchword":"gij schepen","tekst":"Dat is, schippers en kooplieden, die over zee met Tyrus handelen."},{"catchword":"Tarsis","tekst":"Zie 1Ki 10:22 ."},{"catchword":"zij is verwoest,","tekst":"Dat is, hij zal verstoord worden. Dit heeft de profeet gesproken toen Tyrus nog in haar fleur en grootste heerlijkheid was. En dit dreigt hier de profeet niet alleen de stad Tyrus, maar ook het ganse eiland."},{"catchword":"dat er geen huis","tekst":"Hebreeuws, van huis en van inkomen, of ingaan; vergelijk onder Isa 24:10 . Deze en de naastvolgende woorden vertalen en verklaren sommigen aldus: Zij is verstoord van [hare] huisgenoten en van de inkomelingen; dat is, niet alleen van de vreemdelingen, maar ook van hun eigen knechten en slaven. Want als dezen zagen dat hunner heren macht en vermogen schier tot niet gekomen was, zo hebben zij samengespannen, en hebben hunne heren en alle vrije personen vermoord, de regering aan zich genomen, en enen, genoemd Strato, koning gemaakt. Justin, in zijne historie lib. 18."},{"catchword":"uit het land Chittim","tekst":"Dat is, het zal hun, te weten schippers en kooplieden, uit het land Chittim openbaar worden; dat is, uit Cilicië, of Macedonië, [zie Gen 10:4 ] ; vanwaar de tijdingen van Tyrus' eerste verwoesting door Nebukadnezar zouden verspreid worden, door de vluchtenden, die vandaar naar Cilicië zouden overvaren, en vanwaar het verderf hun naderhand overkomen zou. De zin dan dezer woorden is: Deze verwoesting zal dien van Tyrus overkomen eerst door den koning Nebukadnezar, Jer 47 ; Eze 26:14 , en Eze 29:18-20 , en lang daarna door de Grieken en Macedoniërs; te weten, door Alexander den Grote, die vele jaren hierna Tyrus ingenomen en overhoop geworpen heeft."}],"2":[{"catchword":"Zwijgt,","tekst":"Alsof hij zeide: Roemt niet meer vanwege uw groten rijkdom en heerlijkheid, zij zullen haast een einde nemen."},{"catchword":"des eilands","tekst":"Te weten van het eiland Tyrus. Deze stad lag op een eiland toen Jesaja dit heeft geprofeteerd."},{"catchword":"gij,","tekst":"Hebreeuws, de koopman van Sidon overzee varende vervulde u."},{"catchword":"Sidon,","tekst":"Dit is ook eertijds een voortreffelijke koopstad geweest, nabij Tyrus gelegen, onder een gebied behorende. Zie Eze 28:21 ."},{"catchword":"vervulden,","tekst":"Te weten met allerlei waren en koopmanschappen, die zij met hun geladen schepen daarin brachten."}],"3":[{"catchword":"het zaad","tekst":"Hier wordt het zaad gesteld voor het vlas, dat uit het zaad wast."},{"catchword":"Sichor","tekst":"Dit is de naam ener rivier, die Egypte van Kanaän scheidt. Jos 13:3 ; zie de aantekening aldaar. Egypte zelf wordt somtijds Sichor genoemd naar deze rivier."},{"catchword":"de grote wateren,","tekst":"Eenigen verstaan hier door de grote wateren den oceaan, anderen de grote rivieren van Egypte."},{"catchword":"de oogst","tekst":"Dat is, het korengewas."},{"catchword":"der rivier;","tekst":"Dat is, het koren, hetwelk langs de beken wast, waarvan het bevochtigd wordt als de Nijl overloopt; anders: der beek [van Egypte]. De profeet wil zeggen dat Tyrus rijk werd door het verhandelen der vruchten, die in andere landen wiessen."},{"catchword":"de markt der heidenen","tekst":"Dat is, de handelplaats. Zie Eze 27:3 , Eze 27:12 ."}],"4":[{"catchword":"o Sidon","tekst":"Dat is, o gij Sidonieten. Dezen hebben eerst de stad Tyrus gebouwd."},{"catchword":"de zee spreekt,","tekst":"Dat is, de inwoners der eilanden, die in de zee liggen; gelijk Psa 65:6 ."},{"catchword":"de sterkte der zee,","tekst":"Versta, de stad Tyrus, die vanwege de zee, waarin zij lag, scheen onwinbaar te zijn."},{"catchword":"Ik heb geen barensnood","tekst":"De zin dezer woorden is, alsof Tyrus zeide: Het is met mij, die zo volkrijk placht te zijn, nu zo gesteld, alsof ik geheel onvruchtbaar ware geworden, ja, alsof ik vóór dezen gene kinderen of inwoners gehad of opgevoed had; ik ben heel doods geworden, het is met mij uit."},{"catchword":"groot gemaakt,","tekst":"Dat is, tot vollen wasdom gebracht."}],"5":[{"catchword":"de tijding","tekst":"Versta hier die straf, die eertijds den Egyptenaars ten tijde van Mozes is overkomen, gelijk Exo 15:14 . Of die straf van Egypte, waarvan Isa 19 gesproken wordt."},{"catchword":"in weedom zijn,","tekst":"Het Hebreeuwse woord, dat de profeet hier gebruikt, betekent eigenlijk het wee en de benauwdheid, die een barende vrouw overkomt."},{"catchword":"als men van Tyrus","tekst":"Te weten als men horen zal dat Tyrus, die rijke, machtige stad, die onoverwinnelijk scheen te wezen, zo geheellijk is verwoest en verdelgd. Want alle anderen steden zullen vrezen dat het hun ook alzo zal gaan, denkende: heeft die zeer sterke stad Tyrus niet kunnen bestaan, hoe zal het ons dan gaan? Eenigen vertalen vs.5 aldus: Als het gerucht tot de Egyptenaars [zal gekomen zijn], zij zullen droevig zijn vanwege hetgeen zij van Tyrus horen zullen."}],"6":[{"catchword":"Vaart","tekst":"Dat is, vlucht uit Tyrus, zoekt nieuwe landen en steden, waar gij u moogt nederslaan."},{"catchword":"des eilands","tekst":"Te weten van het land Tyrus, gelijk boven vs.2."}],"7":[{"catchword":"Is dit","tekst":"Van de voortreffelijkheid en zeer grote heerlijkheid van Tyrus, zie Eze 27:3-4 , enz."},{"catchword":"om in vreemdelingschap","tekst":"Of, om haar in vreemdheid te onthouden; dat is, om andere woonplaatsen te gaan zoeken. Toen de Tyriërs uit hun stad en land verdreven waren, hebben zij wat omgezwermd en gelegenheid gezocht waar zij zich best zouden nederslaan, en hebben mettertijd gebouwd de steden Carthago, Leptis, Utica en Gades."}],"8":[{"catchword":"die kronende stad,","tekst":"Of, die kroonster; te weten die stad, die niet alleen zichzelve voor een gekroonde koningin uitgaf, maar ook al hare inwoners en kooplieden met rijkdom en heerlijkheid kroonde, velen derzelven als tot prinsen en vorsten makende."},{"catchword":"handelaars","tekst":"Of, kooplieden. Hebreeuws, Kanaänieten; zie de aantekening Job 40:25 ."},{"catchword":"in het land zijn?","tekst":"Of, op de aarde."}],"9":[{"catchword":"ontheilige","tekst":"Dat is, bezoedele, in verachtzaamheid en tot kleinachting brenge."},{"catchword":"de hovaardij","tekst":"Of, den praal; te weten der voortreffelijke Tyriërs."},{"catchword":"der aarde","tekst":"Anders: van het land."},{"catchword":"verachtelijk","tekst":"Het Hebreeuwse woord betekent eigenlijk ontladen, licht maken, gelijk men de schepen verlicht van hun vracht. Het wordt hier gesteld tegen een woord, hetwelk wij hier vertalen de heerlijkste; maar hetwelk eigenlijk betekent de geladene, doch ook heerlijke."}],"10":[{"catchword":"Ga door","tekst":"Dit is een aanspraak aan de uitlandse kooplieden, of aan de inwoners van Tyrus; aldus: Gaat door uit uw land."},{"catchword":"als een rivier,","tekst":"Dat is, haastelijk, te weten zo snellijk als ene rivier, die van boven afvallende en vlietende in de zee loopt. Anders: als ene rivier, dat is, geduriglijk, zonder ophouden."},{"catchword":"gij dochter","tekst":"Dat is, gijlieden, die op de zee naar Tyrus toezeilt, en gewoon zijt daar te handelen. Eenigen verstaan hier door de dochter van Tharsis, of van het meer, de stad Tyrus, die midden in de zee lag, en daaruit scheen gesproten te zijn, daarin levende, zwevende, en zich onderhoudende."},{"catchword":"er is geen","tekst":"Dat is, Tyrus heeft al haar macht, heerlijkheid en koophandel verloren. Want men gebruikt den riem, of gordel, ten dele tot sieraad, ten dele om de lenden en ruggen te stijven. Zie Job 12:18 , Job 12:21 , en Job 40:2 ; Pro 31:24 met de aantekening. Anderen verstaan hier door den gordel de muren der stad Tyrus, waarmede zij omsingeld en als omgord was."}],"11":[{"catchword":"Hij heeft","tekst":"Te weten de Heere."},{"catchword":"uitgestrekt","tekst":"Te weten om te slaan."},{"catchword":"over de zee,","tekst":"Dat is, over de stad Tyrus in de zee gelegen. Anders, over de schepen der zee, die gewoon zijn te Tyrus te handelen."},{"catchword":"beroerd;","tekst":"Dat is, in roer gesteld, of bewogen tegen Tyrus op te staan."},{"catchword":"heeft bevel gegeven","tekst":"Te weten, den vreemden koninkrijken, of koningen; dat is, God heeft zulks dien volken ingegeven, en Hij drijft hen daartoe, gelijk boven Isa 13:3 , en 2Sa 16:11-12 . Zie de aantekening aldaar."},{"catchword":"tegen Kanaän,","tekst":"Dat is, tegen de Tyriërs, Kanaäns nakomelingen uit Sidon; Gen 10:15 . Anderen: de Heere heeft een koopman bevel gegeven, verstaande, Nebukadnezar, of Alexander de Grote. Anderen, tegen de koopstad. In de betekenis van koopman wordt het woord Kanaän genomen boven vs.8 en elders."}],"12":[{"catchword":"Hij heeft gezegd","tekst":"Te weten de Heere God."},{"catchword":"o gij verdrukte maagd,","tekst":"Anders: o gij verdrukte maagd der dochter Sidons. Aldus noemt de profeet de stad Tyrus, omdat zij van de Sidoniërs eerst gebouwd is. En de profeet noemt hier Tyrus een verdrukte of geschonden maagd, omdat zij voorzeker zou geschonden en verkracht, dat is, verdelgd en uitgeroeid worden."},{"catchword":"Naar Chittim toe,","tekst":"Door deze afgekorte manier van spreken wordt te kennen gegeven dat de Tyriërs zeer haastig zouden vluchten, inzonderheid naar die van Chittim, of het land der Chitteën [want beide kan het Hebreeuwse woord dragen] daaronder verstaande allerlei over zee gelegen plaatsen, als Cilicië, Griekenland, of Macedonië, Italië, enz. waarvan ook boven vs.1."},{"catchword":"ook zult gij","tekst":"Dat is, gij zult aldaar, waar gij heen vlucht, niet gerust zijn, noch in vrede mogen blijven, maar ook geplaagd en verdreven worden. Zie boven vs.7. Anders: Gij Chittim, of Chitteën, maakt u op, trekt voort, enz. nemende het als een goddelijke aanspraak aan Alexander den Grote met zijn krijgsheir, dat hij zich haasten zou, niet alleen om Tyrus te verderven, maar ook verder tegen de Chaldeën en Babel te trekken. Zie boven vs.1."}],"13":[{"catchword":"Ziet,","tekst":"God stelt den Tyriërs voor ogen het exempel van het Assyrische of Chaldeeuwse koninkrijk, als eensdeels ten ondergebracht en verwoest zijnde, anderdeels zullende in het toekomende verwoest worden, opdat het den Tyriërs niet vreemd schijne dat zij ook verwoest zouden worden."},{"catchword":"Assur","tekst":"Dat is, de Chaldeën, die in de wildernissen in tenten plachten te wonen, zijn door de Assyriërs vergaderd en in steden bij elkander gebracht. Zie Gen 10:10-11 , en Gen 11:2 , Gen 11:8-9 , en vergelijk Psa 72:9 , en Psa 74:14 ."},{"catchword":"Hij","tekst":"Te weten God de Heere, van wien gesproken is boven vs.8,9, 11,12."},{"catchword":"heeft het","tekst":"Te weten het land der Chaldeën, of Hij heeft hen, te weten de Chaldeën heeft Hij door de Assyriërs tenonder gebracht, of profetischer wijze: Hij zal de Assyriërs door de Chaldeën of Babyloniërs zekerlijk tenonder brengen, en daarna de Babyloniërs door de Perzen, en vervolgens uwe stad, o Tyrus, en koninkrijk, veel lichter verstoren."},{"catchword":"tot een vervallen hoop","tekst":"Dat is, Hij heeft het ten onderste boven geworpen; vergelijk onder Isa 25:2 ."}],"14":[{"catchword":"ulieder","tekst":"Dat is, de stad Tyrus, met alle vaste plaatsen daaraan en daarbij gelegen."}],"15":[{"catchword":"dat Tyrus","tekst":"Dat is, de Tyriërs zullen zeventig jaar lang in hunne ellende blijven steken; alsof God hunner vergeten had of geen acht meer op hen had."},{"catchword":"zeventig jaren,","tekst":"Te weten zolang als de Joden in de Babylonische gevangenschap blijven zouden."},{"catchword":"gelijk eens konings","tekst":"Dat is, zolang als ongeveer een koning leeft of leven kan. Of, in het algemeen, zolang als een mens leven kan, te weten die tot groten ouderdom komt. Zie Psa 90:10 . Anders: Zolang als een koninkrijk duren zal. Aldus wordt het woord melech, voor koninkrijk ook genomen Dan 7:17 , en Dan 8:21 ; en wordt hier verstaan het koninkrijk van Babel, hetwelk zeventig jaren gestaan heeft na den ondergang van Tyrus."},{"catchword":"zal in Tyrus","tekst":"Dat is, Tyrus zal weder bewoond worden en in goeden welstand komen, en dan zullen de inwoners wederom, rijk en weelderig geworden zijnde, hun ouden gang gaan met zingen en springen, en allerlei wellusten des vleesches te oefenen, gelijk vs.16,17 breder gezegd wordt. Anderen, om het woord als ook zijne kracht te laten toekomen, verklaren deze woorden aldus: De inwoners van Tyrus zullen de kooplieden zo lieflijk weten aan te lokken en te bedriegen, als de hoeren met haar lieflijken zang de hoereerders weten aan te lokken."}],"16":[{"catchword":"gij vergeten","tekst":"Dat is, die in vergetelheid gekomen waart."},{"catchword":"hoer","tekst":"O Tyrus, gij stad vol hoererij, of gij kooplieden van Tyrus, die met uw lieflijken praat en aanbieding der waren de kooplieden weet aan te lokken, gelijk de hoeren hare boelen."},{"catchword":"speel wel,","tekst":"Hebreeuws, maak wel met spelen, of maak het spelen goed. Zie Psa 33:3 ."},{"catchword":"zing veel","tekst":"Hebreeuws, vermenigvuldigt het lied."}],"17":[{"catchword":"hoererij","tekst":"Nagenoeg alle uitleggers verstaan hier door hoererij het vuil gewin der Tyriërs, hetwelk zij van hunne koopmanschap kregen van al de rijke en machtige personen, die in de landen, rondom hen gelegen, woonachtig waren."}],"18":[{"catchword":"koophandel","tekst":"Te weten der Tyriërs."},{"catchword":"heilig zijn,","tekst":"Of, geheiligd zijn. Hebreeuws, in heiligheid zijn."},{"catchword":"het zal niet","tekst":"Hier wordt voorzegd dat enigen der Tyriërs in toekomende tijden tot den waren God en de Christelijke religie bekeerd zijnde, hun goed en rijkdom niet in hunne kisten en kasten zouden besluiten en behouden, maar dat zij die mildelijk ter ere Gods en tot nooddruft der arme Christenen zouden uitdelen. Zie Act 2:44 , en Act 4:34 ."},{"catchword":"die voor den HEERE","tekst":"Versta, de Christenen in het algemeen en bij name de kerkleraars."},{"catchword":"durig","tekst":"Dat is, deksel dat duurzaam is, of dat lang duren kan."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"The burden of Tyrus [The meaning is, this is a heavy prophesy, foretelling what misery shall befall Tyrus. See above chap.13.on vers.1. compare Jer 47:4. with chapters 26,27,28. Zach.9.3,4.] howl ye ships of Tharsis, [that is, ye mariners and Merchants that trade beyond Sea with Tyre. Of Tharsis, see 1 Kings 10.on vers.22.] it is laid wast, [that is, it shall be destroyed. The Prophet uttered this when Tyre was yet in her prime, and greatest glory. And the Prophet threateneth this not onely against the city of Tyre, but also against the whole Island] (so) that there us no house more, (so) that no man entereth in any more; [Hebr. From house, and from coming in, or entering in. Compare below chap.24.10. Some render the words thus; it is destroyed by those of (her own) household, and by the corners in: that is, not onely by strangers, but by her own servants and bond-men, or slaves. For when these saw that their masters power and authority was almost gone and come to ought, they did then combine together, and did murder and kill their own masters, all the free-men assuming the government to themselves, and making one named Strato their King. Justin in his History, Lib.18.] from the land of Chittim it is revealed to them. [that is, it shall be revealed to them (to wit, Marines and Merchants) from the land of Chittim, that is, from Cilicia or Macedonia, (See Genes.chap.10.on vers.4.] from whence the news of Tyres first desolation by Nebuchanezar should be spread abroad, by the fugitives that should from thence pass over into Cilicia, and from whence the destruction should afterward befall them. The meaning of these words is, this desolation shall befall those of Tyre first by King Nebuchanezar, Jer.47. Eze 26:14. and 29.18,19,20. And a long while after by the Greeks and Macedonians, to wit, by Alexander the great, who many years after this took Tyre, and laid it all on an heap."}],"2":[{"catchword":null,"tekst":"Keep silence, ye inhabitants of the Isle, [As if he had said, brag no more of your great riches and glory, they shall soon be at an end (ye inhabitants of the Isle) to wit, of the Isle of Tyre. This city lay in an Island, when Isaiahs prophesied this] thou whom the merchants of Zidon. [this was also a famous city for traffic or trading, lying hard by Tyrus, being under one lords Jurisdiction or Dominion. See Eze 28:21.] passing over the Sea, replenished. [to wit, with all manner of wares and merchandise, which they brought in thither with their ships laden, Heb. The merchant of Zidon passion over the Sea replenished thee.]"}],"3":[{"catchword":null,"tekst":"And whose revenue was the seed. [Here seed is put for flax, which growth from seed] of Sichor [this is the name of a River which parteth Egypt from Canaan, Jos.13.3. See the Annotat. There. Egypt it self is sometimes called Sthor, from this river] upon the great waters, [some understand here by the great waters, the ocean: others, the great rivers of Egypt] waters, the ocean: others, the great rivers of Egypt] waters, the ocean: others, the great rivers of Egypt] the harvest [that is, the corn-fruits] of the river: [that is, the corn which growth by the brooks or rivers, whereby it is watered, when Nilus overfloweth. Others of the brook (of Egypt.) The Prophet intimateth here, that Tyrus grew rich by trading in fruits that grew in other countries] and she was the mart [that the place of trading. See Eze 27:3,12.] of the heathen."}],"4":[{"catchword":null,"tekst":"Be ashamed, O Zidon, [That is, O ye Zidonians. These are the first that built the city of Tyre.] for the Sea [that is, the inhabitants of the Isles that lie in the Sea, as Psal.65.6.] speaketh, (ye the strength meaning the city of Tyrus, which by reason of the Sea, wherein it lay, seemed to be unconquerable] saying, I have not travelled, neither have I brought forth children, neither have I made young men great, [that is, brought them to full and perfect growth (nor brought up virgins. [The meaning is these words is, as if Tyre had said, I that was wont to be so populous, am now in such a condition, as if I were grown quite barren, yea as if I had here had or bred up no children, or inhabitants; I am waxed stark dead, it is at an end with me.]"}],"5":[{"catchword":null,"tekst":"According as the rumour of Egypt hath been, [Understand here that judgement that formerly befell the Egyptians in Moses time, as Exo 15:14. or that judgement of Egypt, whereof mention is made above chap.19.] shall they also in pain, [the Hebrew word which the prophet here useth, signifieth properly the pain and anguish that cometh upon a woman in travail] when they shall hear of Tyre, to wit, when they shall hear that Tyre, that rich and mighty city, which seemed to be unconquerable, is so utterly wasted and destroyed. For all other cities will be afraid that it will happen to them so too, conceiving, that if that strong and mighty city of Tyre could not escape sacking, how then shall it go with us? Some render this verse thus, when the report (shall come) to the Egyptians, they shall be sorry for that which they shall hear of Tyre.]"}],"6":[{"catchword":null,"tekst":"Pass over to Tharsis, [That is, flee out of Tyre, seek new countries and cities, where you may pitch your tents] howl ye inhabitants of the Isle [to wit, of the Isle of Tyre, as above verse 2.]"}],"7":[{"catchword":null,"tekst":"Is this your (city) leaping for joy? [of the excellency and exceedingly great magnificence of Tyre, see Eze 27:3,4, &c.] whose antiquity is (indeed) of ancient days, but here own feet shall carry her afar off, to sojourn [or, to be a sojourner; that is, to go and seek other habitations. When the Tyrians were driven out of their own city and country, then they wandered up and down, and sought a convenient place where they might best pitch their tents, and in time they built the cities of Carthage, Leptus, Utica, and Gades.]"}],"8":[{"catchword":null,"tekst":"Who hath devised this against Tyre that crowning (city) [Or, that she-crowner; to wit, that city, which not onely assumed the title of a crowned Queen, but also crowned all her inhabitants and Merchants with joys and honour, making many of them as Princes, as is hinted in the following words] whose merchants are Princes, whose traffickers, [or, merchants, Heb. Canaanites. See the Annotat. Job chap.40.on ver.25. are the most honourable in the land? [or, on the earth.]"}],"9":[{"catchword":null,"tekst":"The LORD of hosts hath decreed it that he would perform [that is, to stain, to bring into contempt and vilifying] the pride of all ornaments, [or the pomp; to wit, of the stately Tyrians] to make contemptible [the Hebrew word signifieth properly to unlade, to make light, as ships are lightened of the straight or burden which they bear. It is here opposed to a word which is here rendered the most honourable, but which properly signifieth the laden ones, yet withal honourable] all the most honourable of the earth. Others, of the land.]"}],"10":[{"catchword":null,"tekst":"Pass through (to) thy land, [This is a speech directed to the foreign merchants, or to the inhabitants of Tyrus, thus, pass through out of thy land] as a river: [that is, quickly, to wit, as swiftly as a river, that falling, running down from above, runneth into the sea. Others as a river; that is, continually without ceasing] thou daughter of Tharsis, [that is, ye that sail upon the sea u into Tyrus, are wont to trade there. Some understand here by the daughter of Tharsis, or, of the sea, the city of Tyrus which lay in the midst of the sea, and seemed to be spring from thence, yea which also lived, moved, and traded in the sea] there is no more girdle [that is, Tyrus hath lost all her strength, glory, and trading. For a girdle is used partly for ornament, partly to stiffen and strengthen the loins and back. See Job 12:18,21. And 40.2. Pro 31:24. with the Annotat. Others understand here by the girdle the walls of the city of Tyrus, wherewith it was environed and as it were girded about.]"}],"11":[{"catchword":null,"tekst":"Ho [To wit the Lord] stretched out his hand [to wit, for to smite] over the sea; [that is, over the city of Tyrus lying in the sea. Others, over the ships of the sea that are wont to trade at Tyrus] he troubled the kingdoms: [that is, disturbed them, or stirred them up against Tyrus] the LORD hath given command LORD hath given command [to wit, unto the strange kingdoms or kings. That is, God hath infused or inspired it into those nations; and inciteth them to it, as above chap.13.3. and 2 Sam.16.11,12. See the Annotat. There] against Canaan, [that is, against the Tyrians, Canaans posterity by Zidon, Gen 10:15. Others, the Lord hath given command unto a merchant; meaning Nebuchadnezzar, or great Alexander. Others against the merchant city. In the signification of merchant is the word Canaan taken above vers.8. and elsewhere] to destroy the strong holds thereof."}],"12":[{"catchword":null,"tekst":"And he [to wit, the Lord] said, thou shalt no more skip for joy, O thou oppressed virgin, thou daughter of Zidon: [Others, O thou oppressed virgin of the daughter of Zidon: [so the Prophet calleth the city of Tyrus, because it was first built by the Zidonians. And the prophet calleth tyrus here an oppressed or deflowered virgin, because she should be certainly deflowered or ravished, that is, destroyed and cut off] Unto Chittim, [by this abrupt phrase is signified, that the Tyrians should flee in all haste, especially to those of Chittim, or, to the land of the Chittims (for the Hebrew word will bear both) comprehending under it all kind of places lying over sea, as Cilicia, Greece or Macedonia, Italy, &c. Whereof also above ver.1.] get thee up, pass over; there also shalt thou have no rest. [that is, thou shalt neither be able to rest or lie in peace there whither thou fleest, but shalt be plagued and banished, or driven away, See above ver.7.others, Ye Chittim, or, people of Chittim, march on &c. Taking it as a divine oracle or speech made to Alexander the great and His army; that is, should make haste not onely to destroy Tyrus, but also to march on against the Chaldeans and Babel. See above on ver.1.]"}],"13":[{"catchword":null,"tekst":"Behold, the land of the Chaldeans, this people was not, [God setteth before the eyes of the Tyrains the example of the Assyrian or Chaldean Monarchy, as who were already partly subdued and laid waste, and should partly in time to come be laid waste and desolate, that it might not seem strange unto the Tyrians, that they likewise should be wasted and destroyed] Assur founded it for them that dwell in the wildernesses: [that is, the Chaldeans that were wont in the wilderness to dwell in tents, were by the Assyrians assembled and brought together into cities. See Gen.10.ver.10,11. And 11.2,8,9. And compare Psal.72.9. and 74.14.] they set up the strong holds thereof, (and) built the palaces thereof, (but) he [to wit, God, of whom is spoken above ver.8,9,11,12.] made it a ruinous heap. [It, to wit, the land of the Chaldea or, he made them, or, to wit, he subdued the Assyrians by the Chaldeans: or in a Prophetical manner he shall assuredly subdue the Assyrians by the Chaldeans or Babylonians, and shall afterward subdue the Babylonians by the Persians, and shall consequently much easier destroy thy city and kingdom, O Tyrus (he made it a ruinous heap) that is, he turned it upside down. Compare below, chap.25.2.]"}],"14":[{"catchword":null,"tekst":"Howl ye ships of Tharsis, for your strength is destroyed, [That is, the city of Tyrus, with all strong places lying near unto it.]"}],"15":[{"catchword":null,"tekst":"And it shall come to pass in that day, that Tyrus shall be forgotten seventy years, [That is, the Tyrants shall be forgotten seventy years, [That is, the Tyrians shall continue in their misery seventy years, as if so be God had forgotten them, or regarded them no more: (seventy years) to wit, as long as the Jews should continue in the Babylonish captivity] as the days of one King: [that is, as long as a king doth live, or in likelihood may live, or in general, as long as a man may live; to wit, that attaineth to a great age. See Psal.90.10. others as long as our kingdom shall last. Thus the word melech is also taken for kingdom, Dan.7.17. and 8.21. and hereby the same word is meant the kingdom of Babel, which stood seventy years after the ruine and destruction of Tyrus] (but) at the end of seventy years, (there) shall be in Tyrus as an harlots song, [that is, Tyrus shall be inhabited again, and be in good plight or prosperity; and then the inhabitants being grown rich and voluptuous, shall follow again their old course, in singing and dancing and exercising all carnal pleasures and delights, as is further affirmed, ver.16,17. Others, that the particle as may also have its efficacy and virtue, expound these words thus; the inhabitants of Tyrus shall know as plainly to allure and deceive the merchants, as the harlots or whores know to entice and seduce whoremongers by their sweet and pleasant songs.]"}],"16":[{"catchword":null,"tekst":"Take the harp, go round about in the city, thou forgotten [That is, that hast been forgotten, or hast been had in oblivion] harlot, [O Tyrus, thou city full of whoredome: or, the merchants of Tyrus, who with your pleasant talk and smooth commending of your wares know to allure and draw chapmen to you, as harlots do their lovers and followers] play well, [Heb. Make it well with playing, or make the playing good. See Psal.33.on ver.3.] sing many songs, [Heb. Multiply the song] that thou mayest be remembered."}],"17":[{"catchword":null,"tekst":"For it shall come to pass at the end of seventy years that the LORD shall visit Tyrus, and that she shall return to her harlots ways, and she shall commit fornication with all // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');

    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">

function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
