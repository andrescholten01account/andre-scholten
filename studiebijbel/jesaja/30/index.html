:"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Wee de kinderen die afvallen, spreekt de HEERE, om een raadslag te maken, maar niet uit Mij, en om zich met een bedekking te bedekken, maar niet uit Mijn Geest, om zonde tot zonde te doen;","2":"Die gaan om af te trekken naar Egypte, en vragen Mijn mond niet; om zich te sterken met de macht van Farao, en om hun toevlucht te nemen onder de schaduw van Egypte.","3":"Want de sterkte van Farao zal u tot schaamte zijn, en die toevlucht onder de schaduw van Egypte tot schande.","4":"Wanneer zijn vorsten in Zoan zullen zijn geweest, en zijn gezanten tot dichtbij Chanes zullen zijn gekomen;","5":"Hij zal hen allen beschaamd maken door een volk dat hun geen nut kan doen, noch tot hulp, noch tot voordeel, maar tot schande en ook tot smaad zijn zal.","6":"De last van de dieren, van het zuiden, naar het land van angst en van benauwdheid, waar de sterke leeuw en de oude leeuw is, de basilisk en de vurige vliegende draak; hun goederen zullen zij voeren op de rug van de veulens, en hun schatten op de bulten van de kamelen, naar het volk dat hun geen nut zal doen.","7":"Want Egypte zal nutteloos en tevergeefs helpen; daarom heb Ik hierover geroepen: Stilzitten zal hun sterkte zijn.","8":"Nu dan, ga heen, schrijf het voor hen op een tafel, en teken het op in een boek, opdat het blijft tot de laatste dag, voor altijd, tot in eeuwigheid.","9":"Want het is een opstandig volk; het zijn leugenachtige kinderen; kinderen die de wet van de HEERE niet willen horen.","10":"Die tegen de zieners zeggen: Ziet niet; en tegen de schouwers: Schouwt ons niet wat recht is; spreekt tot ons zachte dingen, schouwt ons bedriegerijen.","11":"Wijkt af van de weg, maakt u van het pad; laat de Heilige van Israël van ons ophouden!","12":"Daarom, zo zegt de Heilige van Israël: Omdat u dit woord verwerpt, en vertrouwt op onderdrukking en verkeerdheid, en daarop steunt:","13":"Daarom zal deze misdaad voor u zijn als een vallende scheur, uitwaarts gebogen in een hoge muur, waarvan de breuk snel, in een ogenblik, komen zal.","14":"Ja, Hij zal ze verbreken, zoals een pottenbakkerskruik verbroken wordt; bij het verbrijzelen zal Hij niet verschonen, zodat van haar verbrijzeling niet één scherf gevonden zal worden, om vuur uit de haard te nemen, of om water te scheppen uit een gracht.","15":"Want zo zegt de Heere HEERE, de Heilige van Israël: Door terugkering en rust zou u behouden worden, in stilte en in vertrouwen zou uw sterkte zijn; maar u hebt niet gewild.","16":"En u zegt: Nee, maar op paarden zullen wij vluchten; daarom zult u vluchten! En: Op snelle *paarden* zullen wij rijden; daarom zullen uw vervolgers *ook* snel zijn!","17":"Duizend zullen vluchten voor het schelden van één, voor het schelden van vijf zult u *allen* vluchten; totdat u overgelaten wordt, als een mast op de top van een berg, en als een banier op een heuvel.","18":"En daarom zal de HEERE wachten, opdat Hij u genadig is, en daarom zal Hij verhoogd worden, opdat Hij Zich over u ontfermt, want de HEERE is een God van het gericht; gelukkig zijn zij allen die Hem verwachten.","19":"Want het volk zal in Sion wonen, te Jeruzalem; u zult helemaal niet wenen; zeker zal Hij u genadig zijn op de stem van uw geroep; zodra Hij het horen zal, zal Hij u antwoorden.","20":"De Heere zal u wel brood van de benauwdheid, en water van de verdrukking geven; maar uw leraars zullen niet meer als met vleugels wegvliegen, maar uw ogen zullen uw leraars zien;","21":"En uw oren zullen het woord horen van hem die achter u is, die zegt: Dit is de weg, wandelt daarin; als u zou afwijken naar rechts of naar links.","22":"En u zult voor onrein houden het deksel van uw zilveren gesneden beelden, en het overtreksel van uw gouden gegoten beelden; u zult ze wegwerpen als een maanstondig kleed, en tegen elk daarvan zeggen: Ga weg!","23":"Dan zal Hij uw zaad, waarmee u het land bezaaid hebt, regen geven, en brood van de opbrengst van het land, en dat zal vet en overvloedig zijn; uw vee zal op die dag in een wijde landouwe weiden.","24":"En de ossen, en ezelveulens, die het land bewerken, zullen zuiver voeder eten, dat verschud is met de werpschoffel en met de wan.","25":"En er zullen op elke hoge berg, en op elke hoge heuvel, beekjes en watervlieten zijn, op de dag van de grote slachting, wanneer de torens vallen zullen.","26":"En het licht van de maan zal zijn als het licht van de zon, en het licht van de zon zal zevenvoudig zijn als het licht van zeven dagen; op de dag dat de HEERE de breuk van Zijn volk zal verbinden, en de wond waarmee het geslagen is, genezen.","27":"Ziet, de Naam van de HEERE komt van verre, Zijn toorn brandt, en de last is zwaar; Zijn lippen zijn vol gramschap, en Zijn tong als een verterend vuur;","28":"En Zijn adem is als een overlopende beek, die tot aan de hals toe raakt; om de heidenen te schudden met een schudding van de ijdelheid, en als een misleidende toom in het kinnebakken van de volken.","29":"Er zal een lofzang bij u zijn, zoals in de nacht wanneer het feest geheiligd wordt; en blijdschap van het hart, zoals van iemand die met pijpen wandelt, om te komen tot de berg van de HEERE, tot de Rotssteen van Israël.","30":"En de HEERE zal Zijn heerlijke stem doen horen, en de nederlating van Zijn arm doen zien, met grimmigheid van toorn, en een vlam van verterend vuur, stralen, en een vloed, en hagelstenen.","31":"Want door de stem van de HEERE zal Assur te morzel geslagen worden, hij die met de roede sloeg.","32":"En overal waar die gegrondveste staf doorgegaan zal zijn (waarop de HEERE hem zal hebben doen rusten), daar zal men met trommels en harpen zijn; want met bewegende bestrijdingen zal Hij tegen hen strijden.","33":"Want Tofeth is van oudsher bereid; ja, hij is ook voor de koning bereid; Hij heeft hem diep en wijd gemaakt, het vuur en hout van zijn brandstapel is veel; de adem van de HEERE zal hem aansteken als een zwavelstroom."},"SV":{"1":"Wee den kinderen, die afvallen, spreekt de HEERE, om een raadslag te maken, maar niet uit Mij, en om *zich* met een bedekking te bedekken, maar niet *uit* Mijn Geest, om zonde tot zonde te doen;","2":"Die gaan, om af te trekken in Egypte, en vragen Mijn mond niet; om zich te sterken met de macht van Farao, en om hun toevlucht te nemen onder de schaduw van Egypte.","3":"Want de sterkte van Farao zal ulieden tot schaamte zijn, en die toevlucht onder de schaduw van Egypte tot schande.","4":"Wanneer zijn vorsten zullen geweest zijn tot Zoan, en zijn gezanten zullen gekomen zijn tot nabij Chanes;","5":"Hij zal hen allen beschaamd maken door een volk, dat hun geen nut kan doen, noch tot hulp, noch tot voordeel, maar tot schande en ook tot smaadheid zijn zal.","6":"De last der beesten, van het zuiden, naar het land des angstes, en der benauwdheid, van waar de sterke leeuw en de oude leeuw is, de basilisk en de vurige vliegende draak; hun goederen zullen zij voeren op den rug der veulens, en hun schatten op de bulten der kemelen, tot het volk, *dat* *hun* geen nut zal doen.","7":"Want Egypte zal ijdellijk en te vergeefs helpen; daarom heb Ik hierover geroepen; Stilzitten zal hun sterkte zijn.","8":"Nu *dan*, ga henen, schrijf voor hen op een tafel, en teken het in een boek, opdat het blijve tot den laatsten dag, voor altoos, tot in eeuwigheid.","9":"Want het is een wederspannig volk; het zijn leugenachtige kinderen; kinderen, die des HEEREN wet niet horen willen.","10":"Die daar zeggen tot de zieners: Ziet niet; en tot de schouwers: Schouwt ons niet, wat recht is; spreekt tot ons zachte dingen, schouwt ons bedriegerijen.","11":"Wijkt af van den weg, maakt u van de baan; laat den Heilige Israëls van ons ophouden!","12":"Daarom, zo zegt de Heilige Israëls: Omdat gijlieden dit woord verwerpt, en vertrouwt op onderdrukking en verkeerdheid, en steunt daarop:","13":"Daarom zal ulieden deze misdaad zijn gelijk een vallende scheur, uitwaarts gebogen in een hogen muur, welks breuk haastelijk in een ogenblik komen zal.","14":"Ja, Hij zal ze verbreken, gelijk een pottenbakkerskruik verbroken wordt; in het brijzelen zal Hij niet verschonen; alzo dat van haar verbrijzeling niet een scherf zal gevonden worden, om vuur uit den haard te nemen, of om water te scheppen uit een gracht.","15":"Want alzo zegt de Heere HEERE, de Heilige Israëls: Door wederkering en rust zoudt gijlieden behouden worden, in stilheid en in vertrouwen zou uw sterkte zijn; doch gij hebt niet gewild.","16":"En gij zegt: Neen, maar op paarden zullen wij vlieden; daarom zult gij vlieden! En: Op snelle *paarden* zullen wij rijden; daarom zullen uw vervolgers *ook* snel zijn!","17":"Een duizend van het schelden van enige, van het schelden van vijf zult gij *allen* vlieden; totdat gij overgelaten wordt, gelijk een mast op den top van een berg, en als een banier op een heuvel.","18":"En daarom zal de HEERE wachten, opdat Hij u genadig zij, en daarom zal Hij verhoogd worden, opdat Hij Zich over ulieden ontferme, want de HEERE is een God des gerichts; welgelukzalig zijn die allen, die Hem verwachten.","19":"Want het volk zal in Sion wonen, te Jeruzalem; gij zult ganselijk niet wenen; gewisselijk zal Hij u genadig zijn op de stem uws geroeps; zo haast Hij die horen zal, zal Hij u antwoorden.","20":"De Heere zal ulieden *wel* brood der benauwdheid, en wateren der verdrukking geven; maar uw leraars zullen niet meer als met vleugelen wegvliegen, maar uw ogen zullen uw leraars zien;","21":"En uw oren zullen horen het woord *desgenen*, *die* achter u is, zeggende: Dit is de weg, wandelt in denzelven; als gij zoudt afwijken ter rechter *hand* of ter linkerhand.","22":"En gijlieden zult voor onrein houden het deksel uwer zilveren gesneden beelden, en het overtreksel uwer gouden gegoten beelden; gij zult ze wegwerpen gelijk een maanstondig kleed, en tot elk van die zeggen: Henen uit!","23":"Dan zal Hij uw zaad, waarmede gij het land bezaaid hebt, regen geven, en brood van des lands inkomen, en hetzelve zal vet en smoutig zijn; uw vee zal te dien dage *in* een wijde landouwe weiden.","24":"En de ossen, en ezelveulens, die het land bouwen, zullen zuiver voeder eten, hetwelk verschud is met de werpschoffel en met de wan.","25":"En er zullen op allen hogen berg, en op allen verhevenen heuvel beekjes *en* watervlieten zijn, in den dag der grote slachting, wanneer de torens vallen zullen.","26":"En het licht der maan zal zijn als het licht der zon, en het licht der zon zal zevenvoudig zijn als het licht van zeven dagen; ten dage als de HEERE de breuk Zijns volks zal verbinden, en de wonde, waarmede het geslagen is, genezen.","27":"Ziet, de Naam des HEEREN komt van verre, Zijn toorn brandt, en de last is zwaar; Zijn lippen zijn vol gramschap, en Zijn tong, als een verterend vuur;","28":"En Zijn adem is als een overlopende beek, *die* tot aan den hals toe raakt; om de heidenen te schudden met een schudding der ijdelheid, en als een misleidende toom in de kinnebakkens der volken.","29":"Er zal een lofzang bij ulieden zijn, gelijk in den nacht, wanneer het feest geheiligd wordt; en blijdschap des harten, gelijk van een, die met pijpen wandelt, om te komen tot den berg des HEEREN, tot den Rotssteen van Israël.","30":"En de HEERE zal Zijn heerlijke stem doen horen, en de nederlating Zijns arms doen zien, met grimmigheid van toorn, en een vlam van verterend vuur, stralen, en een vloed, en hagelstenen.","31":"Want door de stem des HEEREN zal Assur te morzel geslagen worden, *die* met de roede sloeg.","32":"En alwaar die gegrondveste staf doorgegaan zal zijn (op welken de HEERE dien zal hebben doen rusten), *daar* zal men met trommelen en harpen zijn; want met bewegende bestrijdingen zal Hij tegen hen strijden.","33":"Want Tofeth is van gisteren bereid; *ja*, hij is ook voor den koning bereid; Hij heeft hem diep *en* wijd gemaakt, het vuur en hout van zijn brandstapel is veel; de adem des HEEREN zal hem aansteken als een zwavelstroom."},"KJV":{"1":"Woe to the rebellious children, saith the LORD, that take counsel, but not of me; and that cover with a covering, but not of my spirit, that they may add sin to sin:","2":"That walk to go down into Egypt, and have not asked at my mouth; to strengthen themselves in the strength of Pharaoh, and to trust in the shadow of Egypt!","3":"Therefore shall the strength of Pharaoh be your shame, and the trust in the shadow of Egypt *your* confusion.","4":"For his princes were at Zoan, and his ambassadors came to Hanes.","5":"They were all ashamed of a people *that* could not profit them, nor be an help nor profit, but a shame, and also a reproach.","6":"The burden of the beasts of the south: into the land of trouble and anguish, from whence *come* the young and old lion, the viper and fiery flying serpent, they will carry their riches upon the shoulders of young asses, and their treasures upon the bunches of camels, to a people *that* shall not profit","7":"For the Egyptians shall help in vain, and to no purpose: therefore have I cried concerning this, Their strength *is* to sit still.","8":"Now go, write it before them in a table, and note it in a book, that it may be for the time to come for ever and ever:","9":"That this *is* a rebellious people, lying children, children *that* will not hear the law of the LORD:","10":"Which say to the seers, See not; and to the prophets, Prophesy not unto us right things, speak unto us smooth things, prophesy deceits:","11":"Get you out of the way, turn aside out of the path, cause the Holy One of Israel to cease from before","12":"Wherefore thus saith the Holy One of Israel, Because ye despise this word, and trust in oppression and perverseness, and stay","13":"Therefore this iniquity shall be to you as a breach ready to fall, swelling out in a high wall, whose breaking cometh suddenly at an instant.","14":"And he shall break it as the breaking of the potters' vessel that is broken in pieces; he shall not spare: so that there shall not be found in the bursting of it a sherd to take fire from the hearth, or to take water *withal* out of the pit.","15":"For thus saith the Lord GOD, the Holy One of Israel; In returning and rest shall ye be saved; in quietness and in confidence shall be your strength: and ye would","16":"But ye said, No; for we will flee upon horses; therefore shall ye flee: and, We will ride upon the swift; therefore shall they that pursue you be swift.","17":"One thousand *shall flee* at the rebuke of one; at the rebuke of five shall ye flee: till ye be left as a beacon upon the top of a mountain, and as an ensign on an hill.","18":"And therefore will the LORD wait, that he may be gracious unto you, and therefore will he be exalted, that he may have mercy upon you: for the LORD *is* a God of judgment: blessed *are* all they that wait","19":"For the people shall dwell in Zion at Jerusalem: thou shalt weep no more: he will be very gracious unto thee at the voice of thy cry; when he shall hear it, he will answer","20":"And *though* the Lord give you the bread of adversity, and the water of affliction, yet shall not thy teachers be removed into a corner any more, but thine eyes shall see thy teachers:","21":"And thine ears shall hear a word behind thee, saying, This *is* the way, walk ye in it, when ye turn to the right hand, and when ye turn to the left.","22":"Ye shall defile also the covering of thy graven images of silver, and the ornament of thy molten images of gold: thou shalt cast them away as a menstruous cloth; thou shalt say unto it, Get thee hence.","23":"Then shall he give the rain of thy seed, that thou shalt sow the ground withal; and bread of the increase of the earth, and it shall be fat and plenteous: in that day shall thy cattle feed in large pastures.","24":"The oxen likewise and the young asses that ear the ground shall eat clean provender, which hath been winnowed with the shovel and with the fan.","25":"And there shall be upon every high mountain, and upon every high hill, rivers *and* streams of waters in the day of the great slaughter, when the towers fall.","26":"Moreover the light of the moon shall be as the light of the sun, and the light of the sun shall be sevenfold, as the light of seven days, in the day that the LORD bindeth up the breach of his people, and healeth the stroke of their wound.","27":"Behold, the name of the LORD cometh from far, burning *with* his anger, and the burden *thereof is* heavy: his lips are full of indignation, and his tongue as a devouring fire:","28":"And his breath, as an overflowing stream, shall reach to the midst of the neck, to sift the nations with the sieve of vanity: and *there shall be* a bridle in the jaws of the people, causing *them* to err.","29":"Ye shall have a song, as in the night *when* a holy solemnity is kept; and gladness of heart, as when one goeth with a pipe to come into the mountain of the LORD, to the mighty One of Israel.","30":"And the LORD shall cause his glorious voice to be heard, and shall shew the lighting down of his arm, with the indignation of *his* anger, and *with* the flame of a devouring fire, *with* scattering, and tempest, and hailstones.","31":"For through the voice of the LORD shall the Assyrian be beaten down, *which* smote with a rod.","32":"And *in* every place where the grounded staff shall pass, which the LORD shall lay upon him, *it* shall be with tabrets and harps: and in battles of shaking will he fight","33":"For Tophet *is* ordained of old; yea, for the king it is prepared; he hath made *it* deep *and* large: the pile thereof *is* fire and much wood; the breath of the LORD, like a stream of brimstone, doth kindle"}},"tsk":{"1":[{"kopje":"de kinderen die afvallen","refs":["Jes 30:9","Jes they will <span class=\"wl wl-kjv\" data-code=\"H5375\">carry</span> their <span class=\"wl wl-kjv\" data-code=\"H2428\">riches</span> upon the <span class=\"wl wl-kjv\" data-code=\"H3802\">shoulders</span> of young <span class=\"wl wl-kjv\" data-code=\"H5895\">asses,</span> and their <span class=\"wl wl-kjv\" data-code=\"H214\">treasures</span> upon the <span class=\"wl wl-kjv\" data-code=\"H1707\">bunches</span> of <span class=\"wl wl-kjv\" data-code=\"H1581\">camels,</span> to a <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that shall not profit","7":"For the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians</span> shall <span class=\"wl wl-kjv\" data-code=\"H5826\">help</span> in <span class=\"wl wl-kjv\" data-code=\"H1892\">vain,</span> and to no <span class=\"wl wl-kjv\" data-code=\"H7385\">purpose:</span> therefore have I <span class=\"wl wl-kjv\" data-code=\"H7121\">cried</span> concerning <span class=\"wl wl-kjv\" data-code=\"H2063\">this,</span> <span class=\"wl wl-kjv\" data-code=\"H1992\">Their</span> <span class=\"wl wl-kjv\" data-code=\"H7293\">strength</span> is to sit still.","8":"Now <span class=\"wl wl-kjv\" data-code=\"H935\">go,</span> <span class=\"wl wl-kjv\" data-code=\"H3789\">write</span> it before them in a <span class=\"wl wl-kjv\" data-code=\"H3871\">table,</span> and <span class=\"wl wl-kjv\" data-code=\"H2710\">note</span> it in a <span class=\"wl wl-kjv\" data-code=\"H5612\">book,</span> that it may be for the <span class=\"wl wl-kjv\" data-code=\"H3117\">time</span> to <span class=\"wl wl-kjv\" data-code=\"H314\">come</span> <span class=\"wl wl-kjv\" data-code=\"H5704\">for</span> <span class=\"wl wl-kjv\" data-code=\"H5703\">ever</span> and ever:","9":"That this is a <span class=\"wl wl-kjv\" data-code=\"H4805\">rebellious</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> <span class=\"wl wl-kjv\" data-code=\"H3586\">lying</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">children,</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> that <span class=\"wl wl-kjv\" data-code=\"H14\">will</span> not <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> the <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> of the LORD:","10":"Which <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> to the <span class=\"wl wl-kjv\" data-code=\"H7200\">seers,</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">See</span> not; and to the <span class=\"wl wl-kjv\" data-code=\"H2374\">prophets,</span> <span class=\"wl wl-kjv\" data-code=\"H2372\">Prophesy</span> not unto us right <span class=\"wl wl-kjv\" data-code=\"H5229\">things,</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> unto us smooth <span class=\"wl wl-kjv\" data-code=\"H2513\">things,</span> <span class=\"wl wl-kjv\" data-code=\"H2372\">prophesy</span> deceits:","11":"Get you <span class=\"wl wl-kjv\" data-code=\"H5493\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> turn <span class=\"wl wl-kjv\" data-code=\"H5186\">aside</span> out of the <span class=\"wl wl-kjv\" data-code=\"H734\">path,</span> cause the Holy <span class=\"wl wl-kjv\" data-code=\"H6918\">One</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> to <span class=\"wl wl-kjv\" data-code=\"H7673\">cease</span> from before","12":"Wherefore thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the Holy <span class=\"wl wl-kjv\" data-code=\"H6918\">One</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> Because ye <span class=\"wl wl-kjv\" data-code=\"H3988\">despise</span> this <span class=\"wl wl-kjv\" data-code=\"H1697\">word,</span> and <span class=\"wl wl-kjv\" data-code=\"H982\">trust</span> in <span class=\"wl wl-kjv\" data-code=\"H6233\">oppression</span> and <span class=\"wl wl-kjv\" data-code=\"H3868\">perverseness,</span> and stay","13":"Therefore this <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity</span> shall be to you as a <span class=\"wl wl-kjv\" data-code=\"H6556\">breach</span> ready to <span class=\"wl wl-kjv\" data-code=\"H5307\">fall,</span> swelling <span class=\"wl wl-kjv\" data-code=\"H1158\">out</span> in a <span class=\"wl wl-kjv\" data-code=\"H7682\">high</span> <span class=\"wl wl-kjv\" data-code=\"H2346\">wall,</span> whose <span class=\"wl wl-kjv\" data-code=\"H7667\">breaking</span> <span class=\"wl wl-kjv\" data-code=\"H935\">cometh</span> <span class=\"wl wl-kjv\" data-code=\"H6597\">suddenly</span> at an instant.","14":"And he shall <span class=\"wl wl-kjv\" data-code=\"H7665\">break</span> it as the <span class=\"wl wl-kjv\" data-code=\"H7667\">breaking</span> of the <span class=\"wl wl-kjv\" data-code=\"H3335\">potters'</span> <span class=\"wl wl-kjv\" data-code=\"H5035\">vessel</span> that is broken in <span class=\"wl wl-kjv\" data-code=\"H3807\">pieces;</span> he shall not <span class=\"wl wl-kjv\" data-code=\"H2550\">spare:</span> so that there shall not be <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> in the <span class=\"wl wl-kjv\" data-code=\"H4386\">bursting</span> of it a <span class=\"wl wl-kjv\" data-code=\"H2789\">sherd</span> to <span class=\"wl wl-kjv\" data-code=\"H2846\">take</span> <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> from the <span class=\"wl wl-kjv\" data-code=\"H3344\">hearth,</span> or to <span class=\"wl wl-kjv\" data-code=\"H2834\">take</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> withal out of the pit.","15":"For thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD,</span> the Holy <span class=\"wl wl-kjv\" data-code=\"H6918\">One</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> In <span class=\"wl wl-kjv\" data-code=\"H7729\">returning</span> and <span class=\"wl wl-kjv\" data-code=\"H5183\">rest</span> shall ye be <span class=\"wl wl-kjv\" data-code=\"H3467\">saved;</span> in <span class=\"wl wl-kjv\" data-code=\"H8252\">quietness</span> and in <span class=\"wl wl-kjv\" data-code=\"H985\">confidence</span> shall be your <span class=\"wl wl-kjv\" data-code=\"H1369\">strength:</span> and ye would","16":"But ye <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> No; for we will <span class=\"wl wl-kjv\" data-code=\"H5127\">flee</span> upon <span class=\"wl wl-kjv\" data-code=\"H5483\">horses;</span> therefore shall ye <span class=\"wl wl-kjv\" data-code=\"H5127\">flee:</span> and, We will <span class=\"wl wl-kjv\" data-code=\"H7392\">ride</span> upon the <span class=\"wl wl-kjv\" data-code=\"H7031\">swift;</span> therefore shall they that <span class=\"wl wl-kjv\" data-code=\"H7291\">pursue</span> you be swift.","17":"<span class=\"wl wl-kjv\" data-code=\"H259\">One</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> shall flee <span class=\"wl wl-kjv\" data-code=\"H6440\">at</span> the <span class=\"wl wl-kjv\" data-code=\"H1606\">rebuke</span> of <span class=\"wl wl-kjv\" data-code=\"H259\">one;</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">at</span> the <span class=\"wl wl-kjv\" data-code=\"H1606\">rebuke</span> of <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> shall ye <span class=\"wl wl-kjv\" data-code=\"H5127\">flee:</span> till ye be <span class=\"wl wl-kjv\" data-code=\"H3498\">left</span> as a <span class=\"wl wl-kjv\" data-code=\"H8650\">beacon</span> upon the <span class=\"wl wl-kjv\" data-code=\"H7218\">top</span> of a <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain,</span> and as an <span class=\"wl wl-kjv\" data-code=\"H5251\">ensign</span> on an hill.","18":"And therefore will the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2442\">wait,</span> that he may be <span class=\"wl wl-kjv\" data-code=\"H2603\">gracious</span> unto you, and therefore will he be <span class=\"wl wl-kjv\" data-code=\"H7311\">exalted,</span> that he may have <span class=\"wl wl-kjv\" data-code=\"H7355\">mercy</span> upon you: for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is a <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment:</span> <span class=\"wl wl-kjv\" data-code=\"H835\">blessed</span> are all they that wait","19":"For the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> shall <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> in <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion</span> at <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem:</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H1058\">weep</span> no <span class=\"wl wl-kjv\" data-code=\"H1058\">more:</span> he will be <span class=\"wl wl-kjv\" data-code=\"H2603\">very</span> <span class=\"wl wl-kjv\" data-code=\"H2603\">gracious</span> unto thee at the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of thy <span class=\"wl wl-kjv\" data-code=\"H2199\">cry;</span> when he shall <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> it, he will answer","20":"And though the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> you the <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> of <span class=\"wl wl-kjv\" data-code=\"H6862\">adversity,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> of <span class=\"wl wl-kjv\" data-code=\"H3906\">affliction,</span> yet shall not thy <span class=\"wl wl-kjv\" data-code=\"H3384\">teachers</span> be removed into a <span class=\"wl wl-kjv\" data-code=\"H3670\">corner</span> any more, but thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> shall <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> thy teachers:","21":"And thine <span class=\"wl wl-kjv\" data-code=\"H241\">ears</span> shall <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> a <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> <span class=\"wl wl-kjv\" data-code=\"H310\">behind</span> thee, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> This is the <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> walk ye in <span class=\"wl wl-kjv\" data-code=\"H3212\">it,</span> when ye turn to the right <span class=\"wl wl-kjv\" data-code=\"H541\">hand,</span> and when ye turn to the left.","22":"Ye shall <span class=\"wl wl-kjv\" data-code=\"H2930\">defile</span> also the <span class=\"wl wl-kjv\" data-code=\"H6826\">covering</span> of thy graven <span class=\"wl wl-kjv\" data-code=\"H6456\">images</span> of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> and the <span class=\"wl wl-kjv\" data-code=\"H642\">ornament</span> of thy molten <span class=\"wl wl-kjv\" data-code=\"H4541\">images</span> of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold:</span> thou shalt cast them <span class=\"wl wl-kjv\" data-code=\"H2219\">away</span> as a menstruous <span class=\"wl wl-kjv\" data-code=\"H1739\">cloth;</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto it, Get thee hence.","23":"Then shall he <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> the <span class=\"wl wl-kjv\" data-code=\"H4306\">rain</span> of thy <span class=\"wl wl-kjv\" data-code=\"H2233\">seed,</span> that thou shalt <span class=\"wl wl-kjv\" data-code=\"H2232\">sow</span> the <span class=\"wl wl-kjv\" data-code=\"H127\">ground</span> withal; and <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> of the <span class=\"wl wl-kjv\" data-code=\"H8393\">increase</span> of the <span class=\"wl wl-kjv\" data-code=\"H127\">earth,</span> and it shall be <span class=\"wl wl-kjv\" data-code=\"H1879\">fat</span> and <span class=\"wl wl-kjv\" data-code=\"H8082\">plenteous:</span> in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> shall thy <span class=\"wl wl-kjv\" data-code=\"H4735\">cattle</span> <span class=\"wl wl-kjv\" data-code=\"H7462\">feed</span> in <span class=\"wl wl-kjv\" data-code=\"H7337\">large</span> pastures.","24":"The <span class=\"wl wl-kjv\" data-code=\"H504\">oxen</span> likewise and the young <span class=\"wl wl-kjv\" data-code=\"H5895\">asses</span> that <span class=\"wl wl-kjv\" data-code=\"H5647\">ear</span> the <span class=\"wl wl-kjv\" data-code=\"H127\">ground</span> shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> <span class=\"wl wl-kjv\" data-code=\"H2548\">clean</span> <span class=\"wl wl-kjv\" data-code=\"H1098\">provender,</span> which hath been <span class=\"wl wl-kjv\" data-code=\"H2219\">winnowed</span> with the <span class=\"wl wl-kjv\" data-code=\"H7371\">shovel</span> and with the fan.","25":"And there shall be upon every <span class=\"wl wl-kjv\" data-code=\"H1364\">high</span> <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain,</span> and upon every <span class=\"wl wl-kjv\" data-code=\"H5375\">high</span> <span class=\"wl wl-kjv\" data-code=\"H1389\">hill,</span> <span class=\"wl wl-kjv\" data-code=\"H6388\">rivers</span> and <span class=\"wl wl-kjv\" data-code=\"H2988\">streams</span> of <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of the <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> <span class=\"wl wl-kjv\" data-code=\"H2027\">slaughter,</span> when the <span class=\"wl wl-kjv\" data-code=\"H4026\">towers</span> fall.","26":"Moreover the <span class=\"wl wl-kjv\" data-code=\"H216\">light</span> of the <span class=\"wl wl-kjv\" data-code=\"H3842\">moon</span> shall be as the <span class=\"wl wl-kjv\" data-code=\"H216\">light</span> of the <span class=\"wl wl-kjv\" data-code=\"H2535\">sun,</span> and the <span class=\"wl wl-kjv\" data-code=\"H216\">light</span> of the <span class=\"wl wl-kjv\" data-code=\"H2535\">sun</span> shall be <span class=\"wl wl-kjv\" data-code=\"H7659\">sevenfold,</span> as the <span class=\"wl wl-kjv\" data-code=\"H216\">light</span> of <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days,</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> bindeth <span class=\"wl wl-kjv\" data-code=\"H2280\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H7667\">breach</span> of his <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and <span class=\"wl wl-kjv\" data-code=\"H7495\">healeth</span> the <span class=\"wl wl-kjv\" data-code=\"H4273\">stroke</span> of their wound.","27":"Behold, the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H935\">cometh</span> from <span class=\"wl wl-kjv\" data-code=\"H4801\">far,</span> <span class=\"wl wl-kjv\" data-code=\"H1197\">burning</span> with his <span class=\"wl wl-kjv\" data-code=\"H639\">anger,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4858\">burden</span> thereof is <span class=\"wl wl-kjv\" data-code=\"H3514\">heavy:</span> his <span class=\"wl wl-kjv\" data-code=\"H8193\">lips</span> are <span class=\"wl wl-kjv\" data-code=\"H4390\">full</span> of <span class=\"wl wl-kjv\" data-code=\"H2195\">indignation,</span> and his <span class=\"wl wl-kjv\" data-code=\"H3956\">tongue</span> as a <span class=\"wl wl-kjv\" data-code=\"H398\">devouring</span> fire:","28":"And his <span class=\"wl wl-kjv\" data-code=\"H7307\">breath,</span> as an <span class=\"wl wl-kjv\" data-code=\"H7857\">overflowing</span> <span class=\"wl wl-kjv\" data-code=\"H5158\">stream,</span> shall reach to the <span class=\"wl wl-kjv\" data-code=\"H2673\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H6677\">neck,</span> to <span class=\"wl wl-kjv\" data-code=\"H5130\">sift</span> the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> with the <span class=\"wl wl-kjv\" data-code=\"H5299\">sieve</span> of <span class=\"wl wl-kjv\" data-code=\"H7723\">vanity:</span> and there shall be a <span class=\"wl wl-kjv\" data-code=\"H7448\">bridle</span> in the <span class=\"wl wl-kjv\" data-code=\"H3895\">jaws</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> causing them to err.","29":"Ye shall have a <span class=\"wl wl-kjv\" data-code=\"H7892\">song,</span> as in the <span class=\"wl wl-kjv\" data-code=\"H3915\">night</span> when a <span class=\"wl wl-kjv\" data-code=\"H6942\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H2282\">solemnity</span> is <span class=\"wl wl-kjv\" data-code=\"H6942\">kept;</span> and <span class=\"wl wl-kjv\" data-code=\"H8057\">gladness</span> of <span class=\"wl wl-kjv\" data-code=\"H3824\">heart,</span> as when one <span class=\"wl wl-kjv\" data-code=\"H1980\">goeth</span> with a <span class=\"wl wl-kjv\" data-code=\"H2485\">pipe</span> to <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> into the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> to the mighty <span class=\"wl wl-kjv\" data-code=\"H6697\">One</span> of Israel.","30":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall cause his <span class=\"wl wl-kjv\" data-code=\"H1935\">glorious</span> <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> to be <span class=\"wl wl-kjv\" data-code=\"H8085\">heard,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H7200\">shew</span> the lighting <span class=\"wl wl-kjv\" data-code=\"H5183\">down</span> of his <span class=\"wl wl-kjv\" data-code=\"H2220\">arm,</span> with the <span class=\"wl wl-kjv\" data-code=\"H2197\">indignation</span> of his <span class=\"wl wl-kjv\" data-code=\"H639\">anger,</span> and with the <span class=\"wl wl-kjv\" data-code=\"H3851\">flame</span> of a <span class=\"wl wl-kjv\" data-code=\"H398\">devouring</span> <span class=\"wl wl-kjv\" data-code=\"H784\">fire,</span> with <span class=\"wl wl-kjv\" data-code=\"H5311\">scattering,</span> and <span class=\"wl wl-kjv\" data-code=\"H2230\">tempest,</span> and <span class=\"wl wl-kjv\" data-code=\"H68\">hailstones.</span>","31":"For through the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall the <span class=\"wl wl-kjv\" data-code=\"H804\">Assyrian</span> be beaten <span class=\"wl wl-kjv\" data-code=\"H2865\">down,</span> which <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> with a rod.","32":"And in every <span class=\"wl wl-kjv\" data-code=\"H3605\">place</span> where the <span class=\"wl wl-kjv\" data-code=\"H4145\">grounded</span> <span class=\"wl wl-kjv\" data-code=\"H4294\">staff</span> shall <span class=\"wl wl-kjv\" data-code=\"H4569\">pass,</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H5117\">lay</span> upon him, it shall be with <span class=\"wl wl-kjv\" data-code=\"H8596\">tabrets</span> and <span class=\"wl wl-kjv\" data-code=\"H3658\">harps:</span> and in <span class=\"wl wl-kjv\" data-code=\"H4421\">battles</span> of <span class=\"wl wl-kjv\" data-code=\"H8573\">shaking</span> will he fight","33":"For <span class=\"wl wl-kjv\" data-code=\"H8613\">Tophet</span> is <span class=\"wl wl-kjv\" data-code=\"H6186\">ordained</span> of <span class=\"wl wl-kjv\" data-code=\"H865\">old;</span> yea, for the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> it is <span class=\"wl wl-kjv\" data-code=\"H3559\">prepared;</span> he hath made it <span class=\"wl wl-kjv\" data-code=\"H6009\">deep</span> and <span class=\"wl wl-kjv\" data-code=\"H7337\">large:</span> the <span class=\"wl wl-kjv\" data-code=\"H4071\">pile</span> thereof is <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> and <span class=\"wl wl-kjv\" data-code=\"H7235\">much</span> <span class=\"wl wl-kjv\" data-code=\"H6086\">wood;</span> the <span class=\"wl wl-kjv\" data-code=\"H5397\">breath</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> like a <span class=\"wl wl-kjv\" data-code=\"H5158\">stream</span> of <span class=\"wl wl-kjv\" data-code=\"H1614\">brimstone,</span> doth kindle"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"den kinderen,","tekst":"Versta, de boze en onstendige burgers binnen Jeruzalem."},{"catchword":"om een raadslag","tekst":"Om een verbond op te richten met den koning van Egypte [gelijk vs.2], tegen den koning van Babel, nadat deze koning hen onder zijne heerschappij gebracht had."},{"catchword":"maar niet","tekst":"Mij geen raad gevraagd hebbende, maar hun eigen gedachte of goeddunken volgende."},{"catchword":"een bedekking","tekst":"Aldus noemt hij de beschutting van den koning van Egypte."},{"catchword":"niet uit Mijn Geest,","tekst":"Dat is, niet door ingeven mijns Geestes."},{"catchword":"om zonde tot zonde","tekst":"Namelijk de zonde van vertrouwen op menselijke hulp, tot de zonde der meinedigheid in het afwijken van den koning te Babel. Zie Eze 17:13-15 ; of de zonde van God te verlaten en op mensen te betrouwen; vergelijk Jer 2:13 ."}],"2":[{"catchword":"Die gaan,","tekst":"Hoe de koningen van Juda hunne gezanten naar Egypte gezonden hebben om een verbond met den koning aldaar te maken, zie Jer 2:18 , en Jer 37:7 ; Eze 17:15 ."},{"catchword":"vragen","tekst":"Te weten, noch door de profeten, noch door den hogepriester."},{"catchword":"onder de schaduw","tekst":"Dat is, onder de bescherming. In plaats van deze manier van spreken, staat er Rth 2:12 , onder de vleugelen."}],"4":[{"catchword":"zijn vorsten","tekst":"Te weten, van den koning van Juda; zie Eze 17:15 ; anders: hunne vorsten, te weten van het Joodse volk."},{"catchword":"Zoan","tekst":"Dit zijn de steden in Egypte gelegen. Zie de aantekening Num 13:22 ; Psa 78:12 . Chanes is Dafne; zie Jer 2:16 , en Jer 43:7 ."},{"catchword":"gezanten","tekst":"Of, boden."}],"5":[{"catchword":"Hij zal hen","tekst":"Te weten God, of de koning van Egypte."},{"catchword":"allen","tekst":"Te weten allen die van Jeruzalem, zo de gezanten als de onderzaten."},{"catchword":"beschaamd","tekst":"Dat is, verachtzaam. Anders: Hij zal hen allen stinkende maken; te weten de Egyptenaars; zie Jer 37:7 ."}],"6":[{"catchword":"last der beesten,","tekst":"Dat is, de profetie tegen de Joden, aangaande de kemelen of andere lastdragende beesten, welke zij naar Egypte zonden, met geschenken beladen om van den koning in Egypte hulp te verzoeken tegen de Chaldeën."},{"catchword":"van het zuiden,","tekst":"Dat is, naar Egypte; aldus genoemd omdat het zuidelijk van het Joodse land ligt."},{"catchword":"naar het land","tekst":"Aldus wordt Egypte genoemd of beschreven, omdat den Joden eertijds aldaar veel angst en benauwdheid was overkomen en nog overkomen zou dengenen, die daar hulp en troost verzochten."},{"catchword":"leeuw . . .de basilisk . . .de vurige vliegende draak","tekst":"Zulke schadelijke, vergiftige, verscheurende dieren worden er in Egypte veel gevonden. Eenigen verstaan bij deze dieren de krijgslieden uit Egypte, van wie de Joden niets dan schade en verderf te verwachten hadden."},{"catchword":"zij hun goederen","tekst":"Te weten de afgezanten der Joden, die den koning in Egypte grote geschenken brachten."},{"catchword":"tot het volk,","tekst":"Dat is, tot de Egyptenaars, gelijk vs.5."}],"7":[{"catchword":"Egypte","tekst":"Dat is, de hulp der Egyptenaars zal ijdel en tevergeefs zijn."},{"catchword":"hun sterkte zijn","tekst":"Te weten der Joden; vergelijk onder vs.15. Hebreeuws, Rahabhem schabet , welke woorden anderen aldus vertalen: Rahab is ophouding, of Rahab zal ophouden; dat is, Egypte zal stilzitten of ophouden, dat is, het zal geen hulp meer bewijzen. Zie Jer 37:7 . Egypte wordt meermalen van de profeten Rahab genoemd, gelijk Isa 51:9 , en Psa 87:4 ; zie de aantekening aldaar."}],"8":[{"catchword":"Nu dan,","tekst":"Dit zijn de woorden des Heeren tot den profeet."},{"catchword":"schrijf","tekst":"Te weten tot een getuigenis tegen hen; vergelijk dit met Deu 31:19 en Isa 8:1 ."},{"catchword":"voor hen","tekst":"Of, bij hen, te weten de burgers van Jeruzalem."},{"catchword":"blijve","tekst":"Hebreeuws, zij. Zie Psa 37:18 ."},{"catchword":"tot den laatsten dag,","tekst":"Of, tot den toekomenden dag."}],"9":[{"catchword":"een wederspannig volk;","tekst":"Dat is, een volk, dat elke reis van den Heere afvalt en tegen Hem opstaat."},{"catchword":"wet","tekst":"Of, leer."}],"10":[{"catchword":"tot de zieners","tekst":"Dat is, tot de profeten. Zie 1Sa 9:9 ."},{"catchword":"Ziet niet;","tekst":"Dat is, profeteert niet, alsof zij zeiden: Ofschoon u God iets openbaart, zo verkondigt het niet, maar verzwijgt het, alsof gij het niet gezien noch gehoord hadt."},{"catchword":"de schouwers","tekst":"Of, bezichtigers, dat is profeten."},{"catchword":"spreekt","tekst":"Alsof zij zeiden: Maar predikt ons wat lieflijk en aangenaam is."},{"catchword":"bedriegerijen","tekst":"Of, bespottingen."}],"11":[{"catchword":"van den weg,","tekst":"Dat is, van uw ambt en beroeping."},{"catchword":"laat den Heilige","tekst":"Dat is, spreekt ons niet meer van het woord en de bedreigingen des Heeren."}],"12":[{"catchword":"dit woord","tekst":"Dat is, deze profetie, hetgeen Ik ulieden door mijnen profeet laat verkondigen, belangende de hulp der Egyptenaars, die hij u afraadt."},{"catchword":"op onderdrukking","tekst":"Dat is, op uwe kwade werken, strekkende tot onderdrukking der armen en onnozelen. Anders: op onderdrukking; te weten der profeten, die u ten beste raden; zie Jer 20:2 , en Jer 26:11 , en Jer 37:15-16 ."},{"catchword":"daarop","tekst":"Te weten, op de onderdrukkingen."}],"13":[{"catchword":"gelijk","tekst":"De zin is: Uwe zonden zullen oorzaak zijn van uw schielijken ondergang, gelijk een muur, die vol spleten en reten is, en die uitgebroken is, lichtelijk instort en nedervalt. Vergelijk Psa 62:4 , en de aantekening aldaar."}],"14":[{"catchword":"Hij","tekst":"Te weten de Heere, of de vijand."},{"catchword":"zal ze verbreken,","tekst":"Te weten Jeruzalem en de andere steden van Juda, ja ook de gehele natie der Joden, den geestelijken en den wereldlijken stand."},{"catchword":"gelijk","tekst":"Hebreeuws, naar de verbreking der fles eens pottenbakkers."},{"catchword":"in het brijzelen","tekst":"Dat is, men zal hen geheel verbrijzelen, dat er niets geheels aan blijven zal. Vergelijk Jer 19:11 ."},{"catchword":"van haar verbrijzeling","tekst":"Dat is, uit haar gebroken stukken."},{"catchword":"gracht","tekst":"Of, greb, put, poel."}],"15":[{"catchword":"Door wederkering","tekst":"Dat is, indien gijlieden wederkeert, of afstand deedt, te weten van uw goddeloos leven en voornemen van hulp te gaan zoeken in Egypte, in geduldigheid uwe zielen bezittende en op God hopende. Zie boven Jer 30:7 ."},{"catchword":"behouden worden,","tekst":"Of, verlost worden."},{"catchword":"vertrouwen","tekst":"Te weten op God."},{"catchword":"gij hebt","tekst":"Dat is, gij hebt dezen raad niet willen gehoorzamen."}],"16":[{"catchword":"zullen wij vlieden;","tekst":"Te weten, als de Babyloniërs ons te sterk vallen. Anders: vlieden; dat is hier en daar omlopen, zolang totdat wij hulp vinden."},{"catchword":"daarom zult gij vlieden","tekst":"Te weten omdat gij dus wederspannig zijt en aldus spreekt. Zie de vervulling 2Ki 25:4 ; Jer 39:4 , en Jer 52:7 ."},{"catchword":"Op snelle paarden","tekst":"Of, op lichte, raslopende [paarden]."},{"catchword":"uw vervolgers","tekst":"Te weten de Babyloniërs."}],"17":[{"catchword":"Een duizend","tekst":"Vergelijk dit met Lev 26:8 , Lev 26:36 ; Deu 28:25 , en Deu 32:30 ."},{"catchword":"een mast","tekst":"Of, mastboom, hoge paal, gedenkteken, hoog verheven gedenkteken, een opgericht hout of hoge boom zonder takken of bladen. De profeet wil hiermede te verstaan geven dat degenen, die overblijven zouden, wel dun gezaaid zouden zijn, en zo lichtelijk te omzien en tellen, als een mastboom, of hoge paal, op een berg."}],"18":[{"catchword":"daarom zal","tekst":"Dit is een vertroosting voor degenen, die de Heere zou laten overblijven."},{"catchword":"wachten,","tekst":"Te weten op uwe boete en beterschap."},{"catchword":"opdat Hij u","tekst":"U verlossende uit uwe gevangenschap."},{"catchword":"daarom zal Hij","tekst":"Te weten door zijne oordelen, door welke gij zult gebracht worden tot boete en beterschap."},{"catchword":"een God","tekst":"Dat is, die geen ding lichtvaardiglijk doet, maar alles met reden, die de straffen weet te matigen; gelijk Jer 10:24 , waar aldus staat: Kastijd mij, Heere, maar met mate, of oordeel gericht. God de Heere straft hetgeen straffenswaardig is, en bewijst genade dengenen, die zich bekeren."}],"19":[{"catchword":"het volk","tekst":"Te weten het Joodse volk, nadat het uit de Babylonische gevangenschap zal verlost zijn; hetwelk een voorbeeld geweest is der geestelijke verlossing van het volk Gods door Christus."},{"catchword":"gij zult","tekst":"Of, gij zult niet meer zozeer, of zoveel wenen. Hebreeuws, gij zult met wenen niet wenen; te weten niet zoveel of zozeer als gij tevoren hebt gedaan, toen gij in de Babylonische gevangenschap zijt gevoerd geworden. Zie Psa 137 ."},{"catchword":"gewisselijk","tekst":"Hebreeuws, Hij zal met genadig zijn genadig zijn. [Hij], te weten de Heere."},{"catchword":"op de stem","tekst":"Dat is, als gij Hem in uwe gevangenschap om verlossing zult aanroepen."},{"catchword":"antwoorden","tekst":"Dat is, verhoren."}],"20":[{"catchword":"Heere","tekst":"Dat is, de Heere zal ulieden wel wederom in kruis en tegenspoed laten vervallen, maar uwe zielen zal Hij met de spijs zijns Woords en met den drank der predikatie verkwikken en versterken, u zullen geen leraars ontbreken; Hij zal maken dat gij altijd enigen bij u hebben zult; te weten nadat Christus in de wereld zal gekomen zijn, die zelf bij ulieden zal prediken, alsook zijne apostelen en discipelen, die Hij daarna zenden zal in de ganse wereld om het Evangelie allen volken te prediken, Mat 28:19 . Anders: de Heere zal u [in] droefenis brood en in verdrukking water geven, enz. Dit is vervuld ten tijde der Macchabeën."},{"catchword":"als met vleugelen","tekst":"Of, gevleugeld zijn; dat is, zo haastelijk alsof zij vleugels hadden. Gelijk geschied is in verscheidene voorgaande tijden, en inzonderheid van den tijd van den profeet Maleachi tot op Johannes den Doper, zie Psa 74:9 ; Mal 4:4-5 ."},{"catchword":"zullen","tekst":"Anders: [geduriglijk] zien; dat is, steeds bij u hebben, met lust en vreugde dezelve aanschouwende, en met ijver hunne predikatiën aanhorende."}],"21":[{"catchword":"desgenen, die","tekst":"Dat is, God zal u als nagaan, u voeren en leiden met zijn Woord en Geest, gelijk een poedagoog of leermeester zijne discipelen voor zich gaan laat, om te beter op hen te passen."},{"catchword":"de weg,","tekst":"Te weten de weg, die ten hemel leidt."},{"catchword":"als gij zoudt","tekst":"Alsof hij zeide: Zo haast als gij van den rechten weg zoudt aftreden, zo zal u de Heere met den straf zijns Woord wederom op den rechten weg brengen; zie Psa 23 ."}],"22":[{"catchword":"voor onrein","tekst":"Of, als iets onreins verachten en van u weren. De zin is, gij zult de afgoderij ten enenmale verlaten, als strijdende met den zuiveren godsdienst."},{"catchword":"het deksel","tekst":"Dat is, uw gesneden beelden, die met zilver of goud overdekt zijn. Hebreeuws, de gesneden beelden uws zilvers; dat is, die van uw zilver gemaakt zijn. Alzo straks, van uw goud."},{"catchword":"het overtreksel","tekst":"Dat is, uw gegoten beelden, met goud overdekt of bekleed of versierd. Het Hebreeuwse woord ziet op den sierlijken efod des hogepriesters, van welken te lezen is Exo 28:6 , enz."},{"catchword":"Henen uit","tekst":"Of, pakt u weg. Hebreeuws, gaat uit."}],"23":[{"catchword":"Hij","tekst":"Te weten de Heere."},{"catchword":"uw zaad,","tekst":"Hebreeuws, Hij zal den regen uws zaads geven; te wten dien regen, dien uw zaad van doen heeft, zou het wel en vruchtbaar opwassen."},{"catchword":"waarmede gij","tekst":"Of, als gij het land bezaaid hebt."},{"catchword":"brood","tekst":"Anders: brood des lands voortkomt; dat is koren, dat uit het land voortkomt."},{"catchword":"smoutig zijn;","tekst":"Of, olieachtig."}],"24":[{"catchword":"zuiver","tekst":"Of, rein. Hebreeuws, gedesemd; dat is, aangenaam, smakelijk; of zuiver voeder; te weten zonder kaf of andere onreinheid, vanwege den groten overvloed der vruchten, die dan wassen zullen."},{"catchword":"verschud","tekst":"Of, verschoten, verwand is, met de schup of werpschoffel."}],"25":[{"catchword":"er zullen","tekst":"Dat is, God zal met zijn overgrote genade en zegen alles zo overvloedig overstelpen, dat ook die mensen zich zullen bekeren en vruchten dragen, die van nature hard, dor en onvruchtbaar waren, gelijk de hoge bergen en heuvels."},{"catchword":"beekjes","tekst":"Of, waterspruitingen; te weten om de hoge bergen en heuvels te bevochtigen en vruchtbaar te maken."},{"catchword":"in den dag","tekst":"Te weten nadat de Babyloniërs door de Perzen en Meden zullen omgebracht zijn."},{"catchword":"de torens","tekst":"Te weten de torens der stad Babel, of de geweldige vorsten en tirannen, die daarin zijn."}],"26":[{"catchword":"het licht der maan","tekst":"Dat is, uwe vreugde zal zeer groot zijn, vooreerst als gij wederom in uw vaderland zult wederkeren, maar inzonderheid als Christus verschijnen zal; alsdan zal het licht zijner kennis en de heerlijkheid, welke God zijne kerk geven zal, zeer voortreffelijk zijn. Zie Isa 24:23 , en de Schriftuurplaatsen aldaar aangetekend."},{"catchword":"zevenvoudig","tekst":"Of, zevenmaal groter."},{"catchword":"het licht van zeven dagen;","tekst":"Of, schijn, of schijnsel. De zin is: De glans der zon zal zo groot zijn alsof er zeven zonnen tegelijk schenen en alsof het licht van zeven klare dagen ineengesmolten of samen verenigd was; versta dit alles van het overgrote geestelijke licht der kennis in geestelijke zaken."},{"catchword":"als de HEERE","tekst":"Dat is, als de Heere zijn volk uit Babel verlossen en weder in het Joodse land brengen zal; maar inzonderheid als Hij hun Christus, den waren medicijnmeester der ziel, zenden zal, die hun de zonden vergeven en hen door den Heiligen Geest wederbaren zal."},{"catchword":"de wonde,","tekst":"Hebreeuws, de wonde zijner slaging, of plaag."},{"catchword":"waarmede","tekst":"Of, die hem geslagen is."}],"27":[{"catchword":"de Naam des HEEREN","tekst":"Dat is, God zelf, of zijne macht en heerlijkheid."},{"catchword":"van verre,","tekst":"Te weten van den hemel, vanwaar God zijnen engel gezonden heeft om de Assyriërs in het leger van Sanherib te verslaan."},{"catchword":"Zijn toorn","tekst":"Te weten tegen de vijanden zijner kerk en bij name tegen de Assyriërs."},{"catchword":"de last","tekst":"Of, verheffing; te weten van den toorn Gods. Het Hebreeuwse woord wordt voor verheffing gebruikt; Jdg 20:40 ; Jer 6:1 , en elders."}],"28":[{"catchword":"adem","tekst":"Of, geblaas."},{"catchword":"raakt;","tekst":"Hebreeuws, deelt, te weten in twee delen, alzo dat het bovenste, te weten het hoofd, uitsteekt en het onderste onder het water is."},{"catchword":"te schudden","tekst":"Of, te wannen, te verstrooien, ziften."},{"catchword":"met een","tekst":"Dat is, totdat zij teniet komen, of die zij tenietmaken zal."},{"catchword":"schudding","tekst":"Of, zift, wanning."},{"catchword":"misleidende","tekst":"Hebreeuws, doende dwalen; dat is, zich verstrooiende, dat zij niet weten waarin, of waaruit; het is ene gelijkenis, genomen van de beesten, die men met den toom leidt waar men wil."}],"29":[{"catchword":"er zal","tekst":"Te weten als de Assyriërs door den engel des Heeren zullen verslagen zijn. Zie Psa 42:9 ."},{"catchword":"het feest","tekst":"Het schijnt dat de profeet ziet op het feest der ongezuurde broden, hetwelk de Joden hielden des nachts als zij het paaslam aten, waarbij zij een lofzang zongen; Exo 12:8 . Zie Psa 42:5 ; Mat 26:30 ."},{"catchword":"tot den berg","tekst":"Dat is, tot den tempel, in welken de Heere zijne woning heeft."},{"catchword":"tot den Rotssteen","tekst":"Dat is, tot den Heere Christus, op wien zich het volk van Israël had te verlaten."}],"30":[{"catchword":"Zijn heerlijke","tekst":"Hebreeuws, de heerlijkheid zijner stem; dat is, den donder en andere uitwendige tekenen zijns toorns tegen de vijanden zijner kerk. Zie Psa 29:3 ."},{"catchword":"de nederlating","tekst":"Te weten, als Hij zijn krachtigen arm zal nederlaten om de Assyriërs te slaan, namelijk in de belegering der stad Libna, of zijn optocht naar Jeruzalem. Zie 2Ki 19:8 , 2Ki 19:35 ."},{"catchword":"een vloed,","tekst":"Gelijk Isa 4:6 ."}],"31":[{"catchword":"door de stem","tekst":"Gelijk vs.30."}],"32":[{"catchword":"alwaar","tekst":"Te weten in het Joodse land. Hebreeuws, alle doorgang van den gegrondvesten staf."},{"catchword":"gegrondveste","tekst":"Te weten van God; dat is die door Gods ordinantie gesteld is."},{"catchword":"staf","tekst":"Dat is, vijandelijke inval der Assyriërs."},{"catchword":"zal hebben doen rusten","tekst":"Of, geleid zal hebben."},{"catchword":"daar","tekst":"De zin is: Nadat de engel de Assyriërs zal verslagen hebben, zal men overal in het land van Juda den Heere met lofzangen prijzen; men zal overal vrolijk zijn vanwege deze victorie. Zie dergelijk voorbeeld Exo 15:20 , en 1Sa 18:6 . Anders: op welken de Heere dien zal geleid hebben met trommelen en met harpen, of zal met trommelen en met harpen zijn."},{"catchword":"tegen hen","tekst":"Te weten tegen het krijgsvolk der Assyriërs. Anders: tegen dien; te weten staf; in het Hebreeuws is zo het een als het ander."},{"catchword":"*","tekst":"Dit 32 vs. vertalen enigen aldus: En het zal geschieden overal waar die gegrondveste staf, dien de Heere op hem [te weten, de Assyriërs] zal doen rusten, gepasseerd zal, [of doorgegaan] zijn met trommelen en met harpen, dat [land] zal Hij bestrijden met strijden der schudden. De zin is: Indien enig land dien staf, dien men wel met droefenis en leedwezen mocht ontvangen, met trommelen en harpen, dat is met blijdschap ontvangt, dat zal de Heere bestrijden met bestrijdingen der beweging; dat is dat het alles zal schudden en beven met een grote beweging."}],"33":[{"catchword":"Tofeth","tekst":"Hebreeuws, Tofthe, dat is, Tofeth, gelijk Jer 7:31 , en Jer 19:6 ; zie de aantekening 2Ki 23:10 . Versta hier door Tofeth niet alleen het graf, maar ook het helse vuur, dat allen vijanden Gods en vervolgers zijner kerk bereid is."},{"catchword":"den koning","tekst":"Versta hier, Sanherib, den koning van Assyrië."},{"catchword":"Hij heeft","tekst":"Te weten de Heere."},{"catchword":"zijn brandstapel","tekst":"Te weten van Tofeth."},{"catchword":"hem aansteken","tekst":"Of, dien; te weten den brandstapel, of, die zal, te weten roede, of dien, te weten staf, waarvan gesproken is vs.31; of versta dit van Tofeth."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Wo to the children that revolt, [Meaning the wicked and inconstant inhabitants of Jerusalem] saith the LORD, to take counsel, [to make a covenant with King of Egypt (as verse 2.) against the King of Babel, after that this King had brought them under his power and dominion] but not of me; [having asked no counsel of me, but following their own mind and fancy] and to cover (themselves) with a covering [so he calleth the King of Egypts protection] but not (of) my Spirit: [that is, not by the inspiration of my Spirit] to add sin unto sin. [Namely, the sin of affiance in the help of man to the sin of perjury, in revolting from the King of Babel. See Eze. And putting confidence in men. Compare Jer 2:13.]"}],"2":[{"catchword":null,"tekst":"Which go to descend into Egypt, and inquire not at my mouth: [To wit, neither by Prophets, nor by the high Priest] for to strengthen themselves with the strength of Pharaoh, and to seek for refuge under the shadow [that is, under the defence, or protection. Instead of this phrase, it is said Ruth chap.2.verse 12. Under the wings] of Egypt, to make a covenant with the King of Egypt, see Jer 2:18. and 37.7. Zech.17.15.]"}],"3":[{"catchword":null,"tekst":"For the strength of Pharoah shall be shame unto you, and that refuge under the shadow of Egypt, confusion."}],"4":[{"catchword":null,"tekst":"When his Princes [To wit, the King of Judas Princes. See Eze 17:15. Others, their princes; to wit, the Princes of the people of the Jews shall have been Zoan, and his Ambassadors [or, messengers] shall have come neer unto Hanes. [Zoan and Hanes were cities lying in Egypt. See the Annotat. Num 13:22. Psal.78.12. Hanes is Daphne. See Jerem.2.on verse 16. And 43.on verse 7.]"}],"5":[{"catchword":null,"tekst":"He [To wit, God, or the King of Egypt] shall make them all [to wit, all those of Jerusalem, as well Ambassadors as subjects] ashamed [that is, despicable, or contemptible. Others, he will make them all stinking; to wit, the Egyptians. See Jer 37:7. by a people that cannot profit them, nor (be) an help nor an advantage (unto them,) but shall be a shame and also a reproach (unto them.)"}],"6":[{"catchword":null,"tekst":"The burden of the beasts of the South: [That is, the prophesy against the Jews, concerning the Camels or others beasts that bear burdens, which they sent to Egypt, laden with gifts or presents, to crave aid or assistance of the King of Egypt against the Chaldeans, (of the south) that is, toward Egypt, so called, because it lieth southerly of the land of Juda] into the land of trouble and anguish, [So is Egypt called or described, because many troubles and anguish befell the Jews there in former time, and should yet befall those that seek for help and counsel there] from whence is the strong Lion, and the old Lion, the Cockatrice and the fiery flying Dragon: [Such mischievous, venomous, renting, devouring creatures are found in great abundance in Egypt. Some understand by those creatures, in the Souldiers of Egypt, from whom the Jews could expect nothing but mischief and destruction] they, [to wit, the Ambassadors of the Jews, that brought great presents to the king of Egypt] shall carry their goods upon the back of their Colts, and their treasures upon the bunches of the Camels, unto a people (that) shall not profit (them:) [that is, unto the Egyptians, as vers.5.]"}],"7":[{"catchword":null,"tekst":"For Egypt shall help in vain, and to no purpose; [That is, the help of the Egyptians shall be in vain, and to no purpose] therefore have I cried concerning this; sitting still shall be their strength; [to wit, the strength of the Jews. Compare below vers.15. Hebr. Rahab-hem scabet, which words others do render thus: Rahab is ceasing, or, Rahab shall cease, that is, Egypt shall sit still, or cease; that is, it shall afford no more help. See Jer 37:7. Egypt is more then once by the Prophet called Rahab, as below chap.51.9. and Psal.87.4. See the Annotat. There.]"}],"8":[{"catchword":null,"tekst":"Now (then) go thy ways, write (it) before thee on a Table, and note in a book, [These words, and those that follow, are the words of the Lord unto the Prophet. (Write, etc.) To wit, for a witness against them. Compare this with Deut.31.19. and above chap.8.1. (before them) or by, or among them, to wit, the Citizens of Jerusalem] that it may remain [Heb. Be see Psal.37.vers.18.] for the last day, [or, for the day, or time to come] forever and ever."}],"9":[{"catchword":null,"tekst":"For it is rebellious people; [That is, a people that ever and anon departeth from the Lord, and rebelleth against him] they are lying children, Children that will not hear the Law, [or Doctrine] of the Lord."}],"10":[{"catchword":null,"tekst":"Which say unto the Seers, [That is, unto the prophets. See 1 Sam.9.9.] See not [that is, Prophesy not; as if they had said, though God reveal somewhat unto you, yet publish it not, but conceal it, as if ye had neither seen nor heard it:] and to the Viewers, that is, Prophets] View for us that which is right, speak unto us soft things: [as if they had said; but preach unto us that which is pleasant, and acceptable,] view for us deceits, [or workings.]"}],"11":[{"catchword":null,"tekst":"Depart from the way: [That is, from your Office and ruling,] Get you gone from the path, cause the holy One of Israel to cease from us: [That is, speak no more unto us of the Word and threatening of the Lord.]"}],"12":[{"catchword":null,"tekst":"Therefore thus saith the Holy One of Israel, because ye cast off this word: [that is, this Prophesy, that which I cause to be preached unto you by my Prophet, concerning the aid of the Egyptians, from which he dissuaded you;] and trust oppression: [that is, in your wicked devices, which tend to the oppression of the poor and innocent. Others in oppression, to wit, of the Prophets, that counsel or advise you for the best. See Jer 20:2. and 26.11. and 37.15,16.]and perverness, and stay thereon: [To wit, upon oppressions.]"}],"13":[{"catchword":null,"tekst":"Therefore this offence shall be unto you like a falling breach bowed outward in a high wall, whose breaking shall come suddenly, in a moment: [The meaning is, your sins shall be the cause of your sudden ruine, as a wall that is full of elects or chinks, and that bendeth out, doth easily give in, and falleth down: Compare Psal.62.vers.4. and the Annotat. There.]"}],"14":[{"catchword":null,"tekst":"Yea he [To wit, the Lord, or the Enemy] shall break it: [To wit, Jerusalem and the other Cities of Juda; yea, also the whole Nation of the Jews, the Ecclesiatical and the Civil state: [as a Potters pot is broken:] Heb. According to the breaking of a Potters bottle,] in breaking to shivers he shall not spare: [That is, it shall be quite broken to shivers, so that nought of it shall remain whole. Compare Jer 19:11.] So that of the bruising of it [That is, of the broken pieces thereof] there shall not be found a shred, to take fire out of the hearth, or to take up water out of a ditch, [or trench, pit, pool.]"}],"15":[{"catchword":null,"tekst":"For thus saith the Lord, the Holy One of Israel, by returning and rest: [That is, if ye should return and cease, to wit, from your wicked lives, and purpose to go to seek help in Egypt, possessing your souls in patience, and hoping or trusting in God. See above, vers.7.] should ye be saved [or be delivered] in quietness and in confidence [To wit, in God] should be your strength, but ye would not: [That is, ye would not obey his counsel.]"}],"16":[{"catchword":null,"tekst":"And ye say, no, but we will flee upon horses: [To wit, when the Babylonians are too strong for us: Others, we will flee, etc. That is, we will run about hither and thither, so long till we find help,] therefore shall ye flee [to wit, because ye are thus rebellious, 25.4. Jer 39:4. and 52.7.] and we will ride upon swift Horses,) [or upon light horses, that run apace,] therefore your Pursuers [To wit, the Babylonians] shall be swift (also.)"}],"17":[{"catchword":null,"tekst":"One thousand (shall flee) at the rebuke of one, at the rebuke of five shall ye (all) flee: [Compare this with Levits.26.8.36. Deut.28.25. and 32.30.] till ye exalted pillar or memorial, or high tree without boughs or leaves] upon the top of a mountain, [The Prophet doth intimate hereby, that those that should be left, should be sowen very thin, and should be as easy to be seen and told, as a ship-mast, or high pole upon a Mountain] and as an Ensign upon an Hill."}],"18":[{"catchword":null,"tekst":"And therefore will the Lord wait that he may be gracious unto you: [These and the words that follow, are a comfort or consolation unto those whom the Lord should spare, or suffer to remain, (the Lord will wait) to wit, upon your repentance and amendment, (that he may be gracious unto you,) delivering you from your captivity,] and therefore will he be exalted, [To wit, by his judgements, whereby ye shall be brought to repentance and amendment,] that he may have mercy upon you, for the LORD is a God of judgement: [Who doth nothing rashly or inconsiderately, but all things justly, and upon good grounds; who knoweth to moderate hand mitigate punishments, as Jer 10:24. where it is said thus, Correct me Lord, but with, or, judgement: God punisheth them that deserve punishments, and sheweth mercy to them that repent and turn unto him [blessed are all they that wait for him.] Compare Psal.2.12. and 34.9. Pro 16:20. Jer 17:7.]"}],"19":[{"catchword":null,"tekst":"For the people [To wit, the people of the Jews, after they shall be delivered out of the Babylonish captivity, which was a type of the spiritual redemption of the people of God by Christ, [shall dwell in Zion at Jerusalem: thou shalt not weep at all, [or, thou shalt not weep with weeping: to wit, with so much, or so sore weeping, as thou didst in times past, when thou wast carried into captivity. See Psal.137.] Surely he [to wit, the Lord] will be gracious unto thee, [Heb. He will by being gracious be gracious unto thee] at the voice of thy cry, [that is, when thou shalt in thy captivity call or cry unto him for deliverance] as soon as he shall bear it, shall he answer [That is, hear] thee."}],"20":[{"catchword":null,"tekst":"The Lord shall indeed give you bread of distress, and waters of oppression; but thy teachers shall not fly any more away as with wings, [Or, be winged: That is, so swiftly or speedily as if they had wings. As came to pass in sundry former times, and especially from the time of the Prophet Malachi unto John Baptist, See Mal.chap.4.vers.4,5. Psal.74.9.] but thine eyes shall see thy Teachers (continually.) That is, have them always or continually with you, beholding them with joy and delight, and bearing their Sermons with zeal and attention. (The Lord shall (indeed) give you bread of distress, etc.) That is, the Lord shall indeed suffer you to fall again into affliction and adversity, but he shall comfort and strengthen your souls with the spiritual food of his Word, and with the hearing of the Gospel; not teachers shall be wanting unto you, he will make that ye shall have always some with you; to wit, after that Christ shall become into the World, who himself in his own Person shall preach unto you, as also his Apostles and Disciples, whom he shall afterward send unto all the world, to preach the Gospel unto all Nations, Mat 28:19. Others, and water (in) oppression, &c. This was fulfilled in the time of Machabees.]"}],"21":[{"catchword":null,"tekst":"And their ears shall hear the word (of him that) is behind thee, [That is, God shall as it were follow, or go after thee, and shall carry and lead thee by his Word and spirit, as a Tutor or School-master letteth his Disciples or Scholars go before him, that he may mind them the better] saying, this is the way, [to wit, the way that leadeth to heaven] walk in it, when ye shall turn aside to the right hand or to the left. As if he had said, as soon as ye shall step aside from the right way, the Lord will with staff of his Word bring you back again into the right way. See Psal.23.]"}],"22":[{"catchword":null,"tekst":"And ye shall esteem as unclean [Or, despise (it) as a thing unclean, and put it away from you] the covering of thy silver carved images, and the covering of thy golden molten images: thou shalt cast them away as a menstruous cloth, and say unto each of them, away from thence [or, get thee gone. Heb. Go sorth. The meaning is, thou shalt utterly abandon & forsaken Idolatry, as repugnant to the true worship and service of God. (The covering of thy silver carved Images) that is, thy carved Images that are covered over with Silver or Gold. Heb. Of the carved Images of thy Silver, that is, which are made of thy Silver. So presently again, of thy Gold, (and the covering over of thy golden molten Image:) That is, thy molten Images covered over, or clad, or adorned with Gold: the Hebrew word hath respect to the beautiful and glorious Ephod of the High Priest, whereof, see Exo 28:6. &c.]"}],"23":[{"catchword":null,"tekst":"Then shall he [To wit, the Lord] give rain unto thy seed, [Heb. He shall give the rain of thy seed; to wit, that rain which thy seed hath need of, if it should come well, and bear fruit] wherewith thou hast sowed the Land, [or, when thou hast sowed the Land] and bread of the increase of the Land, [others, bread of the Lands getting, or, revenue: that is, corn, that proceedeth or cometh forth out of the land or ground] and the same shall be fat and unctuous, [or, oily] thy Cattle shall in that day feed (in) large Pastures."}],"24":[{"catchword":null,"tekst":"And the Oxen and the Ass-colts that till the land, shall eat pure, [or, clean, Heb. Leavened: that is, pleasant, savoury] fodder, [or, pure fodder, or provender: to wit, without chaff, or other uncleanness, by reason of the great plenty of fruits that shall grow then] which is stalked [or, shot, winnowed] with the shovel, and with the fan."}],"25":[{"catchword":null,"tekst":"And there shall be upon all [or every] high mountain, and upon all [or every] exalted hill, little brooks and streams of waters, [That is, God will so abundantly reflect with his transcendent mercy and blessing upon all things, that even those men shall be converted and bear fruit, who were by nature hard, dry and barren, like the high mountains and hills. [Upon all [or every] high hill, small brook] or, water-springs, water-issues: to wit, to water the high mountains and hills, and to make them fruitful] in the day of the great slaughter, [To wit, after the Babylonians shall be slain by the Persians and Medes] when the towards shall fall. [To wit, the towers of the City of Babel; or, the mighty Princes and Tyrants that are in it.]"}],"26":[{"catchword":null,"tekst":"And the light of the Moon shall be as the light of the Sun, and the light of the Sun shall be seven-fold: [Or, seven times greater: that is, your joy shall be exceeding great: First, when ye shall return again into your own Country, but especially when Christ shall appear or come in the flesh, then shall the light of his knowledge, and the glory which God shall give unto his Church be exceeding great and excellent. See above chap.24.23. and the Annotat. There] as the light of, [or brightness, or, shining] of seven days: [The meaning is, the brightness of the Sun shall be so great, as if seven Suns did shine all at once, or together, and as if the light of seven bright and clear days were all united together. Understand all this of the exceeding great spiritual light of knowledge in divine and spiritual things] in the day when the LORD shall bind up the breach of his people, and heal the wound wherewith they are stricken. [or, which is struken them, Heb. The wound of their striking, or, stroke: that is, when the Lord shall deliver his people out of Babel, and shall bring them again into the land of Juda: but especially when he shall send Christ, the true Physician of the soul, who shall forgive their sins, and regenerate to beget them again by the holy Ghost.]"}],"27":[{"catchword":null,"tekst":"Behold the Name of the LORD, [That is, God himself, or his power and glory] cometh from far, [to wit, from Heaven, from whence God sent his Angel to slay the Assyrians in the Camp of Sennacherib] his anger burneth, [to wit, against the Enemies of his Church, and in particular against the Assyrians] and the burden, [or, exaltation lifting up; to wit, of Gods anger. The Hebrew word is used for lifting up, Judg.20.40. and Jer 6:1. and elsewhere] is heavy: his lips are full of indignation, and his tongue (is) as a consuming fire."}],"28":[{"catchword":null,"tekst":"And his beautiful [or, blast] is an overrunning brook, (which) reacheth even to the neck: [Heb. Divideth, etc. To wit, into two parts, so that the uppermost part, to wit, the head, sticketh out, and the lowermost is underwater] to shake, [or, to winnow, to scatter, to sift] the heathen with a shaking [or, // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});
