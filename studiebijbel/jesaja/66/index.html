the","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Zo zegt de HEERE: De hemel is Mijn troon, en de aarde is de voetbank van Mijn voeten; waar zou dat huis zijn, dat u Mij zou bouwen, en waar is de plaats van Mijn rust?","2":"Want Mijn hand heeft al deze dingen gemaakt, en al deze dingen zijn geweest, spreekt de HEERE; maar op deze zal Ik zien, op de arme en verslagene van geest, en die voor Mijn woord beeft.","3":"Wie een os slacht, slaat een man; wie een lam offert, breekt een hond de hals; wie spijsoffer offert, is *als* *die* zwijnenbloed *offert*; wie wierook brandt tot een gedenkoffer, is *als* die een afgod zegent. Dezen kiezen ook hun eigen wegen, en hun ziel heeft plezier in hun verfoeisels.","4":"Ik zal ook *hun loon* kiezen naar hun handelingen, en hun angsten zal Ik over hen doen komen, omdat Ik geroepen heb, en niemand antwoordde, Ik gesproken heb en zij niet luisterden, maar deden wat kwaad is in Mijn ogen, en kozen wat Ik niet wilde.","5":"Hoor het woord van de HEERE, u die voor Zijn woord beeft! Uw broeders, die u haten, die u ver wegsturen, om Mijn Naam, zeggen: Laat de HEERE heerlijk worden! Maar Hij zal verschijnen tot uw vreugde, zij daarentegen zullen beschaamd worden.","6":"Er zal een stem van een groot rumoer uit de stad zijn, een stem uit de tempel, de stem van de HEERE, Die Zijn vijanden de verdiensten vergeldt.","7":"Voordat zij barensnood had, heeft zij gebaard, voordat haar smart kwam, is zij al van een jongetje bevrijd.","8":"Wie heeft *ooit* zoiets gehoord? Wie heeft dergelijke dingen gezien? Zou een land geboren kunnen worden op één dag? Zou een volk geboren kunnen worden in één keer? Maar Sion heeft weeën gekregen, en zij heeft haar zonen gebaard.","9":"Zou Ik de baarmoeder openbreken, en niet laten baren? zegt de HEERE; zou Ik, Die laat baren, voortaan toesluiten? zegt uw God.","10":"Verblijd u met Jeruzalem, en verheug u over haar, al haar liefhebbers! Wees vrolijk over haar met vreugde, u allen die over haar hebt getreurd!","11":"Opdat u mag zuigen, en verzadigd worden van de borsten van haar vertroostingen; opdat u mag uitzuigen, en u verlustigen aan de glans van haar heerlijkheid.","12":"Want zo zegt de HEERE: Zie, Ik zal de vrede over haar uitstrekken als een rivier, en de heerlijkheid van de heidenen als een overlopende beek; dan zult u zuigen; u zult op de zijde gedragen worden, en op de knieën heel vriendelijk getroeteld worden.","13":"Zoals iemand die zijn moeder troost, zo zal Ik u troosten; ja, u zult in Jeruzalem getroost worden.","14":"En u zult *het* zien, en uw hart zal vrolijk zijn, en uw beenderen zullen groeien als het tedere gras; dan zal de hand van de HEERE bekend worden aan Zijn knechten, en Hij zal boos worden op Zijn vijanden.","15":"Want zie, de HEERE zal met vuur komen, en Zijn wagens als een wervelwind; om met grimmigheid Zijn toorn hiertoe te wenden, en Zijn bestraffing met vuurvlammen.","16":"Want met vuur, en met Zijn zwaard zal de HEERE oordelen over alle vlees; en de verslagenen van de HEERE zullen talrijk zijn.","17":"Wie zichzelf heiligen, en zichzelf reinigen in de hoven, achter één in het midden van die, die zwijnenvlees eten, en verfoeisel, en muizen; samen zullen zij verteerd worden, spreekt de HEERE.","18":"Hun werken en hun gedachten! Het komt, dat Ik alle heidenen en talen zal verzamelen, en zij zullen komen, en zij zullen Mijn heerlijkheid zien.","19":"En Ik zal een teken bij hen zetten, en uit hen die ontkomen zijn, zal Ik zenden naar de heidenen, *naar* Tarsis, Pul en Lud, de boogschutters, *naar* Tubal en Javan, naar de ver gelegen eilanden, die Mijn faam niet gehoord en Mijn heerlijkheid niet gezien hebben; en zij zullen Mijn heerlijkheid onder de heidenen verkondigen.","20":"En zij zullen al uw broeders uit alle heidenen naar de HEERE brengen *als* spijsoffer, op paarden, en op wagens, en op draagstoelen, en op muildieren, en op snelle lopers, naar Mijn heilige berg toe, *naar* Jeruzalem, zegt de HEERE, zoals de kinderen van Israël het spijsoffer in een rein vat brengen naar het huis van de HEERE.","21":"En ook zal Ik uit hen sommigen tot priesters *en* tot Levieten nemen, zegt de HEERE.","22":"Want zoals die nieuwe hemel en die nieuwe aarde, die Ik maken zal, voor Mijn aangezicht zullen staan, spreekt de HEERE, zo zal *ook* uw nageslacht en uw naam standhouden.","23":"En het zal gebeuren, dat van de ene nieuwe maan tot de andere, en van de ene sabbat tot de andere, alle vlees zal komen om te aanbidden voor Mijn aangezicht, zegt de HEERE.","24":"En zij zullen naar buiten gaan, en zij zullen de dode lichamen zien van de mensen die tegen Mij in opstand zijn gekomen; want hun worm zal niet sterven, en hun vuur zal niet uitgeblust worden, en zij zullen voor alle vlees een afgrijzen zijn."},"SV":{"1":"Alzo zegt de HEERE: De hemel is Mijn troon, en de aarde is de voetbank Mijner voeten; waar zou dat huis zijn, dat gijlieden Mij zoudt bouwen, en waar is de plaats Mijner rust?","2":"Want Mijn hand heeft al deze dingen gemaakt, en al deze dingen zijn geweest, spreekt de HEERE; maar op dezen zal Ik zien, op den arme en verslagene van geest, en die voor Mijn woord beeft.","3":"Wie een os slacht, slaat een man; wie een lam offert, breekt een hond den hals; wie spijsoffer offert, is *als* *die* zwijnenbloed *offert*; wie wierook brandt ten gedenkoffer, is *als* die een afgod zegent. Dezen verkiezen ook hun wegen, en hun ziel heeft lust aan hun verfoeiselen.","4":"Ik zal ook verkiezen *het* *loon* hunner handelingen, en hun vreze zal Ik over hen doen komen, omdat Ik geroepen heb, en niemand antwoordde, Ik gesproken heb en zij niet hoorden, maar deden dat kwaad is in Mijn ogen, en verkoren hetgeen waartoe Ik geen lust had.","5":"Hoort des HEEREN woord, gij, die voor Zijn woord beeft! Uw broeders, die u haten, die u verre afzonderen, om Mijns Naams wil, zeggen: Dat de HEERE heerlijk worde! Doch Hij zal verschijnen tot ulieder vreugde, zij daarentegen zullen beschaamd worden.","6":"Er zal een stem van een groot rumoer uit de stad zijn, een stem uit den tempel, de stem des HEEREN, Die Zijn vijanden de verdiensten vergeldt.","7":"Eer zij barensnood had, heeft zij gebaard, eer haar smart overkwam, zo is zij van een knechtje verlost.","8":"Wie heeft *ooit* zulks gehoord? Wie heeft dergelijks gezien? Zou een land kunnen geboren worden op een enigen dag? Zou een volk kunnen geboren worden op een enige reize? Maar Sion heeft weeën gekregen, en zij heeft haar zonen gebaard.","9":"Zou Ik de baarmoeder openbreken, en niet genereren? zegt de HEERE; zou Ik, Die genereer, voortaan toesluiten? zegt uw God.","10":"Verblijdt u met Jeruzalem, en verheugt u over haar, al haar liefhebbers! Weest vrolijk over haar met vreugde, gij allen, die over haar zijt treurig geweest!","11":"Opdat gij moogt zuigen, en verzadigd worden van de borsten harer vertroostingen; opdat gij moogt uitzuigen, en u verlusten met den glans harer heerlijkheid.","12":"Want alzo zegt de HEERE: Ziet, Ik zal den vrede over haar uitstrekken als een rivier, en de heerlijkheid der heidenen als een overlopende beek; dan zult gijlieden zuigen; gij zult op de zijden gedragen worden, en op de knieën zeer vriendelijk getroeteld worden.","13":"Als een, dien zijn moeder troost, alzo zal Ik u troosten; ja, gij zult te Jeruzalem getroost worden.","14":"En gij zult *het* zien, en uw hart zal vrolijk zijn, en uw beenderen zullen groenen als het tedere gras; dan zal de hand des HEEREN bekend worden aan Zijn knechten, en Hij zal Zijn vijanden gram worden.","15":"Want ziet, de HEERE zal met vuur komen, en Zijn wagenen als een wervelwind; om met grimmigheid Zijn toorn hiertoe te wenden, en Zijn schelding met vuurvlammen.","16":"Want met vuur, en met Zijn zwaard zal de HEERE in het recht treden met alle vlees; en de verslagenen des HEEREN zullen vermenigvuldigd zijn.","17":"Die zichzelven heiligen, en zichzelven reinigen in de hoven, achter een in het midden *derzelve*, die zwijnenvlees eten, en verfoeisel, en muizen; te zamen zullen zij verteerd worden, spreekt de HEERE.","18":"Hun werken en hun gedachten! Het komt, dat Ik vergaderen zal alle heidenen en tongen, en zij zullen komen, en zij zullen Mijn heerlijkheid zien.","19":"En Ik zal een teken aan hen zetten, en uit hen, die het ontkomen zullen zijn, zal Ik zenden tot de heidenen *naar* Tarsis, Pul, en Lud, de boogschutters, *naar* Tubal en Javan, tot de ver gelegen eilanden, die Mijn gerucht niet gehoord, noch Mijn heerlijkheid gezien hebben; en zij zullen Mijn heerlijkheid onder de heidenen verkondigen.","20":"En zij zullen al uw broeders uit alle heidenen den HEERE *ten* spijsoffer brengen, op paarden, en op wagenen, en op rosbaren, en op muildieren, en op snelle lopers, naar Mijn heiligen berg toe, *naar* Jeruzalem, zegt de HEERE, gelijk als de kinderen Israëls het spijsoffer in een rein vat brengen ten huize des HEEREN.","21":"En ook zal Ik uit dezelve enigen tot priesters *en* tot Levieten nemen, zegt de HEERE.","22":"Want gelijk als die nieuwe hemel en die nieuwe aarde, die Ik maken zal, voor Mijn aangezicht zullen staan, spreekt de HEERE, alzo zal *ook* ulieder zaad en ulieder naam staan.","23":"En het zal geschieden, dat van de ene nieuwe maan tot de andere, en van den enen sabbat tot den anderen, alle vlees komen zal om aan te bidden voor Mijn aangezicht, zegt de HEERE.","24":"En zij zullen henen uitgaan, en zij zullen de dode lichamen der lieden zien, die tegen Mij overtreden hebben; want hun worm zal niet sterven, en hun vuur zal niet uitgeblust worden, en zij zullen allen vlees een afgrijzing wezen."},"KJV":{"1":"Thus saith the LORD, The heaven *is* my throne, and the earth *is* my footstool: where *is* the house that ye build unto me? and where *is* the place of my rest?","2":"For all those *things* hath mine hand made, and all those *things* have been, saith the LORD: but to this *man* will I look, *even* to *him that is* poor and of a contrite spirit, and trembleth at my word.","3":"He that killeth an ox *is as if* he slew a man; he that sacrificeth a lamb, *as if* he cut off a dog's neck; he that offereth an oblation, *as if he offered* swine's blood; he that burneth incense, *as if* he blessed an idol. Yea, they have chosen their own ways, and their soul delighteth in their abominations.","4":"I also will choose their delusions, and will bring their fears upon them; because when I called, none did answer; when I spake, they did not hear: but they did evil before mine eyes, and chose *that* in which I delighted","5":"Hear the word of the LORD, ye that tremble at his word; Your brethren that hated you, that cast you out for my name's sake, said, Let the LORD be glorified: but he shall appear to your joy, and they shall be ashamed.","6":"A voice of noise from the city, a voice from the temple, a voice of the LORD that rendereth recompence to his enemies.","7":"Before she travailed, she brought forth; before her pain came, she was delivered of a man child.","8":"Who hath heard such a thing? who hath seen such things? Shall the earth be made to bring forth in one day? *or* shall a nation be born at once? for as soon as Zion travailed, she brought forth her children.","9":"Shall I bring to the birth, and not cause to bring forth? saith the LORD: shall I cause to bring forth, and shut *the womb*? saith thy God.","10":"Rejoice ye with Jerusalem, and be glad with her, all ye that love her: rejoice for joy with her, all ye that mourn","11":"That ye may suck, and be satisfied with the breasts of her consolations; that ye may milk out, and be delighted with the abundance of her glory.","12":"For thus saith the LORD, Behold, I will extend peace to her like a river, and the glory of the Gentiles like a flowing stream: then shall ye suck, ye shall be borne upon *her* sides, and be dandled upon *her* knees.","13":"As one whom his mother comforteth, so will I comfort you; and ye shall be comforted in Jerusalem.","14":"And when ye see *this*, your heart shall rejoice, and your bones shall flourish like an herb: and the hand of the LORD shall be known toward his servants, and *his* indignation toward his enemies.","15":"For, behold, the LORD will come with fire, and with his chariots like a whirlwind, to render his anger with fury, and his rebuke with flames of fire.","16":"For by fire and by his sword will the LORD plead with all flesh: and the slain of the LORD shall be many.","17":"They that sanctify themselves, and purify themselves in the gardens behind one *tree* in the midst, eating swine's flesh, and the abomination, and the mouse, shall be consumed together, saith the LORD.","18":"For I *know* their works and their thoughts: it shall come, that I will gather all nations and tongues; and they shall come, and see my glory.","19":"And I will set a sign among them, and I will send those that escape of them unto the nations, *to* Tarshish, Pul, and Lud, that draw the bow, *to* Tubal, and Javan, *to* the isles afar off, that have not heard my fame, neither have seen my glory; and they shall declare my glory among the Gentiles.","20":"And they shall bring all your brethren *for* an offering unto the LORD out of all nations upon horses, and in chariots, and in litters, and upon mules, and upon swift beasts, to my holy mountain Jerusalem, saith the LORD, as the children of Israel bring an offering in a clean vessel into the house of the LORD.","21":"And I will also take of them for priests *and* for Levites, saith the LORD.","22":"For as the new heavens and the new earth, which I will make, shall remain before me, saith the LORD, so shall your seed and your name remain.","23":"And it shall come to pass, *that* from one new moon t code=\"H3068\">LORD:</span> but to this man will I <span class=\"wl wl-kjv\" data-code=\"H5027\">look,</span> even to him that is <span class=\"wl wl-kjv\" data-code=\"H6041\">poor</span> and of a <span class=\"wl wl-kjv\" data-code=\"H5223\">contrite</span> <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit,</span> and <span class=\"wl wl-kjv\" data-code=\"H2730\">trembleth</span> at my word.","3":"He that <span class=\"wl wl-kjv\" data-code=\"H7819\">killeth</span> an <span class=\"wl wl-kjv\" data-code=\"H7794\">ox</span> is as if he <span class=\"wl wl-kjv\" data-code=\"H5221\">slew</span> a <span class=\"wl wl-kjv\" data-code=\"H376\">man;</span> he that <span class=\"wl wl-kjv\" data-code=\"H2076\">sacrificeth</span> a <span class=\"wl wl-kjv\" data-code=\"H7716\">lamb,</span> as if he cut <span class=\"wl wl-kjv\" data-code=\"H6202\">off</span> a <span class=\"wl wl-kjv\" data-code=\"H3611\">dog's</span> <span class=\"wl wl-kjv\" data-code=\"H6202\">neck;</span> he that <span class=\"wl wl-kjv\" data-code=\"H5927\">offereth</span> an <span class=\"wl wl-kjv\" data-code=\"H4503\">oblation,</span> as if he offered <span class=\"wl wl-kjv\" data-code=\"H2386\">swine's</span> <span class=\"wl wl-kjv\" data-code=\"H1818\">blood;</span> he that <span class=\"wl wl-kjv\" data-code=\"H2142\">burneth</span> <span class=\"wl wl-kjv\" data-code=\"H3828\">incense,</span> as if he <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed</span> an <span class=\"wl wl-kjv\" data-code=\"H205\">idol.</span> Yea, they have <span class=\"wl wl-kjv\" data-code=\"H977\">chosen</span> their own <span class=\"wl wl-kjv\" data-code=\"H1870\">ways,</span> and their <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> <span class=\"wl wl-kjv\" data-code=\"H2654\">delighteth</span> in their abominations.","4":"I also will <span class=\"wl wl-kjv\" data-code=\"H977\">choose</span> their <span class=\"wl wl-kjv\" data-code=\"H8586\">delusions,</span> and will <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> their <span class=\"wl wl-kjv\" data-code=\"H4035\">fears</span> upon them; because when I <span class=\"wl wl-kjv\" data-code=\"H7121\">called,</span> none did <span class=\"wl wl-kjv\" data-code=\"H6030\">answer;</span> when I <span class=\"wl wl-kjv\" data-code=\"H1696\">spake,</span> they did not <span class=\"wl wl-kjv\" data-code=\"H8085\">hear:</span> but they <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> before mine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> and <span class=\"wl wl-kjv\" data-code=\"H977\">chose</span> that in which I delighted","5":"<span class=\"wl wl-kjv\" data-code=\"H8085\">Hear</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> ye that <span class=\"wl wl-kjv\" data-code=\"H2730\">tremble</span> at his <span class=\"wl wl-kjv\" data-code=\"H1697\">word;</span> Your <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> that <span class=\"wl wl-kjv\" data-code=\"H8130\">hated</span> you, that cast you <span class=\"wl wl-kjv\" data-code=\"H5077\">out</span> for my <span class=\"wl wl-kjv\" data-code=\"H8034\">name's</span> sake, <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Let the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> be <span class=\"wl wl-kjv\" data-code=\"H3513\">glorified:</span> but he shall <span class=\"wl wl-kjv\" data-code=\"H7200\">appear</span> to your <span class=\"wl wl-kjv\" data-code=\"H8057\">joy,</span> and they shall be ashamed.","6":"A <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of <span class=\"wl wl-kjv\" data-code=\"H7588\">noise</span> from the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> a <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> from the <span class=\"wl wl-kjv\" data-code=\"H1964\">temple,</span> a <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> that <span class=\"wl wl-kjv\" data-code=\"H7999\">rendereth</span> <span class=\"wl wl-kjv\" data-code=\"H1576\">recompence</span> to his enemies.","7":"Before she <span class=\"wl wl-kjv\" data-code=\"H2342\">travailed,</span> she brought <span class=\"wl wl-kjv\" data-code=\"H3205\">forth;</span> before her <span class=\"wl wl-kjv\" data-code=\"H2256\">pain</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came,</span> she was <span class=\"wl wl-kjv\" data-code=\"H4422\">delivered</span> of a man child.","8":"Who hath <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> such a thing? who hath <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> such things? Shall the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> be made to bring <span class=\"wl wl-kjv\" data-code=\"H2342\">forth</span> in <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day?</span> or shall a <span class=\"wl wl-kjv\" data-code=\"H1471\">nation</span> be <span class=\"wl wl-kjv\" data-code=\"H3205\">born</span> at <span class=\"wl wl-kjv\" data-code=\"H6471\">once?</span> for as soon <span class=\"wl wl-kjv\" data-code=\"H1571\">as</span> <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion</span> <span class=\"wl wl-kjv\" data-code=\"H2342\">travailed,</span> she brought <span class=\"wl wl-kjv\" data-code=\"H3205\">forth</span> her children.","9":"Shall I bring to the <span class=\"wl wl-kjv\" data-code=\"H7665\">birth,</span> and not cause to bring <span class=\"wl wl-kjv\" data-code=\"H3205\">forth?</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> shall <span class=\"wl wl-kjv\" data-code=\"H589\">I</span> cause to bring <span class=\"wl wl-kjv\" data-code=\"H3205\">forth,</span> and <span class=\"wl wl-kjv\" data-code=\"H6113\">shut</span> the womb? <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> thy God.","10":"<span class=\"wl wl-kjv\" data-code=\"H8055\">Rejoice</span> ye with <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> and be <span class=\"wl wl-kjv\" data-code=\"H1523\">glad</span> with her, all ye that <span class=\"wl wl-kjv\" data-code=\"H157\">love</span> her: <span class=\"wl wl-kjv\" data-code=\"H7797\">rejoice</span> for <span class=\"wl wl-kjv\" data-code=\"H4885\">joy</span> with her, all ye that mourn","11":"That ye may <span class=\"wl wl-kjv\" data-code=\"H3243\">suck,</span> and be <span class=\"wl wl-kjv\" data-code=\"H7646\">satisfied</span> with the <span class=\"wl wl-kjv\" data-code=\"H7699\">breasts</span> of her <span class=\"wl wl-kjv\" data-code=\"H8575\">consolations;</span> that ye may milk <span class=\"wl wl-kjv\" data-code=\"H4711\">out,</span> and be <span class=\"wl wl-kjv\" data-code=\"H6026\">delighted</span> with the <span class=\"wl wl-kjv\" data-code=\"H2123\">abundance</span> of her glory.","12":"For thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> Behold, I will <span class=\"wl wl-kjv\" data-code=\"H5186\">extend</span> <span class=\"wl wl-kjv\" data-code=\"H7965\">peace</span> to her like a <span class=\"wl wl-kjv\" data-code=\"H5104\">river,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> of the <span class=\"wl wl-kjv\" data-code=\"H1471\">Gentiles</span> like a <span class=\"wl wl-kjv\" data-code=\"H7857\">flowing</span> <span class=\"wl wl-kjv\" data-code=\"H5158\">stream:</span> then shall ye <span class=\"wl wl-kjv\" data-code=\"H3243\">suck,</span> ye shall be <span class=\"wl wl-kjv\" data-code=\"H5375\">borne</span> upon her <span class=\"wl wl-kjv\" data-code=\"H6654\">sides,</span> and be <span class=\"wl wl-kjv\" data-code=\"H8173\">dandled</span> upon her knees.","13":"As <span class=\"wl wl-kjv\" data-code=\"H376\">one class=\"wl wl-kjv\" data-code=\"H7676\">another,</span> shall all <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to <span class=\"wl wl-kjv\" data-code=\"H7812\">worship</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> me, <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the LORD.","24":"And they shall go <span class=\"wl wl-kjv\" data-code=\"H3318\">forth,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">look</span> upon the <span class=\"wl wl-kjv\" data-code=\"H6297\">carcases</span> of the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> that have <span class=\"wl wl-kjv\" data-code=\"H6586\">transgressed</span> against me: for their <span class=\"wl wl-kjv\" data-code=\"H8438\">worm</span> shall not <span class=\"wl wl-kjv\" data-code=\"H4191\">die,</span> neither shall their <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> be <span class=\"wl wl-kjv\" data-code=\"H3518\">quenched;</span> and they shall be an <span class=\"wl wl-kjv\" data-code=\"H1860\">abhorring</span> unto all flesh."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"De hemel","tekst":"Zie de aantekening 1Ki 8:27 ; 2Ch 6:18 ; Act 7:48-49 , en Act 17:24 ."},{"catchword":"waar zou dat huis zijn,","tekst":"Alsof hij zeide: Gij moet niet menen dat Ik in een tempel kan besloten worden. Vele Joden te dien tijde meenden dat zij genoeg deden als zij God in den tempel, aan welken zij Hem voornamelijk hielden verbonden, dienden met den uiterlijken godsdienst van Hem bevolen, al leefden zij niet naar al zijne geboden, maar hun leven goddelooslijk aanstelden. Doch deze bestraffing van den uiterlijken godsdienst der Joden moet men alzo verstaan, dat daaronder mede geprofeteerd is van de afschaffing der ceremoniën van het Oude Testament."},{"catchword":"waar is de plaats","tekst":"Of, welke is de plaats mijner rust; gelijk Act 7:49 . De tabernakel en de tempel worden genoemd de rust des Heeren, 1Ch 28:2 ; 2Ch 6:41 , en Psa 132:8 . Zie de aantekening aldaar. Maar van het nieuwe of hemelse Jeruzalem wordt er gezegd, Rev 21:22 :Ik zag een tempel daarin, want de Heere de almachtige God is hun tempel, en het Lam, en nu is de tijd, dat de waarachtige aanbidders den Vader zullen aanbidden in den geest en in der waarheid aan geen plaats gebonden zijnde; Joh 4:21 , Joh 4:23 ."}],"2":[{"catchword":"Want Mijn","tekst":"Dit wordt Act 7:50 vragenderwijze gesteld: Heeft niet mijne hand dit alles gemaakt?"},{"catchword":"hand","tekst":"Dat is, macht."},{"catchword":"en al deze dingen","tekst":"Of, alzo, dies, daaRom."},{"catchword":"zijn geweest,","tekst":"Dat is, bestaan, te weten door mijne kracht. Zie Job 41:2 , en Psa 119:91 , of zijn, is te zeggen blijven; gelijk Exo 24:12 ; Rth 1:2 ; Psa 64:8 ; Dan 1:21 . Zie Psa 37:18 ."},{"catchword":"maar op dezen","tekst":"Of, maar wien zal Ik aanschouwen? dat is, wien zal Ik genadig zijn? dat is, mijne gunst en hulp laten genieten?"},{"catchword":"arme","tekst":"En die zijne armoede bekent, namelijk zijn geestelijke armoede, dat is de ontbering van gerechtigheid."},{"catchword":"verslagene","tekst":"Vanwege het gevoelen of de kennis zijner zonden. Zie Psa 34:19 , en Psa 35:15 , en Psa 51:19 , en Isa 57:15 , Isa 57:18 . Vergelijk Mat 5:3 , en 1Pe 3:4 ."},{"catchword":"die voor Mijn woord beeft","tekst":"Dat is, die mijne majesteit en hoogheid in zulke achting heeft, dat hij vreest en beeft voor mijne geboden, dezelve met kinderlijke vrees en eerbieding ontvangende en zich onderwerpende. Vergelijk Ezr 9:4 , en Ezr 10:3 , onder vs.5; Hos 11:10-11 . Zie ook Exo 19:16 ; Job 37:1 ."}],"3":[{"catchword":"slacht,","tekst":"Hebreeuws, keelt; te weten ter offerande, te weten zonder erkentenis zijner zonden en zonder geloof. Of, ook die het uiterlijk doet ten tijde van het Nieuwe Testament. Zie Isa 1:11 ; Heb 10:1 , Heb 10:4 , Heb 10:11 ."},{"catchword":"slaat een man;","tekst":"Of, verslaat; dat is doodt enen man. De zin is: Dat is mij zo onaangenaam, ja men vertoornt er mij zozeer mede, alsof hij een man versloeg."},{"catchword":"breekt","tekst":"Dat is, hij is als een, die een hond den hals breekt, of onthalst, of den nek afsnijdt; te weten om mij dien te offeren, gelijk Deu 21:4 . En versta hier onder den naam van hond alle onreine dieren, die te offeren in de wet verboden waren."},{"catchword":"zwijnenbloed","tekst":"Zie Lev 11:7-8 , Lev 11:26 ; Deu 14:8 ; alwaar niet alleen verboden wordt zwijnenvlees te eten, maar de Joden mochten het niet aanroeren zonder zich te onreinigen."},{"catchword":"wierook brandt","tekst":"Te weten ter gedachtenis. Zie de aantekening Lev 2:2 . Hebreeuws, die ene gedachtenis van wierook of reukwerk maakt."},{"catchword":"een afgod","tekst":"Zie van het Hebreeuwse woord 1Sa 15:23 ."},{"catchword":"zegent","tekst":"Of looft; dat is dankt, alsof hij een ware god ware."},{"catchword":"Dezen verkiezen","tekst":"De zin is: Zij treden niet op de wegen, die Ik hun heb voorgeschreven, maar zij verkiezen zichzelven wegen, dat is wijzen en manieren van godsdienst, of hun boze lusten en kwade begeerlijkheden."},{"catchword":"aan hun verfoeiselen","tekst":"Dat is, aan hun afgoderijen en ceremoniën, die mij een gruwel zijn. Zie 2Ch 15:8 ; Eze 20:7 , met de aantekening."}],"4":[{"catchword":"Ik zal ook","tekst":"Alsof God zeide: Hebben zij hunne wegen gekozen en ingegaan, Ik zal ook kiezen wat Ik doen zal."},{"catchword":"het loon","tekst":"Anders: Ik zal ook hunne veranderlijkheden kiezen; dat is, Ik zal hen ook straffen vanwege hunne huichelarij, en zal hen hier en daar doen draven en in de gevangenis doen gaan. Anders, om hunner bespottingen wil; dat is, Ik zal hunne boosheid en huichelarij ontdekken, met welke zij mij de ogen menen te verblinden."},{"catchword":"hun vreze","tekst":"Te weten de macht der Chaldeën en andere vijanden, waar zij voor vrezen. Zie Job 39:25 ."},{"catchword":"Ik geroepen heb,","tekst":"Zie Pro 1:24 ; Isa 50:2 , en Isa 56:12 ; Jer 7:13 ."}],"5":[{"catchword":"Hoort des HEEREN woord,","tekst":"Hier spreekt nu God, of de profeet, de godzalige Israëlieten aan, die ten tijde der profeten geweest zijn, en die daarna ten tijde van Christus in Hem zouden geloven, en derhalve van hunne broeders naar het vlees zouden gehaat en vervolgd worden."},{"catchword":"Uw broeders,","tekst":"Te weten valse broeder, huichelaars."},{"catchword":"afzonderen,","tekst":"Of, afscheiden, afkerig van u zijn, u onwaardig van hun gezelschap achtende. Zie Isa 65:5 ."},{"catchword":"om Mijns Naams wil,","tekst":"Dat is, omdat gijlieden de ware religie belijdt, die Ik ulieden te onderhouden gegeven heb ter ere van mijnen naam."},{"catchword":"zeggen","tekst":"Te weten spottende met de dreigementen, die de Heere door zijne profeten laat verkondigen."},{"catchword":"Dat de HEERE","tekst":"Alsof zij zeiden: Dat de Heere zijne macht aan ons bewijze met zijne straffen, waarmede gij ons dreigt. Dit spreken die goddeloze mensen spottenderwijze, verwerpende onheiliglijk al de dreigementen en beloften, die de Heere door zijne profeten deed. Vergelijk Isa 5:19 ."},{"catchword":"Doch Hij zal","tekst":"Of, voorwaar, Hij [te weten de Heere] zal verschijnen; dat is, Hij zal gewisselijk komen, tot ulieder [te weten der godzaligen] vreugde, maar zij [te weten de goddelozen] zullen beschaamd worden; dat is, Ik zal hen straffen en te schande maken, zonder dat de valse goden, op wie zij hun vertrouwen zetten, hen zullen kunnen verlossen."}],"6":[{"catchword":"een stem","tekst":"Anders: het geluid van een gekraak."},{"catchword":"uit de stad","tekst":"Te weten Jeruzalem."},{"catchword":"zijn,","tekst":"Dat is, gehoord worden. Eenigen verstaan de woorden van dit vs. aldus: Daar zal een alarm en weeklacht gehoord worden, als de Chaldeën zullen komen om de stad Jeruzalem en den tempel te verstoren; dit zal zijn de stem des Heeren, die de Chaldeën roepen of verwekken zal om de boze Joden te straffen. Anderen nemen deze woorden aldus: De stem der leraren van het heilig Evangelie, die hunne stem als ene bazuin verheffen zullen, zal uit Jeruzalem voortgaan en uit den tempel gehoord worden, Isa 2:3 , zijnde een genaderijke stem voor de uitverkorenen, maar onaangenaam voor de vijanden Gods, 2Co 2:15-16 ."}],"7":[{"catchword":"zij barensnood","tekst":"Te weten Zion, vs.8; dat is de kerk Gods; en, eer zij barensnood of weeën had, heeft zij gebaard; dat is, de kerk van Christus zal snellijk en onverhoeds aanwassen, doordien haastelijk, boven verwachting, velen uit de heidenen het Evangelie zullen aannemen,, die hun tot kinderen Gods zullen geboren worden; zie Act 2:41 , Act 2:47 , en Act 12:24 . De heidenen zijn bij grote menigten in plaats der goddeloze en ongelovige Joden tot de gemeente van Christus gekomen; zie Act 11:18 , Act 11:23 ."},{"catchword":"van een knechtje","tekst":"Dat is, van een groot en machtig volk, hetwelk vs.8, hare zonen genoemd wordt; en Exo 4:22 , wordt Gods volk genaamd Gods zoon en de eerstgeborene. Vergelijk hiermede Rev 12:5 ."}],"8":[{"catchword":"een land","tekst":"Dat is, de inwoners van een land, een land vol volk."},{"catchword":"op een enigen dag?","tekst":"Dat is, plotseling, in een korten tijd."},{"catchword":"Sion","tekst":"Dat is, Zion heeft hare kinderen gebaard zo haast als haar de weeën of barensnood is aangekomen, zulks is geschied als de predikatie van het heilig Evangelie haastelijk is aangenomen geworden."},{"catchword":"haar zonen gebaard","tekst":"Versta dit van een groot getal der heidenen, die door het geloof van Christus aangewonnen zijn. Zie vs.7."}],"9":[{"catchword":"Zou Ik","tekst":"Of aldus: Zou Ik [anderen] de baarmoeder openbreken, en niet maken dat [Zion] zou baren? Of aldus: Zou Ik tot de geboorte brengen en niet doen baren? dat is, zou Ik een volk ten Evangelie bereiden, en gene genade geven om hetzelve te ontvangen, belijden en beleven? Vergelijk Isa 37:3 ."},{"catchword":"toesluiten?","tekst":"Dat is, onvruchtbaar blijven of laten blijven. Zie Gen 16:2 , en Gen 20:17-18 ."}],"10":[{"catchword":"u","tekst":"O gij gelovige kinderen Gods, gij nieuwgeboren Christenen, van welker geboorte gesproken is vs.8."},{"catchword":"met Jeruzalem,","tekst":"Dat is, met de kerk Gods, het geestelijke Jeruzalem, hetwelk de Heere weder herbouwd en zeer vermeerderd heeft, door de beroeping der heidenen."},{"catchword":"over haar,","tekst":"Of, met haar, of in haar; dat is harenthalve."},{"catchword":"Weest vrolijk","tekst":"Dat is, weest hartelijk verblijd, gelijk Mat 2:10 ."},{"catchword":"zijt treurig","tekst":"Te weten niet alleen om de verwoesting van het aardse Jeruzalem, maar veel meer omdat de kerk Gods door hare vijanden bijna geheellijk is onderdrukt geworden."}],"11":[{"catchword":"Opdat gij","tekst":"Opdat gijlieden moogt deelachtig worden de gaven, die de Heere over zijne kerk rijkelijk zal uitstorten. Zie de aantekening Psa 36:9 ."},{"catchword":"harer vertroostingen;","tekst":"Dat is, van haar veelvoudigen troost, waarmede zij de verslagen conscientiën vertroost. Zie 2Co 1:3-4 ."},{"catchword":"met den glans","tekst":"Of, met den overvloed harer glorie of heerlijkheid."}],"12":[{"catchword":"den vrede","tekst":"Het woord vrede wordt verscheidenlijk genomen in de Heilige Schrift:&lt;i&gt;I.&lt;/i&gt; voor een geestelijken vrede, rijzende uit het geloof aan Christus, Rom 5:1 ;&lt;i&gt;II.&lt;/i&gt; voor een broederlijken vrede, dien de ene mens met den anderen heeft, gelijk Mar 9:50 ; Joh 14:27 ;&lt;i&gt;III.&lt;/i&gt; betekent het ook benevens rust van oorlog, alle heil en welvaart, zo aan de ziel als aan het lichaam. Zie Psa 37:11 ."},{"catchword":"over haar","tekst":"Of, tot haar neigen, of buigen; te weten tot Zion; dat is tot mijne kerk."},{"catchword":"als een rivier,","tekst":"Zie Isa 48:18 ."},{"catchword":"de heerlijkheid","tekst":"Dat is rijkdom. Zie Isa 61:6 , en Rev 21:26 ."},{"catchword":"gijlieden","tekst":"Te weten gij godzalige Joden."},{"catchword":"zuigen;","tekst":"Te weten, de onvervalste melk van het goddelijke Woord."},{"catchword":"op de zijden","tekst":"Dat is, op de armen. De zin is: De Christelijke Kerk en hare leraars zullen met u in alle beleefdheid en vriendelijkheid omgaan, gelijk ene moeder met haar teder kindje doet, niets nalatende van alles wat tot uwe onderrichting en godzaligheid zou mogen strekken. Zie Num 11:12 ; Isa 49:22 , en Isa 60:4 , Isa 60:16 ; Rom 15:1-2 ; Gal 6:1-2 , en 1Th 2:7 ."},{"catchword":"getroeteld","tekst":"Of, geliefkoosd worden."}],"13":[{"catchword":"zal Ik u","tekst":"Dat is, Ik zal ulieden alle vaderlijke en moederlijke liefde bewijzen, en Ik zal ulieden met goedertierenheid omhelzen. Zie Isa 40:11 ."},{"catchword":"te Jeruzalem","tekst":"Dat is, in de gemeente der gelovigen."}],"14":[{"catchword":"uw hart","tekst":"Dat is, ulieder innerlijk gemoed, of inwendige mens; Psa 22:27 , en Psa 69:33 ."},{"catchword":"uw beenderen","tekst":"Dat is, gijlieden zult lustig en levendig gemaakt worden, door de kracht van des Heeren Geest, in plaats waar gij tevoren als verdroogd en van droefenis verwelkt waart. Het woord beenderen betekent somtijds al de ledematen van het lichaam. Zie de aantekening Psa 35:10 , en Psa 51:10 . Zie het tegendeel van dit lid Pro 17:22 ."},{"catchword":"als het tedere gras;","tekst":"Hetwelk in den kouden winter schijnt dood te wezen, maar met de lente verkwikt het weder."},{"catchword":"de hand","tekst":"Dat is, de sterkte en kracht, of de hulp des Heeren."},{"catchword":"aan Zijn knechten,","tekst":"Dat is, aan alle godzaligen."},{"catchword":"gram worden","tekst":"Of gramschap betonen. Het Hebreeuwse woord betekent ook verfoeien, gelijk Num 23:7-8 ."}],"15":[{"catchword":"met vuur komen,","tekst":"Of, in, of als vuur komen. Dit is ene beschrijving der wraak, die God oefenen zal; en het kan verstaan worden van de lichamelijke straf, die God over zijne vijanden brengen zal hier in hun leven, alsook van het jongste gericht; 2Th 1:8-9 . Zie ook Jer 5:14 ."},{"catchword":"wagenen","tekst":"Versta hier, krijgswagens. Vergelijk dit met Psa 68:18 ."},{"catchword":"Zijn toorn","tekst":"Dat is, zijne straffen."},{"catchword":"te wenden,","tekst":"Of, aan te leggen."},{"catchword":"Zijn schelding","tekst":"Dat is, zijnen toorn, zijne straffen. Zie Psa 9:6 ."}],"16":[{"catchword":"vuur,","tekst":"Versta hier het vuur der goddelijke gramschap en wraak. Zie Job 22:20 ."},{"catchword":"en met","tekst":"Eenigen aldus: Dat is met het zwaard."},{"catchword":"Zijn zwaard","tekst":"Hier verstaan enigen het zwaard der Chaldeën en van andere vijanden, die de Heere tegen de Joden zenden zou; daarom noemt Hij hen zijn zwaard. Doch anderen verstaan hier door het zwaard het Woord des Heeren, gelijk Eph 6:17 ; Heb 4:12 ."},{"catchword":"met alle vlees;","tekst":"Dat is, met alle goddeloze mensen, die hem ongehoorzaam en wederspannig zullen geweest zijn."}],"17":[{"catchword":"Die","tekst":"Eene verklaring hoedanig die vijanden waren, die de Heere verslaan zou, te weten die de afgoden eren en hun leven naar de wet van God niet aanstellen."},{"catchword":"zichzelven heiligen,","tekst":"Te weten naar de wijze der afgodendienaars om hunnen valsen goden te behagen."},{"catchword":"in de hoven,","tekst":"Of, tot de hoven; dat is om in de hoven der afgoden te gaan offeren. Zie Isa 1:29 , en Isa 65:3 ."},{"catchword":"achter een","tekst":"Dat is, de een achter den ander, of na elkander. Eenigen verstaan hier onder een een put of poel in de hoven gelegen, bij of achter welken zij zich met het water deszelven wiesen, om alzo zichzelven te reinigen; anderen, achter enen [boom]; dat is, achter een gehucht bomen, enigen afgod toegeëigend; anderen, achter den [tempel] van den eenen, te weten God, die Een genoemd wordt, Deu 6:4 , ook noemen sommigen onder de heidenen God den Eenen; anderen, achter [den tempel des afgods] Achad, welken Achad zij menen te zijn een afgod bij de Assyriërs, vertegenwoordigende de zon."},{"catchword":"in het midden","tekst":"Dat is, openlijk."},{"catchword":"die zwijnenvlees","tekst":"Zie boven vs.3; Lev 11:7 , enz."},{"catchword":"verteerd worden,","tekst":"Dat is, uitgeroeid worden."}],"18":[{"catchword":"Hun werken","tekst":"Anders: maar mij aangaande, o hunne werken, enz., alsof God, nadat Hij in het voorgaande vers, vs.17, de gruwelijke afgoderij der goddeloze Joden bestraft had, een bedreiging hierbij voegde, sprekende als de vertoornde, met korte afgebroken woorden. Of men kan deze woorden aldus stellen: Zou Ik hunne werken en hunne gedachten [verdragen]? Alsof Hij zeide: Ik zal ze geenszins verdragen, maar op een korten tijd zal Ik alle heidenen vergaderen, enz."},{"catchword":"Het komt,","tekst":"Dat is, de tijd komt."},{"catchword":"dat Ik vergaderen","tekst":"Dat is, in de plaats der boze en goddeloze Joden zal Ik de heidenen roepen, en Ik zal hun mijne heerlijkheid openbaren."},{"catchword":"tongen,","tekst":"Dat is, allerlei volken, die verscheidene talen spreken."},{"catchword":"Mijn heerlijkheid","tekst":"Die God de Heere in het Evangelie openbaart, verlossende het menselijke geslacht door Jezus Christus."},{"catchword":"zien","tekst":"Dat is, deelachtig worden."}],"19":[{"catchword":"een teken","tekst":"Waaraan men de bekeerde Joden voor mijne kinderen en dienaars moge kennen. Dit teken is de belijdenis der leer van het Christelijke geloof en het gebruik der heilige sacramenten; en innerlijk de Heilige Geest, door welken zij verzegeld worden; Eph 1:13 ."},{"catchword":"die het ontkomen","tekst":"Te weten uit de verwerping van den groten hoop, uit het algemene verderf en den ondergang der Joden; gelijk vervuld is in de apostelen en anderen, die het Evangelie onder de heidenen hebben verkondigd."},{"catchword":"naar Tarsis,","tekst":"Te weten tot degenen, die in Tharsis wonen, en zo in het volgende. Van Tharsis zie de aantekening 1Ki 10:22 ."},{"catchword":"Pul,","tekst":"Dit meent men dat de Afrikanen betekent. Pul was ook een naam van een koning van Assyrië. Zie 2Ki 15:19-20 , en 1Ch 5:26 ."},{"catchword":"Lud,","tekst":"Zie Gen 10:13 , Gen 10:22 ."},{"catchword":"de boogschutters,","tekst":"Hebreeuws, de boogtrekkers, of de boogspanners; dat is, die met den boog schieten. Vergelijk Jer 46:9 ."},{"catchword":"Tubal","tekst":"Zie Gen 10:2 ."},{"catchword":"Javan,","tekst":"Dat is, de Grieken; zie Gen 10:2 ."},{"catchword":"Mijn gerucht","tekst":"Hebreeuws, mijn gehoor, of horing; dat is, die van mij niet gehoord hebben, die de predikatie van het heilig Evangelie nog niet gehoord hadden. Zie Rom 10:16-17 . Anderen, die het gerucht, gelangende mijn grote macht, nog niet gehoord hadden."},{"catchword":"zij zullen Mijn heerlijkheid","tekst":"Of, dezelve; te weten die Ik tot de heidenen zal zenden, namelijk de apostelen en andere leraars, als Barnabas, Silas, Timotheus, Titus, Lukas, enz."}],"20":[{"catchword":"al uw broeders","tekst":"Te weten uwe broeders in Christus, of geloofsgenoten, de uitverkoren heidenen, die bekeerd zijnde door de predikatie van het heilig Evangelie tot Abrahams kinderen zullen gemaakt worden, en dienvolgens der Joden broeders zijn zullen."},{"catchword":"ten spijsoffer","tekst":"Of, tot ene offerande, om den Heere geofferd te worden. Anders: tot een geschenk. Zie Rom 15:16 ; alzo ook onder in vs.20."},{"catchword":"op paarden,","tekst":"Dat is, met alle vlijt, en behulpelijke middelen."},{"catchword":"op rosbaren,","tekst":"Of, op bedekte wagens, op koetsen."},{"catchword":"op snelle lopers,","tekst":"Of, op snelle beesten, of op postpaarden."},{"catchword":"naar Mijn heiligen berg","tekst":"Dat is, tot de gemeenschap der heiligen; zie Isa 2:2 ."},{"catchword":"naar Jeruzalem,","tekst":"Uit vs.23 is wel af te nemen dat dit niet is te verstaan van het stoffelijke Jeruzalem, want het is onmogelijk dat alle vlees alle maanden, of alle weken, daar komen zou om te aanbidden."}],"21":[{"catchword":"uit dezelve","tekst":"Te weten uit de bekeerde heidenen."},{"catchword":"tot priesters","tekst":"Dat is, tot leraars en tot predikanten van het heilig Evangelie. Zie Rom 15:16 ; Phi 2:17 ."}],"22":[{"catchword":"die nieuwe hemel","tekst":"Zie Isa 65:17 , en 2Pe 3:13 ; Rev 21:1 ."},{"catchword":"ulieder zaad","tekst":"Dat is, daar zal altijd op de wereld ene kerk en een hoopje der gelovigen zijn en blijven. Het rijk van Christus wordt Heb 12:28 genoemd een onbeweeglijk koninkrijk."}],"23":[{"catchword":"van de ene","tekst":"Hebreeuws, van [den tijd der] nieuwe maan tot zijn nieuwe maan; dat is, steeds aan een ander, zonder onderscheid der dagen, die in het Oude Testament verordineerd waren. Vergelijk Col 2:16 ."},{"catchword":"tot den anderen,","tekst":"Hebreeuws, tot zijnen sabbat."},{"catchword":"alle vlees","tekst":"Dat is, allerlei volken op aarde, zo heidenen als Joden. Zie Joe 2:28 ; Act 2:17 . Zie ook boven vs.20."}],"24":[{"catchword":"zij zullen henen","tekst":"Te weten de ware ledematen der gemeente, de gelovigen."},{"catchword":"de dode lichamen","tekst":"Dit kan wel naar de letter genomen worden, gelijk Isa 34:3 , en elders; doch hier kan het ook genomen worden voor zodanigen, die in zonden dood zijn, ofschoon zij leven naar het lichaam, gelijk 1Ti 5:6 , en Rev 20:5 ."},{"catchword":"zien,","tekst":"En zich verblijden vanwege de rechtvaardige straf des Heeren over de goddelozen, zowel in dit als in het toekomende leven. Vergelijk Rev 12:10 , enz., en Rev 19:1-2 , enz."},{"catchword":"hun worm","tekst":"Christus past deze woorden op de vervloekten in de hel, waar de worm der conscientie niet sterft, maar altijd knaagt, en het vuur van den toorn Gods nimmermeer uitgeblust wordt; Mar 9:44 ."},{"catchword":"allen vlees","tekst":"Te weten allen uitverkorenen kinderen Gods, of allen anderen creaturen."},{"catchword":"een afgrijzing wezen","tekst":"Of, gruwel, of vloek zijn. Het Hebreeuwse woord wordt alleen hier en Dan 12:2 gevonden. In beide plaatsen wordt er gesproken van hardnekkige zondaars, van wie alle vromen en alle godzalige personen walg hebben."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Thus saith the LORD, the heaven is my throne, and the earth is the footstool of my feet.: [ see the Annotat. 1 kings 8.27 and 2 Chron. 6.18. Act 7:48,49 and 17.24] where should that house be that ye should build unto me? [As if he had said, ye must not think that i can be shut up in the Temple. Many Jews in those times thought that they did enough when they worshipped God in the Temple (whereunto they themselves especially tied) with the outward worship that was enjoined them, although they did not live according to all his commandments, but lived wicked lives. But this reproof of the outward worship of the Jews, must be so understood as that under it is likewise prophesied of the disannulling of the ceremonies of the Old Testament] and where is the place of rest? [Or, which is the place of my rest? As Act 7:49. the Tabernacle and the Temple are called the rest of the Lord, 1 Chron. 28. 2 and 2 Chron. 6.41 and Psal.132.8. see the Annotat there. But of the new heavenly Jerusalem it is said, Revel. 21.22. i saw no Temple therein, for the Lord the Almighty God is the Temple of it, and land. And now is the time that the true worshippers shall worship the father in spirit and in truth, being tied to no certain house or place, Job 4:21,24]"}],"2":[{"catchword":null,"tekst":"For mine hand [That is, power] hath made all these things, [this is set down by way of questing on, Act 7:50 hath not mine handmade all these things?] and [or, so therefore] all these things have been, [that is, subsist, to wit, by my power. See Psal.119.91 and Job 41:2. or, to be signifieth to continue, as Exod. 24.12. Ruth 1.2 Psal. 64.8. Dan.1.21. see Psal. 37 on ver. 18] speaketh the LORD, but to this (man) will i look, [Or, upon whom shall i look? That is, unto shall i be gracious, that is, whom shall i cause to enjoy my favour and help? To him that is poor, [And he that acknowledgeth his poverty, namely his spiritual poverty; that is, the want righteousness] and contrite spirit. By reason of the sense or acknowledge of his sins. See Psal.34 on vers. 19 and Psal. 35 on vers. 15 and 51.19 and above chap. 57.18. compare Matth. 5.3. and 1 Pet.3.4.] and that trembleth at my word. [that is, that so highly regarded my Majesty & excellency, as that he feareth and trembleth at my commandments, receiving them and submitting himself unto them with a child like fear and reverence. Compare Ezra.9.4 and 10.3, below ver. 5. Hos. 11, 10. See also Exo 19:16 . Job 37:1.]"}],"3":[{"catchword":null,"tekst":"Who so killeth an ox, [Heb, throateth. To wit, for an offering; with acknowledgement of his sins and without faith, or he that doth it outwardly in the time of the new Testament. See above chap.1.11. Heb 10.1,11.] smitteth [or slayeth] a man: [that is, killeth a man. The meaning is, it as displeasing unto me, ye he doth as exceedingly provoke me to anger, as if he slew a man] who so offereth a lamb, breaketh a dogs neck: [that is, he is like one that breaketh a dogs neck, or beheadeth a dog, or cutteth off neck; to wit to offer it unto me, as Deut. 21.4. and understand here under the name of dog all kinds of unclean beasts, which were forbidden in law to be offered] who so offereth a meat-offering, is (as he that offereth) swines blood: see Levit. 11. Ver.7,8,9. Deut. 14.8 where not onely swines flesh is forbidden to be eaten, but the a Jews were not allowed to touch it without desiling themselves therewith] who so burneth frankincense for a remembrance-offering, [to wit, for memorial. See the Annotat. Levit. 2. On verse 2. Heb. He that maketh a remembrance of incense, or frankincense] is (as)_ he that blesseth an idol: [or, praiseth an idol: [or praiseth an idol: that is, giveth thanks, as if he were a true God. See of the Hebrew word rendered an idol, 1 Sam. 15 on ver.23.] these also choose their (own) ways [the meaning is, they walk not in the ways that i have prescribed unto them, but they choose ways unto themselves; ways and manners of worship; or their own wicked lusts, & evil concupiscence&acirc;&euro;&trade;s] their soul delighteth in their abominations. [That is, in their idolatries and ceremonies, which are an abomination to me. See 2 Chron. 18.8. Eze 20:7. with the Annotat.]"}],"4":[{"catchword":null,"tekst":"I will also choose (the reward) of their dealings, [as if God should say, have they chosen their own ways and walked in them? I also will choose the thing that i will do [others, i will also choose their mutabilities; that is, i will also punish them for their hypocrisy and will make them to trot up and down and to go into captivity [Others, for their delusions; that is, i will discover their wickedness, and hypocrisy, whereby they mean to blind mine eyes] and will cause their fears] to wit, the power of the Chaldeans and others enemies, which they are afraid of.] see Job chap. 39 on ver. 25.] to come upon them; because i called, and none did answer; [see Prov. 1.14 above chap.50.2 and 65.12 and Jer. 7.13] but did that which is evil in mine eyes, [see above chap. 65.12] and chose that in which I delighted not."}],"5":[{"catchword":null,"tekst":"Hear the word of the Lord, ye that tremble at his word: Your brethren that hate you, that separate you far off my names sake, [here now God or the prophet speaketh to the godly Israelites that lived in the time of the prophets, and which afterwards in the time of Christ should believe in him, and should therefore be hated and persecuted of their brethren according to the flesh (your brethren) to wit, false brethren, hypocrites, (that separate you) or fever you, are a verse from you, counting you unworthy of their company. See above chap.65.5. (for my names sake) that is, because you profess the true religion, which i have given you to observe to the honour of my name] say [to wit, mocking at the threatening which the Lord causeth to be denounced by his prophets] let the Lord shew his power on us by his judgements where with thou dost threaten us. This those wicked men speak in a scoffing way, profanely rejecting all the threatening which the Lord causeth to be denounced by his Prophets] let the Lord be glorious: [As if they had said, let the Lord shew his power on us by his judgements, wherewith thou dost threaten us. This those wicked men speak in a scoffing way, profanely rejecting all the threatening and promises which the Lord made by his Prophets. Compare above chap. 5.19.] but he shall appear to your joy, they on the contrary shall be ashamed [Or verily he (to wit, the Lord) shall appear (that is, he shall surely come) to your joy (to wit, to the joy of the Godly) but they (to wit the wicked) shall be ashamed; that is, i will plague them and bring them to shame: neither shall their false gods in whom they put their confidence, be able to deliver them.]"}],"6":[{"catchword":null,"tekst":"There shall be [that is, he heard] a voice of a great rumour [others, the sound of a noise] from the city, [to wit Jerusalem] a voice from the Temple, the voice of the Lord, that recompeseth desert to his enemies. [some understand the words of this verse this, there shall be heard an alantum and lamentation, when the Chaldeans shall come shall come to destroy the city of Jerusalem and the temple: this shall be the voice of the Lord, who shall call, or stir up the Chaldeans, to punish the wicked Jews. Others take these words thus, the voice of the teachers of the Gospel, that shall lift up their voice like a trumpet, shall go forth from Jerusalem, and be heard from the temple, above chap.2.3. being a gracious voice unto the elect, but displeasing unto the enemies of God, 2 Cor.2 15,16.]"}],"7":[{"catchword":null,"tekst":"Before she [to wit, Zion, ver. 8, that is, the church of God] travelled [Or, bad had pangs, sorrows] she brought forth; [that is, the church of Christ shall suddenly and unware increase, in regard that suddenly and beyond expectation, many of the Gentiles shall suddenly and unawares increase, in regard that suddenly and beyond expectation, many of the Gentiles sh // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte

function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];

}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;

  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
