l":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Bel is gekromd, Nebo wordt neergebogen, hun afgoden zijn geworden voor de dieren en voor de beesten; uw opgeladen pakken zijn een last voor de vermoeide *beesten*.","2":"Samen zijn zij neergebogen, zij zijn gekromd, zij hebben de last niet kunnen redden, maar zijzelf zijn in de gevangenis gegaan.","3":"Hoor naar Mij, o huis van Jakob, en het hele overblijfsel van het huis van Israël! Die *van Mij* gedragen zijn vanaf de buik af, *en* opgenomen vanaf de baarmoeder af.","4":"En tot de ouderdom toe zal Ik Dezelfde zijn, ja, tot de grijsheid toe zal Ik *u* dragen; Ik heb het gedaan, en Ik zal *u* opnemen, en Ik zal dragen en redden.","5":"Aan wie zou u Mij gelijk maken, en gelijkstellen, en Mij vergelijken, dat wij op elkaar zouden lijken?","6":"Zij verkwisten het goud uit de beurs, en wegen het zilver met de weegschaal; zij huren een goudsmid, en die maakt het tot een god, zij knielen neer, ook buigen zij zich *daarvoor*.","7":"Zij nemen hem op de schouder, zij dragen hem, en zetten hem op zijn plaats; daar staat hij, hij wijkt niet van zijn plaats; ja, roept *iemand* tot hem, dan antwoordt hij niet, hij verlost hem niet uit zijn benauwdheid.","8":"Denk hieraan, en wees kloek, breng het weer in het hart, o overtreders!","9":"Denk aan de vorige dingen van oude tijden af, dat Ik God ben, en er is geen God meer, en er is niets gelijk Ik;","10":"Die vanaf het begin aan verkondigt het einde, en van oudsher af die dingen, die nog niet gebeurd zijn; Die zegt: Mijn raad zal standhouden, en Ik zal al Mijn welbehagen doen.","11":"Die een roofvogel roept van het oosten, een man van Mijn raad uit een ver land; ja, Ik heb *het* gesproken, Ik zal het ook doen komen; Ik heb *het* geformeerd, Ik zal het ook doen.","12":"Hoor naar Mij, u die hardnekkig van hart bent, u, die ver van de gerechtigheid zijt!","13":"Ik breng Mijn gerechtigheid nabij, zij zal niet ver weg zijn, en Mijn heil zal niet uitblijven; maar Ik zal heil geven in Sion, aan Israël Mijn heerlijkheid."},"SV":{"1":"Bel is gekromd, Nebo wordt nedergebogen, hun afgoden zijn geworden voor de dieren en voor de beesten; uw opgeladen pakken zijn een last voor de vermoeide *beesten*.","2":"Samen zijn zij nedergebogen, zij zijn gekromd, zij hebben den last niet kunnen redden, maar zijzelven zijn in de gevangenis gegaan.","3":"Hoor naar Mij, o huis van Jakob, en het ganse overblijfsel van het huis Israëls! die *van* *Mij* gedragen zijt van den buik aan, *en* opgenomen van de baarmoeder af.","4":"En tot den ouderdom toe zal Ik Dezelfde zijn, ja, tot de grijsheid toe zal Ik *ulieden* dragen; Ik heb het gedaan, en Ik zal *u* opnemen, en Ik zal dragen en redden.","5":"Wien zoudt gijlieden Mij nabeelden, en evengelijk maken, en Mij vergelijken, dat wij elkander gelijken zouden?","6":"Zij verkwisten het goud uit de beurs, en wegen het zilver met de waag; zij huren een goudsmid, en die maakt het tot een god, zij knielen neder, ook buigen zij zich *daarvoor*.","7":"Zij nemen hem op den schouder, zij dragen hem, en zetten hem aan zijn plaats; daar staat hij, hij wijkt van zijn stede niet; ja, roept *iemand* tot hem, zo antwoordt hij niet, hij verlost hem niet uit zijn benauwdheid.","8":"Gedenkt hieraan, en houdt u kloekelijk, brengt het weder in het hart, o gij overtreders!","9":"Gedenkt der vorige dingen van oude tijden af, dat Ik God ben, en er is geen God meer, en er is niet gelijk Ik;","10":"Die van den beginne aan verkondigt het einde, en van ouds af die dingen, die nog niet geschied zijn; Die zegt: Mijn raad zal bestaan, en Ik zal al Mijn welbehagen doen.","11":"Die een roofvogel roept van het oosten, een man Mijns raads uit verren lande; ja, Ik heb *het* gesproken, Ik zal het ook doen komen; Ik heb *het* geformeerd, Ik zal het ook doen.","12":"Hoort naar Mij, gij stijven van harte, gij, die verre van de gerechtigheid zijt!","13":"Ik breng Mijn gerechtigheid nabij, zij zal niet verre wezen, en Mijn heil zal niet vertoeven; maar Ik zal heil geven in Sion, aan Israël Mijn heerlijkheid."},"KJV":{"1":"Bel boweth down, Nebo stoopeth, their idols were upon the beasts, and upon the cattle: your carriages *were* heavy loaden; *they are* a burden to the weary","2":"They stoop, they bow down together; they could not deliver the burden, but themselves are gone into captivity.","3":"Hearken unto me, O house of Jacob, and all the remnant of the house of Israel, which are borne *by me* from the belly, which are carried from the womb:","4":"And *even* to *your* old age I *am* he; and *even* to hoar hairs will I carry *you*: I have made, and I will bear; even I will carry, and will deliver","5":"To whom will ye liken me, and make *me* equal, and compare me, that we may be like?","6":"They lavish gold out of the bag, and weigh silver in the balance, *and* hire a goldsmith; and he maketh it a god: they fall down, yea, they worship.","7":"They bear him upon the shoulder, they carry him, and set him in his place, and he standeth; from his place shall he not remove: yea, *one* shall cry unto him, yet can he not answer, nor save him out of his trouble.","8":"Remember this, and shew yourselves men: bring *it* again to mind, O ye transgressors.","9":"Remember the former things of old: for I *am* God, and *there is* none else; *I am* God, and *there is* none like","10":"Declaring the end from the beginning, and from ancient times *the things* that are not *yet* done, saying, My counsel shall stand, and I will do all my pleasure:","11":"Calling a ravenous bird from the east, the man that executeth my counsel from a far country: yea, I have spoken *it*, I will also bring it to pass; I have purposed *it*, I will also do","12":"Hearken unto me, ye stouthearted, that *are* far from righteousness:","13":"I bring near my righteousness; it shall not be far off, and my salvation shall not tarry: and I will place salvation in Zion for Israel my glory."}},"tsk":{"1":[{"kopje":"Bel","refs":["Jes 21:9","Jes 41:6","Jes 41:7","Ex 12:12","1 Sam 5:3","Jer 48:1-25","Jer 50:2","Jer 51:44","Jer 51:47","Jer 51:52"]},{"kopje":"een last","refs":["Jes 2:20","Jer 10:5"]}],"2":[{"kopje":"hebben niet kunnen","refs":["Jes 36:18","Jes 36:19","Jes 37:12","Jes 37:19","Jes 44:17","Jes 45:20"]},{"kopje":"maar","refs":["Richt 18:17","Richt 18:18","Richt 18:24","2 Sam 5:21","Jer 43:12","Jer 43:13","Jer 48:7"]}],"3":[{"kopje":"Hoor","refs":["Jes 44:1","Jes 44:21","Jes 48:1","Jes 48:17","Jes 48:18","Jes 51:1","Jes 51:7","Ps 81:9-14"]},{"kopje":"het hele overblijfsel","refs":["Jes 1:9","Jes 10:22","Jes 11:11","Jes 37:4"]},{"kopje":"gedragen","refs":["Jes 44:1","Jes 44:2","Jes 49:1","Jes 49:2","Jes 63:9","Ex 19:4","Deut 1:31","Deut 32:11","Deut 32:12","Ps 22:10","Ps 22:11","Ps 71:6","Ezech 16:6-16"]}],"4":[{"kopje":"tot de ouderdom toe","refs":["Jes 41:4","Jes 43:13","Jes 43:25","Ps 92:15","Ps 102:27","Ps 102:28","Mal 2:16","Mal 3:6","Rom 11:29","Hebr 1:12","Hebr 13:8","Jak 1:17"]},{"kopje":"tot de grijsheid toe","refs":["Ps 48:15","Ps 71:18"]}],"6":[{"kopje":"verkwisten","refs":["Jes 40:19","Jes 40:20","Jes 41:6","Jes 41:7","Jes 44:12-19","Jes 45:20","Ex 32:2-4","Richt 17:3","Richt 17:4","1 Kon 12:28","Jer 10:3","Jer 10:4","Jer 10:9","Jer 10:14","Hos 8:4-6","Hab 2:18-20","Hand 17:29"]},{"kopje":"knielen neer","refs":["Jes 2:8","Jes 44:17","Dan 3:5-15"]}],"7":[{"kopje":"zij dragen hem","refs":["1 Sam 5:3","Jer 10:5","Dan 3:1"]},{"kopje":"roept iemand","refs":["Jes 37:38","Jes 45:20","Richt 10:12-14","1 Kon 18:26","1 Kon 18:40","Jer 2:28","Jona 1:5","Jona 1:14-16"]}],"8":[{"kopje":"Denk","refs":["Jes 44:18-21","Deut 32:29","Ps 115:8","Ps 135:18","Jer 10:8","1 Kor 14:20"]},{"kopje": <span class=\"wl wl-kjv\" data-code=\"H3240\">place,</span> and he <span class=\"wl wl-kjv\" data-code=\"H5975\">standeth;</span> from his <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> shall he not <span class=\"wl wl-kjv\" data-code=\"H4185\">remove:</span> yea, one shall <span class=\"wl wl-kjv\" data-code=\"H6817\">cry</span> unto him, yet can he not <span class=\"wl wl-kjv\" data-code=\"H6030\">answer,</span> nor <span class=\"wl wl-kjv\" data-code=\"H3467\">save</span> him out of his trouble.","8":"<span class=\"wl wl-kjv\" data-code=\"H2142\">Remember</span> this, and shew yourselves <span class=\"wl wl-kjv\" data-code=\"H377\">men:</span> bring it <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> to <span class=\"wl wl-kjv\" data-code=\"H3820\">mind,</span> O ye transgressors.","9":"<span class=\"wl wl-kjv\" data-code=\"H2142\">Remember</span> the former <span class=\"wl wl-kjv\" data-code=\"H7223\">things</span> of <span class=\"wl wl-kjv\" data-code=\"H5769\">old:</span> for I am <span class=\"wl wl-kjv\" data-code=\"H410\">God,</span> and there is none else; I am <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and there is <span class=\"wl wl-kjv\" data-code=\"H657\">none</span> like","10":"<span class=\"wl wl-kjv\" data-code=\"H5046\">Declaring</span> the <span class=\"wl wl-kjv\" data-code=\"H319\">end</span> from the <span class=\"wl wl-kjv\" data-code=\"H7225\">beginning,</span> and from ancient <span class=\"wl wl-kjv\" data-code=\"H6924\">times</span> the things that are not yet <span class=\"wl wl-kjv\" data-code=\"H6213\">done,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> My <span class=\"wl wl-kjv\" data-code=\"H6098\">counsel</span> shall <span class=\"wl wl-kjv\" data-code=\"H6965\">stand,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> all my pleasure:","11":"<span class=\"wl wl-kjv\" data-code=\"H7121\">Calling</span> a ravenous <span class=\"wl wl-kjv\" data-code=\"H5861\">bird</span> from the <span class=\"wl wl-kjv\" data-code=\"H4217\">east,</span> the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> that executeth my <span class=\"wl wl-kjv\" data-code=\"H6098\">counsel</span> from a <span class=\"wl wl-kjv\" data-code=\"H4801\">far</span> <span class=\"wl wl-kjv\" data-code=\"H776\">country:</span> yea, I have <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> it, I will also <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> it to pass; I have <span class=\"wl wl-kjv\" data-code=\"H3335\">purposed</span> it, I will also do","12":"<span class=\"wl wl-kjv\" data-code=\"H8085\">Hearken</span> unto me, ye <span class=\"wl wl-kjv\" data-code=\"H47\">stouthearted,</span> that are far <span class=\"wl wl-kjv\" data-code=\"H7350\">from</span> righteousness:","13":"I bring <span class=\"wl wl-kjv\" data-code=\"H7126\">near</span> my <span class=\"wl wl-kjv\" data-code=\"H6666\">righteousness;</span> it shall not be far <span class=\"wl wl-kjv\" data-code=\"H7368\">off,</span> and my <span class=\"wl wl-kjv\" data-code=\"H8668\">salvation</span> shall not <span class=\"wl wl-kjv\" data-code=\"H309\">tarry:</span> and I will <span class=\"wl wl-kjv\" data-code=\"H5414\">place</span> <span class=\"wl wl-kjv\" data-code=\"H8668\">salvation</span> in <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion</span> for <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> my glory."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"is gekromd,","tekst":"Bel is de naam van den voornaamsten afgod der Babyloniërs; zie Dan 1:2 in de aantekening. Als de stad Babel van de Perzen is ingenomen geweest, zo zijn ook de goden der Babyloniërs verstoord en als gevankelijk naar Perzië gevoerd geworden."},{"catchword":"Nebo","tekst":"Nebo is ook de naam van een afgod bij de Babyloniërs."},{"catchword":"hun","tekst":"Te weten der Babyloniërs."},{"catchword":"afgoden","tekst":"Hebreeuws, smarten; omdat de afgoden dengenen, die hen dienen, smarten veroorzaken."},{"catchword":"zijn geworden","tekst":"Dat is, zij zijn geladen op de dieren en de beesten, namelijk, dat die hen in Perzië zouden brengen."},{"catchword":"uw opgeladen","tekst":"De zin is: de lastdragende beesten, die de Perzen gebruiken zullen om uwe afgoden te vervoeren, zullen er zo zwaar mede geladen zijn, dat zij er moede van worden zullen."}],"2":[{"catchword":"Tezamen","tekst":"De zin is: Zij, te weten de afgoden van Babel, hebben niet kunnen beletten dat de Perzen een groten buit uit Babylonië uitvoeren zouden; ja zij moeten zelfs mede in de gevangenis, zulke fraaie en dappere goden zijn zij. Anderen verstaan het aldus: De lastdragende beesten, die de beelden droegen, waren daarmede zo overladen, dat zij krom en gebogen gingen."},{"catchword":"zij hebben den last","tekst":"Te weten de afgoden, of de Babyloniërs."},{"catchword":"zijzelven","tekst":"Hebreeuws, hunne ziel, zijzelven; alzo Isa 47:14 ."},{"catchword":"zijn in de gevangenis gegaan","tekst":"Dat is, zij zullen gevankelijk weggevoerd worden naar Perzië."}],"3":[{"catchword":"gij die van Mij","tekst":"Dat is, voor wie Ik steeds zorg draag, wiens schut en scherm Ik altoos geweest ben. Zie Exo 19:4 ; Deu 1:31 , en Deu 32:11 ; Psa 22:11 en Psa 71:6 ."},{"catchword":"van den buik aan,","tekst":"Of, van [moeders] buik af. De zin is: Ik ben met u bezwaard geweest, als ene moeder met haar kind, en heb u beschermd en verzorgd van uw eersten oorsprong af."},{"catchword":"van de baarmoeder af","tekst":"Dat is, zo haast als gij geboren zijt."}],"4":[{"catchword":"tot de ouderdom","tekst":"Dat is, totdat gij oud en grijs zult geworden zijn."},{"catchword":"dragen;","tekst":"Gelijk ene moeder of voedster haar jong kind draagt; dat is, Ik zal u wel verzorgen."},{"catchword":"redden","tekst":"Te weten uit de Babylonische gevangenschap, of uit allen nood."}],"6":[{"catchword":"Zij","tekst":"Te weten afgodendienaars."},{"catchword":"verkwisten","tekst":"Of, zij verkwisten onnut. Het Hebreeuwse woord betekent eigenlijk het geld overvloediglijk verkwisten, als geen werk daarvan makende of hetzelve niet achtende; zodat hier te kennen wordt gegeven de dwaasheid der afgodendienaars en beroving hunner zinnen."},{"catchword":"de waag;","tekst":"Of, waagpen, evenaar, of tong der weegschaal."},{"catchword":"een goudsmid,","tekst":"Hebreeuws, een smelter; gelijk Isa 41:7 ."},{"catchword":"tot een god,","tekst":"Dat is, tot een afgod."}],"7":[{"catchword":"aan zijn plaats;","tekst":"Hebreeuws, onder zich."},{"catchword":"hem niet","tekst":"Te weten den afgodendienaar."}],"8":[{"catchword":"hieraan,","tekst":"Of, aan dit, of van dezen."},{"catchword":"houdt","tekst":"Of, houdt u mannelijk, of zijt gefondeerd; ziet toe dat gij u niet laat bedriegen, noch bewegen of brengen tot den dienst der afgoden, door vrees of door het voorbeeld der Babyloniërs."},{"catchword":"brengt het","tekst":"Of, brengt het den overtreders weder in het hart."},{"catchword":"o gij overtreders","tekst":"Die mijn verbond verlaat en u van de afgodendienaars laat verleiden."}],"9":[{"catchword":"der vorige dingen","tekst":"Te weten de weldaden en wonderwerken, die Ik ulieden of mijne kerk eertijds bewezen heb."},{"catchword":"van oude tijden af,","tekst":"De rede zou aldus voller zijn: Die geschied zijn van oude tijden af."},{"catchword":"gelijk Ik;","tekst":"Of, mij gelijk."}],"10":[{"catchword":"Die van den beginne","tekst":"Dat is, Ik die de toekomende dingen voorzeg lang tevoren eer zij geschieden, doende daarmede blijken dat Ik alleen de ware God ben."}],"11":[{"catchword":"een roofvogel","tekst":"Versta Cores, die zo snellijk met zijn heirleger uit Perzië in Babylonië zal komen en hen beroven, alsof hij een snelvliegende roofvogel ware, en vloog."},{"catchword":"van het oosten,","tekst":"Te weten uit Perzië, dat de Babyloniërs tegen het oosten ligt."},{"catchword":"een man","tekst":"Dat is, een man, die mijn raadslag doe en in het werk stel, Babel verwoest, en mijn volk uit de gevangenschap verlos."},{"catchword":"geformeerd,","tekst":"Te weten in mijnen zin, of in mijn geheimen raad. Ik heb besloten, Ik heb het mij voorgenomen."}],"12":[{"catchword":"gij stijven","tekst":"Of, gij stouten, stuggen, hardnekkigen, eigenzinnigen van harte, gij boosaardige Joden."},{"catchword":"gij, die verre","tekst":"Alsof God zeide: Gijlieden, die mijne genade gans onwaardig zijt, omdat gij de vroomheid en ware godzaligheid naar behoren niet behartigt."}],"13":[{"catchword":"Ik breng","tekst":"Of, Ik zal brengen, of Ik heb gebracht, en aldus dikwijls bij de profeten, die vanwege de zekerheid hunner profetieën dikwijls van ene zaak, die nog aanstaande is, spreken alsof zij reeds voltrokken ware."},{"catchword":"Mijn gerechtigheid","tekst":"Dat is, het werk mijner gerechtigheid; te weten de verlossing van mijn volk uit de Babylonische gevangenschap en voorts door den Heere Christus uit hun geestelijke ellende. Zie boven Isa 45:8 ."},{"catchword":"Mijn heil","tekst":"Dat is, de verlossing, die Ik mijn volk bewijzen zal, het uit de gevangenschap verlossende."},{"catchword":"aan Israël","tekst":"Dat is, zulk ene verlossing, door welke mijn volk Israël grotelijks zal verheerlijkt worden. Anders: [tot] mijne heerlijkheid, te weten door dit heerlijke werk der verlossing zal openbaar gemaakt en geroemd worden. Anders: om Israëls wil, dat mijne heerlijkheid is."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Bel [Bel is the name of the chiefest Idol of the Babylonians. See Dan.1.2. in the Annotat.] is bended, Nebo [This is also the name of an Idol among the Babylonians] is bowed down, [when the city of Babel was taken by the Persians, then were also the Gods of the Babylonians destroyed, and as it were carried away captive to Persia] their Idols [to wit, the Idols of the Babylonians. Heb. Their sorrows, because Idols occasion sorrows to those that serve and worship them] are become for the beasts and for the cattle, namely, that they might carry them into Persia] your packs loaden are a burden for the wearied beasts which the Persians shall make use of for the transportation and carrying away of your Idols, shall be so heavily loaden therewith, that they shall grow weary of them.]"}],"2":[{"catchword":null,"tekst":"They are bowed down, they are bended: [The meaning is, they, to wit, the Idols of Babels, were not able to hinder the Persians from carrying away a great prey out of Babylon; yea they themselves must also go into captivity: such goodly powerful Gods are they. Others understand it thus; The burden-bearing beasts that carried the Images, were so extremely laden therewith, as that they went crooked and bowed down,] they [to wit, the Idols, or the Babylonians] could not deliver the burden, but they themselves [Heb. Their soul: that is, they themselves. So below chap.47.verse 14.] are gone into captivity. [That is, they shall be carried away captive to Persia.]"}],"3":[{"catchword":null,"tekst":"Hearken unto me, O house of Jacob, and all the remnant of the house of Israel, ye which are born (of me) from the belly, and taken up from the womb. [That is, for whom I continually take care, whose defence and protection I have always been. See Exo 19:4. Deut.1.31. and 32.11. Psal.22.11. and 71.6. (which are born, or, carried of or by me from the belly,) or, from (the mothers) belly. The meaning is, I have been troubled with you, as a mother is troubled with her child, and have defended you and provided for you from you first original, (and taken up from the womb.) That is, as soon as ye were born.]"}],"4":[{"catchword":null,"tekst":"And unto old age will I be the same, yea unto hoariness, [That is, until ye shall be grown old and gray] will I carry (you): [As a mother or nurse carrieth her young babe; that is, I will provide well for you] I have done it, and I will take (you) up, and I will carry and deliver (you).] To wit, out of the Babylonish captivity; or, out of all trouble.]"}],"5":[{"catchword":null,"tekst":"To whom would ye liken me, and make (me) equal, and compare me, that we should be like one another? [Compare above chap.40.18,25.]"}],"6":[{"catchword":null,"tekst":"They [To wit, Idolaters] lavish gold out of the bug, [Or, they waste and spend it unprofitably. The Hebrew word signifieth properly to lavish away money in great abundance, as making no spare of it, or making no account of it: So that here is set forth the folly and madness of Idolaters, and their senselessness [and weigh silver with the balance: [Or, beam of the balance, equal weight and price, or, tongue of the balance] they hire a goldsmith, [Heb. A melter, as above chap.41.7.] and he maketh it a God; [That is, an Idol] they kneel down, also they bow themselves (before it)."}],"7":[{"catchword":null,"tekst":"They take him upon the shoulder, they carry, him, and set him in place, [Heb. Under himself] there he slandereth, he removeth not from his place, yea if (any) cry unto him, he answereth not, he delivereteh him not: [To wit, the Idolater] out of his distress."}],"8":[{"catchword":null,"tekst":"Remember this, and behave yourselves valiantly, [Or, behave your selves manfully, be established, or, grounded: Take heed ye be not deceived, nor moved, or brought to serve and worship Idols through fear, or by the example of the Babylonians] bring it again to mind, O ye transgressors. [Or, bring it again to mind unto transgressors. (O ye trangressors) That forsake my covenant, and suffer yourselves to be seduced by Idolaters."}],"9":[{"catchword":null,"tekst":"Remember the former things [To wit, the mercies and miracles which I have formerly shewed unto you, or to my Church] of ancient times: [The sentence might be fuller and more perfect thus: which were done of ancient times, or, long ago] that I am God, and there is no God more, and there is nothing like me: [Compare above chap.45.vers.5,14,18,21,22. And chap.41.vers.22.]"}],"10":[{"catchword":null,"tekst":"Which declare the end from the beginning, and from off all those things which are not yet done: [That is, I that foretell future things a great while before they are done, making it thereby appear that I alone an the true God] who say my counsel shall stand, and I will do all my pleasure. [Compare Psal.33.11. Pro 29:21. and 21.30. Heb 6:17]"}],"11":[{"catchword":null,"tekst":"Who call a covetous fowl [Meaning Cores, who shall come as swiftly and speedily from Persia into Babylon, as if he were a bird of a swift flight, and flew] rom the east, [to wit, from Persia, which lieth Eastward off from the Babylonians] a man of my counsel [that is, a man that shall waste and destroy Babel, and shall deliver my people out of captivity] from a far Country; Yea I have spoken (it), I will also cause it to came to pass, I have formed it, [To wit in my mind, or in my secret counsel, I have purposed it, I have resolved or intended it] I will also doe it."}],"12":[{"catchword":null,"tekst":"Hearken unto me, ye stiff in heart: [Or, the stout, wilful, stiff-necked, obstinate in heart: the wicked perverse Jews] ye that are far from righteousness. [As if God had said, ye that are altogether unworthy of my grace and favour, because ye do not (as ye ought to do) seriously mind goodiness, and true piety or godliness.]"}],"13":[{"catchword":null,"tekst":"I bring [Or, I will bring, or, I have brought: and so often by the Prophets, who by reason of the certainty of their Prophesies do oftentimes speak of a thing that is to come, yet is to be done, as if it were already done and accomplished] neer my righteousness; to wit, the deliverance of my people from captivity in Babylon, and consequently their redemption by Christ from spiritual misery and thraldom. Sew above chap.45.vers.8.] it shall not be far off, and my salvation [That is, the deliverance which I shall give unto my people, redeeming and delivering them out of Captivity] shall not tarry; but I will give salvation in Zion, my glory unto Israel. [That is, such a deliverance whereby my people of Israel shall be greatly glorified. Others, (for) my glory; to wit, which shall be published and extolled by this glorious work of redemption. Others, for Israels sake which is my glory.]"}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
