len neer, ook buigen zij zich *daarvoor*.", "7": "Zij nemen hem op de schouder, zij dragen hem, en zetten hem op zijn plaats; daar staat hij, hij wijkt niet van zijn plaats; ja, roept *iemand* tot hem, dan antwoordt hij niet, hij verlost hem niet uit zijn benauwdheid.", "8": "Denk hieraan, en wees kloek, breng het weer in het hart, o overtreders!", "9": "Denk aan de vorige dingen van oude tijden af, dat Ik God ben, en er is geen God meer, en er is niets gelijk Ik;", "10": "Die vanaf het begin aan verkondigt het einde, en van oudsher af die dingen, die nog niet gebeurd zijn; Die zegt: Mijn raad zal standhouden, en Ik zal al Mijn welbehagen doen.", "11": "Die een roofvogel roept van het oosten, een man van Mijn raad uit een ver land; ja, Ik heb *het* gesproken, Ik zal het ook doen komen; Ik heb *het* geformeerd, Ik zal het ook doen.", "12": "Hoor naar Mij, u die hardnekkig van hart bent, u, die ver van de gerechtigheid zijt!", "13": "Ik breng Mijn gerechtigheid nabij, zij zal niet ver weg zijn, en Mijn heil zal niet uitblijven; maar Ik zal heil geven in Sion, aan Israël Mijn heerlijkheid."}, "SV": {"1": "Bel is gekromd, Nebo wordt nedergebogen, hun afgoden zijn geworden voor de dieren en voor de beesten; uw opgeladen pakken zijn een last voor de vermoeide *beesten*.", "2": "Samen zijn zij nedergebogen, zij zijn gekromd, zij hebben den last niet kunnen redden, maar zijzelven zijn in de gevangenis gegaan.", "3": "Hoor naar Mij, o huis van Jakob, en het ganse overblijfsel van het huis Israëls! die *van* *Mij* gedragen zijt van den buik aan, *en* opgenomen van de baarmoeder af.", "4": "En tot den ouderdom toe zal Ik Dezelfde zijn, ja, tot de grijsheid toe zal Ik *ulieden* dragen; Ik heb het gedaan, en Ik zal *u* opnemen, en Ik zal dragen en redden.", "5": "Wien zoudt gijlieden Mij nabeelden, en evengelijk maken, en Mij vergelijken, dat wij elkander gelijken zouden?", "6": "Zij verkwisten het goud uit de beurs, en wegen het zilver met de waag; zij huren een goudsmid, en die maakt het tot een god, zij knielen neder, ook buigen zij zich *daarvoor*.", "7": "Zij nemen hem op den schouder, zij dragen hem, en zetten hem aan zijn plaats; daar staat hij, hij wijkt van zijn stede niet; ja, roept *iemand* tot hem, zo antwoordt hij niet, hij verlost hem niet uit zijn benauwdheid.", "8": "Gedenkt hieraan, en houdt u kloekelijk, brengt het weder in het hart, o gij overtreders!", "9": "Gedenkt der vorige dingen van oude tijden af, dat Ik God ben, en er is geen God meer, en er is niet gelijk Ik;", "10": "Die van den beginne aan verkondigt het einde, en van ouds af die dingen, die nog niet geschied zijn; Die zegt: Mijn raad zal bestaan, en Ik zal al Mijn welbehagen doen.", "11": "Die een roofvogel roept van het oosten, een man Mijns raads uit verren lande; ja, Ik heb *het* gesproken, Ik zal het ook doen komen; Ik heb *het* geformeerd, Ik zal het ook doen.", "12": "Hoort naar Mij, gij stijven van harte, gij, die verre van de gerechtigheid zijt!", "13": "Ik breng Mijn gerechtigheid nabij, zij zal niet verre wezen, en Mijn heil zal niet vertoeven; maar Ik zal heil geven in Sion, aan Israël Mijn heerlijkheid."}, "KJV": {"1": "Bel boweth down, Nebo stoopeth, their idols were upon the beasts, and upon the cattle: your carriages *were* heavy loaden; *they are* a burden to the weary", "2": "They stoop, they bow down together; they could not deliver the burden, but themselves are gone into captivity.", "3": "Hearken unto me, O house of Jacob, and all the remnant of the house of Israel, which are borne *by me* from the belly, which are carried from the womb:", "4": "And *even* to *your* old age I *am* he; and *even* to hoar hairs will I carry *you*: I have made, and I will bear; even I will carry, and will deliver", "5": "To whom will ye liken me, and make *me* equal, and compare me, that we may be like?", "6": "They lavish gold out of the bag, and weigh silver in the balance, *and* hire a goldsmith; and he maketh it a god: they fall down, yea, they worship.", "7": "They bear him upon the shoulder, they carry him, and set him in his place, and he standeth; from his place shall he not remove: yea, *one* shall cry unto him, yet can he not answer, nor save him out of his trouble.", "8": "Remember this, and shew yourselves men: bring *it* again to mind, O ye transgressors.", "9": "Remember the former things of old: for I *am* God, and *there is* none else; *I am* God, and *there is* none like", "10": "Declaring the end from the beginning, and from ancient times *the things* that are not *yet* done, saying, My counsel shall stand, and I will do all my pleasure:", "11": "Calling a ravenous bird from the east, the man that executeth my counsel from a far country: yea, I have spoken *it*, I will also bring it to pass; I have purposed *it*, I will also do", "12": "Hearken unto me, ye stouthearted, that *are* far from righteousness:", "13": "I bring near my righteousness; it shall not be far off, and my salvation shall not tarry: and I will place salvation in Zion for Israel my glory."}}, "tsk": {"1": [{"kopje": "Bel", "refs": ["Jes 21:9", "Jes 41:6", "Jes 41:7", "Ex 12:12", "1 Sam 5:3", "Jer 48:1-25", "Jer 50:2", "Jer 51:44", "Jer 51:47", "Jer 51:52"]}, {"kopje": "een last", "refs": ["Jes 2:20", "Jer 10:5"]}], "2": [{"kopje": "hebben niet kunnen", "refs": ["Jes 36:18", "Jes 36:19", "Jes 37:12", "Jes 37:19", "Jes 44:17", "Jes 45:20"]}, {"kopje": "maar", "refs": ["Richt 18:17", "Richt 18:18", "Richt 18:24", "2 Sam 5:21", "Jer 43:12", "Jer 43:13", "Jer 48:7"]}], "3": [{"kopje": "Hoor", "refs": ["Jes 44:1", "Jes 44:21", "Jes 48:1", "Jes 48:17", "Jes 48:18", "Jes 51:1", "Jes 51:7", "Ps 81:9-14"]}, {"kopje": "het hele overblijfsel", "refs": ["Jes 1:9", "Jes 10:22", "Jes 11:11", "Jes 37:4"]}, {"kopje": "gedragen", "refs": ["Jes 44:1", "Jes 44:2", "Jes 49:1", "Jes 49:2", "Jes 63:9", "Ex 19:4", "Deut 1:31", "Deut 32:11", "Deut 32:12", "Ps 22:10", "Ps 22:11", "Ps 71:6", "Ezech 16:6-16"]}], "4": [{"kopje": "tot de ouderdom toe", "refs": ["  geboden die in inzettingen bestond; opdat Hij die twee in Zichzelf tot één nieuwe mens zou scheppen, en zo vrede zou maken;", "Jer 50:5": "Zij zullen naar Sion vragen; op de weg hierheen zullen hun gezichten gericht zijn; zij zullen komen en zich bij de HEERE aansluiten, met een eeuwig verbond, dat niet zal worden vergeten.", "Mal 3:6": "Want Ik, de HEERE, word niet veranderd; daarom zijn u, kinderen van Jakob, niet verteerd.", "Dan 12:1": "En in die tijd zal Michaël opstaan, die grote vorst, die voor de kinderen van uw volk staat, als het zo'n tijd van benauwdheid zal zijn, als er niet geweest is sinds er een volk geweest is, tot op die tijd toe; en in die tijd zal uw volk verlost worden, ieder die gevonden wordt geschreven te zijn in het boek.", "1 Kron 16:36": "Geloofd zij de HEERE, de God van Israël, van eeuwigheid tot eeuwigheid! En al het volk zei: Amen! en het loofde de HEERE.", "Ps 93:1": "De HEERE regeert, Hij is met majesteit bekleed; de HEERE is bekleed met sterkte, Hij heeft Zich omgord. Ook is de wereld bevestigd, zij zal niet wankelen.", "Ps 37:40": "En de HEERE zal hen helpen, en zal hen bevrijden; Hij zal hen bevrijden van de goddelozen, en zal hen behouden; want zij vertrouwen op Hem.", "Ps 95:1": "Komt, laat ons de HEERE vrolijk zingen; laat ons juichen voor de Rotssteen van ons heil.", "Kol 1:6": "dat tot u gekomen is, zoals ook in de hele wereld, en het brengt vruchten voort, zoals ook onder u, vanaf de dag dat u het gehoord hebt en de genade van God in waarheid hebt leren kennen.", "Openb 1:6": "En Die ons gemaakt heeft tot koningen en priesters voor God en Zijn Vader; Hem, zeg ik, zij de heerlijkheid en de kracht tot in alle eeuwigheid. Amen.", "Luk 7:47": "Daarom zeg Ik u: haar zonden, die vele waren, zijn haar vergeven; want zij heeft veel liefgehad; maar aan wie weinig vergeven wordt, die heeft weinig lief.", "Ex 3:14": "En God zei tegen Mozes: IK ZAL ZIJN, DIE IK ZIJN ZAL! Ook zei Hij: Zo zult u tegen de kinderen van Israël zeggen: IK ZAL ZIJN heeft mij tot u gezonden!", "Jes 41:14": "Vrees niet, wormpje Jakob, volkje Israël! Ik help u, spreekt de HEERE, en uw Verlosser is de Heilige van Israël!", "Hos 14:2": "Bekeer u, o Israël! tot de Heere, uw God, toe; want u bent gevallen om uw ongerechtigheid.", "Zach 2:5": "En Ik zal haar wezen, spreekt de HEERE, een vurige muur rondom; en Ik zal tot heerlijkheid wezen in het midden van haar.", "Jer 21:8": "En tegen dit volk zult u zeggen: Zo zegt de HEERE: Zie, Ik stel voor uw gezicht de weg van het leven en de weg van de dood.", "Job 33:27-29": "Hij zal de mensen aanschouwen, en zeggen: Ik heb gezondigd, en het recht verkeerd, wat mij niet heeft gebaat; Maar God heeft mijn ziel verlost, dat zij niet voert in het verderf, zodat mijn leven het licht aanziet. Zie, dit alles werkt God twee maal of driemaal met een man;", "Ps 121:3-8": "Hij zal uw voet niet laten wankelen; uw Bewaarder zal niet sluimeren. Zie, de Bewaarder van Israël zal niet sluimeren, ook niet slapen. De HEERE is uw Bewaarder, de HEERE is uw Schaduw, aan uw rechterhand.", "2 Kron 1:12": "De wijsheid en de kennis is u gegeven; daartoe zal Ik u rijkdom, en goederen, en eer geven, zoals geen koningen die vóór u geweest zijn, gehad hebben, en na u zal niemand zoiets hebben.", "Jes 47:12-15": "Sta nu met uw bezweringen, en met de veelheid van uw toverijen, waarin u gearbeid hebt van uw jeugd af; misschien kunt u voordeel doen, misschien kunt u zich sterken. U bent moe geworden van de veelheid van uw raadslagen; laat nu opstaan die de hemel waarnemen, die naar de sterren kijken, die naar de nieuwe manen voorzeggen; en laat ze u verlossen van die dingen die over u komen zullen. Zie, zij zullen zijn als stoppels, het vuur zal ze verbranden, zij zullen zichzelf niet kunnen rukken uit de macht van de vlam; het zal geen kool zijn om bij te warmen, geen vuur om daarvoor bij neer te zitten.", "Hand 16:17": "Zij volgde Paulus en ons achterna en riep: Deze mensen zijn dienstknechten van God, de Allerhoogste, die ons de weg van de zaligheid verkondigen.", "Hand 15:7-9": "En toen daarover een grote twist ontstond, stond Petrus op en zei tegen hen: Mannen broeders, u weet dat God van lang geleden onder ons mij uitgekozen heeft, dat de heidenen door mijn mond het woord van het Evangelie zouden horen, en geloven. En God, de Kenner van de harten, heeft hun getuigenis gegeven, doordat Hij hun de Heilige Geest gaf, evenals ook aan ons; en Hij heeft geen onderscheid gemaakt tussen ons en hen, doordat Hij hun harten door het geloof gereinigd heeft.", "Jer 18:12": "Doch zij zeggen: Het is buiten hoop; maar wij zullen naar onze eigen gedachten wandelen, en wij zullen doen, ieder, wat zijn boze hart goeddunkt.", "Dan 2:22": "Hij openbaart diepe en verborgen dingen; Hij weet wat in het duister is, want het licht woont bij Hem.", "Deut 32:15": "Toen Jeschurun vet werd, sloeg hij achteruit (u bent vet geworden, u bent dik geworden, ja, met vet overdekt geworden!); en hij liet God varen, Die hem gemaakt heeft, en versmaadde de Rotssteen van zijn heil.", "Deut 32:31": "Want hun rotssteen is niet gelijk onze Rotssteen, zelfs onze vijanden zijn daar rechters over.", "1 Kon 8:39": "hoor Ú dan in de hemel, de vaste plaats van Uw woning, en vergeef, en doe, en geef ieder naar al zijn wegen, zoals U zijn hart kent; want U alleen kent het hart van alle kinderen van de mensen;", "Deut 8:3": "En Hij verootmoedigde u, en liet u hongeren, en voedde u met het manna, dat u niet kende, dat ook uw vaderen niet gekend hadden; opdat Hij u bekend zou maken dat de mens niet alleen van brood leeft, maar dat de mens leeft van alles wat uit de mond van de HEERE komt.", "Fil 3:7-11": "Maar wat mij winst was, dat heb ik om Christus' wil als schade beschouwd. Ja, zeker, ik beschouw ook alle dingen als schade vanwege de uitnemendheid van de kennis van Christus Jezus, mijn Heere; om Wiens wil ik al die dingen als schade heb gerekend, en ze beschouw als vuil, opdat ik Christus mag winnen, En in Hem gevonden word, niet met mijn eigen rechtvaardigheid, die uit de wet is, maar met de rechtvaardigheid die door het geloof van Christus is, namelijk de rechtvaardigheid die uit God is door het geloof;", "Spr 15:19": "De weg van de luiaard is als een doornheg; maar het pad van de oprechten is welgebaand.", "2 Kron 20:6": "En hij zei: HEERE, God van onze vaderen, bent U niet de God in de hemel? Ja, U heerst over alle koninkrijken van de heidenvolken; en in Uw hand is kracht en sterkte, zodat niemand tegen U stand kan houden.", "Ps 122:9": "Om het huis van de HEERE, onze God, zal ik het goede voor u zoeken.", "Jer 13:15": "Hoort en neemt het ter ore, verhef u niet; want de HEERE heeft het gesproken.", "Jer 10:9": "Uitgerekt zilver wordt van Tarsis gebracht, en goud van Ufaz, tot een werk van de werkmeester en van de handen van de goudsmid; hemelsblauw en purper is hun kleding, een werk van de wijzen zijn zij allemaal samen.", "Ps 27:1": "Een psalm van David. De HEERE is mijn Licht en mijn Heil, voor wie zou ik vrezen? De HEERE is de kracht van mijn leven, voor wie zou ik bang zijn?", "Jes 61:11": "Want zoals de aarde haar spruit voortbrengt, en zoals een tuin datgene wat erin gezaaid is, laat uitspruiten, zo zal de Heere HEERE gerechtigheid en lof laten uitspruiten voor alle volken.", "Ef 1:20": "Die Hij gewrocht heeft in Christus, toen Hij Hem uit de doden heeft opgewekt; en Hem heeft gezet aan Zijn rechterhand in de hemel;", "Luk 18:10-14": "Twee mensen gingen op naar de tempel om te bidden; de een was een Farizeeër en de ander een tollenaar. De Farizeeër stond en bad dit bij zichzelf: O God, ik dank U dat ik niet ben zoals de andere mensen: rovers, onrechtvaardigen, overspelers; of ook zoals deze tollenaar. Ik vast tweemaal per week; ik geef tienden van alles wat ik bezit.", "Gen 26:5": "omdat Abraham Mijn stem gehoorzaam is geweest, en Mijn bevel heeft onderhouden, Mijn geboden, Mijn inzettingen en Mijn wetten.", "Gen 12:3": "En Ik zal zegenen wie u zegenen, en vervloeken wie u vervloekt; en in u zullen alle geslachten van de aarde gezegend worden.", "Jes 41:26-29": "Wie heeft iets verkondigd van het begin af aan, zodat wij het weten mogen, of van tevoren, zodat wij mogen zeggen: Hij is rechtvaardig? Maar er is niemand die het verkondigt, ook niemand die iets laat horen, ook niemand die uw woorden hoort. Ik, de Eerste, zeg tegen Sion: Zie, zie ze daar! En tegen Jeruzalem: Ik zal iemand geven die een blijde boodschap brengt. Want Ik zag toe, maar er was niemand, zelfs onder hen niet; er was geen raadgever, zodat Ik hen zou kunnen vragen, en zij Mij antwoord zouden geven.", "1 Sam 2:7": "De HEERE maakt arm en maakt rijk; Hij vernedert, ook verhoogt Hij.", "Ex 15:16": "Verschrikking en vrees zal op hen vallen; door de grootheid van Uw arm zullen zij verstommen als een steen, totdat Uw volk, HEERE, erdoor is getrokken; totdat dit volk erdoor is getrokken, dat U verworven hebt.", "Openb 5:14": "En de vier dieren zeiden: Amen. En de vierentwintig oudsten vielen neer en aanbaden Hem Die leeft tot in alle eeuwigheid.", "2 Kron 36:23": "Zo zegt Kores, koning van Perzië: De HEERE, de God van de hemel, heeft mij alle koninkrijken van de aarde gegeven; en Hij heeft mij bevolen Hem een huis te bouwen te Jeruzalem, dat in Juda is; wie is er onder u van al Zijn volk? De HEERE, zijn God, zij met hem, en hij trekt op.", "Openb 14:6": "En ik zag een andere engel, vliegend in het midden van de hemel, en hij had het eeuwige Evangelie, om te verkondigen aan hen die op de aarde wonen, en aan alle natie, en geslacht, en taal, en volk;", "Jes 49:2": "En Hij heeft Mijn mond gemaakt als een scherp zwaard, onder de schaduw van Zijn hand heeft Hij Mij bedekt; en Hij heeft Mij tot een gezuiverde pijl gesteld, in Zijn pijlkoker heeft Hij Mij verborgen.", "Spr 3:20": "Door Zijn kennis zijn de afgronden gekloofd, en de wolken druipen dauw.", "Ps 85:10": "Zeker, Zijn heil is nabij hen die Hem vrezen, opdat in ons land eer woont.", "Ps 111:6": "Caph. Hij heeft de kracht van Zijn werken aan Zijn volk bekendgemaakt; Lamed. door hun de erve van de heidenen te geven.", "Mal 3:7": "Vanaf de dag van uw vaderen af zijn jullie afgeweken van Mijn inzettingen, en hebben ze niet bewaard; keer terug tot Mij, en Ik zal tot u terugkeren, zegt de HEERE van de heerscharen; maar u zegt: Waarin zullen wij terugkeren?", "Luk 13:1-5": "En er waren in diezelfde tijd enigen aanwezig, die Hem vertelden van de Galileeërs, van wie Pilatus het bloed met hun offers gemengd had. En Jezus antwoordde en zei tegen hen: Denkt u dat deze Galileeërs meer zondaars zijn geweest dan alle andere Galileeërs, omdat zij zulke dingen hebben geleden? Ik zeg u: Nee; maar als u zich niet bekeert, zult u allen net zo omkomen.", "Jes 44:18-21": "Zij weten niet, en begrijpen niet, want het heeft hun ogen dichtgesmeerd, zodat zij niet zien, en hun harten, zodat zij niet begrijpen. En niemand van hen brengt het in zijn hart, en er is geen kennis en geen verstand, zodat hij zou zeggen: De helft daarvan heb ik verbrand in het vuur, ja, ook op de kolen daarvan heb ik brood gebakken, ik heb vlees daarbij gebraden, en heb het gegeten; en zou ik het overblijfsel daarvan tot een gruwel maken, zou ik neerknielen voor iets dat van een boom gekomen is? Hij voedt zich met as, het bedrogen hart heeft hem terzijde afgeleid; zodat hij zijn ziel niet redden kan, en ook niet kan zeggen: Is er niet een leugen in mijn rechterhand?", "2 Petr 3:8": "Maar dit ene mag u niet onbekend zijn, geliefden, dat één dag bij de Heere is als duizend jaar, en duizend jaar als één dag.", "1 Kon 8:41-43": "Zelfs ook aangaande de vreemdeling, die niet van Uw volk Israël zal zijn, maar uit ver land komt om Uw Naam wil; (want zij zullen horen van Uw grote Naam, en van Uw sterke hand, en van Uw uitgestrekte arm) wanneer hij komen en bidden zal in dit huis; hoor Ú in de hemel, de vaste plaats van Uw woning, en doe naar alles waarom die vreemdeling tot U roepen zal; opdat alle volken van de aarde Uw Naam kennen, om U te vrezen, zoals Uw volk Israël, en om te weten, dat Uw Naam genoemd wordt over dit huis, dat ik gebouwd heb.", "Ps 36:10": "Want bij U is de fontein van het leven; in Uw licht zien wij het licht.", "Hebr 7:25": "Daarom kan Hij ook volkomen zalig maken hen die door Hem tot God gaan, omdat Hij altijd leeft om voor hen te bidden.", "Jer 11:20": "Maar, o HEERE van de heerscharen¹, U rechtvaardige Rechter, Die de nieren en het hart beproeft! laat mij Uw wraak over hen zien; want aan U heb ik mijn rechtszaak bekendgemaakt.", "Jes 13:17": "Zie, Ik zal de Meden tegen hen opwekken, die het zilver niet zullen achten, en aan het goud zullen zij geen lust hebben.", "1 Sam 2:10": "Zij die met de HEERE twisten, zullen verpletterd worden; Hij zal in de hemel over hen donderen; de HEERE zal de einden van de aarde richten, en zal Zijn Koning sterkte geven, en de hoorn van Zijn Gezalfde verhogen.", "Job 33:24": "Zo zal Hij hem genadig zijn, en zeggen: Verlos hem, dat hij in het verderf niet nederdaalt, Ik heb verzoening gevonden.", "Ex 15:2": "De HEERE is mijn Kracht en Lied, en Hij is mij tot een Heil geweest; Deze is mijn God; daarom zal ik Hem een liefelijke woning maken; Hij is de God van mijn vader, daarom zal ik Hem verheffen!", "1 Petr 1:2": "de uitverkorenen naar de voorkennis van God de Vader, in de heiligmaking van de Geest, tot gehoorzaamheid en besprenging met het bloed van Jezus Christus; genade en vrede worde u vermenigvuldigd.", "Jes 43:14": "Zo zegt de HEERE, uw Verlosser, de Heilige van Israël: Om uw wil heb Ik naar Babel gezonden, en heb hen allen als vluchtelingen doen neerdalen, te weten de Chaldeeën, in de schepen, waarop zij juichten.", "Amos 5:4": "Want zo zegt de HEERE tot het huis van Israël: Zoek Mij, en leef.", "Jes 40:9": "O Sion, u die goede boodschap verkondigt, klim op een hoge berg; o Jeruzalem, u die goede boodschap verkondigt, hef uw stem op met macht, hef ze op, vrees niet, zeg tegen de steden van Juda: Zie, hier is uw God!", "Deut 32:40": "Want Ik zal Mijn hand naar de hemel opheffen, en Ik zal zeggen: Ik leef in eeuwigheid!", "Spr 9:1-6": "De opperste Wijsheid heeft haar huis gebouwd; zij heeft haar zeven pilaren gehouwen. Zij heeft haar slachtvee geslacht. Zij heeft haar wijn gemengd; ook heeft zij haar tafel klaargemaakt. Zij heeft haar dienstmeisjes uitgezonden; zij nodigt uit op de tinnen van de hoogten van de stad:", "Job 5:11": "Om de vernederden te stellen in het hoge; dat de rouwdragenden door heil verheven worden.", "Mal 4:2": "Voor u echter, die Mijn Naam vreest, zal de Zon der gerechtigheid opgaan, met genezing onder Haar vleugels; en u zult uitgaan en toenemen als mestkalveren.", "2 Kron 6:14": "En hij zei: HEERE, God van Israël, er is geen God gelijk U, in de hemel noch op de aarde, Die het verbond en de goedertierenheid houdt aan Uw knechten, die voor Uw aangezicht met hun gehele hart wandelen;", "Jes 66:18": "Hun werken en hun gedachten! Het komt, dat Ik alle heidenen en talen zal verzamelen, en zij zullen komen, en zij zullen Mijn heerlijkheid zien.", "Ps 144:5": "Buig Uw hemelen, HEERE, en daal neer; raak de bergen aan, zodat ze roken.", "1 Sam 23:10-12": "En David zei: HEERE, God van Israël! Uw dienaar heeft zeker gehoord dat Saul van plan is naar Kehila te komen, om de stad te vernietigen om mijnentwil. Zullen de burgers van Kehila mij ook in zijn hand overgeven? Zal Saul afkomen, zoals Uw dienaar gehoord heeft? O HEERE, God van Israël, vertel het toch aan Uw dienaar! En de HEERE zei: Hij zal afkomen. Daarna zei David: Zouden de burgers van Kehila mij en mijn mannen overgeven in de hand van Saul? En de HEERE zei: Zij zouden u overgeven.", "2 Kron 6:30": "Hoor U dan uit de hemel, de vaste plaats van Uw woning, en vergeef, en geef ieder naar al zijn wegen, zoals U zijn hart kent; want U alleen kent het hart van de kinderen der mensen;", "Deut 30:15-20": "Zie, ik heb u heden voorgesteld het leven en het goede, en de dood en het kwade. Want ik gebied u heden, de HEERE, uw God, lief te hebben, in Zijn wegen te wandelen, en Zijn geboden, en Zijn inzettingen, en Zijn rechten te houden, opdat u leeft en meer wordt, en de HEERE, uw God, u zegent in het land waar u naartoe gaat, om dat te erven. Maar als uw hart zich zal afwenden, en u niet horen zult, en u gedreven wordt om u voor andere goden te buigen, en die te dienen;", "Gal 3:21": "Is de wet dan tegen de beloften van God? Dat zij verre; want als er een wet gegeven was die machtig was levend te maken, dan zou de rechtvaardigheid werkelijk uit de wet zijn.", "Amos 9:6": "Die Zijn bovenzalen in de hemel bouwt, en Zijn gewelf heeft Hij op de aarde gegrondvest; Die de wateren van de zee roept, en giet ze uit over de aardbodem; HEERE is Zijn Naam.", "Ezech 2:5": "En zij, hetzij dat zij het horen zullen, of hetzij dat zij het laten zullen (want zij zijn een opstandig huis), zo zullen zij weten, dat er een profeet in hun midden geweest is.", "Hand 13:38": "Zo zij het u dan bekend, mannen broeders, dat door Hem u vergeving van de zonden verkondigd wordt;", "Mal 3:13-15": "Uw woorden zijn tegen Mij te sterk geworden, zegt de HEERE; maar u zegt: Wat hebben wij tegen U gesproken? U zegt: Het is tevergeefs God te dienen; want wat nut heeft het, dat wij Zijn wacht in acht nemen, en dat wij in het zwart gaan, voor het aangezicht van de HEERE van de heerscharen? En nu, wij achten de hoogmoedigen gelukzalig; ook wie goddeloosheid doen, worden gebouwd; ook verzoeken zij de HEERE, en ontkomen.", "Neh 9:25": "En zij hebben vaste steden en een vet land ingenomen, en erfelijk bezeten, huizen, vol van allerlei goed, uitgehouwen waterputten, wijngaarden, olijfgaarden en fruitbomen, in overvloed; en zij hebben gegeten, en zijn verzadigd en vet geworden, en hebben in weelde geleefd, door Uw grote goedheid.", "Dan 7:22": "Totdat de Oude van dagen kwam, en het gericht gegeven werd aan de heiligen van de hoge plaatsen, en de bestemde tijd kwam, dat de heiligen het Rijk bezaten.", "1 Tess 1:9": "Want zijzelf vertellen over ons, wat voor ontvangst wij bij u gehad hebben, en hoe u zich tot God bekeerd hebt van de afgoden, om de levende en waarachtige God te dienen;", "Jer 43:13": "En hij zal de opgerichte beelden van Beth-semes, dat in Egypteland is, verbreken; en hij zal de huizen van de goden van Egypte met vuur verbranden.", "Luk 5:31": "En Jezus antwoordde en zei tegen hen: Wie gezond zijn, hebben geen dokter nodig, maar wie ziek zijn.", "Job 12:13": "Bij Hem is wijsheid en macht; Hij heeft raad en verstand.", "Jes 48:13": "Ook heeft Mijn hand de aarde gegrond, en Mijn rechterhand heeft de hemelen met de palm afgemeten; wanneer Ik ze roep, staan zij daar samen.", "Jes 44:23": "Zing met vreugde, u hemelen! Want de HEERE heeft het gedaan; juich, u onderste delen van de aarde! U bergen! Maak een groot gedreun met vreugdegezang, u bossen, en al het geboomte daarin! Want de HEERE heeft Jakob verlost, en Zich heerlijk gemaakt in Israël.", "Spr 22:12": "De ogen van de HEERE bewaren de kennis; maar de zaken van de trouweloze zal Hij omkeren.", "Jes 51:10": "Bent U het niet, Die de zee, het water van het grote afgrond, droog gemaakt hebt? Die de diepten van de zee gemaakt hebt tot een weg, opdat de verlosten daardoor gingen?", "Jes 38:15": "Wat zal ik spreken? Zoals Hij het mij heeft toegezegd, zo heeft Hij het gedaan; ik zal nu al zoetjes voortgaan al mijn jaren, vanwege de bitterheid van mijn ziel.", "Jes 45:24": "Men zal van Mij zeggen: Zeker, in de HEERE zijn gerechtigheden en sterkte; tot Hem zal men komen; maar zij zullen allen beschaamd worden die tegen Hem in woede ontstoken zijn.", "Ezech 20:13": "Maar het huis van Israël werd opstandig tegen Mij in de woestijn; zij wandelden niet in Mijn inzettingen, en verwierpen Mijn rechten, die, als een mens ze doet, hij daardoor zal leven; en zij ontheiligden Mijn sabbatten zeer, zodat Ik zei dat Ik Mijn grimmigheid over hen zou uitgieten in de woestijn, om hen te verdelgen.", "Neh 9:7-37": "U bent die HEERE, de God, Die Abram hebt verkoren, en hem uit Ur der Chaldeeën uitgevoerd; en U hebt zijn naam gesteld Abraham. En U hebt zijn hart getrouw gevonden voor Uw aangezicht, en hebt een verbond met hem gemaakt, dat U zou geven het land van de Kanaänieten, de Hethieten, de Amorieten, en de Ferezieten, en de Jebusieten, en de Girgasieten, dat U het aan zijn nageslacht zou geven; en U hebt Uw woorden bevestigd, omdat U rechtvaardig bent. En U hebt de ellende van onze vaderen in Egypte gezien, en U hebt hun geroep gehoord aan de Schelfzee;", "Ezech 28:4": "Door uw wijsheid en door uw verstand hebt u vermogen voor uzelf verkregen; ja, u hebt goud en zilver verkregen in uw schatten.", "Rom 3:29": "Is God een God van de Joden alleen? En is Hij het niet ook van de heidenen? Ja, ook van de heidenen;", "Jes 61:9": "En hun nageslacht zal onder de heidenvolken bekend worden, en hun nakomelingen te midden van de volken; allen die hen zien zullen, zullen hen erkennen, dat zij een nageslacht zijn, dat de HEERE gezegend heeft.", "Gen 24:35": "en de HEERE heeft mijn heer zeer gezegend, zodat hij groot geworden is; en Hij heeft hem gegeven schapen, en runderen, en zilver, en goud, en knechten, en dienstmeisjes, en kamelen, en ezels.", "Jes 45:2": "Ik zal voor uw aangezicht gaan, en Ik zal de kromme wegen recht maken; de koperen deuren zal Ik verbreken, en de ijzeren grendels zal Ik in stukken slaan.", "Ps 65:6": "Vreselijke dingen zult U ons in gerechtigheid antwoorden, o God van ons heil! o Vertrouwen van alle einden van de aarde, en van de ver weg gelegenen aan de zee!", "Rom 2:26": "Als dan de voorhuid de rechten van de wet bewaart, zal zijn voorhuid dan niet tot een besnijdenis gerekend worden?", "Kol 2:13": "En Hij heeft u, toen u dood was in de misdaden en in de onbesnedenheid van uw vlees, mede levend gemaakt met Hem, terwijl Hij u al uw misdaden vergaf;", "Job 33:26-28": "Hij zal tot God ernstig bidden, Die in hem een welbehagen nemen zal, en zijn aangezicht met gejuich aanzien; want Hij zal de mens zijn gerechtigheid wedergeven. Hij zal de mensen aanschouwen, en zeggen: Ik heb gezondigd, en het recht verkeerd, wat mij niet heeft gebaat; Maar God heeft mijn ziel verlost, dat zij niet voert in het verderf, zodat mijn leven het licht aanziet.", "Job 11:11": "Want Hij kent de ijdele mensen, en Hij ziet de ondeugd; zou Hij dan niet opmerken?", "1 Sam 2:9": "Hij zal de voeten van Zijn gunstgenoten bewaren; maar de goddelozen zullen zwijgen in duisternis; want een man vermag niet door kracht.", "Gal 3:20": "En de Middelaar is niet Middelaar van één, maar God is één.", "Ps 147:13": "Want Hij maakt de grendels van uw poorten sterk; Hij zegent uw kinderen binnen in u.", "Job 34:21": "Want Zijn ogen zijn op ieders wegen, en Hij ziet al zijn treden.", "1 Tim 2:3": "Want dat is goed en aangenaam voor God, onze Zaligmaker;", "Ezech 32:11": "Want zo zegt de Heere HEERE: Het zwaard van de koning van Babel zal u overkomen.", "Ps 36:7": "Uw gerechtigheid is als de bergen van God, Uw oordelen zijn een grote afgrond; HEERE! U behoudt mensen en beesten.", "Ps 12:3": "Zij spreken valsheid, ieder met zijn naaste, met vleiende lippen; zij spreken met een dubbel hart.", "Jes 40:24": "Ja, zij worden niet geplant, ja, zij worden niet gezaaid, ja, hun afgehouwen stam wortelt niet in de aarde; ook als Hij op hen waait, zullen zij verdorren, en een stormwind zal hen als een stoppel wegnemen.", "Jes 9:8": "En dit hele volk zal het gewaar worden, Efraïm en de inwoner van Samaria; in hoogmoed en grootsheid van hart, en zij zeiden:", "1 Kron 12:33": "Uit Zebulon, uitgaand in het leger, toegerust voor de strijd met alle oorlogswapens, vijftigduizend; en in staat een slagorde te houden met een onwankelbaar hart;", "Ezra 5:14": "Ja, de vaten van het huis van God, die van goud en zilver waren, die Nebukadnezar uit de tempel die te Jeruzalem was, had weggenomen en had gebracht in de tempel van Babel, die heeft de koning Kores gehaald uit de tempel van Babel, en ze zijn gegeven aan iemand wiens naam Sesbazar was, die hij tot landvoogd had gesteld.", "Ezech 21:19": "U nu, mensenkind, stel u twee wegen voor, waardoor het zwaard van de koning van Babel komt; uit één land zullen zij beide voortkomen; en kies een plaats, kies die aan het hoofd van de weg naar de stad.", "Jer 21:4-10": "Zo zegt de HEERE, de God van Israël: Zie, Ik zal de oorlogswapens omkeren, die in uw hand zijn, waarmee u strijdt tegen de koning van Babel en tegen de Chaldeeën, die u belegeren, van buiten aan de muur; en Ik zal ze verzamelen in het midden van deze stad. En Ik Zelf zal tegen u strijden, met een uitgestrekte hand en met een sterke arm, ja, met toorn, en met grimmigheid, en met grote verbolgenheid. En Ik zal de inwoners van deze stad slaan, zowel de mensen als de dieren; door een grote pest zullen zij sterven.", "Jes 43:2": "Wanneer u door het water zult gaan, Ik zal bij u zijn, en door de rivieren, zij zullen u niet overstromen; wanneer u door het vuur zult gaan, zult u niet verbranden, en de vlam zal u niet aansteken.", "Jes 14:24-27": "De HEERE van de heerscharen heeft gezworen: Voorzeker, zoals Ik gedacht heb, zo zal het gebeuren, en zoals Ik beraadslaagd heb, zo zal het bestaan! Dat Ik Assur in Mijn land zal verbreken, en hem op Mijn bergen vertreden; opdat zijn juk van hen afwijkt, en zijn last van hun schouder wijkt. Dit is de raadslag, die beraadslaagd is over dat hele land; en dit is de hand, die uitgestrekt is over alle volken.", "Matt 18:14": "Zo is het ook niet de wil van uw Vader, Die in de hemelen is, dat een van deze kleinen verloren gaat.", "Jes 23:11": "Hij heeft Zijn hand uitgestrekt over de zee, Hij heeft de koninkrijken doen beven; de HEERE heeft bevel gegeven tegen Kanaän, om haar vestingen te vernietigen.", "Ps 107:25": "Als Hij spreekt, doet Hij een stormwind opsteken, die haar golven omhoog verheft.", "Jes 14:4-26": "dan zult u deze spreuk aanheffen tegen de koning van Babel, en zeggen: Hoe houdt de onderdrukker op! Hoe houdt de gouden stad op! De HEERE heeft de stok van de goddelozen gebroken, de scepter van de heersers. Die de volken sloeg in verbolgenheid met een plaag zonder ophouden, die in toorn over de heidenvolken heerste, wordt vervolgd, zonder dat iemand het kan afweren.", "Ps 77:15": "U bent die God, Die wonderen doet; U hebt Uw sterkte bekendgemaakt onder de volken.", "Ps 62:3": "Zeker, Hij is mijn Rots en mijn Heil, mijn Hoog Vertrek, ik zal niet erg wankelen.", "Jer 17:10": "Ik, de HEERE, doorgrond het hart, en proef de nieren; en dat, om ieder te geven naar zijn wegen, naar de vrucht van zijn handelingen.", "Jer 10:3": "Want de inzettingen van de volken zijn ijdelheid; want het is hout, dat men uit het woud gehouwen heeft, een werk van de handen van de werkmeester met de bijl.", "Gal 3:1-28": "O onverstandige Galaten, wie heeft u betoverd, dat u de waarheid niet zou gehoorzamen? U voor wie ogen Jezus Christus is voorgeschilderd, onder u gekruisigd. Dit alleen wil ik van u leren: hebt u de Geest ontvangen uit de werken van de wet, of uit de prediking van het geloof? Bent u zo onverstandig? U bent met de Geest begonnen, gaat u nu voleindigen met het vlees?", "Jes 65:17": "Want zie, Ik schep nieuwe hemelen en een nieuwe aarde; en de vorige dingen zullen niet meer gedacht worden, en zullen in het hart niet opkomen.", "Job 10:7": "Het is Uw wetenschap, dat ik niet goddeloos ben; nochtans is er niemand, die uit Uw hand verlost.", "Ps 25:12": "Mem. Wie is de man, die de HEERE vreest? Hij zal hem onderwijzen in de weg, die hij zal hebben te verkiezen.", "Spr 1:24-31": "Omdat Ik geroepen heb, en u geweigerd hebt; Mijn hand uitgestrekt heb, en er niemand was die opmerkte; En u al Mijn raad verworpen hebt, en Mijn bestraffing niet gewild hebt; Zo zal Ik ook in uw verderf lachen; Ik zal spotten, wanneer uw vrees komt.", "Ef 1:13": "In Wie ook u zijt, nadat u het woord der waarheid, namelijk het Evangelie van uw zaligheid, gehoord hebt; in Wie u ook, nadat u geloofd hebt, verzegeld bent geworden met de Heilige Geest der belofte;", "Jes 65:15": "En u zult uw naam voor Mijn uitverkorenen tot een vervloeking laten; en de Heere HEERE zal u doden, maar Zijn knechten zal Hij met een andere naam noemen;", "Ex 14:4": "En Ik zal het hart van Farao verstokken, dat hij hen najaagt; en Ik zal aan Farao en aan zijn hele leger verheerlijkt worden, zodat de Egyptenaren zullen weten dat Ik de HEERE ben. En zij deden zo.", "Gen 48:16": "Die Engel, Die mij verlost heeft van alle kwaad, zegent deze jongens, en laat in hen mijn naam genoemd worden, en de naam van mijn vaders Abraham en Izak, en laat hen vermenigvuldigen als vissen in menigte, midden in het land!", "Jes 61:1-3": "De Geest van de Heere HEERE is op Mij, omdat de HEERE Mij gezalfd heeft, om een blijde boodschap te brengen aan de zachtmoedigen; Hij heeft Mij gezonden om te verbinden de gebrokenen van hart, om de gevangenen vrijheid uit te roepen, en de gebondenen opening van de gevangenis; Om uit te roepen het jaar van het welbehagen van de HEERE, en de dag van de wraak van onze God; om alle treurenden te troosten; Om de treurenden van Sion te geven, dat hun sieraad gegeven wordt voor as, vreugdeolie voor treurigheid, het gewaad van lof voor een benauwde geest; opdat zij eikenbomen van de gerechtigheid genoemd worden, een planting van de HEERE, opdat Hij verheerlijkt wordt.", "Ps 77:17": "De wateren zagen U, o God! De wateren zagen U, zij beefden; ook waren de afgronden beroerd.", "Job 23:10": "Toch kent Hij de weg die bij mij is; Hij beproeft mij; als goud zal ik uitkomen.", "Jes 37:12": "Hebben de goden van de volken die mijn vaders vernietigd hebben, die gered — Gozan, en Haran, en Rezef, en de kinderen van Eden, die in Telassar waren?", "Richt 10:12-14": "En de Sidoniërs, de Amalekieten en de Maonieten, die u onderdrukten toen u tot Mij riep, heb Ik u toen niet uit hun hand verlost? Toch hebt u Mij verlaten, en andere goden gediend; daarom zal Ik u niet meer verlossen. Ga heen, roep tot de goden die u hebt uitgekozen; laten die u verlossen in de tijd van uw benauwdheid.", "Zef 3:19": "Zie, Ik zal in die tijd al uw verdrukkers verdoen; en Ik zal de hinkende behoeden, en de uitgestotenen verzamelen; en Ik zal ze stellen tot een lof, en tot een naam, in het gehele land, waar zij beschaamd zijn geweest.", "Spr 12:13": "In de overtreding van de lippen is de strik van de boze; maar de rechtvaardige zal uit de benauwdheid komen.", "Ezech 36:9-11": "Want ziet, Ik ben bij u, en Ik zal u aanzien, en u zult gebouwd en bezaaid worden. En Ik zal mensen op u vermenigvuldigen, het hele huis van Israël, ja, dat geheel; en de steden zullen bewoond, en de eenzame plaatsen bebouwd worden. Ja, Ik zal mensen en beesten op u vermenigvuldigen, en zij zullen vermenigvuldigd worden en vruchtbaar zijn; en Ik zal u doen bewonen, als in uw vorige tijden, ja, Ik zal het beter maken dan in uw beginselen; en u zult weten dat Ik de HEERE ben.", "Spr 11:11": "Door de zegen van de oprechten wordt een stad verheven; maar door de mond van de goddelozen wordt zij verbroken.", "Deut 32:11-14": "Zoals een arend zijn nest opwekt, over zijn jongen zweeft, zijn vleugels uitbreidt, ze neemt en ze draagt op zijn vleugels; Zo leidde de HEERE hem alleen, en er was geen vreemde god met hem. Hij deed hem rijden op de hoogten van de aarde, zodat hij at van de opbrengsten van het veld; en Hij deed hem honing zuigen uit de steenrots, en olie uit de harde rots;", "Matt 13:15": "Want het hart van dit volk is dik geworden, en met de oren hebben zij zwaar gehoord, en hun ogen hebben zij gesloten; opdat zij niet op enig moment met de ogen zouden zien, en met de oren horen, en met het hart begrijpen, en zich bekeren, en Ik hen zou genezen.", "Ps 115:4": "Hun afgoden zijn zilver en goud, het werk van mensenhanden;", "Jes 48:14": "Verzamel u, u allen, en hoor; wie onder hen heeft deze dingen verkondigd? De HEERE heeft hem lief, Hij zal Zijn welbehagen tegen Babel doen, en Zijn arm zal tegen de Chaldeeën zijn.", "Hos 5:4": "Zij richten hun daden niet zo in dat zij zich tot hun God bekeren; want de geest van de hoererijen is in hun midden, en de Heere kennen zij niet.", "Matt 22:29": "Maar Jezus antwoordde en zei tegen hen: U dwaalt, omdat u de Schriften niet kent, noch de kracht van God.", "Ezech 34:23-31": "En Ik zal één Herder over hen doen opstaan, en Hij zal hen weiden, namelijk Mijn knecht David; die zal ze weiden, en Die zal hun tot een Herder zijn. En Ik, de HEERE, zal hun tot een God zijn; en Mijn knecht David zal Vorst zijn te midden van hen, Ik, de HEERE, heb het gesproken. En Ik zal een verbond van vrede met hen maken, en zal het boze gedierte uit het land doen ophouden; en zij zullen zeker wonen in de woestijn, en slapen in de wouden.", "Jer 3:4": "Zult u niet van nu af aan tot Mij roepen: Mijn Vader! U bent de leidsman van mijn jeugd!", "Ps 81:13": "Daarom heb Ik hen overgegeven aan het goeddunken van hun hart, zodat zij wandelden in hun eigen raadslagen.", "Luk 13:1-3": "En er waren in diezelfde tijd enigen aanwezig, die Hem vertelden van de Galileeërs, van wie Pilatus het bloed met hun offers gemengd had. En Jezus antwoordde en zei tegen hen: Denkt u dat deze Galileeërs meer zondaars zijn geweest dan alle andere Galileeërs, omdat zij zulke dingen hebben geleden? Ik zeg u: Nee; maar als u zich niet bekeert, zult u allen net zo omkomen.", "Ex 15:18": "De HEERE zal in eeuwigheid en voortdurend regeren!", "1 Petr 1:10": "Naar deze zaligheid hebben de profeten gezocht en onderzoek gedaan, zij die geprofeteerd hebben van de genade die voor u bestemd was;", "Ps 25:8": "Teth. De HEERE is goed en recht; daarom zal Hij de zondaars onderwijzen in de weg.", "Ps 81:9-14": "Mijn volk, zei Ik, luister, en Ik zal onder u betuigen, Israël, of u naar Mij zou horen! Er zal onder u geen uitlandse god zijn, en u zult u voor geen vreemde god neerbuigen. Ik ben de HEERE, uw God, Die u heb opgevoerd uit het land van Egypte; doe uw mond wijd open, en Ik zal hem vullen.", "Amos 5:6": "Zoek de HEERE, en leef; anders doorbreekt Hij in het huis van Jozef als een vuur, dat verteert, zodat er niemand is die het blust in Beth-el;", "Ps 138:5": "En zij zullen zingen van de wegen van de HEERE, want de heerlijkheid van de HEERE is groot.", "Jes 40:25": "Bij wie dan zult u Mij vergelijken, aan wie zou Ik gelijk zijn? zegt de Heilige.", "Job 22:18": "Hij had immers hun huizen met goed gevuld; daarom is de raad van de goddelozen ver van mij.", "Ex 3:19": "Toch weet Ik dat de koning van Egypte u niet zal laten gaan, ook niet door een sterke hand.", "Deut 32:21": "Zij hebben Mij tot ijver verwekt door wat geen God is; zij hebben Mij tot toorn verwekt door hun ijdelheden; Ik dan zal hen tot ijver verwekken door hen die geen volk zijn; door een dwaas volk zal Ik hen tot toorn verwekken.", "2 Sam 7:9": "En Ik ben met u geweest, overal waar u gegaan bent, en heb al uw vijanden voor uw aangezicht uitgeroeid; en Ik heb u een grote naam gemaakt, als de naam van de groten die op de aarde zijn.", "Jes 44:12-19": "De ijzersmid maakt een bijl, en werkt in de gloed, en formeert het met hamers, en werkt het met zijn sterke arm; ook lijdt hij honger, totdat hij krachteloos wordt, hij drinkt geen water, totdat hij uitgeput raakt. De timmerman trekt het richtsnoer uit, hij tekent het af met de draad, hij maakt het effen met de schaven, en tekent het met de passer, en maakt het naar de gestalte van een man, naar de schoonheid van een mens, zodat het in het huis blijft. Als hij zich ceders afhouwt, dan neemt hij een cipresboom of een eik, en hij versterkt zich onder de bomen van het woud; hij plant een olmboom, en de regen laat die groot worden.", "Matt 11:11": "Voorwaar, Ik zeg u: onder degenen die uit vrouwen geboren zijn, is niemand opgestaan die groter is dan Johannes de Doper; maar wie de minste is in het Koninkrijk der hemelen, is groter dan hij.", "Kol 2:14": "Hij heeft het handschrift uitgewist dat tegen ons was, bestaande in inzettingen, dat ons op enigerlei wijze tegenwerkte, en Hij heeft dat uit het midden weggenomen door het aan het kruis te nagelen;", "Ps 84:12": "Want God, de HEERE, is een Zon en Schild; de HEERE zal genade en eer geven; Hij zal het goede niet onthouden aan hen die in oprechtheid wandelen.", "Ps 33:13-15": "De HEERE kijkt uit de hemel, en ziet alle mensenkinderen. Hij ziet uit vanaf Zijn vaste woonplaats op alle inwoners van de aarde. Hij vormt hun aller hart; Hij let op al hun werken.", "Deut 4:40": "En u zult Zijn inzettingen en Zijn geboden houden, die ik u vandaag gebied, opdat het u en uw kinderen na u goed gaat, en opdat u de dagen verlengt in het land dat de HEERE, uw God, u geeft, voor altijd.", "Lev 26:40-42": "Dan zullen zij hun ongerechtigheid belijden, en de ongerechtigheid van hun vaderen met hun overtredingen, waarmee zij tegen Mij overtreden hebben, en ook dat zij tegen Mij in gewandeld hebben. Dat Ik ook tegen hen in gewandeld heb, en hen in het land van hun vijanden gebracht heb. Als dan hun onbesneden hart gebogen wordt, en zij dan de straf voor hun ongerechtigheid aanvaarden; Dan zal Ik denken aan Mijn verbond met Jakob, en ook aan Mijn verbond met Izak, en ook aan Mijn verbond met Abraham zal Ik denken, en aan het land zal Ik denken;", "Jona 1:14-16": "Toen riepen zij tot de HEERE, en zeiden: Och HEERE, laat ons toch niet vergaan om het leven van deze man, en leg geen onschuldig bloed op ons; want U, HEERE, hebt gedaan zoals het U heeft behaagd. En zij namen Jona op, en wierpen hem in de zee. Toen kwam de zee tot rust van haar woede. Daardoor werden de mannen erg bang voor de HEERE; en zij brachten de HEERE een slachtoffer, en deden geloften.", "Zach 8:12": "Want het zaad zal voorspoedig zijn, de wijnstok zal zijn vrucht geven, en de aarde zal haar opbrengst geven, en de hemel zal zijn dauw geven; en Ik zal het overblijfsel van dit volk dit alles doen erven.", "Jer 2:20": "Toen Ik van oude tijden af uw juk verbroken, en uw banden verscheurd had, zei u: Ik zal niet dienen; maar op alle hoge heuvels en onder elke groene boom loopt u om, hoererend.", "Ex 23:25": "En u zult de HEERE uw God dienen, dan zal Hij uw brood en uw water zegenen; en Ik zal de ziekten uit uw midden weren.", "Ezech 12:2": "Mensenkind! U woont in het midden van een opstandig huis, dat ogen heeft om te zien, en niet ziet, oren heeft om te horen, en niet hoort, want zij zijn een opstandig huis.", "Job 8:20": "Zie, God zal de oprechte niet verwerpen; Hij zal ook de boosdoeners niet bij de hand vatten;", "Matt 10:30": "En ook uw haren van het hoofd zijn alle geteld.", "Ps 41:14": "Geloofd zij de HEERE, de God van Israël, van eeuwigheid en tot in eeuwigheid! Amen, ja, amen.", "Spr 16:33": "Het lot wordt in de schoot geworpen; maar de hele beschikking daarover is van de HEERE.", "Joh 15:4": "Blijft in Mij, en Ik in u. Zoals de rank geen vrucht kan dragen uit zichzelf, als zij niet in de wijnstok blijft, zo ook u niet, als u in Mij niet blijft.", "Openb 2:22": "Zie, Ik werp haar op een bed, en hen die met haar overspel bedrijven in grote verdrukking, als zij zich niet bekeren van hun werken.", "Jes 45:22": "Wend u naar Mij toe, word behouden, alle einden van de aarde! Want Ik ben God, en niemand meer.", "Joël 2:11": "En de HEERE verheft Zijn stem voor Zijn leger uit; want Zijn leger is zeer groot, want Hij is machtig, Hij die Zijn woord uitvoert; want de dag van de HEERE is groot en zeer vreselijk, en wie zal hem kunnen verdragen?", "Jes 42:13": "De HEERE zal uittrekken als een held; Hij zal de ijver opwekken als een krijgsman; Hij zal juichen, ja, Hij zal een groot geschreeuw maken; Hij zal Zijn vijanden overweldigen.", "Rom 3:30": "omdat Hij één God is, Die de besnijdenis zal rechtvaardigen uit het geloof, en de onbesnedenen door het geloof.", "Job 9:10": "Die grote dingen doet, die men niet doorzoeken kan; en wonderen, die men niet tellen kan.", "Hand 4:12": "En de zaligheid is in geen Ander; want er is ook onder de hemel geen andere Naam, die onder de mensen gegeven is, waardoor wij moeten zalig worden.", "Jer 19:15": "Zo zegt de HEERE van de heerscharen, de God van Israël: Ziet, Ik zal over deze stad, en over al haar steden, al het kwaad brengen, dat Ik over haar gesproken heb; omdat zij hun nek verhard hebben, om Mijn woorden niet te horen.", "Ps 90:1": "Een gebed van Mozes, de man van God. Heere! U bent ons geweest een Toevlucht van geslacht tot geslacht.", "Dan 4:35": "En alle inwoners van de aarde worden als niets geacht, en Hij doet naar Zijn wil met het leger van de hemel en de inwoners van de aarde, en er is niemand die Zijn hand kan tegenhouden, of tegen Hem kan zeggen: Wat doet U?", "Jes 62:9": "Maar wie het inzamelen, zullen het eten, en zij zullen de HEERE prijzen; en wie het bijeenbrengen, zullen het drinken in de voorhoven van Mijn heiligdom.", "Rom 6:23": "Want het loon van de zonde is de dood, maar de genadegift van God is het eeuwige leven, door Jezus Christus, onze Heere.", "2 Kron 16:9": "Want wat de HEERE betreft, Zijn ogen doorlopen de hele aarde, om Zich sterk te bewijzen aan hen wier hart volkomen is tot Hem; hierin heeft u dwaas gedaan; want van nu af zullen er oorlogen tegen u zijn.", "1 Tim 1:17": "De Koning nu der eeuwen, de onverderfelijke, de onzichtbare, de alleen wijze God, zij eer en heerlijkheid in alle eeuwigheid. Amen.", "Hand 2:38": "En Petrus zei tegen hen: Bekeer u, en ieder van u moet gedoopt worden in de Naam van Jezus Christus, tot vergeving van de zonden; en u zult de gave van de Heilige Geest ontvangen.", "Ezra 8:25-27": "En ik woog hun toe het zilver, en het goud, en de vaten, zijnde de offering van het huis van onze God die de koning en zijn raadsheren, en zijn vorsten, en heel Israël, die daar gevonden werden, geofferd hadden; ik woog dan aan hun hand zeshonderdvijftig talenten van het zilver, en honderd zilveren vaten in talenten; aan goud, honderd talenten; en twintig gouden bekers, tot duizend drachmen; en twee vaten van blinkend goed koper, begeerlijk als goud.", "2 Kron 30:9": "Want als u zich bekeert tot de HEERE, zullen uw broeders en uw kinderen barmhartigheid vinden bij hen die hen gevangen hebben genomen, zodat zij in dit land zullen terugkomen; want de HEERE, uw God, is genadig en barmhartig, en zal Zijn aangezicht niet van u afwenden, als u zich tot Hem bekeert.", "Hab 3:15": "U betrad met Uw paarden de zee; het geweldige water werd een hoop.", "Jes 44:3-5": "Want Ik zal water gieten op de dorstige, en stromen op het droge; Ik zal Mijn Geest op uw nageslacht gieten, en Mijn zegen op uw nakomelingen. En zij zullen uitspruiten tussen het gras, als de wilgen aan de waterbeken. Deze zal zeggen: Ik ben van de HEERE; en die zal zich noemen met de naam van Jakob; en weer een ander zal met zijn hand schrijven: Ik ben van de HEERE, en zich noemen met de naam van Israël.", "Jer 32:28": "Daarom zegt de HEERE zo: Zie, Ik geef deze stad in de hand van de Chaldeeën, en in de hand van Nebukadnezar, de koning van Babel, en hij zal haar innemen.", "Ezra 8:23": "Zo vastten wij en verzochten dat van onze God; en Hij liet Zich door ons verbidden.", "Jes 41:17-20": "De ellendigen en behoeftigen zoeken water, maar er is geen; hun tong versmacht van dorst; Ik, de HEERE, zal hen verhoren, Ik, de God van Israël, zal hen niet verlaten. Ik zal rivieren openen op de hoge plaatsen, en bronnen in het midden van de valleien; Ik zal de woestijn tot een waterpoel maken, en het dorre land tot waterbronnen. Ik zal in de woestijn de cederboom, de sittimboom, en de mirteboom, en de olieboom zetten; Ik zal in de wildernis de denneboom, de beuk, en de busboom samen plaatsen;", "Jes 16:12": "En het zal gebeuren, wanneer men zal zien dat Moab moe geworden is op de hoogten, dan zal hij naar zijn heiligdom gaan om te aanbidden, maar hij zal het niet kunnen.", "1 Sam 9:16": "Morgen omstreeks deze tijd zal Ik naar u een man sturen uit het land van Benjamin, die zult u tot voorganger zalven over Mijn volk Israël; en hij zal Mijn volk verlossen uit de hand van de Filistijnen, want Ik heb naar Mijn volk omgezien, omdat hun geroep tot Mij gekomen is.", "Lev 26:21-24": "En als u tegen Mij in blijft ingaan, en Mij niet wilt horen, zal Ik over u, naar uw zonden, zevenvoudig slagen toedoen. Want Ik zal onder u zenden het gedierte van het veld, dat u van uw kinderen zal beroven, en uw vee zal uitroeien, en u zal verminderen; en uw wegen zullen woest worden. Als u door deze dingen nog niet getuchtigd bent, maar tegen Mij in blijft ingaan;", "Ex 11:7": "Maar bij alle kinderen van Israël zal geen hond zijn tong bewegen, van de mensen af tot de beesten toe; opdat u weet dat de HEERE tussen de Egyptenaren en tussen de Israëlieten een afzondering maakt.", "Matt 3:8": "Breng dan vruchten voort die bij de bekering passen.", "Ezech 36:28-38": "En u zult wonen in het land dat Ik uw vaderen gegeven heb, en u zult Mij tot een volk zijn, en Ik zal u tot een God zijn. En Ik zal u verlossen van al uw onreinheden; en Ik zal roepen tot het koren, en zal dat vermenigvuldigen, en Ik zal geen honger op u leggen. En Ik zal de vrucht van het geboomte en de opbrengst van het veld vermenigvuldigen, opdat u de smaad van het honger niet meer ontvangt onder de heidenen.", "Ps 145:6": "Vau. En zij zullen vermelden de kracht van Uw ontzagwekkende daden; en Uw grootheid, die zal ik vertellen.", "Jes 29:15": "Wee hun die zich diep willen verbergen voor de HEERE, hun raad verbergend; en wier werken in duisternis gebeuren, en zij zeggen: Wie ziet ons, en wie kent ons?", "Job 11:17-19": "Ja, uw levenstijd zal helderder dan de middag oprijzen; u zult stralen, als de morgenstond zult u zijn. En u zult vertrouwen, omdat er verwachting zal zijn; en u zult graven, gerust zult u slapen; En u zult neerliggen, en niemand zal u verschrikken; en velen zullen uw gezicht smeken.", "Jes 11:11": "Want het zal gebeuren op die dag, dat de Heere voor de tweede keer Zijn hand zal aanleggen om het overblijfsel van Zijn volk terug te verwerven, dat overgebleven zal zijn van Assyrië, en van Egypte, en van Pathros, en van Morenland, en van Elam, en van Sinear, en van Hamath, en van de eilanden van de zee.", "Jes 43:13": "Ook eer de dag was, ben Ik, en er is niemand, die uit Mijn hand redden kan; Ik zal werken, en wie zal het keren?", "1 Kron 28:9": "En u, mijn zoon Salomo, ken de God van uw vader, en dien Hem met een volkomen hart en met een gewillige ziel; want de HEERE doorzoekt alle harten, en Hij doorziet elk bedenksel van de gedachten; als u Hem zoekt, zal Hij door u gevonden worden; maar als u Hem verlaat, zal Hij u voor altijd verstoten.", "Jes 44:6": "Zo zegt de HEERE, de Koning van Israël, en zijn Verlosser, de HEERE van de heerscharen: Ik ben de Eerste, en Ik ben de Laatste, en behalve Mij is er geen God.", "Rom 4:3-25": "Want wat zegt de Schrift? En Abraham geloofde God, en het is hem gerekend tot rechtvaardigheid. Nu wordt hem die werkt het loon niet toegerekend naar genade, maar naar schuld. Doch hem die niet werkt, maar gelooft in Hem, Die de goddeloze rechtvaardigt, wordt zijn geloof gerekend tot rechtvaardigheid.", "Spr 3:23": "Dan zult u uw weg zeker gaan, en u zult uw voet niet stoten.", "Ezech 7:19": "Zij zullen hun zilver op de straten werpen, en hun goud zal tot onreinheid zijn; hun zilver en hun goud zal hen niet kunnen uithelpen ten dage van de verbolgenheid van de HEERE; hun ziel zullen zij niet verzadigen, en hun ingewanden zullen zij niet vullen; want het zal de aanstoot van hun ongerechtigheid zijn.", "Jes 43:17": "Die wagens en paarden, leger en macht voortbracht; samen zijn zij neergelegen, zij zullen niet weer opstaan, zij zijn uitgeblust, als een vlaswiek zijn zij uitgegaan.", "Ps 95:7": "Want Hij is onze God, en wij zijn het volk van Zijn weide, en de schapen van Zijn hand. Heden, als u Zijn stem hoort,", "Amos 9:13": "Zie, de dagen komen, spreekt de HEERE, dat de ploeger de maaier zal bereiken, en de druiventreder de zaadzaaier; en de bergen zullen van zoete wijn druipen, en alle heuvels zullen smelten.", "Tit 3:5": "Heeft Hij ons zalig gemaakt, niet uit de werken van de rechtvaardigheid die wij gedaan hadden, maar naar Zijn barmhartigheid, door het bad van de wedergeboorte en de vernieuwing door de Heilige Geest;", "Amos 5:8": "Die het Zevengesternte en de Orion maakt, en de doodsschaduw in de morgen verandert, en de dag als de nacht verduistert; Die de wateren van de zee roept, en ze uitgiet over de aardbodem, HEERE is Zijn Naam.", "1 Kon 2:4": "opdat de HEERE Zijn woord bevestigt, dat Hij over mij gesproken heeft, toen Hij zei: Als uw zonen hun weg bewaren, om voor Mijn aangezicht trouw, met hun hele hart en met hun hele ziel te wandelen, dan zal het u nooit ontbreken, zei Hij, aan een man op de troon van Israël.", "Hebr 12:28": "Daarom, omdat wij een onwankelbaar Koninkrijk ontvangen, laten wij de genade vasthouden, waardoor wij God welgevallig mogen dienen, met eerbied en godsvrucht.", "Jes 45:18": "Want zo zegt de HEERE, Die de hemelen geschapen heeft, die God, Die de aarde gevormd heeft, en Die haar gemaakt heeft; Hij heeft haar bevestigd, Hij heeft haar niet geschapen opdat zij leeg zou zijn, maar heeft haar gevormd opdat men daarin zou wonen: Ik ben de HEERE, en niemand meer.", "Ps 145:20": "Schin. De HEERE bewaart allen die Hem liefhebben; maar Hij verdelgt alle goddelozen.", "Mark 1:15": "en zei: De tijd is vervuld, en het Koninkrijk van God is nabijgekomen; bekeer u, en geloof het Evangelie.", "Rom 11:34": "Want wie heeft de zin van de Heere gekend? Of wie is Zijn raadsman geweest?", "Jes 28:16": "Daarom, zo zegt de Heere HEERE: Zie, Ik leg een grondsteen in Sion, een beproefde steen, een kostbare hoeksteen, die stevig gegrondvest is; wie gelooft, die zal niet haasten.", "Jes 45:15": "Voorwaar, U bent een God, Die Zich verborgen houdt, de God van Israël, de Heiland.", "Jes 57:19": "Ik schep de vrucht van de lippen: vrede, vrede voor hen die ver weg zijn, en voor hen die dichtbij zijn, zegt de HEERE, en Ik zal hen genezen.", "2 Sam 22:13": "Van de glans voor Hem heen werden kolen van het vuur aangestoken.", "Jer 10:3-16": "Want de inzettingen van de volken zijn ijdelheid; want het is hout, dat men uit het woud gehouwen heeft, een werk van de handen van de werkmeester met de bijl. Men pronkt het op met zilver en met goud; zij hechten het met spijkers en met hamers, opdat het niet waggelt. Zij zijn gelijk een palmboom van dicht werk, maar kunnen niet spreken; zij moeten gedragen worden, want zij kunnen niet gaan; vreest niet voor hen, want zij kunnen geen kwaad doen, ook is er geen goeddoen bij hen.", "Ps 78:1-72": "Een onderwijzing van Asaf. O mijn volk, neem mijn leer ter ore; neig uw oor tot de woorden van mijn mond. Ik zal mijn mond opendoen met spreuken; ik zal geheimen overvloedig uitstorten, van oude tijden af. Die wij gehoord hebben en weten, en onze vaders ons verteld hebben.", "Deut 12:28": "Neem het waar, en hoor al deze woorden die ik u gebied, opdat het u, en uw kinderen na u, goed gaat tot in eeuwigheid, als u zult gedaan hebben wat goed en recht is in de ogen van de HEERE, uw God.", "Job 5:24-26": "En u zult bevinden dat uw tent in vrede is; en u zult uw woning verzorgen, en zult niet feilen. Ook zult u bevinden dat uw nageslacht talrijk zal zijn, en uw spruiten als het kruid van de aarde. U zult in ouderdom naar het graf gaan, zoals de korenhoop op zijn tijd wordt opgevoerd.", "Ezech 34:22": "Daarom zal Ik Mijn schapen verlossen, zodat zij niet meer tot een roof zullen zijn; en Ik zal richten tussen klein vee en klein vee.", "Ef 2:9": "niet uit de werken, opdat niemand roemt.", "1 Kor 14:20": "Broeders, word geen kinderen in het verstand, maar wees kinderen in de boosheid, en word in het verstand volwassen.", "1 Sam 14:6": "Jonathan nu zei tegen de jongen die zijn wapens droeg: Kom, laten we naar de bezetting van deze onbesnedenen oversteken; misschien zal de HEERE voor ons werken, want bij de HEERE is geen belemmering om te verlossen door velen of door weinigen.", "Rom 8:1": "Er is dan nu geen veroordeling voor hen die in Christus Jezus zijn, die niet naar het vlees wandelen, maar naar de Geest.", "Ef 3:11": "naar het eeuwig voornemen, dat Hij gemaakt heeft in Christus Jezus, onze Heere;", "Jak 1:8": "Een dubbelhartig man is onstandvastig in al zijn wegen.", "Matt 24:14": "En dit Evangelie van het Koninkrijk zal in de hele wereld gepredikt worden tot een getuigenis voor alle volken; en dan zal het einde komen.", "Matt 10:29-31": "Worden niet twee musjes voor een penninkje verkocht? En niet één daarvan zal op de aarde vallen zonder uw Vader. En ook uw haren van het hoofd zijn alle geteld. Vreest dan niet; u gaat vele musjes te boven.", "Job 37:1-23": "Ook hierover beeft mijn hart, en springt op uit zijn plaats. Hoort met aandacht naar de beweging van Zijn stem, en het geluid dat uit Zijn mond uitgaat! Dat zendt Hij rechtuit onder de hele hemel, en Zijn licht over de einden der aarde.", "Ps 52:9": "Zie de man, die God niet tot Zijn Sterkte stelde, maar vertrouwde op de overvloed van het rijkdom; hij was sterk geworden door zijn beschadigen.", "Ef 2:1": "En u heeft Hij mede levend gemaakt, terwijl u dood was door de misdaden en de zonden;", "Openb 7:3": "en hij zei: Breng de aarde geen schade toe, of de zee, of de bomen, totdat wij de dienstknechten van onze God verzegeld hebben aan hun voorhoofden.", "Gen 15:15": "En u zult tot uw vaderen gaan in vrede; u zult in goede ouderdom begraven worden.", "1 Tim 2:5": "Want er is één God, er is ook één Middelaar van God en de mensen, de Mens Christus Jezus;", "Matt 6:32": "Want al deze dingen zoeken de heidenen; want uw hemelse Vader weet dat u al deze dingen nodig hebt.", "Joël 2:18-26": "Zo zal de HEERE ijveren over Zijn land, en Hij zal Zijn volk verschonen. En de HEERE zal antwoorden en tegen Zijn volk zeggen: Ziet, Ik zend u het koren, en de most, en de olie, zodat u daarvan verzadigd zult worden; en Ik zal u niet meer overgeven tot een smaad onder de heidenen. En Ik zal hem die uit het noorden komt ver van u doen vertrekken, en hem wegdrijven in een dor en woest land, zijn voorkant naar de Oostzee, en zijn achterkant naar de verste zee; en zijn stank zal opgaan, en zijn vuiligheid zal opgaan; want hij heeft grote dingen gedaan.", "Ezra 6:3": "In het eerste jaar van koning Kores gaf koning Kores dit bevel: Het huis van God te Jeruzalem, dat huis moet gebouwd worden op de plaats waar zij offeranden offeren, en de fundamenten daarvan moeten zwaar zijn; zijn hoogte zestig el, en zijn breedte zestig el;", "2 Kron 7:14": "En Mijn volk, over wie Mijn Naam genoemd wordt, zich verootmoedigt en bidt, en zij Mijn aangezicht zoeken, en zich bekeren van hun slechte wegen; dan zal Ik uit de hemel horen, en hun zonden vergeven, en hun land genezen.", "Spr 21:30": "Er is geen wijsheid, en er is geen verstand, en er is geen raad tegen de HEERE.", "Openb 21:6": "En Hij sprak tegen mij: Het is gebeurd. Ik ben de Alfa en de Omega, het Begin en het Einde. Ik zal de dorstige geven uit de bron van het water van het leven, voor niets.", "Jes 33:3": "Van het geluid van het rumoer zullen de volken wegvluchten; van Uw verhoging zullen de heidenvolken verstrooid worden.", "Jes 36:18": "Laat Hizkia u niet verleiden, door te zeggen: De HEERE zal ons redden; hebben de goden van de volken, ieder zijn eigen land, gered uit de hand van de koning van Assyrië?", "Hebr 12:23": "Tot de algemene vergadering en de gemeente van de eerstgeborenen, die in de hemelen opgeschreven zijn, en tot God, de Rechter over allen, en de geesten van de rechtvaardigen die volmaakt gemaakt zijn;", "Jes 59:19": "Dan zullen zij de Naam van de HEERE vrezen vanaf de neergang, en Zijn heerlijkheid vanaf de opgang van de zon; als de vijand zal komen als een stroom, zal de Geest van de HEERE de banier tegen hem oprichten.", "Jes 48:21": "En: Zij hadden geen dorst, toen Hij hen leidde door de woeste plaatsen; Hij deed hun water uit de rotssteen vloeien; toen Hij de rotssteen kliefde, vloeide het water daarheen.", "Luk 15:2": "En de Farizeeën en de Schriftgeleerden mopperden en zeiden: Deze man ontvangt de zondaars, en eet met hen.", "Jer 34:2": "Zo zegt de HEERE, de God van Israël: Ga heen en spreek tot Zedekia, de koning van Juda, en zeg tegen hem: Zo zegt de HEERE: Zie, Ik geef deze stad in de hand van de koning van Babel, en hij zal ze met vuur verbranden.", "Ps 144:12-15": "opdat onze zonen zijn als planten, die groot geworden zijn in hun jeugd; onze dochters als hoekstenen, uitgehouwen naar het voorbeeld van een paleis. Dat onze schuren vol zijn, de ene voorraad na de andere opleverend; dat onze kudden bij duizenden jongen werpen, ja, bij tienduizenden op onze velden zich vermenigvuldigen. Dat onze ossen goed beladen zijn; dat er geen inbraak is, geen uitval, geen gejammer op onze straten.", "Jes 2:5": "Kom, u huis van Jakob, en laat ons wandelen in het licht van de HEERE.", "Hab 2:19": "Wee hem die tegen het hout zegt: Word wakker! en: Ontwaak! tegen de zwijgende steen. Zou die kunnen leren? Zie, het is met goud en zilver overtrokken, en er is helemaal geen geest in het midden ervan.", "Mark 3:5": "En nadat Hij hen met toorn had aangekeken, bedroefd over de verharding van hun hart, zei Hij tegen de man: Strek uw hand uit. En hij strekte hem uit; en zijn hand werd hersteld, gezond als de andere.", "Spr 11:8": "De rechtvaardige wordt uit benauwdheid bevrijd; en de goddeloze komt in zijn plaats.", "Jer 33:11": "De stem van vreugde en de stem van blijdschap, de stem van de bruidegom en de stem van de bruid, de stem van hen die zeggen: Looft de HEERE van de heerscharen, want de HEERE is goed, want Zijn goedertierenheid is tot in eeuwigheid! de stem van hen die lof brengen naar het huis van de HEERE; want Ik zal de gevangenschap van het land wenden, als in het begin, zegt de HEERE.", "Rom 8:27": "En Hij Die de harten doorzoekt, weet wat het verlangen van de Geest is, omdat Hij naar de wil van God voor de heiligen bidt.", "Jes 41:6": "De een hielp de ander, en zei tegen zijn metgezel: Wees sterk!", "1 Kor 6:11": "En dit was u, sommigen van u; maar u bent afgewassen, maar u bent geheiligd, maar u bent gerechtvaardigd, in de Naam van de Heere Jezus, en door de Geest van onze God.", "Deut 12:7": "En daar zult u voor het aangezicht van de HEERE, uw God, eten en vrolijk zijn, u en uw huizen, over alles waaraan u uw hand geslagen hebt, waarin de HEERE, uw God, u gezegend heeft.", "Ps 50:21": "Deze dingen doet u, en Ik zwijg; u meent dat Ik helemaal ben zoals u; Ik zal u straffen, en zal het ordelijk voor uw ogen op een rij zetten.", "Zach 4:7": "Wie bent u, o grote berg? Voor het aangezicht van Zerubbabel zult u worden tot een vlak veld; want hij zal de hoofdsteen naar voren brengen onder toeroepingen: Genade, genade zij hem!", "Ps 7:12": "God is een rechtvaardige Rechter, en een God, Die iedere dag toornt.", "Num 23:23": "Want er is geen toverij tegen Jakob, en geen waarzeggerij tegen Israël. Op dit moment zal van Jakob gezegd worden, en van Israël, wat God tot stand gebracht heeft.", "Ps 121:7": "De HEERE zal u bewaren voor alle kwaad; uw ziel zal Hij bewaren.", "Zach 1:4": "Wees niet als uw vaderen, tot wie de vorige profeten riepen en zeiden: Zo zegt de HEERE van de heerscharen: Bekeer u toch van uw slechte wegen en uw slechte daden; maar zij hoorden niet, en zij luisterden niet naar Mij, spreekt de HEERE.", "Gen 1:30": "Maar aan al de dieren van de aarde, en aan al het gevogelte van de hemel, en aan al het kruipende gedierte op de aarde, waarin een levende ziel is, heb Ik al het groene gewas tot voedsel gegeven. En het was zo.", "Jes 60:1-22": "Maak u op, word verlicht, want uw licht komt, en de heerlijkheid van de HEERE gaat over u op. Want zie, de duisternis zal de aarde bedekken, en donkerheid de volken; maar over u zal de HEERE opgaan, en Zijn heerlijkheid zal over u gezien worden. En de heidenen zullen naar uw licht gaan, en koningen naar de glans die over u is opgegaan.", "2 Sam 22:28": "En U verlost het bedrukte volk; maar Uw ogen zijn tegen de hoogmoedigen, U zult hen vernederen.", "Zach 4:6": "Toen antwoordde Hij en sprak tegen mij: Dit is het woord van de HEERE tot Zerubbabel: Niet door kracht, ook niet door geweld, maar door Mijn Geest zal het gebeuren, zegt de HEERE van de heerscharen.", "Ps 104:29": "Verbergt U Uw gezicht, zij worden angstig; neemt U hun adem weg, zij sterven, en zij keren terug tot hun stof.", "Jes 25:6": "En de HEERE van de heerscharen zal op deze berg voor alle volken een vette maaltijd maken, een maaltijd van reine wijn, van vet vol merg, van reine wijnen, die gezuiverd zijn.", "Jes 45:5": "Ik ben de HEERE, en niemand meer, buiten Mij is er geen God; Ik zal u gorden, hoewel u Mij niet kent.", "Dan 2:28": "Maar er is een God in de hemel, Die geheimen openbaart, Die de koning Nebukadnezar bekendgemaakt heeft wat er gebeuren zal in het laatste der dagen; uw droom en de visioenen van uw hoofd op uw bed zijn deze:", "Jes 54:15": "Zie, zij zullen zich zeker verzamelen, maar niet uit Mij; wie zich tegen u verzamelen zal, die zal om uw wil vallen.", "2 Kron 36:22": "Maar in het eerste jaar van Kores, koning van Perzië, opdat het woord van de HEERE volbracht werd, door de mond van Jeremia, wekte de HEERE de geest op van Kores, koning van Perzië, zodat hij een stem liet doorgaan door zijn hele koninkrijk, ook zelfs op schrift, en hij zei:", "2 Kron 25:9": "En Amazia zei tegen de man van God: Maar wat moet men doen met de honderd talenten, die ik aan de troepen van Israël gegeven heb? En de man van God zei: De HEERE heeft meer dan dit, om u te geven.", "Hebr 13:8": "Jezus Christus is gisteren en heden Dezelfde, en tot in eeuwigheid.", "Dan 3:17": "Als het zo is, onze God, Die wij eren, is machtig om ons te verlossen uit de brandende vuuroven, en Hij zal ons uit uw hand, o koning, verlossen.", "Jes 43:3": "Want Ik ben de HEERE, uw God, de Heilige van Israël, uw Heiland; Ik heb Egypte, Morenland en Seba gegeven tot uw losgeld in uw plaats.", "Spr 10:22": "De zegen van de HEERE, die maakt rijk; en Hij voegt er geen smart aan toe.", "Hand 20:33": "Ik heb niemands zilver, of goud, of kleding begeerd.", "Jes 55:1-3": "O, alle dorstigen, kom tot de wateren, en u die geen geld heeft, kom, koop en eet, ja kom, koop zonder geld en zonder prijs, wijn en melk! Waarom weegt u geld uit voor wat geen brood is, en uw arbeid voor wat niet verzadigen kan? Hoor aandachtig naar Mij, en eet het goede, en laat uw ziel zich verlustigen in vettigheid. Neig uw oor, en kom tot Mij, hoor en uw ziel zal leven; want Ik zal met u een eeuwig verbond maken, en u geven de zekere weldaden van David.", "1 Petr 3:13": "En wie is het die u kwaad zal doen, als u navolgers bent van het goede?", "Hebr 4:1-10": "Laat ons dan vrezen dat niet iemand van u, terwijl de belofte om in Zijn rust in te gaan nog geldt, schijnt achtergebleven te zijn. Want ook ons is het Evangelie verkondigd, net als hun; maar het gehoorde woord deed hun geen nut, omdat het bij hen die het hoorden niet met geloof gemengd was. Want wij die geloofd hebben, gaan de rust in, zoals Hij gezegd heeft: Zo heb Ik dan in Mijn toorn gezworen: Zij zullen Mijn rust niet ingaan! Hoewel Zijn werken al vanaf de grondlegging van de wereld volbracht waren.", "Jes 62:11": "Ziet, de HEERE heeft doen horen, tot aan het einde van de aarde: zegt tegen de dochter van Sion: Zie, uw Heil komt; zie, Zijn loon is met Hem, en Zijn arbeidsloon is voor Zijn aangezicht.", "Jes 43:20": "Het gedierte van het veld zal Mij eren, de jakhalzen en de jonge struisvogels; want Ik zal in de woestijn water geven, en rivieren in de wildernis, om Mijn volk, Mijn uitverkorenen te drinken te geven.", "Ezra 5:17": "Als het de koning dan nu goeddunkt, laat er gezocht worden in het schathuis van de koning daar, dat te Babel is, of het zo is dat een bevel van de koning Kores gegeven is om dit huis van God te Jeruzalem te bouwen; en dat men ons het believen van de koning hierover laat weten.", "Hagg 2:20": "Is er nog zaad in de schuur? Zelfs de wijnstok, en de vijgenboom, en de granaatappelboom, en de olijfboom, die niet gedragen hebben, die zal Ik vanaf deze dag zegenen.", "Mark 6:12": "En zij gingen uit, en predikten dat de mensen zich moesten bekeren.", "2 Kor 6:17": "Daarom, ga uit hun midden weg, en scheid u af, zegt de Heere, en raak niet aan wat onrein is, en Ik zal u aannemen,", "Hebr 1:3": "Die, omdat Hij het Afschijnsel is van Zijn heerlijkheid en het uitgedrukte Beeld van Zijn zelfstandigheid, en alle dingen draagt door het woord van Zijn kracht, nadat Hij de reiniging van onze zonden door Zichzelf tot stand gebracht heeft, is gaan zitten aan de rechterhand van de Majesteit in de hoogste hemelen;", "Joël 2:18": "Zo zal de HEERE ijveren over Zijn land, en Hij zal Zijn volk verschonen.", "Luk 15:4-32": "Welk mens onder u, die honderd schapen heeft, en één daarvan verliest, laat niet de negenennegentig achter in de woestijn, en gaat achter het verlorene aan, totdat hij dat vindt? En als hij het gevonden heeft, legt hij het op zijn schouders, verblijd. En als hij thuiskomt, roept hij de vrienden en de buren bijeen, en zegt tegen hen: Wees blij met mij; want ik heb mijn schaap gevonden, dat verloren was.", "Jes 9:1": "Het volk dat in duisternis wandelt, zal een groot licht zien; wie wonen in het land van de schaduw van de dood, over hen zal een licht schijnen.", "Spr 12:3": "De mens zal niet bevestigd worden door goddeloosheid; maar de wortel van de rechtvaardigen zal niet bewogen worden.", "Ps 105:14-45": "Liet Hij geen mens toe hen te onderdrukken; ook bestrafte Hij koningen om hunnentwil, en zei: Raak Mijn gezalfden niet aan, en doe Mijn profeten geen kwaad. Hij riep ook een honger over het land; Hij brak elke staf van het brood.", "Spr 17:3": "De smeltkroes is voor het zilver, en de oven voor het goud; maar de HEERE toetst de harten.", "Jer 26:3": "Misschien zullen zij horen, en zich bekeren, ieder van zijn boze weg; zo zou Ik berouw hebben over het kwaad dat Ik hun denk te doen vanwege de boosheid van hun daden.", "Dan 2:20": "Daniël antwoordde en zei: De Naam van God zij geloofd van eeuwigheid tot in eeuwigheid, want van Hem is de wijsheid en de kracht.", "Jes 60:21": "En uw volk zullen allen samen rechtvaardig zijn, zij zullen voor eeuwig de aarde erfelijk bezitten; zij zullen zijn een scheut van Mijn planting, een werk van Mijn handen, opdat Ik verheerlijkt word.", "Job 24:1": "Waarom zouden voor de Almachtige de tijden niet verborgen zijn, terwijl zij die Hem kennen Zijn dagen niet zien?", "Ps 10:17": "HEERE, U hebt de wens van de zachtmoedigen gehoord; U zult hun hart sterken, Uw oor zal opmerken;", "Ps 104:24": "Hoe groot zijn Uw werken, o HEERE! U hebt ze allemaal met wijsheid gemaakt; het aardrijk is vol van Uw rijkdom.", "Deut 32:37-39": "Dan zal Hij zeggen: Waar zijn hun goden, de rotssteen, op wie zij vertrouwden? Van wiens slachtoffers zij het vet aten, van wiens drankoffers zij de wijn dronken; laten zij opstaan en u helpen, zodat er bescherming voor u is. Zie nu, dat Ik, Ik DIE ben, en geen God met Mij; Ik dood en maak levend; Ik versla en Ik heel; en er is niemand die uit Mijn hand redt!", "Ezech 20:21": "Maar die kinderen waren ook opstandig tegen Mij; zij wandelden niet in Mijn inzettingen, en Mijn rechten namen zij niet in acht om die te doen, die, als een mens ze doet, hij daardoor zal leven; zij ontheiligden Mijn sabbatten, zodat Ik zei dat Ik Mijn grimmigheid over hen zou uitgieten, om Mijn toorn tegen hen te volbrengen in de woestijn.", "Spr 9:6": "Verlaat de dwaasheden, en leef; en treed in de weg van het verstand.", "Matt 2:11": "En toen zij in het huis gekomen waren, vonden zij het Kindje met Maria, Zijn moeder, en zij vielen neer en aanbaden Het; en na hun schatten geopend te hebben, brachten zij Hem geschenken: goud, wierook en mirre.", "Ps 147:16": "Hij geeft sneeuw als wol; Hij strooit de rijp als as.", "Hebr 1:8": "Maar tot de Zoon zegt Hij: Uw troon, o God, is er in alle eeuwigheid; de scepter van Uw koninkrijk is een rechte scepter.", "Job 23:14": "Want Hij zal volbrengen wat over mij bepaald is; en dergelijke dingen zijn er veel bij Hem.", "Jer 11:8": "Maar zij hebben niet gehoord, en ook hun oor niet geneigd, maar hebben gewandeld, ieder naar het goeddunken van hun boze hart; daarom heb Ik over hen gebracht al de woorden van dit verbond, dat Ik geboden had te doen, maar zij hebben het niet gedaan.", "Ps 80:2": "O Herder van Israël! Neem het ter oor, U Die Jozef als schapen leidde; U Die tussen de cherubs zit, verschijn blinkend.", "Ps 139:1-24": "Een psalm van David, voor de koorleider. HEERE! U doorgrondt en kent mij. U weet mijn zitten en mijn opstaan; U verstaat van verre mijn gedachten. U omringt mijn gaan en mijn liggen; en U bent al mijn wegen gewend.", "2 Tess 2:16": "En onze Heere Jezus Christus Zelf, en onze God en Vader, Die ons heeft liefgehad, en een eeuwige vertroosting en goede hoop gegeven heeft in genade,", "Jes 30:23-26": "Dan zal Hij uw zaad, waarmee u het land bezaaid hebt, regen geven, en brood van de opbrengst van het land, en dat zal vet en overvloedig zijn; uw vee zal op die dag in een wijde landouwe weiden. En de ossen, en ezelveulens, die het land bewerken, zullen zuiver voeder eten, dat verschud is met de werpschoffel en met de wan. En er zullen op elke hoge berg, en op elke hoge heuvel, beekjes en watervlieten zijn, op de dag van de grote slachting, wanneer de torens vallen zullen.", "Ps 147:8": "Die de hemel met wolken bedekt, Die voor de aarde regen klaarmaakt; Die het gras op de bergen laat opkomen;", "Richt 18:17": "Maar de vijf mannen die gegaan waren om het land te verkennen, gingen naar binnen, kwamen daar aan, en namen het gesneden beeld weg, en de efod, en de terafim, en het gegoten beeld; de priester bleef staan bij de ingang van de poort, met de zeshonderd mannen die met oorlogswapens aangegord waren.", "Zach 4:10": "Want wie veracht de dag van de kleine dingen? Toch zullen die zeven zich verblijden, als zij het tinnen gewicht zullen zien in de hand van Zerubbabel; dat zijn de ogen van de HEERE, die het hele land doorkruisen.", "Ex 9:14": "Want ditmaal zal Ik al Mijn plagen in uw hart zenden, en over uw dienaren en over uw volk, zodat u weet dat er niemand is zoals Ik, op de hele aarde.", "Ps 68:19-21": "U bent opgevaren in de hoogte; U hebt de gevangenis gevankelijk weggevoerd; U hebt gaven genomen om uit te delen onder de mensen; ja, ook de opstandigen, om bij U te wonen, o HEERE God! Geloofd zij de Heere; dag bij dag overlaadt Hij ons. Die God is onze Zaligheid. Sela. Die God is voor ons een God van volkomen zaligheid; en bij de HEERE, de Heere, zijn de uitkomsten tegen de dood.", "Jer 6:8": "Laat u tuchtigen, Jeruzalem! Opdat Mijn ziel niet van u afgetrokken wordt, opdat Ik u niet stel tot een woestheid, tot een onbewoond land.", "Deut 33:12": "En van Benjamin zei hij: De beminde van de HEERE, hij zal zeker bij Hem wonen. Hij zal hem de hele dag overdekken, en tussen Zijn schouders zal hij wonen!", "Jer 32:27": "Zie, Ik ben de HEERE, de God van alle vlees; zou voor Mij iets te wonderlijk zijn?", "Ex 15:17": "Hen zult U inbrengen, en planten op de berg van Uw erfenis, op de plaats die U, o HEERE, gemaakt hebt om te wonen, het heiligdom, dat Uw handen gesticht hebben, o Heere!", "Openb 15:7": "En een van de vier dieren gaf de zeven engelen zeven gouden schalen, vol van de toorn van God, Die leeft in alle eeuwigheid.", "1 Kron 16:35": "En zegt: Verlos ons, o God van ons heil, en verzamel ons, en red ons van de heidenen, opdat wij Uw heilige Naam loven, en opdat wij ons in Uw lof roemen.", "Gal 3:11": "En dat niemand door de wet gerechtvaardigd wordt voor God, is duidelijk; want de rechtvaardige zal uit het geloof leven.", "Ps 78:12-16": "Voor hun vaderen had Hij wonder gedaan, in Egypteland, in het veld van Zoan. Hij kliefde de zee, en liet hen erdoorheen gaan; en de wateren liet Hij staan als een hoop. En Hij leidde hen overdag met een wolk, en de hele nacht met een licht van het vuur.", "Hos 13:10": "Waar is uw koning nu? Laat hij u toch redden in al uw steden! En uw rechters, van wie u zei: Geef mij een koning en vorsten?", "Job 22:24": "Dan zult u het goud op het stof leggen, en het goud van Ofir bij de rotssteen van de beken;", "Jes 44:7": "En wie zal, zoals Ik, roepen en het verkondigen, en het op orde voor Mij zetten, sinds Ik een eeuwig volk gesteld heb? En laat ze de toekomstige dingen, en die komen zullen, hun verkondigen.", "Ezech 20:8": "Maar zij waren opstandig tegen Mij, en wilden naar Mij niet horen; niemand wierp de verfoeisels van zijn ogen weg, en niemand verliet de drekgoden van Egypte; daarom zei Ik dat Ik Mijn grimmigheid over hen zou uitgieten, om Mijn toorn tegen hen te volbrengen midden in Egypteland.", "Ps 82:5": "Zij weten niet, en verstaan niet; zij wandelen steeds in duisternis; daardoor wankelen alle fundamenten van de aarde.", "1 Joh 5:11": "En dit is het getuigenis, namelijk dat God ons het eeuwige leven gegeven heeft; en dit leven is in Zijn Zoon.", "Hand 17:22": "En Paulus stond op in het midden van de plaats die Areopagus heet, en zei: Mannen van Athene, ik bemerk dat u in alles buitengewoon godsdienstig bent.", "Jer 51:15": "Die de aarde gemaakt heeft door Zijn kracht, Die de wereld bereid heeft door Zijn wijsheid, en de hemel uitgebreid door Zijn verstand;", "Richt 13:16": "Maar de Engel van de HEERE zei tegen Manoach: Al zou u Mij ophouden, Ik zal van uw brood niet eten; en als u een brandoffer wilt brengen, moet u dat aan de HEERE offeren. Want Manoach wist niet dat het een Engel van de HEERE was.", "Kol 1:27": "aan wie God bekend heeft willen maken wat de rijkdom is van de heerlijkheid van deze verborgenheid onder de heidenen, welke is Christus onder u, de Hoop der heerlijkheid;", "Ef 4:6": "Eén God en Vader van allen, Die boven allen is, en door allen, en in u allen.", "Jes 48:15": "Ik, Ik heb het gesproken, ook heb Ik hem geroepen; Ik zal hem doen komen, en hij zal voorspoedig zijn op zijn weg.", "Job 36:27-33": "Want Hij trekt de druppels van het water op, die als regen neerdruppelen door zijn damp; Die de wolken uitgieten, en over de mens overvloedig afdruipen. Kan iemand oo
