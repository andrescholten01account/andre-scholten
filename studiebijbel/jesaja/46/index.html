 geworpen worden. Daarom, op dat moment, toen al die volken het geluid hoorden van de hoorn, de pijp, de citer, de vedel, de psalters, en allerlei soorten muziek, vielen alle volken, naties en tongen neer en aanbaden het gouden beeld, dat de koning Nebukadnezar had opgericht.", "Hebr 12:26": "Wiens stem toen de aarde deed beven; maar nu heeft Hij verkondigd en gezegd: Nog eenmaal zal Ik niet alleen de aarde doen beven, maar ook de hemel.", "Jer 16:19-21": "O HEERE! U bent mijn Sterkte, en mijn Sterkheid, en mijn Toevlucht ten dage van de benauwdheid; tot U zullen de heidenen komen van de einden van de aarde, en zeggen: Zeker hebben onze vaders leugen erfelijk bezeten, en ijdelheid, waarin toch niets was, dat nut deed. Zal een mens zich goden maken? Zij zijn toch geen goden. Daarom, zie, Ik zal hun bekendmaken op dit moment; Ik zal hun Mijn hand en Mijn macht bekendmaken; en zij zullen weten, dat Mijn Naam is HEERE.", "Luk 18:27": "En Hij zei: De dingen die onmogelijk zijn bij de mensen, zijn mogelijk bij God.", "Joh 4:22": "U aanbidt wat u niet weet; wij aanbidden wat wij weten; want de zaligheid is uit de Joden.", "Deut 6:2-25": "Opdat u de HEERE, uw God, vreest, om al Zijn inzettingen en Zijn geboden te houden, die ik u gebied; u, en uw kind, en kindskind, al de dagen van uw leven; en opdat uw dagen verlengd worden. Hoor dan, Israël! en let erop dat u ze doet, opdat het u goed gaat, en opdat u zeer vermenigvuldigt (zoals de HEERE, de God van uw vaderen, u gesproken heeft) in het land, dat overvloeit van melk en honing. Hoor, Israël! De HEERE, onze God, is een enig HEERE!", "Rom 11:23": "Maar ook zij, als zij in het ongeloof niet blijven, zullen ingeënt worden; want God is machtig om hen weer in te enten.", "Jes 51:6": "Hef uw ogen op naar de hemel, en kijk naar de aarde beneden; want de hemel zal als rook verdwijnen, en de aarde zal als een kleed verouderen, en haar inwoners zullen op dezelfde manier sterven; maar Mijn heil zal in eeuwigheid zijn, Mijn gerechtigheid zal niet verbroken worden.", "Jes 21:2": "Een hard visioen is mij bekendgemaakt: die trouweloze handelt trouweloos, en die verwoester verwoest; trek op, o Elam! beleger het, o Media! Ik heb al haar gezucht doen ophouden.", "Ps 89:2-38": "Ik zal de goedertierenheid van de HEERE eeuwig zingen; ik zal Uw waarheid met mijn mond bekend maken, van geslacht tot geslacht. Want ik heb gezegd: Uw goedertierenheid zal eeuwig gebouwd worden; in de hemelen zelf hebt Gij Uw waarheid bevestigd, en gezegd: Ik heb een verbond gemaakt met Mijn uitverkorene; Ik heb Mijn knecht David gezworen:", "Openb 16:5": "En ik hoorde de engel van het water zeggen: U bent rechtvaardig, Heere! Die is, en Die was, en Die zijn zal, dat U dit geoordeeld hebt;", "Ex 23:22": "Maar als u Zijn stem echt gehoorzaamt, en doet al wat Ik zeggen zal, dan zal Ik de vijand van uw vijanden zijn, en de tegenstander van wie u tegenstaat.", "Ps 23:1-6": "Een psalm van David. De HEERE is mijn Herder, mij zal niets ontbreken. Hij laat mij neerliggen in grazige weiden; Hij voert mij zachtjes naar zeer stille wateren. Hij verkwikt mijn ziel; Hij leidt mij in het spoor van de gerechtigheid, omwille van Zijn Naam.", "Jes 42:16": "En Ik zal de blinden leiden door de weg die zij niet gekend hebben, Ik zal ze doen gaan door de paden die zij niet gekend hebben; Ik zal de duisternis voor hun ogen tot licht maken, en het kromme tot recht; deze dingen zal Ik hun doen, en Ik zal hen niet verlaten.", "Ps 65:10-14": "U bezoekt het land, en hebt het begerig gemaakt, U verrijkt het overvloedig; de rivier van God is vol water; wanneer U het zo bereid hebt, maakt U hun koren gereed. U maakt zijn opgeploegde aarde dronken; U doet ze dalen in zijn voren; U maakt het zacht door de druppels; U zegent zijn uitspruitsel. U kroont het jaar van Uw goedheid; en Uw voetstappen druipen van vettigheid.", "Ex 15:13": "U leidde door Uw goedheid dit volk, dat U verlost hebt; U voert hen zachtjes door Uw sterkte naar de liefelijke woning van Uw heiligheid.", "Ps 37:17": "Want de armen van de goddelozen zullen verbroken worden; maar de HEERE ondersteunt de rechtvaardigen.", "1 Kon 18:26": "En zij namen de stier die hij hun gegeven had, en bereidden hem, en riepen de naam van Baäl aan, van de morgen tot de middag, en zeiden: O Baäl, antwoord ons! Maar er was geen stem en geen die antwoordde. En zij sprongen tegen het altaar dat men gemaakt had.", "Ps 96:1-13": "Zingt de HEERE een nieuw lied; zingt de HEERE, heel de aarde! Zingt de HEERE, looft Zijn Naam; verkondigt Zijn heil van dag tot dag. Vertelt onder de heidenen Zijn eer, onder alle volken Zijn wonderen.", "Hab 2:4": "Zie, wie zich verheft, zijn ziel is niet oprecht in hem; maar de rechtvaardige zal door zijn geloof leven.", "2 Petr 2:9": "dan weet de Heere hoe Hij de godvruchtigen uit de verzoeking moet verlossen, en de onrechtvaardigen moet bewaren tot de dag van het oordeel om gestraft te worden;", "Ps 62:12": "God heeft één ding gesproken, dit heb ik tweemaal gehoord: dat de sterkte van God is.", "1 Kon 8:33-50": "Wanneer Uw volk Israël verslagen wordt voor het aangezicht van de vijand, omdat zij tegen U gezondigd zullen hebben, en zich tot U bekeren, en Uw Naam belijden, en tot U in dit huis bidden en smeken zullen; hoor Ú dan in de hemel, en vergeef de zonde van Uw volk Israël, en breng hen terug in het land, dat U hun vaderen gegeven hebt. Als de hemel gesloten zal zijn, zodat er geen regen is, omdat zij tegen U gezondigd zullen hebben; en zij op deze plaats bidden, en Uw Naam belijden, en zich van hun zonden bekeren zullen, wanneer U hen geplaagd zult hebben;", "Jak 2:20-23": "Maar wilt u weten, o nietig mens, dat het geloof zonder de werken dood is? Is Abraham, onze vader, niet uit de werken gerechtvaardigd, toen hij Izak, zijn zoon, op het altaar geofferd heeft? Ziet u wel dat het geloof samenwerkte met zijn werken, en dat het geloof volmaakt is geworden uit de werken?", "Jes 41:4": "Wie heeft dit gedaan en tot stand gebracht, terwijl Hij de geslachten riep van het begin af? Ik, de HEERE, Die de Eerste ben, en met de Laatste ben Ik Dezelfde.", "2 Kor 5:21": "Want Hem Die geen zonde gekend heeft, heeft Hij voor ons tot zonde gemaakt, opdat wij zouden worden rechtvaardigheid van God in Hem.", "Jes 33:16": "Die zal in de hoogten wonen, de sterkten van de steenrotsen zullen zijn hoge schuilplaats zijn; zijn brood wordt hem gegeven, zijn water is gewis.", "1 Kron 29:28": "En hij stierf op hoge leeftijd, verzadigd van dagen, rijkdom en eer; en zijn zoon Salomo regeerde in zijn plaats.", "Rom 16:27": "Hem, de alleen wijze God, zij door Jezus Christus de heerlijkheid tot in eeuwigheid. Amen. De brief aan de Romeinen is geschreven vanuit Korinthe, en gezonden door Febe, de dienares van de gemeente die te Kenchreen is.", "Ps 36:9": "Zij worden dronken van de vettigheid van uw huis; en U drenkt hen uit de beek van Uw wellusten.", "Jer 7:13-34": "En nu, omdat u al deze werken doet, spreekt de HEERE, en Ik tot u gesproken heb, vroeg opgestaan en gesproken, maar u niet gehoord hebt, en Ik u geroepen heb, maar u niet geantwoord hebt; daarom zal Ik aan dit huis, dat naar Mijn Naam genoemd is, waarop u vertrouwt, en aan deze plaats, die Ik u en uw vaderen gegeven heb, doen zoals Ik aan Silo gedaan heb. En Ik zal u van Mijn aangezicht wegwerpen, zoals Ik al uw broeders, het hele nageslacht van Efraïm, weggeworpen heb.", "Ezech 9:9": "Toen zei Hij tot mij: De ongerechtigheid van het huis van Israël en van Juda is heel erg groot, en het land is met bloed vervuld, en de stad is vol van afwijking; want zij zeggen: De HEERE heeft het land verlaten, en de HEERE ziet niet.", "Matt 5:45": "opdat u kinderen mag zijn van uw Vader, Die in de hemelen is; want Hij laat Zijn zon opgaan over bozen en goeden, en laat het regenen over rechtvaardigen en onrechtvaardigen.", "Jes 51:9": "Ontwaak, ontwaak, trek sterkte aan, Arm van de HEERE! Ontwaak als in de dagen van vroeger, in de geslachten van oude tijden af; bent U het niet, Die Rahab uitgehouwen hebt, Die de zeedraak doorstoken hebt?", "Openb 12:10": "En ik hoorde een grote stem, die zei in de hemel: Nu is de zaligheid, en de kracht, en het koninkrijk van onze God gekomen; en de macht van Zijn Christus; want de aanklager van onze broeders, die hen aanklaagde voor onze God dag en nacht, is neergeworpen.", "Ps 103:3-5": "Die al uw ongerechtigheid vergeeft, die al uw ziekten geneest; Die uw leven verlost van het verderf, die u kroont met goedertierenheid en barmhartigheden; Die uw mond verzadigt met het goede, uw jeugd vernieuwt als die van een arend.", "Jer 8:22": "Is er geen balsem in Gilead? Is er geen heelmeester daar? Want waarom is de genezing van de dochter van mijn volk niet gekomen?", "Spr 19:21": "In het hart van de man zijn veel gedachten; maar de raad van de HEERE, die zal standhouden.", "Jer 11:4": "Dat Ik uw vaderen geboden heb, op de dag dat Ik hen uit Egypteland, uit de ijzeroven, uitvoerde, en Ik zei: Wees Mijn stem gehoorzaam, en doe die, naar alles wat Ik u gebied; zo zult u Mij tot een volk zijn, en Ik zal u tot een God zijn;", "Ps 78:26": "Hij dreef de oostenwind voort aan de hemel, en voerde de zuidenwind aan door Zijn sterkte;", "Ps 146:8": "De HEERE opent de ogen van de blinden; de HEERE richt de gebogenen op; de HEERE heeft de rechtvaardigen lief.", "Joël 2:28-31": "En daarna zal het gebeuren, dat Ik Mijn Geest zal uitgieten over alle vlees, en uw zonen en uw dochters zullen profeteren; uw ouden zullen dromen dromen, uw jongelingen zullen gezichten zien; Ja, ook over de dienstknechten, en over de dienstmaagden, zal Ik in die dagen Mijn Geest uitgieten. En Ik zal wondertekenen geven in de hemel en op de aarde: bloed, en vuur, en rookpilaren.", "Ps 67:7": "De aarde geeft haar opbrengst; God, onze God, zal ons zegenen.", "Jer 23:8": "Maar: Zo waarachtig als de HEERE leeft, Die het nageslacht van het huis van Israël heeft opgevoerd, en Die het heeft aangebracht uit het land van het noorden, en uit al de landen waarheen Ik ze gedreven had! Want zij zullen wonen in hun land.", "Rom 14:11": "Want er is geschreven: Ik leef, zegt de Heere, voor Mij zal elke knie zich buigen, en elke tong zal God belijden.", "Jer 4:2": "Maar zweer: Zo waarachtig als de HEERE leeft! in waarheid, in recht en in gerechtigheid; dan zullen de heidenvolken zich in Hem zegenen, en zich in Hem beroemen.", "Ps 18:28": "Want U verlost het bedrukte volk, maar de hoge ogen vernedert U.", "Ps 78:8": "En dat zij niet zouden worden zoals hun vaders, een opstandig en weerspannig geslacht; een geslacht dat zijn hart niet richtte, en waarvan de geest niet trouw was met God.", "Ps 105:1": "Looft de HEERE, roept Zijn Naam aan, maakt Zijn daden bekend onder de volken.", "Jes 56:3-8": "En de vreemdeling, die zich bij de HEERE gevoegd heeft, moet niet zeggen: De HEERE heeft mij helemaal van Zijn volk gescheiden; en de ontmande moet niet zeggen: Zie, ik ben een dorre boom. Want zo zegt de HEERE van de ontmanden, die Mijn sabbatten houden, en verkiezen wat Mij behaagt, en vasthouden aan Mijn verbond; Ik zal hun ook in Mijn huis en binnen Mijn muren een plaats en een naam geven, beter dan van zonen en dan van dochters; een eeuwige naam zal Ik ieder van hen geven, die niet uitgeroeid zal worden.", "Ps 145:9": "Teth. De HEERE is voor allen goed, en Zijn barmhartigheden zijn over al Zijn werken.", "Ps 68:34": "Voor Hem, Die daar rijdt in de hemel der hemelen, Die er van oudsher is; zie, Hij geeft Zijn stem, een stem van sterkte.", "Spr 20:22": "Zeg niet: Ik zal het kwaad vergelden; wacht op de HEERE, en Hij zal u verlossen.", "Joz 1:8": "Laat het boek van deze wet niet wijken van uw mond, maar overleg het dag en nacht, opdat u waarneemt te doen naar alles wat daarin geschreven is; want dan zult u uw wegen voorspoedig maken, en dan zult u verstandig handelen.", "Micha 2:13": "De doorbreker zal voor hen uittrekken; zij zullen doorbreken en door de poort gaan, en daardoor naar buiten trekken; en hun koning zal voor hen uit heengaan, en de HEERE aan hun spits.", "Jer 13:27": "Uw overspelen en uw hunkeringen, de schandelijkheid van uw hoererij, op heuvels, in het veld; Ik heb uw gruwelen gezien; wee u, Jeruzalem! Zult u niet rein worden? Hoe lang nog hierna?", "Hand 7:51": "U hardnekkigen en onbesnedenen van hart en oren, u weerstaat altijd de Heilige Geest; zoals uw vaders deden, zo doet u ook.", "Hebr 12:27": "En dit woord: Nog eenmaal, wijst aan de verandering van de dingen die bewegen kunnen, alsof zij gemaakt waren, opdat blijven zouden de dingen die niet bewegen kunnen.", "Ps 14:5": "Daar zijn zij door grote angst overvallen; want God is bij het geslacht van de rechtvaardige.", "Ps 33:9": "Want Hij spreekt, en het is er; Hij gebiedt, en het staat er.", "Ps 68:32": "Prinselijke gezanten zullen komen uit Egypte; Morenland zal zich haasten zijn handen tot God uit te strekken.", "Matt 4:17": "Van toen af aan begon Jezus te prediken en te zeggen: Bekeer u; want het Koninkrijk der hemelen is nabijgekomen.", "Job 39:3": "Wie bereidt de raaf haar kost, als haar jongen tot God schreeuwen, als zij dwalen, omdat er geen eten is?", "Jes 43:7": "ieder, die naar Mijn Naam genoemd is, en die Ik geschapen heb tot Mijn eer, die Ik geformeerd heb, die Ik ook gemaakt heb.", "Zach 10:1": "Vraag van de HEERE regen, in de tijd van de late regen; de HEERE maakt de bliksemwolken¹, en Hij zal hun regen genoeg geven, voor ieder kruid op het veld.", "Ps 71:15": "Mijn mond zal Uw gerechtigheid vertellen, de hele dag Uw heil; hoewel ik de getallen ervan niet weet.", "Joh 3:17": "Want God heeft Zijn Zoon niet in de wereld gezonden opdat Hij de wereld zou veroordelen, maar opdat de wereld door Hem behouden zou worden.", "1 Sam 2:3": "Maak het niet te veel, dat u hoog, hoog zou spreken, dat iets hards uit uw mond zou gaan; want de HEERE is een God van wetenschappen, en Zijn daden zijn recht gedaan.", "Ps 34:8": "Cheth. De Engel van de HEERE legert Zich rondom hen die Hem vrezen, en redt hen.", "Luk 12:7": "Ja, ook de haren van uw hoofd zijn allemaal geteld. Wees dan niet bang; u gaat vele musjes te boven.", "Matt 24:48-51": "Maar als die slechte dienstknecht in zijn hart zou zeggen: Mijn heer blijft nog lang weg, en zou beginnen zijn mededienstknechten te slaan, en te eten en te drinken met de dronkaards, dan zal de heer van die dienstknecht komen op een dag waarop hij hem niet verwacht, en op een uur dat hij niet weet;", "Ps 71:6": "Op U heb ik gesteund van de buik af aan; van de ingewanden van mijn moeder af aan zijt Gij mijn Uithelper; mijn lof is voortdurend van U.", "Ps 110:1-7": "Een psalm van David. De HEERE heeft tot mijn Heere gesproken: Zit aan Mijn rechterhand, totdat Ik Uw vijanden gezet zal hebben tot een voetbank van Uw voeten. De HEERE zal de scepter van Uw sterkte zenden uit Sion, en zeggen: Heers in het midden van Uw vijanden. Uw volk zal zeer gewillig zijn op de dag van Uw heirkracht, in heilig sieraad; uit de baarmoeder van het dageraad zal U de dauw van Uw jeugd zijn.", "Ps 104:30": "Zendt U Uw Geest uit, dan worden zij geschapen, en U vernieuwt het gelaat van het aardrijk.", "Job 24:23": "Geeft God hem gerustheid, dan steunt hij daarop; toch zijn Zijn ogen op hun wegen.", "1 Sam 2:8": "Hij verheft de geringe uit het stof, en de nooddruftige verhoogt Hij uit de vuilnis, om hen te doen zitten bij de vorsten, dat Hij hen de stoel van de eer laat beërven; want de fundamenten van het aardrijk zijn van de HEERE, en Hij heeft de wereld daarop gezet.", "Jes 22:12": "En op die dag zal de Heere, de HEERE van de heerscharen, roepen tot geween, en tot rouwklacht, en tot kaalheid, en tot omgording met de zak.", "Jer 18:8": "Maar als datzelfde volk, over wie Ik dat gesproken heb, zich van zijn boosheid bekeert, dan zal Ik berouw hebben over het kwaad dat Ik dacht hen aan te doen.", "Ps 102:19-23": "Dat zal geschreven worden voor het volgende geslacht; en het volk, dat geschapen zal worden, zal de HEERE loven; Omdat Hij uit de hoogte van het heiligdom zal hebben neerwaarts gezien; dat de HEERE uit de hemel op de aarde geschouwd zal hebben; Om het zuchten van de gevangenen te horen, om los te maken de kinderen van de dood;", "Jer 34:3": "En u zult van zijn hand niet ontkomen, maar zeker gegrepen en in zijn hand gegeven worden; en uw ogen zullen de ogen van de koning van Babel zien, en zijn mond zal tot uw mond spreken, en u zult naar Babel komen.", "Job 31:4": "Ziet Hij niet mijn wegen, en telt Hij niet al mijn treden?", "Luk 2:10": "En de engel zei tegen hen: Wees niet bang, want zie, ik verkondig u grote blijdschap, die er voor heel het volk zijn zal;", "Jes 10:22": "Want ofschoon uw volk, o Israël, is als het zand van de zee, zo zal toch maar het overblijfsel daarvan terugkeren; de verdelging is vast besloten, overvloeiend met gerechtigheid.", "Ps 7:14": "En heeft dodelijke wapens voor hem gereedgemaakt; Hij zal Zijn pijlen tegen de felle vervolgers inzetten.", "Gal 4:9": "en nu u God kent, ja, veelmeer door God gekend bent, hoe keert u zich weer tot de zwakke en arme beginselen, die u weer van voren af aan wilt dienen?", "Lev 26:10": "En u zult het oude, dat verouderd is, eten; en het oude zult u wegdoen vanwege het nieuwe.", "Ps 132:16": "En haar priesters zal Ik met heil bekleden, en haar gunstgenoten zullen zeer juichen.", "Deut 1:31": "En in de woestijn, waar u gezien hebt dat de HEERE, uw God, u gedragen heeft, zoals een man zijn zoon draagt, op heel de weg die u gegaan bent, totdat u kwam bij deze plaats.", "Zef 3:13": "De overgeblevenen van Israël zullen geen onrecht doen, noch leugen spreken, en in hun mond zal geen bedrieglijke tong gevonden worden; maar zij zullen weiden en neerliggen, en niemand zal hen schrik aanjagen.", "Ps 25:9": "Jod. Hij zal de zachtmoedigen leiden in het recht, en Hij zal de zachtmoedigen Zijn weg leren.", "Ps 18:32": "Want wie is God, behalve de HEERE? En wie is een Rotssteen, dan alleen onze God?", "Job 27:4": "Indien mijn lippen onrecht zullen spreken, en indien mijn tong bedrog zal uitspreken!", "Gen 12:2": "En Ik zal u tot een groot volk maken, en u zegenen, en uw naam groot maken; en wees een zegen!", "Jes 1:18": "Kom dan, en laten wij samen rechten, zegt de HEERE; al waren uw zonden als scharlaken, zij zullen wit worden als sneeuw, al waren zij rood als karmozijn, zij zullen worden als witte wol.", "Jes 42:22-25": "Maar nu is het een beroofd en geplunderd volk; zij zijn allen verstrikt in de holen, en verstopt in de gevangenissen; zij zijn tot een roof geworden, en er is niemand die ze redt; tot een plundering, en niemand zegt: Geef ze terug. Wie onder u neemt dit ter harte? Wie merkt op en hoort, wat hierna zijn zal? Wie heeft Jakob tot een plundering overgegeven, en Israël aan de rovers? Is het niet de HEERE, Hij, tegen Wie wij gezondigd hebben? Want zij wilden niet wandelen in Zijn wegen, en zij luisterden niet naar Zijn wet.", "Spr 8:23-25": "Ik ben van eeuwigheid af gezalfd geweest; van het begin, van de oudheden van de aarde aan. Ik was geboren, toen de afgronden nog niet waren, toen nog geen fonteinen waren, zwaar van water; Voordat de bergen ingevest waren, voor de heuvels was Ik geboren.", "2 Kron 7:17": "En wat u betreft, als u voor Mijn aangezicht wandelt, zoals uw vader David gewandeld heeft, en doet naar alles wat Ik u geboden heb, en Mijn inzettingen en Mijn rechten houdt;", "Jes 49:25": "Doch zo zegt de HEERE: Ja, de gevangenen van de machtige zullen hem ontnomen worden, en de vangst van de tiran zal ontkomen; want met hen die u bestrijden zal Ik strijden, en uw kinderen zal Ik verlossen.", "Jes 51:2": "Kijk naar Abraham, uw vader, en naar Sara, die u gebaard heeft; want Ik riep hem, toen hij nog alleen was, en Ik zegende hem, en Ik vermenigvuldigde hem.", "Zach 10:2": "Want de terafim² spreken onwaarheid, en de waarzeggers zien bedrog, en zij spreken loze dromen, zij troosten met leegte; daarom zijn zij weggetrokken als schapen, zij zijn onderdrukt geworden, want er was geen herder.", "Ps 102:28": "Maar U bent Dezelfde, en Uw jaren zullen niet geëindigd worden.", "Tit 2:11": "Want de genade van God die zaligmakend is, is verschenen aan alle mensen.", "Jes 2:2-5": "En het zal gebeuren in de laatste dagen, dat de berg van het huis van de HEERE vastgesteld zal zijn op de top van de bergen, en dat hij verheven zal worden boven de heuvels, en tot hem zullen alle heidenvolken toevloeien. En veel volken zullen heengaan en zeggen: Kom, laat ons opgaan tot de berg van de HEERE, tot het huis van de God van Jakob, opdat Hij ons leert van Zijn wegen, en dat wij wandelen in Zijn paden; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem. En Hij zal rechtspreken onder de heidenvolken, en bestraffen veel volken; en zij zullen hun zwaarden slaan tot spaden, en hun speren tot snoeimessen; het ene volk zal tegen het andere volk geen zwaard opheffen, en zij zullen geen oorlog meer leren.", "Ps 137:8": "O dochter van Babel! die verwoest zal worden, gelukkig zal hij zijn, die u uw misdaad vergelden zal, die u aan ons misdaan hebt.", "Ps 127:1": "Een lied Hammaaloth¹, van Salomo. Als de HEERE het huis niet bouwt, werken de bouwers eraan tevergeefs; als de HEERE de stad niet bewaart, waakt de wachter tevergeefs.", "Jes 31:5": "Zoals vliegende vogels, zo zal de HEERE van de heerscharen Jeruzalem beschutten, beschuttend zal Hij haar ook verlossen, voorbijgaand zal Hij haar ook uithelpen.", "Jer 17:12": "Een troon van heerlijkheid, een hoogheid van het eerste af aan, is de plaats van ons heiligdom.", "Gen 3:15": "En Ik zal vijandschap zetten tussen u en de vrouw, en tussen uw nageslacht en haar Nageslacht; Dat zal u de kop vermorzelen, en u zult Het de hiel vermorzelen.", "Jes 49:9": "Om te zeggen tegen de gebondenen: Gaat uit; tegen hen die in duisternis zijn: Komt te voorschijn; zij zullen op de wegen weiden, en op alle hoge plaatsen zal hun weide zijn.", "Jer 27:5": "Ik heb de aarde gemaakt, de mens en het vee die op de aardbodem zijn, door Mijn grote kracht en door Mijn uitgestrekte arm, en Ik geef ze aan wie het goed is in Mijn ogen.", "Rom 2:4": "Of veracht u de rijkdom van Zijn goedertierenheid, en verdraagzaamheid, en geduld, zonder te weten dat de goedertierenheid van God u tot bekering leidt?", "Ezech 33:9": "Maar als u de goddeloze van zijn weg afmaant, dat hij zich ervan bekeert, en hij zich van zijn weg niet bekeert, dan zal hij in zijn ongerechtigheid sterven; maar u hebt uw leven bevrijd.", "Jes 48:1": "Hoor dit, huis van Jakob, die genoemd wordt met de naam van Israël, en uit de wateren van Juda voortgekomen bent! Die daar zweert bij de Naam van de HEERE, en de God van Israël vermeldt, maar niet in waarheid, en ook niet in gerechtigheid.", "Hos 8:6": "Want ook dat komt uit Israël; een vakman heeft het gemaakt, en het is geen God, maar het zal in stukken worden gebroken, het kalf van Samaria.", "Hand 14:17": "hoewel Hij Zichzelf toch niet zonder getuigenis gelaten heeft, doordat Hij goeddeed, ons vanuit de hemel regen en vruchtbare tijden gaf, en onze harten vervulde met voedsel en vreugde.", "Matt 16:18": "En Ik zeg u ook, dat u Petrus bent, en op deze petra zal Ik Mijn gemeente bouwen, en de poorten van de hel zullen haar niet overweldigen.", "Hand 4:27": "Want in waarheid zijn tegen Uw heilig Kind Jezus, Die U gezalfd hebt, bijeengekomen, zowel Herodes en Pontius Pilatus, met de heidenen en de volken van Israël;", "2 Tess 2:14": "waartoe Hij u geroepen heeft door ons Evangelie, tot verkrijging van de heerlijkheid van onze Heere Jezus Christus.", "2 Tess 3:3": "Maar de Heere is getrouw, Die u zal versterken en bewaren van de boze.", "Hebr 2:10": "Want het paste Hem, om Wie alle dingen zijn, en door Wie alle dingen zijn, dat Hij, veel kinderen naar de heerlijkheid leidend, de leidsman van hun zaligheid door lijden zou volmaken.", "Spr 26:11": "Zoals een hond terugkeert naar zijn uitspuwsel, zo herneemt de dwaas zijn dwaasheid.", "Rom 9:30-33": "Wat zullen wij dan zeggen? Dat de heidenen, die de rechtvaardigheid niet zochten, de rechtvaardigheid verkregen hebben, en wel de rechtvaardigheid die uit het geloof is. Maar Israël, dat de wet van de rechtvaardigheid zocht, is tot de wet van de rechtvaardigheid niet gekomen. Waarom? Omdat zij die niet uit het geloof zochten, maar als het ware uit de werken van de wet; want zij hebben zich gestoten aan de steen des aanstoots;", "2 Kor 5:20": "Zo zijn wij dan gezanten namens Christus, alsof God door ons bad; wij bidden namens Christus: laat u met God verzoenen.", "Hand 16:31": "En zij zeiden: Geloof in de Heere Jezus Christus, en u zult zalig worden, u en uw huis.", "Jes 40:11": "Hij zal Zijn kudde weiden gelijk een herder; Hij zal de lammeren in Zijn armen bijeenbrengen, en in Zijn schoot dragen; de zogende dieren zal Hij zachtjes leiden.", "Jer 31:10": "Hoort het woord van de HEERE, heidenvolken! En verkondigt het in de eilanden die ver weg zijn, en zegt: Hij, Die Israël verstrooid heeft, zal hem weer verzamelen, en hem bewaren zoals een herder zijn kudde.", "Jes 35:4": "Zegt tegen de onbedachtzamen van hart: Wees sterk, en vrees niet; zie, uw God zal ter wrake komen met de vergelding van God. Hij zal komen en u verlossen.", "Jona 4:6": "En God, de HEERE, liet een wonderboom groeien en die opschieten boven Jona, zodat er schaduw zou zijn over zijn hoofd, om hem te bevrijden van zijn ellende. En Jona verheugde zich over de wonderboom met grote blijdschap.", "Job 4:7": "Bedenk toch, wie is de onschuldige die is omgekomen; en waar zijn de oprechten verdelgd?", "Job 32:4-9": "Doch Elihu had gewacht op Job in het spreken, omdat zij ouder van dagen waren dan hij. Toen Elihu dan zag dat er geen antwoord was in de mond van die drie mannen, ontstak zijn toorn. Hierom antwoordde Elihu, de zoon van Baracheël, de Buziet, en zei: Ik ben jong van dagen, maar u bent stokoude; daarom heb ik geschroomd en gevreesd, u mijn mening te tonen.", "Jes 11:1-10": "Want er zal een Rijsje voortkomen uit de afgehouwen tronk van Isaï, en een Scheut uit zijn wortels zal vrucht voortbrengen. En op Hem zal de Geest van de HEERE rusten, de Geest van wijsheid en van verstand, de Geest van raad en van sterkte, de Geest van kennis en van vreze van de HEERE. En Zijn vreugde zal zijn in de vreze van de HEERE; en Hij zal niet oordelen naar wat Zijn ogen zien, en niet bestraffen naar wat Zijn oren horen.", "Spr 19:16": "Die het gebod bewaart, bewaart zijn ziel; die zijn wegen veracht, zal sterven.", "Jes 35:9": "Er zal geen leeuw zijn, en geen verscheurend gedierte zal daarop komen, en het zal daar niet gevonden worden; maar de verlosten zullen daarop wandelen.", "Ps 7:10": "Laat toch de slechtheid van de goddelozen een einde nemen, maar bevestig de rechtvaardige, U, Die harten en nieren doorziet, o rechtvaardige God!", "Openb 21:9-27": "En er kwam naar mij een van de zeven engelen, die de zeven schalen hadden, die vol geweest waren van de zeven laatste plagen, en hij sprak met mij en zei: Kom hier, ik zal u de Bruid tonen, de Vrouw van het Lam. En hij voerde mij weg in de geest op een grote en hoge berg, en hij toonde mij de grote stad, het heilige Jeruzalem, neerdalend uit de hemel van God. En zij had de heerlijkheid van God, en haar licht was gelijk aan de allerkostbaarste steen, namelijk als de steen Jaspis, blinkend als kristal.", "Ps 90:14": "Verzadig ons in de morgenstond met Uw goedertierenheid, zo zullen wij juichen, en verblijd zijn in al onze dagen.", "Ps 18:18": "Hij verloste mij van mijn sterke vijand, en van mijn haters, omdat zij machtiger waren dan ik.", "Spr 10:3": "De HEERE laat de ziel van de rechtvaardige niet hongeren; maar de have van de goddelozen stoot Hij weg.", "Jer 31:28": "En het zal gebeuren, zoals Ik over hen gewaakt heb om uit te rukken, en af te breken, en te verstoren, en te verderven, en kwaad aan te doen; zo zal Ik over hen waken om te bouwen en te planten, spreekt de HEERE.", "2 Sam 7:8": "Nu dan, zo zult u tegen Mijn knecht, tegen David, zeggen: Zo zegt de HEERE van de heerscharen: Ik heb u genomen van de schaapskooi, van achter de schapen, om een voorganger te zijn over Mijn volk, over Israël.", "Jes 45:6": "Opdat men weet, vanaf de opgang van de zon tot aan de ondergang, dat er buiten Mij niets is, Ik ben de HEERE, en niemand meer.", "Ps 94:9-11": "Zou Hij, Die het oor plant, niet horen? Zou Hij, Die het oog vormt, niet zien? Zou Hij, Die de heidenen tuchtigt, niet straffen, Hij, Die de mens wetenschap leert? De HEERE kent de gedachten van de mens, dat zij vluchtig zijn.", "Deut 32:37": "Dan zal Hij zeggen: Waar zijn hun goden, de rotssteen, op wie zij vertrouwden?", "Ps 68:22": "Zeker zal God de kop van Zijn vijanden verslaan, de harige schedel van hem die in zijn schulden wandelt.", "Job 26:6": "Het dodenrijk is naakt voor Hem, en geen bedekking is er voor het verderf.", "Spr 14:11": "Het huis van de goddelozen zal weggevaagd worden; maar de tent van de oprechten zal bloeien.", "Jer 33:9": "En het zal Mij zijn tot een vreugdevolle naam, tot een roem, en tot een sieraad bij alle heidenvolken van de aarde; die al het goede zullen horen dat Ik hun doe; en zij zullen vrezen en beven over al het goede, en over alle vrede die Ik hun geef.", "Ps 22:11": "Op U ben ik geworpen vanaf de baarmoeder; vanaf de buik van mijn moeder aan bent U mijn God.", "Rom 8:30": "En die Hij van tevoren bestemd heeft, die heeft Hij ook geroepen; en die Hij geroepen heeft, die heeft Hij ook gerechtvaardigd; en die Hij gerechtvaardigd heeft, die heeft Hij ook verheerlijkt.", "Ps 121:3": "Hij zal uw voet niet laten wankelen; uw Bewaarder zal niet sluimeren.", "Jes 47:4": "Onze Verlossers Naam is HEERE van de heerscharen, de Heilige van Israël.", "Jes 45:21": "Verkondig het en treed hier toe, ja, beraadslaag samen: wie heeft dat van oudsher laten horen? Wie heeft dat van toen af verkondigd? Ben Ik het niet, de HEERE? En er is geen God meer behalve Mij, een rechtvaardig God, en een Heiland, niemand is er dan Ik.", "Openb 3:18": "Ik raad u aan dat u van Mij goud koopt, gelouterd door het vuur, opdat u rijk mag worden; en witte kleren, opdat u bekleed mag worden, en de schande van uw naaktheid niet openbaar wordt; en zalf uw ogen met ogenzalf, opdat u zien kunt.", "Ps 103:2-5": "Loof de HEERE, mijn ziel, en vergeet geen van Zijn weldaden; Die al uw ongerechtigheid vergeeft, die al uw ziekten geneest; Die uw leven verlost van het verderf, die u kroont met goedertierenheid en barmhartigheden;", "Jes 30:26": "En het licht van de maan zal zijn als het licht van de zon, en het licht van de zon zal zevenvoudig zijn als het licht van zeven dagen; op de dag dat de HEERE de breuk van Zijn volk zal verbinden, en de wond waarmee het geslagen is, genezen.", "Luk 18:8": "Ik zeg u dat Hij hun snel recht zal doen. Maar de Zoon des mensen, zal Hij, als Hij komt, geloof vinden op de aarde?", "2 Kron 20:3-30": "Josafat nu werd bevreesd, en richtte zich erop om de HEERE te zoeken; en hij riep een vasten uit in heel Juda. En Juda kwam bijeen om hulp te zoeken bij de HEERE; ook kwamen zij uit alle steden van Juda om de HEERE te zoeken. En Josafat stond in de samenkomst van Juda en Jeruzalem, in het huis van de HEERE, voor het nieuwe voorhof.", "Ps 81:14-17": "Och, dat Mijn volk naar Mij geluisterd had, dat Israël in Mijn wegen had gewandeld! In korte tijd zou Ik hun vijanden onderworpen hebben, en Mijn hand gewend hebben tegen hun tegenstanders. Zij die de HEERE haten, zouden zich Hem geveinsd onderworpen hebben, maar hun tijd zou eeuwig geweest zijn.", "Hos 5:15": "Ik zal heengaan en terugkeren naar Mijn plaats, totdat zij zichzelf schuldig weten en Mijn aangezicht zoeken; als het hun bang te moede is, zullen zij Mij vroeg zoeken.", "Hab 3:6": "Hij stond, en mat het land, Hij zag toe, en maakte de heidenvolken los, en de aloude bergen zijn verstrooid geworden; de heuvels van eeuwigheid hebben zich gebogen; de gangen van eeuwigheid zijn van Hem.", "Zach 9:16": "En de HEERE, hun God, zal hen op die dag behouden, als de kudde van Zijn volk; want gekroonde stenen zullen in Zijn land, als een banier, opgericht worden.", "1 Sam 2:6": "De HEERE doodt en maakt levend; Hij doet naar het graf neerdalen, en Hij doet weer opkomen.", "Job 11:17": "Ja, uw levenstijd zal helderder dan de middag oprijzen; u zult stralen, als de morgenstond zult u zijn.", "Hebr 2:3": "hoe zullen wij dan ontvluchten, als wij zo'n grote zaligheid veronachtzamen? Deze is eerst door de Heere Zelf verkondigd, en aan ons bevestigd door hen die Hem gehoord hebben;", "Ps 148:13": "Laat hen de Naam van de HEERE loven; want Zijn Naam alleen is hoog verheven; Zijn majesteit is over de aarde en de hemel.", "Jes 48:6": "U hebt het gehoord, aanmerkt dat alles; zult u het ook niet verkondigen? Van nu af doe Ik u nieuwe dingen horen, en verborgen dingen, en die u niet geweten hebt.", "Rom 7:26": "Zo dan, ik zelf dien wel met het gemoed de wet van God, maar met het vlees de wet van de zonde.", "Jes 57:11": "Maar voor wie bent u bang geweest of hebt u gevreesd? Want u hebt gelogen, en aan Mij hebt u niet gedacht, u hebt Mij niet op uw hart gelegd; is het niet omdat Ik zwijg, en dat al lang, dat u Mij niet vreest?", "Ps 36:8": "Hoe dierbaar is Uw goedertierenheid, o God! Daarom nemen de mensenkinderen onder de schaduw van Uw vleugels toevlucht.", "Jer 4:14": "Was uw hart van slechtheid, o Jeruzalem! opdat u behouden wordt; hoe lang zult u de gedachten van uw ijdelheid in uw binnenste laten overnachten?", "Jes 1:19": "Als u willig bent en luistert, zult u het goede van dit land eten;", "Jes 56:6-8": "En de vreemdelingen, die zich bij de HEERE voegen om Hem te dienen, en om de Naam van de HEERE lief te hebben, om Hem tot knechten te zijn; ieder die de sabbat houdt, zodat hij die niet ontheiligt, en die aan Mijn verbond vasthouden; Die zal Ik ook brengen naar Mijn heilige berg, en Ik zal hen verheugen in Mijn huis van gebed; hun brandoffers en hun slachtoffers zullen aangenaam zijn op Mijn altaar; want Mijn huis zal een huis van gebed genoemd worden voor alle volken. De Heere HEERE, Die de verdrevenen van Israël bijeenbrengt, spreekt: Ik zal er bij hem nog meer bijeenbrengen, naast hen die al bij hem bijeengebracht zijn.", "Ps 41:2-4": "Gelukkig is hij, die zich verstandig gedraagt tegenover een ellendige; de HEERE zal hem bevrijden ten dage des kwaads. De HEERE zal hem bewaren, en zal hem bij het leven behouden; hij zal op aarde gelukkig gemaakt worden. Geef hem ook niet over in de begeerte van zijn vijanden. De HEERE zal hem ondersteunen op het ziekbed; in zijn ziekte verandert U zijn hele leger.", "Jes 40:14": "Met wie heeft Hij raad gehouden, die Hem verstand zou geven, en Hem zou leren van het pad van het recht, en Hem wetenschap zou leren, en Hem bekend zou maken de weg van het veelvoudige verstand?", "Matt 3:7": "Toen hij dan velen van de Farizeeën en Sadduceeën naar zijn doop zag komen, zei hij tegen hen: Adderengebroed! Wie heeft u laten weten dat u moet vluchten voor de komende toorn?", "Ex 13:21": "En de HEERE ging voor hun aangezicht uit, overdag in een wolkkolom om hen de weg te leiden, en 's nachts in een vuurkolom om hen licht te geven, zodat zij dag en nacht konden voortgaan.", "Ps 97:10": "U die de HEERE liefhebt: haat het kwade; Hij bewaart de zielen van Zijn gunstgenoten; Hij redt hen uit de hand van de goddelozen.", "Ps 89:14": "Gij hebt een arm met macht; Uw hand is sterk, Uw rechterhand is hoog.", "Jer 3:17": "In die tijd zullen zij Jeruzalem noemen: de troon van de HEERE; en alle heidenvolken zullen daar samenkomen, vanwege de Naam van de HEERE, in Jeruzalem; en zij zullen niet meer wandelen naar het goeddunken van hun slechte hart.", "Spr 3:2": "Want lengte van dagen, en jaren van leven, en vrede zullen zij u vermeerderen.", "Ps 111:4": "Zain. Hij heeft Zijn wonderen tot een gedachtenis gemaakt; Cheth. de HEERE is genadig en barmhartig.", "Rom 7:24": "Ik, ellendig mens, wie zal mij verlossen uit het lichaam van deze dood?", "Ps 65:7": "Die de bergen vastzet door Zijn kracht, omgord met macht.", "2 Kron 6:41": "En nu, HEERE God, maak U op tot Uw rust, U en de ark van Uw kracht; laat Uw priesters, HEERE God, met heil bekleed worden, en laat Uw gunstgenoten¹ over het goede blijde zijn.", "Hos 14:3": "Neem deze woorden met u, en bekeer u tot de Heere; zeg tegen Hem: Neem weg alle ongerechtigheid, en geef het goede, zo zullen wij betalen de stieren van onze lippen.", "Job 22:13": "Daarom zegt u: Wat weet God ervan? Zal Hij door de donkere wolk oordelen?", "Jer 32:33": "Die Mij de nek toegekeerd hebben en niet het aangezicht; hoewel Ik hen leerde, vroeg opstaand en lerend, evenwel luisterden zij niet, om tucht aan te nemen;", "Jer 6:17": "Ik heb ook wachters over u gesteld, en gezegd: Luistert naar het geluid van de bazuin; maar zij zeggen: Wij zullen niet luisteren.", "Jes 63:9": "In al hun benauwdheid was Hij benauwd, en de Engel van Zijn aangezicht heeft hen behouden; door Zijn liefde en door Zijn genade heeft Hij hen verlost; en Hij nam hen op, en Hij droeg hen al de dagen van ouds.", "2 Sam 7:22": "Daarom bent U groot, HEERE God! Want er is niemand gelijk U, en er is geen God dan alleen U, naar alles wat wij met onze oren gehoord hebben.", "Jes 40:19": "De werkmeester giet een beeld, en de goudsmid overtrekt het met goud, en giet er zilveren ketenen bij.", "Ps 104:7": "Van Uw dreigen vluchtten zij, zij haastten zich weg voor de stem van uw donder.", "Job 38:11": "En zei: Tot hiertoe zult u komen, en niet verder, en hier zal hij zich stellen tegen de hoogmoed van uw golven.", "Jes 33:13": "Hoort, u die ver weg bent, wat Ik gedaan heb; en u, die nabij bent, erken Mijn macht!", "Ps 10:18": "Om de wees en verdrukte recht te doen, opdat een mens van de aarde niet meer voortvaart geweld te bedrijven.", "Spr 19:23": "De vreze van de HEERE is ten leven; want men zal verzadigd zijnde overnachten; met het kwaad zal men niet bezocht worden.", "Jes 48:20": "Ga uit van Babel, vlucht van de Chaldeeën, verkondig met de stem van het gejuich, doe zulks horen, breng het uit tot aan het einde van de aarde, zeg: De HEERE heeft Zijn knecht Jakob verlost!", "Job 9:19": "Als het op kracht aankomt, zie, Hij is sterk; en als het op recht aankomt, wie zal mij dagvaarden?", "Jak 1:17": "Elke goede gave en elk volmaakt geschenk is van boven, afkomstig van de Vader der lichten, bij Wie geen verandering is, of schaduw van omkering.", "Ps 73:23": "Ik zal dan voortdurend bij U zijn; U hebt mijn rechterhand gevat;", "Mal 2:2": "Als u niet zult horen, en als u het niet ter harte zult nemen om Mijn Naam eer te geven, zegt de HEERE van de heerscharen, dan zal Ik de vloek onder u zenden, en Ik zal uw zegeningen vervloeken; ja, Ik heb ook al elk daarvan vervloekt, omdat u het niet ter harte neemt.", "Spr 28:13": "Wie zijn overtredingen bedekt, zal geen voorspoed hebben; maar wie ze belijdt en laat, zal barmhartigheid ontvangen.", "Tit 3:3-7": "Want ook wij waren vroeger onverstandig, ongehoorzaam, dwalend, en dienden aan allerlei begeerten en genoegens; wij leefden in slechtheid en afgunst, waren hatelijk en haatten elkaar. Maar toen de goedertierenheid van God, onze Zaligmaker, en Zijn liefde tot de mensen verschenen is, Heeft Hij ons zalig gemaakt, niet uit de werken van de rechtvaardigheid die wij gedaan hadden, maar naar Zijn barmhartigheid, door het bad van de wedergeboorte en de vernieuwing door de Heilige Geest;", "Spr 14:19": "De kwaden buigen neer voor de goeden, en de goddelozen voor de poorten van de rechtvaardige.", "Ps 77:19": "Het geluid van uw donder was rondom; de bliksemen verlichtten de wereld; de aarde werd beroerd en daverde.", "Job 22:23": "Als u zich bekeert tot de Almachtige, zult u gebouwd worden; doe het onrecht ver van uw tenten.", "Jer 33:22": "Zoals het leger van de hemel niet geteld, en het zand van de zee niet gemeten kan worden, zo zal Ik het nageslacht van Mijn knecht David vermenigvuldigen, en de Levieten die Mij dienen.", "Deut 11:8": "Houd dan alle geboden, die ik u heden gebied; opdat u sterk wordt en het land binnengaat, en het erft, waarheen u overtrekt, om dat te erven;", "Ps 31:21": "U verbergt hen in het verborgene van Uw aangezicht voor de hoogmoedigheden van de man; U versteekt hen in een hut voor de twist van de tongen.", "Ex 20:3": "U zult geen andere goden voor Mijn aangezicht hebben.", "Jes 37:4": "Misschien zal de HEERE, uw God, de woorden horen van Rabsaké, aan wie zijn heer, de koning van Assyrië, gezonden heeft, om de levende God te honen en te schelden met woorden die de HEERE, uw God, gehoord heeft; hef dan een gebed op voor het overblijfsel dat nog gevonden wordt.", "Rom 5:15-21": "Toch is het niet zo dat de genadegift is zoals de misdaad; want als door de misdaad van één velen gestorven zijn, is de genade van God, en de gave door de genade die er is van één Mens Jezus Christus, des te meer overvloedig geweest over velen. En het is niet zo dat de gift is zoals de schuld die er was door die ene die gezondigd heeft; want de schuld is wel uit één misdaad tot verdoemenis, maar de genadegift is uit veel misdaden tot rechtvaardigmaking. Want als door de misdaad van één de dood geheerst heeft door die ene, zullen zij die de overvloed van de genade en van de gave van de rechtvaardigheid ontvangen, des te meer in het leven heersen door die Ene, namelijk Jezus Christus.", "Ezech 33:19": "En als de goddeloze zich bekeert van zijn goddeloosheid, en recht en gerechtigheid doet, zal hij daardoor leven.", "1 Tim 1:16": "Maar juist daarom is mij barmhartigheid overkomen, opdat Jezus Christus in mij, die de voornaamste ben, al Zijn geduld zou tonen, tot een voorbeeld voor hen die later in Hem geloven zullen tot het eeuwige leven.", "Gen 22:17": "Voorzeker zal Ik u rijk zegenen, en uw nageslacht zeer talrijk maken, als de sterren van de hemel, en als het zand dat aan de oever van de zee is; en uw nageslacht zal de poort van zijn vijanden erfelijk bezitten.", "Joh 3:14-17": "En zoals Mozes de slang in de woestijn verhoogd heeft, zo moet de Zoon des mensen verhoogd worden; Opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft. Want zo lief heeft God de wereld gehad, dat Hij Zijn eniggeboren Zoon gegeven heeft, opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft.", "Ex 12:23": "Want de HEERE zal doorgaan, om de Egyptenaren te slaan; doch wanneer Hij het bloed zien zal aan de bovendorpel en aan de twee zijposten, zal de HEERE de deur voorbijgaan, en de verderver niet toelaten in uw huizen te komen om te slaan.", "Openb 2:16": "Bekeer u; en zo niet, Ik zal u haastig bij komen, en zal tegen hen strijd voeren met het zwaard van Mijn mond.", "Gen 44:8": "Zie, het geld dat wij in de mond van onze zakken vonden, hebben wij uit het land Kanaän naar u teruggebracht; hoe zouden wij dan uit het huis van uw heer zilver of goud stelen?", "Hebr 12:17": "Want u weet dat hij ook daarna, toen hij de zegening wilde erven, verworpen werd; want hij vond geen gelegenheid tot berouw, hoewel hij het met tranen zocht.", "Ps 29:3-9": "De stem van de HEERE is op de wateren, de God van de ere dondert; de HEERE is op de grote wateren. De stem van de HEERE is met kracht, de stem van de HEERE is met heerlijkheid. De stem van de HEERE breekt de ceders; ja, de HEERE verbreekt de ceders van Libanon.", "Jes 48:5": "Daarom heb Ik het u van toen af verkondigd, voordat het kwam, heb Ik het u doen horen; opdat u niet misschien zou zeggen: Mijn afgod heeft die dingen gedaan, of mijn gesneden beeld, of mijn gegoten beeld heeft ze bevolen.", "Luk 13:29": "En er zullen mensen komen van oost en west, en van noord en zuid, en zullen aanzitten in het Koninkrijk van God.", "Ex 23:20-31": "Zie, Ik zend een Engel voor uw aangezicht, om u te behoeden op deze weg, en om u te brengen naar de plaats die Ik voorbereid heb. Wees op uw hoede voor Zijn aangezicht, en wees Zijn stem gehoorzaam, en verbitter Hem niet; want Hij zal uw overtredingen niet vergeven; want Mijn Naam is in Hem. Maar als u Zijn stem echt gehoorzaamt, en doet al wat Ik zeggen zal, dan zal Ik de vijand van uw vijanden zijn, en de tegenstander van wie u tegenstaat.", "Ex 19:4": "U hebt gezien wat Ik de Egyptenaren gedaan heb; hoe Ik u op vleugels van arenden gedragen heb, en u tot Mij gebracht heb.", "2 Tim 1:10": "Doch nu geopenbaard is door de verschijning van onze Zaligmaker Jezus Christus, Die de dood tenietgedaan heeft, en het leven en de onvergankelijkheid aan het licht gebracht heeft door het Evangelie;", "Job 14:20": "U overweldigt hem voor altijd, en hij gaat heen; U verandert zijn gelaat, en zendt hem weg.", "Jes 19:25": "Want de HEERE van de heerscharen zal hen zegenen en zeggen: Gezegend zij Mijn volk, de Egyptenaars, en de Assyriërs, het werk van Mijn handen, en Israël, Mijn erfdeel!", "1 Tim 1:13": "Ik was voorheen een godslasteraar, en een vervolger, en een geweldenaar; maar mij is barmhartigheid overkomen, omdat ik het onwetend gedaan heb in mijn ongeloof.", "Jer 51:20-29": "U bent Mij een voorhamer, en oorlogswapens; en door u zal Ik volken in stukken slaan, en door u zal Ik koninkrijken verderven. En door u zal Ik in stukken slaan het paard en zijn ruiter; en door u zal Ik in stukken slaan de wagen en zijn ruiter. En door u zal Ik in stukken slaan de man en de vrouw; en door u zal Ik in stukken slaan de oude en de jonge; en door u zal Ik in stukken slaan de jongeling en de jonkvrouw.", "Luk 15:1-10": "En alle tollenaars en zondaars kwamen naar Hem toe, om Hem te horen. En de Farizeeën en de Schriftgeleerden mopperden en zeiden: Deze man ontvangt de zondaars, en eet met hen. En Hij sprak deze gelijkenis tegen hen, en zei:", "Jes 49:17": "Uw zonen zullen zich haasten; maar uw verstoorders en uw verwoesters zullen van u uitgaan.", "Ef 3:20": "Hem nu, Die machtig is oneindig veel meer te doen dan wij bidden of denken, naar de kracht die in ons werkt,", "Jes 4:2-6": "Op die dag zal de SPRUIT van de HEERE tot sieraad en heerlijkheid zijn, en de vrucht van de aarde tot voortreffelijkheid en tot versiering voor hen die ontkomen zullen in Israël. En het zal gebeuren, dat wie overgebleven is in Sion, en wie overgelaten is in Jeruzalem, heilig genoemd zal worden, ieder die opgeschreven is ten leven in Jeruzalem; wanneer de Heere de drek van de dochters van Sion zal hebben afgewassen, en de bloedschuld van Jeruzalem uit haar midden zal hebben verdreven, door de Geest van het oordeel en door de Geest van de uitbranding.", "Matt 28:19": "Ga dan heen, onderwijs alle volken, en doop hen in de Naam van de Vader, en van de Zoon, en van de Heilige Geest;", "Jes 43:16": "Zo zegt de HEERE, Die in de zee een weg, en in de sterke wateren een pad maakte;", "Luk 21:18": "Toch zal er geen haar van uw hoofd verloren gaan.", "Ps 68:7": "Een God, Die de eenzamen zet in een gezin, uitleidt wie in boeien gevangen zitten; maar de afvalligen wonen in het dorre land.", "Hos 4:17": "Efraïm is met de afgoden verbonden; laat hem begaan.", "Ezech 39:4": "Op de bergen van Israël zult u vallen, u en al uw benden, en de volken die met u zijn; Ik heb u aan de roofvogels, aan het gevogelte van elke vleugel, en aan de dieren van het veld tot voedsel gegeven.", "Jes 23:17": "Want het zal gebeuren aan het einde van zeventig jaren, dat de HEERE Tyrus zal bezoeken, en dat zij zal terugkeren tot haar hoerenloon, en zij zal hoererij bedrijven met alle koninkrijken van de aarde, die op de aardbodem zijn.", "Ps 2:5": "Dan zal Hij tot hen spreken in Zijn toorn, en in Zijn grimmigheid zal Hij hen verschrikken.", "Zach 9:8": "En Ik zal Mij rondom Mijn huis legeren, vanwege het leger, vanwege de doorgaande, en vanwege de wederkerende, opdat de drijver niet meer door hen doorga; want nu heb Ik het met Mijn ogen aangezien.", "Job 5:18-24": "Want Hij doet smart aan, en Hij verbindt; Hij doorwondt, en Zijn handen helen. In zes benauwdheden zal Hij u verlossen, en in de zevende zal het kwaad u niet aanraken. In de honger zal Hij u verlossen van de dood, en in de oorlog van het geweld van het zwaard.", "Spr 15:10": "De tucht is onaangenaam voor hem die het pad verlaat; en wie de bestraffing haat, zal sterven.", "Ex 8:23": "En Ik zal een verlossing zetten tussen Mijn volk en uw volk; tegen morgen zal dit teken gebeuren!", "Ps 135:13": "O HEERE! Uw Naam is er in eeuwigheid; HEERE! Uw gedachtenis is van geslacht tot geslacht.", "Ex 15:10-12": "U hebt met Uw wind geblazen; de zee heeft hen gedekt, zij zonken onder als lood in geweldige wateren! O HEERE! Wie is als U onder de goden? Wie is als U, verheerlijkt in heiligheid, ontzagwekkend in lofzangen, die wonderen doet? U hebt Uw rechterhand uitgestrekt, de aarde heeft hen verslonden!", "1 Kor 2:7": "Maar wij spreken de wijsheid van God, die bestaat in een verborgenheid, die verborgen was, welke God van tevoren vastgesteld heeft tot heerlijkheid van ons, voordat de wereld er was;", "Ps 119:150": "Die kwade praktijken najagen, genaken mij, zij wijken ver van Uw wet.", "2 Kon 19:27": "Maar Ik weet uw zitten, en uw uitgaan, en uw binnenkomen, en uw woeden tegen Mij.", "1 Kor 10:19": "Wat zeg ik dan? Dat een afgod iets is, of dat een afgodenoffer iets is?", "Ps 9:10": "En de HEERE zal een Hoog Vertrek zijn voor de verdrukte, een Hoog Vertrek in tijden van benauwdheid.", "Ps 76:11": "Want de grimmigheid van de mens zal U loffelijk maken; het overblijfsel van de grimmigheden zult U opbinden.", "Jes 37:35": "Want Ik zal deze stad beschermen om die te verlossen, omwille van Mijzelf, en omwille van David, Mijn knecht.", "Ezech 18:28": "Omdat hij toeziet, en zich bekeert van al zijn overtredingen, die hij gedaan heeft, zal hij zeker leven, hij zal niet sterven.", "Ps 12:8": "U, HEERE, zult hen bewaren; U zult hen behoeden voor dit geslacht, tot in eeuwigheid.", "Jes 51:3-16": "Want de HEERE zal Sion troosten, Hij zal al haar woeste plaatsen troosten, en Hij zal haar woestijn maken als Eden, en haar wildernis als de hof van de HEERE; vreugde en blijdschap zal daarin gevonden worden, dankzegging en een stem van het gezang. Luister naar Mij, Mijn volk! En Mijn lieden, neig naar Mij het oor! Want een wet zal van Mij uitgaan, en Ik zal Mijn recht doen rusten tot een licht van de volken. Mijn gerechtigheid is nabij, Mijn heil trekt uit, en Mijn armen zullen de volken richten; op Mij zullen de eilanden wachten, en op Mijn arm zullen zij hopen.", "Jer 16:20": "Zal een mens zich goden maken? Zij zijn toch geen goden.", "Gen 47:9": "En Jakob zei tegen Farao: De jaren van mijn vreemdelingschap zijn honderddertig jaar; weinig en zwaar zijn de jaren van mijn leven geweest, en zij hebben niet gehaald bij de jaren van het leven van mijn vaderen, in de dagen van hun vreemdelingschap.", "Ps 50:23": "Wie dank offert, die zal Mij eren; en wie zijn weg goed inricht, die zal Ik Gods heil doen zien.", "1 Petr 3:12": "Want de ogen van de Heere zijn over de rechtvaardigen, en Zijn oren gericht op hun gebed; maar het aangezicht van de Heere is tegen hen die kwaad doen.", "Ezech 29:17-20": "Verder gebeurde het in het zevenentwintigste jaar, in de eerste maand, op de eerste dag van de maand, dat het woord van de HEERE tot mij kwam. Hij zei: Mensenkind! Nebukadrezar, de koning van Babel, heeft zijn leger een grote dienst laten verrichten tegen Tyrus; alle hoofden zijn kaal geworden, en alle zijden zijn opengeschuurd; en noch hij, noch zijn leger heeft loon gehad vanwege Tyrus, voor de dienst die hij tegen haar verricht heeft. Daarom, zo zegt de Heere HEERE: Zie, Ik zal Nebukadrezar, de koning van Babel, Egypteland geven; en hij zal haar menigte wegvoeren, en haar buit buitmaken, en haar roof roven, en het zal het loon zijn voor zijn leger.", "Mark 2:17": "En Jezus hoorde dat, en zei tegen hen: Wie gezond zijn, hebben de dokter niet nodig, maar wie ziek zijn. Ik ben niet gekomen om rechtvaardigen te roepen, maar zondaars tot bekering.", "Job 21:22": "Zal men God wetenschap leren, terwijl Hij hen die hoog zijn richt?", "Job 8:21": "totdat Hij uw mond met gelach vervult, en uw lippen met gejuich.", "Jer 5:21-24": "Hoor nu dit, dwaas en harteloos volk! die ogen hebben, maar niet zien, die oren hebben, maar niet horen. Zult u Mij niet vrezen? spreekt de HEERE; zult u voor Mijn aangezicht niet beven? Ik heb het zand tot een grens voor de zee gesteld, met een eeuwige verordening, zodat zij daar niet overheen zal gaan; al bewegen haar golven zich, toch zullen zij niets vermogen, al bruisen zij, toch zullen zij daar niet overheen gaan. Maar dit volk heeft een afvallig en opstandig hart; zij zijn afgevallen en weggegaan;", "Jes 26:4": "Vertrouw op de HEERE tot in eeuwigheid; want in de HEERE HEERE is een eeuwige rots.", "Openb 22:1-5": "En hij toonde mij een zuivere rivier van het water des levens, klaar als kristal, die uit de troon van God en van het Lam kwam. In het midden van haar straat en aan de ene en de andere zijde van de rivier was de boom des levens, die twaalf keer vrucht droeg, van maand tot maand zijn vrucht gevend; en de bladeren van de boom waren tot genezing van de heidenen. En geen vervloeking zal er meer tegen iemand zijn; en de troon van God en van het Lam zal daar zijn, en Zijn dienstknechten zullen Hem dienen;", "Deut 30:4": "Al waren uw verdrevenen aan het einde van de hemel, van daar zal de HEERE, uw God, u bijeenbrengen, en van daar zal Hij u halen.", "Ps 37:3": "Beth. Vertrouw op de HEERE, en doe het goede; bewoon de aarde, en voed u met trouw.", "Gen 28:20": "En Jakob deed een gelofte, en zei: Wanneer God met mij geweest zal zijn, en mij behoed zal hebben op deze weg die ik reis, en mij brood gegeven zal hebben om te eten, en kleren om aan te trekken;", "Jes 2:8": "Ook is hun land vervuld met afgoden; voor het werk van hun handen buigen zij zich neer, voor wat hun vingers gemaakt hebben.", "Matt 22:14": "Want velen zijn geroepen, maar weinigen uitverkoren.", "Job 42:17": "En Job stierf, oud en verzadigd van dagen.", "Spr 24:16": "Want de rechtvaardige zal zevenmaal vallen, en opstaan; maar de goddelozen zullen in het kwaad neerstruikelen.", "Hagg 2:8-10": "Ja, Ik zal alle heidenvolken doen beven, en zij zullen komen tot de Wens van alle heidenvolken, en Ik zal dit huis met heerlijkheid vervullen, zegt de HEERE van de heerscharen. Mijn is het zilver, en Mijn is het goud, spreekt de HEERE van de heerscharen. De heerlijkheid van dit laatste huis zal groter worden dan die van het eerste, zegt de HEERE van de heerscharen; en in deze plaats zal Ik vrede geven, spreekt de HEERE van de heerscharen.", "Ps 136:5": "Hem, Die de hemelen met verstand gemaakt heeft; want Zijn goedertierenheid is voor eeuwig.", "Matt 11:16-24": "Maar waarbij zal Ik dit geslacht vergelijken? Het is gelijk aan de kinderen, die op de markten zitten, en hun vrienden toeroepen, En zeggen: Wij hebben voor u op de fluit gespeeld, en u hebt niet gedanst; wij hebben u klaagliederen gezongen, en u hebt niet geweend. Want Johannes is gekomen, niet etend, niet drinkend, en zij zeggen: Hij heeft de duivel.", "Hagg 1:5": "Nu dan, zo zegt de HEERE van de heerscharen: Let goed op uw wegen.", "Jes 9:5": "Want een Kind is ons geboren, een Zoon is ons gegeven, en de heerschappij is op Zijn schouder; en men noemt Zijn naam Wonderlijk, Raad, Sterke God, Vader van de eeuwigheid, Vredevorst;", "Job 27:3": "Zo lang als mijn adem in mij zal zijn, en het geblaas van God in mijn neus;", "Ps 138:4": "Alle koningen van de aarde zullen U, o HEERE! loven, wanneer zij de redenen van Uw mond gehoord zullen hebben.", "Ps 72:16": "Is er een handvol koren in het land op de hoogte van de bergen, de vrucht daarvan zal ruisen als de Libanon; en die van de stad zullen bloeien als het kruid van de aarde.", "Jer 3:19": "Ik zei wel: Hoe zal Ik u onder de kinderen plaatsen, en u het begeerlijke land geven, de sierlijke erfenis van de heerscharen van de heidenvolken? Maar Ik zei: U zult tot Mij roepen: Mijn Vader! en u zult van achter Mij niet afkeren.", "Ps 37:23": "Mem. De gangen van deze man worden door de HEERE bevestigd; en Hij heeft vreugde in zijn weg.", "Jer 36:7": "Misschien zal hun smeking voor het aangezicht van de HEERE neervallen, en zullen zij zich bekeren, ieder van zijn boze weg; want groot is de toorn en de grimmigheid die de HEERE tegen dit volk heeft uitgesproken.", "Ps 115:3": "Onze God is toch in de hemel, Hij doet al wat Hem behaagt.", "Job 40:4": "Hebt u een arm gelijk God? En kunt u, gelijk Hij, met de stem donderen?", "Hand 16:30": "En hij bracht hen naar buiten en zei: Beste heren, wat moet ik doen om zalig te worden?", "Hand 17:23": "Want toen ik door de stad liep en uw heiligdommen bekeek, vond ik ook een altaar waarop een opschrift stond: AAN DE ONBEKENDE GOD. Hem dan, Die u niet kent en toch dient, verkondig ik u.", "Jes 50:3": "Ik bekleed de hemel met zwartheid, en maak een zak tot zijn bedekking.", "Ps 147:2": "De HEERE bouwt Jeruzalem; Hij verzamelt de verdrevenen van Israël.", "Ps 90:3": "U doet de mens wederkeren tot verbrijzeling, en zegt: Keer weder, mensenkinderen!", "Jes 48:8": "Ook hebt u ze niet gehoord, ook hebt u ze niet geweten, ook van toen af is uw oor niet geopend geweest; want Ik heb geweten, dat u volledig trouweloos zou handelen, en dat u van de buik af een overtreder genoemd bent.", "Jer 49:28-30": "Tegen Kedar, en tegen de koninkrijken van Hazor, die Nebukadrezar, de koning van Babel, sloeg, zegt de HEERE zo: Maak u op, trek op tegen Kedar, en verwoest de kinderen van het oosten. Zij zullen hun tenten en hun kudden nemen, hun gordijnen en al hun gereedschap, en hun kamelen voor zich wegnemen; en zij zullen tegen hen uitroepen: Schrik van rondom! Vlucht, zwerf vlug heen, woon in diepe plaatsen, inwoners van Hazor! spreekt de HEERE; want Nebukadrezar, de koning van Babel, heeft een raadsbesluit tegen u beraadslaagd, en een gedachte tegen hen gedacht.", "Gal 4:21-31": "Zegt u mij, u die onder de wet wilt zijn, hoort u de wet niet? Want er is geschreven dat Abraham twee zonen had, één uit de dienstmaagd, en één uit de vrije. Maar hij die uit de dienstmaagd was, is naar het vlees geboren; maar hij die uit de vrije was, door de belofte;", "Jes 28:23": "Neem het ter ore en hoor mijn stem, let op en hoor mijn rede!", "Jes 2:20": "Op die dag zal de mens zijn zilveren afgoden, en zijn gouden afgoden, die zij zich gemaakt hadden, om zich daarvoor neer te buigen, wegwerpen voor de mollen en de vleermuizen;", "Job 33:14-30": "Maar God spreekt eens of tweemaal; doch men let daar niet op. In de droom, door het gezicht 's nachts, als een diepe slaap op de mensen valt, in de sluimering op het leger; Dan openbaart Hij het voor het oor der mensen, en Hij verzegelt hun kastijding;", "Jer 5:22": "Zult u Mij niet vrezen? spreekt de HEERE; zult u voor Mijn aangezicht niet beven? Ik heb het zand tot een grens voor de zee gesteld, met een eeuwige verordening, zodat zij daar niet overheen zal gaan; al bewegen haar golven zich, toch zullen zij niets vermogen, al bruisen zij, toch zullen zij daar niet overheen gaan.", "Zach 9:12": "Keert u weer tot de sterkte, gebondenen, die daar hopen! Ook heden verkondig Ik, dat Ik u dubbel zal wedergeven;", "Jes 29:24": "En zij die dwalend van geest zijn, zullen tot verstand komen, en de mopperaars zullen de lering aannemen.", "Jer 7:5": "Maar als u uw wegen en uw handelingen werkelijk goed maakt, als u werkelijk recht doet tussen de man en zijn naaste;", "Jak 1:6": "Maar laat hij ze vragen in geloof, niet twijfelend; want wie twijfelt, is een golf van de zee gelijk, die door de wind gedreven en heen en weer geworpen wordt.", "Hos 2:6": "En zij zal haar minnaars nalopen, maar hen niet aantreffen; en zij zal hen zoeken, maar niet vinden; dan zal zij zeggen: Ik zal heengaan, en terugkeren naar mijn vorige Man, want toen ging het mij beter dan nu.", "Ex 8:22": "En Ik zal op die dag het land Gosen, waarin Mijn volk woont, afzonderen, zodat daar geen vermenging van ongedierte is, opdat u weet dat Ik, de HEERE, in het midden van dit land ben.", "Zach 3:7": "Zo zegt de HEERE van de heerscharen: Als u in Mijn wegen wandelt, en als u Mijn wacht waarneemt, dan zult u ook Mijn huis richten, en ook Mijn voorhoven bewaren; en Ik zal u wandelingen geven onder dezen, die hier staan.", "Jes 49:10": "Zij zullen niet hongeren, noch dorsten, en de hitte en de zon zal hen niet steken; want hun Ontfermer zal ze leiden, en Hij zal hen bij de springaders van het water zachtjes leiden.", "Jer 30:11": "Want Ik ben met u, spreekt de HEERE, om u te verlossen; want Ik zal een voleinding maken met al de heidenen, waarheen Ik u verstrooid heb; maar met u zal Ik geen voleinding maken; maar Ik zal u kastijden met mate, en u niet helemaal ongestraft laten.", "Deut 4:24-31": "Want de HEERE, uw God, is een verterend vuur, een na-ijverig God. Wanneer u nu kinderen en kleinkinderen verwekt hebt, en oud geworden bent in het land, en u zich te gronde richt door gesneden beelden te maken, de gelijkenis van iets, en door te doen wat kwaad is in de ogen van de HEERE, uw God, om Hem tot toorn te verwekken; Dan roep ik vandaag de hemel en de aarde tot getuige tegen u, dat u zeker snel zult omkomen uit het land waar u de Jordaan voor oversteekt om het in bezit te nemen; u zult uw dagen daarin niet verlengen, maar helemaal uitgeroeid worden.", "Jer 10:4": "Men pronkt het op met zilver en met goud; zij hechten het met spijkers en met hamers, opdat het niet waggelt.", "Luk 3:6": "En alle vlees zal de zaligheid van God zien.", "Rom 3:21-26": "Maar nu is de gerechtigheid van God geopenbaard, zonder de wet, met getuigenis van de wet en de profeten: namelijk de gerechtigheid van God door het geloof van Jezus Christus, tot allen, en over allen die geloven; want er is geen onderscheid. Want zij hebben allen gezondigd, en missen de heerlijkheid van God;", "Spr 30:4": "Wie is naar de hemel opgeklommen, en neergedaald? Wie heeft de wind in Zijn vuisten verzameld? Wie heeft de wateren in een kleed gebonden? Wie heeft alle einden van de aarde vastgesteld? Hoe is Zijn Naam, en hoe is de Naam van Zijn Zoon, als u het weet?", "Ezra 3:7": "Zo gaven zij geld aan de houwers en werkmeesters, ook eten en drinken, en olie aan de Sidoniërs en aan de Tyriërs, om cederhout van de Libanon te brengen naar de zee bij Jafo, naar de vergunning die Kores, koning van Perzië, hun gegeven had.", "Ps 21:4-6": "Want U komt hem voor met zegeningen van het goede; op zijn hoofd zet U een kroon van fijn goud. Het leven heeft hij van U begeerd. U hebt het hem gegeven; lengte van dagen, eeuwig en altoos. Groot is zijn eer door Uw heil; majesteit en heerlijkheid hebt U hem toegevoegd.", "Spr 1:20": "De opperste Wijsheid roept overluid daarbuiten; Zij verheft Haar stem op de straten.", "Ps 91:1-16": "Die in de schuilplaats van de Allerhoogste is gezeten, die zal vernachten in de schaduw van de Almachtige. Ik zal tegen de HEERE zeggen: Mijn Toevlucht en mijn Burg! Mijn God, op Wie ik vertrouw! Want Hij zal u redden van de strik van de vogelvanger, van de zeer verderfelijke pestilentie.", "2 Sam 7:20": "En wat zal David nog meer tot U spreken? Want U kent Uw knecht, Heere HEERE!", "Jes 48:12": "Hoor naar Mij, o Jakob! En u, Israël, Mijn geroepene! Ik ben Dezelfde; Ik ben de Eerste, ook ben Ik de Laatste.", "Ps 22:10": "U bent het immers, die mij uit de buik hebt uitgetogen; die mij hebt doen vertrouwen, aan de borsten van mijn moeder.", "Openb 16:21": "En een grote hagel, elke hagelsteen ongeveer een talent zwaar, viel neer uit de hemel op de mensen; en de mensen lasterden God vanwege de plaag van de hagel; want die plaag was zeer groot.", "2 Kon 19:15": "En Hizkia bad voor het aangezicht van de HEERE, en zei: HEERE, God van Israël, Die tussen de cherubs¹ woont! U zelf, U alleen bent de God van alle koninkrijken van de aarde, U hebt de hemel en de aarde gemaakt.", "Gal 2:14-21": "Maar toen ik zag dat zij niet oprecht wandelden naar de waarheid van het Evangelie, zei ik tegen Petrus, in aanwezigheid van allen: Als u, die een Jood bent, leeft naar heidense wijze en niet naar Joodse wijze, waarom dwingt u dan de heidenen naar de Joodse wijze te leven? Wij zijn van nature Joden, en geen zondaars uit de heidenen; maar omdat wij weten dat de mens niet gerechtvaardigd wordt uit de werken van de wet, maar door het geloof van Jezus Christus, hebben ook wij in Christus Jezus geloofd, opdat wij gerechtvaardigd zouden worden uit het geloof van Christus, en niet uit de werken van de wet; omdat uit de werken van de wet geen vlees zal worden gerechtvaardigd.", "Spr 11:31": "Zie, de rechtvaardige wordt vergolden op de aarde, hoeveel te meer de goddeloze en de zondaar!", "Jes 41:24": "Zie, u bent minder dan niets, en uw werk is erger dan een adder; hij is een gruwel, die u verkiest.", "Ezra 1:3": "Wie is er onder u van al Zijn volk? Zijn God zij met hem, en hij trekt op naar Jeruzalem, dat in Juda is, en hij bouwt het huis van de HEERE, de God van Israël; Hij is de God, Die te Jeruzalem woont.", "Mark 13:32": "Maar van die dag en dat uur weet niemand, ook de engelen in de hemel niet, en ook de Zoon niet, maar alleen de Vader.", "Deut 33:25-29": "IJzer en koper zal onder uw schoen zijn; en uw sterkte gelijk uw dagen! Niemand is er gelijk God, o Jeschurun! Die op de hemel vaart tot uw hulp, en met Zijn hoogheid op de bovenste wolken. De eeuwige God zij u een woning, en van onder eeuwige armen; en Hij verdrijft de vijand voor uw aangezicht, en zegt: Verdelg!", "1 Tim 6:16": "Die als enige onsterfelijkheid heeft, en een ontoegankelijk licht bewoont; aan Wie geen mens gezien heeft, en ook niet zien kan; aan Wie eer en eeuwige kracht zij. Amen.", "Jes 31:3": "Want de Egyptenaren zijn mensen, en geen God, en hun paarden zijn vlees, en geen geest; en de HEERE zal Zijn hand uitstrekken, zodat de helper struikelen zal, en die geholpen wordt, zal neervallen, en zij zullen allemaal samen te niet komen.", "Openb 2:5": "Bedenk dan waarvan u uitgevallen bent, en bekeer u, en doe de eerste werken; en zo niet, Ik zal u haastig bij komen, en zal uw kandelaar van zijn plaats wegnemen, als u zich niet bekeert.", "1 Kor 1:25": "Want het dwaze van God is wijzer dan de mensen; en het zwakke van God is sterker dan de mensen.", "Ps 50:17": "Omdat u de kastijding haat, en Mijn woorden achter u weggooit.", "Deut 23:14": "Want de HEERE, uw God, wandelt in het midden van uw leger, om u te verlossen, en om uw vijanden aan u over te geven; daarom zal uw leger heilig zijn, opdat Hij niets schandelijks onder u ziet, en Zich niet van u afkeert.", "Jes 4:6": "En daar zal een hut zijn tot een schaduw overdag tegen de hitte, en tot een toevlucht, en tot een schuilplaats tegen de vloed en tegen de regen.", "Hand 14:15": "Mannen, waarom doet u deze dingen? Ook wij zijn mensen net als u, en wij verkondigen u dat u zich van deze nutteloze dingen zou bekeren tot de levende God, Die de hemel, en de aarde, en de zee, en alles wat daarin is, gemaakt heeft;", "Ps 145:13": "Mem. Uw Koninkrijk is een Koninkrijk van alle eeuwen, en Uw heerschappij is in alle geslacht en geslacht.", "Jes 46:9-11": "Denk aan de vorige dingen van oude tijden af, dat Ik God ben, en er is geen God meer, en er is niets gelijk Ik; Die vanaf het begin aan verkondigt het einde, en van oudsher af die dingen, die nog niet gebeurd zijn; Die zegt: Mijn raad zal standhouden, en Ik zal al Mijn welbehagen doen. Die een roofvogel roept van het oosten, een man van Mijn raad uit een ver land; ja, Ik heb het gesproken, Ik zal het ook doen komen; Ik heb het geformeerd, Ik zal het ook doen.", "Jona 3:8": "Maar mens en dier zullen met zakken bedekt zijn, en zullen sterk tot God roepen; en zij zullen zich bekeren, ieder van zijn boze weg, en van het geweld dat in hun handen is.", "1 Sam 5:3": "Maar toen die van Asdod de volgende dag vroeg opstonden, zie, toen was Dagon voorover op de aarde gevallen voor de ark van de HEERE. En zij namen Dagon en zetten hem weer op zijn plaats.", "Matt 24:39": "en zij merkten het niet, totdat de zondvloed kwam en hen allen wegnam; zo zal ook de komst van de Zoon des mensen zijn.", "Spr 3:24": "Als u neerligt, zult u niet schrikken; maar u zult neerliggen en uw slaap zal zoet zijn.", "Jes 57:14": "En men zal zeggen: Verhoog de weg, verhoog de weg, bereid de weg, neem de struikelblokken weg uit de weg van Mijn volk.", "1 Kon 9:4": "En als u voor Mijn aangezicht wandelt, zoals uw vader David gewandeld heeft, met een volkomen hart, en met oprechtheid, om te doen naar alles wat Ik u geboden heb, en Mijn inzettingen en Mijn rechten houdt;", "Ps 3:9": "Het heil is van de HEERE; Uw zegen is over Uw volk. Sela.", "Openb 7:10": "En zij riepen met luide stem: De zaligheid is van onze God, Die op de troon zit, en van het Lam.", "Jer 5:24": "En zij zeggen niet in hun hart: Laten wij nu de HEERE, onze God, vrezen, Die de regen geeft, zowel de vroege regen als de late regen, op Zijn tijd; Die voor ons de weken, de vastgestelde tijden van de oogst, bewaart.", "Dan 9:13": "Zoals geschreven is in de wet van Mozes, zo is al dat kwaad over ons gekomen; en wij smeekten het aangezicht van de HEERE, onze God, niet, door ons af te keren van onze ongerechtigheden en verstandig acht te geven op Uw waarheid.", "Gen 49:22-26": "Jozef is een vruchtbare tak, een vruchtbare tak aan een fontein; elk van de takken loopt over de muur. De schutters hebben hem wel bitterheid aangedaan, en op hem geschoten, en hem gehaat; Maar zijn boog is in stevigheid gebleven, en de armen van zijn handen zijn gesterkt, door de handen van de Machtige van Jakob; vandaar is hij een herder, een steen van Israël;", "Spr 21:31": "Het paard wordt bereid tegen de dag van het strijd; maar de overwinning is van de HEERE.", "Ps 79:11": "Laat het gekerm van de gevangenen voor Uw aangezicht komen; behoud, naar de grootheid van Uw arm, hen die tot de dood bestemd zijn.", "Matt 6:4": "opdat uw aalmoes in het verborgene is; en uw Vader, Die in het verborgene ziet, Die zal het u in het openbaar vergelden.", "Ps 63:6": "Mijn ziel zou verzadigd worden als met vet en overvloed, en mijn mond zou roemen met vrolijk zingende lippen.", "Deut 30:19": "Ik neem heden tegen u de hemel en de aarde tot getuigen; het leven en de dood heb ik u voorgesteld, de zegen en de vloek! Kies dan het leven, opdat u leeft, u en uw nageslacht;", "Dan 4:10-26": "De visioenen van mijn hoofd op mijn bed waren deze: ik zag, en zie, er was een boom in het midden van de aarde, en zijn hoogte was groot. De boom werd groot en sterk; en zijn hoogte reikte aan de hemel, en hij werd gezien tot aan het einde van de hele aarde; Zijn loof was mooi, en zijn vruchten veel, en er was voedsel aan voor allen; onder hem vond het gedierte van het veld schaduw, en de vogels van de hemel woonden in zijn takken, en alle vlees werd daarvan gevoed.", "Gen 8:22": "Voortaan, al de dagen van de aarde, zullen zaaiing en oogst, en koude en hitte, en zomer en winter, en dag en nacht niet ophouden.", "Jes 32:9-11": "Staat op, u geruste vrouwen, hoor mijn stem; u dochters, die zo zeker bent, neem mijn woorden ter oor. Vele dagen over het jaar zult u beroerd zijn, u dochters, die zo zeker bent, want de wijnoogst zal voorbij zijn, er zal geen inzameling komen. Beeft, u geruste vrouwen; wees beroerd, dochters, die zo zeker bent; trek u uit, en ontbloot u, en gord zakken om uw middel.", "Rom 8:28": "En wij weten dat voor hen die God liefhebben, alle dingen meewerken ten goede, namelijk voor hen die naar Zijn voornemen geroepen zijn.", "Openb 3:3": "Bedenk dan hoe u het ontvangen en gehoord hebt, en bewaar het, en bekeer u. Als u dan niet waakt, zal Ik over u komen als een dief, en u zult niet weten op welk uur Ik over u komen zal.", "Ps 111:9": "Pe. Hij heeft Zijn volk verlossing gezonden; Tsade. Hij heeft Zijn verbond in eeuwigheid geboden; Koph. Zijn Naam is heilig en ontzagwekkend.", "Ps 34:23": "De HEERE verlost de ziel van Zijn knechten; en allen die op Hem vertrouwen, zullen niet schuldig verklaard worden.", "Matt 12:42": "De koningin van het zuiden zal opstaan in het oordeel met dit geslacht, en zal het veroordelen; want zij is gekomen van het einde van de aarde, om de wijsheid van Salomo te horen; en zie, meer dan Salomo is hier!", "Ezech 20:43": "Daar zult u dan denken aan uw wegen, en aan al uw handelingen waarmee u zich verontreinigd hebt, en u zult van uzelf een afkeer hebben over al uw slechte daden die u gedaan hebt.", "Matt 5:4": "Zalig zijn zij die treuren, want zij zullen vertroost worden.", "Ps 14:6": "U beschaamt de raad van de ellendige, omdat de HEERE zijn Toevlucht is.", "Jes 61:1": "De Geest van de Heere HEERE is op Mij, omdat de HEERE Mij gezalfd heeft, om een blijde boodschap te brengen aan de zachtmoedigen; Hij heeft Mij gezonden om te verbinden de gebrokenen van hart, om de gevangenen vrijheid uit te roepen, en de gebondenen opening van de gevangenis;", "Ps 102:25-28": "Ik zei: Mijn God! Neem mij niet weg in het midden van mijn dagen; Uw jaren zijn van geslacht tot geslacht. U hebt voormaals de aarde gegrond, en de hemelen zijn het werk van Uw handen; Die zullen vergaan, maar U zult staande blijven; en zij alle zullen als een kleed verouderen; U zult ze veranderen als een gewaad, en zij zullen veranderd zijn.", "Ex 14:3": "Farao dan zal zeggen van de kinderen van Israël: Zij zijn verward in het land; die woestijn heeft hen ingesloten.", "Amos 9:9": "Want zie, Ik geef bevel, en Ik zal het huis van Israël onder alle heidenvolken schudden, zoals graan geschud wordt in een zeef; en niet één steentje zal er op de aarde vallen.", "1 Joh 2:13": "Ik schrijf u, vaders! want u hebt Hem gekend, Die er vanaf het begin is. Ik schrijf u, jongemannen, want u hebt de boze overwonnen. Ik schrijf u, kinderen, want u hebt de Vader gekend.", "Deut 7:21": "Schrik niet terug voor hen; want de HEERE, uw God, is in uw midden, een groot en ontzagwekkend God.", "Job 10:12": "Naast het leven hebt U goedertierenheid aan mij bewezen, en Uw zorg heeft mijn geest bewaard.", "Job 38:8": "Of wie heeft de zee met deuren toegesloten, toen zij uitbrak, en uit de baarmoeder voortkwam?", "Jes 45:1-6": "Zo zegt de HEERE tegen Zijn gezalfde, tegen Kores, wiens rechterhand Ik vastheb, om de volken voor zijn aangezicht neer te werpen; en Ik zal de lendenen van de koningen ontbinden, om voor zijn aangezicht de deuren te openen, en de poorten zullen niet gesloten worden: Ik zal voor uw aangezicht gaan, en Ik zal de kromme wegen recht maken; de koperen deuren zal Ik verbreken, en de ijzeren grendels zal Ik in stukken slaan. En Ik zal u de schatten geven die in de duisternissen zijn, en de verborgen rijkdommen; opdat u weet dat Ik de HEERE ben, Die u bij uw naam roept, de God van Israël;", "Jes 42:7": "Om de blinde ogen te openen, om de gevangenen uit de gevangenis te leiden, en uit de gevangenis hen die in duisternis zitten.", "Deut 10:18": "Die het recht van de wees en van de weduwe doet; en de vreemdeling liefheeft, door hem brood en kleding te geven.", "Jes 60:16": "En u zult de melk van de heidenen zuigen, en u zult de borsten van de koningen zuigen; en u zult weten dat Ik de HEERE ben, uw Heiland, en uw Verlosser, de Machtige van Jakob.", "Spr 8:1-5": "Roept de Wijsheid niet, en verheft de Verstandigheid niet Haar stem? Op de top van de hoge plaatsen, aan de weg, ter plaatse waar paden samenkomen, staat Zij; Aan de zijde van de poorten, voor aan de stad, aan de ingang van de deuren roept Zij overluid:"}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H1078\">Bel</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1078\">is</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3766\">gekromd</span>, <span class=\"wl\" data-l=\"L3\" data-code=\"H5015\">Nebo</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H5015\">wordt</span> neergebogen, <span class=\"wl\" data-l=\"L4\" data-code=\"H6091\">hun</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H6091\">afgoden</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H6091\">zijn</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H2416\">geworden</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H2416\">voor</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H2416\">de</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H2416\">dieren</span> <span class=\"wl\" data-l=\"L6\" data- const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
