l":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Zie, de HEERE maakt het land leeg, en Hij maakt het woest; en Hij keert de gestalte ervan om, en Hij verstrooit zijn inwoners.","2":"En zoals het met het volk zal gaan, zo zal het met de priester zijn; zoals met de knecht, zo met zijn heer; zoals met de dienstmaagd, zo met haar vrouw; zoals met de koper, zo met de verkoper; zoals met de lener, zo met de ontlener; zoals met de woekeraar, zo met hem van wie hij woeker ontvangt.","3":"Dat land zal helemaal leeg gemaakt worden, en het zal helemaal beroofd worden; want de HEERE heeft dit woord gesproken.","4":"Het land treurt, het verwelkt; het aardrijk kwijnt weg, het verwelkt; de hoogsten van het volk van het land kwijnen weg.","5":"Want het land is bevlekt vanwege zijn inwoners; want zij overtreden de wetten, zij veranderen de inzettingen, zij vernietigen het eeuwige verbond.","6":"Daarom verteert de vloek het land, en zij die daarin wonen, zullen verwoest worden; daarom zullen de inwoners van het land verbrand worden, en er zullen weinig mensen overblijven.","7":"De most treurt, de wijnstok kwijnt weg, allen die blijhartig waren, zuchten.","8":"De vreugde van de trommelen rust, het geluid van de vrolijk huppelende houdt op, de vreugde van de harp rust.","9":"Zij zullen geen wijn drinken met gezang; de sterke drank zal bitter zijn voor hen die hem drinken.","10":"De woeste stad is verbroken, alle huizen staan gesloten, zodat er niemand in kan komen.","11":"Er is een klagelijk geroep op de straten, om de wijn; alle blijdschap is verduisterd, de vreugde van het land is heengegaan.","12":"Verwoesting is in de stad overgebleven, en met gekraak wordt de poort in stukken verbroken.","13":"Want in het binnenste van het land, in het midden van deze volken, zal het zo zijn als de afschudding van het olijfboom, als de nalezingen, wanneer de wijnoogst geëindigd is.","14":"Die zullen hun stem opheffen, zij zullen vrolijk zingen; vanwege de heerlijkheid van de HEERE zullen zij juichen vanaf de zee.","15":"Daarom eert de HEERE in de valleien, in de eilanden van de zee de Naam van de HEERE, de God van Israël.","16":"Van het uiterste einde van de aarde horen wij psalmen, tot verheerlijking van de Rechtvaardige. Maar nu zeg ik: Ik word mager, ik word mager, wee mij! De trouwelozen handelen trouweloos, en met trouweloosheid handelen de trouwelozen trouweloos.","17":"De angst, en de kuil, en de strik over u, o inwoners van het land!","18":"En het zal gebeuren: wie voor het geluid van de angst vlucht, die zal in de kuil vallen; en wie uit de kuil opklimt, die zal in de strik gevangen worden; want de sluizen in de hoogte zijn opengedaan, en de fundamenten van de aarde zullen beven.","19":"De aarde zal helemaal verbroken worden, de aarde zal helemaal uiteengescheurd worden, de aarde zal helemaal in beweging gebracht worden.","20":"De aarde zal helemaal waggelen, zoals een dronkaard, en zij zal heen en weer bewogen worden, zoals een nachthut; en haar overtreding zal zwaar op haar zijn, en zij zal vallen, en niet meer opstaan.","21":"En het zal gebeuren op die dag, dat de HEERE bezoeking zal doen over de heerscharen van de hoge in de hoogte, en over de koningen van de aardbodem op de aardbodem.","22":"En zij zullen bijeengebracht worden, zoals gevangenen in een put, en zij zullen opgesloten worden in een gevangenis, maar na veel dagen weer bezocht worden.","23":"En de maan zal schaamrood worden, en de zon zal beschaamd worden, als de HEERE van de heerscharen regeren zal op de berg Sion en te Jeruzalem, en voor Zijn oudsten zal heerlijkheid zijn."},"SV":{"1":"Ziet, de HEERE maakt het land ledig, en Hij maakt het woest; en Hij keert deszelfs gestaltenis om, en Hij verstrooit zijn inwoners.","2":"En gelijk het volk, alzo zal de priester wezen; gelijk de knecht, alzo zijn heer; gelijk de dienstmaagd, alzo haar vrouw; gelijk de koper, alzo de verkoper; gelijk de lener, alzo de ontlener; gelijk de woekeraar, alzo die, van welken hij woeker ontvangt.","3":"Dat land zal ganselijk ledig gemaakt worden, en het zal ganselijk beroofd worden; want de HEERE heeft dit woord gesproken.","4":"Het land treurt, het verwelkt; het aardrijk kweelt, het verwelkt; de hoogsten van het volk des lands kwelen.","5":"Want het land is bevlekt vanwege zijn inwoners; want zij overtreden de wetten, zij veranderen de inzettingen, zij vernietigen het eeuwig verbond.","6":"Daarom verteert de vloek het land, en die daarin wonen, zullen verwoest worden; daarom zullen de inwoners des lands verbrand worden, en er zullen weinig mensen overblijven.","7":"De most treurt, de wijnstok kweelt, allen die blijhartig waren, zuchten.","8":"De vreugde der trommelen rust; het geluid der vrolijk huppelenden houdt op, de vreugde der harp rust.","9":"Zij zullen geen wijn drinken met gezang; de sterke drank zal bitter zijn dengenen, die hem drinken.","10":"De woeste stad is verbroken, al de huizen staan gesloten, dat er niemand inkomen kan.","11":"Er is een klagelijk geroep op de straten, om des wijns wil; alle blijdschap is verduisterd, de vreugde des lands is heengevaren.","12":"Verwoesting is in de stad overgebleven, en met gekraak wordt de poort in stukken verbroken.","13":"Want in het binnenste van het land, in het midden dezer volken, zal het alzo wezen, gelijk de afschudding des olijfbooms, gelijk de nalezingen, wanneer de wijnoogst geëindigd is.","14":"Die zullen hun stem opheffen, zij zullen vrolijk zingen; vanwege de heerlijkheid des HEEREN zullen zij juichen van de zee af.","15":"Daarom eert den HEERE in de valleien, in de eilanden der zee den Naam des HEEREN, des Gods van Israël.","16":"Van het uiterste einde der aarde horen wij psalmen, *tot* verheerlijking des Rechtvaardigen. Doch *nu* zeg ik: Ik word mager, ik word mager, wee mij! de trouwelozen handelen trouwelooslijk, en met trouweloosheid handelen de trouwelozen trouwelooslijk.","17":"De vrees, en de kuil, en de strik over u, o inwoners des lands!","18":"En het zal geschieden, zo wie voor de stem der vreze vlieden zal, die zal in den kuil vallen; en die uit den kuil opklimt, die zal in den strik gevangen worden; want de sluizen in de hoogte zijn opengedaan, en de fondamenten der aarde zullen beven.","19":"De aarde zal ganselijk verbroken worden, de aarde zal ganselijk vaneen gescheurd worden, de aarde zal ganselijk bewogen worden.","20":"De aarde zal ganselijk waggelen, gelijk een dronkaard, en zij zal heen en weder bewogen worden, gelijk een nachthut; en haar overtreding zal zwaar op haar zijn, en zij zal vallen, en niet weder opstaan.","21":"En het zal geschieden te dien dage, dat de HEERE bezoeking doen zal over de heirscharen des hogen in de hoogte, en over de koningen des aardbodems op den aardbodem.","22":"En zij zullen samenvergaderd worden, *gelijk* de gevangenen in een put, en zij zullen besloten worden in een gevangenis, maar na vele dagen *weder* bezocht worden.","23":"En de maan zal schaamrood worden, en de zon zal beschaamd worden, als de HEERE der heirscharen regeren zal op den berg Sion en te Jeruzalem, en voor zijn oudsten zal heerlijkheid zijn."},"KJV":{"1":"Behold, the LORD maketh the earth empty, and maketh it waste, and turneth it upside down, and scattereth abroad the inhabitants","2":"And it shall be, as with the people, so with the priest; as with the servant, so with his master; as with the maid, so with her mistress; as with the buyer, so with the seller; as with the lender, so with the borrower; as with the taker of usury, so with the giver of usury","3":"The land shall be utterly emptied, and utterly spoiled: for the LORD hath spoken this word.","4":"The earth mourneth *and* fadeth away, the world languisheth *and* fadeth away, the haughty people of the earth do languish.","5":"The earth also is defiled under the inhabitants thereof; because they have transgressed the laws, changed the ordinance, broken the everlasting covenant.","6":"Therefore hath the curse devoured the earth, and they that dwell therein are desolate: therefore the inhabitants of the earth are burned, and few men left.","7":"The new wine mourneth, the vine languisheth, all the merryhearted do sigh.","8":"The mirth of tabrets ceaseth, the noise of them that rejoice endeth, the joy of the harp ceaseth.","9":"They shall not drink wine with a song; strong drink shall be bitter to them that drink","10":"The city of confusion is broken down: every house is shut up, that no man may come in.","11":"*There is* a crying for wine in the streets; all joy is darkened, the mirth of the land is gone.","12":"In the city is left desolation, and the gate is smitten with destruction.","13":"When thus it shall be in the midst of the land among the people, *there shall be* as the shaking of an olive tree, *and* as the gleaning grapes when the vintage is done.","14":"They shall lift up their voice, they shall sing for the majesty of the LORD, they shall cry aloud from the sea.","15":"Wherefore glorify ye the LORD in the fires, *even* the name of the LORD God of Israel in the isles of the sea.","16":"From the uttermost part of the earth have we heard songs, *even* glory to the righteous. But I said, My leanness, my leanness, woe unto me! the treacherous dealers have dealt treacherously; yea, the treacherous dealers have dealt very treacherously.","17":"Fear, and the pit, and the snare, *are* upon thee, O inhabitant of the earth.","18":"And it shall come to pass, *that* he who fleeth from the noise of the fear shall fall into the pit; and he that cometh up out of the midst of the pit shall be taken in the snare: for the windows from on high are open, and the foundations of the earth do shake.","19":"The earth is utterly broken down, the earth is clean dissolved, the earth is moved exceedingly.","20":"The earth shall reel to and fro like a drunkard, and shall be removed like a cottage; and the transgression thereof shall be heavy upon it; and it shall fall, and not rise again.","21":"And it shall come to pass in that day, *that* the LORD shall punish the host of the high ones *that are* on high, and the kings of the earth upon the earth.","22":"And they shall be gathered together, *as* prisoners are gathered in the pit, and shall be shut up in the prison, and after many days shall they be visited.","23":"Then the moon shall be confounded, and the sun ashamed, when the LORD of hosts shall reign in mount Zion, and in Jerusalem, and before his ancients gloriously."}},"tsk":{"1":[{"kopje":"maakt het","refs":["Jes 1:7-9","Jes 5:6","Jes 6:11","Jes 6:12","Jes 7:17-25","Jes 27:10","Jes 32:13","Jes 32:14","Jes 42:15","Jer 4:7","Ezech 5:14","Ezech 6:6","Ezech 12:20","Ezech 24:11","Ezech 35:14","Nahum 2:10","Luk 21:24"]},{"kopje":"keert de gestalte ervan om","refs":["Jes 29:16","2 Kon 21:13","Ps 146:9","Hand 17:6"]},{"kopje":"verstrooit","refs":["Deut 4:27","Deut 28:64","Deut 32:26","Neh 1:8","Jer 9:16","Jer 40:15","Jer 50:17","Ezech 5:2","Zach 13:7-9","Jak 1:1"]}],"2":[{"kopje":"zoals het met het volk zal gaan","refs":["Jes 2:9","Jes 3:2-8","Jes 5:15","Jes 9:13-16","2 Kron 36:14-17","2 Kron 36:20","Jer 5:3-6","Jer 23:11-13","Jer 41:2","Jer 42:18","Jer 44:11-13","Jer 52:24-30","Klaagl 4:13","Klaagl 5:12-14","Ezech 7:12","Ezech 7:13","Ezech 14:8-10","Dan 9:5-8","Hos 4:9","Ef 6:8","Ef 6:9"]},{"kopje":"priester","refs":["Gen 41:50"]}],"3":[{"kopje":"zal","refs":["Jes 24:1","Jes 6:11","Lev 26:30-35","Deut 29:23","Deut 29:28","2 Kron 36:21","Ezech 36:4"]},{"kopje":"de HEERE","refs":["Jes 21:17","Jes 22:25","Jer 13:15","Micha 4:4"]}],"4":[{"kopje":"treurt","refs":["Jes 3:26","Jes 28:1","Jes 33:9","Jes 64:6","Jer 4:28","Jer 12:4","Hos 4:3"]},{"kopje":"hoogsten van het volk","refs": v\" data-code=\"H6682\">crying</span> for <span class=\"wl wl-kjv\" data-code=\"H3196\">wine</span> in the <span class=\"wl wl-kjv\" data-code=\"H2351\">streets;</span> all <span class=\"wl wl-kjv\" data-code=\"H8057\">joy</span> is <span class=\"wl wl-kjv\" data-code=\"H6150\">darkened,</span> the <span class=\"wl wl-kjv\" data-code=\"H4885\">mirth</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> is gone.","12":"In the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> is <span class=\"wl wl-kjv\" data-code=\"H7604\">left</span> <span class=\"wl wl-kjv\" data-code=\"H8047\">desolation,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> is <span class=\"wl wl-kjv\" data-code=\"H3807\">smitten</span> with destruction.","13":"When thus it shall be in the <span class=\"wl wl-kjv\" data-code=\"H7130\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> there shall be as the <span class=\"wl wl-kjv\" data-code=\"H5363\">shaking</span> of an olive <span class=\"wl wl-kjv\" data-code=\"H2132\">tree,</span> and as the gleaning <span class=\"wl wl-kjv\" data-code=\"H5955\">grapes</span> when the <span class=\"wl wl-kjv\" data-code=\"H1210\">vintage</span> is done.","14":"They shall lift <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> their <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> they shall <span class=\"wl wl-kjv\" data-code=\"H7442\">sing</span> for the <span class=\"wl wl-kjv\" data-code=\"H1347\">majesty</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> they shall cry <span class=\"wl wl-kjv\" data-code=\"H6670\">aloud</span> from the sea.","15":"Wherefore <span class=\"wl wl-kjv\" data-code=\"H3513\">glorify</span> ye the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> in the <span class=\"wl wl-kjv\" data-code=\"H217\">fires,</span> even the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> in the <span class=\"wl wl-kjv\" data-code=\"H339\">isles</span> of the sea.","16":"From the uttermost <span class=\"wl wl-kjv\" data-code=\"H3671\">part</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> have we <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> <span class=\"wl wl-kjv\" data-code=\"H2158\">songs,</span> even <span class=\"wl wl-kjv\" data-code=\"H6643\">glory</span> to the <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous.</span> But I <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> My <span class=\"wl wl-kjv\" data-code=\"H7334\">leanness,</span> my <span class=\"wl wl-kjv\" data-code=\"H7334\">leanness,</span> <span class=\"wl wl-kjv\" data-code=\"H188\">woe</span> unto me! the treacherous <span class=\"wl wl-kjv\" data-code=\"H898\">dealers</span> have dealt <span class=\"wl wl-kjv\" data-code=\"H898\">treacherously;</span> yea, the treacherous <span class=\"wl wl-kjv\" data-code=\"H898\">dealers</span> have dealt <span class=\"wl wl-kjv\" data-code=\"H899\">very</span> treacherously.","17":"<span class=\"wl wl-kjv\" data-code=\"H6343\">Fear,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6354\">pit,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6341\">snare,</span> are upon thee, O <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitant</span> of the earth.","18":"And it shall come to pass, that he who <span class=\"wl wl-kjv\" data-code=\"H5127\">fleeth</span> from the <span class=\"wl wl-kjv\" data-code=\"H6963\">noise</span> of the <span class=\"wl wl-kjv\" data-code=\"H6343\">fear</span> shall <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> into the <span class=\"wl wl-kjv\" data-code=\"H6354\">pit;</span> and he that cometh <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> out of the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H6354\">pit</span> shall be <span class=\"wl wl-kjv\" data-code=\"H3920\">taken</span> in the <span class=\"wl wl-kjv\" data-code=\"H6341\">snare:</span> for the <span class=\"wl wl-kjv\" data-code=\"H699\">windows</span> from on <span class=\"wl wl-kjv\" data-code=\"H4791\">high</span> are <span class=\"wl wl-kjv\" data-code=\"H6605\">open,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4146\">foundations</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> do shake.","19":"The <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> is <span class=\"wl wl-kjv\" data-code=\"H7489\">utterly</span> broken <span class=\"wl wl-kjv\" data-code=\"H7489\">down,</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> is <span class=\"wl wl-kjv\" data-code=\"H6565\">clean</span> <span class=\"wl wl-kjv\" data-code=\"H6565\">dissolved,</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> is <span class=\"wl wl-kjv\" data-code=\"H4131\">moved</span> exceedingly.","20":"The <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> shall <span class=\"wl wl-kjv\" data-code=\"H5128\">reel</span> to and <span class=\"wl wl-kjv\" data-code=\"H5128\">fro</span> like a <span class=\"wl wl-kjv\" data-code=\"H7910\">drunkard,</span> and shall be <span class=\"wl wl-kjv\" data-code=\"H5110\">removed</span> like a <span class=\"wl wl-kjv\" data-code=\"H4412\">cottage;</span> and the <span class=\"wl wl-kjv\" data-code=\"H6588\">transgression</span> thereof shall be <span class=\"wl wl-kjv\" data-code=\"H3513\">heavy</span> upon it; and it shall <span class=\"wl wl-kjv\" data-code=\"H5307\">fall,</span> and not <span class=\"wl wl-kjv\" data-code=\"H6965\">rise</span> again.","21":"And it shall come to pass in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H6485\">punish</span> the <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> of the high <span class=\"wl wl-kjv\" data-code=\"H4791\">ones</span> that are on <span class=\"wl wl-kjv\" data-code=\"H4791\">high,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of the <span class=\"wl wl-kjv\" data-code=\"H127\">earth</span> upon the earth.","22":"And they shall be gathered <span class=\"wl wl-kjv\" data-code=\"H622\">together,</span> as <span class=\"wl wl-kjv\" data-code=\"H616\">prisoners</span> are <span class=\"wl wl-kjv\" data-code=\"H626\">gathered</span> in the <span class=\"wl wl-kjv\" data-code=\"H953\">pit,</span> and shall be shut <span class=\"wl wl-kjv\" data-code=\"H5462\">up</span> in the <span class=\"wl wl-kjv\" data-code=\"H4525\">prison,</span> and after <span class=\"wl wl-kjv\" data-code=\"H7230\">many</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> shall they be visited.","23":"Then the <span class=\"wl wl-kjv\" data-code=\"H3842\">moon</span> shall be <span class=\"wl wl-kjv\" data-code=\"H2659\">confounded,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2535\">sun</span> <span class=\"wl wl-kjv\" data-code=\"H954\">ashamed,</span> when the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts</span> shall <span class=\"wl wl-kjv\" data-code=\"H4427\">reign</span> in <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion,</span> and in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> and before his <span class=\"wl wl-kjv\" data-code=\"H2205\">ancients</span> gloriously."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"het land","tekst":"Te weten het Joodse land en dergenen, die het met de Joden houden. Dit zou geschieden eerst door de Assyriërs, daarna door de Chaldeën."},{"catchword":"ledig,","tekst":"Of, Hij put uit."},{"catchword":"zijne gestaltenis om,","tekst":"Hebreeuws, zijn aangezicht; dat is, gedaante, gelaat, gestaltenis; dat is, Hij zal het land, met al wat er in is, ten onderste boven werpen, zodat het hetzelfde land niet gelijken zal."}],"2":[{"catchword":"gelijk het volk,","tekst":"De zin is dat de ellenden, waar hij van spreekt, alle staten van mensen zullen overkomen, de een zowel als den ander. Zie Hos 4:9 ."},{"catchword":"priester","tekst":"Of, overste of regent. Het Hebreeuwse woord Cohen betekent het ene zowel als het andere; zie Gen 41:45 ."}],"3":[{"catchword":"Dat land","tekst":"Te weten dat land waarvan vs.1 gesproken wordt."},{"catchword":"ganselijk","tekst":"Hebreeuws, ledig gemaakt wordende, ledig gemaakt worden."},{"catchword":"ganselijk beroofd","tekst":"Hebreeuws, beroofd wordende, beroofd worden; dat is, het zal gans geheel beroofd en uitgeplunderd worden."}],"4":[{"catchword":"het aardrijk","tekst":"Te weten dat deel des lands, waar Judea in ligt."},{"catchword":"kweelt, het verwelkt","tekst":"Te weten van hartzeer en droefenis."},{"catchword":"kwelen","tekst":"Of, zij worden zwak, mat, flauw."}],"5":[{"catchword":"vanwege","tekst":"Anders: onder zijne inwoners. De zin is: Het volk dezes lands, te weten van het Joodse land, is zo boos en verdorven, dat het dat land, hetwelk het betreedt, bevlekt en ontheiligt."},{"catchword":"de inzettingen,","tekst":"Te weten Gods."},{"catchword":"het eeuwig verbond","tekst":"Te weten dat verbond, hetwelk God met Abraham en zijn zaad heeft opgericht, en door de besnijdenis heeft bevestigd; Gen 17 , en hetwelk God daarna vernieuwd heeft; Exo 24 ."}],"6":[{"catchword":"de vloek","tekst":"Die vloek, dien de Israëlieten zich hebben onderworpen, als zij met God in het verbond getreden zijn, zich verbindende zijne wetten en geboden te onderhouden; Exo 19:24 , en Deu 29 . Anders, de eed des vloeks. Van deze manier van spreken, zie Gen 24:41 ."},{"catchword":"verbrand worden,","tekst":"Dat is, zij zullen omkomen, hetzij door het vuur, of anderszins; of door den brand en de hitte van den toorn Gods."},{"catchword":"weinig","tekst":"Het grootste deel der mensen is gedood, of het land uitgevoerd geworden in slavernij; zie Isa 1:9 , en Isa 17:6 ."}],"7":[{"catchword":"treurt,","tekst":"Te weten omdat hij onnuttelijk van de vijanden zal gedronken en verplengd worden."},{"catchword":"kweelt,","tekst":"Dat is, hij verdwijnt of verwelkt, te weten omdat hij van de vijanden zal vertreden en vernield worden."},{"catchword":"zuchten","tekst":"Al de woorden van vs.7 en enige der navolgende verzen strekken daartoe, om aan te wijzen dat alles zeer jammerlijk in het land zou toegaan."}],"8":[{"catchword":"De vreugde der trommelen . . . de vreugde der harp","tekst":"Dat is, de vreugde, die men placht de scheppen en het geluid der trommelen en harpen."},{"catchword":"rust;","tekst":"Dat is, houdt op. Het Hebreeuwse woord betekent zoveel als sabbat houden."},{"catchword":"het geluid","tekst":"Of, het gerommel, het geruisch."}],"9":[{"catchword":"met gezang;","tekst":"Of, in het gezang; dat is, als zij lustig en vrolijk zijn met zingen en klinken in het hun dronken gelagen."}],"10":[{"catchword":"De woeste stad","tekst":"Die woest gemaakt zal worden door het geweld hunner vijanden, die haar innemen zullen. En versta hier de stad Jeruzalem, mitsgaders andere steden daar omheen liggende; zie onder Isa 30:14 ."},{"catchword":"dat er niemand","tekst":"Hebreeuws, van inkomen; vergelijk boven Isa 23:1 ."}],"11":[{"catchword":"om des wijns wil;","tekst":"Omdat de wijn bedorven is, of omdat er niets meer te bekomen is."},{"catchword":"is verduisterd,","tekst":"Of, heeft [haren] avond; dat is, zij neemt af, zij heeft haar einde, gelijk het klaarschijnende zonlicht des avonds en des nachts verduistert en vertrekt."}],"13":[{"catchword":"dezer volken,","tekst":"Versta hier, de stammen van het Joodse volk, alsook de Syriërs, Egyptenaars, Moabieten en andere natiën, tegen welke de profeet hierboven geprofeteerd heeft."},{"catchword":"zal het alzo wezen,","tekst":"Of, zal het alzo toegaan, dit zal de gelegenheid zijn van het land."},{"catchword":"gelijk de afschudding","tekst":"De zin is: Gelijk wanneer een olijfboom afgeplukt en de wijnoogst gedaan is, evenwel nog enige olijven aan de bomen, of druiven aan de wijnstokken overig blijven; alzo, ofschoon het land zal verwoest en mijn volk zal doodgeslagen en verstrooid worden; zo zullen er nochtans enigen overblijven, wien God de Heere genade zal bewijzen."}],"14":[{"catchword":"Die zullen","tekst":"Te weten die weinigen, die overgebleven zullen zijn en van God genade zullen verkregen hebben."},{"catchword":"de heerlijkheid","tekst":"Of, majesteit, of hoogheid."},{"catchword":"van de zee af","tekst":"Dat is, zijnde in verre en vreemde landen, of waar zij anders wezen mogen."}],"15":[{"catchword":"in de valleien,","tekst":"Dat is, aan alle plaatsen, waar gelovige en godvruchtige personen zijn. Anders: in de vuren, dat is, die gij nog in groot lijden zijt."}],"16":[{"catchword":"het uiterste","tekst":"Hebreeuws, van den vleugel der aarde."},{"catchword":"Rechtvaardigen","tekst":"Te weten Gods; zie de voorgaande verzen. Anders: dat den gerechtige ene heerlijkheid [gegeven zij], te weten al dengenen, die God uit genade rechtvaardig maakt, en versta dan door de heerlijkheid de heerlijkheid der kinderen Gods; Rom 8:30 ."},{"catchword":"Doch","tekst":"Hier begint de profeet wederom te spreken van de verstoring van het Joodse land, alsof hij zeide: Maar als ik aanzie de ongeregeldheid der mensen, en wel wetende dat God dezelve niet altijd zal ongestraft laten, zo spreek ik al klagende, gelijk volgt."},{"catchword":"Ik word mager,","tekst":"Dat is, ik neem mij dit zo ter harte, dat ik verdwijn van treurigheid, aanziende de trouweloosheid van den grootsten hoop mijner landslieden, waarmede zij den toorn Gods over zich verwekken. Anders: ik teer uit, ik teer uit."}],"17":[{"catchword":"De vrees,","tekst":"Zie Psa 11:6 . In vs.17 staan drie Hebreeuwse woorden op ene wijze luidende; te weten, pachad, pachat, pach, welker eigenaardigheid wij in onze spraak niet kunnen uitdrukken."},{"catchword":"de strik","tekst":"Anders, het net."}],"18":[{"catchword":"zo wie","tekst":"Vergelijk Job 20:24 , enz."},{"catchword":"voor de stem","tekst":"Dat is, voor de stem der vijanden, die schrik en vrees zullen aanjagen. De mening is: ofschoon iemand het ene ongeluk ontvlieden zal, zo zal hij toch in een ander vervallen."},{"catchword":"den kuil opklimt,","tekst":"Hebreeuws, uit het midden des kuils."},{"catchword":"de sluizen","tekst":"Of, spuien, of sluizen. De profeet wil zeggen dat God zijn toorn over hen uitstorten en openbaren zou, boven uit den hemel en beneden op de aarde, gelijk ten tijde van den zondvloed geschied is. Anders, vensters. Zie de aantekening Gen 7:11 ."}],"19":[{"catchword":"De aarde zal ganselijk verbroken worden,","tekst":"Hebreeuws, brekende gebroken worden. De zin is: Het zal al bersten en breken, het onderste zal op den aardbodem boven gaan. Doch versta hier eigenlijk die landen, waarin de Joden en hunne bondgenoten in die tijden woonden."}],"20":[{"catchword":"De aarde zal ganselijk waggelen,","tekst":"Versta hier doorgaans door de aarde, of het aardrijk, de inwoners van het land."},{"catchword":"een nachthut;","tekst":"Die lichtelijk van den wind heen en weder geschud, of ook van de ene plaats op de andere kan gevoerd of gedragen worden. Zie Jer 9:2 ; alzo van de herders, Isa 1:8 ; van krijgslieden, boven Isa 10:29 ."},{"catchword":"haar overtreding","tekst":"Dat is de straf hunner overtreding."},{"catchword":"niet weder opstaan","tekst":"Hebreeuws, niet toedoen op te staan; te weten in zulken voortreffelijken welstand en heerlijkheid als zij tevoren geweest is."}],"21":[{"catchword":"te dien dage,","tekst":"Dat is, in den tijd van God den Heere daartoe bestemd."},{"catchword":"bezoeking doen zal","tekst":"Te weten in zijnen toorn, dat is, straffen zal."},{"catchword":"des hogen","tekst":"Of, der hoogheid. Hij wil zeggen, der hoogverheven koningen dezer wereld."}],"22":[{"catchword":"zullen samenvergaderd worden,","tekst":"Hebreeuws, zij zullen vergaderd worden [met] de vergadering als een gevangene; dat is, gelijk men de gevangenen in een put vergadert of bij elkander sluit."},{"catchword":"na vele dagen","tekst":"Hebreeuws, na de veelheid der dagen."},{"catchword":"weder bezocht worden","tekst":"Te weten met genade, ten tijde van de toekomst van Christus."}],"23":[{"catchword":"de maan","tekst":"Dat is, de glans en schone schijn der zon en der maan zullen niet met al zijn ten aanzien der heerlijkheid van ons Hoofd Jezus Christus in zijne kerk, en als Hij komen zal in de heerlijkheid van zijn Vader."},{"catchword":"op den berg Sion","tekst":"Dat is hier te zeggen, in de Christelijke kerk."},{"catchword":"voor zijn oudsten","tekst":"Dien Hij tot voorstanders zijner kerk is stellende/"},{"catchword":"zal heerlijkheid zijn","tekst":"Anders: zeer heerlijk, of daar zal heerlijkheid zijn in de tegenwoordigheid zijner oudsten."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Behold, the Lord maketh the land [To wit, the land of Juda, and of them that take part with the Jews] empty, [or he emptieth it, draweth it out] and he maketh it wast: [this was to be done first by the Assyrians, and afterward by the Chaldeans] and he overturneth the shape of it, [Heb. The face of it; that is, the form, countenance, shape thereof; that is, he will turn the land, with all that is in it, upside down, so that it shall not be like it self] and he scattereth abroad the inhabitants thereof."}],"2":[{"catchword":null,"tekst":"And as the people, so shall the priest [Or commander, or Ruler. The Hebrew word chosen signifieth the one as well as the other. See Genes.41.on vers.45.] be; as the servant, so his Lord; as the handmaid, so her mistress; as the buyer, so the // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}

      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
