,"Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Het visioen van Jesaja, de zoon van Amoz, dat hij zag over Juda en Jeruzalem, in de dagen van Uzzia, Jotham, Achaz *en* Hizkia, de koningen van Juda.","2":"Hoor, hemelen! en neem het ter oor, aarde! Want de HEERE spreekt: Ik heb kinderen groot gemaakt en verhoogd, maar zij hebben tegen Mij overtreden.","3":"Een os kent zijn bezitter, en een ezel de krib van zijn heer; *maar* Israël heeft geen kennis, Mijn volk begrijpt het niet.","4":"Wee het zondige volk, het volk van zware ongerechtigheid, het nageslacht van de boosdoeners, de verdervende kinderen! Zij hebben de HEERE verlaten, zij hebben de Heilige van Israël gelasterd, zij hebben zich vervreemd, *wijkende* achterwaarts.","5":"Waartoe zou u nog meer geslagen worden? U zou van het afval des te meer maken; het hele hoofd is ziek, en het hele hart is mat.","6":"Van de voetzool af tot het hoofd toe is er niets van het geheel gaaf aan hem; *maar* wonden, en striemen, en etterbuilen, *die* niet uitgedrukt noch verbonden zijn, en geen daarvan is met olie verzacht.","7":"Uw land is een verwoesting, uw steden zijn met het vuur verbrand; uw grond verteren de vreemden in uw tegenwoordigheid, en een verwoesting is er, als een omkering door de vreemden.","8":"En de dochter van Sion is overgebleven als een hutje in de wijngaard, als een nachthutje in de komkommerhof, als een belegerde stad.","9":"Als de HEERE van de heerscharen ons niet nog een klein overblijfsel had gelaten, zouden wij als Sodom geworden zijn; wij zouden Gomorra gelijk zijn geworden.","10":"Hoor het woord van de HEERE, leiders van Sodom! Neem de wet van onze God ter oor, volk van Gomorra!","11":"Waartoe zal Mij de veelheid van uw slachtoffers zijn? zegt de HEERE; Ik ben zat van de brandoffers van de rammen, en het vet van de vette *dieren*, en heb geen lust aan het bloed van de stieren, noch van de lammeren, noch van de bokken.","12":"Wanneer u voor Mijn aangezicht komt te verschijnen, wie heeft dat van uw hand geëist, dat u Mijn voorhoven zou betreden?","13":"Breng niet meer een nutteloos offer; het reukwerk is Mij een gruwel; de nieuwe manen, en sabbatten, *en* het bijeenroepen van de samenkomsten kan Ik niet verdragen, het is ongerechtigheid, zelfs de verbodsdagen.","14":"Uw nieuwe manen en uw vastgestelde hoogtijden haat Mijn ziel, zij zijn Mij tot een last; Ik ben moe geworden, *ze* te dragen.","15":"En als u uw handen uitspreidt, verberg Ik Mijn ogen voor u; ook wanneer u het gebed vermenigvuldigt, hoor Ik niet; *want* uw handen zijn vol bloed.","16":"Was u, reinig u, doe de boosheid van uw handelingen van voor Mijn ogen weg, houd op met kwaad te doen.","17":"Leer goed te doen, zoek het recht, help de verdrukte, doe de wees recht, voer de rechtszaak van de weduwe.","18":"Kom dan, en laten wij samen rechten, zegt de HEERE; al waren uw zonden als scharlaken, zij zullen wit worden als sneeuw, al waren zij rood als karmozijn, zij zullen worden als *witte* wol.","19":"Als u willig bent en luistert, zult u het goede van dit land eten;","20":"Maar als u weigert, en opstandig bent, zult u door het zwaard gegeten worden; want de mond van de HEERE heeft *het* gesproken.","21":"Hoe is de trouwe stad tot een hoer geworden! Zij was vol recht, gerechtigheid herbergde daarin, maar nu doodslagers.","22":"Uw zilver is geworden tot schuim; uw wijn is vermengd met water.","23":"Uw vorsten zijn afvalligen, en metgezellen van dieven, ieder van hen heeft geschenken lief, en zij jagen de vergeldingen na; de wezen doen zij geen recht, en de rechtszaak van de weduwen komt voor hen niet.","24":"Daarom spreekt de Heere, HEERE van de heerscharen, de Machtige van Israël: O wee! Ik zal Mij troosten over Mijn tegenstanders. Ik zal Mij wreken op Mijn vijanden.","25":"En Ik zal Mijn hand tegen u keren, en Ik zal uw schuim tot het allerreinste afzuiveren, en Ik zal al uw tin wegnemen.","26":"En Ik zal *u* uw rechters teruggeven, als in het begin, en uw raadslieden als in het begin; daarna zult u een stad van de gerechtigheid, een trouwe stad, genoemd worden.","27":"Sion zal door recht verlost worden, en haar wederkerende bewoners door gerechtigheid.","28":"Maar er zal verbreking zijn van de overtreders, en van de zondaars samen; en zij die de HEERE verlaten, zullen omkomen.","29":"Want zij zullen beschaamd worden om de eiken, die u begeerd hebt, en u zult schaamrood worden, om de hoven, die u verkozen hebt.","30":"Want u zult zijn als een eik, waarvan de bladeren afvallen, en als een hof, die geen water heeft.","31":"En de sterke zal worden tot grof vlas, en zijn werkmeester tot een vonk, en zij zullen beide samen branden, en er zal geen uitblusser zijn."},"SV":{"1":"Het gezicht van Jesaja, den zoon van Amoz, hetwelk hij zag over Juda en Jeruzalem, in de dagen van Uzzia, Jotham, Achaz *en* Hizkia, de koningen van Juda.","2":"Hoort, gij hemelen! en neem ter ore, gij aarde! want de HEERE spreekt: Ik heb kinderen groot gemaakt en verhoogd; maar zij hebben tegen Mij overtreden.","3":"Een os kent zijn bezitter, en een ezel de krib zijns heren; *maar* Israël heeft geen kennis, Mijn volk verstaat niet.","4":"Wee het zondige volk, het volk van zware ongerechtigheid, het zaad der boosdoeners, de verdervende kinderen! Zij hebben den HEERE verlaten, zij hebben den Heilige Israëls gelasterd, zij hebben zich vervreemd, *wijkende* achterwaarts.","5":"Waartoe zoudt gij meer geslagen worden? Gij zoudt des afvals des te meer maken; het ganse hoofd is krank, en het ganse hart is mat.","6":"Van de voetzool af tot het hoofd toe is er niets geheels aan hetzelve; *maar* wonden, en striemen, en etterbuilen, *die* niet uitgedrukt noch verbonden zijn, en geen derzelve is met olie verzacht.","7":"Uw aardrijk is een verwoesting, uw steden zijn met het vuur verbrand; uw land verteren de vreemden in uw tegenwoordigheid, en een verwoesting is er, als een omkering door de vreemden.","8":"En de dochter van Sion is overgebleven als een hutje in den wijngaard, als een nachthutje in den komkommerhof, als een belegerde stad.","9":"Zo niet de HEERE der heirscharen ons nog een weinig overblijfsel had gelaten, als Sodom zouden wij geworden zijn; wij zouden Gomorra gelijk zijn geworden.","10":"Hoort des HEEREN woord, gij oversten van Sodom! neemt ter ore de wet onzes Gods, gij volk van Gomorra!","11":"Waartoe zal Mij zijn de veelheid uwer slachtoffers? zegt de HEERE; Ik ben zat van de brandoffers der rammen, en het smeer der vette *beesten*, en heb geen lust aan het bloed der varren, noch der lammeren, noch der bokken.","12":"Wanneer gijlieden voor Mijn aangezicht komt te verschijnen, wie heeft zulks van uw hand geëist, dat gij Mijn voorhoven betreden zoudt?","13":"Brengt niet meer vergeefs offer, het reukwerk is Mij een gruwel; de nieuwe maanden, en sabbatten, *en* het bijeenroepen der vergaderingen vermag Ik niet, het is ongerechtigheid, zelfs de verbodsdagen.","14":"Uw nieuwe maanden en uw gezette hoogtijden haat Mijn ziel, zij zijn Mij tot een last; Ik ben moede geworden, *die* te dragen.","15":"En als gijlieden uw handen uitbreidt, verberg Ik Mijn ogen voor u; ook wanneer gij het gebed vermenigvuldigt, hoor Ik niet; *want* uw handen zijn vol bloed.","16":"Wast u, reinigt u, doet de boosheid uwer handelingen van voor Mijn ogen weg, laat af van kwaad te doen.","17":"Leert goed te doen, zoekt het recht, helpt den verdrukte, doet den wees recht, handelt de twistzaak der weduwe.","18":"Komt dan, en laat ons samen rechten, zegt de HEERE; al waren uw zonden als scharlaken, zij zullen wit worden als sneeuw, al waren zij rood als karmozijn, zij zullen worden als *witte* wol.","19":"Indien gijlieden willig zijt en hoort, zo zult gij het goede dezes lands eten;","20":"Maar indien gij weigert, en wederspannig zijt, zo zult gij van het zwaard gegeten worden; want de mond des HEEREN heeft *het* gesproken.","21":"Hoe is de getrouwe stad tot een hoer geworden! Zij was vol recht, gerechtigheid herbergde daarin, maar nu doodslagers.","22":"Uw zilver is geworden tot schuim; uw wijn is vermengd met water.","23":"Uw vorsten zijn afvalligen, en metgezellen der dieven, een ieder van hen heeft geschenken lief, en zij jagen de vergeldingen na; den wezen doen zij geen recht, en de twistzaak der weduwen komt voor hen niet.","24":"Daarom spreekt de Heere, HEERE der heirscharen, de Machtige Israëls: O wee! Ik zal Mij troosten van Mijn wederpartijders. Ik zal Mij wreken van Mijn vijanden.","25":"En Ik zal Mijn hand tegen u keren, en Ik zal uw schuim op het allerreinste afzuiveren, en Ik zal al uw tin wegnemen.","26":"En Ik zal *u* uw rechters wedergeven, als in het eerste, en uw raadslieden als in den beginne; daarna zult gij een stad der gerechtigheid, een getrouwe stad, genoemd worden.","27":"Sion zal door recht verlost worden, en haar wederkerenden door gerechtigheid.","28":"Maar er zal verbreking zijn der overtreders, en der zondaars te zamen; en die den HEERE verlaten, zullen omkomen.","29":"Want zij zullen beschaamd worden om der eiken wil, die gijlieden begeerd hebt, en gij zult schaamrood worden, om der hoven wil, die gij verkoren hebt.","30":"Want gij zult zijn als een eik, welks bladeren afvallen, en als een hof, die geen water heeft.","31":"En de sterke zal wezen tot grof vlas, en zijn werkmeester tot een vonk, en zij zullen beiden te zamen branden, en er zal geen uitblusser wezen."},"KJV":{"1":"The vision of Isaiah the son of Amoz, which he saw concerning Judah and Jerusalem in the days of Uzziah, Jotham, Ahaz, *and* Hezekiah, kings of Judah.","2":"Hear, O heavens, and give ear, O earth: for the LORD hath spoken, I have nourished and brought up children, and they have rebelled","3":"The ox knoweth his owner, and the ass his master's crib: *but* Israel doth not know, my people doth not consider.","4":"Ah sinful nation, a people laden with iniquity, a seed of evildoers, children that are corrupters: they have forsaken the LORD, they have provoked the Holy One of Israel unto anger, they are gone away backward.","5":"Why should ye be stricken any more? ye will revolt more and more: the whole head is sick, and the whole heart faint.","6":"From the sole of the foot even unto the head *there is* no soundness in it; *but* wounds, and bruises, and putrifying sores: they have not been closed, neither bound up, neither mollified with ointment.","7":"Your country *is* desolate, your cities *are* burned with fire: your land, strangers devour it in your presence, and *it is* desolate, as overthrown by strangers.","8":"And the daughter of Zion is left as a cottage in a vineyard, as a lodge in a garden of cucumbers, as a besieged city.","9":"Except the LORD of hosts had left unto us a very small remnant, we should have been as Sodom, *and* we should have been like unto Gomorrah.","10":"Hear the word of the LORD, ye rulers of Sodom; give ear unto the law of our God, ye people of Gomorrah.","11":"To what purpose *is* the multitude of your sacrifices unto me? saith the LORD: I am full of the burnt offerings of rams, and the fat of fed beasts; and I delight not in the blood of bullocks, or of lambs, or of he goats.","12":"When ye come to appear before me, who hath required this at your hand, to tread my courts?","13":"Bring no more vain oblations; incense is an abomination unto me; the new moons and sabbaths, the calling of assemblies, I cannot away with; *it is* iniquity, even the solemn meeting.","14":"Your new moons and your appointed feasts my soul hateth: they are a trouble unto me; I am weary to bear","15":"And when ye spread forth your hands, I will hide mine eyes from you: yea, when ye make many prayers, I will not hear: your hands are full of blood.","16":"Wash you, make you clean; put away the evil of your doings from before mine eyes; cease to do evil;","17":"Learn to do well; seek judgment, relieve the oppressed, judge the fatherless, plead for the widow.","18":"Come now, and let us reason together, saith the LORD: though your sins be as scarlet, they shall be as white as snow; though they be red like crimson, they shall be as wool.","19":"If ye be willing and obedient, ye shall eat the good of the land:","20":"But if ye refuse and rebel, ye shall be devoured with the sword: for the mouth of the LORD hath spoken","21":"How is the faithful city become an harlot! it was full of judgment; righteousness lodged in it; but now murderers.","22":"Thy silver is become dross, thy wine mixed with water:","23":"Thy princes *are* rebellious, and companions of thieves: every one loveth gifts, and followeth after rewards: they judge not the fatherless, neither doth the cause of the widow come","24":"Therefore saith the Lord, the LORD of hosts, the mighty One of Israel, Ah, I will ease me of mine adversaries, and avenge me of mine enemies:","25":"And I will turn my hand upon thee, and purely purge away thy dross, and take away all thy tin:","26":"And I will restore thy judges as at the first, and thy counsellors as at the beginning: afterward thou shalt be called, The city of righteousness, the faithful city.","27":"Zion shall be redeemed with judgment, and her converts with righteousness.","28":"And the destruction of the transgressors and of the sinners *shall be* together, and they that forsake the LORD shall be consumed.","29":"For they shall be ashamed of the oaks which ye have desired, and ye shall be confounded for the gardens that ye have chosen.","30":"For ye shall be as an oak whose leaf fadeth, and as a garden that hath no water.","31":"And the strong shall be as tow, and the maker of it as a spark, and they shall both burn together, and none shall quench"}},"tsk":{"1":[{"kopje":"visioen","refs":["Jes 21:2","Num 1 :"And I will <span class=\"wl wl-kjv\" data-code=\"H7725\">restore</span> thy <span class=\"wl wl-kjv\" data-code=\"H8199\">judges</span> as at the <span class=\"wl wl-kjv\" data-code=\"H7223\">first,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H3289\">counsellors</span> as at the <span class=\"wl wl-kjv\" data-code=\"H8462\">beginning:</span> <span class=\"wl wl-kjv\" data-code=\"H310\">afterward</span> thou shalt be <span class=\"wl wl-kjv\" data-code=\"H7121\">called,</span> The <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> of <span class=\"wl wl-kjv\" data-code=\"H6664\">righteousness,</span> the <span class=\"wl wl-kjv\" data-code=\"H539\">faithful</span> city.","27":"<span class=\"wl wl-kjv\" data-code=\"H6726\">Zion</span> shall be <span class=\"wl wl-kjv\" data-code=\"H6299\">redeemed</span> with <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment,</span> and her <span class=\"wl wl-kjv\" data-code=\"H7725\">converts</span> with righteousness.","28":"And the <span class=\"wl wl-kjv\" data-code=\"H7667\">destruction</span> of the <span class=\"wl wl-kjv\" data-code=\"H6586\">transgressors</span> and of the <span class=\"wl wl-kjv\" data-code=\"H2400\">sinners</span> shall be <span class=\"wl wl-kjv\" data-code=\"H3162\">together,</span> and they that <span class=\"wl wl-kjv\" data-code=\"H5800\">forsake</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall be consumed.","29":"For they shall be <span class=\"wl wl-kjv\" data-code=\"H954\">ashamed</span> of the <span class=\"wl wl-kjv\" data-code=\"H352\">oaks</span> which ye have <span class=\"wl wl-kjv\" data-code=\"H2530\">desired,</span> and ye shall be <span class=\"wl wl-kjv\" data-code=\"H2659\">confounded</span> for the <span class=\"wl wl-kjv\" data-code=\"H1593\">gardens</span> that ye have chosen.","30":"For ye shall be as an <span class=\"wl wl-kjv\" data-code=\"H424\">oak</span> whose <span class=\"wl wl-kjv\" data-code=\"H5929\">leaf</span> <span class=\"wl wl-kjv\" data-code=\"H5034\">fadeth,</span> and as a <span class=\"wl wl-kjv\" data-code=\"H1593\">garden</span> that hath no water.","31":"And the <span class=\"wl wl-kjv\" data-code=\"H2634\">strong</span> shall be as <span class=\"wl wl-kjv\" data-code=\"H5296\">tow,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6467\">maker</span> of it as a <span class=\"wl wl-kjv\" data-code=\"H5213\">spark,</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H8147\">both</span> <span class=\"wl wl-kjv\" data-code=\"H1197\">burn</span> <span class=\"wl wl-kjv\" data-code=\"H3162\">together,</span> and none shall quench"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Het","tekst":"Dat is, hetgeen dat God den profeet Jesaja door een gezicht heeft geopenbaard en bevolen het volk te verkondigen. Doch in dit boek wordt niet gesproken van een, maar van vele en verscheidene gezichten, die de profeet gezien heeft."},{"catchword":"gezicht","tekst":"Van het woord gezicht zie Gen 15:1 ."},{"catchword":"Amoz,","tekst":"Het wordt daarvoor gehouden, dat deze Amoz is geweest de broeder van Uzzia, den koning van Juda."},{"catchword":"Uzzia,","tekst":"Van deze vier koningen is te lezen in het tweede boek der Koningen van het 15e tot het 21e hoofdstuk."}],"2":[{"catchword":"Hoort,","tekst":"Zie Deu 4:26 ; Mic 6:2 ."},{"catchword":"groot gemaakt","tekst":"Of, opgetogen."},{"catchword":"zij hebben","tekst":"Of, zij zijn van mij afgevallen, of zij hebben afvalliglijk tegen mij gehandeld. Zie van de betekenis van het Hebreeuwse woord 1Ki 12:19 ."}],"3":[{"catchword":"Een os","tekst":"De zin is, hoewel een os en ezel van de domste dieren zijn, zo leren zij nochtans dien kennen, die zich dagelijks als voeder voorstelt, en zij betonen hem op hunne wijze enige vriendschap, wanneer hij tot hen in den stal komt, en zij voegen zich naar zijne hand."},{"catchword":"zijn bezitter,","tekst":"Dat is, dengene, wien hij toebehoort en die hem als zijn eigen bezit en opvoedt."},{"catchword":"een ezel","tekst":"De zin is, hoewel een os en ezel van de domste dieren zijn, zo leren zij nochtans dien kennen, die zich dagelijks als voeder voorstelt, en zij betonen hem op hunne wijze enige vriendschap, wanneer hij tot hen in den stal komt, en zij voegen zich naar zijne hand."},{"catchword":"Israël","tekst":"Of, Israël verstaat niet. Die zijnen God niet kent, wordt geacht niets te weten of te kennen. Anders: kent [mij] niet, te weten, zijnen bezitter, eigenaar, Heer, alsof Hij zeide: zij die daar roemen Gods volk te zijn, zijn onvernuftiger en onverstandiger dan het vee."}],"4":[{"catchword":"het zondige","tekst":"Dat is, het volk, dat zich geheellijk tot zondigen heeft overgegeven."},{"catchword":"van zware","tekst":"Hebreeuws, dat zwaar is van ongerechtigheid; dat is, hetwelk zwaarlijk met vele zonden beladen is."},{"catchword":"het zaad","tekst":"Dat is, degenen, die gegenereerd zijn van boosaardige ouders, zijnde derhalve kwaad ei, kwaad kieken; vergelijk Mat 3:7 ."},{"catchword":"de verdervende","tekst":"De zondaars bederven zichzelven, hunnen weg en al wat zij kunnen; zie Gen 6:12 ; Pro 6:32 , enz."},{"catchword":"Heilige Israëls","tekst":"Dat is, den waren God, die zich Israël heeft geopenbaard; gelijk Psa 71:22 ."},{"catchword":"gelasterd,","tekst":"Anders: getergd, veracht."},{"catchword":"zich vervreemd,","tekst":"Te weten, van den Heere; Eze 14:5 ."}],"5":[{"catchword":"Waartoe","tekst":"Alsof God zeide: Het is toch tevergeefs, dat men u veel slaat. Anders: waarop; dat is, op welk deel van het lichaam zal men u meer slaan?"},{"catchword":"hoofd","tekst":"Hebreeuws, het ganse hoofd is in krankheid; dat is, zowel het geestelijke als het wereldlijke bestuur is in een ellendigen en bedroefden staat, en daar is hulp noch raad tot beterschap te vinden."}],"6":[{"catchword":"Van de voetzool","tekst":"Met de woorden van vs.6 wordt verder aangewezen de verdorven staat zo der kerk als der maatschappij bij de Joden. Vergelijk de manier van spreken met Deu 28:35 ; 2Sa 14:25 ; Job 2:7 ."},{"catchword":"aan hetzelve;","tekst":"Te weten lichaam, of volk."},{"catchword":"striemen,","tekst":"Het Hebreeuwse woord betekent zulk een teken, of striem, of lijkstee, als zich het bloed ergens verheft of vertoont vanwege een slag of stoot."},{"catchword":"etterbuilen,","tekst":"Of vochtige plaag, kwetsuur; dat is, verrotte kwetsuren, of zweren die vervuilen, of verzweren, of kwetsuren vol etter."},{"catchword":"uitgedrukt","tekst":"Te weten, alzo, dat er het etter en vuil bloed uitgedrukt en de wonde gezuiverd is."}],"7":[{"catchword":"Uw aardrijk","tekst":"De zin is: Het is geen bouwland gelijkende, maar veel meer een wilde ongebouwde woestijn."},{"catchword":"verteren","tekst":"Dat is, zij eten de vruchten des lands op. Dit is geschied door Hazael, den koning van Syrië, en Joas, den koning van Israël, 2Ki 12 , en 2Ch 25 ."},{"catchword":"de vreemden","tekst":"Hebreeuws, omkering der vreemden; dat is, die door vreemden geschiedt, of zodanig als de vreemde soldaten plachten aan te richten als zij een land innemen en overheersen; zie 2Ch 28:18 ."}],"8":[{"catchword":"de dochter","tekst":"Dat is, Jeruzalem, hetwelk ten dele op den berg Zion gebouwd was, en daaruit scheen te spruiten en voort te komen; zie de aantekening 2Ki 19:21 ."},{"catchword":"is overgebleven","tekst":"Te weten nadat de andere steden door het ganse land verwoest zijn."},{"catchword":"als een hutje","tekst":"Anders: als een schaduwhuisje; te weten waar de bewaarder van den wijngaard onder schuilt. Hij wil zeggen, zij is tot de uiterste ellende gebracht. Zie Job 27:18 ."},{"catchword":"belegerde stad","tekst":"Of, verwoeste, of besloten stad."}],"9":[{"catchword":"een weinig","tekst":"rom. 9:29 staat, een weinig zaads, dit komt daarbij toe, dat in de Griekse overzetting van het Oude Testament [welke de apostelen hier gevolgd hebben] het woord zaad gelezen wordt. De zin komt met het Hebreeuwse wel overeen."},{"catchword":"als Sodom","tekst":"Dat is, wij zouden gans uitgeroeid en tot in den grond toe vernield zijn."}],"10":[{"catchword":"gij oversten","tekst":"Dat is, gij vorsten van Jerzulem, die waarlijk niet beter zijt dan de vorsten, regenten, of leidslieden te Sodom eertijds geweest zijn. Die zijn zonder genade uitgeroeid, maar ulieden geschiedt nog deze genade, dat gij des Heeren woord moogt horen; eilieve, neemt toch deze genade waar. Vergelijk met deze plaats Deu 32:32 ; Eze 16:46 ."},{"catchword":"de wet","tekst":"Dat is, hetgeen ik ulieden uit Gods bevel aandien. Van het woord wet zie Psa 1:2 ."},{"catchword":"gij volk van Gomórra","tekst":"Dat is, gij volk van Juda, die in boosheid den Gomorieten zijt gelijk geworden."}],"11":[{"catchword":"Waartoe","tekst":"Daar staat 1Sa 15:22 ; Gehoorzamen is beter dan slachtoffers, opmerken dan het vette der rammen. De Heere had wel de offeranden ingesteld en bevolen te doen, maar als hulpmiddelen om hen in boetvaardigheid en geloof wel te doen voortgaan; hetwelk, terwijl zij nalieten, zo waren hunne offeranden den Heere een gruwel, onaangezien Hij die had ingesteld."},{"catchword":"der rammen,","tekst":"Te weten der rammen, die geslacht worden ter offerande."}],"12":[{"catchword":"voor Mijn aangezicht","tekst":"Dat is, in den tempel, waar Ik mijne tegenwoordigheid bijzonderlijk openbaar."},{"catchword":"wie heeft zulks","tekst":"Alsof God zeide: Ik heb daar geen behagen aan, dat gijlieden met uwe offeranden in den tempel verschijnt. Namelijk huichelender wijze, zonder geloof, zonder boete of aandacht gelijk gijlieden doet."},{"catchword":"Mijn voorhoven","tekst":"Dat is, de voorhoven van mijn huis, of tempel, die twee waren, een der priesters en een des volks, 2Ch 4:9 ; zodat de profeet hier zowel de priesters als het volk bestraft."}],"13":[{"catchword":"Brengt niet","tekst":"Hebreeuws, vaart niet voort te brengen. Anders: brengt voortaan niet meer spijsoffers der leugens, of der ijdelheid; te weten met welke gij mij niet kunt verzoenen."},{"catchword":"het reukwerk","tekst":"Zie Exo 30 ."},{"catchword":"de nieuwe","tekst":"In het Hebreeuws staan deze woorden in het enkelvoud. De eerste dag der maand was den Heere heilig; Num 28:11 , Num 28:14 ."},{"catchword":"het bijeenroepen","tekst":"Als er boosheid is bij de vergaderingen, zo kan en wil de Heere daar niet bij wezen, want Hij is een vijand van de vergaderingen der boosdoeners; Psa 5:5 . Zijne getrouwheid is in de gemeente der heiligen; Psa 89:6 ."},{"catchword":"de verbodsdagen","tekst":"Zie de aantekening Lev 23:36 ."}],"14":[{"catchword":"Uw nieuwe","tekst":"Dat is, uwe offeranden, die gij ten tijde der nieuwe maanden pleegt te doen."},{"catchword":"haat Mijn ziel,","tekst":"Dat is, [gelijk wij spreken] Ik haat hen van ganser hart en van ganser ziel."},{"catchword":"last;","tekst":"Of, vermoeidheid."},{"catchword":"Ik ben moede","tekst":"Ik kan hen niet lijden, noch verdragen; menselijkerwijze van God gesproken."}],"15":[{"catchword":"uw handen","tekst":"Zie de aantekening 1Ki 8:22 , belangende het uitbreiden der handen in het bidden."},{"catchword":"verberg Ik","tekst":"De Heere wil niet verhoren de gebeden dergenen, die niet van harte gezind zijn zich van alle kwaad te bekeren; zie Psa 66:18 ."},{"catchword":"zijn vol bloed","tekst":"Hebreeuws, zijn vol bloeden; zie de aantekening Gen 4:10 ."}],"16":[{"catchword":"Wast u,","tekst":"Hij ziet op de ceremoniën der wassingen en reinigingen, die in de wet bevolen waren, daaronder mede verstaande de geestelijke wassingen en zuiveringen des harten."}],"17":[{"catchword":"zoekt","tekst":"Dat is, benaarstig u om te weten wat recht en wel gedaan is en doet dat."},{"catchword":"handelt","tekst":"Dat is, verdedigt de zaak der weduwen voor het gericht."}],"18":[{"catchword":"tezamen","tekst":"Dat is, met redenen elkander bewijzen, wie recht of onrecht heeft, en volgens dien wie de oorzaak is van uwe ellende, Ik of uwe zonden?"},{"catchword":"als scharlaken,","tekst":"Deze woorden zien op hetgeen vs.15 gezegd is: Uwe handen zijn vol bloed; zie Gen 38:28 van de scharlaken verf."},{"catchword":"zij zullen wit","tekst":"Dat is, zij zullen u uit genade, om des Messias' wil, volkomenlijk vergeven worden."},{"catchword":"rood","tekst":"Deze woorden zien op hetgeen vs.15 gezegd is: Uwe handen zijn vol bloed; zie Gen 38:28 van de scharlaken verf."},{"catchword":"karmozijn,","tekst":"Of, purper, of vermiljioen; zulk een kleur als de cochenille geeft."}],"19":[{"catchword":"hoort,","tekst":"Dat is, gehoorzaamt; te weten mijne geboden."},{"catchword":"het goede","tekst":"Dat is, het schoonste en het beste van dit land; zie Job 21:13 , Job 21:25 ."}],"20":[{"catchword":"weigert,","tekst":"Te weten mij te horen en gehoorzamen."},{"catchword":"het zwaard","tekst":"Te weten uwer vijanden."},{"catchword":"want de mond","tekst":"Derhalve zal het zekerlijk geschieden."}],"21":[{"catchword":"Hoe is","tekst":"Dit is ene vraag met verwondering."},{"catchword":"de getrouwe","tekst":"Versta Jeruzalem, die eertijds den Heere zo getrouwelijk aangehangen en gediend heeft, te weten ten tijde van David, Salomo, Josafat en andere godzalige koningen."},{"catchword":"een hoer","tekst":"Versta dit van geestelijke hoererij, dat is afgoderij. Zie Lev 17:7 , en Lev 20:5 . Of van vleselijke hoererij, of van beide. Zie Num 15:39 ; Psa 73:27 ; Eze 16:15 , enz."},{"catchword":"herbergde","tekst":"Of, vernachtte."},{"catchword":"nu","tekst":"Te weten, wonen daarin."},{"catchword":"doodslagers","tekst":"Of, moordenaars; dat is, ongerechtige woekeraars, gewelddoeners, onderdrukkers der armen en dergelijken."}],"22":[{"catchword":"Uw zilver","tekst":"De zin is: De eerlijksten en voortreffelijksten onder ulieden zijn veranderd en verbasterd. Of, al wat tevoren rein en klaar was onder ulieden is nu verdorven en verkeerd."}],"23":[{"catchword":"afvalligen,","tekst":"Of, eigenwillig, ongebonden, als een ongebonden koe; Hos 4:16 ."},{"catchword":"een ieder","tekst":"Dat is, zij laten zich met geschenken omkopen om het recht te verdraaien."},{"catchword":"komt voor hen","tekst":"Of, al komt zij voor hunne vierschaar, zij willen haar niet horen, of ze nemen het niet ter harte, zij helpen haar niet tot haar recht; maar veel meer helpen zij haar onderdrukken."}],"24":[{"catchword":"Ik zal Mij","tekst":"Dat is, Ik zal wraak nemen van de Israëlieten, mijne tegenpartijders en vijanden. Anders: Ik zal mij troosten door mijne vijanden. De zin is: Mijne vijanden, de Chaldeën en andere koningen der heidenen, zullen wraak doen en straffen mijn volk Israël, hetwelk dus vijandiglijk tegen mij rebelleert. Zodat troosten hier zoveel zou beduiden als door wraak zich geruststellen. Het is een menselijke wijze van spreken. Zie Deu 28:63 , wat de Heere daar zegt."},{"catchword":"van Mijn vijanden","tekst":"Te weten, de boze Joden, die God daarom zijne vijanden noemt, omdat zij van Hem afgeweken en wederspannig tegen Hem geworden waren. Anders: door mijne vijanden; te weten de Chaldeën, gelijk straks tevoren."}],"25":[{"catchword":"tegen u","tekst":"Te weten om u te tuchtigen, o Jeruzalem. Anders: Ik zal mijne hand tot u wenden om u te zuiveren, enz."},{"catchword":"schuim","tekst":"Aldus noemt God de goddeloze regenten, of de lelijke misdaden des volks, die Hij door den Messias zou uitzuiveren. Zie Mal 3:3 ."},{"catchword":"tin","tekst":"Tin betekent huichelarij, want gelijk tin het zilver zeer gelijk is, alzo schijnt de huichelarij godzaligheid te zijn."}],"26":[{"catchword":"wedergeven,","tekst":"Te weten, nadat Ik u zal getuchtigd en gezuiverd hebben, en versta dat hier gesproken wordt van zodanige rechters of regeerders als Mozes, Jozua, Sameul, David en dergelijke geweest zijn, doch dit is voornamelijk ten tijde van den Messias geschied."},{"catchword":"in het eerste,","tekst":"Of, in den beginne; te weten in het begin uwer republiek, of van dit koninkrijk."},{"catchword":"getrouwe","tekst":"Te weten, uwen God."}],"27":[{"catchword":"Sion","tekst":"Dat is, de Joden, of de stam van Juda, en bij name die van Jeruzalem, wonende op en omtrent den berg Zion."},{"catchword":"door recht","tekst":"Dat is, door de gerechtigheid Gods; dewijl het recht is bij God, verdrukking te vergelden dengenen, die anderen verdrukken; zie 2Th 1:6 ."},{"catchword":"verlost","tekst":"Te weten uit de Babylonische gevangenschap, of van de bovenverhaalde straffen; versta dit wijders van de geestelijke verlossing door Christus, die ook door Gods gerechtigheid geschied is."},{"catchword":"wederkerenden","tekst":"Of, bekeerde; te weten tot God, of wederkerende; te weten uit de Babylonische gevangenschap."},{"catchword":"gerechtigheid","tekst":"Versta hier de gerechtigheid Gods, dat is, zijne waarheid en trouw, dewijl Hij zulks om Christus' wil beloofd heeft, en derhalve billijk is dat Hij het doe."}],"28":[{"catchword":"verbreking","tekst":"Dat is, ellende, gelijk Amo 6:6 ; zie Jer 4:6 ."},{"catchword":"te zamen;","tekst":"Dat is, den een als den ander."},{"catchword":"zullen omkomen","tekst":"Of, verteerd, of opgegeten worden. Dit kan men ook verstaan van de oordelen, die de Messias zal uitvoeren over de ongehoorzamen; Mal 4:1 ."}],"29":[{"catchword":"om der eiken","tekst":"Dat is, vanwege hunne afgoderij, die zij in de bossen onder de eiken en andere grote bomen plachten te bedrijven. Zie Exo 34:13 ; Deu 16:21 ; Jdg 3:7 ."},{"catchword":"gijlieden","tekst":"Dit is een verandering van persoon, die men in de scholen noemt Enallage, voor, die zij begeerd hebben."},{"catchword":"begeerd","tekst":"Of, gewenst hebt; te weten om afgoderij onder dezelve te bedrijven."},{"catchword":"hoven wil,","tekst":"Dat is, hagen en bossen, waar zij afgoderij bedreven, zich niet latende vergenoegen met die plaatsen, die de Heere tot zijn godsdienst had verkoren en geordineerd."}],"30":[{"catchword":"Want","tekst":"Of, wanneer gij zult zijn als een eik."},{"catchword":"als een eik,","tekst":"De zin is: Gij hebt onder de eiken afgoderij bedreven, daarom zal het u ook gaan als de eiken, die verwelken."}],"31":[{"catchword":"de sterke","tekst":"Door de sterken kan men hier verstaan de afgoden, die sterk zijn naar de mening der afgodendienaars, gelijk Amo 2:9 . Of versta hier door de sterken de rijken en machtigen in het land."},{"catchword":"grof vlas,","tekst":"Of, hiede, werk, spijt, snuit; dit is hetgeen uit het vlas gehekeld wordt, hetwelk zeer snellijk van het vuur verteerd wordt."},{"catchword":"werkmeester","tekst":"Dat is, die het beeld gemaakt heeft of, die het heeft laten maken, om het te eren."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"The vision of Isaiah [That is, that which God revealed to the Prophet Isaiah in a vision, and commanded him to preach unto the people. Howbeit in this Book is not spoken of one, but of many and divers Visions, which the Prophet saw. Of the word vision, see Gen.15.on v.1.] the son of Amoz, [it is conceived, that this Amoz was the brother of Uzzia, the King of Juda] which he saw concerning Juda and Jerusalem, in the days of Uzzia, Jotham, Achaz, and Hizkia, the Kings of Juda. [of these four Kings we may read in the second Book of the Kings, from the 15 chap. To the 21.]"}],"2":[{"catchword":null,"tekst":"Hear, ye Heavens, and give ear, thou earth, [See Deut.4.on v.26. Mich.6.on v.2.] for the LORD speaketh, I have made great [or brought up] and exalted children, but they have transgressed against me. [or, they have revolted from me, or they have dealt revoltingly against me. See of the signification of the Hebrew word, 1 Kings 12.v.19.]"}],"3":[{"catchword":null,"tekst":"An Ox knoweth his possessor, [That is, him to whom he belongeth, and who possesseth and breedeth him up as his own] and an ass his masters crib; [the meaning is, although the ox and the ass be of the dullest and bruitest sort of creatures that are, yet they learn to know him that setteth their provender daily before them, and after their manner shew him some kindness and love, when he cometh to them into the stable, and come to his hand] (but) Israel hath no knowledge, my people understandeth not. [or, Israel understandeth not. He that knoweth not his God, is held or esteemed to know nothing. Oth. Knoweth not (me.) to wit, his possessor, owner, Lord and master: As if he had said, those that boast that they are the people of God, they are more brutish and move void of understanding then beasts or bruit creatures.]"}],"4":[{"catchword":null,"tekst":"Wo to the sinful creation, [That is, to the nation that hath wholly given up themselves to commit sin. Compare Psal.78.8. Isa 57:3.] to the people of heavy iniquity, [Heb. That is heavy of iniquity: that is, which is heavily loaden with many sins] to the seed of evil-doers, [that is, to those that are begotten of wicked parents, according to their kind, compare Mat 3:7.] to the corrupting children: [sinners corrupt themselves, their way, and whatsoever they may, see Gen 6:12. Pro 6:32, &c.] they have forsaken the LORD, they have blasphemed [Oth. Provoked to anger, despised] the Holy One of Israel, [that is, the true God, who hath revealed himself unto Israel, as Psal.71.22.] they have estranged themselves [to wit from the Lord, Ezech.14.5.] (going) backward."}],"5":[{"catchword":null,"tekst":"Wherefore should ye be smitten any more? [As if the Lord had said, it is but in vain, that ye should be much smitten. Oth. Whereunto, etc. That is, upon what part of the body should ye be smitten any more?] ye would make the back sliding so much the greater: [see 2 Chron.28.22. Jer 2:30.] the whole head is sick, and the whole heart is faint. [Heb. The whole head is in sickness, that is, both the ecclesiastical and civil government is in nor means to be found, how to have things amended.]"}],"6":[{"catchword":null,"tekst":"From the sole of the foot unto the head there is nothing whole on it, [To wit, the body or people] (but) wounds and stripes, [the Hebrew word signifieth such a mark or stripe, as when the blood riseth up, and appeareth, by reason of some blow or push] and mattery boils, [or, moist wounds, sores; that is, rotten wound or sores, which putrify or fester; or sores full of matter or corruption] (which) have not been pressed out, [to wit, so, as that the matter and corrupt blood hath been pressed out, and the wound cleansed] nor bound up, neither hath any of them been softened with oil. [in the words of this verse is further shewed the corrupt state and condition both of church and Common-wealth, among the Jews. Compare the phrase with Deut.28.35. 2 Sam.14.25. Job 2:7.]"}],"7":[{"catchword":null,"tekst":"Your land is a desolation, [The meaning is, it is not like unto ground fit for tillage, but rather unto a wild unmanured wilderness] your cities are burnt with fire, your land strangers devour it in your presence, [That is, they eat up the fruits of the land. This was done by Hazael King of Syria, and by Joab, King of Israel, 2 Kings 12. And 2 Chron.25.] and there is desolation like an overthrow by strangers. [Heb. Overthrow of strangers, that is, which is done by strangers, or such as strange souldiers use to commit or procure, when they take possession of a Land, and subdue it. See 2 Chron.28.18. Compare, Deut.28.51,52. Isaia. 5.5.]"}],"8":[{"catchword":null,"tekst":"And the daughter of Zion, [That is, Jerusalem, which was partly built upon mount Zion, and seemed to spring and issue thence, see the annotate. 2 Kings 19.21.] is left, [to wit, after that the other cities throughout the whole land were wasted] as a cottage in the vineyard, [oth. As a shady place; to wit, where the keeper of the vineyard sheltereth himself. As if he should say, she is brought to the uttermost misery. See Job 27:18.] as a night-hut in the cucumber-garden, as a besiege City. [or desolate city, or city shut up.]"}],"9":[{"catchword":null,"tekst":"If the LORD of hosts had not left us yet a little remnant; [Rom 9:29. it is a little seed, which is occasioned by this, that in the Greek translation of the Old Testament (which the Apostles here followed) the word seed is read. The me // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

function plaatsPopup(el, html) {

}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;

}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {

  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;

    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
