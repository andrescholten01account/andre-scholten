l":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Hoor naar Mij, u die de gerechtigheid najaagt, u die de HEERE zoekt! Kijk naar de rots waaruit u gehouwen bent, en naar de holte van de bornput waaruit u gegraven bent.","2":"Kijk naar Abraham, uw vader, en naar Sara, die u gebaard heeft; want Ik riep hem, toen hij nog alleen was, en Ik zegende hem, en Ik vermenigvuldigde hem.","3":"Want de HEERE zal Sion troosten, Hij zal al haar woeste plaatsen troosten, en Hij zal haar woestijn maken als Eden, en haar wildernis als de hof van de HEERE; vreugde en blijdschap zal daarin gevonden worden, dankzegging en een stem van het gezang.","4":"Luister naar Mij, Mijn volk! En Mijn lieden, neig naar Mij het oor! Want een wet zal van Mij uitgaan, en Ik zal Mijn recht doen rusten tot een licht van de volken.","5":"Mijn gerechtigheid is nabij, Mijn heil trekt uit, en Mijn armen zullen de volken richten; op Mij zullen de eilanden wachten, en op Mijn arm zullen zij hopen.","6":"Hef uw ogen op naar de hemel, en kijk naar de aarde beneden; want de hemel zal als rook verdwijnen, en de aarde zal als een kleed verouderen, en haar inwoners zullen op dezelfde manier sterven; maar Mijn heil zal in eeuwigheid zijn, Mijn gerechtigheid zal niet verbroken worden.","7":"Hoor naar Mij, u die de gerechtigheid kent, u volk, in wiens hart Mijn wet is! Vrees niet de smaad van de mens, en voor hun smaadredenen hoeft u niet ontzet te zijn.","8":"Want de mot zal ze opeten als een kleed, en het schietwormpje zal ze opeten als wol; maar Mijn gerechtigheid zal in eeuwigheid zijn, en Mijn heil van geslacht tot geslacht.","9":"Ontwaak, ontwaak, trek sterkte aan, Arm van de HEERE! Ontwaak als in de dagen van vroeger, in de geslachten van oude tijden af; bent U het niet, Die Rahab uitgehouwen hebt, Die de zeedraak doorstoken hebt?","10":"Bent U het niet, Die de zee, het water van het grote afgrond, droog gemaakt hebt? Die de diepten van de zee gemaakt hebt tot een weg, opdat de verlosten daardoor gingen?","11":"Zo zullen de vrijgekochte van de HEERE terugkeren, en met gejuich naar Sion komen; en eeuwige blijdschap zal op hun hoofd zijn; vreugde en blijdschap zullen zij aangrijpen, treuring en zuchten zullen wegvluchten.","12":"Ik, Ik ben het, Die u troost; wie bent u, dat u vreest voor de mens, die sterven zal? En voor het kind van een mens, dat hooi worden zal?","13":"En u vergeet de HEERE, Die u gemaakt heeft, Die de hemelen heeft uitgebreid, en de aarde gegrond heeft, en u vreest voortdurend de hele dag, vanwege de grimmigheid van de benauwer, wanneer hij zich bereidt om te verderven? Waar is dan de grimmigheid van de benauwer?","14":"De gevangene die zich omzet, zal haastig los gelaten worden; en hij zal in de kuil niet sterven, en zijn brood zal hem niet ontbreken.","15":"Want Ik ben de HEERE, uw God, Die de zee klieft, zodat haar golven bruisen; HEERE van de heerscharen[1] is Zijn Naam.","16":"En Ik leg Mijn woorden in uw mond, en bedek u onder de schaduw van Mijn hand; om de hemel te planten, en om de aarde te gronden, en om tegen Sion te zeggen: U bent Mijn volk.","17":"Word wakker, word wakker, sta op, Jeruzalem! U die gedronken hebt uit de hand van de HEERE de beker van Zijn grimmigheid; de droesem van de beker van de zwijmeling hebt u gedronken, ja, uitgezogen.","18":"Er is niemand van al de kinderen, die zij gebaard heeft, die haar zachtjes leidt; en niemand van al de kinderen, die zij opgevoed heeft, die haar bij de hand grijpt.","19":"Deze twee dingen zijn u overkomen, wie heeft medelijden met u? Er is verwoesting, en verbreking, en honger, en zwaard, door wie zal Ik u troosten?","20":"Uw kinderen zijn in bezwijming gevallen, zij liggen vooraan op alle straten, als een wilde os in het net; zij zijn vol van de grimmigheid van de HEERE, van de bestraffing van uw God.","21":"Daarom hoor nu dit, u bedrukten! En u dronkenen, maar niet van wijn!","22":"Zo zegt de Heere, de HEERE en uw God, Die de zaak van Zijn volk twisten zal: Zie, Ik neem de beker van de zwijmeling van uw hand, de droesem van de beker van Mijn grimmigheid; u zult die voortaan niet meer drinken.","23":"Maar Ik zal hem, die u bedroefd hebben, in de hand geven, die tegen uw ziel zeiden: Buig u neer, dat wij over u heen gaan; en u legde uw rug neer als aarde, en als een straat van hen die daarover gaan."},"SV":{"1":"Hoort naar Mij, gij, die de gerechtigheid najaagt, gij, die den HEERE zoekt! aanschouwt den rotssteen, *waaruit* gijlieden gehouwen zijt, en de holligheid des bornputs, *waaruit* gij gegraven zijt.","2":"Aanschouwt Abraham, ulieder vader, en Sara, *die* ulieden gebaard heeft; want Ik riep hem, toen hij *nog* alleen was, en Ik zegende hem, en Ik vermenigvuldigde hem.","3":"Want de HEERE zal Sion troosten, Hij zal troosten al haar woeste plaatsen, en Hij zal haar woestijn maken als Eden, en haar wildernis als den hof des HEEREN; vreugde en blijdschap zal daarin gevonden worden, dankzegging en een stem des gezangs.","4":"Luistert naar Mij, Mijn volk! en Mijn lieden, neigt naar Mij het oor! want een wet zal van Mij uitgaan, en Ik zal Mijn recht doen rusten tot een licht der volken.","5":"Mijn gerechtigheid is nabij, Mijn heil trekt uit, en Mijn armen zullen de volken richten; op Mij zullen de eilanden wachten, en op Mijn arm zullen zij hopen.","6":"Heft ulieder ogen op naar den hemel, en aanschouwt de aarde beneden; want de hemel zal als een rook verdwijnen, en de aarde zal als een kleed verouden, en haar inwoners zullen van gelijken sterven; maar Mijn heil zal in eeuwigheid zijn, Mijn gerechtigheid zal niet verbroken worden.","7":"Hoort naar Mij, gijlieden, die de gerechtigheid kent, gij volk, in welks hart Mijn wet is! vreest niet de smaadheid van den mens, en voor hun smaadredenen ontzet u niet.","8":"Want de mot zal ze opeten als een kleed, en het schietwormpje zal ze opeten als wol; maar Mijn gerechtigheid zal in eeuwigheid zijn, en Mijn heil van geslacht tot geslachten.","9":"Ontwaak, ontwaak, trek sterkte aan, Gij arm des HEEREN! ontwaak als in de verledene dagen, *als* *in* de geslachten van ouds; zijt Gij het niet, Die Rahab uitgehouwen hebt, Die den zeedraak verwond hebt?","10":"Zijt Gij het niet, Die de zee, de wateren des groten afgronds, droog gemaakt hebt? Die de diepten der zee gemaakt hebt tot een weg, opdat de verlosten daardoor gingen?","11":"Alzo zullen de vrijgekochten des HEEREN wederkeren, en met gejuich tot Sion komen; en eeuwige blijdschap zal op hun hoofd wezen; vreugde en blijdschap zullen zij aangrijpen, treuring en zuchting zullen wegvlieden.","12":"Ik, Ik ben het, Die u troost; wie zijt gij, dat gij vreest voor den mens, die sterven zal? en voor eens mensen kind, *dat* hooi worden zal?","13":"En vergeet den HEERE, Die u gemaakt heeft, Die de hemelen heeft uitgebreid, en de aarde gegrond heeft, en vreest geduriglijk den gansen dag, vanwege de grimmigheid des benauwers, wanneer hij zich bereidt om te verderven? Waar is dan de grimmigheid des benauwers?","14":"De omzwevende gevangene zal haastelijk los gelaten worden; en hij zal in den kuil niet sterven, en zijn brood zal *hem* niet ontbreken.","15":"Want Ik ben de HEERE, uw God, Die de zee klieft, dat haar golven bruisen; HEERE der heirscharen is Zijn Naam.","16":"En Ik leg Mijn woorden in uw mond, en bedek u onder de schaduw Mijner hand; om den hemel te planten, en om de aarde te gronden, en om te zeggen tot Sion: Gij zijt Mijn volk.","17":"Waak op, waak op, sta op, Jeruzalem! gij, die gedronken hebt van de hand des HEEREN den beker Zijner grimmigheid; den droesem van den beker der zwijmeling hebt gij gedronken, *ja*, uitgezogen.","18":"Er is niemand van al de kinderen, *die* zij gebaard heeft, die haar zachtjes leidt; en niemand van al de kinderen, *die* zij opgevoed heeft, die haar bij de hand grijpt.","19":"Deze twee dingen zijn u wedervaren, wie heeft medelijden met u? Er is verwoesting, en verbreking, en honger, en zwaard, *door* wien zal Ik u troosten?","20":"Uw kinderen zijn in bezwijming gevallen, zij liggen vooraan op alle straten, gelijk een wilde os in het net; zij zijn vol van de grimmigheid des HEEREN, van de schelding uws Gods.","21":"Daarom hoort nu dit, gij bedrukten! en gij dronkenen, maar niet van wijn!","22":"Alzo zegt de Heere, de HEERE en uw God, *Die* Zijns volks zaak twisten zal: Zie, Ik neem den beker der zwijmeling van uw hand, den droesem van den beker Mijner grimmigheid; gij zult dien voortaan niet meer drinken.","23":"Maar Ik zal hem dien, die u bedroefd hebben, in de hand zetten, die tot uw ziel zeiden: Buig u neder, dat wij over *u* gaan; en gij legdet uw rug neder als aarde, en als een straat dergenen, die daarover gaan."},"KJV":{"1":"Hearken to me, ye that follow after righteousness, ye that seek the LORD: look unto the rock *whence* ye are hewn, and to the hole of the pit *whence* ye are digged.","2":"Look unto Abraham your father, and unto Sarah *that* bare you: for I called him alone, and blessed him, and increased","3":"For the LORD shall comfort Zion: he will comfort all her waste places; and he will make her wilderness like Eden, and her desert like the garden of the LORD; joy and gladness shall be found therein, thanksgiving, and the voice of melody.","4":"Hearken unto me, my people; and give ear unto me, O my nation: for a law shall proceed from me, and I will make my judgment to rest for a light of the people.","5":"My righteousness *is* near; my salvation is gone forth, and mine arms shall judge the people; the isles shall wait upon me, and on mine arm shall they trust.","6":"Lift up your eyes to the heavens, and look upon the earth beneath: for the heavens shall vanish away like smoke, and the earth shall wax old like a garment, and they that dwell therein shall die in like manner: but my salvation shall be for ever, and my righteousness shall not be abolished.","7":"Hearken unto me, ye that know righteousness, the people in whose heart *is* my law; fear ye not the reproach of men, neither be ye afraid of their revilings.","8":"For the moth shall eat them up like a garment, and the worm shall eat them like wool: but my righteousness shall be for ever, and my salvation from generation to generation.","9":"Awake, awake, put on strength, O arm of the LORD; awake, as in the ancient days, in the generations of old. *Art* thou not it that hath cut Rahab, *and* wounded the dragon?","10":"*Art* thou not it which hath dried the sea, the waters of the great deep; that hath made the depths of the sea a way for the ransomed to pass over?","11":"Therefore the redeemed of the LORD shall return, and come with singing unto Zion; and everlasting joy *shall be* upon their head: they shall obtain gladness and joy; *and* sorrow and mourning shall flee away.","12":"I, *even* I, *am* he that comforteth you: who *art* thou, that thou shouldest be afraid of a man *that* shall die, and of the son of man *which* shall be made *as* grass;","13":"And forgettest the LORD thy maker, that hath stretched forth the heavens, and laid the foundations of the earth; and hast feared continually every day because of the fury of the oppressor, as if he were ready to destroy? and where *is* the fury of the oppressor?","14":"The captive exile hasteneth that he may be loosed, and that he should not die in the pit, nor that his bread should fail.","15":"But I *am* the LORD thy God, that divided the sea, whose waves roared: The LORD of hosts *is* his name.","16":"And I have put my words in thy mouth, and I have covered thee in the shadow of mine hand, that I may plant the heavens, and lay the foundations of the earth, and say unto Zion, Thou *art* my people.","17":"Awake, awake, stand up, O Jerusalem, which hast drunk at the hand of the LORD the cup of his fury; thou hast drunken the dregs of the cup of trembling, *and* wrung *them* out.","18":"*There is* none to guide her among all the sons *whom* she hath brought forth; neither *is there any* that taketh her by the hand of all the sons *that* she hath brought up.","19":"These two *things* are come unto thee; who shall be sorry for thee? desolation, and destruction, and the famine, and the sword: by whom shall I comfort","20":"Thy sons have fainted, they lie at the head of all the streets, as a wild bull in a net: they are full of the fury of the LORD, the rebuke of thy God.","21":"Therefore hear now this, thou afflicted, and drunken, but not with wine:","22":"Thus saith thy Lord the LORD, and thy God *that* pleadeth the cause of his people, Behold, I have taken out of thine hand the cup of trembling, *even* the dregs of the cup of my fury; thou shalt no more drink it again:","23":"But I will put it into the hand of them that afflict thee; which have said to thy soul, Bow down, that we may go over: and thou hast laid thy body as the ground, and as the street, to them that went over."}},"tsk":{"1":[{"kopje":"Hoor","refs":["Jes 51:4","Jes 51:7","Jes 46:3","Jes 46:4","Jes 48:12","Jes 55:2","Jes 55:3"]},{"kopje":"u die de gerechtigheid najaagt","refs":["Jes 51:7","Ps 94:15","Spr 15:9","Spr 21:21","Matt 5:6","Matt 6:33","Rom 9:30-32","Rom 14:19","Fil 3:13","1 Tim 6:11","2 Tim 2:22","Hebr 12:14"]},{"kopje":"u die de HEERE zoekt","refs":["Jes 45:19","Jes 55:6","Ps 24:6","Ps 105:3","Ps 105:4","Amos 5:6","Zef 2:3"]},{"kopje":"kijk","refs":["Gen 17:15-17","Ef 2:11","Ef 2:12"]}],"2":[{"kopje":"Abraham","refs":["Gen 15:1","Gen 15:2","Gen 18:11-13","Joz 24:3","Rom 4:1-5","Rom 4:16-24"]},{"kopje":"want","refs":["Gen 12:1-3","Gen 13:14-17","Gen 15:4","Gen 15:5","Gen 22:17","Gen 24:1","Gen 24:35","Neh 9:7","Neh 9:8","Ezech 33:24","Gal 3:9-14","Hebr 11:8-12"]}],"3":[{"kopje":"de HEERE","refs":["Jes 51:12","Jes 12:1","Jes 40:1","Jes 40:2" s=\"wl wl-kjv\" data-code=\"H5414\">made</span> as grass;","13":"And <span class=\"wl wl-kjv\" data-code=\"H7911\">forgettest</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H6213\">maker,</span> that hath stretched <span class=\"wl wl-kjv\" data-code=\"H5186\">forth</span> the <span class=\"wl wl-kjv\" data-code=\"H8064\">heavens,</span> and laid the <span class=\"wl wl-kjv\" data-code=\"H3245\">foundations</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth;</span> and hast <span class=\"wl wl-kjv\" data-code=\"H6342\">feared</span> <span class=\"wl wl-kjv\" data-code=\"H8548\">continually</span> every <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">because</span> of the <span class=\"wl wl-kjv\" data-code=\"H2534\">fury</span> of the <span class=\"wl wl-kjv\" data-code=\"H6693\">oppressor,</span> as <span class=\"wl wl-kjv\" data-code=\"H834\">if</span> he were <span class=\"wl wl-kjv\" data-code=\"H3559\">ready</span> to <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy?</span> and where is the <span class=\"wl wl-kjv\" data-code=\"H2534\">fury</span> of the oppressor?","14":"The captive <span class=\"wl wl-kjv\" data-code=\"H6808\">exile</span> <span class=\"wl wl-kjv\" data-code=\"H4116\">hasteneth</span> that he may be <span class=\"wl wl-kjv\" data-code=\"H6605\">loosed,</span> and that he should not <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> in the <span class=\"wl wl-kjv\" data-code=\"H7845\">pit,</span> nor that his <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> should fail.","15":"But I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> that <span class=\"wl wl-kjv\" data-code=\"H7280\">divided</span> the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea,</span> whose <span class=\"wl wl-kjv\" data-code=\"H1530\">waves</span> <span class=\"wl wl-kjv\" data-code=\"H1993\">roared:</span> The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts</span> is his name.","16":"And I have <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> my <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> in thy <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> and I have <span class=\"wl wl-kjv\" data-code=\"H3680\">covered</span> thee in the <span class=\"wl wl-kjv\" data-code=\"H6738\">shadow</span> of mine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> that I may <span class=\"wl wl-kjv\" data-code=\"H5193\">plant</span> the <span class=\"wl wl-kjv\" data-code=\"H8064\">heavens,</span> and lay the <span class=\"wl wl-kjv\" data-code=\"H3245\">foundations</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion,</span> Thou art my people.","17":"<span class=\"wl wl-kjv\" data-code=\"H5782\">Awake,</span> <span class=\"wl wl-kjv\" data-code=\"H5782\">awake,</span> stand <span class=\"wl wl-kjv\" data-code=\"H6965\">up,</span> O <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> which hast <span class=\"wl wl-kjv\" data-code=\"H8354\">drunk</span> at the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> the <span class=\"wl wl-kjv\" data-code=\"H3563\">cup</span> of his <span class=\"wl wl-kjv\" data-code=\"H2534\">fury;</span> thou hast <span class=\"wl wl-kjv\" data-code=\"H8354\">drunken</span> the <span class=\"wl wl-kjv\" data-code=\"H6907\">dregs</span> of the <span class=\"wl wl-kjv\" data-code=\"H3563\">cup</span> of <span class=\"wl wl-kjv\" data-code=\"H8653\">trembling,</span> and wrung them out.","18":"There is none to <span class=\"wl wl-kjv\" data-code=\"H5095\">guide</span> her among -kjv\" data-code=\"H113\">Lord</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> that <span class=\"wl wl-kjv\" data-code=\"H7378\">pleadeth</span> the cause of his <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> Behold, I have taken <span class=\"wl wl-kjv\" data-code=\"H3947\">out</span> of thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> the <span class=\"wl wl-kjv\" data-code=\"H3563\">cup</span> of <span class=\"wl wl-kjv\" data-code=\"H8653\">trembling,</span> even the <span class=\"wl wl-kjv\" data-code=\"H6907\">dregs</span> of the <span class=\"wl wl-kjv\" data-code=\"H3563\">cup</span> of my <span class=\"wl wl-kjv\" data-code=\"H2534\">fury;</span> thou shalt no <span class=\"wl wl-kjv\" data-code=\"H3254\">more</span> drink it again:","23":"But I will <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> it into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of them that <span class=\"wl wl-kjv\" data-code=\"H3013\">afflict</span> thee; which have <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to thy <span class=\"wl wl-kjv\" data-code=\"H5315\">soul,</span> Bow <span class=\"wl wl-kjv\" data-code=\"H7812\">down,</span> that we may go <span class=\"wl wl-kjv\" data-code=\"H5674\">over:</span> and thou hast <span class=\"wl wl-kjv\" data-code=\"H7760\">laid</span> thy <span class=\"wl wl-kjv\" data-code=\"H1460\">body</span> as the <span class=\"wl wl-kjv\" data-code=\"H776\">ground,</span> and as the <span class=\"wl wl-kjv\" data-code=\"H2351\">street,</span> to them that went over."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"naar Mij,","tekst":"Dit zijn de woorden van God tot zijne gemeente, haar troostende in hare droefenis, waarmede zij bevangen was, aanziende het kleine getal der gelovigen."},{"catchword":"den rotssteen,","tekst":"Dat is, Abraham, wiens lichaam van ouderdom verstorven was als hij de belofte ontving, dat hij Izak zou genereren, Rom 4:19 . Zie de aantekening Psa 90:2 ."},{"catchword":"uit gehouwen zijt,","tekst":"Dat is, door mijne sterkte voortgebracht zijt."},{"catchword":"waar gij","tekst":"Versta hier, Sara, die onvruchtbaar was en wier lichaam van ouderdom verstorven was toen zij Izak ontvangen heeft; Rom 4:19 ."}],"2":[{"catchword":"Aanschouwt Abraham,","tekst":"Dit is ene verklaring der naastvoorgaande woorden."},{"catchword":"Ik riep hem,","tekst":"De zin is: Gelijk Ik Abraham en Sara, onaangezien zij beiden stokoud waren, tot een groot volk gemaakt heb; alzo zal Ik ook mijne kerk wonderbaarlijk vermeerderen, onaangezien gij Joden nu een veracht en hard gedrukt volk zijt."},{"catchword":"toen hij nog","tekst":"Of, toen hij [nog] enig was. Hebreeuws, toen hij een was; toen hij nog gene kinderen, ja, geen hoop van kinderen te krijgen had; zie Rom 4:19 ."}],"3":[{"catchword":"Sion troosten,","tekst":"Dat is, zijn volk, de Christelijke kerk; of degenen, die uit de Babylonische gevangenschap zullen wedergekomen zijn."},{"catchword":"troosten al haar","tekst":"Troosten is hier zoveel te zeggen als opbouwen en terechtbrengen, al hare, te weten Zions, woeste plaatsen. Hebreeuws, hare woestheden. De zin is: De Heere zal in plaats van de ongelovige Joden de heidenen roepen; vergelijk Rom 11:11 ; Gal 4:27 ."},{"catchword":"haar woestijn maken","tekst":"Dat is, het kleine getal der gelovige Joden."},{"catchword":"als Eden,","tekst":"Dat is, als de lusthof te Eden, dien men het Paradijs noemt, zie Gen 2:8 ; dat is, de Heere zal in zijne kerk door zijn krachtige beroeping, de uitverkorenen uit de heidenen planten."},{"catchword":"als den hof","tekst":"Dat is, als het paradijs; of versta hier, door den hof des Heeren, een uitermate schonen hof. Het is hetzelfde, dat straks met andere woorden gezegd is."},{"catchword":"daarin gevonden","tekst":"Te weten in de kerk des Heeren."}],"4":[{"catchword":"een wet","tekst":"Of, leer; te weten de leer van het heilig Evangelie; gelijk Isa 2:3 ."},{"catchword":"recht","tekst":"Daarin bestaande, dat allen, die in Christus geloven, gerechtvaardigd worden en vergeving van al hunne zonden verkrijgen. Anderen, mijn recht; dat is, mijne leer, die Ik als een recht mijnen uitverkorenen voorschrijf."},{"catchword":"doen rusten","tekst":"Te weten in mijne kerk, die de kolom en vastigheid der waarheid is; 1Ti 3:15 ."},{"catchword":"tot een licht","tekst":"Dat is, tot dien einde, opdat het de uitverkorenen uit verscheidene volken beschijne, die verlichtende met de zaligmakende kennis Gods. Vergelijk Luk 2:32 ; Act 13:46-47 ."}],"5":[{"catchword":"Mijn gerechtigheid","tekst":"Dat is, mijn genadige verlossing, die Ik mijn volk door hunnen Zaligmaker Jezus Christus, achtervolgens mijne belofte, bewijzen zal."},{"catchword":"Mijn heil","tekst":"Dat is, mijne zaligheid, die Ik mijnen uitverkorenen geven zal, komt tevoorschijn."},{"catchword":"trekt uit,","tekst":"Of zal tevoorschijn komen."},{"catchword":"Mijn armen","tekst":"Dat is, Ik zal de volken door mijn goddelijke kracht tot gehoorzaamheid brengen."},{"catchword":"de eilanden","tekst":"Dat is, de vreemde natiën; zie Isa 41:1 , en Isa 42:4 , en Isa 60:9 ."},{"catchword":"op Mijn arm","tekst":"Dat is, op mijn hulp en bijstand; zie Isa 53:1 ."}],"6":[{"catchword":"de hemel","tekst":"De zin is: Hemel en aarde zullen wel vergaan, maar het Evangelie en de zaligheid van Gods volk zal eeuwiglijk vast zijn. Sommigen nemen het aldus: Ofschoon er zo grote en gruwelijke veranderingen in de wereld komen zullen, alsof de hemel en aarde vergaan zouden, zo zal Ik nochtans mijne kerk bewaren en haar geven wat Ik haar beloofd heb. Vergelijk Psa 102:26 ; Isa 34:4 ."},{"catchword":"van gelijken","tekst":"Te weten gelijk de rook en een kleed vergaan."},{"catchword":"mijn heil . . . mijn gerechtigheid","tekst":"Alzo onder vs.8. Voorts, zijn; dat is, blijven. Zie Psa 37:18 ."},{"catchword":"niet verbroken worden","tekst":"Of, niet bezwijken."}],"7":[{"catchword":"de gerechtigheid","tekst":"Dat is hier te zeggen, de vroomheid en godzaligheid."},{"catchword":"kent,","tekst":"Dat is, liefhebt en uzelven daarmede bezighoudt. Gelijk Psa 1:6 ."},{"catchword":"Mijn wet is","tekst":"Als zijnde de regel en het richtsnoer, naar hetwelk zich de mensen hebben te regelen."},{"catchword":"van den mens,","tekst":"Dat is, die u de mensen aandoen."},{"catchword":"hun smaadredenen","tekst":"Te weten der sterflijke mensen, dat is hier te zeggen der goddelozen, die uwe vijanden zijn."}],"8":[{"catchword":"het schietwormpje","tekst":"Dit is een soort van wormpjes, die in de wol dikwijls zijn."},{"catchword":"als wol;","tekst":"Dat is, als een wollen kleed."},{"catchword":"mijn gerechtigheid . . . mijn heil","tekst":"Gelijk boven vs.6."},{"catchword":"van geslacht","tekst":"Hebreeuws, tot geslacht der geslachten."}],"9":[{"catchword":"Ontwaak, ontwaak,","tekst":"Of, waak op, waak op. Dit spreekt het volk Gods, God biddende dat Hij zijne macht wil bewijzen en hen verlossen, gelijk Hij hunne vaderen eertijds uit Egypte verlost heeft."},{"catchword":"Gij het niet,","tekst":"Gij sterke arm van God."},{"catchword":"Rahab","tekst":"Dat is, Egypte; en versta hier Farao met zijn ganse leger; zie Psa 78:4 , en Psa 89:11 ."},{"catchword":"uitgehouwen hebt,","tekst":"Gelijk men een steen uit een steenrots houwt; dat is hier te zeggen: Uit het getal der levenden met geweld heeft uitgerukt."},{"catchword":"den zeedraak","tekst":"Of, walvis; dat is, den koning Farao. Zie Psa 74:13-14 ; Isa 27:1 ; Eze 29:3 ."},{"catchword":"verwond hebt?","tekst":"Of, smart aangedaan hebt; te weten als Gij hem in de Rode zee geworpen en verdronken hebt; Exo 14:27 ."}],"10":[{"catchword":"gemaakt hebt tot een weg,","tekst":"Hebreeuws, gesteld hebt."},{"catchword":"de verlosten","tekst":"Dat is, de kinderen van Israël, die uit de handen der Egyptenaars verlost waren."}],"11":[{"catchword":"de vrijgekochten","tekst":"Of, gerantsoeneerden; dat is degenen voor wie de Heere het rantsoen betaald en hen alzo verlost heeft. Eenigen verstaan dit van de verlossing uit de Babylonische gevangenschap; anderen uit het geweld van den duivel; sommigen, van beide. Zie Isa 35:10 , daar staan dezelfde woorden, die hier staan."},{"catchword":"zal op hun hoofd","tekst":"Te weten als een schone krans; zie Isa 35:10 ; 2Ti 4:8 ."},{"catchword":"aangrijpen,","tekst":"Of, achterhalen."}],"12":[{"catchword":"Ik, Ik ben het,","tekst":"Hier spreekt de Heere wedeRom."},{"catchword":"u troost;","tekst":"Te weten, o Zion, gij gemeente der gelovigen."},{"catchword":"wie zijt gij,","tekst":"Alsof de Heere zeide: Waarom zijt gij dan zo kleinmoedig, mijn volk? Gij kent gewisselijk de kracht des Heeren niet, die u beschermt, dewijl gij dus vervaard zijt voor de sterflijke mensen."},{"catchword":"sterven zal?","tekst":"Of, sterven moet."},{"catchword":"hooi worden zal?","tekst":"Hebreeuws, [die als] hooi zal gegeven, of gesteld worden; dat is, die afgesneden zal worden en verwelken en verdorren zal gelijk het hooi; zie Isa 40:6 , en 1Pe 1:24 ."}],"13":[{"catchword":"Die u","tekst":"Te weten tot zijn volk, en aanzienlijk; vergelijk Psa 100:3 ."},{"catchword":"des benauwers,","tekst":"Van de boze mensen, van den tiran, van de vervolgers, en ook van den duivel."},{"catchword":"Waar is dan","tekst":"Alsof hij zeide: De vervolgers [zelfs de duivelen] vermogen niet meer tegen u. Dit zal eerst ten jongsten gericht volkomenlijk volbracht worden. Anderen nemen deze woorden aldus, alsof de profeet zeide: Ziet gij nu niet dat al de dreigementen uwe vijanden teniet zijn gegaan? Derhalve hebt gij geen oorzaak gehad om dus bevreesd te zijn."}],"14":[{"catchword":"De omzwevende","tekst":"Anders: die in vreemdheid omher trekt, zal haastelijk verlost worden; te weten zo van de banden der tirannen als van de banden des duivels, dat is, van zonden. Sommigen verstaan dit ook van de verlossing uit de Babylonische gevangenschap."},{"catchword":"in den kuil","tekst":"Dat is, in de Babylonische gevangenschap, of in de groef of put der ellende."},{"catchword":"zijn brood","tekst":"Dat is, zijn nooddruft."}],"15":[{"catchword":"klieft,","tekst":"Of, scheurt, deelt. Anders beweegt, zie Job 26:12 ; Jer 31:35 ."}],"16":[{"catchword":"Ik leg","tekst":"Eenigen menen dat dit tot Christus, [vergelijk Isa 49:2-3 ] anderen dat het tot zijne kerk gesproken wordt."},{"catchword":"bedek","tekst":"Dat is, Ik neem u onder mijne bewaring."},{"catchword":"om den hemel","tekst":"Te weten door de leer, die Ik in uwen mond gelegd heb; dat is om de uitverkorenen te troosten met de hoop van het eeuwige leven, dat zij bezitten en genieten zullen in de nieuwe wereld. Vergelijk hiermede Isa 65:17 , en Isa 66:22 , en 2Pe 3:13 ."},{"catchword":"Sion","tekst":"Dat is, tot de algemene kerk, gelijk vs.3."}],"17":[{"catchword":"Waak op, waak op,","tekst":"Hef uwe ogen op tot God den Heere, en grijp weder een hart, en zet uw vertrouwen op zijn genadige toezegging."},{"catchword":"Jeruzalem","tekst":"O gij volk Gods. Zie Gal 4:26 ; Heb 12:22 ."},{"catchword":"gedronken hebt","tekst":"Dat is, die door de tirannen hard getuchtigd zijt geworden. Zie Job 21:20 . Zie ook de aantekening Psa 60:5 , en Psa 75:9 ; Jer 25:15-16 ."},{"catchword":"van de hand","tekst":"Dat is, dien gij van de hand des Heeren ontvangen hebt."},{"catchword":"den beker zijner","tekst":"Dat is, de straffen, die gij van den toornigen God ontvangen hebt."},{"catchword":"der zwijmeling","tekst":"Zie Psa 60:5 ."},{"catchword":"uitgezogen","tekst":"Hebreeuws, uitgedrukt."}],"18":[{"catchword":"van al de kinderen,","tekst":"Dat is, van al de Joden, die te Jeruzalem geboren en opgetogen zijn. Hier verhaalt de Heere den ellendigen stand zijner kerk, eer Hij dezelve met zijne genade en hulp verschenen en Christus in de wereld gezonden had; alsook den stand derzelve onder de heerschappij van den Antichrist en de wrede vervolging der tirannen. Vergelijk Mat 9:36 , enz.; 2Th 2:11 ; Rev 12:3 ."},{"catchword":"zij gebaard heeft,","tekst":"Te weten de stad Jeruzalem, dat is de gemeente of kerk, of gevangen Joden."},{"catchword":"die haar zachtjes","tekst":"Te weten met recht troostelijke leer. Hier klaagt de Heere over de valse leraars, die de overhand genomen hadden, zo ten tijde van den bedroefden stand der kerk, alsook ten tijde als Christus in het vlees verschenen is, alsook daarna ten tijde van den Antichrist."},{"catchword":"die haar bij de hand grijpt","tekst":"Dat is, die haar hulp en troost bewijst in het geestelijke. Of, die zich onderwindt haar uit de Babylonische gevangenschap te verlossen."}],"19":[{"catchword":"Deze twee dingen","tekst":"Te weten dat gij van de vijanden zijt vervolgd geweest en van uwe regenen geen troost ontvangen hebt, gelijk vs.18 gezegd is; maar anderen menen dat het beter past op hetgeen vs.20 volgt."},{"catchword":"wie","tekst":"Of, wie beklaagt u? dat is, wie troost u? gelijk Job 2:11 ."},{"catchword":"door","tekst":"De zin is, wiens voorbeeld zal ik bijbrengen, waar ik uwe ellende bij vergelijk, u doende zien dat er nog anderen geweest zijn, die zo hardelijk gestraft zijn als gij? Anders: waarmede; anders: door wien zal ik u doen troosten?"}],"20":[{"catchword":"Uw kinderen","tekst":"O Jeruzalem; dat is, uwe inwoners, of uwe burgers."},{"catchword":"zijn in bezwijming","tekst":"Dewijl zij van hunne vijanden zijn terneder geslagen."},{"catchword":"vooraan","tekst":"Hebreeuws, aan het hoofd aller straten; dat is aan den ingang aller straten."},{"catchword":"een wilde os","tekst":"Of, buffel."},{"catchword":"in het net;","tekst":"Hebreeuws, van het net, of des striks; dat is, die in het net verstrikt is, en die derhalve zichzelven niet helpen noch redden kan."},{"catchword":"van de grimmigheid","tekst":"Der straf, die van de grimmigheid des Heeren komt. Dit is de oorzaak van hunne benauwdheid."},{"catchword":"de schelding","tekst":"Dat is, der straf, gelijk boven Isa 50:2 ."}],"21":[{"catchword":"niet van wijn","tekst":"Maar van tegenspoed en ellende; of versta hierbij: maar van den beker der grimmigheid des Heeren, gelijk vs.17."}],"22":[{"catchword":"Die","tekst":"Hebreeuws, die zijn volk twisten zal. De zin is, de Heere zal de zaak van zijn volk aannemen te verdedigen tegen hunne vijanden."},{"catchword":"Ik neem","tekst":"Alsof de Heere zeide: dewijl u niemand helpen kan, zo wil Ik u helpen."}],"23":[{"catchword":"u bedroefd","tekst":"Of, smart aangedaan hebben; anders: die u verdrukt hebben."},{"catchword":"die tot uw ziel","tekst":"Dat is, die u stoutelijk en trotselijk onderdrukt hebben, zoekende u tot de aarde toe te buigen en ten enenmale teniet te maken; figuurlijke manieren van spreken."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Hearken to me ye that pursue after righteousness, ye that seek the Lord: look unto the rock (whence) ye are hewn, and to the hollowness of the well (whence) ye are digged. [These are the words of God unto his Church, comforting her in her grief and heaviness, wherewith she was possessed when she beheld and considered the small number of believers, (look unto the rock) that is, unto Abraham, whose body was promise that he should beget Isaac, Rom 4:19. See Psal.90. the Annotat. On ver.2. (whence ye are hewn,) that is, brought forth by my power, (and to the hollowness of the pit (whence) ye are digged.) Understand here Sarah that was barren, and whose body or stand here Sarah that was barren, and whose body or womb was dead by reason of old age, when she conceived Isaac, Rom 4:19.]"}],"2":[{"catchword":null,"tekst":"Look unto Abraham your father, and unto Sarah (that) here you: [This is an exposition of the words immediately foregoing] for I called him when he was (yet) alone, [or when he was (yet) onely, Heb. When he had no hopes of getting children. See Rom 4:19.] and I blessed him, and I multiplied him. The meaning is, as I made Abraham and Sarah, though they were both old and decrepit, to be a great nation: so will I also wonderfully increase and augment my Church, though the Jews at the present are a contemptible and sore afflicted people.]"}],"3":[{"catchword":null,"tekst":"For the Lord shall comfort Zion, [That is, his people, the Christian Church: or those that shall return out of the Babylonian captivity] he shall comfort all her desolate places, [to comfort here is as much to say as to build up, and to restore; all her, to wit, Zions desolate places. Heb. Her desolations. The meaning is, the Lord shall call the Gentiles instead of the unbelieving Jews. Compare Rom 11:11. Gal 4:27.] etc. he shall make her wilderness [that is, the small number of believing Jews] like Eden, [that is, like the garded of Eden, which is called Paradise. See Gen 8:2. the Lord shall by his efficacious & powerful calling, plant the elect Gentiles in his Church] and her desert like the garden of the Lord; [that is, like Paradise. Or understand here by the garden of the Lord, an exceeding fair garden. It is the same that was said immediately before in other words] joy and gladness shall be found therein, [to wit, in the Church of God] thanksgiving and a voice of singing."}],"4":[{"catchword":null,"tekst":"Hearken unto me, my people, and my men, incline (your) ear unto me: for a law [Or doctrine; to wit, the doctrine of the Gospel, as above chap.2.vers.3.] shall proceed from me, and I will make my judgement [consisting therein, that all that believe in Christ are justified, and obtain pardon of all their sins. Others my judgement; that is, my doctrine, which I prescribe as a law, or judgement, or statute unto my people] to rest [to wit, in my Church which is the pillar and ground of Truth. 1 Tim.3.15.] for a light of the nations, [that is, for that end and purpose that it might shine unto the elect of divers nations, enlightening them with the saving knowledge of God. Compare Luk 2:32. Act.13.46,47.]"}],"5":[{"catchword":null,"tekst":"My righteousness [That is, my gracious redemption, which I will work for my people by their Saviour Jesus Christ, according to my promise] is near, my salvation goeth forth. [or, shall appear. That is, my salvation which I shall give unto mine elect is, my salvation which I shall give unto mine elect is made manifest] and mine arms shall judge the nations: [that is, I will by my divine power bring the nations to obedience] the Isles [that is, the strange, or foreign nations. See above chap.41.1. and 42.4. and 60.9.] shall wait upon me, and on mine arm [that is, on my help and assistance. See below chap.53.1.] shall they hope."}],"6":[{"catchword":null,"tekst":"Lift up your eyes to the heaven, and look upon the earth beneath: for the heaven shall vanish away like smoke, and the earth shall wax old like a garment, and the inhabitants thereof shall die in like manner: [To wit, as smoke and a garment do perish and decay] but my salvation shall be [that is, abide. See Psal.37.on ver.18.] forever. [So below vers.8.etc. my righteousness shall not be broken. [or shall not fail. So below ver.8, etc. The meaning is, heaven and earth shall indeed perish, but the Gospel, and the salvation of the people of God shall abide firm and constant forever. Some take it thus, though such great and horrible changes and alterations shall happen in the world, as if heaven and earth should perish, yet notwithstanding I will keep and preserve my Church, and give here that which I have promised her. Compare Psal.102.27. and above chap.34.4.]"}],"7":[{"catchword":null,"tekst":"Hearken unto me ye that know righteousness, [That is to say here, virtue and godliness (ye that know righteousness,) that is, ye that love it, and employ or busy your selves in it, as Psal.1.6.] the people in whose heart is my Law: [as being the rule and square according to which men are to order and regulate their lives] fear not the reproach of men, [that is, the reproach which is offered you by men. Compare Psal.118.6. below ver.12.] neither he astonished at their reviling&acirc;&euro;&trade;s [to wit, at the reviling&acirc;&euro;&trade;s of mortal men; that is, to say here, of the wicked that are your enemies.]"}],"8":[{"catchword":null,"tekst":"For the moth shall eat them up like a garment [See above chapter 50.9.] and the little worm shall eat them up like wool: [That is, like a woollen cloth or garment. This little worm called in Latina Blatta, is a sort of little worms that are frequently in wool] but my righteousness shall before ever, [as above vers.6.] and my salvation from generation of generations. See above ver.6.]"}],"9":[{"catchword":null,"tekst":"Awake, awake, [Or rise up, rise up] put on strength thou arm of the LORD: awake as in the former days, (as) in the generations of old: [this the people of God speak beseeching God that he would manifest his power, and deliver them as he had formerly delivered their fathers out Egypt, as is further exprest in the following words.] art thou [thou mighty arm of God] not it that hast hewn out Rahab? [as a stone is hewn out of the rock; that is to say here, hast violently plucked up Rahab out from the number of the living. By Rahab is meant Egypt. And understand here Pharaoh with all his host. See Psal.87.4. and 89.11.] that hast wounded the sea-Dragon? [or whale; that is, King Pharaoh. See Psal.73.13,14. Above chap.27.1. Eze 29:3. (that hast wounded etc.) or hast afflicted, grieved and plagued him, to wit, when thou did cast him and drown him in the red sea, Exo 14:21.]"}],"10":[{"catchword":null,"tekst":"Art thou not be that hast dried the sea, the waters of the great deep? That hast made [Heb. Hast set] the depths of the sea for a way that the redeemed [that is, the children of Israel that are redeemed and delivered from the hands of the Egyptians] pass through it?"}],"11":[{"catchword":null,"tekst":"So shall the redeemed of the LORD [Or the ransomed of the Lord; that is, those for whom the Lord hath paid a ransom, and so delivered them. Some understand this of the redemption or deliverance from the Babylonian captivity; others, from the power of the Devil; some of both. See above chap.35.10. where the same words are mentioned that are mentioned here] return and come with shouting unto Zion, and everlasting joy shall be upon their head: [to wit, 10.2. Tim.4.8.] they shall take hold of [or, overtake joy and gladness, sorrow and sighing shall-flee away."}],"12":[{"catchword":null,"tekst":"I, I am be [Heb. The Lord speaketh again] that comfort you,] To wit, O Zion, ye Church of Believers] who art thou that shouldest be afraid of man that shall die? [or, must die. As if the Lord had said, Wherefore then are ye so faint-hearted my people? Surely ye know not the Lords power, that defendeth and protecteth you, seeing ye are so fearful and afraid of mortal men] and of the (child) of man (that) shall be made hay? [Heb. (that) shall be given, or set (as) hay; that is, that shall be cut down, and that shall wither and fade as bay doth. See above chap.40.6. and 1. Pet.1.24.]"}],"13":[{"catchword":null,"tekst":"And forge test the LORD that made thee, [To wit, his people and honourable. Compare Psal.100.vers.3.] that hath spread out the heavens, [See Job 9:8. Psal.104.2. above chap.40.22. and 42.and 44.20.] hath founded the earth? And art afraid continually all the day, because of the fury of the distresser, [of wicked men, of the Tyrant, of the persecution, and also of the devil] when he prepareth himself to destroy: where is then the fury of the distresser? As if he had said, the persecutors [even the devils themselves shall not prevail any more against thee. This shall not be fully accomplished until the day of judgement. Others take these words thus, as if the Prophet had said, Seest thou not how, that all the threatenings of thine enemies are come to nought? Therefore thou hast had no cause to be so sore afraid. Of the word distresser, see the former note.]"}],"14":[{"catchword":null,"tekst":"The wandering captive shall hastily be loosed; [Oth. He that goeth about in exile shall be quickly delivered; to wit, as well from the bands of Tyrants, as from the bands of the devil; that is, from sins. Some understand this also of the deliverance from the Babylonian captivity:] and he shall not die in the pit. [that is, in the Babylonian captivity: or, in the den or pit of misery] neither shall his bread [that is, his necessary food] fail (him.)"}],"15":[{"catchword":null,"tekst":"For I am the LORD thy God, that cleaveth [Or, renteth, divideth. Others moveth. See Job 26:12. Je.31.25.] the sea, (so) that the waves thereof roar, the LORD of Hosts is his Name."}],"16":[{"catchword":null,"tekst":"And I put my words in thy mouth, [Some conceive that this is spoken to Christ; (Compare chap.49.2,3.) Others, that it is spoken to his Church] and cover thee under the shadow of mine hand: [That is, I take thee under my protection] to plant the heaven, and lay the foundation of the earth, [to wit, by the doctrine which I have put in thy mouth. That is, to comfort the elect with the hope of eternal life, which they shall possess and enjoy in the new world. Compare herewith, below chap.65.17. and 66.22. 2 Pet.3.13.] and to say unto Zion, [that is, to the universal Church] thou art my people."}],"17":[{"catchword":null,"tekst":"Awake, awake, stand up, Jerusalem, [O ye people of God. See Gal 4:26. Heb 12:22. As if he had said, lift up your eyes unto God, and take courage, and put your confidence in his gracious promise. Compare below chap.52.1. thou that hast drunk at the hand of the Lord the cup of his fury, [that is, that hast been sorely afflicted and chastened by the means of Tyrants. See Job 21.on ver.20. See Likewise Psal.60. the Annotations on ver.5. and Psa 75:9. Jer 25:15,16. (that hast drunk at the hand of the Lord etc.) that is, the cup which thou hast received at the hand of the Lord. (the cup of his fury) that is, the judgements which thou hast received at the hand of an angry God] thou hast drunken the dregs of the cups of trembling, [See Psal.60.on vers.5.] (yea) sucked (them) out. [Heb. Wring, or crushed (them) out.]"}],"18":[{"catchword":null,"tekst":"There is none of all the children [That is, all the Jews that were born and bred up in Jerusalem] (whom) she [to wit, the City of Jerusalem; that is, the Congregation or Church or captive Jews] hath brought forth, that leadeth her greatly, neither is (there) any of all the children that she hath brought up, that taketh her by the hand, [here the Lord relateth the miserable condition of his Church, before he had appeared unto her with his grace and help, and had sent Christ into the world: as likewise the state and condition of the Church under the dominion of Antichrist and cruel persecution of Tyrants. Compare Mat 9:36, etc. 2 Thes.2.11. Revel.12.3. (there is none of all the children (whom) she hath brought forth that leadeth her gently) to wit, with true comfortable doctrine. Here the LORD complaineth of false teachers, that had gotten the upper hand both in the time of the sad estate of the Church, and in the time when Christ came in the flesh, as also afterward in the time of Antichrist] (neither) is (there) any of all the children that she hath brought up, that taketh her by the hand) that is, that affordeth spiritual help and comfort unto her. Or that undertaketh to deliver her from the Babylonian captivity.]"}],"19":[{"catchword":null,"tekst":"These two things are come unto thee, [To wit, that thou hast been persecuted by enemies, and hast received no comfort at the hand of thy rulers, as is said ver.18. but others are of opinion, that it suiteth better with that which followeth ver.20. Compare above chap.47.9.] who hath compassion on thee? [or who lamenteth thee? [or who lamenteth thee? That is, who comforteth thee? As Job 2:11.] there is desolation, and breaking, and famine, and the sword; (by) whom shall I comfort thee? [the meaning is, whose example shall I alledge to compare thy misery unto? Making it appear unto thee that there have been others that have been as sorely plagued and punished as thy self? Others, wherewith. Others by whom shall I cause thee to be comforted?"}],"20":[{"catchword":null,"tekst":"They children [O Jerusalem, that is, thy inhabitants or thy citizens] are fallen into a swoom, [for as much as they are smitten down by their enemies] they lie before in all the streets; [Heb. At the head of all the streets, that is, at the entry of all the streets] as a wild ox or bullock in the net, [Heb. Of the net, or of the snare, that is, which is snared in the net, and which therefore cannot help nor deliver himself] they are full of the fury of the LORD, [that is, of judgement which proceedeth from the wrath and fury of the Lord. This is the cause of their trouble and misery] of the rebuke of thy God, [that is, of judgement or punishment; as above chap.50.ver.2.]"}],"21":[{"catchword":null,"tekst":"Therefore hear now this, thou afflicted; and thou drunken, but not with wine. [But with adversity and misery. Or understand withal, but with the cup of the Lords fury or indignation, as ver.17.]"}],"22":[{"catchword":null,"tekst":"Thus saith thy Lord, the LORD, and thy God, (who) will plead the cause of his people, [Heb. Who will plead his peoples cause. The meaning is, the LORD will undertake to maintain and defend the cause of his people against their enemies] behold I take the cup of giddiness out of thine hand, the dregs of the cup of my fury, thou shalt henceforth drink it no more. As if the Lord should say, seeing no man is able to help thee, therefore I will help thee.]"}],"23":[{"catchword":null,"tekst":"But I will put it into the hand of them that grieved thee, [Or, caused sorrow unto thee. Others, that afflicted thee] that said unto thy soul, bow down that we may go over (thee): [that is, that boldly and presumptuously oppressed thee, seeking to bow thee down to the very ground, and utterly to destroy thee] and thou didst lay thy back down as the ground, and as a street to them that went over it. [Figurative kind of speeches.]"}]} /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
