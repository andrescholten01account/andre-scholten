l":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Stuur de lammeren van de heerser van het land van Sela af, naar de woestijn heen, naar de berg van de dochter van Sion.","2":"Anders zal het gebeuren, dat de dochters van Moab bij de veren van de Arnon zullen zijn, als een vogel die rondzwerft, uit het nest verjaagd.","3":"Breng raad, houd gericht, maak uw schaduw als de nacht in het midden van de middag; verberg de verdrevenen, en verraad hem die rondzwerft niet.","4":"Laat mijn verdrevenen bij u wonen, o Moab! Wees u hun een schuilplaats voor het aangezicht van de verwoester; want de onderdrukker heeft een einde, de verwoesting is opgehouden, de vertreders zijn van de aarde verdwenen.","5":"Want er zal een troon bevestigd worden in goedertierenheid, en daarop zal iemand betrouwbaar zitten in de tent van David, iemand die oordeelt en het recht zoekt, en vaardig is tot gerechtigheid.","6":"Wij hebben gehoord van de hoogmoed van Moab, hij is zeer hoogmoedig; zijn hoogmoed, en zijn hoogmoed, en zijn woede, zijn niet zoals zijn grootspraak.","7":"Daarom zal Moab over Moab huilen, allemaal zullen zij huilen; over de fundamenten van Kir-hareseth zult u zuchten, zeker, zij zijn gebroken.","8":"Want de velden van Hesbon zijn verdord, ook de wijnstok van Sibma; de heren van de heidenvolken hebben zijn beste planten verpletterd; zij reiken tot Jaezer toe, zij dwaalden door de woestijn; hun scheuten zijn uitgespreid, zij zijn over de zee gegaan.","9":"Daarom beween ik, met de wening over Jaezer, de wijnstok van Sibma; ik maak u doornat met mijn tranen, o Hesbon en Eleale! Want het vreugdegeroep over uw zomervruchten en over uw oogst is verstomd;","10":"zodat de blijdschap en vrolijkheid weggenomen is van het vruchtbare veld, en in de wijngaarden wordt niet gezongen, en er wordt geen gejuich gemaakt; de druiventreder treedt geen wijn uit in de wijnbakken, ik heb het vreugdegeroep doen ophouden.","11":"Daarom rommelt mijn binnenste over Moab, als een harp, en mijn hart over Kir-heres.","12":"En het zal gebeuren, wanneer men zal zien dat Moab moe geworden is op de hoogten, dan zal hij naar zijn heiligdom gaan om te aanbidden, maar hij zal het niet kunnen.","13":"Dit is het woord dat de HEERE tegen Moab gesproken heeft, van toen af.","14":"Maar nu spreekt de HEERE en zegt: Binnen drie jaar (zoals de jaren van het huurling), dan zal de eer van Moab veracht worden, met heel die grote menigte; en het overblijfsel zal klein, weinig, machteloos zijn."},"SV":{"1":"Zendt de lammeren van den heerser des lands van Sela af, naar de woestijn henen, tot den berg der dochter van Sion.","2":"Anderszins zal het geschieden, dat de dochteren van Moab aan de veren van Arnon zullen zijn, als een zwervende vogel, *uit* het nest gedreven zijnde.","3":"Brengt een raad aan, houdt gericht, maakt uw schaduw op het midden van den middag, gelijk van den nacht; verbergt de verdrevenen, *en* meldt den omzwervende niet.","4":"Laat mijn verdrevenen onder u verkeren, o Moab! wees gij hun een schuilplaats voor het aangezicht des verstoorders; want de onderdrukker heeft een einde, de verstoring is te niet geworden, de vertreders zijn van de aarde verdaan.","5":"Want er zal een troon bevestigd worden in goedertierenheid, en op denzelven zal bestendig een zitten in de tent van David, een, die oordeelt en het recht zoekt, en vaardig is ter gerechtigheid.","6":"Wij hebben gehoord de hovaardij van Moab, hij is zeer hovaardig; zijn hoogmoed, en zijn hovaardij, en zijn verbolgenheid, zijn alzo zijn grendelen niet.","7":"Daarom zal Moab over Moab huilen, altemaal zullen zij huilen; over de fondamenten van Kir-hareseth zult gijlieden zuchten, gewisselijk, zij zijn gebroken.","8":"Want de velden van Hesbon zijn verflauwd, *ook* de wijnstok van Sibma, de heren der heidenen hebben zijn uitgelezen planten verpletterd; zij reiken tot Jaezer toe, zij dwalen *door* de woestijn; hun scheuten zijn uitgespreid, zij zijn gegaan over zee.","9":"Daarom beween ik, in de wening over Jaezer, den wijnstok van Sibma, ik maak u doornat met mijn tranen, o Hesbon en Eleale! want het vreugdegeschrei over uw zomervruchten en over uw oogst is gevallen;","10":"Alzo dat de blijdschap en vrolijkheid weggenomen is van het vruchtbare veld, en in de wijngaarden wordt niet gezongen, *noch* enig gejuich gemaakt; de *druiven* treder treedt geen wijn uit in de wijnbakken, ik heb het vreugdegeschrei doen ophouden.","11":"Daarom rommelt mijn ingewand over Moab, als een harp, en mijn binnenste over Kir-heres.","12":"En het zal geschieden, als men zien zal, dat Moab vermoeid is geworden op de hoogten, dan zal hij in zijn heiligdom gaan om te aanbidden, maar hij zal niet vermogen.","13":"Dit is het woord, dat de HEERE tegen Moab gesproken heeft, van toen af.","14":"Maar nu spreekt de HEERE, zeggende: Binnen drie jaren (als de jaren eens huurlings), dan zal de eer van Moab verachtzaam gemaakt worden, met al die grote menigte; en het overblijfsel zal klein, weinig, onmachtig wezen."},"KJV":{"1":"Send ye the lamb to the ruler of the land from Sela to the wilderness, unto the mount of the daughter of Zion.","2":"For it shall be, *that*, as a wandering bird cast out of the nest, *so* the daughters of Moab shall be at the fords of Arnon.","3":"Take counsel, execute judgment; make thy shadow as the night in the midst of the noonday; hide the outcasts; bewray not him that wandereth.","4":"Let mine outcasts dwell with thee, Moab; be thou a covert to them from the face of the spoiler: for the extortioner is at an end, the spoiler ceaseth, the oppressors are consumed out of the land.","5":"And in mercy shall the throne be established: and he shall sit upon it in truth in the tabernacle of David, judging, and seeking judgment, and hasting righteousness.","6":"We have heard of the pride of Moab; *he is* very proud: *even* of his haughtiness, and his pride, and his wrath: *but* his lies","7":"Therefore shall Moab howl for Moab, every one shall howl: for the foundations of Kirhareseth shall ye mourn; surely *they are* stricken.","8":"For the fields of Heshbon languish, *and* the vine of Sibmah: the lords of the heathen have broken down the principal plants thereof, they are come *even* unto Jazer, they wandered *through* the wilderness: her branches are stretched out, they are gone over the sea.","9":"Therefore I will bewail with the weeping of Jazer the vine of Sibmah: I will water thee with my tears, O Heshbon, and Elealeh: for the shouting for thy summer fruits and for thy harvest is fallen.","10":"And gladness is taken away, and joy out of the plentiful field; and in the vineyards there shall be no singing, neither shall there be shouting: the treaders shall tread out no wine in *their* presses; I have made *their vintage* shouting to cease.","11":"Wherefore my bowels shall sound like an harp for Moab, and mine inward parts for Kirharesh.","12":"And it shall come to pass, when it is seen that Moab is weary on the high place, that he shall come to his sanctuary to pray; but he shall not prevail.","13":"This *is* the word that the LORD hath spoken concerning Moab since that time.","14":"But now the LORD hath spoken, saying, Within three years, as the years of an hireling, and the glory of Moab shall be contemned, with all that great multitude; and the remnant *shall be* very small *and* feeble."}},"tsk":{"1":[{"kopje":"de lammeren","refs":["2 Sam 8:2","2 Kon 3:4","Ezra 7:17"]},{"kopje":"van","refs":["2 Kon 14:7"]},{"kopje":"de berg","refs":["Jes 10:32","Micha 4:8"]}],"2":[{"kopje":"als","refs":["Jes 13:14","Spr 27:8"]},{"kopje":"de veren","refs":["Num 21:13-15","Deut 2:36","Deut 3:8","Deut 3:12","Joz 13:16" pan class=\"wl wl-kjv\" data-code=\"H5080\">outcasts;</span> <span class=\"wl wl-kjv\" data-code=\"H1540\">bewray</span> not him that wandereth.","4":"Let mine <span class=\"wl wl-kjv\" data-code=\"H5080\">outcasts</span> <span class=\"wl wl-kjv\" data-code=\"H1481\">dwell</span> with thee, <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab;</span> <span class=\"wl wl-kjv\" data-code=\"H1933\">be</span> thou a <span class=\"wl wl-kjv\" data-code=\"H5643\">covert</span> to them from the <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> of the <span class=\"wl wl-kjv\" data-code=\"H7703\">spoiler:</span> for the <span class=\"wl wl-kjv\" data-code=\"H4160\">extortioner</span> is at an <span class=\"wl wl-kjv\" data-code=\"H656\">end,</span> the <span class=\"wl wl-kjv\" data-code=\"H7701\">spoiler</span> <span class=\"wl wl-kjv\" data-code=\"H3615\">ceaseth,</span> the <span class=\"wl wl-kjv\" data-code=\"H7429\">oppressors</span> are <span class=\"wl wl-kjv\" data-code=\"H8552\">consumed</span> out of the land.","5":"And in <span class=\"wl wl-kjv\" data-code=\"H2617\">mercy</span> shall the <span class=\"wl wl-kjv\" data-code=\"H3678\">throne</span> be <span class=\"wl wl-kjv\" data-code=\"H3559\">established:</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H3427\">sit</span> upon it in <span class=\"wl wl-kjv\" data-code=\"H571\">truth</span> in the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> <span class=\"wl wl-kjv\" data-code=\"H8199\">judging,</span> and <span class=\"wl wl-kjv\" data-code=\"H1875\">seeking</span> <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment,</span> and <span class=\"wl wl-kjv\" data-code=\"H4106\">hasting</span> righteousness.","6":"We have <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> of the <span class=\"wl wl-kjv\" data-code=\"H1347\">pride</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab;</span> he is <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H1341\">proud:</span> even of his <span class=\"wl wl-kjv\" data-code=\"H1346\">haughtiness,</span> and his <span class=\"wl wl-kjv\" data-code=\"H1347\">pride,</span> and his <span class=\"wl wl-kjv\" data-code=\"H5678\">wrath:</span> but his lies","7":"Therefore shall <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> <span class=\"wl wl-kjv\" data-code=\"H3213\">howl</span> for <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab,</span> every one shall <span class=\"wl wl-kjv\" data-code=\"H3213\">howl:</span> for the <span class=\"wl wl-kjv\" data-code=\"H808\">foundations</span> of <span class=\"wl wl-kjv\" data-code=\"H7025\">Kirhareseth</span> shall ye <span class=\"wl wl-kjv\" data-code=\"H1897\">mourn;</span> surely they are stricken.","8":"For the <span class=\"wl wl-kjv\" data-code=\"H7709\">fields</span> of <span class=\"wl wl-kjv\" data-code=\"H2809\">Heshbon</span> <span class=\"wl wl-kjv\" data-code=\"H535\">languish,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1612\">vine</span> of <span class=\"wl wl-kjv\" data-code=\"H7643\">Sibmah:</span> the <span class=\"wl wl-kjv\" data-code=\"H1167\">lords</span> of the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen</span> have broken <span class=\"wl wl-kjv\" data-code=\"H1986\">down</span> the principal <span class=\"wl wl-kjv\" data-code=\"H8291\">plants</span> thereof, they are <span class=\"wl wl-kjv\" data-code=\"H5060\">come</span> even unto <span class=\"wl wl-kjv\" data-code=\"H3270\">Jazer,</span> they <span class=\"wl wl-kjv\" data-code=\"H8582\">wandered</span> through the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness:</span> her <span class=\"wl wl-kjv\" data-code=\"H7976\">branches</span> are stretched <span class=\"wl wl-kjv\" data-code=\"H5203\">out,</span> they are gone <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> the sea.","9":"Therefore I will <span class=\"wl wl-kjv\" data-code=\"H1058\">bewail</span> with the <span class=\"wl wl-kjv\" data-code=\"H1065\">weeping</span> of <span class=\"wl wl-kjv\" data-code=\"H3270\">Jazer</span> the <span class=\"wl wl-kjv\" data-code=\"H1612\">vine</span> of <span class=\"wl wl-kjv\" data-code=\"H7643\">Sibmah:</span> I will <span class=\"wl wl-kjv\" data-code=\"H7301\">water</span> thee with my <span class=\"wl wl-kjv\" data-code=\"H1832\">tears,</span> O <span class=\"wl wl-kjv\" data-code=\"H2809\">Heshbon,</span> and <span class=\"wl wl-kjv\" data-code=\"H500\">Elealeh:</span> for the <span class=\"wl wl-kjv\" data-code=\"H1959\">shouting</span> for thy summer <span class=\"wl wl-kjv\" data-code=\"H7019\">fruits</span> and for thy <span class=\"wl wl-kjv\" data-code=\"H7105\">harvest</span> is fallen.","10":"And <span class=\"wl wl-kjv\" data-code=\"H8057\">gladness</span> is taken <span class=\"wl wl-kjv\" data-code=\"H622\">away,</span> and <span class=\"wl wl-kjv\" data-code=\"H1524\">joy</span> out of the plentiful <span class=\"wl wl-kjv\" data-code=\"H3759\">field;</span> and in the <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyards</span> there shall be no <span class=\"wl wl-kjv\" data-code=\"H7442\">singing,</span> neither shall there be <span class=\"wl wl-kjv\" data-code=\"H7321\">shouting:</span> the <span class=\"wl wl-kjv\" data-code=\"H1869\">treaders</span> shall tread <span class=\"wl wl-kjv\" data-code=\"H1869\">out</span> no <span class=\"wl wl-kjv\" data-code=\"H3196\">wine</span> in their <span class=\"wl wl-kjv\" data-code=\"H3342\">presses;</span> I have made their vintage <span class=\"wl wl-kjv\" data-code=\"H1959\">shouting</span> to cease.","11":"Wherefore my <span class=\"wl wl-kjv\" data-code=\"H4578\">bowels</span> shall <span class=\"wl wl-kjv\" data-code=\"H1993\">sound</span> like an <span class=\"wl wl-kjv\" data-code=\"H3658\">harp</span> for <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab,</span> and mine inward <span class=\"wl wl-kjv\" data-code=\"H7130\">parts</span> for Kirharesh.","12":"And it shall come to pass, when it is <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> that <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> is <span class=\"wl wl-kjv\" data-code=\"H3811\">weary</span> on the high <span class=\"wl wl-kjv\" data-code=\"H1116\">place,</span> that he shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to his <span class=\"wl wl-kjv\" data-code=\"H4720\">sanctuary</span> to <span class=\"wl wl-kjv\" data-code=\"H6419\">pray;</span> but he shall not prevail.","13":"This is the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> concerning <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> since that time.","14":"But now the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Within <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years,</span> as the <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> of an <span class=\"wl wl-kjv\" data-code=\"H7916\">hireling,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> shall be <span class=\"wl wl-kjv\" data-code=\"H7034\">contemned,</span> with all that <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude;</span> and the <span class=\"wl wl-kjv\" data-code=\"H7605\">remnant</span> shall be <span class=\"wl wl-kjv\" data-code=\"H4592\">very</span> <span class=\"wl wl-kjv\" data-code=\"H4213\">small</span> and <span class=\"wl wl-kjv\" data-code=\"H3808\">feeble.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Zendt","tekst":"O gij Moabieten."},{"catchword":"de lammeren","tekst":"Hebreeuws, het lam, dat is, zoveel lammeren als gij tot schatting te geven schuldig zijt. De Moabieten betaalden aan den koning van Juda jaarlijks honderd duizend lammeren en honderd duizend rammen met de wol, gelijk af te nemen is uit 2Sa 8:2 , vergeleken met 2Ki 3:4 ."},{"catchword":"heerser","tekst":"Te weten van den koning van Juda, die een heer of heerser over uw land is geworden, van dien tijd af toen David u heeft overwonnen; 2Sa 8:2 . Anders: des heerschappers van het aardrijk, verstaande daarbij God den Heere, in dezen zin, alsof hij de Moabieten vermaande dat zij den waren God zouden aannemen, zulks doende blijken met hem lammeren op te offeren."},{"catchword":"Sela af,","tekst":"Dat is, van uw land af, hetwelk ten dele met klippen en rotsen is bezet, ten dele met de woestijn. Sela was de hoofdstad, op een rots gelegen."},{"catchword":"naar de woestijn","tekst":"Hier kan men verstaan die woestijn van Juda, die daar is strekkende tot aan de Jordaan, waar die rivier in de Dode zee valt."},{"catchword":"tot den berg","tekst":"Dat is, tot Jeruzalem, hetwelk aan den berg Zion ligt."}],"2":[{"catchword":"Anderszins","tekst":"De zin is: Indien gijlieden dat niet doet, namelijk: Indien gij, Moabieten, den huize Davids niet gehoorzaamt, zo zal het geschieden, enz. Anders: want het zal geschieden."},{"catchword":"de dochteren","tekst":"Dat is, de Moabietische vrouwen, getrouwde en ongetrouwde, gelijk Luk 23:28 ; daar staat: Gij dochteren Jeruzalems; waaronder verstaan zijn zowel gehuwde als de ongehuwde. Anderen verstaan hier door de dochteren de kleine steden van het Moabietische land."},{"catchword":"Arnon","tekst":"Arnon was het uiterste van der Moabieten land. Zodat als de profeet hier dreigt dat de dochteren Moabs aan de veren van Arnon zouden gebracht en overgevoerd worden, dat is te zeggen dat zij zouden verjaagd, of gevankelijk uit hun land zouden gevoerd worden."},{"catchword":"als een zwervende vogel,","tekst":"Dat is, als een vogel die heen en weer vliegt. Alzo zullen de dochteren der Moabieten uit haar nest, dat is uit haar vaderland en uit hare huizen en welvaart gedreven worden."}],"3":[{"catchword":"Brengt","tekst":"Te weten, hoe gij het aanstaande ongeluk zult kunnen ontlopen."},{"catchword":"houdt gericht,","tekst":"Hier raadt de profeet den Moabieten dat zij oprecht handelen zouden, inzonderheid met de arme verdreven Joden, met dezen niet handelende gelijk eertijds hunne voorouders gedaan hadden; Deu 23 ; Jer 48 ."},{"catchword":"maakt uw schaduw","tekst":"Dat is, maakt dat uwe schaduw, dat is de verkwikking die zij van ulieden verzoeken, hen zo verkwikt in hun grootste vervolging, als de schaduw of duisternis van den nacht in den heten zomertijd de mensen verkwikt."},{"catchword":"verbergt","tekst":"Hier spreekt de profeet duidelijk uit hetgeen hij straks met verbloemde woorden gezegd heeft."},{"catchword":"de verdrevenen,","tekst":"Te weten de Joden, die uit hun land verdreven zijn."},{"catchword":"meldt","tekst":"Dat is, verraadt hen niet, geeft hen niet over in de handen hunner vijanden, gelijk gij wel pleegt te doen."},{"catchword":"den omzwervende","tekst":"Dat is, de Joden, die hunne toevlucht tot u nemen."}],"4":[{"catchword":"Laat","tekst":"Dit spreekt God de Heere."},{"catchword":"mijn verdrevenen","tekst":"Dat is, die mij toebehoren, alhoewel Ik hen, om hunner zonden wil, nu een geruimen tijd dapperlijk gekastijd heb. Aangaande de manier van spreken, zie Psa 37:22 ."},{"catchword":"onder u","tekst":"Hebreeuws, in u; dat is, bij u, in het Moabietische land."},{"catchword":"wees gij hun","tekst":"Dat is, oefent medelijden en barmhartigheid over de Israëlieten, laat hen herberg bij u vinden."},{"catchword":"des verstoorders;","tekst":"Dat is, van den Assyriër, die de Joden en andere natiën zeer vervolgd en jammerlijk geplaagd heeft."},{"catchword":"heeft een einde,","tekst":"Of, zal haast een einde hebben, en zo in het volgende. Alsof de Heere zeide: Gij, Moabieten, behoort u beleefd jegens mijn volk te gedragen, want het zal niet altoos onderdrukt worden van zijne vijanden; Ik zal het eindelijk redden en het koninkrijk van Juda alzo herstellen, dat het gelegenheid en macht zal hebben om ulieden te vergelden de weldaden, die zij van uwe hand ontvangen zullen; daar zij ulieden integendeel zullen kunnen vergelden de schade en onbarmhartigheid, die gij hun zult bewijzen."},{"catchword":"de vertreders","tekst":"Hebreeuws, de vertreder; dat is alle en een iegelijk vertreder, dat is verdrukker mijns volks."},{"catchword":"zijn van de aarde","tekst":"Dat is, zullen, enz."}],"5":[{"catchword":"een troon","tekst":"Dat is, een koninkrijk of koninklijke waardigheid."},{"catchword":"bevestigd","tekst":"Of, bereid worden."},{"catchword":"in goedertierenheid,","tekst":"Te weten, door de goedertierenheid van God. Anders, in genade."},{"catchword":"bestendig","tekst":"Hebreeuws, in waarheid; dat is, stijf en vast."},{"catchword":"in de tent van David,","tekst":"Dat is, een van het geslacht van David, te weten Christus. Hij alleen bezit bestendiglijk den stoel Davids, want Hij heeft een eeuwig koninkrijk."},{"catchword":"vaardig","tekst":"Dat is, haastelijk gevende wat recht is, hetzij den goeden of den kwaden. Anders: in het recht wel ervaren; gelijk Ezr 7:6 . Zo de profeet in vs.5 wederom de Moabieten vermaant, dat zij zich over de verdreven Joden ontfermen zouden; dewijl hun vervallen koninkrijk wederom zou opgericht worden, en in der eeuwigheid bestendig blijven zou."}],"6":[{"catchword":"Wij hebben","tekst":"Te weten, God de Vader, Zoon en Heilige Geest. Sommigen verstaan den profeet en Joden en andere omliggende natiën. Eenigen voegen hier het woordje maar bij, aldus: [Maar] wij hebben gehoord, enz., alsof hij zeide: Dit voorverhaalde vereist wel God van de Moabieten, en zij waren het wel schuldig te doen; ook zou het hun voordelig zijn. Maar zij zijn zo hovaardig, dat zij geen goeden raad, dien anderen hun geven, willen volgen."},{"catchword":"Moab,","tekst":"Dat is, der Moabieten."},{"catchword":"zijn alzo","tekst":"Dat is tevergeefs, nochtans verlaat hij zich op hen, als op grendelen of handbomen. Anders: [Maar] zijne leugens [doen het] zo niet."}],"7":[{"catchword":"Daarom","tekst":"Te weten vanwege den gruwelijken inval der Assyriërs, gelijk af te nemen is uit vs.14."},{"catchword":"Moab over Moab","tekst":"Dat is, de ene Moabiet over den anderen; te weten, de levende zo over de doden als over de levenden."},{"catchword":"fondamenten","tekst":"Anders: flessen, van deze plaats, zie boven Isa 15:1 ."},{"catchword":"zuchten,","tekst":"Anders, rouw dragen. Anders, murmelen, binnensmonds spreken."},{"catchword":"zij zijn gebroken","tekst":"Of, zij zullen gebroken worden, of gebroken zijnde; dit nemen sommigen op de fondamenten, sommigen op de zuchtende lieden."}],"8":[{"catchword":"Want","tekst":"Hier wijst de profeet nu breder aan de oorzaak van het wenen der Moabieten, en hij spreekt hier, gelijk elders meer, alsof alrede geschied ware hetgeen nog geschieden zou."},{"catchword":"de velden","tekst":"Gelijk 2Ki 23:4 . Anders: wijnstokken."},{"catchword":"Hesbon","tekst":"Zie Jos 13:17 ."},{"catchword":"zijn verflauwd,","tekst":"Anders: zullen verflauwen, of verzwakken; dat is, verwelken."},{"catchword":"Sibma,","tekst":"Van Sibma wordt ook melding gemaakt Num 32:38 ; Jos 13:19 ."},{"catchword":"de heren","tekst":"Dat is, de vorsten der Assyriërs."},{"catchword":"zij","tekst":"Te weten die wijnstokken."},{"catchword":"reiken tot","tekst":"Zie Jer 48:32 ."},{"catchword":"de woestijn;","tekst":"Versta hier de woestijn aan de Jordaan, gelijk vs.1."},{"catchword":"scheuten","tekst":"Of scheutelingen, of ranken."},{"catchword":"gegaan over zee","tekst":"Versta, de zee bij Jaezer, gelijk blijkt Jer 48:32 ."}],"9":[{"catchword":"Daarom","tekst":"Anders: daarom beween ik het geween Jaezers; [dat is, het jammer, hetwelk die stad zal doen wenen], den wijnstok van Sibma. Alsof hij zeide: Ik heb zulk een schrik van de verwoesting van Sibma, dat zo wanneer mij dezelve in den zin komt, zo beweegt zij mij tot schreien, alzo wel als ik doe over Jaezer, Hesbon en Eleale. Zie boven Isa 15:5 , onder Isa 21:3 ."},{"catchword":"ik maak u","tekst":"Of, ik bedauw, begiet, bespreng, bespuit u."},{"catchword":"is gevallen;","tekst":"Dat is, heeft een einde. In den oogst pleegt men vreugdeliedjes te zingen, die hoort men nu niet meer, wil de profeet zeggen; zie Jer 25:30 ."}],"10":[{"catchword":"weggenomen","tekst":"Hebreeuws, verzameld is; Psa 26:9 ."},{"catchword":"van het vruchtbare veld,","tekst":"Anders: van Karmel, hetwelk is de naam van een vruchtbaren berg en streek; zie 2Ki 19:23 , en wijders 1Sa 25:2 ."},{"catchword":"de druiven treder","tekst":"Zie de aantekening Jer 25:30 ."},{"catchword":"geen wijn","tekst":"Dat is, hij treedt geen druiven daar men den wijn uitperst."},{"catchword":"in de wijnbakken,","tekst":"Of, in de kuipen."},{"catchword":"ik heb","tekst":"Dit spreekt God de Heere."},{"catchword":"het vreugdegeschrei","tekst":"Of, lofliedjes; gelijk Jdg 9:27 ."}],"11":[{"catchword":"Daarom","tekst":"Dit spreekt de profeet."},{"catchword":"rommelt","tekst":"Te weten van treurigheid."},{"catchword":"over Moab,","tekst":"Dat is, vanwege die ellende, die Moab overkomt; zie de aantekening Isa 15:5 ."},{"catchword":"als een harp,","tekst":"Te weten wanneer men derzelver snaren roert met den vinger."},{"catchword":"mijn binnenste","tekst":"Dat is, mijn hart."},{"catchword":"over","tekst":"Te weten, omdat die schone stad zo jammerlijk verwoest en geruïneerd is."},{"catchword":"Kir-heres","tekst":"Anders ook genaamd Kir en Kir hareseth . Zie boven Isa 15:1 , en hier boven vs.7."}],"12":[{"catchword":"vermoeid","tekst":"Te weten van zijne goden aan te roepen en hun offeranden te doen, hulp verzoekende tegen zijne vijanden."},{"catchword":"op de hoogten,","tekst":"Op de hoogten hadden de Moabieten en andere afgodendienaars hunne altaren."},{"catchword":"hij","tekst":"Te weten Moab, dat is de Moabieten."},{"catchword":"in zijn heiligdom","tekst":"Te weten in den tempel van zijnen afgod Chamos; Num 21:29 ; 1Ki 11:7 . Hopende dat, ofschoon die andere goden hem niet geholpen hadden, Chamos immers hem zou horen en uit den nood helpen."},{"catchword":"hij zal niet","tekst":"Te weten Chamos zal hem niet kunnen helpen, of hij [te weten Moab] zal niets vermogen, of niets kunnen uitrichten, alzo weinig als hij op de hoogten uitgericht of afgebeden en verkregen had."}],"13":[{"catchword":"van toen af","tekst":"Te weten, van dien tijd af dat zij den koning van Juda zijn onderworpen geweest; zie 2Sa 8:2 . Of, van den tijd af der openbaring dezer profetie."}],"14":[{"catchword":"nu spreekt","tekst":"Te weten nu zij alle vermaningen en dreigementen der profeten verachten."},{"catchword":"Binnen","tekst":"Of, over drie jaren, of na den uitgang van drie jaren; te weten in het vierde jaar van den koning Hizkia, want de profeet heeft dit gesproken in het eerste jaar der regering van dezen koning, gelijk te zien is boven Isa 14:28 , waar deze predikatie begint. De volbrenging derzelve zie 2Ki 18:9 , alwaar geschreven staat dat Salmanassar tegen Samaria getogen is in het vierde jaar van Hizkia; waaruit af te nemen is dat hij in het doorreizen de Moabieten heeft bedwongen, waarvan hier in dezen tekst gesproken wordt. Maar dit is maar een begin van hun jammer en verderf geweest, hetwelk een geruimen tijd hierna volkomenlijker geschied is, gelijk lang na den profeet Jesaja hun de profeet Jeremia zulks voorzegd heeft; Jer 48 ."},{"catchword":"als de jaren","tekst":"Dat is, wel geteld en nauw gerekend. Men geeft een gehuurden knecht zijn bedongen loon als zijn tijd om is, niet eer en ook niet later; vergelijk Isa 21:16 ."},{"catchword":"met al die grote","tekst":"Anders: met al dien groten rijkdom, of overvloed; zie Psa 37:16 ; Ecc 5:9 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Send [O ye Moabites] the lambs of the ruler of the land, [Hebr. The lamb, etc. That is, as many Lambs as ye are bound to give or pay for tribute. The Moabites paid unto the King of Juda yearly an hundred thousand lambs, and an hundred thousand rams with the wool, as may be gathered from 2 Sam.8.3. compared with 2 Kings 3.4. (of the ruler of the land) To wit, of the King of Juda, who is become a Lord or ruler over your land, since the time that David conquered you, 2 Sam.8.2. Oth. Of the ruler of the earth; understanding thereby God in this sense, as if he exhorted the Moabites to receive and imbrace the true God, making it appear by offering of lambs in sacrifice unto him] from Sela to the wilderness. [that is, from your country, which is beset partly with clifts and rocks, and partly with the wilderness. Sela was the chief city lying upon a rock. (to the wilderness) Here may be understood the wilderness of Juda, which reacheth thence unto the Jordan, where that river falleth into the dead sea] unto the mount of the daughter of Zion. [That is, unto Jerusalem, which lieth on Mount Zion.]"}],"2":[{"catchword":null,"tekst":"Otherwise it shall come to pass, [The meaning is, if ye do it not, namely, if the Moabites obey not the house of David, then it shall come to pass, &c. Oth. For it shall come to pass] that the daughters of Moab [that is, the Moabitish women-kind, both married and unmarried, as Luk 23:28. it is said there; Ye daughters of Jerusalem, under which name are to be meant as well those that were not married, as those that were married. Others understand here by daughters, the small towns or cities of the Land of Moab] shall be at the ferries of Arnon, [Arnon was the outermost border of the land of the Moabites. So that when the Prophet here threateneth, that the daughters of Moab should be brought to the ferries Arnon, and be carried over, he intimateth thereby, that they should be chased or carried away captive out of their own land] as a wandering bird being driven (out of) the nest. [that is, /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers) => {
    const afk = REFBOEK2AFK[boek];
    return afk ? `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${heel}</a>` : heel;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
