:"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Wee het land dat schaduwachtig is aan de grenzen, dat aan de kant van de rivieren van Morenland ligt;","2":"Dat gezanten stuurt over de zee, in schepen van biezen op het water! Ga heen, u snelle boden! Naar een volk dat lang en glad is, naar een volk dat gevreesd is van oudsher tot nu; een volk van regel en regel, en van vertreding, welks land de rivieren beroven.","3":"Allen, u bewoners van de wereld en u inwoners van de aarde! Als men de banier zal oprichten op de bergen, zult u het zien, en als de bazuin zal blazen, zult u het horen.","4":"Want zo heeft de HEERE tegen mij gezegd: Ik zal stil zijn en toezien vanuit Mijn woning, als de glinsterende hitte op de regen[1], als een wolk van het dauw in de hitte van de oogst;","5":"Want vóór de oogst, als de bloesem volkomen is, en de onrijpe druif rijp wordt na de bloei, zo zal Hij de ranken met snoeimessen afsnijden, en de takken wegdoen en afkappen.","6":"Zij zullen samen overgelaten worden aan de roofvogels van de bergen, en aan de dieren van de aarde; en de roofvogels zullen op hen overzomeren, en alle dieren van de aarde zullen daarop overwinteren.","7":"In die tijd zal de HEERE van de heerscharen[2] een geschenk gebracht worden van het volk dat lang en glad is, en van het volk dat gevreesd is van oudsher tot nu; een volk van regel en regel, en van vertreding, welks land de rivieren beroven; naar de plaats van de Naam van de HEERE van de heerscharen, naar de berg Sion."},"SV":{"1":"Wee het land, dat schaduwachtig is aan de frontieren, dat aan de zijde der rivieren van Morenland is;","2":"Dat gezanten zendt over de zee, en in schepen van biezen op de wateren! Gaat henen, gij snelle boden! tot een volk, dat getrokken is en geplukt, tot een volk, dat vreselijk is van dat het was en voortaan; een volk van regel en regel, en van vertreding, welks land de rivieren beroven.","3":"Allen gij ingezetenen der wereld, en gij inwoners der aarde! als men de banier zal oprichten *op* de bergen, zult gijlieden *het* zien, en als de bazuin zal blazen, zult gijlieden *het* horen.","4":"Want alzo heeft de HEERE tot mij gezegd: Ik zal stil zijn, en zien in Mijn woning, als de glinsterende hitte op den regen, als een wolk des dauws in de hitte des oogstes;","5":"Want voor den oogst, als de botte volkomen is, en de onrijpe druif rijp wordt *na* den bloesem, zo zal Hij de ranken met snoeimessen afsnijden, en de takken wegdoen *en* afkappen.","6":"Zij zullen te zamen gelaten worden den roofvogelen der bergen, en den dieren der aarde; en de roofvogelen zullen op hen overzomeren, en alle dieren der aarde zullen daarop overwinteren.","7":"Te dien tijd zal den HEERE der heirscharen een geschenk gebracht worden *van* het volk, dat getrokken is en geplukt, en van het volk, dat vreselijk is van dat het was en voortaan; een volk van regel *en* regel, en van vertreding, welks land de rivieren beroven; tot de plaats van den Naam des HEEREN der heirscharen, tot den berg Sion."},"KJV":{"1":"Woe to the land shadowing with wings, which *is* beyond the rivers of Ethiopia:","2":"That sendeth ambassadors by the sea, even in vessels of bulrushes upon the waters, *saying*, Go, ye swift messengers, to a nation scattered and peeled, to a people terrible from their beginning hitherto; a nation meted out and trodden down, whose land the rivers have spoiled!","3":"All ye inhabitants of the world, and dwellers on the earth, see ye, when he lifteth up an ensign on the mountains; and when he bloweth a trumpet, hear","4":"For so the LORD said unto me, I will take my rest, and I will consider in my dwelling place like a clear heat upon herbs, *and* like a cloud of dew in the heat of harvest.","5":"For afore the harvest, when the bud is perfect, and the sour grape is ripening in the flower, he shall both cut off the sprigs with pruning hooks, and take away *and* cut down the branches.","6":"They shall be left together unto the fowls of the mountains, and to the beasts of the earth: and the fowls shall summer upon them, and all the beasts of the earth shall winter","7":"In that time shall the present be brought unto the LORD of hosts of a people scattered and peeled, and from a people terrible from their beginning hitherto; a nation meted out and trodden under foot, whose land the rivers have spoiled, to the place of the name of the LORD of hosts, the mount Zion."}},"tsk":{"1":[{"kopje":"het land","refs":["Jes 20:3-6","Jes 30:2","Jes 30:3","Jes 31:1"]},{"kopje":"schaduwachtig","refs":["Ruth 2:12","Ps 17:8","Ps 36:8","Ps 57:2","Ps 61:5","Ps 63:8","Ps 91:4","Matt 23:37"]},{"kopje":"dat","refs":["2 Kon 19:9","Ezech 30:4","Ezech 30:5","Zef 2:12","Zef 3:10"]}],"2":[{"kopje":"stuurt","refs":["Jes 30:2-4","Ezech 30:9"]},{"kopje":"schepen","refs":["Ex 2:3"]},{"kopje":"naar een volk","refs":["Jes 18:7"]},{"kopje":"naar een volk","refs":["Gen 10:8","Gen 10:9","2 Kron 12:2-4","2 Kron 14:9","2 Kron 16:8"]},{"kopje":"beroven","refs":["Jes 19:5-7"]}],"3":[{"kopje":"Allen","refs":["Jes 1:2","Ps 49:2","Ps 49:3","Ps 50:1","Jer 22:29","Micha 6:2"]},{"kopje":"zult u het zien","refs":["Jes 5:26","Jes 7:18","Jes 13:2","Jes 13:4","Jes 26:11","Amos 3:6-8","Micha 6:9","Zach 9:14","Matt 13:9","Matt 13:16"]}],"4":[{"kopje":"Ik zal","refs":["Jes 26:21","Ps 132:13","Ps 132:14","Hos 5:15"]},{"kopje":"toezien vanuit Mijn woning","refs":["Jes 18:7","Jes 12:6","Jes 14:32","Jes 31:9","Jes 46:13","Joël 3:17"]},{"kopje":"als de glinsterende","refs":["2 Sam 23:4","Ps 72:6"]}],"7":[{"kopje":"zal de","refs":["Jes 16:1","Jes 23:17","Jes 23:18","Jes 45:14","2 Kron 32:23","Ps 68:30-32","Ps 72:9-15","Zef 3:10","Mal 1:11","Matt 2:11"," 62\">together</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5861\">fowls</span> of the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H929\">beasts</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth:</span> and the <span class=\"wl wl-kjv\" data-code=\"H5861\">fowls</span> shall <span class=\"wl wl-kjv\" data-code=\"H6972\">summer</span> upon them, and all the <span class=\"wl wl-kjv\" data-code=\"H929\">beasts</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> shall winter","7":"In that <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> shall the <span class=\"wl wl-kjv\" data-code=\"H7862\">present</span> be <span class=\"wl wl-kjv\" data-code=\"H2986\">brought</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts</span> of a <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H4900\">scattered</span> and <span class=\"wl wl-kjv\" data-code=\"H4178\">peeled,</span> and from a <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3372\">terrible</span> from their beginning <span class=\"wl wl-kjv\" data-code=\"H1973\">hitherto;</span> a <span class=\"wl wl-kjv\" data-code=\"H1471\">nation</span> meted <span class=\"wl wl-kjv\" data-code=\"H6978\">out</span> and trodden under <span class=\"wl wl-kjv\" data-code=\"H4001\">foot,</span> whose <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> the <span class=\"wl wl-kjv\" data-code=\"H5104\">rivers</span> have <span class=\"wl wl-kjv\" data-code=\"H958\">spoiled,</span> to the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> of the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> the <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> Zion."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"het land,","tekst":"De profeet roept wee over Morenland, om de Joden te waarschuwen dat zij op de hulp der Moren niet zouden vertrouwen, dewijl Morenland met Egypte en andere aangrenzende landen, door Gods rechtvaardig oordeel, zwaar zouden geplaagd en verwoest worden, gelijk geschied is, eerst door de Assyriërs, daarna door de Babyloniërs; zie onder Isa 20:3-6 , en Isa 43:3 ; Eze 30:4-5 , en Eze 38:5 ; Nah 3:9-10 . Anders: O land, enz. verstaande dat dit ganse hoofdstuk slaat op de tijden van den Messias en de beroeping der Joden en heidenen tot Christus, onder de banier van het heilige Evangelie, mitsgaders der verwerping en langdurige straf der hardnekkige Joden en hun eindelijke bekering."},{"catchword":"dat schaduwachtig is","tekst":"Dat is, hetwelk vol schaduwen is, of dat schaduw maakt."},{"catchword":"aan de frontieren,","tekst":"Hebreeuws, aan de vleugelen; dat is, dat vol schaduwen is aan de grenzen, of einden, gelijk boven Isa 11:12 , en onder Isa 24:16 , en dat vanwege de veelheid der hoge bergen aldaar gelegen, die vele schaduwen maakten. Eenigen verstaan hier door de schaduwachtige vleugelen de grote menigte van de zeilen der schepen, die schaduw aanbrengen; dat is, wee het land waar al die schepen zijn. Anderen menen dat door de schaduwen der vleugelen hier beduid wordt dat de Moren en Egyptenaars [als naburen en bondgenoten] andere volkeren onder hunne bescherming gewoon waren te nemen. Vergelijk onder Isa 30:2-3 , enz."},{"catchword":"dat aan de zijde","tekst":"Dit is een beschrijving der gelegenheid van Morenland, liggende aan beide zijden der rivieren de Nijl, Astapus, Astaboras, enz., gelijk de kaarten en landbeschrijvers aanwijzen. Vergelijk Zep 3:10 ."}],"2":[{"catchword":"Dat gezanten","tekst":"Anders: Hij zendt gezanten, enz., verstaande dit van God, die door zijne regering beschikt dat de Moren verschrikt worden door de tijdingen van de aankomst des vijands, uit vergelijking van Eze 30:9 . Anderen verstaan het van de Moren, [of hun koning Tirhaka, 2Ki 19:9 ] , die gezanten zonden om te zamen met de Egyptenaars den Assyriër [op der Joden begeerte] den krijg aan te zeggen, of, [gelijk sommigen] tot de Joden, om hun hulp te beloven, of, [gelijk anderen] tot verscheidene naastgelegen volken, om een groot krijgsheir te verzamelen tegen den inval der Assyriërs."},{"catchword":"in schepen","tekst":"Dusdanige schepen en schuiten gebruikte men in die landen, vanwege de lichtheid, en omdat zij zo haast niet braken of barstten als de houten, wanneer zij ergens tegen de klippen aanstootten, waar de rivier de Nijl vol van is. Hebreeuws, in vaten."},{"catchword":"snelle boden","tekst":"Hebreeuws, lichte boden; zie Job 7:6 ."},{"catchword":"dat getrokken is","tekst":"Dit kan zijn een beschrijving van de Assyriërs, die wijd van hun land waren afgetrokken en door de langdurige oorlogen kaal en berooid. [Vergelijk Eze 29:18 ] . Een vreeslijk volk van den beginne aan en doorgaans, Gen 10:8-9 , enz., die een iegelijk regel en maat wilden stellen, andere volken vertraden, en in hun land vele rivieren hadden, die hetzelve [gelijk gemeenlijk geschiedt] plegen af te spoelen. Sommigen duiden het op de ingezetenen van Morenland en andere volken daaraan gelegen, wijd en zijd verspreid, rank van lijf, dun van haar, wild en vreeslijk, de een aan den ander verre heen gelegen, of dat regels gewijze zou vertreden worden, of waarover God het richtsnoer zijner straf zou trekken. Vergelijk 2Ki 21:13 ; Isa 34:11 , enz. Anderen nemen het als ene beschrijving van het Joodse volk, dat veel had geleden en van God regel op regel ontvangen, Isa 28:10 , en vanwege de grote wonderwerken Gods vreeslijk was, hoewel vele vijanden [gelijk geweldige rivieren, Isa 8:7 , enz.] hun land beroofden; van welk alles de verstandige lezer zal mogen oordelen."},{"catchword":"van dat het was","tekst":"Dat is, van dien tijd af dat het een volk geweest is en doorgaans henen. Anders: van hun begin af tot hier toe."},{"catchword":"van regel en regel,","tekst":"Hebreeuws, een volk des regels regels, of der linie linie."}],"3":[{"catchword":"Allen gij ingezetenen","tekst":"In vs.3 wordt te kennen gegeven dat dit oordeel Gods, zekerlijk en in het openbaar, als voor de ogen van al de wereld zou vervuld worden, zodat de andere volken getuigen zouden zijn van de waarheid dezer profetie en de Joden beschaamd worden in hun vertrouwen op de hulp der Moren, Egyptenaars, enz."},{"catchword":"men de banier","tekst":"Anders: wanneer Ik [te weten God] de banier, enz.; dat is, als Ik het vijandig krijgsheir over de Moren zal doen komen; of als Ik door mijnen engel de Assyriërs zal verslaan; waarvan sommigen vs.3 verstaan."},{"catchword":"zult gijlieden","tekst":"Of, ziet het, en alzo terstond, hoort het."}],"4":[{"catchword":"Ik zal stil zijn,","tekst":"Menselijkerwijze van God gesproken, gelijk koningen, in hunne paleizen zittende, niettemin op alles toezien en hun koninkrijk bezorgen; alzo belooft God dat Hij zijne kerk, onderwijl Hij zijne oordelen over deze heidense volken [waarvan vs.5,6] uitvoert, zal verschonen, verkwikken en weldoen, gelijk een zonneschijn na den regen en een dauwige wolk in den oogst lieflijk zijn. Anderen verstaan dat hier begint de beschrijving van Gods oordeel, alsof God zeide: Ik zal wel toelaten dat de Moren woelen en zich tot tegenweer verzamelen; of [gelijk anderen] dat de Assyriërs een tijdlang met hun geweld voortgaan; maar het zal hun tot hun eigen verderf strekken, gelijk onmatige hitte na groten regen het teder gewas, en een dikke, natte, mistige wolk den oogst bederven."}],"5":[{"catchword":"Want","tekst":"Of, maar. Dit nu is een beschrijving van Gods oordeel, tot welke aanmerking de volken genodigd zijn, vs.3."},{"catchword":"vóór den oogst,","tekst":"Met deze gelijkenis en figuurlijke manieren van spreken wordt te kennen gegeven dat God allen tegenweer der Moren, of [gelijk anderen] al het geweld der Assyriërs, eer zij het tot volkomenheid zullen brengen, zal te schande maken en hen schrikkelijk verderven."}],"6":[{"catchword":"Zij zullen","tekst":"Te weten Moren, of Assyriërs."},{"catchword":"daarop overwinteren","tekst":"Vergelijk Eze 31:12-13 ."}],"7":[{"catchword":"Te dien tijd","tekst":"In vs.7 doet God [gelijk elders dikwijls] een troostelijke belofte van de genadige beroeping der Moren, of Assyriërs, en dergelijke andere vijandelijke heidense volken, tot de gemeenschap des Heeren Christus en zijne kerk. Vergelijk onder Isa 19:19 enz., en zie dergelijke profetieën van de Moren, Psa 68:32 , en Psa 87:4 ; Isa 45:14 ; Zep 3:10 , en een aanmerkelijk voorbeeld, Act 8:27 , enz."},{"catchword":"het volk, dat","tekst":"Waarvan boven vs.2."},{"catchword":"van het volk,","tekst":"Dat is, van enigen van dit vreeslijk volk. Aldus moet men ook het woord van nemen en verstaan, Mat 23:34 , en van hen zult gij doden; dat is, sommigen van hen zult gij doden."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Wo to the Land which is shadowy on the borders, which is on the side of the rivers of Ethiopia. [The Prophet proclaimeth wo against Ethiopia, to warn the Jews, that they should not trust to the help of the Ethiopians, because Ethiopia with Egypt, and other bordering Countries, should be severely punished and destroyed by the just judgement of God, as came to pass, first by the Assyrians, and afterward by the Babylonians. See below chap.20.3,4,5,6. And 43.3. Ezech.30.4,5. And 38.5. Nahum.3.9,10. Zeph.2.12. Oth. O Land, &c. Meaning that this whole chapter relateth to the times of the Messiah, and of the calling of the Jews and Gentiles unto Christ, under the banner of the Gospel, as also to the times of the rejection and long-lasting punishment of the obstinate Jews, and final conversion. (Wo to the land that is shadowy,) That is, which is full of shadows, or, which maketh a shadow. (on the frontiers, or, borders.) Hebr. At, or, on the wings: That is, which is full of shadows on the frontiers, or borders or limits, or bounds, as above chap.11.12. and below chap.24.16. and that by reason of the multitude of high mountains that lay there, which made those shadows. Some understand here by the shadowy wings, the great number of sails of ships, that did cast a shadow: then the meaning is this, Wo to the land where all those ships are. Others conceive that by the shadow of the wings here is signified, that the Ethiopians and Egyptians (as neighbours and confederates) were wont to take other nations and people under their protection. Compare below chap.30.2,3, etc. (which is on the side of the rivers of Ethiopia.) This is a Description of the situation of Ethiopia, lying on both sides of the rivers, Nilus, Astapus, Astaboras, &c. As the Maps and Geographers do shew. Compare Zeph.3.9.]"}],"2":[{"catchword":null,"tekst":"That sendeth Ambassadorss over the Sea, and in ships of bulrushes upon the waters, [Oth. He sendeth Ambassadors, &c Understanding this of God, who by his providence ordaineth, that the Ethiopians are frighted by the news of the enemies approach, by comparing Ezech.30.9. Others understand it of the Ethiopians, (or, of their King Tirhaka, 2 Kings 19.9.) who sent Ambassadors, for (together with the Egyptians) to denounce war against the Assyrian at the Jews request, or (as some) unto the Jews to promise them aid, or (as others) unto divers near-adjoining or neighbouring nations, to gather a huge army together against the invasion of the Assyrians. (and in ships of bulrushes upon the waters,) Such kind of ships, and boats they used in those countries for the lightness of them, and because they did no so soon break or burst asunder, as the wooden ones do, when they hit any where against the rocks, of which the river Nilus is very full. Hebr. Vessels] (saying;) Go your ways, ye swift messengers, [Hebr. Light messengers. See Job 7.on vers.6.] to a nation that is drawn, and plucked (or, peeled,) to a people which is terrible since they were, and thence forth; [That is, lion that they very time that they were a people, and so onward, or, so continually. Oth. From their beginning hitherto] a nation of rule, and rule, [Hebr. A nation of rule, or, of line it] and of treading down, whose land rivers spoil. [This is, happily a description of the Assyrians, who were drawn away, far from their land, and were made bald and bare by long continuing wars. (Compare Ezech.29.18.) A terrible people from the beginning and to continually, Genes.10.8,9, &c. Who would set rule and measure to every one, and would tread down other nations, and who had in their land many rivers, which were wont to wash it away, as usually happeneth. Some apply it to the inhabitants of Ethiopia, and other nations thereunto adjoining, spread far and near, who were slender of body, had thin hair, were wild and terrible, lying far distant from one another, or, which way of rule should be trodden down: Or, upon whom God would draw the line of his judgement. Compare 2 Kings 21.13. below chap.34.11, etc. Others take it as a description of the people of the Jews, which had suffered much, and receive of God rule upon rule, or, line upon line, below 28.10. and were very terrible in regard of the great wonders and miracles of God, although many enemies (as mighty rivers, above chap.8,7, etc.) spoiled their land: concerning all which the understanding Reader will be able to judge.]"}],"3":[{"catchword":null,"tekst":"All the inhabitants of the World, and the dwellers on the earth; when the banner shall be set up (on) thee mountains, ye shall see (it,) and when the trumpet shall blow, ye shall hear (it.) [In this verse is intimated, that this judgement of God should be surely and publicly fulfilled, as it were in the sight of all the World, so that other nations should be witnesses of the truth of this Prophecy, and the Jews should be witnesses of the truth of this Prophecy, and the Jews should be ashamed of their confidence and relying on the aid of the Ethiopians, Egyptians, &c. (when the banner shall be set up, &c.) Oth. When I (to wit, God) shall set up, &c. That is, when I shall cause the enemies army to come against the Ethiopians: or, when I by mine Angel shall smite and slay the Assyrians, of which some do understand this verse. (ye shall see it) or, see ye it; and so immediately, hear ye it]"}],"4":[{"catchword":null,"tekst":"For so the LORD said unto me: I will be quiet, and behold in my dwelling-place, as the glistering heat upon the rain, as a cloud of Dew in the heat of Harvest: [Spoken of God after the manner of men: As Kings sitting in the their palaces, yet look to all things, and mind their Kingdom, and take care for it: so doth God promise that he will spare, comfort, and do good to his church, in the mean while that he is executing his judgements upon the heathenish nations (whereof mention is made, vers.5,6.) as sun-shine is pleasant and delightful after rain, and a dewy cloud in harvest. Others conceive, that here beginneth the description of Gods judgement, as if God had said: I will indeed suffer the Ethiopians to make a stir, to assemble themselves for their own defence, or (as others) I will suffer the Assyrians to go on a while in their violence and oppression, but it shall tend to their own ruin at last, as immoderate heat after much rain spoileth the tender herbs, and a thick, wet, misty cloud spoileth the harvest.]"}],"5":[{"catchword":null,"tekst":"For [Or, But] afore the harvest, when the bud is perfect, and the unripe grape ripeneth (after) the blossom, then shall be cut down the branches with pruning-hooks, and take away, and chop of the boughs. [This is now a description of Gods judgement, to the consideration whereof the nations are invited, vers. 3. (afore the harvest, when the bud is perfect, &c.) By this similitude and borrowed Phrase is signified, that God will confound all defence and resistance of the Ethiopians, or (as others) all defence and resistance of the Ethiopians, or (as others all the Violence and cruelty of the Assyrians, before they shall bring it to full perfection, and will most fearfully destroy them.]"}],"6":[{"catchword":null,"tekst":"They [To wit, the Ethiopians, or Assyrians] shall be left together unto the preying-fowls of the mountains, and to the beasts of the earth, and the fowls of prey shall summer over them, and all the beasts of the earth shall winter over them. [Compare Ezech.31.12, 13.]"}],"7":[{"catchword":null,"tekst":"At that time shall a present be brought unto the LORD of Hosts, (Of) the people, that is drawn, and plucked, [of whom above vers.2.] and of the people, that is terrible since they were, and thence forward: [That is, of some of this terrible people. Thus must likewise the particle of, be taken and understood, Mat 23:34. And of them ye shall kill, &c. That is, some of them ye shall kill] a nation of rule (and) rule, and of treading down, whose land the rivers spoil: to the place of the Name of the LORD of Hosts, to the mountain of Zion. [In this verse (as elsewhere often) God maketh a comfortable promise, concerning the gracious calling of the Moors or Assyrians, and such like other heathenish enemies, to the communion of the Lord Christ and his Church. Compare below chap.19.19, &c. And see the like Prophecies concerning the Ethiopians, Psal.68.32. and 87.4. below chap.45.14. Zeph.3.9. and a notable example, Act 8:27, &c.]"}]}}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"

const _vertParam = new URLSearchParams(location.search).get('vert');
if (_vertParam && D.vertalingen[_vertParam]) vertaling = _vertParam;

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)

function plaatsPopup(el, html) {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;

  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];

    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;

  if (!code) return null;

  try {

document.addEventListener('click', e => {

    const isKjv = wl.classList.contains('wl-kjv');

    if (detail.dataset.actief === key) {

      detail.innerHTML = '<em>Laden…</em>';

        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });

    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();

    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();

    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);

  const chip = e.target.closest('.refchip');
  if (chip) {

const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);

// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;

  if (!chip) return;

  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);

    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);

  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {

    const html = popupVerzenHtml(data, start, eind);

    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>

</html>
