door de poorten, bereidt de weg van het volk; verhoogt, verhoogt een baan, ruimt de stenen weg, steekt een banier omhoog tot de volken!","11":"Ziet, de HEERE heeft doen horen, tot aan het einde van de aarde: zegt tegen de dochter van Sion: Zie, uw Heil komt; zie, Zijn loon is met Hem, en Zijn arbeidsloon is voor Zijn aangezicht.","12":"En zij zullen hen noemen het heilige volk, de verlosten van de HEERE; en u zult genoemd worden de gezochte, de stad, die niet verlaten is."},"SV":{"1":"Om Sions wil zal ik niet zwijgen, en om Jeruzalems wil zal ik niet stil zijn; totdat haar gerechtigheid voortkome als een glans, en haar heil als een fakkel, die brandt.","2":"En de heidenen zullen uw gerechtigheid zien, en alle koningen uw heerlijkheid; en gij zult met een nieuwen naam genoemd worden, welken des HEEREN mond uitdrukkelijk noemen zal.","3":"En gij zult een sierlijke kroon zijn in de hand des HEEREN, en een koninklijke hoed in de hand uws Gods.","4":"Tot u zal niet meer gezegd worden: De verlatene, en tot uw land zal niet meer gezegd worden: Het verwoeste; maar gij zult genoemd worden: Mijn lust is aan haar! en uw land: Het getrouwde; want de HEERE heeft een lust aan u, en uw land zal getrouwd worden.","5":"Want *gelijk* een jongeling een jonkvrouw trouwt, *alzo* zullen uw kinderen u trouwen; en *gelijk* de bruidegom vrolijk is over de bruid, *alzo* zal uw God over u vrolijk zijn.","6":"O Jeruzalem! Ik heb wachters op uw muren besteld, die geduriglijk al den dag en al den nacht niet zullen zwijgen. O gij, die des HEEREN doet gedenken, laat geen stilzwijgen bij ulieden wezen!","7":"En zwijgt niet stil voor Hem, totdat Hij bevestige, en totdat Hij Jeruzalem stelle *tot* een lof op aarde.","8":"De HEERE heeft gezworen bij Zijn rechterhand, en bij den arm Zijner sterkte: indien Ik uw koren meer zal geven *tot* spijs voor uw vijanden, en indien de vreemden zullen drinken van uw most, waaraan gij gearbeid hebt!","9":"Maar die het inzamelen zullen, die zullen het eten, en zij zullen den HEERE prijzen; en die hem vergaderen zullen, zullen hem drinken in de voorhoven Mijns heiligdoms.","10":"Gaat door, gaat door, door de poorten, bereidt den weg des volks; verhoogt, verhoogt een baan, ruimt de stenen weg, steekt een banier omhoog tot de volken!","11":"Ziet, de HEERE heeft doen horen, tot aan het einde der aarde: zegt der dochter van Sion: Zie, uw Heil komt; zie, Zijn loon is met Hem, en Zijn arbeidsloon is voor Zijn aangezicht.","12":"En zij zullen hen noemen het heilige volk, de verlosten des HEEREN; en gij zult genoemd worden de gezochte, de stad, die niet verlaten is."},"KJV":{"1":"For Zion's sake will I not hold my peace, and for Jerusalem's sake I will not rest, until the righteousness thereof go forth as brightness, and the salvation thereof as a lamp *that* burneth.","2":"And the Gentiles shall see thy righteousness, and all kings thy glory: and thou shalt be called by a new name, which the mouth of the LORD shall name.","3":"Thou shalt also be a crown of glory in the hand of the LORD, and a royal diadem in the hand of thy God.","4":"Thou shalt no more be termed Forsaken; neither shall thy land any more be termed Desolate: but thou shalt be called Hephzibah, and thy land Beulah: for the LORD delighteth in thee, and thy land shall be married.","5":"For *as* a young man marrieth a virgin, *so* shall thy sons marry thee: and *as* the bridegroom rejoiceth over the bride, *so* shall thy God rejoice","6":"I have set watchmen upon thy walls, O Jerusalem, *which* shall never hold their peace day nor night: ye that make mention of the LORD, keep not silence,","7":"And give him no rest, till he establish, and till he make Jerusalem a praise in the earth.","8":"The LORD hath sworn by his right hand, and by the arm of his strength, Surely I will no more give thy corn *to be* meat for thine enemies; and the sons of the stranger shall not drink thy wine, for the which thou hast laboured:","9":"But they that have gathered it shall eat it, and praise the LORD; and they that have brought it together shall drink it in the courts of my holiness.","10":"Go through, go through the gates; prepare ye the way of the people; cast up, cast up the highway; gather out the stones; lift up a standard for the people.","11":"Behold, the LORD hath proclaimed unto the end of the world, Say ye to the daughter of Zion, Behold, thy salvation cometh; behold, his reward *is* with him, and his work before","12":"And they shall call them, The holy people, The redeemed of the LORD: and thou shalt be called, Sought out, A city not forsaken."}},"tsk":{"1":[{"kopje":"Sion","refs":["Jes 62:6","Jes 62:7","Ps 51:20","Ps 102:14-17","Ps 122:6-9","Ps 137:6","Zach 2:12","Luk 10:2","2 Tess 3:1","Hebr 7:25"]},{"kopje":"haar gerechtigheid","refs":["Jes 1:26","Jes 1:27","Jes 32:15-17","Jes 51:5","Jes 51:6","Jes 51:9","Jes 61:10","Jes 61:11","Ps 98:1-3","Spr 4:18","Micha 4:2","Matt 5:16","Luk 2:30-32","Fil 2:15","Fil 2:16","1 Petr 2:9"]}],"2":[{"kopje":"de heidenen","refs":["Jes 49:6","Jes 52:10","Jes 60:1-3","Jes 61:9","Jes 66:12","Jes 66:19","Micha 5:7","Hand 9:15","Hand 26:23","Kol 1:23"]},{"kopje":"alle koningen","refs":["Jes 49:23","Jes 60:11","Jes 60:16","Ps 72:10","Ps 72:11","Ps 138:4","Ps 138:5"]},{"kopje":"u zult","refs":["Jes 62:4","Jes 62:12","Jes 65:15","Gen 17:5","Gen 17:15","Gen 32:28","Jer 33:16","Hand 11:26","Openb 2:17"]}],"4":[{"kopje":"niet meer","refs":["Jes 62:12","Jes 32:14","Jes 32:15","Jes 49:14","Jes 54:1","Jes 54:6","Jes 54:7","Hos 1:9","Hos 1:10","Rom 9:25-27","Hebr 13:5","1 Petr 2:10"]},{"kopje":"Mijn lust is aan haar","refs":["Jes 62:5","Ps 149:4","Jer 32:41","Zef 3:17"]},{"kopje":"Het getrouwde","refs":["Jes 54:5","Jes 61:10","Jer 3:14","Hos 2:18","Hos 2:19","Joh 3:29","2 Kor 11:2","Ef 5:25-27","Openb 21:2","Openb 21:9","Openb 21:10"]}],"5":[{"kopje":"zullen uw kinderen","refs":["Jes 49:18-22","Ps 45:12-17","Jer 32:41"]},{"kopje":"zoals de bruidegom vrolijk is","refs":["Jes 62:4","Jes 65:19","Hoogl 3:11","Hebr 12:2"]}]," lass=\"wl wl-kjv\" data-code=\"H3318\">forth</span> as <span class=\"wl wl-kjv\" data-code=\"H5051\">brightness,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3444\">salvation</span> thereof as a <span class=\"wl wl-kjv\" data-code=\"H3940\">lamp</span> that burneth.","2":"And the <span class=\"wl wl-kjv\" data-code=\"H1471\">Gentiles</span> shall <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> thy <span class=\"wl wl-kjv\" data-code=\"H6664\">righteousness,</span> and all <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> thy <span class=\"wl wl-kjv\" data-code=\"H3519\">glory:</span> and thou shalt be <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> by a <span class=\"wl wl-kjv\" data-code=\"H2319\">new</span> <span class=\"wl wl-kjv\" data-code=\"H5344\">name,</span> which the <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall name.","3":"Thou shalt also be a <span class=\"wl wl-kjv\" data-code=\"H5850\">crown</span> of <span class=\"wl wl-kjv\" data-code=\"H8597\">glory</span> in the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and a <span class=\"wl wl-kjv\" data-code=\"H4410\">royal</span> <span class=\"wl wl-kjv\" data-code=\"H6797\">diadem</span> in the <span class=\"wl wl-kjv\" data-code=\"H3709\">hand</span> of thy God.","4":"Thou shalt no more be <span class=\"wl wl-kjv\" data-code=\"H559\">termed</span> <span class=\"wl wl-kjv\" data-code=\"H5800\">Forsaken;</span> neither shall thy <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> any more be <span class=\"wl wl-kjv\" data-code=\"H559\">termed</span> <span class=\"wl wl-kjv\" data-code=\"H8077\">Desolate:</span> but thou shalt be <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> <span class=\"wl wl-kjv\" data-code=\"H2657\">Hephzibah,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H776\">la n> in the earth.","8":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H7650\">sworn</span> by his right <span class=\"wl wl-kjv\" data-code=\"H3225\">hand,</span> and by the <span class=\"wl wl-kjv\" data-code=\"H2220\">arm</span> of his <span class=\"wl wl-kjv\" data-code=\"H5797\">strength,</span> Surely I <span class=\"wl wl-kjv\" data-code=\"H518\">will</span> no more <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thy <span class=\"wl wl-kjv\" data-code=\"H1715\">corn</span> to be <span class=\"wl wl-kjv\" data-code=\"H3978\">meat</span> for thine <span class=\"wl wl-kjv\" data-code=\"H341\">enemies;</span> and the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of the <span class=\"wl wl-kjv\" data-code=\"H5236\">stranger</span> shall not <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> thy <span class=\"wl wl-kjv\" data-code=\"H8492\">wine,</span> for the which thou hast laboured:","9":"But they that have <span class=\"wl wl-kjv\" data-code=\"H622\">gathered</span> it shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> it, and <span class=\"wl wl-kjv\" data-code=\"H1984\">praise</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> and they that have brought it <span class=\"wl wl-kjv\" data-code=\"H6908\">together</span> shall <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> it in the <span class=\"wl wl-kjv\" data-code=\"H2691\">courts</span> of my holiness.","10":"Go <span class=\"wl wl-kjv\" data-code=\"H5674\">through,</span> go <span class=\"wl wl-kjv\" data-code=\"H5674\">through</span> the <span class=\"wl wl-kjv\" data-code=\"H8179\">gates;</span> <span class=\"wl wl-kjv\" data-code=\"H6437\">prepare</span> ye the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people;</span> cast <span class=\"wl wl-kjv\" data-code=\"H5549\">up,</span> cast <span class=\"wl wl-kjv\" data-code=\"H5549\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H4546\">highway;</span> gather <span class=\"wl wl-kjv\" data-code=\"H5619\">out</span> the <span class=\"wl wl-kjv\" data-code=\"H68\">stones;</span> lift <span class=\"wl wl-kjv\" data-code=\"H7311\">up</span> a <span class=\"wl wl-kjv\" data-code=\"H5251\">standard</span> for the people.","11":"Behold, the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H8085\">proclaimed</span> unto the <span class=\"wl wl-kjv\" data-code=\"H7097\">end</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">world,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">Say</span> ye to the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion,</span> Behold, thy <span class=\"wl wl-kjv\" data-code=\"H3468\">salvation</span> <span class=\"wl wl-kjv\" data-code=\"H935\">cometh;</span> behold, his <span class=\"wl wl-kjv\" data-code=\"H7939\">reward</span> is with him, and his <span class=\"wl wl-kjv\" data-code=\"H6468\">work</span> before","12":"And they shall <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> them, The <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> The <span class=\"wl wl-kjv\" data-code=\"H1350\">redeemed</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> and thou shalt be <span class=\"wl wl-kjv\" data-code=\"H7121\">called,</span> Sought <span class=\"wl wl-kjv\" data-code=\"H1875\">out,</span> A <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> not forsaken."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Om","tekst":"Dat zijn de woorden van de profeet Jesaja, zo in zijn naam als in dien van andere profeten en dienaren Gods."},{"catchword":"Sions wil","tekst":"Dat is, der kerk, of van het volk Gods, straks Jeruzalem genoemd; een voorbeeld der kerk van het Nieuwe Testament; Heb 12:22 ; Rev 14:1 , en Rev 21:2 ."},{"catchword":"niet zwijgen,","tekst":"Dat is, ik zal niet ophouden de troostelijke beloftenissen, die God mij geopenbaard heeft van zijne kerk te verkondigen; zie Psa 122:6 , en 2Ti 4:2 ."},{"catchword":"niet stil zijn;","tekst":"Of, niet rusten."},{"catchword":"haar gerechtigheid","tekst":"Te weten van de stad Jeruzalem, dat is, van de kerk. De zin is, totdat Christus, die onze gerechtigheid en Heiland is, aan de wereld geopenbaard worde."},{"catchword":"voortkome","tekst":"Of, opga. Hebreeuws, uitga; te weten gelijk de zon uit hare kamer gaat; zie Psa 10:6 ."}],"2":[{"catchword":"uw gerechtigheid","tekst":"Te weten, die gerechtigheid, o Zion, of Jeruzalem, met welke gij van uwen Bruidegom Christus Jezus zult zijn versierd geworden."},{"catchword":"een nieuwen naam","tekst":"Dat is, gij zult vernieuwd en in een beteren staat gebracht worden, dan gij tevoren waart, en deze nieuwe en betere staat zal ook oorzaak zijn van den nieuwen naam; die van nature kinderen zijn des toorns, Eph 2:3 , zullen uit genade genoemd worden kinderen Gods, 1Jo 3:1 , en degenen, aan welken Hij een welgevallen of lust heeft vs.4. Dezen nieuwen naam kent niemand, dan die hem ontvangt; Rev 2:17 ."},{"catchword":"uitdrukkelijk","tekst":"Zie van het Hebreeuwse woord Gen 30:28 ."}],"3":[{"catchword":"gij zult","tekst":"Dat is, gij zult den Heere zeer lief en waard zijn; zie Exo 19:5 ."},{"catchword":"in de hand","tekst":"Dat is, gij zult bewaard en van God beschermd worden. Zie Deu 33:3 ; Joh 10:28-29 ."},{"catchword":"een koninklijke","tekst":"Versta hier door den koninklijken hoed of mijter het koninklijke priesterdom, waarvan Petrus spreekt 1Pe 2:9 ."}],"4":[{"catchword":"De verlatene,","tekst":"Te weten van God haren bruidegom, alsof gij niet meer zijne bruid of zijn volk waart; zie Isa 60:15 ."},{"catchword":"Het verwoeste;","tekst":"Hebreeuws, verwoesting; dat is, het verwoeste; zie Hos 1:10 ; 1Pe 2:10 ."},{"catchword":"Mijn lust","tekst":"Dat is, God heeft een welgevallen aan haar, te weten aan Jeruzalem."},{"catchword":"uw land","tekst":"Dat u de Heere gegeven had te bewonen; of uw land; dat is de inwoners van uw land."},{"catchword":"Het getrouwde;","tekst":"Dat is, het bewoonde."},{"catchword":"uw land zal","tekst":"Dat is, uw land zal bewoond worden, gelijk ene vrouw haren man bijwoont."}],"5":[{"catchword":"u trouwen;","tekst":"Te weten o gij land, of onder u, bij u, te weten o gij kerk."},{"catchword":"uw God","tekst":"Christus wordt meermalen in de Heilige Schrift een Bruidegom genoemd, en zijne gemeente ene Bruid, Joh 3:29 ; Rev 21:2 , Rev 21:9 , welker onderlinge liefde en vreugde verhaald wordt Son 4:1 , enz."}],"6":[{"catchword":"O Jeruzalem","tekst":"Dit spreekt de Heere."},{"catchword":"wachters","tekst":"Dat is, profeten, herders, leraars, zielverzorgers. Zie Isa 21:11 ; Eze 3:17 , en Eze 33:7 ; Rev 21:12 ."},{"catchword":"niet zullen zwijgen","tekst":"Maar zij zullen u steeds het Woord en de beloften van God voorhouden; zie vs.1."},{"catchword":"O gij,","tekst":"Of, o gij gewagmakers, of o gij vermelders van den Heere; dit spreekt de profeet tot de leraars van het heilig Evangelie."},{"catchword":"laat geen stilzwijgen","tekst":"Maar betuigt steeds en verkondigt vrijmoediglijk de waarheid."}],"7":[{"catchword":"voor Hem,","tekst":"Te weten den Heere. Hebreeuws, geeft Hem, of voor Hem geen stilzwijgen. De zin is: Houdt niet op van bidden en smeken, maar houdt aan in het gebed, ja valt Hem zolang lastig, totdat gij verhoord wordt, totdat God arbeiders in zijnen oogst uitstoot, Mat 9:38 , en totdat Hij hunnen arbeid zegent, 1Co 3:6 ."},{"catchword":"tot een lof","tekst":"Dat is, in zulk een heerlijken staat, dat elkeen haar moet loven."}],"8":[{"catchword":"De HEERE","tekst":"Dit zijn nu wederom de woorden van den profeet."},{"catchword":"bij zijn rechterhand,","tekst":"Dat is, bij zijn eigen kracht, dat is bij zichzelven, geen groteren hebbende om bij te zweren; Heb 6:13 ."},{"catchword":"bij den arm","tekst":"Dat is, bij zijn sterken arm."},{"catchword":"indien Ik","tekst":"De zin is: Zekerlijk, Ik zal u den moedwil uwer vijanden en vervolgers niet overgeven. Zie van deze manier van eedzweren, de aantekening Num 14:23 ."},{"catchword":"uw koren","tekst":"O Jeruzalem."},{"catchword":"tot spijs","tekst":"God dreigt dikwijls dat de vreemden en de vijanden van zijn volk, vanwege deszelfs zonden, de vruchten van hun land zouden eten, gelijk Deu 28:30 , Deu 28:33 , Deu 28:51 ; hetwelk ook meermalen inderdaad alzo geschied is, Jdg 6:3-4 ; Ecc 6:1-2 . Dit moet men verstaan mede begrepen te zijn onder de vloeken der wet, die door Christus zijn weggenomen; Gal 3:13 . Zie ook Psa 128:2 , en 1Co 15:58 ."},{"catchword":"de vreemden","tekst":"Hebreeuws, de kinderen des vreemden."}],"9":[{"catchword":"die het inzamelen","tekst":"Hebreeuws, de inzamelaars deszelven, te weten des korens."},{"catchword":"die hem vergaderen","tekst":"Hebreeuws, de vergaderaars, of de samenbrengers deszelven, te weten most."},{"catchword":"in de voorhoven","tekst":"Dat is met openbare dankzeggingen, die zij den Heere in zijne kerk voor zijne weldaden zullen doen; ene manier van spreken genomen van de priesters, die het geheiligde vlees aten in het voorhof van den tabernakel en naderhand in de voorhoven van den tempel. Zie Lev 6:16 , en Lev 10:18 ; Eze 42:14 ."}],"10":[{"catchword":"bereidt den weg","tekst":"Dit is ene aanspraak tot de inwoners van Jeruzalem, hen vermanende dat zij de stadspoorten vrij wijd open zouden stellen en de wegen schoon en zuiver zouden maken, opdat de heidenen, die bij grote menigte zich tot de kerk van Christus begeven zouden, een open baan zouden vinden; zie Isa 57:14 . Anders: bereid het volk den weg."},{"catchword":"een baan,","tekst":"Door welke zij tot u, o gij burgers van Jeruzalem, dat is tot de Christelijke kerk, gebracht worden en ingaan mogen. Zie Isa 40:3 ."},{"catchword":"ruimt de stenen","tekst":"Of, zuivert haar van stenen. Zie Isa 57:14 . De zin is: Weert alle verhindernissen en aanstoot uit den weg; Rom 14:13 , Rom 14:21 ."},{"catchword":"steekt","tekst":"Dat is, predikt het Evangelie openlijk. Zie Isa 11:12 , en Isa 49:22 ."}],"11":[{"catchword":"heeft doen horen,","tekst":"Te weten door de predikatie van het heilig Evangelie. Zie Rom 10:18 , en [Hij heeft doen horen], te weten hetgeen hier volgt: Zegt, enz."},{"catchword":"de dochter van Sion","tekst":"Dat is, van het volk van Zion, dat is van de kerk Gods, gelijk Zec 9:9 ; Mat 21:5 ; Joh 12:15 ."},{"catchword":"uw Heil komt","tekst":"Dat is, uwe zaligheid en verlossing; of uw Heiland en Zaligmaker, te weten Jezus, die zijn volk verlost van hunne zonden, Mat 1:21 ; Luk 2:30 ."},{"catchword":"Zijn loon is met Hem,","tekst":"Dien Hij geven zal aan al degenen, die Hem trouwelijk dienen, Isa 40:10 ; Rev 22:12 . Zie Psa 127:3 ."},{"catchword":"Zijn arbeidsloon","tekst":"Hebreeuws, zijn werk; dat is zijn arbeidsloon; zie Isa 40:10 ; Lev 19:13 ."}],"12":[{"catchword":"hen noemen","tekst":"Te weten de gelovigen, die zich tot de Christelijke gemeente zullen vervoegen, zo uit de Joden als uit de heidenen."},{"catchword":"het heilige volk,","tekst":"Hebreeuws, het volk der heiligheid."},{"catchword":"de verlosten","tekst":"Dat is, die van den Heere verlost zijn."},{"catchword":"gij zult","tekst":"O Zion, gij kerk Gods."},{"catchword":"de gezochte,","tekst":"Het Hebreeuwse woord, hetwelk enigen in den tekst zetten, betekent de gezochte, of nagezochte, of bezorgde; te weten die de Heere uit genade weder bezocht en vergaderd heeft, daar zij tevoren om harer zonden wil een tijdlang was verlaten en verstrooid geweest. Zie Isa 54:6-7 , en de aantekening Deu 11:12 ."},{"catchword":"de stad,","tekst":"Of, de onverlaten stad."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"For Zions sake i will not hold my peace, and for Jerusalem sake i will not be quiet: [or, not rest] until the righteousness thereof come forth as brightness and the salvation thereof as torch that burneth [these are the words of the prophet Isaiah, both in his own name and in the name of other Prophets and Ministers of God] (for Zion&acirc;&euro;&trade;s sake) that is, for the churches, on the people of Gods sake, which is straightway called Jerusalem, a type of the church of the new Testament, Heb. 12.22. Revel.14.1 and 21.2. (i will not hold my peace) that is, i will not cease to preach unto his church the comfortable promises that god hath revealed unto me. See Psal.122.6 and 2 Tim.4.2. (until the righteousness thereof) to wit, of the city of Jerusalem; that is of church.(come forth as a splendour,) Or, a rise, Heb. Go forth; to wit, as the sun goeth out of his chamber when he ariseth. See Psal.19.6. (and the salvation thereof as a torch that burneth) this meaning, until Christ, who is our righteousness and our Saviour, be revealed unto the world.]"}],"2":[{"catchword":null,"tekst":"And the Gentiles shall see thy righteousness, [To wit, that righteous, O Zion, or Jerusalem, wherewith thou shalt be adorned by thy bridegroom Christ Jesus] and all kings thy glory: and thou shalt be called by a new name, [that is, thou shalt be renewed and brought into a better estate then thou wast in before, and this new and better estate shall be the cause of the new name. They that are by nature children of wrath, Eph 2:3 shall be grace be called children of god, 1 Job 3:1 and such in whom he taketh pleasure or delight, ver.4 this name no man knoweth but he that recieveth it, Revel. 2.17.] which the mouth of the Lord shall expressly name. [See of the Hebrews word, Gens.30 on vers.28]"}],"3":[{"catchword":null,"tekst":"And thou shalt be a beautiful crown in the hand of the Lord, [That is, thou shalt be most dear and precious unto the Lord. See Exod. 19.5. (in the hand of the Lord) that is, thou shalt be preserved and protected by God. See Deut.33.3. Job 13:28,29.] and a royal diadem in the hand of thy God. [Understand here by the royal diadem, or mitre, the royal Priesthood whereof Peter Speaketh, 1 Pet.2.9.]"}],"4":[{"catchword":null,"tekst":"It shall no more be said unto thee, the forsaken one [to wit, of God her bridegroom, as if thou wart no more his bride, or his people, or his people. See above chap.60.15.] Neither shall it be said anymore to thy land, the desolate. [Heb. Desolation; that is, desolate. See Hos 1:10 1Pet. 2.10] but thou shalt be called, My delight is in her, [that is, God hath a delight in her to wit, in Jerusalem] and thy land, [which the lord had given thee to dwell in. Or, thy land; that is, the inhabitants of thy land] the betrothed: [that is, inhabited] for the Lord hath a delight in thee, and thy land shall be betrothed. [That is thy land shall be inhabited, as wife dwelleth with her husband.]"}],"5":[{"catchword":null,"tekst":"For (as) a young man marrieth a virgin, (so) shall thy children marry thee: [to wit, O thou land. Or, among you with the, O thou Church] and (as) the bridegroom rejoyceth over the bride, (s0) shall thy God rejoice over thee. [Christ is often in scripture called a bridegroom and his church a bride, Job 3:24. Revel. 21. Ver. 2,9. Whose mutual love and joy is related, and 4.1,"}],"6":[{"catchword":null,"tekst":"I have set watchmen upon thy walls, O Jerusalem, [this is the Lord Speaketh. (Watchmen) that is, Prophets, shepherds, teachers, such as have the care of souls. See above chap. 21.11. Eze 3:17. and 33.7. Revel. 21.12 and 18.14.] which all the day and all the night continually shall not hold their peace: [But they shall continually preach the word, and hold forth the promises of God. See ver.1.] O ye that cause the Lord to be remembered, [Or, O ye mention-makers, or, O ye mentioners of the Lord. This is the Prophet speaketh unto the teachers of the Gospel] let no silence be with you. [But witness constantly, and preach boldly the truth.]"}],"7":[{"catchword":null,"tekst":"And keep not silence before him, [To wit, the Lord, Heb, give him, or before him no silence] until he make Jerusalem a praise upon earth. [the meaning is, Give not over preaching and entering and entreating, but persevere in prayer, yea be urgent and importunate with God, until thou be heard, until God send forth labourers into his harvest, Matth. 9.38 and until he bless their labour, 1 Cor. 3.6. (until he maketh Jerusalem a praise upon earth) that is, put her in such a condition, that must one must praise her.]"}],"8":[{"catchword":null,"tekst":"the Lord hath sworn by his right hand, [that is, by his own power; that is by himself, having no gain the prophets words] and by the arm of his strength: [that is, by his strong arm] if i shall any more give [O Jerusalem] thy corn to be (for) meat for thine enemies, and if the strangers [Heb, the children of the stranger] shall drink thy new for the which thou hast laboured: [the meaning is, surely i will not deliver thee up to the will of thine enemies and persecutors. See of this kind of oath, Numb chap.14. the Annotat. On ver. 23.. (if i shall any more give thy corn (for) meat for thine enemies) God doth often threaten that strangers and enemies of his people should for his people sins eat the fruits of their land, as Deut., 28. Ver.30,33,51. Which often times happened so indeed, Judg.6.3,4. Eccles.6,1,2. This must be understood to be likewise contained among the curses of the law, which are taken away by Christ, Galat. 3.13. see likewise Psal.128.2 and 1 cor.15.58.]"}],"9":[{"catchword":null,"tekst":"But they that shall gather it in, [Heb, the gatherers in of it; to wit, of the corn] they shall eat it, and they shall praise the Lord: and they that shall gather it, [Heb, the gatherers, or bringers of it together&acirc;&euro;&trade; to wit, of the new wine] they shall drink it in the courts of my sanctuary. [That is, with public thanksgivings, which they shall perform unto the Lord in his Church for his mercies. A phrase borrowed from the Priests that did eat the hallowed flesh in the court of the Tabernacle, and afterw ss] the redeemed of the Lord] and thou] O Zion, thou church of God] shalt be called the sought one, [The Hebrew word, which some do put in the text, signifieth the sought one, or sought after, or, cared for. To wit, whom God of his grace and mercy hath visited and gathered again whereas she had been before forsaken and scattered a while for her sins. See above chap. 54.6,7 and the Annotat. Deut.11 on ver. 12.] the city which is not forsaken. [Or, the unforsaken city."}]}}};

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {

  ];
  const MAX_CW = 60;

    if (!lijst || !lijst.length) return '';

      const items = lijst.map((it, i) => {

        if (kortCw) {

      }).join('');

    } else {

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {

  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');

    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');

  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url}) (SVnu)`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
