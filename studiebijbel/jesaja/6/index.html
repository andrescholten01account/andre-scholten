ten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"In het jaar dat koning Uzzia stierf, zag ik de Heere zitten op een hoge en verheven troon, en Zijn zomen vulden de tempel.","2":"De serafs stonden boven Hem; ieder had zes vleugels; met twee bedekte *ieder* zijn gezicht, en met twee bedekte hij zijn voeten, en met twee vloog hij.","3":"En de een riep tot de ander en zei: Heilig, heilig, heilig is de HEERE van de heerscharen[1]! De hele aarde is vol van Zijn heerlijkheid!","4":"Zodat de posten van de dorpels bewogen door de stem van hem die riep; en het huis werd vervuld met rook.","5":"Toen zei ik: Wee mij, want ik ga ten onder! Omdat ik een man van onreine lippen ben, en ik woon te midden van een volk dat onrein van lippen is; want mijn ogen hebben de Koning, de HEERE van de heerscharen, gezien.","6":"Maar een van de serafs vloog naar mij toe, en had een gloeiende kool in zijn hand, *die* hij met de tang van het altaar genomen had.","7":"En hij raakte daarmee mijn mond aan, en zei: Zie, dit heeft uw lippen aangeraakt; zo is uw misdaad *van* *u* geweken, en uw zonde is verzoend.","8":"Daarna hoorde ik de stem van de Heere, die zei: Wie zal Ik zenden, en wie zal voor Ons heengaan? Toen zei ik: Zie, *hier* ben ik, zend mij heen.","9":"Toen zei Hij: Ga heen, en zeg tegen dit volk: Blijf horen, maar begrijp het niet, en blijf zien, maar merk het niet op.","10":"Maak het hart van dit volk vet, en maak hun oren zwaar, en sluit hun ogen, opdat het niet ziet met zijn ogen, of met zijn oren hoort, of met zijn hart begrijpt, of zich bekeert, en Hij het geneest.","11":"Toen zei ik: Hoe lang, Heere? En Hij zei: Totdat de steden verwoest worden, zodat er geen inwoner meer is, en de huizen, zodat er geen mens meer is, en het land met verwoesting verstrooid wordt.","12":"Want de HEERE zal die mensen ver wegdoen, en de verlating zal groot zijn in het binnenste van het land.","13":"Toch zal er nog een tiende deel in zijn, en het zal terugkeren, en zijn om af te weiden; *maar* zoals de eik, en zoals de haageik, waarin na het afwerpen *van* *hun* *bladeren* nog steunsel is, *zo* zal het heilige zaad het steunsel daarvan zijn."},"SV":{"1":"In het jaar, toen de koning Uzzia stierf, zo zag ik den Heere, zittende op een hogen en verheven troon, en Zijn zomen vervullende den tempel.","2":"De serafs stonden boven Hem; een iegelijk had zes vleugelen; met twee bedekte *ieder* zijn aangezicht, en met twee bedekte hij zijn voeten, en met twee vloog hij.","3":"En de een riep tot den ander, en zeide: Heilig, heilig, heilig is de HEERE der heirscharen! De ganse aarde is van Zijn heerlijkheid vol!","4":"Zodat de posten der dorpels zich bewogen van de stem des roependen; en het huis werd vervuld met rook.","5":"Toen zeide ik: Wee mij, want ik verga! dewijl ik een man van onreine lippen ben, en ik woon in het midden eens volks, dat onrein van lippen is; want mijn ogen hebben den Koning, den HEERE der heirscharen gezien.","6":"Maar een van de serafs vloog tot mij, en had een gloeiende kool in zijn hand, *die* hij met de tang van het altaar genomen had.","7":"En hij roerde mijn mond daarmede aan, en zeide: Zie, deze heeft uw lippen aangeroerd; alzo is uw misdaad *van* *u* geweken, en uw zonde is verzoend.","8":"Daarna hoorde ik de stem des Heeren, dewelke zeide: Wien zal Ik zenden, en wie zal voor Ons henengaan? Toen zeide ik: Zie, *hier* ben ik, zend mij henen.","9":"Toen zeide Hij: Ga henen, en zeg tot dit volk: Horende hoort, maar verstaat niet, en ziende ziet, maar merkt niet.","10":"Maak het hart dezes volks vet, en maak hun oren zwaar, en sluit hun ogen, opdat het niet zie met zijn ogen, noch met zijn oren hore, noch met zijn hart versta, noch zich bekere, en Hij het geneze.","11":"Toen zeide ik: Hoe lang, Heere? En Hij zeide: Totdat de steden verwoest worden, zodat er geen inwoner zij, en de huizen, dat er geen mens zij, en dat het land met verwoesting verstrooid worde.","12":"Want de HEERE zal die mensen verre wegdoen, en de verlating zal groot wezen in het binnenste des lands.","13":"Doch nog een tiende deel zal daarin zijn, en het zal wederkeren, en zijn om af te weiden; *maar* gelijk de eik, en gelijk de haageik, in dewelke na de afwerping *der* *bladeren* *nog* steunsel is, *alzo* zal het heilige zaad het steunsel daarvan zijn."},"KJV":{"1":"In the year that king Uzziah died I saw also the Lord sitting upon a throne, high and lifted up, and his train filled the temple.","2":"Above it stood the seraphims: each one had six wings; with twain he covered his face, and with twain he covered his feet, and with twain he did fly.","3":"And one cried unto another, and said, Holy, holy, holy, *is* the LORD of hosts: the whole earth *is* full of his glory.","4":"And the posts of the door moved at the voice of him that cried, and the house was filled with smoke.","5":"Then said I, Woe *is* me! for I am undone; because I *am* a man of unclean lips, and I dwell in the midst of a people of unclean lips: for mine eyes have seen the King, the LORD of hosts.","6":"Then flew one of the seraphims unto me, having a live coal in his hand, *which* he had taken with the tongs from off the altar:","7":"And he laid *it* upon my mouth, and said, Lo, this hath touched thy lips; and thine iniquity is taken away, and thy sin purged.","8":"Also I heard the voice of the Lord, saying, Whom shall I send, and who will go for us? Then said I, Here *am* I; send","9":"And he said, Go, and tell this people, Hear ye indeed, but understand not; and see ye indeed, but perceive","10":"Make the heart of this people fat, and make their ears heavy, and shut their eyes; lest they see with their eyes, and hear with their ears, and understand with their heart, and convert, and be healed.","11":"Then said I, Lord, how long? And he answered, Until the cities be wasted without inhabitant, and the houses without man, and the land be utterly desolate,","12":"And the LORD have removed men far away, and *there be* a great forsaking in the midst of the land.","13":"But yet in it *shall be* a tenth, and *it* shall return, and shall be eaten: as a teil tree, and as an oak, whose substance *is* in them, when they cast *their leaves: so* the holy seed *shall be* the substance"}},"tsk":{"1":[{"kopje":"het jaar","refs":["2 Kon 15:7","2 Kron 26:22","2 Kron 26:23"]},{"kopje":"zag ik","refs":["Ex 24:10","Ex 24:11","Num 12:8","Ezech 1:1","Ezech 1:25-28","Joh 1:18","Joh 12:41","1 Tim 6:16"]},{"kopje":"zitten","refs":["Jes 66:1","1 Kon 22:19","Ezech 10:1","Dan 7:9","Matt 25:31","Openb 3:21","Openb 4:2","Openb 4:10","Openb 5:1","Openb 5:7","Openb 6:16","Openb 7:15-17"]},{"kopje":"hoge","refs":["Jes 12:4","Jes 57:15","Ps 46:11","Ps 108:6","Ps 113:5","Ef 1:20","Ef 1:21"]},{"kopje":"vulden","refs":["1 Kon 8:10","1 Kon 8:11","Openb 15:8"]}],"2":[{"kopje":"stonden","refs":["1 Kon 22:19","Job 1:6","Dan 7:10","Zach 3:4","Luk 1:10","Openb 7:11"]},{"kopje":"serafs","refs":["Ps 104:4","Ezech 1:4","Hebr 1:7"]},{"kopje":"vleugels","refs":["Ex 25:20","Ex 37:9","1 Kon 6:24","1 Kon 6:27","1 Kon 8:7","Ezech 1:6","Ezech 1:9","Ezech 1:24","Ezech 10:21","Openb 4:8"]},{"kopje":"bedekte ieder zijn gezicht","refs":["Gen 17:3","Ex 3:6","1 Kon 19:13","Ps 89:8"]},{"kopje":"zijn voeten","refs":["Job 4:18","Job 15:15","Ezech 1:11"]},{"kopje":"vloog hij","refs":["Jes 6:6","Ps 18:11","Ps 103:20","Ezech 10:16","Dan 9:21","Openb 8:13","Openb 14:6"]}],"3":[{"kopje":"de een riep tot de ander","refs":["Ex 15:20","Ex 15:21","Ezra 3:11","Ps 24:7-10"]},{"kopje":"Heilig","refs":["Ex 15:11","Openb 4:8","Openb 4:9","Openb 15:3","Openb 15:4"]},{"kopje":"de hele aarde","refs":["Jes 11:9","Jes 11:10","Jes 24:16","Jes 40:5","Num 14:21","Ps 19:2- code=\"H136\">Lord,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Whom shall I <span class=\"wl wl-kjv\" data-code=\"H7971\">send,</span> and who will <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> for us? Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> I, Here am I; send","9":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Go,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">tell</span> this <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">Hear</span> ye <span class=\"wl wl-kjv\" data-code=\"H8085\">indeed,</span> but <span class=\"wl wl-kjv\" data-code=\"H995\">understand</span> not; and <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> ye <span class=\"wl wl-kjv\" data-code=\"H7200\">indeed,</span> but perceive","10":"Make the <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> of this <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H8080\">fat,</span> and make their <span class=\"wl wl-kjv\" data-code=\"H241\">ears</span> <span class=\"wl wl-kjv\" data-code=\"H3513\">heavy,</span> and <span class=\"wl wl-kjv\" data-code=\"H8173\">shut</span> their <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes;</span> lest they <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> with their <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> and <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> with their <span class=\"wl wl-kjv\" data-code=\"H241\">ears,</span> and <span class=\"wl wl-kjv\" data-code=\"H995\">understand</span> with their <span class=\"wl wl-kjv\" data-code=\"H3824\">heart,</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">convert,</span> and be healed.","11":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> I, <span class=\"wl wl-kjv\" data-code=\"H136\">Lord,</span> how long? And he <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> Until the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> be <span class=\"wl wl-kjv\" data-code=\"H7582\">wasted</span> without <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitant,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1004\">houses</span> without <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> and the <span class=\"wl wl-kjv\" data-code=\"H127\">land</span> be <span class=\"wl wl-kjv\" data-code=\"H8077\">utterly</span> desolate,","12":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> have <span class=\"wl wl-kjv\" data-code=\"H7368\">removed</span> <span class=\"wl wl-kjv\" data-code=\"H120\">men</span> far <span class=\"wl wl-kjv\" data-code=\"H7368\">away,</span> and there be a <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> <span class=\"wl wl-kjv\" data-code=\"H5805\">forsaking</span> in the <span class=\"wl wl-kjv\" data-code=\"H7130\">midst</span> of the land.","13":"But yet in it shall be a <span class=\"wl wl-kjv\" data-code=\"H6224\">tenth,</span> and it shall <span class=\"wl wl-kjv\" data-code=\"H7725\">return,</span> and shall be <span class=\"wl wl-kjv\" data-code=\"H1197\">eaten:</span> as a teil <span class=\"wl wl-kjv\" data-code=\"H424\">tree,</span> and as an <span class=\"wl wl-kjv\" data-code=\"H437\">oak,</span> whose <span class=\"wl wl-kjv\" data-code=\"H4678\">substance</span> is in them, when they <span class=\"wl wl-kjv\" data-code=\"H7995\">cast</span> their leaves: so the <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> shall be the substance"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Uzzia","tekst":"Hebreeuws, Uzziahu."},{"catchword":"zo zag ik","tekst":"In een profetisch gezicht. Zie Gen 15:1 ."},{"catchword":"den HEERE,","tekst":"Versta, den Vader, Zoon en Heiligen Geest. Vergelijk vs.3, 8; daarom wordt dit gezicht op den Heere Christus geduid; Joh 12:40-41 , en op den Heiligen Geest; Act 28:25-27 ."},{"catchword":"Zijn zomen","tekst":"Dat is, de zomen zijner klederen, te weten der koninklijke klederen, met welke de Heere bekleed was."}],"2":[{"catchword":"De serafs","tekst":"Het Hebreeuwse woord betekent eigenlijk brandende; aldus worden de engelen des Heeren genoemd, omdat zij ijverig zijn, ja in ijver brandende, om het bevel des Heeren uit te richten. Of, omdat zij de goddelozen branden en verteren gelijk een vuur. Of, omdat zij in vurige kleur verschijnen, te weten rood gelijk vuur."},{"catchword":"stonden","tekst":"Te weten gelij dienaars, passende op den dienst des Heeren. Vergelijk Dan 7:10 ; Rev 4:6-7 ."},{"catchword":"een iegelijk","tekst":"Hebreeuws, zes vleugelen, zes vleugelen den enen. Zie de aantekening Gen 7:2 ."},{"catchword":"bedekte ieder","tekst":"Tot een teken van eerbiedigheid, die zij God den Heere toedroegen; of omdat zij den glans der heerlijkheid Gods niet kunnen verdragen."},{"catchword":"vloog hij","tekst":"Te weten om het bevel van God spoediglijk uit te richten; want de engelen zijn dienstbare geesten; Psa 34:8 , en Psa 91:11 ; Heb 1:14 ."}],"3":[{"catchword":"de een riep","tekst":"Hebreeuws, deze riep tot dezen."},{"catchword":"De ganse aarde","tekst":"Hebreeuws, de volheid der ganse aarde [is] zijne eer of heerlijkheid; dat is, al de werken des Heeren, die in den gansen aardbodem zijn, geven getuigenis en zijn een bewijs zijner heerlijkheid; Psa 24:1 ; Rom 1:20 ."}],"4":[{"catchword":"de posten","tekst":"Hiermede wordt te kennen gegeven de heftige toorn Gods, gelijk boven Isa 5:25 :de bergen zijn bewogen. En versta hier, de posten van den tempel."},{"catchword":"des roependen;","tekst":"Dat is, van een ieder der serafim, gelijk vs.3."},{"catchword":"het huis","tekst":"Te weten het huis Gods, dat is de tempel."},{"catchword":"werd vervuld","tekst":"Dit was ook een teken of bewijs van den toorn Gods, rook en damp uitblazende uit zijnen neus."}],"5":[{"catchword":"Toen zeide ik","tekst":"Of, daarom; te weten omdat ik die tekenen van den toorn Gods zag, die vaardig was om zijne oordelen te oefenen."},{"catchword":"ik verga","tekst":"Of, het is met mij gedaan. Anders: ik ben verstomd, of ik ben dood; dat is, ik moet straks sterven, te weten omdat ik, die onrein van lippen ben, den Heere gezien heb. Zie de aantekening Gen 16:13 ; Exo 24:11 , en Deu 5:25-26 ; Jdg 13:22 ."},{"catchword":"dewijl ik","tekst":"Dat is, ik ben een arm zondig mens. Door het gebruik der lippen, dat is, de woorden, waarin de mens lichtelijk valt, verstaat hij zijn gehelen zondigen staat. Vergelijk vs.7, en wijders Jam 3:2 ."},{"catchword":"dat onrein","tekst":"Dat is, een volk, dat de afgoden aanbidt, tot leugen genegen is en traag om den waren God te aanbidden, te eren en te danken en hunnen naaste te stichten."}],"6":[{"catchword":"vloog tot mij,","tekst":"Te weten uit het bevel van God, want zij stonden vaardig nevens den Heere, om zijne bevelen te ontvangen en uit te voeren."},{"catchword":"hij had","tekst":"Deze kool was een teken van de afbranding der zonden, dat is de zuivering en vergeving der zonden."},{"catchword":"het altaar","tekst":"Versta hier, het altaar van het brandoffer, op hetwelk gestadiglijk vuur was, zijnde dit altaar een voorbeeld van Christus en zijne offerande voor onze zonden; zie Heb 13:10 ."}],"7":[{"catchword":"deze","tekst":"Te weten gloeiende kool, die ik van het altaar genomen heb. Hiermede wordt aangewezen dat de vergeving der zonden komt van de offerande van Christus, welke door de offerande des altaars werd afgebeeld; tegelijk, dat de Heilige Geest de zonden, als een vuur, verbrand en verteert."},{"catchword":"is verzoend","tekst":"Anders: genadiglijk bedekt."}],"8":[{"catchword":"de stem des HEEREN,","tekst":"Te weten, de stem van den Vader, den Zoon en den Heiligen Geest aansprekende. Vergelijk dit met Gen 1:26 ."},{"catchword":"Wien zal Ik zenden,","tekst":"Te weten tot het wederspannige Joodse volk, om hetzelve mijn besluit aangaande zijne verblinding en ondergang te verkondigen."},{"catchword":"Ons henengaan?","tekst":"Te weten tot den dienst van God den Vader, den Zoon en den Heiligen Geest, want God is het alleen, die de profeten beroept en zendt. Vergelijk Gen 1:26 , en Gen 3:22 ."},{"catchword":"hier ben ik,","tekst":"De profeet biedt aan hier nu goedwilliglijk zijn vaardigen dienst, zijnde van God gesterkt, veel vaardiger nu zijnde; gelijk Mozes, Exo 3 , of Jeremia, Jer 1 ."}],"9":[{"catchword":"tot dit volk","tekst":"Hier zegt God niet, tot mijn volk, omdat het van Hem geweken was, maar Hij zegt, tot dit volk."},{"catchword":"maar verstaat niet,","tekst":"Alsof God zeide: Gij zult vergeefsen arbeid doen met dit volk te onderwijzen, niettemin ga heen en doe wat Ik u beveel, tot overtuiging van hunne wederspannigheid."},{"catchword":"bemerkt niet","tekst":"Alsof God zeide: Gijlieden zult de woorden dezer profetieën wel horen, maar niet verstaan. En dit zal geschieden door mijn rechtvaardig oordeel, die ulieder wederspannigheid alzo straft, namelijk met blindheid en verharding. In dezen zin worden deze woorden gebruikt in het Nieuwe Testament; Mat 13:14 ."}],"10":[{"catchword":"Maak het hart","tekst":"Te weten door het prediken van mijn Woord. Met deze woorden wil de Heere niet te kennen geven wat zijn gepredikt Woord eigenlijk en van zijne natuur bij de mensen werkt en uitricht; maar Hij voorzegt wat er op de verkondiging ervan bij de boze Joden volgen zou; namelijk dat zij zich daardoor niet alleen niet zouden bekeren, maar nog halsstarriger en weerstrevender aanstellen, dewijl God hen door zijn rechtvaardig oordeel in een verkeerden zin zou overgeven."},{"catchword":"sluit hun ogen,","tekst":"Of, bestrijkt, belijmt hunne ogen."},{"catchword":"Hij","tekst":"Te weten God."},{"catchword":"het","tekst":"Te weten het volk."},{"catchword":"geneze","tekst":"Namelijk door vergiffenis der zonden, Mar 4:12 . Zie Psa 30:3 ."}],"11":[{"catchword":"Hoe lang,","tekst":"Te weten, zal deze verwoesting van het volk duren. Anders: Hoelang zal deze blindheid en verstoktheid van het volk duren?"},{"catchword":"de steden","tekst":"Te weten de steden in Judea."},{"catchword":"verwoest worden,","tekst":"Anders: zekerlijk verwoest worden; te weten door de vele en verscheidene overvallen der vijanden van het Joodse volk. Wat de verblindheid van het volk aangaat, die is dikwijls geweest vóór de komst van Christus, inzonderheid ten tijde van Christus; gelijk blijkt Mat 13:14 ; Mar 4:12 , en elders meer. Ja zij duurt nog heden te dage, gelijk aan verreweg het grootste deel der Joden, die nu leven, te zien is; en zij zal zolang duren, totdat de volheid der heidenen zal ingegaan zijn, Rom 11:25 ."},{"catchword":"met verwoesting","tekst":"Dat is, gans woest gemaakt worden, alzo dat er geen mensen meer in wonen, en het derhalve onbebouwd blijft liggen. Voorbeelden dezer verwoesting zie onder de koningen Hizkia, 2Ki 18 ; Manasse, 2Ch 33 , onder Josia, 2Ch 35 ; onder Joahas, Jojakim, Joachin en Zedekia, 2Ki 25 en 2Ch 36 , en inzonderheid na de hemelvaart van Christus."}],"12":[{"catchword":"die mensen","tekst":"Of, die lieden, te weten het Joodse volk."},{"catchword":"verre wegdoen,","tekst":"Te weten in de Babylonische gevangenschap. Hier geeft de profeet te kennen dat het Gods werk is, dat de Joden zijn weggevoerd geweest."},{"catchword":"de verlating","tekst":"Versta die verlating, waarmede dit volk van God is verlaten en den vijanden overgegeven, ten tijde der Babylonische gevangenschap."},{"catchword":"in het binnenste","tekst":"Of, in het midden des lands, te weten van het land van Judea."}],"13":[{"catchword":"een tiende deel","tekst":"Dat is, een klein hoopje, ten aanzien van het groot getal dergenen, die weggevoerd en vernield zullen worden. De profeet wil zeggen dat dit volk niet allen tegelijk geheellijk zal vergaan."},{"catchword":"het zal wederkeren,","tekst":"Anders: maar het zal weder afgeweid worden. Want sommigen verstaan door dit tiende deel degenen, die na de wegvoering des volks in het land van Juda zijn overgebleven, en vandaar in Egypte getogen en allen ellendiglijk omgekomen. Anderen verstaan door het tiende deel de Joden, die uit de Babylonische gevangenschap zouden wederkeren en veel hebben te lijden van de koningen van Syrië en Egypte, ten tijde der Machabeën, en eindelijk van de Romeinen, en dit alles vanwege hun grote en menigvuldige zonden."},{"catchword":"maar","tekst":"Dit is ene belofte tot troost der vromen, dat namelijk de stam van Juda niet geheel zou te gronde gaan, maar dat hij vanwege de heilige kinderen Gods, die daarin waren, zou behouden en bewaard blijven, totdat Christus in het vlees verschijnen zou."},{"catchword":"de eik . . . de haageik","tekst":"Of, Olmboom. In het Hebreeuws staan twee woorden, die beide een eikenboom betekenen. Voor het ene nemen de overzetters een olmboom; anderen een lindeboom. Anderen leggen de Hebreeuwse woorden aldus uit: Doch gelijk door de eiken, die aan de [poort] Schallecheth staan [de gang] een vast steunsel heeft, [alzo] zal het heilige zaad zijn vaste stut zijn. Naar deze uitlegging vergelijkt hier de profeet de godzaligen bij de eiken, met welke des konings gang onderstut en ondersteund was, of bij den hogen opgeworpen weg of straat, over welken men ging uit Salomo's huis in den tempel, waarvan te lezen is 1Ki 10:5 ; 2Ki 12:20 ; 1Ch 26:16 , en 2Ch 9:4 , 2Ch 9:11 ."},{"catchword":"het heilige zaad","tekst":"Dat is, het overblijfsel der godzaligen, dat is, de godzalige kinderen van godzalige ouders afkomstig; alsof hij zeide: God verdraagt nog enigermate dien verdorven boom, ten aanzien der goede takken, die daaruit gesproten zijn. Om weiniger goeden wil spaart God somtijds vele kwaden; Gen 18:32 ."},{"catchword":"daarvan zijn","tekst":"Te weten van dat land, dat is van de inwoners van dit land. Anders, van dat tiende deel; het komt opeen uit."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"In the year when King Uzzia [Hebr. Uzziahu] died, [see 2 Kings 15.7.] I saw [in a prophetical vision. See Gen.15.on v.1.] the Lord sitting upon an high and exalted throne, [by the LORD is meant here, the Father, Son, and Holy Ghost. Compare vers.3. and 8. Therefore this vision is applied unto Christ, Joh. 12.40,41. And to the Holy Ghost, Act 28:25,26,27.] and his borders [that is, the borders or hems of his garments; to wit, of his royal robes, wherewith the Lord was arrayed] filling the Temple."}],"2":[{"catchword":null,"tekst":"The Seraphims [The Hebrew word signifieth properly burning; thus the Angels of the Lord are called, because they are zealous, yea burning in zeal, to execute the commandment of the Lord: or, because they burn and consume the wicked like a fire; or because they appear in fiery colour, to wit, red, like fire] stood above [or upon] it [to wit, as Ministers or servants tending and waiting upon the service of the Lord. Compare, Dan.7.10. Rev 4:6,7.] each one had six wings: [Heb. Six wings six wings (were) to one. See the annotate. Gen.ch.7.on v.2. compare Rev 4:8.] with twain (every one) covered his face, [in token of reverence which they bare unto God; or because they were not able to endure the brightness of his glory] and with twain he covered his feet, and with twain he did fly. [to wit, to perform the commandment of God speedily. For the Angels are mini-string spirits, Psal.34.8. and 91.11. Heb 1:14.]"}],"3":[{"catchword":null,"tekst":"And the one cried unto the other, [Heb. This cried unto this] and said, Holy, Holy, Holy is the LORD of hosts: [so, Rev 4:8.] The whole earth is full of his glory: [Heb. The fullness of the whole earth (is) his honour, or glory. That is, all the works of the Lord that are in the whole world, they give testimony, and are a clear proof and demonstration of his glory, Psal.24.1. Rom 1:20.]"}],"4":[{"catchword":null,"tekst":"So that the posts of the thresholds were moved, [Hereby is intimated the fierce anger of God, as above, chap.5.v.25. the mountains were moved. And understand here the posts of the Temple] at the voice of him that cried: [that is, of every one of the Seraphims, as v.3.] and the house was filled with smoak. [this was likewise a token or evidence of Gods anger, smoak, and vapour issuing out of his nostrils.]"}],"5":[{"catchword":null,"tekst":"Then said I, [Or, therefore said I; to wit, because I saw those tokens of Gods wrath, who was ready to exercise his judgements] Wo (is) me, for I perish, because I am a man of unclean lips, [or, I am undone. Oth. I am dumb, or tongue-tied, or I am dead; that is, I must presently die; to wit, because I that am a man of unclean lips, have seen the Lord, as straightway followeth. See the annotate, Gen 16:13. and Deut.5.25,26. Exod.24 11. Judg.13.22. (because I am a man of unclean lips) that is, I am a poor sinful man. By the faultiness of the lips; that is, of the words where into a man soon or easily slippeth, doth he understand his whole sinful estate. Compare v.7. and likewise, Jam.3.2.] and I dwell in the midst of a people that is unclean of lips: that is, a people that worshippeth Idols, is bent to lying, and flow or backward to worship, honour, and thank the true God, and to edify their neighbour] for mine eyes have seen the King, the LORD of hosts."}],"6":[{"catchword":null,"tekst":"But one of the Seraphims flew unto me [To wit, by Gods appointment, for they stood by the Lord, ready to receive his commands, and to execute the same at his pleasure] and he had a burning coal in his hand, [this glowing or burning coal was a token of the burning off, or burning away of sin; that is, of the cleansing and pardoning of sin] (which) he had taken with the tongs from off the altar, [understand here the altar of burnt-offering, upon which fire was continually kept, this altar being a type of Christ, and of his sacrifice for our sins, Heb 13:10.]"}],"7":[{"catchword":null,"tekst":"And he touched my mouth therewith, [Compare Jer 1:9. Dan.10.16.] and said, Lo, this hath touched thy lips: so thine offence is departed (from thee) and thy sin is purged. [oth. Graciously covered. This, &c. To wit, this glowing or burning-coal, which I have taken from off the Alter. Hereby is signified, that the pardon of sin proceedeth from the sacrifice & offering of Christ, which was shadowed out by the sacrifices and offerings of the Altar. In like manner, that the Holy Ghost like unto a fire, burneth away sins, and consumeth them.]"}],"8":[{"catchword":null,"tekst":"Then I heard the voice of the Lord, who said, [To wit, the voice of the Father speaking to the Son, and the Holy Ghost, Compare this with Genes.1.26.] Whom shall I send? [to wit, unto the rebellious people of the Jews, to preach and declare unto them my decree concerning their blinding and ruin] and who shall go for us? [to wit, in the service of God, the father, the Son, and the Holy Ghost: for it is God alone that calleth and sendeth the prophet doth now here freely offer his ready service, being strengthened and confirmed by God, being now far more willing and ready to go upon the Lords errand or message, then either Moses or Jeremy was, Exod.3. and Jerem.1.]"}],"9":[{"catchword":null,"tekst":"Then said he, Go, and say unto this people, [Here the Lord saith not, Unto my people, because they were gone away from him; but he saith, Unto this people] hearing hear, but understand not, and seeing see, but perceive not. [as if the Lord should say, Thou shalt not labour in vain, in teaching and instructing this people, nevertheless go thy ways, and do that which I combellion. (hearing hear, but understand not, etc.) As if the Lord should say, Ye shall indeed hear the words of these Prophecies, but not understand them: and this shall be my just judgement, who will in this manner punish your stubbornness and rebellion, namely, with blindness and hardening. In this sense are the se words used in the New Testament, Mat 13:14. Mark 4.12. Luk 8:10. Joh 12:40. Act 28:26. Rom 11:8.]"}],"10":[{"catchword":null,"tekst":"Make the heart of this people fat, and make their ears heavy, and shut their eyes, [Or, anoint, besmear, lime their eyes] lest they see with their eyes, and hear with their ears, and understand with their heart, and convert, and he [to wit, God] heal [namely, by forgiving their sins, Mark 4.12. See Psal.30.3.] them. [to wit, the people. Make the heart, &c. To wit, by the preaching of my word. By these words the Lord will not signify what his Word preached properly, and in its own nature worketh and effecteth in men: but he foretelleth what should follow upon the preaching of it in the wicked Jews, namely, that they should thereby onely convert themselves, but grow rather yet more stubborn, and more obstinate, because God in his just judgement would give them up to a perverse and reprobate mind.]"}],"11":[{"catchword":null,"tekst":"Then said I, Lord, how long? [To wit, shall this desolation of the people continue. Oth. How long shall this blindness and hardness of the people last?] and he said, Until the Cities [to wit, the cities in Juda] be wasted, [oth. Be surely wasted; to wit, by the many and divers assaults of the enemies of the people of the Jews. As touching the blindness of the people; to wit, of the Jews, the same often happened before the coming Christ; especially in Christ&acirc;&euro;&trade;s time, as appeareth, Mat 13:14. Mark 4.12. and elsewhere: yea, it continueth still unto this day, as appeareth in the greatest part (by far) of the Jews that are this day alive; and shall continue still so long, until the fullness of the Gentiles shall be come in, Rom, 11.25.] so that there to be no inhabitant, and the houses (so) that there be no man, and that the land be destroyed with desolation. [that is, be utterly wasted, so that no man do dwell any more in it, and therefore the same lieth still untilled and unmanured. Examples of this desolation see in the reign of King Hizkia, 2 Kings 18. Of Manasseh, 2 Chron.33. of Josiah, 2 Chron.35. of J // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);

  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)

}

function plaatsPopup(el, html) {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;

function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);

const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // slug -> volledige boeknaam (voor citaten met de volle boeknaam i.p.v. de afkorting)
  const boeknaamPerSlug = {};
  (D.meta.boeken || []).forEach(b => {
    const m = b.href.match(/^\.\.\/\.\.\/([^/]+)\//);
    if (m) boeknaamPerSlug[m[1]] = b.naam;
  });
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const naam = boeknaamPerSlug[ref.slug] || chip.textContent.replace(/\s+\d+:\d+.*$/, '');
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${naam} ${ref.hfd}:${ref.vers}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
