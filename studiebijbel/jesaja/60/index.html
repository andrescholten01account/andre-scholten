:"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Maak u op, word verlicht, want uw licht komt, en de heerlijkheid van de HEERE gaat over u op.","2":"Want zie, de duisternis zal de aarde bedekken, en donkerheid de volken; maar over u zal de HEERE opgaan, en Zijn heerlijkheid zal over u gezien worden.","3":"En de heidenen zullen naar uw licht gaan, en koningen naar de glans die over u is opgegaan.","4":"Hef uw ogen rondom op, en zie: die allen zijn samengebracht, zij komen tot u; uw zonen zullen van verre komen, en uw dochters zullen aan *uw* zijde grootgebracht worden.","5":"Dan zult u het zien en stralen[1], en uw hart zal vervaard zijn en verwijd worden; want de menigte van de zee zal tot u gekeerd worden, het leger van de heidenen zal tot u komen.","6":"Een menigte kamelen zal u bedekken, de snelle kamelen van Midian en Hefa; zij allen uit Scheba zullen komen; goud en wierook zullen zij aanbrengen, en zij zullen de overvloedige lof van de HEERE verkondigen.","7":"Al de schapen van Kedar zullen tot u verzameld worden; de rammen van Nebajoth zullen u dienen; zij zullen met welgevallen op Mijn altaar komen, en Ik zal het huis van Mijn heerlijkheid heerlijk maken.","8":"Wie zijn deze, die daar komen aangevlogen als een wolk, en als duiven naar hun vensters?","9":"Want de eilanden zullen Mij verwachten, en de schepen van Tarsis vooreerst, om uw kinderen van verre te brengen, hun zilver en hun goud met hen, tot de Naam van de HEERE, uw God, en tot de Heilige van Israël, omdat Hij u heerlijk gemaakt heeft.","10":"En de vreemden zullen uw muren bouwen, en hun koningen zullen u dienen; want in Mijn verbolgenheid heb Ik u geslagen, maar in Mijn welbehagen heb Ik Mij over u ontfermd.","11":"En uw poorten zullen steeds openstaan, zij zullen overdag of 's nachts niet gesloten worden, opdat men bij u het leger van de heidenen inbrengt, en hun koningen naar u toe geleid worden.","12":"Want het volk en het koninkrijk die u niet zullen dienen, die zullen vergaan; en die volken zullen helemaal verwoest worden.","13":"De heerlijkheid van Libanon zal tot u komen, de dennenboom, de beukenboom en de busboom tegelijk, om de plaats van Mijn heiligdom te versieren, en Ik zal de plaats van Mijn voeten heerlijk maken.","14":"Ook zullen, zich buigend, tot u komen de kinderen van hen die u onderdrukt hebben, en allen die u gelasterd hebben zullen zich neerbuigen aan de zolen van uw voeten; en zij zullen u noemen: de stad van de HEERE, het Sion van de Heilige van Israël.","15":"In plaats dat u verlaten en gehaat bent geweest, zodat niemand door u heen ging, zo zal Ik u stellen tot een eeuwige heerlijkheid, tot een vreugde van geslacht tot geslacht.","16":"En u zult de melk van de heidenen zuigen, en u zult de borsten van de koningen zuigen; en u zult weten dat Ik de HEERE ben, uw Heiland, en uw Verlosser, de Machtige van Jakob.","17":"Voor koper zal Ik goud brengen, en voor ijzer zal Ik zilver brengen, en voor hout koper, en voor stenen ijzer; en Ik zal uw opzieners vreedzaam maken, en uw drijvers rechtvaardig.","18":"Er zal geen geweld meer gehoord worden in uw land, verwoesting noch verbreking in uw gebied; maar uw muren zult u Heil noemen, en uw poorten Lof.","19":"De zon zal voor u niet meer zijn tot een licht overdag, en tot een glans zal de maan u niet lichten; maar de HEERE zal u tot een eeuwig licht zijn, en uw God tot uw sierlijkheid.","20":"Uw zon zal niet meer ondergaan, en uw maan zal haar *licht* niet intrekken; want de HEERE zal u tot een eeuwig licht zijn, en de dagen van uw treuren zullen een einde nemen.","21":"En uw volk zullen allen samen rechtvaardig zijn, zij zullen voor eeuwig de aarde erfelijk bezitten; zij zullen zijn een scheut van Mijn planting, een werk van Mijn handen, opdat Ik verheerlijkt word.","22":"De kleinste zal tot duizend worden, en de minste tot een machtig volk; Ik, de HEERE, zal dat op Zijn tijd snel doen komen."},"SV":{"1":"Maak u op, word verlicht, want uw Licht komt, en de heerlijkheid des HEEREN gaat over u op.","2":"Want zie, de duisternis zal de aarde bedekken, en donkerheid de volken; doch over u zal de HEERE opgaan, en Zijn heerlijkheid zal over u gezien worden.","3":"En de heidenen zullen tot uw licht gaan, en koningen tot den glans, die u is opgegaan.","4":"Hef uw ogen rondom op, en zie, die allen zijn vergaderd, zij komen tot u; uw zonen zullen van verre komen, en uw dochters zullen aan *uw* zijde gevoedsterd worden.","5":"Dan zult gij het zien en samenvloeien, en uw hart zal vervaard zijn en verwijd worden; want de menigte der zee zal tot u gekeerd worden, het heir der heidenen zal tot u komen.","6":"Een hoop kemelen zal u bedekken, de snelle kemelen van Midian en Hefa; zij allen uit Scheba zullen komen; goud en wierook zullen zij aanbrengen, en zij zullen den overvloedigen lof des HEEREN boodschappen.","7":"Al de schapen van Kedar zullen tot u verzameld worden; de rammen van Nebajoth zullen u dienen; zij zullen met welgevallen komen op Mijn altaar, en Ik zal het huis Mijner heerlijkheid heerlijk maken.","8":"Wie zijn deze, *die* daar komen gevlogen als een wolk, en als duiven tot haar vensters?","9":"Want de eilanden zullen Mij verwachten, en de schepen van Tarsis vooreerst, om uw kinderen van verre te brengen, hun zilver en hun goud met hen, tot den Naam des HEEREN uws Gods, en tot den Heilige Israëls, dewijl Hij u heerlijk gemaakt heeft.","10":"En de vreemden zullen uw muren bouwen, en hun koningen zullen u dienen; want in Mijn verbolgenheid heb Ik u geslagen, maar in Mijn welbehagen heb Ik Mij over u ontfermd.","11":"En uw poorten zullen steeds openstaan, zij zullen des daags of des nachts niet toegesloten worden; opdat men tot u inbrenge het heir der heidenen, en hun koningen *tot* *u* geleid worden.","12":"Want het volk en het koninkrijk, welke u niet zullen dienen, die zullen vergaan; en die volken zullen gans verwoest worden.","13":"De heerlijkheid van Libanon zal tot u komen, de denneboom, de beuke *boom* en de busboom te gelijk, om te versieren de plaats Mijns heiligdoms, en Ik zal de plaats Mijner voeten heerlijk maken.","14":"Ook zullen, zich buigende, tot u komen de kinderen dergenen, die u onderdrukt hebben, en allen, die u gelasterd hebben zullen zich nederbuigen aan de planten uwer voeten; en zij zullen u noemen de stad des HEEREN, het Sion van den Heilige Israëls.","15":"In plaats dat gij verlaten en gehaat zijt geweest, zodat niemand door *u* henen ging, zo zal Ik u stellen tot een eeuwige heerlijkheid, *tot* een vreugde van geslacht tot geslacht.","16":"En gij zult de melk der heidenen zuigen, en gij zult de borsten der koningen zuigen; en gij zult weten, dat Ik de HEERE ben, uw Heiland, en uw Verlosser, de Machtige Jakobs.","17":"Voor koper zal Ik goud brengen, en voor ijzer zal Ik zilver brengen, en voor hout koper, en voor stenen ijzer; en zal uw opzieners vreedzaam maken, en uw drijvers rechtvaardigen.","18":"Er zal geen geweld meer gehoord worden in uw land, verstoring noch verbreking in uw landpale; maar uw muren zult gij Heil heten, en uw poorten Lof.","19":"De zon zal u niet meer wezen tot een licht des daags, en tot een glans zal u de maan niet lichten; maar de HEERE zal u wezen tot een eeuwig Licht, en uw God tot uw Sierlijkheid.","20":"Uw zon zal niet meer ondergaan, en uw maan zal haar *licht* niet intrekken; want de HEERE zal u tot een eeuwig licht wezen, en de dagen uwer treuring zullen een einde nemen.","21":"En uw volk zullen allen te zamen rechtvaardigen zijn, zij zullen in eeuwigheid de aarde erfelijk bezitten; zij zullen zijn een spruit Mijner plantingen, een werk Mijner handen, opdat Ik verheerlijkt worde.","22":"De kleinste zal tot duizend worden, en de minste tot een machtig volk; Ik, de HEERE, zal zulks te zijner tijd snellijk doen komen."},"KJV":{"1":"Arise, shine; for thy light is come, and the glory of the LORD is risen","2":"For, behold, the darkness shall cover the earth, and gross darkness the people: but the LORD shall arise upon thee, and his glory shall be seen","3":"And the Gentiles shall come to thy light, and kings to the brightness of thy rising.","4":"Lift up thine eyes round about, and see: all they gather themselves together, they come to thee: thy sons shall come from far, and thy daughters shall be nursed at *thy* side.","5":"Then thou shalt see, and flow together, and thine heart shall fear, and be enlarged; because the abundance of the sea shall be converted unto thee, the forces of the Gentiles shall come","6":"The multitude of camels shall cover thee, the dromedaries of Midian and Ephah; all they from Sheba shall come: they shall bring gold and incense; and they shall shew forth the praises of the LORD.","7":"All the flocks of Kedar shall be gathered together unto thee, the rams of Nebaioth shall minister unto thee: they shall come up with acceptance on mine altar, and I will glorify the house of my glory.","8":"Who *are* these *that* fly as a cloud, and as the doves to their windows?","9":"Surely the isles shall wait for me, and the ships of Tarshish first, to bring thy sons from far, their silver and their gold with them, unto the name of the LORD thy God, and to the Holy One of Israel, because he hath glorified","10":"And the sons of strangers shall build up thy walls, and their kings shall minister unto thee: for in my wrath I smote thee, but in my favour have I had mercy","11":"Therefore thy gates shall be open continually; they shall not be shut day nor night; that *men* may bring unto thee the forces of the Gentiles, and *that* their kings *may be* brought.","12":"For the nation and kingdom that will not serve thee shall perish; yea, *those* nations shall be utterly wasted.","13":"The glory of Lebanon shall come unto thee, the fir tree, the pine tree, and the box together, to beautify the place of my sanctuary; and I will make the place of my feet glorious.","14":"The sons also of them that afflicted thee shall come bending unto thee; and all they that despised thee shall bow themselves down at the soles of thy feet; and they shall call thee, The city of the LORD, The Zion of the Holy One of Israel.","15":"Whereas thou hast been forsaken and hated, so that no man went through *thee*, I will make thee an eternal excellency, a joy of many generations.","16":"Thou shalt also suck the milk of the Gentiles, and shalt suck the breast of kings: and thou shalt know that I the LORD *am* thy Saviour and thy Redeemer, the mighty One of Jacob.","17":"For brass I will bring gold, and for iron I will bring silver, and for wood brass, and for stones iron: I will also make thy officers peace, and thine exactors righteousness.","18":"Violence shall no more be heard in thy land, wasting nor destruction within thy borders; but thou shalt call thy walls Salvation, and thy gates Praise.","19":"The sun shall be no more thy light by day; neither for brightness shall the moon give light unto thee: but the LORD shall be unto thee an everlasting light, and thy God thy glory.","20":"Thy sun shall no more go down; neither shall thy moon withdraw itself: for the LORD shall be thine everlasting light, and the days of thy mourning shall be ended.","21":"Thy people also *shall be* all righteous: they shall inherit the land for ever, the branch of my planting, the work of my hands, that I may be glorified.","22":"A little one shall become a thousand, and a small one a strong nation: I the LORD will hasten it in his time."}},"tsk":{"1":[{"kopje":"Maak u op","refs":["Jes 52:1","Jes 52:2","Matt 5:16","Ef 5:8","Ef 5:14","Fil 2:15"]},{"kopje":"word verlicht, want uw licht komt","refs":["Jes 60:19","Jes 60:20","Jes 9:1","Matt 4:16","Luk 1:78","Luk 1:79","Joh 1:9","Jo  kennis en wetenschap dan gij tot nog toe gehad hebt; gelijk de klaarheid van den dag verlicht of vermeerderd wordt als de zon opgaat."},{"catchword":"uw Licht komt,","tekst":"Te weten Christus Jezus, die het licht der wereld is, hetwelk de harten der uitverkorenen verlicht met ware kennis Gods. Zie Luk 2:32 ; Joh 1:9 en Joh 8:12 ; en Eph 5:14 ; of, de tijd uwer verlossing is gekomen."},{"catchword":"de heerlijkheid","tekst":"Vergelijk hiermede Rev 21:11 ."},{"catchword":"gaat over u op","tekst":"Te weten gelijk een klaarschijnende zon, die haar licht wijd en breed uitspreidt."}],"2":[{"catchword":"de duisternis . . . donkerheid","tekst":"Dat is, onwetendheid, of onverstand. Vergelijk Eph 4:18 , en Eph 5:11 ; Rev 16:10 . De mensen zijn vol blindheid en onwetendheid, en kennen hunnen God en Heiland niet, tot de Heere hen verlicht."},{"catchword":"de aarde . . . de volken","tekst":"Te weten alle inwoners der aarde, en die volken, of al die natiën, die in de duisternis hunner onwetendheid blijven steken, verwerpende de genade der predikatie van het heilig Evangelie."},{"catchword":"de HEERE","tekst":"Dat is, de kennis van den Heere Jezus Christus."},{"catchword":"opgaan,","tekst":"Als een zon. Zie Psa 84:12 ."},{"catchword":"over u","tekst":"Of, op u verschijnen."}],"3":[{"catchword":"tot uw licht gaan,","tekst":"Of, in, of bij uw licht. De zin is: De heidenen zullen ook verlicht worden met de ware kennis Gods, door de predikatie van het heilig Evangelie, hetwelk onder u zal gepredikt worden. Vergelijk Rev 21:24 . Zie ook Isa 49:6 ."},{"catchword":"die u is","tekst":"Hebreeuws, van uwen opgang."}],"4":[{"catchword":"Hef uw ogen","tekst":"Dit spreekt de profeet, als zich verwonderende over het groot getal der mensen, die uit alle kanten der wereld tot Christus zouden komen; Isa 49:18 , Isa 49:22-23 ."},{"catchword":"die allen","tekst":"Te weten heidenen en koningen."},{"catchword":"tot u;","tekst":"Of, uwenthalve."},{"catchword":"uw zonen","tekst":"Dat is, de gelovigen onder de heidenen, die tot de kerk Gods behoren."},{"catchword":"gevoedsterd","tekst":"Of, opgevoed, of opgetogen worden; gelijk Isa 49:22 ; zie Num 11:12 ."}],"5":[{"catchword":"zien en","tekst":"Te weten met verwondering."},{"catchword":"samenvloeien,","tekst":"Dat is, met menigten samenlopen, uit verwondering; anders: uitbreken; te weten als een stroom, of als het licht, of als de zon; anders: schijnen, lichten, verlicht worden. Zie de aantekening Psa 34:6 ."},{"catchword":"zal vervaard","tekst":"Niet als iets kwaads vrezende, maar van verwondering over zulk een onverwachte zaak, te weten als gij zien zult welk een grote menigte van verscheidene volken en natiën tot den Heere Christus komen. Zie Jer 33:9 ; Hos 3:4 . Zie ook Act 2:7 ."},{"catchword":"verwijd","tekst":"Te weten zijnde vol vreugde en blijdschap."},{"catchword":"de menigte","tekst":"Dat is, de menigte dergenen, die aan de zee wonen. Anders: de rijkdom der zee. Men kan het Hebreeuwse woord hier in beide betekenissen nemen."},{"catchword":"tot u gekeerd","tekst":"Of, tegen u, of te uwaarts veranderd worden, alzo namelijk dat degenen, die uwe vijanden waren, uwe vrienden zullen worden."},{"catchword":"het heir","tekst":"Of, de rijkdom der volken; zie Rev 21:26 ."},{"catchword":"tot u komen","tekst":"Te weten om vriendschap met u te maken, uwe religie aannemende."}],"6":[{"catchword":"u bedekken,","tekst":"Dat is, uw land. In dit en enige der naastvolgende verzen wordt met verbloemde woorden voorzegd dat alle natiën zich zullen begeven onder de gehoorzaamheid van het heilig Evangelie."},{"catchword":"de snelle kemelen","tekst":"Zie Jer 2:23 ."},{"catchword":"van Midian","tekst":"Dat is, uit het land der Midianieten, alwaar grote menigten van kemels en dromedarissen waren. Zie 1Ch 5:21 ; zie ook Jdg 6:3 , Jdg 6:5 ."},{"catchword":"Hefa;","tekst":"Hefa was de zoon van Midian, Gen 25:4 , zijne nakomelingen woonden onder de Midianieten, behoudende nochtans de naam van hunnen voorvader Hefa."},{"catchword":"zij allen","tekst":"Dat is, een grote menigte derzelven, gelijk Mat 3:5 ."},{"catchword":"uit Scheba","tekst":"Dat is, uit het land der Schabeën, nakomelingen van Scheba, den zoon van Raema, den zoon van Chus, den zoon van Cham; Gen 10:6-7 ."},{"catchword":"zullen komen;","tekst":"Te weten tot de gemeenschap der kerk. Dit wordt ook van hunne koningen gezegd; Psa 72:10 ."},{"catchword":"goud","tekst":"Dat is zij zullen hunne rijkdommen gebruiken tot den godsdienst, tot onderhouding der kerk en leraars, alsook der arme ledematen der gemeente."},{"catchword":"den overvloedigen","tekst":"Dat is, de weldaden Gods, die lof en prijs waardig zijn."},{"catchword":"boodschappen","tekst":"Dat is, prediken, als een blijde boodschap verkondigen."}],"7":[{"catchword":"Kedar","tekst":"Dat is, der Kedarenen. Van deze volken, zie de aantekening Psa 120:5 ; zij waren Ismaëlieten in Arabië, nakomelingen van Abraham uit Ketura. Zie Isa 21:13 , Isa 21:17 ; Jer 49:28-29 , Jer 49:32 ."},{"catchword":"Nebájoth","tekst":"Dat is, der Nebathieten, in het steenachtige Arabië; zij waren nakomelingen van Nebajoth, den zoon van Ismaël, Gen 25:13 . Hier wordt geprofeteerd dat Abrahams zaad naar het vlees ook zijne kinderen naar het geloof worden en God dienen zouden met den geestelijken godsdienst van het Nieuwe Testament. Vergelijk Mal 1:11 ."},{"catchword":"met welgevallen","tekst":"Of, met gunst, met geneigden wil; alzo dat mij hun godsdienst aangenaam is."},{"catchword":"komen op Mijn altaar,","tekst":"Dat is, geofferd worden. De zin is: dat die natiën zichzelven vrijwilliglijk op het altaar van Christus zouden overgeven tot een levende, heilige en Gode welbehagende offerande, gelijk de apostel spreekt Rom 12:1 ."},{"catchword":"het huis","tekst":"Of, mijn heerlijk huis, dat is mijne kerk, of gemeente der gelovigen, gebouwd van levende stenen, 1Pe 2:5 ."}],"8":[{"catchword":"Wie zijn deze,","tekst":"De kerk verwondert zich over haar snellen aanwas. Zie Isa 49:21 ."},{"catchword":"daar komen","tekst":"Dat is, die daar met hopen aankomen en zich uit de heidenen tot de Christelijke gemeente begeven?"},{"catchword":"gevlogen","tekst":"De profeet gebruikt het woord vliegen, om aan te wijzen dat degenen, die zich tot den Heere Christus bekeren zouden, zozeer gewillig en begerig zouden zijn om tot Hem te komen, dat zij meer zouden schijnen snellijk te vliegen dan tot Hem te gaan."},{"catchword":"als een wolk,","tekst":"Dat is, openlijk en snellijk en ook in grote menigte. Alzo staat er Heb 12:1 . Een wolk der getuigenissen; dat is een groot getal van getuigenissen."},{"catchword":"tot haar vensters?","tekst":"Of, tot hare gaten, of holen, waar zij in wonen en hare nesten hebben."}],"9":[{"catchword":"Want","tekst":"Of, voorwaar."},{"catchword":"de eilanden","tekst":"Dat is, de inwoners der eilanden; dat is, die in verre landen wonen. Zie boven Isa 42:4 , en Isa 51:5 ."},{"catchword":"de schepen","tekst":"Dat is, die in de schepen van Tharsis varen. Zie van Tharsis de aantekening 1Ki 10:22 . Zie ook Psa 48:8 ."},{"catchword":"uw kinderen","tekst":"Dat is, degenen die van u, als van eene moeder, zullen geboren worden door het zaad van het goddelijke Woord, gelijk boven vs.4."},{"catchword":"tot den Naam des HEEREN . . . tot den Heilige Israëls","tekst":"Of, vanwege den naam des Heeren, en vanwege den Heilige Israëls. De naam des heren betekent hier den Heere zelf. Zie 2Sa 7:13 , vergeleken met 1Ch 17:12 ; zie ook Act 9:15 ."},{"catchword":"heerlijk gemaakt heeft","tekst":"Of, zal heerlijk gemaakt hebben, of, dewijl Hij u versierd heeft, of versieren zal; te weten door de predikatie van het heilig Evangelie, die in u zal gehoord worden, in en door welke de rechte hemelse wijsheid wordt voorgedragen, u strekkende tot een heerlijk sieraad."}],"10":[{"catchword":"de vreemden","tekst":"Dit is ten dele vervuld geworden als Cyrus en Darius den Joden hulp gedaan hebben tot wederopbouwing van de stad Jeruzalem en des tempels, maar inzonderheid is het in het Nieuwe Testament vervuld geworden, want velen onder de heidenen, tot Christus bekeerd zijnde, hebben mede de hand geboden tot opbouwing van het geestelijke Jeruzalem."},{"catchword":"in Mijn welbehagen","tekst":"Of, in mijne goedertierenheid, dat men kan verstaan van den tijd des welbehagens. Zie Psa 69:14 ."}],"11":[{"catchword":"En uw poorten","tekst":"Dit is te verstaan van de gelegenheid der kerk in deze wereld, betekenende dat de ingang in de Christelijke kerk voor de godzaligen zou openstaan; Isa 26:2 . De apostel Johannes past dit op het hemelse Jeruzalem, of de triomferende kerk; Rev 21:25 ."}],"12":[{"catchword":"welke u","tekst":"Dat is, welke zich aan het rijk van Christus niet willen onderwerpen."},{"catchword":"die zullen vergaan;","tekst":"Want buiten de kerk Gods is er gene zaligheid. Die behouden worden, die worden gezegd de kerk toegedaan te worden; Act 2:47 ; Rev 21:24 ."},{"catchword":"zullen gans","tekst":"Of, zullen gans en al vergaan. Hebreeuws, verwoestende verwoest worden, of met verwoesting verwoest worden; te weten die u niet willen dienen. Vergelijk Psa 37:22 ."}],"13":[{"catchword":"De heerlijkheid","tekst":"Dat is, de heerlijke hoge bomen, de schoonste, die op den berg Libanon wassen; Psa 29:5 . Gelijk deze zijn gebruikt tot den bouw van den tempel te Jeruzalem; 1Ki 5:6 , 1Ki 5:9 , 1Ki 5:14 , alzo zullen voortreffelijke mannen, die met zonderlinge gaven van den Heiligen Geest begaafd zijn, gebruikt worden tot opbouwing der gemeente van Jezus Christus; ja ook koningen, vorsten en groten dezer wereld, Isa 61:3 , worden de godzaligen genaamd bomen."},{"catchword":"de beukeboom","tekst":"Of, pijnappelboom."},{"catchword":"de plaats mijns","tekst":"Dat is, het heiligdom. Want aldaar zat de Heere op de ark des verbonds. Doch hier wordt gesproken van de Christelijke kerk, in welke God woont door zijnen Geest; 2Co 6:16 ."},{"catchword":"de plaats Mijner","tekst":"Aldus wordt de kerk Gods elders genoemd. Zie Eze 43:7 ."}],"14":[{"catchword":"zich buigende,","tekst":"Dat is, met grote deemoedigheid. Zie Rev 3:9 ; zie ook Psa 22:28 , Psa 22:30 ; Isa 45:15 , en Isa 49:23 ."},{"catchword":"gelasterd","tekst":"Of, versmaad hebben."},{"catchword":"zullen zich nederbuigen","tekst":"Dat is, zij zullen u eren, vanwege en in den naam van uw Hoofd Jezus Christus."},{"catchword":"de stad des HEEREN,","tekst":"Van den Heere gebouwd en bewoond; Psa 147:2 , Psa 147:12 ; Eze 48:35 ."},{"catchword":"het Sion","tekst":"Aldus wordt de kerk Gods onder het Evangelie genoemd; Heb 12:22 ; Rev 14:1 . Van den berg Zion, die een afbeelding der kerk van Christus geweest is, zie Psa 2:6 ."}],"15":[{"catchword":"verlaten","tekst":"Te weten van God als van uw echten man. Versta hier, zoveel het uiterlijke belangt; want God haat en verlaat de gemeente der uitverkorenen nimmermeer."},{"catchword":"zodat niemand","tekst":"Hij vergelijkt het volk Gods bij ene stad, liggende woest en onbewoond."},{"catchword":"heerlijkheid,","tekst":"Of, hoogheid, voortreffelijkheid."},{"catchword":"tot","tekst":"Dat is, Ik zal u zodanig maken, dat alle heiligen zich over u steeds zullen verheugen. Zie de aantekening Psa 12:8 ."}],"16":[{"catchword":"gij zult de melk","tekst":"Dat is, de heidenen en de koningen, die zich tot Christus zullen bekeren, zullen u onderhouden en bevorderlijk zijn. Zie Isa 49:23 ."},{"catchword":"de borsten","tekst":"Rev 21:24 staat, de heerlijkheid en eer der koningen."},{"catchword":"de Machtige Jakobs","tekst":"Jakob is de eerste, die aan God dezen titel gegeven heeft; Gen 49:24 . Zie Psa 132:2 , Psa 132:5 ."}],"17":[{"catchword":"koper","tekst":"Eene profetie van de gelukkige verwisseling van den stand der kerk, door Christus vernieuwd zijnde, dat zij inplaats van vleselijke ceremoniën en een wereldlijk heiligdom, geestelijke en hemelse ordinantiën zullen genieten. Zie Heb 9:1 , Heb 9:9-12 , Heb 9:23 , enz., en Heb 12:18 , Heb 12:22 , Heb 12:28 ."},{"catchword":"uw opzieners","tekst":"Of, voorstanders. Hebreeuws, opzicht."},{"catchword":"vreedzaam maken,","tekst":"Hebreeuws, vrede; dat is, mannen van den vrede, voorstanders van den vrede, die den vrede prediken of verkondigen; Rom 10:15 . Of, die tot vrede geneigd zijn. Zie Psa 109:4 , en Psa 120:7 . Zie ook Job 35:13 ."},{"catchword":"uw drijvers","tekst":"Dit is hetzelfde woord, dat Exo 3:7 gebruikt wordt, en het betekent hier zowel de zielzorgers als de Christelijke overheden, die het volk ter gerechtigheid drijven en houden."},{"catchword":"rechtvaardigen","tekst":"Hebreeuws, rechtvaardigheid."}],"18":[{"catchword":"Er zal geen","tekst":"Dit alles, en het voorgaande zal volkomenlijk in het eeuwige leven volbracht worden. Vergelijk Eze 45:8 ."},{"catchword":"uw muren","tekst":"Dat is, uwe muren, [die groot en hoog zullen zijn, in wier fondament de namen van de twaalf apostelen van het Lam zijn; Rev 21:12 , Rev 21:14 ] , zullen uwe inwoners zo wel beschermen, alsof zij in een sterke welbemuurde stad woonden."},{"catchword":"en uw poorten","tekst":"Welke twaalf zullen wezen elk van bijzondere paarlen; Rev 21:21 . De zin is: Gij zult steeds oorzaak en aanleiding hebben den Heere in uwe poorten te loven. Zie Psa 9:15 ."}],"19":[{"catchword":"De zon","tekst":"Die stad heeft niet van node dat de zon of maan daarin schijnen, want God zal daarin alles in allen zijn; 1Co 15:28 ; Rev 21:23 , en Rev 22:5 . Eenigen verstaan hier door de zon en maan al de wereldse heerlijkheid en glorie, het koninkrijk, het heiligdom, ceremoniën, enz."},{"catchword":"de HEERE","tekst":"Voor de Heere, staat Rev 21:23 :de heerlijkheid Gods."},{"catchword":"uw God","tekst":"Dat is, het Lam, Jezus Christus, die het licht of de kaars dier stad is; Rev 21:23 ."}],"20":[{"catchword":"Uw zon","tekst":"Dat is, uw God [die uw zon wil wezen, Psa 84:12 ] , zal niet meer het licht zijns aanschijns van u nemen."},{"catchword":"uw maan","tekst":"Hebreeuws, uwe maan zal niet verzameld worden; dat is, haar licht niet inhouden, of niet weggenomen, niet geweerd worden. Vergelijk Joe 2:10 ."},{"catchword":"tot een eeuwig","tekst":"Hebreeuws, tot een licht der eeuwigheid."},{"catchword":"uwer treuring","tekst":"Of, van uwen rouw, of van uw leed."},{"catchword":"zullen een einde nemen","tekst":"Of, zullen voleind zijn. Hebreeuws, zullen volkomen zijn; vergelijk Rev 21:4 . Zie ook Isa 61:2-3 ."}],"21":[{"catchword":"uw volk","tekst":"Te weten alle oprechte ledematen der Christelijke kerk."},{"catchword":"rechtvaardigen zijn,","tekst":"Te weten door het geloof aan Christus Jezus, die hun zijne gerechtigheid schenkt en zijn Heiligen Geest mededeelt, opdat zij zich hunner gerechtigheid en heiligheid benaarstigen; Rom 1:17 , en Rom 5:19 ."},{"catchword":"erfelijk bezitten;","tekst":"Of, als ene erve bezitten. De zin is: In dit leven zullen zij in mijne kerk blijven, en hiernamaals zullen zij het eeuwig koninkrijk der hemelen beërven, van welke beide het land Kanaän een voorbeeld geweest is; zie dergelijke beloftenissen Psa 37:29 ; Isa 57:13 ; Rev 21:7 ."},{"catchword":"spruit","tekst":"Dat is, uw volk zal zijn ene plant of spruit van God, als den akkerman, geplant in Christus den waren wijnstok; Joh 15:1-2 ."},{"catchword":"een werk","tekst":"Geschapen in Christus Jezus tot goede werken; Eph 2:10 . Zie Isa 29:23 ."},{"catchword":"opdat Ik","tekst":"Of, om mijzelven te verheerlijken. Sommigen, opdat ik Hem verheerlijke."}],"22":[{"catchword":"De kleinste","tekst":"Te weten hoop."},{"catchword":"zal tot duizend","tekst":"Dat is, zal grotelijks wassen; gelijk Gen 24:60 . De zin is: De kerk van Christus zal in het Nieuwe Testament tot verwonderens toe zeer voortreffelijk opwassen en vermeerderen. Anderen verstaan deze woorden aldus: Zelfs degenen, die kleine gaven hebben, zullen er door hunne onderwijzing vele anderen tot de kerk of gemeente aanleiden."},{"catchword":"te zijner tijd","tekst":"Namelijk ter bekwamer en bestemder tijd, dien Ik in mijnen raad besloten heb, dien het ons niet betaamt te weten. Zie Act 1:6-7 . Doch anderen menen dat dit te verstaan is van den tijd van het Nieuwe Testament."},{"catchword":"snellijk","tekst":"Hebreeuws, doen haasten."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Get thee up, [Or arise: To wit, out of darkness and misery, wherein thou hast lain so long. Compare above chap.52.2. The Lord speaketh here to Jerusalem, or Zion: that is, to his Church, as appeareth below ver.14.] be enlightened, [to wit, with more perfect knowledge then thou hast had hitherto; as the brightness of the day is enlightened, or increased, when the sun riseth] for thy light cometh: [to wit, Christ Jesus, who is the light of the world, which enlighteth the hearts of the elect with the true knowledge of God. See Luk 2:32. Joh.1.9. and 8.12. and Eph.5.14. or the time of the redemption is come] and the glory of the LORD [Compare herewith Revel.21.11.] ariseth upon thee. [like a bright shining sun, which spreadeth her light abroad in all places both far and near.]"}],"2":[{"catchword":null,"tekst":"For behold darkness [That is, ignorance or want of knowledge and understanding. Compare Eph.4.18. and 5.ver.11. Revel.16.10. Men are full of blindness and ignorance, and know not their God and Saviour, [to wit, all the inhabitants of the earth, and all those nations that continue in the darkness of their ignorance, rejecting the grace of the preaching of the Gospel] and gross darkness the nations: [the same with the former clause] but the LORD [that is, the knowledge of the Lord Jesus Christ] shall arise [like a sun. See Psal.84.12.] upon thee, and his glory shall be seen upon thee [or shine upon thee.]"}],"3":[{"catchword":null,"tekst":"And the Gentiles shall go to thy light, [Or in, or by the light. The meaning is, the Gentiles shall be also enlightened with the true knowledge of God, by the Gospel which shall be preached among you. Compare Revel.21.24. See likewise above chap.49.6.] and kings to the brightness that is risen to thee. [Heb. Of thy rising.]"}],"4":[{"catchword":null,"tekst":"Lift up thine eyes round ab /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */

  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
}
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  kopieerVers(k.dataset.n);
});
// rechtermuisklik op een vers kopieert het (in plaats van het browser-contextmenu)
document.addEventListener('contextmenu', e => {
  const rij = e.target.closest('.vers');
  if (!rij || !rij.id.startsWith('v')) return;
  const n = rij.id.slice(1);
  if (!D.vertalingen.SVnu[n]) return;
  e.preventDefault();
  kopieerVers(n);
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url}) (SVnu)`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
