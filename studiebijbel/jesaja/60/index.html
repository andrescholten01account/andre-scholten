:8": "hetzij wie vermaant, in het vermanen; wie uitdeelt, in eenvoud; wie leiding geeft, met ijver; wie barmhartigheid bewijst, met blijmoedigheid.", "Ps 41:13": "Want mij aangaande, U onderhoudt mij in mijn oprechtheid, en U stelt mij voor Uw aangezicht in eeuwigheid.", "Joh 12:28": "Vader, verheerlijk Uw Naam. Er kwam dan een stem uit de hemel, die zei: En Ik heb Hem verheerlijkt, en Ik zal Hem opnieuw verheerlijken.", "Hagg 2:5": "Toch nu, wees sterk, Zerubbabel! spreekt de HEERE; en wees sterk, Josua, zoon van Jozadak, hogepriester! en wees sterk, al u volk van het land! spreekt de HEERE; en werk, want Ik ben met u, spreekt de HEERE van de heerscharen;", "Jes 61:4-6": "En zij zullen de oude, verwoeste plaatsen bouwen, de vorige verstoringen weer oprichten, en de verwoeste steden vernieuwen, die verstoord waren van geslacht op geslacht. En vreemdelingen zullen klaarstaan en uw kudden weiden; en buitenlanders zullen uw akkerlieden en uw wijngaardeniers zijn. Maar u zult priesters van de HEERE heten, men zal u dienaren van onze God noemen; u zult het vermogen van de heidenvolken eten, en op hun heerlijkheid zult u zich beroemen.", "Ps 129:5": "Laat hen beschaamd worden en achteruitgedreven, allen die Sion haten.", "Gal 3:28": "Daarin is geen Jood en geen Griek; daarin is geen slaaf en geen vrije; daarin is geen man en vrouw; want u bent allen één in Christus Jezus.", "Ps 96:4": "Want de HEERE is groot, en zeer te prijzen; Hij is ontzagwekkend boven alle goden.", "2 Kron 25:9": "En Amazia zei tegen de man van God: Maar wat moet men doen met de honderd talenten, die ik aan de troepen van Israël gegeven heb? En de man van God zei: De HEERE heeft meer dan dit, om u te geven.", "Openb 21:26": "En zij zullen de heerlijkheid en de eer van de volken daarin brengen.", "Matt 5:48": "Wees dan volmaakt, zoals uw Vader, Die in de hemelen is, volmaakt is.", "2 Kor 1:2": "Genade zij u en vrede van God, onze Vader, en de Heere Jezus Christus.", "Jes 43:3": "Want Ik ben de HEERE, uw God, de Heilige van Israël, uw Heiland; Ik heb Egypte, Morenland en Seba gegeven tot uw losgeld in uw plaats.", "Dan 3:17": "Als het zo is, onze God, Die wij eren, is machtig om ons te verlossen uit de brandende vuuroven, en Hij zal ons uit uw hand, o koning, verlossen.", "Hand 20:33": "Ik heb niemands zilver, of goud, of kleding begeerd.", "Spr 10:22": "De zegen van de HEERE, die maakt rijk; en Hij voegt er geen smart aan toe.", "Hand 11:23": "Toen hij daar aangekomen was en de genade van God zag, werd hij blij, en vermaande hen allen dat zij met een vast voornemen van het hart bij de Heere zouden blijven.", "1 Tim 6:6": "Maar de godsvrucht is, samen met tevredenheid, een grote winst.", "Mark 10:14": "Maar Jezus zag dit, en nam het Hem zeer kwalijk, en zei tegen hen: Laat de kinderen bij Mij komen, en verhinder ze niet; want voor zulke is het Koninkrijk van God.", "Jes 62:11": "Ziet, de HEERE heeft doen horen, tot aan het einde van de aarde: zegt tegen de dochter van Sion: Zie, uw Heil komt; zie, Zijn loon is met Hem, en Zijn arbeidsloon is voor Zijn aangezicht.", "Hagg 2:20": "Is er nog zaad in de schuur? Zelfs de wijnstok, en de vijgenboom, en de granaatappelboom, en de olijfboom, die niet gedragen hebben, die zal Ik vanaf deze dag zegenen.", "Matt 23:16-24": "Wee u, blinde leidslieden, die zeggen: Wie ook zweert bij de tempel, dat is niets; maar wie zweert bij het goud van de tempel, die is verplicht zijn eed te houden. Dwazen en blinden, want wat is meer, het goud, of de tempel die het goud heiligt? En wie zweert bij het altaar, dat is niets; maar wie zweert bij de gave die daarop ligt, die is verplicht zijn eed te houden.", "2 Kor 8:1": "Verder maken wij u bekend, broeders, de genade van God, die in de gemeenten van Macedonië gegeven is.", "Hebr 1:3": "Die, omdat Hij het Afschijnsel is van Zijn heerlijkheid en het uitgedrukte Beeld van Zijn zelfstandigheid, en alle dingen draagt door het woord van Zijn kracht, nadat Hij de reiniging van onze zonden door Zichzelf tot stand gebracht heeft, is gaan zitten aan de rechterhand van de Majesteit in de hoogste hemelen;", "Jes 9:1": "Het volk dat in duisternis wandelt, zal een groot licht zien; wie wonen in het land van de schaduw van de dood, over hen zal een licht schijnen.", "Joël 2:18": "Zo zal de HEERE ijveren over Zijn land, en Hij zal Zijn volk verschonen.", "Jes 54:10": "Want bergen zullen wijken, en heuvels wankelen; maar Mijn goedertierenheid zal van u niet wijken, en het verbond van Mijn vrede zal niet wankelen, zegt de HEERE, uw Ontfermer.", "Joh 3:21": "Maar wie de waarheid doet, komt tot het licht, opdat van zijn werken openbaar wordt dat zij in God gedaan zijn.", "Ef 3:12": "door wie wij de vrijmoedigheid hebben, en de toegang met vertrouwen, door het geloof aan Hem.", "Dan 2:20": "Daniël antwoordde en zei: De Naam van God zij geloofd van eeuwigheid tot in eeuwigheid, want van Hem is de wijsheid en de kracht.", "2 Kron 19:3": "Toch zijn er goede dingen bij u gevonden; want u hebt de bossen uit het land weggedaan, en uw hart erop gericht om God te zoeken.", "2 Kron 9:1": "En toen de koningin van Scheba het gerucht van Salomo hoorde, kwam zij naar Jeruzalem, om Salomo met raadsels op de proef te stellen, met een zeer groot leger, en kamelen die specerijen droegen, en veel goud, en kostbaar gesteente; en zij kwam bij Salomo, en sprak met hem over alles wat in haar hart was.", "Ps 4:5": "Wees beroerd, en zondig niet; spreek in uw hart op uw bed, en wees stil. Sela.", "Matt 2:11": "En toen zij in het huis gekomen waren, vonden zij het Kindje met Maria, Zijn moeder, en zij vielen neer en aanbaden Het; en na hun schatten geopend te hebben, brachten zij Hem geschenken: goud, wierook en mirre.", "1 Joh 2:1": "Mijn kinderen, ik schrijf u deze dingen, opdat u niet zondigt. En als iemand gezondigd heeft, hebben wij een Voorspraak bij de Vader, Jezus Christus, de Rechtvaardige;", "Ps 147:16": "Hij geeft sneeuw als wol; Hij strooit de rijp als as.", "1 Tess 1:3": "Zonder ophouden gedenkend het werk van uw geloof, en de arbeid van de liefde, en de volharding van de hoop op onze Heere Jezus Christus, voor onze God en Vader;", "Job 23:14": "Want Hij zal volbrengen wat over mij bepaald is; en dergelijke dingen zijn er veel bij Hem.", "Ps 80:2": "O Herder van Israël! Neem het ter oor, U Die Jozef als schapen leidde; U Die tussen de cherubs zit, verschijn blinkend.", "2 Tess 2:16": "En onze Heere Jezus Christus Zelf, en onze God en Vader, Die ons heeft liefgehad, en een eeuwige vertroosting en goede hoop gegeven heeft in genade,", "Richt 16:20": "En zij zei: De Filistijnen over u, Simson! En hij werd wakker uit zijn slaap, en zei: Ik zal ditmaal uitgaan, zoals de andere keren, en mij uitschudden; want hij wist niet, dat de HEERE van hem geweken was.", "Lev 26:12": "En Ik zal in uw midden wandelen, en zal u tot een God zijn, en u zult Mij tot een volk zijn.", "Ps 112:9": "Pe. Hij strooit uit, hij geeft aan de arme; Tsade. zijn gerechtigheid houdt stand tot in eeuwigheid; Koph. zijn hoorn zal verhoogd worden in eer.", "1 Petr 4:1": "Omdat Christus dan voor ons in het vlees geleden heeft, wapent u zich ook met dezelfde gedachte, namelijk dat wie in het vlees geleden heeft, opgehouden heeft met de zonde;", "2 Sam 24:24": "Doch de koning zei tegen Arauna: Nee, maar ik zal het zeker van u kopen voor de prijs; want ik zal de HEERE, mijn God, geen brandoffers offeren die mij niets kosten. Zo kocht David de dorsvloer en de runderen voor vijftig zilveren sikkels.", "2 Kor 3:18": "En wij allen, die met ongedekt gezicht de heerlijkheid van de Heere aanschouwen als in een spiegel, worden naar datzelfde beeld veranderd van heerlijkheid tot heerlijkheid, als door de Geest van de Heere.", "Lev 20:7": "Daarom heilig u, en wees heilig; want Ik ben de HEERE, uw God!", "Zach 4:10": "Want wie veracht de dag van de kleine dingen? Toch zullen die zeven zich verblijden, als zij het tinnen gewicht zullen zien in de hand van Zerubbabel; dat zijn de ogen van de HEERE, die het hele land doorkruisen.", "Matt 5:8": "Zalig zijn de reinen van hart, want zij zullen God zien.", "Jer 32:27": "Zie, Ik ben de HEERE, de God van alle vlees; zou voor Mij iets te wonderlijk zijn?", "1 Kor 6:20": "Want u bent duur gekocht: verheerlijk dan God in uw lichaam en in uw geest, die van God zijn.", "Job 37:22": "Als van het noorden het goud komt; maar bij God is een geweldige majesteit!", "1 Kron 16:24": "Vertelt Zijn eer onder de heidenen, Zijn wonderwerken onder alle volken.", "Joz 7:13": "Sta op, heilig het volk, en zeg: Heilig uzelf tegen morgen; want zo zegt de HEERE, de God van Israël: Er is een ban in uw midden, Israël! U zult niet kunnen standhouden voor het aangezicht van uw vijanden, totdat u de ban uit uw midden wegdoet.", "Jes 49:23": "En koningen zullen uw voedsterheren zijn, hun vorstinnen uw zoogvrouwen; zij zullen zich voor u buigen met het aangezicht ter aarde, en zij zullen het stof van uw voeten likken; en u zult weten, dat Ik de HEERE ben, dat zij niet beschaamd zullen worden die Mij verwachten.", "Ps 11:7": "Want de HEERE is rechtvaardig, Hij heeft gerechtigheden lief; Zijn aangezicht aanschouwt de oprechte.", "Joh 16:2": "Zij zullen u uit de synagogen werpen; ja, de tijd komt dat ieder die u doodt, zal denken God een dienst te doen.", "Ps 78:12-16": "Voor hun vaderen had Hij wonder gedaan, in Egypteland, in het veld van Zoan. Hij kliefde de zee, en liet hen erdoorheen gaan; en de wateren liet Hij staan als een hoop. En Hij leidde hen overdag met een wolk, en de hele nacht met een licht van het vuur.", "Num 16:48": "En hij stond tussen de doden en tussen de levenden; zo werd de plaag tot stilstand gebracht.", "Jes 52:11": "Vertrek, vertrek, ga daarvandaan weg, raak het onreine niet aan; ga weg uit hun midden, reinig u, u die de voorwerpen van de HEERE draagt!", "Ezech 8:4": "En zie, de heerlijkheid van de God van Israël was daar, naar de gedaante die ik in de vallei gezien had.", "Klaagl 3:24": "Cheth. De HEERE is mijn deel, zegt mijn ziel, daarom zal ik op Hem hopen.", "1 Kron 29:5": "Goud voor de gouden voorwerpen, en zilver voor de zilveren voorwerpen, en voor al het werk dat door de hand van de werkmeesters gemaakt moet worden. En wie is er bereid om zich vandaag vrijwillig aan de HEERE te wijden?", "Ps 82:5": "Zij weten niet, en verstaan niet; zij wandelen steeds in duisternis; daardoor wankelen alle fundamenten van de aarde.", "Hand 4:33": "En de apostelen gaven met grote kracht getuigenis van de opstanding van de Heere Jezus; en er was grote genade over hen allen.", "1 Joh 5:11": "En dit is het getuigenis, namelijk dat God ons het eeuwige leven gegeven heeft; en dit leven is in Zijn Zoon.", "Ps 132:14": "Dit is Mijn rust tot in eeuwigheid, hier zal Ik wonen, want Ik heb het begeerd.", "Job 22:26": "Want dan zult u zich verlustigen over de Almachtige, en u zult uw aangezicht opheffen tot God.", "Jer 51:15": "Die de aarde gemaakt heeft door Zijn kracht, Die de wereld bereid heeft door Zijn wijsheid, en de hemel uitgebreid door Zijn verstand;", "Jes 40:9-11": "O Sion, u die goede boodschap verkondigt, klim op een hoge berg; o Jeruzalem, u die goede boodschap verkondigt, hef uw stem op met macht, hef ze op, vrees niet, zeg tegen de steden van Juda: Zie, hier is uw God! Ziet, de Heere HEERE zal komen tegen de sterke, en Zijn arm zal heersen; ziet, Zijn loon is bij Hem, en Zijn arbeidsloon is voor Zijn aangezicht. Hij zal Zijn kudde weiden gelijk een herder; Hij zal de lammeren in Zijn armen bijeenbrengen, en in Zijn schoot dragen; de zogende dieren zal Hij zachtjes leiden.", "Ps 2:11": "Dient de HEERE met vrees, en verheugt u met beving.", "Spr 25:3": "Aan de hoogte van de hemel, en aan de diepte van de aarde, en aan het hart van koningen is geen doorgronding.", "Dan 12:10": "Velen zullen gereinigd, wit gemaakt en gelouterd worden; maar de goddelozen zullen goddeloos handelen, en geen van de goddelozen zal het begrijpen, maar de verstandigen zullen het begrijpen.", "2 Kon 14:27": "En de HEERE had niet gesproken dat Hij de naam van Israël van onder de hemel zou uitwissen; maar Hij verloste hen door de hand van Jerobeam, de zoon van Joas.", "Job 36:27-33": "Want Hij trekt de druppels van het water op, die als regen neerdruppelen door zijn damp; Die de wolken uitgieten, en over de mens overvloedig afdruipen. Kan iemand ook verstaan de uitbreidingen van de wolken, en de donderslagen van Zijn tent?", "Dan 4:22-27": "Dat bent u, o koning, die groot en sterk bent geworden; want uw grootheid is zo toegenomen, dat zij reikt aan de hemel, en uw heerschappij aan het einde van het aardrijk. Dat nu de koning een wachter, namelijk een heilige, gezien heeft, uit de hemel neerkomend, die zei: Houwt deze boom om, en verderf hem; maar laat de stronk met zijn wortels in de aarde, en met een ijzeren en koperen band in het tedere gras van het veld, en in de dauw van de hemel nat gemaakt worden, en dat zijn deel zij met het gedierte van het veld, totdat er zeven tijden over hem voorbijgaan; Dit is de uitleg, o koning, en dit is een besluit van de Allerhoogste, dat over mijn heer de koning komen zal:", "Hand 26:18": "Om hun ogen te openen en hen te bekeren van de duisternis tot het licht, en van de macht van de satan tot God; opdat zij vergeving van de zonden ontvangen, en een erfdeel onder de geheiligden, door het geloof in Mij.", "2 Petr 3:13": "Maar wij verwachten, naar Zijn belofte, nieuwe hemelen en een nieuwe aarde, waarin gerechtigheid woont.", "Openb 5:9": "En zij zongen een nieuw lied: U bent waard dat boek te nemen en zijn zegels te openen; want U bent geslacht, en hebt ons voor God gekocht met Uw bloed, uit elk geslacht, en taal, en volk, en natie;", "Matt 18:11-14": "Want de Zoon des mensen is gekomen om dat wat verloren was, zalig te maken. Wat denkt u? Als iemand honderd schapen had en één daarvan zou afdwalen, zal hij niet de negenennegentig achterlaten en de bergen op gaan om het afgedwaalde te zoeken? En als het gebeurt dat hij het vindt, voorwaar, Ik zeg u, dat hij zich meer verblijdt over dat schaap dan over de negenennegentig die niet afgedwaald zijn.", "Ezech 20:14": "Maar Ik deed het om Mijn Naam, opdat die niet ontheiligd zou worden voor de ogen van de heidenvolken, voor wier ogen Ik hen uitleidde.", "2 Kor 7:1": "Omdat wij dan deze beloften hebben, geliefden, laten wij onszelf reinigen van alle besmetting van het vlees en van de geest, en zo de heiligmaking volbrengen in de vreze van God.", "Ps 2:8": "Eis van Mij, en Ik zal de heidenen geven tot Uw erfdeel, en de einden van de aarde tot Uw bezitting.", "Jes 62:7": "En zwijg niet stil voor Hem, totdat Hij bevestigt, en totdat Hij Jeruzalem stelt tot een lof op aarde.", "Jes 42:6": "Ik, de HEERE, heb u geroepen in gerechtigheid, en Ik zal u bij uw hand grijpen; en Ik zal u behoeden, en Ik zal u geven tot een Verbond van het volk, tot een Licht van de heidenen.", "Jes 59:20": "En er zal een Verlosser tot Sion komen, namelijk voor hen die zich bekeren van de overtreding in Jakob, spreekt de HEERE.", "Ps 92:7": "Een redeloos man weet er niet van, en een dwaas begrijpt dit niet;", "Jes 61:6": "Maar u zult priesters van de HEERE heten, men zal u dienaren van onze God noemen; u zult het vermogen van de heidenvolken eten, en op hun heerlijkheid zult u zich beroemen.", "Ezech 20:44": "Zo zult u weten dat Ik de HEERE ben, wanneer Ik met u gedaan zal hebben om Mijn Naam, niet naar uw slechte wegen, noch naar uw verdorven handelingen, o huis van Israël, spreekt de Heere HEERE.", "Ps 68:30": "Om uw tempel te Jeruzalem zullen de koningen U geschenken brengen.", "Matt 6:1-4": "Let op dat u uw aalmoes niet doet voor de mensen, om door hen gezien te worden; anders hebt u geen loon bij uw Vader, Die in de hemelen is. Wanneer u dan aalmoes doet, laat het dan niet voor u uittrompetten, zoals de geveinsden doen in de synagogen en op de straten, opdat zij door de mensen geëerd worden. Voorwaar, Ik zeg u: zij hebben hun loon al ontvangen. Maar als u aalmoes doet, laat uw linkerhand dan niet weten wat uw rechterhand doet;", "Jes 24:15": "Daarom eert de HEERE in de valleien, in de eilanden van de zee de Naam van de HEERE, de God van Israël.", "Ex 36:3-6": "Zij namen dan van voor Mozes het hele hefoffer, dat de kinderen van Israël gebracht hadden voor het werk van de dienst van het heiligdom, om dat te maken; maar zij brachten hem nog elke morgen vrijwillig offer. Daarom kwamen alle wijzen, die al het werk van het heiligdom maakten, ieder man van zijn werk, dat zij maakten, en zij spraken tot Mozes en zeiden: Het volk brengt te veel, meer dan genoeg is voor de dienst van het werk dat de HEERE geboden heeft te maken.", "2 Petr 3:11": "Omdat al deze dingen dan zullen vergaan, wat voor mensen moet u dan wel zijn, in een heilige levenswandel en in godsvrucht!", "Gal 3:8": "En de Schrift, die van tevoren zag dat God de heidenen uit het geloof zou rechtvaardigen, heeft van tevoren aan Abraham het Evangelie verkondigd, en zei: In u zullen alle volken gezegend worden.", "Hebr 11:24-27": "Door het geloof heeft Mozes, toen hij groot geworden was, geweigerd een zoon van de dochter van Farao genoemd te worden; en verkoos hij liever met het volk van God slecht behandeld te worden, dan voor een tijd van de genietingen van de zonde te hebben; en achtte hij de smaad van Christus een grotere rijkdom dan de schatten in Egypte; want hij keek uit naar de vergelding van het loon.", "Ps 97:3-5": "Een vuur gaat voor Zijn aangezicht heen, en het steekt Zijn tegenstanders rondom in brand. Zijn bliksems verlichten de wereld; het aardrijk ziet ze en het beeft. De bergen smelten als was voor het aangezicht van de HEERE, voor het aangezicht van de Heere van de hele aarde.", "Deut 4:7": "Want welk groot volk is er, dat de goden zo dichtbij heeft als de HEERE, onze God, bij ons is, zo vaak als wij Hem aanroepen?", "Fil 2:15": "Opdat u onberispelijk en oprecht mag zijn, kinderen van God, onstraffelijk te midden van een krom en verdraaid geslacht, onder wie u schijnt als lichten in de wereld;", "Gen 8:8-11": "Daarna liet hij een duif van zich uitvliegen, om te zien of de wateren gezakt waren van boven de aardbodem. Maar de duif vond geen rust voor de holte van haar voet; zo keerde zij terug naar hem in de ark; want de wateren waren over de gehele aarde; en hij stak zijn hand uit, en nam haar, en bracht haar tot zich in de ark. En hij wachtte nog zeven andere dagen; toen liet hij de duif opnieuw uit de ark.", "Jes 52:1-6": "Word wakker, word wakker, trek uw sterkte aan, o Sion! Trek uw sierlijke kleren aan, o Jeruzalem, u heilige stad! Want in u zal voortaan geen onbesnedene of onreine meer komen. Schud u uit het stof, sta op, ga zitten, o Jeruzalem! Maak u los van de banden van uw hals, u gevangen dochter van Sion! Want zo zegt de HEERE: U bent voor niets verkocht, u zult ook zonder geld vrijgekocht worden.", "Openb 3:17": "Want u zegt: Ik ben rijk, en verrijkt geworden, en heb aan niets gebrek; en u weet niet dat u ellendig bent, en jammerlijk, en arm, en blind, en naakt.", "Hos 4:6": "Mijn volk is uitgeroeid, omdat het zonder kennis is; omdat u de kennis verworpen hebt, heb Ik u ook verworpen, zodat u Mij het priesterambt niet zult bedienen; omdat u de wet van uw God vergeten hebt, zal Ik ook uw kinderen vergeten.", "2 Kron 24:19": "Toch zond Hij profeten onder hen, om hen tot de HEERE te doen terugkeren; die waarschuwden hen, maar zij luisterden niet.", "Rom 2:10": "Maar heerlijkheid, en eer, en vrede voor ieder die het goede doet, eerst de Jood, en ook de Griek.", "Matt 3:9": "En denk niet bij uzelf te zeggen: Wij hebben Abraham als vader; want ik zeg u dat God zelfs uit deze stenen voor Abraham kinderen kan verwekken.", "Ps 98:3": "Hij is gedachtig geweest aan Zijn goedertierenheid en Zijn waarheid aan het huis van Israël; en alle einden van de aarde hebben het heil van onze God gezien.", "Mark 10:27": "Maar Jezus keek hen aan, en zei: Bij de mensen is het onmogelijk, maar niet bij God; want bij God zijn alle dingen mogelijk.", "1 Kron 27:30": "En over de kamelen was Obil, de Ismaëliet; en over de ezelinnen was Jechdeja, de Meronothiet.", "Ezech 20:17": "Doch Mijn oog spaarde hen, zodat Ik hen niet verdierf, en geen einde met hen maakte in de woestijn.", "Ps 135:6": "Al wat de HEERE behaagt, doet Hij, in de hemelen en op de aarde, in de zeeën en alle afgronden.", "Jes 28:15": "Omdat u zegt: Wij hebben een verbond met de dood gemaakt, en met het rijk van de dood hebben wij een voorzichtig verdrag gemaakt; wanneer de overstromende gesel doortrekt, zal hij bij ons niet komen; want wij hebben de leugen ons tot een toevlucht gesteld, en onder de valsheid hebben wij ons verborgen.", "Ps 85:4": "U hebt al Uw verbolgenheid weggenomen; U hebt U afgewend van de gloed van Uw toorn.", "Hab 2:14": "Want de aarde zal vervuld worden met de kennis van de heerlijkheid van de HEERE, zoals het water de bodem van de zee bedekt.", "Job 36:21": "Wacht u, keer u niet tot ongerechtigheid; want dat hebt u boven de ellende verkozen.", "Ps 72:1-20": "Voor Salomo. O God! Geef de koning Uw rechten, en Uw gerechtigheid de zoon van de koning. Zo zal hij Uw volk richten met gerechtigheid, en Uw ellendigen met recht. De bergen zullen aan het volk vrede dragen, ook de heuvels, met gerechtigheid.", "Hos 14:8": "Zij zullen terugkeren, zittend onder zijn schaduw; zij zullen tot leven voortbrengen als koren, en bloeien als de wijnstok; zijn gedachtenis zal zijn als de wijn van Libanon.", "Spr 13:7": "Er is iemand die zichzelf rijk maakt, en toch niets heeft, en iemand die zichzelf arm maakt, en toch veel goed heeft.", "Jes 61:3": "Om de treurenden van Sion te geven, dat hun sieraad gegeven wordt voor as, vreugdeolie voor treurigheid, het gewaad van lof voor een benauwde geest; opdat zij eikenbomen van de gerechtigheid genoemd worden, een planting van de HEERE, opdat Hij verheerlijkt wordt.", "Jes 41:19": "Ik zal in de woestijn de cederboom, de sittimboom, en de mirteboom, en de olieboom zetten; Ik zal in de wildernis de denneboom, de beuk, en de busboom samen plaatsen;", "Spr 10:24": "Wat de goddeloze vreest, dat zal hem overkomen; maar wat de rechtvaardigen verlangen, zal God geven.", "Rom 8:6": "Want het bedenken van het vlees is de dood, maar het bedenken van de Geest is leven en vrede.", "Ps 69:37": "En het zaad van Zijn dienaars zal haar beërven; en de liefhebbers van Zijn Naam zullen daarin wonen.", "Ezech 27:25": "De schepen van Tarsis zongen van u, vanwege de onderlinge koophandel met u; en u was vervuld, en zeer verheerlijkt in het hart van de zeeën.", "Spr 29:2": "Als de rechtvaardigen groot worden, verblijdt het volk zich; maar als de goddeloze heerst, zucht het volk.", "Matt 12:33": "Of maak de boom goed en zijn vrucht goed; of maak de boom slecht en zijn vrucht slecht; want aan de vrucht wordt de boom gekend.", "Ezech 37:23": "En zij zullen zich niet meer verontreinigen met hun drekgoden, en met hun afschuwelijkheden, en met al hun overtredingen; en Ik zal ze verlossen uit al hun woonplaatsen, waarin zij gezondigd hebben, en zal ze reinigen; zo zullen zij Mij tot een volk zijn, en Ik zal hun tot een God zijn.", "Joh 9:5": "Zolang Ik in de wereld ben, ben Ik het Licht van de wereld.", "Ezech 27:21-24": "Arabië en alle vorsten van Kedar waren de kooplieden van uw hand; met lammeren, en rammen, en bokken, daarmee handelden zij met u. De kooplieden van Scheba en Raëma waren uw kooplieden; met alle hoofdspecerij, en met alle kostbaar gesteente en goud, handelden zij op uw markten. Haran, en Kanne, en Eden, de kooplieden van Scheba, Assur en Kilmad, handelden met u.", "Ps 76:7": "Van Uw schelden, o God van Jakob! zijn samen wagen en paard in slaap gezonken.", "Hebr 12:18-21": "Want u bent niet gekomen tot de tastbare berg, en het brandende vuur, en donkerheid, en duisternis, en onweer, En tot het geschal van de bazuin, en de stem van de woorden; waarbij zij die het hoorden, baden dat het woord tot hen niet meer gesproken zou worden. (Want zij konden niet dragen wat er geboden werd: Zelfs als een dier de berg aanraakt, zal het gestenigd of met een pijl doorschoten worden.", "Ps 2:4": "Die in de hemel woont, zal lachen; de Heere zal hen bespotten.", "Joël 2:29": "Ja, ook over de dienstknechten, en over de dienstmaagden, zal Ik in die dagen Mijn Geest uitgieten.", "Ex 20:2": "Ik ben de HEERE, uw God, Die u uit Egypteland, uit het diensthuis, uitgeleid heb.", "Ps 89:3": "Want ik heb gezegd: Uw goedertierenheid zal eeuwig gebouwd worden; in de hemelen zelf hebt Gij Uw waarheid bevestigd, en gezegd:", "Ps 98:2": "De HEERE heeft Zijn heil bekendgemaakt; Hij heeft Zijn gerechtigheid geopenbaard voor de ogen van de heidenen.", "1 Tim 3:14": "Deze dingen schrijf ik u, in de hoop spoedig bij u te komen;", "Jes 1:8": "En de dochter van Sion is overgebleven als een hutje in de wijngaard, als een nachthutje in de komkommerhof, als een belegerde stad.", "2 Sam 22:20": "En Hij voerde mij uit in de ruimte, en rukte mij eruit, want Hij had lust aan mij.", "Jer 31:33": "Maar dit is het verbond dat Ik na die dagen met het huis van Israël sluiten zal, spreekt de HEERE: Ik zal Mijn wet in hun binnenste geven, en zal die in hun hart schrijven; en Ik zal hun tot een God zijn, en zij zullen Mij tot een volk zijn.", "Matt 23:24": "Blinde leidslieden, die de mug uitzeven, en de kameel doorzwelgen.", "Job 34:29": "Als Hij stilt, wie zal dan beroeren? Als Hij het aangezicht verbergt, wie zal Hem dan aanschouwen, zowel voor een volk, als voor een mens alleen?", "Ps 106:1": "Halleluja! Loof de HEERE, want Hij is goed, want Zijn goedertierenheid is voor eeuwig.", "Luk 11:34": "De lamp van het lichaam is het oog: wanneer dan uw oog zuiver is, dan is ook uw hele lichaam verlicht; maar als het slecht is, dan is ook uw lichaam duister.", "Gal 3:26": "Want u bent allen kinderen van God door het geloof in Christus Jezus.", "Jes 52:7": "Hoe lieflijk zijn op de bergen de voeten van hem die het goede nieuws brengt, die de vrede laat horen; van hem die goed nieuws brengt van het goede, die heil laat horen; van hem die tegen Sion zegt: Uw God is Koning.", "Num 23:21": "Hij ziet geen ongerechtigheid in Jakob; ook ziet Hij geen boosheid in Israël. De HEERE, zijn God, is met hem, en het geschal van de Koning is bij hem.", "Openb 18:4": "En ik hoorde een andere stem uit de hemel, die zei: Ga uit haar weg, Mijn volk, opdat u geen deel hebt aan haar zonden, en opdat u niet ontvangt van haar plagen.", "Ps 72:17": "Zijn naam zal zijn tot in eeuwigheid; zolang als er de zon is, zal zijn naam van kind tot kind voortgeplant worden; en zij zullen in hem gezegend worden; alle heidenvolken zullen hem gelukkig noemen.", "Jes 60:1-6": "Maak u op, word verlicht, want uw licht komt, en de heerlijkheid van de HEERE gaat over u op. Want zie, de duisternis zal de aarde bedekken, en donkerheid de volken; maar over u zal de HEERE opgaan, en Zijn heerlijkheid zal over u gezien worden. En de heidenen zullen naar uw licht gaan, en koningen naar de glans die over u is opgegaan.", "Rom 11:16": "En als de eerstelingen heilig zijn, dan is ook het deeg heilig, en als de wortel heilig is, dan zijn ook de takken heilig.", "1 Petr 1:3": "Geloofd zij de God en Vader van onze Heere Jezus Christus, Die naar Zijn grote barmhartigheid ons opnieuw geboren heeft doen worden tot een levende hoop, door de opstanding van Jezus Christus uit de doden.", "Ps 74:12": "Toch is God mijn Koning van oudsher, Die verlossingen werkt in het midden van de aarde.", "Zef 2:7": "En dat gebied zal zijn voor het overblijfsel van het huis van Juda, zodat zij daarin weiden; 's avonds zullen zij in de huizen van Askelon liggen, want de HEERE, hun God, zal hen bezoeken, en Hij zal hun gevangenschap wenden.", "Ezech 16:63": "opdat u eraan denkt, en zich schaamt, en niet meer uw mond opendoet vanwege uw schande, wanneer Ik verzoening voor u zal doen over alles wat u gedaan hebt, spreekt de Heere HEERE.", "Ef 5:3": "Maar hoererij en alle onreinheid, of hebzucht, laat onder u zelfs niet genoemd worden, zoals het de heiligen betaamt,", "Hab 3:4": "En er was een glans als van het licht, Hij had hoornen aan Zijn hand, en daar was Zijn sterkte verborgen.", "Jes 30:30": "En de HEERE zal Zijn heerlijke stem doen horen, en de nederlating van Zijn arm doen zien, met grimmigheid van toorn, en een vlam van verterend vuur, stralen, en een vloed, en hagelstenen.", "Jes 17:13": "De naties zullen wel ruisen, zoals grote wateren ruisen; maar Hij zal het bestraffen, zo zal het ver wegvluchten, ja, het zal opgejaagd worden als het kaf van de bergen voor de wind, en als een bal voor de wervelwind.", "Ps 69:36": "Want God zal Sion verlossen, en de steden van Juda bouwen; en daar zullen zij wonen, en haar erfelijk bezitten;", "Neh 1:10": "Zij zijn toch Uw dienaren en Uw volk, dat U verlost hebt door Uw grote kracht en door Uw sterke hand.", "Ezech 10:4": "Toen hief de heerlijkheid van de HEERE zich omhoog van boven de cherub, naar de drempel van het huis; en het huis werd vervuld met een wolk, en het voorhof was vol van de glans van de heerlijkheid van de HEERE.", "Ps 147:18": "Hij zendt Zijn woord, en doet ze smelten; Hij laat Zijn wind waaien, de wateren stromen weg.", "Rom 5:1": "Wij dan, gerechtvaardigd zijnde uit het geloof, hebben vrede bij God, door onze Heere Jezus Christus;", "Job 23:2-6": "Ook vandaag is mijn klacht bitter; mijn plaag is zwaarder dan mijn zuchten. Och, of ik wist waar ik Hem vinden zou, ik zou tot Zijn troon komen; Ik zou het recht voor Zijn aangezicht ordentelijk voorstellen, en mijn mond zou ik met verdedigingen vullen.", "2 Kor 6:14-17": "Trek niet een ander juk aan met de ongelovigen; want wat heeft de gerechtigheid gemeen met de ongerechtigheid, en welke gemeenschap heeft het licht met de duisternis? En welke overeenstemming heeft Christus met Belial, of welk deel heeft de gelovige met de ongelovige? Of welke samenvoeging heeft de tempel van God met de afgoden? Want u bent de tempel van de levende God; zoals God gezegd heeft: Ik zal in hen wonen, en Ik zal onder hen wandelen; en Ik zal hun God zijn, en zij zullen Mij een volk zijn.", "Luk 16:8": "En de heer prees de onrechtvaardige rentmeester, omdat hij voorzichtig gehandeld had; want de kinderen van deze wereld zijn voorzichtiger dan de kinderen van het licht, in hun geslacht.", "1 Kor 2:8": "Welke niemand van de leiders van deze wereld gekend heeft; want als zij haar gekend hadden, zouden zij de Heere der heerlijkheid niet gekruisigd hebben.", "Ef 4:18": "Verduisterd in het verstand, vervreemd van het leven van God, door de onwetendheid die in hen is, door de verharding van hun hart;", "Luk 13:30": "En zie, er zijn laatsten die de eersten zullen zijn, en er zijn eersten die de laatsten zullen zijn.", "Ps 24:4": "Die rein van handen, en zuiver van hart is, die zijn ziel niet opheft tot ijdelheid, en die niet bedrieglijk zweert;", "Jer 13:11": "Want zoals een gordel zich hecht aan de middel van een man, zo heb Ik het hele huis van Israël en het hele huis van Juda aan Mij doen hechten, spreekt de HEERE, om Mij tot een volk te zijn, en tot een naam, en tot lof, en tot heerlijkheid; maar zij hebben niet gehoord.", "Openb 7:15-17": "Daarom zijn zij voor de troon van God, en dienen Hem dag en nacht in Zijn tempel; en Die op de troon zit, zal hen overschaduwen. Zij zullen niet meer hongeren, en zullen niet meer dorsten, en de zon zal niet meer op hen vallen, of enige hitte. Want het Lam, Dat in het midden van de troon is, zal hen weiden, en zal hun een Leidsman zijn tot levende fonteinen van water; en God zal alle tranen van hun ogen afwissen.", "Ezech 36:23": "Want Ik zal Mijn grote Naam heiligen, die onder de heidenen ontheiligd is, die u in het midden van hen ontheiligd hebt; en de heidenen zullen weten dat Ik de HEERE ben, spreekt de Heere HEERE, als Ik aan u voor hun ogen zal geheiligd zijn.", "Jes 44:27": "Die tot de diepte zegt: Verdroog, en uw rivieren zal Ik doen verdrogen.", "Jes 54:7": "Voor een klein ogenblik heb Ik u verlaten; maar met grote ontfermingen zal Ik u verzamelen.", "Joh 12:31": "Nu is het oordeel over deze wereld; nu zal de leider van deze wereld buitengeworpen worden.", "Micha 5:1-14": "En u, Bethlehem Efratha, bent u klein om te zijn onder de duizenden van Juda? Uit u zal Mij Iemand voortkomen, Die een Heerser zal zijn in Israël, en Wiens uitgangen zijn van oudsher, van de dagen van de eeuwigheid. Daarom zal Hij hen overgeven, tot de tijd toe dat zij, die baren zal, gebaard heeft; dan zullen de overigen van Zijn broeders zich bekeren met de kinderen van Israël. En Hij zal staan, en zal weiden in de kracht van de HEERE, in de hoogheid van de Naam van de HEERE, Zijn God, en zij zullen wonen, want nu zal Hij groot zijn tot aan de einden van de aarde.", "Hand 13:47": "Want zo heeft de Heere ons geboden: Ik heb u gesteld tot een licht voor de heidenen, opdat u tot zaligheid zou zijn, tot aan het uiterste van de aarde.", "Ef 1:23": "Welke Zijn lichaam is, en de vervulling van Hem die alles in allen vervult.", "Richt 3:9": "Toen riepen de kinderen van Israël tot de HEERE; en de HEERE verwekte de kinderen van Israël een verlosser, die hen verloste, Othniël, zoon van Kenaz, broer van Kaleb, die jonger was dan hij.", "Matt 5:5": "Zalig zijn de zachtmoedigen, want zij zullen het aardrijk beërven.", "Ps 97:9": "Want U, HEERE, bent de Allerhoogste over de hele aarde; U bent zeer hoog verheven boven alle goden.", "Openb 5:13": "En elk schepsel dat in de hemel is, en op de aarde, en onder de aarde, en die in de zee zijn, en alles wat daarin is, hoorde ik zeggen: Hem Die op de troon zit, en het Lam, zij de dankzegging, en de eer, en de heerlijkheid, en de kracht, tot in alle eeuwigheid.", "Tit 1:2": "In de hoop van het eeuwige leven, dat God, Die niet liegen kan, beloofd heeft vóór de tijden der eeuwen, maar geopenbaard heeft op Zijn tijd;", "Jer 49:28": "Tegen Kedar, en tegen de koninkrijken van Hazor, die Nebukadrezar, de koning van Babel, sloeg, zegt de HEERE zo: Maak u op, trek op tegen Kedar, en verwoest de kinderen van het oosten.", "2 Sam 23:3": "De God van Israël heeft gezegd, de Rotssteen van Israël heeft tot mij gesproken: Er zal een Heerser zijn over de mensen, een Rechtvaardige, een Heerser in de vreze van God.", "Ps 115:12": "De HEERE is aan ons indachtig geweest, Hij zal zegenen; Hij zal het huis van Israël zegenen, Hij zal het huis van Aäron zegenen.", "Joh 8:39": "Zij antwoordden en zeiden tegen Hem: Abraham is onze vader. Jezus zei tegen hen: Als u Abrahams kinderen was, zou u de werken van Abraham doen.", "Spr 25:2": "Het is de eer van God om een zaak te verbergen; maar de eer van koningen om een zaak te doorgronden.", "Ps 87:1-6": "Een psalm, een lied voor de kinderen van Korach. Zijn grondslag is op de bergen van heiligheid. De HEERE heeft de poorten van Sion lief, boven alle woningen van Jakob. Zeer heerlijke dingen worden van u gesproken, o stad van God! Sela.", "Ps 147:5": "Onze Heere is groot en heeft veel kracht; van Zijn verstand is geen aantal te noemen.", "Jes 49:18": "Hef uw ogen op rondom, en zie, al dezen verzamelen zich, zij komen tot u; Zo waarachtig als Ik leef, spreekt de HEERE, zeker zult u zich met al dezen als met een sieraad bekleden, en u zult ze u aanbinden, zoals een bruid.", "Ps 117:2": "Want Zijn goedertierenheid is machtig over ons, en de waarheid van de HEERE is er voor eeuwig! Halleluja!", "Hand 8:37": "En Filippus zei: Als u van ganser harte gelooft, is het geoorloofd. En hij antwoordde en zei: Ik geloof dat Jezus Christus de Zoon van God is.", "Ezech 14:22": "Doch zie, daarin zullen mensen die ontkomen zijn overblijven, die uitgevoerd zullen worden, zonen en dochters; zie, zij zullen tot u uitkomen, en u zult hun weg zien en hun handelingen; en u zult vertroost worden over het kwaad dat Ik over Jeruzalem gebracht zal hebben, ja, al wat Ik over haar zal hebben gebracht.", "Ps 73:1": "Een psalm van Asaf. Zeker, God is goed voor Israël, voor hen die rein van hart zijn.", "Jes 62:3": "En u zult een sierlijke kroon zijn in de hand van de HEERE, en een koninklijke hoed in de hand van uw God.", "Ps 18:27": "Bij de reine houdt U Zich rein, maar bij de verkeerde bewijst U Zich een Worstelaar.", "Jes 57:2": "Hij zal ingaan in de vrede; zij zullen rusten op hun slaapsteden, ieder die in zijn oprechtheid gewandeld heeft.", "Ps 28:8": "De HEERE is hun Sterkte, en Hij is de Sterkheid van de verlossingen van Zijn Gezalfde.", "Deut 30:10": "wanneer u de stem van de HEERE, uw God, gehoorzaam zult zijn, door Zijn geboden en Zijn inzettingen te houden, die in dit boek van de wet geschreven zijn; wanneer u zich zult bekeren tot de HEERE, uw God, met uw ganse hart en met uw ganse ziel.", "Klaagl 1:4": "Daleth. De wegen van Sion treuren, omdat niemand op het feest komt; al haar poorten zijn woest, haar priesters zuchten: haar jonkvrouwen zijn bedroefd, en zij zelf is in bitterheid.", "Jes 6:1-5": "In het jaar dat koning Uzzia stierf, zag ik de Heere zitten op een hoge en verheven troon, en Zijn zomen vulden de tempel. De serafs stonden boven Hem; ieder had zes vleugels; met twee bedekte ieder zijn gezicht, en met twee bedekte hij zijn voeten, en met twee vloog hij. En de een riep tot de ander en zei: Heilig, heilig, heilig is de HEERE van de heerscharen! De hele aarde is vol van Zijn heerlijkheid!", "Jes 59:19-21": "Dan zullen zij de Naam van de HEERE vrezen vanaf de neergang, en Zijn heerlijkheid vanaf de opgang van de zon; als de vijand zal komen als een stroom, zal de Geest van de HEERE de banier tegen hem oprichten. En er zal een Verlosser tot Sion komen, namelijk voor hen die zich bekeren van de overtreding in Jakob, spreekt de HEERE. Wat Mij aangaat, dit is Mijn Verbond met hen, zegt de HEERE: Mijn Geest, Die op u is, en Mijn woorden, die Ik in uw mond gelegd heb, die zullen van uw mond niet wijken, ook niet van de mond van uw zaad, ook niet van de mond van het zaad van uw zaad, zegt de HEERE, van nu af tot in eeuwigheid toe.", "2 Kon 11:2": "Maar Joseba, de dochter van koning Joram, de zuster van Ahazia, nam Joas, de zoon van Ahazia, en stal hem uit het midden van de zonen van de koning die gedood werden. Zij zette hem en zijn voedster in een slaapkamer en verborg hem voor Athalia, zodat hij niet gedood werd.", "Ps 102:16": "Dan zullen de heidenen de Naam van de HEERE vrezen, en alle koningen van de aarde Uw heerlijkheid.", "Ps 37:39": "Thau. Toch is het heil van de rechtvaardigen van de HEERE; hun Sterkte in de tijd van benauwdheid.", "Jes 43:11": "Ik, Ik ben de HEERE, en er is geen Heiland behalve Mij.", "Jes 29:10-12": "Want de HEERE heeft over u uitgegoten een geest van diepe slaap, en Hij heeft uw ogen dichtgesloten; de profeten, en uw hoofden, en de zieners heeft Hij verblind. Daarom is voor u elk visioen geworden als de woorden van een verzegeld boek, dat men geeft aan iemand die lezen kan, en zegt: Lees toch dit; en hij zegt: Ik kan niet, want het is verzegeld. Of men geeft het boek aan iemand die niet lezen kan, en zegt: Lees toch dit; en hij zegt: Ik kan niet lezen.", "Ps 17:15": "Maar ik zal Uw aangezicht in gerechtigheid aanschouwen, ik zal verzadigd worden met Uw beeld, als ik zal ontwaken.", "Gal 6:9": "Laten we bij het goeddoen niet moe worden; want op zijn tijd zullen we maaien, als we niet verslappen.", "Ps 119:1-3": "Aleph. Gelukkig zijn de oprechten van wandel, die in de wet van de HEERE gaan. Gelukkig zijn zij, die Zijn getuigenissen onderhouden, die Hem van ganser harte zoeken; Ook geen onrecht werken, maar wandelen in Zijn wegen.", "1 Kor 1:18": "Want het woord van het kruis is voor hen die verloren gaan wel dwaasheid; maar voor ons, die behouden worden, is het een kracht van God;", "Ps 37:30": "Pe. De mond van de rechtvaardige spreekt wijsheid, en zijn tong spreekt het recht.", "Joël 3:17": "En u zult weten dat Ik de HEERE, uw God, ben, die op Sion woont, Mijn heilige berg; en Jeruzalem zal heilig zijn, en vreemden zullen er niet meer doorheen trekken.", "Spr 22:1": "Een goede naam is verkieslijker dan grote rijkdom, goede gunst dan zilver en dan goud.", "Fil 2:11": "En elke tong zou belijden dat Jezus Christus de Heere is, tot heerlijkheid van God de Vader.", "Ps 72:17-19": "Zijn naam zal zijn tot in eeuwigheid; zolang als er de zon is, zal zijn naam van kind tot kind voortgeplant worden; en zij zullen in hem gezegend worden; alle heidenvolken zullen hem gelukkig noemen. Geloofd zij de HEERE God, de God van Israël, Die alleen wonderen doet. En geloofd zij de Naam van Zijn heerlijkheid tot in eeuwigheid; en de hele aarde moet met Zijn heerlijkheid vervuld worden. Amen, ja, amen.", "2 Tess 2:12": "opdat zij allen veroordeeld worden, die de waarheid niet geloofd hebben, maar een welbehagen hebben gehad in de onrechtvaardigheid.", "Ezra 7:27": "Geloofd zij de HEERE, de God van onze vaderen, Die zoiets in het hart van de koning gegeven heeft, om het huis van de HEERE te versieren, dat te Jeruzalem is.", "Jes 49:6": "Verder zei Hij: Het is te gering, dat U Mij een Knecht zou zijn, om op te richten de stammen van Jakob, en om terug te brengen de bewaarden in Israël; Ik heb U ook gegeven tot een Licht van de heidenen, om Mijn heil te zijn tot aan het einde van de aarde.", "Gal 4:8": "Maar toen u God niet kende, diende u hen die van nature geen goden zijn;", "Klaagl 1:1": "Aleph. Hoe zit die stad zo eenzaam, die vol volk was; zij is als een weduwe geworden, zij, die groot was onder de heidenen, een vorstin onder de landschappen, is cijnsbaar geworden.", "Luk 6:38": "Geef, en u zal gegeven worden; een goede, ingedrukte, geschudde en overlopende maat zal men in uw schoot geven; want met dezelfde maat waarmee u meet, zal u weer gemeten worden.", "Gen 19:16": "Maar hij aarzelde; toen grepen die mannen zijn hand, en de hand van zijn vrouw, en de hand van zijn twee dochters, omdat de HEERE hem genadig was; en zij brachten hem naar buiten, en zetten hem buiten de stad neer.", "Ps 146:7": "Die de verdrukte recht doet, Die de hongerige brood geeft; de HEERE maakt de gevangenen los.", "Job 37:5": "God dondert met Zijn stem heel wonderlijk; Hij doet grote dingen, en wij begrijpen ze niet.", "Luk 3:10": "En de menigten vroegen hem: Wat zullen wij dan doen?", "2 Kor 4:6": "Want God, Die gezegd heeft dat het licht uit de duisternis zou schijnen, is Degene Die in onze harten geschenen heeft, om te geven de verlichting van de kennis van de heerlijkheid van God in het aangezicht van Jezus Christus.", "Deut 4:12": "Zo sprak de HEERE tot u uit het midden van het vuur; u hoorde de stem van de woorden, maar u zag geen gelijkenis, alleen de stem.", "Hebr 12:29": "Want onze God is een verterend vuur.", "Num 5:3": "Van de man tot de vrouw toe zult u hen wegzenden; tot buiten het leger zult u hen wegzenden; zodat zij hun legers niet verontreinigen, in welker midden Ik woon.", "Gen 8:21": "En de HEERE rook die liefelijke reuk, en de HEERE zei in Zijn hart: Ik zal voortaan de aardbodem niet meer vervloeken om de mens; want het gedichtsel van het hart van de mens is slecht van zijn jeugd aan; en Ik zal voortaan niet meer al het levende slaan, zoals Ik gedaan heb.", "Joz 4:24": "Opdat alle volken van de aarde de hand van de HEERE zouden kennen, dat die sterk is; opdat u de HEERE, uw God, vreest, alle dagen.", "Spr 10:21": "De lippen van de rechtvaardige voeden er velen; maar de dwazen sterven door gebrek aan verstand.", "Jes 35:8": "En daar zal een verheven baan, en een weg zijn, die de heilige weg genoemd zal worden; de onreine zal er niet doorgaan, maar hij zal voor deze zijn; wie deze weg gaat, zelfs de dwazen zullen niet dwalen.", "Spr 29:14": "Een koning die de armen in trouw recht doet, diens troon zal voor eeuwig bevestigd worden.", "Hand 5:14": "En er werden steeds meer mensen toegevoegd, die de Heere geloofden, menigten zowel van mannen als van vrouwen;", "Rom 15:9-12": "en dat de heidenen God zouden verheerlijken vanwege de barmhartigheid; zoals geschreven is: Daarom zal ik U belijden onder de heidenen, en Uw Naam lofzingen. En opnieuw zegt Hij: Weest vrolijk, heidenen, met Zijn volk! En opnieuw: Looft de Heere, alle heidenen, en prijst Hem, alle volken!", "Mark 4:11": "En Hij zei tegen hen: Aan u is het gegeven het geheimenis van het Koninkrijk van God te verstaan; maar aan hen die buiten zijn, gebeurt dit alles door gelijkenissen;", "2 Kron 14:11": "En Asa riep tot de HEERE, zijn God, en zei: HEERE, het is voor U niets, te helpen hetzij de machtige, hetzij de krachteloze; help ons, o HEERE, onze God! Want wij steunen op U, en in Uw Naam zijn wij gekomen tegen deze menigte; o HEERE! U bent onze God; laat een sterfelijk mens tegen U niets vermogen.", "Mark 14:36": "En Hij zei: Abba, Vader! Alle dingen zijn U mogelijk; neem deze drinkbeker van Mij weg; maar niet wat Ik wil, maar wat U wilt.", "Jes 60:19-21": "De zon zal voor u niet meer zijn tot een licht overdag, en tot een glans zal de maan u niet lichten; maar de HEERE zal u tot een eeuwig licht zijn, en uw God tot uw sierlijkheid. Uw zon zal niet meer ondergaan, en uw maan zal haar licht niet intrekken; want de HEERE zal u tot een eeuwig licht zijn, en de dagen van uw treuren zullen een einde nemen. En uw volk zullen allen samen rechtvaardig zijn, zij zullen voor eeuwig de aarde erfelijk bezitten; zij zullen zijn een scheut van Mijn planting, een werk van Mijn handen, opdat Ik verheerlijkt word.", "Lev 26:40-45": "Dan zullen zij hun ongerechtigheid belijden, en de ongerechtigheid van hun vaderen met hun overtredingen, waarmee zij tegen Mij overtreden hebben, en ook dat zij tegen Mij in gewandeld hebben. Dat Ik ook tegen hen in gewandeld heb, en hen in het land van hun vijanden gebracht heb. Als dan hun onbesneden hart gebogen wordt, en zij dan de straf voor hun ongerechtigheid aanvaarden; Dan zal Ik denken aan Mijn verbond met Jakob, en ook aan Mijn verbond met Izak, en ook aan Mijn verbond met Abraham zal Ik denken, en aan het land zal Ik denken;", "Jes 23:1": "De last van Tyrus. Huil, u schepen van Tarsis! Want zij is verwoest, zodat er geen huis meer is, zodat niemand er meer in kan gaan; uit het land Chittim is het aan hen bekendgemaakt.", "Ps 72:1-17": "Voor Salomo. O God! Geef de koning Uw rechten, en Uw gerechtigheid de zoon van de koning. Zo zal hij Uw volk richten met gerechtigheid, en Uw ellendigen met recht. De bergen zullen aan het volk vrede dragen, ook de heuvels, met gerechtigheid.", "Ps 110:2": "De HEERE zal de scepter van Uw sterkte zenden uit Sion, en zeggen: Heers in het midden van Uw vijanden.", "Zef 3:9-20": "Zeker, dan zal Ik tot de volken een reine spraak wenden; opdat zij allen de Naam van de HEERE aanroepen, opdat zij Hem dienen met één schouder³. Van de zijden van de rivieren van Morenland zullen Mijn ernstige aanbidders, met de dochter van Mijn verstrooiden, Mijn offeranden brengen. Op die dag zult u niet beschaamd zijn vanwege al uw handelingen, waarmee u tegen Mij overtreden hebt; want dan zal Ik uit uw midden wegnemen wie van vreugde opspringen over uw hoogmoed, en u zult zich voortaan niet meer verheffen om Mijn heilige berg.", "Zach 9:10": "En Ik zal de wagens uit Efraïm uitroeien, en de paarden uit Jeruzalem; ook zal de strijdboog uitgeroeid worden, en Hij zal tot de heidenen vrede spreken; en Zijn heerschappij zal zijn van zee tot aan zee, en van de rivier tot aan de einden van de aarde.", "Ps 102:14-17": "U zult opstaan, U zult U ontfermen over Sion, want de tijd om haar genadig te zijn, want de bestemde tijd is gekomen. Want Uw knechten hebben een welgevallen aan haar stenen, en hebben medelijden met haar gruis. Dan zullen de heidenen de Naam van de HEERE vrezen, en alle koningen van de aarde Uw heerlijkheid.", "Ps 5:13": "Want U, HEERE, zult de rechtvaardige zegenen; U zult hem met goedgunstigheid kronen, als met een schild.", "Fil 1:27": "Alleen, leef op een wijze die het Evangelie van Christus waardig is, opdat, hetzij ik kom en u zie, hetzij ik afwezig ben, ik van uw zaken mag horen, dat u staat in één geest, met één gemoed gezamenlijk strijdend door het geloof van het Evangelie;", "Jes 62:4": "Tegen u zal niet meer gezegd worden: Wie verlaten is; en tegen uw land zal niet meer gezegd worden: Het verwoeste; maar u zult genoemd worden: Mijn lust is aan haar! en uw land: Het getrouwde; want de HEERE heeft een lust aan u, en uw land zal getrouwd worden.", "Ps 145:10": "Jod. Al Uw werken, HEERE, zullen U loven, en Uw gunstgenoten zullen U zegenen.", "Ezech 47:1-12": "Daarna bracht hij mij terug naar de deur van het huis, en zie, er stroomde water uit van onder de drempel van het huis naar het oosten; want de voorkant van het huis lag naar het oosten, en het water daalde af van onderen, uit de rechterzijde van het huis, ten zuiden van het altaar. En hij bracht mij naar buiten door de noordpoort, en leidde mij rondom via de weg van buiten naar de buitenpoort, de weg die naar het oosten kijkt; en zie, het water sprong eruit aan de rechterzijde. Toen die man naar het oosten uitging, had hij een meetsnoer in zijn hand; en hij mat duizend el, en liet mij door het water gaan, en het water kwam tot aan de enkels.", "Rom 16:19": "Want uw gehoorzaamheid is bij allen bekend geworden. Ik verblijd mij dan over u; en ik wil dat u wijs bent in het goede, maar onbedorven in het kwade.", "Jes 33:22": "Want de HEERE is onze Rechter, de HEERE is onze Wetgever, de HEERE is onze Koning. Hij zal ons redden.", "Deut 32:29": "O, dat zij wijs waren; zij zouden dit vernemen, zij zouden op hun einde letten.", "Deut 32:36": "Want de HEERE zal Zijn volk recht doen, en het zal Hem berouwen over Zijn knechten; want Hij zal zien, dat de hand is weggegaan, en er niemand meer over is, gebonden of vrij.", "Ps 85:14": "De gerechtigheid zal voor Zijn aangezicht heengaan, en Hij zal ze zetten op de weg van Zijn voetstappen.", "Deut 24:19-22": "Wanneer u uw oogst op uw akker afgeoogst hebt, en een garf op de akker vergeten bent, zult u niet terugkeren om die op te halen; voor de vreemdeling, voor de wees en voor de weduwe zal die zijn; opdat de HEERE, uw God, u zegent in al het werk van uw handen. Wanneer u uw olijfboom geschud hebt, zult u de takken daarna niet nauwkeurig doorzoeken; voor de vreemdeling, voor de wees en voor de weduwe zal het zijn. Wanneer u uw wijngaard hebt afgeplukt, zult u de druiven daarna niet nalezen; voor de vreemdeling, voor de wees en voor de weduwe zal het zijn.", "2 Kor 4:4": "In hen heeft de god van deze eeuw de zinnen verblind, namelijk van de ongelovigen, opdat hen niet zou bestralen de verlichting van het Evangelie van de heerlijkheid van Christus, Die het Beeld van God is.", "Ps 74:15": "U hebt een bron en beek gekliefd; U hebt sterke rivieren uitgedroogd.", "Ps 32:2": "Gelukkig is de mens, die de HEERE de ongerechtigheid niet toerekent, en in wiens geest geen bedrog is.", "Jes 33:10": "Nu zal Ik opstaan, zegt de HEERE, nu zal Ik verhoogd worden, nu zal Ik verheven worden.", "Luk 3:11": "En hij antwoordde en zei tegen hen: Wie twee stukken kleding heeft, moet delen met wie er geen heeft; en wie voedsel heeft, moet hetzelfde doen.", "Jes 25:4": "Want U bent voor de arme een Sterkte geweest, een Sterkte voor de nooddruftige, toen het hem bang was; een Toevlucht tegen de vloed, een Schaduw tegen de hitte; want het blazen van de tirannen is als een vloed tegen een wand.", "1 Kor 6:13": "De spijzen zijn voor de buik, en de buik is voor de spijzen; maar God zal beide dit en dat tenietdoen. Maar het lichaam is niet voor de hoererij, maar voor de Heere, en de Heere voor het lichaam.", "2 Kor 10:3": "Want al wandelen wij in het vlees, wij voeren de strijd niet naar het vlees;", "Deut 33:2": "Hij zei: De HEERE is van Sinaï gekomen, en is hun opgegaan van Seïr; Hij is blinkend verschenen van het gebergte Paran, en is aangekomen met tienduizenden van de heiligen; tot Zijn rechterhand was een vurige wet aan hen.", "Zach 1:14": "En de Engel Die met mij sprak, zei tegen mij: Roep uit en zeg: Zo zegt de HEERE van de heerscharen: Ik ijver over Jeruzalem en over Sion met een grote ijver.", "Jes 49:7": "Zo zegt de HEERE, de Verlosser van Israël, Zijn Heilige, tegen de veracht ziel, tegen Hem aan Wie het volk een gruwel heeft, tegen de Knecht van hen die heersen: Koningen zullen het zien en opstaan, ook vorsten, en zij zullen zich voor U buigen; om de wil van de HEERE, Die getrouw is, om de Heilige van Israël, Die U verkozen heeft.", "Ps 60:6": "Maar nu hebt U hun die U vrezen een banier gegeven, om die op te werpen, vanwege de waarheid. Sela.", "Ef 5:8": "Want u was eertijds duisternis, maar nu bent u licht in de Heere; wandel als kinderen van het licht.", "Jes 35:1": "De woestijn en de dorre plaatsen zullen hierover vrolijk zijn, en de wildernis zal zich verheugen, en zal bloeien als een roos.", "Jer 15:20": "Want Ik heb u tegen dit volk gesteld tot een koperen versterkte muur; zij zullen wel tegen u strijden, maar u niet overwinnen; want Ik ben met u, om u te behouden en om u te redden, spreekt de HEERE.", "Ezech 34:25": "En Ik zal een verbond van vrede met hen maken, en zal het boze gedierte uit het land doen ophouden; en zij zullen zeker wonen in de woestijn, en slapen in de wouden.", "1 Joh 3:18": "Mijn kinderen, laten wij niet liefhebben met het woord of met de tong, maar met de daad en waarheid.", "Klaagl 3:31-33": "Caph. Want de Heere zal niet verstoten in eeuwigheid. Caph. Maar als Hij bedroefd heeft, zo zal Hij Zich ontfermen, naar de grootheid van Zijn blijken van goedertierenheid. Caph. Want Hij plaagt of bedroeft de kinderen van de mensen niet van harte.", "Pred 8:4": "Waar het woord van de koning is, daar is macht; en wie zal tegen hem zeggen: Wat doet u?", "Fil 1:10": "Opdat u beproeft wat het beste is, opdat u oprecht bent, en zonder aanstoot te geven, tot de dag van Christus;", "Ps 2:10": "Nu dan, koningen, handelt verstandig; laat u onderwijzen, rechters van de aarde!", "Lev 11:47": "Om onderscheid te maken tussen het onreine en het reine, en tussen het gedierte dat men mag eten en het gedierte dat men niet eten mag.", "Jes 55:1": "O, alle dorstigen, kom tot de wateren, en u die geen geld heeft, kom, koop en eet, ja kom, koop zonder geld en zonder prijs, wijn en melk!", "1 Tess 5:4": "Maar u, broeders, u bent niet in duisternis, zodat die dag u als een dief zou overvallen.", "Ex 24:17": "En het aanzien van de heerlijkheid van de HEERE was als een verterend vuur, op de top van die berg, in de ogen van de kinderen Israëls.", "Spr 1:30": "Zij hebben in Mijn raad niet toegestemd; al Mijn bestraffingen hebben zij versmaad;", "Gen 18:32": "Nog zei hij: Laat de Heere toch niet boos worden, dat ik alleen deze keer nog spreek: misschien zullen er tien gevonden worden. En Hij zei: Ik zal haar niet verwoesten omwille van de tien.", "Joh 14:13": "En wat u ook zult vragen in Mijn Naam, dat zal Ik doen, opdat de Vader in de Zoon verheerlijkt wordt.", "Dan 12:4": "En u, Daniël! sluit deze woorden toe, en verzegel dit boek, tot de tijd van het einde; velen zullen het naspeuren, en de kennis zal toenemen.", "Fil 4:8": "Verder, broeders, alles wat waar is, alles wat eerbaar is, alles wat rechtvaardig is, alles wat rein is, alles wat lieflijk is, alles wat goed klinkt, als er enige deugd is, en als er enige lof is, denk daaraan;", "Ex 20:24": "Maak Mij een altaar van aarde, en offer daarop uw brandoffers en uw dankoffers, uw schapen en uw runderen; op elke plaats waar Ik Mijn Naam gedenken zal, zal Ik tot u komen en zal u zegenen.", "2 Petr 3:15": "En beschouw het geduld van onze Heere als redding; zoals ook onze geliefde broeder Paulus, naar de wijsheid die hem gegeven is, aan u geschreven heeft;", "Luk 2:52": "En Jezus nam toe in wijsheid en grootte, en in genade bij God en de mensen.", "2 Kron 25:8": "Maar als u toch gaat, doe het dan, wees sterk voor de strijd; God zal u laten vallen voor de vijand; want in God is kracht om te helpen en om te doen vallen.", "Jes 29:19": "En de zachtmoedigen zullen vreugde op vreugde hebben in de HEERE; en de behoeftigen onder de mensen zullen zich in de Heilige van Israël verheugen.", "Spr 1:29": "Omdat zij de wetenschap gehaat hebben, en de vrees van de HEERE niet hebben verkozen.", "Jes 32:1": "Zie, een koning zal regeren in gerechtigheid, en de vorsten zullen heersen naar recht.", "Jes 49:3": "En Hij heeft tegen Mij gezegd: U bent Mijn Knecht, Israël, door Wie Ik verheerlijkt zal worden.", "Joh 14:17": "Namelijk de Geest van de waarheid, Die de wereld niet kan ontvangen, want zij ziet Hem niet, en kent Hem niet; maar u kent Hem, want Hij blijft bij u, en zal in u zijn.", "Jak 5:15": "En het gebed van het geloof zal de zieke behouden, en de Heere zal hem oprichten; en als hij zonden gedaan heeft, zal het hem vergeven worden.", "Openb 3:12": "Wie overwint, hem zal Ik maken tot een pilaar in de tempel van Mijn God, en hij zal daar niet meer uitgaan; en Ik zal op hem de Naam van Mijn God schrijven, en de naam van de stad van Mijn God, namelijk het nieuwe Jeruzalem, dat uit de hemel neerdaalt van Mijn God vandaan, en ook Mijn nieuwe Naam.", "Ps 116:5": "De HEERE is genadig en rechtvaardig, en onze God ontfermt Zich.", "Ps 18:31": "Gods weg is volmaakt; de rede van de HEERE is doorlouterd; Hij is een Schild voor allen die op Hem vertrouwen.", "Job 13:11": "Zal Zijn hoogheid u niet verschrikken, en Zijn schrik over u vallen?", "Jes 54:8": "In een kleine toorn heb Ik Mijn aangezicht van u een ogenblik verborgen; maar met eeuwige goedertierenheid zal Ik Mij over u ontfermen, zegt de HEERE, uw Verlosser.", "Jes 63:14": "Zoals een dier dat afgaat in de valleien, heeft de Geest van de HEERE hun rust gegeven. Zo hebt U Uw volk geleid, opdat U Uzelf een heerlijke Naam zou maken.", "Joh 8:27": "Zij begrepen niet dat Hij tot hen over de Vader sprak.", "Pred 2:13": "Toen zag ik dat de wijsheid uitmunt boven de dwaasheid, zoals het licht uitmunt boven de duisternis.", "Jes 42:1-12": "Zie, Mijn Knecht, Die Ik ondersteun, Mijn Uitverkorene, in Wie Mijn ziel een welbehagen heeft! Ik heb Mijn Geest op Hem gegeven; Hij zal het recht aan de heidenen voortbrengen. Hij zal niet schreeuwen, noch Zijn stem verheffen, noch Zijn stem op straat horen laten. Het geknakte riet zal Hij niet breken, en de rokende vlaswiek zal Hij niet uitblussen; met waarheid zal Hij het recht voortbrengen.", "Hab 3:9-11": "De naakte grond werd ontbloot door Uw boog, om de eden, aan de stammen gedaan door het woord. Sela. U hebt de rivieren van de aarde gekloofd. De bergen zagen U, en leden smart; de waterstroom ging erdoorheen, de afgrond gaf zijn stem, hij hief zijn handen op in de hoogte. De zon en de maan stonden stil in hun woning; met het licht gingen Uw pijlen daarheen, met glans Uw bliksemende speer.", "Jes 58:12": "En zij die uit u voortkomen, zullen de oude verwoeste plaatsen bouwen; de fundamenten, van geslacht tot geslacht verwoest, zult u oprichten; en u zult genoemd worden: Die de bressen dichtmuurt, die de paden weer opmaakt, om te bewonen.", "1 Petr 1:14-16": "Als gehoorzame kinderen, vorm u niet naar de begeerten die u vroeger, in uw onwetendheid, had; maar word, zoals Hij Die u geroepen heeft heilig is, ook zelf heilig in heel uw levenswandel; want er staat geschreven: Wees heilig, want Ik ben heilig.", "Spr 11:23": "Het verlangen van de rechtvaardigen is alleen het goede; maar de verwachting van de goddelozen is verbolgenheid.", "Ef 2:16": "en opdat Hij die beiden met God in één lichaam zou verzoenen door het kruis, nadat Hij de vijandschap daaraan gedood had.", "Ps 108:5": "Want Uw goedertierenheid is groot tot boven de hemelen, en Uw waarheid tot aan de bovenste wolken.", "Ps 87:4": "Ik zal Rahab en Babel vermelden, onder hen die Mij kennen; zie, de Filistijn en de Tyriër, met de Moor, deze is daar geboren.", "Ps 88:2": "O HEERE, God van mijn heil! Bij dag, bij nacht roep ik voor U.", "Hand 15:17": "opdat de overige mensen de Heere zoeken, en alle heidenen, over wie Mijn Naam aangeroepen is, zegt de Heere, Die dit alles doet.", "Joh 1:5": "En het Licht schijnt in de duisternis, en de duisternis heeft het niet begrepen.", "Jes 45:8": "Drupt, hemelen! van boven af, en laat de wolken vloeien van gerechtigheid; en laat de aarde zich openen, en laat allerlei heil uitwassen, en gerechtigheid samen uitspruiten; Ik, de HEERE, heb ze geschapen.", "Jes 49:22": "Zo zegt de Heere HEERE: Zie, Ik zal Mijn hand opheffen naar de heidenen, en naar de volken zal Ik Mijn banier opsteken; dan zullen zij uw zonen in de armen brengen, en uw dochters zullen op de schouder gedragen worden.", "Ex 15:6-8": "O HEERE! Uw rechterhand is verheerlijkt in macht; Uw rechterhand, o HEERE, heeft de vijand verbroken! En door Uw grote hoogheid hebt U hen die tegen U opstonden, omgeworpen; U hebt Uw brandende toorn losgelaten, die hen verteerd heeft als een stoppel. En door het geblaas van Uw neus zijn de wateren opgehoopt; de stromen hebben overeind gestaan als een hoop; de afgronden zijn stijf geworden in het hart van de zee.", "Ps 85:11-13": "De goedertierenheid en waarheid zullen elkaar ontmoeten; de gerechtigheid en vrede zullen elkaar kussen. De waarheid zal uit de aarde opkomen, en gerechtigheid zal vanuit de hemel neerzien. Ook zal de HEERE het goede geven; en ons land zal zijn vrucht geven.", "Ps 126:2": "Toen was onze mond vol lachen, en onze tong vol gejuich; toen zei men onder de heidenvolken: De HEERE heeft grote dingen aan hen gedaan.", "Deut 1:13": "Neem voor u wijze, verstandige en ervaren mannen, uit uw stammen, zodat ik hen tot uw hoofden stel.", "Joël 2:13": "En scheurt uw hart en niet uw kleren, en bekeert u tot de HEERE, uw God; want Hij is genadig en barmhartig, geduldig en groot van goedertierenheid, en Hij heeft berouw over het kwade.", "Joh 17:26": "En Ik heb hun Uw Naam bekendgemaakt, en zal Hem bekendmaken; opdat de liefde waarmee U Mij liefgehad hebt, in hen is, en Ik in hen.", "Zach 9:14": "En de HEERE zal over hen verschijnen, en Zijn pijlen zullen uitgaan als een bliksem; en de Heere HEERE zal met de bazuin blazen, en Hij zal voorttrekken met stormen uit het zuiden.", "Jes 26:3": "Het is een vast voornemen: U zult allerlei vrede bewaren, want men heeft op U vertrouwd.", "Gen 32:28": "Toen zei Hij: Uw naam zal voortaan niet meer Jakob heten, maar Israël; want u hebt zich als een vorst gedragen tegenover God en tegenover de mensen, en hebt de overhand gekregen.", "Rom 10:13": "Want ieder die de Naam van de Heere zal aanroepen, zal zalig worden.", "Pred 7:25": "Ik keerde mij om, en mijn hart, om te weten, en om na te sporen, en te zoeken wijsheid en een verklaring; en om te weten de goddeloosheid van de dwaasheid, en de onzinnigheid van de waanzin.", "Joh 7:38": "Wie in Mij gelooft, zoals de Schrift zegt: stromen van levend water zullen uit zijn buik vloeien.", "Mark 9:49": "Want ieder zal met vuur gezouten worden, en elk offer zal met zout gezouten worden.", "Rom 1:8": "Eerst dank ik mijn God door Jezus Christus voor u allen, dat uw geloof verkondigd wordt in de hele wereld.", "1 Tim 6:11": "Maar u, mens van God, vlucht voor deze dingen; en jaag naar gerechtigheid, godsvrucht, geloof, liefde, volharding, zachtmoedigheid.", "Hand 7:49": "De hemel is Mij een troon, en de aarde een voetbank voor Mijn voeten. Wat voor huis zult u Mij bouwen, zegt de Heere, of wat is de plaats van Mijn rust?", "Openb 2:21": "En Ik heb haar tijd gegeven, opdat zij zich zou bekeren van haar hoererij, en zij heeft zich niet bekeerd.", "Jer 10:13": "Als Hij Zijn stem geeft, zo is er een gedruis van water in de hemel, en Hij doet de dampen opklimmen van het einde van de aarde; Hij maakt de bliksems met de regen, en doet de wind voortkomen uit Zijn schatkamers.", "Jes 14:24": "De HEERE van de heerscharen heeft gezworen: Voorzeker, zoals Ik gedacht heb, zo zal het gebeuren, en zoals Ik beraadslaagd heb, zo zal het bestaan!", "1 Kron 16:34": "Looft de HEERE, want Hij is goed, want Zijn goedertierenheid is tot in eeuwigheid.", "Ps 72:18": "Geloofd zij de HEERE God, de God van Israël, Die alleen wonderen doet.", "Hos 4:1": "Hoor het woord van de Heere, kinderen van Israël! Want de Heere heeft een geschil met de inwoners van het land, omdat er geen trouw, en geen goedertierenheid, en geen kennis van God in het land is;", "Rom 11:11-15": "Zo zeg ik dan: Hebben zij gestruikeld, opdat zij zouden vallen? Dat zij verre; maar door hun val is de zaligheid de heidenen geworden, om hen tot jaloersheid te verwekken. En als hun val de rijkdom is van de wereld, en hun vermindering de rijkdom van de heidenen, hoeveel te meer hun volheid! Want ik spreek tot u, heidenen, voor zoveel ik apostel van de heidenen ben; ik maak mijn bediening heerlijk;", "Rom 11:26": "En zo zal heel Israël zalig worden; zoals geschreven is: De Verlosser zal uit Sion komen en zal de goddeloosheden afwenden van Jakob.", "2 Tim 3:7": "vrouwtjes die altijd leren, en nooit tot kennis van de waarheid kunnen komen.", "Ezra 7:12-28": "Arthahsasta, koning der koningen, aan Ezra, de priester, de schriftgeleerde van de wet van de God van de hemel, volkomen vrede en op zulke tijd. Van mij wordt bevel gegeven dat ieder die vrijwillig is in mijn koninkrijk, van het volk van Israël, en van diens priesters en Levieten, om te gaan naar Jeruzalem, dat hij met u gaat. Omdat u van voor de koning en zijn zeven raadsheren gezonden bent, om onderzoek te doen in Judea, en te Jeruzalem, naar de wet van uw God, die in uw hand is;", "Ex 32:34": "Ga nu heen, leid dit volk naar waar Ik u gezegd heb; zie, Mijn Engel zal voor u uit gaan! Maar op de dag van het bezoeken zal Ik hun zonde over hen bezoeken!", "Jes 8:20": "Tot de wet en tot de getuigenis! Als zij niet spreken naar dit woord, zal het zijn dat zij geen dageraad zullen hebben.", "Ps 66:7": "Hij heerst eeuwig met Zijn macht; Zijn ogen houden wacht over de heidenvolken; laat de afvalligen niet verhoogd worden. Sela.", "Jer 9:6": "Uw woning is in het midden van bedrog; door bedrog weigeren zij Mij te kennen, spreekt de HEERE.", "Luk 23:34": "En Jezus zei: Vader, vergeef het hun; want zij weten niet wat zij doen. En zij verdeelden Zijn kleren en wierpen erom het lot.", "Jes 2:2-4": "En het zal gebeuren in de laatste dagen, dat de berg van het huis van de HEERE vastgesteld zal zijn op de top van de bergen, en dat hij verheven zal worden boven de heuvels, en tot hem zullen alle heidenvolken toevloeien. En veel volken zullen heengaan en zeggen: Kom, laat ons opgaan tot de berg van de HEERE, tot het huis van de God van Jakob, opdat Hij ons leert van Zijn wegen, en dat wij wandelen in Zijn paden; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem. En Hij zal rechtspreken onder de heidenvolken, en bestraffen veel volken; en zij zullen hun zwaarden slaan tot spaden, en hun speren tot snoeimessen; het ene volk zal tegen het andere volk geen zwaard opheffen, en zij zullen geen oorlog meer leren.", "Jes 46:10": "Die vanaf het begin aan verkondigt het einde, en van oudsher af die dingen, die nog niet gebeurd zijn; Die zegt: Mijn raad zal standhouden, en Ik zal al Mijn welbehagen doen.", "Hebr 10:34": "Want u hebt ook medelijden gehad met mij in mijn boeien, en de beroving van uw bezittingen met blijdschap aanvaard, wetende dat u voor uzelf een beter en blijvend bezit hebt in de hemelen.", "Deut 26:19": "opdat Hij u zo boven alle volken die Hij gemaakt heeft, hoog zet, tot lof, en tot een naam, en tot heerlijkheid; en opdat u een heilig volk bent voor de HEERE, uw God, zoals Hij gesproken heeft.", "Ps 65:3": "U hoort het gebed; tot U zal alle vlees komen.", "Job 11:10": "Als Hij voorbijgaat, om af te snijden of te vergaderen, wie zal Hem dan tegenhouden?", "Ps 104:31": "De heerlijkheid van de HEERE zij tot in eeuwigheid; de HEERE verblijde Zich in Zijn werken.", "Dan 7:13": "Verder zag ik in de nachtgezichten, en zie, er kwam Een met de wolken van de hemel, als eens mensen zoon, en Hij kwam tot de Oude van dagen, en men liet Hem voor Hem naderen.", "Jes 52:2": "Schud u uit het stof, sta op, ga zitten, o Jeruzalem! Maak u los van de banden van uw hals, u gevangen dochter van Sion!", "Hand 17:31": "Omdat Hij een dag vastgesteld heeft, waarop Hij de aardbodem rechtvaardig zal oordelen, door een Man Die Hij daartoe aangesteld heeft, en Hij heeft daarvan aan allen zekerheid gegeven doordat Hij Hem uit de doden heeft opgewekt.", "Micha 4:4": "Maar zij zullen zitten, ieder onder zijn wijnstok en onder zijn vijgenboom, en er zal niemand zijn die hen verschrikt; want de mond van de HEERE van de heerscharen heeft het gesproken.", "Hand 20:28": "Zo, geef dan acht op uzelf, en op de hele kudde, waarover de Heilige Geest u tot opzieners heeft aangesteld, om de gemeente van God te weiden, die Hij verkregen heeft door Zijn eigen bloed.", "Ps 65:8": "Die het bruisen van de zeeën stilt, het bruisen van haar golven, en het rumoer van de volken.", "1 Kor 6:19": "Of weet u niet, dat uw lichaam een tempel is van de Heilige Geest, Die in u is, Die u van God hebt, en dat u niet van uzelf bent?", "Num 24:1": "Toen Bileam zag dat het goed was in de ogen van de HEERE dat hij Israël zegende, ging hij ditmaal niet, zoals de andere keren, op zoek naar toverijen; maar hij richtte zijn gezicht naar de woestijn.", "Jer 50:20": "In die dagen en op die tijd, spreekt de HEERE, zal de ongerechtigheid van Israël gezocht worden, maar zij zal er niet zijn, en de zonden van Juda, maar zullen niet gevonden worden; want Ik zal het vergeven aan hen die Ik zal doen overblijven.", "2 Tim 2:19": "Toch staat het vaste fundament van God, met dit zegel: De Heere kent hen die van Hem zijn; en: Ieder die de Naam van Christus noemt, moet afstand nemen van ongerechtigheid.", "Jes 61:5": "En vreemdelingen zullen klaarstaan en uw kudden weiden; en buitenlanders zullen uw akkerlieden en uw wijngaardeniers zijn.", "Deut 31:8": "De HEERE nu is Degene, Die voor u uitgaat; Die zal met u zijn; Hij zal u niet loslaten, en u niet verlaten; vrees niet, en wees niet ontsteld.", "Joh 8:54": "Jezus antwoordde: Als Ik Mijzelf eer, is Mijn eer niets; Mijn Vader is het, Die Mij eert, van Wie u zegt dat Hij uw God is.", "Joh 12:32": "En Ik, wanneer Ik van de aarde verhoogd zal zijn, zal allen tot Mij trekken.", "3 Joh 1:1": "De ouderling aan de geliefde Gajus, die ik in waarheid liefheb.", "Dan 2:44": "Maar in de dagen van die koningen zal de God van de hemel een Koninkrijk oprichten, dat in eeuwigheid niet zal worden verwoest; en dat Koninkrijk zal aan geen ander volk worden overgelaten; het zal al die koninkrijken verbrijzelen en tenietdoen, maar zelf zal het in alle eeuwigheid bestaan.", "Jer 33:6": "Zie, Ik zal haar gezondheid en genezing laten opkomen, en Ik zal hen genezen, en Ik zal hun een overvloed van vrede en waarheid openbaren.", "Jes 56:7": "Die zal Ik ook brengen naar Mijn heilige berg, en Ik zal hen verheugen in Mijn huis van gebed; hun brandoffers en hun slachtoffers zullen aangenaam zijn op Mijn altaar; want Mijn huis zal een huis van gebed genoemd worden voor alle volken.", "Hebr 12:24": "En tot de Middelaar van het nieuwe testament, Jezus, en het bloed van de besprenging, dat betere dingen spreekt dan Abel.", "1 Joh 1:7": "Maar als wij in het licht wandelen, zoals Hij in het licht is, dan hebben wij gemeenschap met elkaar, en het bloed van Jezus Christus, Zijn Zoon, reinigt ons van alle zonde.", "Ps 42:2": "Zoals een hert schreeuwt naar de waterstromen, zo schreeuwt mijn ziel tot U, o God!", "Joh 8:50": "Maar Ik zoek Mijn eer niet; er is Iemand Die haar zoekt en oordeelt.", "Mark 4:15": "En dezen zijn zij die langs de weg bezaaid worden, waarin het Woord gezaaid wordt; en wanneer zij het gehoord hebben, komt de satan meteen, en neemt het Woord weg, dat in hun hart gezaaid was.", "Ps 50:2": "Uit Sion, de volkomenheid van de schoonheid, verschijnt God blinkend.", "Jes 43:25": "Ik, Ik ben het, Die uw overtredingen uitwis, om Mijnentwil, en Ik denk aan uw zonden niet.", "Ezech 17:23": "op de berg van de hoogte van Israël zal Ik hem planten; en hij zal takken voortbrengen, en vrucht dragen, en hij zal tot een heerlijke ceder worden, zodat onder hem alle vogels van allerlei vleugel zullen wonen; in de schaduw van zijn takken zullen zij wonen.", "1 Joh 2:12-15": "Ik schrijf u, kinderen, want de zonden zijn u vergeven omwille van Zijn Naam. Ik schrijf u, vaders! want u hebt Hem gekend, Die er vanaf het begin is. Ik schrijf u, jongemannen, want u hebt de boze overwonnen. Ik schrijf u, kinderen, want u hebt de Vader gekend. Ik heb u geschreven, vaders, want u hebt Hem gekend, Die er vanaf het begin is. Ik heb u geschreven, jongemannen, want u bent sterk, en het Woord van God blijft in u, en u hebt de boze overwonnen.", "Jes 23:18": "En haar koophandel en haar hoerenloon zullen de HEERE heilig zijn, het zal niet als schat verzameld worden, en ook niet weggesloten; maar haar koophandel zal er zijn voor hen die voor het aangezicht van de HEERE wonen, opdat zij tot verzadiging eten, en opdat zij duurzame kleding hebben.", "Jes 52:9": "Maakt een geschal, juicht samen, u woeste plaatsen van Jeruzalem! Want de HEERE heeft Zijn volk getroost, Hij heeft Jeruzalem verlost.", "Gen 13:2": "En Abram was zeer rijk, in vee, in zilver, en in goud.", "Mal 1:11": "Maar van de opgang van de zon tot haar ondergang, zal Mijn Naam groot zijn onder de heidenen; en op elke plaats zal aan Mijn Naam reukwerk gebracht worden, en een rein spijsoffer; want Mijn Naam zal groot zijn onder de heidenen, zegt de HEERE van de heerscharen.", "2 Kron 5:13": "het gebeurde dan, toen zij eenparig trompetten en zongen, om één stem te laten horen, terwijl zij de HEERE prezen en loofden; en toen zij de stem verhieven met trompetten, en met cimbalen, en andere muzikale instrumenten, en toen zij de HEERE prezen, omdat Hij goed is, omdat Zijn goedertierenheid tot in eeuwigheid is; dat het huis met een wolk vervuld werd, namelijk het huis van de HEERE.", "Openb 3:19": "Ieder die Ik liefheb, die bestraf en tuchtig Ik; wees dan ijverig, en bekeer u.", "Jes 45:14": "Zo zegt de HEERE: De arbeid van de Egyptenaren en de koophandel van de Moren en van de Sabeërs, mannen van grote lengte, zullen tot u overkomen, en zij zullen van u zijn, zij zullen u navolgen, in boeien zullen zij overkomen; en zij zullen zich voor u buigen, zij zullen u smeken, en zeggen: Zeker, God is in u, en er is verder geen God meer.", "Joh 8:47": "Wie uit God is, hoort de woorden van God; daarom hoort u niet, omdat u niet uit God bent.", "Jes 49:18-23": "Hef uw ogen op rondom, en zie, al dezen verzamelen zich, zij komen tot u; Zo waarachtig als Ik leef, spreekt de HEERE, zeker zult u zich met al dezen als met een sieraad bekleden, en u zult ze u aanbinden, zoals een bruid. Want in uw woeste en uw eenzame plaatsen, en uw verwoeste land, zeker, nu zult u benauwd worden van inwoners; en zij die u verslonden, zullen zich ver van u maken. Nog zullen de kinderen, waarvan u beroofd was, zeggen voor uw oren: De plaats is mij te nauw, wijk van mij, dat ik wonen mag.", "Job 38:37": "Wie kan de wolken met wijsheid tellen, en wie kan de flessen van de hemel neerleggen?", "Hebr 6:10": "Want God is niet onrechtvaardig, dat Hij uw werk zou vergeten, en de inzet van de liefde die u aan Zijn Naam bewezen hebt, doordat u de heiligen gediend hebt en nog dient.", "Zach 2:7": "Hoi, Sion! ontkom, u die woont bij de dochter van Babel!", "Jes 62:1": "Om Sion zal Ik niet zwijgen, en om Jeruzalem zal Ik niet stil zijn; totdat haar gerechtigheid voortkomt als een glans, en haar heil als een fakkel, die brandt.", "Ps 119:64": "HEERE! de aarde is vol van Uw goedertierenheid; leer mij Uw inzettingen.", "Deut 32:39": "Zie nu, dat Ik, Ik DIE ben, en geen God met Mij; Ik dood en maak levend; Ik versla en Ik heel; en er is niemand die uit Mijn hand redt!", "1 Sam 2:26": "En de jongen Samuël nam toe, en werd groot en aangenaam, zowel bij de HEERE als ook bij de mensen.", "Lev 26:6": "Ook zal Ik vrede geven in het land, zodat u zult gaan slapen, en niemand is er die u verschrikt; en Ik zal het boze gedierte uit het land doen ophouden, en het zwaard zal door uw land niet doorgaan.", "Lev 11:45": "Want Ik ben de HEERE, Die u uit het land Egypte doet optrekken, opdat Ik u tot een God zij, en opdat u heilig bent, omdat Ik heilig ben.", "2 Kron 36:15": "En de HEERE, de God van hun vaderen, zond tot hen, door de hand van Zijn boden, vroeg opstaand, om hen te zenden; want Hij spaarde Zijn volk en Zijn woning.", "Ps 113:3": "Van de opgang van de zon af tot haar neergang zij de Naam van de HEERE geloofd.", "Ps 20:3": "Hij zendt uw hulp uit het heiligdom, en ondersteunt u uit Sion.", "Deut 3:24": "Heere HEERE! U bent begonnen Uw dienaar Uw grootheid en Uw sterke hand te tonen; want welke God is er in de hemel of op de aarde, die kan doen naar Uw werken en naar Uw machtige daden!", "Openb 14:5": "En in hun mond is geen bedrog gevonden; want zij zijn onberispelijk voor de troon van God.", "Hebr 12:14": "Jaag de vrede na met allen, en de heiligmaking, zonder welke niemand de Heere zien zal;", "Mark 4:22": "Want er is niets verborgen, dat niet openbaar zal worden; en er is niets gebeurd om verborgen te blijven, maar opdat het openbaar zou worden.", "2 Kor 8:24": "Bewijs dan aan hen het bewijs van uw liefde, en van onze roem over u, ook voor het aangezicht van de gemeenten.", "Dan 7:14": "En Hem werd gegeven heerschappij, en eer, en het Koninkrijk, dat alle volken, natiën en talen Hem zouden eren; Zijn heerschappij is een eeuwige heerschappij, die niet zal vergaan, en Zijn Koninkrijk zal niet te gronde gericht worden.", "Zef 3:15": "De HEERE heeft uw oordelen weggenomen, Hij heeft uw vijand weggevaagd; de Koning van Israël, de HEERE, is in uw midden, u zult geen kwaad meer zien.", "Jes 24:13": "Want in het binnenste van het land, in het midden van deze volken, zal het zo zijn als de afschudding van het olijfboom, als de nalezingen, wanneer de wijnoogst geëindigd is.", "Zach 9:1": "De last van het woord van de HEERE over het land Chadrach en Damaskus, zijn rustplaats; want de HEERE heeft een oog op de mens, zoals op alle stammen van Israël.", "Ps 33:19": "Om hun ziel van de dood te redden, en om hen bij het leven te houden in de honger.", "Jer 20:11": "Maar de HEERE is met mij als een verschrikkelijke Held; daarom zullen mijn vervolgers struikelen, en zullen niets bereiken; zij zijn zeer beschaamd geworden, omdat zij niet verstandig gehandeld hebben; het zal een eeuwige schande zijn, ze zal niet vergeten worden.", "1 Joh 5:5": "Wie is het, die de wereld overwint, dan hij die gelooft dat Jezus de Zoon van God is?", "Matt 11:5": "De blinden worden ziende, en de kreupelen wandelen; de melaatsen worden gereinigd, en de doven horen; de doden worden opgewekt, en de armen wordt het Evangelie verkondigd.", "Hebr 10:22": "laten wij toegaan met een oprecht hart, in volle zekerheid van het geloof, ons hart gereinigd van het kwade geweten, en het lichaam gewassen met rein water.", "Deut 30:2": "En u zult zich bekeren tot de HEERE, uw God, en Zijn stem gehoorzaam zijn, naar alles wat ik u heden gebied, u en uw kinderen, met uw ganse hart en met uw ganse ziel.", "Openb 5:4": "En ik huilde erg, omdat niemand waard bevonden werd om dat boek te openen en te lezen, of erin te zien.", "1 Kon 11:39": "En Ik zal om die reden het nageslacht van David vernederen; maar niet voor altijd.", "Matt 19:26": "En Jezus keek hen aan, en zei tegen hen: Bij de mensen is dat onmogelijk, maar bij God zijn alle dingen mogelijk.", "Joh 3:16": "Want zo lief heeft God de wereld gehad, dat Hij Zijn eniggeboren Zoon gegeven heeft, opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft.", "Fil 3:20": "Maar onze wandel is in de hemelen, waaruit wij ook de Zaligmaker verwachten, namelijk de Heere Jezus Christus;", "1 Joh 4:8": "Wie niet liefheeft, kent God niet; want God is liefde.", "Hand 17:30": "God dan, Die de tijden van de onwetendheid door de vingers gezien heeft, verkondigt nu aan alle mensen, overal, dat zij zich bekeren.", "Luk 12:48": "Maar wie het niet geweten heeft, en dingen gedaan heeft die slagen verdienen, die zal met weinig slagen geslagen worden. En ieder aan wie veel gegeven is, van hem zal veel geëist worden; en aan wie men veel toevertrouwd heeft, van hem zal m
