l":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"De Geest van de Heere HEERE is op Mij, omdat de HEERE Mij gezalfd heeft, om een blijde boodschap te brengen aan de zachtmoedigen; Hij heeft Mij gezonden om te verbinden de gebrokenen van hart, om de gevangenen vrijheid uit te roepen, en de gebondenen opening van de gevangenis;","2":"Om uit te roepen het jaar van het welbehagen van de HEERE, en de dag van de wraak van onze God; om alle treurenden te troosten;","3":"Om de treurenden van Sion te geven, dat hun sieraad gegeven wordt voor as, vreugdeolie voor treurigheid, het gewaad van lof voor een benauwde geest; opdat zij eikenbomen van de gerechtigheid genoemd worden, een planting van de HEERE, opdat Hij verheerlijkt wordt.","4":"En zij zullen de oude, verwoeste plaatsen bouwen, de vorige verstoringen weer oprichten, en de verwoeste steden vernieuwen, die verstoord waren van geslacht op geslacht.","5":"En vreemdelingen zullen klaarstaan en uw kudden weiden; en buitenlanders zullen uw akkerlieden en uw wijngaardeniers zijn.","6":"Maar u zult priesters van de HEERE heten, men zal u dienaren van onze God noemen; u zult het vermogen van de heidenvolken eten, en op hun heerlijkheid zult u zich beroemen.","7":"Voor uw dubbele schaamte en schande zullen zij juichen over hun deel; daarom zullen zij in hun land het dubbele erfelijk bezitten; zij zullen eeuwige vreugde hebben.","8":"Want Ik, de HEERE, heb het recht lief, Ik haat de roof bij het brandoffer, en Ik zal ervoor zorgen dat hun werk in waarheid zal zijn; en Ik zal een eeuwig verbond met hen sluiten.","9":"En hun nageslacht zal onder de heidenvolken bekend worden, en hun nakomelingen te midden van de volken; allen die hen zien zullen, zullen hen erkennen, dat zij een nageslacht zijn, dat de HEERE gezegend heeft.","10":"Ik verheug mij zeer in de HEERE, mijn ziel verblijdt zich in mijn God, want Hij heeft mij bekleed met de klederen van het heil, de mantel van de gerechtigheid heeft Hij mij omgedaan; zoals een bruidegom zich met priesterlijk sieraad versiert, en zoals een bruid zich versiert met haar sieraden.","11":"Want zoals de aarde haar spruit voortbrengt, en zoals een tuin datgene wat erin gezaaid is, laat uitspruiten, zo zal de Heere HEERE gerechtigheid en lof laten uitspruiten voor alle volken."},"SV":{"1":"De Geest des Heeren HEEREN is op Mij, omdat de HEERE Mij gezalfd heeft, om een blijde boodschap te brengen den zachtmoedigen; Hij heeft Mij gezonden om te verbinden de gebrokenen van harte, om den gevangenen vrijheid uit te roepen, en den gebondenen opening der gevangenis;","2":"Om uit te roepen het jaar van het welbehagen des HEEREN, en den dag der wraak onzes Gods; om alle treurigen te troosten;","3":"Om den treurigen Sions te beschikken dat hun gegeven worde sieraad voor as, vreugdeolie voor treurigheid, het gewaad des lofs voor een benauwden geest; opdat zij genaamd worden eikebomen der gerechtigheid, een planting des HEEREN, opdat Hij verheerlijkt worde.","4":"En zij zullen de oude verwoeste plaatsen bouwen, de vorige verstoringen weder oprichten, en de verwoeste steden vernieuwen, die verstoord waren van geslacht tot geslacht.","5":"En uitlanders zullen staan, en uw kudden weiden; en vreemden zullen uw akkerlieden en uw wijngaardeniers zijn.","6":"Doch gijlieden zult priesters des HEEREN heten, men zal u dienaren onzes Gods noemen; gij zult het vermogen der heidenen eten, en in hun heerlijkheid zult gij u roemen.","7":"Voor uw dubbele schaamte en schande zullen zij juichen over hun deel; daarom zullen zij in hun land erfelijk het dubbele bezitten; zij zullen eeuwige vreugde hebben.","8":"Want Ik, de HEERE, heb het recht lief, Ik haat den roof in het brandoffer, en Ik zal geven, dat hun werk in der waarheid zal zijn; en Ik zal een eeuwig verbond met hen maken.","9":"En hun zaad zal onder de heidenen bekend worden, en hun nakomelingen in het midden der volken; allen, die hen zien zullen, zullen hen kennen, dat zij zijn een zaad, dat de HEERE gezegend heeft.","10":"Ik ben zeer vrolijk in den HEERE, mijn ziel verheugt zich in mijn God, want Hij heeft mij bekleed met de klederen des heils, den mantel der gerechtigheid heeft Hij mij omgedaan; gelijk een bruidegom zich met priesterlijk sieraad versiert, en als een bruid zich versiert met haar gereedschap.","11":"Want gelijk de aarde haar spruit voortbrengt, en gelijk een hof, hetgeen in hem gezaaid is, doet uitspruiten; alzo zal de Heere HEERE gerechtigheid en lof doen uitspruiten voor al de volken."},"KJV":{"1":"The Spirit of the Lord GOD *is* upon me; because the LORD hath anointed me to preach good tidings unto the meek; he hath sent me to bind up the brokenhearted, to proclaim liberty to the captives, and the opening of the prison to *them that are* bound;","2":"To proclaim the acceptable year of the LORD, and the day of vengeance of our God; to comfort all that mourn;","3":"To appoint unto them that mourn in Zion, to give unto them beauty for ashes, the oil of joy for mourning, the garment of praise for the spirit of heaviness; that they might be called trees of righteousness, the planting of the LORD, that he might be glorified.","4":"And they shall build the old wastes, they shall raise up the former desolations, and they shall repair the waste cities, the desolations of many generations.","5":"And strangers shall stand and feed your flocks, and the sons of the alien *shall be* your plowmen and your vinedressers.","6":"But ye shall be named the Priests of the LORD: *men* shall call you the Ministers of our God: ye shall eat the riches of the Gentiles, and in their glory shall ye boast","7":"For your shame *ye shall have* double; and *for* confusion they shall rejoice in their portion: therefore in their land they shall possess the double: everlasting joy","8":"For I the LORD love judgment, I hate robbery for burnt offering; and I will direct their work in truth, and I will make an everlasting covenant","9":"And their seed shall be known among the Gentiles, and their offspring among the people: all that see them shall acknowledge them, that they *are* the seed *which* the LORD hath blessed.","10":"I will greatly rejoice in the LORD, my soul shall be joyful in my God; for he hath clothed me with the garments of salvation, he hath covered me with the robe of righteousness, as a bridegroom decketh *himself* with ornaments, and as a bride adorneth *herself* with her jewels.","11":"For as the earth bringeth forth her bud, and as the garden causeth the things that are sown in it to spring forth; so the Lord GOD will cause righteousness and praise to spring forth before all the nations."}},"tsk":{"1":[{"kopje":"Geest","refs":["Jes 11:2-5","Jes 42:1","Jes 59:21","Matt 3:16","Luk 4:18","Luk 4:19","Joh 1:32","Joh 1:33","Joh 3:34"]},{"kopje":"gezalfd","refs":["Ps 2:6","Ps 45:8","Dan 9:24","Joh 1:42","Hand 4:27","Hand 10:38","Hebr 1:9"]},{"kopje":"om een blijde boodschap te brengen","refs":["Jes 52:9","Ps 22:27","Ps 25:9","Ps 69:33","Ps 149:4","Matt 5:3-5","Matt 11:5","Luk 7:22"]},{"kopje":"om te verbinden","refs":["Jes 57:15","Jes 66:2","Ps 34:19","Ps 51:19","Ps 147:3","Hos 6:1","2 Kor 7:6"]},{"kopje":"uit te roepen","refs":["Jes 42:7","Jes 49:9","Jes 49:24","Jes 49:25","Ps 102:21","Jer 34:8","Zach 9:11","Zach 9:12","Joh 8:32-36","Hand 26:18","Rom 6:16-22","Rom 7:23-26","2 Tim 2:25","2 Tim 2:26"]}],"2":[{"kopje":"het welbehagen","refs":["Lev 25:9-13","Luk 4:19","2 Kor 6:2"]},{"kopje":"en","refs":["Jes 34:8","Jes 35:4","Jes 59:17","Jes 59:18","Jes 63:1-6","Jes 66:14","Ps 110:5","Ps 110:6","Jer 46:10","Mal 4:1-3","Luk 21:22-24","1 Tess 2:16","2 Tess 1:7-9"]},{"kopje":"te troosten","refs":["Jes 25:8"," =\"wl wl-kjv\" data-code=\"H7307\">spirit</span> of <span class=\"wl wl-kjv\" data-code=\"H3544\">heaviness;</span> that they might be <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> <span class=\"wl wl-kjv\" data-code=\"H352\">trees</span> of <span class=\"wl wl-kjv\" data-code=\"H6664\">righteousness,</span> the <span class=\"wl wl-kjv\" data-code=\"H4302\">planting</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> that he might be glorified.","4":"And they shall <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> the <span class=\"wl wl-kjv\" data-code=\"H5769\">old</span> <span class=\"wl wl-kjv\" data-code=\"H2723\">wastes,</span> they shall raise <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H7223\">former</span> <span class=\"wl wl-kjv\" data-code=\"H8074\">desolations,</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H2318\">repair</span> the <span class=\"wl wl-kjv\" data-code=\"H2721\">waste</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">cities,</span> the <span class=\"wl wl-kjv\" data-code=\"H8074\">desolations</span> of <span class=\"wl wl-kjv\" data-code=\"H1755\">many</span> generations.","5":"And <span class=\"wl wl-kjv\" data-code=\"H2114\">strangers</span> shall <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> and <span class=\"wl wl-kjv\" data-code=\"H7462\">feed</span> your <span class=\"wl wl-kjv\" data-code=\"H6629\">flocks,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of the <span class=\"wl wl-kjv\" data-code=\"H5236\">alien</span> shall be your <span class=\"wl wl-kjv\" data-code=\"H406\">plowmen</span> and your vinedressers.","6":"But ye shall be <span class=\"wl wl-kjv\" data-code=\"H7121\">named</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">Priests</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> men shall <span class=\"wl wl-kjv\" data-code=\"H559\">call</span> you the <span class=\"wl wl-kjv\" data-code=\"H8334\">Ministers</span> of our <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> ye shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> the <span class=\"wl wl-kjv\" data-code=\"H2428\">riches</span> of the <span class=\"wl wl-kjv\" data-code=\"H1471\">Gentiles,</span> and in their <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> shall ye boast","7":"For your <span class=\"wl wl-kjv\" data-code=\"H1322\">shame</span> ye shall have <span class=\"wl wl-kjv\" data-code=\"H4932\">double;</span> and for <span class=\"wl wl-kjv\" data-code=\"H3639\">confusion</span> they shall <span class=\"wl wl-kjv\" data-code=\"H7442\">rejoice</span> in their <span class=\"wl wl-kjv\" data-code=\"H2506\">portion:</span> therefore in their <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> they shall <span class=\"wl wl-kjv\" data-code=\"H3423\">possess</span> the <span class=\"wl wl-kjv\" data-code=\"H4932\">double:</span> <span class=\"wl wl-kjv\" data-code=\"H5769\">everlasting</span> joy","8":"For I the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H157\">love</span> <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment,</span> I <span class=\"wl wl-kjv\" data-code=\"H8130\">hate</span> <span class=\"wl wl-kjv\" data-code=\"H1498\">robbery</span> for burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering;</span> and I will <span class=\"wl wl-kjv\" data-code=\"H5414\">direct</span> their <span class=\"wl wl-kjv\" data-code=\"H6468\">work</span> in <span class=\"wl wl-kjv\" data-code=\"H571\">truth,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H3772\">make</span> an <span class=\"wl wl-kjv\" data-code=\"H5769\">everlasting</span> covenant","9":"And their <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> shall be <span class=\"wl wl-kjv\" data-code=\"H3045\">known</span> among the <span class=\"wl wl-kjv\" data-code=\"H1471\">Gentiles,</span> and their <span class=\"wl wl-kjv\" data-code=\"H6631\">offspring</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people:</span> all that <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> them shall <span class=\"wl wl-kjv\" data-code=\"H5234\">acknowledge</span> them, that they are the <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath blessed.","10":"I will <span class=\"wl wl-kjv\" data-code=\"H7797\">greatly</span> <span class=\"wl wl-kjv\" data-code=\"H7797\">rejoice</span> in the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> my <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> shall be <span class=\"wl wl-kjv\" data-code=\"H1523\">joyful</span> in my <span class=\"wl wl-kjv\" data-code=\"H430\">God;</span> for he hath <span class=\"wl wl-kjv\" data-code=\"H3847\">clothed</span> me with the <span class=\"wl wl-kjv\" data-code=\"H899\">garments</span> of <span class=\"wl wl-kjv\" data-code=\"H3468\">salvation,</span> he hath <span class=\"wl wl-kjv\" data-code=\"H3271\">covered</span> me with the <span class=\"wl wl-kjv\" data-code=\"H4598\">robe</span> of <span class=\"wl wl-kjv\" data-code=\"H6666\">righteousness,</span> as a <span class=\"wl wl-kjv\" data-code=\"H2860\">bridegroom</span> <span class=\"wl wl-kjv\" data-code=\"H3547\">decketh</span> himself with <span class=\"wl wl-kjv\" data-code=\"H6287\">ornaments,</span> and as a <span class=\"wl wl-kjv\" data-code=\"H3618\">bride</span> <span class=\"wl wl-kjv\" data-code=\"H5710\">adorneth</span> herself with her jewels.","11":"For as the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> bringeth <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> her <span class=\"wl wl-kjv\" data-code=\"H6780\">bud,</span> and as the <span class=\"wl wl-kjv\" data-code=\"H1593\">garden</span> causeth the things that are <span class=\"wl wl-kjv\" data-code=\"H2221\">sown</span> in it to spring <span class=\"wl wl-kjv\" data-code=\"H6779\">forth;</span> so the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD</span> will cause <span class=\"wl wl-kjv\" data-code=\"H6666\">righteousness</span> and <span class=\"wl wl-kjv\" data-code=\"H8416\">praise</span> to spring <span class=\"wl wl-kjv\" data-code=\"H6779\">forth</span> before all the nations."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Geest","tekst":"Dit spreekt Christus, gelijk af te nemen is Luk 4:17 , enz. Zie Joh 1:33 ."},{"catchword":"gezalfd heeft,","tekst":"Door deze zalving wordt verstaan dat Christus naar zijn menselijke natuur met de gaven van den Heiligen Geest zonder mate begaafd en versierd is geworden; en naar den gansen persoon tot onzen Koning, Priester en Profeet van den Vader is verordineerd geworden; zie Heb 1:9 ."},{"catchword":"om een blijde boodschap","tekst":"Of, om een goede boodschap te verkondigen of te prediken. Welke tijding of boodschap is dat? Van de vergeving der zonden, zie Psa 40:10 , en Psa 96:2 ."},{"catchword":"den zachtmoedigen;","tekst":"Of, nederigen, Luk 4:18 , waar deze woorden van den profeet aangehaald worden, staat den armen, te weten den armen van geest, Mat 5:3 ; want den zodanigen wordt het Evangelie gepredikt; Mat 11:5 ."},{"catchword":"om te verbinden","tekst":"Versta dit geestelijkerwijze, namelijk van de vertroosting der ziel, die door de predikatie van het heilig Evangelie geschiedt."},{"catchword":"de gebrokenen","tekst":"Dit zijn degenen, die bedroefd en verslagen van harte zijn vanwege hun menigvuldige zonden en overtredingen; zie Psa 34:19 , en Psa 51:19 ; Isa 57:15 ."},{"catchword":"den gevangenen","tekst":"Dat is, dengenen, die onder het geweld des duivels of van zijne aanhangers gevangen liggen, vanwege hun begane zonden; Rom 7:23 ; 2Ti 2:26 , en 2Ti 3:6 ; zie Isa 42:7 ."},{"catchword":"uit te roepen,","tekst":"Of, te prediken, te verkondigen."},{"catchword":"den gebondenen","tekst":"Dit is hetzelfde, dat straks gezegd is, met andere woorden."}],"2":[{"catchword":"Om uit te roepen","tekst":"Of, om te prediken."},{"catchword":"het jaar","tekst":"Dat is, den tijd, of het jaar in hetwelk het den Heere behagen of believen zal zijne genade den bedroefden conscientiën te openbaren en te bewijzen, te weten door de predikatie van het heilig Evangelie; zie Isa 40:8 ; 2Co 6:2 ; Tit 3:4 ."},{"catchword":"den dag","tekst":"Dat is, dien dag, dien God verordineerd of bestemd heeft, in welken Hij alle ongelovigen, onboetvaardigen en vijanden zijner kerk, mitsgaders den duivel, in de eeuwige verdoemenis werpen zal. Zie Isa 34:8 , en Isa 63:4 ; Luk 18:7 , en 2Co 10:6 ."},{"catchword":"treurigen","tekst":"Te weten die treuren over hunne zonden, waarmede zij God vertoornd hebben; 2Co 7:10-11 ; Jam 4:9 . Of degenen, die treurig zijn vanwege de ellenden der kerk, Isa 66:10 . Want den dusdanigen belooft Christus vertroosting; Mat 5:4 ."}],"3":[{"catchword":"Sions","tekst":"Dat is, der kerk van God."},{"catchword":"sieraad","tekst":"Dit is, schone klederen of heerlijkheid, welk woord Mat 6:29 gebruikt wordt voor schone klederen. Hebreeuws, om hun te geven sieraad, enz."},{"catchword":"as,","tekst":"Die men op het hoofd placht te strooien en daarin te zitten als men treurde."},{"catchword":"vreugdeolie","tekst":"Eertijds placht men ten tijde van vreugde het aangezicht met olie te zalven; maar hier wordt gesproken van de vreugdeolie van den Heiligen Geest, Joh 14:26-27 , en Joh 15:11 . Vergelijkt met de woorden van den profeet hetgeen geschreven staat Heb 1:9 ."},{"catchword":"het gewaad","tekst":"Dat is, een kleed, hetwelk prijzenswaardig is vanwege zijne schoonheid en sierlijkheid; of een kleed, hetwelk men aantrok als men feestdag hield en de gemeente samenkwam om God voor ontvangen genade te danken en te loven. Doch versta hier door het sierlijk gewaad de genaden en giften van den Geest Gods."},{"catchword":"benauwden","tekst":"Of, beangstigden. Hebreeuws, samengewrongen geest, die van hartzeer en droefenis als samengekrompen is."},{"catchword":"geest;","tekst":"Dat is, gemoed."},{"catchword":"eikebomen","tekst":"Bij deze bomen versta degenen, die door het geloof Christus Jezus zijn ingeplant, en die vruchten der gerechtigheid, dat is goede werken dragen. Zie boven Isa 60:21 . De eikebomen der gerechtigheid worden gesteld tegen de eikebomen, die zij misbruikt hadden tot afgoderij. En de gelovigen worden eikebomen genaamd, ten aanzien van hunne sterkte in Christus."}],"4":[{"catchword":"de oude verwoeste","tekst":"Zie de aantekening Isa 58:12 . Dit geestelijkerwijze genomen zijnde, is te zeggen: Zij zullen de ongelovige heidenen tot God bekeren, die langen tijd in hunne zonden als dood gelegen hebben; Eph 2:1 , Eph 2:5 ."},{"catchword":"van geslacht tot geslacht","tekst":"Dat is, die van over vele geslachten geschied zijn."}],"5":[{"catchword":"uitlanders","tekst":"Te weten de bekeerden uit de heidenen. De zin is: God zal ook uit de heidenen leraars en predikanten verwekken, tot opbouwing zijner heilige kerk in het Nieuwe Testament; Act 20:28 ; 1Pe 5:1-2 ."},{"catchword":"kudden","tekst":"Of, schapen; dat is gemeenten."},{"catchword":"weiden;","tekst":"Te weten met Gods Woord."},{"catchword":"vreemden","tekst":"Hebreeuws, de kinderen van den vreemde."},{"catchword":"uw akkerlieden . . . uw wijngaardeniers","tekst":"Dat is, uwe leraars zijn; Mat 21:23 , enz.; 1Co 3:9 ."}],"6":[{"catchword":"priesters","tekst":"Te weten geestelijke priesters, om te offeren de kalveren uwer lippen en uw lichaam tot een redelijken godsdienst eer te begeven; zie Exo 19:6 ; Rom 12:1"},{"catchword":"men zal u","tekst":"Of, en tot ulieden zal gezegd worden; o gij dienaars van onzen God."},{"catchword":"gij zult het","tekst":"Dat is, gij zult de goederen genieten, die u de heidenen mededelen zullen, wanneer zij tot Christus zullen bekeerd wezen. Zie Isa 60:5 ."},{"catchword":"heerlijkheid","tekst":"Dat is, rijkdom."}],"7":[{"catchword":"Voor uw dubbele","tekst":"Die gij geleden hebt van de vijanden der kerk."},{"catchword":"zullen zij","tekst":"Te weten de vrome Israëlieten, of kinderen Gods."},{"catchword":"juichen","tekst":"Of, overluid roepen."},{"catchword":"zij","tekst":"Te weten wien tevoren zulke schaamte is aangedaan geweest en die vervolg zijn geworden."},{"catchword":"in hun land","tekst":"Te weten zo hun eigen als verkregen van de vijanden, van wie zij tevoren zijn vervolgd geweest."},{"catchword":"zij zullen eeuwige","tekst":"Te weten de godzaligen."}],"8":[{"catchword":"den roof","tekst":"Dat is, die brandoffers haat Ik, die door ongerechtigheid geschieden, mij uiterlijk dienende, maar middelerwijl hunne naaste onderdrukkende; zie Pro 15:8 , en Pro 21:27 ."},{"catchword":"hun werk","tekst":"Dat is, dat de dienst, dien zij mij ter ere doen, in den geest en in der waarheid zal geschieden; Joh 4:24 . Anders: hun arbeidsloon."},{"catchword":"met hen maken","tekst":"Zie Jer 34:18 ."}],"9":[{"catchword":"En hun zaad","tekst":"Dat is, hunne nakomelingen, of die hun toebehoren, te weten die tot de kerk van Christus behoren, die zullen niet meer bij een zekere natie bepaald wezen, maar zij zullen zich uitbreiden onder alle heidenen."},{"catchword":"hun nakomelingen","tekst":"Hebreeuws, hunne uitspruitelingen."},{"catchword":"zullen hen kennen,","tekst":"Zo aan hun heiligen en Godzaligen handel en wandel, als uit den zegen des Heeren, die merkelijk bij hen zal zijn."}],"10":[{"catchword":"Ik ben zeer vrolijk","tekst":"Dit spreekt de Christelijke kerk en een ieder lidmaat derzelve, den Heere dankende voor zijne weldaden aan hen bewezen. Hebreeuws, vrolijk zijnde, ben ik vrolijk."},{"catchword":"den mantel","tekst":"Of, Hij heeft mij bedekt met den mantel der gerechtigheid; dat is, met gerechtigheid als met een kleed, welverstaande met zijne gerechtigheid, die Hij mij toegeëigend heeft."},{"catchword":"priesterlijk","tekst": he opening of the prison. [This is that which was said immediately before in other words.]"}],"2":[{"catchword":null,"tekst":"To proclaim the year of the LORDS pleasure, [That is, the time, or the year, wherein it shall please the Lord to manifest and declare his grace and mercy unto troubled and grieved consciences, to wit, by the preaching of the Gospel. See above chap.49.8.2. Cor.6.2. Tit.3.4.] and the day of vengeance of our God: [that is, that day which God hath ordained or appointed, wherein he will cast all infidels, impenitent, and enemies to his Church, together with the Devil into eternal damnation. See above chap.34.8. and 63.4. Luk 18:7. and 2 Cor.10.6.] to comfort all sorrowly ones. [to wit, those that mourn and grieve for their sins whereby they have provoked God to anger, 2 Cor.7.10,11. Jam.4.9. or those that grieve for the miseries of the Church, below chapter 66.10. for unto such Christ Promiseth comfort, Mat 5:4.]"}],"3":[{"catchword":null,"tekst":"To appoint unto the mourners of Zion, [That is, of the Church of God] that unto them may be given ornament; [that is, beautiful garments, or glory which word is used, Mat 6:29. for goodly apparel. Heb. To give them ornament, etc.] for ashes, [which they were wont to strew upon their heads, and to sit in them when they mourned] the oil of joy, [they were wont in ancient times to anoint their faces with oil in time of joy. But here is spoken of the joyful oil of the Holy Ghost; Joh. 14. Vers, 26, 27 and 15.11. compare with the words of the prophet, that which is written Heb 1:9.] for mourning the garment of praise [that is, a garment that is worthy of praise by reason of its beauty and comeliness. Or, a garment that was worn on a stival day, when congregation met together to praise God for mercies received. But understand here by the beautiful garments, the gifts and graces of Gods Spirit] for a troubled spirit: [that is, mind or, distressed Spirit. Heb. Spirit wrung together which is as it were contracted // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,

const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);

    }).join('');
}
function bijbeluitlegHtml(n) {

function paneelInhoud(n, tab) {

        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +

  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
