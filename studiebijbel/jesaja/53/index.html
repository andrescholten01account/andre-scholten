:"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Wie heeft onze prediking geloofd, en aan wie is de arm van de HEERE geopenbaard?","2":"Want Hij is als een jonge loot[1] voor Zijn aangezicht[2] opgeschoten, en als een wortel uit een dorre aarde; Hij had geen gedaante en geen heerlijkheid; als wij Hem aanzagen, was er geen gestalte dat wij Hem begeerd zouden hebben.","3":"Hij was veracht, en de onwaardigste onder de mensen, een Man van smarten, en vertrouwd met ziekte[3]; en ieder verborg als het ware het gezicht voor Hem; Hij was veracht, en wij hebben Hem niet geacht.","4":"Waarlijk, Hij heeft onze ziekten op Zich genomen, en onze smarten heeft Hij gedragen; maar wij hielden Hem voor een geplaagde, door God geslagen en verdrukt.","5":"Maar Hij is om onze overtredingen verwond, om onze ongerechtigheden is Hij verbrijzeld; de straf die ons de vrede aanbrengt, was op Hem, en door Zijn striemen is er voor ons genezing gekomen.","6":"Wij dwaalden allen als schapen, wij keerden ons ieder naar zijn eigen weg; maar de HEERE heeft de ongerechtigheid van ons allen op Hem doen neerkomen.","7":"Toen die geëist werd[4], werd Hij verdrukt; maar Hij deed Zijn mond niet open; als een lam werd Hij ter slachting geleid, en zoals een schaap stom is voor het aangezicht van zijn scheerders, zo deed Hij Zijn mond niet open.","8":"Hij is uit de angst en uit het gericht weggenomen; en wie zal Zijn leeftijd uitspreken?[5] Want Hij is afgesneden uit het land van de levenden; om de overtreding van Mijn volk is de plaag op Hem geweest.","9":"En men heeft Zijn graf bij de goddelozen gesteld, en Hij is bij de rijke in Zijn dood geweest, omdat Hij geen onrecht gedaan heeft, en er geen bedrog in Zijn mond geweest is.","10":"Maar het behaagde de HEERE Hem te verbrijzelen; Hij heeft Hem ziek gemaakt. Als Zijn ziel Zich tot een schuldoffer gesteld zal hebben, zal Hij nageslacht[6] zien, Hij zal de dagen verlengen; en het welbehagen van de HEERE zal door Zijn hand voorspoedig voortgaan.","11":"Om de arbeid van Zijn ziel zal Hij het zien en verzadigd worden; door Zijn kennis zal Mijn Knecht, de Rechtvaardige, velen rechtvaardig maken, want Hij zal hun ongerechtigheden dragen.","12":"Daarom zal Ik Hem een deel geven onder velen, en Hij zal de machtigen als buit verdelen, omdat Hij Zijn ziel uitgestort heeft in de dood, en onder de overtreders geteld is geweest, en Hij de zonden van velen gedragen heeft, en voor de overtreders gebeden heeft."},"SV":{"1":"Wie heeft onze prediking geloofd, en aan wien is de arm des HEEREN geopenbaard?","2":"Want Hij is als een rijsje voor Zijn aangezicht opgeschoten, en als een wortel uit een dorre aarde; Hij had geen gedaante noch heerlijkheid; als wij Hem aanzagen, zo was er geen gestalte, dat wij Hem zouden begeerd hebben.","3":"Hij was veracht, en de onwaardigste onder de mensen, een Man van smarten, en verzocht in krankheid; en *een* *iegelijk* was als verbergende het aangezicht voor Hem; Hij was veracht, en wij hebben Hem niet geacht.","4":"Waarlijk, Hij heeft onze krankheden op Zich genomen, en onze smarten heeft Hij gedragen; doch wij achtten Hem, dat Hij geplaagd, van God geslagen en verdrukt was.","5":"Maar Hij is om onze overtredingen verwond, om onze ongerechtigheden is Hij verbrijzeld; de straf, die ons den vrede aanbrengt, was op Hem, en door Zijn striemen is ons genezing geworden.","6":"Wij dwaalden allen als schapen, wij keerden ons een iegelijk naar zijn weg; doch de HEERE heeft onzer aller ongerechtigheid op Hem doen aanlopen.","7":"*Als* dezelve geëist werd, toen werd Hij verdrukt; doch Hij deed Zijn mond niet open; als een lam werd Hij ter slachting geleid, en als een schaap, dat stom is voor het aangezicht zijner scheerders, alzo deed Hij Zijn mond niet open.","8":"Hij is uit den angst en uit het gericht weggenomen; en wie zal Zijn leeftijd uitspreken? Want Hij is afgesneden uit het land der levenden; om de overtreding Mijns volks is de plage op Hem geweest.","9":"En men heeft Zijn graf bij de goddelozen gesteld, en Hij is bij den rijke in Zijn dood geweest, omdat Hij geen onrecht gedaan heeft, noch bedrog in Zijn mond geweest is.","10":"Doch het behaagde den HEERE Hem te verbrijzelen; Hij heeft *Hem* krank gemaakt; als Zijn ziel Zich *tot* een schuldoffer gesteld zal hebben, zo zal Hij zaad zien, Hij zal de dagen verlengen; en het welbehagen des HEEREN zal door Zijn hand gelukkiglijk voortgaan.","11":"Om den arbeid Zijner ziel zal Hij het zien, *en* verzadigd worden; door Zijn kennis zal Mijn Knecht, de Rechtvaardige, velen rechtvaardig maken, want Hij zal hun ongerechtigheden dragen.","12":"Daarom zal Ik Hem een deel geven van velen, en Hij zal de machtigen als een roof delen, omdat Hij Zijn ziel uitgestort heeft in den dood, en met de overtreders is geteld geweest, en Hij veler zonden gedragen heeft, en voor de overtreders gebeden heeft."},"KJV":{"1":"Who hath believed our report? and to whom is the arm of the LORD revealed?","2":"For he shall grow up before him as a tender plant, and as a root out of a dry ground: he hath no form nor comeliness; and when we shall see him, *there is* no beauty that we should desire","3":"He is despised and rejected of men; a man of sorrows, and acquainted with grief: and we hid as it were *our* faces from him; he was despised, and we esteemed","4":"Surely he hath borne our griefs, and carried our sorrows: yet we did esteem him stricken, smitten of God, and afflicted.","5":"But he *was* wounded for our transgressions, *he was* bruised for our iniquities: the chastisement of our peace *was* upon him; and with his stripes we are healed.","6":"All we like sheep have gone astray; we have turned every one to his own way; and the LORD hath laid on him the iniquity","7":"He was oppressed, and he was afflicted, yet he opened not his mouth: he is brought as a lamb to the slaughter, and as a sheep before her shearers is dumb, so he openeth not his mouth.","8":"He was taken from prison and from judgment: and who shall declare his generation? for he was cut off out of the land of the living: for the transgression of my people was he stricken.","9":"And he made his grave with the wicked, and with the rich in his death; because he had done no violence, neither *was any* deceit in his mouth.","10":"Yet it pleased the LORD to bruise him; he hath put *him* to grief: when thou shalt make his soul an offering for sin, he shall see *his* seed, he shall prolong *his* days, and the pleasure of the LORD shall prosper in his hand.","11":"He shall see of the travail of his soul, *and* shall be satisfied: by his knowledge shall my righteous servant justify many; for he shall bear their iniquities.","12":"Therefore will I divide him *a portion* with the great, and he shall divide the spoil with the strong; because he hath poured out his soul unto death: and he was numbered with the transgressors; and he bare the sin of many, and made intercession for the transgressors."}},"tsk":{"1":[{"kopje":"Wie","refs":["Joh 1:7","Joh 1:12","Joh 12:38","Rom 10:16","Rom 10:17"]},{"kopje":"de","refs":["Jes 51:9","Jes 52:10","Jes 62:8","Rom 1:16","1 Kor 1:18","1 Kor 1:24","Ef 1:18","Ef 1:19"]},{"kopje":"geopenbaard","refs":["Jes 40:5","Matt 11:25","Matt 16:17","Rom 1:17","Rom 1:18"]}],"2":[{"kopje":"opgeschoten","refs":["Jes 11:1","Jer 23:5","Ezech 17:22-24","Zach 6:12","Mark 6:3","Luk 2:7","Luk 2:39","Luk 2:40","Luk 2:51","Luk 2:52","Luk 9:58","Rom 8:3","Fil 2:6","Fil 2:7"]},{"kopje":"Hij had geen","refs":["Jes 52:14","Mark 9:12","Joh 1:10-14","Joh 9:28","Joh 9:29","Joh 18:40","Joh 19:5","Joh 19:14","Joh 19:15","1 Petr 2:14"]}],"3":[{"kopje":"veracht","refs":["Jes 49:7","Jes 50:6","Ps 22:7-9" \"wl wl-kjv\" data-code=\"H748\">prolong</span> his <span class=\"wl wl-kjv\" data-code=\"H3117\">days,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2656\">pleasure</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H6743\">prosper</span> in his hand.","11":"He shall <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> of the <span class=\"wl wl-kjv\" data-code=\"H5999\">travail</span> of his <span class=\"wl wl-kjv\" data-code=\"H5315\">soul,</span> and shall be <span class=\"wl wl-kjv\" data-code=\"H7646\">satisfied:</span> by his <span class=\"wl wl-kjv\" data-code=\"H1847\">knowledge</span> shall my <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous</span> <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H6663\">justify</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">many;</span> for he shall <span class=\"wl wl-kjv\" data-code=\"H5445\">bear</span> their iniquities.","12":"Therefore will I <span class=\"wl wl-kjv\" data-code=\"H2505\">divide</span> him a portion with the <span class=\"wl wl-kjv\" data-code=\"H7227\">great,</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H2505\">divide</span> the <span class=\"wl wl-kjv\" data-code=\"H7998\">spoil</span> with the <span class=\"wl wl-kjv\" data-code=\"H6099\">strong;</span> because he hath poured <span class=\"wl wl-kjv\" data-code=\"H6168\">out</span> his <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> unto <span class=\"wl wl-kjv\" data-code=\"H4194\">death:</span> and he was <span class=\"wl wl-kjv\" data-code=\"H4487\">numbered</span> with the <span class=\"wl wl-kjv\" data-code=\"H6586\">transgressors;</span> and he <span class=\"wl wl-kjv\" data-code=\"H5375\">bare</span> the <span class=\"wl wl-kjv\" data-code=\"H2399\">sin</span> of <span class=\"wl wl-kjv\" data-code=\"H7227\">many,</span> and made <span class=\"wl wl-kjv\" data-code=\"H6293\">intercession</span> for the transgressors."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"heeft","tekst":"Te weten onder de Joden. Het is zoveel alsof de profeet zeide: Daar zijn er zeer weinig, schier niemand. In de plaatsen Joh 12:38 ; Rom 10:16 , wordt het woord o Heere, in het begin bijgevoegd, om te tonen dat het is ene klacht tot God."},{"catchword":"onze prediking","tekst":"Hebreeuws, ons gehoor; dat is, onze predikatiën, gelijk Rom 10:16 . Het zijn de woorden der leraars van het Nieuwe Testament, te weten van Christus en zijne apostelen, gelijk af te nemen is uit de woorden van Christus, Joh 12:37-38 ."},{"catchword":"aan wien","tekst":"Dat is, hoe weinig Joden zijn er in wier harten de Heilige Geest door de predikatie van het heilige Evangelie krachtiglijk werkt, alzo namelijk dat hij hen begaaft met het ware geloof aan Jezus Christus."}],"2":[{"catchword":"Want Hij is","tekst":"Alsof hij zeide: Uit de nederigheid en uit den verachtzamen staat, in welken Christus verschenen is, nemen zij gelegenheid om Christus te verachten; want de Joden hadden zichzelven ingebeeld enen Messias, die in koninklijke pracht verschijnen zou; maar deze Christus komt slecht en gering, als een spruitje of rijsken. Zie Isa 4:2 , en Isa 11:1 ."},{"catchword":"voor Zijn aangezicht","tekst":"Te weten voor het aangezicht van God zijn Vader. Sommigen verstaan het, voor het aangezicht van het ongelovige Joodse volk, hetwelk niet dacht dat dit rijsken metterdaad tot een hogen boom opwassen zou."},{"catchword":"opgeschoten,","tekst":"Te weten naar zijn menselijke natuur."},{"catchword":"als een wortel","tekst":"Dit kan men duiden op den nederen verachten staat van het huis Davids, als Christus daaruit voortkwam, of op de kleine beginselen van zijn koninkrijk, ten aanzien van welke men niet zou geloofd hebben dat hij tot een groten vruchtbaren boom zou opwassen, maar veel meer dat hij tenonder blijven zou; gelijk het zaad, hetwelk in een dor, droog land geworpen wordt, verdroogt bij gebrek aan vochtigheid, of gelijk de wortel van een boom, die in dorre aarde geplant is, niet kan opschieten, de boom afgehouwen zijnde."},{"catchword":"uit een dorre aarde;","tekst":"Hebreeuws, uit een land der droogte."},{"catchword":"Hij had geen gedaante","tekst":"Vanwege zijn nederigen staat en de wonden en striemen, het bloed en zweetdruppels, alsook andere menigvuldige ellenden, die zijn gelaat hebben mismaakt."},{"catchword":"wij Hem aanzagen,","tekst":"Te weten wij Joden."},{"catchword":"gestalte,","tekst":"Of, aanzien."},{"catchword":"dat wij Hem zouden begeerd hebben","tekst":"Te weten naar de ogen des vleesches en des menselijken vernufts."}],"3":[{"catchword":"Hij was veracht,","tekst":"Of, hij was verachtzaam en verworpen van de mannen; te weten van zulke mannen, die in hoogheid en waardigheid verheven waren."},{"catchword":"de onwaardigste","tekst":"Zo onwaardig, dat Hij van de mensen doorgaans verworpen werd."},{"catchword":"een Man van smarten,","tekst":"Dat is, een man vol smarten."},{"catchword":"verzocht in krankheid;","tekst":"Hebreeuws, een bekende der krankheid; dat is, die wel verzocht had wat krankheid is, Heb 4:15 . Of die vermaard was door zijne ellende en zwarigheid, zijnde gans mat en zwak geworden vanwege de pijnigingen Hem aangedaan. Het Hebreeuwse woord, dat hier krankheid is overgezet, betekent ook in het algemeen smart of ellende, gelijk Ecc 6:2 ; Jer 10:19 ; en alzo kan het doorgaans in dit hfdst. genomen worden."},{"catchword":"als verbergende","tekst":"Anders: en als het aangezicht voor ons verbergende."},{"catchword":"Hij was veracht,","tekst":"De zin is, vanwege zijn ellendigen en verachtzamen staat, heeft men Hem niet alleen zijn behoorlijke eer niet gegeven, maar men heeft Hem geheel veracht."},{"catchword":"wij hebben Hem niet geacht","tekst":"Wij Joden, wij hebben Hem bespot, of niet gerekend. Zie Mat 27:39 , enz."}],"4":[{"catchword":"Waarlijk,","tekst":"Of, nochtans, alsof hij zeide: Maar, om de waarheid te zeggen, wij hebben Hem ongelijk gedaan, en wij steken in groot misverstand; want aldus is de Messias onzenthalve gesteld: Hij heeft al onze geestelijke ziekten, dat is zonden, op zich genomen, om voor dezelve te betalen, waarvan de lichamelijke gezondmaking ene afbeelding was; Mat 8:17 ."},{"catchword":"op Zich genomen,","tekst":"Als borg betalende de schuld, die wij gemaakt hadden."},{"catchword":"gedragen;","tekst":"Of, op zich geladen en als een zwaren last gedragen."},{"catchword":"wij achtten Hem,","tekst":"Te weten wij Joden, stekende in groot misverstand en oordelende naar ons verkeerd oordeel, zo menen wij dat Hij dit alles leed omdat Hij het met zijn eigen zonden en overtredingen verdiend had; maar het is daarmede veel anders gelegen, gelijk vs.5 gezegd wordt. Hebreeuws, wij achtten Hem een geplaagde, geslagene Gods en verdrukte."},{"catchword":"geslagen en verdrukt was","tekst":"Of, geraakt was; zie Job 19:21 ."}],"5":[{"catchword":"de straf,","tekst":"Hebreeuws, de straf van onzen vrede; dat is, hij werd gestraft opdat wij door Hem volkomen vrede krijgen zouden bij God, die met ons ontevreden was vanwege onze zonden. Versta hierbij: en de kastijding is op Hem blijven liggen totdat Hij volkomenlijk voor ons betaald had."},{"catchword":"is ons genezing geworden","tekst":"Zodat wij van zonde en straf bevrijd zijn."}],"6":[{"catchword":"Wij dwaalden","tekst":"Dat is, wij zijn allen afgedwaald van den weg, dien ons God in zijne wet heeft voorgeschreven om daarin te wandelen."},{"catchword":"naar zijn weg;","tekst":"Niet naar den weg, dien de HEERE ons had voorgeschreven; maar wandelende op den weg, dien zich een ieder verkoren had; zie 1Pe 2:25 ."},{"catchword":"op Hem doen aanlopen","tekst":"Of, Hem doen ontmoeten; of Hij, te weten de Vader, dreef op Hem, te weten Christus, ons aller ongerechtigheid, dewijl Hij zich in onze plaats vrijwillig tot borg gesteld had."}],"7":[{"catchword":"dezelve","tekst":"Te weten onze ongerechtigheid, dat is de straf onzer ongerechtigheid, van Christus geëist werd."},{"catchword":"Hij deed Zijn mond","tekst":"Met zijn stilzwijgen betuigende dat hij gewilliglijk alles voor ons geleden heeft, zijnen mond niet openende om de valse aanklachten zijner vijanden te wederleggen; ook niet sprekende tot nadeel dergenen, die Hem doodden, maar wel tot voordeel van ons; en biddende voor degenen, die Hem kruisigden; Luk 23:34 ."},{"catchword":"schaap,","tekst":"Eigenlijk, een ooilam, of zijlam; een lam bijt en stoot dengene niet, die het kelen zal, maar het volgt zachtjes zijnen slachter, die het ter slachtbank leidt."}],"8":[{"catchword":"uit den angst","tekst":"Of uit den kerker, of uit dit geweldig benauwen. Hebreeuws, uit de besluiting; te weten uit de helse benauwdheid, die Christus in den hof Gethsemane, [waar Hij bloed gezweet heeft] doch inzonderheid aan het kruis gevoeld heeft, toen Hij riep: Mijn God, mijn God, waarom hebt Gij mij verlaten? Versta dit ook van zijne opwekking uit de doden, en als Hij tot zijn hemelsen Vader ten hemel is opgevaren."},{"catchword":"uit het gericht","tekst":"Te weten uit het gericht van God, dat is, uit de verdoemenis, die Hij een tijdlang voor ons geleden heeft, zijnde voor ons een vloek geworden; Gal 3:13 . Doch enigen verstaan hier door het gericht den dood des kruises, waartoe Hij van de Joden en Pilatus veroordeeld was, in dezen zin: Ofschoon de Messias tot een schandelijken, ja vervloekten dood verwezen wordt, zo zal Hij nochtans, wil de profeet zeggen, eindelijk ten hemel opgenomen worden, nadat Hij voor onze zonden zal genoeg gedaan hebben."},{"catchword":"Zijn leeftijd","tekst":"Of, de gedurigheid van zijn leven, of zijne eeuw. Versta hier, behalve de eeuwigheid van zijn goddelijk wezen, ook de eeuwigdurendheid van zijn rijk, dewijl God, Hem opgewekt en aan zijne rechterhand gesteld hebbende in de hemelse plaatsen, zo leeft en regeert Hij in eeuwigheid, en de dood heeft geen geweld meer over Hem; Luk 1:33 ; Rom 6:9 . Of, zijne generatie, dat is zijne kinderen, die geestelijk uit Hem zullen geboren worden."},{"catchword":"afgesneden","tekst":"Dat is, Hij is door een geweldigen dood weggerukt, gelijk men een boom met geweld afhouwt."},{"catchword":"uit het land der levenden;","tekst":"Dat is, dergenen, die in de wereld leven. Zie de aantekening Job 28:13 ; Psa 27:13 ; Isa 38:11 . De zin is: Hij is gedood en in het graf gelegd."},{"catchword":"om de overtreding","tekst":"Dat is, vanwege de zonden, zo der Joden als der heidenen, is Hij aldus geslagen en gemarteld, welke anderszins met recht de straf had moeten treffen."},{"catchword":"Mijns volks","tekst":"Dit zijn woorden van den profeet."},{"catchword":"is de plage","tekst":"Hebreeuws, [was] Hem de plaag; te weten die straf, dat Hij aan het kruis is genageld geworden; alzo wordt het Hebreeuwse bijvoegsel mo ook in het enkelvoudig getal genomen. Gen 9:26-27 ; Job 20:23 , en Job 22:2 ; Psa 11:7 ; Isa 44:15 ."}],"9":[{"catchword":"men heeft","tekst":"Of, hetwelk wel zijn graf, enz., hetwelk, te weten volk van Jeruzalem."},{"catchword":"graf","tekst":"Of, begrafenis."},{"catchword":"bij de goddelozen","tekst":"Of, met."},{"catchword":"gesteld,","tekst":"Of verordineerd; dat is, men heeft zijn graf met goddelozen besteld, die het bewaken en bewaren zouden. Zie Mat 27:63-66 . Anderen nemen het in dezen zin: De boze Joden meenden wel dat men het lichaam van Christus bij, of met moordenaarslichamen zou wegdoen, om zulke en andere oorzaken als zodanige dood van Pilatus vorderende; maar de voorzienigheid Gods had dit anders geordineerd, want Christus is begraven geworden in het graf van Jozes van Arimathea, een eerlijk en rijk raadsheer; Mat 27:60 ."},{"catchword":"in Zijn dood geweest,","tekst":"Hebreeuws, in zijne doden; in het getal van velen, dat is, na zijn geweldzamen dood. Vergelijk Eze 28:10 , met de aantekening. Of, doden, omdat Christus niet een, maar als vele doden voor ons geleden heeft."},{"catchword":"geen onrecht gedaan heeft,","tekst":"Of, geen geweld, maar integendeel, oprecht, rechtvaardig en eenvoudig gehandeld en gewandeld heeft, zo in woorden als in werken."}],"10":[{"catchword":"Hem","tekst":"Te weten Jezus Christus onzen Verlosser."},{"catchword":"te verbrijzelen;","tekst":"Te weten vanwege onze zonden, die op Hem lagen en in Hem moesten gestraft worden."},{"catchword":"krank","tekst":"Dat is, Hij heeft Hem velerlei grote smarten aangedaan en als velerlei krankheden opgelegd. Zie boven vs.3."},{"catchword":"als Zijn ziel","tekst":"De zin is: Als Christus zijne ziel [dat is, zijn persoon] tot een schuldoffer ter dood overgegeven zal hebben [2Co 5:21] , zo zal Hij zijn zaad zien vermenigvuldigen, dat is, Hij zal zien dat de gelovigen door de predikatie van het heilige Evangelie grotelijks zullen aanwassen, namelijk alsdan inzonderheid, nadat Hij ten hemel opgevaren zijnde, den Heiligen Geest op zijne apostelen en andere leraars van het heilige Evangelie zal gezonden hebben. Anders: wanneer Gij zijne ziel tot een schuldoffer zult gesteld hebben, zo zal Hij zaad zien; dat is een groot getal gelovige kinderen, geboren uit het onvergankelijke zaad van het Woord van God; Psa 110:3 , en 1Pe 1:23 ."},{"catchword":"Hij zal de dagen verlengen;","tekst":"Alsof hij zeide: De vrucht, die de Heere Christus uit het voorverhaalde scheppen zal, zal niet kort noch haast voorbijgaande zijn, maar zij zal eeuwiglijk duren; zie Psa 23:6 ."},{"catchword":"het welbehagen","tekst":"Te weten het werk onzer verlossing en het vergaderen der uitverkorenen uit alle volken door de predikatie van het heilige Evangelie, hetwelk alsdan voornamelijk is aangegaan, nadat Christus ten hemel was opgevaren; Mat 28:19 ."},{"catchword":"door Zijn hand","tekst":"Dat is, door zijn dienst, of door zijne macht. Zie Eph 4:11-12 , enz."}],"11":[{"catchword":"Hij het zien,","tekst":"Of, hij [het] te weten zaad, zien. De zin is: Christus zal zaad, dat is, kinderen, te weten geestelijke kinderen zien, dat is verkrijgen, en met lust en vreugde aanschouwen om zijn arbeid en moeite; versta daardoor die pijnen en smarten, die Hij aan de ziel en aan het lichaam gevoeld heeft toen de zware toorn Gods vanwege de zonden van het menselijke geslacht op Hem lag. Anders: van den arbeid zijner ziel zal Hij [vrucht, of zijn lust] zien; zie Psa 22:18 ."},{"catchword":"verzadigd worden;","tekst":"Dat is, hij zal zijn arbeid ten hoogste en tot zijn genoegen volkomenlijk genieten; want het is billijk dat een getrouw arbeider geniet de vruchten van zijn arbeid. Dit zal alsdan geschieden in zijn eigen persoon, als Christus in de heerlijkheid van zijn Vader zal opgenomen en aan de rechterhand van zijn Vader zal verhoogd worden. Het zal ook zijnen ledematen wedervaren als hij hun zijne heerlijkheid zal deelachtig maken."},{"catchword":"Zijn kennis","tekst":"Versta, die kennis, door welke Hij zou bekend en aangenomen worden als Heiland en Middelaar tussen God en de mensen."},{"catchword":"Mijn Knecht,","tekst":"Dit spreekt God de Vader. Vergelijk dit met Isa 42:1 , en Isa 52:13 ."},{"catchword":"de Rechtvaardige,","tekst":"Te weten Hij rechtvaardig lijdende voor de onrechtvaardigen; 1Pe 3:18 ."},{"catchword":"velen","tekst":"Te weten die altegaar, die in Hem geloven. Zie Rom 5:19 ."},{"catchword":"rechtvaardig maken,","tekst":"Hun teweegbrengende de vergeving der zonden en de gerechtigheid, die voor God bestaat."},{"catchword":"dragen","tekst":"Te weten op het hout des kruises, 1Pe 2:24 ; als zijnde het Lam Gods, hetwelk de zonden der wereld draagt; Joh 1:29 ."}],"12":[{"catchword":"Daarom","tekst":"Alsof God de Vader zeide: Dewijl Hij voor de mensen zoveel gedaan en geleden heeft, [gelijk boven verhaald is]; zo zal Ik Hem van vele [dat is veel ] mededelen; dat is, Ik zal hem veel geestelijke kinderen en gaven geven. Anders: daarom zal Ik Hem een deel geven onder de groten, alzo dat Hij met de groten en machtigen zal mogen vergeleken worden. Anders: daarom zal Ik Hem de geweldigen ten deel geven; namelijk de boze geesten; zie Col 2:15 ."},{"catchword":"Hij zal de machtigen","tekst":"Te weten den dood, de zonde, den duivel en de hel, die tevoren de overhand over de mensen hadden, zal Hij als een roof delen, dat is overwinnen en zijne uitverkorenen uit hunne hand verlossen. Anderen nemen het van de heerschappij van Christus over de machtigen dezer wereld, die zich zullen bekeren en Hem dienen; vergelijk boven, Isa 52:15 ."},{"catchword":"omdat Hij Zijn ziel","tekst":"Dat is, omdat Hijz ich vrijwillig heeft laten vangen, martelen en doden."},{"catchword":"met de overtreders","tekst":"Alzo, dat Hij niet alleen tussen twee moordenaars is gekruisigd geworden, maar Barrabas, die vanwege een moord en oproer gevangen zat, is waardiger gehouden dan Jezus Christus, de Zoon van God."},{"catchword":"en Hij veler zonden","tekst":"Zie boven vs.11."},{"catchword":"voor de overtreders","tekst":"Zeggende: Vader, vergeef het hun, want zij weten niet wat zij doen; Luk 23:34 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Who [To wit, among the Jews. It is as much as if the Prophet had said, there are very few, almost none at all. In these phrases, Joh.12.38. Rom 10:16. is the word, O LORD added in the beginning, to shew that it is a complaint unto God] hath believed our preaching? [Heb. Our hearing; that is, our sermons, as Rom 10:16. They are the words of the Teachers of the New Testament; to wit, of Christ and his Apostles, as may be gathered from the words of Christ, Joh.12.37,38.] and to whom is the arm of the LORD revealed? [that is, how few Jews are there in whose hearts the holy ghost worketh effectually by the preaching of the Gospel, namely, so as o endue them with true faith in Jesus Christ.]"}],"2":[{"catchword":null,"tekst":"For he is grown up as a young branch before his face, and as a root out of the ground: [As if he had said, from the lowness, and from the base and contemptible estate wherein Christ came into the world, they take occasion to contemn and despise him. For the Jews did fancy to themselves such a Messiahs as should come and appear in royal pomp: but this Christ cometh mean and lowly, as a young sprig or tender branch. See above chap.4.2. and 11.1. (he is grown up) to wit, according to his humane nature. (before his face) to wit, before the face of God his father. Some understand it, before the face of this unbelieving people of the Jews, who never thought that this young branch or twig would grow up in time to be a great and tall tree (and as a root out of a dry ground:) Heb. Out of a land, or ground of drought, or dryness. This may be applied to the low and contemptible estate of the house of David, when Christ issued or sprung from thence; or to the small beginnings of his kingdom, in respect whereof it could not be believed that he should ever grow up to be a great and fruitful tree; but either that he should be kept under, as seed that is cast into a dry barren ground withereth for lack of moisture: Or, as the root of a tree that is planted in a dry ground, cannot grow up, the tree being cut down] he had no form nor beauty: [Because of his low estate, the wounds and sore swellings, the blood and sweat-drops, as also divers other miseries that disfigured his countenance] when we [to wit, we Jews] looked upon him, there was no form [Or, beautiful countenance] that we should have desired him. [to wit, according to carnal eyes, and humane judgement or understand.]"}],"3":[{"catchword":null,"tekst":"He was despised, and the unworthiest among men, [So unworthy, that he was continually rejected of men. Or, he was contemptible, and rejected of men; to wit, of such men as were advanced to honour and dignity. Compare Psal.22.7,8. Above chap.49.7. and 52.14. Mark 9.12.] a man of sorrows, [Or, a man full of sorrows] that hath experience of sickness in sickness [Heb. Or a known one of sickness; that is, that hath had experience what sickness is Heb 4:15. Or, who was famous by his misery and grief, being grown quite faint and weak by reason of the torments inflicted upon him. The Hebrew word that is here rendered sickness signifieth also generally sorrow, or misery, as Ecc 6:2. Jer 10:19. and so it may be taken throughout this chapter] and (every one) as it were hiding then his face from him; [Others, and as it were hiding the face from us] he was despised, and we esteemed him not. [We Jews, we mocked and derided him, or set him at nought. See Mat 27:39, &c. The meaning is, By reason of his miserable and contemptible estate, he was not onely denied his due honour, but also utterly vilified and despised.]"}],"4":[{"catchword":null,"tekst":"Verily he hath taken our sicknesses upon him, [Paying as our surety the debt that we had made, or had run into. (Verily, &c.) Or, yet; as if he had said, But to speak the truth, we have done him wrong, and we are in a great error: For thus standeth the case with the Messiahs for our sakes, he hath taken all our spiritual maladies, that is all our sins, upon him, to make satisfaction for them, whereof the bodily cure or healing was type and figure, Mat 8:17.] and our sorrows them hath he carried: [or, laden them upon him, and carried them as a heavy burden] yet we esteemed that he was plagued, smitten [or was touched. See Job 19.on ver.21.] of God and humbled. [That is, we Jews being in a great error, or being greatly mistaken, and judging according to our corrupt and perverse judgement, we thought that he suffered all this, because he had deserved it by his own sins and transgressions: But it is quite otherwise, as appeareth ver.5. Heb. We esteemed him a plagued one, a smitten one of God, and an afflicted one.]"}],"5":[{"catchword":null,"tekst":"But he was wounded for our transgressions, he was bruised for our iniquities: [Compare Rom 4:25. and 1 Cor.15.3.] the punishment that bringeth peace unto us, was upon him, [Heb. The punishment of our peace, &c. That is, he was punished, that we by him might obtain perfect peace of God, who was at enmity with us because of our sins. Understand withal, and the chastisement continued still upon him, until he had fully satisfied for us] and by his stripes healing is made unto us. [So that we are freed from sin and punishment. See 1 Pet.2.24.]"}],"6":[{"catchword":null,"tekst":"All we like sheep went astray [That is, all we have as it were gone astray from the way which God did prescribe us in his law, that we should walk in it] we turned everyone to his (own) way; [Not to the way which the LORD had prescribed us, but walking in the way which everyone had chosen for himself. See 1 Pet.2.25.] but the LORD hath caused the iniquity of us all to run upon him. [Or, to meet him, or, he (to wit, the Father) drave upon him (to wit, Christ) the iniquity of us all; because that he freely and willingly became a surety for us.]"}],"7":[{"catchword":null,"tekst":"(When) the same was required, [To wit, our iniquity; that is, the punishment of our iniquity was required of Christ] then he was afflicted: yet he opened not his mouth: [Testifying by his silence, that he endured all things willingly for our sakes, not opening his mouth to confute the slandering&acirc;&euro;&trade;s and false accusations of his enemies: Also not uttering any thing to the prejudice of them that put him to death, but to our benefit and profit: and praying for them that crucified him, Luk.23.34. See Mat 26:63. and 27.12, 14. Mark 14.61. and 15.5.] he was led as lamb to the slaughter, and as a sheep [Properly an ew-lamb, or she-lamb] that is dumb before the face of her shearers, [A lamb doth not bite nor push him that is going about to kill it, but followeth gently his slayer that leadeth it to the slaughterhouse] so he opened not his mouth. [Compare Act.8.32.]"}],"8":[{"catchword":null,"tekst":"He is taken away out of the strait, [Or, out of the prison, or, of this violent distress. Heb. Out of the shutting up; to wit, from the pangs of hell, which Christ felt in the garden of Gethsemane (where he sweat blood) but especially on the cross, when he cried, my God, my G // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

function kopieerVers(n) {
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n})`).then(() => {

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;

    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
