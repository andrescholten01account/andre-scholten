l":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Zo zegt de HEERE tegen Zijn gezalfde, tegen Kores, wiens rechterhand Ik vastheb, om de volken voor zijn aangezicht neer te werpen; en Ik zal de lendenen van de koningen ontbinden, om voor zijn aangezicht de deuren te openen, en de poorten zullen niet gesloten worden:","2":"Ik zal voor uw aangezicht gaan, en Ik zal de kromme wegen recht maken; de koperen deuren zal Ik verbreken, en de ijzeren grendels zal Ik in stukken slaan.","3":"En Ik zal u de schatten geven die in de duisternissen zijn, en de verborgen rijkdommen; opdat u weet dat Ik de HEERE ben, Die *u* bij uw naam roept, de God van Israël;","4":"Om Jakobs, Mijn knechts wil, en Israëls, Mijn uitverkorenen; ja, Ik riep u bij uw naam, Ik noemde u toe, hoewel u Mij niet kende.","5":"Ik ben de HEERE, en niemand meer, buiten Mij is er geen God; Ik zal u gorden, hoewel u Mij niet kent.","6":"Opdat men weet, vanaf de opgang van de zon tot aan de ondergang, dat er buiten Mij niets is, Ik ben de HEERE, en niemand meer.","7":"Ik vorm het licht, en schep de duisternis; Ik maak de vrede en schep het kwaad, Ik, de HEERE, doe al deze dingen.","8":"Drupt, hemelen! van boven af, en laat de wolken vloeien van gerechtigheid; en laat de aarde zich openen, en laat allerlei heil uitwassen, en gerechtigheid samen uitspruiten; Ik, de HEERE, heb ze geschapen.","9":"Wee hem die met zijn Formeerder twist, zoals een potscherf met aarden potscherven! Zal ook het leem tegen zijn formeerder zeggen: Wat maakt u? of *zal* uw werk *zeggen*: Hij heeft geen handen?","10":"Wee hem die tegen zijn vader zegt: Wat verwekt u? en tegen de vrouw: Wat baart u?","11":"Zo zegt de HEERE, de Heilige van Israël, en zijn Formeerder: Zij hebben Mij naar toekomende dingen gevraagd; over Mijn kinderen, zou u Mij over het werk van Mijn handen bevel geven?","12":"Ik heb de aarde gemaakt, en Ik heb de mens daarop geschapen; Ik ben het! Mijn handen hebben de hemelen uitgebreid, en Ik heb heel hun leger bevel gegeven.","13":"Ik heb hem verwekt in gerechtigheid, en al zijn wegen zal Ik recht maken; hij zal Mijn stad bouwen, en hij zal Mijn gevangenen loslaten, niet voor prijs, en ook niet voor geschenk, zegt de HEERE van de heerscharen.[1]","14":"Zo zegt de HEERE: De arbeid van de Egyptenaren en de koophandel van de Moren en van de Sabeërs, mannen van grote lengte, zullen tot u overkomen, en zij zullen van u zijn, zij zullen u navolgen, in boeien zullen zij overkomen; en zij zullen zich voor u buigen, zij zullen u smeken, *en zeggen*: Zeker, God is in u, en er is verder geen God meer.","15":"Voorwaar, U bent een God, Die Zich verborgen houdt, de God van Israël, de Heiland.","16":"Zij zullen beschaamd worden en ook tot schande worden, zij allen; samen zullen zij met schande heengaan, zij die de afgoden maken.","17":"*Maar* Israël wordt verlost door de HEERE, *met* een eeuwige verlossing; u zult niet beschaamd worden, ook niet tot schande worden, tot in alle eeuwigheden.","18":"Want zo zegt de HEERE, Die de hemelen geschapen heeft, die God, Die de aarde gevormd heeft, en Die haar gemaakt heeft; Hij heeft haar bevestigd, Hij heeft haar niet geschapen opdat zij leeg zou zijn, *maar* heeft haar gevormd opdat men daarin zou wonen: Ik ben de HEERE, en niemand meer.","19":"Ik heb niet in het verborgene gesproken, op een donkere plaats van de aarde; Ik heb tegen het zaad van Jakob niet gezegd: Zoekt Mij tevergeefs; Ik ben de HEERE, Die gerechtigheid spreekt, Die rechtmatige dingen verkondigt.","20":"Verzamel u, en kom, treed hier samen toe, u die van de heidenvolken ontkomen bent! Zij weten niets, zij die hun houten gesneden beelden dragen, en een god aanbidden *die* niet verlossen kan.","21":"Verkondig het en treed hier toe, ja, beraadslaag samen: wie heeft dat van oudsher laten horen? *Wie* heeft dat van toen af verkondigd? Ben Ik het niet, de HEERE? En er is geen God meer behalve Mij, een rechtvaardig God, en een Heiland, niemand is er dan Ik.","22":"Wend u naar Mij toe, word behouden, alle einden van de aarde! Want Ik ben God, en niemand meer.","23":"Ik heb bij Mijzelf gezworen, er is een woord van gerechtigheid uit Mijn mond gegaan, en het zal niet terugkeren: dat voor Mij alle knie zich zal buigen, alle tong Mij zal zweren.","24":"Men zal van Mij zeggen: Zeker, in de HEERE zijn gerechtigheden en sterkte; tot Hem zal men komen; maar zij zullen allen beschaamd worden die tegen Hem in woede ontstoken zijn.","25":"*Maar* in de HEERE zullen gerechtvaardigd worden en zich beroemen, heel het zaad van Israël."},"SV":{"1":"Alzo zegt de HEERE tot Zijn gezalfde, tot Cores, wiens rechterhand Ik vat, om de volken voor zijn aangezicht neder te werpen; en Ik zal de lendenen der koningen ontbinden, om voor zijn aangezicht de deuren te openen, en de poorten zullen niet gesloten worden:","2":"Ik zal voor uw aangezicht gaan, en Ik zal de kromme wegen recht maken ; de koperen deuren zal Ik verbreken, en de ijzeren grendelen zal Ik in stukken slaan.","3":"En Ik zal u geven de schatten, die in de duisternissen zijn, en de verborgene rijkdommen; opdat gij moogt weten, dat Ik de HEERE ben, Die *u* bij uw naam roept, de God van Israël;","4":"Om Jakobs, Mijns knechts wil, en Israëls, Mijns uitverkorenen; ja, Ik riep u bij uw naam, Ik noemde u toe, hoewel gij Mij niet kendet.","5":"Ik ben de HEERE, en niemand meer, buiten Mij is er geen God; Ik zal u gorden, hoewel gij Mij niet kent.","6":"Opdat men wete, van den opgang der zon en van den ondergang, dat er buiten Mij niets is, Ik ben de HEERE, en niemand meer.","7":"Ik formeer het licht, en schep de duisternis; Ik maak den vrede en schep het kwaad, Ik, de HEERE, doe al deze dingen.","8":"Drupt, gij hemelen! van boven af, en dat de wolken vloeien van gerechtigheid; en de aarde opene zich, en dat allerlei heil uitwasse, en gerechtigheid te zamen uitspruiten; Ik, de HEERE, heb ze geschapen.","9":"Wee dien, die met zijn Formeerder twist, gelijk een potscherf met aarden potscherven! Zal ook het leem tot zijn formeerder zeggen: Wat maakt gij? of *zal* uw werk *zeggen*: Hij heeft geen handen?","10":"Wee dien, die tot den vader zegt: Wat genereert gij? en tot de vrouw: Wat baart gij?","11":"Alzo zegt de HEERE, de Heilige Israëls, en deszelfs Formeerder: Zij hebben Mij van toekomende dingen gevraagd; van Mijn kinderen, zoudt gij Mij van het werk Mijner handen bevel geven?","12":"Ik heb de aarde gemaakt, en Ik heb den mens daarop geschapen; Ik ben het! Mijn handen hebben de hemelen uitgebreid, en Ik heb al hun heir bevel gegeven.","13":"Ik heb hem verwekt in gerechtigheid, en al zijn wegen zal Ik recht maken; hij zal Mijn stad bouwen, en hij zal Mijn gevangenen loslaten, niet voor prijs, noch voor geschenk, zegt de HEERE der heirscharen.","14":"Alzo zegt de HEERE: De arbeid der Egyptenaren en de koophandel der Moren en der Sabeërs, der mannen van grote lengte, zullen tot u overkomen, en zij zullen de uwe zijn, zij zullen u navolgen, in boeien zullen zij overkomen; en zij zullen zich voor u buigen, zij zullen u smeken, *zeggende*: Gewisselijk, God is in u, en er is anders geen God meer.","15":"Voorwaar, Gij zijt een God, Die Zich verborgen houdt, de God Israëls, de Heiland.","16":"Zij zullen beschaamd en ook tot schande worden, zij allen; te zamen zullen zij met schande heengaan, die de afgoden maken.","17":"*Maar* Israël wordt verlost door den HEERE, *met* een eeuwige verlossing; gijlieden zult niet beschaamd noch tot schande worden, tot in alle eeuwigheden.","18":"Want alzo zegt de HEERE, Die de hemelen geschapen heeft, Die God, Die de aarde geformeerd, en Die ze gemaakt heeft; Hij heeft ze bevestigd, Hij heeft ze niet geschapen, dat zij ledig zijn zou, *maar* heeft ze geformeerd, opdat men daarin wonen zou: Ik ben de HEERE, en niemand meer.","19":"Ik heb niet in het verborgene gesproken, in een donkere plaats der aarde; Ik heb tot het zaad van Jakob niet gezegd: Zoekt Mij te vergeefs; Ik ben de HEERE, Die gerechtigheid spreekt, Die rechtmatige dingen verkondigt.","20":"Verzamelt u, en komt, treedt hier toe samen, gijlieden, die van de heidenen ontkomen zijt! Zij weten niets, die hun houten gesneden beelden dragen, en een god aanbidden, *die* niet verlossen kan.","21":"Verkondigt en treedt hier toe, ja, beraadslaagt samen: wie heeft dat laten horen van ouds her? *Wie* heeft dat van toen af verkondigd? Ben Ik het niet, de HEERE? en er is geen God meer behalve Mij, een rechtvaardig God, en een Heiland, niemand is er dan Ik.","22":"Wendt U naar Mij toe, wordt behouden, alle gij einden der aarde! want Ik ben God, en niemand meer.","23":"Ik heb gezworen bij Mijzelven, er is een woord der gerechtigheid uit Mijn mond gegaan, en het zal niet wederkeren: dat Mij alle knie zal gebogen worden, alle tong *Mij* zal zweren.","24":"Men zal van Mij zeggen: Gewisselijk, in den HEERE zijn gerechtigheden en sterkte; tot Hem zal men komen; maar zij zullen beschaamd worden allen, die tegen Hem ontstoken zijn.","25":"*Maar* in den HEERE zullen gerechtvaardigd worden en zich beroemen, het ganse zaad van Israël."},"KJV":{"1":"Thus saith the LORD to his anointed, to Cyrus, whose right hand I have holden, to subdue nations before him; and I will loose the loins of kings, to open before him the two leaved gates; and the gates shall not be shut;","2":"I will go before thee, and make the crooked places straight: I will break in pieces the gates of brass, and cut in sunder the bars of iron:","3":"And I will give thee the treasures of darkness, and hidden riches of secret places, that thou mayest know that I, the LORD, which call *thee* by thy name, *am* the God of Israel.","4":"For Jacob my servant's sake, and Israel mine elect, I have even called thee by thy name: I have surnamed thee, though thou hast not known","5":"I *am* the LORD, and *there is* none else, *there is* no God beside me: I girded thee, though thou hast not known","6":"That they may know from the rising of the sun, and from the west, that *there is* none beside me. I *am* the LORD,","7":"I form the light, and create darkness: I make peace, and create evil: I the LORD do","8":"Drop down, ye heavens, from above, and let the skies pour down righteousness: let the earth open, and let them bring forth salvation, and let righteousness spring up together; I the LORD have created","9":"Woe unto him that striveth with his Maker! *Let* the potsherd *strive* with the potsherds of the earth. Shall the clay say to him that fashioneth it, What makest thou? or thy work, He hath no hands?","10":"Woe unto him that saith unto *his* father, What begettest thou? or to the woman, What hast thou brought forth?","11":"Thus saith the LORD, the Holy One of Israel, and his Maker, Ask me of things to come concerning my sons, and concerning the work of my hands command","12":"I have made the earth, and created man upon it: I, *even* my hands, have stretched out the heavens, and all their host have I commanded.","13":"I have raised him up in righteousness, and I will direct all his ways: he shall build my city, and he shall let go my captives, not for price nor reward, saith the LORD of hosts.","14":"Thus saith the LORD, The labour of Egypt, and merchandise of Ethiopia and of the Sabeans, men of stature, shall come over unto thee, and they shall be thine: they shall come after thee; in chains they shall come over, and they shall fall down unto thee, they shall make supplication unto thee, *saying*, Surely God *is* in thee; and *there is* none else, *there is* no God.","15":"Verily thou *art* a God that hidest thyself, O God of Israel, the Saviour.","16":"They shall be ashamed, and also confounded, all of them: they shall go to confusion together *that are* makers of idols.","17":"*But* Israel shall be saved in the LORD with an everlasting salvation: ye shall not be ashamed nor confounded world without end.","18":"For thus saith the LORD that created the heavens; God himself that formed the earth and made it; he hath established it, he created it not in vain, he formed it to be inhabited: I *am* the LORD;","19":"I have not spoken in secret, in a dark place of the earth: I said not unto the seed of Jacob, Seek ye me in vain: I the LORD speak righteousness, I declare things that are right.","20":"Assemble yourselves and come; draw near together, ye *that are* escaped of the nations: they have no knowledge that set up the wood of their graven image, and pray unto a god *that* cannot save.","21":"Tell ye, and bring *them* near; yea, let them take counsel together: who hath declared this from ancient time? *who* hath told it from that time? *have* not I the LORD? and *there is* no God else beside me; a just God and a Saviour; *there is* none beside","22":"Look unto me, and be ye saved, all the ends of the earth: for I *am* God,","23":"I have sworn by myself, the word is gone out of my mouth *in* righteousness, and shall not return, That unto me every knee shall bow, every tongue shall swear.","24":"Surely, shall *one* say, in the LORD have I righteousness and strength: *even* to him shall *men* come; and all that are incensed against him shall be ashamed.","25":"In the LORD shall all the seed of Israel be justified, and shall glory."}},"tsk":{"1":[{"kopje":"tegen zijn","refs":["Jes 13:3","Jes 44:28","1 Kon 19:15","Jer 27:6"]},{"kopje":"wiens","refs":["Jes 41:13","Jes 42:6","Ps 73:23"]},{"kopje":"vastheb","refs":["Ezech 30:21-24"]},{"kopje":"neer te werpen","refs":["Jes 41:2","Jes 41:25","Ezra 1:1","Jer 50:3","Jer 50:35","Jer 51:11","Jer 51:20-24","Dan 5:6","Dan 5:28-30","Dan 7:5","Dan 8:3"]},{"kopje":"te openen","refs":["Nahum 2:6"]}],"2":[{"kopje":"gaan","refs":["Jes 13:4-17"]},{"kopje":"recht maken","refs":["Jes 40:4 <span class=\"wl wl-kjv\" data-code=\"H4899\">anointed,</span> to <span class=\"wl wl-kjv\" data-code=\"H3566\">Cyrus,</span> whose right <span class=\"wl wl-kjv\" data-code=\"H3225\">hand</span> I have <span class=\"wl wl-kjv\" data-code=\"H2388\">holden,</span> to <span class=\"wl wl-kjv\" data-code=\"H7286\">subdue</span> <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him; and I will <span class=\"wl wl-kjv\" data-code=\"H6605\">loose</span> the <span class=\"wl wl-kjv\" data-code=\"H4975\">loins</span> of <span class=\"wl wl-kjv\" data-code=\"H4428\">kings,</span> to <span class=\"wl wl-kjv\" data-code=\"H6605\">open</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him the two leaved <span class=\"wl wl-kjv\" data-code=\"H1817\">gates;</span> and the <span class=\"wl wl-kjv\" data-code=\"H8179\">gates</span> shall not be shut;","2":"I will <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thee, and <span class=\"wl wl-kjv\" data-code=\"H3474\">make</span> the crooked <span class=\"wl wl-kjv\" data-code=\"H1921\">places</span> <span class=\"wl wl-kjv\" data-code=\"H3474\">straight:</span> I will break in <span class=\"wl wl-kjv\" data-code=\"H7665\">pieces</span> the <span class=\"wl wl-kjv\" data-code=\"H1817\">gates</span> of <span class=\"wl wl-kjv\" data-code=\"H5154\">brass,</span> and cut in <span class=\"wl wl-kjv\" data-code=\"H1438\">sunder</span> the <span class=\"wl wl-kjv\" data-code=\"H1280\">bars</span> of iron:","3":"And I will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thee the <span class=\"wl wl-kjv\" data-code=\"H214\">treasures</span> of <span class=\"wl wl-kjv\" data-code=\"H2822\">darkness,</span> and hidden <span class=\"wl wl-kjv\" data-code=\"H4301\">riches</span> of secret <span class=\"wl wl-kjv\" data-code=\"H4565\">places,</span> that thou mayest <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I, the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> which <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> thee by thy <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> am the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of Israel.","4":"For <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> my <span class=\"wl wl-kjv\" data-code=\"H5650\">servant's</span> sake, and <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> mine <span class=\"wl wl-kjv\" data-code=\"H972\">elect,</span> I have even <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> thee by thy <span class=\"wl wl-kjv\" data-code=\"H8034\">name:</span> I have <span class=\"wl wl-kjv\" data-code=\"H3655\">surnamed</span> thee, though thou hast not known","5":"I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and there is none else, there is no <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H2108\">beside</span> me: I <span class=\"wl wl-kjv\" data-code=\"H247\">girded</span> thee, though thou hast not known","6":"That they may <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> from the <span class=\"wl wl-kjv\" data-code=\"H4217\">rising</span> of the <span class=\"wl wl-kjv\" data-code=\"H8121\">sun,</span> and from the <span class=\"wl wl-kjv\" data-code=\"H4628\">west,</span> that there is <span class=\"wl wl-kjv\" data-code=\"H657\">none</span> <span class=\"wl wl-kjv\" data-code=\"H1107\">beside</span> me. I am the LORD,","7":"I <span class=\"wl wl-kjv\" data-code=\"H3335\">form</span> the <span class=\"wl wl-kjv\" data-code=\"H216\">light,</span> and <span class=\"wl wl-kjv\" data-code=\"H1254\">create</span> <span class=\"wl wl-kjv\" data-code=\"H2822\">darkness:</span> I <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> <span class=\"wl wl-kjv\" data-code=\"H7965\">peace,</span> and <span class=\"wl wl-kjv\" data-code=\"H1254\">create</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil:</span> I the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> do","8":"Drop <span class=\"wl wl-kjv\" data-code=\"H7491\">down,</span> ye <span class=\"wl wl-kjv\" data-code=\"H8064\">heavens,</span> from <span class=\"wl wl-kjv\" data-code=\"H4605\">above,</span> and let the <span class=\"wl wl-kjv\" data-code=\"H7834\">skies</span> pour <span class=\"wl wl-kjv\" data-code=\"H5140\">down</span> <span class=\"wl wl-kjv\" data-code=\"H6664\">righteousness:</span> let the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> <span class=\"wl wl-kjv\" data-code=\"H6605\">open,</span> and let them bring <span class=\"wl wl-kjv\" data-code=\"H6509\">forth</span> <span class=\"wl wl-kjv\" data-code=\"H3468\">salvation,</span> and let <span class=\"wl wl-kjv\" data-code=\"H6666\">righteousness</span> spring <span class=\"wl wl-kjv\" data-code=\"H6779\">up</span> <span class=\"wl wl-kjv\" data-code=\"H3162\">together;</span> I the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> have created","9":"<span class=\"wl wl-kjv\" data-code=\"H1945\">Woe</span> unto him that <span class=\"wl wl-kjv\" data-code=\"H7378\">striveth</span> with his <span class=\"wl wl-kjv\" data-code=\"H3335\">Maker!</span> Let the <span class=\"wl wl-kjv\" data-code=\"H2789\">potsherd</span> strive with the <span class=\"wl wl-kjv\" data-code=\"H2789\">potsherds</span> of the <span class=\"wl wl-kjv\" data-code=\"H127\">earth.</span> Shall the <span class=\"wl wl-kjv\" data-code=\"H2563\">clay</span> <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> to him that <span class=\"wl wl-kjv\" data-code=\"H3335\">fashioneth</span> it, What <span class=\"wl wl-kjv\" data-code=\"H6213\">makest</span> thou? or thy <span class=\"wl wl-kjv\" data-code=\"H6467\">work,</span> He hath no hands?","10":"<span class=\"wl wl-kjv\" data-code=\"H1945\">Woe</span> unto him that <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> unto his <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> What <span class=\"wl wl-kjv\" data-code=\"H3205\">begettest</span> thou? or to the <span class=\"wl wl-kjv\" data-code=\"H802\">woman,</span> What hast thou brought forth?","11":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> the Holy <span class=\"wl wl-kjv\" data-code=\"H6918\">One</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and his <span class=\"wl wl-kjv\" data-code=\"H3335\">Maker,</span> <span class=\"wl wl-kjv\" data-code=\"H7592\">Ask</span> me of things to <span class=\"wl wl-kjv\" data-code=\"H857\">come</span> concerning my <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> and concerning the <span class=\"wl wl-kjv\" data-code=\"H6467\">work</span> of my <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> command","12":"I have <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> and <span class=\"wl wl-kjv\" data-code=\"H1254\">created</span> <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> upon it: I, even my <span class=\"wl wl-kjv\" data-code=\"H3027\">hands,</span> have stretched <span class=\"wl wl-kjv\" data-code=\"H5186\">out</span> the <span class=\"wl wl-kjv\" data-code=\"H8064\">heavens,</span> and all their <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> have I commanded.","13":"I have raised him <span class=\"wl wl-kjv\" data-code=\"H5782\">up</span> in <span class=\"wl wl-kjv\" data-code=\"H6664\">righteousness,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H3474\">direct</span> all his <span class=\"wl wl-kjv\" data-code=\"H1870\">ways:</span> he shall <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> my <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and he shall let <span class=\"wl wl-kjv\" data-code=\"H7971\">go</span> my <span class=\"wl wl-kjv\" data-code=\"H1546\">captives,</span> not for <span class=\"wl wl-kjv\" data-code=\"H4242\">price</span> nor <span class=\"wl wl-kjv\" data-code=\"H7810\">reward,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of hosts.","14":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> The <span class=\"wl wl-kjv\" data-code=\"H3018\">labour</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and <span class=\"wl wl-kjv\" data-code=\"H5505\">merchandise</span> of <span class=\"wl wl-kjv\" data-code=\"H3568\">Ethiopia</span> and of the <span class=\"wl wl-kjv\" data-code=\"H5436\">Sabeans,</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H4060\">stature,</span> shall come <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> unto thee, and they shall be thine: they shall <span class=\"wl wl-kjv\" data-code=\"H3212\">come</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> thee; in <span class=\"wl wl-kjv\" data-code=\"H2131\">chains</span> they shall come <span class=\"wl wl-kjv\" data-code=\"H5674\">over,</span> and they shall fall <span class=\"wl wl-kjv\" data-code=\"H7812\">down</span> unto thee, they shall make <span class=\"wl wl-kjv\" data-code=\"H6419\">supplication</span> unto thee, saying, Surely <span class=\"wl wl-kjv\" data-code=\"H410\">God</span> is in thee; and there is none else, there is <span class=\"wl wl-kjv\" data-code=\"H657\">no</span> God.","15":"<span class=\"wl wl-kjv\" data-code=\"H403\">Verily</span> thou art a <span class=\"wl wl-kjv\" data-code=\"H410\">God</span> that <span class=\"wl wl-kjv\" data-code=\"H5641\">hidest</span> thyself, O <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> the Saviour.","16":"They shall be <span class=\"wl wl-kjv\" data-code=\"H954\">ashamed,</span> and also <span class=\"wl wl-kjv\" data-code=\"H3637\">confounded,</span> all of them: they shall <span class=\"wl wl-kjv\" data-code=\"H1980\">go</span> to <span class=\"wl wl-kjv\" data-code=\"H3639\">confusion</span> <span class=\"wl wl-kjv\" data-code=\"H3162\">together</span> that are <span class=\"wl wl-kjv\" data-code=\"H2796\">makers</span> of idols.","17":"But <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> shall be <span class=\"wl wl-kjv\" data-code=\"H3467\">saved</span> in the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> with an <span class=\"wl wl-kjv\" data-code=\"H5769\">everlasting</span> <span class=\"wl wl-kjv\" data-code=\"H8668\">salvation:</span> ye shall not be <span class=\"wl wl-kjv\" data-code=\"H954\">ashamed</span> nor <span class=\"wl wl-kjv\" data-code=\"H3637\">confounded</span> <span class=\"wl wl-kjv\" data-code=\"H5769\">world</span> without end.","18":"For thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> that <span class=\"wl wl-kjv\" data-code=\"H1254\">created</span> the <span class=\"wl wl-kjv\" data-code=\"H8064\">heavens;</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> himself that <span class=\"wl wl-kjv\" data-code=\"H3335\">formed</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> it; he hath <span class=\"wl wl-kjv\" data-code=\"H3559\">established</span> it, he <span class=\"wl wl-kjv\" data-code=\"H1254\">created</span> it not in <span class=\"wl wl-kjv\" data-code=\"H8414\">vain,</span> he <span class=\"wl wl-kjv\" data-code=\"H3335\">formed</span> it to be <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabited:</span> I am the LORD;","19":"I have not <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> in <span class=\"wl wl-kjv\" data-code=\"H5643\">secret,</span> in a <span class=\"wl wl-kjv\" data-code=\"H2822\">dark</span> <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth:</span> I <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> not unto the <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> of <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> <span class=\"wl wl-kjv\" data-code=\"H1245\">Seek</span> ye me in <span class=\"wl wl-kjv\" data-code=\"H8414\">vain:</span> I the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> <span class=\"wl wl-kjv\" data-code=\"H6664\">righteousness,</span> I <span class=\"wl wl-kjv\" data-code=\"H5046\">declare</span> things that are right.","20":"<span class=\"wl wl-kjv\" data-code=\"H6908\">Assemble</span> yourselves and <span class=\"wl wl-kjv\" data-code=\"H935\">come;</span> draw <span class=\"wl wl-kjv\" data-code=\"H5066\">near</span> <span class=\"wl wl-kjv\" data-code=\"H3162\">together,</span> ye that are <span class=\"wl wl-kjv\" data-code=\"H6412\">escaped</span> of the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations:</span> they have no <span class=\"wl wl-kjv\" data-code=\"H3045\">knowledge</span> that set <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H6086\">wood</span> of their graven <span class=\"wl wl-kjv\" data-code=\"H6459\">image,</span> and <span class=\"wl wl-kjv\" data-code=\"H6419\">pray</span> unto a <span class=\"wl wl-kjv\" data-code=\"H410\">god</span> that cannot save.","21":"<span class=\"wl wl-kjv\" data-code=\"H5046\">Tell</span> ye, and bring them <span class=\"wl wl-kjv\" data-code=\"H5066\">near;</span> yea, let them take <span class=\"wl wl-kjv\" data-code=\"H3289\">counsel</span> <span class=\"wl wl-kjv\" data-code=\"H3162\">together:</span> who hath <span class=\"wl wl-kjv\" data-code=\"H8085\">declared</span> this from ancient <span class=\"wl wl-kjv\" data-code=\"H6924\">time?</span> who hath <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> it from that time? have not I the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD?</span> and there is no <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> else <span class=\"wl wl-kjv\" data-code=\"H1107\">beside</span> me; a <span class=\"wl wl-kjv\" data-code=\"H6662\">just</span> <span class=\"wl wl-kjv\" data-code=\"H410\">God</span> and a <span class=\"wl wl-kjv\" data-code=\"H3467\">Saviour;</span> there is <span class=\"wl wl-kjv\" data-code=\"H369\">none</span> beside","22":"<span class=\"wl wl-kjv\" data-code=\"H6437\">Look</span> unto me, and be ye <span class=\"wl wl-kjv\" data-code=\"H3467\">saved,</span> all the <span class=\"wl wl-kjv\" data-code=\"H657\">ends</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth:</span> for I am God,","23":"I have <span class=\"wl wl-kjv\" data-code=\"H7650\">sworn</span> by myself, the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> is gone <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of my <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> in <span class=\"wl wl-kjv\" data-code=\"H6666\">righteousness,</span> and shall not <span class=\"wl wl-kjv\" data-code=\"H7725\">return,</span> That unto me every <span class=\"wl wl-kjv\" data-code=\"H1290\">knee</span> shall <span class=\"wl wl-kjv\" data-code=\"H3766\">bow,</span> every <span class=\"wl wl-kjv\" data-code=\"H3956\">tongue</span> shall swear.","24":"Surely, shall one <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> in the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> have I <span class=\"wl wl-kjv\" data-code=\"H6666\">righteousness</span> and <span class=\"wl wl-kjv\" data-code=\"H5797\">strength:</span> even to him shall men <span class=\"wl wl-kjv\" data-code=\"H935\">come;</span> and all that are <span class=\"wl wl-kjv\" data-code=\"H2734\">incensed</span> against him shall be ashamed.","25":"In the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall all the <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> be <span class=\"wl wl-kjv\" data-code=\"H6663\">justified,</span> and shall glory."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"tot","tekst":"Of, van."},{"catchword":"Zijn gezalfde,","tekst":"Dat is, tot, of van dien koning, dien God heeft verkoren, gezalfd en verheven tot koning in Perzië en ook in Babylonië, opdat hij de Joden uit de Babylonische gevangenschap verlossen zou."},{"catchword":"om de volken","tekst":"De Chaldeën en andere volken."},{"catchword":"de lendenen","tekst":"Dat is, den gordel, waarmede hunne lenden omgord zijn."},{"catchword":"der koningen","tekst":"Van den koning van Babylonië, mitsgaders andere koningen en vorsten, die hem toegedaan zijn."},{"catchword":"ontbinden,","tekst":"Dat is, Ik zal hen krachteloos en onweerbaar maken, benemende hun alle macht en middelen van zich tegen Cores te kunnen stellen. Zie Job 12:18 ."},{"catchword":"voor zijn aangezicht","tekst":"Dat is, alle steden en vastigheden, inzonderheid de stad Babel, zal hij innemen; zij zullen hem zulks niet kunnen verhinderen."}],"2":[{"catchword":"Ik zal voor uw aangezicht","tekst":"Een aanspraak van God aan Cores."},{"catchword":"de kromme wegen","tekst":"Hebreeuws, het hoekige, of de krommigheden; dat is, Ik zal door mijne kracht wegnemen alles wat u enigszins in den weg zou mogen liggen of hinderlijk zijn."},{"catchword":"in stukken slaan","tekst":"Of, afsnijden, afhouwen."}],"3":[{"catchword":"de schatten,","tekst":"Hebreeuws, de schatten der duisternissen; dat is, die in het duistere verborgen liggen."},{"catchword":"en de verborgene","tekst":"Hebreeuws, de schatten der schuilplaatsen; dat is, die in hoeken en gaten verstopt zijn en verborgen liggen."},{"catchword":"Die u","tekst":"Dat is, die u tot dit werk geroepen en verordineerd heb."}],"4":[{"catchword":"Om Jakobs,","tekst":"Dat is, opdat gij de nakomelingen van Jakob uit de gevangenschap verlost, of verlaat, dat zij weder naar hun vaderland keren."},{"catchword":"Ik noemde u toe,","tekst":"Dat is, Ik heb u volkomen gekend, gelijk wij in onze taal zeggen, bij naam en toenaam."},{"catchword":"hoewel gij Mij","tekst":"O, toen gij mij niet kendet. Alzo ook vs.5."}],"5":[{"catchword":"Ik zal u gorden,","tekst":"Dat is, Ik zal u sterkte geven in het strijden tegen de Babyloniërs. Zie Isa 22:21 ."}],"6":[{"catchword":"dat er buiten Mij","tekst":"Dat is, dat er behalve mij geen God is, noch iets anders buiten mij is of bestaan kan. Want in God zijn wij, wij leven en zweven in Hem. Anders: dat er niemand is, buiten, of behalve mij."}],"7":[{"catchword":"Ik formeer","tekst":"Dat is, Ik ben het, die den mensen geluk en voorspoed doe overkomen. Licht voor vreugde en welstand. Zie Est 8:16 , en de aantekening aldaar. Zie ook Job 18:6 ; Psa 27:1 ."},{"catchword":"de duisternis;","tekst":"Dat is, jammer en ellende; zie de aantekening Gen 15:12 ."},{"catchword":"den vrede","tekst":"Vergelijk Psa 46:10 ."},{"catchword":"het kwaad,","tekst":"Dat is, de straffen en plagen. Zie Gen 19:19 ; Amo 3:6 ."}],"8":[{"catchword":"gij hemelen","tekst":"Wat God hier den hemel en de aarde beveelt, dat belooft Hij tegelijk zijn volk te geven [eigenlijk te spreken, verstaan de aarde en hemel niet wat God hun beveelt]. God belooft zijn volk dat Hij hen met de vreugde der verlossing uit Babylonië overvloediglijk zegenen en verzadigen zou."},{"catchword":"van gerechtigheid;","tekst":"De verlossing uit de Babylonische gevangenschap is een werk der gerechtigheid Gods, zo ten aanzien zijner beloften als ten aanzien dat het billijk is, dat het volk Gods verkwikking, de Babyloniërs straf ontvangen; en versta hierbij, de geestelijke verlossing door Christus. En alzo meermalen in het volgende."},{"catchword":"heil uitwasse,","tekst":"Dat is, verlossing van mijn volk."},{"catchword":"te zamen","tekst":"Anders: en dat zij, te weten de wolken, heil voortbrengen en zij haar, te weten de aarde, doe uitspruiten met elkander."},{"catchword":"heb ze geschapen","tekst":"Of, heb hem, te weten Cores, geschapen; dat is, daartoe geordineerd, te weten om mijn volk uit de gevangenschap te verlossen; of heb het geschapen."}],"9":[{"catchword":"Wee dien,","tekst":"Hier scheldt en bestraft de Heere degenen, die daar murmureerden, omdat Hij hen zolang in de Babylonische gevangenschap liet blijven, en integendeel hunne vijanden lustig en vrolijk liet zijn. Hij stelt hun voor ogen zijne macht en hoogste vrijheid, die Hij over zijne creaturen heeft. Hij zegt dat zulk hun murmureren is even alsof een potscherf met den pottenbakker wilde twisten, hetwelk niet betaamt; de ene potscherf moge met de andere twisten als met haar gelijke, maar dat een mens, die maar een potscherf is, met God zou twisten, dat betaamt gans niet. De volgende woorden worden aldus overgezet: dat een potscherf met aarde potscherven [twist]; of als [of] een potscherf met aarden potten [twistte]."},{"catchword":"Formeerder","tekst":"God heeft in den beginne Adam, en ons in hem, altemaal uit de aarde geschapen."},{"catchword":"Hij heeft geen handen?","tekst":"Te weten om iets wel te maken."}],"10":[{"catchword":"tot de vrouw","tekst":"Te weten tot zijns vaders vrouw, dat is, tot zijne moeder."}],"11":[{"catchword":"Zij","tekst":"Te weten de goddelozen onder het volk en in het algemeen alle ongelovigen. Het zijnde woorden des Heeren."},{"catchword":"hebben Mij","tekst":"Dit hebben zij gedaan met een onheilige stoutheid en onbeschaamdheid, als willende een proeve hebben van mijn goddelijke wetenschap."},{"catchword":"van Mijn kinderen,","tekst":"Anders aldus: vraagt gij mij van toekomende dingen, van mijne kinderen?"}],"12":[{"catchword":"Ik heb de aarde gemaakt,","tekst":"Alsof God zeide: Het zal mij aan de macht niet ontbreken ulieden uit Babel te verlossen, dewijl Ik die almachtige God ben, die den hemel en de aarde uit niet geschapen heeft."},{"catchword":"al hun heir","tekst":"Te weten de zon, maan, sterren. Zie Gen 2:1 ."}],"13":[{"catchword":"hem","tekst":"Te weten Cores mijnen gezalfde, vs.1."},{"catchword":"verwekt","tekst":"Te weten om mijn volk uit Babel te verlossen."},{"catchword":"al zijn wegen","tekst":"Te weten die Hij tegen de Babyloniërs trekken zal. De zin is: Ik zal hem in zijne aanslagen geluk en goeden voorspoed geven."},{"catchword":"hij zal","tekst":"Te weten Cores. Zie Dan 9:25 ."},{"catchword":"Mijn stad bouwen,","tekst":"Te weten Jeruzalem, dat Ik mij uitverkoren heb om daarin te wonen. Zie Isa 31:9 ."},{"catchword":"Mijn gevangenen","tekst":"De Joden, die mijn volk zijn, onaangezien zij in Babylonië gevangen zijn. Hebreeuws, mijne gevangenis."},{"catchword":"loslaten,","tekst":"Te weten om naar Judea, hun vaderland, te trekken."},{"catchword":"niet voor prijs,","tekst":"Maar vergeefs, uit milddadigheid, om mijnentwil, die hem zulk een voortreffelijke overwinning tegen de Babyloniërs geven zal. Zie Isa 52:3 ."}],"14":[{"catchword":"De arbeid","tekst":"Dat is, de rijkdom, dien de Egyptenaars met hun arbeid gewonnen en vergaderd hebben."},{"catchword":"de koophandel","tekst":"Dat is, het geld dat zij met koophandel gewonnen hebben."},{"catchword":"der mannen","tekst":"Hebreeuws, mannen van maat; dat is grote sterke mannen. Zie Num 13:32 ."},{"catchword":"tot u overkomen,","tekst":"O Jeruzalem, dat is, tot u, mijn volk, te weten nadat zij de Christelijke religie zullen hebben aangenomen."},{"catchword":"zij zullen de uwe zijn,","tekst":"Te weten die volken."},{"catchword":"in boeien","tekst":"Overwonnenn zijnde niet met zwaard of spies, of met uiterlijk geweld, maar door de kracht der hemelse waarheid, en van den Heiligen Geest in hunne conscientiën overtuigd zijnde."},{"catchword":"Gewisselijk,","tekst":"Anders: God is alleen bij u, of in u, o gij stad Gods. Versta hier, vooreerst Jeruzalem, daarna de Christelijke kerk."}],"15":[{"catchword":"Voorwaar,","tekst":"Dit zijn de woorden van den profeet."},{"catchword":"Die Zich verborgen","tekst":"Dat is, die onzichtbaar en onbegrijpelijk zijt, en tot welken men niet komen kan, als wonende in een onaankomelijk licht; en die voor de heidenen verborgen hebt gehouden het geheim der verlossing, hetwelk de Messias den Joden en heidenen zou aanbrengen, en voorts die U als verborgen houdt, dewijl Gij uwe kerk laat aanvechten, niet opstaande noch U vertonende tot verlossing derzelve vóór den bestemden tijd."}],"16":[{"catchword":"Zij zullen beschaamd","tekst":"Te weten al de beeldenmakers en de afgodendienaars."},{"catchword":"de afgoden maken","tekst":"Hebreeuws dat is, pijnen, smarten, benauwdheden; zulks brengen de afgoden hunnen dienaars aan; vergelijk 1Sa 31:9 ; 2Sa 5:21 ."}],"17":[{"catchword":"Israël","tekst":"Dat is, de ware kerk Gods."},{"catchword":"wordt verlost","tekst":"Of, is behouden; dat is, zal behouden worden."},{"catchword":"met","tekst":"Hebreeuws, met ene verlossing of behouding der eeuwigheden."},{"catchword":"gijlieden","tekst":"Te weten gij Israëlieten, mijn volk, alle gelovigen, zij zijn Joden of heidenen."},{"catchword":"tot in alle eeuwigheden","tekst":"Hebreeuws, tot in eeuwigheden der eeuwigheid."}],"18":[{"catchword":"dat zij ledig","tekst":"Hebreeuws, ledigheid, of ijdelheid."},{"catchword":"opdat men","tekst":"En inzonderheid mede tot dien einde, opdat Hij zich uit de mensen op aarde ene kerk verzamele, in welke Hij bekend en beleden worde."}],"19":[{"catchword":"Ik heb niet","tekst":"Dat is, de beloften, die Ik ulieden gedaan heb, zijn klaar, derhalve hebt gij geen oorzaak om aan dezelve te twijfelen. Anderen menen dat de profeet hier ziet op de verkondiging der wet Gods door Mozes, Exo 19 ."},{"catchword":"Zoekt Mij te vergeefs;","tekst":"Anders: zoekt mij alsof Ik een nietig ding ware. Hebreeuws, [met] ledigheid, of ijdelheid."},{"catchword":"Die gerechtigheid","tekst":"Gods Woord is een regel van alle gerechtigheid, en al wat Hij zijn volk belooft, gaat zeker en vast."}],"20":[{"catchword":"hier toe samen,","tekst":"Te weten tot de gemeente Gods."},{"catchword":"gijlieden,","tekst":"Hebreeuws, gij ontkomenen der heidenen."},{"catchword":"hun houten","tekst":"Gelijk in de optochten geschiedt. Hebreeuws, het hout van het gesneden beeld."}],"21":[{"catchword":"Verkondigt","tekst":"Zegt het elkander aan wat gij van de grote daden des Heeren en van zijne waarheid in zijne beloften bevonden hebt."},{"catchword":"treedt","tekst":"Te weten tot de gemeente Gods."},{"catchword":"beraadslaagt","tekst":"Te weten hoe gijlieden elkander tot de gemeente Gods zult brengen."},{"catchword":"van ouds her?","tekst":"Te weten van dien tijd af, toen zich de Heere zijner kerk heeft geopenbaard; hetzij dat wij dit nemen van de verkondiging der wet, hetzij dat God met Abraham heeft opgericht, of met onzer aller vader Adam in het paradijs."},{"catchword":"dat van toen af","tekst":"Te weten hetgeen in de voorgaande aantekening is vermeld, en voorts dat Christus den gelovigen de zaligheid zou toebrengen, welke door de verlossing uit de Babylonische gevangenschap is voorgebeeld geweest."}],"22":[{"catchword":"Wendt U","tekst":"Of, ziet mij aan."},{"catchword":"alle gij einden","tekst":"Dat is, gijlieden allen, die aan de einden der aarde woont."}],"23":[{"catchword":"der gerechtigheid","tekst":"Of, [in] gerechtigheid; dat is in trouw en geloof; dat is, een woord, dat zeker, vast en onfeilbaar is."},{"catchword":"het zal niet wederkeren","tekst":"Dat is, het zal niet wederroepen worden."},{"catchword":"Mij","tekst":"Dat is, tot mijne eer; Rom 14:11 ; Phi 2:10 ."},{"catchword":"alle knie","tekst":"De zin is: Alle volken en natiën zullen door den Messias tot de ware kennis Gods beroepen en velen daartoe gebracht worden."},{"catchword":"alle tong","tekst":"Dat is, alle natiën zullen mij kennen en belijden, dat is, God eren en belijden, als men in het gericht oprecht bij zijnen naam zweert."}],"24":[{"catchword":"Men zal","tekst":"Te weten een iegelijk der gelovigen; of aldus: Gewisselijk, in den Heere [zal men zeggen], heb ik gerechtigheid en sterkte."},{"catchword":"in den HEERE","tekst":"Dat is, de Heere heeft deze goederen in zichzelven, en Hij geeft ze zijnen uitverkorenen."},{"catchword":"gerechtigheden","tekst":"Of, alle, of volkomen gerechtigheid."},{"catchword":"sterkte;","tekst":"Te weten om zijne kerk te bewaren en in de gerechtigheid te behouden."},{"catchword":"tot Hem zal men komen;","tekst":"Of voor Hem; te weten voor zijnen rechterstoel, om te ontvangen loon naar werken; Rom 14:10-12 ."},{"catchword":"zij zullen beschaamd worden","tekst":"Te weten alle goddelozen, die tegen Hem murmureren en met toorn ontstoken zijn, of ontstoken worden, of die tegen Hem opstaan."}],"25":[{"catchword":"in den HEERE","tekst":"Te weten door den Heere Christus, die onze gerechtigheid is voor God."},{"catchword":"het ganse zaad","tekst":"Al de kinderen Israëls, te weten, de geestelijke kinderen Israëls, dat is, de gelovigen uit de Joden en heidenen. Zie boven Isa 44:5 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Thus saith the Lord unto [Or of] his anointed, [that is, to or of that King whom God had chosen, anointed, exalted to be King in Persia, and also in Babylon, that he might deliver the Jews out of the Babylonish captivity] to [or of] Cores, whose right hand I do hold, to subdue nations [the Chaldeans and other nations] before his face, and I will loose the loins of Kings: [that is, the girdle wherewith their loins are girt about (of Kings) that is, of the King of Babylon, together with other Kings and Princes that adhere to him. I will loose their loins) that is, I will make them weak and unable to resist Cyrus, by depriving them of all power and means to oppose him. See Job 12.on ver.18.] to open the doors before his face, and they gates shall not be shut, [that is, he shall take all the cities and strong holds, especially the city of Babel; they shall not be able to hinder him from doing it]"}],"2":[{"catchword":null,"tekst":"I will go before thy face, [A speech of God] and I will make the crooked ways [Heb. The cornered, or the crookedness&acirc;&euro;&trade;s straight]: [that is, I will by my power remove all that may ly in thy way, or may any ways oppose or hinder thee] I will break in sunder the copper doors, and I will beat in pieces, [or cut down, hew down] the iron bars."}],"3":[{"catchword":null,"tekst":"And I will give thee the treasures that are in darkness, [Heb. The treasures of darkness; that is, the treasures that lie hid in the dark] and the hidden riches [Heb. The treasures of hiding places; that is, which are stop up and lie hid in holes and corners] that thou maist know that I am the LORD, which calleth (thee) by thy name, [that is, which have called and appointed thee to this work] the God of Israel:"}],"4":[{"catchword":null,"tekst":"For Jacob my servants sake, and Israel mine elect (sake): [That is, that thou maist deliver the posterity of Jacob out captivity, and suffer them to return to their own country] yea I called thee by thy known thee (as we use to say) both by name and surname] though thou didst not know me [or when thou didst not know me. So likewise ver.5.]"}],"5":[{"catchword":null,"tekst":"I am the LORD, and (there is) none more, there is no God besides me: I will gird thee, [That is, I will give thee strength and ability to fight against the Babylonians. See above chap.22.on ver.21.] though thou knowest me not:"}],"6":[{"catchword":null,"tekst":"That they may know from the rising of the sun, and from the going down (thereof,) that there is nothing without me: [That is, that there is no God besides me, neither can anything else be or subsist without me. For we are in God, we live and move in him. Others, that there is none without or besides me] I am the LORD, and (there is) none more."}],"7":[{"catchword":null,"tekst":"I form the light, [That is, I am he that causeth happiness and prosperity to happen unto men. Light for joy and prosperity. See Esth.chap.8.ver.16. and the Annotations there. See also Job 18.on ver.6. and Psalm 27.on verse 1.] and create darkness, [that is, misery and calamity. See Gen.15. the Annotat. On ver.12.] I make peace, [Compare Psal.46.10.] and create evil, [that is, plagues and punishments. See Gen.19.on ver.19. and Amos 3.on ver.6. Lament.3.38.] I the LORD do all these things."}],"8":[{"catchword":null,"tekst":"Drop down, ye heavens from above, and let the clouds flow with righteousness: and let the earth open it self, and let all manner of salvation grow forth, and let righteousness spring forth together: [That which God here commandeth heaven and earth, the same he promiseth likewise to give unto his people. To speak properly, neither the earth not the heaven do understand that which God enjoineth and commandeth them. God promiseth his people that he will abundantly bless and satisfy them with the joy of their deliverance from Babylon: (and let the clouds flow with righteousness) the deliverance from the Babylonish captivity is a work of the righteousness or justice of God, both in respect of his promises, and likewise in respect of his promises, and likewise in respect that it is just and right in the fight of God, that his people should receive comfort and refreshing, and the Babylonians judgement or punishment. And understand withal spiritual deliverance or redemption by Christ. And so oft in that which followeth, (and let all manner of salvation grow forth) that is, the deliverance or redemption of my people, (and let righteousness spring forth together) Others, and let them (to wit, the clouds) bring forth salvation, and let it (to with the earth) cause them to spring forth together] I the Lord have created it, [or have created him; to wit, Cores, that is ordained him for that purpose; to wit, to deliver my people out of captivity."}],"9":[{"catchword":null,"tekst":"Wo unto him that striveth with his framer; as a potsherd (striveth) with earthen potsherds: [Here the Lord rebuketh and reproveth them that did murmur because he suffered them to remain so long in captivity in Babylon, and on the contrary, suffered their enemies to be all the while at ease and merry: he setteth afore their eyes his own power and sovereignty which he hath over his creatures; and he saith that this murmuring is as if a potsherd should strive and contend with the potter, which is not seemly: one potsherd may indeed strive and contend with another as with its equal, but for a man who is but like a potsherd in comparison, to strive with God, is most unseemly and absurd. The following words are likewise thus rendered by some, let a potsherd (strive) with earthen potsherd, or as (if) a potsherd (should strive) with earthen potsherds (wo unto him that striveth with his farmer,) God in the beginning formed and created Adam, and all of us in him, out of earth] shall also the clay say unto his former, what makest thou? [Compare Jer 18:6. Rom 9:20.] or (shall) the work (say) he hath no hands? [to wit, to make a thing well.]"}],"10":[{"catchword":null,"tekst":"Wo unto him that saith unto (his) father, what begettest thou? And to the woman, [To wit, to his fathers wife, that is, to his mother] what bringest thou forth?"}],"11":[{"catchword":null,"tekst":"Thus saith the LORD, the holy One of Israel, and his former: they [To wit, the wicked ones among the people, and in general all unbelievers] have asked me of things to come: [They are the words of God. They did this with profane boldness and impudence, as desiring to make trial of my divine knowledge] concerning my children, [Others thus: do ye asked me of things to come concerning have my children?] should ye give me a command concerning the work of mine hands?"}],"12":[{"catchword":null,"tekst":"I have made the earth, and I have created men upon on it, I am be, mine hands have spread out the heavens, and I have given command to all their hosts (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +

    `<select id="hfdkies">${hfdOpties}</select>` +

    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte

function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
