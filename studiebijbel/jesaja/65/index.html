l":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Ik ben gevonden door hen die naar Mij niet vroegen; Ik ben gevonden door hen die Mij niet zochten; tegen het volk, dat naar Mijn Naam niet genoemd was, heb Ik gezegd: Zie, hier ben Ik, zie, hier ben Ik.","2":"Ik heb Mijn handen uitgebreid, de hele dag, tot een opstandig volk, dat wandelt op een weg die niet goed is, naar hun eigen gedachten.","3":"Een volk dat Mij voortdurend tergt in Mijn aangezicht, terwijl het in de hoven offert en op tichelstenen wierook brandt;","4":"Zittend bij de graven, zo overnachten zij bij de bewaarde plaatsen, etend zwijnenvlees, en er is sap van gruwelijke dingen in hun vaten.","5":"Die daar zeggen: Houd u tot uzelf, en kom niet bij mij, want ik ben heiliger dan u. Deze zijn een rook in Mijn neus, een vuur, dat de hele dag brandt.","6":"Zie, het is voor Mijn aangezicht geschreven; Ik zal niet zwijgen, maar Ik zal vergelden, ja, in hun boezem zal Ik vergelden;","7":"Uw ongerechtigheden, en de ongerechtigheden van uw vaderen tegelijk, zegt de HEERE, die op de bergen wierook gebrand hebben, en Mij smaad aangedaan hebben op de heuvels; daarom zal Ik hun vorige werkloon weer in hun boezem toemeten.","8":"Zo zegt de HEERE: Zoals wanneer men most in een tros druiven vindt, men zegt: Verderf ze niet, want er is een zegen in; zo zal Ik het om Mijn knechten doen, dat Ik hen niet allen verderf.","9":"En Ik zal nageslacht uit Jakob voortbrengen, en uit Juda een erfbezitter van Mijn bergen; en Mijn uitverkorenen zullen het erfelijk bezitten, en Mijn knechten zullen daar wonen.","10":"En Saron zal tot een schaapskooi worden, en het dal van Achor tot een rustplaats voor het vee, voor Mijn volk, dat Mij gezocht heeft.","11":"Maar u, verlaters van de HEERE, u, vergeters van de berg van Mijn heiligheid, u, aanrichters van een tafel voor die bende, en u, opvullers van het drank voor dat getal!","12":"Ik zal u ook tellen voor het zwaard, zodat u zich allen ter slachting zult buigen, omdat Ik geroepen heb, maar u hebt niet geantwoord; Ik gesproken heb, maar u hebt niet gehoord; maar hebt gedaan wat kwaad was in Mijn ogen, en hebt gekozen waaraan Ik geen lust heb.","13":"Daarom zegt de Heere HEERE zo: Zie, Mijn knechten zullen eten, maar u zult hongeren; zie, Mijn knechten zullen drinken, maar u zult dorsten; zie, Mijn knechten zullen blij zijn, maar u zult beschaamd zijn.","14":"Zie, Mijn knechten zullen juichen van een goed hart, maar u zult schreeuwen van harteleed, en van verbreking van de geest zult u huilen.","15":"En u zult uw naam voor Mijn uitverkorenen tot een vervloeking laten; en de Heere HEERE zal u doden, maar Zijn knechten zal Hij met een andere naam noemen;","16":"Zodat wie zich zal zegenen op aarde, zich zal zegenen in de God van de waarheid; en wie zal zweren op aarde, zal zweren bij de God van de waarheid, omdat de vorige benauwdheden vergeten zullen zijn, en omdat zij voor Mijn ogen verborgen zijn.","17":"Want zie, Ik schep nieuwe hemelen en een nieuwe aarde; en de vorige dingen zullen niet meer gedacht worden, en zullen in het hart niet opkomen.","18":"Maar wees u vrolijk, en verheug u tot in eeuwigheid over hetgeen Ik schep; want zie, Ik schep Jeruzalem een verheuging, en haar volk een vrolijkheid.","19":"En Ik zal Mij verheugen over Jeruzalem, en vrolijk zijn over Mijn volk; en in haar zal niet meer gehoord worden de stem van het wenen, noch de stem van het geschreeuw.","20":"Vandaar zal niet meer een zuigeling zijn die maar weinig dagen leeft, noch een oud man, die zijn dagen niet zal vervullen; want een jongeling zal sterven, honderd jaar oud zijnde, maar een zondaar, honderd jaar oud zijnde, zal vervloekt worden.","21":"En zij zullen huizen bouwen en bewonen, en zij zullen wijngaarden planten, en daarvan de vrucht eten.","22":"Zij zullen niet bouwen, zodat een ander het bewoont; zij zullen niet planten, zodat een ander het eet, want de dagen van Mijn volk zullen zijn als de dagen van een boom, en Mijn uitverkorenen zullen het werk van hun handen verslijten.","23":"Zij zullen niet tevergeefs arbeiden, noch baren voor verstoring; want zij zijn het nageslacht van de gezegenden van de HEERE, en hun nakomelingen met hen.","24":"En het zal gebeuren: eer zij roepen, zal Ik antwoorden; terwijl zij nog spreken, zal Ik horen.","25":"De wolf en het lam zullen samen weiden, en de leeuw zal stro eten als een rund, en stof zal het voedsel van de slang zijn; zij zullen geen kwaad doen, noch verderven op heel Mijn heilige berg, zegt de HEERE."},"SV":{"1":"Ik ben gevonden van hen, die *naar* *Mij* niet vraagden; Ik ben gevonden van degenen, die Mij niet zochten; tot het volk, dat naar Mijn Naam niet genoemd was, heb Ik gezegd: Ziet, *hier* ben Ik, ziet, *hier* ben Ik.","2":"Ik heb Mijn handen uitgebreid, den gansen dag tot een wederstrevig volk, die wandelen op een weg, die niet goed is, naar hun *eigen* gedachten.","3":"Een volk, Mij geduriglijk tergende in Mijn aangezicht, in hoven offerende, en rokende op tichelstenen;","4":"Zittende bij de graven, zo vernachten zij bij degenen, die bewaard worden, etende zwijnenvlees, en er is sap van gruwelijke dingen in hun vaten.","5":"Die daar zeggen: Houd u tot uzelven, en naak tot mij niet, want ik ben heiliger dan gij. Deze zijn een rook in Mijn neus, een vuur, den gansen dag brandende.","6":"Ziet, het is voor Mijn aangezicht geschreven; Ik zal niet zwijgen, maar Ik zal vergelden, ja, in hun boezem zal Ik vergelden;","7":"Uw ongerechtigheden, en uwer vaderen ongerechtigheden tegelijk, zegt de HEERE, die gerookt hebben op de bergen, en Mij smaadheid aangedaan hebben op de heuvelen; daarom zal Ik hun vorig werkloon in hun boezem weder toemeten.","8":"Alzo zegt de HEERE: Gelijk wanneer men most in een bos druiven vindt, men zegt: Verderf ze niet, want er is een zegen in; alzo zal Ik het om Mijner knechten wil doen, dat Ik hen niet allen verderve.","9":"En Ik zal zaad uit Jakob voortbrengen, en uit Juda een erfbezitter van Mijn bergen; en Mijn uitverkorenen zullen het erfelijk bezitten, en Mijn knechten zullen aldaar wonen.","10":"En Saron zal tot een schaapskooi worden, en het dal van Achor tot een runderleger, voor Mijn volk, dat Mij gezocht heeft.","11":"Maar gij verlaters des HEEREN, gij vergeters van den berg Mijner heiligheid, gij aanrichters ener tafel voor die bende, en gij opvullers des dranks voor dat getal!","12":"Ik zal ulieden ook ten zwaarde tellen, dat gij allen u ter slachting zult krommen, omdat Ik geroepen heb, maar gij hebt niet geantwoord, Ik gesproken heb, maar gij hebt niet gehoord, maar hebt gedaan, dat kwaad was in Mijn ogen, en hebt verkoren hetgeen, waaraan Ik geen lust heb.","13":"Daarom zegt de Heere HEERE alzo: Ziet, Mijn knechten zullen eten, doch gijlieden zult hongeren; ziet, Mijn knechten zullen drinken, doch gijlieden zult dorsten; ziet, Mijn knechten zullen blijde zijn, doch gijlieden zult beschaamd zijn.","14":"Ziet, Mijn knechten zullen juichen van goeder harte, maar gijlieden zult schreeuwen van weedom des harten, en van verbreking des geestes zult gij huilen.","15":"En gijlieden zult uw naam Mijn uitverkorenen tot een vervloeking laten; en de Heere HEERE zal ulieden doden, maar Zijn knechten zal Hij met een anderen naam noemen;","16":"Zodat, wie zich zegenen zal op aarde, die zal zich zegenen in den God der waarheid; en wie zal zweren op aarde, die zal zweren bij den God der waarheid, omdat de vorige benauwdheden zullen vergeten zijn, en omdat zij voor Mijn ogen verborgen zijn.","17":"Want ziet, Ik schep nieuwe hemelen en een nieuwe aarde; en de vorige dingen zullen niet *meer* gedacht worden, en zullen in het hart niet opkomen.","18":"Maar weest gijlieden vrolijk, en verheugt u tot in der eeuwigheid *in* hetgeen Ik schep; want ziet, Ik schep Jeruzalem een verheuging, en haar volk een vrolijkheid.","19":"En Ik zal Mij verheugen over Jeruzalem, en vrolijk zijn over Mijn volk; en in haar zal niet meer gehoord worden de stem der wening, noch de stem des geschreeuws.","20":"Van daar zal niet meer wezen een zuigeling van *weinig* dagen, noch een oud man, die zijn dagen niet zal vervullen; want een jongeling zal sterven, honderd jaren oud zijnde, maar een zondaar, honderd jaren oud zijnde, zal vervloekt worden.","21":"En zij zullen huizen bouwen en bewonen, en zij zullen wijngaarden planten, en derzelver vrucht eten.","22":"Zij zullen niet bouwen, dat het een ander bewone; zij zullen niet planten, dat het een ander ete, want de dagen Mijns volks zullen zijn als de dagen eens booms, en Mijn uitverkorenen zullen het werk hunner handen verslijten.","23":"Zij zullen niet tevergeefs arbeiden, noch baren ter verstoring; want zij zijn het zaad der gezegenden des HEEREN, en hun nakomelingen met hen.","24":"En het zal geschieden, eer zij roepen, zo zal Ik antwoorden; terwijl zij nog spreken, zo zal Ik horen.","25":"De wolf en het lam zullen te zamen weiden, en de leeuw zal stro eten als een rund, en stof zal de spijze der slang zijn; zij zullen geen kwaad doen noch verderven op Mijn gansen heiligen berg, zegt de HEERE."},"KJV":{"1":"I am sought of *them that* asked not *for me*; I am found of *them that* sought me not: I said, Behold me, behold me, unto a nation *that* was not called by my name.","2":"I have spread out my hands all the day unto a rebellious people, which walketh in a way *that was* not good, after their own thoughts;","3":"A people that provoketh me to anger continually to my face; that sacrificeth in gardens, and burneth incense upon altars of brick;","4":"Which remain among the graves, and lodge in the monuments, which eat swine's flesh, and broth of abominable *things is in* their vessels;","5":"Which say, Stand by thyself, come not near to me; for I am holier than thou. These *are* a smoke in my nose, a fire that burneth all the day.","6":"Behold, *it is* written before me: I will not keep silence, but will recompense, even recompense into their bosom,","7":"Your iniquities, and the iniquities of your fathers together, saith the LORD, which have burned incense upon the mountains, and blasphemed me upon the hills: therefore will I measure their former work into their bosom.","8":"Thus saith the LORD, As the new wine is found in the cluster, and *one* saith, Destroy it not; for a blessing *is* in it: so will I do for my servants' sakes, that I may not destroy","9":"And I will bring forth a seed out of Jacob, and out of Judah an inheritor of my mountains: and mine elect shall inherit it, and my servants shall dwell","10":"And Sharon shall be a fold of flocks, and the valley of Achor a place for the herds to lie down in, for my people that have sought","11":"But ye *are* they that forsake the LORD, that forget my holy mountain, that prepare a table for that troop, and that furnish the drink offering unto that number.","12":"Therefore will I number you to the sword, and ye shall all bow down to the slaughter: because when I called, ye did not answer; when I spake, ye did not hear; but did evil before mine eyes, and did choose *that* wherein I delighted","13":"Therefore thus saith the Lord GOD, Behold, my servants shall eat, but ye shall be hungry: behold, my servants shall drink, but ye shall be thirsty: behold, my servants shall rejoice, but ye shall be ashamed:","14":"Behold, my servants shall sing for joy of heart, but ye shall cry for sorrow of heart, and shall howl for vexation of spirit.","15":"And ye shall leave your name for a curse unto my chosen: for the Lord GOD shall slay thee, and call his servants by another name:","16":"That he who blesseth himself in the earth shall bless himself in the God of truth; and he that sweareth in the earth shall swear by the God of truth; because the former troubles are forgotten, and because they are hid from mine eyes.","17":"For, behold, I create new heavens and a new earth: and the former shall not be remembered, nor come into mind.","18":"But be ye glad and rejoice for ever *in that* which I create: for, behold, I create Jerusalem a rejoicing, and her people a joy.","19":"And I will rejoice in Jerusalem, and joy in my people: and the voice of weeping shall be no more heard in her, nor the voice of crying.","20":"There shall be no more thence an infant of days, nor an old man that hath not filled his days: for the child shall die an hundred years old; but the sinner *being* an hundred years old shall be accursed.","21":"And they shall build houses, and inhabit *them*; and they shall plant vineyards, and eat the fruit","22":"They shall not build, and another inhabit; they shall not plant, and another eat: for as the days of a tree *are* the days of my people, and mine elect shall long enjoy the work of their hands.","23":"They shall not labour in vain, nor bring forth for trouble; for they *are* the seed of the blessed of the LORD, and their offspring","24":"And it shall come to pass, that before they call, I will answer; and while they are yet speaking, I will hear.","25":"The wolf and the lamb shall feed together, and the lion shall eat straw like the bullock: and dust *shall be* the serpent's meat. They shall not hurt nor destroy in all my holy mountain, saith the LORD."}},"tsk":{"1":[{"kopje":"Ik ben gevonden","refs":["Jes 2:2","Jes 2:3","Jes 11:10","Jes 55:5","Ps 22:28","Rom 9:24-26","Rom 9:30","Rom 10:20","Ef 2:12","Ef 2:13"]},{"kopje":"Zie","refs":["Jes 40:9","Jes 41:27","Jes 45:22","Joh 1:29"]},{"kopje":"tegen","refs":["Jes 43:1","Jes 63:19","Hos 1:10","Zach 2:11","Zach 8:22","Zach 8:23","1 Petr 2:10"]}],"2":[{"kopje":"uitgebreid","refs":["Spr 1:24","Matt 23:37","Luk 13:34","Luk 19:41","Luk 19:42","Rom 10:21"]},{"kopje":"opstandig","refs":["Jes 1:2","Jes 63:10","Deut 9:7","Deut 31:2 code=\"H738\">lion</span> shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> <span class=\"wl wl-kjv\" data-code=\"H8401\">straw</span> like the <span class=\"wl wl-kjv\" data-code=\"H1241\">bullock:</span> and <span class=\"wl wl-kjv\" data-code=\"H6083\">dust</span> shall be the <span class=\"wl wl-kjv\" data-code=\"H5175\">serpent's</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">meat.</span> They shall not <span class=\"wl wl-kjv\" data-code=\"H7489\">hurt</span> nor <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy</span> in all my <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the LORD."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"gevonden","tekst":"Hebreeuws eigenlijk gezocht. Versta hierbij, en gevonden, gelijk er staat Rom 10:20 . Dit spreekt de Heere, en het is ene profetie van de beroeping der heidenen en de verwerping de Joden. Zie deze manier van spreken, te weten zoeken voor zoeken en vinden, Ecc 3:6 , en vergelijk Gen 12:15 ."},{"catchword":"die naar Mij","tekst":"Hebreeuws, die niet vraagden."},{"catchword":"van degenen,","tekst":"Dat is, van de heidenen, die vreemd waren van het burgerschap van Israël, enz. Zie Eph 2:12 ."},{"catchword":"het volk,","tekst":"Versta hier ook de heidenen, die eertijds Gods volk niet genaamd werden. Zie Rom 9:24-26 ."},{"catchword":"Ziet, hier ben Ik,","tekst":"Dat is, ik bied mij tot uw bestaan, te weten in en door de predikatie van het heilig Evangelie."}],"2":[{"catchword":"Mijn handen","tekst":"Dat is, Ik heb de Joden door de predikatie der profeten, en daarna door de apostelen, steeds laten roepen en onderwijzen, maar zij hebben het niet ter harte genomen. Als de Heilige Schrift zegt dat de mensen de handen uitbreiden of uitspreiden, dat betekent bidden, gelijk Exo 9:29 , en 1Ki 8:22 . Zie de aantekening aldaar. Maar als er gezegd wordt dat God prediken, gelijk hier en Pro 1:24 , zie de aantekening aldaar."},{"catchword":"wederstrevig volk,","tekst":"Zie Isa 1:23 . De apostel Paulus, de Griekse overzetters volgende, heeft: tot een ongehoorzaam en tegensprekend volk, en hij zegt dat dit tot Israël gesproken is, Rom 10:21 ."},{"catchword":"een weg,","tekst":"Gelijk Psa 36:5 . Het woord weg wordt somtijds in de Heilige Schrift gebruikt voor religie, gelijk Act 18:25-26 , en Act 22:4 ."},{"catchword":"naar hun eigen","tekst":"Daar staat Psa 94:11 , dat des mensen gedachten de ijdelheid zelve zijn. Zie ook Psa 81:13 ."}],"3":[{"catchword":"Mij geduriglijk","tekst":"Te weten door hunne afgoderij en gruwelen. Zie Deu 32:16 ."},{"catchword":"in Mijn aangezicht,","tekst":"Dat is, openlijk, stoutelijk, onbeschaamd, het tegendeel van Gods verbod; Exo 20:3 . Zie Job 1:11 ."},{"catchword":"in hoven","tekst":"Te weten onder de groene bomen, naar de wijze der afgodendienaars. Zie Isa 1:29 , en Isa 66:17 ."},{"catchword":"op tichelstenen;","tekst":"Dat is, op de afgodische altaren, die van tichelstenen gemaakt zijn, versmadende Gods gouden altaar, dat Salomo had laten maken, 1Ki 7:48 ."}],"4":[{"catchword":"bij de graven,","tekst":"Om de doden voor de levenden te vragen, Isa 8:19 , hetwelk een gruwel is voor God; Deu 8:11-12 . Zie Isa 2:6 , Isa 2:8 , Isa 2:19 ."},{"catchword":"bij degenen,","tekst":"Dat is, naar sommiger mening, bij de afgoden, of beelden der valse goden, die niet bewaarden, maar moesten bewaard en bewaakt worden, opdat zij niet zouden gestolen worden. Doch anderen verstaan het van de dode lichamen, die de zwarte kunstenaars plachten te bewaren, en bij nacht bij dezelve te blijven om hun wat af vragen. Anders: zo vernachten zij in woeste plaatsen, of in bewaarde begraafplaatsen."},{"catchword":"etende","tekst":"Tegen Gods uitdrukkelijk verbod [als zijnde onrein]; Lev 11:7 ; Deu 14:8 ."},{"catchword":"sap","tekst":"Dat is, sop van het vlees der verboden dieren, die den Heere een gruwel zijn als men ze eet. Anders: stukken van onrein, of stinkend, of verrot [vlees] is in hunne vaten. Zie de aantekening Lev 7:18 . Doch men moet hier onder de bovenverhaalde gruwelen verstaan allerlei overtreding der wet Gods."}],"5":[{"catchword":"zeggen","tekst":"Te weten tot den profeet, die hen wil straffen en tot boete vermanen."},{"catchword":"Houd u tot uzelven,","tekst":"Dat is, blijf van mij en nader mij niet, bekommer u met uzelven."},{"catchword":"ik ben","tekst":"Het zijn de woorden der pochers en schijnheiligen, anderen trotserende, als zeer heilige mannen zijnde, daar zij toch geheel onrein waren; zie Pro 30:12 ; Luk 18:11 ; Rom 2:17 , enz."},{"catchword":"heiliger","tekst":"Of, heilig, ten aanzien van u."},{"catchword":"zijn een rook","tekst":"Dat is, zij zijn mij zeer bezwaarlijk, daarom zal Ik hen in mijnen toorn verdelgen. Anders: zij zijn een rook in mijnen toorn; dat is, zij verdienen een grote straf, die hun ook overkoemn zal in mijnen toorn. Alzo wordt rook voor grote straf genomen; Isa 14:31 ; Rev 18:9 , Rev 18:18 , en Rev 19:3 , en elders meer."},{"catchword":"den gansen dag","tekst":"Dat is, geduriglijk brandende. Zodat dit te verstaan is van het helse vuur, dat altoos brandt; Mar 9:45-46 , Mar 9:48 ."}],"6":[{"catchword":"het","tekst":"Te weten het afgodisch wezen der Joden, waarvan straks gesproken is."},{"catchword":"is voor Mijn aangezicht","tekst":"Te weten opdat het niet vergeten worde; Ik zal het te zijner tijd wel straffen. Zie Exo 17:14 ; Deu 32:34 . Zie de aantekening aldaar en Jer 17:1 ."},{"catchword":"Ik zal niet zwijgen,","tekst":"Versta dit zwijgen niet zozeer van met woorden te zwijgen, als metterdaad zich stil te houden; gelijk Jdg 18:9 . Zie de aantekening aldaar; zie ook de aantekening 1Ki 22:3 ."},{"catchword":"in hun boezem","tekst":"Dat is overvloediglijk, met volle maat, gelijk Psa 79 , zie de aantekening Psa 79:12 ."}],"7":[{"catchword":"Mij smaadheid","tekst":"Of, gehoond hebben, te weten met hun valsen godsdienst. Zie Psa 106:20-21 ."},{"catchword":"zal Ik","tekst":"Dat is, Ik zal hen straffen, gelijk zij wel verdiend hebben met mij tot toorn te verwekken."},{"catchword":"hun vorig werkloon","tekst":"Of, het eerste loon; te weten dat zij met hunne misdaden verdiend hebben. Zie Isa 40:10 , en Isa 62:11 ."}],"8":[{"catchword":"Gelijk","tekst":"Hier geeft de Heere te kennen dat, gelijk wanneer iemand gezind is een wijnstok uit te roeien omdat hij geen goede vruchten draagt, nochtans denzelven verschoont als hij enige goede druiven aan denzelven vindt; alzo zal de Heere het kleine overblijfsel der Israëlieten sparen vanwege het klein getal zijner uitverkorenen; vergelijk hiermede Isa 17:6 , en Rom 11:5 ."},{"catchword":"niet,","tekst":"Te weten de druif."},{"catchword":"een zegen in;","tekst":"Dat is, goede wijn, komende van den zegen des Heeren, en waarvoor Hij te zegenen, of te loven en te bedanken is."},{"catchword":"om Mijner knechten","tekst":"Dat is, om de godzaligen onder de Joden, die mij getrouwelijk dienen."},{"catchword":"dat Ik hen","tekst":"Dat is, dat Ik het ganse volk niet verderve. Anders: opdat Ik het niet alles verderve."}],"9":[{"catchword":"zaad uit Jakob","tekst":"Dat is, enige weinigen, gelijk Rom 9:29 ; zie Isa 1:9 met de aantekening. De zin is: Ik zal mijne kerk vermenigvuldigen en zegenen."},{"catchword":"voortbrengen,","tekst":"Of, uitvoeren; te weten vooreerst uit de Babylonische gevangenschap, en daarna uit de geestelijke gevangenis des duivels."},{"catchword":"een erfbezitter","tekst":"Dat is, een klein hoopje, hetwelk de bergen bezit en bewoont."},{"catchword":"van Mijn bergen;","tekst":"Dat is, van het land Juda, hetwelk bergachtig is; de kerken of gemeenten der gelovigen, en daarna het rijk der hemelen, worden door het bergachtig land Kanaän, inzonderheid door den berg Zion, afgebeeld; zie Eze 36:1 , enz."},{"catchword":"zullen het erfelijk","tekst":"Te weten het land, gelijk Mat 5:5 , of Jeruzalem; gelijk onder vs.19."}],"10":[{"catchword":"Saron","tekst":"Dat is, hunne kudden zullen in vruchtbare plaatsen weiden; met welke woorden te kennen wordt gegeven de overvloed der zegeningen, die de kerk en een ieder lidmaat derzelve van God ontvangen zou. Want Saron was een vruchtbare en lustige vallei. Zie 1Ch 5:16 , en 1Ch 27:29 ; Son 2:1 ; Isa 33:9 ."},{"catchword":"het dal van Achor","tekst":"Dit was ook een vruchtbaar dal, bij Jericho gelegen; zie Jos 7:26 ; Hos 2:14 ."},{"catchword":"tot een runderleger,","tekst":"Of, tot ene legerplaats der runderen, of tot ene plaats waar het vee nederliggen en rusten zal."}],"11":[{"catchword":"gij vergeters","tekst":"Of, gijlieden, die mijn heiligen berg vergeet, dat is mijn tempel en den waren godsdienst, die in mijn tempel behoorde geoefend te worden. Hij spreekt de ongelovige Joden aan. Zie Rom 10:21 ; zie ook Psa 106:21 ."},{"catchword":"aanrichters","tekst":"De zin is: Nadat gij uw afgodisch offer verricht heb, zo zet gij u aan de tafel en eet van zulke offeranden."},{"catchword":"bende,","tekst":"Het Hebreeuwse woord betekent ene bende, een troep, een hoop, of heir; zie Gen 30:11 ; enigen verstaan hier het heir des hemels, de zon, de maan en de sterren; vergelijk Jer 7:18 , en Jer 8:2 , en Jer 19:13 . Anderen houden het woord Gad in den tekst, en verstaan daardoor de een Jupiter, de ander Mars, andere de fortuin, anderen de zon, anderen de ganse bende der valse goden."},{"catchword":"gij opvullers","tekst":"Of, gij vermengers; gelijk Pro 23:30 ."},{"catchword":"voor dat getal","tekst":"Dat is, ter ere der sterren, die in groten getale zijn. Hebreeuws, lameni. Dit behouden sommigen in den tekst, afsof het de naam van enigen afgod ware. Anderen nemen het voor een zeker getal van sterren bij elkander, en zetten het over: voorzoveel als men tellen kan; te weten aan zoveel afgoden als men zou kunnen tellen; dat is aan een zeer groot getal. Sommigen verstaan door dit woord de maan."}],"12":[{"catchword":"Ik zal ulieden","tekst":"Of, welaan, Ik zal ulieden tellen, enz. Dit ziet op het woord getal, vs.11. De zin is: Welaan, dewijl gijlieden u verzondigt aan het getal, zo zal Ik u ook straffen met getal, en zovelen als Ik er aftel, zullen er met het zwaard omkomen."},{"catchword":"zult krommen,","tekst":"Dat is, gij zult moeten nederbukken en den hals uitstrekken voor degenen, die u doden zullen."},{"catchword":"geroepen heb,","tekst":"Te weten door den mond mijner profeten, door welken Ik u mijnen wil heb laten verkondigen. Vergelijk hiermede Pro 1:24 ; Jer 7:13 , Jer 7:27 ; Isa 66:4 , en Mat 23:34 ."}],"13":[{"catchword":"zullen eten . . . zullen drinken","tekst":"Versta hier door eten en drinken het genieten der goede gaven Gods. Zie Psa 36:9 ; zie ook Lev 26:10 ."}],"14":[{"catchword":"van goeder harte,","tekst":"Hebreeuws, van goedheid des harten; dat is van vrolijkheid. Zie Jdg 16:25 ."}],"15":[{"catchword":"tot een vervloeking","tekst":"Of, tot een eed. Dikwijls werden de eden gedaan met kwaadwensing, of met vervloeking. Num 5:21 staat, een eed der vervloeking, zie de aantekening aldaar. Het formulier van zulke eedvervloekingen was: de Heere stelle u als dezen of dien; gelijk te zien is Jer 29:22 ; dat is, op u moeten komen die plagen en vervloekingen, die op dezen of dien gevallen zijn door Gods rechtvaardig oordeel. Zie integendeel het formulier van zegening bij dezen of dien, Gen 48:20 ."},{"catchword":"ulieden doden,","tekst":"Dat is, een ieder onder ulieden."},{"catchword":"een anderen naam","tekst":"Dat is, zij zullen niet meer Israëlieten genoemd worden, maar Christenen, Act 11:26 . Zie Gen 32:28 ; ook betekent somtijds een nieuwe maan een nieuwen en beteren staat, gelijk Isa 62:2 ; zie de aantekening aldaar."}],"16":[{"catchword":"wie zich","tekst":"Dat is, wie zichzelven alles goeds, heil en welvaart zal toewensen; zie Deu 29:19 ."},{"catchword":"in den God . . . bij den God","tekst":"Dat is, in den waren, of in den gewissen God; anders: in den God Amen, of in den God van Amen, waarbij verstaan wordt onze Heere Jezus Christus, die de waarachtige God en het eeuwige leven is, 1Jo 5:20 ; en Hij wordt Amen genoemd Rev 3:14 , en in Hem zullen alle geslachten der aarde zichzelven zegenen; Gen 22:18 ."},{"catchword":"zweren zal op aarde,","tekst":"Zweren is een deel van godsdienst. Zie Psa 63:12 ."},{"catchword":"de vorige","tekst":"Dat is, zowel de ellenden, die mijn volk geleden heeft, als de oorzaken derzelve, te weten hunne zonden."}],"17":[{"catchword":"Ik schep","tekst":"Hebreeuws, Ik ben scheppende; dat is, Ik ben gereed om te scheppen; alzo ook vs.18. De zin is: Ik zal alles in Christus vernieuwen, of Ik zal den gehelen staat der kerk alzo vernieuwen en verbeteren, alsof ik een nieuwen hemel en een nieuwe aarde schiep. Dit is wel ten dele geschied in de eerste komst van Christus, door de predikatie van het heilig Evangelie en de werking van den Heiligen Geest, die den gelovigen van het Nieuwe Testament rijkelijk is medegedeeld geworden, maar het zal eerst volkomenlijk geschieden in de tweede toekomst des Heeren, als Hij zijne kerk in het hemelrijk opnemen zal; zie Isa 66:22 ; 2Pe 3:13 ; Rev 21:1 ."},{"catchword":"een nieuwe aarde;","tekst":"Dat is, de aardse heidenen zullen als nieuw gemaakt worden door de beroeping tot de kennis van het heilig Evangelie; zie Psa 97:1 , en Psa 98:3-4 ; Rev 21:2 ."},{"catchword":"in het hart","tekst":"Dat is, in gedachtenis; zie de aantekening Jer 3:16 , en Jer 7:31 ."}],"18":[{"catchword":"in hetgeen","tekst":"Of, [over] hetgeen Ik schep. Anders: verheugt u in der eeuwigheid, gijlieden die Ik nieuw schep; te weten in Christus Jezus. Zie Psa 102:19 ; Eph 2:10 ."},{"catchword":"Ik schep Jeruzalem","tekst":"Dat is, Ik zal mijne kerk en alle ledematen derzelve met eeuwige en hemelse vreugde vervullen, want hier wordt gesproken van het hemelse Jeruzalem."},{"catchword":"haar volk","tekst":"Te weten van het volk der stad Jeruzalem."}],"19":[{"catchword":"Ik zal Mij","tekst":"Zie Isa 62:5 ."},{"catchword":"over","tekst":"Dat is, vanwege. Vergelijk Deu 28:63 ."},{"catchword":"in haar","tekst":"In Jeruzalem, te weten in het hemelse Jeruzalem."},{"catchword":"de stem der wening,","tekst":"Want alle tranen zullen van hunne ogen afgewist worden. Zie Isa 25:8 , en Isa 30:19 ; Rev 7:17 , en Rev 21:4 ."}],"20":[{"catchword":"Van daar","tekst":"Of, daaruit; te weten van of uit Jeruzalem."},{"catchword":"een zuigeling","tekst":"Of, een zoogkind, gelijk Isa 49:15 . Hebreeuws, een zuigeling der dagen; dat is, een jong kind, of een kind dat een jaar oud zijnde sterft; want dagen betekent somtijds een jaar; gelijk 1Sa 2:19 , waar staat het offer der dagen voor het jaarlijkse offer."},{"catchword":"zijn dagen niet zal","tekst":"Te weten die dagen, die tot een gemenen ouderdom behoren."},{"catchword":"honderd jaren oud zijnde, maar een zondaar,","tekst":"hebreeuws, een honderd jaars zoon, of een zoon van honderd jaar. Zie de aantekening Gen 5:32 . Alzo straks, een zondaar een zoon van honderd jaar. Wat nu den zin van Isa 65:20 aangaat, die is geestelijk en schijnt deze te zijn: Die eeuw zal veel anders zijn dan nu; heden ten dage sterven er velen, nog kinderen zijnde; anderen wel enigermate oud zijnde, hetzij zestig of zeventig jaren, maar weinigen die hun vollen ouderdom beleven en tot hunne honderd jaren komen; maar alsdan zal het met den enen gaan als met den anderen, met de jongelingen als met de ouden, zij allen zullen hunne dagen vervullen. Dit bevestigt hij aldus: Want een jongeling honderd jaren oud zijnde, zal sterven; dat is, een kind zal geen kind sterven, maar het zal den vollen tijd van zijn leven vervullen; maar een zondaar van honderd jaren zal vervloekt worden; dat is, een kind zal in het rijk van Christus een gelukzalige volmaaktheid des levens verkrijgen; maar in het rijk der wereld zal een zondaar, als hij zal schijnen tot de volmaaktheid des levens gekomen te zijn, vervloekt wezen. Anderen nemen het en verklaren het aldus: Vandaar zal het niet meer wezen een zuigeling [of kindje] van dagen, noch een oud man, wiens dagen niet zullen vervuld worden; maar een zondaar van honderd jaren zal vervloekt zijn; dat is, hoe langer hij leven zal, hoe meer hij aan den vloek zal onderworpen zijn."}],"21":[{"catchword":"zij","tekst":"Te weten mijne knechten, vs.13."},{"catchword":"zullen huizen","tekst":"Dat is, zij zullen met allerlei zegen Gods verheugd worden. Vergelijk Deu 28:3 , enz., en Lev 26:4 tot Lev 26:13 . Doch onder den tijdelijken zegen, dien God in de wet belooft, moet men hier en elders den geestelijken en eeuwigen zegen verstaan."}],"22":[{"catchword":"Zij zullen niet bouwen,","tekst":"Dit vs. geeft te kennen dat zij van die vloeken, die de wet den ongehoorzamen dreigt, Deu 28:30 , zullen bevrijd zijn."},{"catchword":"als de dagen eens booms,","tekst":"Dat is, stijf, vast, bestendig; zie Psa 52:10 , en Psa 92:13 ."},{"catchword":"verslijten","tekst":"Of, oud maken, of bestendig maken; dat is, zij zullen het lang genieten, dewijl zij lang zullen leven."}],"23":[{"catchword":"tevergeefs","tekst":"Of, tot ijdelheid. Zie Lev 26:16 tot Lev 26:20 ."},{"catchword":"ter verstoring;","tekst":"Alzo namelijk, dat hunne kinderen van de vijanden zouden omgebracht of gevankelijk weggevoerd worden. Zie Deu 28:32 , tot Deu 28:41 ."},{"catchword":"want zij zijn","tekst":"Of, maar zij zullen zijn."},{"catchword":"het zaad","tekst":"Dat is, de kinderen."},{"catchword":"hun nakomelingen met hen","tekst":"Dat is, hunne kindskinderen. Zie Isa 44:3 ."}],"24":[{"catchword":"eer zij roepen,","tekst":"Want God weet wat wij van node hebben eer wij bidden; Mat 6:8 . Zie Psa 145:18 , en zie een exempel Gen 24:15 ."}],"25":[{"catchword":"De wolf","tekst":"Dat is, de wrede boze mensen zullen veranderen en als kleine kinderen worden; zie Isa 11:6-9 , en Mat 18:3 ."},{"catchword":"te zamen weiden,","tekst":"Hebreeuws, als een."},{"catchword":"de leeuw","tekst":"Het Hebreeuwse woord betekent eigenlijk een verscheurenden leeuw."},{"catchword":"stof zal","tekst":"De zin is: De slang zal in hare holen verborgen blijven en zal niemand schade zoeken te doen, maar zal tevreden zijn met stof te eten, gelijk God haar verordineerd heeft; Gen 3:14 ."},{"catchword":"spijze","tekst":"Hebreeuws, haar brood."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"I am found [Heb, properly sought. Understanding with all and found, as it is said Rom 10:20. etc. this phrase; to wit, seeking for seeking and finding, Ecc 3:6 and compare Gen.12 on ver.15] of them, that asked not (for me) Heb, that asked not. This the Lord speaketh: and it is a prophesy concerning the calling of the Gentiles, and the rejection of the Jews] i am found of them that sought me not: [that is, of the Gentiles. That was aliens from the common-wealth of Israel. Ephe.2.62.] i said unto a nation that was not called by my name, [Understand here also the Gentiles that were in times past were not called the people of God. See Rom 9:24,25,26. [Behold, (here) am i, behold, (here) am i, [that is, i offer myself for your good: to wit, in and by the preaching of the gospel]"}],"2":[{"catchword":null,"tekst":"I have spread out mine hand all the day unto a rebellion people, [that is, i have caused the Jews to be continually called and instructed by the preaching of the prophets, and afterward by the Apostles, but they laid it not to heart. When the scripture saith that men spread forth or stretch out their hands, it signifieth praying, as Exo 9:29 and 1 Kings 8.22. see the Annotat. There. But when it is said, that God spreadeth forth his hands, it signifieth preaching as, as here and Prov. 1.24. see the Annotat. There (unto a rebellious) see Above chap. 1 on verse 23. The Apostle Paul following the Greek interpreter rendereth it unto a disobedient and gain-saying people, and he saith that this is spoken to Israel, Rom 10:21.] which walk in a way that is not good, [As Psal. 36.5. the word way is used sometimes in Scripture for religion, as Acts chap. 18. Ver. 25, 26. And chap.22 ver.4.] after their (own) thoughts. [it is said, Psal. 94.11. that the thoughts of a man are vanity itself. See like Psal.81.13.]"}],"3":[{"catchword":null,"tekst":"A people provoking me continually [to wit, by their idolatry and abomination. See 32.16 to my face: [that is, openly, boldly, impudently, contrary to Gods commandment Exod. 20.3. see above chap. 1 verse 11.] offering in gardens, [to wit, under green trees, after the manner of idolaters. See above chap. 1.29. and above chap. 66.17.] and burning incense upon bricks, [that is, upon idolatrous, alters, that were made of bricks, despising God&acirc;&euro;&trade;s golden alert which Solomon had caused to be made, 1 kings 7.48.]"}],"4":[{"catchword":null,"tekst":"Sitting by the graves [to enquire of the dead for the living, above chap.8.19 which abomination in the fight of God. Deut. 18.11,12. Above chap.2.6 and 8.19.] thy overnight with them that are kept, [that is according to the opinion of some among the Idols or images of false Gods, which kept and protected nothing, but were to be kept and watched left they should be stolen; but other understand it of dead bodies, which those that had skill in the magic art, were wont to keep and to tarry with them in the night time, to ask counsel of them. Others, they overnight in the desert places, or in mountains] eating swines flesh, [against the express command of God to the contrary, (as being an unclean thing) Levit.11.17. Deut.14.8] and there is broth of the flesh of beasts that were forbidden, which were an abomination unto the Lord, when a man did eat them. Others, pieces of unclean, or stinking, or rotten (flesh) is in their vessels. See the annotate. Levit. 7.18. but under the above recited abominations must here be understood all manner of transgressions against the law of God]"}],"5":[{"catchword":null,"tekst":"Which say, [To wit, to the prophet, that goeth about to reprove them, and to exhort them to repentance] keep thee to thy self and come not near to me, [that is, tarry away from me come not near me: trouble thy self] for i function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;

    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

document.addEventListener('click', e => {

  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,

// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');

}

  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
