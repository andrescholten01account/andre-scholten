:"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Wee Ariël, Ariël! De stad waarin David gelegerd heeft; doe jaar bij jaar; laat ze feestoffers slachten.","2":"Toch zal Ik Ariël in het nauw brengen, en er zal treuring en droefheid zijn, en die stad zal Mij gelijk Ariël zijn.","3":"Want Ik zal een leger in het rond om u opslaan, en Ik zal u belegeren met bolwerken, en Ik zal vestingen tegen u opwerpen.","4":"Dan zult u vernederd worden, u zult uit de aarde spreken, en uw spraak zal uit het stof zachtjes voortkomen; en uw stem zal zijn uit de aarde als van een tovenaar, en uw spraak zal uit het stof piepen.","5":"En de menigte van uw vreemde soldaten zal zijn als dun stof, en de menigte van de tirannen als voorbijvliegend kaf; en het zal in een ogenblik snel gebeuren.","6":"U zult van de HEERE van de heerscharen[1] bezocht worden met donder, en met aardbeving, en groot geluid, met wervelwind, en onweer, en de vlam van een verterend vuur.","7":"En zoals de droom van een nachtgezicht is, zo zal de veelheid van alle heidenvolken zijn die tegen Ariël strijden zullen; zelfs allen die tegen haar en haar vestingen strijden, en haar in het nauw zullen brengen.","8":"Het zal zo zijn, zoals wanneer een hongerige droomt, en zie, hij eet; maar als hij wakker wordt, is zijn ziel leeg; of, zoals wanneer een dorstige droomt, en zie, hij drinkt; maar als hij wakker wordt, zie, dan is hij nog mat, en zijn ziel is begerig; zo zal de menigte van alle heidenvolken zijn die tegen de berg Sion strijden.","9":"Zij talmen, verwonder u dus; zij zijn vrolijk, roep dus uit; zij zijn dronken, maar niet van wijn; zij waggelen, maar niet van sterke drank.","10":"Want de HEERE heeft over u uitgegoten een geest van diepe slaap, en Hij heeft uw ogen dichtgesloten; de profeten, en uw hoofden, en de zieners heeft Hij verblind.","11":"Daarom is voor u elk visioen geworden als de woorden van een verzegeld boek, dat men geeft aan iemand die lezen kan, en zegt: Lees toch dit; en hij zegt: Ik kan niet, want het is verzegeld.","12":"Of men geeft het boek aan iemand die niet lezen kan, en zegt: Lees toch dit; en hij zegt: Ik kan niet lezen.","13":"Want de Heere heeft gezegd: Omdat dit volk tot Mij nadert met zijn mond, en zij Mij met hun lippen eren, maar hun hart ver van Mij houden; en hun vrees, waarmee zij Mij vrezen, mensengeboden zijn, die hun geleerd zijn;","14":"daarom, zie, Ik zal verder wonderlijk handelen met dit volk, wonderlijk en wonderbaarlijk; want de wijsheid van zijn wijzen zal vergaan, en het verstand van zijn verstandigen zal zich verbergen.","15":"Wee hun die zich diep willen verbergen voor de HEERE, hun raad verbergend; en wier werken in duisternis gebeuren, en zij zeggen: Wie ziet ons, en wie kent ons?","16":"Uw omkeren van de dingen is, alsof de pottenbakker geacht werd als leem, dat het maaksel zei van zijn maker: Hij heeft mij niet gemaakt; en het gevormde vat zei van zijn pottenbakker: Hij begrijpt het niet.","17":"Is het niet nog een klein weinig, dat de Libanon in een vruchtbaar veld veranderd zal worden, en het vruchtbare veld voor een woud geacht zal worden?","18":"En op die dag zullen de doven de woorden van het boek horen; en de ogen van de blinden, die uit de donkerheid en uit de duisternis zijn, zullen zien.","19":"En de zachtmoedigen zullen vreugde op vreugde hebben in de HEERE; en de behoeftigen onder de mensen zullen zich in de Heilige van Israël verheugen.","20":"Wanneer de tiran een einde zal hebben, en het met de spotter voorbij zal zijn, en allen die op ongerechtigheid loeren, uitgeroeid zullen zijn;","21":"die een mens schuldig maken om een woord, en die strikken leggen voor hem die bestraft in de poort; en die de rechtvaardige verdrijven met valse argumenten.","22":"Daarom zegt de HEERE, Die Abraham verlost heeft, zo tot het huis van Jakob: Jakob zal nu niet meer beschaamd worden, en nu zal zijn gezicht niet meer bleek worden;","23":"want wanneer hij zijn kinderen, het werk van Mijn handen, zal zien in zijn midden, zullen zij Mijn Naam heiligen; en zij zullen de Heilige van Jakob heiligen, en de God van Israël vrezen.","24":"En zij die dwalend van geest zijn, zullen tot verstand komen, en de mopperaars zullen de lering aannemen."},"SV":{"1":"Wee Ariël, Ariël! de stad, *waarin* David gelegerd heeft; doet jaar tot jaar; laat ze feestofferen slachten.","2":"Evenwel zal Ik Ariël beangstigen, en er zal treuring en droefheid wezen, en *die* *stad* zal Mij gelijk Ariël zijn.","3":"Want Ik zal een leger in het rond om u slaan, en Ik zal u belegeren met bolwerken, en Ik zal vestingen tegen u opwerpen.","4":"Dan zult gij vernederd worden, gij zult uit de aarde spreken, en uw spraak zal uit het stof zachtjes voortkomen; en uw stem zal zijn uit de aarde als van een tovenaar, en uw spraak zal uit het stof piepen.","5":"En de menigte uwer vreemde *soldaten* zal zijn gelijk dun stof, en de menigte der tirannen als voorbijvliegend kaf; en het zal in een ogenblik haastelijk geschieden.","6":"Gij zult van den HEERE der heirscharen bezocht worden met donder, en met aardbeving, en groot geluid, *met* wervelwind, en onweder, en de vlam eens verterenden vuurs.","7":"En gelijk de droom van een nachtgezicht is, *alzo* zal de veelheid aller heidenen zijn, die tegen Ariël strijden zullen; zelfs allen, die tegen haar en haar vestingen strijden, en haar beangstigen zullen.","8":"Het zal alzo zijn, gelijk wanneer een hongerige droomt, en ziet, hij eet; maar als hij ontwaakt, zo is zijn ziel ledig; of, gelijk als wanneer een dorstige droomt, en ziet, hij drinkt; maar als hij ontwaakt, ziet, zo is hij nog mat, en zijn ziel is begerig; alzo zal de menigte aller heidenen zijn, die tegen den berg Sion krijgen.","9":"Zij vertoeven, daarom verwondert u; zij zijn vrolijk, derhalve roept gijlieden; zij zijn dronken, maar niet van wijn; zij waggelen, maar niet van sterken drank.","10":"Want de HEERE heeft over ulieden uitgegoten een geest des diepen slaaps, en Hij heeft uw ogen toegesloten; de profeten, en uw hoofden, *en* de zieners heeft Hij verblind.","11":"Daarom is ulieden alle gezicht geworden als de woorden van een verzegeld boek, hetwelk men geeft aan een, die lezen kan, zeggende: Lees toch dit; en hij zegt: Ik kan niet, want het is verzegeld.","12":"Of men geeft het boek aan een, die niet lezen kan, zeggende: Lees toch dit; en hij zegt: Ik kan niet lezen.","13":"Want de Heere heeft gezegd: Daarom dat dit volk *tot* *Mij* nadert met zijn mond, en zij Mij met hun lippen eren, doch hun hart verre van Mij doen; en hun vreze, *waarmede* *zij* Mij *vrezen*, mensengeboden zijn, die hun geleerd zijn;","14":"Daarom, ziet, Ik zal voorts wonderlijk handelen met dit volk, wonderlijk en wonderbaarlijk; want de wijsheid zijner wijzen zal vergaan, en het verstand zijner verstandigen zal zich verbergen.","15":"Wee dengenen, die zich diep versteken willen voor den HEERE, *hun* raad verbergende; en welker werken in duisterheid geschieden, en zij zeggen: Wie ziet ons, en wie kent ons?","16":"Ulieder omkeren is, alsof de pottenbakker geacht werd als leem, dat het maaksel zeide van zijn maker: Hij heeft mij niet gemaakt; en het geformeerde vat van zijn pottenbakker zeide: Hij verstaat het niet.","17":"Is het niet nog om een klein weinig, dat de Libanon in een vruchtbaar veld zal veranderd worden, en het vruchtbare veld voor een woud geacht zal worden?","18":"En te dien dage zullen de doven horen de woorden des Boeks; en de ogen der blinden, zijnde uit de donkerheid en uit de duisternis, zullen zien.","19":"En de zachtmoedigen zullen vreugde op vreugde hebben in den HEERE; en de behoeftigen onder de mensen zullen zich in den Heilige Israëls verheugen.","20":"Wanneer de tiran een einde zal hebben, en dat het met den bespotter uit zal zijn, en dat allen, die tot ongerechtigheid waken, uitgeroeid zullen zijn;","21":"Die een mens schuldig maken om een woord, en leggen dien strikken, die *hen* bestraft in de poort; en die den rechtvaardige verdrijven in het woeste.","22":"Daarom zegt de HEERE, Die Abraham verlost heeft, tot het huis van Jakob alzo: Jakob zal nu niet *meer* beschaamd worden, en nu zal zijn aangezicht niet *meer* bleek worden;","23":"Want als hij zijn kinderen, het werk Mijner handen, zien zal in het midden van hen, zullen zij Mijn Naam heiligen; en zij zullen den Heilige Jakobs heiligen, en den God van Israël vrezen.","24":"En die dwalende van geest zijn, zullen tot verstand komen, en de murmureerders zullen de lering aannemen."},"KJV":{"1":"Woe to Ariel, to Ariel, the city *where* David dwelt! add ye year to year; let them kill sacrifices.","2":"Yet I will distress Ariel, and there shall be heaviness and sorrow: and it shall be unto me as Ariel.","3":"And I will camp against thee round about, and will lay siege against thee with a mount, and I will raise forts","4":"And thou shalt be brought down, *and* shalt speak out of the ground, and thy speech shall be low out of the dust, and thy voice shall be, as of one that hath a familiar spirit, out of the ground, and thy speech shall whisper out of the dust.","5":"Moreover the multitude of thy strangers shall be like small dust, and the multitude of the terrible ones *shall be* as chaff that passeth away: yea, it shall be at an instant suddenly.","6":"Thou shalt be visited of the LORD of hosts with thunder, and with earthquake, and great noise, with storm and tempest, and the flame of devouring fire.","7":"And the multitude of all the nations that fight against Ariel, even all that fight against her and her munition, and that distress her, shall be as a dream of a night vision.","8":"It shall even be as when an hungry *man* dreameth, and, behold, he eateth; but he awaketh, and his soul is empty: or as when a thirsty man dreameth, and, behold, he drinketh; but he awaketh, and, behold, *he is* faint, and his soul hath appetite: so shall the multitude of all the nations be, that fight against mount Zion.","9":"Stay yourselves, and wonder; cry ye out, and cry: they are drunken, but not with wine; they stagger, but not with strong drink.","10":"For the LORD hath poured out upon you the spirit of deep sleep, and hath closed your eyes: the prophets and your rulers, the seers hath he covered.","11":"And the vision of all is become unto you as the words of a book that is sealed, which *men* deliver to one that is learned, saying, Read this, I pray thee: and he saith, I cannot; for it *is* sealed:","12":"And the book is delivered to him that is not learned, saying, Read this, I pray thee: and he saith, I am not learned.","13":"Wherefore the Lord said, Forasmuch as this people draw near *me* with their mouth, and with their lips do honour me, but have removed their heart far from me, and their fear toward me is taught by the precept of men:","14":"Therefore, behold, I will proceed to do a marvellous work among this people, *even* a marvellous work and a wonder: for the wisdom of their wise *men* shall perish, and the understanding of their prudent *men* shall be hid.","15":"Woe unto them that seek deep to hide their counsel from the LORD, and their works are in the dark, and they say, Who seeth us? and who knoweth","16":"Surely your turning of things upside down shall be esteemed as the potter's clay: for shall the work say of him that made it, He made me not? or shall the thing framed say of him that framed it, He had no understanding?","17":"*Is* it not yet a very little while, and Lebanon shall be turned into a fruitful field, and the fruitful field shall be esteemed as a forest?","18":"And in that day shall the deaf hear the words of the book, and the eyes of the blind shall see out of obscurity, and out of darkness.","19":"The meek also shall increase *their* joy in the LORD, and the poor among men shall rejoice in the Holy One of Israel.","20":"For the terrible one is brought to nought, and the scorner is consumed, and all that watch for iniquity are cut off:","21":"That make a man an offender for a word, and lay a snare for him that reproveth in the gate, and turn aside the just for a thing of nought.","22":"Therefore thus saith the LORD, who redeemed Abraham, concerning the house of Jacob, Jacob shall not now be ashamed, neither shall his face now wax pale.","23":"But when he seeth his children, the work of mine hands, in the midst of him, they shall sanctify my name, and sanctify the Holy One of Jacob, and shall fear the God of Israel.","24":"They also that erred in spirit shall come to understanding, and they that murmured shall learn doctrine."}},"tsk":{"1":[{"kopje":"Wee","refs":["Jes 31:9","Ezech 43:15","Ezech 43:16"]},{"kopje":"de stad","refs":["2 Sam 5:9"]},{"kopje":"doe","refs":["Jes 1:11-15","Jer 7:21","Hos 5:6","Hos 8:13","Hos 9:4","Amos 4:4","Amos 4:5","Hebr 10:1"]},{"kopje":"slachten","refs":["Jes 66:3","Micha 6:6","Micha 6:7"]}],"2":[{"kopje":"Ik","refs":["Jes 5:25-30","Jes 10:5","Jes 10:6","Jes 10:32","Jes 17:14","Jes 24:1-12","Jes 33:7-9","Jes 36:22","Jes 37:3","Jer 32:28-32","Jer 39:4","Jer 39:5"]},{"kopje":"en er zal zijn","refs":["Ezech 43:15","Jes 34:6","Ezech 22:31","Ezech 24:3-13","Ezech 39:17","Zef 1:7","Zef 1:8","Openb 19:17","Openb 19:18"]}],"4":[{"kopje":"zult","refs":["Jes 2:11-21","Jes 3:8","Jes 51:23","Ps 44:26","Klaagl 1:9"]},{"kopje":"zachtjes voortkomen","refs":["Jes 8:19"]}],"5":[{"kopje":"de menigte","refs":["Jes 10:16-19","Jes 25:5","Jes 31:3","Jes 31:8","Jes 37:36"]},{"kopje":"als voorbijvliegend kaf","refs":["Jes 17:13","Job 21:18","Ps 1:4","Ps 35:5"]},{"kopje":"in een ogenblik","refs":["Jes 30:13","Ps 46:6","Ps 46:7","Ps 76:6","Ps 76:7","1 Tess 5:3"]}],"7":[{"kopje":"de veelheid","refs":["Jes 37:36","Jes 41:11","Jes 41:12","Jer 25:31-33","Jer 51 wl\" data-l=\"L8\" data-code=\"H6918\">zullen</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H6918\">de</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H6918\">Heilige</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H6918\">van</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H3290\">Jakob</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H6942\">heiligen</span>, <span class=\"wl\" data-l=\"L10\" data-code=\"H430\">en</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H430\">de</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H430\">God</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H430\">van</span> <span class=\"wl\" data-l=\"L11\" data-code=\"H3478\">Israël</span> <span class=\"wl\" data-l=\"L12\" data-code=\"H6206\">vrezen</span>.","24":"<span class=\"wl\" data-l=\"L1\" data-code=\"H8582\">En</span> zij <span class=\"wl\" data-l=\"L1\" data-code=\"H8582\">die</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H8582\">dwalend</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H8582\">van</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H7307\">geest</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H7307\">zijn</span>, <span class=\"wl\" data-l=\"L3\" data-code=\"H998\">zullen</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H998\">tot</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H998\">verstand</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H3045\">komen</span>, <span class=\"wl\" data-l=\"L5\" data-code=\"H7279\">en</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H7279\">de</span> mopperaars <span class=\"wl\" data-l=\"L6\" data-code=\"H3948\">zullen</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H3948\">de</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H3948\">lering</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H3925\">aannemen</span>."},"koppeling_kjv":{"1":"<span class=\"wl wl-kjv\" data-code=\"H1945\">Woe</span> to <span class=\"wl wl-kjv\" data-code=\"H740\">Ariel,</span> to <span class=\"wl wl-kjv\" data-code=\"H740\">Ariel,</span> the <span class=\"wl wl-kjv\" data-code=\"H7151\">city</span> where <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H2583\">dwelt!</span> <span class=\"wl wl-kjv\" data-code=\"H5595\">add</span> ye <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> to <span class=\"wl wl-kjv\" data-code=\"H8141\">year;</span> let them <span class=\"wl wl-kjv\" data-code=\"H5362\">kill</span> sacrifices.","2":"Yet I will <span class=\"wl wl-kjv\" data-code=\"H6693\">distress</span> <span class=\"wl wl-kjv\" data-code=\"H740\">Ariel,</span> and there shall be <span class=\"wl wl-kjv\" data-code=\"H8386\">heaviness</span> and <span class=\"wl wl-kjv\" data-code=\"H592\">sorrow:</span> and it shall be unto me as Ariel.","3":"And I will <span class=\"wl wl-kjv\" data-code=\"H2583\">camp</span> against thee round <span class=\"wl wl-kjv\" data-code=\"H1754\">about,</span> and will lay <span class=\"wl wl-kjv\" data-code=\"H6696\">siege</span> against thee with a <span class=\"wl wl-kjv\" data-code=\"H4674\">mount,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H6965\">raise</span> forts","4":"And thou shalt be brought <span class=\"wl wl-kjv\" data-code=\"H8213\">down,</span> and shalt <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">ground,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H565\">speech</span> shall be <span class=\"wl wl-kjv\" data-code=\"H7817\">low</span> out of the <span class=\"wl wl-kjv\" data-code=\"H6083\">dust,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> shall be, as of one that hath a familiar <span class=\"wl wl-kjv\" data-code=\"H178\">spirit,</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">ground,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H565\">speech</span> shall <span class=\"wl wl-kjv\" data-code=\"H6850\">whisper</span> out of the dust.","5":"Moreover the <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude</span> of thy <span class=\"wl wl-kjv\" data-code=\"H2114\">strangers</span> shall be like <span class=\"wl wl-kjv\" data-code=\"H1851\">small</span> <span class=\"wl wl-kjv\" data-code=\"H80\">dust,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude</span> of the terrible <span class=\"wl wl-kjv\" data-code=\"H6184\">ones</span> shall be as <span class=\"wl wl-kjv\" data-code=\"H4671\">chaff</span> that passeth <span class=\"wl wl-kjv\" data-code=\"H5674\">away:</span> yea, it shall be at an <span class=\"wl wl-kjv\" data-code=\"H6621\">instant</span> suddenly.","6":"Thou shalt be <span class=\"wl wl-kjv\" data-code=\"H6485\">visited</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts</span> with <span class=\"wl wl-kjv\" data-code=\"H7482\">thunder,</span> and with <span class=\"wl wl-kjv\" data-code=\"H7494\">earthquake,</span> and <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H6963\">noise,</span> with <span class=\"wl wl-kjv\" data-code=\"H5492\">storm</span> and <span class=\"wl wl-kjv\" data-code=\"H5591\">tempest,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3851\">flame</span> of <span class=\"wl wl-kjv\" data-code=\"H398\">devouring</span> fire.","7":"And the <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude</span> of all the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> that <span class=\"wl wl-kjv\" data-code=\"H6633\">fight</span> against <span class=\"wl wl-kjv\" data-code=\"H740\">Ariel,</span> even all that <span class=\"wl wl-kjv\" data-code=\"H6638\">fight</span> against her and her <span class=\"wl wl-kjv\" data-code=\"H4685\">munition,</span> and that <span class=\"wl wl-kjv\" data-code=\"H6693\">distress</span> her, shall be as a <span class=\"wl wl-kjv\" data-code=\"H2472\">dream</span> of a <span class=\"wl wl-kjv\" data-code=\"H3915\">night</span> vision.","8":"It shall even be as when an <span class=\"wl wl-kjv\" data-code=\"H7457\">hungry</span> man <span class=\"wl wl-kjv\" data-code=\"H2492\">dreameth,</span> and, behold, he <span class=\"wl wl-kjv\" data-code=\"H398\">eateth;</span> but he <span class=\"wl wl-kjv\" data-code=\"H6974\">awaketh,</span> and his <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> is <span class=\"wl wl-kjv\" data-code=\"H7386\">empty:</span> or as <span class=\"wl wl-kjv\" data-code=\"H834\">when</span> a thirsty <span class=\"wl wl-kjv\" data-code=\"H6771\">man</span> <span class=\"wl wl-kjv\" data-code=\"H2492\">dreameth,</span> and, behold, he <span class=\"wl wl-kjv\" data-code=\"H8354\">drinketh;</span> but he <span class=\"wl wl-kjv\" data-code=\"H6974\">awaketh,</span> and, behold, he is <span class=\"wl wl-kjv\" data-code=\"H5889\">faint,</span> and his <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> hath <span class=\"wl wl-kjv\" data-code=\"H8264\">appetite:</span> so shall the <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude</span> of all the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> be, that <span class=\"wl wl-kjv\" data-code=\"H6633\">fight</span> against <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> Zion.","9":"<span class=\"wl wl-kjv\" data-code=\"H4102\">Stay</span> yourselves, and <span class=\"wl wl-kjv\" data-code=\"H8539\">wonder;</span> cry ye <span class=\"wl wl-kjv\" data-code=\"H8173\">out,</span> and <span class=\"wl wl-kjv\" data-code=\"H8173\">cry:</span> they are <span class=\"wl wl-kjv\" data-code=\"H7937\">drunken,</span> but not with <span class=\"wl wl-kjv\" data-code=\"H3196\">wine;</span> they <span class=\"wl wl-kjv\" data-code=\"H5128\">stagger,</span> but not with strong drink.","10":"For the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath poured <span class=\"wl wl-kjv\" data-code=\"H5258\">out</span> upon you the <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> of deep <span class=\"wl wl-kjv\" data-code=\"H8639\">sleep,</span> and hath <span class=\"wl wl-kjv\" data-code=\"H6105\">closed</span> your <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes:</span> the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> and your <span class=\"wl wl-kjv\" data-code=\"H7218\">rulers,</span> the <span class=\"wl wl-kjv\" data-code=\"H2374\">seers</span> hath he covered.","11":"And the <span class=\"wl wl-kjv\" data-code=\"H2380\">vision</span> of all is become unto you as the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of a <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> that is <span class=\"wl wl-kjv\" data-code=\"H2856\">sealed,</span> which men <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> to one that is <span class=\"wl wl-kjv\" data-code=\"H3045\">learned,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">Read</span> this, I pray thee: and he <span class=\"wl wl-kjv\" data-code=\"H559\">saith,</span> I <span class=\"wl wl-kjv\" data-code=\"H3201\">cannot;</span> for it is sealed:","12":"And the <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> is <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> to him that is not <span class=\"wl wl-kjv\" data-code=\"H3045\">learned,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">Read</span> this, I pray thee: and he <span class=\"wl wl-kjv\" data-code=\"H559\">saith,</span> I am not learned.","13":"Wherefore the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H3282\">Forasmuch</span> as this <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> draw <span class=\"wl wl-kjv\" data-code=\"H5066\">near</span> me with their <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> and with their <span class=\"wl wl-kjv\" data-code=\"H8193\">lips</span> do <span class=\"wl wl-kjv\" data-code=\"H3513\">honour</span> me, but have <span class=\"wl wl-kjv\" data-code=\"H7368\">removed</span> their <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> <span class=\"wl wl-kjv\" data-code=\"H7368\">far</span> from me, and their <span class=\"wl wl-kjv\" data-code=\"H3374\">fear</span> toward me is <span class=\"wl wl-kjv\" data-code=\"H3925\">taught</span> by the <span class=\"wl wl-kjv\" data-code=\"H4687\">precept</span> of men:","14":"Therefore, behold, I will <span class=\"wl wl-kjv\" data-code=\"H3254\">proceed</span> to do a marvellous <span class=\"wl wl-kjv\" data-code=\"H6381\">work</span> among this <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> even a marvellous <span class=\"wl wl-kjv\" data-code=\"H6381\">work</span> and a <span class=\"wl wl-kjv\" data-code=\"H6382\">wonder:</span> for the <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom</span> of their <span class=\"wl wl-kjv\" data-code=\"H2450\">wise</span> men shall <span class=\"wl wl-kjv\" data-code=\"H6\">perish,</span> and the <span class=\"wl wl-kjv\" data-code=\"H998\">understanding</span> of their <span class=\"wl wl-kjv\" data-code=\"H995\">prudent</span> men shall be hid.","15":"<span class=\"wl wl-kjv\" data-code=\"H1945\">Woe</span> unto them that seek <span class=\"wl wl-kjv\" data-code=\"H6009\">deep</span> to <span class=\"wl wl-kjv\" data-code=\"H5641\">hide</span> their <span class=\"wl wl-kjv\" data-code=\"H6098\">counsel</span> from the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and their <span class=\"wl wl-kjv\" data-code=\"H4639\">works</span> are in the <span class=\"wl wl-kjv\" data-code=\"H4285\">dark,</span> and they <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Who <span class=\"wl wl-kjv\" data-code=\"H7200\">seeth</span> us? and who knoweth","16":"Surely your turning of things upside <span class=\"wl wl-kjv\" data-code=\"H2017\">down</span> shall be <span class=\"wl wl-kjv\" data-code=\"H2803\">esteemed</span> as the <span class=\"wl wl-kjv\" data-code=\"H3335\">potter's</span> <span class=\"wl wl-kjv\" data-code=\"H2563\">clay:</span> for shall the <span class=\"wl wl-kjv\" data-code=\"H4639\">work</span> <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> of him that <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> it, He <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> me not? or shall the thing <span class=\"wl wl-kjv\" data-code=\"H3336\">framed</span> <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> of him that <span class=\"wl wl-kjv\" data-code=\"H3335\">framed</span> it, He had no understanding?","17":"Is it not yet a <span class=\"wl wl-kjv\" data-code=\"H4213\">very</span> little <span class=\"wl wl-kjv\" data-code=\"H4592\">while,</span> and <span class=\"wl wl-kjv\" data-code=\"H3844\">Lebanon</span> shall be <span class=\"wl wl-kjv\" data-code=\"H7725\">turned</span> into a fruitful <span class=\"wl wl-kjv\" data-code=\"H3759\">field,</span> and the fruitful <span class=\"wl wl-kjv\" data-code=\"H3759\">field</span> shall be <span class=\"wl wl-kjv\" data-code=\"H2803\">esteemed</span> as a forest?","18":"And in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> shall the <span class=\"wl wl-kjv\" data-code=\"H2795\">deaf</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of the <span class=\"wl wl-kjv\" data-code=\"H5612\">book,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> of the <span class=\"wl wl-kjv\" data-code=\"H5787\">blind</span> shall <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> out of <span class=\"wl wl-kjv\" data-code=\"H652\">obscurity,</span> and out of darkness.","19":"The <span class=\"wl wl-kjv\" data-code=\"H6035\">meek</span> also shall <span class=\"wl wl-kjv\" data-code=\"H3254\">increase</span> their <span class=\"wl wl-kjv\" data-code=\"H8057\">joy</span> in the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and the <span class=\"wl wl-kjv\" data-code=\"H34\">poor</span> among <span class=\"wl wl-kjv\" data-code=\"H120\">men</span> shall <span class=\"wl wl-kjv\" data-code=\"H1523\">rejoice</span> in the Holy <span class=\"wl wl-kjv\" data-code=\"H6918\">One</span> of Israel.","20":"For the terrible <span class=\"wl wl-kjv\" data-code=\"H6184\">one</span> is brought to <span class=\"wl wl-kjv\" data-code=\"H656\">nought,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3887\">scorner</span> is <span class=\"wl wl-kjv\" data-code=\"H3615\">consumed,</span> and all that <span class=\"wl wl-kjv\" data-code=\"H8245\">watch</span> for <span class=\"wl wl-kjv\" data-code=\"H205\">iniquity</span> are cut off:","21":"That make a <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> an <span class=\"wl wl-kjv\" data-code=\"H2398\">offender</span> for a <span class=\"wl wl-kjv\" data-code=\"H1697\">word,</span> and lay a <span class=\"wl wl-kjv\" data-code=\"H6983\">snare</span> for him that <span class=\"wl wl-kjv\" data-code=\"H3198\">reproveth</span> in the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate,</span> and turn <span class=\"wl wl-kjv\" data-code=\"H5186\">aside</span> the <span class=\"wl wl-kjv\" data-code=\"H6662\">just</span> for a thing of nought.","22":"Therefore thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> who <span class=\"wl wl-kjv\" data-code=\"H6299\">redeemed</span> <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham,</span> concerning the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> shall not now be <span class=\"wl wl-kjv\" data-code=\"H954\">ashamed,</span> neither shall his <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> now wax pale.","23":"But when he <span class=\"wl wl-kjv\" data-code=\"H7200\">seeth</span> his <span class=\"wl wl-kjv\" data-code=\"H3206\">children,</span> the <span class=\"wl wl-kjv\" data-code=\"H4639\">work</span> of mine <span class=\"wl wl-kjv\" data-code=\"H3027\">hands,</span> in the <span class=\"wl wl-kjv\" data-code=\"H7130\">midst</span> of him, they shall <span class=\"wl wl-kjv\" data-code=\"H6942\">sanctify</span> my <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> and <span class=\"wl wl-kjv\" data-code=\"H6942\">sanctify</span> the Holy <span class=\"wl wl-kjv\" data-code=\"H6918\">One</span> of <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H6206\">fear</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of Israel.","24":"They also that <span class=\"wl wl-kjv\" data-code=\"H8582\">erred</span> in <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> shall <span class=\"wl wl-kjv\" data-code=\"H3045\">come</span> to <span class=\"wl wl-kjv\" data-code=\"H998\">understanding,</span> and they that <span class=\"wl wl-kjv\" data-code=\"H7279\">murmured</span> shall <span class=\"wl wl-kjv\" data-code=\"H3925\">learn</span> doctrine."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Ariël,","tekst":"Ariël betekent zoveel als een sterke leeuw, of een leeuw van God, gelijk Eze 43:15-16 ; maar hier moet men door Ariël verstaan het brandofferaltaar in den tempel te Jeruzalem, ja ook den tempel zelf. Het altaar nu wordt een leeuw Gods genoemd, omdat het dagelijks door het vuur, dat van den hemel gekomen was, veel vee verslond als een sterke leeuw."},{"catchword":"de stad,","tekst":"Dat is, de stad Davids, namelijk het bovenkwartier der stad Jeruzalem, waar zich David met zijn hofgezin onthield; gelijk ook naderhand andere koningen in Juda gedaan hebben. Doch onder den naam Davids stad, wordt hier de gehele stad Jeruzalem verstaan, gelijk elders meer."},{"catchword":"gelegerd","tekst":"Dat is, gelogeerd, zijn hof in gehouden heeft."},{"catchword":"doet jaar","tekst":"Dit is een apostrophe of aanspraak aan de Joden. De zin is: Houdt jaarlijks uwe feestdagen."},{"catchword":"laat ze","tekst":"Te weten de priesters en Levieten."},{"catchword":"feestofferen","tekst":"Of, de feestoffers [den kop] afhouwen, of de feestoffers kelen, of de keel afsteken. Zie Exo 23:18 , en de aantekening op Psa 118:27 . De profeet berispt de dwaasheid dergenen, die zichzelven inbeeldden dat zij zich genoegzaam kweten voor God, als zij maar uiterlijk den godsdienst oefenden met offeranden te doen, enz., menende dat zij slechts zulks doende, al voort ongestraft zouden blijven, omdat het ene jaar voor, het andere jaar na, verlopen was, en zij nog al ongestraft bleven heengaan; zie 2Pe 3:4 ."}],"2":[{"catchword":"Evenwel","tekst":"Alsof Hij zeide: Het is tevergeefs dat gij mij met uiterlijke ceremoniën meent te verzoenen; vergelijk Isa 1:11 ."},{"catchword":"zal Ik","tekst":"Dat is, Ik zal het brandofferaltaar doen verwoesten; ja, ook den tempel."},{"catchword":"er zal treuring","tekst":"Te weten bij de Joden, vanwege het verbreken van het brandofferaltaar."},{"catchword":"en die stad","tekst":"Hebreeuws, zij zal mij gelijk Ariël zijn; te weten die stad Jeruzalem."},{"catchword":"zal Mij gelijk","tekst":"Dat is, Ik zal hen ook beangstigen, latende dezelve door de Babyloniërs verstoren en verwoesten; of, gelijk in den tempel voor het altaar dode beesten liggen, die geslacht waren om geofferd te worden, alzo zullen er ook in en omtrent de stad vele dode lichamen der verslagenen Joden liggen."}],"3":[{"catchword":"een leger","tekst":"Te weten het leger der Babyloniërs."},{"catchword":"in het rond","tekst":"Hebreeuws, met, of als met een bal; dat is, balsgewijze, rondom heen in het rond."},{"catchword":"om u slaan,","tekst":"Rondom u, o Jeruzalem."},{"catchword":"met bolwerken,","tekst":"Eigenlijk, met opstaande, of verheven werken; anders katten."},{"catchword":"tegen u","tekst":"Of, rondom u."}],"4":[{"catchword":"gij vernederd","tekst":"O stad Jeruzalem; dat is, gij inwoners van Jeruzalem."},{"catchword":"zachtkens","tekst":"Stil, nederig, zwakkelijk, of uwe spraak zal diep en nederig zijn, gelijk dergenen, die in een put of gracht liggen. De zin is: Gij zult tot zulk een ellendigen staat gebracht worden, dat gij nauwelijks zult durven spreken of uw mond opendoen om u te beklagen. Anders: zal lager zijn dan het stof."},{"catchword":"als van een tovenaar,","tekst":"Of, van een tovergeest, waarzeggenden geest. De tovenaars en die vanwege den duivel dengenen, die hun om raad vragen, antwoorden, zijn gewoon denzelven stilletjes en onverstandiglijk te antwoorden, met een duistere verwarde stem, als uit een hol der aarde voortkomende. Zie Lev 19:31 , en Isa 8:19 ."}],"5":[{"catchword":"de menigte","tekst":"Deze woorden kan men in tweeërlei zin nemen: Vooreerst aldus, dat men hier de woorden van den profeet versta van het vreemde krijgsvolk, dat tegen de Joden komen zou; anderszins, van de vreemde soldaten; die de Joden gehuurd zouden hebben tot hunne hulp."},{"catchword":"zal zijn gelijk","tekst":"Dat is, naar de mening dergenen, die dit verstaan van de vijanden der Joden, in zo groten getale als het dunne vliegende stof; maar naar den zin van de anderen: Het zal gans niets te beduiden hebben, zij zullen verstuiven en teniet komen."},{"catchword":"der tirannen","tekst":"Of, der schrikkelijken."}],"6":[{"catchword":"met donder,","tekst":"Dat is, met schrikkelijke bestorming en overval des vijands, te weten der Babyloniërs, die alles zullen overheren en verderven. Men kan het ook wel naar de letter verstaan."},{"catchword":"groot geluid,","tekst":"Dat is, met een groot krijgsgeschrei en alarm."},{"catchword":"de vlam","tekst":"Te weten der tegenheden en plagen. Zie Job 15:30 ."}],"7":[{"catchword":"gelijk","tekst":"De zin is, het zal den vijanden, die u benauwen zullen, gaan gelijk of zij van een nachtgezicht droomden. Zie vs.8, en Psa 73:20 ."},{"catchword":"Ariël","tekst":"Zie vs.1."},{"catchword":"tegen haar","tekst":"Te weten tegen Jeruzalem."}],"8":[{"catchword":"gelijk","tekst":"De zin is: Zij zullen niet kunnen verzadigd worden van de gruwelijke stukken, die zij aan ulieden zullen bedrijven, maar zij zullen nog al begerig zijn om nog gruwelijker boosheden aan ulieden te oefenen, als nog niet genoegzaam hun moed aan ulieden gekoeld hebbende; al de tirannie, die zij tevoren gepleegd hebben, zal maar zijn als een droom, vergeleken zijnde bij hetgeen zij u nog menen te doen."},{"catchword":"en ziet,","tekst":"Hebreeuws, dat zie, hij eet, maar als hij ontwaakt; alzo straks weder."},{"catchword":"zijn ziel","tekst":"Dat is, hij zelf; eigenlijk te spreken, zijn lichaam. Alzo wordt ziel voor lichaam genomen, Psa 16:10 ."},{"catchword":"mat,","tekst":"Of, laf; dat is, dorstig. Zie Psa 63:2 ; Isa 32:2 ."},{"catchword":"tegen den berg","tekst":"Dat is, tegen Jeruzalem."}],"9":[{"catchword":"Zij","tekst":"Te weten de goddeloze Joden."},{"catchword":"vertoeven,","tekst":"Te weten van de woorden der profeten te geloven en van hun leven te beteren."},{"catchword":"u;","tekst":"Gij vromen en godzaligen."},{"catchword":"zij zijn vrolijk,","tekst":"Dat is, zij begeven zich tot alle wellusten."},{"catchword":"roept","tekst":"Te weten tot den Heere, dat Hij u genadig zij."},{"catchword":"zij","tekst":"Te weten de goddeloze Joden."},{"catchword":"zijn dronken,","tekst":"De zin is: Zij zijn zo partijdig alsof zij van al hun verstand, wijsheid en voorzinnigheid beroofd waren, den raad der profeten niet willende aannemen noch volgen."},{"catchword":"niet van wijn;","tekst":"Maar van een tuimelgeest, die hun het verstand heeft verblind."}],"10":[{"catchword":"ulieden","tekst":"O gij goddeloze Joden."},{"catchword":"uitgegoten","tekst":"Hebreeuws, gemengd."},{"catchword":"een geest","tekst":"Alzo, dat gij het niet gevoelt noch acht, ofschoon men u lang en veel dreigt en preekt."},{"catchword":"uw ogen","tekst":"Te weten de ogen uws verstands."},{"catchword":"de profeten,","tekst":"Namelijk de valse profeten."},{"catchword":"uw hoofden,","tekst":"Dat is, uwe regenten."},{"catchword":"de zieners","tekst":"Zie 1Sa 9:9 ."},{"catchword":"verblind","tekst":"Hebreeuws, bedekt; te weten met duisternis, dat is met blindheid des gemoeds. Vergelijk boven Isa 25:7 ."}],"11":[{"catchword":"alle gezicht","tekst":"Dat is, al de voorzeggingen en profetieën der ware profeten, die God tot ulieden ezndt, of het gezicht van alles."},{"catchword":"als de woorden","tekst":"Dat is, verborgen, onbekend; zie Isa 8:16 ."},{"catchword":"die lezen kan,","tekst":"Hebreeuws, die letters, of schrift, of een boek kent. De zin van vs.11,12 is dat noch de geleerden, noch de ongeleerden, de voorzeggingen Gods, door de profeten verkondigd, verstaan zouden."}],"13":[{"catchword":"Daarom","tekst":"Dusdanigen waren ten tijde van Christus de farizeën en schriftgeleerden, ja, ook verre het grootste deel van het volk; daarom past Christus deze spreuk op hen; Mat 15:8 ; Mar 7:6 ."},{"catchword":"hun vreze,","tekst":"Hebreeuws, hunne vrees aan, of tot mij."},{"catchword":"vrezen ,","tekst":"Dat is, dienen."}],"14":[{"catchword":"Ik zal voorts","tekst":"Of, zo zal Ik ook voortvaren met dit volk wonderbaarlijk om te gaan."},{"catchword":"zal zich verbergen","tekst":"Dat is, het zal hun niet te stade komen."}],"15":[{"catchword":"die zich diep","tekst":"Dat is, die menen dat God hen niet ziet, maar dat hunne handelingen voor Hem verborgen zijn. Of aldus: Die den raad diep voor den Heere verbergen."}],"16":[{"catchword":"Ulieder","tekst":"Te weten dat gij de natuur der zaken verkeert, willende, gelijk men zegt, den meester maken boven God, daar gij toch zijn schepsel zijt. Anders: o uwe verkeerdheid! zal de pottenbakker het leem gelijk geacht worden? te weten hetwelk niets doet en niets verstaat; indien het leem loochent dat het van den pottenbakker geformeerd is en dat hij iets verstaat, zo wordt de pottenbakker geacht als leem. De zin is: Aangaande dat gijlieden zulke mening hebt van uwe behendigheid en spitsvondigheid, alsof gij God den Heere zoudt kunnen bedriegen en zijn voornemen zoudt kunnen verhinderen, is dat niet zo wijd buiten rede, alsof het leem zich verhief tegen den pottenbakker, om tegen hem te twisten en hem te berispen dat hij zijn werk niet goed gemaakt heeft?"}],"17":[{"catchword":"dat de Libanon","tekst":"De zin is: Onvruchtbare plaatsen zullen vruchtbaar worden. En integendeel, enz. De geestelijke zin is: De wilde woeste harten der uitverkoren heidenen zullen ten tijde van Christus vruchtbaar worden; dat is, zij zullen door den Heiligen Geest wedergeboren worden, en daarentegen de harten der goddeloze Joden, die vanwege hunne huichelarij schijnen vruchtbaar te zijn, zullen verstokken en verwilderen."},{"catchword":"in een vruchtbaar veld . . . het vruchtbare veld","tekst":"Of, Karmel. Zie de aantekening 2Ki 19:23 , en Jer 2:7 ."}],"18":[{"catchword":"de doven","tekst":"De genezing van deze boosheid en blindheid kan vooreerst zien op de wonderen van Jezus Christus' lichamelijk gedaan, Mat 11:5 ; doch ziet bijzonderlijk op de geestelijke verlichting, waarvan de zin is: Degenen, die tevoren onbekwaam waren om Gods Woord te horen, zullen bekwaam gemaakt worden door de kracht van den Heiligen Geest om de verborgenheden der zaligheden te verstaan."},{"catchword":"horen","tekst":"Dat is, verstaan."},{"catchword":"des Boeks;","tekst":"Te weten der Heilige Schrift; gelijk Psa 40:8 ; Heb 10:7 ; zie vs.11,12."},{"catchword":"der blinden,","tekst":"Zie de aantekening hierboven bij de doven."},{"catchword":"uit de donkerheid","tekst":"Dat is, door den Geest Gods verlicht zijnde."}],"19":[{"catchword":"de zachtmoedigen","tekst":"Zie Psa 10:17 ."},{"catchword":"vreugde op vreugde","tekst":"Hebreeuws, vreugde toedoen."},{"catchword":"in den HEERE;","tekst":"Dat is, vanwege de zaligmakende kennis des Heeren."},{"catchword":"de behoeftigen","tekst":"Dat is, de armen van geest; Mat 5:3 ."},{"catchword":"in de Heilige","tekst":"Dat is, in God, welken het volk Gods heiligt en eert; zie Psa 71:22 ."}],"20":[{"catchword":"Wanneer","tekst":"Dat is, wanneer de goddeloze Joden zullen uitgeroeid worden. Anders: want de tiran zal een einde hebben, enz."},{"catchword":"allen,","tekst":"Dat is, allen die naarstig zijn om ongerechtigheid te plegen."}],"21":[{"catchword":"schuldig","tekst":"Hebreeuws, doen zondigen, of tot een zondaar maken; dat is, beschuldigen, alsof hij een grote zonde begaan had."},{"catchword":"om een woord,","tekst":"Niet kunnende verdragen dat men hunne goddeloosheid ter goeder trouw en in ernst bestraft. Dit is vervuld in onzen Zaligmaker Christus Jezus en in zijne apostelen."},{"catchword":"in de poort;","tekst":"Dat is, voor het gericht, [zie de aantekening Gen 22:17 , en Gen 34:20 ] . Of, in de poort; dat is, openlijk, in de openbare verzameling; zie Amo 5:10 . Anders: en leggen dien strikken in de poort, die hen bestraft; dat is, en zoeken derzelver verderf door valse beschuldigingen."},{"catchword":"in het woeste","tekst":"Waar men noch te bijten noch te breken vindt, en waar alles verschrikkelijk is. De zin is: Die door hun valse aanklacht teweegbrengen dat de rechtvaardige door het gericht veroordeeld en in ellende verwezen wordt. Anders: om een nietig ding."}],"22":[{"catchword":"verlost heeft,","tekst":"Te weten uit de afgoderij. Zie Gen 12:1 ; Jos 24:2-3 ."},{"catchword":"tot het huis","tekst":"Of, van het huis van Jakob; dat is, van de nakomelingen van Jakob; versta, de vrome en godzalige Joden, of de kerk."},{"catchword":"Jakob zal nu","tekst":"De Joden, nu zij zich tot God bekeerd en hun leven verbeterd hebben, of de kerk in het algemeen."},{"catchword":"bleek worden;","tekst":"Te weten van schaamte, of van vrees."}],"23":[{"catchword":"hij","tekst":"Te weten Jakob; dat is Jakobs huis, of de kerk, als in het voorgaande."},{"catchword":"zijn kinderen,","tekst":"Die hem geboren zullen zijn door de predikatie van het heilig Evangelie."},{"catchword":"het werk","tekst":"De kinderen, die Ik zal wedergeboren en als opnieuw geschapen hebben door den Heiligen Geest. Zie Isa 19:25 ; Eph 2:10 ; Heb 2:10 ."},{"catchword":"zullen zij","tekst":"Te weten de nakomelingen van Jakob."},{"catchword":"heiligen;","tekst":"Dat is loven en prijzen."},{"catchword":"den Heilige","tekst":"Dat is, den waren God, dien Jakob heeft geloofd en geprezen."},{"catchword":"Israëls","tekst":"Dat is, der Israëlieten."},{"catchword":"vrezen","tekst":"Of, ontzien; dat is eer bewijzen."}],"24":[{"catchword":"zullen tot verstand","tekst":"Hebreeuws, zullen verstand weten."},{"catchword":"de murmureerders","tekst":"Die tegen God en zijne profeten murmureren vanwege de roeping der heidenen; vergelijk Mat 20:11 ; Luk 15:28 ; Rom 10:19 ."},{"catchword":"zullen de lering","tekst":"Of, zullen zich laten leren. Hebreeuws, zullen de onderwijzing leren. zie Job 11:4 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Wo to Ariel, Ariel, [Ariel signifieth as much as a strong lion, or, a lion of God, as Eze 43:15,16. But we must here understand by Ariel the Altar of burnt-offering in the Temple at Jerusalem, yea even the Temple it self: now the Altar is called a lion of God, because like a strong lion, it devoured daily much cattle by the fire that was come down from heaven] the city (wherein) David camped: [that is, lodged, kept his Court. That is, the city of David; namely the upper part or quarter of the city Jerusalem, where David with his Court resided, as also afterward other Kings of Juda did. But under the name of the city of David is here understood the whole city of Jerusalem, as elsewhere besides] add year unto year, [this is an Apostrophe or speech directed to the Jews. The meaning is, keep every year your feast-days] let them [to wit, the Priests and Levites] slay the feast-offerings. [or, cut off (the heads) of the feast-offerings, or cut the throats of the feast-offerings. See Psal.118. the Annotat. On vers.27. and Exo 13:18. The Prophet reproveth the folly of those that imagined that they had quitted themselves sufficiently before God, when they did onely perform outward worship and service unto God by offering of sacrifices, &c. Meaning, that by onely doing this they should thenceforward go quite unpunished, because sundry years one after another were expired, and they had still escaped unpunished. See 2 Pet.3.4.]"}],"2":[{"catchword":null,"tekst":"Yet will I distress Ariel: [As if he had said, it is in vain that ye think to appease and pacify me with outward ceremonies. Compare above chap.1.11.] and there shall be heaviness and sorrow, [to wit, among the Jews, for the breaking down of the Altar of burnt-offering] and (that city) shall be unto me like Ariel [that is, I will likewise distress it, suffering it to be wasted and destroyed by the Babylonians. Or, as in the Temple dead beasts do lie before the Altar, which were slain to be offered up in sacrifice: so shall likewise many dead bodies of Jews that are slain lie i and about this city. Heb. And it shall be unto me like Ariel; to wit, that city of Jerusalem.]"}],"3":[{"catchword":null,"tekst":"For I will lay a camp [To wit, the camp, or army of the Babylonians] in a circle [Heb. With, or as with a Ball, that is, in manner or form of a ball, round about, in a circle, or in a round ring, or compass] about thee [round about thee, O Jerusalem] and I will besiege thee with Bulwarks, [properly with works standing up, or lifted up. Others ramparts, and I will cast up sorts against thee [or round about thee.]"}],"4":[{"catchword":null,"tekst":"Then shalt thou [O city of Jerusalem; that is, ye inhabitants of Jerusalem] be brought down, thou shalt speak out of the ground, and thy speech shall proceed softly out of the dust. [or be still, low, weakly, or thy speech shall be deep etc. low; as the speech of those that lie in a pit or ditch. The meaning is, thou shalt be brought to such a sad and miserable condition, as that thou shalt hardly dare speak or open thy mouth to make thy moan. Others, shall be lower then the dust] etc. thy voice shall be out of the ground as a sorcerer [or, sooth saying spirits, divination. Wizards and conjurers, and such as by the devil do give answer to those that ask counsel of them, are wont to answer them softly, and in such a way and manner as they cannot well understand what they say, to wit, with a dark and doubtful voice, as it were proceeding out of hollow ground. See above chap.8.on vers.19. and Levit.chap.19.on ver.31.and they speech shall whisper out of the dust."}],"5":[{"catchword":null,"tekst":"And the multitude of thy strange (souldiers) [These words may be taken in a two sold sense, first thus, that the words of the Prophet may be here understood of the strange souldiers that should come against the Jews. Secondly, they may be understood of the strange souldiers that were hired by the Jews to help, and assist them] shall be like thin dust, [that is, (according to the meaning those that understand this of the enemies of the Jews) they shall be in as great a number and quantity, as the small thin flying dust, which cannot be numbered: but according to the sense and meaning of those that understand it of such as were hired to help and aid the Jews, it will be a matter of no importance, they shall vanish away, and come to nothing] and the multitude of tyrants [or, of the terrible ones] as chaff that flieth away, [Compare Job 21:18. Psal.1.4. and 35.5. above chap.17.13.] and it shall be done in a moment suddenly. [Compare below chap.30.13.]"}],"6":[{"catchword":null,"tekst":"Thou shalt be visited of the Lord of hosts with thunder, etc. with earth-quake, etc. a great sound with whirl-wind and tempest, [That is, with terrible storming and assault of the enemies; to wit of the Babylonians, that shall over power and destroy all things. It may be also understood according to the letter, (and great sound) or noise; that is, with a great cry and of war] and the flame of a devouring fire. [To wit, of adversities and plagues. See Job 15.on verse 30.]"}],"7":[{"catchword":null,"tekst":"And as the dream of a night-vision is, (so) shall the multitude of all the heathen be that shall fight against Ariel: even all that shall fight against her, and her strong hold, and (shall) distress her. [The meaning is, it shall happen to the enemies that shall distress thee, as if so be they dreamed of a night-vision. See verse 8. And Psal.73.on verse 20. Of Ariel see verse 1. (all that shall fight against her,) to wit, against Jerusalem.]"}],"8":[{"catchword":null,"tekst":"It shall be so as when an hungry man dreameth, and behold he eateth, but when he awaketh, [Heb. That behold, he eateth, but when he awaketh. So presently again] then his soul [that is, he himself: to speak properly, his body. Thus the word soul is taken for body Psal.16.10.] is empty: or like as when a thirsty man dreameth, and behold he drinketh, behold then he is yet weary, [or, faint; that is, thirsty. See Psal.63.on verse 2. Below chap.32.2.] and his soul [that is, he himself, properly his body, as before [is greedy: so shall the multitude of all the heathen be that war against mount Zion. [That is, against Jerusalem. The meaning is, they will not be satisfied with the horrible cruelties and outrages which they shall have committed upon or against you, but they shall be still greedy to commit yet more abominable villanies against you, as having not yet sufficiently wreaked their spleen against you; all the tyranny and cruelty which they formerly practised, shall be but as a dream in comparison of that which they intend to do yet further unto you.]"}],"9":[{"catchword":null,"tekst":"They [To wit, the wicked Jews] linger, [to wit, to believe the words of the Prophets, and to mend their lives] therefore wonder ye [ye religious and godly ones] they are weary, [that is, they give themselves to all pleasures and delights] therefore cry ye; to wit, unto the Lord, that he be favourable and merciful unto you] they [to wit the wicked Jews] drunken, but not with wine, [but with a spirit of giddiness, which blinded their understandings] they stagger, but not with strong drink. [The meaning is, they are so partial and self-conceited, as if they were void of all understanding, wisdom and prudence, not willing to entertain or follow the advice and counsel of the Prophets.]"}],"10":[{"catchword":null,"tekst":"For the LORD hath poured out [Heb. Mingled] upon you [O ye wicked Jews] a spirit of a deep sleep, [so that you neither feel nor mind it, though men do pray a long while and often unto you, and threaten you with Gods judgements] and he hath shut up your eyes: [to wit, the eyes of your understanding] the Prophets, [namely, the false Prophets] and your heads, [that is, your Rulers] (and) the seers [See 1 Sam.9.on verse 9.] hath he blinded. [Heb. Covered. To wit with darkness: that is, with blindness of mind. Compare above chap.25.vers.7.]"}],"11":[{"catchword":null,"tekst":"Therefore all vision [That is, all the predictions and Prophesies of the true Prophets which God sent unto you. Or, the vision of all] is become unto you as the words of a sealed [that is, hidden, unknown. See above chap.6.on verse 16.] book, which they deliver to one that can read, [Heb. That knoweth letter, or, writing, or, a book [saying, Read this, I pray: and he saith, I cannot, for it is sealed."}],"12":[{"catchword":null,"tekst":"Or they deliver the book to one that cannot read, saying, read this I pray: and he saith, I cannot read. [The meaning of the 11 and 12 verses is, that neither the learned nor the unlearned should understand the predictions or prophesies of God published and preached by the Prophets.]"}],"13":[{"catchword":null,"tekst":"For the Lord said, because this people draw nigh (unto me) with their mouth, and they do honour me with their lips, but remove their heart far from me: [Such were in Christ time the Pharisees & Scribes, yea also the greatest part by far of the people. Therefore Christ applieth this speech or saying unto them, Mat 15:8. Mar.7.6.] and their fear (wherewith they fear) [that is, serve] me, [Heb. Their fear on, or towards me] are the precepts of men, which are taught them."}],"14":[{"catchword":null,"tekst":"Therefore behold, I will hence forth deal wonderfully with this people [Or, I will proceed to deal wonderfully with this people] wonderfully, and marvellously: for the wisdom of their wise men shall perish and the understanding of their men of understanding shall hide it self [that is, it shall not stand them in any stead them in any stead at all. Compare Jer 49:7. Obad.verse 8. Matt.11.25.1. Cor.1.19.]"}],"15":[{"catchword":null,"tekst":"Wo unto them that will hide themselves deep from the LORD, hiding (their) counsel: [That is, which think that God seeth them not, but that their devices are hid from him. Or thus; which hide (their) counsel deep from the Lord] and whose works are done in darkness, and they say, who seeth us? And who knoweth us? [Compare Psal.94.7.]"}],"16":[{"catchword":null,"tekst":"Your overturning as if the Potter should be esteemed as clay, that the thing made should say of its maker, he made not; and the formed vessel should say of its maker, he made me not; and the formed vessel should say of its potter, he doth not understand it. [Your overturning, &c. To wit, that you pervert the nature of things, desiring as we say, to Lord it or play the master above God, whereas thou art but his creature. Others, O your perverness! Shall the potter be esteemed like unto the clay? To wit, which neither doth nor understandeth any thing. If the clay deny that it is formed by the potter, and that he understandeth any thing, then the potter is esteemed as the clay. The meaning is, in that you have such an opinion of your own, dexterity, craftiness and subtility, as if you were able to deceive even God himself, and were able to hinder and frustrate his purpose; is not that as senseless, as if they clay should exalt it self against the potter, to dispute with him, and to control him not doing his work well? Compare below chap.45.9.]"}],"17":[{"catchword":null,"tekst":"Is it not but for a little while yet that Lebanon shall be turned into a fruitful field? [Or, Carmel. See the Annotat. 2 Kings 19.23. and Jerem.2.on ver.7.] and the fruitful field [or Carmel, as before] shall be esteemed as a forest. [The meaning is, Barren places shall, become fruitful; and on the contrary, fruitful places, shall grow barren. The spiritual meaning is, the wild desert hearts, of the elect Gentiles, shall in Christs time grow fruitful, that is, they shall be born again by the Holy Ghost: and on the contrary, the hearts of the wicked Jews, who by reason of their hypocrisy seem, to be fruitful, shall be hardened and grow wild.]"}],"18":[{"catchword":null,"tekst":"And in that day shall the deaf hear [That is, understand] the words of the book: [to wit, of the holy Scripture, as Psal.40.8. Heb 10:7. See the 11 and 12 verses.] and the eyes of the blind, being out of obscurity, and out of darkness, [that is, being enlightened by the spirit of God,] shall see. [The curing of this deafness and blindness may in the first place have respect to the miracles of Christ upon the bodies of men, Mat 11:5. but it hath specially respect to the spiritual illumination or enlightening; the sense whereof is, that those that firmerly were unfit and uncapable, by the power of the holy ghost, to understand the mysteries of salvation.]"}],"19":[{"catchword":null,"tekst":"And the meek [See Psal.1.on verse 17.] shall have joy upon joy [Heb. Add unto joy] in the LORD: [that is, because of the saving knowledge of the LORD] and the needy among men, [that is, the poor in spirit, Mat 5:3.] shall rejoice in the holy one of Israel, [that is, in God,  see his children [which shall be born unto him by the preaching of the Gospel] the work of mine hands [the children whom I shall have begotten again, and as it were created anew by the Holy Ghost. See above chap.19.25. Eph.2.10. Heb 2:10.] in the midst of him, they [to wit, the posterity of Jacob] shall hallow [that is, land and praise] my name: and they shall hallow the holy one of Jacob, [that is, the true God, whom Jacob praised and magnified] and fear [or, reverence; that is honour, glorify] the God of Israel. [That is, of the Israelites.]"}],"24":[{"catchword":null,"tekst":"And they that erre in spirit shall come to understanding [Heb. Shall know understanding] and the murmurers [That murmur against God and his Prophets because of the ruling of the Gentiles. Compare Mat 20:11. Luk 15:28. Rom 10:19.] shall receive doctrine. [Or, shall suffer themselves to be taught, or instructed Heb. Shall learn instruction. See Job 11.on verse 4.]"}]}}};
