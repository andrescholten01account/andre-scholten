<style>

  .vers:hover .kopieer { opacity: .75; }

  #bijbel.parallel .vnr { grid-row: 1; }
  .kolomkop { display:none; }

":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Wee hun die onrechtvaardige regels bepalen, en de schrijvers die moeite voorschrijven;","2":"om de armen van het recht af te wenden, en om het recht van de ellendigen van Mijn volk te roven, opdat de weduwen hun buit worden, en opdat zij de wezen mogen plunderen!","3":"Maar wat zult u doen op de dag van de bezoeking, en van de verwoesting, *die* van verre komen zal? Naar wie zult u vluchten om hulp, en waar zult u uw heerlijkheid laten?","4":"Zou niet ieder zich buigen onder de gevangenen, en vallen onder de gedoden? Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.","5":"Wee de Assyriër, *die* de roede van Mijn toorn is, en Mijn grimmigheid is een stok in hun hand!","6":"Ik zal hem zenden tegen een huichelachtig volk, en Ik zal hem bevel geven tegen het volk van Mijn verbolgenheid; opdat hij de roof rooft, en plundert de plundering, en het stelt ter vertreding, als het slijk van de straten.","7":"Hoewel hij het zo niet meent, en zijn hart zo niet denkt, maar hij zal in zijn hart hebben te verdelgen, en niet weinige volken uit te roeien.","8":"Want hij zegt: Zijn niet mijn vorsten allemaal samen koningen?","9":"Is niet Kalno gelijk Karchemis? Is Hamath niet gelijk Arfad? Is niet Samaria gelijk Damaskus?","10":"Zoals mijn hand de koninkrijken van de afgoden gevonden heeft, ofschoon hun gesneden beelden beter zijn dan die van Jeruzalem, en dan die van Samaria;","11":"zou ik, zoals ik gedaan heb aan Samaria en aan haar afgoden, niet zo kunnen doen aan Jeruzalem en aan haar afgoden?","12":"Want het zal gebeuren, als de Heere een einde zal gemaakt hebben van al Zijn werk op de berg Sion en te Jeruzalem, dan zal Ik thuis zoeken de vrucht van de grootsheid van het hart van de koning van Assyrië, en de pracht van de hoogheid van zijn ogen.","13":"Omdat hij gezegd heeft: Door de kracht van mijn hand heb ik het gedaan, en door mijn wijsheid, want ik ben verstandig; en ik heb de landpalen van de volken weggenomen, en heb hun voorraad geroofd, en heb als een geweldige de inwoners doen neerdalen;","14":"en mijn hand heeft het vermogen van de volken gevonden, als een nest, en ik heb het hele aardrijk samengeraapt, zoals men de eieren die verlaten zijn samenraapt; en er is niemand geweest die een vleugel bewoog, of de bek opendeed, of piepte.","15":"Zal een bijl zich beroemen tegen hem die daarmee houwt? Zal een zaag pochen tegen hem die ze trekt? Alsof een staf beweegt wie hem opheffen? Als men een stok opheft, is het geen hout?","16":"Daarom zal de Heere Heere van de heerscharen[1] onder zijn vetten een magerheid zenden; en onder zijn heerlijkheid zal Hij een brand doen branden, als de brand van het vuur.","17":"Want het Licht van Israël zal tot een vuur zijn, en zijn Heilige tot een vlam, die in brand zal steken en verteren zal zijn doornen en zijn distels, op één dag.","18":"Ook zal Hij verteren de heerlijkheid van zijn woud en van zijn vruchtbare veld; van de ziel af, tot het vlees toe; en hij zal zijn, zoals wanneer een vaandeldrager versmelt.","19":"En de overgebleven bomen van zijn woud zullen weinig in getal zijn, ja, een jongen zou ze kunnen opschrijven.","20":"En het zal gebeuren op die dag, dat het overblijfsel van Israël, en wie ontkomen waren van het huis van Jakob, niet meer zullen steunen op hem die ze geslagen heeft; maar zij zullen steunen op de HEERE, de Heilige van Israël, oprecht.","21":"Het overblijfsel zal terugkeren, het overblijfsel van Jakob, tot de sterke God!","22":"Want ofschoon uw volk, o Israël, is als het zand van de zee, zo zal toch maar het overblijfsel daarvan terugkeren; de verdelging is vast besloten, overvloeiend met gerechtigheid.","23":"Want een verdelging, die vast besloten is, zal de Heere HEERE van de heerscharen doen in het midden van dit hele land.","24":"Daarom zegt de Heere HEERE van de heerscharen zo: Vrees niet, Mijn volk, dat in Sion woont, voor Assur, als hij u met de roede zal slaan, en hij zijn staf tegen u zal opheffen, naar de wijze van de Egyptenaren;","25":"want nog een klein weinig, dan zal de gramschap volbracht worden, en Mijn toorn tot hun vernieling.","26":"Want de HEERE van de heerscharen zal tegen hem een gesel verwekken, gelijk de slachting van Midian was bij de rots van Oreb; en zoals Zijn staf over de zee was, die Hij verheffen zal, naar de wijze van de Egyptenaren.","27":"En het zal gebeuren op diezelfde dag, dat zijn last zal afwijken van uw schouder, en zijn juk van uw hals; en het juk zal verdorven worden, vanwege de Gezalfde.","28":"Hij komt te Ajath, hij trekt door Migron; te Michmas legt hij zijn gereedschap af.","29":"Zij trekken door de doorgang, te Geba houden zij hun overnachting; Rama beeft, Gibea van Saul vlucht.","30":"Roep luid met uw stem, dochter van Gallim! Laat het horen tot Lais toe, o ellendige Anathoth!","31":"Madmena vlucht weg, de inwoners van Gebim vluchten met groepen.","32":"Nog een dag blijft hij te Nob staan; hij zal er zijn hand bewegen tegen de berg van de dochter van Sion, de heuvel van Jeruzalem.","33":"Doch zie, de Heere HEERE van de heerscharen zal met geweld de takken afkappen, en zij die hoog van gestalte zijn, zullen neergehouwen worden; en de verhevens zullen vernederd worden.","34":"En Hij zal met ijzer de verwarde struiken van het woud omhouwen; en de Libanon zal vallen door de Heerlijke."},"SV":{"1":"Wee dengenen, die ongerechte inzettingen inzetten, en den schrijvers, die moeite voorschrijven;","2":"Om de armen van het recht af te wenden, en om het recht der ellendigen Mijns volks te roven, opdat de weduwen hun buit worden, en opdat zij de wezen mogen plunderen!","3":"Maar wat zult gijlieden doen ten dage der bezoeking, en der verwoesting, *die* van verre komen zal? Tot wien zult gij vlieden om hulp, en waar zult gij uw heerlijkheid laten?","4":"Dat elkeen zich niet zou buigen onder de gevangenen, en vallen onder de gedoden? Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.","5":"Wee den Assyriër, *die* de roede Mijns toorns is, en Mijn grimmigheid is een stok in hun hand!","6":"Ik zal hem zenden tegen een huichelachtig volk, en Ik zal hem bevel geven tegen het volk Mijner verbolgenheid; opdat hij den roof rove, en plundere de plundering, en stelle het ter vertreding, gelijk het slijk der straten.","7":"Hoewel hij het zo niet meent, en zijn hart alzo niet denkt, maar hij zal in zijn hart hebben te verdelgen, en uit te roeien niet weinige volken.","8":"Want hij zegt: Zijn niet mijn vorsten al te zamen koningen?","9":"Is niet Kalno gelijk Karchemis? Is Hamath niet gelijk Arfad? Is niet Samaria gelijk Damaskus?","10":"Gelijk als mijn hand gevonden heeft de koninkrijken der afgoden, ofschoon hun gesneden beelden beter zijn, dan *die* van Jeruzalem, en dan *die* van Samaria;","11":"Gelijk als ik gedaan heb aan Samaria en aan haar afgoden, zou ik alzo niet kunnen doen aan Jeruzalem en aan haar afgoden?","12":"Want het zal geschieden, als de Heere een einde zal gemaakt hebben van al Zijn werk op den berg Sion en te Jeruzalem, dan zal Ik te huis zoeken de vrucht van de grootsheid des harten van den koning van Assyrië, en de pracht van de hoogheid zijner ogen.","13":"Omdat hij gezegd heeft: Door de kracht mijner hand heb ik het gedaan, en door mijn wijsheid, want ik ben verstandig; en ik heb de landpalen der volken weggenomen, en heb hun voorraad geroofd, en heb als een geweldige de inwoners doen nederdalen;","14":"En mijn hand heeft gevonden het vermogen der volken, als een nest, en ik heb het ganse aardrijk samengeraapt, gelijk men de eieren die verlaten zijn, samenraapt; en er is niemand geweest, die een vleugel verroerde, of den bek opendeed, of piepte.","15":"Zal een bijl zich beroemen tegen dien, die daarmede houwt? Zal een zaag pochen tegen dien, die ze trekt? Alsof een staf bewoog degenen, die hem opheffen? Als men een stok opheft, is het geen hout?","16":"Daarom zal de Heere Heere der heirscharen onder zijn vetten een magerheid zenden; en onder zijn heerlijkheid zal Hij een brand doen branden, als den brand des vuurs.","17":"Want het Licht van Israël zal tot een vuur zijn, en zijn Heilige tot een vlam, welke in brand steken en verteren zal zijn doornen en zijn distelen, op een dag.","18":"Ook zal Hij verteren de heerlijkheid zijns wouds en zijns vruchtbaren velds; van de ziel af, tot het vlees toe; en hij zal zijn, gelijk als wanneer een vaandrager versmelt.","19":"En de overgebleven bomen zijns wouds zullen weinig in getal zijn, ja, een jongen zou ze opschrijven.","20":"En het zal geschieden te dien dage, dat het overblijfsel van Israël, en de ontkomenen van het huis Jakobs niet meer steunen zullen op dien, die ze geslagen heeft; maar zij zullen steunen op den HEERE, den Heilige Israëls, oprechtelijk.","21":"Het overblijfsel zal wederkeren, het overblijfsel van Jakob, tot den sterken God!","22":"Want ofschoon uw volk, o Israël! is gelijk het zand der zee, zo zal *toch* *maar* het overblijfsel daarvan wederkeren; de verdelging is vastelijk besloten, overvloeiende met gerechtigheid.","23":"Want een verdelging, die vastelijk besloten is, zal de Heere HEERE der heirscharen doen in het midden dezes gansen lands.","24":"Daarom zegt de Heere HEERE der heirscharen alzo: Vreest niet, gij Mijn volk, dat te Sion woont! voor Assur, als hij u met de roede zal slaan, en hij zijn staf tegen u zal opheffen, naar de wijze der Egyptenaren;","25":"Want nog een klein weinig, zo zal volbracht worden de gramschap, en Mijn toorn tot hun vernieling.","26":"Want de HEERE der heirscharen zal tegen hem een gesel verwekken, gelijk de slachting van Midian was aan de rots van Oreb; en *gelijk* Zijn staf over de zee was, denwelken Hij verheffen zal, naar de wijze der Egyptenaren.","27":"En het zal geschieden ten zelfden dage, dat zijn last zal afwijken van uw schouder, en zijn juk van uw hals; en het juk zal verdorven worden, om des Gezalfden wil.","28":"Hij komt te Ajath, hij trekt door Migron; te Michmas legt hij zijn gereedschap af.","29":"Zij trekken door den doorgang, te Geba houden zij hun vernachting; Rama beeft, Gibea Sauls vlucht.","30":"Roep luide met uw stem, gij dochter van Gallim! laat ze horen tot Lais toe, o ellendige Anathoth!","31":"Madmena vliedt weg, de inwoners van Gebim vluchten met hopen.","32":"Nog een dag blijft hij te Nob; hij zal er zijn hand bewegen *tegen* den berg der dochter van Sion, den heuvel van Jeruzalem.","33":"*Doch* ziet, de Heere HEERE der heirscharen zal met geweld de takken afkappen, en die hoog van gestalte zijn, zullen nedergehouwen worden; en de verhevenen zullen vernederd worden.","34":"En Hij zal met ijzer de verwarde struiken des wouds omhouwen; en de Libanon zal vallen door den Heerlijke."},"KJV":{"1":"Woe unto them that decree unrighteous decrees, and that write grievousness *which* they have prescribed;","2":"To turn aside the needy from judgment, and to take away the right from the poor of my people, that widows may be their prey, and *that* they may rob the fatherless!","3":"And what will ye do in the day of visitation, and in the desolation *which* shall come from far? to whom will ye flee for help? and where will ye leave your glory?","4":"Without me they shall bow down under the prisoners, and they shall fall under the slain. For all this his anger is not turned away, but his hand *is* stretched out still.","5":"O Assyrian, the rod of mine anger, and the staff in their hand is mine indignation.","6":"I will send him against an hypocritical nation, and against the people of my wrath will I give him a charge, to take the spoil, and to take the prey, and to tread them down like the mire of the streets.","7":"Howbeit he meaneth not so, neither doth his heart think so; but *it is* in his heart to destroy and cut off nations not a few.","8":"For he saith, *Are* not my princes altogether kings?","9":"*Is* not Calno as Carchemish? *is* not Hamath as Arpad? *is* not Samaria as Damascus?","10":"As my hand hath found the kingdoms of the idols, and whose graven images did excel them of Jerusalem and of Samaria;","11":"Shall I not, as I have done unto Samaria and her idols, so do to Jerusalem and her idols?","12":"Wherefore it shall come to pass, *that* when the Lord hath performed his whole work upon mount Zion and on Jerusalem, I will punish the fruit of the stout heart of the king of Assyria, and the glory of his high looks.","13":"For he saith, By the strength of my hand I have done *it*, and by my wisdom; for I am prudent: and I have removed the bounds of the people, and have robbed their treasures, and I have put down the inhabitants like a valiant","14":"And my hand hath found as a nest the riches of the people: and as one gathereth eggs *that are* left, have I gathered all the earth; and there was none that moved the wing, or opened the mouth, or peeped.","15":"Shall the axe boast itself against him that heweth therewith? *or* shall the saw magnify itself against him that shaketh it? as if the rod should shake *itself* against them that lift it up, *or* as if the staff should lift up *itself, as if it were* no wood.","16":"Therefore shall the Lord, the Lord of hosts, send among his fat ones leanness; and under his glory he shall kindle a burning like the burning of a fire.","17":"And the light of Israel shall be for a fire, and his Holy One for a flame: and it shall burn and devour his thorns and his briers in one day;","18":"And shall consume the glory of his forest, and of his fruitful field, both soul and body: and they shall be as when a standardbearer fainteth.","19":"And the rest of the trees of his forest shall be few, that a child may write","20":"And it shall come to pass in that day, *that* the remnant of Israel, and such as are escaped of the house of Jacob, shall no more again stay upon him that smote them; but shall stay upon the LORD, the Holy One of Israel, in truth.","21":"The remnant shall return, *even* the remnant of Jacob, unto the mighty God.","22":"For though thy people Israel be as the sand of the sea, *yet* a remnant of them shall return: the consumption decreed shall overflow with righteousness.","23":"For the Lord GOD of hosts shall make a consumption, even determined, in the midst of all the land.","24":"Therefore thus saith the Lord GOD of hosts, O my people that dwellest in Zion, be not afraid of the Assyrian: he shall smite thee with a rod, and shall lift up his staff against thee, after the manner of Egypt.","25":"For yet a very little while, and the indignation shall cease, and mine anger in their destruction.","26":"And the LORD of hosts shall stir up a scourge for him according to the slaughter of Midian at the rock of Oreb: and *as* his rod *was* upon the sea, so shall he lift it up after the manner of Egypt.","27":"And it shall come to pass in that day, *that* his burden shall be taken away from off thy shoulder, and his yoke from off thy neck, and the yoke shall be destroyed because of the anointing.","28":"He is come to Aiath, he is passed to Migron; at Michmash he hath laid up his carriages:","29":"They are gone over the passage: they have taken up their lodging at Geba; Ramah is afraid; Gibeah of Saul is fled.","30":"Lift up thy voice, O daughter of Gallim: cause it to be heard unto Laish, O poor Anathoth.","31":"Madmenah is removed; the inhabitants of Gebim gather themselves to flee.","32":"As yet shall he remain at Nob that day: he shall shake his hand *against* the mount of the daughter of Zion, the hill of Jerusalem.","33":"Behold, the Lord, the LORD of hosts, shall lop the bough with terror: and the high ones of stature *shall be* hewn down, and the haughty shall be humbled.","34" ?","4":"Without me they <span class=\"wl wl-kjv\" data-code=\"H1115\">shall</span> bow <span class=\"wl wl-kjv\" data-code=\"H3766\">down</span> under the <span class=\"wl wl-kjv\" data-code=\"H616\">prisoners,</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> under the <span class=\"wl wl-kjv\" data-code=\"H2026\">slain.</span> For all this his <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> is not turned <span class=\"wl wl-kjv\" data-code=\"H7725\">away,</span> but his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> is stretched out still.","5":"<span class=\"wl wl-kjv\" data-code=\"H1945\">O</span> <span class=\"wl wl-kjv\" data-code=\"H804\">Assyrian,</span> the <span class=\"wl wl-kjv\" data-code=\"H7626\">rod</span> of mine <span class=\"wl wl-kjv\" data-code=\"H639\">anger,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4294\">staff</span> in their <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> is mine indignation.","6":"I will <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> him against an <span class=\"wl wl-kjv\" data-code=\"H2611\">hypocritical</span> <span class=\"wl wl-kjv\" data-code=\"H1471\">nation,</span> and against the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of my <span class=\"wl wl-kjv\" data-code=\"H5678\">wrath</span> will I give him a <span class=\"wl wl-kjv\" data-code=\"H6680\">charge,</span> to <span class=\"wl wl-kjv\" data-code=\"H7997\">take</span> the <span class=\"wl wl-kjv\" data-code=\"H7998\">spoil,</span> and to <span class=\"wl wl-kjv\" data-code=\"H962\">take</span> the <span class=\"wl wl-kjv\" data-code=\"H957\">prey,</span> and to tread them <span class=\"wl wl-kjv\" data-code=\"H7760\">down</span> like the <span class=\"wl wl-kjv\" data-code=\"H2563\">mire</span> of the streets.","7":"Howbeit he <span class=\"wl wl-kjv\" data-code=\"H1819\">meaneth</span> not so, neither doth his <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> <span class=\"wl wl-kjv\" data-code=\"H2803\">think</span> so; but it is in his <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> to <span class=\"wl wl-kjv\" data-code=\"H8045\">destroy</span> and cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> not a few.","8":"For he <span class=\"wl wl-kjv\" data-code=\"H559\">saith,</span> Are not my <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> <span class=\"wl wl-kjv\" data-code=\"H3162\">altogether</span> kings?","9":"Is not <span class=\"wl wl-kjv\" data-code=\"H3641\">Calno</span> as <span class=\"wl wl-kjv\" data-code=\"H3751\">Carchemish?</span> is not <span class=\"wl wl-kjv\" data-code=\"H2574\">Hamath</span> as <span class=\"wl wl-kjv\" data-code=\"H774\">Arpad?</span> is not <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria</span> as Damascus?","10":"As my <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> hath <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> the <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdoms</span> of the <span class=\"wl wl-kjv\" data-code=\"H457\">idols,</span> and whose graven <span class=\"wl wl-kjv\" data-code=\"H6456\">images</span> did excel them of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> and of Samaria;","11":"Shall I not, as I have <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> unto <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria</span> and her <span class=\"wl wl-kjv\" data-code=\"H457\">idols,</span> so <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> to <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> and her idols?","12":"Wherefore it shall come to pass, that when the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> hath <span class=\"wl wl-kjv\" data-code=\"H1214\">performed</span> his whole <span class=\"wl wl-kjv\" data-code=\"H4639\">work</span> upon <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion</span> and on <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> I will <span class=\"wl wl-kjv\" data-code=\"H6485\">punish</span> the <span class=\"wl wl-kjv\" data-code=\"H6529\">fruit</span> of the <span class=\"wl wl-kjv\" data-code=\"H1433\">stout</span> <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8597\">glory</span> of his <span class=\"wl wl-kjv\" data-code=\"H7312\">high</span> looks.","13":"For he <span class=\"wl wl-kjv\" data-code=\"H559\">saith,</span> By the <span class=\"wl wl-kjv\" data-code=\"H3581\">strength</span> of my <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> I have <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> it, and by my <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom;</span> for I am <span class=\"wl wl-kjv\" data-code=\"H995\">prudent:</span> and I have <span class=\"wl wl-kjv\" data-code=\"H5493\">removed</span> the <span class=\"wl wl-kjv\" data-code=\"H1367\">bounds</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and have <span class=\"wl wl-kjv\" data-code=\"H8154\">robbed</span> their <span class=\"wl wl-kjv\" data-code=\"H6259\">treasures,</span> and I have put <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> like a <span class=\"wl wl-kjv\" data-code=\"H47\">valiant</span>","14":"And my <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> hath <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> as a <span class=\"wl wl-kjv\" data-code=\"H7064\">nest</span> the <span class=\"wl wl-kjv\" data-code=\"H2428\">riches</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people:</span> and as one <span class=\"wl wl-kjv\" data-code=\"H622\">gathereth</span> <span class=\"wl wl-kjv\" data-code=\"H1000\">eggs</span> that are <span class=\"wl wl-kjv\" data-code=\"H5800\">left,</span> have I <span class=\"wl wl-kjv\" data-code=\"H622\">gathered</span> all the <span class=\"wl wl-kjv\" data-code=\"H776\">earth;</span> and there was none that <span class=\"wl wl-kjv\" data-code=\"H5074\">moved</span> the <span class=\"wl wl-kjv\" data-code=\"H3671\">wing,</span> or <span class=\"wl wl-kjv\" data-code=\"H6475\">opened</span> the <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> or peeped.","15":"Shall the <span class=\"wl wl-kjv\" data-code=\"H1631\">axe</span> <span class=\"wl wl-kjv\" data-code=\"H6286\">boast</span> itself against him that <span class=\"wl wl-kjv\" data-code=\"H2672\">heweth</span> therewith? or shall the <span class=\"wl wl-kjv\" data-code=\"H4883\">saw</span> <span class=\"wl wl-kjv\" data-code=\"H1431\">magnify</span> itself against him that <span class=\"wl wl-kjv\" data-code=\"H5130\">shaketh</span> it? as if the <span class=\"wl wl-kjv\" data-code=\"H7626\">rod</span> should <span class=\"wl wl-kjv\" data-code=\"H5130\">shake</span> itself against them that lift it <span class=\"wl wl-kjv\" data-code=\"H7311\">up,</span> or as if the <span class=\"wl wl-kjv\" data-code=\"H4294\">staff</span> should lift <span class=\"wl wl-kjv\" data-code=\"H7311\">up</span> itself, as if it were no wood.","16":"Therefore shall the <span class=\"wl wl-kjv\" data-code=\"H113\">Lord,</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> among his fat <span class=\"wl wl-kjv\" data-code=\"H4924\">ones</span> <span class=\"wl wl-kjv\" data-code=\"H7332\">leanness;</span> and under his <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> he shall <span class=\"wl wl-kjv\" data-code=\"H3344\">kindle</span> a <span class=\"wl wl-kjv\" data-code=\"H3350\">burning</span> like the burning of a fire.","17":"And the <span class=\"wl wl-kjv\" data-code=\"H216\">light</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> shall be for a <span class=\"wl wl-kjv\" data-code=\"H784\">fire,</span> and his Holy <span class=\"wl wl-kjv\" data-code=\"H6918\">One</span> for a <span class=\"wl wl-kjv\" data-code=\"H3852\">flame:</span> and it shall <span class=\"wl wl-kjv\" data-code=\"H1197\">burn</span> and <span class=\"wl wl-kjv\" data-code=\"H398\">devour</span> his <span class=\"wl wl-kjv\" data-code=\"H7898\">thorns</span> and his <span class=\"wl wl-kjv\" data-code=\"H8068\">briers</span> in <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> day;","18":"And shall <span class=\"wl wl-kjv\" data-code=\"H3615\">consume</span> the <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> of his <span class=\"wl wl-kjv\" data-code=\"H3293\">forest,</span> and of his fruitful <span class=\"wl wl-kjv\" data-code=\"H3759\">field,</span> both <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> and <span class=\"wl wl-kjv\" data-code=\"H1320\">body:</span> and they shall be as when a <span class=\"wl wl-kjv\" data-code=\"H5263\">standardbearer</span> fainteth.","19":"And the <span class=\"wl wl-kjv\" data-code=\"H7605\">rest</span> of the <span class=\"wl wl-kjv\" data-code=\"H6086\">trees</span> of his <span class=\"wl wl-kjv\" data-code=\"H3293\">forest</span> shall be <span class=\"wl wl-kjv\" data-code=\"H4557\">few,</span> that a <span class=\"wl wl-kjv\" data-code=\"H5288\">child</span> may write","20":"And it shall come to pass in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> that the <span class=\"wl wl-kjv\" data-code=\"H7605\">remnant</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and such as are <span class=\"wl wl-kjv\" data-code=\"H6413\">escaped</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> shall no more <span class=\"wl wl-kjv\" data-code=\"H3254\">again</span> <span class=\"wl wl-kjv\" data-code=\"H8172\">stay</span> upon him that <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> them; but shall <span class=\"wl wl-kjv\" data-code=\"H8172\">stay</span> upon the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> the Holy <span class=\"wl wl-kjv\" data-code=\"H6918\">One</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> in truth.","21":"The <span class=\"wl wl-kjv\" data-code=\"H7605\">remnant</span> shall <span class=\"wl wl-kjv\" data-code=\"H7725\">return,</span> even the <span class=\"wl wl-kjv\" data-code=\"H7605\">remnant</span> of <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1368\">mighty</span> God.","22":"For though thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> be as the <span class=\"wl wl-kjv\" data-code=\"H2344\">sand</span> of the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea,</span> yet a <span class=\"wl wl-kjv\" data-code=\"H7605\">remnant</span> of them shall <span class=\"wl wl-kjv\" data-code=\"H7725\">return:</span> the <span class=\"wl wl-kjv\" data-code=\"H3631\">consumption</span> <span class=\"wl wl-kjv\" data-code=\"H2782\">decreed</span> shall <span class=\"wl wl-kjv\" data-code=\"H7857\">overflow</span> with righteousness.","23":"For the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts</span> shall <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> a <span class=\"wl wl-kjv\" data-code=\"H3617\">consumption,</span> even <span class=\"wl wl-kjv\" data-code=\"H2782\">determined,</span> in the <span class=\"wl wl-kjv\" data-code=\"H7130\">midst</span> of all the land.","24":"Therefore thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> O my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that <span class=\"wl wl-kjv\" data-code=\"H3427\">dwellest</span> in <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion,</span> be not <span class=\"wl wl-kjv\" data-code=\"H3372\">afraid</span> of the <span class=\"wl wl-kjv\" data-code=\"H804\">Assyrian:</span> he shall <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> thee with a <span class=\"wl wl-kjv\" data-code=\"H7626\">rod,</span> and shall lift <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> his <span class=\"wl wl-kjv\" data-code=\"H4294\">staff</span> against thee, after the <span class=\"wl wl-kjv\" data-code=\"H1870\">manner</span> of Egypt.","25":"For yet a <span class=\"wl wl-kjv\" data-code=\"H4213\">very</span> little <span class=\"wl wl-kjv\" data-code=\"H4592\">while,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2195\">indignation</span> shall <span class=\"wl wl-kjv\" data-code=\"H3615\">cease,</span> and mine <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> in their destruction.","26":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts</span> shall stir <span class=\"wl wl-kjv\" data-code=\"H5782\">up</span> a <span class=\"wl wl-kjv\" data-code=\"H7752\">scourge</span> for him according to the <span class=\"wl wl-kjv\" data-code=\"H4347\">slaughter</span> of <span class=\"wl wl-kjv\" data-code=\"H4080\">Midian</span> at the <span class=\"wl wl-kjv\" data-code=\"H6697\">rock</span> of <span class=\"wl wl-kjv\" data-code=\"H6159\">Oreb:</span> and as his <span class=\"wl wl-kjv\" data-code=\"H4294\">rod</span> was upon the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea,</span> so shall he lift it <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> after the <span class=\"wl wl-kjv\" data-code=\"H1870\">manner</span> of Egypt.","27":"And it shall come to pass in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> that his <span class=\"wl wl-kjv\" data-code=\"H5448\">burden</span> shall be taken <span class=\"wl wl-kjv\" data-code=\"H5493\">away</span> from off thy <span class=\"wl wl-kjv\" data-code=\"H7926\">shoulder,</span> and his <span class=\"wl wl-kjv\" data-code=\"H5923\">yoke</span> from off thy <span class=\"wl wl-kjv\" data-code=\"H6677\">neck,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5923\">yoke</span> shall be <span class=\"wl wl-kjv\" data-code=\"H2254\">destroyed</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">because</span> of the anointing.","28":"He is <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to <span class=\"wl wl-kjv\" data-code=\"H5857\">Aiath,</span> he is <span class=\"wl wl-kjv\" data-code=\"H5674\">passed</span> to <span class=\"wl wl-kjv\" data-code=\"H4051\">Migron;</span> at <span class=\"wl wl-kjv\" data-code=\"H4363\">Michmash</span> he hath laid <span class=\"wl wl-kjv\" data-code=\"H6485\">up</span> his carriages:","29":"They are gone <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> the <span class=\"wl wl-kjv\" data-code=\"H4569\">passage:</span> they have taken up their <span class=\"wl wl-kjv\" data-code=\"H4411\">lodging</span> at <span class=\"wl wl-kjv\" data-code=\"H1387\">Geba;</span> <span class=\"wl wl-kjv\" data-code=\"H7414\">Ramah</span> is <span class=\"wl wl-kjv\" data-code=\"H2729\">afraid;</span> <span class=\"wl wl-kjv\" data-code=\"H1390\">Gibeah</span> of <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> is fled.","30":"Lift <span class=\"wl wl-kjv\" data-code=\"H6670\">up</span> thy <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> O <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> <span class=\"wl wl-kjv\" data-code=\"H1530\">of</span> <span class=\"wl wl-kjv\" data-code=\"H1554\">Gallim:</span> cause it to be <span class=\"wl wl-kjv\" data-code=\"H7181\">heard</span> unto <span class=\"wl wl-kjv\" data-code=\"H3919\">Laish,</span> O <span class=\"wl wl-kjv\" data-code=\"H6041\">poor</span> Anathoth.","31":"<span class=\"wl wl-kjv\" data-code=\"H4088\">Madmenah</span> is <span class=\"wl wl-kjv\" data-code=\"H5074\">removed;</span> the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of <span class=\"wl wl-kjv\" data-code=\"H1374\">Gebim</span> gather themselves to flee.","32":"As yet shall he <span class=\"wl wl-kjv\" data-code=\"H5975\">remain</span> at <span class=\"wl wl-kjv\" data-code=\"H5011\">Nob</span> that <span class=\"wl wl-kjv\" data-code=\"H3117\">day:</span> he shall <span class=\"wl wl-kjv\" data-code=\"H5130\">shake</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> against the <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> of the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion,</span> the <span class=\"wl wl-kjv\" data-code=\"H1389\">hill</span> of Jerusalem.","33":"Behold, the <span class=\"wl wl-kjv\" data-code=\"H113\">Lord,</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> shall <span class=\"wl wl-kjv\" data-code=\"H5586\">lop</span> the <span class=\"wl wl-kjv\" data-code=\"H6288\">bough</span> with <span class=\"wl wl-kjv\" data-code=\"H4637\">terror:</span> and the high <span class=\"wl wl-kjv\" data-code=\"H7311\">ones</span> of <span class=\"wl wl-kjv\" data-code=\"H6967\">stature</span> shall be hewn <span class=\"wl wl-kjv\" data-code=\"H1438\">down,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1364\">haughty</span> shall be humbled.","34":"And he shall cut <span class=\"wl wl-kjv\" data-code=\"H5362\">down</span> the <span class=\"wl wl-kjv\" data-code=\"H5442\">thickets</span> of the <span class=\"wl wl-kjv\" data-code=\"H3293\">forest</span> with <span class=\"wl wl-kjv\" data-code=\"H1270\">iron,</span> and <span class=\"wl wl-kjv\" data-code=\"H3844\">Lebanon</span> shall <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> by a mighty one."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"dengenen,","tekst":"Dat is, den rechtsgeleerden en wetgevers."},{"catchword":"inzetten,","tekst":"Of, ordineren, voorschrijven."},{"catchword":"en den schrijvers,","tekst":"Die de wetten maken en voorschrijven zijn de regeerders des lands, over wie hier het wee uitgesproken wordt."},{"catchword":"moeite","tekst":"Of, arbeid, dat is zulke wetten of ordinantiën, die den onderzaten moeite en zwarigheid aanbrengen."}],"2":[{"catchword":"Om de armen","tekst":"Dat is, opdat zij de arme lieden verhinderen dat hunne zaak [hoe rechtvaardig die ook zij] in het gericht gehoord, aangenomen of bevorderd worde."},{"catchword":"opdat de weduwen","tekst":"Plat tegen de wet Gods; Exo 22:22 ."}],"3":[{"catchword":"ten dage","tekst":"Dat is, als Ik u tot mijnen toorn kom bezoeken. Hier spreekt de Heere de onrechtvaardige wetgevers en regenten aan."},{"catchword":"der verwoesting,","tekst":"Te weten der verwoesting uws lands. Zie 2Ki 18:13 ."},{"catchword":"van verre komen zal?","tekst":"Te weten van den koning van Assyrië. Zie boven Isa 9:10-11 ."},{"catchword":"Tot wien","tekst":"Alsof hij zeide: Daar zullen geen mensen in de wereld zijn, die u zullen kunnen helpen."},{"catchword":"uw heerlijkheid","tekst":"Dat is, uwen rijkdom, uwe staten en ambten, die u groot en aanzienlijk maken voor de wereld, waar wilt gij die brengen, dat zij de uwe blijven en u niet afgenomen worden?"}],"4":[{"catchword":"niet zou buigen","tekst":"Anders: zonder mij zullen zij zich buigen, enz. ontbloot zijnde van mijne hulp. Hier spreekt God nog steeds de onrechtvaardige rechters aan. Anders: zonder dien, of behalve dien, die zich lager dan de gevangene zal buigen, zullende ook onder de verslagenen vallen; dat is, zij zullen niet alleen gevankelijk weggevoerd worden, maar behalve die, zullen er ook enigen doodgeslagen worden."}],"5":[{"catchword":"den Assyriër,","tekst":"Hebreeuws, Assur; welk woord somtijds de nakomelingen van Assur betekent, somtijds het land van Assyrië; hier betekent het den koning van Assyrië met zijn leger."},{"catchword":"roede","tekst":"Dat is, die Ik in mijnen toorn wil gebruiken als ene roede om mijn volk te kastijden. Zie Job 9:34 ."},{"catchword":"en Mijn grimmigheid","tekst":"Alsof God zeide: Ofschoon Ik in mijnen toorn aan de Assyriërs de macht geef om mijn volk te slaan; zo zal Ik hen evenwel ook straffen."},{"catchword":"stok in hun hand","tekst":"Anders: O Assur, de roede mijns toorns en in wiens hand mijne grimmigheid een stok is."}],"6":[{"catchword":"hem zenden","tekst":"Te weten den koning van Assyrië met zijn heirleger."},{"catchword":"tegen een huichelachtig volk,","tekst":"Te weten tegen de tien stammen van Israël en tegen het volk van Juda, die zich wel voor mijn volk uitgeven en den uiterlijken godsdienst enigermate oefenen, maar inderdaad zijn zij huichelaars en spotters. Zie de aantekening Job 8:13 ."},{"catchword":"Ik zal hem bevel","tekst":"Dat is, Ik zal hem door een heimelijke inwendige beweging [volgens mijn rechtvaardig oordeel] alzo besturen en regeren. Zie de aantekening 2Sa 16:10 ."},{"catchword":"tegen het volk","tekst":"Dat is, tegen het volk, over hetwelk Ik zeer vergramd en verbolgen ben; of over hetwelk Ik mijne verbolgenheid zal uitstorten."},{"catchword":"den roof rove,","tekst":"Of een buit buite en een roof rove."},{"catchword":"het ter vertreding,","tekst":"Te weten het huichelachtige volk."}],"7":[{"catchword":"zo niet meent,","tekst":"Hebreeuws, zich zo niet inbeeldt; te weten, dat Ik hem zend om een huichelachtig volk te straffen; hij heeft veeleer een ander oogmerk in dezen krijg, dien hij den Joden aandoet, dan Ik heb; maar Ik zal het alles regeren naar mijn heiligen wil en heimelijken raad."},{"catchword":"maar hij zal","tekst":"Hebreeuws, maar verdelgen is in zijn hart."}],"8":[{"catchword":"Zijn niet","tekst":"Alsof hij zeide: Ben ik niet die grootmachtige heerser, wien zelfs de koningen onderworpen zijn en ten dienste staan moeten? Zodat ik ben een koning der koningen. Zie dergelijk pochen 2Ki 18:24 , 2Ki 18:33 , enz., en 2Ki 19:10 , enz."}],"9":[{"catchword":"Is niet","tekst":"Alsof hij zeide: Hebben niet ik en mijn vader Salmanasser en andere mijner voorzaten, al deze machtige steden, zowel de ene als de andere, onder onze heerschappij en gebied gebracht? Zie 2Ki 18:34 ."},{"catchword":"Kalno","tekst":"Anders, Kalne, Gen 10:10 , en Amo 6:2 . Eenigen menen dat dit Seleucië is."},{"catchword":"Karchemis?","tekst":"Een stad, gelegen aan de rivier Eufraat, 2Ch 35:20 ; Jer 46:2 ."},{"catchword":"Hamath","tekst":"Zie Gen 10:18 ."},{"catchword":"Arfad?","tekst":"Zie 2Ki 18:34 ."}],"10":[{"catchword":"gevonden","tekst":"Dat is, overweldigd, verkregen, gelijk Job 31 . Zie aldaar de aantekening Job 31:25 ."},{"catchword":"der afgoden,","tekst":"Dat is, dergenen die de afgoden eren. Zie van het Hebreeuwse woord Elim Lev 19:4 ."},{"catchword":"ofschoon","tekst":"Of, en nochtans, of daar toch."},{"catchword":"beter","tekst":"Dat is, voortreffelijker."},{"catchword":"zijn,","tekst":"Of, waren."},{"catchword":"die van Jeruzalem","tekst":"Te weten, afgoden. Zie vs.11."}],"11":[{"catchword":"niet kunnen","tekst":"Alsof hij zeide: Ja ik zal het aan Jeruzalem nog veel lichter en beter kunnen doen."},{"catchword":"haar afgoden?","tekst":"Zie 1Sa 31:9 . De koning van Assyrië spreekt hier op zijn heidens, alsof hij te Jeruzalem met den godsdienst zulk ene gelegenheid gehad had als met der heidenen afgoden."}],"12":[{"catchword":"Want het zal","tekst":"Dit past op het wee, vs.5 over de Assyriërs gesproken. Want van vs.6 tot vs.12 heeft de profeet verhaald de trotse woorden des konings van Assyrië en zijn inval in der Israëlieten land."},{"catchword":"als de HEERE","tekst":"Dat is, als de Heere zijn volk genoegzaam door de Assyriërs zal getuchtigd hebben."},{"catchword":"Ik","tekst":"De Heere."},{"catchword":"te huis zoeken","tekst":"De straffen; zie de aantekening Gen 21:1 ."},{"catchword":"de vrucht","tekst":"Dat is, zijn godslasterlijk en vermetelijk roemen en pochen, hetwelk als een kwade vrucht uit zijn hovaardig gemoed spruit."},{"catchword":"van den koning","tekst":"Te weten van Sanherib."},{"catchword":"van de hoogheid","tekst":"Dat is, zijner hovaardige ogen."}],"13":[{"catchword":"Omdat hij","tekst":"Of, omdat hij zal gezegd hebben."},{"catchword":"want ik ben","tekst":"Of, dewijl ik kloekheid gebruikt heb."},{"catchword":"ik heb de landpalen","tekst":"Alsof hij zeide: De koninkrijken die tevoren ieder hunne grenzen hadden, die heb ik geheel ineengesmolten en mij onderdanig gemaakt."},{"catchword":"hun voorraad","tekst":"Of, hun gerede schatten; dat is, hun dierbaarste schatten."},{"catchword":"heb als een geweldige","tekst":"Dat is, ik heb de koningen en andere machtige heren van hunne staten gezet en vernederd."},{"catchword":"de inwoners","tekst":"Of, de bezitters."}],"14":[{"catchword":"vermogen","tekst":"Of, de macht, dat is den rijkdom."},{"catchword":"als een nest,","tekst":"Dat is, als vogels op de eieren in hun nest."},{"catchword":"ik heb het ganse","tekst":"Alsof hij zeide: Ik heb al hunne goederen en rijkdommen in mijne schatkamers gebracht."},{"catchword":"die een vleugel","tekst":"Te weten om te vluchten, of om mij tegenstand te doen. Alsof hij zeide: Zij zijn van mij zo verschrikt geweest, dat zij zich tegen mij niet repten noch roerden."},{"catchword":"den bek","tekst":"Of, den mond opende."},{"catchword":"piepte","tekst":"Of, kirde, schaterde, kikte, te weten om ergens hulp te gaan zoeken, of om aan iemand over mij te klagen."}],"15":[{"catchword":"Zal","tekst":"Tot hiertoe zijn beschreven de woorden van den koning van Assyrië; nu spreekt de profeet wederom, en het is zoveel alsof hij zeide: Is het billijk, dat zich een bijl beroeme tegen, enz. Hij wil zeggen: Geenszins. Versta hierbij: Alzo heeft de koning van Assyrië geen reden tegen den Heere te pochen, die hem gebruikt heeft als een bijl, zaag, enz."},{"catchword":"een bijl . . . een zaag","tekst":"Aldus worden de Assyriërs genoemd, omdat God hen als instrumenten gebruikt heeft om de Joden te tuchtigen en te kastijden; tegelijk verwijt hier God de Heere den Assyriër zijne vermetelheid en zijn grootspreken, waarvan vs.13,14 te lezen is."},{"catchword":"pochen","tekst":"Of, zich verheffen. Hebreeuws, groot maken."},{"catchword":"die ze trekt?","tekst":"Of, die ze beweegt?"},{"catchword":"bewoog","tekst":"Versta hierbij, alzo ongerijmd zou het zijn indien zulks geschiedde."},{"catchword":"Als men een stok","tekst":"Alsof God zeide: Zou een stok zich beroemen omdat iemand hem opheft, daar het toch een stuk hout is en blijft?"}],"16":[{"catchword":"zijn","tekst":"Te weten de koning van Assyrië."},{"catchword":"vetten","tekst":"Versta hier door de vetten de vorsten en voortreffelijkste oversten van den koning van Assyrië, waar hij zo hoog op pocht."},{"catchword":"magerheid","tekst":"Dat is, een uitterende ziekte; zie de aantekening Psa 106:15 . Of hij wil zeggen, dat hen de Heere zal verdelgen en teniet maken. Zie 2Ki 19:35 ."},{"catchword":"onder","tekst":"Anders: in plaats zijner heerlijkheid zal Hij, enz."},{"catchword":"zijn heerlijkheid","tekst":"Aldus wordt hier genoemd het leger van den koning van Assyrië, omdat hij daarop zeer pochte."},{"catchword":"een brand","tekst":"Te weten als hij door een engel met pestilentie zullen verslagen worden. Vergelijk hiermede de geschiedenis 2Sa 24:16 ."}],"17":[{"catchword":"het Licht","tekst":"Dat is, de Heere, die zijn volk verlicht door zijn Woord en Geest, als het in duistere ellenden en ook in geestelijke dwalingen vervallen zal wezen. Zie Psa 36:10 , en Psa 84:12 ."},{"catchword":"zal tot een vuur","tekst":"Dat is, de Heere zal de Assyriërs verteren, gelijk vuur en vlam het hout of stro verslinden."},{"catchword":"zijn","tekst":"Te weten van het volk van Israëls Heilige."},{"catchword":"Heilige","tekst":"Dat is, God, die het volk Israël heiligt en eert, en die zichzelven betuigt heilig te zijn. Zie boven Isa 1:4 ."},{"catchword":"tot een vlam,","tekst":"Te weten om de Assyriërs te verbranden en te verdelgen."},{"catchword":"zijn","tekst":"Te weten van den koning van Assyrië."},{"catchword":"doornen . . . distelen","tekst":"Dat is zijn krijgsvolk, groot en klein, heer en knecht, die de Joden gestoken, gekrabd en geplaagd hebben. Zie boven Isa 9:17 , en onder Isa 37:36 ."},{"catchword":"op een dag","tekst":"Dat is, op een korten tijd. Onder den dag wordt hier ook de nacht verstaan, want hetgeen hier gedreigd wordt, is in den nacht geschied; 2Ki 19:35 , en Isa 37:36 ."}],"18":[{"catchword":"Hij verteren","tekst":"Te weten de Heere."},{"catchword":"zijns","tekst":"Te weten van Sanherib, den koning van Assyrië."},{"catchword":"wouds","tekst":"Dat is, legers, hetwelk schijnt een dor woud te zijn, vanwege de menigte der spiesen en speren zijner soldaten. Anderen verstaan hier door het woud de prinsen en vorsten van den koning van Assyrië, die als sterke bomen geacht werden."},{"catchword":"zijns vruchtbaren velds;","tekst":"Dat is, zijner vette, geweldige, rijke vorsten. Anders, zijn Karmel; dat is, zijn land, dat zo schoon en vruchtbaar is als Karmel. Zie 2Ki 19:23 ."},{"catchword":"van de ziel af,","tekst":"Dat is, hij zal hun niet alleen de ziel, dat is het leven, benemen, maar hij zal ook hunne lichamen vernielen. Of versta door ziel de mensen; door vlees het vee."},{"catchword":"hij","tekst":"Te weten de koning van Assyrië."},{"catchword":"zal zijn,","tekst":"Dat is, het zal hem gaan."},{"catchword":"versmelt","tekst":"Of, bezwijmd, versaagd wordt, of bezwijkt; dat is, als hem het hart in het lijf van angst en vrees versmelt. Zie de vervulling 2Ki 19:36 , enz. Anders, wanneer een vluchtige versmelt."}],"19":[{"catchword":"de overgebleven","tekst":"Dat is, de overige soldaten van zijn leger, gelijk vs.18, inzonderheid de oversten, die ontkomen zullen uit het leger van Sanherib. Zie onder vs.33."},{"catchword":"weinig","tekst":"Zie de aantekening Gen 34:30 ."},{"catchword":"ja,","tekst":"Alsof hij zeide: Men zal er geen kloeken man, die in het rekenen geoefend is, toe behoeven, een kind zal hen lichtelijk kunnen tellen, want hunner zullen weinig zijn."}],"20":[{"catchword":"En het zal","tekst":"In dit vs. wijst de profeet het overblijfsel de vrucht en nuttigheid aan, ontstaande uit de boven verhaalde tuchtiging van het volk van Juda door Sanherib, alsook de verlossing uit zijne macht en geweld."},{"catchword":"het overblijfsel","tekst":"Te weten die door de Assyriërs niet zullen omgebracht zijn."},{"catchword":"de ontkomenen","tekst":"Hebreeuws, de ontkoming des huizes van Jakob."},{"catchword":"niet meer steunen","tekst":"Dat is, hun voortaan niet meer verlaten op, enz."},{"catchword":"op dien,","tekst":"Te weten op den koning van Assyrië, dewijl hij hen bedrogen heeft. Zie boven Isa 7:20 ; 2Ki 16:7 ; 2Ch 28:20 ."},{"catchword":"den Heilige Israëls,","tekst":"Zie boven vs.17, en Isa 1:4 , en Isa 5:19 , Isa 5:24 , enz."},{"catchword":"oprechtelijk","tekst":"Hebreeuws, in der waarheid; dat is, zonder huichelarij."}],"21":[{"catchword":"Het overblijfsel","tekst":"Dat is, de overgeblevenen. Hebreeuws, Schear Jaschub, ziende op den naam, dien de profeet zijnen zoon gegeven heeft, uit het bevel Gods, boven Isa 7:3 ; zie de aantekening aldaar. En versta hier door de overgeblevenen de uitverkorenen Gods onder de Joden, die God uit den algemenen ondergang gered had, en die met waar geloof op God vertrouwden en volstandig bleven."},{"catchword":"zal wederkeren,","tekst":"Of, bekeerd worden, namelijk tot den sterken God."},{"catchword":"het overblijfsel van Jakob,","tekst":"Als straks."}],"22":[{"catchword":"Want","tekst":"Alsof hij zeide: Ofschoon het volk van Israël veel is, zo zullen zij niet allen bekeerd noch zalig worden; maar alleen enigen, die God in Christus heeft uitverkoren. Zie Rom 9:27 . Evenals het toegegaan is ten tijde als de Assyriërs de Israëlieten hebben overvallen en geslagen; verre het grootste deel is gevangen en omgekomen."},{"catchword":"gelijk het zand","tekst":"Te weten in groten getale."},{"catchword":"daarvan","tekst":"Of, deszelven."},{"catchword":"de","tekst":"Of de juiste verdelging, en alzo vs.23. Dat is, het verderf in den heimelijken raad Gods bestemd, in welken Hij besloten heeft hoevelen van de Israëlieten er zouden verdelgd worden, en welke."},{"catchword":"verdelging","tekst":"Te weten der ongehoorzame Joden, zo uiterlijke en lichamelijke, alsook inwendige en geestelijke. Gelijk af te nemen is uit den zin der woorden van den apostel Paulus; Rom 9:27-28 ; waar de apostel deze woorden bijbrengt."}],"24":[{"catchword":"en hij zijn staf","tekst":"Anders: want Hij [te weten, God] zal zijnen staf voor u [dat is, tot uwe bescherming] opheffen."},{"catchword":"naar de wijze","tekst":"Verstaat men door hij in het voorgaande lid den koning van Assyrië, zo is dit te zeggen: Gelijk de Egyptenaars eertijds gedaan hebben; maar verstaat men door hij God den Heere, zo is dit de zin: Gelijk God de Egyptenaars eertijds geplaagd heeft. Alzo ook onder vs.26."}],"25":[{"catchword":"Want nog","tekst":"Anders: Maar nog een weinig, een luttel, zo zal de gramschap [over u] een einde nemen, maar mijn toorn zal [ontsteken] tot hunne vernieling."},{"catchword":"een klein weinig,","tekst":"Dat is, in zeer korten tijd, te weten, kort nadat de koning van Assyrië met zijn leger in het Joodse land zal gekomen zijn."},{"catchword":"hun","tekst":"Te weten der Assyriërs."},{"catchword":"vernieling","tekst":"Of, uitroeiing, verderving, of verdelging."}],"26":[{"catchword":"tegen hem","tekst":"Te weten tegen den koning van Assyrië."},{"catchword":"een gesel","tekst":"Te weten vooreerst den slaanden engel, en straks daarna van den koning van Assyrië's eigen zonen; zie 2Ki 19:35 , 2Ki 19:37 ."},{"catchword":"gelijk de slachting","tekst":"Dat is, gelijk eertijds de Midianieten door Gideon plotseling zijn overvallen geweest; Jdg 7:19 , enz.; Isa 9:3-4 ."},{"catchword":"de rots van Oreb;","tekst":"Gelegen bij Bethabara aan de Jordaan, die de rots Oreb genoemd wordt, omdat Oreb, een van de vorsten der Midianieten, aldaar van Gideon is verslagen. Zie Jdg 7:24-25 ."},{"catchword":"gelijk","tekst":"De zin is: Gelijk Farao met zijn leger in de Rode zee is omgekomen als Mozes zijnen staf ophief, alzo zullen ook de Assyriërs in het verderf vervallen en omkomen."},{"catchword":"naar de wijze","tekst":"Zie de aantekening boven vs.24."}],"27":[{"catchword":"zijn last","tekst":"Te weten de last, dien de koning van Assyrië ulieden heeft opgelegd."},{"catchword":"verdorven worden,","tekst":"Of, in stukken gehouwen, of verscheurd worden; dat is te schande of teniet gemaakt worden."},{"catchword":"om des Gezalfden wil","tekst":"Hebreeuws, om, of vanwege de olie; te weten, waarmede de gezalfde des Heeren zou gezalfd worden, dat is, om Christus' wil, welken God tot een koning over zijn volk gezalfd en gesteld heeft. Vergelijk boven Isa 9:3 , Isa 9:5 ."}],"28":[{"catchword":"Hij komt","tekst":"Te weten Sanherib, de koning van Assyrië, met zijn leger. Hier beschrijft verder de profeet den tocht van Sanherib, als hij trekken zou om Jeruzalem te gaan belegeren, mitsgaders welke steden hij onderweg zou innemen en plunderen."},{"catchword":"Ajath,","tekst":"Of, Ai; zie van deze stad Jos 7:2 , en Jos 8 ."},{"catchword":"Migron;","tekst":"Zie 1Sa 14:2 ."},{"catchword":"Michmas","tekst":"Zie 1Sa 13:2 , en 1Sa 14:5 ."},{"catchword":"legt hij zijn","tekst":"Hebreeuws, Michmas beveelt hij zijne vaten, of bagage. Anders: te Michmas monstert hij zijn gereedschap; te weten den trein van oorlog."}],"29":[{"catchword":"den doorgang,","tekst":"Dat is, de engten der bergen bij Michmas, door welke men gaan moest als men uit Efraïm naar den stam van Benjamin reisde. Zie 1Sa 13:23 . Anders: in de rustplaats, of in de herberg te Geba vernachten zij."},{"catchword":"Geba","tekst":"Van Geba, zie 1Sa 14:5 ."},{"catchword":"Rama","tekst":"Dat is, de burgers te Rama beven; te weten van wege de aankomst der Assyriërs. Zie van Rama Jos 18:25 ."},{"catchword":"Gibea Sauls vlucht","tekst":"Dat is, de burgers te Gibea Sauls. Van deze stad wordt ook gesproken 1Sa 11:4 ; aldus genoemd omdat de koning Saul daar geboren was. Zie 1Sa 10:26 ."}],"30":[{"catchword":"Roep","tekst":"Hebreeuws eigenlijk neit, (bries) gelijk de paarden; dat is, verhef uwe stem en schreeuw luide."},{"catchword":"gij dochter","tekst":"Jeruzalem was de moederstad, de kleine steden werden dochters genoemd. Hier wordt gesproken van de inwoners van Gallim, een stad in den stam van Benjamin gelegen, gelijk ook de steden van welke vs.31 gesproken wordt."},{"catchword":"laat ze horen","tekst":"Anders: O gij arme Anathoth, laat u horen tot Laïs toe. Of aldus: Merk op, o Laïs."},{"catchword":"Laïs toe,","tekst":"Eene stad, gelegen aan het uiterste van het Joodse land. Zie Jdg 18:14 , Jdg 18:27-28 ."},{"catchword":"Anathoth","tekst":"Eene stad in Benjamin, waar de profeet Jeremia geboren is, drie mijlen van Jeruzalem gelegen. Zie Jos 21:8 , en Jer 1:1 ."}],"31":[{"catchword":"Madmena","tekst":"Dat is, burgers van Madmena."},{"catchword":"vliedt weg,","tekst":"Te weten uit vrees der vijanden, die aan komen marcheren."},{"catchword":"vluchten","tekst":"Of, verzamelen zich [om te vluchten]. Zie Jer 4:6 ."}],"32":[{"catchword":"blijft","tekst":"Hebreeuws, staande te Nob; te weten eer hij op Jeruzalem aankomt."},{"catchword":"hij te","tekst":"Te weten Sanherib met zijn leger."},{"catchword":"Nob;","tekst":"Een priesterlijke stad in Benjamin, bij Jeruzalem, 1 Sam. 21, 22."},{"catchword":"hij zal","tekst":"Rabsake vooruit zendende met grote macht van krijgsvolk, van Lachis naar Jeruzalem toe, trotseerde den koning Hizkia en de inwoners van Jeruzalem; Isa 36:2 ."},{"catchword":"bewegen","tekst":"Anders: opheffen, als dreigende."},{"catchword":"tegen den berg","tekst":"Dat is, tegen de stad Jeruzalem op en aan den berg Zion gelegen; gelijk boven Isa 1:8 ."},{"catchword":"der dochter","tekst":"Anders: des huizes Zions."},{"catchword":"den heuvel","tekst":"Op welken Jeruzalem gebouwd is."}],"33":[{"catchword":"met geweld","tekst":"Of, geweldiglijk. De zin is: Hij zal zijn leger verdelgen, niet allengskens, maar gezwind en met grote macht, gelijk men de grote takken der bomen met geweld afhouwt, te weten door een engel. Zie 2Ki 19:35 ."},{"catchword":"de takken","tekst":"Dat is, de sterke en geweldige krijgslieden in het heir van den koning van Assyrië."},{"catchword":"afkappen,","tekst":"Het Hebreeuwse woord betekent zoveel als de takken aftakken. Anders: afhakken. Vergelijk boven vs.19."},{"catchword":"die hoog","tekst":"Dat is, de vorsten in het leger van den koning van Assyrië."},{"catchword":"en de verhevenen","tekst":"Anders: dat is."}],"34":[{"catchword":"Hij zal","tekst":"Te weten de Heere."},{"catchword":"met ijzer","tekst":"Dat is, met het zwaard van den engel."},{"catchword":"de verwarde","tekst":"Gelijk boven Isa 9:17 ."},{"catchword":"de Libanon","tekst":"Dat is, de krijgslieden van den koning Sanherib, die zijn te vergelijken bij de bomen, die op den Libanon groeien, zo in grootte als in getal."},{"catchword":"door den Heerlijke","tekst":"Versta hier door den Heerlijke God den Heere zelf, of zijn slaanden engel; zie de geschiedenis Isa 37:36 , of door den geweldige, of machtige; zie Psa 8:2 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Wo unto them that decree unrighteous decrees, and to the writers, that prescribe trouble. [That is, wo unto the unrighteous Judges and Law givers. (that decree) Or, ordain, prescribe. (and to the writers) Those that make and prescribe Laws, are the Rulers and Governors of the Land, against whom a two is here denounced. (that prescribe trouble) Or, labour; that is, such Laws and Ordinances, that cause trouble and grief unto the subjects]"}],"2":[{"catchword":null,"tekst":"To turn aside the poor from Judgement, and to take away the judgement of the afflicted ones of my people, [That is, that they may hinder poor people, that their cause (though never so just) be not heard, nor admitted, nor dispatched in judgement] that widows may be their prey, and that they may rob the fatherless. [Clean contrary to the Law of God, Exo 22:22.]"}],"3":[{"catchword":null,"tekst":"But what will ye do in the day of visitation, [That is, when I come to visit you in my wrath. Here the LORD speaketh unto the unrighteous Law-givers and Rulers] and of desolation, [To wit, of the desolation of your land. See 2 Kings 18.13.] (which) shall come from far? [To wit, from the King of Assyria. See above chap.9. vers.11,12.] to whom will ye flee for help? [As if he should say, there shall be no men in the world, that shall be able to help you] and where will ye leave your glory? [That is, your riches, your honours, and officers, which make you to be great and honourable in the sight of the world. Whither will ye bring them, that they may continue still to be yours, and be never taken away from you?]"}],"4":[{"catchword":null,"tekst":"That every one should not bow (down) under the prisoners, and fall under the slain? [Oth. Without me they shall bow (down) &c. Being bereaved of my help. Here the Lord speaketh still to all unrighteous Judges. Oth. Excepting him, or, besides him, that shall bow (down) lower then the prisoners, (some) shall also fall among the slain. That is, they shall not onely be carried away captive, but besides that, some shall also be slain and killed] For all this his anger turneth not away, but his hand is stretched out still."}],"5":[{"catchword":null,"tekst":"Wo to the Assyrian, [Hebr. Assur. Which word signifieth sometimes the posterity of Assur; sometimes the land of Assyria: Here it, signifieth the King of Assyria with his army] (who) is the rod of mine anger, [That is, whom in mine anger I will use as a rod to correct and chastise my people. See Job 9:34.] and mine indignation is a stick in their hand. [As if the Lord had said, Though in mine anger I give the Assyrians leave to punish and smite my people; yet notwithstanding I will also punish them. Oth. O Assur, the rod of mine anger, and in whose hand mine indignation is a stick, (or staff.)"}],"6":[{"catchword":null,"tekst":"I will send him [To with, the King of Assyria with his army] against an hypocritical people, [To wit, against the ten tribes of Israel, and against the people of Juda, who make a shew as if they were my people, and do in some measure practise the outward worship of God, but are in deed and in truth, meer hypocrites and scorners. See the annotate. Job 8:13.] and I will give him a charge [that is, I will (in my just judgement) so guide and direct him by a secret inward motion. See the annot. 2 Sam.16.vers.10.] against the people of my wrath: [That is, against the people, with whom I am exceeding angry and wroth: or, against the people upon whom I will pour out my fury and indignation] that he may spoil the spoil, and plunder the plundering, [Or, may prey a prey, and spoil a spoil] and make it [to wit, the hypocritical people] for a treading down, like the mire of the streets. [See above chap.5.vers.25.]"}],"7":[{"catchword":null,"tekst":"Howbeit he meaneth not so, [Heb. Doth not imagine so] neither doth his heart think so, [To wit, that I do send him to punish an hypocritical people: He hath a far other aim in this war, which he maketh against the Jews, then I have: but I will order and dispose all according to mine holy will and secret counsel] but he shall purpose in his heart to destroy, [Heb. But destroying is in his heart] and to cut off not a few nations."}],"8":[{"catchword":null,"tekst":"For he saith, Are not my Princes altogether Kings? [As if he said, Am not I that great and mighty Potentate, unto whom even Kings must be subject, and be fain to wait upon? So that I am a King of Kings. See the like boasting, 2 Kings 18.24,33, etc. And chap.19.10, etc.]"}],"9":[{"catchword":null,"tekst":"Is not Calno [Oth. Calno, Genes.10.10. and Amos 6.2. Some conceive that this is Seleucia] like Carchemis? [A City lying at, or by the river Euphrates, 2 Chron.35.20. Jer 46:2.] is not Hamath, [See Genes.10. vers.18.] like Arphad? [See 2 Kings 18.34.] is not Samaria like Damascus? [As if he said, Have not I, and my father Salmanassar, and other of my predecessors, subdued and brought under out power and dominion all these mighty Cities, both the one and the other? See 2 Kings 18.34.]"}],"10":[{"catchword":null,"tekst":"Like as mine hand hath found [That is, subdued, conquered, taken; as Job 31. See there the annotate. On vers.25.] the Kingdoms of the Idols, [that is, of those that worship Idols. See of the Hebrew word Elilim, Lev.19.on vers.4.] although [Or, and yet, or, whereas seeing] their carved images are [Or, were,] better, [that is, more excellent] then (those) [to wit, Idols. See v.11.] of Jerusalem, and then (those) of Samaria."}],"11":[{"catchword":null,"tekst":"Like as I have done to Samaria, and to her Idols, should I not be able to do so to Jerusalem, [As if he had said, yea, I shall be able to do it much better and easier to Jerusalem] and to her Idols? [See 1 Sam.31.on vers.9. The King of Assyria speaketh here like an heathen, as if the case were all one in the matter of worship performed at Jerusalem, as in the matter of heathenish Idolatry, or heathenish Idols]"}],"12":[{"catchword":null,"tekst":"For it shall come to pass, when the LORD shall have made an end of fall his work upon mount Zion: and at Jerusalem: then will I visit the fruit of the stoutness of the heart of the King of Assyria, and the pride of the haughtiness of his eyes. [This suiteth with the two denounced (vers.5.) against the Assyrians. For from v.6. unto this place, the prophet relateth the proud and lofty words of the King of Assyria, and his invasion into the Land of the Israelites. (When the LORD shall have made an end, &c.) That is, when the LORD shall have sufficiently corrected his people by the Assyrians. (then will I) to wit, the Lord. (visit) That is, punish. See the annotate. Genes.21.1. (the fruit of the stoutness of the heart of the King of Assyria,) that is, his blasphemous and presumptuous boasting and bragging, which as an evil fruit, sprang forth out of his proud and haughty mind. (of the King of Assyria) To wit, Sanherib. (and the pride of the haughtiness of his eyes.) That is, of his proud or haughty looks]"}],"13":[{"catchword":null,"tekst":"Because he said, by the strength of mine hand I have it, and by my wisdom; for I am understanding (or, prudent:) [Or, because I have used prudence, or, wisdom] and I have taken away the borders of the nations, [As if he said, the Kingdoms, which heretofore had everyone their distinct borders and limits, them I confounded together, and made them subject unto me] and have robbed their store, [Or, their ready treasures; that is, their precious treasures] and have like a valiant man caused the inhabitants [Or, the possessors] to come down. [That is, I have deposed Kings and other great Lords from their places and dignities, and have brought them down]"}],"14":[{"catchword":null,"tekst":"And mine hand hath found the power [Or, the strength; that is, the riches] of the nations, as a nest, [that is, as birds sitting upon eggs in their nest] and I have scrapped all the earth together, as men do scrape eggs together, that are left: [As if he had said, I have brought all their goods and riches into my coffers and treasuries] and there was none, that moved a wing. [To wit, to flee away, or to oppose me: as if he had said, they were so afraid of me, that they durst not stir, nor move against me] or opened the bill [Or, mouth] or piped. [Or, muttered, chattered, whispered; to wit, to go any where to seek for help, or to make complaint to any one against me.]"}],"15":[{"catchword":null,"tekst":"Shall an axe boast it self against him that heweth therewith? Shall a saw vaunt against him that pullet it? [Hitherto are described the words of the King of Assyria: now the Prophet speaketh again; and it is as much as if he had said: Is it meet that an axe should boast it self against, etc. As if he should say, in no wise. Understand withal, so neither hath the King of Assyria cause to boast against the LORD, who useth him as an axe saw, etc. (Shall an axe, &c. Shall a saw, &c.) So the Assyrians are called, because God useth them as instruments to chastise and correct the Jews. Likewise the Lord here upbraideth the Assyrian with his presumption, and with his proud and lofty language , mentioned, vers.13,14. (shall a saw vaunt) Or, lift up it self. Hebr. magnify it self. (against him that pulleth, or, draweth it?) Or, that moveth it?] as if a staff moved them, that lift it up? [Understand withal, so absurd would it be if such a thing should happen] when a stick is lifted up, is it not wood? [As if the LORD should say, should a stick or a staff boast it self, because some body doth lift it up? Whereas it is, and still continueth but a piece of wood]"}],"16":[{"catchword":null,"tekst":"Therefore shall the LORD Lord of Hosts send among his [To wit, the King of Assyria&acirc;&euro;&trade;s] Fat ones [Understand here by fat ones, the Princes and chiefest Commanders of the King of Assyria, of whom he bragged so much[ leanness: [That is, a wasting or consuming sickness. See Ps.106. the annot. On v.15. Or, he implyeth that the Lord shall destroy them, & bring them to nothing. See 2 Kings 19.25.] and his glory [So is the army of the King of Assyria here called, because he boasted exceedingly of it] he shall cause a burning to burn, like a burning of a fire. [Oth. Instead of his glory he shall, &c. (he shall cause a burning to burn, &c.) To wit, when by an Angel they shall be smitten with the pestilence. Compare herewith 2 Sam.24.16. See below chap.24.6.]"}],"17":[{"catchword":null,"tekst":"For the light off Israel [That is, the Lord, who enlighteneth his people by his word and spirit, when they are fallen into dark miseries, and likewise into spiritual errors. See Psal.36.on vers.10. and 84.12.] shall be for a fire, [That is, the Lord shall devour and consume the Assyrians, as the fire and flame devour wood or straw] and his holy one [To wit, the people of Israel&acirc;&euro;&trade;s holy one. By Holy one, is meant God, whom the people of Israel halloweth and honoureth, and who doth testify himself to be holy. See above chap.1.on vers.4.] for a flame, [To wit, to burn and consume the Assyrians] which shall set on fire and consume his [To wit, the King of Assyrias] thorns, and his briers [That is, his souldiers, both great and small, Lord and servant, that like thorns and briers; have pricked, scratched, and plagued the Jews. See above chap.9.17. and below chap.37.36.] in one day. [That is, in a short time. Under the day, is here also meant the night, for that which is here threatened, came to pass, or was performed in the night, 2 Kings 19.35. and Isai.37.36.]"}],"18":[{"catchword":null,"tekst":"Also he [To wit, the Lord] shall consume, the glory of his [To wit, Sanheribs the King of Assyrias] forest, [That is, camp, which seemeth to be a dry and withered forest, by reason of the multitude of spears and lances of his souldiers. Others understand here by the forest, the Princes and Peers of the King of Assyrian, who were esteemed as strong trees] and of his fruitful field, [That is, of his fat, rich, and mighty Princes. Oth. Of his Carmel; that is, of his land, which is as fair and fruitful as Carmel. See 2 Kings 19.23.] from the soul to the flesh: [That is, he shall also destroy their bodies. Or, understand hereby soul, men; by flesh, cattle] and he [To wit, the King of Assyria] shall be [That is, it shall go with him] like as when a standard-bearer melteth. [Or, swooneth, is daunted, amazed, or fainteth; that is, when his heart melteth in his body, through anguish and fear. See the accomplishment hereof, 2 Kings 19,36, etc. Oth. When a fleeing person melteth]"}],"19":[{"catchword":null,"tekst":"And the rest of the trees of his forest, [That is, the residue of the souldiers of his camp or army, as v.18.especially the Commanders that shall escape of Sanheribs camp. See below vers.33.] shall be few in number, [See the annotate. Genes.34.on vers.30.] yea, a youth might write them down. [As if he said, there shall be no need of an able man, that is a good accompany, to number them, a very child will be able to do it easily; for they shall be so few in number."}],"20":[{"catchword":null,"tekst":"And it shall come to pass in that day, that the remnant of Israel, and the escaped ones of the house of Jacob, shall lean no more upon him that smote them: but shall lean upon the LORD the Holy one of Israel, uprightly. [In this verse the prophet sheweth unto the remnant, the fruit and benefit that did arise from the above-mentioned chastening of the people of Juda by Sanherib, as also the fruit and benefit of their deliverance from his hand and power. (And it shall come to pass, &c. That the remnant of Israel) To wit, those that shall not be slain by the Assyrians. (and the escaped ones of the house of Jacob) Hebr. The escaping of the house of Jacob. (shall lean no more upon him that smote them) That is, shall henceforth rely no more upon the King of Assyria; forasmuch as he deceived them. See above chap.7.20. and 2 Kings 16.7. and 2 Chr.28.20. (but they shall rely upon the LORD, the Holy one of Israel) See of this title, the Holy one of Israel, above vers.17. and chap.1.4. and 5.19,24, etc. (uprightly.) Hebr. In truth; that is, without hypocrisy]"}],"21":[{"catchword":null,"tekst":"The remnant shall return, [That is, those that are left, or, the remaining shall return. Hebr. Schear Jaschub, alluding to the name which the Prophet gave to his son, at Gods appointment, above chap.7.3. See the annotate. There. And understand here by those that were left, or remained, the elect of God among the Jews, whom God had delivered or redeemed from the universal ruine and destruction, and who relied upon God by true and lively faith, and continued stedfast and constant; (shall return) Or, be converted; namely to the strong God, as immediately followeth] the remnant of Jacob, unto the strong God."}],"22":[{"catchword":null,"tekst":"For though thy people, O Israel be as the sand of the sea, [To wit, in multitude, or in great number] (yet but) a remnant of them [Or, of it] shall return: [As if he had said, though the people of Israel be many, yet they shall not all be converted: But onely some, whom God hath chosen in Christ. See Rom 9:27. Even as it fell out at that time, when the Assyrians fell upon the Israelites, and smote, them, the greatest part by far were taken captive and slain] the destruction [Or, the precise destruction. So vers.23. (the destruction) To wit, of the disobedient Jews, as well outward and temporal, as inward and spiritual, as well outward and temporal, as inward and spiritual, as may be gathered from the meaning of the Apostle Pauls words, Rom 9:27,28. Where the Apostle alledgeth these words of the Prophet] is firmly decreed, [That is, the destruction is surely appointed and determined in the secret counsel of God, wherein he hath decreed how many of the Israelites should be destroyed, and which of them] overflowing with righteousness."}],"23":[{"catchword":null,"tekst":"For the Lord LORD of Hosts, shall make a destruction, which is firmly decreed, in the midst of all this land, [Compare below chap.28.22.]"}],"24":[{"catchword":null,"tekst":"Therefore thus saith the Lord LORD of hosts, Thou my people, that dwelleth in Zion, be not afraid of Assur, when he shall smite thee with the rod, and (when) he shall lift up his staff for thee; that is, (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});
