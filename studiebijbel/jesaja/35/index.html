nwege deze grote menigte; want de strijd is niet van u, maar van God.", "Ps 145:18-21": "Koph. De HEERE is nabij allen die Hem aanroepen, allen die Hem aanroepen in waarheid. Resch. Hij doet het welbehagen van hen die Hem vrezen, en Hij hoort hun geroep, en verlost hen. Schin. De HEERE bewaart allen die Hem liefhebben; maar Hij verdelgt alle goddelozen.", "Ps 47:8": "Want God is een Koning van de hele aarde; zingt psalmen met verstand!", "Jes 46:4": "En tot de ouderdom toe zal Ik Dezelfde zijn, ja, tot de grijsheid toe zal Ik u dragen; Ik heb het gedaan, en Ik zal u opnemen, en Ik zal dragen en redden.", "Jes 52:12": "Want u zult niet haastig weggaan, en ook niet vluchtend heengaan; want de HEERE zal voor uw aangezicht heentrekken, en de God van Israël zal uw achterhoede zijn.", "Rom 7:6": "Maar nu zijn wij vrijgemaakt van de wet, omdat wij gestorven zijn aan datgene waaronder wij vastgehouden werden; zodat wij dienen in nieuwheid van de Geest, en niet in de oudheid van de letter.", "Jes 54:17": "Elk instrument dat tegen u gemaakt wordt, zal niet gelukken, en elke tong, die in het gericht tegen u opstaat, zult u verdoemen; dit is het erfdeel van de knechten van de HEERE, en hun gerechtigheid is uit Mij, spreekt de HEERE.", "Ps 51:17": "Heere, open mijn lippen, zo zal mijn mond Uw lof verkondigen.", "Hand 13:39": "En dat ieder die gelooft, door Hem gerechtvaardigd wordt van alles waarvan u niet gerechtvaardigd kon worden door de wet van Mozes.", "Matt 12:33-35": "Of maak de boom goed en zijn vrucht goed; of maak de boom slecht en zijn vrucht slecht; want aan de vrucht wordt de boom gekend. Adderengebroed! Hoe kunt u goede dingen spreken, terwijl u slecht bent? Want uit de overvloed van het hart spreekt de mond. De goede mens brengt goede dingen voort uit de goede schat van het hart, en de slechte mens brengt slechte dingen voort uit de slechte schat.", "1 Tess 2:12": "en betuigden dat u zou wandelen op een wijze die God waardig is, Die u roept tot Zijn Koninkrijk en heerlijkheid.", "Ps 116:11": "Ik zei in mijn haast: Alle mensen zijn leugenaars.", "Jes 41:27": "Ik, de Eerste, zeg tegen Sion: Zie, zie ze daar! En tegen Jeruzalem: Ik zal iemand geven die een blijde boodschap brengt.", "Joh 5:8": "Jezus zei tegen hem: Sta op, neem uw draagbed op, en loop.", "Hebr 10:38": "Maar de rechtvaardige zal uit het geloof leven; en als iemand zich terugtrekt, heeft Mijn ziel in hem geen behagen.", "Jes 19:23": "Op die dag zal er een gebaande weg zijn van Egypte naar Assyrië, zodat de Assyriërs in Egypte, en de Egyptenaars in Assyrië zullen komen; en de Egyptenaars zullen met de Assyriërs de Heere dienen.", "Matt 11:28-30": "Komt hier naar Mij toe, allen die vermoeid en belast zijn, en Ik zal u rust geven. Neem Mijn juk op u, en leer van Mij, dat Ik zachtmoedig ben en nederig van hart; en u zult rust vinden voor uw zielen. Want Mijn juk is zacht, en Mijn last is licht.", "Ef 1:6": "Tot prijs van de heerlijkheid van Zijn genade, waardoor Hij ons begenadigd heeft in de Geliefde;", "Jes 52:3": "Want zo zegt de HEERE: U bent voor niets verkocht, u zult ook zonder geld vrijgekocht worden.", "Jes 52:10": "De HEERE heeft Zijn heilige arm ontbloot voor de ogen van alle heidenvolken; en alle einden van de aarde zullen het heil van onze God zien.", "Mark 10:21": "En Jezus keek hem aan en had hem lief, en zei tegen hem: Eén ding ontbreekt u; ga heen, verkoop alles wat u hebt, en geef het aan de armen, en u zult een schat hebben in de hemel; en kom, neem het kruis op, en volg Mij.", "Hand 14:8-10": "En een zeker man te Lystre zat zonder kracht in zijn voeten, kreupel van de moederschoot af, die nooit had gelopen. Deze hoorde Paulus spreken; die zijn ogen op hem hield, en zag dat hij geloof had om gezond te worden, en zei met luide stem: Sta recht op uw voeten! En hij sprong op en liep.", "Jes 19:24": "Op die dag zal Israël de derde zijn met de Egyptenaren en met de Assyriërs, een zegen in het midden van het land.", "1 Kor 3:9": "Want wij zijn medearbeiders van God; akkerwerk van God, gebouw van God bent u.", "Spr 3:24-26": "Als u neerligt, zult u niet schrikken; maar u zult neerliggen en uw slaap zal zoet zijn. Vrees niet voor plotselinge schrik, of voor de verwoesting van de goddelozen, als die komt. Want de HEERE zal uw vertrouwen zijn, en Hij zal uw voet bewaren voor gevangenschap.", "Luk 1:47": "en mijn geest verheugt zich in God, mijn Zaligmaker;", "Ps 116:12-14": "Wat zal ik de HEERE vergelden voor al Zijn weldaden aan mij bewezen? Ik zal de beker der verlossingen opnemen, en de Naam van de HEERE aanroepen. Mijn geloften zal ik de HEERE betalen, nu, in de tegenwoordigheid van heel Zijn volk.", "Joh 6:47": "Voorwaar, voorwaar, Ik zeg u: wie in Mij gelooft, heeft het eeuwige leven.", "Jes 9:6": "De grootheid van deze heerschappij en van de vrede zal geen einde hebben op de troon van David en in zijn koninkrijk, om dat te bevestigen en te sterken met recht en met gerechtigheid, van nu af tot in eeuwigheid toe. De ijver van de HEERE van de heerscharen zal dit doen.", "Spr 1:33": "Maar die naar Mij hoort, zal zeker wonen, en hij zal gerust zijn van de vrees voor het kwaad.", "Spr 3:1-10": "Mijn zoon! Vergeet mijn wet niet, maar uw hart bewaart mijn geboden. Want lengte van dagen, en jaren van leven, en vrede zullen zij u vermeerderen. Laat de goedertierenheid en de trouw u niet verlaten; bind ze aan uw hals, schrijf ze op de tafel van uw hart.", "Ex 20:19": "en zij zeiden tegen Mozes: Spreek ú met ons, en wij zullen horen; en laat God niet met ons spreken, opdat wij niet sterven!", "Judas 1:21": "Bewaar uzelf in de liefde van God, terwijl u de barmhartigheid van onze Heere Jezus Christus verwacht, tot het eeuwige leven.", "Openb 7:9": "Hierna zag ik, en zie, een grote menigte, die niemand tellen kon, uit alle naties, en geslachten, en volken, en talen, die stond voor de troon en voor het Lam, bekleed met lange witte kleren, en takken van palmen waren in hun handen.", "2 Kron 20:17": "U zult in deze strijd niet hoeven te strijden; stel u op, blijf staan en zie het heil van de HEERE met u, o Juda en Jeruzalem! Wees niet bevreesd en wees niet ontzet, ga morgen op hen af, want de HEERE zal met u zijn.", "Ps 34:20-23": "Resch. Veel is de tegenspoed van de rechtvaardige; maar uit dat alles redt de HEERE hem. Schin. Hij bewaart al zijn beenderen; niet een daarvan wordt gebroken. Thau. De boosheid zal de goddeloze doden; en die de rechtvaardige haten, zullen schuldig verklaard worden.", "Ps 96:7-9": "Geeft de HEERE, geslachten van de volken! Geeft de HEERE eer en sterkte. Geeft de HEERE de eer van Zijn Naam; brengt een offer, en komt in Zijn voorhoven. Aanbidt de HEERE in de heerlijkheid van het heiligdom; beeft voor Zijn aangezicht, heel de aarde.", "Jes 35:4-6": "Zegt tegen de onbedachtzamen van hart: Wees sterk, en vrees niet; zie, uw God zal ter wrake komen met de vergelding van God. Hij zal komen en u verlossen. Dan zullen de ogen van de blinden opengedaan worden, en de oren van de doven zullen geopend worden. Dan zal de kreupele springen als een hert, en de tong van de stomme zal juichen; want in de woestijn zullen wateren uitbarsten, en beken in de wildernis.", "Zach 12:10": "Doch over het huis van David, en over de inwoners van Jeruzalem, zal Ik uitstorten de Geest van de genade en van de gebeden; en zij zullen Mij aanschouwen, Die zij doorstoken hebben, en zij zullen over Hem rouwklagen, zoals met de rouwklacht over een enige zoon; en zij zullen over Hem bitter kermen, zoals men bitter kermt over een eerstgeborene.", "Matt 20:28": "Zoals de Zoon des mensen niet gekomen is om gediend te worden, maar om te dienen, en Zijn ziel te geven tot een losprijs voor velen.", "1 Joh 5:20": "Maar wij weten dat de Zoon van God gekomen is, en ons het verstand gegeven heeft, opdat wij de Waarachtige kennen; en wij zijn in de Waarachtige, namelijk in Zijn Zoon Jezus Christus. Deze is de waarachtige God, en het eeuwige Leven.", "Ps 76:5": "U bent doorluchtiger en heerlijker dan de roofbergen.", "1 Kron 12:8": "Ook scheidden zich van de Gadieten af naar David, in die vesting bij de woestijn, kloeke helden, krijgslieden voor de oorlog, toegerust met rond schild en lang schild; en hun gezichten waren als de gezichten van leeuwen, en zij waren zo snel als de reeën op de bergen.", "Ps 126:5": "Die met tranen zaaien, zullen met gejuich maaien.", "Jes 19:6": "Zij zullen ook de rivieren ver terugdrijven, zij zullen ze uithozen, en de opgedamde stromen opdrogen; het riet en het schilf zullen verwelken.", "Ezech 37:1-14": "De hand van de HEERE was op mij, en de HEERE voerde mij uit in de geest, en zette mij neer in het midden van een vallei; die was nu vol beenderen. En Hij deed mij daar helemaal omheen voorbijgaan; en zie, er waren er zeer veel op de grond van de vallei; en zie, ze waren zeer dor. En Hij zei tot mij: Mensenkind! Zullen deze beenderen levend worden? En ik zei: Heere HEERE, U weet het!", "Ps 22:23": "Zo zal ik Uw Naam aan mijn broeders vertellen; in het midden van de gemeente zal ik U prijzen.", "Rom 1:17": "Want de rechtvaardigheid van God wordt daarin geopenbaard uit geloof tot geloof; zoals geschreven is: Maar de rechtvaardige zal uit het geloof leven.", "Luk 12:32": "Wees niet bang, klein kuddeke, want het is het welbehagen van uw Vader om u het Koninkrijk te geven.", "Hand 16:14": "En een zekere vrouw, met de naam Lydia, een purperverkoopster uit de stad Thyatira, die God diende, hoorde ons; haar hart heeft de Heere geopend, zodat zij acht gaf op wat door Paulus gesproken werd.", "Ps 40:17": "Laat in U vrolijk en verblijd zijn allen die U zoeken; laat de liefhebbers van Uw heil voortdurend zeggen: De HEERE zij groot gemaakt!", "Joh 8:12": "Jezus sprak dan weer tegen hen en zei: Ik ben het licht van de wereld; wie Mij volgt, zal in de duisternis niet wandelen, maar zal het licht van het leven hebben.", "1 Petr 1:23": "u die opnieuw geboren bent, niet uit vergankelijk, maar uit onvergankelijk zaad, door het levende en eeuwig blijvende Woord van God.", "Ps 48:12": "Laat de berg Sion blijde zijn; laat de dochters van Juda zich verheugen, om Uw oordelen wil.", "Hos 14:6": "Ik zal Israël zijn als de dauw; hij zal bloeien als de lelie, en hij zal zijn wortels uitslaan als de Libanon.", "Ps 71:14": "Doch ik zal voortdurend hopen, en zal al Uw lof nog groter maken.", "Ps 145:1-21": "Een lofzang van David. Aleph. O mijn God, U Koning! Ik zal U verhogen, en Uw Naam loven voor eeuwig en altijd. Beth. Elke dag zal ik U loven, en Uw Naam prijzen voor eeuwig en altijd. Gimel. De HEERE is groot en zeer te prijzen, en Zijn grootheid is ondoorgrondelijk.", "Rom 12:9": "De liefde moet ongeveinsd zijn. Heb een afkeer van het kwade, en houd vast aan het goede.", "2 Tim 3:17": "opdat de mens van God volmaakt is, tot alle goed werk volmaakt toegerust.", "Ps 22:24": "U die de HEERE vreest, prijs Hem; al u nageslacht van Jakob, vereer Hem; en ontzie u voor Hem, al u nageslacht van Israël!", "Jes 63:16": "U bent toch onze Vader, want Abraham weet van ons niet, en Israël kent ons niet; U, o HEERE, bent onze Vader, onze Verlosser van ouds af is Uw Naam.", "Hand 8:7": "Want van velen die onreine geesten hadden, gingen die geesten uit, terwijl zij met luide stem riepen; en velen die verlamd en kreupel waren, werden genezen.", "Deut 5:24": "en u zei: Zie, de HEERE, onze God, heeft ons Zijn heerlijkheid en Zijn grootheid laten zien, en wij hebben Zijn stem gehoord uit het midden van het vuur; vandaag hebben wij gezien dat God met de mens spreekt, en dat hij levend blijft.", "1 Kon 8:58": "terwijl Hij ons hart tot Zich neigt, om in al Zijn wegen te wandelen, en om Zijn geboden te houden, en Zijn inzettingen, en Zijn rechten, die Hij onze vaderen geboden heeft.", "Ps 3:4": "Maar U, HEERE, bent een Schild voor mij, mijn eer, en Die mijn hoofd opheft.", "Zach 8:3": "Zo zegt de HEERE: Ik ben teruggekeerd naar Sion, en Ik zal in het midden van Jeruzalem wonen; en Jeruzalem zal genoemd worden een stad van de waarheid, en de berg van de HEERE van de heerscharen, een berg van heiligheid.", "Ef 5:14": "Daarom zegt Hij: Ontwaak, u die slaapt, en sta op uit de doden; en Christus zal over u lichten.", "Zef 2:11": "Vreselijk zal de HEERE tegen hen zijn, want Hij zal al de goden van de aarde doen uitteren; en ieder uit zijn plaats zal Hem aanbidden, alle eilanden van de heidenvolken.", "Ps 145:19": "Resch. Hij doet het welbehagen van hen die Hem vrezen, en Hij hoort hun geroep, en verlost hen.", "Joël 3:18": "En het zal op die dag gebeuren dat de bergen zullen druipen van zoete wijn, en de heuvels zullen stromen van melk, en alle stromen van Juda vol water zullen gaan; en er zal een bron uit het huis van de HEERE uitgaan, en die zal het dal van Sittim bewateren.", "Ps 89:16": "Gelukkig is het volk dat het geschal kent; o HEERE! zij zullen in het licht van Uw aangezicht wandelen.", "Jer 17:8": "Want hij zal zijn als een boom die aan het water geplant is, en zijn wortels uitschiet aan een rivier, en merkt het niet wanneer er hitte komt, maar zijn loof blijft groen; en in een jaar van droogte zorgt hij niet, en houdt niet op vrucht te dragen.", "1 Joh 3:6-10": "Ieder die in Hem blijft, zondigt niet; ieder die zondigt, heeft Hem niet gezien en heeft Hem niet gekend. Kinderen, laat niemand u verleiden. Die de rechtvaardigheid doet, is rechtvaardig, zoals Hij rechtvaardig is. Die de zonde doet, is uit de duivel; want de duivel zondigt vanaf het begin. Hiertoe is de Zoon van God geopenbaard, opdat Hij de werken van de duivel zou verbreken.", "Jer 24:7": "En Ik zal hun een hart geven om Mij te kennen, dat Ik de HEERE ben; en zij zullen Mij tot een volk zijn, en Ik zal hun tot een God zijn; want zij zullen zich tot Mij bekeren met hun hele hart.", "Neh 9:5": "En de Levieten, Jesua, en Kadmiel, Bani, Hasabneja; Serebja, Hodia, Sebanja, Petahja, zeiden: Sta op, loof de HEERE, uw God, van eeuwigheid tot in eeuwigheid; en men love de Naam van Uw heerlijkheid, die verhoogd is boven alle lof en prijs!", "Ps 138:1": "Een psalm van David. Ik zal U loven met mijn hele hart; in de tegenwoordigheid van de goden zal ik U psalmzingen.", "Joh 7:37-39": "En op de laatste dag, zijnde de grote dag van het feest, stond Jezus en riep: Als iemand dorst heeft, laat hij tot Mij komen en drinken. Wie in Mij gelooft, zoals de Schrift zegt: stromen van levend water zullen uit zijn buik vloeien. (En dit zei Hij van de Geest, die zij die in Hem geloven zouden ontvangen; want de Heilige Geest was er nog niet, omdat Jezus nog niet verheerlijkt was.)", "Zach 14:8-21": "Ook zal het op die dag gebeuren, dat er levend water uit Jeruzalem zal vloeien, de helft daarvan naar de oostzee, en de helft daarvan naar de achterste zee toe; het zal 's zomers en 's winters zijn. En de HEERE zal Koning zijn over de hele aarde; op die dag zal de HEERE één zijn, en Zijn Naam één. Dit hele land zal rondom als een vlak veld gemaakt worden, van Geba tot Rimmon toe, zuidwaarts van Jeruzalem; en zij zal verhoogd en bewoond worden op haar plaats; van de poort van Benjamin af, tot aan de plaats van de eerste poort, tot aan de Hoekpoort toe; en van de toren van Hananeel, tot aan de wijnbakken van de koning toe.", "Luk 14:16-24": "Maar Hij zei tegen hem: Een zeker mens bereidde een groot avondmaal, en nodigde er velen voor uit. En hij stuurde zijn dienstknecht op het uur van het avondmaal om tegen de genodigden te zeggen: Kom, want alles is nu klaar. En zij begonnen allen eensgezind zich te verontschuldigen. De eerste zei tegen hem: Ik heb een akker gekocht, en ik moet er wel op uitgaan om die te bekijken; ik vraag u, houd mij voor verontschuldigd.", "1 Kor 1:9": "God is getrouw, door Wie u geroepen bent tot de gemeenschap van Zijn Zoon Jezus Christus, onze Heere.", "Ps 50:15": "En roept Mij aan in de dag van benauwdheid; Ik zal u eruit helpen, en u zult Mij eren.", "Ps 21:14": "Verhoog U, HEERE! In Uw sterkte; zo zullen wij zingen, en Uw macht met psalmen loven.", "Deut 33:26": "Niemand is er gelijk God, o Jeschurun! Die op de hemel vaart tot uw hulp, en met Zijn hoogheid op de bovenste wolken.", "Ef 2:14": "Want Hij is onze vrede, Die deze beiden één gemaakt heeft, en de scheidsmuur die tussen ons in stond, afgebroken heeft,", "Jak 1:27": "De zuivere en onbevlekte godsdienst voor God en de Vader is deze: wezen en weduwen bezoeken in hun verdrukking, en zichzelf onbesmet bewaren van de wereld.", "Ps 119:16": "Ik zal mijzelf vermaken in Uw inzettingen; Uw woord zal ik niet vergeten.", "Hebr 12:10": "Want zij hebben ons wel voor een korte tijd gekastijd, zoals het hun goeddacht; maar Hij kastijdt ons tot ons nut, opdat wij Zijn heiligheid deelachtig zouden worden.", "Ps 102:21": "Om het zuchten van de gevangenen te horen, om los te maken de kinderen van de dood;", "Gen 28:15": "En zie, Ik ben met u, en Ik zal u behoeden overal waarheen u trekken zult, en Ik zal u terugbrengen naar dit land; want Ik zal u niet verlaten, totdat Ik gedaan heb wat Ik tot u gesproken heb.", "Dan 7:9-14": "Dit zag ik, totdat er tronen gezet werden, en de Oude van dagen Zich zette, Wiens kleed wit was als de sneeuw, en het haar van Zijn hoofd als zuivere wol; Zijn troon was vuurvonken, de raderen ervan een brandend vuur. Een vurige rivier vloeide, en ging voor Hem uit, duizendmaal duizenden dienden Hem, en tien duizendmaal tien duizenden stonden voor Hem; het gericht zette zich, en de boeken werden geopend. Toen keek ik toe vanwege de stem van de grote woorden, die die horen sprak; ik keek toe, totdat het dier gedood werd, en zijn lichaam vernietigd werd, en overgegeven om door het vuur verbrand te worden.", "Joh 6:37": "Alles wat de Vader Mij geeft, zal tot Mij komen; en wie tot Mij komt, zal Ik beslist niet buitensluiten.", "Ef 2:5": "heeft ons, ook toen wij dood waren door de misdaden, levend gemaakt met Christus; (uit genade bent u zalig geworden),", "Ps 112:4": "Zain. Voor de oprechten gaat het licht op in de duisternis; Cheth. Hij is genadig, en barmhartig, en rechtvaardig.", "Hos 1:7": "Maar over het huis van Juda zal Ik Mij ontfermen, en Ik zal ze verlossen door de Heere, hun God, en Ik zal ze niet verlossen door boog, noch door zwaard, noch door oorlog, door paarden noch door ruiters.", "Ezech 36:27": "En Ik zal Mijn Geest geven in het binnenste van u; en Ik zal maken dat u in Mijn inzettingen zult wandelen, en Mijn rechten zult bewaren en doen.", "Matt 12:17-21": "Opdat vervuld zou worden wat gesproken is door de profeet Jesaja, die zei: Zie, Mijn Knecht, Die Ik uitgekozen heb; Mijn Beminde, in Wie Mijn ziel een welbehagen heeft; Ik zal Mijn Geest op Hem leggen, en Hij zal het oordeel aan de heidenen verkondigen. Hij zal niet twisten, en niet roepen, en niemand zal Zijn stem op de straten horen.", "Rom 15:9": "en dat de heidenen God zouden verheerlijken vanwege de barmhartigheid; zoals geschreven is: Daarom zal ik U belijden onder de heidenen, en Uw Naam lofzingen.", "Kol 3:11": "waarin niet is Griek en Jood, besnijdenis en voorhuid, barbaar en Scyth, dienstknecht en vrije; maar Christus is alles en in allen.", "2 Petr 3:9": "De Heere stelt Zijn belofte niet uit (zoals sommigen dat als uitstel zien), maar Hij is geduldig voor ons, omdat Hij niet wil dat er iemand verloren gaat, maar dat allen tot bekering komen.", "Zach 8:20-23": "Zo zegt de HEERE van de heerscharen: Nog zal het gebeuren, dat de volken, en de inwoners van veel steden, komen zullen; En de inwoners van de ene stad zullen gaan naar de inwoners van de andere, en zeggen: Laten wij vlijtig heengaan om het aangezicht van de HEERE te smeken, en om de HEERE van de heerscharen te zoeken; ik zal ook heengaan. Zo zullen veel volken, en machtige heidenvolken komen, om de HEERE van de heerscharen te Jeruzalem te zoeken, en om het aangezicht van de HEERE te smeken.", "Matt 13:16": "Maar uw ogen zijn gelukkig, omdat zij zien, en uw oren, omdat zij horen.", "Openb 21:23": "En de stad heeft de zon en de maan niet nodig, om in haar te schijnen; want de heerlijkheid van God heeft haar verlicht, en het Lam is haar lamp.", "Matt 15:30": "En veel menigten kwamen tot Hem, met bij zich kreupelen, blinden, stommen, lammen, en veel anderen, en zij legden ze aan de voeten van Jezus; en Hij genas hen.", "Jer 31:12": "Daarom zullen zij komen, en op de hoogte van Sion juichen, en toevloeien tot het goede van de HEERE, tot het koren, en tot de most, en tot de olie, en tot de jonge schapen en runderen; en hun ziel zal zijn als een gewaterde hof, en zij zullen voortaan niet meer treurig zijn.", "Joël 2:1": "Waait op de bazuin te Sion, en roept luide op de berg van Mijn heiligheid; laat alle inwoners van het land beroerd zijn, want de dag van de HEERE komt, want hij is nabij.", "Hand 13:26": "Mannen broeders, kinderen van het geslacht van Abraham, en zij die onder u God vrezen, tot u is het woord van deze zaligheid gezonden.", "Ps 51:14": "Geef mij de vreugde van het heil weer; en de vrijmoedige geest ondersteunt mij.", "Rom 9:33": "zoals geschreven is: Zie, Ik leg in Sion een steen des aanstoots, en een rots der ergernis; en ieder die in Hem gelooft, zal niet beschaamd worden.", "Jes 18:7": "In die tijd zal de HEERE van de heerscharen een geschenk gebracht worden van het volk dat lang en glad is, en van het volk dat gevreesd is van oudsher tot nu; een volk van regel en regel, en van vertreding, welks land de rivieren beroven; naar de plaats van de Naam van de HEERE van de heerscharen, naar de berg Sion.", "Ps 66:1": "Een lied, een psalm, voor de koorleider. Juicht tot God, heel de aarde!", "Zach 12:8": "Op die dag zal de HEERE de inwoners van Jeruzalem beschutten; en wie onder hen struikelen zou, zal op die dag zijn als David; en het huis van David zal zijn als goden, als de Engel van de HEERE voor hun aangezicht.", "2 Kor 1:24": "Niet dat wij heerschappij voeren over uw geloof, maar wij zijn medewerkers van uw blijdschap; want u staat door het geloof.", "Jer 31:25": "Want Ik heb de vermoeide ziel dronken gemaakt, en Ik heb elke treurige ziel vervuld.", "2 Kor 1:21": "Maar Die ons met u bevestigt in Christus, en Die ons gezalfd heeft, is God;", "Zach 14:8": "Ook zal het op die dag gebeuren, dat er levend water uit Jeruzalem zal vloeien, de helft daarvan naar de oostzee, en de helft daarvan naar de achterste zee toe; het zal 's zomers en 's winters zijn.", "Joh 7:37": "En op de laatste dag, zijnde de grote dag van het feest, stond Jezus en riep: Als iemand dorst heeft, laat hij tot Mij komen en drinken.", "Ps 65:14": "De velden zijn bekleed met kudden, en de dalen zijn bedekt met koren; zij juichen, ook zingen zij.", "Ps 25:10-14": "Caph. Alle paden van de HEERE zijn goedertierenheid en waarheid, voor hun die Zijn verbond en Zijn getuigenissen bewaren. Lamed. Om Uw Naams wil, HEERE! zo vergeef mijn ongerechtigheid, want die is groot. Mem. Wie is de man, die de HEERE vreest? Hij zal hem onderwijzen in de weg, die hij zal hebben te verkiezen.", "2 Kor 5:18": "En dit alles is uit God, Die ons met Zichzelf verzoend heeft door Jezus Christus, en ons de bediening van de verzoening gegeven heeft.", "Ps 71:23": "Mijn lippen zullen juichen, wanneer ik U zal psalmzingen, en mijn ziel, die Gij verlost hebt.", "Spr 2:7": "Hij legt weg voor de oprechten een bestendig bezit; Hij is een schild voor hen die oprecht wandelen;", "2 Petr 1:3": "Omdat Zijn Goddelijke kracht ons alles geschonken heeft wat tot het leven en de godsvrucht behoort, door de kennis van Hem Die ons geroepen heeft tot heerlijkheid en deugd;", "Ps 112:6": "Caph. Zeker, hij zal in eeuwigheid niet wankelen; Lamed. de rechtvaardige zal in eeuwige gedachtenis zijn.", "Ezra 8:22": "Want ik schaamde mij om van de koning een leger en ruiters te vragen om ons te helpen tegen de vijand, op de weg; omdat wij tegen de koning gesproken hadden en gezegd: De hand van onze God is ten goede over allen die Hem zoeken, maar Zijn sterkte en Zijn toorn over allen die Hem verlaten.", "Jes 58:11": "En de HEERE zal u voortdurend leiden, en Hij zal uw ziel verzadigen in grote droogte, en uw beenderen sterk maken; en u zult zijn als een gewaterde hof, en als een springader van water, waarvan het water niet ontbreekt.", "Ex 3:17": "Daarom heb Ik gezegd: Ik zal u uit de verdrukking van Egypte opvoeren, naar het land van de Kanaänieten, en de Hethieten, en de Amorieten, en de Ferezieten, en de Hevieten, en de Jebusieten; naar het land dat overvloeit van melk en honing.", "Ps 134:2": "Hef uw handen op naar het heiligdom, en loof de HEERE.", "Ps 31:24": "Heb de HEERE lief, u, al Zijn gunstgenoten! Want de HEERE behoedt de gelovigen, en vergeldt overvloedig hem die hoogmoed bedrijft.", "Ps 76:10": "Toen God opstond ten oordeel, om alle zachtmoedigen van de aarde te verlossen. Sela.", "Joh 13:8": "Petrus zei tegen Hem: U zult mijn voeten niet wassen, in eeuwigheid niet! Jezus antwoordde hem: Als Ik u niet wast, hebt u geen deel met Mij.", "2 Tim 1:12": "Om deze reden lijd ik ook deze dingen, maar ik word niet beschaamd; want ik weet aan Wie ik geloofd heb, en ik ben verzekerd, dat Hij machtig is mijn pand, bij Hem weggelegd, te bewaren tot die dag.", "Job 22:25": "Ja, de Almachtige zal uw overvloedige goud zijn, en uw krachtig zilver zijn;", "Ps 118:28": "U bent mijn God, daarom zal ik U loven; o mijn God, ik zal U verhogen.", "Openb 14:1-5": "En ik zag, en zie, het Lam stond op de berg Sion, en met Hem honderdvierenveertigduizend, die de naam van Zijn Vader geschreven hadden op hun voorhoofden. En ik hoorde een stem uit de hemel, als een stem van veel water, en als een stem van een grote donderslag. En ik hoorde een stem van citerspelers, spelend op hun citers; en zij zongen als een nieuw lied voor de troon, en voor de vier dieren, en de oudsten; en niemand kon dat lied leren, dan de honderdvierenveertigduizend, die van de aarde gekocht waren.", "Matt 25:34": "Dan zal de Koning zeggen tegen hen die aan Zijn rechterhand zijn: Kom, u gezegenden van Mijn Vader! Beërf het Koninkrijk dat voor u bereid is vanaf de grondlegging van de wereld.", "Ps 103:20-22": "Loof de HEERE, Zijn engelen! U krachtige helden, die Zijn woord doet, en die gehoorzamen aan de stem van Zijn woord. Loof de HEERE, al Zijn heerscharen! U Zijn dienaars, die Zijn welbehagen doet! Loof de HEERE, al Zijn werken! Aan alle plaatsen van Zijn heerschappij. Loof de HEERE, mijn ziel!", "Jes 1:24": "Daarom spreekt de Heere, HEERE van de heerscharen, de Machtige van Israël: O wee! Ik zal Mij troosten over Mijn tegenstanders. Ik zal Mij wreken op Mijn vijanden.", "Hoogl 2:1": "Ik ben een roos van Saron, een lelie van de dalen.", "Ps 105:3": "Roemt in de Naam van Zijn heiligheid; het hart van hen die de HEERE zoeken, verblijde zich.", "Mark 9:41": "Want wie u een beker water te drinken zal geven in Mijn Naam, omdat u discipelen van Christus bent, voorwaar, Ik zeg u, hij zal zijn loon geenszins verliezen.", "Ps 68:21": "Die God is voor ons een God van volkomen zaligheid; en bij de HEERE, de Heere, zijn de uitkomsten tegen de dood.", "Ps 144:2": "Mijn Goedertierenheid en mijn Burg, mijn Hoog Vertrek en mijn Bevrijder voor mij, mijn Schild, en op Wie ik vertrouw; Die mijn volk aan mij onderwerpt!", "Jes 55:1-5": "O, alle dorstigen, kom tot de wateren, en u die geen geld heeft, kom, koop en eet, ja kom, koop zonder geld en zonder prijs, wijn en melk! Waarom weegt u geld uit voor wat geen brood is, en uw arbeid voor wat niet verzadigen kan? Hoor aandachtig naar Mij, en eet het goede, en laat uw ziel zich verlustigen in vettigheid. Neig uw oor, en kom tot Mij, hoor en uw ziel zal leven; want Ik zal met u een eeuwig verbond maken, en u geven de zekere weldaden van David.", "Ps 2:9": "U zult hen verpletteren met een ijzeren scepter; U zult hen in stukken slaan als een pottenbakkersvat.", "Ps 86:13": "Want Uw goedertierenheid is groot over mij; en Gij hebt mijn ziel uit het onderste van het graf gered.", "Ezech 47:1-11": "Daarna bracht hij mij terug naar de deur van het huis, en zie, er stroomde water uit van onder de drempel van het huis naar het oosten; want de voorkant van het huis lag naar het oosten, en het water daalde af van onderen, uit de rechterzijde van het huis, ten zuiden van het altaar. En hij bracht mij naar buiten door de noordpoort, en leidde mij rondom via de weg van buiten naar de buitenpoort, de weg die naar het oosten kijkt; en zie, het water sprong eruit aan de rechterzijde. Toen die man naar het oosten uitging, had hij een meetsnoer in zijn hand; en hij mat duizend el, en liet mij door het water gaan, en het water kwam tot aan de enkels.", "Deut 7:22": "En de HEERE, uw God, zal deze volken voor uw aangezicht geleidelijk uitwerpen; u zult hen niet snel mogen vernietigen, omdat anders de wilde dieren van het veld tegen u te veel worden.", "Rom 15:16": "opdat ik een dienaar van Jezus Christus zou zijn onder de heidenen, het Evangelie van God bedienend, opdat het offer van de heidenen aangenaam zou worden, geheiligd door de Heilige Geest.", "1 Kor 1:30": "Maar uit Hem bent u in Christus Jezus, Die voor ons geworden is wijsheid van God, en rechtvaardigheid, en heiligmaking, en verlossing;", "Jes 41:11": "Zie, zij zullen beschaamd worden en te schande gemaakt, allen die tegen u in woede ontstoken zijn; zij zullen worden als niets, en de mensen die met u twisten, zullen vergaan.", "Joh 15:5": "Ik ben de Wijnstok, en u de ranken; die in Mij blijft, en Ik in hem, die draagt veel vrucht; want zonder Mij kunt u niets doen.", "Ps 27:14": "Wacht op de HEERE, wees sterk, en Hij zal uw hart versterken; ja, wacht op de HEERE.", "Ps 20:6": "Wij zullen juichen over Uw heil, en de vaandels opsteken in de Naam van onze God. De HEERE vervult al uw verlangens.", "Ps 113:4": "De HEERE is hoog boven alle heidenvolken, boven de hemelen is Zijn heerlijkheid.", "Jes 33:13-24": "Hoort, u die ver weg bent, wat Ik gedaan heb; en u, die nabij bent, erken Mijn macht! De zondaars in Sion zijn verschrikt; beving heeft de huichelaars aangegrepen; zij zeggen: Wie onder ons kan bij een verterend vuur wonen? Wie onder ons kan bij een eeuwige gloed wonen? Wie in gerechtigheid wandelt, en wat recht is spreekt; wie de winst van onderdrukking verwerpt; wie zijn handen uitschudt, zodat zij geen geschenken vasthouden; wie zijn oor dichtstopt, zodat hij geen bloedschuld hoort, en zijn ogen dichtdoet; zodat hij het kwade niet aanziet;", "Job 5:11-27": "Om de vernederden te stellen in het hoge; dat de rouwdragenden door heil verheven worden. Hij maakt teniet de gedachten van de arglistigen; zodat hun handen niets uitrichten. Hij vangt de wijzen in hun arglistigheid; zodat de raad van de verdraaiden overhaast valt.", "Ef 3:6": "namelijk dat de heidenen medeerfgenamen zijn, en van hetzelfde lichaam, en mededeelgenoten van Zijn belofte in Christus, door het Evangelie;", "1 Kor 15:9": "Want ik ben de minste van de apostelen, die niet waardig ben een apostel genoemd te worden, omdat ik de Gemeente van God vervolgd heb.", "Jes 58:8-14": "Dan zal uw licht voortbreken als de dageraad, en uw genezing zal snel uitspruiten; en uw gerechtigheid zal voor uw aangezicht heengaan, en de heerlijkheid van de HEERE zal uw achterhoede zijn. Dan zult u roepen, en de HEERE zal antwoorden; u zult schreeuwen, en Hij zal zeggen: Zie, hier ben Ik. Als u uit uw midden wegdoet het juk, het uitsteken van de vinger, en het spreken van ongerechtigheid; En als u uw ziel opent voor de hongerige, en de bedrukte ziel verzadigt; dan zal uw licht in de duisternis opgaan, en uw donkerheid zal zijn als de middag.", "Jes 66:10-14": "Verblijd u met Jeruzalem, en verheug u over haar, al haar liefhebbers! Wees vrolijk over haar met vreugde, u allen die over haar hebt getreurd! Opdat u mag zuigen, en verzadigd worden van de borsten van haar vertroostingen; opdat u mag uitzuigen, en u verlustigen aan de glans van haar heerlijkheid. Want zo zegt de HEERE: Zie, Ik zal de vrede over haar uitstrekken als een rivier, en de heerlijkheid van de heidenen als een overlopende beek; dan zult u zuigen; u zult op de zijde gedragen worden, en op de knieën heel vriendelijk getroeteld worden.", "Matt 21:31": "Wie van deze twee heeft de wil van de vader gedaan? Zij zeiden tegen Hem: De eerste. Jezus zei tegen hen: Voorwaar, Ik zeg u, dat de tollenaars en de hoeren u voorgaan in het Koninkrijk van God.", "Jes 33:9": "Het land treurt, het kwijnt weg; de Libanon schaamt zich, hij verwelkt; Saron is geworden als een woestijn; zo zijn Basan en Karmel geschud.", "Jes 32:1-4": "Zie, een koning zal regeren in gerechtigheid, en de vorsten zullen heersen naar recht. En die man zal zijn als een schuilplaats tegen de wind, en een schuilplaats tegen de storm, als waterbeken in een dorre plaats, als de schaduw van een zware rotssteen in een dorstig land. En de ogen van hen die zien, zullen niet terugzien, en de oren van hen die horen, zullen opmerken.", "Spr 29:6": "In de overtreding van een boze man is een valstrik; maar de rechtvaardige juicht en is blij.", "Ezech 17:22": "Zo zegt de Heere HEERE: Ik zal ook van de opperste tak van de hoge ceder nemen, dat Ik zal planten; van de top van zijn jonge takjes zal Ik een teer takje afplukken, dat Ik op een hoge en verheven berg planten zal;", "Rom 8:32-39": "Hij Die zelfs Zijn eigen Zoon niet gespaard heeft, maar Hem voor ons allen overgegeven heeft, hoe zal Hij ons ook met Hem niet alle dingen schenken? Wie zal een beschuldiging inbrengen tegen de uitverkorenen van God? God is het Die rechtvaardigt. Wie is het die veroordeelt? Christus is het Die gestorven is; ja, meer nog, Die ook opgewekt is, Die ook aan de rechterhand van God is, Die ook voor ons bidt.", "Joh 3:30": "Hij moet meer worden, maar ik minder.", "Lev 26:5": "En de dorstijd zal u reiken tot de wijnoogst, en de wijnoogst zal reiken tot de zaaitijd; en u zult uw brood eten tot verzadiging toe, en u zult zeker in uw land wonen.", "Tit 1:3": "Namelijk Zijn Woord, door de prediking, die mij toevertrouwd is, naar het bevel van God, onze Zaligmaker;", "Hos 2:17": "En Ik zal op die dag een verbond voor hen sluiten met het wild gedierte van het veld, en met het gevogelte van de hemel, en het kruipend gedierte van de aardbodem; en Ik zal de boog, en het zwaard, en de oorlog van de aarde wegbreken, en Ik zal hen in veiligheid laten neerliggen.", "Jes 35:1-10": "De woestijn en de dorre plaatsen zullen hierover vrolijk zijn, en de wildernis zal zich verheugen, en zal bloeien als een roos. Zij zal uitbundig bloeien, en zich verheugen, ja, met verheuging, en juichen; de heerlijkheid van Libanon is haar gegeven, het sieraad van Karmel en Saron; zij zullen de heerlijkheid van de HEERE zien, het sieraad van onze God. Versterkt de slappe handen, en maakt de struikelende knieën vast.", "Jes 56:3": "En de vreemdeling, die zich bij de HEERE gevoegd heeft, moet niet zeggen: De HEERE heeft mij helemaal van Zijn volk gescheiden; en de ontmande moet niet zeggen: Zie, ik ben een dorre boom.", "Ps 84:2-11": "Hoe lieflijk zijn Uw woningen, o HEERE van de heerscharen! Mijn ziel is begerig, en bezwijkt ook van verlangen, naar de voorhoven van de HEERE; mijn hart en mijn vlees roepen uit tot de levende God. Zelfs vindt de mus een huis, en de zwaluw een nest voor zich, waar zij haar jongen legt, bij Uw altaren, HEERE van de heerscharen, mijn Koning, en mijn God!", "Jes 45:4": "Om Jakobs, Mijn knechts wil, en Israëls, Mijn uitverkorenen; ja, Ik riep u bij uw naam, Ik noemde u toe, hoewel u Mij niet kende.", "Jes 46:3": "Hoor naar Mij, o huis van Jakob, en het hele overblijfsel van het huis van Israël! Die van Mij gedragen zijn vanaf de buik af, en opgenomen vanaf de baarmoeder af.", "Ps 2:6": "Ik heb Mijn Koning toch gezalfd over Sion, de berg van Mijn heiligheid.", "Ezech 34:31": "U nu, o Mijn schapen, schapen van Mijn weide! U bent mensen; maar Ik ben uw God, spreekt de Heere HEERE.", "Dan 2:35": "Toen werden het ijzer, het leem, het koper, het zilver en het goud tegelijk verbrijzeld, en zij werden als kaf van de dorsvloeren in de zomer, en de wind voerde ze weg, zodat er geen plaats meer voor gevonden werd; maar de steen die het beeld verbrijzeld had, werd tot een grote berg, zodat hij de hele aarde vulde.", "Jes 25:8": "Hij zal de dood verslinden tot overwinning, en de Heere HEERE zal de tranen van alle aangezichten afwissen; en Hij zal de smaad van Zijn volk van de hele aarde wegnemen; want de HEERE heeft het gesproken.", "Gen 49:24": "Maar zijn boog is in stevigheid gebleven, en de armen van zijn handen zijn gesterkt, door de handen van de Machtige van Jakob; vandaar is hij een herder, een steen van Israël;", "Rom 6:1-23": "Wat zullen wij dan zeggen? Zullen wij in de zonde blijven, opdat de genade des te meer wordt? Dat zij verre. Wij die aan de zonde gestorven zijn, hoe zullen wij nog daarin leven? Of weet u niet dat allen die wij in Christus Jezus gedoopt zijn, wij in Zijn dood gedoopt zijn?", "Ef 2:17": "En toen Hij kwam, heeft Hij door het Evangelie vrede verkondigd aan u, die ver weg was, en aan hen die nabij waren.", "Jes 52:1-15": "Word wakker, word wakker, trek uw sterkte aan, o Sion! Trek uw sierlijke kleren aan, o Jeruzalem, u heilige stad! Want in u zal voortaan geen onbesnedene of onreine meer komen. Schud u uit het stof, sta op, ga zitten, o Jeruzalem! Maak u los van de banden van uw hals, u gevangen dochter van Sion! Want zo zegt de HEERE: U bent voor niets verkocht, u zult ook zonder geld vrijgekocht worden.", "Spr 8:20": "Ik doe wandelen op de weg van de gerechtigheid, in het midden van de paden van het recht;", "1 Petr 2:5": "Dan wordt u ook zelf, als levende stenen, gebouwd tot een geestelijk huis, tot een heilig priesterschap, om geestelijke offers te brengen die God aangenaam zijn door Jezus Christus.", "Luk 1:16": "En hij zal velen van de kinderen van Israël bekeren tot de Heere, hun God.", "Ps 96:2": "Zingt de HEERE, looft Zijn Naam; verkondigt Zijn heil van dag tot dag.", "Hand 28:26": "Toen hij zei: Ga naar dit volk, en zeg: Met het gehoor zult u horen, en beslist niet begrijpen; en ziende zult u zien, en beslist niet opmerken.", "2 Petr 3:12": "Verwacht en verhaast de komst van de dag van God, waarop de hemelen door vuur zullen vergaan, en de elementen brandend zullen versmelten.", "Ps 98:7-9": "De zee bruist met haar volheid, de wereld met hen die daarin wonen. Laten de rivieren met de handen klappen, laten de bergen tegelijk vreugde bedrijven, Voor het aangezicht van de HEERE, want Hij komt om de aarde te oordelen; Hij zal de wereld oordelen in gerechtigheid, en de volken in alle rechtmatigheid.", "Jes 66:2": "Want Mijn hand heeft al deze dingen gemaakt, en al deze dingen zijn geweest, spreekt de HEERE; maar op deze zal Ik zien, op de arme en verslagene van geest, en die voor Mijn woord beeft.", "Ps 89:13": "Het noorden en het zuiden, die hebt Gij geschapen; Thabor en Hermon juichen in Uw Naam.", "Ps 34:10": "Jod. Vreest de HEERE, u, Zijn heiligen! Want die Hem vrezen hebben geen gebrek.", "Ps 37:27": "Samech. Wijk af van het kwade, en doe het goede, en woon in eeuwigheid.", "Hagg 2:10": "De heerlijkheid van dit laatste huis zal groter worden dan die van het eerste, zegt de HEERE van de heerscharen; en in deze plaats zal Ik vrede geven, spreekt de HEERE van de heerscharen.", "Hebr 10:20-23": "langs een nieuwe en levende weg, die Hij voor ons heeft ingewijd door het voorhangsel heen, dat is: door Zijn vlees; en omdat wij een grote Priester hebben over het huis van God, laten wij toegaan met een oprecht hart, in volle zekerheid van het geloof, ons hart gereinigd van het kwade geweten, en het lichaam gewassen met rein water.", "Ps 63:12": "Maar de koning zal zich in God verblijden; ieder die bij Hem zweert, zal zich beroemen; want de mond van de leugensprekers zal gestopt worden.", "1 Kor 2:9": "Maar zoals geschreven is: Wat het oog niet heeft gezien, en het oor niet heeft gehoord, en in het hart van de mens niet is opgekomen, dat wat God bereid heeft voor hen die Hem liefhebben.", "1 Joh 5:13": "Deze dingen heb ik u geschreven, die gelooft in de Naam van de Zoon van God; opdat u weet dat u het eeuwige leven hebt, en opdat u gelooft in de Naam van de Zoon van God.", "Jes 66:10-12": "Verblijd u met Jeruzalem, en verheug u over haar, al haar liefhebbers! Wees vrolijk over haar met vreugde, u allen die over haar hebt getreurd! Opdat u mag zuigen, en verzadigd worden van de borsten van haar vertroostingen; opdat u mag uitzuigen, en u verlustigen aan de glans van haar heerlijkheid. Want zo zegt de HEERE: Zie, Ik zal de vrede over haar uitstrekken als een rivier, en de heerlijkheid van de heidenen als een overlopende beek; dan zult u zuigen; u zult op de zijde gedragen worden, en op de knieën heel vriendelijk getroeteld worden.", "Luk 24:47": "En in Zijn Naam moesten bekering en vergeving van de zonden gepredikt worden onder alle volken, te beginnen bij Jeruzalem.", "Jes 51:8": "Want de mot zal ze opeten als een kleed, en het schietwormpje zal ze opeten als wol; maar Mijn gerechtigheid zal in eeuwigheid zijn, en Mijn heil van geslacht tot geslacht.", "Openb 22:12": "En zie, Ik kom haastig, en Mijn loon is met Mij, om ieder te vergelden zoals zijn werk zal zijn.", "Ps 53:7": "Och, dat Israëls verlossingen uit Sion kwamen! Als God de gevangenen van Zijn volk zal doen terugkeren, dan zal Jakob zich verheugen, Israël zal verblijd zijn.", "2 Tim 2:10-12": "Daarom verdraag ik alles om de uitverkorenen, opdat ook zij de zaligheid zouden verkrijgen die in Christus Jezus is, met eeuwige heerlijkheid. Dit is een betrouwbaar woord: want als wij met Hem gestorven zijn, zullen wij ook met Hem leven; als wij volharden, zullen wij ook met Hem heersen; als wij Hem verloochenen, zal Hij ons ook verloochenen;", "Jes 26:1": "Op die dag zal dit lied gezongen worden in het land Juda: Wij hebben een sterke stad, God stelt heil tot muren en voorschansen.", "Ps 22:28-32": "Alle einden van de aarde zullen het gedenken, en zich tot de HEERE bekeren; en alle geslachten van de heidenen zullen voor Uw aangezicht aanbidden. Want het koninkrijk is van de HEERE, en Hij heerst onder de heidenen. Alle vetten op aarde zullen eten, en aanbidden; allen die in het stof neerdalen, zullen voor Zijn aangezicht neerbukken; en die zijn ziel bij het leven niet kan houden.", "1 Tim 2:3-6": "Want dat is goed en aangenaam voor God, onze Zaligmaker; Die wil dat alle mensen zalig worden en tot kennis van de waarheid komen. Want er is één God, er is ook één Middelaar van God en de mensen, de Mens Christus Jezus;", "Ps 26:12": "Mijn voet staat op effen grond; ik zal de HEERE loven in de samenkomsten.", "Deut 33:27": "De eeuwige God zij u een woning, en van onder eeuwige armen; en Hij verdrijft de vijand voor uw aangezicht, en zegt: Verdelg!", "Joël 2:26-32": "En u zult overvloedig en tot verzadiging eten, en de Naam van de HEERE, uw God, prijzen, Die wonderlijk bij u gehandeld heeft; en Mijn volk zal niet beschaamd worden tot in eeuwigheid. En u zult weten, dat Ik in het midden van Israël ben, en dat Ik de HEERE, uw God, ben, en niemand anders meer; en Mijn volk zal niet beschaamd worden in eeuwigheid. En daarna zal het gebeuren, dat Ik Mijn Geest zal uitgieten over alle vlees, en uw zonen en uw dochters zullen profeteren; uw ouden zullen dromen dromen, uw jongelingen zullen gezichten zien;", "Hand 16:25": "En omtrent middernacht baden Paulus en Silas en zongen lofzangen voor God; en de gevangenen luisterden naar hen.", "Ps 102:14-16": "U zult opstaan, U zult U ontfermen over Sion, want de tijd om haar genadig te zijn, want de bestemde tijd is gekomen. Want Uw knechten hebben een welgevallen aan haar stenen, en hebben medelijden met haar gruis. Dan zullen de heidenen de Naam van de HEERE vrezen, en alle koningen van de aarde Uw heerlijkheid.", "1 Kor 3:21-23": "Niemand roemt dan op mensen; want alles is van u. Hetzij Paulus, hetzij Apollos, hetzij Cefas, hetzij de wereld, hetzij leven, hetzij dood, hetzij tegenwoordige, hetzij toekomende dingen, ze zijn allemaal van u. Doch u bent van Christus, en Christus is van God.", "Jes 50:10": "Wie is er onder u, die de HEERE vreest, die naar de stem van Zijn Knecht luistert? Als hij in de duisternis wandelt, en geen licht heeft, laat hij vertrouwen op de Naam van de HEERE en steunen op zijn God.", "Spr 12:21": "De rechtvaardigen zal geen leed overkomen; maar de goddelozen zullen met kwaad vervuld worden.", "Rom 8:30-32": "En die Hij van tevoren bestemd heeft, die heeft Hij ook geroepen; en die Hij geroepen heeft, die heeft Hij ook gerechtvaardigd; en die Hij gerechtvaardigd heeft, die heeft Hij ook verheerlijkt. Wat zullen wij dan hierop zeggen? Als God vóór ons is, wie zal tegen ons zijn? Hij Die zelfs Zijn eigen Zoon niet gespaard heeft, maar Hem voor ons allen overgegeven heeft, hoe zal Hij ons ook met Hem niet alle dingen schenken?", "Ex 6:6": "En Ik zal u tot Mijn volk aannemen, en Ik zal u tot een God zijn; en u zult weten dat Ik de HEERE uw God ben, Die u uitleidt van onder de lasten van de Egyptenaren.", "Matt 12:18-21": "Zie, Mijn Knecht, Die Ik uitgekozen heb; Mijn Beminde, in Wie Mijn ziel een welbehagen heeft; Ik zal Mijn Geest op Hem leggen, en Hij zal het oordeel aan de heidenen verkondigen. Hij zal niet twisten, en niet roepen, en niemand zal Zijn stem op de straten horen. Het geknakte riet zal Hij niet breken, en de walmende vlaspit zal Hij niet uitblussen, totdat Hij het oordeel tot overwinning zal uitbrengen.", "Ps 5:12": "Maar laat verblijd zijn allen die op U vertrouwen, tot in eeuwigheid; laat hen juichen, omdat U hen overdekt; en laat in U van vreugde opspringen die Uw Naam liefhebben.", "Dan 2:45": "Daarom hebt u gezien dat uit de berg een steen zonder handen werd afgehouwen, die het ijzer, koper, leem, zilver en goud verbrijzelde; de grote God heeft de koning bekendgemaakt wat hierna gebeuren zal; de droom is dus waar, en de uitleg ervan betrouwbaar.", "Hand 8:39": "En toen zij uit het water waren opgekomen, nam de Geest van de Heere Filippus weg, en de kamerling zag hem niet meer; want hij reisde zijn weg met blijdschap.", "Ps 46:5": "De beekjes van de rivier zullen verblijden de stad van God, het heiligdom van de woningen van de Allerhoogste.", "Ps 121:1-8": "Een lied Hammaaloth¹. Ik hef mijn ogen op naar de bergen, vanwaar mijn hulp komen zal. Mijn hulp is van de HEERE, Die hemel en aarde gemaakt heeft. Hij zal uw voet niet laten wankelen; uw Bewaarder zal niet sluimeren.", "2 Tim 2:10": "Daarom verdraag ik alles om de uitverkorenen, opdat ook zij de zaligheid zouden verkrijgen die in Christus Jezus is, met eeuwige heerlijkheid.", "1 Kron 16:33": "Dan zullen de bomen van het woud juichen voor het aangezicht van de HEERE, omdat Hij komt om de aarde te richten.", "Joh 4:10": "Jezus antwoordde en zei tegen haar: Als u de gave van God kende, en Wie Hij is, Die tegen u zegt: Geef Mij te drinken, dan zou u van Hem hebben gevraagd, en Hij zou u levend water gegeven hebben.", "Tit 2:11-14": "Want de genade van God die zaligmakend is, is verschenen aan alle mensen. En onderwijst ons dat wij, doordat we de goddeloosheid en de wereldse begeerten verzaken, matig en rechtvaardig en godvruchtig zouden leven in deze tegenwoordige wereld; Verwachtend de zalige hoop en verschijning van de heerlijkheid van de grote God en onze Zaligmaker Jezus Christus;", "Ps 87:1-5": "Een psalm, een lied voor de kinderen van Korach. Zijn grondslag is op de bergen van heiligheid. De HEERE heeft de poorten van Sion lief, boven alle woningen van Jakob. Zeer heerlijke dingen worden van u gesproken, o stad van God! Sela.", "Openb 22:17": "En de Geest en de Bruid zeggen: Kom! En laat hij die het hoort, zeggen: Kom! En laat hij die dorst heeft, komen; en laat hij die wil, het water des levens nemen, voor niets.", "Jak 1:21": "Daarom, nadat u alle vuiligheid en overvloed van slechtheid hebt afgelegd, ontvang met zachtmoedigheid het Woord dat in u geplant wordt, dat uw zielen zalig kan maken.", "Hebr 9:28": "zo is ook Christus, eenmaal geofferd, om de zonden van velen weg te nemen, en zal ten tweeden male zonder zonde gezien worden door hen die Hem verwachten tot zaligheid.", "Tit 3:4": "Maar toen de goedertierenheid van God, onze Zaligmaker, en Zijn liefde tot de mensen verschenen is,", "Ex 13:22": "Hij nam de wolkkolom overdag, en de vuurkolom 's nachts, niet weg van voor het aangezicht van het volk.", "Jes 63:12": "Die de arm van Zijn heerlijkheid heeft laten gaan aan de rechterhand van Mozes; Die de wateren voor hun aangezicht kliefde, opdat Hij Zich een eeuwige Naam maakte?", "Zach 2:11": "En veel heidenen zullen op die dag aan de HEERE toegevoegd worden, en zij zullen Mij tot een volk wezen; en Ik zal in het midden van u wonen; en u zult weten, dat de HEERE van de heerscharen mij tot u gezonden heeft.", "Jer 2:3": "Israël was de HEERE een heiligheid, de eerstelingen van Zijn inkomst; allen die hem opaten, werden voor schuldig gehouden; kwaad kwam hun over, spreekt de HEERE.", "Jes 65:1-25": "Ik ben gevonden door hen die naar Mij niet vroegen; Ik ben gevonden door hen die Mij niet zochten; tegen het volk, dat naar Mijn Naam niet genoemd was, heb Ik gezegd: Zie, hier ben Ik, zie, hier ben Ik. Ik heb Mijn handen uitgebreid, de hele dag, tot een opstandig volk, dat wandelt op een weg die niet goed is, naar hun eigen gedachten. Een volk dat Mij voortdurend tergt in Mijn aangezicht, terwijl het in de hoven offert en op tichelstenen wierook brandt;", "Ezech 18:31": "Werp van u weg al uw overtredingen, waarmee u overtreden hebt, en maak u een nieuw hart en een nieuwe geest; want waarom zou u sterven, o huis van Israël?", "Jes 45:23": "Ik heb bij Mijzelf gezworen, er is een woord van gerechtigheid uit Mijn mond gegaan, en het zal niet terugkeren: dat voor Mij alle knie zich zal buigen, alle tong Mij zal zweren.", "Openb 19:1": "En hierna hoorde ik als een grote stem van een grote menigte in de hemel, die zei: Halleluja, de zaligheid, en de heerlijkheid, en de eer, en de kracht zij de Heere, onze God.", "Fil 2:12": "Welnu, mijn geliefden, zoals u altijd gehoorzaam bent geweest, niet alleen zoals in mijn aanwezigheid, maar nu des te meer in mijn afwezigheid, werk uw eigen zaligheid met vrees en beven:", "Jes 44:2": "Zo zegt de HEERE, uw Maker en uw Formeerder van de buik af aan, Die u helpt: Wees niet bang, o Jakob, Mijn knecht, en u, Jeschurun, die Ik uitgekozen heb!", "Rom 13:11": "En dit zeg ik te meer, omdat wij de tijd waarin we leven kennen, dat het de tijd is dat wij nu uit de slaap ontwaken; want de zaligheid is ons nu dichterbij dan toen wij tot geloof kwamen.", "Jer 31:6": "Want er zal een dag zijn, waarop de wachters op het gebergte van Efraïm zullen roepen: Maak u op, en laat ons opgaan naar Sion, tot de HEERE, onze God!", "Ex 12:13": "En dat bloed zal voor u een teken zijn aan de huizen waarin u zich bevindt; wanneer Ik het bloed zie, zal Ik u voorbijgaan; en er zal geen plaag onder u zijn tot verderf, wanneer Ik Egypteland zal slaan.", "Ps 61:4": "Want U bent mij een Toevlucht geweest, een sterke Toren voor de vijand.", "Jes 25:9": "En men zal op die dag zeggen: Zie, Deze is onze God; wij hebben Hem verwacht, en Hij zal ons zalig maken. Deze is de HEERE, wij hebben Hem verwacht, wij zullen ons verheugen en verblijden in Zijn zaligheid.", "Ps 106:8": "Toch verloste Hij hen om Zijn Naams wil, opdat Hij Zijn macht bekend maakte.", "2 Kon 20:6": "En Ik zal vijftien jaar aan uw dagen toevoegen, en Ik zal u uit de hand van de koning van Assyrië verlossen, alsook deze stad; en Ik zal deze stad beschermen, omwille van Mijzelf en omwille van Mijn dienaar David.", "Kol 1:26": "namelijk de verborgenheid die verborgen is geweest voor alle eeuwen en voor alle geslachten, maar nu geopenbaard is aan Zijn heiligen;", "Joh 1:7": "Deze kwam tot een getuigenis, om van het Licht te getuigen, opdat zij allen door hem geloven zouden.", "Hebr 4:1-12": "Laat ons dan vrezen dat niet iemand van u, terwijl de belofte om in Zijn rust in te gaan nog geldt, schijnt achtergebleven te zijn. Want ook ons is het Evangelie verkondigd, net als hun; maar het gehoorde woord deed hun geen nut, omdat het bij hen die het hoorden niet met geloof gemengd was. Want wij die geloofd hebben, gaan de rust in, zoals Hij gezegd heeft: Zo heb Ik dan in Mijn toorn gezworen: Zij zullen Mijn rust niet ingaan! Hoewel Zijn werken al vanaf de grondlegging van de wereld volbracht waren.", "Spr 21:8": "De weg van de mens is hele verkeerd en vreemd; maar het werk van de zuivere is recht.", "Zach 9:14-16": "En de HEERE zal over hen verschijnen, en Zijn pijlen zullen uitgaan als een bliksem; en de Heere HEERE zal met de bazuin blazen, en Hij zal voorttrekken met stormen uit het zuiden. De HEERE van de heerscharen zal hen beschutten, en zij zullen eten, nadat zij de slingerstenen zullen ten onder gebracht hebben; zij zullen ook drinken, en een gedruis maken als bij de wijn; en zij zullen vervuld worden, als het bekken, als de hoeken van het altaar. En de HEERE, hun God, zal hen op die dag behouden, als de kudde van Zijn volk; want gekroonde stenen zullen in Zijn land, als een banier, opgericht worden.", "2 Kron 7:10": "Maar op de drieëntwintigste dag van de zevende maand liet hij het volk gaan naar hun tenten, blij en welgemoed over het goede, dat de HEERE aan David en Salomo, en Zijn volk Israël gedaan had.", "2 Kron 32:7": "Weest sterk, en houd goede moed, weest niet bevreesd en niet ontsteld voor het aangezicht van de koning van Assyrië, noch voor het aangezicht van de hele menigte die met hem is; want met ons is er meer dan met hem.", "1 Joh 3:14": "Wij weten dat wij overgegaan zijn uit de dood in het leven, omdat wij de broeders liefhebben; wie zijn broeder niet liefheeft, blijft in de dood.", "Joh 6:35": "En Jezus zei tegen hen: Ik ben het Brood des levens; wie tot Mij komt, zal beslist geen honger hebben, en wie in Mij gelooft, zal nooit meer dorst hebben.", "Jes 14:3": "En het zal gebeuren op de dag, wanneer de HEERE u rust zal geven van uw smart, en van uw onrust, en van de harde dienstbaarheid waarin men u heeft laten dienen,", "Hebr 2:12": "En Hij zegt: Ik zal Uw naam aan Mijn broeders verkondigen; in het midden van de Gemeente zal Ik U lofzingen.", "Jes 24:14-16": "Die zullen hun stem opheffen, zij zullen vrolijk zingen; vanwege de heerlijkheid van de HEERE zullen zij juichen vanaf de zee. Daarom eert de HEERE in de valleien, in de eilanden van de zee de Naam van de HEERE, de God van Israël. Van het uiterste einde van de aarde horen wij psalmen, tot verheerlijking van de Rechtvaardige. Maar nu zeg ik: Ik word mager, ik word mager, wee mij! De trouwelozen handelen trouweloos, en met trouweloosheid handelen de trouwelozen trouweloos.", "Openb 20:3": "En wierp hem in het afgrond, en sloot hem daarin, en verzegelde het boven hem, opdat hij de volken niet meer verleiden zou, totdat de duizend jaar geëindigd zouden zijn. En daarna moet hij een korte tijd losgelaten worden.", "Jer 3:14-19": "Bekeer u, afkerige kinderen! spreekt de HEERE, want Ik heb u getrouwd, en Ik zal u aannemen, één uit een stad, en twee uit een geslacht, en Ik zal u naar Sion brengen. En Ik zal u herders geven naar Mijn hart; die zullen u weiden met kennis en verstand. En het zal gebeuren, wanneer u meer geworden en vruchtbaar geworden bent in het land, in die dagen, spreekt de HEERE, dat zij niet meer zullen zeggen: De ark van het verbond van de HEERE, en zij zal ook niet in het hart opkomen; en zij zullen er niet aan denken, en haar niet bezoeken, en zij zal niet opnieuw gemaakt worden.", "Matt 21:43": "Daarom zeg Ik u, dat het Koninkrijk van God van u zal worden weggenomen, en gegeven aan een volk dat de vruchten ervan voortbrengt.", "Openb 14:4": "Dezen zijn het, die met vrouwen niet bevlekt zijn, want zij zijn maagden; dezen zijn het, die het Lam volgen, waar Het ook heengaat; dezen zijn gekocht uit de mensen, tot eerstelingen voor God en het Lam.", "Jes 12:6": "Juich en zing vrolijk, u inwoners van Sion! Want de Heilige van Israël is groot in uw midden.", "Rom 10:4": "Want het einde van de wet is Christus, tot rechtvaardigheid voor ieder die gelooft.", "Jes 29:18-24": "En op die dag zullen de doven de woorden van het boek horen; en de ogen van de blinden, die uit de donkerheid en uit de duisternis zijn, zullen zien. En de zachtmoedigen zullen vreugde op vreugde hebben in de HEERE; en de behoeftigen onder de mensen zullen zich in de Heilige van Israël verheugen. Wanneer de tiran een einde zal hebben, en het met de spotter voorbij zal zijn, en allen die op ongerechtigheid loeren, uitgeroeid zullen zijn;", "Lev 19:2": "Spreek tot de hele vergadering van de kinderen van Israël, en zeg tegen hen: U zult heilig zijn, want Ik, de HEERE, uw God, ben heilig!", "Jes 49:5": "En nu zegt de HEERE, Die Mij van moeders buik af tot een Knecht gevormd heeft, dat Ik Jakob tot Hem terugbrengen zou; maar Israël zal zich niet laten verzamelen; toch zal Ik verheerlijkt worden in de ogen van de HEERE, en Mijn God zal Mijn Sterkte zijn.", "Ps 92:2-4": "Het is goed dat men de HEERE looft, en Uw Naam psalmzingt, o Allerhoogste! Dat men in de morgenstond Uw goedertierenheid verkondigt, en Uw trouw in de nachten; Op het tiensnarig instrument en op de luit, met een voorbedacht lied op de harp.", "Gen 48:15": "En hij zegende Jozef, en zei: De God, voor Wiens aangezicht mijn vaders, Abraham en Izak, gewandeld hebben, die God, Die mij gevoed heeft, van mijn jeugd af tot op deze dag;", "Hebr 3:6": "Maar Christus, als de Zoon over Zijn eigen huis; Wiens huis wij zijn, als wij maar de vrijmoedigheid en de roem van de hoop tot het einde toe onwrikbaar vasthouden.", "Ps 63:6-8": "Mijn ziel zou verzadigd worden als met vet en overvloed, en mijn mond zou roemen met vrolijk zingende lippen. Als ik aan U denk op mijn bed, dan peins ik over U in de nachtwaken. Want U bent mij een hulp geweest; en in de schaduw van Uw vleugels zal ik vrolijk zingen.", "Jes 64:4": "Ja, van oudsher heeft men het niet gehoord, ook niet met de oren opgemerkt, en geen oog heeft het gezien, behalve U, o God! wat Hij doen zal aan hem, die op Hem wacht.", "Ps 119:1": "Aleph. Gelukkig zijn de oprechten van wandel, die in de wet van de HEERE gaan.", "Ps 37:9": "Want de boosdoeners zullen uitgeroeid worden, maar wie de HEERE verwachten, die zullen de aarde erfelijk bezitten.", "1 Kor 14:15": "Wat is het dan? Ik zal wel met de geest bidden, maar ik zal ook met het verstand bidden; ik zal wel met de geest zingen, maar ik zal ook met het verstand zingen.", "Ps 32:8": "Ik zal u onderwijzen, en u de weg leren die u moet gaan; Ik zal raad geven, Mijn oog zal op u zijn.", "Joh 17:13": "Maar nu kom Ik tot U, en spreek dit in de wereld, opdat zij Mijn blijdschap vervuld in zichzelf mogen hebben.", "Openb 21:11": "En zij had de heerlijkheid van God, en haar licht was gelijk aan de allerkostbaarste steen, namelijk als de steen Jaspis, blinkend als kristal.", "Openb 21:2": "En ik, Johannes, zag de heilige stad, het nieuwe Jeruzalem, neerdalen van God uit de hemel, gereedgemaakt als een bruid, die voor haar man versierd is.", "Jes 40:4-11": "Alle dalen zullen verhoogd worden, en alle bergen en heuvels zullen vernederd worden; en wat krom is, dat zal recht, en wat hobbelig is, dat zal tot een vallei gemaakt worden. En de heerlijkheid van de HEERE zal geopenbaard worden; en alle vlees tegelijk zal zien, dat de mond van de HEERE het gesproken heeft. Een stem zegt: Roept! En hij zegt: Wat zal ik roepen? Alle vlees is gras, en al zijn goedertierenheid als een bloem van het veld.", "1 Joh 5:4": "Want al wat uit God geboren is, overwint de wereld; en dit is de overwinning die de wereld overwint, namelijk ons geloof.", "Ef 3:9": "en allen te verlichten, zodat zij mogen verstaan wat de gemeenschap van de verborgenheid is, die vanaf alle eeuwen verborgen is geweest in God, Die alle dingen geschapen heeft door Jezus Christus;", "Joël 3:16": "En de HEERE zal uit Sion brullen, en uit Jeruzalem Zijn stem geven, zodat hemel en aarde beven zullen; maar de HEERE zal de toevlucht van Zijn volk, en de sterkte van de kinderen van Israël zijn.", "Ps 149:2": "Laat Israël zich verblijden in Hem Die hem gemaakt heeft; laat de kinderen van Sion zich verheugen over hun Koning.", "Ps 16:8": "Ik stel de HEERE voortdurend voor mij, omdat Hij aan mijn rechterhand is, zal ik niet wankelen.", "Hand 2:47": "En zij prezen God, en waren bemind bij het hele volk. En de Heere voegde dagelijks mensen die behouden werden aan de Gemeente toe.", "Jer 2:6": "En zij zeiden niet: Waar is de HEERE, Die ons opvoerde uit Egypteland, Die ons leidde in de woestijn, in een land van wildernissen en kuilen, in een land van dorheid en schaduw van de dood, in een land waar niemand doorheen ging, en waar geen mens woonde?", "Openb 22:14": "Zalig zijn zij die Zijn geboden doen, zodat hun macht toekomt aan de boom des levens, en zij door de poorten de stad mogen binnengaan.", "Ps 87:5": "En van Sion zal gezegd worden: Die en die is daarin geboren; en de Allerhoogste Zelf zal hen bevestigen.", "1 Petr 2:9": "Maar u bent een uitverkoren geslacht, een koninklijk priesterschap, een heilig volk, een volk dat God Zich verworven heeft; opdat u de deugden zou verkondigen van Hem Die u uit de duisternis geroepen heeft tot Zijn wonderbaar licht;", "Gen 49:10": "De scepter zal van Juda niet wijken, evenmin de wetgever van tussen zijn voeten, totdat Silo komt, en Hem zullen de volken gehoorzaam zijn.", "Jes 49:26": "En Ik zal uw verdrukkers spijzen met hun eigen vlees, en van hun eigen bloed zullen zij dronken worden, als van zoete wijn; en alle vlees zal gewaarworden, dat Ik, de HEERE, uw Heiland ben, en uw Verlosser, de Machtige van Jakob.", "Gen 22:18": "En in uw nageslacht zullen alle volken van de aarde gezegend worden, omdat u Mijn stem gehoorzaam bent geweest.", "Ps 22:26": "Van U zal mijn lof zijn in een grote gemeente; ik zal mijn geloften betalen in de tegenwoordigheid van hen die Hem vrezen.", "Joz 23:10": "Eén man onder u zal er duizend opjagen; want het is de HEERE, uw God, Zelf, Die voor u strijdt, zoals Hij tot u gesproken heeft.", "Ex 9:26": "Alleen in het land Gosen, waar de kinderen van Israël waren, daar was geen hagel.", "Zef 3:9": "Zeker, dan zal Ik tot de volken een reine spraak wenden; opdat zij allen de Naam van de HEERE aanroepen, opdat zij Hem dienen met één schouder³.", "Jes 59:21": "Wat Mij aangaat, dit is Mijn Verbond met hen, zegt de HEERE: Mijn Geest, Die op u is, en Mijn woorden, die Ik in uw mond gelegd heb, die zullen van uw mond niet wijken, ook niet van de mond van uw zaad, ook niet van de mond van het zaad van uw zaad, zegt de HEERE, van nu af tot in eeuwigheid toe.", "Ps 63:4-7": "Want Uw goedertierenheid is beter dan het leven; mijn lippen zouden U prijzen. Zo zou ik U loven in mijn leven; in Uw Naam zou ik mijn handen opheffen. Mijn ziel zou verzadigd worden als met vet en overvloed, en mijn mond zou roemen met vrolijk zingende lippen.", "Ps 102:20": "Omdat Hij uit de hoogte van het heiligdom zal hebben neerwaarts gezien; dat de HEERE uit de hemel op de aarde geschouwd zal hebben;", "Jes 12:2": "Zie, God is mijn Heil, ik zal vertrouwen en niet vrezen; want de HEERE HEERE is mijn Sterkte en mijn Psalm, en Hij is mij tot Heil geworden.", "Rom 14:17": "Want het Koninkrijk van God is niet eten en drinken, maar rechtvaardigheid, en vrede, en blijdschap, door de Heilige Geest.", "Jes 55:13": "Voor een doorn zal een dennenboom opgaan, voor een distel zal een mirteboom opgaan; en het zal de HEERE wezen tot een naam, tot een eeuwig teken, dat niet uitgeroeid zal worden.", "Jes 54:1-17": "Zing vrolijk, u onvruchtbare, die niet gebaard hebt! Maak geschal met vrolijk gezang, en juich, die geen barensnood gehad hebt! Want de kinderen van de eenzame zijn meer dan de kinderen van de getrouwde, zegt de HEERE. Maak de plaats van uw tenten wijd, en laat men de gordijnen van uw woningen uitbreiden, verhinder het niet; maak uw koorden lang, en steek uw pinnen vast in. Want u zult uitbreken ter rechter hand en ter linkerhand; en uw nageslacht zal de heidenen erven, en zij zullen de verwoeste steden doen bewonen.", "Matt 10:28-32": "En weest niet bang voor hen die het lichaam doden, en de ziel niet kunnen doden; maar vreest veel meer Hem, Die zowel ziel als lichaam kan verderven in de hel. Worden niet twee musjes voor een penninkje verkocht? En niet één daarvan zal op de aarde vallen zonder uw Vader. En ook uw haren van het hoofd zijn alle geteld.", "Ex 6:5": "Daarom, zeg tegen de kinderen van Israël: Ik ben de HEERE! En Ik zal u uitleiden van onder de lasten van de Egyptenaren, en Ik zal u redden uit hun dienstbaarheid, en zal u verlossen door een uitgestrekte arm, en door grote gerichten;", "Ps 107:32": "En Hem verhogen in de gemeente van het volk, en Hem roemen in de vergadering van de oudsten.", "Ps 37:32": "Tsade. De goddeloze loert op de rechtvaardige, en zoekt hem te doden.", "Hebr 13:5": "Laat uw wandel zonder geldgierigheid zijn, en wees tevreden met wat u hebt; want Hij heeft gezegd: Ik zal u niet begeven, en Ik zal u niet verlaten.", "Mark 13:13": "En u zult door allen gehaat worden, omwille van Mijn Naam; maar wie zal volharden tot het einde, die zal behouden worden.", "Ps 119:14": "Ik ben vrolijker in de weg van Uw getuigenissen, dan over alle rijkdom.", "1 Tess 5:5": "U bent allen kinderen van het licht en kinderen van de dag; wij zijn niet van de nacht, en ook niet van de duisternis.", "Luk 4:18": "De Geest van de Heere is op Mij, daarom heeft Hij Mij gezalfd; Hij heeft Mij gezonden om aan de armen het Evangelie te verkondigen, om te genezen wie gebroken zijn van hart;", "Ps 62:8": "In God is mijn Heil en mijn Eer; de Rots van mijn sterkte, mijn Toevlucht is in God.", "Ps 71:16": "Ik zal heengaan in de mogendheden van de Heere HEERE; ik zal Uw gerechtigheid vermelden, de Uwe alleen.", "Ps 31:20": "O, hoe groot is Uw goed, dat U weggelegd hebt voor hen die U vrezen; dat U gewrocht hebt voor hen die op U vertrouwen, in de tegenwoordigheid van de mensenkinderen!", "1 Tim 6:15": "die op Zijn tijd zal laten zien de gelukkige en enige machtige Heerser, de Koning der koningen en Heere der heren;", "Ps 118:24": "Dit is de dag, die de HEERE gemaakt heeft; laten we ons daarover verheugen, en verblijd zijn.", "Ef 2:7": "opdat Hij zou tonen in de toekomende eeuwen de uitnemende rijkdom van Zijn genade, door de goedertierenheid over ons in Christus Jezus.", "Jes 43:12": "Ik heb verkondigd, en Ik heb verlost, en Ik heb het doen horen, en geen vreemde god was onder u; en u bent Mijn getuigen, spreekt de HEERE, dat Ik God ben.", "Ex 34:24": "Wanneer Ik de volken voor uw aangezicht uit hun bezit zal verdrijven, en uw grenzen verruimen, dan zal niemand uw land begeren, terwijl u erheen optrekt, om te verschijnen voor het aangezicht van de HEERE, uw God, driemaal in het jaar.", "Matt 5:30": "En als uw rechterhand u ergert, hak hem af en werp hem van u; want het is beter voor u dat een van uw lichaamsdelen verloren gaat, en niet uw hele lichaam in de hel geworpen wordt.", "1 Tim 4:8": "Want de lichamelijke oefening is van weinig nut; maar de godvruchtigheid is nuttig voor alles, omdat zij de belofte heeft van het tegenwoordige en van het toekomende leven.", "Jes 42:18-21": "Hoort, u doven! En kijkt toe, u blinden, om te zien. Wie is er blind als Mijn knecht, en doof, zoals Mijn bode, die Ik zend? Wie is blind, zoals de volmaakte, en blind, zoals de knecht van de HEERE? U ziet wel veel dingen, maar u bewaart ze niet; en al doet hij de oren open, toch hoort hij niet.", "Ps 25:5": "He. Vau. Leid mij in Uw waarheid, en leer mij, want Gij zijt de God van mijn heil; U verwacht ik de hele dag.", "Jes 40:4": "Alle dalen zullen verhoogd worden, en alle bergen en heuvels zullen vernederd worden; en wat krom is, dat zal recht, en wat hobbelig is, dat zal tot een vallei gemaakt worden.", "Spr 21:29": "Een goddeloze man sterkt zich in zijn aangezicht; maar de oprechte, die maakt zijn weg vast.", "Ef 1:5": "Die ons van tevoren voorbestemd heeft tot aanneming tot kinderen, door Jezus Christus, voor Zichzelf, naar het welbehagen van Zijn wil.", "Matt 1:21": "en zij zal een Zoon baren, en u zult Hem de naam JEZUS geven; want Hij zal Zijn volk zalig maken van hun zonden.", "Openb 20:2": "En hij greep de draak, de oude slang, die de duivel is en satan, en bond hem duizend jaar;", "Joh 12:26": "Als iemand Mij dient, laat hij Mij volgen; en waar Ik ben, daar zal ook Mijn dienaar zijn. En als iemand Mij dient, zal de Vader hem eren.", "Luk 11:14": "En Hij dreef een demon uit, en die was stom. En het gebeurde, toen de demon uitgevaren was, dat de stomme sprak; en de menigten verwonderden zich.", "Jes 2:3-5": "En veel volken zullen heengaan en zeggen: Kom, laat ons opgaan tot de berg van de HEERE, tot het huis van de God van Jakob, opdat Hij ons leert van Zijn wegen, en dat wij wandelen in Zijn paden; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem. En Hij zal rechtspreken onder de heidenvolken, en bestraffen veel volken; en zij zullen hun zwaarden slaan tot spaden, en hun speren tot snoeimessen; het ene volk zal tegen het andere volk geen zwaard opheffen, en zij zullen geen oorlog meer leren. Kom, u huis van Jakob, en laat ons wandelen in het licht van de HEERE.", "1 Kor 12:6": "en er is verscheidenheid van werkingen, maar het is dezelfde God, Die alles in allen werkt.", "Gen 35:2": "Toen zei Jakob tegen zijn huisgezin en tegen allen die bij hem waren: Doe de vreemde goden weg die in uw midden zijn, reinig u, en verander uw kleren;", "Openb 15:2-4": "En ik zag als een glazen zee, met vuur gemengd; en zij die de overwinning hadden behaald op het beest, en op zijn beeld, en op zijn merkteken, en op het getal van zijn naam, stonden aan de glazen zee, met de citers van God. En zij zongen het gezang van Mozes, de dienstknecht van God, en het gezang van het Lam, en zeiden: Groot en wonderlijk zijn Uw werken, Heere, Gij almachtige God, rechtvaardig en waarachtig zijn Uw wegen, Gij Koning der heiligen! Wie zou U niet vrezen, Heere, en Uw Naam niet verheerlijken? Want Gij alleen zijt heilig; want alle volken zullen komen, en voor U aanbidden; want Uw oordelen zijn openbaar geworden.", "Jer 30:17": "Want Ik zal u de gezondheid doen terugkeren, en u van uw plagen genezen, spreekt de HEERE; omdat zij u noemen: De verdrevene. Het is Sion, zeggen zij; niemand vraagt naar haar.", "Deut 10:17": "Want de HEERE, uw God, is een God der goden, en een Heere der heren; die grote, die machtige, en die ontzagwekkende God, Die niemand aanziet naar het aangezicht, en geen geschenk aanneemt;", "Joh 10:9": "Ik ben de Deur; als iemand door Mij ingaat, zal hij behouden worden; en hij zal ingaan en uitgaan, en weide vinden.", "Jes 4:5": "En de HEERE zal over elke woning van de berg Sion, en over haar samenkomsten, een wolk scheppen overdag, en rook, en de glans van een vlammend vuur 's nachts; want over alles wat heerlijk is, zal een beschutting zijn.", "Jes 24:16": "Van het uiterste einde van de aarde horen wij psalmen, tot verheerlijking van de Rechtvaardige. Maar nu zeg ik: Ik word mager, ik word mager, wee mij! De trouwelozen handelen trouweloos, en met trouweloosheid handelen de trouwelozen trouweloos.", "Ps 132:15-17": "Ik zal haar voedsel rijkelijk zegenen, haar behoeftigen zal Ik met brood verzadigen. En haar priesters zal Ik met heil bekleden, en haar gunstgenoten zullen zeer juichen. Daar zal Ik David een hoorn doen uitspruiten; Ik heb voor Mijn Gezalfde een lamp klaargemaakt.", "Rom 3:28-30": "Wij stellen dan vast, dat de mens door het geloof gerechtvaardigd wordt, zonder de werken van de wet. Is God een God van de Joden alleen? En is Hij het niet ook van de heidenen? Ja, ook van de heidenen; omdat Hij één God is, Die de besnijdenis zal rechtvaardigen uit het geloof, en de onbesnedenen door het geloof.", "Gen 12:5": "En Abram nam Sarai, zijn vrouw, en Lot, de zoon van zijn broer, en al hun bezit dat zij verworven hadden, en de mensen die zij verkregen hadden in Haran; en zij vertrokken om naar het land Kanaän te gaan, en zij kwamen in het land Kanaän aan.", "2 Kron 7:3": "En toen alle kinderen van Israël dat vuur zagen neerdalen, en de heerlijkheid van de HEERE over het huis, bogen zij met hun gezichten ter aarde op de vloer, en aanbaden en loofden de HEERE, dat Hij goed is, dat Zijn goedertierenheid tot in eeuwigheid is.", "Jes 60:1": "Maak u op, word verlicht, want uw licht komt, en de heerlijkheid van de HEERE gaat over u op.", "1 Kor 3:16": "Weet u niet, dat u de tempel van God bent, en dat de Geest van God in u woont?", "Matt 21:5": "Zeg tegen de dochter van Sion: Zie, uw Koning komt naar u toe, zachtmoedig en gezeten op een ezelin, en een veulen, het jong van een lastdier.", "Jes 52:7-10": "Hoe lieflijk zijn op de bergen de voeten van hem die het goede nieuws brengt, die de vrede laat horen; van hem die goed nieuws brengt van het goede, die heil laat horen; van hem die tegen Sion zegt: Uw God is Koning. Er is een stem van uw wachters; zij verheffen de stem, zij juichen samen; want zij zullen oog in oog zien, wanneer de HEERE Sion terugbrengen zal. Maakt een geschal, juicht samen, u woeste plaatsen van Jeruzalem! Want de HEERE heeft Zijn volk getroost, Hij heeft Jeruzalem verlost.", "Jes 40:31": "Maar wie de HEERE verwachten, zullen de kracht vernieuwen; zij zullen opvaren met vleugels, gelijk de arenden; zij zullen lopen, en niet moede worden; zij zullen wandelen, en niet mat worden.", "Joh 8:32": "En u zult de waarheid kennen, en de waarheid zal u vrijmaken.", "Hand 9:15": "Maar de Heere zei tegen hem: Ga heen; want deze man is Mij een uitverkoren instrument om Mijn Naam te dragen voor de heidenen, en de koningen, en de kinderen van Israël.", "Ps 43:3": "Zend Uw licht en Uw waarheid, dat die mij leiden; dat zij mij brengen tot de berg van Uw heiligheid, en tot Uw woningen;", "Jes 49:11": "En Ik zal al Mijn bergen tot een weg maken, en Mijn banen zullen verhoogd zijn.", "Ps 111:10": "Resch. De vreze van de HEERE is het beginsel van de wijsheid; Schin. allen die ernaar handelen, hebben goed verstand; Thau. Zijn lof bestaat tot in eeuwigheid.", "Jes 42:10-12": "Zingt de HEERE een nieuw lied, Zijn lof van het einde van de aarde; u, die ter zee vaart, en al wat daarin is, u eilanden en hun inwoners. Laat de woestijn en haar steden de stem verheffen, met de dorpen die Kedar bewoont; laat hen juichen die in de rotsen wonen, en van de top van de bergen af schreeuwen. Laat ze de HEERE de eer geven, en Zijn lof in de eilanden verkondigen.", "Ps 31:6": "In Uw hand beveel ik mijn geest; U hebt mij verlost, HEERE, U, God van de waarheid!", "Luk 18:7": "Zal God dan geen recht doen aan Zijn uitverkorenen, die dag en nacht tot Hem roepen, hoewel Hij geduldig is met hen?", "Ps 133:1-3": "Een lied Hammaäloth, van David. Zie, hoe goed en hoe fijn is het, dat broeders ook samenwonen! Het is als de kostelijke olie op het hoofd, die neerdaalt op de baard, de baard van Aäron, die neerdaalt tot op de zoom van zijn kleren. Het is als de dauw van Hermon, en die neerdaalt op de bergen van Sion, want de HEERE gebiedt daar de zegen en het leven tot in eeuwigheid.", "Jes 60:8-14": "Wie zijn deze, die daar komen aangevlogen als een wolk, en als duiven naar hun vensters? Want de eilanden zullen Mij verwachten, en de schepen van Tarsis vooreerst, om uw kinderen van verre te brengen, hun zilver en hun goud met hen, tot de Naam van de HEERE, uw God, en tot de Heilige van Israël, omdat Hij u heerlijk gemaakt heeft. En de vreemden zullen uw muren bouwen, en hun koningen zullen u dienen; want in Mijn verbolgenheid heb Ik u geslagen, maar in Mijn welbehagen heb Ik Mij over u ontfermd.", "2 Tess 2:13": "Maar wij zijn verplicht altijd God te danken voor u, broeders, die door de Heere bemind bent, dat God u van het begin af verkoren heeft tot zaligheid, in heiliging door de Geest, en geloof in de waarheid;", "Jes 32:2": "En die man zal zijn als een schuilplaats tegen de wind, en een schuilplaats tegen de storm, als waterbeken in een dorre plaats, als de schaduw van een zware rotssteen in een dorstig land.", "Deut 3:2": "Toen zei de HEERE tegen mij: Wees niet bang voor hem, want Ik heb hem, en al zijn volk, en zijn land, in uw hand gegeven; en u zult hem doen, zoals u met Sihon, de koning van de Amorieten, die te Hesbon woonde, gedaan hebt.", "Jes 50:2": "Waarom kwam Ik, en er was niemand, waarom riep Ik, en niemand antwoordde? Is Mijn hand dan helemaal kort geworden, zodat zij niet verlossen kan, of is er in Mij geen kracht om te redden? Zie, door Mijn dreigende woord maak Ik de zee droog, Ik maak de rivieren tot een woestijn, zodat hun vis stinkt, omdat er geen water is, en sterft van dorst.", "Jes 41:13": "Want Ik, de HEERE, uw God, grijp uw rechterhand aan, Die tegen u zeg: Vrees niet, Ik help u.", "Micha 4:1-4": "Maar in het laatste van de dagen zal het gebeuren, dat de berg van het huis van de HEERE vastgesteld zal zijn op de top van de bergen; en hij zal verheven zijn boven de heuvels, en de volken zullen naar hem toestromen. En veel heidenvolken zullen heengaan en zeggen: Kom, laat ons opgaan naar de berg van de HEERE, en naar het huis van de God van Jakob, opdat Hij ons zijn wegen leert, en wij op Zijn paden wandelen; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem. En Hij zal onder grote volken rechtspreken, en machtige heidenvolken straffen, tot ver weg toe; en zij zullen hun zwaarden omsmeden tot ploegscharen, en hun speren tot snoeimessen; het ene volk zal tegen het andere volk geen zwaard opheffen, en zij zullen de oorlog niet meer leren.", "2 Kron 32:8": "Met hem is een arm van vlees, maar met ons is de HEERE, onze God, om ons te helpen en om onze oorlogen te voeren. En het volk steunde op de woorden van Jehizkia, de koning van Juda.", "Spr 12:2": "De goede zal een welgevallen krijgen van de HEERE; maar een man van schandelijke verdichtsels zal Hij verdoemen.", "Ezech 43:4": "En de heerlijkheid van de HEERE kwam in het huis, door de weg van de poort die de weg naar het oosten ziet.", "Ps 85:7": "Zult U ons niet weer levend maken, opdat Uw volk zich in U verblijdt?", "Ps 4:4": "Weet toch, dat de HEERE Zich een gunstgenoot heeft afgezonderd; de HEERE zal horen, als ik tot Hem roep.", "Gal 2:20": "Ik ben met Christus gekruisigd; en ik leef, maar niet meer ik, maar Christus leeft in mij; en wat ik nu in het vlees leef, dat leef ik door het geloof van de Zoon van God, Die mij heeft liefgehad, en Zichzelf voor mij heeft overgegeven.", "Jes 60:20": "Uw zon zal niet meer ondergaan, en uw maan zal haar licht niet intrekken; want de HEERE zal u tot een eeuwig licht zijn, en de dagen van uw treuren zullen een einde nemen.", "Matt 11:3-5": "En zei tegen Hem: Bent U Degene, Die komen zou, of verwachten wij een ander? En Jezus antwoordde en zei tegen hen: Ga heen en vertel Johannes weer wat u hoort en ziet: De blinden worden ziende, en de kreupelen wandelen; de melaatsen worden gereinigd, en de doven horen; de doden worden opgewekt, en de armen wordt het Evangelie verkondigd.", "Jes 49:1": "Hoort naar Mij, eilanden! En luistert toe, volken van verre! De HEERE heeft Mij geroepen van de buik af, van het ingewand van Mijn moeder af heeft Hij Mijn Naam vermeld.", "Amos 9:12": "Opdat zij het overblijfsel van Edom erfelijk bezitten, en alle heidenvolken die naar Mijn Naam genoemd worden, spreekt de HEERE, Die dit doet.", "Ps 30:6": "Want een ogenblik is er in Zijn toorn, maar een leven in Zijn goedgunstigheid; 's avonds vernacht het geween, maar 's morgens is er gejuich.", "Ps 96:11-13": "Laat de hemel zich verblijden, en de aarde zich verheugt, laat de zee bruist met haar volheid. Laat het veld huppelt van vreugde met alles wat erin is, laat dan alle bomen van het woud juichen. Voor het aangezicht van de HEERE; want Hij komt, want Hij komt, om de aarde te oordelen; Hij zal de wereld oordelen met gerechtigheid, en de volken met Zijn waarheid.", "Ps 50:3": "Onze God zal komen en zal niet zwijgen; een vuur voor Zijn aangezicht zal verteren, en rondom Hem zal het zeer stormen.", "Openb 3:4": "Toch hebt u enkele weinige namen ook in Sardis, die hun kleren niet bevlekt hebben, en zij zullen met Mij wandelen in witte kleren, omdat zij het waard zijn.", "Jes 48:
