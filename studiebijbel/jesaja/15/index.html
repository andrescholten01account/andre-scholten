im zullen enkel verwoesting zijn; want het gras is verdord, het tedere gras is vergaan, er is geen groen meer.", "7": "Daarom zullen zij de overvloed die zij vergaderd hebben, en wat zij weggelegd hebben, naar de beek van de wilgen voeren.", "8": "Want dat geschreeuw zal omgaan door het hele gebied van Moab, haar gehuil tot Eglaïm toe, ja, tot Beer-Elim toe zal haar gehuil zijn.", "9": "Want de wateren van Dimon zijn vol van het bloed, want Ik zal Dimon nog meer toeschikken: namelijk leeuwen over wie ontkomen waren van Moab, alsook over het overblijfsel van het land."}, "SV": {"1": "De last van Moab. Zekerlijk, in den nacht is Ar-moabs verwoest, zij is uitgeroeid; zekerlijk, in den nacht is Kir-moabs verwoest, zij is uitgeroeid!", "2": "Hij gaat op naar Baith en Dibon, *en* *naar* Bamoth, om te wenen; over Nebo en over Medeba zal Moab huilen; op al hun hoofden is kaalheid, aller baard is afgesneden.", "3": "Op hun wijken hebben zij zakken aangegord; op hun daken en op hun straten huilen zij altemaal, afgaande met geween.", "4": "Zo Hesbon als Eleale schreeuwt, hun stem wordt gehoord tot Jahaz toe; daarom maken de toegerusten van Moab een geschrei, eens iegelijks ziel in hem is kwalijk gesteld.", "5": "Mijn hart schreeuwt over Moab, haar grendelen zijn naar Zoar toe, de driejarige vaars; want hij gaat op met geween naar den opgang van Luhith, want op den weg naar Horonaim verwekken zij een jammergeschrei.", "6": "Want de wateren van Nimrim zullen enkel verwoesting wezen; want het gras is verdord, het tedere gras is vergaan, er is geen groente.", "7": "Daarom zullen zij den overvloed, *dien* zij vergaderd hebben, en hetgeen zij weggelegd hebben, aan de beek der wilgen voeren.", "8": "Want dat geschreeuw zal omgaan door de landpale van Moab, haar gehuil tot Eglaim toe, ja, tot Beer-elim toe zal haar gehuil zijn.", "9": "Want de wateren van Dimon zijn vol bloeds, want Ik zal Dimon nog meer toeschikken: *te* *weten* leeuwen over de ontkomenen van Moab, mitsgaders over het overblijfsel des lands."}, "KJV": {"1": "The burden of Moab. Because in the night Ar of Moab is laid waste, *and* brought to silence; because in the night Kir of Moab is laid waste, *and* brought to silence;", "2": "He is gone up to Bajith, and to Dibon, the high places, to weep: Moab shall howl over Nebo, and over Medeba: on all their heads *shall be* baldness, *and* every beard cut off.", "3": "In their streets they shall gird themselves with sackcloth: on the tops of their houses, and in their streets, every one shall howl, weeping abundantly.", "4": "And Heshbon shall cry, and Elealeh: their voice shall be heard *even* unto Jahaz: therefore the armed soldiers of Moab shall cry out; his life shall be grievous", "5": "My heart shall cry out for Moab; his fugitives *shall flee* unto Zoar, an heifer of three years old: for by the mounting up of Luhith with weeping shall they go it up; for in the way of Horonaim they shall raise up a cry of destruction.", "6": "For the waters of Nimrim shall be desolate: for the hay is withered away, the grass faileth, there is no green thing.", "7": "Therefore the abundance they have gotten, and that which they have laid up, shall they carry away to the brook of the willows.", "8": "For the cry is gone round about the borders of Moab; the howling thereof unto Eglaim, and the howling thereof unto Beerelim.", "9": "For the waters of Dimon shall be full of blood: for I will bring more upon Dimon, lions upon him that escapeth of Moab, and upon the remnant of the land."}}, "tsk": {"1": [{"kopje": "last", "refs": ["Jes 14:28-32", "Jes 13:1", "Jes 14:28"]}, {"kopje": "Moab", "refs": ["Jes 11:14", "Jes 25:10", "Jer 9:26", "Jer 48:1-47", "Ezech 25:8-11", "Amos 2:1-3", "Zef 2:8-11"]}, {"kopje": "in de nacht", "refs": ["Ex 12:29", "Ex 12:30", "1 Tess 5:1-3"]}, {"kopje": "Ar", "refs": ["Num 21:28", "Deut 2:9", "Deut 2:18"]}, {"kopje": "Kir", "refs": ["Jes 16:7", "Jes 16:11", "2 Kon 3:25", "Jer 48:31", "Jer 48:36"]}], "2": [{"kopje": "trekt op ": "Dibon", "href": "../../nave/d/#t-dibon", "kinderen": [{"label": "1. Also called Dibon-gad and Dimon", "href": "../../nave/d/?hl=Isa.15.9#i5386", "refs": [], "kinderen": [{"label": "Taken by Moab", "href": "../../nave/d/?hl=Isa.15.9#i5390", "refs": [{"disp": "Jes 15:2", "href": "../../jesaja/15/#v2", "ref": "Jes 15:2", "svLabel": null}, {"disp": "Jes 15:9", "href": "../../jesaja/15/#v9", "ref": "Jes 15:9", "svLabel": null}, {"disp": "Jer 48:18", "href": "../../jeremia/48/#v18", "ref": "Jer 48:18", "svLabel": null}, {"disp": "Jer 48:22", "href": "../../jeremia/48/#v22", "ref": "Jer 48:22", "svLabel": null}], "kinderen": []}]}]}, {"topic": "Lion", "href": "../../nave/l/#t-lion", "kinderen": [{"label": "Figurative", "href": "../../nave/l/?hl=Isa.15.9#i12742", "refs": [], "kinderen": [{"label": "Of divine judgments", "href": "../../nave/l/?hl=Isa.15.9#i12745", "refs": [{"disp": "Jes 15:9", "href": "../../jesaja/15/#v9", "ref": "Jes 15:9", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"Deut 22:8": "Wanneer u een nieuw huis bouwt, zult u op uw dak een leuning maken; opdat u geen bloedschuld op uw huis legt, wanneer iemand ervan afvalt.", "Zef 2:8-11": "Ik heb de beschimping van Moab gehoord, en de scheldwoorden van de kinderen van Ammon, waarmee zij Mijn volk beschimpt hebben, en zich groot gemaakt hebben tegen hun grondgebied. Daarom, zo waarachtig als Ik leef, spreekt de HEERE van de heerscharen, de God van Israël: Moab zal zeker zijn als Sodom, en de kinderen van Ammon als Gomorra, een netelveld, en een zoutgroeve, en een verwoesting tot in eeuwigheid! De overigen van Mijn volk zullen hen beroven, en het overige van Mijn volk zal hen erfelijk bezitten. Dat zullen zij hebben in plaats van hun hoogmoed; want zij hebben beschimpt, en zich groot gemaakt tegen het volk van de HEERE van de heerscharen.", "Num 21:26-30": "Want Hesbon was de stad van Sihon, de koning van de Amorieten; en hij had gestreden tegen de vorige koning van de Moabieten, en hij had al zijn land uit zijn hand genomen, tot aan de Arnon. Daarom zeggen zij die spreekwoorden gebruiken: Komt tot Hesbon; men bouwt en bevestigt de stad van Sihon! Want er is een vuur uitgegaan uit Hesbon; een vlam uit de stad van Sihon; het heeft Ar der Moabieten verteerd, en de heren van de hoogten van de Arnon.", "Jes 14:31": "Huil, u poort, schreeuw, u stad! u bent gesmolten, u helemaal Palestina! want van het noorden komt een rook, en er is geen eenzame in zijn samenkomsten.", "2 Sam 15:23": "En heel het land weende met luide stem, terwijl heel het volk overging; ook ging de koning over de beek Kidron, en heel het volk ging over, recht in de richting van de weg naar de woestijn.", "Jes 5:29": "Hun gebrul zal zijn als van een oude leeuw, en zij zullen brullen als de jonge leeuwen, en zij zullen grommen, en de prooi grijpen en wegvoeren; en er zal niemand zijn die redt.", "2 Sam 11:2": "Zo gebeurde het tegen de avondtijd, dat David van zijn bed opstond, en wandelde op het dak van het koningshuis, en zag van het dak een vrouw die zich waste; deze vrouw nu was zeer schoon van uiterlijk.", "1 Kon 20:31": "Toen zeiden de knechten tegen hem: Zie toch, wij hebben gehoord, dat de koningen van het huis van Israël goedertierene koningen zijn; laat ons toch rouwgewaad om onze lenden leggen, en koorden om onze hoofden, en uitgaan naar de koning van Israël; misschien zal hij uw leven sparen.", "Joz 2:6": "Maar zij had hen op het dak laten klimmen, en zij had hen verstopt onder de vlasstoppels, die zij op het dak had klaargelegd.", "Jes 15:2-5": "Hij trekt op naar Baith en Dibon, naar de hoogten, om te wenen; over Nebo en over Medeba zal Moab huilen; op al hun hoofden is kaalheid, ieders baard is afgesneden. Op hun wegen hebben zij rouwkleding aangegord; op hun daken en op hun pleinen huilen zij allemaal, terwijl zij afdalen met geween. Zowel Hesbon als Eleale schreeuwt, hun stem wordt gehoord tot Jahaz toe; daarom roepen de toegeruste soldaten van Moab luid, ieders ziel is in hem bang gemaakt.", "Jer 13:17": "Zult u dat dan nog niet horen, dan zal mijn ziel in verborgen plaatsen wenen vanwege de hoogmoed, en mijn oog zal bitter tranen, ja, van tranen neerstromen, omdat de kudde van de HEERE gevankelijk is weggevoerd.", "Jes 16:7": "Daarom zal Moab over Moab huilen, allemaal zullen zij huilen; over de fundamenten van Kir-hareseth zult u zuchten, zeker, zij zijn gebroken.", "Jer 47:5": "Kaalheid is op Gaza gekomen; Askelon is uitgeroeid, met het overblijfsel van hun dal; hoe lang zult u uzelf insnijdingen maken?", "Jer 20:18": "Waarom ben ik toch uit de baarmoeder voortgekomen, om moeite en verdriet te zien, en dat mijn dagen in schaamte vergaan?", "Jer 48:5": "Want bij de opgang naar Luhith zal geween bij geween opgaan, want bij de afgang van Horonaïm hebben de tegenstanders van Moab een jammergeschreeuw gehoord.", "Lev 13:41": "En als aan de zijkant van zijn gezicht het haar van zijn hoofd uitgevallen zal zijn, is hij bles, hij is rein.", "Jes 16:10": "zodat de blijdschap en vrolijkheid weggenomen is van het vruchtbare veld, en in de wijngaarden wordt niet gezongen, en er wordt geen gejuich gemaakt; de druiventreder treedt geen wijn uit in de wijnbakken, ik heb het vreugdegeroep doen ophouden.", "Num 21:28": "Want er is een vuur uitgegaan uit Hesbon; een vlam uit de stad van Sihon; het heeft Ar der Moabieten verteerd, en de heren van de hoogten van de Arnon.", "Jona 3:6-8": "Want dit woord bereikte de koning van Nineve, en hij stond op van zijn troon, en deed zijn heerlijke overkleed van zich af; en hij bedekte zich met een zak, en zat neer in de as. En hij liet uitroepen, en men sprak te Nineve, op bevel van de koning en zijn groten: Laat mens noch dier, rund noch schaap, iets proeven, laat ze niet grazen, noch water drinken. Maar mens en dier zullen met zakken bedekt zijn, en zullen sterk tot God roepen; en zij zullen zich bekeren, ieder van zijn boze weg, en van het geweld dat in hun handen is.", "Jer 48:1-47": "Tegen Moab zegt de HEERE van de heerscharen, de God van Israël, zo: Wee over Nebo, want zij is verwoest; Kirjathaïm is beschaamd, zij is ingenomen; de stad van het hoge vertrek is beschaamd en verschrikt. Moabs roem van Hesbon is er niet meer; zij hebben kwaad tegen haar bedacht en gezegd: Komt, laten we haar uitroeien, zodat zij geen volk meer is; ook u, o Madmen! zult neergehouwen worden, het zwaard zal achter u aan gaan. Er is een stem van geroep uit Horonaïm; verwoesting en een grote breuk!", "Deut 34:1": "Toen ging Mozes op vanaf de vlakke velden van Moab, naar de berg Nebo, op de hoogten van Pisga, die recht tegenover Jericho ligt; en de HEERE liet hem het hele land zien: Gilead tot Dan toe;", "Nahum 2:13": "Zie, Ik wil tegen u zijn, spreekt de HEERE van de heerscharen, en Ik zal haar wagens in rook verbranden, en het zwaard zal uw jonge leeuwen verteren, en Ik zal uw roof uitroeien van de aarde, en de stem van uw gezanten zal niet meer gehoord worden.", "Num 32:36": "en Beth-Nimra, en Beth-Haran, versterkte steden en schaapskooien.", "Job 16:15": "Ik heb een zak over mijn huid genaaid; ik heb mijn hoorn in het stof gedaan.", "Lev 26:28": "Dan zal Ik ook in verhitte woede tegen u in gaan, en Ik zal u ook zevenvoudig over uw zonden tuchtigen.", "Jer 6:5": "Maakt u op, en laat ons optrekken in de nacht, en haar paleizen verderven!", "Gen 19:22": "Haast u, vlucht daarheen; want Ik zal niets kunnen doen, totdat u daar aangekomen bent. Daarom noemde men de naam van deze stad Zoar.", "Gen 32:8": "want hij zei: Als Ezau op het ene leger afkomt en het verslaat, dan zal het overgebleven leger ontkomen.", "Jer 8:3": "En de dood zal boven het leven verkozen worden, door heel het overblijfsel van hen die overgebleven zijn uit dit boze geslacht, in al de plaatsen van de overgeblevenen, waarheen Ik hen verdreven zal hebben, spreekt de HEERE van de heerscharen.", "2 Kon 3:25": "De steden nu braken zij af, en ieder wierp zijn steen op alle goede stukken land, en zij vulden ze, en stopten alle waterfonteinen dicht, en velden alle goede bomen, totdat zij in Kir-hareseth alleen de stenen daarvan lieten overblijven; en de slingeraars omsingelden en sloegen de stad.", "Rom 13:12": "De nacht is voorbijgegaan, en de dag is nabij gekomen. Laten wij dan de werken van de duisternis afleggen, en de wapens van het licht aandoen.", "Jer 4:20": "Ondergang op ondergang wordt uitgeroepen; want het hele land is verwoest; haastig zijn mijn tenten verwoest, mijn gordijnen in een ogenblik!", "Gen 27:46": "En Rebekka zei tegen Izak: Ik heb een afkeer van mijn leven vanwege de dochters van Heth! Als Jakob een vrouw neemt van de dochters van Heth, zoals deze zijn, van de dochters van dit land, waartoe zal mij dan het leven zijn?", "Jona 4:3": "Nu dan, HEERE, neem toch mijn leven van mij weg; want het is beter voor mij te sterven dan te leven.", "Num 21:30": "En wij hebben hen neergeveld! Hesbon is verloren tot Dibon toe; en wij hebben hen verwoest tot Nofat toe, dat tot Medeba toe reikt.", "Gen 14:15": "En hij verdeelde zich tegen hen 's nachts, hij en zijn knechten, en versloeg hen; en hij achtervolgde hen tot Hoba toe, dat ten noorden van Damaskus ligt.", "Jer 48:22": "En over Dibon, en over Nebo, en over Beth-diblathaïm,", "Deut 2:32": "En Sihon trok uit, ons tegemoet, hij en al zijn volk, ten strijde, naar Jahaz.", "Jer 9:10": "Ik zal een geween en een klaagzang aanheffen over de bergen, en een klaaglied over de herdershutten van de woestijn; want zij zijn afgebrand, zodat er niemand doorgaat, en men hoort er geen stem van vee; van de vogels van de hemel tot de dieren toe zijn zij weggevlucht, weggegaan!", "Lev 19:27": "U zult de hoeken van het hoofd niet rond afscheren; ook zult u de hoeken van het baard niet aantasten.", "Jer 48:34": "Vanwege Hesbons geroep tot Eleale toe, tot Jahaz toe, hebben zij hun stem verheven, van Zoar tot aan Horonaïm, die driejarige vaars; want ook de wateren van Nimrim zullen tot verwoesting worden.", "Spr 27:25": "Als het gras zich vertoont, en de grasscheuten gezien worden, laat de kruiden van de bergen verzameld worden.", "Jer 48:1": "Tegen Moab zegt de HEERE van de heerscharen, de God van Israël, zo: Wee over Nebo, want zij is verwoest; Kirjathaïm is beschaamd, zij is ingenomen; de stad van het hoge vertrek is beschaamd en verschrikt.", "1 Tess 5:1-3": "Maar broeders, over de tijden en de gelegenheden hebt u niet nodig dat men u schrijft. Want u weet zelf zeer goed dat de dag van de Heere zo zal komen, zoals een dief in de nacht. Want wanneer zij zullen zeggen: Het is vrede en veilig; dan zal een plotseling verderf hun overkomen, zoals de barensweeën een zwangere vrouw overkomen; en zij zullen het geenszins ontvluchten;", "Ps 137:1": "Aan de rivieren van Babel, daar zaten wij, ook weenden wij, als wij dachten aan Sion.", "Jer 19:13": "En de huizen van Jeruzalem en de huizen van de koningen van Juda zullen, evenals alle plaatsen van Tofeth, onrein worden, met al de huizen, op wier daken zij aan heel het leger van de hemel gerookt en aan vreemde goden drankoffers geofferd hebben.", "Richt 11:20": "Doch Sihon vertrouwde het niet dat Israël door zijn gebied zou trekken; maar Sihon verzamelde al zijn volk, en zij legerden zich te Jaza; en hij streed tegen Israël.", "Joz 13:16": "dat hun gebied was vanaf Aroer af, die aan de oever van de beek Arnon ligt, en de stad die midden in de beek ligt, en heel het vlakke land tot Medeba toe;", "2 Sam 3:31": "David dan zei tegen Joab en tegen al het volk dat bij hem was: Scheur uw kleren, en doe rouwgewaden aan, en klaag over Abner. En koning David liep zelf achter de baar.", "Jes 15:1-4": "De last die op Moab rust. Zeker, in de nacht is Ar-Moab verwoest, zij is uitgeroeid; zeker, in de nacht is Kir-Moab verwoest, zij is uitgeroeid! Hij trekt op naar Baith en Dibon, naar de hoogten, om te wenen; over Nebo en over Medeba zal Moab huilen; op al hun hoofden is kaalheid, ieders baard is afgesneden. Op hun wegen hebben zij rouwkleding aangegord; op hun daken en op hun pleinen huilen zij allemaal, terwijl zij afdalen met geween.", "Deut 2:18": "U zult heden doortrekken langs Ar, het gebied van Moab;", "Jer 48:31-36": "Daarom zal Ik over Moab huilen, ja, om heel Moab zal Ik het uitschreeuwen; over de mensen van Kir-heres zal men zuchten. Meer dan om het geween van Jaëzer zal Ik u bewenen, u wijnstok van Sibma! Uw ranken zijn over de zee gegaan, zij hebben gereikt tot aan de zee van Jaëzer; maar de verwoester is gevallen op uw zomervruchten en op uw wijnoogst; Zodat de blijdschap en vreugde uit het vruchtbare veld, namelijk uit Moabs land, weggenomen is; want Ik heb de wijn doen ophouden uit de kuipen; men zal geen druiven treden met vreugdegeroep; het vreugdegeroep zal geen vreugdegeroep zijn.", "Jer 4:8": "Hierom, doe zakken aan, bedrijf misbaar en huil; want de gloed van de toorn van de HEERE is niet van ons afgekeerd.", "Hab 3:17": "Alhoewel de vijgenboom niet bloeien zal, en er geen vrucht aan de wijnstok zal zijn, dat het werk van de olijfboom liegen zal, en de velden geen voedsel voortbrengen; dat men de kudde uit de kooi zal wegscheuren, en dat er geen rund in de stallen zal zijn;", "Jer 17:16": "Ik heb toch niet aangedrongen, meer dan een herder achter U betaamde; ook heb ik de dodelijke dag niet begeerd, Gij weet het; wat uit mijn lippen is gegaan, is voor Uw aangezicht geweest.", "Jes 22:1": "De last van het dal van het gezicht. Wat is er nu met u, dat u helemaal naar de daken bent geklommen?", "Lev 21:5": "Zij zullen op hun hoofd geen kaalheid maken, en zullen de hoek van hun baard niet afscheren, en in hun vlees zullen zij geen sneden snijden.", "Micha 1:16": "Maak u kaal en scheer u, om uw troetelkinderen; verwijd uw kaalheid, als de arend, omdat zij gevankelijk van u zijn weggevoerd.", "Joz 13:17": "Hesbon en al haar steden, die in het vlakke land zijn, Dibon, en Bamoth-baal, en Beth-baal-meon,", "Richt 7:16-23": "En hij deelde de driehonderd man in drie groepen; en hij gaf ieder een bazuin in zijn hand, en lege kruiken, en fakkels in het midden van de kruiken. En hij zei tegen hen: Kijk naar mij en doe hetzelfde; en zie, wanneer ik aan het uiterste van het leger kom, zal het zo zijn: zoals ik zal doen, zo zult u doen. Als ik met de bazuin blaas, ik en allen die met mij zijn, dan zult ook u met de bazuin blazen, rondom het hele leger, en u zult zeggen: Voor de HEERE en voor Gideon!", "Hab 3:18": "Zo zal ik toch in de HEERE van vreugde opspringen, ik zal mij verheugen in de God van mijn heil.", "Job 3:20-22": "Waarom geeft Hij de ellendigen het licht, en het leven de bitterlijk bedroefden van gemoed? Die verlangen naar de dood, maar hij is er niet; en graven daarnaar meer dan naar verborgen schatten; Die blij zijn tot het opspringen toe, en zich verheugen, als zij het graf vinden;", "Lev 26:24": "Dan zal Ik ook tegen u in gaan, en Ik zal u ook zevenvoudig over uw zonden slaan.", "Ezech 47:10": "Ook zal het gebeuren dat er vissers bij zullen staan, van En-Gedi tot En-Eglaim toe; daar zullen plaatsen zijn om netten uit te spreiden; de vis zal naar zijn soort zijn als de vis van de grote zee, heel talrijk.", "Jer 48:20-24": "Moab is beschaamd, want hij is verslagen; huilt en schreeuwt! Verkondigt het bij Arnon, dat Moab verwoest is. En het oordeel is gekomen over het vlakke land; over Holon, en over Jahza, en over Mefaäth, En over Dibon, en over Nebo, en over Beth-diblathaïm,", "Jer 8:18": "Mijn verkwikking is in droefenis; mijn hart is flauw in mij.", "Lev 26:21": "En als u tegen Mij in blijft ingaan, en Mij niet wilt horen, zal Ik over u, naar uw zonden, zevenvoudig slagen toedoen.", "Jer 48:37": "Want alle hoofden zijn kaal, en alle baarden afgeknipt; op alle handen zijn insnijdingen, en op de lenden is een rouwkleed.", "1 Kon 19:4": "Maar hijzelf ging een dagreis de woestijn in, en kwam en ging zitten onder een jeneverboom; en bad dat hij mocht sterven, en zei: Het is genoeg; neem nu, HEERE, mijn leven, want ik ben niet beter dan mijn vaderen.", "Jes 21:12": "De wachter zei: De morgenstond is gekomen, en het is nog nacht; als u wilt vragen, vraag; keer terug, kom.", "2 Kon 6:30": "En het gebeurde, toen de koning de woorden van deze vrouw gehoord had, dat hij zijn kleren scheurde, terwijl hij over de muur voortging; en het volk zag dat er, zie, een zak van binnen over zijn vlees was.", "Ps 137:2": "Wij hebben onze harpen gehangen aan de wilgen, die daar zijn.", "Joh 9:4": "Ik moet de werken doen van Hem die Mij gezonden heeft, zolang het dag is; de nacht komt, waarin niemand kan werken.", "Jer 48:43-45": "De angst, en de kuil, en de strik, over u, inwoner van Moab! spreekt de HEERE. Wie voor de angst vlucht, zal in de kuil vallen, en wie uit de kuil opklimt, zal in de strik gevangen worden; want Ik zal over haar, over Moab, het jaar van hun bezoeking brengen, spreekt de HEERE. Zij die voor de macht van de vijand vluchtten, bleven staan in de schaduw van Hesbon; maar een vuur is uitgegaan van Hesbon, en een vlam van tussen Sihon, en heeft de hoeken van Moab en de schedel van de kinderen van het rumoer verteerd.", "Job 7:15": "Zodat mijn ziel de verworging kiest; de dood meer dan mijn beenderen.", "1 Kor 3:12": "En als iemand op dit fundament bouwt: goud, zilver, kostbare stenen, hout, hooi, stoppels;", "Jer 49:3": "Huil, o Hesbon! want Ai is verwoest; roep, dochters van Rabba, gord zakken aan, drijf misbaar, en loop heen en weer bij de tuinen; want Malcham zal wandelen in gevangenschap, zijn priesters en zijn vorsten samen.", "Jer 15:3": "Want Ik zal een bezoeking over hen brengen met vier soorten straf, spreekt de HEERE: met het zwaard, om te doden; en met de honden, om te verscheuren; en met het gevogelte van de hemel, en met het gedierte van de aarde, om op te eten en te vernietigen.", "2 Sam 15:30": "En David ging op door de opgang van de olijven, terwijl hij opging en weende, en zijn hoofd was bedekt; en hij zelf ging blootsvoets; ook had heel het volk dat bij hem was, ieder zijn hoofd bedekt, en zij gingen op, terwijl zij opgingen en weenden.", "Gen 14:14": "Toen Abram hoorde dat zijn broeder gevangen was genomen, wapende hij zijn geoefende mannen, geboren in zijn eigen huis, driehonderd achttien, en hij achtervolgde hen tot Dan toe.", "Jes 22:12": "En op die dag zal de Heere, de HEERE van de heerscharen, roepen tot geween, en tot rouwklacht, en tot kaalheid, en tot omgording met de zak.", "Jer 48:18": "Daal neer uit uw heerlijkheid, en woon in dorst, u inwoonster, u dochter van Dibon! Want de verwoester van Moab is tegen u opgetrokken, hij heeft uw vestingen verwoest.", "Jer 6:26": "O dochter van Mijn volk! Gord een zak aan, en wentel u in de as, bedrijf rouw als om een enige zoon, een zeer bitter misbaar; want de verstoorder zal ons snel overkomen.", "Jona 4:8": "En het gebeurde, toen de zon opkwam, dat God een hete oostenwind liet waaien; en de zon stak op het hoofd van Jona, zodat hij bijna bezweek; en hij wenste dat hij mocht sterven, en zei: Het is beter voor mij te sterven dan te leven.", "Job 1:20": "Toen stond Job op, en scheurde zijn mantel, en schoor zijn hoofd, en viel op de aarde, en boog zich neer;", "1 Tess 5:5": "U bent allen kinderen van het licht en kinderen van de dag; wij zijn niet van de nacht, en ook niet van de duisternis.", "Ex 12:30": "En Farao stond 's nachts op, hij en al zijn dienaren, en alle Egyptenaren; en er was een groot geschreeuw in Egypte; want er was geen huis waarin niet een dode was.", "Num 32:38": "en Nebo, en Baäl-Meon, waarvan de naam veranderd was, en Sibma; en zij noemden de steden die zij bouwden met andere namen.", "Jes 10:6": "Ik zal hem zenden tegen een huichelachtig volk, en Ik zal hem bevel geven tegen het volk van Mijn verbolgenheid; opdat hij de roof rooft, en plundert de plundering, en het stelt ter vertreding, als het slijk van de straten.", "2 Kon 17:25": "En het gebeurde in het begin van hun wonen daar, dat zij de HEERE niet vreesden; toen zond de HEERE leeuwen onder hen, die enkelen van hen doodden.", "Jer 9:18": "En zich haasten, en een klaagzang over ons aanheffen, zodat onze ogen van tranen neerdalen, en onze oogleden van water druipen.", "Jes 16:9": "Daarom beween ik, met de wening over Jaezer, de wijnstok van Sibma; ik maak u doornat met mijn tranen, o Hesbon en Eleale! Want het vreugdegeroep over uw zomervruchten en over uw oogst is verstomd;", "Lev 13:40": "En als een man zijn hoofdhaar uitgevallen zal zijn, is hij kaal, hij is rein.", "Num 32:3": "Ataroth, en Dibon, en Jaezer, en Nimra, en Hesbon, en Eleale, en Schebam, en Nebo, en Behon;", "Luk 19:41-44": "En toen Hij dichtbij kwam en de stad zag, weende Hij over haar, en zei: Och, had u ook maar geweten, ook nog op deze dag van u, wat tot uw vrede dient! Maar nu is het verborgen voor uw ogen. Want er zullen dagen over u komen, dat uw vijanden een wal rondom u zullen opwerpen, en u zullen omsingelen, en u van alle kanten in het nauw drijven;", "Amos 2:1-3": "Zo zegt de HEERE: Om drie overtredingen van Moab, en om vier zal Ik dat niet afwenden; omdat hij de beenderen van de koning van Edom tot kalk verbrand heeft. Daarom zal Ik een vuur in Moab zenden, dat zal de paleizen van Kerioth verteren; en Moab zal sterven met groot gedruis, met gejuich, met geluid van de bazuin. En Ik zal de rechter uit het midden van haar uitroeien; en al haar vorsten zal Ik met hem doden, zegt de HEERE.", "Jer 48:21-24": "En het oordeel is gekomen over het vlakke land; over Holon, en over Jahza, en over Mefaäth, En over Dibon, en over Nebo, en over Beth-diblathaïm, En over Kirjathaïm, en over Beth-gamul, en over Beth-meon,", "Joz 13:18": "En Jahza, en Kedemoth, en Mefaath,", "Jer 48:3": "Er is een stem van geroep uit Horonaïm; verwoesting en een grote breuk!", "Jer 48:31": "Daarom zal Ik over Moab huilen, ja, om heel Moab zal Ik het uitschreeuwen; over de mensen van Kir-heres zal men zuchten.", "Job 7:16": "Ik versmaad ze, ik zal toch in eeuwigheid niet leven; houd op met mij, want mijn dagen zijn ijdelheid.", "Jer 9:26": "Over Egypte, en over Juda, en over Edom, en over de kinderen van Ammon, en over Moab, en over allen die aan de hoeken kortgeknipt zijn, die in de woestijn wonen; want alle heidenen hebben de voorhuid, maar het hele huis van Israël heeft de voorhuid van het hart.", "Jes 16:9-11": "Daarom beween ik, met de wening over Jaezer, de wijnstok van Sibma; ik maak u doornat met mijn tranen, o Hesbon en Eleale! Want het vreugdegeroep over uw zomervruchten en over uw oogst is verstomd; zodat de blijdschap en vrolijkheid weggenomen is van het vruchtbare veld, en in de wijngaarden wordt niet gezongen, en er wordt geen gejuich gemaakt; de druiventreder treedt geen wijn uit in de wijnbakken, ik heb het vreugdegeroep doen ophouden. Daarom rommelt mijn binnenste over Moab, als een harp, en mijn hart over Kir-heres.", "Num 11:15": "En als U zo met mij doet, dood mij dan toch maar meteen, als ik genade in Uw ogen gevonden heb; en laat mij mijn ongeluk niet aanzien!", "Luk 12:3": "Daarom, alles wat u in het duister gezegd hebt, zal in het licht gehoord worden; en wat u in het oor gesproken hebt, in de binnenkamers, zal op de daken gepredikt worden.", "Jes 19:1": "De last van Egypte. Zie, de HEERE rijdt op een snelle wolk, en Hij zal in Egypte komen; en de afgoden van Egypte zullen bewogen worden vanwege Zijn aangezicht, en het hart van de Egyptenaren zal smelten in hun binnenste.", "Jer 48:23": "En over Kirjathaïm, en over Beth-gamul, en over Beth-meon,", "Joël 1:10-12": "Het veld is verwoest, het land treurt; want het koren is verwoest, de most is verdroogd, de olie is uitgeput. De akkerlieden zijn beschaamd, de wijngaardeniers huilen, om de tarwe en om de gerst, want de oogst van het veld is vergaan. De wijnstok is verdord, de vijgenboom is uitgeput; de granaatappelboom, ook de palmboom en appelboom; alle bomen van het veld zijn verdord; ja, de vrolijkheid is verdord van de mensenkinderen.", "Amos 5:19": "Zoals wanneer iemand vlucht voor het aangezicht van een leeuw, en een beer hem ontmoet; of dat hij in een huis komt, en met zijn hand tegen de wand leunt, en een slang hem bijt.", "Jes 21:11": "De last van Duma. Men roept tot mij uit Seïr: Wachter! wat is er van de nacht? Wachter! wat is er van de nacht?", "Jes 14:28": "In het jaar dat koning Achaz stierf, gebeurde deze last.", "Jes 16:14": "Maar nu spreekt de HEERE en zegt: Binnen drie jaar (zoals de jaren van het huurling), dan zal de eer van Moab veracht worden, met heel die grote menigte; en het overblijfsel zal klein, weinig, machteloos zijn.", "Jer 48:31-34": "Daarom zal Ik over Moab huilen, ja, om heel Moab zal Ik het uitschreeuwen; over de mensen van Kir-heres zal men zuchten. Meer dan om het geween van Jaëzer zal Ik u bewenen, u wijnstok van Sibma! Uw ranken zijn over de zee gegaan, zij hebben gereikt tot aan de zee van Jaëzer; maar de verwoester is gevallen op uw zomervruchten en op uw wijnoogst; Zodat de blijdschap en vreugde uit het vruchtbare veld, namelijk uit Moabs land, weggenomen is; want Ik heb de wijn doen ophouden uit de kuipen; men zal geen druiven treden met vreugdegeroep; het vreugdegeroep zal geen vreugdegeroep zijn.", "Jes 16:12": "En het zal gebeuren, wanneer men zal zien dat Moab moe geworden is op de hoogten, dan zal hij naar zijn heiligdom gaan om te aanbidden, maar hij zal het niet kunnen.", "2 Sam 16:22": "Zo spanden zij voor Absalom een tent op op het dak; en Absalom ging naar de bijvrouwen van zijn vader, voor de ogen van heel Israël.", "Jes 25:10": "Want de hand van de HEERE zal op deze berg rusten; maar Moab zal onder Hem verdorst worden, zoals het stro verdorst wordt tot mest.", "1 Kon 20:32": "Toen gordden zij rouwgewaad om hun lenden, en koorden om hun hoofden, en kwamen naar de koning van Israël, en zeiden: Uw knecht Benhadad zegt: Laat toch mijn leven gespaard blijven. En hij zei: Leeft hij dan nog? Hij is mijn broeder.", "Ezech 7:18": "Ook zullen zij zakken aangorden, gruwen zal hen bedekken, en over alle gezichten zal schaamte zijn, en op al hun hoofden kaalheid.", "Jes 22:5": "Want het is een dag van beroering, en van vertrapping, en van verwarring van de Heere, de HEERE van de heerscharen, in het dal van het gezicht, een dag van afbraak van het muur, en van geschreeuw naar het gebergte toe.", "Joz 21:36": "En van de stam van Ruben, Bezer en haar voorsteden, en Jahza en haar voorsteden;", "Matt 11:21": "Wee u, Chorazin! Wee u, Bethsaïda! Want als in Tyrus en Sidon de krachten gebeurd waren die in u gebeurd zijn, zouden zij zich lang geleden in zak en as bekeerd hebben.", "Openb 8:7": "En de eerste engel heeft op de bazuin geblazen, en er kwam hagel en vuur, gemengd met bloed, en die werden op de aarde geworpen; en het derde deel van de bomen is verbrand, en al het groene gras is verbrand.", "2 Sam 15:32-34": "En het gebeurde, toen David tot op de hoogte kwam, waar hij God aanbad, zie, toen ontmoette Husai, de Archiet, hem, met zijn kleed gescheurd, en aarde op zijn hoofd. En David zei tegen hem: Als u met mij meegaat, zult u mij tot een last zijn; maar als u teruggaat naar de stad, en tegen Absalom zegt: Uw knecht, ik zal van de koning zijn; ik ben eerder wel de knecht van uw vader geweest, maar nu zal ik uw knecht zijn; dan zou u voor mij de raad van Achitofel teniet doen.", "Lev 26:22": "Want Ik zal onder u zenden het gedierte van het veld, dat u van uw kinderen zal beroven, en uw vee zal uitroeien, en u zal verminderen; en uw wegen zullen woest worden.", "Klaagl 2:10": "Jod. De oudsten van de dochter van Sion zitten op de aarde, zij zwijgen stil, zij werpen stof op hun hoofd, zij hebben zakken aangegord; de jonge dochters van Jeruzalem laten hun hoofd ter aarde hangen.", "Jer 11:5": "Opdat Ik de eed bevestig, die Ik uw vaderen gezworen heb, hun een land te geven vloeiende van melk en honing, zoals het is op deze dag. Toen antwoordde ik en zei: Amen, o HEERE!", "Jes 16:11": "Daarom rommelt mijn binnenste over Moab, als een harp, en mijn hart over Kir-heres.", "Richt 20:29-43": "Toen stelde Israël hinderlagen op tegen Gibea rondom. En de kinderen van Israël trokken op, op de derde dag, tegen de kinderen van Benjamin; en zij schikten de strijd tegen Gibea, zoals de andere keren. Toen trokken de kinderen van Benjamin uit, het volk tegemoet, en werden van de stad afgetrokken; en zij begonnen te slaan van het volk, en te doorsteken, zoals de andere keren, op de wegen waarvan de ene opgaat naar het huis van God, en de andere naar Gibea, in het veld, ongeveer dertig man van Israël.", "Jes 7:20": "Op die dag zal de Heere door een gehuurd scheermes, dat aan de andere kant van de rivier is, door de koning van Assyrië, het hoofd afscheren, en het haar van de voeten; ja, het zal ook de baard helemaal wegnemen.", "Deut 2:9": "Toen zei de HEERE tegen mij: Beangstig Moab niet, en meng u niet met hen in de strijd; want Ik zal u geen erfenis van hun land geven, omdat Ik aan de kinderen van Lot Ar tot erfenis gegeven heb.", "Joz 13:27": "En in het dal, Beth-haram, en Beth-nimra, en Sukkoth, en Zefon, wat overgebleven was van het koninkrijk van Sihon, de koning te Hesbon, de Jordaan en het gebied daarlangs, tot aan het einde van de zee van Cinnereth toe, aan de overkant van de Jordaan, naar het oosten toe.", "1 Sam 9:25": "Daarna gingen zij van de hoogte af naar de stad; en hij sprak met Saul op het dak.", "Deut 34:3": "En het zuiden, en het vlakke veld van de vallei van Jericho, de palmstad, tot Zoar toe.", "Jer 48:39": "Hoe is hij verslagen! Zij huilen; hoe heeft Moab de nek met schaamte gewend! Zo zal Moab voor allen die rondom hem zijn tot bespotting en tot ontzetting worden.", "Jes 3:24": "En het zal gebeuren, dat er voor specerij stank zal zijn, en een touw voor een gordel, en kaalheid in plaats van haarvlechten, en omgording van een zak in plaats van een wijde rok, en verbranding in plaats van schoonheid.", "Matt 24:17": "wie op het dak is, moet niet naar beneden komen om iets uit zijn huis weg te nemen;", "Gen 32:7": "Toen werd Jakob erg bang en benauwd; en hij verdeelde het volk dat bij hem was, en de schapen, en de runderen, en de kamelen, in twee legers;", "Jer 47:1-51": "Het woord van de HEERE dat gebeurde tot de profeet Jeremia, tegen de Filistijnen; voordat Farao Gaza sloeg. Zo zegt de HEERE: Zie, er komt water op van het noorden, en het zal worden tot een overlopende beek, en zal overlopen het land en de volheid ervan, de stad en wie daarin wonen; en de mensen zullen schreeuwen, en alle inwoners van het land zullen huilen; Vanwege het geluid van het geklater van de hoeven van zijn sterke paarden, vanwege het geraas van zijn wagens, en het bulderen van zijn raderen; de vaders zien niet om naar de kinderen, vanwege de slapheid van de handen;", "Jes 11:14": "Maar zij zullen op de schouder van de Filistijnen vliegen naar het westen, en zij zullen samen die van het oosten beroven; aan Edom en Moab zullen zij hun handen slaan, en de kinderen van Ammon zullen hun gehoorzaam zijn.", "Dan 9:3": "En ik richtte mijn gezicht tot God, de HEERE, om Hem te zoeken met gebed en smekingen, met vasten, en een zak, en as.", "Ezech 5:1": "En u, mensenkind, neem een scherp mes, een scheermes van de barbiers zult u nemen, en dat zult u over uw hoofd en over uw baard laten gaan; daarna zult u een weegschaal nemen, en die haren verdelen.", "Gen 13:10": "En Lot hief zijn ogen op, en zag de hele vlakte van de Jordaan, dat die overal goed bevochtigd was; voordat de HEERE Sodom en Gomorra verwoest had, was zij als de hof van de HEERE, als het land Egypte, tot waar men bij Zoar komt.", "Jes 17:1": "De last van Damaskus. Zie, Damaskus zal weggenomen worden, zodat het geen stad meer is, maar het zal een vervallen steenhoop zijn.", "Jer 48:36": "Daarom zal Mijn hart over Moab klagen als de fluiten; ook zal Mijn hart over de mensen van Kir-heres klagen als de fluiten, omdat het overschot dat hij gemaakt had, verloren is.", "Deut 14:1": "U bent kinderen van de HEERE, uw God. U zult uzelf niet snijden, en geen kaalheid maken tussen uw ogen, over een dode.", "Jes 14:28-32": "In het jaar dat koning Achaz stierf, gebeurde deze last. Verheug u niet, u helemaal Palestina! dat de roede die u sloeg, gebroken is; want uit de wortel van de slang zal een basilisk voortkomen, en haar vrucht zal een vurige vliegende draak zijn. En de eerstgeborenen van de armen zullen weiden, en de behoeftigen zullen zeker neerliggen; uw wortel daarentegen zal Ik door de honger doden, en uw overblijfsel zal hij ombrengen.", "Jes 16:2-11": "Anders zal het gebeuren, dat de dochters van Moab bij de veren van de Arnon zullen zijn, als een vogel die rondzwerft, uit het nest verjaagd. Breng raad, houd gericht, maak uw schaduw als de nacht in het midden van de middag; verberg de verdrevenen, en verraad hem die rondzwerft niet. Laat mijn verdrevenen bij u wonen, o Moab! Wees u hun een schuilplaats voor het aangezicht van de verwoester; want de onderdrukker heeft een einde, de verwoesting is opgehouden, de vertreders zijn van de aarde verdwenen.", "Jes 13:1": "De last van Babel, die Jesaja, de zoon van Amoz, gezien heeft.", "Nahum 2:12": "De leeuw, die genoeg roofde voor zijn welpen, en worgde voor zijn oude leeuwinnen, die zijn holen vervulde met roof, en zijn woningen met het geroofde.", "Jer 48:38": "Op alle daken van Moab, en op al haar straten is overal rouwklacht; want Ik heb Moab verbroken als een vat waaraan men geen behagen heeft, spreekt de HEERE.", "Lev 26:18": "En als u Mij ook na deze dingen niet zult horen, zal Ik nog daaraan toedoen, om u zevenvoudig over uw zonden te tuchtigen.", "Richt 16:27": "Het huis nu was vol mannen en vrouwen; ook waren daar alle vorsten van de Filistijnen; en op het dak waren ongeveer drieduizend mannen en vrouwen, die toekeken, terwijl Simson speelde.", "Num 32:4": "Dit land, dat de HEERE voor de ogen van de vergadering van Israël verslagen heeft, is een land geschikt voor vee; en uw knechten hebben vee.", "Openb 9:6": "En in die dagen zullen de mensen de dood zoeken, en zullen die niet vinden; en zij zullen ernaar verlangen te sterven, en de dood zal van hen wegvluchten.", "Jer 7:29": "Scheer uw hoofdhaar af, o Jeruzalem! en werp het weg, en hef een weeklacht aan op de hoge plaatsen; want de HEERE heeft het geslacht van Zijn verbolgenheid verworpen en verlaten.", "Rom 9:1-3": "Ik zeg de waarheid in Christus, ik lieg niet (mijn geweten geeft mij daarbij getuigenis door de Heilige Geest), dat het mij een grote droefheid en mijn hart een aanhoudend verdriet is. Want ik zou zelf wel wensen verbannen te zijn van Christus, voor mijn broeders, die mijn verwanten zijn naar het vlees;", "Jer 48:21": "En het oordeel is gekomen over het vlakke land; over Holon, en over Jahza, en over Mefaäth,", "Jes 10:14": "en mijn hand heeft het vermogen van de volken gevonden, als een nest, en ik heb het hele aardrijk samengeraapt, zoals men de eieren die verlaten zijn samenraapt; en er is niemand geweest die een vleugel bewoog, of de bek opendeed, of piepte.", "Ezech 25:8-11": "Zo zegt de Heere HEERE: Omdat Moab en Seïr zeggen: Zie, het huis van Juda is gelijk aan al de heidenvolken; Daarom, zie, Ik zal de zijde van Moab openen, vanaf de steden, vanaf zijn steden die aan zijn grenzen liggen, het sieraad van het land, Beth-Jesimoth, Baäl-Meon, en tot Kirjathaïm toe; Voor die van het oosten, met het land van de kinderen van Ammon, dat Ik tot bezitting zal overgeven; opdat aan de kinderen van Ammon onder de heidenvolken niet meer gedacht wordt.", "Gen 14:2": "dat zij oorlog voerden met Bera, koning van Sodom, en met Birsa, koning van Gomorra, Sinab, koning van Adama, en Semeber, koning van Zeboim, en de koning van Bela, dat is Zoar.", "Joz 8:3-25": "Toen maakte Jozua zich klaar, en al het krijgsvolk, om op te trekken naar Ai. En Jozua koos dertigduizend mannen, strijdbare helden, en hij stuurde hen 's nachts erop uit, en gebood hun: Let op, u zult de stad in een hinderlaag lokken van achter de stad; houd u niet al te ver van de stad, en wees allen gereed. Ik nu, en al het volk dat bij mij is, zullen de stad naderen; en het zal gebeuren, wanneer zij ons tegemoet uittrekken zoals eerst, dat wij voor hen zullen vluchten.", "Num 21:23": "Doch Sihon liet Israël niet toe door zijn gebied te trekken; maar Sihon verzamelde al zijn volk, en hij ging uit, Israël tegemoet, naar de woestijn, en hij kwam te Jahza, en streed tegen Israël;", "Ex 12:29": "En het gebeurde te middernacht, dat de HEERE alle eerstgeborenen in Egypteland sloeg, van de eerstgeborene van Farao af, die op zijn troon zou zitten, tot de eerstgeborene van de gevangene, die in de gevangenis was, en alle eerstgeborenen van het vee.", "Jes 16:8": "Want de velden van Hesbon zijn verdord, ook de wijnstok van Sibma; de heren van de heidenvolken hebben zijn beste planten verpletterd; zij reiken tot Jaezer toe, zij dwaalden door de woestijn; hun scheuten zijn uitgespreid, zij zijn over de zee gegaan.", "Joël 1:8": "Kerm, als een jonkvrouw, die met een zak omgord is vanwege de man van haar jeugd.", "Jer 8:19": "Zie, de stem van het geschrei van de dochter van mijn volk klinkt uit een zeer ver land: Is de HEERE dan niet in Sion, is haar Koning niet bij haar? Waarom hebben zij Mij vertoornd met hun gesneden beelden, met de nietige afgoden van de vreemden?", "Jes 15:1-9": "De last die op Moab rust. Zeker, in de nacht is Ar-Moab verwoest, zij is uitgeroeid; zeker, in de nacht is Kir-Moab verwoest, zij is uitgeroeid! Hij trekt op naar Baith en Dibon, naar de hoogten, om te wenen; over Nebo en over Medeba zal Moab huilen; op al hun hoofden is kaalheid, ieders baard is afgesneden. Op hun wegen hebben zij rouwkleding aangegord; op hun daken en op hun pleinen huilen zij allemaal, terwijl zij afdalen met geween.", "Lev 19:28": "U zult om een dood lichaam geen snijding in uw vlees maken, noch een schrift van een ingedrukt teken op u maken; Ik ben de HEERE!", "Jer 9:19": "Want er is een stem van weeklacht gehoord uit Sion: Hoe zijn wij verwoest! Wij zijn zeer beschaamd, omdat wij het land hebben verlaten, omdat zij onze woningen hebben omgeworpen."}, "noten": {"1": "SV: wijken (= straten, wegen)"}, "k lass=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> is laid <span class=\"wl wl-kjv\" data-code=\"H7703\">waste,</span> and brought to silence;", "2": "He is gone <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H1006\">Bajith,</span> and to <span class=\"wl wl-kjv\" data-code=\"H1769\">Dibon,</span> the high <span class=\"wl wl-kjv\" data-code=\"H1116\">places,</span> to <span class=\"wl wl-kjv\" data-code=\"H1065\">weep:</span> <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> shall <span class=\"wl wl-kjv\" data-code=\"H3213\">howl</span> over <span class=\"wl wl-kjv\" data-code=\"H5015\">Nebo,</span> and over <span class=\"wl wl-kjv\" data-code=\"H4311\">Medeba:</span> on all their <span class=\"wl wl-kjv\" data-code=\"H7218\">heads</span> shall be <span class=\"wl wl-kjv\" data-code=\"H7144\">baldness,</span> and every <span class=\"wl wl-kjv\" data-code=\"H2206\">beard</span> cut off.", "3": "In their <span class=\"wl wl-kjv\" data-code=\"H2351\">streets</span> they shall <span class=\"wl wl-kjv\" data-code=\"H2296\">gird</span> themselves with <span class=\"wl wl-kjv\" data-code=\"H8242\">sackcloth:</span> on the <span class=\"wl wl-kjv\" data-code=\"H1406\">tops</span> of their houses, and in their <span class=\"wl wl-kjv\" data-code=\"H7339\">streets,</span> every one shall <span class=\"wl wl-kjv\" data-code=\"H3213\">howl,</span> <span class=\"wl wl-kjv\" data-code=\"H1065\">weeping</span> abundantly.", "4": "And <span class=\"wl wl-kjv\" data-code=\"H2809\">Heshbon</span> shall <span class=\"wl wl-kjv\" data-code=\"H2199\">cry,</span> and <span class=\"wl wl-kjv\" data-code=\"H500\">Elealeh:</span> their <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> shall be <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> even unto <span class=\"wl wl-kjv\" data-code=\"H3096\">Jahaz:</span> therefore the armed <span class=\"wl wl-kjv\" data-code=\"H2502\">soldiers</span> of <span class=\"wl wl const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    let h = '<div class="verg-kop">Grondwoorden</div>';
    if (!heeftB && !heeftK) {
      h += '<em>Nog geen woordkoppeling voor dit vers.</em>';
    } else {
      if (heeftB) h += `<div class="tsk-kop">SVnu</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      h += '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
    }
    h += '<div class="verg-kop" style="margin-top:1.4rem">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vergelijk</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een vers: snel wisselen van vertaling ---------- */
(function () {
  const menu = document.createElement('div');
  menu.id = 'vertmenu';
  menu.style.cssText = 'position:absolute;display:none;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.3rem;font-family:sans-serif;font-size:.85rem;z-index:30;min-width:7rem;';
  document.body.appendChild(menu);
  function toon(x, y) {
    menu.innerHTML = Object.keys(D.vertalingen).map(naam =>
      `<div class="vm-optie" data-v="${naam}" style="padding:.35rem .6rem;border-radius:5px;cursor:pointer;${naam === vertaling ? 'font-weight:700;color:var(--accent-donker)' : ''}">${naam}</div>`
    ).join('');
    const breedte = document.documentElement.clientWidth;
    menu.style.left = Math.max(4, Math.min(x, breedte - 130)) + 'px';
    menu.style.top = y + 'px';
    menu.style.display = 'block';
  }
  document.addEventListener('contextmenu', e => {
    const rij = e.target.closest('.vers');
    if (!rij) return;
    e.preventDefault();
    toon(e.pageX, e.pageY);
  });
  menu.addEventListener('mouseover', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = 'var(--bg-soft)';
  });
  menu.addEventListener('mouseout', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = '';
  });
  menu.addEventListener('click', e => {
    const o = e.target.closest('.vm-optie');
    if (!o) return;
    vertaling = o.dataset.v;
    const kies = document.getElementById('vertaalkies');
    if (kies) kies.value = vertaling;
    bouwRijen();
    menu.style.display = 'none';
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#vertmenu')) menu.style.display = 'none';
  });
  document.addEventListener('scroll', () => { menu.style.display = 'none'; }, true);
})();
</script>
