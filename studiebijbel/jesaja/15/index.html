l":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"De last die op Moab rust. Zeker, in de nacht is Ar-Moab verwoest, zij is uitgeroeid; zeker, in de nacht is Kir-Moab verwoest, zij is uitgeroeid!","2":"Hij trekt op naar Baith en Dibon, naar de *hoogten*, om te wenen; over Nebo en over Medeba zal Moab huilen; op al hun hoofden is kaalheid, ieders baard is afgesneden.","3":"Op hun wegen[1] hebben zij rouwkleding aangegord; op hun daken en op hun pleinen huilen zij allemaal, terwijl zij afdalen met geween.","4":"Zowel Hesbon als Eleale schreeuwt, hun stem wordt gehoord tot Jahaz toe; daarom roepen de toegeruste soldaten van Moab luid, ieders ziel is in hem bang gemaakt.","5":"Mijn hart schreeuwt over Moab, zijn vluchtelingen gaan naar Zoar toe, de driejarige vaars. Want hij gaat op met geween naar de bergpas van Luhith, want op de weg naar Horonaim verwekken zij een jammergeschrei over de verwoesting.","6":"Want de wateren van Nimrim zullen enkel verwoesting zijn; want het gras is verdord, het tedere gras is vergaan, er is geen groen meer.","7":"Daarom zullen zij de overvloed die zij vergaderd hebben, en wat zij weggelegd hebben, naar de beek van de wilgen voeren.","8":"Want dat geschreeuw zal omgaan door het hele gebied van Moab, haar gehuil tot Eglaïm toe, ja, tot Beer-Elim toe zal haar gehuil zijn.","9":"Want de wateren van Dimon zijn vol van het bloed, want Ik zal Dimon nog meer toeschikken: namelijk leeuwen over wie ontkomen waren van Moab, alsook over het overblijfsel van het land."},"SV":{"1":"De last van Moab. Zekerlijk, in den nacht is Ar-moabs verwoest, zij is uitgeroeid; zekerlijk, in den nacht is Kir-moabs verwoest, zij is uitgeroeid!","2":"Hij gaat op naar Baith en Dibon, *en* *naar* Bamoth, om te wenen; over Nebo en over Medeba zal Moab huilen; op al hun hoofden is kaalheid, aller baard is afgesneden.","3":"Op hun wijken hebben zij zakken aangegord; op hun daken en op hun straten huilen zij altemaal, afgaande met geween.","4":"Zo Hesbon als Eleale schreeuwt, hun stem wordt gehoord tot Jahaz toe; daarom maken de toegerusten van Moab een geschrei, eens iegelijks ziel in hem is kwalijk gesteld.","5":"Mijn hart schreeuwt over Moab, haar grendelen zijn naar Zoar toe, de driejarige vaars; want hij gaat op met geween naar den opgang van Luhith, want op den weg naar Horonaim verwekken zij een jammergeschrei.","6":"Want de wateren van Nimrim zullen enkel verwoesting wezen; want het gras is verdord, het tedere gras is vergaan, er is geen groente.","7":"Daarom zullen zij den overvloed, *dien* zij vergaderd hebben, en hetgeen zij weggelegd hebben, aan de beek der wilgen voeren.","8":"Want dat geschreeuw zal omgaan door de landpale van Moab, haar gehuil tot Eglaim toe, ja, tot Beer-elim toe zal haar gehuil zijn.","9":"Want de wateren van Dimon zijn vol bloeds, want Ik zal Dimon nog meer toeschikken: *te* *weten* leeuwen over de ontkomenen van Moab, mitsgaders over het overblijfsel des lands."},"KJV":{"1":"The burden of Moab. Because in the night Ar of Moab is laid waste, *and* brought to silence; because in the night Kir of Moab is laid waste, *and* brought to silence;","2":"He is gone up to Bajith, and to Dibon, the high places, to weep: Moab shall howl over Nebo, and over Medeba: on all their heads *shall be* baldness, *and* every beard cut off.","3":"In their streets they shall gird themselves with sackcloth: on the tops of their houses, and in their streets, every one shall howl, weeping abundantly.","4":"And Heshbon shall cry, and Elealeh: their voice shall be heard *even* unto Jahaz: therefore the armed soldiers of Moab shall cry out; his life shall be grievous","5":"My heart shall cry out for Moab; his fugitives *shall flee* unto Zoar, an heifer of three years old: for by the mounting up of Luhith with weeping shall they go it up; for in the way of Horonaim they shall raise up a cry of destruction.","6":"For the waters of Nimrim shall be desolate: for the hay is withered away, the grass faileth, there is no green thing.","7":"Therefore the abundance they have gotten, and that which they have laid up, shall they carry away to the brook of the willows.","8":"For the cry is gone round about the borders of Moab; the howling thereof unto Eglaim, and the howling thereof unto Beerelim.","9":"For the waters of Dimon shall be full of blood: for I will bring more upon Dimon, lions upon him that escapeth of Moab, and upon the remnant of the land."}},"tsk":{"1":[{"kopje":"last","refs":["Jes 14:28-32","Jes 13:1","Jes 14:28"]},{"kopje":"Moab","refs":["Jes 11:14","Jes 25:10","Jer 9:26","Jer 48:1-47","Ezech 25:8-11","Amos 2:1-3","Zef 2:8-11"]},{"kopje":"in de nacht","refs":["Ex 12:29","Ex 12:30","1 Tess 5:1-3"]},{"kopje":"Ar","refs":["Num 21:28","Deut 2:9","Deut 2:18"]},{"kopje":"Kir","refs":["Jes 16:7","Jes 16:11","2 Kon 3:25","Jer 48:31","Jer 48:36"]}],"2":[{"kopje":"trekt op","refs":["Jes 16:12","Joz 13:17","Jer 48:18","Jer 48:22","Jer 48:23"]},{"kopje":"Moab","refs":["Jes 15:3","Jes 14:31","Jes 16:7","Jer 48:31","Jer 48:39"]},{"kopje":"Nebo","refs":["Num 32:3","Num 32:38","Deut 34:1","Jer 48:1"]},{"kopje":"Medeba","refs":["Num 21:30","Joz 13:16"]},{"kopje":"al","refs":["Jes 3:24","Jes 22:12","Lev 19:27","Lev 19:28","Lev 21:5","Deut 14:1","Job 1:20","Jer 7:29","Jer 47:5","Jer 48:1","Jer 48:37","Jer 48:38","Ezech 7:18"]}],"3":[{"kopje":"hun pleinen","refs":["2 Sam 3:31","2 Kon 6:30","Jona 3:6-8","Matt 11:21"]},{"kopje":"op hun","refs":["Jes 15:2","Jes 22:1","Deut 22:8","Jer 19:13","Jer 48:38","Jer 48:39"]},{"kopje":"geween","refs":["Jes 15:5"]}],"4":[{"kopje":"Hesbon","refs":["Jes 16:8","Jes 16:9","Num 32:3","Num 32:4","Jer 48:34"]},{"kopje":"Jahaz jv\" data-code=\"H4124\">Moab</span> is laid <span class=\"wl wl-kjv\" data-code=\"H7703\">waste,</span> and brought to silence;","2":"He is gone <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H1006\">Bajith,</span> and to <span class=\"wl wl-kjv\" data-code=\"H1769\">Dibon,</span> the high <span class=\"wl wl-kjv\" data-code=\"H1116\">places,</span> to <span class=\"wl wl-kjv\" data-code=\"H1065\">weep:</span> <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> shall <span class=\"wl wl-kjv\" data-code=\"H3213\">howl</span> over <span class=\"wl wl-kjv\" data-code=\"H5015\">Nebo,</span> and over <span class=\"wl wl-kjv\" data-code=\"H4311\">Medeba:</span> on all their <span class=\"wl wl-kjv\" data-code=\"H7218\">heads</span> shall be <span class=\"wl wl-kjv\" data-code=\"H7144\">baldness,</span> and every <span class=\"wl wl-kjv\" data-code=\"H2206\">beard</span> cut off.","3":"In their <span class=\"wl wl-kjv\" data-code=\"H2351\">streets</span> they shall <span class=\"wl wl-kjv\" data-code=\"H2296\">gird</span> themselves with <span class=\"wl wl-kjv\" data-code=\"H8242\">sackcloth:</span> on the <span class=\"wl wl-kjv\" data-code=\"H1406\">tops</span> of their houses, and in their <span class=\"wl wl-kjv\" data-code=\"H7339\">streets,</span> every one shall <span class=\"wl wl-kjv\" data-code=\"H3213\">howl,</span> <span class=\"wl wl-kjv\" data-code=\"H1065\">weeping</span> abundantly.","4":"And <span class=\"wl wl-kjv\" data-code=\"H2809\">Heshbon</span> shall <span class=\"wl wl-kjv\" data-code=\"H2199\">cry,</span> and <span class=\"wl wl-kjv\" data-code=\"H500\">Elealeh:</span> their <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> shall be <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> even unto <span class=\"wl wl-kjv\" data-code=\"H3096\">Jahaz:</span> therefore the armed <span class=\"wl wl-kjv\" data-code=\"H2502\">soldiers</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> shall cry <span class=\"wl wl-kjv\" data-code=\"H7321\">out;</span> his <span class=\"wl wl-kjv\" data-code=\"H5315\">life</span> shall be grievous","5":"My <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> shall cry <span class=\"wl wl-kjv\" data-code=\"H2199\">out</span> for <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab;</span> his <span class=\"wl wl-kjv\" data-code=\"H1280\">fugitives</span> shall flee unto <span class=\"wl wl-kjv\" data-code=\"H6820\">Zoar,</span> an <span class=\"wl wl-kjv\" data-code=\"H5697\">heifer</span> of three years <span class=\"wl wl-kjv\" data-code=\"H7992\">old:</span> for by the mounting <span class=\"wl wl-kjv\" data-code=\"H4608\">up</span> of <span class=\"wl wl-kjv\" data-code=\"H3872\">Luhith</span> with <span class=\"wl wl-kjv\" data-code=\"H1065\">weeping</span> shall they go it <span class=\"wl wl-kjv\" data-code=\"H5927\">up;</span> for in the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of <span class=\"wl wl-kjv\" data-code=\"H2773\">Horonaim</span> they shall raise <span class=\"wl wl-kjv\" data-code=\"H5782\">up</span> a <span class=\"wl wl-kjv\" data-code=\"H2201\">cry</span> of destruction.","6":"For the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> of <span class=\"wl wl-kjv\" data-code=\"H5249\">Nimrim</span> shall be <span class=\"wl wl-kjv\" data-code=\"H4923\">desolate:</span> for the <span class=\"wl wl-kjv\" data-code=\"H2682\">hay</span> is withered <span class=\"wl wl-kjv\" data-code=\"H3001\">away,</span> the <span class=\"wl wl-kjv\" data-code=\"H1877\">grass</span> <span class=\"wl wl-kjv\" data-code=\"H3615\">faileth,</span> there is no green thing.","7":"Therefore the <span class=\"wl wl-kjv\" data-code=\"H3502\">abundance</span> they have <span class=\"wl wl-kjv\" data-code=\"H6213\">gotten,</span> and that which they have laid <span class=\"wl wl-kjv\" data-code=\"H6486\">up,</span> shall they carry <span class=\"wl wl-kjv\" data-code=\"H5375\">away</span> to the <span class=\"wl wl-kjv\" data-code=\"H5158\">brook</span> of the willows.","8":"For the <span class=\"wl wl-kjv\" data-code=\"H2201\">cry</span> is gone round <span class=\"wl wl-kjv\" data-code=\"H5362\">about</span> the <span class=\"wl wl-kjv\" data-code=\"H1366\">borders</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab;</span> the <span class=\"wl wl-kjv\" data-code=\"H3215\">howling</span> thereof unto <span class=\"wl wl-kjv\" data-code=\"H97\">Eglaim,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3215\">howling</span> thereof unto Beerelim.","9":"For the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> of <span class=\"wl wl-kjv\" data-code=\"H1775\">Dimon</span> shall be <span class=\"wl wl-kjv\" data-code=\"H4390\">full</span> of <span class=\"wl wl-kjv\" data-code=\"H1818\">blood:</span> for I will <span class=\"wl wl-kjv\" data-code=\"H7896\">bring</span> <span class=\"wl wl-kjv\" data-code=\"H3254\">more</span> upon <span class=\"wl wl-kjv\" data-code=\"H1775\">Dimon,</span> <span class=\"wl wl-kjv\" data-code=\"H738\">lions</span> upon him that <span class=\"wl wl-kjv\" data-code=\"H6413\">escapeth</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab,</span> and upon the <span class=\"wl wl-kjv\" data-code=\"H7611\">remnant</span> of the land."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"last van Moab","tekst":"Dat is, de zware straf, die over de Moabieten komen zal, namelijk door de Assyriërs, ten tijde van den koning Salmanasser. Zie Isa 16:14 ."},{"catchword":"is","tekst":"Anders: als Ar Moabs verwoest is, is [hij] te weten Moab, uitgeroeid, want in den nacht als Kir Moabs verwoest is, is [hij] uitgeroeid. De zin is: De Moabieten zijn ten enenmale vervallen in dien nacht als hun beide voornaamste steden, met andere sterkten huns lands, door hunne vijanden zijn ingenomen en verwoest."},{"catchword":"Ar-moabs","tekst":"Dat is, Ar in der Moabieten land gelegen. Dit was de hoofdstad der Moabieten; Num 21:28 ; Deu 2:18 , Deu 2:29 ."},{"catchword":"verwoest,","tekst":"Dat is, zij zal gewisselijk verwoest worden, te weten door den koning van Assyrië; zie Isa 16:14 . Van hetgeen geschieden zou, wordt gesproken alsof het alreeds geschied ware, zo hier als doorgaans bij de profeten, en dat vanwege de zekerheid der voorzeggingen."},{"catchword":"in den nacht","tekst":"Dat is, onvoorziens en onverhoeds. Anders gelijk vs.2 is aangetekend."},{"catchword":"Kir-moabs","tekst":"Anders genoemd Kirheres, onder Isa 16:11 ; Jer 48:31 , Jer 48:36 . Ook Kirhareseth, Isa 16:7 , een van de voornaamste steden der Moabieten. Daar was ook in Medië een stad of landschap Kir genoemd, gelijk te zien is 2Ki 16:9 ."}],"2":[{"catchword":"Hij","tekst":"Te weten Moab."},{"catchword":"gaat op","tekst":"Anders: Baïth en Dibon zijn opgegaan; te weten naar Bamoth, of naar de hoogten, om aldaar te wenen."},{"catchword":"Baïth","tekst":"Deze stad wordt anders genoemd Beon, Baäl-Meon en Beth-Baäl-Meon; Num 32:3 , Num 32:38 ; Jos 13:17 . Zij was vermaard vanwege de afgoderij, die daar bedreven werd. Tot een afgod aldaar en tot andere steden, waar afgoden waren, namen de beangstigde Moabieten hunne toevlucht, om hulp en raad te zoeken, klagende denzelven hunnen nood."},{"catchword":"Dibon,","tekst":"Een stad den Rubenieten toegelegd; zie Jos 13:17 . Onder vs.9 wordt zij, naar sommiger gevoelen, Dimon genoemd."},{"catchword":"Bamoth,","tekst":"Anders genaamd Bamoth-Baäl; Jos 13:17 . Anders: tot de hoogten, of op de hoogten, om aldaar voor de beelden hunner goden te wenen en die met tranen tot hunne hulp te bewegen."},{"catchword":"Nebo","tekst":"Deze stad was den Rubenieten toegedeeld; Num 32:38 ."},{"catchword":"Medeba","tekst":"Eene stad in der Moabieten land; Num 21:10 ; Jos 13:16 ."},{"catchword":"huilen;","tekst":"Te weten omdat die steden verstoord zijn, of haast zullen verstoord worden."},{"catchword":"op","tekst":"De zin is: Daar zal droefenis zijn door het ganse land der Moabieten. Dit, en wat er volgt, moet men verstaan naar de manier van doen der Moabieten en van enige andere natiën, die, tot een teken van droefenis, hun vlees doorsneden en doorkerfden; zij trokken het haar uit het hoofd en zij sneden den baard kaal af. Maar Lev 19:27 , en Deu 14:1 , heeft God zijn volk verboden zulks te doen."}],"3":[{"catchword":"zakken","tekst":"Dat is, treurklederen."},{"catchword":"op hun daken","tekst":"Hij wil zeggen dat, als zij baden, dat deden zij op de daken; Zep 1:5 ."},{"catchword":"afgaande","tekst":"Gelijk zij al wenende waren op de daken geklommen, alzo komen zij er ook al wenende wederom af, geen troost ontvangen hebbende."}],"4":[{"catchword":"Zo","tekst":"Hebreeuws, en Chesbon en Eleale."},{"catchword":"Hesbon","tekst":"Van Hesbon en Eleale zie Jos 13:17 ; Num 32:37 ."},{"catchword":"schreeuwt,","tekst":"Te weten van angst en vrees."},{"catchword":"Jahaz toe;","tekst":"Zie Num 21:23 ."},{"catchword":"maken","tekst":"Of, zullen geschrei maken."},{"catchword":"de toegerusten","tekst":"Of, de gewapende. De zin is: Het geschreeuw der burgers zal de gewapende soldaten verschrikken en vervaard maken."},{"catchword":"eens iegelijks ziel","tekst":"Dat is, zij zijn altemaal kwalijk tevreden. Anders: hun leven is kwalijk gesteld, of is hun verdrietig."},{"catchword":"in hem","tekst":"Dat is in zichzelven, en versta hier Moab mitsgaders allen, die het met hem houden."}],"5":[{"catchword":"Mijn hart","tekst":"Alsof de profeet zeide: De jammer, die den Moabieten zal overkomen, zal zo groot zijn dat ik mij niet kan onthouden hartelijk te schreien als ik er aan gedenk. Zie Isa 16:9 , en Isa 21:3 ; Jer 48:5 , Jer 48:31 , Jer 48:34 , Jer 48:38 . Sommigen nemen het alzo, dat de profeet hier afbeeldt in zijn persoon hetgeen Moabi in zijn lijden doen zou."},{"catchword":"grendelen","tekst":"Dat is, de oversten en machtigen van Moab, die bij grendelen worden vergeleken, omdat zij de vastigheid des lands zijn. Anders, hunne vluchtenden [vlieden] enz. Anders: mijn hart schreeuwt over Moab en [over] zijne grendelen tot Zoar toe, [als] een driejarige koe. Tot Zoar toe; dat is, dat men het tot Zoar toe horen kan, ofschoon het aan de uiterste grenzen van het Moabietische land, naar Judea aan, gelegen is."},{"catchword":"Zoar toe,","tekst":"Zie Gen 19:22 ."},{"catchword":"driejarige vaars;","tekst":"Dat is, sterk, wulps en dartel. Dit kan men verstaan van Zoar of van Moab. In Jeremia wordt het gezegd van Horonaïm. Zie Jer 48:34 , met de aantekening."},{"catchword":"met geween","tekst":"Of, al wenende."},{"catchword":"een jammergeschrei","tekst":"Of, verheffen zij een gebroken geschrei. Anders: een verderfelijk geschrei. Hebreeuws, een geroep der breking, of der verbreking; dat is, [gelijk het sommigen nemen] zodanig een geroep als die van zich geven, die van hunne vijanden wredelijk worden verbroken en vernield."}],"6":[{"catchword":"de wateren","tekst":"Dat is, de lage en waterige landen te Nimrim, of omtrent Nimrim, zullen dor, woest en onvruchtbaar liggen. De zin is: Het gehele land van Moab zal tot de uiterste verwoesting gebracht worden, alzo dat zelfs in die plaatsen, waar overvloed van wateren placht te zijn, grote droogte wezen zal."},{"catchword":"Nimrim","tekst":"Nimra en Bethnimra genoemd, Num 32:3 , Num 32:36 . Deze plaats is den zonen van Gad gegeven; Jos 13:27-28 ."}],"7":[{"catchword":"zij den overvloed,","tekst":"Te weten de Moabieten. Hebreeuws, hij; te weten Moab."},{"catchword":"vergaderd","tekst":"Hebreeuws, gemaakt hebben."},{"catchword":"en hetgeen zij","tekst":"Het Hebreeuwse woord komt van bezoeken of wegleggen."},{"catchword":"de beek","tekst":"Of, naar de beek der wilgen; te weten om het aldaar te verbergen. Anders: in het dal der Arabieren. en dan is dit de zin: De Arabieren, die zich bij de Assyriërs zullen voegen, zullen de schatten der Moabieten helpen roven en zullen het wegvoeren."}],"8":[{"catchword":"dat geschreeuw","tekst":"Dat is, dat geschreeuw en gehuil der vluchtende Moabieten van hetwelk gesproken is vs.1-4, zal door al de landpalen der Moabieten gaan, van het ene einde tot aan het andere."},{"catchword":"zal omgaan","tekst":"Of, gaat om, of is omgegaan, en alzo in het volgende."},{"catchword":"tot Eglaïm","tekst":"Of, tot aan de twee samenvlietende beken; te weten tot de beek of bornput Arnon [waarvan Num 21:14 gesproken wordt] en tot Beër-Elim."},{"catchword":"tot Beër-Elim","tekst":"Anders: tot den bornput Elim toe, of tot den bornput der machtigen; aldus genoemd omdat de vorsten der Israëlieten denzelven hebben gegraven of laten graven; Num 21 ."}],"9":[{"catchword":"Want de wateren","tekst":"Of, zelfs zijn de wateren, enz."},{"catchword":"zijn vol bloeds,","tekst":"Te weten, van de verslagen en verwonde Moabieten, die de Assyriërs zouden verslaan."},{"catchword":"Ik zal Dimon","tekst":"Hebreeuws, Ik zal over Dimon toevoegselen voegen, of zetten; dat is, Ik zal hen nog meer straffen."},{"catchword":"leeuwen","tekst":"Versta hierbij, en andere wrede verscheurende dieren, om hen te verscheuren. Hebreeuws, een leeuw, waardoor de koning Nebukadnezar [die ook elders bij een leeuw wordt vergeleken] kan verstaan worden. Van verscheurende leeuwen onder het ongehoorzame volk, van God gezonden, zie ook 2Ki 17:25 ."},{"catchword":"over de ontkomenen","tekst":"De zin is: De Moabieten, die hunnen vijanden ontlopen zullen, zullen van de leeuwen verscheurd worden, en alles wat er overig zal gebleven zijn uit het ganse land, dat zal te schande gemaakt worden. In een woord, God de Heere dreigt hier dat de vijanden zijner kerk geenszins ongestraft zullen blijven."},{"catchword":"des lands","tekst":"Te weten, de Moabieten."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"The burden of Moab. [That is, the sore judgement that should come upon the Moabites, namely, by the Assyrians, in the time of King Salmanasser. See below, chap.16.on vers.14. Compare Jer 48:1. Ezech.25.8. Amos 2.1.] Surely in night Ar of Moab [that is, Ar lying in the land of the Moabites. This was the chief City of the Moabites, Num 21:28. Deutrom.2.18,29.] is laid waste, [that is, it shall surely be laid waste; to wit, by the King of Assyria. See below, ch.16.14. Both here and elsewhere by the prophets often, mention is made of a thing that is to be done, as if it were already done: And that by reason of the certainty of the predictions or prophecies] it is cut off surely in the night. [that is, suddenly , unexpectedly, unawares] Kir of Moab [otherwise called, Kirheres, below, chap.16.11. and 48.31. and 36. Also, Kirhareseth, Jer 16:7. One of the chiefest Cities of the Moabites. There was also in Media a City or Country, called Kir, as appeareth, 2 Kings 16.9.] is laid waste, it is cut off. [Oth. When Ar of Moab was laid waste, (he) was cut off. The meaning is, The Moabites were utterly undone the same night, when both their chiefest Cities, with other strong holds of their land, was taken and laid waste by their enemies.]"}],"2":[{"catchword":null,"tekst":"He [To wit, Moab] goeth up to Baith, [This City is other-ways called Been, Baal-Meon, and, Beth-Baal-Meon, Num 32:3. and 38. Jos.13.17. It was famous for the Idolatry that was there committed. The Moabites, when they were in distress, used to address themselves to an Idol that was there, and to other Cities where there were Idols, to seek aid and counsel of them, and to lay their wants and grievances open before them] and (to) Dibon, [A City allotted to the Reubenites. See Jos.13.17. Below, verse 9. It is (according to the opinion of some) called Dimon] (and to) Bamoth, [otherwise called, Bamoth Baal, Jos.13.17. Oth. To the high places, or upon the high places] to weep: [to wit, to weep there before the images of their gods or idols, and to move them with tears to help and succour them. Oth. Baith and Dimon are gone up; to wit, to Bamoth, or to the high places, to weep there] Moab shall howl over Shebo, and over Moleha; [to wit, because those Cities were destroyed, or should be suddenly destroyed. Nebo was a City allotted to the Reubenites, Num 32:38. Medeba was a City in the land of the Moabites, Num 21:30. Jos.13.17.] on all their heads is baldness, every (ones) heard is cut off. [The meaning is, there shall be grief and sorrow throughout the whole land of the Moabites. This and that which followeth, must be understood of the custom and practice of the Moabites, and some other Nations, who, in token of grief or sorrow, made cuttings and lancings in their flesh. They plucked the hair out of their head, and cut their beard clean off. But Levit.19.27. and Deut.14.1. God forbad his people to do this. Compare Jer 48:37. Ezech.7.18.]"}],"3":[{"catchword":null,"tekst":"In their lanes they girded themselves with sacks; [That is, with mourning garments] on the tops their houses, and in their streets they howl altogether, [Intimating that when they prayed, they did it on the house-steps, Zephan.1.5.] going down with weeping. [As they went up to the tops of their houses weeping, so do they likewise come down again weeping, having received no comfort at all.]"}],"4":[{"catchword":null,"tekst":"Both Hesbon shall cry, and Eleale, [To wit, for anguish and fear. Heb. And Hesbon and Eleale, &c. Of Hesbon and Eleale, see Jos.13.17. Num 32:37.] their voice shall be heard unto Jahaz, [of Jahaz see Num 21:23.] therefore the prepared ones, [or the armed souldiers] of Moab make a cry, [or, shall make a cry. The meaning is, the cry of the citizens shall terrify and affrighten the armed souldiers] everyone soul it ill disposed in him. [that is, they are all discotented. Oth. Their life is ill-disposed, or, is grievous unto them. (in him) That is, in himself, and understand here Moab, together with all those that side with him.]"}],"5":[{"catchword":null,"tekst":"Mine heart cryeth for Moab, [As if the Prophet had said, the misery that shall befall the Moabites shall be so great, that I cannot forbear crying, when I think upon it. See below, chap.16.18. and 21.3. Jer 48:5,31,34,38. Some take it thus, that the Prophet here representeth in his own person, that which Moab should do in his own misery and suffering] her bars are unto Zoar the heifer of three years old: [Her bars, etc. That is, the chief and mighty men of Moab, who are compared unto bars, because they are the strength of the land. Oth. Her fugitives (flee) etc. Oth. Mine heart crieth for Moab, and (for) his bars, unto Zoar, (as) a cow of three years old. Unto Zoar; That is, so that it may be heard even unto Zoar, although it lie in the outermost borders of the land of the Moabites toward Judea. Of Zoar, see Genes.19 22. (the heifer of three years old) That is, strong, wild, and wanton. This may be understood of Zoar, or Moab. In Jeremy it is spoken of Horonaim. See Jer 28:34. with the annotations] for be goeth up with weeping, [or, he goeth up weeping] to the ascent of Luhith, for in the way to Horonaim they raise up a pitifull cry. [or, they lift up a broken cry. Oth. A destruction cry, or, a cry of destruction. Hebr. A cry of breaking, or, of breaking to pieces; that is, as some take it, such a cry as those make, that are cruelly broken to pieces, and destroyed by their enemies.]"}],"6":[{"catchword":null,"tekst":"For the waters of Nimrim shall be a meer desolation: [That is, the low and watery grounds at Nimrim, or about Nimrim, shall lie dry, waste, and desolate. The meaning is, the whole land of Moab shall be brought to extreme ruine, so that even in those places where abundance of water was wont to be, there shall be great drought. (of Nimrim) called Nimra, and Beth-Nimrah, Num 32:31,36. This place was given to the sons of Gad, Jos 13:27, 28.] for the grass is withered, the tender grass is perished, there is no greenness."}],"7":[{"catchword":null,"tekst":"Therefore the abundance (which) they have gathered, [Hebr. Have made] and that which they have laid up, shall they [to wit, the Moabites. Hebr. he laid up, shall they [to wit, the Moabites. Hebr. He; to wit, Moab] carry to the brook of the willows. [or, toward the brook of the Willows; to wit, to hide it there. Oth. Into the valley of the Arabians. And then the sense is this, the Arabians that shall join themselves to the Assyrians, shall help to pillage the treasures of the Moabites, and shall carry them away."}],"8":[{"catchword":null,"tekst":"For that shall go round about [Or, goeth round about, or, is gone round about: and so in the sequel] through the borders of Moab, the howling thereof unto Eglam, [that is, that cry an howling of the fugitive Moabites, of whom mention is made, vers.1,2,3,4. Shall go through all the border of the Moabites, from one end to other. (unto Eglaim) or, unto the two brooks running together; to wit, unto the brook or well of Arnon (of which mention is made, Num 21:14.) and unto Beer-Elim] yea, unto Beer-Elim [Oth. Unto the well of Elam; or, unto the well of the mighty; so called, because the Princes of the Israelites had digged it, or had caused it to be digged, Numbers 21.] shall the howling thereof be."}],"9":[{"catchword":null,"tekst":"For the waters of Dimon are full of blood [To wit, of the slain and wounded Moabites, whom the Assyrians should slay. Or, even the waters of Dimor, etc.] for I will send yet more unto Dimon: [Heb. I will add, or set additions upon Dimon, that is, I will punish it yet more] (to wit) Lions, [Understand withal, and other cruel renting beasts, to tear and rent them in pieces. Hebr. A lion, whereby King Nebuchadnezar may be understood, who is likewise elsewhere compared to a lion Of renting lions sent by God among people that were disobedient, see likewise, 2 Kings 17,25.] upon the escaped ones of Moab, as also upon the remnant of the Land, the same shall be conformed and destroyed. In brief, the Lord threateneth here, that the enemies of his Church shall by no means go unpunished. (upon the remnant of the land) To wit, of the Moabites.]"}]}}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers) => {
    const afk = REFBOEK2AFK[boek];
    return afk ? `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${heel}</a>` : heel;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
