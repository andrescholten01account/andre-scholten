:"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"De last[1] van Egypte. Zie, de HEERE rijdt op een snelle wolk, en Hij zal in Egypte komen; en de afgoden van Egypte zullen bewogen worden vanwege Zijn aangezicht, en het hart van de Egyptenaren zal smelten in hun binnenste.","2":"Want Ik zal de Egyptenaren tegen de Egyptenaren verwarren, zodat zij zullen strijden, ieder tegen zijn broeder, en ieder tegen zijn naaste, stad tegen stad, koninkrijk tegen koninkrijk.","3":"En de geest van de Egyptenaren zal uitgeledigd worden in hun binnenste, en hun raad zal Ik verslinden; dan zullen zij hun afgoden vragen, en de bezweerders, en de waarzeggers, en de duivelskunstenaars.","4":"En Ik zal de Egyptenaars overleveren in de hand van harde heren, en een strenge koning zal over hen heersen, spreekt de Heere HEERE van de heerscharen[2].","5":"En zij zullen het water uit de zee doen vergaan, en de rivier zal verzijpen en verdrogen.","6":"Zij zullen ook de rivieren ver terugdrijven, zij zullen ze uithozen, en de opgedamde stromen opdrogen; het riet en het schilf zullen verwelken.","7":"Het papiergewas bij de stromen, aan de oevers van de stromen, en al het gezaaide bij de stromen, zal verdrogen; het zal weggestoten worden, en niet *meer* zijn.","8":"En de vissers zullen treuren, en allen die de angel in de stromen werpen, zullen rouw bedrijven; en zij die het werpnet uitspreiden op het water, zullen kwijnen.","9":"En de werkers in het fijne vlas zullen beschaamd worden, ook de wevers van de witte stof.","10":"En zij zullen *met* hun fundamenten verbrijzeld worden, allen die *voor* loon lustige staande wateren maken.","11":"Zeker, de vorsten van Zoan zijn dwazen, de raad van de wijzen, van de raadgevers van Farao, is redeloos geworden; hoe kunt u dan tegen Farao zeggen: Ik ben een zoon van de wijzen, een zoon van de oude koningen?","12":"Waar zijn nu uw wijzen? Laat zij u nu te kennen geven of vernemen, wat de HEERE van de heerscharen beraadslaagd heeft tegen Egypte.","13":"De vorsten van Zoan zijn zot geworden, de vorsten van Nof zijn bedrogen; zij hebben ook Egypte doen dwalen, *tot* de uiterste hoek van zijn stammen.","14":"De HEERE heeft een zeer verkeerde geest ingeschonken in hun midden, en zij hebben Egypte doen dwalen in al zijn doen, zoals een dronkaard zich om en om wentelt in zijn uitspuwsel.","15":"En er zal geen werk zijn voor de Egyptenaren, dat het hoofd of de staart, de tak of de bieze doen kan.","16":"Op die dag zullen de Egyptenaars zijn als de vrouwen; en zij zullen beven en vrezen vanwege de beweging van de hand van de HEERE van de heerscharen, die Hij tegen hen bewegen zal.","17":"En het land Juda zal voor de Egyptenaren tot een schrik zijn; zo wie het vermelden zal, die zal in zichzelf bevreesd zijn vanwege de raad van de HEERE van de heerscharen, die Hij tegen hen beraadslaagd heeft.","18":"Op die dag zullen er vijf steden in Egypteland zijn, die de taal van Kanaän spreken, en zweren bij de HEERE van de heerscharen; een zal genoemd worden een stad der verstoring[3].","19":"Op die dag zal de HEERE een altaar hebben in het midden van Egypteland, en een opgericht teken bij zijn landgrenzen voor de HEERE.","20":"En het zal zijn tot een teken, en tot een getuigenis voor de HEERE van de heerscharen in Egypteland, want zij zullen tot de HEERE roepen vanwege de verdrukkers, en Hij zal hun een Heiland en Meester zenden, Die hen zal verlossen.","21":"En de HEERE zal aan de Egyptenaren bekend worden, en de Egyptenaars zullen de HEERE kennen op die dag; en zij zullen *Hem* dienen *met* slachtoffer en spijsoffer, en zij zullen de HEERE een gelofte beloven en betalen.","22":"En de HEERE zal de Egyptenaars krachtig slaan, en genezen; en zij zullen zich tot de HEERE bekeren, en Hij zal Zich door hen laten verbidden, en Hij zal hen genezen.","23":"Op die dag zal er een gebaande weg zijn van Egypte naar Assyrië, zodat de Assyriërs in Egypte, en de Egyptenaars in Assyrië zullen komen; en de Egyptenaars zullen met de Assyriërs *de* *Heere* dienen.","24":"Op die dag zal Israël de derde zijn met de Egyptenaren en met de Assyriërs, een zegen in het midden van het land.","25":"Want de HEERE van de heerscharen zal hen zegenen en zeggen: Gezegend zij Mijn volk, de Egyptenaars, en de Assyriërs, het werk van Mijn handen, en Israël, Mijn erfdeel!"},"SV":{"1":"De last van Egypte. Ziet, de HEERE rijdt op een snelle wolk, en Hij zal in Egypte komen; en de afgoden van Egypte zullen bewogen worden van Zijn aangezicht, en het hart der Egyptenaren zal smelten in het binnenste van hen.","2":"Want Ik zal de Egyptenaren tegen de Egyptenaren verwarren, dat zij zullen strijden een iegelijk tegen zijn broeder, en een iegelijk tegen zijn naaste, stad tegen stad, koninkrijk tegen koninkrijk.","3":"En de geest der Egyptenaren zal uitgeledigd worden in het binnenste van hen, en hun raad zal Ik verslinden; dan zullen zij hun afgoden vragen, en den bezweerders, en den waarzeggers, en den duivelskunstenaars.","4":"En Ik zal de Egyptenaars besluiten in de hand van harde heren, en een strenge koning zal over hen heersen, spreekt de Heere HEERE der heirscharen.","5":"En zij zullen de wateren uit de zee doen vergaan, en de rivier zal verzijpen en verdrogen.","6":"Zij zullen ook de rivieren verre terugdrijven, zij zullen ze uithozen, en de gedamde stromen opdrogen; het riet en het schilf zullen verwelken.","7":"Het papiergewas bij de stromen, aan de oevers der stromen, en al het gezaaide aan de stromen, zal verdrogen; het zal weggestoten worden, en niet *meer* zijn.","8":"En de vissers zullen treuren, en allen, die den angel in de stromen werpen, zullen rouw maken; en die het werpnet uitbreiden op de wateren, zullen kwijnen.","9":"En de werkers in het fijne vlas zullen beschaamd worden, ook de wevers van de witte stof.","10":"En zij zullen *met* hun fondamenten verbrijzeld worden, allen, die *voor* loon lustige staande wateren maken.","11":"Gewisselijk, de vorsten van Zoan zijn dwazen, de raad der wijzen, der raadgevers van Farao, is onvernuftig geworden; hoe kunt gijlieden *dan* zeggen tot Farao; Ik ben een zoon der wijzen, een zoon der oude koningen?","12":"Waar zijn nu uw wijzen? Dat zij u nu te kennen geven of vernemen, wat de HEERE der heirscharen beraadslaagd heeft tegen Egypte.","13":"De vorsten van Zoan zijn zot geworden, de vorsten van Nof zijn bedrogen; zij zullen ook Egypte doen dwalen, *tot* den uitersten hoek zijner stammen.","14":"De HEERE heeft een zeer verkeerden geest ingeschonken in het midden van hen, en zij hebben Egypte doen dwalen in al zijn doen, gelijk een dronkaard zich om en om wentelt in zijn uitspuwsel.","15":"En er zal geen werk wezen voor de Egyptenaren, hetwelk het hoofd of de staart, de tak of de bieze doen mag.","16":"Te dien dage zullen de Egyptenaars zijn als de vrouwen; en zij zullen beven en vrezen vanwege de beweging van de hand des HEEREN der heirscharen, welke Hij tegen hen bewegen zal.","17":"En het land van Juda zal den Egyptenaren tot een schrik zijn; zo wie het vermelden zal, die zal in zichzelven bevreesd wezen vanwege den raad des HEEREN der heirscharen, dien Hij tegen hen beraadslaagd heeft.","18":"Te dien dage zullen er vijf steden in Egypteland zijn, sprekende de spraak van Kanaän, en zwerende den HEERE der heirscharen; een zal genoemd zijn een stad der verstoring.","19":"Te dien dage zal de HEERE een altaar hebben in het midden van Egypteland, en een opgericht teken aan haar landpalen voor den HEERE.","20":"En het zal zijn tot een teken, en tot een getuigenis den HEERE der heirscharen in Egypteland, want zij zullen tot den HEERE roepen vanwege de verdrukkers, en Hij zal hun een Heiland en Meester zenden, Die zal hen verlossen.","21":"En de HEERE zal den Egyptenaren bekend worden, en de Egyptenaars zullen den HEERE kennen te dien dage; en zij zullen *Hem* dienen *met* slachtoffer, en spijsoffer, en zij zullen den HEERE een gelofte beloven en betalen.","22":"En de HEERE zal de Egyptenaars dapper slaan, en genezen; en zij zullen zich tot den HEERE bekeren, en Hij zal Zich van hen verbidden laten, en Hij zal hen genezen.","23":"Te dien dage zal er een gebaande weg wezen van Egypte in Assyrië, dat de Assyriërs in Egypte, en de Egyptenaars in Assyrië komen zullen; en de Egyptenaars zullen met de Assyriërs *den* *Heere* dienen.","24":"Te dien dage zal Israël de derde wezen met de Egyptenaren en met de Assyriërs, een zegen in het midden van het land.","25":"Want de HEERE der heirscharen zal hen zegenen, zeggende: Gezegend zij Mijn volk, de Egyptenaars, en de Assyriërs, het werk Mijner handen, en Israël, Mijn erfdeel!"},"KJV":{"1":"The burden of Egypt. Behold, the LORD rideth upon a swift cloud, and shall come into Egypt: and the idols of Egypt shall be moved at his presence, and the heart of Egypt shall melt in the midst","2":"And I will set the Egyptians against the Egyptians: and they shall fight every one against his brother, and every one against his neighbour; city against city, *and* kingdom against kingdom.","3":"And the spirit of Egypt shall fail in the midst thereof; and I will destroy the counsel thereof: and they shall seek to the idols, and to the charmers, and to them that have familiar spirits, and to the wizards.","4":"And the Egyptians will I give over into the hand of a cruel lord; and a fierce king shall rule over them, saith the Lord, the LORD of hosts.","5":"And the waters shall fail from the sea, and the river shall be wasted and dried up.","6":"And they shall turn the rivers far away; *and* the brooks of defence shall be emptied and dried up: the reeds and flags shall wither.","7":"The paper reeds by the brooks, by the mouth of the brooks, and every thing sown by the brooks, shall wither, be driven away,","8":"The fishers also shall mourn, and all they that cast angle into the brooks shall lament, and they that spread nets upon the waters shall languish.","9":"Moreover they that work in fine flax, and they that weave networks, shall be confounded.","10":"And they shall be broken in the purposes thereof, all that make sluices *and* ponds for fish.","11":"Surely the princes of Zoan *are* fools, the counsel of the wise counsellors of Pharaoh is become brutish: how say ye unto Pharaoh, I *am* the son of the wise, the son of ancient kings?","12":"Where *are* they? where *are* thy wise *men*? and let them tell thee now, and let them know what the LORD of hosts hath purposed upon Egypt.","13":"The princes of Zoan are become fools, the princes of Noph are deceived; they have also seduced Egypt, *even they that are* the stay of the tribes","14":"The LORD hath mingled a perverse spirit in the midst thereof: and they have caused Egypt to err in every work thereof, as a drunken *man* staggereth in his vomit.","15":"Neither shall there be *any* work for Egypt, which the head or tail, branch or rush, may do.","16":"In that day shall Egypt be like unto women: and it shall be afraid and fear because of the shaking of the hand of the LORD of hosts, which he shaketh","17":"And the land of Judah shall be a terror unto Egypt, every one that maketh mention thereof shall be afraid in himself, because of the counsel of the LORD of hosts, which he hath determined","18":"In that day shall five cities in the land of Egypt speak the language of Canaan, and swear to the LORD of hosts; one shall be called, The city of destruction.","19":"In that day shall there be an altar to the LORD in the midst of the land of Egypt, and a pillar at the border thereof to the LORD.","20":"And it shall be for a sign and for a witness unto the LORD of hosts in the land of Egypt: for they shall cry unto the LORD because of the oppressors, and he shall send them a saviour, and a great one, and he shall deliver","21":"And the LORD shall be known to Egypt, and the Egyptians shall know the LORD in that day, and shall do sacrifice and oblation; yea, they shall vow a vow unto the LORD, and perform","22":"And the LORD shall smite Egypt: he shall smite and heal *it*: and they shall return *even* to the LORD, and he shall be intreated of them, and shall heal","23":"In that day shall there be a highway out of Egypt to Assyria, and the Assyrian shall come into Egypt, and the Egyptian into Assyria, and the Egyptians shall serve with the Assyrians.","24":"In that day shall Israel be the third with Egypt and with Assyria, *even* a blessing in the midst of the land:","25":"Whom the LORD of hosts shall bless, saying, Blessed *be* Egypt my people, and Assyria the work of my hands, and Israel mine inheritance."}},"tsk":{"1":[{"kopje":"Egypte","refs":["Jer 25:19","Jer 43:8-13","Jer 44:29","Jer 44:30","Jer 46:1-28","Ezech 29:1","Ezech 32:32","Joël 3:19","Zach 10:11","Zach 14:18"]},{"kopje":"rijdt","refs":["Deut 33:26","Ps 18:11-13","Ps 68:5","Ps 68:34","Ps 68:35","Ps 104:34","Matt 26:64","Matt 26:65","Openb 1:7"]},{"kopje":"de afgoden","refs":["Jes 21:9","Jes 46:1","Jes 46:2","Ex 12:12","1 Sam 5:2-4","Jer 43:12","Jer 46:25","Jer 50:2","Jer 51:44","Ezech 30:13"]},{"kopje":"het hart","refs":["Jes 19:16","Ex 15:14-16","Joz 2:9","Joz 2:11","Joz 2:24","Jer 46:5","Jer 46:15","Jer 46:16"]}],"2":[{"kopje":"Ik zal","refs":["Jes 19:13","Jes 19:14","Jes 9:20","Richt 7:22","Richt 9:23","1 Sam 14:16","1 Sam 14:20","2 Kron 20:22","2 Kron 20:23","Ezech 38:21","Matt 12:25","Openb 17:12-17"]}],"3":[{"kopje":"de geest","refs":["Jes 19:1","Jes 19:11-13","Jes 57:16","1 Sam 25:37","Ps 76:13","Jer 46:15","Ezech 21:7","Ezech 22:14"]},{"kopje":"en zal Ik","refs":["Jes 14:27","2 Sam 15:31","2 Sam 17:14","2 Sam 17:23","2 Kron 25:16-20","Job 5:12","Job 5:13","Spr 21:30","1 Kor 3:19","1 Kor 3:20"]},{"kopje":"verslinden","refs":["Ps 107:27"]},{"kopje":"dan zullen wl\" data-l=\"L8\" data-code=\"H3027\">handen</span>, <span class=\"wl\" data-l=\"L9\" data-code=\"H3478\">en</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H3478\">Israël</span>, <span class=\"wl\" data-l=\"L9\" data-code=\"H3478\">Mijn</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H5159\">erfdeel</span>!"},"koppeling_kjv":{"1":"The <span class=\"wl wl-kjv\" data-code=\"H4853\">burden</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt.</span> Behold, the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7392\">rideth</span> upon a <span class=\"wl wl-kjv\" data-code=\"H7031\">swift</span> <span class=\"wl wl-kjv\" data-code=\"H5645\">cloud,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> into <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt:</span> and the <span class=\"wl wl-kjv\" data-code=\"H457\">idols</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> shall be <span class=\"wl wl-kjv\" data-code=\"H5128\">moved</span> at his <span class=\"wl wl-kjv\" data-code=\"H6440\">presence,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> shall <span class=\"wl wl-kjv\" data-code=\"H4549\">melt</span> in the midst","2":"And I will <span class=\"wl wl-kjv\" data-code=\"H5526\">set</span> the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians</span> against the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians:</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H3898\">fight</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> against his <span class=\"wl wl-kjv\" data-code=\"H251\">brother,</span> and every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> against his <span class=\"wl wl-kjv\" data-code=\"H7453\">neighbour;</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> against <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdom</span> against kingdom.","3":"And the <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> shall <span class=\"wl wl-kjv\" data-code=\"H1238\">fail</span> in the <span class=\"wl wl-kjv\" data-code=\"H7130\">midst</span> thereof; and I will <span class=\"wl wl-kjv\" data-code=\"H1104\">destroy</span> the <span class=\"wl wl-kjv\" data-code=\"H6098\">counsel</span> thereof: and they shall <span class=\"wl wl-kjv\" data-code=\"H1875\">seek</span> to the <span class=\"wl wl-kjv\" data-code=\"H457\">idols,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H328\">charmers,</span> and to them that have familiar <span class=\"wl wl-kjv\" data-code=\"H178\">spirits,</span> and to the wizards.","4":"<span class=\"wl wl-kjv\" data-code=\"H853\">And</span> the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians</span> will I give <span class=\"wl wl-kjv\" data-code=\"H5534\">over</span> into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of a <span class=\"wl wl-kjv\" data-code=\"H7186\">cruel</span> <span class=\"wl wl-kjv\" data-code=\"H113\">lord;</span> and a <span class=\"wl wl-kjv\" data-code=\"H5794\">fierce</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> shall <span class=\"wl wl-kjv\" data-code=\"H4910\">rule</span> over them, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H113\">Lord,</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of hosts.","5":"And the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> shall <span class=\"wl wl-kjv\" data-code=\"H5405\">fail</span> from the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5104\">river</span> shall be <span class=\"wl wl-kjv\" data-code=\"H2717\">wasted</span> and dried up.","6":"And they shall <span class=\"wl wl-kjv\" data-code=\"H2186\">turn</span> the <span class=\"wl wl-kjv\" data-code=\"H5104\">rivers</span> far <span class=\"wl wl-kjv\" data-code=\"H2186\">away;</span> and the <span class=\"wl wl-kjv\" data-code=\"H2975\">brooks</span> of <span class=\"wl wl-kjv\" data-code=\"H4693\">defence</span> shall be <span class=\"wl wl-kjv\" data-code=\"H1809\">emptied</span> and dried <span class=\"wl wl-kjv\" data-code=\"H2717\">up:</span> the <span class=\"wl wl-kjv\" data-code=\"H7070\">reeds</span> and <span class=\"wl wl-kjv\" data-code=\"H5488\">flags</span> shall wither.","7":"The paper <span class=\"wl wl-kjv\" data-code=\"H6169\">reeds</span> by the <span class=\"wl wl-kjv\" data-code=\"H2975\">brooks,</span> by the <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> of the <span class=\"wl wl-kjv\" data-code=\"H2975\">brooks,</span> and every thing <span class=\"wl wl-kjv\" data-code=\"H4218\">sown</span> by the <span class=\"wl wl-kjv\" data-code=\"H2975\">brooks,</span> shall <span class=\"wl wl-kjv\" data-code=\"H3001\">wither,</span> be driven away,","8":"The <span class=\"wl wl-kjv\" data-code=\"H1771\">fishers</span> also shall <span class=\"wl wl-kjv\" data-code=\"H578\">mourn,</span> and all they that <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> <span class=\"wl wl-kjv\" data-code=\"H2443\">angle</span> into the <span class=\"wl wl-kjv\" data-code=\"H2975\">brooks</span> shall <span class=\"wl wl-kjv\" data-code=\"H56\">lament,</span> and they that <span class=\"wl wl-kjv\" data-code=\"H6566\">spread</span> <span class=\"wl wl-kjv\" data-code=\"H4365\">nets</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">upon</span> the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> shall languish.","9":"Moreover they that <span class=\"wl wl-kjv\" data-code=\"H5647\">work</span> in <span class=\"wl wl-kjv\" data-code=\"H8305\">fine</span> <span class=\"wl wl-kjv\" data-code=\"H6593\">flax,</span> and they that <span class=\"wl wl-kjv\" data-code=\"H707\">weave</span> <span class=\"wl wl-kjv\" data-code=\"H2355\">networks,</span> shall be confounded.","10":"And they shall be <span class=\"wl wl-kjv\" data-code=\"H1792\">broken</span> in the <span class=\"wl wl-kjv\" data-code=\"H8356\">purposes</span> thereof, all that <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> <span class=\"wl wl-kjv\" data-code=\"H7938\">sluices</span> and <span class=\"wl wl-kjv\" data-code=\"H99\">ponds</span> for fish.","11":"Surely the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> of <span class=\"wl wl-kjv\" data-code=\"H6814\">Zoan</span> are <span class=\"wl wl-kjv\" data-code=\"H191\">fools,</span> the <span class=\"wl wl-kjv\" data-code=\"H6098\">counsel</span> of the <span class=\"wl wl-kjv\" data-code=\"H2450\">wise</span> <span class=\"wl wl-kjv\" data-code=\"H3289\">counsellors</span> of <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> is become <span class=\"wl wl-kjv\" data-code=\"H1197\">brutish:</span> how <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> ye unto <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh,</span> I am the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of the <span class=\"wl wl-kjv\" data-code=\"H2450\">wise,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H6924\">ancient</span> kings?","12":"<span class=\"wl wl-kjv\" data-code=\"H335\">Where</span> are they? <span class=\"wl wl-kjv\" data-code=\"H645\">where</span> are thy <span class=\"wl wl-kjv\" data-code=\"H2450\">wise</span> men? and let them <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> thee now, and let them <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> what the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts</span> hath <span class=\"wl wl-kjv\" data-code=\"H3289\">purposed</span> upon Egypt.","13":"The <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> of <span class=\"wl wl-kjv\" data-code=\"H6814\">Zoan</span> are become <span class=\"wl wl-kjv\" data-code=\"H2973\">fools,</span> the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> of <span class=\"wl wl-kjv\" data-code=\"H5297\">Noph</span> are <span class=\"wl wl-kjv\" data-code=\"H5377\">deceived;</span> they have also <span class=\"wl wl-kjv\" data-code=\"H8582\">seduced</span> <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> even they that are the <span class=\"wl wl-kjv\" data-code=\"H6438\">stay</span> of the tribes","14":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H4537\">mingled</span> a <span class=\"wl wl-kjv\" data-code=\"H5773\">perverse</span> <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> in the <span class=\"wl wl-kjv\" data-code=\"H7130\">midst</span> thereof: and they have caused <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> to <span class=\"wl wl-kjv\" data-code=\"H8582\">err</span> in every <span class=\"wl wl-kjv\" data-code=\"H4639\">work</span> thereof, as a <span class=\"wl wl-kjv\" data-code=\"H7910\">drunken</span> man <span class=\"wl wl-kjv\" data-code=\"H8582\">staggereth</span> in his vomit.","15":"Neither shall there be any <span class=\"wl wl-kjv\" data-code=\"H4639\">work</span> for <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> which the <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> or <span class=\"wl wl-kjv\" data-code=\"H2180\">tail,</span> <span class=\"wl wl-kjv\" data-code=\"H3712\">branch</span> or <span class=\"wl wl-kjv\" data-code=\"H100\">rush,</span> may do.","16":"In that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> shall <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> be like unto <span class=\"wl wl-kjv\" data-code=\"H802\">women:</span> and it shall be <span class=\"wl wl-kjv\" data-code=\"H2729\">afraid</span> and <span class=\"wl wl-kjv\" data-code=\"H6342\">fear</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">because</span> of the <span class=\"wl wl-kjv\" data-code=\"H8573\">shaking</span> of the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> which he shaketh","17":"And the <span class=\"wl wl-kjv\" data-code=\"H127\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> shall be a <span class=\"wl wl-kjv\" data-code=\"H2283\">terror</span> unto <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> every one that maketh <span class=\"wl wl-kjv\" data-code=\"H2142\">mention</span> thereof shall be <span class=\"wl wl-kjv\" data-code=\"H6342\">afraid</span> in himself, <span class=\"wl wl-kjv\" data-code=\"H6440\">because</span> of the <span class=\"wl wl-kjv\" data-code=\"H6098\">counsel</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> which he hath determined","18":"In that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> shall <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> the <span class=\"wl wl-kjv\" data-code=\"H8193\">language</span> of <span class=\"wl wl-kjv\" data-code=\"H3667\">Canaan,</span> and <span class=\"wl wl-kjv\" data-code=\"H7650\">swear</span> to the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts;</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> shall be <span class=\"wl wl-kjv\" data-code=\"H559\">called,</span> The <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> of destruction.","19":"In that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> shall there be an <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> to the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and a <span class=\"wl wl-kjv\" data-code=\"H4676\">pillar</span> <span class=\"wl wl-kjv\" data-code=\"H681\">at</span> the <span class=\"wl wl-kjv\" data-code=\"H1366\">border</span> thereof to the LORD.","20":"And it shall be for a <span class=\"wl wl-kjv\" data-code=\"H226\">sign</span> and for a <span class=\"wl wl-kjv\" data-code=\"H5707\">witness</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt:</span> for they shall <span class=\"wl wl-kjv\" data-code=\"H6817\">cry</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">because</span> of the <span class=\"wl wl-kjv\" data-code=\"H3905\">oppressors,</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> them a <span class=\"wl wl-kjv\" data-code=\"H3467\">saviour,</span> and a great <span class=\"wl wl-kjv\" data-code=\"H7227\">one,</span> and he shall deliver","21":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall be <span class=\"wl wl-kjv\" data-code=\"H3045\">known</span> to <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians</span> shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H5647\">do</span> <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifice</span> and <span class=\"wl wl-kjv\" data-code=\"H4503\">oblation;</span> yea, they shall <span class=\"wl wl-kjv\" data-code=\"H5087\">vow</span> a <span class=\"wl wl-kjv\" data-code=\"H5088\">vow</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and perform","22":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H5062\">smite</span> <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt:</span> he shall <span class=\"wl wl-kjv\" data-code=\"H5062\">smite</span> and <span class=\"wl wl-kjv\" data-code=\"H7495\">heal</span> it: and they shall <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> even to the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and he shall be <span class=\"wl wl-kjv\" data-code=\"H6279\">intreated</span> of them, and shall heal","23":"In that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> shall there be a <span class=\"wl wl-kjv\" data-code=\"H4546\">highway</span> out of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> to <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria,</span> and the <span class=\"wl wl-kjv\" data-code=\"H804\">Assyrian</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> into <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptian</span> into <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians</span> shall <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> with the Assyrians.","24":"In that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> shall <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> be the <span class=\"wl wl-kjv\" data-code=\"H7992\">third</span> with <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> and with <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria,</span> even a <span class=\"wl wl-kjv\" data-code=\"H1293\">blessing</span> in the <span class=\"wl wl-kjv\" data-code=\"H7130\">midst</span> of the land:","25":"Whom the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts</span> shall <span class=\"wl wl-kjv\" data-code=\"H1288\">bless,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H1288\">Blessed</span> be <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> my <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria</span> the <span class=\"wl wl-kjv\" data-code=\"H4639\">work</span> of my <span class=\"wl wl-kjv\" data-code=\"H3027\">hands,</span> and <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> mine inheritance."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"last van Egypte","tekst":"Zie Isa 15:1 ."},{"catchword":"de HEERE","tekst":"Hij wil zeggen dat de Heere snellijk en onvoorziens de Egyptenaars zal aantasten. Vergelijk Psa 18:11 , en Psa 104:3 ."},{"catchword":"snelle wolk,","tekst":"Hebreeuws, lichte. Heel zelden worden er in Egypte wolken gezien, dewijl het daar niet regent, derhalve is het wat zeldzaams en verschrikkelijks daar wolken te zien."},{"catchword":"zullen bewogen","tekst":"Hier wordt den afgoden, die niets zijn, beweging toegeschreven. De mening is deze: De afgoden zullen hun gezag bij de Egyptenaars verliezen, dewijl zij hen uit de handen hunner vijanden niet hebben kunnen verlossen."},{"catchword":"voor Zijn aangezicht,","tekst":"Dat is, vanwege zijne aankomst en tegenwoordigheid."}],"2":[{"catchword":"Ik zal de Egyptenaren","tekst":"De zin is: ik zal een inlandsen oorlog in Egypte verwekken, zodat de een den ander zal vernielen. Zie dergelijke geschiedenis 2Ch 20:23 ."},{"catchword":"een iegelijk tegen zijn broeder,","tekst":"Hebreeuws, de man tegen zijn broeder, en de man tegen zijn metgezel."},{"catchword":"koninkrijk tegen koninkrijk","tekst":"Dat is, landschap tegen landschap, provincie tegen provincie. Het schijnt dat de profeet hier ziet op hetgeen er in Egypte geschied is na den dood van den koning Sethon, als twaalf koningen zich hebben opgeworpen en het koninkrijk van Egypte hebben gescheurd, en elk een deel van hetzelve aan zich getrokken heeft."}],"3":[{"catchword":"de geest der Egyptenaren","tekst":"Dat is, de moed, of courage, of het verstand. Zie Pro 15:13 ."},{"catchword":"zal uitgeledigd","tekst":"Te weten door de langdurige inlandse oorlogen."},{"catchword":"raad","tekst":"Dat is, aanslagen, opzet, voornemen. De zin is: Ik zal hen zo kwellen, dat zij geen raad noch uitkomst zullen weten te vinden."},{"catchword":"verslinden;","tekst":"Dat is, teniet maken."}],"4":[{"catchword":"van harde heren,","tekst":"Versta door deze harde heren die twaalf tirannen, die zichzelven voor koningen in Egypte hebben ingedrongen, na den dood van Sethon; anderen, eens harden heren, en verstaan dit alzo alsof de profeet hier sprak van den koning Nebukadnezar, en passen dit op hetgeen dat geschreven staat Jer 46:26 ."},{"catchword":"een strenge koning","tekst":"Dat is, een wrede, harde, felle koning, verstaande Psammetichus, een van die twaalf tirannen, die eerst van die andere elf verdreven en het land uitgejaagd zijnde, doch daarna met geweld weder in Egypte geraakt zijnde en alleen regerende, grote tirannie bedreven heeft."}],"5":[{"catchword":"zij zullen","tekst":"Te weten die twaalf tirannen. Doch enigen duiden dit op Nebukadnezar en zijne opvolgers."},{"catchword":"de wateren","tekst":"Te weten door dit middel: zij groeven een grote gracht, waar zij den Nijl inleidden, welke geul en vergadering der wateren genoemd wordt bij de oude schrijvers de zee Moerios; zodat de profeet hier wil te kennen geven dat zij de wateren van den Nijl afleidden en den bak deszelven droog zouden leggen."},{"catchword":"de zee","tekst":"Dat is, uit de rivier de Nijl; de Hebreën noemen zeeën alle grote vergaderingen van wateren. Anders: zij zullen de wateren doen vergaan, dat zij niet in de zee lopen."},{"catchword":"de rivier","tekst":"Verstaat men hier door de rivier de Nijl, zo wordt hier met een ander woord te kennen gegeven hetgeen straks de zee genoemd is geweest."}],"6":[{"catchword":"de rivieren","tekst":"Of, stromen, of vlieten; te weten die uit den Nijl vlietende, hier en daar door het land geleid werden om het land te bevochtigen met doorvlieting."},{"catchword":"de gedamde","tekst":"Hebreeuws, de stromen der verwarring, besluiting, of bevestiging, verstaande daarbij de wateren, die met dammen of dijken besloten en door het land geleid werden."}],"7":[{"catchword":"Het papiergewas","tekst":"Het Hebreeuwse woord betekent eigenlijk velletjes, of pelletjes. Hier staat te weten dat bij de Grieken en Latijnen papyrus betekent een gewas, hetwelk voornamelijk in de moerassige plaatsen van Egypte wast, omtrent tien ellen hoog, hetwelk met een naald van elkander kan gelicht en verdeeld worden in dunne brede blaadjes, die gedroogd en bereid zijnde, zeer bekwaam schrijfpapier geven. Van dit papier heeft en houdt het onze nu nog den naam, alhoewel het niet wast, maar van linnen lompen gemaakt wordt."}],"8":[{"catchword":"zullen treuren,","tekst":"Omdat zij geen vis meer vangen kunnen bij gebrek van water, en dat derhalve hunne winsten en middelen van leven ophouden zullen. Er werd veel vis in Egypte gegeten, alzo zij door een bijgeloof weinig beesten slachtten en aten."},{"catchword":"op de wateren,","tekst":"Hebreeuws, op het aangezicht; dat is, op het bovenste der wateren."}],"9":[{"catchword":"in het fijne vlas","tekst":"Of, in het gehekelde vlas, dat is, die kostelijk, edel, of fijn lijnwaad maken."},{"catchword":"beschaamd worden,","tekst":"Of, met schaamte bestaan, te weten omdat zij in armoede vervallen zullen, hun handel met de vreemde natiën ophoudende, en dat bij gebrek van vlas, hetwelk anderszins aan de beken in Egypte zeer schoon en veel placht te wassen."},{"catchword":"de witte stof","tekst":"Te weten van Egyptisch vlas, van hetwelk de prinsen en vorsten klederen maakten, gelijk te zien is Est 8:15 , die daarvan Chorim, dat is witte, genoemd werden."}],"10":[{"catchword":"zij zullen","tekst":"Alsof hij zeide: Zij huren zich voor groot loon arbeiders om lustige en genoegelijke vijvers te maken; maar de fondamenten der aarde zullen veler wege in Egypte invallen, alzo dat allen, die daarin en daaraan arbeiden, met het invallen der fondamenten zullen verbrijzeld en vermorzeld worden."},{"catchword":"met","tekst":"Anders, met hunne raadslagen. Anders, met hunne netten."},{"catchword":"lustige","tekst":"Hebreeuws, poelen der ziel; dat is, van den lust, dat is, lustige, genoegelijke poelen, vijvers, of grote plassen gelijk meren, die de tirannen pour plaisir, om hun genoegen en vermaak deden maken. Anders: vijvers der vissen, of van levende dingen. Men meent dat de profeet in vs.10 spreekt van dien groten arbeid, dien de tirannen, in Egypte heersende, hunnen onderzaten oplegden, hen zo met geld als door dwang drijvende tot het graven van een meer, poel, kanaal, of diepte, groot zijnde 3600 stadiën in den omgang, waar zij het water uit den Nijl uitleidden en weder daarin leiden konden, hetwelk genoemd werd de golf, of het meer Moerios. Tot het graven hiervan hebben die koningen ettelijke duizenden hunner onderzaten gebruikt."}],"11":[{"catchword":"Zoan","tekst":"Deze stad wordt door de Grieken en Latijnen genoemd Tanes, nabij de rivier de Nijl gelegen. Hiervan wordt de mond der rivier Nijl genoemdd Ostium Tanicum. In deze stad hielden hun vergadering de raden des konings van Egypte. Van Zoan wordt ook melding gemaakt Num 13:22 , en Psa 78:12 ."},{"catchword":"hoe kunt gijlieden","tekst":"Dit is een aanspraak aan de raadsheren van Sethon, die hier Farao genoemd wordt, Farao zijnde een algemene naam der koningen van Egypte. Ja enigen menen dat Farao in de Egyptische spraak zoveel te zeggen is als koning. Zie Gen 12:15 . Anders: Hoe spreekt gijlieden in den persoon van Farao? Alsof de profeet zeide: Hoe voorspelt gijlieden den koning en leert hem dus hoogmoedig spreken? daar toch deze Sethon een gek was, gelijk Herodotus getuigt."},{"catchword":"Ik ben een zoon der wijzen,","tekst":"Anderen nemen deze woorden aldus: Hoe kunt gijlieden [dat is, elk een onder ulieden] zeggen tot Farao en al pochende spreken: ik ben een zoon der wijzen; dat is, een discipel der wijzen en hooggeleerden. Een zoon der oude koningen zijt gij, o koning; dat is, een zoon uit koningen gesproten van oude tijden her."}],"12":[{"catchword":"Waar zijn nu","tekst":"Anders: waar zij die nu? [waar] zijn nu uwe wijzen?"},{"catchword":"uw wijzen?","tekst":"Te weten o koning."}],"13":[{"catchword":"De vorsten van Zoan","tekst":"Dat is, de voornaamsten."},{"catchword":"zot geworden,","tekst":"Dit is geschied door het rechtvaardig oordeel Gods, die hunne wijsheid in dwaasheid veranderd heeft."},{"catchword":"Nof","tekst":"Anders, Mof, Hos 9:6 . In de historiën der heidenen wordt deze stad Memphis genoemd, en heden ten dage Alcair, of Cairo, hetwelk een voortreffelijke stad in Egypte heden ten dage is."},{"catchword":"tot","tekst":"De zin is: Zij zullen geheel Egypte in beroering stellen, alzo dat geen hoek daarvan vrij zal zijn. Anderen nemen het aldus: Ja, zelfs de voornaamsten onder de regeerders, die hoeken of hoekstenen genoemd worden, omdat de maatschappij op hen als op hoekstenen steunt."}],"14":[{"catchword":"heeft","tekst":"Anders: zal inschenken; en straks: zij zullen Egypte, enz."},{"catchword":"een zeer verkeerden geest","tekst":"Of, een dwaalgeest, een wargeest. Hebreeuws, een geest der verkeerdheden, of der verdraaidheden. De zin is: God heeft hen van alle wijsheid en verstand beroofd, zodat zij niets goeds raden kunnen, ook niet weten waaruit of waarheen zij zich zullen keren of wenden."},{"catchword":"zich om en om wentelt","tekst":"Of, zich heen en weer werpt. Hebreeuws, dwaalt in zijn uitspuwsel. Hoe meer zich een dronkaard, als hij in zijn uitspuwsel ligt, keert en wendt, hoe lelijker en vuiler hij zich maakt; alzo ook, wil de profeet zeggen, hoe meer deze verkeerde raadslieden voortvaren met raad te geven, hoe meer zij schade aanrichten. Daarom ware het beter dat zij zich gerust hielden."}],"15":[{"catchword":"er zal","tekst":"De profeet wil met deze woorden te kennen geven dat in Egypte alles zo verward zou staan, alsof noch hoge noch lage standspersonen zinnen of verstand hebben zouden, alzo dat er geen zaken tot een gelukkig einde zouden gebracht worden. Herodotus schrijft in Euterpe, dat Psammetichus, de koning in Egypte, negen en twintig jaren lang met een geweldig leger voor de stad Azote gelegen heeft."}],"16":[{"catchword":"als de vrouwen;","tekst":"Te weten vreesachtig, gelijk er volgt."},{"catchword":"vanwege","tekst":"Hebreeuws, van het aangezicht der beweging, enz. Dat is, vanwege de bedreiging des Heeren, die Hij te kennen geeft door het opheffen en de beweging zijner handen."},{"catchword":"tegen hen","tekst":"Te weten tegen de Egyptenaars."}],"17":[{"catchword":"het land van Juda","tekst":"De profeet wil zeggen dat die van Egypte, horende dat Sanherib het land van Juda zal hebben overgetrokken, verschrikt en bevreesd zullen zijn, bezorgd dat hij zal komen en hun land ook innemen zal, gelijk het ook geschied is, zoals Herodotus in Euterpe getuigt. Daarbij verhalende dat Setho, de koning van Egypte, buiten raad zijnde, voor zijn afgod is nedergevallen, denzelven klagende in wat gevaar en benauwdheid hij vervallen was. Anderen verstaan deze woorden aldus: De Egyptenaars zullen God vrezen, zij zullen ook voor het volk Israël vervaard zijn, als zij zullen zien dat hetzelve zo wonderbaar door God wordt beschermd. Vergelijk Exo 14:25 ."}],"18":[{"catchword":"vijf steden","tekst":"Dat is, enige steden; dat is, mensen in enige steden woonachtig, te weten die door den bestemden raad van God ten eeuwigen leven zijn uitverkoren."},{"catchword":"sprekende","tekst":"Hebreeuws, die met de lip Kanaäns spreken zullen, gelijk Gen 11:1 . Dat is, zij zullen van Gods Woord spreken, hetwelk in de spraak Kanaäns, dat is, in de Hebreeuwse spraak, beschreven is, en zij zullen zich van de gelovige Joden laten onderwijzen in den weg der zaligheid."},{"catchword":"zwerende","tekst":"Dat is, zij zullen zich met een eed verplichten aan den waren God, verlatende en afzwerende de valse goden. De zin is: Zij zullen de ware religie aannemen."},{"catchword":"een zal genoemd zijn","tekst":"Te weten omdat zij tevoren verstoord was geweest, of nabij om verstoord te worden; maar door de barmhartigheid van God behouden gebleven. Anders: elkeen, gelijk Isa 6:2 ."}],"19":[{"catchword":"zal de HEERE","tekst":"Dat is, de ware godsdienst zal aldaar verricht worden, die ten tijde der profeten bij en op het altaar placht verricht te worden."},{"catchword":"een opgericht teken","tekst":"Dat is, zij zullen openlijk den Heere voor hunnen God aannemen en belijden; tot een teken waarvan zij openlijk dit teken zouden oprichten. Vergelijk hiermede Gen 28:18 ; Exo 24:4 ; Jos 4:8 , Jos 4:20 , en Jos 22:10 ."},{"catchword":"aan haar landpalen","tekst":"Aan hunne; te weten der Egyptenaars, of aan zijne; te weten Egyptes landpale."}],"20":[{"catchword":"het zal zijn","tekst":"Of, dat; te weten altaar."},{"catchword":"den HEERE","tekst":"Dat is, dat de Heere van de Egyptenaars geëerd wordt. Zie Jos 24:27 ."},{"catchword":"zij zullen","tekst":"Te weten de Egyptenaars."},{"catchword":"een Heiland","tekst":"Te weten den Heere Jezus Christus."},{"catchword":"Meester zenden,","tekst":"Anders, grote, of overste."}],"22":[{"catchword":"dapper slaan,","tekst":"Hebreeuws, slaande slaan."},{"catchword":"en genezen;","tekst":"Of, doch genezen; dat is Hij zal hen slaan, nochtans niet tot hun verderf, maar Hij zal hen wederom genezen, gevende hun het geloof in Christus en den geest der heiligmaking."},{"catchword":"Hij zal Zich","tekst":"Zie Gen 25:21 , en 2Sa 24:25 ."}],"23":[{"catchword":"zal er","tekst":"De zin is: De gelovigen uit de Assyriërs en Egyptenaars zullen elkander liefde en vriendschap bewijzen, als zij beiden de Christelijke religie zullen hebben aangenomen; want hier spreekt de profeet van de beroeping der heidenen tot Christus."},{"catchword":"een gebaande weg","tekst":"Dat is, een algemene weg."},{"catchword":"den HEERE dienen","tekst":"Of zullen dienst doen; te weten, God, den waren God, met een oprechte mening en gemoed. Anders: de Egyptenaars zullen de Assyriërs dienen, of ten dienste staan; elkander in Christelijke liefde omhelzende, daar zij tevoren elkander vijandig waren en krijg aandeden."}],"24":[{"catchword":"zal Israël","tekst":"De profeet wijst hier verder aan dat de gelovige Joden met de heidenen, die zich tot den waren God zouden bekeren, goede vriendschap en broederlijke gemeenschap zouden houden."},{"catchword":"de derde wezen","tekst":"Of, zelfs derde."},{"catchword":"de Egyptenaren","tekst":"Onder deze twee natiën worden ook andere heidenen verstaan en begrepen."},{"catchword":"in het midden","tekst":"Of, midden op de aarde; dat is, door de gehele wereld, namelijk als het Evangelie door de ganse wereld zal gepredikt worden."}],"25":[{"catchword":"Want de HEERE","tekst":"Anders: welke de HEERE der heirscharen zal zegenen, zeggende: Weest gezegend, mijn volk van Egypte, en o Assyrië, het werk mijner handen, en o Israël, mijn erfdeel."},{"catchword":"zal hen zegenen,","tekst":"Of, zal hun; te weten de Israëlieten, of Egyptenaars, of Assyriërs. Anders: zal het; te weten land, of zal het; te weten volk, zegenen."},{"catchword":"het werk","tekst":"Wedergeboren door den Heiligen Geest, en zijnde derhalve nieuwe creaturen."},{"catchword":"Mijn erfdeel","tekst":"Dat is, mijn zeer lieve en beminde, die Ik vanouds als mijn erfdeel bezit."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"The burden of Egypt. [See above chap.15.1.] Behold, the LORD rideth upon a swift cloud, and he shall come into Egypt: [Intimating that the LORD would suddenly and unawares seize upon the Egyptians. Compare Psal.18.10. and 104.3. (upon a swift cloud) Hebr. Light cloud. There are very seldom clouds seen in Egypt, there being no rain: therefore it is somewhat strange and fearful to see clouds there] and the Idols of Egypt shall be moved [Here unto Idols, which are nothing, motion is ascribed. The meaning is this, the Idols shall lose their authority with the Egyptians, because they were not able to deliver them from the hands of their enemies] at his face, [That is, by reason of his coming and presence] and the heart of the Egyptians shall melt in their inner-most (parts.)"}],"2":[{"catchword":null,"tekst":"For I will entangle the Egyptians, (so) that they shall fight every one against his brother, and everyone against his neighbour: [Hebr. The man against his brother, and the man against his fellow, or, companion. The meaning is, I will raise up an intestine war in Egypt, so that they shall destroy one another. See the like passage, 2 Chron.20.23.] City against City, Kingdom against Kingdom. [That is, Country against Country, Province against Providence. It seemeth that the Prophet hath respect here, unto that which happened in Egypt after the death of King Sethon, when twelve petty Kings rose up, and rent or divided the Kingdom of Egypt in sunder, and each of them drew a part of it unto themselves]"}],"3":[{"catchword":null,"tekst":"And the spirit of the Egyptians [That is, their valour, courage, or, understanding. See Prov.15.on vers.13.] shall be emptied [To wit, by those long-lasting devour [That is, disannul, or, bring to nought] their counsel: [That is, their enterprises, purposes, designs. The meaning is, I will so vex them, that they shall not be able to find any counsel, or way of escaping] then shall they ask counsel of their Idols, and of the enchanters, and of the sooth-sayers, and of the Necromancers."}],"4":[{"catchword":null,"tekst":"And I will shut up the Egyptians in the hand of hard Lords, [Understand by these hard Lords, those twelve Tyrants, who thrust in themselves for Kings in Egypt, after the death of Sethon. Oth. Of an hard, or, cruel Lord; and they understand this so, as if the Prophet here spake of King Nebuchadnezar; and they apply this unto that which is written Jerem.46 26.] and a severe King shall Psalmmetychus, one of those twelve Tyrants, who being first expelled and chased out of the land by the other eleven, but afterward getting by force into Egypt again, and ruling alone, without any co-partners in the government, committed great tyranny.]"}],"5":[{"catchword":null,"tekst":"And they [To wit, those twelve Tyrants. But some apply it unto Nebuchadnezar, and his successors] shall cause the waters to perish from the Sea: [To wit, by this means: They digged a great ditch, into which they carried the river Nilus, which channel and gathering of waters is called by the ancient Writers the Sea Maerios; so that the Prophet will here intimate that they should carry away the waters from Nilus, and should lay the channel thereof dry. (They shall cause the waters to perish from the Sea:) that is, from the river Nilus. The Hebrews call all great gatherings of waters, Seas. Oth. They shall cause the waters to perish, that they run not into the sea] and the river shall run out by drops (or by little and little,) and dry away. [If here by the river, be meant Nilus, then is here expert by another word that which immediately before was called the sea.]"}],"6":[{"catchword":null,"tekst":"They shall also drive the rivers [Or, streams, or, floods, to wit, which run from Nilus, and which here and there were derived through the land, to moisten and water the land of running through it] far back, they shall empty them, and dry up the dammed streams. [Hebr. The streams of keeping, shutting up, or defence, understanding thereby the waters that were shut in with dams or dikes, and were carried through the land] the reed and the bulrush shall wither."}],"7":[{"catchword":null,"tekst":"The paper-plant [The Hebrew word signifieth properly little thin skins, or, rinds. Here is to be noted, that among the Greeks and Latines, Papyrus signifieth a plant which chiefly growth in Moorish places in Egypt, about ten cubits high, which with a needle may be parted and divided a sunder into thin broad leaves, which being dried and prepared, maketh very fit writing-paper. From this sort of paper hath ours, (and doth still retain to this very day) its name, although it doth not grow, as the other did, but is made of Linen Rags] by the streams, by the banks of the streams, and all that is sown by the streams, shall dry away, it shall be thrust away, and be no (more.)"}],"8":[{"catchword":null,"tekst":"And the Fishers shall mourn, [Because they can catch no more fish, for want of water, and that therefore their gain and way of getting their living shall cease. There was great store of fish eaten in Egypt, in regard they did out of superstition, kill and eat but few beasts] and all they that cast angle into the streams, shall lament: and they that spread abroad the casting-net upon the waters [Heb. Upon the face, that is, upon the upper-most part of the waters] shall pine away."}],"9":[{"catchword":null,"tekst":"And the workers in fine flax, [Or, in carded flax; that is, those that make costly, precious, or fine linen-cloth] shall be ashamed, [Or, be put to shame, be confounded; to wit, because they shall fall into poverty, their trading with foreign Nations ceasing, and that for want of flax, which otherwise was wont to grow very fair, and in great quantity by the brooks in Egypt,] also the weavers of white stuff. [To wit, made of Egyptians flax, of which kind of stuff or flax the Princes and Noble-men had their garments made, as appeareth, Esth.8.15. who from thence were called Chorim, that is, white ones.]"}],"10":[{"catchword":null,"tekst":"And they shall be broken to Shivers (with,) their foundations, [Oth. With their counsels, or, purposes. Oth. With their nets] all that (for) wages make pleasant standing waters. [Hebr. Pools of the soul; that is, of delight: that is, pleasant, delightful, pals, ponds, or great waters, as lakes, which Tyrants caused to be made for their own pleasure and delight. Oth. Ponds, or, pools of fishes, or, of living things. It is concerned that the Prophet in this verse, speaketh of that great task, which the Tyrants that ruled in Egypt, laid upon their subjects, causing them both by money and compulsion to dig a sea, pool, channel, or depth, being 3600. Furlongs in compass, wither they could carry the water from, Nilus, and could carry it in thither again, which was called the lake, gulf, or sea Milrios: To the digging hereof those Kings used or employed some thousands of their subjects. (And they shall be broken to shivers, &c.) As if he had said, they hire unto themselves for great wages labourer to make pleasant and delightful fish-ponds, but the foundations of the earth shall many ways fall down in Egypt, so that all those that labour in and about those ponds, shall by falling down of the foundations be bruised and broken to shivers.]"}],"11":[{"catchword":null,"tekst":"Surely the princes of Zion [This city is called by the Greeks and Latines Tanes, lying hard by the river Nilus. Hence the mouth of the river Nilus is called Ostium Tanicum. In this city the King of Egypts counsellors held their college or assembly. Of Zoan is also mention made, Num 3:22. and Psal.78.12.] are fools, the counsel of the wise, (even) of Pharaohs Counsellors is become bruish: how can ye (then) say unto Pharaoh, I am a son of the wise, a son of ancient Kings? [This is a speech made to the Counsellors of Sethon, who is called Pharaoh in this place. Pharaoh being a common name of all the Kings of Egypt: s in Euterpe testifieth: withal relating that Setho King of Egypt, being void of counsel, fell down before his Idol, complaining to him in what danger and distress he was. Oth. Understand these words thus, the Egyptians shall fear God they shall also be afraid of the people of Israel, when they shall see that they are so miraculously preserved & protected by God. Compare Exo.14.25.]"}],"18":[{"catchword":null,"tekst":"In that day there shall be five cities in Egypt, [That is, certain cities; that is, men dwelling in certain cities; to wit, such as by the determinate counsel of God are chosen or ordained unto eternal life.] speaking the language of Canaan, [Heb. Which shall speak with the lip of Canaan, as Gen.11.vers.1. that is, they shall speak of Gods word, which is written in the language of Canaan, that is, in the Hebrew language, or Hebrew tongue: and they shall suffer themselves to be instructed by the believing Jews in the way of Salvation] swearing unto the LORD of hosts, [that is, they shall engage themselves to the true God by oath, forsaking, and forswearing false Gods. The meaning is, they shall receive and embrace the true Religion. See Deut.10.20. and Jer 12:16.] one shall be called a city of destruction] to wit, because it had been destroyed aforetime, or was nigh to be destroyed, but by the mercy of God was saved. Others, every one, as above chap.6.2."}],"19":[{"catchword":null,"tekst":"In that day shall the LORD have an altar in the midst of the Land of Egypt, [That is, the true worship of God shall be exercised there, which in the time of the Prophet was wont to be done nigh or upon the altar] and a token set up at their border for the LORD, [that is, they shall publicly receive and embrace the Lord for their God, and make public profession of him: in token whereof they shall set up this token openly. Compare herewith Gen 28:18. Exo 24:4. Isa.4.ver.8, and 20. And chap.22. ver.10. at their border; to wit, the border of the Egyptians: Or, at her border, to wit, Egypts border.]"}],"20":[{"catchword":null,"tekst":"And it [Or, that; to wit, altar] shall be for a token, and for a witness unto the LORD of hosts in the Land of Egypt, [that is, that the Lord is honoured and worshipped of the Egyptians. See Jos.24.27.] for they [to wit, the Egyptians] shall cry unto the LORD because of the oppressions, and he shall send them a saviour, [to wit, the Lord Jesus Christ] and a master [Others, Great one, or, Ruler, Captain] the same shall deliver them."}],"21":[{"catchword":null,"tekst":"And the LORD shall be known to the Egyptians, and the Egyptians shall know the LORD in that day: and they shall serve (him with) slay-offering, and meat-offering, [Compare Mal 1:11.] and they shall vow a vow unto the LORD, and pay (it.)"}],"22":[{"catchword":null,"tekst":"And the LORD shall smite the Egyptians valiantly [Heb. Smiting smite] and heal (them): [or, yet not to their destruction, but he shall heal them again, giving them faith in Christ, and the spirit of sanctification] and they shall return unto the LORD, and he shall suffer himself to be entreated of them, [See Gen 25:21. and 2 Sam.24.25.] and he shall heal them."}],"23":[{"catchword":null,"tekst":"In that day there shall be a path-way, [That is, a common road or passage] from Egypt into Assyria, (so) that the Assyrians shall come into Egypt, and the Egyptians into Assyria: [the meaning is, the believers of the Assyrians and Egyptians shall shew love and friendship to one another, when they both shall have embraced the Christian Religion: for the Prophet speaketh here of the calling of the Gentiles unto Christ] and the Egyptians shall with the Assyrians serve (the LORD) [or, shall do service; to wit, unto God, with an upright heart and affection. Others, the Egyptians shall serve the Assyrians, or, beat their service, embracing each other in Christians love, whereas formerly they were enemies one to another, and made war one against another.]"}],"24":[{"catchword":null,"tekst":"In that day shall Israel be the third with the Egyptians, and with the Assyrians, a blessing in the midst of the land. [The Prophet sheweth further in this verse, that the believing Jews should keep good correspondency and brotherly fellowship with the heathen or gentiles that should be converted unto the true God, (In that day shall Israel be the third) or even the third, or, the very third, (with the Egyptians, and with the Assyrians) under these two Nations are also other Gentiles understood and comprehended, (a blessing in the midst of the land) or, in the midst on earth; that is, throughout the whole world, namely when the gospel shall be preached throughout the whole world.]"}],"25":[{"catchword":null,"tekst":"For the LORD of hosts shall bless them, [To wit, the Israelites, or the Egyptians, or the Assyrians. Others, shall bless it; to wit, the land: or, shall bless it; to wit, the people] saying, Blessed he my people the Egyptians, and the Assyrians the work of mine hands, born again of the holy Ghost, and being therefore new creatures] and Israel mine inheritance. [that is my dearly beloved, whom of old I have, and do still possess as mine inheritance. Others, whom the LORD of Hosts shall bless, sayings Be blessed my people of Egypt, and O Assyria the work of mine hands, and O Israel mine inheritance.]"}]}}};
