E, u bespotters, u die heersen over dit volk, dat in Jeruzalem is! Omdat u zegt: Wij hebben een verbond met de dood gemaakt, en met het rijk van de dood hebben wij een voorzichtig verdrag gemaakt; wanneer de overstromende gesel doortrekt, zal hij bij ons niet komen; want wij hebben de leugen ons tot een toevlucht gesteld, en onder de valsheid hebben wij ons verborgen. Daarom, zo zegt de Heere HEERE: Zie, Ik leg een grondsteen in Sion, een beproefde steen, een kostbare hoeksteen, die stevig gegrondvest is; wie gelooft, die zal niet haasten.", "Rom 4:8": "Gelukkig is de man, aan wie de Heere de zonden niet toerekent.", "Jes 17:1-3": "De last van Damaskus. Zie, Damaskus zal weggenomen worden, zodat het geen stad meer is, maar het zal een vervallen steenhoop zijn. De steden van Aroer zullen verlaten worden; ze zullen er zijn voor de kudden, die daar zullen neerliggen, en niemand zal ze schrik aanjagen. En de vesting zal ophouden in Efraïm, en het koninkrijk in Damaskus, en het overblijfsel van de Syriërs; zij zullen zijn als de heerlijkheid van de kinderen van Israël, spreekt de HEERE van de heerscharen.", "Gen 22:16": "En zei: Ik zweer bij Mijzelf, spreekt de HEERE; omdat u dit gedaan hebt, en uw zoon, uw enige, niet onthouden hebt;", "Matt 3:4": "En dezelfde Johannes had zijn kleding van kameelhaar, en een leren gordel om zijn middel; en zijn voedsel was sprinkhanen en wilde honing.", "1 Petr 3:15": "maar heilig God, de Heere, in uw harten; en wees altijd bereid tot verantwoording aan ieder die u rekenschap vraagt van de hoop die in u is, met zachtmoedigheid en vreze,", "Hebr 10:5-7": "Daarom zegt Hij, bij Zijn komst in de wereld: Slachtoffer en offergave hebt U niet gewild, maar U hebt Mij een lichaam toebereid; Brandoffers en offers voor de zonde hebben U niet behaagd. Toen zei Ik: Zie, Ik kom (in het begin van het boek is over Mij geschreven) om Uw wil te doen, o God!", "Gen 22:17": "Voorzeker zal Ik u rijk zegenen, en uw nageslacht zeer talrijk maken, als de sterren van de hemel, en als het zand dat aan de oever van de zee is; en uw nageslacht zal de poort van zijn vijanden erfelijk bezitten.", "Jer 21:12": "O huis van David! zo zegt de HEERE: Spreek 's morgens recht, en bevrijd de beroofde uit de hand van de verdrukker; anders zal Mijn gramschap uitvaren als een vuur, en branden, zodat niemand het blussen kan, vanwege de slechtheid van uw daden.", "Matt 22:43-45": "Hij zei tegen hen: Hoe noemt David Hem dan, in de Geest, zijn Heere? Hij zei immers: De Heere heeft gezegd tot mijn Heere: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gezet heb. Als David Hem dan zijn Heere noemt, hoe is Hij dan zijn Zoon?", "Rom 4:17": "(Zoals geschreven staat: Ik heb u tot een vader van veel volken gesteld) voor Hem, aan Wie hij geloofd heeft, namelijk God, Die de doden levend maakt, en de dingen die niet zijn roept alsof zij waren;", "Ex 33:19": "Doch Hij zei: Ik zal al Mijn goedheid voorbij uw aangezicht laten gaan, en zal de Naam van de HEERE uitroepen voor uw aangezicht; maar Ik zal genadig zijn aan wie Ik genadig zal zijn, en Ik zal Mij ontfermen over wie Ik Mij ontfermen zal.", "Ex 20:12": "Eer uw vader en uw moeder, opdat uw dagen verlengd worden in het land dat de HEERE, uw God, u geeft.", "Matt 21:34": "Toen nu de tijd van de vruchten naderde, stuurde hij zijn dienstknechten naar de landbouwers, om zijn vruchten te ontvangen.", "Jes 9:10": "Want de HEERE zal Rezins tegenstanders tegen hem opheffen, en Hij zal zijn vijanden samen verenigen:", "1 Tim 1:13": "Ik was voorheen een godslasteraar, en een vervolger, en een geweldenaar; maar mij is barmhartigheid overkomen, omdat ik het onwetend gedaan heb in mijn ongeloof.", "Ps 89:36": "Ik heb eens gezworen bij Mijn heiligheid: Zeker zal Ik aan David niet liegen!", "Hand 7:50": "Heeft Mijn hand niet al deze dingen gemaakt?", "Hos 12:8-15": "In de hand van de koopman is een bedrieglijke weegschaal, hij houdt ervan te verdrukken; Nog zegt Efraïm: Toch ben ik rijk geworden, ik heb voor mij groot goed verkregen; in al mijn arbeid zullen zij mij geen ongerechtigheid vinden, die zonde zou zijn. Maar Ik ben de Heere, uw God, van Egypteland af; Ik zal u nog in tenten laten wonen, als in de dagen van het feest.", "Ex 9:16": "Maar juist daarom heb Ik u laten opstaan, opdat Ik Mijn kracht aan u zou tonen, en opdat men Mijn Naam vertelt op de hele aarde.", "Luk 20:37": "En dat de doden opgewekt zullen worden, heeft ook Mozes aangewezen bij de doornstruik, toen hij de Heere de God van Abraham noemt, en de God van Izak, en de God van Jakob.", "Zach 9:9": "Verheug u zeer, dochter van Sion! Juich, dochter van Jeruzalem! Zie, uw Koning zal tot u komen, rechtvaardig, en Hij is een Heiland; arm, en rijdend op een ezel, en op een veulen, het jong van de ezelinnen.", "2 Kor 6:18": "en Ik zal u tot een Vader zijn, en u zult Mij tot zonen en dochters zijn, zegt de Heere, de Almachtige.", "Ps 69:24": "Laat hun ogen duister worden, dat zij niet zien; en doe hun heupen voortdurend waggelen.", "Mark 4:25": "Want wie heeft, aan hem zal gegeven worden; en wie niet heeft, van hem zal ook afgenomen worden wat hij heeft.", "Ps 118:26": "Gezegend is hij die daar komt in de Naam van de HEERE! Wij zegenen u uit het huis van de HEERE.", "Jes 10:23": "Want een verdelging, die vast besloten is, zal de Heere HEERE van de heerscharen doen in het midden van dit hele land.", "1 Tess 1:1": "Paulus, en Silvanus, en Timotheüs, aan de Gemeente van de Thessalonicenzen, die is in God de Vader, en de Heere Jezus Christus: genade zij u en vrede van God, onze Vader, en de Heere Jezus Christus.", "Hebr 4:6": "Omdat het dan blijft gelden dat sommigen die rust ingaan, en zij aan wie het Evangelie eerst verkondigd was, niet ingegaan zijn vanwege de ongehoorzaamheid,", "Joh 10:34": "Jezus antwoordde hun: Staat er niet geschreven in uw wet: Ik heb gezegd, u bent goden?", "Hos 4:17": "Efraïm is met de afgoden verbonden; laat hem begaan.", "2 Kon 15:30": "En Hosea, de zoon van Ela, smeedde een samenzwering tegen Pekah, de zoon van Remalia, en sloeg hem neer, en doodde hem, en werd koning in zijn plaats; in het twintigste jaar van Jotham, de zoon van Uzzia.", "Ex 2:13": "De volgende dag ging hij er weer op uit, en zie, twee Hebreeuwse mannen waren aan het vechten; en hij zei tegen degene die ongelijk had: Waarom slaat u uw naaste?", "Jes 8:18": "Zie, ik en de kinderen die de HEERE mij gegeven heeft, zijn tot tekenen en tot wonderen in Israël, van de HEERE van de heerscharen, Die op de berg Sion woont.", "Hebr 4:7": "bepaalt Hij opnieuw een zekere dag, namelijk heden, doordat Hij door David zegt, zo lange tijd daarna (zoals gezegd is): Heden, als u Zijn stem hoort, verhard dan uw harten niet.", "Rom 11:27": "En dit is hun een verbond van Mij, als Ik hun zonden zal wegnemen.", "Jes 11:10": "Want het zal gebeuren op die dag, dat de heidenen zullen vragen naar de Wortel van Isaï, Die zal staan als een banier voor de volken, en Zijn rust zal heerlijk zijn.", "Ezech 5:1": "En u, mensenkind, neem een scherp mes, een scheermes van de barbiers zult u nemen, en dat zult u over uw hoofd en over uw baard laten gaan; daarna zult u een weegschaal nemen, en die haren verdelen.", "Matt 13:55": "Is Dit niet de zoon van de timmerman? Heet Zijn moeder niet Maria, en Zijn broers Jakobus en Joses, en Simon en Judas?", "Matt 28:17": "En toen zij Hem zagen, aanbaden zij Hem; maar sommigen twijfelden.", "Ps 95:11": "Daarom heb Ik in Mijn toorn gezworen: Zij zullen in Mijn rust niet ingaan!", "Jes 11:1": "Want er zal een Rijsje voortkomen uit de afgehouwen tronk van Isaï, en een Scheut uit zijn wortels zal vrucht voortbrengen.", "Jes 37:35": "Want Ik zal deze stad beschermen om die te verlossen, omwille van Mijzelf, en omwille van David, Mijn knecht.", "1 Petr 2:24": "Die Zelf onze zonden in Zijn lichaam gedragen heeft op het hout; opdat wij, voor de zonden afgestorven, voor de gerechtigheid zouden leven; door Wiens striemen u genezen bent.", "1 Kon 20:34": "En hij zei tegen hem: De steden, die mijn vader van uw vader genomen heeft, zal ik teruggeven, en maak u straten in Damaskus, zoals mijn vader in Samaria gemaakt heeft. En ik, antwoordde Achab, zal u met dit verbond dan laten gaan. Zo sloot hij een verbond met hem, en liet hem gaan.", "Matt 2:15": "en hij was daar tot de dood van Herodes; opdat vervuld zou worden wat door de Heere gesproken is door de profeet: Uit Egypte heb Ik Mijn Zoon geroepen.", "Ps 27:2": "Toen de bozen, mijn tegenpartijen en mijn vijanden, tegen mij naar mij toe kwamen om mijn vlees te eten, stieten zij zelf aan en vielen.", "Joh 5:38": "En Zijn woord hebt u niet in u blijven, want u gelooft Hem niet, Die Hij gezonden heeft.", "Luk 24:25": "En Hij zei tegen hen: O onverstandigen en tragen van hart om te geloven al wat de profeten gesproken hebben!", "Ps 82:6": "Ik heb wel gezegd: U bent goden; en u bent allen kinderen van de Allerhoogste;", "1 Joh 5:10": "Wie in de Zoon van God gelooft, heeft het getuigenis in zichzelf; wie God niet gelooft, heeft Hem tot een leugenaar gemaakt, omdat hij niet geloofd heeft het getuigenis dat God getuigd heeft van Zijn Zoon.", "Jer 7:8-34": "Zie, u vertrouwt op valse woorden, die geen nut doen. Zult u stelen, doodslaan en overspel bedrijven, en vals zweren, en voor Baäl reukwerk branden, en andere goden nawandelen, die u niet kent, en dan komen en staan voor Mijn aangezicht in dit huis, dat naar Mijn Naam genoemd is, en zeggen: Wij zijn verlost, om al deze gruwelen te doen?", "Jes 4:1": "En op die dag zullen zeven vrouwen één man vastgrijpen en zeggen: Ons eigen brood zullen wij eten, en met onze eigen kleren zullen wij bekleed zijn; laat ons alleen naar uw naam genoemd worden, neem onze smaad weg.", "Ps 52:4": "Uw tong denkt enkel schade uit, als een geslepen scheermes, en werkt bedrog.", "Gen 18:8": "En hij nam boter en melk, en het kalf dat hij klaargemaakt had, en zette het hun voor, en stond zelf bij hen onder de boom, en zij aten.", "2 Sam 10:15": "Toen nu de Syriërs zagen, dat zij voor Israëls aangezicht geslagen waren, verzamelden zij zich weer samen.", "Jes 29:10": "Want de HEERE heeft over u uitgegoten een geest van diepe slaap, en Hij heeft uw ogen dichtgesloten; de profeten, en uw hoofden, en de zieners heeft Hij verblind.", "Hos 8:11": "Omdat Efraïm de altaren vermenigvuldigd heeft om te zondigen, zijn hem de altaren geworden tot zondigen.", "Deut 28:49-57": "De HEERE zal tegen u een volk laten opkomen van ver, van het einde van de aarde, zoals een arend vliegt; een volk waarvan u de taal niet zult verstaan; Een volk, hard van gezicht, dat geen ontzag zal hebben voor de oude, noch genadig zal zijn voor de jonge. En het zal de vrucht van uw vee, en de vrucht van uw land opeten, totdat u verdelgd zult zijn; het zal u geen koren, most of olie, aanwas van uw koeien of kudden van uw kleinvee overlaten, totdat het u vernietigt.", "Jer 19:2": "En ga uit naar het dal van de zoon van Hinnom, dat voor de deur van de Zonnepoort is, en roep daar de woorden uit, die Ik tot u spreken zal;", "Jes 9:5": "Want een Kind is ons geboren, een Zoon is ons gegeven, en de heerschappij is op Zijn schouder; en men noemt Zijn naam Wonderlijk, Raad, Sterke God, Vader van de eeuwigheid, Vredevorst;", "Jes 55:3": "Neig uw oor, en kom tot Mij, hoor en uw ziel zal leven; want Ik zal met u een eeuwig verbond maken, en u geven de zekere weldaden van David.", "Job 5:13": "Hij vangt de wijzen in hun arglistigheid; zodat de raad van de verdraaiden overhaast valt.", "Ps 94:11": "De HEERE kent de gedachten van de mens, dat zij vluchtig zijn.", "Ps 2:1": "Waarom woeden de heidenen, en bedenken de volken iets zinloos?", "Joh 12:15": "Vrees niet, dochter van Sion, zie, uw Koning komt, zittend op het veulen van een ezelin.", "Neh 3:13": "De Dalpoort verbeterden Hanun, en de inwoners van Zanoah; zij bouwden die, en richtten haar deuren op, met haar sloten en haar grendelen; daarbij duizend el aan de muur, tot aan de Mistpoort.", "Luk 24:42": "En zij gaven Hem een stuk gebraden vis, en wat honingraat.", "Deut 28:66": "En uw leven zal voor u onzeker hangen; en u zult nacht en dag angst hebben, en u zult niet zeker zijn van uw leven.", "Hand 13:48": "Toen de heidenen dit hoorden, verblijdden zij zich, en prezen het Woord van de Heere; en er geloofden zovelen als er bestemd waren tot het eeuwige leven.", "Jak 1:6": "Maar laat hij ze vragen in geloof, niet twijfelend; want wie twijfelt, is een golf van de zee gelijk, die door de wind gedreven en heen en weer geworpen wordt.", "Ex 8:22": "En Ik zal op die dag het land Gosen, waarin Mijn volk woont, afzonderen, zodat daar geen vermenging van ongedierte is, opdat u weet dat Ik, de HEERE, in het midden van dit land ben.", "Ps 118:22": "De steen, die de bouwlieden verworpen hadden, is tot een hoofd van de hoek geworden.", "Matt 1:23": "Zie, de maagd zal zwanger worden en een Zoon baren, en u zult Hem de naam Emmanuel geven; dat betekent, vertaald: God met ons.", "1 Kon 14:16": "En Hij zal Israël overgeven, vanwege de zonden van Jerobeam, die gezondigd heeft, en die Israël heeft doen zondigen.", "Hos 10:8": "En de hoogten van Aven, Israëls zonde, zullen vernietigd worden; doorns en distels zullen op hun altaren opkomen; en zij zullen tegen de bergen zeggen: Bedek ons! en tegen de heuvels: Val op ons!", "2 Kron 32:3": "hield hij raad met zijn vorsten en zijn helden, om de waterbronnen te dichten die buiten de stad waren; en zij hielpen hem.", "Jes 14:24-28": "De HEERE van de heerscharen heeft gezworen: Voorzeker, zoals Ik gedacht heb, zo zal het gebeuren, en zoals Ik beraadslaagd heb, zo zal het bestaan! Dat Ik Assur in Mijn land zal verbreken, en hem op Mijn bergen vertreden; opdat zijn juk van hen afwijkt, en zijn last van hun schouder wijkt. Dit is de raadslag, die beraadslaagd is over dat hele land; en dit is de hand, die uitgestrekt is over alle volken.", "Jes 40:3": "Een stem van iemand die roept in de woestijn: Bereidt de weg van de HEERE, maakt recht in de wildernis een baan voor onze God!", "Jes 6:13": "Toch zal er nog een tiende deel in zijn, en het zal terugkeren, en zijn om af te weiden; maar zoals de eik, en zoals de haageik, waarin na het afwerpen van hun bladeren nog steunsel is, zo zal het heilige zaad het steunsel daarvan zijn.", "Matt 8:17": "opdat vervuld zou worden wat gesproken was door de profeet Jesaja, die zei: Hij heeft onze ziekten op Zich genomen, en onze kwalen gedragen.", "Hand 2:25-28": "Want David zegt van Hem: Ik zag de Heere altijd voor mij; want Hij is aan mijn rechterhand, opdat ik niet bewogen zou worden. Daarom is mijn hart verblijd, en mijn tong verheugt zich; ja, ook mijn vlees zal rusten in hoop; Want U zult mijn ziel niet verlaten in het rijk van de dood, en Uw Heilige zult U niet overgeven om verderving te zien.", "2 Sam 17:29": "En honing, en boter, en schapen, en koeienkaas, brachten naar David, en naar het volk dat bij hem was, om te eten, want zij zeiden: Dit volk is hongerig, en moe, en dorstig in de woestijn.", "1 Petr 3:10-12": "Want wie het leven wil liefhebben en goede dagen wil zien, die moet zijn tong weerhouden van het kwade, en zijn lippen, zodat ze geen bedrog spreken; hij moet wijken van het kwade en het goede doen; hij moet vrede zoeken en die najagen. Want de ogen van de Heere zijn over de rechtvaardigen, en Zijn oren gericht op hun gebed; maar het aangezicht van de Heere is tegen hen die kwaad doen.", "Matt 12:38-40": "Toen antwoordden sommigen van de Schriftgeleerden en Farizeeën: Meester, wij willen graag een teken van U zien. Maar Hij antwoordde en zei tegen hen: Het slechte en overspelige geslacht verlangt een teken; en hun zal geen teken gegeven worden, dan het teken van de profeet Jona. Want zoals Jona drie dagen en drie nachten in de buik van de walvis was, zo zal de Zoon des mensen drie dagen en drie nachten in het hart van de aarde zijn.", "Luk 2:1-21": "En het gebeurde in diezelfde dagen, dat er een gebod uitging van de keizer Augustus, dat heel de wereld ingeschreven zou worden. Deze eerste inschrijving gebeurde toen Cyrenius over Syrië stadhouder was. En zij gingen allen om ingeschreven te worden, ieder naar zijn eigen stad.", "Hand 7:7": "En het volk dat zij zullen dienen, zal Ik oordelen, zei God; en daarna zullen zij uitgaan, en zij zullen Mij dienen op deze plaats.", "Jes 6:9": "Toen zei Hij: Ga heen, en zeg tegen dit volk: Blijf horen, maar begrijp het niet, en blijf zien, maar merk het niet op.", "1 Kron 19:6": "Toen de kinderen van Ammon zagen dat zij zich stinkend gemaakt hadden bij David, stuurden Hanun en de kinderen van Ammon duizend talenten van het zilver, om zich wagens en ruiters te huren uit Mesopotamië, en uit Syrië-Maächa, en uit Zoba;", "Hebr 4:3": "Want wij die geloofd hebben, gaan de rust in, zoals Hij gezegd heeft: Zo heb Ik dan in Mijn toorn gezworen: Zij zullen Mijn rust niet ingaan! Hoewel Zijn werken al vanaf de grondlegging van de wereld volbracht waren.", "1 Sam 13:20": "Daarom moest heel Israël naar de Filistijnen aftrekken, om ieder zijn ploegijzer, of zijn spade, of zijn bijl, of zijn houweel te laten scherpen.", "Zach 13:7": "Zwaard! Word wakker tegen Mijn Herder, en tegen de Man Die Mijn Metgezel is, spreekt de HEERE van de heerscharen; sla die Herder, en de schapen zullen verstrooid worden; maar Ik zal Mijn hand tot de kleinen wenden.", "2 Kron 21:7": "Doch de HEERE wilde het huis van David niet te gronde richten, omwille van het verbond dat Hij met David gesloten had; en zoals Hij gezegd had hem en zijn zonen voor altijd een lamp te zullen geven.", "Ef 4:25": "Daarom, leg de leugen af, en spreek de waarheid, ieder met zijn naaste; want wij zijn elkaars leden.", "Luk 7:27": "Deze is het, over wie geschreven is: Zie, Ik zend Mijn engel voor Uw aangezicht uit, die Uw weg voor U klaar zal maken.", "Ps 97:7": "Beschaamd moeten worden allen die de beelden dienen, die zich op afgoden beroemen; buig u neer voor Hem, alle goden!", "Rom 9:26": "En het zal zijn: op de plaats waar tot hen gezegd was: U bent Mijn volk niet, daar zullen zij kinderen van de levende God genoemd worden.", "Hos 12:15": "Efraïm daarentegen heeft Hem zeer bitter vertoornd; daarom zal Hij zijn bloed op hem laten komen, en zijn Heere zal hem zijn smaad vergelden.", "Mark 12:26": "Maar wat de doden betreft, dat zij opgewekt zullen worden: hebt u niet gelezen in het boek van Mozes, hoe God in de doornstruik tot hem gesproken heeft: Ik ben de God van Abraham, en de God van Izak, en de God van Jakob?", "Rom 3:3": "Want wat is het, al zijn sommigen ongelovig geweest? Zal hun ongeloof het geloof van God tenietdoen?", "Deut 21:23": "Dan zal zijn dode lichaam niet aan het hout overnachten; maar u zult hem beslist diezelfde dag begraven; want een opgehangene is door God vervloekt. Zo zult u uw land niet verontreinigen, dat de HEERE, uw God, u als erfdeel geeft.", "Ezech 33:21-29": "En het gebeurde in het twaalfde jaar van onze wegvoering, in de tiende maand, op de vijfde dag van de maand, dat er iemand tot mij kwam die uit Jeruzalem ontkomen was, en hij zei: De stad is ingenomen. Nu was de hand van de HEERE 's avonds op mij geweest, voordat wie ontkomen was kwam, en Hij had mijn mond geopend, totdat hij 's morgens tot mij kwam. Zo werd mijn mond geopend, en ik was niet meer stom. Toen kwam het woord van de HEERE tot mij:", "Hebr 1:13": "En tegen wie van de engelen heeft Hij ooit gezegd: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gezet heb?", "Ps 22:19": "Zij delen mijn kleren onder zich, en werpen het lot over mijn gewaad.", "2 Kron 33:11": "Daarom bracht de HEERE over hen de legeroversten van de koning van Assyrië, die Manasse gevangen namen tussen de doornen; en zij bonden hem met twee koperen ketenen, en voerden hem naar Babel.", "Jes 39:1": "In die tijd stuurde Merodach-Baladan, de zoon van Baladan, de koning van Babel, brieven en een geschenk aan Hizkia; want hij had gehoord dat hij ziek was geweest en weer sterk geworden was.", "Joh 8:52": "De Joden zeiden dan tegen Hem: Nu weten wij dat U de duivel hebt. Abraham is gestorven, en de profeten ook; en U zegt: Als iemand Mijn woord bewaart, zal hij de dood in eeuwigheid niet proeven?", "Jes 7:2-17": "Toen men het huis van David boodschapte en zei: De Syriërs liggen bij Efraïm, bewoog zijn hart zich, en het hart van zijn volk, zoals de bomen van het woud bewegen door de wind. En de HEERE zei tegen Jesaja: Ga nu uit, Achaz tegemoet, u en uw zoon, Schear-Jaschub, aan het einde van de watergang van de bovenste vijver, aan de hoge weg van het veld van de voller; En zeg tegen hem: Wees op uw hoede, en wees rustig, wees niet bang, en laat uw hart niet week worden vanwege die twee staarten van deze rokende vuurbranden, vanwege de ontsteking van de toorn van Rezin en van de Syriërs, en van de zoon van Remalia;", "2 Joh 1:1": "De oudste aan de uitverkoren vrouw en aan haar kinderen, die ik in waarheid liefheb, en niet alleen ik, maar ook allen die de waarheid gekend hebben;", "Lev 11:44": "Want Ik ben de HEERE, uw God; daarom zult u uzelf heiligen, en heilig zijn, omdat Ik heilig ben; en u zult uw ziel niet verontreinigen aan enig kruipend gedierte dat zich op de aarde beweegt.", "Joël 2:1-17": "Waait op de bazuin te Sion, en roept luide op de berg van Mijn heiligheid; laat alle inwoners van het land beroerd zijn, want de dag van de HEERE komt, want hij is nabij. Een dag van duisternis en donkerheid, een dag van wolken en dikke duisternis, als de dageraad uitgespreid over de bergen; een groot en machtig volk, zoals er van oude tijden af niet geweest is, en na hen niet meer zal zijn tot in jaren van vele geslachten. Voor hen verteert een vuur, en achter hen brandt een vlam; het land is voor hen als een lusthof, maar achter hen een woeste wildernis, en ook is er geen ontkomen aan hen.", "Jes 61:1": "De Geest van de Heere HEERE is op Mij, omdat de HEERE Mij gezalfd heeft, om een blijde boodschap te brengen aan de zachtmoedigen; Hij heeft Mij gezonden om te verbinden de gebrokenen van hart, om de gevangenen vrijheid uit te roepen, en de gebondenen opening van de gevangenis;", "Jer 6:11": "Daarom ben ik vol van de grimmigheid van de HEERE, ik ben moe geworden van inhouden; ik zal het uitstorten over de kinderen op de straat, en over de vergadering van de jongelingen samen; want zelfs de man met de vrouw zullen gevangen worden, de oude met hem, die vol is van dagen.", "Ps 102:25-28": "Ik zei: Mijn God! Neem mij niet weg in het midden van mijn dagen; Uw jaren zijn van geslacht tot geslacht. U hebt voormaals de aarde gegrond, en de hemelen zijn het werk van Uw handen; Die zullen vergaan, maar U zult staande blijven; en zij alle zullen als een kleed verouderen; U zult ze veranderen als een gewaad, en zij zullen veranderd zijn.", "Ps 104:4": "Hij maakt Zijn engelen geesten, Zijn dienaars tot een vlammend vuur.", "Ps 91:11": "Want Hij zal Zijn engelen aangaande u bevelen, dat zij u bewaren op al uw wegen.", "Gen 15:14": "Maar Ik zal ook het volk rechten dat zij zullen dienen; en daarna zullen zij uittrekken met veel bezit.", "Ezra 4:2": "kwamen zij naar Zerubbabel en naar de hoofden van de families toe en zeiden tegen hen: Laat ons met u bouwen, want wij zoeken uw God net als u; ook offeren wij aan Hem sinds de dagen van Esar-Haddon, de koning van Assur, die ons hierheen heeft laten optrekken.", "Rom 10:20": "En Jesaja durft het aan, en zegt: Ik ben gevonden door hen die Mij niet zochten; Ik ben openbaar geworden aan hen die naar Mij niet vroegen.", "Hos 5:3": "Ik ken Efraïm, en Israël is voor Mij niet verborgen; want nu, Efraïm, hoereert u, en Israël is verontreinigd.", "Jes 40:3-5": "Een stem van iemand die roept in de woestijn: Bereidt de weg van de HEERE, maakt recht in de wildernis een baan voor onze God! Alle dalen zullen verhoogd worden, en alle bergen en heuvels zullen vernederd worden; en wat krom is, dat zal recht, en wat hobbelig is, dat zal tot een vallei gemaakt worden. En de heerlijkheid van de HEERE zal geopenbaard worden; en alle vlees tegel =\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3147\">Jotham,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5818\">Uzziah,</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> that <span class=\"wl wl-kjv\" data-code=\"H7526\">Rezin</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H758\">Syria,</span> and <span class=\"wl wl-kjv\" data-code=\"H6492\">Pekah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H7425\">Remaliah,</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> toward <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> to <span class=\"wl wl-kjv\" data-code=\"H4421\">war</span> against it, but <span class=\"wl wl-kjv\" data-code=\"H3201\">could</span> not prevail", "2": "And it was <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H758\">Syria</span> is <span class=\"wl wl-kjv\" data-code=\"H5117\">confederate</span> with <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim.</span> And his <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> was <span class=\"wl wl-kjv\" data-code=\"H5128\">moved,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> of his <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> as the <span class=\"wl wl-kjv\" data-code=\"H6086\">trees</span> of the <span class=\"wl wl-kjv\" data-code=\"H3293\">wood</span> are <span class=\"wl wl-kjv\" data-code=\"H5128\">moved</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">with</span> the wind.", "3": "Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> unto <span class=\"wl wl-kjv\" data-code=\"H3470\">Isaiah,</span> Go <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> now to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> <span class=\"wl wl-kjv\" data-code=\"H271\">Ahaz,</span> thou, and <span class=\"wl wl-kjv\" data-code=\"H7610\">Shearjashub</span> thy <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> at the <span class=\"wl wl-kjv\" data-code=\"H7097\">end</span> of the <span class=\"wl wl-kjv\" data-code=\"H8585\">conduit</span> of the <span class=\"wl wl-kjv\" data-code=\"H5945\">upper</span> <span class=\"wl wl-kjv\" data-code=\"H1295\">pool</span> in the <span class=\"wl wl-kjv\" data-code=\"H4546\">highway</span> of the <span class=\"wl wl-kjv\" data-code=\"H3526\">fuller's</span> field;", "4": "And <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto him, Take <span class=\"wl wl-kjv\" data-code=\"H8104\">heed,</span> and be <span class=\"wl wl-kjv\" data-code=\"H8252\">quiet;</span> <span class=\"wl wl-kjv\" data-code=\"H3372\">fear</span> not, neither be <span class=\"wl wl-kjv\" data-code=\"H7401\">fainthearted</span> for the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H2180\">tails</span> of these <span class=\"wl wl-kjv\" data-code=\"H6226\">smoking</span> <span class=\"wl wl-kjv\" data-code=\"H181\">firebrands,</span> for the <span class=\"wl wl-kjv\" data-code=\"H2750\">fierce</span> <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> of <span class=\"wl wl-kjv\" data-code=\"H7526\">Rezin</span> with <span class=\"wl wl-kjv\" data-code=\"H758\">Syria,</span> and of the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of Remaliah.", "5": "Because <span class=\"wl wl-kjv\" data-code=\"H758\">Syria,</span> <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H7425\">Remaliah,</span> have taken <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"wl wl-kjv\" data-code=\"H3289\">counsel</span> against thee, saying,", "6": "Let us go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> against <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and <span class=\"wl wl-kjv\" data-code=\"H6973\">vex</span> it, and let us make a <span class=\"wl wl-kjv\" data-code=\"H1234\">breach</span> therein for us, and <span class=\"wl wl-kjv\" data-code=\"H4427\">set</span> a <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of it, even the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of Tabeal:", "7": "<span class=\"wl wl-kjv\" data-code=\"H3541\">Thus</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD,</span> It shall not stand,", "8": "For the <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> of <span class=\"wl wl-kjv\" data-code=\"H758\">Syria</span> is <span class=\"wl wl-kjv\" data-code=\"H1834\">Damascus,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> of <span class=\"wl wl-kjv\" data-code=\"H1834\">Damascus</span> is <span class=\"wl wl-kjv\" data-code=\"H7526\">Rezin;</span> and within <span class=\"wl wl-kjv\" data-code=\"H8346\">threescore</span> and <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> shall <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim</span> be <span class=\"wl wl-kjv\" data-code=\"H2865\">broken,</span> that it be not a people.", "9": "And the <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> of <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim</span> is <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> of <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria</span> is <span class=\"wl wl-kjv\" data-code=\"H7425\">Remaliah's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son.</span> If ye will not <span class=\"wl wl-kjv\" data-code=\"H539\">believe,</span> surely ye shall not be established.", "10": "Moreover the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> <span class=\"wl wl-kjv\" data-code=\"H3254\">again</span> unto <span class=\"wl wl-kjv\" data-code=\"H271\">Ahaz,</span> saying,", "11": "<span class=\"wl wl-kjv\" data-code=\"H7592\">Ask</span> thee a <span class=\"wl wl-kjv\" data-code=\"H226\">sign</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God;</span> <span class=\"wl wl-kjv\" data-code=\"H7592\">ask</span> it either in the <span class=\"wl wl-kjv\" data-code=\"H6009\">depth,</span> or in the <span class=\"wl wl-kjv\" data-code=\"H1361\">height</span> above.", "12": "But <span class=\"wl wl-kjv\" data-code=\"H271\">Ahaz</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will not <span class=\"wl wl-kjv\" data-code=\"H7592\">ask,</span> neither will I <span class=\"wl wl-kjv\" data-code=\"H5254\">tempt</span> the LORD.", "13": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">Hear</span> ye now, O <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David;</span> Is it a small <span class=\"wl wl-kjv\" data-code=\"H4592\">thing</span> for you to <span class=\"wl wl-kjv\" data-code=\"H3811\">weary</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men,</span> but will ye <span class=\"wl wl-kjv\" data-code=\"H3811\">weary</span> my God", "14": "Therefore the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> himself shall <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> you a <span class=\"wl wl-kjv\" data-code=\"H226\">sign;</span> Behold, a <span class=\"wl wl-kjv\" data-code=\"H5959\">virgin</span> shall <span class=\"wl wl-kjv\" data-code=\"H2030\">conceive,</span> and <span class=\"wl wl-kjv\" data-code=\"H3205\">bear</span> a <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> <span class=\"wl wl-kjv\" data-code=\"H410\">Immanuel.</span>", "15": "<span class=\"wl wl-kjv\" data-code=\"H2529\">Butter</span> and <span class=\"wl wl-kjv\" data-code=\"H1706\">honey</span> shall he <span class=\"wl wl-kjv\" data-code=\"H398\">eat,</span> that he may <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> to <span class=\"wl wl-kjv\" data-code=\"H3988\">refuse</span> the <span class=\"wl wl-kjv\" data-code=\"H7451\">evil,</span> and <span class=\"wl wl-kjv\" data-code=\"H977\">choose</span> the good.", "16": "For before the <span class=\"wl wl-kjv\" data-code=\"H5288\">child</span> shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> to <span class=\"wl wl-kjv\" data-code=\"H3988\">refuse</span> the <span class=\"wl wl-kjv\" data-code=\"H7451\">evil,</span> and <span class=\"wl wl-kjv\" data-code=\"H977\">choose</span> the <span class=\"wl wl-kjv\" data-code=\"H2896\">good,</span> the <span class=\"wl wl-kjv\" data-code=\"H127\">land</span> that thou <span class=\"wl wl-kjv\" data-code=\"H6973\">abhorrest</span> shall <span class=\"wl wl-kjv\" data-code=\"H6440\">be</span> <span class=\"wl wl-kjv\" data-code=\"H5800\">forsaken</span> of <span class=\"wl wl-kjv\" data-code=\"H8147\">both</span> her kings.", "17": "The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> upon thee, and upon thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and upon thy <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> that have not <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> from the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim</span> <span class=\"wl wl-kjv\" data-code=\"H5493\">departed</span> from <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah;</span> even the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of Assyria.", "18": "And it shall come to pass in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H8319\">hiss</span> for the <span class=\"wl wl-kjv\" data-code=\"H2070\">fly</span> that is in the uttermost <span class=\"wl wl-kjv\" data-code=\"H7097\">part</span> of the <span class=\"wl wl-kjv\" data-code=\"H2975\">rivers</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and for the <span class=\"wl wl-kjv\" data-code=\"H1682\">bee</span> that is in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of Assyria.", "19": "And they shall <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H5117\">rest</span> all of them in the <span class=\"wl wl-kjv\" data-code=\"H1327\">desolate</span> <span class=\"wl wl-kjv\" data-code=\"H5158\">valleys,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H5357\">holes</span> of the <span class=\"wl wl-kjv\" data-code=\"H5553\">rocks,</span> and upon all <span class=\"wl wl-kjv\" data-code=\"H5285\">thorns,</span> and upon all bushes.", "20": "In the same <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> shall the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H1548\">shave</span> with a <span class=\"wl wl-kjv\" data-code=\"H8593\">razor</span> that is <span class=\"wl wl-kjv\" data-code=\"H7917\">hired,</span> namely, by them <span class=\"wl wl-kjv\" data-code=\"H5676\">beyond</span> the <span class=\"wl wl-kjv\" data-code=\"H5104\">river,</span> by the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria,</span> the <span class=\"wl wl-kjv\" data-code=\"H7218\">head,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8181\">hair</span> of the <span class=\"wl wl-kjv\" data-code=\"H7272\">feet:</span> and it shall also <span class=\"wl wl-kjv\" data-code=\"H5595\">consume</span> the beard.", "21": "And it shall come to pass in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> that a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> shall <span class=\"wl wl-kjv\" data-code=\"H2421\">nourish</span> a <span class=\"wl wl-kjv\" data-code=\"H1241\">young</span> <span class=\"wl wl-kjv\" data-code=\"H5697\">cow,</span> and <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> sheep;", "22": "And it shall come to pass, for the <span class=\"wl wl-kjv\" data-code=\"H7230\">abundance</span> of <span class=\"wl wl-kjv\" data-code=\"H2461\">milk</span> that they shall <span class=\"wl wl-kjv\" data-code=\"H6213\">give</span> he shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> <span class=\"wl wl-kjv\" data-code=\"H2529\">butter:</span> for <span class=\"wl wl-kjv\" data-code=\"H2529\">butter</span> and <span class=\"wl wl-kjv\" data-code=\"H1706\">honey</span> shall every one <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> that is <span class=\"wl wl-kjv\" data-code=\"H3498\">left</span> <span class=\"wl wl-kjv\" data-code=\"H7130\">in</span> the land.", "23": "And it shall come to pass in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> that every <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> shall be, where there were a <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H1612\">vines</span> at a <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H3701\">silverlings,</span> it shall even be for <span class=\"wl wl-kjv\" data-code=\"H8068\">briers</span> and thorns.", "24": "With <span class=\"wl wl-kjv\" data-code=\"H2671\">arrows</span> and with <span class=\"wl wl-kjv\" data-code=\"H7198\">bows</span> shall men <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> thither; because all the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> shall become <span class=\"wl wl-kjv\" data-code=\"H8068\">briers</span> and thorns.", "25": "And on all <span class=\"wl wl-kjv\" data-code=\"H2022\">hills</span> that shall be <span class=\"wl wl-kjv\" data-code=\"H5737\">digged</span> with the <span class=\"wl wl-kjv\" data-code=\"H4576\">mattock,</span> there shall not come <span class=\"wl wl-kjv\" data-code=\"H935\">thither</span> the <span class=\"wl wl-kjv\" data-code=\"H3374\">fear</span> of <span class=\"wl wl-kjv\" data-code=\"H8068\">briers</span> and <span class=\"wl wl-kjv\" data-code=\"H7898\">thorns:</span> but it shall be for the sending <span class=\"wl wl-kjv\" data-code=\"H4916\">forth</span> of <span class=\"wl wl-kjv\" data-code=\"H7794\">oxen,</span> and for the <span class=\"wl wl-kjv\" data-code=\"H4823\">treading</span> of lesser cattle."}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen bij dit vers.</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
