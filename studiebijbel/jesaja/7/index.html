ten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Het gebeurde nu in de dagen van Achaz, de zoon van Jotham, de zoon van Uzzia, de koning van Juda, dat Rezin, de koning van Syrië, en Pekah, de zoon van Remalia, de koning van Israël, optrokken naar Jeruzalem, ten oorlog tegen haar; maar hij kon met strijden niet tegen haar op.","2":"Toen men het huis van David boodschapte en zei: De Syriërs liggen bij Efraïm, bewoog zijn hart zich, en het hart van zijn volk, zoals de bomen van het woud bewegen door de wind.","3":"En de HEERE zei tegen Jesaja: Ga nu uit, Achaz tegemoet, u en uw zoon, Schear-Jaschub, aan het einde van de watergang van de bovenste vijver, aan de hoge weg van het veld van de voller;","4":"En zeg tegen hem: Wees op uw hoede, en wees rustig, wees niet bang, en laat uw hart niet week worden vanwege die twee staarten van deze rokende vuurbranden, vanwege de ontsteking van de toorn van Rezin en van de Syriërs, en van de zoon van Remalia;","5":"Omdat de Syriër kwaad tegen u beraadslaagd heeft, samen met Efraïm en de zoon van Remalia, en gezegd heeft:","6":"Laten wij optrekken tegen Juda, en het schrik aanjagen, en het onder ons verdelen, en de zoon van Tabeal koning maken in hun midden.","7":"Zo zegt de Heere HEERE: Het zal niet standhouden, en het zal niet gebeuren.","8":"Maar Damaskus zal het hoofd van Syrië zijn, en Rezin het hoofd van Damaskus; en over nog vijfenzestig jaar zal Efraïm verbroken worden, zodat het geen volk meer is.","9":"Ondertussen zal Samaria het hoofd van Efraïm zijn, en de zoon van Remalia het hoofd van Samaria. Als u niet gelooft, zult u zeker niet standhouden.","10":"En de HEERE ging verder met spreken tegen Achaz, en zei:","11":"Vraag u een teken van de HEERE, uw God; vraag het beneden in de diepte, of vraag het boven in de hoogte.","12":"Doch Achaz zei: Ik zal het niet vragen, en ik zal de HEERE niet op de proef stellen.","13":"Toen zei hij: Hoor toch, u, huis van David! Is het u te weinig, dat u de mensen moe maakt, dat u ook mijn God moe maakt?","14":"Daarom zal de Heere Zelf u een teken geven; zie, een maagd zal zwanger worden, en zij zal een Zoon baren, en Zijn naam Immanuel noemen.","15":"Boter en honing zal Hij eten, totdat Hij weet het kwade te verwerpen en het goede te verkiezen.","16":"Zeker, voordat dit Knechtje weet het kwade te verwerpen en het goede te verkiezen, zal dat land, waarvoor u zo bang bent, verlaten zijn door zijn twee koningen.","17":"Maar de HEERE zal over u, en over uw volk, en over het huis van uw vader, dagen doen komen, wat voor dagen niet gekomen zijn vanaf de dag dat Efraïm van Juda is afgeweken, door de koning van Assyrië.","18":"Want het zal op die dag gebeuren, dat de HEERE zal fluiten naar de vliegen, die aan het einde van de rivieren van Egypte zijn, en naar de bijen die in het land van Assyrië zijn.","19":"En zij zullen komen, en zij zullen allemaal neerstrijken in de woeste dalen, en in de kloven van de rotsen, en op alle doornhagen, en op alle geprezen* plaatsen.","20":"Op die dag zal de Heere door een gehuurd scheermes, dat aan de andere kant van de rivier is, door de koning van Assyrië, het hoofd afscheren, en het haar van de voeten; ja, het zal ook de baard helemaal wegnemen.","21":"En het zal op die dag gebeuren, dat iemand een koetje in leven zal houden, en twee schapen;","22":"En het zal gebeuren, dat hij vanwege de overvloed van de melk, die zij geven zullen, boter zal eten; ja, ieder die overgebleven is in het midden van het land, die zal boter en honing eten.","23":"Ook zal het op diezelfde dag gebeuren, dat iedere plaats waar duizend wijnstokken waren, elk duizend zilverstukken waard, met doorns en distels bedekt zal zijn;","24":"Zodat men met pijl en boog daar zal moeten gaan; want het hele land zal doorns en distels zijn.","25":"Ook op al de bergen die men met houwelen placht om te bewerken, daar zal men niet meer komen uit vrees voor de doorns en de distels; maar die zullen dienen om de os op los te laten, en voor het vertrappen door het kleinvee."},"SV":{"1":"Het geschiedde nu in de dagen van Achaz, den zoon van Jotham, den zoon van Uzzia, den koning van Juda, dat Rezin, de koning van Syrië, en Pekah, de zoon van Remalia, de koning van Israël, optoog naar Jeruzalem, ten oorlog tegen haar; maar hij vermocht met strijden niet tegen haar.","2":"Als men den huize Davids boodschapte, zeggende: De Syriërs rusten op Efraïm, zo bewoog zich zijn hart en het hart zijns volks, gelijk de bomen des wouds bewogen worden van den wind.","3":"En de HEERE zeide tot Jesaja: Ga nu uit, Achaz tegemoet, gij en uw zoon, Schear-jaschub, aan het einde van den watergang des oppersten vijvers, aan den hogen weg van het veld des vollers;","4":"En zeg tot hem: Wacht u, en zijt gerust, vrees niet, en uw hart worde niet week, vanwege die twee staarten dezer rokende vuurbranden; vanwege de ontsteking des toorns van Rezin en der Syriërs, en van den zoon van Remalia;","5":"Omdat de Syriër kwaad tegen u beraadslaagd heeft, *met* Efraïm en den zoon van Remalia, zeggende:","6":"Laat ons optrekken tegen Juda, en het verdriet aandoen, en het onder ons delen, en den zoon van Tabeal koning maken in het midden van hen.","7":"Alzo zegt de Heere HEERE: Het zal niet bestaan, en het zal niet geschieden.","8":"Maar Damaskus zal het hoofd van Syrië zijn, en Rezin het hoofd van Damaskus; en in nog vijf en zestig jaren zal Efraïm verbroken worden, dat het geen volk zij.","9":"Ondertussen zal Samaria Efraïms hoofd zijn, en de zoon van Remalia het hoofd van Samaria. Indien gijlieden niet gelooft, zekerlijk, gij zult niet bevestigd worden.","10":"En de HEERE voer voort te spreken tot Achaz, zeggende:","11":"Eis u een teken van den HEERE, uw God; eis beneden in de diepte, of eis boven uit de hoogte.","12":"Doch Achaz zeide: Ik zal het niet eisen, en ik zal den HEERE niet verzoeken.","13":"Toen zeide hij: Hoort gijlieden nu, gij, huis van David! is het ulieden te weinig, dat gij de mensen moede maakt, dat gij ook mijn God moede maakt?","14":"Daarom zal de Heere Zelf ulieden een teken geven; ziet, een maagd zal zwanger worden, en zij zal een Zoon baren, en Zijn naam IMMANUEL heten.","15":"Boter en honig zal Hij eten, totdat Hij wete te verwerpen het kwade, en te verkiezen het goede.","16":"Zekerlijk, eer dit Knechtje weet te verwerpen het kwade, en te verkiezen het goede, zal dat land, waarover gij verdrietig zijt, verlaten zijn van zijn twee koningen.","17":"*Doch* de HEERE zal over u, en over uw volk, en over uws vaders huis, dagen doen komen, hoedanige niet gekomen zijn van dien dag af, dat Efraïm van Juda is afgeweken, *door* den koning van Assyrië.","18":"Want het zal te dien dage geschieden, dat de HEERE zal toesissen de vliegen, die aan het einde der rivieren van Egypte zijn, en de bijen die in het land van Assur zijn.","19":"En zij zullen komen, en zij allen zullen rusten in de woeste dalen, en in de kloven der steenrotsen, en in al de doornhagen, en in alle geprezene plaatsen.","20":"Te dien dage zal de Heere door een gehuurd scheermes, *hetwelk* aan gene zijde der rivier is, door den koning van Assyrië, afscheren het hoofd, en het haar der voeten; ja, het zal ook den baard gans wegnemen.","21":"En het zal geschieden te dien dage, dat iemand een koetje in het leven zal behouden hebben, en twee schapen;","22":"En het zal geschieden, dat hij vanwege de veelheid der melk, die zij geven zullen, boter zal eten; ja, een ieder, die overgebleven zal zijn in het midden des lands, die zal boter en honig eten.","23":"Ook zal het te dienzelfden dage geschieden, dat iedere plaats, alwaar duizend wijnstokken geweest zijn, van duizend zilverlingen, tot doornen en distelen zal zijn;","24":"Dat men met pijlen en met den boog aldaar zal moeten gaan; want het ganse land zal doornen en distelen zijn.","25":"Ook al de bergen, die men met houwelen pleegt om te hakken, daar zal men niet komen *uit* vrees der doornen en der distelen; maar die zullen wezen tot inzending van den os, en tot vertreding van het kleinvee."},"KJV":{"1":"And it came to pass in the days of Ahaz the son of Jotham, the son of Uzziah, king of Judah, *that* Rezin the king of Syria, and Pekah the son of Remaliah, king of Israel, went up toward Jerusalem to war against it, but could not prevail","2":"And it was told the house of David, saying, Syria is confederate with Ephraim. And his heart was moved, and the heart of his people, as the trees of the wood are moved with the wind.","3":"Then said the LORD unto Isaiah, Go forth now to meet Ahaz, thou, and Shearjashub thy son, at the end of the conduit of the upper pool in the highway of the fuller's field;","4":"And say unto him, Take heed, and be quiet; fear not, neither be fainthearted for the two tails of these smoking firebrands, for the fierce anger of Rezin with Syria, and of the son of Remaliah.","5":"Because Syria, Ephraim, and the son of Remaliah, have taken evil counsel against thee, saying,","6":"Let us go up against Judah, and vex it, and let us make a breach therein for us, and set a king in the midst of it, *even* the son of Tabeal:","7":"Thus saith the Lord GOD, It shall not stand,","8":"For the head of Syria *is* Damascus, and the head of Damascus *is* Rezin; and within threescore and five years shall Ephraim be broken, that it be not a people.","9":"And the head of Ephraim *is* Samaria, and the head of Samaria *is* Remaliah's son. If ye will not believe, surely ye shall not be established.","10":"Moreover the LORD spake again unto Ahaz, saying,","11":"Ask thee a sign of the LORD thy God; ask it either in the depth, or in the height above.","12":"But Ahaz said, I will not ask, neither will I tempt the LORD.","13":"And he said, Hear ye now, O house of David; *Is it* a small thing for you to weary men, but will ye weary my God","14":"Therefore the Lord himself shall give you a sign; Behold, a virgin shall conceive, and bear a son, and shall call his name Immanuel.","15":"Butter and honey shall he eat, that he may know to refuse the evil, and choose the good.","16":"For before the child shall know to refuse the evil, and choose the good, the land that thou abhorrest shall be forsaken of both her kings.","17":"The LORD shall bring upon thee, and upon thy people, and upon thy father's house, days that have not come, from the day that Ephraim departed from Judah; *even* the king of Assyria.","18":"And it shall come to pass in that day, *that* the LORD shall hiss for the fly that *is* in the uttermost part of the rivers of Egypt, and for the bee that *is* in the land of Assyria.","19":"And they shall come, and shall rest all of them in the desolate valleys, and in the holes of the rocks, and upon all thorns, and upon all bushes.","20":"In the same day shall the Lord shave with a razor that is hired, *namely*, by them beyond the river, by the king of Assyria, the head, and the hair of the feet: and it shall also consume the beard.","21":"And it shall come to pass in that day, *that* a man shall nourish a young cow, and two sheep;","22":"And it shall come to pass, for the abundance of milk *that* they shall give he shall eat butter: for butter and honey shall every one eat that is left in the land.","23":"And it shall come to pass in that day, *that* every place shall be, where there were a thousand vines at a thousand silverlings, it shall *even* be for briers and thorns.","24":"With arrows and with bows shall *men* come thither; because all the land shall become briers and thorns.","25":"And *on* all hills that shall be digged with the mattock, there shall not come thither the fear of briers and thorns: but it shall be for the sending forth of oxen, and for the treading of lesser cattle."}},"tsk":{"1":[{"kopje":"de dagen","refs":["2 Kon 16:1","2 Kron 28:1-6"]},{"kopje":"Rezin","refs":["Jes 8:6","2 Kon 15:37","Ps 83:4-6"]},{"kopje":"maar hij kon","refs":["Jes 7:4-9","Jes 8:9","Jes 8:10"]}],"2":[{"kopje":"het huis","refs":["Jes 7:13","Jes 6:13","Jes 37:35","2 Sam 7:16","1 Kon 11:32","1 Kon 12:16","1 Kon 13:2","Jer 21:12"]},{"kopje":"liggen bij","refs":["Jes 7:17","Jes 11:13","2 Kron 25:10","2 Kron 28:12","Ezech 37:16-19","Hos 12:2"]},{"kopje":"bewoog zijn hart","refs":["Jes 8:12","Jes 37:27","Lev 26:36","Lev 26:37","Num 14:1-3","Deut 28:65","Deut 28:66","2 Kon 7:6","2 Kon 7:7","Ps 11:1","Ps 27:1","Ps 27:2","Ps 112:7","Ps 112:8","Spr 28:1","Matt 2:3"]}],"3":[{"kopje":"Ga nu uit","refs":["Ex 7:15","Jer 19:2","Jer 19:3","Jer 22:1"]},{"kopje":"Schear-Jaschub","refs":["Jes 6:13","Jes 10:21","Jes 55:7","Rom 9:27"]},{"kopje":"het einde","refs":["Jes 36:2","2 Kon 18:17","2 Kon 20:20"]}],"4":[{"kopje":"Wees op uw hoede","refs":["Jes 30:7","Jes 30:15","Ex 14:13","Ex 14:14","2 Kron 20:17","Klaagl 3:26"]},{"kopje":"wees niet bang","refs":["Jes 8:11-14","Jes 35:4","Jes 41:14","Jes 51:12","Jes 51:13","Matt 10:28","Matt 24:6"]},{"kopje":"laat uw hart niet week worden","refs":["Deut 20:3","1 Sam 17:32"]},{"kopje":"die twee staarten","refs":["Jes 7:8","Jes 8:4","2 Kon 15:29","2 Kon 15:30","Amos 4:11"]}],"5":[{"kopje":"de Syriër","refs":["Ps 2:2","Ps 83:4","Ps 83:5","Nahum 1:11","Zach 1:15"]}],"8":[{"kopje":"het hoofd","refs":["Jes 7:9","2 Sam 8:6"]},{"kopje":"over nog","refs":["Jes 8:4","Jes 17:1-3","2 Kon 17:5-23","Ezra 4:2"]},{"kopje":"zodat het geen volk meer is","refs":["Hos 1:6-10"]}],"9":[{"kopje":"het hoofd","refs":["1 Kon 16:24-29","2 Kon 15:27"]},{"kopje":"Als u niet gelooft","refs":["2 Kron 20:20","Hand 27:11","Hand 27:25","Rom 11:20","Hebr 11:6","1 Joh 5:10"]}],"10":[{"kopje":"verder","refs":["Jes 1:5","Jes 1:13","Jes 8:5","Jes 10:20","Hos 13:2"]}],"11":[{"kopje":"een teken","refs":["Jes 37:30","Jes 38:7","Jes 38:8","Jes 38:22","Richt 6:36-40","2 Kon 20:8 ass=\"wl wl-kjv\" data-code=\"H8085\">Hear</span> ye now, O <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David;</span> Is it a small <span class=\"wl wl-kjv\" data-code=\"H4592\">thing</span> for you to <span class=\"wl wl-kjv\" data-code=\"H3811\">weary</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men,</span> but will ye <span class=\"wl wl-kjv\" data-code=\"H3811\">weary</span> my God","14":"Therefore the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> himself shall <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> you a <span class=\"wl wl-kjv\" data-code=\"H226\">sign;</span> Behold, a <span class=\"wl wl-kjv\" data-code=\"H5959\">virgin</span> shall <span class=\"wl wl-kjv\" data-code=\"H2030\">conceive,</span> and <span class=\"wl wl-kjv\" data-code=\"H3205\">bear</span> a <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> <span class=\"wl wl-kjv\" data-code=\"H410\">Immanuel.</span>","15":"<span class=\"wl wl-kjv\" data-code=\"H2529\">Butter</span> and <span class=\"wl wl-kjv\" data-code=\"H1706\">honey</span> shall he <span class=\"wl wl-kjv\" data-code=\"H398\">eat,</span> that he may <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> to <span class=\"wl wl-kjv\" data-code=\"H3988\">refuse</span> the <span class=\"wl wl-kjv\" data-code=\"H7451\">evil,</span> and <span class=\"wl wl-kjv\" data-code=\"H977\">choose</span> the good.","16":"For before the <span class=\"wl wl-kjv\" data-code=\"H5288\">child</span> shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> to <span class=\"wl wl-kjv\" data-code=\"H3988\">refuse</span> the <span class=\"wl wl-kjv\" data-code=\"H7451\">evil,</span> and <span class=\"wl wl-kjv\" data-code=\"H977\">choose</span> the <span class=\"wl wl-kjv\" data-code=\"H2896\">good,</span> the <span class=\"wl wl-kjv\" data-code=\"H127\">land</span> that thou <span class=\"wl wl-kjv\" data-code=\"H6973\">abhorrest</span> shall <span class=\"wl wl-kjv\" data-code=\"H6440\">be</span> <span class=\"wl wl-kjv\" data-code=\"H5800\">forsaken</span> of <span class=\"wl wl-kjv\" data-code=\"H8147\">both</span> her kings.","17":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> upon thee, and upon thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and upon thy <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> that have not <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> from the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim</span> <span class=\"wl wl-kjv\" data-code=\"H5493\">departed</span> from <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah;</span> even the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of Assyria.","18":"And it shall come to pass in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H8319\">hiss</span> for the <span class=\"wl wl-kjv\" data-code=\"H2070\">fly</span> that is in the uttermost <span class=\"wl wl-kjv\" data-code=\"H7097\">part</span> of the <span class=\"wl wl-kjv\" data-code=\"H2975\">rivers</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and for the <span class=\"wl wl-kjv\" data-code=\"H1682\">bee</span> that is in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of Assyria.","19":"And they shall <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H5117\">rest</span> all of them in the <span class=\"wl wl-kjv\" data-code=\"H1327\">desolate</span> <span class=\"wl wl-kjv\" data-code=\"H5158\">valleys,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H5357\">holes</span> of the <span class=\"wl wl-kjv\" data-code=\"H5553\">rocks,</span> and upon all <span class=\"wl wl-kjv\" data-code=\"H5285\">thorns,</span> and upon all bushes.","20":"In the same <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> shall the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H1548\">shave</span> with a <span class=\"wl wl-kjv\" data-code=\"H8593\">razor</span> that is <span class=\"wl wl-kjv\" data-code=\"H7917\">hired,</span> namely, by them <span class=\"wl wl-kjv\" data-code=\"H5676\">beyond</span> the <span class=\"wl wl-kjv\" data-code=\"H5104\">river,</span> by the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria,</span> the <span class=\"wl wl-kjv\" data-code=\"H7218\">head,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8181\">hair</span> of the <span class=\"wl wl-kjv\" data-code=\"H7272\">feet:</span> and it shall also <span class=\"wl wl-kjv\" data-code=\"H5595\">consume</span> the beard.","21":"And it shall come to pass in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> that a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> shall <span class=\"wl wl-kjv\" data-code=\"H2421\">nourish</span> a <span class=\"wl wl-kjv\" data-code=\"H1241\">young</span> <span class=\"wl wl-kjv\" data-code=\"H5697\">cow,</span> and <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> sheep;","22":"And it shall come to pass, for the <span class=\"wl wl-kjv\" data-code=\"H7230\">abundance</span> of <span class=\"wl wl-kjv\" data-code=\"H2461\">milk</span> that they shall <span class=\"wl wl-kjv\" data-code=\"H6213\">give</span> he shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> <span class=\"wl wl-kjv\" data-code=\"H2529\">butter:</span> for <span class=\"wl wl-kjv\" data-code=\"H2529\">butter</span> and <span class=\"wl wl-kjv\" data-code=\"H1706\">honey</span> shall every one <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> that is <span class=\"wl wl-kjv\" data-code=\"H3498\">left</span> <span class=\"wl wl-kjv\" data-code=\"H7130\">in</span> the land.","23":"And it shall come to pass in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> that every <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> shall be, where there were a <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H1612\">vines</span> at a <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H3701\">silverlings,</span> it shall even be for <span class=\"wl wl-kjv\" data-code=\"H8068\">briers</span> and thorns.","24":"With <span class=\"wl wl-kjv\" data-code=\"H2671\">arrows</span> and with <span class=\"wl wl-kjv\" data-code=\"H7198\">bows</span> shall men <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> thither; because all the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> shall become <span class=\"wl wl-kjv\" data-code=\"H8068\">briers</span> and thorns.","25":"And on all <span class=\"wl wl-kjv\" data-code=\"H2022\">hills</span> that shall be <span class=\"wl wl-kjv\" data-code=\"H5737\">digged</span> with the <span class=\"wl wl-kjv\" data-code=\"H4576\">mattock,</span> there shall not come <span class=\"wl wl-kjv\" data-code=\"H935\">thither</span> the <span class=\"wl wl-kjv\" data-code=\"H3374\">fear</span> of <span class=\"wl wl-kjv\" data-code=\"H8068\">briers</span> and <span class=\"wl wl-kjv\" data-code=\"H7898\">thorns:</span> but it shall be for the sending <span class=\"wl wl-kjv\" data-code=\"H4916\">forth</span> of <span class=\"wl wl-kjv\" data-code=\"H7794\">oxen,</span> and for the <span class=\"wl wl-kjv\" data-code=\"H4823\">treading</span> of lesser cattle."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"den zoon van Jotham . . . den zoon van Uzzia","tekst":"Dat is, welke Jotham was de zoon van Uzzia."},{"catchword":"den koning van Juda,","tekst":"Dit ziet op Achaz."},{"catchword":"Syrië,","tekst":"Hebreeuws, Aram; die een van de zonen van Sem geweest is, Gen 10:22 . Uit hem zijn de Syriërs gesproten."},{"catchword":"Pekah,","tekst":"Hij is een goddeloos afgodendienaar geweest, die zijnen koning Pekaja heeft omgebracht; 2Ki 15:25 , 2Ki 15:28 ."},{"catchword":"hij vermocht","tekst":"Te weten de koning van Syrië, die den krijg voerde, en den koning van Israël te hulp gekomen was, en, naar sommiger gevoelen, hoofdaanlegger van dezen krijg was, alhoewel het den naam had dat hij den koning van Israël te hulp kwam."}],"2":[{"catchword":"den huize Davids","tekst":"Dat is, den koning Achaz en den voornaamsten heren van het rijk; of zijnen bloedverwanten."},{"catchword":"De Syriërs","tekst":"Dat is, de Syriërs verlaten zich op de hulp der Efraïmieten; zij zijn het eens geworden om gelijkerhand u te overvallen. Hebreeuws, Aram; dat is Syrië rust op, enz."},{"catchword":"op Efraïm,","tekst":"Dat is, op de tien stammen der Israëlieten. Gelijk Psa 78:9 , en Psa 80:3 , en onder vs.17; onder welke de stam van Efraïm de voornaamste was, bij welken ook de koningen van Israël hun hof hielden, te weten binnen Samaria."},{"catchword":"zijn hart en het hart","tekst":"Te weten het hart van den koning Achaz. Deze vrees is gesproten uit een kwade conscientie, ongeloof en misvertrouwen."}],"3":[{"catchword":"Achaz tegemoet,","tekst":"Daarom wordt de profeet eigenlijk tot Achaz gezonden, omdat hij inzonderheid bevreesd was en omdat dit den welstand van het rijk betrof."},{"catchword":"Schear-Jaschub,","tekst":"Dit is te zeggen: Het overblijfsel zal wederkeren; te weten uit een algemenen ondergang of gevangenschap; of zal zich bekeren. Hieruit blijkt dat dezen zoon, uit Gods bevel, dien naam gegeven is; profetischer wijze, om het volk de belofte van God in gedachtenis te brengen, aangaande de wederkering van enigen uit het volk. Zie onder Isa 10:21 , en vergelijk onder Isa 8:3 , en Hos 1:4 , Hos 1:6 , Hos 1:9 ."},{"catchword":"het einde","tekst":"Zie van de rest van vs.3 de aantekening 2Ki 18:17 ."}],"4":[{"catchword":"Wacht u,","tekst":"Te weten van te vrezen."},{"catchword":"die twee staarten","tekst":"Aldus noemt de profeet verachtzaamlijk den koning van Syrië en den koning van Israël, en hij geeft te kennen dat hun toorn [die als een brandend vuur scheen te zijn en alsof zij de gehele wereld zouden in brand gebracht hebben] weinig te achten was en haast vergaan of gene kracht meer hebben zou, hen vergelijkende bij een hout, dat schier verbrand was en weinig of geen vuur meer had, maar alleenlijk nog rook van zich gaf. De koning van Syrië was bijna uitgebrand, of ten onder gebracht door Joas, den zoon van Joahas; 2Ki 13:25 . De koning van Israël was schier teniet gekomen door inlandse muiterij en krijg, 2Ki 15:10 , 2Ki 15:14 , 2Ki 15:16 , en zij beiden door Pul, den koning van Assyrië, 2Ki 15:19 , en 1Ch 5:26 ."},{"catchword":"van den zoon van Remália;","tekst":"De profeet verwaardigt zich niet hem bij zijnen naam te noemen, of den titel van koning te geven, bedoelende nochtans Pekah, den koning van Israël, zoon van Remalia."}],"5":[{"catchword":"de Syriër","tekst":"Aldus noemt de profeet verachtelijk Rezin, den koning van Syrië."},{"catchword":"met Efraïm","tekst":"Dat is, met de tien stammen van Israël."}],"6":[{"catchword":"tegen Juda,","tekst":"Te weten tot in het land Juda."},{"catchword":"het verdriet aandoen,","tekst":"Te weten door de lange belegering der stad Jeruzalem, alzo dat zij genoodzaakt worden zich eindelijk in onze handen over te geven. Anders: verdrietig maken, of moede maken."},{"catchword":"en het onder ons","tekst":"Zij geven te kennen dat hun voornemen was het land van Juda in tweeën te scheuren en onder hen beiden te delen, en in hun beider naam den zoon van Tabeal daarin stadhouder te maken."},{"catchword":"Tábeal","tekst":"Wie deze Tabeal of zijn zoon geweest is, is onzeker; het is gelooflijk dat hij een Syriër van voortreffelijken huize en een vermaard krijgsman geweest is."}],"7":[{"catchword":"Het zal niet bestaan,","tekst":"Te weten het kwaad, dat die beide koningen voorhebben. Het zal niet in het werk gesteld worden. Zie Job 22:28 , gelijke manier van spreken."}],"8":[{"catchword":"Damaskus","tekst":"Dat is, Damaskus zal de hoofdstad des koninkrijks van Syrië zijn."},{"catchword":"Rezin","tekst":"De zin is: Rezin zal hoofd of regent zijn en blijven alleen te Damaskus, maar niet te Jeruzalem, gelijk hij en zijne bondgenoten zich inbeelden; hun voornemen zal niet gelukken, elkeen zal binnen de bepaling zijns lands blijven."},{"catchword":"zal Efraïm","tekst":"Dat is, zij zullen geen eigen koninkrijk, noch staat, of landsregering op hun eigen hand meer hebben, zover is het vandaar, dat zij hun rijk zouden vermeerderen met den aanwas van het land van Juda of enig deel daarvan. Deze verwoesting is ten dele geschied door Salmanasser, 2Ki 17:3 , maar ten volle door Esar haddon , 2Ki 17:24 , den zoon van Sanherib, 2Ki 19:37 ."}],"9":[{"catchword":"zal Samaria","tekst":"Dat is, Samaria zal de hoofdstad zijn van Efraïm, dat is van het koninkrijk der tien stammen, en die daarin het opperste gebied heeft, is Pekah de zoon van Remalia."},{"catchword":"het hoofd van Samaria","tekst":"Dat is, koning of regent."},{"catchword":"Indien gijlieden","tekst":"De zin is: Indien gijlieden de belofte Gods, die ik u verkondigd heb, te weten dat deze twee koningen u niet zullen overweldigen, niet gelooft, zo zult gij niet bevestigd worden, of gij kunt gene verzekering hebben tegen de grote vrees, die gij hebt vanwege uwe vijanden, maar gij zult altijd ongerust van harte zijn. Anders: indien gijlieden [dit] niet gelooft, dat geschiedt [daarom] omdat gij niet vast zijt; te weten in het geloof. Anders: gelooft gijlieden [dit] niet, omdat gij niet verzekerd noch in uw geloof versterkt wordt; te weten door een teken of mirakel?"}],"10":[{"catchword":"En de HEERE","tekst":"Anders, daarom."},{"catchword":"te spreken","tekst":"Te weten door mij, zijn profeet, omdat hij zag dat Achaz deze belofte geen geloof gaf, noch ook zijn volk, hetwelk genoegzaam bleek aan hun sidderen en beven."}],"11":[{"catchword":"u","tekst":"Dat is, tot uw best, namelijk tot versterking van uw geloof in hetgeen u straks beloofd is."},{"catchword":"een teken","tekst":"Waaruit gij kunt vernemen dat God een profeet tot u gezonden heeft, die de waarheid spreekt."},{"catchword":"eis beneden","tekst":"Dat is, bid dat God u een wonderteken geve, òf op de aarde, òf aan den hemel. Hebreeuws, maak den eis diep, of maak [hem] hoog naar boven."}],"12":[{"catchword":"Ik zal het niet","tekst":"Te weten een teken van den Heere."},{"catchword":"ik zal den HEERE","tekst":"Dit spreekt Achaz op huichelachtige wijze, als een huichelaar, kwanswijs ik wil niets doen tegen Gods gebod, Deu 6:16 , opdat ik God niet vertoorne. God verbiedt dat men uit ongeloof of met een kwaad voornemen een teken van Hem verzoeken zal; maar Hij verbiedt niet dat men uit gehoorzaamheid en naar Gods bijzonder bevel, tot versterking van het geloof een teken begere. Zie de aantekening Deu 6:16 ."}],"13":[{"catchword":"hij","tekst":"Te weten de profeet Jesaja."},{"catchword":"gij, huis van David","tekst":"Te weten gijlieden, die ontaard zijt, niet volgende de godzalige voetstappen van David. Hieruit is af te nemen dat de naasten bij den koning Achaz zowel ongelovigen waren, en het teken zowel verwierpen als hijzelf."},{"catchword":"is het ulieden","tekst":"De zin is: Totnogtoe hebt gij mij en andere profeten des Heeren klein geacht, ja veracht, onze vermaningen niet gelovende noch aannemende; maar nu zijt gij God den Heere zelfs lastig of moeilijk, dewijl gij de genade, die Hij u aanbiedt, veracht."}],"14":[{"catchword":"Daarom","tekst":"Te weten dewijl gijlieden het aangeboden teken versmaadt en evenwel de gelovige versterking in het geloof van node hebt; zo zal God een wonderlijk teken geven."},{"catchword":"Ziet,","tekst":"Dit wordt vermaant tot naarstige opmerking van hetgeen er gezegd zal worden, en dit is de zin: God zal zekerlijk de belofte van het zenden van zijnen Zoon, die in de volheid des tijds, uit den stam van Juda, van ene maagd zal geboren worden, volbrengen; daarom zal Hij ook die belofte nog veel meer kunnen en willen voltrekken, die Hij doet, belangende de verlossing uit de handen en macht der vijanden; die gaat de geestelijke en eeuwige verlossing aan, deze alleen de lichamelijke en tijdelijke verlossing."},{"catchword":"een maagd","tekst":"Of, die maagd."},{"catchword":"Zijn naam","tekst":"Anders: gij [o maagd] zult zijnen naam Immanuel heten; hiermede beduidende dat Christus naar het vlees geen vader hebben zou, die hem den naam geven zou, gelijk de vaders hunnen kinderen plegen te doen; Luk 1:63 ."},{"catchword":"IMMANUËL heten","tekst":"Dat is, God met ons, waar God en waar mens, die de mensen weder met God verzoenen, ja als verenigen zal."}],"15":[{"catchword":"Hij eten,","tekst":"Te weten, de zoon der maagd. De zin is: Hij zal opgevoed worden in zijne kinderjaren gelijk andere kinderen, opdat men zie en daaruit merke dat Hij van dezelfde natuur is, waarvan andere kinderen zijn."},{"catchword":"totdat Hij","tekst":"Dat is, totdat Hij kome tot de jaren van zijn verstand en des onderscheids, dat Hij het goede van het kwade wete te onderscheiden."}],"16":[{"catchword":"eer dit Knechtje","tekst":"Deze woorden zijn, naar veler gevoelen, geen gevolg van de naastvoorgaande woorden, sprekende van de menschwording des Zoons Gods, maar de profeet spreekt hier weder van de verlossing, die hij Achaz beloofd heeft, aangaande de bescherming der Israëlieten tegen hunne vijanden. En door het jonge knechtje kan men hier verstaan des profeten zoontje Schear-Jaschub, hetwelk hij op bevel van God met zich genomen had, vs.3; of enig ander kind, alrede geboren, of korts geboren te worden; want op Christus kunnen deze woorden niet zo wel passen; de profeet hier sprekende van een korten tijd, in welken die beide koningen zouden omkomen, daar Christus eerst vele jaren hierna geboren en in deze wereld verschenen is. Sommigen nochtans duiden dit vs. ook op den Heere Christus, in zulken zin, dat deze profetie in zo korten tijd zou vervuld worden, als er zou wezen tussen de geboorte van Christus en de jaren zijns onderscheids."},{"catchword":"zal","tekst":"De zin is: Die twee koningen zullen niet alleen het land van Juda niet innemen, maar zij zullen binnen kort zelf omkomen."},{"catchword":"dat land,","tekst":"Te weten het land van Israël en van Syrië, vanwaar den koning Achaz alle ellende en verderf was overkomende."},{"catchword":"waarover","tekst":"Of, daar gij een afkeer van hebt. Om de reden straks verhaald."},{"catchword":"gij verdrietig zijt,","tekst":"O koning Achaz."},{"catchword":"van zijn twee koningen","tekst":"Hebreeuws, van het aangezicht zijner twee koningen; te weten Pekah en Rezin. Deze beide koningen zijn kort na deze profetie, gelijk sommigen rekenen, met een geweldigen dood omgekomen, gelijk te zien is 2Ki 15:30 , en 2Ki 16:9 ; eer Achaz vier volle jaren was koning geweest."}],"17":[{"catchword":"hoedanige","tekst":"Te weten, zware, bedroefde, jammerlijke dagen."},{"catchword":"dat Efraïm","tekst":"Dat is, van dien tijd af, dat de tien stammen gescheurd zijn van den stam van Juda, ten tijde van Rehabeam en Jerobeam, waarvan te lezen is 1Ki 12 ; en hier wordt Efraïm alleen genoemd, maar de tien stammen Israëls gemeend, niet alleen omdat Efraïm geweest is de voornaamste der tien stammen, maar ook daarom, omdat die scheuring uit den stam van Efraïm eerst haar oorsprong genomen heeft, en omdat Jerobeam uit dien stam afkomstig was, die de eerste koning over Efraïm en de andere negen stammen geweest is, 1Ki 12 ."},{"catchword":"door","tekst":"Te weten, zal de Heere zulks doen. De Joden verlieten zich zeer op de koningen van Assyrië, en bij name Achaz, gelijk te zien is 2Ki 16:7 . Maar hier dreigt hen God dat Hij hen allermeest door den koning van Assyrië zou laten straffen en verderven, namelijk [zo enigen menen] door Nebukadnezar, die toen ook Assyrië onder zijne heerschappij gebracht had. Zie onder vs.20. Doch enigen verstaan hier Tiglath Pilneser, waarvan te lezen is 2Ch 28:20 ; anderen Sanhebrib, waarvan gesproken wordt 2Ki 18:13 , enz."}],"18":[{"catchword":"te dien dage","tekst":"Te weten, in welken Hij besloten heeft u en uwe nakomelingen te straffen."},{"catchword":"toesissen","tekst":"Dat is, Hij zal hen met sissen, schuifelen, of fluiten tot zich doen komen; zie boven Isa 5:26 ."},{"catchword":"Vliegen . . . bijen","tekst":"Aldus noemt hij de Filistijnen; Idumeën en Moren, die aan de grenzen van Egypte hunne woonplaatsen hadden. Zie de vervulling dezer profetie 2Ki 19:9 , en 2Ch 28:17 . De profeet noemt dat volk vliegen, ten aanzien van hun grote menigte; bijen, zo vanwege het steken met den angel en hun groot getal, als vanwege hunne ervarenheid in den krijg en kunst van een leger in orde te stellen. Vergelijk Deu 1:44 ; Psa 118:2 ."}],"19":[{"catchword":"zij zullen komen,","tekst":"Te weten, die vliegen en die bijen."},{"catchword":"rusten","tekst":"Of, nederliggen. De zin is: De legers der vijanden zullen zich nederleggen in alle plaatsen van het ganse Joodse land, zo in de bekwame als in de onbekwame plaatsen, zij zijn diep, of hoog, vruchtbaar of onvruchtbaar."},{"catchword":"geprezene plaatsen","tekst":"Anders, lofwaardige; dat is vruchtbare."}],"20":[{"catchword":"een gehuurd","tekst":"Te weten, door den koning Achaz gehuurd, om hem te beschermen tegen de Syriërs en Israëlieten. Zie 2Ki 16:7-8 . De zin is: Gij hebt gezondigd, stellende uw vertrouwen op den koning van Assyrië, maar Ik zal u door denzelve straffen."},{"catchword":"der rivier is,","tekst":"Versta, de rivier Eufraat."},{"catchword":"door den koning","tekst":"Niet juist door denzelfden koning van Assyrië, dien Achaz gehuurd had, te weten Tiglat-Pilneser; want, of hij wel gezegd wordt Achaz benauwd te hebben, 2Ch 28:20-21 , nochtans heeft hij het Joodse volk zo grote schade niet aangedaan als hun God hier dreigt; derhalve is dit te verstaan van een anderen koning van Assyrië. Eenigen verstaan dat hier gesproken wordt van verscheidene koningen van Assyrië, die de een voor, de ander na, het Joodse volk jammerlijk geplaagd hebben, gelijk gedaan heeft Sanherib, Esar haddon , en eindelijk Nebukadnezar. Zie 2Ki 18 , 2Ki 19 , 2Ch 24 en 2Ch 25 , en 2Ch 33 . Doch die overgrote schade en ellende, waarvan hier gesproken wordt, schijnt op niemand anders, immers op niemand volkomenlijker te passen dan op Nebukadnezar, die, een machtig leger hebbende, gedaan heeft hetgeen de profeet hier dreigt. Zie 2Ki 24 , 2Ki 25 . Deze koning Nebukadnezar, koning van Babylonië, wordt hier genoemd de koning van Assyrië, omdat hij Assyrië onder zijne heerschappij gebracht had."},{"catchword":"het hoofd,","tekst":"Te weten het haar van het hoofd en de voeten; dat is, hij zal allen man kwalijk behandelen, niemand verschonende."},{"catchword":"den baard","tekst":"Door den baard wordt te verstaan gegeven het sieraad en de aanzienlijkheid onder de gemeente van het Joodse volk; zie de volvoering 2Ki 24 , 2Ki 25 ."}],"21":[{"catchword":"een koetje","tekst":"Of, een jonge koe, of vaarskalf van een rund."},{"catchword":"in het leven","tekst":"Of, opgevoed zal hebben; namelijk zonder dat de vijanden hem dezelve zullen benomen of geslacht hebben."},{"catchword":"twee schapen;","tekst":"Of, twee geiten; hij stelt een zeker getal voor een onzeker. De zin is: Weinig melkbeesten zullen melk genoeg geven voor die weinige mensen, die daar zullen overig gebleven zijn."}],"22":[{"catchword":"geven zullen,","tekst":"Hebreeuws, maken; zie boven Isa 5:10 ."},{"catchword":"boter","tekst":"Te weten de volheid, als niemand wetende aan wien hij de melk en boter verkopen zal, het land van zijne inwoners ontbloot zijnde; of dewijl hij tehuis niet vele mede eters hebben zal, want zij zullen van de vijanden verslagen of verdreven zijn."},{"catchword":"die overgebleven","tekst":"Te weten na zoveel verwoestingen en moorderijen."},{"catchword":"in het midden","tekst":"Te weten van het Joodse land."},{"catchword":"boter en honig eten","tekst":"Maar van andere eetwaren zal er niet veel ten beste zijn, het gehele land onbebouwd liggende."}],"23":[{"catchword":"iedere plaats,","tekst":"De zin is: Het ganse land, zelfs de allervruchtbaarste plaatsen en die allerbest plachten gebouwd te worden, zullen woest liggen."},{"catchword":"duizend wijnstokken","tekst":"Dat is, vele. Hebreeuws, duizend wijnstok; gelijk wij zeggen; duizend man."},{"catchword":"van duizend zilverlingen,","tekst":"Van duizend zilverlingen; dat is, waard duizend zilverlingen."}],"24":[{"catchword":"zal moeten gaan;","tekst":"Te weten om zich te verweren tegen de wilde dieren, die zich bij menigten in de distelen en doornen zullen ophouden, nadat het land verwoest en ledig, onbewoond en onbebouwd zal liggen. Dit is het, dat God den overtreders zijner wet dreigt; Lev 26:22 ."},{"catchword":"het ganse land","tekst":"En dienvolgens zal er niet veel ten beste zijn aan koren en andere eetwaren."}],"25":[{"catchword":"al de bergen,","tekst":"Te weten wijnbergen en andere vruchtbare plaatsen, die men pleegt te bezaaien, of te beplanten en te bepoten."},{"catchword":"pleegt","tekst":"Te weten om daarna met wijnstokken te beplanten."},{"catchword":"die zullen wezen","tekst":"Te weten bergen en landerijen, die goede en vele vruchten plachten te dragen."},{"catchword":"tot inzending","tekst":"Dat is, dat men de ossen of klein vee, hetzij schapen of geiten, inschikke. Zie Exo 22:5 . Anders aldus: Aangaande al de bergen, die met houwelen zullen omgehakt worden, daar zal de vrees der doornen en distelen niet komen, maar, enz. In dezen zin, dat de mensen zich nergens zullen kunnen bergen dan op hoge bergen, waar zij nog plaats zullen bereiden om enig vee daarin te zenden."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Now it came to pass in the days of Achaz, the son of Jotham, the son of Uzzia, [That is, which Jotham was the son of Uzia] King of Juda, [this hath relation unto Achaz] that Rezin the King of Syria, [Heb. Aram, who was one of the sons of Sem, Gen 10:22. From him sprang the Syrians] and Peka [he was a wicked Idolater, who murdered his own King Pekkaia, 2 Kings 15.25,28.] the son of Remalia, King of Israel, marched up towards Jerusalem, to war against it, but he [to wit the King of Syria, who waged the war, and was come to aid the KING of Israel, and (according to the opinion of some) was the principal author of this war, although it had the name that he came to aid and assist the King of Israel] prevailed not by fighting against it."}],"2":[{"catchword":null,"tekst":"When it was told the house of David, [That is, King Achaz, and the chiefest Lords of the Realm, or his kinsmen] saying, the Syrians rest upon Ephraim: [that is, the Syrians rely upon the aid and assistance of the Ephraimites, they are joined together, and are agreed to set upon thee with one accord. Heb. Aram, that is, Syria riseth upon, &c. Upon Ephraim, that is, upon the ten tribes of the Israelites, as Psal.78.9. and 80.6. and below, v.17. among which tribes the tribes the tribe of Ephraim was the chiefest, and in which tribe the Kings of Israel also kept their court, to wit, in Samaria] then his heart [to wit, the heart of King Achaz] was moved, and the heart of his people, as the trees of the forest are moved by the wind. [this fear sprang from a bad conscience, unbelief and mistrust.]"}],"3":[{"catchword":null,"tekst":"And the LORD said unto Isaiah, Go forth now to meet Achaz, [The Prophet is therefore properly sent to Achaz, because he was specially afraid, and because this matter concerned the welfare and prosperity of the Realm] thou and thy son Schear-Jaschab [that is to say, the remnant shall return, to wit, out of the common ruin or captivity, or shall convert themselves. Hence it appeareth, that this name was given unto this son in a Prophetical way, to put the people in mind of Gods promises concerning the return of some of the people. See below, ch.10.21. and compare below, chap.8.3. and Hos 3:4.6,9.] at the end of the conduit of the upper pool, in the high way of the Fullers field. [See concerning this the Annotat. 2 Kings, chap.18.on verse 17.]"}],"4":[{"catchword":null,"tekst":"And say unto him, Take heed [To wit, of being afraid] and be quiet, fear not, neither let thine heart grow weak (or faint) because of those two tails, of these smoking fire-brands, because of the kindling of the anger of Rezin, and of the Syrians, and of the son of Remalia. [Because of those two tails of the smoking fire-brands, etc. Thus the Prophet calleth the KING of Syria, and the King of Israel in a disdainful and a contemptible manner, and he intimateth that their anger (which seemed to be like a burning fire, and as if they should have set the whole world on fire) was little to be regarded, and would soon pass away, or have no more strength or virtue, comparing them to a stick that was almost burnt away, comparing them to a stick that was almost burnt away, and had very little or no fire at all any more, but onely had yet some smoak. The King of Syria was almost quite burnt out, or subdued by Joas, the son of Joahaz, 2 Kings 13.25. The King of Israel was almost utterly wasted and brought to nothing by intestine mutiny and war, 2 Kings 15.v.10,14,16. And both of them by Pul, King of Assyria, 2 Kings 15.19, and 1 Chron.5.26. (and of the son of Remalia) The Prophet thinketh him not worthy to call him by his name, or to give him the title of King; whereas he meant notwithstanding, Peka King of Israel, the son of Remalia.]"}],"5":[{"catchword":null,"tekst":"Because the Syrian [Thus doth the Prophet call Rezin, the King of Syria, in a disdainful and contemptible manner] hath advised evil against thee (with) Ephraim, [that is, with the ten tribes of Israel] and the son of Remalia, saying:"}],"6":[{"catchword":null,"tekst":"Let us march up against Juda, [To wit, into the land of Juda] and vex it, [to wit, by besieging the city of Jerusalem a long while, so that they be constrainted at length to yield up themselves into our hands, Oth. Grieve it, or weary it] and divide it amongst us; and make the son of Tabeal King in the midst of it. [They intimate, that their purpose was to rent the land of Juda in twain, and to divide it amongst them both, and in the name of them both to make the son of Tebeal Deputy Governor in it. Who this Tabeal or his son was, is very uncertain: It is probable, that he was a Syrian, of some great house or Family, and an excellent and famous warrior.]"}],"7":[{"catchword":null,"tekst":"Thus saith the LORD: It shall not stand, neither shall it come to pass. [To wit, the evil or mischief, which those two Kings intend: It shall not be put in execution. See the like phrase, Job 22.verse 28.]"}],"8":[{"catchword":null,"tekst":"But Damascus shall be the head of Syria: [That is Damascus shall be the chief city of the Kingdom of Syria] and Rezin the head of Damascus: [the meaning is, Rezin shall be and continue head or governor onely at Damascus, and not at Jerusalem, as he and his confederates do fancy or imagine: their design shall not prosper, every one shall remain or continue within the bounds of his own land] and within threescore and five years shall Ephraim be broken, that it be not a people. [That is, they shall have no Kingdom more of their own, nor state, nor Dominion in their own hand: so far is it from thence, that they should enlarge their own Kingdom, by the addition of the land of Judea, or of my part thereof. This desolation happened in part by Salmanassar, 2 Kings 17.3. but in full by Esar-haddon, 2 Kings 17.24. the son of Sanherib, 2 Kings 19.37.]"}],"9":[{"catchword":null,"tekst":"In the mean while Samaria shall be the head of Ephraim, and the son of Remalia the head [That is, King or Ruler] of Samaria: [That is, Samaria shall be the chief City of Ephraim; that is, of the Kingdom of the ten tribes; and he that hath the supreme authority and command in it, is Peka, the son of Remalia] if ye believe not, surely ye shall not be established. [The meaning is, if ye will not believe that promise of God, which I have preached unto you, to wit, that these two Kings shall not prevail against you, then ye shall not be established, or ye can have no comfortable assurance against the great fear which ye have by reason of your enemies, but ye shall be always disquiet in heart. Oth. If ye believe not (this) that cometh (therefore) to pass, because ye are not stable, or fixed; to wit, in faith. Oth. Do ye not believe (this,) because ye are not assured, nor confirmed in your faith? To wit, by a token or miracle?]"}],"10":[{"catchword":null,"tekst":"And [Oth. Therefore] the LORD went on to speak unto Achaz, [To wit, By me his prophet, because he saw that Achaz gave no credit to these promises, neither his people also, which sufficiently appeared by their quaking and trembling], saying,"}],"11":[{"catchword":null,"tekst":"Ask thee a token of the LORD, thy God: [Ask thee, &c. That is, for thy good, namely, for confirmation of thy faith, in that which was even now promised thee. (a token, &c.) Whereby thou mayest perceive, that God hath sent a prophet unto thee, that speaketh truth] ask (it either) in the depth, beneath, or ask (it) in the height above. [that is, pray, that God would shew thee a miracle, either on earth, or in heaven. Heb. Make the request deep, or make (it) high upwards.]"}],"12":[{"catchword":null,"tekst":"But Achaz said, I will not ask it, [To wit, a token of the LORD] neither will I tempt the LORD [Achaz speaketh this in a dissembling way, as an hypocrite or dissembler, as if so be he should say, I will not transgress against the commandment of God, Deut.6.6. left I should provoke the Lord to anger. The Lord forbiddeth to ask a token out of Incredulity, unbelief, or with an evil intent and purpose. But he forbiddeth not to require a token by way of obedience, and according to his special command, for confirmation and strengthening of our faith. See the Annotat. Deut.6.16.]"}],"13":[{"catchword":null,"tekst":"Then said he, [To wit, the Prophet Isaiah] Hear ye now, ye house of David, is it too little for you, that ye weary men, that ye weary my God also? [Ye house of David, etc. To wit, ye that are degenerated, not following the godly foot-steps of David. Hence may be gathered, that those that were next to King Achaz, were incredulous, and refused to ask a token, as well as Achaz himself. (Is it too little for you, etc.) The meaning is, hitherto ye have set little by me and the rest of the Lords Prophets, yea despised us, not believing nor entertaining our counsel and admonitions. But now ye vex and trouble the LORD himself, forasmuch as ye despise and reject the grace, which he offereth unto you.]"}],"14":[{"catchword":null,"tekst":"Therefore the LORD himself shall give you a token: [To wit, seeing ye have despised & rejected the token that was offered unto you, and yet notwithstanding the godly have need of confirmation and strengthening in faith: therefore God will give a miraculous token] Behold, a Virgin shall conceive, and she shall bear a son, and call his name IMMANUEL. [Behold, etc. This word exhorteth them to diligent attention unto that which shall come of the tribe of Juda and be born of a virgin. Therefore shall also much more be able and willing to perform that promise which he maketh concerning the redemption or deliverance out of the hands and power of the enemies; that concerneth the spiritual and eternal redemption, this onely the bodily and temporal deliverance. ( a Virgin) or; that Virgin. (and she shall bear a son, and call his name IMMANUEL.) Oth. And thou (O Virgin) shalt call his name IMMANUEL, signifying hereby, that Christ should give him his name, as fathers are wont to do unto their children, Luk 1:63. (IMMANUEL) that is, God with us, true God, and true man, who shall reconcile, yea, as it were re-unite men unto God.]"}],"15":[{"catchword":null,"tekst":"Butter and honey shall he [That is, the Virgins son] eat, [the meaning is, he shall be nourished and brought up in his child-hood, as other children are, that it may appear, that he is of the same nature that other children are of] till he know how to refuse the evil, and to choose the good. [that is, till he come to years of understanding, and discretion, that he knoweth how to distinguish good from evil.]"}],"16":[{"catchword":null,"tekst":"Surely, before this lad (or child) knoweth, to refuse the evil, and to choose the good: that land of which thou art weary, shall be forsaken of her two Kings. [These words are not (according to the opinion of some) a continuation of the immediate foregoing words, speaking of the incarnation of the Son of God, but the Prophet speaketh here again of the deliverance which he promised unto Achaz, concerning the defence and protection of the Israelites against their enemies. And by the young lad or child, may here be understood, the Prophets little Son, Schear-Jaschab, whom by Gods appointment he had taken along with him, vers.3. or some other child that was already born, or should shortly be born: For these words cannot so well suit with our Saviour Christ; the Prophet speaking here of a short time, wherein both those Kings should perish; whereas our Saviour was not born, and come into the world, till many years after that. Yet some do apply this verse unto our Saviour Christ, in such sense or meaning, that this Prophecy should be accomplished in so short a time, as there should be between the birth of Christ, and his age or years of discretion. (that land, etc. Shall be forsaken of both her Kings.) The meaning is, that those two Kings should not onely not take the land of Juda, but that // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {

    } else {

    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
