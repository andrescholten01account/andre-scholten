, "2 Kron": "2-kronieken", "Ezra": "ezra", "Neh": "nehemia", "Est": "esther", "Job": "job", "Ps": "psalmen", "Spr": "spreuken", "Pred": "prediker", "Hoogl": "hooglied", "Jes": "jesaja", "Jer": "jeremia", "Klaagl": "klaagliederen", "Ezech": "ezechiel", "Dan": "daniel", "Hos": "hosea", "Joël": "joel", "Amos": "amos", "Obadja": "obadja", "Jona": "jona", "Micha": "micha", "Nahum": "nahum", "Hab": "habakuk", "Zef": "zefanja", "Hagg": "haggai", "Zach": "zacharia", "Mal": "maleachi", "Matt": "mattheus", "Mark": "markus", "Luk": "lukas", "Joh": "johannes", "Hand": "handelingen", "Rom": "romeinen", "1 Kor": "1-korinthe", "2 Kor": "2-korinthe", "Gal": "galaten", "Ef": "efeze", "Fil": "filippenzen", "Kol": "kolossenzen", "1 Tess": "1-thessalonicenzen", "2 Tess": "2-thessalonicenzen", "1 Tim": "1-timotheus", "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "Het gebeurde nu in de dagen van Achaz, de zoon van Jotham, de zoon van Uzzia, de koning van Juda, dat Rezin, de koning van Syrië, en Pekah, de zoon van Remalia, de koning van Israël, optrokken naar Jeruzalem, ten oorlog tegen haar; maar hij kon met strijden niet tegen haar op.", "2": "Toen men het huis van David boodschapte en zei: De Syriërs liggen bij Efraïm, bewoog zijn hart zich, en het hart van zijn volk, zoals de bomen van het woud bewegen door de wind.", "3": "En de HEERE zei tegen Jesaja: Ga nu uit, Achaz tegemoet, u en uw zoon, Schear-Jaschub, aan het einde van de watergang van de bovenste vijver, aan de hoge weg van het veld van de voller;", "4": "En zeg tegen hem: Wees op uw hoede, en wees rustig, wees niet bang, en laat uw hart niet week worden vanwege die twee staarten van deze rokende vuurbranden, vanwege de ontsteking van de toorn van Rezin en van de Syriërs, en van de zoon van Remalia;", "5": "Omdat de Syriër kwaad tegen u beraadslaagd heeft, samen met Efraïm en de zoon van Remalia, en gezegd heeft:", "6": "Laten wij optrekken tegen Juda, en het schrik aanjagen, en het onder ons verdelen, en de zoon van Tabeal koning maken in hun midden.", "7": "Zo zegt de Heere HEERE: Het zal niet standhouden, en het zal niet gebeuren.", "8": "Maar Damaskus zal het hoofd van Syrië zijn, en Rezin het hoofd van Damaskus; en over nog vijfenzestig jaar zal Efraïm verbroken worden, zodat het geen volk meer is.", "9": "Ondertussen zal Samaria het hoofd van Efraïm zijn, en de zoon van Remalia het hoofd van Samaria. Als u niet gelooft, zult u zeker niet standhouden.", "10": "En de HEERE ging verder met spreken tegen Achaz, en zei:", "11": "Vraag u een teken van de HEERE, uw God; vraag het beneden in de diepte, of vraag het boven in de hoogte.", "12": "Doch Achaz zei: Ik zal het niet vragen, en ik zal de HEERE niet op de proef stellen.", "13": "Toen zei hij: Hoor toch, u, huis van David! Is het u te weinig, dat u de mensen moe maakt, dat u ook mijn God moe maakt?", "14": "Daarom zal de Heere Zelf u een teken geven; zie, een maagd zal zwanger worden, en zij zal een Zoon baren, en Zijn naam Immanuel noemen.", "15": "Boter en honing zal Hij eten, totdat Hij weet het kwade te verwerpen en het goede te verkiezen.", "16": "Zeker, voordat dit Knechtje weet het kwade te verwerpen en het goede te verkiezen, zal dat land, waarvoor u zo bang bent, verlaten zijn door zijn twee koningen.", "17": "Maar de HEERE zal over u, en over uw volk, en over het huis van uw vader, dagen doen komen, wat voor dagen niet gekomen zijn vanaf de dag dat Efraïm van Juda is afgeweken, door de koning van Assyrië.", "18": "Want het zal op die dag gebeuren, dat de HEERE zal fluiten naar de vliegen, die aan het einde van de rivieren van Egypte zijn, en naar de bijen die in het land van Assyrië zijn.", "19": "En zij zullen komen, en zij zullen allemaal neerstrijken in de woeste dalen, en in de kloven van de rotsen, en op alle doornhagen, en op alle geprezen* plaatsen.", "20": "Op die dag zal de Heere door een gehuurd scheermes, dat aan de andere kant van de rivier is, door de koning van Assyrië, het hoofd afscheren, en het haar van de voeten; ja, het zal ook de baard helemaal wegnemen.", "21": "En het zal op die dag gebeuren, dat iemand een koetje in leven zal houden, en twee schapen;", "22": "En het zal gebeuren, dat hij vanwege de overvloed van de melk, die zij geven zullen, boter zal eten; ja, ieder die overgebleven is in het midden van het land, die zal boter en honing eten.", "23": "Ook zal het op diezelfde dag gebeuren, dat iedere plaats waar duizend wijnstokken waren, elk duizend zilverstukken waard, met doorns en distels bedekt zal zijn;", "24": "Zodat men met pijl en boog daar zal moeten gaan; want het hele land zal doorns en distels zijn.", "25": "Ook op al de bergen die men met houwelen placht om te bewerken, daar zal men niet meer komen uit vrees voor de doorns en de distels; maar die zullen dienen om de os op los te laten, en voor het vertrappen door het kleinvee."}, "SV": {"1": "Het geschiedde nu in de dagen van Achaz, den zoon van Jotham, den zoon van Uzzia, den koning van Juda, dat Rezin, de koning van Syrië, en Pekah, de zoon van Remalia, de koning van Israël, optoog naar Jeruzalem, ten oorlog tegen haar; maar hij vermocht met strijden niet tegen haar.", "2": "Als men den huize Davids boodschapte, zeggende: De Syriërs rusten op Efraïm, zo bewoog zich zijn hart en het hart zijns volks, gelijk de bomen des wouds bewogen worden van den wind.", "3": "En de HEERE zeide tot Jesaja: Ga nu uit, Achaz tegemoet, gij en uw zoon, Schear-jaschub, aan het einde van den watergang des oppersten vijvers, aan den hogen weg van het veld des vollers;", "4": "En zeg tot hem: Wacht u, en zijt gerust, vrees niet, en uw hart worde niet week, vanwege die twee staarten dezer rokende vuurbranden; vanwege de ontsteking des toorns van Rezin en der Syriërs, en van den zoon van Remalia;", "5": "Omdat de Syriër kwaad tegen u beraadslaagd heeft, *met* Efraïm en den zoon van Remalia, zeggende:", "6": "Laat ons optrekken tegen Juda, en het verdriet aandoen, en het onder ons delen, en den zoon van Tabeal koning maken in het midden van hen.", "7": "Alzo zegt de Heere HEERE: Het zal niet bestaan, en het zal niet geschieden.", "8": "Maar Damaskus zal het hoofd van Syrië zijn, en Rezin het hoofd van Damaskus; en in nog vijf en zestig jaren zal Efraïm verbroken worden, dat het geen volk zij.", "9": "Ondertussen zal Samaria Efraïms hoofd zijn, en de zoon van Remalia het hoofd van Samaria. Indien gijlieden niet gelooft, zekerlijk, gij zult niet bevestigd worden.", "10": "En de HEERE voer voort te spreken tot Achaz, zeggende:", "11": "Eis u een teken van den HEERE, uw God; eis beneden in de diepte, of eis boven uit de hoogte.", "12": "Doch Achaz zeide: Ik zal het niet eisen, en ik zal den HEERE niet verzoeken.", "13": "Toen zeide hij: Hoort gijlieden nu, gij, huis van David! is het ulieden te weinig, dat gij de mensen moede maakt, dat gij ook mijn God moede maakt?", "14": "Daarom zal de Heere Zelf ulieden een teken geven; ziet, een maagd zal zwanger worden, en zij zal een Zoon baren, en Zijn naam IMMANUEL heten.", "15": "Boter en honig zal Hij eten, totdat Hij wete te verwerpen het kwade, en te verkiezen het goede.", "16": "Zekerlijk, eer dit Knechtje weet te verwerpen het kwade, en te verkiezen het goede, zal dat land, waarover gij verdrietig zijt, verlaten zijn van zijn twee koningen.", "17": "*Doch* de HEERE zal over u, en over uw volk, en over uws vaders huis, dagen doen komen, hoedanige niet gekomen zijn van dien dag af, dat Efraïm van Juda is afgeweken, *door* den koning van Assyrië.", "18": "Want het zal te dien dage geschieden, dat de HEERE zal toesissen de vliegen, die aan het einde der rivieren van Egypte zijn, en de bijen die in het land van Assur zijn.", "19": "En zij zullen komen, en zij allen zullen rusten in de woeste dalen, en in de kloven der steenrotsen, en in al de doornhagen, en in alle geprezene plaatsen.", "20": "Te dien dage zal de Heere door een gehuurd scheermes, *hetwelk* aan gene zijde der rivier is, door den koning van Assyrië, afscheren het hoofd, en het haar der voeten; ja, het zal ook den baard gans wegnemen.", "21": "En het zal geschieden te dien dage, dat iemand een koetje in het leven zal behouden hebben, en twee schapen;", "22": "En het zal geschieden, dat hij vanwege de veelheid der melk, die zij geven zullen, boter zal eten; ja, een ieder, die overgebleven zal zijn in het midden des lands, die zal boter en honig eten.", "23": "Ook zal het te dienzelfden dage geschieden, dat iedere plaats, alwaar duizend wijnstokken geweest zijn, van duizend zilverlingen, tot doornen en distelen zal zijn;", "24": "Dat men met pijlen en met den boog aldaar zal moeten gaan; want het ganse land zal doornen en distelen zijn.", "25": "Ook al de bergen, die men met houwelen pleegt om te hakken, daar zal men niet komen *uit* vrees der doornen en der distelen; maar die zullen wezen tot inzending van den os, en tot vertreding van het kleinvee."}, "KJV": {"1": "And it came to pass in the days of Ahaz the son of Jotham, the son of Uzziah, king of Judah, *that* Rezin the king of Syria, and Pekah the son of Remaliah, king of Israel, went up toward Jerusalem to war against it, but could not prevail", "2": "And it was told the house of David, saying, Syria is confederate with Ephraim. And his heart was moved, and the heart of his people, as the trees of the wood are moved with the wind.", "3": "Then said the LORD unto Isaiah, Go forth now to meet Ahaz, thou, and Shearjashub thy son, at the end of the conduit of the upper pool in the highway of the fuller's field;", "4": "And say unto him, Take heed, and be quiet; fear not, neither be fainthearted for the two tails of these smoking firebrands, for the fierce anger of Rezin with Syria, and of the son of Remaliah.", "5": "Because Syria, Ephraim, and the son of Remaliah, have taken evil counsel against thee, saying,", "6": "Let us go up against Judah, and vex it, and let us make a breach therein for us, and set a king in the midst of it, *even* the son of Tabeal:", "7": "Thus saith the Lord GOD, It shall not stand,", "8": "For the head of Syria *is* Damascus, and the head of Damascus *is* Rezin; and within threescore and five years shall Ephraim be broken, that it be not a people.", "9": "And the head of Ephraim *is* Samaria, and the head of Samaria *is* Remaliah's son. If ye will not believe, surely ye shall not be established.", "10": "Moreover the LORD spake again unto Ahaz, saying,", "11": "Ask thee a sign of the LORD thy God; ask it either in the depth, or in the height above.", "12": "But Ahaz said, I will not ask, neither will I tempt the LORD.", "13": "And he said, Hear ye now, O house of David; *Is it* a small thing for you to weary men, but will ye weary my God", "14": "Therefore the Lord himself shall give you a sign; Behold, a virgin shall conceive, and bear a son, and shall call his name Immanuel.", "15": "Butter and honey shall he eat, that he may know to refuse the evil, and choose the good.", "16": "For before the child shall know to refuse the evil, and choose the good, the land that thou abhorrest shall be forsaken of both her kings.", "17": "The LORD shall bring upon thee, and upon thy people, and upon thy father's house, days that have not come, from the day that Ephraim departed from Judah; *even* the king of Assyria.", "18": "And it shall come to pass in that day, *that* the LORD shall hiss for the fly that *is* in the uttermost part of the rivers of Egypt, and for the bee that *is* in the land of Assyria.", "19": "And they shall come, and shall rest all of them in the desolate valleys, and in the holes of the rocks, and upon all thorns, and upon all bushes.", "20": "In the same day shall the Lord shave with a razor that is hired, *namely*, by them beyond the river, by the king of Assyria, the head, a/#t-agriculture-or-husbandry", "kinderen": [{"label": "Implements Of", "href": "../../torrey/a/?hl=Isa.7.25#i286", "refs": [], "kinderen": [{"label": "The mattock", "href": "../../torrey/a/?hl=Isa.7.25#i289", "refs": [{"disp": "1 Sam 13:20", "href": "../../1-samuel/13/#v20", "ref": "1 Sam 13:20", "svLabel": null}, {"disp": "Jes 7:25", "href": "../../jesaja/7/#v25", "ref": "Jes 7:25", "svLabel": null}], "kinderen": []}]}]}, {"topic": "Ox, The", "href": "../../torrey/o/#t-ox-the", "kinderen": [{"label": "Was Fed", "href": "../../torrey/o/?hl=Isa.7.25#i14275", "refs": [], "kinderen": [{"label": "On the hills", "href": "../../torrey/o/?hl=Isa.7.25#i14279", "refs": [{"disp": "Jes 7:25", "href": "../../jesaja/7/#v25", "ref": "Jes 7:25", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"Matt 22:39": "En het tweede, hieraan gelijk, is: U zult uw naaste liefhebben als uzelf.", "Ex 13:12": "dat u alles wat de baarmoeder opent voor de HEERE zult afzonderen; ook alles wat de baarmoeder opent van het jong van de dieren die u zult hebben; de mannetjes zullen van de HEERE zijn.", "Matt 5:33": "Wederom hebt u gehoord dat tot de ouden gezegd is: U zult de eed niet breken, maar u zult aan de Heere uw eden houden.", "Jes 8:12": "U zult niet zeggen: Een samenzwering, van alles waar dit volk van zegt: Het is een samenzwering; en vrees u hun vrees niet, en wees niet verschrikt.", "Joh 6:70": "Jezus antwoordde hun: Heb Ik u niet twaalf uitgekozen? En één van u is een duivel.", "Joh 6:36": "Maar Ik heb u gezegd dat u Mij ook gezien hebt, en toch gelooft u niet.", "Rom 11:10": "Dat hun ogen verduisterd worden, om niet te zien; en verkrom hun rug alle tijd.", "Luk 4:11": "En dat zij U op de handen zullen dragen, opdat U uw voet niet ooit aan een steen stoot.", "Hand 13:34": "En dat Hij Hem uit de doden heeft opgewekt, zodat Hij niet meer tot verderving zal terugkeren, heeft Hij zo gezegd: Ik zal u de weldaden van David geven, die betrouwbaar zijn;", "Jes 6:9-13": "Toen zei Hij: Ga heen, en zeg tegen dit volk: Blijf horen, maar begrijp het niet, en blijf zien, maar merk het niet op. Maak het hart van dit volk vet, en maak hun oren zwaar, en sluit hun ogen, opdat het niet ziet met zijn ogen, of met zijn oren hoort, of met zijn hart begrijpt, of zich bekeert, en Hij het geneest. Toen zei ik: Hoe lang, Heere? En Hij zei: Totdat de steden verwoest worden, zodat er geen inwoner meer is, en de huizen, zodat er geen mens meer is, en het land met verwoesting verstrooid wordt.", "2 Kon 16:1": "In het zeventiende jaar van Pekah, de zoon van Remalia, werd Achaz koning, de zoon van Jotham, de koning van Juda.", "Ps 83:2-13": "O God! Zwijg niet, houd U niet doof, en blijf niet stil, o God! Want zie, Uw vijanden maken misbaar, en Uw haters steken het hoofd op. Zij maken listig een heimelijk plan tegen Uw volk, en spannen samen tegen wie U verborgen houdt.", "Luk 19:46": "en zei tegen hen: Er is geschreven: Mijn huis is een huis van het gebed; maar u hebt er een rovershol van gemaakt.", "2 Kron 33:14": "En hierna bouwde hij de buitenmuur bij de stad van David, aan de westzijde van Gihon in het dal, tot aan de ingang van de Vispoort, en omsingelde Ofel, en verhoogde die zeer; hij legde ook legeroversten in alle vaste steden in Juda.", "Jes 41:14": "Vrees niet, wormpje Jakob, volkje Israël! Ik help u, spreekt de HEERE, en uw Verlosser is de Heilige van Israël!", "Rom 15:10": "En opnieuw zegt Hij: Weest vrolijk, heidenen, met Zijn volk!", "Luk 7:31-35": "En de Heere zei: Waarmee zal Ik dan de mensen van dit geslacht vergelijken, en waaraan zijn zij gelijk? Zij zijn gelijk aan de kinderen die op de markt zitten en elkaar toeroepen en zeggen: Wij hebben voor u op de fluit gespeeld, en u hebt niet gedanst; wij hebben klaagliederen voor u gezongen, en u hebt niet gehuild. Want Johannes de Doper is gekomen, en at geen brood en dronk geen wijn; en u zegt: Hij heeft een duivel.", "Gen 1:1-14": "In het begin schiep God de hemel en de aarde. De aarde nu was woest en leeg, en duisternis lag op de diepte; en de Geest van God zweefde over de wateren. En God zei: Laat er licht zijn! En er was licht.", "Jes 8:10": "Beraadslaag een plan, toch zal het vernietigd worden; spreek een woord, toch zal het niet standhouden; want God is met ons!", "Ps 106:7": "Onze vaders in Egypte hebben niet gelet op Uw wonderen; zij zijn de veelheid van Uw goedertierenheid niet gedachtig geweest; maar zij waren opstandig aan de zee, bij de Schelfzee.", "Luk 1:72-74": "om barmhartigheid te bewijzen aan onze vaderen, en Zijn heilig verbond te gedenken; en aan de eed die Hij Abraham, onze vader, gezworen heeft, om ons te geven dat wij, verlost uit de hand van onze vijanden, Hem zonder vrees zouden dienen,", "Spr 25:21": "Als hij die u haat, honger heeft, geef hem brood te eten; en als hij dorstig is, geef hem water te drinken;", "Hos 1:6-10": "En zij ontving opnieuw, en baarde een dochter; en Hij zei tegen hem: Noem haar naam Lo-Ruchama; want Ik zal Mij voortaan niet meer ontfermen over het huis van Israël, maar Ik zal ze zeker wegvoeren. Maar over het huis van Juda zal Ik Mij ontfermen, en Ik zal ze verlossen door de Heere, hun God, en Ik zal ze niet verlossen door boog, noch door zwaard, noch door oorlog, door paarden noch door ruiters. Toen zij nu Lo-Ruchama gespeend had, ontving zij, en baarde een zoon.", "Gen 16:11": "Ook zei de Engel van de HEERE tegen haar: Zie, u bent zwanger, en zult een zoon baren, en u zult zijn naam Ismaël noemen, omdat de HEERE uw verdrukking gehoord heeft.", "Jer 49:23-29": "Tegen Damaskus. Beschaamd is Hamath en Arpad; omdat zij een slecht gerucht gehoord hebben, zijn zij gesmolten; bij de zee is bekommernis, men kan er niet rusten. Damaskus is slap geworden, zij heeft zich omgekeerd om te vluchten, en siddering heeft haar aangegrepen; benauwdheid en smarten als van een barende vrouw hebben haar bevangen; Hoe is de beroemde stad niet gelaten, de stad van mijn vrolijkheid!", "Rom 3:18": "Er is geen vreze van God voor hun ogen.", "Num 21:6": "Toen zond de HEERE vurige slangen onder het volk, die het volk beten; en er stierf veel volk van Israël.", "Deut 6:5": "Zo zult u de HEERE, uw God, liefhebben, met uw hele hart, en met uw hele ziel, en met al uw kracht.", "Deut 8:3": "En Hij verootmoedigde u, en liet u hongeren, en voedde u met het manna, dat u niet kende, dat ook uw vaderen niet gekend hadden; opdat Hij u bekend zou maken dat de mens niet alleen van brood leeft, maar dat de mens leeft van alles wat uit de mond van de HEERE komt.", "Matt 23:39": "Want Ik zeg u: U zult Mij van nu af aan niet zien, totdat u zeggen zult: Gezegend is Hij Die komt in de Naam van de Heere!", "Dan 9:27": "En hij zal voor velen het verbond versterken, één week; en in de helft van de week zal hij het slachtoffer en het spijsoffer doen ophouden, en over de gruwelijke vleugel zal een verwoester zijn, ook tot de voleinding toe, die vast besloten is, zal uitgestort worden over de verwoeste.", "Hebr 13:15": "Laten wij dan door Hem altijd aan God een lofoffer opdragen, dat is de vrucht van lippen die Zijn Naam belijden.", "Ps 27:1": "Een psalm van David. De HEERE is mijn Licht en mijn Heil, voor wie zou ik vrezen? De HEERE is de kracht van mijn leven, voor wie zou ik bang zijn?", "Luk 4:34": "En zei: Laat ons met rust, wat hebben wij met U te maken, Jezus van Nazareth? Bent U gekomen om ons te vernietigen? Ik weet wie U bent, namelijk de Heilige van God.", "Gen 12:3": "En Ik zal zegenen wie u zegenen, en vervloeken wie u vervloekt; en in u zullen alle geslachten van de aarde gezegend worden.", "Jes 51:12": "Ik, Ik ben het, Die u troost; wie bent u, dat u vreest voor de mens, die sterven zal? En voor het kind van een mens, dat hooi worden zal?", "Lev 19:13": "U zult uw naaste niet bedriegen of verdrukken, noch beroven; het arbeidsloon van de dagloner zal bij u niet blijven overnachten tot de morgen.", "1 Joh 4:2": "Hieraan herkent u de Geest van God: elke geest die belijdt dat Jezus Christus in het vlees gekomen is, die is uit God;", "Deut 32:14": "Boter van koeien, en melk van klein vee, met het vet van de lammeren en van de rammen, die in Basan weiden, en van de bokken, met het vette van de nieren van tarwe; en het druivenbloed, reine wijn, hebt u gedronken.", "Ps 22:2": "Mijn God, mijn God! Waarom hebt U mij verlaten, ver zijnde van mijn verlossing, van de woorden van mijn brullen?", "Joh 12:13": "Namen zij de takken van palmbomen, en gingen Hem tegemoet, en riepen: Hosanna! Gezegend is Hij, Die komt in de Naam van de Heere, de Koning van Israël!", "Ps 118:23": "Dit is van de HEERE gebeurd, en het is wonderlijk in onze ogen.", "Luk 12:46": "dan zal de heer van die dienstknecht komen op een dag dat hij hem niet verwacht, en op een moment dat hij het niet weet; en hij zal hem in stukken houwen, en hem zijn deel geven met de ontrouwen.", "Mark 12:31": "En het tweede, hieraan gelijk, is dit: U zult uw naaste liefhebben als uzelf. Er is geen ander gebod groter dan deze.", "Hebr 2:9-17": "maar wij zien Jezus met heerlijkheid en eer gekroond, Die een weinig minder dan de engelen geworden was, vanwege het lijden van de dood, opdat Hij door de genade van God voor allen de dood zou proeven. Want het paste Hem, om Wie alle dingen zijn, en door Wie alle dingen zijn, dat Hij, veel kinderen naar de heerlijkheid leidend, de leidsman van hun zaligheid door lijden zou volmaken. Want Hij Die heiligt, en zij die geheiligd worden, zijn allen uit één; om die reden schaamt Hij Zich niet hen broeders te noemen,", "1 Petr 1:24": "Want alle vlees is als gras, en alle heerlijkheid van de mens is als een bloem van het gras. Het gras verdort, en zijn bloem valt af;", "Ef 4:8-10": "Daarom zegt Hij: Toen Hij opgevaren is in de hoogte, heeft Hij de gevangenis gevangengenomen, en heeft Hij de mensen gaven gegeven. Nu dit: Hij is opgevaren; wat betekent dit anders dan dat Hij ook eerst neergedaald is in de laagste delen van de aarde? Die neergedaald is, is Dezelfde ook, Die opgevaren is ver boven alle hemelen, opdat Hij alle dingen zou vervullen.", "Gen 2:24": "Daarom zal de man zijn vader en zijn moeder verlaten, en zich hechten aan zijn vrouw; en zij zullen tot een vlees zijn.", "2 Kron 10:16-19": "Toen heel het volk Israël zag dat de koning niet naar hen luisterde, antwoordde het volk de koning en zei: Wat deel hebben wij aan David? Ja, geen erfdeel hebben wij aan de zoon van Isaï; ieder naar uw tenten, o Israël! Zorg nu voor uw eigen huis, o David! Zo ging heel Israël naar zijn tenten. Doch over de kinderen van Israël die in de steden van Juda woonden, over hen regeerde Rehabeam wel. Toen stuurde koning Rehabeam Hadoram, die over de schatting ging; en de kinderen van Israël stenigden hem met stenen, zodat hij stierf; maar koning Rehabeam maakte zich haastig gereed om op een wagen te klimmen, om naar Jeruzalem te vluchten.", "Joh 5:21-23": "Want zoals de Vader de doden opwekt en levend maakt, zo maakt ook de Zoon levend wie Hij wil. Want ook de Vader oordeelt niemand, maar heeft heel het oordeel aan de Zoon gegeven, opdat allen de Zoon eren, zoals zij de Vader eren. Wie de Zoon niet eert, eert de Vader niet, Die Hem gezonden heeft.", "Luk 19:44": "en zij zullen u tot de grond toe neerwerpen, en uw kinderen in u; en zij zullen in u geen steen op de andere steen laten liggen, omdat u de tijd waarin u bezocht werd niet hebt herkend.", "Jes 40:9": "O Sion, u die goede boodschap verkondigt, klim op een hoge berg; o Jeruzalem, u die goede boodschap verkondigt, hef uw stem op met macht, hef ze op, vrees niet, zeg tegen de steden van Juda: Zie, hier is uw God!", "Ps 2:7": "Ik zal van het besluit vertellen: de HEERE heeft tot Mij gezegd: U bent Mijn Zoon, vandaag heb Ik U verwekt.", "Luk 21:5-25": "En toen sommigen spraken over de tempel, dat hij met mooie stenen en geschenken versierd was, zei Hij: Wat deze dingen aangaat, die u aanschouwt: er zullen dagen komen waarin geen steen op de andere steen gelaten zal worden, die niet zal worden afgebroken. En zij vroegen Hem: Meester, wanneer zullen deze dingen dan gebeuren, en wat is het teken wanneer deze dingen zullen gebeuren?", "Jes 30:27-33": "Ziet, de Naam van de HEERE komt van verre, Zijn toorn brandt, en de last is zwaar; Zijn lippen zijn vol gramschap, en Zijn tong als een verterend vuur; En Zijn adem is als een overlopende beek, die tot aan de hals toe raakt; om de heidenen te schudden met een schudding van de ijdelheid, en als een misleidende toom in het kinnebakken van de volken. Er zal een lofzang bij u zijn, zoals in de nacht wanneer het feest geheiligd wordt; en blijdschap van het hart, zoals van iemand die met pijpen wandelt, om te komen tot de berg van de HEERE, tot de Rotssteen van Israël.", "Hand 1:16": "Mannen broeders, deze Schrift moest vervuld worden, die de Heilige Geest bij monde van David voorzegd heeft over Judas, die de leidsman is geweest van hen die Jezus gevangennamen;", "Matt 4:7": "Jezus zei tegen hem: Er is ook geschreven: U zult de Heere, uw God, niet beproeven.", "Ex 14:13": "Doch Mozes zei tegen het volk: Vrees niet, sta vast, en zie het heil van de HEERE, dat Hij heden aan u doen zal, want de Egyptenaren die u heden gezien hebt, zult u niet meer zien in eeuwigheid.", "Jes 8:4-8": "Want voordat dat jongetje kan roepen: Mijn vader! of: mijn moeder!, zal men de rijkdom van Damaskus en de buit van Samaria wegdragen voor de koning van Assur. En de HEERE sprak nog verder tegen mij en zei: Omdat dit volk het water van Siloa veracht, dat zachtjes stroomt, en er vreugde is bij Rezin en de zoon van Remalia,", "Num 16:9": "Is het u te weinig, dat de God van Israël u van de vergadering van Israël heeft afgescheiden, om u tot Zich te laten naderen; om de dienst van de tabernakel van de HEERE te verrichten, en te staan voor het aangezicht van de vergadering, om hen te dienen?", "Luk 23:46": "En Jezus riep met luide stem en zei: Vader, in Uw handen beveel Ik Mijn geest. En toen Hij dat gezegd had, gaf Hij de geest.", "Ezech 5:1-4": "En u, mensenkind, neem een scherp mes, een scheermes van de barbiers zult u nemen, en dat zult u over uw hoofd en over uw baard laten gaan; daarna zult u een weegschaal nemen, en die haren verdelen. Een derde deel zult u in het midden van de stad met vuur verbranden, nadat de dagen van de belegering vervuld zijn; dan zult u een derde deel nemen, en daaromheen slaan met een zwaard, en een derde deel zult u in de wind strooien; want Ik zal het zwaard achter hen uittrekken. U zult ook een klein aantal daarvan nemen, en in uw slippen binden.", "Hebr 6:8": "maar die doornen en distels draagt, is verwerpelijk, en dicht bij de vervloeking, waarvan het einde verbranding is.", "Jes 8:4-7": "Want voordat dat jongetje kan roepen: Mijn vader! of: mijn moeder!, zal men de rijkdom van Damaskus en de buit van Samaria wegdragen voor de koning van Assur. En de HEERE sprak nog verder tegen mij en zei: Omdat dit volk het water van Siloa veracht, dat zachtjes stroomt, en er vreugde is bij Rezin en de zoon van Remalia,", "Hos 1:10": "Toch zal het aantal kinderen van Israël zijn als het zand van de zee, dat niet gemeten en niet geteld kan worden; en het zal gebeuren dat op de plaats waar tegen hen gezegd is: U bent Mijn volk niet; tegen hen gezegd zal worden: U bent kinderen van de levende God.", "2 Tess 2:11": "En daarom zal God hun een kracht van de dwaling zenden, zodat zij de leugen zouden geloven;", "1 Kon 17:1": "En Elia, de Thisbiet, van de inwoners van Gilead, zei tegen Achab: Zo waarachtig als de HEERE, de God van Israël, leeft, voor Wiens aangezicht ik sta, indien deze jaren dauw of regen zijn zal, tenzij dan naar mijn woord!", "2 Kron 36:16": "Maar zij spotten met de boden van God, en verachtten Zijn woorden; zij hielden Zijn profeten voor de gek, totdat de grimmigheid van de HEERE tegen Zijn volk opging, zodat er geen redding meer was.", "Jer 22:24-30": "Zo waarachtig als Ik leef, spreekt de HEERE, al was Chonia, de zoon van Jojakim, de koning van Juda, een zegelring aan Mijn rechterhand, toch zal Ik u vandaar wegrukken. En Ik zal u geven in de hand van hen die uw leven zoeken, en in de hand van hen voor wier gezicht u beeft, namelijk in de hand van Nebukadnezar, de koning van Babel, en in de hand van de Chaldeeën. En Ik zal u, en uw moeder, die u gebaard heeft, wegwerpen in een ander land, waarin u niet geboren bent, en daar zult u sterven.", "Luk 1:17": "En hij zal voor Hem uit gaan, in de geest en de kracht van Elia, om de harten van de vaders tot de kinderen te bekeren, en de ongehoorzamen tot de wijsheid van de rechtvaardigen, om voor de Heere een toegerust volk gereed te maken.", "Amos 3:13": "Hoort en getuigt in het huis van Jakob, spreekt de Heere HEERE, de God van de heerscharen;", "Jer 51:63": "En het zal gebeuren, als u deze rol geheel gelezen hebt, dat u er een steen aan zult binden, en hem zult werpen in het midden van de Eufraat;", "Jes 7:13-25": "Toen zei hij: Hoor toch, u, huis van David! Is het u te weinig, dat u de mensen moe maakt, dat u ook mijn God moe maakt? Daarom zal de Heere Zelf u een teken geven; zie, een maagd zal zwanger worden, en zij zal een Zoon baren, en Zijn naam Immanuel noemen. Boter en honing zal Hij eten, totdat Hij weet het kwade te verwerpen en het goede te verkiezen.", "Hab 1:5": "Ziet onder de heidenen, en aanschouwt, en verwonder u, verwonder u, want Ik werk een werk in uw dagen, dat u niet geloven zult, als het verteld wordt.", "Jer 15:1-14": "Maar de HEERE zei tegen mij: Al stonden Mozes en Samuël voor Mijn aangezicht, dan nog zou Mijn ziel niet naar dit volk uitgaan; drijf ze weg van Mijn aangezicht, en laat ze weggaan. En het zal gebeuren, wanneer zij tegen u zullen zeggen: Waarheen zullen wij weggaan? dat u tegen hen zult zeggen: Zo zegt de HEERE: Wie voor de dood bestemd is, ten dode; en wie voor het zwaard, ten zwaarde; en wie voor de honger, ten honger; en wie voor de gevangenschap, ter gevangenschap! Want Ik zal een bezoeking over hen brengen met vier soorten straf, spreekt de HEERE: met het zwaard, om te doden; en met de honden, om te verscheuren; en met het gevogelte van de hemel, en met het gedierte van de aarde, om op te eten en te vernietigen.", "Ps 116:10": "Ik heb geloofd, daarom sprak ik; ik ben zeer bedrukt geweest.", "Tit 1:15": "Alle dingen zijn wel rein voor de reinen, maar voor de bevlekten en ongelovigen is niets rein, maar zowel hun verstand als hun geweten zijn bevlekt.", "2 Sam 10:19": "Toen nu alle koningen die knechten van Hadad-Ezer waren, zagen dat zij voor Israëls aangezicht geslagen waren, sloten zij vrede met Israël, en dienden hen; en de Syriërs vreesden de kinderen Ammons niet meer te verlossen.", "Hand 26:22": "Nu, hulp van God ontvangen hebbende, sta ik tot op deze dag en getuig zowel tegen klein als groot; en zeg niets anders dan wat de profeten en Mozes gesproken hebben dat zou gebeuren;", "Deut 6:13": "U zult de HEERE, uw God, vrezen, en Hem dienen; en u zult bij Zijn Naam zweren.", "Gen 48:22": "En ik heb u één stuk land gegeven, boven uw broers; dat ik met mijn zwaard en met mijn boog uit de hand van de Amorieten genomen heb.", "Lev 26:11": "En Ik zal Mijn tabernakel in uw midden zetten; en Mijn ziel zal van u niet walgen.", "Amos 1:3-5": "Zo zegt de HEERE: Om drie overtredingen van Damaskus, en om vier zal Ik dat niet afwenden; omdat zij Gilead met ijzeren dorswagens hebben gedorst. Daarom zal Ik een vuur in het huis van Hazaël zenden, dat zal de paleizen van Benhadad verteren. En Ik zal de grendel van Damaskus verbreken, en zal de inwoner uitroeien uit Bikeat-aven, en hem die de scepter houdt, uit Beth-eden; en het volk van Syrië zal als gevangenen worden weggevoerd naar Kir, zegt de HEERE.", "Joh 5:47": "Maar als u zijn geschriften niet gelooft, hoe zult u Mijn woorden geloven?", "Ps 83:4-6": "Zij maken listig een heimelijk plan tegen Uw volk, en spannen samen tegen wie U verborgen houdt. Zij hebben gezegd: Kom, laten we hen uitroeien, zodat zij geen volk meer zijn, en aan de naam van Israël niet meer gedacht wordt. Want zij hebben in hun hart samen een plan beraamd; tegen U hebben zij een verbond gesloten;", "Ps 83:5": "Zij hebben gezegd: Kom, laten we hen uitroeien, zodat zij geen volk meer zijn, en aan de naam van Israël niet meer gedacht wordt.", "Joël 2:28-32": "En daarna zal het gebeuren, dat Ik Mijn Geest zal uitgieten over alle vlees, en uw zonen en uw dochters zullen profeteren; uw ouden zullen dromen dromen, uw jongelingen zullen gezichten zien; Ja, ook over de dienstknechten, en over de dienstmaagden, zal Ik in die dagen Mijn Geest uitgieten. En Ik zal wondertekenen geven in de hemel en op de aarde: bloed, en vuur, en rookpilaren.", "Hebr 4:1-3": "Laat ons dan vrezen dat niet iemand van u, terwijl de belofte om in Zijn rust in te gaan nog geldt, schijnt achtergebleven te zijn. Want ook ons is het Evangelie verkondigd, net als hun; maar het gehoorde woord deed hun geen nut, omdat het bij hen die het hoorden niet met geloof gemengd was. Want wij die geloofd hebben, gaan de rust in, zoals Hij gezegd heeft: Zo heb Ik dan in Mijn toorn gezworen: Zij zullen Mijn rust niet ingaan! Hoewel Zijn werken al vanaf de grondlegging van de wereld volbracht waren.", "2 Kon 17:5-23": "Want de koning van Assyrië trok op door het hele land; ja, hij kwam op naar Samaria, en belegerde het drie jaar. In het negende jaar van Hosea nam de koning van Assyrië Samaria in, en voerde Israël weg naar Assyrië, en liet hen wonen in Halah, en in Habor, aan de rivier Gozan, en in de steden van de Meden. Want het was gebeurd, omdat de kinderen van Israël gezondigd hadden tegen de HEERE, hun God, Die hen uit het land Egypte opgevoerd had, onder de hand van de farao, de koning van Egypte, vandaan; en zij hadden andere goden gevreesd;", "Jes 2:19": "Dan zullen zij in de spelonken van de rotsstenen gaan, en in de holen van de aarde, vanwege de schrik van de HEERE, en vanwege de heerlijkheid van Zijn majesteit, wanneer Hij Zich zal opmaken, om de aarde te verschrikken.", "Ex 25:40": "Zie er dan op toe dat u het maakt naar hun voorbeeld, dat u op de berg getoond is.", "1 Kor 2:16": "Want wie heeft de gedachte van de Heere gekend, dat hij Hem zou onderrichten? Maar wij hebben de gedachte van Christus.", "Ex 19:6": "En u zult Mij een priesterlijk koninkrijk en een heilig volk zijn. Dit zijn de woorden die u tot de kinderen van Israël spreken zult.", "Jer 9:9-26": "Zou Ik hen om deze dingen niet straffen? spreekt de HEERE; zou Mijn ziel zich niet wreken aan zo'n volk, als dit is? Ik zal een geween en een klaagzang aanheffen over de bergen, en een klaaglied over de herdershutten van de woestijn; want zij zijn afgebrand, zodat er niemand doorgaat, en men hoort er geen stem van vee; van de vogels van de hemel tot de dieren toe zijn zij weggevlucht, weggegaan! En Ik zal Jeruzalem stellen tot steenhopen, tot een woning voor jakhalzen; en de steden van Juda zal Ik stellen tot een verwoesting, zonder inwoner.", "Matt 13:15": "Want het hart van dit volk is dik geworden, en met de oren hebben zij zwaar gehoord, en hun ogen hebben zij gesloten; opdat zij niet op enig moment met de ogen zouden zien, en met de oren horen, en met het hart begrijpen, en zich bekeren, en Ik hen zou genezen.", "Joh 12:38": "Opdat het woord van Jesaja, de profeet, vervuld werd, dat hij gesproken heeft: Heere, wie heeft onze prediking geloofd, en aan wie is de arm van de Heere geopenbaard?", "Mark 11:9": "En zij die voorop gingen, en zij die volgden, riepen: Hosanna! Gezegend is Hij Die komt in de Naam van de Heere!", "Hand 13:22": "En nadat Hij hem afgezet had, verwekte Hij hun David tot koning; aan wie Hij ook getuigenis gaf, en zei: Ik heb David gevonden, de zoon van Isaï, een man naar Mijn hart, die al Mijn wil zal doen.", "Deut 5:18": "En u zult geen overspel doen.", "2 Kor 9:9": "Zoals er geschreven is: Hij heeft uitgestrooid, hij heeft aan de armen gegeven; Zijn gerechtigheid blijft in eeuwigheid.", "Ps 83:4": "Zij maken listig een heimelijk plan tegen Uw volk, en spannen samen tegen wie U verborgen houdt.", "Mark 7:6": "Maar Hij antwoordde en zei tegen hen: Terecht heeft Jesaja over u, huichelaars, geprofeteerd, zoals geschreven is: Dit volk eert Mij met de lippen, maar hun hart houdt zich ver van Mij.", "1 Kor 15:55": "Dood, waar is uw prikkel? Graf, waar is uw overwinning?", "Micha 4:8-10": "En u, Schaapstoren, u Ofel van de dochter van Sion! Tot u zal komen, ja, daar zal komen de vorige heerschappij, het koninkrijk van de dochters van Jeruzalem. Nu, waarom zou u zo luid roepen? Is er geen koning onder u? Is uw Raadgever vergaan, dat smart u heeft aangegrepen, als van een barende vrouw? Lijd smart en doe uw uiterste best om te baren, dochter van Sion, als een barende vrouw; want nu zult u wel uit de stad heen weggaan, en op het veld wonen, en tot in Babel komen, maar daar zult u gered worden; daar zal de HEERE u verlossen uit de hand van uw vijanden.", "Richt 14:8": "En na enige dagen kwam hij terug om haar te nemen; toen week hij af om het kadaver van de leeuw te bekijken, en zie, er was een bijenzwerm in het lichaam van de leeuw, met honing.", "Deut 32:21": "Zij hebben Mij tot ijver verwekt door wat geen God is; zij hebben Mij tot toorn verwekt door hun ijdelheden; Ik dan zal hen tot ijver verwekken door hen die geen volk zijn; door een dwaas volk zal Ik hen tot toorn verwekken.", "Luk 8:12": "Zij die langs de weg bezaaid worden, zijn zij die horen; daarna komt de duivel en neemt het Woord uit hun hart weg, opdat zij niet zouden geloven en zalig worden.", "1 Kron 5:2": "want Juda werd machtig onder zijn broeders, en hij die tot een voorganger was, kwam uit hem; maar het eerstgeboorterecht was van Jozef.)", "Gen 17:5": "En uw naam zal niet meer Abram genoemd worden; maar uw naam zal Abraham zijn; want Ik heb u tot een vader van een menigte volken gemaakt.", "Matt 22:32": "Ik ben de God van Abraham, en de God van Izak, en de God van Jakob! God is niet een God van de doden, maar van de levenden.", "Amos 4:11": "Ik heb sommigen onder u omgekeerd, zoals God Sodom en Gomorra omkeerde, u, die was als een stuk brandhout, dat uit de brand gered is; toch hebt u zich niet bekeerd tot Mij, spreekt de HEERE.", "Jes 22:13": "Maar zie, er is vreugde en blijdschap met runderen te doden, en schapen te slachten, vlees te eten, en wijn te drinken, en te zeggen: Laten we eten en drinken, want morgen zullen we sterven.", "Ps 109:8": "Laat zijn dagen weinig zijn; een ander neemt zijn ambt;", "1 Kon 15:20": "En Benhadad luisterde naar de koning Asa, en zond de leiders van de legers die hij had tegen de steden van Israël; en sloeg Ijon, en Dan, en Abel-Beth-Maächa, en het gehele Cinneroth, met het gehele land Nafthali.", "Rom 8:36": "(Zoals geschreven is: Want om Uwentwil worden wij de hele dag gedood; wij worden gerekend als schapen die geslacht worden.)", "Joh 19:28": "Hierna, omdat Jezus wist dat nu alles volbracht was, zei Hij, opdat de Schrift vervuld zou worden: Ik heb dorst.", "Ezech 12:2": "Mensenkind! U woont in het midden van een opstandig huis, dat ogen heeft om te zien, en niet ziet, oren heeft om te horen, en niet hoort, want zij zijn een opstandig huis.", "1 Petr 2:10": "U, die vroeger geen volk was, maar nu het volk van God bent; die vroeger niet ontfermd was, maar nu ontfermd bent geworden.", "Jak 4:6": "Ja, Hij geeft meer genade. Daarom zegt de Schrift: God weerstaat de hoogmoedigen, maar de nederigen geeft Hij genade.", "Hand 15:16": "Hierna zal Ik terugkeren, en de tabernakel van David, die vervallen is, weer opbouwen; en wat ervan verwoest is, zal Ik weer opbouwen, en Ik zal hem weer oprichten,", "Ps 35:19": "Laat hen zich niet verblijden over mij, die mij om valse oorzaken vijand zijn; laat hen ook niet wenken met de ogen, die mij zonder oorzaak haten.", "Ps 45:8": "U hebt gerechtigheid lief, en haat goddeloosheid; daarom heeft God, Uw God, U gezalfd met vreugdeolie, boven Uw metgezellen.", "Jes 8:7": "daarom, zie, zal de Heere over hen laten opkomen dat sterke en geweldige water van de rivier, de koning van Assyrië en al zijn heerlijkheid; en hij zal opkomen over al zijn stromen, en overgaan over al zijn oevers;", "Openb 21:8": "Maar de bangen, en ongelovigen, en verfoeilijken, en moordenaars, en hoereerders, en tovenaars, en afgodendienaars, en alle leugenaars, hun deel is in de poel die daar brandt van vuur en zwavel; dat is de tweede dood.", "2 Kron 25:6": "Daartoe huurde hij uit Israël honderdduizend sterke helden, voor honderd talenten van het zilver.", "Joh 10:26": "Maar u gelooft niet; want u bent niet van Mijn schapen, zoals Ik u gezegd heb.", "Mark 1:2": "Zoals geschreven is in de profeten: Zie, Ik zend Mijn engel voor Uw aangezicht, die Uw weg voor U heen bereiden zal.", "1 Petr 1:16": "want er staat geschreven: Wees heilig, want Ik ben heilig.", "Matt 13:13-15": "Daarom spreek Ik tot hen door gelijkenissen, omdat zij ziende niet zien, en horende niet horen, en ook niet begrijpen. En in hen wordt de profetie van Jesaja vervuld, die zegt: Met het gehoor zult u horen, en geenszins begrijpen; en ziende zult u zien, en geenszins opmerken. Want het hart van dit volk is dik geworden, en met de oren hebben zij zwaar gehoord, en hun ogen hebben zij gesloten; opdat zij niet op enig moment met de ogen zouden zien, en met de oren horen, en met het hart begrijpen, en zich bekeren, en Ik hen zou genezen.", "Ex 12:46": "In één huis zal het gegeten worden; u mag van het vlees niet naar buiten, het huis uit, dragen, en u mag er geen been van breken.", "Hebr 12:6": "Want die de Heere liefheeft, kastijdt Hij, en Hij geselt iedere zoon die Hij aanneemt.", "Jer 19:10": "Dan zult u de kruik verbreken voor de ogen van de mannen, die met u meegegaan zijn;", "Matt 4:15": "Het land Zebulon en het land Nafthali, aan de weg naar de zee, over de Jordaan, Galilea van de volken;", "Hand 7:6": "En God sprak zo, dat zijn nageslacht als vreemdeling zou wonen in een vreemd land, en dat men hen tot slaaf zou maken en slecht behandelen, vierhonderd jaar.", "Luk 1:32": "Hij zal groot zijn, en de Zoon van de Allerhoogste genoemd worden; en God, de Heere, zal Hem de troon van Zijn vader David geven.", "Hebr 1:10": "En: U, Heere! hebt in het begin de aarde gegrond, en de hemelen zijn werken van Uw handen;", "Amos 2:4": "Zo zegt de HEERE: Om drie overtredingen van Juda, en om vier zal Ik dat niet afwenden; omdat zij de wet van de HEERE verworpen, en Zijn inzettingen niet bewaard hebben; en hun leugens hen verleid hebben, die hun vaders hebben nagevolgd.", "Rom 2:24": "Want de Naam van God wordt om u gelasterd onder de heidenen, zoals geschreven is.", "Jes 17:3": "En de vesting zal ophouden in Efraïm, en het koninkrijk in Damaskus, en het overblijfsel van de Syriërs; zij zullen zijn als de heerlijkheid van de kinderen van Israël, spreekt de HEERE van de heerscharen.", "Hebr 3:7-10": "Daarom, zoals de Heilige Geest zegt: Heden, als u Zijn stem hoort, Verhard uw harten niet, zoals bij de verbittering, op de dag van de beproeving, in de woestijn; Waar uw vaders Mij beproefden; zij hebben Mij op de proef gesteld, en hebben Mijn werken gezien, veertig jaar lang.", "Ezech 29:18": "Mensenkind! Nebukadrezar, de koning van Babel, heeft zijn leger een grote dienst laten verrichten tegen Tyrus; alle hoofden zijn kaal geworden, en alle zijden zijn opengeschuurd; en noch hij, noch zijn leger heeft loon gehad vanwege Tyrus, voor de dienst die hij tegen haar verricht heeft.", "Jes 31:1": "Wee hun die naar Egypte om hulp aftrekken, en steunen op paarden, en vertrouwen op wagens, omdat er veel zijn, en op ruiters, omdat die zeer machtig zijn; en niet zien op de Heilige van Israël, en de HEERE niet zoeken.", "Kol 1:2": "Aan de heilige en gelovige broeders in Christus die in Kolosse zijn: genade zij u en vrede van God, onze Vader, en de Heere Jezus Christus.", "Jes 8:14-22": "Dan zal Hij u tot een Heiligdom zijn; maar tot een steen des aanstoots en tot een rots der struikeling voor de twee huizen van Israël, tot een strik en tot een net voor de inwoners van Jeruzalem. En velen onder hen zullen struikelen, en vallen, en verbroken worden, en zullen verstrikt en gevangen worden. Bind de getuigenis toe; verzegel de wet onder mijn leerlingen.", "Ex 22:28": "U mag de rechters niet vervloeken, en de leiders van uw volk mag u niet belasteren.", "2 Kor 6:2": "Want Hij zegt: In de aangename tijd heb Ik u verhoord, en in de dag van de zaligheid heb Ik u geholpen. Zie, nu is het de welaangename tijd, zie, nu is het de dag van de zaligheid!", "Jes 53:1-3": "Wie heeft onze prediking geloofd, en aan wie is de arm van de HEERE geopenbaard? Want Hij is als een jonge loot voor Zijn aangezicht opgeschoten, en als een wortel uit een dorre aarde; Hij had geen gedaante en geen heerlijkheid; als wij Hem aanzagen, was er geen gestalte dat wij Hem begeerd zouden hebben. Hij was veracht, en de onwaardigste onder de mensen, een Man van smarten, en vertrouwd met ziekte; en ieder verborg als het ware het gezicht voor Hem; Hij was veracht, en wij hebben Hem niet geacht.", "Rom 11:34": "Want wie heeft de zin van de Heere gekend? Of wie is Zijn raadsman geweest?", "Jes 28:16": "Daarom, zo zegt de Heere HEERE: Zie, Ik leg een grondsteen in Sion, een beproefde steen, een kostbare hoeksteen, die stevig gegrondvest is; wie gelooft, die zal niet haasten.", "Ps 118:25": "Och HEERE, geef nu heil; och HEERE, geef nu voorspoed.", "Hoogl 8:12": "Mijn wijngaard, die ik heb, is voor mijn aangezicht; de duizend zilverlingen zijn voor u, o Salomo! maar tweehonderd zijn voor de hoeders van de vrucht ervan.", "1 Petr 2:22": "Die geen zonde gedaan heeft, en in Zijn mond is geen bedrog gevonden;", "Matt 12:7": "Maar als u geweten had wat dit betekent: Ik wil barmhartigheid en geen offerande, dan zou u de onschuldigen niet veroordeeld hebben.", "Jes 29:1-10": "Wee Ariël, Ariël! De stad waarin David gelegerd heeft; doe jaar bij jaar; laat ze feestoffers slachten. Toch zal Ik Ariël in het nauw brengen, en er zal treuring en droefheid zijn, en die stad zal Mij gelijk Ariël zijn. Want Ik zal een leger in het rond om u opslaan, en Ik zal u belegeren met bolwerken, en Ik zal vestingen tegen u opwerpen.", "Neh 3:16": "Na hem verbeterde Nehemia, de zoon van Azbuk, leider van het halve deel van Beth-Zur, tot tegenover Davids graven, en tot aan de aangelegde vijver, en tot aan het huis van de helden.", "Ex 24:8": "Toen nam Mozes dat bloed, en sprengde het op het volk; en hij zei: Zie, dit is het bloed van het verbond, dat de HEERE met u gemaakt heeft over al die woorden.", "1 Kor 15:54": "En wanneer dit vergankelijke onvergankelijkheid zal hebben aangedaan, en dit sterfelijke onsterfelijkheid zal hebben aangedaan, dan zal het woord gebeuren dat geschreven is: De dood is verslonden tot overwinning.", "Ps 32:1": "Een onderwijzing van David. Gelukkig is hij, wiens overtreding vergeven is, wiens zonde bedekt is.", "Joh 6:64": "Maar er zijn sommigen onder u die niet geloven. Want Jezus wist vanaf het begin wie het waren die niet geloofden, en wie het was die Hem zou verraden.", "Rom 3:10-12": "zoals geschreven is: Er is niemand rechtvaardig, ook niet één; er is niemand die verstandig is, er is niemand die God zoekt. Allen zijn zij afgeweken, samen zijn zij onnut geworden; er is niemand die goed doet, er is zelfs niet één.", "Hebr 5:6": "Zoals Hij ook op een andere plaats zegt: U bent Priester in eeuwigheid, naar de ordening van Melchizedek.", "Hand 2:30": "Omdat hij dan een profeet was, en wist dat God hem met een eed gezworen had dat Hij uit de vrucht van zijn lichaam, wat het vlees betreft, de Christus zou verwekken om Hem op zijn troon te zetten;", "Hand 7:33": "En de Heere zei tegen hem: Doe de schoenen van uw voeten; want de plaats waarop u staat, is heilige grond.", "Matt 22:44": "De Heere heeft gezegd tot mijn Heere: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gezet heb.", "Ps 112:7": "Mem. Hij zal voor geen kwaad gerucht bang zijn; Nun. zijn hart is vast, vertrouwend op de HEERE.", "2 Kron 28:12": "Toen stonden er mannen op van de hoofden van de kinderen van Efraïm: Azaria, de zoon van Johanan, Berechja, de zoon van Mesillemoth, en Jehizkia, de zoon van Sallum, en Amasa, de zoon van Hadlai, tegen hen die uit het leger kwamen.", "Luk 24:39": "Zie Mijn handen en Mijn voeten; want Ik ben het Zelf; raak Mij aan, en zie; want een geest heeft geen vlees en beenderen, zoals u ziet dat Ik heb.", "Matt 21:42": "Jezus zei tegen hen: Hebt u nooit gelezen in de Schriften: De steen die de bouwers verworpen hebben, die is geworden tot een hoeksteen; dit is door de Heere gedaan, en het is wonderlijk in onze ogen?", "2 Kon 16:8": "En Achaz nam het zilver en het goud, dat in het huis van de HEERE en in de schatten van het huis van de koning gevonden werd, en hij stuurde het als geschenk naar de koning van Assyrië.", "Luk 1:33": "En Hij zal over het huis van Jakob Koning zijn tot in eeuwigheid, en aan Zijn koninkrijk zal geen einde zijn.", "Jes 53:8": "Hij is uit de angst en uit het gericht weggenomen; en wie zal Zijn leeftijd uitspreken? Want Hij is afgesneden uit het land van de levenden; om de overtreding van Mijn volk is de plaag op Hem geweest.", "Hebr 10:30": "Want wij kennen Hem, Die gezegd heeft: Aan Mij is de wraak, Ik zal het vergelden, zegt de Heere. En opnieuw: De Heere zal Zijn volk oordelen.", "Hand 7:41": "En zij maakten een kalf in die dagen, en brachten een offer aan de afgod, en verheugden zich in de werken van hun eigen handen.", "Spr 30:19": "De weg van een arend in de hemel; de weg van een slang op een rotssteen; de weg van een schip in het hart van de zee; en de weg van een man bij een meisje.", "Jes 53:5": "Maar Hij is om onze overtredingen verwond, om onze ongerechtigheden is Hij verbrijzeld; de straf die ons de vrede aanbrengt, was op Hem, en door Zijn striemen is er voor ons genezing gekomen.", "Joh 3:32": "En wat Hij gezien en gehoord heeft, dat getuigt Hij; en Zijn getuigenis neemt niemand aan.", "2 Kron 32:30": "Deze Jehizkia dichtte ook de bovenste waterloop van Gihon, en leidde die recht naar beneden naar het westen van de stad van David; want Jehizkia had voorspoed in al zijn werk.", "Hebr 1:7": "En tot de engelen zegt Hij wel: Die Zijn engelen maakt tot geesten, en Zijn dienaars tot een vlam van het vuur.", "Amos 2:5": "Daarom zal Ik een vuur in Juda zenden, dat zal Jeruzalems paleizen verteren.", "Amos 5:25-27": "Hebt u Mij veertig jaar in de woestijn slachtoffers en spijsoffer gebracht, o huis van Israël? Ja, u droeg de tent van uw Melech, en de Kijun, uw beelden, de ster van uw god, die u zelf gemaakt had. Daarom zal Ik u gevankelijk wegvoeren, ver voorbij Damaskus, zegt de HEERE, Wiens Naam is God van de heerscharen.", "Jes 31:1-3": "Wee hun die naar Egypte om hulp aftrekken, en steunen op paarden, en vertrouwen op wagens, omdat er veel zijn, en op ruiters, omdat die zeer machtig zijn; en niet zien op de Heilige van Israël, en de HEERE niet zoeken. Toch is Hij ook wijs, en Hij doet het kwaad komen, en trekt Zijn woorden niet terug; maar Hij zal Zich opmaken tegen het huis van de boosdoeners, en tegen de hulp van hen die ongerechtigheid werken. Want de Egyptenaren zijn mensen, en geen God, en hun paarden zijn vlees, en geen geest; en de HEERE zal Zijn hand uitstrekken, zodat de helper struikelen zal, en die geholpen wordt, zal neervallen, en zij zullen allemaal samen te niet komen.", "Gal 5:14": "Want de hele wet wordt in één woord vervuld, namelijk in dit: U zult uw naaste liefhebben als uzelf.", "Mal 3:1": "Zie, Ik zend Mijn engel, die voor Mijn aangezicht de weg bereiden zal; en snel zal die Heere, Die u zoekt, tot Zijn tempel komen, namelijk de Engel van het verbond, aan Wie u lust hebt; zie, Hij komt, zegt de HEERE van de heerscharen.", "Luk 22:67": "en zeiden: Bent U de Christus, zeg het ons. En Hij zei tegen hen: Als Ik het u zeg, zult u het niet geloven;", "1 Kor 3:19": "Want de wijsheid van deze wereld is dwaasheid bij God; want er is geschreven: Hij vat de wijzen in hun sluwheid;", "2 Kon 16:15": "En koning Achaz gebood Uria, de priester, en zei: Steek op het grote altaar aan het morgenbrandoffer, en het avondspijsoffer, en het brandoffer van de koning, en zijn spijsoffer, en het brandoffer van heel het volk van het land, en hun spijsoffer, en hun drankoffers; en sprenkel daarop al het bloed van het brandoffer, en al het bloed van het slachtoffer; maar het koperen altaar zal voor mij zijn om te onderzoeken.", "Jes 30:7": "Want Egypte zal nutteloos en tevergeefs helpen; daarom heb Ik hierover geroepen: Stilzitten zal hun sterkte zijn.", "2 Kon 16:7": "Achaz nu zond boden naar Tiglath-pilezer, de koning van Assyrië, en zei: Ik ben uw knecht en uw zoon; kom op, en verlos mij uit de hand van de koning van Syrië, en uit de hand van de koning van Israël, die tegen mij opstaan.", "Mal 4:1": "Want zie, die dag komt, brandend als een oven. Dan zullen alle hoogmoedigen, en ieder die goddeloosheid doet, een stoppel zijn, en de komende dag zal ze in vlam zetten, zegt de HEERE van de heerscharen, Die hun noch wortel, noch tak laten zal.", "Deut 19:15": "Eén enkele getuige zal tegen niemand opstaan in verband met enige ongerechtigheid of enige zonde, van welke zonde hij ook zou hebben gezondigd; op de verklaring van twee getuigen, of op de verklaring van drie getuigen, zal de zaak vaststaan.", "1 Kor 10:7": "En word geen afgodendienaars, zoals sommigen van hen, zoals geschreven staat: Het volk zat neer om te eten en te drinken, en zij stonden op om te spelen.", "Ps 40:7-9": "Gij hebt geen lust gehad aan slachtoffer en spijsoffer; Gij hebt mij de oren doorboord; brandoffer en zondoffer hebt Gij niet geëist. Toen zei ik: Zie, ik kom; in de rol van het boek is van mij geschreven. Ik heb lust, o mijn God! om Uw welbehagen te doen; en Uw wet is in het midden van mijn ingewand.", "Jak 2:11": "Want Hij Die gezegd heeft: U zult geen overspel doen, heeft ook gezegd: U zult niet doden. Als u nu geen overspel doet, maar wel doodt, dan bent u een overtreder van de wet geworden.", "Joh 1:23": "Hij zei: Ik ben de stem van hem die roept in de woestijn: Maak de weg van de Heere recht, zoals Jesaja, de profeet, gesproken heeft.", "Ezech 11:7-12": "Daarom, zo zegt de Heere HEERE: Uw gedoden, die u in het midden daarvan neergelegd hebt, die zijn het vlees, en deze stad is de pot; maar u zal Ik uit het midden daarvan doen weggaan. U hebt het zwaard gevreesd; en het zwaard zal Ik over u brengen, spreekt de Heere HEERE. Ook zal Ik u uit het midden daarvan doen weggaan, en Ik zal u overgeven in de hand van vreemden; en Ik zal recht onder u doen.", "Joh 19:37": "En weer zegt een andere Schrift: Zij zullen zien op Hem, in Wie zij gestoken hebben.", "Jes 54:15": "Zie, zij zullen zich zeker verzamelen, maar niet uit Mij; wie zich tegen u verzamelen zal, die zal om uw wil vallen.", "Jes 63:10": "Maar zij zijn opstandig geworden, en zij hebben Zijn Heilige Geest smarten aangedaan; daarom is Hij hun in een vijand veranderd, Hij Zelf heeft tegen hen gestreden.", "2 Kor 1:2": "Genade zij u en vrede van God, onze Vader, en de Heere Jezus Christus.", "Mark 12:29": "En Jezus antwoordde hem: Het eerste van alle geboden is: Hoor, Israël! De Heere, onze God, is een enig Heere.", "Neh 2:13-15": "En ik trok 's nachts uit door de Dalpoort, en voorbij de Drakenfontein, en naar de Mestpoort, en ik bekeek de muren van Jeruzalem, die waren afgebroken, en haar poorten die met vuur verteerd waren. En ik ging verder naar de Fonteinpoort, en naar de vijver van de koning; maar daar was geen plaats voor het dier om onder mij door te gaan. Toen ging ik 's nachts omhoog, door de beek, en ik bekeek de muur; en ik keerde terug, en kwam in door de Dalpoort; zo keerde ik terug.", "Jes 17:2": "De steden van Aroer zullen verlaten worden; ze zullen er zijn voor de kudden, die daar zullen neerliggen, en niemand zal ze schrik aanjagen.", "Luk 18:20": "U kent de geboden: U zult geen overspel doen; u zult niet doden; u zult niet stelen; u zult geen valse getuigenis geven; eer uw vader en uw moeder.", "Hand 4:25": "Die door de mond van David, Uw knecht, gezegd hebt: Waarom woeden de heidenen, en hebben de volken zinloze dingen bedacht?", "Matt 21:33-39": "Hoor een andere gelijkenis. Er was een heer des huizes, die een wijngaard plantte en er een omheining omheen zette, en er een wijnpersbak in groef, en een toren bouwde, en hem verhuurde aan landbouwers, en op reis ging naar het buitenland. Toen nu de tijd van de vruchten naderde, stuurde hij zijn dienstknechten naar de landbouwers, om zijn vruchten te ontvangen. En de landbouwers grepen zijn dienstknechten en sloegen de een, en doodden een ander, en stenigden een derde.", "2 Kor 6:17": "Daarom, ga uit hun midden weg, en scheid u af, zegt de Heere, en raak niet aan wat onrein is, en Ik zal u aannemen,", "Hebr 1:3": "Die, omdat Hij het Afschijnsel is van Zijn heerlijkheid en het uitgedrukte Beeld van Zijn zelfstandigheid, en alle dingen draagt door het woord van Zijn kracht, nadat Hij de reiniging van onze zonden door Zichzelf tot stand gebracht heeft, is gaan zitten aan de rechterhand van de Majesteit in de hoogste hemelen;", "Jes 9:1": "Het volk dat in duisternis wandelt, zal een groot licht zien; wie wonen in het land van de schaduw van de dood, over hen zal een licht schijnen.", "Jer 25:8-38": "Daarom, zo zegt de HEERE van de heerscharen: Omdat u Mijn woorden niet hebt gehoord; Zie, Ik zal zenden, en nemen alle geslachten van het noorden, spreekt de HEERE; en tot Nebukadnezar, de koning van Babel, Mijn dienstknecht; en zal ze brengen over dit land, en over de inwoners daarvan, en over al deze volken rondom; en Ik zal ze met de ban verdelgen, en zal ze stellen tot een ontzetting, en tot een aanfluiting, en tot eeuwige woestheden. En Ik zal van hen doen vergaan de stem van de vrolijkheid en de stem van de vreugde, de stem van de bruidegom en de stem van de bruid, het geluid van de molens en het licht van de lamp.", "Joh 3:36": "Wie in de Zoon gelooft, heeft het eeuwige leven; maar wie de Zoon ongehoorzaam is, zal het leven niet zien, maar de toorn van God blijft op hem.", "1 Kor 9:7": "Wie dient ooit in de krijgsdienst op eigen kosten? Wie plant een wijngaard, en eet niet van zijn vrucht? Of wie hoedt een kudde, en eet niet van de melk van de kudde?", "Ef 4:26": "Word toornig, en zondig niet; laat de zon niet ondergaan over uw toorn;", "1 Joh 4:3": "en elke geest die niet belijdt dat Jezus Christus in het vlees gekomen is, die is niet uit God; maar dit is de geest van de antichrist, waarvan u gehoord hebt dat hij komen zou, en die nu al in de wereld is.", "Ps 4:5": "Wees beroerd, en zondig niet; spreek in uw hart op uw bed, en wees stil. Sela.", "Joh 12:37-40": "En hoewel Hij zoveel tekenen voor hen gedaan had, geloofden zij toch niet in Hem; Opdat het woord van Jesaja, de profeet, vervuld werd, dat hij gesproken heeft: Heere, wie heeft onze prediking geloofd, en aan wie is de arm van de Heere geopenbaard? Daarom konden zij niet geloven, omdat Jesaja opnieuw gezegd heeft:", "Mal 4:6": "En hij zal het hart van de vaders terugbrengen tot de kinderen, en het hart van de kinderen tot hun vaders, zodat Ik niet hoef te komen en de aarde met de ban sla.", "Joh 13:18": "Ik zeg dit niet van u allen: Ik weet wie Ik uitverkoren heb; maar dit gebeurt, opdat de Schrift vervuld wordt: Die met Mij het brood eet, heeft tegen Mij zijn hiel opgeheven.", "Hand 28:24": "En sommigen geloofden wel wat er gezegd werd, maar sommigen geloofden niet.", "Hebr 1:8": "Maar tot de Zoon zegt Hij: Uw troon, o God, is er in alle eeuwigheid; de scepter van Uw koninkrijk is een rechte scepter.", "2 Tess 2:16": "En onze Heere Jezus Christus Zelf, en onze God en Vader, Die ons heeft liefgehad, en een eeuwige vertroosting en goede hoop gegeven heeft in genade,", "Lev 26:12": "En Ik zal in uw midden wandelen, en zal u tot een God zijn, en u zult Mij tot een volk zijn.", "Ps 112:9": "Pe. Hij strooit uit, hij geeft aan de arme; Tsade. zijn gerechtigheid houdt stand tot in eeuwigheid; Koph. zijn hoorn zal verhoogd worden in eer.", "Ps 8:3": "Uit de mond van de kinderen en de zuigelingen hebt U sterkte gegrondvest, omwille van Uw tegenstanders, om de vijand en de wraakgierige te doen ophouden.", "Jer 5:12-14": "Zij verloochenen de HEERE, en zeggen: Hij is het niet, en ons zal geen kwaad overkomen, wij zullen geen zwaard en geen honger zien. Ja, die profeten zullen tot wind worden, want het woord is niet bij hen; hun zelf zal zo gebeuren. Daarom zegt de HEERE, de God van de heerscharen, zo, omdat u dit woord spreekt: Zie, Ik zal Mijn woorden in uw mond tot vuur maken, en dit volk tot hout, en het zal hen verteren.", "Jes 8:17": "Daarom zal ik de HEERE verwachten, Die Zijn aangezicht verbergt voor het huis van Jakob, en ik zal Hem verwachten.", "Rom 10:16": "Maar zij zijn niet allen het Evangelie gehoorzaam geweest; want Jesaja zegt: Heere, wie heeft onze prediking geloofd?", "Klaagl 3:26": "Teth. Het is goed dat men hoopt, en stil is op het heil van de HEERE.", "1 Joh 2:22": "Wie is de leugenaar, dan wie loochent, dat Jezus de Christus is? Deze is de antichrist, die de Vader en de Zoon loochent.", "Micha 5:2": "Daarom zal Hij hen overgeven, tot de tijd toe dat zij, die baren zal, gebaard heeft; dan zullen de overigen van Zijn broeders zich bekeren met de kinderen van Israël.", "Spr 3:34": "Zeker, de spotters zal Hij bespotten, maar aan de zachtmoedigen zal Hij genade geven.", "Rom 9:32": "Waarom? Omdat zij die niet uit het geloof zochten, maar als het ware uit de werken van de wet; want zij hebben zich gestoten aan de steen des aanstoots;", "Gal 3:11": "En dat niemand door de wet gerechtvaardigd wordt voor God, is duidelijk; want de rechtvaardige zal uit het geloof leven.", "Matt 28:18": "En Jezus kwam bij hen en sprak tot hen: Mij is gegeven alle macht in hemel en op aarde.", "Matt 22:37": "En Jezus zei tegen hem: U zult de Heere, uw God, liefhebben met heel uw hart, en met heel uw ziel, en met heel uw verstand.", "Jes 52:11": "Vertrek, vertrek, ga daarvandaan weg, raak het onreine niet aan; ga weg uit hun midden, reinig u, u die de voorwerpen van de HEERE draagt!", "Matt 23:35-38": "opdat over u komt al het rechtvaardige bloed dat vergoten is op de aarde, vanaf het bloed van de rechtvaardige Abel tot het bloed van Zacharia, de zoon van Barachia, die u gedood hebt tussen de tempel en het altaar. Voorwaar, Ik zeg u: Al deze dingen zullen komen over dit geslacht. Jeruzalem, Jeruzalem! U die de profeten doodt, en stenigt hen die tot u gezonden zijn! Hoe vaak heb Ik uw kinderen bijeen willen brengen, zoals een hen haar kuikens bijeenbrengt onder de vleugels; en u hebt niet gewild.", "Ef 6:3": "opdat het u goed gaat, en u lang leeft op de aarde.", "Jer 1:11-16": "Verder kwam het woord van de HEERE tot mij, en zei: Wat ziet u, Jeremia? En ik zei: Ik zie een amandelroede. En de HEERE zei tegen mij: U hebt goed gezien; want Ik zal wakker zijn over Mijn woord, om dat te doen. En het woord van de HEERE kwam voor de tweede keer tot mij, en zei: Wat ziet u? En ik zei: Ik zie een ziedende pot, waarvan het voorste deel tegen het noorden gekeerd is.", "1 Kor 15:32": "Als ik, naar de mens gesproken, tegen wilde dieren gevochten heb in Efeze, wat baat het mij, als de doden niet opgewekt worden? Laten wij eten en drinken, want morgen sterven wij.", "1 Petr 2:7": "Voor u dan, die gelooft, is Hij kostbaar; maar voor de ongehoorzamen geldt: de Steen die de bouwers verworpen hebben, Die is geworden tot een hoeksteen,", "Jes 8:4": "Want voordat dat jongetje kan roepen: Mijn vader! of: mijn moeder!, zal men de rijkdom van Damaskus en de buit van Samaria wegdragen voor de koning van Assur.", "2 Kor 13:1": "Dit is de derde keer dat ik naar u toe kom; op grond van de verklaring van twee of drie getuigen zal elk woord vaststaan.", "Joz 24:12": "En Ik zond horzels voor u uit; die dreven hen voor u weg, zoals de beide koningen van de Amorieten, niet door uw zwaard, en ook niet door uw boog.", "Jes 37:21-35": "Toen zond Jesaja, de zoon van Amoz, naar Hizkia, om te zeggen: Zo zegt de HEERE, de God van Israël: Wat u tot Mij gebeden hebt tegen Sanherib, de koning van Assyrië, heb Ik gehoord. Dit is het woord dat de HEERE over hem gesproken heeft: De jonkvrouw, de dochter van Sion, veracht u, zij bespot u; de dochter van Jeruzalem schudt het hoofd achter u. Wie hebt u gehoond en gelasterd, en tegen wie hebt u de stem verheven en uw ogen omhoog opgeheven? Tegen de Heilige van Israël!", "Hebr 11:18": "(tegen wie gezegd was: In Izak zal uw nageslacht genoemd worden),", "2 Kron 16:2-9": "Toen bracht Asa het zilver en het goud voort, uit de schatten van het huis van de HEERE en van het huis van de koning, en zond het tot Benhadad, de koning van Syrië, die in Damaskus woonde, en zei: Er is een verbond tussen mij en u, en tussen mijn vader en uw vader; zie, ik zend u zilver en goud; ga heen, verbreek uw verbond met Baësa, de koning van Israël, zodat hij van tegen mij aftrekt. En Benhadad hoorde naar de koning Asa, en zond de aanvoerders van de legers die hij had, tegen de steden van Israël, en zij sloegen Ijon, en Dan, en Abel-Maim, en alle schatsteden van Naftali.", "Joh 6:66": "Van toen af gingen velen van Zijn discipelen terug, en liepen niet meer met Hem mee.", "Jes 59:20": "En er zal een Verlosser tot Sion komen, namelijk voor hen die zich bekeren van de overtreding in Jakob, spreekt de HEERE.", "Jer 20:5": "Ook zal Ik al het bezit van deze stad geven, en al haar opbrengst, en al haar kostbaarheden, en alle schatten van de koningen van Juda, Ik zal ze geven in de hand van hun vijanden, die zullen ze roven, ze meenemen en ze naar Babel brengen.", "Rom 12:19": "Wreek uzelf niet, geliefden, maar geef de toorn plaats; want er is geschreven: Mij komt de wraak toe; Ik zal het vergelden, zegt de Heere.", "Jes 51:13": "En u vergeet de HEERE, Die u gemaakt heeft, Die de hemelen heeft uitgebreid, en de aarde gegrond heeft, en u vreest voortdurend de hele dag, vanwege de grimmigheid van de benauwer, wanneer hij zich bereidt om te verderven? Waar is dan de grimmigheid van de benauwer?", "Joh 5:17": "En Jezus antwoordde hun: Mijn Vader werkt tot nu toe, en Ik werk ook.", "Ps 110:4": "De HEERE heeft gezworen, en het zal Hem niet berouwen: U bent Priester in eeuwigheid, naar de ordening van Melchizedek.", "Hebr 7:14": "Want het is duidelijk, dat onze Heere uit Juda voortgekomen is; over die stam heeft Mozes niets gesproken wat het priesterschap betreft.", "2 Kron 25:7": "Maar er kwam een man van God tot hem, en hij zei: O koning! Laat het leger van Israël niet met u meegaan; want de HEERE is niet met Israël, met al de kinderen van Efraïm.", "Gal 3:8": "En de Schrift, die van tevoren zag dat God de heidenen uit het geloof zou rechtvaardigen, heeft van tevoren aan Abraham het Evangelie verkondigd, en zei: In u zullen alle volken gezegend worden.", "Luk 2:35": "(En ook een zwaard zal door uw eigen ziel gaan) opdat de gedachten uit veel harten geopenbaard worden.", "2 Kon 15:25": "En Pekah, de zoon van Remalia, zijn hoofdman, maakte een samenzwering tegen hem, en sloeg hem te Samaria neer, in het paleis van het huis van de koning, samen met Argob en Arje, en met hem vijftig mannen van de kinderen van de Gileadieten; zo doodde hij hem, en werd koning in zijn plaats.", "Rom 9:13": "Zoals geschreven is: Jakob heb Ik liefgehad, en Ezau heb Ik gehaat.", "Ex 20:12-16": "Eer uw vader en uw moeder, opdat uw dagen verlengd worden in het land dat de HEERE, uw God, u geeft. U zult niet doodslaan. U zult geen echtbreuk plegen.", "Luk 4:4": "En Jezus antwoordde hem: Er is geschreven dat de mens niet van brood alleen zal leven, maar van elk woord van God.", "Hebr 4:11": "Laat ons ons dan beijveren om die rust in te gaan, opdat niemand in hetzelfde voorbeeld van ongehoorzaamheid valt.", "1 Tim 3:16": "En buiten alle twijfel, de verborgenheid van de godsvrucht is groot: God is geopenbaard in het vlees, gerechtvaardigd in de Geest, gezien door de engelen, gepredikt onder de heidenen, geloofd in de wereld, opgenomen in heerlijkheid.", "Ps 24:1": "Een psalm van David. De aarde is van de HEERE, alsook haar volheid, de wereld, en zij die daarin wonen.", "2 Kron 28:16": "In diezelfde tijd zond koning Achaz tot de koningen van Assyrië, dat zij hem zouden helpen.", "Ps 68:27": "Looft God in de gemeenten, de Heere, u die uit de bron van Israël bent!", "1 Kor 9:9": "Want in de wet van Mozes staat geschreven: U zult een dorsende os niet muilbanden. Zorgt God soms voor de ossen?", "Matt 4:10": "Toen zei Jezus tegen hem: Ga weg, satan, want er staat geschreven: De Heere, uw God, zult u aanbidden, en Hem alleen dienen.", "2 Kor 10:17": "Maar wie roemt, laat die roemen in de Heere.", "Jer 31:33": "Maar dit is het verbond dat Ik na die dagen met het huis van Israël sluiten zal, spreekt de HEERE: Ik zal Mijn wet in hun binnenste geven, en zal die in hun hart schrijven; en Ik zal hun tot een God zijn, en zij zullen Mij tot een volk zijn.", "Jer 7:11": "Is dan dit huis, dat naar Mijn Naam genoemd is, in uw ogen een schuilplaats van rovers? Zie, Ik heb het ook gezien, spreekt de HEERE.", "Jes 52:7": "Hoe lieflijk zijn op de bergen de voeten van hem die het goede nieuws brengt, die de vrede laat horen; van hem die goed nieuws brengt van het goede, die heil laat horen; van hem die tegen Sion zegt: Uw God is Koning.", "Mark 12:30": "En u zult de Heere, uw God, liefhebben uit heel uw hart, en uit heel uw ziel, en uit heel uw verstand, en uit heel uw kracht. Dit is het eerste gebod.", "Jes 32:12-14": "Men zal rouwklagen over de borsten, over de gewenste akkers, over de vruchtbare wijnstokken. Op het land van mijn volk zal de doorn en de distel opgaan; ja, op alle vreugdehuizen, in de vrolijk huppelende stad. Want het paleis zal verlaten zijn, het gewoel van de stad zal ophouden; Ofel en de wachttorens zullen tot spelonken zijn, tot in eeuwigheid, een vreugde van de woudezels, een weide voor de kudden.", "2 Kon 20:8-11": "Hizkia nu had tegen Jesaja gezegd: Wat is het teken dat de HEERE mij gezond zal maken, en dat ik op de derde dag naar het huis van de HEERE zal opgaan? En Jesaja zei: Dit zal voor u een teken van de HEERE zijn, dat de HEERE het woord dat Hij gesproken heeft, doen zal: zal de schaduw tien graden vooruit gaan, of tien graden achteruit keren? Toen zei Hizkia: Het is voor de schaduw makkelijk om tien graden naar beneden te gaan; nee, maar dat de schaduw tien graden achterwaarts keert.", "Ex 7:15": "Ga in de morgen naar Farao toe; zie, hij zal naar het water toe gaan, stel u dan tegen hem op aan de oever van de rivier, en de staf, die in een slang veranderd was, zult u in uw hand nemen.", "Jes 10:6": "Ik zal hem zenden tegen een huichelachtig volk, en Ik zal hem bevel geven tegen het volk van Mijn verbolgenheid; opdat hij de roof rooft, en plundert de plundering, en het stelt ter vertreding, als het slijk van de straten.", "Joh 12:45": "En wie Mij ziet, ziet Hem Die Mij gezonden heeft.", "Hagg 2:7": "Want zo zegt de HEERE van de heerscharen: Nog eenmaal, over een korte tijd, zal het zover zijn; en Ik zal de hemel, en de aarde, en de zee, en het droge doen beven.", "Hebr 3:7-11": "Daarom, zoals de Heilige Geest zegt: Heden, als u Zijn stem hoort, Verhard uw harten niet, zoals bij de verbittering, op de dag van de beproeving, in de woestijn; Waar uw vaders Mij beproefden; zij hebben Mij op de proef gesteld, en hebben Mijn werken gezien, veertig jaar lang.", "Jes 42:1-4": "Zie, Mijn Knecht, Die Ik ondersteun, Mijn Uitverkorene, in Wie Mijn ziel een welbehagen heeft! Ik heb Mijn Geest op Hem gegeven; Hij zal het recht aan de heidenen voortbrengen. Hij zal niet schreeuwen, noch Zijn stem verheffen, noch Zijn stem op straat horen laten. Het geknakte riet zal Hij niet breken, en de rokende vlaswiek zal Hij niet uitblussen; met waarheid zal Hij het recht voortbrengen.", "2 Kron 20:20": "En zij stonden 's morgens vroeg op en trokken naar de woestijn van Thekoa; en toen zij optrokken, stond Josafat en zei: Hoor mij, o Juda, en u, inwoners van Jeruzalem! Geloof in de HEERE, uw God, dan zult u standhouden; geloof Zijn profeten, dan zult u voorspoedig zijn.", "1 Kor 2:8": "Welke niemand van de leiders van deze wereld gekend heeft; want als zij haar gekend hadden, zouden zij de Heere der heerlijkheid niet gekruisigd hebben.", "Luk 20:17": "Maar Hij keek hen aan en zei: Wat betekent dan wat er geschreven staat: De steen die de bouwers verworpen hebben, die is de hoeksteen geworden?", "Jes 28:11": "Daarom zal Hij door belachelijke lippen en door een andere tong tot dit volk spreken;", "2 Kon 15:29": "In de dagen van Pekah, de koning van Israël, kwam Tiglath-Pilezer, de koning van Assyrië, en nam Ijon in, en Abel-Beth-Maächa, en Janoah, en Kedes, en Hazor, en Gilead, en Galilea, het hele land van Nafthali; en hij voerde hen weg naar Assyrië.", "Hand 3:25": "U bent kinderen van de profeten, en van het verbond dat God met onze vaderen gesloten heeft, toen Hij tegen Abraham zei: En in uw nageslacht zullen alle geslachten van de aarde gezegend worden.", "Zach 11:13": "Doch de HEERE zei tegen mij: Werp ze heen voor de pottenbakker: een heerlijke prijs, die Ik van hen waard geacht ben geweest! En ik nam die dertig zilverlingen, en wierp ze in het huis van de HEERE, voor de pottenbakker.", "Gal 1:1": "Paulus, een apostel, geroepen niet vanuit mensen, ook niet door een mens, maar door Jezus Christus, en God de Vader, Die Hem uit de doden heeft opgewekt,", "Ps 106:24": "Zij versmaadden ook het gewenste land; zij geloofden Zijn woord niet.", "Hand 13:47": "Want zo heeft de Heere ons geboden: Ik heb u gesteld tot een licht voor de heidenen, opdat u tot zaligheid zou zijn, tot aan het uiterste van de aarde.", "Joh 19:24": "Zij zeiden dan tegen elkaar: Laten wij die niet scheuren, maar erom loten, van wie die zal zijn; opdat de Schrift vervuld wordt, die zegt: Zij hebben Mijn kleren onder elkaar verdeeld, en over Mijn kleding hebben zij het lot geworpen. Dit hebben de soldaten dan gedaan.", "Gen 17:7": "En Ik zal Mijn verbond oprichten tussen Mij en u, en uw nageslacht na u, in hun geslachten, tot een eeuwig verbond, om u en uw nageslacht na u tot een God te zijn.", "Num 20:13": "Dit zijn de wateren van Meriba, waar de kinderen van Israël met de HEERE getwist hebben; en Hij werd aan hen geheiligd.", "Ezech 16:20": "Verder hebt u uw zonen en uw dochters, die u Mij gebaard had, genomen, en hebt ze aan hen geofferd om verteerd te worden; is het iets kleins van uw hoererijen,", "1 Sam 1:20": "En het gebeurde, na verloop van dagen, dat Hanna zwanger werd, en een zoon baarde, en zij noemde zijn naam Samuël: Want, zei ze, ik heb hem van de HEERE gebeden.", "2 Kor 5:16": "Zo kennen wij van nu af aan niemand meer naar het vlees; en al hebben wij ook Christus naar het vlees gekend, toch kennen wij Hem nu niet meer naar het vlees.", "Luk 16:31": "Doch Abraham zei tegen hem: Als zij Mozes en de profeten niet horen, zullen zij zich ook niet laten overtuigen, zelfs al zou iemand uit de doden opstaan.", "Jes 7:16-25": "Zeker, voordat dit Knechtje weet het kwade te verwerpen en het goede te verkiezen, zal dat land, waarvoor u zo bang bent, verlaten zijn door zijn twee koningen. Maar de HEERE zal over u, en over uw volk, en over het huis van uw vader, dagen doen komen, wat voor dagen niet gekomen zijn vanaf de dag dat Efraïm van Juda is afgeweken, door de koning van Assyrië. Want het zal op die dag gebeuren, dat de HEERE zal fluiten naar de vliegen, die aan het einde van de rivieren van Egypte zijn, en naar de bijen die in het land van Assyrië zijn.", "Deut 5:16": "Eer uw vader en uw moeder, zoals de HEERE, uw God, u geboden heeft, opdat uw dagen verlengd worden, en opdat het u goed gaat in het land dat de HEERE, uw God, u geven zal.", "Hand 1:20": "Want er staat geschreven in het boek van de Psalmen: Zijn woonstede moet woest worden, en er mag niemand zijn die erin woont. En: Een ander moet zijn opzienersambt overnemen.", "Mark 5:6": "Toen hij nu Jezus van verre zag, rende hij ernaartoe, en aanbad Hem.", "Rom 11:8": "(Zoals geschreven is: God heeft hun een geest van diepe slaap gegeven; ogen om niet te zien, en oren om niet te horen) tot op deze huidige dag.", "Jes 20:1": "In het jaar dat Tartan naar Asdod kwam, toen Sargon, de koning van Assyrië, hem gezonden had, toen hij oorlog voerde tegen Asdod en het innam;", "Tit 2:13": "Verwachtend de zalige hoop en verschijning van de heerlijkheid van de grote God en onze Zaligmaker Jezus Christus;", "Rom 13:9": "Want dit: u zult geen overspel doen, u zult niet doden, u zult niet stelen, u zult geen valse getuigenis geven, u zult niet begeren; en als er nog enig ander gebod is, wordt het in dit woord samengevat, namelijk in dit: u zult uw naaste liefhebben als uzelf.", "Matt 11:7": "Toen nu deze mensen weggingen, begon Jezus tot de menigten te zeggen van Johannes: Wat bent u uitgegaan te zien in de woestijn? Een riet, dat door de wind heen en weer bewogen wordt?", "1 Kor 3:20": "En opnieuw: De Heere kent de overleggingen van de wijzen, dat zij nutteloos zijn.", "Jes 30:2": "Die gaan om af te trekken naar Egypte, en vragen Mijn mond niet; om zich te sterken met de macht van Farao, en om hun toevlucht te nemen onder de schaduw van Egypte.", "Jes 55:7": "De goddeloze verlaat zijn weg, en de onrechtvaardige man zijn gedachten; en hij bekeert zich tot de HEERE, zo zal Hij Zich over hem ontfermen, en tot onze God, want Hij vergeeft menigvuldig.", "Jes 29:13": "Want de Heere heeft gezegd: Omdat dit volk tot Mij nadert met zijn mond, en zij Mij met hun lippen eren, maar hun hart ver van Mij houden; en hun vrees, waarmee zij Mij vrezen, mensengeboden zijn, die hun geleerd zijn;", "1 Kon 22:1-4": "En zij bleven drie jaar stil, zodat er geen oorlog was tussen Syrië en Israël. En het gebeurde in het derde jaar, dat Josafat, de koning van Juda, naar de koning van Israël afkwam. Toen zei de koning van Israël tegen zijn knechten: Weet u dat Ramoth in Gilead van ons is? En wij blijven stil, zonder het uit de hand van de koning van Syrië te nemen.", "1 Kor 1:18": "Want het woord van het kruis is voor hen die verloren gaan wel dwaasheid; maar voor ons, die behouden worden, is het een kracht van God;", "Matt 2:3": "Toen koning Herodes dit hoorde, werd hij ontroerd, en heel Jeruzalem met hem.", "Luk 24:26": "Moest de Christus deze dingen niet lijden, en zo in Zijn heerlijkheid ingaan?", "1 Kon 12:16": "Toen heel Israël zag dat de koning niet naar hen hoorde, gaf het volk de koning antwoord terug en zei: Wat deel hebben wij aan David? Ja, wij hebben geen erfdeel aan de zoon van Isaï; naar uw tenten, o Israël! Zie nu naar uw eigen huis om, o David! Zo ging Israël naar zijn tenten.", "2 Tess 2:12": "opdat zij allen veroordeeld worden, die de waarheid niet geloofd hebben, maar een welbehagen hebben gehad in de onrechtvaardigheid.", "Hebr 4:15": "Want wij hebben geen Hogepriester Die geen medelijden kan hebben met onze zwakheden, maar Die in alle dingen, net als wij, beproefd is geweest, doch zonder zonde.", "Jes 49:6": "Verder zei Hij: Het is te gering, dat U Mij een Knecht zou zijn, om op te richten de stammen van Jakob, en om terug te brengen de bewaarden in Israël; Ik heb U ook gegeven tot een Licht van de heidenen, om Mijn heil te zijn tot aan het einde van de aarde.", "Matt 13:58": "En Hij heeft daar niet veel krachten gedaan, vanwege hun ongeloof.", "Matt 21:33": "Hoor een andere gelijkenis. Er was een heer des huizes, die een wijngaard plantte en er een omheining omheen zette, en er een wijnpersbak in groef, en een toren bouwde, en hem verhuurde aan landbouwers, en op reis ging naar het buitenland.", "Rom 1:18": "Want de toorn van God wordt geopenbaard van de hemel over alle goddeloosheid en ongerechtigheid van de mensen, die de waarheid in ongerechtigheid ten onder houden.", "1 Kor 1:22": "Omdat de Joden een teken begeren, en de Grieken wijsheid zoeken;", "Ps 95:8-11": "Verhard uw hart niet, zoals te Meriba, zoals ten dage van Massa in de woestijn; Waar uw vaders Mij verzochten, Mij beproefden, ook Mijn werk zagen. Veertig jaren heb Ik verdriet gehad aan dit geslacht, en heb gezegd:
