hten.", "Luk 20:42": "En David zelf zegt in het boek van de Psalmen: De Heere heeft gezegd tegen mijn Heere: Zit aan Mijn rechterhand,", "1 Joh 5:20": "Maar wij weten dat de Zoon van God gekomen is, en ons het verstand gegeven heeft, opdat wij de Waarachtige kennen; en wij zijn in de Waarachtige, namelijk in Zijn Zoon Jezus Christus. Deze is de waarachtige God, en het eeuwige Leven.", "2 Kon 22:16": "Zo zegt de HEERE: Zie, Ik zal onheil brengen over deze plaats, en over haar inwoners, namelijk alle woorden van het boek dat de koning van Juda gelezen heeft.", "Mal 1:2": "Ik heb u liefgehad, zegt de HEERE; maar u zegt: Waarin hebt U ons liefgehad? Was Ezau niet Jakobs broeder? spreekt de HEERE; toch heb Ik Jakob liefgehad,", "Ps 22:23": "Zo zal ik Uw Naam aan mijn broeders vertellen; in het midden van de gemeente zal ik U prijzen.", "Rom 1:17": "Want de rechtvaardigheid van God wordt daarin geopenbaard uit geloof tot geloof; zoals geschreven is: Maar de rechtvaardige zal uit het geloof leven.", "Ex 20:12-17": "Eer uw vader en uw moeder, opdat uw dagen verlengd worden in het land dat de HEERE, uw God, u geeft. U zult niet doodslaan. U zult geen echtbreuk plegen.", "Rom 8:3": "Want wat voor de wet onmogelijk was, omdat zij door het vlees krachteloos was, dat heeft God gedaan: Hij heeft Zijn eigen Zoon gezonden in de gelijkenis van het zondige vlees, en dat voor de zonde, en Hij heeft de zonde veroordeeld in het vlees.", "Ezech 23:22-35": "Daarom, o Oholiba! Zo zegt de Heere HEERE: Zie, Ik zal uw minnaars, van wie uw ziel is afgekeerd, tegen u opwekken, en Ik zal hen van rondom tegen u aanbrengen. De zonen van Babel en alle Chaldeeën, Pekod, en Soa, en Koa, en alle zonen van Assur met hen; aantrekkelijke jonge mannen, die allen vorsten en machthebbers zijn, hoofdmannen en vermaarde mannen, die allen te paard rijden. Die zullen tegen u komen met karren, wagens en wielen, en met een menigte van volken, met kleine schilden, grote schilden, en helmen; zij zullen zich rondom tegen u opstellen; en Ik zal voor hun aangezicht het strafgericht neerleggen, en zij zullen u berechten naar hun rechtsregels.", "Rom 12:9": "De liefde moet ongeveinsd zijn. Heb een afkeer van het kwade, en houd vast aan het goede.", "2 Tim 1:2": "Aan Timotheüs, mijn geliefde zoon: genade, barmhartigheid, vrede zij u van God de Vader, en Christus Jezus, onze Heere.", "1 Kor 10:26": "want de aarde is van de Heere, en al wat zij bevat.", "Jer 4:26": "Ik keek, en zie, het vruchtbare land was een woestijn, en al zijn steden waren afgebroken, vanwege de HEERE, vanwege de gloed van Zijn toorn.", "Jer 48:37": "Want alle hoofden zijn kaal, en alle baarden afgeknipt; op alle handen zijn insnijdingen, en op de lenden is een rouwkleed.", "Jer 9:24": "Maar wie zich beroemt, beroemt zich hierin, dat hij begrijpt, en Mij kent, dat Ik de HEERE ben, Die weldadigheid, recht en gerechtigheid doe op de aarde, want in die dingen heb Ik behagen, spreekt de HEERE.", "Gen 46:26": "Al de zielen die met Jakob naar Egypte kwamen, uit zijn heup voortgekomen, behalve de vrouwen van de zonen van Jakob, waren allen zesenzestig zielen.", "Gen 4:2": "En zij baarde verder zijn broeder Abel; en Abel werd een schaapherder, en Kaïn werd een landbouwer.", "Rom 9:28": "Want Hij voltooit een zaak en snijdt haar af in rechtvaardigheid; want de Heere zal een afgesneden zaak doen op de aarde.", "Ex 14:14": "De HEERE zal voor u strijden, en u zult stil zijn.", "Luk 14:16-24": "Maar Hij zei tegen hem: Een zeker mens bereidde een groot avondmaal, en nodigde er velen voor uit. En hij stuurde zijn dienstknecht op het uur van het avondmaal om tegen de genodigden te zeggen: Kom, want alles is nu klaar. En zij begonnen allen eensgezind zich te verontschuldigen. De eerste zei tegen hem: Ik heb een akker gekocht, en ik moet er wel op uitgaan om die te bekijken; ik vraag u, houd mij voor verontschuldigd.", "Mark 7:7": "Maar tevergeefs eren zij Mij, omdat zij leringen onderwijzen die geboden zijn van mensen;", "Mal 1:7": "U brengt op Mijn altaar verontreinigd brood, en zegt: Waarmee verontreinigen wij U? Daarmee, dat u zegt: De tafel van de HEERE is verachtelijk.", "2 Kor 6:14-16": "Trek niet een ander juk aan met de ongelovigen; want wat heeft de gerechtigheid gemeen met de ongerechtigheid, en welke gemeenschap heeft het licht met de duisternis? En welke overeenstemming heeft Christus met Belial, of welk deel heeft de gelovige met de ongelovige? Of welke samenvoeging heeft de tempel van God met de afgoden? Want u bent de tempel van de levende God; zoals God gezegd heeft: Ik zal in hen wonen, en Ik zal onder hen wandelen; en Ik zal hun God zijn, en zij zullen Mij een volk zijn.", "Richt 1:3": "Toen zei Juda tegen zijn broeder Simeon: Trek met mij op in mijn lot, en laten we tegen de Kanaänieten strijden, dan zal ik ook met u optrekken in uw lot. Zo ging Simeon met hem mee.", "Matt 12:17-21": "Opdat vervuld zou worden wat gesproken is door de profeet Jesaja, die zei: Zie, Mijn Knecht, Die Ik uitgekozen heb; Mijn Beminde, in Wie Mijn ziel een welbehagen heeft; Ik zal Mijn Geest op Hem leggen, en Hij zal het oordeel aan de heidenen verkondigen. Hij zal niet twisten, en niet roepen, en niemand zal Zijn stem op de straten horen.", "Hos 6:6": "Want Ik heb lust tot liefde, en niet tot offer; en tot de kennis van God, meer dan tot brandoffers.", "Rom 15:9": "en dat de heidenen God zouden verheerlijken vanwege de barmhartigheid; zoals geschreven is: Daarom zal ik U belijden onder de heidenen, en Uw Naam lofzingen.", "2 Kon 22:17": "Omdat zij Mij verlaten hebben, en voor andere goden reukwerk gebrand hebben, om Mij tot toorn te verwekken met al het werk van hun handen, zal Mijn grimmigheid ontstoken worden tegen deze plaats, en niet uitgeblust worden.", "Ex 20:7": "U zult de naam van de HEERE, uw God, niet ijdel gebruiken; want de HEERE zal niet onschuldig houden wie Zijn naam ijdel gebruikt.", "Matt 22:38": "Dit is het eerste en het grootste gebod.", "Rom 9:33": "zoals geschreven is: Zie, Ik leg in Sion een steen des aanstoots, en een rots der ergernis; en ieder die in Hem gelooft, zal niet beschaamd worden.", "2 Kor 3:13": "en doen niet zoals Mozes, die een sluier op zijn gezicht legde, opdat de kinderen van Israël niet strak zouden kijken naar het einde van wat teniet gedaan wordt.", "Gen 18:10": "En Hij zei: Ik zal zeker bij u terugkomen, omstreeks deze tijd volgend jaar; en zie, Sara, uw vrouw, zal een zoon hebben! En Sara hoorde het aan de deur van de tent, die achter Hem was.", "Jes 29:14": "daarom, zie, Ik zal verder wonderlijk handelen met dit volk, wonderlijk en wonderbaarlijk; want de wijsheid van zijn wijzen zal vergaan, en het verstand van zijn verstandigen zal zich verbergen.", "Matt 17:17": "Jezus antwoordde en zei: O ongelovig en verkeerd geslacht, hoe lang zal Ik nog bij u zijn, hoe lang zal Ik u nog verdragen? Breng hem hier bij Mij.", "Luk 4:10": "Want er is geschreven dat Hij Zijn engelen bevelen zal geven over U, dat zij U bewaren zullen;", "Matt 9:6": "Maar om te laten weten dat de Zoon des mensen macht heeft op de aarde om de zonden te vergeven — toen zei Hij tegen de verlamde man: Sta op, neem uw bed op, en ga naar uw huis.", "Jer 22:1": "Zo zegt de HEERE: Ga naar het huis van de koning van Juda, en spreek daar dit woord.", "Deut 27:26": "Vervloekt is hij die de woorden van deze wet niet bevestigt door ze te doen! En heel het volk zal zeggen: Amen.", "Jes 58:11": "En de HEERE zal u voortdurend leiden, en Hij zal uw ziel verzadigen in grote droogte, en uw beenderen sterk maken; en u zult zijn als een gewaterde hof, en als een springader van water, waarvan het water niet ontbreekt.", "Matt 26:56": "maar dit alles is gebeurd, opdat de Schriften van de profeten vervuld zouden worden. Toen vluchtten alle discipelen en lieten Hem in de steek.", "Ex 32:1-6": "Toen het volk zag dat Mozes lang wegbleef om van de berg af te komen, verzamelde het volk zich bij Aäron, en zij zeiden tegen hem: Sta op, maak ons goden, die voor ons uit gaan; want van deze Mozes, die man die ons uit Egypteland heeft weggeleid, weten wij niet wat er van hem geworden is. Aäron zei tegen hen: Rukt de gouden oorringen af, die in de oren van uw vrouwen, uw zonen en uw dochters zijn, en breng ze bij mij. Toen rukte heel het volk de gouden oorringen af die in hun oren waren, en zij brachten ze bij Aäron.", "Jes 30:15": "Want zo zegt de Heere HEERE, de Heilige van Israël: Door terugkering en rust zou u behouden worden, in stilte en in vertrouwen zou uw sterkte zijn; maar u hebt niet gewild.", "Joh 1:2": "Dit was in het begin bij God.", "Hos 6:4": "Wat zal Ik u doen, o Efraïm! Wat zal Ik u doen, o Juda! Want uw liefde is als een morgenwolk, en als de dauw die vroeg komt en weer heengaat.", "Mark 5:7": "En met luide stem roepend, zei hij: Wat heb ik met U te maken, Jezus, Zoon van God, de Allerhoogste? Ik bezweer U bij God, dat U mij niet pijnigt!", "Luk 13:35": "Zie, uw huis wordt aan u woest achtergelaten. En voorwaar, Ik zeg u, dat u Mij niet zult zien, totdat de tijd zal zijn gekomen dat u zult zeggen: Gezegend is Hij Die komt in de Naam van de Heere!", "Jes 7:17-25": "Maar de HEERE zal over u, en over uw volk, en over het huis van uw vader, dagen doen komen, wat voor dagen niet gekomen zijn vanaf de dag dat Efraïm van Juda is afgeweken, door de koning van Assyrië. Want het zal op die dag gebeuren, dat de HEERE zal fluiten naar de vliegen, die aan het einde van de rivieren van Egypte zijn, en naar de bijen die in het land van Assyrië zijn. En zij zullen komen, en zij zullen allemaal neerstrijken in de woeste dalen, en in de kloven van de rotsen, en op alle doornhagen, en op alle geprezen plaatsen.", "Jes 53:4": "Waarlijk, Hij heeft onze ziekten op Zich genomen, en onze smarten heeft Hij gedragen; maar wij hielden Hem voor een geplaagde, door God geslagen en verdrukt.", "1 Joh 1:1-3": "Wat er was van het begin af, wat wij gehoord hebben, wat wij gezien hebben met onze ogen, wat wij aanschouwd hebben, en onze handen getast hebben, van het Woord des levens; (Want het Leven is geopenbaard, en wij hebben het gezien, en wij getuigen, en verkondigen u dat eeuwige Leven, Dat bij de Vader was, en ons geopenbaard is.) Wat wij dan gezien en gehoord hebben, dat verkondigen wij u, opdat ook u met ons gemeenschap zou hebben, en deze onze gemeenschap ook is met de Vader, en met Zijn Zoon Jezus Christus.", "Matt 27:10": "en zij hebben die gegeven voor de akker van de pottenbakker, zoals de Heere mij bevolen heeft.", "Jes 1:24": "Daarom spreekt de Heere, HEERE van de heerscharen, de Machtige van Israël: O wee! Ik zal Mij troosten over Mijn tegenstanders. Ik zal Mij wreken op Mijn vijanden.", "Matt 24:14-42": "En dit Evangelie van het Koninkrijk zal in de hele wereld gepredikt worden tot een getuigenis voor alle volken; en dan zal het einde komen. Wanneer u dan de gruwel van de verwoesting zal zien, waarvan gesproken is door Daniël de profeet, staande op de heilige plaats (die het leest, laat hij daarop letten!), laat dan wie in Judea zijn, vluchten naar de bergen;", "Ps 8:5-7": "Wat is de mens, dat U aan hem denkt, en de zoon des mensen, dat U hem bezoekt? En hebt U hem een weinig minder gemaakt dan de engelen, en hebt U hem met eer en heerlijkheid gekroond? U doet hem heersen over de werken van Uw handen; U hebt alles onder zijn voeten gezet;", "Luk 20:43": "totdat Ik Uw vijanden tot een voetbank voor Uw voeten zal gezet hebben.", "Ezech 16:47": "Toch hebt u niet in hun wegen gewandeld, noch naar hun gruwelen gedaan; het was iets van het geringe, een verdriet; maar u hebt het meer verdorven dan zij, in al uw wegen.", "Joh 10:25": "Jezus antwoordde hun: Ik heb het u gezegd, en u gelooft het niet. De werken die Ik doe in de Naam van Mijn Vader, die getuigen van Mij.", "Ps 2:9": "U zult hen verpletteren met een ijzeren scepter; U zult hen in stukken slaan als een pottenbakkersvat.", "Jer 12:13": "Zij hebben tarwe gezaaid, maar doornen gemaaid; zij hebben zich gepijnigd, maar niet gevorderd; word zo beschaamd vanwege uw inkomsten, vanwege de gloed van de toorn van de HEERE.", "Rom 11:9": "En David zegt: Hun tafel moet worden tot een strik, en tot een val, en tot een aanstoot, en tot een vergelding voor hen.", "Hebr 5:5": "Zo heeft ook Christus Zichzelf niet verheerlijkt om Hogepriester te worden, maar Hij die tot Hem gesproken heeft: U bent Mijn Zoon, heden heb Ik U gegenereerd.", "Ps 132:17": "Daar zal Ik David een hoorn doen uitspruiten; Ik heb voor Mijn Gezalfde een lamp klaargemaakt.", "Jes 24:2": "En zoals het met het volk zal gaan, zo zal het met de priester zijn; zoals met de knecht, zo met zijn heer; zoals met de dienstmaagd, zo met haar vrouw; zoals met de koper, zo met de verkoper; zoals met de lener, zo met de ontlener; zoals met de woekeraar, zo met hem van wie hij woeker ontvangt.", "Ex 8:24": "En de HEERE deed zo; en er kwam een zware vermenging van ongedierte in het huis van Farao, en in de huizen van zijn knechten, en over heel Egypteland; het land werd verdorven door deze vermenging.", "Ezech 33:31": "En zij komen tot u, zoals het volk gewoon is te komen, en zitten voor uw aangezicht als Mijn volk, en horen uw woorden, maar zij doen ze niet; want zij spreken lieve woorden met hun mond, maar hun hart gaat hun hebzucht na.", "Jes 9:1-5": "Het volk dat in duisternis wandelt, zal een groot licht zien; wie wonen in het land van de schaduw van de dood, over hen zal een licht schijnen. U hebt dit volk vermenigvuldigd, maar U hebt de blijdschap niet groot gemaakt; zij zullen toch blij zijn voor Uw aangezicht, zoals men zich verblijdt bij de oogst, zoals men zich verheugt wanneer men de buit uitdeelt. Want het juk van hun last, en de stok van hun schouders, en de staf van hem die hen dreef, hebt U verbroken, zoals op de dag van de Midianieten;", "2 Kron 28:1-6": "Achaz was twintig jaar oud toen hij koning werd, en hij regeerde zestien jaar in Jeruzalem; en hij deed niet wat recht was in de ogen van de HEERE, zoals zijn vader David. Maar hij wandelde in de wegen van de koningen van Israël; daartoe maakte hij ook gegoten beelden voor de Baäls. Hij brandde ook reukwerk in het dal van de zoon van Hinnom, en hij verbrandde zijn zonen in het vuur, naar de gruwelen van de heidenen die de HEERE voor het aangezicht van de kinderen van Israël uit hun bezit verdreven had.", "1 Kor 15:27": "Want Hij heeft alle dingen aan Zijn voeten onderworpen. Maar wanneer Hij zegt dat Hem alle dingen onderworpen zijn, dan is het duidelijk dat Hij Zelf wordt uitgezonderd, Die Hem alle dingen onderworpen heeft.", "Rom 9:25": "Zoals Hij ook bij Hosea zegt: Ik zal hen die Mijn volk niet waren, Mijn volk noemen, en haar die niet bemind was, Mijn beminde.", "Jes 38:7": "En dit zal u een teken zijn van de HEERE, dat de HEERE het woord dat Hij gesproken heeft, doen zal:", "Ps 51:6": "Tegen U, U alleen, heb ik gezondigd, en gedaan wat kwaad is in Uw ogen; opdat U rechtvaardig bent in Uw spreken, en rein bent in Uw oordelen.", "Ps 40:9": "Ik heb lust, o mijn God! om Uw welbehagen te doen; en Uw wet is in het midden van mijn ingewand.", "Hand 7:40": "en zeiden tegen Aäron: Maak ons goden, die voor ons uit gaan; want wat deze Mozes betreft, die ons uit het land van Egypte geleid heeft, wij weten niet wat er met hem gebeurd is.", "Mal 1:3": "en Ezau heb Ik gehaat; en Ik heb zijn bergen gesteld tot een verwoesting, en zijn erfdeel voor de jakhalzen van de woestijn.", "Rom 10:21": "Maar tegen Israël zegt Hij: De hele dag heb Ik Mijn handen uitgestrekt naar een ongehoorzaam en tegensprekend volk.", "Rom 11:30-32": "Want zoals ook u eertijds God ongehoorzaam geweest bent, maar nu barmhartigheid verkregen hebt door hun ongehoorzaamheid; Zo zijn ook dezen nu ongehoorzaam geweest, opdat ook zij door uw barmhartigheid barmhartigheid zouden verkrijgen. Want God heeft hen allen onder de ongehoorzaamheid besloten, opdat Hij hun allen barmhartig zou zijn.", "Lev 26:36": "En wat betreft de overgeblevenen onder u, Ik zal in hun hart een angstige zwakheid laten komen in de landen van hun vijanden; zodat het geruis van een opgejaagd blad hen zal opjagen, en zij zullen vluchten, zoals men vlucht voor een zwaard, en zullen vallen, terwijl niemand hen opjaagt.", "Luk 10:27": "En hij antwoordde: U zult de Heere, uw God, liefhebben met heel uw hart, en met heel uw ziel, en met heel uw kracht, en met heel uw verstand; en uw naaste als uzelf.", "Jes 25:8": "Hij zal de dood verslinden tot overwinning, en de Heere HEERE zal de tranen van alle aangezichten afwissen; en Hij zal de smaad van Zijn volk van de hele aarde wegnemen; want de HEERE heeft het gesproken.", "Mark 10:7": "Daarom zal een man zijn vader en zijn moeder verlaten, en zich aan zijn vrouw hechten;", "Luk 1:16": "En hij zal velen van de kinderen van Israël bekeren tot de Heere, hun God.", "Deut 18:15": "Een Profeet uit uw midden, uit uw broeders, zoals ik, zal de HEERE, uw God, u doen opstaan; naar Hem zult u luisteren,", "Jer 27:6": "En nu, Ik heb al deze landen gegeven in de hand van Nebukadnezar, de koning van Babel, Mijn knecht; zelfs ook de dieren van het veld heb Ik hem gegeven, om hem te dienen.", "Deut 7:20": "Daarbij zal de HEERE, uw God, ook horzels onder hen zenden, totdat zij die overgebleven zijn en zich voor uw aangezicht verborgen hebben, zijn omgekomen.", "Matt 27:35": "Nadat zij Hem gekruisigd hadden, verdeelden zij Zijn kleren, door het lot te werpen; opdat vervuld zou worden wat gezegd is door de profeet: Zij hebben Mijn kleren onder elkaar verdeeld, en over Mijn kleding hebben zij het lot geworpen.", "Rom 11:20": "Het is wel; zij zijn door ongeloof afgebroken, en u staat door het geloof. Wees niet hoogmoedig, maar vrees.", "Mark 10:8": "en die twee zullen tot één vlees zijn, zodat zij niet meer twee zijn, maar één vlees.", "Joh 14:30": "Ik zal niet meer veel met u spreken; want de leider van deze wereld komt, en heeft aan Mij niets.", "Jes 66:2": "Want Mijn hand heeft al deze dingen gemaakt, en al deze dingen zijn geweest, spreekt de HEERE; maar op deze zal Ik zien, op de arme en verslagene van geest, en die voor Mijn woord beeft.", "Jes 14:27": "Want de HEERE van de heerscharen heeft het in Zijn raad besloten, wie zal het dan verbreken? en Zijn hand is uitgestrekt, wie zal die dan keren?", "Mark 15:24": "En toen zij Hem gekruisigd hadden, verdeelden zij Zijn kleren, en wierpen het lot erover, wat ieder zou wegnemen.", "Hand 13:23": "Uit het nageslacht van deze heeft God, naar de belofte, voor Israël de Zaligmaker Jezus verwekt;", "Ef 5:31": "Daarom zal een mens zijn vader en moeder verlaten, en zal zich aan zijn vrouw hechten; en die twee zullen tot één vlees worden.", "1 Kor 2:9": "Maar zoals geschreven is: Wat het oog niet heeft gezien, en het oor niet heeft gehoord, en in het hart van de mens niet is opgekomen, dat wat God bereid heeft voor hen die Hem liefhebben.", "Micha 7:17": "Zij zullen het stof lekken, als de slang; als kruipende dieren van de aarde, zullen zij sidderend tevoorschijn komen uit hun schuilhoeken; zij zullen met vervaardheid komen tot de HEERE, onze God, en zullen voor U vrezen.", "Ex 3:5-10": "En Hij zei: Kom hier niet dichterbij; trek uw schoenen uit van uw voeten; want de plaats waarop u staat, is heilig land. Hij zei verder: Ik ben de God van uw vader, de God van Abraham, de God van Izak en de God van Jakob. En Mozes verborg zijn gezicht, want hij was bang om God aan te zien. En de HEERE zei: Ik heb heel goed gezien de verdrukking van Mijn volk dat in Egypte is, en heb hun geschrei gehoord vanwege hun drijvers; want Ik ken hun smarten.", "Rom 10:18": "Maar ik zeg: Hebben zij het niet gehoord? Zeker wel, hun geluid is over de hele aarde uitgegaan, en hun woorden tot de einden van de wereld.", "Jes 8:9": "Verzamel u samen, volken! Toch zult u verbroken worden; en neem het ter ore, allen die in verre landen bent, omgord u, toch zult u verbroken worden; omgord u, toch zult u verbroken worden!", "Ex 20:11": "want in zes dagen heeft de HEERE de hemel en de aarde gemaakt, de zee en alles wat daarin is, en Hij rustte op de zevende dag; daarom zegende de HEERE de sabbatdag en heiligde hem.", "Ps 89:21": "Ik heb David, Mijn knecht, gevonden; met Mijn heilige olie heb Ik hem gezalfd;", "Matt 9:13": "Ga heen en leer wat dit betekent: Ik wil barmhartigheid, en geen offerande; want Ik ben niet gekomen om rechtvaardigen te roepen, maar zondaars, tot bekering.", "Mal 3:15": "En nu, wij achten de hoogmoedigen gelukzalig; ook wie goddeloosheid doen, worden gebouwd; ook verzoeken zij de HEERE, en ontkomen.", "Gen 1:27": "En God schiep de mens naar Zijn beeld; naar het beeld van God schiep Hij hem; man en vrouw schiep Hij hen.", "Matt 1:16-18": "en Jakob verwekte Jozef, de man van Maria, uit wie geboren is JEZUS, Die Christus genoemd wordt. Al de geslachten dus, van Abraham tot David, zijn veertien geslachten; en van David tot de Babylonische wegvoering veertien geslachten; en van de Babylonische wegvoering tot Christus veertien geslachten. De geboorte van Jezus Christus was nu als volgt. Toen Maria, Zijn moeder, met Jozef in ondertrouw was, bleek zij, voordat zij samengekomen waren, zwanger te zijn uit de Heilige Geest.", "Jes 1:5": "Waartoe zou u nog meer geslagen worden? U zou van het afval des te meer maken; het hele hoofd is ziek, en het hele hart is mat.", "Jes 13:20-22": "Daar zal in eeuwigheid geen woonplaats zijn, en zij zal niet bewoond worden van geslacht tot geslacht; en de Arabier zal daar geen tent opzetten, en de herders zullen er niet legeren. Maar daar zullen de wilde dieren van de woestijnen neerliggen, en hun huizen zullen vervuld worden met angstaanjagende dieren, en daar zullen de jonge struisvogels wonen, en de bokachtige demonen zullen er springen. En wilde dieren van de eilanden zullen in zijn verlaten plaatsen elkaar toeroepen, alsook de draken in de weelderige paleizen; zijn tijd is immers nabij om te komen, en zijn dagen zullen niet verlengd worden.", "Matt 8:29": "En zie, zij riepen: Jezus, Zoon van God, wat hebben wij met U te maken? Bent U hier gekomen om ons te pijnigen vóór de tijd?", "2 Kon 18:1": "Het gebeurde nu in het derde jaar van Hosea, de zoon van Ela, de koning van Israël, dat Hizkia koning werd, de zoon van Achaz, koning van Juda.", "Jes 54:13": "En al uw kinderen zullen door de HEERE geleerd zijn, en de vrede van uw kinderen zal groot zijn.", "Hand 7:37-39": "Dit is de Mozes die tegen de kinderen van Israël gezegd heeft: De Heere, uw God, zal u een Profeet doen opstaan uit uw broeders, zoals mij; naar Hem zult u luisteren. Dit is degene die in de samenkomst van het volk in de woestijn was, samen met de engel die tot hem sprak op de berg Sinaï, en met onze vaders; die de levende woorden ontving, om ons die te geven, aan wie onze vaders niet gehoorzaam wilden zijn, maar zij verwierpen hem, en keerden zich met hun hart weer naar Egypte,", "Hand 7:43": "Ja, u hebt de tent van Moloch opgenomen, en de ster van uw god Remfan, de beelden die u gemaakt hebt om die te aanbidden; en Ik zal u wegvoeren tot voorbij Babylon.", "Luk 4:12": "En Jezus antwoordde en zei tegen hem: Er is gezegd: U zult de Heere, uw God, niet verzoeken.", "Hebr 3:12": "Kijk uit, broeders, dat er in niemand van u ooit een slecht, ongelovig hart is, om af te wijken van de levende God;", "Jes 45:23": "Ik heb bij Mijzelf gezworen, er is een woord van gerechtigheid uit Mijn mond gegaan, en het zal niet terugkeren: dat voor Mij alle knie zich zal buigen, alle tong Mij zal zweren.", "Joh 6:60-62": "Velen van Zijn discipelen dan zeiden, toen zij dit hoorden: Dit is een harde uitspraak; wie kan dat aanhoren? Jezus, die bij Zichzelf wist dat Zijn discipelen daarover morden, zei tegen hen: Ergert dit u? Wat zou het dan zijn, als u de Zoon des mensen zag opvaren naar waar Hij eerder was?", "Jes 38:8": "Zie, Ik zal de schaduw van de graden, die met de zon in de graden van de zonnewijzer van Achaz omlaag gegaan is, tien graden achterwaarts doen keren. Zo is de zon tien graden teruggekeerd, in de graden die zij omlaag gegaan was.", "Luk 8:10": "En Hij zei: Aan u is het gegeven de verborgenheden van het Koninkrijk van God te verstaan; maar tot de anderen spreek Ik in gelijkenissen, opdat zij ziende niet zien, en horende niet verstaan.", "Joh 7:42": "Zegt de Schrift niet dat de Christus zal komen uit het nageslacht van David, en uit het dorp Bethlehem, waar David was?", "Joh 5:46": "Want als u Mozes geloofde, zou u Mij geloven; want hij heeft van Mij geschreven.", "Jer 31:15": "Zo zegt de HEERE: Er is een stem gehoord in Rama, een geklaag, een zeer bitter geween; Rachel weent over haar kinderen; zij weigert zich te laten troosten over haar kinderen, omdat zij er niet meer zijn.", "Deut 1:39": "En uw kinderen, van wie u zei: Zij zullen tot een buit zijn; en uw kinderen, die vandaag nog geen goed noch kwaad kennen, die zullen daar ingaan, en aan hen zal Ik het geven, en zij zullen het erfelijk bezitten.", "Rom 9:12": "werd tot haar gezegd: De oudste zal de jongste dienen.", "Jona 3:1-4": "En het woord van de HEERE gebeurde voor de tweede keer tot Jona, en zei: Maak u op, ga naar de grote stad Nineve, en predik tegen haar de prediking, die Ik tot u spreek. Toen maakte Jona zich op, en ging naar Nineve, naar het woord van de HEERE. Nineve nu was een grote stad van God, van drie dagreizen.", "Ps 10:7": "Zijn mond is vol vloek, bedrog en list; onder zijn tong is moeite en onrecht.", "Spr 18:4": "De woorden uit de mond van een man zijn diepe wateren; en de bron van wijsheid is een stromende beek.", "1 Kron 19:7": "zodat zij zich tweeëndertigduizend wagens huurden; en de koning van Maächa en zijn volk kwamen en legerden zich voor Medeba; ook verzamelden de kinderen van Ammon zich uit hun steden, en zij kwamen ten strijde.", "Joh 3:11": "Voorwaar, voorwaar, Ik zeg u: Wij spreken wat Wij weten, en getuigen wat Wij gezien hebben; en u neemt Ons getuigenis niet aan.", "Gen 21:10": "En zij zei tegen Abraham: Jaag deze slavin en haar zoon weg; want de zoon van deze slavin zal niet erven met mijn zoon, met Izak.", "Jes 36:1": "En het gebeurde in het veertiende jaar van koning Hizkia, dat Sanherib, de koning van Assyrië, optrok tegen alle versterkte steden van Juda, en ze innam.", "Hebr 2:12": "En Hij zegt: Ik zal Uw naam aan Mijn broeders verkondigen; in het midden van de Gemeente zal Ik U lofzingen.", "1 Kor 1:3": "Genade zij u en vrede van God onze Vader, en van de Heere Jezus Christus.", "Spr 27:27": "Daarbij zult u genoeg geitenmelk hebben tot uw voedsel, tot voedsel van uw huis, en levensonderhoud van uw dienstmeisjes.", "Amos 5:15": "Haat het kwade, en heb het goede lief, en zorg voor recht in de poort; misschien zal de HEERE, de God van de heerscharen, aan het overblijfsel van Jozef genadig zijn.", "Jes 53:4-6": "Waarlijk, Hij heeft onze ziekten op Zich genomen, en onze smarten heeft Hij gedragen; maar wij hielden Hem voor een geplaagde, door God geslagen en verdrukt. Maar Hij is om onze overtredingen verwond, om onze ongerechtigheden is Hij verbrijzeld; de straf die ons de vrede aanbrengt, was op Hem, en door Zijn striemen is er voor ons genezing gekomen. Wij dwaalden allen als schapen, wij keerden ons ieder naar zijn eigen weg; maar de HEERE heeft de ongerechtigheid van ons allen op Hem doen neerkomen.", "2 Sam 10:6": "Toen nu de kinderen Ammons zagen, dat zij zich bij David stinkend gemaakt hadden, zonden de kinderen Ammons heen, en huurden van de Syriërs van Beth-Rechob, en van de Syriërs van Zoba, twintigduizend man van het voetvolk, en van de koning van Maächa duizend man, en van de mannen van Tob twaalfduizend man.", "1 Joh 2:23": "Ieder, die de Zoon loochent, heeft ook de Vader niet; wie de Zoon belijdt, heeft ook de Vader.", "1 Sam 4:21": "En zij noemde de jongen Ikabod, en zei: De eer is weggevoerd uit Israël! Omdat de ark van God gevankelijk was weggevoerd, en vanwege haar schoonvader en haar man.", "Rom 4:7": "En zei: Gelukkig zijn zij wier ongerechtigheden vergeven zijn, en wier zonden bedekt zijn;", "Lev 19:2": "Spreek tot de hele vergadering van de kinderen van Israël, en zeg tegen hen: U zult heilig zijn, want Ik, de HEERE, uw God, ben heilig!", "Jes 49:5": "En nu zegt de HEERE, Die Mij van moeders buik af tot een Knecht gevormd heeft, dat Ik Jakob tot Hem terugbrengen zou; maar Israël zal zich niet laten verzamelen; toch zal Ik verheerlijkt worden in de ogen van de HEERE, en Mijn God zal Mijn Sterkte zijn.", "Rom 15:12": "En opnieuw zegt Jesaja: Er zal de wortel van Isaï zijn, en Die opstaat om over de heidenen te heersen; op Hem zullen de heidenen hopen.", "1 Kon 19:18": "Ook heb Ik in Israël zevenduizend laten overblijven, alle knieën die zich niet voor Baäl gebogen hebben, en alle monden die hem niet gekust hebben.", "Jes 64:4": "Ja, van oudsher heeft men het niet gehoord, ook niet met de oren opgemerkt, en geen oog heeft het gezien, behalve U, o God! wat Hij doen zal aan hem, die op Hem wacht.", "1 Kor 14:21": "In de wet is geschreven: Ik zal door lieden van andere talen, en door andere lippen tot dit volk spreken, en toch zullen zij Mij ook zo niet horen, zegt de Heere.", "Luk 10:16": "Wie naar u luistert, luistert naar Mij; en wie u verwerpt, verwerpt Mij; en wie Mij verwerpt, verwerpt Hem die Mij gezonden heeft.", "Ex 13:2": "Heilig voor Mij alle eerstgeborenen; wat er ook onder de kinderen van Israël de baarmoeder opent, van mensen en van dieren, dat is Mijn eigendom.", "Rom 3:4": "Dat zij verre. Maar God is waarachtig, en ieder mens leugenachtig; zoals geschreven is: Opdat U gerechtvaardigd wordt in Uw woorden, en overwint, wanneer U oordeelt.", "Klaagl 3:52": "Tsade. Zij die mijn vijanden zijn zonder oorzaak, hebben mij als een vogeltje dapper gejaagd.", "Spr 27:23": "Wees ijverig om het gezicht van uw schapen te kennen; richt uw hart op de kudden.", "Spr 28:1": "De goddelozen vluchten, terwijl geen vervolger er is; maar elke rechtvaardige is moedig, als een jonge leeuw.", "Jes 36:2": "En de koning van Assyrië zond Rabsake van Lachis naar Jeruzalem, naar koning Hizkia, met een zwaar leger; en hij stond aan de watergang van de bovenste vijver, aan de hoge weg van het veld van de voller.", "Joh 16:8": "En als Hij gekomen is, zal Hij de wereld overtuigen van zonde, en van gerechtigheid, en van oordeel:", "Zach 8:16": "Dit zijn de dingen die u doen zult: spreek de waarheid, ieder met zijn naaste; oordeel de waarheid en een oordeel van vrede in uw poorten.", "2 Kron 22:5": "Hij wandelde ook naar hun raad, en ging met Joram, de zoon van Achab, de koning van Israël, ten strijde tegen Hazaël, de koning van Syrië, bij Ramoth in Gilead; en de Syriërs sloegen Joram.", "1 Kor 15:45": "Zo staat er ook geschreven: De eerste mens Adam is geworden tot een levende ziel; de laatste Adam tot een levendmakende Geest.", "Amos 2:6-16": "Zo zegt de HEERE: Om drie overtredingen van Israël, en om vier zal Ik dat niet afwenden; omdat zij de rechtvaardige voor geld verkopen, en de arme om een paar schoenen. Die ernaar hijgen dat het stof van de aarde op het hoofd van de armen is, en de weg van de zachtmoedigen verdraaien; en de man en zijn vader gaan naar een jonge dochter om Mijn heilige Naam te ontheiligen. En zij leggen zich neer bij elk altaar op de verpande klederen, en drinken de wijn van de beboeten in het huis van hun goden.", "1 Petr 2:9": "Maar u bent een uitverkoren geslacht, een koninklijk priesterschap, een heilig volk, een volk dat God Zich verworven heeft; opdat u de deugden zou verkondigen van Hem Die u uit de duisternis geroepen heeft tot Zijn wonderbaar licht;", "Hebr 11:6": "Maar zonder geloof is het onmogelijk God te behagen. Want wie tot God komt, moet geloven dat Hij bestaat, en dat Hij Beloner is van hen die Hem zoeken.", "Gen 15:13": "Toen zei Hij tegen Abram: Weet voorzeker dat uw nageslacht vreemdeling zal zijn in een land dat niet van hen is, en zij zullen hen dienen, en zij zullen hen verdrukken, vierhonderd jaar.", "Jer 17:1-4": "De zonde van Juda is geschreven met een ijzeren griffie, met de punt van een diamant; gegraven in de tafel van hun hart, en aan de hoornen van uw altaren; Zoals hun kinderen aan hun altaren denken, en aan hun bossen, bij het groene geboomte, op de hoge heuvels. Ik zal Mijn berg met het veld, uw vermogen en al uw schatten ten roof geven, alsook uw hoogten, om de zonde in al uw landpalen.", "Luk 2:24": "En om een offer te geven, naar wat in de wet van de Heere gezegd is, een paar tortelduiven of twee jonge duiven.", "Gen 22:18": "En in uw nageslacht zullen alle volken van de aarde gezegend worden, omdat u Mijn stem gehoorzaam bent geweest.", "2 Kon 16:5": "Toen trok Rezin, de koning van Syrië, op, met Pekah, de zoon van Remalia, de koning van Israël, naar Jeruzalem ten strijde; en zij belegerden Achaz, maar zij konden hem niet overwinnen.", "Jer 19:3": "En zeg: Hoort het woord van de HEERE, koningen van Juda en inwoners van Jeruzalem! Zo zegt de HEERE van de heerscharen, de God van Israël: Ziet, Ik zal een kwaad brengen over deze plaats, waarvan een ieder die het hoort, zijn oren zullen klinken;", "Hos 13:2": "En nu gaan zij voort met zondigen, en hebben zich van hun zilver een gegoten beeld gemaakt, afgoden naar hun eigen inzicht, die allemaal het werk van smeden zijn; waarvan zij toch zeggen: De mensen die offeren, zullen de kalveren kussen.", "Hos 11:5": "Hij zal niet terugkeren naar het land Egypte; maar Assur, die zal zijn koning zijn; omdat zij weigerden zich te bekeren.", "Jes 59:21": "Wat Mij aangaat, dit is Mijn Verbond met hen, zegt de HEERE: Mijn Geest, Die op u is, en Mijn woorden, die Ik in uw mond gelegd heb, die zullen van uw mond niet wijken, ook niet van de mond van uw zaad, ook niet van de mond van het zaad van uw zaad, zegt de HEERE, van nu af tot in eeuwigheid toe.", "Rom 3:15-17": "hun voeten zijn snel om bloed te vergieten; vernieling en ellende is op hun wegen; en de weg van de vrede hebben zij niet gekend.", "Jes 52:5": "En nu, wat heb Ik hier te doen? spreekt de HEERE, omdat Mijn volk voor niets is weggenomen, en degenen die over hen heersen, hen laten huilen, spreekt de HEERE, en Mijn Naam voortdurend de hele dag gelasterd wordt;", "Hebr 13:5": "Laat uw wandel zonder geldgierigheid zijn, en wees tevreden met wat u hebt; want Hij heeft gezegd: Ik zal u niet begeven, en Ik zal u niet verlaten.", "Hand 3:23": "En het zal gebeuren dat iedere ziel die niet naar deze Profeet zal hebben geluisterd, uitgeroeid zal worden uit het volk.", "Deut 32:35": "Aan Mij is de wraak en de vergelding, op de tijd dat hun voet zal wankelen; want de dag van hun ondergang is nabij, en de dingen die hun zullen gebeuren, haasten zich.", "Jer 10:17-22": "Raap uw koopwaar weg uit het land, u inwoonster van de vesting! Want zo zegt de HEERE: Ziet, Ik zal de inwoners van het land op deze keer wegslingeren, en zal hen benauwen, opdat zij het vinden. O, wee mij over mijn breuk! mijn plaag is smartelijk; en ik had gezegd: Dit is zeker een ziekte, die ik wel dragen zal!", "Luk 4:18": "De Geest van de Heere is op Mij, daarom heeft Hij Mij gezalfd; Hij heeft Mij gezonden om aan de armen het Evangelie te verkondigen, om te genezen wie gebroken zijn van hart;", "Neh 3:13-16": "De Dalpoort verbeterden Hanun, en de inwoners van Zanoah; zij bouwden die, en richtten haar deuren op, met haar sloten en haar grendelen; daarbij duizend el aan de muur, tot aan de Mistpoort. De Mistpoort nu verbeterde Malchia, de zoon van Rechab, leider van het deel Beth-Cherem; hij bouwde ze, en richtte haar deuren op, met haar sloten en haar grendelen. En de Fonteinpoort verbeterde Sallum, de zoon van Kol-Hoze, leider van het deel van Mizpa; hij bouwde ze, en overdekte ze, en richtte haar deuren op, met haar sloten en haar grendelen; daarbij de muur van de vijver Schelah bij de tuin van de koning, en tot aan de trappen, die naar beneden gaan vanaf Davids stad.", "Matt 7:23": "En dan zal Ik hun openlijk zeggen: Ik heb u nooit gekend; ga weg van Mij, u die de ongerechtigheid werkt!", "Lev 26:37": "En zij zullen de een over de ander vallen als voor het zwaard, terwijl niemand hen opjaagt; en u zult niet kunnen standhouden voor het aangezicht van uw vijanden.", "Jes 5:26": "Want Hij zal een banier opwerpen voor de heidenvolken van ver, en Hij zal hen hierheen lokken met een fluitsignaal, van het einde van de aarde; en zie, haastig, snel zullen zij aankomen.", "Jes 49:8": "Zo zegt de HEERE: In de tijd van het welbehagen heb Ik U verhoord, en op de dag van het heil heb Ik U geholpen; en Ik zal U bewaren, en Ik zal U geven tot een verbond van het volk, om het aardrijk op te richten, om de verwoeste erfenissen te doen beërven;", "Rom 9:5": "van wie de vaders zijn, en uit wie Christus is, wat het vlees aangaat, Hij Die God is, boven allen te prijzen tot in eeuwigheid. Amen.", "Mark 14:27": "En Jezus zei tegen hen: U zult deze nacht allen aanstoot aan Mij nemen; want er is geschreven: Ik zal de Herder slaan, en de schapen zullen verstrooid worden.", "Jes 5:10": "Ja, tien bunders wijngaard zullen maar één bath geven, en een homer zaad zal een efa geven.", "Ex 21:24": "oog voor oog, tand voor tand, hand voor hand, voet voor voet,", "Luk 1:35": "En de engel antwoordde en zei tegen haar: De Heilige Geest zal over u komen, en de kracht van de Allerhoogste zal u overschaduwen; daarom zal ook dat Heilige Dat uit u geboren zal worden, Gods Zoon genoemd worden.", "Hos 1:1-9": "Het woord van de Heere, dat gebeurd is tot Hosea, de zoon van Beëri, in de dagen van Uzzia, Jotham, Achaz, Hizkia, koningen van Juda, en in de dagen van Jerobeam, zoon van Joas, koning van Israël. Het begin van het woord van de Heere door Hosea. De Heere zei toen tegen Hosea: Ga heen, neem u een vrouw van hoererijen, en kinderen van hoererijen; want het land hoereert helemaal van achter de Heere vandaan. Zo ging hij heen, en nam Gomer, een dochter van Diblaim; en zij ontving, en baarde hem een zoon.", "Luk 1:26-35": "En in de zesde maand werd de engel Gabriël door God gezonden naar een stad in Galilea, genaamd Nazareth, naar een maagd die ondertrouwd was met een man wiens naam Jozef was, uit het huis van David; en de naam van de maagd was Maria. En de engel kwam bij haar binnen, en zei: Wees gegroet, begenadigde; de Heere is met u; u bent gezegend onder de vrouwen.", "Matt 5:27": "U hebt gehoord dat gezegd is: U zult geen overspel plegen.", "Ps 110:1": "Een psalm van David. De HEERE heeft tot mijn Heere gesproken: Zit aan Mijn rechterhand, totdat Ik Uw vijanden gezet zal hebben tot een voetbank van Uw voeten.", "Jer 11:5": "Opdat Ik de eed bevestig, die Ik uw vaderen gezworen heb, hun een land te geven vloeiende van melk en honing, zoals het is op deze dag. Toen antwoordde ik en zei: Amen, o HEERE!", "Rom 1:7": "Aan allen die in Rome zijn, geliefden van God, en geroepen heiligen: genade zij u, en vrede van God, onze Vader, en de Heere Jezus Christus.", "Hand 8:32": "En het gedeelte van de Schrift dat hij las, was dit: Hij is als een schaap naar de slachting geleid; en zoals een lam stemloos is voor wie het scheert, zo doet Hij Zijn mond niet open.", "Mark 9:11-13": "En zij vroegen Hem: Waarom zeggen de Schriftgeleerden dat Elia eerst moet komen? En Hij antwoordde en zei tegen hen: Elia komt inderdaad eerst, en herstelt alles; en het zal gebeuren, zoals geschreven is van de Zoon des mensen, dat Hij veel moet lijden en veracht worden. Maar Ik zeg u, dat Elia ook gekomen is, en zij hebben hem gedaan wat zij wilden, zoals van hem geschreven is.", "Ezech 29:20": "Als zijn arbeidsloon, omdat hij tegen haar gediend heeft, heb Ik hem Egypteland gegeven, omdat zij voor Mij gewerkt hebben, spreekt de Heere HEERE.", "Jer 19:1": "Zo zegt de HEERE: Ga heen en koop een pottenbakkerskruik, en neem tot u van de oudsten van het volk, en van de oudsten van de priesters.", "Hand 7:31": "Toen Mozes dat zag, verwonderde hij zich over het gezicht; en toen hij erheen ging om het van dichtbij te bekijken, kwam er een stem van de Heere tot hem,", "Joh 20:28": "En Thomas antwoordde en zei tegen Hem: Mijn Heere en mijn God!", "Openb 6:13": "En de sterren van de hemel vielen op de aarde, zoals een vijgenboom zijn onrijpe vijgen afwerpt, als hij door een grote wind geschud wordt.", "Luk 23:36": "En ook de soldaten kwamen naar Hem toe en bespotten Hem, en brachten Hem azijn;", "Matt 21:5": "Zeg tegen de dochter van Sion: Zie, uw Koning komt naar u toe, zachtmoedig en gezeten op een ezelin, en een veulen, het jong van een lastdier.", "Matt 2:5": "Zij zeiden tegen hem: In Bethlehem, in Judea; want zo is geschreven door de profeet:", "Luk 24:36-45": "En terwijl zij over deze dingen spraken, stond Jezus Zelf in hun midden, en zei tegen hen: Vrede zij u! En zij schrokken en werden zeer bevreesd, en meenden dat zij een geest zagen. En Hij zei tegen hen: Waarom bent u ontsteld, en waarom komen zulke overleggingen op in uw hart?", "1 Sam 17:32": "En David zei tegen Saul: Laat aan niemand het hart ontvallen om hem. Uw knecht zal gaan en met deze Filistijn strijden.", "Hoogl 5:1": "Ik ben in Mijn hof gekomen, o Mijn zuster, o bruid! Ik heb Mijn mirre geplukt met Mijn specerij; Ik heb Mijn honigraten met Mijn honig gegeten; Ik heb Mijn wijn, alsook Mijn melk gedronken. Eet, vrienden! Drink, en word dronken, o liefsten!", "Ps 31:6": "In Uw hand beveel ik mijn geest; U hebt mij verlost, HEERE, U, God van de waarheid!", "Hebr 4:4": "Want Hij heeft ergens over de zevende dag zo gesproken: En God heeft op de zevende dag van al Zijn werken gerust.", "Mark 4:24": "En Hij zei tegen hen: Let op wat u hoort. Met de maat waarmee u meet, zal u gemeten worden, en aan u die hoort, zal meer gegeven worden.", "2 Kon 18:19-21": "En Rabsake zei tot hen: Zeg nu tot Hizkia: Zo zegt de grote koning, de koning van Assyrië: Wat vertrouwen is dit, waarmee u vertrouwt? U zegt (doch het is een woord der lippen): Er is raad en macht tot de oorlog; op wie vertrouwt u nu, dat u tegen mij rebelleert? Zie nu, vertrouwt u op die gebroken rietstaf, op Egypte, waarop, als iemand daarop leunt, het in zijn hand zal gaan, en die doorboren; zo is Farao, de koning van Egypte, voor allen die op hem vertrouwen.", "Jes 32:2": "En die man zal zijn als een schuilplaats tegen de wind, en een schuilplaats tegen de storm, als waterbeken in een dorre plaats, als de schaduw van een zware rotssteen in een dorstig land.", "Matt 21:16": "en zeiden tegen Hem: Hoort U wel wat dezen zeggen? En Jezus zei tegen hen: Ja; hebt u nooit gelezen: Uit de mond van de jonge kinderen en de zuigelingen hebt U Zichzelf lof toebereid?", "Jes 10:5-34": "Wee de Assyriër, die de roede van Mijn toorn is, en Mijn grimmigheid is een stok in hun hand! Ik zal hem zenden tegen een huichelachtig volk, en Ik zal hem bevel geven tegen het volk van Mijn verbolgenheid; opdat hij de roof rooft, en plundert de plundering, en het stelt ter vertreding, als het slijk van de straten. Hoewel hij het zo niet meent, en zijn hart zo niet denkt, maar hij zal in zijn hart hebben te verdelgen, en niet weinige volken uit te roeien.", "Gen 30:15": "En zij zei tegen haar: Is het weinig dat u mijn man genomen hebt, dat u ook de dudaïm van mijn zoon nemen wilt? Toen zei Rachel: Daarom zal hij deze nacht bij u liggen, voor de dudaïm van uw zoon.", "Jes 49:1": "Hoort naar Mij, eilanden! En luistert toe, volken van verre! De HEERE heeft Mij geroepen van de buik af, van het ingewand van Mijn moeder af heeft Hij Mijn Naam vermeld.", "2 Kon 20:20": "Het overige nu van de geschiedenis van Hizkia, en al zijn macht, en hoe hij de vijver en de watergang gemaakt heeft, en water in de stad gebracht heeft, is dat niet geschreven in het boek van de kronieken van de koningen van Juda?", "2 Kon 23:33": "Doch Farao Necho liet hem gevangenzetten te Ribla in het land van Hamath, opdat hij te Jeruzalem niet regeren zou; en hij legde het land een boete op van honderd talenten van het zilver en een talent van het goud.", "Amos 9:12": "Opdat zij het overblijfsel van Edom erfelijk bezitten, en alle heidenvolken die naar Mijn Naam genoemd worden, spreekt de HEERE, Die dit doet.", "Luk 8:18": "Let er dan op hoe u hoort; want wie heeft, aan hem zal gegeven worden; en wie niet heeft, ook wat hij meent te hebben zal van hem afgenomen worden.", "Ps 132:11": "De HEERE heeft David de waarheid gezworen, waarvan Hij niet wijken zal, en zei: Van de vrucht van uw buik zal Ik op uw troon zetten.", "2 Sam 8:6": "En David legde bezettingen in Syrië van Damaskus, en de Syriërs werden David tot knechten, en zij brachten geschenken; en de HEERE behoedde David overal waar hij heentrok.", "Joh 12:41": "Dit zei Jesaja, toen hij Zijn heerlijkheid zag, en over Hem sprak.", "Ex 4:1": "Toen antwoordde Mozes, en zei: Maar zie, zij zullen mij niet geloven, en niet naar mijn stem luisteren; want zij zullen zeggen: De HEERE is u niet verschenen!", "Deut 20:3": "En tot hen zeggen: Hoor, Israël! U bent heden dicht bij de strijd tegen uw vijanden; laat uw hart niet week worden, vrees niet, en beef niet, en verschrik niet voor hun aangezicht.", "Matt 17:20": "En Jezus zei tegen hen: Vanwege uw ongeloof; want voorwaar, Ik zeg u: als u een geloof had als een mosterdzaad, zou u tegen deze berg zeggen: Ga van hier daarheen, en hij zou gaan; en niets zou voor u onmogelijk zijn.", "Matt 13:56": "En Zijn zusters, zijn die niet allemaal bij ons? Waar komt dan bij Deze dit alles vandaan?", "Hand 28:25-27": "En omdat zij het onderling oneens waren, gingen zij uiteen, nadat Paulus dit ene woord gezegd had, namelijk: Terecht heeft de Heilige Geest gesproken door de profeet Jesaja tot onze voorvaders, Toen hij zei: Ga naar dit volk, en zeg: Met het gehoor zult u horen, en beslist niet begrijpen; en ziende zult u zien, en beslist niet opmerken. Want het hart van dit volk is ongevoelig geworden, en met de oren hebben zij slecht gehoord, en hun ogen hebben zij gesloten; opdat zij niet op enig moment met de ogen zouden zien, en met de oren horen, en met het hart begrijpen, en zich zouden bekeren, en Ik hen zou genezen.", "Jes 7:8-16": "Maar Damaskus zal het hoofd van Syrië zijn, en Rezin het hoofd van Damaskus; en over nog vijfenzestig jaar zal Efraïm verbroken worden, zodat het geen volk meer is. Ondertussen zal Samaria het hoofd van Efraïm zijn, en de zoon van Remalia het hoofd van Samaria. Als u niet gelooft, zult u zeker niet standhouden. En de HEERE ging verder met spreken tegen Achaz, en zei:", "Ps 18:50": "Daarom zal ik U, o HEERE! loven onder de heidenen; en Uw Naam zal ik psalmzingen;", "Jer 31:20": "Is Efraïm Mij niet een dierbare zoon, is hij Mij niet een troetelkind? Want sinds Ik tegen hem gesproken heb, denk Ik nog met ernst aan hem; daarom rommelt Mijn binnenste over hem; Ik zal Mij zijn zeker ontfermen, spreekt de HEERE.", "1 Kor 14:22": "Zo dan, de vreemde talen zijn tot een teken niet voor hun die geloven, maar voor de ongelovigen; en de profetie niet voor de ongelovigen, maar voor hun die geloven.", "Amos 9:11": "Op die dag zal Ik de vervallen hut van David weer oprichten, en Ik zal haar scheuren dichtmaken, en wat aan haar is afgebroken weer oprichten, en zal haar bouwen, als in de dagen van vroeger;", "Jes 9:7-20": "De Heere heeft een woord gezonden in Jakob, en het is gevallen in Israël. En dit hele volk zal het gewaar worden, Efraïm en de inwoner van Samaria; in hoogmoed en grootsheid van hart, en zij zeiden: De tichelstenen zijn gevallen, maar met uitgehouwen stenen zullen wij opnieuw bouwen; de wilde vijgenbomen zijn afgehouwen, maar wij zullen ze in cederen veranderen;", "2 Tess 2:17": "moge uw harten vertroosten, en u versterken in alle goed woord en werk.", "Ps 78:21": "Daarom hoorde de HEERE, en werd verbolgen; en een vuur werd ontstoken tegen Jakob, en ook toorn ging op tegen Israël;", "Gen 30:8": "Toen zei Rachel: Ik heb worstelingen van God met mijn zuster geworsteld; ook heb ik de overhand gehad; en zij noemde zijn naam Nafthali.", "1 Tim 5:18": "Want de Schrift zegt: Een dorsende os zult u niet muilbanden; en: De arbeider is zijn loon waard.", "Deut 25:4": "Een os zult u niet muilbanden, als hij graan dorst.", "Jes 40:6-8": "Een stem zegt: Roept! En hij zegt: Wat zal ik roepen? Alle vlees is gras, en al zijn goedertierenheid als een bloem van het veld. Het gras verdort, de bloem valt af, als de Geest van de HEERE daarin waait; voorwaar, het volk is gras. Het gras verdort, de bloem valt af; maar het Woord van onze God bestaat in eeuwigheid.", "1 Kon 19:14": "En hij zei: Ik heb mij zeer sterk ingezet voor de HEERE, de God van de heerscharen; want de Israëlieten hebben Uw verbond verlaten, Uw altaren afgebroken en Uw profeten met het zwaard gedood; en ik alleen ben overgebleven, en zij zoeken mij te doden.", "Jes 6:10": "Maak het hart van dit volk vet, en maak hun oren zwaar, en sluit hun ogen, opdat het niet ziet met zijn ogen, of met zijn oren hoort, of met zijn hart begrijpt, of zich bekeert, en Hij het geneest.", "Joh 1:1": "In het begin was het Woord, en het Woord was bij God, en het Woord was God.", "Jes 54:1": "Zing vrolijk, u onvruchtbare, die niet gebaard hebt! Maak geschal met vrolijk gezang, en juich, die geen barensnood gehad hebt! Want de kinderen van de eenzame zijn meer dan de kinderen van de getrouwde, zegt de HEERE.", "Joh 8:53": "Bent U meer dan onze vader Abraham, die gestorven is? En de profeten zijn gestorven; wie maakt U Uzelf?", "Gen 2:7": "En de HEERE God had de mens gevormd uit het stof van de aarde, en in zijn neusgaten de adem van het leven geblazen; zo werd de mens tot een levende ziel.", "Mark 9:44": "Waar hun worm niet sterft, en het vuur niet uitgeblust wordt.", "Dan 7:27": "Maar het rijk, en de heerschappij, en de grootheid van de koninkrijken onder de hele hemel, zal gegeven worden aan het volk van de heiligen van de hoge plaatsen, wiens Rijk een eeuwig Rijk zal zijn; en alle heerschappijen zullen Hem eren en gehoorzamen.", "Matt 2:6": "En u, Bethlehem, land van Juda! U bent geenszins de minste onder de vorsten van Juda; want uit u zal de Leidsman voortkomen, Die Mijn volk Israël weiden zal.", "Hab 2:3": "Want het visioen is nog bestemd voor een vastgestelde tijd, maar op het einde zal Hij het vervullen, en het zal niet liegen; al blijft het uit, verwacht het toch, want het zal zeker komen, het zal niet achterblijven.", "Ezech 37:16-19": "U dan, mensenkind! Neem een stuk hout, en schrijf daarop: Voor Juda, en voor de kinderen van Israël, zijn metgezellen; en neem een ander stuk hout, en schrijf daarop: Voor Jozef, het hout van Efraïm, en van het gehele huis van Israël, zijn metgezellen. Doe ze dan bij elkaar komen, het een bij het ander tot één stuk hout; en zij zullen één worden in uw hand. En wanneer de kinderen van uw volk tot u zullen spreken en zeggen: Wilt u ons niet duidelijk maken wat u met deze dingen bedoelt?", "Ezech 47:17": "Zo zal het gebied vanaf de zee zijn: Hazar-Enon, het gebied van Damaskus, en het noorden noordwaarts, en het gebied van Hamath; en dat zal de noordkant zijn.", "Hand 7:34": "Ik heb zeker gezien de mishandeling van Mijn volk, dat in Egypte is, en Ik heb hun zuchten gehoord en ben neergekomen om hen daaruit te verlossen; en nu, kom hierheen, Ik zal u naar Egypte zenden.", "Jer 31:18": "Ik heb wel gehoord dat Efraïm zich beklaagt, en zegt: U hebt mij getuchtigd, en ik ben getuchtigd zoals een ongewend kalf. Bekeer mij, dan zal ik bekeerd zijn, want U bent de HEERE, mijn God!", "Job 20:17": "De stromen, rivieren, beken van honing en boter zal hij niet zien.", "Ex 16:31": "En het huis van Israël noemde het Man; en het was als korianderzaad, wit, en de smaak ervan was als honingkoeken.", "Jes 1:13": "Breng niet meer een nutteloos offer; het reukwerk is Mij een gruwel; de nieuwe manen, en sabbatten, en het bijeenroepen van de samenkomsten kan Ik niet verdragen, het is ongerechtigheid, zelfs de verbodsdagen.", "Matt 4:6": "en zei tegen Hem: Als U Gods Zoon bent, werp Uzelf naar beneden; want er is geschreven dat Hij Zijn engelen bevelen zal U te beschermen, en dat zij U op de handen zullen dragen, opdat U niet op enig moment Uw voet aan een steen stoot.", "Jer 42:13-22": "Maar als u zult zeggen: Wij zullen in dit land niet blijven; zodat u niet gehoorzaam bent aan de stem van de HEERE, van uw God, en zegt: Nee, maar wij zullen naar Egypteland gaan, waar wij geen oorlog zullen zien, noch het geluid van de bazuin horen, noch naar brood hongeren, en daar zullen wij blijven; nu dan, daarom hoor het woord van de HEERE, overblijfsel van Juda! Zo zegt de HEERE van de heerscharen, de God van Israël: Als u vastbesloten uw aangezichten stelt om naar Egypte te gaan, en daar naartoe gaat om daar als vreemdelingen te wonen;", "Joz 1:5": "Niemand zal voor uw aangezicht standhouden al de dagen van uw leven; zoals Ik met Mozes geweest ben, zal Ik met u zijn; Ik zal u niet begeven, en zal u niet verlaten.", "1 Kon 16:24-29": "En hij kocht de berg Samaria van Semer, voor twee talenten van het zilver, en bebouwde de berg; en noemde de naam van de stad die hij bouwde, naar de naam van Semer, de heer van de berg, Samaria. En Omri deed wat kwaad was in de ogen van de HEERE; ja, hij deed erger dan allen die voor hem geweest waren. En hij wandelde in alle wegen van Jerobeam, de zoon van Nebat, en in zijn zonden, waarmee hij Israël had doen zondigen, en verwekte de HEERE, de God van Israël, tot toorn, door hun nietige afgoden.", "Jes 8:4-10": "Want voordat dat jongetje kan roepen: Mijn vader! of: mijn moeder!, zal men de rijkdom van Damaskus en de buit van Samaria wegdragen voor de koning van Assur. En de HEERE sprak nog verder tegen mij en zei: Omdat dit volk het water van Siloa veracht, dat zachtjes stroomt, en er vreugde is bij Rezin en de zoon van Remalia,", "Ex 16:18": "Maar toen zij het met de gomer maten, had hij die veel verzameld had, niets over, en hem die weinig verzameld had, ontbrak niets; ieder verzamelde zoveel als hij eten kon.", "Hebr 11:31": "Door het geloof is Rachab, de hoer, niet omgekomen met de ongehoorzamen, omdat zij de verspieders met vrede had ontvangen.", "Ef 1:2": "Genade zij u en vrede van God, onze Vader, en de Heere Jezus Christus.", "Jes 31:8": "En Assur zal vallen door het zwaard, niet van een sterke man, en het zwaard, niet van een gewoon mens, zal hem verteren; en hij zal voor het zwaard vluchten, en zijn jongemannen zullen tot dwangarbeid gebracht worden.", "Jes 61:2": "Om uit te roepen het jaar van het welbehagen van de HEERE, en de dag van de wraak van onze God; om alle treurenden te troosten;", "Deut 24:15": "Op zijn dag zult u hem zijn loon geven, en de zon zal daarover niet ondergaan; want hij is arm, en zijn ziel verlangt daarnaar; zodat hij tegen u niet roept tot de HEERE, en er zonde in u is.", "Gen 4:1": "En Adam had gemeenschap met Eva, zijn vrouw, en zij werd zwanger en baarde Kaïn, en zei: Ik heb een man van de HEERE verkregen!", "Gal 4:27": "Want er is geschreven: Wees vrolijk, u onvruchtbare, die niet baart, breek uit en roep, u die geen weeën hebt, want de kinderen van de eenzame zijn veel meer dan van haar die de man heeft.", "1 Petr 2:25": "Want u was als dwalende schapen; maar u bent nu bekeerd tot de Herder en Opziener van uw zielen.", "Ps 34:13-17": "Mem. Wie is de man die lust heeft ten leven, die dagen liefheeft om het goede te zien? Nun. Bewaar uw tong voor het kwaad, en uw lippen voor het spreken van bedrog. Samech. Wijk af van het kwaad, en doe het goede; zoek de vrede, en jaag die na.", "Nahum 1:11": "Van u is er iemand uitgegaan, die kwaad bedenkt tegen de HEERE, een raadsman van Belial.", "1 Kon 11:32": "Maar één stam zal hij hebben, omwille van Mijn dienaar David, en omwille van Jeruzalem, de stad die Ik verkozen heb uit alle stammen van Israël.", "Jes 8:23": "Maar het land dat beangstigd was, zal niet helemaal verduisterd worden; zoals Hij het in de eerste tijd verachtelijk gemaakt heeft, naar het land van Zebulon toe en naar het land van Nafthali toe, zo heeft Hij het in het laatste heerlijk gemaakt, naar de weg zeewaarts toe gelegen over de Jordaan, aan Galilea van de heidenen.", "Joël 1:11": "De akkerlieden zijn beschaamd, de wijngaardeniers huilen, om de tarwe en om de gerst, want de oogst van het veld is vergaan.", "Joh 12:14": "En Jezus vond een jonge ezel, en ging daarop zitten, zoals geschreven is:", "Gen 24:43": "zie, ik sta bij de waterbron; laat het zo gebeuren, dat de maagd die naar buiten zal komen om te putten, en tegen wie ik zal zeggen: Geef mij toch een beetje water te drinken uit uw kruik;", "Ps 16:10": "Want U zult mijn ziel in het graf niet verlaten; U zult niet toelaten dat Uw Heilige de ontbinding ziet.", "1 Kon 14:15": "De HEERE zal ook Israël slaan, zoals een riet heen en weer bewogen wordt in het water, en zal Israël uitrukken uit dit goede land, dat Hij hun vaderen gegeven heeft, en zal hen verstrooien aan de overkant van de rivier; omdat zij hun gewijde palen gemaakt hebben, en de HEERE tot toorn verwekt hebben.", "Joël 2:32": "En het zal gebeuren, dat ieder die de Naam van de HEERE zal aanroepen, behouden zal worden; want op de berg Sion en te Jeruzalem zal ontkoming zijn, zoals de HEERE gezegd heeft; en dat, bij de overgeblevenen, die de HEERE zal roepen.", "Hebr 12:26": "Wiens stem toen de aarde deed beven; maar nu heeft Hij verkondigd en gezegd: Nog eenmaal zal Ik niet alleen de aarde doen beven, maar ook de hemel.", "Ps 69:23": "Hun tafel moet voor hun gezicht tot een strik worden, en tot volle vergelding tot een valstrik.", "Luk 19:42": "en zei: Och, had u ook maar geweten, ook nog op deze dag van u, wat tot uw vrede dient! Maar nu is het verborgen voor uw ogen.", "Joh 4:48": "Jezus zei toen tegen hem: Als u geen tekenen en wonderen ziet, zult u niet geloven.", "1 Tess 3:11": "Moge nu onze God en Vader Zelf, en onze Heere Jezus Christus, onze weg naar u richten.", "2 Kon 20:18": "Daarbij zullen zij van uw zonen, die uit u zullen voortkomen, die u zult verwekken, nemen, zodat zij hovelingen zijn in het paleis van de koning van Babel.", "2 Kon 23:34": "Ook maakte Farao Necho Eljakim, de zoon van Josia, koning, in de plaats van zijn vader Josia, en veranderde zijn naam in Jojakim; maar Joahaz nam hij mee, en hij kwam in Egypte, en stierf daar.", "Hab 2:4": "Zie, wie zich verheft, zijn ziel is niet oprecht in hem; maar de rechtvaardige zal door zijn geloof leven.", "2 Petr 2:22": "Maar hun is overkomen wat een waar spreekwoord zegt: De hond is teruggekeerd naar zijn eigen uitbraaksel; en het gewassen varken naar de modderpoel om zich erin te wentelen.", "Jes 9:13-16": "Daarom zal de HEERE uit Israël afhouwen de kop en de staart, de tak en de biezen, op één dag. (De oude en aanzienlijke, die is de kop; maar de profeet die valsheid leert, die is de staart.) Want de leiders van dit volk zijn verleiders, en die door hen geleid worden, worden ingeslokt.", "Ps 78:22": "Omdat zij in God niet geloofden, en op Zijn heil niet vertrouwden.", "Luk 2:40": "En het Kindje groeide op, en werd gesterkt in de geest, en vervuld met wijsheid; en de genade van God was op Hem.", "1 Kor 6:16": "Of weet u niet, dat wie zich aan een hoer hecht, één lichaam met haar is? Want die twee, zegt Hij, zullen tot één vlees worden.", "2 Kron 28:21": "Want Achaz nam een deel van het huis van de HEERE, en van het huis van de koning en van de vorsten, en gaf het aan de koning van Assyrië; maar het hielp hem niet.", "Deut 24:1": "Wanneer een man een vrouw genomen en die getrouwd heeft, dan zal het gebeuren, als zij geen genade vindt in zijn ogen, omdat hij iets van schande aan haar gevonden heeft, dat hij haar een scheidbrief zal schrijven, en die in haar hand geven, en haar laten gaan uit zijn huis.", "Ex 20:14": "U zult geen echtbreuk plegen.", "Joh 3:18": "Wie in Hem gelooft, wordt niet veroordeeld, maar wie niet gelooft, is al veroordeeld, omdat hij niet geloofd heeft in de Naam van de eniggeboren Zoon van God.", "Hos 11:1": "Toen Israël een kind was, heb Ik hem liefgehad, en Ik heb Mijn zoon uit Egypte geroepen.", "Jes 38:1": "In die dagen werd Hizkia ziek tot de dood toe; en de profeet Jesaja, de zoon van Amoz, kwam bij hem en zei tegen hem: Zo zegt de HEERE: Regel uw zaken; want u zult sterven en niet leven.", "2 Kron 25:10": "Toen scheidde Amazia hen af, te weten de troepen die uit Efraïm tot hem gekomen waren, zodat zij naar hun eigen plaats gingen; daarom ontstak hun woede zeer tegen Juda, en zij keerden terug naar hun plaats in gloeiende toorn.", "2 Kon 23:29": "In zijn dagen trok Farao Necho, de koning van Egypte, op tegen de koning van Assyrië, naar de rivier de Frath; en koning Josia trok hem tegemoet, en Necho doodde hem te Megiddo, toen hij hem gezien had.", "Mark 10:19": "U kent de geboden: U zult geen overspel plegen; u zult niet doden; u zult niet stelen; u zult geen vals getuigenis geven; u zult niemand tekortdoen; eer uw vader en uw moeder.", "Ef 6:24": "De genade zij met allen die onze Heere Jezus Christus liefhebben in onvergankelijkheid. Amen. Vanuit Rome aan de Efeziërs geschreven, door bemiddeling van Tychikus.", "Jer 38:1-3": "Toen Sefatja, de zoon van Matthan, en Gedalia, de zoon van Pashur, en Juchal, de zoon van Selemja, en Pashur, de zoon van Malchia, de woorden hoorden die Jeremia tot al het volk sprak: Zo zegt de HEERE: Wie in deze stad blijft, zal door het zwaard, door de honger of door de pestilentie sterven; maar wie naar de Chaldeeën uitgaat, die zal leven, want hij zal zijn leven als buit hebben, en zal leven. Zo zegt de HEERE: Deze stad zal zeker gegeven worden in de hand van het leger van de koning van Babel, dat zal haar innemen;", "Hand 8:33": "In Zijn vernedering is Zijn oordeel weggenomen; en wie zal Zijn geslacht verhalen? Want Zijn leven wordt van de aarde weggenomen.", "Rom 9:29": "En zoals Jesaja van tevoren gezegd heeft: Als de Heere Sebaoth ons geen nageslacht had overgelaten, dan waren wij geworden als Sodom, en gelijk gemaakt aan Gomorra.", "Hand 4:11": "Hij is de Steen, Die door u, de bouwlieden, veracht is, Die tot een hoeksteen geworden is.", "Rom 14:11": "Want er is geschreven: Ik leef, zegt de Heere, voor Mij zal elke knie zich buigen, en elke tong zal God belijden.", "Mark 12:11": "Dit is door de Heere gebeurd, en het is wonderlijk in onze ogen?", "Ex 20:17": "U zult niet begeren het huis van uw naaste; u zult niet begeren de vrouw van uw naaste, of zijn dienstknecht, of zijn dienstmaagd, of zijn os, of zijn ezel, of iets dat van uw naaste is.", "Matt 5:31": "Er is ook gezegd: Wie zijn vrouw verlaat, moet haar een scheidbrief geven.", "Openb 22:16": "Ik, Jezus, heb Mijn engel gezonden om u deze dingen te getuigen in de Gemeenten. Ik ben de Wortel en het geslacht van David, de blinkende Morgenster.", "Jer 51:64": "En zult zeggen: Zo zal Babel zinken, en niet meer opkomen, vanwege het kwaad dat Ik over haar zal brengen, en zij zullen moe worden. Tot hiertoe zijn de woorden van Jeremia.", "Joh 8:24": "Ik heb u dan gezegd, dat u in uw zonden zult sterven; want als u niet gelooft dat Ik Die ben, zult u in uw zonden sterven.", "Hand 7:51": "U hardnekkigen en onbesnedenen van hart en oren, u weerstaat altijd de Heilige Geest; zoals uw vaders deden, zo doet u ook.", "Matt 19:4": "Maar Hij antwoordde en zei tegen hen: Hebt u niet gelezen dat Hij Die van het begin de mens gemaakt heeft, hen gemaakt heeft man en vrouw?", "Hebr 1:5": "Want tegen wie van de engelen heeft Hij ooit gezegd: U bent Mijn Zoon, heden heb Ik U verwekt? En opnieuw: Ik zal Hem tot een Vader zijn, en Hij zal Mij tot een Zoon zijn?", "2 Kon 7:1": "Toen zei Elisa: Hoor het woord van de HEERE; zo zegt de HEERE: Morgen omtrent deze tijd zal een maat meelbloem verkocht worden voor een sikkel, en twee maten gerst voor een sikkel, in de poort van Samaria.", "Matt 13:35": "Opdat vervuld zou worden wat gesproken is door de profeet, die zei: Ik zal Mijn mond opendoen door gelijkenissen; Ik zal dingen voortbrengen die verborgen waren van de grondlegging van de wereld af.", "Jes 5:6": "En Ik zal hem tot een woestenij maken; hij zal niet gesnoeid, noch omgespit worden, maar distels en doornen zullen erin opkomen; en Ik zal de wolken gebieden dat zij er geen regen op laten regenen.", "2 Kron 18:3": "Want Achab, de koning van Israël, zei tegen Josafat, de koning van Juda: Zult u met mij meegaan naar Ramoth in Gilead? En hij zei tegen hem: Ik zal zijn zoals u bent, en zoals uw volk is, zo zal mijn volk zijn, en wij zullen met u zijn in deze strijd.", "Jer 23:5": "Zie, de dagen komen, spreekt de HEERE, dat Ik voor David een rechtvaardige Spruit zal doen opstaan; Die zal Koning zijnde regeren, en voorspoedig zijn, en recht en gerechtigheid doen op de aarde.", "Ex 3:6": "Hij zei verder: Ik ben de God van uw vader, de God van Abraham, de God van Izak en de God van Jakob. En Mozes verborg zijn gezicht, want hij was bang om God aan te zien.", "Jes 10:22": "Want ofschoon uw volk, o Israël, is als het zand van de zee, zo zal toch maar het overblijfsel daarvan terugkeren; de verdelging is vast besloten, overvloeiend met gerechtigheid.", "Deut 6:16": "U zult de HEERE, uw God, niet beproeven, zoals u Hem beproefd hebt te Massa.", "Gen 25:23": "En de HEERE zei tegen haar: Twee volken zijn in uw buik, en twee naties zullen zich uit uw ingewand van elkaar scheiden; en het ene volk zal sterker zijn dan het andere volk; en de oudste zal de jongste dienen.", "Jes 19:23-25": "Op die dag zal er een gebaande weg zijn van Egypte naar Assyrië, zodat de Assyriërs in Egypte, en de Egyptenaars in Assyrië zullen komen; en de Egyptenaars zullen met de Assyriërs de Heere dienen. Op die dag zal Israël de derde zijn met de Egyptenaren en met de Assyriërs, een zegen in het midden van het land. Want de HEERE van de heerscharen zal hen zegenen en zeggen: Gezegend zij Mijn volk, de Egyptenaars, en de Assyriërs, het werk van Mijn handen, en Israël, Mijn erfdeel!", "Joh 10:37": "Als Ik de werken van Mijn Vader niet doe, geloof Mij dan niet;", "Luk 4:19": "Om aan de gevangenen vrijlating te prediken, en aan de blinden het gezicht, om de verslagenen in vrijheid heen te zenden; om te prediken het aangename jaar van de Heere.", "Mark 9:24": "En meteen riep de vader van het kind met tranen: Ik geloof, Heere! Kom mijn ongeloof te hulp.", "Jes 22:9-11": "En u zult de scheuren van de stad van David bekijken, omdat ze veel zijn; en u zult het water van de onderste vijver verzamelen. U zult ook de huizen van Jeruzalem tellen; en u zult huizen afbreken, om de muren te versterken. Ook zult u een gracht maken tussen beide de muren, voor het water van de oude vijver; maar u zult niet omhoogkijken naar Hem, Die dat gedaan heeft, en Hem niet aanmerken, Die dat van verre tijden gevormd heeft.", "Jes 11:13": "En de nijd van Efraïm zal wegwijken, en de tegenstanders van Juda zullen uitgeroeid worden; Efraïm zal Juda niet benijden, en Juda zal Efraïm niet benauwen.", "Joh 8:45-47": "Maar Mij, omdat Ik u de waarheid zeg, gelooft u niet. Wie van u overtuigt Mij van zonde? En als Ik de waarheid zeg, waarom gelooft u Mij dan niet? Wie uit God is, hoort de woorden van God; daarom hoort u niet, omdat u niet uit God bent.", "Jer 13:9-27": "Zo zegt de HEERE: Zo zal Ik de hoogmoed van Juda verderven, en die grote hoogmoed van Jeruzalem. Dit boosaardige volk, dat weigert Mijn woorden te horen, dat wandelt naar het goeddunken van zijn hart, en andere goden navolgt om die te dienen en zich voor die neer te buigen; dat zal worden als deze gordel, die nergens meer voor deugt. Want zoals een gordel zich hecht aan de middel van een man, zo heb Ik het hele huis van Israël en het hele huis van Juda aan Mij doen hechten, spreekt de HEERE, om Mij tot een volk te zijn, en tot een naam, en tot lof, en tot heerlijkheid; maar zij hebben niet gehoord.", "Matt 13:14": "En in hen wordt de profetie van Jesaja vervuld, die zegt: Met het gehoor zult u horen, en geenszins begrijpen; en ziende zult u zien, en geenszins opmerken.", "Gen 3:15": "En Ik zal vijandschap zetten tussen u en de vrouw, en tussen uw nageslacht en haar Nageslacht; Dat zal u de kop vermorzelen, en u zult Het de hiel vermorzelen.", "Joh 6:45": "Er is geschreven in de profeten: En zij zullen allen door God onderwezen zijn. Ieder dan die het van de Vader gehoord en geleerd heeft, komt tot Mij.", "Deut 28:65": "Daarbij zult u onder die volken geen rust vinden, en uw voetzool zal geen rust hebben; want de HEERE zal u daar een bevend hart geven, en bezwijking van de ogen, en kwelling van de ziel.", "Jes 37:27": "Daarom waren haar inwoners machteloos, zij waren verslagen en beschaamd; zij waren als het gras van het veld en de groene grasscheutjes, als het hooi op de daken, en het brandkoren, voordat het overeind staat.", "Matt 5:21": "U hebt gehoord dat tot de ouden gezegd is: U zult niet doden; en wie doodt, die zal strafbaar zijn voor het gericht.", "Spr 26:11": "Zoals een hond terugkeert naar zijn uitspuwsel, zo herneemt de dwaas zijn dwaasheid.", "Jes 35:4": "Zegt tegen de onbedachtzamen van hart: Wees sterk, en vrees niet; zie, uw God zal ter wrake komen met de vergelding van God. Hij zal komen en u verlossen.", "Hand 7:32": "die zei: Ik ben de God van uw vaders, de God van Abraham, en de God van Izak, en de God van Jakob. En Mozes begon hevig te beven, en durfde niet te kijken.", "Joh 16:9": "Van zonde, omdat zij in Mij niet geloven;", "Dan 9:26": "En na die tweeënzestig weken zal de Messias uitgeroeid worden, maar het zal niet voor Hemzelf zijn; en een volk van de vorst die komen zal, zal de stad en het heiligdom verderven, en zijn einde zal zijn met een overstromende vloed, en tot het einde toe zal er oorlog zijn, en vast besloten verwoestingen.", "Jes 22:1-14": "De last van het dal van het gezicht. Wat is er nu met u, dat u helemaal naar de daken bent geklommen? U, die vol was van groot rumoer, u woelige stad, u, vrolijk huppelende stad, uw gesneuvelden zijn niet gesneuveld door het zwaard, en ook niet gestorven in de strijd. Al uw leiders zijn samen weggevlucht; zij zijn door de schutters gebonden, allen die in u gevonden zijn, zijn samen gebonden, zij zijn van ver gevlucht.", "Hand 7:26-28": "En de volgende dag liet hij zich aan hen zien, terwijl zij vochten; en hij drong hen tot vrede, en zei: Mannen, u bent broeders; waarom doet u elkaar onrecht aan? Maar die zijn naaste onrecht aandeed, stiet hem weg, en zei: Wie heeft u tot leider en rechter over ons gesteld? Wilt u mij ook ombrengen, zoals u gisteren de Egyptenaar hebt omgebracht?", "Hand 7:3": "en zei tegen hem: Ga uit uw land en uit uw familie, en kom in een land dat Ik u wijzen zal.", "Ps 45:7": "Uw troon, o God! is eeuwig en altijd; de scepter van Uw koninkrijk is een scepter van rechtmatigheid.", "Rom 9:31": "Maar Israël, dat de wet van de rechtvaardigheid zocht, is tot de wet van de rechtvaardigheid niet gekomen.", "Rom 10:6": "Maar de rechtvaardigheid die uit het geloof is, spreekt zo: Zeg niet in uw hart: Wie zal naar de hemel opklimmen? Dat is: om Christus van boven af te brengen.", "Lev 19:18": "U zult niet wreken, noch toorn koesteren tegen de kinderen van uw volk; maar u zult uw naaste liefhebben als uzelf; Ik ben de HEERE!", "Deut 1:44": "Toen trokken de Amorieten, die op dat gebergte woonden, op u af, en achtervolgden u, zoals bijen doen; en zij verpletterden u in Seïr tot Horma toe.", "Rom 3:14": "Hun mond is vol vervloeking en bitterheid;", "Luk 18:8": "Ik zeg u dat Hij hun snel recht zal doen. Maar de Zoon des mensen, zal Hij, als Hij komt, geloof vinden op de aarde?", "Luk 1:38-56": "En Maria zei: Zie, de dienstmaagd van de Heere; mij gebeure naar uw woord. En de engel ging van haar weg. En Maria stond in diezelfde dagen op en reisde met haast naar het gebergte, naar een stad van Juda; en kwam in het huis van Zacharias, en groette Elizabet.", "Matt 15:7-9": "Huichelaars! Terecht heeft Jesaja over u geprofeteerd, toen hij zei: Dit volk nadert Mij met hun mond, en eert Mij met de lippen, maar hun hart houdt zich ver van Mij; Maar tevergeefs eren zij Mij, terwijl zij leringen leren die geboden van mensen zijn.", "Jes 11:12": "En Hij zal een banier oprichten onder de heidenen, en Hij zal de verdrevenen van Israël verzamelen, en de verstrooiden uit Juda bijeenbrengen, van de vier hoeken van het aardrijk.", "Gal 3:13": "Christus heeft ons verlost van de vloek van de wet, doordat Hij voor ons een vloek geworden is; want er is geschreven: Vervloekt is ieder die aan het hout hangt.", "2 Petr 3:4": "En zeggen: Waar is de belofte van Zijn komst? Want vanaf de dag dat de vaders ontslapen zijn, blijven alle dingen zo, net zoals vanaf het begin van de schepping.", "Jes 53:3-6": "Hij was veracht, en de onwaardigste onder de mensen, een Man van smarten, en vertrouwd met ziekte; en ieder verborg als het ware het gezicht voor Hem; Hij was veracht, en wij hebben Hem niet geacht. Waarlijk, Hij heeft onze ziekten op Zich genomen, en onze smarten heeft Hij gedragen; maar wij hielden Hem voor een geplaagde, door God geslagen en verdrukt. Maar Hij is om onze overtredingen verwond, om onze ongerechtigheden is Hij verbrijzeld; de straf die ons de vrede aanbrengt, was op Hem, en door Zijn striemen is er voor ons genezing gekomen.", "Matt 22:45": "Als David Hem dan zijn Heere noemt, hoe is Hij dan zijn Zoon?", "Rom 9:15": "Want Hij zegt tegen Mozes: Ik zal Mij ontfermen over wie Ik Mij ontferm, en zal barmhartig zijn voor wie Ik barmhartig ben.", "Hebr 10:13": "verder wachtend, totdat Zijn vijanden neergelegd worden als een voetbank voor Zijn voeten.", "Jer 11:9-23": "Verder zei de HEERE tegen mij: Er is een samenzwering gevonden onder de mannen van Juda, en onder de inwoners van Jeruzalem. Zij zijn teruggekeerd tot de ongerechtigheden van hun voorvaders, die Mijn woorden geweigerd hebben te horen; en zij zijn andere goden nagelopen, om die te dienen; het huis van Israël en het huis van Juda hebben Mijn verbond gebroken, dat Ik met hun vaderen gemaakt heb. Daarom zegt de HEERE zo: Zie, Ik zal een kwaad over hen brengen, waaruit zij niet zullen kunnen ontkomen; als zij dan tot Mij zullen roepen, zal Ik naar hen niet horen.", "Ps 119:161": "Schin. De vorsten hebben mij vervolgd zonder oorzaak; maar mijn hart heeft gevreesd voor Uw woord.", "Hand 2:17-21": "En het zal gebeuren in de laatste dagen, zegt God, dat Ik van Mijn Geest zal uitstorten op alle vlees; en uw zonen en uw dochters zullen profeteren, en uw jongemannen zullen visioenen zien, en uw ouden zullen dromen dromen. En ook op Mijn dienstknechten, en op Mijn dienstmaagden, zal Ik in die dagen van Mijn Geest uitstorten, en zij zullen profeteren. En Ik zal wonderen geven in de hemel boven, en tekenen op de aarde beneden: bloed en vuur en rookwalm.", "Hab 1:6-11": "Want zie, Ik verwek de Chaldeeën, een bitter en snel volk, dat door de breedten van de aarde trekt, om woningen die niet van hem zijn, in erfelijk bezit te nemen. Schrikkelijk en vreselijk is het; zijn recht en zijn hoogheid gaan van hemzelf uit. Want zijn paarden zijn lichter dan de luipaarden, en zij zijn scherper dan de avondwolven, en zijn ruiters verspreiden zich; ja, zijn ruiters zullen van verre komen, zij zullen vliegen als een arend, die zich haast om te eten.", "Zach 11:12": "Want ik had tegen hen gezegd: Als het goed is in uw ogen, breng mijn loon, en zo niet, laat het na. En zij hebben mijn loon gewogen, dertig zilverlingen.", "1 Kor 1:23": "Maar wij prediken Christus, de Gekruisigde, voor de Joden wel een ergernis, en voor de Grieken een dwaasheid;", "Gen 4:25": "En Adam had opnieuw gemeenschap met zijn vrouw, en zij baarde een zoon, en zij noemde zijn naam Seth; want God heeft mij, zei zij, een ander nageslacht gegeven in de plaats van Abel; want Kaïn heeft hem doodgeslagen.", "Ps 102:26-28": "U hebt voormaals de aarde gegrond, en de hemelen zijn het werk van Uw handen; Die zullen vergaan, maar U zult staande blijven; en zij alle zullen als een kleed verouderen; U zult ze veranderen als een gewaad, en zij zullen veranderd zijn. Maar U bent Dezelfde, en Uw jaren zullen niet geëindigd worden.", "Rom 12:20": "Als dan uw vijand honger heeft, geef hem te eten; als hij dorst heeft, geef hem te drinken; want als u dat doet, zult u kolen van het vuur op zijn hoofd hopen.", "Hebr 8:8-12": "Want omdat Hij hen berispt, zegt Hij tegen hen: Zie, de dagen komen, spreekt de Heere, dat Ik over het huis van Israël en over het huis van Juda een nieuw verbond zal oprichten; Niet naar het verbond dat Ik met hun vaderen gemaakt heb, op de dag dat Ik hen bij de hand nam om hen uit Egypteland te leiden; want zij zijn in dit Mijn verbond niet gebleven, en Ik heb niet meer naar hen omgekeken, zegt de Heere. Want dit is het verbond dat Ik met het huis van Israël maken zal na die dagen, zegt de Heere: Ik zal Mijn wetten in hun verstand geven, en in hun harten zal Ik ze inschrijven; en Ik zal hun tot een God zijn, en zij zullen Mij tot een volk zijn.", "Hand 22:18": "en dat ik Hem zag, en Hij tegen mij zei: Haast u, en ga snel uit Jeruzalem weg; want zij zullen uw getuigenis over Mij niet aannemen.", "Ex 23:21": "Wees op uw hoede voor Zijn aangezicht, en wees Zijn stem gehoorzaam, en verbitter Hem niet; want Hij zal uw overtredingen niet vergeven; want Mijn Naam is in Hem.", "Matt 4:16": "het volk dat in duisternis zat, heeft een groot licht gezien; en over hen die zaten in het land en de schaduw van de dood, is een licht opgegaan.", "Jes 58:3": "En zeggen: Waarom vasten wij, en ziet U het niet aan, waarom kwellen wij onze ziel, en weet U het niet? Zie, op de dag waarop u vast, vindt u uw genoegen, en u eist streng al uw arbeid.", "Jes 66:1": "Zo zegt de HEERE: De hemel is Mijn troon, en de aarde is de voetbank van Mijn voeten; waar zou dat huis zijn, dat u Mij zou bouwen, en waar is de plaats van Mijn rust?", "Mark 1:3": "De stem van hem die roept in de woestijn: Bereid de weg van de Heere, maak Zijn paden recht.", "Ps 69:26": "Hun paleis worde verwoest; in hun tenten zij geen inwoner.", "Matt 3:3": "Want deze is het, van wie gesproken is door Jesaja, de profeet, toen hij zei: De stem van hem die roept in de woestijn: Bereid de weg van de Heere, maak Zijn paden recht!", "Hos 14:3": "Neem deze woorden met u, en bekeer u tot de Heere; zeg tegen Hem: Neem weg alle ongerechtigheid, en geef het goede, zo zullen wij betalen de stieren van onze lippen.", "Gen 21:12": "Maar God zei tegen Abraham: Laat het niet kwaad zijn in uw ogen vanwege de jongen en vanwege uw slavin; alles wat Sara tegen u zegt, luister naar haar stem; want in Izak zal uw nageslacht genoemd worden.", "Joh 5:44": "Hoe kunt u geloven, u die eer van elkaar aanneemt, en de eer die van God alleen is, niet zoekt?", "2 Kon 23:26": "Toch keerde de HEERE Zich niet af van de brand van Zijn grote toorn, waarmee Zijn toorn tegen Juda ontbrand was, om alle tergingen waarmee Manasse Hem getergd had.", "Matt 21:4": "Dit alles nu is gebeurd, opdat vervuld werd wat gesproken is door de profeet, die zei:", "2 Kon 21:12-15": "Daarom, zo zegt de HEERE, de God van Israël: Zie, Ik ga een kwaad over Jeruzalem en Juda brengen, zodat ieder die het hoort, beide zijn oren zullen tuiten. En Ik zal over Jeruzalem het meetsnoer van Samaria trekken, alsook het paslood van het huis van Achab; en Ik zal Jeruzalem uitwissen, zoals men een schotel uitwist; men wist hem uit, en men keert hem om op zijn holle kant. En Ik zal het overblijfsel van Mijn erfdeel verlaten, en zal het in de hand van hun vijanden geven; en zij zullen tot een roof en plundering worden voor al hun vijanden.", "Matt 15:4": "Want God heeft geboden en gezegd: Eer uw vader en moeder, en: Wie vader of moeder vervloekt, die zal de dood sterven.", "Hebr 8:5": "Deze priesters dienen het voorbeeld en de schaduw van de hemelse dingen, zoals Mozes door een goddelijke aanwijzing gewaarschuwd werd toen hij de tabernakel zou voltooien: Want, zegt Hij, zie erop toe dat u alles maakt naar het patroon dat u op de berg getoond is.", "Jona 4:11": "En zou Ik dan die grote stad Ninevé niet ontzien? Daarin wonen meer dan honderdtwintigduizend mensen, die geen onderscheid weten te maken tussen hun rechterhand en hun linkerhand; en bovendien nog veel vee?", "Gen 2:2": "Toen God op de zevende dag Zijn werk voltooid had, dat Hij gemaakt had, heeft Hij op de zevende dag gerust van al Zijn werk, dat Hij gemaakt had.", "Jes 28:14-22": "Daarom, hoor het woord van de HEER
