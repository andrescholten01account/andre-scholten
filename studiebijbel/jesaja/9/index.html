aten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Het volk dat in duisternis wandelt, zal een groot licht zien; wie wonen in het land van de schaduw van de dood, over hen zal een licht schijnen.","2":"U hebt dit volk vermenigvuldigd, *maar* U hebt de blijdschap niet groot gemaakt; zij zullen *toch* blij zijn voor Uw aangezicht, zoals men zich verblijdt bij de oogst, zoals men zich verheugt wanneer men de buit uitdeelt.","3":"Want het juk van hun last, en de stok van hun schouders, en de staf van hem die hen dreef, hebt U verbroken, zoals op de dag van de Midianieten;","4":"Toen de hele strijd van hen die streden, met gedruis gebeurde, en de kleren in het bloed gewenteld en verbrand werden, *tot* een voedsel van het vuur.","5":"Want een Kind is ons geboren, een Zoon is ons gegeven, en de heerschappij is op Zijn schouder; en men noemt Zijn naam Wonderlijk, Raad, Sterke God, Vader van de eeuwigheid, Vredevorst;","6":"De grootheid van deze heerschappij en van de vrede zal geen einde hebben op de troon van David en in zijn koninkrijk, om dat te bevestigen en te sterken met recht en met gerechtigheid, van nu af tot in eeuwigheid toe. De ijver van de HEERE van de heerscharen[1] zal dit doen.","7":"De Heere heeft een woord gezonden in Jakob, en het is gevallen in Israël.","8":"En dit hele volk zal het gewaar worden, Efraïm en de inwoner van Samaria; in hoogmoed en grootsheid van hart, en zij zeiden:","9":"De tichelstenen zijn gevallen, maar *met* uitgehouwen stenen zullen wij *opnieuw* bouwen; de wilde vijgenbomen zijn afgehouwen, maar wij zullen ze in cederen veranderen;","10":"Want de HEERE zal Rezins tegenstanders tegen hem opheffen, en Hij zal zijn vijanden samen verenigen:","11":"De Syriërs van voren, en de Filistijnen van achteren, zodat zij Israël opeten met volle mond. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.","12":"Want dit volk keert zich niet tot Hem, Die het slaat, en de HEERE van de heerscharen zoeken zij niet.","13":"Daarom zal de HEERE uit Israël afhouwen de kop en de staart, de tak en de biezen, op één dag.","14":"(De oude en aanzienlijke, die is de kop; maar de profeet die valsheid leert, die is de staart.)","15":"Want de leiders van dit volk zijn verleiders, en die door hen geleid worden, worden ingeslokt.","16":"Daarom zal de Heere Zich niet verblijden over hun jongelingen, en over hun wezen en hun weduwen zal Hij Zich niet ontfermen, want zij zijn allen samen huichelaars en boosdoeners, en elke mond spreekt dwaasheid. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.","17":"Want de goddeloosheid brandt als vuur, doornen en distels zal zij verteren, en zal aansteken de verwarde struiken van het woud, die zich verheven hebben *als* de verheffing van de rook.","18":"Vanwege de verbolgenheid van de HEERE van de heerscharen, zal het land verduisterd worden; en het volk zal zijn als een voedsel van het vuur: de een zal de ander niet ontzien.","19":"Als hij ter rechterhand snijdt, zal hij toch hongeren, en als hij ter linkerhand eet, zal hij toch niet verzadigd worden; ieder zal het vlees van zijn eigen arm eten;","20":"Manasse Efraïm, en Efraïm Manasse, *en* zij zullen samen tegen Juda zijn. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt."},"SV":{"1":"Het volk, dat in duisternis wandelt, zal een groot licht zien; degenen, die wonen in het land van de schaduw des doods, over dezelve zal een licht schijnen.","2":"Gij hebt dit volk vermenigvuldigd, *maar* Gij hebt de blijdschap niet groot gemaakt; zij zullen *nochtans* blijde wezen voor Uw aangezicht, gelijk men zich verblijdt in den oogst, gelijk men verheugd is, wanneer men de buit uitdeelt.","3":"Want het juk van hun last, en den stok hunner schouders, en den staf desgenen, die hen dreef, hebt Gij verbroken, gelijk ten dage der Midianieten;","4":"Toen de ganse strijd dergenen, die streden, met gedruis geschiedde, en de klederen in het bloed gewenteld en verbrand werden, *tot* een voedsel des vuurs.","5":"Want een Kind is ons geboren, een Zoon is ons gegeven, en de heerschappij is op Zijn schouder; en men noemt Zijn naam Wonderlijk, Raad, Sterke God, Vader der eeuwigheid, Vredevorst;","6":"Der grootheid dezer heerschappij en des vredes zal geen einde zijn op den troon van David en in zijn koninkrijk, om dat te bevestigen, en dat te sterken met gericht en met gerechtigheid, van nu aan tot in eeuwigheid toe. De ijver des HEEREN der heirscharen zal zulks doen.","7":"De Heere heeft een woord gezonden in Jakob, en het is gevallen in Israël.","8":"En al dit volk zal het gewaar worden, Efraïm en de inwoner van Samaria; in hoogmoed en grootsheid des harten, zeggende:","9":"De tichelstenen zijn gevallen, maar *met* uitgehouwen stenen zullen wij *wederom* bouwen; de wilde vijgebomen zijn afgehouwen, maar wij zullen ze in cederen veranderen;","10":"Want de HEERE zal Rezins tegenpartijders tegen hem verheffen, en Hij zal zijn vijanden samen vermengen:","11":"De Syriërs van voren, en de Filistijnen van achteren, dat zij Israël opeten met vollen mond. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.","12":"Want dit volk keert zich niet tot Dien, Die het slaat, en den HEERE der heirscharen zoeken zij niet.","13":"Daarom zal de HEERE afhouwen uit Israël den kop en den staart, den tak en de bieze, op een dag.","14":"(De oude en aanzienlijke, die is de kop; maar de profeet, die valsheid leert, die is de staart.)","15":"Want de leiders dezes volks zijn verleiders, en die van hen geleid worden, worden ingeslokt.","16":"Daarom zal zich de Heere niet verblijden over hun jongelingen, en hunner wezen en hunner weduwen zal Hij zich niet ontfermen, want zij zijn allen te zamen huichelaars en boosdoeners, en alle mond spreekt dwaasheid. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.","17":"Want de goddeloosheid brandt als vuur, doornen en distelen zal zij verteren, en zal aansteken de verwarde struiken des wouds, die zich verheven hebben *als* de verheffing des rooks.","18":"Vanwege de verbolgenheid des HEEREN der heirscharen, zal het land verduisterd worden; en het volk zal zijn als een voedsel des vuurs: de een zal den ander niet verschonen.","19":"Zo hij ter rechterhand snijdt, zal hij toch hongeren, en zo hij ter linkerhand eet, zal hij toch niet verzadigd worden; een iegelijk zal het vlees zijns arms eten;","20":"Manasse Efraïm, en Efraïm Manasse, *en* zij zullen te zamen tegen Juda zijn. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt."},"KJV":{"1":"The people that walked in darkness have seen a great light: they that dwell in the land of the shadow of death, upon them hath the light shined.","2":"Thou hast multiplied the nation, *and* not increased the joy: they joy before thee according to the joy in harvest, *and* as *men* rejoice when they divide the spoil.","3":"For thou hast broken the yoke of his burden, and the staff of his shoulder, the rod of his oppressor, as in the day of Midian.","4":"For every battle of the warrior *is* with confused noise, and garments rolled in blood; but *this* shall be with burning *and* fuel of fire.","5":"For unto us a child is born, unto us a son is given: and the government shall be upon his shoulder: and his name shall be called Wonderful, Counsellor, The mighty God, The everlasting Father, The Prince of Peace.","6":"Of the increase of *his* government and peace *there shall be* no end, upon the throne of David, and upon his kingdom, to order it, and to establish it with judgment and with justice from henceforth even for ever. The zeal of the LORD of hosts will perform","7":"The Lord sent a word into Jacob, and it hath lighted upon Israel.","8":"And all the people shall know, *even* Ephraim and the inhabitant of Samaria, that say in the pride and stoutness of heart,","9":"The bricks are fallen down, but we will build with hewn stones: the sycomores are cut down, but we will change *them into* cedars.","10":"Therefore the LORD shall set up the adversaries of Rezin against him, and join his enemies together;","11":"The Syrians before, and the Philistines behind; and they shall devour Israel with open mouth. For all this his anger is not turned away, but his hand *is* stretched out still.","12":"For the people turneth not unto him that smiteth them, neither do they seek the LORD of hosts.","13":"Therefore the LORD will cut off from Israel head and tail, branch and rush, in one day.","14":"The ancient and honourable, he *is* the head; and the prophet that teacheth lies, he *is* the tail.","15":"For the leaders of this people cause *them* to err; and *they that are* led of them *are* destroyed.","16":"Therefore the Lord shall have no joy in their young men, neither shall have mercy on their fatherless and widows: for every one *is* an hypocrite and an evildoer, and every mouth speaketh folly. For all this his anger is not turned away, but his hand *is* stretched out still.","17":"For wickedness burneth as the fire: it shall devour the briers and thorns, and shall kindle in the thickets of the forest, and they shall mount up *like* the lifting up of smoke.","18":"Through the wrath of the LORD of hosts is the land darkened, and the people shall be as the fuel of the fire: no man shall spare his brother.","19":"And he shall snatch on the right hand, and be hungry; and he shall eat on the left hand, and they shall not be satisfied: they shall eat every man the flesh of his own arm:","20":"Manasseh, Ephraim; and Ephraim, Manasseh: *and* they together *shall be* against Judah. For all this his anger is not turned away, but his hand *is* stretched out still."}},"tsk":{"1":[{"kopje":"wandelt","refs":["Jes 50:10","Jes 60:1-3","Jes 60:19","Micha 7:8","Micha 7:9","Matt 4:16","Luk 1:78","Luk 1:79","Luk 2:32","Joh 8:12","Joh 12:35","Joh 12:46","Ef 5:8","Ef 5:13","Ef 5:14","1 Petr 2:9","1 Joh 1:5-7"]},{"kopje":"in het land","refs":["Job 10:21","Ps 23:4","Ps 107:10","Ps 107:14","Amos 5:8"]}],"2":[{"kopje":"vermenigvuldigd","refs":["Jes 26:15","Jes 49:20-22","Neh 9:23","Ps 107:38","Hos 4:7","Zach 2:11","Zach 8:23","Zach 10:8"]},{"kopje":"blij zijn","refs":["Jes 12:1","Jes 25:9","Jes 35:2","Jes 35:10","Jes 54:1","Jes 55:12","Jes 61:7","Jes 61:10","Jes 65:18","Jes 66:10","Ps 4:8","Ps 126:5","Ps 126:6","Jer 31:7","Jer 31:12-14","Hand 8:8","Fil 4:4","1 Petr 1:8"]},{"kopje":"zoals","refs":["Jes 16:9","Jes 16:10"]},{"kopje":"zoals men zich verheugt","refs":["Richt 5:3","1 Sam 30:16","2 Kron 20:25-28","Ps 119:162","Luk 11:22"]}],"3":[{"kopje":"hebt U verbroken","refs":["Jes 14:25","Jes 47:6","Gen 27:40","Lev 26:13","Jer 30:8","Nahum 1:13"]},{"kopje":"de staf","refs":["Jes 10:5","Jes 10:27","Jes 14:3-5","Jes 30:31","Jes 30:32","Ps 125:3"]},{"kopje":"zoals op de dag","refs":["Jes 10:26","Richt 6:1-6","Richt 7:22-25","Richt 8:10-12","Ps 83:10-12"]}],"4":[{"kopje":"gedruis","refs":["Jes 13:4","1 Sam 14:19","Jer 47:3","Joël 2:5","Nahum 3:2"]},{"kopje":"verbrand","refs":["Jes 4:4","Jes 10:16","Jes 10:17","Jes 30:33","Jes 37:36","Jes 66:15","Jes 66:16","Ps 46:10","Ezech 39:8-10","Mal 3:2","Mal 3:3","Matt 3:11","Hand 2:3","Hand 2:19","2 Tess 1:8"]},{"kopje":"voedsel","refs":["Lev 3:11","Lev 3:16"]}],"5":[{"kopje":"Want","refs":["Jes 7:14","Luk 1:35","Luk 2:11"]},{"kopje":"ons gegeven","refs":["Joh 1:14","Joh 3:16","Joh 3:17","Rom 8:32","1 Joh 4:10-14"]},{"kopje":"de heerschappij","refs":["Jes 22:21","Jes 22:22","Ps 2:6-12","Ps 110:1-4","Jer 23:5","Jer 23:6","Zach 6:12","Zach 6:13","Zach 9:9","Zach 9:10","Matt 11:27","Matt 28:18","1 Kor 15:25","Ef 1:21","Ef 1:22","Openb 19:16"]},{"kopje":"Zijn naam","ref <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">turneth</span> not unto him that <span class=\"wl wl-kjv\" data-code=\"H5221\">smiteth</span> them, neither do they <span class=\"wl wl-kjv\" data-code=\"H1875\">seek</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of hosts.","13":"Therefore the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> from <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> and <span class=\"wl wl-kjv\" data-code=\"H2180\">tail,</span> <span class=\"wl wl-kjv\" data-code=\"H3712\">branch</span> and <span class=\"wl wl-kjv\" data-code=\"H100\">rush,</span> in <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> day.","14":"The <span class=\"wl wl-kjv\" data-code=\"H2205\">ancient</span> and <span class=\"wl wl-kjv\" data-code=\"H6440\">honourable,</span> <span class=\"wl wl-kjv\" data-code=\"H1931\">he</span> is the <span class=\"wl wl-kjv\" data-code=\"H7218\">head;</span> and the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> that <span class=\"wl wl-kjv\" data-code=\"H3384\">teacheth</span> <span class=\"wl wl-kjv\" data-code=\"H8267\">lies,</span> he is the tail.","15":"For the <span class=\"wl wl-kjv\" data-code=\"H833\">leaders</span> of this <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> cause them to <span class=\"wl wl-kjv\" data-code=\"H8582\">err;</span> and they that are <span class=\"wl wl-kjv\" data-code=\"H833\">led</span> of them are destroyed.","16":"Therefore the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> shall have no <span class=\"wl wl-kjv\" data-code=\"H8055\">joy</span> in their young <span class=\"wl wl-kjv\" data-code=\"H970\">men,</span> neither shall have <span class=\"wl wl-kjv\" data-code=\"H7355\">mercy</span> on their <span class=\"wl wl-kjv\" data-code=\"H3490\">fatherless</span> and <span class=\"wl wl-kjv\" data-code=\"H490\">widows:</span> for every one is an <span class=\"wl wl-kjv\" data-code=\"H2611\">hypocrite</span> and an <span class=\"wl wl-kjv\" data-code=\"H7489\">evildoer,</span> and every <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">speaketh</span> <span class=\"wl wl-kjv\" data-code=\"H5039\">folly.</span> For all this his <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> is not turned <span class=\"wl wl-kjv\" data-code=\"H7725\">away,</span> but his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> is stretched out still.","17":"For <span class=\"wl wl-kjv\" data-code=\"H7564\">wickedness</span> <span class=\"wl wl-kjv\" data-code=\"H1197\">burneth</span> as the <span class=\"wl wl-kjv\" data-code=\"H784\">fire:</span> it shall <span class=\"wl wl-kjv\" data-code=\"H398\">devour</span> the <span class=\"wl wl-kjv\" data-code=\"H8068\">briers</span> and <span class=\"wl wl-kjv\" data-code=\"H7898\">thorns,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H3341\">kindle</span> in the <span class=\"wl wl-kjv\" data-code=\"H5442\">thickets</span> of the <span class=\"wl wl-kjv\" data-code=\"H3293\">forest,</span> and they shall mount <span class=\"wl wl-kjv\" data-code=\"H55\">up</span> like the lifting <span class=\"wl wl-kjv\" data-code=\"H1348\">up</span> of smoke.","18":"Through the <span class=\"wl wl-kjv\" data-code=\"H5678\">wrath</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts</span> is the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> <span class=\"wl wl-kjv\" data-code=\"H6272\">darkened,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> shall be as the <span class=\"wl wl-kjv\" data-code=\"H3980\">fuel</span> of the <span class=\"wl wl-kjv\" data-code=\"H784\">fire:</span> no <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> shall <span class=\"wl wl-kjv\" data-code=\"H2550\">spare</span> his brother.","19":"And he shall <span class=\"wl wl-kjv\" data-code=\"H1504\">snatch</span> on the right <span class=\"wl wl-kjv\" data-code=\"H3225\">hand,</span> and be <span class=\"wl wl-kjv\" data-code=\"H7457\">hungry;</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> on the left <span class=\"wl wl-kjv\" data-code=\"H8040\">hand,</span> and they shall not be <span class=\"wl wl-kjv\" data-code=\"H7646\">satisfied:</span> they shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> the <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> of his own arm:","20":"<span class=\"wl wl-kjv\" data-code=\"H4519\">Manasseh,</span> <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim;</span> and <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim,</span> <span class=\"wl wl-kjv\" data-code=\"H4519\">Manasseh:</span> and they <span class=\"wl wl-kjv\" data-code=\"H3162\">together</span> shall be against <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah.</span> For all this his <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> is not turned <span class=\"wl wl-kjv\" data-code=\"H7725\">away,</span> but his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> is stretched out still."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"volk,","tekst":"Te weten, het volk Gods, zo in Juda als in Israël."},{"catchword":"in duisternis wandelt,","tekst":"Dat is, onwetenschap, of in grote ellende."},{"catchword":"een groot","tekst":"Te weten, predikatie van het heilig Evangelie; Mat 4:13 , Mat 4:16 , ten tijde der verschijning van Christus in het vlees, gelijk af te nemen is uit vs.5."},{"catchword":"in het land","tekst":"Dat is, in het land waar het schrikkelijk duister is; dat is, in zeer grote ellende; zie Job 3:5 ."},{"catchword":"een licht schijnen","tekst":"Dat is, vreugde en blijdschap vanwege de zaligmakende kennis van God, hun oorsprong nemende uit de predikatie van het heilige Evangelie, zie Mat 4:15 . Zie ook Psa 36:10 ."}],"2":[{"catchword":"Gij hebt","tekst":"Dit wordt gesproken tot God, aangaande het volk der Joden of Israëlieten."},{"catchword":"maar Gij hebt de blijdschap . . .","tekst":"Anders: en Gij hebt hun de blijdschap groot gemaakt, of: hebt Gij niet de blijdschap groot gemaakt? Naar de eerste overzetting is dit de zin: De Israëlieten hebben zich wel meermalen verblijd vanwege de treffelijke weldaden en verlossingen, die zij van uwe hand, o Heere, verkregen hebben, maar dat alles is klein ten aanzien van de overgrote, zo lichamelijke als geestelijke weldaden, die zij van U, Heere God, nog verwachtende zijn. Naar de andere overzetting is dit de zin: Heere, Gij hebt de blijdschap des volks groot gemaakt [sprekende van den stand der kerk van het Nieuwe Testament] doordien zij [bestaande uit Israëlieten en heidenen] met elkander eenparig U zullen loven vanwege de grote weldaden, hun in Christus bewezen."},{"catchword":"blijde wezen","tekst":"Te weten als zij U zullen danken voor uwe genade en weldaden; namelijk als zij Christus zullen horen prediken en zijne wonderwerken zien zullen."},{"catchword":"voor Uw aangezicht,","tekst":"Dit schijnt te betekenen de geestelijke blijdschap des harten, hetwelk alleen voor God openstaat. Of, voor uw aangezicht; dat is, voor U nederbukkende, als zij U komen dankzeggen."}],"3":[{"catchword":"het juk","tekst":"Dat is, het juk, waarmede zij belast of bezwaard waren, en den stok, waarmede men hen op de schouders sloeg. Doch dit alles is te verstaan van een geestelijk juk des duivels en der zonde, van welke Christus zijn volk verlost. En deze geestelijke verlossing wordt hier vergeleken bij de lichamelijke, die ten tijde van Midian geschied is, Jdg 7:22 ; Isa 10:26 . Want gelijk Gideon de Midianieten door het geklank der bazuinen verstrooid en verslagen heeft, alzo zou Christus door de bazuin van het heilig Evangelie het rijk des duivels verstoren."},{"catchword":"desgenen,","tekst":"Of, desgenen, die daarmede dreEf."}],"4":[{"catchword":"met gedruis","tekst":"Te weten, als die schrik over hen kwam en zij elkander ombrachten; Jdg 7:22 . Anders: met verward gewoel."},{"catchword":"de klederen","tekst":"Anders, de mantels; te weten der Midianieten."},{"catchword":"in het bloed","tekst":"Anders: in het vergoten bloed; te weten der Midianieten."},{"catchword":"voedsel des vuurs","tekst":"Hebreeuws, spijs."}],"5":[{"catchword":"Want","tekst":"Hier geeft de profeet reden waarom hij gezegd heeft dat het volk, hetwelk in duisternis wandelde, vs.1, groter vreugde en blijdschap genieten zou dan het eertijds gedaan heeft, en waarom hunne lasten zouden verbroken worden, te weten omdat hun een kind zou geboren worden, hetwelk hun een eeuwige vreugde en zaligheid zou aanbrengen. Vergelijk onder Isa 10:27 ."},{"catchword":"een Kind","tekst":"Te weten Jezus Christus, den vaderen van den aan beginne der wereld beloofd."},{"catchword":"is ons geboren,","tekst":"Dat is, zal ons in de volheid des tijds geboren worden. De profeet spreekt van de geboorte van Christus niet anders, dan of het alrede geschied ware vanwege de zekerheid dezer profetie. Zie Isa 53 , in de beschrijving van het lijden van Christus."},{"catchword":"een Zoon","tekst":"Te weten Jezus Christus, de Zoon van God; Psa 2:7 , en de Zoon van Maria; Isa 7:14 ."},{"catchword":"ons","tekst":"Te weten het volk Gods; of [ ons ], dat is, tot onze zaligheid; Luk 2:10-11 ."},{"catchword":"gegeven,","tekst":"Te weten van God; Joh 4:10 ."},{"catchword":"de heerschappij","tekst":"Anders: op wiens schouders de heerschappij zal zijn; dat is, wien van den Vader alle heerschappij en inzonderheid der kerk, wordt opgelegd, en die dezelve met ernst aanneemt. Zie Mat 28:18 ; Eph 1:21-22 ."},{"catchword":"noemt Zijn naam","tekst":"Christus Jezus heet niet alleen alzo met den bloten naam, maar Hij is het ook inderdaad, en zijne kerk kent hem voorzulks."},{"catchword":"Wonderlijk,","tekst":"Christus is wonderlijk, zowel ten aanzien van zijn persoon, dewijl Hij God en mens is in een persoon, als ten aanzien zijner wonderlijke werken en daden."},{"catchword":"Raad,","tekst":"Of, raadsman, raadgever, raadsheer. Versta dit alzo, dat Christus alleen den raad en het voornemen van zijnen Vader weet en aan zijne kerk openbaart en mededeelt, Joh 1:18 , zoveel hun ter zaligheid te weten van node is, Act 20:27 ; Hij is het ook, die ons in allen angst en nood raad geeft en hulp doet."},{"catchword":"Sterke God,","tekst":"Die door de sterkte zijner Godheid den onverdragelijken last van den toorn Gods over de zonden van alle uitverkorenen aan zijne mensheid gedragen heeft, en door zijn eigen kracht van de doden is opgestaan, en de harten zijner uitverkorenen wederbaart ten eeuwigen leven; alsook door de sterkte zijner Godheid grote wonderen gedaan heeft, nog doet, en eindelijk alle doden opwekken zal."},{"catchword":"Vader der eeuwigheid,","tekst":"Dat is, die zelf van eeuwigheid is, en ons het eeuwige leven geeft."},{"catchword":"Vredevorst;","tekst":"Dat is, die ons met God verzoent. Zie Eph 2:14 , enz."}],"6":[{"catchword":"dezer heerschappij","tekst":"Te weten die op den schouder van den Messias zal gelegd worden."},{"catchword":"den troon van David","tekst":"Als zijnde een rechte erfgenaam deszelven, en welke hem beloofd en toegezegd is; 2Sa 7:12 ; Luk 1:32-33 . Hij heeft het tijdelijk koninkrijk veranderd in een geestelijk en eeuwig; Joh 18:36 ."},{"catchword":"met gericht","tekst":"Want Hij straft alle ongerechtigheid, en bemint en bewaart de vromen."},{"catchword":"De ijver des HEEREN","tekst":"Dien Hij heeft over zijne eer en over de zaligheid zijner uitverkorenen. Zie de aantekening 2Ki 19:31 ."}],"7":[{"catchword":"De HEERE","tekst":"Hier komt de profeet wederom tot de dreigementen tegen de Israëlieten; alsof hij zeide: Ziet, dit is de last, dien de Heere bevolen heeft den Joden te verkondigen, want hij verstaat zo door het woord Jakob als door het woord Israël al de Joden. Alhoewel enigen menen dat dit alleen van de tien stammen te verstaan is."},{"catchword":"een woord","tekst":"Dat is, zijne dreigementen door zijne profeten verkondigen laten."},{"catchword":"het is gevallen","tekst":"Dat is, het zal geschieden en vervuld worden."}],"8":[{"catchword":"Efraïm","tekst":"Dat is, de Israëlieten, te weten de tien stammen, waar de stam van Efraïm te dien tijde de voornaamste was."},{"catchword":"Samaria;","tekst":"De hoofdstad der tien stammen."},{"catchword":"in hoogmoed","tekst":"Alsof hij zeide: Die zo stout en overmoedig zijn dat zij inplaats van zich te beteren door de plagen Gods, den Heere trotseren, sprekende gelijk er volgt vs.9."}],"9":[{"catchword":"De tichelstenen","tekst":"Dat is, de gebouwen van gebakken stenen, die zo heel sterk niet zijn, ook zo heel veel niet kosten. Alsof zij zeiden: Ofschoon wij van de Assyriërs grote schade geleden hebben en onze huizen en goederen zeer verdorven en verwoest zijn [zie 2Ki 15:29 ] , zo vragen wij daar niet naar; wij willen alles beter opbouwen dan het tevoren geweest is."},{"catchword":"zijn gevallen,","tekst":"Dat is, vergaan."},{"catchword":"uitgehouwen stenen","tekst":"Anders, gesneden, geslepen, gepolijste stenen, die sterker zijn en meer kosten dan de bakstenen, ook bestendiger zijn."},{"catchword":"de wilde vijgebomen","tekst":"Zie 1Ki 10:27 . De zin is: De huizen, die van wilde vijgebomenhout getimmerd waren."},{"catchword":"wij zullen ze","tekst":"Dat is, wij willen nu huizen gaan bouwen van cederhout, hetwelk veel beter en duurzamer is dan het wilde vijgebomenhout. Want het cederhout vergaat en verrot niet, maar het is zeer duurzaam, vanwege zijne droogte. Zie dergelijk grootspreken der trotse booswichten Mal 1:4 ."}],"10":[{"catchword":"Want de HEERE","tekst":"Hier verklaart de profeet hoe des Heeren woord op de tien stammen vallen zou, en hoe zij het zouden gewaar worden, waarvan vs.7,8 gesproken wordt."},{"catchword":"Rezins","tekst":"Dat is, de Assyriërs, die de Joden tegen Rezin verwekt en op de been gebracht hadden, om hen den krijg aan te doen; 2Ki 16:7-9 ."},{"catchword":"zijn vijanden","tekst":"Te weten van Efraïm, dat is, der tien stammen der Israëlieten. En versta hier door de vijanden der Israëlieten zijn oude vijanden, die vs.11 genoemd staan. De profeet wil zeggen dat allerlei natiën tezamen onder elkander zullen lopen tot Assur, om Efraïm te verderven, nadat God Rezin en zijn koninkrijk door den koning van Assyrië zou onderdrukt hebben."},{"catchword":"tezamen vermengen","tekst":"Dat is, Hij zal hen van alle hoeken en kanten vergaderen en hiertoe doen aanvliegen."}],"11":[{"catchword":"Israël","tekst":"Dat is, de Israëlieten, de tien stammen."},{"catchword":"opeten","tekst":"Hebreeuws, eten met gansen mond."},{"catchword":"met vollen mond","tekst":"Gelijk de leeuwen, beren, tijgers en andere wilde wrede beesten doen."},{"catchword":"Om dit alles","tekst":"Zie de aantekening Isa 5:25 ."},{"catchword":"Zijn toorn","tekst":"Te weten des Heeren toorn."},{"catchword":"is nog uitgestrekt","tekst":"Te weten om nog meer te slaan en te verderven."}],"12":[{"catchword":"dit volk","tekst":"Te weten de Israëlieten."},{"catchword":"keert zich niet","tekst":"Te weten met berouw en leedwezen zijner zonden en met gelovig gebed."},{"catchword":"tot Dien,","tekst":"Te weten tot den waren God."},{"catchword":"zoeken zij niet","tekst":"Te weten door hun gebed, gelijk Psa 34:5 ; of door onderhouding zijner geboden, gelijk 2Ch 14:4 ."}],"13":[{"catchword":"afhouwen","tekst":"Te weten door Salmanasser, den koning van Assyrië. Zie 2Ki 17:3 ."},{"catchword":"den kop . . . den tak","tekst":"Dat is, de sterken en geweldigen met de kleinen en geringen. Daarom stelt hier de profeet den tak niet den boom, omdat de wortel en stam of tronk van het Israëlietische volk in wezen gebleven en weder uitgewassen is, maar de takken zijn afgehouwen."},{"catchword":"op eenen dag","tekst":"Dat is, tegelijk en haastiglijk."}],"14":[{"catchword":"aanzienlijke,","tekst":"Hebreeuws, de verhevene van aangezicht; zie boven Isa 3:3 ."},{"catchword":"valsheid leert,","tekst":"Dat is, een valse leer of religie."},{"catchword":"is de staart","tekst":"Dat is, betekent."}],"15":[{"catchword":"Want","tekst":"Deze woorden hangen aan vs.13."},{"catchword":"de leiders","tekst":"Dat is, de regenten, zo kerkelijke als politieke. Zie de aantekening Isa 3:12 ."},{"catchword":"zijn verleiders,","tekst":"Omdat zij het volk, behalve allerlei andere verleidingen, wijsmaakten dat hetgeen God dreigde niet geschieden zou, maar dat alles in goeden welstand blijven zou."},{"catchword":"worden ingeslokt","tekst":"Of, verslonden; te weten van hunne verleiders. Vergelijk Isa 3:12 . Anders: zijn bedekt; dat is hun hart te overdekt met onwetendheid en valsen waan."}],"16":[{"catchword":"niet verblijden","tekst":"Versta hierbij, maar Hij zal hen gevankelijk laten wegvoeren, of ombrengen, dewijl zij boos en bedorven zijn."},{"catchword":"jongelingen,","tekst":"Hebreeuws, uitgelezenen, uitverkorenen."},{"catchword":"huichelaars","tekst":"Of, huichelaars, geveinsden. Zie Job 8:13 ."},{"catchword":"alle mond","tekst":"Te weten der Israëlieten."},{"catchword":"dwaasheid","tekst":"Zie de aantekening Gen 34:7 ."},{"catchword":"Om dit alles","tekst":"Zie boven Isa 5:25 , en boven vs.11."}],"17":[{"catchword":"de goddeloosheid","tekst":"Dat is, de goddelozen zullen vanwege hunne boosheid en onboetvaardigheid als met vuur verteerd en verdelgd worden."},{"catchword":"doornen","tekst":"Dat is, de een met den ander, groot en klein."},{"catchword":"de verwarde","tekst":"Dat is, de aanzienlijken en geweldigen, die zich tezamen verbinden. Hebreeuws, de verwarring des wouds. Zie Isa 10:34 . Of, zal aangestoken worden in, of onder, de verwarde struiken des wouds, die omhoog varen zullen als ene verheffing des rooks; dat is, door den brand in rook opgaan."},{"catchword":"de verheffing","tekst":"Of, optrekking, opstijging, verhoging."}],"18":[{"catchword":"zal","tekst":"Dat is, het land zal aan alle kanten vol ellende zijn."},{"catchword":"het land","tekst":"Te weten het land der Israëlieten."},{"catchword":"een voedsel","tekst":"Hebreeuws, ene spijs."},{"catchword":"des vuurs","tekst":"Zie Job 15:34 ."},{"catchword":"de een zal","tekst":"Of, niemand zal zijnen broeder verschonen. De zin is: Die het algemene landverderf ontkomen, zullen elkander vervolgen, bederven, ja ook doden."}],"19":[{"catchword":"snijdt,","tekst":"Te weten spijs of voeder. Anders: houwt, afhouwt. De zin is: Er zal zulk gebrek en hongersnood zijn, dat een ieder zal toegrijpen en toetasten, houwen en snijden, waar hij enigszins kan bijkomen, en nog zal het hem niet helpen."},{"catchword":"zijns arms eten;","tekst":"Dat is, van zijn naaste, op wien hij zich tevoren verlaten had. De zin is: De inwoners van het land van Israël zullen elkander vernielen; gelijk straks in vs.20 breder gezegd wordt."}],"20":[{"catchword":"Manasse","tekst":"Dat is, de Manassieten."},{"catchword":"Efraïm,","tekst":"Dat is, de Efraïmieten."},{"catchword":"tegen Juda zijn","tekst":"Dat is, tegen den stam van Juda."},{"catchword":"Om dit alles","tekst":"Zie boven vs.11."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"(1) The people [To wit, the people of God, both in Juda, and in Israel] that walked in darkness, [To wit, in ignorance, or, in great misery] shall see a great light: [To wit, the preaching of the Gospel, Mat 4:13,16. At the time of Christs coming in the flesh, as may be gathered from vers.5.] they that dwell in the Land of the shadow of death, [That is, in the Land where it is terrible dark; that is, in exceeding great misery. See Job 3.on vers.5.] upon them shall a light shine. [That is, joy and gladness for the saving knowledge of God, taking its rise or original from the preaching of the Gospel. See Mat 4:15. See also Psal.36.on vers.10.]"}],"2":[{"catchword":null,"tekst":"(2) Thou hast multiplied this people, [This is spoken to God, concerning the people of the Jews, or Israelites] (but) thou hast not made the joy great: [Oth. And thou hast made their joy great; or, hast thou not made their joy great? According to the first translation this is the sense and meaning, the Israelites indeed did often rejoice by reason of the excellent mercies and deliverances, which they had received at thy hand, O Lord; but all that is but a small thing, in comparison of the exceeding great both temporal and spiritual mercies, which they yet expect and look for at thy hand, O Lord God. According to the other rendering, this is the sense and meaning, Lord, thou hast increased the joy of the people, or made the peoples Joy great, (speaking of the state and condition of the Church of the New Testament) forasmuch as they (consisting of Israelites and heathen) shall praise thee with one accord for the great mercies afforded unto them in Christ] (yet) they shall rejoice [To wit, when they shall praise thee for thy grace and mercies: namely, when they shall hear Christ preach, and shall see his miracles] before thy face, [This seemeth to signify the spiritual Joy of the heart, which is onely open in the sight of God. Or, before thy face; that is, bowing down before thee when they come to give thee thanks] as men rejoice in harvest, as men rejoice when they divide the spoil."}],"3":[{"catchword":null,"tekst":"(3) .For the yoke of their burden, and the stick of their shoulders, and the staff of him that drave them, [Or, of him that drave therewith] hast thou broken, as in the day of the Medianites. [That is, the yoke wherewith they were burdened or oppressed, the stick or staff wherewith they were beaten on the shoulders. But all this is to be meant of the spiritual yoke of the Devil, and of sin, from which Christ delivereth his people. And this spiritual deliverance, which happened in the time of Midian, Judg.7.22. Isai.10.26. For as Gideon scattered and destroy // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

function plaatsPopup(el, html) {
  popup.innerHTML = html;

  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

/* ---------- kopieerfunctie ---------- */
function kopieerVers(n) {
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
}
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  kopieerVers(k.dataset.n);
});
// rechtermuisklik op een vers kopieert het (in plaats van het browser-contextmenu)
document.addEventListener('contextmenu', e => {
  const rij = e.target.closest('.vers');
  if (!rij || !rij.id.startsWith('v')) return;
  const n = rij.id.slice(1);
  if (!D.vertalingen.SVnu[n]) return;
  e.preventDefault();
  kopieerVers(n);
});

const concordCache = {};
async function haalConcord(map, cache, code) {

  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url}) (SVnu)`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
