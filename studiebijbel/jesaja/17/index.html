 zullen zijn gelijk de heerlijkheid der kinderen Israëls, spreekt de HEERE der heirscharen.", "4": "En het zal geschieden te dien dage, dat de heerlijkheid van Jakob verdund zal worden, en dat de vettigheid van zijn vlees mager worden zal.", "5": "Want hij zal zijn, gelijk *wanneer* een maaier het staande koren verzamelt, en zijn arm aren afmaait; ja, hij zal zijn, gelijk *wanneer* iemand aren leest in het dal Refraim.", "6": "Doch een nalezing zal daarin overig blijven, gelijk *in* de afschudding eens olijfbooms, twee *of* drie bezien in den top der opperste twijg, en vier *of* vijf aan zijn vruchtbare takken, spreekt de HEERE, de God Israëls.", "7": "Te dien dage zal de mens zien naar Dien, Die hem gemaakt heeft, en zijn ogen zullen op den Heilige Israëls zien.", "8": "En hij zal niet aanschouwen de altaren, het werk zijner handen, ook hetgeen zijn vingeren gemaakt hebben, zal hij niet aanzien, noch de bossen, noch de zonnebeelden.", "9": "Te dien dage zullen zijn sterke steden zijn, als een verlaten struik, en opperste tak, welke zij verlaten hebben, om der kinderen Israëls wil, hoewel daar verwoesting zal wezen.", "10": "Want gij hebt den God uws heils vergeten, en niet gedacht aan den Rotssteen uwer sterkte; daarom zult gij wel liefelijke planten planten, en gij zult hem met uitlandse ranken bezetten;", "11": "Ten dage, als gij ze zult geplant hebben, zult gij *die* doen wassen, en in den morgenstond zult gij uw zaad doen bloeien; *doch* het zal maar een hoop van het gemaaide zijn, in den dag der krankheid en der pijnlijke smart.", "12": "Wee der veelheid der grote volken, die daar bruisen, gelijk de zeeën bruisen; en *wee* het geruis der natiën, die daar ruisen, gelijk de geweldige wateren ruisen!", "13": "De natiën zullen *wel* ruisen, gelijk grote wateren ruisen; doch Hij zal hem schelden, zo zal hij verre wegvlieden, ja, hij zal gejaagd worden, als het kaf der bergen van den wind, en gelijk een kloot van den wervelwind.", "14": "Ten tijde des avonds, ziet, ./ezechiel/28/#v10", "ref": "Ezech 28:10", "svLabel": null}, {"disp": "Amos 9:10", "href": "../../amos/9/#v10", "ref": "Amos 9:10", "svLabel": null}, {"disp": "Luk 12:20", "href": "../../lukas/12/#v20", "ref": "Luk 12:20", "svLabel": null}, {"disp": "Luk 16:22-28", "href": "../../lukas/16/#v22", "ref": "Luk 16:22-28", "svLabel": null}, {"disp": "Hand 5:3-10", "href": "../../handelingen/5/#v3", "ref": "Hand 5:3-10", "svLabel": null}, {"disp": "1 Tess 5:3", "href": "../../1-thessalonicenzen/5/#v3", "ref": "1 Tess 5:3", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"Deut 32:43": "Juich, heidenen, met Zijn volk! want Hij zal het bloed van Zijn knechten wreken; en Hij zal de wraak op Zijn tegenpartijen doen wederkeren, en verzoenen Zijn land en Zijn volk.", "Ps 96:5": "Want al de goden van de volken zijn afgoden; maar de HEERE heeft de hemel gemaakt.", "Job 26:12": "Door Zijn kracht klieft Hij de zee, en door Zijn verstand verslaat Hij haar trots.", "Ps 37:36": "Maar hij ging voorbij, en zie, hij was er niet meer; en ik zocht hem, maar hij werd niet gevonden.", "Mal 3:6": "Want Ik, de HEERE, word niet veranderd; daarom zijn u, kinderen van Jakob, niet verteerd.", "Luk 12:20": "Maar God zei tegen hem: Jij dwaas! Nog deze nacht zal men uw ziel van u opeisen; en wat u hebt klaargemaakt, van wie zal het dan zijn?", "Gen 19:16": "Maar hij aarzelde; toen grepen die mannen zijn hand, en de hand van zijn vrouw, en de hand van zijn twee dochters, omdat de HEERE hem genadig was; en zij brachten hem naar buiten, en zetten hem buiten de stad neer.", "Ps 30:6": "Want een ogenblik is er in Zijn toorn, maar een leven in Zijn goedgunstigheid; 's avonds vernacht het geween, maar 's morgens is er gejuich.", "2 Kron 29:6": "Want onze vaders hebben overtreden, en gedaan wat kwaad was in de ogen van de HEERE, onze God, en hebben Hem verlaten, en zij hebben hun gezicht van de tabernakel van de HEERE afgewend, en hebben Hem de rug toegekeerd.", "Zef 2:9": "Daarom, zo waarachtig als Ik leef, spreekt de HEERE van de heerscharen, de God van Israël: Moab zal zeker zijn als Sodom, en de kinderen van Ammon als Gomorra, een netelveld, en een zoutgroeve, en een verwoesting tot in eeuwigheid! De overigen van Mijn volk zullen hen beroven, en het overige van Mijn volk zal hen erfelijk bezitten.", "Jes 51:17-20": "Word wakker, word wakker, sta op, Jeruzalem! U die gedronken hebt uit de hand van de HEERE de beker van Zijn grimmigheid; de droesem van de beker van de zwijmeling hebt u gedronken, ja, uitgezogen. Er is niemand van al de kinderen, die zij gebaard heeft, die haar zachtjes leidt; en niemand van al de kinderen, die zij opgevoed heeft, die haar bij de hand grijpt. Deze twee dingen zijn u overkomen, wie heeft medelijden met u? Er is verwoesting, en verbreking, en honger, en zwaard, door wie zal Ik u troosten?", "Micha 1:4-9": "En de bergen zullen onder Hem versmelten, en de dalen gekloofd worden, zoals was voor het vuur, zoals water dat uitgestort wordt in de laagte. Dit alles, om de overtreding van Jakob, en om de zonden van het huis van Israël; wie is het begin van de overtreding van Jakob? Is het niet Samaria? En wie van de hoogten van Juda? Is het niet Jeruzalem? Daarom zal Ik Samaria stellen tot een steenhoop van het veld, tot plantingen van een wijngaard; en Ik zal haar stenen in de vallei storten, en haar fundamenten blootleggen.", "Jes 2:18-21": "En elk van de afgoden zal helemaal vergaan. Dan zullen zij in de spelonken van de rotsstenen gaan, en in de holen van de aarde, vanwege de schrik van de HEERE, en vanwege de heerlijkheid van Zijn majesteit, wanneer Hij Zich zal opmaken, om de aarde te verschrikken. Op die dag zal de mens zijn zilveren afgoden, en zijn gouden afgoden, die zij zich gemaakt hadden, om zich daarvoor neer te buigen, wegwerpen voor de mollen en de vleermuizen;", "Ps 146:7": "Die de verdrukte recht doet, Die de hongerige brood geeft; de HEERE maakt de gevangenen los.", "Jes 42:5": "Zo zegt God, de HEERE, Die de hemelen geschapen en ze uitgebreid heeft, Die de aarde uitgespannen heeft, en wat daaruit voortkomt; Die aan het volk dat daarop is, de adem geeft, en de geest aan hen die daarop wandelen:", "Jes 31:9": "En hij zal van angst voorbijgaan naar zijn rots, en zijn vorsten zullen voor de banier verschrikken, spreekt de HEERE, Die te Sion vuur, en te Jeruzalem een oven heeft.", "Job 36:5": "Zie, God is machtig, toch veracht Hij niemand; machtig is Hij in kracht van hart.", "Ps 93:1": "De HEERE regeert, Hij is met majesteit bekleed; de HEERE is bekleed met sterkte, Hij heeft Zich omgord. Ook is de wereld bevestigd, zij zal niet wankelen.", "Jer 3:12": "Ga heen, en roep deze woorden uit naar het noorden, en zeg: Bekeer u, afgekeerd Israël! spreekt de HEERE, dan zal Ik Mijn toorn niet op u laten vallen; want Ik ben goedertieren, spreekt de HEERE. Ik zal de toorn niet voor eeuwig behouden.", "2 Kor 4:6": "Want God, Die gezegd heeft dat het licht uit de duisternis zou schijnen, is Degene Die in onze harten geschenen heeft, om te geven de verlichting van de kennis van de heerlijkheid van God in het aangezicht van Jezus Christus.", "Ps 119:73": "Jod. Uw handen hebben mij gemaakt, en bereid; maak mij verstandig, opdat ik Uw geboden leer.", "1 Kor 6:14": "En God heeft ook de Heere opgewekt, en zal ons opwekken door Zijn kracht.", "2 Kron 7:6": "Ook stonden de priesters op hun posten, en de Levieten met de muzikale instrumenten van de HEERE, die de koning David gemaakt had, om de HEERE te loven, dat Zijn goedertierenheid in eeuwigheid is, wanneer David door hun dienst Hem prees; en de priesters bliezen de trompetten tegenover hen, en heel Israël stond.", "Jes 28:1-8": "Wee de hoogmoedige kroon van de dronkaards van Efraïm, wiens heerlijke sieraad een verwelkende bloem is, die daar is op het hoofd van de zeer vruchtbare vallei, van hen die door de wijn geveld zijn. Zie, de Heere heeft een sterke en machtige, er is als een hagelvloed, een verwoestende storm; als een vloed van sterk, overstromend water zal Hij ze met de hand ter aarde neerwerpen. De hoogmoedige kroon van de dronkaards van Efraïm zal met voeten vertrapt worden.", "Rom 1:20": "Want Zijn onzichtbare dingen worden, vanaf de schepping van de wereld, uit de schepselen begrepen en doorzien, namelijk Zijn eeuwige kracht en Goddelijkheid, opdat zij niet te verontschuldigen zouden zijn.", "Hebr 12:29": "Want onze God is een verterend vuur.", "Gen 8:21": "En de HEERE rook die liefelijke reuk, en de HEERE zei in Zijn hart: Ik zal voortaan de aardbodem niet meer vervloeken om de mens; want het gedichtsel van het hart van de mens is slecht van zijn jeugd aan; en Ik zal voortaan niet meer al het levende slaan, zoals Ik gedaan heb.", "Matt 21:33-46": "Hoor een andere gelijkenis. Er was een heer des huizes, die een wijngaard plantte en er een omheining omheen zette, en er een wijnpersbak in groef, en een toren bouwde, en hem verhuurde aan landbouwers, en op reis ging naar het buitenland. Toen nu de tijd van de vruchten naderde, stuurde hij zijn dienstknechten naar de landbouwers, om zijn vruchten te ontvangen. En de landbouwers grepen zijn dienstknechten en sloegen de een, en doodden een ander, en stenigden een derde.", "Micha 1:6": "Daarom zal Ik Samaria stellen tot een steenhoop van het veld, tot plantingen van een wijngaard; en Ik zal haar stenen in de vallei storten, en haar fundamenten blootleggen.", "Joz 4:24": "Opdat alle volken van de aarde de hand van de HEERE zouden kennen, dat die sterk is; opdat u de HEERE, uw God, vreest, alle dagen.", "Deut 8:14": "Uw hart zich dan verheft, zodat u de HEERE, uw God, vergeet, Die u uit Egypteland, uit het slavenhuis, uitgeleid heeft;", "Ps 104:32": "Als Hij de aarde aanschouwt, dan beeft zij; als Hij de bergen aanraakt, dan roken zij.", "Job 10:2": "Ik zal tegen God zeggen: Verdoem mij niet; laat mij weten, waarom U met mij twist.", "Jer 10:6": "Omdat niemand U gelijk is, o HEERE! zo bent U groot, en groot is Uw Naam in macht.", "Mark 14:36": "En Hij zei: Abba, Vader! Alle dingen zijn U mogelijk; neem deze drinkbeker van Mij weg; maar niet wat Ik wil, maar wat U wilt.", "2 Kron 14:11": "En Asa riep tot de HEERE, zijn God, en zei: HEERE, het is voor U niets, te helpen hetzij de machtige, hetzij de krachteloze; help ons, o HEERE, onze God! Want wij steunen op U, en in Uw Naam zijn wij gekomen tegen deze menigte; o HEERE! U bent onze God; laat een sterfelijk mens tegen U niets vermogen.", "Jer 2:21": "Ik had u toch geplant, een edele wijnstok, een geheel getrouw zaad; hoe bent u Mij dan veranderd in verbasterde ranken van een vreemde wijnstok?", "Lev 26:40-45": "Dan zullen zij hun ongerechtigheid belijden, en de ongerechtigheid van hun vaderen met hun overtredingen, waarmee zij tegen Mij overtreden hebben, en ook dat zij tegen Mij in gewandeld hebben. Dat Ik ook tegen hen in gewandeld heb, en hen in het land van hun vijanden gebracht heb. Als dan hun onbesneden hart gebogen wordt, en zij dan de straf voor hun ongerechtigheid aanvaarden; Dan zal Ik denken aan Mijn verbond met Jakob, en ook aan Mijn verbond met Izak, en ook aan Mijn verbond met Abraham zal Ik denken, en aan het land zal Ik denken;", "Hos 14:2": "Bekeer u, o Israël! tot de Heere, uw God, toe; want u bent gevallen om uw ongerechtigheid.", "Job 20:11": "Zijn beenderen zullen vol zijn van zijn zonden uit zijn jeugd; die zullen met hem in het stof neerliggen.", "Ps 107:29": "Hij doet de storm stilstaan, zodat hun golven zwijgen.", "Ps 14:2": "De HEERE heeft uit de hemel neergezien op de mensenkinderen, om te zien of iemand verstandig was, die God zocht.", "Ps 68:34-36": "Voor Hem, Die daar rijdt in de hemel der hemelen, Die er van oudsher is; zie, Hij geeft Zijn stem, een stem van sterkte. Geeft God sterkte! Zijn hoogheid is over Israël, en Zijn sterkte in de bovenste wolken. O God! U bent ontzagwekkend vanuit Uw heiligdommen; de God van Israël, Die aan het volk sterkte en krachten geeft. Geloofd zij God!", "Zef 2:6": "En de kuststreek van de zee zal worden tot weiden, uitgegraven putten voor herders, en kooien voor kudden.", "Jona 4:10": "En de HEERE zei: U hebt medelijden met de wonderboom, waarvoor u niet gewerkt hebt en die u niet hebt laten groeien; die in één nacht ontstond, en in één nacht verging.", "Hos 8:14": "Want Israël heeft zijn Maker vergeten en tempels gebouwd, en Juda heeft versterkte steden vermenigvuldigd; maar Ik zal een vuur zenden in zijn steden, dat zal hun paleizen verteren.", "Jes 7:8-16": "Maar Damaskus zal het hoofd van Syrië zijn, en Rezin het hoofd van Damaskus; en over nog vijfenzestig jaar zal Efraïm verbroken worden, zodat het geen volk meer is. Ondertussen zal Samaria het hoofd van Efraïm zijn, en de zoon van Remalia het hoofd van Samaria. Als u niet gelooft, zult u zeker niet standhouden. En de HEERE ging verder met spreken tegen Achaz, en zei:", "Ps 32:5": "Mijn zonde maakte ik U bekend, en mijn ongerechtigheid bedekte ik niet. Ik zei: Ik zal belijdenis van mijn overtredingen doen voor de HEERE; en U vergaf de ongerechtigheid van mijn zonde. Sela.", "Klaagl 3:23": "Cheth. Zij zijn elke morgen nieuw, Uw trouw is groot.", "Jer 31:20": "Is Efraïm Mij niet een dierbare zoon, is hij Mij niet een troetelkind? Want sinds Ik tegen hem gesproken heb, denk Ik nog met ernst aan hem; daarom rommelt Mijn binnenste over hem; Ik zal Mij zijn zeker ontfermen, spreekt de HEERE.", "Ps 49:11": "Want hij ziet dat de wijzen sterven, dat samen een dwaas en een onverstandig mens omkomen, en hun bezit aan anderen nalaten.", "Ezra 9:14": "zullen wij dan weer teruggaan om Uw geboden te vernietigen, en ons te verzwageren met de volken van deze gruwelen? Zou U dan niet tegen ons toornen tot verterens toe, zodat er geen overblijfsel noch ontkoming zou zijn?", "Jak 4:8": "Kom dicht bij God, en Hij zal dicht bij u komen. Reinig de handen, zondaars, en zuiver de harten, dubbelhartigen!", "Rom 1:28": "En zoals het hun niet goeddacht God te erkennen, zo heeft God hen overgegeven aan een verkeerd denken, om dingen te doen die niet betamen;", "Job 36:18": "Omdat er grimmigheid is, pas op, dat Hij u niet misschien met een klap wegstoot; zodat u een groot rantsoen er niet af zou kunnen brengen.", "Amos 1:2": "En hij zei: De HEERE zal brullen uit Sion, en Zijn stem verheffen uit Jeruzalem; en de woningen van de herders zullen treuren, en de top van Karmel zal verdorren.", "Klaagl 1:19": "Koph. Ik riep tot mijn liefhebbers, maar zij hebben mij bedrogen; mijn priesters en mijn oudsten hebben in de stad de geest gegeven, toen zij voedsel voor zich zochten, opdat zij hun ziel mochten verkwikken.", "Ps 148:5": "Laat hen de Naam van de HEERE loven; want toen Hij het beval, werden zij geschapen.", "Job 34:14": "Als Hij Zijn hart tegen hem zette, Zijn geest en Zijn adem zou Hij tot Zich verzamelen;", "Jes 41:15": "Zie, Ik heb u gemaakt tot een scherpe nieuwe dorsslede, die scherpe punten heeft; u zult bergen dorsen en verpulveren, en heuvels zult u maken als kaf.", "Deut 32:29": "O, dat zij wijs waren; zij zouden dit vernemen, zij zouden op hun einde letten.", "Jes 9:7-20": "De Heere heeft een woord gezonden in Jakob, en het is gevallen in Israël. En dit hele volk zal het gewaar worden, Efraïm en de inwoner van Samaria; in hoogmoed en grootsheid van hart, en zij zeiden: De tichelstenen zijn gevallen, maar met uitgehouwen stenen zullen wij opnieuw bouwen; de wilde vijgenbomen zijn afgehouwen, maar wij zullen ze in cederen veranderen;", "Jes 15:1": "De last die op Moab rust. Zeker, in de nacht is Ar-Moab verwoest, zij is uitgeroeid; zeker, in de nacht is Kir-Moab verwoest, zij is uitgeroeid!", "Deut 32:36": "Want de HEERE zal Zijn volk recht doen, en het zal Hem berouwen over Zijn knechten; want Hij zal zien, dat de hand is weggegaan, en er niemand meer over is, gebonden of vrij.", "Job 8:13": "Zo zijn de wegen van allen die God vergeten; en de verwachting van de huichelaar zal vergaan.", "Job 9:12": "Zie, Hij zal roven, wie zal het Hem doen teruggeven? Wie zal tegen Hem zeggen: Wat doet U?", "2 Kron 14:5": "Hij nam ook uit alle steden van Juda de hoogten en de zonnebeelden weg; en het koninkrijk was voor hem stil.", "Luk 21:25": "En er zullen tekenen zijn in de zon, en maan, en sterren, en op de aarde benauwdheid van de volken met radeloosheid, wanneer de zee en de watergolven groot geluid zullen geven;", "Ex 34:6": "Toen de HEERE nu voor zijn aangezicht voorbijging, riep Hij: HEERE, HEERE, God, barmhartig en genadig, geduldig en groot van goedertierenheid en waarheid.", "Jer 49:23-29": "Tegen Damaskus. Beschaamd is Hamath en Arpad; omdat zij een slecht gerucht gehoord hebben, zijn zij gesmolten; bij de zee is bekommernis, men kan er niet rusten. Damaskus is slap geworden, zij heeft zich omgekeerd om te vluchten, en siddering heeft haar aangegrepen; benauwdheid en smarten als van een barende vrouw hebben haar bevangen; Hoe is de beroemde stad niet gelaten, de stad van mijn vrolijkheid!", "Rom 3:18": "Er is geen vreze van God voor hun ogen.", "Ps 32:2": "Gelukkig is de mens, die de HEERE de ongerechtigheid niet toerekent, en in wiens geest geen bedrog is.", "Ps 74:15": "U hebt een bron en beek gekliefd; U hebt sterke rivieren uitgedroogd.", "Jak 2:13": "Want een onbarmhartig oordeel zal komen over hem die geen barmhartigheid bewezen heeft; en de barmhartigheid triomfeert over het oordeel.", "Jes 14:11": "Uw hoogmoed is in het rijk van de dood neergestort, met het geschal van uw luiten; de maden zullen onder u gestrooid worden, en de wormen zullen u bedekken.", "Jes 25:4": "Want U bent voor de arme een Sterkte geweest, een Sterkte voor de nooddruftige, toen het hem bang was; een Toevlucht tegen de vloed, een Schaduw tegen de hitte; want het blazen van de tirannen is als een vloed tegen een wand.", "Luk 1:37": "Want geen ding zal bij God onmogelijk zijn.", "Deut 32:15": "Toen Jeschurun vet werd, sloeg hij achteruit (u bent vet geworden, u bent dik geworden, ja, met vet overdekt geworden!); en hij liet God varen, Die hem gemaakt heeft, en versmaadde de Rotssteen van zijn heil.", "Jes 14:15": "Ja, in het rijk van de dood zult u neergestoten worden, aan de zijden van de kuil!", "Hos 13:8": "Ik ontmoette hen als een berin die van haar jongen beroofd is, en scheurde het omhulsel van hun hart open; en Ik verslond hen daar als een leeuw; het wilde dier van het veld verscheurde hen.", "Openb 2:12-25": "En schrijf aan de engel van de gemeente die in Pergamus is: Dit zegt Hij, Die het tweesnijdend scherpe zwaard heeft: Ik weet uw werken, en waar u woont; namelijk daar waar de troon van de satan is, en u houdt Mijn Naam vast, en hebt Mijn geloof niet verloochend, ook in die dagen waarin Antipas, Mijn getrouwe getuige, gedood is bij u, daar waar de satan woont. Maar Ik heb enkele weinige dingen tegen u, dat u daar mensen hebt die de leer van Balaäm vasthouden, die Balak leerde de kinderen van Israël een aanstoot voor te werpen, opdat zij afgodenoffer zouden eten en hoereren.", "Job 27:8": "Want wat is de verwachting van de huichelaar, als hij gierig geweest zal zijn, wanneer God zijn ziel zal uittrekken?", "2 Kron 28:23": "Want hij offerde aan de goden van Damascus, die hem geslagen hadden, en zei: Omdat de goden van de koningen van Syrië hen helpen, zal ik hun offeren, opdat zij mij ook helpen; maar zij waren hem tot zijn val, alsook aan heel Israël.", "Ps 18:2": "Hij zei dan: Ik zal U hartelijk liefhebben, HEERE, mijn Sterkte!", "Jes 10:9": "Is niet Kalno gelijk Karchemis? Is Hamath niet gelijk Arfad? Is niet Samaria gelijk Damaskus?", "Ps 93:4": "Maar de HEERE in de hoogte is machtiger dan het bruisen van veel water, dan de machtige golven van de zee.", "Jer 8:5-22": "Waarom keert dit volk van Jeruzalem dan af, met een altijddurende afkering? Zij houden vast aan bedrog, zij weigeren terug te keren. Ik heb geluisterd en toegehoord, zij spreken wat niet recht is, er is niemand die berouw heeft over zijn slechtheid, en zegt: Wat heb ik gedaan? Ieder keert zich om in zijn eigen loop, zoals een onbesuisd paard zich stort in de strijd. Zelfs een ooievaar aan de hemel kent zijn vaste tijden, en een tortelduif, en kraanvogel, en zwaluw, nemen de tijd van hun aankomst waar; maar Mijn volk kent het recht van de HEERE niet.", "Jes 40:26": "Hef uw ogen op omhoog, en ziet, Wie deze dingen geschapen heeft; Die in getal hun leger voortbrengt; Die ze alle bij naam roept, vanwege de grootheid van Zijn krachten, en omdat Hij sterk van vermogen is; er wordt er niet één gemist.", "2 Kron 20:6": "En hij zei: HEERE, God van onze vaderen, bent U niet de God in de hemel? Ja, U heerst over alle koninkrijken van de heidenvolken; en in Uw hand is kracht en sterkte, zodat niemand tegen U stand kan houden.", "Rom 2:9": "Verdrukking en benauwdheid over elke ziel van de mens die het kwade doet, eerst van de Jood, en ook van de Griek;", "Jes 65:21": "En zij zullen huizen bouwen en bewonen, en zij zullen wijngaarden planten, en daarvan de vrucht eten.", "Ps 10:4": "De goddeloze zoekt God niet, zoals hij zijn neus omhoog steekt; al zijn gedachten zijn dat er geen God is.", "Jer 16:3": "Want zo zegt de HEERE van de zonen en van de dochters, die in deze plaats geboren worden; en van hun moeders, die hen baren, en van hun vaders, die hen verwekken in dit land:", "Jer 18:13-15": "Daarom, zo zegt de HEERE: Vraag nu onder de heidenvolken; wie heeft zoiets gehoord? De jonkvrouw Israël doet een zeer afschuwelijke zaak. Zal men ook om een rotssteen van het veld de sneeuw van Libanon verlaten? Zullen ook de vreemde, koude, vlietende wateren verlaten worden? Toch heeft Mijn volk Mij vergeten, zij branden reukwerk voor de ijdelheid; want zij hebben hen doen struikelen op hun wegen, op de oude paden, om te wandelen in stegen van een weg die niet opgehoogd is;", "Klaagl 3:31-33": "Caph. Want de Heere zal niet verstoten in eeuwigheid. Caph. Maar als Hij bedroefd heeft, zo zal Hij Zich ontfermen, naar de grootheid van Zijn blijken van goedertierenheid. Caph. Want Hij plaagt of bedroeft de kinderen van de mensen niet van harte.", "Rom 8:6-8": "Want het bedenken van het vlees is de dood, maar het bedenken van de Geest is leven en vrede. Daarom dat het bedenken van het vlees vijandschap is tegen God; want het onderwerpt zich niet aan de wet van God, want het kan ook niet. En zij die in het vlees zijn, kunnen God niet behagen.", "Micha 3:12": "Daarom, om uwentwil, zal Sion als een akker geploegd worden, en Jeruzalem zal tot steenhopen worden, en de berg van dit huis tot hoogten van een woud.", "Jer 13:25": "Dit zal uw lot zijn, het deel dat u van Mij is toegemeten, spreekt de HEERE; u, die Mij hebt vergeten, en op leugen vertrouwt.", "Hos 13:15": "Want hij zal vrucht voortbrengen onder de broeders; toch zal er een oostenwind komen, een wind van de Heere, opkomend uit de woestijn; en zijn bron zal uitdrogen, die zal de schat van alle kostbare voorwerpen roven.", "Ef 1:20": "Die Hij gewrocht heeft in Christus, toen Hij Hem uit de doden heeft opgewekt; en Hem heeft gezet aan Zijn rechterhand in de hemel;", "Hos 3:4": "Want de kinderen van Israël zullen veel dagen blijven zitten, zonder koning, en zonder vorst, en zonder offer, en zonder opgericht beeld, en zonder efod en terafim.", "Jer 32:18": "U, Die goedertierenheid bewijst aan duizenden, en de ongerechtigheid van de vaders vergeldt in de schoot van hun kinderen na hen; U grote, U geweldige God, Wiens Naam is HEERE van de heerscharen!", "Job 36:12": "Maar als zij niet horen, dan gaan zij door het zwaard om, en geven zij de geest zonder kennis.", "Jer 29:11": "Want Ik weet de gedachten die Ik over u koester, spreekt de HEERE, gedachten van vrede en niet van kwaad, om u het einde en de verwachting te geven.", "Ezech 16:6": "Toen Ik bij u voorbijkwam, zag Ik u, vertrapt in uw bloed, en Ik zei tegen u in uw bloed: Leef; ja, Ik zei tegen u in uw bloed: Leef!", "1 Petr 1:5": "Die in de kracht van God bewaard wordt door het geloof tot de zaligheid, die klaarligt om geopenbaard te worden in de laatste tijd.", "Jes 59:1": "Zie, de hand van de HEERE is niet te kort om te kunnen verlossen, en Zijn oor is niet zwaar geworden om te kunnen horen.", "Jes 60:10": "En de vreemden zullen uw muren bouwen, en hun koningen zullen u dienen; want in Mijn verbolgenheid heb Ik u geslagen, maar in Mijn welbehagen heb Ik Mij over u ontfermd.", "Hebr 11:3": "Door het geloof begrijpen wij dat de wereld door het woord van God gemaakt is, zodat de dingen die men ziet niet ontstaan zijn uit dingen die zichtbaar zijn.", "Ezech 26:19": "Want zo zegt de Heere HEERE: Als Ik u zal stellen tot een verwoeste stad, gelijk de steden die niet bewoond worden; als Ik een afgrond over u zal doen opkomen, en het grote water u zal overdekken.", "Ps 95:5": "Van Hem is ook de zee, want Hij heeft ze gemaakt; en Zijn handen hebben het droge gevormd.", "Spr 11:7": "Als de goddeloze mens sterft, vergaat zijn verwachting; zelfs de allersterkste hoop is vergaan.", "Hab 2:17": "Want het geweld dat tegen Libanon begaan is, zal u bedekken, en de verwoesting van de dieren zal u verschrikken, vanwege het bloed van de mensen, en het geweld in het land, de stad, en aan alle inwoners daarvan.", "Ps 146:6": "Die de hemel en de aarde gemaakt heeft, de zee en alles wat daarin is; Die trouw houdt in eeuwigheid.", "Ezech 16:23": "Het is ook gebeurd na al uw slechtheid (wee, wee u, spreekt de Heere HEERE),", "Jer 6:30": "Men noemt hen een verworpen zilver; want de HEERE heeft hen verworpen.", "Hebr 3:16-18": "Want sommigen, toen zij die gehoord hadden, hebben Hem verbitterd, maar niet allen die uit Egypte door Mozes weggetrokken zijn. Over wie nu is Hij veertig jaar lang vertoornd geweest? Was het niet over hen die gezondigd hadden, van wie de lichamen gevallen zijn in de woestijn? En aan wie heeft Hij gezworen dat zij Zijn rust niet zouden binnengaan, dan aan hen die ongehoorzaam geweest waren?", "Ps 55:24": "Maar U, o God! zult hen doen neerdalen in de put van het verderf; de mannen van het bloed en het bedrog zullen hun dagen niet tot de helft brengen; ik, daarentegen, zal op U vertrouwen.", "Deut 24:20": "Wanneer u uw olijfboom geschud hebt, zult u de takken daarna niet nauwkeurig doorzoeken; voor de vreemdeling, voor de wees en voor de weduwe zal het zijn.", "Rom 1:22": "terwijl zij zich voor wijzen uitgaven, zijn zij dwaas geworden;", "Ezech 16:42": "Zo zal Ik Mijn grimmigheid op u laten rusten, en Mijn ijver zal van u wijken; en Ik zal stil zijn, en niet meer toornig zijn.", "Amos 9:5": "Want de Heere HEERE van de heerscharen is het, Die het land aanraakt, zodat het versmelt, en allen die daarin wonen treuren; en heel het land stijgt op als een rivier, en wordt verdronken als door de rivier van Egypte.", "2 Petr 3:15": "En beschouw het geduld van onze Heere als redding; zoals ook onze geliefde broeder Paulus, naar de wijsheid die hem gegeven is, aan u geschreven heeft;", "Gen 2:7": "En de HEERE God had de mens gevormd uit het stof van de aarde, en in zijn neusgaten de adem van het leven geblazen; zo werd de mens tot een levende ziel.", "Ps 111:6": "Caph. Hij heeft de kracht van Zijn werken aan Zijn volk bekendgemaakt; Lamed. door hun de erve van de heidenen te geven.", "Hos 5:5": "Daarom zal Israël hoogmoed in zijn gezicht getuigen; en Israël en Efraïm zullen vallen door hun ongerechtigheid; ook Juda zal met hen vallen.", "Deut 6:12": "Zo let erop, dat u de HEERE niet vergeet, Die u uit Egypteland, uit het diensthuis heeft uitgeleid.", "Ezech 18:32": "Want Ik heb geen lust aan de dood van hem die sterft, spreekt de Heere HEERE; daarom bekeer u en leef.", "Mal 3:7": "Vanaf de dag van uw vaderen af zijn jullie afgeweken van Mijn inzettingen, en hebben ze niet bewaard; keer terug tot Mij, en Ik zal tot u terugkeren, zegt de HEERE van de heerscharen; maar u zegt: Waarin zullen wij terugkeren?", "1 Kron 18:5": "En de Syriërs van Damaskus kwamen om Hadar-ezer, de koning van Zoba, te helpen; maar David sloeg van de Syriërs tweeëntwintigduizend man.", "2 Kron 13:11": "En zij steken voor de HEERE brandoffers aan, op elke morgen en op elke avond, ook reukwerk van welriekende specerijen, met de bereiding van het brood op de reine tafel, en de gouden kandelaar en zijn lampen, om die elke avond te laten branden; want wij nemen de wacht van de HEERE, onze God, waar; maar u hebt Hem verlaten.", "Jes 2:6": "Maar U hebt Uw volk, het huis van Jakob, verlaten, want zij zijn vervuld met goddeloosheid, meer dan het oosten, en zij zijn van het guichelaar gelijk de Filistijnen, en aan de kinderen van de vreemden tonen zij hun behagen.", "2 Kron 25:8": "Maar als u toch gaat, doe het dan, wees sterk voor de strijd; God zal u laten vallen voor de vijand; want in God is kracht om te helpen en om te doen vallen.", "Ex 20:22": "Toen zei de HEERE tegen Mozes: Zo zult u tegen de kinderen van Israël zeggen: U hebt gezien dat Ik met u vanuit de hemel gesproken heb.", "Jer 51:33": "Want zo zegt de HEERE van de heerscharen, de God van Israël: De dochter van Babel is als een dorsvloer, het is tijd dat men haar dorst; nog een korte tijd, dan zal haar de tijd van de oogst overkomen.", "Ezech 20:42": "En u zult weten dat Ik de HEERE ben, wanneer Ik u in het land van Israël gebracht zal hebben, in het land waarover Ik Mijn hand heb opgeheven om het aan uw vaderen te geven.", "Jak 5:15": "En het gebed van het geloof zal de zieke behouden, en de Heere zal hem oprichten; en als hij zonden gedaan heeft, zal het hem vergeven worden.", "Ps 116:5": "De HEERE is genadig en rechtvaardig, en onze God ontfermt Zich.", "Jak 5:11": "Zie, wij noemen hen gelukkig die volharden; u hebt van de volharding van Job gehoord, en u hebt gezien hoe de Heere het einde bracht, dat de Heere zeer barmhartig is en vol ontferming.", "Lev 26:16": "Dan zal Ik u dit ook doen: Ik zal over u schrik stellen, tering en koorts, die de ogen verteren en de ziel pijnigen; u zult ook uw zaad tevergeefs zaaien, en uw vijanden zullen dat opeten.", "Jes 5:12": "En harp en luit, tamboerijn en fluit, en wijn zijn bij hun feesten; maar zij letten niet op het werk van de HEERE, en zij zien niet op het maaksel van Zijn handen.", "Jes 1:4-7": "Wee het zondige volk, het volk van zware ongerechtigheid, het nageslacht van de boosdoeners, de verdervende kinderen! Zij hebben de HEERE verlaten, zij hebben de Heilige van Israël gelasterd, zij hebben zich vervreemd, wijkende achterwaarts. Waartoe zou u nog meer geslagen worden? U zou van het afval des te meer maken; het hele hoofd is ziek, en het hele hart is mat. Van de voetzool af tot het hoofd toe is er niets van het geheel gaaf aan hem; maar wonden, en striemen, en etterbuilen, die niet uitgedrukt noch verbonden zijn, en geen daarvan is met olie verzacht.", "Ex 20:6": "en Die barmhartigheid doe aan duizenden van hen die Mij liefhebben en Mijn geboden onderhouden.", "Ezech 2:3-5": "En Hij zei tegen mij: Mensenkind! Ik zend u tot de kinderen van Israël, tot de rebellerende volken, die tegen Mij gerebelleerd hebben; zij en hun vaderen hebben tegen Mij overtreden tot op deze huidige dag. En deze kinderen zijn hard van gezicht, en stijf van hart; Ik zend u tot hen, en u zult tegen hen zeggen: Zo zegt de Heere HEERE! En zij, hetzij dat zij het horen zullen, of hetzij dat zij het laten zullen (want zij zijn een opstandig huis), zo zullen zij weten, dat er een profeet in hun midden geweest is.", "Gen 9:6": "Wie het bloed van een mens vergiet, diens bloed zal door de mens vergoten worden; want God heeft de mens naar Zijn beeld gemaakt.", "Ex 15:3": "De HEERE is een krijgsman; HEERE is Zijn Naam!", "Jona 1:9": "En hij zei tegen hen: Ik ben een Hebreeër; en ik vrees de HEERE, de God van de hemel, Die de zee en het droge gemaakt heeft.", "Hos 5:1-15": "Hoor dit, priesters! En let op, huis van Israël! En neem ter ore, huis van de koning! Want u geldt dit oordeel, omdat u een strik bent geworden bij Mizpa, en een uitgespannen net op Thabor. En zij die afwijken, verdiepen zich erin om te slachten; maar Ik zal hun allen een tuchtmeester zijn. Ik ken Efraïm, en Israël is voor Mij niet verborgen; want nu, Efraïm, hoereert u, en Israël is verontreinigd.", "1 Sam 2:10": "Zij die met de HEERE twisten, zullen verpletterd worden; Hij zal in de hemel over hen donderen; de HEERE zal de einden van de aarde richten, en zal Zijn Koning sterkte geven, en de hoorn van Zijn Gezalfde verhogen.", "Jer 2:9": "Daarom zal Ik nog met u twisten, spreekt de HEERE; ja, met uw kindskinderen zal Ik twisten.", "Ps 124:8": "Onze hulp is in de Naam van de HEERE, Die hemel en aarde gemaakt heeft.", "Openb 14:7": "en hij zei met een luide stem: Vrees God, en geef Hem eer, want het uur van Zijn oordeel is gekomen; en aanbid Hem, Die de hemel, en de aarde, en de zee, en de bronnen van het water gemaakt heeft.", "Jer 31:18": "Ik heb wel gehoord dat Efraïm zich beklaagt, en zegt: U hebt mij getuchtigd, en ik ben getuchtigd zoals een ongewend kalf. Bekeer mij, dan zal ik bekeerd zijn, want U bent de HEERE, mijn God!", "Hab 3:9-11": "De naakte grond werd ontbloot door Uw boog, om de eden, aan de stammen gedaan door het woord. Sela. U hebt de rivieren van de aarde gekloofd. De bergen zagen U, en leden smart; de waterstroom ging erdoorheen, de afgrond gaf zijn stem, hij hief zijn handen op in de hoogte. De zon en de maan stonden stil in hun woning; met het licht gingen Uw pijlen daarheen, met glans Uw bliksemende speer.", "Amos 8:14": "Zij die zweren bij de schuld van Samaria, en zeggen: Zo waarachtig als uw God van Dan leeft, en de weg van Berseba leeft! zij zullen vallen, en niet meer opstaan.", "Joël 2:5": "Zij zullen daarheen springen als een gedruis van wagens, op de toppen van de bergen; als het gedruis van een vuurvlam, die stoppels verteert; als een machtig volk, dat in slagorde opgesteld is.", "Hos 2:13": "Daarom, zie, Ik zal haar lokken, en haar leiden in de woestijn; en Ik zal naar haar hart spreken.", "Ezech 43:7-9": "En Hij zei tegen mij: Mensenkind! dit is de plaats van Mijn troon, en de plaats van de zolen van Mijn voeten, waar Ik wonen zal in het midden van de kinderen van Israël, in eeuwigheid; en zij van het huis van Israël zullen Mijn heilige Naam niet meer verontreinigen, zij noch hun koningen, met hun hoererij en met de dode lichamen van hun koningen, op hun hoogten; Als zij hun drempel stelden aan Mijn drempel, en hun post naast Mijn post, zodat er maar een wand tussen Mij en tussen hen was, en verontreinigden Mijn heilige Naam met hun gruwelen die zij deden; daarom heb Ik ze verteerd in Mijn toorn. Nu zullen zij hun hoererij en de dode lichamen van hun koningen ver van Mij wegdoen; en Ik zal in het midden van hen wonen in eeuwigheid.", "Jer 5:10": "Beklim haar muren, en verwoest ze (maar maak er geen einde aan); haal haar tinnen weg, want zij zijn niet van de HEERE.", "Ps 108:5": "Want Uw goedertierenheid is groot tot boven de hemelen, en Uw waarheid tot aan de bovenste wolken.", "Deut 2:36": "Van Aroer af, dat aan de oever van de beek Arnon is, en de stad die aan de beek is, tot Gilead toe, was er geen stad die voor ons te sterk was; de HEERE, onze God, gaf dat alles aan ons over.", "Jes 40:28": "Weet u het niet? Hebt u niet gehoord, dat de eeuwige God, de HEERE, de Schepper van de einden van de aarde, noch moede noch mat wordt? Er is geen doorgronding van Zijn verstand.", "Ps 24:2": "Want Hij heeft haar gegrond op de zeeën, en heeft haar gevestigd op de rivieren.", "Jes 9:20": "Manasse Efraïm, en Efraïm Manasse, en zij zullen samen tegen Juda zijn. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.", "Ps 148:8": "Vuur en hagel, sneeuw en damp; stormwind, die Zijn woord doet!", "Ps 104:5": "Hij heeft de aarde gegrond op haar fundamenten; zij zal nooit meer, ook niet eeuwig, wankelen.", "Ps 136:5-9": "Hem, Die de hemelen met verstand gemaakt heeft; want Zijn goedertierenheid is voor eeuwig. Hem, Die de aarde op het water uitgespreid heeft; want Zijn goedertierenheid is voor eeuwig. Hem, Die de grote lichten heeft gemaakt; want Zijn goedertierenheid is voor eeuwig.", "2 Kor 1:3": "Geloofd zij de God en Vader van onze Heere Jezus Christus, de Vader van de barmhartigheden, en de God van alle vertroosting;", "Ps 8:4": "Als ik Uw hemel aanzie, het werk van Uw vingers, de maan en de sterren, die U bereid hebt;", "Jes 24:6": "Daarom verteert de vloek het land, en zij die daarin wonen, zullen verwoest worden; daarom zullen de inwoners van het land verbrand worden, en er zullen weinig mensen overblijven.", "Kol 1:21": "En u, die eertijds vervreemd was en vijanden door het verstand in de boze werken, heeft Hij nu ook verzoend,", "Job 23:13": "Maar is Hij tegen iemand, wie zal Hem dan afkeren? Wat Zijn ziel begeert, dat zal Hij doen.", "Ps 144:5": "Buig Uw hemelen, HEERE, en daal neer; raak de bergen aan, zodat ze roken.", "Jes 19:1": "De last van Egypte. Zie, de HEERE rijdt op een snelle wolk, en Hij zal in Egypte komen; en de afgoden van Egypte zullen bewogen worden vanwege Zijn aangezicht, en het hart van de Egyptenaren zal smelten in hun binnenste.", "Ex 15:6-8": "O HEERE! Uw rechterhand is verheerlijkt in macht; Uw rechterhand, o HEERE, heeft de vijand verbroken! En door Uw grote hoogheid hebt U hen die tegen U opstonden, omgeworpen; U hebt Uw brandende toorn losgelaten, die hen verteerd heeft als een stoppel. En door het geblaas van Uw neus zijn de wateren opgehoopt; de stromen hebben overeind gestaan als een hoop; de afgronden zijn stijf geworden in het hart van de zee.", "Jes 6:7": "En hij raakte daarmee mijn mond aan, en zei: Zie, dit heeft uw lippen aangeraakt; zo is uw misdaad van u geweken, en uw zonde is verzoend.", "1 Sam 25:38": "En het gebeurde ongeveer tien dagen later, dat de HEERE Nabal sloeg, zodat hij stierf.", "Jes 1:22": "Uw zilver is geworden tot schuim; uw wijn is vermengd met water.", "Jes 1:3": "Een os kent zijn bezitter, en een ezel de krib van zijn heer; maar Israël heeft geen kennis, Mijn volk begrijpt het niet.", "Joz 15:8": "En deze grens zal opgaan door het dal van de zoon van Hinnom, aan de kant van de Jebusiet van het zuiden, dat is Jeruzalem; en deze grens zal opwaarts gaan tot de top van de berg, die voor het dal van Hinnom is, westwaarts, wat in het uiterste van het dal van de Refaïeten is, tegen het noorden.", "Ps 8:6": "En hebt U hem een weinig minder gemaakt dan de engelen, en hebt U hem met eer en heerlijkheid gekroond?", "Joël 2:13": "En scheurt uw hart en niet uw kleren, en bekeert u tot de HEERE, uw God; want Hij is genadig en barmhartig, geduldig en groot van goedertierenheid, en Hij heeft berouw over het kwade.", "Amos 5:11": "Daarom, omdat u de arme vertreedt en een last koren van hem neemt, hebt u wel huizen gebouwd van gehouwen steen, maar u zult daarin niet wonen; u hebt heerlijke wijngaarden geplant, maar u zult de wijn daarvan niet drinken.", "Gen 1:31": "En God zag al wat Hij gemaakt had, en zie, het was zeer goed. Toen was het avond geweest en het was morgen geweest: de zesde dag.", "Amos 9:6": "Die Zijn bovenzalen in de hemel bouwt, en Zijn gewelf heeft Hij op de aarde gegrondvest; Die de wateren van de zee roept, en giet ze uit over de aardbodem; HEERE is Zijn Naam.", "Jes 65:22": "Zij zullen niet bouwen, zodat een ander het bewoont; zij zullen niet planten, zodat een ander het eet, want de dagen van Mijn volk zullen zijn als de dagen van een boom, en Mijn uitverkorenen zullen het werk van hun handen verslijten.", "Zach 9:14": "En de HEERE zal over hen verschijnen, en Zijn pijlen zullen uitgaan als een bliksem; en de Heere HEERE zal met de bazuin blazen, en Hij zal voorttrekken met stormen uit het zuiden.", "Job 37:16": "Hebt u kennis van de opwegingen van de dikke wolken; de wonderen van Hem die volmaakt is in wetenschappen?", "2 Kor 13:4": "Want al is Hij gekruisigd door zwakheid, toch leeft Hij door de kracht van God. Want ook wij zijn zwak in Hem, maar zullen met Hem leven door de kracht van God, tot u.", "Hos 5:13": "Toen Efraïm zijn ziekte zag, en Juda zijn gezwel, ging Efraïm naar Assur, en hij stuurde iemand naar koning Jareb; maar die zal u niet kunnen genezen, en zal het gezwel van u niet helen.", "Openb 19:6": "En ik hoorde als een stem van een grote menigte, en als een stem van veel water, en als een stem van sterke donderslagen, die zei: Halleluja, want de Heere, de almachtige God, heeft als Koning geheerst.", "Jer 30:23": "Ziet, een storm van de HEERE, een grimmigheid is uitgegaan, een aanhoudende storm; hij zal neerkomen op het hoofd van de goddelozen.", "Rom 10:13": "Want ieder die de Naam van de Heere zal aanroepen, zal zalig worden.", "Jes 65:13": "Daarom zegt de Heere HEERE zo: Zie, Mijn knechten zullen eten, maar u zult hongeren; zie, Mijn knechten zullen drinken, maar u zult dorsten; zie, Mijn knechten zullen blij zijn, maar u zult beschaamd zijn.", "Ps 14:3": "Zij zijn allen afgeweken, samen zijn zij smerig geworden; er is niemand die goed doet, ook niet één.", "Ps 89:29": "Ik zal hem Mijn goedertierenheid in eeuwigheid bewaren, en Mijn verbond zal hem vast blijven.", "Ps 74:17": "U hebt al de grenzen van de aarde gesteld; zomer en winter, die hebt U gevormd.", "Jes 51:16": "En Ik leg Mijn woorden in uw mond, en bedek u onder de schaduw van Mijn hand; om de hemel te planten, en om de aarde te gronden, en om tegen Sion te zeggen: U bent Mijn volk.", "Jer 10:15": "Ijdelheid zijn zij, een werk van verleidingen; ten tijde van hun bezoeking zullen zij vergaan.", "Ps 57:11": "Want Uw goedertierenheid is groot tot aan de hemelen, en Uw waarheid tot aan de hoogste wolken.", "Hos 11:9": "Ik zal de gloed van Mijn toorn niet uitvoeren; Ik zal niet terugkeren om Efraïm te verderven; want Ik ben God en geen mens, de Heilige in uw midden, en Ik zal niet in de stad komen.", "2 Kon 8:1": "Elisa had tegen de vrouw gesproken, van wie hij de zoon levend gemaakt had. Hij zei: Maak u klaar, en ga weg, u en uw huisgezin, en woon als vreemdeling waar u maar wonen kunt; want de HEERE heeft een hongersnood aangekondigd, die ook zeven jaar lang over het land zal komen.", "Jes 5:17": "En de lammeren zullen weiden naar hun gewoonte, en de vreemdelingen zullen de woeste plaatsen van de vetgemesten eten.", "Rom 11:36": "Want uit Hem, en door Hem, en tot Hem zijn alle dingen. Hem zij de heerlijkheid tot in eeuwigheid. Amen.", "Hos 11:6": "En het zwaard zal in zijn steden blijven, en zijn grendels verteren, en opeten, vanwege hun beraadslagingen.", "Jer 2:5": "Zo zegt de HEERE: Wat voor onrecht hebben uw vaders aan Mij gevonden, dat zij ver van Mij zijn geweken, en de ijdelheid hebben nagewandeld, en zelf ijdel zijn geworden?", "Jes 8:4-7": "Want voordat dat jongetje kan roepen: Mijn vader! of: mijn moeder!, zal men de rijkdom van Damaskus en de buit van Samaria wegdragen voor de koning van Assur. En de HEERE sprak nog verder tegen mij en zei: Omdat dit volk het water van Siloa veracht, dat zachtjes stroomt, en er vreugde is bij Rezin en de zoon van Remalia,", "Openb 2:21": "En Ik heb haar tijd gegeven, opdat zij zich zou bekeren van haar hoererij, en zij heeft zich niet bekeerd.", "Jer 9:22": "Spreek: Zo spreekt de HEERE: Ja, een dood lichaam van de mens zal liggen, als mest op het open veld, en als een schoof achter de maaier, die niemand opzamelt.", "Jes 30:22": "En u zult voor onrein houden het deksel van uw zilveren gesneden beelden, en het overtreksel van uw gouden gegoten beelden; u zult ze wegwerpen als een maanstondig kleed, en tegen elk daarvan zeggen: Ga weg!", "Jes 48:13": "Ook heeft Mijn hand de aarde gegrond, en Mijn rechterhand heeft de hemelen met de palm afgemeten; wanneer Ik ze roep, staan zij daar samen.", "Jer 10:13": "Als Hij Zijn stem geeft, zo is er een gedruis van water in de hemel, en Hij doet de dampen opklimmen van het einde van de aarde; Hij maakt de bliksems met de regen, en doet de wind voortkomen uit Zijn schatkamers.", "Deut 4:32": "Want vraag toch naar de vorige dagen, die vóór u geweest zijn, vanaf de dag dat God de mens op de aarde geschapen heeft, van het ene einde van de hemel tot aan het andere einde van de hemel, of er ooit zo'n groot ding gebeurd of gehoord is als dit:", "Jes 14:24": "De HEERE van de heerscharen heeft gezworen: Voorzeker, zoals Ik gedacht heb, zo zal het gebeuren, en zoals Ik beraadslaagd heb, zo zal het bestaan!", "Jer 2:11-13": "Heeft ook een volk de goden veranderd, hoewel die geen goden zijn? Toch heeft Mijn volk zijn Eer veranderd in iets dat geen nut doet. Ontzet u hierover, hemelen, en wees verschrikt, word zeer woest, spreekt de HEERE. Want Mijn volk heeft twee boosheden gedaan; Mij, de Springader van het levende water, hebben zij verlaten, om zichzelf bakken uit te houwen, gebroken bakken, die geen water houden.", "Jes 31:8": "En Assur zal vallen door het zwaard, niet van een sterke man, en het zwaard, niet van een gewoon mens, zal hem verteren; en hij zal voor het zwaard vluchten, en zijn jongemannen zullen tot dwangarbeid gebracht worden.", "2 Sam 5:22": "Daarna trokken de Filistijnen weer op; en zij verspreidden zich in het dal Refaïm.", "Amos 4:13": "Want zie, Die de bergen vormt, en de wind schept, en de mens bekendmaakt wat Zijn gedachte is, Die de dageraad duisternis maakt, en op de hoogten van de aarde treedt, HEERE, God van de heerscharen, is Zijn Naam.", "1 Kron 16:34": "Looft de HEERE, want Hij is goed, want Zijn goedertierenheid is tot in eeuwigheid.", "Jes 51:10": "Bent U het niet, Die de zee, het water van het grote afgrond, droog gemaakt hebt? Die de diepten van de zee gemaakt hebt tot een weg, opdat de verlosten daardoor gingen?", "2 Kron 21:20": "Hij was tweeëndertig jaar oud toen hij koning werd, en regeerde acht jaar in Jeruzalem; en hij ging heen zonder dat men hem miste; en zij begroeven hem in de stad van David, maar niet in de graven van de koningen.", "1 Kon 17:1": "En Elia, de Thisbiet, van de inwoners van Gilead, zei tegen Achab: Zo waarachtig als de HEERE, de God van Israël, leeft, voor Wiens aangezicht ik sta, indien deze jaren dauw of regen zijn zal, tenzij dan naar mijn woord!", "Ps 78:56-64": "Maar zij verzochten en verbitterden God, de Allerhoogste, en onderhielden Zijn getuigenissen niet. En zij weken terug, en handelden trouweloos, zoals hun vaders; zij zijn omgekeerd, als een bedrieglijke boog. En zij verwekten Hem tot toorn door hun hoogten, en verwekten Hem tot ijver door hun gesneden beelden.", "Spr 22:2": "Rijken en armen ontmoeten elkaar; de HEERE heeft hen allen gemaakt.", "2 Kon 17:6": "In het negende jaar van Hosea nam de koning van Assyrië Samaria in, en voerde Israël weg naar Assyrië, en liet hen wonen in Halah, en in Habor, aan de rivier Gozan, en in de steden van de Meden.", "Ps 121:2": "Mijn hulp is van de HEERE, Die hemel en aarde gemaakt heeft.", "Pred 7:29": "Alleen zie, dit heb ik gevonden, dat God de mens recht gemaakt heeft, maar zij hebben veel uitvindingen gezocht.", "Hos 13:7": "Daarom werd Ik voor hen als een felle leeuw; als een luipaard loerde Ik op de weg.", "Rom 1:21": "Omdat zij, hoewel zij God kenden, Hem niet als God verheerlijkt of gedankt hebben; maar in hun overleggingen zijn zij verijdeld geworden, en hun onverstandig hart is verduisterd geworden;", "Jer 15:1-14": "Maar de HEERE zei tegen mij: Al stonden Mozes en Samuël voor Mijn aangezicht, dan nog zou Mijn ziel niet naar dit volk uitgaan; drijf ze weg van Mijn aangezicht, en laat ze weggaan. En het zal gebeuren, wanneer zij tegen u zullen zeggen: Waarheen zullen wij weggaan? dat u tegen hen zult zeggen: Zo zegt de HEERE: Wie voor de dood bestemd is, ten dode; en wie voor het zwaard, ten zwaarde; en wie voor de honger, ten honger; en wie voor de gevangenschap, ter gevangenschap! Want Ik zal een bezoeking over hen brengen met vier soorten straf, spreekt de HEERE: met het zwaard, om te doden; en met de honden, om te verscheuren; en met het gevogelte van de hemel, en met het gedierte van de aarde, om op te eten en te vernietigen.", "Jes 10:16": "Daarom zal de Heere Heere van de heerscharen onder zijn vetten een magerheid zenden; en onder zijn heerlijkheid zal Hij een brand doen branden, als de brand van het vuur.", "Micha 5:13": "Verder zal Ik uw bossen uit uw midden uitroeien, en Ik zal uw steden verdelgen.", "Ex 32:34": "Ga nu heen, leid dit volk naar waar Ik u gezegd heb; zie, Mijn Engel zal voor u uit gaan! Maar op de dag van het bezoeken zal Ik hun zonde over hen bezoeken!", "Jes 33:9-12": "Het land treurt, het kwijnt weg; de Libanon schaamt zich, hij verwelkt; Saron is geworden als een woestijn; zo zijn Basan en Karmel geschud. Nu zal Ik opstaan, zegt de HEERE, nu zal Ik verhoogd worden, nu zal Ik verheven worden. U gaat met stro zwanger, u zult stoppels baren; uw geest zal u als vuur verslinden.", "Spr 8:26-29": "Hij had de aarde nog niet gemaakt, noch de velden, noch het begin van de stofjes van de wereld. Toen Hij de hemelen bereidde, was Ik daar; toen Hij een cirkel over het vlakke van de afgrond beschreef; Toen Hij de opperwolken van boven vestigde; toen Hij de fonteinen van de afgrond vastmaakte;", "Jer 10:12": "Die de aarde gemaakt heeft door Zijn kracht, Die de wereld bereid heeft door Zijn wijsheid, en de hemel uitgebreid heeft door Zijn verstand.", "Ps 66:7": "Hij heerst eeuwig met Zijn macht; Zijn ogen houden wacht over de heidenvolken; laat de afvalligen niet verhoogd worden. Sela.", "Ps 54:5": "Want vreemden staan tegen mij op, en tirannen zoeken mijn ziel; zij stellen God niet voor hun ogen. Sela.", "2 Kron 24:20": "En de Geest van God bekleedde Zacharia, de zoon van Jojada, de priester, die boven het volk stond, en hij zei tegen hen: Zo zegt God: Waarom overtreedt u de geboden van de HEERE? Daarom zult u niet voorspoedig zijn; omdat u de HEERE verlaten hebt, zo zal Hij u verlaten.", "Hos 11:7": "Want Mijn volk blijft hangen aan de afkering van Mij; zij roepen het wel tot de Allerhoogste, maar niet één verhoogt Hem.", "Ps 65:6": "Vreselijke dingen zult U ons in gerechtigheid antwoorden, o God van ons heil! o Vertrouwen van alle einden van de aarde, en van de ver weg gelegenen aan de zee!", "1 Kon 14:15": "De HEERE zal ook Israël slaan, zoals een riet heen en weer bewogen wordt in het water, en zal Israël uitrukken uit dit goede land, dat Hij hun vaderen gegeven heeft, en zal hen verstrooien aan de overkant van de rivier; omdat zij hun gewijde palen gemaakt hebben, en de HEERE tot toorn verwekt hebben.", "Ps 49:20": "zo zal zij toch komen tot het geslacht van haar vaderen; tot in eeuwigheid zullen zij het licht niet zien.", "Ezech 18:23": "Zou Ik enigszins lust hebben aan de dood van de goddeloze, spreekt de Heere HEERE; is het niet zo, dat als hij zich bekeert van zijn wegen, hij zal leven?", "Deut 7:10": "En Hij vergeldt ieder van hen die Hem haten, in zijn aangezicht, om hem te verderven; Hij zal het voor wie Hem haat niet uitstellen, in zijn aangezicht zal Hij het hem vergelden.", "2 Kron 17:2": "En hij legde krijgsvolk in alle versterkte steden van Juda, en legde bezettingen in het land van Juda, en in de steden van Efraïm, die zijn vader Asa had ingenomen.", "Jes 40:12": "Wie heeft het water met Zijn vuist gemeten, en van de hemel met de span de maat genomen, en heeft met een drieling het stof van de aarde begrepen, en de bergen gewogen in een waag, en de heuvels in een weegschaal?", "Jer 7:33": "En de dode lichamen van dit volk zullen voedsel zijn voor het gevogelte van de hemel en het gedierte van de aarde, en niemand zal ze verjagen.", "Nahum 1:3-6": "De HEERE is geduldig, maar van grote kracht, en Hij houdt de schuldige zeker niet onschuldig. De weg van de HEERE is in wervelwind en in storm, en de wolken zijn het stof van Zijn voeten. Hij bestraft de zee, en maakt haar droog, en Hij droogt alle rivieren uit; Basan en Karmel kwijnen weg, ook kwijnt de bloem van Libanon weg. De bergen beven voor Hem, en de heuvels smelten; en de aarde licht zich op voor Zijn aangezicht, ja de wereld, en allen die daarin wonen.", "Jes 46:10": "Die vanaf het begin aan verkondigt het einde, en van oudsher af die dingen, die nog niet gebeurd zijn; Die zegt: Mijn raad zal standhouden, en Ik zal al Mijn welbehagen doen.", "Ezech 2:3-8": "En Hij zei tegen mij: Mensenkind! Ik zend u tot de kinderen van Israël, tot de rebellerende volken, die tegen Mij gerebelleerd hebben; zij en hun vaderen hebben tegen Mij overtreden tot op deze huidige dag. En deze kinderen zijn hard van gezicht, en stijf van hart; Ik zend u tot hen, en u zult tegen hen zeggen: Zo zegt de Heere HEERE! En zij, hetzij dat zij het horen zullen, of hetzij dat zij het laten zullen (want zij zijn een opstandig huis), zo zullen zij weten, dat er een profeet in hun midden geweest is.", "Ef 1:19": "En wat de uitnemende grootheid is van Zijn kracht aan ons, die geloven, naar de werking van de sterkte van Zijn macht,", "Jes 7:8": "Maar Damaskus zal het hoofd van Syrië zijn, en Rezin het hoofd van Damaskus; en over nog vijfenzestig jaar zal Efraïm verbroken worden, zodat het geen volk meer is.", "Jes 9:17-20": "Want de goddeloosheid brandt als vuur, doornen en distels zal zij verteren, en zal aansteken de verwarde struiken van het woud, die zich verheven hebben als de verheffing van de rook. Vanwege de verbolgenheid van de HEERE van de heerscharen, zal het land verduisterd worden; en het volk zal zijn als een voedsel van het vuur: de een zal de ander niet ontzien. Als hij ter rechterhand snijdt, zal hij toch hongeren, en als hij ter linkerhand eet, zal hij toch niet verzadigd worden; ieder zal het vlees van zijn eigen arm eten;", "Jes 1:29": "Want zij zullen beschaamd worden om de eiken, die u begeerd hebt, en u zult schaamrood worden, om de hoven, die u verkozen hebt.", "Hebr 12:26": "Wiens stem toen de aarde deed beven; maar nu heeft Hij verkondigd en gezegd: Nog eenmaal zal Ik niet alleen de aarde doen beven, maar ook de hemel.", "Jes 5:13": "Daarom zal mijn volk gevankelijk weggevoerd worden, omdat het geen kennis heeft; en zijn heerlijke mannen zullen honger lijden, en zijn menigte zal verdorren van dorst.", "Luk 18:27": "En Hij zei: De dingen die onmogelijk zijn bij de mensen, zijn mogelijk bij God.", "Ps 19:5": "Hun richtsnoer gaat uit over de hele aarde, en hun redenen tot het einde van de wereld; Hij heeft daarin een tent gesteld voor de zon.", "Job 18:18": "Men zal hem stoten van het licht in de duisternis, en men zal hem uit de wereld verjagen.", "Job 11:10": "Als Hij voorbijgaat, om af te snijden of te vergaderen, wie zal Hem dan tegenhouden?", "Hos 9:16": "Efraïm is geslagen, hun wortel is verdord, zij zullen geen vrucht voortbrengen; ja, ofschoon zij kinderen zouden krijgen, zo zal Ik toch de gewenste vruchten van hun buik doden.", "Ps 104:31": "De heerlijkheid van de HEERE zij tot in eeuwigheid; de HEERE verblijde Zich in Zijn werken.", "Gen 1:1-28": "In het begin schiep God de hemel en de aarde. De aarde nu was woest en leeg, en duisternis lag op de diepte; en de Geest van God zweefde over de wateren. En God zei: Laat er licht zijn! En er was licht.", "Neh 9:6": "U bent die HEERE alleen, U hebt de hemel gemaakt, de hemel der hemelen, en al hun leger, de aarde en alles wat daarop is, de zeeën en alles wat daarin is, en U maakt dat alles levend; en het leger van de hemel aanbidt U.", "Ex 2:24": "En God hoorde hun gekerm, en God dacht aan Zijn verbond met Abraham, met Izak, en met Jakob.", "Jer 14:10": "Zo zegt de HEERE van dit volk: Zij hebben zo liefgehad om te zwerven, zij hebben hun voeten niet bedwongen; daarom heeft de HEERE geen welgevallen aan hen, nu zal Hij aan hun ongerechtigheden denken, en hun zonden bezoeken.", "Jes 40:24": "Ja, zij worden niet geplant, ja, zij worden niet gezaaid, ja, hun afgehouwen stam wortelt niet in de aarde; ook als Hij op hen waait, zullen zij verdorren, en een stormwind zal hen als een stoppel wegnemen.", "Rom 2:5": "Maar naar uw hardheid en onbekeerlijk hart, verzamelt u voor uzelf toorn als een schat, voor de dag van de toorn en de openbaring van het rechtvaardig oordeel van God.", "Job 10:8": "Uw handen doen mij pijn aan, hoewel zij mij gemaakt hebben, samen rondom mij zijn zij, en U verslindt mij.", "Ps 19:2": "De hemelen vertellen Gods eer, en het uitspansel verkondigt het werk van Zijn handen.", "Ps 65:8": "Die het bruisen van de zeeën stilt, het bruisen van haar golven, en het rumoer van de volken.", "Ps 46:7": "De heidenen raasden, de koninkrijken bewogen zich; Hij verhief Zijn stem, de aarde versmolt.", "Num 11:23": "Maar de HEERE zei tegen Mozes: Zou dan de hand van de HEERE verkort zijn? U zult nu zien of Mijn woord u zal overkomen, of niet.", "Amos 1:3-5": "Zo zegt de HEERE: Om drie overtredingen van Damaskus, en om vier zal Ik dat niet afwenden; omdat zij Gilead met ijzeren dorswagens hebben gedorst. Daarom zal Ik een vuur in het huis van Hazaël zenden, dat zal de paleizen van Benhadad verteren. En Ik zal de grendel van Damaskus verbreken, en zal de inwoner uitroeien uit Bikeat-aven, en hem die de scepter houdt, uit Beth-eden; en het volk van Syrië zal als gevangenen worden weggevoerd naar Kir, zegt de HEERE.", "Jer 50:20": "In die dagen en op die tijd, spreekt de HEERE, zal de ongerechtigheid van Israël gezocht worden, maar zij zal er niet zijn, en de zonden van Juda, maar zullen niet gevonden worden; want Ik zal het vergeven aan hen die Ik zal doen overblijven.", "Ps 103:3": "Die al uw ongerechtigheid vergeeft, die al uw ziekten geneest;", "Amos 7:3": "Toen kreeg de HEERE berouw hierover; het zal niet gebeuren, zei de HEERE.", "Matt 8:11": "Maar Ik zeg u dat velen zullen komen van oost en west, en met Abraham, en Izak, en Jakob, zullen aanzitten in het Koninkrijk der hemelen;", "Ps 2:2": "De koningen van de aarde stellen zich op, en de vorsten beraadslagen samen tegen de HEERE, en tegen Zijn Gezalfde, en zeggen:", "Ps 36:2": "De overtreding van de goddeloze spreekt in het binnenste van mijn hart: Er is geen vreze van God voor zijn ogen.", "Ex 15:13": "U leidde door Uw goedheid dit volk, dat U verlost hebt; U voert hen zachtjes door Uw sterkte naar de liefelijke woning van Uw heiligheid.", "Ezech 28:10": "U zult de dood van de onbesnedenen sterven, door de hand van vreemden; want Ik heb het gesproken, spreekt de Heere HEERE.", "Rom 9:18": "Zo ontfermt Hij Zich dan over wie Hij wil, en Hij verhardt wie Hij wil.", "Jes 30:1": "Wee de kinderen die afvallen, spreekt de HEERE, om een raadslag te maken, maar niet uit Mij, en om zich met een bedekking te bedekken, maar niet uit Mijn Geest, om zonde tot zonde te doen;", "Micha 7:18": "Wie is een God gelijk U, Die de ongerechtigheid vergeeft, en de overtreding van het overblijfsel van Zijn erfenis voorbijgaat? Hij houdt Zijn toorn niet voor eeuwig vast; want Hij heeft lust aan goedertierenheid.", "Spr 11:10": "Een stad springt op van vreugde over het welvaren van de rechtvaardigen; en als de goddelozen vergaan, is er gejuich.", "Ps 130:3": "Als U, HEERE, op de ongerechtigheden let, Heere, wie zal dan bestaan?", "Klaagl 4:4-10": "Daleth. De tong van het zuigeling kleeft aan zijn gehemelte van dorst; de kinderen vragen om brood, er is niemand die het hun uitdeelt. He. Die lekkernijen aten, komen nu om op de straten; die in karmozijn zijn grootgebracht, omhelzen de vuilnishoop. Vau. En de ongerechtigheid van de dochter van mijn volk is groter dan de zonden van Sodom, dat als in een ogenblik omgekeerd werd, zonder dat er handen naar haar uitgestoken werden.", "Jes 23:11": "Hij heeft Zijn hand uitgestrekt over de zee, Hij heeft de koninkrijken doen beven; de HEERE heeft bevel gegeven tegen Kanaän, om haar vestingen te vernietigen.", "Mal 2:17": "U vermoeit de HEERE met uw woorden; nog zegt u: Waarmee vermoeien wij Hem? Daarmee, dat u zegt: Ieder die kwaad doet, is goed in de ogen van de HEERE, en Hij heeft behagen in zulke mensen; of: waar is de God van het oordeel?", "Spr 5:22": "De goddeloze zullen zijn eigen ongerechtigheden vangen, en met de banden van zijn zonden zal hij vastgehouden worden.", "Jak 4:12": "Er is één Wetgever, Die kan behouden en verderven. Maar wie bent u, dat u een ander veroordeelt?", "Jes 25:5": "Zoals de hitte in een dorre plaats, zult U de onstuimigheid van de vreemdelingen neerdrukken; zoals de hitte door de schaduw van een dikke wolk, zal het gezang van de tirannen vernederd worden.", "Ps 107:25": "Als Hij spreekt, doet Hij een stormwind opsteken, die haar golven omhoog verheft.", "Jes 54:9": "Want dat zal Mij zijn als de wateren van Noach, toen Ik zwoer dat de wateren van Noach niet meer over de aarde zouden gaan; zo heb Ik gezworen dat Ik niet meer op u toornen, of u bestraffen zal.", "Jes 30:30-33": "En de HEERE zal Zijn heerlijke stem doen horen, en de nederlating van Zijn arm doen zien, met grimmigheid van toorn, en een vlam van verterend vuur, stralen, en een vloed, en hagelstenen. Want door de stem van de HEERE zal Assur te morzel geslagen worden, hij die met de roede sloeg. En overal waar die gegrondveste staf doorgegaan zal zijn (waarop de HEERE hem zal hebben doen rusten), daar zal men met trommels en harpen zijn; want met bewegende bestrijdingen zal Hij tegen hen strijden.", "Jer 51:19": "Jakobs deel is niet gelijk aan hen; want Hij is de Formeerder van alles, en Israël is de stam van Zijn erfenis; HEERE van de heerscharen is Zijn Naam.", "Job 10:9": "Denk er toch aan, dat U mij als leem gevormd hebt, en mij tot stof zult doen terugkeren.", "Joh 5:42": "maar Ik ken u, dat u de liefde van God niet in uzelf hebt.", "Jer 33:2": "Zo zegt de HEERE, Die het doet, de HEERE, Die dat vormt, opdat Hij het bevestigt, HEERE is Zijn Naam;", "Ps 77:15": "U bent die God, Die wonderen doet; U hebt Uw sterkte bekendgemaakt onder de volken.", "Mark 13:19": "Want die dagen zullen zo'n verdrukking zijn, zoals er niet geweest is vanaf het begin van de schepping die God geschapen heeft, tot nu toe, en er ook niet meer zal zijn.", "Ezech 5:1-17": "En u, mensenkind, neem een scherp mes, een scheermes van de barbiers zult u nemen, en dat zult u over uw hoofd en over uw baard laten gaan; daarna zult u een weegschaal nemen, en die haren verdelen. Een derde deel zult u in het midden van de stad met vuur verbranden, nadat de dagen van de belegering vervuld zijn; dan zult u een derde deel nemen, en daaromheen slaan met een zwaard, en een derde deel zult u in de wind strooien; want Ik zal het zwaard achter hen uittrekken. U zult ook een klein aantal daarvan nemen, en in uw slippen binden.", "Ps 62:12": "God heeft één ding gesproken, dit heb ik tweemaal gehoord: dat de sterkte van God is.", "2 Sam 24:14": "Toen zei David tegen Gad: Het is mij zeer bang te moede; laat ons toch in de hand van de HEERE vallen, want Zijn barmhartigheden zijn groot, maar laat mij niet in de hand van mensen vallen.", "Neh 9:17-20": "En zij hebben geweigerd te horen, en niet gedacht aan Uw wonderen, die U bij hen gedaan had, en hebben hun nek verhard, en in hun weerspannigheid een hoofd aangesteld, om terug te keren tot hun dienstbaarheid. Doch U, een God van vergevingen, genadig en barmhartig, geduldig, en groot van weldadigheid, hebt hen toch niet verlaten. Zelfs, toen zij zich een gegoten kalf gemaakt hadden, en gezegd hadden: Dit is uw God, Die u uit Egypte heeft opgevoerd; en grote lasteringen gedaan hadden; Hebt U hen toch door Uw grote barmhartigheid niet verlaten in de woestijn; de wolkkolom week niet van hen overdag, om hen op de weg te leiden, noch de vuurkolom 's nachts, om hen licht te geven, op de weg waarin zij zouden gaan.", "Ps 106:14": "Maar zij werden belust met begeerte in de woestijn, en zij verzochten God in de wildernis.", "Ps 135:8-12": "Die de eerstgeborenen van Egypte sloeg, van de mens af tot het vee toe. Hij zond tekenen en wonderen in het midden van u, o Egypte! tegen Farao en tegen al zijn knechten. Die veel volken sloeg, en machtige koningen doodde;", "Ps 78:11": "En zij vergaten Zijn daden, en Zijn wonderen, die Hij hun had laten zien.", "Job 10:7": "Het is Uw wetenschap, dat ik niet goddeloos ben; nochtans is er niemand, die uit Uw hand verlost.", "Ps 119:91": "Naar Uw verordeningen blijven zij nog heden staan, want zij allen zijn Uw knechten.", "Ps 103:22": "Loof de HEERE, al Zijn werken! Aan alle plaatsen van Zijn heerschappij. Loof de HEERE, mijn ziel!", "2 Kron 5:13": "het gebeurde dan, toen zij eenparig trompetten en zongen, om één stem te laten horen, terwijl zij de HEERE prezen en loofden; en toen zij de stem verhieven met trompetten, en met cimbalen, en andere muzikale instrumenten, en toen zij de HEERE prezen, omdat Hij goed is, omdat Zijn goedertierenheid tot in eeuwigheid is; dat het huis met een wolk vervuld werd, namelijk het huis van de HEERE.", "Deut 28:30": "U zult een vrouw ondertrouwen, maar een ander zal met haar slapen; een huis zult u bouwen, maar er niet in wonen; een wijngaard zult u planten, maar de vrucht ervan niet gewoon gebruiken.", "Jes 45:12": "Ik heb de aarde gemaakt, en Ik heb de mens daarop geschapen; Ik ben het! Mijn handen hebben de hemelen uitgebreid, en Ik heb heel hun leger bevel gegeven.", "Ps 40:3": "En Hij heeft mij uit een ruisende kuil, uit modderig slijk opgehaald, en heeft mijn voeten op een rotssteen gesteld, Hij heeft mijn gangen vastgemaakt.", "Ex 32:14": "Toen kreeg de HEERE berouw over het kwaad, dat Hij gezegd had Zijn volk te zullen aandoen.", "Job 21:18": "Dat zij worden als stro voor de wind, en als kaf, dat de wervelwind wegsteelt;", "Hebr 3:4": "Want ieder huis wordt door iemand gebouwd; maar Die dit alles gebouwd heeft, is God.", "Job 24:12": "Uit de stad zuchten de mensen, en de ziel van de verwonden schreeuwt uit; toch rekent God het niet aan als ongerijmd.", "Ps 79:9": "Help ons, o God van ons heil! Vanwege de eer van Uw Naam; en red ons, en doe verzoening over onze zonden, om Uw Naam.", "2 Kron 21:6": "En hij ging de weg van de koningen van Israël, zoals het huis van Achab deed; want hij had de dochter van Achab tot vrouw; en hij deed wat slecht was in de ogen van de HEERE.", "Amos 3:9-15": "Laat het horen in de paleizen te Asdod, en in de paleizen in Egypteland, en zeg: Verzamel u op de bergen van Samaria, en zie de grote onrust in haar midden, en de verdrukten binnen in haar. Want zij weten niet te doen wat recht is, spreekt de HEERE; zij die in hun paleizen schatten vergaren door geweld en verwoesting. Daarom, zo zegt de Heere HEERE: De vijand! En dat rondom het land! Die zal uw sterkte van u neerstorten, en uw paleizen zullen uitgeplunderd worden.", "Ps 9:18": "De goddelozen zullen terugkeren, naar de hel toe, alle heidenen die God vergeten zijn.", "Job 38:37": "Wie kan de wolken met wijsheid tellen, en wie kan de flessen van de hemel neerleggen?", "Ps 77:17": "De wateren zagen U, o God! De wateren zagen U, zij beefden; ook waren de afgronden beroerd.", "Jes 52:10": "De HEERE heeft Zijn heilige arm ontbloot voor de ogen van alle heidenvolken; en alle einden van de aarde zullen het heil van onze God zien.", "Richt 10:12-14": "En de Sidoniërs, de Amalekieten en de Maonieten, die u onderdrukten toen u tot Mij riep, heb Ik u toen niet uit hun hand verlost? Toch hebt u Mij verlaten, en andere goden gediend; daarom zal Ik u niet meer verlossen. Ga heen, roep tot de goden die u hebt uitgekozen; laten die u verlossen in de tijd van uw benauwdheid.", "Deut 4:25-31": "Wanneer u nu kinderen en kleinkinderen verwekt hebt, en oud geworden bent in het land, en u zich te gronde richt door gesneden beelden te maken, de gelijkenis van iets, en door te doen wat kwaad is in de ogen van de HEERE, uw God, om Hem tot toorn te verwekken; Dan roep ik vandaag de hemel en de aarde tot getuige tegen u, dat u zeker snel zult omkomen uit het land waar u de Jordaan voor oversteekt om het in bezit te nemen; u zult uw dagen daarin niet verlengen, maar helemaal uitgeroeid worden. En de HEERE zal u verstrooien onder de volken; en u zult met weinigen in getal overblijven onder de heidenvolken waarheen de HEERE u zal leiden.", "Hos 5:14": "Want Ik zal voor Efraïm zijn als een felle leeuw, en voor het huis van Juda als een jonge leeuw; Ik, Ik zal verscheuren en heengaan; Ik zal wegvoeren, en er zal geen redder zijn.", "Deut 31:16-30": "En de HEERE zei tegen Mozes: Zie, u zult slapen met uw vaderen; en dit volk zal opstaan, en overspelig achter de goden van de vreemden van dat land aan gaan, waar het naartoe gaat, in het midden ervan; en het zal Mij verlaten en Mijn verbond vernietigen, dat Ik met hen gesloten heb. Dan zal Mijn toorn op die dag tegen hen ontsteken, en Ik zal hen verlaten, en Mijn aangezicht van hen verbergen, zodat zij verslonden worden, en veel kwaad en benauwdheden hen zullen treffen; zodat het op die dag zal zeggen: Heeft dit kwaad mij niet getroffen, omdat mijn God niet in mijn midden is? Ik dan zal Mijn aangezicht op die dag geheel en al verbergen, om al het kwaad dat het gedaan heeft; want het heeft zich gewend tot andere goden.", "Ps 119:64": "HEERE! de aarde is vol van Uw goedertierenheid; leer mij Uw inzettingen.", "Deut 32:39": "Zie nu, dat Ik, Ik DIE ben, en geen God met Mij; Ik dood en maak levend; Ik versla en Ik heel; en er is niemand die uit Mijn hand redt!", "Amos 9:10": "Alle zondaars van Mijn volk zullen door het zwaard sterven; zij die zeggen: Het kwaad zal ons niet naderen, en ons niet treffen.", "2 Kron 36:15": "En de HEERE, de God van hun vaderen, zond tot hen, door de hand van Zijn boden, vroeg opstaand, om hen te zenden; want Hij spaarde Zijn volk en Zijn woning.", "Hand 4:24": "En toen dezen dat hoorden, hieven zij eensgezind hun stem op tot God, en zeiden: Heere! U bent de God, Die de hemel gemaakt heeft, en de aarde, en de zee, en alle dingen die daarin zijn.", "Spr 14:32": "De goddeloze zal weggedreven worden in zijn kwaad; maar de rechtvaardige vertrouwt zelfs in zijn dood.", "Jes 1:2-27": "Hoor, hemelen! en neem het ter oor, aarde! Want de HEERE spreekt: Ik heb kinderen groot gemaakt en verhoogd, maar zij hebben tegen Mij overtreden. Een os kent zijn bezitter, en een ezel de krib van zijn heer; maar Israël heeft geen kennis, Mijn volk begrijpt het niet. Wee het zondige volk, het volk van zware ongerechtigheid, het nageslacht van de boosdoeners, de verdervende kinderen! Zij hebben de HEERE verlaten, zij hebben de Heilige van Israël gelasterd, zij hebben zich vervreemd, wijkende achterwaarts.", "Luk 1:51": "Hij heeft een krachtig werk gedaan met Zijn arm; Hij heeft de hoogmoedigen verstrooid in de gedachten van hun hart.", "Job 26:7-13": "Hij breidt het noorden uit over de leegte; Hij hangt de aarde aan een niets. Hij bindt het water in Zijn wolken; toch scheurt de wolk daaronder niet. Hij houdt het aanzien van het troon vast; Hij spreidt Zijn wolk daarover.", "Ps 62:13": "En de goedertierenheid, o Heere! is van U; want U zult ieder vergelden naar zijn werk.", "1 Tess 5:3": "Want wanneer zij zullen zeggen: Het is vrede en veilig; dan zal een plotseling verderf hun overkomen, zoals de barensweeën een zwangere vrouw overkomen; en zij zullen het geenszins ontvluchten;", "Ps 50:22": "Verstaat dit toch, u die God vergeet! opdat Ik niet verscheur en niemand redt.", "Hand 17:24-26": "De God Die de wereld gemaakt heeft en alles wat daarin is; Deze, Die een Heere is van hemel en aarde, woont niet in tempels die met handen gemaakt zijn; En wordt ook niet door mensenhanden gediend, alsof Hij iets nodig zou hebben, omdat Hij Zelf aan allen het leven, en de adem, en alle dingen geeft; En Hij heeft uit één bloed heel het geslacht van de mensen gemaakt, om op de hele aardbodem te wonen, en Hij heeft de vastgestelde tijden bepaald, en de grenzen van hun woongebied;", "Deut 3:24": "Heere HEERE! U bent begonnen Uw dienaar Uw grootheid en Uw sterke hand te tonen; want welke God is er in de hemel of op de aarde, die kan doen naar Uw werken en naar Uw machtige daden!", "Jes 65:14": "Zie, Mijn knechten zullen juichen van een goed hart, maar u zult schreeuwen van harteleed, en van verbreking van de geest zult u huilen.", "Jer 8:1-22": "In die tijd, spreekt de HEERE, zullen ze de beenderen van de koningen van Juda, en de beenderen van hun vorsten, en de beenderen van de priesters, en de beenderen van de profeten, en de beenderen van de inwoners van Jeruzalem, uit hun graven halen. En zij zullen ze uitspreiden voor de zon, en voor de maan, en voor het hele heerleger van de hemel, die zij liefgehad hebben, en die zij gediend hebben, en die zij nagevolgd hebben, en die zij gezocht hebben, en voor wie zij zich neergebogen hebben; zij zullen niet verzameld noch begraven worden; tot mest op de aardbodem zullen zij zijn. En de dood zal boven het leven verkozen worden, door heel het overblijfsel van hen die overgebleven zijn uit dit boze geslacht, in al de plaatsen van de overgeblevenen, waarheen Ik hen verdreven zal hebben, spreekt de HEERE van de heerscharen.", "Ps 78:26": "Hij dreef de oostenwind voort aan de hemel, en voerde de zuidenwind aan door Zijn sterkte;", "Ps 146:8": "De HEERE opent de ogen van de blinden; de HEERE richt de gebogenen op; de HEERE heeft de rechtvaardigen lief.", "Hos 11:2": "Maar net zoals zij hen riepen, zo gingen zij van hun aangezicht weg; zij offerden aan de Baäls, en brandden reukwerk voor de gesneden beelden.", "Ps 90:2": "Eer de bergen geboren waren, en U de aarde en de wereld voortgebracht had, ja, van eeuwigheid tot eeuwigheid bent U God.", "Jer 14:1-6": "Het woord van de HEERE, dat tot Jeremia gekomen is, over de zaken van de grote droogte. Juda treurt en haar poorten zijn verzwakt; zij zijn in het zwart gekleed tot op de grond, en Jeruzalems geschrei klimt op. En hun voortreffelijken zenden hun kleinen naar water; zij komen bij de putten, zij vinden geen water, zij komen met hun vaten leeg terug; zij zijn beschaamd, ja, worden schaamrood, en bedekken hun hoofd.", "Matt 22:29": "Maar Jezus antwoordde en zei tegen hen: U dwaalt, omdat u de Schriften niet kent, noch de kracht van God.", "Ps 74:16": "De dag is van U, ook is de nacht van U; U hebt het licht en de zon bereid.", "Job 21:13": "In het goede verslijten zij hun dagen; en in een ogenblik dalen zij af in het graf.", "Spr 3:19": "De HEERE heeft de aarde door wijsheid gegrond, de hemelen door verstandigheid bereid.", "Deut 28:53-57": "En u zult de vrucht van uw schoot eten, het vlees van uw zonen en van uw dochters, die de HEERE, uw God, u gegeven zal hebben; in de belegering en in de benauwdheid waarmee uw vijanden u zullen benauwen. Wat betreft de man die teder onder u is, en die zeer verwend geweest is, zijn oog zal boosaardig zijn tegen zijn broeder, en tegen de vrouw van zijn schoot, en tegen zijn overige zonen die hij overgehouden zal hebben; Zodat hij aan niemand van hen iets zal geven van het vlees van zijn zonen die hij eet, omdat hij voor zichzelf niets heeft overgehouden; in de belegering en in de benauwdheid waarmee uw vijand u in al uw poorten zal benauwen.", "Ps 83:14-16": "Mijn God! Maak hen als een wervelwind, als stoppels voor de wind. Zoals het vuur een woud verbrandt, en zoals de vlam de bergen in brand steekt; vervolg hen zo met Uw onweer, en verschrik hen met Uw storm.", "Gal 6:8": "Want die in zijn eigen vlees zaait, zal uit het vlees verderf maaien; maar die in de Geest zaait, zal uit de Geest het eeuwige leven maaien.", "Spr 22:23": "Want de HEERE zal hun rechtszaak voeren, en Hij zal aan hen die hen beroven, de ziel roven.", "Jes 24:13": "Want in het binnenste van het land, in het midden van deze volken, zal het zo zijn als de afschudding van het olijfboom, als de nalezingen, wanneer de wijnoogst geëindigd is.", "Zach 9:1": "De last van het woord van de HEERE over het land Chadrach en Damaskus, zijn rustplaats; want de HEERE heeft een oog op de mens, zoals op alle stammen van Israël.", "Ps 104:6": "U had haar met de afgrond als een kleed overdekt; de wateren stonden boven de bergen.", "Ps 102:26": "U hebt voormaals de aarde gegrond, en de hemelen zijn het werk van Uw handen;", "Ps 145:9": "Teth. De HEERE is voor allen goed, en Zijn barmhartigheden zijn over al Zijn werken.", "Hos 6:1-3": "Kom, laten wij terugkeren tot de Heere, want Hij heeft verscheurd, en Hij zal ons genezen; Hij heeft geslagen, en Hij zal ons verbinden. Hij zal ons na twee dagen levend maken; op de derde dag zal Hij ons doen opstaan, en wij zullen voor Zijn aangezicht leven. Dan zullen wij kennen, wij zullen ernaar streven om de Heere te kennen; Zijn opgang is zeker als de dageraad; en Hij zal tot ons komen als een regen, als de late regen en vroege regen voor het land.", "Jer 20:11": "Maar de HEERE is met mij als een verschrikkelijke Held; daarom zullen mijn vervolgers struikelen, en zullen niets bereiken; zij zijn zeer beschaamd geworden, omdat zij niet verstandig gehandeld hebben; het zal een eeuwige schande zijn, ze zal niet vergeten worden.", "Ps 80:15-20": "O God van de heerscharen! Keer toch terug; kijk uit de hemel, en zie, en zoek dan om te helpen deze wijnstok, en de stam die Uw rechterhand geplant heeft, en dat om de zoon die U voor Uzelf gesterkt hebt! Hij is met vuur verbrand; hij is afgehouwen; zij komen om van het schelden van Uw aangezicht.", "Jer 3:1-25": "Men zegt: Als een man zijn vrouw verlaat, en zij gaat van hem weg en wordt de vrouw van een andere man, zal hij dan nog naar haar terugkeren? Zou dat land niet ernstig ontheiligd worden? U hebt met veel minnaars gehoereerd, en toch zou u weer naar Mij terugkeren, spreekt de HEERE. Sla uw ogen op naar de hoge plaatsen, en zie toe: waar bent u niet beslapen? U hebt voor hen gezeten langs de wegen, als een Arabier in de woestijn; zo hebt u het land ontheiligd met uw hoererijen en met uw slechtheid. Daarom zijn de regendruppels ingehouden, en is er geen late regen geweest. Maar u hebt een hoerenvoorhoofd, u weigert schaamrood te worden.", "2 Kron 34:7": "brak hij ook de altaren af en de gewijde bomen, en de gesneden beelden verbrijzelde hij tot poeder, en al de zonnebeelden hieuw hij af in het hele land van Israël; daarna keerde hij terug naar Jeruzalem.", "Dan 9:9": "Bij de Heere, onze God, zijn de barmhartigheden en vergevingen, hoewel wij tegen Hem gerebelleerd hebben.", "Jes 10:15": "Zal een bijl zich beroemen tegen hem die daarmee houwt? Zal een zaag pochen tegen hem die ze trekt? Alsof een staf beweegt wie hem opheffen? Als men een stok opheft, is het geen hout?", "1 Kon 11:39": "En Ik zal om die reden het nageslacht van David vernederen; maar niet voor altijd.", "Matt 19:26": "En Jezus keek hen aan, en zei tegen hen: Bij de mensen is dat onmogelijk, maar bij God zijn alle dingen mogelijk.", "Matt 8:12": "maar de kinderen van het koninkrijk zullen uitgeworpen worden in de buitenste duisternis; daar zal gehuil zijn, en het geknars van de tanden.", "Deut 7:9": "U zult dan weten dat de HEERE, uw God, dié God is, de getrouwe God, Die het verbond en de goedertierenheid houdt met wie Hem liefhebben en Zijn geboden houden, tot in duizend geslachten.", "Hos 9:17": "Mijn God zal ze verwerpen, omdat zij niet naar Hem luisteren; en zij zullen zwervend zijn onder de heidenvolken.", "Ps 33:9": "Want Hij spreekt, en het is er; Hij gebiedt, en het staat er.", "Jer 50:6": "Mijn volk waren verloren schapen, hun herders hadden hen verleid, zij hadden hen naar de bergen gevoerd, zij gingen van berg tot heuvel, zij vergaten hun rustplaats.", "Ps 106:13": "Maar zij vergaten al snel Zijn werken, zij wachtten niet op Zijn raad.", "Hand 17:30": "God dan, Die de tijden van de onwetendheid door de vingers gezien heeft, verkondigt nu aan alle mensen, overal, dat zij zich bekeren.", "Ps 33:7": "Hij verzamelt de wateren van de zee als op een hoop; Hij legt de diepten in schatkamers.", "Jes 43:7": "ieder, die naar Mijn Naam genoemd is, en die Ik geschapen heb tot Mijn eer, die Ik geformeerd heb, die Ik ook gemaakt heb.", "Hos 2:12": "En Ik zal aan haar de dagen van de Baäl bezoeken, waarin zij hem wierook gebracht heeft, en zich versierd heeft met haar voorhoofdsieraad, en haar halssieraad, en haar minnaars is nagegaan, maar Mij heeft vergeten, spreekt de Heere.", "Hos 10:12-15": "Zaai voor uzelf tot gerechtigheid, maai tot goedertierenheid; ontgin voor uzelf braakland; want het is tijd om de Heere te zoeken, totdat Hij komt en over u de gerechtigheid laat regenen. U hebt goddeloosheid geploegd, verkeerdheid gemaaid, en de vrucht van de leugen gegeten; want u hebt vertrouwd op uw eigen weg, op de veelheid van uw he
