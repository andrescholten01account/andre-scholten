l":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"De last van Damaskus. Zie, Damaskus zal weggenomen worden, zodat het geen stad meer is, maar het zal een vervallen steenhoop zijn.","2":"De steden van Aroer zullen verlaten worden; ze zullen er zijn voor de kudden, die daar zullen neerliggen, en niemand zal ze schrik aanjagen.","3":"En de vesting zal ophouden in Efraïm, en het koninkrijk in Damaskus, en het overblijfsel van de Syriërs; zij zullen zijn als de heerlijkheid van de kinderen van Israël, spreekt de HEERE van de heerscharen[1].","4":"En het zal op die dag gebeuren, dat de heerlijkheid van Jakob verminderd zal worden, en dat de vettigheid van zijn vlees mager zal worden.","5":"Want het zal zijn zoals wanneer een maaier het staande koren verzamelt, en met zijn arm aren afmaait; ja, het zal zijn zoals wanneer iemand aren leest in het dal Refraïm.","6":"Toch zal er een nalezing in overblijven, zoals bij het afschudden van de olijfboom, twee of drie bezien in de top van de opperste twijg, en vier of vijf aan zijn vruchtbare takken, spreekt de HEERE, de God van Israël.","7":"Op die dag zal de mens zien naar Hem, Die hem gemaakt heeft, en zijn ogen zullen op de Heilige van Israël zien.","8":"En hij zal niet meer aanschouwen de altaren, het werk van zijn handen, ook wat zijn vingers gemaakt hebben, zal hij niet meer aanzien, noch de bossen, noch de zonnebeelden[2].","9":"Op die dag zullen zijn sterke steden zijn als een verlaten struik en opperste tak, die zij verlaten hebben vanwege de kinderen van Israël, hoewel daar verwoesting zal zijn.","10":"Want u hebt de God van uw heil vergeten, en niet gedacht aan de Rotssteen van uw sterkte; daarom zult u wel liefelijke planten planten, en die met uitheemse ranken bezetten;","11":"Op de dag dat u ze plant, zult u ze doen groeien, en in de morgenstond zult u uw zaad doen bloeien; maar het zal maar een hoop zijn van het gemaaide, op de dag van ziekte en van pijnlijke smart.","12":"Wee de veelheid van de grote volken, die bruisen als de zeeën bruisen; en wee het geraas van de naties, die ruisen als de geweldige wateren ruisen!","13":"De naties zullen wel ruisen, zoals grote wateren ruisen; maar Hij zal het bestraffen, zo zal het ver wegvluchten, ja, het zal opgejaagd worden als het kaf van de bergen voor de wind, en als een bal voor de wervelwind.","14":"Ten tijde van de avond, zie, dan is er verschrikking; voordat het morgen is, is hij er niet meer. Dit is het deel van hen die ons beroven, en het lot van hen die ons plunderen."},"SV":{"1":"De last van Damaskus. Ziet, Damaskus zal weggenomen worden, dat zij geen stad meer zij, maar zij zal een vervallen steenhoop zijn.","2":"De steden van Aroer zullen verlaten worden; voor de kudden zullen zij wezen, die zullen *daar* nederliggen, en niemand zal ze verschrikken.","3":"En de vesting zal ophouden van Efraïm, en het koninkrijk van Damaskus, en het overblijfsel der Syriërs; zij zullen zijn gelijk de heerlijkheid der kinderen Israëls, spreekt de HEERE der heirscharen.","4":"En het zal geschieden te dien dage, dat de heerlijkheid van Jakob verdund zal worden, en dat de vettigheid van zijn vlees mager worden zal.","5":"Want hij zal zijn, gelijk *wanneer* een maaier het staande koren verzamelt, en zijn arm aren afmaait; ja, hij zal zijn, gelijk *wanneer* iemand aren leest in het dal Refraim.","6":"Doch een nalezing zal daarin overig blijven, gelijk *in* de afschudding eens olijfbooms, twee *of* drie bezien in den top der opperste twijg, en vier *of* vijf aan zijn vruchtbare takken, spreekt de HEERE, de God Israëls.","7":"Te dien dage zal de mens zien naar Dien, Die hem gemaakt heeft, en zijn ogen zullen op den Heilige Israëls zien.","8":"En hij zal niet aanschouwen de altaren, het werk zijner handen, ook hetgeen zijn vingeren gemaakt hebben, zal hij niet aanzien, noch de bossen, noch de zonnebeelden.","9":"Te dien dage zullen zijn sterke steden zijn, als een verlaten struik, en opperste tak, welke zij verlaten hebben, om der kinderen Israëls wil, hoewel daar verwoesting zal wezen.","10":"Want gij hebt den God uws heils vergeten, en niet gedacht aan den Rotssteen uwer sterkte; daarom zult gij wel liefelijke planten planten, en gij zult hem met uitlandse ranken bezetten;","11":"Ten dage, als gij ze zult geplant hebben, zult gij *die* doen wassen, en in den morgenstond zult gij uw zaad doen bloeien; *doch* het zal maar een hoop van het gemaaide zijn, in den dag der krankheid en der pijnlijke smart.","12":"Wee der veelheid der grote volken, die daar bruisen, gelijk de zeeën bruisen; en *wee* het geruis der natiën, die daar ruisen, gelijk de geweldige wateren ruisen!","13":"De natiën zullen *wel* ruisen, gelijk grote wateren ruisen; doch Hij zal hem schelden, zo zal hij verre wegvlieden, ja, hij zal gejaagd worden, als het kaf der bergen van den wind, en gelijk een kloot van den wervelwind.","14":"Ten tijde des avonds, ziet, zo is er verschrikking, eer het morgen is, is hij er niet meer. Dit is het deel dergenen, die ons beroven, en het lot dergenen, die ons plunderen."},"KJV":{"1":"The burden of Damascus. Behold, Damascus is taken away from *being* a city, and it shall be a ruinous heap.","2":"The cities of Aroer *are* forsaken: they shall be for flocks, which shall lie down, and none shall make *them* afraid.","3":"The fortress also shall cease from Ephraim, and the kingdom from Damascus, and the remnant of Syria: they shall be as the glory of the children of Israel, saith the LORD of hosts.","4":"And in that day it shall come to pass, *that* the glory of Jacob shall be made thin, and the fatness of his flesh shall wax lean.","5":"And it shall be as when the harvestman gathereth the corn, and reapeth the ears with his arm; and it shall be as he that gathereth ears in the valley of Rephaim.","6":"Yet gleaning grapes shall be left in it, as the shaking of an olive tree, two *or* three berries in the top of the uppermost bough, four *or* five in the outmost fruitful branches thereof, saith the LORD God of Israel.","7":"At that day shall a man look to his Maker, and his eyes shall have respect to the Holy One of Israel.","8":"And he shall not look to the altars, the work of his hands, neither shall respect *that* which his fingers have made, either the groves, or the images.","9":"In that day shall his strong cities be as a forsaken bough, and an uppermost branch, which they left because of the children of Israel: and there shall be desolation.","10":"Because thou hast forgotten the God of thy salvation, and hast not been mindful of the rock of thy strength, therefore shalt thou plant pleasant plants, and shalt set it with strange slips:","11":"In the day shalt thou make thy plant to grow, and in the morning shalt thou make thy seed to flourish: *but* the harvest *shall be* a heap in the day of grief and of desperate sorrow.","12":"Woe to the multitude of many people, *which* make a noise like the noise of the seas; and to the rushing of nations, *that* make a rushing like the rushing of mighty waters!","13":"The nations shall rush like the rushing of many waters: but *God* shall rebuke them, and they shall flee far off, and shall be chased as the chaff of the mountains before the wind, and like a rolling thing before the whirlwind.","14":"And behold at eveningtide trouble; *and* before the morning he *is* not. This *is* the portion of them that spoil us, and the lot of them that rob"}},"tsk":{"1":[{"kopje":"last","refs":["Jes 15:1","Jes 19:1"]},{"kopje":"Damaskus","refs":["Jes 7:8","Gen 14:15","Gen 15:2","1 Kon 11:24","1 Kron 18:5","2 Kron 28:5","2 Kron 28:23","Jer 49:23-27","Amos 1:3-5","Zach 9:1","Hand 9:2"]},{"kopje": evankelijk weggevoerd zal hebben. Lees de vervulling hiervan 2Ki 15:29 , en 2Ki 17:6 ; 1Ch 5:26 ."}],"3":[{"catchword":"de vesting","tekst":"Versta, de vaste stad Samaria en andere daaronder horende."},{"catchword":"van Efraïm,","tekst":"Dat is, van het koninkrijk, of de tien stammen van Israël."},{"catchword":"der Syriërs;","tekst":"Hebreeuws, Aram. Aldus worden de Syriërs genoemd, omdat zij uit Aram gesproten zijn."},{"catchword":"zij zullen zijn","tekst":"Te weten de Syriërs. Dezen zullen ook van hunne heerlijkheid beroofd worden, gelijk de Israëlieten; het zal den een gaan als den ander."},{"catchword":"de heerlijkheid","tekst":"Aldus noemt de profeet alles waar zij zich op verhovaardigden en verlieten, als hun koninkrijk, hun vaste en schone steden, kastelen, vastigheden, geld en goed, ook hunne verbintenissen met andere koningen, gelijk Isa 16:14 ."}],"4":[{"catchword":"de heerlijkheid","tekst":"Dat is, de heerlijkheid der Israëlieten, of der tien stammen Israëls, gelijk vs.3."},{"catchword":"verdund","tekst":"Dat is, hunne heerlijkheid zal verarmen, verdwijnen, verminderen."}],"5":[{"catchword":"hij zal zijn,","tekst":"Te weten Jakob. De zin is: Dat alle tien stammen Israëls gevankelijk zullen weggevoerd worden, gelijk men in den oogst al het koren, zelfs de aren, opleest en invoert. Anderen verstaan hier door hij den koning van Assyrië."},{"catchword":"maaier","tekst":"Hebreeuws, den oogst; dat is een man van den oogst."},{"catchword":"in het dal Refaïm","tekst":"Een lustige en vruchtbare plaats, gelegen bij Jeruzalem; Jos 15:8 ."}],"6":[{"catchword":"Doch","tekst":"Sommigen besluiten vs.6-8."},{"catchword":"een nalezing","tekst":"Dat is, enigen, doch heel weinigen, [die daarna ook zullen weggevoerd worden door Esar-Haddon] zullen nog in het land overig blijven; doch gelijk men in den herfst de druiven, die men eerst is voorbijgegaan, daarna zoekt en afplukt, alzo zal het ook met de Israëlieten gaan. Zie de vervulling dezer profetie 2Ki 17:24 , en Ezr 4:2 . wijl God de Heere te dien tijde nog enige Israëlieten verschonen wilde; de Assyriërs lieten wel deze weinige Israëlieten niet met voorweten en al willens overig blijven, maar dit wordt hier gezegd ten aanzien van het voornemen van God, die nog een overblijfsel onder de Israëlieten heeft willen behouden. Derhalve heeft God de harten der Assyriërs alzo bewogen dat zij nog enigen verschoond hebben, namelijk die, die God heeft willen verschoond hebben in Israël. Wat de Hebreeuwse manier van spreken aangaat, die hier in den tekst gebruikt wordt, zie dergelijke Gen 36:6-7 ; Exo 9:11 ; Job 37:18-19 ."},{"catchword":"verwoesting","tekst":"Te weten over Israël en Syrië."}],"10":[{"catchword":"gij hebt","tekst":"Te weten, gij dochter Israëls, dat is, gij volk van Israël."},{"catchword":"God","tekst":"Dat is, dien God, die een bewerker uwer tijdelijke en eeuwige welvaart is."},{"catchword":"aan den Rotssteen","tekst":"Dat is, aan den sterken God, tot wien gij een vaste toevlucht hadt kunnen en behoren te nemen."},{"catchword":"zult gij wel","tekst":"De zin is: Ofschoon uw land naarstiglijk bezaaid en beplant is, op hoop van vele schone vruchten daarvan te zullen genieten."},{"catchword":"hem met","tekst":"Te weten uwen wijnberg."},{"catchword":"bezetten;","tekst":"Hebreeuws, bezaaien."}],"11":[{"catchword":"zult gij","tekst":"Dat is, gij zult wel uw uiterste best doen om uwe plantingen te doen wassen, namelijk met begieten en anderszins."},{"catchword":"in den morgenstond","tekst":"Dat is, ter bekwamer tijd, zonder enige gelegenheid te verzuimen."},{"catchword":"het zal maar","tekst":"De zin is: Gij moogt allen vlijt en naarstigheid, naar uw uiterste vermogen, gedaan hebben, als het leger der Assyriërs u overvalt, zo zal dat alles voor zulk een groot leger maar zijn als een hoop koren, welken zij in een ogenblik zullen opeten en verslinden."},{"catchword":"in den dag","tekst":"Dat is, ten tijde van het landverderf, van den inval, der belegering, die de Assyriërs zullen aanrichten. Anders: in den dag des angstes."}],"12":[{"catchword":"Wee","tekst":"Hier beginnen enigen Isa 18 omdat hier begint ene profetie tegen de Assyriërs en de Moren."},{"catchword":"der veelheid","tekst":"De profeet voorzegt hier dat wel vele vreemde natiën Gods volk zouden overvallen, maar dat het ten laatste tot hun eigen verderf zou strekken."},{"catchword":"der grote volken,","tekst":"Die den koning van Assyrië in zijn leger dienen zullen tegen de Israëlieten."}],"13":[{"catchword":"Hij zal","tekst":"Te weten de Heere."},{"catchword":"hem","tekst":"Te weten den koning van Assyrië. Anders, het, te weten volk, of die, te weten natiën."},{"catchword":"schelden,","tekst":"Zie de aantekening Psa 9:6 ."},{"catchword":"hij","tekst":"Te weten de koning van Assyrië; zie 2Ki 19:36 ."},{"catchword":"verre wegvlieden,","tekst":"Te weten tot in Assyrië toe."},{"catchword":"gejaagd worden,","tekst":"Te weten door den engel, die het leger van Sanherib vervolgd en verslagen heeft."},{"catchword":"het kaf der bergen","tekst":"Dat is, gelijk het kaf, of stof, dat op de bergen ligt, waar de wind lichtelijk kan bijkomen."},{"catchword":"een kloot","tekst":"Of, ronde bol, of bal, of wervel, of kluwen. Anders: als een rond ding. Zie Psa 83:14 ."}],"14":[{"catchword":"Ten tijde des avonds,","tekst":"Dat is, des nachts."},{"catchword":"zo is","tekst":"Te weten ontstaan in het leger van Sanherib, toen de slaande engel aankwam."},{"catchword":"hij er niet meer","tekst":"Te weten Sanherib, die gevloden is toen hij vernam dat zijn leger van den engel des Heeren geslagen werd; 2Ki 19:35 ."},{"catchword":"Dit is","tekst":"Woorden van het volk Gods."},{"catchword":"het deel","tekst":"Dat is straf, die God hun toeschikt; zie Job 20:29 ."},{"catchword":"beroven,","tekst":"Of, vertreden hebben."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"The burthen [See above, chap.13.o vers.1.] of Damascus. Behold Damascus shall be taken away, that it be no more a ruinous heap of stones. [Damascus was the Metropolis, or chief City in Syria. See above, chap.7.vers.8. But here must be understood not onely the destruction of the city of Damascus, but also of the Kingdom of Syria. (Damascus shall be taken away) that is, it shall be subdued, and the inhabitants carried away captive. This was done by Salmanassar, King of Assyria. (it shall be a ruinous heap of stones) Heb. An heap of ruine.]"}],"2":[{"catchword":null,"tekst":"The Cities of Aroer [That is, the Cities that lie round about, or neer the City of Aroer, by the brook Arnon, Deut.2.36. The Reubenites, Gadites, and Manassites had formerly inhabited them] shall be forsaken: they shall be for the flocks, [the Hebrew word signifieth the flocks, both of small and great beasts, as appeareth, Gen.32. vers.14,15,16.] they shall lie down (there,) and none shall make them afraid. [forasmuch as no enemies shall fall into the land; for it shall lie waste and desolate, after that Salmanassar shall have carried the inhabitants away captive. Read the accomplishment hereof, 2 Kings 15.29. and 17.6 and 1 Chron.5.26.]"}],"3":[{"catchword":null,"tekst":"And the fortress [Meaning the fenced city of Samaria, and other cities or towns depending thereon] shall cease from Ephraim, [that is, from the Kingdom, or the ten tribes of Israel] and the Kingdom from Damascus, and the remnant of the Syrians: [Heb. Aram, so the Syrians are called, because they sprang from Aram] they [to wit, the Syrians] shall be as the glory of the children of Israel, [the Syrians shall be bereaved of their glory, as well as the Israelites. It shall happen to both alike, to the one as well as to the other. (as the glory of the children of Israel) so that Prophet called all things, whereof they were proud, and whereon they relied; as namely, their Kingdom, their strong and fair Cities, Castles, Forts, Money, and goods, also their confederacies with other Kings; as chap.16.vers.14.] saith the LORD of hosts."}],"4":[{"catchword":null,"tekst":"And it shall come to pass in that day, that the glory of Israel, [that is, the glory of the Israelites, or of ten tribes, as vers.3.] shall be made thin: [that is, their glory shall be improverished, vanish away, be diminished] and that the fatness of his flesh shall wax lean."}],"5":[{"catchword":null,"tekst":"For he [To wit, Jacob] shall be as (when) a reaper, [Hebr. The harvest; that is, an Harvest-man] gathereth the standing corn, and his arm reapeth ears: yea, he shall be, as (when) one gathereth ears in the valley of Rephaim. [the meaning is, that all the ten tribes of Israel shall be carried away captive, as in harvest-time all the corn, even to the very ears, is gathered up, and carried into the barn. Others understand hereby He, the King of Assyria. The valley of Rephaim was a pleasant and fruitful place lying neer Jerusalem, Jos.15.8.]"}],"6":[{"catchword":null,"tekst":"But a gleaning shall be left in it, [To wit, in Jacob, or in Israel, in Samaria. That is, some, but very few, (who shall likewise be afterward carried away captive by Esar-haddon) shall yet be left in the land. But as in the vintage the grapes, those that at first were passed by, are afterward sought out, and plucked off, or gleaned: So shall it likewise happen to the Israelites. See the accomplishment of this Prophecy, 2 Kings 17.24. and those few shall be scattered here and there from one another] as (in) the shaking of an Olive-tree, two (or) three berries in the top of the uppermost bough, and four (or) five on the fruitful branches thereof, [or, on the branches of the fruitful (olive tree)] saith the LORD God of Israel."}],"7":[{"catchword":null,"tekst":"And that day shall man look to him that made him, and his eyes shall look upon the holy one of Israel. [At that day, etc. To wit, when those judgements and plagues, shall light upon the people. The Prophet doth intimate here, that the chastening, of God shall yet as length bring forth some good effect in his children, in humbling them, and bring them to a sight and knowledge of their sins. (Shall man) That is, some or certain men; to wit, the believing Israelites, (shall man look to him that made him) Oth. Let man look, taking it for, a man ought to look to him, etc. (and his eyes shall look upon the Holy one of Israel.) That is, upon God, who is holy, and maketh holy, helpeth, instructeth, comforteth, and delivereth all those that come unto him, to seek help and comfort of him, and in him.]"}],"8":[{"catchword":null,"tekst":"And he shall not look to the altars, the works of his hands, [Oth. Places the words thus: And let him not look to the altars, etc.] neither shall he respect that which his fingers have made, [Oth. Namely, he shall not, &c.] neither the groves, nor the images of the Sun. [Of the images of the Sun, see Levit.chap.26. the annotate.on v.30.]"}],"9":[{"catchword":null,"tekst":"In that day, [To wit, when the enemy cometh marching on] shall his [to wit, Israel&acirc;&euro;&trade;s and Syria&acirc;&euro;&trade;s] strong Cities, [Heb. The Cities of his strength; namely, whereof he had relied more, than on God Almighty] be as a forsaken bush [Hebr. The forsaking of a bush] and uppermost branch, [that is, as a branch in the uppermost part of the tree, when the pruners of trees either regard not, or which they are not able to reach. So shall it happen to the Israelites, and to the Syrians] which they [to wit, the Assyrians] did forsake, because of the children of Israel; [that is, because God would at that time yet spare some Israelites. The Assyrians did not indeed wittingly and willingly let these few Israelites remain, but this is here said in respect of the purpose of God, who would yet reserve a remnant among the Israelites. Therefore God so moved and inclined the hearts of the Assyrians, that they spared yet some; namely, those, whom God would have to be spared in Israel. As for the Hebrew phrase, that is used here in the text: See the like, Genes.36.6,7. Exo 9:11. Job 37:18,19.] howbeit, there shall be desolation. [to wit, upon Israel and Syria.]"}],"10":[{"catchword":null,"tekst":"For thou [To wit, thou daughters of Israel; that is, thou people of Israel] hast forgotten God, thy salvation, [that is, Thou hast forgotten that God, who is the author both of thy temporal and eternal welfare] and (hast) not remembered the Rock of thy strength: [that is, the strong God, unto whom thou mightiest have fled, and oughtest to flee for refuge and safety in trouble] Therefore shalt thou indeed plant pleasant plants, [the meaning is, albeit thy land be diligently sown and planted, upon hopes of enjoying much fair and precious fruit] and thou shalt set [Hebr. Sow] it [to wit, thy vineyard] with foreign vine-branches."}],"11":[{"catchword":null,"tekst":"On the day when thou shalt have planted them, shalt thou make (them) to grow, [That is, thou shalt indeed do thy utmost endeavour to cause thy plantings to grow, namely, by watering and other ways] and in the morning [that is, in due season, without neglecting any fit opportunity] shalt thou make thy seed to flourish: (but) it shall be but an heap of that which is reaped in the day of sickness, and of painful sorrow. [The meaning is, thou mayst have used all diligence and industry, according to thy utmost power and ability, yet when the camp of the Assyrians shall set upon thee, all that thou hast sowen and planted, shall be for so great an army, but as an heap of corn, which they shall eat up and devour as it were in a moment. (in the day of sickedness, and of painful sorrow.) That is, in the time of the destruction of the land, of the invasion, of the siege, which the Assyrians shall make. Oth. In the day of anguish]"}],"12":[{"catchword":null,"tekst":"Wo to the multitude of great nations, [Some begin here the 18th. Chapter, because here beginneth a prophecy against the Assyrians and the Ethiopians. The Prophet foretelleth here, and in the words following, that indeed many strange Nations should assault the people of God, but that it should at length tend to their own destruction. (Wo to the multitude of great nations,) That shall serve the King of Assyria in his camp or army against the Israelites] which roar like as the seas do roar: and (wo) to the noise of the Nations, that make a noise, as the mighty waters do make a noise."}],"13":[{"catchword":null,"tekst":"The nations shall (indeed) make a noise as great waters do make a noise, but he [To wit, the Lord] shall rebuke [See the annotate. Psal.9.on v.6.] him, [To wit, the King of Assyria. Oth. It, to wit, the people: Or, them; to wit, the Nations] then shall be [To wit, the King of Assyria,] flee far away, [To wit, into Assyria. See 2 Kings 19 36.] yea he shall be chased, [To wit, by the Angel, that pursued and smote the camp of Sanherib] as the chaff of the mountains by the wind, [That is, as the chaff, or, dust, which lieth upon the mountains, where the wind may easily come at. Compare Job 21:18. Psal.1.4. and 35.5. and 83.14. Hos 13:3.] and like a Clod, [Or, round bowl, or, bull, or, bottom of yarn, or, clews. Oth. As a round thing. See Psal.83.14.] by the whirl-wind."}],"14":[{"catchword":null,"tekst":"At evening-tide, [Or, in the night] behold, then there is terror, [To wit, risen in the camp of Sanherib, when the destroying Angel came] before it is morning he is there no more: [He, to wit, Sanherib, who fled away, when he perceived that his army was smitten by the Angel of the Lord, 2 Kings 19.35.] This is the portion of them that spoil us, and the lot of them that rob us. [These are the words of the people of God. (This is the part, (or portion) of them that spoil us.) That is, this is the punishment, which God inflicteth upon them. See Job chap.20.on vers.29. (of them that spoil us,) Or, have trodden us underfoot.]"}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
