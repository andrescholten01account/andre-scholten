l":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Zie, Mijn Knecht, Die Ik ondersteun, Mijn Uitverkorene, in Wie Mijn ziel een welbehagen heeft! Ik heb Mijn Geest op Hem gegeven; Hij zal het recht aan de heidenen voortbrengen.","2":"Hij zal niet schreeuwen, noch Zijn stem verheffen, noch Zijn stem op straat horen laten.","3":"Het geknakte riet zal Hij niet breken, en de rokende vlaswiek zal Hij niet uitblussen; met waarheid zal Hij het recht voortbrengen.","4":"Hij zal niet verdonkerd worden, en Hij zal niet gebroken worden, totdat Hij het recht op aarde heeft gevestigd; en de eilanden zullen op Zijn leer wachten.","5":"Zo zegt God, de HEERE, Die de hemelen geschapen en ze uitgebreid heeft, Die de aarde uitgespannen heeft, en wat daaruit voortkomt; Die aan het volk dat daarop is, de adem geeft, en de geest aan hen die daarop wandelen:","6":"Ik, de HEERE, heb u geroepen in gerechtigheid, en Ik zal u bij uw hand grijpen; en Ik zal u behoeden, en Ik zal u geven tot een Verbond van het volk, tot een Licht van de heidenen.","7":"Om de blinde ogen te openen, om de gevangenen uit de gevangenis te leiden, en uit de gevangenis hen die in duisternis zitten.","8":"Ik ben de HEERE, dat is Mijn Naam; en Mijn eer zal Ik aan geen ander geven, noch Mijn lof aan de gesneden beelden.","9":"Zie, de vroegere dingen zijn gekomen, en nieuwe dingen verkondig Ik; voordat ze uitspruiten, doe Ik u die horen.","10":"Zingt de HEERE een nieuw lied, Zijn lof van het einde van de aarde; u, die ter zee vaart, en al wat daarin is, u eilanden en hun inwoners.","11":"Laat de woestijn en haar steden de stem verheffen, met de dorpen die Kedar bewoont; laat hen juichen die in de rotsen wonen, en van de top van de bergen af schreeuwen.","12":"Laat ze de HEERE de eer geven, en Zijn lof in de eilanden verkondigen.","13":"De HEERE zal uittrekken als een held; Hij zal de ijver opwekken als een krijgsman; Hij zal juichen, ja, Hij zal een groot geschreeuw maken; Hij zal Zijn vijanden overweldigen.","14":"Ik heb van oudsher gezwegen, Ik heb Mij stil gehouden en Mij ingehouden; Ik zal uitschreeuwen als een barende vrouw, Ik zal ze verwoesten en tegelijk opslokken.","15":"Ik zal bergen en heuvels woest maken, en al hun gras zal Ik doen verdorren; en Ik zal de rivieren tot eilanden maken, en de poelen uitdrogen.","16":"En Ik zal de blinden leiden door de weg die zij niet gekend hebben, Ik zal ze doen gaan door de paden die zij niet gekend hebben; Ik zal de duisternis voor hun ogen tot licht maken, en het kromme tot recht; deze dingen zal Ik hun doen, en Ik zal hen niet verlaten.","17":"Maar wie zich op gesneden beelden verlaten, die tegen de gegoten beelden zeggen: U bent onze goden; die zullen achteruit gedreven worden, en met schaamte beschaamd worden.","18":"Hoort, u doven! En kijkt toe, u blinden, om te zien.","19":"Wie is er blind als Mijn knecht, en doof, zoals Mijn bode, die Ik zend? Wie is blind, zoals de volmaakte, en blind, zoals de knecht van de HEERE?","20":"U ziet wel veel dingen, maar u bewaart ze niet; en al doet hij de oren open, toch hoort hij niet.","21":"De HEERE had een welbehagen aan Hem, om Zijn gerechtigheid; Hij maakte Hem groot door de wet, en Hij maakte Hem heerlijk.","22":"Maar nu is het een beroofd en geplunderd volk; zij zijn allen verstrikt in de holen, en verstopt in de gevangenissen; zij zijn tot een roof geworden, en er is niemand die ze redt; tot een plundering, en niemand zegt: Geef ze terug.","23":"Wie onder u neemt dit ter harte? Wie merkt op en hoort, wat hierna zijn zal?","24":"Wie heeft Jakob tot een plundering overgegeven, en Israël aan de rovers? Is het niet de HEERE, Hij, tegen Wie wij gezondigd hebben? Want zij wilden niet wandelen in Zijn wegen, en zij luisterden niet naar Zijn wet.","25":"Daarom heeft Hij over hen uitgestort de grimmigheid van Zijn toorn en de macht van de oorlog; en Hij heeft ze rondom in vlam gezet, doch zij merken het niet; en Hij heeft ze in brand gestoken, doch zij nemen het niet ter harte."},"SV":{"1":"Ziet, Mijn Knecht, Dien Ik ondersteun, Mijn Uitverkorene, *in* *Denwelken* Mijn ziel een welbehagen heeft! Ik heb Mijn geest op Hem gegeven; Hij zal het recht den heidenen voortbrengen.","2":"Hij zal niet schreeuwen, noch Zijn *stem* verheffen, noch Zijn stem op de straat horen laten.","3":"Het gekrookte riet zal Hij niet verbreken, en de rokende vlaswiek zal Hij niet uitblussen; met waarheid zal Hij het recht voortbrengen.","4":"Hij zal niet verdonkerd worden, en Hij zal niet verbroken worden, totdat Hij het recht op aarde zal hebben besteld; en de eilanden zullen naar Zijn leer wachten.","5":"Alzo zegt God, de HEERE, Die de hemelen geschapen, en dezelve uitgebreid heeft, Die de aarde uitgespannen heeft, en wat daaruit voortkomt; Die den volke, *dat* daarop is, den adem geeft, en den geest dengenen, die daarop wandelen:","6":"Ik, de HEERE, heb u geroepen in gerechtigheid, en Ik zal *u* bij uw hand grijpen; en Ik zal u behoeden, en Ik zal u geven tot een Verbond des volks, tot een Licht der heidenen.","7":"Om te openen de blinde ogen, om de gebondenen uit te voeren uit de gevangenis, *en* uit het gevangenhuis, die in duisternis zitten.","8":"Ik ben de HEERE, dat is Mijn Naam; en Mijn eer zal Ik geen anderen geven, noch Mijn lof den gesneden beelden.","9":"Ziet, de voorgaande dingen zijn gekomen, en nieuwe dingen verkondig Ik; eer dat zij uitspruiten, doe Ik ulieden die horen.","10":"Zingt den HEERE een nieuw lied, Zijn lof van het einde der aarde; gij, die ter zee vaart, en al wat daarin is, gij eilanden en hun inwoners.","11":"Laat de woestijn en haar steden *de* *stem* verheffen, met de dorpen, *die* Kedar bewoont; laat hen juichen, die in de rotsstenen wonen, *en* van den top der bergen af schreeuwen.","12":"Laat ze den HEERE de eer geven, en Zijn lof in de eilanden verkondigen.","13":"De HEERE zal uittrekken als een held; Hij zal den ijver opwekken als een krijgsman; Hij zal juichen, ja, Hij zal een groot getier maken; Hij zal Zijn vijanden overweldigen.","14":"Ik heb van ouds gezwegen, Ik heb Mij stil gehouden *en* Mij ingehouden; Ik zal uitschreeuwen, als een, die baart, Ik zal ze verwoesten , en te zamen opslokken.","15":"Ik zal bergen en heuvelen woest maken, en al hun gras zal Ik doen verdorren; en Ik zal de rivieren tot eilanden maken, en de poelen uitdrogen.","16":"En Ik zal de blinden leiden door den weg, *dien* zij niet geweten hebben, Ik zal ze doen treden door de paden, *die* zij niet geweten hebben; Ik zal de duisternis voor hun aangezicht ten licht maken, en het kromme tot recht; deze dingen zal Ik hun doen, en Ik zal hen niet verlaten.","17":"*Maar* die zich op gesneden beelden verlaten, die tot de gegoten beelden zeggen: Gij zijt onze goden; die zullen achterwaarts keren, *en* met schaamte beschaamd worden.","18":"Hoort, gij doven! en schouwt aan, gij blinden! om te zien.","19":"Wie is er blind als Mijn knecht, en doof, gelijk Mijn bode, *dien* Ik zende? Wie is blind, gelijk de volmaakte, en blind, gelijk de knecht des HEEREN?","20":"Gij ziet *wel* veel dingen, maar gij bewaart ze niet; of *schoon* hij de oren opendoet, zo hoort hij toch niet.","21":"De HEERE had lust *aan* *hem*, om Zijner gerechtigheid wil; Hij maakte *hem* groot *door* de wet, en Hij maakte *hem* heerlijk.","22":"Maar *nu* is het een beroofd en geplunderd volk; zij zijn allen verstrikt in de holen, en verstoken in de gevangenhuizen; zij zijn tot een roof geworden, en er is niemand, die ze redt; *tot* een plundering, en niemand zegt: Geeft *ze* weder.","23":"Wie onder ulieden neemt zulks ter oren? *Wie* merkt op en hoort, wat hierna zijn zal?","24":"Wie heeft Jakob tot een plundering overgegeven, en Israël den rovers? Is het niet de HEERE, Hij, tegen Wien wij gezondigd hebben? Want zij wilden niet wandelen in Zijn wegen, en zij hoorden niet naar Zijn wet.","25":"Daarom heeft Hij over hen uitgestort de grimmigheid Zijns toorns en de macht des oorlogs; en Hij heeft ze rondom in vlam gezet, doch zij merken het niet; en Hij heeft ze in brand gestoken, doch zij nemen het niet ter harte."},"KJV":{"1":"Behold my servant, whom I uphold; mine elect, *in whom* my soul delighteth; I have put my spirit upon him: he shall bring forth judgment to the Gentiles.","2":"He shall not cry, nor lift up, nor cause his voice to be heard in the street.","3":"A bruised reed shall he not break, and the smoking flax shall he not quench: he shall bring forth judgment unto truth.","4":"He shall not fail nor be discouraged, till he have set judgment in the earth: and the isles shall wait for his law.","5":"Thus saith God the LORD, he that created the heavens, and stretched them out; he that spread forth the earth, and that which cometh out of it; he that giveth breath unto the people upon it, and spirit to them that walk","6":"I the LORD have called thee in righteousness, and will hold thine hand, and will keep thee, and give thee for a covenant of the people, for a light of the Gentiles;","7":"To open the blind eyes, to bring out the prisoners from the prison, *and* them that sit in darkness out of the prison house.","8":"I *am* the LORD: that *is* my name: and my glory will I not give to another, neither my praise to graven images.","9":"Behold, the former things are come to pass, and new things do I declare: before they spring forth I tell","10":"Sing unto the LORD a new song, *and* his praise from the end of the earth, ye that go down to the sea, and all that is therein; the isles, and the inhabitants","11":"Let the wilderness and the cities thereof lift up *their voice*, the villages *that* Kedar doth inhabit: let the inhabitants of the rock sing, let them shout from the top of the mountains.","12":"Let them give glory unto the LORD, and declare his praise in the islands.","13":"The LORD shall go forth as a mighty man, he shall stir up jealousy like a man of war: he shall cry, yea, roar; he shall prevail against his enemies.","14":"I have long time holden my peace; I have been still, *and* refrained myself: *now* will I cry like a travailing woman; I will destroy and devour at once.","15":"I will make waste mountains and hills, and dry up all their herbs; and I will make the rivers islands, and I will dry up the pools.","16":"And I will bring the blind by a way *that* they knew not; I will lead them in paths *that* they have not known: I will make darkness light before them, and crooked things straight. These things will I do unto them, and not forsake","17":"They shall be turned back, they shall be greatly ashamed, that trust in graven images, that say to the molten images, Ye *are* our gods.","18":"Hear, ye deaf; and look, ye blind, that ye may see.","19":"Who *is* blind, but my servant? or deaf, as my messenger *that* I sent? who *is* blind as *he that is* perfect, and blind as the LORD'S servant?","20":"Seeing many things, but thou observest not; opening the ears, but he heareth","21":"The LORD is well pleased for his righteousness' sake; he will magnify the law, and make *it* honourable.","22":"But this *is* a people robbed and spoiled; *they are* all of them snared in holes, and they are hid in prison houses: they are for a prey, and none delivereth; for a spoil, and none saith, Restore.","23":"Who among you will give ear to this? *who* will hearken and hear for the time to come?","24":"Who gave Jacob for a spoil, and Israel to the robbers? did not the LORD, he against whom we have sinned? for they would not walk in his ways, neither were they obedient unto his law.","25":"Therefore he hath poured upon him the fury of his anger, and the strength of battle: and it hath set him on fire round about, yet he knew not; and it burned him, ye ">pass,</span> and new <span class=\"wl wl-kjv\" data-code=\"H2319\">things</span> do I <span class=\"wl wl-kjv\" data-code=\"H5046\">declare:</span> before they spring <span class=\"wl wl-kjv\" data-code=\"H6779\">forth</span> I tell","10":"<span class=\"wl wl-kjv\" data-code=\"H7891\">Sing</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> a <span class=\"wl wl-kjv\" data-code=\"H2319\">new</span> <span class=\"wl wl-kjv\" data-code=\"H7892\">song,</span> and his <span class=\"wl wl-kjv\" data-code=\"H8416\">praise</span> from the <span class=\"wl wl-kjv\" data-code=\"H7097\">end</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> ye that go <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea,</span> and all that is <span class=\"wl wl-kjv\" data-code=\"H4393\">therein;</span> the <span class=\"wl wl-kjv\" data-code=\"H339\">isles,</span> and the inhabitants","11":"Let the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> and the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> thereof lift <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> their voice, the <span class=\"wl wl-kjv\" data-code=\"H2691\">villages</span> that <span class=\"wl wl-kjv\" data-code=\"H6938\">Kedar</span> doth <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabit:</span> let the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of the <span class=\"wl wl-kjv\" data-code=\"H5553\">rock</span> <span class=\"wl wl-kjv\" data-code=\"H7442\">sing,</span> let them <span class=\"wl wl-kjv\" data-code=\"H6681\">shout</span> from the <span class=\"wl wl-kjv\" data-code=\"H7218\">top</span> of the mountains.","12":"Let them <span class=\"wl wl-kjv\" data-code=\"H7760\">give</span> <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H5046\">declare</span> his <span class=\"wl wl-kjv\" data-code=\"H8416\">praise</span> in the islands.","13":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall go <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> as a mighty <span class=\"wl wl-kjv\" data-code=\"H1368\">man,</span> he shall stir <span class=\"wl wl-kjv\" data-code=\"H5782\">up</span> <span class=\"wl wl-kjv\" data-code=\"H7068\">jealousy</span> like a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H4421\">war:</span> he shall <span class=\"wl wl-kjv\" data-code=\"H7321\">cry,</span> yea, <span class=\"wl wl-kjv\" data-code=\"H6873\">roar;</span> he shall <span class=\"wl wl-kjv\" data-code=\"H1396\">prevail</span> against his enemies.","14":"I have long <span class=\"wl wl-kjv\" data-code=\"H5769\">time</span> holden my <span class=\"wl wl-kjv\" data-code=\"H2814\">peace;</span> I have been <span class=\"wl wl-kjv\" data-code=\"H2790\">still,</span> and <span class=\"wl wl-kjv\" data-code=\"H662\">refrained</span> myself: now will I <span class=\"wl wl-kjv\" data-code=\"H6463\">cry</span> like a travailing <span class=\"wl wl-kjv\" data-code=\"H3205\">woman;</span> I will <span class=\"wl wl-kjv\" data-code=\"H5395\">destroy</span> and <span class=\"wl wl-kjv\" data-code=\"H7602\">devour</span> at once.","15":"I will make <span class=\"wl wl-kjv\" data-code=\"H2717\">waste</span> <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains</span> and <span class=\"wl wl-kjv\" data-code=\"H1389\">hills,</span> and dry <span class=\"wl wl-kjv\" data-code=\"H3001\">up</span> all their <span class=\"wl wl-kjv\" data-code=\"H6212\">herbs;</span> and I will <span class=\"wl wl-kjv\" data-code=\"H7760\">make</span> the <span class=\"wl wl-kjv\" data-code=\"H5104\">rivers</span> <span class=\"wl wl-kjv\" data-code=\"H339\">islands,</span> and I will dry <span class=\"wl wl-kjv\" data-code=\"H3001\">up</span> the pools.","16":"And I will <span class=\"wl wl-kjv\" data-code=\"H3212\">bring</span> the <span class=\"wl wl-kjv\" data-code=\"H5787\">blind</span> by a <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> that they <span class=\"wl wl-kjv\" data-code=\"H3045\">knew</span> not; I will <span class=\"wl wl-kjv\" data-code=\"H1869\">lead</span> them in <span class=\"wl wl-kjv\" data-code=\"H5410\">paths</span> that they have not <span class=\"wl wl-kjv\" data-code=\"H3045\">known:</span> I will <span class=\"wl wl-kjv\" data-code=\"H7760\">make</span> <span class=\"wl wl-kjv\" data-code=\"H4285\">darkness</span> <span class=\"wl wl-kjv\" data-code=\"H216\">light</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> them, and crooked <span class=\"wl wl-kjv\" data-code=\"H4625\">things</span> <span class=\"wl wl-kjv\" data-code=\"H4334\">straight.</span> These <span class=\"wl wl-kjv\" data-code=\"H1697\">things</span> will I <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> unto them, and not forsake","17":"They shall be <span class=\"wl wl-kjv\" data-code=\"H5472\">turned</span> <span class=\"wl wl-kjv\" data-code=\"H268\">back,</span> they shall be <span class=\"wl wl-kjv\" data-code=\"H1322\">greatly</span> <span class=\"wl wl-kjv\" data-code=\"H954\">ashamed,</span> that <span class=\"wl wl-kjv\" data-code=\"H982\">trust</span> in graven <span class=\"wl wl-kjv\" data-code=\"H6459\">images,</span> that <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> to the molten <span class=\"wl wl-kjv\" data-code=\"H4541\">images,</span> Ye are our gods.","18":"<span class=\"wl wl-kjv\" data-code=\"H8085\">Hear,</span> ye <span class=\"wl wl-kjv\" data-code=\"H2795\">deaf;</span> and <span class=\"wl wl-kjv\" data-code=\"H5027\">look,</span> ye <span class=\"wl wl-kjv\" data-code=\"H5787\">blind,</span> that ye may see.","19":"Who is <span class=\"wl wl-kjv\" data-code=\"H5787\">blind,</span> but my <span class=\"wl wl-kjv\" data-code=\"H5650\">servant?</span> or <span class=\"wl wl-kjv\" data-code=\"H2795\">deaf,</span> as my <span class=\"wl wl-kjv\" data-code=\"H4397\">messenger</span> that I <span class=\"wl wl-kjv\" data-code=\"H7971\">sent?</span> who is <span class=\"wl wl-kjv\" data-code=\"H5787\">blind</span> as he that is <span class=\"wl wl-kjv\" data-code=\"H7999\">perfect,</span> and <span class=\"wl wl-kjv\" data-code=\"H5787\">blind</span> as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S</span> servant?","20":"<span class=\"wl wl-kjv\" data-code=\"H7200\">Seeing</span> many <span class=\"wl wl-kjv\" data-code=\"H7227\">things,</span> but thou <span class=\"wl wl-kjv\" data-code=\"H8104\">observest</span> not; <span class=\"wl wl-kjv\" data-code=\"H6491\">opening</span> the <span class=\"wl wl-kjv\" data-code=\"H241\">ears,</span> but he heareth","21":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is well <span class=\"wl wl-kjv\" data-code=\"H2654\">pleased</span> for his <span class=\"wl wl-kjv\" data-code=\"H6664\">righteousness'</span> sake; he will <span class=\"wl wl-kjv\" data-code=\"H1431\">magnify</span> the <span class=\"wl wl-kjv\" data-code=\"H8451\">law,</span> and make it honourable.","22":"But this is a <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H962\">robbed</span> and <span class=\"wl wl-kjv\" data-code=\"H8154\">spoiled;</span> they are all of them <span class=\"wl wl-kjv\" data-code=\"H6351\">snared</span> in <span class=\"wl wl-kjv\" data-code=\"H2352\">holes,</span> and they are <span class=\"wl wl-kjv\" data-code=\"H2244\">hid</span> in <span class=\"wl wl-kjv\" data-code=\"H3608\">prison</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">houses:</span> they are for a <span class=\"wl wl-kjv\" data-code=\"H957\">prey,</span> and none <span class=\"wl wl-kjv\" data-code=\"H5337\">delivereth;</span> for a <span class=\"wl wl-kjv\" data-code=\"H4933\">spoil,</span> and none <span class=\"wl wl-kjv\" data-code=\"H559\">saith,</span> Restore.","23":"Who among you will give <span class=\"wl wl-kjv\" data-code=\"H238\">ear</span> to this? who will <span class=\"wl wl-kjv\" data-code=\"H7181\">hearken</span> and <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> for the time to come?","24":"Who <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> for a <span class=\"wl wl-kjv\" data-code=\"H4933\">spoil,</span> and <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> to the <span class=\"wl wl-kjv\" data-code=\"H962\">robbers?</span> did not the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> he against <span class=\"wl wl-kjv\" data-code=\"H2098\">whom</span> we have <span class=\"wl wl-kjv\" data-code=\"H2398\">sinned?</span> for they <span class=\"wl wl-kjv\" data-code=\"H14\">would</span> not <span class=\"wl wl-kjv\" data-code=\"H1980\">walk</span> in his <span class=\"wl wl-kjv\" data-code=\"H1870\">ways,</span> neither were they <span class=\"wl wl-kjv\" data-code=\"H8085\">obedient</span> unto his law.","25":"Therefore he hath <span class=\"wl wl-kjv\" data-code=\"H8210\">poured</span> upon him the <span class=\"wl wl-kjv\" data-code=\"H2534\">fury</span> of his <span class=\"wl wl-kjv\" data-code=\"H639\">anger,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5807\">strength</span> of <span class=\"wl wl-kjv\" data-code=\"H4421\">battle:</span> and it hath set him on <span class=\"wl wl-kjv\" data-code=\"H3857\">fire</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about,</span> yet he <span class=\"wl wl-kjv\" data-code=\"H3045\">knew</span> not; and it <span class=\"wl wl-kjv\" data-code=\"H1197\">burned</span> him, yet he <span class=\"wl wl-kjv\" data-code=\"H7760\">laid</span> it not to heart."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Mijn Knecht,","tekst":"Dit spreekt God de Vader van zijnen Zoon Christus, dien Hij zijnen knecht noemt, te dien aanzien, dat Christus, als onze Middelaar, de gedaante eens knechts heeft aangenomen. Vergelijk Isa 53:11 ; Mat 12:18 ; Phi 2:6-8 ."},{"catchword":"Dien Ik ondersteun,","tekst":"Dat is, dien Ik versterk, dat Hij niet bezwijke onder den onverdragelijken last mijns toorns, die Hij een tijdlang gevoelen moet om uwe zonden [voor welke Hij zichzelven heeft overgegeven] uit te delgen en te verzoenen."},{"catchword":"Mijn Geest","tekst":"Te weten de gaven des Heiligen Geestes, die Hij van node heeft om het Middelaarsambt te verrichten; zie Isa 11:2 ; Mat 3:16 ."},{"catchword":"Hij zal het recht","tekst":"Dat is, Hij zal de rechte leer van de zaligheid der mensen, door de predikatie van het heilige Evangelie, den heidenen voordragen en hen alzo tot zijne gehoorzaamheid en tot hunne zaligheid brengen."},{"catchword":"den heidenen","tekst":"Of, den volken, zo den Joden als den heidenen. Zie Rom 1:16 ."},{"catchword":"voortbrengen","tekst":"Te weten uit den schoot des Vaders; Joh 1:18 . Dit zal Hij doen ten dele in eigen persoon, ten dele door zijne apostelen en andere leraars van het heilige Evangelie."}],"2":[{"catchword":"schreeuwen,","tekst":"Of, roepen, tieren; zie Mat 12:19 . De zin is: Hij zal niet veel pochen, of veel rumoer maken, niet veel tumult, gelijk de prinsen dezer wereld doen; ook zal Hij niet veel uiterlijk geprang of gedruis maken; maar Hij zal zich stil, beleefdelijk en deemoedig gedragen, duldende goedertieren al de onvolmaaktheden zijner uitverkorenen. Zie Mat 12:18-20 , en Luk 17:20 ."}],"3":[{"catchword":"Het gekrookte riet","tekst":"Dat is, Hij zal geduld hebben met de zwakheden der arme zondaars, en Hij zal hun verslagen conscientiën verkwikken en hen vertroosten door de belofte van de vergeving hunner zonden. Zie Psa 34:19 ; Mat 11:28 ."},{"catchword":"de rokende vlaswiek","tekst":"Dat is, de wiek, die in de lamp schier uitgebrand is, nauwelijks schijnsel of licht meer gevende, maar alleen nog rokende."},{"catchword":"met waarheid","tekst":"Dat is, oprechtelijk, getrouwelijk, want waarheid betekent hier trouw."},{"catchword":"voortbrengen","tekst":"Of, uitvoeren, en dienvolgens overwinnen, gelijk waarheid en recht eindelijk overwinnen. Zie Mat 12:20 ."}],"4":[{"catchword":"Hij zal niet verdonkerd","tekst":"Maar Hij zal helder en klaar lichten en schijnen; Christus' licht gesteld tegen het rokende en smokende vlas, en zijne macht tegen het gekrookte riet. Anders: Hij zal niet versmachten; te weten in het verrichten van zijn ambt, Mat 26:39 ; Luk 12:50 ; hetzelfde wordt straks met andere woorden gezegd. Sommigen verstaan dit, verdonkerd en gebroken worden, van het lijden en sterven van onzen Heere Christus, hetwelk niet geschieden zou eer Hij het Evangelie had verkondigd naar den raad van zijnen Vader."},{"catchword":"Hij zal niet verbroken","tekst":"Dat is, Hij zal onder den zwaren last zijner bediening niet bezwijken."},{"catchword":"totdat Hij","tekst":"Te weten door de predikatie van het heilige Evangelie in de ganse wereld; hetwelk niet geschieden kon vóór en aleer Christus gestorven en tot zijn hemelsen Vader opgevaren was, en den Heiligen Geest op de apostelen gezonden had. Zie Joh 16:7 ."},{"catchword":"het recht","tekst":"Dat is, de leer, gelijk straks volgt."},{"catchword":"de eilanden","tekst":"Met deze woorden geeft de profeet te kennen dat de leer van het heilige Evangelie niet zou besloten blijven binnen de grenzen van het Joodse land; Gen 49:10 ; Mat 28:19 ."},{"catchword":"Zijn leer","tekst":"Dit is hetzelfde, dat Hij straks genoemd heeft het recht, namelijk het Evangelie."}],"5":[{"catchword":"dezelve","tekst":"Hebreeuws, derzelve uitbreiders, of, die dezelve uitbreiden. Zie Job 35:10 ."},{"catchword":"uitgespannen heeft,","tekst":"Te weten in het rond."},{"catchword":"wat daaruit","tekst":"Hebreeuws, hare uitgangen; dat is al wat daaruit spruit en wast."},{"catchword":"den geest dengenen,","tekst":"Versta hier door den geest de redelijke ziel. Zie Num 16:22 ."}],"6":[{"catchword":"u","tekst":"O mijn Zoon Jezus Christus."},{"catchword":"geroepen","tekst":"Te weten tot een Middelaar."},{"catchword":"in gerechtigheid,","tekst":"Of, met gerechtigheid; dat is op behoorlijke wijze, want Gij hebt U goedwillig tot het middelaarsambt overgegeven; zie Psa 40:9 ; Heb 10:7 . Of, met gerechtigheid; dat is, achtervolgens mijne beloften, die Ik door de patriarchen en profeten mijn volk dikwijls gedaan heb."},{"catchword":"Ik zal u","tekst":"Dat is, Ik zal u bijstaan, mits u gevende noodwendige krachten tot uitvoering van uw middelaarsambt."},{"catchword":"Ik zal u behoeden,","tekst":"Alzo dat Gij vóór den bestemden tijd niet onderdrukt wordt, alsook dat Gij in de overgrote pijn niet bezwijkt."},{"catchword":"tot een Verbond","tekst":"Dat is, tot een Middelaar des verbonds, namelijk des genadeverbonds, hetwelk Ik met Abraham en zijn zaad gemaakt heb. Dit verbond zult Gij bevestigen; te weten alzo, dat door U mijn volk met mij zal worden verzoend en voorts alle volken in een verbond zullen verenigd worden, niet alleen de Israëlieten, maar ook de heidenen, gelijk straks volgt."},{"catchword":"tot een Licht","tekst":"Dat is, opdat Gij hen verlicht met de zaligmakende kennis Gods en van hunnen Zaligmaker, waardoor de uitverkorenen onder alle natiën zullen verheugd worden. Want gelijk het licht den mens naar het lichaam verheugt en verkwikt, alzo verheugt de kennis van Christus het gemoed der kinderen Gods innerlijk. Vergelijk Isa 9:1 , en Isa 49:6 ; Luk 3:32 ; Act 13:47 , en Act 16:34 ."}],"7":[{"catchword":"te openen","tekst":"Te weten door de predikatie van het heilige Evangelie en de verlichting van den Heiligen Geest; zie Act 13:46-47 , en Act 26:17-18 ."},{"catchword":"de blinde ogen,","tekst":"Te weten de ogen van het verstand. Zie Isa 35:5 ."},{"catchword":"uit te voeren","tekst":"Te weten uit de geestelijke dienstbaarheid der zonde en des duivels, de uitverkorenen alzo bevrijdende en verlossende uit den schrik en de vrees der hel. Zie Isa 49:9 , en Isa 61:1 ; Luk 4:18 ; Heb 2:14-15 ."},{"catchword":"duisternis","tekst":"Versta hier, de duisternis der onwetendheid. Zie boven, Isa 9:1 ."}],"8":[{"catchword":"de HEERE,","tekst":"Hebreeuws, JHWH; dat is de eeuwige, zelfstandige, onveranderlijke God."}],"9":[{"catchword":"de voorgaande","tekst":"De zin is: Wat Ik mijn volk tevoren verkondigd heb, dat is vervuld; nu verkondig Ik ulieden wat nieuws, hetwelk ook zekerlijk geschieden zal, namelijk de verschijning van den Messias in het vlees, die zal van punt tot punt alzo voltrokken worden, gelijk Ik ze door mijne profeten voorzegd heb."}],"10":[{"catchword":"een nieuw lied,","tekst":"Dat is, een voortreffelijk lied. Zie Psa 32:3 ."},{"catchword":"van het einde","tekst":"Dat is, gijlieden, die aan de uiterste einden der wereld woont, alle mensen van welken staat of natie gij zijt; aangezien het heil, dat de Messias aanbrengt, allerlei volken en natiën aangaat; zo hebben zich dan billijk alle volken en natiën in Hem te verheugen en te verblijden."},{"catchword":"die ter zee","tekst":"Hebreeuws, nederdaalt op de zee; te weten in het schip, dat op de zee zal varen."},{"catchword":"al wat daarin","tekst":"Gij mensen altegaar, die in de eilanden woont, die rondom in de zee liggen. Hebreeuws, de volheid derzelve; gelijk Psa 24:1 ."}],"11":[{"catchword":"haar steden","tekst":"Dat is, de steden, die in of nabij dezelve liggen."},{"catchword":"de dorpen,","tekst":"Dat is, de dorpen der Kedarenen; dat is der Arabieren, alzo genaamd naar Kedar, den zoon van Ismaël; Gen 25:13 ; Psa 120:5 ."},{"catchword":"die in de rotsstenen","tekst":"Anders: die te Sela wonen, welke is de hoofdstad van Arabië. Zie boven Isa 16:1 ."},{"catchword":"van den top","tekst":"Hebreeuws, van het hoofd der bergen."}],"13":[{"catchword":"De HEERE","tekst":"Te weten Jezus Christus."},{"catchword":"zal uittrekken","tekst":"Dat is, Hij zal zijn goddelijke macht doen blijken, als Hij den duivel en de wereld overwinnen zal door zijne predikatiën, zijnen dood, zijne verrijzenis, hemelvaart en het zitten ter rechterhand zijns Vaders en wederkomst ten oordeel."},{"catchword":"Hij zal een groot","tekst":"Sommigen menen dat het Hebreeuwse woord betekent tieren, brullen, of bulderen, gelijk de olifanten."}],"14":[{"catchword":"Ik heb vanouds","tekst":"Dit zijn de woorden Gods. Alsof Hij zeide: Dit is wel vanouds mijne wijze en manier van doen geweest, dat Ik mijne en de vijanden mijner kerk een tijdlang heb laten begaan."},{"catchword":"Ik heb Mij stil","tekst":"Of, zou Ik [langer] stilzwijgen? Zou ik mij [nog] inhouden?"}],"15":[{"catchword":"Ik zal bergen","tekst":"Dat is, Ik zal de grote en trotse vijanden mijner kerk verdelgen, en Ik zal uit den weg weren alle verhinderingen, die mijne gelovigen kunnen hinderen of schaden om tot mij in den hemel te komen."}],"16":[{"catchword":"de blinden","tekst":"Dat is, die den waren God tevoren niet kenden, maar van Hem en zijne leer afdwaalden en in grote blindheid der onwetendheid en afgoderij staken."},{"catchword":"leiden","tekst":"Te weten door mijn Geest en de predikatie van het heilig Evangelie."},{"catchword":"door den weg,","tekst":"Dat is, door den weg der hemelse en zaligmakende waarheid en godzaligheid."}],"17":[{"catchword":"met schaamte","tekst":"Dat is, gans en al te schande worden."}],"18":[{"catchword":"Hoort,","tekst":"Hier spreekt de HEERE de Joden aan, die moedwillig doof en blind waren, niet willende met aandacht zijn woord horen noch in acht nemen zijne werken en gerichten."}],"19":[{"catchword":"Mijn knecht,","tekst":"Dat is, het volk van Israël, dat ik mijnen wil heb geopenbaard en beroepen heb, opdat het mij daarna zou dienen, gelijk boven Isa 41:8 , en straks wederom in dit vs."},{"catchword":"Mijn bode,","tekst":"De priesters en Levieten, door wie God het volk zijnen wil te kennen gaf."},{"catchword":"dien Ik zende?","tekst":"Te weten om mijn volk te leren."},{"catchword":"de volmaakte,","tekst":"Of, volkomen, dat is, het volk van Israël, hetwelk Ik vele grote, zo geestelijke als lichamelijke weldaden bewezen heb, alzo dat het niets ontbrak; waaruit het behoorde te zien en bekennen hoe getrouw Ik het met hen voorhad."}],"20":[{"catchword":"veel dingen,","tekst":"Te weten vele wonderwerken van God, die Hij tot uw best doet."},{"catchword":"hij de oren","tekst":"Te weten de knecht des Heeren, dat is, het volk van Israël. De zin is: Dit volk stelt zich wel uiterlijk alzo aan, alsof het mijn woord horen wilde, maar het is hun geen ernst, het gaat hun niet ter harte wat zij horen. In het eerste lid van dit vs. wordt er gesproken tot den tweeden persoon; maar in het tweede lid van den derden persoon. Dit geeft wat duisterheid in den zin."},{"catchword":"zo hoort hij","tekst":"Dat is, zo behartigt hij het niet."}],"21":[{"catchword":"aan hem ,","tekst":"Te weten aan zijn knecht; dat is aan zijn volk, of aan hen, te weten deze lieden. Sommigen duiden het op de wet en de uitvoering van Gods oordelen over dit zondig volk."},{"catchword":"om Zijner","tekst":"Dat is, vanwege zijne waarheid en trouw, namelijk terwijl Hij den oudvaders beloofd heeft dat Hij hun zaad zou goeddoen; zie Psa 31:2 ."},{"catchword":"door de wet,","tekst":"Namelijk, die Hij hun gegeven had door Mozes. Zie Deu 4:6 ; Psa 147:19-20 ."}],"22":[{"catchword":"is het","tekst":"Te weten het volk van Israël; [anders: is hij ], te weten de knecht des Heeren, gelijk vs.19. Anderen aldus: En dat volk is beroofd en geplunderd; al de jongelingen zuchten, of, zij zuchten allen in de spelonken of holen der aarde."},{"catchword":"een beroofd","tekst":"De zin is: God heeft dit volk in de handen zijner vijanden overgegeven, omdat het zijne genade en goedertierenheid niet heeft in acht genomen."},{"catchword":"er is niemand,","tekst":"Hebreeuws, daar is geen redder."},{"catchword":"niemand zegt","tekst":"Daar is niemand, die hen beschermt of verdedigt, of die de vijanden dwingt weder te geven wat zij hun afgenomen hebben."}],"23":[{"catchword":"wat hierna","tekst":"Want de straffen en plagen des Heeren, die hier in dit leven komen over de onboetvaardige zondaars, zijn maar beginselen van hunne smarten, zo zij niet intijds opmerken en zich beteren en met belijdenis hunner zonden zeggen: Wie heeft Jakob, enz. vs.24."}],"24":[{"catchword":"Jakob . . . Israël","tekst":"Dat is, de nakomelingen van Jakob, de Israëlieten."},{"catchword":"Is het niet","tekst":"Dat is, het is zeker dat de Heere ons en onze goederen, om onzer zonden wil, in hunne handen heeft overgegeven."}],"25":[{"catchword":"over hen uitgestort","tekst":"Hebreeuws, over hem; te weten over Jakob, of over Israël, uit vs.24."},{"catchword":"de grimmigheid","tekst":"Dat is, zijne straffen; zie de aantekening Psa 79:6 ."},{"catchword":"de macht","tekst":"Het leger der Assyriërs en andere vijanden."},{"catchword":"zij merkten het niet . . . zij nemen het niet ter harte","tekst":"Dat is, de Israëlieten hebben geen acht gegeven op de gerichten van God en de oorzaken derzelve."},{"catchword":"in brand gestoken,","tekst":"Dat is, Hij heeft hen vernield door velerlei pijnlijke jammeren en ellenden."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Behold any servant, [God the father speaketh this of his son of Christ, whom h calleth his servant, in regard that Christ, as our mediator, took upon him the form of a servant. Compare below chap.53.11. Mat 12:11. Phil.2.ver.6,7,8.] whom I uphold, [that is, whom I strengthen, so as he faint not under the intolerable burden of my wrath, which he must feel and endure a while, to blot out and make atonement for your sins, for which he hath delivered up himself] mine elect (in whom) my soul delighteth: [Compare Mat 3:13. and 17.5. Eze 1:6.] I have given my spirit upon him, [to wit, the gifts of the holy ghost, which he hath need of to execute the office of mediator. See above chap.11.2. Mat 3:16. Joh.3.34.] he shall bring forth judgement [to wit, out of the bosom of the father, Joh.1.18. This he shall do partly in his own persons, partly by his Apostle, and other teachers or ministers of the Gospel] to the Gentiles [or to the nations, as well Jews as Gentiles. See Rom 1:16. The meaning is, Jews as Gentiles. See Rom 1:16. the meaning is, he shall propound and offer unto the Gentiles (or, unto all nations, both Jews and Gentiles) the true doctrine concerning the salvation of mankind by the preaching of the Gospel, and shall thereby bring them to obedience of himself, and to their own everlasting salvation.] See Mat 12:19."}],"2":[{"catchword":null,"tekst":"He shall not cry, clamour, nor list up (his voice), nor cause his voice to be heard in the street, [The meaning is, he will not boast or brag much, not make a great noise with much tumult, as the Princes of this world do: neither will he make any outward pomp or stir, but he will demean himself quietly, discreetly, and humbly, bearing graciously with all the infirmities and imperfections of his elect. See Mat.chap.12.ver.18,19,20. Luk 17:20.]"}],"3":[{"catchword":null,"tekst":"The bruised reed shall he not break, and the smoking flax-wick, [That is, the wick, that is almost burnt out in the lamp, giving hereby any shining or light at all, but onely yet smoking] he shall not quench it, [that is, he shall bear with the infirmities of poor sinners, and will refresh their dejected or wounded consciences, and comfort them with the promise of the forgiveness of their sins. See Psal.34.19. Mat 11:28.] he shall bring forth judgement in truth, [that is, uprightly, faithfully: for truth signifieth here fidelity or faithfulness, (he shall bring forth, etc.) or, exercise, and consequently overcome, or conquer: as truth and judgement do overcome or conquer at last. See Mat 12:20.]"}],"4":[{"catchword":null,"tekst":"He shall not be darkened, [But he shall give light and shine clear and bright. Christs light is opposed to the smoking and smothering flax, and his power to the bruised reed. Others, he shall not faint, to wit, in the executing or performing of his office. Mat 26:39. and Luk 12:50. The same is straightway said in other words. Some understand this being darkened and broken (the purchase that immediately followeth) of the death and passion of our LORD Jesus Christ, which should not come to pass before he had preached the Gospel according to his Fathers counsel] neither shall he be broken, [that is, he shall not faint under the heavy burden of his function] till be shall have set judgement [that is, doctrine, as straightway followeth] in the earth: [to wit, by the preaching of the Gospel throughout the whole world: which could not be done until Christ was dead, and was ascended unto his Father in heaven, and had sent the holy Ghost upon the Apostles. See Joh.16.7.] and the Isles shall wait for his doctrine.] In these words the Prophet doth shew the doctrine of the Gospel should not be always shut up within the bounds of the land of Juda, Gen 49:10. Mat 18:19. (his doctrine) this is the same which he even now called judgement; namely the Gospel.]"}],"5":[{"catchword":null,"tekst":"Thus saith God the LORD, he that created the heavens, and spread them abroad, [Heb. They spreaders abroad thereof, or those that spread them abroad. See Job 36.on 29.] he that stretched forth the earth, [to wit, in a circle.] and that which issueth out of it, [Heb. The issues thereof, that is, all that buddeth forth and groweth out of the earth] he that giveth breadeth unto the people (that) are upon it, and spirit to them that walk upon it: [understand hereby spirit the reasonable soul. See Numb.16.on ver.22.]"}],"6":[{"catchword":null,"tekst":"I the Lord have called thee [O my son Jesus Christ, to wit, to be a mediator] in righteousness [or with righteousness; that is, in due manner and form, for thou hast freely and willingly given thy self over to the office of a mediator. See Psal.40.9. Heb 10:7. Or, with righteousness: that is, according to my promises, which I have often made unto my people by the Patriarchs and Prophets] and I will hold (thee) by thine hand: [that is, I will assist thee, by giving thee necessary strength and ability for the executing of thy office of Mediator] and I will keep thee, [so that thou shalt not faint in the exceeding great torment] and I will give thee for a covenant, namely of the covenant of grace which I made with Abraham and his feed. This covenant thou shalt ratify and confirm, to wit, so as that by thee my people shall be reconciled unto me, and consequently all nations shall be united in one covenant; not onely the Israelites, but also the Gentiles, as immediately followeth] for a light of the gentiles, [that is, that thou mayst enlighten them with the saving knowledge of God, and of their Saviour, whereby the elect of all nations shall be made to rejoice. For as the light doth rejoice and comfort the bodies of men, so doth the knowledge of Christ rejoice the hearts and minds of the children of God inwardly. Compare above chap.9.1. and below chap.49.6. Luk 2:32. Act 13:47, and 16.34.]"}],"7":[{"catchword":null,"tekst":"To open the blind eyes: [To wit, by the preaching of the Gospel, and the enlightening of the holy ghost. See Act.13.46,47. And chap.26.ver.17,18. (the blind eyes) to wit, the eyes of the understanding. See above chap.35.5.] to bring out them that are bound from the prison, [to wit, from the spiritual bondage of sin and of the Devil, so freeing and delivering the elect from the fear and terror of hell. See below chapter 49.9. and 61.1. Luk 4:18. Heb 2:14, and 15.] (and) them that it in darkness [understand here the darkness of ignorance. See above chap.9.vers.1] out of the prison-house."}],"8":[{"catchword":null,"tekst":"I am the LORD, [Heb. Jehovah, that is, the everlasting, essential, unchangeable God] that is my name, and my glory will I give to no other, neither my praise to the carved images. [Compare below chap.48.11.]"}],"9":[{"catchword":null,"tekst":"Behold, the former things are come to pass; and new things do I declare: before they spring forth I cause you to hear them. [The meaning is, whatsoever I declared unto my people in former time the same is fulfilled: now I declare unto them some new thing, which shall also assuredly come to pass, namely, the appearance or coming of the Messiah in the flesh, which shall be as exactly fulfilled in every point and circumstance thereof, as I have foretold it by my Prophets.]"}],"10":[{"catchword":null,"tekst":"Sing unto the Lord a new song, [That is, an excellent song. See Psal.33.3.] his praise from the ends of the world, all men of whatsoever condition or nation ye are: forasmuch as the salvation which the Messiah bringeth concerneth all kind of people and nations, therefore all people and nations have just cause to rejoice and to be glad in him] ye that go to sea [Heb. That go over the sea; to wit, in the ships that shall group or sail upon the sea] and all that is therein, the isles and the inhabitants thereof. [ye men altogether that dwell in the isles, that lie round about in the sea. Heb. The fullness thereof, as Psal.24.1.]"}],"11":[{"catchword":null,"tekst":"Let the wilderness and the cities thereof [That is, the cities that lie in or neer unto it] lift up (their voice) with the villages (which) Kedar inhabiteth: [that is, the villages of the Kedarens; that is, the Arabians, so called from Kadar the son of Ishmael, Genes.25.13. Psal.120.5.] let them shout that dwell in the rocks. [Others, that dwell at Sela, which is the chief city of Arabia. See above chap.16.vers.1.] (and) make a noise from the top of the mountains. [Heb. From the head of the mountains.]"}],"12":[{"catchword":null,"tekst":"Let them give glory unto the Lord, and declare his praise in the Islands."}],"13":[{"catchword":null,"tekst":"The LORD [To wit, Jesus Christ] shall march forth as a Champion, [that is, he will make his divine power appear when he shall conquer the Devil and the world by his preaching, his death, his resurrection, ascension, sitting at the right hand of his father, and coming again to judgement] he shall stir up zeal like a man of war, he shall shout, yea he shall make a great noise: [some conceive that the Hebrew word signifieth crying, roaring, or bellowing like the elephants] he shall overpower his enemies."}],"14":[{"catchword":null,"tekst":"I have of old held my peace, [These are the words of God; as if he had said, this indeed hath been my custom and course of old, that I did let my and my church&acirc;&euro;&trade;s enemies awhile alone] I have been still (and) refrained my self: [or should I (longer) hold my peace? Should I (still) refrain my self?] I will cry out like a travailing woman, I will waste, swallow them up altogether."}],"15":[{"catchword":null,"tekst":"I will make waste mountains and hills, and I will cause all their grass to whither, [That is, I will destroy the great & proud enemies of my Church, and I will remove all impediments that may hinder or hurt my believers from coming to me into heaven] and I will make the rivers Islands, and (I will) dry up the pools."}],"16":[{"catchword":null,"tekst":"And I will lead [To wit, by my spirit and by the preaching of the Gospel] the blind, [That is, those that in former time knew not the true God, but erred and went astray from him and his doctrine, and stuck fast in great blindness of ignorance and Idolatry] by the way (which) they know not [that is, by the way of heavenly and saving truth and piety] I will cause them to go in the paths (which) they have not known: I will make darkness light before their face, and that which is crooked straight. [Compare above chap.40.3,4.] these things will I do unto them, and I will not forsake them."}],"17":[{"catchword":null,"tekst":"(But) they that rely on carved images, that say to the molten images, ye are our gods, they shall turn backwards, and with shame be made ashamed. [That is, be utterly confounded. Compare Psal.7.7. above chap.44.11. and 45.16.]"}],"18":[{"catchword":null,"tekst":"Hear ye deaf, and look ye blind, [Here the LORD speaketh unto the Jews, that were wilfully deaf and blind, not desiring to heat his word with attention, nor to consider his works and judgements] that ye may see."}],"19":[{"catchword":null,"tekst":"Who is blind but my servants? [That is, the people of Israel, to whom I have revealed my will, and whom I have called to serve me according unto it; as above chap.41.vers.8. and straightway again in this verse] and deaf as my messenger [the Priests and Levites, by whom God make his will known unto his people] (that) I sent? [to wit, to teach and instruct my people] who is blind as the perfect one? [or complete one: that is, the people of Israel, to whom I have shewed many great mercies both spiritual and corporal, so that they wanted nothing: whence they ought to see and acknowledge how faithfully and surely I meant it toward them] and blind as the LORDS servant?"}],"20":[{"catchword":null,"tekst":"Thou seest (indeed) many things, [To wit, many wonderful works of God which he doth for thy good] but thou keepest them not: [Compare Rom 2:2.etc.] (though) he [to wit, the servant of the LORD, that is, the people of Israel] open the ears, yet he heareth not [that is, he mindeth it not. The meaning is, this people doth outwardly so demean and carry themselves, as if they had a mind to hear my word, but they mean it not in good earnest, they do not, nor are seriously affected with, take to heart the things that they hear. In the first member of this verse there is spoken to the second person, but in the second clause of the first person. This implieth some obscurity or darkness in the sense.]"}],"21":[{"catchword":null,"tekst":"The LORD had a delight (in him) [To wit, in his servant; that is, in his people, or in them; to wit, these men. Some apply it to the law and the execution of Gods judgements upon this sinful people] for his righteousness sake: [that is, by reason of his truth and faithfulness, namely, because he promised the Patriarchs and the prophets that he would do good unto their feed. See Psal.147.19,20.] and he made (him) glorious."}],"22":[{"catchword":null,"tekst":"But (now) it [To wit, the people of Israel. Others, he, to wit, the Lords servant, as vers.19.] [is a robbed and spoiled people: they are all of them snared in holes, and hid in prison-houses: [Others thus, and the people is robbed and spoiled: all the young men sigh, or they sigh all of them in dens or holes of the earth. The meaning is, God hath delivered this people into the hands of their enemies, because they considered not his grace and mercy] they are become a prey, and there is none that delivereth them: [Heb. There is no deliverer] a spoil, and none saith, restore (them). [that is, there is none that defendeth or protecteth them, or that compelleth their enemies to restore back that which they took away from them.]"}],"23":[{"catchword":null,"tekst":"Who among you giveth ear to this? (who) considereth and heareth what shall be hereafter? [For the judgements and plagues of God, which do here in this life befall impenitent sinners, they are but beginnings of their sorrows, if they do not consider and repent in time, and with confession of their sins say, who gave Jacob, &c. Ver.24.]"}],"24":[{"catchword":null,"tekst":"Who gave Jacob for a spoil, and Israel to the robbers? [By Jacob and Israel is meant here the posterity of Jacob, the Israelites] is it not the LORD? He against whom we have sinned? [that is, it is certain that the Lord for our sins hath delivered us and our estates into their hands.] for they would not walk in his ways, they hearkened not unto his law."}],"25":[{"catchword":null,"tekst":"Therefore he hath poured out upon them [Heb. Upon him, and so in the sequel, to wit, upon Jacob, or upon Israel, as appeareth by vers.24.] the fury of his anger, [that is, his judgements. See the Annotat. Psal.79.on vers.6.] and the strength of war: [the army of the Assyrians, and other enemies] and he hath set them on flame round about, but they perceived it not; [that is, they regarded not the judgements of God, and the causes thereof, as in the former verse.]"}]}}};

function refUrl(ref) {

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');

}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;

document.addEventListener('click', e => {

    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
