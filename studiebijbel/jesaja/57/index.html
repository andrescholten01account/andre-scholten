l":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"De rechtvaardige komt om, en er is niemand die het ter harte neemt; en de goede mensen worden weggenomen, zonder dat iemand erop let dat de rechtvaardige weggenomen wordt vóór het kwaad komt.","2":"Hij zal ingaan in de vrede; zij zullen rusten op hun slaapsteden, ieder die in zijn oprechtheid gewandeld heeft.","3":"Maar kom hier dichterbij, kinderen van de waarzegster! Overspelig nageslacht, en u die hoererij bedrijft!","4":"Over wie maakt u zich vrolijk, tegen wie sperrt u de mond wijd open en steekt u de tong lang uit? Bent u geen kinderen van de overtreding, een nageslacht van de valsheid?","5":"U die verhit bent in de eikenbossen, onder elke groene boom; die de kinderen slacht bij de beken, onder de richels van de rotsen?","6":"Aan de gladde stenen van de beek is uw deel; die, die zijn uw lot; ook stort u daarover een drankoffer uit, u offert hun een spijsoffer; zou Ik Mij hierover laten troosten?","7":"U legt uw slaapplaats op een hoge en verheven berg; ook klimt u daarheen op om slachtoffer te offeren.","8":"En achter de deur en de posten zet u uw gedenkteken; want u wendt u van Mij af, ontdekt uzelf en klimt op; u maakt uw slaapplaats wijd, en sluit *een verbond* met sommigen van hen; u hebt hun leger lief, in elke plaats die u ziet.","9":"En u trekt met olie naar de koning, en u vermeerdert uw welriekende zalven; en u zendt uw gezanten ver weg, en vernedert u tot in het dodenrijk toe.","10":"U bent moe geworden door uw lange reis, maar u zegt niet: Het is hopeloos; u hebt nieuwe kracht[1] gevonden, daarom wordt u niet ziek.","11":"Maar voor wie bent u bang geweest of hebt u gevreesd? Want u hebt gelogen, en aan Mij hebt u niet gedacht, u hebt Mij niet op uw hart gelegd; is het niet omdat Ik zwijg, en dat al lang, dat u Mij niet vreest?","12":"Ik zal uw gerechtigheid bekendmaken, en uw werken, dat zij u geen nut zullen doen.","13":"Wanneer u zult roepen, laat dan degenen die door u verzameld zijn, u redden; maar de wind zal hen allemaal wegvoeren, de leegte zal hen wegnemen. Maar wie op Mij vertrouwt, die zal het land erven, en Mijn heilige berg in bezit krijgen.","14":"En men zal zeggen: Verhoog de weg, verhoog de weg, bereid de weg, neem de struikelblokken weg uit de weg van Mijn volk.","15":"Want zo zegt de Hoge en Verhevene, Die in de eeuwigheid woont, en Wiens Naam heilig is: Ik woon in de hoogte en in het heilige, en bij hem die een verbrijzelde en nederige geest heeft, om de geest van de nederigen levend te maken, en om het hart van de verbrijzelden levend te maken.","16":"Want Ik zal niet eeuwig twisten, en Ik zal niet voortdurend toornig zijn; want de geest zou van voor Mijn aangezicht bezwijken, en de zielen die Ik gemaakt heb.","17":"Ik was toornig over de ongerechtigheid van zijn hebzucht, en sloeg hem; Ik verborg Mij, en was toornig; toch ging hij afkerig zijn eigen weg, de weg van zijn hart.","18":"Ik zie zijn wegen, en Ik zal hem genezen; en Ik zal hem leiden, en hem vertroostingen teruggeven, namelijk aan hen die om hem treuren.","19":"Ik schep de vrucht van de lippen: vrede, vrede voor hen die ver weg zijn, en voor hen die dichtbij zijn, zegt de HEERE, en Ik zal hen genezen.","20":"Maar de goddelozen zijn als een voortgejaagde zee, want die kan niet tot rust komen, en haar water werpt slijk en modder op.","21":"De goddelozen, zegt mijn God, hebben geen vrede."},"SV":{"1":"De rechtvaardige komt om, en er is niemand, die het ter harte neemt; en de weldadige lieden worden weggeraapt, zonder dat er iemand op let, dat de rechtvaardige weggeraapt wordt voor het kwaad.","2":"Hij zal ingaan *in* den vrede; zij zullen rusten op hun slaapsteden, een iegelijk, die *in* zijn oprechtheid gewandeld heeft.","3":"Doch nadert gijlieden hier toe, gij kinderen der guichelares! gij overspelig zaad, en gij, die hoererij bedrijft!","4":"Over wien maakt gij u lustig, over wien spert gij den mond wijd open *en* steekt de tong lang uit? Zijt gij niet kinderen der overtreding, een zaad der valsheid?","5":"Die hittig zijt in de eikenbossen, onder allen groenen boom; slachtende de kinderen aan de beken, onder de hoeken der steenrotsen.","6":"Aan de gladde *stenen* der beken is uw deel, die, die zijn uw lot; ook stort gij denzelven drankoffer uit, gij offert hun spijsoffer; zou Ik Mij over deze dingen troosten laten?","7":"Gij stelt uw leger op een hogen en verhevenen berg; ook klimt gij derwaarts op, om slachtoffer te offeren.","8":"En achter de deur en posten zet gij uw gedenkteken; want van Mij *wijkende* ontdekt gij *u*, en klimt op; gij maakt uw leger wijd, en maakt u *een* *verbond* *met* *enigen* uit dezelve, gij hebt hun leger lief *in* elke plaats, *die* gij ziet.","9":"En gij trekt met olie tot den koning, en gij vermenigvuldigt uw welriekende zalven; en gij zendt uw gezanten verre weg, en vernedert u tot de hel toe.","10":"Gij zijt vermoeid door uw grote reis, *maar* gij zegt niet: Het is buiten hoop; gij hebt het leven uwer hand gevonden, daarom wordt gij niet ziek.","11":"Maar voor wien hebt gij geschroomd of gevreesd? Want gij hebt gelogen, en zijt Mijner niet gedachtig geweest, gij hebt *Mij* op uw hart niet gelegd; is het niet, *om* dat Ik zwijg, en dat van ouds af, en gij vreest Mij niet?","12":"Ik zal uw gerechtigheid bekend maken, en uw werken, dat zij u geen nut doen zullen.","13":"Wanneer gij roepen zult, zo laat die, die van u vergaderd zijn, u redden; doch de wind zal hen allen wegvoeren, de ijdelheid zal hen wegnemen. Maar die op Mij betrouwt, die zal het aardrijk erven, en Mijn heiligen berg erfelijk bezitten.","14":"En men zal zeggen: Verhoogt *de* *baan*, verhoogt *de* *baan*, bereidt den weg, neemt den aanstoot uit den weg Mijns volks.","15":"Want alzo zegt de Hoge en Verhevene, Die in de eeuwigheid woont, en Wiens Naam heilig is: Ik woon *in* de hoogte en *in* het heilige, en bij dien, die van een verbrijzelden en nederigen geest is, opdat Ik levend make den geest der nederigen, en opdat Ik levend make het hart der verbrijzelden.","16":"Want Ik zal niet eeuwiglijk twisten, en Ik zal niet geduriglijk verbolgen zijn; want de geest zou van voor Mijn aangezicht overstelpt worden, en de zielen, die Ik gemaakt heb.","17":"Ik was verbolgen over de ongerechtigheid hunner gierigheid, en sloeg hen; Ik verborg Mij, en was verbolgen; evenwel gingen zij afkerig henen in den weg huns harten.","18":"Ik zie hun wegen, en Ik zal hen genezen; en Ik zal hen geleiden, en hun vertroostingen wedergeven, namelijk aan hun treurigen.","19":"Ik schep de vrucht der lippen, vrede, vrede dengenen, die verre zijn, en dengenen, die nabij zijn, zegt de HEERE, en Ik zal hen genezen.","20":"Doch de goddelozen zijn als een voortgedreven zee, want die kan niet rusten, en haar wateren werpen slijk en modder op.","21":"De goddelozen, zegt mijn God, hebben geen vrede."},"KJV":{"1":"The righteous perisheth, and no man layeth *it* to heart: and merciful men *are* taken away, none considering that the righteous is taken away from the evil","2":"He shall enter into peace: they shall rest in their beds, *each one* walking *in* his uprightness.","3":"But draw near hither, ye sons of the sorceress, the seed of the adulterer and the whore.","4":"Against whom do ye sport yourselves? against whom make ye a wide mouth, *and* draw out the tongue? *are* ye not children of transgression, a seed of falsehood,","5":"Enflaming yourselves with idols under every green tree, slaying the children in the valleys under the clifts of the rocks?","6":"Among the smooth *stones* of the stream *is* thy portion; they, they *are* thy lot: even to them hast thou poured a drink offering, thou hast offered a meat offering. Should I receive comfort","7":"Upon a lofty and high mountain hast thou set thy bed: even thither wentest thou up to offer sacrifice.","8":"Behind the doors also and the posts hast thou set up thy remembrance: for thou hast discovered *thyself to another* than me, and art gone up; thou hast enlarged thy bed, and made thee *a covenant* with them; thou lovedst their bed where thou sawest","9":"And thou wentest to the king with ointment, and didst increase thy perfumes, and didst send thy messengers far off, and didst debase *thyself even* unto hell.","10":"Thou art wearied in the greatness of thy way; *yet* saidst thou not, There is no hope: thou hast found the life of thine hand; therefore thou wast not grieved.","11":"And of whom hast thou been afraid or feared, that thou hast lied, and hast not remembered me, nor laid *it* to thy heart? have not I held my peace even of old, and thou fearest","12":"I will declare thy righteousness, and thy works; for they shall not profit","13":"When thou criest, let thy companies deliver thee; but the wind shall carry them all away; vanity shall take *them*: but he that putteth his trust in me shall possess the land, and shall inherit my holy mountain;","14":"And shall say, Cast ye up, cast ye up, prepare the way, take up the stumblingblock out of the way of my people.","15":"For thus saith the high and lofty One that inhabiteth eternity, whose name *is* Holy; I dwell in the high and holy *place*, with him also *that is* of a contrite and humble spirit, to revive the spirit of the humble, and to revive the heart of the contrite ones.","16":"For I will not contend for ever, neither will I be always wroth: for the spirit should fail before me, and the souls *which* I have made.","17":"For the iniquity of his covetousness was I wroth, and smote him: I hid me, and was wroth, and he went on frowardly in the way of his heart.","18":"I have seen his ways, and will heal him: I will lead him also, and restore comforts unto him and to his mourners.","19":"I create the fruit of the lips; Peace, peace to *him that is* far off, and to *him that is* near, saith the LORD; and I will heal","20":"But the wicked *are* like the troubled sea, when it cannot rest, whose waters cast up mire and dirt.","21":"*There is* no peace, saith my God, to the wicked."}},"tsk":{"1":[{"kopje":"rechtvaardige","refs":["2 Kron 32:33","2 Kron 35:24"]},{"kopje":"niemand","refs":["Jes 57:11","Jes 42:25","Jes 47:7","Mal 2:2"]},{"kopje":"goede mensen","refs":["Ps 12:2","Micha 7:2"]},{"kopje":"de rechtvaardige","refs":["1 Kon 14:13","2 Kon 22:20","2 Kron 34:28"]}],"2":[{"kopje":"Hij zal","refs":["Job 3:17","Pred 12:7","Matt 25:21","Luk 16:22","2 Kor 5:1","2 Kor 5:8","Fil 1:23","Openb 14:13"]},{"kopje":"ingaan in","refs":["Luk 2:29","Luk 7:50"]},{"kopje":"rusten","refs":["Jes 14:18","2 Kron 16:14","Ezech 32:25"]},{"kopje":"in zijn oprechtheid","refs":["Gen 17:1","Luk 1:6"]}],"3":[{"kopje":"kom","refs":["Jes 45:20","Joël 3:9-11"]},{"kopje":"kinderen","refs":["Gen 3:15","Hos 1:2","Matt 3:7","Matt 12:34","Matt 16:4","Matt 23:33","Luk 3:7","Joh 8:40-44","Jak 4:4","1 Joh 3:10","Openb 17:1-5"]}],"4":[{"kopje":"tegen wie","refs":["Jes 10:15","Jes 37:23","Jes 37:29","Ex 9:17","Ex 16:7","Ex 16:8","Num 16:11","Luk 10:16","Hand 9:4"]},{"kopje":"vrolijk","refs":["Richt 16:25-27","Ps 69:13","Matt 27:29","Matt 27:39-44","2 Petr 2:13"]},{"kopje":"steekt u","refs":["Ps 35:21"]},{"kopje":"sperrt u","refs":["Joz 10:21","Job 16:9","Job 16:10","Ps 22:8","Ps 22:14","Ps 22:18","Klaagl 2:15","Klaagl 2:16"]},{"kopje":"bent u","refs":["Jes 1:4","Jes 30:1","Jes 30:9","Ezech 2:4","Hos 10:9","Matt 13:38","Ef 2:2","Ef 2:3","Ef 5:6","Kol 3:6"]}],"5":[{"kopje":"verhit","refs":["Ex 32:6","Num 25:1","Num 25:2","Num 25:6","Jer 50:38","Jer 51:7","Hos 4:11-13","Hos 7:4-7","Amos 2:7","Amos 2:8","Openb 17:1-5","Openb 18:3"]},{"kopje":"eikenbossen","refs":["Jes 1:29"]},{"kopje":"onder","refs":["Deut 12:2","1 Kon 14:23","2 Kon 16:3","2 Kon 16:4","2 even unto hell.","10":"Thou art <span class=\"wl wl-kjv\" data-code=\"H3021\">wearied</span> in the <span class=\"wl wl-kjv\" data-code=\"H7230\">greatness</span> of thy <span class=\"wl wl-kjv\" data-code=\"H1870\">way;</span> yet <span class=\"wl wl-kjv\" data-code=\"H559\">saidst</span> thou not, There is no <span class=\"wl wl-kjv\" data-code=\"H2976\">hope:</span> thou hast <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> the <span class=\"wl wl-kjv\" data-code=\"H2416\">life</span> of thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand;</span> therefore thou wast not grieved.","11":"And of whom hast thou been <span class=\"wl wl-kjv\" data-code=\"H1672\">afraid</span> or <span class=\"wl wl-kjv\" data-code=\"H3372\">feared,</span> that thou hast <span class=\"wl wl-kjv\" data-code=\"H3576\">lied,</span> and hast not <span class=\"wl wl-kjv\" data-code=\"H2142\">remembered</span> me, nor <span class=\"wl wl-kjv\" data-code=\"H7760\">laid</span> it to thy <span class=\"wl wl-kjv\" data-code=\"H3820\">heart?</span> have not I held my <span class=\"wl wl-kjv\" data-code=\"H2814\">peace</span> even of <span class=\"wl wl-kjv\" data-code=\"H5769\">old,</span> and thou fearest","12":"I will <span class=\"wl wl-kjv\" data-code=\"H5046\">declare</span> thy <span class=\"wl wl-kjv\" data-code=\"H6666\">righteousness,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H4639\">works;</span> for they shall not profit","13":"When thou <span class=\"wl wl-kjv\" data-code=\"H2199\">criest,</span> let thy <span class=\"wl wl-kjv\" data-code=\"H6899\">companies</span> <span class=\"wl wl-kjv\" data-code=\"H5337\">deliver</span> thee; but the <span class=\"wl wl-kjv\" data-code=\"H7307\">wind</span> shall carry them all <span class=\"wl wl-kjv\" data-code=\"H5375\">away;</span> <span class=\"wl wl-kjv\" data-code=\"H1892\">vanity</span> shall <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> them: but he that putteth his <span class=\"wl wl-kjv\" data-code=\"H2620\">trust</span> in me shall <span class=\"wl wl-kjv\" data-code=\"H5157\">possess</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H3423\">inherit</span> my <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> mountain;","14":"And shall <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Cast ye <span class=\"wl wl-kjv\" data-code=\"H5549\">up,</span> cast ye <span class=\"wl wl-kjv\" data-code=\"H5549\">up,</span> <span class=\"wl wl-kjv\" data-code=\"H6437\">prepare</span> the <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> take <span class=\"wl wl-kjv\" data-code=\"H7311\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H4383\">stumblingblock</span> out of the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of my people.","15":"For thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H7311\">high</span> and lofty <span class=\"wl wl-kjv\" data-code=\"H5375\">One</span> that <span class=\"wl wl-kjv\" data-code=\"H7931\">inhabiteth</span> <span class=\"wl wl-kjv\" data-code=\"H5703\">eternity,</span> whose <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> is <span class=\"wl wl-kjv\" data-code=\"H6918\">Holy;</span> I <span class=\"wl wl-kjv\" data-code=\"H7931\">dwell</span> in the <span class=\"wl wl-kjv\" data-code=\"H4791\">high</span> and <span class=\"wl wl-kjv\" data-code=\"H6918\">holy</span> place, with him also that is of a <span class=\"wl wl-kjv\" data-code=\"H1793\">contrite</span> and <span class=\"wl wl-kjv\" data-code=\"H8217\">humble</span> <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit,</span> to <span class=\"wl wl-kjv\" data-code=\"H2421\">revive</span> the <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> of the <span class=\"wl wl-kjv\" data-code=\"H8217\">humble,</span> and to <span class=\"wl wl-kjv\" data-code=\"H2421\">revive</span> the <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> of the contrite ones.","16":"For I will not <span class=\"wl wl-kjv\" data-code=\"H7378\">contend</span> for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever,</span> neither will I be <span class=\"wl wl-kjv\" data-code=\"H5331\">always</span> <span class=\"wl wl-kjv\" data-code=\"H7107\">wroth:</span> for the <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> should <span class=\"wl wl-kjv\" data-code=\"H5848\">fail</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> me, and the <span class=\"wl wl-kjv\" data-code=\"H5397\">souls</span> which I have made.","17":"For the <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity</span> of his <span class=\"wl wl-kjv\" data-code=\"H1215\">covetousness</span> was I <span class=\"wl wl-kjv\" data-code=\"H7107\">wroth,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> him: I <span class=\"wl wl-kjv\" data-code=\"H5641\">hid</span> me, and was <span class=\"wl wl-kjv\" data-code=\"H7107\">wroth,</span> and he went <span class=\"wl wl-kjv\" data-code=\"H3212\">on</span> <span class=\"wl wl-kjv\" data-code=\"H7726\">frowardly</span> in the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of his heart.","18":"I have <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> his <span class=\"wl wl-kjv\" data-code=\"H1870\">ways,</span> and will <span class=\"wl wl-kjv\" data-code=\"H7495\">heal</span> him: I will <span class=\"wl wl-kjv\" data-code=\"H5148\">lead</span> him also, and <span class=\"wl wl-kjv\" data-code=\"H7999\">restore</span> <span class=\"wl wl-kjv\" data-code=\"H5150\">comforts</span> unto him and to his mourners.","19":"I <span class=\"wl wl-kjv\" data-code=\"H1254\">create</span> the <span class=\"wl wl-kjv\" data-code=\"H5108\">fruit</span> of the <span class=\"wl wl-kjv\" data-code=\"H8193\">lips;</span> <span class=\"wl wl-kjv\" data-code=\"H7965\">Peace,</span> <span class=\"wl wl-kjv\" data-code=\"H7965\">peace</span> to him that is far <span class=\"wl wl-kjv\" data-code=\"H7350\">off,</span> and to him that is <span class=\"wl wl-kjv\" data-code=\"H7138\">near,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> and I will heal","20":"But the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked</span> are like the <span class=\"wl wl-kjv\" data-code=\"H1644\">troubled</span> <span class=\"wl wl-kjv\" data-code=\"H3220\">sea,</span> when it <span class=\"wl wl-kjv\" data-code=\"H3201\">cannot</span> <span class=\"wl wl-kjv\" data-code=\"H8252\">rest,</span> whose <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> cast <span class=\"wl wl-kjv\" data-code=\"H1644\">up</span> <span class=\"wl wl-kjv\" data-code=\"H7516\">mire</span> and dirt.","21":"There is no <span class=\"wl wl-kjv\" data-code=\"H7965\">peace,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> my <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> to the wicked."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"rechtvaardige","tekst":"Dat is, zodanige godzalige personen, die zich in hun leven bevlijtigd hebben de wet des Heeren te onderhouden, sterven heen."},{"catchword":"worden weggeraapt,","tekst":"Hebreeuws, worden verzameld, of weggenomen; dat is, zij worden uit dit leven gerukt; zie Deu 32:50 ; Jdg 18:25 ; Psa 26:9 , en de aantekening aldaar."},{"catchword":"dat de rechtvaardige","tekst":"Anders: want de rechtvaardige wordt weggeraapt."},{"catchword":"voor het kwaad","tekst":"Hebreeuws, voor het aangezicht des kwaads; dat is eer de ellenden komen, die de Heere bestemd heeft in de wereld te zenden; of uit het gezelschap der boze mensen. Zie 2Ki 22:20 , en Zep 3:15 ."}],"2":[{"catchword":"Hij zal ingaan","tekst":"Versta hier elken rechtvaardige, dien God tot zich roept."},{"catchword":"in den vrede;","tekst":"Dat is, in de vreugde des hemels, in de hemelse zaligheid, om de eeuwige vreugde te genieten; of in vrede; dat is, in gerustheid, en met een goede conscientie. Vergelijk Luk 2:29 ."},{"catchword":"slaapsteden,","tekst":"Of, bedden, of slaapkamers, of legers, en alzo hierna meermalen, dat is in hunne graven, waar zij rusten zullen tot hunne wederopstanding ten jongsten dage."},{"catchword":"oprechtheid","tekst":"Of, richtigheid; namelijk zonder van den rechten weg ter rechter of ter linkerhand te wijken. De zin is: die al zijn handel en wandel op het nauwste naar de wetten en geboden des Heeren aanstelt. Of die richtig, of op den rechten [weg] gewandeld heeft. Of, die recht voor Hem, te weten voor den Heere, gewandeld heeft; zie Gen 5:22 ."}],"3":[{"catchword":"gij kinderen","tekst":"Dat is, gijlieden, die met toverij en met huichelarij omgaat."},{"catchword":"gij overspelig zaad,","tekst":"Dat is, gij zaad of kinderen der overspelers, of kinderen dergenen, die tot overspel zijn begeven. Aldus noemt hij de Joden, vanwege hun geestelijk overspel, dat is hunne afgoderij, gelijk af te nemen is uit de naastvolgende verzen. Zie Eze 16 . Christus noemt ook de Joden een overspelig geslacht; Mat 12:39 , omdat zij dikwijls van den waren God waren afgevallen en de afgoden der heidenen dienden."}],"4":[{"catchword":"Over wien maakt","tekst":"Of, aan wien hebt gijlieden uwen lust? Dat is, met wien te bespotten houdt gijlieden uw kortswijl? Met deze en de volgende woorden geeft de Heere te kennen hoe zich de afgodische Joden tegen de profeten des Heeren gedragen hebben, als die hun Gods woord predikten."},{"catchword":"over wien spert","tekst":"Of, tegen wien? alsof Hij zeide: Doet gij mij dit niet ten spijt, zie Job 16:10 ; Psa 35:21 ."},{"catchword":"kinderen der overtreding,","tekst":"Dat is, de booswichten, die u geheel tot overtreding hebt begeven?"},{"catchword":"een zaad der valsheid?","tekst":"Dat is, mensen tot valsheid, dat is tot een valsen godsdienst begeven."}],"5":[{"catchword":"hittig zijt","tekst":"Dat is, gij boeleert en drijft afgoderij."},{"catchword":"in de eikenbossen,","tekst":"In welke zij afgoderij bedreven, zie Isa 1:29 . Anders, gij zijt hittig op de goden, dat is afgoden."},{"catchword":"groenen boom;","tekst":"Of, loverigen, of gebladerden boom."},{"catchword":"slachtende","tekst":"Vergelijk Eze 16:21 , Eze 16:36 , en Eze 23:39 , en Eze 24:7 , en vergelijk wijders 2Ki 16:3 ; 2Ch 28:3 ."},{"catchword":"onder de hoeken","tekst":"Of, onder de uitstekende steenrotsen."}],"6":[{"catchword":"Aan de gladde","tekst":"Anders: aan de gladde beekstenen is uw deel. Hebreeuws, aan de gladdigheden [der stenen] der beek is uw portie; dat is, gij benaarstigt u om schone, gladde stenen te kiezen, waar gij een afgod stelt of een altaar ter ere der afgoden."},{"catchword":"is uw deel,","tekst":"Dat is, gij hebt ze zo lief, alsof het uw deel ware, dat u door het lot is toegevallen. Het tegendeel is Psa 16:5 , zie de aantekening aldaar."},{"catchword":"uw lot;","tekst":"Of uw portie."},{"catchword":"voor hen drankoffer uit,","tekst":"Te weten afgoden, die gij op die plaatsen stelt. Of, op die [plaatsen] stort gij, enz."},{"catchword":"zou Ik Mij","tekst":"De zin is: Zou Ik het hartzeer, dat Ik gehad heb en nog heb vanwege ulieder afgoderij, zo kunnen vergeten? menselijkerwijze van God gesproken. Zie Gen 24:67 ; 2Sa 13:39 . De vraag loochent en dreigt. Alsof Hij zeide: Ik zal ulieder afgoderij geenszins vergeten, maar Ik zal om dezelve wel dapper straffen. Zie Isa 1:24 ; Eze 5:13 ."}],"7":[{"catchword":"uw leger","tekst":"Dat is, uwe altaren of kapellen, om met de afgoden aldaar geestelijke hoererij te bedrijven, gelijk ene hoer op het bed doet; zie Eze 16:24 ."},{"catchword":"om slachtoffer","tekst":"Te weten ter ere van de afgoden."}],"8":[{"catchword":"En achter de deur","tekst":"Eenigen menen deze woorden aldus: Gij zet uwe gedenktekenen achter de deur; dat is overal, in al de hoeken uwer huizen zet gij een afgodisch beeld, zijnde een teken uwer gruwelijke geestelijke afgoderij. Anderen verstaan hier door de gedenktekenen, of gedachtenis, de wet van God, die niet achter de deur behoorde gesteld te worden, maar God beveelt dat men ze voor aan de deuren, of op de posten der deuren zou schrijven; Deu 6:9 , en Deu 11:20 ."},{"catchword":"uw gedenkteken;","tekst":"Hebreeuws, uwe gedachtenis."},{"catchword":"wijkende","tekst":"De zin is: mij, uw wettelijken man verlatende, ontdekt gij u als een ontuchtige vrouw voor anderen. Hij blijft nog steeds in dezelfde beeldspraak van de geestelijke hoererij, te weten afgoderij."},{"catchword":"klimt op;","tekst":"Te weten op een hogen berg, gelijk vs.7; anders, gij klimt er op, te weten op uw bed, gelijk vs.3; versta het bed der geestelijke hoererij."},{"catchword":"gij maakt uw leger","tekst":"Dat is, gij bedrijft hoererij met vele afgoden."},{"catchword":"en maakt u","tekst":"Te weten bijzonderlijk met enige van de heidense afgoden, hoewel gij ze allen liefhebt. Anders: en maakt [een verbond] meer dan zij, te weten de heidenen, van wie gij dit geleerd hebt. Anders: houwt u [bomen] af meer dan genen; gij houwt u [bomen] af, te weten om plaats te maken in de bossen, waar gij de beelden en altaren der afgoden moogt zetten; of om afgoden daarvan te maken; vergelijk boven Isa 44:14 ."},{"catchword":"hun leger lief","tekst":"Te weten der afgoden, dat is, gij begaat met lust afgoderij."},{"catchword":"in elke","tekst":"Anders: aan de plaats, die gij u uitgezien hebt."},{"catchword":"plaats,","tekst":"Hebreeuws, hand; gelijk Isa 56:5 ."}],"9":[{"catchword":"gij trekt","tekst":"Dat is, gij zendt uwe afgezanten als gij in nood zijt, om hulp te verzoeken."},{"catchword":"met olie","tekst":"Te weten met kostelijke welriekende balsemolie [gelijk Hos 12:2 ] , tot een geschenk, zoals sommigen menen, aan Tiglath Pilnezer, den koning van Assyrië; 2Ki 16:7 ."},{"catchword":"gij vermenigvuldigt","tekst":"Dat is, gij bereidt deze olie veel, om dien koning overvloediglijk daarmede te beschenken."},{"catchword":"verre weg,","tekst":"Te weten tot in Assyrië."},{"catchword":"en vernedert u","tekst":"Dat is, opdat gij hulp van hem zoudt mogen verkrijgen, zo deemoedigt gij u voor hem, tot de hel, dat is, op het allernederigste, gelijk Mat 12:23 . Het schijnt dat de profeet hier ziet op de woorden van den koning Achaz, toen hij den koning van Assyrië liet aanzeggen: Ik ben uw knecht; 2Ki 16:7 ."},{"catchword":"tot de hel toe","tekst":"Dat is, opdat gij hulp van hem zoudt mogen verkrijgen, zo deemoedigt gij u voor hem, tot de hel, dat is, op het allernederigste, gelijk Mat 12:23 . Het schijnt dat de profeet hier ziet op de woorden van den koning Achaz, toen hij den koning van Assyrië liet aanzeggen: Ik ben uw knecht; 2Ki 16:7 ."}],"10":[{"catchword":"Gij zijt","tekst":"De zin is: Alhoewel gij een bezwaarlijke en verre reis gedaan hebt in Assyrië, om hulp aldaar te zoeken, zo zijt gij daardoor nog niet afgeschrikt."},{"catchword":"uw grote reis,","tekst":"In Assyrië. Hebreeuws, in de grootheid, of veelheid van uwen weg."},{"catchword":"Het is buiten hoop;","tekst":"Het is verloren arbeid, of het is wanhopend werk, derhalve wil ik het laten berusten."},{"catchword":"gij hebt het leven","tekst":"Dat is, hetgeen u bij het leven, of bij kracht en in figuur heeft kunnen houden. Anders: gij hebt een rol [of hoop, of schare] gevonden [dat is, gij hoopt gevonden te hebben] uwer hand; dat is, die gij aan de hand of tot uw gebied meent te hebben, te weten de Assyriërs. Anders: ene versterking uwer hand; dat is, ene vertroosting der hulp, waardoor uwe hand gesterkt zal worden. Anders: den kost uwer hand. De zin is: terwijl gij bij de Assyriërs vertroosting gevonden hebt, en zij beloven uwe hand met hulp te versterken, zo laat gij u die lange reis niet berouwen, maar eer wordt gij daardoor in uwe afgoderij gestijfd en gesterkt, en gij gaat al voort naar Assyrië om aldaar hulp te zoeken."},{"catchword":"wordt gij niet ziek","tekst":"Dat is, gij wordt niet flauw, gij geeft den moed niet verloren, gij bezwijkt niet in uw voornemen."}],"11":[{"catchword":"Maar voor wien","tekst":"De zin is: Als mijne profeten uwe zonden straffen, zo ontkent gij dezelve en bedekt ze met leugens. Vergelijk onder Isa 59:13 . Schroomt en vreest gij niemand, ja zelfs uwen God niet, omdat Hij u zolang ongestraft laat heengaan?"},{"catchword":"en zijt Mijner","tekst":"Dat is, gij hebt op mijne wraak niet gedacht of gevreesd dat Ik u zou straffen vanwege uwe leugens."},{"catchword":"om dat Ik zwijg,","tekst":"Dat is, omdat Ik u niet straks strafte, zo haast als gij tegen mij gezondigd hebt? Anders: heb Ik niet gezwegen, of mij stilgehouden, u zonder straf laten heengaan, van overlang, en gij hebt mij evenwel niet gevreesd? Of aldus: Zwijg Ik niet, ook vanouds, en zult gij mij niet vrezen?"},{"catchword":"en dat van ouds af,","tekst":"Hebreeuws, van eeuwigheid. Zie Job 22:15 ."}],"12":[{"catchword":"uw gerechtigheid","tekst":"Dat is, uwe schijnheiligheid, uwe huichelarij, waarmede gij pronkt alsof het goede werken waren; maar inderdaad is het ongerechtigheid. Want men moet weten dat dit ironisch of spottenderwijze gesproken is, dewijl zij voor rechtvaardige vrome lieden wilden geacht en gehouden wezen, maar inderdaad waren zij het niet."},{"catchword":"bekend maken,","tekst":"Dat is, Ik zal hen niet langer verzwijgen."},{"catchword":"geen nut doen","tekst":"Versta hierbij, maar integendeel zullen zij u grotelijks beschadigen."}],"13":[{"catchword":"gij roepen zult,","tekst":"Te weten in nood zijnde en hulp van mij verzoekende."},{"catchword":"die van u vergaderd zijn,","tekst":"Alsof de Heere zeide: Ik zal u niet verlossen, laat zien of de Assyrische soldaten, die gij tot uwe hulp vergaderd hebt, u zullen kunnen redden."},{"catchword":"Mijn heiligen berg","tekst":"Dat is, hij zal hier op aarde zijn een lidmaat mijner gemeente en na dit leven het eeuwige leven beërven. Hebreeuws, den berg mijner heiligheid. Vergelijk hiermede Psa 37:9 , en Isa 2:2 , en Isa 56:7 ."}],"14":[{"catchword":"men zal zeggen","tekst":"Of, hij zal zeggen, te weten de roeper, of de koning Cyrus, die liet uitroepen dat het Joodse volk weder in zijn land zou keren, zonder dat iemand hetzelve zou beschadigen. Zie Isa 40:3 , en Isa 62:10 ; waardoor wijders is afgebeeld de verlossing door Jezus Christus."}],"15":[{"catchword":"die van een verbrijzelden","tekst":"Zie de aantekening Psa 34:19 ."}],"16":[{"catchword":"eeuwiglijk twisten,","tekst":"Of, tot het einde."},{"catchword":"de geest","tekst":"Dat is, het hart, het gemoed van alle mensen, als Ik altijd met hen zou twisten, of altijd op hen even toornig zou blijven."},{"catchword":"overstelpt worden,","tekst":"Zie Psa 61:3 , en Psa 102:1 ."},{"catchword":"en de zielen,","tekst":"Te weten zouden overstelpt worden, of in bezwijming vallen."}],"17":[{"catchword":"hunner gierigheid,","tekst":"Hebreeuws, zijner. Alzo staat dit vs.17-19 doorgaans in het getal van enen."},{"catchword":"Ik verborg Mij,","tekst":"Dat is, Ik onttrok hun mijne genade en hulp."},{"catchword":"in den weg","tekst":"Dat is, in den weg, dien hun hart bedacht en versierde."}],"18":[{"catchword":"Ik zie hun wegen,","tekst":"Anders: [maar] als Ik hunne wegen aanzag, zo heelde, of genas Ik hen. De zin is: Toen Ik zag dat zij gans verdorven waren en zichzelven niet helpen konden, heb Ik hen uit loutere genade geholpen."},{"catchword":"aan hun treurigen","tekst":"Te weten die bedroefd zijn omdat zij mij vertoornd hebben."}],"19":[{"catchword":"Ik schep","tekst":"Dat is, Ik zal door de lippen mijner dienaren, die den vrede verkondigen, veel vrucht en vreugde, veel troost en dankbaarheid verwekken en teweegbrengen. Anders: Ik schep hetgeen met de lippen is voortgebracht, of voortgebracht wordt."},{"catchword":"dengenen,","tekst":"Dat is, alle uitverkorenen, hetzij dat zij Joden of heidenen zijn. Zie Eph 2:17 ."}],"20":[{"catchword":"als een voortgedreven zee,","tekst":"Als de zee of meren, die van de sterke winden bewogen en beroerd worden. Alzo worden de goddelozen tot alle boosheid voortgedreven, zo van hun eigen kwade conscientie als van andere kwade mensen."},{"catchword":"wateren","tekst":"Dat is, golven, of baren."},{"catchword":"werpen slijk","tekst":"Alzo werpen de goddelozen en brengen voort uit hun verdorven hart en gemoed, alle vuiligheid en verdorvenheid."},{"catchword":"op","tekst":"Of, uit."}],"21":[{"catchword":"hebben geen vrede","tekst":"Te weten geen vrede der conscientie, of van het gemoed. Zie Job 18:11 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"The righteous perisheth, [That is, such kind of religious and godly persons as have in their life-time been diligent and careful to keep the law of God, they die] and there is no man that layeth it to heart; and merciful men are snatched away, [Heb. Are gathered, or taken away; that is, they are taken away out of this life. See Deut.32.5. Jud 18:25. Psal.26.9. and the Annotat. There] without any mans considering that the righteous is snatched away before the evil. [Heb. Before the face of the evil. That is, before the miseries and calamities come which the Lord hath determined to send into the world. Or from the society or company of wicked men. See 2 Kings 22.20. and Wisd.4.10.]"}],"2":[{"catchword":null,"tekst":"He [Understand here every righteous person whom God calleth unto himself] shall enter (into) peace; [that is, into the joy of heaven, into celestial bliss, to partake of eternal joy and salvation. Or in peace, that is, in quietness and with a good conscience. Compare Luk 2:29.] they shall rest in their sleeping-places, [or beds, or bed-chambers, or couches, and so hereafter often; that is, in their graves, where they shall rest till their resurrection at the last day] each one that hath walked (in) his uprightness, [or straightness, namely without declining from the right way either to the right hand or to the left. The meaning is, he that ordereth and regulateth his whole life and conversation in the strictest manner according to the laws and commandements of God. Or he that hath walked aright, or in the right (way). Or, he that hath walked rightly before him; to wit, before the LORD. See Genesis 5.on verse 22.]"}],"3":[{"catchword":null,"tekst":"But draw ye near hither, the children of the juggles [that is, ye that practise witchcraft and juggling] ye adulterous seed. [that is, the seed or children of adulterous seed, [that is, the seed or children of adulterers, or children of those that are given to adultery. So he calleth the Jews, because of their spiritual adultery, that is, their Idolatery; as may be gathered from the next following verses. See Ezek.ch.16. Christ likewise calleth the Jews an adulterous generation, Mat 22:29. because they often revolted from the true God and served the idols of the Gentiles] and ye that commit fornication."}],"4":[{"catchword":null,"tekst":"On whom do ye sport yourselves? [Or on whom have ye your will and pleasure? That is, by mocking of whom do ye take your pleasure and pastime? In these and the following words the Lord doth shew, how the idolatrous Jews carried themselves towards the Prophets of the Lord, when they preached the word of God unto them] at whom, [or against whom] do ye make a wide mouth? (and) put out the tongue a great way? [As if he had said, do ye not this to spite me? See Job 16:10. Psal.35.21.] are ye not children of transgression, [that is, wicked varlets, that have wholly given up yourselves to transgress?] a seed of falsehood? [That is, men addicted to falsehood; that is, to a false worship.]"}],"5":[{"catchword":null,"tekst":"That are hot [That is, ye go a whoring and commit Idolatry] in the yoke-groves, [wherein they committed Idolatry. See above chap.1.29. Others, ye are hot upon the Gods; that is, Idols] under all [or, every] green tree: [or leafy tree] slaying the children by the brooks, [Compare Eze 16:21,26 and 23.39. and 24.7. and compare further 2 Kings 16.3. and 2 Chron.28.3.] under the corners of the rocks. [Or, under the rocks that stick out]"}],"6":[{"catchword":null,"tekst":"By the smooth (stones) of the brooks is thy portion, [Others, by the smooth brook-stones is thy portion. Heb.by the smoothness&acirc;&euro;&trade;s (of the stones) of the brook is thy portion. That is, thou art diligent to chase out fair, smooth stones, to set up an Idol, or an altar to the honour of Idols. (is thy portion) That is, thou lovest it as well as if it were thy portion that is fallen to thee by lot. The contrary is, Psal.16.5. See the Annotat. There] they, they are thy lot: [or, thy portion] also thou pourest out a drink-offering unto them, [to wit, to the Idols, which thou settest up in those places. Or, in those (places) thou pourest, &c.] thou offerest meat-offering unto them: should I suffer my self to be comforted concerning these things? [The meaning is, Is it possible that I should forget the grief and sorrow that I have had, and still have, because of your Idolatry? It is spoken of God after the manner of men. See Gen 24:67. and 2 Sam.13.39. The question denieth and threateneth. As if he said, I will by no means forget your Idolatry, but I will sorely punish you for it. See above chap.1.24. Eze 5:13.]"}],"7":[{"catchword":null,"tekst":"Thou settest thy couch [That is, thy altars, or chappels, to commit spiritual whoredom there with Idols, as an harlot doth on the bed. See Eze 16:24.] upon the high and lofty mountain: also thither goest thou up, to offer slay-offering. [To wit, to the honour of Idols.]"}],"8":[{"catchword":null,"tekst":"And behind the door and posts dost thou set (up) thy memorial: [Heb. Thy remembrance. Some take these words thus, thou settest thy memorials behind the door; that is, every where in all the corners of your houses do ye set an Idolatrous Image, being a token of your abominable spiritual Idolatry. Others understand here by the memorials, or remembrance, the law of God, which ought not to be set behind the door, but God commandeth, that they should write it without upon their doors, or upon the posts of their doors, Deut.6.9. and 11.20.] for (departing) from me thou uncoverest thy self, [The meaning is, forsaking me thy lawful husband, thou uncoverest thy self, as an unchaste wife, unto others. He continueth still in the same allegory of spiritual whoredom, to wit, Idolatry] and goest up, [to wit, into an high tree, as vers.7. Others thou goest up to it, to wit, to thy bed, as vers.3. and understand the bed of spiritual fornication or whoredom] thou dost enlarge thy couch [that is, thou committal fornication with many Idols] and makest (a covenant with some) of them, [to wit, especially with some of the heathenish Idols, though thou art in love with them all. Others, and makest (a covenant) more then they: to wit, then the heathen, of whom thou hast learnt this. Others, and hewest thee down (trees) more then those. Thou hewest thee down (trees) to wit, to make room in the grove, for to set up Images and altars of Idols, or to make Idols of them. Compare above chap.44.14.] thou lovest their couch, [to wit, the couch of Idols. That is, thou committet Idolatry with delight] (in) every place [Heb. Hand, as above chap.56.5.] that thou seest. [Others, in the place that thou hast looked out for thy self.]"}],"9":[{"catchword":null,"tekst":"And thou goest to the King with oil, [That is, thou sendeth thine Ambassadors when thou art in trouble, to ask help. (with oil to the King) to wit, with precious, sweet, balsam-oil (as Hos 12:2.) for a present (as some conceive) to Tiglath-Pilneser, king of Assyria, 2 Kings 16.7.] and thou multiplies great store of this oil or ointment, to present the King abundantly therewith] and thou sendest thine Ambassadors far off, [to wit, into Assyria] and abasest thy self to hell. [That is, to the end that thou maist obtain help from him, thou humblest thy self before him, even unto hell; that is, in the lowest manner or degree, as Mat 11:23. It seemeth that the Prophet hath here respect to the words of King Ahaz, when he sent word to the King of Assyria, saying, I am thy servant, 2 Kings 16.7.]"}],"10":[{"catchword":null,"tekst":"Thou art wearied by thy great journey, (but) thou sayest not, It is without hope: [The meaning is, though thou hast made a long and tedious journey to Assyria, to seek for help there, yet thou art not frighted away by it. (by thy great journey) Into Assyria. Heb.in the greatness, or, multitude of thy way. (It is without hope) It is labour lost, or, It is desperate work; therefore I will let it alone] thou hast found the life of thine hand, [that is, which was able to keep thee alive, or to preserve thy strength and vigour. Others, thou hast found (that is, thou didst hope to have found) a band (or company or multitude) of thine hand; that is, thou conceives to have ready at hand, or at thy command; to wit, the Assyrians. Others, a strengthening of thine hand: that is, a comfort of help, whereby thine hand shall be strengthened. Others, the virtual of thine hand] therefore thou becomes not sick. [That is, thou growest not weary, faint; thou art not discouraged, thou faintest not in thy design or purpose. The meaning is, because thou hast found comfort by the Assyrians, and they do promise or strengthen thine hand with help and assistance, therefore it doth not repent thee that thou hast gone such a long journey, but thou art rather hardened and strengthened by it in thine Idolatry, and thou goest still to Assyria, to seek for help there.]"}],"11":[{"catchword":null,"tekst":"But of whom hast thou been afraid or feared? For thou hast lied, [The meaning is, when my Prophets do reprove thy sins, thou disownest them, and coverest them with lies. Compare below chap.59.13. Thou art not afraid nor fearest any man, yea not thy God himself, because he suffereth thee to go so long unpunished] and hast not remembered me, [that is, thou hast not thought on my vengeance, nor feared that I would punish thee for thy lies] thou hast not laid me to thine heart: is it not (because) I hold my peace, [that is, because I do not straightway punish thee, as soon as thou didst sin against me?] and that of old, [Heb. From eternity. See Job chap.22.on vers.15.] and thou fearest me not? [Others, have I not held my peace; or been quiet, suffered thee to go unpunished, for a long while together, and yet thou hast not feared me? Or thus, do I not also hold my peace of old, and wilt thou not fear me?"}],"12":[{"catchword":null,"tekst":"I will make thy righteousness known, and thy works, [That is, I will conceal them no longer. (thy righteousness &c.) That is, thy seeming holiness, thy hypocrisy, wherewith thou makest a shew as of good works, but indeed and in truth it is iniquity. For we must know, that this is spoken ironically, and in a deriding or scoffing manner: forasmuch as they would be esteemed and counted for true godly and righteous people, but were not so indeed and in truth] that they shall not profit thee. [Understand withal, but on the contrary they shall greatly hurt thee]"}],"13":[{"catchword":null,"tekst":"When thou shalt cry, [To wit, being in trouble and requiring help of me] then let those that are gathered of thee, deliver thee: [As if the LORD had said, I will not deliver you, let us see whether the Assyrian souldiers whom ye have gathered for your help, will be able to deliver you] but the wind shall carry them all away, vanity shall take them away: but he that putteth his trust in me, he shall inherit the earth, and possess mine holy mountain hereditarily. [That is, he shall be here on earth a member of my Church, and after this life inherit eternal life. Heb. The mountain of my holiness. Compare herewith above chap.2.2. and 56.7. and Psal.37.ver.9.]"}],"14":[{"catchword":null,"tekst":"And they shall say, Exalt (the path,) prepare the way: take the stumbling-block out of the way of my people. [And they shall say, etc. or, he shall say; to wit, the crier, or king Cyrus, who caused proclamation to be made that all the people should return to their own country, and that no man should hinder or prejudice them. See above chao.40.3. and below chap.62.10. whereby is further typified the redemption of Jesus Christ.]"}],"15":[{"catchword":null,"tekst":"For thus saith the high and lofty One that inhabiteth eternity, and whose Name is holy: I dwell (in) the high, and (in) the holy place, and with him that is of a bruised and humble spirit, [See Psal.34. the Annotat. On ver.19.] that I may revive the spirit of the humble, and that I may revive the heart of the bruised ones."}],"16":[{"catchword":null,"tekst":"For I will not contend forever, [Or, unto the end] neither will I be continually wroth: [Compare Psal.103.9.] for the spirit [that is, the heart, the mind of all men] would be overwhelmed from before my face, [when I should always contend with them, or should be at all times a like angry with them. See of the word to be overwhelmed, Psal.61.on ver.3. and Psal.102.on ver.1.] and the souls [to wit, would be overwhelmed, or fall into a swoon] (which) I have made."}],"17":[{"catchword":null,"tekst":"I was wroth for the iniquity of their covetousness, [Heb. Of his covetousness. So this 17.ver. and also the 18. And 19. Verses are continually put in the singular number] and smote them; I hid me, [that is, I withdrew my grace and help from them] and was wroth: yet they went on aversely in the way of their (own) heart. [That is, in the way which their own heart invented and devised]"}],"18":[{"catchword":null,"tekst":"I see their ways and I will heal them: [Others, (but) but when I beheld their ways, then I healed, or cured them. The meaning is, when I saw that they were wholly corrupted, and were not able to help themselves, then I helped them of meer grace and mercy] and I will lead them, and restore comforts unto them, namely to their mourners. [to wit, to those that are grieved because they have provoked me to anger.]"}],"19":[{"catchword":null,"tekst":"I create the fruit of the lips, Peace, Peace [That is, I will raise and produce much peace and joy, much comfort and thankfulness by the lips of my ministers that preach peace. Others, I create that which hath been brought forth, or, is brought forth by the lips] to them that are far off, and to them that are neer, [that is, to all the elect, whether they be Jews or Gentiles. See Eph 2:17.] saith the LORD, and I will heal them."}],"20":[{"catchword":null,"tekst":"But the wicked are like a sea that is driven on; [As the Sea, or great waters that are moved, stirred, & troubled by the mighty winds: So are the wicked driven on to all manner of wickedness, both by their own evil consciences, and by other wicked men] for that cannot rest, and her waters [Or, waves, or, billows] cast up [or forth] mire and dirt. [So the wicked cast up and bring forth all manner of filthiness and corruption out of their corrupt hearts and minds.]"}],"21":[{"catchword":null,"tekst":"The wicked have no peace, [To wit, no peace of conscience, or of mind. See Job chap.18.on ver.11.] saith my God. [See above chap.48.22.]"}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);

        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
