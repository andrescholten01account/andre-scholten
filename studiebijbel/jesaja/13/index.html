:"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"De last van Babel, die Jesaja, de zoon van Amoz, gezien heeft.","2":"Hef een banier op, op een hoge berg; verhef een stem tot hen; beweeg de hand omhoog, dat zij binnengaan door de deuren van de vorsten.","3":"Ik heb Mijn geheiligden bevel gegeven; ook heb Ik tot Mijn toorn geroepen Mijn helden, hen die zich verheugen in Mijn hoogheid.","4":"Er is een ruisende stem op de bergen, gelijk aan een groot volk; een stem van gedruis van de koninkrijken, van de verzamelde heidenvolken; de HEERE van de heerscharen[1] monstert het krijgsleger.","5":"Zij komen uit een ver land, van het einde van de hemel; de HEERE en de instrumenten van Zijn gramschap, om dat hele land te verderven.","6":"Huil, want de dag van de HEERE is nabij; hij komt als een verwoesting van de Almachtige.","7":"Daarom zullen alle handen slap worden, en het hart van elk mens zal versmelten;","8":"en zij zullen verschrikt worden, smarten en weeën zullen hen aangrijpen, zij zullen bang zijn als een barende vrouw; ieder zal over zijn naaste verbaasd zijn; hun gezichten zullen vlammende gezichten zijn.","9":"Zie, de dag van de HEERE komt, gruwelijk, met verbolgenheid en hevige toorn, om het land tot verwoesting te stellen, en de zondaars daaruit te verdelgen.","10":"Want de sterren van de hemel en zijn sterrenbeelden zullen hun licht niet laten schijnen; de zon zal verduisterd worden wanneer zij opgaat, en de maan zal haar licht niet laten schijnen.","11":"Want Ik zal over de wereld de boosheid bezoeken[2], en over de goddelozen hun ongerechtigheid; en Ik zal de hoogmoed van de trotsen doen ophouden, en de hovaardij van de tirannen zal Ik vernederen.","12":"Ik zal maken dat een man kostbaarder zal zijn dan zuiver goud, en een mens dan fijn goud van Ofir.","13":"Daarom zal Ik de hemel beroeren, en de aarde zal bewogen worden van haar plaats, vanwege de verbolgenheid van de HEERE van de heerscharen, en vanwege de dag van Zijn hevige toorn.","14":"En ieder zal zijn als een verjaagde ree, en als een schaap dat niemand bijeenbrengt; ieder zal naar zijn volk omzien, en ieder zal naar zijn land vluchten.","15":"Al wie gevonden wordt, zal doorstoken worden, en al wie daarbij gegrepen wordt, zal door het zwaard vallen.","16":"Ook zullen hun kinderen voor hun ogen verpletterd worden; hun huizen zullen geplunderd, en hun vrouwen geschonden worden.","17":"Zie, Ik zal de Meden tegen hen opwekken, die het zilver niet zullen achten, en aan het goud zullen zij geen lust hebben.","18":"Maar hun bogen zullen de jongemannen verpletteren, en zij zullen zich niet ontfermen over de vrucht van de buik; hun oog zal de kinderen niet ontzien.","19":"Zo zal Babel, het sieraad van de koninkrijken, de heerlijkheid, de hovaardigheid van de Chaldeeën, zijn zoals toen God Sodom en Gomorra omgekeerd heeft.","20":"Daar zal in eeuwigheid geen woonplaats zijn, en zij zal niet bewoond worden van geslacht tot geslacht; en de Arabier zal daar geen tent opzetten, en de herders zullen er niet legeren.","21":"Maar daar zullen de wilde dieren van de woestijnen neerliggen, en hun huizen zullen vervuld worden met angstaanjagende dieren, en daar zullen de jonge struisvogels wonen, en de bokachtige demonen zullen er springen.","22":"En wilde dieren van de eilanden zullen in zijn verlaten plaatsen elkaar toeroepen, alsook de draken in de weelderige paleizen; zijn tijd is immers nabij om te komen, en zijn dagen zullen niet verlengd worden."},"SV":{"1":"De last van Babel, dien Jesaja, de zoon van Amoz, gezien heeft.","2":"Heft op een banier, op een hogen berg; verheft een stem tot hen; beweegt de hand omhoog, dat zij intrekken door de deuren der prinsen.","3":"Ik heb aan Mijn geheiligden bevel gegeven; ook heb Ik tot Mijn toorn geroepen Mijn helden, de vrolijken Mijner hoogheid.","4":"Er is een ruisende stem op de bergen, gelijk eens groten volks; een stem van gedruis der koninkrijken, der verzamelde heidenen; de HEERE der heirscharen monstert het krijgsheir.","5":"Zij komen uit verren lande, van het einde des hemels; de HEERE en de instrumenten Zijner gramschap, om dat ganse land te verderven.","6":"Huilt gijlieden, want de dag des HEEREN is nabij; hij komt als een verwoesting van den Almachtige.","7":"Daarom zullen alle handen slap worden, en aller mensen hart zal versmelten;","8":"En zij zullen verschrikt worden, smarten en weeën zullen hen aangrijpen, zij zullen bang zijn als een barende vrouw; een iegelijk zal over zijn naaste verbaasd zijn; hun aangezichten zullen vlammende aangezichten zijn.","9":"Ziet, de dag des HEEREN komt, gruwelijk, met verbolgenheid en hittigen toorn, om het land te stellen tot verwoesting, en deszelfs zondaars daaruit te verdelgen.","10":"Want de sterren des hemels en zijn gesternten zullen haar licht niet laten lichten; de zon zal verduisterd worden, wanneer zij zal opgaan, en de maan zal haar licht niet laten schijnen.","11":"Want Ik zal over de wereld de boosheid bezoeken, en over de goddelozen hun ongerechtigheid; en Ik zal den hoogmoed der stouten doen ophouden, en de hovaardij der tirannen zal Ik vernederen.","12":"Ik zal maken, dat een man dierbaarder zal zijn dan dicht goud, en een mens dan fijn goud van Ofir.","13":"Daarom zal Ik den hemel beroeren, en de aarde zal bewogen worden van haar plaats, vanwege de verbolgenheid des HEEREN der heirscharen, en vanwege den dag Zijns hittigen toorns.","14":"En *een* *iegelijk* zal zijn als een verjaagde ree, en als een schaap, dat niemand vergadert; een iegelijk zal naar zijn volk omzien, en een iegelijk zal naar zijn land vluchten.","15":"Al wie gevonden wordt, zal doorstoken worden, en al wie daarbij gevoegd is, zal door het zwaard vallen.","16":"Ook zullen hun kinderkens voor hun ogen verpletterd worden; hun huizen zullen geplunderd, en hun vrouwen geschonden worden .","17":"Ziet, Ik zal de Meden tegen hen verwekken, die het zilver niet zullen achten, en aan het goud zullen zij geen lust hebben.","18":"Maar *hun* bogen zullen de jongelingen verpletteren, en zij zullen zich niet ontfermen over de vrucht des buiks; hun oog zal de kinderen niet verschonen.","19":"Alzo zal Babel, het sieraad der koninkrijken, de heerlijkheid, de hovaardigheid der Chaldeen, zijn gelijk als God Sodom en Gomorra omgekeerd heeft.","20":"Daar zal geen woonplaats zijn in der eeuwigheid, en zij zal niet bewoond worden van geslacht tot geslacht; en de Arabiër zal daar geen tent spannen, en de herders zullen er niet legeren.","21":"Maar daar zullen nederliggen de wilde dieren der woestijnen, en hun huizen zullen vervuld worden met schrikkelijke gedierten, en daar zullen de jonge struisen wonen, en de duivelen zullen er huppelen.","22":"En wilde dieren der eilanden zullen in zijn verlaten plaatsen elkander toeroepen, mitsgaders de draken in de wellustige paleizen; hun tijd toch is nabij om te komen, en hun dagen zullen niet vertogen worden."},"KJV":{"1":"The burden of Babylon, which Isaiah the son of Amoz did see.","2":"Lift ye up a banner upon the high mountain, exalt the voice unto them, shake the hand, that they may go into the gates of the nobles.","3":"I have commanded my sanctified ones, I have also called my mighty ones for mine anger, *even* them that rejoice in my highness.","4":"The noise of a multitude in the mountains, like as of a great people; a tumultuous noise of the kingdoms of nations gathered together: the LORD of hosts mustereth the host of the battle.","5":"They come from a far country, from the end of heaven, *even* the LORD, and the weapons of his indignation, to destroy the whole land.","6":"Howl ye; for the day of the LORD *is* at hand; it shall come as a destruction from the Almighty.","7":"Therefore shall all hands be faint, and every man's heart shall melt:","8":"And they shall be afraid: pangs and sorrows shall take hold of them; they shall be in pain as a woman that travaileth: they shall be amazed one at another; their faces *shall be as* flames.","9":"Behold, the day of the LORD cometh, cruel both with wrath and fierce anger, to lay the land desolate: and he shall destroy the sinners","10":"For the stars of heaven and the constellations thereof shall not give their light: the sun shall be darkened in his going forth, and the moon shall not cause her light to shine.","11":"And I will punish the world for *their* evil, and the wicked for their iniquity; and I will cause the arrogancy of the proud to cease, and will lay low the haughtiness of the terrible.","12":"I will make a man more precious than fine gold; even a man than the golden wedge of Ophir.","13":"Therefore I will shake the heavens, and the earth shall remove out of her place, in the wrath of the LORD of hosts, and in the day of his fierce anger.","14":"And it shall be as the chased roe, and as a sheep that no man taketh up: they shall every man turn to his own people, and flee every one into his own land.","15":"Every one that is found shall be thrust through; and every one that is joined *unto them* shall fall by the sword.","16":"Their children also shall be dashed to pieces before their eyes; their houses shall be spoiled, and their wives ravished.","17":"Behold, I will stir up the Medes against them, which shall not regard silver; and *as for* gold, they shall not delight","18":"*Their* bows also shall dash the young men to pieces; and they shall have no pity on the fruit of the womb; their eye shall not spare children.","19":"And Babylon, the glory of kingdoms, the beauty of the Chaldees' excellency, shall be as when God overthrew Sodom and Gomorrah.","20":"It shall never be inhabited, neither shall it be dwelt in from generation to generation: neither shall the Arabian pitch tent there; neither shall the shepherds make their fold","21":"But wild beasts of the desert shall lie there; and their houses shall be full of doleful creatures; and owls shall dwell there, and satyrs shall dance","22":"And the wild beasts of the islands shall cry in their desolate houses, and dragons in *their* pleasant palaces: and her time *is* near to come, and her days shall not be prolonged."}},"tsk":{"1":[{"kopje":"last","refs":["Jes 14:28","Jes 15:1","Jes 17:1","Jes 19:1","Jes 21:1","Jes 21:11","Jes 21:13","Jes 22:1","Jes 22:25","Jes 23:1","Jer 23:33-38","Ezech 12:10","Nahum 1:1","Hab 1:1","Zach 9:1","Zach 12:1","Mal 1:1"]},{"kopje":"van Babel","refs":["Jes 14:4-23","Jes 21:1-10","Jes 43:14","Jes 44:1","Jes 44:2","Jes 47:1-15","Jer 25:12-26","Jer 50:1","Jer 51:23","Dan 5:28","Dan 6:29","Openb 17:1","Openb 18:24"]},{"kopje":"die Jesaja","refs":["Jes 1:1"]}],"2":[{"kopje":"Hef op","refs":["Jes 5:26","Jes 11:12","Jes 18:3","Jer 50:2","Jer 51:27","Jer 51:28"]},{"kopje":"op een hoge","refs":["Jer 51:25"]},{"kopje":"beweeg","refs":["Jes 10:32","Jes 11:15"]},{"kopje":"binnengaan","refs":["Jes 45:1-3","Jer 51:58"]}],"3":[{"kopje":"bevel gegeven","refs":["Jes 23:11","Jes 44:27","Jes 44:28","Jes 45:4","Jes 45:5","Jer 50:21-46"]},{"kopje":"helden","refs":["Jer 51:20-24","Joël 3:11","Openb 17:12-18"]},{"kopje":"hen die zich","refs":["Ezra 1:1-11","Ezra 6:1-22","Ezra 7:12-26","Ps 149:2","Ps 149:5-9","Openb 18:4-8","Openb 18:20-24","Openb 19:1-7"]}],"4":[{"kopje":"ruisende stem","refs":["Jes 22:1-9","Jer 50:2","Jer 50:3","Jer 50:21-46","Jer 51:11","Jer 51:27","Jer 51:28","Ezech 38:3-23","Joël 3:14","Zach 14:1-3","Zach 14:13","Zach 14:14","Openb 19:11-21"]},{"kopje":"gelijk aan","refs":["Joël 2:4-11","Openb 9:7-19"]},{"kopje":"de HEERE","refs":["Jes 10:5","Jes 10:6","Jes 45:1","Jes 45:2","Jer 50:14","Jer 50:15","Jer 51:6-25","Joël 2:1-11","Joël 2:25","Openb 18:8"]}],"5":[{"kopje":"uit een ver","refs":["Jes 13:17","Jer 50:3","Jer 50:9","Jer 51:11","Jer 51: "wl wl-kjv\" data-code=\"H990\">womb;</span> their <span class=\"wl wl-kjv\" data-code=\"H5869\">eye</span> shall not <span class=\"wl wl-kjv\" data-code=\"H2347\">spare</span> children.","19":"And <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> the <span class=\"wl wl-kjv\" data-code=\"H6643\">glory</span> of <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdoms,</span> the <span class=\"wl wl-kjv\" data-code=\"H8597\">beauty</span> of the <span class=\"wl wl-kjv\" data-code=\"H3778\">Chaldees'</span> <span class=\"wl wl-kjv\" data-code=\"H1347\">excellency,</span> shall be as when <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H4114\">overthrew</span> <span class=\"wl wl-kjv\" data-code=\"H5467\">Sodom</span> and Gomorrah.","20":"It shall <span class=\"wl wl-kjv\" data-code=\"H5331\">never</span> be <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabited,</span> neither shall it be <span class=\"wl wl-kjv\" data-code=\"H7931\">dwelt</span> in from <span class=\"wl wl-kjv\" data-code=\"H1755\">generation</span> to <span class=\"wl wl-kjv\" data-code=\"H1755\">generation:</span> neither shall the <span class=\"wl wl-kjv\" data-code=\"H6163\">Arabian</span> pitch <span class=\"wl wl-kjv\" data-code=\"H167\">tent</span> there; neither shall the <span class=\"wl wl-kjv\" data-code=\"H7462\">shepherds</span> make their fold","21":"But wild beasts of the <span class=\"wl wl-kjv\" data-code=\"H6728\">desert</span> shall <span class=\"wl wl-kjv\" data-code=\"H7257\">lie</span> there; and their <span class=\"wl wl-kjv\" data-code=\"H1004\">houses</span> shall be <span class=\"wl wl-kjv\" data-code=\"H4390\">full</span> of doleful <span class=\"wl wl-kjv\" data-code=\"H255\">creatures;</span> and <span class=\"wl wl-kjv\" data-code=\"H1323\">owls</span> shall <span class=\"wl wl-kjv\" data-code=\"H7931\">dwell</span> there, and <span class=\"wl wl-kjv\" data-code=\"H8163\">satyrs</span> shall dance","22":"And the wild beasts of the <span class=\"wl wl-kjv\" data-code=\"H338\">islands</span> shall <span class=\"wl wl-kjv\" data-code=\"H6030\">cry</span> in their desolate <span class=\"wl wl-kjv\" data-code=\"H490\">houses,</span> and <span class=\"wl wl-kjv\" data-code=\"H8577\">dragons</span> in their <span class=\"wl wl-kjv\" data-code=\"H6027\">pleasant</span> <span class=\"wl wl-kjv\" data-code=\"H1964\">palaces:</span> and her <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> is <span class=\"wl wl-kjv\" data-code=\"H7138\">near</span> to <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> and her <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> shall not be prolonged."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"last","tekst":"Dit is de titel van alle bezwaarlijke dreigprofetieën; het is als een ontzegsbrief, welken de Heere door zijn profeet is zendende. Zie de aantekening 2Ki 9:25 . En dit dreigement gaat niet alleen den koning te Babel aan, maar ook de stad Babel en het gehele koninkrijk."},{"catchword":"dien Jesája,","tekst":"Dat is, dien God hem in een gezicht geopenbaard heeft."}],"2":[{"catchword":"Heft op","tekst":"Hier spreekt God den koning der Perzen en der Meden aan, hem vermanende, dat hij zich ten oorlog zou bereiden, tegen de Babyloniërs."},{"catchword":"een banier,","tekst":"Te weten tot een teken dat zich het krijgsvolk verzamele."},{"catchword":"verheft","tekst":"Dat is, roept met luider stem de krijgslieden, die nabij wonen."},{"catchword":"beweegt","tekst":"Te weten om een leger uit verre landen aan te lokken en te verzamelen."},{"catchword":"zij","tekst":"Te weten de verzamelde krijgslieden der Perzen en Meden."},{"catchword":"intrekken","tekst":"Te weten in de stad Babel."},{"catchword":"der prinsen","tekst":"Te weten de prinsen of vorsten te Babel. Aldus noemt de profeet de Babyloniërs, omdat velen hunner van den roof hunner naburen en der voortreffelijke neringen machtig en rijk geworden waren, ja als prinsen en vorsten; alsook omdat zij te dien tijde over vele koninkrijken en landen heersten. Zie Isa 10:8 ."}],"3":[{"catchword":"Ik heb","tekst":"Te weten, Ik de Heere."},{"catchword":"aan","tekst":"Versta hier de Perzen en Meden, die God had geheiligd; dat is, tot een heilig werk geordineerd, namelijk tot verdelging der goddeloze Babyloniërs. Zie Jer 22:7 ."},{"catchword":"bevel gegeven;","tekst":"Niet door een uiterlijke stem, maar door een inwendige beweging, in de harten der Perzen en Meden, door mijne regering de zaak tot mijn eer besturende. Zie 2Sa 16:11 ; Isa 23:11 ."},{"catchword":"tot","tekst":"Dat is, tot uitvoering mijns toorns."},{"catchword":"Mijn helden,","tekst":"Dat is, de Perzen en Meden, wien Ik sterkte en kloekmoedigheid gegeven heb en nog verder geven zal."},{"catchword":"de vrolijken","tekst":"Dat is, welken Ik een dapperen en vrolijken moed en courage gegeven heb, om de Babyloniërs aan te tasten. Maar hoe de goddelozen dit doen, zie Isa 10:6-7 ."}],"4":[{"catchword":"er is","tekst":"Hier spreekt de profeet wederom. Anders: daar is een stem der menigte, of der veelheid; want het Hebreeuwse woord betekent zulks beide."},{"catchword":"op de bergen,","tekst":"Te weten op de bergen in Medië."},{"catchword":"gelijk","tekst":"Hebreeuws, de gelijkenis van een groot volk."},{"catchword":"een stem","tekst":"De zin is: Daar is zulk rumoer, alsof al de koninkrijken der heidenen zich vergaderden en samenliepen."},{"catchword":"monstert","tekst":"Als zijnde veldoverste, of generaal."}],"5":[{"catchword":"uit verren lande,","tekst":"Te weten uit Perzië, hetwelk van Babel gelegen is omtrent 225 Duitse mijlen, gelijk enigen schrijven."},{"catchword":"van het einde","tekst":"Anders: van het uiterste des hemels; dat is van de wijdgelegen landen."},{"catchword":"de instrumenten","tekst":"Of, de wapenen, die hij in zijnen toorn gebruiken wil om het land der Chaldeën en van Babylonië, mitsgaders die ganse monarchie te verderven; zie Jer 50:25 ."}],"6":[{"catchword":"gijlieden,","tekst":"Te weten, o gij Babyloniërs, met al uwe aanhangers."},{"catchword":"de dag","tekst":"Dat is, de dag, in welken de Heere zijn gestreng gericht over Babylon zal uitoefenen; gelijk Isa 2:12 , en Isa 61:2 ; Joe 1:15 . Zie Job 24:1 , en Psa 37:13 ."},{"catchword":"hij komt","tekst":"Alsof hij zeide: Het zal zulks een verschrikkelijke verwoesting zijn, dat het genoegzaam blijken zal dat ze van de hand van den almachtigen God komende is."}],"7":[{"catchword":"Daarom","tekst":"Te weten omdat het verderf zo verschrikkelijk en zo groot is."},{"catchword":"alle handen","tekst":"Te weten alle handen der Babyloniërs."},{"catchword":"aller mensen hart","tekst":"Hebreeuws, al het hart eens mensen."},{"catchword":"zal versmelten;","tekst":"Te weten van angst, schrik en vrees."}],"8":[{"catchword":"zij zullen","tekst":"Te weten de Babyloniërs en hunne aanhangers."},{"catchword":"een iegelijk","tekst":"Of, de een zal zich over, of met den anderen verwonderen."},{"catchword":"hun aangezichten","tekst":"Dat is, hunne aangezichten zullen zo rood zijn als vuur, te weten van schaamte, namelijk omdat zij, die tevoren zulke helden geweest zijn, die over de gehele wereld hebben willen heersen, van de Perzen en Meden, die tevoren zozeer niet geacht waren, zouden overheerd en verslagen worden. Doch anderen verstaan dit alzo, dat de aangezichten der Perzen en der Meden als vuurvlammen zouden zijn, dat is vol toorn en gramschap, dorstende naar het bloed der Babyloniërs, hetwelk de roodheid hunner aangezichten zou te kennen geven."}],"9":[{"catchword":"de dag","tekst":"Zie vs.6."},{"catchword":"hittigen toorn,","tekst":"Hebreeuws, hittigheid des toorns."},{"catchword":"het land","tekst":"Te weten het land van Babylonië."},{"catchword":"te stellen","tekst":"Dat is, om het land te verwoesten en ellendig te maken."},{"catchword":"deszelfs","tekst":"Dat is, de zondaars die daarin zijn."}],"10":[{"catchword":"de sterren","tekst":"De zin is: Het zal de Babyloniërs alles tegen zijn, zodat zelfs de sterren des hemels haar schijnsel hun zullen onttrekken. Deze manier van spreken gebruiken de profeten, om daardoor te betekenen grote ellenden. Zie Eze 32:7 ; Joe 2:31 , en Joe 3:15 ."},{"catchword":"gesternten","tekst":"Door ster wordt verstaan een enige ster, door gesternte verscheidene sterren bij elkander. Anders: Orion. Zie Job 9:9 ."},{"catchword":"wanneer zij","tekst":"Hebreeuws, als zij uitgaat; te weten uit hare slaapkamer; Psa 19:6 ."}],"11":[{"catchword":"Ik zal","tekst":"Hier spreekt de Heere wedeRom."},{"catchword":"wereld","tekst":"Versta hier door de wereld de landen, die onder de gehoorzaamheid van den koning van Babel stonden, welker vele waren. Zie Dan 4:17 , enz."},{"catchword":"bezoeken,","tekst":"Dat is, straffen."}],"12":[{"catchword":"dierbaarder","tekst":"De zin is: Ik zal maken dat der Babyloniërs weinig zullen worden, want van hen zullen velen verslagen worden. Vergelijk 1Sa 3:1 ."},{"catchword":"dicht goud,","tekst":"Zie 1Ki 10:18 ."},{"catchword":"Ofir","tekst":"Zie de aantekening 1Ki 9:28 ."}],"13":[{"catchword":"Daarom","tekst":"Te weten vanwege den hoogmoed en de goddeloosheid der Babyloniërs, vs.11."},{"catchword":"den hemel","tekst":"De zin is: Ik zal zo schrikkelijke straffen over de Chaldeën en Babyloniërs laten komen, dat met reden hemel en aarde zich daarover ontzetten zullen; of dat de Babyloniërs zullen menen dat hemel en aarde bewogen worden."},{"catchword":"den dag","tekst":"Zie de aantekening op Job 20:28 ."}],"14":[{"catchword":"als een schaap,","tekst":"Of, als een kudde schapen, die niemand vergadert."},{"catchword":"een iegelijk","tekst":"Te weten die uit verre landen gekomen is, gehuurd zijnde tot hulp der Babyloniërs."},{"catchword":"zal naar zijn volk","tekst":"Dat is, zal wensen weder in zijn vaderland te zijn, gelijk er straks volgt."}],"15":[{"catchword":"gevonden wordt,","tekst":"Te weten te Babel, of van de Babyloniërs. De zin is: Wie de soldaten der Perzen en Meden vinden zullen, die zullen zij doden, n gronde zal afgebroken zijn."},{"catchword":"de Arabier","tekst":"De Arabieren plachten geen vaste woonplaats en blijvende stad te hebben, maar hier en daar te wandelen en in hutten te wonen, zich nederslaande waar zij het beste voeder vonden voor hunne beesten. Dezen, ziende en bevindende dat het land omtrent Babylon zo verwoest en zo ellendig is, dat er geen voedsel genoeg voor hun vee te vinden is, zullen het mijden."}],"21":[{"catchword":"de wilde dieren","tekst":"Het Hebreeuwse woord betekent eigenlijk wildernissen, en hier zodanige dieren, die in de wildernissen of in dorre woeste plaatsen zich ophouden. Zie Jer 50:39 ."},{"catchword":"met schrikkelijke","tekst":"Of, schadelijke dieren. Het Hebreeuwse woord betekent zulke dieren, die de mensen ach en wee doen roepen van bangheid. Anders: dieren die een droevig geluid maken."},{"catchword":"de jonge","tekst":"Hebreeuws, de dochters der struisen. Zie de aantekening Lev 11:16 , en Job 30:29 ."},{"catchword":"de duivelen","tekst":"Zie Lev 17:7 , alsook 2Ch 11:15 ; Rev 18:2 ."}],"22":[{"catchword":"wilde dieren","tekst":"Het Hebreeuwse woord heeft zijnen naam van eilanden, maar wat het eigenlijk voor dieren geweest zijn, is onzeker. Sommigen hebben hier [vogels] uit de eilanden; anders: wilde dieren uit de eilanden; anderen meerkatten, of wilde katten; anderen uilen, omdat die gaarne in woeste, verlaten, vervallen huizen en plaatsen zich ophouden. Dit woord is ook Jer 50:39 ."},{"catchword":"in zijn","tekst":"Te weten, van den koning van Babel."},{"catchword":"verlaten","tekst":"Of, weduwlijke; dat is, verlaten of ledige plaatsen, of, gelijk enige paleizen, door verwisseling van de letter res in de letter lamed; gelijk het is Isa 34:13 ."},{"catchword":"elkander","tekst":"Of, elkander toeschreeuwen. Hebreeuws, antwoorden."},{"catchword":"haar tijd","tekst":"Te weten, de tijd van de stad Babel. En versta hier dien tijd, in welken het verderf der stad en van het rijk van Babylon beginnen zou, alsook het begin van de h as a desolation from the Almighty. [As if he had said, it shall be such a fearful desolation, as that it shall sufficiently appear, that it cometh from the hand of almighty God.]"}],"7":[{"catchword":null,"tekst":"Therefore [To wit, because this destruction is so terrible, and so great] shall all hands [to wit, the hands of the Babylonians] be slack, and the heart of all men [Hebr. All the heart of a man] shall melt. [To wit, through anguish, dread, and fear]"}],"8":[{"catchword":null,"tekst":"And they [To wit, the Babylonians, and their adherents,] shall be afraid, pangs and sorrows shall take hold of them, and they shall be in pain as a woman in travel: every one shall be amazed at his neighbour, [or, one shall wonder at, or with another] their faces shall be flaming faces. [that is, their faces shall be as red as fire; to wit, through shame, namely, because they who were formerly such stout champions, that would bear rule over the whole world, were now conquered and beaten by the Persians and Medes, who in times past were of little or no repute and estimation. But others understand this thus, that the faces of the Persians and Medes should be as flames of fire; that is, full of wrath and indignation, thirsting after the blood of the Babylonians, which the redness of their faces should bewray.]"}],"9":[{"catchword":null,"tekst":"Behold, the day of the LORD [See above vers.6.] cometh, horrible, with indignation and hot anger: [Heb. Heat of anger] to make the land [To wit, the land of Babylon] a desolation [That is, to lay the land waste and desolate] and to destroy the sinners thereof [That is, the sinners that are in it] out of it."}],"10":[{"catchword":null,"tekst":"For the stars of heaven, and the constellations thereof shall not cause their light to shine: the Sun shall be darkened, when he shall rise, [Hebr. When he shall go forth; to wit, out of his bed-chamber, Psal.19.6.] and the Moon shall not cause her light to shine. [The meaning is, all things shall be against the Babylonians, so that they very stars of heaven shall withdraw their shining from them. This phrase the prophet doth often use, for to express thereby great troubles and miseries. See Ezech.32.7. Joel 2.21. and 3.15. also Mat 24:29. Mic 13:24. Luk 21:25. By the word star, is meant one star alone; and by the word constellation, divers stars united or joined together. Oth. Orion. See Job chap.9.on vers.9.]"}],"11":[{"catchword":null,"tekst":"For I will visit [That is, punish] the wickedness upon the World, [Here the Lord speaketh again. Understand here by World, the Land or Countries that were under the obedience and subjection of the King of Babel, whereof there were many. See Dan.4.17, etc.] and their iniquity upon the wicked: and I will cause the arrogancy of the proud to cease, and I will bring down the pride of tyrants."}],"12":[{"catchword":null,"tekst":"I will make a man to be more precious, then massy gold: [The meaning is I will make the Babylonians to be few, for many of them shall be slain. Compare 1 Sam.3.on vers.1. See of Masty gold, 1 Kings 10.on v.18.] and a man (more precious) then fine gold of Ophir. [Of Ophir, see the annotate. 1 Kings 9.on vers.28.]"}],"13":[{"catchword":null,"tekst":"Therefore [To wit, for the pride and wickedness of the Babylonians, vers.11.] I will shake the heaven, and the earth shall be moved out of her place, because of the indignation of the LORD of Hosts, and because of the day of his hot anger. [See Job chap.20. the annotate. On vers.28. The meaning is, I will cause such fearful judgements to light upon the Chaldeans and the Babylonians, that heaven and earth shall have cause to be amazed at it: or, that the Babylonians shall think that heaven and earth are moved or shaken.]"}],"14":[{"catchword":null,"tekst":"And (every one) shall be as a chased roe, and as a sheep that no man gatheredth, [Or, as a flock of sheep which no man gathereth] every man [To wit, that is come out of far Countries, being hired to help const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"

const _vertParam = new URLSearchParams(location.search).get('vert');
if (_vertParam && D.vertalingen[_vertParam]) vertaling = _vertParam;

const popup = document.getElementById('popup');

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
function kopieerVers(n) {
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n})`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
}
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  kopieerVers(k.dataset.n);
});
// rechtermuisklik op een vers kopieert het (in plaats van het browser-contextmenu)
document.addEventListener('contextmenu', e => {
  const rij = e.target.closest('.vers');
  if (!rij || !rij.id.startsWith('v')) return;
  const n = rij.id.slice(1);
  if (!D.vertalingen.SVnu[n]) return;
  e.preventDefault();
  kopieerVers(n);
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
