:"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"In die tijd stuurde Merodach-Baladan, de zoon van Baladan, de koning van Babel, brieven en een geschenk aan Hizkia; want hij had gehoord dat hij ziek was geweest en weer sterk geworden was.","2":"En Hizkia verblijdde zich over hen, en hij toonde hun zijn schathuis, het zilver en het goud, de specerijen en de beste olie, en zijn hele wapenhuis, en alles wat gevonden werd in zijn schatten; er was geen ding in zijn huis, of in zijn hele heerschappij, dat Hizkia hun niet toonde.","3":"Toen kwam de profeet Jesaja bij koning Hizkia, en zei tegen hem: Wat hebben die mannen gezegd, en waar kwamen zij vandaan bij u? En Hizkia zei: Zij zijn uit een ver land bij mij gekomen, uit Babel.","4":"En hij zei: Wat hebben zij gezien in uw huis? En Hizkia zei: Zij hebben alles gezien wat in mijn huis is; er is geen ding in mijn schatten dat ik hun niet getoond heb.","5":"Toen zei Jesaja tegen Hizkia: Hoor het woord van de HEERE van de heerscharen[1].","6":"Zie, de dagen komen dat alles wat in uw huis is, en wat uw vaders tot op deze dag als schat hebben opgelegd, naar Babel weggevoerd zal worden; er zal niets overblijven, zegt de HEERE.","7":"Daarbij zullen zij van uw zonen die uit u zullen voortkomen, die u zult verwekken, meenemen, om hovelingen te zijn in het paleis van de koning van Babel.","8":"Maar Hizkia zei tegen Jesaja: Het woord van de HEERE dat u gesproken hebt, is goed. Ook zei hij: Er zal immers* vrede en waarheid zijn in mijn dagen!"},"SV":{"1":"Te dien tijd zond Merodach Baladan, de zoon van Baladan, de koning van Babel, brieven en een geschenk aan Hizkia; want hij had gehoord dat hij krank geweest en *weder* sterk geworden was.","2":"En Hizkia verblijdde zich over hen, en hij toonde hun zijn schathuis, het zilver, en het goud, en de specerijen, en de beste olie, en zijn ganse wapenhuis, en al wat gevonden werd in zijn schatten; er was geen ding in zijn huis, noch in zijn ganse heerschappij, dat Hizkia hun niet toonde.","3":"Toen kwam de profeet Jesaja tot den koning Hizkia, en zeide tot hem: Wat hebben die mannen gezegd, en van waar zijn zij tot u gekomen? En Hizkia zeide: Zij zijn uit verren lande tot mij gekomen, uit Babel.","4":"En hij zeide: Wat hebben zij gezien in uw huis? En Hizkia zeide: Zij hebben alles gezien, wat in mijn huis is; geen ding is er in mijn schatten, dat ik hun niet getoond heb.","5":"Toen zeide Jesaja tot Hizkia: Hoor het woord des HEEREN der heirscharen.","6":"Zie, de dagen komen, dat al wat in uw huis is, en wat uw vaders opgelegd hebben tot een schat tot op dezen dag, naar Babel weggevoerd zal worden; er zal niets overgelaten worden, zegt de HEERE.","7":"Daartoe zullen zij van uw zonen, die uit u zullen voortkomen, die gij gewinnen zult, nemen, dat zij hovelingen zijn in het paleis des konings van Babel.","8":"Maar Hizkia zeide tot Jesaja: Het woord des HEEREN, dat gij gesproken hebt, is goed. Ook zeide hij: Doch het zij vrede en waarheid in mijn dagen!"},"KJV":{"1":"At that time Merodachbaladan, the son of Baladan, king of Babylon, sent letters and a present to Hezekiah: for he had heard that he had been sick, and was recovered.","2":"And Hezekiah was glad of them, and shewed them the house of his precious things, the silver, and the gold, and the spices, and the precious ointment, and all the house of his armour, and all that was found in his treasures: there was nothing in his house, nor in all his dominion, that Hezekiah shewed","3":"Then came Isaiah the prophet unto king Hezekiah, and said unto him, What said these men? and from whence came they unto thee? And Hezekiah said, They are come from a far country unto me, *even* from Babylon.","4":"Then said he, What have they seen in thine house? And Hezekiah answered, All that *is* in mine house have they seen: there is nothing among my treasures that I have not shewed","5":"Then said Isaiah to Hezekiah, Hear the word of the LORD of hosts:","6":"Behold, the days come, that all that *is* in thine house, and *that* which thy fathers have laid up in store until this day, shall be carried to Babylon: nothing shall be left, saith the LORD.","7":"And of thy sons that shall issue from thee, which thou shalt beget, shall they take away; and they shall be eunuchs in the palace of the king of Babylon.","8":"Then said Hezekiah to Isaiah, Good *is* the word of the LORD which thou hast spoken. He said moreover, For there shall be peace and truth in my days."}},"tsk":{"1":[{"kopje":"Merodach-Baladan","refs":["2 Kon 20:12-19"]},{"kopje":"koning","refs":["Jes 13:1","Jes 13:19","Jes 14:4","Jes 23:13"]},{"kopje":"stuurde brieven","refs":["2 Sam 8:10","2 Sam 10:2","2 Kron 32:23"]}],"2":[{"kopje":"verblijdde zich","refs":["2 Kron 32:25","2 Kron 32:31","Job 31:25","Ps 146:3","Ps 146:4","Spr 4:23","Jer 17:9"]},{"kopje":"toonde","refs":["2 Kon 20:13","2 Kron 32:27"]},{"kopje":"beste olie","refs":["1 Kon 10:2","1 Kon 10:10","1 Kon 10:15","1 Kon 10:25","2 Kron 9:1","2 Kron 9:9"]},{"kopje":"er was","refs":["Pred 7:20","2 Kor 12:7","1 Joh 1:8"]}],"3":[{"kopje":"kwam de profeet Jesaja","refs":["Jes 38:1","Jes 38:5","2 Sam 12:1","2 Kon 20:14","2 Kon 20:15","2 Kron 16:7","2 Kron 19:2","2 Kron 25:15","Jer 22:1","Jer 22:2"]},{"kopje":"Zij zijn","refs":["Deut 28:49","Joz 9:6","Joz 9:9","Jer 5:15"]}],"4":[{"kopje":"alles gezien","refs":["Joz 7:19","Job 31:33","Spr 23:5","Spr 28:13","1 Joh 1:9"]}],"5":[{"kopje":"Hoor","refs":["1 Sam 13:13","1 Sam 13:14","1 Sam 15:16"]}],"6":[{"kopje":"dat alles","refs":["2 Kon 20:17-19","2 Kon 24:13","2 Kon 25:13-15","2 Kron 36:10","2 Kron 36:18","Jer 20:5","Jer 27:21","Jer 27:22","Jer 52:17-19","Dan 1:2"]}],"7":[{"ko i 20:12 genoemd Berodach, of Brodach."}],"2":[{"catchword":"zijn schathuis,","tekst":"2Ki 20:13 staat: zijn ganse schathuis."}],"3":[{"catchword":"Wat hebben die mannen","tekst":"Door het ingeven des Heeren wist de profeet wel wat die mannen gezegd hadden; maar hij vraag het om uit Hizkia's eigen mond dat te horen en daaruit gelegenheid te hebben om het woord des Heeren hem aan te zeggen. Aldus heeft ook de profeet Nathan met David gehandeld; 2Sa 12:1 ."}],"7":[{"catchword":"hovelingen","tekst":"Hebreeuws, gesnedenen; zie de aantekening Gen 37:36 ."}],"8":[{"catchword":"waarheid","tekst":"Of, vaste welstand, of trouw; dat is vaste bestendige vrede."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"At that time Merodach Baladan [2 Kings 20.12. He is called Berodach, or Bredach] the son of Baladan, King of Babel, sent letters and a present to Hezekiah: for he had heard, that he had been sick, and was (again) grown strong. [This history is here brought in from 2 Kings 20.ver.12.]"}],"2":[{"catchword":null,"tekst":"And Hezekiah was glad of them, and he shewed them the house of his treasures. [It is said 2 Kings 20.12. all the house of his treasures.] the silver, and the gold, and the spices, and the best oil, and all the house of his armour, and all that was found in his treasures: there was nothing is his house, your in all his dominion, that Hezekiah shewed them not."}],"3":[{"catchword":null,"tekst":"Then came Isaiah the prophet unto King Hezekiah, and said unto him, what said those men? [By the inspiration of God the Prophet knew well enough what those men had said. But he asketh it that he might hear it from Hezekiahs own mouth, and from thence take occasion declare the word of the Lord unto him. Thus did Nathan likewise deal with David 2 Sam.12.1.] and from whence are they come unto thee? And Hezekiah said, they are come from a far land unto me, from Babel."}],"4":[{"catchword":null,"tekst":"And he said, what they seen in thine house? And Hezekiah said, all function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');

}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;

const concordCache = {};
async function haalConcord(map, cache, code) {

document.addEventListener('click', e => {

  if (chip) {

    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {

      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');

});

  const sleutel = slug + '/' + hfd;

  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];

function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));

    return `<div class="popup-vers">${nr}${t}</div>`;

  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url}) (SVnu)`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
