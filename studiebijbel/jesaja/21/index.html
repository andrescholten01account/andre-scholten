l":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"De last die rust op de woestijn aan de zee. Zoals wervelwinden in het zuiden voorbijtrekken, zo komt het uit de woestijn, uit een schrikwekkend land.","2":"Een hard visioen is mij bekendgemaakt: die trouweloze handelt trouweloos, en die verwoester verwoest; trek op, o Elam! beleger het, o Media! Ik heb al haar gezucht doen ophouden.","3":"Daarom zijn mijn lendenen vol grote pijn, weeën hebben mij aangegrepen, zoals de weeën van een barende vrouw; ik krom mij van wat ik hoor, ik word ontsteld van wat ik zie.","4":"Mijn hart bonst, huivering verschrikt mij; de schemering waar ik naar verlangd heb, die maakt Hij voor mij tot beving.","5":"Bereid de tafel, houd de wacht, wachter! Eet, drink; maak u op, vorsten, bestrijk het schild!","6":"Want zo heeft de Heere tegen mij gezegd: Ga heen, zet een wachter uit, laat hij aanzeggen wat hij ziet.","7":"En hij zag een wagen, een span ruiters, een wagen met ezels, een wagen met kamelen; en hij lette zeer nauwkeurig op, met grote oplettendheid.","8":"En hij riep: Een leeuw, Heere! Ik sta voortdurend op de wachttoren, overdag, en op mijn post sta ik hele nachten.","9":"En zie nu, daar komt een wagen mannen, met een span ruiters! Toen antwoordde hij en zei: Babel is gevallen, zij is gevallen! En al de gesneden beelden van haar goden heeft Hij tegen de grond verbrijzeld.","10":"O mijn dorswerk, en de tarwe van mijn dorsvloer! Wat ik gehoord heb van de HEERE van de heerscharen[1], de God van Israël, dat heb ik u aangezegd.","11":"De last van Duma. Men roept tot mij uit Seïr: Wachter! wat is er van de nacht? Wachter! wat is er van de nacht?","12":"De wachter zei: De morgenstond is gekomen, en het is nog nacht; als u wilt vragen, vraag; keer terug, kom.","13":"De last tegen Arabië. In het woud van Arabië zult u overnachten, o reizende karavanen van Dedanieten!","14":"Komt de dorstige tegemoet met water; de inwoners van het land Thema zijn de vluchtende met hun brood tegemoetgekomen.","15":"Want zij vluchten voor de zwaarden, voor het getrokken zwaard, en voor de gespannen boog, en voor de zwaarte van de oorlog.","16":"Want zo heeft de Heere tegen mij gezegd: Nog binnen een jaar, zoals de jaren van een dagloner zijn, zal de heerlijkheid van Kedar ten onder gaan.","17":"En het overgebleven aantal van de schutters, de helden van de Kedarenen, zal minder worden, want de HEERE, de God van Israël, heeft het gesproken."},"SV":{"1":"De last der woestijn aan de zee. Gelijk de wervelwinden in het zuiden henen doorgaan, zal hij uit de woestijn komen, uit een vreselijk land.","2":"Een hard gezicht is mij te kennen gegeven: die trouweloze handelt trouwelooslijk, en die verstoorder verstoort; trek op, o Elam! beleger ze, o Media! Ik heb al haar zuchting doen ophouden.","3":"Daarom zijn mijn lendenen vol van grote krankheid, bange weeën hebben mij aangegrepen, gelijk de bange weeën van een, die baart; ik krom mij van horen, ik word ontsteld van het aanzien.","4":"Mijn hart dwaalt, gruwen verschrikt mij, de schemering, waar ik naar verlangd heb, stelt Hij mij tot beving.","5":"Bereid de tafel, zie toe, gij wachter! eet, drink; maakt u op, gij vorsten, bestrijkt het schild!","6":"Want aldus heeft de Heere tot mij gezegd: Ga heen, zet een wachter, laat hem aanzeggen, wat hij ziet.","7":"En hij zag een wagen, een paar ruiters, een wagen *met* ezels, een wagen *met* kemels; en hij merkte zeer nauw op, met grote opmerking.","8":"En hij riep: Een leeuw, Heere! ik sta op den wachttoren geduriglijk bij dag, en op mijn hoede zet ik mij ganse nachten.","9":"En zie nu, daar komt een wagen mannen, *en* een paar ruiters! Toen antwoordde hij, en zeide: Babel is gevallen, zij is gevallen! en al de gesneden beelden harer goden heeft Hij verbroken tegen de aarde.","10":"O mijn dorsing, en de tarwe mijns dorsvloers! wat ik gehoord heb van den HEERE der heirscharen, den God Israëls, dat heb ik ulieden aangezegd.","11":"De last van Duma. Men roept tot mij uit Seir: Wachter! wat is er van den nacht? Wachter! wat is er van den nacht?","12":"De wachter zeide: De morgenstond is gekomen, en het is nog nacht; wilt gijlieden vragen, vraagt; keert weder, komt.","13":"De last tegen Arabië. In het woud van Arabië zult gijlieden vernachten, o gij reizende gezelschappen van Dedanieten!","14":"Komt den dorstige tegemoet *met* water; de inwoners des lands van Thema zijn den vluchtende met zijn brood bejegend.","15":"Want zij vluchten voor de zwaarden, voor het uitgetrokken zwaard, en voor den gespannen boog, en voor de zwarigheid des krijgs.","16":"Want alzo heeft de Heere tot mij gezegd: Nog binnen een jaar, gelijk de jaren eens dagloners zijn, zo zal de heerlijkheid van Kedar ten ondergaan.","17":"En het overgebleven getal der schutters, de helden der Kedarenen, zullen minder worden, want de HEERE, de God Israëls heeft het gesproken."},"KJV":{"1":"The burden of the desert of the sea. As whirlwinds in the south pass through; *so* it cometh from the desert, from a terrible land.","2":"A grievous vision is declared unto me; the treacherous dealer dealeth treacherously, and the spoiler spoileth. Go up, O Elam: besiege, O Media; all the sighing thereof have I made to cease.","3":"Therefore are my loins filled with pain: pangs have taken hold upon me, as the pangs of a woman that travaileth: I was bowed down at the hearing *of it*; I was dismayed at the seeing","4":"My heart panted, fearfulness affrighted me: the night of my pleasure hath he turned into fear","5":"Prepare the table, watch in the watchtower, eat, drink: arise, ye princes, *and* anoint the shield.","6":"For thus hath the Lord said unto me, Go, set a watchman, let him declare what he seeth.","7":"And he saw a chariot *with* a couple of horsemen, a chariot of asses, *and* a chariot of camels; and he hearkened diligently with much heed:","8":"And he cried, A lion: My lord, I stand continually upon the watchtower in the daytime, and I am set in my ward whole nights:","9":"And, behold, here cometh a chariot of men, *with* a couple of horsemen. And he answered and said, Babylon is fallen, is fallen; and all the graven images of her gods he hath broken unto the ground.","10":"O my threshing, and the corn of my floor: that which I have heard of the LORD of hosts, the God of Israel, have I declared","11":"The burden of Dumah. He calleth to me out of Seir, Watchman, what of the night? Watchman, what of the night?","12":"The watchman said, The morning cometh, and also the night: if ye will enquire, enquire ye: return, come.","13":"The burden upon Arabia. In the forest in Arabia shall ye lodge, O ye travelling companies of Dedanim.","14":"The inhabitants of the land of Tema brought water to him that was thirsty, they prevented with their bread him that fled.","15":"For they fled from the swords, from the drawn sword, and from the bent bow, and from the grievousness of war.","16":"For thus hath the Lord said unto me, Within a year, according to the years of an hireling, and all the glory of Kedar shall fail:","17":"And the residue of the number of archers, the mighty men of the children of Kedar, shall be diminished: for the LORD God of Israel hath spoken"}},"tsk":{"1":[{"kopje":"De last","refs":["Jes 13:1","Jes 17:1"]},{"kopje":"de woestijn","refs":["Jes 13:20-22","Jes 14:23","Jer 51:42"]},{"kopje":"Zoals wervelwinden","refs":["Job 37:9","Dan 11:40","Zach 9:14"]},{"kopje":"uit","refs":["Jes 13:4","Jes 13:5","Jes 13:17","Jes 13:18","Ezech 30:11","Ezech 31:12"]}],"2":[{"kopje":"hard","refs":["Ps 60:5","Spr 13:15"]},{"kopje":"die trouweloze","refs":["Jes 24:16","Jes 33:1","1 Sam 24:14","Jer 51:44","Jer 51:48","Jer 51:49"," /span> thereof have I made to cease.","3":"Therefore are my <span class=\"wl wl-kjv\" data-code=\"H4975\">loins</span> <span class=\"wl wl-kjv\" data-code=\"H4390\">filled</span> with <span class=\"wl wl-kjv\" data-code=\"H2479\">pain:</span> <span class=\"wl wl-kjv\" data-code=\"H6735\">pangs</span> have taken <span class=\"wl wl-kjv\" data-code=\"H270\">hold</span> upon me, as the <span class=\"wl wl-kjv\" data-code=\"H6735\">pangs</span> of a woman that <span class=\"wl wl-kjv\" data-code=\"H3205\">travaileth:</span> I was bowed <span class=\"wl wl-kjv\" data-code=\"H5753\">down</span> at the <span class=\"wl wl-kjv\" data-code=\"H8085\">hearing</span> of it; I was <span class=\"wl wl-kjv\" data-code=\"H926\">dismayed</span> at the seeing","4":"My <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> <span class=\"wl wl-kjv\" data-code=\"H8582\">panted,</span> <span class=\"wl wl-kjv\" data-code=\"H6427\">fearfulness</span> <span class=\"wl wl-kjv\" data-code=\"H1204\">affrighted</span> me: the <span class=\"wl wl-kjv\" data-code=\"H5399\">night</span> of my <span class=\"wl wl-kjv\" data-code=\"H2837\">pleasure</span> hath he <span class=\"wl wl-kjv\" data-code=\"H7760\">turned</span> into fear","5":"<span class=\"wl wl-kjv\" data-code=\"H6186\">Prepare</span> the <span class=\"wl wl-kjv\" data-code=\"H7979\">table,</span> <span class=\"wl wl-kjv\" data-code=\"H6822\">watch</span> in the <span class=\"wl wl-kjv\" data-code=\"H6844\">watchtower,</span> <span class=\"wl wl-kjv\" data-code=\"H398\">eat,</span> <span class=\"wl wl-kjv\" data-code=\"H8354\">drink:</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">arise,</span> ye <span class=\"wl wl-kjv\" data-code=\"H8269\">princes,</span> and <span class=\"wl wl-kjv\" data-code=\"H4886\">anoint</span> the shield.","6":"For thus hath the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me, <span class=\"wl wl-kjv\" data-code=\"H3212\">Go,</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">set</span> a <span class=\"wl wl-kjv\" data-code=\"H6822\">watchman,</span> let him <span class=\"wl wl-kjv\" data-code=\"H5046\">declare</span> what he seeth.","7":"And he <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> a <span class=\"wl wl-kjv\" data-code=\"H7393\">chariot</span> with a <span class=\"wl wl-kjv\" data-code=\"H6776\">couple</span> of <span class=\"wl wl-kjv\" data-code=\"H6571\">horsemen,</span> a <span class=\"wl wl-kjv\" data-code=\"H7393\">chariot</span> of <span class=\"wl wl-kjv\" data-code=\"H2543\">asses,</span> and a <span class=\"wl wl-kjv\" data-code=\"H7393\">chariot</span> of <span class=\"wl wl-kjv\" data-code=\"H1581\">camels;</span> and he <span class=\"wl wl-kjv\" data-code=\"H7181\">hearkened</span> <span class=\"wl wl-kjv\" data-code=\"H7182\">diligently</span> with <span class=\"wl wl-kjv\" data-code=\"H7227\">much</span> heed:","8":"And he <span class=\"wl wl-kjv\" data-code=\"H7121\">cried,</span> A <span class=\"wl wl-kjv\" data-code=\"H738\">lion:</span> My <span class=\"wl wl-kjv\" data-code=\"H136\">lord,</span> I <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> <span class=\"wl wl-kjv\" data-code=\"H8548\">continually</span> upon the <span class=\"wl wl-kjv\" data-code=\"H4707\">watchtower</span> in the <span class=\"wl wl-kjv\" data-code=\"H3119\">daytime,</span> and I am <span class=\"wl wl-kjv\" data-code=\"H5324\">set</span> in my <span class=\"wl wl-kjv\" data-code=\"H4931\">ward</span> whole nights:","9":"And, behold, here <span class=\"wl wl-kjv\" data-code=\"H935\">cometh</span> a <span class=\"wl wl-kjv\" data-code=\"H7393\">chariot</span> of <span class=\"wl wl-kjv\" data-code=\"H376\">men,</span> with a <span class=\"wl wl-kjv\" data-code=\"H6776\">couple</span> of <span class=\"wl wl-kjv\" data-code=\"H6571\">horsemen.</span> And he <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> is <span class=\"wl wl-kjv\" data-code=\"H5307\">fallen,</span> is <span class=\"wl wl-kjv\" data-code=\"H5307\">fallen;</span> and all the graven <span class=\"wl wl-kjv\" data-code=\"H6456\">images</span> of her <span class=\"wl wl-kjv\" data-code=\"H430\">gods</span> he hath <span class=\"wl wl-kjv\" data-code=\"H7665\">broken</span> unto the ground.","10":"O my <span class=\"wl wl-kjv\" data-code=\"H4098\">threshing,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1121\">corn</span> of my <span class=\"wl wl-kjv\" data-code=\"H1637\">floor:</span> that which I have <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> have I declared","11":"The <span class=\"wl wl-kjv\" data-code=\"H4853\">burden</span> of <span class=\"wl wl-kjv\" data-code=\"H1746\">Dumah.</span> He <span class=\"wl wl-kjv\" data-code=\"H7121\">calleth</span> to me out of <span class=\"wl wl-kjv\" data-code=\"H8165\">Seir,</span> <span class=\"wl wl-kjv\" data-code=\"H8104\">Watchman,</span> what of the <span class=\"wl wl-kjv\" data-code=\"H3915\">night?</span> <span class=\"wl wl-kjv\" data-code=\"H8104\">Watchman,</span> what of the night?","12":"The <span class=\"wl wl-kjv\" data-code=\"H8104\">watchman</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> The <span class=\"wl wl-kjv\" data-code=\"H1242\">morning</span> <span class=\"wl wl-kjv\" data-code=\"H857\">cometh,</span> and also the <span class=\"wl wl-kjv\" data-code=\"H3915\">night:</span> if ye will <span class=\"wl wl-kjv\" data-code=\"H1158\">enquire,</span> <span class=\"wl wl-kjv\" data-code=\"H1158\">enquire</span> ye: <span class=\"wl wl-kjv\" data-code=\"H7725\">return,</span> come.","13":"The <span class=\"wl wl-kjv\" data-code=\"H4853\">burden</span> upon <span class=\"wl wl-kjv\" data-code=\"H6152\">Arabia.</span> In the <span class=\"wl wl-kjv\" data-code=\"H3293\">forest</span> in <span class=\"wl wl-kjv\" data-code=\"H6152\">Arabia</span> shall ye <span class=\"wl wl-kjv\" data-code=\"H3885\">lodge,</span> O ye travelling <span class=\"wl wl-kjv\" data-code=\"H736\">companies</span> of Dedanim.","14":"The <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H8485\">Tema</span> <span class=\"wl wl-kjv\" data-code=\"H857\">brought</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">him</span> that was <span class=\"wl wl-kjv\" data-code=\"H6771\">thirsty,</span> they <span class=\"wl wl-kjv\" data-code=\"H6923\">prevented</span> with their <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> him that fled.","15":"For they <span class=\"wl wl-kjv\" data-code=\"H5074\">fled</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">from</span> the <span class=\"wl wl-kjv\" data-code=\"H2719\">swords,</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">from</span> the <span class=\"wl wl-kjv\" data-code=\"H5203\">drawn</span> <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> and <span class=\"wl wl-kjv\" data-code=\"H6440\">from</span> the <span class=\"wl wl-kjv\" data-code=\"H1869\">bent</span> <span class=\"wl wl-kjv\" data-code=\"H7198\">bow,</span> and <span class=\"wl wl-kjv\" data-code=\"H6440\">from</span> the <span class=\"wl wl-kjv\" data-code=\"H3514\">grievousness</span> of war.","16":"For thus hath the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me, Within a <span class=\"wl wl-kjv\" data-code=\"H8141\">year,</span> according to the <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> of an <span class=\"wl wl-kjv\" data-code=\"H7916\">hireling,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> of <span class=\"wl wl-kjv\" data-code=\"H6938\">Kedar</span> shall fail:","17":"And the <span class=\"wl wl-kjv\" data-code=\"H7605\">residue</span> of the <span class=\"wl wl-kjv\" data-code=\"H4557\">number</span> of <span class=\"wl wl-kjv\" data-code=\"H7198\">archers,</span> the mighty <span class=\"wl wl-kjv\" data-code=\"H1368\">men</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H6938\">Kedar,</span> shall be <span class=\"wl wl-kjv\" data-code=\"H4591\">diminished:</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> hath spoken"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"last","tekst":"Dat is, een zware profetie over de woestijn aan de zee. Zie Isa 13:1 ."},{"catchword":"der woestijn","tekst":"Dat hiermede Babel betekend wordt is af te nemen uit vs.9. En het wordt aldus genoemd omdat het land daaromtrent woest en ledig zou gemaakt worden, ja als een zee liggen zou, doordien de koningin Nitocris de grote rivier Eufraat daar heeft laten inleiden, om door dat middel hare vijanden daaruit te houden; vergelijk boven Isa 19:5 . Zij heeft laten graven de breedte van driehonderd en twintig stadiën behalve nog kreken hier en daar, bedervende veel land en lieden. Anderen menen dat Babel daarom ene woestijn der zee genoemd wordt, omdat er van nature veel poelen, meren en staande wateren waren, die ook zeeën bij de Hebreën genoemd worden; anderen, ten aanzien van de menigte der mensen, die daarin woonden en alle dagen uit en ingingen en vloeiden."},{"catchword":"henen doorgaan,","tekst":"Dat is, plegen door te dringen; te weten met grote kracht en onstuimigheid. Hebreeuws, om door te gaan, te weten gesteld zijn. Anders: gelijk de wervelwinden in het zuiden, doortrekkende komt hij uit de woestijn, uit het vreeslijke land."},{"catchword":"hij","tekst":"Te weten Cyrus, of de last; dat is de straf; te weten over Babel; anders, het; te weten het leger van Cyrus."},{"catchword":"uit de woestijn","tekst":"Dat is, uit Perzië en Medië. Tussen deze landen en Babylonië is een grote woestijn, die Cyrus met zijn leger moest doorgaan als hij naar de stad Babylon wilde komen."},{"catchword":"een vreselijk","tekst":"Aldus noemt de profeet het land der Perzen en Meden omdat het land van Babylonië door Cyrus, den koning der Perzen en Meden, is overwonnen en jammerlijk verwoest geworden."}],"2":[{"catchword":"Een hard gezicht","tekst":"De eerste woorden van dit vs. zijn de woorden van den profeet, die hier zijn last, dit is hetgeen hem in een gezicht van God was te kennen gegeven, hard noemt, omdat God de Babyloniërs daardoor dreigde zwaarlijk te zullen straffen."},{"catchword":"die trouweloze handelt","tekst":"Hier spreekt God van den koning van Babel, die in zijn gewone trouweloosheid en verstoring van andere natiën dagelijks was voortvarende en velen onder zijne tirannie deed zuchten."},{"catchword":"trek op,","tekst":"Te weten om de Babyloniërs te straffen."},{"catchword":"o Elam","tekst":"Dat is, gij Elamieten; dat is, gij Perzen, gelijk Act 2:9 ."},{"catchword":"beleger ze,","tekst":"Te weten de stad Babel, of belegert hem te weten den koning van Babel."},{"catchword":"o Media","tekst":"Dat is, gij Meden. Hier noemt God de Heere die natiën, [te weten de Perzen en Meden] door welke Hij honderd en zeventig jaren daarna, zo enigen rekenen, het koninkrijk van Babylonië verstoren zou."},{"catchword":"Ik heb al","tekst":"Of, Ik zal hare zuchting doen ophouden."},{"catchword":"haar zuchting","tekst":"Te weten van het Joodse volk, hetwelk zo in de stad als in het ganse rijk van Babel was zuchtende vanwege de langdurige gevangenschap, uit welke zij eindelijk door den koning Cyrus zijn verlost geworden, latende hen naar hun vaderland trekken, nadat hij Babel had ingenomen. Doch enigen nemen het laatste lid van dit vs. in dezen zin: Ik zal een einde maken aan al het zuchten der Babyloniërs, te weten der goddeloze Babyloniërs. En zo is het dan zoveel gezegd als: Ik zal het zuchten, door de goddeloze Babyloniërs veroorzaakt, doen ophouden. Dusdanige manier van spreken is ook Gen 18:20 :het geroep van Sodom; dat is, door die van Sodom veroorzaakt."}],"3":[{"catchword":"Daarom","tekst":"Te weten, omdat ik hoor dat de Perzen en Meden komen aangemarcheerd om de stad Babylon te belegeren, te bestormen, in te nemen, te plunderen, te verwoesten en te vernielen alles wat er in of omtrent is."},{"catchword":"van horen,","tekst":"Dat is, als ik het hoor."}],"4":[{"catchword":"Mijn hart dwaalt,","tekst":"Dat is, mijne gedachten wandelen omher; ik weet niet waarheen ik mij van schrik en benauwdheid zal keren of wenden."},{"catchword":"de schemering,","tekst":"Of, mijn gewenste schemering. Anders, de duisternis; dat is, de nacht, dien ik begeerde, te weten om gerust te mogen slapen. Anderen verstaan hier door de schemering den morgenstond, waar men naar wenst en verlangt als men des nachts niet heeft kunnen slapen, want dan valt men gemeenlijk in slaap."},{"catchword":"waar ik naar verlangd","tekst":"Hebreeuws eigenlijk, mijner omhelzing."},{"catchword":"stelt","tekst":"Dat is, verandert Hij mij."},{"catchword":"Hij mij","tekst":"Te weten, God; anderen, de vijand, die aankomt met zijn verschrikkelijk leger."}],"5":[{"catchword":"Bereid de tafel,","tekst":"Stel alles op de tafel in goede orde. Hier spreekt God, of de profeet, de Babyloniërs ironisch aan, en het is zoveel alsof hij zeide: Maakt vrij goede sier, als gij maar de wacht bestelt, zo is het genoeg. Maar eer gij het vermoedt zal u de vijand op den hals komen, alzo dat koning en vorst op de benen zal moeten zijn met de wapens in de hand."},{"catchword":"zie toe,","tekst":"Alsof hij zeide: Laat de wacht de zorg bevolen zijn, maakt gijlieden u vrolijk, zijt onbekommerd."},{"catchword":"wachter","tekst":"Hebreeuws, wacht."},{"catchword":"maakt u op,","tekst":"Eenigen nemen deze woorden als tot de vorsten van Babel ironisch gesproken te zijn, gelijk straks gezegd is, in dezen zin: Terwijl gijlieden banketteert zal onvoorziens de wachter roepen: Maakt u op, de vijand is voorhanden, enz. Anderen verstaan hier, de vorsten der Pezen en Meden, alsof God, of de profeet, tot hen zeide: Maakt u op ten strijde, terwijl de Babyloniërs goede sier maken en zorgeloos zijn, tast hen aan, overvalt hen, enz."},{"catchword":"bestrijkt","tekst":"De krijgslieden plachten hunne schilden of rondassen met olie te besmeren, om die glad en helder te maken. En onder het woord schild kan men hier bekwamelijk verstaan alle krijgsuitrusting en wapens, zodat bestrijkt het schild, zoveel te zeggen is als bereidt u ten strijde."}],"6":[{"catchword":"Want aldus","tekst":"Hier spreekt de profeet wederom in zijn eigen persoon, verhalende het visioen, hetwelk hij gezien heeft."},{"catchword":"zet een wachter,","tekst":"Alsof de Heere tot den profeet zeide: Opdat gij des te meer moogt verzekerd wezen van den ondergang der Babyloniërs, zo neem nog een getuige tot u, hetzij een profeet of een discipel der profeten, of iemand uit het volk, die u bericht doe van hetgeen hij gezien heeft."},{"catchword":"aanzeggen,","tekst":"Te weten u, o Jesaja, of de Babyloniërs."}],"7":[{"catchword":"hij zag","tekst":"Te weten de wachter, dien ik gesteld had, en hij zag, dat is, hij riep of boodschapte wat hij zag."},{"catchword":"een wagen,","tekst":"Anders: wagenen, twee rijen, of benden, ruiters, enz."},{"catchword":"een wagen met ezels,","tekst":"Dat is, een wagen van ezels [of muilen] en een wagen van kemelen getrokken. Hier wordt beschreven de aankomst van de heirtocht van Cyrus, als hij zou marcheren om Babylon te gaan belegeren. Want door de wagens moet men hier verstaan heirwagens."},{"catchword":"hij merkte","tekst":"Hebreeuws, Hij merkte er op met merking, met veelheid, of grootheid der opmerking."}],"8":[{"catchword":"hij riep","tekst":"Te weten de wachter."},{"catchword":"Een leeuw,","tekst":"Te weten, is er voorhanden, verstaande door den leeuw den koning Cyrus, komende om Babylon te belegeren. Anders: [als] een leeuw; dat is, met een grote en vervaarlijke stem."},{"catchword":"ik sta","tekst":"Of, ik zal geduriglijk op de wachtplaats staan."}],"9":[{"catchword":"En zie nu,","tekst":"Of, en zie dit aan."},{"catchword":"daar komt een wagen","tekst":"Anders: Zie, daar is alrede een wagen eens mans met twee paarden ingekomen; te weten in de stad Babel."},{"catchword":"een paar ruiters","tekst":"Of, twee hopen ruiters, alzo ook vs.7."},{"catchword":"hij,","tekst":"Te weten de wachter, of die in den wagen was."},{"catchword":"Hij verbroken","tekst":"Te weten God de Heere, of Cyrus door het bevel des Heeren."}],"10":[{"catchword":"O mijn dorsing,","tekst":"Hier spreekt de profeet het volk Gods aan en noemt het zijne dorsing, of zijn dorsgewas, omdat hij hetzelve voorzegd had, dat het naar Babylonië gevoerd en aldaar gedorst, dat is, gekweld en jammerlijk geplaagd zou worden, gedurende de zeventig jaren hunner gevangenschap. Zie dergelijke manier van spreken Isa 25:10 , en Isa 41:15 ; Jer 51:33 ; Mic 4:13 ."},{"catchword":"de tarwe","tekst":"Of, het koren mijns dorschvloers. Hebreeuws, de zoon mijns dorschvloers; zie de aantekening Job 5:7 ."}],"11":[{"catchword":"De last","tekst":"Zie Isa 13:1 ."},{"catchword":"Duma","tekst":"Dat is, Idumen, of Edom, alzo staat er Job 32:2 . Ram voor Aram."},{"catchword":"tot mij","tekst":"Den profeet Jesaja, die tot een wachter over het Joodse volk gesteld was."},{"catchword":"uit Seïr","tekst":"Dat is, een uit Seïr roept tot mij, dat is, een Edomiet. De profeet neemt hier den berg Seïr [gelegen in het land der Edomieten, Gen 36 en Deu 2] , voor het gehele land der Edomieten."},{"catchword":"Wachter","tekst":"Dat is, gij prof woest Arabië gelegen, eertijds den Ismaëlieten toekomende. Want Thema was een zoon van Ismaël; Gen 25:15 ."},{"catchword":"den vluchtende","tekst":"Of, den omdolenden."},{"catchword":"met zijn brood","tekst":"Dat is, met het brood, hetwelk hij [te weten, de Dedaniet], van node had, opdat hij van honger niet sterven zou, en de profeet noemt het zijn brood [te weten, van den Dedaniet], omdat men schuldig was hem hetzelve in zijnen nood mede te delen, immers wordt hier beschreven de grote nood, waarin de Arabieren zouden vervallen, die vluchtende voor hunne vijanden, zouden genoodzaakt zijn hunne naburen om water en om brood te bidden."}],"15":[{"catchword":"voor de zwaarden,","tekst":"Hebreeuws, voor het aangezicht der zwaarden, enz., en alzo in het volgende. En versta hier de zwaarden en bogen der Assyriërs, der krijgslieden Sanheribs."}],"16":[{"catchword":"Nog binnen een jaar,","tekst":"Of, of nog binnen het jaar; te weten van dien tijd te rekenen in welken dit gesproken wordt."},{"catchword":"gelijk de jaren","tekst":"Zie Isa 16:14 ."},{"catchword":"de heerlijkheid","tekst":"Of, eer. Zie Job 16:9 ."},{"catchword":"van Kedar","tekst":"Dat is, der Kedarenen. Kedar was een zoon van Ismaël, Gen 25 , betekenende somtijds het gehele steenachtige Arabië; Psa 120:5 ."}],"17":[{"catchword":"der schutters,","tekst":"Deze mannen hebben nog behouden den aard van hun voorvader Ismaël, die een voortreffelijk schutter was; Gen 21:20 ."},{"catchword":"de helden der Kedarenen,","tekst":"Hebreeuws, de helden der kinderen van Kedar."},{"catchword":"minder worden,","tekst":"Velen van hen zijn door de Assyriërs doodgeslagen."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"The burden of the wilderness by the Sea side. [That is, a heavy prophesy against the wilderness by the Sea side. See above chap.13.1. By this wilderness is meant Babel, as may be gathered from verse 9. And it is so called, because the land about Babel should be laid wast and bare, yea should lie like a Sea, in regard Queen Nitoris caused the great River Euphrates to be brought thither, thereby to keep her enemies out. Compare above chap.19.vers.5. she caused the breadth of an hundred and twenty furlongs to be digged, besides many more creeks here and there, spoiling much land people. Others conceit that Babel is called therefore a desert or wilderness of the Sea, because there are naturally many pools, seas, and standing waters, which are also called seas by the Hebrews. Others in respect of the multitude of people that dwelt in it, and went and came in & out every day] as the whirlwinds in the South pass through, [that is, use to pierce through; that is, with great force and boisterousness. Heb. To pass through; to wit, are bent, or disposed] (so) shall become, [he, to wit, Cyrus: or it, to wit, the burden, that is, the judgement or punishment; to wit, upon Babel: others it, to wit the camp or army of Cyrus] from the wilderness, [that is, from Persia and Media. Between these lands and Babylon there is a great wilderness, which Cyrus with his camp or army was to pass through, when he would come to the city of Babylon] from a terrible land. [So the Prophet calleth the land of the Persians and Medes, because the land of Babylon was conquered and miserable wasted and destroyed by Cyrus the King of the Persians and Medes.]"}],"2":[{"catchword":null,"tekst":"An hard vision was shewed unto me: [The first words of this verse are the words of the Prophet, who here calleth his burden (that is, that which was shewed him by God in a vision) hard, because God thereby threatened to punish the Babylonians in a severe and grievous manner] that treacherous one dealeth treacherously, and that disturber disturbeth: [here God speaketh of the King of Babel, who went on in his customary treachery and destroying of other nations, and caused many to grone under his tyranny and oppression] march up, [to wit, to punish the Babylonians] O Elam, [that is ye Elamites; that is, the Persians, as Act.2.9.] besiege it, to wit the City of Babel; or besiege him, to wit, the King of Babel] O Media, [that is, ye Medes. Here the Lord nameth those nations, (to wit, the Persians and Medes) by whom he would about an hundred and twenty years after (as some do compare) destroy the Kingdom of Babylon] I have caused [or I will cause] all their sighing to cease.] To wit, the sighing of the people of the Jews, who both in the city, and throughout the whole kingdom of Babel, sighed [and groned by reason of the long lasting captivity, from whence they were at last delivered by King Cyrus, who suffered them to go home to their own country, after that he had taken Babel. But some take the last clause of this verse in this sense, I will put an end to all the sighting of the Babylonians, to wit, of the wicked Babylonians: and then it is as much as if it had been said, I will cause the sighting caused by the wicked Babylonians, to cease. Such kin of phrase is also used Gen 18:20. the cry of Sodom.] that is caused by those of Sodom."}],"3":[{"catchword":null,"tekst":"Therefore are my Lyonsful of great sickness, pangs have taken hold upon means the longs of one that travaileth: I bow my self at the hearing (of it), that is, when I hear it] I am dismaid at the seeing (of it) [therefore are my Lyons etc. To wit, because I hear that the Persians and Medes came marching on to besiege, storm, and take the city of Babylon, and to plunder, wast or destroy all that is in or about it.]"}],"4":[{"catchword":null,"tekst":"Mine heart wandereth, [That is, my thoughts walk to and fro, I know not which way to turn me by reason of fear and trouble] honour affrighteth me, the twilight which I have longed for, [or my desired twilight, others the darkness, that is, the night which I desired and longed for; to wit, that I might sleep quietly. Others understand hereby the twilight, the morning, for which men do exceedingly wish and long, when they cannot sleep or take no rest in the night, for then they do commonly fall asleep. Heb. The twilight of my embracing maketh he [to wit, God; others, the enemy, that cometh marching with his dreadful army] (to be) trembling unto me [that is, turneth he into trembling unto me.]"}],"5":[{"catchword":null,"tekst":"Prepare the table, look out thou watchman, eat, drink: [Prepare the table. See all things in order upon the table. Here the LORD, or, the prophet speaketh ironically, or in a mocking manner to the Babylonians; and it is as much as if he had said, go to, make good cheer, feast and be merry; if so be you do but set the guards, it is sufficient, ye have done enough. But afore ye are aware, the enemy will set upon you, so that King & Prince shall fain to be up & ready in arms, (look out thou watchman) as if he had said, let all the care lie upon the guards, make yourselves merry, be void of care and trouble (thou watchman) Heb. Watch] get you up ye Princes, [some take these words to be as it were spoken ironically or in a mocking manner to the Princes of Babel, as was said immediately before, in this sense, while ye are a feasting and making merry, the watchmen unawares will cry, get ye up, the enemy is at hand, etc. Others understand here the Princes of the Persians and Medes, as if God, or the Prophet had said unto them, get ye up to battle, while the Babylonians are making good cheer, and are secure and careless, assault them, fall upon them etc.] anoint the shield [the souldiers were wont to besmear or anoint their shield or Targets with oil, to make them smooth and bright. And under the word shield may here be understood & comprehended all manner of warlike instruments or weapons: so that anoint the shield, as is much as to say, prepare yourselves to fight.]"}],"6":[{"catchword":null,"tekst":"For thus hath the LORD said unto me, go thy ways, set a watchman, let him tell what he seeth. [Here the Prophet speaketh again in his own person, relating the vision which he saw, (so set a watchman, let him tell thee what he seeth) as if the LORD had said unto the Prophet, that thou mayest be the more sure and certain of the ruine and destruction of the Babylonians, therefore take with thee yet a witness besides thy self, to wit, either some Prophets, or some one of the people that may inform thee what he hath seen (let him tell) to wit, thee O Isaiah, or the Babylonians.]"}],"7":[{"catchword":null,"tekst":"And be [To wit, the watchman whom I had set] saw [that is, he cried or told that he saw] a charet, (with) camels: [That is, a charet drawn by asses (or mules) and a charet drawn by asses (or mules) and a charet drawn by camels, there is described the coming of Cyrus his army, when he marched forth to go and besiege Babylon: for by the charets must here be understood the army-charets, or the charets, two rows, or hands, horsemen, &c.] and he heeded them very narrowly, with great heed, [he heeded them very narrowly, with great heed, [he heeded them with heed, with abundance or greatness of heed.]"}],"8":[{"catchword":null,"tekst":"And he [To wit, the watch-man] cried, a lion: [to wit, is at hand; understanding by the lion king Cyrus, coming to besiege Babylon. Others, (as) a lion: that is, with a great and terrible noise] (my) Lord, I stand continually upon that watch-tower, [Or, I will stand continually upon the watch-places] in the day time, and I set my self upon the guard whole nights. [compare Hab.2.1.]"}],"9":[{"catchword":null,"tekst":"And behold now, [Or, and look upon this (thing)] there cometh a charet of men, (and) a couple of horsemen: [others, behold, there is a mans charet with two horses already come in; to wit, into the city of Babel, (and two horsemen) or, two troops of horsemen. So likewise was in the charet] answered and said, Babel is fallen, it is fallen, [compare Jer 25:2. and 51.8. Revel.14.8. and 18.2.] and all carved images of her God hath he [to wit, God, or Cyrus by Gods appointment] broken in pieces against the ground."}],"10":[{"catchword":null,"tekst":"O my threshing, [Here the Prophet speaketh unto the people of God, and calleth them his threshing, or, his threshing fruit, because he had foretold that they should be carried away captive unto Babel, and be there threshed, that is, grievously vexed and plagued during the seventy years of their captivity. See the like phrases below chap.25.10. and 41.15. Jer 51:33. Mic 4:13.] and the wheat of my threshing-floor! [Or, the corn of my threshing-floor, Heb. The son of my threshing-floor. See the Annotat. Job chap.5.on ver.7.] that which I have heard of the LORD of hosts, the God of Israel, have I declared unto you."}],"11":[{"catchword":null,"tekst":"The burden [See above chap.13.1.] of Duma, [that is of Idumea, of Edom. So Job 3:2. Ram is put for Aram] they call unto me [to wit, unto the Prophet Isaiah, who was set as a watchman over the people of the Jews] out of Seir: [that is, one out of Seir calleth unto me; that is, an Edomite. The Prophet taketh here mount Seir (lying in the land of the Edomites, Gen 3:6. and Deut.2.) for the whole land of the Edomites] Watch-man, [that, is thou Prophet Isaiah, who givest thy self out for a watch-man over Juda and Israel. See Ez.3.7.] what is there of the night? Watchman what is there of the night? [they are the words of the Edomites spoken in a scoffing and flouting manner: as if they had said, thou Prophet hast heretofore spoken much of the night, or, of the misery that should come upon us and upon our neighbours; but we do still enjoy the morning, that is, happy and prosperous times, wherein we are no more in subjection unto you: but since the time that we did cast off the yoke of your king Joram until now, we have had ever since our own king, 2 Kings 8.20.]"}],"12":[{"catchword":null,"tekst":"The watch-man said, [That is, I Isaiah say this to you, O ye Edomites] The morning is come, and it is yet night: [as if he said, it is true, ye have enjoyed rest and peace a long time. But know this of a certain, that ye shall be shortly assaulted by the Assyrians; to wit, when they shall set upon your neighbours (and it is yet night) or, it shall also grow night. As if he said, after this rest and peace misery shall come upon you] if ye will enquire, [to wit, of the Lord, namely, by me, how it shall go with you. Others. If ye will seek, to wit, the Lord] enquire; [that is, then do it in good earnest; do not mock God, nor me his Minister] return [report, and turn from your evil ways to the way of righteousness, which is the true and right way] come, [unto us who are the people of God.]"}],"13":[{"catchword":null,"tekst":"The burden against Arabia, in the forest of Arabia shall ye over night, [That is, for fear of the Assyrians ye shall in the night-time hide yourselves in the wilderness] O ye travelling companies of Dedanim, [that is, of the Dedanites. These were the posterity of Dedan, the son of Joksan, the son Abraham by Ketura, Gen 25:3. Others, in the paths of Dedanim, or, in the ways of Dedanim. See further Jer.25.on v.23.]"}],"14":[{"catchword":null,"tekst":"Come to meet the thirsty [To wit, the Dedanites] (with) water: the inhabitants of the land of Tema [Lying in Arabia desert, or desolate Arabia, formerly belonging to the Israelites: for Tema was the son of Ismael. Gen 25:15.] met the fugitives [Or, those that strayed, or, wandered to and fro] with his bread, [that is, with the bread which he (to wit, the Dedanite] had need of, that he might not die of hunger, and the prophet calleth it his bread (to wit, the Dedanites bread) because they were bound to communicate it unto him in his want or need, at least here is described the great want and necessity into which the Arabians should fall, who fleeing from their enemies should be constrained to beg water and bread of their neighbours.]"}],"15":[{"catchword":null,"tekst":"For they flee from the swords, from the drawn sword, and from the bent bow, and from the grievousness of war, [Heb. From the face of the swords etc. And so in the sequel. And understand here the swords and bows of the Assyrians, to wit, of the Souldiers of Sennacherib.]"}],"16":[{"catchword":null,"tekst":"For thus hath the Lord said unto me, within a year, [Or within the year; to wit, counting from that time when this was spoken] as the years of an hireling are, [see above chap.16.14.] then all the glory, [or honour. See Job 19.on vers.9.] of Kedar [that is, of the Kedarines. Kedar was a son of Ismael, Genes.25. It signifieth sometimes all Arabia Petrea, or all the Stony Arabia, Psal.120.5.]"}],"17":[{"catchword":null,"tekst":"And the remaining number of the Archers, the champions of the Kedarens [Heb. The champions of the children&acirc;&euro;&trade;s of Kedar, the men retained still the nature and disposition of their forefather Ismael who was an expert Archer, Gen 21:20.] shall grow fewer, [many of them are slain by the Assyrians] For the Lord the God of Israel hath spoken it.]"}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
