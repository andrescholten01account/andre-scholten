l":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Hoor dit, huis van Jakob, die genoemd wordt met de naam van Israël, en uit de wateren van Juda voortgekomen bent! Die daar zweert bij de Naam van de HEERE, en de God van Israël vermeldt, *maar* niet in waarheid, en ook niet in gerechtigheid.","2":"Ja, van de heilige stad worden zij genoemd, en zij steunen op de God van Israël; HEERE van de heerscharen[1] is Zijn Naam.","3":"De vorige dingen heb Ik verkondigd van toen af, en uit Mijn mond zijn zij voortgekomen, en Ik heb ze doen horen; Ik heb ze snel gedaan, en zij zijn gekomen;","4":"Omdat Ik wist, dat u hard bent, en uw nek een ijzeren zenuw is, en uw voorhoofd koper;","5":"Daarom heb Ik het u van toen af verkondigd, voordat het kwam, heb Ik het u doen horen; opdat u niet misschien zou zeggen: Mijn afgod heeft die dingen gedaan, of mijn gesneden beeld, of mijn gegoten beeld heeft ze bevolen.","6":"U hebt *het* gehoord, aanmerkt dat alles; zult u het ook niet verkondigen? Van nu af doe Ik u nieuwe dingen horen, en verborgen dingen, en die u niet geweten hebt.","7":"Nu zijn zij geschapen, en niet van toen af, en voor *deze* dag hebt u ze ook niet gehoord; opdat u niet misschien zou zeggen: Zie, ik heb ze geweten.","8":"Ook hebt u ze niet gehoord, ook hebt u ze niet geweten, ook van toen af is uw oor niet geopend geweest; want Ik heb geweten, dat u volledig trouweloos zou handelen, en dat u van de buik af een overtreder genoemd bent.","9":"Om Mijn Naams wil zal Ik Mijn toorn langer uitstellen, en om het roem van Mij *wil* zal Ik, u ten goede, *Mij* bedwingen, opdat Ik u niet afhouw.","10":"Zie, Ik heb u gelouterd, doch niet als zilver, Ik heb u gekeurd in de smeltkroes van de ellende.","11":"Om Mijnentwil, om Mijnentwil zal Ik het doen, want hoe zou Hij ontheiligd worden? En Ik zal Mijn eer aan geen ander geven.","12":"Hoor naar Mij, o Jakob! En u, Israël, Mijn geroepene! Ik ben Dezelfde; Ik ben de Eerste, ook ben Ik de Laatste.","13":"Ook heeft Mijn hand de aarde gegrond, en Mijn rechterhand heeft de hemelen met de palm afgemeten; wanneer Ik ze roep, staan zij daar samen.","14":"Verzamel u, u allen, en hoor; wie onder hen heeft deze dingen verkondigd? De HEERE heeft hem lief, Hij zal Zijn welbehagen tegen Babel doen, en Zijn arm zal *tegen* de Chaldeeën zijn.","15":"Ik, Ik heb *het* gesproken, ook heb Ik hem geroepen; Ik zal hem doen komen, en hij zal voorspoedig zijn *op* zijn weg.","16":"Kom nader tot Mij, hoor dit: Ik heb van het begin af niet in het verborgene gesproken, *maar* van de tijd af, dat het gebeurd is, ben Ik daar; en nu, de Heere HEERE, en Zijn Geest heeft Mij gezonden.","17":"Zo zegt de HEERE, uw Verlosser, de Heilige van Israël: Ik ben de HEERE, uw God, Die u leert wat nuttig is, Die u leidt op de weg, *die* u gaan moet.","18":"Och, dat u naar Mijn geboden geluisterd had! Dan zou uw vrede geweest zijn als een rivier, en uw gerechtigheid als de golven van de zee.","19":"Ook zou uw nageslacht geweest zijn als het zand, en die uit uw ingewanden voortkomen als de steentjes ervan; wiens naam niet zou worden afgehouwen, noch verdelgd van voor Mijn aangezicht.","20":"Ga uit van Babel, vlucht van de Chaldeeën, verkondig met de stem van het gejuich, doe zulks horen, breng het uit tot aan het einde van de aarde, zeg: De HEERE heeft Zijn knecht Jakob verlost!","21":"En: Zij hadden geen dorst, *toen* Hij hen leidde door de woeste plaatsen; Hij deed hun water uit de rotssteen vloeien; toen Hij de rotssteen kliefde, vloeide het water daarheen.","22":"*Maar* de goddelozen hebben geen vrede, zegt de HEERE."},"SV":{"1":"Hoort dit, gij huis van Jakob, die genoemd wordt met den naam van Israël, en uit de wateren van Juda voortgekomen zijt! die daar zweert bij den Naam des HEEREN, en vermeldt den God Israëls, *maar* niet in waarheid, noch in gerechtigheid.","2":"Ja, van de heilige stad worden zij genoemd, en zij steunen op den God Israëls; HEERE der heirscharen is Zijn Naam.","3":"De vorige dingen heb Ik verkondigd van toen af, en uit Mijn mond zijn zij voortgekomen, en Ik heb ze doen horen; Ik heb ze snellijk gedaan, en zij zijn gekomen;","4":"Omdat Ik wist, dat gij hard zijt, en uw nek een ijzeren zenuw is, en uw voorhoofd koper;","5":"Daarom heb Ik het u van toen af verkondigd, eer dat het kwam, heb Ik het u doen horen; opdat gij niet misschien zoudt zeggen: Mijn afgod heeft die dingen gedaan, of mijn gesneden beeld, of mijn gegoten beeld heeft ze bevolen.","6":"Gij hebt *het* gehoord, aanmerkt dat alles; zult gijlieden het ook niet verkondigen? Van nu af doe Ik u nieuwe dingen horen, en verborgen dingen, en die gij niet geweten hebt.","7":"Nu zijn zij geschapen, en niet van toen af, en voor *dezen* dag hebt gij ze ook niet gehoord; opdat gij niet misschien zeggen zoudt: Ziet, ik heb ze geweten.","8":"Ook hebt gij ze niet gehoord, ook hebt gij ze niet geweten, ook van toen af is uw oor niet geopend geweest; want Ik heb geweten, dat gij gans trouwelooslijk handelen zoudt, en dat gij van den buik af een overtreder genaamd zijt.","9":"Om Mijns Naams wil zal Ik Mijn toorn langer uitstellen, en om Mijns roems *wil* zal Ik, u ten goede, *Mij* bedwingen, opdat Ik u niet afhouwe.","10":"Ziet, Ik heb u gelouterd, doch niet als zilver, Ik heb u gekeurd in den smeltkroes der ellende.","11":"Om Mijnentwil, om Mijnentwil zal Ik het doen, want hoe zou Hij ontheiligd worden? en Ik zal Mijn eer aan geen ander geven.","12":"Hoor naar Mij, o Jakob! en gij Israël, Mijn geroepene! Ik ben Dezelfde; Ik ben de Eerste, ook ben Ik de Laatste.","13":"Ook heeft Mijn hand de aarde gegrond, en Mijn rechterhand heeft de hemelen met de palm afgemeten; wanneer Ik ze roep, staan zij daar te zamen.","14":"Vergadert u, gij allen, en hoort; wie onder hen heeft deze dingen verkondigd? De HEERE heeft hem lief, Hij zal Zijn welbehagen tegen Babel doen, en Zijn arm zal *tegen* de Chaldeen zijn.","15":"Ik, Ik heb *het* gesproken, ook heb Ik hem geroepen; Ik zal hem doen komen, en hij zal voorspoedig zijn *op* zijn weg.","16":"Nadert gijlieden tot Mij, hoort dit: Ik heb van den beginne niet in het verborgene gesproken, *maar* van dien tijd af, dat het geschied is, ben Ik daar; en nu, de Heere HEERE, en Zijn Geest heeft Mij gezonden.","17":"Alzo zegt de HEERE, uw Verlosser, de Heilige Israëls: Ik ben de HEERE, uw God, Die u leert, wat nut is, Die u leidt op den weg, *dien* gij gaan moet.","18":"Och, dat gij naar Mijn geboden geluisterd hadt! zo zou uw vrede geweest zijn als een rivier, en uw gerechtigheid als de golven der zee.","19":"Ook zou uw zaad geweest zijn als het zand, en die uit uw ingewanden voortkomen als deszelfs steentjes; wiens naam niet zou worden afgehouwen, noch verdelgd van voor Mijn aangezicht.","20":"Gaat uit van Babel, vliedt van de Chaldeen, verkondigt met de stemme des gejuichs, doet zulks horen, brengt het uit tot aan het einde der aarde, zegt: De HEERE heeft Zijn knecht Jakob verlost!","21":"En: Zij hadden geen dorst, *toen* Hij hen leidde door de woeste plaatsen; Hij deed hun water uit den rotssteen vlieten; als Hij den rotssteen kliefde, zo vloeiden de wateren daarhenen.","22":"*Maar* de goddelozen hebben geen vrede, zegt de HEERE."},"KJV":{"1":"Hear ye this, O house of Jacob, which are called by the name of Israel, and are come forth out of the waters of Judah, which swear by the name of the LORD, and make mention of the God of Israel, *but* not in truth, nor in righteousness.","2":"For they call themselves of the holy city, and stay themselves upon the God of Israel; The LORD of hosts *is* his name.","3":"I have declared the former things from the beginning; and they went forth out of my mouth, and I shewed them; I did *them* suddenly, and they came to pass.","4":"Because I knew that thou *art* obstinate, and thy neck *is* an iron sinew, and thy brow brass;","5":"I have even from the beginning declared *it* to thee; before it came to pass I shewed *it* thee: lest thou shouldest say, Mine idol hath done them, and my graven image, and my molten image, hath commanded","6":"Thou hast heard, see all this; and will not ye declare *it*? I have shewed thee new things from this time, even hidden things, and thou didst not know","7":"They are created now, and not from the beginning; even before the day when thou heardest them not; lest thou shouldest say, Behold, I knew","8":"Yea, thou heardest not; yea, thou knewest not; yea, from that time *that* thine ear was not opened: for I knew that thou wouldest deal very treacherously, and wast called a transgressor from the womb.","9":"For my name's sake will I defer mine anger, and for my praise will I refrain for thee, that I cut thee not off.","10":"Behold, I have refined thee, but not with silver; I have chosen thee in the furnace of affliction.","11":"For mine own sake, *even* for mine own sake, will I do *it*: for how should *my name* be polluted? and I will not give my glory unto another.","12":"Hearken unto me, O Jacob and Israel, my called; I *am* he; I *am* the first, I also *am* the last.","13":"Mine hand also hath laid the foundation of the earth, and my right hand hath spanned the heavens: *when* I call unto them, they stand up together.","14":"All ye, assemble yourselves, and hear; which among them hath declared these *things*? The LORD hath loved him: he will do his pleasure on Babylon, and his arm *shall be on* the Chaldeans.","15":"I, *even* I, have spoken; yea, I have called him: I have brought him, and he shall make his way prosperous.","16":"Come ye near unto me, hear ye this; I have not spoken in secret from the beginning; from the time that it was, there *am* I: and now the Lord GOD, and his Spirit, hath sent","17":"Thus saith the LORD, thy Redeemer, the Holy One of Israel; I *am* the LORD thy God which teacheth thee to profit, which leadeth thee by the way *that* thou shouldest go.","18":"O that thou hadst hearkened to my commandments! then had thy peace been as a river, and thy righteousness as the waves of the sea:","19":"Thy seed also had been as the sand, and the offspring of thy bowels like the gravel thereof; his name should not have been cut off nor destroyed from before","20":"Go ye forth of Babylon, flee ye from the Chaldeans, with a voice of singing declare ye, tell this, utter it *even* to the end of the earth; say ye, The LORD hath redeemed his servant Jacob.","21":"And they thirsted not *when* he led them through the deserts: he caused the waters to flow out of the rock for them: he clave the rock also, and the waters gushed out.","22":"*There is* no peace, saith the LORD, unto the wicked."}},"tsk":{"1":[{"kopje":"die genoemd wordt","refs":["Gen 32:28","Gen 35:10","2 Kon 17:34","Joh 1:48","Rom 2:17","Rom 2:28","Rom 2:29","Rom 9:6","Rom 9:8","Openb 2:9","Openb 3:9"]},{"kopje":"voortgekomen bent","refs":["Num 24:7","Deut 33:28","Ps 68:27","Spr 5:16"]},{"kopje":"Die daar zweert","refs":["Jes 44:5","Jes 45:23","Jes 65:16","Deut 5:28","Deut 6:13","Deut 10:20","Ps 63:12","Zef 1:5"]},{"kopje":"vermeldt","refs":["Jes 26:13","Jes 62:8","Ex 23:13"]},{"kopje":"niet in waarheid","refs":["Jes 1:10-14","Lev 19:12","Ps 50:16-20","Ps 66:3","Jer 4:2","Jer 5:2","Jer 7:9","Jer 7:10","Mal 3:5","Matt 15:8","Matt 15:9","Matt 23:14","Joh 4:24","1 Tim 4:2","2 Tim 3:2-5"]}],"2":[{"kopje":"worden zij genoemd","refs":["Jes 52:1","Jes 64:10","Jes 64:11","Neh 11:1","Neh 11:18","Ps 48:2","Ps 87:3","Dan 9:24","Matt 4:5","Matt 27:53","Openb 11:2","Openb 21:2","Openb 22:19"]},{"kopje":"en zij steunen","refs":["Jes 10:20","Richt 17:13","1 Sam 4:3-5","Jer 7:4-11","Jer 21:2","Micha 3:11","Joh 8:40","Joh 8:41","Rom 2:17"]},{"kopje":"HEERE","refs":["Jes 47:4","Jes 51:13","Jer 10:16"]}],"3":[{"kopje":"ver n class=\"wl\" data-l=\"L5\" data-code=\"H6697\">rotssteen</span> vloeien; toen <span class=\"wl\" data-l=\"L5\" data-code=\"H6697\">Hij</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H6697\">de</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H6697\">rotssteen</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H1234\">kliefde</span>, <span class=\"wl\" data-l=\"L7\" data-code=\"H2100\">vloeide</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H4325\">het</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H4325\">water</span> daarheen.","22":"<em>Maar</em> <span class=\"wl\" data-l=\"L1\" data-code=\"H7563\">de</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H7563\">goddelozen</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H7563\">hebben</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H7965\">geen</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H7965\">vrede</span>, <span class=\"wl\" data-l=\"L3\" data-code=\"H559\">zegt</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H559\">de</span> HEERE."},"koppeling_kjv":{"1":"<span class=\"wl wl-kjv\" data-code=\"H8085\">Hear</span> ye this, O <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> which are <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> by the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and are come <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> out of the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> which <span class=\"wl wl-kjv\" data-code=\"H7650\">swear</span> by the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and make <span class=\"wl wl-kjv\" data-code=\"H2142\">mention</span> of the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> but not in <span class=\"wl wl-kjv\" data-code=\"H571\">truth,</span> nor in righteousness.","2":"For they <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> themselves of the <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and <span class=\"wl wl-kjv\" data-code=\"H5564\">stay</span> themselves upon the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts</span> is his name.","3":"I have <span class=\"wl wl-kjv\" data-code=\"H5046\">declared</span> the former <span class=\"wl wl-kjv\" data-code=\"H7223\">things</span> from the <span class=\"wl wl-kjv\" data-code=\"H227\">beginning;</span> and they went <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> out of my <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> and I <span class=\"wl wl-kjv\" data-code=\"H8085\">shewed</span> them; I <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> them <span class=\"wl wl-kjv\" data-code=\"H6597\">suddenly,</span> and they came to pass.","4":"Because I <span class=\"wl wl-kjv\" data-code=\"H1847\">knew</span> that thou art <span class=\"wl wl-kjv\" data-code=\"H7186\">obstinate,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H6203\">neck</span> is an <span class=\"wl wl-kjv\" data-code=\"H1270\">iron</span> <span class=\"wl wl-kjv\" data-code=\"H1517\">sinew,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H4696\">brow</span> brass;","5":"I have even from the <span class=\"wl wl-kjv\" data-code=\"H227\">beginning</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">declared</span> it to thee; before it came to <span class=\"wl wl-kjv\" data-code=\"H935\">pass</span> I <span class=\"wl wl-kjv\" data-code=\"H8085\">shewed</span> it thee: lest thou shouldest <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Mine <span class=\"wl wl-kjv\" data-code=\"H6090\">idol</span> hath <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> them, and my graven <span class=\"wl wl-kjv\" data-code=\"H6459\">image,</span> and my molten <span class=\"wl wl-kjv\" data-code=\"H5262\">image,</span> hath commanded","6":"Thou hast <span class=\"wl wl-kjv\" data-code=\"H8085\">heard,</span> <span class=\"wl wl-kjv\" data-code=\"H2372\">see</span> all this; and will not ye <span class=\"wl wl-kjv\" data-code=\"H5046\">declare</span> it? I have <span class=\"wl wl-kjv\" data-code=\"H8085\">shewed</span> thee new <span class=\"wl wl-kjv\" data-code=\"H2319\">things</span> from this <span class=\"wl wl-kjv\" data-code=\"H6258\">time,</span> even hidden <span class=\"wl wl-kjv\" data-code=\"H5341\">things,</span> and thou didst not know","7":"They are <span class=\"wl wl-kjv\" data-code=\"H1254\">created</span> now, and not from the beginning; even <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> when thou <span class=\"wl wl-kjv\" data-code=\"H8085\">heardest</span> them not; lest thou shouldest <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Behold, I knew","8":"Yea, thou <span class=\"wl wl-kjv\" data-code=\"H8085\">heardest</span> not; yea, thou <span class=\"wl wl-kjv\" data-code=\"H3045\">knewest</span> not; yea, from that time that thine <span class=\"wl wl-kjv\" data-code=\"H241\">ear</span> was not <span class=\"wl wl-kjv\" data-code=\"H6605\">opened:</span> for I <span class=\"wl wl-kjv\" data-code=\"H3045\">knew</span> that thou wouldest deal <span class=\"wl wl-kjv\" data-code=\"H898\">very</span> <span class=\"wl wl-kjv\" data-code=\"H898\">treacherously,</span> and wast <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> a <span class=\"wl wl-kjv\" data-code=\"H6586\">transgressor</span> from the womb.","9":"For my <span class=\"wl wl-kjv\" data-code=\"H8034\">name's</span> sake will I <span class=\"wl wl-kjv\" data-code=\"H748\">defer</span> mine <span class=\"wl wl-kjv\" data-code=\"H639\">anger,</span> and for my <span class=\"wl wl-kjv\" data-code=\"H8416\">praise</span> will I <span class=\"wl wl-kjv\" data-code=\"H2413\">refrain</span> for thee, that I cut thee not off.","10":"Behold, I have <span class=\"wl wl-kjv\" data-code=\"H6884\">refined</span> thee, but not with <span class=\"wl wl-kjv\" data-code=\"H3701\">silver;</span> I have <span class=\"wl wl-kjv\" data-code=\"H977\">chosen</span> thee in the <span class=\"wl wl-kjv\" data-code=\"H3564\">furnace</span> of affliction.","11":"For mine own sake, even for mine own sake, will I <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> it: for how should my name be <span class=\"wl wl-kjv\" data-code=\"H2490\">polluted?</span> and I will not <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> my <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> unto another.","12":"<span class=\"wl wl-kjv\" data-code=\"H8085\">Hearken</span> unto me, O <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> and <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> my <span class=\"wl wl-kjv\" data-code=\"H7121\">called;</span> I am he; I am the <span class=\"wl wl-kjv\" data-code=\"H7223\">first,</span> I also am the last.","13":"Mine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> also hath laid the <span class=\"wl wl-kjv\" data-code=\"H3245\">foundation</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> and my right <span class=\"wl wl-kjv\" data-code=\"H3225\">hand</span> hath <span class=\"wl wl-kjv\" data-code=\"H2946\">spanned</span> the <span class=\"wl wl-kjv\" data-code=\"H8064\">heavens:</span> when I <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> unto them, they stand <span class=\"wl wl-kjv\" data-code=\"H5975\">up</span> together.","14":"All ye, <span class=\"wl wl-kjv\" data-code=\"H6908\">assemble</span> yourselves, and <span class=\"wl wl-kjv\" data-code=\"H8085\">hear;</span> which among them hath <span class=\"wl wl-kjv\" data-code=\"H5046\">declared</span> these things? The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H157\">loved</span> him: he will <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> his <span class=\"wl wl-kjv\" data-code=\"H2656\">pleasure</span> on <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> and his <span class=\"wl wl-kjv\" data-code=\"H2220\">arm</span> shall be on the Chaldeans.","15":"I, even I, have <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken;</span> yea, I have <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> him: I have <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> him, and he shall make his <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> prosperous.","16":"<span class=\"wl wl-kjv\" data-code=\"H7126\">Come</span> ye <span class=\"wl wl-kjv\" data-code=\"H7126\">near</span> unto me, <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> ye this; I have not <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> in <span class=\"wl wl-kjv\" data-code=\"H5643\">secret</span> from the <span class=\"wl wl-kjv\" data-code=\"H7218\">beginning;</span> from the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> that it was, there am I: and now the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD,</span> and his <span class=\"wl wl-kjv\" data-code=\"H7307\">Spirit,</span> hath sent","17":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> thy <span class=\"wl wl-kjv\" data-code=\"H1350\">Redeemer,</span> the Holy <span class=\"wl wl-kjv\" data-code=\"H6918\">One</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> which <span class=\"wl wl-kjv\" data-code=\"H3925\">teacheth</span> thee to <span class=\"wl wl-kjv\" data-code=\"H3276\">profit,</span> which <span class=\"wl wl-kjv\" data-code=\"H1869\">leadeth</span> thee by the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> that thou shouldest go.","18":"O <span class=\"wl wl-kjv\" data-code=\"H3863\">that</span> thou hadst <span class=\"wl wl-kjv\" data-code=\"H7181\">hearkened</span> to my <span class=\"wl wl-kjv\" data-code=\"H4687\">commandments!</span> then had thy <span class=\"wl wl-kjv\" data-code=\"H7965\">peace</span> been as a <span class=\"wl wl-kjv\" data-code=\"H5104\">river,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H6666\">righteousness</span> as the <span class=\"wl wl-kjv\" data-code=\"H1530\">waves</span> of the sea:","19":"Thy <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> also had been as the <span class=\"wl wl-kjv\" data-code=\"H2344\">sand,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6631\">offspring</span> of thy <span class=\"wl wl-kjv\" data-code=\"H4578\">bowels</span> like the <span class=\"wl wl-kjv\" data-code=\"H4579\">gravel</span> thereof; his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> should not have been cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> nor <span class=\"wl wl-kjv\" data-code=\"H8045\">destroyed</span> from before","20":"Go ye <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> <span class=\"wl wl-kjv\" data-code=\"H1272\">flee</span> ye from the <span class=\"wl wl-kjv\" data-code=\"H3778\">Chaldeans,</span> with a <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of <span class=\"wl wl-kjv\" data-code=\"H7440\">singing</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">declare</span> ye, <span class=\"wl wl-kjv\" data-code=\"H8085\">tell</span> this, <span class=\"wl wl-kjv\" data-code=\"H3318\">utter</span> it even to the <span class=\"wl wl-kjv\" data-code=\"H7097\">end</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth;</span> <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> ye, The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H1350\">redeemed</span> his <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> Jacob.","21":"And they <span class=\"wl wl-kjv\" data-code=\"H6770\">thirsted</span> not when he <span class=\"wl wl-kjv\" data-code=\"H3212\">led</span> them through the <span class=\"wl wl-kjv\" data-code=\"H2723\">deserts:</span> he caused the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> to <span class=\"wl wl-kjv\" data-code=\"H5140\">flow</span> out of the <span class=\"wl wl-kjv\" data-code=\"H6697\">rock</span> for them: he <span class=\"wl wl-kjv\" data-code=\"H1234\">clave</span> the <span class=\"wl wl-kjv\" data-code=\"H6697\">rock</span> also, and the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> gushed out.","22":"There is no <span class=\"wl wl-kjv\" data-code=\"H7965\">peace,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> unto the wicked."}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"

const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';

const bijbel = document.getElementById('bijbel');

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
