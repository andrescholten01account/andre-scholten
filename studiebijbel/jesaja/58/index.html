l":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Roep uit de keel, houd niet in, verhef uw stem als een bazuin, en verkondig Mijn volk hun overtreding, en het huis van Jakob hun zonden.","2":"Hoewel zij Mij dagelijks zoeken en een lust hebben aan de kennis van Mijn wegen, als een volk dat gerechtigheid doet en het recht van zijn God niet verlaat, vragen zij Mij naar de rechten van de gerechtigheid; zij hebben een lust om tot God te naderen;","3":"*En zeggen*: Waarom vasten wij, en ziet U het niet aan, waarom kwellen wij onze ziel, en weet U het niet? Zie, op de dag waarop u vast, vindt u *uw* genoegen, en u eist streng al uw arbeid.","4":"Zie, tot twist en gekijf vast u, en om goddeloos met de vuist te slaan; vast niet zoals vandaag, om uw stem te doen horen in de hoogte.","5":"Zou dit zulk een vasten zijn dat Ik verkiezen zou, dat de mens zijn ziel een dag kwelt, dat hij zijn hoofd kromt zoals een bieze, en een zak en as onder *zich* spreidt? Zou u dat een vasten noemen, en een dag die de HEERE aangenaam is?","6":"Is dit niet het vasten dat Ik verkies: dat u de knopen van de goddeloosheid losmaakt, dat u de banden van het juk ontdoet, en dat u de verpletterden vrij loslaat, en elk juk verscheurt?","7":"Is het niet dit, dat u de hongerige uw brood meedeelt, en de armen, verdrevenen, in huis brengt? Als u een naakte ziet, dat u hem dekt, en dat u zich voor uw eigen vlees niet verbergt?","8":"Dan zal uw licht voortbreken als de dageraad, en uw genezing zal snel uitspruiten; en uw gerechtigheid zal voor uw aangezicht heengaan, *en* de heerlijkheid van de HEERE zal uw achterhoede zijn.","9":"Dan zult u roepen, en de HEERE zal antwoorden; u zult schreeuwen, en Hij zal zeggen: Zie, *hier* ben Ik. Als u uit uw midden wegdoet het juk, het uitsteken van de vinger, en het spreken van ongerechtigheid;","10":"En als u uw ziel opent voor de hongerige, en de bedrukte ziel verzadigt; dan zal uw licht in de duisternis opgaan, en uw donkerheid zal zijn als de middag.","11":"En de HEERE zal u voortdurend leiden, en Hij zal uw ziel verzadigen in grote droogte, en uw beenderen sterk maken; en u zult zijn als een gewaterde hof, en als een springader van water, waarvan het water niet ontbreekt.","12":"En zij die uit u *voortkomen*, zullen de oude verwoeste plaatsen bouwen; de fundamenten, van geslacht tot geslacht *verwoest*, zult u oprichten; en u zult genoemd worden: Die de bressen dichtmuurt, die de paden weer opmaakt, om te bewonen.","13":"Als u uw voet van de sabbat afkeert, *van* het doen van uw eigen wil op Mijn heilige dag; en *als* u de sabbat een verlustiging noemt, opdat de HEERE geheiligd wordt, Die geëerd moet worden; en *als* u die eert, doordat u uw eigen wegen niet gaat, *en* uw eigen wil niet zoekt, noch een woord *daarover* spreekt;","14":"Dan zult u zich verlustigen in de HEERE, en Ik zal u doen rijden op de hoogten van de aarde, en Ik zal u voeden met het erfdeel van uw vader Jakob; want de mond van de HEERE heeft *het* gesproken."},"SV":{"1":"Roep uit de keel, houd niet in, verhef uw stem als een bazuin, en verkondig Mijn volk hun overtreding, en het huis Jakobs hun zonden.","2":"Hoewel zij Mij dagelijks zoeken, en een lust hebben aan de kennis Mijner wegen, als een volk, dat gerechtigheid doet en het recht zijns Gods niet verlaat, vragen zij Mij naar de rechten der gerechtigheid; zij hebben een lust tot God te naderen;","3":"*Zeggende*: Waarom vasten wij, en Gij ziet het niet aan, *waarom* kwellen wij onze ziel, en Gij weet het niet? Ziet, ten dage, wanneer gijlieden vast, zo vindt gij *uw* lust, en gij eist gestrengelijk al uw arbeid.","4":"Ziet, tot twist en gekijf vast gijlieden, en om goddelooslijk met de vuist te slaan; vast niet gelijk heden, om uw stem te doen horen in de hoogte.","5":"Zou het zulk een vasten zijn, dat Ik verkiezen zou, dat de mens zijn ziel een dag kwelle, dat hij zijn hoofd kromme gelijk een bieze, en een zak en as onder *zich* spreide? Zoudt gij dat een vasten heten, en een dag den HEERE aangenaam?","6":"Is niet dit het vasten, dat Ik verkies: dat gij losmaakt de knopen der goddeloosheid, dat gij ontdoet de banden des juks, en dat gij vrij loslaat de verpletterden, en alle juk verscheurt?","7":"Is het niet, dat gij den hongerige uw brood mededeelt, en de armen, verdrevenen in huis brengt? Als gij een naakte ziet, dat gij hem dekt, en dat gij u voor uw vlees niet verbergt?","8":"Dan zal uw licht voortbreken als de dageraad, en uw genezing zal snellijk uitspruiten; en uw gerechtigheid zal voor uw aangezicht heengaan, *en* de heerlijkheid des HEEREN zal uw achtertocht wezen.","9":"Dan zult gij roepen, en de HEERE zal antwoorden; gij zult schreeuwen, en Hij zal zeggen: Ziet, *hier* ben Ik. Zo gij uit het midden van u wegdoet het juk, het uitsteken des vingers, en het spreken der ongerechtigheid;","10":"En zo gij uw ziel opent voor den hongerige, en de bedrukte ziel verzadigt; dan zal uw licht in de duisternis opgaan, en uw donkerheid zal zijn als de middag.","11":"En de HEERE zal u geduriglijk leiden, en Hij zal uw ziel verzadigen in grote droogten, en uw beenderen vaardig maken; en gij zult zijn als een gewaterde hof, en als een springader der wateren, welker wateren niet ontbreken.","12":"En die uit u *voortkomen*, zullen bouwen de oude verwoeste plaatsen; de fondamenten, van geslacht tot geslacht *verwoest*, zult gij oprichten; en gij zult genaamd worden: Die de bressen toemuurt, die de paden weder opmaakt, om te bewonen.","13":"Indien gij uw voet van den sabbat afkeert, *van* te doen uw lust op Mijn heiligen dag; en *indien* gij den sabbat noemt een verlustiging, opdat de HEERE geheiligd worde, Die te eren is; en *indien* gij dien eert, dat gij uw wegen niet doet, *en* uw eigen lust niet vindt, noch een woord *daarvan* spreekt;","14":"Dan zult gij u verlustigen in den HEERE, en Ik zal u doen rijden op de hoogten der aarde, en Ik zal u spijzigen met de erve van uw vader Jakob; want de mond des HEEREN heeft *het* gesproken."},"KJV":{"1":"Cry aloud, spare not, lift up thy voice like a trumpet, and shew my people their transgression, and the house of Jacob their sins.","2":"Yet they seek me daily, and delight to know my ways, as a nation that did righteousness, and forsook not the ordinance of their God: they ask of me the ordinances of justice; they take delight in approaching to God.","3":"Wherefore have we fasted, *say they*, and thou seest not? *wherefore* have we afflicted our soul, and thou takest no knowledge? Behold, in the day of your fast ye find pleasure, and exact all your labours.","4":"Behold, ye fast for strife and debate, and to smite with the fist of wickedness: ye shall not fast as *ye do this* day, to make your voice to be heard on high.","5":"Is it such a fast that I have chosen? a day for a man to afflict his soul? *is it* to bow down his head as a bulrush, and to spread sackcloth and ashes *under him*? wilt thou call this a fast, and an acceptable day to the LORD?","6":"*Is* not this the fast that I have chosen? to loose the bands of wickedness, to undo the heavy burdens, and to let the oppressed go free, and that ye break every yoke?","7":"*Is it* not to deal thy bread to the hungry, and that thou bring the poor that are cast out to thy house? when thou seest the naked, that thou cover him; and that thou hide not thyself from thine own flesh?","8":"Then shall thy light break forth as the morning, and thine health shall spring forth speedily: and thy righteousness shall go before thee; the glory of the LORD shall be thy rereward.","9":"Then shalt thou call, and the LORD shall answer; thou shalt cry, and he shall say, Here I *am*. If thou take away from the midst of thee the yoke, the putting forth of the finger, and speaking vanity;","10":"And *if* thou draw out thy soul to the hungry, and satisfy the afflicted soul; then shall thy light rise in obscurity, and thy darkness *be* as the noonday:","11":"And the LORD shall guide thee continually, and satisfy thy soul in drought, and make fat thy bones: and thou shalt be like a watered garden, and like a spring of water, whose waters fail","12":"And *they that shall be* of thee shall build the old waste places: thou shalt raise up the foundations of many generations; and thou shalt be called, The repairer of the breach, The restorer of paths to dwell in.","13":"If thou turn away thy foot from the sabbath, *from* doing thy pleasure on my holy day; and call the sabbath a delight, the holy of the LORD, honourable; and shalt honour him, not doing thine own ways, nor finding thine own pleasure, nor speaking *thine own* words:","14":"Then shalt thou delight thyself in the LORD; and I will cause thee to ride upon the high places of the earth, and feed thee with the heritage of Jacob thy father: for the mouth of the LORD hath spoken"}},"tsk":{"1":[{"kopje":"houd niet in","refs":["Jes 56:10","Ps 40:10","Ps 40:11","Jer 1:7-10","Jer 1:17-19","Jer 7:8-11","Jer 15:19","Jer 15:20","Ezech 2:3-8","Ezech 3:5-9","Ezech 3:17-21","Ezech 20:4","Ezech 22:2","Micha 3:8-12","Matt 3:7-9","Hand 7:51","Hand 7:52","Hand 20:26","Hand 20:27","Tit 2:15","Openb 14:9","Openb 14:10"]},{"kopje":"verhef","refs":["Jes 40:9","Jes 40:10"]},{"kopje":"als","refs":["Jes 27:13","Hos 8:1","Openb 1:10","Openb 4:1"]}],"2":[{"kopje":"zij Mij zoeken","refs":["Jes 1:11-15","Jes 29:13","Jes 48:1","Jes 48:2","Deut 5:28","Deut 5:29","1 Sam 15:21-25","Spr 15:8","Ezech 33:30-33","Matt 15:7-9","Mark 4:16","Mark 4:17","Mark 6:20","Joh 5:35","Tit 1:16","Hebr 6:4-6"]},{"kopje":"vragen zij Mij","refs":["Jer 42:2","Jer 42:20","Mark 12:14","Jak 1:21","Jak 1:22","1 Petr 2:1","1 Petr 2:2"]}],"3":[{"kopje":"vasten wij","refs":["Num jv\" data-code=\"H1980\">go</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thee; the <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall be thy rereward.","9":"Then shalt thou <span class=\"wl wl-kjv\" data-code=\"H7121\">call,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H6030\">answer;</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H7768\">cry,</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Here I am. If thou take <span class=\"wl wl-kjv\" data-code=\"H5493\">away</span> from the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of thee the <span class=\"wl wl-kjv\" data-code=\"H4133\">yoke,</span> the putting <span class=\"wl wl-kjv\" data-code=\"H7971\">forth</span> of the <span class=\"wl wl-kjv\" data-code=\"H676\">finger,</span> and <span class=\"wl wl-kjv\" data-code=\"H1696\">speaking</span> vanity;","10":"And if thou draw <span class=\"wl wl-kjv\" data-code=\"H6329\">out</span> thy <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> to the <span class=\"wl wl-kjv\" data-code=\"H7457\">hungry,</span> and <span class=\"wl wl-kjv\" data-code=\"H7646\">satisfy</span> the <span class=\"wl wl-kjv\" data-code=\"H6031\">afflicted</span> <span class=\"wl wl-kjv\" data-code=\"H5315\">soul;</span> then shall thy <span class=\"wl wl-kjv\" data-code=\"H216\">light</span> <span class=\"wl wl-kjv\" data-code=\"H2224\">rise</span> in <span class=\"wl wl-kjv\" data-code=\"H2822\">obscurity,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H653\">darkness</span> be as the noonday:","11":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H5148\">guide</span> thee <span class=\"wl wl-kjv\" data-code=\"H8548\">continually,</span> and <span class=\"wl wl-kjv\" data-code=\"H7646\">satisfy</span> thy <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> in <span class=\"wl wl-kjv\" data-code=\"H6710\">drought,</span> and make <span class=\"wl wl-kjv\" data-code=\"H2502\">fat</span> thy <span class=\"wl wl-kjv\" data-code=\"H6106\">bones:</span> and thou shalt be like a <span class=\"wl wl-kjv\" data-code=\"H7302\">watered</span> <span class=\"wl wl-kjv\" data-code=\"H1588\">garden,</span> and like a <span class=\"wl wl-kjv\" data-code=\"H4161\">spring</span> of <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> whose <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> fail","12":"And they that shall be of thee shall <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> the <span class=\"wl wl-kjv\" data-code=\"H5769\">old</span> waste <span class=\"wl wl-kjv\" data-code=\"H2723\">places:</span> thou shalt raise <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H4146\">foundations</span> of <span class=\"wl wl-kjv\" data-code=\"H1755\">many</span> <span class=\"wl wl-kjv\" data-code=\"H1755\">generations;</span> and thou shalt be <span class=\"wl wl-kjv\" data-code=\"H7121\">called,</span> The <span class=\"wl wl-kjv\" data-code=\"H1443\">repairer</span> of the <span class=\"wl wl-kjv\" data-code=\"H6556\">breach,</span> The <span class=\"wl wl-kjv\" data-code=\"H7725\">restorer</span> of <span class=\"wl wl-kjv\" data-code=\"H5410\">paths</span> to dwell in.","13":"If thou turn <span class=\"wl wl-kjv\" data-code=\"H7725\">away</span> thy <span class=\"wl wl-kjv\" data-code=\"H7272\">foot</span> from the <span class=\"wl wl-kjv\" data-code=\"H7676\">sabbath,</span> from <span class=\"wl wl-kjv\" data-code=\"H6213\">doing</span> thy <span class=\"wl wl-kjv\" data-code=\"H2656\">pleasure</span> on my <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day;</span> and <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> the <span class=\"wl wl-kjv\" data-code=\"H7676\">sabbath</span> a <span class=\"wl wl-kjv\" data-code=\"H6027\">delight,</span> the <span class=\"wl wl-kjv\" data-code=\"H6918\">holy</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H3513\">honourable;</span> and shalt <span class=\"wl wl-kjv\" data-code=\"H3513\">honour</span> him, not <span class=\"wl wl-kjv\" data-code=\"H6213\">doing</span> thine own <span class=\"wl wl-kjv\" data-code=\"H1870\">ways,</span> nor <span class=\"wl wl-kjv\" data-code=\"H4672\">finding</span> thine own <span class=\"wl wl-kjv\" data-code=\"H2656\">pleasure,</span> nor <span class=\"wl wl-kjv\" data-code=\"H1696\">speaking</span> thine own words:","14":"Then shalt thou <span class=\"wl wl-kjv\" data-code=\"H6026\">delight</span> thyself in the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> and I will cause thee to <span class=\"wl wl-kjv\" data-code=\"H7392\">ride</span> upon the high <span class=\"wl wl-kjv\" data-code=\"H1116\">places</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> and <span class=\"wl wl-kjv\" data-code=\"H398\">feed</span> thee with the <span class=\"wl wl-kjv\" data-code=\"H5159\">heritage</span> of <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> thy <span class=\"wl wl-kjv\" data-code=\"H1\">father:</span> for the <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath spoken"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"houd niet in,","tekst":"Houd uwe stem niet op, of niet in."}],"2":[{"catchword":"Hoewel","tekst":"Of, want zij zoeken mij dagelijks."},{"catchword":"dagelijks","tekst":"Hebreeuws, dag, dag; zie Psa 61:9 ."},{"catchword":"zoeken,","tekst":"Dat is, in den tempel komen om mij hunne offeranden te brengen en hunne gebeden aldaar te doen; maar het gaat hun niet ter harte, het geschiedt al uit huichelarij."},{"catchword":"een lust hebben","tekst":"Dat is, zich houden alsof zij daar een oprechten lust aan hadden, dat zij de priesters de wet horen lezen en verklaren."},{"catchword":"vragen zij Mij","tekst":"Te weten door de profeten."},{"catchword":"zij hebben een lust","tekst":"Hebreeuws, zij hebben lust tot de nadering Gods; dat is, zij stellen zich uitwendiglijk alzo aan, alsof zij lust daaraan hadden en alsof het hun ernst ware mijne geboden te weten en hun leven naar dezelve aan te stellen."}],"3":[{"catchword":"Waarom vasten","tekst":"Dit zijn de woorden der huichelaars, die door hun huichelenden en uiterlijken godsdienst veel bij God menen te verdienen."},{"catchword":"kwellen","tekst":"Te weten met vasten en honger te lijden; zie Lev 16:29 ."},{"catchword":"Gij weet het niet?","tekst":"Dat is, houdt u alsof gij het niet wist."},{"catchword":"Ziet,","tekst":"Dat is het antwoord des Heeren op de voorgaande vraag der Joden, alsof Hij zeide: Wilt gij de oorzaak weten, waarom ulieder vasten mij niet aangenaam is? Ziet, Ik zal het zeggen; uwe huichelarij is er oorzaak van, want terwijl gij vast, laat gij niet af van boze stukken te bedrijven."},{"catchword":"zo vindt","tekst":"Dat is, zo richt gij uit wat u behaagt, gelijk vs.13. Of, gij benaarstigt u om te vinden en te genieten waar gij lust en genoegen aan hebt."},{"catchword":"al uw arbeid","tekst":"Hebreeuws, smarten; dat is arbeid, dien uwe knechten en maagden met smart moeten doen. Anders: al uwen arbeid; dat is al uw goed, dat gij met arbeid verkregen hebt, en voorts uwe schulden, die gij van uw goed hebt uitstaan, vordert gij strengelijk. Zie Pro 5:10 ."}],"4":[{"catchword":"tot twist","tekst":"Dat is, om met uwe knechten, maagden, schuldenaars en anderen te twisten."},{"catchword":"om goddelooslijk","tekst":"Hebreeuws, om met de vuist der goddeloosheid te slaan; te weten uwe knechten en maagden."},{"catchword":"gelijk heden,","tekst":"Hebreeuws, als heden, of na dezen dag. Hetwelk enigen uitleggen: gelijk het dezen dag [vereist] in welken God doet blijken dat Hij tegen ulieden vertoornd is."},{"catchword":"om uw stem","tekst":"Dat is, opdat uw gebed verhoord wordt in den hemel bij God."}],"5":[{"catchword":"dat Ik","tekst":"Dat is, dat mij aangenaam zou wezen."},{"catchword":"zijn ziel","tekst":"Te weten alleen uitwendiglijk, zonder innerlijk met een rechtmatig berouw zijner zonden geraakt te zijn, en zich alzo oprecht voor God te verootmoedigen. Of aldus: Een dag dat de mens zijne ziel kwelle."},{"catchword":"een dag den HEERE","tekst":"Hebreeuws, een dag der aangenaamheid des Heeren, of den Heere."}],"6":[{"catchword":"de knopen","tekst":"Dat is, de zware dienstbaarheid uwer broeders, die zichzelven uit armoede aan u verkocht hebben, en die gij onbarmhartig tot zwaren arbeid aandrijft, alsof het vreemde slaven waren, hetwelk God verbiedt, Lev 25:39 . Zie de aantekening aldaar."},{"catchword":"des juks,","tekst":"Te weten van het juk, of der dienstbaarheid, die gij uwen verarmden broeders oplegt, dezelven onderdrukkende met uw woeker en boze werken."},{"catchword":"de verpletterden,","tekst":"Of, gebrokenen; dat is, tot verderf, of tot niet gebracht."},{"catchword":"juk verscheurt?","tekst":"Juk, dat is, zware en onverdragelijke lasten. In een woord, de Heere leert in dit en in Isa 58:7 dat wanneer men recht en wel vasten zal, zo moet men zich niet alleen onthouden van lichamelijke spijs, maar men moet ook werken des lichts doen."}],"7":[{"catchword":"mededeelt,","tekst":"Het Hebreeuwse woord betekent eigenlijk in twee stukken delen, als wanneer iemand een brood midden doorsneed, en gaf zijnen nooddruftigen broeder de ene helft."},{"catchword":"verdrevenen","tekst":"De zin is: Die als rebellen uit hun vaderland ten onrechte verdreven zijn. Anders: de ellendigen, bedrukten; te weten door de geweldige heerschappij der groten."},{"catchword":"een naakte ziet,","tekst":"Dat is, een kwalijk geklede; zie Job 22:6 ."},{"catchword":"dekt,","tekst":"Te weten met klederen."},{"catchword":"voor uw vlees","tekst":"Voor uwen naasten, die enerlei vlees en bloed heeft gelijk gij. Zie de aantekening Neh 5:5 ."},{"catchword":"niet verbergt?","tekst":"Versta hierbij: maar dat gij door de armoede en ellende uwer broeders u tot barmhartigheid laat bewegen."}],"8":[{"catchword":"uw licht","tekst":"Dat is, uw geluk en vreugde. Zie Est 8:16 , en Job 18:6 ."},{"catchword":"uw gerechtigheid","tekst":"Dat is, de vrucht uwer gerechtigheid, te weten uwe gelukzaligheid, die u de Heere uit genade geven zal. Zie Psa 24:5 . Anderen verstaan hier door de gerechtigheid den Heere Christus zelf, gelijk Jer 23:6 ."},{"catchword":"de heerlijkheid","tekst":"Dat is, de gelukzaligheid, die haar oorsprong heeft in de goedheid en macht des Heeren, die daarmede zijne heerlijkheid te kennen geeft."},{"catchword":"zal uw achtertocht","tekst":"Hebreeuws, zal u verzamelen. Zie de aantekening Num 10:25 ; Isa 52:12 ."}],"9":[{"catchword":"zal antwoorden;","tekst":"Dat is, Hij zal u verhoren."},{"catchword":"het juk,","tekst":"Zie boven vs.6."},{"catchword":"het uitsteken","tekst":"Dat is, het dreigen, als gij iemand met den vinger dreigt, of als gij met het opsteken van den vinger of het opheffen van de vuist te kennen geeft het voornemen, dat gij hebt om uw geweld in het werk te stellen."},{"catchword":"het spreken","tekst":"Te weten als gij uwen naaste scheldt of smaadt."},{"catchword":"der ongerechtigheid;","tekst":"Of, ondeugd, ijdelheid."}],"10":[{"catchword":"uw ziel","tekst":"Of, uwe ziel voortbrengt; dat is, uw hart, uzelven, uw hartelijke goedgunstigheid. De zin is: Zo gij uw hart den hongerige opent, en uit mededogenheid den arme en hongerige zult goeddoen."},{"catchword":"de bedrukte","tekst":"Dat is, den bedrukten mens."},{"catchword":"uw licht","tekst":"Versta hier door het licht zegen en welstand. Zie boven vs.8; gelijk door de duisternis allerlei tegenspoed. Zie de aantekening Gen 15:12 ."},{"catchword":"uw donkerheid","tekst":"Dat is, uwe ellenden en zwarigheden zullen in blijdschap veranderd worden."}],"11":[{"catchword":"leiden,","tekst":"Gelijk een herder zijne schapen leidt."},{"catchword":"in grote droogten,","tekst":"Hebreeuws, in dorrigheden; dat is, in dure tijden en hongersnood."},{"catchword":"vaardig maken;","tekst":"Of, vet maken, dat is sterken. Zie Pro 15:30 ."},{"catchword":"springader","tekst":"Hebreeuws, uitgangen."},{"catchword":"ontbreken","tekst":"Hebreeuws, liegen, dat is, denwelken het nimmermeer aan water ontbreekt, en derhalve niemand tevergeefs komt om daaruit te scheppen of putten; vergelijk Job 6:15 , en Job 40:28 ."}],"12":[{"catchword":"die uit u","tekst":"Hebreeuws, [die uit u], dat is uwe nakomelingen, die uit u zullen geboren worden."},{"catchword":"de oude","tekst":"Hebreeuws, de woestheden of dorre woeste plaatsen der eeuwigheid; dat is, die plaatsen, die lang woest gelegen hebben, te weten de vervallen huizen binnen Jeruzalem, en wat daaromheen lang vervallen, ongebouwd, verwoest en ledig gelegen heeft; zie Isa 61:4 ."},{"catchword":"van geslacht tot geslacht","tekst":"Dat is, vele jaren lang."},{"catchword":"oprichten;","tekst":"Hebreeuws, verwekken, of doen opstaan."},{"catchword":"Die de bressen","tekst":"Hebreeuws, een verbeteraar der bressen, of der vervallen [muren], een wederbrenger der stegen, dat men [in het land] weder wonen moge."}],"13":[{"catchword":"Indien gij","tekst":"Dat is, indien gij uwen voet op den sabbat afhoudt, dat gij niet doet wat u behaagt. Of, om des sabbats wil."},{"catchword":"indien","tekst":"Dat is, zo gij een lust hebt dien naar Gods wil en wet te vieren."},{"catchword":"opdat de HEERE","tekst":"Anders, den geheiligden [dag] des Heeren, den verheerlijkten."},{"catchword":"uw wegen","tekst":"Dat is, uw gewoonlijke werken niet doende."},{"catchword":"uw eigen lust","tekst":"Zie vs.3."},{"catchword":"noch een woord","tekst":"Anders, nog iets spreekt, te weten dat onbillijk of onbetamelijk is, gelijk vs.9."}],"14":[{"catchword":"Dan zult gij","tekst":"Dat is, dan zult gij zijne goedertierenheid en zegen genieten."},{"catchword":"Ik zal u doen","tekst":"Dat is, Ik zal u hoog verheffen en eren, gelijk Deu 32:13 . Zie de aantekening aldaar. Anderen nemen het aldus: Gij zult alles wat u zou mogen in den weg liggen en u aan uw welstand schadelijk zijn, overwinnen."},{"catchword":"Ik zal u spijzigen","tekst":"Of, Ik zal u te eten geven de erfenis van uw vader Jakob; dat is, gij zult wonen in het land, dat Ik uwen vader Jakob gegeven heb, waar gij spijs en drank in overvloed hebben zult."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Cry out of the throat, refrain not, [Cease not, or refrain not thy voice] lift up thy voice like a trumpet, and declare unto my people their transgression, and to the house of Jacob their sins."}],"2":[{"catchword":null,"tekst":"Though they seek me [Or, for they seek me, etc. [That is, come unto the Temple, to bring their offerings to me, and to make their prayers there: but its not from the heart, its done onely in hypocrisy] daily, [Heb. Day, day. See Psal.61.on ver.9.] and have a delight in the knowledge of my ways,] that is, make a shew as if they had a true delight in it, to hear the Priests read and expound the law] as a people that doth righteousness, and forsaketh not the judgement of their God; they ask me [to wit, by the prophets] for the judgements of righteousness, they have delight to approach unto God. [Heb. They have a delight to the approaching of God. That is, they behave themselves outwardly so, as if they took delight in it, and as if they had a true earnest desire to know my commandments, and to order their life accordingly.]"}],"3":[{"catchword":null,"tekst":"(Saying) wherefore do we fast, etc. thou seest it not? [These & the following words are the words of hypocrites, that think to deserve much at the hand of God by their hypocritical and outward worship] (wherefore) do we vex our soul, [to wit, by fasting & suffering hunger. See Levit.16.29.] and thou knowest it not? [that is, demeanest thy self as if thou didst not know it] behold, in the when ye fast ye find (your) pleasure, and require strictly all your labour. [This is the answer of God to the former question of the Jews; as if he had said, will ye know the cause why your fast he had said, will ye know the cause why your fast pleaseth me not? Behold, I will tell you: your hypocrisy is the cause of it; for while ye fast, ye cease not to commit gross sins. (ye find your pleasure) that is, ye do whatsoever ye please; as ver.13.Or, ye are diligent to find and enjoy that wherein ye take pleasure and delight, (and ye require strictly all your labour) Heb. Sorrows; that is, labour, which your men-servants and maid-servants are constrained to do with pain and sorrow. Others, all your labour; that is, all your wealth, which ye have gotten by your labour, and consequently ye exact strictly your debts that are owing you abroad. See Pro 5:10.]"}],"4":[{"catchword":null,"tekst":"Behold, ye fast for strife and debate, [That is, to contend with your men-servants and maid-servants, debtors, and others] and to smite wickedly with the fist: [Heb. To smite with the fist of wickedness: [to wit, your men-servants and maid-servants] fast not as to day, [Heb. As to day, or, according to this day: which some expound, as this day (doth require) wherein God doth shew that he is incensed against you] to cause your voice to be heard on high. [that is, that your prayer may be heard in heaven of God.]"}],"5":[{"catchword":null,"tekst":"Should it be such a fast, that I should choose [That is, that should be acceptable unto me] that a man should afflict his soul for a day? [to wit, outwardly, without being inwardly touched with true sorrow and repentance for his sins, and to humbling himself uprightly in the fight of God. Others, a day for a man to afflict his soul] that he should bow and down his head as a bulrush, and spread a sack and ashes under (him?) shouldest thou call that a fast and a clay ace[table to the LORD? [Heb. A day of acceptance of the Lord or to the Lord.]"}],"6":[{"catchword":null,"tekst":"Is not this the fast that I do choose? That ye loose the knots of wickedness, [That is, the fore bondage of your brethren, that by reason of poverty have sold themselves unto you, and whom ye unmerciful compel to undergo hard labour, as if they were foreign slave s and bondmen, which God forbiddeth, Levit.25.39. See the Annotat. There] that ye undo the hands of the yoke, [to wit, of the yoke of bondage which ye lay upon your improverished brethren, oppressing them by your usury, & wicked practises] and that ye let the bruised ones [Or, broken ones: that is, brought to destruction, to nothing] go free, and break all (or every) yoke, [that is, heavy and intolerable burdens. In brief, the Lord teacheth in this, and in the following verse, that if a man should keep a true and right fast, he must abstain not onely from corporal food, but he must do also works of light.]"}],"7":[{"catchword":null,"tekst":"Is it not that thou communicate thy bread to the hungry, [The Hebrew word rendered here communicate, signifieth properly to divide into pieces, as if a man should cut a loaf of bread in the midst, and give half of it to his needy brother] and that thou bring the poor that are driven away. [the meaning is, that is rebels are expelled and banished out of their own country. Others, the miserable oppressed: to wit, by the violent dominion of great men] into thine house? When thou seest one naked, [that is, one ill clothed. [See Job 22.on vers.6.] that thou cover him, [to wit, with clothes] and that thou hide not thy self from thine (own) flesh? [understand withal, but that thou be moved to pity and compassion by the poverty and misery of thy brethren. (from thine (own) flesh) from thy neighbour, that hath one kind of flesh and blood with thy self. See Nehem.5. the Annotat. On vers.5.]"}],"8":[{"catchword":null,"tekst":"Then shall thy light: [That is, thy prosperity and joy. See Esth.8.on vers.16. and Job 18.on vers.6.] break forth as the morning, and thine healing shall spring forth speedily: and thy righteousness [that is, the fruit of thy righteousness, to wit, thy happiness, which the Lord shall give thee of free grace. See Psal.24.on vers.5. Others understand hereby the righteousness of the LORD Christ himself, as Jer.23.vers.6.] shall go before thy face: and the glory of the LORD [that is, the blessedness, which hath its original from the goodness and power of the Lord, who there by declareth his glory] shall be thy reward. [Heb. Shall gather thee. See the Annotat. Numb.10.on vers.25. and above chap.52.on vers.12.]"}],"9":[{"catchword":null,"tekst":"Then shalt thou call, and the LORD shall answer; [That is, he will hear thee] thou shalt cry, and he shall say, Lo, (here) I am; if thou remove away from the midst of thee the yoke, [see above vers.6.] the putting forth of the finger, [that is, threatening; when thou threatenest anyone with thy finger, or when thou by putting up of thy finger, or by lifting up of thy hand discoverest thy intention to put thy power in practise] and the speaking of iniquity: [or vice, vanity; to wit, when thou revilest and reproachest thy neighbour.]"}],"10":[{"catchword":null,"tekst":"And if thou open thy soul [Or, bring forth thy soul; That is, thy heart, thy self, thy hearty good will and affection] to the hungry, [the meaning is, if thou open thine heart to the hungry, and out of compassion shalt do good to the poor and hungry] and satisfy the afflicted soul: [or, the afflicted men] then shall thy light rise in darkness, [understand hereby light blessing and prosperity, (See above vers.8.) as by darkness all kind of adversity. See Genes.chap.15. the Annotat. On vers.12.] and thy darkness shall be as the noon day. [that is, thy miseries and troubles shall be turned into joy.]"}],"11":[{"catchword":null,"tekst":"And the LORD shall lead thee continually, [As a shepherd leadeth his sheep] and he shall satisfy thy soul in great droughts, [Heb. In drinesses; that is, in dearth and famine] and make watery [or make fat; that is, strengthen. See Pro 15:30.] thy bones: and thou shalt be like a watered garden, and like a spring; [Heb. Going forth] of waters, whose waters fail not: [Heb. Lie not. That is, which never want water; and therefore no man cometh in vain to draw water out of it. Compare Job chap.6.on vers.15. and 40.on vers.28."}],"12":[{"catchword":null,"tekst":"And they that (proceed) from thee [Heb. They of thee; that is, thy posterity that shall be born of thee] shall build the old waste places: [Heb. The desolations, or, waste places of eternity; that is, those places that haue lain a long while waste; to wit, the ruinous houses in Jerusalem, and whatsoever thereabout lay a long time ruined, untilled , waste and void. See below chap.61.4.] thou shalt set up [Heb. Raise up, or, cause to rise] the foundations (wasted) from generation to generation: [that is, for many years together] and thou shalt be called, he that mendeth the breaches, he that repaireth the paths to dwell in. [Heb. A mender of breaches, or, of ruinous, walls, a restorer of paths that man way dwell again in the land.]"}],"13":[{"catchword":null,"tekst":"If thou turn away thy foot from the Sabbath (from) doing thy pleasure on mine holy day: [That is, if thou restrain thy foot on the Sabbath, so as that thou do sake] and (if) thou call the Sabbath a delight, [that is, if thou take delight in keeping it according to the law and will of God] that the LORD may be hallowed, who is to be honoured; [Others, the hallowed (day) of the Lord, the glorified One] and (if) thou honour him, that thou do not thine (own) ways, [that is, not doing thy usual works] (nor) find thine (own) pleasure, [See ver.3.] nor speak a word (of it): [Others, nor speak anything. To wit, that is unmet and unbeseeming, as ver.9.]"}],"14":[{"catchword":null,"tekst":"Then shalt thou delight thy self in the LORD, [that is, then shalt thou enjoy his mercy and blessing] and I will cause thee to ride upon the high places of the earth: [that is, I will higly exalt and promote thee, as Deut.32.13. See the Annotat. There. Others take it thus, Thou shalt overcome all that may lie in thy way, and might hinder thy prosperity] and I will feed thee with the inheritance of Jacob thy father: [Or, I will give thee to eat of the inheritance of Jacob thy father. That is, thou shalt dwell in the land which I have given to Jacob thy father, where thou shalt have meat and drink in abundance] for the mouth of the LORD hath spoken it."}]}}};

// popup positioneren bij een element
function plaatsPopup(el, html) {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);

const concordCache = {};

    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }

    data.weergaven.map(w => {

function bijbeluitlegHtml(n) {

        if (kortCw) {

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>

    } else {
      h += '<em>Geen verwijzingen</em>';

  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen

    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;

      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;

        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +

}
function renderPaneel(n) {

function toggle(n) {

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen

      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });

    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

  return popupCache[sleutel];

let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');

    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;

  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');

(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
