l":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Want er zal een Rijsje voortkomen uit de afgehouwen tronk van Isaï, en een Scheut uit zijn wortels zal vrucht voortbrengen.","2":"En op Hem zal de Geest van de HEERE rusten, de Geest van wijsheid en van verstand, de Geest van raad en van sterkte, de Geest van kennis en van vreze van de HEERE.","3":"En Zijn vreugde zal zijn in de vreze van de HEERE; en Hij zal niet oordelen naar wat Zijn ogen zien, en niet bestraffen naar wat Zijn oren horen.","4":"Maar Hij zal de armen met gerechtigheid oordelen, en de zachtmoedigen van het land met rechtmatigheid bestraffen; doch Hij zal de aarde slaan met de roede van Zijn mond, en met de adem van Zijn lippen zal Hij de goddeloze doden.","5":"Want gerechtigheid zal de gordel van Zijn lendenen zijn; ook zal de trouw de gordel van Zijn lendenen zijn.","6":"En de wolf zal bij het lam wonen, en de luipaard zal bij de geitenbok neerliggen; en het kalf, en de jonge leeuw, en het mestvee samen, en een klein jongetje zal ze drijven.","7":"De koe en de berin zullen samen weiden, hun jongen zullen samen neerliggen, en de leeuw zal stro eten, net als de os.","8":"En een zuigeling zal zich vermaken bij het hol van een adder; en een gespeend kind zal zijn hand uitsteken naar de kuil van de basilisk.","9":"Men zal nergens leed doen of verderven op de hele berg van Mijn heiligheid; want de aarde zal vol zijn van kennis van de HEERE, zoals het water de bodem van de zee bedekt.","10":"Want het zal gebeuren op die dag, dat de heidenen zullen vragen naar de Wortel van Isaï, Die zal staan als een banier voor de volken, en Zijn rust zal heerlijk zijn.","11":"Want het zal gebeuren op die dag, dat de Heere voor de tweede keer Zijn hand zal aanleggen om het overblijfsel van Zijn volk terug te verwerven, dat overgebleven zal zijn van Assyrië, en van Egypte, en van Pathros, en van Morenland, en van Elam, en van Sinear, en van Hamath, en van de eilanden van de zee.","12":"En Hij zal een banier oprichten onder de heidenen, en Hij zal de verdrevenen van Israël verzamelen, en de verstrooiden uit Juda bijeenbrengen, van de vier hoeken van het aardrijk.","13":"En de nijd van Efraïm zal wegwijken, en de tegenstanders van Juda zullen uitgeroeid worden; Efraïm zal Juda niet benijden, en Juda zal Efraïm niet benauwen.","14":"Maar zij zullen op de schouder van de Filistijnen vliegen naar het westen, en zij zullen samen die van het oosten beroven; aan Edom en Moab zullen zij hun handen slaan, en de kinderen van Ammon zullen hun gehoorzaam zijn.","15":"Ook zal de HEERE de inham van de zee van Egypte verbannen, en Hij zal Zijn hand bewegen tegen de rivier, door de sterkte van Zijn wind; en Hij zal die slaan in de zeven stromen, en Hij zal maken dat men er met schoenen doorheen zal gaan.","16":"En er zal een gebaande weg zijn voor het overblijfsel van Zijn volk, dat overgebleven zal zijn van Assur, zoals het Israël gebeurde op de dag toen het uit Egypteland optrok."},"SV":{"1":"Want er zal een Rijsje voortkomen uit den afgehouwen tronk van Isaï, en een Scheut uit zijn wortelen zal Vrucht voortbrengen.","2":"En op Hem zal de Geest des HEEREN rusten, de Geest der wijsheid en des verstands, de Geest des raads en der sterkte, de Geest der kennis en der vreze des HEEREN.","3":"En Zijn rieken zal zijn in de vreze des HEEREN; en Hij zal naar het gezicht Zijner ogen niet richten; Hij zal ook naar het gehoor Zijner oren niet bestraffen.","4":"Maar Hij zal de armen met gerechtigheid richten, en de zachtmoedigen des lands met rechtmatigheid bestraffen; doch Hij zal de aarde slaan met de roede Zijns monds, en met den adem Zijner lippen zal Hij den goddeloze doden.","5":"Want gerechtigheid zal de gordel Zijner lendenen zijn; ook zal de waarheid de gordel Zijner lendenen zijn.","6":"En de wolf zal met het lam verkeren, en de luipaard bij den geitenbok nederliggen; en het kalf, en de jonge leeuw, en het mestvee te zamen, en een klein jongske zal ze drijven.","7":"De koe en de berin zullen te zamen weiden, haar jongen zullen *te* *zamen* nederliggen, en de leeuw zal stro eten, gelijk de os.","8":"En een zoogkind zal zich vermaken over het hol van een adder; en een gespeend kind zal zijn hand uitsteken in de kuil van den basilisk.","9":"Men zal nergens leed doen noch verderven op den gansen berg Mijner heiligheid; want de aarde zal vol van kennis des HEEREN zijn, gelijk de wateren *den* *bodem* der zee bedekken.","10":"Want het zal geschieden ten zelven dage, dat de heidenen naar den Wortel van Isaï, Die staan zal tot een banier der volken, zullen vragen, en Zijn rust zal heerlijk zijn.","11":"Want het zal geschieden te dien dage, dat de Heere ten anderen male Zijn hand aanleggen zal om weder te verwerven het overblijfsel Zijns volks, hetwelk overgebleven zal zijn van Assyrië, en van Egypte, en van Pathros, en van Morenland, en van Elam, en van Sinear, en van Hamath, en van de eilanden der zee.","12":"En Hij zal een banier oprichten onder de heidenen, en Hij zal de verdrevenen van Israël verzamelen, en de verstrooiden uit Juda vergaderen, van de vier eilanden des aardrijks.","13":"En de nijd van Efraïm zal wegwijken, en de tegenpartijders van Juda zullen uitgeroeid worden; Efraïm zal Juda niet benijden, en Juda zal Efraïm niet benauwen.","14":"Maar zij zullen den Filistijnen op den schouder vliegen tegen het westen, *en* zij zullen te zamen die van het oosten beroven; *aan* Edom en Moab zullen zij hun handen slaan, en de kinderen Ammons zullen hun gehoorzaam zijn.","15":"Ook zal de HEERE den inham der zee van Egypte verbannen, en Hij zal Zijn hand bewegen tegen de rivier, door de sterkte Zijns winds; en Hij zal dezelve slaan in de zeven stromen, en Hij zal maken, dat men met schoenen daardoor zal gaan.","16":"En er zal een gebaande weg zijn voor het overblijfsel Zijns volks, dat overgebleven zal zijn van Assur, gelijk als Israël geschiedde ten dage, toen het uit Egypteland optoog."},"KJV":{"1":"And there shall come forth a rod out of the stem of Jesse, and a Branch shall grow out of his roots:","2":"And the spirit of the LORD shall rest upon him, the spirit of wisdom and understanding, the spirit of counsel and might, the spirit of knowledge and of the fear of the LORD;","3":"And shall make him of quick understanding in the fear of the LORD: and he shall not judge after the sight of his eyes, neither reprove after the hearing of his ears:","4":"But with righteousness shall he judge the poor, and reprove with equity for the meek of the earth: and he shall smite the earth with the rod of his mouth, and with the breath of his lips shall he slay the wicked.","5":"And righteousness shall be the girdle of his loins, and faithfulness the girdle of his reins.","6":"The wolf also shall dwell with the lamb, and the leopard shall lie down with the kid; and the calf and the young lion and the fatling together; and a little child shall lead","7":"And the cow and the bear shall feed; their young ones shall lie down together: and the lion shall eat straw like the ox.","8":"And the sucking child shall play on the hole of the asp, and the weaned child shall put his hand on the cockatrice' den.","9":"They shall not hurt nor destroy in all my holy mountain: for the earth shall be full of the knowledge of the LORD, as the waters cover the sea.","10":"And in that day there shall be a root of Jesse, which shall stand for an ensign of the people; to it shall the Gentiles seek: and his rest shall be glorious.","11":"And it shall come to pass in that day, *that* the Lord shall set his hand again the second time to recover the remnant of his people, which shall be left, from Assyria, and from Egypt, and from Pathros, and from Cush, and from Elam, and from Shinar, and from Hamath, and from the islands of the sea.","12":"And he shall set up an ensign for the nations, and shall assemble the outcasts of Israel, and gather together the dispersed of Judah from the four corners of the earth.","13":"The envy also of Ephraim shall depart, and the adversaries of Judah shall be cut off: Ephraim shall not envy Judah, and Judah shall not vex Ephraim.","14":"But they shall fly upon the shoulders of the Philistines toward the west; they shall spoil them of the east together: they shall lay their hand upon Edom and Moab; and the children of Ammon shall obey","15":"And the LORD shall utterly destroy the tongue of the Egyptian sea; and with his mighty wind shall he shake his hand over the river, and shall smite it in the seven streams, and make *men* go over dryshod.","16":"And there shall be an highway for the remnant of his people, which shall be left, from Assyria; like as it was to Israel in the day that he came up out of the land of Egypt."}},"tsk":{"1":[{"kopje":"Want er zal","refs":["Jes 53:2","Zach 6:12","Openb 5:5","Openb 22:16"]},{"kopje":"van Isaï","refs":["Jes 11:10","Ruth 4:17","1 Sam 17:58","Matt 1:6-16","Luk 2:23-32","Hand 13:22","Hand 13:23","Rom 15:12"]},{"kopje":"een Scheut","refs":["Jes 4:2","Jer 23:5","Jer 33:15","Zach 3:8","Zach 6:12"]}],"2":[{"kopje":"de Geest","refs":["Jes 42:1","Jes 59:21","Jes 61:1","Num 11:25","Num 11:26","Matt 3:16","Joh 1:32","Joh 1:33","Joh 3:34","Hand 10:38"]},{"kopje":"de Geest van wijsheid","refs":["Deut 34:9","Joh 14:17","Joh 15:26","Joh 16:13","1 Kor 1:30","Ef 1:17","Ef 1:18","Kol 1:8","Kol 1:9","Kol 2:2","Kol 2:3","2 Tim 1:7","Jak 3:17","Jak 3:18"]}],"3":[{"kopje":"zal zijn","refs":["Jes 33:6","Spr 2:5","Spr 2:9","Luk 2:52"]},{"kopje":"verstandig","refs":["Job 12:11","Job 34:3","Fil 1:9","Fil 1:10","Hebr 5:14"]},{"kopje":"en Hij zal niet","refs":["1 Sam 16:7","2 Sam 14:17","1 Kon 3:9","1 Kon 3:28","Joh 7:24","Joh 8:15","Joh he weaned <span class=\"wl wl-kjv\" data-code=\"H1580\">child</span> shall <span class=\"wl wl-kjv\" data-code=\"H1911\">put</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> on the <span class=\"wl wl-kjv\" data-code=\"H6848\">cockatrice'</span> den.","9":"They shall not <span class=\"wl wl-kjv\" data-code=\"H7489\">hurt</span> nor <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy</span> in all my <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain:</span> for the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> shall be <span class=\"wl wl-kjv\" data-code=\"H4390\">full</span> of the <span class=\"wl wl-kjv\" data-code=\"H1844\">knowledge</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> as the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> <span class=\"wl wl-kjv\" data-code=\"H3680\">cover</span> the sea.","10":"And in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> there shall be a <span class=\"wl wl-kjv\" data-code=\"H8328\">root</span> of <span class=\"wl wl-kjv\" data-code=\"H3448\">Jesse,</span> which shall <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> for an <span class=\"wl wl-kjv\" data-code=\"H5251\">ensign</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people;</span> to it shall the <span class=\"wl wl-kjv\" data-code=\"H1471\">Gentiles</span> <span class=\"wl wl-kjv\" data-code=\"H1875\">seek:</span> and his <span class=\"wl wl-kjv\" data-code=\"H4496\">rest</span> shall be glorious.","11":"And it shall come to pass in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> that the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> shall <span class=\"wl wl-kjv\" data-code=\"H3254\">set</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> <span class=\"wl wl-kjv\" data-code=\"H3254\">again</span> the second <span class=\"wl wl-kjv\" data-code=\"H8145\">time</span> to <span class=\"wl wl-kjv\" data-code=\"H7069\">recover</span> the <span class=\"wl wl-kjv\" data-code=\"H7605\">remnant</span> of his <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> which shall be <span class=\"wl wl-kjv\" data-code=\"H7604\">left,</span> from <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria,</span> and from <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and from <span class=\"wl wl-kjv\" data-code=\"H6624\">Pathros,</span> and from <span class=\"wl wl-kjv\" data-code=\"H3568\">Cush,</span> and from <span class=\"wl wl-kjv\" data-code=\"H5867\">Elam,</span> and from <span class=\"wl wl-kjv\" data-code=\"H8152\">Shinar,</span> and from <span class=\"wl wl-kjv\" data-code=\"H2574\">Hamath,</span> and from the <span class=\"wl wl-kjv\" data-code=\"H339\">islands</span> of the sea.","12":"And he shall set <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> an <span class=\"wl wl-kjv\" data-code=\"H5251\">ensign</span> for the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H622\">assemble</span> the <span class=\"wl wl-kjv\" data-code=\"H1760\">outcasts</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and gather <span class=\"wl wl-kjv\" data-code=\"H6908\">together</span> the <span class=\"wl wl-kjv\" data-code=\"H5310\">dispersed</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> from the <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H3671\">corners</span> of the earth.","13":"The <span class=\"wl wl-kjv\" data-code=\"H7068\">envy</span> also of <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim</span> shall <span class=\"wl wl-kjv\" data-code=\"H5493\">depart,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6887\">adversaries</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> shall be cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off:</span> <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim</span> shall not <span class=\"wl wl-kjv\" data-code=\"H7065\">envy</span> <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> shall not <span class=\"wl wl-kjv\" data-code=\"H6887\">vex</span> Ephraim.","14":"But they shall <span class=\"wl wl-kjv\" data-code=\"H5774\">fly</span> upon the <span class=\"wl wl-kjv\" data-code=\"H3802\">shoulders</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> toward the <span class=\"wl wl-kjv\" data-code=\"H3220\">west;</span> they shall <span class=\"wl wl-kjv\" data-code=\"H962\">spoil</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">them</span> of the <span class=\"wl wl-kjv\" data-code=\"H6924\">east</span> <span class=\"wl wl-kjv\" data-code=\"H3162\">together:</span> they shall <span class=\"wl wl-kjv\" data-code=\"H4916\">lay</span> their <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> upon <span class=\"wl wl-kjv\" data-code=\"H123\">Edom</span> and <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab;</span> and the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon</span> shall obey","15":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall utterly <span class=\"wl wl-kjv\" data-code=\"H2763\">destroy</span> the <span class=\"wl wl-kjv\" data-code=\"H3956\">tongue</span> of the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptian</span> <span class=\"wl wl-kjv\" data-code=\"H3220\">sea;</span> and with his <span class=\"wl wl-kjv\" data-code=\"H5868\">mighty</span> <span class=\"wl wl-kjv\" data-code=\"H7307\">wind</span> shall he <span class=\"wl wl-kjv\" data-code=\"H5130\">shake</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> over the <span class=\"wl wl-kjv\" data-code=\"H5104\">river,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> it in the <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H5158\">streams,</span> and make men go <span class=\"wl wl-kjv\" data-code=\"H1869\">over</span> dryshod.","16":"And there shall be an <span class=\"wl wl-kjv\" data-code=\"H4546\">highway</span> for the <span class=\"wl wl-kjv\" data-code=\"H7605\">remnant</span> of his <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> <span class=\"wl wl-kjv\" data-code=\"H834\">which</span> shall be <span class=\"wl wl-kjv\" data-code=\"H7604\">left,</span> from <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria;</span> like as it was to <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that he came <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of Egypt."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"er zal","tekst":"Hier geeft de profeet reden van hetgeen hij in Isa 10:27 gezegd heeft, te weten dat het juk van Juda zou afgescheurd worden en dat God dien stam beschermen zou, vanwege den Gezalfde, te weten Jezus Christus, die uit den stam van Juda zou geboren worden."},{"catchword":"een Rijsje","tekst":"Een spruit, ene roede; te weten, Jezus Christus, zie boven Isa 4:2 ."},{"catchword":"den afgehouwen","tekst":"Ten tijde als Christus geboren is, scheen de stam van Isaï geheel afgehouwen te zijn, dewijl hij zeer vervallen was en zijn vorige heerlijkheid schier verloren had. Hij had koning noch vorst; Jozef, de ondertrouwde man van Maria, was een timmerman. Dit blijkt ook uit de gave, die Maria offerde als de dagen harer reiniging vervuld waren; Luk 2:24 ."},{"catchword":"tronk","tekst":"Of, stronk, stam, stomp."},{"catchword":"Isaï,","tekst":"Des vaders David."},{"catchword":"een Scheut","tekst":"Een verhaal van hetgeen straks met andere woorden gezegd is, opdat het de lezer te beter versta en bemerke. In het Hebreeuws staat het woord Nezer, waarmede sommigen menen dat tegelijk wordt te verstaan gegeven dat Christus te Nazareth zou opgevoed worden, en daarvan den naam Nazarener bekomen; zie Mat 2:23 ."},{"catchword":"Vrucht","tekst":"Of, wassen, groeien."}],"2":[{"catchword":"de Geest","tekst":"Te weten de Heilige Geest, die van God den Vader en den Zoon voortgaat. De zin is: Hij zal naar zijne mensheid, naar welke Hij een zoon Davids is, met alle geestelijke gaven overvloediglijk en in alle volheid begaafd worden; zie Psa 45:8 ; Joh 3:34 ."},{"catchword":"rusten,","tekst":"Dit rusten van den Geest des HEEREN op Christus is afgebeeld en betekend door het nederdalen en het rusten der duif op Christus, als Hij in de Jordaan is gedoopt geweest; Mat 3:16 ."},{"catchword":"de Geest der wijsheid","tekst":"Dat is, de Geest, die de wijsheid werkt, of veroorzaakt. Alzo ook in het volgende."},{"catchword":"der kennis","tekst":"Of, der wetenschap."}],"3":[{"catchword":"Zijn","tekst":"Te weten des Heeren Christus."},{"catchword":"rieken","tekst":"Dat is, zijn kennis en oordeel. Anders: En Hij, te weten Christus, zal rieken; dat is, zeer wijselijk en verstandiglijk alles vernemen en gewaar worden."},{"catchword":"in de vreze","tekst":"Dat is, Hij zal, als een kenner der harten, weten en verstaan bij wien de vreze des Heeren is, bij wien zij niet is."},{"catchword":"naar het gezicht","tekst":"Versta dit alzo, dat Christus niet alleen naar den uiterlijken schijn, of naar de woorden alleen, oordelen zal [waarmede de ene mens den anderen dikwijls bedriegt] maar naar de gelegenheid des harten als zijnde een kenner des harten, en een doorgronder der nieren. Zie Joh 2:24-25 , en Joh 21:15-17 ."},{"catchword":"naar het gehoor","tekst":"Dat is, Hij zal ook niet lichtelijk aannemen de klachten, die men hem aanbrengt, noch ook de schijnheilige woorden der huichelaars. Of, Hij zal niet oordelen van zichzelven, maar gelijk Hij van zijn Vader zal gehoord hebben."},{"catchword":"bestraffen","tekst":"Te weten met woorden. Anders, straffen; te weten niet alleen met woorden, maar ook met plagen."}],"4":[{"catchword":"Hij zal de armen","tekst":"De zin is: Hij zal wel de armen [te weten, de armen van geest, gelijk Mat 5:3 ] , richten en straffen, maar met goedertierenheid en in billijkheid, tot hun best. Of, Hij zal den vromen en onnozelen, die van de goddelozen en kinderen dezer wereld onderdrukt worden, recht spreken en verlossen van het geweld hunner wederpartijders. Zie Psa 72:4 , Psa 72:12 ."},{"catchword":"de zachtmoedigen","tekst":"Te weten die zachtmoedigen, nederigen en verslagenen van gemoed uit het gevoel en de bekentenis hunner zonden. Anders: En Hij zal om de zachtmoedigen der aarde wil straffen met rechtmatigheid. De zin is: Hij zal straf oefenen over de goddelozen, opdat Hij de zachtmoedigen verlosse en bescherme."},{"catchword":"de aarde","tekst":"Dat is, de mensen op de aarde, te weten de goddelozen, gelijk straks volgt."},{"catchword":"slaan","tekst":"Te weten in hunne conscientiën, derzelve overtuigende van hunne zonden, hun hunne ellenden en verdoemenis te kennen gevende. Zie hiervan een voorbeeld Act 2:37 ."},{"catchword":"met de roede","tekst":"Dat is, met de kracht der predikatie van zijn Woord, hetwelk is de geestelijke scepter van zijn koninkrijk, scherper dan enig tweesnijdend zwaard, Heb 4:12 ; zie dergelijke manier van spreken Job 22:22 ; Psa 33:6 ; 2Th 2:6 ; Rev 1:16 , en Rev 2:16 , en Rev 19:15 ."},{"catchword":"met den adem","tekst":"Dat is, met zijn Woord of predikatie van hetzelve, gelijk straks."},{"catchword":"den goddeloze","tekst":"Dat is, alle goddelozen; dat is, Hij zal de leer der goddelozen overtuigen van valsheid, en hun leven van goddeloosheid, en dat zal Hij zo krachtiglijk doen, dat zij in hunne conscientiën zullen overtuigd worden dat zij der verdoemenis waardig zijn, of immers wel verdiend hebben verdaan en te schande gemaakt te worden, 2Th 2:8 ; en eindelijk zal Hij alle onbekeerlijken metterdaad straffen."}],"5":[{"catchword":"gerechtigheid","tekst":"Dat is, Hij zal bekleed en versierd zijn, niet gelijk de koningen dezer wereld met uiterlijke sieraad van klederen; maar met gerechtigheid en met trouw, of met de waarheid en bestendigheid zijner beloften. Zie Psa 45:4-5 , en Psa 72:4 , Psa 72:12 . Christus geeft zijnen uitverkorenen hetgeen Hij hun belooft."},{"catchword":"waarheid","tekst":"Of, trouw."}],"6":[{"catchword":"de wolf","tekst":"Dat is, de boze, kwade, wilde, woeste mensen, zo Joden als heidenen, zullen door de predikatie van Christus en van zijne dienaren en de innerlijke werking van den Heiligen Geest zo veranderd worden, dat zij, afleggende hun boze genegenheden, met den geest der liefde en der zachtmoedigheid zullen aangedaan worden, alzo dat zij goedertieren en beleefd met elkander zullen leven en verkeren, zonder hun enig leed of schade aan te doen. Zie Isa 65:25 ; Hos 2:17 ."},{"catchword":"verkeren,","tekst":"Of, wonen, herbergen."},{"catchword":"het mestvee","tekst":"Of, het vette vee."},{"catchword":"een klein jongske","tekst":"Dat is, de minste discipel of dienaar van onzen Heere Christus, al is hij gering in de ogen der mensen, zal hen besturen en regeren door de leer van het heilige Evangelie, want er zal gewillige gehoorzaamheid bij de mensen wezen, zijnde door den Geest Gods innerlijk bewogen om het Woord des Heeren aan te nemen."}],"7":[{"catchword":"de leeuw","tekst":"Dat is, de vorsten en heren zullen zich zowel laten leiden en regeren door de predikatie van het goddelijke Woord, als personen van minderen staat en aanzien; zij zullen altegaar met enerlei spijs of voeder, te weten met Gods Woord, gevoed worden."}],"8":[{"catchword":"zal zich vermaken","tekst":"Dat is, het zal spelen. De zin is: De geringsten in de gemeente Gods zullen in geen gevaar staan dat de machtigen hen enigszins zullen beledigen of beschadigen, dewijl die zowel als de geringsten tot Christus zullen bekeerd worden; gelijk nader te zien is vs.9."},{"catchword":"een adder;","tekst":"Zie Deu 32:33 , en Psa 58:5 ."},{"catchword":"zal zijn hand","tekst":"Dat is, die, wier harten tevoren vol vergif waren, zullen zo gezuiverd worden, dat het een vermaak en genoegen zal zijn met hen te verkeren."}],"9":[{"catchword":"Men zal","tekst":"Dit vs. verklaart de zinnebeeldige uitdrukkingen van vs.6-8. De zin is: Onder de gelovigen, die tot kennis des Heeren komen zullen, zal de een den ander niet beledigen noch beschadigen, onrechtvaardigheid of geweld aandoen; maar zij zullen zich gelijkelijk eens godzaligen, oprechten en eerbaren handels en wandels bevlijtigen. Zie Isa 65:25 ."},{"catchword":"Mijner heiligheid;","tekst":"Of, mijns heiligdoms; dat is, in de gemeente der gelovigen. Want in den tempel, die op den berg Zion gebouwd was, plachten de gelovigen te vergaderen."},{"catchword":"de aarde","tekst":"Dat is, de uitverkoren kinderen Gods op de aarde wonende."},{"catchword":"gelijk de wateren","tekst":"Hebreeuws, gelijk de wateren de zee bedekken. Hier betekent de zee zoveel als de grond der zee. En de zin is: Dat de kennis des Heeren overal rijkelijk zal bloeien."}],"10":[{"catchword":"den Wortel","tekst":"Door den wortel Isaï versta Christus, die uit Isaï, den vader van David, als uit een wortel spruiten en hiervoor komen zou. Zie boven vs.1, en Rom 15:12 ."},{"catchword":"Die staan zal","tekst":"Of, die opgericht zal worden; te weten door de predikatie van het heilig Evangelie. Het is een profetie van de roeping der heidenen tot de kennis van Christus."},{"catchword":"tot een banier","tekst":"Dat is, tot welken zij zullen vergaderen en samenkomen in enigheid des geloofs, de volken van den gansen aardbodem. Zie Gen 49:10 ."},{"catchword":"vragen,","tekst":"Dat is, de heidenen zullen de predikatie van het heilige Evangelie met lust aanhoren, en zij zullen daaruit Christus leren kennen. Anderen verstaan deze woorden aldus: De heidenen zullen uit dien wortel, te weten Christus, God leren kennen, dienen en alzo het eeuwige leven verkrijgen."},{"catchword":"Zijn rust","tekst":"Hebreeuws, zijne rust zal eer, of heerlijkheid zijn; dat is, zijne gemeente, in welke Hij rust en zijn welbehagen heeft, zal vol eer en heerlijkheid zijn, namelijk geheiligd zijnde door den Heiligen Geest en eindelijk gans heilig en heerlijk gemaakt zijnde aan de ziel en aan het lichaam. Anders: zijne rust zal ter heerlijkheid zijn; dat is, het zal ere zijn op hem te rusten, of ere in hem te zoeken."}],"11":[{"catchword":"Want het zal","tekst":"Hier geeft de profeet reden en wijst aan de heerlijke rust, die de Messias zijn volk geven zal."},{"catchword":"ten anderen male","tekst":"Alsof hij zeide: Gelijk Hij eertijds zijne hand heeft uitgestrekt om zijn volk uit Egypteland te verlossen, alzo zal Hij die wederom tot hunne verlossing uitstrekken tegen hunne vijanden; namelijk, zo lichamelijk als ook geestelijk, de zonde en den duivel."},{"catchword":"te verwerven","tekst":"Te weten door zijn bloed en geest, Act 20:28 ; Eph 5:25-27 . Het Hebreeuwse woord betekent kopen, rantsoeneren, verkrijgen, verwerven, zich toeëigenen, ten eigendom maken."},{"catchword":"het overblijfsel","tekst":"Te weten degenen, die door de predikatie van het heilige Evangelie tot Christus zouden bekeerd en zijn rijk deelachtig gemaakt worden. Zie Rom 11:25-26 ."},{"catchword":"Pathros,","tekst":"Zie Gen 10:14 ; in welk hoofdstuk ook van de andere volken, die hier genoemd staan, gesproken wordt. Doch van Hamath zie 2Sa 8:9 ."},{"catchword":"der zee","tekst":"Dat is, over of aan de zee gelegen."}],"12":[{"catchword":"Hij zal","tekst":"Te weten de Heere."},{"catchword":"een banier","tekst":"Gelijk boven vs.10."},{"catchword":"en Hij zal","tekst":"Anders: opdat Hij verzamele, enz."},{"catchword":"vergaderen,","tekst":"Te weten in Christus, die zijne kerk uit de vier hoeken der wereld vergadert. Alzo dat in Hem geestelijkerwijze vervuld is hetgeen God beloofd heeft; Deu 30:4 ."},{"catchword":"einden","tekst":"Of, hoeken, gewesten. Zie Job 37:3 ."}],"13":[{"catchword":"de nijd","tekst":"Versta hier dien nijd, waarmede Efraïm den stam van Juda benijdde; en versta onder Efraïm de tien stammen van Israël. De zin is: Daar zal onder de Christenen niet zulk een haat en nijd zijn, gelijk er eertijds tussen Efraïm en Juda geweest is."},{"catchword":"Efraïm zal Juda","tekst":"De zin is: De gemeente van Christus zal in een heiligen vrede verenigd worden."},{"catchword":"niet benauwen","tekst":"Of vijandiglijk aangrijpen, beangstigen, onderdrukken."}],"14":[{"catchword":"zij zullen","tekst":"Te weten Efraïm en Juda gelijkelijk."},{"catchword":"op den schouder","tekst":"Dit is geestelijkerwijze te verstaan, alzo namelijk, dat de gelovige Israëlieten de heidenen door de predikatie van het heilige Evangelie snellijk zullen op het lijf vallen, aangrijpen en overwinnen, overmits zij enigen hunner tot het Christengeloof brengen zullen, en de anderen zullen zij overtuigen dat zij gene ontschuldiging voor God hebben zullen. Immers geeft de profeet door deze gelijkenis [genomen van een roofvogel of vos, die de hoenders op het lijf valt] te kennen de victorie, welke de Heere zijne kerk tegen hare vijanden verlenen zou. Gelijk zulks door de apostelen en andere leraars is vervuld geworden."},{"catchword":"tegen het westen,","tekst":"Hebreeuws, tegen de zee aan. De Middellandse zee ligt ten lande van Kanaän tegen het westen. De profeet geeft hier te kennen dat het Evangelie zou gepredikt worden in het oosten en in het westen; zie Mat 8:11 ."},{"catchword":"zij zullen te zamen","tekst":"Aldus spreekt de profeet oneigenlijk van de predikatie van het goddelijke Woord, willende te kennen geven dat de kerk van Christus al hare vijanden zou bestrijden en overwinnen door de kracht en den zegen des Heeren, om de uitverkorenen te brengen onder zijne gehoorzaamheid."},{"catchword":"die van het oosten","tekst":"Hebreeuws, de kinderen van het oosten. Zie Job 1:3 , en de aantekening aldaar."},{"catchword":"aan Edom","tekst":"Dat is, aan de Edomieten en Moabieten."},{"catchword":"zullen zij","tekst":"Hebreeuws, zal de zending hunner handen zijn."},{"catchword":"de kinderen Ammons","tekst":"Dat is de Ammonieten."},{"catchword":"zullen hun","tekst":"Te weten overmits zij de leer van het heilige Evangelie met een vast geloof zullen omhelzen."}],"15":[{"catchword":"Ook zal de HEERE","tekst":"Onder verbloemde woorden geeft de profeet te kennen dat alle hindernissen zullen weggenomen worden, die het volk in den weg zouden zijn om tot Christus te komen. Alsof hij zeide: Eer zal de Heere alle wateren, alsook onder anderen de zeven stromen der rivier de Nijl doen opdrogen, eer de loop van het heilige Evangelie zou gestuit of opgehouden worden; gelijk Hij eertijds het Rode meer heeft droog gemaakt, opdat zijn volk droogvoets daardoor zou gaan."},{"catchword":"den inham","tekst":"Hebreeuws, de tong."},{"catchword":"der zee van Egypte","tekst":"Te weten de Rode zee aan Egypte strekkende."},{"catchword":"verbannen,","tekst":"Dat is tenietdoen of te schande maken."},{"catchword":"bewegen","tekst":"Anders: opheffen, als dreigende, gelijk boven Isa 10 , van Assur gezegd wordt."},{"catchword":"tegen de rivier,","tekst":"Te weten de Nijl, die zeven uitgangen of stromen had. Doch enigen verstaan hier de rivier de Eufraat, anderen de Jordaan."},{"catchword":"stromen,","tekst":"Het Hebreeuwse woord nachal betekent hier de grachten of diepten, door welke de wateren vlieten; of, den bak, geul of grond der rivier, zijnde als ene vallei, nadat de wateren afgelopen zijn."},{"catchword":"dat men","tekst":"Of, dat zij; te weten de gelovigen."},{"catchword":"met schoenen","tekst":"Versta hierbij, zonder dezelve nat te maken, of zonder dezelve uit te trekken, opdat men ze niet nat make."}],"16":[{"catchword":"er zal een","tekst":"De zin is: Alles zal gebaand en zonder hindernissen zijn, als Christus zijne kerk verzamelen zal door de predikatie van het heilige Evangelie."},{"catchword":"toen het uit Egypteland","tekst":"Gaande droogvoets door de Rode zee; Exo 14:29 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And there shall come forth come forth a small branch out of the stem of Isai, that is hewen down, and a shoot out of his roots shall bring forth fruit. [Here the Prophet giveth a reason of that which he had said, chap.10.27. To wit, that the yoke should be rent or broken off from Juda, and that God would defend that tribe, for the sake of the Anointed, to wit, Jesus Christ, who should be born of the tribe of Juda. (For there shall come forth a young, or, little branch) A sprig, a rod; to wit, Jesus Christ. See above chap.4.v.2. (out of the stem) Or, stock, stump. (of Isai) the father of David. (that is hewen down) Or, cut off. At that time when Christ was born, the tribe of Juda seemed to be clean cut off, forasmuch as it was greatly decayed, and had almost loft its former glory. It had neither King nor Prince: Joseph the Espoused husband of Mary, was a carpenter: This appeareth also by the gift, which Mary Offered, when the Days of her purification were fulfilled, Luk 2:24. (and a shoot shall bring forth fruit) Or, grow, spring forth (out of his roots.) A relation of that, which is straight way said in other words, that the Reader might the better understand and perceive it. In the Hebrew is mentioned the word Nezer, whereby some conceive, that likewise is signified, that Christ should be brought up at Nazareth, and from thence obtain the name of Nazarene. See Mat 2:23.]"}],"2":[{"catchword":null,"tekst":"And the Spirit of the LORD [To wit, the Holy Ghost, who proceedeth from the Father, and the Son] shall rest upon him: [The meaning is, he shall according to his humane Nature; whereby he is the Son of David, be abundantly, and in all Fullness, endued with all spiritual gifts, or graces. See Psa 45:8. and Joh.3.24. This resting of the Spirit of the LORD upon Christ, is represented and signified by the descending of the Dove and her resting upon Christ, when he was baptised in the Jordan, Luk 3:16,22.] the spirit of Wisdom, and of understanding, [That is, the spirit which worketh, and produceth wisdom and understanding. So likewise in the sequel] the Spirit of counsel, and of strength, the Spirit of knowledge, [Or, of science] and of the fear of the LORD."}],"3":[{"catchword":null,"tekst":"And his [To wit, the Lord Christs] smelling shall be [That is, his knowledge and judgement shall be. Oth. And he, to wit, Christ, shall smell, that is, very wisely and understandingly perceive and apprehend all things] in the fear of the LORD: [That is, he shall as a knower of hearts, know and perceive with whom the fear of the Lord is, and with whom it is not] and he shall not judge after the sight of his eyes; [Understand this thus, that Christ shall not onely judge according to the outward shew and appearance, or onely according to words, (whereby one man often deceiveth another) but according to the disposition of the heart, as knowing the hearts, and searching the reins. See Joh.2.24,25. And chap.21.ver.15,16,17.] he shall not reprove [To wit, with words Oth. Punish; to wit, not onely with words, but also with stripes, or blows] according to the hearing of his ears. [That is, he shall not easily receive or entertain the complaints that are brought unto him, neither also the fair and smooth words of hypocrites, that have a shew of holiness. Or, he shall not judge of or from himself, but according as he shall have heard of his Father.]"}],"4":[{"catchword":null,"tekst":"But he shall Judge the poor with righteousness, [The meaning is, he shall indeed Judge and punish the poor, (To wit, the poor in spirit, as Mat 5:3.) but with gentleness, and equity, for their good. Or, he shall clear the godly and innocent, that are oppressed by the wicked and the men of this world, and shall deliver them from the power and violence of their adversaries. See Psal.72.4,12.] and reprove with equity the meek of the earth: [To wit, those that are meek, humble, and lowly in mind, out of a sense and apprehension of their sins. Oth. And he shall reprove with equity, for the meek of the earth&acirc;&euro;&trade;s sake. The meaning is, he shall exercise judgement or punishment upon the wicked, that he may deliver and defend the meek] but he shall smite the earth, [That is, the men upon the earth; to wit, the wicked, as straight way followeth. He shall smite them; To wit, their consciences, convincing them of their sins, acquainting them with their miseries and damnation. See hereof an example, Act 2:37.] with the rod of his mouth, [That is, with the power of the preaching of the word, which is the Spiritual Seepter of his Kingdom, sharper then any two edged sword, Heb 4:12. See the like phrases, Psal.33.on vers.6, Job.22..22. and 2 Thes.2.8. Revel.1.16. and 2.16. and 19.15.] and with the breath of his lips [That is, with his word, or the preaching of it, as immediately before] shall he slay wicked. [That is, all wicked ones. That is, he shall convince the Doctrine of wicked-men of falsehood, and their life of wickedness; and he shall do it so powerfully, as that they shall be convinced in their own consciences, that they are worthy of damnation, or at least have deserved to be confounded and destroyed, 2 Thes.2.8. and finally he shall punish all impenitent ones indeed and in truth.]"}],"5":[{"catchword":null,"tekst":"For righteousness shall be in the girdle of his loins; also truth [Or, faithfulness] shall be the girdle of his loins. [That is, he shall be clothed and adorned, not as the Kings of this World are, with outward pomp of apparel; but with righteousness, and with faithfulness, or with truth and constancy of his promises. See Psal.45.4,5. And 72.4,12. Christ gi9veth his elect that which he promised them]"}],"6":[{"catchword":null,"tekst":"And the wolf shall converse [Or, dwell, lodge] with the lamb, and the leopard lie down with the kid; and the calf, and the young lion, and the fatling [Or, the fatted cattle] together, [That is, evil, wicked, fierce, savage men, both Jews and Gentiles, shall by the preaching of Christ, and his Ministers, and by the inward working of his Holy Spirit, be so changed, that laying aside their evil dispositions, they shall be clothed with the spirit of love and meekness, so that they shall live and converse gently and civilly with others, without doing them any harm or mischief. See Isai.65.25. Hos 2:18.] and a little boy shall drive them. [That is, the least Disciple or Minister of the Lord Christ, though he be mean and base in the eyes of men, shall lead and guide them by the Doctrine of the Gospel: for there shall be voluntary, or willing obedience among men, they being inwardly moved by the Spirit of God, to receive and embrace the Word of the Lord.]"}],"7":[{"catchword":null,"tekst":"The cow and the she-bear shall feed together, their young ones shall lie down (together) and the lion shall eat straw like the ox. [That is, the Princes and Lords or great ones of the World, shall suffer themselves to be led and guided by the preaching of the Word of God, as well as persons of inferior rank and quality: They shall be all of them fed and nourished with one kind of meat or food; to wit, with the Word of God]"}],"8":[{"catchword":null,"tekst":"And a sucking child shall sport himself [That is, it shall play] upon the hole of an adder; [See the annotat. Deut.32. on vers.33. and Psal.58.5. The meaning is, the meanest in the Church of God shall be in no fear or danger, that the great and mighty one should any way hurt or mischieve them, forasmuch as they shall be converted unto Christ, as well as the meanest, as appeareth further, vers.9.] and a weaned child shall put forth his hand into the cockatrice Den. [That is, those whose hearts were before full of venom or poison, shall be so cleansed and purified, that it shall be a recreation and delight to converse with them]"}],"9":[{"catchword":null,"tekst":"They shall no where hurt nor destroy in all the mountain of my holiness: for the earth shall be full of the knowledge of the LORD, as the waters do cover (the bottom of) the Sea., [This verse propoundeth the allegories contained in vers.6.7,8. The meaning is, Among believers that shall come to the true knowledge of God, one shall not hurt nor mischieve another, nor offer wrong or violence to each other; but they shall jointly and with one accord strive and endeavour to lead a godly, upright and honest life. See Isai.26.25. (They shall no where hurt, nor destroy in all the mountain of my holiness.) Or, of my Sanctuary; that is, in the Church or Congregation of believers. For in the Temple, which was built upon mount Zion, the Faithful were wont to assemble together. (for the earth) That is, the elect of God, or his children, that dwell on the earth. (shall be full of the knowledge of the Lord, as the waters cover (the bottom of) the sea) Hebr. As the waters cover the sea. Here the sea signifieth as much as the bottom of the sea. And the meaning is, that the knowledge of the Lord shall richly or plentifully flow and abound in all places of the world.]"}],"10":[{"catchword":null,"tekst":"For it shall come to pass in that day, that the Gentiles shall enquire after the root of Isai, [That is, the Gentiles, shall hear the preaching of the Gospel with delight, and shall by it learn to know Christ. Others understand the words thus, the gentiles shall by that root, to wit, Christ, learn to know, and serve God, and consequently obtain eternal life. By the root of Isai here is meant Christ, who should sprout and issue forth from Isai the Father of David, as from a root. See above vers.1. and Rom 15:12.] which shall stand [Or, which shall be set up; to wit, by the preaching of the Gospel] for a banner of the nations, [It is a Prophecy concerning the calling of the Gentiles to the knowledge of Christ. (for a banner of the nations,) That is, whereunto the people or nations of all the earth shall flock, and meet together, in the unity of faith. See Genes.49. on vers, 10.] and his rest shall be glorious. [Hebr. His rest shall be honour, or, glory: That is, his church wherein he resteth, and taketh delight, it shall be full of honour and glory; namely, being sanctified by the Holy Ghost in some measure here in this life, and at last being fully & perfectly sanctified and glorified both in soul and body in the life to come. Oth. His rest shall be for glory. That is, it shall be glory to rest upon him, or to seek rest in him]"}],"11":[{"catchword":null,"tekst":"For it shall come to pass in that day, that the LORD shall set to his hand the second time, to recover the remnant of his people, which shall be left from Assyria, and from Egypt, and from Pathros, and from Ethiopia, and from Elam, and from Sinear, and from Hamath, and from the Islands of the Sea. [Here the Prophet giveth a reason, and sheweth the glorious rest, which the Messiahs should give unto his people. (For it shall come to pass in that day, that the LORD shall set to his hand, the second timer, &c.) As if he had said, as he stretched out his hand in former time, to deliver his people out of the land of Egypt: So shall he stretch it our again, for their deliverance or redemption, against their enemies both bodily and spiritual, sin and Satan. (to purchase) To wit, by his blood and Spirit, Act.20.28. Eph 5:25,26,27. The Hebrew word signifieth to buy, redeem, ransom, to get, obtain, to appropriate to ones self, to make ones own, or, ones peculiar treasure. (the remnant of his people, which shall be self, &c.) To wit, those that should be converted unto Christ by the preaching of the Gospel, and should be made partakers of his Kingdom. See Rom 11:25,26. (and from Pathros) See Genes.10.13. In which chapter mention is likewise made of the rest of the nations and people that are here named. But of Hamath, see 2 Sam.8.9. (and from the Islands of the Sea.) That is, from the Islands lying beyond the Sea, or, by the Sea side.]"}],"12":[{"catchword":null,"tekst":"And he [To wit, the LORD] shall set up a banner among the Gentiles, [As above vers.10.] and he shall assemble the expelled of Israel, [Oth. That he may assemble, &c.] and gather together the dispersed of Juda, from the four ends, [Or, corners, climates. See Job 37:3. (and gather together, &c.) To wit, in Christ, who gathereth his Church from the four corners of the World, so that in him is spiritually fulfilled, that which God promised, Deut.30.4.]"}],"13":[{"catchword":null,"tekst":"And the envy of Ephraim [Understand here that envy, wherewith Ephraim envied the tribe of Juda: And understand under the name of Ephraim, the ten tribes of Israel] shall depart, and the adversaries of Juda shall be cut off: Ephraim shall not envy Juda, [The meaning is, the church of Christ shall be united and live together in an holy peace] and Juda shall not distress [Or, set upon in an hostile manner, vex, torment, oppress] Ephraim. [The meaning is, there shall be no hatred nor envy among Christians, as there was formerly between Ephraim and Juda]"}],"14":[{"catchword":null,"tekst":"But they [To wit, Ephraim and Juda together] shall fire upon the shoulder of the Philistines toward the west, [This is spoken in a spiritual way; namely so, as that the faithful Israelites shall by the preaching of the Gospel, suddenly fall upon the Gentiles, lay hold of them, and conquer them, because they shall bring some of them to the Christian faith, and shall convince the rest, so that they shall have no excuse in the sight and presence of God. However the Prophet doth here intimate by this comparison, (taken from a bird of prey, or from a fox, that falleth upon poultry, and the like) the victory, which the Lord should grant unto his Church against here enemies; as the same was performed, or accomplished by the Apostles, and other Pastors and Teachers. (toward the west,) Hebr. Toward the Sea. The midland-sea lieth Westward of the land Canaan. The Prophet doth intimate here in this verse, that the Gospel should be preached both in the east and in the west. See Mat 8:11.] (and) they shall spoil them of the East [Hebr. The children of the east. See Job 1:3. and the annotat. There.] together: [Thus the prophet speaketh improperly of the preaching of the Word of God, as desiring to certify, that the church of Christ should assault and conquer all her enemies, by the power and blessing of the Lord, to bring the elect under his obedience] they shall lay their hands Hebr. The sending of their hands shall be] (upon) Edom and Moab, [That is, upon the Edomites and Moabites] and the children of Ammon [That is, the Ammonites] shall be obedient unto them. [To wit, because they shall embrace the Doctrine of the Gospel with a strong and lively faith.]"}],"15":[{"catchword":null,"tekst":"The LORD shall also ban the arm of the Sea of Egypt, and be shall shake his hand against the river, by the strength of his wind; and he shall smite it in the seven streams, and the shall make that men shall go through it with shoes. [Under borrowed terms, the Prophet sheweth that all lets and hinderances shall be removed, that might lie in the lets and hinderances shall be removed, that might lie in the peoples way, for to come unto Christ. As if he had said, the Lord shall sooner cause all waters, and among the rest the seven streams of the River Nilus to be dried up, then the course of the Gospel should be stopped or stayed, as in times past he dried up the waters of the red Sea, that the people might pass through it on dry ground, or dry hood. (The Lord shall also ban) [That is, utterly destroy, or confound. (the arm) Hebr. The tongue. (of the Sea of Egypt,) To wit, of the red sea reaching unto Egypt. (and he shall shake his hand) Oth. Lift up his hand, as it were in a threatening way, as is said of Assur, above chap.10. (against the river,) To wit, Nilus, which had seven issues or streams. But some understand here the River Euphrates, Others the river Jordan. (and he shall smite it in the seven streams,) The Hebrew word Nachal signifieth here the ditches or depths, through which thew waters float, or the bottom or ground of the River, which is like a valley when the waters are gone away. (and he shall cause that men) Or, that they; to wit, the faithful. (shall go through it with shoes.) Understand withal, without wetting them, or without plucking them off that they may not be wet.]"}],"16":[{"catchword":null,"tekst":"And there shall be a heaten way for the remnant of his people, which shall be left of Assur, [The meaning is, all things shall be smoothed and planted, and be without let or hinderance, when Christ shall gather his church by the preaching of the Gospel] like as it happened unto Israel in the day that came up out of the land of Egypt. [Going dry-shod through the red sea. Exo 14:29.]"}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
