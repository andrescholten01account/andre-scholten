:"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Maar hoor nu Mijn knecht Jakob, en Israël, die Ik uitgekozen heb!","2":"Zo zegt de HEERE, uw Maker en uw Formeerder van de buik af aan, Die u helpt: Wees niet bang, o Jakob, Mijn knecht, en u, Jeschurun, die Ik uitgekozen heb!","3":"Want Ik zal water gieten op de dorstige, en stromen op het droge; Ik zal Mijn Geest op uw nageslacht gieten, en Mijn zegen op uw nakomelingen.","4":"En zij zullen uitspruiten tussen het gras, als de wilgen aan de waterbeken.","5":"Deze zal zeggen: Ik ben van de HEERE; en die zal zich noemen met de naam van Jakob; en weer een ander zal met zijn hand schrijven: Ik ben van de HEERE, en zich noemen met de naam van Israël.","6":"Zo zegt de HEERE, de Koning van Israël, en zijn Verlosser, de HEERE van de heerscharen[1]: Ik ben de Eerste, en Ik ben de Laatste, en behalve Mij is er geen God.","7":"En wie zal, zoals Ik, roepen en het verkondigen, en het op orde voor Mij zetten, sinds Ik een eeuwig volk gesteld heb? En laat ze de toekomstige dingen, en die komen zullen, hun verkondigen.","8":"Schrik niet, en wees niet bang; heb Ik het u van toen af niet doen horen en verkondigd? Want u bent Mijn getuigen: is er ook een God behalve Mij? Zeker, er is geen andere rotssteen: Ik ken er geen.","9":"De formeerders van gesneden beelden zijn allemaal samen ijdelheid, en hun gewenste dingen doen geen nut; ja, zijzelf zijn hun getuigen; zij zien niet, en zij weten niet, daarom zullen zij beschaamd worden.","10":"Wie formeert een god, of giet een beeld, dat geen nut doet?","11":"Zie, al zijn medegenoten zullen beschaamd worden, want de werkmeesters zijn uit de mensen; laat ze zich allemaal verzamelen, laat ze opstaan, zij zullen schrikken, zij zullen samen beschaamd worden.","12":"De ijzersmid maakt een bijl, en werkt in de gloed, en formeert het met hamers, en werkt het met zijn sterke arm; ook lijdt hij honger, totdat hij krachteloos wordt, hij drinkt geen water, totdat hij uitgeput raakt.","13":"De timmerman trekt het richtsnoer uit, hij tekent het af met de draad, hij maakt het effen met de schaven, en tekent het met de passer, en maakt het naar de gestalte van een man, naar de schoonheid van een mens, zodat het in het huis blijft.","14":"Als hij zich ceders afhouwt, dan neemt hij een cipresboom of een eik, en hij versterkt zich onder de bomen van het woud; hij plant een olmboom, en de regen laat die groot worden.","15":"Dan is het voor de mens om te verbranden, dan neemt hij daarvan, en warmt zich eraan; ook steekt hij het aan, en bakt er brood bij; daarenboven maakt hij er een god van, en buigt zich daarvoor, hij maakt er een gesneden beeld van, en knielt er voor neer.","16":"De helft ervan verbrandt hij in het vuur, bij de andere helft daarvan eet hij vlees; hij braadt een gebraad, en hij wordt verzadigd; ook warmt hij zichzelf, en hij zegt: Hé! ik ben warm geworden, ik heb het vuur gezien!","17":"Het overige nu daarvan maakt hij tot een god, tot zijn gesneden beeld; hij knielt er voor neer, en buigt zich, en bidt het aan, en zegt: Red mij, want u bent mijn god!","18":"Zij weten niet, en begrijpen niet, want het heeft hun ogen dichtgesmeerd, zodat zij niet zien, en hun harten, zodat zij niet begrijpen.","19":"En niemand van hen brengt het in zijn hart, en er is geen kennis en geen verstand, zodat hij zou zeggen: De helft daarvan heb ik verbrand in het vuur, ja, ook op de kolen daarvan heb ik brood gebakken, ik heb vlees daarbij gebraden, en heb het gegeten; en zou ik het overblijfsel daarvan tot een gruwel maken, zou ik neerknielen voor iets dat van een boom gekomen is?","20":"Hij voedt zich met as, het bedrogen hart heeft hem terzijde afgeleid; zodat hij zijn ziel niet redden kan, en ook niet kan zeggen: Is er niet een leugen in mijn rechterhand?","21":"Denk aan deze dingen, o Jakob, en Israël! Want u bent Mijn knecht, Ik heb u geformeerd; u bent Mijn knecht, Israël, u zult door Mij niet vergeten worden.","22":"Ik delg uw overtredingen uit als een nevel, en uw zonden als een wolk; keer terug tot Mij, want Ik heb u verlost.","23":"Zing met vreugde, u hemelen! Want de HEERE heeft het gedaan; juich, u onderste delen van de aarde! U bergen! Maak een groot gedreun met vreugdegezang, u bossen, en al het geboomte daarin! Want de HEERE heeft Jakob verlost, en Zich heerlijk gemaakt in Israël.","24":"Zo zegt de HEERE, uw Verlosser, en Die u geformeerd heeft van de buik af aan: Ik ben de HEERE, Die alles doet, Die de hemel uitbreidt, Ik alleen, en Die de aarde uitspant door Mijzelf;","25":"Die de tekenen van de leugendichters vernietigt, en de waarzeggers dol maakt; Die de wijzen achterwaarts doet keren, en die hun kennis verdwaast;","26":"Die het woord van Zijn knecht bevestigt, en de raad van Zijn boden volbrengt; Die tot Jeruzalem zegt: U zult bewoond worden; en tot de steden van Juda: U zult herbouwd worden, en Ik zal haar verwoeste plaatsen oprichten.","27":"Die tot de diepte zegt: Verdroog, en uw rivieren zal Ik doen verdrogen.","28":"Die van Kores zegt: Hij is Mijn herder, en hij zal al Mijn welbehagen volbrengen; en zegt ook tot Jeruzalem: Word gebouwd; en tot de tempel: Word gegrondvest."},"SV":{"1":"Maar hoor nu Mijn knecht Jakob, en Israël, dien Ik verkoren heb!","2":"Zo zegt de HEERE, uw Maker, en uw Formeerder van den buik af, Die u helpt: Vrees niet, o Jakob, Mijn knecht, en gij, Jeschurun, dien Ik uitverkoren heb!","3":"Want Ik zal water gieten op de dorstigen, en stromen op het droge; Ik zal Mijn Geest op uw zaad gieten, en Mijn zegen op uw nakomelingen.","4":"En zij zullen uitspruiten tussen in het gras, als de wilgen aan de waterbeken.","5":"Deze zal zeggen: Ik ben des HEEREN; en die zal *zich* noemen met den naam van Jakob; en gene zal *met* zijn hand schrijven: *Ik* *ben* des HEEREN, en zich toenoemen met den naam van Israël.","6":"Zo zegt de HEERE, de Koning van Israël, en zijn Verlosser, de HEERE der heirscharen: Ik ben de Eerste, en Ik ben de Laatste, en behalve Mij is er geen God.","7":"En wie zal, gelijk als Ik, roepen en het verkondigen, en het ordentelijk voor Mij stellen, sedert dat Ik een eeuwig volk gesteld heb? en laat ze de toekomstige dingen, en die komen zullen, hun verkondigen.","8":"Verschrikt niet, en vreest niet; heb Ik het u van toen af niet doen horen en verkondigd? Want gijlieden zijt Mijn getuigen: is er ook een God behalve Mij? Immers, is er geen *andere* rotssteen: Ik ken er geen?","9":"De formeerders van gesneden beelden zijn al te zamen ijdelheid, en hun gewenste dingen doen geen nut; ja, zij zelven zijn hun getuigen; zij zien niet, en zij weten niet, daarom zullen zij beschaamd worden.","10":"Wie formeert een god, en giet een beeld, dat geen nut doet?","11":"Ziet, al hun medegenoten zullen beschaamd worden, want de werkmeesters zijn uit de mensen; dat zij zich altemaal vergaderen, dat zij opstaan, zij zullen verschrikken, zij zullen te zamen beschaamd worden.","12":"De ijzersmid *maakt* een bijl, en werkt in den gloed, en formeert het met hamers, en werkt het met zijn sterken arm; ook lijdt hij honger, totdat hij krachteloos wordt, hij drinkt geen water, totdat hij amechtig wordt.","13":"De timmerman trekt het richtsnoer uit, hij tekent het af met den draad, hij maakt het *effen* met de schaven, en tekent het met den passer, en maakt het naar de beeltenis eens mans, naar de schoonheid van een mens, dat het in het huis blijve.","14":"Als hij zich cederen afhouwt, zo neemt hij een cypressenboom of een eik, en hij versterkt zich onder de bomen des wouds; hij plant een olmboom, en de regen maakt *dien* groot.","15":"Dan is het voor den mens om te verbranden, dan neemt hij daarvan, en warmt er zich bij; ook ontsteekt hij het, en bakt er brood bij; daarenboven maakt hij er een god van, en buigt zich *daarvoor*, hij maakt er een gesneden beeld van, en knielt er voor neder.","16":"Zijn helft brandt hij in het vuur, bij de *andere* helft daarvan eet hij vlees; hij braadt een gebraad, en hij wordt verzadigd; ook warmt hij zichzelven, en hij zegt: Hei! ik ben warm geworden, ik heb het vuur gezien!","17":"Het overige nu daarvan maakt hij tot een god, tot zijn gesneden beeld; hij knielt er voor neder, en buigt zich, en bidt het aan, en zegt: Red mij, want gij zijt mijn god!","18":"Zij weten niet, en verstaan niet, want het heeft hun ogen bestreken, dat zij niet zien, *en* hun harten, dat zij niet verstaan.","19":"En niemand *van* *hen* brengt het in zijn hart, en er is noch kennis noch verstand, dat hij zeggen zou: De helft daarvan heb ik verbrand in het vuur, ja, ook op de kolen daarvan heb ik brood gebakken, ik heb vlees *daarbij* gebraden, en heb het gegeten; en zou ik het overblijfsel daarvan tot een gruwel maken, zou ik nederknielen voor hetgeen van een boom gekomen is?","20":"Hij voedt zich met as, het bedrogen hart heeft hem *ter* *zijde* afgeleid; zodat hij zijn ziel niet redden kan, noch zeggen: Is er niet een leugen in mijn rechterhand?","21":"Gedenk aan deze dingen, o Jakob, en Israël! Want gij zijt Mijn knecht, Ik heb u geformeerd; gij zijt Mijn knecht, Israël, gij zult van Mij niet vergeten worden.","22":"Ik delg uw overtredingen uit als een nevel, en uw zonden als een wolk; keer weder tot Mij, want Ik heb u verlost.","23":"Zingt met vreugde, gij hemelen! want de HEERE heeft het gedaan; juicht, gij benedenste delen der aarde! gij bergen! maakt een groot gedreun met vreugdegezang, gij bossen, en alle geboomte daarin! Want de HEERE heeft Jakob verlost, en Zich heerlijk gemaakt in Israël.","24":"Alzo zegt de HEERE, uw Verlosser, en Die u geformeerd heeft van den buik af: Ik ben de HEERE, Die alles doet, Die den hemel uitbreidt, Ik alleen, en Die de aarde uitspant door Mijzelven;","25":"Die de tekenen der leugendichters vernietigt, en de waarzeggers dol maakt; Die de wijzen achterwaarts doet keren, en *Die* hun wetenschap verdwaast;","26":"Die het woord Zijns knechts bevestigt, en den raad Zijner boden volbrengt; Die tot Jeruzalem zegt: Gij zult bewoond worden; en tot de steden van Juda: Gij zult herbouwd worden, en Ik zal haar verwoeste plaatsen oprichten.","27":"Die tot de diepte zegt: Verdroog, en uw rivieren zal Ik verdrogen.","28":"Die van Cores zegt: Hij is Mijn herder, en hij zal al Mijn welgevallen volbrengen; zeggende ook tot Jeruzalem: Word gebouwd; en *tot* den tempel: Word gegrond."},"KJV":{"1":"Yet now hear, O Jacob my servant; and Israel, whom I have chosen:","2":"Thus saith the LORD that made thee, and formed thee from the womb, *which* will help thee; Fear not, O Jacob, my servant; and thou, Jesurun, whom I have chosen.","3":"For I will pour water upon him that is thirsty, and floods upon the dry ground: I will pour my spirit upon thy seed, and my blessing upon thine offspring:","4":"And they shall spring up *as* among the grass, as willows by the water courses.","5":"One shall say, I *am* the LORD'S; and another shall call *himself* by the name of Jacob; and another shall subscribe *with* his hand unto the LORD, and surname *himself* by the name of Israel.","6":"Thus saith the LORD the King of Israel, and his redeemer the LORD of hosts; I *am* the first, and I *am* the last; and beside me *there is* no God.","7":"And who, as I, shall call, and shall declare it, and set it in order for me, since I appointed the ancient people? and the things that are coming, and shall come, let them shew","8":"Fear ye not, neither be afraid: have not I told thee from that time, and have declared *it*? ye *are* even my witnesses. Is there a God beside me? yea, *there is* no God; I know","9":"They that make a graven image *are* all of them vanity; and their delectable things shall not profit; and they *are* their own witnesses; they see not, nor know; that they may be ashamed.","10":"Who hath formed a god, or molten a graven image *that* is profitable for nothing?","11":"Behold, all his fellows shall be ashamed: and the workmen, they *are* of men: let them all be gathered together, let them stand up; *yet* they shall fear, *and* they shall be ashamed together.","12":"The smith with the tongs both worketh in the coals, and fashioneth it with hammers, and worketh it with the strength of his arms: yea, he is hungry, and his strength faileth: he drinketh no water, and is faint.","13":"The carpenter stretcheth out *his* rule; he marketh it out with a line; he fitteth it with planes, and he marketh it out with the compass, and maketh it after the figure of a man, according to the beauty of a man; that it may remain in the house.","14":"He heweth him down cedars, and taketh the cypress and the oak, which he strengtheneth for himself among the trees of the forest: he planteth an ash, and the rain doth nourish","15":"Then shall it be for a man to burn: for he will take thereof, and warm himself; yea, he kindleth *it*, and baketh bread; yea, he maketh a god, and worshippeth *it*; he maketh it a graven image, and falleth down","16":"He burneth part thereof in the fire; with part thereof he eateth flesh; he roasteth roast, and is satisfied: yea, he warmeth *himself*, and saith, Aha, I am warm, I have seen the fire:","17":"And the residue thereof he maketh a god, *even* his graven image: he falleth down unto it, and worshippeth *it*, and prayeth unto it, and saith, Deliver me; for thou *art* my god.","18":"They have not known nor understood: for he hath shut their eyes, that they cannot see; *and* their hearts, that they cannot understand.","19":"And none considereth in his heart, neither *is there* knowledge nor understanding to say, I have burned part of it in the fire; yea, also I have baked bread upon the coals thereof; I have roasted flesh, and eaten *it*: and shall I make the residue thereof an abomination? shall I fall down to the stock of a tree?","20":"He feedeth on ashes: a deceived heart hath turned him aside, that he cannot deliver his soul, nor say, *Is there* not a lie in my right hand?","21":"Remember these, O Jacob and Israel; for thou *art* my servant: I have formed thee; thou *art* my servant: O Israel, thou shalt not be forgotten","22":"I have blotted out, as a thick cloud, thy transgressions, and, as a cloud, thy sins: return unto me; for I have redeemed","23":"Sing, O ye heavens; for the LORD hath done *it*: shout, ye lower parts of the earth: break forth into singing, ye mountains, O forest, and every tree therein: for the LORD hath redeemed Jacob, and glorified himself in Israel.","24":"Thus saith the LORD, thy redeemer, and he that formed thee from the womb, I *am* the LORD that maketh all *things*; that stretcheth forth the heavens alone; that spreadeth abroad the earth","25":"That frustrateth the tokens of the liars, and maketh diviners mad; that turneth wise *men* backward, and maketh their knowledge foolish;","26":"That confirmeth the word of his servant, and performeth the counsel of his messengers; that saith to Jerusalem, Thou shalt be inhabited; and to the cities of Judah, Ye shall be built, and I will raise up the decayed places","27":"That saith to the deep, Be dry, and I will dry up thy rivers:","28":"That saith of Cyrus, *He is* my shepherd, and shall perform all my pleasure: even saying to Jerusalem, Thou shalt be built; and to the temple, Thy foundation shall be laid."}},"tsk":{"1":[{"kopje":"nu","refs":["Jes 42:23","Jes 48:16-18","Jes 55:3","Ps 81:12-14","Jer 4:7","Luk 13:34","Hebr 3:7","Hebr 3:8"]},{"kopje":"o Jakob","refs":["Jes 41:8","Jes 43:1","Gen 17:7","Deut 7:6-8","Ps 105:6","Ps 105:42","Ps 105:43","Jer 30:10","Jer 46:27","Jer 46:28","Rom 11:5","Rom 11:6"]}],"2":[{"kopje":"uw Maker","refs":["Jes 44:21","Jes 43:1","Jes 43:7","Jes 43:21"]},{"kopje":"Formeerder","refs":["Jes 44:24","Jes 46:3","Jes 46:4","Jes 49:1","Ps 46:6"  class=\"wl\" data-l=\"L3\" data-code=\"H7462\">Mijn</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H7462\">herder</span>, <span class=\"wl\" data-l=\"L4\" data-code=\"H2656\">en</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H2656\">hij</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H2656\">zal</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H2656\">al</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H2656\">Mijn</span> welbehagen <span class=\"wl\" data-l=\"L5\" data-code=\"H7999\">volbrengen</span>; en zegt <span class=\"wl\" data-l=\"L6\" data-code=\"H3389\">ook</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H3389\">tot</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H3389\">Jeruzalem</span>: <span class=\"wl\" data-l=\"L6\" data-code=\"H3389\">Word</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H1129\">gebouwd</span>; <span class=\"wl\" data-l=\"L8\" data-code=\"H1964\">en</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H1964\">tot</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H1964\">de</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H1964\">tempel</span>: <span class=\"wl\" data-l=\"L8\" data-code=\"H1964\">Word</span> gegrondvest."},"koppeling_kjv":{"1":"Yet now <span class=\"wl wl-kjv\" data-code=\"H8085\">hear,</span> O <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> my <span class=\"wl wl-kjv\" data-code=\"H5650\">servant;</span> and <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> whom I have chosen:","2":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> that <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> thee, and <span class=\"wl wl-kjv\" data-code=\"H3335\">formed</span> thee from the <span class=\"wl wl-kjv\" data-code=\"H990\">womb,</span> which will <span class=\"wl wl-kjv\" data-code=\"H5826\">help</span> thee; <span class=\"wl wl-kjv\" data-code=\"H3372\">Fear</span> not, O <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> my <span class=\"wl wl-kjv\" data-code=\"H5650\">servant;</span> and thou, <span class=\"wl wl-kjv\" data-code=\"H3484\">Jesurun,</span> whom I have chosen.","3":"For I will <span class=\"wl wl-kjv\" data-code=\"H3332\">pour</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> upon him that is <span class=\"wl wl-kjv\" data-code=\"H6771\">thirsty,</span> and <span class=\"wl wl-kjv\" data-code=\"H5140\">floods</span> upon the dry <span class=\"wl wl-kjv\" data-code=\"H3004\">ground:</span> I will <span class=\"wl wl-kjv\" data-code=\"H3332\">pour</span> my <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> upon thy <span class=\"wl wl-kjv\" data-code=\"H2233\">seed,</span> and my <span class=\"wl wl-kjv\" data-code=\"H1293\">blessing</span> upon thine offspring:","4":"And they shall spring <span class=\"wl wl-kjv\" data-code=\"H6779\">up</span> as <span class=\"wl wl-kjv\" data-code=\"H996\">among</span> the <span class=\"wl wl-kjv\" data-code=\"H2682\">grass,</span> as <span class=\"wl wl-kjv\" data-code=\"H6155\">willows</span> by the <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> courses.","5":"One shall <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S;</span> and another shall <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> himself by the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob;</span> and another shall <span class=\"wl wl-kjv\" data-code=\"H3789\">subscribe</span> with his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H3655\">surname</span> himself by the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of Israel.","6":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">King</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and his <span class=\"wl wl-kjv\" data-code=\"H1350\">redeemer</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts;</span> I am the <span class=\"wl wl-kjv\" data-code=\"H7223\">first,</span> and I am the <span class=\"wl wl-kjv\" data-code=\"H314\">last;</span> and <span class=\"wl wl-kjv\" data-code=\"H1107\">beside</span> me there is no God.","7":"And who, as I, shall <span class=\"wl wl-kjv\" data-code=\"H7121\">call,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H5046\">declare</span> it, and set it in <span class=\"wl wl-kjv\" data-code=\"H6186\">order</span> for me, since I <span class=\"wl wl-kjv\" data-code=\"H7760\">appointed</span> the <span class=\"wl wl-kjv\" data-code=\"H5769\">ancient</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">people?</span> and the things that are <span class=\"wl wl-kjv\" data-code=\"H857\">coming,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> let them shew","8":"<span class=\"wl wl-kjv\" data-code=\"H6342\">Fear</span> ye not, neither be <span class=\"wl wl-kjv\" data-code=\"H7297\">afraid:</span> have not I <span class=\"wl wl-kjv\" data-code=\"H8085\">told</span> thee from that <span class=\"wl wl-kjv\" data-code=\"H227\">time,</span> and have <span class=\"wl wl-kjv\" data-code=\"H5046\">declared</span> it? ye are even my <span class=\"wl wl-kjv\" data-code=\"H5707\">witnesses.</span> Is <span class=\"wl wl-kjv\" data-code=\"H3426\">there</span> a <span class=\"wl wl-kjv\" data-code=\"H433\">God</span> <span class=\"wl wl-kjv\" data-code=\"H1107\">beside</span> me? yea, there is no <span class=\"wl wl-kjv\" data-code=\"H6697\">God;</span> I know","9":"They that <span class=\"wl wl-kjv\" data-code=\"H3335\">make</span> a graven <span class=\"wl wl-kjv\" data-code=\"H6459\">image</span> are all of them <span class=\"wl wl-kjv\" data-code=\"H8414\">vanity;</span> and their delectable <span class=\"wl wl-kjv\" data-code=\"H2530\">things</span> shall not <span class=\"wl wl-kjv\" data-code=\"H3276\">profit;</span> and they are their own <span class=\"wl wl-kjv\" data-code=\"H5707\">witnesses;</span> they <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> not, nor <span class=\"wl wl-kjv\" data-code=\"H3045\">know;</span> that they may be ashamed.","10":"Who hath <span class=\"wl wl-kjv\" data-code=\"H3335\">formed</span> a <span class=\"wl wl-kjv\" data-code=\"H410\">god,</span> or <span class=\"wl wl-kjv\" data-code=\"H5258\">molten</span> a graven <span class=\"wl wl-kjv\" data-code=\"H6459\">image</span> that is <span class=\"wl wl-kjv\" data-code=\"H3276\">profitable</span> for nothing?","11":"Behold, all his <span class=\"wl wl-kjv\" data-code=\"H2270\">fellows</span> shall be <span class=\"wl wl-kjv\" data-code=\"H954\">ashamed:</span> and the <span class=\"wl wl-kjv\" data-code=\"H2796\">workmen,</span> they are of <span class=\"wl wl-kjv\" data-code=\"H120\">men:</span> let them all be gathered <span class=\"wl wl-kjv\" data-code=\"H6908\">together,</span> let them stand <span class=\"wl wl-kjv\" data-code=\"H5975\">up;</span> yet they shall <span class=\"wl wl-kjv\" data-code=\"H6342\">fear,</span> and they shall be <span class=\"wl wl-kjv\" data-code=\"H954\">ashamed</span> together.","12":"The <span class=\"wl wl-kjv\" data-code=\"H1270\">smith</span> with the <span class=\"wl wl-kjv\" data-code=\"H4621\">tongs</span> both <span class=\"wl wl-kjv\" data-code=\"H6466\">worketh</span> in the <span class=\"wl wl-kjv\" data-code=\"H6352\">coals,</span> and <span class=\"wl wl-kjv\" data-code=\"H3335\">fashioneth</span> it with <span class=\"wl wl-kjv\" data-code=\"H4717\">hammers,</span> and <span class=\"wl wl-kjv\" data-code=\"H6466\">worketh</span> it with the <span class=\"wl wl-kjv\" data-code=\"H3581\">strength</span> of his <span class=\"wl wl-kjv\" data-code=\"H2220\">arms:</span> yea, he is <span class=\"wl wl-kjv\" data-code=\"H7457\">hungry,</span> and his <span class=\"wl wl-kjv\" data-code=\"H3581\">strength</span> <span class=\"wl wl-kjv\" data-code=\"H369\">faileth:</span> he <span class=\"wl wl-kjv\" data-code=\"H8354\">drinketh</span> no <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and is faint.","13":"The <span class=\"wl wl-kjv\" data-code=\"H2796\">carpenter</span> stretcheth <span class=\"wl wl-kjv\" data-code=\"H5186\">out</span> his <span class=\"wl wl-kjv\" data-code=\"H6957\">rule;</span> he marketh it <span class=\"wl wl-kjv\" data-code=\"H8388\">out</span> with a <span class=\"wl wl-kjv\" data-code=\"H8279\">line;</span> he <span class=\"wl wl-kjv\" data-code=\"H6213\">fitteth</span> it with <span class=\"wl wl-kjv\" data-code=\"H4741\">planes,</span> and he marketh it <span class=\"wl wl-kjv\" data-code=\"H8388\">out</span> with the <span class=\"wl wl-kjv\" data-code=\"H4230\">compass,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">maketh</span> it after the <span class=\"wl wl-kjv\" data-code=\"H8403\">figure</span> of a <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> according to the <span class=\"wl wl-kjv\" data-code=\"H8597\">beauty</span> of a <span class=\"wl wl-kjv\" data-code=\"H120\">man;</span> that it may <span class=\"wl wl-kjv\" data-code=\"H3427\">remain</span> in the house.","14":"He heweth him <span class=\"wl wl-kjv\" data-code=\"H3772\">down</span> <span class=\"wl wl-kjv\" data-code=\"H730\">cedars,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">taketh</span> the <span class=\"wl wl-kjv\" data-code=\"H8645\">cypress</span> and the <span class=\"wl wl-kjv\" data-code=\"H437\">oak,</span> which he <span class=\"wl wl-kjv\" data-code=\"H553\">strengtheneth</span> for himself among the <span class=\"wl wl-kjv\" data-code=\"H6086\">trees</span> of the <span class=\"wl wl-kjv\" data-code=\"H3293\">forest:</span> he <span class=\"wl wl-kjv\" data-code=\"H5193\">planteth</span> an <span class=\"wl wl-kjv\" data-code=\"H766\">ash,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1653\">rain</span> doth nourish","15":"Then shall it be for a <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> to <span class=\"wl wl-kjv\" data-code=\"H1197\">burn:</span> for he will <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> thereof, and <span class=\"wl wl-kjv\" data-code=\"H2552\">warm</span> himself; yea, he <span class=\"wl wl-kjv\" data-code=\"H5400\">kindleth</span> it, and <span class=\"wl wl-kjv\" data-code=\"H644\">baketh</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread;</span> yea, he <span class=\"wl wl-kjv\" data-code=\"H6466\">maketh</span> a <span class=\"wl wl-kjv\" data-code=\"H410\">god,</span> and <span class=\"wl wl-kjv\" data-code=\"H7812\">worshippeth</span> it; he <span class=\"wl wl-kjv\" data-code=\"H6213\">maketh</span> it a graven <span class=\"wl wl-kjv\" data-code=\"H6459\">image,</span> and falleth down","16":"He <span class=\"wl wl-kjv\" data-code=\"H8313\">burneth</span> <span class=\"wl wl-kjv\" data-code=\"H2677\">part</span> thereof <span class=\"wl wl-kjv\" data-code=\"H1119\">in</span> the <span class=\"wl wl-kjv\" data-code=\"H784\">fire;</span> with <span class=\"wl wl-kjv\" data-code=\"H2677\">part</span> thereof he <span class=\"wl wl-kjv\" data-code=\"H398\">eateth</span> <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh;</span> he <span class=\"wl wl-kjv\" data-code=\"H6740\">roasteth</span> <span class=\"wl wl-kjv\" data-code=\"H6748\">roast,</span> and is <span class=\"wl wl-kjv\" data-code=\"H7646\">satisfied:</span> yea, he <span class=\"wl wl-kjv\" data-code=\"H2552\">warmeth</span> himself, and <span class=\"wl wl-kjv\" data-code=\"H559\">saith,</span> <span class=\"wl wl-kjv\" data-code=\"H1889\">Aha,</span> I am <span class=\"wl wl-kjv\" data-code=\"H2552\">warm,</span> I have <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> the fire:","17":"And the <span class=\"wl wl-kjv\" data-code=\"H7611\">residue</span> thereof he <span class=\"wl wl-kjv\" data-code=\"H6213\">maketh</span> a <span class=\"wl wl-kjv\" data-code=\"H410\">god,</span> even his graven <span class=\"wl wl-kjv\" data-code=\"H6459\">image:</span> he falleth <span class=\"wl wl-kjv\" data-code=\"H5456\">down</span> unto it, and <span class=\"wl wl-kjv\" data-code=\"H7812\">worshippeth</span> it, and <span class=\"wl wl-kjv\" data-code=\"H6419\">prayeth</span> unto it, and <span class=\"wl wl-kjv\" data-code=\"H559\">saith,</span> <span class=\"wl wl-kjv\" data-code=\"H5337\">Deliver</span> me; for thou art my god.","18":"They have not <span class=\"wl wl-kjv\" data-code=\"H3045\">known</span> nor <span class=\"wl wl-kjv\" data-code=\"H995\">understood:</span> for he hath <span class=\"wl wl-kjv\" data-code=\"H2902\">shut</span> their <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> that they cannot <span class=\"wl wl-kjv\" data-code=\"H7200\">see;</span> and their <span class=\"wl wl-kjv\" data-code=\"H3826\">hearts,</span> that they cannot understand.","19":"And none <span class=\"wl wl-kjv\" data-code=\"H7725\">considereth</span> in his <span class=\"wl wl-kjv\" data-code=\"H3820\">heart,</span> neither is there <span class=\"wl wl-kjv\" data-code=\"H1847\">knowledge</span> nor <span class=\"wl wl-kjv\" data-code=\"H8394\">understanding</span> to <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> I have <span class=\"wl wl-kjv\" data-code=\"H8313\">burned</span> <span class=\"wl wl-kjv\" data-code=\"H2677\">part</span> of it <span class=\"wl wl-kjv\" data-code=\"H1119\">in</span> the <span class=\"wl wl-kjv\" data-code=\"H784\">fire;</span> yea, also I have <span class=\"wl wl-kjv\" data-code=\"H644\">baked</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> upon the <span class=\"wl wl-kjv\" data-code=\"H1513\">coals</span> thereof; I have <span class=\"wl wl-kjv\" data-code=\"H6740\">roasted</span> <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh,</span> and <span class=\"wl wl-kjv\" data-code=\"H398\">eaten</span> it: and shall I <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> the <span class=\"wl wl-kjv\" data-code=\"H3499\">residue</span> thereof an <span class=\"wl wl-kjv\" data-code=\"H8441\">abomination?</span> shall I fall <span class=\"wl wl-kjv\" data-code=\"H5456\">down</span> to the <span class=\"wl wl-kjv\" data-code=\"H944\">stock</span> of a tree?","20":"He <span class=\"wl wl-kjv\" data-code=\"H7462\">feedeth</span> on <span class=\"wl wl-kjv\" data-code=\"H665\">ashes:</span> a <span class=\"wl wl-kjv\" data-code=\"H2048\">deceived</span> <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> hath turned him <span class=\"wl wl-kjv\" data-code=\"H5186\">aside,</span> that he cannot <span class=\"wl wl-kjv\" data-code=\"H5337\">deliver</span> his <span class=\"wl wl-kjv\" data-code=\"H5315\">soul,</span> nor <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Is there not a <span class=\"wl wl-kjv\" data-code=\"H8267\">lie</span> in my right hand?","21":"<span class=\"wl wl-kjv\" data-code=\"H2142\">Remember</span> these, O <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> and <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> for thou art my <span class=\"wl wl-kjv\" data-code=\"H5650\">servant:</span> I have <span class=\"wl wl-kjv\" data-code=\"H3335\">formed</span> thee; thou art my <span class=\"wl wl-kjv\" data-code=\"H5650\">servant:</span> O <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> thou shalt not be forgotten","22":"I have blotted <span class=\"wl wl-kjv\" data-code=\"H4229\">out,</span> as a thick <span class=\"wl wl-kjv\" data-code=\"H5645\">cloud,</span> thy <span class=\"wl wl-kjv\" data-code=\"H6588\">transgressions,</span> and, as a <span class=\"wl wl-kjv\" data-code=\"H6051\">cloud,</span> thy <span c ode=\"H7999\">perform</span> all my <span class=\"wl wl-kjv\" data-code=\"H2656\">pleasure:</span> even <span class=\"wl wl-kjv\" data-code=\"H559\">saying</span> to <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> Thou shalt be <span class=\"wl wl-kjv\" data-code=\"H1129\">built;</span> and to the <span class=\"wl wl-kjv\" data-code=\"H1964\">temple,</span> Thy foundation shall be laid."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Jakob,","tekst":"Door Jakob en Israël worden hier verstaan de uitverkorenen onder de Joden."}],"2":[{"catchword":"uw Maker . . . uw Formeerder","tekst":"Zie boven Isa 43:1 ."},{"catchword":"van den buik af,","tekst":"Hij wil zeggen, van dien tijd af toen gij in uwer moeder licham zijt ontvangen; of van dat gij uit uwer moederbuik zijt in de wereld gekomen; zie Jdg 13:5 ."},{"catchword":"Die u helpt","tekst":"Dat is, die gewoon is u te helpen."},{"catchword":"Jeschurun,","tekst":"Zie de aantekening Deu 32:15 , alwaar Mozes dezen naam het volk Gods geeft."}],"3":[{"catchword":"water gieten","tekst":"Dat is, den Heiligen Geest, gelijk straks verklaard wordt."},{"catchword":"de dorstigen,","tekst":"Die naar de gerechtigheid dorsten; Mat 5:6 ."},{"catchword":"stromen","tekst":"Dit is hetzelfde, dat straks gezegd is."},{"catchword":"op het droge;","tekst":"Dat is, op die, welken van nature noch zaligmakende kennis van God hebben noch tot enige goede werken bekwaam zijn."},{"catchword":"op uw zaad","tekst":"Dat is, op uwe nakomelingen, zonen en dochters."},{"catchword":"op uw nakomelingen","tekst":"Of, spruiten; zie Job 5:25 . Zie ook Isa 22:24 ."}],"4":[{"catchword":"tussen","tekst":"Of, als tussen het gras."}],"5":[{"catchword":"Deze . . . die","tekst":"De zin is: Zo de gelovige Joden als de gelovige heidenen zullen toelopen tot den Heere hem kennende voor hunnen Heere en Meester, en zich onder hem begevende, alsmede tot zijne kerk behorende; zie Psa 87:4 , enz."},{"catchword":"met den naam van Israël","tekst":"Dat is een Israëliet, een gelovige of een Christen, gelijk de gelovigen in het Nieuwe Testament genoemd worden; zij zijn geestelijkerwijze Israëlieten en kinderen van Abraham. Zie Rom 4:11-12 , en Rom 11:26 ; idem, Gal 3:29 , en Gal 6:16 ."}],"6":[{"catchword":"zijn Verlosser,","tekst":"Te weten van Israël."},{"catchword":"Ik ben de Eerste,","tekst":"God is zonder begin en zonder einde."}],"7":[{"catchword":"wie zal,","tekst":"Wat god onder de goden der heidenen."},{"catchword":"roepen","tekst":"Als God iets roept is het straks daar; met zijn woord kan Hij voortbrengen zelfs hetgeen nog niet is; Hij geeft allen creaturen het wezen door zijn woord; Hij onderhoudt en regeert ook alle dingen door zijn almachtige voorzienigheid; ook voorzegt Hij, als het Hem belieft, toekomende dingen."},{"catchword":"ordentelijk","tekst":"Te weten gelijk Ik ze eerst geschapen en in verscheidene landen uitgespreid heb."},{"catchword":"een eeuwig volk","tekst":"Te weten een uitverkoren volk, hetwelk in eeuwigheid bij mij zal leven en zonder overlast van mij onderhouden worden, beroepen door de predikatie van mijn Woord."},{"catchword":"En","tekst":"Anders: trots dat zij hun, enz. Isa 41:22 ."},{"catchword":"laat ze de toekomstige","tekst":"Te weten die valse goden."},{"catchword":"hun verkondigen","tekst":"Hunne dienaars."}],"8":[{"catchword":"Verschrikt niet,","tekst":"Of, weest niet vervaard, o gij mijn volk, maar vertrouwt op mij."},{"catchword":"van toen af","tekst":"Te weten van dien tijd af, toen Ik mij een eeuwig volk gezet heb, vs.7."},{"catchword":"niet doen horen","tekst":"Te weten dat Ik de enige, eeuwige ware God ben, gelijk Ik zulks ten allen tijde heb doen blijken."},{"catchword":"Mijn getuigen","tekst":"Gelijk Isa 43:10 ."},{"catchword":"geen andere","tekst":"Dat is, geen ander God onder wiens bescherming men vrijelijk schuilen en blijven kan. Zie Deu 32:4 ."}],"9":[{"catchword":"gesneden beelden","tekst":"Versta hieronder allerlei afgodische beelden."},{"catchword":"hun gewenste dingen","tekst":"Dat is, hun schoonste en kostelijkste sieraad, met hetwelk zij versierd en behangen zijn. Of versta hier door gewenste dingen hunne beelden, waar zij om wensen en waar zij hun lust in hebben."},{"catchword":"zelven zijn","tekst":"Te weten der afgoden, aan welke de afgodendienaars hunnen lust hebben."},{"catchword":"hun","tekst":"Te weten der afgodendienaars."},{"catchword":"getuigen;","tekst":"Dat is, zij overtuigen hen in hunne conscientiën dat zij ijdele en nietige dingen zijn, terwijl zij niet zien noch verstaan. Zie Psa 115:5 ."},{"catchword":"daarom zullen","tekst":"Of, opdat zij beschaamd worden. Dit geschiedt aldus door de regering Gods, opdat de afgodendienaars te schande zouden komen."},{"catchword":"zij beschaamd worden","tekst":"Te weten de afgodendienaars."}],"10":[{"catchword":"Wie formeert","tekst":"Dit schijnt te zijn een vraag van de afgodendienaars, die in de naaste verzen wordt beantwoord. Of men kan het nemen voor Gods woorden, die de dwaasheid der afgodendienaars aldus bespot."},{"catchword":"een god,","tekst":"Dat is, een afgod, die naar de mening der afgodendienaars een god is, maar niet inderdaad en waarheid."},{"catchword":"een beeld,","tekst":"Zie boven Isa 40:19 ."},{"catchword":"dat geen nut doet?","tekst":"Dat is, hetwelk inderdaad niet dan ijdelheid is."}],"11":[{"catchword":"hun medegenoten","tekst":"Of, hunne metgezellen; te weten de afgodendienaars, of dergenen, die zich beelden maken om God voor te stellen."},{"catchword":"uit de mensen;","tekst":"Vergelijk Hos 8:6 . Of, en de werkmeesters meer dan [andere] mensen. Of aldus: De werkmeesters zullen geen mensen meer zijn; dat is, uit de mensen weggerukt worden."},{"catchword":"altemaal","tekst":"Te weten alle afgodendienaars, gelijk boven Isa 43:9 ."},{"catchword":"zullen verschrikken,","tekst":"Te weten wanneer hun God tehuis zal zoeken en hunne afgoden vernielen zal."}],"12":[{"catchword":"een bijl,","tekst":"Met welke de timmerman een boom afhouwt om een afgod d ea they themselves [to wit, the Idols wherein Idolaters take delight] are their witnesses: [to wit, the witnesses of the Idolaters. That is, they convince them in their own consciences that they are vanities, and things of nought, in regard they see not, neither understand, as followeth in the text. See Psal.115.5.] they see not, neither do they know, therefore shall they [to wit, the Idolaters] he ashamed. Or that they may be ashamed. This cometh thus to pass by Gods providence, that Idolaters might come to shame.]"}],"10":[{"catchword":null,"tekst":"Who formeth a God, and casteth an image that is profitable for nothing? [This seemeth to be a question propounded by Idolaters, which is answered in the next verses. Or, they may be taken for the words of God, that derideth the folly and madness of Idolaters. (who formeth a God,) that is, an Idol, which in the opinion of Idolaters is a god, but is not so indeed and in truth] and casteth an image,) See above chap.40.ver.19. (that is profitable for nothing?) or, that profitable nothing: that is, which indeed and in truth is nothing but vanity.]"}],"11":[{"catchword":null,"tekst":"Behold, all their fellows [Or, their companions; To wit, the fellows or companions of Idolaters, or of those that make unto themselves images to represent God by them] shall be ashamed, [See Psal.97.7. above chap.1.29. and 42.17. and below chap.45.16.] for the workmen are of men [Compare Hest.8.6. or, and the workmen more them (other) men. Or thus; The workmen shall be men no more: that is, they shall be taken away from among men] let them all [to wit, all the Idolaters, as above chap.43.9.] gather themselves together, let them stand up, they shall fear [to wit, when God shall visit them, and shall destroy their Idols] they shall be ashamed together."}],"12":[{"catchword":null,"tekst":"The black-smith, (maketh an Ax, [Wherewith the Carpenter heweth down tree: to make an Idol of it] and worketh in the burning Cole, [Others, in the Coles] etc. fas r of that piece of wood] and boweth himself (before it) , he maketh a carved Image of it, and kneeleth down before it."}],"16":[{"catchword":null,"tekst":"He burneth half thereof [To wit, the half part of the tree] in the fire, by (the other) half thereof he eateth flesh; [The meaning is, he boileth or rosteth flesh by it, which he intendeth to eat: Or, he sitteth by the fire and eateth his meat] he rosteth a rost, and he is satisfied: also he warmeth himself, and he saith, Aha, I am grown warm, [or, Aha, I have warmed me] I have seen the fire. [That is, I have felt the heat or warmeth of the fire. So it is said, Joh.8.51. to see death, for to feel or taste of death, &c.]"}],"17":[{"catchword":null,"tekst":"Now the residue thereof he maketh a god, his carved Image: he kneeleth down before it, and boweth himself, and worshippeth it, and saith, Deliver me, for thou art my god."}],"18":[{"catchword":null,"tekst":"They [To wit, the Idolaters] know not, nor understand, for it [to wit, the Image, or the Idol] hath anointed their eyes, to wit, with false opinions and belief, which do utterly blind their eyes. Others, for (God) hath shut their eyes, etc. as being an answer to the question of those that ask with administration wondering, how it is possible that any man should be so blind, as to commit such abominable Idolatry?] that they see not, (and) their hearts, that they understand not."}],"19":[{"catchword":null,"tekst":"And none of (them) burgeth it into his heart, and there is neither knowledge nor understanding, [The meaning is, the hearts of Idolaters cleaveth so fast unto their Idols, as that they seem to be distracted and out of their wits] that he should say, I have burnt half of it [To wit, the half part of that tree whereof I have made this God] in the fire, yea I have also baked bread upon the Coles thereof, [Heb. Upon his Coles: That is, upon the Coles that came from the wooden tree, See Job 41.on ver.12.] I have rosted flesh (by it)( and have eaten it: and (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,

// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

    data.weergaven.map(w => {

}

      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +

  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);

function renderPaneel(n) {

function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {

      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
</html>
