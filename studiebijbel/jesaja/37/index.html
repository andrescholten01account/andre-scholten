:"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Het gebeurde nu, toen koning Hizkia dat hoorde, dat hij zijn kleren scheurde, en zich met een zak bedekte, en het huis van de HEERE inging.","2":"Daarna zond hij Eljakim, de hofmeester, en Sebna, de schrijver, en de oudsten van de priesters, met zakken bedekt, naar Jesaja, de profeet, de zoon van Amoz;","3":"En zij zeiden tegen hem: Zo zegt Hizkia: Deze dag is een dag van benauwdheid, en van bestraffing, en van smaad; want de kinderen zijn gekomen tot aan de geboorte, en er is geen kracht om te baren.","4":"Misschien zal de HEERE, uw God, de woorden horen van Rabsaké, aan wie zijn heer, de koning van Assyrië, gezonden heeft, om de levende God te honen en te schelden met woorden die de HEERE, uw God, gehoord heeft; hef dan een gebed op voor het overblijfsel dat nog gevonden wordt.","5":"En de dienaren van koning Hizkia kwamen bij Jesaja.","6":"En Jesaja zei tegen hen: Zo moet u tegen uw heer zeggen: Zo zegt de HEERE: Wees niet bang voor de woorden die u gehoord hebt, waarmee de knechten van de koning van Assyrië Mij gelasterd hebben.","7":"Zie, Ik zal een geest in hem geven, zodat hij een gerucht horen zal en terugkeert naar zijn land; en Ik zal hem door het zwaard vellen in zijn land.","8":"Zo keerde Rabsaké terug, en hij trof de koning van Assyrië aan, strijdend tegen Libna; want hij had gehoord dat hij van Lachis vertrokken was.","9":"Toen hij nu hoorde zeggen van Tirhaka, de koning van Cusch: Hij is uitgetrokken om tegen u te strijden; toen hij dat hoorde, zond hij opnieuw boden naar Hizkia, en zei:","10":"Zo moet u spreken tegen Hizkia, de koning van Juda: Laat uw God u niet bedriegen, op Wie u vertrouwt, door te zeggen: Jeruzalem zal niet in de hand van de koning van Assyrië gegeven worden.","11":"Zie, u hebt gehoord wat de koningen van Assyrië aan alle landen gedaan hebben, door ze te verwoesten; en zou u dan gered worden?","12":"Hebben de goden van de volken die mijn vaders vernietigd hebben, die gered — Gozan, en Haran, en Rezef, en de kinderen van Eden, die in Telassar waren?","13":"Waar is de koning van Hamath, en de koning van Arpad, en de koning van de stad Sefarvaïm, Hena en Ivva?","14":"Toen Hizkia de brieven uit de hand van de boden ontvangen had, en die gelezen had, ging hij naar het huis van de HEERE, en Hizkia spreidde die uit voor het aangezicht van de HEERE.","15":"En Hizkia bad tot de HEERE, en zei:","16":"O HEERE van de heerscharen¹, God van Israël, Die tussen de cherubs² woont! U Zelf, U alleen bent de God van alle koninkrijken van de aarde; U hebt de hemel en de aarde gemaakt!","17":"O HEERE, neig Uw oor en hoor; HEERE, doe Uw ogen open en zie; en hoor al de woorden van Sanherib, die gezonden heeft om de levende God te honen.","18":"Waarlijk, HEERE, de koningen van Assyrië hebben alle landen verwoest, alsook de landerijen daarvan;","19":"En hebben hun goden in het vuur geworpen, want het waren geen goden, maar het werk van mensenhanden, hout en steen; daarom hebben zij die vernietigd.","20":"Nu dan, HEERE, onze God, verlos ons uit zijn hand, zodat alle koninkrijken van de aarde weten dat U alleen de HEERE bent.","21":"Toen zond Jesaja, de zoon van Amoz, naar Hizkia, om te zeggen: Zo zegt de HEERE, de God van Israël: Wat u tot Mij gebeden hebt tegen Sanherib, de koning van Assyrië, heb Ik gehoord.","22":"Dit is het woord dat de HEERE over hem gesproken heeft: De jonkvrouw, de dochter van Sion, veracht u, zij bespot u; de dochter van Jeruzalem schudt het hoofd achter u.","23":"Wie hebt u gehoond en gelasterd, en tegen wie hebt u de stem verheven en uw ogen omhoog opgeheven? Tegen de Heilige van Israël!","24":"Door middel van uw dienaren hebt u de Heere gehoond, en gezegd: Met de menigte van mijn wagens heb ik de hoogte van de bergen beklommen, de zijden van Libanon; en ik zal zijn hoge cederbomen en zijn beste dennenbomen omhakken; en ik zal komen tot zijn verste hoogte, in het woud van zijn mooie veld.","25":"Ik heb gegraven en het water gedronken; en ik heb met mijn voetzolen alle rivieren van de belegerde plaatsen drooggelegd.","26":"Hebt u niet gehoord dat Ik dit lang tevoren gedaan heb, en dat Ik het van de oude dagen af gevormd heb? Nu heb Ik dat laten gebeuren, dat u de vaste steden zou verwoesten tot puinhopen.","27":"Daarom waren haar inwoners machteloos, zij waren verslagen en beschaamd; zij waren als het gras van het veld en de groene grasscheutjes, als het hooi op de daken, en het brandkoren, voordat het overeind staat.","28":"Maar Ik weet uw zitten, en uw uitgaan, en uw binnenkomen, en uw woede tegen Mij.","29":"Om uw woede tegen Mij, en dat uw onrust voor Mijn oren is opgekomen, zal Ik Mijn haak in uw neus leggen, en Mijn bit in uw lippen, en Ik zal u laten terugkeren langs de weg waarlangs u gekomen bent.","30":"En dit zal voor u een teken zijn: dat men dit jaar zal eten wat vanzelf gegroeid is, en in het tweede jaar wat daarvan opnieuw opkomt; maar zaai in het derde jaar, en maai, en plant wijngaarden, en eet hun vruchten.","31":"Want wie ontkomen is, die overgebleven is van het huis van Juda, zal opnieuw naar beneden wortelen, en het zal naar boven vrucht dragen.","32":"Want van Jeruzalem zal het overblijfsel uitgaan, en wie ontkomen is van de berg Sion; de ijver van de HEERE van de heerscharen zal dit doen.","33":"Daarom, zo zegt de HEERE van de koning van Assyrië: Hij zal in deze stad niet komen, en er ook geen pijl inschieten; ook zal hij niet met een schild ervoor komen, en geen wal daartegen opwerpen.","34":"Langs de weg waarlangs hij gekomen is, daarlangs zal hij terugkeren; maar in deze stad zal hij niet komen, zegt de HEERE.","35":"Want Ik zal deze stad beschermen om die te verlossen, omwille van Mijzelf, en omwille van David, Mijn knecht.","36":"Toen ging de engel van de HEERE uit, en sloeg in het leger van Assyrië honderdvijfentachtigduizend man. En toen zij zich 's morgens vroeg opmaakten, zie, dat waren allemaal dode lichamen.","37":"Zo vertrok Sanherib, de koning van Assyrië, en ging weg, en keerde terug; en hij bleef in Ninevé.","38":"Het gebeurde nu, toen hij zich in het huis van Nisroch, zijn god, neerboog, dat Adramelech en Sarezer, zijn zonen, hem met het zwaard versloegen; maar zij ontkwamen naar het land van Ararat; en Esar-haddon, zijn zoon, werd koning in zijn plaats."},"SV":{"1":"En het geschiedde, als de koning Hizkia *dat* hoorde, zo scheurde hij zijn klederen, en bedekte zich met een zak, en ging in het huis des HEEREN.","2":"Daarna zond hij Eljakim, den hofmeester, en Sebna, den schrijver, en de oudsten der priesteren, met zakken bedekt, tot Jesaja, den profeet, den zoon van Amoz;","3":"En zij zeiden tot hem: Alzo zegt Hizkia: Deze dag is een dag der benauwdheid, en der schelding, en der lastering; want de kinderen zijn gekomen tot aan de geboorte, en er is geen kracht om te baren.","4":"Misschien zal de HEERE, uw God, horen de woorden van Rabsake, denwelken zijn heer, de koning van Assyrië, gezonden heeft, om den levenden God te honen, en te schelden met woorden, die de HEERE, uw God, gehoord heeft; hef dan een gebed op voor het overblijfsel, dat gevonden wordt.","5":"En de knechten van den koning Hizkia kwamen tot Jesaja.","6":"En Jesaja zeide tot hen: Zo zult gijlieden tot uw heer zeggen: Zo zegt de HEERE: Vrees niet voor de woorden, die gij gehoord hebt, waarmede Mij de dienaars des konings van Assyrië gelasterd hebben.","7":"Zie, Ik zal een geest in hem geven, dat hij een gerucht horen zal, en weder in zijn land keren; en Ik zal hem door het zwaard in zijn land vellen.","8":"Zo kwam Rabsake weder, en hij vond den koning van Assyrië strijdende tegen Libna; want hij had gehoord, dat hij van Lachis vertrokken was.","9":"Als hij nu hoorde van Tirhaka, den koning van Cusch, zeggen: Hij is uitgetogen, om tegen u te strijden; toen hij zulks hoorde, zo zond hij *weder* boden tot Hizkia, zeggende:","10":"Zo zult gijlieden spreken tot Hizkia, den koning van Juda, zeggende: Laat u uw God niet bedriegen, op Welken gij vertrouwt, zeggende: Jeruzalem zal in de hand des konings van Assyrië niet gegeven worden.","11":"Zie, gij hebt gehoord, wat de koningen van Assyrië aan alle landen gedaan hebben, die verbannende; en zoudt gij gered worden?","12":"Hebben de goden der volken die mijn vaders verdorven hebben, dezelven gered, *als* Gozan, en Haran, en Rezef, en de kinderen van Eden, die in Telasser waren?","13":"Waar is de koning van Hamath, en de koning van Arpad, en de koning der stad Sefarvaim, Hena en Ivva?","14":"Als nu Hizkia de brieven uit der boden hand ontvangen, en die gelezen had, ging hij op in het huis des HEEREN; en Hizkia breidde die uit voor het aangezicht des HEEREN.","15":"En Hizkia bad tot den HEERE, zeggende:","16":"O HEERE der heirscharen, Gij, God van Israël, Die tussen de cherubim woont! Gij Zelf, Gij alleen zijt de God van alle koninkrijken der aarde; Gij hebt den hemel en de aarde gemaakt!","17":"O HEERE! neig Uw oor en hoor, HEERE! doe Uw ogen open, en zie; en hoor al de woorden van Sanherib, die gezonden heeft om den levenden God te honen.","18":"Waarlijk, HEERE! hebben de koningen van Assyrië al de landen, mitsgaders derzelver landerijen verwoest;","19":"En hebben hun goden in het vuur geworpen; want zij waren geen goden, maar het werk van mensenhanden, hout en steen; daarom hebben zij die verdorven.","20":"Nu dan, HEERE, onze God, verlos ons uit zijn hand, zo zullen alle koninkrijken der aarde weten, dat Gij alleen de HEERE zijt.","21":"Toen zond Jesaja, de zoon van Amoz, tot Hizkia, om te zeggen: Alzo zegt de HEERE, de God Israëls: Dat gij tot Mij gebeden hebt tegen Sanherib, den koning van Assyrië, *heb* *Ik* *gehoord*.","22":"Dit is het woord, dat de HEERE over hem gesproken heeft: De jonkvrouw, de dochter van Sion, veracht u, zij bespot u, de dochter van Jeruzalem schudt het hoofd achter u.","23":"Wien hebt gij gehoond, en gelasterd, en tegen Wien hebt gij de stem verheven, en uw ogen omhoog opgeheven? Tegen den Heilige Israëls!","24":"Door middel uwer dienstknechten hebt gij den Heere gehoond, en gezegd: Ik heb met de menigte mijner wagenen beklommen de hoogte der bergen, de zijden van Libanon; en ik zal zijn hoge cederbomen en zijn uitgelezen dennebomen afhouwen; en zal komen tot zijn uiterste hoogte, in het woud zijns schonen velds.","25":"Ik heb gegraven en de wateren gedronken; en ik heb met mijn voetzolen alle rivieren der belegerde plaatsen verdroogd.","26":"Hebt gij niet gehoord, dat Ik zulks lang te voren gedaan heb, en dat van de oude dagen af geformeerd heb? Nu heb Ik dat doen komen, dat gij zoudt zijn, om de vaste steden te verstoren tot woeste hopen.","27":"Daarom waren haar inwoners handeloos, zij waren verslagen en beschaamd; zij waren *als* het gras des velds en de groene grasscheutjes, *als* het hooi der daken, en het brandkoren, eer het overeind staat.","28":"Maar Ik weet uw zitten, en uw uitgaan, en uw inkomen, en uw woeden tegen Mij.","29":"Om uw woeden tegen Mij, en dat uw woeling voor Mijn oren opgekomen is, zo zal Ik Mijn haak in uw neus leggen, en Mijn gebit in uw lippen, en Ik zal u doen wederkeren door dien weg, door denwelken gij gekomen zijt.","30":"En dat zij u een teken, dat men *in* dit jaar, wat van zelf gewassen is, eten zal, en in het tweede jaar, wat daarvan weder uitspruit; maar zaait in het derde jaar, en maait, en plant wijngaarden, en eet hun vruchten.","31":"Want het ontkomene, dat overgebleven is van het huis van Juda, zal wederom nederwaarts wortelen, en het zal opwaarts vrucht dragen.","32":"Want van Jeruzalem zal het overblijfsel uitgaan, en het ontkomene van den berg Sion; de ijver des HEEREN der heirscharen zal dit doen.","33":"Daarom, zo zegt de HEERE van den koning van Assyrië: Hij zal in deze stad niet komen, noch daar een pijl inschieten; ook zal hij *met* geen schild daarvoor komen, en zal geen wal daartegen opwerpen.","34":"Door den weg, dien hij gekomen is, door dien zal hij wederkeren; maar in deze stad zal hij niet komen, zegt de HEERE.","35":"Want Ik zal deze stad beschermen, om die te verlossen, om Mijnentwil, en om Davids, Mijns knechts wil.","36":"Toen voer de engel des HEEREN uit, en sloeg in het leger van Assyrië honderd vijf en tachtig duizend. En toen zij zich des morgens vroeg opmaakten, ziet, die allen waren dode lichamen.","37":"Zo vertrok Sanherib, de koning van Assyrië, en toog henen, en keerde weder; en hij bleef te Nineve.","38":"Het geschiedde nu, als hij in het huis van Nisroch, zijn god, zich nederboog, dat Adramelech en Sarezer, zijn zonen, hem met het zwaard versloegen; doch zij ontkwamen in het land van Ararat; en Esar-haddon, zijn zoon, werd koning in zijn plaats."},"KJV":{"1":"And it came to pass, when king Hezekiah heard *it*, that he rent his clothes, and covered himself with sackcloth, and went into the house of the LORD.","2":"And he sent Eliakim, who *was* over the household, and Shebna the scribe, and the elders of the priests covered with sackcloth, unto Isaiah the prophet the son of Amoz.","3":"And they said unto him, Thus saith Hezekiah, This day *is* a day of trouble, and of rebuke, and of blasphemy: for the children are come to the birth, and *there is* not strength to bring forth.","4":"It may be the LORD thy God will hear the words of Rabshakeh, whom the king of Assyria his master hath sent to reproach the living God, and will reprove the words which the LORD thy God hath heard: wherefore lift up *thy* prayer for the remnant that is left.","5":"So the servants of king Hezekiah came to Isaiah.","6":"And Isaiah said unto them, Thus shall ye say unto your master, Thus saith the LORD, Be not afraid of the words that thou hast heard, wherewith the servants of the king of Assyria have blasphemed","7":"Behold, I will send a blast upon him, and he shall hear a rumour, and return to his own land; and I will cause him to fall by the sword in his own land.","8":"So Rabshakeh returned, and found the king of Assyria warring against Libnah: for he had heard that he was departed from Lachish.","9":"And he heard say concerning Tirhakah king of Ethiopia, He is come forth to make war with thee. And when he heard *it*, he sent messengers to Hezekiah, saying,","10":"Thus shall ye speak to Hezekiah king of Judah, saying, Let not thy God, in whom thou trustest, deceive thee, saying, Jerusalem shall not be given into the hand of the king of Assyria.","11":"Behold, thou hast heard what the kings of Assyria have done to all lands by destroying them utterly; and shalt thou be delivered?","12":"Have the gods of the nations delivered them which my fathers have destroyed, *as* Gozan, and Haran, and Rezeph, and the children of Eden which *were* in Telassar?","13":"Where *is* the king of Hamath, and the king of Arphad, and the king of the city of Sepharvaim, Hena, and Ivah?","14":"And Hezekiah received the letter from the hand of the messengers, and read it: and Hezekiah went up unto the house of the LORD, and spread it before the LORD.","15":"And Hezekiah prayed unto the LORD, saying,","16":"O LORD of hosts, God of Israel, that dwellest *between* the cherubims, thou *art* the God, *even* thou alone, of all the kingdoms of the earth: thou hast made heaven and earth.","17":"Incline thine ear, O LORD, and hear; open thine eyes, O LORD, and see: and hear all the words of Sennacherib, which hath sent to reproach the living God.","18":"Of a truth, LORD, the kings of Assyria have laid waste all the nations, and their countries,","19":"And have cast their gods into the fire: for they *were* no gods, but the work of men's hands, wood and stone: therefore they have destroyed","20":"Now therefore, O LORD our God, save us from his hand, that all the kingdoms of the earth may know that thou *art* the LORD,","21":"Then Isaiah the son of Amoz sent unto Hezekiah, saying, Thus saith the LORD God of Israel, Whereas thou hast prayed to me against Sennacherib king of Assyria:","22":"This *is* the word which the LORD hath spoken concerning him; The virgin, the daughter of Zion, hath despised thee, *and* laughed thee to scorn; the daughter of Jerusalem hath shaken her head at thee.","23":"Whom hast thou reproached and blasphemed? and against whom hast thou exalted *thy* voice, and lifted up thine eyes on high? *even* against the Holy One of Israel.","24":"By thy servants hast thou reproached the Lord, and hast said, By the multitude of my chariots am I come up to the height of the mountains, to the sides of Lebanon; and I will cut down the tall cedars thereof, *and* the choice fir trees thereof: and I will enter into the height of his border, *and* the forest of his Carmel.","25":"I have digged, and drunk water; and with the sole of my feet have I dried up all the rivers of the besieged places.","26":"Hast thou not heard long ago, *how* I have done it; *and* of ancient times, that I have formed it? now have I brought it to pass, that thou shouldest be to lay waste defenced cities *into* ruinous heaps.","27":"Therefore their inhabitants *were* of small power, they were dismayed and confounded: they were *as* the grass of the field, and *as* the green herb, *as* the grass on the housetops, and *as corn* blasted before it be grown up.","28":"But I know thy abode, and thy going out, and thy coming in, and thy rage","29":"Because thy rage against me, and thy tumult, is come up into mine ears, therefore will I put my hook in thy nose, and my bridle in thy lips, and I will turn thee back by the way by which thou camest.","30":"And this *shall be* a sign unto thee, Ye shall eat *this* year such as groweth of itself; and the second year that which springeth of the same: and in the third year sow ye, and reap, and plant vineyards, and eat the fruit","31":"And the remnant that is escaped of the house of Judah shall again take root downward, and bear fruit upward:","32":"For out of Jerusalem shall go forth a remnant, and they that escape out of mount Zion: the zeal of the LORD of hosts shall do","33":"Therefore thus saith the LORD concerning the king of Assyria, He shall not come into this city, nor shoot an arrow there, nor come before it with shields, nor cast a bank","34":"By the way that he came, by the same shall he return, and shall not come into this city, saith the LORD.","35":"For I will defend this city to save it for mine own sake, and for my servant David's","36":"Then the angel of the LORD went forth, and smote in the camp of the Assyrians a hundred and fourscore and five thousand: and when they arose early in the morning, behold, they *were* all dead corpses.","37":"So Sennacherib king of Assyria departed, and went and returned, and dwelt at Nineveh.","38":"And it came to pass, as he was worshipping in the house of Nisroch his god, that Adrammelech and Sharezer his sons smote him with the sword; and they escaped into the land of Armenia: and Esarhaddon his son reigned"}},"tsk":{"1":[{"kopje":"Het gebeurde","refs":["2 Kon 19:1-19"]},{"kopje":"dat hij zijn kleren scheurde","refs":["Jes 36:22","2 Kon 22:11","Jer 36:24","Jona 3:5","Jona 3:6","Matt 11:21"]},{"kopje":"en het huis van de HEERE inging","refs":["Ezra 9:5","Job 1:20","Job 1:21"]}],"3":[{"kopje":"smaad","refs":["Ps 95:8"]},{"kopje":"want de kinderen","refs":["Jes 26:17","Jes 26:18","Jes 66:9","Hos 13:13"]}],"4":[{"kopje":"Misschien","refs":["Joz 14:12","1 Sam 14:6","2 Sam 16:12","Amos 5:15"]},{"kopje":"te honen","refs":["Jes 37:23","Jes 37:24","Jes 36:20","Jes 51:7","Jes 51:8","1 Sam 17:26","1 Sam 17:36","2 Kon 19:4","2 Kon 19:22","2 Kon 19:23","2 Kron 32:15-19"]},{"kopje":"en zal","refs":["Jes 37:23","Ps 50:21"]},{"kopje":"hef op","refs":["1 Sam 7:8","1 Sam 12:19","1 Sam 12:23","2 Kron 32:20","Ps 106:23","Joël 2:17","Jak 5:16"]},{"kopj  wl-kjv\" data-code=\"H8085\">heard</span> that he was <span class=\"wl wl-kjv\" data-code=\"H5265\">departed</span> from Lachish.","9":"And he <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> concerning <span class=\"wl wl-kjv\" data-code=\"H8640\">Tirhakah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3568\">Ethiopia,</span> He is come <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> to make <span class=\"wl wl-kjv\" data-code=\"H3898\">war</span> with thee. And when he <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> it, he <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> to <span class=\"wl wl-kjv\" data-code=\"H2396\">Hezekiah,</span> saying,","10":"Thus shall ye <span class=\"wl wl-kjv\" data-code=\"H559\">speak</span> to <span class=\"wl wl-kjv\" data-code=\"H2396\">Hezekiah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Let not thy <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> in whom thou <span class=\"wl wl-kjv\" data-code=\"H982\">trustest,</span> <span class=\"wl wl-kjv\" data-code=\"H5377\">deceive</span> thee, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> shall not be <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of Assyria.","11":"Behold, thou hast <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> what the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria</span> have <span class=\"wl wl-kjv\" dat ","tekst":"Hebreeuws, voor het aanschijn der woorden."},{"catchword":"de dienaars","tekst":"Hebreeuws, jongens; dat is, de knechten, de dienaars. Alzo wordt Jozua genoemd een jongen van Mozes, ofschoon hij al ver tot zijne jaren gekomen was. Zie Gen 22:5 , en Exo 33:11 ."}],"7":[{"catchword":"door het zwaard","tekst":"Te weten door het zwaard zijner zonen. Zie onder vs.38."}],"8":[{"catchword":"Libna;","tekst":"Zie van deze stad de aantekening 2Ki 8:22 ."},{"catchword":"Lachis","tekst":"Waar Rabsake den koning gelaten had, en vanwaar deze hem naar Jeruzalem gezonden had. Zie boven Isa 36:2 . En zie van Lachis breder 2Ki 14:19 ."}],"9":[{"catchword":"hij nu","tekst":"Te weten de koning van Assyrië."},{"catchword":"hoorde van Tirhaka,","tekst":"Zie boven vs.7."},{"catchword":"zeggende","tekst":"En hun ook brieven medegevende, van denzelfden inhoud; zie vs.14."}],"11":[{"catchword":"verbannende;","tekst":"Dat is, ten uiterste toe verdervende; zie Deu 2:34 ."}],"12":[{"catchword":"mijn vaders","tekst":"Dat is, mijne voorouders of voorzaten."}],"13":[{"catchword":"Hamath,","tekst":"Zie Num 13:21 ."},{"catchword":"Ivva?","tekst":"Zie de aantekening 2Ki 17:24 ."}],"14":[{"catchword":"de brieven","tekst":"Welke de boden van den koning van Assyrië hem brachten, in welke geschreven stond hetzelfde dat zijne afgezondenen hem alrede geboodschapt hadden."}],"16":[{"catchword":"tussen","tekst":"Zie Exo 25:22 ; Num 7:89 ; 2Sa 6:2 ; 2Ki 19:15 ; Psa 80:2 , en de aantekening aldaar."}],"17":[{"catchword":"die gezonden","tekst":"Zo door Rabsake als door zijne brieven."}],"18":[{"catchword":"al de landen,","tekst":"2Ki 19:17 staat: de heidenen en hun land verwoest."}],"21":[{"catchword":"heb Ik gehoord","tekst":"Dit is hier ingevoegd uit 2Ki 19:20 ."}],"22":[{"catchword":"de dochter van Sion,","tekst":"Dat is, de inwoners der stad Jeruzalem, die de vreemden nog niet geschonden hadden. Zie 2Ki 19:21 ."},{"catchword":"schudt","tekst":"Tot een teken van verachting; zie Psa 22:8 ."}],"24":[{"catchword":"uwer dienstknechten","tekst":"2Ki 19:23 staat: Uwer boden."}],"25":[{"catchword":"gegraven","tekst":"Te weten waterputten."},{"catchword":"de wateren gedronken;","tekst":"Daar staat 2Ki 19:24 :vreemde wateren. Zie de aantekening aldaar."}],"26":[{"catchword":"zulks lang","tekst":"Te weten de onderdrukking der volken, die gij nu uzelven toeschrijft."},{"catchword":"geformeerd","tekst":"Dat is, besloten heb te doen; vergelijk 2Ti 1:9-10 ."},{"catchword":"dat gij zoudt zijn,","tekst":"Dat is, dat Ik u gebruiken zou om, enz."}],"27":[{"catchword":"handeloos,","tekst":"Hebreeuws, korthandig; dat is, zij hebben geen macht gehad om u tegenstand te doen, zijnde alsof hun de handen waren afgehouwen geweest."},{"catchword":"der daken,","tekst":"Dat is, dat op de daken wast."},{"catchword":"het brandkoren,","tekst":"Hetwelk dor en verbrand is, eer het in de aren schiet. Hebreeuws, brand."}],"28":[{"catchword":"Ik weet","tekst":"Dat is, o Sanherib, Ik weet al uwe aanslagen."}],"29":[{"catchword":"Mijn haak","tekst":"Een verbloemde rede, genomen van de vissers; te kennen gevende dat God de allerkwaadste en ongebondenste vijanden zijner kerk in den toom houden, besturen en bedwingen kan, dat zij hun boos voornemen niet kunnen uitvoeren."}],"30":[{"catchword":"een teken,","tekst":"Te weten, van hetgeen ik straks gezegd heb."},{"catchword":"gewassen is,","tekst":"Omdat zij hun land niet hadden kunnen bouwen, vanwege de inlegeringen en doortochten der Assyriërs in het Joodse land."},{"catchword":"wat daarvan","tekst":"Dat is, de vruchten, die in dit jaar weder vanzelf wassen zullen. Hieruit nemen sommigen af dat dit een sabbat of rustjaar geweest is, in hetwelk de Israëlieten het land niet bouwde. Zie Lev 25:5 , Lev 25:20 ."}],"32":[{"catchword":"het overblijfsel","tekst":"Het overblijfsel der Joden zal uitgaan naar zijn land en andere plaatsen, hetwelk zij tevoren niet gedaan hadden uit vrees der Assyriërs."}],"33":[{"catchword":"ook zal hij","tekst":"Hieruit is af te nemen dat Sanherib voor Jeruzalem niet gekomen is om die stad te belegeren."}],"35":[{"catchword":"om Davids,","tekst":"Dat is, vanwege de belofte, die Ik David gedaan heb. Zie 1Ki 11:12-13 ."}],"36":[{"catchword":"uit, en sloeg","tekst":"Te weten uit den hemel."},{"catchword":"in het leger","tekst":"Zie 2Ki 19:35 , met de aantekening."},{"catchword":"dode lichamen","tekst":"Hebreeuws, dode dode lichamen. Want het Hebreeuwse peger betekent alleen een dood lichaam en daar wordt nog dood bijgevoegd. Het is alsof men zeide: een dood aas."}],"37":[{"catchword":"Nineve","tekst":"Dit was in die tijden de hofstad of residentieplaats van de koningen van Assyrië."}],"38":[{"catchword":"hem met het zwaard","tekst":"Te weten eer er vijf en vijftig dagen vervlogen waren, nadat zijn leger van den engel geslagen was, gelijk enigen afnemen uit Tob.1:24"},{"catchword":"in het land","tekst":"Dat is, in groot Armenië. Zie Gen 8:4 ."},{"catchword":"Esar-haddon,","tekst":"Anders genoemd Asnappar; Ezr 4:10 ; anders ook Sardanapalus, zo sommigen menen, maar is onzeker."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And it came to pass, when King Hezekiah heard (it) [To wit, the words which Rabshaketh had spoken that he rent his clothes. [See above chap.36.22. and 2 Kings 19.1.] and covered himself with a sack, and went into the house of the Lord, [to wit, to offer up there his prayer unto the Lord.]"}],"2":[{"catchword":null,"tekst":"After that he sent Eliakim the steward, and Sebna the Scribe, and the eldest of the priests, covered with sacks, unto Isaiah the prophet the son of Amoz."}],"3":[{"catchword":null,"tekst":"And they said unto him, Thus saith Hezekiah, this day is a day of distress, and of rebuke, and of blasphemes: [That is, this is the time wherein I and my people are come into great distress, fearing the besieging and wasting of this city (This is a day of distress, and of rebuke,) to wit, wherein the Assyrians do greatly revile us, and do most abominably reproach and revile us, (and of blasphemies:) wherein the Assyrians do most heinously revile and blaspheme the Lord] for the children are come to the birth, [Heb. Unto the breach. See the like phrase, Hos 13:13.] and there is no strength to bring forth. [That is, we are in extreme danger, out of which we are not able to deliver our selves.]"}],"4":[{"catchword":null,"tekst":"It may be the LORD thy God will hear the words of Rabshake [That is, take notice of them, take them into consideration: and therefore it is to be hoped, that he will plague and punish the Assyrians for their blasphemous words] whom his Lord the King of Assyria hath sent to defy the living God, and to reproach (him) with words which the Lord thy God hath heard: lift up then a prayer for the remnant that is found. [For the remnant; to wit, of this people of God., The ten tribes were already carried away to Assyria: there were also some strong Cities in Juda already taken by the Assyrians, yet some few were left.]"}],"5":[{"catchword":null,"tekst":"And the servants of Hezekiah came unto Isaiah."}],"6":[{"catchword":null,"tekst":"And Isaiah said unto them, Thus shall ye say unto your Lord, thus saith the LORD: be not afraid of the words, [Heb. Of the face of the words] that thou hast heard, wherewith the Ministers [Heb. Lads, youths, that is, the servants, the ministers. Thus Joshua is called Moses lad or boy, though he was come to age long before. See Exo 33:11. and Ecc 21:5.]"}],"7":[{"catchword":null,"tekst":"Behold I will give a spirit into him, that he shall hear a rumour, and return into his (own) land: and I will fell him by the sword [to wit, by the sword of his sons. See below vers.38. in his (own) land."}],"8":[{"catchword":null,"tekst":"So Rabshaketh returned, and he found the King of Assyria fighting Against Libna: [See of this City the Annotat. 2 Kings 8.on vers.22.] for he had heard that he was departed from Lachish. [Where Rabshaketh left the King, and from whence he had sent him to Jerusalem. See above chap.36.vers.2. And see further of Lachish, 2 Kings 14.19.]"}],"9":[{"catchword":null,"tekst":"Now when he [To wit, the King of Assyria] heard say concerning Tirhakah the King of Cush, he is come forth to fight against thee. [See above vers.7.] when he heard it, he sent (again) messengers to Hezekiah, saying: [And giving them withal letters along with them of the same substance. See vers.14.]"}],"10":[{"catchword":null,"tekst":"Thus shall ye speak to Hezekian King of Juda, saying, Let not thy God in whom thou trusteth deceive thee, saying, Jerusalem shall not be given into the hand of the King of Assyria."}],"11":[{"catchword":null,"tekst":"Behold thou hast heard what the Kings of Assyria have done to all lands, burning them, [That is, utterly destroying them. See Deut.2.on vers.34. and shouldest thou be delivered?"}],"12":[{"catchword":null,"tekst":"Have the gods of the nations which my fathers, [That is, ancestors, or predecessors] destroyed, delivered them; as Gozan, and Haran, and Rezeph, and the children of Eden which were in Telassar?"}],"13":[{"catchword":null,"tekst":"Where is the King of Hamath? [See of Hamath Num 13:21.] and the King of Arphad? And the King of the city of Sphepharvaim, Henah and Ivah? [of Ivah see the Annotat.2 Kings 17.24.]"}],"14":[{"catchword":null,"tekst":"Now when Hezekiah had received the letters from the hand of the messengers, [To wit, the letter which the messengers of the King of Assyria brought unto him, wherein the very same matter or substance was written which his own Ambassadors had already told him by word of mouth] and had read them, he went up into the house of the LORD, and Hezekiah spread them before the face of the LORD."}],"15":[{"catchword":null,"tekst":"And Hezekiah prayed unto the LORD, saying:"}],"16":[{"catchword":null,"tekst":"O LORD of hosts, thou God of Israel, that dwellest between the Cherubims: [See Exo 25:22. Num 7:89. 2 Sam.6. 2 Kings 19.15. Psal.80.2. and the Annotat. There] thou thy self, thou alone art the God of all the Kingdoms of the Earth, thou hast made the Heavens and the Earth."}],"17":[{"catchword":null,"tekst":"O LORD incline thine ear, and hear: LORD open thine eyes and see: and hear all the words of Sennacherib, who sent to defy the living God. [To wit, both by Rabshakeh, and by his letters.]"}],"18":[{"catchword":null,"tekst":"Of a truth, LORD, the Kings of Assyria have laid waste all lands, together with their Country: [2 Kings 19.17. its said, have laid waste the Heathen and their land.]"}],"19":[{"catchword":null,"tekst":"And have cast their gods into the fire; for they were no gods, but the work of mens hands, wood and stone, therefore they have destroyed them."}],"20":[{"catchword":null,"tekst":"Now then LORD our God deliver us out of his hand, then all the Kingdoms of the earth shall know that thou only art the LORD,"}],"21":[{"catchword":null,"tekst":"Then Isaiah the son of Amoz sent unto Hezekiah, to say, thus saith the LORD the God of Israel, that which thou hast prayed against Sennacherib King of Assyria (have I heard). [This is here inserted from 2 Kings 19.20.]"}],"22":[{"catchword":null,"tekst":"This is the word which the LORD hath spoken concerning him: the virgin, the daughter of Zion [That is, the inhabitants of the city of Jerusalem, whom the strangers had not yet defiled. See 2 Kings 13.on verse 21.] hath despised thee, she laugheth thee to scorn, the daughter of Jerusalem shaketh (her) head at thee. [In token of contempt. See Psal.22.8.]"}],"23":[{"catchword":null,"tekst":"Whom hast thou defied and blasphemed? And against whom hast thou exalted (Thy) voice? And lifted up thine eyes on high? Against the holy One of Israel."}],"24":[{"catchword":null,"tekst":"By means of thy servants [2 Kings 19.23. It is said, of the messengers] hast thou defied the Lord, and said, by the multitude of my charets I am ascended up to the top of the mountains, to the sides of Libanon: and I will hew down high cedar trees, and his choice fir trees, and will come to his uttermost height, into the forest of his fair field."}],"25":[{"catchword":null,"tekst":"I have digged [To wit, wells] and drunk the waters: [It is said 2 Kings 19.24. strong waters. See the Annotat. There.] and with the soles of my feet have I dried up all the rivers of the besieged places."}],"26":[{"catchword":null,"tekst":"Hast thou not heard, that I have done it long ago? [To wit, the oppression of the nations, which thou now ascribes unto thy self] and have formed it of ancient days? [That is, have of old time decreed to do it. Compare 2 Tim.1.9,10.] now I have made it come to pass, that thou shouldest be to destroy fenced cities into desolate heaps. [That is, I have brought it so to pass, that I should use thee for to destroy, &c.]"}],"27":[{"catchword":null,"tekst":"Therefore their inhabitants were handless. [Heb. Short-handed: that is, they had no power to resist thee, being as if their hands had been cut off] they were dismayed and confounded: they were (as) the grass of the field, and the green grass-plants, (as) the hay of the house-tops] and (as) corn blasted, before it stand upright. [That is, as corn which is parched and burnt, before it shooteth in the ear, or before it be grown up. Heb. Burning.]"}],"28":[{"catchword":null,"tekst":"But I know thy sitting, and thy going out, and thy coming in, and thy rage against me. [That is, O Sennacherib, I know all thy designs and enterprises.]"}],"29":[{"catchword":null,"tekst":"Because of thy raging against me, and that thy stirring is come up before mine ears: therefore I will put my hook in thy nose, and my bit in thy lips, and I will because thee to return back by the same way by which thou camest. [I will put my hook, etc. A speech borrowed from fishers, intimating, that God can bridle, rule and restrain the most wicked and most dissolute enemies of his Church, that they shall not be able to execute their wicked design or purpose.]"}],"30":[{"catchword":null,"tekst":"And let that be a token unto thee, [To wit, of that which I said even now] that they shall eat (in) this year that which grew of it self, [Because they were not able to manure and till their land by reason of the encamping&acirc;&euro;&trade;s and marching&acirc;&euro;&trade;s of the Assyrians in and through the land of Juda] and in the second year, that which again sprouteth out of the same: [That is, the fruits that shall grow this year again of themselves. Hence some do gather that this was a Sabbatical or resting year, wherein the Israelites did not till their ground. See Levit.25.5,20.] but in the third year sow, and reap, and plant vineyards, and eat the fruits thereof."}],"31":[{"catchword":null,"tekst":"For the escaped that is left of the house of Juda shall again take root downward, and it shall bear fruit upward."}],"32":[{"catchword":null,"tekst":"For out Jerusalem shall the remnant go forth, [The remnant of the Jews shall go forth to their own land, and to other places, which they had not done before, for fear of the Assyrians] and the escaped out of mount Zion: The zeal of the LORD of hosts shall do this. [See 2 Kings 19.31. above chap.9.6.]"}],"33":[{"catchword":null,"tekst":"Therefore thus saith the LORD of the King of Assyria: he shall not come into this city, nor shoot an arrow into it, neither shall he come before it with shield, nor cast a wall against it. [Hence may be gathered, that Sennacherib came not before Jerusalem, to besiege that city.]"}],"34":[{"catchword":null,"tekst":"By the way that he came, by the same shall he return: but he shall not come into this city, saith the LORD."}],"35":[{"catchword":null,"tekst":"For I will defend this city, to deliver it, for mine (own) sake, and for my servant David&acirc;&euro;&trade;s sake. [That is, because of the promise which I made unto David. See 1 kings 11.on vers.12,13. Compare 2 kings 20.6.]"}],"36":[{"catchword":null,"tekst":"Then the Angel of the LORD went forth, [To wit, out of heaven] and smote in the camp of Assyria an hundred and fourscore and five thousand: [See 2 Kings 19.35. with the Annotat.] and when they gat them up early in the morning, behold they were all deed bodies. [Heb. Dead bodies: for the Hebrew word pegez alone signifieth a dead body, and there is yet the adjective dead added to it: it is as we should say, a dead carcase.]"}],"37":[{"catchword":null,"tekst":"So Sennacherib King of Assyria departed, and went his way and returned, and he abode at Nenive. [This was in those times the chief city, or place of residence for the Kings of Assyria, where they dwelt and kept their Court.]"}],"38":[{"catchword":null,"tekst":"Now it came to pass, when he bowed himself down in the house of Nisroch his God, that Adramelech and Sharezer his sons smote him with the sword, [To wit, before 55. Days were expired after that his camp was smitten. By the Angel, as some do gather from Tob.1.24.] but they escaped into the land of Ararat: [That is, into great Armenia. See Genes.8.4.] and Ezar-haddon is otherwise called Asnapper, Ezra 4.10. He is also otherwise called Sardanapalus, as some conceive; but this opinion is uncertain.]"}]}}};

(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
