l":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Op die dag zal dit lied gezongen worden in het land Juda: Wij hebben een sterke stad, *God* stelt heil tot muren en voorschansen.","2":"Doe de poorten open, zodat het rechtvaardige volk daarin gaat, dat de trouw bewaart.","3":"Het is een vast voornemen: U zult allerlei vrede bewaren, want men heeft op U vertrouwd.","4":"Vertrouw op de HEERE tot in eeuwigheid; want in de HEERE HEERE is een eeuwige rots.","5":"Want Hij buigt de hooggezetenen neer, de verheven stad; Hij vernedert haar, Hij vernedert haar tot de aarde toe, Hij doet haar tot aan het stof reiken.","6":"De voet zal haar vertreden, de voeten van de ellendigen, de treden van de armen.","7":"Het pad van de rechtvaardige is geheel effen, de gang van de rechtvaardige weegt U recht.","8":"Wij hebben ook op de weg van Uw oordelen, U, o HEERE, verwacht; naar Uw Naam en naar Uw gedachtenis gaat het verlangen van *onze* ziel uit.","9":"*Met* mijn ziel heb ik U begeerd in de nacht, ook zal ik *met* mijn geest, *die* in mijn binnenste is, U vroeg zoeken; want wanneer Uw oordelen op de aarde zijn, leren de inwoners van de wereld gerechtigheid.","10":"Wordt de goddeloze genade bewezen, dan leert hij *toch* geen gerechtigheid; hij doet onrecht in een geheel rechtvaardig land, en hij ziet de hoogheid van de HEERE niet aan.","11":"HEERE, is Uw hand verhoogd, zij zien het niet; *maar* zij zullen het zien, en beschaamd worden, *vanwege* de ijver *over* *Uw* volk, ook zal het vuur Uw tegenstanders verteren.","12":"HEERE, U zult ons vrede geven, want U hebt ook al onze zaken voor ons volbracht.","13":"HEERE, onze God, *andere* heren, behalve U, hebben over ons geheerst; *maar* door U alleen gedenken wij Uw Naam.","14":"Zij die dood zijn, zullen niet *opnieuw* leven, overledenen zullen niet opstaan; daarom hebt U hen bezocht[1] en hebt U hen verdelgd, en U hebt al hun gedachtenis doen vergaan.","15":"U, o HEERE, had dit volk vermeerderd, U had dit volk vermeerderd; U was verheerlijkt; *maar* U hebt hen *tot* alle einden van het aardrijk ver weggedaan.","16":"HEERE, in benauwdheid hebben zij U bezocht; zij hebben *hun* stil gebed uitgestort, toen Uw tuchtiging over hen was.","17":"Zoals een zwangere vrouw, als zij nadert tot het baren, smarten heeft en schreeuwt in haar weeën, zo zijn wij geweest, o HEERE, vanwege Uw aangezicht.","18":"Wij waren zwanger, wij hadden de smarten, *maar* wij hebben *niets* dan wind gebaard; wij hebben het land geen behoud gebracht, en de inwoners van de wereld zijn niet gevallen.","19":"Uw doden zullen leven, *ook* mijn dode lichaam, zij zullen opstaan; waak op en juich, u die in het stof woont! Want uw dauw zal zijn *als* een dauw van de moeskruiden, en het land zal de overledenen uitwerpen.","20":"Ga heen, mijn volk, ga in uw binnenkamers, en sluit uw deuren achter u toe; verberg u voor een klein ogenblik, totdat de gramschap voorbijgaat.","21":"Want zie, de HEERE zal uit Zijn plaats uitgaan, om de ongerechtigheid van de inwoners van de aarde over hen te bezoeken; en de aarde zal haar bloed onthullen, en zal haar gedoden niet langer bedekt houden."},"SV":{"1":"Te dien dage zal dit lied gezongen worden in het land van Juda; Wij hebben een sterke stad, *God* stelt heil tot muren en voorschansen.","2":"Doet de poorten open, dat het rechtvaardige volk daarin ga, hetwelk de getrouwigheden bewaart.","3":"Het is een bevestigd voornemen, Gij zult allerlei vrede bewaren, want men heeft op U vertrouwd.","4":"Vertrouwt op den HEERE tot in der eeuwigheid; want in den HEERE HEERE is een eeuwige rotssteen.","5":"Want Hij buigt de hooggezetenen neder, de verheven stad; Hij vernedert ze, Hij vernedert ze tot de aarde toe, Hij doet ze tot aan het stof reiken.","6":"De voet zal ze vertreden, de voeten des ellendigen, de treden der armen.","7":"Het pad des rechtvaardigen is geheel effen, den gang des rechtvaardigen weegt Gij recht.","8":"Wij hebben ook in den weg Uwer gerichten, U, o HEERE! verwacht; tot Uw Naam en tot Uw gedachtenis is de begeerte *onzer* ziel.","9":"*Met* mijn ziel heb ik U begeerd in den nacht, ook zal ik *met* mijn geest, *die* in het binnenste van mij is, U vroeg zoeken; want wanneer Uw gerichten op de aarde zijn, zo leren de inwoners der wereld gerechtigheid.","10":"Wordt den goddeloze genade bewezen, hij leert *evenwel* geen gerechtigheid, hij drijft onrecht in een gans richtig land, en hij ziet de hoogheid des HEEREN niet aan.","11":"HEERE! is Uw hand verhoogd, zij zien het niet; *maar* zij zullen het zien, en beschaamd worden, *vanwege* den ijver *over* *Uw* volk, ook zal het vuur Uw wederpartijders verteren.","12":"HEERE! Gij zult ons vrede bestellen, want Gij hebt ons ook al onze zaken uitgericht.","13":"HEERE, onze God! *andere* heren, behalve Gij, hebben over ons geheerst; *doch* door U alleen gedenken wij Uws Naams.","14":"Dood zijnde zullen zij niet *weder* leven, overleden zijnde zullen zij niet opstaan; daarom hebt Gij hen bezocht, en hebt hen verdelgd, en Gij hebt al hun gedachtenis doen vergaan.","15":"Gij, o HEERE! hadt dit volk vermeerderd, Gij hadt dit volk vermeerderd; Gij waart verheerlijkt geworden; *maar* Gij hebt hen *in* al de einden des aardrijks verre weggedaan.","16":"HEERE! in benauwdheid hebben zij U bezocht; zij hebben *hun* stil gebed uitgestort, als Uw tuchtiging over hen was.","17":"Gelijk een bevruchte vrouw, als zij nadert tot het baren, smarten heeft, en schreeuwt in haar weeën, alzo zijn wij geweest, o HEERE! vanwege Uw aangezicht.","18":"Wij waren bevrucht, wij hadden de smarten, *maar* wij hebben *niet* dan wind gebaard; wij deden het land geen behoudenis aan, en de inwoners der wereld vielen niet neder.","19":"Uw doden zullen leven, *ook* mijn dood lichaam, zij zullen opstaan; waakt op en juicht, gij, die in het stof woont! want uw dauw zal zijn *als* een dauw der moeskruiden, en het land zal de overledenen uitwerpen.","20":"Ga henen, mijn volk! ga in uw binnenste kamers, en sluit uw deuren na u toe; verberg u als een klein ogenblik, totdat de gramschap overga.","21":"Want ziet, de HEERE zal uit Zijn plaats uitgaan, om de ongerechtigheid van de inwoners der aarde over hen te bezoeken; en de aarde zal haar bloed ontdekken, en zal haar doodgeslagenen niet langer bedekt houden."},"KJV":{"1":"In that day shall this song be sung in the land of Judah; We have a strong city; salvation will *God* appoint *for* walls and bulwarks.","2":"Open ye the gates, that the righteous nation which keepeth the truth may enter in.","3":"Thou wilt keep *him* in perfect peace, *whose* mind *is* stayed *on thee*: because he trusteth","4":"Trust ye in the LORD for ever: for in the LORD JEHOVAH *is* everlasting strength:","5":"For he bringeth down them that dwell on high; the lofty city, he layeth it low; he layeth it low, *even* to the ground; he bringeth it *even* to the dust.","6":"The foot shall tread it down, *even* the feet of the poor, *and* the steps of the needy.","7":"The way of the just *is* uprightness: thou, most upright, dost weigh the path of the just.","8":"Yea, in the way of thy judgments, O LORD, have we waited for thee; the desire of *our* soul *is* to thy name, and to the remembrance","9":"With my soul have I desired thee in the night; yea, with my spirit within me will I seek thee early: for when thy judgments *are* in the earth, the inhabitants of the world will learn righteousness.","10":"Let favour be shewed to the wicked, *yet* will he not learn righteousness: in the land of uprightness will he deal unjustly, and will not behold the majesty of the LORD.","11":"LORD, *when* thy hand is lifted up, they will not see: *but* they shall see, and be ashamed for *their* envy at the people; yea, the fire of thine enemies shall devour","12":"LORD, thou wilt ordain peace for us: for thou also hast wrought all our works","13":"O LORD our God, *other* lords beside thee have had dominion over us: *but* by thee only will we make mention of thy name.","14":"*They are* dead, they shall not live; *they are* deceased, they shall not rise: therefore hast thou visited and destroyed them, and made all their memory to perish.","15":"Thou hast increased the nation, O LORD, thou hast increased the nation: thou art glorified: thou hadst removed *it* far *unto* all the ends of the earth.","16":"LORD, in trouble have they visited thee, they poured out a prayer *when* thy chastening","17":"Like as a woman with child, *that* draweth near the time of her delivery, is in pain, *and* crieth out in her pangs; so have we been in thy sight, O LORD.","18":"We have been with child, we have been in pain, we have as it were brought forth wind; we have not wrought any deliverance in the earth; neither have the inhabitants of the world fallen.","19":"Thy dead *men* shall live, *together with* my dead body shall they arise. Awake and sing, ye that dwell in dust: for thy dew *is as* the dew of herbs, and the earth shall cast out the dead.","20":"Come, my people, enter thou into thy chambers, and shut thy doors about thee: hide thyself as it were for a little moment, until the indignation be overpast.","21":"For, behold, the LORD cometh out of his place to punish the inhabitants of the earth for their iniquity: the earth also shall disclose her blood, and shall no more cover her slain."}},"tsk":{"1":[{"kopje":"die dag","refs":["Jes 2:11","Jes 2:20","Jes 12:1","Jes 24:21-23","Jes 25:9"]},{"kopje":"dit lied","refs":["Jes 5:1","Jes 27:1","Jes 27:2","Ex 15:2-21","Num 21:17","Richt 5:1-31","2 Sam 22:1-51","Jer 33:11","Ef 5:19","Ef 5:20","Openb 19:1-7"]},{"kopje":"in het land","refs":["Ezra 3:11","Ps 137:3","Ps 137:4"]},{"kopje":"heil","refs":["Jes 60:1 -kjv\" data-code=\"H1077\">neither</span> have the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of the <span class=\"wl wl-kjv\" data-code=\"H8398\">world</span> fallen.","19":"Thy <span class=\"wl wl-kjv\" data-code=\"H4191\">dead</span> men shall <span class=\"wl wl-kjv\" data-code=\"H2421\">live,</span> together with my dead <span class=\"wl wl-kjv\" data-code=\"H5038\">body</span> shall they <span class=\"wl wl-kjv\" data-code=\"H6965\">arise.</span> <span class=\"wl wl-kjv\" data-code=\"H6974\">Awake</span> and <span class=\"wl wl-kjv\" data-code=\"H7442\">sing,</span> ye that <span class=\"wl wl-kjv\" data-code=\"H7931\">dwell</span> in <span class=\"wl wl-kjv\" data-code=\"H6083\">dust:</span> for thy <span class=\"wl wl-kjv\" data-code=\"H2919\">dew</span> is as the <span class=\"wl wl-kjv\" data-code=\"H2919\">dew</span> of <span class=\"wl wl-kjv\" data-code=\"H219\">herbs,</span> and the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> shall cast <span class=\"wl wl-kjv\" data-code=\"H5307\">out</span> the dead.","20":"<span class=\"wl wl-kjv\" data-code=\"H3212\">Come,</span> my <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> <span class=\"wl wl-kjv\" data-code=\"H935\">enter</span> thou into thy <span class=\"wl wl-kjv\" data-code=\"H2315\">chambers,</span> and <span class=\"wl wl-kjv\" data-code=\"H5462\">shut</span> thy <span class=\"wl wl-kjv\" data-code=\"H1817\">doors</span> about thee: <span class=\"wl wl-kjv\" data-code=\"H2247\">hide</span> thyself as it were for a <span class=\"wl wl-kjv\" data-code=\"H4592\">little</span> <span class=\"wl wl-kjv\" data-code=\"H7281\">moment,</span> until the <span class=\"wl wl-kjv\" data-code=\"H2195\">indignation</span> be overpast.","21":"For, behold, the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> cometh <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of his <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> to <span class=\"wl wl-kjv\" data-code=\"H6485\">punish</span> the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> for their <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity:</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> also shall <span class=\"wl wl-kjv\" data-code=\"H1540\">disclose</span> her <span class=\"wl wl-kjv\" data-code=\"H1818\">blood,</span> and shall no more <span class=\"wl wl-kjv\" data-code=\"H3680\">cover</span> her slain."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"dien dage","tekst":"Te weten, als het volk uit de Babylonische gevangenschap zal verlost zijn, en de kinderen Gods uit de handen hunner vijanden, zo lichamelijke als voornamelijk geestelijke."},{"catchword":"in het land","tekst":"Dat is, in de gemeente Gods, overal waar die te dien tijde wezen zal, want onder den naam Juda wordt meermalen de kerk Gods verstaan."},{"catchword":"een sterke stad,","tekst":"Aldus wordt de kerk genaamd, omdat zij onder de bescherming van God vast en zeker is en blijft. Hebreeuws, ene stad der sterkte; dat is, ene stad van geweld."},{"catchword":"God","tekst":"Hebreeuws, Hij stelt; te weten God."},{"catchword":"stelt","tekst":"De zin is: Het heil, dat God haar geeft, is haar muur en vastigheid, waar ze zich op mag verlaten. Hij zal ze daarbij wel behouden, zodat ook de poorten der hel daar niet tegen zullen vermogen, Mat 16:18 . Of aldus, God, die ons heil, of onze Heiland en Verlosser is, zal de muur, of beschermer dezer stad, dat is, zijner kerk en gemeente zijn, daarom zal zij sterk, ja onverwinnelijk zijn."},{"catchword":"voorschansen","tekst":"Of, voormuren, dwingers, bolwerken."}],"2":[{"catchword":"Doet","tekst":"Met deze woorden vermanen de gelovigen elkander tot aanneming dergenen, die zich tot de gemeenschap der heiligen aanbieden. Vergelijk Psa 118:19-20 ."},{"catchword":"het rechtvaardige volk","tekst":"Dat is, het uitverkoren volk Gods, hetwelk door het geloof aan Christus gerechtvaardigd is en alle getrouwheid onderhoudt."},{"catchword":"de getrouwigheden","tekst":"Dat is, hetwelk de trouw bestendiglijk onderhoudt, die het God en den mensen heeft beloofd. Anders: hetwelk alle trouw bewaart, of onderhoudt."}],"3":[{"catchword":"voornemen,","tekst":"Of, gedachte, besluit; te weten bij U, o God. Anders: Dat, [te weten, volk] hetwelk bevestigd is van gedachten, zult Gij bewaren in allerlei vrede, want het heeft, enz., waarvan de zin is: Dat volk, dat eens rechtvaardig gemaakt zijnde, vs.2, niet wankelbaar of onbestendig is van gedachten; zie Jam 1:6 , Jam 1:8 ."},{"catchword":"Gij zult","tekst":"O God."},{"catchword":"allerlei","tekst":"Hebreeuws, vrede, vrede; dat is, allerlei vrede, of bestendigen, vasten, gedurigen vrede; en versta door het woord vrede allerlei heil en welstand. Zie Gen 37:14 . Eenige zetten dit derde vers aldus over: [Wiens] voornemen vast [op U] staat, dien zult gij een vasten vrede bewaren, wanneer men zich op U vertrouwt."}],"4":[{"catchword":"Vertrouwt","tekst":"Hier vermanen verder de gelovigen elkander."},{"catchword":"is een eeuwige rotssteen","tekst":"Anders: bestaat de steenrots der eeuwen; dat is, de eeuwige steenrots. De zin is: Hij, die waarlijk de eeuwige God is, is de eeuwige rotssteen van al degenen, die hunne toevlucht tot hem nemen."}],"5":[{"catchword":"de hooggezetenen","tekst":"Te weten de Babyloniërs, mitsgaders andere geweldige en machtige vijanden zijner kerk. Anders: die in hoogte wonen; zie boven Isa 25:12 ."},{"catchword":"de verheven stad;","tekst":"Versta, de stad Babel."},{"catchword":"Hij vernedert ze,","tekst":"Van de wederhaling van een en hetzelfde woord, zie Eze 21:9 ."}],"6":[{"catchword":"De voet","tekst":"De zin is: Ofschoon de gelovigen voor de wereld arm en verachtzaam zijn, en een tijdlang van hunne vijanden hard vervolgd en verdrukt worden, zo krijgen zij nochtans nog eindelijk de overwinning door de kracht Gods, en vertreden hunne vijanden als met voeten."},{"catchword":"des ellendigen,","tekst":"Anders: de uitgeteerden."}],"7":[{"catchword":"is geheel","tekst":"Hebreeuws, zijne gerechtigheden, of oprechtheden; dat is, enkele oprechtheid. Anders: het pad der rechtvaardigen is geheel effen, o Gij rechtvaardige, Gij weegt het spoor [dat is, den weg] des rechtvaardigen. Anders: de weg des rechtvaardigen zijn gerechtigheden, hij is gerechtig. Gij zult het spoor des rechtvaardigen wegen; of overweegt Gij het spoor des rechtvaardigen; dat is, o God, weegt Gij zelf, of de rechtvaardige niet geheel oprecht zij, en of zijn weg niet rechtvaardig zij."},{"catchword":"recht","tekst":"Dat is, in een rechte weegschaal."}],"8":[{"catchword":"Wij hebben","tekst":"De zin is: Zelfs nu, nu Gij ons zo zwaarlijk tehuiszoekt door de Babyloniërs, wachten en hopen wij evenwel op uwe hulp, en wij wensen van harte dat uw naam groot gemaakt en altoos ter ere moge gedacht worden, zo van ons als van anderen. De godzaligen gelijken den goddelozen niet, bij wie de Heere geheel uitheeft wanneer Hij hen met zijne roeden slaat. Zie Psa 44:18-19 , enz."}],"9":[{"catchword":"ik","tekst":"Dat is, wij uw volk, een ieder van ons."},{"catchword":"U begeerd","tekst":"Te weten door het gebed."},{"catchword":"U vroeg zoeken;","tekst":"Zie Job 7:21 ."},{"catchword":"Uw gerichten","tekst":"Dat is, straffen, of tuchtigen. De zin is: Door de tuchtigingen of straffen worden de afgedwaalden weder op den rechten weg gebracht en leren op Gods geboden passen. Zie Psa 119:67 , Psa 119:71 ."}],"10":[{"catchword":"gans","tekst":"Hebreeuws, in het land der rechtigheden; dat is, in het land waar Gods Woord geleerd wordt, hetwelk den rechten weg der zaligheid aanwijst. De zin is: Ofschoon zij in de uiterlijke gemeenschap der kerk zijn, zo leiden zij evenwel een boos leven."},{"catchword":"en hij ziet","tekst":"Anders: daarom zal hij de hoogheid [of heerlijkheid, of majesteit ] des Heeren niet zien."}],"11":[{"catchword":"is Uw hand","tekst":"Dat is, al zijn uw grote daden en wonderwerken openbaar en ogenschijnlijk, zij merken het niet."},{"catchword":"zij zien het niet;","tekst":"Te weten, uwe vijanden, de goddelozen."},{"catchword":"zij zullen het zien,","tekst":"Zij zullen het moeten merken, of zij willen of niet; namelijk als zij door uw grote straffen en tot hun uiterste verderf bevinden zullen hoe machtig Gij zijt om uwe vijanden te straffen."},{"catchword":"vanwege","tekst":"Hebreeuws, vanwege den ijver des volks. De zin is: Zij zullen beschaamd staan als zij zullen zien den groten ijver, dien Gij betonen zult in het redden van uw volk uit de hand hunner vijanden. Anders: door den ijver van uw volk; [dat is, door den ijver, waarmede Gij over uw volk ontstoken zijt], ook door het vuur uwer vijanden, [dat is, door hetwelk Gij uwe vijanden haat] zult Gij hen verteren. Naar welke zin hier twee oorzaken worden aangewezen, die God hebben bewogen de goddelozen [van wie vs.10 gesproken is] te verdelgen: vooreerst de liefde, die Hij zijn volk toedraagt, ten andere den brand des toorns, waarmede Hij tegen zijne vijanden ontstoken is."},{"catchword":"het vuur","tekst":"Van het woord vuur, voor den toorn en wraak Gods, zie Job 20:26 , en Job 22:20 ."}],"12":[{"catchword":"beschikken","tekst":"Dat is, verlenen, of geven."},{"catchword":"ons ook","tekst":"Of, voor ons, of in ons."},{"catchword":"al onze zaken","tekst":"Of, al onze werken gewrocht; dat is, alles wat ons van node is geweest aan de ziel en aan het lichaam, hebt Gij voor ons teweeggebracht."}],"13":[{"catchword":"andere heren,","tekst":"Te weten de Babyloniërs en andere vijanden uwer kerk."},{"catchword":"door U alleen","tekst":"De zin is: Dat wij in het leven zijn gebleven, dat hebben wij U alleen te danken, en zijn derhalve schuldig uw heiligen naam te danken en te loven, en vastelijk op U te vertrouwen."},{"catchword":"Uws Naams","tekst":"Of, aan uwen naam."}],"14":[{"catchword":"zij","tekst":"Te weten die vijanden noch anderen van huns gelijken."},{"catchword":"niet weder","tekst":"Dat is, niet weder levend worden, en derhalve zullen zij ons niet meer verhinderen uwen naam te prijzen; zie Exo 14 , zie Exo 15 ."},{"catchword":"overleden","tekst":"Zie de aantekening Job 26:5 ."},{"catchword":"niet opstaan;","tekst":"Te weten om hier op aarde te leven."},{"catchword":"bezocht,","tekst":"Te weten in uwen toorn."}],"15":[{"catchword":"hadt","tekst":"Hebreeuws, Gij hadt tot dit volk toegedaan; dat is, velerlei zegen gegeven; of, gelijk sommigen, vele straffen toegevoegd; door welke beide God eer behaalt."},{"catchword":"dit volk","tekst":"Te weten de Joden."},{"catchword":"Gij hadt","tekst":"Van dergelijke wederhaling van het woord zie boven vs.5."},{"catchword":"verheerlijkt","tekst":"Te weten door de weldaden aan dit volk bewezen. Anders: bezwaard geworden; te weten door de zonden, die zij tegen U hebben begaan, [daarom] hebt Gij hen, enz. Het Hebreeuwse woord betekent verheerlijken, het betekent ook bezwaren."},{"catchword":"verre weggedaan","tekst":"Dat is, verstoten, ten lande uitgestoten, te weten om hunner zonden wil."}],"16":[{"catchword":"zij","tekst":"Te weten uw volk, als Gij hen gekastijd hebt."},{"catchword":"U bezocht;","tekst":"Dat is, zij hebben U om hulp aangeroepen."},{"catchword":"stil gebed","tekst":"Het Hebreeuwse woord Lachas betekent eigenlijk een stille mompeling, die men nauwelijks horen kan, gelijk 1Sa 1:13 . Hiermede wil de profeet aanwijzen dat zij in hunne noden tot God gezucht en in stilheid gebeden hebben, hetwelk bij God een geroep is; Exo 14:15 ."},{"catchword":"als Uw tuchtiging","tekst":"Dat is, als Gij hen tuchtigdet."}],"17":[{"catchword":"alzo zijn wij","tekst":"Te weten, in de Babylonische gevangenschap."},{"catchword":"vanwege","tekst":"Dat is, vanwege uwen toorn. Zie de aantekening Gen 32:20 , en Psa 21:10 ."}],"18":[{"catchword":"Wij waren","tekst":"Dat is, wij waren in groten nood en ellende."},{"catchword":"wij hadden","tekst":"Te weten als een barende vrouw."},{"catchword":"wij hebben niet","tekst":"Dat is, wij hebben ons tevergeefs bekommerd hoe wij uit de gevangenschap of ellende geraken zouden. Wind baren is zoveel gezegd als vergeefsen arbeid doen. Hebreeuws, wij hebben als een wind gebaard."},{"catchword":"wij deden","tekst":"Dat is, wij hebben onze vijanden, die ons land ingenomen hadden, door onze eigen kracht niet kunnen verslaan."},{"catchword":"het land","tekst":"Te weten het Joodse land, ons vaderland."},{"catchword":"behoudenis","tekst":"Of, verlossing, of heil."},{"catchword":"de inwoners","tekst":"Dat is, de Babyloniërs, die ons land, mitsgaders nog vele andere koninkrijken en landen inhadden."},{"catchword":"vielen","tekst":"Of, zij zijn niet gevallen; dat is, zij zijn niet omgekomen."}],"19":[{"catchword":"Uw doden","tekst":"Met deze woorden verklaart de kerk in het algemeen, en elke gelovige in het bijzonder, een vast vertrouwen van de zalige opstanding uit den dood, tot de heerlijkheid van het eeuwige leven; waarvan de verlossing uit de Babylonische gevangenschap een voorbeeld zou zijn, en daarom van de Joden met vertrouwen was te verwachten. Vergelijk Eze 37 ."},{"catchword":"leven,","tekst":"Dat is, zij zullen door uwe kracht weder verlost en opgewekt worden."},{"catchword":"mijn dood lichaam,","tekst":"Dit spreekt iedere gelovige mens voor zichzelven."},{"catchword":"gij,","tekst":"Dat is, gijlieden die als in de graven ligt."},{"catchword":"uw dauw","tekst":"Dat is, uwe goedertierenheid, waarmede Gij ons ontvangen zult, zal maken dat wij, die uw kerk of volk zijn, alzo zullen verkwikt en getroost worden, gelijk de dauw de kruiden verkwikt."},{"catchword":"als","tekst":"Dat is, als een dauw, die op de moeskruiden valt; versta hierbij het gras en alle andere kruiden, die uit de aarde wassen."},{"catchword":"het land","tekst":"Anders: Nadat Gij de reuzen [dat is, de machtige en verschrikkelijke vijanden van uw volk] zult ter aarde geveld hebben."}],"20":[{"catchword":"Ga henen,","tekst":"Tot hiertoe heeft geduurd de lofzang van het volk Gods; nu voortaan spreekt God de Heere, of de profeet in Gods naam, de kerk vermanende dat zij nog een weinig geduld hebbe, totdat de tijd harer verlossing gekomen zij."},{"catchword":"na u toe;","tekst":"Hebreeuws, voor u, gelijk 2Ki 4:4 ."}],"21":[{"catchword":"uit Zijn plaats","tekst":"Dat is, uit den hemel; Mic 1:3 ; Rom 1:18 ."},{"catchword":"over hen","tekst":"Dat is, de Heere zal van den hemel het bloed van zijn volk, hetwelk de vijanden vergoten hebben, wreken."},{"catchword":"haar bloed","tekst":"Zie de aantekening Gen 4:10 , en Job 16:18 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"In that day [To wit, when the people of the Jews shall be delivered out of the Babylonish captivity, and the children of God out of the hands of their enemies, both corporal, and especially spiritual] shall this song be sung in the land of Juda: [that is, in the Church of God, wheresoever the same shall be at this time; for under the name of Juda is oftentimes meant the Church of God,] we have a strong city [the Church is so called, because she is strong and sure (and continueth so) under Gods protection. Heb. A city of strength, that is, a city of power] (God) appointeth [Heb. He appointeth: to wit, God] salvation for walls and outworks [Or, fore-wall fences, and bulwarks. The meaning is, the salvation which God giveth it, is that wall and strength thereof, whereon it may safely rely he will preserve and keep it; well thereby, so that even the gates of hell shall not prevail against it, Mat 16:18. Or thus, God who is our salvation, (or our saviour and deliverer) will be the wall (or, protector) of this city, (that is, of his Church) therefore it shall be strong, yea invincible.]"}],"2":[{"catchword":null,"tekst":"Open the gates, that the righteous nation which keepeth faithfulnesses, my enter in. [In these words the faithful exhort one another. Others, to receive and entertain those that offer themselves to the communion or fellowship of Saints. Compare Psal.118.19,20. (the righteous nation) that is, the elect people of God, which are justified by faith in Christ, and keep all truth and faithfulness (which keepeth faithfulness) that is, steadfastly which keepeth the truth or faithfulness which it hath promised to God and men. Others, which keepeth, or, preserveth all faithfulness.]"}],"3":[{"catchword":null,"tekst":"It is a settled purpose, [Or, thought, decree; to wit, with thee, O God] thou [O God] walt keep all manner of peace [Heb. Peace, peace; that is, all manner of peace: Or, durable, strong continual peace. And understand by the word peace all manner of salvation and prosperity. See Gen.37.on vers.14.] for they trusted in thee. Others. That (to wit, people) which is settled in thoughts, wilt thou keep in all manner of peace, for it trusted in thee. The sense or meaning whereof is, that people, which being once justified, verse 2. Is not wavering or unconstant in mind. See Jam.1.ver.6,8. Some read this third verse thus, (whose) purpose is sure, or, stedfast (in thee) unto him wilt thou keep a sure, or, stedfast peace, when he trusteth in thee.]"}],"4":[{"catchword":null,"tekst":"Trust in the LORD forever, [Here the faithful do again exhort one another] for in the Lord Lord (there) is an everlasting rock. [Others, consisteth the rock of ages; that is, the everlasting rock. The meaning is, he that is indeed the everlasting God, he is an everlasting strong rock unto those that go to him for refuge.]"}],"5":[{"catchword":null,"tekst":"For he howeth down the high-seated ones, [To wit, the Babylonians, together with other mighty and powerful enemies of his Church, them that dwell on high. See above chap.25.ver.12.] the exalted city: [meaning the city of Babel] he abaseth it, he abaseth it unto the ground, [of the repetition of one and the same word, see Ezek.21.on ver.9.] he causeth it to reach unto the other."}],"6":[{"catchword":null,"tekst":"The foot shall tread it down, the feet of the afflicted, [Or, of him that is wasted away, or, consumed away] the steps of the poor, [the meaning is, Although believers be poor and contemptible in the eyes of the world, and are for a while grievously persecuted and oppressed by their enemies, yet at length they got the victory by the power of God, and trod as it were with their feet upon their enemies.]"}],"7":[{"catchword":null,"tekst":"The path of the just is wholly even: Heb. Are righteousnesses, or, uprightnesses; that is, were uprightness] the going of the just thou weighest aright, [that is, in a just or right balance. Others, the path of the just is wholly even, O thou righteous one, thou weighest the path (that is, the way) of the just. Others, The Way of the just are righteousnesses, he is righteous, thou shalt weigh the track of the just: Or, ponder thou the track of the just. That is, do thou, O God, weigh or consider, whether the just be not wholly upright, and whether his way be not just and righteous.]"}],"8":[{"catchword":null,"tekst":"Also we, O LORD, have waited for thee in the way of thy judgements: the desire of (our) soul is to thy name, and to the remembrance of thee, [The meaning is, even now at this time when thou dost visit us so sorely by the Babylonians, yet notwithstanding we do still wait upon thee, and hope in thy saving help, and we desire and wish with all our hearts that thy name may be magnified, and always had in remembrance, to thy praise and glory, both by us and others. The godly are not like unto the wicked, that fall foul upon God, when he smiteth them with his rod. See Psal.44.ver.18,19,&c."}],"9":[{"catchword":null,"tekst":"(With) my soul have I [That is, we thy people, everyone of us] desired thee [to wit, by prayer] in the night, also (with) my spirit, (which) is in the uttermost (parts) of me will I seek thee early: [See Job chap.7.on verse 21.] for when thy judgements [that is, punishments, or chastisements] are on the earth, then the inhabitants of the world learn righteousness, [the meaning is, by the chastiments or punishments, are those that are gone astray brought again into the right way, and learn to mind the commandments of God. See Psal.119.vers.67. and ver.71.]"}],"10":[{"catchword":null,"tekst":"Let favour be shewed to the wicked, (yet) doth be not learn righteousness, he committeth iniquity, in a most upright land, [Heb. In the land of uprightnesses; That is, in the land where the word of God is taught, which sheweth the right way to salvation. The meaning is, although they be in the outward fellowship and communion of the Church, yet notwithstanding they lead a wicked and ungodly life] and he considereth not the highness of the Lord, others, therefore he shall not see the highness (or, glory, or, Majesty) of the Lord."}],"11":[{"catchword":null,"tekst":"LORD, (through) thy hand be lifted up, (yet) they [To wit, thine enemies, the wicked] see it not: [that is, though thy great and wonderful works be manifest and apparent to the eyes, yet they perceive it not] (but) they shall see it, [that is, they shall be forced to see it, whether they will or no; namely, when by thy great judgements, and to their own utter ruin and destruction they shall find, how strong and powerful thou art for to punish thine enemies] and be ashamed, (because of) the zeal (for thy) people, [Heb. (because of) the zeal of the people. The meaning is, they shall be ashamed, when they shall see the great zeal which thou shalt shew in delivering thy people out of the hand of their enemies] also the fire [of the word fire taken for the wrath and vengeance of God, see Job 20.on ver.26. and Job 22.on ver.20.] shall consume thine adversaries, [others, by the zeal of thy people (that is, by the zeal wherewith thou art kindled over thy people) by the fire of thine enemies (that is, whereby thou hatest thine enemies) shalt thou consume them. According to which sense two causes are here shewed, which moved God to punish the wicked, of whom is spoken ver.10. First, the Love which he beareth unto his people. Secondly, the fierce anger wherewith he is kindled against his enemies]"}],"12":[{"catchword":null,"tekst":"LORD, thou wilt ordain [Or give, grant] peace unto us: for thou also hast performed all our affairs [Or wrought all our works] unto us [or, for us, or, in us. That is, whatsoever was needful for us either in soul or in body, that hast thou procured for us]"}],"13":[{"catchword":null,"tekst":"LORD our God, (other) lords besides thee, [To wit, the Babylonians, and other enemies of thy Church] have had dominion over us; (but) by thee onely will we remember thy name. [The meaning is, that we remain alive unto this day, we have cause to praise thee alone for it, and therefore are bound to bless and praise thy holy name, & to rely stedfastly upon thee.]"}],"14":[{"catchword":null,"tekst":"Being dead, they shall not live (again,) [That is, not become alive again, and consequently they shall not hinder us anymore from praising thy name. See Exod.14. and 15.] being deceased, [See the Annotat. Job 26.on vers.5.] they [to wit, those enemies, not others like unto them] shall not rise: [to wit, for to live here upon the earth] therefore hast thou visited them,] to wit, in thine anger] and hast destroyed them, and thou hast made all their enemies to perish."}],"15":[{"catchword":null,"tekst":"Thou O LORD, hadst increased this people, [To wit, the Jews, Heb. Thou hadst added unto this people; that is, given them many blessings. Or, as some, added many judgements to them: by both which God getteth glory unto himself] thou hadst increased this people, [of the like repetition of one word, see above on vers.5.] thou wast glorified, to wit, by the mercies shewed unto this people. Others, thou wast grieved; to wit, by the sins which they committed against thee, (therefore) thou hast &c. [the Hebrew word signifieth to glorify, it signifieth also to grieve, but thou hast removed them far [that is, driven them far away, banished them out of the land; to wit for the // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
