jn dienaars tot een vlam van het vuur.", "Jes 42:3": "Het geknakte riet zal Hij niet breken, en de rokende vlaswiek zal Hij niet uitblussen; met waarheid zal Hij het recht voortbrengen.", "Hos 5:1": "Hoor dit, priesters! En let op, huis van Israël! En neem ter ore, huis van de koning! Want u geldt dit oordeel, omdat u een strik bent geworden bij Mizpa, en een uitgespannen net op Thabor.", "Matt 6:23": "maar als uw oog slecht is, zal heel uw lichaam duister zijn. Als dan het licht dat in u is duisternis is, hoe groot is dan die duisternis!", "Jer 17:11": "Zoals een veldhoen eieren verzamelt, maar ze niet uitbroedt, zo is hij die rijkdom verzamelt, maar niet met recht; in de helft van zijn dagen zal hij die moeten verlaten, en in zijn laatste dagen een dwaas zijn.", "Jer 33:11": "De stem van vreugde en de stem van blijdschap, de stem van de bruidegom en de stem van de bruid, de stem van hen die zeggen: Looft de HEERE van de heerscharen, want de HEERE is goed, want Zijn goedertierenheid is tot in eeuwigheid! de stem van hen die lof brengen naar het huis van de HEERE; want Ik zal de gevangenschap van het land wenden, als in het begin, zegt de HEERE.", "Joh 1:12": "Maar zovelen Hem aangenomen hebben, aan hen heeft Hij macht gegeven om kinderen van God te worden, namelijk aan hen die in Zijn Naam geloven;", "Amos 5:25-27": "Hebt u Mij veertig jaar in de woestijn slachtoffers en spijsoffer gebracht, o huis van Israël? Ja, u droeg de tent van uw Melech, en de Kijun, uw beelden, de ster van uw god, die u zelf gemaakt had. Daarom zal Ik u gevankelijk wegvoeren, ver voorbij Damaskus, zegt de HEERE, Wiens Naam is God van de heerscharen.", "Jes 38:20": "De HEERE was gereed om mij te verlossen; daarom zullen wij op mijn snarenspel spelen, al de dagen van ons leven, in het huis van de HEERE.", "Mark 2:28": "Zo is dan de Zoon des mensen ook Heere van de sabbat.", "Gal 5:14": "Want de hele wet wordt in één woord vervuld, namelijk in dit: U zult uw naaste liefhebben als uzelf.", "Mal 3:1": "Zie, Ik zend Mijn engel, die voor Mijn aangezicht de weg bereiden zal; en snel zal die Heere, Die u zoekt, tot Zijn tempel komen, namelijk de Engel van het verbond, aan Wie u lust hebt; zie, Hij komt, zegt de HEERE van de heerscharen.", "1 Kor 6:11": "En dit was u, sommigen van u; maar u bent afgewassen, maar u bent geheiligd, maar u bent gerechtvaardigd, in de Naam van de Heere Jezus, en door de Geest van onze God.", "1 Kor 3:19": "Want de wijsheid van deze wereld is dwaasheid bij God; want er is geschreven: Hij vat de wijzen in hun sluwheid;", "Spr 15:27": "Wie hebzucht najaagt, brengt zijn huis in beroering; maar wie geschenken haat, zal leven.", "Jes 30:7": "Want Egypte zal nutteloos en tevergeefs helpen; daarom heb Ik hierover geroepen: Stilzitten zal hun sterkte zijn.", "Fil 4:19": "Maar mijn God zal naar Zijn rijkdom al wat u nodig hebt vervullen, in heerlijkheid, door Christus Jezus.", "Ps 119:1-5": "Aleph. Gelukkig zijn de oprechten van wandel, die in de wet van de HEERE gaan. Gelukkig zijn zij, die Zijn getuigenissen onderhouden, die Hem van ganser harte zoeken; Ook geen onrecht werken, maar wandelen in Zijn wegen.", "Joh 6:52": "De Joden streden dan onder elkaar en zeiden: Hoe kan Hij ons Zijn vlees te eten geven?", "Jes 43:28": "Daarom zal Ik de leiders van het heiligdom ontheiligen, en Jakob ten ban overgeven, en Israël tot beschimpingen.", "Spr 31:5": "opdat hij niet drinkt en het vastgestelde vergeet, en de rechtszaak van alle verdrukten verandert.", "Deut 30:16": "Want ik gebied u heden, de HEERE, uw God, lief te hebben, in Zijn wegen te wandelen, en Zijn geboden, en Zijn inzettingen, en Zijn rechten te houden, opdat u leeft en meer wordt, en de HEERE, uw God, u zegent in het land waar u naartoe gaat, om dat te erven.", "Zach 11:16": "Want zie, Ik zal een herder verwekken in dit land; wat gereed is om afgesneden te worden, zal hij niet bezoeken; het jonge zal hij niet zoeken, en het verbrokene zal hij niet helen, en het stilstaande zal hij niet dragen; maar het vlees van het vette zal hij eten, en hun klauwen zal hij verscheuren.", "1 Petr 1:2-5": "de uitverkorenen naar de voorkennis van God de Vader, in de heiligmaking van de Geest, tot gehoorzaamheid en besprenging met het bloed van Jezus Christus; genade en vrede worde u vermenigvuldigd. Geloofd zij de God en Vader van onze Heere Jezus Christus, Die naar Zijn grote barmhartigheid ons opnieuw geboren heeft doen worden tot een levende hoop, door de opstanding van Jezus Christus uit de doden. Tot een onvergankelijke, onbevlekte en onverwelkbare erfenis, die in de hemelen bewaard is voor u.", "Deut 19:15": "Eén enkele getuige zal tegen niemand opstaan in verband met enige ongerechtigheid of enige zonde, van welke zonde hij ook zou hebben gezondigd; op de verklaring van twee getuigen, of op de verklaring van drie getuigen, zal de zaak vaststaan.", "Ps 63:3": "Voorzeker, ik heb U in het heiligdom aanschouwd, en heb Uw sterkte en Uw eer gezien;", "1 Kor 10:7": "En word geen afgodendienaars, zoals sommigen van hen, zoals geschreven staat: Het volk zat neer om te eten en te drinken, en zij stonden op om te spelen.", "1 Sam 17:43": "De Filistijn nu zei tegen David: Ben ik een hond, dat u met stokken naar mij toe komt? En de Filistijn vervloekte David bij zijn goden.", "Ps 40:7-9": "Gij hebt geen lust gehad aan slachtoffer en spijsoffer; Gij hebt mij de oren doorboord; brandoffer en zondoffer hebt Gij niet geëist. Toen zei ik: Zie, ik kom; in de rol van het boek is van mij geschreven. Ik heb lust, o mijn God! om Uw welbehagen te doen; en Uw wet is in het midden van mijn ingewand.", "Jes 60:1-22": "Maak u op, word verlicht, want uw licht komt, en de heerlijkheid van de HEERE gaat over u op. Want zie, de duisternis zal de aarde bedekken, en donkerheid de volken; maar over u zal de HEERE opgaan, en Zijn heerlijkheid zal over u gezien worden. En de heidenen zullen naar uw licht gaan, en koningen naar de glans die over u is opgegaan.", "Jes 1:17": "Leer goed te doen, zoek het recht, help de verdrukte, doe de wees recht, voer de rechtszaak van de weduwe.", "Zach 4:6": "Toen antwoordde Hij en sprak tegen mij: Dit is het woord van de HEERE tot Zerubbabel: Niet door kracht, ook niet door geweld, maar door Mijn Geest zal het gebeuren, zegt de HEERE van de heerscharen.", "Jak 2:11": "Want Hij Die gezegd heeft: U zult geen overspel doen, heeft ook gezegd: U zult niet doden. Als u nu geen overspel doet, maar wel doodt, dan bent u een overtreder van de wet geworden.", "Joh 1:23": "Hij zei: Ik ben de stem van hem die roept in de woestijn: Maak de weg van de Heere recht, zoals Jesaja, de profeet, gesproken heeft.", "Spr 16:25": "Er is een weg, die iemand recht lijkt; maar het einde ervan zijn wegen van de dood.", "Jes 25:6": "En de HEERE van de heerscharen zal op deze berg voor alle volken een vette maaltijd maken, een maaltijd van reine wijn, van vet vol merg, van reine wijnen, die gezuiverd zijn.", "Kol 2:16": "Laat dan niemand u oordelen over eten of drinken, of over een feestdag, nieuwe maan of sabbatten;", "Ps 35:18": "Zo zal ik U loven in de grote gemeente; onder machtig veel volk zal ik U prijzen.", "Joh 19:37": "En weer zegt een andere Schrift: Zij zullen zien op Hem, in Wie zij gestoken hebben.", "Ef 6:8": "wetende dat ieder, wat goed hij ook zal hebben gedaan, dat hij dat van de Heere zal ontvangen, of hij dienstknecht is of vrije.", "Lev 26:35": "Al de dagen van de verwoesting zal het rusten, omdat het niet rustte in uw sabbatten, toen u daarin woonde.", "Hagg 2:5": "Toch nu, wees sterk, Zerubbabel! spreekt de HEERE; en wees sterk, Josua, zoon van Jozadak, hogepriester! en wees sterk, al u volk van het land! spreekt de HEERE; en werk, want Ik ben met u, spreekt de HEERE van de heerscharen;", "Hebr 8:10-12": "Want dit is het verbond dat Ik met het huis van Israël maken zal na die dagen, zegt de Heere: Ik zal Mijn wetten in hun verstand geven, en in hun harten zal Ik ze inschrijven; en Ik zal hun tot een God zijn, en zij zullen Mij tot een volk zijn. En zij zullen niet leren, ieder zijn naaste en ieder zijn broeder, en zeggen: Ken de Heere; want zij zullen Mij allen kennen, van de kleinste onder hen tot de grootste onder hen. Want Ik zal hun ongerechtigheden genadig zijn, en aan hun zonden en hun overtredingen zal Ik geenszins meer denken.", "Ps 126:1-3": "Een lied Hammaäloth. Toen de HEERE de gevangenen van Sion terugbracht, waren wij als mensen die dromen. Toen was onze mond vol lachen, en onze tong vol gejuich; toen zei men onder de heidenvolken: De HEERE heeft grote dingen aan hen gedaan. De HEERE heeft grote dingen bij ons gedaan; daarom zijn wij verblijd.", "1 Kor 11:20-22": "Als u dan bijeen samenkomt, is dat niet het avondmaal van de Heere eten. Want bij het eten neemt ieder van tevoren zijn eigen avondmaal; en de een is hongerig, en de ander is dronken. Hebt u dan geen huizen om te eten en te drinken? Of veracht u de Gemeente van God, en beschaamt u degenen die niets hebben? Wat zal ik u zeggen? Zal ik u prijzen? Hierin prijs ik u niet.", "Jes 55:1-3": "O, alle dorstigen, kom tot de wateren, en u die geen geld heeft, kom, koop en eet, ja kom, koop zonder geld en zonder prijs, wijn en melk! Waarom weegt u geld uit voor wat geen brood is, en uw arbeid voor wat niet verzadigen kan? Hoor aandachtig naar Mij, en eet het goede, en laat uw ziel zich verlustigen in vettigheid. Neig uw oor, en kom tot Mij, hoor en uw ziel zal leven; want Ik zal met u een eeuwig verbond maken, en u geven de zekere weldaden van David.", "Hand 20:33": "Ik heb niemands zilver, of goud, of kleding begeerd.", "Mark 12:29": "En Jezus antwoordde hem: Het eerste van alle geboden is: Hoor, Israël! De Heere, onze God, is een enig Heere.", "Hand 11:23": "Toen hij daar aangekomen was en de genade van God zag, werd hij blij, en vermaande hen allen dat zij met een vast voornemen van het hart bij de Heere zouden blijven.", "Hebr 4:1-10": "Laat ons dan vrezen dat niet iemand van u, terwijl de belofte om in Zijn rust in te gaan nog geldt, schijnt achtergebleven te zijn. Want ook ons is het Evangelie verkondigd, net als hun; maar het gehoorde woord deed hun geen nut, omdat het bij hen die het hoorden niet met geloof gemengd was. Want wij die geloofd hebben, gaan de rust in, zoals Hij gezegd heeft: Zo heb Ik dan in Mijn toorn gezworen: Zij zullen Mijn rust niet ingaan! Hoewel Zijn werken al vanaf de grondlegging van de wereld volbracht waren.", "Ps 35:9": "Zo zal mijn ziel zich verheugen in de HEERE; zij zal vrolijk zijn in Zijn heil.", "Luk 18:20": "U kent de geboden: U zult geen overspel doen; u zult niet doden; u zult niet stelen; u zult geen valse getuigenis geven; eer uw vader en uw moeder.", "Mark 16:1": "En toen de sabbat voorbij was, hadden Maria Magdalena, en Maria, de moeder van Jakobus, en Salome specerijen gekocht, opdat zij zouden komen en Hem zalven.", "Jes 62:11": "Ziet, de HEERE heeft doen horen, tot aan het einde van de aarde: zegt tegen de dochter van Sion: Zie, uw Heil komt; zie, Zijn loon is met Hem, en Zijn arbeidsloon is voor Zijn aangezicht.", "Hand 4:25": "Die door de mond van David, Uw knecht, gezegd hebt: Waarom woeden de heidenen, en hebben de volken zinloze dingen bedacht?", "Spr 21:21": "Wie rechtvaardigheid en weldadigheid najaagt, zal het leven, rechtvaardigheid en eer vinden.", "1 Tim 6:3-5": "Als iemand een andere leer leert en niet overeenkomt met de gezonde woorden van onze Heere Jezus Christus, en met de leer die overeenkomt met de godsvrucht, is hij opgeblazen en weet hij niets, maar hij raakt bezeten van twistvragen en woordenstrijd; daaruit komen nijd, twist, lasteringen, kwade vermoedens, verkeerde twistgesprekken van mensen die een verdorven verstand hebben en van de waarheid beroofd zijn, en die menen dat de godsvrucht een bron van winst is. Blijf uit de buurt van zulke mensen.", "Job 13:15": "Zie, al doodde Hij mij, zou ik niet hopen? Toch zal ik mijn wegen voor Zijn aangezicht verdedigen.", "Jes 56:2-8": "Gelukkig is de mens die dit doet, en het mensenkind dat daaraan vasthoudt; die de sabbat houdt, zodat hij die niet ontheiligt, en die zijn hand bewaart om geen enkel kwaad te doen. En de vreemdeling, die zich bij de HEERE gevoegd heeft, moet niet zeggen: De HEERE heeft mij helemaal van Zijn volk gescheiden; en de ontmande moet niet zeggen: Zie, ik ben een dorre boom. Want zo zegt de HEERE van de ontmanden, die Mijn sabbatten houden, en verkiezen wat Mij behaagt, en vasthouden aan Mijn verbond;", "Luk 18:29": "En Hij zei tegen hen: Voorwaar, Ik zeg u, er is niemand die huis, of ouders, of broers, of vrouw, of kinderen heeft verlaten om het Koninkrijk van God,", "2 Kor 6:17": "Daarom, ga uit hun midden weg, en scheid u af, zegt de Heere, en raak niet aan wat onrein is, en Ik zal u aannemen,", "Dan 1:3-21": "En de koning zei tegen Aspenaz, de leider van zijn kamerlingen, dat hij enigen uit de kinderen van Israël voor moest brengen, namelijk uit het koninklijk geslacht, en uit de vooraanstaanden; Jongemannen, aan wie geen gebrek was, maar knap van gezicht, en verstandig in alle wijsheid, en ervaren in kennis, en scherp van verstand, en in wie de bekwaamheid was om te staan in het paleis van de koning; en dat men hen zou onderwijzen in de boeken en taal van de Chaldeeën. En de koning bepaalde voor hen wat men hen dag bij dag zou geven van het voedsel van de koning, en van de wijn van zijn drank, en dat men hen drie jaar lang zo grootbracht, en dat zij aan het einde daarvan voor de koning zouden staan.", "Matt 23:16-24": "Wee u, blinde leidslieden, die zeggen: Wie ook zweert bij de tempel, dat is niets; maar wie zweert bij het goud van de tempel, die is verplicht zijn eed te houden. Dwazen en blinden, want wat is meer, het goud, of de tempel die het goud heiligt? En wie zweert bij het altaar, dat is niets; maar wie zweert bij de gave die daarop ligt, die is verplicht zijn eed te houden.", "1 Kor 11:13": "Oordeel bij uzelf: is het gepast dat de vrouw ongedekt tot God bidt?", "Luk 15:4-32": "Welk mens onder u, die honderd schapen heeft, en één daarvan verliest, laat niet de negenennegentig achter in de woestijn, en gaat achter het verlorene aan, totdat hij dat vindt? En als hij het gevonden heeft, legt hij het op zijn schouders, verblijd. En als hij thuiskomt, roept hij de vrienden en de buren bijeen, en zegt tegen hen: Wees blij met mij; want ik heb mijn schaap gevonden, dat verloren was.", "Jes 9:1": "Het volk dat in duisternis wandelt, zal een groot licht zien; wie wonen in het land van de schaduw van de dood, over hen zal een licht schijnen.", "Joh 3:36": "Wie in de Zoon gelooft, heeft het eeuwige leven; maar wie de Zoon ongehoorzaam is, zal het leven niet zien, maar de toorn van God blijft op hem.", "Ps 27:4": "Eén ding heb ik van de HEERE gevraagd, dat zal ik zoeken: dat ik alle dagen van mijn leven mag wonen in het huis van de HEERE, om de liefelijkheid van de HEERE te aanschouwen, en te onderzoeken in Zijn tempel.", "Ef 4:26": "Word toornig, en zondig niet; laat de zon niet ondergaan over uw toorn;", "Nahum 3:18": "Uw herders zullen sluimeren, o koning van Assur! Uw voortreffelijken zullen zich neerleggen, uw volk zal zich op de bergen wijd uitbreiden, en niemand zal ze verzamelen.", "Ps 4:5": "Wees beroerd, en zondig niet; spreek in uw hart op uw bed, en wees stil. Sela.", "Mark 13:22": "Want er zullen valse christussen, en valse profeten opstaan, en zij zullen tekenen en wonderen doen, om te misleiden, indien het mogelijk zou zijn, ook de uitverkorenen.", "Mal 4:6": "En hij zal het hart van de vaders terugbrengen tot de kinderen, en het hart van de kinderen tot hun vaders, zodat Ik niet hoef te komen en de aarde met de ban sla.", "Ezech 20:21": "Maar die kinderen waren ook opstandig tegen Mij; zij wandelden niet in Mijn inzettingen, en Mijn rechten namen zij niet in acht om die te doen, die, als een mens ze doet, hij daardoor zal leven; zij ontheiligden Mijn sabbatten, zodat Ik zei dat Ik Mijn grimmigheid over hen zou uitgieten, om Mijn toorn tegen hen te volbrengen in de woestijn.", "Luk 19:20-25": "En een ander kwam en zei: Heer, zie hier uw pond, dat ik weggelegd had in een zweetdoek; want ik was bang voor u, omdat u een streng mens bent; u neemt weg wat u niet gelegd hebt, en u oogst wat u niet gezaaid hebt. Maar hij zei tegen hem: Naar uw eigen woorden zal ik u oordelen, u slechte dienstknecht! U wist dat ik een streng mens ben, die wegneemt wat ik niet gelegd heb, en oogst wat ik niet gezaaid heb.", "Fil 1:15": "Sommigen prediken Christus wel uit afgunst en twist, maar sommigen ook uit goedwilligheid.", "1 Joh 2:1": "Mijn kinderen, ik schrijf u deze dingen, opdat u niet zondigt. En als iemand gezondigd heeft, hebben wij een Voorspraak bij de Vader, Jezus Christus, de Rechtvaardige;", "Joh 13:18": "Ik zeg dit niet van u allen: Ik weet wie Ik uitverkoren heb; maar dit gebeurt, opdat de Schrift vervuld wordt: Die met Mij het brood eet, heeft tegen Mij zijn hiel opgeheven.", "Lev 26:2": "Mijn sabbatten zult u houden, en Mijn heiligdom zult u vrezen; Ik ben de HEERE!", "Hebr 1:8": "Maar tot de Zoon zegt Hij: Uw troon, o God, is er in alle eeuwigheid; de scepter van Uw koninkrijk is een rechte scepter.", "Job 8:4-7": "Als uw kinderen tegen Hem gezondigd hebben, dan heeft Hij hen ook overgegeven aan de macht van hun overtreding. Maar als u God vroeg zoekt, en tot de Almachtige om genade bidt; als u zuiver en oprecht bent, zeker zal Hij dan nu ontwaken om uwentwil, en Hij zal de woning van uw gerechtigheid herstellen.", "Lev 26:12": "En Ik zal in uw midden wandelen, en zal u tot een God zijn, en u zult Mij tot een volk zijn.", "Richt 16:20": "En zij zei: De Filistijnen over u, Simson! En hij werd wakker uit zijn slaap, en zei: Ik zal ditmaal uitgaan, zoals de andere keren, en mij uitschudden; want hij wist niet, dat de HEERE van hem geweken was.", "Ps 112:9": "Pe. Hij strooit uit, hij geeft aan de arme; Tsade. zijn gerechtigheid houdt stand tot in eeuwigheid; Koph. zijn hoorn zal verhoogd worden in eer.", "Job 36:7-12": "Hij trekt Zijn ogen niet terug van de rechtvaardige, maar met de koningen zijn zij op de troon; daar zet Hij hen voor altijd, en zij worden verheven. En als zij, gebonden met boeien, vastgehouden worden met banden van ellende; Dan maakt Hij hun hun daden bekend, en hun overtredingen, omdat zij de overhand genomen hebben;", "Zach 11:4": "Zo zegt de HEERE, mijn God: Weid deze slachtschapen.", "Ps 8:3": "Uit de mond van de kinderen en de zuigelingen hebt U sterkte gegrondvest, omwille van Uw tegenstanders, om de vijand en de wraakgierige te doen ophouden.", "2 Tim 3:13": "Maar de slechte mensen en bedriegers zullen van kwaad tot erger gaan, zij verleiden en worden verleid.", "Jes 8:17": "Daarom zal ik de HEERE verwachten, Die Zijn aangezicht verbergt voor het huis van Jakob, en ik zal Hem verwachten.", "Rom 10:16": "Maar zij zijn niet allen het Evangelie gehoorzaam geweest; want Jesaja zegt: Heere, wie heeft onze prediking geloofd?", "Zach 4:10": "Want wie veracht de dag van de kleine dingen? Toch zullen die zeven zich verblijden, als zij het tinnen gewicht zullen zien in de hand van Zerubbabel; dat zijn de ogen van de HEERE, die het hele land doorkruisen.", "Ps 68:19-21": "U bent opgevaren in de hoogte; U hebt de gevangenis gevankelijk weggevoerd; U hebt gaven genomen om uit te delen onder de mensen; ja, ook de opstandigen, om bij U te wonen, o HEERE God! Geloofd zij de Heere; dag bij dag overlaadt Hij ons. Die God is onze Zaligheid. Sela. Die God is voor ons een God van volkomen zaligheid; en bij de HEERE, de Heere, zijn de uitkomsten tegen de dood.", "Spr 13:9": "Het licht van de rechtvaardigen zal zich verblijden; maar de lamp van de goddelozen zal uitgeblust worden.", "Luk 7:14": "En Hij kwam erbij en raakte de baar aan; (de dragers stonden toen stil) en Hij zei: Jongeman, Ik zeg u: sta op!", "Ps 51:10": "Doe mij vreugde en blijdschap horen; laat de beenderen zich verheugen die U verbrijzeld hebt.", "Spr 3:34": "Zeker, de spotters zal Hij bespotten, maar aan de zachtmoedigen zal Hij genade geven.", "1 Kron 16:35": "En zegt: Verlos ons, o God van ons heil, en verzamel ons, en red ons van de heidenen, opdat wij Uw heilige Naam loven, en opdat wij ons in Uw lof roemen.", "Joh 16:2": "Zij zullen u uit de synagogen werpen; ja, de tijd komt dat ieder die u doodt, zal denken God een dienst te doen.", "Gal 3:11": "En dat niemand door de wet gerechtvaardigd wordt voor God, is duidelijk; want de rechtvaardige zal uit het geloof leven.", "Ps 30:7": "Ik zei wel in mijn voorspoed: Ik zal nooit wankelen.", "Jer 23:17": "Zij zeggen steeds tegen hen die Mij lasteren: De HEERE heeft het gesproken, u zult vrede hebben; en tegen ieder die naar het goeddunken van zijn eigen hart wandelt, zeggen zij: U zal geen kwaad overkomen.", "Matt 22:37": "En Jezus zei tegen hem: U zult de Heere, uw God, liefhebben met heel uw hart, en met heel uw ziel, en met heel uw verstand.", "Jes 52:11": "Vertrek, vertrek, ga daarvandaan weg, raak het onreine niet aan; ga weg uit hun midden, reinig u, u die de voorwerpen van de HEERE draagt!", "Jer 12:5": "Als u loopt met de voetgangers, zo maken zij u moe; hoe zult u zich dan meten met de paarden? Als u alleen vertrouwt in een land van vrede, hoe zult u het dan maken in de verheffing van de Jordaan?", "Joh 14:1-3": "Laat uw hart niet ontroerd worden; u gelooft in God, geloof ook in Mij. In het huis van Mijn Vader zijn veel woningen; anders zou Ik het u gezegd hebben. Ik ga heen om u plaats te bereiden. En wanneer Ik heen zal zijn gegaan en u plaats zal hebben bereid, kom Ik terug en zal u tot Mij nemen, opdat u ook mag zijn waar Ik ben.", "Hand 22:17": "En het gebeurde mij, toen ik naar Jeruzalem was teruggekeerd en in de tempel bad, dat ik in een geestverrukking raakte,", "Ps 82:5": "Zij weten niet, en verstaan niet; zij wandelen steeds in duisternis; daardoor wankelen alle fundamenten van de aarde.", "1 Joh 5:11": "En dit is het getuigenis, namelijk dat God ons het eeuwige leven gegeven heeft; en dit leven is in Zijn Zoon.", "Ps 132:14": "Dit is Mijn rust tot in eeuwigheid, hier zal Ik wonen, want Ik heb het begeerd.", "Job 22:26": "Want dan zult u zich verlustigen over de Almachtige, en u zult uw aangezicht opheffen tot God.", "Ef 6:3": "opdat het u goed gaat, en u lang leeft op de aarde.", "Ps 2:11": "Dient de HEERE met vrees, en verheugt u met beving.", "1 Tess 3:12": "En moge de Heere u doen toenemen en overvloedig maken in de liefde tot elkaar en tot allen, zoals wij ook zijn tot u,", "Kol 1:27": "aan wie God bekend heeft willen maken wat de rijkdom is van de heerlijkheid van deze verborgenheid onder de heidenen, welke is Christus onder u, de Hoop der heerlijkheid;", "1 Kor 15:32": "Als ik, naar de mens gesproken, tegen wilde dieren gevochten heb in Efeze, wat baat het mij, als de doden niet opgewekt worden? Laten wij eten en drinken, want morgen sterven wij.", "1 Petr 2:7": "Voor u dan, die gelooft, is Hij kostbaar; maar voor de ongehoorzamen geldt: de Steen die de bouwers verworpen hebben, Die is geworden tot een hoeksteen,", "Dan 12:10": "Velen zullen gereinigd, wit gemaakt en gelouterd worden; maar de goddelozen zullen goddeloos handelen, en geen van de goddelozen zal het begrijpen, maar de verstandigen zullen het begrijpen.", "Rom 1:5": "(Door Wie wij genade en het apostelschap hebben ontvangen, tot gehoorzaamheid van het geloof onder alle heidenen, voor Zijn Naam;", "2 Kor 13:1": "Dit is de derde keer dat ik naar u toe kom; op grond van de verklaring van twee of drie getuigen zal elk woord vaststaan.", "Hand 26:18": "Om hun ogen te openen en hen te bekeren van de duisternis tot het licht, en van de macht van de satan tot God; opdat zij vergeving van de zonden ontvangen, en een erfdeel onder de geheiligden, door het geloof in Mij.", "1 Kor 15:33": "Dwaal niet. Slechte omgang bederft goede zeden.", "Openb 5:9": "En zij zongen een nieuw lied: U bent waard dat boek te nemen en zijn zegels te openen; want U bent geslacht, en hebt ons voor God gekocht met Uw bloed, uit elk geslacht, en taal, en volk, en natie;", "1 Kor 6:3": "Weet u niet, dat wij de engelen zullen oordelen? Hoeveel te meer de zaken die dit leven aangaan?", "Hebr 11:18": "(tegen wie gezegd was: In Izak zal uw nageslacht genoemd worden),", "Hand 3:1": "Petrus en Johannes gingen samen op naar de tempel, omtrent het uur van het gebed, het negende uur.", "2 Kor 7:1": "Omdat wij dan deze beloften hebben, geliefden, laten wij onszelf reinigen van alle besmetting van het vlees en van de geest, en zo de heiligmaking volbrengen in de vreze van God.", "Ps 2:8": "Eis van Mij, en Ik zal de heidenen geven tot Uw erfdeel, en de einden van de aarde tot Uw bezitting.", "Job 22:21-30": "Gewen u toch aan Hem, en heb vrede; daardoor zal het goede u overkomen. Ontvang toch de wet uit Zijn mond, en leg Zijn woorden in uw hart. Als u zich bekeert tot de Almachtige, zult u gebouwd worden; doe het onrecht ver van uw tenten.", "Jes 42:6": "Ik, de HEERE, heb u geroepen in gerechtigheid, en Ik zal u bij uw hand grijpen; en Ik zal u behoeden, en Ik zal u geven tot een Verbond van het volk, tot een Licht van de heidenen.", "Jes 59:20": "En er zal een Verlosser tot Sion komen, namelijk voor hen die zich bekeren van de overtreding in Jakob, spreekt de HEERE.", "Ps 125:1-3": "Een lied Hammaaloth. Wie op de HEERE vertrouwen, zijn als de berg Sion, die niet wankelt, maar blijft in eeuwigheid. Rondom Jeruzalem zijn bergen; zo is de HEERE rondom Zijn volk, van nu aan tot in eeuwigheid. Want de scepter van de goddeloosheid zal niet rusten op het lot van de rechtvaardigen; opdat de rechtvaardigen hun handen niet uitstrekken tot onrecht.", "Ps 92:7": "Een redeloos man weet er niet van, en een dwaas begrijpt dit niet;", "Fil 1:16": "Dezen verkondigen Christus wel uit eigenbelang, niet zuiver, en menen aan mijn banden verdrukking toe te brengen;", "Jes 28:1": "Wee de hoogmoedige kroon van de dronkaards van Efraïm, wiens heerlijke sieraad een verwelkende bloem is, die daar is op het hoofd van de zeer vruchtbare vallei, van hen die door de wijn geveld zijn.", "Jes 28:3": "De hoogmoedige kroon van de dronkaards van Efraïm zal met voeten vertrapt worden.", "1 Joh 2:15-17": "Heb de wereld niet lief, en ook niet wat in de wereld is; als iemand de wereld liefheeft, is de liefde van de Vader niet in hem. Want al wat in de wereld is, namelijk de begeerte van het vlees, en de begeerte van de ogen, en de hoogmoed van het leven, is niet uit de Vader, maar is uit de wereld. En de wereld gaat voorbij, en haar begeerte; maar wie de wil van God doet, blijft tot in eeuwigheid.", "Joh 16:22": "En u hebt dan nu wel droefheid; maar Ik zal u opnieuw zien, en uw hart zal zich verblijden, en niemand zal uw blijdschap van u wegnemen.", "Ps 97:11": "Het licht is gezaaid voor de rechtvaardige, en vrolijkheid voor de oprechten van hart.", "Rom 12:19": "Wreek uzelf niet, geliefden, maar geef de toorn plaats; want er is geschreven: Mij komt de wraak toe; Ik zal het vergelden, zegt de Heere.", "Ps 110:4": "De HEERE heeft gezworen, en het zal Hem niet berouwen: U bent Priester in eeuwigheid, naar de ordening van Melchizedek.", "Ex 28:34": "Dat er een gouden schelletje, daarna een granaatappel is; opnieuw een gouden schelletje, en een granaatappel, aan de zomen van de mantel rondom.", "Rom 3:22": "namelijk de gerechtigheid van God door het geloof van Jezus Christus, tot allen, en over allen die geloven; want er is geen onderscheid.", "1 Kor 13:6": "Zij verblijdt zich niet in de ongerechtigheid, maar zij verblijdt zich in de waarheid;", "Gal 3:8": "En de Schrift, die van tevoren zag dat God de heidenen uit het geloof zou rechtvaardigen, heeft van tevoren aan Abraham het Evangelie verkondigd, en zei: In u zullen alle volken gezegend worden.", "Jer 23:13": "Ik heb wel dwaasheid gezien in de profeten van Samaria; zij profeteerden door Baäl, en verleidden Mijn volk Israël.", "Jes 30:5": "Hij zal hen allen beschaamd maken door een volk dat hun geen nut kan doen, noch tot hulp, noch tot voordeel, maar tot schande en ook tot smaad zijn zal.", "Openb 3:17": "Want u zegt: Ik ben rijk, en verrijkt geworden, en heb aan niets gebrek; en u weet niet dat u ellendig bent, en jammerlijk, en arm, en blind, en naakt.", "Luk 2:35": "(En ook een zwaard zal door uw eigen ziel gaan) opdat de gedachten uit veel harten geopenbaard worden.", "Hos 4:6": "Mijn volk is uitgeroeid, omdat het zonder kennis is; omdat u de kennis verworpen hebt, heb Ik u ook verworpen, zodat u Mij het priesterambt niet zult bedienen; omdat u de wet van uw God vergeten hebt, zal Ik ook uw kinderen vergeten.", "Ps 107:9": "Want Hij heeft de dorstige ziel verzadigd, en de hongerige ziel met goeds vervuld;", "Rom 2:10": "Maar heerlijkheid, en eer, en vrede voor ieder die het goede doet, eerst de Jood, en ook de Griek.", "Ps 119:162": "Ik ben vrolijk over Uw toezegging, als iemand, die een grote buit vindt.", "Rom 9:13": "Zoals geschreven is: Jakob heb Ik liefgehad, en Ezau heb Ik gehaat.", "Matt 3:9": "En denk niet bij uzelf te zeggen: Wij hebben Abraham als vader; want ik zeg u dat God zelfs uit deze stenen voor Abraham kinderen kan verwekken.", "Ezech 34:1-31": "En het woord van de HEERE gebeurde tot mij, en Hij zei: Mensenkind! Profeteer tegen de herders van Israël; profeteer en zeg tot hen, tot de herders: Zo zegt de Heere HEERE: Wee de herders van Israël, die zichzelf weiden! Zullen niet de herders de schapen weiden? U eet het vette, en bekleedt u met de wol, u slacht het gemeste, maar de schapen weidt u niet.", "Ps 28:7": "De HEERE is mijn Sterkte en mijn Schild; op Hem heeft mijn hart vertrouwd, en ik ben geholpen; daarom springt mijn hart op van vreugde, en ik zal Hem met mijn gezang loven.", "Ps 98:3": "Hij is gedachtig geweest aan Zijn goedertierenheid en Zijn waarheid aan het huis van Israël; en alle einden van de aarde hebben het heil van onze God gezien.", "Ex 20:12-16": "Eer uw vader en uw moeder, opdat uw dagen verlengd worden in het land dat de HEERE, uw God, u geeft. U zult niet doodslaan. U zult geen echtbreuk plegen.", "1 Petr 4:13": "maar zoals u gemeenschap hebt aan het lijden van Christus, zo verblijdt u; opdat u ook in de openbaring van Zijn heerlijkheid u mag verblijden en verheugen.", "Jes 28:15": "Omdat u zegt: Wij hebben een verbond met de dood gemaakt, en met het rijk van de dood hebben wij een voorzichtig verdrag gemaakt; wanneer de overstromende gesel doortrekt, zal hij bij ons niet komen; want wij hebben de leugen ons tot een toevlucht gesteld, en onder de valsheid hebben wij ons verborgen.", "Hab 2:14": "Want de aarde zal vervuld worden met de kennis van de heerlijkheid van de HEERE, zoals het water de bodem van de zee bedekt.", "Jer 8:10": "Daarom zal Ik hun vrouwen aan anderen geven, hun akkers aan andere bezitters; want van de kleinste tot de grootste toe pleegt ieder van hen gierigheid; van de profeet tot de priester toe bedrijft ieder van hen valsheid.", "Hos 14:4": "Assur zal ons niet behouden, wij zullen niet rijden op paarden, en tegen het werk van onze handen niet meer zeggen: U bent onze God. Zeker zal een wees bij U ontfermd worden.", "Mark 10:24": "En de discipelen waren verbaasd over deze woorden van Hem. Maar Jezus antwoordde weer en zei tegen hen: Kinderen, hoe moeilijk is het voor hen die op rijkdom vertrouwen, om het Koninkrijk van God binnen te gaan!", "Luk 4:4": "En Jezus antwoordde hem: Er is geschreven dat de mens niet van brood alleen zal leven, maar van elk woord van God.", "Jer 33:15-18": "In die dagen, en te dien tijde zal Ik David een SPRUIT van gerechtigheid doen opkomen; en Hij zal recht en gerechtigheid doen op aarde. In die dagen zal Juda verlost worden, en Jeruzalem zal veilig wonen; en dit is de naam waarmee zij genoemd zal worden: De Heere, ONZE GERECHTIGHEID. Want zo zegt de HEERE: Aan David zal het nooit ontbreken aan een Man, Die op de troon van het huis van Israël zit.", "Ps 72:1-20": "Voor Salomo. O God! Geef de koning Uw rechten, en Uw gerechtigheid de zoon van de koning. Zo zal hij Uw volk richten met gerechtigheid, en Uw ellendigen met recht. De bergen zullen aan het volk vrede dragen, ook de heuvels, met gerechtigheid.", "Ps 41:2": "Gelukkig is hij, die zich verstandig gedraagt tegenover een ellendige; de HEERE zal hem bevrijden ten dage des kwaads.", "Mark 12:33": "en Hem lief te hebben uit heel het hart, en uit heel het verstand, en uit heel de ziel, en uit heel de kracht; en de naaste lief te hebben als zichzelf, is meer dan alle brandoffers en slachtoffers.", "Jes 61:3": "Om de treurenden van Sion te geven, dat hun sieraad gegeven wordt voor as, vreugdeolie voor treurigheid, het gewaad van lof voor een benauwde geest; opdat zij eikenbomen van de gerechtigheid genoemd worden, een planting van de HEERE, opdat Hij verheerlijkt wordt.", "1 Petr 3:16": "en heb een goed geweten, opdat zij die uw goede wandel in Christus belasteren, beschaamd gemaakt worden in datgene waarin zij kwaad van u spreken, alsof u kwaaddoeners bent.", "Hand 28:28": "Laat het u dan bekend zijn dat de zaligheid van God naar de heidenen gezonden is, en die zullen horen.", "Ps 69:37": "En het zaad van Zijn dienaars zal haar beërven; en de liefhebbers van Zijn Naam zullen daarin wonen.", "Ps 16:6": "De snoeren zijn mij op fijne plaatsen gevallen; ja, een mooie erfenis is mij ten deel gevallen.", "Matt 20:6": "En hij ging uit, omtrent het elfde uur, en vond anderen werkloos staan, en zei tegen hen: Wat staat u hier de hele dag werkloos?", "Ps 55:15": "Wij die samen in zoetheid heimelijk raadpleegden; wij wandelden in gezelschap naar het huis van God.", "Hand 5:20": "Ga heen, en sta, en spreek in de tempel tot het volk al de woorden van dit leven.", "Rom 2:13": "(Want de hoorders van de wet zijn niet rechtvaardig voor God, maar de daders van de wet zullen gerechtvaardigd worden;", "Rom 9:1": "Ik zeg de waarheid in Christus, ik lieg niet (mijn geweten geeft mij daarbij getuigenis door de Heilige Geest),", "Ps 24:1": "Een psalm van David. De aarde is van de HEERE, alsook haar volheid, de wereld, en zij die daarin wonen.", "Hab 3:18": "Zo zal ik toch in de HEERE van vreugde opspringen, ik zal mij verheugen in de God van mijn heil.", "Job 31:28": "Dat ware ook een misdaad bij de rechter; want ik zou de God van boven verzaakt hebben.", "Matt 13:43": "Dan zullen de rechtvaardigen stralen als de zon, in het Koninkrijk van hun Vader. Wie oren heeft om te horen, laat hij horen.", "Ex 20:8-11": "Gedenk de sabbatdag, dat u die heiligt. Zes dagen zult u arbeiden en al uw werk doen; maar de zevende dag is de sabbat van de HEERE, uw God; dan zult u geen werk doen, u, noch uw zoon, noch uw dochter, noch uw dienstknecht, noch uw dienstmaagd, noch uw vee, noch uw vreemdeling die in uw poorten is;", "Ps 49:8": "niemand van hen zal zijn broeder ooit kunnen verlossen; hij zal aan God zijn losprijs niet kunnen geven;", "Joël 2:29": "Ja, ook over de dienstknechten, en over de dienstmaagden, zal Ik in die dagen Mijn Geest uitgieten.", "1 Kor 9:9": "Want in de wet van Mozes staat geschreven: U zult een dorsende os niet muilbanden. Zorgt God soms voor de ossen?", "Luk 10:42": "maar één ding is nodig; en Maria heeft het goede deel uitgekozen, dat niet van haar zal worden weggenomen.", "Ps 98:2": "De HEERE heeft Zijn heil bekendgemaakt; Hij heeft Zijn gerechtigheid geopenbaard voor de ogen van de heidenen.", "Matt 4:10": "Toen zei Jezus tegen hem: Ga weg, satan, want er staat geschreven: De Heere, uw God, zult u aanbidden, en Hem alleen dienen.", "Spr 14:23": "In alle smartelijke arbeid is winst; maar het woord van de lippen leidt alleen tot gebrek.", "Ps 33:21": "Want ons hart is in Hem verblijd, omdat wij op de Naam van Zijn heiligheid vertrouwen.", "2 Kor 10:17": "Maar wie roemt, laat die roemen in de Heere.", "Ps 34:15": "Samech. Wijk af van het kwaad, en doe het goede; zoek de vrede, en jaag die na.", "Ezech 3:15-18": "En ik kwam tot de weggevoerden te Tel-Abib, die aan de rivier Chebar woonden, en ik bleef daar zij woonden; ja, ik bleef daar verbaasd in het midden van hen zeven dagen. Het gebeurde nu aan het einde van zeven dagen, dat het woord van de HEERE tot mij kwam, en zei: Mensenkind! Ik heb u tot een wachter gesteld over het huis Israëls; zo zult u het woord uit Mijn mond horen, en hen namens Mij waarschuwen.", "Jer 31:33": "Maar dit is het verbond dat Ik na die dagen met het huis van Israël sluiten zal, spreekt de HEERE: Ik zal Mijn wet in hun binnenste geven, en zal die in hun hart schrijven; en Ik zal hun tot een God zijn, en zij zullen Mij tot een volk zijn.", "1 Petr 3:9-12": "vergeld geen kwaad met kwaad, of schelden met schelden, maar zegen daarentegen; want u weet dat u daartoe geroepen bent, opdat u zegening zou beërven. Want wie het leven wil liefhebben en goede dagen wil zien, die moet zijn tong weerhouden van het kwade, en zijn lippen, zodat ze geen bedrog spreken; hij moet wijken van het kwade en het goede doen; hij moet vrede zoeken en die najagen.", "Jer 7:11": "Is dan dit huis, dat naar Mijn Naam genoemd is, in uw ogen een schuilplaats van rovers? Zie, Ik heb het ook gezien, spreekt de HEERE.", "Jes 52:7": "Hoe lieflijk zijn op de bergen de voeten van hem die het goede nieuws brengt, die de vrede laat horen; van hem die goed nieuws brengt van het goede, die heil laat horen; van hem die tegen Sion zegt: Uw God is Koning.", "Mark 12:30": "En u zult de Heere, uw God, liefhebben uit heel uw hart, en uit heel uw ziel, en uit heel uw verstand, en uit heel uw kracht. Dit is het eerste gebod.", "Ezra 9:15": "O HEERE, God van Israël! U bent rechtvaardig; want wij zijn overgelaten ter ontkoming, zoals het is op deze dag. Zie, wij zijn voor Uw aangezicht in onze schuld; want er is niemand die voor Uw aangezicht zou kunnen bestaan, om hiervan.", "Dan 9:24-27": "Zeventig weken zijn bestemd over uw volk en over uw heilige stad, om de overtreding te sluiten, en om de zonden te verzegelen, en om de ongerechtigheid te verzoenen, en om een eeuwige gerechtigheid aan te brengen, en om het visioen en de profeet te verzegelen, en om het allerheiligst te zalven. Weet dan, en versta: van het uitgaan van het woord om te doen terugkeren en om Jeruzalem te bouwen, tot op de Messias, de Vorst, zijn zeven weken, en tweeënzestig weken; de straten en de grachten zullen weer gebouwd worden, maar in benauwdheid van de tijden. En na die tweeënzestig weken zal de Messias uitgeroeid worden, maar het zal niet voor Hemzelf zijn; en een volk van de vorst die komen zal, zal de stad en het heiligdom verderven, en zijn einde zal zijn met een overstromende vloed, en tot het einde toe zal er oorlog zijn, en vast besloten verwoestingen.", "Pred 5:7": "Als u de onderdrukking van de arme, en de beroving van het recht en de gerechtigheid ziet in een landstreek, verwonder u dan niet over zo'n gang van zaken; want wie hoger is dan de hoge, let daarop; en er zijn hogeren boven hen.", "Deut 5:21": "En u zult niet begeren de vrouw van uw naaste; en u zult zich niet laten gelusten naar het huis van uw naaste, zijn akker, noch zijn dienstknecht, noch zijn dienstmaagd, zijn os, noch zijn ezel, noch iets dat van uw naaste is.", "Ps 72:17": "Zijn naam zal zijn tot in eeuwigheid; zolang als er de zon is, zal zijn naam van kind tot kind voortgeplant worden; en zij zullen in hem gezegend worden; alle heidenvolken zullen hem gelukkig noemen.", "Jes 66:18-21": "Hun werken en hun gedachten! Het komt, dat Ik alle heidenen en talen zal verzamelen, en zij zullen komen, en zij zullen Mijn heerlijkheid zien. En Ik zal een teken bij hen zetten, en uit hen die ontkomen zijn, zal Ik zenden naar de heidenen, naar Tarsis, Pul en Lud, de boogschutters, naar Tubal en Javan, naar de ver gelegen eilanden, die Mijn faam niet gehoord en Mijn heerlijkheid niet gezien hebben; en zij zullen Mijn heerlijkheid onder de heidenen verkondigen. En zij zullen al uw broeders uit alle heidenen naar de HEERE brengen als spijsoffer, op paarden, en op wagens, en op draagstoelen, en op muildieren, en op snelle lopers, naar Mijn heilige berg toe, naar Jeruzalem, zegt de HEERE, zoals de kinderen van Israël het spijsoffer in een rein vat brengen naar het huis van de HEERE.", "Ef 1:9": "Ons bekendgemaakt hebbend het geheimenis van Zijn wil, naar Zijn welbehagen, dat Hij voorgenomen had in Zichzelf.", "Rom 5:9": "Veelmeer dan zullen wij, nu gerechtvaardigd door Zijn bloed, door Hem behouden worden van de toorn.", "Ef 5:3": "Maar hoererij en alle onreinheid, of hebzucht, laat onder u zelfs niet genoemd worden, zoals het de heiligen betaamt,", "Ps 108:13": "Geeft U ons hulp uit de benauwdheid; want het heil van de mens is ijdelheid.", "Jer 21:13": "Zie, Ik zál tegen u, inwoonster van het dal, rots van het plein! spreekt de HEERE; u, die zegt: Wie zou tegen ons afkomen, of wie zou komen in onze woningen?", "Hagg 2:7": "Want zo zegt de HEERE van de heerscharen: Nog eenmaal, over een korte tijd, zal het zover zijn; en Ik zal de hemel, en de aarde, en de zee, en het droge doen beven.", "Ps 69:36": "Want God zal Sion verlossen, en de steden van Juda bouwen; en daar zullen zij wonen, en haar erfelijk bezitten;", "Ps 65:5": "Gelukkig is hij, die U verkiest, en doet naderen, dat hij woont in Uw voorhoven; wij zullen verzadigd worden met het goed van Uw huis, met het heilige van Uw paleis.", "Ps 29:2": "Geef de HEERE de eer van Zijn Naam, aanbid de HEERE in de heerlijkheid van het heiligdom.", "Job 31:1-40": "Ik heb een verbond gemaakt met mijn ogen; hoe zou ik dan acht gegeven hebben op een maagd? Want wat is het deel van God van boven, of de erve van de Almachtige uit de hoogten? Is niet het verderf voor de verkeerde, ja, wat vreemds voor de werkers van ongerechtigheid?", "Jes 42:1-4": "Zie, Mijn Knecht, Die Ik ondersteun, Mijn Uitverkorene, in Wie Mijn ziel een welbehagen heeft! Ik heb Mijn Geest op Hem gegeven; Hij zal het recht aan de heidenen voortbrengen. Hij zal niet schreeuwen, noch Zijn stem verheffen, noch Zijn stem op straat horen laten. Het geknakte riet zal Hij niet breken, en de rokende vlaswiek zal Hij niet uitblussen; met waarheid zal Hij het recht voortbrengen.", "Rom 5:1": "Wij dan, gerechtvaardigd zijnde uit het geloof, hebben vrede bij God, door onze Heere Jezus Christus;", "Luk 20:17": "Maar Hij keek hen aan en zei: Wat betekent dan wat er geschreven staat: De steen die de bouwers verworpen hebben, die is de hoeksteen geworden?", "1 Kor 2:8": "Welke niemand van de leiders van deze wereld gekend heeft; want als zij haar gekend hadden, zouden zij de Heere der heerlijkheid niet gekruisigd hebben.", "Jes 28:11": "Daarom zal Hij door belachelijke lippen en door een andere tong tot dit volk spreken;", "Ef 4:18": "Verduisterd in het verstand, vervreemd van het leven van God, door de onwetendheid die in hen is, door de verharding van hun hart;", "Luk 13:30": "En zie, er zijn laatsten die de eersten zullen zijn, en er zijn eersten die de laatsten zullen zijn.", "Spr 17:26": "Het is niet goed, de rechtvaardige te straffen, laat staan dat men vorsten zou slaan om wat recht is.", "Hand 3:25": "U bent kinderen van de profeten, en van het verbond dat God met onze vaderen gesloten heeft, toen Hij tegen Abraham zei: En in uw nageslacht zullen alle geslachten van de aarde gezegend worden.", "Zach 11:13": "Doch de HEERE zei tegen mij: Werp ze heen voor de pottenbakker: een heerlijke prijs, die Ik van hen waard geacht ben geweest! En ik nam die dertig zilverlingen, en wierp ze in het huis van de HEERE, voor de pottenbakker.", "Jes 54:7": "Voor een klein ogenblik heb Ik u verlaten; maar met grote ontfermingen zal Ik u verzamelen.", "2 Petr 2:14": "zij hebben ogen vol overspel, die niet ophouden met zondigen; zij verleiden onvaste zielen, hebben een hart geoefend in hebzucht, en zijn kinderen van de vervloeking;", "Joh 12:31": "Nu is het oordeel over deze wereld; nu zal de leider van deze wereld buitengeworpen worden.", "Hand 20:21": "Terwijl ik zowel Joden als Grieken heb betuigd de bekering tot God en het geloof in onze Heere Jezus Christus.", "Micha 5:1-14": "En u, Bethlehem Efratha, bent u klein om te zijn onder de duizenden van Juda? Uit u zal Mij Iemand voortkomen, Die een Heerser zal zijn in Israël, en Wiens uitgangen zijn van oudsher, van de dagen van de eeuwigheid. Daarom zal Hij hen overgeven, tot de tijd toe dat zij, die baren zal, gebaard heeft; dan zullen de overigen van Zijn broeders zich bekeren met de kinderen van Israël. En Hij zal staan, en zal weiden in de kracht van de HEERE, in de hoogheid van de Naam van de HEERE, Zijn God, en zij zullen wonen, want nu zal Hij groot zijn tot aan de einden van de aarde.", "Hand 13:47": "Want zo heeft de Heere ons geboden: Ik heb u gesteld tot een licht voor de heidenen, opdat u tot zaligheid zou zijn, tot aan het uiterste van de aarde.", "Ex 19:10-13": "Ook zei de HEERE tot Mozes: Ga tot het volk, en heilig hen heden en morgen, en laat hen hun kleren wassen, En gereed zijn tegen de derde dag; want op de derde dag zal de HEERE voor de ogen van al het volk neerkomen, op de berg Sinaï. En bepaal de grens voor het volk rondom, en zeg: Wacht ervoor de berg te beklimmen en de rand ervan aan te raken; al wie de berg aanraakt, zal zeker gedood worden.", "Gen 18:19": "Want Ik heb hem gekend, opdat hij zijn kinderen en zijn huis na hem zou opdragen, en zij de weg van de HEERE zouden bewaren, om gerechtigheid en recht te doen; opdat de HEERE over Abraham brengt wat Hij over hem gesproken heeft.", "Joh 19:24": "Zij zeiden dan tegen elkaar: Laten wij die niet scheuren, maar erom loten, van wie die zal zijn; opdat de Schrift vervuld wordt, die zegt: Zij hebben Mijn kleren onder elkaar verdeeld, en over Mijn kleding hebben zij het lot geworpen. Dit hebben de soldaten dan gedaan.", "Kol 2:4": "En dit zeg ik, opdat niemand u misleidt met overredende woorden, die een schijn van waarheid hebben.", "Luk 3:3-9": "En hij kwam in heel het omliggende land van de Jordaan, en predikte de doop van bekering tot vergeving van zonden, zoals geschreven is in het boek van de woorden van Jesaja, de profeet, die zei: De stem van iemand die roept in de woestijn: Bereid de weg van de Heere, maak Zijn paden recht! Elk dal zal gevuld worden, en elke berg en heuvel zal verlaagd worden, en de kromme wegen zullen tot een rechte weg worden, en de oneffen tot effen wegen.", "Ps 111:3": "He. Zijn doen is majesteit en heerlijkheid; Vau. en Zijn gerechtigheid bestaat in eeuwigheid.", "Jes 24:11": "Er is een klagelijk geroep op de straten, om de wijn; alle blijdschap is verduisterd, de vreugde van het land is heengegaan.", "Openb 5:13": "En elk schepsel dat in de hemel is, en op de aarde, en onder de aarde, en die in de zee zijn, en alles wat daarin is, hoorde ik zeggen: Hem Die op de troon zit, en het Lam, zij de dankzegging, en de eer, en de heerlijkheid, en de kracht, tot in alle eeuwigheid.", "Deut 5:16": "Eer uw vader en uw moeder, zoals de HEERE, uw God, u geboden heeft, opdat uw dagen verlengd worden, en opdat het u goed gaat in het land dat de HEERE, uw God, u geven zal.", "Hand 1:20": "Want er staat geschreven in het boek van de Psalmen: Zijn woonstede moet woest worden, en er mag niemand zijn die erin woont. En: Een ander moet zijn opzienersambt overnemen.", "Deut 25:1-4": "Wanneer er tussen mannen twist is, en zij naar het gerecht gaan zodat men hen recht spreekt, dan zal men de rechtvaardige rechtvaardig verklaren, en de onrechtvaardige veroordelen. En het zal gebeuren, als de onrechtvaardige slagen verdiend heeft, dat de rechter hem zal laten neervallen, en hem in zijn tegenwoordigheid laten slaan, naar het aantal dat past bij zijn onrechtvaardigheid. Met veertig slagen zal hij hem laten slaan, hij zal er niet meer bij doen; anders zou hij, als hij méér dan dat aantal slagen zou laten geven, uw broeder voor uw ogen verachtelijk maken.", "1 Kron 16:29": "Geeft de HEERE de eer van Zijn Naam, brengt offer, en komt voor Zijn aangezicht; aanbidt de HEERE in de heerlijkheid van het heiligdom.", "Rom 11:8": "(Zoals geschreven is: God heeft hun een geest van diepe slaap gegeven; ogen om niet te zien, en oren om niet te horen) tot op deze huidige dag.", "Spr 1:21": "Zij roept op de belangrijkste plaats van de samenscholingen; aan de deuren van de poorten spreekt Zij Haar woorden in de stad;", "Spr 3:25": "Vrees niet voor plotselinge schrik, of voor de verwoesting van de goddelozen, als die komt.", "Matt 18:13": "En als het gebeurt dat hij het vindt, voorwaar, Ik zeg u, dat hij zich meer verblijdt over dat schaap dan over de negenennegentig die niet afgedwaald zijn.", "Ps 28:8": "De HEERE is hun Sterkte, en Hij is de Sterkheid van de verlossingen van Zijn Gezalfde.", "Jes 57:2": "Hij zal ingaan in de vrede; zij zullen rusten op hun slaapsteden, ieder die in zijn oprechtheid gewandeld heeft.", "Matt 22:9": "Ga daarom naar de kruispunten van de wegen, en roep zovelen als u er zult vinden, naar de bruiloft.", "Openb 22:4": "En zij zullen Zijn aangezicht zien, en Zijn Naam zal op hun voorhoofden zijn.", "Rom 13:9": "Want dit: u zult geen overspel doen, u zult niet doden, u zult niet stelen, u zult geen valse getuigenis geven, u zult niet begeren; en als er nog enig ander gebod is, wordt het in dit woord samengevat, namelijk in dit: u zult uw naaste liefhebben als uzelf.", "2 Sam 16:9": "Toen zei Abisai, de zoon van Zeruja, tegen de koning: Waarom zou deze dode hond mijn heer de koning vloeken? Laat mij toch oversteken en zijn kop wegnemen.", "Kol 2:18": "Laat dan niemand u de prijs ontnemen door het eigenzinnig verlangen naar nederigheid en verering van engelen, terwijl hij zich verdiept in dingen die hij niet gezien heeft, zonder reden opgeblazen door het denken van zijn vlees;", "1 Kor 3:20": "En opnieuw: De Heere kent de overleggingen van de wijzen, dat zij nutteloos zijn.", "Joh 8:56": "Abraham, uw vader, heeft er met vreugde naar verlangd Mijn dag te zien; en hij heeft hem gezien, en is verblijd geweest.", "Hebr 5:9": "En nadat Hij volmaakt gemaakt was, is Hij voor allen die Hem gehoorzaam zijn een oorzaak van eeuwige zaligheid geworden;", "Joz 23:11": "Daarom bewaart uw zielen zorgvuldig, dat u de HEERE, uw God, liefhebt.", "Ps 19:9": "De bevelen van de HEERE zijn recht, en verblijden het hart; het gebod van de HEERE is zuiver, en verlicht de ogen.", "Openb 2:17": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, hem zal Ik geven te eten van het manna dat verborgen is, en Ik zal hem een witte keursteen geven, en op de keursteen een nieuwe naam geschreven, die niemand kent dan wie hem ontvangt.", "Jes 59:19-21": "Dan zullen zij de Naam van de HEERE vrezen vanaf de neergang, en Zijn heerlijkheid vanaf de opgang van de zon; als de vijand zal komen als een stroom, zal de Geest van de HEERE de banier tegen hem oprichten. En er zal een Verlosser tot Sion komen, namelijk voor hen die zich bekeren van de overtreding in Jakob, spreekt de HEERE. Wat Mij aangaat, dit is Mijn Verbond met hen, zegt de HEERE: Mijn Geest, Die op u is, en Mijn woorden, die Ik in uw mond gelegd heb, die zullen van uw mond niet wijken, ook niet van de mond van uw zaad, ook niet van de mond van het zaad van uw zaad, zegt de HEERE, van nu af tot in eeuwigheid toe.", "Jes 30:2": "Die gaan om af te trekken naar Egypte, en vragen Mijn mond niet; om zich te sterken met de macht van Farao, en om hun toevlucht te nemen onder de schaduw van Egypte.", "Pred 2:3": "Ik heb in mijn hart nagespeurd om mijn vlees op te houden in de wijn, (en toch mijn hart leidend in wijsheid) en om de dwaasheid vast te houden, totdat ik zou zien wat voor de kinderen van de mensen het beste zou zijn om te doen onder de hemel, gedurende het aantal dagen van hun leven.", "Ps 102:16": "Dan zullen de heidenen de Naam van de HEERE vrezen, en alle koningen van de aarde Uw heerlijkheid.", "Rom 10:3": "Want omdat zij de rechtvaardigheid van God niet kennen en hun eigen gerechtigheid proberen op te richten, hebben zij zich aan de rechtvaardigheid van God niet onderworpen.", "Ps 37:39": "Thau. Toch is het heil van de rechtvaardigen van de HEERE; hun Sterkte in de tijd van benauwdheid.", "Pred 10:18": "Door grote luiheid verzwakt het gebint, en door slapheid van de handen lekt het huis door.", "Jes 29:10-12": "Want de HEERE heeft over u uitgegoten een geest van diepe slaap, en Hij heeft uw ogen dichtgesloten; de profeten, en uw hoofden, en de zieners heeft Hij verblind. Daarom is voor u elk visioen geworden als de woorden van een verzegeld boek, dat men geeft aan iemand die lezen kan, en zegt: Lees toch dit; en hij zegt: Ik kan niet, want het is verzegeld. Of men geeft het boek aan iemand die niet lezen kan, en zegt: Lees toch dit; en hij zegt: Ik kan niet lezen.", "Jes 55:7": "De goddeloze verlaat zijn weg, en de onrechtvaardige man zijn gedachten; en hij bekeert zich tot de HEERE, zo zal Hij Zich over hem ontfermen, en tot onze God, want Hij vergeeft menigvuldig.", "Ps 17:15": "Maar ik zal Uw aangezicht in gerechtigheid aanschouwen, ik zal verzadigd worden met Uw beeld, als ik zal ontwaken.", "Jes 29:13": "Want de Heere heeft gezegd: Omdat dit volk tot Mij nadert met zijn mond, en zij Mij met hun lippen eren, maar hun hart ver van Mij houden; en hun vrees, waarmee zij Mij vrezen, mensengeboden zijn, die hun geleerd zijn;", "Gal 6:9": "Laten we bij het goeddoen niet moe worden; want op zijn tijd zullen we maaien, als we niet verslappen.", "Jes 60:3-11": "En de heidenen zullen naar uw licht gaan, en koningen naar de glans die over u is opgegaan. Hef uw ogen rondom op, en zie: die allen zijn samengebracht, zij komen tot u; uw zonen zullen van verre komen, en uw dochters zullen aan uw zijde grootgebracht worden. Dan zult u het zien en stralen, en uw hart zal vervaard zijn en verwijd worden; want de menigte van de zee zal tot u gekeerd worden, het leger van de heidenen zal tot u komen.", "1 Kor 1:18": "Want het woord van het kruis is voor hen die verloren gaan wel dwaasheid; maar voor ons, die behouden worden, is het een kracht van God;", "2 Petr 2:3": "En zij zullen door hebzucht, met gemaakte woorden, van u een koopwaar maken; over hen is het oordeel van lang geleden niet werkeloos, en hun verderf sluimert niet.", "Fil 2:11": "En elke tong zou belijden dat Jezus Christus de Heere is, tot heerlijkheid van God de Vader.", "Hebr 4:15": "Want wij hebben geen Hogepriester Die geen medelijden kan hebben met onze zwakheden, maar Die in alle dingen, net als wij, beproefd is geweest, doch zonder zonde.", "2 Tess 2:12": "opdat zij allen veroordeeld worden, die de waarheid niet geloofd hebben, maar een welbehagen hebben gehad in de onrechtvaardigheid.", "Jes 49:6": "Verder zei Hij: Het is te gering, dat U Mij een Knecht zou zijn, om op te richten de stammen van Jakob, en om terug te brengen de bewaarden in Israël; Ik heb U ook gegeven tot een Licht van de heidenen, om Mijn heil te zijn tot aan het einde van de aarde.", "Gal 4:8": "Maar toen u God niet kende, diende u hen die van nature geen goden zijn;", "2 Kor 4:6": "Want God, Die gezegd heeft dat het licht uit de duisternis zou schijnen, is Degene Die in onze harten geschenen heeft, om te geven de verlichting van de kennis van de heerlijkheid van God in het aangezicht van Jezus Christus.", "Spr 2:21": "Want de vromen zullen de aarde bewonen, en de oprechten zullen daarin overblijven;", "Jer 14:13-16": "Toen zei ik: Ach, Heere HEERE! Zie, die profeten zeggen hun: U zult geen zwaard zien, en u zult geen honger hebben; maar Ik zal u een zekere vrede geven op deze plaats. En de HEERE zei tegen mij: Die profeten profeteren vals in Mijn Naam; Ik heb hen niet gezonden, hun ook geen bevel gegeven, noch tot hen gesproken; zij profeteren u een vals gezicht, en waarzeggerij, en nietigheid, en bedrog van hun hart. Daarom zegt de HEERE zo: Aangaande de profeten, die in Mijn Naam profeteren, terwijl Ik hen niet gezonden heb, en zij toch nog zeggen: Er zal geen zwaard noch honger in dit land zijn; diezelfde profeten zullen door het zwaard en door de honger verteerd worden.", "Ps 48:11": "Zoals Uw Naam is, o God! zo is Uw roem tot aan de einden van de aarde; Uw rechterhand is vol van gerechtigheid.", "Jes 27:12": "En het zal op die dag gebeuren, dat de HEERE zal dorsen, van de stroom van de rivier af tot aan de rivier van Egypte; maar u zult opgeraapt worden, één voor één, o kinderen van Israël!", "Hand 17:24": "De God Die de wereld gemaakt heeft en alles wat daarin is; Deze, Die een Heere is van hemel en aarde, woont niet in tempels die met handen gemaakt zijn;", "Spr 10:21": "De lippen van de rechtvaardige voeden er velen; maar de dwazen sterven door gebrek aan verstand.", "Jes 35:8": "En daar zal een verheven baan, en een weg zijn, die de heilige weg genoemd zal worden; de onreine zal er niet doorgaan, maar hij zal voor deze zijn; wie deze weg gaat, zelfs de dwazen zullen niet dwalen.", "Rom 15:9-12": "en dat de heidenen God zouden verheerlijken vanwege de barmhartigheid; zoals geschreven is: Daarom zal ik U belijden onder de heidenen, en Uw Naam lofzingen. En opnieuw zegt Hij: Weest vrolijk, heidenen, met Zijn volk! En opnieuw: Looft de Heere, alle heidenen, en prijst Hem, alle volken!", "Mark 4:11": "En Hij zei tegen hen: Aan u is het gegeven het geheimenis van het Koninkrijk van God te verstaan; maar aan hen die buiten zijn, gebeurt dit alles door gelijkenissen;", "Luk 21:34": "En let op uzelf, dat uw harten niet op enig moment bezwaard worden met brasserij en dronkenschap, en zorgen van dit leven, en dat die dag u niet onvoorzien overkomt.", "Zach 9:10": "En Ik zal de wagens uit Efraïm uitroeien, en de paarden uit Jeruzalem; ook zal de strijdboog uitgeroeid worden, en Hij zal tot de heidenen vrede spreken; en Zijn heerschappij zal zijn van zee tot aan zee, en van de rivier tot aan de einden van de aarde.", "Zef 3:9-20": "Zeker, dan zal Ik tot de volken een reine spraak wenden; opdat zij allen de Naam van de HEERE aanroepen, opdat zij Hem dienen met één schouder³. Van de zijden van de rivieren van Morenland zullen Mijn ernstige aanbidders, met de dochter van Mijn verstrooiden, Mijn offeranden brengen. Op die dag zult u niet beschaamd zijn vanwege al uw handelingen, waarmee u tegen Mij overtreden hebt; want dan zal Ik uit uw midden wegnemen wie van vreugde opspringen over uw hoogmoed, en u zult zich voortaan niet meer verheffen om Mijn heilige berg.", "Spr 22:27": "Als u niets hebt om te betalen, waarom zou men uw bed van onder u wegnemen?", "2 Sam 23:5": "Hoewel mijn huis zo niet is bij God, heeft Hij mij toch een eeuwig verbond gesteld, dat in alles goed geordend en bewaard is; zeker is daarin al mijn heil, en alle lust, hoewel Hij het nog niet laat uitspruiten.", "Fil 3:8": "Ja, zeker, ik beschouw ook alle dingen als schade vanwege de uitnemendheid van de kennis van Christus Jezus, mijn Heere; om Wiens wil ik al die dingen als schade heb gerekend, en ze beschouw als vuil, opdat ik Christus mag winnen,", "Jes 59:7": "Hun voeten lopen naar het kwade, en zij haasten zich om onschuldig bloed te vergieten; hun gedachten zijn gedachten van ongerechtigheid, verwoesting en verderf is op hun wegen.", "Ezech 18:20": "De ziel die zondigt, die zal sterven; de zoon zal niet dragen de ongerechtigheid van de vader, en de vader zal niet dragen de ongerechtigheid van de zoon; de gerechtigheid van de rechtvaardige zal op hem zijn, en de goddeloosheid van de goddeloze zal op hem zijn.", "Rom 10:5": "Want Mozes beschrijft de rechtvaardigheid die uit de wet is, en zegt: De mens die deze dingen doet, zal daardoor leven.", "Matt 22:10": "En diezelfde dienstknechten gingen de wegen op en brachten allen bijeen die zij vonden, zowel slechten als goeden; en de bruiloft werd vervuld met gasten die aanzaten.", "Ps 102:14-17": "U zult opstaan, U zult U ontfermen over Sion, want de tijd om haar genadig te zijn, want de bestemde tijd is gekomen. Want Uw knechten hebben een welgevallen aan haar stenen, en hebben medelijden met haar gruis. Dan zullen de heidenen de Naam van de HEERE vrezen, en alle koningen van de aarde Uw heerlijkheid.", "Ps 5:13": "Want U, HEERE, zult de rechtvaardige zegenen; U zult hem met goedgunstigheid kronen, als met een schild.", "Ps 92:15": "In de grijze ouderdom zullen zij nog vruchten dragen; zij zullen vet en groen zijn,", "1 Kor 1:19": "Want er is geschreven: Ik zal de wijsheid van de wijzen doen vergaan, en het verstand van de verstandigen zal Ik tenietdoen.", "Luk 23:30": "Dan zullen zij beginnen te zeggen tegen de bergen: Valt op ons; en tegen de heuvels: Bedekt ons.", "Jes 36:6": "Zie, u vertrouwt op die gebroken rietstaf, op Egypte; als iemand daarop leunt, zal hij in zijn hand gaan en die doorboren; zo is farao, de koning van Egypte, voor allen die op hem vertrouwen.", "Openb 3:10": "Omdat u het woord van Mijn volharding bewaard hebt, zal Ik u ook bewaren uit het uur van de verzoeking, dat over de hele wereld komen zal, om te verzoeken hen die op de aarde wonen.", "Ps 145:10": "Jod. Al Uw werken, HEERE, zullen U loven, en Uw gunstgenoten zullen U zegenen.", "Jes 33:22": "Want de HEERE is onze Rechter, de HEERE is onze Wetgever, de HEERE is onze Koning. Hij zal ons redden.", "Ezech 47:1-12": "Daarna bracht hij mij terug naar de deur van het huis, en zie, er stroomde water uit van onder de drempel van het huis naar het oosten; want de voorkant van het huis lag naar het oosten, en het water daalde af van onderen, uit de rechterzijde van het huis, ten zuiden van het altaar. En hij bracht mij naar buiten door de noordpoort, en leidde mij rondom via de weg van buiten naar de buitenpoort, de weg die naar het oosten kijkt; en zie, het water sprong eruit aan de rechterzijde. Toen die man naar het oosten uitging, had hij een meetsnoer in zijn hand; en hij mat duizend el, en liet mij door het water gaan, en het water kwam tot aan de enkels.", "Deut 32:29": "O, dat zij wijs waren; zij zouden dit vernemen, zij zouden op hun einde letten.", "Deut 32:36": "Want de HEERE zal Zijn volk recht doen, en het zal Hem berouwen over Zijn knechten; want Hij zal zien, dat de hand is weggegaan, en er niemand meer over is, gebonden of vrij.", "Spr 13:4": "De ziel van de luiaard is begerig, doch er is niets; maar de ziel van de vlijtigen zal vet gemaakt worden.", "Joh 6:26": "Jezus antwoordde hun en zei: Voorwaar, voorwaar, Ik zeg u: u zoekt Mij niet omdat u tekenen gezien hebt, maar omdat u van de broden gegeten hebt en verzadigd bent.", "2 Kor 4:4": "In hen heeft de god van deze eeuw de zinnen verblind, namelijk van de ongelovigen, opdat hen niet zou bestralen de verlichting van het Evangelie van de heerlijkheid van Christus, Die het Beeld van God is.", "Klaagl 4:17": "Ain. Nog steeds bezweken onze ogen, terwijl ze uitkeken naar onze nutteloze hulp; wij tuurden met gespannen aandacht naar een volk dat niet kon verlossen.", "Openb 2:27": "En hij zal hen hoeden met een ijzeren staf; zij zullen als pottenbakkersvaten vermorzeld worden; zoals ook Ik van Mijn Vader ontvangen heb.", "Ps 32:2": "Gelukkig is de mens, die de HEERE de ongerechtigheid niet toerekent, en in wiens geest geen bedrog is.", "Jes 66:24": "En zij zullen naar buiten gaan, en zij zullen de dode lichamen zien van de mensen die tegen Mij in opstand zijn gekomen; want hun worm zal niet sterven, en hun vuur zal niet uitgeblust worden, en zij zullen voor alle vlees een afgrijzen zijn.", "Zach 7:2": "Toen men naar het huis van God had gezonden Sarezer en Regem-Melech en hun mannen, om het aangezicht van de HEERE te smeken,", "Spr 31:7": "dat hij drinkt en zijn armoede vergeet, en aan zijn moeite niet meer denkt.", "Spr 29:26": "Velen zoeken de gunst van de heerser; maar ieders recht is van de HEERE.", "Hand 13:35": "Daarom zegt hij ook in een andere psalm: U zult Uw Heilige geen verderving laten zien.", "Matt 1:20-23": "En terwijl hij deze dingen overwoog, zie, de engel van de Heere verscheen hem in een droom en zei: Jozef, zoon van David! Wees niet bevreesd Maria, uw vrouw, tot u te nemen, want wat in haar ontvangen is, dat is uit de Heilige Geest; en zij zal een Zoon baren, en u zult Hem de naam JEZUS geven; want Hij zal Zijn volk zalig maken van hun zonden. En dit alles is gebeurd, opdat vervuld zou worden wat door de Heere gesproken is door de profeet, die zei:", "Ef 5:8": "Want u was eertijds duisternis, maar nu bent u licht in de Heere; wandel als kinderen van het licht.", "Jes 35:1": "De woestijn en de dorre plaatsen zullen hierover vrolijk zijn, en de wildernis zal zich verheugen, en zal bloeien als een roos.", "Lev 18:5": "Ja, Mijn inzettingen en Mijn rechten zult u houden; welk mens die doet, die zal daardoor leven; Ik ben de HEERE!", "Matt 7:8": "Want ieder die bidt, ontvangt; en wie zoekt, vindt; en wie klopt, voor hem zal opengedaan worden.", "1 Joh 3:18": "Mijn kinderen, laten wij niet liefhebben met het woord of met de tong, maar met de daad en waarheid.", "Hab 2:15-17": "Wee hem die zijn naaste te drinken geeft, u die uw wijnfles daarbij voegt, en hem ook dronken maakt, om hun naaktheid te aanschouwen. U zult ook verzadigd worden met schande, in plaats van eer; drink ook zelf, en laat uw voorhuid ontbloot worden; de beker van de rechterhand van de HEERE zal zich tot u wenden, en er zal een schandelijk uitbraaksel over uw heerlijkheid zijn. Want het geweld dat tegen Libanon begaan is, zal u bedekken, en de verwoesting van de dieren zal u verschrikken, vanwege het bloed van de mensen, en het geweld in het land, de stad, en aan alle inwoners daarvan.", "Rom 3:4-6": "Dat zij verre. Maar God is waarachtig, en ieder mens leugenachtig; zoals geschreven is: Opdat U gerechtvaardigd wordt in Uw woorden, en overwint, wanneer U oordeelt. Als nu onze ongerechtigheid de gerechtigheid van God bevestigt, wat zullen wij zeggen? Is God onrechtvaardig, als Hij toorn over ons brengt? (Ik spreek naar de mens.) Dat zij verre, anders hoe zal God de wereld oordelen?", "Rom 15:21": "maar zoals geschreven is: Aan wie van Hem niet was verkondigd, die zullen het zien; en die het niet gehoord hebben, die zullen het verstaan.", "Hand 3:22": "Want Mozes heeft tegen de vaderen gezegd: De Heere, uw God, zal u een Profeet doen opstaan uit uw broeders, zoals mij; naar Hem moet u luisteren, in alles wat Hij tegen u zal zeggen.", "Spr 1:30": "Zij hebben in Mijn raad niet toegestemd; al Mijn bestraffingen hebben zij versmaad;", "Ezech 23:38": "Nog hebben zij Mij dit aangedaan: zij hebben Mijn heiligdom op diezelfde dag verontreinigd, en Mijn sabbatten ontheiligd.", "Mark 11:17": "En Hij onderwees hen, en zei: Staat er niet geschreven: Mijn huis zal een huis van gebed genoemd worden voor alle volken? Maar u hebt het tot een rovershol gemaakt.", "Hos 6:3": "Dan zullen wij kennen, wij zullen ernaar streven om de Heere te kennen; Zijn opgang is zeker als de dageraad; en Hij zal tot ons komen als een regen, als de late regen en vroege regen voor het land.", "Dan 12:4": "En u, Daniël! sluit deze woorden toe, en verzegel dit boek, tot de tijd van het einde; velen zullen het naspeuren, en de kennis zal toenemen.", "Luk 9:46": "En er ontstond onder hen een discussie over wie van hen de belangrijkste zou zijn.", "Fil 4:8": "Verder, broeders, alles wat waar is, alles wat eerbaar is, alles wat rechtvaardig is, alles wat rein is, alles wat lieflijk is, alles wat goed klinkt, als er enige deugd is, en als er enige lof is, denk daaraan;", "Hand 8:8": "En er ontstond grote blijdschap in die stad.", "Lev 12:8": "Maar als haar hand niet genoeg vindt voor een lam, zal zij twee tortelduiven of twee jonge duiven nemen, één als brandoffer en één als zondoffer; en de priester zal voor haar verzoening doen; zo zal zij rein zijn.", "2 Petr 3:15": "En beschouw het geduld van onze Heere als redding; zoals ook onze geliefde broeder Paulus, naar de wijsheid die hem gegeven is, aan u geschreven heeft;", "Jer 2:37": "U zult ook van hier uitgaan met uw handen op uw hoofd; want de HEERE heeft al uw vertrouwen verworpen, zodat u daarmee niet zult gedijen.", "Jes 40:10": "Ziet, de Heere HEERE zal komen tegen de sterke, en Zijn arm zal heersen; ziet, Zijn loon is bij Hem, en Zijn arbeidsloon is voor Zijn aangezicht.", "Ps 6:9": "Wijk van mij, alle werkers van de ongerechtigheid; want de HEERE heeft de stem van mijn geween gehoord.", "Joh 16:20": "Voorwaar, voorwaar, Ik zeg u: u zult huilen en klagen, maar de wereld zal zich verblijden; en u zult bedroefd zijn, maar uw droefheid zal tot blijdschap worden.", "Ps 5:10": "Want in hun mond is niets rechts, hun binnenste is enkel verderving, hun keel is een open graf, met hun tong vleien zij.", "Jes 29:19": "En de zachtmoedigen zullen vreugde op vreugde hebben in de HEERE; en de behoeftigen onder de mensen zullen zich in de Heilige van Israël verheugen.", "Spr 1:29": "Omdat zij de wetenschap gehaat hebben, en de vrees van de HEERE niet hebben verkozen.", "Rom 3:21": "Maar nu is de gerechtigheid van God geopenbaard, zonder de wet, met getuigenis van de wet en de profeten:", "Jes 29:13-16": "Want de Heere heeft gezegd: Omdat dit volk tot Mij nadert met zijn mond, en zij Mij met hun lippen eren, maar hun hart ver van Mij houden; en hun vrees, waarmee zij Mij vrezen, mensengeboden zijn, die hun geleerd zijn; daarom, zie, Ik zal verder wonderlijk handelen met dit volk, wonderlijk en wonderbaarlijk; want de wijsheid van zijn wijzen zal vergaan, en het verstand van zijn verstandigen zal zich verbergen. Wee hun die zich diep willen verbergen voor de HEERE, hun raad verbergend; en wier werken in duisternis gebeuren, en zij zeggen: Wie ziet ons, en wie kent ons?", "Joh 14:17": "Namelijk de Geest van de waarheid, Die de wereld niet kan ontvangen, want zij ziet Hem niet, en kent Hem niet; maar u kent Hem, want Hij blijft bij u, en zal in u zijn.", "Openb 3:12": "Wie overwint, hem zal Ik maken tot een pilaar in de tempel van Mijn God, en hij zal daar niet meer uitgaan; en Ik zal op hem de Naam van Mijn God schrijven, en de naam van de stad van Mijn God, namelijk het nieuwe Jeruzalem, dat uit de hemel neerdaalt van Mijn God vandaan, en ook Mijn nieuwe Naam.", "Ps 116:5": "De HEERE is genadig en rechtvaardig, en onze God ontfermt Zich.", "Hos 9:7": "De dagen van de vergelding zijn gekomen, de dagen van de vergelding zijn gekomen; zij van Israël zullen het gewaar worden; de profeet is een dwaas, de man van de geest is onzinnig; om de grootheid van uw ongerechtigheid is de haat ook groot.", "Joh 8:27": "Zij begrepen niet dat Hij tot hen over de Vader sprak.", "Openb 2:2": "Ik weet uw werken, en uw arbeid, en uw lijdzaamheid, en dat u de kwaden niet kunt dragen; en dat u beproefd hebt hen die uitgeven dat zij apostelen zijn, en zij zijn het niet; en hebt hen leugenaars bevonden;", "Gal 3:12": "Maar de wet is niet uit het geloof; maar de mens die deze dingen doet, zal daardoor leven.", "Jes 5:11": "Wee hun die zich vroeg in de morgen opmaken om sterke drank na te jagen, en die doorgaan tot in de schemering, totdat de wijn hen verhit heeft!", "Hand 8:27": "En hij stond op en ging heen; en zie, een Moorman, een kamerling, een machtige heer van Candacé, de koningin van de Moren, die over al haar schat ging, was gekomen om te aanbidden in Jeruzalem;", "Mark 7:10": "Want Mozes heeft gezegd: Eer uw vader en uw moeder; en: Wie vader of moeder vervloekt, die zal zeker sterven.", "Luk 6:39": "En Hij vertelde hun een gelijkenis: Kan een blinde soms een blinde leiden? Zullen zij niet beiden in de kuil vallen?", "Ef 5:18": "En word niet dronken van wijn, waarin overdaad is, maar word vervuld met de Geest,", "2 Sam 7:14": "Ik zal hem tot een Vader zijn, en hij zal Mij tot een zoon zijn; wanneer hij misdoet, zal Ik hem straffen met een mensenroede en met plagen van de mensenkinderen.", "Jes 42:1-12": "Zie, Mijn Knecht, Die Ik ondersteun, Mijn Uitverkorene, in Wie Mijn ziel een welbehagen heeft! Ik heb Mijn Geest op Hem gegeven; Hij zal het recht aan de heidenen voortbrengen. Hij zal niet schreeuwen, noch Zijn stem verheffen, noch Zijn stem op straat horen laten. Het geknakte riet zal Hij niet breken, en de rokende vlaswiek zal Hij niet uitblussen; met waarheid zal Hij het recht voortbrengen.", "Luk 3:4": "zoals geschreven is in het boek van de woorden van Jesaja, de profeet, die zei: De stem van iemand die roept in de woestijn: Bereid de weg van de Heere, maak Zijn paden recht!", "Matt 19:29": "En al wie huizen zal verlaten hebben, of broeders, of zusters, of vader, of moeder, of vrouw, of kinderen, of akkers, om Mijn Naam, die zal honderdvoud ontvangen, en het eeuwige leven beërven.", "1 Petr 5:7": "Werp al uw bekommernis op Hem, want Hij zorgt voor u.", "Ps 37:23-29": "Mem. De gangen van deze man worden door de HEERE bevestigd; en Hij heeft vreugde in zijn weg. Als hij valt, wordt hij niet weggeworpen, want de HEERE ondersteunt zijn hand. Nun. Ik ben jong geweest, ook ben ik oud geworden, maar heb de rechtvaardige niet verlaten gezien, of zijn nageslacht zoekend naar brood.", "Hebr 2:13": "En verder: Ik zal Mijn vertrouwen op Hem stellen. En verder: Zie, hier ben Ik met de kinderen die God Mij gegeven heeft.", "Rom 6:22": "Maar nu, vrijgemaakt van de zonde, en dienstbaar gemaakt aan God, hebt u uw vrucht tot heiliging, en het einde het eeuwige leven.", "Rom 11:4": "Maar wat zegt het Goddelijk antwoord tegen hem? Ik heb Mijzelf nog zevenduizend mannen overgelaten, die de knie voor het beeld van Baäl niet gebogen hebben.", "Ps 87:4": "Ik zal Rahab en Babel vermelden, onder hen die Mij kennen; zie, de Filistijn en de Tyriër, met de Moor, deze is daar geboren.", "Matt 7:7": "Bid, en u zal gegeven worden; zoek, en u zult vinden; klop, en u zal opengedaan worden.", "Spr 24:23": "Ook deze spreuken zijn van de wijzen. Het aanzien van personen in het gericht kennen, is niet goed.", "1 Kron 16:27": "Majesteit en heerlijkheid zijn voor Zijn aangezicht, sterkte en vrolijkheid zijn in Zijn plaats.", "Hand 15:17": "opdat de overige mensen de Heere zoeken, en alle heidenen, over wie Mijn Naam aangeroepen is, zegt de Heere, Die dit alles doet.", "Jes 49:22": "Zo zegt de Heere HEERE: Zie, Ik zal Mijn hand opheffen naar de heidenen, en naar de volken zal Ik Mijn banier opsteken; dan zullen zij uw zonen in de armen brengen, en uw dochters zullen op de schouder gedragen worden.", "Jes 45:8": "Drupt, hemelen! van boven af, en laat de wolken vloeien van gerechtigheid; en laat de aarde zich openen, en laat allerlei heil uitwassen, en gerechtigheid samen uitspruiten; Ik, de HEERE, heb ze geschapen.", "Rom 9:17": "Want de Schrift zegt tegen Farao: Hiertoe heb Ik u doen opstaan, opdat Ik in u Mijn kracht zou bewijzen, en opdat Mijn Naam verkondigd wordt op de hele aarde.", "Joh 1:5": "En het Licht schijnt in de duisternis, en de duisternis heeft het niet begrepen.", "2 Kon 18:32": "Totdat ik kom, en u haal in een land, als uw land, een land van koren en van most, een land van brood en van wijngaarden, een land van olijven, van olie en van honing; zo zult u leven en niet sterven; en hoort niet naar Hizkia, want hij hitst u op, door te zeggen: De HEERE zal ons redden.", "Lev 16:2": "De HEERE dan zei tegen Mozes: Spreek tot uw broeder Aäron, dat hij niet op elk tijdstip het heilige binnengaat, binnen het voorhangsel, voor het verzoendeksel dat op de ark is, opdat hij niet sterft; want Ik verschijn in een wolk op het verzoendeksel.", "Hos 2:21": "En de aarde zal het koren verhoren, alsook de nieuwe wijn en de olie; en die zullen Jizreël verhoren.", "Ps 107:6-8": "Toen riepen zij tot de HEERE in de benauwdheid die zij hadden, en Hij heeft hen gered uit hun angsten; En Hij leidde hen op een rechte weg, om te gaan naar een stad om in te wonen. Laat hen de HEERE loven om Zijn goedertierenheid, en om Zijn wonderwerken voor de kinderen der mensen;", "Ps 85:11-13": "De goedertierenheid en waarheid zullen elkaar ontmoeten; de gerechtigheid en vrede zullen elkaar kussen. De waarheid zal uit de aarde opkomen, en gerechtigheid zal vanuit de hemel neerzien. Ook zal de HEERE het goede geven; en ons land zal zijn vrucht geven.", "Jak 5:5": "U hebt lekker geleefd op de aarde, en wellust nagejaagd; u hebt uw harten gevoed als op een dag van slachting.", "Joh 19:36": "Want deze dingen zijn gebeurd, opdat de Schrift vervuld wordt: Geen been van Hem zal verbroken worden.", "Matt 6:25": "Daarom zeg Ik u: wees niet bezorgd over uw leven, wat u eten en wat u drinken zult; ook niet over uw lichaam, waarmee u zich kleden zult. Is het leven niet meer dan het voedsel, en het lichaam meer dan de kleding?", "Hab 1:16": "Daarom offert hij aan zijn sleepnet, en brandt reukwerk aan zijn net; want daardoor is zijn deel vet geworden, en zijn voedsel smoutig.", "1 Tess 5:7": "Want wie slapen, slapen 's nachts, en wie dronken zijn, zijn 's nachts dronken;", "Matt 8:10": "Toen Jezus dit hoorde, verwonderde Hij Zich, en zei tegen hen die Hem volgden: Voorwaar, Ik zeg u, Ik heb zelfs in Israël zo'n groot geloof niet gevonden.", "Zef 1:12": "En het zal gebeuren in die tijd, Ik zal Jeruzalem met lantaarns doorzoeken; en Ik zal bezoeking doen over de mannen die star geworden zijn op hun droesem, die in hun hart zeggen: De HEERE doet geen goed, en Hij doet geen kwaad.", "Spr 6:4-10": "Laat uw ogen geen slaap toe, en uw oogleden geen sluimering; red uzelf, als een ree uit de hand van de jager, en als een vogel uit de hand van de vogelvanger. Ga naar de mier, u luiaard! Bekijk haar wegen, en word wijs;", "Jes 26:3": "Het is een vast voornemen: U zult allerlei vrede bewaren, want men heeft op U vertrouwd.", "Rom 10:13": "Want ieder die de Naam van de Heere zal aanroepen, zal zalig worden.", "Jes 65:13": "Daarom zegt de Heere HEERE zo: Zie, Mijn knechten zullen eten, maar u zult hongeren; zie, Mijn knechten zullen drinken, maar u zult dorsten; zie, Mijn knechten zullen blij zijn, maar u zult beschaamd zijn.", "Pred 7:25": "Ik keerde mij om, en mijn hart, om te weten, en om na te sporen, en te zoeken wijsheid en een verklaring; en om te weten de goddeloosheid van de dwaasheid, en de onzinnigheid van de waanzin.", "Joh 7:38": "Wie in Mij gelooft, zoals de Schrift zegt: stromen van levend water zullen uit zijn buik vloeien.", "Rom 14:5": "De één acht de ene dag boven de andere dag; maar de ander acht alle dagen gelijk. Laat ieder in zijn eigen gemoed ten volle overtuigd zijn.", "2 Kor 6:1": "En wij, als medearbeiders, bidden u ook dat u de genade van God niet tevergeefs mag hebben ontvangen.", "Luk 4:31": "En Hij kwam af naar Kapernaüm, een stad van Galilea, en leerde hen op de sabbatdagen.", "Joh 10:27-29": "Mijn schapen horen Mijn stem, en Ik ken ze, en zij volgen Mij. En Ik geef hun het eeuwige leven; en zij zullen niet verloren gaan in eeuwigheid, en niemand zal ze uit Mijn hand rukken. Mijn Vader, die ze Mij gegeven heeft, is meer dan allen; en niemand kan ze rukken uit de hand van Mijn Vader.", "Jes 60:2": "Want zie, de duisternis zal de aarde bedekken, en donkerheid de volken; maar over u zal de HEERE opgaan, en Zijn heerlijkheid zal over u gezien worden.", "Openb 22:15": "Maar buiten zullen zijn de honden, en de tovenaars, en de hoereerders, en de doodslagers, en de afgodendienaars, en ieder die de leugen liefheeft en doet.", "Gal 4:30": "Maar wat zegt de Schrift? Werp de dienstmaagd uit en haar zoon; want de zoon van de dienstmaagd zal geenszins erven met de zoon van de vrije.", "1 Tess 5:9-11": "Want God heeft ons niet gesteld tot toorn, maar tot verkrijging van de zaligheid, door onze Heere Jezus Christus. Die voor ons gestorven is, opdat wij, hetzij dat wij waken, hetzij dat wij slapen, samen met Hem zouden leven. Daarom, vermaan elkaar en bouw de één de ander op, zoals u ook doet.", "Hand 7:49": "De hemel is Mij een troon, en de aarde een voetbank voor Mijn voeten. Wat voor huis zult u Mij bouwen, zegt de Heere, of wat is de plaats van Mijn rust?", "Ps 60:13": "Geef Ú ons hulp uit de benauwdheid, want de hulp van de mens is ijdelheid.", "Jes 47:10": "Want u hebt op uw boosheid vertrouwd; u hebt gezegd: Niemand ziet mij; uw wijsheid en uw kennis heeft u afkerig gemaakt; en u hebt in uw hart gezegd: Ik ben het, en niemand meer dan ik.", "Spr 21:3": "Gerechtigheid en recht te doen is bij de HEERE uitgelezener dan offer.", "Hand 17:21": "(Want alle Atheners en de vreemdelingen d
