 die zich bij de HEERE voegen om Hem te dienen, en om de Naam van de HEERE lief te hebben, om Hem tot knechten te zijn; ieder die de sabbat houdt, zodat hij die niet ontheiligt, en die aan Mijn verbond vasthouden;", "7": "Die zal Ik ook brengen naar Mijn heilige berg, en Ik zal hen verheugen in Mijn huis van gebed; hun brandoffers en hun slachtoffers zullen aangenaam zijn op Mijn altaar; want Mijn huis zal een huis van gebed genoemd worden voor alle volken.", "8": "De Heere HEERE, Die de verdrevenen van Israël bijeenbrengt, spreekt: Ik zal er bij hem nog meer bijeenbrengen, naast hen die al bij hem bijeengebracht zijn.", "9": "Alle dieren van het veld, kom om te eten, ja, alle dieren in het woud!", "10": "Hun wachters zijn allemaal blind, zij weten niets; zij zijn allemaal stomme honden, zij kunnen niet blaffen; zij zijn slaperig, zij liggen neer, zij hebben het sluimeren lief.", "11": "En deze honden zijn sterk van begeerte, zij kunnen niet verzadigd worden, ja, het zijn herders die niets kunnen begrijpen; zij keren zich allemaal naar hun eigen weg, ieder naar zijn eigen winst, elk uit zijn eigen hoek.", "12": "Kom hier, zeggen zij: ik zal wijn halen, en wij zullen ons vol drinken met sterke drank; en de dag van morgen zal zijn als deze, ja, nog groter, veel overvloediger."}, "SV": {"1": "Alzo zegt de HEERE: Bewaart het recht, en doet gerechtigheid; want Mijn heil is nabij om te komen, en Mijn gerechtigheid om geopenbaard te worden.", "2": "Welgelukzalig is de mens, *die* zulks doet, en des mensen kind, *dat* daaraan vasthoudt; die den sabbat houdt, zodat gij dien niet ontheiligt, en die zijn hand bewaart van enig kwaad te doen.", "3": "En de vreemde, die zich tot den HEERE gevoegd heeft, spreke niet, zeggende: De HEERE heeft mij gans en al van Zijn volk gescheiden; en de gesnedene zegge niet: Ziet, ik ben een dorre boom.", "4": "Want alzo zegt de HEERE van de gesnedenen, die Mijn sabbatten houden, en verkiezen hetgeen, waartoe Ik lust heb, en vasthouden aan Mijn verbond;", "5": "Ik zal hen ook in Mijn huis en binnen Mijn muren een plaats en een naam geven, beter dan der zonen en dan der dochteren; een eeuwigen naam zal Ik een ieder van hen geven, die niet uitgeroeid zal worden.", "6": "En de vreemden, die zich tot den HEERE voegen, om Hem te dienen, en om den Naam des HEEREN lief te hebben, om Hem tot knechten te zijn; al wie den sabbat houdt, dat hij dien niet ontheilige, en die aan Mijn verbond vasthouden;", "7": "Die zal Ik ook brengen tot Mijn heiligen berg, en Ik zal hen verheugen in Mijn bedehuis; hun brandoffers en hun slachtoffers zullen aangenaam wezen op Mijn altaar; want Mijn huis zal een bedehuis genoemd worden voor alle volken.", "8": "De Heere HEERE, Die de verdrevenen van Israël vergadert, spreekt: Ik zal tot hem nog meer vergaderen, nevens hen, die tot hem vergaderd zijn.", "9": "Al gij gedierten des velds, komt om te eten, *ja*, al gij gedierten in het woud!", "10": "Hun wachters zijn allen blind, zij weten niet; zij allen zijn stomme honden, zij kunnen niet bassen; zij zijn slaperig, zij liggen neder, zij hebben het sluimeren lief.", "11": "En deze honden zijn sterk van begeerte, zij kunnen niet verzadigd worden, ja, het zijn herders, die niet verstaan kunnen; zij allen keren zich naar hun weg, elkeen naar zijn gewin, *elk* uit zijn einde.", "12": "Komt herwaarts, *zeggen* *zij*: ik zal wijn halen, en wij zullen sterken drank zuipen; en de dag van morgen zal zijn als deze, *ja*, groter, veel treffelijker."}, "KJV": {"1": "Thus saith the LORD, Keep ye judgment, and do justice: for my salvation *is* near to come, and my righteousness to be revealed.", "2": "Blessed *is* the man *that* doeth this, and the son of man *that* layeth hold on it; that keepeth the sabbath from polluting it, and keepeth his hand from doing any evil.", "3": "Neither let the son of the stranger, that hath joined himself to the LORD, speak, saying, The LORD hath utterly separated me from his people: neither let the eunuch say, Behold, I *am* a dry tree.", "4": "For thus saith the LORD unto the eunuchs that keep my sabbaths, and choose *the things* that please me, and take hold of my covenant;", "5": "Even unto them will I give in mine house and within my walls a place and a name better than of sons and of daughters: I will give them an everlasting name, that shall not be cut off.", "6": "Also the sons of the stranger, that join themselves to the LORD, to serve him, and to love the name of the LORD, to be his servants, every one that keepeth the sabbath from polluting it, and taketh hold of my covenant;", "7": "Even them will I bring to my holy mountain, and make them joyful in my house of prayer: their burnt offerings and their sacrifices *shall be* accepted upon mine altar; for mine house shall be called an house of prayer for all people.", "8": "The Lord GOD which gathereth the outcasts of Israel saith, Yet will I gather *others* to him, beside those that are gathered", "9": "All ye beasts of the field, come to devour, *yea*, all ye beasts in the forest.", "10": "His watchmen *are* blind: they are all ignorant, they *are* all dumb dogs, they cannot bark; sleeping, lying down, loving to slumber.", "11": "Yea, *they are* greedy dogs *which* can never have enough, and they *are* shepherds *that* cannot understand: they all look to their own way, every one for his gain, from his quarter.", "12": "Come ye, *say they*, I will fetch wine, and we will fill ourselves with strong drink; and to morrow shall be as this day, *and* much more abundant."}}, "tsk": {"1": [{"kopje": "Bewaar", "refs": ["Jes 1:16-19", "Jes 26:7", "Jes 26:8", "Jes 55:7", "Ps 24:4-6", "Ps 50:23", "Jer 7:3-11", "Mal 4:4", "Matt 3:2", "Joh 7:17"]}, {"kopje": "want", "refs": ["Jes 46:13", "Jes 51:5", "Ps 85:10", "Matt 3:2", "Matt 4:17", "Mark 1:15", "Luk 3:3-9", "Rom 1:17", "Rom 10:6-10", "Rom 13:11-14"]}], "2": [{"kopje": "Gelukkig", "refs": ["Ps 1:1-3", "Ps 15:1-5", "Ps 106:3", "Ps 112:1", "Ps 119:1-5", "Ps 128:1", "Luk 11:28", "Luk 1 rrey/s/?hl=Isa.56.12#i19123", "refs": [{"disp": "Jes 56:12", "href": "../../jesaja/56/#v12", "ref": "Jes 56:12", "svLabel": null}, {"disp": "Luk 12:19", "href": "../../lukas/12/#v19", "ref": "Luk 12:19", "svLabel": null}, {"disp": "Jak 4:13", "href": "../../jakobus/4/#v13", "ref": "Jak 4:13", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"Rom 14:22": "Hebt u geloof? Houd dat bij uzelf voor God. Zalig is hij die zichzelf niet oordeelt in wat hij voor goed houdt.", "Spr 20:13": "Heb de slaap niet lief, opdat u niet arm wordt; open uw ogen, verzadig u met brood.", "Ef 2:15": "doordat Hij de vijandschap in Zijn vlees teniet gemaakt heeft, namelijk de wet van de geboden die in inzettingen bestond; opdat Hij die twee in Zichzelf tot één nieuwe mens zou scheppen, en zo vrede zou maken;", "Pred 2:24": "Is het dan niet goed voor de mens dat hij eet en drinkt, en dat hij zijn ziel het goede laat genieten in zijn arbeid? Ik heb ook gezien dat dit uit de hand van God is.", "Jer 50:5": "Zij zullen naar Sion vragen; op de weg hierheen zullen hun gezichten gericht zijn; zij zullen komen en zich bij de HEERE aansluiten, met een eeuwig verbond, dat niet zal worden vergeten.", "Zach 14:16": "En het zal gebeuren, dat allen die overgebleven zijn van alle heidenen die tegen Jeruzalem gekomen zullen zijn, van jaar tot jaar zullen optrekken om de Koning, de HEERE van de heerscharen, te aanbidden, en om het feest van de loofhutten te vieren.", "Ezech 46:9": "Maar als het volk van het land voor het aangezicht van de HEERE komt, op de vastgestelde feesten, dan zal wie door de weg van de noorderpoort binnengaat om te aanbidden, door de weg van de zuiderpoort weer uitgaan; en wie door de weg van de zuiderpoort binnengaat, zal door de weg van de noorderpoort weer uitgaan; hij zal niet terugkeren door de weg van de poort waardoor hij binnengekomen is, maar recht voor zich uit naar buiten gaan.", "Num 17:4": "En u zult ze wegleggen in de tent van de samenkomst, voor de getuigenis, waar Ik met u samenkomen zal.", "Matt 22:39": "En het tweede, hieraan gelijk, is: U zult uw naaste liefhebben als uzelf.", "Ex 13:12": "dat u alles wat de baarmoeder opent voor de HEERE zult afzonderen; ook alles wat de baarmoeder opent van het jong van de dieren die u zult hebben; de mannetjes zullen van de HEERE zijn.", "Jer 5:5": "Ik zal naar de groten gaan, en met hen spreken, want die kennen de weg van de HEERE, het recht van hun God; maar zij hadden samen het juk verbroken, en de banden verscheurd.", "Spr 4:25-27": "Laat uw ogen recht vooruit zien, en uw oogleden zich recht voor u heen richten. Weeg de gang van uw voet, en laat al uw wegen vast staan. Wijk niet naar rechts of naar links, wend uw voet af van het kwade.", "Job 15:31": "Hij vertrouwt niet op ijdelheid, waardoor hij verleid wordt; want ijdelheid zal zijn vergelding zijn.", "Matt 5:33": "Wederom hebt u gehoord dat tot de ouden gezegd is: U zult de eed niet breken, maar u zult aan de Heere uw eden houden.", "Ps 95:1": "Komt, laat ons de HEERE vrolijk zingen; laat ons juichen voor de Rotssteen van ons heil.", "Jes 8:12": "U zult niet zeggen: Een samenzwering, van alles waar dit volk van zegt: Het is een samenzwering; en vrees u hun vrees niet, en wees niet verschrikt.", "Kol 1:6": "dat tot u gekomen is, zoals ook in de hele wereld, en het brengt vruchten voort, zoals ook onder u, vanaf de dag dat u het gehoord hebt en de genade van God in waarheid hebt leren kennen.", "Joh 10:5": "Maar een vreemde zullen zij nooit volgen, maar zij zullen van hem wegvluchten; omdat zij de stem van de vreemden niet kennen.", "Openb 1:6": "En Die ons gemaakt heeft tot koningen en priesters voor God en Zijn Vader; Hem, zeg ik, zij de heerlijkheid en de kracht tot in alle eeuwigheid. Amen.", "Deut 12:18": "Maar u zult dat eten voor het aangezicht van de HEERE, uw God, in de plaats die de HEERE, uw God, zal uitkiezen, u, en uw zoon, en uw dochter, en uw dienstknecht, en uw dienstmaagd, en de Leviet die in uw poorten is; en u zult vrolijk zijn voor het aangezicht van de HEERE, uw God, over alles waaraan u uw handen geslagen hebt.", "Rom 11:10": "Dat hun ogen verduisterd worden, om niet te zien; en verkrom hun rug alle tijd.", "Luk 7:47": "Daarom zeg Ik u: haar zonden, die vele waren, zijn haar vergeven; want zij heeft veel liefgehad; maar aan wie weinig vergeven wordt, die heeft weinig lief.", "Fil 3:3": "Want wij zijn de besnijding, wij, die God in de Geest dienen, en in Christus Jezus roemen, en niet vertrouwen op het vlees.", "Luk 4:11": "En dat zij U op de handen zullen dragen, opdat U uw voet niet ooit aan een steen stoot.", "Hand 13:34": "En dat Hij Hem uit de doden heeft opgewekt, zodat Hij niet meer tot verderving zal terugkeren, heeft Hij zo gezegd: Ik zal u de weldaden van David geven, die betrouwbaar zijn;", "Ps 26:6-8": "Ik was mijn handen in onschuld, en ik ga rondom Uw altaar, o HEERE! Om te laten horen de stem van de lof, en om te vertellen al Uw wonderen. HEERE! Ik heb lief de woning van Uw huis, en de plaats van de tabernakel van Uw eer.", "Joh 10:10-13": "De dief komt niet dan om te stelen, en te slachten, en te verderven; Ik ben gekomen, opdat zij het leven hebben, en overvloed hebben. Ik ben de goede Herder; de goede herder geeft zijn leven voor de schapen. Maar de huurling, die geen herder is, van wie de schapen niet zelf zijn, ziet de wolf komen, en verlaat de schapen, en vlucht; en de wolf grijpt ze, en verstrooit de schapen.", "1 Kron 9:32": "En uit de kinderen van de Kahathieten, uit hun broeders, waren enigen over de broden van de bereiding, om die elke sabbat te bereiden.", "Ps 119:165": "Die Uw wet beminnen, hebben grote vrede, en zij hebben geen aanstoot.", "Ps 16:9": "Daarom is mijn hart blij, en mijn eer verheugt zich; ook zal mijn lichaam met zekerheid rusten.", "Luk 19:46": "en zei tegen hen: Er is geschreven: Mijn huis is een huis van het gebed; maar u hebt er een rovershol van gemaakt.", "Ps 23:6": "Zeker, het goede en de weldadigheid zullen mij volgen al de dagen van mijn leven; en ik zal in het huis van de HEERE blijven, tot in lengte van dagen.", "Ps 14:4": "Hebben dan alle werkers van de ongerechtigheid geen kennis, die mijn volk opeten alsof zij brood aten? Zij roepen de HEERE niet aan.", "Openb 17:14": "Dezen zullen oorlog voeren tegen het Lam, en het Lam zal hen overwinnen (want Het is een Heere der heren, en een Koning der koningen), en zij die met Hem zijn, de geroepenen en uitverkorenen en gelovigen.", "Ps 119:121": "Ain. Ik heb recht en gerechtigheid gedaan; geef mij niet over aan mijn onderdrukkers.", "Jer 21:8": "En tegen dit volk zult u zeggen: Zo zegt de HEERE: Zie, Ik stel voor uw gezicht de weg van het leven en de weg van de dood.", "Hand 2:41": "Zij dan die zijn woord graag aannamen, werden gedoopt; en er werden op die dag ongeveer drieduizend zielen aan hen toegevoegd.", "Ps 121:3-8": "Hij zal uw voet niet laten wankelen; uw Bewaarder zal niet sluimeren. Zie, de Bewaarder van Israël zal niet sluimeren, ook niet slapen. De HEERE is uw Bewaarder, de HEERE is uw Schaduw, aan uw rechterhand.", "Jak 4:8": "Kom dicht bij God, en Hij zal dicht bij u komen. Reinig de handen, zondaars, en zuiver de harten, dubbelhartigen!", "Ps 24:4-6": "Die rein van handen, en zuiver van hart is, die zijn ziel niet opheft tot ijdelheid, en die niet bedrieglijk zweert; die zal de zegen ontvangen van de HEERE, en gerechtigheid van de God van zijn heil. Dat is het geslacht van hen die naar Hem vragen, die Uw aangezicht zoeken, dat is Jakob! Sela.", "Rom 15:10": "En opnieuw zegt Hij: Weest vrolijk, heidenen, met Zijn volk!", "Ex 16:5": "En het zal gebeuren op de zesde dag, dat zij klaarmaken wat zij ingebracht zullen hebben; dat zal dubbel zijn boven wat zij dagelijks verzamelen.", "Hebr 4:9": "Er blijft dan een rust over voor het volk van God.", "Hand 16:17": "Zij volgde Paulus en ons achterna en riep: Deze mensen zijn dienstknechten van God, de Allerhoogste, die ons de weg van de zaligheid verkondigen.", "Spr 25:21": "Als hij die u haat, honger heeft, geef hem brood te eten; en als hij dorstig is, geef hem water te drinken;", "Jes 57:1": "De rechtvaardige komt om, en er is niemand die het ter harte neemt; en de goede mensen worden weggenomen, zonder dat iemand erop let dat de rechtvaardige weggenomen wordt vóór het kwaad komt.", "Hand 15:7-9": "En toen daarover een grote twist ontstond, stond Petrus op en zei tegen hen: Mannen broeders, u weet dat God van lang geleden onder ons mij uitgekozen heeft, dat de heidenen door mijn mond het woord van het Evangelie zouden horen, en geloven. En God, de Kenner van de harten, heeft hun getuigenis gegeven, doordat Hij hun de Heilige Geest gaf, evenals ook aan ons; en Hij heeft geen onderscheid gemaakt tussen ons en hen, doordat Hij hun harten door het geloof gereinigd heeft.", "Jes 32:15-17": "Totdat over ons de Geest uit de hoogte uitgegoten wordt; dan zal de woestijn tot een vruchtbaar veld worden, en het vruchtbare veld zal voor een woud gerekend worden. En het recht zal in de woestijn wonen, en de gerechtigheid zal op het vruchtbare veld verblijven. En het werk van de gerechtigheid zal vrede zijn; en de uitwerking van de gerechtigheid zal rust en zekerheid zijn, tot in eeuwigheid.", "Rom 3:18": "Er is geen vreze van God voor hun ogen.", "Jes 49:9-12": "Om te zeggen tegen de gebondenen: Gaat uit; tegen hen die in duisternis zijn: Komt te voorschijn; zij zullen op de wegen weiden, en op alle hoge plaatsen zal hun weide zijn. Zij zullen niet hongeren, noch dorsten, en de hitte en de zon zal hen niet steken; want hun Ontfermer zal ze leiden, en Hij zal hen bij de springaders van het water zachtjes leiden. En Ik zal al Mijn bergen tot een weg maken, en Mijn banen zullen verhoogd zijn.", "Deut 32:15": "Toen Jeschurun vet werd, sloeg hij achteruit (u bent vet geworden, u bent dik geworden, ja, met vet overdekt geworden!); en hij liet God varen, Die hem gemaakt heeft, en versmaadde de Rotssteen van zijn heil.", "1 Kor 3:1-4": "En ik, broeders, kon tot u niet spreken als tot geestelijken, maar als tot vleselijken, als tot jonge kinderen in Christus. Ik heb u met melk gevoed, en niet met vaste spijs; want u kon toen nog niet; ja, u kunt ook nu nog niet. Want u bent nog vleselijk; want omdat er onder u nijd is, en twist, en tweedracht, bent u niet vleselijk, en wandelt u niet naar de mens?", "Deut 6:5": "Zo zult u de HEERE, uw God, liefhebben, met uw hele hart, en met uw hele ziel, en met al uw kracht.", "Fil 3:7-11": "Maar wat mij winst was, dat heb ik om Christus' wil als schade beschouwd. Ja, zeker, ik beschouw ook alle dingen als schade vanwege de uitnemendheid van de kennis van Christus Jezus, mijn Heere; om Wiens wil ik al die dingen als schade heb gerekend, en ze beschouw als vuil, opdat ik Christus mag winnen, En in Hem gevonden word, niet met mijn eigen rechtvaardigheid, die uit de wet is, maar met de rechtvaardigheid die door het geloof van Christus is, namelijk de rechtvaardigheid die uit God is door het geloof;", "Deut 8:3": "En Hij verootmoedigde u, en liet u hongeren, en voedde u met het manna, dat u niet kende, dat ook uw vaderen niet gekend hadden; opdat Hij u bekend zou maken dat de mens niet alleen van brood leeft, maar dat de mens leeft van alles wat uit de mond van de HEERE komt.", "Ps 7:9": "De HEERE zal de volken recht doen; doe mij recht, HEERE, naar mijn gerechtigheid, en naar mijn oprechtheid, die bij mij is.", "Joz 22:5": "Neem alleen nauwgezet in acht om te doen het gebod en de wet, die Mozes, de dienaar van de HEERE, u geboden heeft: dat u de HEERE, uw God, liefhebt, en dat u wandelt in al Zijn wegen, en Zijn geboden houdt, en Hem aanhangt, en dat u Hem dient met uw hele hart en met uw hele ziel.", "Matt 23:39": "Want Ik zeg u: U zult Mij van nu af aan niet zien, totdat u zeggen zult: Gezegend is Hij Die komt in de Naam van de Heere!", "Spr 15:19": "De weg van de luiaard is als een doornheg; maar het pad van de oprechten is welgebaand.", "Hebr 13:15": "Laten wij dan door Hem altijd aan God een lofoffer opdragen, dat is de vrucht van lippen die Zijn Naam belijden.", "1 Kon 20:11": "Maar de koning van Israël antwoordde en zei: Spreekt tot hem: Die zich aangordt, beroemt zich niet, als die zich los maakt.", "Ps 16:11": "U zult mij het pad van het leven bekendmaken; overvloed van vreugde is bij Uw aangezicht; liefelijkheden zijn in Uw rechterhand, eeuwig.", "Rom 15:13": "De God nu van de hoop vervult u met alle blijdschap en vrede in het geloven, opdat u overvloedig mag zijn in de hoop, door de kracht van de Heilige Geest.", "Gen 12:3": "En Ik zal zegenen wie u zegenen, en vervloeken wie u vervloekt; en in u zullen alle geslachten van de aarde gezegend worden.", "Lev 19:13": "U zult uw naaste niet bedriegen of verdrukken, noch beroven; het arbeidsloon van de dagloner zal bij u niet blijven overnachten tot de morgen.", "Joh 8:33": "Zij antwoordden Hem: Wij zijn Abrahams nageslacht, en hebben nog nooit iemand gediend; hoe kunt U dan zeggen: U zult vrij worden?", "Mark 2:27": "En Hij zei tegen hen: De sabbat is gemaakt om de mens, niet de mens om de sabbat.", "Openb 5:14": "En de vier dieren zeiden: Amen. En de vierentwintig oudsten vielen neer en aanbaden Hem Die leeft tot in alle eeuwigheid.", "Openb 14:6": "En ik zag een andere engel, vliegend in het midden van de hemel, en hij had het eeuwige Evangelie, om te verkondigen aan hen die op de aarde wonen, en aan alle natie, en geslacht, en taal, en volk;", "Ex 23:12": "Zes dagen zult u uw werk doen; maar op de zevende dag zult u rusten; opdat uw os en uw ezel rusten, en de zoon van uw dienstmaagd en de vreemdeling op adem komen.", "Matt 15:9": "Maar tevergeefs eren zij Mij, terwijl zij leringen leren die geboden van mensen zijn.", "Ezech 8:12": "Toen zei Hij tegen mij: Hebt u gezien, mensenkind, wat de oudsten van het huis van Israël doen in de duisternis, ieder in zijn kamer vol afbeeldingen? Want zij zeggen: De HEERE ziet ons niet, de HEERE heeft het land verlaten.", "Hand 17:2": "En Paulus ging, zoals hij gewoon was, bij hen naar binnen, en drie sabbatten lang sprak hij met hen uit de Schriften,", "Jer 17:7": "Gezegend daarentegen is de man die op de HEERE vertrouwt, en wiens vertrouwen de HEERE is!", "Ps 22:2": "Mijn God, mijn God! Waarom hebt U mij verlaten, ver zijnde van mijn verlossing, van de woorden van mijn brullen?", "Ezech 18:5-9": "Wanneer nu iemand rechtvaardig is, en recht en gerechtigheid doet; Niet eet op de bergen, en zijn ogen niet opheft tot de drekgoden van het huis van Israël; noch de vrouw van zijn naaste onteert, noch tot een vrouw tijdens haar menstruatie nadert; En niemand verdrukt, de schuldenaar zijn pand teruggeeft, geen roof pleegt, de hongerige zijn brood geeft, en de naakte met kleding bedekt;", "Joh 12:13": "Namen zij de takken van palmbomen, en gingen Hem tegemoet, en riepen: Hosanna! Gezegend is Hij, Die komt in de Naam van de Heere, de Koning van Israël!", "Ps 85:10": "Zeker, Zijn heil is nabij hen die Hem vrezen, opdat in ons land eer woont.", "Jes 11:1-16": "Want er zal een Rijsje voortkomen uit de afgehouwen tronk van Isaï, en een Scheut uit zijn wortels zal vrucht voortbrengen. En op Hem zal de Geest van de HEERE rusten, de Geest van wijsheid en van verstand, de Geest van raad en van sterkte, de Geest van kennis en van vreze van de HEERE. En Zijn vreugde zal zijn in de vreze van de HEERE; en Hij zal niet oordelen naar wat Zijn ogen zien, en niet bestraffen naar wat Zijn oren horen.", "Rom 13:13": "Laten wij, als bij daglicht, eerbaar wandelen; niet in bras­partijen en dronkenschappen, niet in ontucht en losbandigheid, niet in twist en jaloezie;", "Jes 62:12": "En zij zullen hen noemen het heilige volk, de verlosten van de HEERE; en u zult genoemd worden de gezochte, de stad, die niet verlaten is.", "Hand 10:34": "En Petrus opende zijn mond en zei: Ik merk in waarheid dat God niet iemand aanneemt op grond van het persoon;", "Hebr 7:16": "die dit niet geworden is naar de wet van het vleselijke gebod, maar naar de kracht van het onvergankelijke leven.", "Ps 118:23": "Dit is van de HEERE gebeurd, en het is wonderlijk in onze ogen.", "Ps 103:1-4": "Een psalm van David. Loof de HEERE, mijn ziel, en al wat binnen in mij is, Zijn heilige Naam. Loof de HEERE, mijn ziel, en vergeet geen van Zijn weldaden; Die al uw ongerechtigheid vergeeft, die al uw ziekten geneest;", "Luk 12:46": "dan zal de heer van die dienstknecht komen op een dag dat hij hem niet verwacht, en op een moment dat hij het niet weet; en hij zal hem in stukken houwen, en hem zijn deel geven met de ontrouwen.", "1 Kon 8:41-43": "Zelfs ook aangaande de vreemdeling, die niet van Uw volk Israël zal zijn, maar uit ver land komt om Uw Naam wil; (want zij zullen horen van Uw grote Naam, en van Uw sterke hand, en van Uw uitgestrekte arm) wanneer hij komen en bidden zal in dit huis; hoor Ú in de hemel, de vaste plaats van Uw woning, en doe naar alles waarom die vreemdeling tot U roepen zal; opdat alle volken van de aarde Uw Naam kennen, om U te vrezen, zoals Uw volk Israël, en om te weten, dat Uw Naam genoemd wordt over dit huis, dat ik gebouwd heb.", "Mark 12:31": "En het tweede, hieraan gelijk, is dit: U zult uw naaste liefhebben als uzelf. Er is geen ander gebod groter dan deze.", "1 Joh 1:4": "En deze dingen schrijven wij u, opdat uw blijdschap vervuld is.", "Ps 119:18": "Ontdek mijn ogen, dat ik aanschouw de wonderen van Uw wet.", "Ex 31:13-16": "Spreek u nu tot de kinderen van Israël: U zult zeker Mijn sabbatten onderhouden; want dit is een teken tussen Mij en u, bij uw geslachten; opdat men weet, dat Ik de HEERE ben, Die u heilig maakt. Onderhoud dan de sabbat, omdat hij u heilig is! Wie hem ontheiligt, zal zeker gedood worden; want ieder die daarop enig werk doet, die ziel zal uitgeroeid worden uit het midden van haar volken. Zes dagen zal men het werk doen; maar op de zevende dag is de sabbat van de rust, een heiligheid van de HEERE! Wie op de sabbatdag arbeid doet, zal zeker gedood worden.", "Ps 36:10": "Want bij U is de fontein van het leven; in Uw licht zien wij het licht.", "Hebr 10:34-36": "Want u hebt ook medelijden gehad met mij in mijn boeien, en de beroving van uw bezittingen met blijdschap aanvaard, wetende dat u voor uzelf een beter en blijvend bezit hebt in de hemelen. Werp dan uw vrijmoedigheid niet weg, die een grote beloning van loon heeft. Want u hebt volharding nodig, opdat u, wanneer u de wil van God gedaan hebt, de belofte moogt ontvangen;", "Hebr 7:25": "Daarom kan Hij ook volkomen zalig maken hen die door Hem tot God gaan, omdat Hij altijd leeft om voor hen te bidden.", "1 Sam 2:10": "Zij die met de HEERE twisten, zullen verpletterd worden; Hij zal in de hemel over hen donderen; de HEERE zal de einden van de aarde richten, en zal Zijn Koning sterkte geven, en de hoorn van Zijn Gezalfde verhogen.", "Openb 14:7": "en hij zei met een luide stem: Vrees God, en geef Hem eer, want het uur van Zijn oordeel is gekomen; en aanbid Hem, Die de hemel, en de aarde, en de zee, en de bronnen van het water gemaakt heeft.", "Richt 5:11": "Van het gedruis van de schutters, tussen de plaatsen waar men water schept, spreekt men daar samen van de gerechtigheid van de HEERE, van de gerechtigheden, bewezen aan Zijn dorpen in Israël; toen ging het volk van de HEERE af naar de poorten.", "Ex 15:2": "De HEERE is mijn Kracht en Lied, en Hij is mij tot een Heil geweest; Deze is mijn God; daarom zal ik Hem een liefelijke woning maken; Hij is de God van mijn vader, daarom zal ik Hem verheffen!", "1 Petr 1:24": "Want alle vlees is als gras, en alle heerlijkheid van de mens is als een bloem van het gras. Het gras verdort, en zijn bloem valt af;", "Zach 11:5": "Die hen bezitten doden hen, en houden het niet voor schuld; en ieder van hen die ze verkopen, zegt: Geloofd zij de HEERE, dat ik rijk geworden ben! En niemand van hen die ze weiden, ontziet ze.", "1 Petr 1:2": "de uitverkorenen naar de voorkennis van God de Vader, in de heiligmaking van de Geest, tot gehoorzaamheid en besprenging met het bloed van Jezus Christus; genade en vrede worde u vermenigvuldigd.", "Amos 5:4": "Want zo zegt de HEERE tot het huis van Israël: Zoek Mij, en leef.", "Jer 7:3-11": "Zo zegt de HEERE van de heerscharen, de God van Israël: Maak uw wegen en uw handelingen goed, dan zal Ik u laten wonen in deze plaats. Vertrouw niet op valse woorden, en zeg niet: De tempel van de HEERE, de tempel van de HEERE, de tempel van de HEERE, zijn deze! Maar als u uw wegen en uw handelingen werkelijk goed maakt, als u werkelijk recht doet tussen de man en zijn naaste;", "Neh 10:31": "Ook als de volken van het land waren en alle koren op de sabbatdag ten verkoop zouden brengen, dat wij op de sabbat, of op een andere heilige dag, niets van hen zouden nemen; en dat wij het zevende jaar zouden vrij laten, alsook allerlei bezwaarnis.", "Gen 2:24": "Daarom zal de man zijn vader en zijn moeder verlaten, en zich hechten aan zijn vrouw; en zij zullen tot een vlees zijn.", "Ps 100:1-4": "Een lofzang. Heel de aarde, juich voor de HEERE! Dien de HEERE met blijdschap, kom voor Zijn aangezicht met vrolijk gezang. Weet dat de HEERE God is; Hij heeft ons gemaakt, en niet wij zelf; wij zijn Zijn volk en de schapen van Zijn weide.", "1 Petr 1:14": "Als gehoorzame kinderen, vorm u niet naar de begeerten die u vroeger, in uw onwetendheid, had;", "Jes 33:24": "En geen inwoner zal zeggen: Ik ben ziek, want het volk, dat daarin woont, zal vergeving van ongerechtigheid ontvangen.", "Rom 12:11": "Wees niet traag in het benaarstigen. Wees vurig van geest. Dien de Heere.", "Luk 20:35": "maar wie waardig geacht worden om die andere wereld te verwerven en de opstanding uit de doden, zullen niet trouwen, en ook niet ten huwelijk uitgegeven worden;", "Spr 9:1-6": "De opperste Wijsheid heeft haar huis gebouwd; zij heeft haar zeven pilaren gehouwen. Zij heeft haar slachtvee geslacht. Zij heeft haar wijn gemengd; ook heeft zij haar tafel klaargemaakt. Zij heeft haar dienstmeisjes uitgezonden; zij nodigt uit op de tinnen van de hoogten van de stad:", "Ps 2:7": "Ik zal van het besluit vertellen: de HEERE heeft tot Mij gezegd: U bent Mijn Zoon, vandaag heb Ik U verwekt.", "Mal 4:2": "Voor u echter, die Mijn Naam vreest, zal de Zon der gerechtigheid opgaan, met genezing onder Haar vleugels; en u zult uitgaan en toenemen als mestkalveren.", "Num 28:10": "Het is het brandoffer van de sabbat op elke sabbat, boven het voortdurende brandoffer, en zijn drankoffer.", "Hos 9:8": "De wachter van Efraïm is met mijn God, maar de profeet is een vogelvangersstrik op al zijn wegen, een haat in het huis van zijn God.", "Jes 1:3": "Een os kent zijn bezitter, en een ezel de krib van zijn heer; maar Israël heeft geen kennis, Mijn volk begrijpt het niet.", "Ps 89:8": "God is zeer geducht in de raad van de heiligen, en te vrezen boven allen die rondom Hem zijn.", "Luk 24:52": "En zij aanbaden Hem, en keerden terug naar Jeruzalem met grote blijdschap.", "Jer 13:20": "Hef uw ogen op, en zie hen die daar uit het noorden komen! Waar is de kudde die u gegeven was, de schapen van uw heerlijkheid?", "Gal 3:21": "Is de wet dan tegen de beloften van God? Dat zij verre; want als er een wet gegeven was die machtig was levend te maken, dan zou de rechtvaardigheid werkelijk uit de wet zijn.", "Micha 4:12": "Maar zij kennen de gedachten van de HEERE niet, en begrijpen Zijn raadsbesluit niet; dat Hij hen bijeengebracht heeft als schoven op de dorsvloer.", "Amos 5:11": "Daarom, omdat u de arme vertreedt en een last koren van hem neemt, hebt u wel huizen gebouwd van gehouwen steen, maar u zult daarin niet wonen; u hebt heerlijke wijngaarden geplant, maar u zult de wijn daarvan niet drinken.", "2 Kor 4:14": "Wetend dat Hij, Die de Heere Jezus opgewekt heeft, ook ons door Jezus zal opwekken, en met u daar zal stellen.", "Matt 4:7": "Jezus zei tegen hem: Er is ook geschreven: U zult de Heere, uw God, niet beproeven.", "Matt 24:20": "Bid dat uw vlucht niet gebeurt in de winter, en ook niet op een sabbat.", "Joh 3:4": "Nicodemus zei tegen Hem: Hoe kan een mens geboren worden als hij al oud is? Kan hij soms voor de tweede keer in de buik van zijn moeder ingaan en geboren worden?", "Jes 55:3-5": "Neig uw oor, en kom tot Mij, hoor en uw ziel zal leven; want Ik zal met u een eeuwig verbond maken, en u geven de zekere weldaden van David. Zie, Ik heb hem tot een getuige van de volken gegeven, een vorst en gebieder van de volken. Zie, u zult een volk roepen, dat u niet kende, en het volk, dat u niet kende, zal tot u lopen, om de wil van de HEERE, uw God, en om de wil van de Heilige van Israël, want Hij heeft u verheerlijkt.", "1 Sam 2:1": "Toen bad Hanna en zei: Mijn hart springt van vreugde op in de HEERE; mijn hoorn is verhoogd in de HEERE; mijn mond is wijd opengedaan over mijn vijanden; want ik verheug mij in Uw heil.", "Ps 104:15": "En de wijn, die het hart van de mens verheugt, zodat het gezicht blinkt van olie; en het brood, dat het hart van de mens sterkt.", "Spr 28:12": "Als de rechtvaardigen opspringen van vreugde, is er grote heerlijkheid; maar als de goddelozen opkomen, wordt de mens angstvallig gezocht.", "Luk 23:46": "En Jezus riep met luide stem en zei: Vader, in Uw handen beveel Ik Mijn geest. En toen Hij dat gezegd had, gaf Hij de geest.", "Matt 13:22": "En die in de doornen bezaaid is, dit is degene die het woord hoort; en de zorgen van deze wereld en de verleiding van de rijkdom verstikken het woord, en het wordt onvruchtbaar.", "Hand 13:38": "Zo zij het u dan bekend, mannen broeders, dat door Hem u vergeving van de zonden verkondigd wordt;", "1 Kor 3:10-16": "Naar de genade van God, die mij gegeven is, heb ik als een wijs bouwmeester het fundament gelegd; en een ander bouwt daarop. Maar ieder ziet toe hoe hij daarop bouwt. Want niemand kan een ander fundament leggen dan hetgeen gelegd is, hetwelk is Jezus Christus. En als iemand op dit fundament bouwt: goud, zilver, kostbare stenen, hout, hooi, stoppels;", "Ps 55:23": "Werp uw zorg op de HEERE, en Hij zal u onderhouden; Hij zal in eeuwigheid niet toelaten dat de rechtvaardige wankelt.", "Dan 7:22": "Totdat de Oude van dagen kwam, en het gericht gegeven werd aan de heiligen van de hoge plaatsen, en de bestemde tijd kwam, dat de heiligen het Rijk bezaten.", "1 Tess 1:9": "Want zijzelf vertellen over ons, wat voor ontvangst wij bij u gehad hebben, en hoe u zich tot God bekeerd hebt van de afgoden, om de levende en waarachtige God te dienen;", "Jer 31:12-14": "Daarom zullen zij komen, en op de hoogte van Sion juichen, en toevloeien tot het goede van de HEERE, tot het koren, en tot de most, en tot de olie, en tot de jonge schapen en runderen; en hun ziel zal zijn als een gewaterde hof, en zij zullen voortaan niet meer treurig zijn. Dan zal de jonkvrouw zich verblijden in de rei, en ook de jongelingen en de ouderen samen; want Ik zal hun rouw in vrolijkheid veranderen, en zal hen troosten, en zal hen verblijden na hun droefenis. En Ik zal de ziel van de priesters met overvloed dronken maken; en Mijn volk zal met Mijn goed verzadigd worden, spreekt de HEERE.", "Matt 23:4": "Want zij binden lasten die zwaar zijn en moeilijk om te dragen, en leggen ze op de schouders van de mensen; maar zij willen die met hun vinger niet verroeren.", "Luk 5:31": "En Jezus antwoordde en zei tegen hen: Wie gezond zijn, hebben geen dokter nodig, maar wie ziek zijn.", "Jes 66:13": "Zoals iemand die zijn moeder troost, zo zal Ik u troosten; ja, u zult in Jeruzalem getroost worden.", "Fil 4:7": "En de vrede van God, die alle verstand te boven gaat, zal uw harten en uw gedachten bewaren in Christus Jezus.", "Jes 44:23": "Zing met vreugde, u hemelen! Want de HEERE heeft het gedaan; juich, u onderste delen van de aarde! U bergen! Maak een groot gedreun met vreugdegezang, u bossen, en al het geboomte daarin! Want de HEERE heeft Jakob verlost, en Zich heerlijk gemaakt in Israël.", "Spr 15:21": "De dwaasheid is voor de verstandeloze een blijdschap; maar een man van verstand gaat recht zijn weg.", "Hos 1:10": "Toch zal het aantal kinderen van Israël zijn als het zand van de zee, dat niet gemeten en niet geteld kan worden; en het zal gebeuren dat op de plaats waar tegen hen gezegd is: U bent Mijn volk niet; tegen hen gezegd zal worden: U bent kinderen van de levende God.", "Jes 45:24": "Men zal van Mij zeggen: Zeker, in de HEERE zijn gerechtigheden en sterkte; tot Hem zal men komen; maar zij zullen allen beschaamd worden die tegen Hem in woede ontstoken zijn.", "Ps 100:1": "Een lofzang. Heel de aarde, juich voor de HEERE!", "Jer 27:9-18": "U dan, luister niet naar uw profeten, en naar uw waarzeggers, en naar uw dromers, en naar uw guichelaars, en naar uw tovenaars, die tegen u spreken en zeggen: U zult de koning van Babel niet dienen. Want zij profeteren u leugens, om u ver uit uw land weg te brengen, en dat Ik u wegjaag, en u omkomt. Maar het volk dat zijn hals onder het juk van de koning van Babel zal brengen, en hem dienen, dat zal Ik in zijn land laten blijven, spreekt de HEERE, en het zal het bebouwen en erin wonen.", "Luk 1:17": "En hij zal voor Hem uit gaan, in de geest en de kracht van Elia, om de harten van de vaders tot de kinderen te bekeren, en de ongehoorzamen tot de wijsheid van de rechtvaardigen, om voor de Heere een toegerust volk gereed te maken.", "Jes 9:9": "De tichelstenen zijn gevallen, maar met uitgehouwen stenen zullen wij opnieuw bouwen; de wilde vijgenbomen zijn afgehouwen, maar wij zullen ze in cederen veranderen;", "Ezech 20:13": "Maar het huis van Israël werd opstandig tegen Mij in de woestijn; zij wandelden niet in Mijn inzettingen, en verwierpen Mijn rechten, die, als een mens ze doet, hij daardoor zal leven; en zij ontheiligden Mijn sabbatten zeer, zodat Ik zei dat Ik Mijn grimmigheid over hen zou uitgieten in de woestijn, om hen te verdelgen.", "Matt 25:46": "En dezen zullen weggaan in de eeuwige pijn; maar de rechtvaardigen in het eeuwige leven.", "Spr 8:17": "Ik heb hen lief die Mij liefhebben; en die Mij vroeg zoeken, zullen Mij vinden.", "Hebr 11:16": "maar nu verlangen zij naar een beter vaderland, dat is, naar het hemelse. Daarom schaamt God Zich niet voor hen om hun God genoemd te worden; want Hij had voor hen een stad klaargemaakt.", "Mark 3:35": "Want wie de wil van God doet, die is Mijn broer, en Mijn zuster, en moeder.", "Hab 1:5": "Ziet onder de heidenen, en aanschouwt, en verwonder u, verwonder u, want Ik werk een werk in uw dagen, dat u niet geloven zult, als het verteld wordt.", "Ps 116:10": "Ik heb geloofd, daarom sprak ik; ik ben zeer bedrukt geweest.", "1 Tess 5:8": "Maar wij, die van de dag zijn, laten wij nuchter zijn, terwijl wij aandoen het borstwapen van het geloof en de liefde, en tot een helm de hoop van de zaligheid.", "Rom 5:9-11": "Veelmeer dan zullen wij, nu gerechtvaardigd door Zijn bloed, door Hem behouden worden van de toorn. Want als wij, toen wij nog vijanden waren, met God verzoend zijn door de dood van Zijn Zoon, zullen wij des te meer, nu wij verzoend zijn, behouden worden door Zijn leven. En niet alleen dit, maar wij roemen ook in God, door onze Heere Jezus Christus, door Wie wij nu de verzoening gekregen hebben.", "1 Tim 2:8": "Ik wil dan dat de mannen bidden op alle plaatsen, met het opheffen van heilige handen, zonder toorn en twist.", "Spr 7:7-23": "En ik zag onder de eenvoudigen; ik merkte onder de jonge mannen een verstandeloze jongeling; Die voorbijging op de straat, naast haar hoek, en hij trad op de weg naar haar huis. In de schemering, in de avond van de dag, in de zwarte nacht en de donkerheid;", "Ezech 3:17": "Mensenkind! Ik heb u tot een wachter gesteld over het huis Israëls; zo zult u het woord uit Mijn mond horen, en hen namens Mij waarschuwen.", "Ps 65:6": "Vreselijke dingen zult U ons in gerechtigheid antwoorden, o God van ons heil! o Vertrouwen van alle einden van de aarde, en van de ver weg gelegenen aan de zee!", "Rom 2:26": "Als dan de voorhuid de rechten van de wet bewaart, zal zijn voorhuid dan niet tot een besnijdenis gerekend worden?", "Kol 2:13": "En Hij heeft u, toen u dood was in de misdaden en in de onbesnedenheid van uw vlees, mede levend gemaakt met Hem, terwijl Hij u al uw misdaden vergaf;", "Rom 8:14-18": "Want zovelen als er door de Geest van God geleid worden, die zijn kinderen van God. Want u hebt niet de geest van slavernij ontvangen, om opnieuw te vrezen, maar u hebt de Geest van aanneming tot kinderen ontvangen, door Wie wij roepen: Abba, Vader! Diezelfde Geest getuigt met onze geest, dat wij kinderen van God zijn.", "1 Sam 2:9": "Hij zal de voeten van Zijn gunstgenoten bewaren; maar de goddelozen zullen zwijgen in duisternis; want een man vermag niet door kracht.", "Deut 6:13": "U zult de HEERE, uw God, vrezen, en Hem dienen; en u zult bij Zijn Naam zweren.", "Ps 110:1-6": "Een psalm van David. De HEERE heeft tot mijn Heere gesproken: Zit aan Mijn rechterhand, totdat Ik Uw vijanden gezet zal hebben tot een voetbank van Uw voeten. De HEERE zal de scepter van Uw sterkte zenden uit Sion, en zeggen: Heers in het midden van Uw vijanden. Uw volk zal zeer gewillig zijn op de dag van Uw heirkracht, in heilig sieraad; uit de baarmoeder van het dageraad zal U de dauw van Uw jeugd zijn.", "Ps 73:25": "Aan wie heb ik behalve U iets in de hemel? Behalve U verlang ik ook niets op de aarde!", "Lev 26:11": "En Ik zal Mijn tabernakel in uw midden zetten; en Mijn ziel zal van u niet walgen.", "Micha 7:3": "Om met beide handen goed hun best te doen om kwaad te doen, zo eist de vorst, en de rechter oordeelt om vergelding; en de grote spreekt de verderving van zijn ziel uit, en zij draaien het samen dicht ineen.", "Jes 9:8": "En dit hele volk zal het gewaar worden, Efraïm en de inwoner van Samaria; in hoogmoed en grootsheid van hart, en zij zeiden:", "Ps 5:9": "HEERE! Leid mij in Uw gerechtigheid, om mijn verspieders wil; richt Uw weg voor mijn aangezicht.", "Jes 66:19": "En Ik zal een teken bij hen zetten, en uit hen die ontkomen zijn, zal Ik zenden naar de heidenen, naar Tarsis, Pul en Lud, de boogschutters, naar Tubal en Javan, naar de ver gelegen eilanden, die Mijn faam niet gehoord en Mijn heerlijkheid niet gezien hebben; en zij zullen Mijn heerlijkheid onder de heidenen verkondigen.", "Matt 23:16-26": "Wee u, blinde leidslieden, die zeggen: Wie ook zweert bij de tempel, dat is niets; maar wie zweert bij het goud van de tempel, die is verplicht zijn eed te houden. Dwazen en blinden, want wat is meer, het goud, of de tempel die het goud heiligt? En wie zweert bij het altaar, dat is niets; maar wie zweert bij de gave die daarop ligt, die is verplicht zijn eed te houden.", "Jes 43:2": "Wanneer u door het water zult gaan, Ik zal bij u zijn, en door de rivieren, zij zullen u niet overstromen; wanneer u door het vuur zult gaan, zult u niet verbranden, en de vlam zal u niet aansteken.", "Jes 58:1": "Roep uit de keel, houd niet in, verhef uw stem als een bazuin, en verkondig Mijn volk hun overtreding, en het huis van Jakob hun zonden.", "Pred 7:7": "Voorwaar, de onderdrukking zou wel een wijze dol maken; en het geschenk verdoemt het hart.", "Mark 7:21-23": "Want van binnenuit, uit het hart van de mensen, komen voort kwade gedachten, overspel, hoererijen, moorden, diefstal, hebzucht, slechtheid, bedrog, losbandigheid, een boos oog, lastering, hoogmoed, dwaasheid. Al deze boze dingen komen van binnenuit voort, en verontreinigen de mens.", "Matt 18:14": "Zo is het ook niet de wil van uw Vader, Die in de hemelen is, dat een van deze kleinen verloren gaat.", "Mark 10:31": "Maar vele eersten zullen de laatsten zijn, en velen die de laatsten zijn, de eersten.", "Lev 19:30": "U zult Mijn sabbatten houden, en Mijn heiligdom zult u vrezen; Ik ben de HEERE!", "Judas 1:16": "Deze mensen zijn mopperaars, klagers over hun lot, die wandelen naar hun eigen begeerten; en hun mond spreekt zeer opgeblazen dingen, terwijl zij mensen bewonderen omwille van het voordeel dat het oplevert.", "Ezech 18:19": "Maar u zegt: Waarom draagt de zoon niet de ongerechtigheid van de vader? Zeker zal de zoon, die recht en gerechtigheid gedaan heeft, en al Mijn inzettingen onderhouden heeft, en die gedaan heeft, zeker leven.", "Joël 2:28-32": "En daarna zal het gebeuren, dat Ik Mijn Geest zal uitgieten over alle vlees, en uw zonen en uw dochters zullen profeteren; uw ouden zullen dromen dromen, uw jongelingen zullen gezichten zien; Ja, ook over de dienstknechten, en over de dienstmaagden, zal Ik in die dagen Mijn Geest uitgieten. En Ik zal wondertekenen geven in de hemel en op de aarde: bloed, en vuur, en rookpilaren.", "Gal 3:1-28": "O onverstandige Galaten, wie heeft u betoverd, dat u de waarheid niet zou gehoorzamen? U voor wie ogen Jezus Christus is voorgeschilderd, onder u gekruisigd. Dit alleen wil ik van u leren: hebt u de Geest ontvangen uit de werken van de wet, of uit de prediking van het geloof? Bent u zo onverstandig? U bent met de Geest begonnen, gaat u nu voleindigen met het vlees?", "Jes 30:10": "Die tegen de zieners zeggen: Ziet niet; en tegen de schouwers: Schouwt ons niet wat recht is; spreekt tot ons zachte dingen, schouwt ons bedriegerijen.", "Job 10:7": "Het is Uw wetenschap, dat ik niet goddeloos ben; nochtans is er niemand, die uit Uw hand verlost.", "Amos 6:6": "Die wijn uit schalen drinken, en zich zalven met de beste olie, maar zich niet bekommeren over de verbreking van Jozef.", "Mark 11:24": "Daarom zeg Ik u: Alle dingen die u in het gebed vraagt, geloof dat u ze ontvangen zult, en ze zullen u gegeven worden.", "Ef 1:13": "In Wie ook u zijt, nadat u het woord der waarheid, namelijk het Evangelie van uw zaligheid, gehoord hebt; in Wie u ook, nadat u geloofd hebt, verzegeld bent geworden met de Heilige Geest der belofte;", "Mark 10:35-37": "En Jakobus en Johannes, de zonen van Zebedeüs, kwamen naar Hem toe, en zeiden: Meester, wij zouden graag willen dat U voor ons deed wat wij ook zullen vragen. En Hij zei tegen hen: Wat wilt u dat Ik voor u doe? En zij zeiden tegen Hem: Geef ons dat wij mogen zitten, de één aan Uw rechterhand, en de ander aan Uw linkerhand, in Uw heerlijkheid.", "Jes 61:1-3": "De Geest van de Heere HEERE is op Mij, omdat de HEERE Mij gezalfd heeft, om een blijde boodschap te brengen aan de zachtmoedigen; Hij heeft Mij gezonden om te verbinden de gebrokenen van hart, om de gevangenen vrijheid uit te roepen, en de gebondenen opening van de gevangenis; Om uit te roepen het jaar van het welbehagen van de HEERE, en de dag van de wraak van onze God; om alle treurenden te troosten; Om de treurenden van Sion te geven, dat hun sieraad gegeven wordt voor as, vreugdeolie voor treurigheid, het gewaad van lof voor een benauwde geest; opdat zij eikenbomen van de gerechtigheid genoemd worden, een planting van de HEERE, opdat Hij verheerlijkt wordt.", "Ex 25:40": "Zie er dan op toe dat u het maakt naar hun voorbeeld, dat u op de berg getoond is.", "Ps 36:3": "Want hij vleit zichzelf in zijn ogen, als men zijn ongerechtigheid bevindt, die te haten is.", "1 Kor 2:16": "Want wie heeft de gedachte van de Heere gekend, dat hij Hem zou onderrichten? Maar wij hebben de gedachte van Christus.", "Zach 14:20": "Op die dag zal op de bellen van de paarden staan: DE HEILIGHEID VAN DE HEERE. En de potten in het huis van de HEERE zullen zijn als de sprenkelschalen voor het altaar;", "Ex 19:6": "En u zult Mij een priesterlijk koninkrijk en een heilig volk zijn. Dit zijn de woorden die u tot de kinderen van Israël spreken zult.", "Matt 13:13-16": "Daarom spreek Ik tot hen door gelijkenissen, omdat zij ziende niet zien, en horende niet horen, en ook niet begrijpen. En in hen wordt de profetie van Jesaja vervuld, die zegt: Met het gehoor zult u horen, en geenszins begrijpen; en ziende zult u zien, en geenszins opmerken. Want het hart van dit volk is dik geworden, en met de oren hebben zij zwaar gehoord, en hun ogen hebben zij gesloten; opdat zij niet op enig moment met de ogen zouden zien, en met de oren horen, en met het hart begrijpen, en zich bekeren, en Ik hen zou genezen.", "Matt 28:20": "en leer hen om alles te onderhouden wat Ik u geboden heb. En zie, Ik ben met u al de dagen, tot de voleinding van de wereld. Amen.", "Ps 88:13": "Zullen Uw wonderen bekend worden in de duisternis, en Uw gerechtigheid in het land van de vergetelheid?", "2 Kor 5:11": "Wij dan, die de schrik van de Heere kennen, bewegen de mensen tot het geloof, en wij zijn openbaar geworden voor God; en ik hoop dat wij ook in uw gewetens geopenbaard zijn geworden.", "Matt 13:15": "Want het hart van dit volk is dik geworden, en met de oren hebben zij zwaar gehoord, en hun ogen hebben zij gesloten; opdat zij niet op enig moment met de ogen zouden zien, en met de oren horen, en met het hart begrijpen, en zich bekeren, en Ik hen zou genezen.", "Hos 5:4": "Zij richten hun daden niet zo in dat zij zich tot hun God bekeren; want de geest van de hoererijen is in hun midden, en de Heere kennen zij niet.", "Joh 12:38": "Opdat het woord van Jesaja, de profeet, vervuld werd, dat hij gesproken heeft: Heere, wie heeft onze prediking geloofd, en aan wie is de arm van de Heere geopenbaard?", "Matt 22:29": "Maar Jezus antwoordde en zei tegen hen: U dwaalt, omdat u de Schriften niet kent, noch de kracht van God.", "Matt 24:5": "Want velen zullen komen onder Mijn Naam en zeggen: Ik ben de Christus; en zij zullen velen misleiden.", "Mark 11:9": "En zij die voorop gingen, en zij die volgden, riepen: Hosanna! Gezegend is Hij Die komt in de Naam van de Heere!", "Ezech 34:23-31": "En Ik zal één Herder over hen doen opstaan, en Hij zal hen weiden, namelijk Mijn knecht David; die zal ze weiden, en Die zal hun tot een Herder zijn. En Ik, de HEERE, zal hun tot een God zijn; en Mijn knecht David zal Vorst zijn te midden van hen, Ik, de HEERE, heb het gesproken. En Ik zal een verbond van vrede met hen maken, en zal het boze gedierte uit het land doen ophouden; en zij zullen zeker wonen in de woestijn, en slapen in de wouden.", "Hand 13:22": "En nadat Hij hem afgezet had, verwekte Hij hun David tot koning; aan wie Hij ook getuigenis gaf, en zei: Ik heb David gevonden, de zoon van Isaï, een man naar Mijn hart, die al Mijn wil zal doen.", "2 Kor 7:2": "Geef ons plaats; wij hebben niemand onrecht aangedaan, wij hebben niemand verdorven, wij hebben bij niemand ons voordeel gezocht.", "Deut 5:18": "En u zult geen overspel doen.", "2 Kor 9:9": "Zoals er geschreven is: Hij heeft uitgestrooid, hij heeft aan de armen gegeven; Zijn gerechtigheid blijft in eeuwigheid.", "Fil 3:2": "Let op de honden, let op de kwade arbeiders, let op de versnijding.", "Ex 23:3": "Ook zult u de arme niet voortrekken in zijn geschil.", "Mark 7:6": "Maar Hij antwoordde en zei tegen hen: Terecht heeft Jesaja over u, huichelaars, geprofeteerd, zoals geschreven is: Dit volk eert Mij met de lippen, maar hun hart houdt zich ver van Mij.", "1 Petr 1:10": "Naar deze zaligheid hebben de profeten gezocht en onderzoek gedaan, zij die geprofeteerd hebben van de genade die voor u bestemd was;", "1 Kor 15:55": "Dood, waar is uw prikkel? Graf, waar is uw overwinning?", "Ps 138:5": "En zij zullen zingen van de wegen van de HEERE, want de heerlijkheid van de HEERE is groot.", "Matt 5:19": "Wie dan een van deze minste geboden afschaft, en de mensen zo leert, die zal de minste genoemd worden in het Koninkrijk der hemelen; maar wie ze doet en leert, die zal groot genoemd worden in het Koninkrijk der hemelen.", "Jes 55:5": "Zie, u zult een volk roepen, dat u niet kende, en het volk, dat u niet kende, zal tot u lopen, om de wil van de HEERE, uw God, en om de wil van de Heilige van Israël, want Hij heeft u verheerlijkt.", "1 Tim 5:13": "En meteen leren zij ook nietsdoend rondgaan bij de huizen; en zijn niet alleen nietsdoend, maar ook praatziek, en bezig met wat hen niet aangaat, terwijl zij spreken wat niet betaamt.", "Deut 32:21": "Zij hebben Mij tot ijver verwekt door wat geen God is; zij hebben Mij tot toorn verwekt door hun ijdelheden; Ik dan zal hen tot ijver verwekken door hen die geen volk zijn; door een dwaas volk zal Ik hen tot toorn verwekken.", "Deut 7:9": "U zult dan weten dat de HEERE, uw God, dié God is, de getrouwe God, Die het verbond en de goedertierenheid houdt met wie Hem liefhebben en Zijn geboden houden, tot in duizend geslachten.", "Luk 8:12": "Zij die langs de weg bezaaid worden, zijn zij die horen; daarna komt de duivel en neemt het Woord uit hun hart weg, opdat zij niet zouden geloven en zalig worden.", "Ps 73:2-22": "Maar wat mij aangaat, mijn voeten waren bijna uitgegleden; mijn schreden waren bijna weggegleden. Want ik was jaloers op de dwazen, toen ik de vrede van de goddelozen zag. Want er zijn geen boeien tot hun dood toe, en hun kracht is fris.", "Matt 11:11": "Voorwaar, Ik zeg u: onder degenen die uit vrouwen geboren zijn, is niemand opgestaan die groter is dan Johannes de Doper; maar wie de minste is in het Koninkrijk der hemelen, is groter dan hij.", "Gen 17:5": "En uw naam zal niet meer Abram genoemd worden; maar uw naam zal Abraham zijn; want Ik heb u tot een vader van een menigte volken gemaakt.", "Kol 2:14": "Hij heeft het handschrift uitgewist dat tegen ons was, bestaande in inzettingen, dat ons op enigerlei wijze tegenwerkte, en Hij heeft dat uit het midden weggenomen door het aan het kruis te nagelen;", "Matt 22:32": "Ik ben de God van Abraham, en de God van Izak, en de God van Jakob! God is niet een God van de doden, maar van de levenden.", "Joh 4:11": "De vrouw zei tegen Hem: Heere, U hebt niets om mee te putten, en de put is diep; waar hebt U dan het levende water vandaan?", "Ps 84:12": "Want God, de HEERE, is een Zon en Schild; de HEERE zal genade en eer geven; Hij zal het goede niet onthouden aan hen die in oprechtheid wandelen.", "Jes 22:13": "Maar zie, er is vreugde en blijdschap met runderen te doden, en schapen te slachten, vlees te eten, en wijn te drinken, en te zeggen: Laten we eten en drinken, want morgen zullen we sterven.", "Joh 3:15-18": "Opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft. Want zo lief heeft God de wereld gehad, dat Hij Zijn eniggeboren Zoon gegeven heeft, opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft. Want God heeft Zijn Zoon niet in de wereld gezonden opdat Hij de wereld zou veroordelen, maar opdat de wereld door Hem behouden zou worden.", "Rom 8:36": "(Zoals geschreven is: Want om Uwentwil worden wij de hele dag gedood; wij worden gerekend als schapen die geslacht worden.)", "Mark 8:35": "Want wie zijn leven zal willen behouden, die zal het verliezen; maar wie zijn leven zal verliezen, omwille van Mij, en omwille van het Evangelie, die zal het behouden.", "Jes 28:7": "Maar ook dezen dwalen door de wijn, en zij dolen door de sterke drank; de priester en de profeet dwalen door de sterke drank; zij zijn verslonden door de wijn, zij dolen door sterke drank; zij dwalen in het zien van visioenen; zij waggelen in het rechtspreken.", "Joël 1:5": "Word wakker, dronkaards! En huil, en jammer, alle wijnzuipers! Om de nieuwe wijn, omdat hij van uw mond is afgesneden.", "Jes 2:3": "En veel volken zullen heengaan en zeggen: Kom, laat ons opgaan tot de berg van de HEERE, tot het huis van de God van Jakob, opdat Hij ons leert van Zijn wegen, en dat wij wandelen in Zijn paden; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem.", "Matt 24:4": "En Jezus antwoordde en zei tegen hen: Kijk uit dat niemand u misleidt.", "Hos 4:11": "Hoererij, en wijn, en jonge wijn neemt het hart weg.", "Spr 11:26": "Wie koren inhoudt, hem vervloekt het volk; maar zegening zal zijn over het hoofd van de verkoper.", "Ezech 12:2": "Mensenkind! U woont in het midden van een opstandig huis, dat ogen heeft om te zien, en niet ziet, oren heeft om te horen, en niet hoort, want zij zijn een opstandig huis.", "Spr 17:16": "Waarom toch zou de dwaas geld in zijn hand hebben, om wijsheid te kopen, terwijl hij geen verstand heeft?", "Jer 9:3": "En zij spannen hun tong als hun boog voor leugen; zij worden geweldig in het land, maar niet voor waarheid; want zij gaan voort van slechtheid tot slechtheid, maar Mij kennen zij niet, spreekt de HEERE.", "1 Petr 2:10": "U, die vroeger geen volk was, maar nu het volk van God bent; die vroeger niet ontfermd was, maar nu ontfermd bent geworden.", "Spr 21:17": "Wie blijdschap liefheeft, die zal gebrek lijden; wie wijn en olie liefheeft, zal niet rijk worden.", "Job 8:20": "Zie, God zal de oprechte niet verwerpen; Hij zal ook de boosdoeners niet bij de hand vatten;", "Openb 16:15": "Zie, Ik kom als een dief. Zalig is hij die waakt en zijn kleren bewaart, zodat hij niet naakt hoeft te wandelen, en men zijn schaamte niet ziet.", "Jak 4:6": "Ja, Hij geeft meer genade. Daarom zegt de Schrift: God weerstaat de hoogmoedigen, maar de nederigen geeft Hij genade.", "Hand 15:16": "Hierna zal Ik terugkeren, en de tabernakel van David, die vervallen is, weer opbouwen; en wat ervan verwoest is, zal Ik weer opbouwen, en Ik zal hem weer oprichten,", "Joh 15:4": "Blijft in Mij, en Ik in u. Zoals de rank geen vrucht kan dragen uit zichzelf, als zij niet in de wijnstok blijft, zo ook u niet, als u in Mij niet blijft.", "Ps 35:19": "Laat hen zich niet verblijden over mij, die mij om valse oorzaken vijand zijn; laat hen ook niet wenken met de ogen, die mij zonder oorzaak haten.", "Ezech 16:49": "Zie, dit was de ongerechtigheid van uw zuster Sodom: hoogmoed, verzadiging van brood, en zorgeloze rust had zij en haar dochters; maar zij versterkte de hand van de arme en de behoeftige niet.", "Ps 45:8": "U hebt gerechtigheid lief, en haat goddeloosheid; daarom heeft God, Uw God, U gezalfd met vreugdeolie, boven Uw metgezellen.", "Zef 3:18": "De bedroefden, om de bijeenkomst, zal Ik verzamelen, zij zijn uit u; de smaad is een last op haar.", "Jes 62:10": "Gaat door, gaat door, door de poorten, bereidt de weg van het volk; verhoogt, verhoogt een baan, ruimt de stenen weg, steekt een banier omhoog tot de volken!", "Matt 19:12-30": "Want er zijn gesnedenen, die uit moeders lijf zo geboren zijn; en er zijn gesnedenen, die door de mensen gesneden zijn; en er zijn gesnedenen, die zichzelf gesneden hebben, om het Koninkrijk der hemelen. Wie dit vatten kan, laat hij het vatten. Toen werden kinderen tot Hem gebracht, opdat Hij de handen op hen zou leggen en bidden; en de discipelen bestraften hen. Maar Jezus zei: Laat de kinderen begaan, en verhinder hen niet om tot Mij te komen; want voor zulken is het Koninkrijk der hemelen.", "Micha 3:5-7": "Zo zegt de HEERE, tegen de profeten, die Mijn volk verleiden; die met hun tanden bijten, en vrede uitroepen; maar tegen hem die niet in hun mond geeft, tegen die heiligen zij een oorlog. Daarom zal het nacht voor u worden vanwege het visioen, en u zal duisternis zijn vanwege de waarzegging; en de zon zal over deze profeten ondergaan; en de dag zal over hen zwart worden. En de zieners zullen beschaamd, en de waarzeggers schaamrood worden; en zij zullen allen samen de bovenlip bewimpelen; want er zal geen antwoord van God zijn.", "Spr 19:3": "De dwaasheid van de mens verdraait zijn weg; en zijn hart is boos op de HEERE.", "Ps 119:137": "Tsade. HEERE! U bent rechtvaardig, en elk van Uw oordelen is recht.", "Openb 6:2": "En ik zag, en zie, een wit paard, en Die daarop zat, had een boog; en Hem is een kroon gegeven, en Hij ging uit, overwinnend, en om te overwinnen!", "Rom 3:30": "omdat Hij één God is, Die de besnijdenis zal rechtvaardigen uit het geloof, en de onbesnedenen door het geloof.", "2 Kon 8:13": "En Hazaël zei: Wat is uw dienaar toch, die een hond is, dat hij deze grote zaak zou doen? En Elisa zei: De HEERE heeft mij getoond dat u koning zult zijn over Syrië.", "Hand 4:12": "En de zaligheid is in geen Ander; want er is ook onder de hemel geen andere Naam, die onder de mensen gegeven is, waardoor wij moeten zalig worden.", "Mark 1:2": "Zoals geschreven is in de profeten: Zie, Ik zend Mijn engel voor Uw aangezicht, die Uw weg voor U heen bereiden zal.", "Spr 10:9": "Wie in oprechtheid wandelt, wandelt zeker; maar wie zijn wegen verdraait, zal bekend worden.", "1 Tim 1:3-7": "Zoals ik u vermaand heb dat u in Efeze zou blijven, toen ik naar Macedonië reisde, zo vermaan ik het u nog, opdat u sommigen zou bevelen geen andere leer te leren; Ook niet zich bezig te houden met fabels en eindeloze geslachtsregisters, die meer twistvragen voortbrengen dan de opbouw van God, die in het geloof is. Maar het doel van het gebod is liefde uit een rein hart, en uit een goed geweten, en uit een ongeveinsd geloof.", "Rom 2:7": "Hun die volhardend goeddoen en heerlijkheid, en eer, en onvergankelijkheid zoeken, het eeuwige leven;", "1 Tim 3:15": "maar als ik langer wegblijf, opdat u weet hoe men zich moet gedragen in het huis van God, dat is de Gemeente van de levende God, een pilaar en fundament van de waarheid.", "Rom 6:23": "Want het loon van de zonde is de dood, maar de genadegift van God is het eeuwige leven, door Jezus Christus, onze Heere.", "2 Kron 16:9": "Want wat de HEERE betreft, Zijn ogen doorlopen de hele aarde, om Zich sterk te bewijzen aan hen wier hart volkomen is tot Hem; hierin heeft u dwaas gedaan; want van nu af zullen er oorlogen tegen u zijn.", "1 Petr 1:16": "want er staat geschreven: Wees heilig, want Ik ben heilig.", "Ps 51:21": "Dan zult U lust hebben aan de offeranden van de gerechtigheid, aan brandoffer en een offer dat helemaal verteerd wordt; dan zullen zij jonge stieren offeren op Uw altaar.", "Openb 2:18": "En schrijf aan de engel van de gemeente te Thyatire: Dit zegt de Zoon van God, Die Zijn ogen heeft als een vlam van vuur, en Zijn voeten blinkend koper gelijk zijn:", "Jer 4:22": "Zeker, Mijn volk is dwaas, Mij kennen zij niet; het zijn zotte kinderen, en zij hebben geen inzicht; wijs zijn zij om kwaad te doen, maar goed te doen weten zij niet.", "Jak 1:12": "Gelukkig is de man die verzoeking verdraagt; want als hij beproefd zal zijn geweest, zal hij de kroon van het leven ontvangen, die de Heere beloofd heeft aan hen die Hem liefhebben.", "Spr 3:26": "Want de HEERE zal uw vertrouwen zijn, en Hij zal uw voet bewaren voor gevangenschap.", "Ex 12:46": "In één huis zal het gegeten worden; u mag van het vlees niet naar buiten, het huis uit, dragen, en u mag er geen been van breken.", "Ps 34:16": "Ain. De ogen van de HEERE zijn op de rechtvaardigen, en Zijn oren gericht op hun geroep.", "Jes 44:3-5": "Want Ik zal water gieten op de dorstige, en stromen op het droge; Ik zal Mijn Geest op uw nageslacht gieten, en Mijn zegen op uw nakomelingen. En zij zullen uitspruiten tussen het gras, als de wilgen aan de waterbeken. Deze zal zeggen: Ik ben van de HEERE; en die zal zich noemen met de naam van Jakob; en weer een ander zal met zijn hand schrijven: Ik ben van de HEERE, en zich noemen met de naam van Israël.", "Ps 91:14": "Omdat hij Mij zeer liefheeft, spreekt God, zo zal Ik hem uithelpen; Ik zal hem op een hoogte stellen, want hij kent Mijn Naam.", "Hebr 12:6": "Want die de Heere liefheeft, kastijdt Hij, en Hij geselt iedere zoon die Hij aanneemt.", "Neh 5:7": "En mijn hart beraadslaagde in mij; daarna berispte ik de edelen en de overheden, en zei tegen hen: U vordert een last, ieder van zijn broeder. Vervolgens riep ik een grote vergadering tegen hen bijeen.", "Hagg 2:8": "Ja, Ik zal alle heidenvolken doen beven, en zij zullen komen tot de Wens van alle heidenvolken, en Ik zal dit huis met heerlijkheid vervullen, zegt de HEERE van de heerscharen.", "Openb 2:20-23": "Maar Ik heb enkele weinige dingen tegen u, dat u de vrouw Izébel toelaat, die zichzelf een profetes noemt, te leren en Mijn dienstknechten te verleiden, zodat zij hoereren en afgodenoffer eten. En Ik heb haar tijd gegeven, opdat zij zich zou bekeren van haar hoererij, en zij heeft zich niet bekeerd. Zie, Ik werp haar op een bed, en hen die met haar overspel bedrijven in grote verdrukking, als zij zich niet bekeren van hun werken.", "Openb 20:1-3": "En ik zag een engel neerkomen uit de hemel, die de sleutel van het afgrond had, en een grote keten in zijn hand; En hij greep de draak, de oude slang, die de duivel is en satan, en bond hem duizend jaar; En wierp hem in het afgrond, en sloot hem daarin, en verzegelde het boven hem, opdat hij de volken niet meer verleiden zou, totdat de duizend jaar geëindigd zouden zijn. En daarna moet hij een korte tijd losgelaten worden.", "Jes 41:17-20": "De ellendigen en behoeftigen zoeken water, maar er is geen; hun tong versmacht van dorst; Ik, de HEERE, zal hen verhoren, Ik, de God van Israël, zal hen niet verlaten. Ik zal rivieren openen op de hoge plaatsen, en bronnen in het midden van de valleien; Ik zal de woestijn tot een waterpoel maken, en het dorre land tot waterbronnen. Ik zal in de woestijn de cederboom, de sittimboom, en de mirteboom, en de olieboom zetten; Ik zal in de wildernis de denneboom, de beuk, en de busboom samen plaatsen;", "Mark 13:10": "En het Evangelie moet eerst gepredikt worden onder alle volken.", "Joh 8:51": "Voorwaar, voorwaar, Ik zeg u: Als iemand Mijn woord bewaart, zal hij de dood in eeuwigheid niet zien.", "2 Kron 5:14": "En de priesters konden, vanwege die wolk, niet staan om te dienen; want de heerlijkheid van de HEERE had het huis van God vervuld.", "Luk 2:38": "En zij kwam op datzelfde moment daarbij, en dankte eveneens de Heere, en sprak over Hem tot allen die de verlossing in Jeruzalem verwachtten.", "Ps 118:18": "De HEERE heeft mij wel hard gekastijd; maar Hij heeft mij niet ter dood overgegeven.", "Matt 4:15": "Het land Zebulon en het land Nafthali, aan de weg naar de zee, over de Jordaan, Galilea van de volken;", "Hand 7:6": "En God sprak zo, dat zijn nageslacht als vreemdeling zou wonen in een vreemd land, en dat men hen tot slaaf zou maken en slecht behandelen, vierhonderd jaar.", "Ps 10:5": "Zijn wegen brengen altijd smart voort; Uw oordelen zijn een hoogte, ver van hem vandaan; al zijn tegenstanders, die blaast hij weg.", "Joh 7:24": "Oordeel niet naar het aanzien, maar oordeel een rechtvaardig oordeel.", "Spr 10:4": "Wie met een lakse hand werkt, wordt arm; maar de hand van de vlijtigen maakt rijk.", "Jes 11:11": "Want het zal gebeuren op die dag, dat de Heere voor de tweede keer Zijn hand zal aanleggen om het overblijfsel van Zijn volk terug te verwerven, dat overgebleven zal zijn van Assyrië, en van Egypte, en van Pathros, en van Morenland, en van Elam, en van Sinear, en van Hamath, en van de eilanden van de zee.", "Deut 16:20": "Gerechtigheid, gerechtigheid zult u najagen; opdat u leeft, en het land erfelijk bezit dat de HEERE, uw God, u geven zal.", "1 Tim 6:17": "Beveel de rijken in deze tegenwoordige wereld dat zij niet hoogmoedig zijn, en ook niet hun hoop stellen op de onzekerheid van de rijkdom, maar op de levende God, Die ons alle dingen rijkelijk verleent om ervan te genieten;", "Jer 5:6": "Daarom heeft een leeuw uit het woud hen verslagen, een wolf uit de wildernis zal hen verwoesten; een luipaard houdt de wacht bij hun steden; ieder die daaruit gaat, zal verscheurd worden; want hun overtredingen zijn talrijk geworden, hun afdwalingen zijn machtig veel geworden.", "Openb 11:18": "en de volken waren toornig geworden, en Uw toorn is gekomen, en de tijd van de doden, om geoordeeld te worden, en om het loon te geven aan Uw dienstknechten, de profeten, en de heiligen, en aan hen die Uw Naam vrezen, de kleinen en de groten; en om hen te verderven die de aarde verdierven.", "Rom 2:24": "Want de Naam van God wordt om u gelasterd onder de heidenen, zoals geschreven is.", "Tit 3:10": "Verwerp iemand die een ketter is, na de eerste en tweede vermaning;", "Nahum 1:7": "De HEERE is goed, Hij is een sterkte op de dag van benauwdheid, en Hij kent hen die op Hem vertrouwen.", "Hebr 3:7-10": "Daarom, zoals de Heilige Geest zegt: Heden, als u Zijn stem hoort, Verhard uw harten niet, zoals bij de verbittering, op de dag van de beproeving, in de woestijn; Waar uw vaders Mij beproefden; zij hebben Mij op de proef gesteld, en hebben Mijn werken gezien, veertig jaar lang.", "Rom 4:3-25": "Want wat zegt de Schrift? En Abraham geloofde God, en het is hem gerekend tot rechtvaardigheid. Nu wordt hem die werkt het loon niet toegerekend naar genade, maar naar schuld. Doch hem die niet werkt, maar gelooft in Hem, Die de goddeloze rechtvaardigt, wordt zijn geloof gerekend tot rechtvaardigheid.", "1 Joh 2:4": "Wie zegt: Ik ken Hem, en Zijn geboden niet bewaart, die is een leugenaar, en in hem is de waarheid niet;", "1 Kor 1:21": "Want omdat de wereld God, in de wijsheid van God, niet door de wijsheid heeft gekend, heeft het God behaagd om door de dwaasheid van de prediking zalig te maken hen die geloven;", "Jes 31:1": "Wee hun die naar Egypte om hulp aftrekken, en steunen op paarden, en vertrouwen op wagens, omdat er veel zijn, en op ruiters, omdat die zeer machtig zijn; en niet zien op de Heilige van Israël, en de HEERE niet zoeken.", "Joh 17:22": "En Ik heb hun de heerlijkheid gegeven die U Mij gegeven hebt; opdat zij één zijn, zoals Wij Eén zijn;", "Ps 15:1-5": "Een psalm van David. HEERE, wie zal verblijven in Uw tent? Wie zal wonen op de berg van Uw heiligheid? Die oprecht wandelt, en gerechtigheid doet, en die met zijn hart de waarheid spreekt; Die met zijn tong niet lastert, zijn metgezellen geen kwaad doet, en geen smaad uit over zijn naaste;", "Ex 22:28": "U mag de rechters niet vervloeken, en de leiders van uw volk mag u niet belasteren.", "Hebr 12:28": "Daarom, omdat wij een onwankelbaar Koninkrijk ontvangen, laten wij de genade vasthouden, waardoor wij God welgevallig mogen dienen, met eerbied en godsvrucht.", "2 Kor 6:2": "Want Hij zegt: In de aangename tijd heb Ik u verhoord, en in de dag van de zaligheid heb Ik u geholpen. Zie, nu is het de welaangename tijd, zie, nu is het de dag van de zaligheid!", "Spr 23:21": "Want een zuiper en een vraat zullen arm worden; en de sluimering doet iemand versleten kleren dragen.", "Mark 1:15": "en zei: De tijd is vervuld, en het Koninkrijk van God is nabijgekomen; bekeer u, en geloof het Evangelie.", "Ps 145:20": "Schin. De HEERE bewaart allen die Hem liefhebben; maar Hij verdelgt alle goddelozen.", "Rom 11:34": "Want wie heeft de zin van de Heere gekend? Of wie is Zijn raadsman geweest?", "Jes 28:16": "Daarom, zo zegt de Heere HEERE: Zie, Ik leg een grondsteen in Sion, een beproefde steen, een kostbare hoeksteen, die stevig gegrondvest is; wie gelooft, die zal niet haasten.", "1 Petr 2:22": "Die geen zonde gedaan heeft, en in Zijn mond is geen bedrog gevonden;", "Matt 12:7": "Maar als u geweten had wat dit betekent: Ik wil barmhartigheid en geen offerande, dan zou u de onschuldigen niet veroordeeld hebben.", "Jes 57:19": "Ik schep de vrucht van de lippen: vrede, vrede voor hen die ver weg zijn, en voor hen die dichtbij zijn, zegt de HEERE, en Ik zal hen genezen.", "1 Tim 3:8": "De diakenen moeten evenzo eerbaar zijn, niet met een dubbele tong, niet verzot op veel wijn, geen zoekers van vuil gewin;", "Ps 30:13": "Opdat mijn eer voor U psalmen zingt, en niet zwijgt. HEERE, mijn God! in eeuwigheid zal ik U loven.", "Ex 24:8": "Toen nam Mozes dat bloed, en sprengde het op het volk; en hij zei: Zie, dit is het bloed van het verbond, dat de HEERE met u gemaakt heeft over al die woorden.", "Joh 5:45": "Denk niet dat Ik u zal aanklagen bij de Vader; hij die u aanklaagt, is Mozes, op wie u gehoopt hebt.", "Deut 11:13": "En het zal gebeuren, als u zorgvuldig zult horen naar Mijn geboden, die Ik u heden gebied, om de HEERE, uw God, lief te hebben, en Hem te dienen, met uw hele hart en met uw hele ziel;", "Spr 19:27": "Laat af, mijn zoon, om, terwijl u de tucht hoort, af te dwalen van de woorden van de kennis.", "2 Kor 1:9": "Ja, wij hadden zelf al in onszelf het vonnis van de dood, opdat wij niet op onszelf zouden vertrouwen, maar op God, Die de doden opwekt;", "Spr 11:5": "De gerechtigheid van de oprechte maakt zijn weg recht; maar de goddeloze valt door zijn goddeloosheid.", "Ezech 20:12": "Daarbij gaf Ik hun ook Mijn sabbatten, om een teken te zijn tussen Mij en hen, opdat zij zouden weten dat Ik de HEERE ben, Die hen heiligt.", "1 Kor 15:54": "En wanneer dit vergankelijke onvergankelijkheid zal hebben aangedaan, en dit sterfelijke onsterfelijkheid zal hebben aangedaan, dan zal het woord gebeuren dat geschreven is: De dood is verslonden tot overwinning.", "Jak 1:2": "Acht het voor grote vreugde, mijn broeders, wanneer u in allerlei verzoekingen valt;", "Ps 32:1": "Een onderwijzing van David. Gelukkig is hij, wiens overtreding vergeven is, wiens zonde bedekt is.", "Joh 16:33": "Deze dingen heb Ik tot u gesproken, opdat u in Mij vrede hebt. In de wereld zult u verdrukking hebben, maar heb goede moed, Ik heb de wereld overwonnen.", "Matt 12:1-8": "In die tijd ging Jezus, op een sabbatdag, door het gezaaide land, en Zijn discipelen kregen honger, en begonnen aren te plukken en te eten. En de Farizeeën zagen dat en zeiden tegen Hem: Kijk, Uw discipelen doen wat niet geoorloofd is te doen op de sabbat. Maar Hij zei tegen hen: Hebt u niet gelezen wat David deed, toen hij honger had, en zij die bij hem waren?", "Spr 12:22": "Valse lippen zijn de HEERE een gruwel; maar wie trouw handelen, zijn Zijn welgevallen.", "Ef 2:9": "niet uit de werken, opdat niemand roemt.", "Hand 10:1": "En er was een zeker man in Cesarea, met de naam Cornelius, een hoofdman over honderd, uit de bende die de Italiaanse genoemd werd;", "Luk 11:46-52": "Maar Hij zei: Wee ook u, wetgeleerden! want u belast de mensen met lasten die zwaar zijn om te dragen, en zelf raakt u die lasten niet aan met één van uw vingers. Wee u, want u bouwt de graven van de profeten, en uw vaders hebben hen gedood. Zo getuigt u dus dat u instemt met de daden van uw vaderen; want zij hebben hen gedood, en u bouwt hun graven.", "1 Tess 5:16": "Wees blij, altijd.", "Hebr 5:11": "Over hem hebben wij veel te zeggen, en het is moeilijk uit te leggen, omdat u traag geworden bent om te horen.", "Hagg 1:13": "Toen sprak Haggai, de bode van de HEERE, in de boodschap van de HEERE, tot het volk, en hij zei: Ik ben met u, spreekt de HEERE.", "Hand 10:2": "Godvrezend en godvruchtig, met heel zijn huis, en hij gaf veel aalmoezen aan het volk, en bad voortdurend tot God.", "Jes 33:15": "Wie in gerechtigheid wandelt, en wat recht is spreekt; wie de winst van onderdrukking verwerpt; wie zijn handen uitschudt, zodat zij geen geschenken vasthouden; wie zijn oor dichtstopt, zodat hij geen bloedschuld hoort, en zijn ogen dichtdoet; zodat hij het kwade niet aanziet;", "Rom 8:1": "Er is dan nu geen veroordeling voor hen die in Christus Jezus zijn, die niet naar het vlees wandelen, maar naar de Geest.", "Rom 3:10-12": "zoals geschreven is: Er is niemand rechtvaardig, ook niet één; er is niemand die verstandig is, er is niemand die God zoekt. Allen zijn zij afgeweken, samen zijn zij onnut geworden; er is niemand die goed doet, er is zelfs niet één.", "Hebr 5:6": "Zoals Hij ook op een andere plaats zegt: U bent Priester in eeuwigheid, naar de ordening van Melchizedek.", "Matt 24:14": "En dit Evangelie van het Koninkrijk zal in de hele wereld gepredikt worden tot een getuigenis voor alle volken; en dan zal het einde komen.", "Hand 7:33": "En de Heere zei tegen hem: Doe de schoenen van uw voeten; want de plaats waarop u staat, is heilige grond.", "Ps 52:9": "Zie de man, die God niet tot Zijn Sterkte stelde, maar vertrouwde op de overvloed van het rijkdom; hij was sterk geworden door zijn beschadigen.", "1 Petr 2:12": "En houd uw levenswandel eerlijk onder de heidenen; opdat, waar zij nu kwaad van u spreken als van kwaaddoeners, zij door de goede werken die zij van u zien, God mogen verheerlijken op de dag dat Hij naar hen omziet.", "Ef 2:1": "En u heeft Hij mede levend gemaakt, terwijl u dood was door de misdaden en de zonden;", "Matt 22:44": "De Heere heeft gezegd tot mijn Heere: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gezet heb.", "Openb 7:3": "en hij zei: Breng de aarde geen schade toe, of de zee, of de bomen, totdat wij de dienstknechten van onze God verzegeld hebben aan hun voorhoofden.", "Jak 4:13-15": "Kom nu, u die zegt: Wij zullen vandaag of morgen naar die en die stad reizen, en daar een jaar doorbrengen, en handel drijven, en winst maken. U weet niet wat morgen gebeuren zal, want hoe is uw leven? Het is immers een damp, die voor een korte tijd zichtbaar is, en daarna verdwijnt. In plaats daarvan zou u moeten zeggen: Als de Heere het wil, en wij leven, zullen wij dit of dat doen.", "Ps 72:2": "Zo zal hij Uw volk richten met gerechtigheid, en Uw ellendigen met recht.", "Jes 41:10": "Vrees niet, want Ik ben met u; wees niet verbaasd, want Ik ben uw God; Ik sterk u, ook help Ik u, ook ondersteun Ik u met de rechterhand van Mijn gerechtigheid.", "Matt 21:42": "Jezus zei tegen hen: Hebt u nooit gelezen in de Schriften: De steen die de bouwers verworpen hebben, die is geworden tot een hoeksteen; dit is door de Heere gedaan, en het is wonderlijk in onze ogen?", "Luk 1:33": "En Hij zal over het huis van Jakob Koning zijn tot in eeuwigheid, en aan Zijn koninkrijk zal geen einde zijn.", "Jes 53:8": "Hij is uit de angst en uit het gericht weggenomen; en wie zal Zijn leeftijd uitspreken? Want Hij is afgesneden uit het land van de levenden; om de overtreding van Mijn volk is de plaag op Hem geweest.", "Ps 72:8-11": "En hij zal heersen van de zee tot aan de zee, en van de rivier tot aan de einden van de aarde. De inwoners van dorre plaatsen zullen voor zijn aangezicht knielen, en zijn vijanden zullen het stof lekken. De koningen van Tharsis en de eilanden zullen geschenken aanbrengen; de koningen van Scheba en Seba zullen vereringen toevoeren.", "1 Kor 15:34": "Word op de juiste manier wakker, en zondig niet. Want sommigen hebben geen kennis van God. Ik zeg dit tot uw schaamte.", "Openb 21:6": "En Hij sprak tegen mij: Het is gebeurd. Ik ben de Alfa en de Omega, het Begin en het Einde. Ik zal de dorstige geven uit de bron van het water van het leven, voor niets.", "Hebr 10:30": "Want wij kennen Hem, Die gezegd heeft: Aan Mij is de wraak, Ik zal het vergelden, zegt de Heere. En opnieuw: De Heere zal Zijn volk oordelen.", "Hand 7:41": "En zij maakten een kalf in die dagen, en brachten een offer aan de afgod, en verheugden zich in de werken van hun eigen handen.", "Hebr 12:23": "Tot de algemene vergadering en de gemeente van de eerstgeborenen, die in de hemelen opgeschreven zijn, en tot God, de Rechter over allen, en de geesten van de rechtvaardigen die volmaakt gemaakt zijn;", "2 Tim 4:8": "Verder ligt voor mij de kroon van de rechtvaardigheid klaar, die de Heere, de rechtvaardige Rechter, mij op die dag geven zal; en niet alleen mij, maar ook allen die Zijn verschijning hebben liefgehad.", "1 Tess 2:5": "Want wij hebben nooit met woorden gepluimstrijkt, zoals u weet, en ook niet met enig voorwendsel van hebzucht; God is getuige!", "Luk 22:34": "Maar Hij zei: Ik zeg u, Petrus, de haan zal vandaag niet kraaien, voordat u driemaal geloochend zult hebben dat u Mij kent.", "Jes 53:5": "Maar Hij is om onze overtredingen verwond, om onze ongerechtigheden is Hij verbrijzeld; de straf die ons de vrede aanbrengt, was op Hem, en door Zijn striemen is er voor ons genezing gekomen.", "Matt 23:13": "Maar wee u, Schriftgeleerden en Farizeeën, huichelaars! Want u sluit het Koninkrijk der hemelen voor de mensen, want u gaat er zelf niet in, en degenen die er in willen gaan, laat u niet ingaan.", "Ezech 16:14": "Daardoor ging van u een naam uit onder de heidenvolken vanwege uw schoonheid; want die was volmaakt door Mijn heerlijkheid, die Ik op u gelegd had, spreekt de Heere HEERE.", "Openb 22:7": "Zie, Ik kom haastig; zalig is hij die de woorden van de profetie van dit boek bewaart.", "Luk 12:33": "Verkoop wat u hebt, en geef aalmoezen. Maak uzelf beurzen die niet verslijten, een schat die niet afneemt, in de hemelen, waar de dief niet bijkomt en de mot niet verteert.", "2 Kor 7:4": "Ik heb veel vrijmoedigheid in het spreken tegen u, ik heb veel roem over u; ik ben vervuld met vertroosting; ik ben zeer overvloedig van blijdschap in al onze verdrukking.", "Ezech 34:2": "Mensenkind! Profeteer tegen de herders van Israël; profeteer en zeg tot hen, tot de herders: Zo zegt de Heere HEERE: Wee de herders van Israël, die zichzelf weiden! Zullen niet de herders de schapen weiden?", "Ps 118:22-24": "De steen, die de bouwlieden verworpen hadden, is tot een hoofd van de hoek geworden. Dit is van de HEERE gebeurd, en het is wonderlijk in onze ogen. Dit is de dag, die de HEERE gemaakt heeft; laten we ons daarover verheugen, en verblijd zijn.", "1 Joh 2:15": "Heb de wereld niet lief, en ook niet wat in de wereld is; als iemand de wereld liefheeft, is de liefde van de Vader niet in hem.", "Luk 15:2": "En de Farizeeën en de Schriftgeleerden mopperden en zeiden: Deze man ontvangt de zondaars, en eet met hen.", "Jes 2:5": "Kom, u huis van Jakob, en laat ons wandelen in het licht van de HEERE.", "Matt 22:1-14": "En Jezus antwoordde en sprak opnieuw in gelijkenissen tot hen, en zei: Het Koninkrijk der hemelen is gelijk aan een zeker koning, die voor zijn zoon een bruiloft bereid had; En hij zond zijn dienstknechten uit om de genode gasten naar de bruiloft te roepen; en zij wilden niet komen.", "Openb 2:7": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, hem zal Ik geven te eten van de boom des levens, die in het midden van het paradijs van God is.", "Jes 66:20": "En zij zullen al uw broeders uit alle heidenen naar de HEERE brengen als spijsoffer, op paarden, en op wagens, en op draagstoelen, en op muildieren, en op snelle lopers, naar Mijn heilige berg toe, naar Jeruzalem, zegt de HEERE, zoals de kinderen van Israël het spijsoffer in een rein vat brengen naar het huis van de HEERE.", "Ps 13:6": "Maar ik vertrouw op Uw goedertierenheid; mijn hart zal zich verheugen in Uw heil; ik zal de HEERE zingen, omdat Hij mij goedgedaan heeft.", "2 Tess 3:5": "Doch de Heere richte uw harten op de liefde van God, en op de lijdzaamheid van Christus.", "Hebr 1:7": "En tot de engelen zegt Hij wel: Die Zijn engelen maakt tot geesten, en Zi
