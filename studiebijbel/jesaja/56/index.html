l":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Zo zegt de HEERE: Bewaar het recht en doe gerechtigheid; want Mijn heil is nabij om te komen, en Mijn gerechtigheid om geopenbaard te worden.","2":"Gelukkig is de mens die dit doet, en het mensenkind dat daaraan vasthoudt; die de sabbat houdt, zodat hij die niet ontheiligt, en die zijn hand bewaart om geen enkel kwaad te doen.","3":"En de vreemdeling, die zich bij de HEERE gevoegd heeft, moet niet zeggen: De HEERE heeft mij helemaal van Zijn volk gescheiden; en de ontmande[1] moet niet zeggen: Zie, ik ben een dorre boom.","4":"Want zo zegt de HEERE van de ontmanden, die Mijn sabbatten houden, en verkiezen wat Mij behaagt, en vasthouden aan Mijn verbond;","5":"Ik zal hun ook in Mijn huis en binnen Mijn muren een plaats en een naam geven, beter dan van zonen en dan van dochters; een eeuwige naam zal Ik ieder van hen geven, die niet uitgeroeid zal worden.","6":"En de vreemdelingen, die zich bij de HEERE voegen om Hem te dienen, en om de Naam van de HEERE lief te hebben, om Hem tot knechten te zijn; ieder die de sabbat houdt, zodat hij die niet ontheiligt, en die aan Mijn verbond vasthouden;","7":"Die zal Ik ook brengen naar Mijn heilige berg, en Ik zal hen verheugen in Mijn huis van gebed; hun brandoffers en hun slachtoffers zullen aangenaam zijn op Mijn altaar; want Mijn huis zal een huis van gebed genoemd worden voor alle volken.","8":"De Heere HEERE, Die de verdrevenen van Israël bijeenbrengt, spreekt: Ik zal er bij hem nog meer bijeenbrengen, naast hen die al bij hem bijeengebracht zijn.","9":"Alle dieren van het veld, kom om te eten, ja, alle dieren in het woud!","10":"Hun wachters zijn allemaal blind, zij weten niets; zij zijn allemaal stomme honden, zij kunnen niet blaffen; zij zijn slaperig, zij liggen neer, zij hebben het sluimeren lief.","11":"En deze honden zijn sterk van begeerte, zij kunnen niet verzadigd worden, ja, het zijn herders die niets kunnen begrijpen; zij keren zich allemaal naar hun eigen weg, ieder naar zijn eigen winst, elk uit zijn eigen hoek.","12":"Kom hier, zeggen zij: ik zal wijn halen, en wij zullen ons vol drinken met sterke drank; en de dag van morgen zal zijn als deze, ja, nog groter, veel overvloediger."},"SV":{"1":"Alzo zegt de HEERE: Bewaart het recht, en doet gerechtigheid; want Mijn heil is nabij om te komen, en Mijn gerechtigheid om geopenbaard te worden.","2":"Welgelukzalig is de mens, *die* zulks doet, en des mensen kind, *dat* daaraan vasthoudt; die den sabbat houdt, zodat gij dien niet ontheiligt, en die zijn hand bewaart van enig kwaad te doen.","3":"En de vreemde, die zich tot den HEERE gevoegd heeft, spreke niet, zeggende: De HEERE heeft mij gans en al van Zijn volk gescheiden; en de gesnedene zegge niet: Ziet, ik ben een dorre boom.","4":"Want alzo zegt de HEERE van de gesnedenen, die Mijn sabbatten houden, en verkiezen hetgeen, waartoe Ik lust heb, en vasthouden aan Mijn verbond;","5":"Ik zal hen ook in Mijn huis en binnen Mijn muren een plaats en een naam geven, beter dan der zonen en dan der dochteren; een eeuwigen naam zal Ik een ieder van hen geven, die niet uitgeroeid zal worden.","6":"En de vreemden, die zich tot den HEERE voegen, om Hem te dienen, en om den Naam des HEEREN lief te hebben, om Hem tot knechten te zijn; al wie den sabbat houdt, dat hij dien niet ontheilige, en die aan Mijn verbond vasthouden;","7":"Die zal Ik ook brengen tot Mijn heiligen berg, en Ik zal hen verheugen in Mijn bedehuis; hun brandoffers en hun slachtoffers zullen aangenaam wezen op Mijn altaar; want Mijn huis zal een bedehuis genoemd worden voor alle volken.","8":"De Heere HEERE, Die de verdrevenen van Israël vergadert, spreekt: Ik zal tot hem nog meer vergaderen, nevens hen, die tot hem vergaderd zijn.","9":"Al gij gedierten des velds, komt om te eten, *ja*, al gij gedierten in het woud!","10":"Hun wachters zijn allen blind, zij weten niet; zij allen zijn stomme honden, zij kunnen niet bassen; zij zijn slaperig, zij liggen neder, zij hebben het sluimeren lief.","11":"En deze honden zijn sterk van begeerte, zij kunnen niet verzadigd worden, ja, het zijn herders, die niet verstaan kunnen; zij allen keren zich naar hun weg, elkeen naar zijn gewin, *elk* uit zijn einde.","12":"Komt herwaarts, *zeggen* *zij*: ik zal wijn halen, en wij zullen sterken drank zuipen; en de dag van morgen zal zijn als deze, *ja*, groter, veel treffelijker."},"KJV":{"1":"Thus saith the LORD, Keep ye judgment, and do justice: for my salvation *is* near to come, and my righteousness to be revealed.","2":"Blessed *is* the man *that* doeth this, and the son of man *that* layeth hold on it; that keepeth the sabbath from polluting it, and keepeth his hand from doing any evil.","3":"Neither let the son of the stranger, that hath joined himself to the LORD, speak, saying, The LORD hath utterly separated me from his people: neither let the eunuch say, Behold, I *am* a dry tree.","4":"For thus saith the LORD unto the eunuchs that keep my sabbaths, and choose *the things* that please me, and take hold of my covenant;","5":"Even unto them will I give in mine house and within my walls a place and a name better than of sons and of daughters: I will give them an everlasting name, that shall not be cut off.","6":"Also the sons of the stranger, that join themselves to the LORD, to serve him, and to love the name of the LORD, to be his servants, every one that keepeth the sabbath from polluting it, and taketh hold of my covenant;","7":"Even them will I bring to my holy mountain, and make them joyful in my house of prayer: their burnt offerings and their sacrifices *shall be* accepted upon mine altar; for mine house shall be called an house of prayer for all people.","8":"The Lord GOD which gathereth the outcasts of Israel saith, Yet will I gather *others* to him, beside those that are gathered","9":"All ye beasts of the field, come to devour, *yea*, all ye beasts in the forest.","10":"His watchmen *are* blind: they are all ignorant, they *are* all dumb dogs, they cannot bark; sleeping, lying down, loving to slumber.","11":"Yea, *they are* greedy dogs *which* can never have enough, and they *are* shepherds *that* cannot understand: they all look to their own way, every one for his gain, from his quarter.","12":"Come ye, *say they*, I will fetch wine, and we will fill ourselves with strong drink; and to morrow shall be as this day, *and* much more abundant."}},"tsk":{"1":[{"kopje":"Bewaar","refs":["Jes 1:16-19","Jes 26:7","Jes 26:8","Jes 55:7","Ps 24:4-6","Ps 50:23","Jer 7:3-11","Mal 4:4","Matt 3:2","Joh 7:17"]},{"kopje":"want","refs":["Jes 46:13","Jes 51:5","Ps 85:10","Matt 3:2","Matt 4:17","Mark 1:15","Luk 3:3-9","Rom 1:17","Rom 10:6-10","Rom 13:11-14"]}],"2":[{"kopje":"Gelukkig","refs":["Ps 1:1-3","Ps 15:1-5","Ps 106:3","Ps 112:1","Ps 119:1-5","Ps 128:1","Luk 11:28","Luk 12:43","Joh 13:17","Openb 22:14"]},{"kopje":"die vasthoudt","refs":["Jes 56:4","Spr 4:13","Pred 7:18"]},{"kopje":"die houdt","refs":["Jes 58:13","Ex 31:13-16","Lev 19:30","Neh 13:17","Jer 17:21","Jer 17:22","Ezech 20:12","Ezech 20:20"]},{"kopje":"zijn hand bewaart","refs":["Ps 34:15","Ps 37:27","Ps 119:101","Spr 4:27","Spr 14:16","Spr 16:6","Spr 16:17","Rom 12:9"]}],"3":[{"kopje":"de vreemdeling","refs":["Num 18:4","Num 18:7","Deut 23:1-3","Zach 8:20-23","Matt 8:10","Matt 8:11","Hand 8:27","Hand 10:1","Hand 10:2","Hand 10:34","Hand 13:47","Hand 13:48","Hand 17:4","Hand 18:7","Rom 2:10","Rom 2:11","Rom 15:9-12","Rom 15:16","Ef 2:12","Ef 2:22","1 Petr 1:1"]},{"kopje":"gevoegd","refs":["Jer 50:5","Zef 2:11","1 Kor 6:17"]},{"kopje":"De HEERE heeft","refs":["Matt 15:26","Matt 15:27","Luk 7:6-8"]},{"k ment,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> <span class=\"wl wl-kjv\" data-code=\"H6666\">justice:</span> for my <span class=\"wl wl-kjv\" data-code=\"H3444\">salvation</span> is <span class=\"wl wl-kjv\" data-code=\"H7138\">near</span> to <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> and my <span class=\"wl wl-kjv\" data-code=\"H6666\">righteousness</span> to be revealed.","2":"<span class=\"wl wl-kjv\" data-code=\"H835\">Blessed</span> is the <span class=\"wl wl-kjv\" data-code=\"H582\">man</span> that <span class=\"wl wl-kjv\" data-code=\"H6213\">doeth</span> this, and the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> that layeth <span class=\"wl wl-kjv\" data-code=\"H2388\">hold</span> on it; that <span class=\"wl wl-kjv\" data-code=\"H8104\">keepeth</span> the <span class=\"wl wl-kjv\" data-code=\"H7676\">sabbath</span> from <span class=\"wl wl-kjv\" data-code=\"H2490\">polluting</span> it, and <span class=\"wl wl-kjv\" data-code=\"H8104\">keepeth</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> from <span class=\"wl wl-kjv\" data-code=\"H6213\">doing</span> any evil.","3":"Neither let the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of the <span class=\"wl wl-kjv\" data-code=\"H5236\">stranger,</span> that hath <span class=\"wl wl-kjv\" data-code=\"H3867\">joined</span> himself to the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">speak,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H914\">utterly</span> <span class=\"wl wl-kjv\" data-code=\"H914\">separated</span> me from his <span class=\"wl wl-kjv\" data-code=\"H5971\">people:</span> neither let the <span class=\"wl wl-kjv\" data-code=\"H5631\">eunuch</span> <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Behold, I am a <span class=\"wl wl-kjv\" data-code=\"H3002\">dry</span> tree.","4":"For thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5631\">eunuchs</span> that <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> my <span class=\"wl wl-kjv\" data-code=\"H7676\">sabbaths,</span> and <span class=\"wl wl-kjv\" data-code=\"H977\">choose</span> the things that <span class=\"wl wl-kjv\" data-code=\"H2654\">please</span> me, and take <span class=\"wl wl-kjv\" data-code=\"H2388\">hold</span> of my covenant;","5":"Even unto them will I <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> in mine <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> and within my <span class=\"wl wl-kjv\" data-code=\"H2346\">walls</span> a <span class=\"wl wl-kjv\" data-code=\"H3027\">place</span> and a <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">better</span> than of <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> and of <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters:</span> I will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> them an <span class=\"wl wl-kjv\" data-code=\"H5769\">everlasting</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> that shall not be cut off.","6":"Also the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of the <span class=\"wl wl-kjv\" data-code=\"H5236\">stranger,</span> that <span class=\"wl wl-kjv\" data-code=\"H3867\">join</span> themselves to the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> to <span class=\"wl wl-kjv\" data-code=\"H8334\">serve</span> him, and to <span class=\"wl wl-kjv\" data-code=\"H157\">love</span> the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> to be his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> every one that <span class=\"wl wl-kjv\" data-code=\"H8104\">keepeth</span> the <span class=\"wl wl-kjv\" data-code=\"H7676\">sabbath</span> from <span class=\"wl wl-kjv\" data-code=\"H2490\">polluting</span> it, and taketh <span class=\"wl wl-kjv\" data-code=\"H2388\">hold</span> of my covenant;","7":"Even them will I <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> to my <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain,</span> and make them <span class=\"wl wl-kjv\" data-code=\"H8055\">joyful</span> in my <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H8605\">prayer:</span> their burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offerings</span> and their <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifices</span> shall be <span class=\"wl wl-kjv\" data-code=\"H7522\">accepted</span> upon mine <span class=\"wl wl-kjv\" data-code=\"H4196\">altar;</span> for mine <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> shall be <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> an <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H8605\">prayer</span> for all people.","8":"The <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD</span> which <span class=\"wl wl-kjv\" data-code=\"H6908\">gathereth</span> the <span class=\"wl wl-kjv\" data-code=\"H1760\">outcasts</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith,</span> Yet will I <span class=\"wl wl-kjv\" data-code=\"H6908\">gather</span> others to him, beside those that are gathered","9":"All ye <span class=\"wl wl-kjv\" data-code=\"H2416\">beasts</span> of the <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> <span class=\"wl wl-kjv\" data-code=\"H857\">come</span> to <span class=\"wl wl-kjv\" data-code=\"H398\">devour,</span> yea, all ye <span class=\"wl wl-kjv\" data-code=\"H2416\">beasts</span> in the forest.","10":"His <span class=\"wl wl-kjv\" data-code=\"H6822\">watchmen</span> are <span class=\"wl wl-kjv\" data-code=\"H5787\">blind:</span> they are all <span class=\"wl wl-kjv\" data-code=\"H3045\">ignorant,</span> they are all <span class=\"wl wl-kjv\" data-code=\"H483\">dumb</span> <span class=\"wl wl-kjv\" data-code=\"H3611\">dogs,</span> they <span class=\"wl wl-kjv\" data-code=\"H3201\">cannot</span> <span class=\"wl wl-kjv\" data-code=\"H5024\">bark;</span> <span class=\"wl wl-kjv\" data-code=\"H1957\">sleeping,</span> lying <span class=\"wl wl-kjv\" data-code=\"H7901\">down,</span> <span class=\"wl wl-kjv\" data-code=\"H157\">loving</span> to slumber.","11":"Yea, they are <span class=\"wl wl-kjv\" data-code=\"H5794\">greedy</span> <span class=\"wl wl-kjv\" data-code=\"H3611\">dogs</span> which <span class=\"wl wl-kjv\" data-code=\"H3045\">can</span> never <span class=\"wl wl-kjv\" data-code=\"H3045\">have</span> <span class=\"wl wl-kjv\" data-code=\"H7654\">enough,</span> and they are <span class=\"wl wl-kjv\" data-code=\"H7462\">shepherds</span> that cannot <span class=\"wl wl-kjv\" data-code=\"H995\">understand:</span> they all <span class=\"wl wl-kjv\" data-code=\"H6437\">look</span> to their own <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> for his <span class=\"wl wl-kjv\" data-code=\"H1215\">gain,</span> from his quarter.","12":"<span class=\"wl wl-kjv\" data-code=\"H857\">Come</span> ye, say they, I will <span class=\"wl wl-kjv\" data-code=\"H3947\">fetch</span> <span class=\"wl wl-kjv\" data-code=\"H3196\">wine,</span> and we will <span class=\"wl wl-kjv\" data-code=\"H5433\">fill</span> ourselves with strong <span class=\"wl wl-kjv\" data-code=\"H7941\">drink;</span> and to <span class=\"wl wl-kjv\" data-code=\"H4279\">morrow</span> shall be as this <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> and <span class=\"wl wl-kjv\" data-code=\"H3966\">much</span> <span class=\"wl wl-kjv\" data-code=\"H3499\">more</span> abundant."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"het recht . . . gerechtigheid","tekst":"Onder den naam van recht en gerechtigheid vervat Hij alles, wat wij God en onzen naaste schuldig zijn."},{"catchword":"want","tekst":"Hiermede komt overeen het beginsel der predikatiën van Christus en van Johannes den Doper, zeggende: Bekeert u, want het koninkrijk der hemelen is nabij gekomen; Mat 3:2 , en Mat 4:17 ."},{"catchword":"Mijn heil","tekst":"Te weten dat heil, hetwelk Christus, de Heiland der wereld, mij brengen zal. Of, indien dit de woorden van Christus zijn, zo is dit de zin: Mijn heil, waardoor Ik mijne uitverkorenen zal behouden of zalig maken."},{"catchword":"Mijn gerechtigheid","tekst":"De gerechtigheid des Heeren is in het Evangelie geopenbaard; Rom 1:17 ."}],"2":[{"catchword":"die zulks doet,","tekst":"Die het recht en de gerechtigheid bewaart, vs.1."},{"catchword":"den sabbat houdt,","tekst":"Onder het woord sabbat moet men den gansen godsdienst verstaan, die inzonderheid op den sabbat moet geoefend worden, nemende een deel voor het geheel. Zie vs.7."}],"3":[{"catchword":"de vreemde,","tekst":"Hebreeuws, de zoon, of het kind van den vreemde; dat is, de vreemdelingen, gelijk vs.6, en Isa 60:10 ."},{"catchword":"spreke niet,","tekst":"Christus heeft het onderscheid tussen de volken en natiën teniet gedaan; voor Hem geldt nu niet langer het onderscheid tussen Jood en heiden, tussen heer en knecht; Gal 3:28 ."},{"catchword":"ik ben een dorre boom","tekst":"Dat is, ik ben een dorren boom gelijk; want gelijk die geen vruchten heeft, alzo heb ik gene kinderen."}],"4":[{"catchword":"van de gesnedenen,","tekst":"Of, tot de gesnedenen."}],"5":[{"catchword":"hun ook","tekst":"Te weten die vreemden en gesnedenen van wie vs.3,4 gesproken is."},{"catchword":"in Mijn huis","tekst":"Dat is, in de Christelijke gemeente."},{"catchword":"binnen Mijn muren","tekst":"Te weten binnen de geestelijke stad Jeruzalem, dat is, in mijne kerk."},{"catchword":"een plaats","tekst":"Of, ruimte, alzo ook Isa 57:8 . Hebreeuws, ene hand."},{"catchword":"beter dan der zonen","tekst":"Of, die beter zijn dan, enz. wat is dat voor een naam? Dat zij kinderen Gods heten zullen; Joh 1:12 ; 1Jo 3:1 , welk een veel voortreffelijker naam is dan de naam van zoon of dochter, die men vanwege de vleselijke geboorte heeft."},{"catchword":"een ieder van hen geven,","tekst":"Hebreeuws, hem."}],"6":[{"catchword":"de vreemden,","tekst":"Zie boven vs.3."},{"catchword":"al wie den sabbat houdt,","tekst":"Zie vs.2."}],"7":[{"catchword":"tot Mijn heiligen berg,","tekst":"Hebreeuws, tot den berg mijner heiligheid; dat is, tot mijne kerk, tot de verzameling mijner uitverkorenen; gelijk Isa 2:2 ."},{"catchword":"in Mijn bedehuis;","tekst":"Hebreeuws, in het huis mijns gebeds; dat is, in den tempel, die geordineerd is tot een huis, waarin men mij aanbidt, en voorts de kerk van God in het algemeen."},{"catchword":"brandoffers","tekst":"Versta hier, voornamelijk, [naar de manier van spreken van het Oude Testament] door de brandoffers en slachtoffers, de dankzeggingen en den redelijken godsdienst, en de vrijwillige overgevingen om God te gehoorzamen en te dienen. Die zijn de geestelijke offeranden der gelovigen in het Nieuwe Testament, waarvan het gebed het voornaamste is. Vergelijk hiermede Mal 1:11 ; Rom 12:1 ; Heb 13:15 ."},{"catchword":"op Mijn altaar;","tekst":"Dat is, vanwege den Middelaar Jezus Christus, die door het altaar werd afgebeeld. Zie Heb 3:10 ."},{"catchword":"genoemd worden","tekst":"En het behoorde ook zodanig inderdaad te zijn."},{"catchword":"voor alle volken","tekst":"Niet voor de Joden alleen, gelijk in het Oude Testament; maar de gelovige heidenen zullen, zowel als de gelovige Joden, God aanroepen in geest en waarheid, in de Christelijke gemeente, die door den tempel is afgebeeld geworden."}],"8":[{"catchword":"Israël","tekst":"Dat is, van het volk Israël."},{"catchword":"tot Hem","tekst":"Te weten tot Christus. Anders: tot hetzelve, te weten volk van Israël, of bedehuis, in mijne gemeente, en alzo in het einde van vs.8."},{"catchword":"nevens diegenen,","tekst":"Of tot die, of behalve die"}],"9":[{"catchword":"Al","tekst":"Hier beginnen verscheidene overzetters Isa 57 ."},{"catchword":"gij gedierten","tekst":"Door het gedierte van het veld moet men hier verstaan al de wrede tirannen en vervolgers van het Joodse volk. Dezen roept God hier tezamen tegen hetzelve, opdat de bozen en de huichelaars door hen zouden uitgeroeid worden."}],"10":[{"catchword":"Hun","tekst":"Hebreeuws, zijne; te weten van het volk."},{"catchword":"wachters","tekst":"Te weten de priesters en ook de regenten van het volk; zie Jer 6:13 , en Jer 8:10 ; Eze 3:17 ."},{"catchword":"blind,","tekst":"Dat is, onwetend, onervaren in mijne wetten."},{"catchword":"stomme honden,","tekst":"Dat is, zij zijn den stommen honden gelijk. Zij straffen de zonden van het volk niet en zij waarschuwen het niet voor den toorn Gods, vrezende ongunst bij hetzelve te behalen."}],"11":[{"catchword":"zijn sterk","tekst":"Hebreeuws, sterk van ziel; van begeerte, van lust, van appetijt, of gulzig, of gierig en onverzadelijk van geld en goed. Zie de aantekening Job 39:1 . Anders: sterk van lijf."},{"catchword":"zij kunnen","tekst":"Of, zij weten niet zat te worden, of zij weten niet van verzadigd te worden."},{"catchword":"naar zijn gewin,","tekst":"Of naar zijne gierigheid."},{"catchword":"elk","tekst":"Dat is, van het ene einde tot het andere. Anders: [elk] in zijn kwartier. Anders: uit de voornaamste derzelve; alsof hij zeide: Niet alleen de geringsten onder de priesters, maar ook de hoogsten en voornaamsten. Anders: uit zijne [te weten van het volk] voornaamsten; dan zou dit de mening zijn: niet uit de armen, maar uit de voornaamste, rij // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

document.addEventListener('click', e => {

  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [

     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;

    if (b.modus === 'genummerd') {

      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`

    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';

    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };

    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}

}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
