l":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Zie, een koning zal regeren in gerechtigheid, en de vorsten zullen heersen naar recht.","2":"En *die* man zal zijn als een schuilplaats tegen de wind, en een schuilplaats tegen de storm, als waterbeken in een dorre plaats, als de schaduw van een zware rotssteen in een dorstig land.","3":"En de ogen van hen die zien, zullen niet terugzien, en de oren van hen die horen, zullen opmerken.","4":"En het hart van de onbedachtzamen zal de kennis verstaan, en de tong van de stamelende zal vaardig zijn, om duidelijk te spreken.","5":"De dwaas zal niet meer milddadig genoemd worden, en de gierige zal niet meer mild geheten worden.","6":"Want een dwaas spreekt dwaasheid, en zijn hart doet ongerechtigheid, om huichelarij te plegen, en om dwaling te spreken tegen de HEERE, om de ziel van de hongerige leeg te laten, en de dorstige drank te doen ontbreken.","7":"En het hele gereedschap van een gierigaard is kwaad; hij bedenkt schandelijke plannen, om de ellendigen te gronde te richten met valse woorden, ook als de arme spreekt wat recht is.","8":"Maar een milddadige bedenkt milddadige dingen, en staat op door milddadige dingen.","9":"Staat op, u geruste vrouwen, hoor mijn stem; u dochters, die zo zeker bent, neem mijn woorden ter oor.","10":"*Vele* dagen over het jaar zult u beroerd zijn, u *dochters*, die zo zeker bent, want de wijnoogst zal voorbij zijn, er zal geen inzameling komen.","11":"Beeft, u geruste *vrouwen*; wees beroerd, *dochters*, die zo zeker bent; trek u uit, en ontbloot u, en gord *zakken* om uw middel.","12":"Men zal rouwklagen over de borsten, over de gewenste akkers, over de vruchtbare wijnstokken.","13":"Op het land van mijn volk zal de doorn *en* de distel opgaan; ja, op alle vreugdehuizen, *in* de vrolijk huppelende stad.","14":"Want het paleis zal verlaten zijn, het gewoel van de stad zal ophouden; Ofel en de wachttorens zullen tot spelonken zijn, tot in eeuwigheid, een vreugde van de woudezels, een weide voor de kudden.","15":"Totdat over ons de Geest uit de hoogte uitgegoten wordt; dan zal de woestijn tot een vruchtbaar veld worden, en het vruchtbare veld zal voor een woud gerekend worden.","16":"En het recht zal in de woestijn wonen, en de gerechtigheid zal op het vruchtbare veld verblijven.","17":"En het werk van de gerechtigheid zal vrede zijn; en de uitwerking van de gerechtigheid zal rust en zekerheid zijn, tot in eeuwigheid.","18":"En mijn volk zal in een woonplaats van vrede wonen, en in welverzekerde woningen, en in stille geruste plaatsen.","19":"Maar het zal hagelen, waar men afgaat in het woud, en de stad zal laag worden in de laagte.","20":"Gelukkig bent u, die aan alle wateren zaait; u, die de voet van het osse en van de ezel daarheen laat gaan!"},"SV":{"1":"Ziet, een koning zal regeren in gerechtigheid, en de vorsten zullen heersen naar recht.","2":"En *die* man zal zijn als een verberging tegen den wind, en een schuilplaats tegen den vloed, als waterbeken in een dorre plaats, als de schaduw van een zwaren rotssteen in een dorstig land.","3":"En de ogen dergenen, die zien, zullen niet terugzien, en de oren dergenen, die horen, zullen opmerken.","4":"En het hart der onbedachtzamen zal de wetenschap verstaan, en de tong der stamelenden zal vaardig zijn, om bescheidenlijk te spreken.","5":"De dwaas zal niet meer genoemd worden milddadig, en de gierige zal niet *meer* mild geheten worden.","6":"Want een dwaas spreekt dwaasheid, en zijn hart doet ongerechtigheid, om huichelarij te plegen, en om dwaling te spreken tegen den HEERE, om de ziel des hongerigen ledig te laten, en den dorstige drank te doen ontbreken.","7":"En eens gierigaards ganse gereedschap is kwaad; hij beraadslaagt schandelijke verdichtselen, om de ellendigen te bederven met valse redenen, en het recht, als de arme spreekt.","8":"Maar een milddadige beraadslaagt milddadigheden, en staat op milddadigheden.","9":"Staat op, gij geruste vrouwen, hoort mijn stem; gij dochters, die zo zeker zijt, neemt mijn redenen ter ore.","10":"*Vele* dagen over het jaar zult gij beroerd zijn, gij *dochters*, die zo zeker zijt, want de wijnoogst zal uit zijn, er zal geen inzameling komen.","11":"Beeft, gij geruste *vrouwen*; weest beroerd, *dochters*, die zo zeker zijt; trekt u uit, en ontbloot u, en gordt *zakken* om uw lendenen.","12":"Men zal rouwklagen over de borsten, over de gewenste akkers, over de vruchtbare wijnstokken.","13":"Op het land mijns volks zal de doorn *en* de distel opgaan; ja, op alle vreugdehuizen, *in* de vrolijk huppelende stad.","14":"Want het paleis zal verlaten zijn, het gewoel der stad zal ophouden; Ofel en de wachttorens zullen tot spelonken zijn, tot in der eeuwigheid, een vreugde der woudezelen, een weide der kudden.","15":"Totdat over ons uitgegoten worde de Geest uit de hoogte; dan zal de woestijn tot een vruchtbaar veld worden, en het vruchtbare veld zal voor een woud geacht worden.","16":"En het recht zal in de woestijn wonen, en de gerechtigheid zal op het vruchtbare veld verblijven.","17":"En het werk der gerechtigheid zal vrede zijn; en de werking der gerechtigheid zal zijn gerustheid en zekerheid tot in eeuwigheid.","18":"En mijn volk zal in een woonplaats des vredes wonen, en in welverzekerde woningen, en in stille geruste plaatsen.","19":"Maar het zal hagelen, waar men afgaat in het woud, en de stad zal laag worden in de laagte.","20":"Welgelukzalig zijt gijlieden, die aan alle wateren zaait; gij, die den voet des osses en des ezels *derwaarts* henenzendt!"},"KJV":{"1":"Behold, a king shall reign in righteousness, and princes shall rule in judgment.","2":"And a man shall be as an hiding place from the wind, and a covert from the tempest; as rivers of water in a dry place, as the shadow of a great rock in a weary land.","3":"And the eyes of them that see shall not be dim, and the ears of them that hear shall hearken.","4":"The heart also of the rash shall understand knowledge, and the tongue of the stammerers shall be ready to speak plainly.","5":"The vile person shall be no more called liberal, nor the churl said *to be* bountiful.","6":"For the vile person will speak villany, and his heart will work iniquity, to practise hypocrisy, and to utter error against the LORD, to make empty the soul of the hungry, and he will cause the drink of the thirsty to fail.","7":"The instruments also of the churl *are* evil: he deviseth wicked devices to destroy the poor with lying words, even when the needy speaketh right.","8":"But the liberal deviseth liberal things; and by liberal things shall he stand.","9":"Rise up, ye women that are at ease; hear my voice, ye careless daughters; give ear unto my speech.","10":"Many days and years shall ye be troubled, ye careless women: for the vintage shall fail, the gathering shall not come.","11":"Tremble, ye women that are at ease; be troubled, ye careless ones: strip you, and make you bare, and gird *sackcloth* upon *your* loins.","12":"They shall lament for the teats, for the pleasant fields, for the fruitful vine.","13":"Upon the land of my people shall come up thorns *and* briers; yea, upon all the houses of joy *in* the joyous city:","14":"Because the palaces shall be forsaken; the multitude of the city shall be left; the forts and towers shall be for dens for ever, a joy of wild asses, a pasture of flocks;","15":"Until the spirit be poured upon us from on high, and the wilderness be a fruitful field, and the fruitful field be counted for a forest.","16":"Then judgment shall dwell in the wilderness, and righteousness remain in the fruitful field.","17":"And the work of righteousness shall be peace; and the effect of righteousness quietness and assurance for ever.","18":"And my people shall dwell in a peaceable habitation, and in sure dwellings, and in quiet resting places;","19":"When it shall hail, coming down on the forest; and the city shall be low in a low place.","20":"Blessed *are* ye that sow beside all waters, that send forth *thither* the feet of the ox and the ass."}},"tsk":{"1":[{"kopje":"koning","refs":["Jes 9:5","Jes 9:6","Jes 40:1-5","2 Sam 23:3","2 Kron 31:20","2 Kron 31:21","Ps 45:2","Ps 45:7","Ps 45:8","Ps 72:1","Ps 72:2","Ps 99:4","Jer 23:5","Jer 23:6","Jer 33:15","Hos 3:5","Zach 9:9","Rom 5:21","Hebr 1:8","Hebr 1:9","Openb 19:11"]},{"kopje":"vorsten","refs":["Jes 28:6","Openb 17:14"]}],"2":[{"kopje":"die man","refs":["Jes 7:14","Jes 8:10-14","Jes 9:5","Ps 146:3-5","Micha 5:3","Micha 5:4","Zach 13:7","1 Tim 3:16"]},{"kopje":"schuilplaats","refs":["Jes 32:18","Jes 32:19","Jes 4:5","Jes 4:6","Jes 25:4","Jes 26:20","Jes 26:21","Jes 28:17","Jes 44:3","Ps 32:7","Ps 143:9","Matt 7:24-27"]},{"kopje":"waterbeken","refs":["Jes 35:6","Jes 35:7","Jes 41:18","Jes 43:20","Joh 7:37","Openb 22:1"]},{"kopje":"rotssteen","refs":["Ps 31:3","Ps 31:4","Ps 63:2"]}],"4":[{"kopje":"hart","refs":["Jes 29:24","Neh 8:9-13","Matt 11:25","Matt 16:17","Hand 6:7","Hand 26:9-11","Gal 1:23"]},{"kopje":"de tong","refs":["Ex 4:11","Hoogl 7:9","Luk 21:14","Luk 21:15","Hand 2:4-12","Hand 4:13"]}],"5":[{"kopje":"dwaas","refs":["Jes 5:20","Ps 15:4","Mal 3:18"]},{"kopje":"niet meer","refs":["1 Sam 25:3-8","Spr 23:6-8"]}],"6":[{"kopje":"een dwaas","refs":["1 Sam 24:14","1 Sam 25:10","1 Sam 25:11","Jer 13:23","Matt 12:34-36","Matt 15:19","Jak 3:5","Jak 3:6"]},{"kopje":"en zijn hart","refs":["Ps 58:2","Ps 58:3","Hos 7:6","Hos 7:7","Micha 2:1","Micha 2:2","Hand 5:3","Hand 5:4","Hand 8:21","Hand 8:22","Jak 1:14","Jak 1:15"]},{"kopje":"leeg","refs":["Job 22:5-9","Job 24:2-16","Spr 11:24-26","Amos 2:6","Amos 2:7","Amos 8:6","Micha 3:1-3","Matt 23:14","Jak 1:27"]}],"7":[{"kopje":"gereedschap","refs": ss=\"wl wl-kjv\" data-code=\"H3596\">churl</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to be bountiful.","6":"For the vile <span class=\"wl wl-kjv\" data-code=\"H5036\">person</span> will <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> <span class=\"wl wl-kjv\" data-code=\"H5039\">villany,</span> and his <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> will <span class=\"wl wl-kjv\" data-code=\"H6213\">work</span> <span class=\"wl wl-kjv\" data-code=\"H205\">iniquity,</span> to <span class=\"wl wl-kjv\" data-code=\"H6213\">practise</span> <span class=\"wl wl-kjv\" data-code=\"H2612\">hypocrisy,</span> and to <span class=\"wl wl-kjv\" data-code=\"H1696\">utter</span> <span class=\"wl wl-kjv\" data-code=\"H8442\">error</span> against the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> to make <span class=\"wl wl-kjv\" data-code=\"H7324\">empty</span> the <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> of the <span class=\"wl wl-kjv\" data-code=\"H7457\">hungry,</span> and he will cause the <span class=\"wl wl-kjv\" data-code=\"H4945\">drink</span> of the <span class=\"wl wl-kjv\" data-code=\"H6771\">thirsty</span> to fail.","7":"The <span class=\"wl wl-kjv\" data-code=\"H3627\">instruments</span> also of the <span class=\"wl wl-kjv\" data-code=\"H3596\">churl</span> are <span class=\"wl wl-kjv\" data-code=\"H7451\">evil:</span> he <span class=\"wl wl-kjv\" data-code=\"H3289\">deviseth</span> wicked <span class=\"wl wl-kjv\" data-code=\"H2154\">devices</span> to <span class=\"wl wl-kjv\" data-code=\"H2254\">destroy</span> the <span class=\"wl wl-kjv\" data-code=\"H6041\">poor</span> with <span class=\"wl wl-kjv\" data-code=\"H8267\">lying</span> <span class=\"wl wl-kjv\" data-code=\"H561\">words,</span> even when the <span class=\"wl wl-kjv\" data-code=\"H34\">needy</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">speaketh</span> right.","8":"But the <span class=\"wl wl-kjv\" data-code=\"H5081\">liberal</span> <span class=\"wl wl-kjv\" data-code=\"H3289\">deviseth</span> liberal <span class=\"wl wl-kjv\" data-code=\"H5081\">things;</span> and by liberal <span class=\"wl wl-kjv\" data-code=\"H5081\">things</span> shall he stand.","9":"Rise <span class=\"wl wl-kjv\" data-code=\"H6965\">up,</span> ye <span class=\"wl wl-kjv\" data-code=\"H802\">women</span> that are at <span class=\"wl wl-kjv\" data-code=\"H7600\">ease;</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> my <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> ye <span class=\"wl wl-kjv\" data-code=\"H982\">careless</span> <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters;</span> give <span class=\"wl wl-kjv\" data-code=\"H238\">ear</span> unto my speech.","10":"Many <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> and <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> shall ye be <span class=\"wl wl-kjv\" data-code=\"H7264\">troubled,</span> ye careless <span class=\"wl wl-kjv\" data-code=\"H982\">women:</span> for the <span class=\"wl wl-kjv\" data-code=\"H1210\">vintage</span> shall <span class=\"wl wl-kjv\" data-code=\"H3615\">fail,</span> the <span class=\"wl wl-kjv\" data-code=\"H625\">gathering</span> shall not come.","11":"<span class=\"wl wl-kjv\" data-code=\"H2729\">Tremble,</span> ye women that are at <span class=\"wl wl-kjv\" data-code=\"H7600\">ease;</span> be <span class=\"wl wl-kjv\" data-code=\"H7264\">troubled,</span> ye careless <span class=\"wl wl-kjv\" data-code=\"H982\">ones:</span> <span class=\"wl wl-kjv\" data-code=\"H6584\">strip</span> you, and make you <span class=\"wl wl-kjv\" data-code=\"H6209\">bare,</span> and <span class=\"wl wl-kjv\" data-code=\"H2290\">gird</span> sackcloth upon your loins.","12":"They shall <span class=\"wl wl-kjv\" data-code=\"H5594\">lament</span> for the <span class=\"wl wl-kjv\" data-code=\"H7699\">teats,</span> for the <span class=\"wl wl-kjv\" data-code=\"H2531\">pleasant</span> <span class=\"wl wl-kjv\" data-code=\"H7704\">fields,</span> for the <span class=\"wl wl-kjv\" data-code=\"H6509\">fruitful</span> vine.","13":"Upon the <span class=\"wl wl-kjv\" data-code=\"H127\">land</span> of my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> shall come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> <span class=\"wl wl-kjv\" data-code=\"H6975\">thorns</span> and <span class=\"wl wl-kjv\" data-code=\"H8068\">briers;</span> yea, upon all the <span class=\"wl wl-kjv\" data-code=\"H1004\">houses</span> of <span class=\"wl wl-kjv\" data-code=\"H4885\">joy</span> in the <span class=\"wl wl-kjv\" data-code=\"H5947\">joyous</span> city:","14":"Because the <span class=\"wl wl-kjv\" data-code=\"H759\">palaces</span> shall be <span class=\"wl wl-kjv\" data-code=\"H5203\">forsaken;</span> the <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> shall be <span class=\"wl wl-kjv\" data-code=\"H5800\">left;</span> the <span class=\"wl wl-kjv\" data-code=\"H6076\">forts</span> and <span class=\"wl wl-kjv\" data-code=\"H975\">towers</span> shall be for <span class=\"wl wl-kjv\" data-code=\"H4631\">dens</span> <span class=\"wl wl-kjv\" data-code=\"H5704\">for</span> <span class=\"wl wl-kjv\" data-code=\"H5769\">ever,</span> a <span class=\"wl wl-kjv\" data-code=\"H4885\">joy</span> of wild <span class=\"wl wl-kjv\" data-code=\"H6501\">asses,</span> a <span class=\"wl wl-kjv\" data-code=\"H4829\">pasture</span> of flocks;","15":"Until the <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> be <span class=\"wl wl-kjv\" data-code=\"H6168\">poured</span> upon us from on <span class=\"wl wl-kjv\" data-code=\"H4791\">high,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> be a fruitful <span class=\"wl wl-kjv\" data-code=\"H3759\">field,</span> and the fruitful <span class=\"wl wl-kjv\" data-code=\"H3759\">field</span> be <span class=\"wl wl-kjv\" data-code=\"H2803\">counted</span> for a forest.","16":"Then <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment</span> shall <span class=\"wl wl-kjv\" data-code=\"H7931\">dwell</span> in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness,</span> and <span class=\"wl wl-kjv\" data-code=\"H6666\">righteousness</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">remain</span> in the fruitful field.","17":"And the <span class=\"wl wl-kjv\" data-code=\"H4639\">work</span> of <span class=\"wl wl-kjv\" data-code=\"H6666\">righteousness</span> shall be <span class=\"wl wl-kjv\" data-code=\"H7965\">peace;</span> and the <span class=\"wl wl-kjv\" data-code=\"H5656\">effect</span> of <span class=\"wl wl-kjv\" data-code=\"H6666\">righteousness</span> <span class=\"wl wl-kjv\" data-code=\"H8252\">quietness</span> and <span class=\"wl wl-kjv\" data-code=\"H983\">assurance</span> <span class=\"wl wl-kjv\" data-code=\"H5704\">for</span> ever.","18":"And my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> shall <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> in a <span class=\"wl wl-kjv\" data-code=\"H7965\">peaceable</span> <span class=\"wl wl-kjv\" data-code=\"H5116\">habitation,</span> and in <span class=\"wl wl-kjv\" data-code=\"H4009\">sure</span> <span class=\"wl wl-kjv\" data-code=\"H4908\">dwellings,</span> and in <span class=\"wl wl-kjv\" data-code=\"H7600\">quiet</span> resting places;","19":"When it shall <span class=\"wl wl-kjv\" data-code=\"H1258\">hail,</span> coming <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> on the <span class=\"wl wl-kjv\" data-code=\"H3293\">forest;</span> and the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> shall be <span class=\"wl wl-kjv\" data-code=\"H8213\">low</span> in a low place.","20":"<span class=\"wl wl-kjv\" data-code=\"H835\">Blessed</span> are ye that <span class=\"wl wl-kjv\" data-code=\"H2232\">sow</span> beside all <span class=\"wl wl-kjv\" data-code=\"H4325\">waters,</span> that send <span class=\"wl wl-kjv\" data-code=\"H7971\">forth</span> thither the <span class=\"wl wl-kjv\" data-code=\"H7272\">feet</span> of the <span class=\"wl wl-kjv\" data-code=\"H7794\">ox</span> and the ass."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"een koning","tekst":"Te weten Christus Jezus. Doch enigen verstaan hier door dezen koning den koning Hizkia, voorzoveel hij een voorbeeld van Christus geweest is."},{"catchword":"de vorsten","tekst":"Dat is, de dienaars van dezen koning in zijn geestelijk rijk."},{"catchword":"zullen heersen","tekst":"Te weten door het Woord van God."}],"2":[{"catchword":"die man","tekst":"Te weten Jezus Christus."},{"catchword":"zal zijn","tekst":"Te weten, den gelovigen."},{"catchword":"als een verberging","tekst":"Dat is, als ene plaats, waar men zich voor den wind verbergen kan. De zin is: De Messias zal zijn de rechte toevlucht aller uitverkorenen."},{"catchword":"den wind,","tekst":"Versta hier, den wind der geestelijke aanvechting en allerlei vervolging; vergelijk Mat 11:28 ."},{"catchword":"als waterbeken","tekst":"Dat is, Hij zal den beangstigden een sterken troost aanbrengen door werking en kracht van den Heiligen Geest. Vergelijk deze woorden met Mat 5:6 ; Joh 4:10 , joh 4:14 , en Joh 7:37-39 ."},{"catchword":"een dorstig land","tekst":"Of, moede land; te weten, mat en moede van dorst. Zie Psa 143:6 ; Pro 25:25 ; Isa 29:8 ."}],"3":[{"catchword":"dergenen, die zien,","tekst":"Dat is, der gelovigen, die allen van den Heere zullen verlicht zijn; Isa 54:13 . Zie ook boven Isa 29:18 , en Isa 30:21 ."},{"catchword":"niet terugzien,","tekst":"Dat is, niet elders heenzien, niet mis zien. Versta hierbij, maar zij zullen naarstiglijk op den Heere zien. Anders: niet bestreken zijn, of niet schemeren, niet verduisterd zijn."},{"catchword":"zullen opmerken","tekst":"Te weten, op hetgeen de Heere zegt. Zie Mat 7:28 ; Luk 4:22 ."}],"4":[{"catchword":"der onbedachtzamen","tekst":"Of, der onvoorzichtigen. Hebreeuws, dergenen, die zich verhaasten; alzo onder Isa 35:4 ."},{"catchword":"bescheidenlijk te spreken","tekst":"Hebreeuws, nette; te weten, woorden."}],"5":[{"catchword":"De dwaas","tekst":"De zin is, de kwade daden zullen niet meer onder den naam van de deugden schuilen, maar zij zullen door de predikatie van het heilige Evangelie openbaar gemaakt en ernstiglijk bestraft worden, het kwaad zal kwaad en het goede zal goed genoemd worden."},{"catchword":"mild","tekst":"Of, wild gevende. Het Hebreeuwse woord betekent ook somtijds rijk, gelijk Job 34:19 ."}],"6":[{"catchword":"een dwaas","tekst":"Anders: maar het zal een dwaas zijn die, enz. en zo in het volgende."},{"catchword":"dwaling","tekst":"Dat is, valse leer, die den mens van den rechten weg der zaligheid afleidt en tot dwaling brengt."},{"catchword":"om de ziel","tekst":"Dat is, om de mensen te verhinderen tot de kennis der waarheid Gods te komen; verstaande door de ziel des hongerigen die altegaar, die begeerte en lust hebben om de hemelse en zaligmakende waarheid te weten; vergelijk Mat 5:6 ; Joh 6:32 , enz."},{"catchword":"den dorstige","tekst":"Hebreeuws, des dorstigen drank; dat is, den drank, dien men den dorstigen behoort te geven, of dien de dorstige behoeft, of dien hij wenst en begeert."}],"7":[{"catchword":"eens gierigaards","tekst":"Dat is de beschrijving van den gierigaard."},{"catchword":"gereedschap","tekst":"Of, werktuig is kwaad, dat is, zijn raadslagen en handelingen, gewicht, maat, enz., zijn altemaal schadelijk. De gierigheid is een wortel van alle kwaad; 1Ti 6:10 ."},{"catchword":"hij beraadslaagt","tekst":"Zie de aantekening Job 21:27 ."},{"catchword":"het recht,","tekst":"De zin is, dat de gierigaard niet past op de woorden, die de armen tot hunne bescherming of verschoning bijbrengen, maar dat hij even stoutelijk het recht bederft, of verkeert. Anders: ja, ook wanneer de arme spreekt wat recht is; dat is, ofschoon hij recht heeft in hetgeen hij zegt. Anders: wanneer de nooddruftige met oordeel spreekt; dat is, met goede reden en verstand."}],"8":[{"catchword":"milddadige","tekst":"Gelijk boven vs.5,6."},{"catchword":"beraadslaagt","tekst":"Of, doet voorslagen, of neemt zich voor."},{"catchword":"en staat","tekst":"Dat is, hij is naarstig om liefde en weldadigheid aan zijnen naaste te bewijzen."},{"catchword":"op milddadigheden","tekst":"Hebreeuws, op liberaalheden."}],"9":[{"catchword":"Staat op,","tekst":"Te weten ter ere van Gods Woord; zie Gen 49:33 , en Jdg 3:20 . Of, staat op; te weten uit den slaap der zonde, namelijk om te voorkomen de zware plagen met welke God de Heere u is dreigende."},{"catchword":"gij geruste","tekst":"Of, zorgeloze, zekere, verwaande vrouwen, die nu weelderig en dartel zijt, geen kwaad of ongemak nu gevoelende noch vermoedende. Eenigen verstaan hier door de vrouwen de steden in het land van Juda, en door de dochters verstaan zij de dorpen, dat is de inwoners derzelve."}],"10":[{"catchword":"Vele dagen","tekst":"Dat is, vele jaren achtereen, te weten zeventig jaren, want zolang heeft de Babylonische gevangenschap geduurd; sommigen strekken het wijder uit, tot de laatste verwoesting der Joden; vergelijk Hos 3:4 ."},{"catchword":"gij","tekst":"Of, gijlieden; te weten die nu dus gerust en zorgeloos zijt."},{"catchword":"beroerd zijn,","tekst":"Te weten vanwege de schrikkelijke plagen, die God over ulieden zenden zal."},{"catchword":"de wijnoogst","tekst":"Dat is hetgeen God dreigt Lev 26:34 , Lev 26:43 ."},{"catchword":"zal uit zijn,","tekst":"Dat is, ophouden, niet zijn. Hebreeuws, is uit; dat is, hij zal zekerlijk uit zijn."},{"catchword":"er zal geen","tekst":"De zin is: Het land zal zo verwoest worden, dat er niets van te halen zal zijn."}],"11":[{"catchword":"gij geruste","tekst":"Gelijk boven vs.9."},{"catchword":"trekt u uit,","tekst":"Of, trekt uwe klederen uit; te weten uw gewone sierlijke klederen. Alsof hij zeide: De tijd is nu voorhanden dat gij uw schone sierlijke klederen zult moeten uittrekken, en inplaats van dezelve zakken of treurklederen zult moeten aandoen; zie boven Isa 3:24 ."}],"12":[{"catchword":"over de borsten,","tekst":"Dat is, omdat de kinderen niets te zuigen hebben, de borsten der moeders, vanwege den groten honger, verdroogd zijnde. Sommigen menen dat hier door de borsten te verstaan zijn de akkers en wijnstokken [gelijk er in den tekst volgt], die als twee borsten zijn, uit welke men voedsel tot nooddruft is zuigende; en dan is dit de zin: Gelijk de kinderen geen melk hebben zullen, alzo zullen de volwassenen geen spijs of drank hebben."}],"13":[{"catchword":"op alle vreugdehuizen,","tekst":"Dat is, op alle plaatsen, waar de huizen gestaan hebben, in welke men placht lustig en vrolijk te zijn; want al die huizen zouden van de vijanden afgebrand en vernield worden. Zie 2Ki 25:9 , en 2Ch 36:19 ."},{"catchword":"de vrolijk","tekst":"Dat is, Jeruzalem; zie boven Isa 22:2 ."}],"14":[{"catchword":"het paleis","tekst":"Te weten des konings paleis."},{"catchword":"verlaten zijn,","tekst":"Of, ledig staan."},{"catchword":"het gewoel","tekst":"Of, de menigte."},{"catchword":"ophouden;","tekst":"Of, nagelaten worden."},{"catchword":"Ofel","tekst":"Zie 2Ch 27:3 , en de aantekening aldaar, en Isa 33:14 ; Neh 3:26 , en Neh 11:21 ."},{"catchword":"de wachttorens","tekst":"Hebreeuws, wachttoren; genoemd Neh 3:26 , de uitstekende toren."},{"catchword":"tot spelonken","tekst":"Dat is, tot plaatsen waar geen mensen, maar slangen en padden in wonen zullen."},{"catchword":"tot in der eeuwigheid,","tekst":"Dat is, een langen tijd."},{"catchword":"een vreugde","tekst":"De zin is: De woudezels, die gaarne in woeste plaatsen zijn, zullen aldaar goede weiden hebben."}],"15":[{"catchword":"uitgegoten","tekst":"Hebreeuws, ontbloot worde. Omdat de bodem van een vat ontbloot wordt als het water daaruit wordt gegoten."},{"catchword":"de Geest","tekst":"Te weten de Heilige Geest, dien ons de Messias van den Vader zenden zal. Zie Luk 24:49 ; Joh 14:26 ."},{"catchword":"uit de hoogte;","tekst":"Dat is, uit den hemel."},{"catchword":"de woestijn","tekst":"Dat is, die van nature onduchtig zijn tot het goede, die zullen duchtig gemaakt worden, voornamelijk de heidenen."},{"catchword":"een vruchtbaar veld worden,","tekst":"Of, land, of landbouw. Hebreeuws, tot een Karmel; zie de aantekening 2Ki 19:23 ; Isa 29:17 , en Jer 2:7 ."},{"catchword":"en het vruchtbare veld","tekst":"Dat is, het Joodse land en volk, hetwelk hier genoemd wordt het vruchtbare veld, omdat God hetzelve eer dan de heidenen geroepen en tot zijn volk uitverkoren en aangeroepen heeft, en omdat Gods wet lang bij hen geweest was. Dat zal alsdan woest en onvruchtbaar zijn."}],"16":[{"catchword":"het recht","tekst":"Dat is, de heidenen, die tevoren als een woestijn waren, zullen zich tot den Heere bekeren en naar zijne rechten en geboden leven, zijnde gerechtvaardigd en geheiligd."},{"catchword":"op het vruchtbare veld","tekst":"Dat is, op de gemeente der gelovige Joden en heidenen. Zie boven Isa 29:17 ."},{"catchword":"verblijven","tekst":"Of, wonen, of met de woning blijven."}],"17":[{"catchword":"het werk","tekst":"Het werk, of maaksel; dat is, de vrucht. Zie Psa 1:3 ."},{"catchword":"vrede zijn;","tekst":"Te weten vrede der conscientie; Rom 5:1 ."},{"catchword":"de werking","tekst":"Of, de uitgewrochte vrucht der gerechtigheid."}],"18":[{"catchword":"mijn volk","tekst":"De profeet geeft in dit achttiende vs. met andere woorden te kennen even hetzelfde, dat hij boven in vs.15-17 gezegd heeft."},{"catchword":"des vredes wonen,","tekst":"Versta hier, den vrede der conscientie, onder de bescherming van hun oppersten Herder den Messias."},{"catchword":"stille","tekst":"Of, in stille rust, of in grote stilligheid [en] gerustheid."}],"19":[{"catchword":"het zal hagelen,","tekst":"Dat is, God zal zijne straffen laten gaan over het woud; dat is, over de wilde, woeste, ongehoorzame mensen. Vergelijk Jos 10:11 ; Eze 38:22 ; Rev 8:7 , en Rev 16:21 . Sommigen nemen het aldus: Dat de hagel, dat is de plaag, zo weinig zal schaden, alsof hij op het woud viel, waar hij weinig schade kan doen."},{"catchword":"waar men afgaat","tekst":"Anderen aldus: Het zal hagelen in den afgang, of in het onderste des wouds; alsof de profeet wilde zeggen: waar men placht beschermd te zijn voor den hagel, daar zal hij [te weten de hagel] doordringen tot den grond, of tot het onderste toe. Anders: zodat het woud zal nedervallen; vergelijk Deu 28:52 ."},{"catchword":"de stad","tekst":"Dat is, het wederspannige Jeruzalem, mitsgaders alle ongehoorzamen en ondankbaren zullen vernederd worden; zie boven vs.14, en vergelijk Mat 11:23 ."}],"20":[{"catchword":"Welgelukzalig","tekst":"Hier wendt zich de profeet tot alle getrouwe leraars, en hij vergelijkt hen bij de gelukkige akkerlieden, die een waterigen of vruchtbaren akker bouwende, een goeden oogst verwachten; alsof hij zeide: Welgelukzalig zijt gijlieden, die het Woord Gods met vrucht predikt in de gemeente des Heeren, die ten tijde van Christus overal zal verzameld worden, en die vele vruchten dragen zal als een akker, die aan het water gelegen is; vergelijk wijders Psa 72:16 , en Luk 8:11 . Sommigen verstaan door de wateren allerlei volken [gelijk elders meer geschiedt], wien het Evangelie in het Nieuwe Testament zou gepredikt worden."},{"catchword":"gij, die den voet","tekst":"Dat is, gijlieden, die dien vruchtbaren akker bouwt, dewijl gij daarvan groot nut en voordeel zult te verwachten hebben; want in het Joodse land trokken de ossen en de ezels den ploeg en deden het akkerwerk. En versta hier, door den voet van den ezel en den os, den ezel en den os zelf."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Behold, a King shall reign in righteousness,] By this King is meant Christ Jesus. But some do understand by this King, king Hezekiah, forasmuch as he was type and figure of Christ. Compare Psal.45.7. Zach.9.9.] and the Princes [that is, the Ministers of this King in his spiritual kingdom] shall rule according to judgement [to wit, by the word of God.]"}],"2":[{"catchword":null,"tekst":"And (that) man, [To wit, Jesus Christ] shall be [to wit, unto believers] as a covering against the wind [that is, as a place where a ma may hide & cover himself from the wind. The meaning is, the Messiah shall be the true refuge of all the elect. By wind in this place is meant the wind of spiritual temptation, and all manner of persecution. Compare Math.7.25,27.] and an hiding-place against the flood as water brooks in a dry place, [that is, he shall bring strong comfort or consolation to the distressed, by the powerful working of the holy ghost. Compare these words with Mat 5:6. Joh.4.10,14. And 7.37,38,39. [as the shadow of a heavy rock in a thirsty. [or weary land: to wit, weary and faint for thirst. See Psal.143.6. Pro 25:25. above chap.29.8.]"}],"3":[{"catchword":null,"tekst":"And the eyes of them that see, [That is, the eyes of the faithful who shall be all enlightened of God, below chap.54.13. See also above chap.29.18. and 30.] shall not look back, [that is, shall not look elsewhere, nor look amiss. Understand withal, but they shall diligently look up to God. Others, not be anointed or bedaubed, or dazzle, or be dim, or dark] and the ears of them that hear shall hearken [to wit, unto that which the Lord saith. See Mat 7:28. Luk 4:22.]"}],"4":[{"catchword":null,"tekst":"And the heart of the rash [or of the imprudent. Heb. Of them that make haste. So below chap.35.vers.4.] shall understand knowledge: and the tongue of the stammerers shall be ready to speak distinctly [Heb. Neatly, to wit, words.]"}],"5":[{"catchword":null,"tekst":"The fool shall no more be called liberal: neither shall the covetous be (any more) called bountiful [or giving liberally or bountifully. The Hebrew word doth also sometimes signify rich, as Job 34:19. The meaning is, vices or evil deeds shall go on more under the name of virtues, but they shall by the preaching of the Gospel be discovered, and be sharply reproved: evil shall be calle (function bouwHfdnav() {

  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>

  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  document.getElementById('hfdnav').innerHTML =

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte

function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;

}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
