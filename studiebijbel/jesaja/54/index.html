l":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Zing vrolijk, u onvruchtbare, *die* niet gebaard hebt! Maak geschal met vrolijk gezang, en juich, *die* geen barensnood gehad hebt! Want de kinderen van de eenzame zijn meer dan de kinderen van de getrouwde, zegt de HEERE.","2":"Maak de plaats van uw tenten wijd, en laat men de gordijnen van uw woningen uitbreiden, verhinder het niet; maak uw koorden lang, en steek uw pinnen vast in.","3":"Want u zult uitbreken ter rechter *hand* en ter linkerhand; en uw nageslacht zal de heidenen erven, en zij zullen de verwoeste steden doen bewonen.","4":"Vrees niet, want u zult niet beschaamd worden, en word niet schaamrood, want u zult niet te schande worden; maar u zult de schaamte van uw jonkheid vergeten, en de smaad van het weduwschap zult u niet meer gedenken.","5":"Want uw Maker is uw Man, HEERE van de heerscharen[1] is Zijn Naam; en de Heilige van Israël is uw Verlosser; Hij zal de God van de hele aardbodem genoemd worden.","6":"Want de HEERE heeft u geroepen, als een verlaten vrouw en bedroefde van geest; toch bent u de huisvrouw van de jeugd, hoewel u versmaad bent geweest, zegt uw God.","7":"Voor een klein ogenblik heb Ik u verlaten; maar met grote ontfermingen zal Ik u verzamelen.","8":"In een kleine toorn heb Ik Mijn aangezicht van u een ogenblik verborgen; maar met eeuwige goedertierenheid zal Ik Mij over u ontfermen, zegt de HEERE, uw Verlosser.","9":"Want dat zal Mij zijn *als* de wateren van Noach, toen Ik zwoer dat de wateren van Noach niet meer over de aarde zouden gaan; zo heb Ik gezworen dat Ik niet *meer* op u toornen, of u bestraffen zal.","10":"Want bergen zullen wijken, en heuvels wankelen; maar Mijn goedertierenheid zal van u niet wijken, en het verbond van Mijn vrede zal niet wankelen, zegt de HEERE, uw Ontfermer.","11":"U verdrukte, door onweer voortgedrevene, ongetrooste! Zie, Ik zal uw stenen helemaal sierlijk leggen, en Ik zal u op saffieren grondvesten.","12":"En uw glasvensters zal Ik van kristal maken, en uw poorten van robijnstenen, en uw hele grens van aangename stenen.","13":"En al uw kinderen zullen door de HEERE geleerd zijn, en de vrede van uw kinderen zal groot zijn.","14":"U zult door gerechtigheid bevestigd worden; wees ver van verdrukking, want u zult niet vrezen; en *ver* van verschrikking, want zij zal tot u niet naderen.","15":"Zie, zij zullen zich zeker verzamelen, *maar* niet uit Mij; wie zich tegen u verzamelen zal, die zal om uw wil vallen.","16":"Zie, Ik heb de smid geschapen, die de kolen in het vuur opblaast, en die het instrument voortbrengt tot zijn werk; ook heb Ik de verderver geschapen om te vernielen.","17":"Elk instrument dat tegen u gemaakt wordt, zal niet gelukken, en elke tong, *die* in het gericht tegen u opstaat, zult u verdoemen; dit is het erfdeel van de knechten van de HEERE, en hun gerechtigheid is uit Mij, spreekt de HEERE."},"SV":{"1":"Zing vrolijk, gij onvruchtbare, *die* niet gebaard hebt! maak geschal met vrolijk gezang, en juich, *die* geen barensnood gehad hebt! want de kinderen der eenzame zijn meer, dan de kinderen der getrouwde, zegt de HEERE.","2":"Maak de plaats uwer tenten wijd, en dat men de gordijnen uwer woningen uitbreide, verhinder het niet; maak uw koorden lang, en steek uw pinnen vast in.","3":"Want gij zult uitbreken ter rechter *hand* en ter linkerhand; en uw zaad zal de heidenen erven, en zij zullen de verwoeste steden doen bewonen.","4":"Vrees niet, want gij zult niet beschaamd worden, en word niet schaamrood, want gij zult niet te schande worden; maar gij zult de schaamte uwer jonkheid vergeten, en den smaad uws weduwschaps zult gij niet meer gedenken.","5":"Want uw Maker is uw Man, HEERE der heirscharen is Zijn Naam; en de Heilige Israëls is uw Verlosser; Hij zal de God des gansen aardbodems genaamd worden.","6":"Want de HEERE heeft u geroepen, als een verlaten vrouw en bedroefde van geest; nochtans zijt gij de huisvrouw der jeugd, hoewel gij versmaad zijt geweest, zegt uw God.","7":"Voor een klein ogenblik heb Ik u verlaten; maar met grote ontfermingen zal Ik u vergaderen.","8":"In een kleinen toorn heb Ik Mijn aangezicht van u een ogenblik verborgen; maar met eeuwige goedertierenheid zal Ik Mij uwer ontfermen, zegt de HEERE, uw Verlosser.","9":"Want dat zal Mij zijn *als* de wateren van Noach, toen Ik zwoer, dat de wateren van Noach niet meer over de aarde zouden gaan; alzo heb Ik gezworen, dat Ik niet *meer* op u toornen, noch u schelden zal.","10":"Want bergen zullen wijken, en heuvelen wankelen; maar Mijn goedertierenheid zal van u niet wijken, en het verbond Mijns vredes zal niet wankelen, zegt de HEERE, uw Ontfermer.","11":"Gij verdrukte, door onweder voortgedrevene, ongetrooste! zie, Ik zal uw stenen gans sierlijk leggen, en Ik zal u op saffieren grondvesten.","12":"En uw glasvensters zal Ik kristallijnen maken, en uw poorten van robijnstenen, en uw ganse landpale van aangename stenen.","13":"En al uw kinderen zullen van den HEERE geleerd zijn, en de vrede uwer kinderen zal groot zijn.","14":"Gij zult door gerechtigheid bevestigd worden; wees verre van verdrukking, want gij zult niet vrezen; en *verre* van verschrikking, want zij zal tot u niet naken.","15":"Ziet, zij zullen zich zekerlijk vergaderen, *doch* niet uit Mij; wie zich tegen u vergaderen zal, die zal om uwentwil vallen.","16":"Zie, Ik heb den smid geschapen, die de kolen in het vuur opblaast, en die het instrument voortbrengt tot zijn werk; ook heb Ik den verderver geschapen, om te vernielen.","17":"Alle instrument, dat tegen u bereid wordt, zal niet gelukken, en alle tong, *die* in het gericht tegen u opstaat, zult gij verdoemen; dit is de erve der knechten des HEEREN, en hun gerechtigheid is uit Mij, spreekt de HEERE."},"KJV":{"1":"Sing, O barren, thou *that* didst not bear; break forth into singing, and cry aloud, thou *that* didst not travail with child: for more *are* the children of the desolate than the children of the married wife, saith the LORD.","2":"Enlarge the place of thy tent, and let them stretch forth the curtains of thine habitations: spare not, lengthen thy cords, and strengthen thy stakes;","3":"For thou shalt break forth on the right hand and on the left; and thy seed shall inherit the Gentiles, and make the desolate cities to be inhabited.","4":"Fear not; for thou shalt not be ashamed: neither be thou confounded; for thou shalt not be put to shame: for thou shalt forget the shame of thy youth, and shalt not remember the reproach of thy widowhood","5":"For thy Maker *is* thine husband; the LORD of hosts *is* his name; and thy Redeemer the Holy One of Israel; The God of the whole earth shall he be called.","6":"For the LORD hath called thee as a woman forsaken and grieved in spirit, and a wife of youth, when thou wast refused, saith thy God.","7":"For a small moment have I forsaken thee; but with great mercies will I gather","8":"In a little wrath I hid my face from thee for a moment; but with everlasting kindness will I have mercy on thee, saith the LORD thy Redeemer.","9":"For this *is as* the waters of Noah unto me: for *as* I have sworn that the waters of Noah should no more go over the earth; so have I sworn that I would not be wroth with thee, nor rebuke","10":"For the mountains shall depart, and the hills be removed; but my kindness shall not depart from thee, neither shall the covenant of my peace be removed, saith the LORD that hath mercy","11":"O thou afflicted, tossed with tempest, *and* not comforted, behold, I will lay thy stones with fair colours, and lay thy foundations with sapphires.","12":"And I will make thy windows of agates, and thy gates of carbuncles, and all thy borders of pleasant stones.","13":"And all thy children *shall be* taught of the LORD; and great *shall be* the peace of thy children.","14":"In righteousness shalt thou be established: thou shalt be far from oppression; for thou shalt not fear: and from terror; for it shall not come near","15":"Behold, they shall surely gather together, *but* not by me: whosoever shall gather together against thee shall fall","16":"Behold, I have created the smith that bloweth the coals in the fire, and that bringeth forth an instrument for his work; and I have created the waster to destroy.","17":"No weapon that is formed against thee shall prosper; and every tongue *that* shall rise against thee in judgment thou shalt condemn. This *is* the heritage of the servants of the LORD, and their righteousness *is* of me, saith the LORD."}},"tsk":{"1":[{"kopje":"u onvruchtbare","refs":["Jes 62:4","Hoogl 8:8","Gal 4:27"]},{"kopje":"Maak geschal","refs":["Jes 42:10","Jes 42:11","Jes 44:23","Jes 49:13","Jes 55:12","Jes 55:13","Ps 67:4-6","Ps 98:3-9","Zef 3:14","Zach 9:9","Openb 7:9","Openb 7:10"]},{"kopje":"zijn meer","refs":["1 Sam 2:5","Ps 113:9","Hebr 11:11","Hebr 11:12"]}],"3":[{"kopje":"u zult","refs":["Jes 2:2-4","Jes 11:9-12","Jes 35:1","Jes 35:2","Jes 42:1-12","Jes 43:5","Jes 43:6","Jes 49:12","Jes 60:3-11","Gen 49:10","Ps 72:8-11","Rom 9:25","Rom 9:26","Rom 10:18","Rom 11:12","Kol 1:23"]},{"kopje":"en uw","refs":["Jes 49:18","Jes 55:5","Jes 60:10-13","Jes 61:5-9"]},{"kopje":"doen bewonen","refs":["Jes 49:8","Jes 49:19","Jes 52:9","Ezech 36:35","Ezech 36:36"]}],"4":[{"kopje":"Vrees niet","refs":["Jes 41:10","Jes 41:14","Jes 45:16","Jes 45:17","Jes 61:7","1 Petr 2:6"]},{"kopje":"zult u de schaamte","refs":["Jer 31:19","Ezech 16:22","Ezech 16:43","Ezech 16:60-63","Hos 3:1-5"]}],"5":[{"kopje":"uw Maker","refs":["Ps 45:11-18","Jer 3:14","Ezech 16:8","Hos 2:18","Hos 2:19","Joh 3:29","2 Kor 11:2","2 Kor 11:3","Ef 5:25-27","Ef 5:32"]},{"kopje":"HEERE","refs":["Jes 48:2","Jes 51:15","J lass=\"wl wl-kjv\" data-code=\"H7337\">Enlarge</span> the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> of thy <span class=\"wl wl-kjv\" data-code=\"H168\">tent,</span> and let them stretch <span class=\"wl wl-kjv\" data-code=\"H5186\">forth</span> the <span class=\"wl wl-kjv\" data-code=\"H3407\">curtains</span> of thine <span class=\"wl wl-kjv\" data-code=\"H4908\">habitations:</span> <span class=\"wl wl-kjv\" data-code=\"H2820\">spare</span> not, <span class=\"wl wl-kjv\" data-code=\"H748\">lengthen</span> thy <span class=\"wl wl-kjv\" data-code=\"H4340\">cords,</span> and <span class=\"wl wl-kjv\" data-code=\"H2388\">strengthen</span> thy stakes;","3":"For thou shalt break <span class=\"wl wl-kjv\" data-code=\"H6555\">forth</span> on the right <span class=\"wl wl-kjv\" data-code=\"H3225\">hand</span> and on the <span class=\"wl wl-kjv\" data-code=\"H8040\">left;</span> and thy <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> shall <span class=\"wl wl-kjv\" data-code=\"H3423\">inherit</span> the <span class=\"wl wl-kjv\" data-code=\"H1471\">Gentiles,</span> and make the <span class=\"wl wl-kjv\" data-code=\"H8074\">desolate</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> to be inhabited.","4":"<span class=\"wl wl-kjv\" data-code=\"H3372\">Fear</span> not; for thou shalt not be <span class=\"wl wl-kjv\" data-code=\"H954\">ashamed:</span> neither be thou <span class=\"wl wl-kjv\" data-code=\"H3637\">confounded;</span> for thou shalt not be put to <span class=\"wl wl-kjv\" data-code=\"H2659\">shame:</span> for thou shalt <span class=\"wl wl-kjv\" data-code=\"H7911\">forget</span> the <span class=\"wl wl-kjv\" data-code=\"H1322\">shame</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5934\">youth,</span> and shalt not <span class=\"wl wl-kjv\" data-code=\"H2142\">remember</span> the <span class=\"wl wl-kjv\" data-code=\"H2781\">reproach</span> of thy widowhood","5":"For thy <span class=\"wl wl-kjv\" data-code=\"H6213\">Maker</span> is thine <span class=\"wl wl-kjv\" data-code=\"H1166\">husband;</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts</span> is his <span class=\"wl wl-kjv\" data-code=\"H8034\">name;</span> and thy <span class=\"wl wl-kjv\" data-code=\"H1350\">Redeemer</span> the Holy <span class=\"wl wl-kjv\" data-code=\"H6918\">One</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> The <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of the whole <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> shall he be called.","6":"For the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> thee as a <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> <span class=\"wl wl-kjv\" data-code=\"H5800\">forsaken</span> and <span class=\"wl wl-kjv\" data-code=\"H6087\">grieved</span> in <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit,</span> and a <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> of <span class=\"wl wl-kjv\" data-code=\"H5271\">youth,</span> when thou wast <span class=\"wl wl-kjv\" data-code=\"H3988\">refused,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> thy God.","7":"For a <span class=\"wl wl-kjv\" data-code=\"H6996\">small</span> <span class=\"wl wl-kjv\" data-code=\"H7281\">moment</span> have I <span class=\"wl wl-kjv\" data-code=\"H5800\">forsaken</span> thee; but with <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H7356\">mercies</span> will I gather","8":"In a <span class=\"wl wl-kjv\" data-code=\"H8241\">little</span> <span class=\"wl wl-kjv\" data-code=\"H7110\">wrath</span> I <span class=\"wl wl-kjv\" data-code=\"H5641\">hid</span> my <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> from thee for a <span class=\"wl wl-kjv\" data-code=\"H7281\">moment;</span> but with <span class=\"wl wl-kjv\" data-code=\"H5769\">everlasting</span> <span class=\"wl wl-kjv\" data-code=\"H2617\">kindness</span> will I have <span class=\"wl wl-kjv\" data-code=\"H7355\">mercy</span> on thee, <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy Redeemer.","9":"For this is as the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> of <span class=\"wl wl-kjv\" data-code=\"H5146\">Noah</span> unto me: for as I have <span class=\"wl wl-kjv\" data-code=\"H7650\">sworn</span> that the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> of <span class=\"wl wl-kjv\" data-code=\"H5146\">Noah</span> should no more go <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">earth;</span> so have I <span class=\"wl wl-kjv\" data-code=\"H7650\">sworn</span> that I would not be <span class=\"wl wl-kjv\" data-code=\"H7107\">wroth</span> with thee, nor rebuke","10":"For the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains</span> shall <span class=\"wl wl-kjv\" data-code=\"H4185\">depart,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1389\">hills</span> be <span class=\"wl wl-kjv\" data-code=\"H4131\">removed;</span> but my <span class=\"wl wl-kjv\" data-code=\"H2617\">kindness</span> shall not <span class=\"wl wl-kjv\" data-code=\"H4185\">depart</span> from thee, neither shall the <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> of my <span class=\"wl wl-kjv\" data-code=\"H7965\">peace</span> be <span class=\"wl wl-kjv\" data-code=\"H4131\">removed,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> that hath mercy","11":"O thou <span class=\"wl wl-kjv\" data-code=\"H6041\">afflicted,</span> tossed with <span class=\"wl wl-kjv\" data-code=\"H5590\">tempest,</span> and not <span class=\"wl wl-kjv\" data-code=\"H5162\">comforted,</span> behold, I will <span class=\"wl wl-kjv\" data-code=\"H7257\">lay</span> thy <span class=\"wl wl-kjv\" data-code=\"H68\">stones</span> with fair <span class=\"wl wl-kjv\" data-code=\"H6320\">colours,</span> and lay thy <span class=\"wl wl-kjv\" data-code=\"H3245\">foundations</span> with sapphires.","12":"And I will <span class=\"wl wl-kjv\" data-code=\"H7760\">make</span> thy <span class=\"wl wl-kjv\" data-code=\"H8121\">windows</span> of <span class=\"wl wl-kjv\" data-code=\"H3539\">agates,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H8179\">gates</span> of <span class=\"wl wl-kjv\" data-code=\"H68\">carbuncles,</span> and all thy <span class=\"wl wl-kjv\" data-code=\"H1366\">borders</span> of <span class=\"wl wl-kjv\" data-code=\"H2656\">pleasant</span> stones.","13":"And all thy <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> shall be <span class=\"wl wl-kjv\" data-code=\"H3928\">taught</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> and <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> shall be the <span class=\"wl wl-kjv\" data-code=\"H7965\">peace</span> of thy children.","14":"In <span class=\"wl wl-kjv\" data-code=\"H6666\">righteousness</span> shalt thou be <span class=\"wl wl-kjv\" data-code=\"H3559\">established:</span> thou shalt be <span class=\"wl wl-kjv\" data-code=\"H7368\">far</span> from <span class=\"wl wl-kjv\" data-code=\"H6233\">oppression;</span> for thou shalt not <span class=\"wl wl-kjv\" data-code=\"H3372\">fear:</span> and from <span class=\"wl wl-kjv\" data-code=\"H4288\">terror;</span> for it shall not come near","15":"Behold, they shall <span class=\"wl wl-kjv\" data-code=\"H1481\">surely</span> gather <span class=\"wl wl-kjv\" data-code=\"H1481\">together,</span> but <span class=\"wl wl-kjv\" data-code=\"H657\">not</span> by me: <span class=\"wl wl-kjv\" data-code=\"H4310\">whosoever</span> shall gather <span class=\"wl wl-kjv\" data-code=\"H1481\">together</span> against thee shall fall","16":"Behold, I have <span class=\"wl wl-kjv\" data-code=\"H1254\">created</span> the <span class=\"wl wl-kjv\" data-code=\"H2796\">smith</span> that <span class=\"wl wl-kjv\" data-code=\"H5301\">bloweth</span> the <span class=\"wl wl-kjv\" data-code=\"H6352\">coals</span> in the <span class=\"wl wl-kjv\" data-code=\"H784\">fire,</span> and that bringeth <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> an <span class=\"wl wl-kjv\" data-code=\"H3627\">instrument</span> for his <span class=\"wl wl-kjv\" data-code=\"H4639\">work;</span> and I have <span class=\"wl wl-kjv\" data-code=\"H1254\">created</span> the <span class=\"wl wl-kjv\" data-code=\"H7843\">waster</span> to destroy.","17":"No <span class=\"wl wl-kjv\" data-code=\"H3627\">weapon</span> that is <span class=\"wl wl-kjv\" data-code=\"H3335\">formed</span> against thee shall <span class=\"wl wl-kjv\" data-code=\"H6743\">prosper;</span> and every <span class=\"wl wl-kjv\" data-code=\"H3956\">tongue</span> that shall <span class=\"wl wl-kjv\" data-code=\"H6965\">rise</span> against thee in <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H7561\">condemn.</span> This is the <span class=\"wl wl-kjv\" data-code=\"H5159\">heritage</span> of the <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and their <span class=\"wl wl-kjv\" data-code=\"H6666\">righteousness</span> is of me, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"vrolijk,","tekst":"Hier spreekt de profeet de gemeente der gelovige Joden aan, die leven zouden ten tijde als het Evangelie beginnen gepredikt te worden, gelijk af te nemen is uit Gal 4:27 ; waar deze woorden aangehaald worden."},{"catchword":"gij onvruchtbare,","tekst":"Aldus noemt hij de kerk, die in de wereld was toen Christus in het vlees verschenen is, ten aanzien van het geringe aantal der gelovigen."},{"catchword":"niet gebaard hebt","tekst":"Dat is, zeer zelden of weinig kinderen gebaard hebt, te weten kinderen Gods, uit het zaad van Gods Woord. Vergelijk Joh 1:12-13 ; 1Pe 1:23 . Het getal der gelovige heidenen is veel groter dan het getal der gelovige Joden. Zie Joh 1:11 ; Rom 9:27 , enz."},{"catchword":"der eenzame","tekst":"Of, der verwoeste; dat is, der Joodse kerk, die ten tijde des Heeren Christus klein was in getal, ten aanzien van de grote menigte der Joden, die verworpen waren."},{"catchword":"dan de kinderen der getrouwde,","tekst":"Dat is, dan de oude gemeente der Joden, die God eerst beroepen en zich als ten huwelijk genomen heeft."}],"2":[{"catchword":"Maak de plaats","tekst":"Te weten opdat de bekeerden uit de heidenen plaats bij u vinden. Dit is gesproken naar de wijze der ouden in het land Kanaän, die in tenten woonden, te kennen gevende dat de kerk van het Nieuwe Testament zeer vermeerderen en zich wijd uitbreiden zou, zich aan alle zijden vermenigvuldigende. Zie Isa 49:19-20 ."},{"catchword":"woningen","tekst":"Of, tabernakelen."},{"catchword":"verhinder het niet;","tekst":"Of, houdt ze niet terug, of houdt ze niet in."},{"catchword":"koorden lang,","tekst":"Of touwen, of zelen, met welke de tenten gespannen worden."},{"catchword":"steek uw","tekst":"Hebreeuws, versterk uwe pinnen."},{"catchword":"pinnen","tekst":"Of, nagelen, aan welke de touwen vastgemaakt worden."}],"3":[{"catchword":"uitbreken","tekst":"Te weten met veelheid van kinderen. De zin is: Daar zullen ook onder de heidenen en aan die plaatsen, waar tevoren geen kerken geweest zijn, veel gelovige en ware ledematen der Christelijke kerk gevonden worden."},{"catchword":"uw zaad","tekst":"Dat is, uwe nakomelingen, te weten uw geestelijke kinderen."},{"catchword":"de heidenen","tekst":"Dat is, het land der heidenen; dat is, de heidenen zullen ook door het Evangelie, hetwelk van Zion uitgaan zal, kinderen Gods worden en u toegevoegd worden."},{"catchword":"zij zullen","tekst":"Te weten uwe nakomelingen."},{"catchword":"de verwoeste steden","tekst":"Dat is, die steden, in welke tevoren gene kinderen Gods woonden."}],"4":[{"catchword":"Vrees niet,","tekst":"Te weten, vanwege uwe onvruchtbaarheid, die eertijds voor grote schande gehouden werd."},{"catchword":"de schaamte uwer jonkheid","tekst":"Dat is, de schande, die u eertijds wedervaren is, te weten toen gij, vanwege uwe zonden, den Egyptenaars ter dienstbaarheid zijt overgegeven geworden. Anderen nemen het in dezen zin, alsof de profeet zeide: De heerlijkheid en gelukzaligheid, tot welke gij zult verheven worden, zal maken dat gij al het leed, dat ge tevoren toen gij als een verlaten jonkvrouw of arme weduwe waart, hebt uitgestaan, zult vergeten."}],"5":[{"catchword":"uw Maker","tekst":"Hebreeuws, uw maker is uw man. Vergelijk deze manier van spreken met Gen 20:13 ."},{"catchword":"des gansen aardbodems","tekst":"Niet alleen van de Joden, maar ook van alle andere natiën, ja, van de ganse wereld, 1Jo 2:2 , dewijl zijne kerk door de ganse wereld zou uitgebreid worden."},{"catchword":"genaamd worden","tekst":"Versta hierbij: en ook inderdaad zijn."}],"6":[{"catchword":"heeft u geroepen,","tekst":"Vooreerst uit de Babylonische gevangenschap; daarna uit het geestelijke rijk der zonde en des duivels, tot zijn rijk."},{"catchword":"de huisvrouw der jeugd,","tekst":"Dat is, als ene huisvrouw, die men in zijne jeugd getrouwd heeft, gelijk Pro 5:18 ; dat is, gij waart mij lief en waard in voortijden, en zijt het nog om den wil der voorvaders."}],"7":[{"catchword":"maar met grote","tekst":"Versta hierbij, de laatste woorden van vs.8: zegt de Heere uw Verlosser."}],"8":[{"catchword":"In een kleinen","tekst":"Dat is, in een toorn, die niet lang geduurd heeft. Anders: Ik heb mijn aangezicht voor u verborgen voor een klein, op het ogenblik van mijn toorn."},{"catchword":"Mijn aangezicht","tekst":"Van deze manier van spreken zie de aantekening Job 13:24 ."},{"catchword":"een ogenblik","tekst":"Zie de aantekening Psa 30:6 ."}],"9":[{"catchword":"dat zal Mij zijn","tekst":"De zin is: Dat Ik nu gesproken heb van mijne genade en barmhartigheid te uwaarts, zal zo zeker en bondig zijn als hetgeen Ik eertijds gesproken heb na den algemenen zondvloed, die ten tijde van Noach geweest is; zie Gen 9:11 ."},{"catchword":"toen Ik zwoer,","tekst":"Of, wien Ik zwoer."},{"catchword":"dat de wateren van Noach","tekst":"Dat is, dat de wateren, die in zijn tijd gekomen zijn."},{"catchword":"op u","tekst":"Dit is van de uitverkoren kinderen Gods te verstaan, die de rechte ledematen der kerk zijn."},{"catchword":"toornen,","tekst":"Te weten zozeer, dat Ik u geheellijk zou verstoten en van mijne genade en gunst ganselijk beroven zou."},{"catchword":"u schelden zal","tekst":"Te weten zo hard dat Ik u geheellijk zou uitroeien."}],"10":[{"catchword":"bergen","tekst":"Vergelijk dit met de woorden van Christus, Mat 24:35 ."},{"catchword":"zullen wijken,","tekst":"Of, mogen, of kunnen wijken. Anders: want al verzetten zich de bergen, enz. De zin is, mijne goedertierenheid over mijne kerk zal eeuwig duren en onveranderlijk blijven, al was het dat alles in de wereld het onderste boven ging."},{"catchword":"het verbond","tekst":"Dat is, het verbond, waardoor Ik u vrede, dat is de eeuwige zaligheid, beloofd heb."}],"11":[{"catchword":"onweder voortgedrevene,","tekst":"Versta hier door dit onweder vooreerst de Babylonische gevangenschap, en daarna de grote verwoesting door Antiochus ten tijde der Maccabeën, en wijders den geestelijken strijd, de zwarigheid en vervolging der kerk in het algemeen; Rom 11:28-29 ."},{"catchword":"ongetrooste","tekst":"Of, troosteloze."},{"catchword":"Ik zal uw stenen","tekst":"Dat is, Ik zal u herbouwen, veel heerlijker dan gij tevoren geweest zijt. Dit moet men verstaan van een geestelijke herbouwing der uitverkorenen, die in dit leven begint door de predikatie van het heilig Evangelie en de heerlijke gaven van den Heiligen Geest, Eph 4:11 , enz. en in het toekomende leven zal volmaakt worden; Rev 21:10 , enz."},{"catchword":"gans sierlijk","tekst":"Hebreeuws, met, of in sieraad doen legeren."}],"12":[{"catchword":"uw glasvensters","tekst":"Of, Ik zal uwe vensters van kristal maken, of, van agaten, of van paarlen."},{"catchword":"van robijnstenen,","tekst":"Of, van karbonkelen."},{"catchword":"van aangename stenen","tekst":"Of, van lustige, of welgevallige stenen. Hebreeuws, van stenen des lustes, of des welgevallens."}],"13":[{"catchword":"al uw kinderen","tekst":"Al de kinderen der kerk worden uiterlijk door het Woord, innerlijk door den Heiligen Geest geleerd; Jer 31:34 ."},{"catchword":"de vrede uwer kinderen","tekst":"Dat is, welvaart, zaligheid, gelijk vs.10."},{"catchword":"groot zijn","tekst":"Of, menigvuldig."}],"14":[{"catchword":"door gerechtigheid","tekst":"Te weten door Gods gerechtigheid, door welke Hij zijne kinderen beschermt. Of, versta hier, de gerechtigheid met welke God zijne kinderen begaaft en versiert, en die bij dezelve is in zwang gaande."},{"catchword":"van verdrukking,","tekst":"Dat is, gij zult niet onderdrukt worden en gene oorzaak hebben van vrees der onderukking, die u uwe vijanden zouden mogen aandoen."},{"catchword":"van verschrikking,","tekst":"Of, van verderf."},{"catchword":"zij zal tot u","tekst":"Te weten de vrees, of verschrikking; dat is, dingen die u verschrikken zouden."}],"15":[{"catchword":"zij zullen zich","tekst":"Anders: [maar] wie zich tegen u in u, [dat is in uw land] vergadert; verstaande de verraders des lands. Anders: zie daar zullen zich [enigen] als vreemdelingen [bij u] onthouden."},{"catchword":"niet uit Mij;","tekst":"Dat is, buiten mijn bevel."},{"catchword":"wie zich","tekst":"Anders: maar wie zich als een vreemdeling bij u onthouden zal tegen u, die zal moeten vallen; of, die zich met u vergadert, tegen u zijnde, zal vallen."},{"catchword":"om uwentwil","tekst":"Of, voor u vallen; dat is te gronde gaan, of te schande komen."}],"16":[{"catchword":"Zie,","tekst":"De zin is: Ik regeer het al door mijne voorzienigheid; geen smid zou enig wapen ten krijg kunnen maken, of geen vijand met dezelve het land verderven, tenware dat Ik het tevoren alzo verordend had."},{"catchword":"die de kolen","tekst":"Of, die het koolvuur opblaast."},{"catchword":"tot zijn werk;","tekst":"Te weten tot het werk van den verderver, die iets tegen u voorneemt. Anders: tot zijn werk; te weten van den smid."},{"catchword":"om te vernielen","tekst":"Te weten die, welke Ik hem toelaat te verderven, of, zoverre als ik hem toelaat te verderven, of te verdelgen."}],"17":[{"catchword":"Alle instrument,","tekst":"Niemand zal u kunnen hinderen of schaden, maar gij zult het alles overwinnen door Christus, die u liefheeft; Rom 8:37 ."},{"catchword":"dat tegen u","tekst":"Te weten van de vijanden der kerk."},{"catchword":"tegen u opstaat,","tekst":"Te weten om met u te twisten of te rechten."},{"catchword":"verdoemen;","tekst":"Dat is, overtuigen dat zij u onrecht gedaan en u valselijk aangeklaagd hebben."},{"catchword":"gerechtigheid","tekst":"Gerechtigheid is hier zoveel te zeggen als recht, of beschutting en bescherming, die ene vrucht is der gerechtigheid Gods; zie Isa 48:18 . Anderen verstaan hier door gerechtigheid het loon der gerechtigheid, of het recht, dat den knechten des Heeren toekomt, hetwelk dit is, dat Ik hen tegen alle onbillijk geweld beschut en bescherm."}]},"kanttekeningen_en":{"1":[{"catchword":"Sing cheerfully thou barren, (that) didst not bear, make a sound with joyful singing, and shout, thou (that) hadst no travelling pangs:","tekst":"Here the prophet speaketh to the church of believing Jews, that should live at the time when the Gospel should begin to be preached, as may be gathered from Gal.chap.4.vers.27.where these words are quoted, (thou barren) so he calleth the church that was in the world when Christ came in the flesh, in regard of the small number and increase of believers. (that didst not bear) That is, didst bear very seldom, or few children; to wit, children of God, of the seed of the word of God. Compare Joh.1.12,13. And 1 Pet.1.23. The number of believing Gentiles was much greater, then the number of believing Jews. See Joh.1.11. Rom 9:27, &c."},{"catchword":"for the children of the solitary","tekst":"or, of the desolate, that is, of the Jewish Church, which Christs time was small in number, in comparison of the great number of the Jews that were released"},{"catchword":"are more then the children of the married (wife)","tekst":"that is, of the ancient Church of the Jews, whom God first called, and took her as it were in marriage unto himself saith the LORD."}],"2":[{"catchword":"Enlarge the place of thy tent","tekst":"To wit, that those that are converted of the Gentiles may find room with thee. This is spoken according to the manner or custom of the ancients in the land of Canaan, that dwelled in tents; intimating that the Church of the New Testament should greatly increase, and spread it self wide abroad, multiplying exceedingly on all sides. See above chap.49.19,20."},{"catchword":"and let them spread out the curtains of thine habitations","tekst":"or, tabernacles"},{"catchword":"hinder it not:","tekst":"or, keep them not back, or strain them not"},{"catchword":"make thy cords long","tekst":"or, ropes, wherewith the tents were stretched out"},{"catchword":"and put thy stakes","tekst":"or, nails, whereunto the ropes were fastened"},{"catchword":"fast in","tekst":"Or, strengthen thy stakes."}],"3":[{"catchword":"For thou shalt break forth","tekst":"To wit, into a multitude of Children"},{"catchword":"on the right hand, and on the left:","tekst":"the meaning is, there shall be found even among the Gentiles, and in those places where there were no Churches in former time, many believers and true members of the Christian Church"},{"catchword":"and thy seed","tekst":"that is, thy offspring, or posterity; to wit, thy spiritual children"},{"catchword":"shall inherit the Genti /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REF_RE = /\b(\d?[A-Za-z]{2,3})\s+(\d{1,3}):(\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek) => {

}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', vert: 'KJV',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
    const items = lijst.map((it, i) => {
      const nr = i + 1;
      const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
      if (kortCw) {
        const idx = brontekstHtml.indexOf(kortCw);
        if (idx !== -1) {
          brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
        }
      }
      const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
      return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
    }).join('');
    const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${brontekstBlok}${items}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

    ).join('');
    return h;

  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);

      h += '<em>Geen verwijzingen</em>';

  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;

  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
