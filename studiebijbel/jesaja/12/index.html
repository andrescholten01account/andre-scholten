b 15:4", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"Num 17:4": "En u zult ze wegleggen in de tent van de samenkomst, voor de getuigenis, waar Ik met u samenkomen zal.", "Mal 3:6": "Want Ik, de HEERE, word niet veranderd; daarom zijn u, kinderen van Jakob, niet verteerd.", "1 Kron 16:36": "Geloofd zij de HEERE, de God van Israël, van eeuwigheid tot eeuwigheid! En al het volk zei: Amen! en het loofde de HEERE.", "Jer 51:45": "Ga uit, Mijn volk, uit haar midden, en red ieder zijn ziel, vanwege de gloed van de toorn van de HEERE.", "Ps 37:40": "En de HEERE zal hen helpen, en zal hen bevrijden; Hij zal hen bevrijden van de goddelozen, en zal hen behouden; want zij vertrouwen op Hem.", "Ps 95:1": "Komt, laat ons de HEERE vrolijk zingen; laat ons juichen voor de Rotssteen van ons heil.", "Openb 1:6": "En Die ons gemaakt heeft tot koningen en priesters voor God en Zijn Vader; Hem, zeg ik, zij de heerlijkheid en de kracht tot in alle eeuwigheid. Amen.", "Deut 12:18": "Maar u zult dat eten voor het aangezicht van de HEERE, uw God, in de plaats die de HEERE, uw God, zal uitkiezen, u, en uw zoon, en uw dochter, en uw dienstknecht, en uw dienstmaagd, en de Leviet die in uw poorten is; en u zult vrolijk zijn voor het aangezicht van de HEERE, uw God, over alles waaraan u uw handen geslagen hebt.", "Ps 62:6-8": "Maar u, o mijn ziel! zwijg voor God; want van Hem is mijn verwachting. Hij is zeker mijn Rots en mijn Heil, mijn Hoog Vertrek; ik zal niet wankelen. In God is mijn Heil en mijn Eer; de Rots van mijn sterkte, mijn Toevlucht is in God.", "Fil 3:3": "Want wij zijn de besnijding, wij, die God in de Geest dienen, en in Christus Jezus roemen, en niet vertrouwen op het vlees.", "Ps 26:6-8": "Ik was mijn handen in onschuld, en ik ga rondom Uw altaar, o HEERE! Om te laten horen de stem van de lof, en om te vertellen al Uw wonderen. HEERE! Ik heb lief de woning van Uw huis, en de plaats van de tabernakel van Uw eer.", "Ps 94:15": "Want het oordeel zal terugkeren tot de gerechtigheid; en alle oprechten van hart zullen dat navolgen.", "Ps 119:165": "Die Uw wet beminnen, hebben grote vrede, en zij hebben geen aanstoot.", "Ps 16:9": "Daarom is mijn hart blij, en mijn eer verheugt zich; ook zal mijn lichaam met zekerheid rusten.", "Jes 41:14": "Vrees niet, wormpje Jakob, volkje Israël! Ik help u, spreekt de HEERE, en uw Verlosser is de Heilige van Israël!", "Zach 2:5": "En Ik zal haar wezen, spreekt de HEERE, een vurige muur rondom; en Ik zal tot heerlijkheid wezen in het midden van haar.", "Klaagl 3:23": "Cheth. Zij zijn elke morgen nieuw, Uw trouw is groot.", "Job 33:27-29": "Hij zal de mensen aanschouwen, en zeggen: Ik heb gezondigd, en het recht verkeerd, wat mij niet heeft gebaat; Maar God heeft mijn ziel verlost, dat zij niet voert in het verderf, zodat mijn leven het licht aanziet. Zie, dit alles werkt God twee maal of driemaal met een man;", "Ps 30:5": "Zingt psalmen voor de HEERE, u, Zijn gunstgenoten! en looft ter gedachtenis aan Zijn heiligheid.", "Jak 4:8": "Kom dicht bij God, en Hij zal dicht bij u komen. Reinig de handen, zondaars, en zuiver de harten, dubbelhartigen!", "Ps 48:9": "Zoals wij gehoord hadden, zo hebben wij gezien in de stad van de HEERE van de heerscharen, in de stad van onze God; God zal haar bevestigen tot in eeuwigheid. Sela.", "Jes 8:10": "Beraadslaag een plan, toch zal het vernietigd worden; spreek een woord, toch zal het niet standhouden; want God is met ons!", "Jes 57:1": "De rechtvaardige komt om, en er is niemand die het ter harte neemt; en de goede mensen worden weggenomen, zonder dat iemand erop let dat de rechtvaardige weggenomen wordt vóór het kwaad komt.", "Matt 18:3": "en zei: Voorwaar, Ik zeg u: als u zich niet verandert en wordt zoals de kinderen, zult u het Koninkrijk der hemelen beslist niet ingaan.", "Deut 32:15": "Toen Jeschurun vet werd, sloeg hij achteruit (u bent vet geworden, u bent dik geworden, ja, met vet overdekt geworden!); en hij liet God varen, Die hem gemaakt heeft, en versmaadde de Rotssteen van zijn heil.", "Deut 32:31": "Want hun rotssteen is niet gelijk onze Rotssteen, zelfs onze vijanden zijn daar rechters over.", "Ps 150:1-6": "Halleluja! Loof God in Zijn heiligdom; loof Hem in het uitspansel van Zijn sterkte! Loof Hem vanwege Zijn machtige daden; loof Hem naar de overvloed van Zijn grootheid! Loof Hem met geschal van de bazuin; loof Hem met de luit en met de harp!", "Rom 6:3-23": "Of weet u niet dat allen die wij in Christus Jezus gedoopt zijn, wij in Zijn dood gedoopt zijn? Wij zijn dan met Hem begraven door de doop in de dood, opdat, zoals Christus uit de doden opgewekt is tot de heerlijkheid van de Vader, zo ook wij in nieuwheid van leven zouden wandelen. Want als wij met Hem één geworden zijn in de gelijkmaking van Zijn dood, dan zullen wij het ook zijn in de gelijkmaking van Zijn opstanding;", "Hebr 13:15": "Laten wij dan door Hem altijd aan God een lofoffer opdragen, dat is de vrucht van lippen die Zijn Naam belijden.", "Ps 96:7": "Geeft de HEERE, geslachten van de volken! Geeft de HEERE eer en sterkte.", "Ps 27:1": "Een psalm van David. De HEERE is mijn Licht en mijn Heil, voor wie zou ik vrezen? De HEERE is de kracht van mijn leven, voor wie zou ik bang zijn?", "Ps 16:11": "U zult mij het pad van het leven bekendmaken; overvloed van vreugde is bij Uw aangezicht; liefelijkheden zijn in Uw rechterhand, eeuwig.", "Ps 18:2-4": "Hij zei dan: Ik zal U hartelijk liefhebben, HEERE, mijn Sterkte! De HEERE is mijn Steenrots, en mijn Burg, en mijn Uithelper; mijn God, mijn Rots, op Wie ik vertrouw; mijn Schild, en de Hoorn van mijn heil, mijn Hoog Vertrek. Ik riep de HEERE aan, die te prijzen is, en werd verlost van mijn vijanden.", "Rom 15:13": "De God nu van de hoop vervult u met alle blijdschap en vrede in het geloven, opdat u overvloedig mag zijn in de hoop, door de kracht van de Heilige Geest.", "Openb 14:6": "En ik zag een andere engel, vliegend in het midden van de hemel, en hij had het eeuwige Evangelie, om te verkondigen aan hen die op de aarde wonen, en aan alle natie, en geslacht, en taal, en volk;", "Ex 33:22": "En het zal gebeuren, wanneer Mijn heerlijkheid voorbijgaat, dat Ik u in een kloof van de steenrots zal zetten; en Ik zal u met Mijn hand overdekken, totdat Ik voorbijgegaan zal zijn.", "Ps 116:7": "Mijn ziel, keer terug tot uw rust, want de HEERE heeft u goedgedaan.", "Spr 3:13-18": "Gelukkig is de mens die wijsheid vindt, en de mens die verstandigheid voortbrengt! Want haar koophandel is beter dan de koophandel van zilver, en haar inkomst dan het uitgegraven goud. Zij is kostbaarder dan robijnen; en alles wat u kan verlangen, is met haar niet te vergelijken.", "Gen 48:21": "Daarna zei Israël tegen Jozef: Zie, ik sterf; maar God zal met u zijn, en Hij zal u terugbrengen naar het land van uw vaders.", "Ps 85:10": "Zeker, Zijn heil is nabij hen die Hem vrezen, opdat in ons land eer woont.", "Jes 62:12": "En zij zullen hen noemen het heilige volk, de verlosten van de HEERE; en u zult genoemd worden de gezochte, de stad, die niet verlaten is.", "Ef 3:15": "uit Wie heel het geslacht in de hemelen en op de aarde genoemd wordt,", "2 Kron 20:12": "O, onze God, zult U geen recht over hen oefenen? Want in ons is geen kracht tegen deze grote menigte, die tegen ons optrekt, en wij weten niet wat wij moeten doen; maar onze ogen zijn op U gericht.", "Ps 100:1-5": "Een lofzang. Heel de aarde, juich voor de HEERE! Dien de HEERE met blijdschap, kom voor Zijn aangezicht met vrolijk gezang. Weet dat de HEERE God is; Hij heeft ons gemaakt, en niet wij zelf; wij zijn Zijn volk en de schapen van Zijn weide.", "Jes 43:21": "Dit volk heb Ik Mij geformeerd, zij zullen Mijn lof vertellen.", "Ex 20:22": "Toen zei de HEERE tegen Mozes: Zo zult u tegen de kinderen van Israël zeggen: U hebt gezien dat Ik met u vanuit de hemel gesproken heb.", "Ps 103:1-4": "Een psalm van David. Loof de HEERE, mijn ziel, en al wat binnen in mij is, Zijn heilige Naam. Loof de HEERE, mijn ziel, en vergeet geen van Zijn weldaden; Die al uw ongerechtigheid vergeeft, die al uw ziekten geneest;", "Klaagl 2:1": "Aleph. Hoe heeft de Heere de dochter Sion in Zijn toorn bewolkt? Hij heeft de heerlijkheid van Israël van de hemel op de aarde neergeworpen; en Hij heeft aan de voetbank van Zijn voeten niet gedacht in de dag van Zijn toorn.", "1 Joh 1:4": "En deze dingen schrijven wij u, opdat uw blijdschap vervuld is.", "Matt 6:9": "Bid daarom zo: Onze Vader, Die in de hemelen bent! Laat Uw Naam geheiligd worden.", "2 Kor 4:16-18": "Daarom worden wij niet moedeloos; maar hoewel onze uitwendige mens verdorven wordt, wordt toch de inwendige vernieuwd van dag tot dag. Want onze lichte verdrukking, die zeer haast voorbijgaat, brengt ons een geheel bijzonder groot en eeuwig gewicht van heerlijkheid; Omdat wij niet letten op de dingen die men ziet, maar op de dingen die men niet ziet; want de dingen die men ziet, zijn tijdelijk, maar de dingen die men niet ziet, zijn eeuwig.", "Ps 36:10": "Want bij U is de fontein van het leven; in Uw licht zien wij het licht.", "Ps 130:5": "Ik verwacht de HEERE; mijn ziel verwacht, en ik hoop op Zijn Woord.", "Jer 43:7": "en zij trokken naar Egypteland, want zij waren aan de stem van de HEERE niet gehoorzaam; en zij kwamen tot Tachpanhes.", "Job 25:5": "Zie, zelfs de maan geeft geen schijnsel, en de sterren zijn niet zuiver in Zijn ogen.", "Luk 1:67-75": "En Zacharias, zijn vader, werd vervuld met de Heilige Geest, en profeteerde, en zei: Geloofd zij de Heere, de God van Israël, want Hij heeft naar Zijn volk omgezien en verlossing tot stand gebracht; en heeft een hoorn van heil voor ons opgericht, in het huis van David, Zijn knecht;", "Openb 14:7": "en hij zei met een luide stem: Vrees God, en geef Hem eer, want het uur van Zijn oordeel is gekomen; en aanbid Hem, Die de hemel, en de aarde, en de zee, en de bronnen van het water gemaakt heeft.", "Job 33:24": "Zo zal Hij hem genadig zijn, en zeggen: Verlos hem, dat hij in het verderf niet nederdaalt, Ik heb verzoening gevonden.", "Ps 124:8": "Onze hulp is in de Naam van de HEERE, Die hemel en aarde gemaakt heeft.", "Ex 15:2": "De HEERE is mijn Kracht en Lied, en Hij is mij tot een Heil geweest; Deze is mijn God; daarom zal ik Hem een liefelijke woning maken; Hij is de God van mijn vader, daarom zal ik Hem verheffen!", "Jer 30:24": "De gloed van de toorn van de HEERE zal zich niet afwenden, totdat Hij het gedaan heeft, en totdat Hij tot stand gebracht heeft de gedachten van Zijn hart; in het laatste van de dagen zult u daarop letten.", "Jes 43:14": "Zo zegt de HEERE, uw Verlosser, de Heilige van Israël: Om uw wil heb Ik naar Babel gezonden, en heb hen allen als vluchtelingen doen neerdalen, te weten de Chaldeeën, in de schepen, waarop zij juichten.", "Pred 3:22": "Daarom heb ik gezien, dat er niets beters is, dan dat de mens zich verblijdt in zijn werken, want dat is zijn deel; want wie zal hem daarheen brengen, dat hij ziet, wat na hem gebeuren zal?", "1 Petr 1:2": "de uitverkorenen naar de voorkennis van God de Vader, in de heiligmaking van de Geest, tot gehoorzaamheid en besprenging met het bloed van Jezus Christus; genade en vrede worde u vermenigvuldigd.", "Ps 24:8-10": "Wie is de Koning der ere? De HEERE, sterk en geweldig, de HEERE, geweldig in de strijd. Heft uw hoofden op, poorten, ja, heft op, eeuwige deuren! opdat de Koning der ere ingaat! Wie is Hij, deze Koning der ere? De HEERE van de heerscharen, Die is de Koning der ere. Sela.", "Jak 5:19": "Broeders, als iemand onder u van de waarheid is afgedwaald, en iemand hem bekeert,", "Ps 100:1-4": "Een lofzang. Heel de aarde, juich voor de HEERE! Dien de HEERE met blijdschap, kom voor Zijn aangezicht met vrolijk gezang. Weet dat de HEERE God is; Hij heeft ons gemaakt, en niet wij zelf; wij zijn Zijn volk en de schapen van Zijn weide.", "Jes 33:24": "En geen inwoner zal zeggen: Ik ben ziek, want het volk, dat daarin woont, zal vergeving van ongerechtigheid ontvangen.", "Ps 56:12": "Ik vertrouw op God, ik zal niet vrezen; wat zou de mens mij doen?", "Jes 40:9": "O Sion, u die goede boodschap verkondigt, klim op een hoge berg; o Jeruzalem, u die goede boodschap verkondigt, hef uw stem op met macht, hef ze op, vrees niet, zeg tegen de steden van Juda: Zie, hier is uw God!", "Jes 9:20": "Manasse Efraïm, en Efraïm Manasse, en zij zullen samen tegen Juda zijn. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.", "Ps 99:3": "Laat men Uw grote en ontzagwekkende Naam loven, die heilig is;", "Ps 114:2": "Werd Juda tot Zijn heiligdom, Israël Zijn volkomen heerschappij.", "Jes 66:18": "Hun werken en hun gedachten! Het komt, dat Ik alle heidenen en talen zal verzamelen, en zij zullen komen, en zij zullen Mijn heerlijkheid zien.", "Ps 89:8": "God is zeer geducht in de raad van de heiligen, en te vrezen boven allen die rondom Hem zijn.", "Luk 24:52": "En zij aanbaden Hem, en keerden terug naar Jeruzalem met grote blijdschap.", "Ps 97:2-6": "Rondom Hem zijn wolken en donkerheid, gerechtigheid en recht zijn de vastigheid van Zijn troon. Een vuur gaat voor Zijn aangezicht heen, en het steekt Zijn tegenstanders rondom in brand. Zijn bliksems verlichten de wereld; het aardrijk ziet ze en het beeft.", "Ps 107:8": "Laat hen de HEERE loven om Zijn goedertierenheid, en om Zijn wonderwerken voor de kinderen der mensen;", "1 Sam 2:1": "Toen bad Hanna en zei: Mijn hart springt van vreugde op in de HEERE; mijn hoorn is verhoogd in de HEERE; mijn mond is wijd opengedaan over mijn vijanden; want ik verheug mij in Uw heil.", "Ps 147:1-20": "Looft de HEERE, want onze God te bezingen is goed, omdat Hij liefelijk is; de lof is Hem waardig. De HEERE bouwt Jeruzalem; Hij verzamelt de verdrevenen van Israël. Hij geneest de gebrokenen van hart, en Hij verbindt hun wonden.", "Spr 28:12": "Als de rechtvaardigen opspringen van vreugde, is er grote heerlijkheid; maar als de goddelozen opkomen, wordt de mens angstvallig gezocht.", "Hos 11:9": "Ik zal de gloed van Mijn toorn niet uitvoeren; Ik zal niet terugkeren om Efraïm te verderven; want Ik ben God en geen mens, de Heilige in uw midden, en Ik zal niet in de stad komen.", "Ps 132:13-16": "Want de HEERE heeft Sion verkozen, Hij heeft het begeerd tot Zijn woonplaats, en zei: Dit is Mijn rust tot in eeuwigheid, hier zal Ik wonen, want Ik heb het begeerd. Ik zal haar voedsel rijkelijk zegenen, haar behoeftigen zal Ik met brood verzadigen.", "Rom 11:36": "Want uit Hem, en door Hem, en tot Hem zijn alle dingen. Hem zij de heerlijkheid tot in eeuwigheid. Amen.", "Jer 31:12-14": "Daarom zullen zij komen, en op de hoogte van Sion juichen, en toevloeien tot het goede van de HEERE, tot het koren, en tot de most, en tot de olie, en tot de jonge schapen en runderen; en hun ziel zal zijn als een gewaterde hof, en zij zullen voortaan niet meer treurig zijn. Dan zal de jonkvrouw zich verblijden in de rei, en ook de jongelingen en de ouderen samen; want Ik zal hun rouw in vrolijkheid veranderen, en zal hen troosten, en zal hen verblijden na hun droefenis. En Ik zal de ziel van de priesters met overvloed dronken maken; en Mijn volk zal met Mijn goed verzadigd worden, spreekt de HEERE.", "Jes 33:20-24": "Bekijk Sion, de stad van onze samenkomsten; uw ogen zullen Jeruzalem zien, een rustige woonplaats, een tent, die niet neergehaald zal worden, waarvan de pinnen in eeuwigheid niet uitgetrokken zullen worden, en waarvan geen touwen verscheurd zullen worden. Maar de HEERE zal daar bij ons heerlijk zijn, het zal een plaats zijn van rivieren, van wijde stromen; geen roeischuit zal daar doorvaren, en geen praalschip zal daar overvaren. Want de HEERE is onze Rechter, de HEERE is onze Wetgever, de HEERE is onze Koning. Hij zal ons redden.", "Jes 66:13": "Zoals iemand die zijn moeder troost, zo zal Ik u troosten; ja, u zult in Jeruzalem getroost worden.", "Jes 44:23": "Zing met vreugde, u hemelen! Want de HEERE heeft het gedaan; juich, u onderste delen van de aarde! U bergen! Maak een groot gedreun met vreugdegezang, u bossen, en al het geboomte daarin! Want de HEERE heeft Jakob verlost, en Zich heerlijk gemaakt in Israël.", "Fil 4:7": "En de vrede van God, die alle verstand te boven gaat, zal uw harten en uw gedachten bewaren in Christus Jezus.", "Ps 119:171": "Mijn lippen zullen Uw lof overvloedig uitstorten, als U mij Uw inzettingen zult geleerd hebben.", "1 Petr 1:22": "Nu u uw zielen gereinigd hebt door de gehoorzaamheid aan de waarheid, door de Geest, tot ongeveinsde broederlijke liefde, heb dan elkaar vurig lief uit een rein hart;", "Jes 45:24": "Men zal van Mij zeggen: Zeker, in de HEERE zijn gerechtigheden en sterkte; tot Hem zal men komen; maar zij zullen allen beschaamd worden die tegen Hem in woede ontstoken zijn.", "Ps 100:1": "Een lofzang. Heel de aarde, juich voor de HEERE!", "Jer 10:23": "Ik weet, o HEERE! dat bij de mens zijn weg niet is; het is niet bij een man die wandelt, dat hij zijn gang oordeelt.", "Luk 1:17": "En hij zal voor Hem uit gaan, in de geest en de kracht van Elia, om de harten van de vaders tot de kinderen te bekeren, en de ongehoorzamen tot de wijsheid van de rechtvaardigen, om voor de Heere een toegerust volk gereed te maken.", "Openb 14:10": "die zal ook drinken uit de wijn van de toorn van God, die onvermengd ingeschonken is in de drinkbeker van Zijn toorn; en hij zal gepijnigd worden met vuur en zwavel voor de heilige engelen en voor het Lam.", "Jer 31:7": "Want zo zegt de HEERE: Roept luide over Jakob met vreugde, en juicht vanwege het hoofd van de heidenvolken; laat het horen, lofzingt, en zegt: O HEERE! Behoud Uw volk, het overblijfsel van Israël.", "1 Tim 2:8": "Ik wil dan dat de mannen bidden op alle plaatsen, met het opheffen van heilige handen, zonder toorn en twist.", "Ps 61:3": "Van het einde van het land roep ik tot U als mijn hart overstelpt is; leid mij op een rotssteen, die mij te hoog zou zijn.", "Ps 65:6": "Vreselijke dingen zult U ons in gerechtigheid antwoorden, o God van ons heil! o Vertrouwen van alle einden van de aarde, en van de ver weg gelegenen aan de zee!", "Ezech 18:23": "Zou Ik enigszins lust hebben aan de dood van de goddeloze, spreekt de Heere HEERE; is het niet zo, dat als hij zich bekeert van zijn wegen, hij zal leven?", "1 Joh 3:9": "Ieder die uit God geboren is, doet de zonde niet, want Zijn zaad blijft in hem; en hij kan niet zondigen, want hij is uit God geboren.", "1 Tim 2:3": "Want dat is goed en aangenaam voor God, onze Zaligmaker;", "Jes 60:19": "De zon zal voor u niet meer zijn tot een licht overdag, en tot een glans zal de maan u niet lichten; maar de HEERE zal u tot een eeuwig licht zijn, en uw God tot uw sierlijkheid.", "Ps 36:7": "Uw gerechtigheid is als de bergen van God, Uw oordelen zijn een grote afgrond; HEERE! U behoudt mensen en beesten.", "Ex 2:24": "En God hoorde hun gekerm, en God dacht aan Zijn verbond met Abraham, met Izak, en met Jakob.", "Ps 73:25": "Aan wie heb ik behalve U iets in de hemel? Behalve U verlang ik ook niets op de aarde!", "Ps 69:25": "Stort over hen Uw gramschap uit; en de gloed van Uw toorn grijpt hen aan.", "Ps 78:49": "Hij zond onder hen de gloed van Zijn toorn, verbolgenheid, en verstoordheid, en benauwdheid, met uitzending van boden van veel kwaad.", "Ps 26:1": "Een psalm van David. Doe mij recht, HEERE! Want ik wandel in mijn oprechtheid; en ik vertrouw op de HEERE, ik zal niet wankelen.", "Jes 66:19": "En Ik zal een teken bij hen zetten, en uit hen die ontkomen zijn, zal Ik zenden naar de heidenen, naar Tarsis, Pul en Lud, de boogschutters, naar Tubal en Javan, naar de ver gelegen eilanden, die Mijn faam niet gehoord en Mijn heerlijkheid niet gezien hebben; en zij zullen Mijn heerlijkheid onder de heidenen verkondigen.", "Ps 61:9": "Zo zal ik Uw Naam psalmzingen in eeuwigheid; opdat ik mijn geloften betaal, dag bij dag.", "Joh 17:1": "Dit heeft Jezus gesproken, en Hij hief Zijn ogen op naar de hemel, en zei: Vader, het uur is gekomen; verheerlijk Uw Zoon, opdat ook Uw Zoon U verheerlijkt.", "Ps 62:3": "Zeker, Hij is mijn Rots en mijn Heil, mijn Hoog Vertrek, ik zal niet erg wankelen.", "Ps 25:12": "Mem. Wie is de man, die de HEERE vreest? Hij zal hem onderwijzen in de weg, die hij zal hebben te verkiezen.", "Ps 48:12-14": "Laat de berg Sion blijde zijn; laat de dochters van Juda zich verheugen, om Uw oordelen wil. Ga rondom Sion, en omring haar; tel haar torens; Zet uw hart op haar vesting; beschouw nauwkeurig haar paleizen, opdat u het aan het volgende geslacht vertelt.", "Hab 3:17-19": "Alhoewel de vijgenboom niet bloeien zal, en er geen vrucht aan de wijnstok zal zijn, dat het werk van de olijfboom liegen zal, en de velden geen voedsel voortbrengen; dat men de kudde uit de kooi zal wegscheuren, en dat er geen rund in de stallen zal zijn; Zo zal ik toch in de HEERE van vreugde opspringen, ik zal mij verheugen in de God van mijn heil. De HEERE Heere is mijn Sterkte; en Hij zal mijn voeten maken als die van de hinden, en Hij zal mij doen treden op mijn hoogten. Voor de koorleider, op mijn Neginoth.", "Rom 8:9": "Maar u bent niet in het vlees, maar in de Geest, als tenminste de Geest van God in u woont. Maar als iemand de Geest van Christus niet heeft, die komt Hem niet toe.", "Gen 48:16": "Die Engel, Die mij verlost heeft van alle kwaad, zegent deze jongens, en laat in hen mijn naam genoemd worden, en de naam van mijn vaders Abraham en Izak, en laat hen vermenigvuldigen als vissen in menigte, midden in het land!", "Ps 35:28": "Zo zal mijn tong Uw gerechtigheid vermelden, en Uw lof de hele dag.", "Ps 141:8": "Doch op U zijn mijn ogen, HEERE, Heere; op U vertrouw ik, ontbloot mijn ziel niet.", "Jes 61:1-3": "De Geest van de Heere HEERE is op Mij, omdat de HEERE Mij gezalfd heeft, om een blijde boodschap te brengen aan de zachtmoedigen; Hij heeft Mij gezonden om te verbinden de gebrokenen van hart, om de gevangenen vrijheid uit te roepen, en de gebondenen opening van de gevangenis; Om uit te roepen het jaar van het welbehagen van de HEERE, en de dag van de wraak van onze God; om alle treurenden te troosten; Om de treurenden van Sion te geven, dat hun sieraad gegeven wordt voor as, vreugdeolie voor treurigheid, het gewaad van lof voor een benauwde geest; opdat zij eikenbomen van de gerechtigheid genoemd worden, een planting van de HEERE, opdat Hij verheerlijkt wordt.", "Joh 13:32": "Als God in Hem verheerlijkt is, zal God Hem ook in Zichzelf verheerlijken, en Hij zal Hem meteen verheerlijken.", "Openb 6:16": "En zeiden tot de bergen en tot de steenrotsen: Valt op ons, en verbergt ons van het aangezicht van Hem Die op de troon zit, en van de toorn van het Lam.", "Zach 14:20": "Op die dag zal op de bellen van de paarden staan: DE HEILIGHEID VAN DE HEERE. En de potten in het huis van de HEERE zullen zijn als de sprenkelschalen voor het altaar;", "1 Joh 2:27": "En de zalving, die u van Hem ontvangen hebt, blijft in u, en u hebt het niet nodig, dat iemand u leert; maar zoals diezelfde zalving u leert van alle dingen, zo is zij ook waarachtig, en is geen leugen; en zoals zij u geleerd heeft, zo zult u in Hem blijven.", "Ezech 39:7": "En Ik zal Mijn heilige Naam bekendmaken te midden van Mijn volk Israël, en Ik zal Mijn heilige Naam niet meer laten ontheiligen; en de heidenen zullen weten dat Ik de HEERE ben, de Heilige in Israël.", "Jes 1:27": "Sion zal door recht verlost worden, en haar wederkerende bewoners door gerechtigheid.", "Luk 18:19": "En Jezus zei tegen hem: Waarom noemt u Mij goed? Niemand is goed, dan Een, namelijk God.", "Matt 1:21-23": "en zij zal een Zoon baren, en u zult Hem de naam JEZUS geven; want Hij zal Zijn volk zalig maken van hun zonden. En dit alles is gebeurd, opdat vervuld zou worden wat door de Heere gesproken is door de profeet, die zei: Zie, de maagd zal zwanger worden en een Zoon baren, en u zult Hem de naam Emmanuel geven; dat betekent, vertaald: God met ons.", "Ps 125:1": "Een lied Hammaaloth. Wie op de HEERE vertrouwen, zijn als de berg Sion, die niet wankelt, maar blijft in eeuwigheid.", "Ex 19:16": "En het gebeurde op de derde dag, toen het morgen was, dat er op de berg donder en bliksem waren, en een zware wolk, en het geluid van een zeer sterke bazuin, zodat al het volk dat in het leger was, beefde van schrik.", "Ps 138:5": "En zij zullen zingen van de wegen van de HEERE, want de heerlijkheid van de HEERE is groot.", "Ex 19:19": "Toen het geluid van de bazuin aanhield en zeer sterk werd, sprak Mozes; en God antwoordde hem met een stem.", "Dan 9:9": "Bij de Heere, onze God, zijn de barmhartigheden en vergevingen, hoewel wij tegen Hem gerebelleerd hebben.", "Ps 106:29": "En zij hebben de Heere tot toorn verwekt met hun daden, zodat de plaag een inbreuk onder hen deed.", "Ps 119:114": "U bent mijn Schuilplaats en mijn Schild; op Uw Woord heb ik gehoopt.", "Deut 32:21": "Zij hebben Mij tot ijver verwekt door wat geen God is; zij hebben Mij tot toorn verwekt door hun ijdelheden; Ik dan zal hen tot ijver verwekken door hen die geen volk zijn; door een dwaas volk zal Ik hen tot toorn verwekken.", "Ps 18:19": "Zij hadden mij bejegend ten dage van mijn ongeval; maar de HEERE was mij tot een Steunsel.", "Deut 7:9": "U zult dan weten dat de HEERE, uw God, dié God is, de getrouwe God, Die het verbond en de goedertierenheid houdt met wie Hem liefhebben en Zijn geboden houden, tot in duizend geslachten.", "Gal 6:15": "Want in Christus Jezus heeft noch besnijdenis enige kracht, noch onbesneden zijn, maar een nieuw schepsel.", "Ezra 3:11-13": "En zij zongen bij beurten, om de HEERE te loven en te danken, omdat Hij goed is en Zijn goedertierenheid tot in eeuwigheid is over Israël. En heel het volk juichte met groot gejuich, toen men de HEERE loofde vanwege de grondlegging van het huis van de HEERE. Maar velen van de priesters en de Levieten en hoofden van de families, die oud waren en het eerste huis gezien hadden, weenden met luide stem toen dit huis in hun grondlegging voor hun ogen was; maar velen verhieven de stem met gejuich en met vreugde. Zodat het volk het geluid van het gejuich van de vreugde niet kon onderscheiden van het geluid van het geween van het volk; want het volk juichte met groot gejuich, zodat het geluid tot ver weg gehoord werd.", "Ps 135:14": "Want de HEERE zal Zijn volk recht doen, en het zal Hem berouwen over Zijn knechten.", "1 Kor 15:57": "Maar God zij dank, Die ons de overwinning geeft door onze Heere Jezus Christus.", "Jes 2:3": "En veel volken zullen heengaan en zeggen: Kom, laat ons opgaan tot de berg van de HEERE, tot het huis van de God van Jakob, opdat Hij ons leert van Zijn wegen, en dat wij wandelen in Zijn paden; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem.", "1 Joh 2:29": "Als u weet, dat Hij rechtvaardig is, dan weet u, dat ieder, die de rechtvaardigheid doet, uit Hem geboren is.", "Ps 73:28": "Maar wat mij aangaat, het is mij goed om dicht bij God te zijn; ik stel mijn vertrouwen op de Heere HEERE, om al Uw werken te vertellen.", "1 Petr 2:10": "U, die vroeger geen volk was, maar nu het volk van God bent; die vroeger niet ontfermd was, maar nu ontfermd bent geworden.", "Rom 11:32": "Want God heeft hen allen onder de ongehoorzaamheid besloten, opdat Hij hun allen barmhartig zou zijn.", "Ps 41:14": "Geloofd zij de HEERE, de God van Israël, van eeuwigheid en tot in eeuwigheid! Amen, ja, amen.", "Ex 2:25": "En God zag de kinderen van Israël aan, en God kende hen.", "Ps 18:8-16": "Toen daverde en beefde de aarde, en de gronden van de bergen beroerden zich en daverden, omdat Hij ontstoken was. Rook ging op van Zijn neus, en een vuur uit Zijn mond verteerde; kolen werden daarvan aangestoken. En Hij boog de hemel, en daalde neer, en donkerheid was onder Zijn voeten.", "Num 14:9": "Wees alleen niet opstandig tegen de HEERE! En vrees het volk van dit land niet; want zij zijn ons brood! Hun bescherming is van hen geweken, en de HEERE is met ons; vrees hen niet!", "Jes 45:22": "Wend u naar Mij toe, word behouden, alle einden van de aarde! Want Ik ben God, en niemand meer.", "Zef 3:18": "De bedroefden, om de bijeenkomst, zal Ik verzamelen, zij zijn uit u; de smaad is een last op haar.", "Hebr 11:16-39": "maar nu verlangen zij naar een beter vaderland, dat is, naar het hemelse. Daarom schaamt God Zich niet voor hen om hun God genoemd te worden; want Hij had voor hen een stad klaargemaakt. Door het geloof heeft Abraham, toen hij beproefd werd, Izak geofferd, en hij die de beloften ontvangen had, heeft zijn enige zoon geofferd, (tegen wie gezegd was: In Izak zal uw nageslacht genoemd worden),", "Ps 67:5": "De natiën zullen zich verblijden en juichen, omdat U de volken zult richten in rechtvaardigheid; en de natiën op de aarde, die zult U leiden. Sela.", "Jer 33:8": "En Ik zal hen reinigen van al hun ongerechtigheid, waarmee zij tegen Mij gezondigd hebben; en Ik zal al hun ongerechtigheden vergeven, waarmee zij tegen Mij gezondigd en waarmee zij tegen Mij overtreden hebben.", "Ps 90:1": "Een gebed van Mozes, de man van God. Heere! U bent ons geweest een Toevlucht van geslacht tot geslacht.", "Hab 3:4-6": "En er was een glans als van het licht, Hij had hoornen aan Zijn hand, en daar was Zijn sterkte verborgen. Voor Zijn aangezicht ging de pestilentie, en de vurige kool ging voor Zijn voeten uit. Hij stond, en mat het land, Hij zag toe, en maakte de heidenvolken los, en de aloude bergen zijn verstrooid geworden; de heuvels van eeuwigheid hebben zich gebogen; de gangen van eeuwigheid zijn van Hem.", "1 Tim 3:15": "maar als ik langer wegblijf, opdat u weet hoe men zich moet gedragen in het huis van God, dat is de Gemeente van de levende God, een pilaar en fundament van de waarheid.", "Rom 6:23": "Want het loon van de zonde is de dood, maar de genadegift van God is het eeuwige leven, door Jezus Christus, onze Heere.", "1 Petr 1:16": "want er staat geschreven: Wees heilig, want Ik ben heilig.", "Ps 51:21": "Dan zult U lust hebben aan de offeranden van de gerechtigheid, aan brandoffer en een offer dat helemaal verteerd wordt; dan zullen zij jonge stieren offeren op Uw altaar.", "1 Tim 1:17": "De Koning nu der eeuwen, de onverderfelijke, de onzichtbare, de alleen wijze God, zij eer en heerlijkheid in alle eeuwigheid. Amen.", "Hand 2:38": "En Petrus zei tegen hen: Bekeer u, en ieder van u moet gedoopt worden in de Naam van Jezus Christus, tot vergeving van de zonden; en u zult de gave van de Heilige Geest ontvangen.", "2 Kron 30:9": "Want als u zich bekeert tot de HEERE, zullen uw broeders en uw kinderen barmhartigheid vinden bij hen die hen gevangen hebben genomen, zodat zij in dit land zullen terugkomen; want de HEERE, uw God, is genadig en barmhartig, en zal Zijn aangezicht niet van u afwenden, als u zich tot Hem bekeert.", "Ps 130:4": "Maar bij U is vergeving, opdat U gevreesd wordt.", "Jes 44:3-5": "Want Ik zal water gieten op de dorstige, en stromen op het droge; Ik zal Mijn Geest op uw nageslacht gieten, en Mijn zegen op uw nakomelingen. En zij zullen uitspruiten tussen het gras, als de wilgen aan de waterbeken. Deze zal zeggen: Ik ben van de HEERE; en die zal zich noemen met de naam van Jakob; en weer een ander zal met zijn hand schrijven: Ik ben van de HEERE, en zich noemen met de naam van Israël.", "Jes 17:6": "Toch zal er een nalezing in overblijven, zoals bij het afschudden van de olijfboom, twee of drie bezien in de top van de opperste twijg, en vier of vijf aan zijn vruchtbare takken, spreekt de HEERE, de God van Israël.", "Ps 140:14": "Zeker, de rechtvaardigen zullen Uw Naam loven; de oprechten zullen voor Uw aangezicht blijven.", "Ps 29:2-4": "Geef de HEERE de eer van Zijn Naam, aanbid de HEERE in de heerlijkheid van het heiligdom. De stem van de HEERE is op de wateren, de God van de ere dondert; de HEERE is op de grote wateren. De stem van de HEERE is met kracht, de stem van de HEERE is met heerlijkheid.", "2 Kron 5:14": "En de priesters konden, vanwege die wolk, niet staan om te dienen; want de heerlijkheid van de HEERE had het huis van God vervuld.", "Ps 118:18": "De HEERE heeft mij wel hard gekastijd; maar Hij heeft mij niet ter dood overgegeven.", "1 Joh 5:18": "Wij weten dat ieder die uit God geboren is, niet zondigt; maar wie uit God geboren is, bewaart zichzelf, en de boze krijgt geen vat op hem.", "Jes 40:5": "En de heerlijkheid van de HEERE zal geopenbaard worden; en alle vlees tegelijk zal zien, dat de mond van de HEERE het gesproken heeft.", "Jes 11:11": "Want het zal gebeuren op die dag, dat de Heere voor de tweede keer Zijn hand zal aanleggen om het overblijfsel van Zijn volk terug te verwerven, dat overgebleven zal zijn van Assyrië, en van Egypte, en van Pathros, en van Morenland, en van Elam, en van Sinear, en van Hamath, en van de eilanden van de zee.", "Luk 1:38": "En Maria zei: Zie, de dienstmaagd van de Heere; mij gebeure naar uw woord. En de engel ging van haar weg.", "Jes 44:6": "Zo zegt de HEERE, de Koning van Israël, en zijn Verlosser, de HEERE van de heerscharen: Ik ben de Eerste, en Ik ben de Laatste, en behalve Mij is er geen God.", "Openb 15:3": "En zij zongen het gezang van Mozes, de dienstknecht van God, en het gezang van het Lam, en zeiden: Groot en wonderlijk zijn Uw werken, Heere, Gij almachtige God, rechtvaardig en waarachtig zijn Uw wegen, Gij Koning der heiligen!", "1 Kor 15:10": "Maar door de genade van God ben ik wat ik ben; en Zijn genade die aan mij bewezen is, is niet tevergeefs geweest, maar ik heb overvloediger gewerkt dan zij allen; toch niet ik, maar de genade van God, Die met mij is.", "Ezech 39:25": "Daarom zegt de Heere HEERE zo: Nu zal Ik de gevangenen van Jakob terugbrengen, en Ik zal Mij ontfermen over heel het huis van Israël, en Ik zal ijveren voor Mijn heilige Naam;", "Ps 118:15": "In de tenten van de rechtvaardigen is een stem van gejuich en van het heil; de rechterhand van de HEERE doet krachtige daden.", "Ps 146:1-10": "Halleluja! O mijn ziel, prijs de HEERE. Ik zal de HEERE prijzen in mijn leven; ik zal mijn God psalmzingen, terwijl ik nog ben. Vertrouw niet op prinsen, op een mensenkind, bij wie geen heil is.", "Ps 118:1-4": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig. Laat Israël nu zeggen, dat Zijn goedertierenheid voor eeuwig is. Laat het huis van Aäron nu zeggen, dat Zijn goedertierenheid voor eeuwig is.", "Ps 95:7": "Want Hij is onze God, en wij zijn het volk van Zijn weide, en de schapen van Zijn hand. Heden, als u Zijn stem hoort,", "1 Kor 12:13": "Want ook wij allen zijn door één Geest tot één lichaam gedoopt; hetzij Joden, hetzij Grieken, hetzij dienstknechten, hetzij vrijen; en wij zijn allen tot één Geest gedrenkt.", "Tit 3:5": "Heeft Hij ons zalig gemaakt, niet uit de werken van de rechtvaardigheid die wij gedaan hadden, maar naar Zijn barmhartigheid, door het bad van de wedergeboorte en de vernieuwing door de Heilige Geest;", "Ef 1:12": "Opdat wij zouden zijn tot prijs van Zijn heerlijkheid, wij, die eerst op Christus gehoopt hebben.", "Hebr 12:28": "Daarom, omdat wij een onwankelbaar Koninkrijk ontvangen, laten wij de genade vasthouden, waardoor wij God welgevallig mogen dienen, met eerbied en godsvrucht.", "Richt 10:16": "En zij deden de vreemde goden uit hun midden weg, en dienden de HEERE. Toen werd Zijn ziel verdrietig over de ellende van Israël.", "Matt 19:17": "En Hij zei tegen hem: Wat noemt u Mij goed? Niemand is goed dan Eén, namelijk God. Maar wilt u het leven ingaan, onderhoud de geboden.", "Jes 28:16": "Daarom, zo zegt de Heere HEERE: Zie, Ik leg een grondsteen in Sion, een beproefde steen, een kostbare hoeksteen, die stevig gegrondvest is; wie gelooft, die zal niet haasten.", "Jes 45:15": "Voorwaar, U bent een God, Die Zich verborgen houdt, de God van Israël, de Heiland.", "Jes 57:19": "Ik schep de vrucht van de lippen: vrede, vrede voor hen die ver weg zijn, en voor hen die dichtbij zijn, zegt de HEERE, en Ik zal hen genezen.", "Num 32:13": "Zo ontstak de toorn van de HEERE tegen Israël, en Hij liet hen ronddwalen in de woestijn, veertig jaar lang, totdat heel het geslacht verteerd was dat gedaan had wat kwaad was in de ogen van de HEERE.", "Ps 86:5": "Want Gij, Heere! zijt goed, en vergeeft graag, en van grote goedertierenheid voor allen die U aanroepen.", "Ps 30:13": "Opdat mijn eer voor U psalmen zingt, en niet zwijgt. HEERE, mijn God! in eeuwigheid zal ik U loven.", "Ezech 11:20": "Opdat zij wandelen in Mijn inzettingen, en Mijn rechten bewaren en die doen; en zij zullen Mij tot een volk zijn, en Ik zal hun tot een God zijn.", "Ezech 33:11": "Zeg tegen hen: Zo waarachtig als Ik leef, spreekt de Heere HEERE, Ik heb geen behagen in de dood van de goddeloze! Maar hierin heb Ik behagen, dat de goddeloze zich bekeert van zijn weg en leeft. Bekeert u, bekeert u van uw slechte wegen, want waarom zou u sterven, o huis van Israël?", "2 Sam 22:4": "Ik riep de HEERE aan, Die te prijzen is, en ik werd verlost van mijn vijanden.", "Jak 1:2": "Acht het voor grote vreugde, mijn broeders, wanneer u in allerlei verzoekingen valt;", "Ps 32:1": "Een onderwijzing van David. Gelukkig is hij, wiens overtreding vergeven is, wiens zonde bedekt is.", "Joh 16:33": "Deze dingen heb Ik tot u gesproken, opdat u in Mij vrede hebt. In de wereld zult u verdrukking hebben, maar heb goede moed, Ik heb de wereld overwonnen.", "1 Tess 5:16": "Wees blij, altijd.", "1 Sam 14:6": "Jonathan nu zei tegen de jongen die zijn wapens droeg: Kom, laten we naar de bezetting van deze onbesnedenen oversteken; misschien zal de HEERE voor ons werken, want bij de HEERE is geen belemmering om te verlossen door velen of door weinigen.", "Jes 29:23": "want wanneer hij zijn kinderen, het werk van Mijn handen, zal zien in zijn midden, zullen zij Mijn Naam heiligen; en zij zullen de Heilige van Jakob heiligen, en de God van Israël vrezen.", "Ef 2:1": "En u heeft Hij mede levend gemaakt, terwijl u dood was door de misdaden en de zonden;", "Micha 7:19": "Hij zal Zich weer over ons ontfermen; Hij zal onze ongerechtigheden dempen; ja, U zult al hun zonden in de diepten van de zee werpen.", "2 Kron 7:14": "En Mijn volk, over wie Mijn Naam genoemd wordt, zich verootmoedigt en bidt, en zij Mijn aangezicht zoeken, en zich bekeren van hun slechte wegen; dan zal Ik uit de hemel horen, en hun zonden vergeven, en hun land genezen.", "Hebr 11:13": "Deze allen zijn in het geloof gestorven, zonder de beloften ontvangen te hebben, maar zij hebben ze van verre gezien, en geloofd, en begroet, en beleden dat zij gasten en vreemdelingen op de aarde waren.", "Ps 56:4": "Ten dage dat ik zal vrezen, zal ik op U vertrouwen.", "Dan 4:37": "Nu prijs ik, Nebukadnezar, en verhoog, en verheerlijk de Koning van de hemel, omdat al Zijn werken waarheid, en Zijn paden gerechtigheid zijn; en Hij is machtig te vernederen wie in hoogmoed wandelen.", "Mark 4:20": "En dezen zijn zij die in de goede aarde gezaaid zijn; die het Woord horen en aannemen, en vrucht dragen, het ene dertig-, en het andere zestig-, en het andere honderdvoud.", "Hebr 12:23": "Tot de algemene vergadering en de gemeente van de eerstgeborenen, die in de hemelen opgeschreven zijn, en tot God, de Rechter over allen, en de geesten van de rechtvaardigen die volmaakt gemaakt zijn;", "Luk 24:53": "En zij waren voortdurend in de tempel, waar zij God loofden en dankten. Amen.", "Jes 53:5": "Maar Hij is om onze overtredingen verwond, om onze ongerechtigheden is Hij verbrijzeld; de straf die ons de vrede aanbrengt, was op Hem, en door Zijn striemen is er voor ons genezing gekomen.", "Ps 34:4": "Gimel. Maakt de HEERE met mij groot, en laten wij Zijn Naam samen verhogen.", "2 Kor 7:4": "Ik heb veel vrijmoedigheid in het spreken tegen u, ik heb veel roem over u; ik ben vervuld met vertroosting; ik ben zeer overvloedig van blijdschap in al onze verdrukking.", "Jer 17:13": "O HEERE, Israëls Verwachting! Allen die U verlaten, zullen beschaamd worden; en die van Mij afwijken, zullen in de aarde geschreven worden; want zij verlaten de HEERE, de Springader van het levende water.", "Openb 15:1": "En ik zag een ander groot en wonderlijk teken in de hemel: namelijk zeven engelen, die de zeven laatste plagen hadden; want in deze is de toorn van God geëindigd.", "Ps 13:6": "Maar ik vertrouw op Uw goedertierenheid; mijn hart zal zich verheugen in Uw heil; ik zal de HEERE zingen, omdat Hij mij goedgedaan heeft.", "Ps 69:35-37": "Dat Hem prijzen de hemel en de aarde, de zeeën, en al wat daarin wemelt. Want God zal Sion verlossen, en de steden van Juda bouwen; en daar zullen zij wonen, en haar erfelijk bezitten; En het zaad van Zijn dienaars zal haar beërven; en de liefhebbers van Zijn Naam zullen daarin wonen.", "Jes 2:11": "De hoge ogen van de mensen zullen vernederd worden, en de hoogheid van de mannen zal neergebogen worden; en de HEERE alleen zal op die dag verheven zijn.", "Jer 33:11": "De stem van vreugde en de stem van blijdschap, de stem van de bruidegom en de stem van de bruid, de stem van hen die zeggen: Looft de HEERE van de heerscharen, want de HEERE is goed, want Zijn goedertierenheid is tot in eeuwigheid! de stem van hen die lof brengen naar het huis van de HEERE; want Ik zal de gevangenschap van het land wenden, als in het begin, zegt de HEERE.", "Ps 31:2": "Op U, o HEERE! vertrouw ik, laat mij niet beschaamd worden in eeuwigheid; help mij eruit door Uw gerechtigheid.", "Ps 103:8-14": "Barmhartig en genadig is de HEERE, geduldig en groot van goedertierenheid. Hij zal niet altijd twisten, en ook niet eeuwig de toorn behouden. Hij doet ons niet naar onze zonden, en vergeldt ons niet naar onze ongerechtigheden.", "Hebr 11:5": "Door het geloof is Henoch weggenomen, zodat hij de dood niet zou zien; en hij werd niet gevonden, omdat God hem weggenomen had; want vóór zijn wegneming had hij het getuigenis dat hij God behaagde.", "Jes 38:20": "De HEERE was gereed om mij te verlossen; daarom zullen wij op mijn snarenspel spelen, al de dagen van ons leven, in het huis van de HEERE.", "Spr 14:27": "De vreze van de HEERE is een bron van leven, om af te wijken van de strikken van de dood.", "1 Kor 6:11": "En dit was u, sommigen van u; maar u bent afgewassen, maar u bent geheiligd, maar u bent gerechtvaardigd, in de Naam van de Heere Jezus, en door de Geest van onze God.", "Jes 38:19": "De levende, de levende, die zal U loven, zoals ik heden doe; de vader zal aan de kinderen Uw waarheid bekendmaken.", "Ps 50:21": "Deze dingen doet u, en Ik zwijg; u meent dat Ik helemaal ben zoals u; Ik zal u straffen, en zal het ordelijk voor uw ogen op een rij zetten.", "Fil 4:19": "Maar mijn God zal naar Zijn rijkdom al wat u nodig hebt vervullen, in heerlijkheid, door Christus Jezus.", "Ps 7:12": "God is een rechtvaardige Rechter, en een God, Die iedere dag toornt.", "Ex 22:27": "want dat is zijn enige bedekking, het is zijn kleding voor zijn huid; waarin zou hij anders slapen? Het zal dan gebeuren, wanneer hij tot Mij roept, dat Ik hem zal horen; want Ik ben genadig!", "Jer 51:5": "Want Israël of Juda zal niet in weduwschap gelaten worden door zijn God, door de HEERE van de heerscharen (hoewel hun land vol schuld is), door de Heilige van Israël.", "Rom 15:29": "En ik weet dat ik, wanneer ik tot u kom, met volle zegen van het Evangelie van Christus komen zal.", "Mark 5:20": "En hij ging weg, en begon in het gebied van Dekapolis te verkondigen wat grote dingen Jezus aan hem gedaan had; en zij verwonderden zich allen.", "Ps 121:7": "De HEERE zal u bewaren voor alle kwaad; uw ziel zal Hij bewaren.", "Ps 63:3": "Voorzeker, ik heb U in het heiligdom aanschouwd, en heb Uw sterkte en Uw eer gezien;", "Jes 1:17": "Leer goed te doen, zoek het recht, help de verdrukte, doe de wees recht, voer de rechtszaak van de weduwe.", "1 Kron 16:25": "Want de HEERE is groot, en zeer te prijzen, en Hij is te vrezen boven alle goden.", "Ex 34:29-35": "En het gebeurde, toen Mozes van de berg Sinaï afdaalde (de twee tafelen van de getuigenis nu waren in de hand van Mozes, toen hij van de berg afdaalde), dat Mozes niet wist dat de huid van zijn aangezicht straalde, doordat Hij met hem gesproken had. Toen Aäron nu en al de kinderen van Israël Mozes aanzagen, zie, zo straalde de huid van zijn aangezicht; daarom waren zij bang om naar hem toe te gaan. Toen riep Mozes hen; en Aäron, en al de leiders in de vergadering keerden terug naar hem; en Mozes sprak tot hen.", "1 Kron 28:20": "En David zei tegen zijn zoon Salomo: Wees sterk en houd goede moed, en doe het; wees niet bevreesd en wees niet verslagen; want de HEERE God, mijn God, zal met u zijn; Hij zal u niet begeven en Hij zal u niet verlaten, totdat u al het werk voor de dienst van het huis van de HEERE hebt voltooid.", "Jer 21:6": "En Ik zal de inwoners van deze stad slaan, zowel de mensen als de dieren; door een grote pest zullen zij sterven.", "Ps 107:21": "Laat hen de HEERE loven om Zijn goedertierenheid, en om Zijn wonderwerken voor de kinderen der mensen.", "Ps 41:13": "Want mij aangaande, U onderhoudt mij in mijn oprechtheid, en U stelt mij voor Uw aangezicht in eeuwigheid.", "Ps 35:18": "Zo zal ik U loven in de grote gemeente; onder machtig veel volk zal ik U prijzen.", "Joh 12:28": "Vader, verheerlijk Uw Naam. Er kwam dan een stem uit de hemel, die zei: En Ik heb Hem verheerlijkt, en Ik zal Hem opnieuw verheerlijken.", "1 Kor 1:24": "Maar voor hen die geroepen zijn, zowel Joden als Grieken, prediken wij Christus, de kracht van God, en de wijsheid van God.", "Num 11:10": "Toen hoorde Mozes het volk wenen door hun huisgezinnen, ieder aan de deur van zijn tent; en de toorn van de HEERE ontstak zeer; ook was dat kwaad in de ogen van Mozes.", "Ps 129:5": "Laat hen beschaamd worden en achteruitgedreven, allen die Sion haten.", "Job 15:15": "Zie, op Zijn heiligen zou Hij niet vertrouwen, en de hemelen zijn niet zuiver in Zijn ogen.", "Ps 96:4": "Want de HEERE is groot, en zeer te prijzen; Hij is ontzagwekkend boven alle goden.", "Matt 5:48": "Wees dan volmaakt, zoals uw Vader, Die in de hemelen is, volmaakt is.", "Ps 126:1-3": "Een lied Hammaäloth. Toen de HEERE de gevangenen van Sion terugbracht, waren wij als mensen die dromen. Toen was onze mond vol lachen, en onze tong vol gejuich; toen zei men onder de heidenvolken: De HEERE heeft grote dingen aan hen gedaan. De HEERE heeft grote dingen bij ons gedaan; daarom zijn wij verblijd.", "1 Kor 11:20-22": "Als u dan bijeen samenkomt, is dat niet het avondmaal van de Heere eten. Want bij het eten neemt ieder van tevoren zijn eigen avondmaal; en de een is hongerig, en de ander is dronken. Hebt u dan geen huizen om te eten en te drinken? Of veracht u de Gemeente van God, en beschaamt u degenen die niets hebben? Wat zal ik u zeggen? Zal ik u prijzen? Hierin prijs ik u niet.", "2 Kor 1:2": "Genade zij u en vrede van God, onze Vader, en de Heere Jezus Christus.", "Luk 19:37": "En toen Hij nu in de buurt kwam van de afdaling van de Olijfberg, begon heel de menigte van de discipelen zich te verblijden, en God te loven met luide stem, vanwege alle krachtige daden die zij gezien hadden,", "Jes 55:1-3": "O, alle dorstigen, kom tot de wateren, en u die geen geld heeft, kom, koop en eet, ja kom, koop zonder geld en zonder prijs, wijn en melk! Waarom weegt u geld uit voor wat geen brood is, en uw arbeid voor wat niet verzadigen kan? Hoor aandachtig naar Mij, en eet het goede, en laat uw ziel zich verlustigen in vettigheid. Neig uw oor, en kom tot Mij, hoor en uw ziel zal leven; want Ik zal met u een eeuwig verbond maken, en u geven de zekere weldaden van David.", "Dan 3:17": "Als het zo is, onze God, Die wij eren, is machtig om ons te verlossen uit de brandende vuuroven, en Hij zal ons uit uw hand, o koning, verlossen.", "Jes 43:3": "Want Ik ben de HEERE, uw God, de Heilige van Israël, uw Heiland; Ik heb Egypte, Morenland en Seba gegeven tot uw losgeld in uw plaats.", "Joh 6:44": "Niemand kan tot Mij komen, als de Vader, Die Mij gezonden heeft, hem niet trekt; en Ik zal hem opwekken op de laatste dag.", "Ps 35:9": "Zo zal mijn ziel zich verheugen in de HEERE; zij zal vrolijk zijn in Zijn heil.", "Jes 5:25": "Daarom is de toorn van de HEERE ontstoken tegen Zijn volk, en heeft Hij Zijn hand tegen hen uitgestrekt, en heeft Hij hen geslagen, zodat de bergen hebben gebeefd, en hun dode lichamen zijn geworden als vuil in het midden van de straten. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.", "Ps 3:7": "Ik zal niet bang zijn voor tienduizenden van het volk, die zich rondom tegen mij opstellen.", "Ps 33:1-3": "Rechtvaardigen! Zingt vrolijk in de HEERE; lof past de oprechten. Looft de HEERE met de harp; zingt Hem psalmen met de luit, en het tiensnarig instrument. Zingt Hem een nieuw lied; speelt goed met vrolijk geschal.", "Ps 133:1": "Een lied Hammaäloth, van David. Zie, hoe goed en hoe fijn is het, dat broeders ook samenwonen!", "Jes 62:11": "Ziet, de HEERE heeft doen horen, tot aan het einde van de aarde: zegt tegen de dochter van Sion: Zie, uw Heil komt; zie, Zijn loon is met Hem, en Zijn arbeidsloon is voor Zijn aangezicht.", "Ps 52:10": "Maar ik zal zijn als een groene olijfboom in Gods huis; ik vertrouw op Gods goedertierenheid eeuwig en altijd.", "Job 13:15": "Zie, al doodde Hij mij, zou ik niet hopen? Toch zal ik mijn wegen voor Zijn aangezicht verdedigen.", "Ps 54:6": "Zie, God is mij een Helper; de Heere is onder hen die mijn ziel ondersteunen.", "2 Kor 8:1": "Verder maken wij u bekend, broeders, de genade van God, die in de gemeenten van Macedonië gegeven is.", "Jes 54:10": "Want bergen zullen wijken, en heuvels wankelen; maar Mijn goedertierenheid zal van u niet wijken, en het verbond van Mijn vrede zal niet wankelen, zegt de HEERE, uw Ontfermer.", "Joël 2:18": "Zo zal de HEERE ijveren over Zijn land, en Hij zal Zijn volk verschonen.", "1 Kor 11:13": "Oordeel bij uzelf: is het gepast dat de vrouw ongedekt tot God bidt?", "Ps 27:4": "Eén ding heb ik van de HEERE gevraagd, dat zal ik zoeken: dat ik alle dagen van mijn leven mag wonen in het huis van de HEERE, om de liefelijkheid van de HEERE te aanschouwen, en te onderzoeken in Zijn tempel.", "Luk 8:38": "En de man uit wie de duivels weggegaan waren, smeekte Hem bij Hem te mogen blijven. Maar Jezus liet hem van Zich gaan en zei:", "Dan 2:20": "Daniël antwoordde en zei: De Naam van God zij geloofd van eeuwigheid tot in eeuwigheid, want van Hem is de wijsheid en de kracht.", "Ex 22:24": "en Mijn toorn zal ontbranden, en Ik zal u met het zwaard doden; en uw vrouwen zullen weduwen worden, en uw kinderen wezen.", "Ps 40:18": "Ik ben wel ellendig en nooddruftig, maar de Heere denkt aan mij; Gij zijt mijn Hulp en mijn Bevrijder; o mijn God! wacht niet langer.", "Ezech 11:19": "En Ik zal hun één hart geven, en Ik zal een nieuwe geest in uw binnenste geven; en Ik zal het stenen hart uit hun vlees wegnemen, en zal hun een hart van vlees geven;", "Ps 28:6": "Geprezen zij de HEERE, want Hij heeft de stem van mijn smekingen gehoord.", "Hebr 1:8": "Maar tot de Zoon zegt Hij: Uw troon, o God, is er in alle eeuwigheid; de scepter van Uw koninkrijk is een rechte scepter.", "1 Petr 5:1": "De oudsten die onder u zijn, vermaan ik, die een medeoudste en getuige van het lijden van Christus ben, en deelachtig aan de heerlijkheid die geopenbaard zal worden:", "Openb 12:11": "En zij hebben hem overwonnen door het bloed van het Lam, en door het woord van hun getuigenis, en zij hebben hun leven niet liefgehad tot de dood toe.", "Ps 80:2": "O Herder van Israël! Neem het ter oor, U Die Jozef als schapen leidde; U Die tussen de cherubs zit, verschijn blinkend.", "2 Tess 2:16": "En onze Heere Jezus Christus Zelf, en onze God en Vader, Die ons heeft liefgehad, en een eeuwige vertroosting en goede hoop gegeven heeft in genade,", "Ps 149:6-9": "De lofprijzingen van God zullen in hun keel zijn, en een tweesnijdend zwaard in hun hand, om wraak te doen over de heidenvolken, en bestraffingen over de volken, om hun koningen te binden met ketenen, en hun aanzienlijken met ijzeren boeien,", "Ps 8:3": "Uit de mond van de kinderen en de zuigelingen hebt U sterkte gegrondvest, omwille van Uw tegenstanders, om de vijand en de wraakgierige te doen ophouden.", "Jer 17:17": "Wees Gij mij niet tot een verschrikking; Gij zijt mijn Toevlucht ten dage van het kwaad.", "Ex 18:11": "Nu weet ik dat de HEERE groter is dan alle goden; want in de zaak waarin zij trots gehandeld hebben, was Hij boven hen.", "Fil 3:7-14": "Maar wat mij winst was, dat heb ik om Christus' wil als schade beschouwd. Ja, zeker, ik beschouw ook alle dingen als schade vanwege de uitnemendheid van de kennis van Christus Jezus, mijn Heere; om Wiens wil ik al die dingen als schade heb gerekend, en ze beschouw als vuil, opdat ik Christus mag winnen, En in Hem gevonden word, niet met mijn eigen rechtvaardigheid, die uit de wet is, maar met de rechtvaardigheid die door het geloof van Christus is, namelijk de rechtvaardigheid die uit God is door het geloof;", "Jes 8:17": "Daarom zal ik de HEERE verwachten, Die Zijn aangezicht verbergt voor het huis van Jakob, en ik zal Hem verwachten.", "2 Kor 3:18": "En wij allen, die met ongedekt gezicht de heerlijkheid van de Heere aanschouwen als in een spiegel, worden naar datzelfde beeld veranderd van heerlijkheid tot heerlijkheid, als door de Geest van de Heere.", "Richt 5:3": "Hoor, u koningen, neem het ter ore, u vorsten! Ik, den HEERE zal ik zingen, ik zal den HEERE, de God van Israël, psalmzingen.", "Matt 13:33": "Een andere gelijkenis sprak Hij tot hen: Het Koninkrijk der hemelen is gelijk aan zuurdesem, die een vrouw nam en verborg in drie maten van het meel, totdat het geheel gezuurd was.", "Spr 13:9": "Het licht van de rechtvaardigen zal zich verblijden; maar de lamp van de goddelozen zal uitgeblust worden.", "Job 37:22": "Als van het noorden het goud komt; maar bij God is een geweldige majesteit!", "Ps 51:10": "Doe mij vreugde en blijdschap horen; laat de beenderen zich verheugen die U verbrijzeld hebt.", "Nahum 1:6": "Wie zal voor Zijn gramschap staan, en wie zal bestaan voor de gloed van Zijn toorn? Zijn grimmigheid is uitgestort als vuur, en de rotsen worden door Hem verbrijzeld.", "Ps 18:47": "De HEERE leeft, en geloofd zij mijn Rotssteen, en verhoogd zij de God van mijn heil!", "1 Kron 16:24": "Vertelt Zijn eer onder de heidenen, Zijn wonderwerken onder alle volken.", "Openb 15:7": "En een van de vier dieren gaf de zeven engelen zeven gouden schalen, vol van de toorn van God, Die leeft in alle eeuwigheid.", "Ps 11:7": "Want de HEERE is rechtvaardig, Hij heeft gerechtigheden lief; Zijn aangezicht aanschouwt de oprechte.", "Job 36:24": "Denk eraan, dat u Zijn werk groot maakt, dat de mensen aanschouwen.", "Num 16:48": "En hij stond tussen de doden en tussen de levenden; zo werd de plaag tot stilstand gebracht.", "Ps 47:7": "Zingt psalmen voor God, zingt psalmen! Zingt psalmen voor onze Koning, zingt psalmen!", "Luk 19:38": "en zij zeiden: Gezegend is de Koning, Die komt in de Naam van de Heere! Vrede in de hemel, en heerlijkheid in de hoogste hemelen!", "Ezech 8:4": "En zie, de heerlijkheid van de God van Israël was daar, naar de gedaante die ik in de vallei gezien had.", "1 Joh 5:11": "En dit is het getuigenis, namelijk dat God ons het eeuwige leven gegeven heeft; en dit leven is in Zijn Zoon.", "Ps 132:14": "Dit is Mijn rust tot in eeuwigheid, hier zal Ik wonen, want Ik heb het begeerd.", "Job 22:26": "Want dan zult u zich verlustigen over de Almachtige, en u zult uw aangezicht opheffen tot God.", "Jes 40:9-11": "O Sion, u die goede boodschap verkondigt, klim op een hoge berg; o Jeruzalem, u die goede boodschap verkondigt, hef uw stem op met macht, hef ze op, vrees niet, zeg tegen de steden van Juda: Zie, hier is uw God! Ziet, de Heere HEERE zal komen tegen de sterke, en Zijn arm zal heersen; ziet, Zijn loon is bij Hem, en Zijn arbeidsloon is voor Zijn aangezicht. Hij zal Zijn kudde weiden gelijk een herder; Hij zal de lammeren in Zijn armen bijeenbrengen, en in Zijn schoot dragen; de zogende dieren zal Hij zachtjes leiden.", "Ps 2:11": "Dient de HEERE met vrees, en verheugt u met beving.", "Ezech 36:21": "Maar Ik verschoonde hen om Mijn heilige Naam, die het huis van Israël ontheiligde onder de heidenen waarheen zij gekomen waren.", "2 Kon 14:27": "En de HEERE had niet gesproken dat Hij de naam van Israël van onder de hemel zou uitwissen; maar Hij verloste hen door de hand van Jerobeam, de zoon van Joas.", "Ps 25:20": "Schin. Bewaar mijn ziel, en red mij; laat mij niet beschaamd worden, want ik vertrouw op U.", "Dan 4:22-27": "Dat bent u, o koning, die groot en sterk bent geworden; want uw grootheid is zo toegenomen, dat zij reikt aan de hemel, en uw heerschappij aan het einde van het aardrijk. Dat nu de koning een wachter, namelijk een heilige, gezien heeft, uit de hemel neerkomend, die zei: Houwt deze boom om, en verderf hem; maar laat de stronk met zijn wortels in de aarde, en met een ijzeren en koperen band in het tedere gras van het veld, en in de dauw van de hemel nat gemaakt worden, en dat zijn deel zij met het gedierte van het veld, totdat er zeven tijden over hem voorbijgaan; Dit is de uitleg, o koning, en dit is een besluit van de Allerhoogste, dat over mijn heer de koning komen zal:", "2 Kon 17:18": "Daarom werd de HEERE zeer toornig op Israël, zodat Hij hen wegdeed van Zijn aangezicht; er bleef niets over, behalve de stam van Juda alleen.", "2 Petr 3:13": "Maar wij verwachten, naar Zijn belofte, nieuwe hemelen en een nieuwe aarde, waarin gerechtigheid woont.", "Hand 26:18": "Om hun ogen te openen en hen te bekeren van de duisternis tot het licht, en van de macht van de satan tot God; opdat zij vergeving van de zonden ontvangen, en een erfdeel onder de geheiligden, door het geloof in Mij.", "Matt 18:11-14": "Want de Zoon des mensen is gekomen om dat wat verloren was, zalig te maken. Wat denkt u? Als iemand honderd schapen had en één daarvan zou afdwalen, zal hij niet de negenennegentig achterlaten en de bergen op gaan om het afgedwaalde te zoeken? En als het gebeurt dat hij het vindt, voorwaar, Ik zeg u, dat hij zich meer verblijdt over dat schaap dan over de negenennegentig die niet afgedwaald zijn.", "1 Kor 3:6": "Ik heb geplant, Apollos heeft nat gemaakt; maar God heeft de groei gegeven.", "Ezech 20:14": "Maar Ik deed het om Mijn Naam, opdat die niet ontheiligd zou worden voor de ogen van de heidenvolken, voor wier ogen Ik hen uitleidde.", "Zach 8:3-8": "Zo zegt de HEERE: Ik ben teruggekeerd naar Sion, en Ik zal in het midden van Jeruzalem wonen; en Jeruzalem zal genoemd worden een stad van de waarheid, en de berg van de HEERE van de heerscharen, een berg van heiligheid. Zo zegt de HEERE van de heerscharen: Er zullen nog oude mannen en oude vrouwen zitten op de straten van Jeruzalem; ieder zal zijn stok in zijn hand hebben vanwege de hoge leeftijd. En de straten van die stad zullen vol worden met jongens en meisjes, spelend op haar straten.", "Ps 96:1-4": "Zingt de HEERE een nieuw lied; zingt de HEERE, heel de aarde! Zingt de HEERE, looft Zijn Naam; verkondigt Zijn heil van dag tot dag. Vertelt onder de heidenen Zijn eer, onder alle volken Zijn wonderen.", "Jes 40:1": "Troost, troost Mijn volk, zal uw God zeggen.", "Jes 59:20": "En er zal een Verlosser tot Sion komen, namelijk voor hen die zich bekeren van de overtreding in Jakob, spreekt de HEERE.", "Joh 16:22": "En u hebt dan nu wel droefheid; maar Ik zal u opnieuw zien, en uw hart zal zich verblijden, en niemand zal uw blijdschap van u wegnemen.", "Ezech 20:44": "Zo zult u weten dat Ik de HEERE ben, wanneer Ik met u gedaan zal hebben om Mijn Naam, niet naar uw slechte wegen, noch naar uw verdorven handelingen, o huis van Israël, spreekt de Heere HEERE.", "Ps 97:11": "Het licht is gezaaid voor de rechtvaardige, en vrolijkheid voor de oprechten van hart.", "Ex 28:34": "Dat er een gouden schelletje, daarna een granaatappel is; opnieuw een gouden schelletje, en een granaatappel, aan de zomen van de mantel rondom.", "Ps 115:18": "Maar wij zullen de HEERE loven van nu af tot in eeuwigheid. Halleluja!", "2 Sam 6:7": "Toen ontstak de toorn van de HEERE tegen Uza, en God sloeg hem daar, om deze onbedachtzaamheid; en hij stierf daar bij de ark van God.", "Rom 8:18": "Want ik houd het ervoor, dat het lijden van deze tegenwoordige tijd niet opweegt tegen de heerlijkheid die aan ons geopenbaard zal worden.", "Joh 8:36": "Als dan de Zoon u vrijgemaakt zal hebben, zult u werkelijk vrij zijn.", "Ps 107:22": "En laat hen lofoffers offeren, en met gejuich Zijn werken vertellen.", "Hand 21:19": "En nadat hij hen gegroet had, verhaalde hij stuk voor stuk wat God onder de heidenen door zijn dienst had gedaan.", "Openb 14:11": "En de rook van hun pijniging gaat op tot in alle eeuwigheid, en zij hebben geen rust, dag en nacht, zij die het beest aanbidden en zijn beeld, en zo iemand het merkteken van zijn naam ontvangt.", "2 Kron 24:19": "Toch zond Hij profeten onder hen, om hen tot de HEERE te doen terugkeren; die waarschuwden hen, maar zij luisterden niet.", "Ps 107:9": "Want Hij heeft de dorstige ziel verzadigd, en de hongerige ziel met goeds vervuld;", "Ps 119:175": "Laat mijn ziel leven, en zij zal U loven, en laat Uw rechten mij helpen.", "Rom 2:10": "Maar heerlijkheid, en eer, en vrede voor ieder die het goede doet, eerst de Jood, en ook de Griek.", "Ps 119:162": "Ik ben vrolijk over Uw toezegging, als iemand, die een grote buit vindt.", "Ps 28:7": "De HEERE is mijn Sterkte en mijn Schild; op Hem heeft mijn hart vertrouwd, en ik ben geholpen; daarom springt mijn hart op van vreugde, en ik zal Hem met mijn gezang loven.", "Mark 10:18": "En Jezus zei tegen hem: Waarom noemt u Mij goed? Niemand is goed, dan Eén, namelijk God.", "Ps 98:3": "Hij is gedachtig geweest aan Zijn goedertierenheid en Zijn waarheid aan het huis van Israël; en alle einden van de aarde hebben het heil van onze God gezien.", "Joh 17:11": "En Ik ben niet meer in de wereld, maar dezen zijn in de wereld, en Ik kom tot U, Heilige Vader, bewaar hen in Uw Naam, die U Mij gegeven hebt, opdat zij één zijn, zoals Wij.", "Ezech 20:17": "Doch Mijn oog spaarde hen, zodat Ik hen niet verdierf, en geen einde met hen maakte in de woestijn.", "1 Petr 4:13": "maar zoals u gemeenschap hebt aan het lijden van Christus, zo verblijdt u; opdat u ook in de openbaring van Zijn heerlijkheid u mag verblijden en verheugen.", "Ps 85:4": "U hebt al Uw verbolgenheid weggenomen; U hebt U afgewend van de gloed van Uw toorn.", "Ps 52:11": "Ik zal U loven voor eeuwig, omdat U het gedaan hebt; en ik zal Uw Naam verwachten; want hij is goed voor Uw gunstgenoten.", "2 Kor 1:10": "Die ons uit zo’n grote dood verlost heeft, en nog verlost; op Wie wij hopen dat Hij ons ook nog verlossen zal.", "Hab 2:14": "Want de aarde zal vervuld worden met de kennis van de heerlijkheid van de HEERE, zoals het water de bodem van de zee bedekt.", "Ps 145:4-6": "Daleth. Geslacht aan geslacht zal Uw werken roemen; en zij zullen Uw machtige daden verkondigen. He. Ik zal uitspreken de heerlijkheid van de eer van Uw majesteit, en Uw wonderlijke daden. Vau. En zij zullen vermelden de kracht van Uw ontzagwekkende daden; en Uw grootheid, die zal ik vertellen.", "1 Tim 3:16": "En buiten alle twijfel, de verborgenheid van de godsvrucht is groot: God is geopenbaard in het vlees, gerechtvaardigd in de Geest, gezien door de engelen, gepredikt onder de heidenen, geloofd in de wereld, opgenomen in heerlijkheid.", "Jes 32:4": "En het hart van de onbedachtzamen zal de kennis verstaan, en de tong van de stamelende zal vaardig zijn, om duidelijk te spreken.", "Tit 3:6": "Die Hij over ons rijkelijk heeft uitgegoten door Jezus Christus, onze Zaligmaker;", "Jes 61:3": "Om de treurenden van Sion te geven, dat hun sieraad gegeven wordt voor as, vreugdeolie voor treurigheid, het gewaad van lof voor een benauwde geest; opdat zij eikenbomen van de gerechtigheid genoemd worden, een planting van de HEERE, opdat Hij verheerlijkt wordt.", "Ps 42:9": "Maar de HEERE zal overdag Zijn goedertierenheid gebieden, en 's nachts zal Zijn lied bij mij zijn: het gebed tot de God van mijn leven.", "Rom 8:6": "Want het bedenken van het vlees is de dood, maar het bedenken van de Geest is leven en vrede.", "Ps 69:37": "En het zaad van Zijn dienaars zal haar beërven; en de liefhebbers van Zijn Naam zullen daarin wonen.", "Ps 16:6": "De snoeren zijn mij op fijne plaatsen gevallen; ja, een mooie erfenis is mij ten deel gevallen.", "Ps 71:16-18": "Ik zal heengaan in de mogendheden van de Heere HEERE; ik zal Uw gerechtigheid vermelden, de Uwe alleen. O God! Gij hebt mij geleerd van mijn jeugd af aan, en tot nog toe verkondig ik Uw wonderen. Daarom ook, terwijl het ouderdom en de grijsheid daar zijn, verlaat mij niet, o God, totdat ik aan dit geslacht Uw arm verkondig, aan alle nakomelingen Uw macht.", "Ps 55:15": "Wij die samen in zoetheid heimelijk raadpleegden; wij wandelden in gezelschap naar het huis van God.", "Openb 6:17": "Want de grote dag van Zijn toorn is gekomen, en wie kan bestaan?", "2 Tim 2:11-13": "Dit is een betrouwbaar woord: want als wij met Hem gestorven zijn, zullen wij ook met Hem leven; als wij volharden, zullen wij ook met Hem heersen; als wij Hem verloochenen, zal Hij ons ook verloochenen; als wij ontrouw zijn, blijft Hij trouw; Hij kan Zichzelf niet verloochenen.", "Ps 69:31": "Ik zal de Naam van God prijzen met gezang, en Hem met dankzegging grootmaken.", "Ezech 37:23": "En zij zullen zich niet meer verontreinigen met hun drekgoden, en met hun afschuwelijkheden, en met al hun overtredingen; en Ik zal ze verlossen uit al hun woonplaatsen, waarin zij gezondigd hebben, en zal ze reinigen; zo zullen zij Mij tot een volk zijn, en Ik zal hun tot een God zijn.", "Hoogl 2:3": "Als een appelboom onder de bomen van het woud, zo is mijn Liefste onder de zonen; ik heb grote lust in Zijn schaduw, en zit er onder, en Zijn vrucht is mijn gehemelte zoet.", "Jer 32:37": "Zie, Ik zal hen verzamelen uit al de landen waarheen Ik hen verdreven zal hebben in Mijn toorn, en in Mijn grimmigheid, en in grote verbolgenheid; en Ik zal hen naar deze plaats terugbrengen, en zal hen zeker doen wonen.", "Hab 3:18": "Zo zal ik toch in de HEERE van vreugde opspringen, ik zal mij verheugen in de God van mijn heil.", "Hebr 12:18-21": "Want u bent niet gekomen tot de tastbare berg, en het brandende vuur, en donkerheid, en duisternis, en onweer, En tot het geschal van de bazuin, en de stem van de woorden; waarbij zij die het hoorden, baden dat het woord tot hen niet meer gesproken zou worden. (Want zij konden niet dragen wat er geboden werd: Zelfs als een dier de berg aanraakt, zal het gestenigd of met een pijl doorschoten worden.", "Ps 68:27": "Looft God in de gemeenten, de Heere, u die uit de bron van Israël bent!", "Ex 20:2": "Ik ben de HEERE, uw God, Die u uit Egypteland, uit het diensthuis, uitgeleid heb.", "Ps 89:3": "Want ik heb gezegd: Uw goedertierenheid zal eeuwig gebouwd worden; in de hemelen zelf hebt Gij Uw waarheid bevestigd, en gezegd:", "Ps 134:1": "Een lied Hammaaloth. Zie, loof de HEERE, alle knechten van de HEERE! U die iedere nacht in het huis van de HEERE staat!", "Hebr 11:7-11": "Door het geloof heeft Noach, door God gewaarschuwd over de dingen die nog niet gezien werden, en bevreesd geworden, de ark gebouwd tot redding van zijn huisgezin; door dit geloof heeft hij de wereld veroordeeld, en is hij een erfgenaam geworden van de rechtvaardigheid die naar het geloof is. Door het geloof is Abraham, toen hij geroepen werd, gehoorzaam geweest om uit te gaan naar de plaats die hij tot een erfdeel zou ontvangen; en hij is uitgegaan zonder te weten waar hij komen zou. Door het geloof is hij een inwoner geweest in het land van de belofte, als in een vreemd land, en heeft hij in tenten gewoond met Izak en Jakob, die medeerfgenamen waren van dezelfde belofte.", "1 Petr 4:11": "Als iemand spreekt, laat hij spreken als de woorden van God; als iemand dient, laat hij dienen als uit kracht die God verleent; opdat God in alles geprezen wordt door Jezus Christus, aan Wie de heerlijkheid en de kracht toekomt, tot in alle eeuwigheid. Amen.", "Ps 98:2": "De HEERE heeft Zijn heil bekendgemaakt; Hij heeft Zijn gerechtigheid geopenbaard voor de ogen van de heidenen.", "1 Tim 3:14": "Deze dingen schrijf ik u, in de hoop spoedig bij u te komen;", "Jes 1:8": "En de dochter van Sion is overgebleven als een hutje in de wijngaard, als een nachthutje in de komkommerhof, als een belegerde stad.", "Ps 33:21": "Want ons hart is in Hem verblijd, omdat wij op de Naam van Zijn heiligheid vertrouwen.", "Ps 113:1": "Halleluja! Loof, u dienaren van de HEERE! Loof de Naam van de HEERE.", "Jer 31:33": "Maar dit is het verbond dat Ik na die dagen met het huis van Israël sluiten zal, spreekt de HEERE: Ik zal Mijn wet in hun binnenste geven, en zal die in hun hart schrijven; en Ik zal hun tot een God zijn, en zij zullen Mij tot een volk zijn.", "Ezech 25:14-17": "En Ik zal Mijn wraak brengen over Edom, door de hand van Mijn volk Israël; en zij zullen tegen Edom handelen naar Mijn toorn en naar Mijn grimmigheid; zo zullen zij Mijn wraak leren kennen, spreekt de Heere HEERE. Zo zegt de Heere HEERE: Omdat de Filistijnen uit wraak gehandeld hebben, en van harte wraak geoefend hebben door plundering, om te vernielen vanuit een eeuwige vijandschap; Daarom, zo zegt de Heere HEERE: Zie, Ik strek Mijn hand uit tegen de Filistijnen, en Ik zal de Cherethieten uitroeien, en het overblijfsel van de zeehaven doen verdwijnen.", "Job 34:29": "Als Hij stilt, wie zal dan beroeren? Als Hij het aangezicht verbergt, wie zal Hem dan aanschouwen, zowel voor een volk, als voor een mens alleen?", "Ps 106:1": "Halleluja! Loof de HEERE, want Hij is goed, want Zijn goedertierenheid is voor eeuwig.", "Ps 110:5": "De Heere is aan Uw rechterhand; Hij zal koningen verslaan op de dag van Zijn toorn.", "Jes 60:1-6": "Maak u op, word verlicht, want uw licht komt, en de heerlijkheid van de HEERE gaat over u op. Want zie, de duisternis zal de aarde bedekken, en donkerheid de volken; maar over u zal de HEERE opgaan, en Zijn heerlijkheid zal over u gezien worden. En de heidenen zullen naar uw licht gaan, en koningen naar de glans die over u is opgegaan.", "1 Petr 1:3": "Geloofd zij de God en Vader van onze Heere Jezus Christus, Die naar Zijn grote barmhartigheid ons opnieuw geboren heeft doen worden tot een levende hoop, door de opstanding van Jezus Christus uit de doden.", "Num 16:45": "Maak u op uit het midden van deze vergadering, en Ik zal hen verteren, in een ogenblik! Toen vielen zij op hun aangezichten.", "Ps 46:2-4": "God is ons een Toevlucht en Sterkte; Hij is met kracht bevonden een Hulp in benauwdheden. Daarom zullen wij niet vrezen, al veranderde de aarde haar plaats, en al werden de bergen verzet in het hart van de zeeën; Laat haar water bruisen, laat het beroerd worden; laat de bergen daveren, door de verheffing daarvan! Sela.", "Ps 74:12": "Toch is God mijn Koning van oudsher, Die verlossingen werkt in het midden van de aarde.", "Jes 6:3": "En de een riep tot de ander en zei: Heilig, heilig, heilig is de HEERE van de heerscharen! De hele aarde is vol van Zijn heerlijkheid!", "Zef 2:7": "En dat gebied zal zijn voor het overblijfsel van het huis van Juda, zodat zij daarin weiden; 's avonds zullen zij in de huizen van Askelon liggen, want de HEERE, hun God, zal hen bezoeken, en Hij zal hun gevangenschap wenden.", "Ezech 16:63": "opdat u eraan denkt, en zich schaamt, en niet meer uw mond opendoet vanwege uw schande, wanneer Ik verzoening voor u zal doen over alles wat u gedaan hebt, spreekt de Heere HEERE.", "Jes 30:30": "En de HEERE zal Zijn heerlijke stem doen horen, en de nederlating van Zijn arm doen zien, met grimmigheid van toorn, en een vlam van verterend vuur, stralen, en een vloed, en hagelstenen.", "2 Sam 22:9": "Rook ging op van Zijn neus, en een vuur uit Zijn mond verteerde; kolen werden daardoor aangestoken.", "Ps 69:36": "Want God zal Sion verlossen, en de steden van Juda bouwen; en daar zullen zij wonen, en haar erfelijk bezitten;", "Jer 31:3": "De HEERE is mij verschenen van lang geleden! Ja, Ik heb u liefgehad met een eeuwige liefde; daarom heb Ik u getrokken met goedertierenheid.", "Neh 1:10": "Zij zijn toch Uw dienaren en Uw volk, dat U verlost hebt door Uw grote kracht en door Uw sterke hand.", "Ps 29:2": "Geef de HEERE de eer van Zijn Naam, aanbid de HEERE in de heerlijkheid van het heiligdom.", "Ps 65:5": "Gelukkig is hij, die U verkiest, en doet naderen, dat hij woont in Uw voorhoven; wij zullen verzadigd worden met het goed van Uw huis, met het heilige van Uw paleis.", "Rom 5:1": "Wij dan, gerechtvaardigd zijnde uit het geloof, hebben vrede bij God, door onze Heere Jezus Christus;", "Ps 60:12": "Zult U het niet zijn, o God! Die ons verstoten had, en niet uittrok, o God! met onze legers?", "Job 23:2-6": "Ook vandaag is mijn klacht bitter; mijn plaag is zwaarder dan mijn zuchten. Och, of ik wist waar ik Hem vinden zou, ik zou tot Zijn troon komen; Ik zou het recht voor Zijn aangezicht ordentelijk voorstellen, en mijn mond zou ik met verdedigingen vullen.", "Ps 26:6": "Ik was mijn handen in onschuld, en ik ga rondom Uw altaar, o HEERE!", "Ps 110:3": "Uw volk zal zeer gewillig zijn op de dag van Uw heirkracht, in heilig sieraad; uit de baarmoeder van het dageraad zal U de dauw van Uw jeugd zijn.", "Ps 18:4": "Ik riep de HEERE aan, die te prijzen is, en werd verlost van mijn vijanden.", "Jes 66:15": "Want zie, de HEERE zal met vuur komen, en Zijn wagens als een wervelwind; om met grimmigheid Zijn toorn hiertoe te wenden, en Zijn bestraffing met vuurvlammen.", "Jer 13:11": "Want zoals een gordel zich hecht aan de middel van een man, zo heb Ik het hele huis van Israël en het hele huis van Juda aan Mij doen hechten, spreekt de HEERE, om Mij tot een volk te zijn, en tot een naam, en tot lof, en tot heerlijkheid; maar zij hebben niet gehoord.", "Ezech 36:23": "Want Ik zal Mijn grote Naam heiligen, die onder de heidenen ontheiligd is, die u in het midden van hen ontheiligd hebt; en de heidenen zullen weten dat Ik de HEERE ben, spreekt de Heere HEERE, als Ik aan u voor hun ogen zal geheiligd zijn.", "Ps 89:19": "Want ons schild is van de HEERE, en onze koning is van de Heilige van Israël.", "Ps 81:2": "Zingt vrolijk voor God, onze Sterkte; juicht voor de God van Jakob.", "Deut 6:15": "Want de HEERE, uw God, is een na-ijverig God in uw midden; dat de toorn van de HEERE, uw God, tegen u niet ontsteekt, en Hij u van de aardbodem verdelgt.", "Deut 32:22": "Want een vuur is aangestoken in Mijn toorn, en zal branden tot in de onderste hel, en zal het land met zijn opbrengst verteren, en de gronden van de bergen in vlam zetten.", "Ex 19:10-13": "Ook zei de HEERE tot Mozes: Ga tot het volk, en heilig hen heden en morgen, en laat hen hun kleren wassen, En gereed zijn tegen de derde dag; want op de derde dag zal de HEERE voor de ogen van al het volk neerkomen, op de berg Sinaï. En bepaal de grens voor het volk rondom, en zeg: Wacht ervoor de berg te beklimmen en de rand ervan aan te raken; al wie de berg aanraakt, zal zeker gedood worden.", "Ef 1:23": "Welke Zijn lichaam is, en de vervulling van Hem die alles in allen vervult.", "Jes 30:27": "Ziet, de Naam van de HEERE komt van verre, Zijn toorn brandt, en de last is zwaar; Zijn lippen zijn vol gramschap, en Zijn tong als een verterend vuur;", "Jes 44:8": "Schrik niet, en wees niet bang; heb Ik het u van toen af niet doen horen en verkondigd? Want u bent Mijn getuigen: is er ook een God behalve Mij? Zeker, er is geen andere rotssteen: Ik ken er geen.", "Richt 3:9": "Toen riepen de kinderen van Israël tot de HEERE; en de HEERE verwekte de kinderen van Israël een verlosser, die hen verloste, Othniël, zoon van Kenaz, broer van Kaleb, die jonger was dan hij.", "Hand 3:8": "En hij, opspringend, stond overeind en liep, en ging met hen de tempel in, lopend en springend, en God lovend.", "Num 25:3": "Toen Israël zich koppelde aan Baäl-peor, ontstak de toorn van de HEERE tegen Israël.", "Ps 97:9": "Want U, HEERE, bent de Allerhoogste over de hele aarde; U bent zeer hoog verheven boven alle goden.", "Gen 6:22": "En Noach deed het; naar alles wat God hem geboden had, zo deed hij.", "Tit 1:2": "In de hoop van het eeuwige leven, dat God, Die niet liegen kan, beloofd heeft vóór de tijden der eeuwen, maar geopenbaard heeft op Zijn tijd;", "Matt 26:30": "En toen zij de lofzang gezongen hadden, gingen zij naar de Olijfberg.", "Ps 87:1-6": "Een psalm, een lied voor de kinderen van Korach. Zijn grondslag is op de bergen van heiligheid. De HEERE heeft de poorten van Sion lief, boven alle woningen van Jakob. Zeer heerlijke dingen worden van u gesproken, o stad van God! Sela.", "Job 6:10": "Dat zou nog mijn troost zijn, en zou mij verkwikken in de weedom, zo Hij niet spaarde; want ik heb de redenen van de Heilige niet verborgen gehouden.", "Ps 117:2": "Want Zijn goedertierenheid is machtig over ons, en de waarheid van de HEERE is er voor eeuwig! Halleluja!", "Ezech 14:22": "Doch zie, daarin zullen mensen die ontkomen zijn overblijven, die uitgevoerd zullen worden, zonen en dochters; zie, zij zullen tot u uitkomen, en u zult hun weg zien en hun handelingen; en u zult vertroost worden over het kwaad dat Ik over Jeruzalem gebracht zal hebben, ja, al wat Ik over haar zal hebben gebracht.", "1 Kron 16:29": "Geeft de HEERE de eer van Zijn Naam, brengt offer, en komt voor Zijn aangezicht; aanbidt de HEERE in de heerlijkheid van het heiligdom.", "Matt 18:13": "En als het gebeurt dat hij het vindt, voorwaar, Ik zeg u, dat hij zich meer verblijdt over dat schaap dan over de negenennegentig die niet afgedwaald zijn.", "Jes 62:3": "En u zult een sierlijke kroon zijn in de hand van de HEERE, en een koninklijke hoed in de hand van uw God.", "Ps 56:5": "In God zal ik Zijn woord prijzen; ik vertrouw op God, ik zal niet vrezen; wat zou vlees mij doen?", "Jes 57:2": "Hij zal ingaan in de vrede; zij zullen rusten op hun slaapsteden, ieder die in zijn oprechtheid gewandeld heeft.", "Ps 28:8": "De HEERE is hun Sterkte, en Hij is de Sterkheid van de verlossingen van Zijn Gezalfde.", "Ps 56:13": "O God! Op mij zijn Uw geloften; ik zal U dankzeggingen vergelden;", "Jes 6:1-5": "In het jaar dat koning Uzzia stierf, zag ik de Heere zitten op een hoge en verheven troon, en Zijn zomen vulden de tempel. De serafs stonden boven Hem; ieder had zes vleugels; met twee bedekte ieder zijn gezicht, en met twee bedekte hij zijn voeten, en met twee vloog hij. En de een riep tot de ander en zei: Heilig, heilig, heilig is de HEERE van de heerscharen! De hele aarde is vol van Zijn heerlijkheid!", "Ps 19:9": "De bevelen van de HEERE zijn recht, en verblijden het hart; het gebod van de HEERE is zuiver, en verlicht de ogen.", "2 Kor 5:5": "Die ons nu hiertoe klaargemaakt heeft, is God, Die ons ook het onderpand van de Geest gegeven heeft.", "Ps 37:39": "Thau. Toch is het heil van de rechtvaardigen van de HEERE; hun Sterkte in de tijd van benauwdheid.", "Jes 43:11": "Ik, Ik ben de HEERE, en er is geen Heiland behalve Mij.", "Ps 16:1": "Een gouden kleinood van David. Bewaar mij, o God! Want ik vertrouw op U.", "Ps 17:15": "Maar ik zal Uw aangezicht in gerechtigheid aanschouwen, ik zal verzadigd worden met Uw beeld, als ik zal ontwaken.", "1 Kor 1:18": "Want het woord van het kruis is voor hen die verloren gaan wel dwaasheid; maar voor ons, die behouden worden, is het een kracht van God;", "Ps 119:81": "Caph. Mijn ziel is bezweken van verlangen naar Uw heil; op Uw woord heb ik gehoopt.", "Deut 9:14": "Laat Mij begaan, dat Ik hen verdelg, en hun naam van onder de hemel uitwis; en Ik zal u tot een machtiger en groter volk maken dan dit is.", "Fil 2:11": "En elke tong zou belijden dat Jezus Christus de Heere is, tot heerlijkheid van God de Vader.", "Gal 4:29": "Maar zoals destijds hij die naar het vlees geboren was, hem vervolgde die naar de Geest geboren was, zo is het ook nu.", "Ef 4:7": "Maar aan ieder van ons is de genade gegeven, naar de maat van de gave van Christus.", "Gen 19:16": "Maar hij aarzelde; toen grepen die mannen zijn hand, en de hand van zijn vrouw, en de hand van zijn twee dochters, omdat de HEERE hem genadig was; en zij brachten hem naar buiten, en zetten hem buiten de stad ne
