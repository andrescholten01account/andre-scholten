laten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Verder zei de HEERE tegen mij: Neem u een grote rol, en schrijf daarop met een gewone schrijfstift: Haastende tot de roof, is hij spoedig tot de buit!","2":"Toen nam ik mij betrouwbare getuigen, Uria, de priester, en Zacharia, de zoon van Jeberechja.","3":"En ik was tot de profetes genaderd, die werd zwanger en baarde een zoon; en de HEERE zei tegen mij: Noem zijn naam Maher-Schalal, Chazbaz.","4":"Want voordat dat jongetje kan roepen: Mijn vader! of: mijn moeder!, zal men de rijkdom van Damaskus en de buit van Samaria wegdragen voor de koning van Assur.","5":"En de HEERE sprak nog verder tegen mij en zei:","6":"Omdat dit volk het water van Siloa veracht, dat zachtjes stroomt, en er vreugde is bij Rezin en de zoon van Remalia,","7":"daarom, zie, zal de Heere over hen laten opkomen dat sterke en geweldige water van de rivier, de koning van Assyrië en al zijn heerlijkheid; en hij zal opkomen over al zijn stromen, en overgaan over al zijn oevers;","8":"en hij zal doortrekken in Juda, hij zal het overstromen en er doorgaan, hij zal tot aan de hals reiken; en de uitgestrektheid van zijn vleugels zal de breedte van uw land vullen, o Immanuël!","9":"Verzamel u samen, volken! Toch zult u verbroken worden; en neem het ter ore, allen die in verre landen bent, omgord u, toch zult u verbroken worden; omgord u, toch zult u verbroken worden!","10":"Beraadslaag een plan, toch zal het vernietigd worden; spreek een woord, toch zal het niet standhouden; want God is met ons!","11":"Want zo heeft de HEERE tegen mij gezegd, met een sterke hand, en Hij onderwees mij om niet te wandelen op de weg van dit volk, en zei:","12":"U zult niet zeggen: Een samenzwering, van alles waar dit volk van zegt: Het is een samenzwering; en vrees u hun vrees niet, en wees niet verschrikt.","13":"De HEERE van de heerscharen[1], Die zult u heiligen, en Hij zij uw vrees, en Hij zij uw verschrikking.","14":"Dan zal Hij *u* tot een Heiligdom zijn; maar tot een steen des aanstoots en tot een rots der struikeling voor de twee huizen van Israël, tot een strik en tot een net voor de inwoners van Jeruzalem.","15":"En velen onder hen zullen struikelen, en vallen, en verbroken worden, en zullen verstrikt en gevangen worden.","16":"Bind de getuigenis toe; verzegel de wet onder mijn leerlingen.","17":"Daarom zal ik de HEERE verwachten, Die Zijn aangezicht verbergt voor het huis van Jakob, en ik zal Hem verwachten.","18":"Zie, ik en de kinderen die de HEERE mij gegeven heeft, zijn tot tekenen en tot wonderen in Israël, van de HEERE van de heerscharen[1], Die op de berg Sion woont.","19":"Wanneer zij dan tegen u zeggen zullen: Vraag waarzeggers en duivelskunstenaars, die daar piepen en binnensmonds mompelen; *zo zeg*: Zal een volk niet zijn God vragen? Zal men voor de levenden de doden *vragen*?","20":"Tot de wet en tot de getuigenis! Als zij niet spreken naar dit woord, zal het zijn dat zij geen dageraad zullen hebben.","21":"En ieder van hen zal daar doorgaan, hard gedrukt en hongerig; en het zal gebeuren, wanneer hem hongert en hij zeer toornig zal zijn, dan zal hij vloeken op zijn koning en op zijn God, als hij opwaarts zal zien;","22":"als hij de aarde aanschouwen zal, zie, dan zal er benauwdheid en duisternis zijn; hij zal verduisterd zijn door angst, en voortgedreven door donkerheid.","23":"Maar *het land* dat beangstigd was, zal niet *helemaal* verduisterd worden; zoals Hij het in de eerste tijd verachtelijk gemaakt heeft, naar het land van Zebulon toe en naar het land van Nafthali toe, zo heeft Hij het in het laatste heerlijk gemaakt, naar de weg zeewaarts toe *gelegen* over de Jordaan, aan Galilea van de heidenen."},"SV":{"1":"Verder zeide de HEERE tot mij: Neem u een grote rol, en schrijf daarop met eens mensen griffel: Haastende tot den roof, is hij spoedig tot den buit!","2":"Toen nam ik mij getrouwe getuigen, Uria, den priester, en Zacharia, den zoon van Jeberechja.","3":"En ik was tot de profetesse genaderd, die werd zwanger, en baarde een zoon; en de HEERE zeide tot mij: Noem zijn naam MAHER-SCHALAL, CHAZBAZ.","4":"Want eer dat knechtje zal kunnen roepen: Mijn vader! of, mijn moeder! zal men den rijkdom van Damaskus, en den buit van Samaria dragen voor het aangezicht van den koning van Assur.","5":"En de HEERE sprak nog verder tot mij, zeggende:","6":"Dewijl dit volk veracht de wateren van Siloa, die zachtjes gaan, en er vreugde is bij Rezin en den zoon van Remalia;","7":"Daarom ziet, zo zal de Heere over hen doen opkomen die sterke en geweldige wateren der rivier, den koning van Assyrië en al zijn heerlijkheid; en hij zal opkomen over al zijn stromen, en gaan over al zijn oevers;","8":"En hij zal doortrekken in Juda, hij zal het overstromen, en er doorgaan, hij zal tot aan den hals reiken; en de uitstrekkingen zijner vleugelen zullen vervullen de breedte uws lands, o Immanuël!","9":"Vergezelt u te zamen, gij volken! doch wordt verbroken; en neemt ter ore, allen gij, die in verre landen zijt, omgordt u, doch wordt verbroken; omgordt u, doch wordt verbroken!","10":"Beraadslaagt een raad, doch hij zal vernietigd worden; spreekt een woord, doch het zal niet bestaan; want God is met ons!","11":"Want alzo heeft de HEERE tot mij gezegd, met een sterke hand, en Hij onderwees mij van niet te wandelen op den weg dezes volks, zeggende:","12":"Gijlieden zult niet zeggen: Een verbintenis, van alles, waar dit volk van zegt: Het is een verbintenis; en vreest gijlieden hun vreze niet, en verschrikt niet.","13":"Den HEERE der heirscharen, Dien zult gijlieden heiligen, en Hij zij uw vreze, en Hij zij uw verschrikking.","14":"Dan zal Hij *ulieden* tot een Heiligdom zijn; maar tot een steen des aanstoots en tot een rotssteen der struikeling den twee huizen van Israël, tot een strik en tot een net den inwoners te Jeruzalem.","15":"En velen onder hen zullen struikelen, en vallen, en verbroken worden, en zullen verstrikt en gevangen worden.","16":"Bind de getuigenis toe; verzegel de wet onder mijn leerlingen.","17":"Daarom zal ik den HEERE verbeiden, Die Zijn aangezicht verbergt voor het huis van Jakob, en ik zal Hem verwachten.","18":"Ziet, ik en de kinderen, die mij de HEERE gegeven heeft, zijn tot tekenen en tot wonderen in Israël, van den HEERE der heirscharen, Die op den berg Sion woont.","19":"Wanneer zij dan tot ulieden zeggen zullen: Vraagt waarzeggers en duivelskunstenaars, die daar piepen, en binnensmonds mompelen; *zo* *zegt*: Zal niet een volk zijn God vragen? zal men voor de levenden de doden *vragen*?","20":"Tot de wet en tot de getuigenis! zo zij niet spreken naar dit woord, het zal zijn, dat zij geen dageraad zullen hebben.","21":"En een ieder van hen zal daar doorgaan, hard gedrukt en hongerig; en het zal geschieden, wanneer hem hongert, en hij zeer toornig zal zijn, dan zal hij vloeken op zijn koning en op zijn God, als hij opwaarts zal zien;","22":"Als hij de aarde aanschouwen zal, ziet, er zal benauwdheid en duisternis zijn; hij zal verduisterd zijn door angst, en voortgedreven door donkerheid.","23":"Maar *het* *land*, dat beangstigd was, zal niet *gans* verduisterd worden; gelijk als Hij het in den eersten tijd verachtelijk gemaakt heeft, naar het land van Zebulon aan, en naar het land van Nafthali aan, alzo heeft Hij het in het laatste heerlijk gemaakt, naar den weg zeewaarts aan *gelegen* over de Jordaan, aan Galilea der heidenen."},"KJV":{"1":"Moreover the LORD said unto me, Take thee a great roll, and write in it with a man's pen concerning Mahershalalhashbaz.","2":"And I took unto me faithful witnesses to record, Uriah the priest, and Zechariah the son of Jeberechiah.","3":"And I went unto the prophetess; and she conceived, and bare a son. Then said the LORD to me, Call his name Mahershalalhashbaz.","4":"For before the child shall have knowledge to cry, My father, and my mother, the riches of Damascus and the spoil of Samaria shall be taken away before the king of Assyria.","5":"The LORD spake also unto me again, saying,","6":"Forasmuch as this people refuseth the waters of Shiloah that go softly, and rejoice in Rezin and Remaliah's son;","7":"Now therefore, behold, the Lord bringeth up upon them the waters of the river, strong and many, *even* the king of Assyria, and all his glory: and he shall come up over all his channels, and go over all his banks:","8":"And he shall pass through Judah; he shall overflow and go over, he shall reach *even* to the neck; and the stretching out of his wings shall fill the breadth of thy land, O Immanuel.","9":"Associate yourselves, O ye people, and ye shall be broken in pieces; and give ear, all ye of far countries: gird yourselves, and ye shall be broken in pieces; gird yourselves, and ye shall be broken in pieces.","10":"Take counsel together, and it shall come to nought; speak the word, and it shall not stand: for God","11":"For the LORD spake thus to me with a strong hand, and instructed me that I should not walk in the way of this people, saying,","12":"Say ye not, A confederacy, to all *them to* whom this people shall say, A confederacy; neither fear ye their fear, nor be afraid.","13":"Sanctify the LORD of hosts himself; and *let* him *be* your fear, and *let* him *be* your dread.","14":"And he shall be for a sanctuary; but for a stone of stumbling and for a rock of offence to both the houses of Israel, for a gin and for a snare to the inhabitants of Jerusalem.","15":"And many among them shall stumble, and fall, and be broken, and be snared, and be taken.","16":"Bind up the testimony, seal the law among my disciples.","17":"And I will wait upon the LORD, that hideth his face from the house of Jacob, and I will look","18":"Behold, I and the children whom the LORD hath given me *are* for signs and for wonders in Israel from the LORD of hosts, which dwelleth in mount Zion.","19":"And when they shall say unto you, Seek unto them that have familiar spirits, and unto wizards that peep, and that mutter: should not a people seek unto their God? for the living to the dead?","20":"To the law and to the testimony: if they speak not according to this word, *it is* because *there is* no light","21":"And they shall pass through it, hardly bestead and hungry: and it shall come to pass, that when they shall be hungry, they shall fret themselves, and curse their king and their God, and look upward.","22":"And they shall look unto the earth; and behold trouble and darkness, dimness of anguish; and *they shall be* driven to darkness.","23":"Nevertheless the dimness *shall* not *be* such as *was* in her vexation, when at the first he lightly afflicted the land of Zebulun and the land of Naphtali, and afterward did more grievously afflict *her by* the way of the sea, beyond Jordan, in Galilee of the nations."}},"tsk":{"1":[{"kopje":"Neem u","refs":["Jer 36:2","Jer 36:28","Jer 36:32"]},{"kopje":"schrijf","refs":["Jes 30:8","Job 19:23","Job 19:24","Hab 2:2","Hab 2:3"]},{"kopje":"een gewone schrijfstift","refs":["Openb 13:18","Openb 21:17"]}],"2":[{"kopje":"nam ik mij","refs":["Ruth 4:2","Ruth 4:10","Ruth 4:11","2 Kor 13:1"]},{"kopje":"Uria","refs":["2 Kon 16:10","2 Kon 16:11","2 Kon 18:2"]}],"3":[{"kopje":"de profetes","refs":["Richt 4:4","2 Kon 22:14"]},{"kopje":"werd zwanger","refs":["Hos 1:3-9"]},{"kopje":"Noem zijn naam","refs":["Jes 7:13","Jes 7:14","Jes 8:1"]}],"4":[{"kopje":"voordat","refs":["Jes 7:15","Jes 7:16","Deut 1:39","Jona 4:11","Rom 9:11"]},{"kopje":"de rijkdom van Damaskus","refs":["Jes 10:6-14","Jes 17:3","2 Kon 15:29","2 Kon 16:9","2 Kon 17:3","2 Kon 17:5","2 Kon 17:6"]}],"5":[{"kopje":"sprak","refs":["Jes 7:10"]}],"6":[{"kopje":"veracht","refs":["1 Kon 7:16","2 Kron 13:8-18" ass=\"wl wl-kjv\" data-code=\"H7457\">hungry:</span> and it shall come to pass, that when they shall be <span class=\"wl wl-kjv\" data-code=\"H7456\">hungry,</span> they shall <span class=\"wl wl-kjv\" data-code=\"H7107\">fret</span> themselves, and <span class=\"wl wl-kjv\" data-code=\"H7043\">curse</span> their <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> and their <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and <span class=\"wl wl-kjv\" data-code=\"H6437\">look</span> upward.","22":"And they shall <span class=\"wl wl-kjv\" data-code=\"H5027\">look</span> unto the <span class=\"wl wl-kjv\" data-code=\"H776\">earth;</span> and behold <span class=\"wl wl-kjv\" data-code=\"H6869\">trouble</span> and <span class=\"wl wl-kjv\" data-code=\"H2825\">darkness,</span> <span class=\"wl wl-kjv\" data-code=\"H4588\">dimness</span> of <span class=\"wl wl-kjv\" data-code=\"H6695\">anguish;</span> and they shall be <span class=\"wl wl-kjv\" data-code=\"H5080\">driven</span> to darkness.","23":"Nevertheless the <span class=\"wl wl-kjv\" data-code=\"H4155\">dimness</span> shall not be such as was in her <span class=\"wl wl-kjv\" data-code=\"H4164\">vexation,</span> <span class=\"wl wl-kjv\" data-code=\"H6256\">when</span> at the <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> he lightly <span class=\"wl wl-kjv\" data-code=\"H7043\">afflicted</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H2074\">Zebulun</span> and the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H5321\">Naphtali,</span> and <span class=\"wl wl-kjv\" data-code=\"H314\">afterward</span> did more grievously <span class=\"wl wl-kjv\" data-code=\"H3513\">afflict</span> her by the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea,</span> <span class=\"wl wl-kjv\" data-code=\"H5676\">beyond</span> <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan,</span> in <span class=\"wl wl-kjv\" data-code=\"H1551\">Galilee</span> of the nations."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"rol,","tekst":"Van het woord rol zie de aantekening Ezr 6:2 ; zie ook Isa 34:4 , en vergelijk Hab 2:2 ; Rev 5:1 ."},{"catchword":"met eens mensen griffel","tekst":"Dat is, met een schrift, hetwelk een ieder kan lezen, of naar de wijze, die in het gebruik is, of naar den algemenen stijl of gewoonte."},{"catchword":"Haastende","tekst":"Anders: belangende MAHER SCHALAL CHAS BAZ, dat is, aangaande zulks als de naam, dien gij uw jongen zoon, als hij zal geboren zijn, geven zult, betekent."},{"catchword":"spoedig","tekst":"De zin is: De koning van Assyrië zal haast komen, en hij zal de Syriërs en de Israëlieten beroven. Zie de vervullling dezer profetie 2Ki 16:9 . De zaak, die de naam van den zoon des profeets Jesaja beduidt, wordt hier gesteld."}],"2":[{"catchword":"getrouwe","tekst":"Of, geloofwaardige getuigen. Hebreeuws, ik deed mij betuigen getrouwe getuigen; vergelijk Jer 32:10 ; dat is, zodanige mannen, die getuigen kunnen dat de profeet deze profetie gedaan had, opdat het hierna niemand zou kunnen loochenen of in twijfel trekken."},{"catchword":"den zoon van Jeberechja","tekst":"Dit wordt hier bijgevoegd tot onderscheiding van verscheidene andere personen van aanzien, die ook dezen naam gehad hebben; gelijk te zien is 2Ki 14:29 , en 2Ch 24:20 , en 2Ch 26:5 , en Ezr 5:1 , en Ezr 6:14 ; Luk 1:5 , Luk 1:67 ."}],"3":[{"catchword":"de profetesse","tekst":"Dat is, tot mijne huisvrouw, aldus genoemd vanwege het ambt van haren man. Of, omdat zij mede ene profetes was."},{"catchword":"genaderd,","tekst":"Dat is, in de slaapkamer gegaan. Hiermede wordt eerbaarlijk te kennen gegeven de bijslaap van den profeet met zijne huisvrouw."},{"catchword":"MAHER-SCHALAL, CHAZ-BAZ","tekst":"Zie boven vs.1."}],"4":[{"catchword":"dat knechtje","tekst":"Of, dezen jongen, te weten de jongste zoon van den profeet, vs.3."},{"catchword":"zal kunnen roepen","tekst":"Dat is, in korten tijd, want als de kinderen een jaar of twee oud zijn, zo roepen zij met gebroken woorden hun vader en moeder. Samaria en Syrië zijn door de Assyriërs, een jaar of twee na deze profetie, overheerd en verwoest geweest."},{"catchword":"Damaskus,","tekst":"Damaskus was de hoofdstad van Syrië, boven Isa 7:8 ."},{"catchword":"den buit","tekst":"Merk wel dat de profeet hier zegt dat de koning van Assyrië den buit van Samaria zou wegnemen, maar hij zegt niet dat hij de stad zou innemen. Zie 2Ki 15:29 , en 2Ki 16:9 ."},{"catchword":"Samaria","tekst":"Samaria was de hoofdstad van het koninkrijk van Israël, boven Isa 7:9 ."},{"catchword":"voor het aangezicht","tekst":"Dat is, in zijne tegenwoordigheid en tot zijn best."}],"5":[{"catchword":"de HEERE","tekst":"Hebreeuws, de Heere voer voort tot mij te spreken."}],"6":[{"catchword":"Dewijl","tekst":"Alsof hij zeide: Omdat dit volk veracht de belofte der goddelijke hulp tegen die beide koningen [van wie boven Isa 7 gesproken is] en zich liever op de grote macht van Assyrië wil verlaten, zich inbeeldende dat de hulp, die Ik hun beloofd heb, maar een klein beekje is, gelijk de beek Siloa, maar dat de hulp der Assyriërs is als een geweldige stroom; zo zal Ik hen door de Assyriërs plagen en verderven, gelijk in vs.7 gezegd wordt."},{"catchword":"dit volk","tekst":"Te weten het Joodse volk, of immers een groot deel van hetzelve; te weten die den woorden Gods geen geloof geven. Want onder dit volk waren nog enige vromen en godzaligen, die de Heere zijne leerjongeren noemt, onder vs.16."},{"catchword":"de watere","tekst":"Dit was een waterbeek te Jeruzalem, waar een fontein uitsproot. Zie Psa 46:5 , en Joh 9:7 ."},{"catchword":"die zachtjes gaan,","tekst":"Zie de aantekening Neh 2:13 ."},{"catchword":"er vreugde is","tekst":"Dat is, middelerwijl dat deze beide koningen vrolijk zijn, de vaste hoop hebbende dat zij het Joodse land zullen overweldigen; zo zie, enz. gelijk volgt vs.7."}],"7":[{"catchword":"over hen","tekst":"Te weten over de ongelovige Joden, zie vs.6."},{"catchword":"die sterke","tekst":"Te weten de wateren van de rivier Eufraat. Dit is ene tegenstelling tegen de wateren van Siloa, vs.6."},{"catchword":"al zijn heerlijkheid;","tekst":"Dat is, al zijn voortreffelijke vorsten en krijgsoversten met hun onderhebbend volk, waar de koning van Assyrië van roemt; Isa 10:8 , Isa 10:13 ."},{"catchword":"hij zal opkomen","tekst":"Dat is, hij zal zich verheffen, te weten Sanherib, de koning van Assyrië, van wien de profeet hier spreekt als van een grote rivier. Anders: zij zal opkomen, te weten de rivier."},{"catchword":"zijn stromen . . . zijn oevers","tekst":"Te weten het volk, of hunne, te weten volkeren."}],"8":[{"catchword":"doortrekken","tekst":"Hebreeuws, veranderen; te weten van plaats."},{"catchword":"in Juda,","tekst":"Dat is, door het Joodse land."},{"catchword":"het","tekst":"Te weten het Joodse land."},{"catchword":"overstromen,","tekst":"Dat is, hij zal alle vaste steden in Juda zo haastelijk overvallen en innemen, alsof zijn leger een waterstroom ware. Zie de volvoering door Sanherib ten tijde van Hizkia, 2Ki 18 ."},{"catchword":"tot aan den hals","tekst":"Dat is, totdat hij de hoofdstad, te weten Jeruzalem, belegere en benauwe. Zie 2Ki 18:17 . Doch men kan dit ook verstaan gesproken te zijn van den uitersten nood waarin de Joden vervallen zouden, alzo namelijk dat er weinig aan ontbreken zou, of zij zouden altegaar verloren gaan."},{"catchword":"de uitstrekkingen","tekst":"Dat is, de verscheidene delen van zijn leger. Men noemt nog heden ten dage vleugels de delen der legers."},{"catchword":"o Immanuël","tekst":"Of, o Gij God, die met ons zijt; aldus wordt Christus de Zoon Gods genoemd, die het hoofd zijner kerk is, welke te dien tijde in het land van Juda was. Zie boven Isa 7:14 ."}],"9":[{"catchword":"Vergezelt","tekst":"Dit is ene aanspraak tot den koning van Assyrië en de andere natiën, die zich met hem tegen de Joden, of de kerk Gods, doch inzonderheid tegen de stad Jeruzalem verbonden hadden; tegelijk is het ene voorzegging tot troost der vromen, dat de Assyriërs Jeruzalem wel zouden willen belegeren, maar dat zij die stad en het koninkrijk van Juda niet zouden overweldigen, gelijk zij voorgenomen hadden, maar dat zij met schande daarvan zouden moeten trekken. Het is een heilige ironie, of bespotting, alsook in vs.10. Zie de vervulling dezer profetie 2Ki 19:35 ."},{"catchword":"wordt verbroken;","tekst":"Of, terneder gesmeten, of verpletterd, en zo in het volgende. Zie Isa 7:7 ."},{"catchword":"allen gij,","tekst":"Hebreeuws, alle verheden des lands, of der aarde."},{"catchword":"omgordt u,","tekst":"Te weten met uw harnas en zwaard, dat is, bereidt u ten oorlog."},{"catchword":"doch wordt verbroken;","tekst":"De zin is: Doet al wat gij kunt, het zal al vergeefs zijn, gij zult niets uitrichten, aangezien Immanuel, dat is God, met ons is."}],"10":[{"catchword":"Beraadslaagt","tekst":"Te weten, hoe gij het Joodse land zult overmeesteren."},{"catchword":"het zal niet bestaan;","tekst":"Gelijk boven Isa 7:7 ."},{"catchword":"God is met ons","tekst":"De profeet ziet op den naam van Immanuel, den Zoon Gods gegeven, boven Isa 7:14 , en hier vs.8. En hij wil hier te kennen geven dat Christus, die de beschutter en beschermer zijner kerk is, het koninkrijk van Juda beschermen zou, dewijl Hij besloten had uit dien stam zijn menselijke natuur aan te nemen, eer dat al het bestuur ganselijk van Juda weggenomen zou zijn en blijven. Eenigen zetten het over: Want [hier is] Immanuel."}],"11":[{"catchword":"een sterke hand,","tekst":"Hebreeuws, met sterking, of aangrijping der hand. Waardoor men kan verstaan de krachtige werking van den Geest Gods in den profeet en degenen, die hem volgen zouden."},{"catchword":"van niet te wandelen","tekst":"Dat is, dat ik en de godzalige Joden, de zeden en manieren van doen van dit volk, te weten van het merendeel des volks te Jeruzalem, dewijl het goddeloos is, niet zouden navolgen, mistrouwende de belofte van God, en ons meer verlatende op menselijke dan op goddelijke hulp, gelijk zij doen."}],"12":[{"catchword":"Gijlieden","tekst":"Te weten, gij Jesaja en gij allen, die den Heere vreest, zult niet straks zeggen, gelijk de meeste hoop van dit volk; wij willen een verbond maken met den koning van Assyrië tegen die andere koningen, die ons dreigen en kwellen, zich daarop zozeer verlatende, dat zij de belofte van God klein achten, ja versmaden."},{"catchword":"dit volk","tekst":"Te weten deze boze ongelovige Joden, die de belofte van God verachten."},{"catchword":"een verbintenis;","tekst":"Of, gelijk men nu spreekt: een ligue (verbond)."},{"catchword":"en vreest gijlieden","tekst":"Dat is, vreest niet hetgeen waarmede zij u zoeken te verschrikken. Of vreest niet gelijk dit volk doet."},{"catchword":"hun vreze niet,","tekst":"Te weten van dit volk, hetwelk zeer bevreesd is voor die grote macht dier beide koningen. Zie boven Isa 7:2 ."},{"catchword":"verschrikt niet","tekst":"Anders: vervaart [de anderen] niet."}],"13":[{"catchword":"gijlieden","tekst":"Te weten gijlieden die gelovig zijt en u ganselijk op Gods beloften verlaat."},{"catchword":"heiligen,","tekst":"Dat is, dienen, gelijk men schuldig is zulk een heiligen God te dienen, te weten met kinderlijke vreze en vertrouwen, niet twijfelende aan zijne beloften. Dit is te verstaan van den Heere Christus, die hier genoemd wordt de HEERE der heirscharen, van wien wijders in het volgende gesproken wordt."},{"catchword":"Hij zij uw vreze,","tekst":"Dat is, Hij is het, dien gij vrezen moet en voor wien gij te verschrikken hebt, als gij Hem vertoornd hebt."}],"14":[{"catchword":"Dan zal Hij","tekst":"De Heere Christus zal ulieden ook heiligen door zijn bloed en Geest, en voorts ulieder eer en troost, toevlucht en bescherming zijn, waarvan het uiterlijk heiligdom een teken was."},{"catchword":"den twee huizen","tekst":"Dat is de twee koninkrijken, te weten van Juda en van de tien stammen. Doch versta dit alzo, dat de gelovigen dier beide koninkrijken hieronder niet begrepen zijn."},{"catchword":"Israël,","tekst":"Dat is, van het volk Israël."}],"15":[{"catchword":"velen","tekst":"Te weten der Israëlieten."},{"catchword":"onder hen","tekst":"Anders: velen zullen aan dezelve, of tegen dezelve, te weten steen of rotssteen, of net en strik. Of, velen derzelven zullen sneuvelen."},{"catchword":"vallen,","tekst":"Te weten aanlopende en zich stotende aan dien steen. Want dewijl zij de aangeboden genade des Heeren door ongeloof zouden verwerpen, zo zou hun dezelve tot grotere verdoemenis strekken."}],"16":[{"catchword":"Bind","tekst":"Dit is een vervolg of aanhangsel der woorden Gods, vs.11, en wat hier staat, dat beveelt God, te weten Christus, de Zoon Gods, den profeet Jesaja. De zin is: Dat de getuigenis en de leer, die God liet verkondigen, aangaande zijne genade en bij name van den Messias, allen goddelozen en ongelovigen als een toegebonden, verzegeld en gesloten boek of brief zou zijn, en alleen van die zou verstaan en aangenomen worden, die als zijn ware discipelen, van Hem inwendig geleerd en verlicht zouden zijn door de kracht des Heiligen Geestes. Zie Isa 29:11 , en Isa 54:13 ; Jer 31:34 ; Joh 6:45 ."},{"catchword":"de wet","tekst":"Of, de leer."},{"catchword":"onder mijn leerlingen","tekst":"Anders: onder degenen, die van mij geleerd zijn."}],"17":[{"catchword":"Daarom zal ik","tekst":"Te weten, omdat de Heere tot mij gesproken heeft, enz. vs.11. Alsof hij zeide: Ik wil vast op den Heere staan, en mij op zijne beloften zekerlijk verlaten."},{"catchword":"Die Zijn aangezicht","tekst":"Dat is, die, rechtvaardiglijk vertoornd zijnde, zijne weldadigheid den goddelozen Joden ontnomen heeft, terwijl Hij hen straffen wil."}],"18":[{"catchword":"Ziet,","tekst":"Dit zijn de woorden van Christus, [gelijk klaarlijk blijkt uit Heb 2:13 ] ; die hier den profeet troost en versterkt tegen den haat der boze mensen, met zijn eigen voorbeeld, alsof Hij zeide: Wedervaart mij zelfs die schande in mijn persoon, in de bediening van mijn leerambt, zo laat het u, o Jesaja, geen wonder geven dat u smaad en spijt wordt aangedaan."},{"catchword":"kinderen,","tekst":"Te weten, die uit God geboren zijn, die naarstiglijk mijn woord horen en betrachten."},{"catchword":"de HEERE","tekst":"Dat is, God de Vader, verwekkende in hen door mijne predikatie en de werking van den Heiligen Geest het geloof en gehoorzaamheid."},{"catchword":"gegeven heeft,","tekst":"Te weten om te onderwijzen en te verlossen, Joh 6:37 , en Joh 17:12 . Want hier spreekt Christus."},{"catchword":"zijn tot tekenen","tekst":"Dat is, velen hebben een afkeer van ons en haten ons, omdat hunne goddeloosheid door ons gestraft wordt."},{"catchword":"in Israël,","tekst":"Dat is, onder de Israëlieten."}],"19":[{"catchword":"Wanneer","tekst":"Dit zijn nog de woorden Gods tot Jesaja en tot de godvrezende Joden."},{"catchword":"zij dan","tekst":"Te weten, de ongelovige Joden, of Jeruzalemmers."},{"catchword":"tot ulieden","tekst":"Te weten tot u, Jesaja en tot andere godzaligen, die in den waren God geloven."},{"catchword":"Vraagt","tekst":"Te weten, hoe gij en wij van de vijanden zullen verlost worden. Zie van de waarzeggers Lev 19:31 , en Lev 20:6 ."},{"catchword":"piepen,","tekst":"Of, kirren."},{"catchword":"binnensmonds","tekst":"Of, popelen; dat is, die hunne voorzeggingen met een duistere, onverstaanbare stem voortbrengen."},{"catchword":"Zal men","tekst":"De zin is: Zullen zij, die leven, voor zichzelven den doden vragen, gelijk Saul gedaan heeft, 1Sa 18:11 ? Hij wil zeggen dat zulks den kinderen Gods geenszins betaamt. Anders aldus: Vraagt niet een volk zijnen goden? voor de levenden de doden? verstaande dat het zij ene bestraffing van de ongerijmdheid der afgodendienaars, die den doden afgoden vragen tot voordeel van de levenden."}],"20":[{"catchword":"Tot de wet","tekst":"Dat is, tot de boeken van Mozes. Zie Luk 16:29 ."},{"catchword":"de getuigenis","tekst":"Dat is, tot de openbaringen, die God den profeten gedaan heeft; te weten, zal men gaan om te vragen."},{"catchword":"Zo zij niet","tekst":"Dat is, indien zij Mozes en de ware profeten niet willen horen en zich naar hunne leer schikken."},{"catchword":"geen dageraad","tekst":"Of, geen licht. Het Hebreeuwse woord betekent eigenlijk den dageraad; dat is het aanbrekende licht, als de zon begint op te gaan, hetwelk meer schemering dan dag is. Dat is, zij zullen het hemelse licht en het rechte verstand der verborgenheden van God, alsook zijner genade, niet deelachtig worden; maar met allerlei geestelijke en lichamelijke ellenden gestraft worden. Zie Job 18:18 ; Psa 84:12 . Anders: [zo is het] omdat er geen dageraad bij hen is. Anders: zo niet, laat hen naar dat woord spreken, dat geen dageraad heeft; dat is, die het woord der profeten verachten en alzo doen blijken dat zij geen hemelse verlichting hebben, laat die spreken naar het woord der waarzeggers of duivelskunstenaars."},{"catchword":"zullen hebben","tekst":"Hebreeuws, bij hem, of in hem; dat is, bij geen van hen allen. Hij spreekt van al de goddeloze Israëlieten als van een geheel. Alzo ook vs.21,22."}],"21":[{"catchword":"En een ieder","tekst":"Te weten omdat zij den raad Gods niet willen volgen."},{"catchword":"daar doorgaan,","tekst":"Te weten door het land van Juda en Israël hulp en troost zoekende. Het schijnt dat dit moet gepast zijn op de tijden van den koning Zedekia, toen de stad Jeruzalem van de Chaldeën is ingenomen. Zie 2Ki 25:6-7 ."},{"catchword":"vloeken","tekst":"Te weten omdat Hij hen niet beschut noch beschermd heeft."},{"catchword":"op zijn God,","tekst":"Te weten omdat Hij hen niet verhoord heeft, als zij Hem, op hunne wijze, aangeroepen hebben, namelijk door offeranden en beeldenverering. Anders: op zijne goden."},{"catchword":"als hij opwaarts","tekst":"Anders: en opwaarts zien; te weten, of hun enige hulp van God zou komen. Doch dit omhoog zien zou niet komen uit geloof, maar uit ongeduld, en door den uitersten nood daartoe gedrongen zijnde; gelijk 2Sa 22:42 ."}],"22":[{"catchword":"Als hij","tekst":"Anders: ook zal hij de aarde aanschouwen, en ziet, enz."},{"catchword":"hij zal verduisterd","tekst":"De zin is: Waar hij zich keert of wendt, hij zal hulp noch troost vinden."}],"23":[{"catchword":"Maar het land,","tekst":"Hier beginnen sommigen het negende hoofdstuk. Immers begint hier de profeet het volk te troosten, nadat hij het in de naastvoorgaande verzen door zware dreigementen verschrikt had; alsof hij zeide: Alhoewel God de Heere zijn land, dat is het land van Israël, zwaarlijk heeft aangetast, toen Hij het eerst door Tiglath Pileser [ 2Ki 15:29 ] heeft laten bederven en daarna nog zwaarder het ganse land aan de zee, en hetgeen over de Jordaan ligt, ja ook Galilea, dat aan de grenzen der heidenen strekt, door Salmanasser gestraft heeft, zo zal Hij nochtans niet toelaten dat het in de uiterste duisternis en ellende blijft, maar het volk, dat in duisternis zit, of wandelt, zal ten tijde van Christus heerlijk gemaakt worden, gelijk hier in het algemeen gezegd wordt, en daarna bijzonderlijk in Jes. 9."},{"catchword":"Hij het","tekst":"Te weten God de Heere."},{"catchword":"Zebulon aan,","tekst":"Versta hier door het land Zebulon en Nafthali het land der tien stammen, die de profeet hier noemt, omdat de verlossing eerst in dezelve begonnen is, te weten, door de predikatie van Christus; Mat 4:12-15 ."},{"catchword":"in het laatste","tekst":"Of, ten laatste, in de laatste tijden."},{"catchword":"zeewaarts","tekst":"Versta hier de Galilese zee, ander de zee Genezareth, of van Tiberias genoemd."},{"catchword":"over de Jordaan,","tekst":"Anders: aan deze zijde der Jordaan. Het Hebreeuwse woord betekent zo het een als het ander. Anders: omtrent de Jordaan."},{"catchword":"der heidenen","tekst":"Aldus genoemd omdat die van Tyrus, Sidon en andere heidense natiën westwaarts en andere oostwaarts daaraan grensden. Anders: aan het volkrijke Galilea, hetwelk is Neder Galilea , bij de zee Genezareth of van Tiberias gelegen, hetwelk volkrijk was, omdat het vruchtbaar was, gelijk te zien is Deu 33:23 . Zo van onder- en boven-Galilea, 1Ki 9:11, en Eze 47:8 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Moreover the LORD said unto me, Take thee a great roll, [Of the word roll, see the annotate. Ezra 6.2. see also below, ch.34.4. and compare Hab.2.2. Rev 5:1.] and write upon it with a mans pencils; [That is, write such a hand-writing, as every man may read, or according to the manner in use, or after the common style or custom] Hastening to the spoil, he is speedy to the prey. [Oth. Concerning MAHER SCHALAL CHAS-BAZ; that is, concerning that which the name which thou shalt give unto thy young son, when he shall be born, signifieth. The meaning is, the King of Assyria shall come speedily, and spoil or plunder the Syrians and the Israelites. See the accomplishment of this Prophecy, 2 Kings 16.9. The thing which the name of the Prophet Isaiah&acirc;&euro;&trade;s son signifieth, is here recorded.]"}],"2":[{"catchword":null,"tekst":"Then I took unto me faithful witnesses, [Or, credible witnesses. Heb. I caused faithful witnesses to bear witness unto me. Compare Jer 32:10. That is, such men as were able to bear witness, that the Prophet had made this Prophecy, that no man hereafter might deny it, or call it in question] Uria the Priest, and Zacharia the son of Jeherechia. [This is added here to distinguish him from other persons of quality, that have also had this name, as appeareth, 2 Kings 14.29. and 2 Chronicles 24.20. and 26.5. and Ezra 5.1. and 6.14. and Luke 1.verse 5, and 67.]"}],"3":[{"catchword":null,"tekst":"And I had drawn nigh the Prophetess, [That is, gone into the bed-chamber. Hereby is expressed in a modest way copulation of the Prophet with his wife. (unto the Prophetess) that is, unto my wife, so called, because of her husbands office and calling; or because she was likewise a Prophetess] which conceived and bare a son: and the LORD said unto me, Call his name MAHER-SCHALAL-CHAS-BAZ. [see above, v.1.]"}],"4":[{"catchword":null,"tekst":"For before that lad (or child) [Or, this youth, to wit, the Prophets young son, verse 3.] shall be able to cry, My father, or, My mother, the riches of Damascus [Damascus was the chief City of Syria, above, chap.7. vers.8.] and the prey of Samaria, [Samaria was the chief City of the Kingdom of Israel, above, chap.7. vers.9.] shall be carried (away) before the face of the King of Assar. [That is, in a short time; for when children are a year or two old, they begin with broken and imperfect words to call their father and mother. Samaria and Syria were subdued and wasted by the Assyrians about a year or two after this Prophecy. (shall the prey of Samaria, &c.) Observe well, that the Prophet here saith, that the King of Assyria should take or carry away the prey of Samaria, but he saith not, that he should take the city. See 2 Kings 15.29. and 16.9. (before the face of the King of Assur) That is, in his presence, and for his benefit.]"}],"5":[{"catchword":null,"tekst":"And the LORD spake yet further unto me, [Heb. The LORD went on to speak unto me] saying:"}],"6":[{"catchword":null,"tekst":"Forasmuch as this people [To wit, the people of the Jews, or at least-wise a great part of them; to wit, those that gave no credit to the Word of God. For among this people were yet some good and godly ones, whom the Lord calleth his disciples, below, v.16.] despise the waters of Siloah, [This was a water-brook in Jerusalem, out of which a fountains sprang. See Psal.46.5. and Joh.9.7.] that go softly, [see the annotate. Nehem.2.13.] and there is joy with Rezin, and the son of Remalia: [that is, in the mean while that these two Kings are weary, being confident that they should subdue the land of Juda: Therefore behold, &c. As followeth, vers.7. (Forasmuch as this people, &c.) as if he had said, because this people despise the promise of Gods help and assistance against those two Kings, (of whom mention is made above, verse 7.) and will rather rely upon the great power of Assyria, imagining that the help and assistance which I have promised them, is but a little brook, as the brook of Siloah is, but that the help of the Assyrians is as a mighty stream: therefore I will plague and destroy them by the Assyrians, as is said vers.7.]"}],"7":[{"catchword":null,"tekst":"Therefore behold, the LORD shall cause to come up upon them, [To wit, upon the unbelieving Jews. See vers.6.] those strong and mighty waters of the River, [To wit, the waters of the River Eupherates. This is in opposition to the waters of Siloah, vers.6.] the King of Assyria, and all his glory, [That is, all his Princes, and chief Captains, withal their men and souldiers, of whom the King of Assyria boasteth, Isai.10.vers.8,13.] and he shall come up [That is, he shall lift up himself; to wit, Sanherib King of Assyria, of whom the Prophet here speaketh as of a great River. Oth. It shall come up; to wit, the River] over all his streams; to wit, over the streams of the nations] and go over all his [To wit, the people&acirc;&euro;&trade;s; or, their; to wit, the nations] banks:"}],"8":[{"catchword":null,"tekst":"And he shall pass through [Hebr. Change; to wit, places] in Juda, [That is, through the Land of Juda] he shall overflow it, and go over it, [To wit, the Land of Juda. That is, he shall so speedily set upon, and conquer all the fenced Cities in Juda, as if his army were a flood or stream of Waters. See the accomplishment hereof by Sanherib in the days of Hizkia] he shall reach even to the neck: [That is, till he besiege and straiten the chief City; to wit, Jerusalem. See 2 Kings 18.17. But this may be also understood to be spoken of the great extremity, unto which the Jews should be brought, so that it should want but very little, but that they should all of them perish and be destroyed] and the stretching forth of his wings, [that is 3":[{"catchword":null,"tekst":"The LORD of hosts, him shall ye [To wit, ye that are believers and rely upon the promises of God] hallow, [that is, serve, as we are bound to serve so holy a God, to wit, with a child-like fear and confidence, not doubting of his promises. This is to be understood of the Lord Christ, who is called here, the LORD of hosts, of whom further mention is made in the sequel] and let him be your fear, and let him be your dread. [he is it whom ye ought to fear, and of whom ye ought to be afraid, when ye have provoked him to anger.]"}],"14":[{"catchword":null,"tekst":"Then shall he be for a sanctuary (unto you:) [The Lord Christ shall also sanctify you by his blood and spirit, and consequently be your glory and comfort, refuge and defence, of which the outward Sanctuary was a token] but for a stone of offence, and for a rock of stumbling unto the two houses of Israel, [that is, unto the two Kingdoms; to wit, of Juda, and the Kingdom of the ten tribes. But understand this so, as that the faithful of both those Kingdoms are not comprehended under the curse or judgement that is here threateneth and denounced. (of Israel) that is, of the people of Israel] for a snare, and for a net unto the inhabitants at Jerusalem."}],"15":[{"catchword":null,"tekst":"And many [To wit, of the Israelites] among them shall stumble, [Oth. Many shall stumble at the same, or, against the same; to wit, stone and rock, or net and snare: or many of them shall it stumble] and fall, [that is, running against, and stumbling at the stone] and he broken, and shall be ensnared and taken. [For inasmuch as they should through unbelief reject the grace of God offered unto them, therefore it should tend to their greater condemnation. Compare, Mat 21:44. Luk 20:18.]"}],"16":[{"catchword":null,"tekst":"Bind up the testimony; seal the law [Or, the doctrine] among my Disciples. [Oth. Among those that are taught by me. The words of this verse are a consequence or dependence on the words of God recorded in the 11th. verse. And that which is here laid down, the Lord, to wit, Christ, the Son of God, commandeth the Prophet Isaiah to do. The meaning is, that the testimony and the doctrine which God cause to be preached, concerning his grace and mercy, and in special concerning the Messiah, should be unto all wicked and unbelieving persons, as a Book or letter that is bound, sealed and shut, and should be onely understood and received by those, that as his true disciples and scholars should be inwardly taught and enlightened through him, by the power of the Holy Ghost. See Isa 29:11. and 54.13. Jer 31:34. Joh.6.45.]"}],"17":[{"catchword":null,"tekst":"Therefore I will wait upon the Lord, [To wit, because the Lord spake unto me, &c. V.11. As if he had said, I will strongly depend upon God, and will surely rely upon his promises] that hideth his face from the house of Jacob, [that is, who being justly provoked, hath with drawn his mercy from the wicked Jews, because he would punish them] and I will wait for him."}],"18":[{"catchword":null,"tekst":"Behold I and the children whom the LORD hath given me, are forsaken, and for wonders in Israel, from the LORD of hosts, which dwelleth on mount Zion. [These are the words of Christ, (as appeareth clearly out of Heb 2:13.) who here comforteth and strengtheneth the Prophet against the hatred of the wicked, by his own example; as if he had said, doth shame and reproach befall me in mine own person, in the administration of my prophetical office; then wonder not, O Isaiah, that reproach and malice is offered unto thee. (and the children) to wit, which are born of God, that diligently hear and meditate on my word. (whom the LORD hath given me) that is, God the Father, kindling and stirring up faith and obedience in them, by my preaching, and by the powerful working of the Holy Ghost. (are for tokens and wonders) that is, many do loath and abhor us, and hate us, because their wickedness is reproved by us. (in Israel) that is, among the Israelites.]"}],"19":[{"catchword":null,"tekst":"When they shall then say unto you, Inquire of the Sooth-sayers, and the Necromancers, that peep and mumble in the mouth: (then say) Shall not a people inquire of their God? Shall they inquire of the dead for the living? [These are still the words of God unto Isaiah, and to the godly Jews. (When they) to wit, the unbelieving Jews; or men of Jerusalem. (shall say unto you) to wit, unto thee, Isaiah, and other godly ones, that believe in the true God (Enquire of the sooth sayers, &c.) To wit, how you and we shall be delivered from the enemies. See of these sooth sayers, Levit.19.on vers.3. and 20. On vers.6. (that peep) Or, whisper, (and mumble in the mouth) Or, mutter; that is, that utter their predictions in a dark unintelligible voice (Shall they enquire of the dead for the living?) The meaning is, shall those that are alive, enquire of the dead for themselves? As Saul did, 1 Sam.chap.28. vers.11. Intimating, that this doth not become the children of God. Oth. Thus: doth not a people enquire of their Gods? For the living, of the dead? Meaning that it is a reproof of the absurdity of Idolaters, who enquire of dead Idols for the benefits of the living. See Deut.18.21.]"}],"20":[{"catchword":null,"tekst":"To the Law, [That is, to the books of Moses. See Luk 16:29.] and to testimony: [That is, to the testimony: [That is, to the revelations or discoveries, which the LORD hath made unto the Prophets; to wit, shall they go to enquire, or ask counsel] if they speak not according to this word, [That is, if they will not hear Moses and the true Prophets, and frame their lives according to their Doctrine] it shall be that they shall have no dawning day. [Or, no light. The Hebr. Word signifieth properly the day-spring, or day-dawning; that is, the light breaking forth, when the Sun beginneth to rise, which is rather a glimmering or twilight, then day. That is, they shall not be partakers of the heavenly light, and of the right understanding of divine mysteries, as also of the grace of God: but shall be punished with all kind of spiritual and temporal mysterical and temporal mysteries. See Job 18.on vers.18. Psal.84.on v.12. Oth. (then it is) because there is no day-spring with them. Oth. If not, let them speak according to that word, which hath no break of Day; that is, those that despise the word of the Prophets, and so make it appear, that they have no heavenly enlightening, let them speak according to the word of the sooth sayers, and of the Necromancers (they shall, &c.) Hebr. With him, or, in him: that is, with none of them all. He speaketh of all the wicked Israelites, as of one man. So likewise vers.21. and vers.22.]"}],"21":[{"catchword":null,"tekst":"And everyone of them shall pass through it, [To wit, through the Land of Juda and Israel, seeking for help and comfort. It seemeth that this must be applied to the days of King Zedekia, when the City of Jerusalem was taken by the Chaldeans, 2 Kings 25.6,7, etc.] pressed hard, and hungry; [To wit, because they will not follow the counsel of God] and it shall come to pass when he is hungry, and (when) he shall be very angry, then shall he curse his King, [To wit, because he did not defend or protect them] and his God, [To wit, because he heard them not, when they called upon him after their manner; namely by sacrifices and image worship. Oth. His Gods] when he shall look upward: [Oth. And look upward. To wit, to see whether any help would come unto them from God. But this looking upward should not proceed from faith, but from impatience, and being driven thereunto by the great extremity, as 2 Sam.22.42.]"}],"22":[{"catchword":null,"tekst":"When he shall look unto the earth, behold, there shall be distress and darkness: [Oth. Also he shall look, unto the earth, and behold, &c.] he shall be darkened through anguish, and driven on by darkness. [The meaning is, whithersoever he turneth or wideth himself, he shall find neither help nor comfort]"}],"23":[{"catchword":null,"tekst":"(8:23) But (the land) that was distressed, shall not be (utterly) darkened; according as He made it contemptible at the first toward the land of Zebulon, and toward the land of Naphtali: so did he at last make it glorious toward the way of the Sea (lying) beyond the Jordan, in Galilee of the Gentiles. [Here some do begin the nineth chapter: At least the prophet beginneth here to comfort the people, after that he had in the immediate fore-going verses terrified and affrighted them with sore and grievous threatening. As if he had said, Although the Lord hath grievously afflicted his land, that is, the land of Israel, when he suffered it first to be spoileth by Tiglath Pileser, 2 Kings 15.29. and afterward punished more grievously the whole land that lay by the Sea, and that part that lay beyond the Jordan, yea also Galilee, which was on the borders of the gentiles, by Salmanassar: Yet he will not suffer it to remain or continue in the uttermost darkness and misery; but the people that sitteth or walketh in darkness, shall in Christs time be made glorious; as here is affirmed in general, and afterward in particular in the following chapter. (He) to wit, the Lord. (toward the Land of Zebulon, and toward the land of Naphtali) Understand hereby the land of Zabulon, and by the land of Naphtali, the land of the ten tribes. Whom the priest here nameth, because the deliverance or redemption began first in them; to wit, by the preaching of Christ, Mat 4:12,13,14,15. (at last or, last of all, in the last times. (toward the way of the Sea) Understand here the Sea of Galilee, or the Galilean sea, called otherwise the Sea of Genezareth, or of Tiberias, (beyond the Jordan) oth. On this side Jordan. The Hebrew word signifieth both the one and the other. Oth. About the Jordan. (Galilee of the Gentiles) so called, because those of Tyre, Zidon, and other heathen Nations bordered on it westward, and others eastward. Oth. Populous Galilee; which is the nether Galilee, lying by the Sea of Genezareth or of Tiberias, which was very populous, because it was exceeding fruitful, as appeareth, Deut.33.23. See of the nether and upper Galilee, 1 Kings 9.on vers.11. and Ezech.47.on vers.8.]"}]}}};

(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
