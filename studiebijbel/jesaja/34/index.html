:"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Kom dichterbij, heidenvolken, om te horen, en volken, luister goed! Laat de aarde horen, en haar volheid, de wereld en alles wat daaruit voortkomt.","2":"Want de toorn van de HEERE is over alle heidenvolken, en grimmigheid over heel hun leger; Hij heeft hen met de ban geslagen, Hij heeft ze ter slachting overgegeven.","3":"En hun gesneuvelden zullen weggeworpen worden, en van hun dode lichamen zal hun stank opstijgen; en de bergen zullen smelten van hun bloed.","4":"En heel het leger van de hemelen zal wegkwijnen, en de hemelen zullen worden opgerold als een boek, en heel hun leger zal afvallen, zoals een blad van de wijnstok afvalt, en zoals een vijg afvalt van de vijgenboom.","5":"Want Mijn zwaard is dronken geworden in de hemel; zie, het zal ten oordeel neerdalen op Edom, en op het volk dat Ik met de ban geslagen heb.","6":"Het zwaard van de HEERE is vol bloed, het is vet geworden van vet, van het bloed van de lammeren en de bokken, van het vet van de nieren van de rammen; want de HEERE heeft een offer in Bozra, en een grote slachting in het land van de Edomieten.","7":"En de eenhoorns zullen met hen neerdalen, en de jonge stieren met de stieren; en hun land zal doordrenkt worden van het bloed, en hun stof zal van het vet vet gemaakt worden.","8":"Want het zal zijn de dag van de wraak van de HEERE, een jaar van vergeldingen, om de rechtszaak van Sion.","9":"En hun beken zullen in pek veranderd worden, en hun stof in zwavel; ja, hun land zal tot brandend pek worden.","10":"Het zal 's nachts of overdag niet uitgeblust worden, tot in eeuwigheid zal zijn rook opstijgen; van geslacht tot geslacht zal het woest zijn, tot in alle eeuwigheid zal niemand daar doorheen trekken.","11":"Maar de roerdomp en de nachtuil zullen het erfelijk bezitten, en de uil en de raaf zullen daarin wonen; want Hij zal een meetsnoer van woestheid over hen trekken, en een dieplood van leegte.","12":"Hun edelen (maar zij zijn er niet) zullen zij tot het koningschap roepen, maar al hun vorsten zullen niets zijn.","13":"En in hun paleizen zullen doornen opschieten, netels en distels in hun vestingen; en het zal een woonplaats van jakhalzen zijn, een plek voor de jongen van de struisvogels.","14":"En de wilde dieren van de woestijnen zullen de wilde dieren van de eilanden daar ontmoeten, en de bokachtige geest zal zijn metgezel toeroepen; ook zal het nachtgedierte zich daar neerzetten, en het zal een rustplaats voor zich vinden.","15":"Daar zal de wilde uil nestelen en leggen, en haar jongen uitbroeden, en onder haar schaduw verzamelen; ook zullen daar de gieren bij elkaar verzameld worden, elk met haar metgezel.","16":"Zoek in het boek van de HEERE, en lees; niet één van deze zal ontbreken, de één noch de ander zal men missen; want Mijn mond Zelf heeft het geboden, en Zijn Geest Zelf zal ze samenbrengen.","17":"Want Hij Zelf heeft voor hen het lot geworpen, en Zijn hand heeft het hun uitgedeeld met het meetsnoer; tot in eeuwigheid zullen zij dat erfelijk bezitten, van geslacht tot geslacht zullen zij daarin wonen."},"SV":{"1":"Nadert, gij heidenen, om te horen, en gij volken! luistert toe; de aarde hore, en haar volheid, de wereld en al wat daaruit voortkomt.","2":"Want de verbolgenheid des HEEREN is over al de heidenen, en grimmigheid over al hun heir; Hij heeft hen verbannen, Hij heeft ze ter slachting overgegeven.","3":"En hun verslagenen zullen weggeworpen worden, en van hun dode lichamen zal hun stank opgaan; en de bergen zullen smelten van hun bloed.","4":"En al het heir der hemelen zal uitteren, en de hemelen zullen toegerold worden, gelijk een boek, en al hun heir zal afvallen, gelijk een blad van den wijnstok afvalt, en gelijk *een* *vijg* afvalt van den vijgeboom.","5":"Want Mijn zwaard is dronken geworden in den hemel; ziet, het zal ten oordeel nederdalen op Edom, en op het volk, hetwelk Ik verbannen heb.","6":"Het zwaard des HEEREN is vol van bloed, het is vet geworden van smeer, van het bloed der lammeren en der bokken, van het smeer der nieren van de rammen; want de HEERE heeft een slachtoffer te Bozra, en een grote slachting in het land der Edomieten.","7":"En de eenhoornen zullen met hen afgaan, en de varren met de stieren; en hun land zal doordronken zijn van het bloed, en hun stof zal van het smeer vet gemaakt worden.","8":"Want het zal zijn de dag der wraak des HEEREN, een jaar der vergeldingen, om Sions twistzaak.","9":"En hun beken zullen in pek verkeerd worden, en hun stof in zwavel; ja, hun aarde zal tot brandend pek worden.","10":"Het zal des nachts of des daags niet uitgeblust worden, tot in der eeuwigheid zal zijn rook opgaan; van geslacht tot geslacht zal het woest zijn, tot in eeuwigheid der eeuwigheden zal niemand daar doorgaan.","11":"Maar de roerdomp en de nachtuil zullen het erfelijk bezitten, en de schuifuit, en de raaf zal daarin wonen; want Hij zal een richtsnoer der woestigheid over hen trekken, en een richtlood der ledigheid.","12":"Hun edelen (doch zij zijn er niet) zullen zij *tot* het koninkrijk roepen, maar al hun vorsten zullen niets zijn.","13":"En in hun paleizen zullen doornen opgaan, netelen en distelen in hun vestingen; en het zal een woning der draken zijn, een zaal voor de jongen der struisen.","14":"En de wilde dieren der woestijnen zullen de wilde dieren der eilanden *daar* ontmoeten, en de duivel zal zijn metgezel toeroepen; ook zal het nachtgedierte zich aldaar nederzetten, en het zal een rustplaats voor zich vinden.","15":"Daar zal de wilde meerle nestelen en leggen, en haar jongen uitbikken, en onder haar schaduw vergaderen; ook zullen aldaar de gieren met elkaar verzameld worden.","16":"Zoekt in het boek des HEEREN, en leest; niet een van dezen zal er feilen, het een noch het ander zal men missen; want mijn mond zelf heeft het geboden, en Zijn Geest Zelf zal ze samenbrengen.","17":"Want Hij Zelf heeft voor hen het lot geworpen, en Zijn hand heeft het hun uitgedeeld met het richtsnoer; tot in der eeuwigheid zullen zij dat erfelijk bezitten, van geslacht tot geslacht zullen zij daarin wonen."},"KJV":{"1":"Come near, ye nations, to hear; and hearken, ye people: let the earth hear, and all that is therein; the world, and all things that come forth","2":"For the indignation of the LORD *is* upon all nations, and *his* fury upon all their armies: he hath utterly destroyed them, he hath delivered them to the slaughter.","3":"Their slain also shall be cast out, and their stink shall come up out of their carcases, and the mountains shall be melted with their blood.","4":"And all the host of heaven shall be dissolved, and the heavens shall be rolled together as a scroll: and all their host shall fall down, as the leaf falleth off from the vine, and as a falling *fig* from the fig tree.","5":"For my sword shall be bathed in heaven: behold, it shall come down upon Idumea, and upon the people of my curse, to judgment.","6":"The sword of the LORD is filled with blood, it is made fat with fatness, *and* with the blood of lambs and goats, with the fat of the kidneys of rams: for the LORD hath a sacrifice in Bozrah, and a great slaughter in the land of Idumea.","7":"And the unicorns shall come down with them, and the bullocks with the bulls; and their land shall be soaked with blood, and their dust made fat with fatness.","8":"For *it is* the day of the LORD'S vengeance, *and* the year of recompences for the controversy of Zion.","9":"And the streams thereof shall be turned into pitch, and the dust thereof into brimstone, and the land thereof shall become burning pitch.","10":"It shall not be quenched night nor day; the smoke thereof shall go up for ever: from generation to generation it shall lie waste; none shall pass through it for ever and ever.","11":"But the cormorant and the bittern shall possess it; the owl also and the raven shall dwell in it: and he shall stretch out upon it the line of confusion, and the stones of emptiness.","12":"They shall call the nobles thereof to the kingdom, but none *shall be* there, and all her princes shall be nothing.","13":"And thorns shall come up in her palaces, nettles and brambles in the fortresses thereof: and it shall be an habitation of dragons, *and* a court for owls.","14":"The wild beasts of the desert shall also meet with the wild beasts of the island, and the satyr shall cry to his fellow; the screech owl also shall rest there, and find for herself a place of rest.","15":"There shall the great owl make her nest, and lay, and hatch, and gather under her shadow: there shall the vultures also be gathered, every one with her mate.","16":"Seek ye out of the book of the LORD, and read: no one of these shall fail, none shall want her mate: for my mouth it hath commanded, and his spirit it hath gathered","17":"And he hath cast the lot for them, and his hand hath divided it unto them by line: they shall possess it for ever, from generation to generation shall they dwell"}},"tsk":{"1":[{"kopje":"Kom","refs":["Jes 18:3","Jes 33:13","Jes 41:1","Jes 43:9","Jes 49:1","Richt 5:3","Richt 5:31","Ps 49:2","Ps 49:3","Ps 50:1","Ps 96:10","Mark 16:15","Mark 16:16","Openb 2:7"]},{"kopje":"laat","refs":["Jes 1:2","Deut 4:26","Deut 32:1","Jer 22:29","Micha 6:1","Micha 6:2"]},{"kopje":"alles wat daaruit voortkomt","refs":["Ps 24:1","1 Kor 10:26"]}],"2":[{"kopje":"de toorn","refs":["Jes 24:1-23","Jer 25:15-29","Joël 3:9-14","Amos 1:1","Amos 2:16","Zef 3:8","Zach 14:3","Zach 14:12-16","Rom 1:18","Openb 6:12-17","Openb 14:15-20","Openb 19:15-21","Openb 20:9","Openb 20:15"]},{"kopje":"en over heel hun","refs":["Jes 30:27-30","Nahum 1:2-6"]}],"3":[{"kopje":"gesneuvelden","refs":["Jes lass=\"wl wl-kjv\" data-code=\"H6635\">armies:</span> he hath utterly <span class=\"wl wl-kjv\" data-code=\"H2763\">destroyed</span> them, he hath <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> them to the slaughter.","3":"Their <span class=\"wl wl-kjv\" data-code=\"H2491\">slain</span> also shall be cast <span class=\"wl wl-kjv\" data-code=\"H7993\">out,</span> and their <span class=\"wl wl-kjv\" data-code=\"H889\">stink</span> shall come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> out of their <span class=\"wl wl-kjv\" data-code=\"H6297\">carcases,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains</span> shall be <span class=\"wl wl-kjv\" data-code=\"H4549\">melted</span> with their blood.","4":"And all the <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> shall be <span class=\"wl wl-kjv\" data-code=\"H4743\">dissolved,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8064\">heavens</span> shall be rolled <span class=\"wl wl-kjv\" data-code=\"H1556\">together</span> as a <span class=\"wl wl-kjv\" data-code=\"H5612\">scroll:</span> and all their <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> shall fall <span class=\"wl wl-kjv\" data-code=\"H5034\">down,</span> as the <span class=\"wl wl-kjv\" data-code=\"H5929\">leaf</span> falleth <span class=\"wl wl-kjv\" data-code=\"H5034\">off</span> from the <span class=\"wl wl-kjv\" data-code=\"H1612\">vine,</span> and as a <span class=\"wl wl-kjv\" data-code=\"H5034\">falling</span> fig from the fig tree.","5":"For my <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> shall be <span class=\"wl wl-kjv\" data-code=\"H7301\">bathed</span> in <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven:</span> behold, it shall come <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> upon <span class=\"wl wl-kjv\" data-code=\"H123\">Idumea,</span> and upon the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of my <span class=\"wl wl-kjv\" data-code=\"H2764\">curse,</span> to judgment.","6":"The <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is <span class=\"wl wl-kjv\" data-code=\"H4390\">filled</span> with <span class=\"wl wl-kjv\" data-code=\"H1818\">blood,</span> it is made <span class=\"wl wl-kjv\" data-code=\"H1878\">fat</span> with <span class=\"wl wl-kjv\" data-code=\"H2459\">fatness,</span> and with the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> of <span class=\"wl wl-kjv\" data-code=\"H3733\">lambs</span> and <span class=\"wl wl-kjv\" data-code=\"H6260\">goats,</span> with the <span class=\"wl wl-kjv\" data-code=\"H2459\">fat</span> of the <span class=\"wl wl-kjv\" data-code=\"H3629\">kidneys</span> of <span class=\"wl wl-kjv\" data-code=\"H352\">rams:</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath a <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifice</span> in <span class=\"wl wl-kjv\" data-code=\"H1224\">Bozrah,</span> and a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H2874\">slaughter</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of Idumea.","7":"And the <span class=\"wl wl-kjv\" data-code=\"H7214\">unicorns</span> shall come <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> with them, and the <span class=\"wl wl-kjv\" data-code=\"H6499\">bullocks</span> with the <span class=\"wl wl-kjv\" data-code=\"H47\">bulls;</span> and their <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> shall be <span class=\"wl wl-kjv\" data-code=\"H7301\">soaked</span> with <span class=\"wl wl-kjv\" data-code=\"H1818\">blood,</span> and their <span class=\"wl wl-kjv\" data-code=\"H6083\">dust</span> made <span class=\"wl wl-kjv\" data-code=\"H1878\">fat</span> with fatness.","8":"For it is the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S</span> <span class=\"wl wl-kjv\" data-code=\"H5359\">vengeance,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H7966\">recompences</span> for the <span class=\"wl wl-kjv\" data-code=\"H7379\">controversy</span> of Zion.","9":"And the <span class=\"wl wl-kjv\" data-code=\"H5158\">streams</span> thereof shall be <span class=\"wl wl-kjv\" data-code=\"H2015\">turned</span> into <span class=\"wl wl-kjv\" data-code=\"H2203\">pitch,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6083\">dust</span> thereof into <span class=\"wl wl-kjv\" data-code=\"H1614\">brimstone,</span> and the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> thereof shall become <span class=\"wl wl-kjv\" data-code=\"H1197\">burning</span> pitch.","10":"It shall not be <span class=\"wl wl-kjv\" data-code=\"H3518\">quenched</span> <span class=\"wl wl-kjv\" data-code=\"H3915\">night</span> nor <span class=\"wl wl-kjv\" data-code=\"H3119\">day;</span> the <span class=\"wl wl-kjv\" data-code=\"H6227\">smoke</span> thereof shall go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever:</span> from <span class=\"wl wl-kjv\" data-code=\"H1755\">generation</span> to <span class=\"wl wl-kjv\" data-code=\"H1755\">generation</span> it shall lie <span class=\"wl wl-kjv\" data-code=\"H2717\">waste;</span> none shall pass <span class=\"wl wl-kjv\" data-code=\"H5674\">through</span> it for <span class=\"wl wl-kjv\" data-code=\"H5331\">ever</span> and ever.","11":"But the <span class=\"wl wl-kjv\" data-code=\"H6893\">cormorant</span> and the <span class=\"wl wl-kjv\" data-code=\"H7090\">bittern</span> shall <span class=\"wl wl-kjv\" data-code=\"H3423\">possess</span> it; the <span class=\"wl wl-kjv\" data-code=\"H3244\">owl</span> also and the <span class=\"wl wl-kjv\" data-code=\"H6158\">raven</span> shall <span class=\"wl wl-kjv\" data-code=\"H7931\">dwell</span> in it: and he shall stretch <span class=\"wl wl-kjv\" data-code=\"H5186\">out</span> upon it the <span class=\"wl wl-kjv\" data-code=\"H6957\">line</span> of <span class=\"wl wl-kjv\" data-code=\"H8414\">confusion,</span> and the <span class=\"wl wl-kjv\" data-code=\"H68\">stones</span> of emptiness.","12":"They shall <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> the <span class=\"wl wl-kjv\" data-code=\"H2715\">nobles</span> thereof to the <span class=\"wl wl-kjv\" data-code=\"H4410\">kingdom,</span> but none shall be there, and all her <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> shall be nothing.","13":"And <span class=\"wl wl-kjv\" data-code=\"H5518\">thorns</span> shall come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> in her <span class=\"wl wl-kjv\" data-code=\"H759\">palaces,</span> <span class=\"wl wl-kjv\" data-code=\"H7057\">nettles</span> and <span class=\"wl wl-kjv\" data-code=\"H2336\">brambles</span> in the <span class=\"wl wl-kjv\" data-code=\"H4013\">fortresses</span> thereof: and it shall be an <span class=\"wl wl-kjv\" data-code=\"H5116\">habitation</span> of <span class=\"wl wl-kjv\" data-code=\"H8577\">dragons,</span> and a <span class=\"wl wl-kjv\" data-code=\"H2681\">court</span> for <span class=\"wl wl-kjv\" data-code=\"H1323\">owls.</span>","14":"The wild beasts of the <span class=\"wl wl-kjv\" data-code=\"H6728\">desert</span> shall also <span class=\"wl wl-kjv\" data-code=\"H6298\">meet</span> with the wild beasts of the <span class=\"wl wl-kjv\" data-code=\"H338\">island,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8163\">satyr</span> shall <span class=\"wl wl-kjv\" data-code=\"H7121\">cry</span> to his <span class=\"wl wl-kjv\" data-code=\"H7453\">fellow;</span> the screech <span class=\"wl wl-kjv\" data-code=\"H3917\">owl</span> also shall <span class=\"wl wl-kjv\" data-code=\"H7280\">rest</span> there, and <span class=\"wl wl-kjv\" data-code=\"H4672\">find</span> for herself a place of rest.","15":"There shall the great <span class=\"wl wl-kjv\" data-code=\"H7091\">owl</span> make her <span class=\"wl wl-kjv\" data-code=\"H7077\">nest,</span> and <span class=\"wl wl-kjv\" data-code=\"H4422\">lay,</span> and <span class=\"wl wl-kjv\" data-code=\"H1234\">hatch,</span> and <span class=\"wl wl-kjv\" data-code=\"H1716\">gather</span> under her <span class=\"wl wl-kjv\" data-code=\"H6738\">shadow:</span> there shall the <span class=\"wl wl-kjv\" data-code=\"H1772\">vultures</span> also be <span class=\"wl wl-kjv\" data-code=\"H6908\">gathered,</span> every <span class=\"wl wl-kjv\" data-code=\"H802\">one</span> with her mate.","16":"Seek ye <span class=\"wl wl-kjv\" data-code=\"H1875\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H7121\">read:</span> no <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of <span class=\"wl wl-kjv\" data-code=\"H2007\">these</span> shall <span class=\"wl wl-kjv\" data-code=\"H5737\">fail,</span> <span class=\"wl wl-kjv\" data-code=\"H802\">none</span> shall <span class=\"wl wl-kjv\" data-code=\"H6485\">want</span> her <span class=\"wl wl-kjv\" data-code=\"H7468\">mate:</span> for my <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> it hath <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded,</span> and his <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> it hath gathered","17":"And he hath <span class=\"wl wl-kjv\" data-code=\"H5307\">cast</span> the <span class=\"wl wl-kjv\" data-code=\"H1486\">lot</span> for them, and his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> hath <span class=\"wl wl-kjv\" data-code=\"H2505\">divided</span> it unto them by <span class=\"wl wl-kjv\" data-code=\"H6957\">line:</span> they shall <span class=\"wl wl-kjv\" data-code=\"H3423\">possess</span> it <span class=\"wl wl-kjv\" data-code=\"H5704\">for</span> <span class=\"wl wl-kjv\" data-code=\"H5769\">ever,</span> from <span class=\"wl wl-kjv\" data-code=\"H1755\">generation</span> to <span class=\"wl wl-kjv\" data-code=\"H1755\">generation</span> shall they dwell"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"haar volheid,","tekst":"Dat is, al wat er in is. Zie Psa 24:1 ."},{"catchword":"alles","tekst":"Of, al wat daar uitspruit. Hebreeuws, al hare uitspruitselen."}],"2":[{"catchword":"over","tekst":"Of, tegen, of op."},{"catchword":"al de heidenen,","tekst":"Te weten die het volk Gods vervolgen; gelijk daar zijn de Edomieten, Moabieten, Filistijnen, Syriërs, Assyriërs, Chaldeën en Babyloniërs, onder wie ook verstaan worden alle vijanden der kerk Gods."},{"catchword":"Hij heeft hen verbannen,","tekst":"Dat is, Hij heeft besloten hen te verbannen, en alzo straks wederom. Zie Deu 2:34 ."}],"3":[{"catchword":"En hun verslagenen","tekst":"De profeet beschrijft in dit en in de volgende verzen, met allegorische of verbloemde woorden, de nederlaag der vijanden van Gods volk, die wel eerst is geschied aan de Assyriërs, Babyloniërs en andere volken, die de Israëlieten hadden vervolgd en beschadigd; maar zij zal eerst volkomen voltrokken worden wanneer Jezus Christus, als opperste rechter, de ganse wereld oordelen zal."},{"catchword":"zullen weggeworpen worden,","tekst":"Tot een aas der wilde dieren; zij zullen niet begraven worden."},{"catchword":"smelten","tekst":"Of vervlieten, of druppen."},{"catchword":"van hun bloed","tekst":"Dat is, vanwege hun bloed."}],"4":[{"catchword":"uitteren,","tekst":"Dat is, smelten, verwelken. De zin is: De mensen zullen vanwege de uitvoering dezer oordelen Gods alzo ontsteld en verbaasd zijn, alsof het leger des hemels, te weten zon, maan en sterren, zouden vergaan of omgekeerd worden."},{"catchword":"toegerold","tekst":"Dit moet men verstaan naar de wijze, die eertijds bij de Joden en andere natiën gebruikelijk is geweest, die op lange bladen van perkament schreven, die zij dan oprolden. Zie Isa 8:1 ."},{"catchword":"hun heir zal afvallen,","tekst":"Te weten het heir der hemelen."}],"5":[{"catchword":"Want Mijn zwaard","tekst":"Dit zijn de woorden des Heeren. En de profeet beschrijft hier, en vs.6,7, enz. den ondergang van de vijanden der kerk Gods."},{"catchword":"is dronken","tekst":"Te weten van het bloed der verslagenen. De zin is: Ik zal er in mijn rechtvaardigen toorn velen verslaan, achtervolgens het besluit, dat in den hemel genomen is."},{"catchword":"ten oordeel","tekst":"Ter straf, ter wraak."},{"catchword":"op Edom,","tekst":"De Edomieten waren de naaste bloedverwanten der Israëlieten; zij hadden en onderhielden ook de besnijdenis; maar evenwel waren zij derzelver grootste vijanden en vervolgers, en zij zijn een voorbeeld van al de vijanden der kerk Gods, die zich wel beroemen uit dezelve gesproten te zijn, en gebruiken dezelfde sacramenten, maar inderdaad de rechtgelovigen haten."},{"catchword":"hetwelk Ik","tekst":"Hebreeuws, het volk mijns bans."}],"6":[{"catchword":"van het bloed","tekst":"Eene gelijkenis, genomen van de slachtoffers van het Oude Testament."},{"catchword":"der lammeren","tekst":"Dat is, van de mensen, die klein en gering zijn. Of, lammeren betekent de jongen, bokken de ouden."},{"catchword":"een slachtoffer","tekst":"Of, ene slachting. Het Hebreeuwse woord, hetwelk dikwijls een slachtoffer betekent, is ook meermalen voor slachting genomen, gelijk Gen 31:54 ; 1Sa 28:24 , en 1Ki 19:21 ."},{"catchword":"Bozra,","tekst":"Dit was de hoofdstad in der Edomieten land, en zij is geweest een voorbeeld der stad Rome. Vergelijk hiermede Rev 18:2 ; van Bozra in Moab, zie Jer 48:24 ."}],"7":[{"catchword":"de eenhoornen","tekst":"Dat is, de machtigen en hoogverhevenen, die boven alle anderen in wreedheid uitsteken in het vervolgen der godzaligen."},{"catchword":"met hen","tekst":"Te weten met de lammeren en bokken, vs.6."},{"catchword":"afgaan,","tekst":"Te weten ter slachting."},{"catchword":"de stieren;","tekst":"Zie Psa 22:13 ."},{"catchword":"hun land","tekst":"Te weten der Edomieten land, waarvan boven vs.6 gesproken is."},{"catchword":"van het bloed,","tekst":"Te weten der verslagen eenhoornen, varren en stieren. Vergelijk hiermede Rev 19:21 ."},{"catchword":"stof","tekst":"Dat is, hunne aard, of aardrijk."},{"catchword":"van het smeer","tekst":"Te weten dat uit de verslagenen vlieten zal."}],"8":[{"catchword":"de dag der wraak","tekst":"In welken de Heere het onnozel bloed zijns volks wreken zal."},{"catchword":"om Sions twistzaak","tekst":"Dat is, vanwege de zaak Zions, dat is, der gemeente Gods, die zwaarlijk van hare vijanden is vervolgd geweest."}],"9":[{"catchword":"hun beken","tekst":"Te weten der stad Bozra, of der Edomieten en vijanden der kerk Gods."},{"catchword":"zullen in pek","tekst":"Met deze en de volgende woorden wordt te kennen gegeven dat het land ten enenmale zal verdorven worden, alzo dat het den lande van Sodom en Gomorra zal gelijk worden."},{"catchword":"hun stof","tekst":"Zie de aantekening Job 18:15 ."}],"10":[{"catchword":"Het zal des nachts","tekst":"Te weten het brandende pek, of het brandende land, dat tot pek zal geworden zijn. Vergelijk hiermede Rev 18:9 , en Rev 19:3 ."},{"catchword":"zijn rook opgaan;","tekst":"Te weten der stad Bozra."}],"11":[{"catchword":"de roerdomp","tekst":"De zin is: Hun land zal in den grond zo verwoest en verdorven worden, dat er niets dan wilde en verschrikkelijke dieren in wonen zullen. Zie Isa 14:23 , alwaar van deze en dergelijke ondieren ook gesproken wordt, gelijk ook Lev 11:17 ."},{"catchword":"Hij","tekst":"Te weten de Heere."},{"catchword":"zal een richtsnoer","tekst":"Dat is, Hij zal hen meten om te verderven. Zie 2Ki 21:13 , en de aantekening aldaar."},{"catchword":"een richtlood","tekst":"Hebreeuws, stenen der ledigheid; dat is een meetsnoer waar een steen aan hangt; Zec 4:10 staat, een steen des tins; dat is, een meetsnoer waar een tinnen gewicht aan hangt; en een richtlood der woestheid, of der ledigheid; dat is, tot een teken dat zij ledig en woest zullen gemaakt worden."}],"12":[{"catchword":"Hun","tekst":"Te weten van het land Edom."},{"catchword":"edelen","tekst":"Hebreeuws, witte; dat is, degenen die witte zuivere klederen dragen, gelijk de vorsten en groten des lands plachten te doen; zie de aantekening 1Ki 21:8 , en Neh 2:16 ."},{"catchword":"zij","tekst":"Te weten de overgebleven Edomieten, of de inwoners der stad Bozra."},{"catchword":"tot","tekst":"Dat is, tot de regering des lands."},{"catchword":"zullen niets zijn","tekst":"Dat is, zij zullen allen te schande gekomen zijn, derhalve zal hen niemand met raad of daad kunnen ophelpen."}],"13":[{"catchword":"opgaan,","tekst":"Dat is, wassen."},{"catchword":"het zal een woning","tekst":"Te weten Bozra."},{"catchword":"de jongen","tekst":"Zie Job 30:29 ."}],"14":[{"catchword":"de wilde dieren der woestijnen . . .de wilde dieren der eilanden","tekst":"Zie van deze en dergelijke gedrochten Isa 13:21 ."},{"catchword":"de duivel","tekst":"Hebreeuws, Sagnir. Zie Isa 13:21 ."},{"catchword":"het nachtgedierte","tekst":"Hebreeuws, Lilith."}],"15":[{"catchword":"de wilde meerle","tekst":"Hebreeuws, Kippos. Men kan niet zekerlijk weten wat dit voor een vogel is."},{"catchword":"en leggen,","tekst":"Te weten hare eieren. Anders, voortbrengen; te weten de eieren die zij in het lijf heeft."},{"catchword":"uitbikken,","tekst":"Hebreeuws, splijten, klieven, namelijk de eierschalen, opdat er de kiekens uitkomen."},{"catchword":"onder haar schaduw","tekst":"Dat is, onder hare vleugelen."},{"catchword":"met elkaar","tekst":"Hebreeuws, de vrouw [met] hare metgezellin, of vriendin."}],"16":[{"catchword":"in het boek des HEEREN,","tekst":"Hebreeuws, uit; dat is, in, of uit het boek dezer profetieën, die ik uit het bevel des Heeren beschrijf."},{"catchword":"niet een","tekst":"Te weten, zaken, of voorverhaalde wilde dieren."},{"catchword":"het een noch","tekst":"Hebreeuws, de vrouw [met] hare vriending; gelijk boven vs.15."},{"catchword":"mijn mond zelf","tekst":"Dit spreekt de Heere."},{"catchword":"Zijn Geest","tekst":"Te weten des Heeren. Dit spreekt de profeet. Anders: de mond [des HEEREN]."},{"catchword":"zal ze samenbrengen","tekst":"Te weten de bovenverhaalde dieren en vogels."}],"17":[{"catchword":"voor hen","tekst":"Te weten voor die dieren en vogels."},{"catchword":"het hun","tekst":"Te weten het land der Edomieten. Anders, heeft zij; te weten de stad Bozra."},{"catchword":"tot in der eeuwigheid","tekst":"De zin is: Nadat de Heere zelf het land der Edomieten en zijner andere vijanden aan de wilde en vervaarlijke dieren tot hunne woning zal ingegeven en uitgedeeld hebben, zo zullen zij altoos daarin blijven. Alzo dat het steeds een vervloekt en verwoest land zijn en blijven zal; alzo zal ook de vloek des Heeren steeds over de vijanden zijner kerk zijn en blijven."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Come neer ye heathen, to hear, and hearken ye nations: let the earth hear, and the fullness thereof; [That is, all that is therein. See Psal.24.on verse 1.] the world, and all that cometh forth all it, [Or, all that sprouteth forth of it. Heb. All the sprouting forth thereof.]"}],"2":[{"catchword":null,"tekst":"For the indignation of the LORD is over [Or, against, or, upon] all the heathen; [To wit, that persecute the people of God; as for example, the Edomites, Moabites, Philistines, Syrians, Assyrians, Chaldeans, and Babylonians, by whom are also understood all enemies of the Church of God] and (his) wrath over [or, against, or, upon all their army: be hath banned them [that is, he hath decreed to ban them: and so presently again. See Deut.2.on verse 34.] he hath delivered them to the slaughter."}],"3":[{"catchword":null,"tekst":"And their slain shall be cast away, [For a prey unto wild beasts: they shall not be buried] and their stink shall come up out of their carcases: and the mountains shall melt [or, float away, or drop] with their blood. [That is, because of their blood. The Prophet describeth in this and in the next following verses in allegorical or borrowed terms the overthrow of the enemies of the people of God, which indeed first happened to the Assyrians, Babylonians, and other nations, who had miserably persecuted and hurt the Israelites: but it shall be first perfectly accomplished, when Jesus Christ, as supreme Judge, shall judge the whole world.]"}],"4":[{"catchword":null,"tekst":"And all the host of the heavens shall consume away, [That is, melt, fade away, wither away, the meaning is. Men shall be so astonished and amazed at the execution of these judgements of God, as if the host of heaven, to wit, the Sun, moon, and stars should perish, to be turned upside down. See Revel.6.13, 14.] and the heaven shall be rolled together as a book, [this must be understood according to the custom which was formerly in use among the Jews and other Nations, who wrote upon long leaves of parchment, and then rolled them up together in a scroll. See Jsa.8.1.] and all their host [to wit, the host of the heavens] shall fall down, as a leaf of falleth off from the vine, and as (a fig) falleth from the fig-tree."}],"5":[{"catchword":null,"tekst":"For my sword is made drunk [To wit, with the blood of the slain] in heaven: [the meaning is, I will slay many in my just wrath, according o the decree that is made in heaven. These are the words of God: and the prophet doth describe here and vers.6,7, etc. The ruine and destruction of the enemies of Gods Church] behold it shall come down to judgement [that is, to punishment, to vengeance] upon Edom, [the Edomites were the nightest kindered of the Israelites. They had also and still kept and used among them the sacrament of circumcision: but notwithstanding they were their greatest enemies and persecutors; and they are type and figure of all the enemies of the Church of God, who indeed boast and brag that they are descended and born of the Church, and use the same Sacraments as the Church doth but indeed and in truth hate the true believers] and upon the people which I have banned. [Heb. The people of my ban.]"}],"6":[{"catchword":null,"tekst":"The sword of the LORD is full of blood, it is made fat with grease, with the blood of lambs and goats, [A comparison taken from the slay-offerings of the old Testament. (of lambs etc.) that is, of men that are small and mean in condition. Or, lambs signify young men; goats, the aged, [of the grease of the kidneys of rams: for the LORD hath a slay-offering [or, a slaughter. The Hebrew word which doth often signify a slay-offering, is also frequently taken for slaughter, as Genes.31.54. and 1 Sam.28.24. and 1 Kings 19.21.] at Bozra, [this was the Metropolis or chief city in the land of the Edomites: and it was a type and figure of the city of Rome. Compare herewith Revel.18.2. Of Bozra in Moab see Jerem.48.vers.24.] and a great slaughter in the land of the Edomites."}],"7":[{"catchword":null,"tekst":"And the unicorns [That is, the mighty and high exalted ones, who exceed all others in cruelty, in persecuting those that are godly] shall come down [to wit, to slaughter] with them, [to wit, with the lambs and goats, vers.6.] and the Bulls with the Bullocks. [See Psal.22.on vers.13.] and their land [to wit, the land of the Edomites, whereof mention is made above vers.6.] shall be thoroughly drunken with blood, [to wit, with the blood of the slain Unicorns, Bullocks, and Bulls. Compare herewith Revel.19.21.] and their dust [that is, their ground, or earth] shall be made fat with grease or fatness that shall flow forth from them that are slain.]"}],"8":[{"catchword":null,"tekst":"For it shall be the day of the Lords vengeance, [Wherein the LORD will avenge the innocent blood of his people] a year of recompenses for the controversy of Zion. [that is, because of Zion, that is, of the church of God, which was grievously persecuted by her enemies.]"}],"9":[{"catchword":null,"tekst":"And the brooks thereof, [To wit, of the city of Bozra, or, of the Edomites, and enemies of the Church of God,] shall be turned into pitch, [In these and the following words is shewed, that the land shall be utterly wasted and destroyed, so that it shall be made like unto the land of Sodom and Gomorrah] and the dust thereof into brimstone: See Job 18.the Annotat. On vers.15.] yea the earth thereof shall become burning pitch."}],"10":[{"catchword":null,"tekst":"It [To wit, the burning pitch: or the burning land, which shall become as pitch] shall not be quenched night nor day. [Compare herewith Revel.18.2. and 19.3.] the smoke thereof [to wit, of the city of Bozra] shall go up forever, it shall be desolate from generation to generation, none shall pass through it forever and ever."}],"11":[{"catchword":null,"tekst":"But the Bittern and the Owl shall possess it hereditarily, and the screech-owl and the raven shall dwell in it; [The meaning is, their land shall be utterly wasted and destroyed, that nothing but wild and terrible creatures shall dwell in it. See above chap.14.23. where also mention is made of these and the like frightful creatures, as also Levit.11.17. Compare also Isa 13:21,22. Zeph.2.14. Revel.18.2.] for he [to wit the Lord] shall draw over it a line of desolation, [that is, he shall measure it for destruction. See 2 Kings 21.13. and the Annotat. There] and a plummet of emptiness [Heb. Stones of emptiness; that is, a measuring line, whereon a stone hangeth. Zach.4.10. is mentioned a stone of tin, that is, a measuring line whereon a tin weight doth hang. And a plummet of desolation, or emptiness; that is, for a token that it shall be made empty and desolate.]"}],"12":[{"catchword":null,"tekst":"They [To wit, the remaining Edomites, or the inhabitants of the city of Bozra] shall call the nobles [Heb. White ones; that is, those that wear white pure garments, as Princes, and the great ones of the Land were wont to do. See 1 Kings 21. The Annotat. ers the mouth (of the LORD) it self shall bring them together [to wit, the above-mentioned beasts and fowls.]"}],"17":[{"catchword":null,"tekst":"For he himself hath cast the lot for them, [To wit, for those beasts and fowls] and his hand hath divided it [to wit, the land of the Edomites. Others, the city of Bozra] unto them by line: they shall possess it herety of Bozra] unto them by line: they shall possess it hereditarily forever, from generation to generation shall they dwell in it [the meaning is, after that the Lord himself shall have given and divided the land of the Edomites, and of other his enemies unto the wild and dreadful beasts for their habitation or dwelling place, they shall forever abide & continue in it, so that it shall always be and remain a cursed and desolate land: in like manner shall the curse of God forever be and abide upon the enemies of his Church.]"}]}}};

}

function plaatsPopup(el, html) {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;

function linkifyRefs(html) {

    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;

const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }

}

    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;

}
function bijbeluitlegHtml(n) {

        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +

function toggle(n) {

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen

      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // slug -> volledige boeknaam (voor citaten met de volle boeknaam i.p.v. de afkorting)
  const boeknaamPerSlug = {};
  (D.meta.boeken || []).forEach(b => {
    const m = b.href.match(/^\.\.\/\.\.\/([^/]+)\//);
    if (m) boeknaamPerSlug[m[1]] = b.naam;
  });
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const naam = boeknaamPerSlug[ref.slug] || chip.textContent.replace(/\s+\d+:\d+.*$/, '');
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${naam} ${ref.hfd}:${ref.vers}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
