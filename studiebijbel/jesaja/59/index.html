l":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Zie, de hand van de HEERE is niet te kort om te kunnen verlossen, en Zijn oor is niet zwaar geworden om te kunnen horen.","2":"Maar uw ongerechtigheden brengen een scheiding tussen u en uw God, en uw zonden verbergen Zijn aangezicht voor u, zodat Hij niet hoort.","3":"Want uw handen zijn met bloed bevlekt, en uw vingers met ongerechtigheid; uw lippen spreken valsheid, uw tong spreekt onrecht uit.","4":"Er is niemand die om gerechtigheid roept, en niemand die zich voor de waarheid in het gericht begeeft; zij vertrouwen op ijdelheid en spreken leugen; met moeite zijn zij zwanger, en zij baren ongerechtigheid.","5":"Zij broeden basiliskuseieren uit, en zij weven spinnenwebben; wie van hun eieren eet, moet sterven, en als het in stukken gedrukt wordt, barst er een adder uit.","6":"Hun webben deugen niet tot kleding, en zij zullen zichzelf niet kunnen bedekken met hun werken; hun werken zijn werken van ongerechtigheid, en een daad van geweld is in hun handen.","7":"Hun voeten lopen naar het kwade, en zij haasten zich om onschuldig bloed te vergieten; hun gedachten zijn gedachten van ongerechtigheid, verwoesting en verderf is op hun wegen.","8":"De weg van de vrede kennen zij niet; en er is geen recht in hun gangen; hun paden maken zij krom voor zichzelf; ieder die daarop gaat, kent de vrede niet.","9":"Daarom is het recht ver van ons, en de gerechtigheid bereikt ons niet; wij wachten op het licht, maar zie, er is duisternis, op een grote glans, maar wij wandelen in het donker.","10":"Wij tasten naar de wand, zoals de blinden, en zoals wie geen ogen hebben, tasten wij; wij struikelen op de middag als in de schemering, wij zijn op woeste plaatsen als de doden.","11":"Wij brommen allen als de beren, en wij kirren voortdurend als de duiven; wij wachten op recht, maar er is geen, op heil, maar het is ver van ons.","12":"Want onze overtredingen zijn talrijk voor U, en onze zonden getuigen tegen ons; want onze overtredingen zijn bij ons, en onze ongerechtigheden kennen wij;","13":"het overtreden en het liegen tegen de HEERE, en het achterwaarts wijken van onze God; het spreken van onderdrukking en afval, het ontvangen en het uitspreken van valse woorden uit het hart.","14":"Daarom is het recht achterwaarts geweken, en de gerechtigheid staat ver weg; want de waarheid struikelt op de straat, en wat recht is, kan er niet ingaan.","15":"Ja, de waarheid ontbreekt, en wie van het boze wijkt, wordt tot een prooi; en de HEERE zag het, en het was kwaad in Zijn ogen, dat er geen recht was.","16":"Omdat Hij zag dat er niemand was, ontzette Hij Zich, omdat er geen voorbidder was; daarom bracht Zijn arm Hem heil, en Zijn gerechtigheid ondersteunde Hem.","17":"Want Hij trok gerechtigheid aan als een pantser, en de helm van het heil zette Hij op Zijn hoofd, en de kleren van de wraak trok Hij aan als kleding, en Hij deed de ijver aan als een mantel.","18":"Naar de werken, daarnaar zal Hij vergelden: grimmigheid aan Zijn tegenstanders, vergelding aan Zijn vijanden; aan de eilanden zal Hij het loon vergelden.","19":"Dan zullen zij de Naam van de HEERE vrezen vanaf de neergang, en Zijn heerlijkheid vanaf de opgang van de zon; als de vijand zal komen als een stroom, zal de Geest van de HEERE de banier tegen hem oprichten.","20":"En er zal een Verlosser tot Sion komen, namelijk voor hen die zich bekeren van de overtreding in Jakob, spreekt de HEERE.","21":"Wat Mij aangaat, dit is Mijn Verbond met hen, zegt de HEERE: Mijn Geest, Die op u is, en Mijn woorden, die Ik in uw mond gelegd heb, die zullen van uw mond niet wijken, ook niet van de mond van uw zaad, ook niet van de mond van het zaad van uw zaad, zegt de HEERE, van nu af tot in eeuwigheid toe."},"SV":{"1":"Ziet, de hand des HEEREN is niet verkort, dat zij niet zou kunnen verlossen; en Zijn oor is niet zwaar geworden, dat het niet zou kunnen horen.","2":"Maar uw ongerechtigheden maken een scheiding tussen ulieden en tussen uw God, en uw zonden verbergen het aangezicht van ulieden, dat Hij niet hoort.","3":"Want uw handen zijn met bloed bevlekt; en uw vingeren met ongerechtigheid; uw lippen spreken valsheid, uw tong dicht onrecht.","4":"Er is niemand, die voor de gerechtigheid roept, en niemand, die voor de waarheid in het gericht zich begeeft; zij vertrouwen op ijdelheid, en spreken leugen; met moeite zijn zij zwanger, en zij baren ongerechtigheid.","5":"Zij broeden basiliskus-eieren uit, en zij weven spinnewebben; die van hun eieren eet, moet sterven, en als het in stukken gedrukt wordt, er berst een adder uit.","6":"Hun webben deugen niet tot klederen, en zij zullen zichzelven niet kunnen dekken met hun werken; hun werken zijn werken der ongerechtigheid, en een maaksel des wrevels is in hun handen.","7":"Hun voeten lopen tot het kwade, en zij haasten om onschuldig bloed te vergieten; hun gedachten zijn gedachten der ongerechtigheid, verstoring en verbreking is op hun banen.","8":"Den weg des vredes kennen zij niet; en er is geen recht in hun gangen; hun paden maken zij verkeerd voor zich zelven, al wie daarop gaat, die kent den vrede niet.","9":"Daarom is het recht verre van ons, en de gerechtigheid achterhaalt ons niet; wij wachten op het licht, maar ziet, er is duisternis, op een groten glans, *maar* wij wandelen in donkerheden.","10":"Wij tasten naar den wand, gelijk de blinden, en, gelijk die geen ogen hebben, tasten wij; wij stoten ons op den middag, als in de schemering, wij zijn in woeste plaatsen gelijk de doden.","11":"Wij brommen allen gelijk als de beren, en wij kirren doorgaans gelijk de duiven; wij wachten naar recht, maar er is geen, naar heil, *maar* het is verre van ons.","12":"Want onze overtredingen zijn vele voor U, en onze zonden getuigen tegen ons; want onze overtredingen zijn bij ons, en onze ongerechtigheden kennen wij;","13":"Het overtreden en het liegen tegen den HEERE, en het achterwaarts wijken van onzen God; het spreken van onderdrukking en afval, het ontvangen en het dichten van valse woorden uit het hart.","14":"Daarom is het recht achterwaarts geweken, en de gerechtigheid staat van verre; want de waarheid struikelt op de straat, en wat recht is, kan er niet ingaan.","15":"Ja, de waarheid ontbreekt er, en wie van het boze wijkt, stelt zich tot een roof; en de HEERE zag het, en het was kwaad in Zijn ogen, dat er geen recht was.","16":"Dewijl Hij zag, dat er niemand was, zo ontzette Hij Zich, omdat er geen voorbidder was; daarom bracht Hem Zijn arm heil aan, en Zijn gerechtigheid ondersteunde Hem.","17":"Want Hij trok gerechtigheid aan als een pantser, en den helm des heils *zette* *Hij* op Zijn hoofd, en de klederen der wraak trok Hij aan *tot* kleding, en Hij deed den ijver aan als een mantel.","18":"Even naar de werken, even daarnaar zal Hij vergelden, grimmigheid aan Zijn wederpartijders, vergelding aan Zijn vijanden; den eilanden zal Hij *het* loon vergelden.","19":"Dan zullen zij den Naam des HEEREN vrezen van den nedergang, en Zijn heerlijkheid van den opgang der zon; als de vijand zal komen gelijk een stroom, zal de Geest des HEEREN de banier tegen hen oprichten.","20":"En er zal een Verlosser tot Sion komen, namelijk voor hen, die zich bekeren van de overtreding in Jakob, spreekt de HEERE.","21":"Mij aangaande, dit is Mijn Verbond met hen, zegt de HEERE: Mijn Geest, Die op u is, en Mijn woorden, die Ik in uw mond gelegd heb, die zullen van uw mond niet wijken, noch van den mond van uw zaad, noch van den mond van het zaad uws zaads, zegt de HEERE, van nu aan tot in eeuwigheid toe."},"KJV":{"1":"Behold, the LORD'S hand is not shortened, that it cannot save; neither his ear heavy, that it cannot hear:","2":"But your iniquities have separated between you and your God, and your sins have hid *his* face from you, that he will not hear.","3":"For your hands are defiled with blood, and your fingers with iniquity; your lips have spoken lies, your tongue hath muttered perverseness.","4":"None calleth for justice, nor *any* pleadeth for truth: they trust in vanity, and speak lies; they conceive mischief, and bring forth iniquity.","5":"They hatch cockatrice' eggs, and weave the spider's web: he that eateth of their eggs dieth, and that which is crushed breaketh out into a viper.","6":"Their webs shall not become garments, neither shall they cover themselves with their works: their works *are* works of iniquity, and the act of violence *is* in their hands.","7":"Their feet run to evil, and they make haste to shed innocent blood: their thoughts *are* thoughts of iniquity; wasting and destruction *are* in their paths.","8":"The way of peace they know not; and *there is* no judgment in their goings: they have made them crooked paths: whosoever goeth therein shall not know peace.","9":"Therefore is judgment far from us, neither doth justice overtake us: we wait for light, but behold obscurity; for brightness, *but* we walk in darkness.","10":"We grope for the wall like the blind, and we grope as if *we had* no eyes: we stumble at noonday as in the night; *we are* in desolate places as dead","11":"We roar all like bears, and mourn sore like doves: we look for judgment, but *there is* none; for salvation, *but* it is far off","12":"For our transgressions are multiplied before thee, and our sins testify against us: for our transgressions *are* with us; and *as for* our iniquities, we know","13":"In transgressing and lying against the LORD, and departing away from our God, speaking oppression and revolt, conceiving and uttering from the heart words of falsehood.","14":"And judgment is turned away backward, and justice standeth afar off: for truth is fallen in the street, and equity cannot enter.","15":"Yea, truth faileth; and he *that* departeth from evil maketh himself a prey: and the LORD saw *it*, and it displeased him that *there was* no judgment.","16":"And he saw that *there was* no man, and wondered that *there was* no intercessor: therefore his arm brought salvation unto him; and his righteousness, it sustained","17":"For he put on righteousness as a breastplate, and an helmet of salvation upon his head; and he put on the garments of vengeance *for* clothing, and was clad with zeal as a cloke.","18":"According to *their* deeds, accordingly he will repay, fury to his adversaries, recompence to his enemies; to the islands he will repay recompence.","19":"So shall they fear the name of the LORD from the west, and his glory from the rising of the sun. When the enemy shall come in like a flood, the Spirit of the LORD shall lift up a standard","20":"And the Redeemer shall come to Zion, and unto them that turn from transgression in Jacob, saith the LORD.","21":"As for me, this *is* my covenant with them, saith the LORD; My spirit that *is* upon thee, and my words which I have put in thy mouth, shall not depart out of thy mouth, nor out of the mouth of thy seed, nor out of the mouth of thy seed's seed, saith the LORD, from henceforth and for ever."}},"tsk":{"1":[{"kopje":"de HEERE","refs":["Jes 50:2","Gen 18:14","Num 11:23","Jer 32:17"]},{"kopje":"om te kunnen verlossen","refs":["Jes 63:1","Hebr 7:25"]},{"kopje":"Zijn oor","refs":["Jes 6:10","Matt 13:15"]}],"2":[{"kopje":"uw ongerechtigheden","refs":["Jes 50:1","Deut 32:19","Joz 7:11","Spr 15:29","Jer 5:25"]},{"kopje":"verbergen","refs":["Jes 57:17","Deut 31:17","Deut 31:18","Deut 32:20","Ezech 39:23","Ezech 39:24","Ezech 39:29","Micha 3:4"]}],"3":[{"kopje":"uw handen","refs":["Jes 1:15","Jes 1:21","Jer 2:30","Jer 2:34","Jer 22:17","Ezech 7:23","Ezech 9:9","Ezech 22:2","Ezech 35:6","Hos 4:2","Micha 3:10-12","Micha 7:2","Matt 27:4"]},{"kopje":"uw lippen","refs":["Jer 7:8","Jer 9:3-6 l wl-kjv\" data-code=\"H4941\">judgment</span> in their <span class=\"wl wl-kjv\" data-code=\"H4570\">goings:</span> they have made them <span class=\"wl wl-kjv\" data-code=\"H6140\">crooked</span> <span class=\"wl wl-kjv\" data-code=\"H5410\">paths:</span> whosoever <span class=\"wl wl-kjv\" data-code=\"H1869\">goeth</span> therein shall not <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> peace.","9":"Therefore is <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment</span> <span class=\"wl wl-kjv\" data-code=\"H7368\">far</span> from us, neither doth <span class=\"wl wl-kjv\" data-code=\"H6666\">justice</span> <span class=\"wl wl-kjv\" data-code=\"H5381\">overtake</span> us: we <span class=\"wl wl-kjv\" data-code=\"H6960\">wait</span> for <span class=\"wl wl-kjv\" data-code=\"H216\">light,</span> but behold <span class=\"wl wl-kjv\" data-code=\"H2822\">obscurity;</span> for <span class=\"wl wl-kjv\" data-code=\"H5054\">brightness,</span> but we <span class=\"wl wl-kjv\" data-code=\"H1980\">walk</span> in darkness.","10":"We <span class=\"wl wl-kjv\" data-code=\"H1659\">grope</span> for the <span class=\"wl wl-kjv\" data-code=\"H7023\">wall</span> like the <span class=\"wl wl-kjv\" data-code=\"H5787\">blind,</span> and we <span class=\"wl wl-kjv\" data-code=\"H1659\">grope</span> as if we had no <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes:</span> we <span class=\"wl wl-kjv\" data-code=\"H3782\">stumble</span> at <span class=\"wl wl-kjv\" data-code=\"H6672\">noonday</span> as in the <span class=\"wl wl-kjv\" data-code=\"H5399\">night;</span> we are in <span class=\"wl wl-kjv\" data-code=\"H820\">desolate</span> places as dead","11":"We <span class=\"wl wl-kjv\" data-code=\"H1993\">roar</span> all like <span class=\"wl wl-kjv\" data-code=\"H1677\">bears,</span> and <span class=\"wl wl-kjv\" data-code=\"H1897\">mourn</span> <span class=\"wl wl-kjv\" data-code=\"H1897\">sore</span> like <span class=\"wl wl-kjv\" data-code=\"H3123\">doves:</span> we <span class=\"wl wl-kjv\" data-code=\"H6960\">look</span> for <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment,</span> but there is none; for <span class=\"wl wl-kjv\" data-code=\"H3444\">salvation,</span> but it is far off","12":"For our <span class=\"wl wl-kjv\" data-code=\"H6588\">transgressions</span> are <span class=\"wl wl-kjv\" data-code=\"H7231\">multiplied</span> before thee, and our <span class=\"wl wl-kjv\" data-code=\"H2403\">sins</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">testify</span> against us: for our <span class=\"wl wl-kjv\" data-code=\"H6588\">transgressions</span> are with us; and as for our <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquities,</span> we know","13":"In <span class=\"wl wl-kjv\" data-code=\"H6586\">transgressing</span> and <span class=\"wl wl-kjv\" data-code=\"H3584\">lying</span> against the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and departing <span class=\"wl wl-kjv\" data-code=\"H5253\">away</span> <span class=\"wl wl-kjv\" data-code=\"H310\">from</span> our <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">speaking</span> <span class=\"wl wl-kjv\" data-code=\"H6233\">oppression</span> and <span class=\"wl wl-kjv\" data-code=\"H5627\">revolt,</span> <span class=\"wl wl-kjv\" data-code=\"H2029\">conceiving</span> and <span class=\"wl wl-kjv\" data-code=\"H1897\">uttering</span> from the <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of falsehood.","14":"And <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment</span> is turned <span class=\"wl wl-kjv\" data-code=\"H5253\">away</span> <span class=\"wl wl-kjv\" data-code=\"H268\">backward,</span> and <span class=\"wl wl-kjv\" data-code=\"H6666\">justice</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">standeth</span> afar <span class=\"wl wl-kjv\" data-code=\"H7350\">off:</span> for <span class=\"wl wl-kjv\" data-code=\"H571\">truth</span> is <span class=\"wl wl-kjv\" data-code=\"H3782\">fallen</span> in the <span class=\"wl wl-kjv\" data-code=\"H7339\">street,</span> and <span class=\"wl wl-kjv\" data-code=\"H5229\">equity</span> <span class=\"wl wl-kjv\" data-code=\"H3201\">cannot</span> enter.","15":"Yea, <span class=\"wl wl-kjv\" data-code=\"H571\">truth</span> <span class=\"wl wl-kjv\" data-code=\"H5737\">faileth;</span> and he that <span class=\"wl wl-kjv\" data-code=\"H5493\">departeth</span> from <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> maketh himself a <span class=\"wl wl-kjv\" data-code=\"H7997\">prey:</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> it, and it <span class=\"wl wl-kjv\" data-code=\"H3415\">displeased</span> him that there was no judgment.","16":"And he <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that there was no <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> and <span class=\"wl wl-kjv\" data-code=\"H8074\">wondered</span> that there was no <span class=\"wl wl-kjv\" data-code=\"H6293\">intercessor:</span> therefore his <span class=\"wl wl-kjv\" data-code=\"H2220\">arm</span> brought <span class=\"wl wl-kjv\" data-code=\"H3467\">salvation</span> unto him; and his <span class=\"wl wl-kjv\" data-code=\"H6666\">righteousness,</span> it sustained","17":"For he put <span class=\"wl wl-kjv\" data-code=\"H3847\">on</span> <span class=\"wl wl-kjv\" data-code=\"H6666\">righteousness</span> as a <span class=\"wl wl-kjv\" data-code=\"H8302\">breastplate,</span> and an <span class=\"wl wl-kjv\" data-code=\"H3553\">helmet</span> of <span class=\"wl wl-kjv\" data-code=\"H3444\">salvation</span> upon his <span class=\"wl wl-kjv\" data-code=\"H7218\">head;</span> and he put <span class=\"wl wl-kjv\" data-code=\"H3847\">on</span> the <span class=\"wl wl-kjv\" data-code=\"H899\">garments</span> of <span class=\"wl wl-kjv\" data-code=\"H5359\">vengeance</span> for <span class=\"wl wl-kjv\" data-code=\"H8516\">clothing,</span> and was <span class=\"wl wl-kjv\" data-code=\"H5844\">clad</span> with <span class=\"wl wl-kjv\" data-code=\"H7068\">zeal</span> as a cloke.","18":"According <span class=\"wl wl-kjv\" data-code=\"H5921\">to</span> their <span class=\"wl wl-kjv\" data-code=\"H1578\">deeds,</span> accordingly he will <span class=\"wl wl-kjv\" data-code=\"H7999\">repay,</span> <span class=\"wl wl-kjv\" data-code=\"H2534\">fury</span> to his <span class=\"wl wl-kjv\" data-code=\"H6862\">adversaries,</span> <span class=\"wl wl-kjv\" data-code=\"H1576\">recompence</span> to his <span class=\"wl wl-kjv\" data-code=\"H341\">enemies;</span> to the <span class=\"wl wl-kjv\" data-code=\"H339\">islands</span> he will <span class=\"wl wl-kjv\" data-code=\"H7999\">repay</span> recompence.","19":"So shall they <span class=\"wl wl-kjv\" data-code=\"H3372\">fear</span> the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> from the <span class=\"wl wl-kjv\" data-code=\"H4628\">west,</span> and his <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> from the <span class=\"wl wl-kjv\" data-code=\"H4217\">rising</span> of the <span class=\"wl wl-kjv\" data-code=\"H8121\">sun.</span> When the <span class=\"wl wl-kjv\" data-code=\"H6862\">enemy</span> shall come <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> like a <span class=\"wl wl-kjv\" data-code=\"H5104\">flood,</span> the <span class=\"wl wl-kjv\" data-code=\"H7307\">Spirit</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall lift up a standard","20":"And the <span class=\"wl wl-kjv\" data-code=\"H1350\">Redeemer</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion,</span> and unto them that <span class=\"wl wl-kjv\" data-code=\"H7725\">turn</span> from <span class=\"wl wl-kjv\" data-code=\"H6588\">transgression</span> in <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.","21":"As for me, this is my <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> with them, <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> My <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> that is upon thee, and my <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> which I have <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> in thy <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> shall not <span class=\"wl wl-kjv\" data-code=\"H4185\">depart</span> out of thy <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> nor out of the <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> of thy <span class=\"wl wl-kjv\" data-code=\"H2233\">seed,</span> nor out of the <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> of thy <span class=\"wl wl-kjv\" data-code=\"H2233\">seed's</span> <span class=\"wl wl-kjv\" data-code=\"H2233\">seed,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> from henceforth and <span class=\"wl wl-kjv\" data-code=\"H5704\">for</span> ever."},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"verbergen","tekst":"Dat is, maken dat Hij het aangezicht verbergt."},{"catchword":"niet hoort","tekst":"Te weten uwe gebeden, dat is dat Hij u niet helpt."}],"3":[{"catchword":"uw handen","tekst":"Hebreeuws, uwe palmen. Zie Isa 1:15 ."},{"catchword":"valsheid,","tekst":"Of, leugen."},{"catchword":"dicht onrecht","tekst":"Of, spreekt uit."}],"4":[{"catchword":"roept,","tekst":"Alzo namelijk dat hij degenen, die tegen de gerechtigheid handelen, afmaant; of, de onschuldigen verdedigt; of, die een rechtvaardige zaak en de waarheid naar zijn uiterste vermogen handhaaft."},{"catchword":"van moeite","tekst":"Welke zij gaarne tegen hunne naasten zouden aan den dag brengen."},{"catchword":"ongerechtigheid","tekst":"Of, ijdelheid, en alzo vs.6,7."}],"5":[{"catchword":"Zij broeden","tekst":"Hebreeuws, zij splijten basiliskuseieren uit; dat is, zij hebben vergiftige en zeer schadelijke aanslagen voor. Gelijk de basiliskus niet kan uitbroeien dan wat vergiftig is, alzo komt er van den goddeloze niets dan dat schadelijk is."},{"catchword":"zij weven","tekst":"Dat is, zij maken aanslagen om anderen te vangen en te verslinden, gelijk een spin met haar weg de vliegen en muggen vangt, en die daarna doodt en opeet. Zie Job 8:14 ."},{"catchword":"die van hun eieren eet,","tekst":"Dat is, die zich hunner aanslagen deelachtig maakt; of, die zich gemeenzaam met hen maakt."},{"catchword":"als het in stukken","tekst":"Te weten als het ei in stukken gedrukt wordt; anders: wordt er iemand mede besprengd, of zo het iemand verspreidt; dat is, zo het iemand niet wil eten, maar werpt het daarheen, dat het over de aarde gespreid wordt, zo barst er een adder uit; dat is, zo iemand der boze mensen aanslagen ontdekt en verhindert, zo vergrimmen zij zich tegen hem en zoeken hem te beschadigen."}],"6":[{"catchword":"deugen niet","tekst":"Hebreeuws, zullen niet tot klederen worden; dat is, hunne aanslagen zullen hun geen voordeel aanbrengen."},{"catchword":"niet kunnen dekken","tekst":"Dat is, niet kunnen beschermen in tijd van nood."},{"catchword":"des wrevels","tekst":"Of, des gewelds."}],"7":[{"catchword":"Hun voeten","tekst":"Dat is, zij zijn zo geneigd tot de boosheid, dat als zij ergens weten kwaad te doen, zij gaan er niet naar toe, maar zij lopen er naar toe. Deze woorden spreekt de apostel Rom 3:15 , om te bewijzen dat de Joden zowel zondaars zijnn en van nature bedorven, als de heidenen."},{"catchword":"verstoring","tekst":"Dat is, zij trachten nergens anders naar dan om hunnen naaste schade en schande aan te brengen."}],"8":[{"catchword":"er is geen recht","tekst":"Dat is, daar is geen waarheid noch billijkheid bij hen te vinden. Zie Job 34:4 ."},{"catchword":"hun paden","tekst":"Dat is, zij maken zichzelven kromme paden."},{"catchword":"al wie daarop gaat,","tekst":"Dat is, wie met hen omgaat of hun bozen handel navolgt."}],"9":[{"catchword":"Daarom","tekst":"Dat is, daarom doet God ons geen recht noch wraak over onze vijanden; maar Hij laat denzelven nog dagelijks toe ons te drukken en te benauwen; zodat recht hier zoveel betekent als hulp of verlossing, gelijk vs.11, 14."},{"catchword":"het licht,","tekst":"Zie de aantekening Isa 58:8 ."},{"catchword":"duisternis,","tekst":"Dat is, droefenis en tegenspoed."}],"10":[{"catchword":"Wij tasten","tekst":"Zie Job 5:14 , en Job 12:25 , en vergelijk Deu 28:29 ."},{"catchword":"woeste plaatsen","tekst":"Anders: vettigheden, of vette plaatsen; waarvan de zin zou zijn: Wij zijn wel in voorspoed en in overvloed van alle dingen, in een goed vet land; evenwel zijn wij als doden, midden in den zegen; wij kunnen van den rijken zegen Gods niet genieten, vanwege de bangheid, die wij hebben voor onze vijanden."}],"11":[{"catchword":"kirren","tekst":"Of, piepen; gelijk Isa 38:14 . Hebreeuws, kirrende kirren wij."},{"catchword":"naar recht,","tekst":"Zie boven vs.9."}],"12":[{"catchword":"onze zonden","tekst":"Hebreeuws, onze zonden getuigt; dat is ieder onzer zonden."},{"catchword":"bij ons,","tekst":"Dat is, binnen in ons, in onze conscientiën, wij kunnen ze niet loochenen, zij vergezelschappen en volgen ons overal."}],"13":[{"catchword":"Het overtreden","tekst":"Zie boven Isa 57:11 ."},{"catchword":"het spreken","tekst":"Hoe men zijnen naaste zal onderdrukken, en hoe men van God zal afwijken."},{"catchword":"het ontvangen","tekst":"Het ontvangen; te weten in onze harten als in ene baarmoeder."},{"catchword":"het dichten","tekst":"Gelijk boven vs.3."}],"14":[{"catchword":"is het recht","tekst":"Zie boven vs.9. Doch anderen aldus: En het recht is achterwaarts gedreven; in dezen zin, als zijnde ee (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +

    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

  const keys = Object.keys(noten);

  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
