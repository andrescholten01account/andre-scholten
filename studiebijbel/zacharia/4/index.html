t hij zal de hoofdsteen naar voren brengen onder toeroepingen: Genade, genade zij hem!","8":"Het woord van de HEERE kwam verder tot mij:","9":"De handen van Zerubbabel hebben dit huis gegrondvest, zijn handen zullen het ook voltooien; opdat u weet dat de HEERE van de heerscharen mij tot u gezonden heeft.","10":"Want wie veracht de dag van de kleine dingen? Toch zullen die zeven zich verblijden, als zij het tinnen gewicht zullen zien in de hand van Zerubbabel; dat zijn de ogen van de HEERE, die het hele land doorkruisen.","11":"Verder antwoordde ik en zei tegen Hem: Wat zijn die twee olijfbomen, aan de rechterzijde van de kandelaar en aan zijn linkerzijde?","12":"En opnieuw antwoordend, zei ik tegen Hem: Wat zijn die twee takjes van de olijfbomen, die naast de twee gouden kruiken zijn, die het goud uit zichzelf uitgieten?","13":"En Hij sprak tegen mij: Weet u niet wat deze zijn? En ik zei: Nee, mijn Heere!","14":"Toen zei Hij: Deze zijn de twee olietakken, die voor de Heere van de hele aarde staan."},"SV":{"1":"En de Engel, Die met mij sprak, kwam weder; en Hij wekte mij op, gelijk een man, die van zijn slaap opgewekt wordt.","2":"En Hij zeide tot mij: Wat ziet gij? En ik zeide: Ik zie, en ziet, een geheel gouden kandelaar, en een oliekruikje boven deszelfs hoofd, en zijn zeven lampen daarop; die lampen hadden zeven en zeven pijpen, dewelke boven zijn hoofd waren;","3":"En twee olijfbomen daarnevens, een ter rechterzijde van het oliekruikje, en een tot deszelfs linkerzijde.","4":"En ik antwoordde, en zeide tot den Engel, Die met mij sprak, zeggende: Mijn Heere! wat zijn deze dingen?","5":"Toen antwoordde de Engel, Die met mij sprak, en zeide tot mij: Weet gij niet, wat deze dingen zijn? En ik zeide: Neen, mijn Heere!","6":"Toen antwoordde Hij, en sprak tot mij, zeggende: Dit is het woord des HEEREN tot Zerubbabel, zeggende: Niet door kracht noch door geweld, maar door Mijn Geest *zal* *het* *geschieden*, zegt de HEERE der heirscharen.","7":"Wie zijt gij, o grote berg? Voor het aangezicht van Zerubbabel zult gij worden tot een vlak veld; want hij zal den hoofdsteen voortbrengen *met* toeroepingen: Genade, genade zij denzelven!","8":"Het woord des HEEREN geschiedde verder tot mij, zeggende:","9":"De handen van Zerubbabel hebben dit huis gegrondvest, zijn handen zullen het ook voleinden; opdat gij weet, dat de HEERE der heirscharen mij tot ulieden gezonden heeft.","10":"Want wie veracht den dag der kleine dingen? daar zich toch die zeven verblijden zullen, als zij het tinnen gewicht zullen zien in de hand van Zerubbabel; dat zijn de ogen des HEEREN, die het ganse land doortrekken.","11":"Verder antwoordde ik, en zeide tot Hem: Wat zijn die twee olijfbomen, ter rechterzijde des kandelaars, en aan zijn linkerzijde?","12":"En andermaal antwoordende, zo zeide ik tot Hem: Wat zijn die twee takjes der olijfbomen, welke in de twee gouden kruiken zijn, die goud van zich gieten?","13":"En Hij sprak tot mij, zeggende: Weet gij niet, wat deze zijn? En ik zeide: Neen, mijn Heere!","14":"Toen zeide Hij: Deze zijn de twee olietakken, welke voor den Heere der ganse aarde staan."},"KJV":{"1":"And the angel that talked with me came again, and waked me, as a man that is wakened out of his sleep,","2":"And said unto me, What seest thou? And I said, I have looked, and behold a candlestick all *of* gold, with a bowl upon the top of it, and his seven lamps thereon, and seven pipes to the seven lamps, which *are* upon the top","3":"And two olive trees by it, one upon the right *side* of the bowl, and the other upon the left","4":"So I answered and spake to the angel that talked with me, saying, What *are* these, my lord?","5":"Then the angel that talked with me answered and said unto me, Knowest thou not what these be? And I said, No, my lord.","6":"Then he answered and spake unto me, saying, This *is* the word of the LORD unto Zerubbabel, saying, Not by might, nor by power, but by my spirit, saith the LORD of hosts.","7":"Who *art* thou, O great mountain? before Zerubbabel *thou shalt become* a plain: and he shall bring forth the headstone *thereof with* shoutings, *crying*, Grace, grace","8":"Moreover the word of the LORD came unto me, saying,","9":"The hands of Zerubbabel have laid the foundation of this house; his hands shall also finish it; and thou shalt know that the LORD of hosts hath sent","10":"For who hath despised the day of small things? for they shall rejoice, and shall see the plummet in the hand of Zerubbabel *with* those seven; they *are* the eyes of the LORD, which run to and fro through the whole earth.","11":"Then answered I, and said unto him, What *are* these two olive trees upon the right *side* of the candlestick and upon the left","12":"And I answered again, and said unto him, What *be these* two olive branches which through the two golden pipes empty the golden","13":"And he answered me and said, Knowest thou not what these *be*? And I said, No, my lord.","14":"Then said he, These *are* the two anointed ones, that stand by the Lord of the whole earth."}},"tsk":{"1":[{"kopje":"de Engel","refs":["Zach 1:9","Zach 1:13","Zach 1:19","Zach 2:3","Zach 3:6","Zach 3:7"]},{"kopje":"wekte","refs":["1 Kon 19:5-7","Jer 31:26","Dan 8:18","Dan 10:8-10","Luk 9:32","Luk 22:45","Luk 22:46"]}],"2":[{"kopje":"Wat","refs":["Zach 5:2","Jer 1:11-13"]},{"kopje":"een kandelaar","refs":["Ex 25:31-38","Ex 37:17-24","Ex 40:24","Ex 40:25","1 Kon 7:49","1 Kon 7:50","1 Kron 28:15","2 Kron 4:7","2 Kron 4:20-22","2 Kron 13:11","Jer 52:19","Matt 5:14-16","Openb 1:12","Openb 1:20","Openb 2:1"]},{"kopje":"een oliekruikje","refs":["1 Kon 7:50"]},{"kopje":"zeven","refs":["Ex 25:37","Openb 4:5"]},{"kopje":"zeven pijpen","refs":["Zach 4:12"]}],"4":[{"kopje":"wat","refs":["Zach 4:12-14","Zach 1:9","Zach 1:19","Zach 5:6","Zach 6:4","Dan 7:16-19","Dan 12:8","Matt 13:36","Openb 7:13","Openb 7:14"]}],"5":[{"kopje":"Weet","refs":["Zach 4:13","Mark 4:13"]},{"kopje":"Nee","refs":["Gen 41:16","Ps 139:6","Dan 2:30","1 Kor 2:12-15"]}],"6" n class=\"wl wl-kjv\" data-code=\"H3045\">Knowest</span> thou not what these be? And I <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> No, my lord.","6":"Then he <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> unto me, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> This is the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> unto <span class=\"wl wl-kjv\" data-code=\"H2216\">Zerubbabel,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Not by <span class=\"wl wl-kjv\" data-code=\"H2428\">might,</span> nor by <span class=\"wl wl-kjv\" data-code=\"H3581\">power,</span> but by my <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of hosts.","7":"Who art thou, O <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain?</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H2216\">Zerubbabel</span> thou shalt become a <span class=\"wl wl-kjv\" data-code=\"H4334\">plain:</span> and he shall bring <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> the <span class=\"wl wl-kjv\" data-code=\"H68\">headstone</span> thereof with <span class=\"wl wl-kjv\" data-code=\"H8663\">shoutings,</span> crying, <span class=\"wl wl-kjv\" data-code=\"H2580\">Grace,</span> grace","8":"Moreover the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> came unto me, saying,","9":"The <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> of <span class=\"wl wl-kjv\" data-code=\"H2216\">Zerubbabel</span> have laid the <span class=\"wl wl-kjv\" data-code=\"H3245\">foundation</span> of this <span class=\"wl wl-kjv\" data-code=\"H1004\">house;</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> shall also <span class=\"wl wl-kjv\" data-code=\"H1214\">finish</span> it; and thou shalt <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts</span> hath sent","10":"For who hath <span class=\"wl wl-kjv\" data-code=\"H936\">despised</span> the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of small <span class=\"wl wl-kjv\" data-code=\"H6996\">things?</span> for they shall <span class=\"wl wl-kjv\" data-code=\"H8055\">rejoice,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> the <span class=\"wl wl-kjv\" data-code=\"H68\">plummet</span> in the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H2216\">Zerubbabel</span> with those <span class=\"wl wl-kjv\" data-code=\"H7651\">seven;</span> they are the <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> which run to and <span class=\"wl wl-kjv\" data-code=\"H7751\">fro</span> through the whole earth.","11":"Then <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> I, and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, What are these <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> olive <span class=\"wl wl-kjv\" data-code=\"H2132\">trees</span> upon the <span class=\"wl wl-kjv\" data-code=\"H3225\">right</span> side of the <span class=\"wl wl-kjv\" data-code=\"H4501\">candlestick</span> and upon the left","12":"And I <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> <span class=\"wl wl-kjv\" data-code=\"H8145\">again,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, What be these <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H2132\">olive</span> <span class=\"wl wl-kjv\" data-code=\"H7641\">branches</span> which <span class=\"wl wl-kjv\" data-code=\"H3027\">through</span> the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H2091\">golden</span> <span class=\"wl wl-kjv\" data-code=\"H6804\">pipes</span> <span class=\"wl wl-kjv\" data-code=\"H7324\">empty</span> the golden","13":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">answered</span> me and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">Knowest</span> thou not what these be? And I <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> No, my lord.","14":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> he, These are the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H3323\">anointed</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">ones,</span> that <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> by the <span class=\"wl wl-kjv\" data-code=\"H113\">Lord</span> of the whole earth."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"met mij sprak,","tekst":"Of, in mij."},{"catchword":"kwam weder;","tekst":"Want na het voorgaande gezicht was hij weggegaan voor een tijdlang."},{"catchword":"Hij wekte mij op,","tekst":"Want de profeet was als in bezwijming of in slaap gekomen van grote verwondering over die tevoren verhaalde gezichten; verg. Dan 8:17 , Dan 8:27 , en Dan 10:8 ."}],"2":[{"catchword":"daarop;","tekst":"Of, die daar bovenop waren; te weten op den kandelaar, of daarin; verg. Exo 25:31 ."},{"catchword":"pijpen,","tekst":"Of, kranen, of buisjes, door welke de olie kwam uit de oliekruik in de zeven lampen, op elke lamp een pijp passende."},{"catchword":"zijn hoofd waren;","tekst":"Te weten, van den kandelaar; hoofd, dat is hoogte."}],"3":[{"catchword":"daarnevens,","tekst":"Of, daarbij; of daarop."}],"4":[{"catchword":"ik antwoordde,","tekst":"Dat is, ik sprak wederom. Alzo ook vs.11,12, en elders meer."},{"catchword":"met mij sprak,","tekst":"Of, in mij; alzo ook vs.5, en Zech 1:9 ."},{"catchword":"wat zijn deze dingen?","tekst":"Gelijk in Zech 1:9."}],"5":[{"catchword":"wat deze dingen zijn?","tekst":"Hebr. wat deze zelve dingen zijn?"}],"6":[{"catchword":"Dit is het woord des HEEREN","tekst":"De zin is: Dit is hetgeen afgebeeld wordt door dit gezicht, dat gij den vorst Zerubbabel in mijnen naam zult aandienen, namelijk dat deze schone gouden kandelaar [zonder handen der mensen gemaakt] betekent dat de tempel zal herbouwt en voltrokken worden, alzo dat de gouden kandelaar in denzelven wederom zal gebracht worden, gelijk hij er tevoren geweest is. God de Heere heeft hiermede Zerubbabel in zijn ambt en beroep willen sterken en troosten, toen er uiterlijk geringe middelen voorhanden waren tot opbouwing van den tempel en tot wederstand der vijanden, die zulks zochten te verhinderen."},{"catchword":"Niet door kracht noch door geweld,","tekst":"Te weten, niet door menselijke kracht en geweld."},{"catchword":"door Mijn Geest","tekst":"Dat is, door mijn Heilige Geest, door welken Ik dit krachtig werken en uitvoeren zal."},{"catchword":"zal het geschieden ,","tekst":"Te weten, de opbouwing van den tempel, mitsgaders de behoudenis en de zaligheid van mijn volk. Dir alles kan God, als het Hem belieft, alleen doen, zonder de hulp van mensen, welke Hem nochtans belieft somtijds daartoe te gebruiken."}],"7":[{"catchword":"Wie zijt gij,","tekst":"Dit is ene aanspraak aan Saneballet en de vijanden van het volk Gods, die ten aanzien van de geringheid deszelven en van Zerubbabel, zichzelven inbeeldden dat zij grote bergen waren, en wederstonden denzelven met al hun vermogen, gelijk te zien is Ezr 3:4-5 . Maar de Heere zegt hier dat zij tegen Zerubbabel niets vermogen zouden, noch den bouw van den tempel zouden kunnen verhinderen. Alzo is te allen tijde tevergeefs geweest het woelen en razen der vijanden tegen Christus en zijne gemeente hier op aarde. Of aldus: Wie zijt gij, o grote berg, voor het aangezicht van Zerubbabel? gij zult, enz."},{"catchword":"tot een vlak veld;","tekst":"Of, tot een vallei."},{"catchword":"den hoofdsteen voortbrengen","tekst":"Of, den hogen steen, te weten des tempels; dat is, hij zal het gebouw des tempels ten einde brengen, vs.9, ja hij zal niet alleen den tempel weder opbouwen, maar hij zal ook een voorvader van Christus, den waren hoeksteen of hoofdsteen zijner gemeente Psa 118:22 , zijn; want Zerubbabel is geweest een vorst van het volk Gods en een voorbeeld van Christus onzen eeuwigen Koning, uit welken ook Christus, naar het vlees, afkomstig is; Mat 1:12 ."},{"catchword":"met toeroepingen","tekst":"Heb. [met] kraking, als wanneer iemand roept, dat hem de hals kraakt, of dat de lucht schijnt te kraken en te bersten."},{"catchword":"Genade, genade zij denzelven","tekst":"Dat is, geluk, geluk zij denzelven, te weten hoofdsteen, en alzo ook den gehelen tempel, ja ook Christus en zijne kerk, waarvan de tempel een voorbeeld was. De zin is: Daar zal een algemene gelukwensing zijn, zo der engelen als der gelovige, ja aller creaturen, die erkenen zullen dat in Hem, te weten Christus, de volheid aller genaden en gaven is, en zij zullen wensen en begeren dat de Vader, door zijne genade, het rijk van Christus toch wil voorspoedig maken, Psa 118:26 . Anders: het is genade. Dan is dit de zin: Het is loutere genade, dat Gij ons den tempel hebt laten herbouwen, het is door onze eigen kracht en waardigheid niet geschied. De verdubbeling of wederhaling van het woord genade betekent zeer grote genade. Verg. Isa 26:3 , en Isa 57:19 ."}],"8":[{"catchword":"des HEEREN","tekst":"Namelijk van den Zoon van God, die Zech 1:12 genoemd wordt de Engel des Heeren, en in Zech 3:2, de Heere. Anders: want het Woord des Heeren was tot mij geschied, zeggende: Alsof de profeet zeide: Dit spreekt ik uit last en bevel des Heeren."}],"10":[{"catchword":"wie veracht den dag der kleine dingen?","tekst":"Dat is, den dag van de kleine beginselen der wederopbouwing van den tempel; alsof Christus zeide: De Vader heeft dit door zijn almogende voorzienigheid alzo geordineerd, wie zal het verhinderen? Het behaagt hem, wie het zal verachten?"},{"catchword":"zeven verblijden zullen,","tekst":"Te weten, ogen, van welke gesproken is, Zech 3:9 , gelijk ook gesproken zal worden onder Zech 5:6, en Rev 5:6 ."},{"catchword":"het tinnen gewicht zullen zien","tekst":"Hebr. den steen des tins, of den tinnen steen; dat is, het meetsnoer, waar een tinnen of loden gewicht aan hangt. Zie Isa 34:11 de aantekening aldaar."},{"catchword":"ogen des HEEREN,","tekst":"Dat is, de vaste voorzienigheid des Heeren."},{"catchword":"die het ganse land doortrekken","tekst":"Verg. 2Ch 16:9 ."}],"11":[{"catchword":"Wat zijn die twee olijfbomen,","tekst":"Dat is, wat beduiden."}],"12":[{"catchword":"takjes der olijfbomen,","tekst":"Of, bezien, of takken met bezië. Zie het antwoord op deze vraag vs.14."},{"catchword":"welke in de twee gouden kruiken zijn,","tekst":"Hebr. welke in, of aan de hand der twee gouden kruiken zijn. Het Hebr. woord jad betekent somtijds ene ruimte, gelijk Neh 7:4 ; Psa 104:25 ; somtijds ene zijde, gelijk 2Sa 15:2 ."},{"catchword":"goud van zich","tekst":"Dat is, olie, die zo helder, geel en blinkende is alsof het goud ware; door deze klare olie worden beduid de gaven des Heilige Geest."},{"catchword":"gieten?","tekst":"Te weten, in de schaal, en van zich betekent hier zoveel als vanzelf, zonder hulp of kunst der mensen."}],"13":[{"catchword":"deze zijn?","tekst":"Te weten, olijfbomen of olijftakken. Anders: wat deze dingen zijn; dat is, wat ze beduiden? Alzo ook vs.14."}],"14":[{"catchword":"de twee","tekst":"Versta, den Heere Christus, de fontijn aller geestelijke gaven, hier afgebeeld door deze twee getrouwe dienaars des Heeren, te weten Zerubbabel en Jozua, ten aanzien van zijn koninklijk en zijn hogepriesterlijk ambt."},{"catchword":"olietakken,","tekst":"Hebr. zonen der olie, [welke manier van spreken ook gebruikt wordt in Gen 49:22 ] ; dat is, gezalfde, omdat de koningen en hogepriesterlijk plachten geolied of gezalfd te worden, Exo 29:29 , en Exo 30:30 ; Lev 8:12 ; 1Sa 10:1 , en 1Sa 24:7 . Hiermede beantwoordt de engel den profeet zijne vraag, zie vs.12. Verg. deze plaats met Rev 11:4 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And the angel that spake with me, [Or, in me] came again: [for after the former vision he was departed for a time] and he weakened me, [for, the prophet was fallen as it were into a trance or fast asleep, upon the great amazement wrought in him by the forementioned visions, compare Dan. 8.17, 27 and 10.8.] as a man is wakened out of his sleep."}],"2":[{"catchword":null,"tekst":"And he said unto me, what seest thou? And I said; I see, and behold, a candlestick all gold, and an oil cruse up on the head of it, and his seven lamps thereof; [or, that were a top it: to wit upon the candlestick. Compare Exod. 25.31.] those lamps had seven and seven pipes, [or, conveyances through which the oil past out of the cruse into the seven lamps, each lamp having its pipe for that purse] which were above her head. [his. Viz. the candlesticks; head, for top, upper part.]"}],"3":[{"catchword":null,"tekst":"And two olive-trees besides it [Or, by, or, on it] one at the right side of the olive-bowl, and one at the left side thereof."}],"4":[{"catchword":null,"tekst":"And I answered, [i.e. I spake again, and so also below verse 11.12 and elsewhere] and said to the angel, that spake with me, [or, in me, as also verse 5. se above chap. 11 on verse 4.] saying, my Lord, what are these things? [as above chap. 1.9.]"}],"5":[{"catchword":null,"tekst":"Then answered the angel, that spake with me, and said unto me; knoweth thou not, what these things are? [Heb. What these same things are?] and I said. No my Lord."}],"6":[{"catchword":null,"tekst":"Then he answered and spake to me  building of the temple, verse 9. yea he shall not onely build up the temple again, but he shall also be a progenitor of Christ the true Corner-stone, or Headstone of his church (Psa 118:22) for Zerubbabel was a prince of God&acirc;&euro;&trade;s people, and type of Christ our eternal king, descended from him, according to the flesh. Mat. 1.12.] (with) acclamations [eb. (with) cracking: when people cry and shout that they are ready to build with it, or, that the aie seems to rend in pieces by the force of it] grace be to the same. [i.e. all happiness and prosperity attend upon this Headstone, and the whole temple, and upon Christ himself, and his church of whom the temple was a type. The sense is, there shall be a general congratulation made, as well by the angels, as true believers and all creatures besides, acknowledging, the fullness of all gifts and graces to be in Christ, and they shall wish and desire, that the father, through his grace will be pleased to bless and prosper the kingdom of Christ more and more, Psa 118:26. otherwise: it is grace, grace; then the sense would be; it is of meer grace and mercy indeed, that thou hast made us to re-edifie this temple; it was not brought to pass&Atilde;&copy; by our power or worthiness, the doubling or, reiterating of word grace, implyeth a very great grace. Compare Isa. 26.3. and 57.29.]"}],"8":[{"catchword":null,"tekst":"The word of the lord came further to me, saying: [viz. of the son of God, called above chap. 1.12. the angel of the lord and Ezek. 3 verse 2 the LORD. Otherwise sot the word of the LORD was come to me. Saying; as if the prophet had said, this I speak by charge and command from the Lord.]"}],"9":[{"catchword":null,"tekst":"The hands of Zerubbabel have laid the foundation of this house, his hands shall also absolve it: the ye may know, that the LORD of hostes hath sent me to you."}],"10":[{"catchword":null,"tekst":"For, who despiseth the day of small things? [that is, the day of the small beginnings o // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {

  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

function kopieerVers(n) {

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {

  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">

    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
