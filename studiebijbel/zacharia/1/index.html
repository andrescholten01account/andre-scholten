 daden, zo heeft Hij met ons gedaan.","7":"Op de vierentwintigste dag, in de elfde maand (dat is de maand Schebat), in het tweede jaar van Darius, kwam het woord van de HEERE tot Zacharia, de zoon van Berechja, de zoon van Iddo, de profeet, en hij zei:","8":"Ik zag 's nachts, en zie, een Man rijdend op een rood paard, en Hij stond tussen de mirten die in de diepte waren; en achter Hem waren rode, bruine en witte paarden.","9":"En ik zei: Mijn Heere! Wat zijn deze? Toen zei de Engel Die met mij sprak tegen mij: Ik zal u tonen wat deze zijn.","10":"Toen antwoordde de Man Die tussen de mirten stond, en zei: Deze zijn het die de HEERE uitgezonden heeft om het land te doorwandelen.","11":"En zij antwoordden de Engel van de HEERE Die tussen de mirten stond, en zeiden: Wij hebben het land doorwandeld, en zie, het hele land zit rustig en is stil.","12":"Toen antwoordde de Engel van de HEERE, en zei: HEERE van de heerscharen! Hoelang zult U Zich niet ontfermen over Jeruzalem en over de steden van Juda, op wie U toornig geweest bent, deze zeventig jaren?","13":"En de HEERE antwoordde de Engel Die met mij sprak, met goede woorden, troostvolle woorden.","14":"En de Engel Die met mij sprak, zei tegen mij: Roep uit en zeg: Zo zegt de HEERE van de heerscharen: Ik ijver over Jeruzalem en over Sion met een grote ijver.","15":"En Ik ben met een zeer grote toorn vertoornd tegen die geruste heidenen; want Ik was een weinig toornig, maar zij hebben tot het kwade meegeholpen.","16":"Daarom zegt de HEERE zo: Ik ben tot Jeruzalem teruggekeerd met ontfermingen; Mijn huis zal daarin gebouwd worden, spreekt de HEERE van de heerscharen, en het meetlint zal over Jeruzalem uitgespannen worden.","17":"Roep nog, en zeg: Zo zegt de HEERE van de heerscharen: Mijn steden zullen nog uitgespreid worden vanwege de voorspoed; want de HEERE zal Sion nog troosten, en Hij zal Jeruzalem nog verkiezen.","18":"En ik hief mijn ogen op, en zag; en zie, er waren vier horens.","19":"En ik zei tegen de Engel Die met mij sprak: Wat zijn deze? En Hij zei tegen mij: Dat zijn de horens die Juda, Israël en Jeruzalem verstrooid hebben.","20":"En de HEERE toonde mij vier smeden.","21":"Toen zei ik: Wat komen die doen? En Hij sprak en zei: Dat zijn de horens die Juda verstrooid hebben, zodat niemand zijn hoofd ophief; maar deze zijn gekomen om die te verschrikken, om de horens van de heidenen neer te werpen, die hun horen verheven hebben tegen het land van Juda om dat te verstrooien."},"SV":{"1":"In de achtste maand, in het tweede jaar van Darius, geschiedde het woord des HEEREN tot Zacharia, den zoon van Berechja, den zoon van Iddo, den profeet, zeggende:","2":"De HEERE is zeer vertoornd geweest tegen uw vaderen.","3":"Daarom zeg tot hen: Alzo zegt de HEERE der heirscharen: Keert weder tot Mij, spreekt de HEERE der heirscharen, zo zal Ik weder tot ulieden keren, zegt de HEERE der heirscharen.","4":"Weest niet als uw vaderen, tot dewelke de vorige profeten riepen, zeggende: Alzo zegt de HEERE der heirscharen: Bekeert u toch van uw boze wegen, en uw boze handelingen; maar zij hoorden niet, en zij luisterden niet naar Mij, spreekt de HEERE.","5":"Uw vaderen, waar zijn die? En de profeten, zullen zij in eeuwigheid leven?","6":"Nochtans Mijn woorden en Mijn inzettingen, die Ik Mijn knechten, den profeten, geboden had, hebben zij uw vaders niet getroffen? zodat zij wederkerende zeiden: Gelijk als de HEERE der heirscharen gedacht heeft ons te doen, naar onze wegen en naar onze handelingen, alzo heeft Hij met ons gedaan.","7":"Op den vier en twintigsten dag, in de elfde maand ( die de maand Schebat is), in het tweede jaar van Darius, geschiedde het woord des HEEREN tot Zacharia, den zoon van Berechja, den zoon van Iddo, den profeet, zeggende:","8":"Ik zag des nachts, en ziet, een Man rijdende op een rood paard, en Hij stond tussen de mirten, die in de diepte waren; en achter Hem waren rode, bruine en witte paarden.","9":"En Ik zeide: Mijn Heere! wat zijn deze? Toen zeide tot mij de Engel, Die met mij sprak: Ik zal u tonen, wat deze zijn.","10":"Toen antwoordde de Man, Die tussen de mirten stond, en zeide: Deze zijn het, die de HEERE uitgezonden heeft, om het land te doorwandelen.","11":"En zij antwoordden den Engel des HEEREN, Die tussen de mirten stond, en zeiden: Wij hebben het land doorwandeld, en ziet, het ganse land zit en het is stil.","12":"Toen antwoordde de Engel des HEEREN, en zeide: HEERE der heirscharen! hoe lang zult Gij U niet ontfermen over Jeruzalem, en over de steden van Juda, op welke Gij gram geweest zijt, deze zeventig jaren?","13":"En de HEERE antwoordde den Engel, Die met mij sprak, goede woorden, troostelijke woorden.","14":"En de Engel, Die met mij sprak, zeide tot mij: Roep uit, zeggende: Alzo zegt de HEERE der heirscharen: Ik ijver over Jeruzalem en over Sion met een groten ijver.","15":"En Ik ben met een zeer groten toorn vertoornd tegen die geruste heidenen; want Ik was een weinig toornig, maar zij hebben ten kwade geholpen.","16":"Daarom zegt de HEERE alzo: Ik ben tot Jeruzalem wedergekeerd met ontfermingen; Mijn huis zal daarin gebouwd worden, spreekt de HEERE der heirscharen, en het richtsnoer zal over Jeruzalem uitgestrekt worden.","17":"Roep nog, zeggende: Alzo zegt de HEERE der heirscharen: Mijn steden zullen nog uitgespreid worden vanwege het goede; want de HEERE zal Sion nog troosten, en Hij zal Jeruzalem nog verkiezen.","18":"En ik hief mijn ogen op, en zag; en ziet, er waren vier hoornen.","19":"En ik zeide tot den Engel, Die met mij sprak: Wat zijn deze? En Hij zeide tot mij: Dat zijn de hoornen, welke Juda, Israël en Jeruzalem verstrooid hebben.","20":"En de HEERE toonde mij vier smeden.","21":"Toen zeide ik: Wat komen die maken? En Hij sprak, zeggende: Dat zijn de hoornen, die Juda verstrooid hebben, zodat niemand zijn hoofd ophief; maar deze zijn gekomen om die te verschrikken, om de hoornen der heidenen neder te werpen, welke den hoorn verheven hebben tegen het land van Juda, om dat te verstrooien."},"KJV":{"1":"In the eighth month, in the second year of Darius, came the word of the LORD unto Zechariah, the son of Berechiah, the son of Iddo the prophet, saying,","2":"The LORD hath been sore displeased with your fathers.","3":"Therefore say thou unto them, Thus saith the LORD of hosts; Turn ye unto me, saith the LORD of hosts, and I will turn unto you, saith the LORD of hosts.","4":"Be ye not as your fathers, unto whom the former prophets have cried, saying, Thus saith the LORD of hosts; Turn ye now from your evil ways, and *from* your evil doings: but they did not hear, nor hearken unto me, saith the LORD.","5":"Your fathers, where *are* they? and the prophets, do they live for ever?","6":"But my words and my statutes, which I commanded my servants the prophets, did they not take hold of your fathers? and they returned and said, Like as the LORD of hosts thought to do unto us, according to our ways, and according to our doings, so hath he dealt","7":"Upon the four and twentieth day of the eleventh month, which *is* the month Sebat, in the second year of Darius, came the word of the LORD unto Zechariah, the son of Berechiah, the son of Iddo the prophet, saying,","8":"I saw by night, and behold a man riding upon a red horse, and he stood among the myrtle trees that *were* in the bottom; and behind him *were there* red horses, speckled, and white.","9":"Then said I, O my lord, what *are* these? And the angel that talked with me said unto me, I will shew","10":"And the man that stood among the myrtle trees answered and said, These *are they* whom the LORD hath sent to walk to and fro through the earth.","11":"And they answered the angel of the LORD that stood among the myrtle trees, and said, We have walked to and fro through the earth, and, behold, all the earth sitteth still, and is at rest.","12":"Then the angel of the LORD answered and said, O LORD of hosts, how long wilt thou not have mercy on Jerusalem and on the cities of Judah, against which thou hast had indignation these threescore and ten years?","13":"And the LORD answered the angel that talked with me *with* good words *and* comfortable words.","14":"So the angel that communed with me said unto me, Cry thou, saying, Thus saith the LORD of hosts; I am jealous for Jerusalem and for Zion with a great jealousy.","15":"And I am very sore displeased with the heathen *that are* at ease: for I was but a little displeased, and they helped forward the affliction.","16":"Therefore thus saith the LORD; I am returned to Jerusalem with mercies: my house shall be built in it, saith the LORD of hosts, and a line shall be stretched forth upon Jerusalem.","17":"Cry yet, saying, Thus saith the LORD of hosts; My cities through prosperity shall yet be spread abroad; and the LORD shall yet comfort Zion, and shall yet choose Jerusalem.","18":"Then lifted I up mine eyes, and saw, and behold four horns.","19":"And I said unto the angel that talked with me, What *be* these? And he answered me, These *are* the horns which have scattered Judah, Israel, and Jerusalem.","20":"And the LORD shewed me four carpenters.","21":"Then said I, What come these to do? And he spake, saying, These *are* the horns which have scattered Judah, so that no man did lift up his head: but these are come to fray them, to cast out the horns of the Gentiles, which lifted up *their* horn over the land of Judah to scatter"}},"tsk":{"1":[{"kopje":"de achtste","refs":["Zach 1:7","Zach 7:1","Ezra 4:24","Ezra 6:15","Hagg 1:1","Hagg 2:1","Hagg 2:2","Hagg 2:11","Hagg 2:21"]},{"kopje":"Zacharia","refs":["Ezra 5:1","Matt 23:35","Luk 11:51"]},{"kopje":"Iddo","refs":["Neh 12:4","Neh 12:16"]}],"2":[{"kopje":"HEERE","refs":["2 Kon 22:16","2 Kon 22:17","2 Kon 22:19","2 Kon 23:26","2 Kron 36:13-20","Ezra 9:6","Ezra 9:7","Ezra 9:13","Neh 9:26","Neh 9:27","Ps 60:3","Ps 79:5","Ps 79:6","Jer 44:6","Klaagl 1:12-15","Klaagl 2:3-5","Klaagl 3:42-45","Klaagl 5:7","Ezech 22:31","Dan 9:11","Dan 9:12","Zef 2:1-3","Matt 23:30-32","Hand 7:52"]}],"3":[{"k wl wl-kjv\" data-code=\"H1918\">trees</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> These are they whom the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> to <span class=\"wl wl-kjv\" data-code=\"H1980\">walk</span> to and fro through the earth.","11":"And they <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> the <span class=\"wl wl-kjv\" data-code=\"H4397\">angel</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> that <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> among the myrtle <span class=\"wl wl-kjv\" data-code=\"H1918\">trees,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> We have walked to and <span class=\"wl wl-kjv\" data-code=\"H1980\">fro</span> through the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> and, behold, all the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> sitteth <span class=\"wl wl-kjv\" data-code=\"H3427\">still,</span> and is at rest.","12":"Then the <span class=\"wl wl-kjv\" data-code=\"H4397\">angel</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> how long wilt thou not have <span class=\"wl wl-kjv\" data-code=\"H7355\">mercy</span> on <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> and on the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> against which thou hast had <span class=\"wl wl-kjv\" data-code=\"H2194\">indignation</span> these threescore and <span class=\"wl wl-kjv\" data-code=\"H7657\">ten</span> years?","13":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> the <span class=\"wl wl-kjv\" data-code=\"H4397\">angel</span> that <span class=\"wl wl-kjv\" data-code=\"H1696\">talked</span> with me with <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> and <span class=\"wl wl-kjv\" data-code=\"H5150\">comfortable</span> words.","14":"So the <span class=\"wl wl-kjv\" data-code=\"H4397\">angel</span> that <span class=\"wl wl-kjv\" data-code=\"H1696\">communed</span> with me <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me, <span class=\"wl wl-kjv\" data-code=\"H7121\">Cry</span> thou, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts;</span> I am <span class=\"wl wl-kjv\" data-code=\"H7065\">jealous</span> for <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> and for <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion</span> with a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> jealousy.","15":"And I am <span class=\"wl wl-kjv\" data-code=\"H1419\">very</span> <span class=\"wl wl-kjv\" data-code=\"H7110\">sore</span> <span class=\"wl wl-kjv\" data-code=\"H7107\">displeased</span> with the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen</span> that are at <span class=\"wl wl-kjv\" data-code=\"H7600\">ease:</span> for I was but a <span class=\"wl wl-kjv\" data-code=\"H4592\">little</span> <span class=\"wl wl-kjv\" data-code=\"H7107\">displeased,</span> and they <span class=\"wl wl-kjv\" data-code=\"H5826\">helped</span> forward the affliction.","16":"Therefore thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> I am <span class=\"wl wl-kjv\" data-co e=\"H559\">answered</span> me, These are the <span class=\"wl wl-kjv\" data-code=\"H7161\">horns</span> which have <span class=\"wl wl-kjv\" data-code=\"H2219\">scattered</span> <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and Jerusalem.","20":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">shewed</span> me <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> carpenters.","21":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> I, What <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> these to <span class=\"wl wl-kjv\" data-code=\"H6213\">do?</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">spake,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> These are the <span class=\"wl wl-kjv\" data-code=\"H7161\">horns</span> which have <span class=\"wl wl-kjv\" data-code=\"H2219\">scattered</span> <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> so <span class=\"wl wl-kjv\" data-code=\"H6310\">that</span> no <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> did lift <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> his <span class=\"wl wl-kjv\" data-code=\"H7218\">head:</span> but these are <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to <span class=\"wl wl-kjv\" data-code=\"H2729\">fray</span> them, to cast <span class=\"wl wl-kjv\" data-code=\"H3034\">out</span> the <span class=\"wl wl-kjv\" data-code=\"H7161\">horns</span> of the <span class=\"wl wl-kjv\" data-code=\"H1471\">Gentiles,</span> which lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> their <span class=\"wl wl-kjv\" data-code=\"H7161\">horn</span> over the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> to scatter"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"de achtste maand,","tekst":"Dit was twee maanden nadat Haggaï begonnen was te prediken; Hag 1:1 ."},{"catchword":"Daríus,","tekst":"Van den koning van Perzië ie Ezr 4:24 ."},{"catchword":"Beréchja,","tekst":"Alzo wordt hij in het Hebr. genoemd, doch bij de Grieken Barachias. Sommigen menen dat deze dezelfde is, van wien gesproken wordt Mat 23:35 . Anderen houden hen voor verscheiden; verg. 2Ch 24:21 , met de aantekening aldaar. Zie breder van de personen in dit vers genoemd Ezr 5:1 ."},{"catchword":"den profeet,","tekst":"Of, van den profeet."}],"2":[{"catchword":"zeer vertoornd geweest","tekst":"Hebr. met toorn, vertoornd."}],"3":[{"catchword":"Keert weder tot Mij,","tekst":"God keert zich tot ons als Hij ons doet gevoelen de vrucht onzer gebeden. Wij keren ons tot den Heere als wij in waar geloof en met hartelijk berouw onzer zonden zijne genade verzoeken; doch dit hebben wij van onszelven niet, maar God de Heere moet het ons geven, gelijk er staat Jer 31:18 . Heere, bekeer mij, zo zal ik bekeerd zijn."}],"4":[{"catchword":"Weest niet als uw vaderen,","tekst":"Te weten, in onbekeerlijkheid. Zie 2Ch 36:15-16 ."},{"catchword":"de vorige profeten riepen,","tekst":"Die vóór de Babylonische gevangenschap geprofeteerd hebben."},{"catchword":"luisterden niet naar Mij,","tekst":"Zij luisterden niet naar hetgeen Ik hun door mijne profeten liet aanzeggen."}],"5":[{"catchword":"waar zijn die?","tekst":"Alsof Hij zeide: Zij zijn wel niet meer voorhanden, gij behoordet u evenwel aan hen te spiegelen. Zie 1Co 10:5-6 ."},{"catchword":"zullen zij","tekst":"Anders: leven zij in eeuwigheid? Dat is, al zijn die vorige profeten dood, zo blijven evenwel hunne profetieën voor altoos. Zie vs.6, en verg. 2Pe 1:15 . Anderen vertalen en verklaren die woorden aldus, als zijnde de woorden der boze mensen: maar de profeten [die hen berispt hebben] hebben die altijd geleefd? Waar zijn die nu ook? Zij zijn immers ook al gestorven."},{"catchword":"in eeuwigheid leven?","tekst":"Dat is, altijd."}],"6":[{"catchword":"geboden had,","tekst":"Te weten, dat zijze het volk verkondigen zouden."},{"catchword":"hebben zij uw vaders niet getroffen?","tekst":"Dat is, zijn die straffen hun niet overkomen, waarmede Ik hen gedreigd had? Ja zij. Derhalve hadt gijlieden u aan hen behoren te spiegelen."},{"catchword":"Gelijk als de HEERE der heirscharen","tekst":"Dit hebben zij gesproken door overtuiging van hunne conscientie, als hen de Heere gestraft heeft zo met andere plagen, als inzonderheid met de Babylonische gevangenschap, waarmede Hij hen meermalen gedreigd had; verg. Psa 106:6 ."}],"7":[{"catchword":"de maand Schebat is","tekst":"Meest overeenkomende met onzen Januari, als hebbende de maan, die op het einde van januari komt en op het begin van Februari. Zodat deze profetie omtrent drie maanden op de voorgaande gevolgt is."},{"catchword":"Beréchja,","tekst":"Hebr. Berechjahu."}],"8":[{"catchword":"een Man rijdende","tekst":"Dit was de Zoon Gods in de gedaante van een man. Doch anderen menen dat het een geschapen engel geweest is. Christus heeft meermalen voor een korten tijd de gedaante van een man aangenomen, gelijk Eze 1:26 , en Eze 40:3 ; Dan 7:13 ."},{"catchword":"op een rood paard,","tekst":"Hiermede wordt aangewezen dat de Zoon Gods als een vuur zijne vijanden verteert; of, gelijk het anderen verstaan, de zonden van zijn volk; zie Isa 63:1-3 ."},{"catchword":"Hij stond tussen de mirten,","tekst":"Of, hij hield stil onder de mirten. Door de mirten worden afgebeeld de gelovigen, die voor God groenen en een lieflijken reuk geven, gelijk de mirtebomen; en door het stilstaan van dezen man wordt betekent de gerede en altijd-tegenwoordige hulp en bijstand des Heeren."},{"catchword":"die in de diepte waren;","tekst":"Dat is, in een diepe, vochtige plaats; waarmede afgebeeld wordt de toestand van het Joodse volk, hetwelk te dien tijde ten dele nog in de Babylonische gevangenschap was, ten dele in het land, in grote onrust."},{"catchword":"achter Hem waren","tekst":"Te weten, achter dien man, die op het rode paard zat."},{"catchword":"rode, bruine en witte paarden","tekst":"Rode, bruine, witte paarden, op welke engelen zaten, die den Heere Christus dienden, vs.10. En dit betekent allerlei dienaars des Heeren, die Hem dienen om zijne oordelen uit te voeren, hetzij om zijne kinderen te verlossen, of om hunne vijanden te straffen."}],"9":[{"catchword":"wat zijn deze?","tekst":"Of, wie zijn deze? Te weten, die achter u zijn. De zin is: Wat heeft het te beduiden dat dezen te paard achter u staan?"},{"catchword":"met mij sprak","tekst":"Anders: in mij, gelijk eigenlijk de Hebr. woorden luiden, betekenende een inwendige openbaring der dingen, die hij uitwendig gezien had. Alzo onder vs.13,14, en Zech 2:3 , en Zech 4:1, Zech 4:4-5, en Zech 5:5, Zech 5:10, en Zech 6:4. Zie ook Num 12:2 ; en 2Sa 23:2 , en Hos 1:2 , enz."},{"catchword":"wat deze zijn","tekst":"Of, wie dezen zijn; dat is, wat zij voorhebben."}],"10":[{"catchword":"de HEERE","tekst":"Dat is, God de Vader, want de Zoon Gods spreekt hier."},{"catchword":"uitgezonden heeft,","tekst":"Of, uitgezonden had; want zij hadden toen het land doorgetrokken en waren wederom gekomen."},{"catchword":"om het land te doorwandelen","tekst":"Om te zien en te merken hoe het overal toeging, en den Heere daarvan bericht te komen doen. Dit wordt als bij gelijkenis gesproken, ziende op de wijze en het gebruik der koningen, die hunne dienaren overal uitzenden. Verg. Job 1:7 , en Job 2:2 . Gode onze Heere zijn alle dingen bekend; Psa 113:6 ; Jer 23:24 ; Heb 4:13 . Nochtans belieft het Hem de engelen te gebruiken, om van zijne wijsheid en regering te getuigen."}],"11":[{"catchword":"antwoordden","tekst":"Antwoorden is hier, en elders meer te zeggen spreken, of beginnen te spreken, gelijk onder vs.12, en elders."},{"catchword":"den Engel des HEEREN,","tekst":"Dat is, Christus den Heere, die de overste is over al de engelen."},{"catchword":"het land doorwandeld,","tekst":"Te weten, het land van Chaldea. Anders: de aarde; dat is alle landen."},{"catchword":"het ganse land","tekst":"Dat is, alle inwoners van het land, gelijk af te leiden is uit vs.15. Of, het ganse land, uitgezonderd het arme Joodse land, hetwelk van zijne vijanden jammerlijk werd verwoest en bedorven; of uitgezonderd de Joden, die lange jaren in Babel zijn gevangen geweest en nog veel aanstoot lijden."},{"catchword":"zit en het is stil","tekst":"Dat is, de Babylonieërs en andere natiën hebben rust en vrede."}],"12":[{"catchword":"den Engel des HEEREN,","tekst":"Christus Jezus, de Voorbidder en Middelaar zijne kerk bij zijn hemelsen Vader, welke kerk in beroerte en vervolging was terwijl alle andere landen rondom haar in rust waren."},{"catchword":"Jeruzalem,","tekst":"Onder Jeruzalem en Juda moet men hier verstaan de kerk Gods, hoewel dit ook naar de letter te verstaan is."},{"catchword":"deze zeventig jaren?","tekst":"Hieruit nemen sommigen af dat Zacharia dit gesproken heeft kort na het einde van de Babylonische gevangenschap, uit welke de Joden door het voorbidden van Christus zijn verlost geworden; de tijd nu vervuld zijnde, waarvan geschreven staat 2Ch 36:14-15 , 2Ch 36:21 ; Jer 25:3-5 , Jer 25:12 , en Jer 29:10 ."}],"13":[{"catchword":"met mij sprak,","tekst":"Of, in mij. Zie boven vs.9, en versta dat de Heere, dat is God de Vader, tot den Zoon, en de Zoon tot den profeet sprak van de liefde Gods tot zijne kerk, en den toorn over hare vijanden, gelijk breder gezegd wordt in vs.14,15."},{"catchword":"goede woorden,","tekst":"Dat is, vriendelijke, aangename, zoete woorden."},{"catchword":"troostelijke woorden","tekst":"Te weten, troostelijk voor zijne kerk."}],"14":[{"catchword":"over Jeruzalem en over Sion","tekst":"Te weten, om hetzelve te verlossen, uit de handen hunner vijanden; zie Isa 9:6 ; Jer 31:20 ; Zep 1:16 , en onder 8:2. Ofschoon de Heere een tijdlang zijn hulp en bijstand aan zijne kerk onthouden had, nochtans beminde Hij haar als een vader zijne kinderen, of een man zijne vrouw, en Hij heeft haar ter bekwamer tijd gered uit allen nood en wederwaardigheid."}],"15":[{"catchword":"tegen die geruste heidenen;","tekst":"Dat is, tegen de Chaldeën of Babyloniërs en hunne aanhangers, die nu in rust en vrede zitten, middelerwijl mijn volk geplaagd wordt. Zie vs.11."},{"catchword":"toornig,","tekst":"Te weten, op het Joodse volk; Alsof God zeide: Zij zien niet op mijn wil of voornemen, die was mijn volk vaderlijk te kastijden om het tot boete en bekering te brengen, maar al hun doen en trachten strekt daarheen om mijn volk ganselijk te verderven en uit te roeien; zie Isa 10:7 , en Isa 47:6 ; zie ook Psa 83:4-5 ; Jer 30:11 ; Eze 25:3 , Eze 25:6 ."}],"16":[{"catchword":"het richtsnoer","tekst":"Gelijk de timmerlieden doen als zij een nieuw gebouw zullen maken. De zin is: Jeruzalem zal weder herbouwd worden, de vijanden mogen daartegen doen al wat zij kunnen. Dit is volbracht door het beleid en de aandrijving van Nehemia. Verg. Neh 2:3-4 , enz., en Hag 1:13 . Onder de opbouwing van de stad Jeruzalem worden ook den godzaligen beloofd alle geestelijke genaden en weldaden."}],"17":[{"catchword":"Roep nog,","tekst":"Anders: predik verder."},{"catchword":"Mijn steden zullen nog uitgespreid worden","tekst":"Dat is, de steden van Juda zullen te eng zijn, zij zullen moeten vergroot worden."},{"catchword":"vanwege het goede;","tekst":"Dat is, vanwege den groten en overvloedigen zegen, dien de Heer hun geven zal. Geestelijkerwijze dit genomen zijnde, betekent het dat God zijne kerk zo zou zegenen en doen aanwassen, dat het Joodse land te eng zou wezen om haar te bevatten, maar dat zij met hare gaven door de ganse wereld zou verspreid worden. Verg. Isa 49:18 , enz., en het gehele boek van de Handelingen der Apostelen."},{"catchword":"verkiezen","tekst":"Te weten, tot zijn volk. De zin is: Hij zal hen zo overvloedig met allerlei goed zegenen, dat het genoegzaam blijken zal dat God hen tot zijn volk verkoren heeft; inzonderheid zal Hij hen zegenen met herstelling van den waren godsdienst."}],"18":[{"catchword":"vier hoornen","tekst":"Betekenende de volken en natiën, die vijandelijk het volk Gods bestreden en aanstieten van alle hoeken en gewesten der aarde. Zie vs.19."}],"19":[{"catchword":"Wat zijn deze?","tekst":"Waarvan zijn deze hoornen een teken? Wat beduiden zij?"},{"catchword":"Dat zijn de hoornen,","tekst":"Dat is, die betekenen de Babyloniërs en andere machtige natiën, die het met hen houden."}],"20":[{"catchword":"smeden","tekst":"Of, timmerlieden. Dit betekent ook de volken en natiën, die als medearbeiders Gods zijn, die God de Heere uit alle hoeken der wereld vergaderen zou, om die sterke hoornen, dat is om de vijanden van Gods kerk te breken en te vernielen, dewijl zij den opbouw van den tempel en de kerk Gods verhinderden."}],"21":[{"catchword":"die te verschrikken,","tekst":"Te weten, hoornen, dat is koninkrijken."},{"catchword":"de hoornen der heidenen","tekst":"Dat is, het geweld, macht, koninkrijk te verstoren."},{"catchword":"welke den hoorn verheven hebben","tekst":"Dat is, die het land Juda met krijgsmacht overvallen en overheerd habben. Verg. Eze 34:21 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"In the eighth moneth, [This was two moneths after that the prophet Haggai began to preach, Hag. 1.2.] in the second year of Darius, [the King of Parsia. See Ezra 4. on verse 24] the word of the Lord came to Zacharia, the son of Berechia [thus he is called in the Hebrew, but in the greek barachias. Some conceive, that is the same, of whom mention, Math. 22.35. Oth. Hold them to be distict persons. Compare 2 Chron. 24.2 with the annotate. See further of the persons named in this verse Ezra 5.1.] the son of Iddo the prophet [or of the prophet] saying."}],"2":[{"catchword":null,"tekst":"The LORD hath been wroth against your fathers. [Hebr. Anger with anger, c]"}],"3":[{"catchword":null,"tekst":"Therefore say unto them, thus saith the Lord of hosts: turn again to me saith the LORD of hosts, so shall I turn again to you, saith the LORD of hosts. [God is said to turn himself to us, when he causeth us to finde and taste the fruit, or return of our prayer: we are said to turn to the LORD, when in true saith and unseigned repentance for our sins, we sue for mercie and favour to him. And ye we have not this from our selves: God must give it, as is express in Jeremie, chap. 31.18. LORD convert me, so shall I be converted.]"}],"4":[{"catchword":null,"tekst":"Be not as fathers [to wit, in impenitencie. See 2 Chro. 36.15, 16.] whom the former prophets called upon, [those namely, which prophesied before before the Babylonian Captivity] saying; thus saith the LORD of hosts, convert your selves from your evil dealings: but they hearkned not, and they lifted not unto me, [i.e. not to that which I cause to be delivered to them by the ministrie of my prophets] saith the LORD."}],"5":[{"catchword":null,"tekst":"Your father where are they? [As if he said; though they be dead and gone, it behooves you notwithstanding to take warning by them. See 1 Cor. 10.5, 6.] and the prophets, shall they live for ever? [I.e always. Oth. Doth they live forever? He meanes to shew, though the former prophets be dead and out of the world, yet their prophesies remain alive still, see the next verse and compare. 2 Pet. 1.15. Oth. Read and interpret these words, as the objection and cavils of wicked men, thus but the prophets (those that took us up so) did they live always? What is become of them since; are they not dead and gone as well as others?]"}],"6":[{"catchword":null,"tekst":"Neverthelesse my words and my institutions, which I commanded my servants, [viz. to declare the same to such people and nations] have they not hit your fathers? [did not the Judgement denounced and threatened come upon your fathers? I think they found and felt it; and therefore ye ought to take heed how to tread in their footsteps] so that returning they said, even as the LORD of hosts thought to do unto as according to our dealings, so he hath done with us. [This they spake as convinced in their consciences, when the Lord punished them, as with other plagues and calamities, so especially with the Babylonian Captivity, wherewith he had often threatened them. Compare Psa 106:6.]"}],"7":[{"catchword":null,"tekst":"On the four and twentieth day of the eleventh moneth, (this is the moneth Schebat) [Answering mostly with our January, as having the moon that falls partly in January, and partly in February; insomuch, that this prophesie followed about three moneth after the former] in the second year of Darius, the word of the LORD came unto Zacharia, the son of Berch-ia, [Hebr. Berech-jebu] the son of Iddo the Prophet saying."}],"8":[{"catchword":null,"tekst":"I saw by night, and behold, a man riding, [This was the son of God in the shape of a man: yet others think it was a created angel. Christ did other whiles take a humane shape upon him for a short time; as Dan. 7.13. Ezekiel. 1.26. and chap. 40.3.] on a red horse, [hereby is shewed, that the son of God consumes his Enemies like fire, or as others understand it, that he takes away the sins of his people by his blood. See Isa 63:1, 2, 3.] and he stood between the myrtle trees: [oth. Be subsisted, (made a halt) among the myrtle-trees: by the myrtles are shadowed forth the faithfull, being still flourishing and fragrant before God, like unto the myrtle-trees: and by the standing still of this man, is signified the ready and ever present help and assistance of the LORD] which were in the depth: [i.e. in the deep moist place, whereby is typified the condition of the Jewish people: which as the time were purely yet in the Babylonian captivity, and partly in their own land, in great trouble still] and after him, [i.e. after the man that sate on the red horse] were red and brown (and) white horses. [whereon angels sate attending Christ, verse 0 and those signifie all kinde of ministers of the LORD, that serve him for to execute his judgements, whether it be for delivering of his children, or for punishment of the enemies]"}],"9":[{"catchword":null,"tekst":"And I said, my LORD, what are these? [Or, who are these, i.e. what are they about?] and then the angel that spake with me, [oth. In me; as the Hebrew particles do properly signifie, implying an inward revelation of things which he had seen outwardly: so below verse 13.14 and 2.3 and chap. 4 verse 1, 4, 5 and chap. 5.5,10 and chap. 6.4. see also Numb. 12.2 and 2 Sam.. 23 verse 2. Hos. 1.1. c.] said unto me, I will shew thee what these are."}],"10":[{"catchword":null,"tekst":"Then answered the man that stood between the mytles, and said; these are they whom the LORD [i.e. God the Father; for here the son of God speaketh] sent forth [Or, had sent out; for they had been abroad already then, and were now returning] to pass through the whole land: [for to see and observe how things were conditioned everywhere, and to bring in the report thereof. This is said by way of similitude, having regard to the custome of Kings and great ones sending forth their ministers into all parts, for information. Compare Job 1:7. and chap. 2.2. all things are known to God, Psa 113:6. Jer. 23.24. Heb 4.13. yet he is pleased to make use of his ministering spirits, the angels, for to manifest and make known his wisdom and government.]"}],"11":[{"catchword":null,"tekst":"And they answered [to answer is here as much as to say, or begin to speak, as also below verse 12 and in many other places] unto the angel of the LORD, [i.e. unto Christ there present, the supream head of all the angels] that stood between the myrtles and said; we have passed through the land, [to wit the land of Chaldea. Oth. The earth, the world, or all the countries of the earth] and behold, the whole land [i.e. all the inhabitants of the land, as may be gathered by verse 15 or the whole earth, except only the poor land of Juda, which lies pitifully wasted and spoiled, and is much annoyed still by its enemies: or except the Jews, which had been captive in Babel for many years and were in a suffering condition yet, many wayes] sitteth and it is still. [or calm, meaning, that the Babylonians and other nations were at rest and quiet."}],"12":[{"catchword":null,"tekst":"Then answered the angel of the LORD, and said, Lord of hosts, how long wilt thou have mercy upon Jerusalem and upon the cities of Juda? [The angel here speaking, is Jesus Christ, the mediatour and advocate of his church with his heavenly father; the said church being in trouble and under persecution, whiles all other countries round about enjoyed peace and rest. This church is here meant hereby the names of Jerusalem and Juda, although it be applicable also in the literall sense] with whom thou hast been wroth, these seventy yeares.] hence some do gather, that Zacharias spake this soon after the Babylonian captivity, out of which the Jews were delivered through the intercession of Christ; the time being now fulfilled, spoken of 2 Chron. 36.14,15,21. Jer 25:3, 5, 12. and chapter 29.10.]"}],"13":[{"catchword":null,"tekst":"And the LORD answered the angel, that spake with me [or, in me. See above verse 9 and understand that the LORD, i.e. God the Father speaketh to the son, and the son to the prophet, of the love of God to his church and his wrath against his enemies thereof, as is further explained, verse 14.15] good words [i.e friendly, kindly and acceptable words] comfortable words. [to wit comfortable for his church.]"}],"14":[{"catchword":null,"tekst":"And the angel that spake with me, said to me; proclaim, saying, thus saith the Lord, saying, thus saith the Lord of hosts: I am jealous for Jerusalem and for Zion, with a great jealousie [viz. to deliver them out of the hands of their enemies: see Isa 9:7. Zeph. 1.4 and Jer. 31.20. and below chap. 8.2. though the LORD had for a time withheld his help and assistance from his church, nevertheless he loved the same still, as a father doth his children, or Husband his wife; and in due time he did deliver her out of her troubles and didtresses.]"}],"15":[{"catchword":null,"tekst":"Ad I am wroth with a very great wrath against these heathens at ease; [i.e. Against the chaldeans, or Babylonian and there adherents, which now sit still and are at rest and ease, whiles my people is afflicted. See above verse 11.] for I was a little wroth, [viz. With the Jews] but they did help for evil, [as if God should say, they looked not to my end and purpose, which was but fatherly to chastise them, for to bring them to repentance and amendment, when all the enemies aimes and endevours were for their utter ruine and extirpation. See Isa 10:7. and 47.8. see also Eze 25:3, 6. jeremiah 30.11. Psa 83:4 ,5.]"}],"16":[{"catchword":null,"tekst":"Therefore thus saith the Lord, I am returned to Jerusalem with compassions, mine house shall be build therein, saith the LORD of hostes, and the square-line shall be stretched out over Jerusalem. [According as we see carpentes do, being about to set up a new building: the meaning is, Jerusalem should be built again, let the enemies plot and practice to the contrary whatever they are able. This was accomplished by managing and encouragement of Nehemiah. Compare Neh. 2.3, 4, c and Haggai 1.13 under the building up of the city of Jerusalem, they are promised also to the Godly, all manne of spiritual grace and benefits.]"}],"17":[{"catchword":null,"tekst":"Cry yet, [or preach further] saying thus saith the LORD of hosts, my cities shall be spread abroad yet, [i.e. the cities of Juda shall be too stait or narrow, they must needs be enlarged and made greater] because of the good; [that is, because of the great and abundant blessings which the LORD shall give them. Spiritually it signifieth that God shall so blesse and increase his church that the land of Juda should be too little and narrow for her to contain all: all the world being to be overspread with her members, and the gifts bestowed upon her. Compare Isa 49:18. c. and the whole book of Acts of the Apostles] for the LORD shall comfort Zion yet, and he shall yet chuse Jerusalem. [viz. for his people: the sense is, he shall so abundantly blesse them with all manner of gifts and graces, that it shall sufficiently appear, God chose them for his people, especially shall he blesse them with setting up again of his pure worship among them.]"}],"18":[{"catchword":null,"tekst":"And I lifted up mine eyes, and saw; and behold there were four hornes. [Typifying the several people and Nations, which in an hostile manner made war upon, and molested the people of God from all corners and quartes of the world: see verse 19.]"}],"19":[{"catchword":null,"tekst":"And I said to the angel that spake with me, what are these? [What mean these hornes, what do they betoken or signifie?] And he said to me, these are those hornes, which destroyed Juda, Israel and Jerusalem; [i.e. they signifieth the Babylonians, and other mighty Nations holding with them; their consederates and associates.]"}],"20":[{"catchword":null,"tekst":"And the LORD sheewed me for smiths. [Or Carpenters. By these are likewise signified certain people and nations, Gods fellow labourers as it were, whom God should gather together her from all the corners of the world for to break and destroy, those strong horns, that is, those enemies of God, which hinder the building up of the temple and churh of God.]"}],"21":[{"catchword":null,"tekst":"Then said I, what come they to make? And he spake, saying; those are the hornes which destroyed Juda, so that none lifted up his head, but these are come, to terrifie those [viz. hornes i.e. kingdoms] for to cast down the horns of the heathens, [i.e. to destroy their power, might and kingdoms] which did lift up against the land of Juda, for to destroy the same. [I.e. which invaded the land of Juda with whole armies in a hostile manner and made it desolate all over. Compare Eze 34:21.]"}]}}};

(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers) => {
    const afk = REFBOEK2AFK[boek];
    return afk ? `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${heel}</a>` : heel;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }

}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
