t hele land.","7":"En zie, een plaat van lood werd opgeheven, en er was een vrouw, zittend midden in de efa.","8":"En Hij zei: Dit is de goddeloosheid; en Hij wierp haar midden in de efa; en Hij wierp het loden gewicht op de mond daarvan.","9":"En ik hief mijn ogen op, en ik keek; en zie, twee vrouwen kwamen tevoorschijn, en er was wind in hun vleugels, en zij hadden vleugels, als de vleugels van een ooievaar; en zij droegen de efa tussen de aarde en de hemel.","10":"Toen zei ik tegen de Engel Die met mij sprak: Waarheen brengen zij deze efa?","11":"En Hij zei tegen mij: Om er een huis voor te bouwen in het land Sinear; dat het daar gevestigd wordt en neergezet wordt op zijn eigen grondvesting."},"SV":{"1":"En ik hief mijn ogen weder op, en ik zag; en ziet, een vliegende rol.","2":"En Hij zeide tot mij: Wat ziet gij? En ik zeide: Ik zie een vliegende rol, welker lengte is van twintig ellen, en haar breedte van tien ellen.","3":"Toen zeide Hij tot mij: Dit is de vloek, die uitgaan zal over het ganse land; want een iegelijk, die steelt, zal van hier, volgens denzelven *vloek*, uitgeroeid worden; desgelijks een iegelijk, die *valselijk* zweert, zal van hier, volgens denzelven *vloek*, uitgeroeid worden.","4":"Ik breng dezen *vloek* voort, spreekt de HEERE der heirscharen, dat hij kome in het huis van den dief, en in het huis desgenen, die bij Mijn Naam valselijk zweert; en hij zal in het midden zijns huizes overnachten, en hij zal het verteren, met zijn houten en zijn stenen.","5":"En de Engel, Die met mij sprak, ging uit, en zeide tot mij: Hef nu uw ogen op, en zie, wat dit zij, dat er voortkomt.","6":"En ik zeide: Wat is dat? En Hij zeide: Dit is een efa, die voortkomt. Verder zeide Hij: Dit is het oog over henlieden in het ganse land.","7":"En ziet, een plaat van lood werd opgeheven, en er was een vrouw, zittende in het midden der efa.","8":"En Hij zeide: Deze is de goddeloosheid; en Hij wierp ze in het midden van de efa; en Hij wierp het loden gewicht op den mond derzelve.","9":"En ik hief mijn ogen op, en ik zag; en ziet, twee vrouwen kwamen voort, en wind was in haar vleugelen, en zij hadden vleugelen, als de vleugelen eens ooievaars; en zij voerden de efa tussen de aarde en tussen den hemel.","10":"Toen zeide ik tot den Engel, Die met mij sprak: Waarhenen brengen zij deze efa?","11":"En Hij zeide tot mij: Om haar een huis te bouwen in het land Sinear; dat zij daar gevestigd en gesteld worde op haar grondvesting."},"KJV":{"1":"Then I turned, and lifted up mine eyes, and looked, and behold a flying roll.","2":"And he said unto me, What seest thou? And I answered, I see a flying roll; the length thereof *is* twenty cubits, and the breadth thereof ten cubits.","3":"Then said he unto me, This *is* the curse that goeth forth over the face of the whole earth: for every one that stealeth shall be cut off *as* on this side according to it; and every one that sweareth shall be cut off *as* on that side according","4":"I will bring it forth, saith the LORD of hosts, and it shall enter into the house of the thief, and into the house of him that sweareth falsely by my name: and it shall remain in the midst of his house, and shall consume it with the timber thereof and the stones","5":"Then the angel that talked with me went forth, and said unto me, Lift up now thine eyes, and see what *is* this that goeth forth.","6":"And I said, What *is* it? And he said, This *is* an ephah that goeth forth. He said moreover, This *is* their resemblance through all the earth.","7":"And, behold, there was lifted up a talent of lead: and this *is* a woman that sitteth in the midst of the ephah.","8":"And he said, This *is* wickedness. And he cast it into the midst of the ephah; and he cast the weight of lead upon the mouth","9":"Then lifted I up mine eyes, and looked, and, behold, there came out two women, and the wind *was* in their wings; for they had wings like the wings of a stork: and they lifted up the ephah between the earth and the heaven.","10":"Then said I to the angel that talked with me, Whither do these bear the ephah?","11":"And he said unto me, To build it an house in the land of Shinar: and it shall be established, and set there upon her own base."}},"tsk":{"1":[{"kopje":"rol","refs":["Zach 5:2","Jes 8:1","Jer 36:1-6","Jer 36:20-24","Jer 36:27-32","Ezech 2:9","Ezech 2:10","Openb 5:1-14","Openb 10:2","Openb 10:8-11"]}],"2":[{"kopje":"Wat","refs":["Zach 4:2","Jer 1:11-14","Amos 7:8"]},{"kopje":"vliegende","refs":["Zef 1:14","2 Petr 2:3"]},{"kopje":"de lengte","refs":["Gen 6:11-13","Openb 18:5"]}],"3":[{"kopje":"de vloek","refs":["Deut 11:28","Deut 11:29","Deut 27:15-26","Deut 28:15-68","Deut 29:19-28","Ps 109:17-20","Spr 3:33","Jes 24:6","Jes 43:28","Jer 26:6","Dan 9:11","Mal 3:9","Mal 4:6","Matt 25:41","Gal 3:10-13","Hebr 6:6-8","Openb 21:8","Openb 22:15"]},{"kopje":"het land","refs":["Luk 21:35"]},{"kopje":"ieder","refs":["Ex 20:15","Spr 29:24","Spr 30:9","Jer 7:9","Hos 4:2","Mal 3:8-10","1 Kor 6:7-9","Ef 4:28","Jak 5:4"]},{"kopje":"zweert","refs":["Zach 5:4","Zach 8:17","Lev 19:12","Jes 48:1","Jer 5:2","Jer 23:10","Ezech 17:13-16","Mal 3:5","Matt 5:33-37","Matt 23:16-22","1 Tim 1:9","Jak 5:12"]}],"4":[{"kopje":"overnachten","refs":["Lev 14:34-45","Deut 7:26","Job 18:15","Job 20:26","Spr 3:33","Hab 2:9-11","Jak 5:2","Jak 5:3"]}],"5":[{"kopje":"Engel","refs":["Zach 1:9","Zach 1:14","Zach 1:19","Zach 2:3","Zach 4:5"]},{"kopje":"Hef","refs":["Zach 5:1"]}],"6":[{"kopje":"Dit is een efa","refs":["Ezech 44:10","Ezech 44:11","Amos 8:5"]}],"7":[{"kopje":"plaat","refs":["Jes 13:1","Jes 15:1","Jes 22:11"]},{"kopje":"er was","refs":["Jer 3:1","Jer 3:2","Ezech 16:1-63","Ezech 23:1-49","Hos 1:1","Hos 3:5","Openb 17:1-18"]}],"8":[{"kopje":"Dit","refs":["Gen 15:16","Matt 23:32","1 Tess 2:16"]},{"kopje":"het loden gewicht","refs":["Zach 5:7","Ps 38:5","Spr 5:22","Klaagl 1:14","Amos 9:1-4"]}],"9":[{"kopje":"tussen","refs":["Deut 28:49","Dan 9:26","Dan 9:27","Hos 8:1","Matt 24:28"]}],"11":[{"kopje":"Om","refs":["Deu wl-kjv\" data-code=\"H7200\">looked,</span> and behold a <span class=\"wl wl-kjv\" data-code=\"H5774\">flying</span> roll.","2":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me, What <span class=\"wl wl-kjv\" data-code=\"H7200\">seest</span> thou? And I <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> I <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> a <span class=\"wl wl-kjv\" data-code=\"H5774\">flying</span> <span class=\"wl wl-kjv\" data-code=\"H4039\">roll;</span> the <span class=\"wl wl-kjv\" data-code=\"H753\">length</span> thereof is <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H520\">cubits,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7341\">breadth</span> thereof <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> cubits.","3":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> he unto me, This is the <span class=\"wl wl-kjv\" data-code=\"H423\">curse</span> that goeth <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> over the <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> of the whole <span class=\"wl wl-kjv\" data-code=\"H776\">earth:</span> for every one that <span class=\"wl wl-kjv\" data-code=\"H1589\">stealeth</span> shall be cut <span class=\"wl wl-kjv\" data-code=\"H5352\">off</span> as on this side <span class=\"wl wl-kjv\" data-code=\"H3644\">according</span> to it; and every one that <span class=\"wl wl-kjv\" data-code=\"H7650\">sweareth</span> shall be cut <span class=\"wl wl-kjv\" data-code=\"H5352\">off</span> as on that side according","4":"I will bring it <span class=\"wl wl-kjv\" data-code=\"H3318\">forth,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> and it shall <span class=\"wl wl-kjv\" data-code=\"H935\">enter</span> into the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H1590\">thief,</span> and into the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of him that <span class=\"wl wl-kjv\" data-code=\"H7650\">sweareth</span> <span class=\"wl wl-kjv\" data-code=\"H8267\">falsely</span> by my <span class=\"wl wl-kjv\" data-code=\"H8034\">name:</span> and it shall <span class=\"wl wl-kjv\" data-code=\"H3885\">remain</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of his <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H3615\">consume</span> it with the <span class=\"wl wl-kjv\" data-code=\"H6086\">timber</span> thereof and the stones","5":"Then the <span class=\"wl wl-kjv\" data-code=\"H4397\">angel</span> that <span class=\"wl wl-kjv\" data-code=\"H1696\">talked</span> with me went <span class=\"wl wl-kjv\" data-code=\"H3318\">forth,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me, Lift <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> now thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> what is this that goeth forth.","6":"And I <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> What is it? And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> This is an <span class=\"wl wl-kjv\" data-code=\"H374\">ephah</span> that goeth <span class=\"wl wl-kjv\" data-code=\"H3318\">forth.</span> He <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> moreover, This is their <span class=\"wl wl-kjv\" data-code=\"H5869\">resemblance</span> through all the earth.","7":"And, behold, there was lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> a <span class=\"wl wl-kjv\" data-code=\"H3603\">talent</span> of <span class=\"wl wl-kjv\" data-code=\"H5777\">lead:</span> and this is <span class=\"wl wl-kjv\" data-code=\"H259\">a</span> <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> that <span class=\"wl wl-kjv\" data-code=\"H3427\">sitteth</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the ephah.","8":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> This is <span class=\"wl wl-kjv\" data-code=\"H7564\">wickedness.</span> And he <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> it into the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H374\">ephah;</span> and he <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> the <span class=\"wl wl-kjv\" data-code=\"H68\">weight</span> of <span class=\"wl wl-kjv\" data-code=\"H5777\">lead</span> upon the mouth","9":"Then lifted I <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> mine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">looked,</span> and, behold, there came <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H802\">women,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7307\">wind</span> was in their <span class=\"wl wl-kjv\" data-code=\"H3671\">wings;</span> for they <span class=\"wl wl-kjv\" data-code=\"H2007\">had</span> <span class=\"wl wl-kjv\" data-code=\"H3671\">wings</span> like the <span class=\"wl wl-kjv\" data-code=\"H3671\">wings</span> of a <span class=\"wl wl-kjv\" data-code=\"H2624\">stork:</span> and they lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H374\">ephah</span> between the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> and the heaven.","10":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> I to the <span class=\"wl wl-kjv\" data-code=\"H4397\">angel</span> that <span class=\"wl wl-kjv\" data-code=\"H1696\">talked</span> with me, Whither do these <span class=\"wl wl-kjv\" data-code=\"H3212\">bear</span> the ephah?","11":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me, To <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> it an <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H8152\">Shinar:</span> and it shall be <span class=\"wl wl-kjv\" data-code=\"H3559\">established,</span> and <span class=\"wl wl-kjv\" data-code=\"H3240\">set</span> there upon her own base."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"ik hief mijn ogen weder op,","tekst":"Hebr. en ik keerde weder, en ik hief mijne ogen op; hetwelk naar onze manier van spreken is gelijk hier in den tekst staat."},{"catchword":"een vliegende","tekst":"Die snellijk door het gehele land vloog, aanwijzende dat de vloek snellijk komen zou."},{"catchword":"rol","tekst":"Dat is, een brief, dien men in elkander rolt, in welken geschreven stonden de straffen Gods over de dieven en misbruikers van zijn naam in het vals zweren. Van het woord rol zie Isa 8:1 ; Eze 2:9 , en Luk 4:17 ."}],"2":[{"catchword":"Hij zeide tot mij","tekst":"Te weten, de engel des Heeren, die met mij sprak. Zie Zech 1:8-9 ."},{"catchword":"welker lengte is van twintig ellen,","tekst":"De grote lengte en breedte dezer rol betekent het groot getal der zonden van de mensen bedreven, en de grote en langdurige straffen Gods over dezelve. Verg. Lev. 26, en Deut. 27, 28 ."}],"3":[{"catchword":"Dit is de vloek,","tekst":"Dat is, in deze rol staat de vloek geschreven, die het ganse land treffen zal."},{"catchword":"over het ganse land;","tekst":"Te weten, over het ganse Joodse land. Of, over de ganse aarde. Verstaande dit van de algemene oordelen Gods."},{"catchword":"van hier,","tekst":"Anders: een iegelijk, die steelt, zal uitgeroei worden, gelijk aan de ene zijde van de [rol geschreven is]; en een iegenlijk, die valselijk zweert, zal uitgeroeid worden. gelijk aan de andere zijde van de [rol geschreven is]. Onder deze twee soorten van grove misdaden moet men de andere mede verstaan."},{"catchword":"uitgeroeid worden;","tekst":"Anders: alle dieven zijn hieruit [te weten uit dit land] uitgeroeid, naar luid van deze [rol]. Of, houdt zich voor onschuldig, namelijk zijn boze daden verbloemende, zijnde alzo onbeschaamd in het verdedigen derzelve, alsof het den waren God nooit gekend had, zondigende zo tegen de tweede als tegen de eerste tafel der wet, hetwelk te kennen wordt gegeven met de twee zonden, die hier tot een voorbeeld genoemd worden."},{"catchword":"valselijk zweert,","tekst":"Het woord valschelij is hier bijgevoegd, zie vs.4, dewijl het de zin hier vereist."}],"4":[{"catchword":"Ik breng dezen vloek voort,","tekst":"Dat is, Ik zal de zonde van mijn volk naar behoren straffen."},{"catchword":"in het huis van den dief,","tekst":"Of, over, of tot."},{"catchword":"valselijk zweert;","tekst":"Hebr. tot valsheid, of in valsheid."},{"catchword":"zijns huizes","tekst":"Zo van den dief als van dengene, die valselijk zweert."},{"catchword":"overnachten,","tekst":"Of, blijven."},{"catchword":"hij zal het verteren,","tekst":"Dat is, hij zal het zo ganselijk te schande maken, dat er niets overig blijven zal. Verg. Deu 28:20 ; Mat 24:2 ; Luk 19:44 ."}],"5":[{"catchword":"die met mij sprak,","tekst":"Of, die in mij sprak."},{"catchword":"uit,","tekst":"Te weten, uit den hoop der ruiters, die achter hem stonden; Zech 1:8 ."},{"catchword":"voortkomt","tekst":"Dat is, dat u in dit gezicht vertoont wordt. Hier wordt gesproken van de voorzienige regering Gods, gelijk in vs.6."}],"6":[{"catchword":"een efa,","tekst":"Een maat van droge waren. Zie de aantekening bij Exo 16:36 . Hier betekent het, naar Sommiger gevoelen, de maat der straf Gods, naar welke Hij de zonden straft naar zijne gerechtigheid."},{"catchword":"Dit is het oog","tekst":"Hebr. dit is hun oog in het ganse land; dat is, het is het oog, dat acht op hen geeft, waarheen zij zich keren of wenden. Door het oog moet men hier verstaan de voorzienigheid en zorg van God, gelijk in Zech 3:9 , en Zech 4:10, en in Zech 9:1. Anders: dit is het oog; dat is, de gestalte van het ganse land."}],"7":[{"catchword":"een plaat van lood","tekst":"Hiermede werd afgebeeld het zware en onverandelijke oordeel Gods tegen de Joden."},{"catchword":"werd opgeheven,","tekst":"Of, werd verheven, of werd er gebracht."}],"8":[{"catchword":"Deze is de goddeloosheid;","tekst":"Dat is, deze vrouw is ene afbeelding der goddelozen onder de Joden, of der goddelozen in het algemeen, die verzameld gehouden en verzegeld worden tot het oordeel Gods, waarvan straks gesproken wordt."},{"catchword":"en Hij wierp ze in het midden van de efa;","tekst":"Of, toen hij haar wierp, te weten die vrouw."},{"catchword":"het loden gewicht","tekst":"Of, klomp lood. Hebr. den steen loods. Versta zulk een klomp lood, die plat was, alzo gemaakt dat hij als een deksel op de efa paste."},{"catchword":"derzelve","tekst":"Te weten, der efa, alzo dat zij daarin vast en dicht besloten, en als gehouden werd, om daarmede aan te wijzen dat de goddelozen de straffen Gods niet ontvlieden zouden."}],"9":[{"catchword":"twee vrouwen kwamen voort,","tekst":"Door de ene vrouw werd, naar sommiger gevoelen, verstaan de barmhartigheid Gods over zijn volk; door de andere, de strenge gerechtigheid Gods over de vijanden van hetzelve. Deze beide vrouwen nemen de efa, dat is de straf der zonden van het volk Gods, en dragen ze in het land der vijanden, opdat die straffen hun op den hals blijven liggen."},{"catchword":"wind was in haar vleugelen,","tekst":"Dit betekent dat als de tijd gekomen is, in welken God zijne oordelen wil uitvoeren, dat zulks dan snellijk en zonder uitstel geschieden moet."}],"11":[{"catchword":"Om haar een huis te bouwen","tekst":"Betekenende dat de straffen steeds op de vijanden blijven zouden."},{"catchword":"in het land Sinear;","tekst":"Dat is, in het land van Babylonië. Zie Gen 10:10 , en Gen 11:2 . Hierdoor werd afgebeeld dat de boze Joden, en voorts alle goddelozen, onder de afgodische snode Babyloniërs zouden gerekend en gestrafd worden."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And I lifted up mine eyes again, [Heb. And I returned, and lifted up mine eyes; which, according to our mannaer of speaking, is the same we read in the text] and I saw, and behold, a flying roll; [which flew swiftly all the kand over, that the curse would come suddenly. By the roll is meant a certain writing rolled up, wherein stood written the judgements of God upon thieves and abusers of his name in swearing falsely: of the word roll, see Isa. 8.1 and Ezek. 2.10. and Luk 4:17.]"}],"2":[{"catchword":null,"tekst":"And he [viz. the angel of the LORD, that spake with me before, see chapter 1.8, 9.] said to me; what seeth thou? And I said, I see a flying roll whose length is of twentie ells, and its breadth of ten ells. [the great length and breadth of this roll, signifieth the great number of sins the people commited, and the great and lasting punishments, which God would inflict upon them. Compare Deut. 27 and 28 and Lev. 26.]"}],"3":[{"catchword":null,"tekst":"Then he said unto me, this is the curse, [i.e. in this roll the curse is described, which is ready to come upon the whole land] which shall go forth all the land over; [understand the land of Judea: or, over all the earth; understanding it of universal judgements on all the land] for, everyone that stealeth, shall be cut off hence, according to the same (curse) also every one that sweareth (falsely) [this word is inserted here from verse 4 the sense requiring it] shall be cut off from hence, according to the same curse [oth. Everyone that stealeth shall be cut off, as (it is written) on the one side of (the roll) and everyone that sweareth falsely shall be cut off, (as it is written) on the other side (of the wall) under these two sorts of grosse sins, the rest are comprehended & understood. Oth. All thieves are cut off hence, viz. out of this country according to this (roll) or everyone that stealeth holds himself guiltless, namely, by colouring his evil practices, being so impudent in justifying the same, as if God had never known anything of it: sinning thereby both against the first and second table of the law: which is exemplified in the two sins here named.]"}],"4":[{"catchword":null,"tekst":"I bring forh this (curse) saith the LORD of hostes, [implying that God would punish the sins of his people, according to their desert] that it shall come into [or, upon, or unto] the house, and into the house of him that sweareth falsely [Heb. For (or in) falsehood] by my name; and it shall lodge [or, remain] in the midst of his house [both the thieves and him that sweareth falsely] and it shall consume the same, with the wood thereof and with the stones thereof: [i.e. so utterly destroy and ruine the same, that there shall nothing remain entire. Compare Deut. 28.30. at. 24.2. Luk 19:44.]"}],"5":[{"catchword":null,"tekst":"And the angel that spake with, [Or in] me, went forth [viz. from among the troop of the horsemen, that were behind him, as chap. 1. verse 8.] and said to me; lift up thine eyes now, and behold what this is, that cometh forth; [i.e. is represented to thee in a vision. Here the provident governing of God is described: as verse 6.]"}],"6":[{"catchword":null,"tekst":"And I said; what is that? And he said, this is an Epha [a certain measure of dry wares, see the annotate. On Exod. 16.36. here it signifies, according to some, the measure, or proportion of Gods judgements, whereby he punisheth the sines he said. This is the eye upon them in all the land. [Heb. This is their eye in all the land. i.e this is the eye that observeth them, whithersoever they move or turn themselves. By the eye must be understood here, the providence and care of God: as above chap. 3 verse 9. & chap. 4.10 and below chap. 9.1. otherwise this is the eye i.e the face, shape, or condition of all the Land.]"}],"7":[{"catchword":null,"tekst":"And behold, a plate of lead was lift up [Or, was elevated, or brought on, hereby is signified the heavy and insupportable judgement of God against the Jews] and there was a woman, sitting in the midst of the Epha."}],"8":[{"catchword":null,"tekst":"And he said, this is the wickedness, [i.e. this woman represents the wicked people among the Jews, or the wicked members in the church, who are cooped, kept and sealed thus for the judgement of God, spoken of immediately after] and [or, when] he cast her [viz. the woman] into the midst of the Epha: and he cast the leaden weight [or lamp of lead. Heb. The stone of lead; understand such a lump of lead, as was flat and broad, so made that it just sitted for a cover upon the Epha] upon the mouth thereof, [to wit, of the Epha, so that the wickedness was, as it were, close shut up and kept therein, intimating, that the wicked should not be able to escape the judgement of God.]"}],"9":[{"catchword":null,"tekst":"And I lift up mine eyes and I saw, and behold, two women came forth, [by the one woman, some conceive, should be understood the mercy of God toward his people; and by the other, his severe Justice against their enemies. Both these woman take up the Epha, that is the punishment for sin, from the people of God, and carry the same into the enemies country, that those punishments may remain upon their necks] and winde was in their wings, and they had wings, as the wings of a stork: and they carried the Epha between the earth and between the heaven. [this denotes, that when the time is come once wherein God execute his judgements then the same shall be done forwith, speedily, without delay.]"}],"10":[{"catchword":null,"tekst":"Then said I to the angel that spake with me; whither do they carry the Epha?"}],"11":[{"catchword":null,"tekst":"And he said to me; for to build her an house in the land of sinear: [that is, in the land of Babylon. See Gen. 10.10 and 11.2. implying, that the punishment were constantly to abide upon the enemies] that it may be established and settled there, upon her foundation. [hereby is intimated, that under the idolatarious and vile Babylonians, both the wicked Jews and all impious people besides, are to be comprehended and punished accordingly altogether.]"}]}}};

function refUrl(ref) {

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;

function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];

    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;

document.addEventListener('click', e => {

    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
