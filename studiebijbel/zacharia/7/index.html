elvarend was, en haar steden rondom haar; en toen het zuiden en de laagte bewoond waren?","8":"Verder kwam het woord van de HEERE tot Zacharia:","9":"Zo sprak de HEERE van de heerscharen: Doe een waarachtig recht, en bewijs goedertierenheid en barmhartigheid, de een aan de ander;","10":"en verdruk de weduwe niet, evenmin de wees, de vreemdeling of de arme; en bedenk in uw hart niet de een tegen de ander iets kwaads.","11":"Maar zij weigerden op te letten, en trokken hun schouder terug, en zij verzwaarden hun oren, zodat zij niet hoorden.","12":"En zij maakten hun hart als een diamant, zodat zij niet hoorden de wet en de woorden die de HEERE van de heerscharen zond door Zijn Geest, door de dienst van de vorige profeten, waardoor een grote toorn is ontstaan van de HEERE van de heerscharen.","13":"Daarom is het gebeurd, zoals Hij geroepen had en zij niet gehoord hebben, dat zij ook riepen, maar Ik niet hoorde, zegt de HEERE van de heerscharen;","14":"Maar Ik heb hen weggestormd onder alle heidenvolken die zij niet kenden; en het land werd achter hen verwoest, zodat niemand er doorheen trok of terugkeerde; want zij maakten het begerenswaardige land tot een verwoesting."},"SV":{"1":"Het gebeurde nu in het vierde jaar van den koning Darius, *dat* het woord des HEEREN geschiedde tot Zacharia, op den vierden der negende maand, *namelijk* in Chisleu.","2":"Toen men *naar* het huis van God gezonden had Sarezer, en Regem-melech, en zijn mannen, om het aangezicht des HEEREN te smeken;","3":"Zeggende tot de priesters, die in het huis des HEEREN der heirscharen waren, en tot de profeten, zeggende: Moet ik wenen in de vijfde maand, mij afzonderende, gelijk als ik gedaan heb nu zo vele jaren?","4":"Toen geschiedde het woord des HEEREN der heirscharen tot mij, zeggende:","5":"Spreek tot het ganse volk dezes lands, en tot de priesters, zeggende: Toen gij vasttet en rouwklaagdet, in de vijfde en in de zevende *maand*, namelijk nu zeventig jaren, hebt gijlieden Mij, Mij enigszins gevast?","6":"Of als gij at, en als gij dronkt, waart gij het niet, die daar at, en gij, die daar dronkt?","7":"Zijn het niet de woorden, welke de HEERE uitriep door den dienst der vorige profeten, toen Jeruzalem bewoond en gerust was, en haar steden rondom haar; en het zuiden en de laagte bewoond was?","8":"Verder geschiedde het woord des HEEREN tot Zacharia, zeggende:","9":"Alzo sprak de HEERE der heirscharen, zeggende: Richt een waarachtig gericht, en doet goedertierenheid en barmhartigheden, de een aan den ander;","10":"En verdrukt de weduwe noch den wees, den vreemdeling noch den ellendige; en denkt niet in uw hart de een des anderen kwaad.","11":"Maar zij weigerden op te merken, en togen hun schouder terug, en zij verzwaarden hun oren, opdat zij niet hoorden.","12":"En zij maakten hun hart *als* een diamant, opdat zij niet hoorden de wet en de woorden, die de HEERE der heirscharen zond in Zijn Geest, door den dienst der vorige profeten, waaruit ontstaan is een grote toorn van den HEERE der heirscharen.","13":"Daarom is het geschied, gelijk als Hij geroepen had, doch zij niet gehoord hebben, alzo riepen zij ook, maar Ik hoorde niet, zegt de HEERE der heirscharen;","14":"Maar Ik heb hen weggestormd onder alle heidenen, welke zij niet kenden; en het land werd achter hen verwoest, zodat er niemand doorging, noch wederkeerde; want zij stelden het gewenste land tot een verwoesting."},"KJV":{"1":"And it came to pass in the fourth year of king Darius, *that* the word of the LORD came unto Zechariah in the fourth *day* of the ninth month, *even* in Chisleu;","2":"When they had sent unto the house of God Sherezer and Regemmelech, and their men, to pray before the LORD,","3":"*And* to speak unto the priests which *were* in the house of the LORD of hosts, and to the prophets, saying, Should I weep in the fifth month, separating myself, as I have done these so many years?","4":"Then came the word of the LORD of hosts unto me, saying,","5":"Speak unto all the people of the land, and to the priests, saying, When ye fasted and mourned in the fifth and seventh *month*, even those seventy years, did ye at all fast","6":"And when ye did eat, and when ye did drink, did not ye eat *for yourselves*, and drink","7":"*Should ye* not *hear* the words which the LORD hath cried by the former prophets, when Jerusalem was inhabited and in prosperity, and the cities thereof round about her, when *men* inhabited the south and the plain?","8":"And the word of the LORD came unto Zechariah, saying,","9":"Thus speaketh the LORD of hosts, saying, Execute true judgment, and shew mercy and compassions every man to his brother:","10":"And oppress not the widow, nor the fatherless, the stranger, nor the poor; and let none of you imagine evil against his brother in your heart.","11":"But they refused to hearken, and pulled away the shoulder, and stopped their ears, that they should not hear.","12":"Yea, they made their hearts *as* an adamant stone, lest they should hear the law, and the words which the LORD of hosts hath sent in his spirit by the former prophets: therefore came a great wrath from the LORD of hosts.","13":"Therefore it is come to pass, *that* as he cried, and they would not hear; so they cried, and I would not hear, saith the LORD of hosts:","14":"But I scattered them with a whirlwind among all the nations whom they knew not. Thus the land was desolate after them, that no man passed through nor returned: for they laid the pleasant land desolate."}},"tsk":{"1":[{"kopje":"het vierde","refs":["Zach 1:1","Ezra 6:14","Ezra 6:15","Hagg 2:11","Hagg 2:21"]},{"kopje":"Chisleu","refs":["Neh 1:1"]}],"2":[{"kopje":"Sarezer en Regem-Melech","refs":["Zach 6:10","Ezra 6:10","Ezra 7:15-23","Ezra 8:28-30","Jes 60:7"]},{"kopje":"het aangezicht van de HEERE te smeken","refs":["Zach 8:21","Ex 32:11","1 Sam 13:12","1 Kon 13:6","Jer 26:19"]}],"3":[{"kopje":"door te zeggen","refs":["Deut 17:9-11","Deut 33:10","Ezech 44:23","Ezech 44:24","Hos 4:6","Hagg 2:12","Mal 2:7"]},{" ode=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Should I <span class=\"wl wl-kjv\" data-code=\"H1058\">weep</span> in the <span class=\"wl wl-kjv\" data-code=\"H2549\">fifth</span> <span class=\"wl wl-kjv\" data-code=\"H2320\">month,</span> <span class=\"wl wl-kjv\" data-code=\"H5144\">separating</span> myself, as I have <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> these so many years?","4":"Then came the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts</span> unto me, saying,","5":"<span class=\"wl wl-kjv\" data-code=\"H559\">Speak</span> unto all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> When ye <span class=\"wl wl-kjv\" data-code=\"H6684\">fasted</span> and <span class=\"wl wl-kjv\" data-code=\"H5594\">mourned</span> in the <span class=\"wl wl-kjv\" data-code=\"H2549\">fifth</span> and <span class=\"wl wl-kjv\" data-code=\"H7637\">seventh</span> month, even those <span class=\"wl wl-kjv\" data-code=\"H7657\">seventy</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years,</span> did ye at <span class=\"wl wl-kjv\" data-code=\"H6684\">all</span> fast","6":"And when ye did <span class=\"wl wl-kjv\" data-code=\"H398\">eat,</span> and when ye did <span class=\"wl wl-kjv\" data-code=\"H8354\">drink,</span> did not ye <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> for yourselves, and drink","7":"Should ye not hear the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H7121\">cried</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">by</span> the <span class=\"wl wl-kjv\" data-code=\"H7223\">former</span> <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets,</span> when <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> was <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabited</span> and in <span class=\"wl wl-kjv\" data-code=\"H7961\">prosperity,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> thereof round about <span class=\"wl wl-kjv\" data-code=\"H5439\">her,</span> when men <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabited</span> the <span class=\"wl wl-kjv\" data-code=\"H5045\">south</span> and the plain?","8":"And the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> came unto <span class=\"wl wl-kjv\" data-code=\"H2148\">Zechariah,</span> saying,","9":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">speaketh</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H8199\">Execute</span> <span class=\"wl wl-kjv\" data-code=\"H571\">true</span> <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">shew</span> <span class=\"wl wl-kjv\" data-code=\"H2617\">mercy</span> and <span class=\"wl wl-kjv\" data-code=\"H7356\">compassions</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> to his brother:","10":"And <span class=\"wl wl-kjv\" data-code=\"H6231\">oppress</span> not the <span class=\"wl wl-kjv\" data-code=\"H490\">widow,</span> nor the <span class=\"wl wl-kjv\" data-code=\"H3490\">fatherless,</span> the <span class=\"wl wl-kjv\" data-code=\"H1616\">stranger,</span> nor the <span class=\"wl wl-kjv\" data-code=\"H6041\">poor;</span> and let none of you <span class=\"wl wl-kjv\" data-code=\"H2803\">imagine</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"wl wl-kjv\" data-code=\"H376\">against</span> his <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> in your heart.","11":"But they <span class=\"wl wl-kjv\" data-code=\"H3985\">refused</span> to <span class=\"wl wl-kjv\" data-code=\"H7181\">hearken,</span> and pulled <span class=\"wl wl-kjv\" data-code=\"H5414\">away</span> the <span class=\"wl wl-kjv\" data-code=\"H3802\">shoulder,</span> and <span class=\"wl wl-kjv\" data-code=\"H3513\">stopped</span> their <span class=\"wl wl-kjv\" data-code=\"H241\">ears,</span> that they should not hear.","12":"Yea, they <span class=\"wl wl-kjv\" data-code=\"H7760\">made</span> their <span class=\"wl wl-kjv\" data-code=\"H3820\">hearts</span> as an adamant <span class=\"wl wl-kjv\" data-code=\"H8068\">stone,</span> lest they should <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> the <span class=\"wl wl-kjv\" data-code=\"H8451\">law,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts</span> hath <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> in his <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">by</span> the <span class=\"wl wl-kjv\" data-code=\"H7223\">former</span> <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets:</span> therefore came a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H7110\">wrath</span> from the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of hosts.","13":"Therefore it is come to pass, that as he <span class=\"wl wl-kjv\" data-code=\"H7121\">cried,</span> and they would not <span class=\"wl wl-kjv\" data-code=\"H8085\">hear;</span> so they <span class=\"wl wl-kjv\" data-code=\"H7121\">cried,</span> and I would not <span class=\"wl wl-kjv\" data-code=\"H8085\">hear,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of hosts:","14":"But I scattered them with a <span class=\"wl wl-kjv\" data-code=\"H5590\">whirlwind</span> among all the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> whom they <span class=\"wl wl-kjv\" data-code=\"H3045\">knew</span> not. Thus the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> was <span class=\"wl wl-kjv\" data-code=\"H8074\">desolate</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> them, that no man passed <span class=\"wl wl-kjv\" data-code=\"H5674\">through</span> nor <span class=\"wl wl-kjv\" data-code=\"H7725\">returned:</span> for they <span class=\"wl wl-kjv\" data-code=\"H7760\">laid</span> the <span class=\"wl wl-kjv\" data-code=\"H2532\">pleasant</span> <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> desolate."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Daríus,","tekst":"Zie Zech 1:1 ."},{"catchword":"Chisleu","tekst":"Deze maand komt merendeels met onze November overeen. Zie Neh 1:1 ."}],"2":[{"catchword":"naar het huis van God","tekst":"Dat is, naar den tempel, wwar de priesters en profeten waren, gelijk af te leiden is uit vs.3. Anders: als Bethel; dat is, de kerk Gods, gezonden had Sarezer."},{"catchword":"gezonden had","tekst":"Te weten, vanwege het volk, gelijk blijkt uit vs.5, hetwelk uit de Babylonische gevangenschap wedergekomen was; of, zo anderen menen, vanwege het volk, dat nog in Babylonië was."},{"catchword":"Sarézer,","tekst":"Dit zijn buiten alle twijfel van de allervoortreffelijkste mannen onder de Joden in die tijden geweest."},{"catchword":"en zijn mannen,","tekst":"Dat is, mitsgaders de andere mannen, die dezen in dit gezantschap bijgevoegd waren. Of, met hunne mannen; dat is, met hunne dienaars."}],"3":[{"catchword":"tot de profeten,","tekst":"Te weten, Haggaï, Zacharia en Maleachi."},{"catchword":"wenen","tekst":"Dat is, treuren, droevig zijn en vasten. De zin is: Is men verbonden dien vastendag met wenen en treuren te onderhouden, [nu de tempel bijna herbouwd is] die voortijds is ingesteld ter gedachtenis van de verwoesting van den tempel? Zie 2Ki 25:9 , en Jer 52:13 ."},{"catchword":"in de vijfde maand,","tekst":"Ten dele met Juli overeenkomende. In deze maand zijn tempel en stad verwoest geworden; 2Ki 25:9 , en Jer 52:12 ."},{"catchword":"mij afzonderende,","tekst":"Dat is, mij onthoudende, te weten van eten en drinken en andere verkwikkingen van het lichaam en mijne ziel kwellende. Zie Joel 2:15 , enz."}],"5":[{"catchword":"in de vijfde","tekst":"Ter gedachtenis van de verwoesting van den tempel; Jer 52:12 ."},{"catchword":"in de zevende maand,","tekst":"Deze vastendag was ingesteld ter gedachtenis aan Gadalja, die in die maand verradelijk vermoord was; 2Ki 25:25 ; Jer 41:2 ."},{"catchword":"nu zeventig jaren,","tekst":"Namelijk zolang als de Babylonische gevangenschap geduurd heeft, en daarna tot dezen tijd toe."},{"catchword":"Mij, Mij","tekst":"Dat is, mij ten gevalle, alzo dat het mij zou behaagd hebben? of, dat mij daarmede enige bijzondere eer of enigen godsdienst zou aangedaan zijn? De zin is: dat de ware godsdienst niet eigenlijk bestaat in het vasten, of in eten en drinken, maar in het onderhouden der geboden Gods."},{"catchword":"enigszins gevast?","tekst":"Hebr. vastende gevast?"}],"6":[{"catchword":"waart gij het niet,","tekst":"Dat is, hebt gijlieden niet voor uzelven gegeten en gedronken? Ik heb er geen voedsel van gehad, maar gijliede."}],"7":[{"catchword":"Zijn het niet de woorden,","tekst":"Alsof Hij zeide: Uw vraag is licht te beantwoorden, leest hetgeen de profeten hier tevoren meermalen gepredikt hebben, zo zult gij daar vinden wat Ik van ulieder vasten houd. Zie Isa 58:3-4 ; maar anderen vertalen de woorden van den tekst aldus: [Zoudt] gij niet [behoren te doen] de woorden die de Heere uitgeroepen heeft door enz., of aldus: [Hebt] gij niet [gehoord] enz."},{"catchword":"door den dienst","tekst":"Hebr. door de hand, gelijk in vs.12."},{"catchword":"toen Jeruzalem","tekst":"Te weten, voor de Babylonische gevangenschap; of toen Jeruzalem nog bloeide."},{"catchword":"het zuiden","tekst":"Zie Jos 15:1-2 . De zin is: Toen het koninkrijk van Juda nog in staat was en die stammen in hun geheel."}],"9":[{"catchword":"sprak de HEERE der heirscharen,","tekst":"Te weten, tot uwe vaders."},{"catchword":"richt","tekst":"De zin is: Dit is een recht vasten, dat mij behaagt, Zie van een recht vasten breder, Isa 1:16-18 ; Mat 23:23 ."},{"catchword":"een waarachtig gericht,","tekst":"Hebr. een gericht der waarheid, of der trouw."},{"catchword":"de een aan den ander;","tekst":"Hebr. de man met zijne broeder, of met zijnen naaste."}],"10":[{"catchword":"denkt niet in uw hart","tekst":"Want men zondigt ook met zijn gedachten."},{"catchword":"de een des anderen","tekst":"Hebr. van den man van zijnen broeder kwaad."},{"catchword":"kwaad","tekst":"Dat is, kwalijk vaart, schade."}],"11":[{"catchword":"zij weigerden op te merken,","tekst":"Te weten, uwe vaders en voorouders. Zie Zech 1:4 ."},{"catchword":"togen hun schouder terug,","tekst":"Dat is, zij wilden des Heeren juk niet dragen. Hebr. zij gaven een afwijkenden schouder. Zie Neh 9:29 ."},{"catchword":"zij verzwaarden hun oren,","tekst":"Verg. Isa 6:10 ."}],"12":[{"catchword":"maakten hun hart","tekst":"Hebr. stelden, zetteden."},{"catchword":"als een diamant,","tekst":"Dat is, gans hard en wederspannig. Verg. Isa 48:4 ; Eze 11:19 , en Eze 36:26 . Hebr. als een duurachtigen [steen]. Zie de aantekening bij Jer 17:1 ."},{"catchword":"de wet en de woorden,","tekst":"Te weten, de wet des Heeren."},{"catchword":"in Zijn Geest,","tekst":"Hieruit blijkt dat zij wederspannig geweest zijn, niet zozeer tegen de profeten als tegen den Geest Gods, die in en door de profeten sprak."}],"13":[{"catchword":"Hij geroepen had,","tekst":"Te weten, de Heere, of de profeet des Heeren. Zie vs.7; Hos 11:2 , en Mic 3:4 ."}],"14":[{"catchword":"werd achter hen verwoest,","tekst":"En het bleef lang woest liggen, te weten, nadat zij gevangelijk zijn weggevoerd geworden."},{"catchword":"zodat er niemand doorging,","tekst":"Wij zouden, naar onze manier van spreken zeggen: Zodat er niemand uit noch in ging, en dit duurde zolang totdat Ik ulieden daar wederom in bracht."},{"catchword":"zij stelden","tekst":"Te weten, uwe vaders, gelijk in vs.11. Anders: alzo stelden zij het, enz."},{"catchword":"het gewenste land","tekst":"Te weten, het Joodse land. De zin is: Zij zijn door hunne ongehoorzaamheid en wederspannigheid zelf oorzaak geweest dat het edele land, hetwelk Ik hun ten erfdeel gegeven had, zo jammerlijk is verwoest geworden, gelijk zij dit zelf bekennen; Dan 9:16 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Now it happened in the fourth year of the King darius, [See above chap. 1.1] (that) the word of the LORD came unto Zacharia, on the fourth of the ninth moneth (namely) in Chisleu [agreeing mostly with our November. See Neh. 1.]"}],"2":[{"catchword":null,"tekst":"When they had sent [viz. in the name and behalf of the people (as appears by verse 5) which was eturned out of the Bablonian captivity; or, as others conceive, which yet was in Babylonia] (to) the house of God, [i.e to the Temple, where the priests and prophets were, as appears by verse 3. oth. When Bathel had sent] Sarezer, and Regum Melech, [these doubtless were some of the chiefest men among the Jews at that time] and his men, [that is, together with other men, that were joined in this Embassie, or commission; or, with their men, that is, with their servants and retinue] for to petition [or, beseech] the face of the LORD."}],"3":[{"catchword":null,"tekst":"Saying to the Priests that were in the house of the Lord of hostes, and to the Prophets, [to wit, Haggai, Zacharia and Malachi] must I weep [i.e. be sad and sorrowfull and fast] in the fifth moneth [agreeing partly with our July, and being that moneth, in which many years before the first temple was destroyed, 2 Kings 25.9. and Jer. 52.12.] separating my self, [that is, abstaining or withholding my self, from eating, drinking and other bodily reflections, and afflicting my soul. See Joel 2.15, &c] according as I have done now so amny years? [the meaning of their proposition is, as if they had demanded, whether they stood-bound yet, now the Temple was almost set up again, still to observe that day of humiliation, which formerly was instituted in remembrance of its destruction.]"}],"4":[{"catchword":null,"tekst":"Then came the word of the LORD of hostes unto me saying;"}],"5":[{"catchword":null,"tekst":"Speak unto all the people of this land, and unto the priests, saying: when ye fasted and mourned in the fifth [in remembrance of the destruction of the temple, verse 3. in the annotate.] and in the seventh (moneth) [this fastday was instituted in remembrance of Gedalia, who in this moneth was treacherously assassinated. 2 kings 25.25. Jer. 41.2.] namely now seventy years: [viz. as long as the Babylonian captivity lasted, and after that hitherto] did ye fast unto me, at all to me? [Heb. Did ye fast unto me, at all to me? [Heb. Did ye fasting fast to me: i.e for to please me, or, to do me pleasure thereby; or, as if some special honour and worship were conferred thereby upon me? Intimating, that the rue worship of God consisted not properly in fasting, nor in eating and drinking, but in the keeping of God&acirc;&euro;&trade;s commands.]"}],"6":[{"catchword":null,"tekst":"Or, when ye did eat, and when ye drank, were not ye they that did eat, and ye they that did drink? [i.e. have ye not eaten and drunk for your selves? Not I, but ye yourselves were the better for, or, had the benefit of it.]"}],"7":[{"catchword":null,"tekst":"Are they not the words which the LORD proclaimed by the ministery [Heb. Hand, as also below verse 12.] of the prophets, [the sense is, your question is easie to be resolved: look but into the prophets, and read what they preached and published formerly, on several occasions, and ye will soon finde, in what esteem I hold your fastings. See Isa. 58.3, 4. But other read the words of the text thus, (ought ye not (to do) the words which the LORD proclaimed by &c or thus: (have) ye not (head) &c.] when Jerusalem was inhabited and at rest, [viz. before the Babylonian captivity, or, whiles Jerusalem was yet in a flourishing condition] and her cities round about her? And the south, and the plain was inhabited. [see Jos. 15.1, 2. the meaning is; when the Kingdom of Juda was in good estate yet, and the Tribes entire.]"}],"8":[{"catchword":null,"tekst":"Moreover the word of the LORD came of Zacharia, saying;"}],"9":[{"catchword":null,"tekst":"Thus spake the LORD of hostes, [viz. unto your fathers] saying: Judge [the meaning is: this indeed is a true fast, well pleasing to me. See further of a true Fast. Isa. 1.16, 17, 18. Mat. 23.23.] a true judgement, [Heb. A judgement of truth, or faithfulness] and practice kindness and compassions the one on the other: [Hebr. The man with his brother, or, with his neighbour.]"}],"10":[{"catchword":null,"tekst":"And do not oppress the window, nor the fatherless, nor the afflicted: and think not evil in your heart, [i.e devise, contrive no mischief, damage, prejudice, the very thoughts whereof are sin] the one of the other. [Heb. The man of his brother.]"}],"11":[{"catchword":null,"tekst":"But they refused [viz. their fathers and forefathes. See above chap. 1.4.] to attend, and withdrew their shoulders, and they made their ears heavy, that they might not hear, [compare Isa. 6.10. i.e. they would not bear the york of the LORD, nor hear of it. Heb. They gave a backsliding shoulders. See Neh. 9 on verse 29.]"}],"12":[{"catchword":null, // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;

    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });

  openVers = null;
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 2;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
