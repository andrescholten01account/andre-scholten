ellendige schapen zijn; en ik heb mij twee stokken genomen, de een heb ik LIEFELIJKHEID genoemd, en de ander heb ik SAMENBINDERS genoemd; en ik heb die schapen geweid.","8":"En ik heb drie herders in één maand afgesneden; want mijn ziel was verdrietig over hen geworden, en ook had hun ziel een walg van mij.","9":"En ik zei: Ik zal u niet *meer* weiden; wat sterft, dat sterft, en wat afgesneden is, dat wordt afgesneden, en dat de overgeblevenen elkaars vlees verslinden.","10":"En ik nam mijn stok LIEFELIJKHEID, en verbrak hem, om mijn verbond teniet te doen, dat ik met al deze volken gemaakt had.","11":"Zo werd het te dien dage vernietigd, en zo hebben de ellendigen onder de schapen, die op mij wachtten, erkend, dat het het woord van de HEERE was.","12":"Want ik had tegen hen gezegd: Als het goed is in uw ogen, breng mijn loon, en zo niet, laat het na. En zij hebben mijn loon gewogen, dertig zilverlingen.","13":"Doch de HEERE zei tegen mij: Werp ze heen voor de pottenbakker: een heerlijke prijs, die Ik van hen waard geacht ben geweest! En ik nam die dertig zilverlingen, en wierp ze *in* het huis van de HEERE, voor de pottenbakker.","14":"Toen verbrak ik mijn tweede stok, SAMENBINDERS, om de broederschap tussen Juda en Israël teniet te doen.","15":"Verder zei de HEERE tegen mij: Neem u nog eens het gereedschap van een dwaze herder.","16":"Want zie, Ik zal een herder verwekken in dit land; wat gereed is om afgesneden te worden, zal hij niet bezoeken; het jonge zal hij niet zoeken, en het verbrokene zal hij niet helen, en het stilstaande zal hij niet dragen; maar het vlees van het vette zal hij eten, en hun klauwen zal hij verscheuren.","17":"Wee de nietige herder, die de kudde verlaat! Het zwaard zal over zijn arm zijn, en over zijn rechteroog; zijn arm zal helemaal verdorren, en zijn rechteroog zal helemaal donker worden."},"SV":{"1":"Doe uw deuren open, o Libanon! opdat het vuur uw cederen vertere.","2":"Huilt, gij dennen! dewijl de cederen gevallen zijn, dewijl die heerlijke *bomen* verwoest zijn; huilt, gij eiken van Basan! dewijl het sterke woud nedergevallen is.","3":"Er is een stem des gehuils der herderen, dewijl hun heerlijkheid verwoest is; een stem des gebruls der jonge leeuwen, dewijl de hoogmoed van de Jordaan verwoest is.","4":"Alzo zegt de HEERE, mijn God: Weidt deze slachtschapen.","5":"Welker bezitters hen doden, en houden het voor geen schuld; en een ieder dergenen, die ze verkopen, zegt: Geloofd zij de HEERE, dat ik rijk geworden ben! en niemand van degenen, die ze weiden, verschoont ze.","6":"Zekerlijk, Ik zal niet meer de inwoners dezes lands verschonen, spreekt de HEERE; maar ziet, Ik zal de mensen overleveren, elk een in de hand zijns naasten, en in de hand zijns konings, en zij zullen dit land te morzel slaan, en Ik zal ze uit hun hand niet verlossen.","7":"Dies heb ik deze slachtschapen geweid, dewijl zij ellendige schapen zijn; en ik heb mij genomen twee stokken, den een heb ik genoemd LIEFELIJKHEID, en den anderen heb ik genoemd SAMENBINDERS; en ik heb die schapen geweid.","8":"En ik heb drie herders in een maand afgesneden; want mijn ziel was over hen verdrietig geworden, en ook had hun ziel een walg van mij.","9":"En ik zeide: Ik zal ulieden niet *meer* weiden; wat sterft, dat sterve, en wat afgesneden is, dat zij afgesneden, en dat de overgeblevenen de een des anderen vlees verslinden.","10":"En ik nam mijn stok LIEFELIJKHEID, en ik verbrak denzelven, te niet doende mijn verbond, hetwelk ik met al deze volken gemaakt had.","11":"Dus werd het te dien dage vernietigd, en alzo hebben de ellendigen onder de schapen, die op mij wachtten, bekend, dat het des HEEREN woord was.","12":"Want ik had tot henlieden gezegd: Indien het goed is in uw ogen, brengt mijn loon, en zo niet, laat het na. En zij hebben mijn loon gewogen, dertig zilverlingen.","13":"Doch de HEERE zeide tot mij: Werp ze henen voor den pottenbakker: een heerlijken prijs, dien ik waard geacht ben geweest van hen! En ik nam die dertig zilverlingen, en wierp ze *in* het huis des HEEREN, voor den pottenbakker.","14":"Toen verbrak ik mijn tweeden stok, SAMENBINDERS, te niet doende de broederschap tussen Juda en tussen Israël.","15":"Verder zeide de HEERE tot mij: Neem u nog eens dwazen herders gereedschap.","16":"Want ziet, Ik zal een herder verwekken in dit land; dat gereed is om afgesneden te worden, zal hij niet bezoeken; het jonge zal hij niet zoeken, en het verbrokene zal hij niet helen, en het stilstaande zal hij niet dragen; maar het vlees van het vette zal hij eten, en derzelver klauwen zal hij verscheuren.","17":"Wee den nietigen herder, den verlater der kudde! Het zwaard zal over zijn arm zijn, en over zijn rechteroog; zijn arm zal ten enenmale verdorren, en zijn rechteroog zal ten enenmale donker worden."},"KJV":{"1":"Open thy doors, O Lebanon, that the fire may devour thy cedars.","2":"Howl, fir tree; for the cedar is fallen; because the mighty are spoiled: howl, O ye oaks of Bashan; for the forest of the vintage is come down.","3":"*There is* a voice of the howling of the shepherds; for their glory is spoiled: a voice of the roaring of young lions; for the pride of Jordan is spoiled.","4":"Thus saith the LORD my God; Feed the flock of the slaughter;","5":"Whose possessors slay them, and hold themselves not guilty: and they that sell them say, Blessed *be* the LORD; for I am rich: and their own shepherds pity","6":"For I will no more pity the inhabitants of the land, saith the LORD: but, lo, I will deliver the men every one into his neighbour's hand, and into the hand of his king: and they shall smite the land, and out of their hand I will not deliver","7":"And I will feed the flock of slaughter, *even* you, O poor of the flock. And I took unto me two staves; the one I called Beauty, and the other I called Bands; and I fed the flock.","8":"Three shepherds also I cut off in one month; and my soul lothed them, and their soul also abhorred","9":"Then said I, I will not feed you: that that dieth, let it die; and that that is to be cut off, let it be cut off; and let the rest eat every one the flesh of another.","10":"And I took my staff, *even* Beauty, and cut it asunder, that I might break my covenant which I had made with all the people.","11":"And it was broken in that day: and so the poor of the flock that waited upon me knew that it *was* the word of the LORD.","12":"And I said unto them, If ye think good, give *me* my price; and if not, forbear. So they weighed for my price thirty *pieces* of silver.","13":"And the LORD said unto me, Cast it unto the potter: a goodly price that I was prised at of them. And I took the thirty *pieces* of silver, and cast them to the potter in the house of the LORD.","14":"Then I cut asunder mine other staff, *even* Bands, that I might break the brotherhood between Judah and Israel.","15":"And the LORD said unto me, Take unto thee yet the instruments of a foolish shepherd.","16":"For, lo, I will raise up a shepherd in the land, *which* shall not visit those that be cut off, neither shall seek the young one, nor heal that that is broken, nor feed that that standeth still: but he shall eat the flesh of the fat, and tear their claws in pieces.","17":"Woe to the idol shepherd that leaveth the flock! the sword *shall be* upon his arm, and upon his right eye: his arm shall be clean dried up, and his right eye shall be utterly darkened."}},"tsk":{"1":[{"kopje":"o Libanon","refs":["Zach 10:10","Jer 22:6","Jer 22:7","Jer 22:23","Hab 2:8","Hab 2:17","Hagg 1:8"]},{"kopje":"opdat","refs":["Zach 14:1","Zach 14:2","Deut 32:22","Matt 24:1","Matt 24:2","Luk 19:41-44","Luk 21:23","Luk 21:24"]}],"2":[{"kopje":"Huil","refs":["Jes 2:12-17","Jes 10:33","Jes 10:34","Ezech 31:2","Ezech 31:3","Ezech 31:17","Amos 6:1","Nahum 3:8-19","Luk 23:31"]},{"kopje":"Omdat","refs":["Jes 32:15-19","Ezech 20:46"]}],"3":[{"kopje":"Er is een stem","refs":["Zach 11:8","Zach 11:15-17","Jer 25:34-36","Joël 1:13","Amos 8:8","Zef 1:10","Matt 15:14","Matt 23:13-33","Jak s=\"wl wl-kjv\" data-code=\"H6565\">broken</span> in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day:</span> and so the <span class=\"wl wl-kjv\" data-code=\"H6041\">poor</span> of the <span class=\"wl wl-kjv\" data-code=\"H6629\">flock</span> that <span class=\"wl wl-kjv\" data-code=\"H8104\">waited</span> upon me <span class=\"wl wl-kjv\" data-code=\"H3045\">knew</span> that it was the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the LORD.","12":"And I <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, If ye <span class=\"wl wl-kjv\" data-code=\"H5869\">think</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">good,</span> <span class=\"wl wl-kjv\" data-code=\"H3051\">give</span> me my <span class=\"wl wl-kjv\" data-code=\"H7939\">price;</span> and if not, <span class=\"wl wl-kjv\" data-code=\"H2308\">forbear.</span> So they <span class=\"wl wl-kjv\" data-code=\"H8254\">weighed</span> for my <span class=\"wl wl-kjv\" data-code=\"H7939\">price</span> <span class=\"wl wl-kjv\" data-code=\"H7970\">thirty</span> pieces of silver.","13":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me, <span class=\"wl wl-kjv\" data-code=\"H7993\">Cast</span> it unto the <span class=\"wl wl-kjv\" data-code=\"H3335\">potter:</span> a <span class=\"wl wl-kjv\" data-code=\"H145\">goodly</span> <span class=\"wl wl-kjv\" data-code=\"H3366\">price</span> that I was prised <span class=\"wl wl-kjv\" data-code=\"H3365\">at</span> of them. And I <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> the <span class=\"wl wl-kjv\" data-code=\"H7970\">thirty</span> pieces of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> and <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> them to the <span class=\"wl wl-kjv\" data-code=\"H3335\">potter</span> in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the LORD.","14":"Then I cut <span class=\"wl wl-kjv\" data-code=\"H1438\">asunder</span> mine <span class=\"wl wl-kjv\" data-code=\"H8145\">other</span> <span class=\"wl wl-kjv\" data-code=\"H4731\">staff,</span> even <span class=\"wl wl-kjv\" data-code=\"H2254\">Bands,</span> that I might <span class=\"wl wl-kjv\" data-code=\"H6565\">break</span> the <span class=\"wl wl-kjv\" data-code=\"H264\">brotherhood</span> between <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> and Israel.","15":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me, <span class=\"wl wl-kjv\" data-code=\"H3947\">Take</span> unto thee yet the <span class=\"wl wl-kjv\" data-code=\"H3627\">instruments</span> of a <span class=\"wl wl-kjv\" data-code=\"H196\">foolish</span> shepherd.","16":"For, lo, I will raise <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> a <span class=\"wl wl-kjv\" data-code=\"H7462\">shepherd</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> which shall not <span class=\"wl wl-kjv\" data-code=\"H6485\">visit</span> those that be cut <span class=\"wl wl-kjv\" data-code=\"H3582\">off,</span> neither shall <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> the young <span class=\"wl wl-kjv\" data-code=\"H5289\">one,</span> nor <span class=\"wl wl-kjv\" data-code=\"H7495\">heal</span> that that is <span class=\"wl wl-kjv\" data-code=\"H7665\">broken,</span> nor <span class=\"wl wl-kjv\" data-code=\"H3557\">feed</span> that that <span class=\"wl wl-kjv\" data-code=\"H5324\">standeth</span> still: but he shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> the <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> of the <span class=\"wl wl-kjv\" data-code=\"H1277\">fat,</span> and <span class=\"wl wl-kjv\" data-code=\"H6561\">tear</span> their <span class=\"wl wl-kjv\" data-code=\"H6541\">claws</span> in pieces.","17":"<span class=\"wl wl-kjv\" data-code=\"H1945\">Woe</span> to the <span class=\"wl wl-kjv\" data-code=\"H457\">idol</span> <span class=\"wl wl-kjv\" data-code=\"H7473\">shepherd</span> that <span class=\"wl wl-kjv\" data-code=\"H5800\">leaveth</span> the <span class=\"wl wl-kjv\" data-code=\"H6629\">flock!</span> the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> shall be upon his <span class=\"wl wl-kjv\" data-code=\"H2220\">arm,</span> and upon his <span class=\"wl wl-kjv\" data-code=\"H3225\">right</span> <span class=\"wl wl-kjv\" data-code=\"H5869\">eye:</span> his <span class=\"wl wl-kjv\" data-code=\"H2220\">arm</span> shall be <span class=\"wl wl-kjv\" data-code=\"H3001\">clean</span> dried <span class=\"wl wl-kjv\" data-code=\"H3001\">up,</span> and his <span class=\"wl wl-kjv\" data-code=\"H3225\">right</span> <span class=\"wl wl-kjv\" data-code=\"H5869\">eye</span> shall be <span class=\"wl wl-kjv\" data-code=\"H3543\">utterly</span> darkened."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"deuren open,","tekst":"Poorten, vastigheden, sloten, kastelen. Het is een profetie, dat de Joden uitgeroeid en verstrooid zouden worden, die Christus en de predikatie van het heilig Evangelie versmaden zouden."},{"catchword":"o Libanon","tekst":"De profeet wendt zijne rede tot de bossen en bergen, hier en in het volgende vers, willende te kennen geven dat geen ding God, als Hij straffen wil, kan hinderen en tegenstaan. Libanon is een berg, gelegen aan het noordelijke einde van Kanaän."},{"catchword":"opdat het vuur","tekst":"Dat is, opdat uwe vijanden, en hier bij name de Romeinen, uwe steden innemen en uw land verderven."},{"catchword":"uw cederen vertere","tekst":"Dat is, de grootste en voortreffelijkste onder ulieden. Zie Jdg 9:15 ."}],"2":[{"catchword":"gij dennen","tekst":"Versta hierdoor het gemene volk onder de Joden."},{"catchword":"de cederen gevallen zijn,","tekst":"Dat is, de oversten en de voornaamsten onder de Joden."},{"catchword":"bomen verwoest zijn;","tekst":"Of, [personen]."},{"catchword":"gij eiken van Basan","tekst":"Dat is, gij machtige inwoners van Basan. Verg. Eze 27:6 ."},{"catchword":"het sterke woud","tekst":"Te weten, de Libanon."},{"catchword":"nedergevallen is","tekst":"Hebr. nedergedaald is, of nedergekomen is; dat is, nedergehouwen of afgehouwen is."}],"3":[{"catchword":"Daar is een stem des gehuils der herderen,","tekst":"Dat is, men hoort de herders huilen; dat is, de regenten van het volk, zo geestelijk als wereldlijke personen."},{"catchword":"hun heerlijkheid verwoest is;","tekst":"Dat is, de voornaamste burgerschap, en vast al het volk, waarin de eer der prinsen is bestaande; Pro 14:28 . Anderen verstaan hierdoor de heerlijkheid den tempel; anderen de gehele stad Jeruzalem; sommigen ook het gehele Joodse land; zie Dan 11:16 , Dan 11:41 ."},{"catchword":"der jonge leeuwen,","tekst":"Dat is, der moedige krijgers."},{"catchword":"de hoogmoed","tekst":"Of, de voortreffelijkheid."},{"catchword":"van de Jordaan verwoest is","tekst":"Dat is, van het Joodse land aan de Jordaan gelegen."}],"4":[{"catchword":"Weidt","tekst":"Dit beveelt de Heere den profeet Zacharia in het gezicht, of in een figuur, aanwijzende dat Christus, de ware en overste Herder zijner kerk, van zijn hemelsen Vader bevel ontvangen had zorg te dragen voor zijn arm volk, hetwelk van de boze regenten verdrukt werd. Dit bevel wordt ook aan alle getrouwe herders, staande onder hun Hoofd Christus gegeven."},{"catchword":"deze slachtschapen","tekst":"Versta, het gemene volk onder de Joden, hetwelk van de machtigen werd onderdrukt en als ter slachting geëigend."}],"5":[{"catchword":"bezitters","tekst":"Dat is, hunne regenten, de machtigen onder het volk, als daar waren de hogepriesters, Herodes, de Schrifgeleerden, Farizeën, Sadduceën, enz."},{"catchword":"doden,","tekst":"Dat is, uitmergelen door hunne gierigheid, woeker, onrechtvaardigen handel en geweld."},{"catchword":"en houden het voor geen schuld;","tekst":"Zij hebben daarover gene wroeging in hunne conscientiën; het wordt hun ook niet ter misdaad gerekend, zij blijven ongestraft. Hebr. zij worden niet schuldig."},{"catchword":"een ieder dergenen,","tekst":"Het gewelddrijven der groten over de armen is zo algemeen geworden, dat de groten zich laten dunken dat het hun vrijstaat met de armen te handelen alsof het hun eigen slaven waren, die verkopende alsof het een vrije en geoorloofde koopmanschap ware."},{"catchword":"Geloofd zij de HEERE,","tekst":"Zij schrijven hun rijkdom den zegen Gods toe, welken zij hunnen broeders met geweld en ongerechtigheid afgeperst hadden. Verg. Mat 23:14-15 , enz."},{"catchword":"niemand van degenen,","tekst":"Geen van hunne herders verschoont hen en betoont barmhartigheid aan hen. Zie Eze 34:2-4 , enz."}],"6":[{"catchword":"de inwoners dezes lands verschonen,","tekst":"Versta dit van die boze mensen, van wie in vs.5 gesproken is, die verre het grootste deel onder de Joden waren; maar God de Vader wil evenwel hebben dat Christus voor die arme slachtschapen zou zorgdragen, gelijk Hij ook gedaan heeft toen Hij in het vlees hier op aarde verschenen is."},{"catchword":"Ik zal de","tekst":"Hebr. Ik zal de mensen doen vinden; zie 2Sa 3:8 ."},{"catchword":"mensen overleveren,","tekst":"Te weten, die goddeloze Joden."},{"catchword":"elkeen in de hand zijns naasten,","tekst":"Dat is, Ik zal den een door den ander verslaan en ombrengen. Dit is geschied: want door de inwendige twisten en beroerten, zijn er vele duizenden onder de Joden omgekomen, zie Josefus de bello Judas lib. 6, cap. 1, en 4."},{"catchword":"en in de hand zijns konings,","tekst":"Na lange onenigheden, tussen de hogepriesters Aristobulus, Alexander en Hyrcanus zijn de Romeinen in het Joodse land geroepen en gekomen, die, meester over de Joden geworden zijnde, hebben Antipater en Herodus de Grote over hetzekfe tot koningen gesteld, die nagenoeg al de voornaamsten onder de Joden hebben omgebracht. Doch enigen verstaan hierdoor den koning den Romeinsen keizer."},{"catchword":"zij zullen dit land","tekst":"Te weten, de vijanden van het Joodse volk, hetzij de Romeinen of hun andere vijanden."},{"catchword":"te morzel slaan,","tekst":"Als met hamers."},{"catchword":"zal ze uit hun hand niet verlossen","tekst":"Of, zal het, te weten, het land."}],"7":[{"catchword":"Dies heb Ik","tekst":"Of, dies zal Ik weiden. Het zijn de woorden van Christus."},{"catchword":"deze slachtschapen geweid,","tekst":"Zie vs.4."},{"catchword":"dewijl zij ellendige schapen zijn;","tekst":"Of, o gij ellendigste van de kudde, verstaande de vromen en godzaligen onder de Joden."},{"catchword":"LIEFELIJKHEID,","tekst":"Eenigen houden het Hebr. woord Noham in den tekst, betekenende lieflijkheid aanwijzende dat de Heere vriendelijk en goedertieren met den armen zondaar is omgaande."},{"catchword":"SAMENBINDERS;","tekst":"Anderen houden het Hebr. woord Chobelim, of Hobelim; dat is, binders, of banden, samenbinders, de staf der samenbinders, betekenende dat Hij poogde Juda en Israël tezamen te verbinden. Anderen zetten het over verdervers."},{"catchword":"die schapen geweid","tekst":"Te weten, die slachtschapen."}],"8":[{"catchword":"drie herders","tekst":"Dat is, al de herders of leraars van het Joodse volk, die in drie sekten onderscheiden waren, te weten, Farizeën, Sadduceën en Esseën. Anders aldus: Ik heb de koningen, priesters en profeten van hen genomen. En merk dat hier profetischewijze gesproken wordt van hetgeen nog geschieden zou alsof het alrede geschied ware."},{"catchword":"in een maand","tekst":"Dat is, in korten tijd. Verg. Hos 5:7 met de aantekening aldaar."},{"catchword":"afgesneden;","tekst":"Dat is, overtuigd van valse leer en dwaling. Maar verstaat men dit van de boze koningen, priesters en profeten, zo is afsnijden hier te zeggen weren of wegnemen, of te schande maken, verdelgen. En dit is ene weldaad, die God zijn volk belooft, te weten dat Hij de kwade regeerders, die zij hadden, wegnemen zou tot een teken zijner liefde tot hen."},{"catchword":"mijn ziel","tekst":"Hebr. mijne ziel werd hunnenthalve verkort; dat is, Ik vermocht hen niet en zij vermochten mij niet."},{"catchword":"over hen","tekst":"Te weten, over de ondankbare Joden, of vanwege die valse leraars, enz."},{"catchword":"verdrietig geworden,","tekst":"Zie Jdg 18:16 de aantekening aldaar."},{"catchword":"ook had hun ziel","tekst":"Zie Mat 27:21 ."}],"9":[{"catchword":"Ik zeide","tekst":"Te weten, tot die ondankbare Joden; of, gelijk het anderen verstaan, tot het ganse Joodse volk, gelijk Mat 23:37 ."},{"catchword":"Ik zal ulieden","tekst":"Dat is, Ik [te weten, Ik] Christus zal geen zorg meer voor ulieden dragen, Ik zal ulieden het Evangelie niet meer prediken, noch laten prediken. Hiermede geeft de Heere te kennen dat Hij de Joden, vanwege hun grote ondankbaarheid, verwerpen en niet meer voor zijn volk houden zou. Zie Deu 31:17 ."},{"catchword":"wat sterft, dat sterve,","tekst":"De zin is: als mijne tucht versmaad wordt, zo weest dan onderworpen aan het verderf, aan ellende, zo van buiten als van binnenshuis. Zie breder vs.10, en Jer 15:2 , enz; Rev 22:11 ."},{"catchword":"dat de overgeblevenen","tekst":"Hebr. de vrouw verslinde het vlees harer vriedin, of metgezellin."}],"10":[{"catchword":"Ik nam mijn stok","tekst":"Te weten, Ik Christus."},{"catchword":"LIEFELIJKHEID,","tekst":"Zie vs.7."},{"catchword":"Ik verbrak denzelven,","tekst":"Hiermede te kennen gevende dat Hij hen niet meer met zoetigheid welden of regeren wilden, gelijk Hij wel tevoren gedaan had."},{"catchword":"te niet doende mijn verbond,","tekst":"Hetwelk Ik met deze voorwaarden met hen had opgericht, dat zij in mijne geboden wandelen zouden; Exo 19:5-6 ; Lev 26:3 ; Deu 28:1 ."},{"catchword":"met al deze volken","tekst":"Versta, de de twaalfstammen, die als twaalf verscheidene volken of natiën waren."},{"catchword":"gemaakt had","tekst":"Zie deze manier van spreken Gen 15:18 ."}],"11":[{"catchword":"de ellendigen onder de schapen,","tekst":"Zie vs.7."},{"catchword":"dat het des HEEREN woord was","tekst":"Dat is, dat dit alzo geschied was naar des Heeren woord en wil."}],"12":[{"catchword":"Want ik had tot henlieden gezegd","tekst":"Hier geeft de Heer Christus reden, waarom Hij de zorg van de Joden te weiden had afgelegd en de herders had verstoten. Ik had, zegt Hij, hen vermaand dat zij mij hun loon zouden brengen, dat is, dat zij mij vruchten der bekering waardig brengen zouden, als zijnde het loon, dat Ik verdiend had met hen te weiden; zij integendeel, uit een bitteren haat, dien zij mij toedroegen, hebben mijnen verrader een loon toegewogen, om mij door hem te onderdrukken. Zie Mat 26:15 , en Mat 27:9 ."},{"catchword":"mijn loon","tekst":"Dat is, het loon dat zij mij achten waardig te zijn."},{"catchword":"gewogen,","tekst":"Zie van de manier van het geld te wegen, Gen 23:16 ;"},{"catchword":"13","tekst":"Of, tot; dat is, dat zij den pottenbakker gegeven worden, en alzo straks weder onder in dit vers."},{"catchword":"een heerlijken prijs,","tekst":"Hebr. die heerlijkheid, of voortreffelijkheid van den prijs, of der waardij. Versta dit als spottendewijze gesproken te zijn en met verontwaardiging."},{"catchword":"in het huis des HEEREN,","tekst":"Dat is, in den tempel."},{"catchword":"voor den pottenbakker","tekst":"Dat is, omdat men er een pottenbakkersakker voor kopen zou."}],"13":[{"catchword":"voor den pottenbakker","tekst":"Of, tot; dat is, dat zij den pottenbakker gegeven worden, en alzo straks weder onder in dit vers."},{"catchword":"een heerlijken prijs,","tekst":"Hebr. die heerlijkheid, of voortreffelijkheid van den prijs, of der waardij. Versta dit als spottendewijze gesproken te zijn en met verontwaardiging."},{"catchword":"in het huis des HEEREN,","tekst":"Dat is, in den tempel."},{"catchword":"voor den pottenbakker","tekst":"Dat is, omdat men er een pottenbakkersakker voor kopen zou."}],"14":[{"catchword":"SAMENBINDERS,","tekst":"Zie vs.7."},{"catchword":"te niet doende","tekst":"Hiermede wordt te kennen gegeven dat dewijl Juda en Israël Gods genade niet hedden willen erkennen, als Hij hen met elkander had willen verenigen en beide voor zijn volk houden en als zijne schapen weiden wilde, tot welk ende Hij verscheidene profeten tot hen gezonden had; dat Hij zich voortaan om hen niet meer zou bekommeren, maar laten hen in die scheuring blijven, en beide gelijkelijk te gronde gaan."}],"15":[{"catchword":"nog eens dwazen herders","tekst":"Dat is, nog hier boven; en wijst daarmede, als in een voorbeeld, het gekke en zeldzame bestuur van het Joodse volk, na de tijden van Christus; namelijk hoe het onder hetzelve zou toegaan voor de laatste verstoring van hetzelve."},{"catchword":"gereedschap","tekst":"Het Hebr. woord betekent somtijds een herderstach, 1Sa 17:40 ; somtijds een kleed, Deu 22:5 ; somtijds allerlei gereedschap; Lev 15:4 , enz."}],"16":[{"catchword":"een herder verwekken in dit land;","tekst":"Anderen, herders, verstaande de Schriftgeleerden en Farizeën, alsook andere kwade leraars, die ten tijde van Christus leven en het volk leren zouden. Anderen verstaan hierdoor herders die kwade regenten, die het Joodse land geregeerd hebben."},{"catchword":"dat gereed is om afgesneden te worden,","tekst":"Hebr. die afgesneden zijn; dat is, gereed om afgesneden te worden."},{"catchword":"het jonge zal hij niet zoeken,","tekst":"De jonge en tedere lammeren. Verg. dit vers met Eze 34:2 , enz."},{"catchword":"het verbrokene","tekst":"Het beschadigde, het gekwetste."},{"catchword":"het stilstaande","tekst":"Te weten, de schapen, die staande blijven, omdat zij zo zwak zijn dat zij de anderen niet kunnen volgen. Anders: hetstaande; dat is, dat nog gezond en wel tepas is, op zijne benen overeind staande en gaande."},{"catchword":"niet dragen;","tekst":"Of, niet vatten, onderhouden, verzorgen, voeden."},{"catchword":"het vette zal hij eten,","tekst":"Het vette [land]."},{"catchword":"hunne klauwen","tekst":"Te weten, dergenen die staande blijven en niet kunnen voortgaan, dewijl zij zwak zijn."},{"catchword":"zal hij verscheuren","t /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
function kopieerVers(n) {
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
}
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  kopieerVers(k.dataset.n);
});
// rechtermuisklik op een vers kopieert het (in plaats van het browser-contextmenu)
document.addEventListener('contextmenu', e => {
  const rij = e.target.closest('.vers');
  if (!rij || !rij.id.startsWith('v')) return;
  const n = rij.id.slice(1);
  if (!D.vertalingen.SVnu[n]) return;
  e.preventDefault();
  kopieerVers(n);
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
