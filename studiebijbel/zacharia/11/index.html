 van Israël: Zo zegt de Heere HEERE: Zie, Ik zal Mijn heiligdom ontheiligen, de heerlijkheid van uw sterkte, de begeerte van uw ogen, en waar uw ziel medelijden mee heeft; en uw zonen en uw dochters, die u achtergelaten hebt, zullen door het zwaard vallen. Dan zult u doen, zoals ik gedaan heb; de bovenlip zult u niet bedekken, en het brood van de mensen zult u niet eten. En uw hoofddeksels zullen op uw hoofden zijn, en uw schoenen aan uw voeten; u zult niet rouwklagen, en ook niet wenen, maar u zult wegkwijnen in uw ongerechtigheden, en ieder zal tegen zijn broeder zuchten.", "Joh 10:1": "Voorwaar, voorwaar zeg Ik u: die niet door de deur ingaat in de schaapskooi, maar van elders inklimt, die is een dief en rover.", "Matt 22:7": "Toen de koning dat hoorde, werd hij toornig, en hij stuurde zijn legers en heeft die moordenaars omgebracht en hun stad in brand gestoken.", "Joh 15:23-25": "Die Mij haat, die haat ook Mijn Vader. Als Ik de werken onder hen niet had gedaan, die niemand anders gedaan heeft, hadden zij geen zonde; maar nu hebben zij ze gezien, en hebben zowel Mij als Mijn Vader gehaat. Maar dit gebeurt, zodat het woord vervuld wordt dat in hun wet geschreven is: Zij hebben Mij zonder oorzaak gehaat.", "1 Petr 3:15": "maar heilig God, de Heere, in uw harten; en wees altijd bereid tot verantwoording aan ieder die u rekenschap vraagt van de hoop die in u is, met zachtmoedigheid en vreze,", "Ezech 27:6": "Zij hebben uw riemen uit eiken van Basan gemaakt; uw dekken hebben zij gemaakt van welbewerkt ivoor, uit de eilanden van de Chittieten.", "Deut 28:49-68": "De HEERE zal tegen u een volk laten opkomen van ver, van het einde van de aarde, zoals een arend vliegt; een volk waarvan u de taal niet zult verstaan; Een volk, hard van gezicht, dat geen ontzag zal hebben voor de oude, noch genadig zal zijn voor de jonge. En het zal de vrucht van uw vee, en de vrucht van uw land opeten, totdat u verdelgd zult zijn; het zal u geen koren, most of olie, aanwas van uw koeien of kudden van uw kleinvee overlaten, totdat het u vernietigt.", "Luk 18:20": "U kent de geboden: U zult geen overspel doen; u zult niet doden; u zult niet stelen; u zult geen valse getuigenis geven; eer uw vader en uw moeder.", "Ex 3:5-10": "En Hij zei: Kom hier niet dichterbij; trek uw schoenen uit van uw voeten; want de plaats waarop u staat, is heilig land. Hij zei verder: Ik ben de God van uw vader, de God van Abraham, de God van Izak en de God van Jakob. En Mozes verborg zijn gezicht, want hij was bang om God aan te zien. En de HEERE zei: Ik heb heel goed gezien de verdrukking van Mijn volk dat in Egypte is, en heb hun geschrei gehoord vanwege hun drijvers; want Ik ken hun smarten.", "1 Kon 13:4": "Het gebeurde nu, toen de koning het woord van de man van God hoorde, dat hij tegen het altaar te Beth-el geroepen had, dat Jerobeam zijn hand van het altaar uitstrekte en zei: Grijpt hem! Maar zijn hand die hij tegen hem uitgestrekt had, verdorde, zodat hij ze niet meer naar zich toe kon trekken.", "Gen 22:17": "Voorzeker zal Ik u rijk zegenen, en uw nageslacht zeer talrijk maken, als de sterren van de hemel, en als het zand dat aan de oever van de zee is; en uw nageslacht zal de poort van zijn vijanden erfelijk bezitten.", "Hebr 10:5-7": "Daarom zegt Hij, bij Zijn komst in de wereld: Slachtoffer en offergave hebt U niet gewild, maar U hebt Mij een lichaam toebereid; Brandoffers en offers voor de zonde hebben U niet behaagd. Toen zei Ik: Zie, Ik kom (in het begin van het boek is over Mij geschreven) om Uw wil te doen, o God!", "Rom 10:18": "Maar ik zeg: Hebben zij het niet gehoord? Zeker wel, hun geluid is over de hele aarde uitgegaan, en hun woorden tot de einden van de wereld.", "Rom 4:17": "(Zoals geschreven staat: Ik heb u tot een vader van veel volken gesteld) voor Hem, aan Wie hij geloofd heeft, namelijk God, Die de doden levend maakt, en de dingen die niet zijn roept alsof zij waren;", "Jes 62:11": "Ziet, de HEERE heeft doen horen, tot aan het einde van de aarde: zegt tegen de dochter van Sion: Zie, uw Heil komt; zie, Zijn loon is met Hem, en Zijn arbeidsloon is voor Zijn aangezicht.", "Gal 3:16-18": "Nu zijn de beloften gesproken tot Abraham en zijn nageslacht. Hij zegt niet: En aan de nageslachten, alsof het over velen ging; maar alsof het over één ging: En uw nageslacht; dat is Christus. En dit zeg ik: het verbond, dat door God van tevoren bevestigd is op Christus, wordt door de wet, die na vierhonderddertig jaar gekomen is, niet krachteloos gemaakt, om de belofte teniet te doen. Want als de erfenis uit de wet is, dan is zij niet meer uit de belofte; maar God heeft ze aan Abraham door de belofte genadig gegeven.", "1 Tim 6:3-5": "Als iemand een andere leer leert en niet overeenkomt met de gezonde woorden van onze Heere Jezus Christus, en met de leer die overeenkomt met de godsvrucht, is hij opgeblazen en weet hij niets, maar hij raakt bezeten van twistvragen en woordenstrijd; daaruit komen nijd, twist, lasteringen, kwade vermoedens, verkeerde twistgesprekken van mensen die een verdorven verstand hebben en van de waarheid beroofd zijn, en die menen dat de godsvrucht een bron van winst is. Blijf uit de buurt van zulke mensen.", "Luk 22:24": "En er ontstond ook twist onder hen, wie van hen scheen de meeste te zijn.", "Hand 4:25": "Die door de mond van David, Uw knecht, gezegd hebt: Waarom woeden de heidenen, en hebben de volken zinloze dingen bedacht?", "Luk 19:41-44": "En toen Hij dichtbij kwam en de stad zag, weende Hij over haar, en zei: Och, had u ook maar geweten, ook nog op deze dag van u, wat tot uw vrede dient! Maar nu is het verborgen voor uw ogen. Want er zullen dagen over u komen, dat uw vijanden een wal rondom u zullen opwerpen, en u zullen omsingelen, en u van alle kanten in het nauw drijven;", "Gen 31:38": "Deze twintig jaar ben ik bij u geweest; uw ooien en uw geiten hebben niet misdragen, en de rammen van uw kudde heb ik niet gegeten.", "Ezech 34:10": "Zo zegt de Heere HEERE: Zie, Ik heb het tegen de herders, en zal Mijn schapen van hun hand eisen, en zal ze van het weiden van de schapen doen ophouden, zodat de herders zichzelf niet meer zullen weiden; en Ik zal Mijn schapen uit hun mond rukken, zodat zij hun niet meer tot voedsel zullen zijn.", "2 Kor 6:17": "Daarom, ga uit hun midden weg, en scheid u af, zegt de Heere, en raak niet aan wat onrein is, en Ik zal u aannemen,", "Jes 52:13": "Zie, Mijn Knecht zal verstandig handelen; Hij zal verhoogd en verheven, ja, zeer hoog worden.", "Ps 69:22": "Ja, zij hebben mij gal tot mijn spijs gegeven; en in mijn dorst hebben zij mij azijn te drinken gegeven.", "Ex 33:19": "Doch Hij zei: Ik zal al Mijn goedheid voorbij uw aangezicht laten gaan, en zal de Naam van de HEERE uitroepen voor uw aangezicht; maar Ik zal genadig zijn aan wie Ik genadig zal zijn, en Ik zal Mij ontfermen over wie Ik Mij ontfermen zal.", "Joh 15:18": "Als de wereld u haat, weet dan, dat zij Mij eerder dan u gehaat heeft.", "Jes 9:1": "Het volk dat in duisternis wandelt, zal een groot licht zien; wie wonen in het land van de schaduw van de dood, over hen zal een licht schijnen.", "Ex 20:12": "Eer uw vader en uw moeder, opdat uw dagen verlengd worden in het land dat de HEERE, uw God, u geeft.", "Luk 23:31": "Want als zij dit doen aan het groene hout, wat zal er dan aan het dorre gebeuren?", "Ezech 34:6": "Mijn schapen dolen op alle bergen en op elke hoge heuvel, ja, Mijn schapen zijn verstrooid over de hele aardbodem; en er is niemand, die ernaar vraagt, en niemand, die ze zoekt.", "Luk 18:31-33": "En Hij nam de twaalf bij Zich en zei tegen hen: Zie, wij gaan op naar Jeruzalem, en alles wat door de profeten geschreven is over de Zoon des mensen, zal volbracht worden. Want Hij zal aan de heidenen overgeleverd worden, en Hij zal bespot worden, en smadelijk behandeld worden, en bespuwd worden. En nadat zij Hem gegeseld hebben, zullen zij Hem doden; en op de derde dag zal Hij weer opstaan.", "Jes 53:12": "Daarom zal Ik Hem een deel geven onder velen, en Hij zal de machtigen als buit verdelen, omdat Hij Zijn ziel uitgestort heeft in de dood, en onder de overtreders geteld is geweest, en Hij de zonden van velen gedragen heeft, en voor de overtreders gebeden heeft.", "Ef 4:26": "Word toornig, en zondig niet; laat de zon niet ondergaan over uw toorn;", "Ex 20:11": "want in zes dagen heeft de HEERE de hemel en de aarde gemaakt, de zee en alles wat daarin is, en Hij rustte op de zevende dag; daarom zegende de HEERE de sabbatdag en heiligde hem.", "Job 5:15": "Maar Hij verlost de behoeftige van het zwaard, van hun mond, en van de hand van de sterke.", "Jes 8:14": "Dan zal Hij u tot een Heiligdom zijn; maar tot een steen des aanstoots en tot een rots der struikeling voor de twee huizen van Israël, tot een strik en tot een net voor de inwoners van Jeruzalem.", "Hand 1:19": "En het is bekend geworden bij allen die in Jeruzalem wonen, zodat die akker in hun eigen taal Akeldama genoemd wordt, dat is: een akker van het bloed.", "Joh 21:15-17": "Toen zij dan de maaltijd gehouden hadden, zei Jezus tegen Simon Petrus: Simon, zoon van Jonas, hebt u Mij meer lief dan dezen? Hij zei tegen Hem: Ja, Heere! U weet dat ik U liefheb. Hij zei tegen hem: Weid Mijn lammeren. Hij zei opnieuw tegen hem, voor de tweede keer: Simon, zoon van Jonas, hebt u Mij lief? Hij zei tegen Hem: Ja, Heere, U weet dat ik U liefheb. Hij zei tegen hem: Hoed Mijn schapen. Hij zei tegen hem voor de derde keer: Simon, zoon van Jonas, hebt u Mij lief? Petrus werd bedroefd, omdat Hij voor de derde keer tegen hem zei: Hebt u Mij lief? en hij zei tegen Hem: Heere! U weet alle dingen, U weet dat ik U liefheb. Jezus zei tegen hem: Weid Mijn schapen.", "Joh 6:31": "Onze vaders hebben het manna gegeten in de woestijn, zoals geschreven is: Hij gaf hun brood uit de hemel te eten.", "Hand 7:50": "Heeft Mijn hand niet al deze dingen gemaakt?", "Ex 9:16": "Maar juist daarom heb Ik u laten opstaan, opdat Ik Mijn kracht aan u zou tonen, en opdat men Mijn Naam vertelt op de hele aarde.", "Ps 89:21": "Ik heb David, Mijn knecht, gevonden; met Mijn heilige olie heb Ik hem gezalfd;", "Luk 20:37": "En dat de doden opgewekt zullen worden, heeft ook Mozes aangewezen bij de doornstruik, toen hij de Heere de God van Abraham noemt, en de God van Izak, en de God van Jakob.", "Matt 9:13": "Ga heen en leer wat dit betekent: Ik wil barmhartigheid, en geen offerande; want Ik ben niet gekomen om rechtvaardigen te roepen, maar zondaars, tot bekering.", "Hebr 10:26-31": "Want als wij willens en wetens zondigen, nadat wij de kennis van de waarheid ontvangen hebben, blijft er geen offer meer over voor de zonden; maar een schrikwekkend uitzicht op het oordeel, en een felle hitte van het vuur, die de tegenstanders zal verslinden. Als iemand de wet van Mozes heeft verworpen, sterft hij zonder ontferming, op het woord van twee of drie getuigen;", "Jes 44:10": "Wie formeert een god, of giet een beeld, dat geen nut doet?", "Hand 6:11-14": "Toen zetten zij mannen op die zeiden: Wij hebben hem lasterlijke woorden horen spreken tegen Mozes en God. En zij hitsten het volk op, en de oudsten en de schriftgeleerden; en zij overvielen hem, grepen hem, en brachten hem voor de Raad; en zetten valse getuigen in, die zeiden: Deze man houdt niet op lasterlijke woorden te spreken tegen deze heilige plaats en de wet.", "Mark 13:22": "Want er zullen valse christussen, en valse profeten opstaan, en zij zullen tekenen en wonderen doen, om te misleiden, indien het mogelijk zou zijn, ook de uitverkorenen.", "Matt 16:21": "Van toen af begon Jezus Zijn discipelen te tonen dat Hij naar Jeruzalem moest gaan, en veel moest lijden van de oudsten, en overpriesters, en Schriftgeleerden, en gedood moest worden, en op de derde dag moest opstaan.", "Mal 4:6": "En hij zal het hart van de vaders terugbrengen tot de kinderen, en het hart van de kinderen tot hun vaders, zodat Ik niet hoef te komen en de aarde met de ban sla.", "Zach 9:9": "Verheug u zeer, dochter van Sion! Juich, dochter van Jeruzalem! Zie, uw Koning zal tot u komen, rechtvaardig, en Hij is een Heiland; arm, en rijdend op een ezel, en op een veulen, het jong van de ezelinnen.", "Ps 4:5": "Wees beroerd, en zondig niet; spreek in uw hart op uw bed, en wees stil. Sela.", "2 Kor 6:18": "en Ik zal u tot een Vader zijn, en u zult Mij tot zonen en dochters zijn, zegt de Heere, de Almachtige.", "Ezech 14:9": "Als nu een profeet overreed is en iets gesproken heeft, Ik, de HEERE, heb die profeet overreed, en Ik zal Mijn hand tegen hem uitstrekken, en zal hem verdelgen uit het midden van Mijn volk Israël.", "Ps 69:24": "Laat hun ogen duister worden, dat zij niet zien; en doe hun heupen voortdurend waggelen.", "Matt 17:10-13": "En Zijn discipelen vroegen Hem: Waarom zeggen de Schriftgeleerden dan dat Elia eerst moet komen? Jezus antwoordde en zei tegen hen: Elia zal inderdaad eerst komen en alles herstellen. Maar Ik zeg u dat Elia al gekomen is, en zij hebben hem niet erkend; maar zij hebben met hem gedaan wat zij wilden. Zo zal ook de Zoon des mensen door hen lijden.", "Deut 5:17": "U zult niet doodslaan.", "Rom 12:10": "Heb elkaar hartelijk lief met broederlijke liefde; in eerbetoon de een de ander voorgaand.", "Ps 118:26": "Gezegend is hij die daar komt in de Naam van de HEERE! Wij zegenen u uit het huis van de HEERE.", "Jes 10:23": "Want een verdelging, die vast besloten is, zal de Heere HEERE van de heerscharen doen in het midden van dit hele land.", "Fil 1:15": "Sommigen prediken Christus wel uit afgunst en twist, maar sommigen ook uit goedwilligheid.", "Luk 24:49-53": "En zie, Ik zend de belofte van Mijn Vader over u; maar blijft u in de stad Jeruzalem, totdat u bekleed wordt met kracht uit de hoogte. En Hij leidde hen naar buiten tot bij Bethanië, en hief Zijn handen op en zegende hen. En het gebeurde, terwijl Hij hen zegende, dat Hij van hen scheidde, en opgenomen werd in de hemel.", "Ezech 37:16": "U dan, mensenkind! Neem een stuk hout, en schrijf daarop: Voor Juda, en voor de kinderen van Israël, zijn metgezellen; en neem een ander stuk hout, en schrijf daarop: Voor Jozef, het hout van Efraïm, en van het gehele huis van Israël, zijn metgezellen.", "Jes 65:17-25": "Want zie, Ik schep nieuwe hemelen en een nieuwe aarde; en de vorige dingen zullen niet meer gedacht worden, en zullen in het hart niet opkomen. Maar wees u vrolijk, en verheug u tot in eeuwigheid over hetgeen Ik schep; want zie, Ik schep Jeruzalem een verheuging, en haar volk een vrolijkheid. En Ik zal Mij verheugen over Jeruzalem, en vrolijk zijn over Mijn volk; en in haar zal niet meer gehoord worden de stem van het wenen, noch de stem van het geschreeuw.", "Matt 12:18-21": "Zie, Mijn Knecht, Die Ik uitgekozen heb; Mijn Beminde, in Wie Mijn ziel een welbehagen heeft; Ik zal Mijn Geest op Hem leggen, en Hij zal het oordeel aan de heidenen verkondigen. Hij zal niet twisten, en niet roepen, en niemand zal Zijn stem op de straten horen. Het geknakte riet zal Hij niet breken, en de walmende vlaspit zal Hij niet uitblussen, totdat Hij het oordeel tot overwinning zal uitbrengen.", "Gen 1:27": "En God schiep de mens naar Zijn beeld; naar het beeld van God schiep Hij hem; man en vrouw schiep Hij hen.", "Joh 10:34": "Jezus antwoordde hun: Staat er niet geschreven in uw wet: Ik heb gezegd, u bent goden?", "Joh 13:18": "Ik zeg dit niet van u allen: Ik weet wie Ik uitverkoren heb; maar dit gebeurt, opdat de Schrift vervuld wordt: Die met Mij het brood eet, heeft tegen Mij zijn hiel opgeheven.", "Zef 3:3": "Haar vorsten zijn brullende leeuwen in haar midden; haar rechters zijn avondwolven, die de beenderen niet breken tot aan de morgen.", "Ps 74:21": "Laat de verdrukte niet beschaamd terugkeren; laat de ellendige en de arme Uw Naam prijzen.", "Hebr 1:8": "Maar tot de Zoon zegt Hij: Uw troon, o God, is er in alle eeuwigheid; de scepter van Uw koninkrijk is een rechte scepter.", "Luk 21:5": "En toen sommigen spraken over de tempel, dat hij met mooie stenen en geschenken versierd was, zei Hij:", "Lev 26:12": "En Ik zal in uw midden wandelen, en zal u tot een God zijn, en u zult Mij tot een volk zijn.", "Hand 22:22": "Zij luisterden naar hem tot dit woord toe; en toen verhieven zij hun stem en zeiden: Weg van de aarde met zo iemand, want het is niet behoorlijk dat hij leeft.", "Joh 2:17": "En Zijn discipelen herinnerden zich dat er geschreven is: De ijver voor Uw huis heeft mij verslonden.", "Spr 22:22": "Beroof de arme niet, omdat hij arm is; en verbrijzel de ellendige niet in de poort.", "Micha 3:6": "Daarom zal het nacht voor u worden vanwege het visioen, en u zal duisternis zijn vanwege de waarzegging; en de zon zal over deze profeten ondergaan; en de dag zal over hen zwart worden.", "Ex 2:13": "De volgende dag ging hij er weer op uit, en zie, twee Hebreeuwse mannen waren aan het vechten; en hij zei tegen degene die ongelijk had: Waarom slaat u uw naaste?", "Rom 9:27": "En Jesaja roept over Israël: Al zou het aantal kinderen van Israël zijn als het zand van de zee, toch zal het overblijfsel behouden worden.", "Ps 72:12-14": "Want hij zal de behoeftige redden, die daar roept, alsook de ellendige, en die geen helper heeft. Hij zal de arme en behoeftige verschonen, en de zielen van de behoeftigen verlossen. Hij zal hun zielen van list en geweld bevrijden, en hun bloed zal dierbaar zijn in zijn ogen.", "Ps 112:9": "Pe. Hij strooit uit, hij geeft aan de arme; Tsade. zijn gerechtigheid houdt stand tot in eeuwigheid; Koph. zijn hoorn zal verhoogd worden in eer.", "Jes 8:18": "Zie, ik en de kinderen die de HEERE mij gegeven heeft, zijn tot tekenen en tot wonderen in Israël, van de HEERE van de heerscharen, Die op de berg Sion woont.", "Ps 8:3": "Uit de mond van de kinderen en de zuigelingen hebt U sterkte gegrondvest, omwille van Uw tegenstanders, om de vijand en de wraakgierige te doen ophouden.", "Hebr 4:7": "bepaalt Hij opnieuw een zekere dag, namelijk heden, doordat Hij door David zegt, zo lange tijd daarna (zoals gezegd is): Heden, als u Zijn stem hoort, verhard dan uw harten niet.", "Lev 27:32": "Wat betreft alle tienden van runderen en klein vee, alles wat onder de herdersstaf doorgaat, het tiende zal de HEERE heilig zijn.", "Rom 4:3": "Want wat zegt de Schrift? En Abraham geloofde God, en het is hem gerekend tot rechtvaardigheid.", "Jes 54:13": "En al uw kinderen zullen door de HEERE geleerd zijn, en de vrede van uw kinderen zal groot zijn.", "2 Tim 3:13": "Maar de slechte mensen en bedriegers zullen van kwaad tot erger gaan, zij verleiden en worden verleid.", "Jes 8:17": "Daarom zal ik de HEERE verwachten, Die Zijn aangezicht verbergt voor het huis van Jakob, en ik zal Hem verwachten.", "Jer 23:33": "Wanneer dan dit volk, of een profeet, of priester u zal vragen: Wat is de last van de HEERE? Dan zult u tegen hen zeggen: Wat last? Dat Ik u verlaten zal, spreekt de HEERE.", "Jes 9:18-20": "Vanwege de verbolgenheid van de HEERE van de heerscharen, zal het land verduisterd worden; en het volk zal zijn als een voedsel van het vuur: de een zal de ander niet ontzien. Als hij ter rechterhand snijdt, zal hij toch hongeren, en als hij ter linkerhand eet, zal hij toch niet verzadigd worden; ieder zal het vlees van zijn eigen arm eten; Manasse Efraïm, en Efraïm Manasse, en zij zullen samen tegen Juda zijn. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.", "Num 14:34": "Naar het getal van de dagen waarin u dat land verspied hebt, veertig dagen, elke dag voor elk jaar, zult u uw ongerechtigheden dragen, veertig jaar, en u zult Mijn tegenwerking ervaren.", "Amos 2:12": "Maar u hebt aan de nazireeërs wijn te drinken gegeven, en u hebt de profeten geboden en gezegd: U zult niet profeteren.", "Ps 67:2-8": "God is ons genadig en zegent ons; Hij laat Zijn aangezicht over ons lichten. Sela. Opdat men op de aarde Uw weg kent, onder alle heidenvolken Uw heil. De volken zullen U, o God, loven; de volken, allemaal, zullen U loven.", "Ps 16:8-11": "Ik stel de HEERE voortdurend voor mij, omdat Hij aan mijn rechterhand is, zal ik niet wankelen. Daarom is mijn hart blij, en mijn eer verheugt zich; ook zal mijn lichaam met zekerheid rusten. Want U zult mijn ziel in het graf niet verlaten; U zult niet toelaten dat Uw Heilige de ontbinding ziet.", "Matt 19:18": "Hij zei tegen Hem: Welke? En Jezus zei: Deze: U zult niet doden; u zult geen overspel doen; u zult niet stelen; u zult geen valse getuigenis geven;", "Rom 10:16": "Maar zij zijn niet allen het Evangelie gehoorzaam geweest; want Jesaja zegt: Heere, wie heeft onze prediking geloofd?", "Rom 11:27": "En dit is hun een verbond van Mij, als Ik hun zonden zal wegnemen.", "Jes 11:10": "Want het zal gebeuren op die dag, dat de heidenen zullen vragen naar de Wortel van Isaï, Die zal staan als een banier voor de volken, en Zijn rust zal heerlijk zijn.", "Hand 7:43": "Ja, u hebt de tent van Moloch opgenomen, en de ster van uw god Remfan, de beelden die u gemaakt hebt om die te aanbidden; en Ik zal u wegvoeren tot voorbij Babylon.", "1 Sam 17:34": "Toen zei David tegen Saul: Uw knecht weidde de schapen van zijn vader, en er kwam een leeuw en een beer, en nam een schaap uit de kudde weg.", "Rom 11:7-12": "Wat dan? Wat Israël zoekt, dat heeft het niet verkregen; maar de uitverkorenen hebben het verkregen, en de anderen zijn verhard geworden. (Zoals geschreven is: God heeft hun een geest van diepe slaap gegeven; ogen om niet te zien, en oren om niet te horen) tot op deze huidige dag. En David zegt: Hun tafel moet worden tot een strik, en tot een val, en tot een aanstoot, en tot een vergelding voor hen.", "Luk 4:12": "En Jezus antwoordde en zei tegen hem: Er is gezegd: U zult de Heere, uw God, niet verzoeken.", "Rom 9:7": "Ook zijn zij niet allen kinderen omdat zij nageslacht van Abraham zijn; maar: In Izaak zal uw nageslacht genoemd worden.", "Rom 11:3": "Heere! Zij hebben Uw profeten gedood, en Uw altaren omgeworpen; en ik ben alleen overgebleven en zij zoeken mijn leven.", "Klaagl 3:26": "Teth. Het is goed dat men hoopt, en stil is op het heil van de HEERE.", "Klaagl 4:2": "Beth. De kostbare kinderen van Sion, tegen fijn goud geschat, hoe worden zij nu gelijkgesteld aan de aarden kruiken, het werk van de handen van een pottenbakker!", "Deut 31:29": "Want ik weet dat u na mijn dood zeker helemaal zult verdorven raken, en afwijken van de weg die ik u geboden heb; dan zal dit kwaad u in de laatste dagen overkomen, wanneer u zult hebben gedaan wat kwaad is in de ogen van de HEERE, om Hem door het werk van uw handen tot toorn te verwekken.", "Ps 95:11": "Daarom heb Ik in Mijn toorn gezworen: Zij zullen in Mijn rust niet ingaan!", "Hagg 2:23": "En Ik zal de troon van de koninkrijken omkeren, en de vastigheid van de koninkrijken van de heidenvolken verdelgen; en Ik zal de wagen omkeren, en degenen die daarop rijden; en de paarden, en degenen die daarop rijden, zullen neerstorten, ieder door het zwaard van de ander.", "1 Tim 6:21": "waarmee sommigen, terwijl zij die beleden, van het geloof zijn afgeweken. De genade zij met u. Amen. De eerste brief aan Timotheüs werd geschreven vanuit Laodicea, de voornaamste stad in Frygië Pacatania.", "Jes 53:9": "En men heeft Zijn graf bij de goddelozen gesteld, en Hij is bij de rijke in Zijn dood geweest, omdat Hij geen onrecht gedaan heeft, en er geen bedrog in Zijn mond geweest is.", "Jer 2:3": "Israël was de HEERE een heiligheid, de eerstelingen van Zijn inkomst; allen die hem opaten, werden voor schuldig gehouden; kwaad kwam hun over, spreekt de HEERE.", "Ps 107:36": "En Hij doet de hongerigen daar wonen, en zij stichten een stad om in te wonen;", "Lev 19:13": "U zult uw naaste niet bedriegen of verdrukken, noch beroven; het arbeidsloon van de dagloner zal bij u niet blijven overnachten tot de morgen.", "Ex 20:13-17": "U zult niet doodslaan. U zult geen echtbreuk plegen. U zult niet stelen.", "Jes 45:23": "Ik heb bij Mijzelf gezworen, er is een woord van gerechtigheid uit Mijn mond gegaan, en het zal niet terugkeren: dat voor Mij alle knie zich zal buigen, alle tong Mij zal zweren.", "Spr 3:34": "Zeker, de spotters zal Hij bespotten, maar aan de zachtmoedigen zal Hij genade geven.", "Joh 16:2": "Zij zullen u uit de synagogen werpen; ja, de tijd komt dat ieder die u doodt, zal denken God een dienst te doen.", "1 Kor 10:19": "Wat zeg ik dan? Dat een afgod iets is, of dat een afgodenoffer iets is?", "Ps 140:13": "Ik weet dat de HEERE de rechtszaak van de ellendigen, en het recht van de behoeftigen, zal uitvoeren.", "1 Petr 1:11": "en onderzochten op welke of wat voor tijd de Geest van Christus, Die in hen was, doelde, toen Hij vooraf getuigde van het lijden dat over Christus zou komen, en de heerlijkheid daarna.", "Gal 3:11": "En dat niemand door de wet gerechtvaardigd wordt voor God, is duidelijk; want de rechtvaardige zal uit het geloof leven.", "Rom 9:3-5": "Want ik zou zelf wel wensen verbannen te zijn van Christus, voor mijn broeders, die mijn verwanten zijn naar het vlees; die Israëlieten zijn, van wie de aanneming tot kinderen is, en de heerlijkheid, en de verbonden, en de wetgeving, en de dienst van God, en de beloften; van wie de vaders zijn, en uit wie Christus is, wat het vlees aangaat, Hij Die God is, boven allen te prijzen tot in eeuwigheid. Amen.", "Matt 28:18": "En Jezus kwam bij hen en sprak tot hen: Mij is gegeven alle macht in hemel en op aarde.", "Luk 12:45": "Maar als die dienstknecht in zijn hart zou zeggen: Mijn heer blijft nog lang weg voor hij komt; en zou beginnen de knechten en de dienstmeisjes te slaan, en te eten en te drinken en dronken te worden;", "Ps 46:10": "Die de oorlogen doet ophouden tot aan het einde van de aarde, de boog verbreekt, en de speer in tweeën slaat, de wagens met vuur verbrandt.", "Jes 11:1": "Want er zal een Rijsje voortkomen uit de afgehouwen tronk van Isaï, en een Scheut uit zijn wortels zal vrucht voortbrengen.", "Jes 29:11": "Daarom is voor u elk visioen geworden als de woorden van een verzegeld boek, dat men geeft aan iemand die lezen kan, en zegt: Lees toch dit; en hij zegt: Ik kan niet, want het is verzegeld.", "Matt 15:24": "Maar Hij antwoordde en zei: Ik ben niet gezonden dan naar de verloren schapen van het huis van Israël.", "Jer 7:4": "Vertrouw niet op valse woorden, en zeg niet: De tempel van de HEERE, de tempel van de HEERE, de tempel van de HEERE, zijn deze!", "Micha 5:3": "En Hij zal staan, en zal weiden in de kracht van de HEERE, in de hoogheid van de Naam van de HEERE, Zijn God, en zij zullen wonen, want nu zal Hij groot zijn tot aan de einden van de aarde.", "Matt 22:37": "En Jezus zei tegen hem: U zult de Heere, uw God, liefhebben met heel uw hart, en met heel uw ziel, en met heel uw verstand.", "Zef 3:4": "Haar profeten zijn lichtvaardig, geheel trouweloze mannen; haar priesters verontreinigen het heilige, zij doen de wet geweld aan.", "Matt 2:15": "en hij was daar tot de dood van Herodes; opdat vervuld zou worden wat door de Heere gesproken is door de profeet: Uit Egypte heb Ik Mijn Zoon geroepen.", "Luk 11:42-52": "Maar wee u, Farizeeën, want u geeft tienden van munt en wijnruit en van alle moeskruid, en u gaat voorbij aan het recht en de liefde van God. Dit moest men doen, en het andere niet nalaten. Wee u, Farizeeën, want u houdt van de voorste plaatsen in de synagogen, en van de begroetingen op de markten. Wee u, Schriftgeleerden en Farizeeën, huichelaars, want u bent als de graven die niet zichtbaar zijn, en de mensen die daaroverheen lopen, weten het niet.", "Luk 8:10": "En Hij zei: Aan u is het gegeven de verborgenheden van het Koninkrijk van God te verstaan; maar tot de anderen spreek Ik in gelijkenissen, opdat zij ziende niet zien, en horende niet verstaan.", "Jer 31:15": "Zo zegt de HEERE: Er is een stem gehoord in Rama, een geklaag, een zeer bitter geween; Rachel weent over haar kinderen; zij weigert zich te laten troosten over haar kinderen, omdat zij er niet meer zijn.", "Jes 52:11": "Vertrek, vertrek, ga daarvandaan weg, raak het onreine niet aan; ga weg uit hun midden, reinig u, u die de voorwerpen van de HEERE draagt!", "Jes 8:13": "De HEERE van de heerscharen, Die zult u heiligen, en Hij zij uw vrees, en Hij zij uw verschrikking.", "1 Tim 1:19": "Behoud het geloof en een goed geweten, dat sommigen van zich afgezet hebben en daardoor, wat het geloof betreft, schipbreuk geleden hebben;", "Joh 7:42": "Zegt de Schrift niet dat de Christus zal komen uit het nageslacht van David, en uit het dorp Bethlehem, waar David was?", "Rom 15:11": "En opnieuw: Looft de Heere, alle heidenen, en prijst Hem, alle volken!", "Matt 17:22": "En toen zij in Galilea verbleven, zei Jezus tegen hen: De Zoon des mensen zal worden overgeleverd in de handen van mensen;", "Hos 1:6": "En zij ontving opnieuw, en baarde een dochter; en Hij zei tegen hem: Noem haar naam Lo-Ruchama; want Ik zal Mij voortaan niet meer ontfermen over het huis van Israël, maar Ik zal ze zeker wegvoeren.", "Micha 3:1-3": "Verder zei ik: Hoor nu, hoofden van Jakob, en leiders van het huis van Israël! Betaamt het u niet om het recht te weten? Zij haten het goede, en hebben het kwade lief; zij roven hun huid van hen af, en hun vlees van hun beenderen. Ja, zij zijn het, die het vlees van mijn volk eten, en hun huid afstropen, en hun beenderen verbreken; en uiteen leggen, zoals in een pot, en als vlees in het midden van een ketel.", "Ezech 34:3": "U eet het vette, en bekleedt u met de wol, u slacht het gemeste, maar de schapen weidt u niet.", "Rom 9:12": "werd tot haar gezegd: De oudste zal de jongste dienen.", "Jak 2:8": "Als u dan de koninklijke wet vervult, naar de Schrift: U zult uw naaste liefhebben als uzelf, dan doet u goed;", "Matt 23:35-38": "opdat over u komt al het rechtvaardige bloed dat vergoten is op de aarde, vanaf het bloed van de rechtvaardige Abel tot het bloed van Zacharia, de zoon van Barachia, die u gedood hebt tussen de tempel en het altaar. Voorwaar, Ik zeg u: Al deze dingen zullen komen over dit geslacht. Jeruzalem, Jeruzalem! U die de profeten doodt, en stenigt hen die tot u gezonden zijn! Hoe vaak heb Ik uw kinderen bijeen willen brengen, zoals een hen haar kuikens bijeenbrengt onder de vleugels; en u hebt niet gewild.", "Jer 23:25-39": "Ik heb gehoord wat de profeten zeggen, die in Mijn Naam leugen profeteren, en zeggen: Ik heb gedroomd, ik heb gedroomd. Hoe lang? Is er dan een droom in het hart van de profeten, die de leugen profeteren? Ja, het zijn profeten van de bedriegerij van hun eigen hart. Die daar denken om Mijn volk Mijn Naam te doen vergeten, door hun dromen, die zij, ieder aan zijn naaste, vertellen; net zoals hun vaders Mijn Naam vergeten hebben door Baäl.", "Ef 6:3": "opdat het u goed gaat, en u lang leeft op de aarde.", "Ef 1:3": "Gezegend zij de God en Vader van onze Heere Jezus Christus, Die ons gezegend heeft met alle geestelijke zegening in de hemel in Christus.", "Jes 40:9-11": "O Sion, u die goede boodschap verkondigt, klim op een hoge berg; o Jeruzalem, u die goede boodschap verkondigt, hef uw stem op met macht, hef ze op, vrees niet, zeg tegen de steden van Juda: Zie, hier is uw God! Ziet, de Heere HEERE zal komen tegen de sterke, en Zijn arm zal heersen; ziet, Zijn loon is bij Hem, en Zijn arbeidsloon is voor Zijn aangezicht. Hij zal Zijn kudde weiden gelijk een herder; Hij zal de lammeren in Zijn armen bijeenbrengen, en in Zijn schoot dragen; de zogende dieren zal Hij zachtjes leiden.", "Jak 2:6": "Maar u hebt de arme oneer aangedaan. Onderdrukken de rijken u niet, en trekken zij u niet voor de rechterstoelen?", "Joh 12:40": "Hij heeft hun ogen verblind, en hun hart verhard; opdat zij met de ogen niet zien, en met het hart niet verstaan, en zij zich bekeren, en Ik hen genees.", "Ps 82:6": "Ik heb wel gezegd: U bent goden; en u bent allen kinderen van de Allerhoogste;", "Ps 10:7": "Zijn mond is vol vloek, bedrog en list; onder zijn tong is moeite en onrecht.", "1 Kor 15:32": "Als ik, naar de mens gesproken, tegen wilde dieren gevochten heb in Efeze, wat baat het mij, als de doden niet opgewekt worden? Laten wij eten en drinken, want morgen sterven wij.", "1 Petr 2:7": "Voor u dan, die gelooft, is Hij kostbaar; maar voor de ongehoorzamen geldt: de Steen die de bouwers verworpen hebben, Die is geworden tot een hoeksteen,", "Matt 21:9": "En de menigten die voor Hem uit gingen en die volgden, riepen: Hosanna, de Zoon van David! Gezegend is Hij Die komt in de Naam van de Heere! Hosanna in de hoogste hemelen!", "Spr 18:4": "De woorden uit de mond van een man zijn diepe wateren; en de bron van wijsheid is een stromende beek.", "Gal 3:16": "Nu zijn de beloften gesproken tot Abraham en zijn nageslacht. Hij zegt niet: En aan de nageslachten, alsof het over velen ging; maar alsof het over één ging: En uw nageslacht; dat is Christus.", "Mark 12:36": "Want David zelf heeft door de Heilige Geest gezegd: De Heere heeft gezegd tegen mijn Heere: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gemaakt heb.", "2 Kor 13:1": "Dit is de derde keer dat ik naar u toe kom; op grond van de verklaring van twee of drie getuigen zal elk woord vaststaan.", "Luk 7:31": "En de Heere zei: Waarmee zal Ik dan de mensen van dit geslacht vergelijken, en waaraan zijn zij gelijk?", "Jer 6:13": "Want van hun kleinste aan tot hun grootste toe pleegt ieder van hen gierigheid, en van de profeet aan tot de priester toe bedrijft ieder van hen valsheid.", "Joh 15:25": "Maar dit gebeurt, zodat het woord vervuld wordt dat in hun wet geschreven is: Zij hebben Mij zonder oorzaak gehaat.", "Hebr 11:18": "(tegen wie gezegd was: In Izak zal uw nageslacht genoemd worden),", "2 Tess 3:14": "Maar als iemand ons woord, geschreven door deze brief, niet gehoorzaam is, tekent hem aan; en ga niet met hem om, opdat hij beschaamd wordt;", "Jer 15:2": "En het zal gebeuren, wanneer zij tegen u zullen zeggen: Waarheen zullen wij weggaan? dat u tegen hen zult zeggen: Zo zegt de HEERE: Wie voor de dood bestemd is, ten dode; en wie voor het zwaard, ten zwaarde; en wie voor de honger, ten honger; en wie voor de gevangenschap, ter gevangenschap!", "Gen 21:10": "En zij zei tegen Abraham: Jaag deze slavin en haar zoon weg; want de zoon van deze slavin zal niet erven met mijn zoon, met Izak.", "Luk 12:50": "Maar Ik moet met een doop gedoopt worden; en hoe beklemd voel Ik Mij, totdat het volbracht is!", "Hos 6:9": "Zoals de benden van straatrovers op iemand wachten, zo is het gezelschap van de priesters; zij moorden op de weg naar Sichem, waarlijk, zij doen schandelijke daden.", "1 Sam 2:30": "Daarom spreekt de HEERE, de God van Israël: Ik had wel duidelijk gezegd: Uw huis en het huis van uw vader zouden voor Mijn aangezicht wandelen tot in eeuwigheid; maar nu spreekt de HEERE: Dat zij verre van Mij; want die Mij eren, zal Ik eren, maar die Mij versmaden, zullen licht geacht worden.", "Zef 3:11": "Op die dag zult u niet beschaamd zijn vanwege al uw handelingen, waarmee u tegen Mij overtreden hebt; want dan zal Ik uit uw midden wegnemen wie van vreugde opspringen over uw hoogmoed, en u zult zich voortaan niet meer verheffen om Mijn heilige berg.", "Ef 2:13-16": "Maar nu bent u, die eertijds ver weg was, in Christus Jezus nabij gekomen door het bloed van Christus. Want Hij is onze vrede, Die deze beiden één gemaakt heeft, en de scheidsmuur die tussen ons in stond, afgebroken heeft, doordat Hij de vijandschap in Zijn vlees teniet gemaakt heeft, namelijk de wet van de geboden die in inzettingen bestond; opdat Hij die twee in Zichzelf tot één nieuwe mens zou scheppen, en zo vrede zou maken;", "Hebr 2:12": "En Hij zegt: Ik zal Uw naam aan Mijn broeders verkondigen; in het midden van de Gemeente zal Ik U lofzingen.", "1 Petr 2:6": "Daarom staat er ook in de Schrift: Zie, Ik leg in Sion een uitverkoren, kostbare hoeksteen; en wie in Hem gelooft, zal niet beschaamd worden.", "Gal 5:15": "Maar als u elkaar bijt en verslindt, kijk dan uit dat u niet door elkaar verteerd wordt.", "Jer 3:14-19": "Bekeer u, afkerige kinderen! spreekt de HEERE, want Ik heb u getrouwd, en Ik zal u aannemen, één uit een stad, en twee uit een geslacht, en Ik zal u naar Sion brengen. En Ik zal u herders geven naar Mijn hart; die zullen u weiden met kennis en verstand. En het zal gebeuren, wanneer u meer geworden en vruchtbaar geworden bent in het land, in die dagen, spreekt de HEERE, dat zij niet meer zullen zeggen: De ark van het verbond van de HEERE, en zij zal ook niet in het hart opkomen; en zij zullen er niet aan denken, en haar niet bezoeken, en zij zal niet opnieuw gemaakt worden.", "Matt 21:43": "Daarom zeg Ik u, dat het Koninkrijk van God van u zal worden weggenomen, en gegeven aan een volk dat de vruchten ervan voortbrengt.", "Jes 59:20": "En er zal een Verlosser tot Sion komen, namelijk voor hen die zich bekeren van de overtreding in Jakob, spreekt de HEERE.", "Fil 1:16": "Dezen verkondigen Christus wel uit eigenbelang, niet zuiver, en menen aan mijn banden verdrukking toe te brengen;", "Luk 22:30": "opdat u eet en drinkt aan Mijn tafel in Mijn Koninkrijk, en zit op tronen, en de twaalf stammen van Israël oordeelt.", "Ps 12:6": "Om de verwoesting van de ellendigen, om het kermen van de behoeftigen, zal Ik nu opstaan, zegt de HEERE; Ik zal in veiligheid zetten wie ernaar snakt.", "Rom 9:9": "Want dit is het woord van de belofte: Rond deze tijd zal Ik komen, en Sara zal een zoon hebben.", "2 Tim 4:3": "Want er zal een tijd komen dat zij de gezonde leer niet zullen verdragen, maar doordat hun oren jeuken, zullen zij zich naar hun eigen begeerten leraars in menigte bijeenzoeken;", "Ezech 34:4": "De zwakke sterkt u niet, en het zieke heelt u niet, en het gebrokene verbindt u niet, en het weggedrevene brengt u niet terug, en het verlorene zoekt u niet; maar u heerst over hen met strengheid en met hardheid.", "Ps 9:19": "Want de nooddruftige zal niet voor altoos vergeten worden, noch de verwachting van de ellendigen in eeuwigheid verloren zijn.", "Mark 12:19": "Meester, Mozes heeft ons geschreven: Als iemands broer sterft, en een vrouw achterlaat, en geen kinderen nalaat, dat zijn broer diens vrouw moet nemen en voor zijn broer nageslacht moet verwekken.", "Jes 29:10": "Want de HEERE heeft over u uitgegoten een geest van diepe slaap, en Hij heeft uw ogen dichtgesloten; de profeten, en uw hoofden, en de zieners heeft Hij verblind.", "Jes 53:4-6": "Waarlijk, Hij heeft onze ziekten op Zich genomen, en onze smarten heeft Hij gedragen; maar wij hielden Hem voor een geplaagde, door God geslagen en verdrukt. Maar Hij is om onze overtredingen verwond, om onze ongerechtigheden is Hij verbrijzeld; de straf die ons de vrede aanbrengt, was op Hem, en door Zijn striemen is er voor ons genezing gekomen. Wij dwaalden allen als schapen, wij keerden ons ieder naar zijn eigen weg; maar de HEERE heeft de ongerechtigheid van ons allen op Hem doen neerkomen.", "Hand 7:42": "En God keerde Zich af, en gaf hen over om het leger van de hemel te dienen, zoals geschreven staat in het boek van de profeten: Hebt u soms slachtoffers en offers aan Mij gebracht, veertig jaar lang in de woestijn, huis van Israël?", "Rom 12:19": "Wreek uzelf niet, geliefden, maar geef de toorn plaats; want er is geschreven: Mij komt de wraak toe; Ik zal het vergelden, zegt de Heere.", "2 Kor 11:1-31": "Och, of u mij een weinig verdroeg in de onwijsheid; ja, verdraag mij ook! Want ik ben ijverig over u met een ijver van God; want ik heb u toebereid om u als een reine maagd aan één man voor te stellen, namelijk aan Christus. Doch ik vrees dat, zoals de slang Eva door haar arglistigheid bedrogen heeft, zo ook uw gedachten op enigerlei wijze bedorven worden, om af te wijken van de eenvoudigheid die in Christus is.", "1 Sam 4:21": "En zij noemde de jongen Ikabod, en zei: De eer is weggevoerd uit Israël! Omdat de ark van God gevankelijk was weggevoerd, en vanwege haar schoonvader en haar man.", "Rom 4:7": "En zei: Gelukkig zijn zij wier ongerechtigheden vergeven zijn, en wier zonden bedekt zijn;", "Hebr 13:6": "Zodat wij vrijmoedig durven zeggen: De Heere is mij een Helper, en ik zal niet vrezen wat een mens mij zal doen.", "Lev 19:2": "Spreek tot de hele vergadering van de kinderen van Israël, en zeg tegen hen: U zult heilig zijn, want Ik, de HEERE, uw God, ben heilig!", "Hebr 1:10-12": "En: U, Heere! hebt in het begin de aarde gegrond, en de hemelen zijn werken van Uw handen; Die zullen vergaan, maar U blijft altijd, en zij zullen allemaal verouderen als een kleed; En als een dekkleed zult U ze oprollen, en zij zullen veranderd worden; maar U bent Dezelfde, en Uw jaren zullen niet ophouden.", "Ps 110:4": "De HEERE heeft gezworen, en het zal Hem niet berouwen: U bent Priester in eeuwigheid, naar de ordening van Melchizedek.", "Jes 49:5": "En nu zegt de HEERE, Die Mij van moeders buik af tot een Knecht gevormd heeft, dat Ik Jakob tot Hem terugbrengen zou; maar Israël zal zich niet laten verzamelen; toch zal Ik verheerlijkt worden in de ogen van de HEERE, en Mijn God zal Mijn Sterkte zijn.", "2 Kron 30:4": "En deze zaak was goed in de ogen van de koning, en in de ogen van de hele gemeente.", "Ps 72:16": "Is er een handvol koren in het land op de hoogte van de bergen, de vrucht daarvan zal ruisen als de Libanon; en die van de stad zullen bloeien als het kruid van de aarde.", "Gal 3:8": "En de Schrift, die van tevoren zag dat God de heidenen uit het geloof zou rechtvaardigen, heeft van tevoren aan Abraham het Evangelie verkondigd, en zei: In u zullen alle volken gezegend worden.", "Jes 55:3": "Neig uw oor, en kom tot Mij, hoor en uw ziel zal leven; want Ik zal met u een eeuwig verbond maken, en u geven de zekere weldaden van David.", "Rom 15:12": "En opnieuw zegt Jesaja: Er zal de wortel van Isaï zijn, en Die opstaat om over de heidenen te heersen; op Hem zullen de heidenen hopen.", "1 Kon 19:18": "Ook heb Ik in Israël zevenduizend laten overblijven, alle knieën die zich niet voor Baäl gebogen hebben, en alle monden die hem niet gekust hebben.", "Jes 64:4": "Ja, van oudsher heeft men het niet gehoord, ook niet met de oren opgemerkt, en geen oog heeft het gezien, behalve U, o God! wat Hij doen zal aan hem, die op Hem wacht.", "Ezech 34:23": "En Ik zal één Herder over hen doen opstaan, en Hij zal hen weiden, namelijk Mijn knecht David; die zal ze weiden, en Die zal hun tot een Herder zijn.", "Jes 10:34": "En Hij zal met ijzer de verwarde struiken van het woud omhouwen; en de Libanon zal vallen door de Heerlijke.", "Job 5:13": "Hij vangt de wijzen in hun arglistigheid; zodat de raad van de verdraaiden overhaast valt.", "1 Kor 14:21": "In de wet is geschreven: Ik zal door lieden van andere talen, en door andere lippen tot dit volk spreken, en toch zullen zij Mij ook zo niet horen, zegt de Heere.", "Ps 94:11": "De HEERE kent de gedachten van de mens, dat zij vluchtig zijn.", "Ex 13:2": "Heilig voor Mij alle eerstgeborenen; wat er ook onder de kinderen van Israël de baarmoeder opent, van mensen en van dieren, dat is Mijn eigendom.", "Rom 3:4": "Dat zij verre. Maar God is waarachtig, en ieder mens leugenachtig; zoals geschreven is: Opdat U gerechtvaardigd wordt in Uw woorden, en overwint, wanneer U oordeelt.", "Ps 78:9": "(De kinderen van Efraïm, gewapende boogschutters, keerden om ten dage van het strijd.)", "Ezech 5:10": "Daarom zullen de vaders de kinderen eten in het midden van u, en de kinderen zullen hun vaders eten; en Ik zal gerichten onder u oefenen, en al uw overblijfsel zal Ik naar alle windrichtingen verstrooien.", "Luk 2:35": "(En ook een zwaard zal door uw eigen ziel gaan) opdat de gedachten uit veel harten geopenbaard worden.", "Hos 4:6": "Mijn volk is uitgeroeid, omdat het zonder kennis is; omdat u de kennis verworpen hebt, heb Ik u ook verworpen, zodat u Mij het priesterambt niet zult bedienen; omdat u de wet van uw God vergeten hebt, zal Ik ook uw kinderen vergeten.", "Klaagl 3:52": "Tsade. Zij die mijn vijanden zijn zonder oorzaak, hebben mij als een vogeltje dapper gejaagd.", "Matt 18:33-35": "had u zich dan ook niet moeten ontfermen over uw mededienstknecht, zoals ik mij over u ontfermd heb? En zijn heer werd toornig en leverde hem over aan de pijnigers, totdat hij alles zou betaald hebben wat hij hem schuldig was. Zo zal ook Mijn hemelse Vader met u doen, als u niet ieder van harte uw broeder zijn misdaden vergeeft.", "Ps 107:9": "Want Hij heeft de dorstige ziel verzadigd, en de hongerige ziel met goeds vervuld;", "Ps 2:1": "Waarom woeden de heidenen, en bedenken de volken iets zinloos?", "2 Tess 3:15": "En houd hem niet als een vijand, maar vermaan hem als een broeder.", "Joh 12:15": "Vrees niet, dochter van Sion, zie, uw Koning komt, zittend op het veulen van een ezelin.", "Rom 9:13": "Zoals geschreven is: Jakob heb Ik liefgehad, en Ezau heb Ik gehaat.", "Jer 23:39": "Daarom, zie, Ik zal u ook helemaal vergeten, en u, alsook de stad die Ik u en uw vaderen gegeven heb, van Mijn aangezicht wegdoen.", "Jes 56:11": "En deze honden zijn sterk van begeerte, zij kunnen niet verzadigd worden, ja, het zijn herders die niets kunnen begrijpen; zij keren zich allemaal naar hun eigen weg, ieder naar zijn eigen winst, elk uit zijn eigen hoek.", "Ezech 34:1-31": "En het woord van de HEERE gebeurde tot mij, en Hij zei: Mensenkind! Profeteer tegen de herders van Israël; profeteer en zeg tot hen, tot de herders: Zo zegt de Heere HEERE: Wee de herders van Israël, die zichzelf weiden! Zullen niet de herders de schapen weiden? U eet het vette, en bekleedt u met de wol, u slacht het gemeste, maar de schapen weidt u niet.", "Matt 16:28": "Voorwaar, Ik zeg u: Er zijn sommigen van hen die hier staan, die de dood niet zullen smaken, totdat zij de Zoon des mensen zullen hebben zien komen in Zijn Koninkrijk.", "Jer 7:11-14": "Is dan dit huis, dat naar Mijn Naam genoemd is, in uw ogen een schuilplaats van rovers? Zie, Ik heb het ook gezien, spreekt de HEERE. Want ga nu naar Mijn plaats die te Silo was, waar Ik Mijn Naam in het begin had laten wonen; en zie wat Ik daaraan gedaan heb vanwege de slechtheid van Mijn volk Israël. En nu, omdat u al deze werken doet, spreekt de HEERE, en Ik tot u gesproken heb, vroeg opgestaan en gesproken, maar u niet gehoord hebt, en Ik u geroepen heb, maar u niet geantwoord hebt;", "Ex 20:12-16": "Eer uw vader en uw moeder, opdat uw dagen verlengd worden in het land dat de HEERE, uw God, u geeft. U zult niet doodslaan. U zult geen echtbreuk plegen.", "Mark 10:32-34": "En zij waren onderweg, op weg naar Jeruzalem; en Jezus liep voor hen uit; en zij waren verbaasd, en terwijl zij Hem volgden, waren zij bang. En Hij nam de twaalf weer apart, en begon hun te vertellen wat Hem zou overkomen; En Hij zei: Zie, wij gaan op naar Jeruzalem, en de Zoon des mensen zal aan de overpriesters, en aan de Schriftgeleerden overgeleverd worden, en zij zullen Hem ter dood veroordelen, en Hem aan de heidenen overleveren; en zij zullen Hem bespotten, en Hem geselen, en Hem bespuwen, en Hem doden; en op de derde dag zal Hij weer opstaan.", "Matt 11:14": "En als u het wilt aannemen, hij is Elia, die komen zou.", "Zach 8:16": "Dit zijn de dingen die u doen zult: spreek de waarheid, ieder met zijn naaste; oordeel de waarheid en een oordeel van vrede in uw poorten.", "Jer 8:10": "Daarom zal Ik hun vrouwen aan anderen geven, hun akkers aan andere bezitters; want van de kleinste tot de grootste toe pleegt ieder van hen gierigheid; van de profeet tot de priester toe bedrijft ieder van hen valsheid.", "Hand 13:48": "Toen de heidenen dit hoorden, verblijdden zij zich, en prezen het Woord van de Heere; en er geloofden zovelen als er bestemd waren tot het eeuwige leven.", "Luk 4:4": "En Jezus antwoordde hem: Er is geschreven dat de mens niet van brood alleen zal leven, maar van elk woord van God.", "Luk 22:21-23": "Maar zie, de hand van hem die Mij verraadt, is met Mij aan de tafel. En de Zoon des mensen gaat wel heen, zoals besloten is; maar wee die mens, door wie Hij verraden wordt! En zij begonnen elkaar te vragen wie van hen het toch zou zijn, die dat zou doen.", "1 Kor 15:45": "Zo staat er ook geschreven: De eerste mens Adam is geworden tot een levende ziel; de laatste Adam tot een levendmakende Geest.", "Jer 32:9": "Dus kocht ik van Hanameel, de zoon van mijn oom, het veld dat bij Anathoth is; en ik woog hem het geld toe, zeventien zilveren sikkels.", "2 Petr 2:1-22": "Maar er zijn ook valse profeten onder het volk geweest, zoals er ook onder u valse leraars zullen zijn, die verderfelijke ketterijen in het geheim zullen invoeren, en zelfs de Heere, Die hen gekocht heeft, verloochenen, en zo een snel verderf over zichzelf brengen; En velen zullen hun verderfelijke wegen navolgen, waardoor de weg van de waarheid belasterd zal worden. En zij zullen door hebzucht, met gemaakte woorden, van u een koopwaar maken; over hen is het oordeel van lang geleden niet werkeloos, en hun verderf sluimert niet.", "Ps 68:11": "Uw kudde woonde daarin; U bereidde het door Uw goedheid voor de ellendige, o God!", "Ps 118:22": "De steen, die de bouwlieden verworpen hadden, is tot een hoofd van de hoek geworden.", "Matt 24:10": "En dan zullen er velen ten val komen, en zullen elkaar overleveren, en elkaar haten.", "Neh 5:8": "En ik zei tegen hen: Wij hebben onze broeders, de Joden, die aan de heidenen verkocht waren, naar ons vermogen teruggekocht; en zouden u ook uw broeders verkopen, of zouden zij aan ons verkocht worden? Toen zwegen zij en vonden geen antwoord.", "1 Petr 2:9": "Maar u bent een uitverkoren geslacht, een koninklijk priesterschap, een heilig volk, een volk dat God Zich verworven heeft; opdat u de deugden zou verkondigen van Hem Die u uit de duisternis geroepen heeft tot Zijn wonderbaar licht;", "Lev 26:44": "En hierboven is dit ook: als zij in het land van hun vijanden zullen zijn, zal Ik hen niet verwerpen, en ook niet van hen walgen, om een einde aan hen te maken en Mijn verbond met hen te vernietigen; want Ik ben de HEERE, hun God!", "Matt 11:10": "Want deze is het, van wie geschreven staat: Zie, Ik zend Mijn engel voor Uw aangezicht, die Uw weg bereiden zal voor U heen.", "Gen 49:10": "De scepter zal van Juda niet wijken, evenmin de wetgever van tussen zijn voeten, totdat Silo komt, en Hem zullen de volken gehoorzaam zijn.", "Matt 1:23": "Zie, de maagd zal zwanger worden en een Zoon baren, en u zult Hem de naam Emmanuel geven; dat betekent, vertaald: God met ons.", "Matt 10:21": "En de ene broer zal de andere broer overleveren tot de dood, en de vader het kind, en de kinderen zullen opstaan tegen de ouders, en hen doden.", "Luk 2:25": "En zie, er was een mens in Jeruzalem, wiens naam was Simeon; en deze mens was rechtvaardig en godvrezend, en verwachtte de vertroosting van Israël, en de Heilige Geest was op hem.", "Gen 15:13": "Toen zei Hij tegen Abram: Weet voorzeker dat uw nageslacht vreemdeling zal zijn in een land dat niet van hen is, en zij zullen hen dienen, en zij zullen hen verdrukken, vierhonderd jaar.", "Matt 25:40": "En de Koning zal antwoorden en tegen hen zeggen: Voorwaar, Ik zeg u: Voor zoveel u dit voor één van deze Mijn minste broeders gedaan hebt, hebt u dat Mij gedaan.", "Hand 23:5": "En Paulus zei: Ik wist niet, broeders, dat hij de hogepriester was; want er is geschreven: De leider van uw volk zult u niet vervloeken.", "Luk 2:24": "En om een offer te geven, naar wat in de wet van de Heere gezegd is, een paar tortelduiven of twee jonge duiven.", "Matt 27:48": "En meteen liep een van hen toe, nam een spons, vulde die met azijn, stak ze op een rietstok, en gaf Hem te drinken.", "Jes 9:14": "(De oude en aanzienlijke, die is de kop; maar de profeet die valsheid leert, die is de staart.)", "Ezech 22:25": "De samenzwering van haar profeten heerst in haar midden als een brullende leeuw die een prooi rooft; zij eten de zielen op, de schat en het kostbare nemen zij weg; haar weduwen vermenigvuldigen zij in haar midden.", "Gen 22:18": "En in uw nageslacht zullen alle volken van de aarde gezegend worden, omdat u Mijn stem gehoorzaam bent geweest.", "Jer 50:7": "Allen die hen vonden, aten hen op, en hun tegenstanders zeiden: Wij zullen geen schuld hebben; omdat zij gezondigd hebben tegen de HEERE, in de woning van de gerechtigheid, ja, tegen de HEERE, de Verwachting van hun vaderen.", "Hos 10:8": "En de hoogten van Aven, Israëls zonde, zullen vernietigd worden; doorns en distels zullen op hun altaren opkomen; en zij zullen tegen de bergen zeggen: Bedek ons! en tegen de heuvels: Val op ons!", "Deut 30:12-14": "Het is niet in de hemel, om te zeggen: Wie zal voor ons naar de hemel gaan, dat hij het voor ons haalt, en het ons laat horen, dat wij het doen? Het is ook niet aan de andere kant van de zee, om te zeggen: Wie zal voor ons oversteken naar de andere kant van de zee, dat hij het voor ons haalt, en het ons laat horen, dat wij het doen? Want dit woord is heel dichtbij u, in uw mond, en in uw hart, om dat te doen.", "Ex 32:6": "En zij stonden de volgende dag vroeg op, en offerden brandoffers en brachten dankoffers; en het volk zat neer om te eten en te drinken, daarna stonden zij op om te spelen.", "Ps 24:1": "Een psalm van David. De aarde is van de HEERE, alsook haar volheid, de wereld, en zij die daarin wonen.", "Joh 13:18-26": "Ik zeg dit niet van u allen: Ik weet wie Ik uitverkoren heb; maar dit gebeurt, opdat de Schrift vervuld wordt: Die met Mij het brood eet, heeft tegen Mij zijn hiel opgeheven. Van nu af zeg Ik het u, voordat het gebeurd is, opdat u, wanneer het gebeurd zal zijn, kunt geloven dat Ik het ben. Voorwaar, voorwaar, Ik zeg u: Als Ik iemand zend, wie hem ontvangt, die ontvangt Mij, en wie Mij ontvangt, die ontvangt Hem Die Mij gezonden heeft.", "Jes 59:21": "Wat Mij aangaat, dit is Mijn Verbond met hen, zegt de HEERE: Mijn Geest, Die op u is, en Mijn woorden, die Ik in uw mond gelegd heb, die zullen van uw mond niet wijken, ook niet van de mond van uw zaad, ook niet van de mond van het zaad van uw zaad, zegt de HEERE, van nu af tot in eeuwigheid toe.", "1 Kor 9:9": "Want in de wet van Mozes staat geschreven: U zult een dorsende os niet muilbanden. Zorgt God soms voor de ossen?", "Amos 8:8": "Zou het land hierover niet beroerd worden, en zou niet ieder die daarin woont treuren? Ja, het zal helemaal oprijzen als een rivier, en het zal heen en weer gedreven en overstroomd worden, zoals door de rivier van Egypte.", "Mark 14:10": "En Judas Iskariot, een van de twaalf, ging naar de overpriesters, om Hem aan hen over te leveren.", "Hand 4:26": "De koningen van de aarde zijn samen opgestaan, en de leiders zijn bijeengebracht tegen de Heere, en tegen Zijn Gezalfde.", "Mark 15:28": "En de Schrift is vervuld die zegt: En Hij is met de misdadigers gerekend.", "Matt 4:10": "Toen zei Jezus tegen hem: Ga weg, satan, want er staat geschreven: De Heere, uw God, zult u aanbidden, en Hem alleen dienen.", "Hos 9:15": "Al hun slechtheid is in Gilgal, want daar heb Ik ze gehaat, om de slechtheid van hun daden; Ik zal ze uit Mijn huis verdrijven, Ik zal ze voortaan niet meer liefhebben; al hun vorsten zijn afvalligen.", "Ezech 30:22-24": "Daarom zegt de Heere HEERE zo: Zie, Ik keer Mij tegen Farao, de koning van Egypte, en zal zijn armen breken, zowel de sterke als de gebroken arm; en Ik zal het zwaard uit zijn hand doen vallen. En Ik zal de Egyptenaars verstrooien onder de heidenvolken, en zal hen verspreiden in de landen. En Ik zal de armen van de koning van Babel sterken, en Mijn zwaard in zijn hand geven; maar Farao's armen zal Ik breken, zodat hij voor zijn aangezicht zal kermen, zoals een dodelijk gewonde kermt.", "Jes 26:8": "Wij hebben ook op de weg van Uw oordelen, U, o HEERE, verwacht; naar Uw Naam en naar Uw gedachtenis gaat het verlangen van onze ziel uit.", "Klaagl 4:14": "Nun. Zij zwierven als blinden op de straten, zij waren met bloed besmet, zodat men niet kon zien of men hun kleren aanraakte.", "Matt 13:10": "En de discipelen kwamen naar Hem toe en zeiden tegen Hem: Waarom spreekt U tot hen door gelijkenissen?", "Jes 40:3": "Een stem van iemand die roept in de woestijn: Bereidt de weg van de HEERE, maakt recht in de wildernis een baan voor onze God!", "2 Kor 10:17": "Maar wie roemt, laat die roemen in de Heere.", "Rom 3:15-17": "hun voeten zijn snel om bloed te vergieten; vernieling en ellende is op hun wegen; en de weg van de vrede hebben zij niet gekend.", "Jer 6:14": "En zij genezen de breuk van de dochter van Mijn volk op het lichtste, en zeggen: Vrede, vrede! Doch daar is geen vrede.", "Matt 8:17": "opdat vervuld zou worden wat gesproken was door de profeet Jesaja, die zei: Hij heeft onze ziekten op Zich genomen, en onze kwalen gedragen.", "Jer 31:33": "Maar dit is het verbond dat Ik na die dagen met het huis van Israël sluiten zal, spreekt de HEERE: Ik zal Mijn wet in hun binnenste geven, en zal die in hun hart schrijven; en Ik zal hun tot een God zijn, en zij zullen Mij tot een volk zijn.", "Jes 52:5": "En nu, wat heb Ik hier te doen? spreekt de HEERE, omdat Mijn volk voor niets is weggenomen, en degenen die over hen heersen, hen laten huilen, spreekt de HEERE, en Mijn Naam voortdurend de hele dag gelasterd wordt;", "Jes 55:1-13": "O, alle dorstigen, kom tot de wateren, en u die geen geld heeft, kom, koop en eet, ja kom, koop zonder geld en zonder prijs, wijn en melk! Waarom weegt u geld uit voor wat geen brood is, en uw arbeid voor wat niet verzadigen kan? Hoor aandachtig naar Mij, en eet het goede, en laat uw ziel zich verlustigen in vettigheid. Neig uw oor, en kom tot Mij, hoor en uw ziel zal leven; want Ik zal met u een eeuwig verbond maken, en u geven de zekere weldaden van David.", "Hand 2:25-28": "Want David zegt van Hem: Ik zag de Heere altijd voor mij; want Hij is aan mijn rechterhand, opdat ik niet bewogen zou worden. Daarom is mijn hart verblijd, en mijn tong verheugt zich; ja, ook mijn vlees zal rusten in hoop; Want U zult mijn ziel niet verlaten in het rijk van de dood, en Uw Heilige zult U niet overgeven om verderving te zien.", "Jer 7:11": "Is dan dit huis, dat naar Mijn Naam genoemd is, in uw ogen een schuilplaats van rovers? Zie, Ik heb het ook gezien, spreekt de HEERE.", "Jes 52:7": "Hoe lieflijk zijn op de bergen de voeten van hem die het goede nieuws brengt, die de vrede laat horen; van hem die goed nieuws brengt van het goede, die heil laat horen; van hem die tegen Sion zegt: Uw God is Koning.", "Ezech 19:3-6": "Zij trok een van haar welpen groot; het werd een jonge leeuw, die leerde roof te roven, hij at mensen op. Dit hoorden de volken van hem, hij werd gegrepen in hun kuil; en zij brachten hem met haken naar Egypteland. Toen zij nu zag dat zij tevergeefs gehoopt had en haar verwachting verloren was, nam zij een ander van haar welpen, en maakte daarvan een jonge leeuw.", "Mark 12:30": "En u zult de Heere, uw God, liefhebben uit heel uw hart, en uit heel uw ziel, en uit heel uw verstand, en uit heel uw kracht. Dit is het eerste gebod.", "Openb 2:12": "En schrijf aan de engel van de gemeente die in Pergamus is: Dit zegt Hij, Die het tweesnijdend scherpe zwaard heeft:", "Matt 23:3": "daarom, alles wat zij u zeggen dat u houden moet, houd dat en doe het; maar doe niet naar hun werken, want zij zeggen het, en doen het niet.", "Hebr 12:5": "En u bent de vermaning vergeten, die tot u spreekt als tot zonen: Mijn zoon, acht de kastijding van de Heere niet klein, en bezwijk niet als u door Hem bestraft wordt;", "1 Petr 3:10-12": "Want wie het leven wil liefhebben en goede dagen wil zien, die moet zijn tong weerhouden van het kwade, en zijn lippen, zodat ze geen bedrog spreken; hij moet wijken van het kwade en het goede doen; hij moet vrede zoeken en die najagen. Want de ogen van de Heere zijn over de rechtvaardigen, en Zijn oren gericht op hun gebed; maar het aangezicht van de Heere is tegen hen die kwaad doen.", "1 Tim 4:1-3": "De Geest zegt uitdrukkelijk dat in de laatste tijden sommigen zullen afvallen van het geloof, doordat zij zich gaan richten op verleidende geesten en leringen van demonen, door de huichelarij van leugensprekers, die hun eigen geweten als met een brandijzer hebben dichtgeschroeid; die verbieden te trouwen, en gebieden dat men zich onthoudt van voedsel dat God geschapen heeft om met dankzegging genuttigd te worden door de gelovigen, die de waarheid hebben leren kennen.", "Pred 5:7": "Als u de onderdrukking van de arme, en de beroving van het recht en de gerechtigheid ziet in een landstreek, verwonder u dan niet over zo'n gang van zaken; want wie hoger is dan de hoge, let daarop; en er zijn hogeren boven hen.", "Hand 7:7": "En het volk dat zij zullen dienen, zal Ik oordelen, zei God; en daarna zullen zij uitgaan, en zij zullen Mij dienen op deze plaats.", "Hand 3:23": "En het zal gebeuren dat iedere ziel die niet naar deze Profeet zal hebben geluisterd, uitgeroeid zal worden uit het volk.", "Deut 32:35": "Aan Mij is de wraak en de vergelding, op de tijd dat hun voet zal wankelen; want de dag van hun ondergang is nabij, en de dingen die hun zullen gebeuren, haasten zich.", "Jes 6:9": "Toen zei Hij: Ga heen, en zeg tegen dit volk: Blijf horen, maar begrijp het niet, en blijf zien, maar merk het niet op.", "Joh 10:13": "En de huurling vlucht, omdat hij een huurling is, en hij bekommert zich niet om de schapen.", "Mark 4:12": "opdat zij ziende zien, en niet opmerken; en horende horen, en niet verstaan; opdat zij zich niet op enig moment bekeren en hun de zonden vergeven worden.", "Zach 13:2-5": "En het zal op die dag gebeuren, spreekt de HEERE van de heerscharen, dat Ik de namen van de afgoden uit het land zal uitroeien, zodat er niet meer aan gedacht wordt; en ook de profeten en de onreine geest zal Ik uit het land wegdoen. En het zal gebeuren, wanneer iemand nog profeteert, dat zijn vader en zijn moeder, die hem verwekt hebben, tegen hem zullen zeggen: U zult niet leven, omdat u leugens gesproken hebt in de Naam van de HEERE; en zijn vader en zijn moeder, die hem verwekt hebben, zullen hem doorsteken, wanneer hij profeteert. En het zal op die dag gebeuren, dat die profeten beschaamd zullen worden, ieder vanwege zijn visioen, wanneer hij profeteert; en zij zullen geen haren mantel aandoen om te liegen.", "Hebr 13:5": "Laat uw wandel zonder geldgierigheid zijn, en wees tevreden met wat u hebt; want Hij heeft gezegd: Ik zal u niet begeven, en Ik zal u niet verlaten.", "Joh 19:29": "Daar stond dan een vat vol azijn, en zij vulden een spons met azijn, en omlegden ze met hysop, en brachten ze aan Zijn mond.", "Hebr 4:3": "Want wij die geloofd hebben, gaan de rust in, zoals Hij gezegd heeft: Zo heb Ik dan in Mijn toorn gezworen: Zij zullen Mijn rust niet ingaan! Hoewel Zijn werken al vanaf de grondlegging van de wereld volbracht waren.", "Rom 4:18": "Hij heeft tegen hoop op hoop geloofd, dat hij een vader van veel volken zou worden, volgens wat gezegd was: Zo zal uw nageslacht zijn.", "Ps 92:13": "De rechtvaardige zal groeien als een palmboom; hij zal groeien als een cederboom op de Libanon.", "Joh 10:8": "Allen die vóór Mij zijn gekomen, zijn dieven en rovers; maar de schapen hebben hen niet gehoord.", "Luk 4:18": "De Geest van de Heere is op Mij, daarom heeft Hij Mij gezalfd; Hij heeft Mij gezonden om aan de armen het Evangelie te verkondigen, om te genezen wie gebroken zijn van hart;", "Hos 5:7": "Zij hebben trouweloos gehandeld tegen de Heere; want zij hebben vreemde kinderen verwekt; nu zal de nieuwe maand hen verteren met hun delen.", "Jer 31:32": "Niet naar het verbond dat Ik met hun vaderen gemaakt heb, op de dag dat Ik hun hand vastgreep om hen uit het land Egypte uit te leiden, welk verbond van Mij zij verbroken hebben, hoewel Ik hen getrouwd had, spreekt de HEERE;", "Zach 8:10": "Want vóór die dagen kwam het loon van de mens tot niets, en het loon van het vee was er niet; en de uitgaande en de inkomende hadden geen vrede vanwege de vijand, want Ik zond alle mensen, ieder tegen zijn naaste.", "Matt 7:23": "En dan zal Ik hun openlijk zeggen: Ik heb u nooit gekend; ga weg van Mij, u die de ongerechtigheid werkt!", "Zach 14:1": "Zie, de dag komt, de HEERE, dat uw roof zal uitgedeeld worden in het midden van u, o Jeruzalem!", "Ezech 14:10": "En zij zullen hun ongerechtigheid dragen; zoals de ongerechtigheid van de vrager zal zijn, zo zal de ongerechtigheid van de profeet zijn;", "Jes 49:8": "Zo zegt de HEERE: In de tijd van het welbehagen heb Ik U verhoord, en op de dag van het heil heb Ik U geholpen; en Ik zal U bewaren, en Ik zal U geven tot een verbond van het volk, om het aardrijk op te richten, om de verwoeste erfenissen te doen beërven;", "Amos 8:9": "En het zal op die dag gebeuren, spreekt de Heere HEERE, dat Ik de zon op de middag zal doen ondergaan, en het land op klaarlichte dag zal verduisteren.", "Hebr 10:26": "Want als wij willens en wetens zondigen, nadat wij de kennis van de waarheid ontvangen hebben, blijft er geen offer meer over voor de zonden;", "Jak 3:16": "Want waar afgunst en eigenbelang is, daar is verwarring en allerlei kwade praktijk.", "Joh 17:12": "Toen Ik met hen in de wereld was, bewaarde Ik hen in Uw Naam. Hen die U Mij gegeven hebt, heb Ik bewaard, en niemand van hen is verloren gegaan, dan de zoon van het verderf, opdat de Schrift vervuld wordt.", "Zach 13:7": "Zwaard! Word wakker tegen Mijn Herder, en tegen de Man Die Mijn Metgezel is, spreekt de HEERE van de heerscharen; sla die Herder, en de schapen zullen verstrooid worden; maar Ik zal Mijn hand tot de kleinen wenden.", "2 Kon 4:1": "Een vrouw uit de vrouwen van de zonen der profeten riep tot Elisa en zei: Uw knecht, mijn man, is gestorven, en u weet dat uw knecht de HEERE was vrezende; nu is de schuldeiser gekomen om mijn beide kinderen voor zich tot knechten te nemen.", "Ezech 34:24": "En Ik, de HEERE, zal hun tot een God zijn; en Mijn knecht David zal Vorst zijn te midden van hen, Ik, de HEERE, heb het gesproken.", "Ezech 37:16-20": "U dan, mensenkind! Neem een stuk hout, en schrijf daarop: Voor Juda, en voor de kinderen van Israël, zijn metgezellen; en neem een ander stuk hout, en schrijf daarop: Voor Jozef, het hout van Efraïm, en van het gehele huis van Israël, zijn metgezellen. Doe ze dan bij elkaar komen, het een bij het ander tot één stuk hout; en zij zullen één worden in uw hand. En wanneer de kinderen van uw volk tot u zullen spreken en zeggen: Wilt u ons niet duidelijk maken wat u met deze dingen bedoelt?", "Mark 14:27": "En Jezus zei tegen hen: U zult deze nacht allen aanstoot aan Mij nemen; want er is geschreven: Ik zal de Herder slaan, en de schapen zullen verstrooid worden.", "Hagg 2:7": "Want zo zegt de HEERE van de heerscharen: Nog eenmaal, over een korte tijd, zal het zover zijn; en Ik zal de hemel, en de aarde, en de zee, en het droge doen beven.", "Ps 146:5": "Gelukkig is hij die de God van Jakob tot zijn Hulp heeft, wiens verwachting op de HEERE, zijn God is;", "Jes 50:6": "Ik geef Mijn rug aan hen die Mij slaan, en Mijn wangen aan hen die Mij het haar uitplukken; Mijn gezicht verberg Ik niet voor smaad en speeksel.", "Mark 14:18-21": "En terwijl zij aanzaten en aten, zei Jezus: Voorwaar, Ik zeg u, dat een van u, die met Mij eet, Mij zal verraden. En zij begonnen bedroefd te worden, en de een na de ander tegen Hem te zeggen: Ben ik het? En een ander: Ben ik het? Maar Hij antwoordde en zei tegen hen: Het is één van de twaalf, die met Mij in de schotel indoopt.", "Ezech 8:18": "Daarom zal Ik ook handelen in grimmigheid, Mijn oog zal niet ontzien, en Ik zal niet sparen; al roepen zij voor Mijn oren met luide stem, toch zal Ik hen niet horen.", "Hebr 3:7-11": "Daarom, zoals de Heilige Geest zegt: Heden, als u Zijn stem hoort, Verhard uw harten niet, zoals bij de verbittering, op de dag van de beproeving, in de woestijn; Waar uw vaders Mij beproefden; zij hebben Mij op de proef gesteld, en hebben Mijn werken gezien, veertig jaar lang.", "Jes 42:1-4": "Zie, Mijn Knecht, Die Ik ondersteun, Mijn Uitverkorene, in Wie Mijn ziel een welbehagen heeft! Ik heb Mijn Geest op Hem gegeven; Hij zal het recht aan de heidenen voortbrengen. Hij zal niet schreeuwen, noch Zijn stem verheffen, noch Zijn stem op straat horen laten. Het geknakte riet zal Hij niet breken, en de rokende vlaswiek zal Hij niet uitblussen; met waarheid zal Hij het recht voortbrengen.", "Job 21:11": "Hun jonge kinderen zenden zij uit als een kudde, en hun kinderen huppelen.", "Ex 21:24": "oog voor oog, tand voor tand, hand voor hand, voet voor voet,", "1 Petr 2:24": "Die Zelf onze zonden in Zijn lichaam gedragen heeft op het hout; opdat wij, voor de zonden afgestorven, voor de gerechtigheid zouden leven; door Wiens striemen u genezen bent.", "Ef 4:25": "Daarom, leg de leugen af, en spreek de waarheid, ieder met zijn naaste; want wij zijn elkaars leden.", "Luk 20:17": "Maar Hij keek hen aan en zei: Wat betekent dan wat er geschreven staat: De steen die de bouwers verworpen hebben, die is de hoeksteen geworden?", "Jes 28:11": "Daarom zal Hij door belachelijke lippen en door een andere tong tot dit volk spreken;", "Gal 6:1": "Broeders, als een mens door een misdaad vervallen is, moet u, die geestelijk bent, hem die zo is terechtbrengen met een geest van zachtmoedigheid; en let daarbij op uzelf, zodat ook u niet in verzoeking komt.", "Luk 7:27": "Deze is het, over wie geschreven is: Zie, Ik zend Mijn engel voor Uw aangezicht uit, die Uw weg voor U klaar zal maken.", "Ps 97:7": "Beschaamd moeten worden allen die de beelden dienen, die zich op afgoden beroemen; buig u neer voor Hem, alle goden!", "Micha 5:7": "Ja, het overblijfsel van Jakob zal zijn onder de heidenen, in het midden van veel volken, als een leeuw onder de dieren van het woud, als een jonge leeuw onder de schaapskudden; die, wanneer hij erdoorheen gaat, vertreedt en verscheurt, zodat niemand redt.", "Hebr 8:8-13": "Want omdat Hij hen berispt, zegt Hij tegen hen: Zie, de dagen komen, spreekt de Heere, dat Ik over het huis van Israël en over het huis van Juda een nieuw verbond zal oprichten; Niet naar het verbond dat Ik met hun vaderen gemaakt heb, op de dag dat Ik hen bij de hand nam om hen uit Egypteland te leiden; want zij zijn in dit Mijn verbond niet gebleven, en Ik heb niet meer naar hen omgekeken, zegt de Heere. Want dit is het verbond dat Ik met het huis van Israël maken zal na die dagen, zegt de Heere: Ik zal Mijn wetten in hun verstand geven, en in hun harten zal Ik ze inschrijven; en Ik zal hun tot een God zijn, en zij zullen Mij tot een volk zijn.", "Matt 19:19": "Eer uw vader en moeder; en: U zult uw naaste liefhebben als uzelf.", "Jes 53:3": "Hij was veracht, en de onwaardigste onder de mensen, een Man van smarten, en vertrouwd met ziekte; en ieder verborg als het ware het gezicht voor Hem; Hij was veracht, en wij hebben Hem niet geacht.", "2 Kor 4:13": "Omdat wij nu dezelfde Geest van het geloof hebben, zoals er geschreven is: Ik heb geloofd, daarom heb ik gesproken; zo geloven wij ook, daarom spreken wij ook;", "Hand 3:25": "U bent kinderen van de profeten, en van het verbond dat God met onze vaderen gesloten heeft, toen Hij tegen Abraham zei: En in uw nageslacht zullen alle geslachten van de aarde gezegend worden.", "Rom 9:26": "En het zal zijn: op de plaats waar tot hen gezegd was: U bent Mijn volk niet, daar zullen zij kinderen van de levende God genoemd worden.", "1 Kor 8:1-13": "Wat betreft de dingen die aan de afgoden geofferd zijn: wij weten dat wij allemaal samen kennis hebben. De kennis maakt opgeblazen, maar de liefde sticht. En als iemand meent iets te weten, die heeft nog niets gekend, zoals men behoort te kennen. Maar als iemand God liefheeft, die is door Hem gekend.", "Jes 42:18-21": "Hoort, u doven! En kijkt toe, u blinden, om te zien. Wie is er blind als Mijn knecht, en doof, zoals Mijn bode, die Ik zend? Wie is blind, zoals de volmaakte, en blind, zoals de knecht van de HEERE? U ziet wel veel dingen, maar u bewaart ze niet; en al doet hij de oren open, toch hoort hij niet.", "Ezech 31:17": "Die daalden ook met hem neer naar het rijk van de dood, tot de verslagenen door het zwaard; en zij die zijn arm geweest waren, die onder zijn schaduw in het midden van de heidenvolken gezeten hadden.", "1 Kor 6:1-8": "Durft iemand van u, die een zaak heeft tegen een ander, voor de onrechtvaardigen naar de rechter gaan, en niet voor de heiligen? Weet u niet, dat de heiligen de wereld zullen oordelen? En als door u de wereld geoordeeld wordt, bent u dan onwaardig de kleinste rechtszaken te oordelen? Weet u niet, dat wij de engelen zullen oordelen? Hoeveel te meer de zaken die dit leven aangaan?", "Mark 12:26": "Maar wat de doden betreft, dat zij opgewekt zullen worden: hebt u niet gelezen in het boek van Mozes, hoe God in de doornstruik tot hem gesproken heeft: Ik ben de God van Abraham, en de God van Izak, en de God van Jakob?", "Deut 21:23": "Dan zal zijn dode lichaam niet aan het hout overnachten; maar u zult hem beslist diezelfde dag begraven; want een opgehangene is door God vervloekt. Zo zult u uw land niet verontreinigen, dat de HEERE, uw God, u als erfdeel geeft.", "Deut 32:22": "Want een vuur is aangestoken in Mijn toorn, en zal branden tot in de onderste hel, en zal het land met zijn opbrengst verteren, en de gronden van de bergen in vlam zetten.", "Hand 13:47": "Want zo heeft de Heere ons geboden: Ik heb u gesteld tot een licht voor de heidenen, opdat u tot zaligheid zou zijn, tot aan het uiterste van de aarde.", "Hebr 1:13": "En tegen wie van de engelen heeft Hij ooit gezegd: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gezet heb?", "Joh 19:24": "Zij zeiden dan tegen elkaar: Laten wij die niet scheuren, maar erom loten, van wie die zal zijn; opdat de Schrift vervuld wordt, die zegt: Zij hebben Mijn kleren onder elkaar verdeeld, en over Mijn kleding hebben zij het lot geworpen. Dit hebben de soldaten dan gedaan.", "Kol 2:4": "En dit zeg ik, opdat niemand u misleidt met overredende woorden, die een schijn van waarheid hebben.", "Matt 5:27": "U hebt gehoord dat gezegd is: U zult geen overspel plegen.", "Luk 19:43": "Want er zullen dagen over u komen, dat uw vijanden een wal rondom u zullen opwerpen, en u zullen omsingelen, en u van alle kanten in het nauw drijven;", "Luk 16:22": "En het gebeurde dat de bedelaar stierf, en door de engelen gedragen werd in de schoot van Abraham; en de rijke stierf ook, en werd begraven.", "Ps 110:1": "Een psalm van David. De HEERE heeft tot mijn Heere gesproken: Zit aan Mijn rechterhand, totdat Ik Uw vijanden gezet zal hebben tot een voetbank van Uw voeten.", "Gen 17:7": "En Ik zal Mijn verbond oprichten tussen Mij en u, en uw nageslacht na u, in hun geslachten, tot een eeuwig verbond, om u en uw nageslacht na u tot een God te zijn.", "Matt 17:12": "Maar Ik zeg u dat Elia al gekomen is, en zij hebben hem niet erkend; maar zij hebben met hem gedaan wat zij wilden. Zo zal ook de Zoon des mensen door hen lijden.", "Jer 2:27": "Die tot een stuk hout zeggen: U bent mijn vader; en tot een steen: U hebt mij verwekt; want zij keren Mij de nek toe, en niet het aangezicht; maar ten tijde van hun kwaad zeggen zij: Sta op en verlos ons.", "Jes 5:20": "Wee hun die het kwade goed noemen, en het goede kwaad; die duisternis tot licht stellen, en het licht tot duisternis; die het bittere tot zoet stellen, en het zoete tot bitterheid!", "Joh 5:43": "Ik ben gekomen in de Naam van Mijn Vader, en u neemt Mij niet aan; als een ander komt in zijn eigen naam, die zult u aannemen.", "Ps 22:19": "Zij delen mijn kleren onder zich, en werpen het lot over mijn gewaad.", "1 Tim 6:20": "O Timotheüs, bewaar het pand dat u toevertrouwd is, en keer u af van het ongoddelijk zinloos gepraat en van de tegenstellingen van de ten onrechte zo genoemde wetenschap;", "Matt 24:50": "dan zal de heer van die dienstknecht komen op een dag waarop hij hem niet verwacht, en op een uur dat hij niet weet;", "Hand 8:32": "En het gedeelte van de Schrift dat hij las, was dit: Hij is als een schaap naar de slachting geleid; en zoals een lam stemloos is voor wie het scheert, zo doet Hij Zijn mond niet open.", "Hebr 10:27": "maar een schrikwekkend uitzicht op het oordeel, en een felle hitte van het vuur, die de tegenstanders zal verslinden.", "Mark 10:6": "Maar van het begin van de schepping af heeft God hen man en vrouw gemaakt.", "Jer 13:14": "En Ik zal hen tegen elkaar te pletter slaan, de een tegen de ander, zowel de vaders als de kinderen samen, spreekt de HEERE; Ik zal geen medelijden hebben, en niet sparen, en Mij niet ontfermen, zodat Ik hen zal verderven.", "1 Sam 13:14": "Maar nu zal uw koningschap niet blijven bestaan. De HEERE heeft Zich een man gezocht naar Zijn hart, en de HEERE heeft hem bevolen een voorganger te zijn over Zijn volk, omdat u niet gehouden hebt wat de HEERE u geboden had.", "2 Petr 1:11": "Want zo zal u rijkelijk de ingang worden verleend in het eeuwige Koninkrijk van onze Heere en Zaligmaker, Jezus Christus.", "Jes 2:12-17": "Want de dag van de HEERE van de heerscharen zal zijn tegen alle hovaardige en hoge, en tegen alle verhevene, opdat hij vernederd wordt; En tegen alle hoge en verhevene ceders van Libanon, en tegen alle eiken van Basan; En tegen alle hoge bergen, en tegen alle verheven heuvels;", "Jes 9:4": "Toen de hele strijd van hen die streden, met gedruis gebeurde, en de kleren in het bloed gewenteld en verbrand werden, tot een voedsel van het vuur.", "2 Kron 30:15": "Toen slachtten zij het pascha, op de veertiende dag van de tweede maand; en de priesters en de Levieten waren beschaamd geworden, en hadden zich geheiligd, en hadden brandoffers gebracht in het huis van de HEERE.", "Ezech 16:59-61": "Want zo zegt de Heere HEERE: Ik zal u ook doen zoals u gedaan hebt, u die de eed veracht hebt door het verbond te breken. Toch zal Ik denken aan Mijn verbond met u, in de dagen van uw jeugd, en Ik zal met u een eeuwig verbond oprichten. Dan zult u aan uw wegen denken en beschaamd zijn, wanneer u uw zusters, die groter zijn dan u, samen met hen die kleiner zijn dan u, aannemen zult; want Ik zal ze u geven tot dochters, maar niet op grond van uw verbond.", "Deut 5:16": "Eer uw vader en uw moeder, zoals de HEERE, uw God, u geboden heeft, opdat uw dagen verlengd worden, en opdat het u goed gaat in het land dat de HEERE, uw God, u geven zal.", "Matt 5:38": "U hebt gehoord dat gezegd is: Oog om oog, en tand om tand.", "Hos 12:9": "Nog zegt Efraïm: Toch ben ik rijk geworden, ik heb voor mij groot goed verkregen; in al mijn arbeid zullen zij mij geen ongerechtigheid vinden, die zonde zou zijn.", "Mark 9:11-13": "En zij vroegen Hem: Waarom zeggen de Schriftgeleerden dat Elia eerst moet komen? En Hij antwoordde en zei tegen hen: Elia komt inderdaad eerst, en herstelt alles; en het zal gebeuren, zoals geschreven is van de Zoon des mensen, dat Hij veel moet lijden en veracht worden. Maar Ik zeg u, dat Elia ook gekomen is, en zij hebben hem gedaan wat zij wilden, zoals van hem geschreven is.", "Gen 37:26-28": "Toen zei Juda tegen zijn broers: Wat voor voordeel zal het zijn dat wij onze broer doodslaan en zijn bloed verbergen? Komt, laten wij hem aan deze Ismaëlieten verkopen, en onze hand zij niet aan hem; want hij is onze broer, ons vlees. En zijn broers stemden ermee in. Toen nu de Midianitische kooplieden voorbijtrokken, trokken en hesen zij Jozef op uit de kuil, en verkochten Jozef aan deze Ismaëlieten voor twintig zilverstukken; die brachten Jozef naar Egypte.", "Jer 50:44": "Zie, zoals een leeuw van de verheffing van de Jordaan zal hij opkomen tegen de sterke woning; want Ik zal hen in een ogenblik daaruit doen wegvluchten; en wie daartoe verkoren is, hem zal Ik tegen haar aanstellen; want wie is Mij gelijk, en wie zou Mij dagvaarden? En wie is de herder die voor Mijn aangezicht kan bestaan?", "2 Joh 1:1": "De oudste aan de uitverkoren vrouw en aan haar kinderen, die ik in waarheid liefheb, en niet alleen ik, maar ook allen die de waarheid gekend hebben;", "Hand 1:20": "Want er staat geschreven in het boek van de Psalmen: Zijn woonstede moet woest worden, en er mag niemand zijn die erin woont. En: Een ander moet zijn opzienersambt overnemen.", "Lev 11:44": "Want Ik ben de HEERE, uw God; daarom zult u uzelf heiligen, en heilig zijn, omdat Ik heilig ben; en u zult uw ziel niet verontreinigen aan enig kruipend gedierte dat zic
