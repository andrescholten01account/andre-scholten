 en Ekron als de Jebusiet.","8":"En Ik zal Mij rondom Mijn huis legeren, vanwege het leger, vanwege de doorgaande, en vanwege de wederkerende, opdat de drijver niet meer door hen doorga; want nu heb Ik het met Mijn ogen aangezien.","9":"Verheug u zeer, dochter van Sion! Juich, dochter van Jeruzalem! Zie, uw Koning zal tot u komen, rechtvaardig, en Hij is een Heiland; arm, en rijdend op een ezel, en op een veulen, het jong van de ezelinnen.","10":"En Ik zal de wagens uit Efraïm uitroeien, en de paarden uit Jeruzalem; ook zal de strijdboog uitgeroeid worden, en Hij zal tot de heidenen vrede spreken; en Zijn heerschappij zal zijn van zee tot aan zee, en van de rivier tot aan de einden van de aarde.","11":"U ook aangaande, o Sion! Door het bloed van het verbond met u, heb Ik uw gebondenen uit de kuil, waar geen water in is, uitgelaten.","12":"Keert u weer tot de sterkte, gebondenen, die daar hopen! Ook heden verkondig Ik, dat Ik u dubbel zal wedergeven;","13":"Wanneer Ik Mij Juda zal gespannen hebben, en Ik Efraïm de boog zal gevuld hebben; en Ik uw kinderen, o Sion! zal verwekt hebben tegen uw kinderen, o Griekenland! en u gesteld zal hebben als het zwaard van een held.","14":"En de HEERE zal over hen verschijnen, en Zijn pijlen zullen uitgaan als een bliksem; en de Heere HEERE zal met de bazuin blazen, en Hij zal voorttrekken met stormen uit het zuiden.","15":"De HEERE van de heerscharen[1] zal hen beschutten, en zij zullen eten, nadat zij de slingerstenen zullen ten onder gebracht hebben; zij zullen ook drinken, en een gedruis maken als bij de wijn; en zij zullen vervuld worden, als het bekken, als de hoeken van het altaar.","16":"En de HEERE, hun God, zal hen op die dag behouden, als de kudde van Zijn volk; want gekroonde stenen zullen in Zijn land, als een banier, opgericht worden.","17":"Want hoe groot zal zijn goed wezen en hoe groot zal zijn schoonheid wezen! Het koren zal de jongelingen, en de most zal de jonkvrouwen sprekend maken."},"SV":{"1":"De last van het woord des HEEREN over het land Chadrach en Damaskus, deszelfs rust; want de HEERE heeft een oog *over* den mens, gelijk *over* al de stammen Israëls.","2":"En ook zal Hij Hamath met dezelve bepalen; Tyrus en Sidon, hoewel zij zeer wijs is;","3":"En Tyrus zich sterkten gebouwd heeft, en zilver verzameld heeft als stof, en fijn goud als slijk der straten;","4":"Ziet, de Heere zal haar uit het bezit stoten, en Hij zal haar vesting in de zee verslaan; en zij zal met vuur verteerd worden.","5":"Askelon zal het zien, en zal vrezen; desgelijks Gaza, en zal grote smart hebben, mitsgaders Ekron, dewijl hetgeen, waar zij op zagen, *hen* heeft te schande gemaakt; en de koning van Gaza zal vergaan, en Askelon zal niet bewoond worden.","6":"En de bastaard zal te Asdod wonen, en Ik zal den hoogmoed der Filistijnen uitroeien.","7":"En Ik zal zijn bloed uit zijn mond wegdoen, en zijn verfoeiselen van tussen zijn tanden; alzo zal hij ook onzen God overblijven; ja, hij zal zijn als een vorst in Juda, en Ekron als de Jebusiet.","8":"En Ik zal Mij rondom Mijn huis legeren, vanwege het heirleger, vanwege den doorgaande, en vanwege den wederkerende, opdat de drijver niet meer door hen doorga; want nu heb Ik *het* met Mijn ogen aangezien.","9":"Verheug u zeer, gij dochter Sions! juich, gij dochter Jeruzalems! Ziet, uw Koning zal u komen, rechtvaardig, en Hij is een Heiland; arm, en rijdende op een ezel, en op een veulen, een jong der ezelinnen.","10":"En Ik zal de wagens uit Efraïm uitroeien, en de paarden uit Jeruzalem; ook zal de strijdboog uitgeroeid worden, en Hij zal den heidenen vrede spreken; en Zijn heerschappij zal zijn van zee tot aan zee, en van de rivier tot aan de einden der aarde.","11":"U ook aangaande, *o* *Sion*! door het bloed uws verbonds, heb Ik uw gebondenen uit den kuil, daar geen water in is, uitgelaten.","12":"Keert gijlieden weder tot de sterkte, gij gebondenen, die daar hoopt! ook heden verkondig Ik, dat Ik u dubbel zal wedergeven;","13":"Als Ik Mij Juda zal gespannen, *en* Ik Efraïm den boog zal gevuld hebben; en Ik uw kinderen, o Sion! zal verwekt hebben tegen uw kinderen, o Griekenland! en u gesteld zal hebben als het zwaard van een held.","14":"En de HEERE zal over henlieden verschijnen, en Zijn pijlen zullen uitvaren als een bliksem; en de Heere HEERE zal met de bazuin blazen, en Hij zal voorttreden met stormen uit het zuiden.","15":"De HEERE der heirscharen zal hen beschutten, en zij zullen eten, nadat zij de slingerstenen zullen ten ondergebracht hebben; zij zullen ook drinken, *en* een gedruis maken als de wijn; en zij zullen vervuld worden, gelijk het bekken, gelijk de hoeken des altaars.","16":"En de HEERE, hun God, zal ze te dien dage behouden, als zijnde de kudde Zijns volks; want gekroonde stenen zullen in Zijn land, als een banier, opgericht worden.","17":"Want hoe groot zal zijn goed wezen en hoe groot zal zijn schoonheid wezen! Het koren zal de jongelingen, en de most zal de jonkvrouwen sprekende maken."},"KJV":{"1":"The burden of the word of the LORD in the land of Hadrach, and Damascus *shall be* the rest thereof: when the eyes of man, as of all the tribes of Israel, *shall be* toward the LORD.","2":"And Hamath also shall border thereby; Tyrus, and Zidon, though it be very wise.","3":"And Tyrus did build herself a strong hold, and heaped up silver as the dust, and fine gold as the mire of the streets.","4":"Behold, the Lord will cast her out, and he will smite her power in the sea; and she shall be devoured with fire.","5":"Ashkelon shall see *it*, and fear; Gaza also *shall see it*, and be very sorrowful, and Ekron; for her expectation shall be ashamed; and the king shall perish from Gaza, and Ashkelon shall not be inhabited.","6":"And a bastard shall dwell in Ashdod, and I will cut off the pride of the Philistines.","7":"And I will take away his blood out of his mouth, and his abominations from between his teeth: but he that remaineth, even he, *shall be* for our God, and he shall be as a governor in Judah, and Ekron as a Jebusite.","8":"And I will encamp about mine house because of the army, because of him that passeth by, and because of him that returneth: and no oppressor shall pass through them any more: for now have I seen with mine eyes.","9":"Rejoice greatly, O daughter of Zion; shout, O daughter of Jerusalem: behold, thy King cometh unto thee: he *is* just, and having salvation; lowly, and riding upon an ass, and upon a colt the foal of an ass.","10":"And I will cut off the chariot from Ephraim, and the horse from Jerusalem, and the battle bow shall be cut off: and he shall speak peace unto the heathen: and his dominion *shall be* from sea *even* to sea, and from the river *even* to the ends of the earth.","11":"As for thee also, by the blood of thy covenant I have sent forth thy prisoners out of the pit wherein *is* no water.","12":"Turn you to the strong hold, ye prisoners of hope: even to day do I declare *that* I will render double","13":"When I have bent Judah for me, filled the bow with Ephraim, and raised up thy sons, O Zion, against thy sons, O Greece, and made thee as the sword of a mighty man.","14":"And the LORD shall be seen over them, and his arrow shall go forth as the lightning: and the Lord GOD shall blow the trumpet, and shall go with whirlwinds of the south.","15":"The LORD of hosts shall defend them; and they shall devour, and subdue with sling stones; and they shall drink, *and* make a noise as through wine; and they shall be filled like bowls, *and* as the corners of the altar.","16":"And the LORD their God shall save them in that day as the flock of his people: for they *shall be as* the stones of a crown, lifted up as an ensign upon his land.","17":"For how great *is* his goodness, and how great *is* his beauty! corn shall make the young men cheerful, and new wine the maids."}},"tsk":{"1":[{"kopje":"last","refs":["Jes 13:1","Jer 23:33-38","Mal 1:1"]},{"kopje":"Damaskus","refs":["Gen 14:15","Jes 17:1-3","Jer 49:23-27","Amos 1:3-5","Am ling_kjv":{"1":"The <span class=\"wl wl-kjv\" data-code=\"H4853\">burden</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H2317\">Hadrach,</span> and <span class=\"wl wl-kjv\" data-code=\"H1834\">Damascus</span> shall be the <span class=\"wl wl-kjv\" data-code=\"H4496\">rest</span> thereof: when the <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> as of all the <span class=\"wl wl-kjv\" data-code=\"H7626\">tribes</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> shall be toward the LORD.","2":"And <span class=\"wl wl-kjv\" data-code=\"H2574\">Hamath</span> also shall <span class=\"wl wl-kjv\" data-code=\"H1379\">border</span> thereby; <span class=\"wl wl-kjv\" data-code=\"H6865\">Tyrus,</span> and <span class=\"wl wl-kjv\" data-code=\"H6721\">Zidon,</span> though it be <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> wise.","3":"And <span class=\"wl wl-kjv\" data-code=\"H6865\">Tyrus</span> did <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> herself a strong <span class=\"wl wl-kjv\" data-code=\"H4692\">hold,</span> and heaped <span class=\"wl wl-kjv\" data-code=\"H6651\">up</span> <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> as the <span class=\"wl wl-kjv\" data-code=\"H6083\">dust,</span> and fine <span class=\"wl wl-kjv\" data-code=\"H2742\">gold</span> as the <span class=\"wl wl-kjv\" data-code=\"H2916\">mire</span> of the streets.","4":"Behold, the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> will cast her <span class=\"wl wl-kjv\" data-code=\"H3423\">out,</span> and he will <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> her <span class=\"wl wl-kjv\" data-code=\"H2428\">power</span> in the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea;</span> and she shall be <span class=\"wl wl-kjv\" data-code=\"H398\">devoured</span> with fire.","5":"<span class=\"wl wl-kjv\" data-code=\"H831\">Ashkelon</span> shall <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> it, and <span class=\"wl wl-kjv\" data-code=\"H3372\">fear;</span> <span class=\"wl wl-kjv\" data-code=\"H5804\">Gaza</span> also shall see it, and be <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H2342\">sorrowful,</span> and <span class=\"wl wl-kjv\" data-code=\"H6138\">Ekron;</span> for her <span class=\"wl wl-kjv\" data-code=\"H4007\">expectation</span> shall be <span class=\"wl wl-kjv\" data-code=\"H3001\">ashamed;</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> shall <span class=\"wl wl-kjv\" data-code=\"H6\">perish</span> from <span class=\"wl wl-kjv\" data-code=\"H5804\">Gaza,</span> and <span class=\"wl wl-kjv\" data-code=\"H831\">Ashkelon</span> shall not be inhabited.","6":"And a <span class=\"wl wl-kjv\" data-code=\"H4464\">bastard</span> shall <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> in <span class=\"wl wl-kjv\" data-code=\"H795\">Ashdod,</span> and I will cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> the <span class=\"wl wl-kjv\" data-code=\"H1347\">pride</span> of the Philistines.","7":"And I will take <span class=\"wl wl-kjv\" data-code=\"H5493\">away</span> his <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> out of his <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> and his <span class=\"wl wl-kjv\" data-code=\"H8251\">abominations</span> from between his <span class=\"wl wl-kjv\" data-code=\"H8127\">teeth:</span> but he that <span class=\"wl wl-kjv\" data-code=\"H7604\">remaineth,</span> even he, shall be for our <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and he shall be as a <span class=\"wl wl-kjv\" data-code=\"H441\">governor</span> in <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and <span class=\"wl wl-kjv\" data-code=\"H6138\">Ekron</span> as a Jebusite.","8":"And I will <span class=\"wl wl-kjv\" data-code=\"H2583\">encamp</span> about mine <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> because of the <span class=\"wl wl-kjv\" data-code=\"H4675\">army,</span> because of him that passeth <span class=\"wl wl-kjv\" data-code=\"H5674\">by,</span> and because of him that <span class=\"wl wl-kjv\" data-code=\"H7725\">returneth:</span> and no <span class=\"wl wl-kjv\" data-code=\"H5065\">oppressor</span> shall pass <span class=\"wl wl-kjv\" data-code=\"H5674\">through</span> them any more: for now have I <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> with mine eyes.","9":"<span class=\"wl wl-kjv\" data-code=\"H1523\">Rejoice</span> <span class=\"wl wl-kjv\" data-code=\"H3966\">greatly,</span> O <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion;</span> <span class=\"wl wl-kjv\" data-code=\"H7321\">shout,</span> O <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem:</span> behold, thy <span class=\"wl wl-kjv\" data-code=\"H4428\">King</span> <span class=\"wl wl-kjv\" data-code=\"H935\">cometh</span> unto thee: he is <span class=\"wl wl-kjv\" data-code=\"H6662\">just,</span> and having <span class=\"wl wl-kjv\" data-code=\"H3467\">salvation;</span> <span class=\"wl wl-kjv\" data-code=\"H6041\">lowly,</span> and <span class=\"wl wl-kjv\" data-code=\"H7392\">riding</span> upon an <span class=\"wl wl-kjv\" data-code=\"H2543\">ass,</span> and upon a <span class=\"wl wl-kjv\" data-code=\"H5895\">colt</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">foal</span> of an ass.","10":"And I will cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> the <span class=\"wl wl-kjv\" data-code=\"H7393\">chariot</span> from <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5483\">horse</span> from <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle</span> <span class=\"wl wl-kjv\" data-code=\"H7198\">bow</span> shall be cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off:</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> <span class=\"wl wl-kjv\" data-code=\"H7965\">peace</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen:</span> and his <span class=\"wl wl-kjv\" data-code=\"H4915\">dominion</span> shall be from <span class=\"wl wl-kjv\" data-code=\"H3220\">sea</span> even to <span class=\"wl wl-kjv\" data-code=\"H3220\">sea,</span> and from the <span class=\"wl wl-kjv\" data-code=\"H5104\">river</span> even to the <span class=\"wl wl-kjv\" data-code=\"H657\">ends</span> of the earth.","11":"As for thee also, by the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> of thy <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> I have sent <span class=\"wl wl-kjv\" data-code=\"H7971\">forth</span> thy <span class=\"wl wl-kjv\" data-code=\"H615\">prisoners</span> out of the <span class=\"wl wl-kjv\" data-code=\"H953\">pit</span> wherein is no water.","12":"<span class=\"wl wl-kjv\" data-code=\"H7725\">Turn</span> you to the strong <span class=\"wl wl-kjv\" data-code=\"H1225\">hold,</span> ye <span class=\"wl wl-kjv\" data-code=\"H615\">prisoners</span> of <span class=\"wl wl-kjv\" data-code=\"H8615\">hope:</span> even to <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> do I <span class=\"wl wl-kjv\" data-code=\"H5046\">declare</span> that I will <span class=\"wl wl-kjv\" data-code=\"H7725\">render</span> double","13":"When I have <span class=\"wl wl-kjv\" data-code=\"H1869\">bent</span> <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> for me, <span class=\"wl wl-kjv\" data-code=\"H4390\">filled</span> the <span class=\"wl wl-kjv\" data-code=\"H7198\">bow</span> with <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim,</span> and raised <span class=\"wl wl-kjv\" data-code=\"H5782\">up</span> thy <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> O <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion,</span> against thy <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> O <span class=\"wl wl-kjv\" data-code=\"H3120\">Greece,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">made</span> thee as the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> of a mighty man.","14":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall be <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> over them, and his <span class=\"wl wl-kjv\" data-code=\"H2671\">arrow</span> shall go <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> as the <span class=\"wl wl-kjv\" data-code=\"H1300\">lightning:</span> and the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD</span> shall <span class=\"wl wl-kjv\" data-code=\"H8628\">blow</span> the <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpet,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H1980\">go</span> with <span class=\"wl wl-kjv\" data-code=\"H5591\">whirlwinds</span> of the south.","15":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts</span> shall <span class=\"wl wl-kjv\" data-code=\"H1598\">defend</span> them; and they shall <span class=\"wl wl-kjv\" data-code=\"H398\">devour,</span> and <span class=\"wl wl-kjv\" data-code=\"H3533\">subdue</span> with <span class=\"wl wl-kjv\" data-code=\"H7050\">sling</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stones;</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H8354\">drink,</span> and make a <span class=\"wl wl-kjv\" data-code=\"H1993\">noise</span> as through <span class=\"wl wl-kjv\" data-code=\"H3196\">wine;</span> and they shall be <span class=\"wl wl-kjv\" data-code=\"H4390\">filled</span> like <span class=\"wl wl-kjv\" data-code=\"H4219\">bowls,</span> and as the <span class=\"wl wl-kjv\" data-code=\"H2106\">corners</span> of the altar.","16":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> their <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> shall <span class=\"wl wl-kjv\" data-code=\"H3467\">save</span> them in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> as the <span class=\"wl wl-kjv\" data-code=\"H6629\">flock</span> of his <span class=\"wl wl-kjv\" data-code=\"H5971\">people:</span> for they shall be as the <span class=\"wl wl-kjv\" data-code=\"H68\">stones</span> of a <span class=\"wl wl-kjv\" data-code=\"H5145\">crown,</span> lifted up as an <span class=\"wl wl-kjv\" data-code=\"H5264\">ensign</span> upon his land.","17":"For how great is his <span class=\"wl wl-kjv\" data-code=\"H2898\">goodness,</span> and how great is his <span class=\"wl wl-kjv\" data-code=\"H3308\">beauty!</span> <span class=\"wl wl-kjv\" data-code=\"H1715\">corn</span> shall make the young <span class=\"wl wl-kjv\" data-code=\"H970\">men</span> <span class=\"wl wl-kjv\" data-code=\"H5107\">cheerful,</span> and new <span class=\"wl wl-kjv\" data-code=\"H8492\">wine</span> the maids."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"last van het woord des HEEREN","tekst":"Dat is, een lastige en bezwaarlijke profetie, of voorzegging, die het land Chadrach overkomen zou; zie Isa 13:1 de aantekening aldaar."},{"catchword":"over het land","tekst":"Of, in, of tegen."},{"catchword":"Chadrach","tekst":"Het schijnt dat dit land Syrië betekent, dewijl hier straks Damaskus bijgevoegd wordt, zijnde de hoofdstad van Syrië. Eenigen menen dat Chadrach de naam is van een afgod, welken de Syriërs eerden. Anderen vertalen het woord van het land der eer, of derheerlijkheid, of van het heerlijke land; anderen: van het land dat rondom u ligt, o Juda."},{"catchword":"Damaskus,","tekst":"Hebr. Dammesek. Anders: ofschoon Damaskus zijne rust is."},{"catchword":"deszelfs rust;","tekst":"Dat is, waar het zich op verlaat. Of, alhoewel het zich op Damaskus verlaat en daarop gerust is. Anderen: maar Damaskus zal zijne, te weten de rust van den last zijn; dat is, het zal Damaskus ook op het laatste nog treffen. Anderen: en Damaskus zal zijne rust zijn; dat is, Gods toorn zal op Damaskus rusten; dat is, die stad alzo weinig verschonen gelijk als de rest."},{"catchword":"de HEERE","tekst":"Hebr. den Heere is een oog; dat is, de Heere heeft een oog over alle andere mensen in wat land die zijn, zowel als over de Joden. En versta hier door het oog des Heeren zijne voorzienigheid, dat is de overal-tegenwoordige kracht des Heeren, waardoor Hij den hemel en de aarde regeert, met alles wat daarin is."}],"2":[{"catchword":"Hij","tekst":"Te weten, de Heere."},{"catchword":"Hamath","tekst":"Zie Num 13:21 ."},{"catchword":"met dezelve","tekst":"Te weten, oog. Anders: Hamath zal dezelve bepalen; dat is, Hamath zal aan de grenzen daarvan liggen. Zie Jos 19:35 . Anders: door dezelve, te weten rust van den last."},{"catchword":"bepalen;","tekst":"Dat is, Hij zal de Syriërs ordineren hoe wijd en hoe ver zij zullen gaan en staan, ten beste van zijne kerk. Anderen nemen het aldus: Ook zal die [last] Hamath bepalen. Het is dezelfde zin."},{"catchword":"zij","tekst":"Te weten, Tyrus, dat is, de inwoners van tyrus, alsook de Sidoniërs."},{"catchword":"zeer wijs is;","tekst":"Naar hunne mening. Zie Eze 28:3 de aantekening aldaar, enz."}],"3":[{"catchword":"als stof,","tekst":"Dat is, in zeer groten overvloed. Verg. 1Ki 10:27 , en 2Ch 9:27 ; zie ook Psa 78:27 ."}],"4":[{"catchword":"uit het bezit stoten,","tekst":"Of, arm maken, daar zij tevoren de rijkste en voortreffelijkste was."},{"catchword":"Hij zal haar vesting","tekst":"De zin is: Of wel de Tyriërs menen dat zij onwinbaar zijn, ten aanzien dat zij rondom in en aan de zee gelegen zijn, zo zullen zij nochtans Gods oordeel niet ontgaan; maar zullen door het vuur verteerd worden. Dit is geschied door Alexander den Grote, gelijk Curtius lib. 4, en Doid. Siculus lib. 17"}],"5":[{"catchword":"Askelon zal het zien,","tekst":"Dat is, als Askelon den ondergang van Tyrus zien zal, zo zal het vrezen. Askelon en de andere steden, die hier meer genoemd staan, lagen in der Filistijnen land, en worden door dezelve de Filistijnen zelf verstaan."},{"catchword":"grote smart hebben,","tekst":"Als ene vrouw, die in barensnood is."},{"catchword":"waarop zij vertrouwden","tekst":"Dat is, waar zij zich op verlieten, te weten de stad Tyres, die zij voor onwindbaar hielden."},{"catchword":"hen","tekst":"Dat is, hen in hunne hoop bedrogen heeft. Want Alexander de Grote heeft de stad Tyrus ingenomen en verheerd. Zie een gelijk voorbeeld Isa 20:5-6 ."},{"catchword":"de koning van Gaza","tekst":"Dat is, de vorst. Want het land der Filistijnen was in vijf vorstendommen afgebeeld."},{"catchword":"zal vergaan,","tekst":"Dat is, daar zal geen vorst of koning meer te Gaza zijn."}],"6":[{"catchword":"de bastaard","tekst":"Dat is, een vreemde uitlandse koning, met allerlei vreemd ongebonden en ongeacht volk, die zullen de huizen, hoven en akkers bezitten."},{"catchword":"wonen,","tekst":"Te weten, als heer en meester van die stad."},{"catchword":"den hoogmoed der Filistijnen uitroeien","tekst":"Hovaardij, pracht, heerlijkheid; dat is, hetgeen waar zij zich op verhovaardigen. Verg. Lev 26:19 ."}],"7":[{"catchword":"Ik zal zijn bloed","tekst":"Te weten, nadat Ik hen zal gestraft of getuchtigd, en tot mijn volk zal aangenomen hebben, dat zal Ik hem [te weten de Filistijn] reinigen van zijne zonden, inzonderheid van de doodslagen, welke zij begaan hebben. Hebr. bloeden. Hier belooft God dat Hij ook de heidenen tot zijn volk zal aannemen en in zijne kerk inlijven."},{"catchword":"zijn verfoeiselen","tekst":"Versta, de afgoden en hunne offeranden."},{"catchword":"van tussen zijn tanden;","tekst":"Dat is, Ik zal maken dat zij er niet meer van spreken zullen, Psa 16:4 . Of, Ik zal maken dat zij het vlees, hetwelk hunnen afgoden geofferd is, niet meer eten zullen."},{"catchword":"hij ook","tekst":"Te weten, de Filistijn, het Filistijnse volk. Of, hij ook; dat is, niet alleen het gemene volk, maar ook de koning zelf."},{"catchword":"onzen God overblijven;","tekst":"Dat is, tot Gods volk en gemeente der gelovigen aangenomen worden. Zie Zech 8:23 ."},{"catchword":"als een vorst in Juda,","tekst":"Of, als een leidsman; dat is, zij zullen in Gods kerk in groot aanzien wezen en anderen in godzaligheid voorgaan en een voorbeeld zijn."},{"catchword":"en Ekron als de Jebusiet","tekst":"Dat is, die van Ekron zullen ook te Jeruzalem, te weten in het geestelijke Jeruzalem wonen, gelijk eertijds de Jebusieten in de stoffelijke stad Jeruzalem gewoond hebben, en de Jebusieten zullen ook tot Gods volk aangenomen worden."}],"8":[{"catchword":"rondom","tekst":"Of, omtrent, of, bij mijn huis; te weten, door mijne engelen; Psa 34:8 , en Psa 121:3-4 , en Psa 124:1-2 , Psa 124:8 ."},{"catchword":"Mijn huis legeren,","tekst":"Dat is, rondom mijne kerk; 1Ti 3:15 ."},{"catchword":"het heirleger,","tekst":"Te weten, vanwege het heirleger of het kreigsvolk van den vijand, opdat hij mijn huis niet aantaste of beschadige, als het over en weder loopt. Zie Zech 2:5 ."},{"catchword":"de drijver","tekst":"Dat is, de vijand."},{"catchword":"door hen doorga;","tekst":"Te weten, mijne huisgenoten, de gelovigen. Versta dit van een geestelijke verlossing van de strengheid der wet."},{"catchword":"het met Mijn ogen","tekst":"Te weten, mijn huis."},{"catchword":"aangezien","tekst":"Versta hier, een vriendelijk en genadig aanzien. Zie Deu 12:13 . Verg. Exo 3:7 ; Act 7:34 ."}],"9":[{"catchword":"gij dochter Sions","tekst":"Dat is, gij volk van Jeruzalem, ja gij volk Gods, zo Joden als heidenen."},{"catchword":"uw Koning","tekst":"Te weten, Christus Jezus."},{"catchword":"zal u komen,","tekst":"Tot uw best, tot uwe hulp; zie Isa 62:11 , enz.; Mat 21:5 ."},{"catchword":"Hij is een Heiland;","tekst":"Of, verlosser, die al zijne uitverkorenen verlossen zal uit het geweld des duivels, van den dood en van al hunne vijanden. Anders: die met heil voorzien is; of behouden is, te weten uit zijn lijden, door zijn eigen goddelijke kracht, om zijne kerk zalig te maken. Verg. Isa 53:8 ; Heb 5:7 ."},{"catchword":"arm,","tekst":"Slecht, verachtzaam, in de gedaante van een knecht, Phi 2:7 , enz."},{"catchword":"en op een veulen,","tekst":"Of, namelijk."},{"catchword":"een jong der ezelinnen","tekst":"Dat is, hetzelfde wat Hij straks gezegd heeft; zie Mat 21:5 ; Joh 12:14 ."}],"10":[{"catchword":"Ik zal de wagens","tekst":"Dat is, Ik zal mijne kerk vrede geven, alzo dat zij noch krijgswagens, noch paarden, of andere wapenen meer zal behoeven, de heidenen met de kerk van Christus verzoend zijnde; zie Isa 2:2 , Isa 2:4 ; Hos 2:17 ; Act 10:34 , enz.; Eph 2:17 ."},{"catchword":"Efraïm uitroeien,","tekst":"Onder den stam van Efraïm verstaat Hij als de tien stammen van Israël, en door dezelve zijne kerk."},{"catchword":"uit Jeruzalem;","tekst":"Dat is, uit den stam van Juda."},{"catchword":"vrede spreken;","tekst":"Dat is, vrede leren, namelijk door de predikatie van het heilg Evangelie zal Hij den vrede of verzoening met God verkondigen."},{"catchword":"zal zijn van zee tot aan zee,","tekst":"Dat is, zij zal zich strekken; zie Psa 2:8 ."},{"catchword":"de rivier tot aan de einden der aarde","tekst":"Versta hier, de rivier Frath, of Eufraat, en ziet Psa 72:8 de aantekening aldaar, en Exo 23:31 . Door deze plaatsen, bij de Joden bekend, moet men ook andere meer verstaan, ja de mening is dat de heerschappij van Christus zich zou uitbreiden over de ganse aardbodem."}],"11":[{"catchword":"o Sion","tekst":"Dat is, o mijn volk, mijne kerk. Dit is hier, klaarheidhalve, bijgevoegd uit vs.9."},{"catchword":"door het bloed uws verbonds,","tekst":"Of, in. De zin is: In of door de kracht van het bloed van Jezus Christus, waarmede Ik het verbond, met u ingegaan, bevestigen zal, heb Ik, of zal Ik uwe gavangenen, die met de banden der zonden gebonden zijn, verlossen uit den kuil, dat is, uit het geweld der hel en des duivels, waaronder zij anders hadden moeten versmachten in een geestelijken dorst, door het gevoel van den zwaren toorn Gods, die op hen lag."}],"12":[{"catchword":"tot de sterkte,","tekst":"De Joden, die nog in Babel gebleven waren, worden genodigd naar de stad en den tempel van Jeruzalem zich te begeven. Doch tegelijk wordt hier te kennen gegeven dat al degenen, die de verlossing, welke God door Christus beloofd heeft, wensen deelachtig te worden en voor des duivels geweld en listen beschut en beschermd te zijn, zich tot de kerk Gods begeven moeten, welke is de rechte hemelse Jeruzalem."},{"catchword":"gij gebondenen,","tekst":"Hebr. gij gebondenen der hoop, of der verwachting; dat is, gijlieden wien de hoop gegeven is, of die de hoop hebt dat gij van uwe banden zult verlost worden."},{"catchword":"ook heden verkondig Ik","tekst":"Gelijk Ik het dikwijls vóór dezen tijd verkondigd heb, alzo verkondig Ik het nu ook."},{"catchword":"dat Ik u dubbel zal wedergeven;","tekst":"De zin is: Ik zal u veel grotere gaven geven dan de verlossing uit de Babylonische gevangenschap is, namelijk geestelijke weldaden, als daar zijn vergeving der zonden, vernieuwing van het gemoed door den Heilige Geest en een eeuwig leven."}],"13":[{"catchword":"Als Ik Mij Juda","tekst":"Hier wordt het volk Gods schut en scherm beloofd tegen de vijanden, die hen bevechten en bestrijden zouden, doch alzo, dat het niet zonder strijd en gevecht afgaan zou, gelijk zulks gebleken is in de oorlogen, die de Macchabeën tegen de koningen van Azië en Syrië gevoerd hebben."},{"catchword":"gespannen,","tekst":"Hebr. getreden; want de voetbogen werden getreden als men ze spande. Anderen vertalen de eerste woorden van dit vers aldus: Nadat Ik mij Juda [als] een boog zal gespannen en Efraïm [als een pijlkoker] zal gevuld hebben."},{"catchword":"zal gevuld hebben;","tekst":"Te weten, met pijlen, om tegen de vijanden te strijden."},{"catchword":"o Griekenland","tekst":"Te weten, tegen de nakomelingen van Alexander den Grote, de koningen in Azië en Syrië, tegen welke God de Heer de Joden wonderbaarlijk beschut en bescherm heeft. Zie de boeken der Macchabeën en de geschiedenissen van Josefus."},{"catchword":"u gesteld zal hebben","tekst":"O Zion."}],"14":[{"catchword":"over henlieden verschijnen,","tekst":"Te weten, over de Joden. Anderen, over Juda en Efraïm. Anderen, tegen hen, te weten, de Grieken."},{"catchword":"Zijn pijlen","tekst":"Hebr. zijn pijl."},{"catchword":"uitvaren als een bliksem;","tekst":"Te weten, uit den hemel, tegen de vijanden van zijn volk."},{"catchword":"met stormen uit het zuiden","tekst":"Of, als een onweder. De zin is: Hij zal zich met zulk ene onstuimigheid op de vijanden der kerk werpen, gelijk de stormen, die uit het zuiden komen; zie Isa 21:1 de aantekening aldaar, en verg. Jos 10:11 , en 2Sa 5:24 ."}],"15":[{"catchword":"zal hen beschutten,","tekst":"Te weten, de Joden, strijdende tegen de Grieken."},{"catchword":"eten,","tekst":"Dat is, zij zullen hunne goederen met vrede en met vreugde genieten, nadat hunne vijanden zullen verdelgd zijn."},{"catchword":"de slingerstenen","tekst":"Dat is, de vijanden, die met slingerstenen op hen geworpen hebben. Anderen zetten deze woorden aldus over: En zij zullen hen [met] slingerstenen tenonder brengen. Eertijds plachten de krijgslieden niet alleen met pijlen, maar ook met slingers tegen elkander te vechten; zie Jdg 20:16 ."},{"catchword":"een gedruis maken als de wijn;","tekst":"Dit woelen of rumoer maken zou uit een heilige vreugde ontstaan."},{"catchword":"zij zullen vervuld worden,","tekst":"Dat is, zij zullen overvloed hebben van allerlei goederen, gelijk het bekken, hetwelk bij het altaar placht te staan, vol bloed van het geslachte vee was, en gelijk men al de hoeken van het altaar met hetzelfde bloed placht te begieten of te besprengen, Lev 3:2 , Lev 3:8 , Lev 3:13 , en Lev 7:2 . Geestelijkerwijze dit genomen zijnde is het te zeggen: Zij zullen God danken voor de weldaden, die zij van Hem ontvangen zullen. Verg. Eph 5:18-20 ."}],"16":[{"catchword":"behouden,","tekst":"Of, verlossen, of heil verschaffen, of zaligmaken, als zijnde de herder van zijn volk; zie Psa 100:3 ; Joh 10 ."},{"catchword":"gekroonde stenen","tekst":"Dat is, kolommen, of gedenkpilaren met kransen en kronen versierd. Anderen nemen het in deze zin: Want zij zullen op de aarde verheven worden als stenen der kronen; dat is, gelijk als kostelijke edele stenen, die de koningen in hunne kronen dragen. Hebr. stenen der kroon."},{"catchword":"in Zijn land,","tekst":"Te weten, in het Joodse land, hetwelk het land Gods en het heilige land genoemd wordt."},{"catchword":"als een banier,","tekst":"Tot een teken van overwinning, die God zijn volk over hunne vijanden verleend had, of verlenen zou."}],"17":[{"catchword":"zijn(e)","tekst":"Te weten, des Heeren; of hare, te weten der kerk."},{"catchword":"goed wezen","tekst":"Dat is, zijne gelukzaligheid. De zin is: Hoe grotelijks zal de Heere zijne kerk zegenen, die vervullende met eer en met heerlijkheid!"},{"catchword":"Het koren zal de jongelingen,","tekst":"Dat is, God zal hun overvloed van koren en van wijn geven, waarover zich de jonge lieden zullen verheugen en vrolijk zijn. Verg. Isa 9:2 . Verg. ook Jer 48:33 ."},{"catchword":"sprekende maken","tekst":"Of, overvloedig vrucht doen voortbrengen, te weten, de vrucht der lippen. Verg. Isa 57:19 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"The burthen of the word of the LORD upon [Or, in or, against] the land of chadrach, [the burthen here signifies a burthenson and grievous prophesie, or foretelling what should befall the land of Chadrach 9see Isa. 12. on verse 1.) whereby Syrian seemes to be understood, seeing Damascus is presently joined with it, the Metropolis of Syria. Some hold that Chadrach was the name of an idol, which the Syrians worshipped. Others read for, the land of Chaldrach, the land of honour or glory, or, the glorious land; Oth. The land that lies round thee O Judea,] and Damascus, [Heb. Damesek] the rest thereof, [Oth. Though Damascus he its rest, i.e. that which it doth rely on or though it relie and repose it self upon it, Oth. But Damascus shall be its (viz. that burthens) rest, i.e. t shall light on Damscus at last. Oth. And Damascus are shall be his rest, i.e. Gods wrath shall rest upon Damascus; he shall spare that city as little as any other place] for the LORD hath an eye (upon) man, as upon all the tribes of Israel. [Heb. To the LORD (there) is an eye, i.e the LORD hath a watchful or providential eye upon all mankind, wheresover they are all the world over, as well as upon the Jewes; by the eye of the LORd there being understood here his providence, that is, God&acirc;&euro;&trade;s omnipresent power, influence, whereby he governeth heaven and earth and all within them]"}],"2":[{"catchword":null,"tekst":"And he [viz. the LORD] shall limit Hamath also with the same: [viz. with his eye. Oth. Hamath shall limit the same. i.e. Hamath shall lie upon the borders therof. See Jos. 19.35. see of Hamath Numb. 12.21. Oth. By the same, viz. the foresaid burthen of the land, The sense seems to be, God shall order the Syrians, how far they shall advance and extend themselves, for the good of his church. Others take it thus, also shall that (burthen) limit Hamath, in the same sense] Tyre, and Zidon, though she [viz. Tyre, i.e the inhabitants or Citizens of Tyre, as also the Zidonians] be very wise; [viz. in her own conceit. See Ezech. 28. the annota. On verse 3.c.]"}],"3":[{"catchword":null,"tekst":"And tyre built her self strong holds, and gathered silver like dust, [i.e very great abundance. Compare 1 Kings 10.27. see also Psa 78:27.] and fine, as mire upon the street."}],"4":[{"catchword":null,"tekst":"Behol // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte

function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];

  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}

    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
