zal Mijn volk verlossen uit het land van het opgaan van de zon, en uit het land van het ondergaan van de zon.","8":"En Ik zal hen hierheen brengen, zodat zij in het midden van Jeruzalem wonen zullen; en zij zullen Mij tot een volk zijn, en Ik zal hun tot een God zijn, in waarheid en in gerechtigheid.","9":"Zo zegt de HEERE van de heerscharen: Laat uw handen sterk zijn, u die in deze dagen deze woorden gehoord hebt uit de mond van de profeten, die er geweest zijn op de dag dat de grond van het huis van de HEERE van de heerscharen gelegd is, zodat de tempel gebouwd zou worden.","10":"Want vóór die dagen kwam het loon van de mens tot niets, en het loon van het vee was er niet; en de uitgaande en de inkomende hadden geen vrede vanwege de vijand, want Ik zond alle mensen, ieder tegen zijn naaste.","11":"Maar nu zal Ik voor het overblijfsel van dit volk niet zijn zoals in de vorige dagen, spreekt de HEERE van de heerscharen.","12":"Want het zaad zal voorspoedig zijn, de wijnstok zal zijn vrucht geven, en de aarde zal haar opbrengst geven, en de hemel zal zijn dauw geven; en Ik zal het overblijfsel van dit volk dit alles doen erven.","13":"En het zal gebeuren: zoals u, huis van Juda, en u, huis van Israël, geweest bent een vloek onder de heidenen, zo zal Ik u behoeden, en u zult een zegen wezen; wees niet bang, laat uw handen sterk zijn.","14":"Want zo zegt de HEERE van de heerscharen: Zoals Ik van plan was u kwaad te doen, toen uw vaderen Mij zeer vertoornden, zegt de HEERE van de heerscharen, en het heeft Mij niet berouwd,","15":"zo ben Ik van plan opnieuw in deze dagen goed te doen aan Jeruzalem, en aan het huis van Juda; wees niet bang!","16":"Dit zijn de dingen die u doen zult: spreek de waarheid, ieder met zijn naaste; oordeel de waarheid en een oordeel van vrede in uw poorten.","17":"En denk niet, de een over de ander, kwaad in uw hart; en heb een valse eed niet lief; want al deze dingen zijn wat Ik haat, spreekt de HEERE.","18":"Opnieuw kwam het woord van de HEERE van de heerscharen tot mij, en Hij zei:","19":"Zo zegt de HEERE van de heerscharen: Het vasten van de vierde, en het vasten van de vijfde, en het vasten van de zevende, en het vasten van de tiende *maand*, zal voor het huis van Juda tot vreugde, en tot blijdschap, en tot vrolijke hoogtijden wezen; heb dan de waarheid en de vrede lief.","20":"Zo zegt de HEERE van de heerscharen: Nog zal het gebeuren, dat de volken, en de inwoners van veel steden, komen zullen;","21":"En de inwoners van de ene *stad* zullen gaan naar *de inwoners* van de andere, en zeggen: Laten wij vlijtig heengaan om het aangezicht van de HEERE te smeken, en om de HEERE van de heerscharen te zoeken; ik zal ook heengaan.","22":"Zo zullen veel volken, en machtige heidenvolken komen, om de HEERE van de heerscharen te Jeruzalem te zoeken, en om het aangezicht van de HEERE te smeken.","23":"Zo zegt de HEERE van de heerscharen: Het zal in die dagen gebeuren, dat tien mannen, uit allerlei talen van de heidenvolken, grijpen zullen, ja, de slip grijpen zullen van een Joodse man, en zeggen: Wij zullen met u gaan, want wij hebben gehoord dat God met u is."},"SV":{"1":"Daarna geschiedde het woord des HEEREN der heirscharen *tot* *mij*, zeggende:","2":"Alzo zegt de HEERE der heirscharen: Ik heb geijverd over Sion met een groten ijver; ja, met grote grimmigheid heb Ik over haar geijverd.","3":"Alzo zegt de HEERE: Ik ben wedergekeerd tot Sion, en Ik zal in het midden van Jeruzalem wonen; en Jeruzalem zal geheten worden een stad der waarheid, en de berg des HEEREN der heirscharen, een berg der heiligheid.","4":"Alzo zegt de HEERE der heirscharen: Er zullen nog oude mannen en oude vrouwen zitten op de straten van Jeruzalem; een ieder zal zijn stok in zijn hand hebben vanwege de veelheid der dagen.","5":"En de straten dier stad zullen vervuld worden met knechtjes en meisjes, spelende op haar straten.","6":"Alzo zegt de HEERE der heirscharen: Omdat het wonderlijk is in de ogen van het overblijfsel dezes volks in deze dagen, zou het *daarom* ook in Mijn ogen wonderlijk zijn? spreekt de HEERE der heirscharen.","7":"Alzo zegt de HEERE der heirscharen: Ziet, Ik zal Mijn volk verlossen uit het land des opgangs, en uit het land des nedergangs der zon.","8":"En Ik zal hen herwaarts brengen, dat zij in het midden van Jeruzalem wonen zullen; en zij zullen Mij tot een volk zijn, en Ik zal hun tot een God zijn, in waarheid en in gerechtigheid.","9":"Alzo zegt de HEERE der heirscharen: Laat uw handen sterk zijn, gijlieden, die in deze dagen deze woorden gehoord hebt uit den mond der profeten, die geweest zijn ten dage, als de grond van het huis des HEEREN der heirscharen gelegd is, dat de tempel gebouwd zou worden.","10":"Want voor die dagen kwam des mensen loon te niet, en het loon van het vee was geen; en de uitgaande en de inkomende hadden geen vrede vanwege den vijand, want Ik zond alle mensen, een iegelijk tegen zijn naaste.","11":"Maar nu zal Ik aan het overblijfsel dezes volks niet wezen, gelijk in de vorige dagen, spreekt de HEERE der heirscharen.","12":"Want het zaad zal voorspoedig zijn, de wijnstok zal zijn vrucht geven, en de aarde zal haar inkomen geven, en de hemelen zullen hun dauw geven; en Ik zal het overblijfsel dezes volks dit alles doen erven.","13":"En het zal geschieden, gelijk als gij, o huis van Juda! en gij, o huis Israëls! geweest zijt een vloek onder de heidenen, alzo zal Ik ulieden behoeden, en gij zult een zegening wezen; vreest niet, laat uw handen sterk zijn.","14":"Want alzo zegt de HEERE der heirscharen: Gelijk als Ik gedacht heb ulieden kwaad te doen, toen Mij uw vaderen grotelijks vertoornden, zegt de HEERE der heirscharen, en het heeft Mij niet berouwd.","15":"Alzo denk Ik wederom in deze dagen goed te doen aan Jeruzalem, en aan het huis van Juda; vreest niet!","16":"Dit zijn de dingen, die gij doen zult: spreekt de waarheid, een iegelijk met zijn naaste; oordeelt de waarheid en een oordeel des vredes in uw poorten.","17":"En denkt niet de een des anderen kwaad in ulieder hart; en hebt een valsen eed niet lief; want al deze zijn *dingen*, die Ik haat, spreekt de HEERE.","18":"Wederom geschiedde het woord des HEEREN der heirscharen tot mij, zeggende:","19":"Alzo zegt de HEERE der heirscharen: Het vasten der vierde, en het vasten der vijfde, en het vasten der zevende, en het vasten der tiende *maand*, zal den huize van Juda tot vreugde, en tot blijdschap, en tot vrolijke hoogtijden wezen; hebt dan de waarheid en den vrede lief.","20":"Alzo zegt de HEERE der heirscharen: Nog zal het geschieden, dat de volken, en de inwoners van vele steden komen zullen;","21":"En de inwoners der ene *stad* zullen gaan tot *de* *inwoners* der andere, zeggende: Laat ons vlijtig henengaan, om te smeken het aangezicht des HEEREN, en om den HEERE der heirscharen te zoeken; ik zal ook henengaan.","22":"Alzo zullen vele volken, en machtige heidenen komen, om den HEERE der heirscharen te Jeruzalem te zoeken, en om het aangezicht des HEEREN te smeken.","23":"Alzo zegt de HEERE der heirscharen: Het zal in die dagen geschieden, dat tien mannen, uit allerlei tongen der heidenen, grijpen zullen, ja, de slip grijpen zullen van een Joodsen man, zeggende: Wij zullen met ulieden gaan, want wij hebben gehoord, *dat* God met ulieden is."},"KJV":{"1":"Again the word of the LORD of hosts came *to me*, saying,","2":"Thus saith the LORD of hosts; I was jealous for Zion with great jealousy, and I was jealous for her with great fury.","3":"Thus saith the LORD; I am returned unto Zion, and will dwell in the midst of Jerusalem: and Jerusalem shall be called a city of truth; and the mountain of the LORD of hosts the holy mountain.","4":"Thus saith the LORD of hosts; There shall yet old men and old women dwell in the streets of Jerusalem, and every man with his staff in his hand for very age.","5":"And the streets of the city shall be full of boys and girls playing in the streets","6":"Thus saith the LORD of hosts; If it be marvellous in the eyes of the remnant of this people in these days, should it also be marvellous in mine eyes? saith the LORD of hosts.","7":"Thus saith the LORD of hosts; Behold, I will save my people from the east country, and from the west country;","8":"And I will bring them, and they shall dwell in the midst of Jerusalem: and they shall be my people, and I will be their God, in truth and in righteousness.","9":"Thus saith the LORD of hosts; Let your hands be strong, ye that hear in these days these words by the mouth of the prophets, which *were* in the day *that* the foundation of the house of the LORD of hosts was laid, that the temple might be built.","10":"For before these days there was no hire for man, nor any hire for beast; neither *was there any* peace to him that went out or came in because of the affliction: for I set all men every one against his neighbour.","11":"But now I *will* not *be* unto the residue of this people as in the former days, saith the LORD of hosts.","12":"For the seed *shall be* prosperous; the vine shall give her fruit, and the ground shall give her increase, and the heavens shall give their dew; and I will cause the remnant of this people to possess","13":"And it shall come to pass, *that* as ye were a curse among the heathen, O house of Judah, and house of Israel; so will I save you, and ye shall be a blessing: fear not, *but* let your hands be strong.","14":"For thus saith the LORD of hosts; As I thought to punish you, when your fathers provoked me to wrath, saith the LORD of hosts, and I repented","15":"So again have I thought in these days to do well unto Jerusalem and to the house of Judah: fear","16":"These *are* the things that ye shall do; Speak ye every man the truth to his neighbour; execute the judgment of truth and peace in your gates:","17":"And let none of you imagine evil in your hearts against his neighbour; and love no false oath: for all these *are things* that I hate, saith the LORD.","18":"And the word of the LORD of hosts came unto me, saying,","19":"Thus saith the LORD of hosts; The fast of the fourth *month*, and the fast of the fifth, and the fast of the seventh, and the fast of the tenth, shall be to the house of Judah joy and gladness, and cheerful feasts; therefore love the truth and peace.","20":"Thus saith the LORD of hosts; *It shall* yet *come to pass*, that there shall come people, and the inhabitants of many cities:","21":"And the inhabitants of one *city* shall go to another, saying, Let us go speedily to pray before the LORD, and to seek the LORD of hosts: I will go","22":"Yea, many people and strong nations shall come to seek the LORD of hosts in Jerusalem, and to pray before the LORD.","23":"Thus saith the LORD of hosts; In those days *it shall come to pass*, that ten men shall take hold out of all languages of the nations, even shall take hold of the skirt of him that is a Jew, saying, We will go with you: for we have heard *that* God"}},"tsk":{"2":[{"kopje":"Ik heb geijverd","refs":["Zach 1:14-16","Ps 78:58","Ps 78:59","Jes 42:13","Jes 42:14","Jes 59:17","Jes 63:4-6","Jes 63:15","Ezech 36:5","Ezech 36:6","Joël 2:18","Nahum 1:2","Nahum 1:6"]}],"3":[{"kopje":"Ik ben","refs":["Zach 1:16","Jer 30:10","Jer 30:11"]},{"kopje":"wonen","refs":["Zach 2:10","Zach 2:11","Jes 12:6","Ezech 48:35","Joël 3:17","Joël 3:21","Joh 1:14","Joh 14:23","2 Kor 6:16","Ef 2:21","Ef 2:22","Kol 2:9","Openb 21:3"]},{"kopje":"een stad","refs":["Zach 14:20","Zach 14:21","Jes 1:21","Jes 1:26","Jes 60:14","Jer 31:23","Jer 33:16"]},{"kopje":"de berg","refs":["Jes 2:2","Jes 2:3"]},{"kopje":"heiligheid","refs":["Jes 11:9","Jes 65:25","Jes 66:20","Openb 21:10","Openb 21:27"]}],"4":[{"kopje":"Er","refs":["1 Sam 2:31","Job 5:26","Job 42:17","Jes 65:20-22","Klaagl 2:20","Klaagl 2:21","Klaagl 2:22","Klaagl 5:11-15","Hebr 12:22"]}],"5":[{"kopje":"spelend","refs":["Zach 2:4","Ps 128:3","Ps 128:4","Ps 144:12-15","Jer 30:19","Jer 30:20","Jer 31:27","Jer 33:11","Klaagl 2:19","Matt 11:16","Matt 11:17"]}],"6":[{"kopje":"zou","refs":["Gen ata-code=\"H4941\">judgment</span> of <span class=\"wl wl-kjv\" data-code=\"H571\">truth</span> and <span class=\"wl wl-kjv\" data-code=\"H7965\">peace</span> in your gates:","17":"And let <span class=\"wl wl-kjv\" data-code=\"H376\">none</span> of you <span class=\"wl wl-kjv\" data-code=\"H2803\">imagine</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> in your <span class=\"wl wl-kjv\" data-code=\"H3824\">hearts</span> against his <span class=\"wl wl-kjv\" data-code=\"H7453\">neighbour;</span> and <span class=\"wl wl-kjv\" data-code=\"H157\">love</span> no <span class=\"wl wl-kjv\" data-code=\"H8267\">false</span> <span class=\"wl wl-kjv\" data-code=\"H7621\">oath:</span> for all these are things that I <span class=\"wl wl-kjv\" data-code=\"H8130\">hate,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.","18":"And the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts</span> came unto me, saying,","19":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts;</span> The <span class=\"wl wl-kjv\" data-code=\"H6685\">fast</span> of the <span class=\"wl wl-kjv\" data-code=\"H7243\">fourth</span> month, and the <span class=\"wl wl-kjv\" data-code=\"H6685\">fast</span> of the <span class=\"wl wl-kjv\" data-code=\"H2549\">fifth,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6685\">fast</span> of the <span class=\"wl wl-kjv\" data-code=\"H7637\">seventh,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6685\">fast</span> of the <span class=\"wl wl-kjv\" data-code=\"H6224\">tenth,</span> shall be to the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> <span class=\"wl wl-kjv\" data-code=\"H8342\">joy</span> and <span class=\"wl wl-kjv\" data-code=\"H8057\">gladness,</span> and <span class=\"wl wl-kjv\" data-code=\"H2896\">cheerful</span> <span class=\"wl wl-kjv\" data-code=\"H4150\">feasts;</span> therefore <span class=\"wl wl-kjv\" data-code=\"H157\">love</span> the <span class=\"wl wl-kjv\" data-code=\"H571\">truth</span> and peace.","20":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts;</span> It shall yet come to pass, that there shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> cities:","21":"And the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> city shall <span class=\"wl wl-kjv\" data-code=\"H1980\">go</span> to <span class=\"wl wl-kjv\" data-code=\"H259\">another,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Let us <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">speedily</span> to <span class=\"wl wl-kjv\" data-code=\"H2470\">pray</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and to <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts:</span> I will go","22":"Yea, <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> and <span class=\"wl wl-kjv\" data-code=\"H6099\">strong</span> <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts</span> in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> and to <span class=\"wl wl-kjv\" data-code=\"H2470\">pray</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the LORD.","23":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts;</span> In those <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> it shall come to pass, that <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> shall take <span class=\"wl wl-kjv\" data-code=\"H2388\">hold</span> out of all <span class=\"wl wl-kjv\" data-code=\"H3956\">languages</span> of the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations,</span> even shall take <span class=\"wl wl-kjv\" data-code=\"H2388\">hold</span> of the <span class=\"wl wl-kjv\" data-code=\"H3671\">skirt</span> of him that is a <span class=\"wl wl-kjv\" data-code=\"H376\">Jew,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> We will <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> with you: for we have <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> that God"},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"geijverd","tekst":"Te weten, om Zion te verlossen van de schande en schade, die hare vijanden haar aangedaan hebben. Ik ben met groten toorn ontstoken over degenen, die haar tiranniek vervolgd en benauwd hebben, te weten de Babyloniërs. Verg. Isa 9:6 en de aantekening aldaar."},{"catchword":"over Sion","tekst":"Dat is, over Jeruzalem, gebouwd op den berg Zion."}],"3":[{"catchword":"een stad der waarheid,","tekst":"Dat is, ene stad in welke de liefhebbers der waarheid en heiligheid wonen zullen en waar de waarheid zal gepredikt en aangenomen worden; verg. onder vs.8, 16; Zep 3:13 ; 1Ti 3:15 . Zie het tegendeel, Isa 1:21 ."}],"4":[{"catchword":"Daar zullen nog oude mannen en oude vrouwen zitten","tekst":"Dat is, Ik zal de inwoners van Jeruzalem zegenen met een groten ouderdom en met vele kinderen, zie Zech 7:5 . Dezen zegen hebben, naar de letter, genoten Zerubbabel, Jozua, Ezra, Nehemia en andere godzalige personen. Doch deze tijdelijke beloften en zegeningen moeten inzonderheid op de geestelijke weldadan van het rijk van Christus geduid worden, want de kinderen Gods zullen eeuwiglijk in vreugde in het hemelse Jeruzalem leven."},{"catchword":"vanwege de veelheid der dagen","tekst":"Vanwege zijn ouderdom."}],"5":[{"catchword":"haar straten","tekst":"Te weten, van Jeruzalem."}],"6":[{"catchword":"het","tekst":"Te weten, hetwelk straks gezegd is."},{"catchword":"wonderlijk is in de ogen","tekst":"Of, onmogelijk, gelijk Gen 18:14 . Wat bij de mensen onmogelijk is, is mogelijk bij God."},{"catchword":"in deze dagen,","tekst":"Dat is, te dezer tijd, alzo ook onder vs.9, 23."}],"7":[{"catchword":"Ik zal Mijn volk verlossen","tekst":"De zin is: Ik zal mijn volk verzamelen en samenbrengen, door de predikatie van het heilig Evangelie, van alle hoeken en kanten der ganse wereld. Verg. Mat 8:11 , en Luk 13:29 ."},{"catchword":"van den nedergang der zon","tekst":"Hebr. van den ingang; te weten, der zon. Zie Psa 19:6 ."}],"8":[{"catchword":"dat zij in het midden van Jeruzalem wonen zullen;","tekst":"Dat is, zij zullen ledematen mijner kerk zijn."},{"catchword":"in waarheid en in gerechtigheid","tekst":"Dat is, Ik zal hun zekerlijk geven hetgeen Ik hun beloofd heb, en Ik zal hen rechtvaardig maken door Jezus Christus. Verg. Hos 2:18-19 ."}],"9":[{"catchword":"Laat uw handen sterk zijn,","tekst":"Dat is, vaart dapper voort met den bouw des tempels, bezijden stellende uw eigen voordeel, den kwaden raad der te zeer achterdochtige mensen, of de vrees der vijanden; hoort en gehoorzaamt de woorden en vermaningen der profeten alleen, als daar zijn Haggaï, ik Zacharia en anderen. Zie Ezr 5:1-2 ."},{"catchword":"die geweest zijn ten dage,","tekst":"Anders, dat men van dien dag aan, als de grond gelegd is aan het huis des Heeren der heirscharen, de tempel zou gebouwd hebben."}],"10":[{"catchword":"voor die dagen","tekst":"Te weten, in welke nu niet voortgevaren is met den bouw des tempels."},{"catchword":"kwam des mensen loon te niet,","tekst":"Naar de Hebr. letter, was het loon des mensen niet. De zin is: Gelijk gijlieden traag en spaarzaam waart in het opbouwen van den tempel, alzo was ook de Heere traag en spaarzaam in ulieden zijnen zegen te geven, maat alle ding was duur, en gij werdt van uwe vijanden jammerlijk geplaagd. Ja het was al tevergeefs wat gijlieden bij de hand naamt, God vervloekte al uwen arbeid. Zie Hag 1:6 , Hag 1:10 , en Hag 2:16-17 ."},{"catchword":"van het vee","tekst":"Of, van het dier; te weten van het lastdragende vee, of dier, als daar zijn paarden, kemels, ezels, ossen, enz. De mensen verdienden geen geld daarmede, daar was niets te doen."},{"catchword":"was geen;","tekst":"Dat is, al hun arbeid was tevergeefs, het land droeg gene vruchten, ofschoon het bearbeid en bebouwd werd."},{"catchword":"de uitgaande en de inkomende hadden geen vrede","tekst":"Dat is, niemand mocht of kon met vrede uit of in Jeruzalem komen; de lopende en stropende soldaten, ja zelfs enige uwer vijanden, die ulieden uwe welvaart misgunden en niet gaarne zagen dat Jeruzalem weder opgebouwd werd, deden ulieden allen hinder en schade, waar zij konden of mochten. Verg. hiermede de dreigementen Gods, Deu 28:16 , Deu 28:19 ; 2Ch 15:5 ."},{"catchword":"vanwege den vijand,","tekst":"Of, vanwege de benauwing. Het Hebr. woord betekent een vijand en een vijandelijke benauwing."},{"catchword":"Ik zond alle mensen,","tekst":"De zin is: Ik beschikte door mijn rechtvaardig oordeel dat de mensen elkander vervolgden en verdierven; ja Ik zond hen tegen elkander aan. De Heere // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
