en doen, het Koninkrijk van God niet zullen beërven.", "2 Kron 20:3-30": "Josafat nu werd bevreesd, en richtte zich erop om de HEERE te zoeken; en hij riep een vasten uit in heel Juda. En Juda kwam bijeen om hulp te zoeken bij de HEERE; ook kwamen zij uit alle steden van Juda om de HEERE te zoeken. En Josafat stond in de samenkomst van Juda en Jeruzalem, in het huis van de HEERE, voor het nieuwe voorhof.", "Ps 81:14-17": "Och, dat Mijn volk naar Mij geluisterd had, dat Israël in Mijn wegen had gewandeld! In korte tijd zou Ik hun vijanden onderworpen hebben, en Mijn hand gewend hebben tegen hun tegenstanders. Zij die de HEERE haten, zouden zich Hem geveinsd onderworpen hebben, maar hun tijd zou eeuwig geweest zijn.", "Hos 5:15": "Ik zal heengaan en terugkeren naar Mijn plaats, totdat zij zichzelf schuldig weten en Mijn aangezicht zoeken; als het hun bang te moede is, zullen zij Mij vroeg zoeken.", "Jer 31:23": "Zo zegt de HEERE van de heerscharen, de God van Israël: Dit woord zullen zij nog zeggen in het land van Juda, en in zijn steden, wanneer Ik hun gevangenschap ombuigen zal: De HEERE zegent u, woning van de gerechtigheid, berg van de heiligheid!", "Matt 15:7-9": "Huichelaars! Terecht heeft Jesaja over u geprofeteerd, toen hij zei: Dit volk nadert Mij met hun mond, en eert Mij met de lippen, maar hun hart houdt zich ver van Mij; Maar tevergeefs eren zij Mij, terwijl zij leringen leren die geboden van mensen zijn.", "Zach 9:16": "En de HEERE, hun God, zal hen op die dag behouden, als de kudde van Zijn volk; want gekroonde stenen zullen in Zijn land, als een banier, opgericht worden.", "Joël 2:28": "En daarna zal het gebeuren, dat Ik Mijn Geest zal uitgieten over alle vlees, en uw zonen en uw dochters zullen profeteren; uw ouden zullen dromen dromen, uw jongelingen zullen gezichten zien;", "Job 5:8": "Doch ik zou God zoeken, en tot God mijn aanspraak richten;", "Rom 1:29-32": "vervuld met alle ongerechtigheid, hoererij, boosheid, hebzucht, kwaadaardigheid; vol afgunst, moord, twist, bedrog, kwaadwilligheid; kwaadsprekers, lasteraars, haters van God, smaders, hoogmoedigen, laatdunkende, vinders van kwade dingen, ongehoorzaam aan hun ouders; onverstandigen, verbondbrekers, zonder natuurlijke liefde, onverzoenlijken, onbarmhartigen;", "2 Kon 17:18-20": "Daarom werd de HEERE zeer toornig op Israël, zodat Hij hen wegdeed van Zijn aangezicht; er bleef niets over, behalve de stam van Juda alleen. Zelfs Juda hield de geboden van de HEERE, hun God, niet; maar zij wandelden in de inzettingen van Israël, die zij gemaakt hadden. Zo verwierp de HEERE heel het nageslacht van Israël, en onderdrukte hen, en gaf hen in de hand van rovers, totdat Hij hen van Zijn aangezicht weggeworpen had.", "Gal 2:17": "Maar als wij, die in Christus zoeken gerechtvaardigd te worden, ook zelf zondaars blijken te zijn, is Christus dan een dienaar van de zonde? Dat zij verre.", "Gal 3:13": "Christus heeft ons verlost van de vloek van de wet, doordat Hij voor ons een vloek geworden is; want er is geschreven: Vervloekt is ieder die aan het hout hangt.", "Zach 14:2": "Want Ik zal alle heidenen tegen Jeruzalem ten strijde verzamelen; en de stad zal ingenomen worden, en de huizen zullen geplunderd worden, en de vrouwen zullen geschonden worden; en de helft van de stad zal uitgaan in de gevangenis, maar het overige van het volk zal uit de stad niet uitgeroeid worden.", "Ps 148:13": "Laat hen de Naam van de HEERE loven; want Zijn Naam alleen is hoog verheven; Zijn majesteit is over de aarde en de hemel.", "Zef 1:18": "Ook hun zilver, ook hun goud zal hen niet kunnen redden op de dag van de verbolgenheid van de HEERE; maar door het vuur van het ijver van Hem zal dit hele land verteerd worden; want Hij zal een voleinding maken, zeker, een haastige, met alle inwoners van dit land.", "Rom 9:15": "Want Hij zegt tegen Mozes: Ik zal Mij ontfermen over wie Ik Mij ontferm, en zal barmhartig zijn voor wie Ik barmhartig ben.", "Ps 36:8": "Hoe dierbaar is Uw goedertierenheid, o God! Daarom nemen de mensenkinderen onder de schaduw van Uw vleugels toevlucht.", "Jer 4:14": "Was uw hart van slechtheid, o Jeruzalem! opdat u behouden wordt; hoe lang zult u de gedachten van uw ijdelheid in uw binnenste laten overnachten?", "Spr 11:20": "De verkeerden van hart zijn de HEERE een gruwel; maar de oprechten van weg zijn Zijn welgevallen.", "Ps 119:161": "Schin. De vorsten hebben mij vervolgd zonder oorzaak; maar mijn hart heeft gevreesd voor Uw woord.", "Hebr 10:13": "verder wachtend, totdat Zijn vijanden neergelegd worden als een voetbank voor Zijn voeten.", "Hand 2:17-21": "En het zal gebeuren in de laatste dagen, zegt God, dat Ik van Mijn Geest zal uitstorten op alle vlees; en uw zonen en uw dochters zullen profeteren, en uw jongemannen zullen visioenen zien, en uw ouden zullen dromen dromen. En ook op Mijn dienstknechten, en op Mijn dienstmaagden, zal Ik in die dagen van Mijn Geest uitstorten, en zij zullen profeteren. En Ik zal wonderen geven in de hemel boven, en tekenen op de aarde beneden: bloed en vuur en rookwalm.", "Jes 44:4": "En zij zullen uitspruiten tussen het gras, als de wilgen aan de waterbeken.", "Ef 5:8-11": "Want u was eertijds duisternis, maar nu bent u licht in de Heere; wandel als kinderen van het licht. (Want de vrucht van de Geest bestaat in alle goedheid, en rechtvaardigheid, en waarheid), terwijl u beproeft wat de Heere welgevallig is.", "Zach 11:12": "Want ik had tegen hen gezegd: Als het goed is in uw ogen, breng mijn loon, en zo niet, laat het na. En zij hebben mijn loon gewogen, dertig zilverlingen.", "Zach 1:17": "Roep nog, en zeg: Zo zegt de HEERE van de heerscharen: Mijn steden zullen nog uitgespreid worden vanwege de voorspoed; want de HEERE zal Sion nog troosten, en Hij zal Jeruzalem nog verkiezen.", "Job 35:14": "Dat u ook gezegd hebt: U zult Hem niet aanschouwen; er is toch een oordeel voor Zijn aangezicht, wacht u dan op Hem.", "Hoogl 3:1-4": "Ik zocht 's nachts op mijn bed Hem, Die mijn ziel liefheeft; ik zocht Hem, maar ik vond Hem niet; ik zei: ... Ik zal nu opstaan, en in de stad omgaan, in de wijken en in de straten; ik zal Hem zoeken, Die mijn ziel liefheeft; ik zocht Hem, maar ik vond Hem niet. De wachters, die in de stad omgingen, vonden mij: ik zei: Hebt u Die gezien, Die mijn ziel liefheeft?", "Ef 5:29": "Want niemand heeft ooit zijn eigen vlees gehaat, maar hij voedt het, en verzorgt het, zoals ook de Heere de Gemeente.", "Jes 56:6-8": "En de vreemdelingen, die zich bij de HEERE voegen om Hem te dienen, en om de Naam van de HEERE lief te hebben, om Hem tot knechten te zijn; ieder die de sabbat houdt, zodat hij die niet ontheiligt, en die aan Mijn verbond vasthouden; Die zal Ik ook brengen naar Mijn heilige berg, en Ik zal hen verheugen in Mijn huis van gebed; hun brandoffers en hun slachtoffers zullen aangenaam zijn op Mijn altaar; want Mijn huis zal een huis van gebed genoemd worden voor alle volken. De Heere HEERE, Die de verdrevenen van Israël bijeenbrengt, spreekt: Ik zal er bij hem nog meer bijeenbrengen, naast hen die al bij hem bijeengebracht zijn.", "Jes 1:19": "Als u willig bent en luistert, zult u het goede van dit land eten;", "Spr 24:17": "Verblijd u niet, als uw vijand valt; en als hij neerstruikelt, laat uw hart zich niet verheugen;", "Ps 66:14": "Die mijn lippen hebben geuit, en mijn mond heeft uitgesproken, toen het mij bang te moede was.", "Hand 2:21": "En het zal gebeuren dat ieder die de Naam van de Heere zal aanroepen, behouden zal worden.", "Ps 48:2": "De HEERE is groot en zeer te prijzen, in de stad van onze God, op de berg van Zijn heiligheid.", "Hand 24:16": "En hierin oefen ik mijzelf, om altijd een onberispelijk geweten te hebben bij God en de mensen.", "Hagg 2:24": "Op die dag, spreekt de HEERE van de heerscharen, zal Ik u nemen, Zerubbabel, zoon van Sealthiël, Mijn dienstknecht! spreekt de HEERE, en Ik zal u stellen als een zegelring; want Ik heb u verkozen, spreekt de HEERE van de heerscharen.", "Klaagl 3:25": "Teth. De HEERE is goed voor hen die Hem verwachten, voor de ziel die Hem zoekt.", "Ps 97:10": "U die de HEERE liefhebt: haat het kwade; Hij bewaart de zielen van Zijn gunstgenoten; Hij redt hen uit de hand van de goddelozen.", "Ps 102:26-28": "U hebt voormaals de aarde gegrond, en de hemelen zijn het werk van Uw handen; Die zullen vergaan, maar U zult staande blijven; en zij alle zullen als een kleed verouderen; U zult ze veranderen als een gewaad, en zij zullen veranderd zijn. Maar U bent Dezelfde, en Uw jaren zullen niet geëindigd worden.", "Jer 3:17": "In die tijd zullen zij Jeruzalem noemen: de troon van de HEERE; en alle heidenvolken zullen daar samenkomen, vanwege de Naam van de HEERE, in Jeruzalem; en zij zullen niet meer wandelen naar het goeddunken van hun slechte hart.", "Num 22:12": "Toen zei God tegen Bileam: U mag niet met hen meegaan; u mag dat volk niet vervloeken, want het is gezegend.", "Ex 40:34": "Toen bedekte de wolk de tent der samenkomst; en de heerlijkheid van de HEERE vervulde de tabernakel.", "Rom 12:20": "Als dan uw vijand honger heeft, geef hem te eten; als hij dorst heeft, geef hem te drinken; want als u dat doet, zult u kolen van het vuur op zijn hoofd hopen.", "Klaagl 2:20": "Resch. Zie, HEERE, aanschouw toch, aan wie Gij zo gedaan hebt; zullen dan de vrouwen haar vrucht eten, de kinderen die men op de handen draagt? Zullen dan de profeet en de priester in het heiligdom van de Heere gedood worden?", "Hebr 8:8-12": "Want omdat Hij hen berispt, zegt Hij tegen hen: Zie, de dagen komen, spreekt de Heere, dat Ik over het huis van Israël en over het huis van Juda een nieuw verbond zal oprichten; Niet naar het verbond dat Ik met hun vaderen gemaakt heb, op de dag dat Ik hen bij de hand nam om hen uit Egypteland te leiden; want zij zijn in dit Mijn verbond niet gebleven, en Ik heb niet meer naar hen omgekeken, zegt de Heere. Want dit is het verbond dat Ik met het huis van Israël maken zal na die dagen, zegt de Heere: Ik zal Mijn wetten in hun verstand geven, en in hun harten zal Ik ze inschrijven; en Ik zal hun tot een God zijn, en zij zullen Mij tot een volk zijn.", "Num 14:22": "Want al de mannen die Mijn heerlijkheid gezien hebben, en Mijn tekenen, die Ik in Egypte en in de woestijn gedaan heb, en Mij nu tien keer beproefd hebben, en niet gehoorzaam zijn geweest aan Mijn stem;", "Ps 35:13": "Mij aangaande daarentegen, toen zij ziek waren, was een zak mijn kleed; ik kwelde mijn ziel met vasten, en mijn gebed keerde weer in mijn boezem.", "Est 8:17": "Ook in elk landschap, en in elke stad, op elke plaats waar het woord van de koning en zijn wet aankwam, daar was bij de Joden blijdschap en vreugde, maaltijden en vrolijke dagen; en velen uit de volken van het land werden Joden, want de vreze voor de Joden was op hen gevallen.", "Ps 81:11": "Ik ben de HEERE, uw God, Die u heb opgevoerd uit het land van Egypte; doe uw mond wijd open, en Ik zal hem vullen.", "Deut 10:15": "Alleen heeft de HEERE behagen gehad in uw vaderen, om hen lief te hebben, en heeft hun nageslacht na hen, u, uit alle volken uitverkoren, zoals het op deze dag is.", "Spr 3:2": "Want lengte van dagen, en jaren van leven, en vrede zullen zij u vermeerderen.", "Matt 4:16": "het volk dat in duisternis zat, heeft een groot licht gezien; en over hen die zaten in het land en de schaduw van de dood, is een licht opgegaan.", "Jes 66:1": "Zo zegt de HEERE: De hemel is Mijn troon, en de aarde is de voetbank van Mijn voeten; waar zou dat huis zijn, dat u Mij zou bouwen, en waar is de plaats van Mijn rust?", "Mark 1:3": "De stem van hem die roept in de woestijn: Bereid de weg van de Heere, maak Zijn paden recht.", "Ps 69:26": "Hun paleis worde verwoest; in hun tenten zij geen inwoner.", "Ps 63:4": "Want Uw goedertierenheid is beter dan het leven; mijn lippen zouden U prijzen.", "Spr 8:35": "Want die Mij vindt, vindt het leven, en verkrijgt een welgevallen van de HEERE.", "1 Tim 1:10": "De hoereerders, mannen die met mannen omgang hebben, de mensenrovers, de leugenaars, de meinedigen, en al wat verder tegen de gezonde leer ingaat;", "Matt 3:3": "Want deze is het, van wie gesproken is door Jesaja, de profeet, toen hij zei: De stem van hem die roept in de woestijn: Bereid de weg van de Heere, maak Zijn paden recht!", "Hos 14:3": "Neem deze woorden met u, en bekeer u tot de Heere; zeg tegen Hem: Neem weg alle ongerechtigheid, en geef het goede, zo zullen wij betalen de stieren van onze lippen.", "Ps 29:11": "De HEERE zal Zijn volk sterkte geven; de HEERE zal Zijn volk zegenen met vrede.", "Jes 52:1": "Word wakker, word wakker, trek uw sterkte aan, o Sion! Trek uw sierlijke kleren aan, o Jeruzalem, u heilige stad! Want in u zal voortaan geen onbesnedene of onreine meer komen.", "Job 28:28": "Maar tegen de mens heeft Hij gezegd: Zie, de vreze des Heeren, dat is de wijsheid, en van het kwade te wijken is het verstand.", "Matt 18:21": "Toen kwam Petrus bij Hem en zei: Heere, hoeveel keer zal mijn broeder tegen mij zondigen en ik hem vergeven? Tot zeven keer?", "Ps 10:14": "U ziet het zeker; want U aanschouwt de moeite en het verdriet, opdat men het in Uw hand geeft; op U verlaat de arme zich, U bent geweest een Helper van de wees.", "Jes 63:7-9": "Ik zal de blijken van goedertierenheid van de HEERE vermelden, de veelvoudige lof van de HEERE, naar alles wat de HEERE ons heeft bewezen, en de grote goedheid aan het huis van Israël, die Hij hun bewezen heeft, naar Zijn barmhartigheden, en naar de veelheid van Zijn blijken van goedertierenheid. Want Hij zei: Zij zijn zeker Mijn volk, kinderen die niet liegen zullen? Zo is Hij hun geworden tot een Heiland. In al hun benauwdheid was Hij benauwd, en de Engel van Zijn aangezicht heeft hen behouden; door Zijn liefde en door Zijn genade heeft Hij hen verlost; en Hij nam hen op, en Hij droeg hen al de dagen van ouds.", "Gen 21:12": "Maar God zei tegen Abraham: Laat het niet kwaad zijn in uw ogen vanwege de jongen en vanwege uw slavin; alles wat Sara tegen u zegt, luister naar haar stem; want in Izak zal uw nageslacht genoemd worden.", "Ezech 22:8": "Mijn heilige dingen hebt u veracht, en Mijn sabbatten hebt u ontheiligd.", "Ps 120:7": "Ik ben vreedzaam; maar als ik spreek, zijn zij uit op oorlog.", "Spr 14:19": "De kwaden buigen neer voor de goeden, en de goddelozen voor de poorten van de rechtvaardige.", "Matt 21:4": "Dit alles nu is gebeurd, opdat vervuld werd wat gesproken is door de profeet, die zei:", "Luk 22:29": "En Ik ken u het Koninkrijk toe, zoals Mijn Vader dat Mij toegekend heeft;", "Jes 33:17": "Uw ogen zullen de Koning zien in Zijn schoonheid; zij zullen een ver gelegen land zien.", "Ps 51:20": "Doe goed bij Sion naar Uw welbehagen; bouw de muren van Jeruzalem op.", "Ef 5:1": "Wees dan navolgers van God, als geliefde kinderen;", "Kol 1:24": "die mij nu verblijd in mijn lijden voor u, en aanvult in mijn vlees wat nog ontbreekt aan de verdrukkingen van Christus, voor Zijn lichaam, dat is de Gemeente;", "Jer 33:22": "Zoals het leger van de hemel niet geteld, en het zand van de zee niet gemeten kan worden, zo zal Ik het nageslacht van Mijn knecht David vermenigvuldigen, en de Levieten die Mij dienen.", "Deut 11:8": "Houd dan alle geboden, die ik u heden gebied; opdat u sterk wordt en het land binnengaat, en het erft, waarheen u overtrekt, om dat te erven;", "Matt 15:4": "Want God heeft geboden en gezegd: Eer uw vader en moeder, en: Wie vader of moeder vervloekt, die zal de dood sterven.", "Hebr 8:5": "Deze priesters dienen het voorbeeld en de schaduw van de hemelse dingen, zoals Mozes door een goddelijke aanwijzing gewaarschuwd werd toen hij de tabernakel zou voltooien: Want, zegt Hij, zie erop toe dat u alles maakt naar het patroon dat u op de berg getoond is.", "Kol 1:22": "in het lichaam van Zijn vlees, door de dood, opdat Hij u heilig en onberispelijk en onbeschuldigbaar voor Zich zou stellen;", "Jer 33:16": "In die dagen zal Juda verlost worden, en Jeruzalem zal veilig wonen; en dit is de naam waarmee zij genoemd zal worden: De Heere, ONZE GERECHTIGHEID.", "Lev 25:23": "Het land ook zal niet voor altijd verkocht worden; want het land is van Mij, omdat u vreemdelingen en bijwoners bij Mij bent.", "Gen 2:2": "Toen God op de zevende dag Zijn werk voltooid had, dat Hij gemaakt had, heeft Hij op de zevende dag gerust van al Zijn werk, dat Hij gemaakt had.", "Rom 4:8": "Gelukkig is de man, aan wie de Heere de zonden niet toerekent.", "Gen 35:3": "En laten wij ons opmaken en optrekken naar Bethel; en ik zal daar een altaar maken voor de God Die mij antwoordt op de dag van mijn benauwdheid, en met mij geweest is op de weg die ik gegaan heb.", "Ps 22:9": "Hij heeft het op de HEERE gewenteld, dat Hij hem nu uithelpt, dat Hij hem redt, omdat Hij lust aan hem heeft!", "Gen 22:16": "En zei: Ik zweer bij Mijzelf, spreekt de HEERE; omdat u dit gedaan hebt, en uw zoon, uw enige, niet onthouden hebt;", "2 Kron 29:15": "En zij verzamelden hun broeders, en heiligden zich, en kwamen, volgens het gebod van de koning, door de woorden van de HEERE, om het huis van de HEERE te reinigen.", "Ps 145:5-7": "He. Ik zal uitspreken de heerlijkheid van de eer van Uw majesteit, en Uw wonderlijke daden. Vau. En zij zullen vermelden de kracht van Uw ontzagwekkende daden; en Uw grootheid, die zal ik vertellen. Zain. Zij zullen de gedachtenis van de grootheid van Uw goedheid overvloedig uitstorten, en zij zullen Uw gerechtigheid met gejuich verkondigen.", "1 Petr 3:15": "maar heilig God, de Heere, in uw harten; en wees altijd bereid tot verantwoording aan ieder die u rekenschap vraagt van de hoop die in u is, met zachtmoedigheid en vreze,", "Mark 15:10": "(Want hij wist dat de overpriesters Hem uit afgunst overgeleverd hadden.)", "Hebr 10:5-7": "Daarom zegt Hij, bij Zijn komst in de wereld: Slachtoffer en offergave hebt U niet gewild, maar U hebt Mij een lichaam toebereid; Brandoffers en offers voor de zonde hebben U niet behaagd. Toen zei Ik: Zie, Ik kom (in het begin van het boek is over Mij geschreven) om Uw wil te doen, o God!", "Gen 22:17": "Voorzeker zal Ik u rijk zegenen, en uw nageslacht zeer talrijk maken, als de sterren van de hemel, en als het zand dat aan de oever van de zee is; en uw nageslacht zal de poort van zijn vijanden erfelijk bezitten.", "Jer 21:12": "O huis van David! zo zegt de HEERE: Spreek 's morgens recht, en bevrijd de beroofde uit de hand van de verdrukker; anders zal Mijn gramschap uitvaren als een vuur, en branden, zodat niemand het blussen kan, vanwege de slechtheid van uw daden.", "Ps 15:1-3": "Een psalm van David. HEERE, wie zal verblijven in Uw tent? Wie zal wonen op de berg van Uw heiligheid? Die oprecht wandelt, en gerechtigheid doet, en die met zijn hart de waarheid spreekt; Die met zijn tong niet lastert, zijn metgezellen geen kwaad doet, en geen smaad uit over zijn naaste;", "Lev 26:17": "Daartoe zal Ik Mijn aangezicht tegen u zetten, zodat u geslagen zult worden voor het aangezicht van uw vijanden; en uw haters zullen over u heersen, en u zult vluchten, ook al vervolgt u niemand.", "Rom 4:17": "(Zoals geschreven staat: Ik heb u tot een vader van veel volken gesteld) voor Hem, aan Wie hij geloofd heeft, namelijk God, Die de doden levend maakt, en de dingen die niet zijn roept alsof zij waren;", "2 Kron 12:1-12": "Het gebeurde nu, toen Rehabeam het koninkrijk bevestigd had en hij sterk geworden was, dat hij de wet van de HEERE verliet, en heel Israël met hem. Daarom gebeurde het, in het vijfde jaar van koning Rehabeam, dat Sisak, de koning van Egypte, tegen Jeruzalem optrok (want zij hadden tegen de HEERE overtreden), met duizend tweehonderd wagens, en met zestigduizend ruiters; en van het volk dat met hem uit Egypte kwam was geen getal: Libiërs, Sukkieten en Cusjieten.", "Ex 33:19": "Doch Hij zei: Ik zal al Mijn goedheid voorbij uw aangezicht laten gaan, en zal de Naam van de HEERE uitroepen voor uw aangezicht; maar Ik zal genadig zijn aan wie Ik genadig zal zijn, en Ik zal Mij ontfermen over wie Ik Mij ontfermen zal.", "Matt 5:28": "Maar Ik zeg u, dat ieder die naar een vrouw kijkt om haar te begeren, al overspel met haar gepleegd heeft in zijn hart.", "Ex 19:21-24": "En de HEERE zei tot Mozes: Ga af, waarschuw dit volk, dat zij niet doorbreken naar de HEERE om te zien, en velen van hen vallen. Daartoe zullen ook de priesters, die tot de HEERE naderen, zich heiligen, dat de HEERE niet tegen hen uitbreekt. Toen zei Mozes tot de HEERE: Het volk zal de berg Sinaï niet kunnen beklimmen, want U hebt ons gewaarschuwd en gezegd: Bepaal de grens van de berg, en heilig hem.", "Luk 13:29": "En er zullen mensen komen van oost en west, en van noord en zuid, en zullen aanzitten in het Koninkrijk van God.", "Ex 20:12": "Eer uw vader en uw moeder, opdat uw dagen verlengd worden in het land dat de HEERE, uw God, u geeft.", "Hagg 2:5-10": "Toch nu, wees sterk, Zerubbabel! spreekt de HEERE; en wees sterk, Josua, zoon van Jozadak, hogepriester! en wees sterk, al u volk van het land! spreekt de HEERE; en werk, want Ik ben met u, spreekt de HEERE van de heerscharen; Met het woord, waarmee Ik met u een verbond gemaakt heb, toen u uit Egypte trok, en met Mijn Geest, die in uw midden staat: wees niet bevreesd! Want zo zegt de HEERE van de heerscharen: Nog eenmaal, over een korte tijd, zal het zover zijn; en Ik zal de hemel, en de aarde, en de zee, en het droge doen beven.", "Ps 148:14": "En Hij heeft de hoorn van Zijn volk verhoogd, de roem van al Zijn gunstgenoten, van de kinderen van Israël, het volk, dat dicht bij Hem is. Halleluja!", "Ef 5:23-27": "want de man is het hoofd van de vrouw, zoals ook Christus het Hoofd van de Gemeente is; en Hij is de Behouder van het lichaam. Daarom, zoals de Gemeente aan Christus onderdanig is, zo ook de vrouwen aan hun eigen mannen in alles. Mannen, heb uw eigen vrouwen lief, zoals ook Christus de Gemeente liefgehad heeft, en Zichzelf voor haar heeft overgegeven,", "Hebr 4:16": "Laat ons dan met vrijmoedigheid toegaan tot de troon van de genade, opdat wij barmhartigheid mogen verkrijgen en genade vinden om geholpen te worden op de tijd dat wij het nodig hebben.", "Jes 19:25": "Want de HEERE van de heerscharen zal hen zegenen en zeggen: Gezegend zij Mijn volk, de Egyptenaars, en de Assyriërs, het werk van Mijn handen, en Israël, Mijn erfdeel!", "Jes 13:3": "Ik heb Mijn geheiligden bevel gegeven; ook heb Ik tot Mijn toorn geroepen Mijn helden, hen die zich verheugen in Mijn hoogheid.", "Jes 65:1": "Ik ben gevonden door hen die naar Mij niet vroegen; Ik ben gevonden door hen die Mij niet zochten; tegen het volk, dat naar Mijn Naam niet genoemd was, heb Ik gezegd: Zie, hier ben Ik, zie, hier ben Ik.", "Jes 34:2-6": "Want de toorn van de HEERE is over alle heidenvolken, en grimmigheid over heel hun leger; Hij heeft hen met de ban geslagen, Hij heeft ze ter slachting overgegeven. En hun gesneuvelden zullen weggeworpen worden, en van hun dode lichamen zal hun stank opstijgen; en de bergen zullen smelten van hun bloed. En heel het leger van de hemelen zal wegkwijnen, en de hemelen zullen worden opgerold als een boek, en heel hun leger zal afvallen, zoals een blad van de wijnstok afvalt, en zoals een vijg afvalt van de vijgenboom.", "Hand 7:50": "Heeft Mijn hand niet al deze dingen gemaakt?", "Ex 9:16": "Maar juist daarom heb Ik u laten opstaan, opdat Ik Mijn kracht aan u zou tonen, en opdat men Mijn Naam vertelt op de hele aarde.", "Luk 20:37": "En dat de doden opgewekt zullen worden, heeft ook Mozes aangewezen bij de doornstruik, toen hij de Heere de God van Abraham noemt, en de God van Izak, en de God van Jakob.", "Zach 9:9": "Verheug u zeer, dochter van Sion! Juich, dochter van Jeruzalem! Zie, uw Koning zal tot u komen, rechtvaardig, en Hij is een Heiland; arm, en rijdend op een ezel, en op een veulen, het jong van de ezelinnen.", "Spr 3:10": "Zo zullen uw schuren met overvloed gevuld worden, en uw perskuipen van most overlopen.", "2 Kor 6:18": "en Ik zal u tot een Vader zijn, en u zult Mij tot zonen en dochters zijn, zegt de Heere, de Almachtige.", "Spr 18:5": "Het is niet goed, partij te kiezen voor de goddeloze, om de rechtvaardige in het gericht te buigen.", "Ps 69:24": "Laat hun ogen duister worden, dat zij niet zien; en doe hun heupen voortdurend waggelen.", "Ps 25:15": "Ain. Mijn ogen zijn voortdurend op de HEERE, want Hij zal mijn voeten uit het net uitvoeren.", "Jer 15:16": "Toen Uw woorden gevonden werden, heb ik ze opgegeten, en Uw woord is mij geweest tot vreugde en tot blijdschap van mijn hart; want ik ben naar Uw Naam genoemd, o HEERE, God van de heerscharen!", "Ps 118:26": "Gezegend is hij die daar komt in de Naam van de HEERE! Wij zegenen u uit het huis van de HEERE.", "Jes 4:2-6": "Op die dag zal de SPRUIT van de HEERE tot sieraad en heerlijkheid zijn, en de vrucht van de aarde tot voortreffelijkheid en tot versiering voor hen die ontkomen zullen in Israël. En het zal gebeuren, dat wie overgebleven is in Sion, en wie overgelaten is in Jeruzalem, heilig genoemd zal worden, ieder die opgeschreven is ten leven in Jeruzalem; wanneer de Heere de drek van de dochters van Sion zal hebben afgewassen, en de bloedschuld van Jeruzalem uit haar midden zal hebben verdreven, door de Geest van het oordeel en door de Geest van de uitbranding.", "Jes 10:23": "Want een verdelging, die vast besloten is, zal de Heere HEERE van de heerscharen doen in het midden van dit hele land.", "Joh 10:34": "Jezus antwoordde hun: Staat er niet geschreven in uw wet: Ik heb gezegd, u bent goden?", "Ps 68:7": "Een God, Die de eenzamen zet in een gezin, uitleidt wie in boeien gevangen zitten; maar de afvalligen wonen in het dorre land.", "Gen 17:1": "Toen Abram negenennegentig jaar oud was, verscheen de HEERE aan Abram en zei tegen hem: Ik ben God, de Almachtige! Wandel voor Mijn aangezicht en wees oprecht!", "Jer 47:6": "O wee, u zwaard van de HEERE! Hoe lang zult u niet stil houden? Vaar in uw schede, rust en wees stil!", "Matt 17:21": "Maar dit soort gaat niet weg dan door bidden en vasten.", "Luk 14:26-33": "Als iemand bij Mij komt en niet zijn vader, en moeder, en vrouw, en kinderen, en broers, en zussen, ja, zelfs ook zijn eigen leven haat, die kan Mijn discipel niet zijn. En wie zijn kruis niet draagt en Mij navolgt, die kan Mijn discipel niet zijn. Want wie van u die een toren wil bouwen, gaat niet eerst zitten om de kosten te berekenen, of hij wel genoeg heeft om het af te maken?", "Jes 23:17": "Want het zal gebeuren aan het einde van zeventig jaren, dat de HEERE Tyrus zal bezoeken, en dat zij zal terugkeren tot haar hoerenloon, en zij zal hoererij bedrijven met alle koninkrijken van de aarde, die op de aardbodem zijn.", "Ex 2:13": "De volgende dag ging hij er weer op uit, en zie, twee Hebreeuwse mannen waren aan het vechten; en hij zei tegen degene die ongelijk had: Waarom slaat u uw naaste?", "Jes 8:18": "Zie, ik en de kinderen die de HEERE mij gegeven heeft, zijn tot tekenen en tot wonderen in Israël, van de HEERE van de heerscharen, Die op de berg Sion woont.", "1 Tim 2:2": "voor koningen en allen die in hoge positie zijn, opdat wij een rustig en stil leven kunnen leiden in alle godsvrucht en eerbaarheid.", "Ps 27:8": "Mijn hart zegt tegen U: U zegt: Zoek Mijn aangezicht; ik zoek Uw aangezicht, o HEERE!", "Hebr 4:7": "bepaalt Hij opnieuw een zekere dag, namelijk heden, doordat Hij door David zegt, zo lange tijd daarna (zoals gezegd is): Heden, als u Zijn stem hoort, verhard dan uw harten niet.", "1 Kor 3:17": "Als iemand de tempel van God schendt, die zal God schenden; want de tempel van God is heilig, en dat bent u.", "Hand 2:1-4": "En toen de dag van het Pinksterfeest vervuld werd, waren zij allen eendrachtig bijeen. En er kwam plotseling uit de hemel een geluid, als van een geweldige, gedreven wind, en het vervulde het hele huis waar zij zaten. En er werden door hen verdeelde tongen gezien, als van vuur, en het zat op ieder van hen.", "Lev 25:55": "Want de kinderen van Israël zijn voor Mij dienstknechten; Mijn dienstknechten zijn zij, die Ik uit het land Egypte geleid heb; Ik ben de HEERE, uw God!", "Jes 37:6": "En Jesaja zei tegen hen: Zo moet u tegen uw heer zeggen: Zo zegt de HEERE: Wees niet bang voor de woorden die u gehoord hebt, waarmee de knechten van de koning van Assyrië Mij gelasterd hebben.", "Rom 11:27": "En dit is hun een verbond van Mij, als Ik hun zonden zal wegnemen.", "Jes 11:10": "Want het zal gebeuren op die dag, dat de heidenen zullen vragen naar de Wortel van Isaï, Die zal staan als een banier voor de volken, en Zijn rust zal heerlijk zijn.", "Jes 49:14-17": "Doch Sion zegt: De HEERE heeft mij verlaten, en de Heere heeft mij vergeten. Kan ook een vrouw haar zuigeling vergeten, dat zij zich niet ontfermt over de zoon van haar buik? Ofschoon deze zou vergeten, zo zal Ik u toch niet vergeten. Zie, Ik heb u in de beide handpalmen gegraveerd; uw muren zijn steeds voor Mij.", "Micha 4:3": "En Hij zal onder grote volken rechtspreken, en machtige heidenvolken straffen, tot ver weg toe; en zij zullen hun zwaarden omsmeden tot ploegscharen, en hun speren tot snoeimessen; het ene volk zal tegen het andere volk geen zwaard opheffen, en zij zullen de oorlog niet meer leren.", "Gal 3:29": "En als u van Christus bent, dan bent u Abrahams nageslacht, en naar de belofte erfgenamen.", "Ps 119:150": "Die kwade praktijken najagen, genaken mij, zij wijken ver van Uw wet.", "Ps 95:11": "Daarom heb Ik in Mijn toorn gezworen: Zij zullen in Mijn rust niet ingaan!", "Spr 3:29": "Smeed geen kwaad tegen uw naaste, aangezien hij met vertrouwen bij u woont.", "Ezech 5:15": "Zo zal de smaad en hoon een lering en ontzetting zijn voor de heidenvolken die rondom u zijn, wanneer Ik over u gerichten in toorn, en in grimmigheid, en in grimmige straffen oefenen zal; Ik, de HEERE, heb het gesproken!", "1 Kron 22:1": "En David zei: Hier zal het huis van God, de HEERE, zijn, en hier zal het altaar van het brandoffer voor Israël zijn.", "2 Tim 2:16": "Maar verzet u tegen het ongoddelijk ijdel geklets; want zij zullen in meerdere goddeloosheid toenemen.", "1 Petr 2:1": "Leg dan alle kwaadheid af, en alle bedrog, en huichelarij, en afgunst, en alle kwaadsprekerij;", "Jer 12:7": "Ik heb Mijn huis verlaten, Ik heb Mijn erfenis laten varen; Ik heb de beminde van Mijn ziel in de hand van haar vijanden gegeven.", "Ps 9:15": "Opdat ik Uw hele lof in de poorten van de dochter van Sion vertelt, dat ik mij verheugt in Uw heil.", "Job 19:3": "Nu al tien keer hebben jullie mij schande aangedaan; u schaamt u niet, u verhardt u tegen mij.", "Jer 31:13": "Dan zal de jonkvrouw zich verblijden in de rei, en ook de jongelingen en de ouderen samen; want Ik zal hun rouw in vrolijkheid veranderen, en zal hen troosten, en zal hen verblijden na hun droefenis.", "1 Kon 6:13": "En Ik zal in het midden van de kinderen van Israël wonen; en Ik zal Mijn volk Israël niet verlaten.", "Jes 11:1": "Want er zal een Rijsje voortkomen uit de afgehouwen tronk van Isaï, en een Scheut uit zijn wortels zal vrucht voortbrengen.", "Jer 25:18": "Namelijk Jeruzalem en de steden van Juda, en haar koningen, en haar vorsten; om die te stellen tot een woestheid, tot een ontzetting, tot een aanfluiting en tot een vloek, zoals het is op deze dag;", "1 Petr 2:24": "Die Zelf onze zonden in Zijn lichaam gedragen heeft op het hout; opdat wij, voor de zonden afgestorven, voor de gerechtigheid zouden leven; door Wiens striemen u genezen bent.", "Matt 2:15": "en hij was daar tot de dood van Herodes; opdat vervuld zou worden wat door de Heere gesproken is door de profeet: Uit Egypte heb Ik Mijn Zoon geroepen.", "Ps 5:8": "Maar ik zal door de grootheid van Uw goedertierenheid in Uw huis ingaan; ik zal mij buigen naar het paleis van Uw heiligheid, in Uw vreze.", "Ex 18:16": "Wanneer zij een zaak hebben, komt het tot mij, zodat ik oordeel tussen de man en zijn naaste; en dat ik hun de instellingen van God en Zijn wetten bekendmaak.", "1 Joh 3:3": "En ieder die deze hoop op Hem heeft, reinigt zichzelf, zoals Hij rein is.", "Ex 3:12": "Hij dan zei: Ik zal zeker met u zijn, en dit zal u een teken zijn dat Ik u gezonden heb: wanneer u dit volk uit Egypte geleid hebt, zult u God dienen op deze berg.", "Jes 51:3-16": "Want de HEERE zal Sion troosten, Hij zal al haar woeste plaatsen troosten, en Hij zal haar woestijn maken als Eden, en haar wildernis als de hof van de HEERE; vreugde en blijdschap zal daarin gevonden worden, dankzegging en een stem van het gezang. Luister naar Mij, Mijn volk! En Mijn lieden, neig naar Mij het oor! Want een wet zal van Mij uitgaan, en Ik zal Mijn recht doen rusten tot een licht van de volken. Mijn gerechtigheid is nabij, Mijn heil trekt uit, en Mijn armen zullen de volken richten; op Mij zullen de eilanden wachten, en op Mijn arm zullen zij hopen.", "Jer 10:16": "Jakobs deel is niet gelijk die, want Hij is de Formeerder van alles, en Israël is de roede van Zijn erfenis; HEERE van de heerscharen is Zijn Naam.", "Ps 82:6": "Ik heb wel gezegd: U bent goden; en u bent allen kinderen van de Allerhoogste;", "Joh 14:21": "Wie Mijn geboden heeft, en ze bewaart, die is het die Mij liefheeft; en wie Mij liefheeft, zal door Mijn Vader geliefd worden; en Ik zal hem liefhebben, en Ik zal Mijzelf aan hem openbaren.", "1 Petr 4:2": "om niet meer naar de begeerten van de mensen, maar naar de wil van God de tijd te leven die nog over is in het vlees.", "Luk 1:10": "En heel de menigte van het volk was buiten aan het bidden, op het uur van het reukoffer.", "Spr 10:19-21": "In de veelheid van woorden ontbreekt de overtreding niet; maar wie zijn lippen bedwingt, is verstandig. De tong van de rechtvaardige is uitgelezen zilver; het hart van de goddelozen is weinig waard. De lippen van de rechtvaardige voeden er velen; maar de dwazen sterven door gebrek aan verstand.", "Ps 50:23": "Wie dank offert, die zal Mij eren; en wie zijn weg goed inricht, die zal Ik Gods heil doen zien.", "Ps 41:12": "Hierbij weet ik, dat U lust aan mij hebt, dat mijn vijand over mij niet zal juichen.", "Jes 4:1": "En op die dag zullen zeven vrouwen één man vastgrijpen en zeggen: Ons eigen brood zullen wij eten, en met onze eigen kleren zullen wij bekleed zijn; laat ons alleen naar uw naam genoemd worden, neem onze smaad weg.", "Ezra 7:26": "En ieder die de wet van uw God en de wet van de koning niet zal doen, over hem moet spoedig recht gedaan worden, hetzij ter dood, of tot verbanning, of tot boete van goederen, of tot gevangenschap.", "Ps 102:15": "Want Uw knechten hebben een welgevallen aan haar stenen, en hebben medelijden met haar gruis.", "Job 8:21": "totdat Hij uw mond met gelach vervult, en uw lippen met gejuich.", "1 Kor 10:32": "Wees zonder aanstoot te geven, zowel voor de Joden als voor de Grieken als voor de gemeente van God.", "Ps 47:9": "God regeert over de heidenen; God zit op de troon van Zijn heiligheid.", "Jes 26:4": "Vertrouw op de HEERE tot in eeuwigheid; want in de HEERE HEERE is een eeuwige rots.", "Openb 22:1-5": "En hij toonde mij een zuivere rivier van het water des levens, klaar als kristal, die uit de troon van God en van het Lam kwam. In het midden van haar straat en aan de ene en de andere zijde van de rivier was de boom des levens, die twaalf keer vrucht droeg, van maand tot maand zijn vrucht gevend; en de bladeren van de boom waren tot genezing van de heidenen. En geen vervloeking zal er meer tegen iemand zijn; en de troon van God en van het Lam zal daar zijn, en Zijn dienstknechten zullen Hem dienen;", "Spr 3:32": "Want de afwijker is de HEERE een gruwel; maar Zijn verborgenheid is met de oprechte.", "Ps 25:14": "Samech. De verborgenheid van de HEERE is voor hen die Hem vrezen; en Zijn verbond, om het hun bekend te maken.", "Rom 13:10": "De liefde doet de naaste geen kwaad. Dus is de liefde de vervulling van de wet.", "1 Kon 3:1": "En Salomo verzwagerde zich met Farao, de koning van Egypte; hij nam de dochter van Farao en bracht haar naar de stad van David, totdat hij klaar zou zijn met het bouwen van zijn huis en het huis van de HEERE, en de muur van Jeruzalem rondom.", "Amos 9:14": "En Ik zal de gevangenschap van Mijn volk Israël omkeren, en zij zullen de verwoeste steden herbouwen en bewonen, en wijngaarden planten, en daarvan de wijn drinken; en zij zullen tuinen maken, en daarvan de vrucht eten.", "Ps 37:3": "Beth. Vertrouw op de HEERE, en doe het goede; bewoon de aarde, en voed u met trouw.", "Luk 22:30": "opdat u eet en drinkt aan Mijn tafel in Mijn Koninkrijk, en zit op tronen, en de twaalf stammen van Israël oordeelt.", "Gen 28:20": "En Jakob deed een gelofte, en zei: Wanneer God met mij geweest zal zijn, en mij behoed zal hebben op deze weg die ik reis, en mij brood gegeven zal hebben om te eten, en kleren om aan te trekken;", "Job 42:17": "En Job stierf, oud en verzadigd van dagen.", "Hagg 2:8-10": "Ja, Ik zal alle heidenvolken doen beven, en zij zullen komen tot de Wens van alle heidenvolken, en Ik zal dit huis met heerlijkheid vervullen, zegt de HEERE van de heerscharen. Mijn is het zilver, en Mijn is het goud, spreekt de HEERE van de heerscharen. De heerlijkheid van dit laatste huis zal groter worden dan die van het eerste, zegt de HEERE van de heerscharen; en in deze plaats zal Ik vrede geven, spreekt de HEERE van de heerscharen.", "Jes 29:10": "Want de HEERE heeft over u uitgegoten een geest van diepe slaap, en Hij heeft uw ogen dichtgesloten; de profeten, en uw hoofden, en de zieners heeft Hij verblind.", "Jer 24:9": "En Ik zal hen overgeven tot een verschrikking voor alle koninkrijken van de aarde, tot hun kwaad; tot smaad, en tot een spreekwoord, tot een spotrede, en tot een vloek, in alle plaatsen waarheen Ik hen verdreven zal hebben;", "Hebr 12:22": "Maar u bent gekomen tot de berg Sion, en de stad van de levende God, tot het hemelse Jeruzalem, en de vele duizenden engelen;", "Jes 46:12": "Hoor naar Mij, u die hardnekkig van hart bent, u, die ver van de gerechtigheid zijt!", "Ps 138:4": "Alle koningen van de aarde zullen U, o HEERE! loven, wanneer zij de redenen van Uw mond gehoord zullen hebben.", "Ps 69:33": "De zachtmoedigen, als zij dit gezien hebben, zullen zich verblijden; en u die God zoekt, uw hart zal leven.", "Ps 9:11": "En die Uw Naam kennen, zullen op U vertrouwen, omdat Gij, HEERE, niet hebt verlaten degenen, die U zoeken.", "Ps 72:16": "Is er een handvol koren in het land op de hoogte van de bergen, de vrucht daarvan zal ruisen als de Libanon; en die van de stad zullen bloeien als het kruid van de aarde.", "Ezech 34:26": "Want Ik zal hen, en de plaatsen rondom Mijn heuvel, stellen tot een zegen; en Ik zal de plasregen doen neerdalen op zijn tijd, plasregens van zegen zullen er zijn.", "Jes 55:3": "Neig uw oor, en kom tot Mij, hoor en uw ziel zal leven; want Ik zal met u een eeuwig verbond maken, en u geven de zekere weldaden van David.", "Ps 37:23": "Mem. De gangen van deze man worden door de HEERE bevestigd; en Hij heeft vreugde in zijn weg.", "Job 5:13": "Hij vangt de wijzen in hun arglistigheid; zodat de raad van de verdraaiden overhaast valt.", "Ps 94:11": "De HEERE kent de gedachten van de mens, dat zij vluchtig zijn.", "Hagg 1:2-9": "Zo spreekt de HEERE van de heerscharen: Dit volk zegt: De tijd is niet gekomen, de tijd dat het huis van de HEERE gebouwd moet worden. En het woord van de HEERE kwam door de dienst van de profeet Haggai, en Hij zei: Is het voor u wel de tijd om te wonen in uw gewelfde huizen, terwijl dit huis woest zal zijn?", "Ps 72:7": "In zijn dagen zal de rechtvaardige bloeien, en de veelheid van vrede, totdat de maan niet meer is.", "Gen 6:9": "Dit zijn de afstammelingen van Noach. Noach was een rechtvaardig, oprecht man onder zijn tijdgenoten. Noach wandelde met God.", "1 Kon 7:40": "Daartoe maakte Hiram de wasvaten, de scheppen, en de sprenkelschalen; en Hiram maakte al het werk af dat hij voor koning Salomo maakte voor het huis van de HEERE:", "Ps 2:1": "Waarom woeden de heidenen, en bedenken de volken iets zinloos?", "Gen 26:12": "En Izak zaaide in dat land, en hij oogstte in datzelfde jaar honderd maten; want de HEERE zegende hem.", "Joh 12:15": "Vrees niet, dochter van Sion, zie, uw Koning komt, zittend op het veulen van een ezelin.", "Joh 8:44": "U bent uit uw vader de duivel, en u wilt de begeerten van uw vader doen; die was een mensenmoordenaar van het begin af aan, en is niet in de waarheid blijven staan, want er is geen waarheid in hem. Wanneer hij de leugen spreekt, spreekt hij uit wat van hemzelf is; want hij is een leugenaar, en de vader daarvan.", "Ps 17:2": "Laat mijn recht van voor Uw aangezicht uitgaan, laat Uw ogen aanschouwen wat recht is.", "2 Kon 11:15": "Maar de priester Jojada gebood aan de leiders van honderd, die over het leger gesteld waren, en zei tegen hen: Breng haar naar buiten, tot buiten de gelederen, en dood wie haar volgt, met het zwaard; want de priester had gezegd: Laat haar niet in het huis van de HEERE gedood worden.", "Ezech 23:22-25": "Daarom, o Oholiba! Zo zegt de Heere HEERE: Zie, Ik zal uw minnaars, van wie uw ziel is afgekeerd, tegen u opwekken, en Ik zal hen van rondom tegen u aanbrengen. De zonen van Babel en alle Chaldeeën, Pekod, en Soa, en Koa, en alle zonen van Assur met hen; aantrekkelijke jonge mannen, die allen vorsten en machthebbers zijn, hoofdmannen en vermaarde mannen, die allen te paard rijden. Die zullen tegen u komen met karren, wagens en wielen, en met een menigte van volken, met kleine schilden, grote schilden, en helmen; zij zullen zich rondom tegen u opstellen; en Ik zal voor hun aangezicht het strafgericht neerleggen, en zij zullen u berechten naar hun rechtsregels.", "Job 33:14-30": "Maar God spreekt eens of tweemaal; doch men let daar niet op. In de droom, door het gezicht 's nachts, als een diepe slaap op de mensen valt, in de sluimering op het leger; Dan openbaart Hij het voor het oor der mensen, en Hij verzegelt hun kastijding;", "Zach 9:12": "Keert u weer tot de sterkte, gebondenen, die daar hopen! Ook heden verkondig Ik, dat Ik u dubbel zal wedergeven;", "Jer 7:9": "Zult u stelen, doodslaan en overspel bedrijven, en vals zweren, en voor Baäl reukwerk branden, en andere goden nawandelen, die u niet kent,", "Hebr 10:25": "en laten wij onze onderlinge bijeenkomst niet nalaten, zoals sommigen dat gewend zijn, maar elkaar vermanen; en dat des te meer, naarmate u ziet dat de dag nadert.", "Hand 13:48": "Toen de heidenen dit hoorden, verblijdden zij zich, en prezen het Woord van de Heere; en er geloofden zovelen als er bestemd waren tot het eeuwige leven.", "Ruth 4:11": "En al het volk dat in de poort was, alsook de oudsten, zeiden: Wij zijn getuigen; de HEERE make deze vrouw, die in uw huis komt, als Rachel en als Lea, die beiden het huis van Israël gebouwd hebben; en handel kloek in Efratha, en maak uw naam vermaard in Bethlehem!", "Pred 4:6": "Een hand vol met rust is beter dan beide de vuisten vol met moeite en najagen van de wind.", "Ex 20:21": "En het volk bleef op een afstand staan; maar Mozes naderde tot de donkerheid waar God was.", "Ps 118:22": "De steen, die de bouwlieden verworpen hadden, is tot een hoofd van de hoek geworden.", "2 Kron 7:20-22": "Dan zal Ik hen uitrukken uit Mijn land, dat Ik hun gegeven heb, en dit huis, dat Ik voor Mijn Naam geheiligd heb, zal Ik van Mijn aangezicht wegwerpen, en zal het tot een spreekwoord en spotrede onder alle volken maken. En dit huis, dat verheven zal geweest zijn, daarover zal iedereen die voorbijgaat zich ontzetten, zodat hij zal zeggen: Waarom heeft de HEERE aan dit land en aan dit huis zo gedaan? En men zal zeggen: Omdat zij de HEERE, de God van hun vaderen, verlaten hebben, Die hen uit Egypteland uitgevoerd had, en zich aan andere goden gehouden hebben, en zich voor die neergebogen, en hen gediend hebben; daarom heeft Hij al dat kwaad over hen gebracht.", "Zach 3:7": "Zo zegt de HEERE van de heerscharen: Als u in Mijn wegen wandelt, en als u Mijn wacht waarneemt, dan zult u ook Mijn huis richten, en ook Mijn voorhoven bewaren; en Ik zal u wandelingen geven onder dezen, die hier staan.", "Jer 30:11": "Want Ik ben met u, spreekt de HEERE, om u te verlossen; want Ik zal een voleinding maken met al de heidenen, waarheen Ik u verstrooid heb; maar met u zal Ik geen voleinding maken; maar Ik zal u kastijden met mate, en u niet helemaal ongestraft laten.", "Jes 46:13": "Ik breng Mijn gerechtigheid nabij, zij zal niet ver weg zijn, en Mijn heil zal niet uitblijven; maar Ik zal heil geven in Sion, aan Israël Mijn heerlijkheid.", "Gal 3:14": "Opdat de zegening van Abraham tot de heidenen komen zou in Christus Jezus, en opdat wij de belofte van de Geest zouden verkrijgen door het geloof.", "1 Kor 12:28": "En God heeft sommigen in de Gemeente gesteld: ten eerste apostelen, ten tweede profeten, ten derde leraars, daarna krachten, daarna gaven van gezondmaking, hulpverleningen, bestuur, allerlei talen.", "Matt 1:23": "Zie, de maagd zal zwanger worden en een Zoon baren, en u zult Hem de naam Emmanuel geven; dat betekent, vertaald: God met ons.", "Deut 23:5": "Doch de HEERE, uw God, heeft niet naar Bileam willen horen; maar de HEERE, uw God, heeft de vloek voor u in een zegen veranderd, omdat de HEERE, uw God, u liefhad.", "Ps 71:13": "Laat hen beschaamd worden, laat hen verteerd worden, die mijn ziel tegenstaan; laat hen met smaad en schande overdekt worden, die mijn kwaad zoeken.", "Amos 5:4-6": "Want zo zegt de HEERE tot het huis van Israël: Zoek Mij, en leef. Maar zoek Beth-el niet, en kom niet naar Gilgal, en trek niet over naar Ber-seba; want Gilgal zal zeker in gevangenschap weggevoerd worden, en Beth-el zal tot niets worden. Zoek de HEERE, en leef; anders doorbreekt Hij in het huis van Jozef als een vuur, dat verteert, zodat er niemand is die het blust in Beth-el;", "Joël 2:15-17": "Waait op de bazuin te Sion, heiligt een vasten, roept een verbodsdag uit. Verzamelt het volk, heiligt de gemeente, vergadert de oudsten, verzamelt de kinderen, en wie de borsten zuigen; de bruidegom ga uit zijn binnenkamer, en de bruid uit haar slaapkamer. Laat de priesters, de dienaars van de HEERE, wenen tussen het voorhuis en het altaar, en laat hen zeggen: Spaar Uw volk, o HEERE! en geef Uw erfenis niet over tot een smaad, dat de heidenen over hen zouden heersen; waarom zouden zij onder de volken zeggen: Waar is hun God?", "2 Kor 4:15": "Want al deze dingen zijn om uw wil, opdat de vermenigvuldigde genade, door de dankzegging van velen, overvloedig wordt tot heerlijkheid van God.", "Hos 10:8": "En de hoogten van Aven, Israëls zonde, zullen vernietigd worden; doorns en distels zullen op hun altaren opkomen; en zij zullen tegen de bergen zeggen: Bedek ons! en tegen de heuvels: Val op ons!", "Ruth 1:17": "Waar u zult sterven, zal ik sterven, en daar zal ik begraven worden; zo doe mij de HEERE en zo doe Hij daar nog aan toe, als niet de dood alléén scheiding zal maken tussen mij en u!", "Ps 21:4-6": "Want U komt hem voor met zegeningen van het goede; op zijn hoofd zet U een kroon van fijn goud. Het leven heeft hij van U begeerd. U hebt het hem gegeven; lengte van dagen, eeuwig en altoos. Groot is zijn eer door Uw heil; majesteit en heerlijkheid hebt U hem toegevoegd.", "Fil 2:10": "Opdat in de Naam van Jezus zich zou buigen elke knie van hen die in de hemel, en die op de aarde, en die onder de aarde zijn.", "Spr 6:21": "Bind ze voortdurend aan uw hart, hecht ze aan uw hals.", "Ps 72:19": "En geloofd zij de Naam van Zijn heerlijkheid tot in eeuwigheid; en de hele aarde moet met Zijn heerlijkheid vervuld worden. Amen, ja, amen.", "Jer 31:1": "In die tijd, spreekt de HEERE, zal Ik voor alle geslachten van Israël tot een God zijn; en zij zullen Mij tot een volk zijn.", "2 Kron 17:7-9": "In het derde jaar van zijn regering nu zond hij naar zijn vorsten, naar Ben-chaïl, en naar Obadja, en naar Zecharja, en naar Nathaneël, en naar Michaja, om te leren in de steden van Juda. En met hen de Levieten, Semaja en Nethanja, en Zebadja, en Asaël, en Semiramoth, en Jonathan, en Adonia, en Tobia, en Tob-adonia, de Levieten, en met hen de priesters Elisama en Joram. En zij leerden in Juda, en het wetboek van de HEERE was bij hen; en zij gingen rond in alle steden van Juda, en leerden onder het volk.", "Jes 48:12": "Hoor naar Mij, o Jakob! En u, Israël, Mijn geroepene! Ik ben Dezelfde; Ik ben de Eerste, ook ben Ik de Laatste.", "Jes 26:8": "Wij hebben ook op de weg van Uw oordelen, U, o HEERE, verwacht; naar Uw Naam en naar Uw gedachtenis gaat het verlangen van onze ziel uit.", "Jes 40:3": "Een stem van iemand die roept in de woestijn: Bereidt de weg van de HEERE, maakt recht in de wildernis een baan voor onze God!", "Ex 40:35": "Zodat Mozes niet in de tent der samenkomst kon ingaan, omdat de wolk daarop bleef, en de heerlijkheid van de HEERE de tabernakel vervulde.", "Matt 8:17": "opdat vervuld zou worden wat gesproken was door de profeet Jesaja, die zei: Hij heeft onze ziekten op Zich genomen, en onze kwalen gedragen.", "1 Joh 2:5": "Maar wie Zijn Woord bewaart, in hem is werkelijk de liefde van God volmaakt geworden; hieraan weten wij, dat wij in Hem zijn.", "2 Kon 19:15": "En Hizkia bad voor het aangezicht van de HEERE, en zei: HEERE, God van Israël, Die tussen de cherubs¹ woont! U zelf, U alleen bent de God van alle koninkrijken van de aarde, U hebt de hemel en de aarde gemaakt.", "Spr 11:31": "Zie, de rechtvaardige wordt vergolden op de aarde, hoeveel te meer de goddeloze en de zondaar!", "Jer 49:11": "Laat uw wezen achter, en Ik zal hen in het leven behouden, en laat uw weduwen op Mij vertrouwen.", "Hand 2:25-28": "Want David zegt van Hem: Ik zag de Heere altijd voor mij; want Hij is aan mijn rechterhand, opdat ik niet bewogen zou worden. Daarom is mijn hart verblijd, en mijn tong verheugt zich; ja, ook mijn vlees zal rusten in hoop; Want U zult mijn ziel niet verlaten in het rijk van de dood, en Uw Heilige zult U niet overgeven om verderving te zien.", "Hagg 1:10": "Daarom onthouden de hemelen zich boven u van dauw, en het land onthoudt zijn vruchten.", "Ezra 5:2": "Toen maakten Zerubbabel, de zoon van Sealthiël, en Jesua, de zoon van Jozadak, zich op en begonnen het huis van God te bouwen, Dat te Jeruzalem woont; en met hen de profeten van God, die hen ondersteunden.", "1 Petr 3:10-12": "Want wie het leven wil liefhebben en goede dagen wil zien, die moet zijn tong weerhouden van het kwade, en zijn lippen, zodat ze geen bedrog spreken; hij moet wijken van het kwade en het goede doen; hij moet vrede zoeken en die najagen. Want de ogen van de Heere zijn over de rechtvaardigen, en Zijn oren gericht op hun gebed; maar het aangezicht van de Heere is tegen hen die kwaad doen.", "2 Sam 15:19-22": "Toen zei de koning tegen Ithai, de Gethiet: Waarom zou u ook met ons meegaan? Keer terug, en blijf bij de koning; want u bent een vreemdeling, en bovendien bent u verbannen uit uw eigen plaats. Gisteren bent u gekomen, en zou ik u vandaag met ons laten meetrekken, terwijl ik zelf ga waarheen ik maar kan gaan? Keer terug, en breng uw broeders mee terug; goedertierenheid en trouw zij met u. Maar Ithai antwoordde de koning en zei: Zo waarachtig als de HEERE leeft, en mijn heer de koning leeft, op de plaats waar mijn heer de koning zal zijn, hetzij ten dode, hetzij ten leven, daar zal uw knecht voorzeker ook zijn!", "Hand 7:7": "En het volk dat zij zullen dienen, zal Ik oordelen, zei God; en daarna zullen zij uitgaan, en zij zullen Mij dienen op deze plaats.", "Ps 47:5": "Hij kiest voor ons onze erfenis, de heerlijkheid van Jakob, die Hij heeft liefgehad. Sela.", "Spr 12:19": "Een waarachtige lip zal voor altijd bevestigd worden; maar een valse tong is maar voor een ogenblik.", "Jes 6:9": "Toen zei Hij: Ga heen, en zeg tegen dit volk: Blijf horen, maar begrijp het niet, en blijf zien, maar merk het niet op.", "Ex 18:21": "Doch zoek u onder al het volk uit naar bekwame mannen, die God vrezen, betrouwbare mannen, die hebzucht haten; stel hen aan over hen als leiders over duizend, leiders over honderd, leiders over vijftig, en leiders over tien.", "Jes 31:3": "Want de Egyptenaren zijn mensen, en geen God, en hun paarden zijn vlees, en geen geest; en de HEERE zal Zijn hand uitstrekken, zodat de helper struikelen zal, en die geholpen wordt, zal neervallen, en zij zullen allemaal samen te niet komen.", "Hebr 4:3": "Want wij die geloofd hebben, gaan de rust in, zoals Hij gezegd heeft: Zo heb Ik dan in Mijn toorn gezworen: Zij zullen Mijn rust niet ingaan! Hoewel Zijn werken al vanaf de grondlegging van de wereld volbracht waren.", "Rom 2:28": "Want die is niet een Jood, die het in het openbaar is; en dat is ook niet de besnijdenis, die het in het openbaar in het vlees is;", "Jer 46:21": "Zelfs haar gehuurden in haar midden zijn als gemeste kalveren; maar die hebben zich ook gewend, zij zijn samen gevlucht, zij hebben niet gestaan; want de dag van hun verderf is over hen gekomen, de tijd van hun bezoeking.", "Jes 1:21": "Hoe is de trouwe stad tot een hoer geworden! Zij was vol recht, gerechtigheid herbergde daarin, maar nu doodslagers.", "Jes 4:6": "En daar zal een hut zijn tot een schaduw overdag tegen de hitte, en tot een toevlucht, en tot een schuilplaats tegen de vloed en tegen de regen.", "Zach 14:21": "Ja, al de potten in Jeruzalem en in Juda zullen de HEERE van de heerscharen heilig zijn, zodat allen die willen offeren, zullen komen, en daarvan nemen, en daarin koken; en er zal geen Kanaäniet meer zijn in het huis van de HEERE van de heerscharen, op die dag.", "Ps 134:1-3": "Een lied Hammaaloth. Zie, loof de HEERE, alle knechten van de HEERE! U die iedere nacht in het huis van de HEERE staat! Hef uw handen op naar het heiligdom, en loof de HEERE. De HEERE zegent u uit Sion, Hij, Die de hemel en de aarde gemaakt heeft.", "Zef 2:3": "Zoekt de HEERE, alle zachtmoedigen van het land, die Zijn recht doen! Zoekt gerechtigheid, zoekt zachtmoedigheid, misschien zult u verborgen worden in de dag van de toorn van de HEERE.", "Gen 31:41": "Ik ben nu twintig jaar in uw huis geweest; ik heb u veertien jaar gediend voor uw beide dochters, en zes jaar voor uw kudde; en u hebt mijn loon tien keer veranderd.", "Joz 1:5-9": "Niemand zal voor uw aangezicht standhouden al de dagen van uw leven; zoals Ik met Mozes geweest ben, zal Ik met u zijn; Ik zal u niet begeven, en zal u niet verlaten. Wees sterk en heb goede moed! Want u zult dit volk dat land als erfelijk bezit doen verkrijgen, dat Ik hun vaderen gezworen heb hun te geven. Wees alleen sterk en heb zeer goede moed, dat u waarneemt te doen naar de hele wet, die Mozes, Mijn knecht, u geboden heeft, en wijk daar niet vanaf, naar rechts of naar links, opdat u verstandig handelt overal waar u gaat.", "Jes 63:15": "Zie neer van de hemel, en aanschouw van Uw heilige en Uw heerlijke woning; waar zijn Uw ijver en Uw krachten, het gerommel van Uw ingewand en van Uw barmhartigheden? Zij houden zich tegen mij in.", "Ps 84:2-4": "Hoe lieflijk zijn Uw woningen, o HEERE van de heerscharen! Mijn ziel is begerig, en bezwijkt ook van verlangen, naar de voorhoven van de HEERE; mijn hart en mijn vlees roepen uit tot de levende God. Zelfs vindt de mus een huis, en de zwaluw een nest voor zich, waar zij haar jongen legt, bij Uw altaren, HEERE van de heerscharen, mijn Koning, en mijn God!", "Zach 13:7": "Zwaard! Word wakker tegen Mijn Herder, en tegen de Man Die Mijn Metgezel is, spreekt de HEERE van de heerscharen; sla die Herder, en de schapen zullen verstrooid worden; maar Ik zal Mijn hand tot de kleinen wenden.", "Ps 3:9": "Het heil is van de HEERE; Uw zegen is over Uw volk. Sela.", "Mal 3:16": "Toen spraken zij die de HEERE vrezen, ieder tot zijn naaste: De HEERE merkt er toch op en hoort, en er is een gedenkboek voor Zijn aangezicht geschreven, voor hen die de HEERE vrezen, en voor hen die aan Zijn Naam denken.", "Openb 7:10": "En zij riepen met luide stem: De zaligheid is van onze God, Die op de troon zit, en van het Lam.", "Jes 45:22-24": "Wend u naar Mij toe, word behouden, alle einden van de aarde! Want Ik ben God, en niemand meer. Ik heb bij Mijzelf gezworen, er is een woord van gerechtigheid uit Mijn mond gegaan, en het zal niet terugkeren: dat voor Mij alle knie zich zal buigen, alle tong Mij zal zweren. Men zal van Mij zeggen: Zeker, in de HEERE zijn gerechtigheden en sterkte; tot Hem zal men komen; maar zij zullen allen beschaamd worden die tegen Hem in woede ontstoken zijn.", "1 Kon 9:4": "En als u voor Mijn aangezicht wandelt, zoals uw vader David gewandeld heeft, met een volkomen hart, en met oprechtheid, om te doen naar alles wat Ik u geboden heb, en Mijn inzettingen en Mijn rechten houdt;", "Jer 5:24": "En zij zeggen niet in hun hart: Laten wij nu de HEERE, onze God, vrezen, Die de regen geeft, zowel de vroege regen als de late regen, op Zijn tijd; Die voor ons de weken, de vastgestelde tijden van de oogst, bewaart.", "Job 21:11": "Hun jonge kinderen zenden zij uit als een kudde, en hun kinderen huppelen.", "Deut 19:19": "dan zult u hem doen zoals hij van plan was zijn broeder te doen; zo zult u het kwaad uit uw midden wegdoen;", "Spr 10:31": "De mond van de rechtvaardige brengt overvloedig wijsheid voort; maar de tong van de verkeerdheden zal uitgeroeid worden.", "Amos 1:11": "Zo zegt de HEERE: Om drie overtredingen van Edom, en om vier zal Ik dat niet afwenden; omdat hij zijn broeders met het zwaard heeft vervolgd, en zijn medelijden heeft verdorven; en dat zijn toorn eeuwig verscheurt, en hij zijn woede altijd blijft koesteren.", "Ef 4:25": "Daarom, leg de leugen af, en spreek de waarheid, ieder met zijn naaste; want wij zijn elkaars leden.", "Ps 74:2": "Denk aan Uw vergadering, die U vanouds verworven hebt; de roede van Uw erfenis, die U verlost hebt; de berg Sion, waar U gewoond hebt.", "Ps 72:5": "Zij zullen U vrezen, zolang de zon en maan er zijn, van geslacht tot geslacht.", "Jes 2:4": "En Hij zal rechtspreken onder de heidenvolken, en bestraffen veel volken; en zij zullen hun zwaarden slaan tot spaden, en hun speren tot snoeimessen; het ene volk zal tegen het andere volk geen zwaard opheffen, en zij zullen geen oorlog meer leren.", "Luk 7:27": "Deze is het, over wie geschreven is: Zie, Ik zend Mijn engel voor Uw aangezicht uit, die Uw weg voor U klaar zal maken.", "Ps 97:7": "Beschaamd moeten worden allen die de beelden dienen, die zich op afgoden beroemen; buig u neer voor Hem, alle goden!", "Rom 9:26": "En het zal zijn: op de plaats waar tot hen gezegd was: U bent Mijn volk niet, daar zullen zij kinderen van de levende God genoemd worden.", "Deut 32:46": "Zei hij tegen hen: Zet uw hart op al de woorden, die ik heden onder u betuig, dat u ze uw kinderen gebieden zult, dat zij nauwlettend zullen doen al de woorden van deze wet.", "Gal 5:22-25": "Maar de vrucht van de Geest is liefde, blijdschap, vrede, geduld, vriendelijkheid, goedheid, geloof, zachtmoedigheid, zelfbeheersing. Tegen zulke mensen is de wet niet. Maar wie van Christus zijn, hebben het vlees gekruisigd met zijn hartstochten en begeerten.", "Ps 30:12": "U hebt mijn weeklagen veranderd in een reidans; U hebt mijn rouwkleed losgemaakt, en mij met blijdschap omgord;", "Zach 10:6-9": "En Ik zal het huis van Juda versterken, en het huis van Jozef zal Ik behouden, en Ik zal hen weer terugzetten; want Ik heb Mij over hen ontfermd, en zij zullen zijn alsof Ik hen niet verstoten had; want Ik ben de HEERE, hun God, en Ik zal hen verhoren. En zij zullen zijn als een held van Efraïm, en hun hart zal zich verblijden als door de wijn; en hun kinderen zullen het zien en zich verblijden, hun hart zal zich verheugen in de HEERE. Ik zal hen toefluiten en zal hen verzamelen, want Ik zal hen verlossen; en zij zullen talrijker worden, zoals zij eerder talrijk waren.", "Mark 12:26": "Maar wat de doden betreft, dat zij opgewekt zullen worden: hebt u niet gelezen in het boek van Mozes, hoe God in de doornstruik tot hem gesproken heeft: Ik ben de God van Abraham, en de God van Izak, en de God van Jakob?", "Deut 21:23": "Dan zal zijn dode lichaam niet aan het hout overnachten; maar u zult hem beslist diezelfde dag begraven; want een opgehangene is door God vervloekt. Zo zult u uw land niet verontreinigen, dat de HEERE, uw God, u als erfdeel geeft.", "Hebr 1:13": "En tegen wie van de engelen heeft Hij ooit gezegd: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gezet heb?", "1 Kon 14:22": "En Juda deed wat kwaad was in de ogen van de HEERE, en zij verwekten Hem tot ijver, meer dan al hun vaderen gedaan hadden, met hun zonden die zij zondigden.", "Gen 8:22": "Voortaan, al de dagen van de aarde, zullen zaaiing en oogst, en koude en hitte, en zomer en winter, en dag en nacht niet ophouden.", "1 Petr 4:7": "En het einde van alle dingen is nabij; wees dan nuchter en waak in de gebeden.", "Ps 22:19": "Zij delen mijn kleren onder zich, en werpen het lot over mijn gewaad.", "2 Kron 33:11": "Daarom bracht de HEERE over hen de legeroversten van de koning van Assyrië, die Manasse gevangen namen tussen de doornen; en zij bonden hem met twee koperen ketenen, en voerden hem naar Babel.", "2 Kron 15:5-7": "En in die tijden was er geen vrede voor hem die uitging, en hem die inkwam; maar veel beroeringen waren er over alle inwoners van die landen; Dat volk tegen volk, en stad tegen stad in stukken gestoten werden; want God had hen met allerlei angst verschrikt. Daarom, wees u sterk, en laat uw handen niet verslappen; want er is loon naar uw werk.", "Ps 119:108": "Laat U toch, o HEERE! welgevallen de vrijwillige offeranden van mijn mond, en leer mij Uw rechten.", "Zach 4:8-10": "Het woord van de HEERE kwam verder tot mij: De handen van Zerubbabel hebben dit huis gegrondvest, zijn handen zullen het ook voltooien; opdat u weet dat de HEERE van de heerscharen mij tot u gezonden heeft. Want wie veracht de dag van de kleine dingen? Toch zullen die zeven zich verblijden, als zij het tinnen gewicht zullen zien in de hand van Zerubbabel; dat zijn de ogen van de HEERE, die het hele land doorkruisen.", "Spr 15:26": "De gedachten van de boze zijn de HEERE een gruwel; maar de woorden van de reinen zijn lieflijke woorden.", "2 Joh 1:1": "De oudste aan de uitverkoren vrouw en aan haar kinderen, die ik in waarheid liefheb, en niet alleen ik, maar ook allen die de waarheid gekend hebben;", "Ex 28:36": "Verder zult u een plaat maken van zuiver goud, en u zult daarin graveren, zoals men de zegels graveert: HEILIGHEID VOOR DE HEERE!", "Ps 135:4": "Want de HEERE heeft Zich Jakob verkoren, Israël tot Zijn eigendom.", "Lev 11:44": "Want Ik ben de HEERE, uw God; daarom zult u uzelf heiligen, en heilig zijn, omdat Ik heilig ben; en u zult uw ziel niet verontreinigen aan enig kruipend gedierte dat zich op de aarde beweegt.", "Richt 19:18": "En hij zei tegen hem: Wij trekken door van Bethlehem-Juda tot aan de zijden van het gebergte van Efraïm, vandaar kom ik; en ik was naar Bethlehem-Juda gegaan, maar ik ga nu naar het huis van de HEERE; en er is niemand die mij in huis neemt.", "Ex 33:17": "Toen zei de HEERE tegen Mozes: Ook deze zaak, die u gesproken hebt, zal Ik doen, omdat u genade gevonden hebt in Mijn ogen, en Ik u bij naam ken.", "Jes 61:1": "De Geest van de Heere HEERE is op Mij, omdat de HEERE Mij gezalfd heeft, om een blijde boodschap te brengen aan de zachtmoedigen; Hij heeft Mij gezonden om te verbinden de gebrokenen van hart, om de gevangenen vrijheid uit te roepen, en de gebondenen opening van de gevangenis;", "Ezech 37:27": "En Mijn tabernakel zal bij hen zijn, en Ik zal hun tot een God zijn, en zij zullen Mij tot een volk zijn.", "Matt 27:3-10": "Toen Judas, die Hem verraden had, zag dat Hij veroordeeld was, kreeg hij berouw en heeft hij de dertig zilverstukken aan de overpriesters en de oudsten teruggebracht, en zei: Ik heb gezondigd, want ik heb onschuldig bloed verraden! Maar zij zeiden: Wat gaat ons dat aan? U moet maar toezien. En toen hij de zilverstukken in de tempel geworpen had, vertrok hij; en hij ging heen en verhing zichzelf.", "Luk 17:6": "En de Heere zei: Als u een geloof had als een mosterdzaad, zou u tegen deze moerbeiboom zeggen: Word ontworteld en in de zee geplant, en hij zou u gehoorzaam zijn.", "1 Kor 10:31": "Of u dus eet, of drinkt, of iets anders doet, doe alles tot eer van God.", "Deut 5:6-21": "Ik ben de HEERE, uw God, Die u uit Egypteland, uit het diensthuis, uitgeleid heb. U zult geen andere goden voor Mijn aangezicht hebben. U zult u geen gesneden beeld maken, noch enige gelijkenis, van wat boven in de hemel is, of onder op de aarde is, of in het water onder de aarde is;", "Ps 104:4": "Hij maakt Zijn engelen geesten, Zijn dienaars tot een vlammend vuur.", "Ps 68:17": "Waarom springt u op, u bultige bergen? Deze berg heeft God begeerd tot Zijn woning; ook zal de HEERE er wonen in eeuwigheid.", "Klaagl 3:36": "Lamed. Dat men een mens verongelijkt in zijn rechtszaak; zou de Heere dat niet zien?", "Ps 91:11": "Want Hij zal Zijn engelen aangaande u bevelen, dat zij u bewaren op al uw wegen.", "2 Kon 20:8": "Hizkia nu had tegen Jesaja gezegd: Wat is het teken dat de HEERE mij gezond zal maken, en dat ik op de derde dag naar het huis van de HEERE zal opgaan?", "Gen 15:14": "Maar Ik zal ook het volk rechten dat zij zullen dienen; en daarna zullen zij uittrekken met veel bezit.", "Ps 137:1-6": "Aan de rivieren van Babel, daar zaten wij, ook weenden wij, als wij dachten aan Sion. Wij hebben onze harpen gehangen aan de wilgen, die daar zijn. Toen zij die ons daar gevangen hielden, de woorden van een lied van ons vroegen, en zij die ons overhoop hadden geworpen, vreugde, en zeiden: Zingt ons een van de liederen van Sion;", "Rom 10:20": "En Jesaja durft het aan, en zegt: Ik ben gevonden door hen die Mij niet zochten; Ik ben openbaar geworden aan hen die naar Mij niet vroegen.", "Jak 1:26": "Als iemand onder u denkt dat hij godsdienstig is, en zijn tong niet in toom houdt, maar zijn hart verleidt, diens godsdienst is nutteloos.", "Rom 7:4": "Zo dan, mijn broeders, u bent ook voor de wet gedood door het lichaam van Christus, opdat u zou toebehoren aan een Ander, namelijk aan Hem Die van de doden opgewekt is, opdat wij voor God vruchten zouden dragen.", "Job 10:12": "Naast het leven hebt U goedertierenheid aan mij bewezen, en Uw zorg heeft mijn geest bewaard.", "Klaagl 2:16": "Pe. Al uw vijanden sperren hun mond open over u, zij fluiten en knersen met de tanden, zij zeggen: Wij hebben haar verslonden; dit is zeker de dag die wij verwacht hebben, wij hebben hem gevonden, wij hebben hem gezien.", "Ps 39:2": "Ik zei: Ik zal op mijn wegen letten, dat ik niet zondig met mijn tong; ik zal mijn mond met een breidel in toom houden, terwijl de goddeloze nog tegenover mij is.", "Jes 42:14": "Ik heb van oudsher gezwegen, Ik heb Mij stil gehouden en Mij ingehouden; Ik zal uitschreeuwen als een barende vrouw, Ik zal ze verwoesten en tegelijk opslokken.", "Spr 15:2": "De tong van de wijzen maakt de wetenschap goed; maar de mond van de zotten stort overvloedig dwaasheid uit.", "Num 6:27": "Zo zullen zij Mijn Naam op de kinderen van Israël leggen; en Ik zal hen zegenen.", "Deut 10:18": "Die het recht van de wees en van de weduwe doet; en de vreemdeling liefheeft, door hem brood en kleding te geven.", "Jes 40:3-5": "Een stem van iemand die roept in de woestijn: Bereidt de weg van de HEERE, maakt recht in de wildernis een baan voor onze God! Alle dalen zullen verhoogd worden, en alle bergen en heuvels zullen vernederd worden; en wat krom is, dat zal recht, en wat hobbelig is, dat zal tot een vallei gemaakt worden. En de heerlijkheid van de HEERE zal geopenbaard worden; en alle vlees tegelijk zal zien, dat de mond van de HEERE het gesproken heeft.", "Jer 32:42": "Want zo zegt de HEERE: Zoals Ik over dit volk al dit grote kwaad gebracht heb, zo zal Ik over hen al het goede brengen dat Ik over hen spreek.", "Ef 4:8": "Daarom zegt Hij: Toen Hij opgevaren is in de hoogte, heeft Hij de gevangenis gevangengenomen, en heeft Hij de mensen gaven gegeven."}, "noten": {"1": "D.i. legermachten"}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H1961\">Daarna</span> kwam <span class=\"wl\" data-l=\"L2\" data-code=\"H1697\">het</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H1697\">woord</span
