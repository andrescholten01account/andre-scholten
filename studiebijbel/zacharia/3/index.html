 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Daarna liet Hij mij Jozua zien, de hogepriester, staande voor het aangezicht van de Engel van de HEERE; en de satan stond aan zijn rechterhand, om hem te weerstaan.","2":"Doch de HEERE zei tegen de satan: De HEERE bestraft u, satan! Ja, de HEERE bestraft u, Die Jeruzalem verkiest; is deze niet een vuurbrand uit het vuur gered?","3":"Jozua nu was bekleed met vuile kleren, terwijl hij voor het aangezicht van de Engel stond.","4":"Toen antwoordde Hij, en sprak tot hen die voor Zijn aangezicht stonden: Doe deze vuile kleren van hem weg. Daarna sprak Hij tot hem: Zie, Ik heb uw ongerechtigheid van u weggenomen, en Ik zal u stellen (extra) kleren aandoen.","5":"Daarom zeg Ik: Laat ze een reine hoed op zijn hoofd zetten. En zij zetten die reine hoed op zijn hoofd, en zij trokken hem kleren aan; en de Engel van de HEERE stond *daarbij*.","6":"Toen betuigde de Engel van de HEERE aan Jozua, en zei:","7":"Zo zegt de HEERE van de heerscharen[1]: Als u in Mijn wegen wandelt, en als u Mijn wacht waarneemt, dan zult u ook Mijn huis richten, en ook Mijn voorhoven bewaren; en Ik zal u wandelingen geven onder dezen, die *hier* staan.","8":"Hoor nu toe, Jozua, u hogepriester! U en uw vrienden, die voor uw aangezicht zitten, want zij zijn een wonderteken; want zie, Ik zal Mijn Knecht, de SPRUITE, doen komen.","9":"Want zie, aangaande die steen, die Ik gelegd heb voor het aangezicht van Jozua, op die ene steen zullen zeven ogen zijn; zie, Ik zal zijn graveersel graveren, spreekt de HEERE van de heerscharen, en Ik zal de ongerechtigheid van dit land op één dag wegnemen.","10":"Op die dag, spreekt de HEERE van de heerscharen, zult u ieder zijn naaste nodigen tot onder de wijnstok en tot onder de vijgenboom."},"SV":{"1":"Daarna toonde Hij mij Josua, den hogepriester, staande voor het aangezicht van den Engel des HEEREN; en de satan stond aan zijn rechterhand, om hem te wederstaan.","2":"Doch de HEERE zeide tot den satan: De HEERE schelde u, gij satan! ja, de HEERE schelde u, Die Jeruzalem verkiest; is deze niet een vuurbrand uit het vuur gerukt?","3":"Josua nu was bekleed met vuile klederen, als hij voor het aangezicht des Engels stond.","4":"Toen antwoordde Hij, en sprak tot degenen, die voor Zijn aangezicht stonden, zeggende: Doet deze vuile klederen van hem weg. Daarna sprak Hij tot hem: Zie, Ik heb uw ongerechtigheid van u weggenomen, en Ik zal u wisselklederen aandoen.","5":"Dies zeg Ik: Laat ze een reinen hoed op zijn hoofd zetten. En zij zetten dien reinen hoed op zijn hoofd, en zij togen hem klederen aan; en de Engel des HEEREN stond *daarbij*.","6":"Toen betuigde de Engel des HEEREN Josua, zeggende:","7":"Zo zegt de HEERE der heirscharen: Indien gij in Mijn wegen zult wandelen, en indien gij Mijn wacht zult waarnemen, zo zult gij ook Mijn huis richten, en ook Mijn voorhoven bewaren; en Ik zal u wandelingen geven onder dezen, die *hier* staan.","8":"Hoor nu toe, Josua, gij hogepriester! gij en uw vrienden, die voor uw aangezicht zitten, want zij zijn een wonderteken; want ziet, Ik zal Mijn Knecht, de SPRUITE, doen komen.","9":"Want ziet, aangaande dien steen, welken Ik gelegd heb voor het aangezicht van Josua, op dien enen steen zullen zeven ogen wezen; ziet, Ik zal zijn graveersel graveren, spreekt de HEERE der heirscharen, en Ik zal de ongerechtigheid dezes lands op een dag wegnemen.","10":"Te dien dage, spreekt de HEERE der heirscharen, zult gijlieden een iegelijk zijn naaste nodigen tot onder den wijnstok en tot onder den vijgeboom."},"KJV":{"1":"And he shewed me Joshua the high priest standing before the angel of the LORD, and Satan standing at his right hand to resist","2":"And the LORD said unto Satan, The LORD rebuke thee, O Satan; even the LORD that hath chosen Jerusalem rebuke thee: *is* not this a brand plucked out of the fire?","3":"Now Joshua was clothed with filthy garments, and stood before the angel.","4":"And he answered and spake unto those that stood before him, saying, Take away the filthy garments from him. And unto him he said, Behold, I have caused thine iniquity to pass from thee, and I will clothe thee with change of raiment.","5":"And I said, Let them set a fair mitre upon his head. So they set a fair mitre upon his head, and clothed him with garments. And the angel of the LORD stood by.","6":"And the angel of the LORD protested unto Joshua, saying,","7":"Thus saith the LORD of hosts; If thou wilt walk in my ways, and if thou wilt keep my charge, then thou shalt also judge my house, and shalt also keep my courts, and I will give thee places to walk among these that stand by.","8":"Hear now, O Joshua the high priest, thou, and thy fellows that sit before thee: for they *are* men wondered at: for, behold, I will bring forth my servant the BRANCH.","9":"For behold the stone that I have laid before Joshua; upon one stone *shall be* seven eyes: behold, I will engrave the graving thereof, saith the LORD of hosts, and I will remove the iniquity of that land in one day.","10":"In that day, saith the LORD of hosts, shall ye call every man his neighbour under the vine and under the fig tree."}},"tsk":{"1":[{"kopje":"Hij","refs":["Zach 1:9","Zach 1:13","Zach 1:19","Zach 2:3"]},{"kopje":"Jozua","refs":["Zach 3:8","Zach 6:11","Ezra 5:2","Hagg 1:1","Hagg 1:12","Hagg 2:5"]},{"kopje":"staande","refs":["Deut 10:8","Deut 18:15","1 Sam 6:20","2 Kron 29:11","Ps 106:23","Jer 15:19","Ezech 44:11","Ezech 44:15","Luk 21:36"]},{"kopje":"de Engel","refs":["Gen 48:16","Ex 3:2-6","Ex 23:20","Ex 23:21","Hos 12:5","Hos 12:6","Mal 3:1","Hand 7:30-38"]},{"kopje":"de satan","refs":["Job 1:6-12","Job 2:1-8","Ps 109:6","Luk 22:31","1 Petr 5:8","Openb 12:9","Openb 12:10"]},{"kopje":"hem te weerstaan","refs":["Gen 3:15"]}],"2":[{"kopje":"de HEERE zei","refs":["Ps 109:31","Luk 22:32","Rom 16:20","1 Joh 3:8"]},{"kopje":"De HEERE bestraft","refs":["Dan 12:1","Mark 1:25","Luk 4:35","Luk 9:42","Judas 1:9","Openb 12:9","Openb 12:10"]},{"kopje":"verkiest","refs":["Zach 1:17","Zach 2:12","2 Kron 6:6","Joh 13:18","Rom 8:33","Openb 17:14"]},{"kopje":"een vuurbrand","refs":["Amos 4:11","Rom 11:4","Rom 11:5","Judas 1:23"]}],"4":[{"kopje":"die","refs":["Zach 3:1","Zach 3:7","1 Kon 22:19","Jes 6:2","Jes 6:3","Luk 1:19","Openb 5:11"]},{"kopje":"Doe... weg","refs":["Jes 43:25","Ezech 36:25","Gal 3:27","Gal 3:28","Fil 3:7-9","Openb 7:14"]},{"kopje":"Ik heb","refs":["2 Sam 12:13","Ps 32:1","Ps 32:2","Ps 51:11","Jes 6:5-7","Joh 1:29","Rom 6:23","Hebr 8:12"]},{"kopje":"en Ik zal","refs":["Jes 61:3","Jes 61:10","Luk 15:22","Rom 3:22","1 Kor 6:11","2 Kor 5:21","Kol 3:10","Openb 19:7"]}],"5":[{"kopje":"reine","refs":["Zach 6:11","Ex 28:2-4","Ex 29:6","Lev 8:6-9","Hebr 2:8","Hebr 2:9","Openb 4:4","Openb 4:10","Openb 5:8-14"]}],"6":[{"kopje":"de","refs":["Zach 3:1","Gen 22:15","Gen 22:16","Gen 28:13-17","Gen 48:15","Gen 48:16","Ex 23:20","Ex 23:21","Jes 63:9","Hos 12:5","Hand 7:35-38"]},{"kopje":"betuigde","refs":["Jer 11:7"]}],"7":[{"kopje":"als u Mijn wacht waarneemt","refs":["Gen 26:5","Lev 8:35","Lev 10:3","1 Ko /span> and under the fig tree."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Hij mij","tekst":"Te weten, de engel; zie Zech 2:3-4 ."},{"catchword":"Jósua,","tekst":"Van deze Jozua wordt ook melding gemaakt Hag 1:1 , Hag 1:12 , en Hag 2:3 . Hij wordt alhier gesteld als een beeld der kerk, dewijl hij te dien tijde als de voornaamste opziener of voorstander derzelve op aarde geweest is, zijnde hogepriester; doch anderszins, ten aanzien dat hij het volk uit de Babylonische gevangenschap geleid en den tempel herbouwd heeft, en hogepriester was, is hij ook geweest een voorbeeld van Jezus Christus, in naam en inderdaad."},{"catchword":"den hogepriester,","tekst":"Hebr. den groten priester."},{"catchword":"voor het aangezicht van den Engel des HEEREN;","tekst":"Jozua stond voor dien Engel, dat is, Christus, als een beschuldigde voor zijn rechter, de satan zijnde de aanklager. Anderen nemen hier staan voor dienen, gelijk Psa 135:2 ."},{"catchword":"de satan","tekst":"Dit betekent een tegenpartijder, of wederstander; zie Job 1:6 ."},{"catchword":"aan zijn rechterhand,","tekst":"Te weten, aan Jozua's rechterhand."},{"catchword":"om hem te wederstaan","tekst":"Dat is, dat hij hem [te weten Jozua] voor Christus aanklaagde en beschuldigde, als niet waardig zijnde dat de tempel onder zijn beleid zou herbouwd worden. Zie Rev 12:10 . De Hebr. woorden, die hier gebruikt worden, luiden zoveel alsof wij zeiden: Deze tegenstander stond om hem tegen te staan. Verg. met de woorden van den tekst Eph 6:12 ."}],"2":[{"catchword":"de HEERE zeide tot den satan","tekst":"Te weten, de Zoon Gods, dien Hij tevoren den engel des Heeren genoemd heeft."},{"catchword":"De HEERE","tekst":"Dat is, God de Vader."},{"catchword":"schelde u,","tekst":"Dat is, drijve u terug met uw valse aanklacht, Hij make u te schande, verstote en verdoeme u, en rechtvaardige zijn getrouwen dienaar Jozua. Zie Jud 1:9 ."},{"catchword":"verkiest;","tekst":"Zie Zech 1:17, en Zech 2:12."},{"catchword":"deze niet","tekst":"Te weten, de hogepriester Jozua."},{"catchword":"een vuurbrand","tekst":"Zie Isa 7:4 . Anders: [als] een vuurbrand, uit het vuur gered?"},{"catchword":"uit het vuur gerukt?","tekst":"Dat is, uit de Babylonische gevangenschap; of uit den algemenen ondergang gered, opdat Ik mijne genade aan hem bewijzen zou? Waarom begeert gij dan, dat Ik hem zou te schande maken? Zie Amo 4:11 ."}],"3":[{"catchword":"met vuile klederen,","tekst":"Dat is, met bezoedelde, onreine, bevlekte klederen, waarmede zijne zonden en onreinheden worden aangewezen, gelijk blijkt uit vs.4."},{"catchword":"des Engels stond","tekst":"Te weten, van den Engel, van wien in vs.1 gesproken is, die de Heere Christus was."}],"4":[{"catchword":"antwoordde","tekst":"Dat is, sprak."},{"catchword":"Hij,","tekst":"Te weten, Christus, die de zonden vergeeft en den onrechtvaardige rechtvaardig spreekt; alzo ook straks wederom, daarna [te weten, nadat zij hem de vuile klederen hadden uitgetrokken] sprak Hij, te weten, Christus."},{"catchword":"tot degenen,","tekst":"Dat is, tot de andere engelen, die zijne dienaars zijn, altijd vaardig staande om zijne bevelen te verrichten; Heb 1:14 ."},{"catchword":"tot Hem","tekst":"Te weten, tot Jozua."},{"catchword":"Zie,","tekst":"Dat is, hieruit zult gij de waarheid dezer zaak vernemen, dat Ik uwe ongerechtigheden van u heb weggenomen, die door het vuile kleed, zie vs.3, werden betekend. Verg. Isa 6:7 ; Jer 1:9 ."},{"catchword":"weggenomen,","tekst":"Zie 2Sa 12:13 ."},{"catchword":"wisselklederen aandoen","tekst":"Aldus worden genoemd nieuwe, zuiver, schone klederen, die men alleen op feestdagen aandeed. Zie Jdg 14:12 . Hier wordt door de wisselklederen verstaan de gerechtigheid van Christus, ware heiligheid of geestelijk sieraad. Verg. Mat 22:11 ; Luk 15:22 ."}],"5":[{"catchword":"Dies zeg Ik","tekst":"Anders: toen zeide ik: te weten bij mijzelven, als zijnde woorden van den profeet, wensende dat zulks door den wil des Heeren mocht geschieden."},{"catchword":"hoed op zijn hoofd zetten","tekst":"Van het woord hoed, zie de aantekening bij Exo 29:4 . De hoed beduidt het priesterlijk ambt, waartoe de Heer Jozua heeft aangesteld en bevestigd, nadat Hij hem van zijne zonden gereinigd en geheiligd had; zie 1Pe 2:9 ."},{"catchword":"klederen aan;","tekst":"Te weten, wisselklederen, gelijk vs.4."},{"catchword":"stond daarbij","tekst":"Te weten, vaardig om des Vaders bevel uit te voeren."}],"7":[{"catchword":"de HEERE der heirscharen","tekst":"Te weten, God de Vader, die voor de weldaden, waarmede Hij de mensen begenadigt, dankbaarheid is vereisende, namelijk gedurige oefening in de godzaligheid; Luk 1:74 ; 1Pe 1:15-16 ."},{"catchword":"indien gij Mijn wacht","tekst":"Dat is, indien gij mijne instellingen en geboden naarstig zult onderhouden, gelijk Ik die wil onderhouden hebben."},{"catchword":"zult waarnemen,","tekst":"Hebr. zult wachten."},{"catchword":"zo zult gij ook Mijn huis richten,","tekst":"Dat is, zo zult gij ook het opzicht en de regering over mijn kerk hebben, gelijk het uwe voorouders gehad hebben; zie 2Ch 19:11 . De kerk wordt meermalen Gods huis genoemd, gelijk Num 12:7 ; Jer 11:15 , en Jer 12:7 ; Heb 3:2 ."},{"catchword":"Mijn voorhoven bewaren;","tekst":"Dat is, gij zult in uw hogepriesterambt geduriglijk blijven, en het opzicht over mijne kerk hebben en behouden. Het is even hetzelfde hetwelk Hij straks met andere woorden gezegd heeft."},{"catchword":"Ik zal u wandelingen geven onder dezen,","tekst":"Dat is, na dit leven, zal Ik u opnemen in het eeuwige leven, en zal u doen wandelen onder de heilige engelen, die hier staan, en andere hemelse scharen. Verg. Mat 22:30 ; 2Ti 4:8 ; Heb 12:22 ."}],"8":[{"catchword":"uw vrienden,","tekst":"Dat is, uwe metgezellen, de priesters, onder uw opzicht staande. Of in het algemeen, de vromen die het met u houden."},{"catchword":"een wonderteken;","tekst":"Of, een wonder. Hebr. mannen des wonders. Eenigen verstaan dit alzo, dat zij voor een wonder bij de boze mensen gehouden werden, overmits zij des Heeren woord hoorden; zie Isa 8:18 . Doch sommigen verstaan dat zij voor een wonder werden aangezien, overmits zij zo wonderbaar uit de Babylonische gevangenschap verlost en in hun land wedergebracht waren, zijnde hetzelve een teken van de verlossing door Christus; zie Psa 71:7 ."},{"catchword":"Ik zal","tekst":"Te weten, de Vader; wiens woorden hier de Heere Christus herhaalt; zie vs.6."},{"catchword":"Mijn Knecht,","tekst":"Dat is, Christus; zie Isa 42:1 , en Isa 52:13 . De zin is: Dezen zal Ik in de wereld doen verschijnen in de volheid des tijds, en Hij zal mijn wil doen, gelijk een getrouwe knecht den wil en het bevel van zijn heer doet."},{"catchword":"de SPRUITE,","tekst":"Te weten, den Messias, die een Spruit is uit den stam van Isaï. Zie Jer 23:5 , en Jer 33:15 , en Zech 6:12 . Eenigen houden het Hebr. woord Zemach in den tekst."}],"9":[{"catchword":"dien steen,","tekst":"Namelijk Christus, straks een Spruit genoemd, vs.8, die het fondament en de hoeksteen des tempels werd afgebeeld; Psa 118:22 ; Isa 28:16 . Alzo wederom hier, toen de tempel is gefondeerd en vernieuwd geworden in de tegenwoordigheid van Jozua."},{"catchword":"op dien enen steen","tekst":"Of, in dien steen, te weten in Christus, zal zijn, vooreerst de volheid der Godheid, en daarna overvloed van geestelijke gaven, en voorts volkomen zorg voor zijne kerk. Anders: over. Verstaande de grote zorg des Vaders over Christus en zijn rijk."},{"catchword":"zeven ogen wezen;","tekst":"Verg. met de woorden van dit vers, de woorden van Zech 4:10 ; Rev 5:6 ."},{"catchword":"Ik zal zijn graveersel graveren,","tekst":"Dat is, Ik zal hem kostelijk uithouwen, gelijk men een kostelijken steen fraai polijst en glad maakt; dat is, Ik zal hem [te weten] Christus versieren met menigerlei geestelijke gaven. Hebr. Ik zal zijne opening openen; welke woorden enigen duiden op het lijden en op de wonden van onzen Heere Jezus Christus, waarmede onze ongerechtigheden zijn uitgedelgd en de zaligheid verworven is."},{"catchword":"dezes lands","tekst":"Te weten, van de kerk der Joden en heidenen."},{"catchword":"op een dag wegnemen","tekst":"Te weten, op dien dag als Christus zal gekruisigd worden."}],"10":[{"catchword":"zult gijlieden","tekst":"Dat is, gij zult in vrede leven, en van alles genoeg hebben. Zie 1Ki 4:25 ; Mic 4:4 . Doch versta dit niet zozeer van een tijdelijken vrede en welstand, als van een gerustheid des gemoeds en vrede der coscientie door het geloof, dat God met ons om Christus' wil verzoend is. Verg. Isa 2:4-5 , en Isa 25:6-7 ; Hos 2:14 , Hos 2:17 , en Hos 14:5-7 ; Joel 3:19 ; Amo 9:13-15 ; Mic 4:4 , en Mic 5:4-5 . In welke plaatsen, onder verbloemde redenen, de vrede der kerk en van een ieder als lidmaat derzelve wordt afgebeeld."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"After that he [viz. the angel, spoken of above chap. 2. verse 3, 4.] shewed me Josua [of this Josa mention is likewise made, Hag. 1.1, 12. and chap. 2.3.] the high [or, great] priest, [he is brought in here, as a type of the church he having been at that time, the chief overseer or governour thereof on earth, as High-priest; nevertheless in regard he brought or conducted the people out of the Babylonians captivity, and rebuilt the temple, and was actually High-priest. He was likewise a type of Jesus Christ, both in name, and indeed] standing before the face of the angel of the LORD, [Josua stood before the angel who was Christ himself, as an accused person before the judge, Satan being the accuser; others take the word standing, here, for, serving, ministering, as Psa 135:2.] and Satan [which signifieth an adversary, or withstander. See Job 1:6.] stood at his right hand [viz. Josuas] for to withatand him [laying to his charge before Christ, that he was unworthy, tempe should be repaired under his direction. See Rev. 12.10. the Hebrew words which are used here, import as much, as if one should say, the withstander him. Compare with the words of the text, Eph. 6.12.]"}],"2":[{"catchword":null,"tekst":"But the LORD [viz. the son of God, whom before he had called the angel of the LORD] said unto Satan, the LORD [i.e. God the father] rebuke thee, [i.e. overthrow and confound thee, with thy false accusation, he judge and condemn thee for it, acquitting and justifying his faithfull servant Josua. See Jude verse 9.] thou satan, yea the LORD rebuke thee, that chooseth Jerusalem: [see above chap. 1.17. and 2.16.] is not this a fire-brand [viz. this high-priest] Josua; see Isa. 7.4] pluckt out of the fire? [viz. of the Babylonian captivity. Oth. As a firebrand rescued out of the fire, namely of the common or general destruction, for to shew him my favour, why then dost thou desire his confusion; see Amos 4.11.]"}],"3":[{"catchword":null,"tekst":"Now Josua was clothed with filty garments, [i.e. with his personal sins and infirmities, as appears from the next verse] when he stood before the face of the Angel, [spoken of verse who was the LORD Christ himself]"}],"4":[{"catchword":null,"tekst":"Then be [viz. Christ, that forgiveth sins, and justifieth the unrighteous] answered [i.e. said] and spake to those stood before his face, [i.e unto the rest of the angels, as his ministers, standing always ready to receive and execute his commands, Hebr. 1.14.] saying; put away these filthy garment from him: after that, he [the same LORD Christ, they having taken away those filthy garments, as he bad them] spake to him, [to wit, Josua] before I have taken away thy unrighteousnesse, [i.e. by this act thou mayst perceive the truth of it, that I have away thy unrighteousnesses; which was signified by the filthy garments. Compare Isa. 6.7. Jer. 1.9 and See 2 Sam. 12.13.] and I will array thee with change-garments. [thus they were wont to call new, pure and godly garments, such as people used to wear onely on festival-dayes. See Jud. 14.12. Here by the change-garments are understood, the righteousness of Christ, true holiness, or, spiritual ornament, the gifts and graces of Christ. Compare Mat 22:11. Luk 15:22.]"}],"5":[{"catchword":null,"tekst":"Therefore I say, [oth. Then I said, viz. by my self as the prophets words, wishing such a thing might come to pass, by the good pleasure of God] let them set a pure hat upon his head: [of the word Hat see the annotate. Ex. 28.4 the Hat doth signifie the priestly office, unto which the Lord hath ordained & confirmed him, having first cleansed and sanctified him from his sins. See Pet. 2.9.] and they did set that pure Hat upon his head, and they put him on clothes, [to wit, those spoken of in the former verse,] and the angel of the Lord stood (by it): [as ready to execute the father command]"}],"6":[{"catchword":null,"tekst":"Then the angel of the LORD testified unto Josua, saying:"}],"7":[{"catchword":null,"tekst":"Thus saith the LORD of hosts, [to wit, God the father, who for those mercies and benefits, which he so freely bestowes upon man, requireth thankfulness from them, viz. continuall practice of true piety. Luk 1:74.75. 1 Pet. 1.15, 16.] if thou shalt walk in my wayes, and if thou shalt observe [or guard] my guard] my guard, [that is, if thou shalt carefully and observe mine ordinances and commands, so as I will have them kept and observed] then thou shalt also judge my house. [i.e. then shalt thou also have the oversight and government of my church, so as thy fore-fathers had it. See 1 Chr. 19.11. the church is oftentimes called the house of God, as Nu. 12.7. Jer. 11.15. and 12.7. Hebr. 3.2.] And also keep my courts. [I.e. thou shalt continually abide in thine High-priest office, and have and keep the inspection over my church: is the same thing in other words, which he said immediately before] and I shall give thee walkers among these that stand here. [That is, after this life, I shall take thee up into the lasting life, and cause thee to converse with and among these holy angels here standing and with the rest of the heavenly hosts. Compare Mat, 22.30. Hebr. 12.22 and 1 Tim. 4.8.]"}],"8":[{"catchword":null,"tekst":"Hearken now Josua thou High-priest, thou and thy friends that sit before thy face: [i.e. thy co-partners, or, fellow ministers, the priests under thine inspection. Or in general, the godly people, that partake with thee] for they are miracles. [or, wonderment, Hebr. Men of wonder. Some understand this so, that they were wondred at by the wicked men, they lookt upon them with amazement, whilest they heard the word of the LORD. See Isa. 8.18. but some understand it, they were lookt upon as a great wonder, being so wonderfully delivered out of the Babylonish captivity, and brought back again into their own country; the same being a token the spiritual deliverance by Christ. See Psalms 71. on verse 7.] for behold, I [to wit, God the father, whose words Christ here relateth. See above verse 6.] shall cause to come my servant [i.e. Christ. See Isa. 42. on verse 1. and 12.13. the sense is, him shall I cause to appear in the world in the fullness of time, and he shall do my will, even as a faithful servant doth the will and command of his master] the sprout; [i.e. the Messia who is a sprout or branch out of the stem of Isaiah see Jer. 23.5 and 33. 15 and 38.]"}],"9":[{"catchword":null,"tekst":"For, behold, concerning this stone, viz. Christ, just now verse 8. called a sprout, being indeed the foundation and corner stone of his church; as church formerly was typified by the corner-stone of the Temple. Psa 118:22. Isa 28:16. so here now again, the Temple being to be re edified in the presence of Josua] whom I have laid before the face of Josua; upon that one stone (here) shall be seven eyes; [Oth. In that stone &c. i.e. in Christ there shall be, first the fullness of the God head, and then abundance of spiritual gifts and lastly a tender care of and for his church. Oth. Over, or upon that stone &c. understand thereby, the great care which the father had for Christ and his kingdom. Compare with the words of this verse, those of chap. 4.10. And Rev. 5.6.] To I shall grave his graving, [i.e. I shall curiously hew and fashion him, as they use to polish and garnish a precious stone. That is to say, that is to say, I will adorn Christ with all manner of spiritual graces. Heb. I shall open his openings, which words some do applie to the sufferings and wounds of our saviour Jesus Christ, whereour unrighteousnesse are blotted out and salvation is purchased] saith the LORD of hosts: and I will take away the unrighteousnesse of this land [to wit of the Church of Jewes and Gentiles] in one day; [[namely, that wherein Christ shall be crucified.]"}],"10":[{"catchword":null,"tekst":"In that day, saith the LORD of hostes, shal ye invite every one his neighbour, even underthe vine, and under the fig-tree: [that is; ye shall live in peace, and enjoy abundance of all things. See 1 Kings 4.2.5. Mich. 4.4. Yet this not so much to be understood of a temporall peace and welfare, as of a contentedness and quietnesse of minde, and peace of conscience, through faith, because of God being reconciled to us in Christ. Comp. Isa. 2.4, 5 and 25.6, 7. Hos. 2.15, 18. and 14.5, 6, 7. Joel 3. 18. Amos 9.13, 14, 15. Mich. 4.4. and 5.4, 5. in which places, under figurative expression, the peace of the Church and every member thereof, is represented]"}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte

/* ---------- rijen (her)bouwen ---------- */

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
