), en u zult vluchten, zoals u vluchtte voor de aardbeving in de dagen van Uzzia, de koning van Juda; dan zal de HEERE, mijn God, komen, *en* al de heiligen met U, *o* *Heere*!","6":"En het zal op die dag gebeuren, dat er geen kostelijk licht zal zijn, en ook geen dikke duisternis.","7":"Maar het zal één enige dag zijn, die de HEERE bekend zal zijn; het zal geen dag en geen nacht zijn; en het zal gebeuren, ten tijde van de avond, dat het licht zal zijn.","8":"Ook zal het op die dag gebeuren, dat er levend water uit Jeruzalem zal vloeien, de helft daarvan naar de oostzee, en de helft daarvan naar de achterste zee toe; het zal 's zomers en 's winters zijn.","9":"En de HEERE zal Koning zijn over de hele aarde; op die dag zal de HEERE één zijn, en Zijn Naam één.","10":"Dit hele land zal rondom als een vlak veld gemaakt worden, van Geba tot Rimmon toe, zuidwaarts van Jeruzalem; en zij zal verhoogd en bewoond worden op haar plaats; van de poort van Benjamin af, tot aan de plaats van de eerste poort, tot aan de Hoekpoort toe; en *van* de toren van Hananeel, tot aan de wijnbakken van de koning toe.","11":"En zij zullen daarin wonen, en er zal geen verbanning meer zijn; want Jeruzalem zal zeker wonen.","12":"En dit zal de plaag zijn, waarmee de HEERE alle volken plagen zal, die tegen Jeruzalem oorlog gevoerd zullen hebben: Hij zal het vlees van iedereen, terwijl hij op zijn voeten staat, doen wegteren; en de ogen van iedereen zullen wegteren in hun holen; de tong van iedereen zal in hun mond wegteren.","13":"Ook zal het op die dag gebeuren, dat er een groot rumoer van de HEERE onder hen zal zijn, zodat ieder de hand van zijn naaste zal grijpen, en de hand van ieder zal tegen de hand van zijn naaste opgaan.","14":"En ook zal Juda in Jeruzalem strijden; en het vermogen van alle heidenen rondom zal verzameld worden, goud en zilver, en kleren in grote overvloed.","15":"Zo zal ook de plaag van de paarden, van de muildieren, van de kamelen, en van de ezels, en van alle beesten zijn, die in die legers geweest zullen zijn, zoals die andere plaag geweest is.","16":"En het zal gebeuren, dat allen die overgebleven zijn van alle heidenen die tegen Jeruzalem gekomen zullen zijn, van jaar tot jaar zullen optrekken om de Koning, de HEERE van de heerscharen, te aanbidden, en om het feest van de loofhutten te vieren.","17":"En het zal gebeuren: wie van de geslachten van de aarde niet naar Jeruzalem zal optrekken om de Koning, de HEERE van de heerscharen, te aanbidden, over hen zal geen regen zijn.","18":"En als het geslacht van de Egyptenaren, over wie *de* *regen* niet is, niet zal optrekken en niet zal komen, dan zal die plaag *over* *hen* zijn, waarmee de HEERE de heidenen plagen zal die niet optrekken zullen om het feest van de loofhutten te vieren.","19":"Dit zal de zonde van de Egyptenaren zijn, alsook de zonde van alle heidenen, die niet zullen optrekken om het feest van de loofhutten te vieren.","20":"Op die dag zal op de bellen van de paarden staan: DE HEILIGHEID VAN DE HEERE. En de potten in het huis van de HEERE zullen zijn als de sprenkelschalen voor het altaar;","21":"Ja, al de potten in Jeruzalem en in Juda zullen de HEERE van de heerscharen heilig zijn, zodat allen die willen offeren, zullen komen, en daarvan nemen, en daarin koken; en er zal geen Kanaäniet meer zijn in het huis van de HEERE van de heerscharen, op die dag."},"SV":{"1":"Ziet, de dag komt den HEERE, dat uw roof zal uitgedeeld worden in het midden van u, *o* *Jeruzalem*!","2":"Want Ik zal alle heidenen tegen Jeruzalem ten strijde verzamelen; en de stad zal ingenomen, en de huizen zullen geplunderd, en de vrouwen zullen geschonden worden ; en de helft der stad zal uitgaan in de gevangenis; maar het overige des volks zal uit de stad niet uitgeroeid worden.","3":"En de HEERE zal uittrekken, en Hij zal strijden tegen die heidenen, gelijk ten dage als Hij gestreden heeft, ten dage des strijds.","4":"En Zijn voeten zullen te dien dage staan op den Olijfberg, die voor Jeruzalem ligt, tegen het oosten; en de Olijfberg zal in tweeën gespleten worden naar het oosten, en naar het westen, *zodat* er een zeer grote vallei zal zijn; en de ene helft des bergs zal wijken naar het noorden, en de helft deszelven naar het zuiden.","5":"Dan zult gijlieden vlieden *door* de vallei Mijner bergen ( want deze vallei der bergen zal reiken tot Azal), en gij zult vlieden, gelijk als gij vloodt voor de aardbeving in de dagen van Uzzia, den koning van Juda; den zal de HEERE, mijn God, komen, *en* al de heiligen met U, *o* *Heere*!","6":"En het zal te dien dage geschieden, dat er niet zal zijn het kostelijk licht, en de dikke duisternis.","7":"Maar het zal een enige dag zijn, die den HEERE bekend zal zijn; het zal noch dag, noch nacht zijn; en het zal geschieden, ten tijde des avonds, dat het licht zal wezen.","8":"Ook zal het te dien dage geschieden, dat er levende wateren uit Jeruzalem vlieten zullen, de helft van die naar de oostzee, en de helft van die naar de achterste zee aan; zij zullen des zomers en des winters zijn.","9":"En de HEERE zal tot Koning over de ganse aarde zijn; te dien dage zal de HEERE een zijn, en Zijn Naam een.","10":"Dit ganse land zal rondom als een vlak veld gemaakt worden, van Geba tot Rimmon toe, zuidwaarts van Jeruzalem; en zij zal verhoogd en bewoond worden in haar plaats; van de poort van Benjamin af, tot aan de plaats van de eerste poort, tot aan de Hoekpoort toe; en *van* den toren van Hananeel, tot aan des konings wijnbakken toe.","11":"En zij zullen daarin wonen, en er zal geen verbanning meer zijn; want Jeruzalem zal zeker wonen.","12":"En dit zal de plage zijn, waarmede de HEERE al de volken plagen zal, die tegen Jeruzalem krijg gevoerd zullen hebben: Hij zal een iegelijks vlees, daar hij op zijn voeten staat, doen uitteren; en een iegelijks ogen zullen uitteren in hun holen; een eens iegelijks tong zal in hun mond uitteren.","13":"Ook zal het te dien dage geschieden, dat er een groot gedruis van den HEERE onder hen zal wezen, zodat zij een ieder zijns naasten hand zullen aangrijpen, een eens ieders hand zal tegen de hand zijns naasten opgaan.","14":"En ook zal Juda te Jeruzalem strijden; en het vermogen aller heidenen rondom zal verzameld worden, goud en zilver, en klederen in grote menigte.","15":"Alzo zal ook de plage der paarden, der muildieren, der kemelen, en der ezelen, en aller beesten zijn, die in diezelve heirlegers geweest zullen zijn, gelijk gener plage geweest is.","16":"En het zal geschieden, dat al de overgeblevenen van alle heidenen, die tegen Jeruzalem zullen gekomen zijn, die zullen van jaar tot jaar optrekken om aan te bidden den Koning, den HEERE der heirscharen, en om te vieren het feest der loofhutten.","17":"En het zal geschieden, zo wie van de geslachten der aarde niet zal optrekken naar Jeruzalem, om den Koning, den HEERE der heirscharen, te aanbidden, zo zal er over henlieden geen regen wezen.","18":"En indien het geslacht der Egyptenaren, over dewelke *de* *regen* niet is, niet zal optrekken noch komen, zo zal die plage *over* *hen* zijn, *met* dewelke de HEERE die heidenen plagen zal, die niet optrekken zullen, om te vieren het feest der loofhutten.","19":"Dit zal de zonde der Egyptenaren zijn, mitsgaders de zonde aller heidenen, die niet optrekken zullen, om te vieren het feest der loofhutten.","20":"Te dien dage zal op de bellen der paarden staan: De HEILIGHEID DES HEEREN. En de potten in het huis des HEEREN zullen zijn als de sprengbekkens voor het altaar;","21":"Ja, al de potten in Jeruzalem en in Juda zullen den HEERE der heirscharen heilig zijn, zodat allen, die offeren willen, zullen komen, en van dezelve nemen, en in dezelve koken; en er zal geen Kanaäniet meer zijn, in het huis des HEEREN der heirscharen, te dien dage."},"KJV":{"1":"Behold, the day of the LORD cometh, and thy spoil shall be divided in the midst","2":"For I will gather all nations against Jerusalem to battle; and the city shall be taken, and the houses rifled, and the women ravished; and half of the city shall go forth into captivity, and the residue of the people shall not be cut off from the city.","3":"Then shall the LORD go forth, and fight against those nations, as when he fought in the day of battle.","4":"And his feet shall stand in that day upon the mount of Olives, which *is* before Jerusalem on the east, and the mount of Olives shall cleave in the midst thereof toward the east and toward the west, *and there shall be* a very great valley; and half of the mountain shall remove toward the north, and half of it toward the south.","5":"And ye shall flee *to* the valley of the mountains; for the valley of the mountains shall reach unto Azal: yea, ye shall flee, like as ye fled from before the earthquake in the days of Uzziah king of Judah: and the LORD my God shall come, *and* all the saints","6":"And it shall come to pass in that day, *that* the light shall not be clear, *nor* dark:","7":"But it shall be one day which shall be known to the LORD, not day, nor night: but it shall come to pass, *that* at evening time it shall be light.","8":"And it shall be in that day, *that* living waters shall go out from Jerusalem; half of them toward the former sea, and half of them toward the hinder sea: in summer and in winter","9":"And the LORD shall be king over all the earth: in that day shall there be one LORD, and his name one.","10":"All the land shall be turned as a plain from Geba to Rimmon south of Jerusalem: and it shall be lifted up, and inhabited in her place, from Benjamin's gate unto the place of the first gate, unto the corner gate, and *from* the tower of Hananeel unto the king's winepresses.","11":"And *men* shall dwell in it, and there shall be no more utter destruction; but Jerusalem shall be safely inhabited.","12":"And this shall be the plague wherewith the LORD will smite all the people that have fought against Jerusalem; Their flesh shall consume away while they stand upon their feet, and their eyes shall consume away in their holes, and their tongue shall consume away in their mouth.","13":"And it shall come to pass in that day, *that* a great tumult from the LORD shall be among them; and they shall lay hold every one on the hand of his neighbour, and his hand shall rise up against the hand of his neighbour.","14":"And Judah also shall fight at Jerusalem; and the wealth of all the heathen round about shall be gathered together, gold, and silver, and apparel, in great abundance.","15":"And so shall be the plague of the horse, of the mule, of the camel, and of the ass, and of all the beasts that shall be in these tents, as this plague.","16":"And it shall come to pass, *that* every one that is left of all the nations which came against Jerusalem shall even go up from year to year to worship the King, the LORD of hosts, and to keep the feast of tabernacles.","17":"And it shall be, *that* whoso will not come up of *all* the families of the earth unto Jerusalem to worship the King, the LORD of hosts, even upon them shall be no rain.","18":"And if the family of Egypt go not up, and come not, that *have* no *rain*; there shall be the plague, wherewith the LORD will smite the heathen that come not up to keep the feast of tabernacles.","19":"This shall be the punishment of Egypt, and the punishment of all nations that come not up to keep the feast of tabernacles.","20":"In that day shall there be upon the bells of the horses, HOLINESS UNTO THE LORD; and the pots in the LORD'S house shall be like the bowls before the altar.","21":"Yea, every pot in Jerusalem and in Judah shall be holiness unto the LORD of hosts: and all they that sacrifice shall come and take of them, and seethe therein: and in that day there shall be no more the Canaanite in the house of the LORD of hosts."}},"tsk":{"2":[{"kopje":"verzamelen","refs":["Deut 28:9-14","Jes 5:26","Jer 34:1","Dan 2:40-43","Joël 3:2","Matt 22:7","Luk 2:1"]},{"kopje":"de stad","refs":["Matt 23:37","Matt 23:38","Matt 24:15","Matt 24:16","Mark 13:14","Mark 480\">en</span> daarin <span class=\"wl\" data-l=\"L12\" data-code=\"H1310\">koken</span>; <span class=\"wl\" data-l=\"L12\" data-code=\"H1310\">en</span> <span class=\"wl\" data-l=\"L13\" data-code=\"H3808\">er</span> <span class=\"wl\" data-l=\"L13\" data-code=\"H3808\">zal</span> <span class=\"wl\" data-l=\"L13\" data-code=\"H3808\">geen</span> <span class=\"wl\" data-l=\"L14\" data-code=\"H3669\">Kanaäniet</span> <span class=\"wl\" data-l=\"L15\" data-code=\"H5750\">meer</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H1961\">zijn</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H1961\">in</span> <span class=\"wl\" data-l=\"L16\" data-code=\"H1004\">het</span> <span class=\"wl\" data-l=\"L16\" data-code=\"H1004\">huis</span> <span class=\"wl\" data-l=\"L16\" data-code=\"H1004\">van</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H6635\">de</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H6635\">HEERE</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H6635\">van</span> de heerscharen, op die dag."},"koppeling_kjv":{"1":"Behold, the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H935\">cometh,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H7998\">spoil</span> shall be <span class=\"wl wl-kjv\" data-code=\"H2505\">divided</span> in the midst","2":"For I will <span class=\"wl wl-kjv\" data-code=\"H622\">gather</span> all <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> against <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> to <span class=\"wl wl-kjv\" data-code=\"H4421\">battle;</span> and the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> shall be <span class=\"wl wl-kjv\" data-code=\"H3920\">taken,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1004\">houses</span> <span class=\"wl wl-kjv\" data-code=\"H8155\">rifled,</span> and the <span class=\"wl wl-kjv\" data-code=\"H802\">women</span> <span class=\"wl wl-kjv\" data-code=\"H7901\">ravished;</span> and <span class=\"wl wl-kjv\" data-code=\"H2677\">half</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> shall go <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> into <span class=\"wl wl-kjv\" data-code=\"H1473\">captivity,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3499\">residue</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> shall not be cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> from the city.","3":"Then shall the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> go <span class=\"wl wl-kjv\" data-code=\"H3318\">forth,</span> and <span class=\"wl wl-kjv\" data-code=\"H3898\">fight</span> against those <span class=\"wl wl-kjv\" data-code=\"H1471\">nations,</span> as <span class=\"wl wl-kjv\" data-code=\"H3117\">when</span> he <span class=\"wl wl-kjv\" data-code=\"H3898\">fought</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of battle.","4":"And his <span class=\"wl wl-kjv\" data-code=\"H7272\">feet</span> shall <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> upon the <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> of <span class=\"wl wl-kjv\" data-code=\"H2132\">Olives,</span> which is <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> on the <span class=\"wl wl-kjv\" data-code=\"H6924\">east,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> of <span class=\"wl wl-kjv\" data-code=\"H2132\">Olives</span> shall <span class=\"wl wl-kjv\" data-code=\"H1234\">cleave</span> in the <span class=\"wl wl-kjv\" data-code=\"H2677\">midst</span> thereof toward the <span class=\"wl wl-kjv\" data-code=\"H4217\">east</span> and toward the <span class=\"wl wl-kjv\" data-code=\"H3220\">west,</span> and there shall be a <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H1516\">valley;</span> and <span class=\"wl wl-kjv\" data-code=\"H2677\">half</span> of the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain</span> shall <span class=\"wl wl-kjv\" data-code=\"H4185\">remove</span> toward the <span class=\"wl wl-kjv\" data-code=\"H6828\">north,</span> and <span class=\"wl wl-kjv\" data-code=\"H2677\">half</span> of it toward the south.","5":"And ye shall <span class=\"wl wl-kjv\" data-code=\"H5127\">flee</span> to the <span class=\"wl wl-kjv\" data-code=\"H1516\">valley</span> of the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains;</span> for the <span class=\"wl wl-kjv\" data-code=\"H1516\">valley</span> of the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains</span> shall <span class=\"wl wl-kjv\" data-code=\"H5060\">reach</span> unto <span class=\"wl wl-kjv\" data-code=\"H682\">Azal:</span> yea, ye shall <span class=\"wl wl-kjv\" data-code=\"H5127\">flee,</span> like as ye <span class=\"wl wl-kjv\" data-code=\"H5127\">fled</span> from <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H7494\">earthquake</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of <span class=\"wl wl-kjv\" data-code=\"H5818\">Uzziah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah:</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> my <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> and all the saints","6":"And it shall come to pass in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> that the <span class=\"wl wl-kjv\" data-code=\"H216\">light</span> shall not be <span class=\"wl wl-kjv\" data-code=\"H3368\">clear,</span> nor <span class=\"wl wl-kjv\" data-code=\"H7087\">dark:</span>","7":"But it shall be <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> which shall be <span class=\"wl wl-kjv\" data-code=\"H3045\">known</span> to the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> not <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> nor <span class=\"wl wl-kjv\" data-code=\"H3915\">night:</span> but it shall come to pass, that at <span class=\"wl wl-kjv\" data-code=\"H6153\">evening</span> <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> it shall be light.","8":"And it shall be in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> that <span class=\"wl wl-kjv\" data-code=\"H2416\">living</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> shall go <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> from <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem;</span> <span class=\"wl wl-kjv\" data-code=\"H2677\">half</span> of them toward the <span class=\"wl wl-kjv\" data-code=\"H6931\">former</span> <span class=\"wl wl-kjv\" data-code=\"H3220\">sea,</span> and <span class=\"wl wl-kjv\" data-code=\"H2677\">half</span> of them toward the <span class=\"wl wl-kjv\" data-code=\"H314\">hinder</span> <span class=\"wl wl-kjv\" data-code=\"H3220\">sea:</span> in <span class=\"wl wl-kjv\" data-code=\"H7019\">summer</span> and in winter","9":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall be <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> over all the <span class=\"wl wl-kjv\" data-code=\"H776\">earth:</span> in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> shall there be <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> one.","10":"All the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> shall be <span class=\"wl wl-kjv\" data-code=\"H5437\">turned</span> as a <span class=\"wl wl-kjv\" data-code=\"H6160\">plain</span> from <span class=\"wl wl-kjv\" data-code=\"H1387\">Geba</span> to <span class=\"wl wl-kjv\" data-code=\"H7417\">Rimmon</span> <span class=\"wl wl-kjv\" data-code=\"H5045\">south</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem:</span> and it shall be lifted <span class=\"wl wl-kjv\" data-code=\"H7213\">up,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabited</span> in her place, from <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin's</span> <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> of the <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> <span class=\"wl wl-kjv\" data-code=\"H8179\">gate,</span> unto the <span class=\"wl wl-kjv\" data-code=\"H6434\">corner</span> <span class=\"wl wl-kjv\" data-code=\"H8179\">gate,</span> and from the <span class=\"wl wl-kjv\" data-code=\"H4026\">tower</span> of <span class=\"wl wl-kjv\" data-code=\"H2606\">Hananeel</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> winepresses.","11":"And men shall <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> in it, and there shall be no more utter <span class=\"wl wl-kjv\" data-code=\"H2764\">destruction;</span> but <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> shall be <span class=\"wl wl-kjv\" data-code=\"H983\">safely</span> inhabited.","12":"And this shall be the <span class=\"wl wl-kjv\" data-code=\"H4046\">plague</span> wherewith the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will <span class=\"wl wl-kjv\" data-code=\"H5062\">smite</span> all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that have <span class=\"wl wl-kjv\" data-code=\"H6633\">fought</span> against <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem;</span> Their <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> shall consume <span class=\"wl wl-kjv\" data-code=\"H4743\">away</span> while they <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> upon their <span class=\"wl wl-kjv\" data-code=\"H7272\">feet,</span> and their <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> shall consume <span class=\"wl wl-kjv\" data-code=\"H4743\">away</span> in their <span class=\"wl wl-kjv\" data-code=\"H2356\">holes,</span> and their <span class=\"wl wl-kjv\" data-code=\"H3956\">tongue</span> shall consume <span class=\"wl wl-kjv\" data-code=\"H4743\">away</span> in their mouth.","13":"And it shall come to pass in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> that a <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4103\">tumult</span> from the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall be among them; and they shall lay <span class=\"wl wl-kjv\" data-code=\"H2388\">hold</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> on the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of his <span class=\"wl wl-kjv\" data-code=\"H7453\">neighbour,</span> and his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> shall rise <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> against the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of his neighbour.","14":"And <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> also shall <span class=\"wl wl-kjv\" data-code=\"H3898\">fight</span> at <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem;</span> and the <span class=\"wl wl-kjv\" data-code=\"H2428\">wealth</span> of all the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> shall be gathered <span class=\"wl wl-kjv\" data-code=\"H622\">together,</span> <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> and <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> and <span class=\"wl wl-kjv\" data-code=\"H899\">apparel,</span> in <span class=\"wl wl-kjv\" data-code=\"H3966\">great</span> abundance.","15":"And so shall be the <span class=\"wl wl-kjv\" data-code=\"H4046\">plague</span> of the <span class=\"wl wl-kjv\" data-code=\"H5483\">horse,</span> of the <span class=\"wl wl-kjv\" data-code=\"H6505\">mule,</span> of the <span class=\"wl wl-kjv\" data-code=\"H1581\">camel,</span> and of the <span class=\"wl wl-kjv\" data-code=\"H2543\">ass,</span> and of all the <span class=\"wl wl-kjv\" data-code=\"H929\">beasts</span> that shall be in <span class=\"wl wl-kjv\" data-code=\"H1992\">these</span> <span class=\"wl wl-kjv\" data-code=\"H4264\">tents,</span> as this plague.","16":"And it shall come to pass, that every one that is <span class=\"wl wl-kjv\" data-code=\"H3498\">left</span> of all the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> which <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> against <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> shall even go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> <span class=\"wl wl-kjv\" data-code=\"H1767\">from</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> to <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> to <span class=\"wl wl-kjv\" data-code=\"H7812\">worship</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">King,</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> and to <span class=\"wl wl-kjv\" data-code=\"H2287\">keep</span> the <span class=\"wl wl-kjv\" data-code=\"H2282\">feast</span> of tabernacles.","17":"And it shall be, that whoso will not come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> of all the <span class=\"wl wl-kjv\" data-code=\"H4940\">families</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> unto <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> to <span class=\"wl wl-kjv\" data-code=\"H7812\">worship</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">King,</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> even upon them shall be no rain.","18":"And if the <span class=\"wl wl-kjv\" data-code=\"H4940\">family</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> go not <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> not, that have no rain; there shall be the <span class=\"wl wl-kjv\" data-code=\"H4046\">plague,</span> wherewith the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will <span class=\"wl wl-kjv\" data-code=\"H5062\">smite</span> the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen</span> that come not <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H2287\">keep</span> the <span class=\"wl wl-kjv\" data-code=\"H2282\">feast</span> of tabernacles.","19":"This shall be the <span class=\"wl wl-kjv\" data-code=\"H2403\">punishment</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2403\">punishment</span> of all <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> that come not <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H2287\">keep</span> the <span class=\"wl wl-kjv\" data-code=\"H2282\">feast</span> of tabernacles.","20":"In that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> shall there be upon the <span class=\"wl wl-kjv\" data-code=\"H4698\">bells</span> of the <span class=\"wl wl-kjv\" data-code=\"H5483\">horses,</span> <span class=\"wl wl-kjv\" data-code=\"H6944\">HOLINESS</span> UNTO THE <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> and the <span class=\"wl wl-kjv\" data-code=\"H5518\">pots</span> in the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> shall be like the <span class=\"wl wl-kjv\" data-code=\"H4219\">bowls</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the altar.","21":"Yea, every <span class=\"wl wl-kjv\" data-code=\"H5518\">pot</span> in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> and in <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> shall be <span class=\"wl wl-kjv\" data-code=\"H6944\">holiness</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts:</span> and all they that <span class=\"wl wl-kjv\" data-code=\"H2076\">sacrifice</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> of them, and <span class=\"wl wl-kjv\" data-code=\"H1310\">seethe</span> therein: and in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> there shall be no more the <span class=\"wl wl-kjv\" data-code=\"H3669\">Canaanite</span> in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of hosts."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"de dag komt den HEERE,","tekst":"Dat is, daar komt een dag voor den Heere. Anders: de dag des HEEREN komt; of de dag van den Heere komt, dat is, de dag die den Heere bekend is, gelijk in vs.7 staat. Sommigen verstaan dit van den tijd der verwoesting van Jeruzalem door Vespasianus en Titus; anderen van de vervolging der kerk onder den wreden koning Antiochus, ten tijde der Macchabeën. Anderen duiden dit op den Antichrist en zijne wrede vervolgingen."},{"catchword":"o Jeruzalem","tekst":"Versta hierbij, en gij Joodse land."}],"2":[{"catchword":"alle heidenen","tekst":"Verg. Eze 38:4 , Eze 38:6 , Eze 38:9 , Eze 38:15 , en Hab 1:6 . Alle, is hier te zeggen, vele of allerlei, gelijk Jon 2:3 ."},{"catchword":"de helft der stad","tekst":"Dat is, een groot deel van de inwoners der stad zal gevankelijk uitgevoerd worden; te weten, van die overgeblevenen, die door de pest, honger, of het zwaard niet omgekomen zijn."},{"catchword":"het overige des volks","tekst":"Verstaat men deze profetie van de belegering van Jeruzalem door Vespasianus en Titus, zo is het te zeggen dat de godzaligen, vóór de vaste belegering der stad, zullen uitgaan naar het stadje Pella, en alzo bij het leven blijven zullen. Dit is dat derde deel waar de profeet van gesproken heeft, Zech 13:8-9 ."}],"3":[{"catchword":"tegen die heidenen,","tekst":"Te weten, tegen die volken, die vijanden zijn van Gods kerk."},{"catchword":"gelijk ten dage als Hij gestreden heeft,","tekst":"Of, gelijk Hij [voor ulieden] placht te strijden in den dag des strijds, namelijk ten tijde van Mozes, Jozua, Gideon, Debora, David, Asa, en op andere tijden meer."}],"4":[{"catchword":"te dien dage staan op den Olijfberg,","tekst":"Te weten, ten tijde van Christus, die op den Olijfberg verkeerd heeft, aldaar zijn lijden aangevangen en ten hemel is gevaren. Zie Luk 22:39 ; Act 1:12 ."},{"catchword":"die voor Jeruzalem ligt,","tekst":"Hebr. die voor het aangezicht van Jeruzalem is tegen het oosten. Zie Act 1:12 ."},{"catchword":"in tweeën gespleten worden","tekst":"Hebr. in zijn midden, of in zijn helft gespleten worden."},{"catchword":"naar het oosten, en naar het westen,","tekst":"Dat is, in de lengten van het oosten tot het westen toe."},{"catchword":"zodat er een zeer grote vallei zal zijn;","tekst":"Dat is, zodat er een zeer groot dal tussen die twee helften van den berg zal wezen, en dat men Jeruzalem bescheidenlijk zal kunnen zien liggen, hetwelk tevoren met dezen berg en andere als bedekt lag of verborgen was. Versta dit van het geestelijke Jeruzalem, namelijk de kerk Gods, waarvan de heidenen vóór de komst van Christus, geen kennis hadden; maar dan zullen alle hindernissen, die de heidenen den toegang tot Christus en zijne kerk konden verhinderen of afsnijden, weggenomen worden, en zij zullen een open pas hebben tot dezelven. Verg. Isa 57:14 , en Isa 62:10 ."}],"5":[{"catchword":"gijlieden","tekst":"O mijne uitverkorenen."},{"catchword":"vlieden","tekst":"Dat is, haastelijk toelopen, gelijk de vluchtenden plegen te doen. Of, men kan het verstaan van de goddeloze Joden, die door schrik en vrees van straf wegvluchten zouden en ruimte maken voor het aankomende volk des Heeren."},{"catchword":"door de vallei","tekst":"Anders: tot de vallei mijner bergen; dat is, tot mijne kerk."},{"catchword":"Mijner bergen","tekst":"Of, der bergen; dat is, dier twee delen van den Olijfberg, die Ik met het doorspijten van den Olijfberg, gemaakt heb."},{"catchword":"Azal","tekst":"Anders: tot den berg, dien Hij afgezonderd, of verkoren heeft, te weten, den berg Zion. Hij, te weten, de Heere. De zin is: Daar zal een wijde baan zijn, alzo dat een ieder wel plaats en ruimte hebben zal om de kerk van Christus te kunnen komen. Wat den berg Azal aangaat, is onzeker waar hij ligt, want van dezelven wordt nergens meer gedacht."},{"catchword":"en gij zult vlieden,","tekst":"Anders: gij zult vinden, zeg ik, gelijk, enz."},{"catchword":"voor de aardbeving","tekst":"Of, vanwege de aardbeving, of uit vrees der aardbeving. Zie Amo 1:1 ."},{"catchword":"in de dagen van Uzzia,","tekst":"Zie de koning Uzzia, 2Ch 26:19 ."},{"catchword":"dan zal de HEERE,","tekst":"Dit spreekt de profeet in zijn eigen persoon. De zin is: Na de eerste verschijning van Christus, in het vlees, zal de andere volgen ten jongsten dage."},{"catchword":"al de heiligen","tekst":"Dat is, alle engelen. Zie Dan 8:13 ."},{"catchword":"met U, o HEERE","tekst":"Hier wendt de profeet zijne aanspraak tot Christus, hetwelk, gelijk sommigen menen, daarom geschiedt, omdat de profeet wel geweten heeft, dat die boze Joden hem niet geloven zouden. Verg. Joel 3:11 ."}],"6":[{"catchword":"dat er niet zal zijn","tekst":"Dat is, daar zullen gene beurten zijn van licht en duisternis, klaren dag en nacht, het zal een eeuwige dag zijn; zie Isa 60:19-20 ; Rev 21:23 , en Rev 22:5 . Doch enigen verstaan dit van het licht van het heilg Evangelie, hetwelk ten tijde van Christus lichten zal. Anderen van de verduistering der zon ten tijde van het lijden van Christus."},{"catchword":"het kostelijke licht,","tekst":"Dat is, het klare licht, gelijk Job 31:26 ."},{"catchword":"dikke duisternis","tekst":"Hebr. samenstemming, te weten, der duisternis."}],"7":[{"catchword":"een enige dag zijn,","tekst":"Dat is, een dag die eeuwig duren zal."},{"catchword":"die den HEERE bekend zal zijn;","tekst":"De Heere alleen weet wanneer deze dag beginnen zal; Mat 24:36 ."},{"catchword":"dag,","tekst":"Te weten, zulk een dag, die met de zon voortkomt."},{"catchword":"nacht zijn;","tekst":"Te weten, zulk een nacht, als nu door het wegblijven der zon komt."},{"catchword":"des avonds,","tekst":"Versta hier door avond den gehelen nacht, of ten tijde van den avond; dat is, als het placht avond te worden. Zie Isa 60:20 ; Rev 21:23 ."}],"8":[{"catchword":"te dien dage geschieden,","tekst":"Ten tijde der verschijning van Christus in het vlees."},{"catchword":"levende wateren uit Jeruzalem vlieten zullen,","tekst":"Dat is, altijd vloeiende en vliedende. Hierdoor moet men verstaan de gaven van de Heilige Geest , die Christus overvloedig over zijne kerk uitstorten zou; zie Eze 47:1 ; Joel 3:18 ; Rev 22:1 ; verg. Joh 4:14 , en Joh 7:38 ."},{"catchword":"de helft van die naar de Oostzee,","tekst":"Dat is, alle gelovigen der ganse wereld, zij zijn waar zij zijn mogen, hetzij tegen den opgang of den ondergang der zon, zullen die geestelijke gaven deelachtig worden."},{"catchword":"de achterste zee aan;","tekst":"Aldus wordt de Middellandse zee genoemd. Zie Deu 11:24 , en Deu 34:2 ."},{"catchword":"zij zullen des zomers en des winters","tekst":"Dat is, in eeuwigheid en altoosdurend."},{"catchword":"zijn","tekst":"Dat is, duren, vlieten. Anders: het zal des zomers, en des winters geschieden."}],"9":[{"catchword":"de HEERE","tekst":"Te weten, de Heere Christus Jezus."},{"catchword":"zal de HEERE","tekst":"Dat is, Hij zal alleen geëerd worden, als zijnde de enige ware God en Zaligmaker, de afgoden zullen uitgeroeid worden; Zech 13:2 ."},{"catchword":"zijn, en Zijn Naam een","tekst":"Dat is, bekend worden te zijn. Aldus wordt het woord zijn ook gebruikt Joh 15:8 ; Gij zult mijne discipelen zijn; dat is, voor mijne discipelen bekend worden."}],"10":[{"catchword":"Dit ganse land","tekst":"Te weten, het land van Juda, van het ene einde van het land tot aan het andere. Want Geba [anders] Gibea lag aan den landpaal der Benjaminieten, 1Ki 15:22 , en Rimmon aan de landpalen van den stam van Juda; Jos 15:32 , en Jos 19:7 ; zie van Geba Jos 21:17 ; 1Ki 15:22 , en Isa 10:29 ."},{"catchword":"zij zal","tekst":"Te weten, de stad Jeruzalem, waar door de kerk Gods hier wordt beduid, inzonderheid de kerk van het Nieuwe Testament."},{"catchword":"verhoogd","tekst":"Dat is, beroemd en heerlijk gemaakt worden."},{"catchword":"bewoond worden in haar plaats;","tekst":"Dat is, velen zullen zich tot de kerk begeven."},{"catchword":"van de poort van Benjamin af,","tekst":"Dat is, aan alle plaatsen waar de Heere zijne kerk hebben zal. Van de poort van Benjamin wordt ook gesproken, Jer 20:2 , en Jer 37:13 ."},{"catchword":"den toren van Hanáneël,","tekst":"Zie Neh 3:1 , en Neh 12:39 , en Jer 31:38 ."}],"11":[{"catchword":"daarin wonen,","tekst":"Te weten, in de stad Jeruzalem, dat is in de gemeente Gods."},{"catchword":"er zal geen verbanning meer zijn;","tekst":"Dat is, zij zal niet meer verstoord worden, gelijk voordezen geschied is, toen het scheen dat Ik hen geheel verbannen en verstoten had; zie Deu 2:34 ."},{"catchword":"Jeruzalem","tekst":"Dat is, de inwoners van Jeruzalem."},{"catchword":"zeker","tekst":"Hebr. in verzekerdheid."},{"catchword":"wonen","tekst":"Of, bewoond worden."}],"12":[{"catchword":"En dit zal de plage zijn,","tekst":"Nadat de profeet van den stand en de gelegenheid der gelovigen gesproken heeft, spreekt hij nu hier van de plagen en ellenden der goddelozen."},{"catchword":"die tegen Jeruzalem krijg gevoerd zullen hebben","tekst":"Dat is, die kerk Gods bevochten en vervolgd hebben."},{"catchword":"een iegelijks vlees,","tekst":"Hebr. zijn vlees; dat is, eens ieders vlees, lichaam, leden, of deszelfs vlees, alzo straks, zijne ogen en zijne tong."},{"catchword":"hij op zijn voeten staat,","tekst":"Dat is, haastelijk, onvoorziens, geen kwaad vermoedende. Zie het voorbeeld in Herodes; Act 12:21 , enz."},{"catchword":"doen uitteren;","tekst":"Dat is, ganselijk verderven."},{"catchword":"tong zal in hun mond uitteren","tekst":"Met welke zij God en de vromen gelasterd en gesmaad hebben."}],"13":[{"catchword":"Ook zal het te dien dage geschieden,","tekst":"De zin is: God de Heere zal hen niet alleen door zijne hand plagen, vs.12; maar ook door henzelven onder elkander; en ook door zijn volk, vs.14; verg. Eze 30:21 , enz."},{"catchword":"een groot gedruis","tekst":"Of, een groot rumoer, of getrommel, hetwelk hun de Heere aanjagen zal."},{"catchword":"van den HEERE","tekst":"Hebr. des Heeren."},{"catchword":"aangrijpen,","tekst":"Hetzij vijandelijkerwijze; of uit angst en vrees, hulp en troost van zijne vriend, metgezel of naaste verzoekende; verg. Jdg 7:22 ; 1Sa 14:20 ; Eze 38:21-22 ."},{"catchword":"opgaan","tekst":"Hetzij om te slaan, of, gelijk het anderen verstaan, om hulp en bijstand te zoeken."}],"14":[{"catchword":"Juda te Jeruzalem","tekst":"Dat is, het Joodse volk, de Joden. Anders: ook zult gij, Juda, tegen Jeruzalem strijden."},{"catchword":"strijden;","tekst":"Te weten, tegen die volken, van wie in vs.12, gesproken is."},{"catchword":"verzameld worden,","tekst":"Dat is, weggevoerd worden, het zal verzameld worden om weggevoerd te worden. De zin is: God zal zijne kerk een volkomen overwinning geven over al hare vijanden, alzo dat zij hen zullen plunderen en al hunne goederen roven, gelijk in den krijg geschiedt, als men zijne vijanden heeft overwonnen. Het is een figuurlijke manier van spreken van den krijg en krijgers genomen."}],"15":[{"catchword":"de plage","tekst":"De zin is: De Heere zal niet alleen de vijanden zijner kerk verdelgen, maar ook al hunne macht en geweld, mitsgaders al de middelen, die zij gebruikt hebben om Gods volk te bevechten, zal Hij teniet maken."},{"catchword":"der paarden,","tekst":"Hebr. van het paard, van den muil, enz."},{"catchword":"in diezelve heirlegers geweest zullen zijn,","tekst":"Versta, de heirlegers dergenen, die rondom Jeruzalem zijn zouden."},{"catchword":"gener plage geweest is","tekst":"Te weten, mensenplaag, waarvan in vs.12-14, gesproken is."}],"16":[{"catchword":"al de overgeblevenen van alle heidenen,","tekst":"Dat is, al degenen, die de Heere niet zal verdelgd hebben, te weten, alle uitverkorenen, die tot de ware kennis Gods zullen gebracht wezen door de predikatie van het heilg Evangelie."},{"catchword":"optrekken","tekst":"Te weten, naar Jeruzalem. De Heere zal hen bekeren, alzo dat zij zich ook tot de Christelijke gemeente begeven zullen om den Heere te dienen. De profeet beschrijft hier den inwendigen godsdienst der kerk van het Nieuwe Testament door den uiterlijken godsdienst, die in het Oude Testament is gebruikelijk geweest."},{"catchword":"den Koning, den HEERE der heirscharen,","tekst":"Dat is, den Heere Christus."},{"catchword":"om te vieren het feest der loofhutten","tekst":"Dat is, om God te loven voor zijne weldaden, gelijk het volk Gods placht te doen, als het het feest der loofhutten placht te houden. Zie Lev 23:34 , enz. En onder den naam van dit feest vervat hij allerhande eer, die men Gode te doen schuldig is."}],"17":[{"catchword":"zo zal er over henlieden geen regen wezen","tekst":"Dat is, zij zullen van den Heere niet gezegend worden, maar integendeel zullen zij vervloekt wezen. De regen zijnde een uiterlijk teken van den zegen des Heeren. Verg. Deu 28:23-24 ; Isa 30:23 ."}],"18":[{"catchword":"het geslacht der Egyptenaren,","tekst":"Eenigen verstaan hier door de Egyptenaars [die grote vijanden der kerk Gods waren] ook alle andere heidense natiën, vijanden van Gods kerk."},{"catchword":"over dewelke de regen niet is,","tekst":"Dat is, over welke het gewoonlijk niet regent gelijk over andere landen. Want zeer zelden regent het in Egypte, maar de Nijl bevochtigt gewoonlijk het land tweemalen des jaars. Zie Deu 11:10 . Anders: alhoewel het over hen niet [placht te regenen] zo zal [dan nog] die plaag [over hen komen met] welke de Heere plagen zal die heidenen, die niet, enz. Alsof de Heere zeide: Alhoewel het daar niet regent, zo zullen zij dan nog dezen vloek niet ontgaan, want de plaag, die anderen overkomen zal door de onthouding van den regen, zal hen ook treffen bij andere middelen. Of, aldus: En indien het geslacht der Egyptenaren niet zal optrekken noch komen, zo zal [de regen] over hen niet zijn; de plaag zal er zijn met welke, enz."}],"19":[{"catchword":"de zonde der Egyptenaren zijn,","tekst":"Dat is, de straf der zonde."},{"catchword":"om te vieren het feest der loofhutten","tekst":"Dat is, om den Heere te dienen."}],"20":[{"catchword":"op de bellen der paarden","tekst":"Het is in verscheidene landen gebruikelijk, dat de voerlieden hunnen paarden bellen om den hals hangen, menende dat derzelver geklank de paarden enige verlichting of moed aanbrengt."},{"catchword":"staan","tekst":"Hebr. zijn."},{"catchword":"DE HEILIGHEID DES HEEREN","tekst":"De zin is: dat zelfs de kleinste dingen, ook die in den oorlog tegen Gods volk plachten gebruikt te worden, enz. tot den dienst van God zullen geheiligd zijn. Dit was de titel, die in een gouden plaat voor het voorhoofd van den hogepriester geschreven was. Doch daarvan, zie Exo 28:36 ."},{"catchword":"als de sprengbekkens voor het altaar;","tekst":"Te weten, in menigte en groot getal. De zin is: er zullen overvloedige middelen zijn tot verrichting van den godsdienst, ook dienaars in groot getal, tot verrichting van den godsdienst, gelijk er ook vele offeraars wezen zullen."}],"21":[{"catchword":"in Jeruzalem en in Juda","tekst":"Dat is, die te Jeruzalem zullen zijn."},{"catchword":"heilig zijn,","tekst":"Hebr. heiligheid zijn; dat is, den Heere geheiligd zijn."},{"catchword":"koken;","tekst":"Te weten, hunne offeranden. Zie 1Sa 2:13 ."},{"catchword":"geen Kanaäniet meer zijn,","tekst":"Dat is, geen onrein en goddeloos mens. Verg. Rev 21:27 . Zie ook Isa 35:8 , en Joel 3:17 . Versta hierbij, maar die in het huis des Heeren zullen zijn en verkeren, die zullen van zonden gereinigd en wedergeboren zijn, Eph 5:27 . Anderen verstaan het aldus: Ten tijde van den Messias zal er geen volk noch natie van den godsdienst of uit den tempel gesloten worden, want die natiën, die tevoren onrein geweest zijn, zullen alsdan heilig en zuiver zijn voor de Heere."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Behold, the day cometh to the LORD, that your prey shall be divided in the midst of thee (O Jerusalem) [understand withal, and land of Juda: the day comes to the LORD i.e. for the LORD. Oth. The day of the LORD cometh or, the day from the LORD i.e. that day which is well known to the LORD, as it is verse 7. some understand this of the destruction of Jerusalem by Vespasoan and Titus; other of the persecution of the church, under the cruel Tyrant Antiochus, in the time of the Macchabees. Others refer it to Anti-christ, and his cruel persecutions.]"}],"2":[{"catchword":null,"tekst":"For I will gather all the heathen against Jerusalem in battle, [compare Ezek. 38.4, 6, 9, 15 and Hab. 1.6. all is here as much as many, all sorts, as Jona 2.3.] and the city shall be taken, and the houses shall be plundered; [Isa. 13.16.] and the women shall be abused, and half of the cty shall go forth into captivitie, [i.e. great many of the inhabitants of the city, shall be carried away captive: to wit, of them, that shall have escape th e every ones flesh [Heb. His flesh i.e. every ones flesh, body, limbs, members, or, the flesh of the same, and so presently, his eyes, and his tongue] where he stands upon his feet [i.e. suddenly, unwares, unawares, when they least expect any evil. See an example in Herod, Act 12:21. &c.] to consume, [i.e. utterly to be destroyed] and everyones eyes shall consume in their holes, and every one&acirc;&euro;&trade;s tongue shall consume in their mouth. [Having blasphemed and reviled God and his people with it]"}],"13":[{"catchword":null,"tekst":"Also it shall come to pass&Atilde;&copy; in that day, that there shall be a great rushing-noise [Or, a great tumult, uproar] from the LORD [Heb. Of the LORD, i.e. which the LORD shall send] among them, so that they shall take hold, every one of his neighbour&acirc;&euro;&trade;s hand, [whether in an hostile manner, or out of fear and anguish, seeking for shelter, help and comfort to his friend, companion, or neighbour. Compare Jud. 7.22 and 1 Sam. 14.20. and Ezek. 38.21,22.] and every ones hand shall rise up against the hand of his neighbour: [whether to strike, or, according to others requesting help and assistance. The sense of the whole verse is, God shall not onely plague them by his own hand, as verse 12. but also by themselves, on rising another,a nd likewise by his own people, as folleweth in the next verse. Compare Ezek. 30.21, &c.]"}],"14":[{"catchword":null,"tekst":"And Juda also [i.e. the people of Juda, the Jews] shall fight [viz. against the people spoken of verse 12. oth. Also thou Judas halt fight against Jerusalem] and the substance of all heathen round about shall be gathered; [viz. to be carried away] gold and silver, and garments in great quantitie: [the sense is; God shall unto his church an absolute victorie, overall their enemies, so that they shall even plunder and bereave them of all their goods, according to the use and practice of wars, when enemies are overcome by force of arms: this is a figurative s f the Lord. Compare Isa. 30.23. and Deut. 28.23, 24.]"}],"18":[{"catchword":null,"tekst":"And if the family of the Egyptians [some do here by the Egyptians (who were very great enemies to the people of God) understand likewise all other heathen nations, enemies of God&acirc;&euro;&trade;s church] over whom (the rain) is not, shall not march up, nor come, then shall plague be (over them) where (with) the LORD shall plague these heathen, that shall not march up, to celebrate the feast of leave-hurts. [the Egyptians are here described, over whom the rain is not, it raining very seldom in Egypt; the moistening of the land being supplied by the ordinary overflowings of the river Nilus twice a year. See Deut. 11.10. others read here: although it (used not to rain) (yet) shall that plague (come upon them) where (with) the LORD shall plague those heathen, that &c. as if the LORD had said, although it usually rain not with them, yet shall they not escape the curse here threatened; for the plague, which shall come upon others by the withholding of rain from them, shall light upon the Egyptians by other means: or thus; and if the family of the Egyptians shall not march up not come, then (the rain) shall not be over them, the plague shall be, wherewith &c.]"}],"19":[{"catchword":null,"tekst":"This shall be the sin of the Egyptians [i.e. the punishment of their sins] together with the sins] together with the sins of all the heathen that shall not go up, to celebrate the feast of the leave-huts. [i.e. to serve the LORD.]"}],"20":[{"catchword":null,"tekst":"In that day there shall stand [heb. Be] upon the bels of the horses, [it is the custome of countries, that the carries hang bells on the necks of their horses, conceiveing that the sound of them doth somewhat refresh and encourage the horses] THE HOLINESS OF THE LORD: [this implies, that all things, even the least, yea creatures and things which had been made use of in war against Gods people &c. should at last be consecrated t /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
