tellen als een vurige haard onder het hout, en als een vurige fakkel onder de schoven; en zij zullen aan de rechter- en aan de linkerzijde alle volken rondom verteren; en Jeruzalem zal nog blijven op haar plaats, te Jeruzalem.","7":"En de HEERE zal de tenten van Juda het eerst redden, opdat de heerlijkheid van het huis van David, en de heerlijkheid van de inwoners van Jeruzalem, zich niet verheft tegen Juda.","8":"Op die dag zal de HEERE de inwoners van Jeruzalem beschutten; en wie onder hen struikelen zou, zal op die dag zijn als David; en het huis van David zal zijn als goden, als de Engel van de HEERE voor hun aangezicht.","9":"En het zal op die dag gebeuren, dat Ik zal zoeken te verdelgen alle heidenvolken die tegen Jeruzalem aankomen.","10":"Doch over het huis van David, en over de inwoners van Jeruzalem, zal Ik uitstorten de Geest van de genade en van de gebeden; en zij zullen Mij aanschouwen, Die zij doorstoken hebben, en zij zullen over Hem rouwklagen, zoals met de rouwklacht over een enige zoon; en zij zullen over Hem bitter kermen, zoals men bitter kermt over een eerstgeborene.","11":"Op die dag zal in Jeruzalem de rouwklacht groot zijn, zoals de rouwklacht van Hadad-Rimmon in het dal van Megiddo.","12":"En het land zal rouwklagen, elk geslacht apart; het geslacht van het huis van David apart, en hun vrouwen apart; en het geslacht van het huis van Nathan apart, en hun vrouwen apart;","13":"Het geslacht van het huis van Levi apart, en hun vrouwen apart; het geslacht van Simeï apart, en hun vrouwen apart;","14":"Al de overige geslachten, elk geslacht apart, en hun vrouwen apart."},"SV":{"1":"De last van het woord des HEEREN over Israël. De HEERE spreekt, Die den hemel uitbreidt, en de aarde grondvest, en des mensen geest in zijn binnenste formeert.","2":"Ziet, Ik zal Jeruzalem stellen *tot* een drinkschaal der zwijmeling allen volken rondom; ja, ook zal zij zijn over Juda, in de belegering tegen Jeruzalem.","3":"En het zal te dien dage geschieden, dat Ik Jeruzalem stellen zal tot een lastigen steen allen volken; allen, die zich daarmede beladen, zullen gewisselijk doorsneden worden; en al de volken der aarde zullen zich tegen haar verzamelen.","4":"Te dien dage, spreekt de HEERE, zal Ik alle paarden met schuwigheid slaan, en hun ruiters met zinneloosheid; maar over het huis van Juda zal Ik Mijn ogen openen, en alle paarden der volken zal Ik met blindheid slaan.","5":"Dan zullen de leidslieden van Juda in hun hart zeggen: De inwoners van Jeruzalem zullen mij een sterkte zijn in den HEERE der heirscharen, hun God.","6":"Te dien dage zal Ik de leidslieden van Juda stellen als een vurige haard onder het hout, en als een vurige fakkel onder de schoven; en zij zullen ter rechter *zijde* en ter linkerzijde alle volken rondom verteren; en Jeruzalem zal nog blijven in haar plaats te Jeruzalem.","7":"En de HEERE zal de tenten van Juda ten voorste behouden, opdat de heerlijkheid van het huis Davids, en de heerlijkheid der inwoners van Jeruzalem, zich niet verheffe tegen Juda.","8":"Te dien dage zal de HEERE de inwoners van Jeruzalem beschutten; en die, die onder hen struikelen zou, zal te dien dage zijn als David; en het huis Davids zal zijn als goden; als de Engel des HEEREN voor hun aangezicht.","9":"En het zal te dien dage geschieden, dat Ik zal zoeken te verdelgen alle heidenen, die tegen Jeruzalem aankomen.","10":"Doch over het huis Davids, en over de inwoners van Jeruzalem, zal Ik uitstorten den Geest der genade en der gebeden; en zij zullen Mij aanschouwen, Dien zij doorstoken hebben, en zij zullen over Hem rouwklagen, als *met* de rouwklage over een enigen zoon; en zij zullen over Hem bitterlijk kermen, gelijk men bitterlijk kermt over een eerstgeborene.","11":"Te dien dage zal te Jeruzalem de rouwklage groot zijn, gelijk die rouwklage van Hadadrimmon, in het dal van Megiddon.","12":"En het land zal rouwklagen, elk geslacht bijzonder; het geslacht van het huis Davids bijzonder, en hunlieder vrouwen bijzonder; en het geslacht van het huis van Nathan bijzonder, en hun vrouwen bijzonder;","13":"Het geslacht van het huis van Levi bijzonder, en hun vrouwen bijzonder; het geslacht van Simeï bijzonder, en hun vrouwen bijzonder;","14":"Al de overige geslachten, elk geslacht bijzonder, en hunlieder vrouwen bijzonder."},"KJV":{"1":"The burden of the word of the LORD for Israel, saith the LORD, which stretcheth forth the heavens, and layeth the foundation of the earth, and formeth the spirit of man within","2":"Behold, I will make Jerusalem a cup of trembling unto all the people round about, when they shall be in the siege both against Judah *and* against Jerusalem.","3":"And in that day will I make Jerusalem a burdensome stone for all people: all that burden themselves with it shall be cut in pieces, though all the people of the earth be gathered together","4":"In that day, saith the LORD, I will smite every horse with astonishment, and his rider with madness: and I will open mine eyes upon the house of Judah, and will smite every horse of the people with blindness.","5":"And the governors of Judah shall say in their heart, The inhabitants of Jerusalem *shall be* my strength in the LORD of hosts their God.","6":"In that day will I make the governors of Judah like an hearth of fire among the wood, and like a torch of fire in a sheaf; and they shall devour all the people round about, on the right hand and on the left: and Jerusalem shall be inhabited again in her own place, *even* in Jerusalem.","7":"The LORD also shall save the tents of Judah first, that the glory of the house of David and the glory of the inhabitants of Jerusalem do not magnify *themselves* against Judah.","8":"In that day shall the LORD defend the inhabitants of Jerusalem; and he that is feeble among them at that day shall be as David; and the house of David *shall be* as God, as the angel of the LORD before","9":"And it shall come to pass in that day, *that* I will seek to destroy all the nations that come against Jerusalem.","10":"And I will pour upon the house of David, and upon the inhabitants of Jerusalem, the spirit of grace and of supplications: and they shall look upon me whom they have pierced, and they shall mourn for him, as one mourneth for *his* only *son*, and shall be in bitterness for him, as one that is in bitterness for *his* firstborn.","11":"In that day shall there be a great mourning in Jerusalem, as the mourning of Hadadrimmon in the valley of Megiddon.","12":"And the land shall mourn, every family apart; the family of the house of David apart, and their wives apart; the family of the house of Nathan apart, and their wives","13":"The family of the house of Levi apart, and their wives apart; the family of Shimei apart, and their wives","14":"All the families that remain, every family apart, and their wives"}},"tsk":{"1":[{"kopje":"last","refs":["Zach 9:1","Klaagl 2:14","Mal 1:1"]},{"kopje":"over","refs":["Jes 51:22","Jes 51:23","Jer 30:10","Jer 30:16","Jer 50:34","Ezech 36:5-7","Joël 3:19","Joël 3:21","Obadja 1:16","Obadja 1:17"]},{"kopje":"Die","refs":["Job 26:7","Ps 102:26","Ps 102:27","Ps 104:2","Ps 136:5","Ps 136:6","Jes 40:12","Jes 40:22","Jes 42:5","Jes 44:24","Jes 45:12","Jes 45:18","Jes 48:13","Jes 51:13","Jer 10:12","Jer 51:15","Hebr 1:10-12"]},{"kopje":"formeert","refs":["Gen 2:7","Num 16:22","Pred 12:7","Jes 57:16","Jer 38:16","Ezech 18:4","Hebr 12:9"]}],"2":[{"kopje":"een drinkschaal","refs":["Ps 75:9","Jes 51:17","Jes 51:22","Jes 51:23","Jer 25:15","Jer 25:17","Jer 49:12","Jer 51:7","Hab 2:16","Openb 14:10","Openb 16:19","Openb 18:6"]},{"kopje":"zwijmeling","refs":["Jer 51:57","Jer 8:14"]},{"kopje":"in de belegering","refs":["Zach 14:14"]}],"3":[{"kopje":"op die","refs":["Zach 12:4","Zach 12:6","Zach 12:8","Zach 12:9","Zach 12:11","Zach 2:8","Zach 2:9","Zach 10:3-5","Zach 13:1","Zach 14:2","Zach 14:3","Zach 14:4","Zach 14:6","Zach 14:8","Zach 14:9","Zach 14:13","Jes 60:12","Jes 66:14-16","Ezech 38:1","Ezech 39:29","Joël 3:8-16","Obadja 1:18","Micha 5:7 em.","3":"And in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> will I <span class=\"wl wl-kjv\" data-code=\"H7760\">make</span> <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> a <span class=\"wl wl-kjv\" data-code=\"H4614\">burdensome</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stone</span> for all <span class=\"wl wl-kjv\" data-code=\"H5971\">people:</span> all that <span class=\"wl wl-kjv\" data-code=\"H6006\">burden</span> themselves with it shall be cut in <span class=\"wl wl-kjv\" data-code=\"H8295\">pieces,</span> though all the <span class=\"wl wl-kjv\" data-code=\"H1471\">people</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> be gathered together","4":"In that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> I will <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> every <span class=\"wl wl-kjv\" data-code=\"H5483\">horse</span> with <span class=\"wl wl-kjv\" data-code=\"H8541\">astonishment,</span> and his <span class=\"wl wl-kjv\" data-code=\"H7392\">rider</span> with <span class=\"wl wl-kjv\" data-code=\"H7697\">madness:</span> and I will <span class=\"wl wl-kjv\" data-code=\"H6491\">open</span> mine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> upon the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and will <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> every <span class=\"wl wl-kjv\" data-code=\"H5483\">horse</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> with blindness.","5":"And the <span class=\"wl wl-kjv\" data-code=\"H441\">governors</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> shall <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> in their <span class=\"wl wl-kjv\" data-code=\"H3820\">heart,</span> The <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> shall be my <span class=\"wl wl-kjv\" data-code=\"H556\">strength</span> in the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts</span> their God.","6":"In that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> will I <span class=\"wl wl-kjv\" data-code=\"H7760\">make</span> the <span class=\"wl wl-kjv\" data-code=\"H441\">governors</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> like an <span class=\"wl wl-kjv\" data-code=\"H3595\">hearth</span> of <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> among the <span class=\"wl wl-kjv\" data-code=\"H6086\">wood,</span> and like a <span class=\"wl wl-kjv\" data-code=\"H3940\">torch</span> of <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> in a <span class=\"wl wl-kjv\" data-code=\"H5995\">sheaf;</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H398\">devour</span> all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about,</span> on the right <span class=\"wl wl-kjv\" data-code=\"H3225\">hand</span> and on the <span class=\"wl wl-kjv\" data-code=\"H8040\">left:</span> and <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> shall be <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabited</span> again in her own place, even in Jerusalem.","7":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> also shall <span class=\"wl wl-kjv\" data-code=\"H3467\">save</span> the <span class=\"wl wl-kjv\" data-code=\"H168\">tents</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> <span class=\"wl wl-kjv\" data-code=\"H7223\">first,</span> that the <span class=\"wl wl-kjv\" data-code=\"H8597\">glory</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> and the <span class=\"wl wl-kjv\" data-code=\"H8597\">glory</span> of the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> do not <span class=\"wl wl-kjv\" data-code=\"H1431\">magnify</span> themselves against Judah.","8":"In that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> shall the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1598\">defend</span> the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem;</span> and he that is <span class=\"wl wl-kjv\" data-code=\"H3782\">feeble</span> among them at that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> shall be as <span class=\"wl wl-kjv\" data-code=\"H1732\">David;</span> and the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> shall be as <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> as the <span class=\"wl wl-kjv\" data-code=\"H4397\">angel</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> before","9":"And it shall come to pass in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> that I will <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> to <span class=\"wl wl-kjv\" data-code=\"H8045\">destroy</span> all the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> that <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> against Jerusalem.","10":"And I will <span class=\"wl wl-kjv\" data-code=\"H8210\">pour</span> upon the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> and upon the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> the <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> of <span class=\"wl wl-kjv\" data-code=\"H2580\">grace</span> and of <span class=\"wl wl-kjv\" data-code=\"H8469\">supplications:</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H5027\">look</span> upon me whom they have <span class=\"wl wl-kjv\" data-code=\"H1856\">pierced,</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H4553\">mourn</span> for him, as one <span class=\"wl wl-kjv\" data-code=\"H5594\">mourneth</span> for his <span class=\"wl wl-kjv\" data-code=\"H3173\">only</span> son, and shall be in <span class=\"wl wl-kjv\" data-code=\"H4843\">bitterness</span> for him, as one that is in <span class=\"wl wl-kjv\" data-code=\"H4843\">bitterness</span> for his firstborn.","11":"In that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> shall there be a <span class=\"wl wl-kjv\" data-code=\"H1431\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4553\">mourning</span> in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> as the <span class=\"wl wl-kjv\" data-code=\"H4553\">mourning</span> of <span class=\"wl wl-kjv\" data-code=\"H1910\">Hadadrimmon</span> in the <span class=\"wl wl-kjv\" data-code=\"H1237\">valley</span> of Megiddon.","12":"And the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> shall <span class=\"wl wl-kjv\" data-code=\"H5594\">mourn,</span> <span class=\"wl wl-kjv\" data-code=\"H4940\">every</span> <span class=\"wl wl-kjv\" data-code=\"H4940\">family</span> <span class=\"wl wl-kjv\" data-code=\"H905\">apart;</span> the <span class=\"wl wl-kjv\" data-code=\"H4940\">family</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> apart, and their <span class=\"wl wl-kjv\" data-code=\"H802\">wives</span> apart; the <span class=\"wl wl-kjv\" data-code=\"H4940\">family</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H5416\">Nathan</span> apart, and their wives","13":"The <span class=\"wl wl-kjv\" data-code=\"H4940\">family</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3878\">Levi</span> apart, and their <span class=\"wl wl-kjv\" data-code=\"H802\">wives</span> apart; the <span class=\"wl wl-kjv\" data-code=\"H4940\">family</span> of <span class=\"wl wl-kjv\" data-code=\"H8097\">Shimei</span> apart, and their wives","14":"All the <span class=\"wl wl-kjv\" data-code=\"H4940\">families</span> that <span class=\"wl wl-kjv\" data-code=\"H7604\">remain,</span> every <span class=\"wl wl-kjv\" data-code=\"H4940\">family</span> apart, and their wives"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"last van het woord des HEEREN","tekst":"Dat is, de profetie."},{"catchword":"over Israël","tekst":"Of, belangende Israël, of voor, of aan Israël. Zie Zech 9:1 . Versta hier door Israël de Christelijke kerk of gemeente uit Joden en heidenen bestaande, welke de apostel noemt het Israël Gods, Gal 6:16 ; denwelke hier de overwinning over hunne vijanden beloofd wordt."},{"catchword":"spreekt,","tekst":"Te weten, gelijk hier straks volgt, zie vs.2."},{"catchword":"geest","tekst":"Dat is, ziel."},{"catchword":"formeert","tekst":"Of, vormt; ene manier van spreken van de pottenbakkers genomen."}],"2":[{"catchword":"Jeruzalem","tekst":"Hier betekent Jeruzalem de Christelijke kerk of gemeente, gelijk Gal 4:26 ; Heb 12:18 , Heb 12:22 ."},{"catchword":"zwijmeling","tekst":"Of, der beving, of tot een vernijnigen beker, of tot een tuimelbeker, of slaapbeker; dat is, gevuld met wijn, die slaap aanbrengt, tot een vat uit hetwelk alle volken, die tegen het Israël Gods strijden zullen, een dronk zullen moeten drinken, die hen in zwijmeling in slaap brengen zal. De zin is: De vijanden, uit allerlei volken bestaande, die mijne kerk zullen bestrijden en vervolgen, zullen daarmede niets anders gewinnen noch uitrichten, dan dat Ik hen in het vervolgen der kerk zal slaan met razernij en onzinnigheid, alzo dat zij zichzelven zullen te schande maken en in verderf brengen. Verg. Psa 60:5 ; Isa 51:22-23 ; Jer 25:15-16 , en de aantekeningen aldaar."},{"catchword":"ja,","tekst":"Te weten, de schaal der zwijmeling; te weten als de stad Jeruzalemzal belegerd worden. Als wilde de Heere zeggen: niet alleen de heidense volken, maar ook de Joden, die de Christelijke kerk vervolgen zullen, zullen daarover te schande en ten verdrve komen. Of, en ook zal zij zijn in de belegering tegen Juda, tegen Jeruzalem."}],"3":[{"catchword":"Jeruzalem stellen zal","tekst":"Dat is, de Christelijke kerk."},{"catchword":"tot een lastigen steen allen volken;","tekst":"Of, tot een gans zwaren steen. De zin is: Gelijk degenen, die hunne zterkte daaraan bewijzen willen, dat zij een zwaren steen opheffen willen, dikwijls door de zwaarte van denzelven onderdrukt worden; alzo zullen ook degenen, die hunne kracht aan Gods kerk verzoeken willen, daarover vernield worden, en gevoelen hoe zwaar het is tegen den prikkel te stoten. Verg. Luk 20:18 ; Act 9:4-5 ."},{"catchword":"en al de volken der aarde","tekst":"Of, al verzamelden zich tegen haar alle volken, enz.; te weten die mijne kerk bevechten."}],"4":[{"catchword":"met schuwigheid slaan,","tekst":"Of, met verbaasdheid slaan; dat is, Ik zal hunne macht teniet maken. Verg. Psa 76:6-7 , enz."},{"catchword":"over het huis van Juda","tekst":"Dat is, over mijne kerk."},{"catchword":"zal Ik Mijn ogen openen,","tekst":"Dat is, Ik zal hen gadeslaan, medelijden over hen heddende. Verg. Jer 39:12 ."},{"catchword":"der volken zal Ik met blindheid slaan","tekst":"Te weten, der vijanden mijner kerk."}],"5":[{"catchword":"de leidslieden van Juda","tekst":"Dat is, alle voorstanders der kerk."},{"catchword":"De inwoners van Jeruzalem","tekst":"Dat is, de ledematen der kerk."},{"catchword":"zullen mij een sterkte zijn","tekst":"Of, zijn mij enen sterkte; of dat mij de inwoners van Jeruzalem een sterken moed hebben."},{"catchword":"in den HEERE der heirscharen, hun God","tekst":"Dat is, dewijl de Heere met hen is, of om des Heeren wil."}],"6":[{"catchword":"als een vurige haard","tekst":"Hebr. als een haard des vuurs; dat is, als, of tot enen haard op welken een vuur brandt, hetwelk het hout, dat er op ligt, verteert. Alzo straks Hebr. als een fakkel des vuurs. De zin is: zij zullen al hunne vijanden overwinnen, hetwelk hier geestelijkerwijze te verstaan is van de overwinning der gelovigen over hun geestelijke vijanden. Verg. Psa 48 , Psa 87 , Psa 125 , Psa 129 ."},{"catchword":"Jeruzalem zal nog","tekst":"De ware burgers van Jeruzalem, de Christelijke kerk."},{"catchword":"blijven","tekst":"Hebr. zitten, of wonen; dat is, blijven."},{"catchword":"in haar plaats te Jeruzalem","tekst":"In die plaats, waar men God in waar geloof aanroept en Hem naar zijnen wil dient, hetzij dan daar, hetzij in de ganse wereld."}],"7":[{"catchword":"de tenten van Juda","tekst":"Dat is, de kleinen en onvermogenden in Juda, die buiten Jeruzalem woonden en van het huis van David niet waren."},{"catchword":"ten voorste","tekst":"Of, ten eerst, [als], eertijds."},{"catchword":"behouden,","tekst":"Of, zaligmaken."},{"catchword":"de heerlijkheid","tekst":"Of, sierlijkheid; dat is, die van groter aanzien zijn dan de anderen van Juda."},{"catchword":"het huis Davids,","tekst":"Dat is, van het geslacht Davids."},{"catchword":"de heerlijkheid der inwoners van Jeruzalem,","tekst":"Dat is, de rijken en de geweldigen tegen de geringen en verarmden."},{"catchword":"verheffe tegen Juda","tekst":"Hebr. grootmaken."}],"8":[{"catchword":"wie onder hen struikelen zou,","tekst":"Dat is, die zwak is."},{"catchword":"als David;","tekst":"Te weten, zo dapper in den strijd als eertijds David geweest is. Versta dit van een geestelijke dapperheid, welke de Heilige Geest in de kinderen Gods teweegbrengt."},{"catchword":"het huis Davids zal zijn","tekst":"Het huis van David; dat is, de voorstanders van Gods volk."},{"catchword":"als goden;","tekst":"Anders: als God. Anders: als Gods [huis]. Men kan hier door goden verstaan de engelen."},{"catchword":"als de Engel des HEEREN","tekst":"Dat is, als Christus, gelijk blijkt uit de navolgende woorden."},{"catchword":"voor hun aangezicht","tekst":"Dat is, die voor hun aangezicht wandelt, of heengaat. Verg. Mic 2:13 ."}],"10":[{"catchword":"den Geest der genade en der gebeden;","tekst":"Dat is, den Heilige Geest, die den uitverkorenen betuigt dat God hun wil genadig zijn; en Hij verwekt hen ten gebede en smekingen, alzo dat zij God om genade en vergeving hunner zonden bidden. Verg. Act 2:37 ."},{"catchword":"zij zullen Mij aanschouwen,","tekst":"Eendeeld met lichamelijke ogen ten tijde van zijn lijden. Zie Joh 19:37 ; anderdeels door het geloof, ten aanzien van de boetvaardigen en gelovigen, Act 2:37 , en met schrik ten aanzien van de ongelovigen ten jongste dage; Rev 1:7 ."},{"catchword":"Dien zij doorstoken hebben,","tekst":"Dit doorsteken der zijde van Christus wordt hier gesteld voor de gehele kruiseging. Zie Joh 19:34 , Joh 19:37 . En ofschoon maar één soldaat dit gedaan heeft, zo wordt het nochtans de ganse Joodse natie toegeschreven, als die Pilatus gedrongen hebben Christus te doden."},{"catchword":"zij zullen over Hem rouwklagen,","tekst":"Dat is, zij zullen hartelijk bedroefd zijn over hun schrikkelijke zonden."},{"catchword":"over een enigen zoon;","tekst":"Te weten, die gestorven is; zie Jer 6:26 , en Amo 8:10 ."},{"catchword":"zij zullen over Hem bitterlijk kermen,","tekst":"Hebr. zullen bitter maken."}],"11":[{"catchword":"Hadadrímmon,","tekst":"Alwaar de koning Josia is omgekoen, die zeer is beschreid en beklaagd geworden van zijn goede onderzaten. Zie de geschiedenis 2Ki 23:29-30 , en 2Ch 35:22 , 2Ch 35:24-25 ."}],"12":[{"catchword":"het land zal rouwklagen,","tekst":"Dat is, de inwoners van het land."},{"catchword":"elk geslacht bijzonder;","tekst":"Hebr. geslacht geslacht bijzonder. De zin is: dat dit zou zijn een bijzondere weeklage onder alle geslachten. Het ziet op de wijze van rouwklagen onder de Joden gebruikelijk."},{"catchword":"Nathan bijzonder,","tekst":"Zie 2Sa 5:14 ; 1Ch 3 ; Luk 3:31 ."}],"13":[{"catchword":"Simeï bijzonder,","tekst":"Die, naar sommigen gevoelen, een zoon van Gersom was, den zoon van Levi, 1Ch 6:16-17 . Deze wordt hier tot een voorbeeld gesteld bij naam, maar van al de andere stammen en geslachten wordt desgelijks gezegd in het volgende."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"The burthen [Or, prophesie] of the LORD over [or, concerning, for or unto. See above chap. 9.1.] Israel: [understand here by the Israel the Christian church, or the Assemblie of the faithfull, consisting both of Jews and gentiles, whom the apostle calls the Israel of God. Gal 6.16 and who are promised here victory aover their enemies] the LORD speaketh, [viz. that which followeth verse 2] that speaketh forth the heaven, and foundeth the earth, and formeth [or fashioneth, shapeth as a potter his vessel] the spirit of man [i.e. his soul] in the inmost of him."}],"2":[{"catchword":null,"tekst":"Behold, I will put Jerusalem, [That is here, the Christian church or assembly, as Gal. 4.26. Heb. 12.18, 20.] (to be) a cup giddlinesse [or, a poisonous beaker, or a reeling cup or, a sleep & c] to all Nations round about: [the meaning is; god shall make his church to be as it were a cup, or vessel, out of which all nations, that rise up against the Israel of God, shall be made to drink so, that it shall cause them to reel, or fall asleep. This is that he means, the enemies of all Nations, that afflict and persecute my church, shall thereby get and gain for themselves, nothing nut that whiles they are in the very act of persecuting the same. I will smite them with rage and madness, or dullness and stupidity, that they shall run headlong into their own turn and destruction. Compare Psa 60:5. Isa. 51.22, 23. Jer. 25.15, 16 with the annotate.] yea it shall be likewise upon Juda, in the siege against Jerusalem: [it, viz. the same cup of giddiness. The meaning is, not onely the heathen nations, but the Jews also themselves, viz. all such as shall persecute the christioan church, shall be confounded and destroyed by it: or and it shall be also in the siege against Jerusalem.]"}],"3":[{"catchword":null,"tekst":"And it shall come to pass&Atilde;&copy; in that day, that I will put Jerusalem [i.e. the church of Christ (to be) a burdensome stone [Or, a most heavy stone] to all Nations; all that load themselves with it, shall assuredly be cut through; [the meaning is, even as those which go about to shew their strength, by lifting up a great and heavie stone, and by tha means come to be overborn and crushed by the weight: so shall those likewise, which go about to trie and practice their strength, thereby to subvert the church of God, themselves be overthrown and destroyed by it; and so find indeed, how hard a matter it is, to kick against the pricks. Compare Luk 20:18. Act 9:4.] and all the nations of the earth shall assemble themselves against her. [or, through all Nations do assemble &c. namely to fightagainst my church]"}],"4":[{"catchword":null,"tekst":"In that day, saith the LORD, will I smite all horses with shienesse, [or, with dismayednesse, that is, I will disable them away all their strength and vigour. Compare Psa 76:6, 7., &c.] and their riders with senseless: [or, stupidity] but over the house of Juda, [i.e. over my church] will I open mine eyes, [i.e. take notice of, and care for them, as pittying their condition. Compare jer 39.12.] and all the horses of the nations [viz. being, or such as are, enemies to my church] will I strike with blindness."}],"5":[{"catchword":null,"tekst":"Then shall the leaders of Juda [i.e. te church governours] say in their hearts, the inhabitants of Jerusalem [i.e. the members of the church] shall be a strength to me, [or are a strength unto me: or, that the inhabitants of Jerusalem have me a strong wall] in the Lord of hosts their God [i.e. because the LORD is with them, for the LORDS&acirc;&euro;&trade; sake.]"}],"6":[{"catchword":null,"tekst":"In that day will I put the leaders of Juda, (to be) as a fiery hearth under the wood, and as a fiery torch [Heb. An hearth of fire &c a torch of fire] under the sheaves, and they shall consume all nations, on the right and on the left side: [the sense is; they shall get the victorie of and subdue all their enemies, which is to be understood spiritually of the true believers victorie over their spiritual enemies. Comp. Psalms 48. and 87 and 125. and 129.] and Jerusalem [i.e. the true citizens of Jerusalem, the whole church of Christ] shall remain [Heb. Sit or dwell. i.e. abide, continue] in her place at Jerusalem: [in that place where god is called upon in true faith and served according to his will, where ever it be, all the world over.]"}],"7":[{"catchword":null,"tekst":"And the Lord shall save the tents of Juda [i.e. the meaner and poorer sort of Juda, which dwelt without Jerusalem and were nor of the house of David] with the foremost, [or, first or (as) formerly, in former times] that the glory of the house [i.e. family] of David, i.e. those which are in more authority and esteem then the rest of Juda] and the glory of the inhabitants of Jerusalem, do not lift up [Heb magnifie] themselves against Judah: [i.e. left the rich and mightie ones exalt themselves against the meaner sort.]"}],"8":[{"catchword":null,"tekst":"In that day the LORD shall protect the inhabitans of Jerusalem, and they that are stumbling [i.e. are but weak and feeble] among them, shall be in that day like David: [i.e. as valiant and courageous as David was uderstant this spiritual valour and courage, which the holy ghost begets in Gods children] and the house of david, [i.e. the governours and over seers of the church] shall be as God&acirc;&euro;&trade;s, [oth. God; otherwise, as God&acirc;&euro;&trade;s (house); by God here may likewise be understood the angel] as the angel of the Lord [i.e. as Christ himself, for so it appears by what followes] before their face: [i.e. that goeth before, or passeth along before their face. Compare Mich. 2.13.]"}],"9":[{"catchword":null,"tekst":"And it shall come to pass&Atilde;&copy; in that day, that I shall seek to destroy all the heathen, that come against Jerusalem."}],"10":[{"catchword":null,"tekst":"But upon the house of David, and upon the inhabitants of Jerusalem, will I pour out the spirit of grace and of prayers, [i.e. the holy ghost, bearing witnesses to the elect, that god will be gracious unto them: and the same doth stir them up to prayer and supplication, to sue unto God for grace and forgiveness of sins. Compare Act 2:37.] and they shall look upon me, [partly with corporal eyes in the time of his suffering. See Job 19:37. partly, by faith, in regard of the penitent and believers, Act 2:37. and with terrour, in regard of the unbelievers at the last day, Revel.. 1.7.] whom the pierced through: [this piercing through of Christ, comprehends his whole crucifying. See Job 10:34 and 37 and through but one souldier did this particular act of piercing his side, yet it is imputed to the whole Jewish nation, who importuned and pressed pilate so much to crucifie Christ, and put him to death in this manner] and they shall mourn over him, [i.e. be heartily forry and grieved for this their horrible sin and gratitude] as (with) the mourning for an only son; [departed this life. See Jer. 6 on verse 26 and Amos 8.10.] And they shall wail bitterly [Heb. Make bitter] as one wailes bitterly for a first born."}],"11":[{"catchword":null,"tekst":"In that day shall the lamentation be great at Jerusalem, like the lamentation of Hadadrimmon, in the valley of Megiddo: [where King Josias was slain, who was exceedingly lamented and bemoaned by his good subjects. See the history 2 Kings 23 verse 29, 30. And 2 Chron. 35 verse 22, 24, 25.]"}],"12":[{"catchword":null,"tekst":"And the land [i.e. the inhabitants of the land] shall mourn, each family a part; [Heb. Family, family a part] the family of the house of David apart, and their wives apart, and the family of the house of Nathan [see 2 Sam. 5.14. 1 Chro. 3.5. Luk 3:31.] Apart and their wives apart. [The meaning is that this should be an extraordinary mourning among all families: it hath regard to the manner of the Jewes mourning, as then was in use among them.]"}],"13":[{"catchword":null,"tekst":"The family of the house of Levi apart, and their wives apart; the family of Simei, [Who according to the opinion of some, was a son of Gerson, the son of Levi. 1 Chron. 6.16, 17. this man is set down by name for an example, but the same is said in general of the rest of the tribes and their wives apart."}],"14":[{"catchword":null,"tekst":"All the remaining families: each family apart, and their wives apart."}]}}};

(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');

    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>

function md(t) {  // *cursief* -> <em>, noot [n] -> sup

    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
