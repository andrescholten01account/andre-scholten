oortkomen uit de afgehouwen tronk van Isaï, en een Scheut uit zijn wortels zal vrucht voortbrengen. En op Hem zal de Geest van de HEERE rusten, de Geest van wijsheid en van verstand, de Geest van raad en van sterkte, de Geest van kennis en van vreze van de HEERE. En Zijn vreugde zal zijn in de vreze van de HEERE; en Hij zal niet oordelen naar wat Zijn ogen zien, en niet bestraffen naar wat Zijn oren horen.", "Richt 8:3": "God heeft de vorsten van de Midianieten, Oreb en Zeëb, in uw hand gegeven; wat heb ik dan kunnen doen, vergeleken bij u? Toen liet hun toorn van hem af, toen hij dit woord sprak.", "Openb 19:11": "En ik zag de hemel geopend; en zie, een wit paard, en Die daarop zat, werd genoemd Getrouw en Waarachtig, en Hij oordeelt en voert krijg in gerechtigheid.", "Openb 21:9-27": "En er kwam naar mij een van de zeven engelen, die de zeven schalen hadden, die vol geweest waren van de zeven laatste plagen, en hij sprak met mij en zei: Kom hier, ik zal u de Bruid tonen, de Vrouw van het Lam. En hij voerde mij weg in de geest op een grote en hoge berg, en hij toonde mij de grote stad, het heilige Jeruzalem, neerdalend uit de hemel van God. En zij had de heerlijkheid van God, en haar licht was gelijk aan de allerkostbaarste steen, namelijk als de steen Jaspis, blinkend als kristal.", "Kol 1:2": "Aan de heilige en gelovige broeders in Christus die in Kolosse zijn: genade zij u en vrede van God, onze Vader, en de Heere Jezus Christus.", "Jes 25:6-8": "En de HEERE van de heerscharen zal op deze berg voor alle volken een vette maaltijd maken, een maaltijd van reine wijn, van vet vol merg, van reine wijnen, die gezuiverd zijn. En Hij zal op deze berg verslinden het bewindsel van het aangezicht, waarmee alle volken bewonden zijn, en het deksel, waarmee alle naties bedekt zijn. Hij zal de dood verslinden tot overwinning, en de Heere HEERE zal de tranen van alle aangezichten afwissen; en Hij zal de smaad van Zijn volk van de hele aarde wegnemen; want de HEERE heeft het gesproken.", "Job 38:7": "Toen de morgensterren samen vrolijk zongen, en al de kinderen van God juichten.", "Mark 14:9": "Voorwaar, Ik zeg u: Waar dit Evangelie ook gepredikt zal worden in de hele wereld, daar zal ook gesproken worden over wat zij gedaan heeft, tot haar gedachtenis.", "Jes 45:6": "Opdat men weet, vanaf de opgang van de zon tot aan de ondergang, dat er buiten Mij niets is, Ik ben de HEERE, en niemand meer.", "Ps 89:28": "Ook zal Ik hem tot eerstgeboren zoon stellen, tot de hoogste over de koningen van de aarde.", "Ps 89:4": "Ik heb een verbond gemaakt met Mijn uitverkorene; Ik heb Mijn knecht David gezworen:", "1 Kor 3:10-15": "Naar de genade van God, die mij gegeven is, heb ik als een wijs bouwmeester het fundament gelegd; en een ander bouwt daarop. Maar ieder ziet toe hoe hij daarop bouwt. Want niemand kan een ander fundament leggen dan hetgeen gelegd is, hetwelk is Jezus Christus. En als iemand op dit fundament bouwt: goud, zilver, kostbare stenen, hout, hooi, stoppels;", "Jer 6:1": "Vlucht met opeenpakking, kinderen van Benjamin, uit het midden van Jeruzalem, en waai de bazuin te Thekoa, en hef een vuurteken op te Beth-cherem; want er kijkt een kwaad uit van het noorden, en een grote breuk.", "Hebr 12:28": "Daarom, omdat wij een onwankelbaar Koninkrijk ontvangen, laten wij de genade vasthouden, waardoor wij God welgevallig mogen dienen, met eerbied en godsvrucht.", "Joh 10:16": "Ik heb nog andere schapen, die niet van deze schaapskooi zijn; ook die moet Ik toebrengen; en zij zullen Mijn stem horen; en het zal worden één kudde, en één Herder.", "Jer 31:7-9": "Want zo zegt de HEERE: Roept luide over Jakob met vreugde, en juicht vanwege het hoofd van de heidenvolken; laat het horen, lofzingt, en zegt: O HEERE! Behoud Uw volk, het overblijfsel van Israël. Zie, Ik zal ze aanbrengen uit het land van het noorden, en zal hen verzamelen van de einden van de aarde; onder hen zullen blinden en lammen zijn, zwangere vrouwen en barenden samen; met een grote menigte zullen zij hierheen terugkomen. Zij zullen komen met geween, en met smekingen zal Ik hen leiden; Ik zal hen leiden aan de waterbeken, op een rechte weg, waarop zij zich niet zullen stoten; want Ik ben Israël tot een Vader, en Efraïm is Mijn eerstgeborene.", "Jes 22:24": "En men zal aan hem alle heerlijkheid van het huis van zijn vader hangen, van de nakomelingen en de afstammelingen, ook alle kleine vaten, van de bekers af, tot alle kannen toe.", "Lev 26:19": "Want Ik zal de hoogmoed van uw kracht verbreken, en zal uw hemel als ijzer maken, en uw aarde als koper.", "Jes 57:19": "Ik schep de vrucht van de lippen: vrede, vrede voor hen die ver weg zijn, en voor hen die dichtbij zijn, zegt de HEERE, en Ik zal hen genezen.", "Ezra 8:26-30": "ik woog dan aan hun hand zeshonderdvijftig talenten van het zilver, en honderd zilveren vaten in talenten; aan goud, honderd talenten; en twintig gouden bekers, tot duizend drachmen; en twee vaten van blinkend goed koper, begeerlijk als goud. En ik zei tegen hen: U bent heilig voor de HEERE, en deze vaten zijn heilig; ook dit zilver en dit goud, de vrijwillige gave, voor de HEERE, de God van uw vaderen.", "Jes 1:24": "Daarom spreekt de Heere, HEERE van de heerscharen, de Machtige van Israël: O wee! Ik zal Mij troosten over Mijn tegenstanders. Ik zal Mij wreken op Mijn vijanden.", "Dan 2:32": "Het hoofd van dit beeld was van zuiver goud; zijn borst en zijn armen van zilver; zijn buik en zijn dijen van koper;", "Ezra 7:14-16": "Omdat u van voor de koning en zijn zeven raadsheren gezonden bent, om onderzoek te doen in Judea, en te Jeruzalem, naar de wet van uw God, die in uw hand is; en om het zilver en goud daarheen te brengen, dat de koning en zijn raadsheren vrijwillig gegeven hebben aan de God van Israël, Wiens woning te Jeruzalem is; alsook al het zilver en goud, dat u vinden zult in het hele landschap van Babel, met de vrijwillige gave van het volk en van de priesters, die vrijwillig geven, voor het huis van hun God, dat te Jeruzalem is;", "Gal 3:19": "Waartoe is dan de wet? Zij is vanwege de overtredingen erbij gevoegd, totdat het nageslacht zou gekomen zijn aan wie het beloofd was; en zij is door de engelen ingesteld, in de hand van de Middelaar.", "Hoogl 3:11": "Ga naar buiten, en aanschouw, dochters van Sion! de koning Salomo, met de kroon, waarmee Zijn moeder Hem kroonde op de dag van Zijn bruiloft, en op de dag van de vreugde van Zijn hart.", "Jes 4:2": "Op die dag zal de SPRUIT van de HEERE tot sieraad en heerlijkheid zijn, en de vrucht van de aarde tot voortreffelijkheid en tot versiering voor hen die ontkomen zullen in Israël.", "Joël 2:28": "En daarna zal het gebeuren, dat Ik Mijn Geest zal uitgieten over alle vlees, en uw zonen en uw dochters zullen profeteren; uw ouden zullen dromen dromen, uw jongelingen zullen gezichten zien;", "Ex 39:30": "Zij maakten ook de plaat van de heilige kroon van zuiver goud, en zij schreven daarop een schrift, gegraveerd zoals een zegel gegraveerd wordt: HEILIGHEID VAN DE HEERE.", "Ef 3:11": "naar het eeuwig voornemen, dat Hij gemaakt heeft in Christus Jezus, onze Heere;", "Hand 2:30": "Omdat hij dan een profeet was, en wist dat God hem met een eed gezworen had dat Hij uit de vrucht van zijn lichaam, wat het vlees betreft, de Christus zou verwekken om Hem op zijn troon te zetten;", "Jes 18:4": "Want zo heeft de HEERE tegen mij gezegd: Ik zal stil zijn en toezien vanuit Mijn woning, als de glinsterende hitte op de regen, als een wolk van het dauw in de hitte van de oogst;", "Ex 28:12": "En u zult de twee stenen aan de schouderbanden van de efod zetten, als stenen ter gedachtenis voor de kinderen van Israël; en Aäron zal hun namen op zijn beide schouders dragen, ter gedachtenis, voor het aangezicht van de HEERE.", "Rom 15:25": "Maar nu reis ik naar Jeruzalem, om de heiligen te dienen.", "Dan 4:15": "Maar laat de stronk met zijn wortels in de aarde, en met een ijzeren en koperen band in het tedere gras van het veld; en laat hem door de dauw van de hemel nat gemaakt worden, en zijn deel zij met het gedierte in het gras van de aarde.", "Luk 1:19": "En de engel antwoordde en zei tegen hem: Ik ben Gabriël, die voor God sta, en ben uitgezonden om tot u te spreken, en u deze dingen te verkondigen.", "Ps 132:17": "Daar zal Ik David een hoorn doen uitspruiten; Ik heb voor Mijn Gezalfde een lamp klaargemaakt.", "Zach 5:10": "Toen zei ik tegen de Engel Die met mij sprak: Waarheen brengen zij deze efa?", "Hebr 10:13": "verder wachtend, totdat Zijn vijanden neergelegd worden als een voetbank voor Zijn voeten.", "Spr 21:30": "Er is geen wijsheid, en er is geen verstand, en er is geen raad tegen de HEERE.", "Luk 1:33": "En Hij zal over het huis van Jakob Koning zijn tot in eeuwigheid, en aan Zijn koninkrijk zal geen einde zijn.", "Hebr 6:20": "waar de Voorloper voor ons is ingegaan, namelijk Jezus, naar de ordening van Melchizedek, Hogepriester geworden in eeuwigheid.", "Ps 72:8-11": "En hij zal heersen van de zee tot aan de zee, en van de rivier tot aan de einden van de aarde. De inwoners van dorre plaatsen zullen voor zijn aangezicht knielen, en zijn vijanden zullen het stof lekken. De koningen van Tharsis en de eilanden zullen geschenken aanbrengen; de koningen van Scheba en Seba zullen vereringen toevoeren.", "Hagg 2:3": "Spreek nu tot Zerubbabel, de zoon van Sealthiël, de vorst van Juda, en tot Josua, de zoon van Jozadak, de hogepriester, en tot het overblijfsel van het volk. Zeg:", "Joh 19:19": "En Pilatus schreef ook een opschrift, en zette dat op het kruis; en er stond geschreven: JEZUS DE NAZARENER, DE KONING VAN DE JODEN.", "Hebr 12:23": "Tot de algemene vergadering en de gemeente van de eerstgeborenen, die in de hemelen opgeschreven zijn, en tot God, de Rechter over allen, en de geesten van de rechtvaardigen die volmaakt gemaakt zijn;", "2 Tim 4:8": "Verder ligt voor mij de kroon van de rechtvaardigheid klaar, die de Heere, de rechtvaardige Rechter, mij op die dag geven zal; en niet alleen mij, maar ook allen die Zijn verschijning hebben liefgehad.", "Jes 33:13-24": "Hoort, u die ver weg bent, wat Ik gedaan heb; en u, die nabij bent, erken Mijn macht! De zondaars in Sion zijn verschrikt; beving heeft de huichelaars aangegrepen; zij zeggen: Wie onder ons kan bij een verterend vuur wonen? Wie onder ons kan bij een eeuwige gloed wonen? Wie in gerechtigheid wandelt, en wat recht is spreekt; wie de winst van onderdrukking verwerpt; wie zijn handen uitschudt, zodat zij geen geschenken vasthouden; wie zijn oor dichtstopt, zodat hij geen bloedschuld hoort, en zijn ogen dichtdoet; zodat hij het kwade niet aanziet;", "Ps 80:16": "en de stam die Uw rechterhand geplant heeft, en dat om de zoon die U voor Uzelf gesterkt hebt!", "Jes 56:6-8": "En de vreemdelingen, die zich bij de HEERE voegen om Hem te dienen, en om de Naam van de HEERE lief te hebben, om Hem tot knechten te zijn; ieder die de sabbat houdt, zodat hij die niet ontheiligt, en die aan Mijn verbond vasthouden; Die zal Ik ook brengen naar Mijn heilige berg, en Ik zal hen verheugen in Mijn huis van gebed; hun brandoffers en hun slachtoffers zullen aangenaam zijn op Mijn altaar; want Mijn huis zal een huis van gebed genoemd worden voor alle volken. De Heere HEERE, Die de verdrevenen van Israël bijeenbrengt, spreekt: Ik zal er bij hem nog meer bijeenbrengen, naast hen die al bij hem bijeengebracht zijn.", "Hand 8:26": "En een engel van de Heere sprak tot Filippus en zei: Sta op, en ga naar het zuiden, op de weg die van Jeruzalem afdaalt naar Gaza, die woest is.", "Hand 10:36-43": "Dit is het woord dat Hij gezonden heeft aan de kinderen van Israël, terwijl Hij vrede verkondigt door Jezus Christus; Deze is een Heere van allen. U weet de zaak die gebeurd is door geheel Judea, beginnend vanuit Galilea, na de doop die Johannes gepredikt heeft; namelijk dat Jezus van Nazareth, hoe God Hem gezalfd heeft met de Heilige Geest en met kracht; Die het land is doorgegaan, terwijl Hij goeddeed en allen genas die door de duivel overweldigd waren; want God was met Hem.", "Jes 22:22": "En Ik zal de sleutel van het huis van David op zijn schouder leggen; en hij zal opendoen, en niemand zal sluiten, en hij zal sluiten, en niemand zal opendoen.", "Jes 66:20": "En zij zullen al uw broeders uit alle heidenen naar de HEERE brengen als spijsoffer, op paarden, en op wagens, en op draagstoelen, en op muildieren, en op snelle lopers, naar Mijn heilige berg toe, naar Jeruzalem, zegt de HEERE, zoals de kinderen van Israël het spijsoffer in een rein vat brengen naar het huis van de HEERE.", "Joh 13:31": "Toen hij dan naar buiten gegaan was, zei Jezus: Nu is de Zoon des mensen verheerlijkt, en God is in Hem verheerlijkt.", "Hebr 8:2": "Een Bedienaar van het heiligdom, en van de ware tabernakel, die de Heere heeft opgericht, en geen mens.", "Openb 18:21": "En een sterke engel hief een steen op als een grote molensteen, en wierp die in de zee, en zei: Zo zal de grote stad Babylon met geweld neergeworpen worden, en zal niet meer gevonden worden.", "Jer 3:17": "In die tijd zullen zij Jeruzalem noemen: de troon van de HEERE; en alle heidenvolken zullen daar samenkomen, vanwege de Naam van de HEERE, in Jeruzalem; en zij zullen niet meer wandelen naar het goeddunken van hun slechte hart.", "Hebr 1:7": "En tot de engelen zegt Hij wel: Die Zijn engelen maakt tot geesten, en Zijn dienaars tot een vlam van het vuur.", "Openb 1:15": "En Zijn voeten waren als blinkend koper, en gloeiden als in een oven; en Zijn stem als een stem van veel water.", "Jes 42:3": "Het geknakte riet zal Hij niet breken, en de rokende vlaswiek zal Hij niet uitblussen; met waarheid zal Hij het recht voortbrengen.", "Jer 4:6": "Werp de banier op naar Sion, vlucht met spoed, blijf niet staan! Want Ik breng een kwaad aan van het noorden, en een grote ondergang.", "Jes 3:10": "Zegt de rechtvaardige, dat het hem goed zal gaan; dat zij de vrucht van hun werken zullen eten.", "Ezech 17:22": "Zo zegt de Heere HEERE: Ik zal ook van de opperste tak van de hoge ceder nemen, dat Ik zal planten; van de top van zijn jonge takjes zal Ik een teer takje afplukken, dat Ik op een hoge en verheven berg planten zal;", "Joh 3:30": "Hij moet meer worden, maar ik minder.", "Jes 18:3": "Allen, u bewoners van de wereld en u inwoners van de aarde! Als men de banier zal oprichten op de bergen, zult u het zien, en als de bazuin zal blazen, zult u het horen.", "Mal 3:1": "Zie, Ik zend Mijn engel, die voor Mijn aangezicht de weg bereiden zal; en snel zal die Heere, Die u zoekt, tot Zijn tempel komen, namelijk de Engel van het verbond, aan Wie u lust hebt; zie, Hij komt, zegt de HEERE van de heerscharen.", "Ezech 17:22-24": "Zo zegt de Heere HEERE: Ik zal ook van de opperste tak van de hoge ceder nemen, dat Ik zal planten; van de top van zijn jonge takjes zal Ik een teer takje afplukken, dat Ik op een hoge en verheven berg planten zal; op de berg van de hoogte van Israël zal Ik hem planten; en hij zal takken voortbrengen, en vrucht dragen, en hij zal tot een heerlijke ceder worden, zodat onder hem alle vogels van allerlei vleugel zullen wonen; in de schaduw van zijn takken zullen zij wonen. Zo zullen alle bomen van het veld weten dat Ik, de HEERE, de hoge boom vernederd heb, de nederige boom verheven heb, de groene boom verdroogd heb, en de droge boom bloeiend gemaakt heb; Ik, de HEERE, heb het gesproken, en zal het doen.", "Jes 35:1-10": "De woestijn en de dorre plaatsen zullen hierover vrolijk zijn, en de wildernis zal zich verheugen, en zal bloeien als een roos. Zij zal uitbundig bloeien, en zich verheugen, ja, met verheuging, en juichen; de heerlijkheid van Libanon is haar gegeven, het sieraad van Karmel en Saron; zij zullen de heerlijkheid van de HEERE zien, het sieraad van onze God. Versterkt de slappe handen, en maakt de struikelende knieën vast.", "Jes 56:3": "En de vreemdeling, die zich bij de HEERE gevoegd heeft, moet niet zeggen: De HEERE heeft mij helemaal van Zijn volk gescheiden; en de ontmande moet niet zeggen: Zie, ik ben een dorre boom.", "Zach 1:11": "En zij antwoordden de Engel van de HEERE Die tussen de mirten stond, en zeiden: Wij hebben het land doorwandeld, en zie, het hele land zit rustig en is stil.", "Hagg 1:12": "Toen luisterden Zerubbabel, de zoon van Sealthiël, en Josua, de zoon van Jozadak, de hogepriester, en heel het overblijfsel van het volk, naar de stem van de HEERE, hun God, en naar de woorden van de profeet Haggai, zoals de HEERE, hun God, hem gezonden had; en het volk vreesde voor het aangezicht van de HEERE.", "Jer 1:15": "Want zie, Ik roep alle geslachten van de koninkrijken van het noorden, spreekt de HEERE; en zij zullen komen, en ieder zal zijn troon zetten voor de deur van de poorten van Jeruzalem, en tegen al haar muren rondom, en tegen alle steden van Juda.", "Ps 2:6": "Ik heb Mijn Koning toch gezalfd over Sion, de berg van Mijn heiligheid.", "Hebr 13:2": "Vergeet de herbergzaamheid niet; want hierdoor hebben sommigen zonder het te weten engelen geherbergd.", "Dan 2:35": "Toen werden het ijzer, het leem, het koper, het zilver en het goud tegelijk verbrijzeld, en zij werden als kaf van de dorsvloeren in de zomer, en de wind voerde ze weg, zodat er geen plaats meer voor gevonden werd; maar de steen die het beeld verbrijzeld had, werd tot een grote berg, zodat hij de hele aarde vulde.", "2 Petr 2:11": "terwijl de engelen, die in sterkte en kracht groter zijn, geen lasterlijk oordeel tegen hen uitspreken voor de Heere.", "Jes 60:1-22": "Maak u op, word verlicht, want uw licht komt, en de heerlijkheid van de HEERE gaat over u op. Want zie, de duisternis zal de aarde bedekken, en donkerheid de volken; maar over u zal de HEERE opgaan, en Zijn heerlijkheid zal over u gezien worden. En de heidenen zullen naar uw licht gaan, en koningen naar de glans die over u is opgegaan.", "Openb 4:8-11": "En de vier dieren hadden ieder voor zichzelf zes vleugels rondom, en waren van binnen vol ogen; en zij hebben geen rust, dag en nacht, en zeggen: Heilig, heilig, heilig is de Heere God, de Almachtige, Die was, en Die is, en Die komen zal. En wanneer de dieren heerlijkheid, en eer, en dankzegging gaven aan Hem Die op de troon zat, Die leeft tot in alle eeuwigheid, dan vielen de vierentwintig oudsten neer voor Hem Die op de troon zat, en aanbaden Hem Die leeft tot in alle eeuwigheid, en wierpen hun kronen voor de troon, en zeiden:", "1 Kor 11:23-26": "Want ik heb van de Heere ontvangen, wat ik ook u overgegeven heb, dat de Heere Jezus in de nacht waarin Hij verraden werd, het brood nam; en toen Hij gedankt had, brak Hij het, en zei: Neemt, eet, dit is Mijn lichaam, dat voor u gebroken wordt; doe dat tot Mijn gedachtenis. Op dezelfde manier nam Hij ook de drinkbeker, na het eten van het avondmaal, en zei: Deze drinkbeker is het Nieuwe Testament in Mijn bloed. Doe dat, zo dikwijls als u die zult drinken, tot Mijn gedachtenis.", "1 Kor 15:24-28": "Daarna zal het einde zijn, wanneer Hij het Koninkrijk aan God en de Vader zal hebben overgegeven; wanneer Hij alle heerschappij, alle macht en kracht zal hebben tenietgedaan. Want Hij moet als Koning heersen, totdat Hij alle vijanden onder Zijn voeten zal hebben gelegd. De laatste vijand die tenietgedaan wordt, is de dood.", "Ex 28:38": "En zij zal op het voorhoofd van Aäron zijn, opdat Aäron de ongerechtigheid draagt van de heilige dingen die de kinderen van Israël geheiligd zullen hebben, in alle gaven van hun geheiligde dingen; en zij zal voortdurend aan zijn voorhoofd zijn, om hen voor het aangezicht van de HEERE aangenaam te maken.", "Jes 52:1-15": "Word wakker, word wakker, trek uw sterkte aan, o Sion! Trek uw sierlijke kleren aan, o Jeruzalem, u heilige stad! Want in u zal voortaan geen onbesnedene of onreine meer komen. Schud u uit het stof, sta op, ga zitten, o Jeruzalem! Maak u los van de banden van uw hals, u gevangen dochter van Sion! Want zo zegt de HEERE: U bent voor niets verkocht, u zult ook zonder geld vrijgekocht worden.", "Matt 25:31-34": "En wanneer de Zoon des mensen komen zal in Zijn heerlijkheid, en alle heilige engelen met Hem, dan zal Hij zitten op de troon van Zijn heerlijkheid. En voor Hem zullen alle volken verzameld worden, en Hij zal ze van elkaar scheiden, zoals de herder de schapen van de bokken scheidt. En Hij zal de schapen aan Zijn rechterhand zetten, maar de bokken aan Zijn linkerhand.", "1 Petr 2:5": "Dan wordt u ook zelf, als levende stenen, gebouwd tot een geestelijk huis, tot een heilig priesterschap, om geestelijke offers te brengen die God aangenaam zijn door Jezus Christus.", "Openb 12:3": "En er werd een ander teken gezien in de hemel; en zie, er was een grote rode draak, met zeven hoofden en tien horens, en op zijn hoofden zeven koninklijke kronen.", "Micha 1:13": "Span de snelle dieren aan de wagen, u inwoners van Lachis! (Deze is van de dochter van Sion het beginsel van de zonde) want in u zijn Israëls overtredingen gevonden.", "Ps 86:9": "Al de heidenen, Heere! die Gij gemaakt hebt, zullen komen, en zullen zich voor Uw aangezicht neerbuigen, en Uw Naam eren.", "1 Kron 6:14": "En Azarja verwekte Seraja, en Seraja verwekte Jozadak;", "Hebr 1:14": "Zijn zij niet allemaal dienende geesten, die uitgezonden worden om te dienen, om hen die de zaligheid zullen beërven?", "Hand 2:35": "Totdat Ik Uw vijanden tot een voetbank voor Uw voeten gezet zal hebben.", "Matt 19:28": "En Jezus zei tegen hen: Voorwaar, Ik zeg u, dat u, die Mij gevolgd bent, in de wedergeboorte, wanneer de Zoon des mensen zal zitten op de troon van Zijn heerlijkheid, dat u ook zult zitten op twaalf tronen, en de twaalf geslachten van Israël zult oordelen.", "Jer 23:6": "In Zijn dagen zal Juda verlost worden, en Israël zal zeker wonen; en dit zal Zijn naam zijn, waarmee men Hem zal noemen: De Heere: ONZE GERECHTIGHEID.", "Luk 22:29": "En Ik ken u het Koninkrijk toe, zoals Mijn Vader dat Mij toegekend heeft;", "Jes 33:17": "Uw ogen zullen de Koning zien in Zijn schoonheid; zij zullen een ver gelegen land zien.", "Hagg 2:5": "Toch nu, wees sterk, Zerubbabel! spreekt de HEERE; en wees sterk, Josua, zoon van Jozadak, hogepriester! en wees sterk, al u volk van het land! spreekt de HEERE; en werk, want Ik ben met u, spreekt de HEERE van de heerscharen;", "Dan 4:17": "Deze zaak is bij besluit van de wachters, en dit verlangen is bij het woord van de heiligen; opdat de levenden weten dat de Allerhoogste heerschappij heeft over de koninkrijken van de mensen, en ze geeft aan wie Hij wil, ja, zelfs de laagste onder de mensen daarover aanstelt.", "Ezech 1:4-25": "Toen zag ik, en zie, een stormwind kwam van het noorden af, een grote wolk, en een vuur dat zichzelf omvatte, en een glans was rondom die wolk; en uit het midden daarvan was iets als de kleur van amber, uit het midden van het vuur. En uit het midden daarvan kwam de gelijkenis van vier levende wezens; en dit was hun gedaante: zij hadden de gelijkenis van een mens; En elk had vier gezichten; ook had elk van hen vier vleugels.", "Hebr 7:24": "maar Deze, omdat Hij in eeuwigheid blijft, heeft een onvergankelijk priesterschap.", "Ef 2:13-18": "Maar nu bent u, die eertijds ver weg was, in Christus Jezus nabij gekomen door het bloed van Christus. Want Hij is onze vrede, Die deze beiden één gemaakt heeft, en de scheidsmuur die tussen ons in stond, afgebroken heeft, doordat Hij de vijandschap in Zijn vlees teniet gemaakt heeft, namelijk de wet van de geboden die in inzettingen bestond; opdat Hij die twee in Zichzelf tot één nieuwe mens zou scheppen, en zo vrede zou maken;", "Hand 2:34": "Want David is niet opgevaren naar de hemel; maar hij zegt zelf: De Heere heeft gesproken tot mijn Heere: Zit aan Mijn rechterhand,", "Jer 33:22": "Zoals het leger van de hemel niet geteld, en het zand van de zee niet gemeten kan worden, zo zal Ik het nageslacht van Mijn knecht David vermenigvuldigen, en de Levieten die Mij dienen.", "Richt 15:7": "Toen zei Simson tegen hen: Zouden jullie zoiets doen? Zeker, als ik mij op jullie gewroken heb, zal ik daarna ophouden.", "Dan 9:21-23": "terwijl ik nog sprak in het gebed, kwam de man Gabriël, die ik in het begin in een visioen gezien had, snel gevlogen, en raakte mij aan, omtrent de tijd van het avondoffer. En hij onderrichtte mij en sprak met mij, en zei: Daniël! nu ben ik uitgegaan, om u het inzicht te doen verstaan. In het begin van uw smekingen is het woord uitgegaan, en ik ben gekomen om het u bekend te maken; want u bent een zeer geliefde man; versta dan dit woord, en let op dit visioen.", "Hebr 2:16": "Want inderdaad, Hij neemt niet de engelen aan, maar Hij neemt het nageslacht van Abraham aan.", "Joh 1:46": "Filippus vond Nathanaël en zei tegen hem: Wij hebben Hem gevonden, van Wie Mozes in de wet geschreven heeft, en de profeten, namelijk Jezus, de zoon van Jozef, van Nazareth.", "Jes 14:27": "Want de HEERE van de heerscharen heeft het in Zijn raad besloten, wie zal het dan verbreken? en Zijn hand is uitgestrekt, wie zal die dan keren?", "Ex 28:29": "Zo zal Aäron de namen van de zonen van Israël dragen aan de borstlap van het gericht, op zijn hart, als hij in het heilige zal gaan, ter gedachtenis voor het aangezicht van de HEERE, voortdurend.", "Zach 6:12-15": "En spreek tegen hem, en zeg: Zo spreekt de HEERE van de heerscharen: Zie, een Man, Wiens naam is SPRUIT, Die zal uit Zijn plaats opgroeien, en Hij zal de tempel van de HEERE bouwen. Ja, Hij zal de tempel van de HEERE bouwen, en Hij zal het sieraad dragen, en Hij zal zitten, en heersen op Zijn troon; en Hij zal priester zijn op Zijn troon; en de raad van vrede zal tussen die Beiden zijn. En die kronen zullen zijn voor Chelem, en voor Tobia, en voor Jedaja, en voor Chen, de zoon van Zefanja, tot een gedachtenis in de tempel van de HEERE.", "Hebr 7:25-28": "Daarom kan Hij ook volkomen zalig maken hen die door Hem tot God gaan, omdat Hij altijd leeft om voor hen te bidden. Want zo'n Hogepriester paste bij ons: heilig, onschuldig, onbesmet, afgescheiden van de zondaars, en hoger geworden dan de hemelen; Hij heeft het niet elke dag nodig, zoals de hogepriesters, om eerst voor zijn eigen zonden slachtoffers te offeren, en daarna voor de zonden van het volk; want dat heeft Hij eenmaal gedaan, toen Hij Zichzelf opgeofferd heeft.", "Hand 10:36": "Dit is het woord dat Hij gezonden heeft aan de kinderen van Israël, terwijl Hij vrede verkondigt door Jezus Christus; Deze is een Heere van allen.", "Ps 46:11": "Laat af, en weet, dat Ik God ben; Ik zal verhoogd worden onder de heidenen, Ik zal verhoogd worden op de aarde.", "Dan 2:38-40": "En overal waar mensenkinderen wonen, heeft Hij de dieren van het veld en de vogels van de hemel in uw hand gegeven; en Hij heeft u aangesteld als heerser over hen allen; u bent dat gouden hoofd. En na u zal een ander koninkrijk opstaan, lager dan het uwe; daarna een ander, het derde koninkrijk, van koper, dat zal heersen over de hele aarde. En het vierde koninkrijk zal hard zijn als ijzer; want zoals het ijzer alles verbrijzelt en verzwakt, zo zal dat koninkrijk, net als ijzer dat alles verbreekt, alles verbrijzelen en verbreken.", "Matt 17:3": "En zie, Mozes en Elia verschenen aan hen en spraken met Hem.", "Luk 22:69": "van nu af aan zal de Zoon des mensen gezeten zijn aan de rechterhand van de kracht van God.", "Joh 3:31": "Wie van boven komt, is boven allen; wie uit de aarde is voortgekomen, die is uit de aarde en spreekt uit de aarde. Wie uit de hemel komt, is boven allen.", "Zach 2:10": "Juich en verblijd u, dochter van Sion; want zie, Ik kom, en Ik zal in het midden van u wonen, spreekt de HEERE.", "Ps 45:4": "Gord Uw zwaard aan de heup, o Held! Uw Majesteit en Uw heerlijkheid.", "Ezech 5:13": "Zo zal Mijn toorn volbracht worden, en Ik zal Mijn grimmigheid op hen laten rusten, en Mij troosten; en zij zullen weten dat Ik, de HEERE, in Mijn ijver gesproken heb, als Ik Mijn grimmigheid tegen hen volbracht zal hebben.", "Joh 17:1-5": "Dit heeft Jezus gesproken, en Hij hief Zijn ogen op naar de hemel, en zei: Vader, het uur is gekomen; verheerlijk Uw Zoon, opdat ook Uw Zoon U verheerlijkt. Zoals U Hem macht gegeven hebt over alle vlees, opdat Hij aan allen die U Hem gegeven hebt, het eeuwige leven geeft. En dit is het eeuwige leven, dat zij U kennen, de enige waarachtige God, en Jezus Christus, Die U gezonden hebt.", "Hand 10:4": "En hij hield de ogen op hem gericht, en werd zeer bevreesd, en zei: Wat is er, Heere? En Hij zei tegen hem: Uw gebeden en uw aalmoezen zijn als gedachtenis opgekomen voor God.", "Jes 51:8": "Want de mot zal ze opeten als een kleed, en het schietwormpje zal ze opeten als wol; maar Mijn gerechtigheid zal in eeuwigheid zijn, en Mijn heil van geslacht tot geslacht.", "Jes 52:13": "Zie, Mijn Knecht zal verstandig handelen; Hij zal verhoogd en verheven, ja, zeer hoog worden.", "Jes 54:10": "Want bergen zullen wijken, en heuvels wankelen; maar Mijn goedertierenheid zal van u niet wijken, en het verbond van Mijn vrede zal niet wankelen, zegt de HEERE, uw Ontfermer.", "Luk 13:29": "En er zullen mensen komen van oost en west, en van noord en zuid, en zullen aanzitten in het Koninkrijk van God.", "Jes 49:6-12": "Verder zei Hij: Het is te gering, dat U Mij een Knecht zou zijn, om op te richten de stammen van Jakob, en om terug te brengen de bewaarden in Israël; Ik heb U ook gegeven tot een Licht van de heidenen, om Mijn heil te zijn tot aan het einde van de aarde. Zo zegt de HEERE, de Verlosser van Israël, Zijn Heilige, tegen de veracht ziel, tegen Hem aan Wie het volk een gruwel heeft, tegen de Knecht van hen die heersen: Koningen zullen het zien en opstaan, ook vorsten, en zij zullen zich voor U buigen; om de wil van de HEERE, Die getrouw is, om de Heilige van Israël, Die U verkozen heeft. Zo zegt de HEERE: In de tijd van het welbehagen heb Ik U verhoord, en op de dag van het heil heb Ik U geholpen; en Ik zal U bewaren, en Ik zal U geven tot een verbond van het volk, om het aardrijk op te richten, om de verwoeste erfenissen te doen beërven;", "Ps 22:28-32": "Alle einden van de aarde zullen het gedenken, en zich tot de HEERE bekeren; en alle geslachten van de heidenen zullen voor Uw aangezicht aanbidden. Want het koninkrijk is van de HEERE, en Hij heerst onder de heidenen. Alle vetten op aarde zullen eten, en aanbidden; allen die in het stof neerdalen, zullen voor Zijn aangezicht neerbukken; en die zijn ziel bij het leven niet kan houden.", "Jes 19:25": "Want de HEERE van de heerscharen zal hen zegenen en zeggen: Gezegend zij Mijn volk, de Egyptenaars, en de Assyriërs, het werk van Mijn handen, en Israël, Mijn erfdeel!", "Zach 8:1-23": "Daarna kwam het woord van de HEERE van de heerscharen tot mij, en Hij zei: Zo zegt de HEERE van de heerscharen: Ik heb geijverd over Sion met een grote ijver; ja, met grote grimmigheid heb Ik over haar geijverd. Zo zegt de HEERE: Ik ben teruggekeerd naar Sion, en Ik zal in het midden van Jeruzalem wonen; en Jeruzalem zal genoemd worden een stad van de waarheid, en de berg van de HEERE van de heerscharen, een berg van heiligheid.", "Jes 65:1": "Ik ben gevonden door hen die naar Mij niet vroegen; Ik ben gevonden door hen die Mij niet zochten; tegen het volk, dat naar Mijn Naam niet genoemd was, heb Ik gezegd: Zie, hier ben Ik, zie, hier ben Ik.", "Joël 2:26-32": "En u zult overvloedig en tot verzadiging eten, en de Naam van de HEERE, uw God, prijzen, Die wonderlijk bij u gehandeld heeft; en Mijn volk zal niet beschaamd worden tot in eeuwigheid. En u zult weten, dat Ik in het midden van Israël ben, en dat Ik de HEERE, uw God, ben, en niemand anders meer; en Mijn volk zal niet beschaamd worden in eeuwigheid. En daarna zal het gebeuren, dat Ik Mijn Geest zal uitgieten over alle vlees, en uw zonen en uw dochters zullen profeteren; uw ouden zullen dromen dromen, uw jongelingen zullen gezichten zien;", "Joh 1:52": "En Hij zei tegen hem: Voorwaar, voorwaar, Ik zeg u: Van nu af aan zult u de hemel geopend zien, en de engelen van God opklimmen en neerdalen op de Zoon des mensen.", "Ps 102:14-16": "U zult opstaan, U zult U ontfermen over Sion, want de tijd om haar genadig te zijn, want de bestemde tijd is gekomen. Want Uw knechten hebben een welgevallen aan haar stenen, en hebben medelijden met haar gruis. Dan zullen de heidenen de Naam van de HEERE vrezen, en alle koningen van de aarde Uw heerlijkheid.", "Jes 6:2": "De serafs stonden boven Hem; ieder had zes vleugels; met twee bedekte ieder zijn gezicht, en met twee bedekte hij zijn voeten, en met twee vloog hij.", "Openb 3:7": "En schrijf aan de engel van de gemeente die in Filadelfia is: Dit zegt de Heilige, de Waarachtige, Die de sleutel van David heeft; Die opent, en niemand sluit, en Hij sluit, en niemand opent:", "Zach 9:9": "Verheug u zeer, dochter van Sion! Juich, dochter van Jeruzalem! Zie, uw Koning zal tot u komen, rechtvaardig, en Hij is een Heiland; arm, en rijdend op een ezel, en op een veulen, het jong van de ezelinnen.", "Jer 33:15": "In die dagen, en te dien tijde zal Ik David een SPRUIT van gerechtigheid doen opkomen; en Hij zal recht en gerechtigheid doen op aarde.", "Dan 2:39": "En na u zal een ander koninkrijk opstaan, lager dan het uwe; daarna een ander, het derde koninkrijk, van koper, dat zal heersen over de hele aarde.", "Rom 14:9": "Want daarvoor is Christus ook gestorven, en opgestaan, en weer levend geworden, opdat Hij zou heersen over zowel doden als levenden.", "Rom 1:5-7": "(Door Wie wij genade en het apostelschap hebben ontvangen, tot gehoorzaamheid van het geloof onder alle heidenen, voor Zijn Naam; onder wie u ook bent, geroepenen van Jezus Christus!) Aan allen die in Rome zijn, geliefden van God, en geroepen heiligen: genade zij u, en vrede van God, onze Vader, en de Heere Jezus Christus.", "Ps 126:6": "Die het zaad draagt om te zaaien, gaat al gaande en wenende; maar hij zal zeker met gejuich terugkomen, terwijl hij zijn schoven draagt.", "1 Kon 19:11": "En Hij zei: Ga naar buiten, en sta op deze berg, voor het aangezicht van de HEERE. En zie, de HEERE ging voorbij, en een grote en sterke wind, die de bergen scheurde en de rotsen stukbrak, ging voor de HEERE uit; maar de HEERE was in de wind niet; en na deze wind een aardbeving; de HEERE was ook in de aardbeving niet;", "Zach 5:2": "En Hij zei tegen mij: Wat ziet u? En ik zei: Ik zie een vliegende rol, de lengte ervan is twintig el, en de breedte ervan tien el.", "Dan 2:45": "Daarom hebt u gezien dat uit de berg een steen zonder handen werd afgehouwen, die het ijzer, koper, leem, zilver en goud verbrijzelde; de grote God heeft de koning bekendgemaakt wat hierna gebeuren zal; de droom is dus waar, en de uitleg ervan betrouwbaar.", "Jes 14:26": "Dit is de raadslag, die beraadslaagd is over dat hele land; en dit is de hand, die uitgestrekt is over alle volken.", "Luk 12:8": "En Ik zeg u: ieder die Mij belijden zal voor de mensen, die zal ook de Zoon des mensen belijden voor de engelen van God.", "Jes 23:17": "Want het zal gebeuren aan het einde van zeventig jaren, dat de HEERE Tyrus zal bezoeken, en dat zij zal terugkeren tot haar hoerenloon, en zij zal hoererij bedrijven met alle koninkrijken van de aarde, die op de aardbodem zijn.", "Jes 49:1-26": "Hoort naar Mij, eilanden! En luistert toe, volken van verre! De HEERE heeft Mij geroepen van de buik af, van het ingewand van Mijn moeder af heeft Hij Mijn Naam vermeld. En Hij heeft Mijn mond gemaakt als een scherp zwaard, onder de schaduw van Zijn hand heeft Hij Mij bedekt; en Hij heeft Mij tot een gezuiverde pijl gesteld, in Zijn pijlkoker heeft Hij Mij verborgen. En Hij heeft tegen Mij gezegd: U bent Mijn Knecht, Israël, door Wie Ik verheerlijkt zal worden.", "Hebr 4:14-16": "Omdat wij dan een grote Hogepriester hebben, Die door de hemelen heen gegaan is, namelijk Jezus, de Zoon van God, laat ons deze belijdenis vasthouden. Want wij hebben geen Hogepriester Die geen medelijden kan hebben met onze zwakheden, maar Die in alle dingen, net als wij, beproefd is geweest, doch zonder zonde. Laat ons dan met vrijmoedigheid toegaan tot de troon van de genade, opdat wij barmhartigheid mogen verkrijgen en genade vinden om geholpen te worden op de tijd dat wij het nodig hebben.", "Deut 33:25": "IJzer en koper zal onder uw schoen zijn; en uw sterkte gelijk uw dagen!", "Ps 46:5": "De beekjes van de rivier zullen verblijden de stad van God, het heiligdom van de woningen van de Allerhoogste.", "Jer 51:48": "En de hemel en de aarde, alsook alles wat daarin is, zullen juichen over Babel; want vanuit het noorden zullen haar de verstoorders aankomen, spreekt de HEERE.", "Dan 8:13": "Daarna hoorde ik een heilige spreken; en de heilige zei tegen de onbenoemde die daar sprak: Tot hoelang zal dat gezicht van het voortdurende offer en de verwoestende afval duren, dat zowel het heiligdom als het leger vertrapt zal worden?", "Ps 87:1-5": "Een psalm, een lied voor de kinderen van Korach. Zijn grondslag is op de bergen van heiligheid. De HEERE heeft de poorten van Sion lief, boven alle woningen van Jakob. Zeer heerlijke dingen worden van u gesproken, o stad van God! Sela.", "Hebr 3:1": "Daarom, heilige broeders, die deel hebben aan de hemelse roeping, richt uw aandacht op de Apostel en Hogepriester van onze belijdenis, Christus Jezus;", "Zach 4:10": "Want wie veracht de dag van de kleine dingen? Toch zullen die zeven zich verblijden, als zij het tinnen gewicht zullen zien in de hand van Zerubbabel; dat zijn de ogen van de HEERE, die het hele land doorkruisen.", "Jes 11:10": "Want het zal gebeuren op die dag, dat de heidenen zullen vragen naar de Wortel van Isaï, Die zal staan als een banier voor de volken, en Zijn rust zal heerlijk zijn.", "Micha 4:3": "En Hij zal onder grote volken rechtspreken, en machtige heidenvolken straffen, tot ver weg toe; en zij zullen hun zwaarden omsmeden tot ploegscharen, en hun speren tot snoeimessen; het ene volk zal tegen het andere volk geen zwaard opheffen, en zij zullen de oorlog niet meer leren.", "Ps 89:38": "Hij zal eeuwig bevestigd worden, als de maan; en de Getuige in de hemel is getrouw. Sela.", "Openb 20:6": "Gelukkig en heilig is hij, die deel heeft in de eerste opstanding; over hen heeft de tweede dood geen macht, maar zij zullen priesters van God en Christus zijn, en zij zullen met Hem als koningen heersen, duizend jaar.", "Zach 8:1": "Daarna kwam het woord van de HEERE van de heerscharen tot mij, en Hij zei:", "Hand 7:53": "U, die de wet ontvangen hebt door bemiddeling van engelen, en die niet gehouden hebt!", "Zach 2:11": "En veel heidenen zullen op die dag aan de HEERE toegevoegd worden, en zij zullen Mij tot een volk wezen; en Ik zal in het midden van u wonen; en u zult weten, dat de HEERE van de heerscharen mij tot u gezonden heeft.", "Jes 65:1-25": "Ik ben gevonden door hen die naar Mij niet vroegen; Ik ben gevonden door hen die Mij niet zochten; tegen het volk, dat naar Mijn Naam niet genoemd was, heb Ik gezegd: Zie, hier ben Ik, zie, hier ben Ik. Ik heb Mijn handen uitgebreid, de hele dag, tot een opstandig volk, dat wandelt op een weg die niet goed is, naar hun eigen gedachten. Een volk dat Mij voortdurend tergt in Mijn aangezicht, terwijl het in de hoven offert en op tichelstenen wierook brandt;", "Joh 17:21": "Opdat zij allen één zijn, zoals U, Vader, in Mij, en Ik in U, dat ook zij in Ons één zijn; opdat de wereld gelooft dat U Mij gezonden hebt.", "Hagg 1:1": "In het tweede jaar van koning Darius, in de zesde maand, op de eerste dag van de maand, kwam het woord van de HEERE, door de dienst van Haggai, de profeet, tot Zerubbabel, de zoon van Sealthiël, de vorst van Juda, en tot Josua, de zoon van Jozadak, de hogepriester, en Hij zei:", "Matt 26:64": "Jezus zei tegen hem: U hebt het gezegd. Maar Ik zeg u: van nu af aan zult u de Zoon des mensen zien zitten aan de rechterhand van de kracht van God, en komen op de wolken van de hemel.", "Jes 45:23": "Ik heb bij Mijzelf gezworen, er is een woord van gerechtigheid uit Mijn mond gegaan, en het zal niet terugkeren: dat voor Mij alle knie zich zal buigen, alle tong Mij zal zweren.", "Jes 42:13-15": "De HEERE zal uittrekken als een held; Hij zal de ijver opwekken als een krijgsman; Hij zal juichen, ja, Hij zal een groot geschreeuw maken; Hij zal Zijn vijanden overweldigen. Ik heb van oudsher gezwegen, Ik heb Mij stil gehouden en Mij ingehouden; Ik zal uitschreeuwen als een barende vrouw, Ik zal ze verwoesten en tegelijk opslokken. Ik zal bergen en heuvels woest maken, en al hun gras zal Ik doen verdorren; en Ik zal de rivieren tot eilanden maken, en de poelen uitdrogen.", "1 Petr 2:4": "Kom naar Hem toe, als naar een levende Steen, door de mensen wel verworpen, maar bij God uitverkoren en kostbaar;", "Num 16:40": "Ter herinnering voor de kinderen van Israël, opdat geen vreemdeling, die niet uit het nageslacht van Aäron is, nadert om reukwerk aan te steken voor het aangezicht van de HEERE; opdat hij niet wordt als Korach en zijn vergadering, zoals de HEERE hem door de hand van Mozes gezegd had.", "Zach 1:19-21": "En ik zei tegen de Engel Die met mij sprak: Wat zijn deze? En Hij zei tegen mij: Dat zijn de horens die Juda, Israël en Jeruzalem verstrooid hebben. En de HEERE toonde mij vier smeden. Toen zei ik: Wat komen die doen? En Hij sprak en zei: Dat zijn de horens die Juda verstrooid hebben, zodat niemand zijn hoofd ophief; maar deze zijn gekomen om die te verschrikken, om de horens van de heidenen neer te werpen, die hun horen verheven hebben tegen het land van Juda om dat te verstrooien.", "Matt 28:18": "En Jezus kwam bij hen en sprak tot hen: Mij is gegeven alle macht in hemel en op aarde.", "Jes 11:1": "Want er zal een Rijsje voortkomen uit de afgehouwen tronk van Isaï, en een Scheut uit zijn wortels zal vrucht voortbrengen.", "Luk 19:38": "en zij zeiden: Gezegend is de Koning, Die komt in de Naam van de Heere! Vrede in de hemel, en heerlijkheid in de hoogste hemelen!", "Micha 5:3": "En Hij zal staan, en zal weiden in de kracht van de HEERE, in de hoogheid van de Naam van de HEERE, Zijn God, en zij zullen wonen, want nu zal Hij groot zijn tot aan de einden van de aarde.", "Openb 19:16": "En Hij heeft op Zijn kleed en op Zijn dij deze Naam geschreven: Koning der koningen, en Heere der heren.", "Joh 18:36": "Jezus antwoordde: Mijn Koninkrijk is niet van deze wereld. Als Mijn Koninkrijk van deze wereld was, zouden Mijn dienaren gestreden hebben, zodat Ik niet aan de Joden overgeleverd zou zijn; maar nu is Mijn Koninkrijk niet van hier.", "Job 4:15-19": "Toen ging er een geest voorbij mijn gezicht; hij deed het haar van mijn lichaam overeind komen. Hij stond stil, maar ik herkende zijn gedaante niet; er was een beeltenis voor mijn ogen; er was stilte, en ik hoorde een stem, die zei: Zou een mens rechtvaardiger zijn dan God? Zou een man reiner zijn dan zijn Maker?", "Mark 14:58": "Wij hebben Hem horen zeggen: Ik zal deze tempel, die met handen gemaakt is, afbreken, en in drie dagen een andere, zonder handen gemaakt, bouwen.", "Jes 51:3-16": "Want de HEERE zal Sion troosten, Hij zal al haar woeste plaatsen troosten, en Hij zal haar woestijn maken als Eden, en haar wildernis als de hof van de HEERE; vreugde en blijdschap zal daarin gevonden worden, dankzegging en een stem van het gezang. Luister naar Mij, Mijn volk! En Mijn lieden, neig naar Mij het oor! Want een wet zal van Mij uitgaan, en Ik zal Mijn recht doen rusten tot een licht van de volken. Mijn gerechtigheid is nabij, Mijn heil trekt uit, en Mijn armen zullen de volken richten; op Mij zullen de eilanden wachten, en op Mijn arm zullen zij hopen.", "Jes 58:10-14": "En als u uw ziel opent voor de hongerige, en de bedrukte ziel verzadigt; dan zal uw licht in de duisternis opgaan, en uw donkerheid zal zijn als de middag. En de HEERE zal u voortdurend leiden, en Hij zal uw ziel verzadigen in grote droogte, en uw beenderen sterk maken; en u zult zijn als een gewaterde hof, en als een springader van water, waarvan het water niet ontbreekt. En zij die uit u voortkomen, zullen de oude verwoeste plaatsen bouwen; de fundamenten, van geslacht tot geslacht verwoest, zult u oprichten; en u zult genoemd worden: Die de bressen dichtmuurt, die de paden weer opmaakt, om te bewonen.", "Jes 53:10-12": "Maar het behaagde de HEERE Hem te verbrijzelen; Hij heeft Hem ziek gemaakt. Als Zijn ziel Zich tot een schuldoffer gesteld zal hebben, zal Hij nageslacht zien, Hij zal de dagen verlengen; en het welbehagen van de HEERE zal door Zijn hand voorspoedig voortgaan. Om de arbeid van Zijn ziel zal Hij het zien en verzadigd worden; door Zijn kennis zal Mijn Knecht, de Rechtvaardige, velen rechtvaardig maken, want Hij zal hun ongerechtigheden dragen. Daarom zal Ik Hem een deel geven onder velen, en Hij zal de machtigen als buit verdelen, omdat Hij Zijn ziel uitgestort heeft in de dood, en onder de overtreders geteld is geweest, en Hij de zonden van velen gedragen heeft, en voor de overtreders gebeden heeft.", "Ps 33:11": "Maar de raad van de HEERE bestaat in eeuwigheid, de gedachten van Zijn hart van geslacht tot geslacht.", "Hebr 10:12": "Maar Deze, die één offer voor de zonden gebracht heeft, is voor eeuwig gaan zitten aan de rechterhand van God;", "Openb 15:4": "Wie zou U niet vrezen, Heere, en Uw Naam niet verheerlijken? Want Gij alleen zijt heilig; want alle volken zullen komen, en voor U aanbidden; want Uw oordelen zijn openbaar geworden.", "Matt 18:10": "Kijk uit dat u niet één van deze kleinen veracht. Want Ik zeg u dat hun engelen in de hemelen altijd het aangezicht zien van Mijn Vader, Die in de hemelen is.", "Openb 22:9": "En hij zei tegen mij: Zie toe, doe dat niet; want ik ben uw mededienstknecht, en van uw broeders de profeten, en van hen die de woorden van dit boek bewaren; aanbid God.", "Hebr 1:4": "Zoveel voortreffelijker geworden dan de engelen, als Hij een uitnemender Naam boven hen geërfd heeft.", "Openb 19:15": "En uit Zijn mond ging een scherp zwaard, opdat Hij daarmee de heidenen slaan zou. En Hij zal hen hoeden met een ijzeren staf; en Hij treedt de wijnpersbak van de wijn van de toorn en van de gramschap van de Almachtige God.", "Openb 5:9": "En zij zongen een nieuw lied: U bent waard dat boek te nemen en zijn zegels te openen; want U bent geslacht, en hebt ons voor God gekocht met Uw bloed, uit elk geslacht, en taal, en volk, en natie;", "Openb 6:5": "En toen Het het derde zegel geopend had, hoorde ik het derde dier zeggen: Kom en zie! En ik zag, en zie, een zwart paard, en die daarop zat, had een weegschaal in zijn hand.", "Ps 2:8": "Eis van Mij, en Ik zal de heidenen geven tot Uw erfdeel, en de einden van de aarde tot Uw bezitting.", "Ps 47:9": "God regeert over de heidenen; God zit op de troon van Zijn heiligheid.", "Dan 11:6": "Op het einde van sommige jaren zullen zij zich met elkaar bevrienden, en de dochter van de koning van het Zuiden zal komen tot de koning van het Noorden, om billijke voorwaarden te maken; maar zij zal de macht van de arm niet behouden, daarom zal hij, noch zijn arm, niet blijven bestaan; maar zij zal overgegeven worden, met hen die haar gebracht hebben, en hij die haar verwekt heeft, en hij die haar in die tijden gesterkt heeft.", "1 Sam 2:30": "Daarom spreekt de HEERE, de God van Israël: Ik had wel duidelijk gezegd: Uw huis en het huis van uw vader zouden voor Mijn aangezicht wandelen tot in eeuwigheid; maar nu spreekt de HEERE: Dat zij verre van Mij; want die Mij eren, zal Ik eren, maar die Mij versmaden, zullen licht geacht worden.", "Openb 22:1-5": "En hij toonde mij een zuivere rivier van het water des levens, klaar als kristal, die uit de troon van God en van het Lam kwam. In het midden van haar straat en aan de ene en de andere zijde van de rivier was de boom des levens, die twaalf keer vrucht droeg, van maand tot maand zijn vrucht gevend; en de bladeren van de boom waren tot genezing van de heidenen. En geen vervloeking zal er meer tegen iemand zijn; en de troon van God en van het Lam zal daar zijn, en Zijn dienstknechten zullen Hem dienen;", "Luk 22:30": "opdat u eet en drinkt aan Mijn tafel in Mijn Koninkrijk, en zit op tronen, en de twaalf stammen van Israël oordeelt.", "Openb 18:22": "En de stem van citerspelers, en zangers, en fluiters, en bazuinblazers, zal in u niet meer gehoord worden; en geen enkele kunstenaar van welke kunst dan ook zal meer in u gevonden worden; en het geluid van de molen zal in u niet meer gehoord worden.", "Ps 104:3": "Die Zijn opperzalen bouwt op de wateren, Die van de wolken Zijn wagen maakt, Die op de vleugels van de wind wandelt.", "Hagg 2:8-10": "Ja, Ik zal alle heidenvolken doen beven, en zij zullen komen tot de Wens van alle heidenvolken, en Ik zal dit huis met heerlijkheid vervullen, zegt de HEERE van de heerscharen. Mijn is het zilver, en Mijn is het goud, spreekt de HEERE van de heerscharen. De heerlijkheid van dit laatste huis zal groter worden dan die van het eerste, zegt de HEERE van de heerscharen; en in deze plaats zal Ik vrede geven, spreekt de HEERE van de heerscharen.", "Openb 6:15-17": "En de koningen van de aarde, en de groten, en de rijken, en de leiders over duizend, en de machtigen, en alle dienstknechten, en alle vrijen, verborgen zichzelf in de spelonken, en in de steenrotsen van de bergen; En zeiden tot de bergen en tot de steenrotsen: Valt op ons, en verbergt ons van het aangezicht van Hem Die op de troon zit, en van de toorn van het Lam. Want de grote dag van Zijn toorn is gekomen, en wie kan bestaan?", "Gen 14:18": "En Melchizedek, koning van Salem, bracht brood en wijn; en hij was een priester van de allerhoogste God.", "Matt 26:13": "Voorwaar, Ik zeg u: waar dit Evangelie ook gepredikt zal worden in de hele wereld, daar zal ook, tot haar gedachtenis, verteld worden wat zij gedaan heeft.", "Hebr 12:22": "Maar u bent gekomen tot de berg Sion, en de stad van de levende God, tot het hemelse Jeruzalem, en de vele duizenden engelen;", "Ef 1:10": "Om in de bedeling van de volheid der tijden alles weer tot één te vergaderen in Christus, zowel wat in de hemel is, als wat op de aarde is;", "Jes 29:18-24": "En op die dag zullen de doven de woorden van het boek horen; en de ogen van de blinden, die uit de donkerheid en uit de duisternis zijn, zullen zien. En de zachtmoedigen zullen vreugde op vreugde hebben in de HEERE; en de behoeftigen onder de mensen zullen zich in de Heilige van Israël verheugen. Wanneer de tiran een einde zal hebben, en het met de spotter voorbij zal zijn, en allen die op ongerechtigheid loeren, uitgeroeid zullen zijn;", "Jes 46:12": "Hoor naar Mij, u die hardnekkig van hart bent, u, die ver van de gerechtigheid zijt!", "Matt 3:12": "Zijn wan is in Zijn hand, en Hij zal Zijn dorsvloer helemaal zuiveren, en Zijn tarwe in Zijn schuur samenbrengen, en Hij zal het kaf met onblusbaar vuur verbranden.", "Ps 110:4": "De HEERE heeft gezworen, en het zal Hem niet berouwen: U bent Priester in eeuwigheid, naar de ordening van Melchizedek.", "Openb 1:5-7": "en van Jezus Christus, Die de getrouwe Getuige is, de Eerstgeborene uit de doden, en de Vorst van de koningen van de aarde. Hem, Die ons heeft liefgehad, en ons van onze zonden gewassen heeft in Zijn bloed. En Die ons gemaakt heeft tot koningen en priesters voor God en Zijn Vader; Hem, zeg ik, zij de heerlijkheid en de kracht tot in alle eeuwigheid. Amen. Zie, Hij komt met de wolken en elk oog zal Hem zien, ook zij die Hem doorstoken hebben; en alle geslachten van de aarde zullen over Hem rouw bedrijven; ja, amen.", "Jes 9:5": "Want een Kind is ons geboren, een Zoon is ons gegeven, en de heerschappij is op Zijn schouder; en men noemt Zijn naam Wonderlijk, Raad, Sterke God, Vader van de eeuwigheid, Vredevorst;", "Jes 49:5": "En nu zegt de HEERE, Die Mij van moeders buik af tot een Knecht gevormd heeft, dat Ik Jakob tot Hem terugbrengen zou; maar Israël zal zich niet laten verzamelen; toch zal Ik verheerlijkt worden in de ogen van de HEERE, en Mijn God zal Mijn Sterkte zijn.", "Ps 138:4": "Alle koningen van de aarde zullen U, o HEERE! loven, wanneer zij de redenen van Uw mond gehoord zullen hebben.", "Openb 10:1-6": "En ik zag een andere sterke engel neerkomen uit de hemel, bekleed met een wolk; en een regenboog was boven zijn hoofd; en zijn gezicht was als de zon, en zijn voeten waren als pilaren van vuur. En hij had in zijn hand een boekje, dat geopend was; en hij zette zijn rechtervoet op de zee, en de linker op de aarde. En hij riep met een luide stem, zoals een leeuw brult; en toen hij geroepen had, spraken de zeven donderslagen met hun stemmen.", "Openb 20:4": "En ik zag tronen, en zij zaten daarop; en het oordeel werd hun gegeven; en ik zag de zielen van hen die onthoofd waren om de getuigenis van Jezus, en om het Woord van God, en die het beest, en zijn beeld niet aangebeden hadden, en die het merkteken niet ontvangen hadden aan hun voorhoofd en aan hun hand; en zij leefden en heersten als koningen met Christus, de duizend jaar.", "Hebr 3:3": "Want Deze is zoveel meer heerlijkheid waard geacht dan Mozes, zoals degene die het huis gebouwd heeft, meer eer heeft dan het huis.", "Ps 72:16": "Is er een handvol koren in het land op de hoogte van de bergen, de vrucht daarvan zal ruisen als de Libanon; en die van de stad zullen bloeien als het kruid van de aarde.", "Neh 12:19": "En van Jojarib, Matthenai; van Jedaja, Uzzi;", "Hebr 2:5": "Want Hij heeft de toekomende wereld, waar wij van spreken, niet aan de engelen onderworpen.", "Matt 24:31": "En Hij zal Zijn engelen uitzenden met een bazuin van groot geluid, en zij zullen Zijn uitverkorenen bijeenverzamelen uit de vier windstreken, van het ene uiterste van de hemel tot het andere uiterste daarvan.", "Ezech 1:4": "Toen zag ik, en zie, een stormwind kwam van het noorden af, een grote wolk, en een vuur dat zichzelf omvatte, en een glans was rondom die wolk; en uit het midden daarvan was iets als de kleur van amber, uit het midden van het vuur.", "Joh 12:15": "Vrees niet, dochter van Sion, zie, uw Koning komt, zittend op het veulen van een ezelin.", "2 Kron 18:19": "En de HEERE zei: Wie zal Achab, de koning van Israël, overreden, zodat hij optrekt en valt bij Ramoth in Gilead? Daarna zei Hij: Deze zegt het zo, en die zegt het zo.", "Matt 3:9": "En denk niet bij uzelf te zeggen: Wij hebben Abraham als vader; want ik zeg u dat God zelfs uit deze stenen voor Abraham kinderen kan verwekken.", "Jer 1:18": "Want zie, Ik stel u vandaag tot een vaste stad, en tot een ijzeren pilaar, en tot koperen muren tegen het hele land; tegen de koningen van Juda, tegen haar vorsten, tegen haar priesters, en tegen het volk van het land.", "2 Tess 1:7": "En aan u, die verdrukt wordt, verkwikking te geven met ons, bij de openbaring van de Heere Jezus vanuit de hemel met de engelen van Zijn kracht;", "Jer 51:49": "Zoals Babel geweest is tot een val van de verslagenen van Israël, zo zullen te Babel de verslagenen van het hele land vallen.", "Ps 89:5": "Ik zal uw zaad tot in eeuwigheid bevestigen, en uw troon opbouwen van geslacht tot geslacht. Sela.", "Luk 3:17": "Zijn wan is in Zijn hand, en Hij zal Zijn dorsvloer grondig reinigen, en de tarwe zal Hij in Zijn schuur samenbrengen; maar het kaf zal Hij met onblusbaar vuur verbranden.", "Ezech 37:25": "En zij zullen wonen in het land dat Ik Mijn knecht Jakob gegeven heb, waarin uw vaders gewoond hebben; ja, daarin zullen zij wonen, zij en hun kinderen, en hun kindskinderen tot in eeuwigheid, en Mijn Knecht David zal hun Vorst zijn tot in eeuwigheid.", "Jes 40:4-11": "Alle dalen zullen verhoogd worden, en alle bergen en heuvels zullen vernederd worden; en wat krom is, dat zal recht, en wat hobbelig is, dat zal tot een vallei gemaakt worden. En de heerlijkheid van de HEERE zal geopenbaard worden; en alle vlees tegelijk zal zien, dat de mond van de HEERE het gesproken heeft. Een stem zegt: Roept! En hij zegt: Wat zal ik roepen? Alle vlees is gras, en al zijn goedertierenheid als een bloem van het veld.", "Hab 2:14": "Want de aarde zal vervuld worden met de kennis van de heerlijkheid van de HEERE, zoals het water de bodem van de zee bedekt.", "Hand 3:15": "En de Vorst van het leven hebt u gedood, Die God heeft opgewekt uit de doden; waarvan wij getuigen zijn.", "Ps 68:18": "Gods wagens zijn tweemaal tienduizend, de duizenden verdubbeld. De Heere is onder hen, een Sinaï in heiligheid!", "Dan 7:5": "Daarna, zie, het andere dier, het tweede, was gelijk een beer, en het richtte zich op aan de ene zijde, en het had drie ribben in zijn muil tussen zijn tanden; en men zei zo tegen hem: Sta op, eet veel vlees.", "Ef 2:13-22": "Maar nu bent u, die eertijds ver weg was, in Christus Jezus nabij gekomen door het bloed van Christus. Want Hij is onze vrede, Die deze beiden één gemaakt heeft, en de scheidsmuur die tussen ons in stond, afgebroken heeft, doordat Hij de vijandschap in Zijn vlees teniet gemaakt heeft, namelijk de wet van de geboden die in inzettingen bestond; opdat Hij die twee in Zichzelf tot één nieuwe mens zou scheppen, en zo vrede zou maken;", "1 Tim 3:16": "En buiten alle twijfel, de verborgenheid van de godsvrucht is groot: God is geopenbaard in het vlees, gerechtvaardigd in de Geest, gezien door de engelen, gepredikt onder de heidenen, geloofd in de wereld, opgenomen in heerlijkheid.", "Ps 72:1-20": "Voor Salomo. O God! Geef de koning Uw rechten, en Uw gerechtigheid de zoon van de koning. Zo zal hij Uw volk richten met gerechtigheid, en Uw ellendigen met recht. De bergen zullen aan het volk vrede dragen, ook de heuvels, met gerechtigheid.", "Zach 3:7": "Zo zegt de HEERE van de heerscharen: Als u in Mijn wegen wandelt, en als u Mijn wacht waarneemt, dan zult u ook Mijn huis richten, en ook Mijn voorhoven bewaren; en Ik zal u wandelingen geven onder dezen, die hier staan.", "Jes 46:13": "Ik breng Mijn gerechtigheid nabij, zij zal niet ver weg zijn, en Mijn heil zal niet uitblijven; maar Ik zal heil geven in Sion, aan Israël Mijn heerlijkheid.", "1 Petr 3:22": "Die aan de rechterhand van God is, opgevaren naar de hemel, terwijl de engelen, en machten, en krachten Hem onderdanig zijn gemaakt.", "Ps 69:37": "En het zaad van Zijn dienaars zal haar beërven; en de liefhebbers van Zijn Naam zullen daarin wonen.", "Gen 49:10": "De scepter zal van Juda niet wijken, evenmin de wetgever van tussen zijn voeten, totdat Silo komt, en Hem zullen de volken gehoorzaam zijn.", "Job 1:7": "Toen zei de HEERE tegen de satan: Waar komt u vandaan? En de satan antwoordde de HEERE en zei: Van het rondtrekken op de aarde, en van het doorwandelen ervan.", "Zach 4:2": "En Hij zei tegen mij: Wat ziet u? En ik zei: Ik zie, en zie, een geheel gouden kandelaar, en een oliekruikje boven op zijn hoofd, en zijn zeven lampen daarop; die lampen hadden zeven en zeven pijpen, die boven op zijn hoofd waren;", "Gen 22:18": "En in uw nageslacht zullen alle volken van de aarde gezegend worden, omdat u Mijn stem gehoorzaam bent geweest.", "Ex 12:14": "En deze dag zal voor u een gedachtenis zijn, en u zult hem als een feest voor de HEERE vieren; u zult hem vieren onder uw geslachten, als een eeuwige inzetting.", "Hagg 1:14": "En de HEERE wekte de geest op van Zerubbabel, de zoon van Sealthiël, de vorst van Juda, en de geest van Josua, de zoon van Jozadak, de hogepriester, en de geest van heel het overblijfsel van het volk; en zij kwamen en gingen aan het werk in het huis van de HEERE van de heerscharen, hun God,", "Dan 7:3-7": "En er klommen vier grote dieren op uit de zee, het ene verschillend van het andere. Het eerste was als een leeuw, en het had arendsvleugels; ik keek toe, totdat zijn vleugels uitgeplukt werden, en het werd van de aarde opgeheven, en op de voeten gezet, als een mens, en aan hem werd een mensenhart gegeven. Daarna, zie, het andere dier, het tweede, was gelijk een beer, en het richtte zich op aan de ene zijde, en het had drie ribben in zijn muil tussen zijn tanden; en men zei zo tegen hem: Sta op, eet veel vlees.", "Hebr 7:4": "Merk nu op, hoe groot deze geweest is, aan wie zelfs Abraham, de patriarch, tienden gegeven heeft uit de buit.", "Zef 3:9": "Zeker, dan zal Ik tot de volken een reine spraak wenden; opdat zij allen de Naam van de HEERE aanroepen, opdat zij Hem dienen met één schouder³.", "Matt 2:2": "Zij zeiden: Waar is de geboren Koning van de Joden? Want wij hebben Zijn ster gezien in het Oosten, en zijn gekomen om Hem te aanbidden.", "Luk 23:42": "En hij zei tegen Jezus: Heere, denk aan mij, wanneer U in Uw Koninkrijk gekomen bent.", "Fil 2:10": "Opdat in de Naam van Jezus zich zou buigen elke knie van hen die in de hemel, en die op de aarde, en die onder de aarde zijn.", "Joël 2:29": "Ja, ook over de dienstknechten, en over de dienstmaagden, zal Ik in die dagen Mijn Geest uitgieten.", "Ps 72:19": "En geloofd zij de Naam van Zijn heerlijkheid tot in eeuwigheid; en de hele aarde moet met Zijn heerlijkheid vervuld worden. Amen, ja, amen.", "Ps 72:11": "Ja, alle koningen zullen zich voor hem neerbuigen, alle heidenvolken zullen hem dienen.", "Kol 2:10": "En u bent in Hem volmaakt, Die het Hoofd is van alle overheid en macht;", "Zach 1:10": "Toen antwoordde de Man Die tussen de mirten stond, en zei: Deze zijn het die de HEERE uitgezonden heeft om het land te doorwandelen.", "Dan 7:18": "Maar de heiligen van de hoge plaatsen zullen dat Koninkrijk ontvangen, en zij zullen het Rijk bezitten tot in eeuwigheid, ja, tot in eeuwigheid der eeuwigheden.", "Ex 29:6": "En u zult de hoed op zijn hoofd zetten; de kroon van heiligheid zult u aan de hoed zetten.", "Job 34:29": "Als Hij stilt, wie zal dan beroeren? Als Hij het aangezicht verbergt, wie zal Hem dan aanschouwen, zowel voor een volk, als voor een mens alleen?", "Zach 3:8": "Hoor nu toe, Jozua, u hogepriester! U en uw vrienden, die voor uw aangezicht zitten, want zij zijn een wonderteken; want zie, Ik zal Mijn Knecht, de SPRUITE, doen komen.", "Hos 3:5": "Daarna zullen de kinderen van Israël zich bekeren, en de Heere, hun God, zoeken, en David, hun Koning; en zij zullen vol ontzag komen tot de Heere en tot Zijn goedheid, in de laatste dagen.", "Jes 54:1-17": "Zing vrolijk, u onvruchtbare, die niet gebaard hebt! Maak geschal met vrolijk gezang, en juich, die geen barensnood gehad hebt! Want de kinderen van de eenzame zijn meer dan de kinderen van de getrouwde, zegt de HEERE. Maak de plaats van uw tenten wijd, en laat men de gordijnen van uw woningen uitbreiden, verhinder het niet; maak uw koorden lang, en steek uw pinnen vast in. Want u zult uitbreken ter rechter hand en ter linkerhand; en uw nageslacht zal de heidenen erven, en zij zullen de verwoeste steden doen bewonen.", "Jes 55:1-13": "O, alle dorstigen, kom tot de wateren, en u die geen geld heeft, kom, koop en eet, ja kom, koop zonder geld en zonder prijs, wijn en melk! Waarom weegt u geld uit voor wat geen brood is, en uw arbeid voor wat niet verzadigen kan? Hoor aandachtig naar Mij, en eet het goede, en laat uw ziel zich verlustigen in vettigheid. Neig uw oor, en kom tot Mij, hoor en uw ziel zal leven; want Ik zal met u een eeuwig verbond maken, en u geven de zekere weldaden van David.", "Jes 52:7": "Hoe lieflijk zijn op de bergen de voeten van hem die het goede nieuws brengt, die de vrede laat horen; van hem die goed nieuws brengt van het goede, die heil laat horen; van hem die tegen Sion zegt: Uw God is Koning.", "Openb 19:11-21": "En ik zag de hemel geopend; en zie, een wit paard, en Die daarop zat, werd genoemd Getrouw en Waarachtig, en Hij oordeelt en voert krijg in gerechtigheid. En Zijn ogen waren als een vlam van het vuur, en op Zijn hoofd waren veel koninklijke hoeden; en Hij had een naam geschreven, die niemand wist, dan Hij Zelf. En Hij was bekleed met een kleed, dat met bloed geverfd was; en Zijn naam wordt genoemd het Woord van God.", "Jes 60:3-5": "En de heidenen zullen naar uw licht gaan, en koningen naar de glans die over u is opgegaan. Hef uw ogen rondom op, en zie: die allen zijn samengebracht, zij komen tot u; uw zonen zullen van verre komen, en uw dochters zullen aan uw zijde grootgebracht worden. Dan zult u het zien en stralen, en uw hart zal vervaard zijn en verwijd worden; want de menigte van de zee zal tot u gekeerd worden, het leger van de heidenen zal tot u komen.", "Dan 4:13": "Ik zag verder in de visioenen van mijn hoofd, op mijn bed; en zie, een wachter, namelijk een heilige, kwam neer uit de hemel,", "Openb 6:8": "En ik zag, en zie, een vaal paard, en die daarop zat, zijn naam was de dood; en de hel volgde hem na. En hun werd macht gegeven om te doden tot het vierde deel van de aarde, met zwaard, en met honger, en met de dood, en door de wilde beesten van de aarde.", "Ezra 5:2": "Toen maakten Zerubbabel, de zoon van Sealthiël, en Jesua, de zoon van Jozadak, zich op en begonnen het huis van God te bouwen, Dat te Jeruzalem woont; en met hen de profeten van God, die hen ondersteunden.", "2 Petr 1:5-10": "En span daarom ook alle inspanning in om, naast uw geloof, ook deugd te voegen, en naast de deugd kennis, En naast de kennis matigheid, en naast de matigheid volharding, en naast de volharding godsvrucht, En naast de godsvrucht broederlijke liefde, en naast de broederlijke liefde, liefde jegens allen.", "1 Tim 6:16": "Die als enige onsterfelijkheid heeft, en een ontoegankelijk licht bewoont; aan Wie geen mens gezien heeft, en ook niet zien kan; aan Wie eer en eeuwige kracht zij. Amen.", "Jer 33:17": "Want zo zegt de HEERE: Aan David zal het nooit ontbreken aan een Man, Die op de troon van het huis van Israël zit.", "Zach 1:12-14": "Toen antwoordde de Engel van de HEERE, en zei: HEERE van de heerscharen! Hoelang zult U Zich niet ontfermen over Jeruzalem en over de steden van Juda, op wie U toornig geweest bent, deze zeventig jaren? En de HEERE antwoordde de Engel Die met mij sprak, met goede woorden, troostvolle woorden. En de Engel Die met mij sprak, zei tegen mij: Roep uit en zeg: Zo zegt de HEERE van de heerscharen: Ik ijver over Jeruzalem en over Sion met een grote ijver.", "Ps 18:44": "U hebt mij uitgeholpen van de twisten van het volk; U hebt mij gesteld tot een hoofd van de heidenen; het volk dat ik niet kende, heeft mij gediend.", "Ps 72:17": "Zijn naam zal zijn tot in eeuwigheid; zolang als er de zon is, zal zijn naam van kind tot kind voortgeplant worden; en zij zullen in hem gezegend worden; alle heidenvolken zullen hem gelukkig noemen.", "Jes 48:4": "Omdat Ik wist, dat u hard bent, en uw nek een ijzeren zenuw is, en uw voorhoofd koper;", "Jes 4:6": "En daar zal een hut zijn tot een schaduw overdag tegen de hitte, en tot een toevlucht, en tot een schuilplaats tegen de vloed en tegen de regen.", "Zach 14:21": "Ja, al de potten in Jeruzalem en in Juda zullen de HEERE van de heerscharen heilig zijn, zodat allen die willen offeren, zullen komen, en daarvan nemen, en daarin koken; en er zal geen Kanaäniet meer zijn in het huis van de HEERE van de heerscharen, op die dag.", "Rom 9:5": "van wie de vaders zijn, en uit wie Christus is, wat het vlees aangaat, Hij Die God is, boven allen te prijzen tot in eeuwigheid. Amen.", "Ezech 16:63": "opdat u eraan denkt, en zich schaamt, en niet meer uw mond opendoet vanwege uw schande, wanneer Ik verzoening voor u zal doen over alles wat u gedaan hebt, spreekt de Heere HEERE.", "Zach 13:7": "Zwaard! Word wakker tegen Mijn Herder, en tegen de Man Die Mijn Metgezel is, spreekt de HEERE van de heerscharen; sla die Herder, en de schapen zullen verstrooid worden; maar Ik zal Mijn hand tot de kleinen wenden.", "Jes 46:11": "Die een roofvogel roept van het oosten, een man van Mijn raad uit een ver land; ja, Ik heb het gesproken, Ik zal het ook doen komen; Ik heb het geformeerd, Ik zal het ook doen.", "Ps 69:36": "Want God zal Sion verlossen, en de steden van Juda bouwen; en daar zullen zij wonen, en haar erfelijk bezitten;", "Openb 5:9-13": "En zij zongen een nieuw lied: U bent waard dat boek te nemen en zijn zegels te openen; want U bent geslacht, en hebt ons voor God gekocht met Uw bloed, uit elk geslacht, en taal, en volk, en natie; en U hebt ons voor onze God gemaakt tot koningen en priesters; en wij zullen als koningen heersen op de aarde. En ik zag, en ik hoorde een stem van veel engelen rondom de troon, en van de dieren, en van de oudsten; en hun aantal was tienduizend maal tienduizend, en duizend maal duizend;", "Matt 13:41": "De Zoon des mensen zal Zijn engelen uitzenden, en zij zullen uit Zijn Koninkrijk verzamelen alles wat tot zonde verleidt, en degenen die de ongerechtigheid doen;", "Openb 7:10": "En zij riepen met luide stem: De zaligheid is van onze God, Die op de troon zit, en van het Lam.", "Lev 8:9": "En hij zette de hoed op zijn hoofd; en aan de hoed, boven zijn gezicht, zette hij de gouden plaat, de kroon van de heiligheid, zoals de HEERE Mozes geboden had.", "Rom 5:1": "Wij dan, gerechtvaardigd zijnde uit het geloof, hebben vrede bij God, door onze Heere Jezus Christus;", "1 Kor 15:23-28": "Maar ieder in zijn eigen orde: de eersteling Christus, daarna zij die van Christus zijn, bij Zijn komst. Daarna zal het einde zijn, wanneer Hij het Koninkrijk aan God en de Vader zal hebben overgegeven; wanneer Hij alle heerschappij, alle macht en kracht zal hebben tenietgedaan. Want Hij moet als Koning heersen, totdat Hij alle vijanden onder Zijn voeten zal hebben gelegd.", "Jes 45:22-24": "Wend u naar Mij toe, word behouden, alle einden van de aarde! Want Ik ben God, en niemand meer. Ik heb bij Mijzelf gezworen, er is een woord van gerechtigheid uit Mijn mond gegaan, en het zal niet terugkeren: dat voor Mij alle knie zich zal buigen, alle tong Mij zal zweren. Men zal van Mij zeggen: Zeker, in de HEERE zijn gerechtigheden en sterkte; tot Hem zal men komen; maar zij zullen allen beschaamd worden die tegen Hem in woede ontstoken zijn.", "1 Tim 6:15": "die op Zijn tijd zal laten zien de gelukkige en enige machtige Heerser, de Koning der koningen en Heere der heren;", "Zach 14:9": "En de HEERE zal Koning zijn over de hele aarde; op die dag zal de HEERE één zijn, en Zijn Naam één.", "Jes 51:22": "Zo zegt de Heere, de HEERE en uw God, Die de zaak van Zijn volk twisten zal: Zie, Ik neem de beker van de zwijmeling van uw hand, de droesem van de beker van Mijn grimmigheid; u zult die voortaan niet meer drinken.", "Ps 118:24": "Dit is de dag, die de HEERE gemaakt heeft; laten we ons daarover verheugen, en verblijd zijn.", "2 Kon 6:17": "En Elisa bad, en zei: HEERE, open toch zijn ogen, dat hij ziet! En de HEERE opende de ogen van de knecht, dat hij zag; en zie, de berg was vol vurige paarden en wagens rondom Elisa.", "Ps 72:5": "Zij zullen U vrezen, zolang de zon en maan er zijn, van geslacht tot geslacht.", "Pred 10:4": "Als de geest van de heerser tegen u oprijst, verlaat uw plaats niet; want het is medicijn, het stilt grote zonden.", "Luk 13:30": "En zie, er zijn laatsten die de eersten zullen zijn, en er zijn eersten die de laatsten zullen zijn.", "Zach 4:14": "Toen zei Hij: Deze zijn de twee olietakken, die voor de Heere van de hele aarde staan.", "Zach 1:16": "Daarom zegt de HEERE zo: Ik ben tot Jeruzalem teruggekeerd met ontfermingen; Mijn huis zal daarin gebouwd worden, spreekt de HEERE van de heerscharen, en het meetlint zal over Jeruzalem uitgespannen worden.", "Job 1:6": "Er was nu een dag, dat de kinderen van God kwamen om zich voor de HEERE te stellen, dat de satan ook in hun midden kwam.", "Dan 8:23": "Maar op het laatst van hun koninkrijk, wanneer de afvalligen het toppunt bereikt hebben, zal er een koning opstaan, hard van gezicht, en bedreven in het uitleggen van raadsels;", "Kol 1:18-20": "en Hij is het Hoofd van het lichaam, namelijk van de Gemeente, Hij, Die het Begin is, de Eerstgeborene uit de doden, opdat Hij in alles de Eerste zou zijn. Want het is het welbehagen van de Vader geweest, dat in Hem heel de volheid wonen zou; en dat Hij, door Hem vrede gemaakt te hebben door het bloed van Zijn kruis, door Hem, zeg ik, alle dingen met Zichzelf verzoenen zou, hetzij de dingen die op de aarde, hetzij de dingen die in de hemelen zijn.", "Micha 5:4": "En Deze zal Vrede zijn; wanneer Assur in ons land zal komen, en wanneer hij in onze paleizen zal treden, dan zullen wij tegen hem zeven herders opstellen, en acht vorsten uit de mensen.", "Joh 12:31": "Nu is het oordeel over deze wereld; nu zal de leider van deze wereld buitengeworpen worden.", "Micha 5:1-14": "En u, Bethlehem Efratha, bent u klein om te zijn onder de duizenden van Juda? Uit u zal Mij Iemand voortkomen, Die een Heerser zal zijn in Israël, en Wiens uitgangen zijn van oudsher, van de dagen van de eeuwigheid. Daarom zal Hij hen overgeven, tot de tijd toe dat zij, die baren zal, gebaard heeft; dan zullen de overigen van Zijn broeders zich bekeren met de kinderen van Israël. En Hij zal staan, en zal weiden in de kracht van de HEERE, in de hoogheid van de Naam van de HEERE, Zijn God, en zij zullen wonen, want nu zal Hij groot zijn tot aan de einden van de aarde.", "Hebr 2:8": "Alle dingen hebt U onder zijn voeten onderworpen. Want doordat Hij hem alle dingen onderworpen heeft, heeft Hij niets overgelaten dat hem niet onderworpen is; maar nu zien wij nog niet dat hem alle dingen onderworpen zijn;", "Hebr 1:13": "En tegen wie van de engelen heeft Hij ooit gezegd: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gezet heb?", "Fil 2:9-11": "Daarom heeft God Hem ook uitermate verhoogd, en heeft Hem een Naam gegeven, die boven alle naam is; Opdat in de Naam van Jezus zich zou buigen elke knie van hen die in de hemel, en die op de aarde, en die onder de aarde zijn. En elke tong zou belijden dat Jezus Christus de Heere is, tot heerlijkheid van God de Vader.", "Jes 51:23": "Maar Ik zal hem, die u bedroefd hebben, in de hand geven, die tegen uw ziel zeiden: Buig u neer, dat wij over u heen gaan; en u legde uw rug neer als aarde, en als een straat van hen die daarover gaan.", "Ps 110:1": "Een psalm van David. De HEERE heeft tot mijn Heere gesproken: Zit aan Mijn rechterhand, totdat Ik Uw vijanden gezet zal hebben tot een voetbank van Uw voeten.", "Openb 5:13": "En elk schepsel dat in de hemel is, en op de aarde, en onder de aarde, en die in de zee zijn, en alles wat daarin is, hoorde ik zeggen: Hem Die op de troon zit, en het Lam, zij de dankzegging, en de eer, en de heerlijkheid, en de kracht, tot in alle eeuwigheid.", "Hand 4:28": "Om te doen alles wat Uw hand en Uw raad van tevoren bepaald hadden dat zou gebeuren.", "Zach 4:8-10": "Het woord van de HEERE kwam verder tot mij: De handen van Zerubbabel hebben dit huis gegrondvest, zijn handen zullen het ook voltooien; opdat u weet dat de HEERE van de heerscharen mij tot u gezonden heeft. Want wie veracht de dag van de kleine dingen? Toch zullen die zeven zich verblijden, als zij het tinnen gewicht zullen zien in de hand van Zerubbabel; dat zijn de ogen van de HEERE, die het hele land doorkruisen.", "Matt 13:42": "En zij zullen hen in de vurige oven werpen; daar zal geween zijn en het geknars van de tanden.", "Kol 1:16": "Want door Hem zijn alle dingen geschapen, die in de hemelen en die op de aarde zijn, die zienlijk en die onzienlijk zijn, hetzij tronen, hetzij heerschappijen, hetzij overheden, hetzij machten; alle dingen zijn door Hem en tot Hem geschapen;", "Jes 32:1-20": "Zie, een koning zal regeren in gerechtigheid, en de vorsten zullen heersen naar recht. En die man zal zijn als een schuilplaats tegen de wind, en een schuilplaats tegen de storm, als waterbeken in een dorre plaats, als de schaduw van een zware rotssteen in een dorstig land. En de ogen van hen die zien, zullen niet terugzien, en de oren van hen die horen, zullen opmerken.", "Openb 19:11-16": "En ik zag de hemel geopend; en zie, een wit paard, en Die daarop zat, werd genoemd Getrouw en Waarachtig, en Hij oordeelt en voert krijg in gerechtigheid. En Zijn ogen waren als een vlam van het vuur, en op Zijn hoofd waren veel koninklijke hoeden; en Hij had een naam geschreven, die niemand wist, dan Hij Zelf. En Hij was bekleed met een kleed, dat met bloed geverfd was; en Zijn naam wordt genoemd het Woord van God.", "Hand 24:17": "Maar na vele jaren ben ik gekomen om aalmoezen te brengen aan mijn volk, en offeranden.", "Zach 6:1-8": "En ik hief mijn ogen weer op, en ik zag; en zie, vier wagens gingen er uit van tussen twee bergen, en die bergen waren bergen van koper. Aan de eerste wagen waren rode paarden; en aan de tweede wagen waren zwarte paarden. En aan de derde wagen witte paarden; en aan de vierde wagen hagelvlekkige paarden, die sterk waren.", "Ps 45:4-8": "Gord Uw zwaard aan de heup, o Held! Uw Majesteit en Uw heerlijkheid. En rijd voorspoedig in Uw heerlijkheid, op het woord van de waarheid en rechtvaardige zachtmoedigheid; en Uw rechterhand zal U ontzagwekkende dingen leren. Uw pijlen zijn scherp; volken zullen onder U vallen; zij treffen in het hart van de vijanden van de Koning.", "Ps 103:21": "Loof de HEERE, al Zijn heerscharen! U Zijn dienaars, die Zijn welbehagen doet!", "Jes 6:5-7": "Toen zei ik: Wee mij, want ik ga ten onder! Omdat ik een man van onreine lippen ben, en ik woon te midden van een volk dat onrein van lippen is; want mijn ogen hebben de Koning, de HEERE van de heerscharen, gezien. Maar een van de serafs vloog naar mij toe, en had een gloeiende kool in zijn hand, die hij met de tang van het altaar genomen had. En hij raakte daarmee mijn mond aan, en zei: Zie, dit heeft uw lippen aangeraakt; zo is uw misdaad van u geweken, en uw zonde is verzoend.", "Ps 132:15-17": "Ik zal haar voedsel rijkelijk zegenen, haar behoeftigen zal Ik met brood verzadigen. En haar priesters zal Ik met heil bekleden, en haar gunstgenoten zullen zeer juichen. Daar zal Ik David een hoorn doen uitspruiten; Ik heb voor Mijn Gezalfde een lamp klaargemaakt.", "Jes 4:5": "En de HEERE zal over elke woning van de berg Sion, en over haar samenkomsten, een wolk scheppen overdag, en rook, en de glans van een vlammend vuur 's nachts; want over alles wat heerlijk is, zal een beschutting zijn.", "Jes 24:16": "Van het uiterste einde van de aarde horen wij psalmen, tot verheerlijking van de Rechtvaardige. Maar nu zeg ik: Ik word mager, ik word mager, wee mij! De trouwelozen handelen trouweloos, en met trouweloosheid handelen de trouwelozen trouweloos.", "Gen 12:5": "En Abram nam Sarai, zijn vrouw, en Lot, de zoon van zijn broer, en al hun bezit dat zij verworven hadden, en de mensen die zij verkregen hadden in Haran; en zij vertrokken om naar het land Kanaän te gaan, en zij kwamen in het land Kanaän aan.", "Jes 60:1": "Maak u op, word verlicht, want uw licht komt, en de heerlijkheid van de HEERE gaat over u op.", "Lev 16:15": "Daarna zal hij de bok van het zondoffer, die voor het volk zal zijn, slachten, en zal zijn bloed tot binnen het voorhangsel dragen, en zal met zijn bloed doen zoals hij met het bloed van de stier gedaan heeft, en zal het sprenkelen op het verzoendeksel, en voor het verzoendeksel.", "Hebr 8:3": "Want ieder hogepriester wordt aangesteld om gaven en offers te offeren; daarom was het noodzakelijk dat ook Deze iets had, dat Hij zou offeren.", "Matt 21:5": "Zeg tegen de dochter van Sion: Zie, uw Koning komt naar u toe, zachtmoedig en gezeten op een ezelin, en een veulen, het jong van een lastdier.", "Ps 104:4": "Hij maakt Zijn engelen geesten, Zijn dienaars tot een vlammend vuur.", "Hand 9:15": "Maar de Heere zei tegen hem: Ga heen; want deze man is Mij een uitverkoren instrument om Mijn Naam te dragen voor de heidenen, en de koningen, en de kinderen van Israël.", "Jes 59:19-21": "Dan zullen zij de Naam van de HEERE vrezen vanaf de neergang, en Zijn heerlijkheid vanaf de opgang van de zon; als de vijand zal komen als een stroom, zal de Geest van de HEERE de banier tegen hem oprichten. En er zal een Verlosser tot Sion komen, namelijk voor hen die zich bekeren van de overtreding in Jakob, spreekt de HEERE. Wat Mij aangaat, dit is Mijn Verbond met hen, zegt de HEERE: Mijn Geest, Die op u is, en Mijn woorden, die Ik in uw mond gelegd heb, die zullen van uw mond niet wijken, ook niet van de mond van uw zaad, ook niet van de mond van het zaad van uw zaad, zegt de HEERE, van nu af tot in eeuwigheid toe.", "Dan 11:9": "Zo zal de koning van het Zuiden in het koninkrijk komen, en hij zal weer naar zijn land trekken.", "Ps 102:16": "Dan zullen de heidenen de Naam van de HEERE vrez
