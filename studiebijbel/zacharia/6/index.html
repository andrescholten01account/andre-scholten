e hemel, die uitgaan van waar zij stonden voor de Heere van de hele aarde.", "6": "Aan welke wagen de zwarte paarden zijn, die gaan uit naar het Noorderland; en de witte gaan uit, dezelve achterna; en de hagelvlekkige gaan uit naar het Zuiderland.", "7": "En die sterke paarden gingen uit, en zochten voort te gaan, om het land te doorwandelen; want Hij had gezegd: Ga heen, doorwandel het land. En zij doorwandelden het land.", "8": "En Hij riep mij, en sprak tegen mij, en zei: Zie, deze, die uitgegaan zijn naar het Noorderland, hebben Mijn Geest doen rusten in het Noorderland.", "9": "En het woord van de HEERE kwam tot mij, en zei:", "10": "Neem van de gevankelijk weggevoerden, van Cheldai, van Tobia, en van Jedaja, en kom u op die dag, en ga het huis binnen van Josia, de zoon van Zefanja, die uit Babel gekomen zijn;", "11": "Namelijk, neem zilver en goud, en maak kronen; en zet ze op het hoofd van Jozua, de zoon van Jozadak, de hogepriester.", "12": "En spreek tegen hem, en zeg: Zo spreekt de HEERE van de heerscharen[1]: Zie, een Man, Wiens naam is SPRUIT, Die zal uit Zijn plaats opgroeien, en Hij zal de tempel van de HEERE bouwen.", "13": "Ja, Hij zal de tempel van de HEERE bouwen, en Hij zal het sieraad dragen, en Hij zal zitten, en heersen op Zijn troon; en Hij zal priester zijn op Zijn troon; en de raad van vrede zal tussen die Beiden zijn.", "14": "En die kronen zullen zijn voor Chelem, en voor Tobia, en voor Jedaja, en voor Chen, de zoon van Zefanja, tot een gedachtenis in de tempel van de HEERE.", "15": "En zij die ver weg zijn, zullen komen, en zullen bouwen in de tempel van de HEERE, en u zult weten, dat de HEERE van de heerscharen mij tot u gezonden heeft. Dit zal gebeuren, als u vlijtig zult horen naar de stem van de HEERE, van uw God."}, "SV": {"1": "En ik hief mijn ogen weder op, en ik zag; en ziet, vier wangens gingen er uit van tussen twee bergen, en die bergen waren bergen van koper.", "2": "Aan den eersten wagen waren rode paarden; en aan den tweeden wagen waren zwarte paarden.", "3": "En aan den derden wagen witte paarden; en aan den vierden wagen hagelvlekkige paarden, die sterk waren.", "4": "En ik antwoordde, en zeide tot den Engel, Die met mij sprak: Wat zijn deze, mijn Heere?", "5": "En de Engel antwoordde, en zeide tot mij: Deze zijn de vier winden des hemels, uitgaande van daar zij stonden voor den Heere der ganse aarde.", "6": "Aan welken *wagen* de zwarte paarden zijn, *die* *paarden* gaan uit naar het Noorderland; en de witte gaan uit, dezelve achterna; en de hagelvlekkige gaan uit naar het Zuiderland.", "7": "En die sterke *paarden* gingen uit, en zochten voort te gaan, om het land te doorwandelen; want Hij had gezegd: Gaat heen, doorwandelt het land. En zij doorwandelden het land.", "8": "En Hij riep mij, en sprak tot mij, zeggende: Zie, deze, die uitgegaan zijn naar het Noorderland, hebben Mijn Geest doen rusten in het Noorderland.", "9": "En des HEEREN woord geschiedde tot mij, zeggende:", "10": "Neem van de gevankelijk weggevoerden van Cheldai, van Tobia, en van Jedaja, en kom gij te dien dage, en ga in ten huize van Josia, den zoon van Zefanja, dewelke uit Babel gekomen zijn;", "11": "Te weten, neem zilver en goud, en maak kronen; en zet ze op het hoofd van Josua, den zoon van Jozadak, den hogepriester.", "12": "En spreek tot hem, zeggende: Alzo spreekt de HEERE der heirscharen, zeggende: Ziet, een Man, Wiens naam is SPRUITE, Die zal uit Zijn plaats spruiten, en Hij zal des HEEREN tempel bouwen.", "13": "Ja, Hij zal den tempel des HEEREN bouwen, en Hij zal het sieraad dragen, en Hij zal zitten, en heersen op Zijn troon; en Hij zal priester zijn op Zijn troon; en de raad des vredes zal tussen die Beiden wezen.", "14": "En die kronen zullen wezen voor Chelem, en voor Tobia, en voor Jedaja, en voor Chen, den zoon van Zefanja, tot een gedachtenis in den tempel des HEEREN.", "15": "En die verre zijn, zullen komen, en zullen bouwen in den tempel des HEEREN, en gijlieden zult weten, dat de HEERE der heirscharen mij tot u gezonden heeft. Dit zal geschieden, indien gij vlijtiglijk zult horen naar de stem des HEEREN, uws Gods."}, "KJV": {"1": "And I turned, and lifted up mine eyes, and looked, and, behold, there came four chariots out from between two mountains; and the mountains *were* mountains of brass.", "2": "In the first chariot *were* red horses; and in the second chariot black horses;", "3": "And in the third chariot white horses; and in the fourth chariot grisled and bay horses.", "4": "Then I answered and said unto the angel that talked with me, What *are* these, my lord?", "5": "And the angel answered and said unto me, These *are* the four spirits of the heavens, which go forth from standing before the Lord of all the earth.", "6": "The black horses which *are* therein go forth into the north country; and the white go forth after them; and the grisled go forth toward the south country.", "7": "And the bay went forth, and sought to go that they might walk to and fro through the earth: and he said, Get you hence, walk to and fro through the earth. So they walked to and fro through the earth.", "8": "Then cried he upon me, and spake unto me, saying, Behold, these that go toward the north country have quieted my spirit in the north country.", "9": "And the word of the LORD came unto me, saying,", "10": "Take of *them of* the captivity, *even* of Heldai, of Tobijah, and of Jedaiah, which are come from Babylon, and come thou the same day, and go into the house of Josiah the son of Zephaniah;", "11": "Then take silver and gold, and make crowns, and set *them* upon the head of Joshua the son of Josedech, the high priest;", "12": "And speak unto him, saying, Thus speaketh the LORD of hosts, saying, Behold the man whose name *is* The BRANCH; and he shall grow up out of his place, and he shall build the temple of the LORD:", "13": "Even he shall build the temple of the LORD; and he shall bear the glory, and shall sit and rule upon his throne; and he shall be a priest upon his throne: and the counsel of peace shall be between them both.", "14": "And the crowns shall be to Helem, and to Tobijah, and to Jedaiah, and to Hen the son of Zephaniah, for a memorial in the temple of the LORD.", "15": "And they *that are* far off shall come and build in the temple of the LORD, and ye shall know that the LORD of hosts hath sent me unto you. And *this* shall come to pass, if ye will diligently obey the voice of the LORD your God."}}, "tsk": {"1": [{"kopje": "ik hief", "refs": ["Zach 5:1"]}, {"kopje": "vier", "refs": ["Zach 1:18", "Zach 1:19", "Dan 2:38-40", "Dan 7:3-7", "Dan 8:22"]}, {"kopje": "en die", "refs": ["1 Sam 2:8", "Job 34:29", "Ps 33:11", "Ps 36:7", "Spr 21:30", "Jes 14:26", "Jes 14:27", "Jes 43:13", "Jes 46:10", "Jes 46:11", "Dan 4:15", "Dan 4:35", "Hand 4:28", "Ef 1:11", "Ef 3:11"]}], "2": [{"kopje": "rode", "refs": ["Zach 1:8", "Openb 6:2-5", "Openb 12:3", "Openb 17:3"]}, {"kopje": "zwarte", "refs": ["Zach 6:6", "Openb 6:5", "Openb 6:6"]}], "3": [{"kopje": "witte", "refs": ["Openb 6:2", "Openb 19:11", "Openb 20:11"]}, {"kopje": "hagelvlekkige", "refs": ["Zach 6:6", "Zach 6:7", "Zach 1:8", "Dan 2:33", "Dan 2:40", "Dan 2:41", "Openb 6:8"]}], "4": [{"kopje": "tegen", "refs": ["Zach 1:9", "Zach 1:19-21", "Zach 5:5", "Zach 5:6", "Zach 5:10"]}], "5": [{"kopje": "Deze", "refs": ["Zach 1:10", "Zach 1:11", "Ps 68:18", "Ps 104:3", "Ps 104:4", "Ezech 1:5-28", "Ezech 10:9-19", "Ezech 11:22", "Hebr 1:7", "Hebr 1:14", "Openb 14:6-13"]}, {"kopje": "winden", "refs": ["1 Kon 19:11", "Ps 148:8", "Dan 7:2"]}, {"kopje": "uitgaan", "refs": ["Zach 4:10", "1 Kon 22:19", "2 Kron 18:18", "2 Kron 18:19", "Job 1:6", "Job 2:1", "Job 2:2", "Dan 7:10", "Matt 18:10", "Luk 1:19"]}, {"kopje": "de Heere", "refs": ["Zach 4:14", "Jes 54:5"]}], "6": [{"kopje": "het Noorderland", "refs": ["Jer 1:14", "Jer 1:15", "Jer 4:6", "Jer 6:1", "Jer 25:9", "Jer 46:10", "Jer 51:48", "Ezech 1:4"]}, {"kopje": "gaan uit, dezelve achterna", "refs": ["Dan 7:5", "Dan 7:6", "Dan 1 : "../../openbaring/11/#v15", "ref": "Openb 11:15", "svLabel": null}, {"disp": "Openb 12:10", "href": "../../openbaring/12/#v10", "ref": "Openb 12:10", "svLabel": null}, {"disp": "Openb 14:6", "href": "../../openbaring/14/#v6", "ref": "Openb 14:6", "svLabel": null}, {"disp": "Openb 15:4", "href": "../../openbaring/15/#v4", "ref": "Openb 15:4", "svLabel": null}, {"disp": "Openb 17:14", "href": "../../openbaring/17/#v14", "ref": "Openb 17:14", "svLabel": null}, {"disp": "Openb 19:6", "href": "../../openbaring/19/#v6", "ref": "Openb 19:6", "svLabel": null}, {"disp": "Openb 19:11-21", "href": "../../openbaring/19/#v11", "ref": "Openb 19:11-21", "svLabel": null}, {"disp": "Openb 20:1-3", "href": "../../openbaring/20/#v1", "ref": "Openb 20:1-3", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"Dan 9:25-27": "Weet dan, en versta: van het uitgaan van het woord om te doen terugkeren en om Jeruzalem te bouwen, tot op de Messias, de Vorst, zijn zeven weken, en tweeënzestig weken; de straten en de grachten zullen weer gebouwd worden, maar in benauwdheid van de tijden. En na die tweeënzestig weken zal de Messias uitgeroeid worden, maar het zal niet voor Hemzelf zijn; en een volk van de vorst die komen zal, zal de stad en het heiligdom verderven, en zijn einde zal zijn met een overstromende vloed, en tot het einde toe zal er oorlog zijn, en vast besloten verwoestingen. En hij zal voor velen het verbond versterken, één week; en in de helft van de week zal hij het slachtoffer en het spijsoffer doen ophouden, en over de gruwelijke vleugel zal een verwoester zijn, ook tot de voleinding toe, die vast besloten is, zal uitgestort worden over de verwoeste.", "Ps 132:18": "Ik zal zijn vijanden met schaamte bekleden; maar op hem zal zijn kroon bloeien.", "Jes 49:6": "Verder zei Hij: Het is te gering, dat U Mij een Knecht zou zijn, om op te richten de stammen van Jakob, en om terug te brengen de bewaarden in Israël; Ik heb U ook gegeven tot een Licht van de heidenen, om Mijn heil te zijn tot aan het einde van de aarde.", "Jes 49:1": "Hoort naar Mij, eilanden! En luistert toe, volken van verre! De HEERE heeft Mij geroepen van de buik af, van het ingewand van Mijn moeder af heeft Hij Mijn Naam vermeld.", "Zach 14:16": "En het zal gebeuren, dat allen die overgebleven zijn van alle heidenen die tegen Jeruzalem gekomen zullen zijn, van jaar tot jaar zullen optrekken om de Koning, de HEERE van de heerscharen, te aanbidden, en om het feest van de loofhutten te vieren.", "Jes 53:2": "Want Hij is als een jonge loot voor Zijn aangezicht opgeschoten, en als een wortel uit een dorre aarde; Hij had geen gedaante en geen heerlijkheid; als wij Hem aanzagen, was er geen gestalte dat wij Hem begeerd zouden hebben.", "Amos 9:12": "Opdat zij het overblijfsel van Edom erfelijk bezitten, en alle heidenvolken die naar Mijn Naam genoemd worden, spreekt de HEERE, Die dit doet.", "Jes 62:1-12": "Om Sion zal Ik niet zwijgen, en om Jeruzalem zal Ik niet stil zijn; totdat haar gerechtigheid voortkomt als een glans, en haar heil als een fakkel, die brandt. En de heidenen zullen uw gerechtigheid zien, en alle koningen uw heerlijkheid; en u zult met een nieuwe naam genoemd worden, die de mond van de HEERE nauwkeurig noemen zal. En u zult een sierlijke kroon zijn in de hand van de HEERE, en een koninklijke hoed in de hand van uw God.", "Zach 8:18": "Opnieuw kwam het woord van de HEERE van de heerscharen tot mij, en Hij zei:", "Ps 89:37": "Zijn zaad zal in eeuwigheid zijn, en zijn troon zal voor Mij zijn als de zon.", "Ps 132:11": "De HEERE heeft David de waarheid gezworen, waarvan Hij niet wijken zal, en zei: Van de vrucht van uw buik zal Ik op uw troon zetten.", "Openb 18:1-3": "En hierna zag ik een andere engel uit de hemel neerdalen, die grote macht had, en de aarde werd verlicht door zijn heerlijkheid. En hij riep met kracht, met een grote stem, en zei: Zij is gevallen, zij is gevallen, het grote Babylon, en is een woonplaats van duivels geworden, en een bewaarplaats van alle onreine geesten, en een bewaarplaats van alle onrein en gehaat gevogelte; Omdat alle volken hebben gedronken van de wijn van de toorn van haar hoererij, en de koningen van de aarde met haar gehoereerd hebben, en de kooplieden van de aarde rijk zijn geworden uit de kracht van haar weelde.", "Joz 4:7": "Zo zult u tegen hen zeggen: Omdat de wateren van de Jordaan zijn afgesneden geweest voor de ark van het verbond van de HEERE; toen zij door de Jordaan trok, werden de wateren van de Jordaan afgesneden; zo zullen deze stenen de kinderen van Israël tot een gedachtenis zijn tot in eeuwigheid.", "Hos 2:22": "En Ik zal ze Mij op de aarde zaaien, en Ik zal Mij ontfermen over Lo-Ruchama; en Ik zal zeggen tegen Lo-Ammi: U bent Mijn volk; en dat zal zeggen: O, mijn God!", "Neh 12:6": "Semaja, en Jojarib, Jedaja,", "Joh 12:41": "Dit zei Jesaja, toen hij Zijn heerlijkheid zag, en over Hem sprak.", "Zach 5:1": "En ik hief mijn ogen weer op, en ik keek; en zie, een vliegende rol.", "Num 31:54": "Zo namen Mozes en Eleazar, de priester, dat goud van de hoofdlieden der duizenden en der honderden, en zij brachten het in de tent der samenkomst, ter gedachtenis voor de kinderen van Israël, voor het aangezicht van de HEERE.", "Matt 27:11": "En Jezus stond voor de stadhouder; en de stadhouder vroeg Hem: Bent U de Koning van de Joden? En Jezus zei tegen hem: U zegt het.", "Luk 21:24": "En zij zullen vallen door de scherpte van het zwaard, en gevankelijk weggevoerd worden onder alle volken; en Jeruzalem zal door de heidenen vertrapt worden, totdat de tijden van de heidenen vervuld zullen zijn.", "1 Tim 5:21": "Ik roep als getuige God aan, en de Heere Jezus Christus, en de uitverkoren engelen, dat u deze dingen bewaart, zonder vooroordeel, niets doend uit partijdigheid.", "1 Kron 6:15": "En Jozadak ging mee toen de HEERE Juda en Jeruzalem gevangen liet wegvoeren door de hand van Nebukadnezar.", "Ezech 37:24": "En Mijn Knecht David zal Koning over hen zijn; en zij zullen allen samen één Herder hebben; en zij zullen in Mijn rechten wandelen, en Mijn inzettingen bewaren en die doen.", "Jes 60:7-9": "Al de schapen van Kedar zullen tot u verzameld worden; de rammen van Nebajoth zullen u dienen; zij zullen met welgevallen op Mijn altaar komen, en Ik zal het huis van Mijn heerlijkheid heerlijk maken. Wie zijn deze, die daar komen aangevlogen als een wolk, en als duiven naar hun vensters? Want de eilanden zullen Mij verwachten, en de schepen van Tarsis vooreerst, om uw kinderen van verre te brengen, hun zilver en hun goud met hen, tot de Naam van de HEERE, uw God, en tot de Heilige van Israël, omdat Hij u heerlijk gemaakt heeft.", "Ps 110:2": "De HEERE zal de scepter van Uw sterkte zenden uit Sion, en zeggen: Heers in het midden van Uw vijanden.", "Zach 9:10": "En Ik zal de wagens uit Efraïm uitroeien, en de paarden uit Jeruzalem; ook zal de strijdboog uitgeroeid worden, en Hij zal tot de heidenen vrede spreken; en Zijn heerschappij zal zijn van zee tot aan zee, en van de rivier tot aan de einden van de aarde.", "Openb 17:14": "Dezen zullen oorlog voeren tegen het Lam, en het Lam zal hen overwinnen (want Het is een Heere der heren, en een Koning der koningen), en zij die met Hem zijn, de geroepenen en uitverkorenen en gelovigen.", "Zef 3:9-20": "Zeker, dan zal Ik tot de volken een reine spraak wenden; opdat zij allen de Naam van de HEERE aanroepen, opdat zij Hem dienen met één schouder³. Van de zijden van de rivieren van Morenland zullen Mijn ernstige aanbidders, met de dochter van Mijn verstrooiden, Mijn offeranden brengen. Op die dag zult u niet beschaamd zijn vanwege al uw handelingen, waarmee u tegen Mij overtreden hebt; want dan zal Ik uit uw midden wegnemen wie van vreugde opspringen over uw hoogmoed, en u zult zich voortaan niet meer verheffen om Mijn heilige berg.", "Ps 145:11": "Caph. Zij zullen de heerlijkheid van Uw Koninkrijk vermelden, en Uw macht zullen zij uitspreken.", "Ps 102:14-17": "U zult opstaan, U zult U ontfermen over Sion, want de tijd om haar genadig te zijn, want de bestemde tijd is gekomen. Want Uw knechten hebben een welgevallen aan haar stenen, en hebben medelijden met haar gruis. Dan zullen de heidenen de Naam van de HEERE vrezen, en alle koningen van de aarde Uw heerlijkheid.", "Amos 9:11": "Op die dag zal Ik de vervallen hut van David weer oprichten, en Ik zal haar scheuren dichtmaken, en wat aan haar is afgebroken weer oprichten, en zal haar bouwen, als in de dagen van vroeger;", "Zach 9:9-17": "Verheug u zeer, dochter van Sion! Juich, dochter van Jeruzalem! Zie, uw Koning zal tot u komen, rechtvaardig, en Hij is een Heiland; arm, en rijdend op een ezel, en op een veulen, het jong van de ezelinnen. En Ik zal de wagens uit Efraïm uitroeien, en de paarden uit Jeruzalem; ook zal de strijdboog uitgeroeid worden, en Hij zal tot de heidenen vrede spreken; en Zijn heerschappij zal zijn van zee tot aan zee, en van de rivier tot aan de einden van de aarde. U ook aangaande, o Sion! Door het bloed van het verbond met u, heb Ik uw gebondenen uit de kuil, waar geen water in is, uitgelaten.", "Hebr 2:7-9": "U hebt hem een weinig minder gemaakt dan de engelen; met heerlijkheid en eer hebt U hem gekroond, en hebt U hem gesteld over de werken van Uw handen; Alle dingen hebt U onder zijn voeten onderworpen. Want doordat Hij hem alle dingen onderworpen heeft, heeft Hij niets overgelaten dat hem niet onderworpen is; maar nu zien wij nog niet dat hem alle dingen onderworpen zijn; maar wij zien Jezus met heerlijkheid en eer gekroond, Die een weinig minder dan de engelen geworden was, vanwege het lijden van de dood, opdat Hij door de genade van God voor allen de dood zou proeven.", "Jes 54:5": "Want uw Maker is uw Man, HEERE van de heerscharen is Zijn Naam; en de Heilige van Israël is uw Verlosser; Hij zal de God van de hele aardbodem genoemd worden.", "Ps 18:45": "Zo gauw als hun oor van mij hoorde, hebben zij mij gehoorzaamd; vreemden hebben zich mij geveinsd onderworpen.", "Dan 9:25": "Weet dan, en versta: van het uitgaan van het woord om te doen terugkeren en om Jeruzalem te bouwen, tot op de Messias, de Vorst, zijn zeven weken, en tweeënzestig weken; de straten en de grachten zullen weer gebouwd worden, maar in benauwdheid van de tijden.", "Mark 15:29": "En zij die voorbijkwamen, lasterden Hem, en schudden hun hoofden, en zeiden: Ha! U die de tempel afbreekt, en in drie dagen opbouwt,", "Zach 3:1": "Daarna liet Hij mij Jozua zien, de hogepriester, staande voor het aangezicht van de Engel van de HEERE; en de satan stond aan zijn rechterhand, om hem te weerstaan.", "Ps 145:10": "Jod. Al Uw werken, HEERE, zullen U loven, en Uw gunstgenoten zullen U zegenen.", "Jer 1:14": "En de HEERE zei tegen mij: Van het noorden zal dit kwaad zich opdoen over alle inwoners van het land.", "Ef 3:10": "opdat nu, door de Gemeente, aan de overheden en de machten in de hemel de veelvuldige wijsheid van God bekendgemaakt wordt;", "Ezech 47:1-12": "Daarna bracht hij mij terug naar de deur van het huis, en zie, er stroomde water uit van onder de drempel van het huis naar het oosten; want de voorkant van het huis lag naar het oosten, en het water daalde af van onderen, uit de rechterzijde van het huis, ten zuiden van het altaar. En hij bracht mij naar buiten door de noordpoort, en leidde mij rondom via de weg van buiten naar de buitenpoort, de weg die naar het oosten kijkt; en zie, het water sprong eruit aan de rechterzijde. Toen die man naar het oosten uitging, had hij een meetsnoer in zijn hand; en hij mat duizend el, en liet mij door het water gaan, en het water kwam tot aan de enkels.", "Job 2:2": "Toen zei de HEERE tegen de satan: Waar komt u vandaan? En de satan antwoordde de HEERE en zei: Van het rondtrekken op de aarde, en van het doorwandelen ervan.", "Ezech 10:9-19": "Toen zag ik, en zie, vier raderen waren bij de cherubs; één rad was bij elke cherub; en de gedaante van de raderen was als de kleur van een turkooissteen. En wat hun gedaanten betreft, die vier hadden allemaal dezelfde gelijkenis, alsof er een rad in het midden van een rad was. Als zij gingen, gingen zij naar hun vier zijden; zij keerden zich niet om als zij gingen; maar naar de plaats waar het hoofd heen keek, daar volgden zij naar; zij keerden zich niet om als zij gingen.", "Jes 32:15-17": "Totdat over ons de Geest uit de hoogte uitgegoten wordt; dan zal de woestijn tot een vruchtbaar veld worden, en het vruchtbare veld zal voor een woud gerekend worden. En het recht zal in de woestijn wonen, en de gerechtigheid zal op het vruchtbare veld verblijven. En het werk van de gerechtigheid zal vrede zijn; en de uitwerking van de gerechtigheid zal rust en zekerheid zijn, tot in eeuwigheid.", "Joh 2:19-21": "Jezus antwoordde en zei tegen hen: Breek deze tempel af, en in drie dagen zal Ik hem oprichten. De Joden zeiden dan: Zesenveertig jaar is aan deze tempel gebouwd, en zult U hem in drie dagen oprichten? Maar Hij sprak dit over de tempel van Zijn lichaam.", "Rom 16:26": "maar nu geopenbaard is, en door de profetische Schriften, naar het bevel van de eeuwige God, tot gehoorzaamheid aan het geloof, onder alle heidenen bekendgemaakt is;", "Deut 33:2": "Hij zei: De HEERE is van Sinaï gekomen, en is hun opgegaan van Seïr; Hij is blinkend verschenen van het gebergte Paran, en is aangekomen met tienduizenden van de heiligen; tot Zijn rechterhand was een vurige wet aan hen.", "Mark 4:26-32": "En Hij zei: Zo is het Koninkrijk van God, alsof een mens het zaad in de aarde wierp; en vervolgens sliep en opstond, nacht en dag; en het zaad ontkiemde en groeide op, terwijl hij zelf niet wist hoe. Want de aarde brengt uit zichzelf vruchten voort: eerst het kruid, daarna de aar, daarna het volle koren in de aar.", "Ps 80:16-18": "en de stam die Uw rechterhand geplant heeft, en dat om de zoon die U voor Uzelf gesterkt hebt! Hij is met vuur verbrand; hij is afgehouwen; zij komen om van het schelden van Uw aangezicht. Uw hand zij over de man van Uw rechterhand, over de zoon van de mens, die U voor Uzelf gesterkt hebt.", "Jes 35:1": "De woestijn en de dorre plaatsen zullen hierover vrolijk zijn, en de wildernis zal zich verheugen, en zal bloeien als een roos.", "Dan 11:3": "Daarna zal er een geweldig koning opstaan, die met grote heerschappij heersen zal, en hij zal doen naar zijn welgevallen.", "Hebr 2:2": "Want als het woord, dat door de engelen gesproken is, vast is geweest, en elke overtreding en ongehoorzaamheid rechtvaardige vergelding ontvangen heeft,", "Ef 1:20": "Die Hij gewrocht heeft in Christus, toen Hij Hem uit de doden heeft opgewekt; en Hem heeft gezet aan Zijn rechterhand in de hemel;", "Ex 28:1": "Daarna zult u uw broeder Aäron en zijn zonen met hem, uit het midden van de kinderen van Israël tot u laten naderen, om Mij het priesterambt te bedienen: namelijk Aäron, Nadab en Abihu, Eleazar en Ithamar, de zonen van Aäron.", "Jes 60:10": "En de vreemden zullen uw muren bouwen, en hun koningen zullen u dienen; want in Mijn verbolgenheid heb Ik u geslagen, maar in Mijn welbehagen heb Ik Mij over u ontfermd.", "Gen 12:3": "En Ik zal zegenen wie u zegenen, en vervloeken wie u vervloekt; en in u zullen alle geslachten van de aarde gezegend worden.", "Openb 5:14": "En de vier dieren zeiden: Amen. En de vierentwintig oudsten vielen neer en aanbaden Hem Die leeft tot in alle eeuwigheid.", "Openb 14:6": "En ik zag een andere engel, vliegend in het midden van de hemel, en hij had het eeuwige Evangelie, om te verkondigen aan hen die op de aarde wonen, en aan alle natie, en geslacht, en taal, en volk;", "Dan 10:6": "En Zijn lichaam was als een turkoois, en Zijn gezicht als het uiterlijk van de bliksem, en Zijn ogen als vurige fakkels, en Zijn armen en Zijn voeten als de glans van gepolijst koper; en de stem van Zijn woorden was als de stem van een menigte.", "Dan 12:4": "En u, Daniël! sluit deze woorden toe, en verzegel dit boek, tot de tijd van het einde; velen zullen het naspeuren, en de kennis zal toenemen.", "Joh 12:13": "Namen zij de takken van palmbomen, en gingen Hem tegemoet, en riepen: Hosanna! Gezegend is Hij, Die komt in de Naam van de Heere, de Koning van Israël!", "Ezech 16:42": "Zo zal Ik Mijn grimmigheid op u laten rusten, en Mijn ijver zal van u wijken; en Ik zal stil zijn, en niet meer toornig zijn.", "Hebr 7:1": "Want deze Melchizedek was koning van Salem, een priester van de allerhoogste God, die Abraham tegemoet ging toen hij terugkeerde van het verslaan van de koningen, en hem zegende;", "Dan 7:27": "Maar het rijk, en de heerschappij, en de grootheid van de koninkrijken onder de hele hemel, zal gegeven worden aan het volk van de heiligen van de hoge plaatsen, wiens Rijk een eeuwig Rijk zal zijn; en alle heerschappijen zullen Hem eren en gehoorzamen.", "Jes 40:10": "Ziet, de Heere HEERE zal komen tegen de sterke, en Zijn arm zal heersen; ziet, Zijn loon is bij Hem, en Zijn arbeidsloon is voor Zijn aangezicht.", "Num 22:35": "De Engel van de HEERE zei toen tegen Bileam: Ga met deze mannen mee; maar alleen dat woord dat Ik tot u spreken zal, dat zult u spreken. Zo ging Bileam met de vorsten van Balak mee.", "Matt 2:6": "En u, Bethlehem, land van Juda! U bent geenszins de minste onder de vorsten van Juda; want uit u zal de Leidsman voortkomen, Die Mijn volk Israël weiden zal.", "Jes 29:19": "En de zachtmoedigen zullen vreugde op vreugde hebben in de HEERE; en de behoeftigen onder de mensen zullen zich in de Heilige van Israël verheugen.", "Jes 60:1-5": "Maak u op, word verlicht, want uw licht komt, en de heerlijkheid van de HEERE gaat over u op. Want zie, de duisternis zal de aarde bedekken, en donkerheid de volken; maar over u zal de HEERE opgaan, en Zijn heerlijkheid zal over u gezien worden. En de heidenen zullen naar uw licht gaan, en koningen naar de glans die over u is opgegaan.", "Luk 7:22": "En Jezus antwoordde en zei tegen hen: Ga heen, en vertel Johannes weer wat u gezien en gehoord hebt: dat de blinden ziende worden, de kreupelen lopen, de melaatsen gereinigd worden, de doven horen, de doden opgewekt worden, aan de armen het Evangelie verkondigd wordt.", "Jes 32:1": "Zie, een koning zal regeren in gerechtigheid, en de vorsten zullen heersen naar recht.", "Matt 11:27": "Alle dingen zijn Mij overgegeven door Mijn Vader; en niemand kent de Zoon dan de Vader, en niemand kent de Vader dan de Zoon, en wie het de Zoon wil openbaren.", "Luk 15:10": "Zo, zeg Ik u, is er blijdschap voor de engelen van God over één zondaar die zich bekeert.", "Micha 4:1-7": "Maar in het laatste van de dagen zal het gebeuren, dat de berg van het huis van de HEERE vastgesteld zal zijn op de top van de bergen; en hij zal verheven zijn boven de heuvels, en de volken zullen naar hem toestromen. En veel heidenvolken zullen heengaan en zeggen: Kom, laat ons opgaan naar de berg van de HEERE, en naar het huis van de God van Jakob, opdat Hij ons zijn wegen leert, en wij op Zijn paden wandelen; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem. En Hij zal onder grote volken rechtspreken, en machtige heidenvolken straffen, tot ver weg toe; en zij zullen hun zwaarden omsmeden tot ploegscharen, en hun speren tot snoeimessen; het ene volk zal tegen het andere volk geen zwaard opheffen, en zij zullen de oorlog niet meer leren.", "Jes 4:3": "En het zal gebeuren, dat wie overgebleven is in Sion, en wie overgelaten is in Jeruzalem, heilig genoemd zal worden, ieder die opgeschreven is ten leven in Jeruzalem;", "Ezech 11:22": "Toen tilden de cherubs hun vleugels op, en de raderen tegenover hen; en de heerlijkheid van de God van Israël was van boven over hen.", "Ef 1:11": "In Hem, in Wie wij ook een erfdeel geworden zijn, wij, die van tevoren voorbestemd waren naar het voornemen van Hem die alle dingen werkt naar de raad van Zijn wil;", "Dan 7:24": "Wat de tien horens betreft: uit dat koninkrijk zullen tien koningen opstaan, en een ander zal na hen opstaan; en die zal verschillend zijn van de vorigen, en hij zal drie koningen vernederen.", "Dan 8:14": "En hij zei tegen mij: Tot tweeduizend driehonderd avonden en morgens; dan zal het heiligdom weer in ere hersteld worden.", "Openb 14:14": "En ik zag, en zie, een witte wolk, en op de wolk zat Iemand, gelijk aan de Zoon des mensen, met op Zijn hoofd een gouden kroon; en in Zijn hand een scherpe sikkel.", "Dan 11:5": "En de koning van het Zuiden zal sterk worden, ook een van zijn vorsten; maar een ander zal sterker worden dan hij, en hij zal heersen; zijn heerschappij zal een grote heerschappij zijn.", "Ps 148:2": "Looft Hem, al Zijn engelen! Looft Hem, al Zijn heerscharen!", "1 Sam 2:10": "Zij die met de HEERE twisten, zullen verpletterd worden; Hij zal in de hemel over hen donderen; de HEERE zal de einden van de aarde richten, en zal Zijn Koning sterkte geven, en de hoorn van Zijn Gezalfde verhogen.", "Hand 5:31": "Deze heeft God door Zijn rechterhand verhoogd tot een Vorst en Zaligmaker, om Israël bekering en vergeving van zonden te geven.", "Jes 42:1-12": "Zie, Mijn Knecht, Die Ik ondersteun, Mijn Uitverkorene, in Wie Mijn ziel een welbehagen heeft! Ik heb Mijn Geest op Hem gegeven; Hij zal het recht aan de heidenen voortbrengen. Hij zal niet schreeuwen, noch Zijn stem verheffen, noch Zijn stem op straat horen laten. Het geknakte riet zal Hij niet breken, en de rokende vlaswiek zal Hij niet uitblussen; met waarheid zal Hij het recht voortbrengen.", "Jes 66:7-23": "Voordat zij barensnood had, heeft zij gebaard, voordat haar smart kwam, is zij al van een jongetje bevrijd. Wie heeft ooit zoiets gehoord? Wie heeft dergelijke dingen gezien? Zou een land geboren kunnen worden op één dag? Zou een volk geboren kunnen worden in één keer? Maar Sion heeft weeën gekregen, en zij heeft haar zonen gebaard. Zou Ik de baarmoeder openbreken, en niet laten baren? zegt de HEERE; zou Ik, Die laat baren, voortaan toesluiten? zegt uw God.", "Ps 87:4": "Ik zal Rahab en Babel vermelden, onder hen die Mij kennen; zie, de Filistijn en de Tyriër, met de Moor, deze is daar geboren.", "Matt 4:6": "en zei tegen Hem: Als U Gods Zoon bent, werp Uzelf naar beneden; want er is geschreven dat Hij Zijn engelen bevelen zal U te beschermen, en dat zij U op de handen zullen dragen, opdat U niet op enig moment Uw voet aan een steen stoot.", "Ps 148:8": "Vuur en hagel, sneeuw en damp; stormwind, die Zijn woord doet!", "Jes 45:8": "Drupt, hemelen! van boven af, en laat de wolken vloeien van gerechtigheid; en laat de aarde zich openen, en laat allerlei heil uitwassen, en gerechtigheid samen uitspruiten; Ik, de HEERE, heb ze geschapen.", "Ef 1:20-23": "Die Hij gewrocht heeft in Christus, toen Hij Hem uit de doden heeft opgewekt; en Hem heeft gezet aan Zijn rechterhand in de hemel; Ver boven alle overheid, en macht, en kracht, en heerschappij, en elke naam die genoemd wordt, niet alleen in deze wereld, maar ook in de toekomende; En heeft alle dingen aan Zijn voeten onderworpen, en heeft Hem aan de Gemeente gegeven tot een Hoofd boven alle dingen;", "Dan 7:19": "Toen wilde ik de waarheid weten over het vierde dier, dat verschillend was van al de andere, zeer gruwelijk, welks tanden van ijzer waren, en zijn klauwen van koper; het at, het verbrijzelde, en vertrapte het overige met zijn voeten.", "Ps 85:11-13": "De goedertierenheid en waarheid zullen elkaar ontmoeten; de gerechtigheid en vrede zullen elkaar kussen. De waarheid zal uit de aarde opkomen, en gerechtigheid zal vanuit de hemel neerzien. Ook zal de HEERE het goede geven; en ons land zal zijn vrucht geven.", "Est 8:15": "En Mordechai ging weg van voor de koning in een hemelsblauw en wit koninklijk kleed, en met een grote gouden kroon, en met een overkleed van fijn linnen en purper; en de stad Susan juichte en was vrolijk.", "Ps 8:6": "En hebt U hem een weinig minder gemaakt dan de engelen, en hebt U hem met eer en heerlijkheid gekroond?", "Ps 66:4": "De hele aarde aanbidt U, en zingt U psalmen; zij zingt Uw Naam psalmen. Sela.", "Zach 4:8": "Het woord van de HEERE kwam verder tot mij:", "Openb 19:6": "En ik hoorde als een stem van een grote menigte, en als een stem van veel water, en als een stem van sterke donderslagen, die zei: Halleluja, want de Heere, de almachtige God, heeft als Koning geheerst.", "Zach 6:9-15": "En het woord van de HEERE kwam tot mij, en zei: Neem van de gevankelijk weggevoerden, van Cheldai, van Tobia, en van Jedaja, en kom u op die dag, en ga het huis binnen van Josia, de zoon van Zefanja, die uit Babel gekomen zijn; Namelijk, neem zilver en goud, en maak kronen; en zet ze op het hoofd van Jozua, de zoon van Jozadak, de hogepriester.", "Ex 28:36-38": "Verder zult u een plaat maken van zuiver goud, en u zult daarin graveren, zoals men de zegels graveert: HEILIGHEID VOOR DE HEERE! En u zult die aanhechten met een hemelsblauw snoer, zo dat zij aan de hoed is; aan de voorste zijde van de hoed zal zij zijn. En zij zal op het voorhoofd van Aäron zijn, opdat Aäron de ongerechtigheid draagt van de heilige dingen die de kinderen van Israël geheiligd zullen hebben, in alle gaven van hun geheiligde dingen; en zij zal voortdurend aan zijn voorhoofd zijn, om hen voor het aangezicht van de HEERE aangenaam te maken.", "Openb 5:5": "En een van de oudsten zei tegen mij: Huil niet; zie, de Leeuw uit de stam van Juda, de Wortel van David, heeft overwonnen om het boek te openen en zijn zeven zegels te verbreken.", "Openb 20:4-6": "En ik zag tronen, en zij zaten daarop; en het oordeel werd hun gegeven; en ik zag de zielen van hen die onthoofd waren om de getuigenis van Jezus, en om het Woord van God, en die het beest, en zijn beeld niet aangebeden hadden, en die het merkteken niet ontvangen hadden aan hun voorhoofd en aan hun hand; en zij leefden en heersten als koningen met Christus, de duizend jaar. Maar de overigen van de doden werden niet weer levend, totdat de duizend jaar geëindigd waren. Dit is de eerste opstanding. Gelukkig en heilig is hij, die deel heeft in de eerste opstanding; over hen heeft de tweede dood geen macht, maar zij zullen priesters van God en Christus zijn, en zij zullen met Hem als koningen heersen, duizend jaar.", "Jes 29:18": "En op die dag zullen de doven de woorden van het boek horen; en de ogen van de blinden, die uit de donkerheid en uit de duisternis zijn, zullen zien.", "Ef 1:20-22": "Die Hij gewrocht heeft in Christus, toen Hij Hem uit de doden heeft opgewekt; en Hem heeft gezet aan Zijn rechterhand in de hemel; Ver boven alle overheid, en macht, en kracht, en heerschappij, en elke naam die genoemd wordt, niet alleen in deze wereld, maar ook in de toekomende; En heeft alle dingen aan Zijn voeten onderworpen, en heeft Hem aan de Gemeente gegeven tot een Hoofd boven alle dingen;", "Dan 8:22": "Dat er nu vier op zijn plaats stonden toen hij gebroken was; vier koninkrijken zullen uit dat volk ontstaan, maar niet met zijn kracht.", "Hand 13:38": "Zo zij het u dan bekend, mannen broeders, dat door Hem u vergeving van de zonden verkondigd wordt;", "Jes 30:20": "De Heere zal u wel brood van de benauwdheid, en water van de verdrukking geven; maar uw leraars zullen niet meer als met vleugels wegvliegen, maar uw ogen zullen uw leraars zien;", "Dan 7:22": "Totdat de Oude van dagen kwam, en het gericht gegeven werd aan de heiligen van de hoge plaatsen, en de bestemde tijd kwam, dat de heiligen het Rijk bezaten.", "Ps 21:4": "Want U komt hem voor met zegeningen van het goede; op zijn hoofd zet U een kroon van fijn goud.", "Openb 11:15": "En de zevende engel heeft op de bazuin geblazen, en er kwamen grote stemmen in de hemel, die zeiden: De koninkrijken van de wereld zijn van onze Heere geworden en van Zijn Christus, en Hij zal als Koning heersen tot in alle eeuwigheid.", "Ezech 1:5-28": "En uit het midden daarvan kwam de gelijkenis van vier levende wezens; en dit was hun gedaante: zij hadden de gelijkenis van een mens; En elk had vier gezichten; ook had elk van hen vier vleugels. En hun voeten waren rechte voeten, en hun voetzolen waren gelijk de voetzool van een kalf, en glinsterden als de kleur van glad koper.", "Hebr 7:1-3": "Want deze Melchizedek was koning van Salem, een priester van de allerhoogste God, die Abraham tegemoet ging toen hij terugkeerde van het verslaan van de koningen, en hem zegende; aan wie Abraham ook van alles de tienden gaf; hij wordt eerst vertaald met 'koning van de gerechtigheid', en daarna was hij ook koning van Salem, dat is: koning van de vrede; zonder vader, zonder moeder, zonder geslachtsregister, zonder begin van dagen of einde van leven, maar gelijk geworden aan de Zoon van God, blijft hij een priester voor eeuwig.", "Hand 2:16-21": "Maar dit is wat gesproken is door de profeet Joël: En het zal gebeuren in de laatste dagen, zegt God, dat Ik van Mijn Geest zal uitstorten op alle vlees; en uw zonen en uw dochters zullen profeteren, en uw jongemannen zullen visioenen zien, en uw ouden zullen dromen dromen. En ook op Mijn dienstknechten, en op Mijn dienstmaagden, zal Ik in die dagen van Mijn Geest uitstorten, en zij zullen profeteren.", "Openb 6:6": "En ik hoorde een stem in het midden van de vier dieren, die zei: Een maatje tarwe voor een penning, en drie maatjes gerst voor een penning; en beschadig de olie en de wijn niet.", "Jes 45:24": "Men zal van Mij zeggen: Zeker, in de HEERE zijn gerechtigheden en sterkte; tot Hem zal men komen; maar zij zullen allen beschaamd worden die tegen Hem in woede ontstoken zijn.", "Dan 7:2": "Daniël antwoordde en zei: Ik zag in mijn gezicht bij nacht, en zie, de vier winden van de hemel braken los op de grote zee.", "Zach 7:8": "Verder kwam het woord van de HEERE tot Zacharia:", "Zach 4:9": "De handen van Zerubbabel hebben dit huis gegrondvest, zijn handen zullen het ook voltooien; opdat u weet dat de HEERE van de heerscharen mij tot u gezonden heeft.", "Openb 6:2-5": "En ik zag, en zie, een wit paard, en Die daarop zat, had een boog; en Hem is een kroon gegeven, en Hij ging uit, overwinnend, en om te overwinnen! En toen Het het tweede zegel geopend had, hoorde ik het tweede dier zeggen: Kom en zie! En een ander paard ging uit, dat rood was; en hem, die daarop zat, werd macht gegeven de vrede van de aarde te nemen; en dat zij elkaar zouden doden; en hem werd een groot zwaard gegeven.", "Hand 2:39": "Want voor u is de belofte, en voor uw kinderen, en voor allen die ver weg zijn, zoveel als de Heere, onze God, ertoe roepen zal.", "Openb 14:10": "die zal ook drinken uit de wijn van de toorn van God, die onvermengd ingeschonken is in de drinkbeker van Zijn toorn; en hij zal gepijnigd worden met vuur en zwavel voor de heilige engelen en voor het Lam.", "Joh 1:50": "Nathanaël antwoordde en zei tegen Hem: Rabbi! U bent de Zoon van God, U bent de Koning van Israël.", "Ps 65:6": "Vreselijke dingen zult U ons in gerechtigheid antwoorden, o God van ons heil! o Vertrouwen van alle einden van de aarde, en van de ver weg gelegenen aan de zee!", "Dan 7:6": "Daarna zag ik, en zie, er was een ander dier, gelijk een luipaard, en het had vier vleugels van een vogel op zijn rug; ook had dat dier vier hoofden, en aan hem werd de heerschappij gegeven.", "Jes 44:28": "Die van Kores zegt: Hij is Mijn herder, en hij zal al Mijn welbehagen volbrengen; en zegt ook tot Jeruzalem: Word gebouwd; en tot de tempel: Word gegrondvest.", "Matt 13:17": "Want voorwaar, Ik zeg u, dat veel profeten en rechtvaardigen begeerd hebben te zien wat u ziet, en het niet gezien hebben; en te horen wat u hoort, en het niet gehoord hebben.", "Jes 46:10": "Die vanaf het begin aan verkondigt het einde, en van oudsher af die dingen, die nog niet gebeurd zijn; Die zegt: Mijn raad zal standhouden, en Ik zal al Mijn welbehagen doen.", "Jer 25:9": "Zie, Ik zal zenden, en nemen alle geslachten van het noorden, spreekt de HEERE; en tot Nebukadnezar, de koning van Babel, Mijn dienstknecht; en zal ze brengen over dit land, en over de inwoners daarvan, en over al deze volken rondom; en Ik zal ze met de ban verdelgen, en zal ze stellen tot een ontzetting, en tot een aanfluiting, en tot eeuwige woestheden.", "Ps 21:6": "Groot is zijn eer door Uw heil; majesteit en heerlijkheid hebt U hem toegevoegd.", "Zach 5:6": "En ik zei: Wat is dat? En Hij zei: Dit is een efa die tevoorschijn komt. Verder zei Hij: Dit is het beeld van hen in het hele land.", "Luk 2:11": "namelijk dat u heden geboren is de Zaligmaker, Die is Christus, de Heere, in de stad van David.", "Jer 16:19-21": "O HEERE! U bent mijn Sterkte, en mijn Sterkheid, en mijn Toevlucht ten dage van de benauwdheid; tot U zullen de heidenen komen van de einden van de aarde, en zeggen: Zeker hebben onze vaders leugen erfelijk bezeten, en ijdelheid, waarin toch niets was, dat nut deed. Zal een mens zich goden maken? Zij zijn toch geen goden. Daarom, zie, Ik zal hun bekendmaken op dit moment; Ik zal hun Mijn hand en Mijn macht bekendmaken; en zij zullen weten, dat Mijn Naam is HEERE.", "Ps 65:3": "U hoort het gebed; tot U zal alle vlees komen.", "Ps 72:8": "En hij zal heersen van de zee tot aan de zee, en van de rivier tot aan de einden van de aarde.", "Openb 3:21": "Wie overwint, hem zal Ik geven met Mij te zitten op Mijn troon, zoals Ik ook overwonnen heb, en Mij gezet heb met Mijn Vader op Zijn troon.", "Ps 36:7": "Uw gerechtigheid is als de bergen van God, Uw oordelen zijn een grote afgrond; HEERE! U behoudt mensen en beesten.", "Dan 7:13": "Verder zag ik in de nachtgezichten, en zie, er kwam Een met de wolken van de hemel, als eens mensen zoon, en Hij kwam tot de Oude van dagen, en men liet Hem voor Hem naderen.", "Fil 2:7-11": "Maar heeft Zichzelf ontledigd door de gestalte van een dienstknecht aan te nemen, en is de mensen gelijk geworden; En in gedaante gevonden als een mens, heeft Hij Zichzelf vernederd, gehoorzaam geworden tot de dood, ja, de dood van het kruis. Daarom heeft God Hem ook uitermate verhoogd, en heeft Hem een Naam gegeven, die boven alle naam is;", "Ezech 47:3-5": "Toen die man naar het oosten uitging, had hij een meetsnoer in zijn hand; en hij mat duizend el, en liet mij door het water gaan, en het water kwam tot aan de enkels. Toen mat hij nog duizend el, en liet mij door het water gaan, en het water kwam tot aan de knieën; en hij mat nog duizend, en liet mij gaan, en het water kwam tot aan de lenden. Vervolgens mat hij nog duizend, en het was een beek waar ik niet doorheen kon gaan; want het water was hoog geworden, water om in te zwemmen, een beek waar men niet doorheen kon gaan.", "Ps 110:1-6": "Een psalm van David. De HEERE heeft tot mijn Heere gesproken: Zit aan Mijn rechterhand, totdat Ik Uw vijanden gezet zal hebben tot een voetbank van Uw voeten. De HEERE zal de scepter van Uw sterkte zenden uit Sion, en zeggen: Heers in het midden van Uw vijanden. Uw volk zal zeer gewillig zijn op de dag van Uw heirkracht, in heilig sieraad; uit de baarmoeder van het dageraad zal U de dauw van Uw jeugd zijn.", "Mark 15:39": "En de hoofdman over honderd, die daarbij tegenover Hem stond, zag dat Hij zo roepend de geest gegeven had, en zei: Werkelijk, deze Mens was Gods Zoon!", "Jes 51:6": "Hef uw ogen op naar de hemel, en kijk naar de aarde beneden; want de hemel zal als rook verdwijnen, en de aarde zal als een kleed verouderen, en haar inwoners zullen op dezelfde manier sterven; maar Mijn heil zal in eeuwigheid zijn, Mijn gerechtigheid zal niet verbroken worden.", "Ps 89:2-38": "Ik zal de goedertierenheid van de HEERE eeuwig zingen; ik zal Uw waarheid met mijn mond bekend maken, van geslacht tot geslacht. Want ik heb gezegd: Uw goedertierenheid zal eeuwig gebouwd worden; in de hemelen zelf hebt Gij Uw waarheid bevestigd, en gezegd: Ik heb een verbond gemaakt met Mijn uitverkorene; Ik heb Mijn knecht David gezworen:", "Hand 17:31": "Omdat Hij een dag vastgesteld heeft, waarop Hij de aardbodem rechtvaardig zal oordelen, door een Man Die Hij daartoe aangesteld heeft, en Hij heeft daarvan aan allen zekerheid gegeven doordat Hij Hem uit de doden heeft opgewekt.", "Hebr 10:21": "en omdat wij een grote Priester hebben over het huis van God,", "Luk 12:9": "Maar wie Mij verloochenen zal voor de mensen, die zal verloochend worden voor de engelen van God.", "Dan 2:41": "En dat u de voeten en tenen gezien hebt, voor een deel van pottenbakkersleem en voor een deel van ijzer, dat betekent dat het een verdeeld koninkrijk zal zijn, maar er zal iets van de vastheid van het ijzer in zijn, omdat u gezien hebt dat het ijzer vermengd was met modderig leem;", "Micha 4:4": "Maar zij zullen zitten, ieder onder zijn wijnstok en onder zijn vijgenboom, en er zal niemand zijn die hen verschrikt; want de mond van de HEERE van de heerscharen heeft het gesproken.", "Openb 5:10": "en U hebt ons voor onze God gemaakt tot koningen en priesters; en wij zullen als koningen heersen op de aarde.", "Matt 8:11": "Maar Ik zeg u dat velen zullen komen van oost en west, en met Abraham, en Izak, en Jakob, zullen aanzitten in het Koninkrijk der hemelen;", "Openb 19:10": "En ik viel neer voor zijn voeten, om hem te aanbidden, en hij zei tegen mij: Zie toe dat u dat niet doet; ik ben uw mededienstknecht, en uw broeder, die de getuigenis van Jezus hebben; aanbid God. Want de getuigenis van Jezus is de geest van de profetie.", "Jer 30:9": "Maar zij zullen de HEERE, hun God, dienen, en hun koning David, die Ik hun verwekken zal.", "Ps 45:5": "En rijd voorspoedig in Uw heerlijkheid, op het woord van de waarheid en rechtvaardige zachtmoedigheid; en Uw rechterhand zal U ontzagwekkende dingen leren.", "Ps 96:1-13": "Zingt de HEERE een nieuw lied; zingt de HEERE, heel de aarde! Zingt de HEERE, looft Zijn Naam; verkondigt Zijn heil van dag tot dag. Vertelt onder de heidenen Zijn eer, onder alle volken Zijn wonderen.", "Mark 10:31": "Maar vele eersten zullen de laatsten zijn, en velen die de laatsten zijn, de eersten.", "Joh 12:32": "En Ik, wanneer Ik van de aarde verhoogd zal zijn, zal allen tot Mij trekken.", "Ezech 1:7": "En hun voeten waren rechte voeten, en hun voetzolen waren gelijk de voetzool van een kalf, en glinsterden als de kleur van glad koper.", "Dan 2:44": "Maar in de dagen van die koningen zal de God van de hemel een Koninkrijk oprichten, dat in eeuwigheid niet zal worden verwoest; en dat Koninkrijk zal aan geen ander volk worden overgelaten; het zal al die koninkrijken verbrijzelen en tenietdoen, maar zelf zal het in alle eeuwigheid bestaan.", "Ex 28:30": "U zult ook in de borstlap van het gericht de Urim en de Thummim zetten, zodat zij op het hart van Aäron zijn, als hij voor het aangezicht van de HEERE ingaan zal; zo zal Aäron dat gericht van de kinderen van Israël voortdurend op zijn hart dragen, voor het aangezicht van de HEERE.", "Zach 5:5": "En de Engel Die met mij sprak, ging naar buiten, en zei tegen mij: Hef nu uw ogen op, en zie wat dit is, dat er tevoorschijn komt.", "Zach 8:9": "Zo zegt de HEERE van de heerscharen: Laat uw handen sterk zijn, u die in deze dagen deze woorden gehoord hebt uit de mond van de profeten, die er geweest zijn op de dag dat de grond van het huis van de HEERE van de heerscharen gelegd is, zodat de tempel gebouwd zou worden.", "Zach 8:9-15": "Zo zegt de HEERE van de heerscharen: Laat uw handen sterk zijn, u die in deze dagen deze woorden gehoord hebt uit de mond van de profeten, die er geweest zijn op de dag dat de grond van het huis van de HEERE van de heerscharen gelegd is, zodat de tempel gebouwd zou worden. Want vóór die dagen kwam het loon van de mens tot niets, en het loon van het vee was er niet; en de uitgaande en de inkomende hadden geen vrede vanwege de vijand, want Ik zond alle mensen, ieder tegen zijn naaste. Maar nu zal Ik voor het overblijfsel van dit volk niet zijn zoals in de vorige dagen, spreekt de HEERE van de heerscharen.", "Hebr 12:24": "En tot de Middelaar van het nieuwe testament, Jezus, en het bloed van de besprenging, dat betere dingen spreekt dan Abel.", "Zach 7:4": "Toen kwam het woord van de HEERE van de heerscharen tot mij:", "Ezech 17:23": "op de berg van de hoogte van Israël zal Ik hem planten; en hij zal takken voortbrengen, en vrucht dragen, en hij zal tot een heerlijke ceder worden, zodat onder hem alle vogels van allerlei vleugel zullen wonen; in de schaduw van zijn takken zullen zij wonen.", "Joël 2:28-32": "En daarna zal het gebeuren, dat Ik Mijn Geest zal uitgieten over alle vlees, en uw zonen en uw dochters zullen profeteren; uw ouden zullen dromen dromen, uw jongelingen zullen gezichten zien; Ja, ook over de dienstknechten, en over de dienstmaagden, zal Ik in die dagen Mijn Geest uitgieten. En Ik zal wondertekenen geven in de hemel en op de aarde: bloed, en vuur, en rookpilaren.", "Jes 23:18": "En haar koophandel en haar hoerenloon zullen de HEERE heilig zijn, het zal niet als schat verzameld worden, en ook niet weggesloten; maar haar koophandel zal er zijn voor hen die voor het aangezicht van de HEERE wonen, opdat zij tot verzadiging eten, en opdat zij duurzame kleding hebben.", "Hoogl 1:12": "Terwijl de koning aan zijn ronde tafel is, geeft mijn nardus zijn geur.", "Mark 1:13": "En Hij was daar in de woestijn veertig dagen, beproefd door de satan; en Hij was bij de wilde dieren; en de engelen dienden Hem.", "Matt 4:11": "Toen liet de duivel Hem los; en zie, de engelen kwamen naar Hem toe, en dienden Hem.", "Mal 1:11": "Maar van de opgang van de zon tot haar ondergang, zal Mijn Naam groot zijn onder de heidenen; en op elke plaats zal aan Mijn Naam reukwerk gebracht worden, en een rein spijsoffer; want Mijn Naam zal groot zijn onder de heidenen, zegt de HEERE van de heerscharen.", "Joh 17:20": "En Ik bid niet alleen voor dezen, maar ook voor hen die door hun woord in Mij geloven zullen.", "Luk 9:31": "die in heerlijkheid verschenen en spraken over Zijn heengaan, dat Hij te Jeruzalem zou volbrengen.", "Jes 45:14": "Zo zegt de HEERE: De arbeid van de Egyptenaren en de koophandel van de Moren en van de Sabeërs, mannen van grote lengte, zullen tot u overkomen, en zij zullen van u zijn, zij zullen u navolgen, in boeien zullen zij overkomen; en zij zullen zich voor u buigen, zij zullen u smeken, en zeggen: Zeker, God is in u, en er is verder geen God meer.", "Openb 17:3": "En hij bracht mij weg naar een woestijn, in de geest, en ik zag een vrouw zitten op een scharlaken rood beest, dat vol was van namen van godslastering, en dat zeven hoofden had en tien horens.", "2 Kron 18:18": "Verder zei hij: Daarom, hoor het woord van de HEERE: Ik zag de HEERE zitten op Zijn troon, en heel het hemelse leger staande aan Zijn rechterhand en Zijn linkerhand.", "Hebr 3:4": "Want ieder huis wordt door iemand gebouwd; maar Die dit alles gebouwd heeft, is God.", "Dan 2:33": "Zijn schenkels van ijzer; zijn voeten voor een deel van ijzer, en voor een deel van leem.", "Joh 13:3": "Jezus, die wist dat de Vader Hem alle dingen in de handen gegeven had, en dat Hij van God uitgegaan was en tot God heenging,", "Ps 103:20": "Loof de HEERE, Zijn engelen! U krachtige helden, die Zijn woord doet, en die gehoorzamen aan de stem van Zijn woord.", "Jes 49:18-23": "Hef uw ogen op rondom, en zie, al dezen verzamelen zich, zij komen tot u; Zo waarachtig als Ik leef, spreekt de HEERE, zeker zult u zich met al dezen als met een sieraad bekleden, en u zult ze u aanbinden, zoals een bruid. Want in uw woeste en uw eenzame plaatsen, en uw verwoeste land, zeker, nu zult u benauwd worden van inwoners; en zij die u verslonden, zullen zich ver van u maken. Nog zullen de kinderen, waarvan u beroofd was, zeggen voor uw oren: De plaats is mij te nauw, wijk van mij, dat ik wonen mag.", "Joh 13:32": "Als God in Hem verheerlijkt is, zal God Hem ook in Zichzelf verheerlijken, en Hij zal Hem meteen verheerlijken.", "Zach 2:8-11": "Want zo zegt de HEERE van de heerscharen: Naar de heerlijkheid over u, heeft Hij mij gezonden tot die heidenen, die u beroofd hebben; want die u aanraakt, die raakt Zijn oogappel aan. Want zie, Ik zal Mijn hand over hen bewegen, en zij zullen hun knechten een roof wezen. Zo zult u weten, dat de HEERE van de heerscharen mij gezonden heeft. Juich en verblijd u, dochter van Sion; want zie, Ik kom, en Ik zal in het midden van u wonen, spreekt de HEERE.", "Jes 19:24": "Op die dag zal Israël de derde zijn met de Egyptenaren en met de Assyriërs, een zegen in het midden van het land.", "Dan 11:4": "En zodra hij zal staan, zal zijn rijk gebroken en naar de vier windrichtingen van de hemel verdeeld worden, maar niet aan zijn nakomelingen, ook niet met de heerschappij waarmee hij heerste; want zijn rijk zal uitgerukt worden, en dat voor anderen dan deze.", "1 Kor 3:9": "Want wij zijn medearbeiders van God; akkerwerk van God, gebouw van God bent u.", "Zach 14:20": "Op die dag zal op de bellen van de paarden staan: DE HEILIGHEID VAN DE HEERE. En de potten in het huis van de HEERE zullen zijn als de sprenkelschalen voor het altaar;", "Zach 1:15": "En Ik ben met een zeer grote toorn vertoornd tegen die geruste heidenen; want Ik was een weinig toornig, maar zij hebben tot het kwade meegeholpen.", "1 Petr 1:12": "Aan hen is geopenbaard dat zij niet zichzelf, maar ons dienden met deze dingen, die u nu aangekondigd zijn door hen die u het Evangelie verkondigd hebben door de Heilige Geest, Die van de hemel gezonden is; dingen waar de engelen graag een blik in willen werpen.", "Openb 12:10": "En ik hoorde een grote stem, die zei in de hemel: Nu is de zaligheid, en de kracht, en het koninkrijk van onze God gekomen; en de macht van Zijn Christus; want de aanklager van onze broeders, die hen aanklaagde voor onze God dag en nacht, is neergeworpen.", "Zach 1:9": "En ik zei: Mijn Heere! Wat zijn deze? Toen zei de Engel Die met mij sprak tegen mij: Ik zal u tonen wat deze zijn.", "Jes 9:6": "De grootheid van deze heerschappij en van de vrede zal geen einde hebben op de troon van David en in zijn koninkrijk, om dat te bevestigen en te sterken met recht en met gerechtigheid, van nu af tot in eeuwigheid toe. De ijver van de HEERE van de heerscharen zal dit doen.", "Ps 113:3": "Van de opgang van de zon af tot haar neergang zij de Naam van de HEERE geloofd.", "Jes 48:14": "Verzamel u, u allen, en hoor; wie onder hen heeft deze dingen verkondigd? De HEERE heeft hem lief, Hij zal Zijn welbehagen tegen Babel doen, en Zijn arm zal tegen de Chaldeeën zijn.", "Hoogl 1:4": "Trek mij, wij zullen u nalopen! De koning heeft mij gebracht in zijn binnenkamers; wij zullen ons verheugen en in u verblijden; wij zullen uw uitnemende liefde vermelden, meer dan de wijn; de oprechten hebben u lief.", "Joh 18:37": "Pilatus zei dan tegen Hem: Bent U dan een Koning? Jezus antwoordde: U zegt dat Ik een Koning ben. Hiertoe ben Ik geboren en hiertoe ben Ik in de wereld gekomen, opdat Ik getuigenis zou geven van de waarheid. Ieder die uit de waarheid is, hoort Mijn stem.", "Openb 7:9": "Hierna zag ik, en zie, een grote menigte, die niemand tellen kon, uit alle naties, en geslachten, en volken, en talen, die stond voor de troon en voor het Lam, bekleed met lange witte kleren, en takken van palmen waren in hun handen.", "Hebr 2:9": "maar wij zien Jezus met heerlijkheid en eer gekroond, Die een weinig minder dan de engelen geworden was, vanwege het lijden van de dood, opdat Hij door de genade van God voor allen de dood zou proeven.", "Openb 5:9-11": "En zij zongen een nieuw lied: U bent waard dat boek te nemen en zijn zegels te openen; want U bent geslacht, en hebt ons voor God gekocht met Uw bloed, uit elk geslacht, en taal, en volk, en natie; en U hebt ons voor onze God gemaakt tot koningen en priesters; en wij zullen als koningen heersen op de aarde. En ik zag, en ik hoorde een stem van veel engelen rondom de troon, en van de dieren, en van de oudsten; en hun aantal was tienduizend maal tienduizend, en duizend maal duizend;", "Ezech 34:23-31": "En Ik zal één Herder over hen doen opstaan, en Hij zal hen weiden, namelijk Mijn knecht David; die zal ze weiden, en Die zal hun tot een Herder zijn. En Ik, de HEERE, zal hun tot een God zijn; en Mijn knecht David zal Vorst zijn te midden van hen, Ik, de HEERE, heb het gesproken. En Ik zal een verbond van vrede met hen maken, en zal het boze gedierte uit het land doen ophouden; en zij zullen zeker wonen in de woestijn, en slapen in de wouden.", "Jer 4:2": "Maar zweer: Zo waarachtig als de HEERE leeft! in waarheid, in recht en in gerechtigheid; dan zullen de heidenvolken zich in Hem zegenen, en zich in Hem beroemen.", "Dan 7:14": "En Hem werd gegeven heerschappij, en eer, en het Koninkrijk, dat alle volken, natiën en talen Hem zouden eren; Zijn heerschappij is een eeuwige heerschappij, die niet zal vergaan, en Zijn Koninkrijk zal niet te gronde gericht worden.", "Ezra 3:2": "En Jesua, de zoon van Jozadak, maakte zich op, en zijn broeders, de priesters, en Zerubbabel, de zoon van Sealthiël, en zijn broeders, en zij bouwden het altaar van de God van Israël, om daarop brandoffers te offeren, zoals geschreven is in de wet van Mozes, de man Gods.", "Zach 9:1": "De last van het woord van de HEERE over het land Chadrach en Damaskus, zijn rustplaats; want de HEERE heeft een oog op de mens, zoals op alle stammen van Israël.", "Neh 12:26": "Dezen waren er in de dagen van Jojakim, de zoon van Jesua, de zoon van Jozadak, en in de dagen van Nehemia, de landvoogd, en van de priester Ezra, de schriftgeleerde.", "Jes 56:3-8": "En de vreemdeling, die zich bij de HEERE gevoegd heeft, moet niet zeggen: De HEERE heeft mij helemaal van Zijn volk gescheiden; en de ontmande moet niet zeggen: Zie, ik ben een dorre boom. Want zo zegt de HEERE van de ontmanden, die Mijn sabbatten houden, en verkiezen wat Mij behaagt, en vasthouden aan Mijn verbond; Ik zal hun ook in Mijn huis en binnen Mijn muren een plaats en een naam geven, beter dan van zonen en dan van dochters; een eeuwige naam zal Ik ieder van hen geven, die niet uitgeroeid zal worden.", "Micha 5:1": "En u, Bethlehem Efratha, bent u klein om te zijn onder de duizenden van Juda? Uit u zal Mij Iemand voortkomen, Die een Heerser zal zijn in Israël, en Wiens uitgangen zijn van oudsher, van de dagen van de eeuwigheid.", "Num 24:17": "Ik zal hem zien, maar nu niet; ik zal hem aanschouwen, maar niet van dichtbij. Er zal een ster voortkomen uit Jakob, en er zal een scepter uit Israël opkomen; die zal de gebieden van de Moabieten verslaan, en al de kinderen van Seth verstoren.", "Matt 11:5": "De blinden worden ziende, en de kreupelen wandelen; de melaatsen worden gereinigd, en de doven horen; de doden worden opgewekt, en de armen wordt het Evangelie verkondigd.", "Ps 138:5": "En zij zullen zingen van de wegen van de HEERE, want de heerlijkheid van de HEERE is groot.", "Ps 126:5": "Die met tranen zaaien, zullen met gejuich maaien.", "Jes 55:5": "Zie, u zult een volk roepen, dat u niet kende, en het volk, dat u niet kende, zal tot u lopen, om de wil van de HEERE, uw God, en om de wil van de Heilige van Israël, want Hij heeft u verheerlijkt.", "Hebr 12:27": "En dit woord: Nog eenmaal, wijst aan de verandering van de dingen die bewegen kunnen, alsof zij gemaakt waren, opdat blijven zouden de dingen die niet bewegen kunnen.", "Ps 89:30": "En Ik zal zijn zaad in eeuwigheid vestigen, en zijn troon als de dagen van de hemelen.", "Dan 8:25": "En door zijn sluwheid zal hij de bedrieglijkheid doen slagen in zijn hand; en hij zal zich in zijn hart verheffen; en in een tijd van schijnbare rust zal hij velen te gronde richten, en hij zal opstaan tegen de Vorst der vorsten, maar hij zal gebroken worden, zonder mensenhand.", "Deut 32:21": "Zij hebben Mij tot ijver verwekt door wat geen God is; zij hebben Mij tot toorn verwekt door hun ijdelheden; Ik dan zal hen tot ijver verwekken door hen die geen volk zijn; door een dwaas volk zal Ik hen tot toorn verwekken.", "Openb 1:18": "en Die leeft, en Ik ben dood geweest; en zie, Ik ben levend tot in alle eeuwigheid. Amen. En Ik heb de sleutels van de hel en van de dood.", "Hebr 8:11": "En zij zullen niet leren, ieder zijn naaste en ieder zijn broeder, en zeggen: Ken de Heere; want zij zullen Mij allen kennen, van de kleinste onder hen tot de grootste onder hen.", "Ps 68:32": "Prinselijke gezanten zullen komen uit Egypte; Morenland zal zich haasten zijn handen tot God uit te strekken.", "Matt 11:11": "Voorwaar, Ik zeg u: onder degenen die uit vrouwen geboren zijn, is niemand opgestaan die groter is dan Johannes de Doper; maar wie de minste is in het Koninkrijk der hemelen, is groter dan hij.", "Openb 19:12": "En Zijn ogen waren als een vlam van het vuur, en op Zijn hoofd waren veel koninklijke hoeden; en Hij had een naam geschreven, die niemand wist, dan Hij Zelf.", "Luk 9:30": "En zie, twee mannen spraken met Hem; dat waren Mozes en Elia,", "Openb 20:11": "En ik zag een grote witte troon, en Hem Die daarop zat, van Wiens aangezicht de aarde en de hemel wegvloden, en er werd geen plaats voor hen gevonden.", "Zach 1:19": "En ik zei tegen de Engel Die met mij sprak: Wat zijn deze? En Hij zei tegen mij: Dat zijn de horens die Juda, Israël en Jeruzalem verstrooid hebben.", "Zach 1:7": "Op de vierentwintigste dag, in de elfde maand (dat is de maand Schebat), in het tweede jaar van Darius, kwam het woord van de HEERE tot Zacharia, de zoon van Berechja, de zoon van Iddo, de profeet, en hij zei:", "Matt 24:36": "Maar die dag en dat uur kent niemand, ook de engelen van de hemelen niet, maar alleen Mijn Vader.", "Hebr 1:5": "Want tegen wie van de engelen heeft Hij ooit gezegd: U bent Mijn Zoon, heden heb Ik U verwekt? En opnieuw: Ik zal Hem tot een Vader zijn, en Hij zal Mij tot een Zoon zijn?", "Matt 25:31": "En wanneer de Zoon des mensen komen zal in Zijn heerlijkheid, en alle heilige engelen met Hem, dan zal Hij zitten op de troon van Zijn heerlijkheid.", "Luk 1:78": "door de innerlijke ontferming van onze God, waarmee de Opgang uit de hoogte naar ons omgezien heeft;", "Dan 7:10": "Een vurige rivier vloeide, en ging voor Hem uit, duizendmaal duizenden dienden Hem, en tien duizendmaal tien duizenden stonden voor Hem; het gericht zette zich, en de boeken werden geopend.", "Joh 19:5": "Jezus kwam dan naar buiten, met de doornenkroon en het purperen kleed. En Pilatus zei tegen hen: Zie, de Mens!", "Mark 14:62": "En Jezus zei: Ik ben het. En u zult de Zoon des mensen zien zitten aan de rechterhand van de kracht van God, en komen met de wolken van de hemel.", "Ex 25:25": "U zult ook een lijst rondom daaraan maken, een hand breed; en u zult een gouden krans rondom die lijst maken.", "Ef 2:20-22": "gebouwd op het fundament van de apostelen en profeten, waarvan Jezus Christus Zelf is de uiterste Hoeksteen; op Wie het hele gebouw, bekwaam samengevoegd, opgroeit tot een heilige tempel in de Heere; op Wie ook u mede gebouwd wordt tot een woonplaats van God in de Geest.", "Jer 23:5": "Zie, de dagen komen, spreekt de HEERE, dat Ik voor David een rechtvaardige Spruit zal doen opstaan; Die zal Koning zijnde regeren, en voorspoedig zijn, en recht en gerechtigheid doen op de aarde.", "Rom 15:26": "Want het heeft hen van Macedonië en Achaje goedgedacht een gezamenlijke bijdrage te doen aan de armen onder de heiligen die in Jeruzalem zijn.", "Zef 2:11": "Vreselijk zal de HEERE tegen hen zijn, want Hij zal al de goden van de aarde doen uitteren; en ieder uit zijn plaats zal Hem aanbidden, alle eilanden van de heidenvolken.", "Joël 3:18": "En het zal op die dag gebeuren dat de bergen zullen druipen van zoete wijn, en de heuvels zullen stromen van melk, en alle stromen van Juda vol water zullen gaan; en er zal een bron uit het huis van de HEERE uitgaan, en die zal het dal van Sittim bewateren.", "Ps 110:1-7": "Een psalm van David. De HEERE heeft tot mijn Heere gesproken: Zit aan Mijn rechterhand, totdat Ik Uw vijanden gezet zal hebben tot een voetbank van Uw voeten. De HEERE zal de scepter van Uw sterkte zenden uit Sion, en zeggen: Heers in het midden van Uw vijanden. Uw volk zal zeer gewillig zijn op de dag van Uw heirkracht, in heilig sieraad; uit de baarmoeder van het dageraad zal U de dauw van Uw jeugd zijn.", "1 Sam 2:8": "Hij verheft de geringe uit het stof, en de nooddruftige verhoogt Hij uit de vuilnis, om hen te doen zitten bij de vorsten, dat Hij hen de stoel van de eer laat beërven; want de fundamenten van het aardrijk zijn van de HEERE, en Hij heeft de wereld daarop gezet.", "Dan 2:40": "En het vierde koninkrijk zal hard zijn als ijzer; want zoals het ijzer alles verbrijzelt en verzwakt, zo zal dat koninkrijk, net als ijzer dat alles verbreekt, alles verbrijzelen en verbreken.", "Openb 5:12": "die met een luide stem zeiden: Het Lam, Dat geslacht is, is waard te ontvangen de kracht, en rijkdom, en wijsheid, en sterkte, en eer, en heerlijkheid, en dankzegging.", "Luk 2:10": "En de engel zei tegen hen: Wees niet bang, want zie, ik verkondig u grote blijdschap, die er voor heel het volk zijn zal;", "Ps 102:19-23": "Dat zal geschreven worden voor het volgende geslacht; en het volk, dat geschapen zal worden, zal de HEERE loven; Omdat Hij uit de hoogte van het heiligdom zal hebben neerwaarts gezien; dat de HEERE uit de hemel op de aarde geschouwd zal hebben; Om het zuchten van de gevangenen te horen, om los te maken de kinderen van de dood;", "Job 2:1": "Er kwam weer een dag dat de kinderen van God kwamen om zich voor de HEERE te stellen, en de satan kwam ook in hun midden om zich voor de HEERE te stellen.", "Jes 55:10-13": "Want zoals de regen en de sneeuw van de hemel neerdaalt, en daarheen niet terugkeert; maar de aarde doorvochtigt, en maakt dat zij voortbrengt en uitspruit, en zaad geeft aan de zaaier, en brood aan de eter; Zo zal Mijn woord, dat uit Mijn mond uitgaat, ook zijn, het zal niet leeg naar Mij terugkeren; maar het zal doen wat Mij behaagt, en het zal voorspoedig zijn in wat, waartoe Ik het zend. Want in blijdschap zult u uittrekken, en met vrede voortgeleid worden; de bergen en heuvelen zullen geschal maken met vrolijk gezang voor uw aangezicht, en alle bomen van het veld zullen de handen samenklappen.", "Zach 14:8-21": "Ook zal het op die dag gebeuren, dat er levend water uit Jeruzalem zal vloeien, de helft daarvan naar de oostzee, en de helft daarvan naar de achterste zee toe; het zal 's zomers en 's winters zijn. En de HEERE zal Koning zijn over de hele aarde; op die dag zal de HEERE één zijn, en Zijn Naam één. Dit hele land zal rondom als een vlak veld gemaakt worden, van Geba tot Rimmon toe, zuidwaarts van Jeruzalem; en zij zal verhoogd en bewoond worden op haar plaats; van de poort van Benjamin af, tot aan de plaats van de eerste poort, tot aan de Hoekpoort toe; en van de toren van Hananeel, tot aan de wijnbakken van de koning toe.", "Jes 6:1-3": "In het jaar dat koning Uzzia stierf, zag ik de Heere zitten op een hoge en verheven troon, en Zijn zomen vulden de tempel. De serafs stonden boven Hem; ieder had zes vleugels; met twee bedekte ieder zijn gezicht, en met twee bedekte hij zijn voeten, en met twee vloog hij. En de een riep tot de ander en zei: Heilig, heilig, heilig is de HEERE van de heerscharen! De hele aarde is vol van Zijn heerlijkheid!", "Openb 3:14": "En schrijf aan de engel van de gemeente van de Laodicensen: Dit zegt de Amen, de trouwe en waarachtige Getuige, het Begin van de schepping van God:", "Ef 1:21": "Ver boven alle overheid, en macht, en kracht, en heerschappij, en elke naam die genoemd wordt, niet alleen in deze wereld, maar ook in de toekomende;", "Matt 26:53": "Of denkt u dat Ik Mijn Vader nu niet kan bidden, en Hij zal Mij meer dan twaalf legioenen engelen ter beschikking stellen?", "Jes 54:1-3": "Zing vrolijk, u onvruchtbare, die niet gebaard hebt! Maak geschal met vrolijk gezang, en juich, die geen barensnood gehad hebt! Want de kinderen van de eenzame zijn meer dan de kinderen van de getrouwde, zegt de HEERE. Maak de plaats van uw tenten wijd, en laat men de gordijnen van uw woningen uitbreiden, verhinder het niet; maak uw koorden lang, en steek uw pinnen vast in. Want u zult uitbreken ter rechter hand en ter linkerhand; en uw nageslacht zal de heidenen erven, en zij zullen de verwoeste steden doen bewonen.", "Openb 6:2": "En ik zag, en zie, een wit paard, en Die daarop zat, had een boog; en Hem is een kroon gegeven, en Hij ging uit, overwinnend, en om te overwinnen!", "Openb 14:6-13": "En ik zag een andere engel, vliegend in het midden van de hemel, en hij had het eeuwige Evangelie, om te verkondigen aan hen die op de aarde wonen, en aan alle natie, en geslacht, en taal, en volk; en hij zei met een luide stem: Vrees God, en geef Hem eer, want het uur van Zijn oordeel is gekomen; en aanbid Hem, Die de hemel, en de aarde, en de zee, en de bronnen van het water gemaakt heeft. En er is een andere engel gevolgd, die zei: Zij is gevallen, zij is gevallen, Babylon, die grote stad, omdat zij uit de wijn van de toorn van haar hoererij alle volken heeft laten drinken.", "Luk 15:7": "Ik zeg u, dat er zo blijdschap zal zijn in de hemel over één zondaar die zich bekeert, meer dan over negenennegentig rechtvaardigen, die de bekering niet nodig hebben.", "Ps 89:20-22": "Toen hebt Gij in een gezicht gesproken van Uw heilige, en gezegd: Ik heb hulp besteld bij een held; Ik heb een verkorene uit het volk verhoogd. Ik heb David, Mijn knecht, gevonden; met Mijn heilige olie heb Ik hem gezalfd; met wie Mijn hand vast blijven zal; ook zal hem Mijn arm versterken.", "Zach 7:1": "Het gebeurde in het vierde jaar van koning Darius, dat het woord van de HEERE kwam tot Zacharia, op de vierde dag van de negende maand, namelijk in Chisleu.", "Neh 11:10": "Van de priesters: Jedaja, de zoon van Jojarib, Jachin;", "Zach 1:18": "En ik hief mijn ogen op, en zag; en zie, er waren vier horens.", "Jes 33:5": "De HEERE is verheven, want Hij woont in de hoogte; Hij heeft Sion vervuld met recht en gerechtigheid.", "Dan 12:1-13": "En in die tijd zal Michaël opstaan, die grote vorst, die voor de kinderen van uw volk staat, als het zo'n tijd van benauwdheid zal zijn, als er niet geweest is sinds er een volk geweest is, tot op die tijd toe; en in die tijd zal uw volk verlost worden, ieder die gevonden wordt geschreven te zijn in het boek. En velen van hen die in het stof van de aarde slapen, zullen ontwaken, dezen tot eeuwig leven, en anderen tot versmaadheden en tot eeuwige afgrijzing. De leraars nu zullen blinken als de glans van het uitspansel, en zij die er velen rechtvaardigen, gelijk de sterren, voor altijd en eeuwig.", "Openb 22:8": "En ik, Johannes, ben degene die deze dingen gezien en gehoord heeft. En toen ik ze gehoord en gezien had, viel ik neer om aan te bidden voor de voeten van de engel die mij deze dingen toonde.", "Dan 4:35": "En alle inwoners van de aarde worden als niets geacht, en Hij doet naar Zijn wil met het leger van de hemel en de inwoners van de aarde, en er is niemand die Zijn hand kan tegenhouden, of tegen Hem kan zeggen: Wat doet U?", "Gen 13:17": "Maak u op, doorwandel dit land, in zijn lengte en in zijn breedte; want Ik zal het u geven.", "2 Kron 16:9": "Want wat de HEERE betreft, Zijn ogen doorlopen de hele aarde, om Zich sterk te bewijzen aan hen wier hart volkomen is tot Hem; hierin heeft u dwaas gedaan; want van nu af zullen er oorlogen tegen u zijn.", "Jer 31:34": "En zij zullen niet meer, ieder zijn naaste, en ieder zijn broeder, onderwijzen door te zeggen: Kent de HEERE! Want zij zullen Mij allen kennen, van hun kleinste tot hun grootste toe, spreekt de HEERE; want Ik zal hun ongerechtigheid vergeven, en aan hun zonden niet meer denken.", "Matt 12:17-21": "Opdat vervuld zou worden wat gesproken is door de profeet Jesaja, die zei: Zie, Mijn Knecht, Die Ik uitgekozen heb; Mijn Beminde, in Wie Mijn ziel een welbehagen heeft; Ik zal Mijn Geest op Hem leggen, en Hij zal het oordeel aan de heidenen verkondigen. Hij zal niet twisten, en niet roepen, en niemand zal Zijn stem op de straten horen.", "Matt 26:61": "en zeiden: Deze heeft gezegd: Ik kan de tempel van God afbreken en in drie dagen weer opbouwen.", "Matt 13:31-33": "Een andere gelijkenis heeft Hij hun voorgehouden en zei: Het Koninkrijk der hemelen is gelijk aan een mosterdzaadje, dat een mens genomen heeft en in zijn akker gezaaid heeft; Dat wel het kleinste is van alle zaden, maar wanneer het opgegroeid is, is het het grootste van de tuingewassen, en het wordt een boom, zodat de vogels van de hemel komen en nestelen in zijn takken. Een andere gelijkenis sprak Hij tot hen: Het Koninkrijk der hemelen is gelijk aan zuurdesem, die een vrouw nam en verborg in drie maten van het meel, totdat het geheel gezuurd was.", "Jes 61:1-11": "De Geest van de Heere HEERE is op Mij, omdat de HEERE Mij gezalfd heeft, om een blijde boodschap te brengen aan de zachtmoedigen; Hij heeft Mij gezonden om te verbinden de gebrokenen van hart, om de gevangenen vrijheid uit te roepen, en de gebondenen opening van de gevangenis; Om uit te roepen het jaar van het welbehagen van de HEERE, en de dag van de wraak van onze God; om alle treurenden te troosten; Om de treurenden van Sion te geven, dat hun sieraad gegeven wordt voor as, vreugdeolie voor treurigheid, het gewaad van lof voor een benauwde geest; opdat zij eikenbomen van de gerechtigheid genoemd worden, een planting van de HEERE, opdat Hij verheerlijkt wordt.", "Ps 68:33": "U koninkrijken van de aarde, zingt voor God; zingt psalmen voor de Heere! Sela.", "Zach 1:8": "Ik zag 's nachts, en zie, een Man rijdend op een rood paard, en Hij stond tussen de mirten die in de diepte waren; en achter Hem waren rode, bruine en witte paarden.", "Matt 12:6": "En Ik zeg u, dat hier Iemand is die meer is dan de tempel.", "Jes 44:3-5": "Want Ik zal water gieten op de dorstige, en stromen op het droge; Ik zal Mijn Geest op uw nageslacht gieten, en Mijn zegen op uw nakomelingen. En zij zullen uitspruiten tussen het gras, als de wilgen aan de waterbeken. Deze zal zeggen: Ik ben van de HEERE; en die zal zich noemen met de naam van Jakob; en weer een ander zal met zijn hand schrijven: Ik ben van de HEERE, en zich noemen met de naam van Israël.", "Zach 8:20-23": "Zo zegt de HEERE van de heerscharen: Nog zal het gebeuren, dat de volken, en de inwoners van veel steden, komen zullen; En de inwoners van de ene stad zullen gaan naar de inwoners van de andere, en zeggen: Laten wij vlijtig heengaan om het aangezicht van de HEERE te smeken, en om de HEERE van de heerscharen te zoeken; ik zal ook heengaan. Zo zullen veel volken, en machtige heidenvolken komen, om de HEERE van de heerscharen te Jeruzalem te zoeken, en om het aangezicht van de HEERE te smeken.", "Matt 13:16": "Maar uw ogen zijn gelukkig, omdat zij zien, en uw oren, omdat zij horen.", "Matt 19:30": "Maar veel eersten zullen de laatsten zijn, en veel laatsten de eersten.", "Ps 85:10-12": "Zeker, Zijn heil is nabij hen die Hem vrezen, opdat in ons land eer woont. De goedertierenheid en waarheid zullen elkaar ontmoeten; de gerechtigheid en vrede zullen elkaar kussen. De waarheid zal uit de aarde opkomen, en gerechtigheid zal vanuit de hemel neerzien.", "Hagg 2:8": "Ja, Ik zal alle heidenvolken doen beven, en zij zullen komen tot de Wens van alle heidenvolken, en Ik zal dit huis met heerlijkheid vervullen, zegt de HEERE van de heerscharen.", "Openb 20:1-3": "En ik zag een engel neerkomen uit de hemel, die de sleutel van het afgrond had, en een grote keten in zijn hand; En hij greep de draak, de oude slang, die de duivel is en satan, en bond hem duizend jaar; En wierp hem in het afgrond, en sloot hem daarin, en verzegelde het boven hem, opdat hij de volken niet meer verleiden zou, totdat de duizend jaar geëindigd zouden zijn. En daarna moet hij een korte tijd losgelaten worden.", "Jes 41:17-20": "De ellendigen en behoeftigen zoeken water, maar er is geen; hun tong versmacht van dorst; Ik, de HEERE, zal hen verhoren, Ik, de God van Israël, zal hen niet verlaten. Ik zal rivieren openen op de hoge plaatsen, en bronnen in het midden van de valleien; Ik zal de woestijn tot een waterpoel maken, en het dorre land tot waterbronnen. Ik zal in de woestijn de cederboom, de sittimboom, en de mirteboom, en de olieboom zetten; Ik zal in de wildernis de denneboom, de beuk, en de busboom samen plaatsen;", "Ps 89:24": "Maar Ik zal zijn wederpartijders verpletteren voor zijn aangezicht, en die hem haten, zal Ik plagen.", "Openb 6:4": "En een ander paard ging uit, dat rood was; en hem, die daarop zat, werd macht gegeven de vrede van de aarde te nemen; en dat zij elkaar zouden doden; en hem werd een groot zwaard gegeven.", "Ps 24:7-10": "Heft uw hoofden op, poorten, en verhef u, eeuwige deuren, opdat de Koning der ere ingaat! Wie is de Koning der ere? De HEERE, sterk en geweldig, de HEERE, geweldig in de strijd. Heft uw hoofden op, poorten, ja, heft op, eeuwige deuren! opdat de Koning der ere ingaat!", "Luk 19:27": "Maar breng die vijanden van mij, die niet wilden dat ik koning over hen zou zijn, hier, en dood ze hier voor mij.", "Mark 8:38": "Want wie zich voor Mij en Mijn woorden zal schamen, in dit overspelig en zondig geslacht, voor hem zal ook de Zoon des mensen Zich schamen, wanneer Hij komt in de heerlijkheid van Zijn Vader, met de heilige engelen.", "Jes 2:2-5": "En het zal gebeuren in de laatste dagen, dat de berg van het huis van de HEERE vastgesteld zal zijn op de top van de bergen, en dat hij verheven zal worden boven de heuvels, en tot hem zullen alle heidenvolken toevloeien. En veel volken zullen heengaan en zeggen: Kom, laat ons opgaan tot de berg van de HEERE, tot het huis van de God van Jakob, opdat Hij ons leert van Zijn wegen, en dat wij wandelen in Zijn paden; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem. En Hij zal rechtspreken onder de heidenvolken, en bestraffen veel volken; en zij zullen hun zwaarden slaan tot spaden, en hun speren tot snoeimessen; het ene volk zal tegen het andere volk geen zwaard opheffen, en zij zullen geen oorlog meer leren.", "Jes 18:7": "In die tijd zal de HEERE van de heerscharen een geschenk gebracht worden van het volk dat lang en glad is, en van het volk dat gevreesd is van oudsher tot nu; een volk van regel en regel, en van vertreding, welks land de rivieren beroven; naar de plaats van de Naam van de HEERE van de heerscharen, naar de berg Sion.", "Mark 9:4": "En aan hen verschenen Elia met Mozes, en zij spraken met Jezus.", "Mark 13:10": "En het Evangelie moet eerst gepredikt worden onder alle volken.", "Hebr 2:7": "U hebt hem een weinig minder gemaakt dan de engelen; met heerlijkheid en eer hebt U hem gekroond, en hebt U hem gesteld over de werken van Uw handen;", "Jes 35:2": "Zij zal uitbundig bloeien, en zich verheugen, ja, met verheuging, en juichen; de heerlijkheid van Libanon is haar gegeven, het sieraad van Karmel en Saron; zij zullen de heerlijkheid van de HEERE zien, het sieraad van onze God.", "Luk 1:32": "Hij zal groot zijn, en de Zoon van de Allerhoogste genoemd worden; en God, de Heere, zal Hem de troon van Zijn vader David geven.", "Jer 46:10": "Maar deze dag is van de Heere, de HEERE van de heerscharen, een dag van wraak, dat Hij zich wreekt van Zijn tegenstanders, en het zwaard zal verslinden, en verzadigd, en dronken worden van hun bloed; want de Heere, HEERE van de heerscharen, heeft een slachtoffer in het land van het noorden, aan de rivier Frath.", "Matt 16:18": "En Ik zeg u ook, dat u Petrus bent, en op deze petra zal Ik Mijn gemeente bouwen, en de poorten van de hel zullen haar niet overweldigen.", "Ezra 10:18": "En er werden gevonden van de zonen van de priesters die vreemde vrouwen bij zich hadden laten wonen: van de zonen van Jesua, de zoon van Jozadak, en zijn broers, Maaseja, en Eliëzer, en Jarib, en Gedalja.", "Joh 8:35": "En de dienstknecht blijft niet eeuwig in het huis, de zoon blijft er eeuwig.", "Jes 43:13": "Ook eer de dag was, ben Ik, en er is niemand, die uit Mijn hand redden kan; Ik zal werken, en wie zal het keren?", "1 Kon 22:19": "Verder zei hij: Daarom, hoor het woord van de HEERE: Ik zag de HEERE zitten op Zijn troon, en heel het hemelse leger stond naast Hem, aan Zijn rechterhand en aan Zijn linkerhand.", "Zach 14:8": "Ook zal het op die dag gebeuren, dat er levend water uit Jeruzalem zal vloeien, de helft daarvan naar de oostzee, en de helft daarvan naar de achterste zee toe; het zal 's zomers en 's winters zijn.", "Jes 11:1-10": "Want er zal een Rijsje v
