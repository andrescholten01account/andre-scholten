hannes","href":"../../1-johannes/1/"},{"naam":"2 Johannes","href":"../../2-johannes/1/"},{"naam":"3 Johannes","href":"../../3-johannes/1/"},{"naam":"Judas","href":"../../judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Toen de ark van de HEERE nu zeven maanden in het land van de Filistijnen geweest was,","2":"riepen de Filistijnen de priesters en de waarzeggers en zeiden: Wat zullen wij met de ark van de HEERE doen? Laat ons weten waarmee wij haar naar haar plaats zenden zullen.","3":"Zij dan zeiden: Als u de ark van de God van Israël wegzendt, zend haar niet leeg weg, maar geef Hem in elk geval een schuldoffer terug; dan zult u genezen worden, en aan u zal bekend worden waarom Zijn hand niet van u afwijkt.","4":"Toen zeiden zij: Welk schuldoffer is dat, dat wij Hem teruggeven zullen? En zij zeiden: Vijf gouden gezwellen en vijf gouden muizen, naar het aantal van de vorsten van de Filistijnen; want het is één en dezelfde plaag over u allen en over uw vorsten.","5":"Maak dan beelden van uw gezwellen, en beelden van uw muizen die het land verderven, en geef de God van Israël de eer; misschien zal Hij Zijn hand verlichten van boven u, en van boven uw god, en van boven uw land.","6":"Waarom toch zou u uw hart verharden, zoals de Egyptenaars en farao hun hart verhard hebben? Hebben zij niet, toen Hij *wonderlijk* met hen gehandeld had, hen laten trekken, zodat zij heengingen?","7":"Neem dan nu en maak een nieuwe wagen, en twee zogende koeien waarop geen juk gekomen is; span de koeien voor de wagen, en breng hun kalveren van achter hen terug naar huis.","8":"Neem dan de ark van de HEERE, en zet haar op de wagen, en leg de gouden kleinoden die u Hem als schuldoffer teruggeeft in een koffertje aan haar zijde; en zend haar weg, zodat zij vertrekt.","9":"Kijk dan toe: als zij de weg naar haar eigen gebied opgaat naar Beth-Semes, dan heeft Hij ons dit grote kwaad gedaan; maar zo niet, dan zullen wij weten dat Zijn hand ons niet geraakt heeft; het is ons een toeval geweest.","10":"En die mannen deden zo, en namen twee zogende koeien, en spanden ze voor de wagen, en hun kalveren sloten zij op in huis.","11":"En zij zetten de ark van de HEERE op de wagen, en het koffertje met de gouden muizen en de beelden van hun gezwellen.","12":"De koeien nu gingen recht op die weg, op de weg naar Beth-Semes op één straat; zij gingen steeds voort, al loeiend, en weken noch naar rechts noch naar links af; en de vorsten van de Filistijnen gingen achter hen aan tot aan het gebied van Beth-Semes.","13":"En de mensen van Beth-Semes maaiden de tarweoogst in het dal, en toen zij hun ogen opsloegen, zagen zij de ark en verblijdden zich toen zij haar zagen.","14":"En de wagen kwam op de akker van Jozua, de Beth-Semiet, en bleef daar staan; en daar was een grote steen, en zij kloofden het hout van de wagen, en offerden de koeien de HEERE als brandoffer.","15":"En de Levieten haalden de ark van de HEERE eraf en het koffertje dat erbij was, waarin de gouden kleinoden waren, en zetten ze op die grote steen; en de mensen van Beth-Semes brachten brandoffers en slachtten slachtoffers voor de HEERE, op diezelfde dag.","16":"En toen de vijf vorsten van de Filistijnen dat gezien hadden, keerden zij diezelfde dag terug naar Ekron.","17":"Dit nu zijn de gouden gezwellen die de Filistijnen aan de HEERE als schuldoffer teruggegeven hebben: voor Asdod één, voor Gaza één, voor Askelon één, voor Gath één, voor Ekron één.","18":"Ook gouden muizen, naar het aantal van alle steden van de Filistijnen onder de vijf vorsten, van de versterkte steden af tot aan de dorpen zonder muur; en tot aan Abel, de grote steen, waarop zij de ark van de HEERE neergezet hadden, die tot op deze dag op de akker van Jozua, de Beth-Semiet, is.","19":"En de Heere sloeg onder de mensen van Beth-Semes, omdat zij in de ark van de HEERE gekeken hadden; ja, Hij sloeg van het volk zeventig mannen, en vijftigduizend mannen. Toen bedreef het volk rouw, omdat de HEERE een grote slag onder het volk geslagen had.","20":"Toen zeiden de mensen van Beth-Semes: Wie zou kunnen bestaan voor het aangezicht van de HEERE, deze heilige God? En naar wie zal Hij van ons wegtrekken?","21":"Zo zonden zij boden naar de inwoners van Kirjath-Jearim en zeiden: De Filistijnen hebben de ark van de HEERE teruggebracht; kom naar beneden, haal haar op naar u toe."},"SV":{"1":"Als nu de ark des HEEREN zeven maanden in het land der Filistijnen geweest was,","2":"Zo riepen de Filistijnen de priesters en de waarzeggers, zeggende: Wat zullen wij met de ark des HEEREN doen? Laat ons weten, waarmede wij ze aan haar plaats zenden zullen.","3":"Zij dan zeiden: Indien gij de ark des Gods van Israël wegzendt, zendt haar niet ledig weg, maar vergeldt Hem ganselijk een schuldoffer; dan zult gij genezen worden, en ulieden zal bekend worden, waarom Zijn hand van u niet afwijkt.","4":"Toen zeiden zij: Welk is dat schuldoffer, dat wij Hem vergelden zullen? En zij zeiden: Vijf gouden spenen, en vijf gouden muizen, naar het getal van de vorsten der Filistijnen; want het is enerlei plaag over u allen, en over uw vorsten.","5":"Zo maakt dan beelden uwer spenen, en beelden uwer muizen, die het land verderven, en geeft den God van Israël de eer; misschien zal Hij Zijn hand verlichten van over ulieden, en van over uw god, en van over uw land.","6":"Waarom toch zoudt gijlieden uw hart verzwaren, gelijk de Egyptenaars en Farao hun hart verzwaard hebben? Hebben zij niet, toen Hij *wonderlijk* met hen gehandeld had, hen laten trekken, dat zij heengingen?","7":"Nu dan, neemt en maakt een nieuwen wagen, en twee zogende koeien, op dewelke geen juk gekomen is; spant de koeien aan den wagen, en brengt haar kalveren van achter haar weder naar huis.","8":"Neemt dan de ark des HEEREN, en zet ze op den wagen, en legt de gouden kleinoden, die gij Hem ten schuldoffer vergelden zult, in een koffertje aan haar zijde; en zendt ze weg, dat zij heenga.","9":"Ziet dan toe, indien zij den weg van haar landpale opgaat naar Beth-semes, zo heeft Hij ons dit groot kwaad gedaan; maar zo niet, zo zullen wij weten, dat Zijn hand ons niet geraakt heeft; het is ons een toeval geweest.","10":"En die lieden deden alzo, en namen twee zogende koeien, en spanden ze aan den wagen, en haar kalveren sloten zij in huis.","11":"En zij zetten de ark des HEEREN op den wagen, en het koffertje met de gouden muizen, en de beelden hunner spenen.","12":"De koeien nu gingen recht in dien weg, op den weg naar Beth-semes op een straat; zij gingen steeds voort, al loeiende, en weken noch ter rechter *hand* noch ter linkerhand; en de vorsten der Filistijnen gingen achter dezelve tot aan de landpale van Beth-semes.","13":"En die van Beth-semes maaiden den tarweoogst in het dal, en als zij hun ogen ophieven, zagen zij de ark en verblijdden zich, als zij *die* zagen.","14":"En de wagen kwam op den akker van Jozua, den Beth-semiet, en bleef daar staande; en daar was een grote steen, en zij kloofden het hout van den wagen, en offerden de koeien den HEERE ten brandoffer.","15":"En de Levieten namen de ark des HEEREN af en het koffertje, dat daarbij was, waarin de gouden kleinoden waren, en zetten ze op dien groten steen; en die lieden van Beth-semes offerden brandofferen, en slachtten slachtofferen den HEERE, op denzelven dag.","16":"En als de vijf vorsten der Filistijnen zulks gezien hadden, zo keerden zij weder op denzelven dag naar Ekron.","17":"Dit nu zijn de gouden spenen, die de Filistijnen aan den HEERE ten schuldoffer vergolden hebben: Voor Asdod een voor Gaza een, voor Askelon een, voor Gath een, voor Ekron een.","18":"Ook gouden muizen, naar het getal van alle steden der Filistijnen, onder de vijf vorsten, van de vaste steden af tot aan de landvlekken; en tot aan Abel, den groten *steen*, op denwelken zij de ark des HEEREN nedergesteld hadden, die tot op dezen dag is op den akker van Jozua, den Beth-semiet.","19":"En *de* *Heere* sloeg onder die lieden van Beth-semes, omdat zij in de ark des HEEREN gezien hadden; ja, Hij sloeg van het volk zeventig mannen, *en* vijftig duizend mannen. Toen bedreef het volk rouw, omdat de HEERE een groten slag onder het volk geslagen had.","20":"Toen zeiden de lieden van Beth-semes: Wie zou kunnen bestaan voor het aangezicht van den HEERE, dezen heiligen God? En tot wien van ons zal Hij optrekken?","21":"Zo zonden zij boden tot de inwoners van Kirjath-jearim, zeggende: De Filistijnen hebben de ark des HEEREN wedergebracht; komt af, haalt ze opwaarts tot u."},"KJV":{"1":"And the ark of the LORD was in the country of the Philistines seven months.","2":"And the Philistines called for the priests and the diviners, saying, What shall we do to the ark of the LORD? tell us wherewith we shall send it to his place.","3":"And they said, If ye send away the ark of the God of Israel, send it not empty; but in any wise return him a trespass offering: then ye shall be healed, and it shall be known to you why his hand is not removed from you.","4":"Then said they, What shall be the trespass offering which we shall return to him? They answered, Five golden emerods, and five golden mice, according to the number of the lords of the Philistines: for one plague was on you all, and on your lords.","5":"Wherefore ye shall make images of your emerods, and images of your mice that mar the land; and ye shall give glory unto the God of Israel: peradventure he will lighten his hand from off you, and from off your gods, and from off your land.","6":"Wherefore then do ye harden your hearts, as the Egyptians and Pharaoh hardened their hearts? when he had wrought wonderfully among them, did they not let the people go, and they departed?","7":"Now therefore make a new cart, and take two milch kine, on which there hath come no yoke, and tie the kine to the cart, and bring their calves home from them:","8":"And take the ark of the LORD, and lay it upon the cart; and put the jewels of gold, which ye return him for a trespass offering, in a coffer by the side thereof; and send it away, that it may go.","9":"And see, if it goeth up by the way of his own coast to Bethshemesh, then he hath done us this great evil: but if not, then we shall know that it is not his hand that smote us: it was a chance that happened to us.","10":"And the men did so; and took two milch kine, and tied them to the cart, and shut up their calves at home:","11":"And they laid the ark of the LORD upon the cart, and the coffer with the mice of gold and the images of their emerods.","12":"And the kine took the straight way to the way of Bethshemesh, and went along the highway, lowing as they went, and turned not aside to the right hand or to the left; and the lords of the Philistines went after them unto the border of Bethshemesh.","13":"And they of Bethshemesh were reaping their wheat harvest in the valley: and they lifted up their eyes, and saw the ark, and rejoiced to see it.","14":"And the cart came into the field of Joshua, a Bethshemite, and stood there, where there was a great stone: and they clave the wood of the cart, and offered the kine a burnt offering unto the LORD.","15":"And the Levites took down the ark of the LORD, and the coffer that was with it, wherein the jewels of gold were, and put them on the great stone: and the men of Bethshemesh offered burnt offerings and sacrificed sacrifices the same day unto the LORD.","16":"And when the five lords of the Philistines had seen it, they returned to Ekron the same day.","17":"And these are the golden emerods which the Philistines returned for a trespass offering unto the LORD; for Ashdod one, for Gaza one, for Askelon one, for Gath one, for Ekron one;","18":"And the golden mice, according to the number of all the cities of the Philistines belonging to the five lords, both of fenced cities, and of country villages, even unto the great stone of Abel, whereon they set down the ark of the LORD: which stone remaineth unto this day in the field of Joshua, the Bethshemite.","19":"And he smote the men of Bethshemesh, because they had looked into the ark of the LORD, even he smote of the people fifty thousand and threescore and ten men: and the people lamented, because the LORD had smitten many of the people with a great slaughter.","20":"And the men of Bethshemesh said, Who is able to stand before this holy LORD God? and to whom shall he go up from us?","21":"And they sent messengers to the inhabitants of Kirjathjearim, saying, The Philistines have brought again the ark of the LORD; come ye down, and fetch it up to you."}},"tsk":{"1":[{"kopje":"de ark","refs":["1 Sam 5:1","1 Sam 5:3","1 Sam 5:10","1 Sam 5:11","Ps 78:61"]}],"2":[{"kopje":"riepen","refs":["Gen 41:8","Ex 7:11","Jes 47:12","Jes 47:13","Dan 2:2","Dan 5:7","Matt 2:4"]},{"kopje":"waarmee","refs":["Micha 6:6-9"]}],"3 \">lords.</span>","5":"Wherefore ye shall <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> <span class=\"wl wl-kjv\" data-code=\"H6754\">images</span> of your <span class=\"wl wl-kjv\" data-code=\"H2914\">emerods,</span> and <span class=\"wl wl-kjv\" data-code=\"H6754\">images</span> of your <span class=\"wl wl-kjv\" data-code=\"H5909\">mice</span> that <span class=\"wl wl-kjv\" data-code=\"H7843\">mar</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land;</span> and ye shall <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> unto the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> peradventure he will <span class=\"wl wl-kjv\" data-code=\"H7043\">lighten</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> from off you, and from off your <span class=\"wl wl-kjv\" data-code=\"H430\">gods,</span> and from off your <span class=\"wl wl-kjv\" data-code=\"H776\">land.</span>","6":"Wherefore then do ye <span class=\"wl wl-kjv\" data-code=\"H3513\">harden</span> your <span class=\"wl wl-kjv\" data-code=\"H3824\">hearts,</span> as the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians</span> and <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> <span class=\"wl wl-kjv\" data-code=\"H3513\">hardened</span> their <span class=\"wl wl-kjv\" data-code=\"H3820\">hearts?</span> when he had wrought <span class=\"wl wl-kjv\" data-code=\"H5953\">wonderfully</span> among them, did they not let the people <span class=\"wl wl-kjv\" data-code=\"H7971\">go,</span> and they <span class=\"wl wl-kjv\" data-code=\"H3212\">departed?</span>","7":"Now therefore <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> <span class=\"wl wl-kjv\" data-code=\"H259\">a</span> <span class=\"wl wl-kjv\" data-code=\"H2319\">new</span> <span class=\"wl wl-kjv\" data-code=\"H5699\">cart,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H5763\">milch</span> <span class=\"wl wl-kjv\" data-code=\"H6510\">kine,</span> on which there hath <span class=\"wl wl-kjv\" data-code=\"H5927\">come</span> no <span class=\"wl wl-kjv\" data-code=\"H5923\">yoke,</span> and <span class=\"wl wl-kjv\" data-code=\"H631\">tie</span> the <span class=\"wl wl-kjv\" data-code=\"H6510\">kine</span> to the <span class=\"wl wl-kjv\" data-code=\"H5699\">cart,</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">bring</span> their <span class=\"wl wl-kjv\" data-code=\"H1121\">calves</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">home</span> from <span class=\"wl wl-kjv\" data-code=\"H310\">them:</span>","8":"And <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">lay</span> it upon the <span class=\"wl wl-kjv\" data-code=\"H5699\">cart;</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> the <span class=\"wl wl-kjv\" data-code=\"H3627\">jewels</span> of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> which ye <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> him for a trespass <span class=\"wl wl-kjv\" data-code=\"H817\">offering,</span> in a <span class=\"wl wl-kjv\" data-code=\"H712\">coffer</span> by the <span class=\"wl wl-kjv\" data-code=\"H6654\">side</span> thereof; and send it <span class=\"wl wl-kjv\" data-code=\"H7971\">away,</span> that it may <span class=\"wl wl-kjv\" data-code=\"H1980\">go.</span>","9":"And <span class=\"wl wl-kjv\" data-code=\"H7200\">see,</span> if it goeth <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> by the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of his own <span class=\"wl wl-kjv\" data-code=\"H1366\">coast</span> to an> took the <span class=\"wl wl-kjv\" data-code=\"H3474\">straight</span> <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> to the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of <span class=\"wl wl-kjv\" data-code=\"H1053\">Bethshemesh,</span> and went <span class=\"wl wl-kjv\" data-code=\"H1980\">along</span> the <span class=\"wl wl-kjv\" data-code=\"H4546\">highway,</span> <span class=\"wl wl-kjv\" data-code=\"H1600\">lowing</span> as they <span class=\"wl wl-kjv\" data-code=\"H1980\">went,</span> and turned not <span class=\"wl wl-kjv\" data-code=\"H5493\">aside</span> to the right <span class=\"wl wl-kjv\" data-code=\"H3225\">hand</span> or to the <span class=\"wl wl-kjv\" data-code=\"H8040\">left;</span> and the <span class=\"wl wl-kjv\" data-code=\"H5633\">lords</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> them unto the <span class=\"wl wl-kjv\" data-code=\"H1366\">border</span> of <span class=\"wl wl-kjv\" data-code=\"H1053\">Bethshemesh.</span>","13":"And they of <span class=\"wl wl-kjv\" data-code=\"H1053\">Bethshemesh</span> were <span class=\"wl wl-kjv\" data-code=\"H7114\">reaping</span> their <span class=\"wl wl-kjv\" data-code=\"H2406\">wheat</span> <span class=\"wl wl-kjv\" data-code=\"H7105\">harvest</span> in the <span class=\"wl wl-kjv\" data-code=\"H6010\">valley:</span> and they lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> their <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> the <span class=\"wl wl-kjv\" data-code=\"H727\">ark,</span> and <span class=\"wl wl-kjv\" data-code=\"H8055\">rejoiced</span> to <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> it.","14":"And the <span class=\"wl wl-kjv\" data-code=\"H5699\">cart</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> into the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> of <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua,</span> a <span class=\"wl wl-kjv\" data-code=\"H1030\">Bethshemite,</span> and <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> there, where there was a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stone:</span> and they <span class=\"wl wl-kjv\" data-code=\"H1234\">clave</span> the <span class=\"wl wl-kjv\" data-code=\"H6086\">wood</span> of the <span class=\"wl wl-kjv\" data-code=\"H5699\">cart,</span> and <span class=\"wl wl-kjv\" data-code=\"H5927\">offered</span> the <span class=\"wl wl-kjv\" data-code=\"H6510\">kine</span> a burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","15":"And the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> took <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and the <span class=\"wl wl-kjv\" data-code=\"H712\">coffer</span> that was with it, wherein the <span class=\"wl wl-kjv\" data-code=\"H3627\">jewels</span> of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> were, and <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> them on the <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stone:</span> and the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H1053\">Bethshemesh</span> <span class=\"wl wl-kjv\" data-code=\"H5927\">offered</span> burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offerings</span> and <span class=\"wl wl-kjv\" data-code=\"H2076\">sacrificed</span> <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifices</span> the same <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","16":"And when the <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H5633\">lords</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> had <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> it, they <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> to <span class=\"wl wl-kjv\" data-code=\"H6138\">Ekron</span> the same <span class=\"wl wl-kjv\" data-code=\"H3117\">day.</span>","17":"And these are the <span class=\"wl wl-kjv\" data-code=\"H2091\">golden</span> <span class=\"wl wl-kjv\" data-code=\"H2914\">emerods</span> which the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> for a trespass <span class=\"wl wl-kjv\" data-code=\"H817\">offering</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> for <span class=\"wl wl-kjv\" data-code=\"H795\">Ashdod</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one,</span> for <span class=\"wl wl-kjv\" data-code=\"H5804\">Gaza</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one,</span> for <span class=\"wl wl-kjv\" data-code=\"H831\">Askelon</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one,</span> for <span class=\"wl wl-kjv\" data-code=\"H1661\">Gath</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one,</span> for <span class=\"wl wl-kjv\" data-code=\"H6138\">Ekron</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one;</span>","18":"And the <span class=\"wl wl-kjv\" data-code=\"H2091\">golden</span> <span class=\"wl wl-kjv\" data-code=\"H5909\">mice,</span> according to the <span class=\"wl wl-kjv\" data-code=\"H4557\">number</span> of all the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> belonging to the <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H5633\">lords,</span> both of <span class=\"wl wl-kjv\" data-code=\"H4013\">fenced</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">cities,</span> and of <span class=\"wl wl-kjv\" data-code=\"H6521\">country</span> <span class=\"wl wl-kjv\" data-code=\"H3724\">villages,</span> even unto the <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> stone of <span class=\"wl wl-kjv\" data-code=\"H59\">Abel,</span> whereon they set <span class=\"wl wl-kjv\" data-code=\"H3240\">down</span> the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> which stone remaineth unto this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> of <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua,</span> the <span class=\"wl wl-kjv\" data-code=\"H1030\">Bethshemite.</span>","19":"And he <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> the <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H1053\">Bethshemesh,</span> because they had <span class=\"wl wl-kjv\" data-code=\"H7200\">looked</span> into the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> even he <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H2572\">fifty</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> and threescore and <span class=\"wl wl-kjv\" data-code=\"H7657\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men:</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H56\">lamented,</span> because the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> had <span class=\"wl wl-kjv\" data-code=\"H5221\">smitten</span> many of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> with a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4347\">slaughter.</span>","20":"And the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H1053\">Bethshemesh</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Who is <span class=\"wl wl-kjv\" data-code=\"H3201\">able</span> to <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> this <span class=\"wl wl-kjv\" data-code=\"H6918\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God?</span> and to whom shall he go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> from us?","21":"And they <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> to the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of <span class=\"wl wl-kjv\" data-code=\"H7157\">Kirjathjearim,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> The <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> have brought <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> come ye <span class=\"wl wl-kjv\" data-code=\"H3381\">down,</span> and fetch it <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to you."}};

    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
