hannes","href":"../../1-johannes/1/"},{"naam":"2 Johannes","href":"../../2-johannes/1/"},{"naam":"3 Johannes","href":"../../3-johannes/1/"},{"naam":"Judas","href":"../../judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Toen bad Hanna en zei: Mijn hart springt van vreugde op in de HEERE; mijn hoorn is verhoogd in de HEERE; mijn mond is wijd opengedaan over mijn vijanden; want ik verheug mij in Uw heil.","2":"Er is niemand heilig, zoals de HEERE; want er is niemand dan U, en er is geen rotssteen, zoals onze God!","3":"Maak het niet te veel, dat u hoog, hoog zou spreken, dat iets hards uit uw mond zou gaan; want de HEERE is een God van wetenschappen, en Zijn daden zijn recht gedaan.","4":"De boog van de sterken is gebroken; en zij die struikelden, zijn met sterkte omgord.","5":"Zij die verzadigd waren, hebben zich verhuurd om brood, en zij die hongerig waren, hebben opgehouden; totdat de onvruchtbare zeven heeft gebaard, en zij die veel kinderen had, krachteloos is geworden.","6":"De HEERE doodt en maakt levend; Hij doet naar het graf neerdalen, en Hij doet *weer* opkomen.","7":"De HEERE maakt arm en maakt rijk; Hij vernedert, ook verhoogt Hij.","8":"Hij verheft de geringe uit het stof, *en* de nooddruftige verhoogt Hij uit de vuilnis, om hen te doen zitten bij de vorsten, dat Hij hen de stoel van de eer laat beërven; want de fundamenten van het aardrijk zijn van de HEERE, en Hij heeft de wereld daarop gezet.","9":"Hij zal de voeten van Zijn gunstgenoten bewaren; maar de goddelozen zullen zwijgen in duisternis; want een man vermag niet door kracht.","10":"Zij die met de HEERE twisten, zullen verpletterd worden; Hij zal in de hemel over hen donderen; de HEERE zal de einden van de aarde richten, en zal Zijn Koning sterkte geven, en de hoorn van Zijn Gezalfde verhogen.","11":"Daarna ging Elkana naar Rama, naar zijn huis; maar de jongen diende de HEERE voor het aangezicht van de priester Eli.","12":"Doch de zonen van Eli waren kinderen van Belial; zij kenden de HEERE niet.","13":"Want de gewoonte van deze priesters met het volk was, dat wanneer iemand een offer offerde, de jongen van de priester kwam, terwijl het vlees kookte, met een drietandige vork in zijn hand;","14":"En sloeg die in de teil, of in de ketel, of in de pan, of in de pot; al wat de vork optrok, dat nam de priester voor zich. Zo deden zij aan alle Israëlieten die in Silo kwamen.","15":"Ook voordat zij het vet aanstaken, kwam de jongen van de priester, en zei tegen de man die offerde: Geef dat vlees om te braden voor de priester; want hij zal geen gekookt vlees van u nemen, maar rauw.","16":"Wanneer die man dan tegen hem zei: Zij zullen dat vet zoals vandaag helemaal aansteken, neem dan voor u, zoals uw ziel verlangt; dan zei hij tegen hem: Nee, zeker, u zult het nu geven, en zo niet, dan zal ik het met geweld nemen.","17":"Zo was de zonde van deze jongens zeer groot voor het aangezicht van de HEERE; want de mensen verachtten het spijsoffer van de HEERE.","18":"Doch Samuël diende voor het aangezicht van de HEERE, terwijl hij een jongen was, omgord met de linnen efod[1].","19":"En zijn moeder maakte hem een klein rokje, en bracht het hem van jaar tot jaar, als zij opkwam met haar man om het jaarlijkse offer te offeren.","20":"En Eli zegende Elkana en zijn vrouw, en zei: De HEERE geeft u nageslacht uit deze vrouw, voor de bede die zij aan de HEERE heeft afgebeden. En zij gingen naar hun eigen plaats.","21":"Want de HEERE bezocht[2] Hanna, en zij werd zwanger en baarde drie zonen en twee dochters; en de jongen Samuël werd groot bij de HEERE.","22":"Doch Eli was zeer oud, en hoorde alles wat zijn zonen aan heel Israël deden, en dat zij sliepen bij de vrouwen die met velen samenkwamen bij de deur van de tent van de samenkomst.","23":"En hij zei tegen hen: Waarom doet u zulke dingen, dat ik deze uw slechte daden hoor van heel dit volk?","24":"Nee, mijn zonen; want dit is geen goed gerucht, dat ik hoor; u maakt dat het volk van de HEERE overtreedt.","25":"Wanneer een mens tegen een mens zondigt, zullen de goden hem oordelen; maar wanneer een mens tegen de HEERE zondigt, wie zal voor hem bidden? Maar zij luisterden niet naar de stem van hun vader, want de HEERE wilde hen doden.","26":"En de jongen Samuël nam toe, en werd groot en aangenaam, zowel bij de HEERE als ook bij de mensen.","27":"En er kwam een man van God naar Eli, en zei tegen hem: Zo zegt de HEERE: Heb Ik Mij klaar geopenbaard aan het huis van uw vader, toen zij in Egypte waren, in het huis van Farao?","28":"En Ik heb hem uit alle stammen van Israël voor Mij tot priester verkozen, om te offeren op Mijn altaar, om het reukwerk aan te steken, om de efod voor Mijn aangezicht te dragen; en heb aan het huis van uw vader al de vuuroffers van de kinderen van Israël gegeven.","29":"Waarom trapt u achteruit tegen Mijn slachtoffer en tegen Mijn spijsoffer, dat Ik geboden heb *in* de woning; en eert u uw zonen meer dan Mij, dat u zich mest van het voornaamste van alle spijsoffers van Mijn volk Israël?","30":"Daarom spreekt de HEERE, de God van Israël: Ik had wel duidelijk gezegd: Uw huis en het huis van uw vader zouden voor Mijn aangezicht wandelen tot in eeuwigheid; maar nu spreekt de HEERE: Dat zij verre van Mij; want die Mij eren, zal Ik eren, maar die Mij versmaden, zullen licht geacht worden.","31":"Zie, de dagen komen dat Ik uw arm zal afhouwen, en de arm van het huis van uw vader, zodat er geen oud man in uw huis zal zijn.","32":"En u zult de benauwdheid van de woning *van God* aanschouwen, in plaats van al het goede dat Hij Israël zou hebben gedaan; en er zal op geen dag een oud man in uw huis zijn.","33":"Doch de man die Ik u niet zal uitroeien van Mijn altaar, zou zijn om uw ogen te verteren, en om uw ziel te bedroeven; en alle nakomelingen van uw huis zullen sterven als zij mannen geworden zijn.","34":"Dit nu zal u een teken zijn, dat over uw beide zonen, over Hofni en Pinehas, komen zal: op één dag zullen zij beiden sterven.","35":"En Ik zal Mij een trouwe priester verwekken; die zal doen zoals het in Mijn hart en in Mijn ziel zal zijn; hem zal Ik een bestendig huis bouwen, en hij zal alle dagen voor het aangezicht van Mijn Gezalfde wandelen.","36":"En het zal gebeuren, dat ieder die van uw huis over is, zal komen om zich voor hem neer te buigen voor een stukje geld en een bol brood, en zal zeggen: Neem mij toch aan tot een van de priesterlijke bedieningen, dat ik een stukje brood mag eten."},"SV":{"1":"Toen bad Hanna en zeide: Mijn hart springt van vreugde op in den HEERE; mijn hoorn is verhoogd in den HEERE; mijn mond is wijd opengedaan over mijn vijanden; want ik verheug mij in Uw heil.","2":"Er is niemand heilig, gelijk de HEERE; want er is niemand dan Gij, en er is geen rotssteen, gelijk onze God!","3":"Maakt het niet te veel, dat gij hoog, hoog zoudt spreken, dat iets hards uit uw mond zou gaan; want de HEERE is een God der wetenschappen, en Zijn daden zijn recht gedaan.","4":"De boog der sterken is gebroken; en die struikelden, zijn met sterkte omgord.","5":"Die verzadigd waren, hebben zich verhuurd om brood, en die hongerig waren, zijn het niet meer; totdat de onvruchtbare zeven heeft gebaard, en die vele kinderen had, krachteloos is geworden.","6":"De HEERE doodt en maakt levend; Hij doet ter helle nederdalen, en Hij doet *weder* opkomen.","7":"De HEERE maakt arm en maakt rijk; Hij vernedert, ook verhoogt Hij.","8":"Hij verheft den geringe uit het stof, *en* den nooddruftige verhoogt Hij uit den drek, om te doen zitten bij de vorsten, dat Hij hen den stoel der ere doe beërven; want de grondvesten des aardrijks zijn des HEEREN, en Hij heeft de wereld daarop gezet.","9":"Hij zal de voeten Zijner gunstgenoten bewaren; maar de goddelozen zullen zwijgen in duisternis; want een man vermag niet door kracht.","10":"Die met den HEERE twisten, zullen verpletterd worden; Hij zal in den hemel over hen donderen; de HEERE zal de einden der aarde richten, en zal Zijn Koning sterkte geven, en den hoorn Zijns Gezalfden verhogen.","11":"Daarna ging Elkana naar Rama in zijn huis; maar de jongeling was den HEERE dienende voor het aangezicht van den priester Eli.","12":"Doch de zonen van Eli waren kinderen Belials; zij kenden den HEERE niet.","13":"Want de wijze dier priesters met het volk was, dat, *wanneer* iemand een offerande offerde, des priesters jongen kwam, terwijl het vlees kookte, met een drietandigen krauwel in zijn hand;","14":"En sloeg in de teile, of in den ketel, of in de pan, of in den pot; al wat de krauwel optrok, dat nam de priester voor zich. Alzo deden zij aan al de Israëlieten, die te Silo kwamen.","15":"Ook eer zij het vet aanstaken, kwam des priesters jongen, en zeide tot den man, die offerde: Geef dat vlees om te braden voor den priester; want hij zal geen gekookt vlees van u nemen, maar rauw.","16":"Wanneer nu die man tot hem zeide: Zij zullen dat vet als heden ganselijk aansteken, zo neem dan voor u, gelijk als het uw ziel lusten zal; zo zeide hij tot hem: Nu zult gij het immers geven, en zo niet, ik zal het met geweld nemen.","17":"Alzo was de zonde dezer jongelingen zeer groot voor het aangezicht des HEEREN; want de lieden verachtten het spijsoffer des HEEREN.","18":"Doch Samuël diende voor het aangezicht des HEEREN, zijnde een jongeling, omgord met den linnen lijfrok.","19":"En zijn moeder maakte hem een kleinen rok, en bracht hem dien van jaar tot jaar, als zij opkwam met haar man, om het jaarlijkse offer te offeren.","20":"En Eli zegende Elkana, en zijn huisvrouw, en zeide: De HEERE geve u zaad uit deze vrouw voor de bede, die zij den HEERE afgebeden heeft. En zij gingen naar zijn plaats.","21":"Want de HEERE bezocht Hanna, en zij werd bevrucht, en baarde drie zonen en twee dochters; en de jongeling Samuël werd groot bij den HEERE.","22":"Doch Eli was zeer oud, en hoorde al, wat zijn zonen aan gans Israël deden, en dat zij sliepen bij de vrouwen, die met hopen samenkwamen aan de deur van de tent der samenkomst.","23":"En hij zeide tot hen: Waarom doet gij al zulke dingen, dat ik deze uw boze stukken hore van dit ganse volk?","24":"Niet, mijn zonen; want dit is geen goed gerucht, dat ik hoor; gij maakt, dat het volk des HEEREN overtreedt.","25":"Wanneer een mens tegen een mens zondigt, zo zullen de goden hem oordelen; maar wanneer een mens tegen den HEERE zondigt, wie zal voor hem bidden? Doch zij hoorden de stem huns vaders niet, want de HEERE wilde hen doden.","26":"En de jongeling Samuël nam toe, en werd groot en aangenaam beide bij den HEERE en ook bij de mensen.","27":"En er kwam een man Gods tot Eli, en zeide tot hem: Zo zegt de HEERE: Heb Ik Mij klaarlijk geopenbaard aan het huis uws vaders, toen zij in Egypte waren, in het huis van Farao?","28":"En Ik heb hem uit alle stammen van Israël Mij ten priester verkoren, om te offeren op Mijn altaar, om het reukwerk aan te steken, om den efod voor Mijn aangezicht te dragen; en heb aan het huis uws vaders gegeven al de vuurofferen van de kinderen Israëls.","29":"Waarom slaat gijlieden achteruit tegen Mijn slachtoffer, en tegen Mijn spijsoffer, hetwelk Ik geboden heb *in* de woning; en eert uw zonen meer dan Mij, dat gijlieden u mest van het voornaamste van alle spijsoffers van Mijn volk Israël?","30":"Daarom spreekt de HEERE, de God Israëls: Ik had wel klaarlijk gezegd: Uw huis en uws vaders huis zouden voor Mijn aangezicht wandelen tot in eeuwigheid; maar nu spreekt de HEERE: Dat zij verre van Mij; want die Mij eren, zal Ik eren, maar die Mij versmaden, zullen licht geacht worden.","31":"Zie, de dagen komen, dat Ik uw arm zal afhouwen, en den arm van uws vaders huis, dat er geen oud man in uw huis wezen zal.","32":"En gij zult aanschouwen de benauwdheid der woning *Gods*, in plaats van al het goede, dat Hij Israël zou gedaan hebben; en er zal te genen dage een oud man in uw huis zijn.","33":"Doch de man, dien Ik u niet zal uitroeien van Mijn altaar, zou zijn om uw ogen te verteren, en om uw ziel te bedroeven; en al de menigte uws huizes zal sterven, mannen geworden zijnde.","34":"Dit nu zal u een teken zijn, hetwelk over uw beide zonen, over Hofni en Pinehas, komen zal: op een dag zullen zij beiden sterven.","35":"En Ik zal Mij een getrouwen priester verwekken; die zal doen, gelijk als in Mijn hart en in Mijn ziel zijn zal; dien zal Ik een bestendig huis bouwen, en hij zal altijd voor het aangezicht Mijns Gezalfden wandelen.","36":"En het zal geschieden, dat al wie van uw huis zal overig zijn, zal komen, om zich voor hem neder te buigen voor een stukje gelds, en een bolle broods, en zal zeggen: Neem mij toch aan tot enige priesterlijke bediening, dat ik een bete broods moge eten."},"KJV":{"1":"And Hannah prayed, and said, My heart rejoiceth in the LORD, mine horn is exalted in the LORD: my mouth is enlarged over mine enemies; because I rejoice in thy salvation.","2":"There is none holy as the LORD: for there is none beside thee: neither is there any rock like our God.","3":"Talk no more so exceeding proudly; let not arrogancy come out of your mouth: for the LORD is a God of knowledge, and by him actions are weighed.","4":"The bows of the mighty men are broken, and they that stumbled are girded with strength.","5":"They that were full have hired out themselves for bread; and they that were hungry ceased: so that the barren hath born seven; and she that hath many children is waxed feeble.","6":"The LORD killeth, and maketh alive: he bringeth down to the grave, and bringeth up.","7":"The LORD maketh poor, and maketh rich: he bringeth low, and lifteth up.","8":"He raiseth up the poor out of the dust, and lifteth up the beggar from the dunghill, to set them among princes, and to make them inherit the throne of glory: for the pillars of the earth are the LORD'S, and he hath set the world upon them.","9":"He will keep the feet of his saints, and the wicked shall be silent in darkness; for by strength shall no man prevail.","10":"The adversaries of the LORD shall be broken to pieces; out of heaven shall he thunder upon them: the LORD shall judge the ends of the earth; and he shall give strength unto his king, and exalt the horn of his anointed.","11":"And Elkanah went to Ramah to his house. And the child did minister unto the LORD before Eli the priest.","12":"Now the sons of Eli were sons of Belial; they knew not the LORD.","13":"And the priests' custom with the people was, that, when any man offered sacrifice, the priest's servant came, while the flesh was in seething, with a fleshhook of three teeth in his hand;","14":"And he struck it into the pan, or kettle, or caldron, or pot; all that the fleshhook brought up the priest took for himself. So they did in Shiloh unto all the Israelites that came thither.","15":"Also before they burnt the fat, the priest's servant came, and said to the man that sacrificed, Give flesh to roast for the priest; for he will not have sodden flesh of thee, but raw.","16":"And if any man said unto him, Let them not fail to burn the fat presently, and then take as much as thy soul desireth; then he would answer him, Nay; but thou shalt give it me now: and if not, I will take it by force.","17":"Wherefore the sin of the young men was very great before the LORD: for men abhorred the offering of the LORD.","18":"But Samuel ministered before the LORD, being a child, girded with a linen ephod.","19":"Moreover his mother made him a little coat, and brought it to him from year to year, when she came up with her husband to offer the yearly sacrifice.","20":"And Eli blessed Elkanah and his wife, and said, The LORD give thee seed of this woman for the loan which is lent to the LORD. And they went unto their own home.","21":"And the LORD visited Hannah, so that she conceived, and bare three sons and two daughters. And the child Samuel grew before the LORD.","22":"Now Eli was very old, and heard all that his sons did unto all Israel; and how they lay with the women that assembled at the door of the tabernacle of the congregation.","23":"And he said unto them, Why do ye such things? for I hear of your evil dealings by all this people.","24":"Nay, my sons; for it is no good report that I hear: ye make the LORD'S people to transgress.","25":"If one man sin against another, the judge shall judge him: but if a man sin against the LORD, who shall intreat for him? Notwithstanding they hearkened not unto the voice of their father, because the LORD would slay them.","26":"And the child Samuel grew on, and was in favour both with the LORD, and also with men.","27":"And there came a man of God unto Eli, and said unto him, Thus saith the LORD, Did I plainly appear unto the house of thy father, when they were in Egypt in Pharaoh's house?","28":"And did I choose him out of all the tribes of Israel to be my priest, to offer upon mine altar, to burn incense, to wear an ephod before me? and did I give unto the house of thy father all the offerings made by fire of the children of Israel?","29":"Wherefore kick ye at my sacrifice and at mine offering, which I have commanded in my habitation; and honourest thy sons above me, to make yourselves fat with the chiefest of all the offerings of Israel my people?","30":"Wherefore the LORD God of Israel saith, I said indeed that thy house, and the house of thy father, should walk before me for ever: but now the LORD saith, Be it far from me; for them that honour me I will honour, and they that despise me shall be lightly esteemed.","31":"Behold, the days come, that I will cut off thine arm, and the arm of thy father's house, that there shall not be an old man in thine house.","32":"And thou shalt see an enemy in my habitation, in all the wealth which God shall give Israel: and there shall not be an old man in thine house for ever.","33":"And the man of thine, whom I shall not cut off from mine altar, shall be to consume thine eyes, and to grieve thine heart: and all the increase of thine house shall die in the flower of their age.","34":"And this shall be a sign unto thee, that shall come upon thy two sons, on Hophni and Phinehas; in one day they shall die both of them.","35":"And I will raise me up a faithful priest, that shall do according to that which is in mine heart and in my mind: and I will build him a sure house; and he shall walk before mine anointed for ever.","36":"And it shall come to pass, that every one that is left in thine house shall come and crouch to him for a piece of silver and a morsel of bread, and shall say, Put me, I pray thee, into one of the priests' offices, that I may eat a piece of bread."}},"tsk":{"1":[{"kopje":"bad","refs":["Neh 11:17","Hab 3:1","Fil 4:6"]},{"kopje":"Mijn hart","refs":["Luk 1:46","Luk 1:47-56","Rom 5:11","Fil 3:3","Fil 4:4","1 Petr 1:8"]},{"kopje":"mijn hoorn","refs":["Ps 18:3","Ps 89:18","Ps 92:11","Ps 112:8","Ps 112:9","Luk 1:69" 6083\">dust,</span> and lifteth <span class=\"wl wl-kjv\" data-code=\"H7311\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H34\">beggar</span> from the <span class=\"wl wl-kjv\" data-code=\"H830\">dunghill,</span> to <span class=\"wl wl-kjv\" data-code=\"H3427\">set</span> them among <span class=\"wl wl-kjv\" data-code=\"H5081\">princes,</span> and to make them <span class=\"wl wl-kjv\" data-code=\"H5157\">inherit</span> the <span class=\"wl wl-kjv\" data-code=\"H3678\">throne</span> of <span class=\"wl wl-kjv\" data-code=\"H3519\">glory:</span> for the <span class=\"wl wl-kjv\" data-code=\"H4690\">pillars</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> are the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S,</span> and he hath <span class=\"wl wl-kjv\" data-code=\"H7896\">set</span> the <span class=\"wl wl-kjv\" data-code=\"H8398\">world</span> upon them.","9":"He will <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> the <span class=\"wl wl-kjv\" data-code=\"H7272\">feet</span> of his <span class=\"wl wl-kjv\" data-code=\"H2623\">saints,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked</span> shall be <span class=\"wl wl-kjv\" data-code=\"H1826\">silent</span> in <span class=\"wl wl-kjv\" data-code=\"H2822\">darkness;</span> for by <span class=\"wl wl-kjv\" data-code=\"H3581\">strength</span> shall no <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H1396\">prevail.</span>","10":"The <span class=\"wl wl-kjv\" data-code=\"H7378\">adversaries</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall be broken to <span class=\"wl wl-kjv\" data-code=\"H2865\">pieces;</span> out of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> shall he <span class=\"wl wl-kjv\" data-code=\"H7481\">thunder</span> upon them: the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H1777\">judge</span> the <span class=\"wl wl-kjv\" data-code=\"H657\">ends</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth;</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> <span class=\"wl wl-kjv\" data-code=\"H5797\">strength</span> unto his <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> and <span class=\"wl wl-kjv\" data-code=\"H7311\">exalt</span> the <span class=\"wl wl-kjv\" data-code=\"H7161\">horn</span> of his <span class=\"wl wl-kjv\" data-code=\"H4899\">anointed.</span>","11":"And <span class=\"wl wl-kjv\" data-code=\"H511\">Elkanah</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> to <span class=\"wl wl-kjv\" data-code=\"H7414\">Ramah</span> to his <span class=\"wl wl-kjv\" data-code=\"H1004\">house.</span> And the <span class=\"wl wl-kjv\" data-code=\"H5288\">child</span> <span class=\"wl wl-kjv\" data-code=\"H1961\">did</span> <span class=\"wl wl-kjv\" data-code=\"H8334\">minister</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H5941\">Eli</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest.</span>","12":"Now the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H5941\">Eli</span> were <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H1100\">Belial;</span> they <span class=\"wl wl-kjv\" data-code=\"H3045\">knew</span> not the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","13":"And the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests'</span> <span class=\"wl wl-kjv\" data-code=\"H4941\">custom</span> with the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> was, that, when any <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H2076\">offered</span> <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifice,</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest's</span> <span class=\"wl wl-kjv\" data-code=\"H5288\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came,</span> while the <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> was in <span class=\"wl wl-kjv\" data-code=\"H1310\">seething,</span> with a <span class=\"wl wl-kjv\" data-code=\"H4207\">fleshhook</span> of <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H8127\">teeth</span> in his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand;</span>","14":"And he <span class=\"wl wl-kjv\" data-code=\"H5221\">struck</span> it into the <span class=\"wl wl-kjv\" data-code=\"H3595\">pan,</span> or <span class=\"wl wl-kjv\" data-code=\"H1731\">kettle,</span> or <span class=\"wl wl-kjv\" data-code=\"H7037\">caldron,</span> or <span class=\"wl wl-kjv\" data-code=\"H6517\">pot;</span> all that the <span class=\"wl wl-kjv\" data-code=\"H4207\">fleshhook</span> brought <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> for himself. So they <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> in <span class=\"wl wl-kjv\" data-code=\"H7887\">Shiloh</span> unto all the <span class=\"wl wl-kjv\" data-code=\"H3478\">Israelites</span> that <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> thither.","15":"Also before they <span class=\"wl wl-kjv\" data-code=\"H6999\">burnt</span> the <span class=\"wl wl-kjv\" data-code=\"H2459\">fat,</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest's</span> <span class=\"wl wl-kjv\" data-code=\"H5288\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> that <span class=\"wl wl-kjv\" data-code=\"H2076\">sacrificed,</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">Give</span> <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> to <span class=\"wl wl-kjv\" data-code=\"H6740\">roast</span> for the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest;</span> for he will not <span class=\"wl wl-kjv\" data-code=\"H3947\">have</span> <span class=\"wl wl-kjv\" data-code=\"H1310\">sodden</span> <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> of thee, but <span class=\"wl wl-kjv\" data-code=\"H2416\">raw.</span>","16":"And if any <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Let them not <span class=\"wl wl-kjv\" data-code=\"H6999\">fail</span> to <span class=\"wl wl-kjv\" data-code=\"H6999\">burn</span> the <span class=\"wl wl-kjv\" data-code=\"H2459\">fat</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">presently,</span> and then <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> as much as thy <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> <span class=\"wl wl-kjv\" data-code=\"H183\">desireth;</span> then he would <span class=\"wl wl-kjv\" data-code=\"H559\">answer</span> him, Nay; but thou shalt <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> it me now: and if not, I will <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> it by <span class=\"wl wl-kjv\" data-code=\"H2394\">force.</span>","17":"Wherefore the <span class=\"wl wl-kjv\" data-code=\"H2403\">sin</span> of the young <span class=\"wl wl-kjv\" data-code=\"H5288\">men</span> was <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> for <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> <span class=\"wl wl-kjv\" data-code=\"H5006\">abhorred</span> the <span class=\"wl wl-kjv\" data-code=\"H4503\">offering</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","18":"But <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> <span class=\"wl wl-kjv\" data-code=\"H8334\">ministered</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> being a <span class=\"wl wl-kjv\" data-code=\"H5288\">child,</span> <span class=\"wl wl-kjv\" data-code=\"H2296\">girded</span> with a <span class=\"wl wl-kjv\" data-code=\"H906\">linen</span> <span class=\"wl wl-kjv\" data-code=\"H646\">ephod.</span>","19":"Moreover his <span class=\"wl wl-kjv\" data-code=\"H517\">mother</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> him a <span class=\"wl wl-kjv\" data-code=\"H6996\">little</span> <span class=\"wl wl-kjv\" data-code=\"H4598\">coat,</span> and <span class=\"wl wl-kjv\" data-code=\"H5927\">brought</span> it to him from <span class=\"wl wl-kjv\" data-code=\"H3117\">year</span> to <span class=\"wl wl-kjv\" data-code=\"H3117\">year,</span> when she came <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> with her <span class=\"wl wl-kjv\" data-code=\"H376\">husband</span> to <span class=\"wl wl-kjv\" data-code=\"H2076\">offer</span> the <span class=\"wl wl-kjv\" data-code=\"H3117\">yearly</span> <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifice.</span>","20":"And <span class=\"wl wl-kjv\" data-code=\"H5941\">Eli</span> <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed</span> <span class=\"wl wl-kjv\" data-code=\"H511\">Elkanah</span> and his <span class=\"wl wl-kjv\" data-code=\"H802\">wife,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">give</span> thee <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> of this <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> for the <span class=\"wl wl-kjv\" data-code=\"H7596\">loan</span> which is <span class=\"wl wl-kjv\" data-code=\"H7592\">lent</span> to the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span> And they <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> unto their own <span class=\"wl wl-kjv\" data-code=\"H4725\">home.</span>","21":"<span class=\"wl wl-kjv\" data-code=\"H3588\">And</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6485\">visited</span> <span class=\"wl wl-kjv\" data-code=\"H2584\">Hannah,</span> so that she <span class=\"wl wl-kjv\" data-code=\"H2029\">conceived,</span> and <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> and <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters.</span> And the <span class=\"wl wl-kjv\" data-code=\"H5288\">child</span> <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> <span class=\"wl wl-kjv\" data-code=\"H1431\">grew</span> <span class=\"wl wl-kjv\" data-code=\"H5973\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","22":"Now <span class=\"wl wl-kjv\" data-code=\"H5941\">Eli</span> was <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H2204\">old,</span> and <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> all that his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> unto all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> and how they <span class=\"wl wl-kjv\" data-code=\"H7901\">lay</span> with the <span class=\"wl wl-kjv\" data-code=\"H802\">women</span> that <span class=\"wl wl-kjv\" data-code=\"H6633\">assembled</span> at the <span class=\"wl wl-kjv\" data-code=\"H6607\">door</span> of the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the <span class=\"wl wl-kjv\" data-code=\"H4150\">congregation.</span>","23":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, Why <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> ye such <span class=\"wl wl-kjv\" data-code=\"H1697\">things?</span> for I <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> of your <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">dealings</span> by all this <span class=\"wl wl-kjv\" data-code=\"H5971\">people.</span>","24":"Nay, my <span class=\"wl wl-kjv\" data-code=\"H1121\">sons;</span> for it is no <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H8052\">report</span> that I <span class=\"wl wl-kjv\" data-code=\"H8085\">hear:</span> ye make the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> to <span class=\"wl wl-kjv\" data-code=\"H5674\">transgress.</span>","25":"If one <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H2398\">sin</span> against <span class=\"wl wl-kjv\" data-code=\"H376\">another,</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">judge</span> shall <span class=\"wl wl-kjv\" data-code=\"H6419\">judge</span> him: but if a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H2398\">sin</span> against the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> who shall <span class=\"wl wl-kjv\" data-code=\"H6419\">intreat</span> for him? Notwithstanding they <span class=\"wl wl-kjv\" data-code=\"H8085\">hearkened</span> not unto the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of their <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> because the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2654\">would</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">slay</span> them.","26":"And the <span class=\"wl wl-kjv\" data-code=\"H5288\">child</span> <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> <span class=\"wl wl-kjv\" data-code=\"H1432\">grew</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">on,</span> and was in <span class=\"wl wl-kjv\" data-code=\"H2896\">favour</span> both with the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and also with <span class=\"wl wl-kjv\" data-code=\"H582\">men.</span>","27":"And there <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> unto <span class=\"wl wl-kjv\" data-code=\"H5941\">Eli,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> Did I <span class=\"wl wl-kjv\" data-code=\"H1540\">plainly</span> <span class=\"wl wl-kjv\" data-code=\"H1540\">appear</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of thy <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> when they were in <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> in <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house?</span>","28":"And did I <span class=\"wl wl-kjv\" data-code=\"H977\">choose</span> him out of all the <span class=\"wl wl-kjv\" data-code=\"H7626\">tribes</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> to be my <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> to <span class=\"wl wl-kjv\" data-code=\"H5927\">offer</span> upon mine <span class=\"wl wl-kjv\" data-code=\"H4196\">altar,</span> to <span class=\"wl wl-kjv\" data-code=\"H6999\">burn</span> <span class=\"wl wl-kjv\" data-code=\"H7004\">incense,</span> to <span class=\"wl wl-kjv\" data-code=\"H5375\">wear</span> an <span class=\"wl wl-kjv\" data-code=\"H646\">ephod</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> me? and did I <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of thy <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> all the offerings made by <span class=\"wl wl-kjv\" data-code=\"H801\">fire</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel?</span>","29":"Wherefore <span class=\"wl wl-kjv\" data-code=\"H1163\">kick</span> ye at my <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifice</span> and at mine <span class=\"wl wl-kjv\" data-code=\"H4503\">offering,</span> which I have <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> in my <span class=\"wl wl-kjv\" data-code=\"H4583\">habitation;</span> and <span class=\"wl wl-kjv\" data-code=\"H3513\">honourest</span> thy <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> above me, to make yourselves <span class=\"wl wl-kjv\" data-code=\"H1254\">fat</span> with the <span class=\"wl wl-kjv\" data-code=\"H7225\">chiefest</span> of all the <span class=\"wl wl-kjv\" data-code=\"H4503\">offerings</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> my <span class=\"wl wl-kjv\" data-code=\"H5971\">people?</span>","30":"Wherefore the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith,</span> I <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H559\">indeed</span> that thy <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of thy <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> should <span class=\"wl wl-kjv\" data-code=\"H1980\">walk</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> me <span class=\"wl wl-kjv\" data-code=\"H5704\">for</span> <span class=\"wl wl-kjv\" data-code=\"H5769\">ever:</span> but now the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith,</span> Be it far from <span class=\"wl wl-kjv\" data-code=\"H2486\">me;</span> for them that <span class=\"wl wl-kjv\" data-code=\"H3513\">honour</span> me I will <span class=\"wl wl-kjv\" data-code=\"H3513\">honour,</span> and they that <span class=\"wl wl-kjv\" data-code=\"H959\">despise</span> me shall be lightly <span class=\"wl wl-kjv\" data-code=\"H7043\">esteemed.</span>","31":"Behold, the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> that I will cut <span class=\"wl wl-kjv\" data-code=\"H1438\">off</span> thine <span class=\"wl wl-kjv\" data-code=\"H2220\">arm,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2220\">arm</span> of thy <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> that there shall not be an old <span class=\"wl wl-kjv\" data-code=\"H2205\">man</span> in thine <span class=\"wl wl-kjv\" data-code=\"H1004\">house.</span>","32":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H5027\">see</span> an <span class=\"wl wl-kjv\" data-code=\"H6862\">enemy</span> in my <span class=\"wl wl-kjv\" data-code=\"H4583\">habitation,</span> in all the wealth which God shall <span class=\"wl wl-kjv\" data-code=\"H3190\">give</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> and there shall not be an old <span class=\"wl wl-kjv\" data-code=\"H2205\">man</span> in thine <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> for <span class=\"wl wl-kjv\" data-code=\"H3117\">ever.</span>","33":"And the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of thine, whom I shall not cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> from mine <span class=\"wl wl-kjv\" data-code=\"H4196\">altar,</span> shall be to <span class=\"wl wl-kjv\" data-code=\"H3615\">consume</span> thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> and to <span class=\"wl wl-kjv\" data-code=\"H109\">grieve</span> thine <span class=\"wl wl-kjv\" data-code=\"H5315\">heart:</span> and all the <span class=\"wl wl-kjv\" data-code=\"H4768\">increase</span> of thine <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> shall <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> in the flower of their <span class=\"wl wl-kjv\" data-code=\"H582\">age.</span>","34":"And this shall be a <span class=\"wl wl-kjv\" data-code=\"H226\">sign</span> unto thee, that shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> upon thy <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> on <span class=\"wl wl-kjv\" data-code=\"H2652\">Hophni</span> and <span class=\"wl wl-kjv\" data-code=\"H6372\">Phinehas;</span> in <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> they shall <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">both</span> of them.","35":"And I will raise me <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> a <span class=\"wl wl-kjv\" data-code=\"H539\">faithful</span> <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> that shall <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> according to that which is in mine <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> and in my <span class=\"wl wl-kjv\" data-code=\"H5315\">mind:</span> and I will <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> him a <span class=\"wl wl-kjv\" data-code=\"H539\">sure</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house;</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H1980\">walk</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> mine <span class=\"wl wl-kjv\" data-code=\"H4899\">anointed</span> for <span class=\"wl wl-kjv\" data-code=\"H3117\">ever.</span>","36":"And it shall come to pass, that every one that is <span class=\"wl wl-kjv\" data-code=\"H3498\">left</span> in thine <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> and <span class=\"wl wl-kjv\" data-code=\"H7812\">crouch</span> to him for a <span class=\"wl wl-kjv\" data-code=\"H95\">piece</span> of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> and a <span class=\"wl wl-kjv\" data-code=\"H3603\">morsel</span> of <span class=\"wl wl-kjv\" data-code=\"H3899\">bread,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> <span class=\"wl wl-kjv\" data-code=\"H5596\">Put</span> me, I pray thee, into <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of the priests' <span class=\"wl wl-kjv\" data-code=\"H3550\">offices,</span> that I may <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> a <span class=\"wl wl-kjv\" data-code=\"H6595\">piece</span> of <span class=\"wl wl-kjv\" data-code=\"H3899\">bread.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"in den HEERE;","tekst":"Te weten, dewijl Hij mij deze grote weldaad bewezen heeft, dat Hij mij dezen zoon gegeven heeft."},{"catchword":"mijn hoorn is verhoogd","tekst":"Dat is, ik heb als een nieuwe kracht van den Heere ontvangen; ik ben nu welgemoed en onversaagd. Het is een gelijkenis genomen van de gehoornde beesten, die hun meeste sterkte en ook hun versiersel in de hoornen hebben. Zie Psa 92:11."},{"catchword":"mijn mond is wijd opengedaan","tekst":"Alsof zij zeide: Nu mij de Heere dezen zoon gegeven heeft, nu durf ik met open mond spreken tegen mijn vijanden, inzonderheid tegen Peninna, haar kinderen en vrienden, die mij mijn onvruchtbaarheid verweten hebben."},{"catchword":"want ik verheug mij","tekst":"Anders, want gij hebt mij verheugd mits uw heil"},{"catchword":"in Uw heil","tekst":"Dat is, in de gelukzaligheid, die Gij mij gedaan hebt, o Heere."}],"2":[{"catchword":"er is","tekst":"Dat is, er is niemand op wien men zich zekerlijk verlaten mag, dan op u, Heere; zie Deu 32:4."},{"catchword":"rotssteen, gelijk onze God","tekst":"De sterke God wordt ook een steenrots genoemd Deu 32:15, en elders meer."}],"3":[{"catchword":"gij hoog,","tekst":"Hanna spreekt hier Peninna aan [zie boven 1Sa 1:6-7 ] mitsgaders alle trotse, vermetele mensen."},{"catchword":"hards uit uw mond zou gaan;","tekst":"Of, het oude; dat is, gelijk gij voor dezen pleegt te doen."},{"catchword":"der wetenschappen,","tekst":"Dat is, van alle, of grote wetenschap. Vergelijk Pro 1:20, met de aantekeningen."},{"catchword":"Zijn daden zijn recht gedaan","tekst":"Vergelijk Eze 18:25. Anders, de daden, of werken, worden van Hem bestuurd, of gewogen. Sommigen aldus: En zijn zijne werken [niet] recht gemaakt?"}],"4":[{"catchword":"gebroken;","tekst":"Hebreeuws, de bogen zijn gebroken. Zie gelijke verandering van getal Job 29:10. Anders, de sterken [met] den boog zijn gebroken"},{"catchword":"struikelden,","tekst":"Te weten, zo uit zwakheid des lichaams als uit kleinmoedigheid."}],"5":[{"catchword":"hebben zich verhuurd","tekst":"Dat is, zij zijn zo arm geworden, dat zij zich hebben moeten verhuren, opdat zij den kost krijgen mochten."},{"catchword":"hongerig waren,","tekst":"Vergelijk Job 18:12."},{"catchword":"zijn het niet meer;","tekst":"Hebreeuws, hebben opgehouden; te weten, te zijn, of hongerig te zijn."},{"catchword":"zeven heeft gebaard,","tekst":"Dat is, velen gelijk Rth 4:15; zie onder, vs.21."},{"catchword":"krachteloos is geworden","tekst":"Te weten, om kinderen te ontvangen en te baren."}],"6":[{"catchword":"doodt","tekst":"Dat is, Hij zendt den mensen grote benauwdheid en ellenden toe, die met den dood te vergelijken zijn."},{"catchword":"maakt levend;","tekst":"Dat is, Hij verlost de treurigen wederom uit hun benauwdheid en angst."},{"catchword":"Hij doet","tekst":"Dat is, Hij brengt in de uiterste verachting en smaad."},{"catchword":"helle nederdalen,","tekst":"Dat is, in de uitste benauwdheid; zie Gen 37:35."}],"8":[{"catchword":"uit den drek,","tekst":"Of, uit den mesthoop."}],"9":[{"catchword":"zullen zwijgen in duisternis;","tekst":"Of, zullen uitgeroeid worden [en geworpen] in de duisternis."}],"10":[{"catchword":"de einden der aarde richten,","tekst":"Dat is, ook die, welke aan de uiterste einden der wereld zijn."},{"catchword":"Zijn Koning sterkte geven,","tekst":"Te weten Christus, dien Hij heeft verordineerd, en dien Hij ter bestemder tijd zenden zal."},{"catchword":"Zijns Gezalfden verhogen","tekst":"Dat is Christus. Zie Psa 2:2."}],"12":[{"catchword":"kinderen Belials;","tekst":"Zie Deu 13:13."}],"13":[{"catchword":"de wijze dier priesters","tekst":"Hebreeuws, Misphat, het recht; welk woord somtijds een gewoonte of gebruik betekent, niet alleen een goed en prijselijk, maar ook een kwaad en misprijselijk gebruik of wijze."},{"catchword":"offerde,","tekst":"Dat is, bracht om geofferd te worden; alzo vs.15."}],"14":[{"catchword":"al wat de krauwel optrok,","tekst":"God had den priesters zekere delen of stukken der beesten, die geofferd werden, tot hun spijs gegeven; te weten, de borst en den rechterschouder, Exo 29:27-28, en Lev 7:31-33, maar zij mochten niet nemen wat hun beliefde, of wat de gaffel hun gaaf; ook moest het deel, hetwelk den priesters toekwam, eerst voor den Heere opgeheven en bewogen worden; Lev 7:34."},{"catchword":"voor zich","tekst":"Of, daarmede; te weten, met den krauwel."},{"catchword":"al de Israëlieten,","tekst":"Hebreeuws, al Israël."}],"15":[{"catchword":"aanstaken,","tekst":"Zie Lev 3:3, enz."},{"catchword":"hij zal geen gekookt vlees","tekst":"Nochtans nam de priester ook wel gekookt vlees, gelijk te zien is in vs.13. Hier wordt te kennen gegeven dat hij liever rauw vlees had dan gekookt."},{"catchword":"rauw","tekst":"Hebreeuws, levend."}],"16":[{"catchword":"aansteken,","tekst":"Hebreeuws, aanstekende aansteken."}],"17":[{"catchword":"dezer jongelingen","tekst":"Te weten, de zonen van Eli."},{"catchword":"de lieden verachtten","tekst":"Hij wil zeggen: Toen het volk zag dat de zonen van Eli de offeranden zo schandelijk misbruikten tot hun wellusten, zo werden zij daardoor afgekeerd van den godsdienst, alzo dat zij geen spijsoffers meer tot den Heere brachten."}],"18":[{"catchword":"lijfrok","tekst":"Hebreeuws, efod. Vergelijk 2Sa 6:14."}],"19":[{"catchword":"van jaar tot jaar,","tekst":"Hebreeuws, van dagen tot dagen"},{"catchword":"jaarlijkse offer te offeren","tekst":"Hebreeuws, het offer der dagen."}],"20":[{"catchword":"En Eli zegende Elkana,","tekst":"Dat is, hij als hogepriester had haar veel geluk gewenst."},{"catchword":"zaad uit deze vrouw","tekst":"Dat is, kinderen."},{"catchword":"voor de bede,","tekst":"Dat is, voor den afgebeden en nu Gode gegeven zoon."},{"catchword":"zij den HEERE afgebeden heeft","tekst":"Hebreeuws, hij. Zie dergelijke verwisseling van het vrouwelijke en mannelijke geslacht Gen 24:14; Exo 31:15; Lev 2:8; 1Sa 25:27; 2Ki 3:26; Hos 14:7; Rth 1:8-9, Rth 1:11, Rth 1:19, Rth 1:22. Anders, die men den HEERE afgebeden heeft, of, die men voor den HEERE gebeden, of, begeerd heeft. Het is alsof hij zeide: Zij heeft dezen zoon niet voor haarzelve, of tot haar voordeel, begeerd en den Heere afgebeden, maar opdat zij dien den Heere zou toeëigenen tot zijn dienst."},{"catchword":"zijn plaats","tekst":"Te weten, naar de plaats van Elkana."}],"21":[{"catchword":"bezocht Hanna,","tekst":"Bevestigende den zegen van Eli, dien zij vertrouwd hadden dat de Heere volbrengen zou."},{"catchword":"baarde","tekst":"Welverstaande in verscheidene drachten."},{"catchword":"werd groot","tekst":"Versta dit van den wasdom des lichaams in grootte, en van de ziel in wijsheid en kennis; zie Luk 1:80, en Luk 2:40, Luk 2:52."},{"catchword":"bij den HEERE","tekst":"Anders, voor, of met den Heere."}],"22":[{"catchword":"met hopen samenkwamen","tekst":"Zie de aantekeningen op Exo 38:8."},{"catchword":"aan de deur","tekst":"Dat is, tot voor de tent, want in de tent mochten zij niet komen."}],"24":[{"catchword":"Niet, mijn zonen;","tekst":"Dat is, het betaamt u niet alzo te handelen."},{"catchword":"overtreedt","tekst":"Te weten, het bevel van het offer; zie boven, vs.17."}],"25":[{"catchword":"een mens tegen een mens zondigt,","tekst":"Hebreeuws, een man"},{"catchword":"goden hem oordelen;","tekst":"Anders, de overheid, de richters. Zie Exo 21:6, en de aantekeningen aldaar."},{"catchword":"zondigt,","tekst":"Te weten, opzettelijk, en met moedwilligheid."},{"catchword":"want de HEERE wilde hen doden","tekst":"Daarom gaf hun de Heere de genade niet dat zij zich bekeerden, maar Hij heeft hen meer en meer verlaten, en heeft hen rechtvaardig overgegeven in een verkeerden zin, ten verderve."}],"26":[{"catchword":"nam toe,","tekst":"Hebreeuws, ging. Vergelijk Gen 26:13 met de aantekeningen."},{"catchword":"aangenaam beide","tekst":"Hebreeuws, goed."}],"27":[{"catchword":"een man Gods tot Eli,","tekst":"Dat is, een profeet des Heeren, gelijk 2Pe 1:21; 1Ti 6:11, en 2Ti 3:17. Wie deze profeet geweest is, is ons onbekend. Zie de aantekeningen Jdg 13:6."},{"catchword":"Heb Ik Mij klaarlijk geopenbaard","tekst":"Of, ben Ik niet, enz. Hebreeuws, openbarende geopenbaard"},{"catchword":"uws vaders,","tekst":"Te weten van Aäron, van wien Eli afkomstig was door Ithamar."},{"catchword":"zij in Egypte waren,","tekst":"Te weten, de kinderen Israëls."},{"catchword":"huis van Faraö?","tekst":"Dat is, toen zij nog waren onder de heerschappij en tirannie van Farao."}],"28":[{"catchword":"hem","tekst":"Te weten, Aäron."},{"catchword":"al de vuurofferen","tekst":"Versta, al de stukken van de beesten, die in de offers op het altaar niet moesten verbrand worden. Zie Lev 7:34, en Num 18:18."}],"29":[{"catchword":"gijlieden","tekst":"Te weten, gij Eli en uw zonen."},{"catchword":"woning;","tekst":"Dat is, tabernakel, welke Gods woning was."},{"catchword":"eert uw zonen meer dan Mij,","tekst":"Denzelven meer respect toedragende dan Mij, want gij durft hen niet eens vertoornen, noch terdege berispen, veel minder straffen naar behoren, of van het priesterdom afzetten, gelijk hun snode boevenstukken dat wel verdiend hebben."},{"catchword":"gijlieden","tekst":"Te weten, gij Eli zowel als uw zonen."}],"30":[{"catchword":"Ik had","tekst":"Te weten, toen Ik het priesterlijk ambt in uws vaders huis heb ingesteld."},{"catchword":"wel klaarlijk gezegd","tekst":"Hebreeuws, Ik had zeggende gezegd"},{"catchword":"voor Mijn aangezicht","tekst":"Dat is, het priesterdom bedienen; versta hierbij, indien zij in mijn geboden zouden wandelen."},{"catchword":"Dat zij verre van Mij;","tekst":"Te weten, vanwege uw ongehoorzaamheid."},{"catchword":"zullen licht geacht worden","tekst":"Hebreeuws, zullen licht worden."}],"31":[{"catchword":"dat Ik uw arm zal afhouwen,","tekst":"Dat is, Ik zal u beroven van uw sterkte, te weten, van uw kinderen en het priesterlijk ambt; want toen het hogepriesterambt van Eli en de zijnen genomen was, zo vermochten zij gans niet. Zie onder, vs.36. Het woord arm, voor sterkte, wordt ook gebruikt Job 22:9; Psa 37:17, en elders meer."}],"32":[{"catchword":"de benauwdheid der woning Gods,","tekst":"Van de wegvoering der ark uit den tabernakel of woning, de nederlaag Israëls en de gevangenis der ark, zie onder, 1Sa 4:11. Anders, gij zult een tegenpartij in de woning zien. Gij, dat is, uw nakomelingen [want Eli is zijn levenlang priester gebleven], maar naderhand zal er een ander [de uwen uitgestoten zijnde] in de plaats derzelve gesteld worden; zie 1Ki 2:27."},{"catchword":"in plaats van","tekst":"Anders, in alles, waarmede Hij Israël goed gedaan zou hebben."}],"33":[{"catchword":"Doch de man,","tekst":"Dat is, die aan d ne horn is exalted in the LORD [i.e. I have as it were received new strength from the Lord, I am now courageous and undanted. It is a similitude taken from horned beasts, who have their greatest strength, and likewise their ornament in their hornes: see Psal.92.11.] my mouth is opened against mine enemies, [as if he had said, Seeing the Lord hath given me this son, now I dare speak with open mouth against mine enemies, especially against Peninna, her children and friends, that upbraided me with my barrenness] for I rejoice in thy salvation. [that is, in happiness which thou hast conferred upon me, O Lord. Oth. for thou hast made me joyful with thy salvation.]"}],"2":[{"catchword":null,"tekst":"There is none holy like the LORD, for there is none beside thee, and there is no rock [The strong God is also called a Rock, Deut.32.15. and elsewhere] like our God. [i.e. there is none that a man may rely upon, but onely thou, O Lord God, Deut.32.4.]"}],"3":[{"catchword":null,"tekst":"Make it not too much, that thou shouldest speak lostily, lostily, [Hanna speaketh here unto Peninna (see above chap.1. ver.6,7.) likewise unto all proud presumptuous persons] that any hard thing [or, that which is old; that is, as heretofore ye were wont to do] should go forth out at your mouth; for the Lord is a God of knowledges, [i.e. of all, or great knowledge. Compare v.1,20. with the annotate.] and his deeds are rightly done [compare chap.18.25. Oth. the deeds, or, works, are ordered, or, weighed by him. Others thus, are (not) his works made right?]"}],"4":[{"catchword":null,"tekst":"The bowe of the strong is broken: [Heb, the bowes are broken. See the like change of number, Job 29:10. Oth. the strong (with) the bowe are broken] and they that stumbled [to wit, as well out of weakness of body, as out of pusillanimity] are girt about with strength."}],"5":[{"catchword":null,"tekst":"They that were satisfied, have hired out themselves for bread, [i.e. They are grown so poor, that they have be /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
