en komt tot bij Elon-thabor, zullen u daar drie mannen vinden, die opgaan naar God, naar Beth-el; een die drie bokjes draagt, en een die drie broden draagt, en een die een fles wijn draagt.","4":"En zij zullen u naar uw welstand vragen, en zij zullen u twee broden geven; die zult u van hun hand aannemen.","5":"Daarna zult u komen op de heuvel van God, waar de bezettingen van de Filistijnen zijn; en het zal gebeuren, als u daar in de stad komt, dat u een groep profeten zult ontmoeten, die van de hoogte afkomen, met voor zich uit luiten, en trommels, en pijpen, en harpen, en zij zullen profeteren.","6":"En de Geest van de HEERE zal vaardig worden over u, en u zult met hen profeteren; en u zult in een andere man veranderd worden.","7":"En het zal gebeuren, als deze tekenen u overkomen, doe dan wat uw hand vindt te doen, want God zal met u zijn.","8":"U nu zult voor mijn aangezicht naar Gilgal afgaan, en zie, ik zal naar u toe komen, om brandoffers te offeren, en om dankoffers te offeren; zeven dagen zult u daar wachten, totdat ik naar u toe kom, en u bekendmaak wat u doen zult.","9":"Het gebeurde nu, toen hij zich omkeerde om van Samuël weg te gaan, dat God hem een ander hart gaf; en al die tekenen kwamen die dag uit.","10":"Toen zij daar bij de heuvel kwamen, zie, toen kwam hem een groep profeten tegemoet; en de Geest van de HEERE werd vaardig over hem, en hij profeteerde in hun midden.","11":"En het gebeurde, toen ieder die hem vroeger gekend had, zag dat hij, zie, profeteerde met de profeten, dat het volk zei, de een tegen de ander: Wat is dit, dat de zoon van Kis is overkomen? Is Saul ook onder de profeten?","12":"Toen antwoordde een man vandaar, en zei: Wie is toch hun vader? Daarom is het een spreekwoord geworden: Is Saul ook onder de profeten?","13":"Toen hij nu klaar was met profeteren, kwam hij op de hoogte.","14":"En Sauls oom zei tegen hem en tegen zijn knecht: Waar bent u heengegaan? Hij nu zei: Om de ezelinnen te zoeken; toen wij zagen dat ze er niet waren, kwamen wij bij Samuël.","15":"Toen zei Sauls oom: Vertel mij toch, wat heeft Samuël u gezegd?","16":"Saul nu zei tegen zijn oom: Hij heeft ons zeker meegedeeld dat de ezelinnen gevonden waren; maar de zaak van het koninkrijk, waarover Samuël gesproken had, deelde hij hem niet mee.","17":"Doch Samuël riep het volk samen bij de HEERE, te Mizpa.","18":"En hij zei tegen de kinderen van Israël: Zo heeft de HEERE, de God van Israël, gesproken: Ik heb Israël uit Egypte opgebracht, en Ik heb u gered uit de hand van de Egyptenaren, en uit de hand van alle koninkrijken die u onderdrukten.","19":"Maar u hebt vandaag uw God verworpen, Die u Zelf uit al uw ellenden en uw noden verlost heeft, en u hebt tegen Hem gezegd: Nee, zet een koning over ons; nu dan, stel u voor het aangezicht van de HEERE, naar uw stammen en naar uw duizenden.","20":"Toen Samuël nu al de stammen van Israël had laten aantreden, werd de stam van Benjamin aangewezen.","21":"Toen hij de stam van Benjamin liet aantreden naar zijn geslachten, werd het geslacht van Matri aangewezen; en Saul, de zoon van Kis, werd aangewezen. En zij zochten hem, maar hij werd niet gevonden.","22":"Toen vroegen zij verder aan de HEERE, of die man nog daarheen komen zou. De HEERE dan zei: Zie, hij heeft zich tussen de bagage verstopt.","23":"Zij nu liepen, en haalden hem vandaar, en hij stelde zich op in het midden van het volk; en hij was groter dan al het volk, van zijn schouder af en hoger.","24":"Toen zei Samuël tegen heel het volk: Ziet u wie de HEERE gekozen heeft? Want er is niemand zoals hij onder heel het volk. Toen juichte heel het volk, en zij zeiden: Leve de koning!","25":"Samuël nu sprak tot het volk het recht van het koninkrijk, en schreef het in een boek, en legde het voor het aangezicht van de HEERE. Toen liet Samuël heel het volk gaan, ieder naar zijn huis.","26":"En Saul ging ook naar zijn huis te Gibea, en met hem gingen mannen uit het leger, van wie God het hart geraakt had.","27":"Doch de verdorven mensen zeiden: Wat zou deze man ons kunnen redden? En zij verachtten hem, en brachten hem geen geschenk. Doch hij deed alsof hij het niet hoorde."},"SV":{"1":"Toen nam Samuël een oliekruik, en goot ze uit op zijn hoofd, en kuste hem, en zeide: Is het niet *alzo*, dat de HEERE u tot een voorganger over Zijn erfdeel gezalfd heeft?","2":"Als gij heden van mij gaat, zo zult gij twee mannen vinden bij het graf van Rachel, aan de landpale van Benjamin, te Zelzah; die zullen tot u zeggen: De ezelinnen zijn gevonden, die gij zijt gaan zoeken, en zie, uw vader heeft de zaken der ezelinnen verlaten, en hij is bekommerd voor ulieden, zeggende: Wat zal ik om mijn zoon doen?","3":"Als gij u van daar en verder aan begeeft, en zult komen tot aan Elon-thabor, daar zullen u drie mannen vinden, opgaande tot God naar Beth-el; een, dragende drie bokjes, en een, dragende drie bollen broods, en een, dragende een fles wijn.","4":"En zij zullen u naar *uw* welstand vragen, en zij zullen u twee broden geven; die zult gij van hun hand nemen.","5":"Daarna zult gij komen op den heuvel Gods, waar der Filistijnen bezettingen zijn; en het zal geschieden, als gij aldaar in de stad komt, zo zult gij ontmoeten een hoop profeten, van de hoogte afkomende, en voor hun aangezichten luiten, en trommelen, en pijpen, en harpen, en zij zullen profeteren.","6":"En de Geest des HEEREN zal vaardig worden over u, en gij zult met hen profeteren; en gij zult in een anderen man veranderd worden.","7":"En het zal geschieden, als u deze tekenen zullen komen, doe gij, wat uw hand vinden zal, want God zal met u zijn.","8":"Gij nu zult voor mijn aangezicht afgaan naar Gilgal, en zie, ik zal tot u afkomen, om brandofferen te offeren, om te offeren offeranden der dankzegging; zeven dagen zult gij *daar* beiden, totdat ik tot u kome, en u bekend make, wat gij doen zult.","9":"Het geschiedde nu, toen hij zijn schouder keerde, om van Samuël te gaan, veranderde God hem het hart *in* een ander; en al die tekenen kwamen ten zelven dage.","10":"Toen zij daar aan den heuvel kwamen, zie, zo *kwam* hem een hoop profeten tegemoet; en de Geest des HEEREN werd vaardig over hem, en hij profeteerde in het midden van hen.","11":"En het geschiedde, als een iegelijk, die hem van te voren gekend had, zag, dat hij, ziet, profeteerde met de profeten, zo zeide het volk, een ieder tot zijn metgezel: Wat is dit, dat den zoon van Kis geschied is? Is Saul ook onder de profeten?","12":"Toen antwoordde een man van daar, en zeide: Wie is toch hun vader? Daarom is het tot een spreekwoord geworden: Is Saul ook onder de profeten?","13":"Toen hij nu voleind had te profeteren, zo kwam hij op de hoogte.","14":"En Sauls oom zeide tot hem en tot zijn jongen: Waar zijt gijlieden heengegaan? Hij nu zeide: Om de ezelinnen te zoeken; toen wij zagen, dat zij er niet waren, zo kwamen wij tot Samuël.","15":"Toen zeide Sauls oom: Geef mij toch te kennen, wat heeft Samuël ulieden gezegd?","16":"Saul nu zeide tot zijn oom: Hij heeft ons voorzeker te kennen gegeven, dat de ezelinnen gevonden waren; maar de zaak des koninkrijks, waarvan Samuël gezegd had, gaf hij hem niet te kennen.","17":"Doch Samuël riep het volk te zamen tot den HEERE, te Mizpa.","18":"En hij zeide tot de kinderen Israëls: Alzo heeft de HEERE, de God Israëls, gesproken: Ik heb Israël uit Egypte opgebracht, en Ik heb ulieden van de hand der Egyptenaren gered, en van de hand van alle koninkrijken, die u onderdrukten.","19":"Maar gijlieden hebt heden uw God verworpen, Die u uit al uw ellenden en uw noden verlost heeft, en hebt tot Hem gezegd: Zet een koning over ons; nu dan, stelt u voor het aangezicht des HEEREN, naar uw stammen en naar uw duizenden.","20":"Toen nu Samuël al de stammen van Israël had doen naderen, zo is de stam van Benjamin geraakt.","21":"Toen hij den stam van Benjamin deed aankomen naar zijn geslachten, zo werd het geslacht van Matri geraakt; en Saul, de zoon van Kis, werd geraakt. En zij zochten hem, maar hij werd niet gevonden.","22":"Toen vraagden zij verder den HEERE, of die man nog derwaarts komen zou? De HEERE dan zeide: Ziet, hij heeft zich tussen de vaten verstoken.","23":"Zij nu liepen, en namen hem van daar, en hij stelde zich in het midden des volks; en hij was hoger dan al het volk, van zijn schouder en opwaarts.","24":"Toen zeide Samuël tot het ganse volk: Ziet gij, dien de HEERE verkoren heeft? Want gelijk hij, is er niemand onder het ganse volk. Toen juichte het ganse volk, en zij zeiden: de koning leve!","25":"Samuël nu sprak tot het volk het recht des koninkrijks, en schreef het in een boek, en leide het voor het aangezicht des HEEREN. Toen liet Samuël het ganse volk gaan, elk naar zijn huis.","26":"En Saul ging ook naar zijn huis te Gibea, en *van* het heir gingen met hem, welker hart God geroerd had.","27":"Doch de kinderen Belials zeiden: Wat zou ons deze verlossen? en zij verachtten hem, en brachten hem geen geschenk. Doch hij was als doof."},"KJV":{"1":"Then Samuel took a vial of oil, and poured it upon his head, and kissed him, and said, Is it not because the LORD hath anointed thee to be captain over his inheritance?","2":"When thou art departed from me to day, then thou shalt find two men by Rachel's sepulchre in the border of Benjamin at Zelzah; and they will say unto thee, The asses which thou wentest to seek are found: and, lo, thy father hath left the care of the asses, and sorroweth for you, saying, What shall I do for my son?","3":"Then shalt thou go on forward from thence, and thou shalt come to the plain of Tabor, and there shall meet thee three men going up to God to Bethel, one carrying three kids, and another carrying three loaves of bread, and another carrying a bottle of wine:","4":"And they will salute thee, and give thee two loaves of bread; which thou shalt receive of their hands.","5":"After that thou shalt come to the hill of God, where is the garrison of the Philistines: and it shall come to pass, when thou art come thither to the city, that thou shalt meet a company of prophets coming down from the high place with a psaltery, and a tabret, and a pipe, and a harp, before them; and they shall prophesy:","6":"And the Spirit of the LORD will come upon thee, and thou shalt prophesy with them, and shalt be turned into another man.","7":"And let it be, when these signs are come unto thee, that thou do as occasion serve thee; for God is with thee.","8":"And thou shalt go down before me to Gilgal; and, behold, I will come down unto thee, to offer burnt offerings, and to sacrifice sacrifices of peace offerings: seven days shalt thou tarry, till I come to thee, and shew thee what thou shalt do.","9":"And it was so, that when he had turned his back to go from Samuel, God gave him another heart: and all those signs came to pass that day.","10":"And when they came thither to the hill, behold, a company of prophets met him; and the Spirit of God came upon him, and he prophesied among them.","11":"And it came to pass, when all that knew him beforetime saw that, behold, he prophesied among the prophets, then the people said one to another, What is this that is come unto the son of Kish? Is Saul also among the prophets?","12":"And one of the same place answered and said, But who is their father? Therefore it became a proverb, Is Saul also among the prophets?","13":"And when he had made an end of prophesying, he came to the high place.","14":"And Saul's uncle said unto him and to his servant, Whither went ye? And he said, To seek the asses: and when we saw that they were no where, we came to Samuel.","15":"And Saul's uncle said, Tell me, I pray thee, what Samuel said unto you.","16":"And Saul said unto his uncle, He told us plainly that the asses were found. But of the matter of the kingdom, whereof Samuel spake, he told him not.","17":"And Samuel called the people together unto the LORD to Mizpeh;","18":"And said unto the children of Israel, Thus saith the LORD God of Israel, I brought up Israel out of Egypt, and delivered you out of the hand of the Egyptians, and out of the hand of all kingdoms, and of them that oppressed you:","19":"And ye have this day rejected your God, who himself saved you out of all your adversities and your tribulations; and ye have said unto him, Nay, but set a king over us. Now therefore present yourselves before the LORD by your tribes, and by your thousands.","20":"And when Samuel had caused all the tribes of Israel to come near, the tribe of Benjamin was taken.","21":"When he had caused the tribe of Benjamin to come near by their families, the family of Matri was taken, and Saul the son of Kish was taken: and when they sought him, he could not be found.","22":"Therefore they enquired of the LORD further, if the man should yet come thither. And the LORD answered, Behold, he hath hid himself among the stuff.","23":"And they ran and fetched him thence: and when he stood among the people, he was higher than any of the people from his shoulders and upward.","24":"And Samuel said to all the people, See ye him whom the LORD hath chosen, that there is none like him among all the people? And all the people shouted, and said, God save the king.","25":"Then Samuel told the people the manner of the kingdom, and wrote it in a book, and laid it up before the LORD. And Samuel sent ➔ all the people away, every man to his house.","26":"And Saul also went home to Gibeah; and there went with him a band of men, whose hearts God had touched.","27":"But the children of Belial said, How shall this man save us? And they despised him, and brought him no presents. But he held his peace."}},"tsk":{"1":[{"kopje":"oliekruik","refs":["1 Sam 2:10","1 Sam 9:16","1 Sam 16:13","1 Sam 24:7","1 Sam 26:11","2 Kon 9:3-6","Hand 13:21","Openb 5:8"]},{"kopje":"kuste hem","refs":["2 Sam 19:39","1 Kon 19:18","Ps 2:12","Hos 13:2","1 Tess 5:26"]},{"kopje":"voorganger","refs":["1 Sam 8:9","1 Sam 8:19","1 Sam 13:14","Joz 5:14","Joz 5:15","2 Sam 5:2","2 Kon 20:5","Hebr 2:10"]},{"kopje":"Zijn erfdeel","refs":["Ex 19:5","Ex 19:6 a-code=\"H1973\">forward</span> from thence, and thou shalt <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to the <span class=\"wl wl-kjv\" data-code=\"H436\">plain</span> of <span class=\"wl wl-kjv\" data-code=\"H8396\">Tabor,</span> and there shall <span class=\"wl wl-kjv\" data-code=\"H4672\">meet</span> thee <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> going <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> to <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel,</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H5375\">carrying</span> <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H1423\">kids,</span> and <span class=\"wl wl-kjv\" data-code=\"H259\">another</span> <span class=\"wl wl-kjv\" data-code=\"H5375\">carrying</span> <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3603\">loaves</span> of <span class=\"wl wl-kjv\" data-code=\"H3899\">bread,</span> and <span class=\"wl wl-kjv\" data-code=\"H259\">another</span> <span class=\"wl wl-kjv\" data-code=\"H5375\">carrying</span> a <span class=\"wl wl-kjv\" data-code=\"H5035\">bottle</span> of <span class=\"wl wl-kjv\" data-code=\"H3196\">wine:</span>","4":"And they <span class=\"wl wl-kjv\" data-code=\"H7592\">will</span> <span class=\"wl wl-kjv\" data-code=\"H7965\">salute</span> thee, and <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thee <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> loaves of <span class=\"wl wl-kjv\" data-code=\"H3899\">bread;</span> which thou shalt <span class=\"wl wl-kjv\" data-code=\"H3947\">receive</span> of their <span class=\"wl wl-kjv\" data-code=\"H3027\">hands.</span>","5":"<span class=\"wl wl-kjv\" data-code=\"H310\">After</span> that thou shalt <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to the <span class=\"wl wl-kjv\" data-code=\"H1389\">hill</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> where is the <span class=\"wl wl-kjv\" data-code=\"H5333\">garrison</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines:</span> and it shall come to pass, when thou art come <span class=\"wl wl-kjv\" data-code=\"H935\">thither</span> to the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> that thou shalt <span class=\"wl wl-kjv\" data-code=\"H6293\">meet</span> a <span class=\"wl wl-kjv\" data-code=\"H2256\">company</span> of <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> coming <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> from the high <span class=\"wl wl-kjv\" data-code=\"H1116\">place</span> with a <span class=\"wl wl-kjv\" data-code=\"H5035\">psaltery,</span> and a <span class=\"wl wl-kjv\" data-code=\"H8596\">tabret,</span> and a <span class=\"wl wl-kjv\" data-code=\"H2485\">pipe,</span> and a <span class=\"wl wl-kjv\" data-code=\"H3658\">harp,</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> them; and they shall <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesy:</span>","6":"And the <span class=\"wl wl-kjv\" data-code=\"H7307\">Spirit</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will <span class=\"wl wl-kjv\" data-code=\"H6743\">come</span> upon thee, and thou shalt <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesy</span> with them, and shalt be <span class=\"wl wl-kjv\" data-code=\"H2015\">turned</span> into <span class=\"wl wl-kjv\" data-code=\"H312\">another</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man.</span>","7":"And let it be, when these <span class=\"wl wl-kjv\" data-code=\"H226\">signs</span> are <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> unto thee, that thou <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> as <span class=\"wl wl-kjv\" data-code=\"H4672\">occasion</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">serve</span> thee; for <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> is with thee.","8":"And thou shalt go <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> me to <span class=\"wl wl-kjv\" data-code=\"H1537\">Gilgal;</span> and, behold, I will come <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> unto thee, to <span class=\"wl wl-kjv\" data-code=\"H5927\">offer</span> burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offerings,</span> and to <span class=\"wl wl-kjv\" data-code=\"H2076\">sacrifice</span> <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifices</span> of peace <span class=\"wl wl-kjv\" data-code=\"H8002\">offerings:</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> shalt thou <span class=\"wl wl-kjv\" data-code=\"H3176\">tarry,</span> till I <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to thee, and <span class=\"wl wl-kjv\" data-code=\"H3045\">shew</span> thee what thou shalt <span class=\"wl wl-kjv\" data-code=\"H6213\">do.</span>","9":"And it was so, that when he had <span class=\"wl wl-kjv\" data-code=\"H6437\">turned</span> his <span class=\"wl wl-kjv\" data-code=\"H7926\">back</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> from <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel,</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H2015\">gave</span> him <span class=\"wl wl-kjv\" data-code=\"H312\">another</span> <span class=\"wl wl-kjv\" data-code=\"H3820\">heart:</span> and all those <span class=\"wl wl-kjv\" data-code=\"H226\">signs</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to pass that <span class=\"wl wl-kjv\" data-code=\"H3117\">day.</span>","10":"And when they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> thither to the <span class=\"wl wl-kjv\" data-code=\"H1389\">hill,</span> behold, a <span class=\"wl wl-kjv\" data-code=\"H2256\">company</span> of <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> <span class=\"wl wl-kjv\" data-code=\"H7125\">met</span> him; and the <span class=\"wl wl-kjv\" data-code=\"H7307\">Spirit</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H6743\">came</span> upon him, and he <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesied</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> them.","11":"And it came to pass, when all that <span class=\"wl wl-kjv\" data-code=\"H3045\">knew</span> him <span class=\"wl wl-kjv\" data-code=\"H865\">beforetime</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that, behold, he <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesied</span> among the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets,</span> then the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> to <span class=\"wl wl-kjv\" data-code=\"H7453\">another,</span> What is this that is come unto the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H7027\">Kish?</span> Is <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> also among the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets?</span>","12":"And <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> of the same place <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> But who is their <span class=\"wl wl-kjv\" data-code=\"H1\">father?</span> Therefore it became a <span class=\"wl wl-kjv\" data-code=\"H4912\">proverb,</span> Is <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> also among the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets?</span>","13":"And when he had made an <span class=\"wl wl-kjv\" data-code=\"H3615\">end</span> of <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesying,</span> he <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the high <span class=\"wl wl-kjv\" data-code=\"H1116\">place.</span>","14":"And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul's</span> <span class=\"wl wl-kjv\" data-code=\"H1730\">uncle</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him and to his <span class=\"wl wl-kjv\" data-code=\"H5288\">servant,</span> <span class=\"wl wl-kjv\" data-code=\"H575\">Whither</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> ye? And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> To <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> the <span class=\"wl wl-kjv\" data-code=\"H860\">asses:</span> and when we <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that they were no <span class=\"wl wl-kjv\" data-code=\"H369\">where,</span> we <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel.</span>","15":"And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul's</span> <span class=\"wl wl-kjv\" data-code=\"H1730\">uncle</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">Tell</span> me, I pray thee, what <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto you.","16":"And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto his <span class=\"wl wl-kjv\" data-code=\"H1730\">uncle,</span> He <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> us <span class=\"wl wl-kjv\" data-code=\"H5046\">plainly</span> that the <span class=\"wl wl-kjv\" data-code=\"H860\">asses</span> were <span class=\"wl wl-kjv\" data-code=\"H4672\">found.</span> But of the <span class=\"wl wl-kjv\" data-code=\"H1697\">matter</span> of the <span class=\"wl wl-kjv\" data-code=\"H4410\">kingdom,</span> whereof <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">spake,</span> he <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> him not.","17":"And <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> <span class=\"wl wl-kjv\" data-code=\"H6817\">called</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> together unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> to <span class=\"wl wl-kjv\" data-code=\"H4709\">Mizpeh;</span>","18":"And <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> I brought <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> out of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and <span class=\"wl wl-kjv\" data-code=\"H5337\">delivered</span> you out of the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians,</span> and out of the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of all <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdoms,</span> and of them that <span class=\"wl wl-kjv\" data-code=\"H3905\">oppressed</span> you:","19":"And ye have this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> <span class=\"wl wl-kjv\" data-code=\"H3988\">rejected</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> who himself <span class=\"wl wl-kjv\" data-code=\"H3467\">saved</span> you out of all your <span class=\"wl wl-kjv\" data-code=\"H7451\">adversities</span> and your <span class=\"wl wl-kjv\" data-code=\"H6869\">tribulations;</span> and ye have <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Nay, but <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> a <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> over us. Now therefore <span class=\"wl wl-kjv\" data-code=\"H3320\">present</span> yourselves <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> by your <span class=\"wl wl-kjv\" data-code=\"H7626\">tribes,</span> and by your <span class=\"wl wl-kjv\" data-code=\"H505\">thousands.</span>","20":"And when <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> had caused all the <span class=\"wl wl-kjv\" data-code=\"H7626\">tribes</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> to come <span class=\"wl wl-kjv\" data-code=\"H7126\">near,</span> the <span class=\"wl wl-kjv\" data-code=\"H7626\">tribe</span> of <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin</span> was <span class=\"wl wl-kjv\" data-code=\"H3920\">taken.</span>","21":"When he had caused the <span class=\"wl wl-kjv\" data-code=\"H7626\">tribe</span> of <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin</span> to come <span class=\"wl wl-kjv\" data-code=\"H7126\">near</span> by their <span class=\"wl wl-kjv\" data-code=\"H4940\">families,</span> the <span class=\"wl wl-kjv\" data-code=\"H4940\">family</span> of <span class=\"wl wl-kjv\" data-code=\"H4309\">Matri</span> was <span class=\"wl wl-kjv\" data-code=\"H3920\">taken,</span> and <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H7027\">Kish</span> was <span class=\"wl wl-kjv\" data-code=\"H3920\">taken:</span> and when they <span class=\"wl wl-kjv\" data-code=\"H1245\">sought</span> him, he could not be <span class=\"wl wl-kjv\" data-code=\"H4672\">found.</span>","22":"Therefore they <span class=\"wl wl-kjv\" data-code=\"H7592\">enquired</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> further, if the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> should yet <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> <span class=\"wl wl-kjv\" data-code=\"H1988\">thither.</span> And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> Behold, he hath <span class=\"wl wl-kjv\" data-code=\"H2244\">hid</span> himself among the <span class=\"wl wl-kjv\" data-code=\"H3627\">stuff.</span>","23":"And they <span class=\"wl wl-kjv\" data-code=\"H7323\">ran</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">fetched</span> him thence: and when he <span class=\"wl wl-kjv\" data-code=\"H3320\">stood</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> he was <span class=\"wl wl-kjv\" data-code=\"H1361\">higher</span> than any of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> from his <span class=\"wl wl-kjv\" data-code=\"H7926\">shoulders</span> and <span class=\"wl wl-kjv\" data-code=\"H4605\">upward.</span>","24":"And <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">See</span> ye him whom the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H977\">chosen,</span> that there is none like him among all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people?</span> And all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H7321\">shouted,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> God <span class=\"wl wl-kjv\" data-code=\"H2421\">save</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span>","25":"Then <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">told</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> the <span class=\"wl wl-kjv\" data-code=\"H4941\">manner</span> of the <span class=\"wl wl-kjv\" data-code=\"H4410\">kingdom,</span> and <span class=\"wl wl-kjv\" data-code=\"H3789\">wrote</span> it in a <span class=\"wl wl-kjv\" data-code=\"H5612\">book,</span> and laid it <span class=\"wl wl-kjv\" data-code=\"H3240\">up</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span> And <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> ➔ all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">away,</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> to his <span class=\"wl wl-kjv\" data-code=\"H1004\">house.</span>","26":"And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> also <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">home</span> to <span class=\"wl wl-kjv\" data-code=\"H1390\">Gibeah;</span> and there <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> with him a band of <span class=\"wl wl-kjv\" data-code=\"H2428\">men,</span> whose <span class=\"wl wl-kjv\" data-code=\"H3820\">hearts</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> had <span class=\"wl wl-kjv\" data-code=\"H5060\">touched.</span>","27":"But the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H1100\">Belial</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> How shall this man <span class=\"wl wl-kjv\" data-code=\"H3467\">save</span> us? And they <span class=\"wl wl-kjv\" data-code=\"H959\">despised</span> him, and <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> him no <span class=\"wl wl-kjv\" data-code=\"H4503\">presents.</span> But he held his <span class=\"wl wl-kjv\" data-code=\"H2790\">peace.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"oliekruik,","tekst":"Of, olieflesje, olievaatje. Onder, 1Sa 16:13, waar van de zalving van David gesproken wordt, staat oliehoorn. Saul en Jehu [ 2Ki 9:1, 2Ki 9:3 ] zijn uit een oliekruik gezalfd geworden, maar David uit een hoorn."},{"catchword":"goot ze uit op zijn hoofd,","tekst":"Er zijn in het Oude Testament drieërlei personen met zalving in hun ambten ingehuldigd geworden, hogepriesters, koningen en profeten."},{"catchword":"kuste hem,","tekst":"Tot een teken van onderdanigheid, hem alzo erkennende voor zijn heer, dewijl hem God tot het koninklijke ambt geroepen had. Zie dergelijk exempel 1Ki 19:18, en vergelijk Psa 2:12."},{"catchword":"over Zijn erfdeel gezalfd heeft?","tekst":"Dat is, over zijn volk van Israël, hetwelk Hij zich tot een erfdeel uit alle natiën heeft verkoren; Deu 9:26, en Deu 32:9."}],"2":[{"catchword":"graf van Rachel,","tekst":"Dit graf was bij Bethlehem Juda, gelijk te zien is Gen 35:19-20, doch strekte die landpale aldaar aan de landpale van den stam Benjamins."},{"catchword":"Zelzah;","tekst":"Dit is de naam van een plaats, die nergens meer dan hier gevonden wordt, en betekent zoveel als een schone schaduw."}],"3":[{"catchword":"Elon-thabor,","tekst":"Anders, het vlakke veld Thabors, of, aan den elk Thabbors. Er zijn verscheidene plaatsen Thabor genoemd."},{"catchword":"Beth-el; een,","tekst":"Sommigen zetten het over: in het huis Gods; te weten, te Kiriath-Jearim, gelijk boven, 1Sa 7:1-2, 1Sa 7:16, waar de ark in dien tijd was."}],"4":[{"catchword":"naar uw welstand vragen,","tekst":"Zie Gen 43:27."}],"5":[{"catchword":"op den heuvel Gods,","tekst":"Dit is een hoogte geweest bij de stad Gibea, waar een school was van jonge profeten. In de stad zelve hadden de Filistijnen hun bezetting, gelijk straks volgt. Anders, te Gibea Gods"},{"catchword":"bezettingen zijn;","tekst":"Dat is, garnizoen, de wacht houdende, gelijk onder, 1Sa 13:3."},{"catchword":"hoop profeten,","tekst":"Hebreeuws, een zeel, of, snoer; dat is, een hoop mannen, die in orde gaan en als een linie, of koord trekken; en alzo vs.10."},{"catchword":"luiten, trommelen, pijpen, harpen","tekst":"Met deze muziekinstrumenten verkwikten zij zich en verwekten hun geest om te profeteren. Zie een dergelijk exempel 2Ki 3:15. In het Hebreeuws staan deze woorden in het eenvoudig getal."},{"catchword":"profeteren","tekst":"Dat is, van hemelse, goddelijke, heilige, stichtelijke dingen spreken en zingen."}],"6":[{"catchword":"gij zult met hen profeteren;","tekst":"Dat is, gij zult een tijdlang de gave der profetie hebben. Zie Num 11:25."},{"catchword":"gij zult in een anderen man veranderd worden","tekst":"Dat is, gij zult het hart van een kloeken, verstandigen held krijgen, om te regeren en krijg te voeren, gelijk het een koning betaamt."}],"7":[{"catchword":"doe gij,","tekst":"Dat is, al wat de nood en de gelegenheid vereist, wat gedaan moet worden ten beste van het land. Doe dat als een wijs en kloekmoedig koning. Dit heeft Saul gedaan, toen hij uitgetrokken is om te strijden tegen de Ammonieten 1Sa 11, en de Filistijnen, 1Sa 13. Aangaande de manier van spreken, zie Jdg 9:33."}],"8":[{"catchword":"naar Gilgal,","tekst":"Versta, doch eerst naar Mizpa, gelijk te zien is vs.17, en 1Sa 11:14. Te Mizpa is Saul door het lot tot koning verkoren; doch te Gilgal is hij bevestigd geworden."},{"catchword":"om te offeren offeranden der dankzegging;","tekst":"Zie onder, 1Sa 23:8."}],"9":[{"catchword":"schouder keerde,","tekst":"Dat is, rug."}],"10":[{"catchword":"zij daar aan den heuvel kwamen,","tekst":"Te weten, Saul en zijn jongen."},{"catchword":"profeten tegemoet;","tekst":"Versta hier, door het woord profeten, de discipelen der profeten die zich oefenden en studeerden in de Heilige Schrift."}],"11":[{"catchword":"van te voren gekend had,","tekst":"Hebreeuws, van gisteren, eergisteren"},{"catchword":"een ieder tot zijn metgezel","tekst":"Dat is, de een tot den ander."}],"12":[{"catchword":"een man van daar,","tekst":"Vermoedelijk een uit het getal van die profeten."},{"catchword":"Wie is toch hun vader?","tekst":"Alsof hij zeide: Even diezelfde God en Vader, die den anderen den Geest der profetie gegeven heeft, die is machtig dien ook Saul te geven. Eenigen nemen hier het woord vader voor leermeester; gelijk de discipelen der profeten genoemd worden zonen der profeten. Sommigen nemen het alzo: Wie is hunlieder vader? dat is, de anderen hebben zowel ongeleerde vaders als Saul, maar dit is een werk Gods."},{"catchword":"Is Saul ook onder de profeten?","tekst":"Dit spreekwoord gebruikt men wanneer men van iemand spreekt, die onverhoeds en onverwachts iets voortreffelijks, of iets bijzonders doet."}],"13":[{"catchword":"op de hoogte","tekst":"Te weten, in de school of synagoge, die op den heuvel Gods was, vs.5."}],"16":[{"catchword":"voorzeker te kennen gegeven,","tekst":"Hebreeuws, te kennen gevende, te kennen gegeven"},{"catchword":"gaf hij hem niet te kennen","tekst":"Het schijnt dat Samuël hem zulks verboden had; en opdat het te geheimer blijven zou, had Samuël gezegd dat Saul zijn jongen zou doen vertrekken, 1Sa 9:27."}],"17":[{"catchword":"tot den HEERE,","tekst":"Te weten, om als voor den Heere, in de vergadering van Gods volk te verschijnen, tot verkiezing en bevestiging van een koning, of, naar sommiger mening, voor de ark des verbonds, vanwaar God de Heere antwoord gaf. Om deze zaak zou de ark daar gebracht zijn, doch hierna te Gilgal, gelijk af te nemen is onder, 1Sa 11:15."}],"19":[{"catchword":"ellenden en uw noden","tekst":"Hebreeuws, kwaden"},{"catchword":"tot Hem gezegd","tekst":"Dat is, tot mij, die zijn profeet ben. Zie boven, 1Sa 8:19, en onder, 1Sa 12:12."},{"catchword":"naar uw duizenden","tekst":"De stammen der Israëlieten werden in zekere hopen, elk van duizend man, afgedeeld, gelijk Mic 5:1 en elders te zien is."}],"20":[{"catchword":"had doen naderen,","tekst":"Te weten, om het lot te werpen. Zie dergelijk exempel Jos 7:14. Eer zij het lot wierpen, baden zij den Heere, vs.22; Act 1:24."},{"catchword":"geraakt","tekst":"Te weten, met het lot. Hebreeuws, gevat, getroffen; dat is, het lot viel op den stam van Benjamin, waarmede God de Heere wilde te kennen geven dat het een onder de huisgezinnen van dien stam was, welken Hij tot koning wilde zetten."}],"22":[{"catchword":"vaten verstoken","tekst":"Dat is, onder de bagage des volks."}],"24":[{"catchword":"het ganse volk,","tekst":"Het grootste deel des volks; want daar waren er enigen, die hem verachtten, gelijk te zien is vs.27."},{"catchword":"koning leve","tekst":"Zie 1Ki 1:25."}],"25":[{"catchword":"het recht des koninkrijks,","tekst":"Versta dit niet van de wijze, manier, of gewoonte van doen, die de koningen onwettiglijk somwijlen aannemen, [gelijk het Hebreeuwse woord genomen is boven 1Sa 8:9, 1Sa 8:11 ] , maar van de wetten, die Samuël door Gods ingeven stelde, aangaande de regering der koningen. Zie Deu 17:18. Of van de ordonnantiën om zowel den koning als de onderzaten te leren, hoe zij zich tegen elkander gedragen zouden."},{"catchword":"in een boek,","tekst":"Dit boek is niet meer voorhanden."},{"catchword":"voor het aangezicht des HEEREN","tekst":"Dat is, voor den HEERE, die zijn tegenwoordigheid boven de ark openbaarde."}],"27":[{"catchword":"de kinderen Belials zeiden","tekst":"Zie Deu 13:13."},{"catchword":"geen geschenk","tekst":"Gelijk de onderdanen plachten te doen tot een teken van gehoorzaamheid en dat zij hem erkenden voor hun koning. Zie 2Ch 17:5;; Mat 2:11."},{"catchword":"als doof","tekst":"Of, als stom, als stilzwijgende."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Then Samuel took a vial [Or, bottle, vessel] of oil [Below chap.16.13. where is spoken of Davids anointing, there is mentioned a horn of oil. Saul, and Jehu, (2 Kings 9.1,3.) were anointed out of a vail of oil, but David out of an horn] and poured it out upon his head, [in the Old Testament three sorts of persons were instilled into their offices by anointing, high Priests, Kings, and Prophets] and kissed him: [in token of subjection, thereby acknowledging him to be his Lord, for asmuch as God had called him to the Kingly office. See the like example, I Kings 19.18. and compare Psal.2.12.] and said, Is it not (so) that the LORD hath anointed thee to be a Leader over his own inheritance? [i.e. over his people of Israel, whom the Lord hath chosen out of all nations for his own inheritance.]"}],"2":[{"catchword":null,"tekst":"When thou departest from me to day, then thou shalt finde two men by Rachels sepulchre, [This sepulchre was near unto Bethlehem Juda, as appeareth, Gen.35 19,20. Benjamin] on the border of Benjamin at Zelzah: [This is the name of a place, no where else found but here, and signifieth as much as a fair shadow] they will say unto thee, The she-asses are found, which thou wentest to seek, and nehold, thy father hath left the matters of the she-asses, and he is solicitous for you saying, What shall I do for my son?"}],"3":[{"catchword":null,"tekst":"When thou goest on forward from thence, and shalt come unto Elon-Thabor, [Oth. the plan field of Thabor, or, at the Oak of Thabor; there be divers places called Thabor] there three men shall finde thee, going up to God to Bethel; [Some translate it, unto the house of God, to wit, at Kiriath-Jeriam, as above chap.7.1,2,16. where the Ark was at that time] one carrying three Kids and one carrying three loaves of bread, and one carrying a bottle of wine."}],"4":[{"catchword":null,"tekst":"And they will ask thee of (thy) welfare; [See Gen 43:27.] and they shall give thee two (loaves) of bread, them thou shalt receive of their hand."}],"5":[{"catchword":null,"tekst":"After that thou shalt come to the hill of God, [This was an high place near the City of Gibea, where there was a school of young Prophets. In the City itself, the Philistines had their garrison, as immediately followeth. Oth. to Gibea of God] where are the forces of the Philistines: [i.e. Garrison,keeping watch, as below chap.13.3.] and it shall come to pass&Atilde;&copy;, when thou comest there into the City, that thou shalt meet an heap, [Heb. a cord, or, string; that is, a company of men, that march in rank and order, and as it were draw one line, or, cord: and so vers.10.] of Prophets coming down from the high place, and before their faces Lutes, and Tabrets, and Pipes, and Harps, [With these Musical instruments they revived themselves, and aroused up their Spirit to Prophesie. See the like example, 2 Kings 3.15.] In the Hebrew these words are put in the singular number] and they shall Prophesie. [i.e. Speak and sing of heavenly, Divine, holy edifying things.]"}],"6":[{"catchword":null,"tekst":"And the Spirit of the LORD shall be ready upon thee, and thou shalt Prophesie with them, [i.e. thou shalt for some space of time have the gift of Prophesie. See num 11.25.] and thou shalt be changed into another man, [i.e. thou shall get a bold, courageous, wise, and understanding heart, fit for government and for managing war-like affairs, as it becometh a King to have."}],"7":[{"catchword":null,"tekst":"And it shall come to pass&Atilde;&copy;, when these signs shall come unto thee, do thou what time hand shall finde, [i.e. what-ever the necessity and occasion require to be done for the good of the Land, do it as a wise and courageous King. This did Saul do, when he went forth to fight against the ammonites; chap.11. and against the Philistines chap.13. Concerning the phrase, see Judg.9. on vers.33.] for God will be with thee."}],"8":[{"catchword":null,"tekst":"Now thou shalt go down before my face to Gilgal, [Yet understand first to Mizpa, as appeareth vers.17. and chap.11.14. Saul was by lot chosen King at Mizpa, but installed at Gilgal] and behold, I will come down to thee, to offer burnt-offerings, to offer sacrifice of thanksgiving: [See below chap.13.8.] seven dayes shall thou tarry (there) till I come unto thee, and tell thee what thou shalt do."}],"9":[{"catchword":null,"tekst":"Now it came to pass&Atilde;&copy;, when he turned his shoulder; [i.e. back] to go from Samuel; (that) God changed his heart (into) another: and all those tokens came (to pass&Atilde;&copy;) the same day."}],"10":[{"catchword":null,"tekst":"When they [viz. Saul and his servant] came thither to the hill, there (came) an heap of Prophets [Understand here by by the word Prop ets, the Disciples,or, Scholars of the Prophets, that exercised themselves in, and studied the Hebr: Scripture] to meet him: and the Spirit of the LORD waxed ready upon him; and he Prophesied in the midst of them."}],"11":[{"catchword":null,"tekst":"And it came to pass&Atilde;&copy;, when every one that had known him before of old time, [Heb. from yesterday, ere yesterday] saw, that he, behold, prophesied with the Prophets, that the people said, every one to his fellow, [i.e. the one to the other] what is this, that hath hapned to the Son of Kis? Is Saul also among the Prophets?"}],"12":[{"catchword":null,"tekst":"Then answered a man of that place, [Perhaps one out of the number of those Prophets] and said, but who is their father? [As if he hd said, even the same God and Father, who hathh given to the rest the Spirit of Prophesie, he is also able to give the same unto Saul. Some do here take the word Father, for Teacher: as the Disciples, or, Scholars of the Prophets, are called sons of the Prophets. Some take it thus: who is their Father? i.e. the others have as mean fathers as Saul, bu this is a special work of God] therefore it&acirc;&euro;&trade;s become a Proverb, Is Saul also among the Prophets? [This Proverb is commonly used, when we speak of any one, that doeth act some great or special matter unawares, and unexpectedly.]"}],"13":[{"catchword":null,"tekst":"Now which he had made an end of Prophecying, he came unto the high place, [viz. into the School or Synagogue, which was upon the Hill of God, vers.6.]"}],"14":[{"catchword":null,"tekst":"And Sauls Uncle said unto him, and unto his servant, Whither went ye? now he said, To seek the she-asses: when we saw that they were not there, then we came to Samuel."}],"15":[{"catchword":null,"tekst":"Then said Sauls Uncle; Tell me I pray thee, what Samuel said unto you?"}],"16":[{"catchword":null,"tekst":"Now Saul said unto his Uncle, he told us certainly; [Heb. telling told] that the she-asses were found: but the matter of the Kingdom, whereof Samuel had said, he told him not. [It seemeth that Samuel had forbidden him to do it: And that it might be kept the more close, Samuel had spoken to Saul. To bid his servant remove, or, go out of the way; when they two communed together, chap.9.27.]"}],"17":[{"catchword":null,"tekst":"But Samuel called the people together unto the LORD at Mizpa. [viz. To appear, as before the LORD, in the assembly of Gods people, to the chusing and installing of a King: Or, according to the opinion of some, before the Ark of the Covenant, from whence the Lord gave answer. For this cause might the Ark be brought thither, but hereafter at Gilgal, as may be gathered below, chap.11.15.]"}],"18":[{"catchword":null,"tekst":"And he said unto the Children of Israel, Thus hath the LORD the God of Israel spoken, I brought up Israel out of Egypt, and I delivered you out of the hand of the Egyptians, and out of the hand of all Kingdoms, but oppressed you."}],"19":[{"catchword":null,"tekst":"But ye have this day rejected your God, who hath delivered you out of all your miseries, [Heb. evils] and your necessities, and have said unto him, [i.e. unto me, who am his Prophet; See above chap.8.19. and below chap.12.12.] Set a King over us: now then present your selves before the face of the LORD, according to your tribes, and according to your thousands. [The tribes of the Israelites were divided into certain companies, each company consisting of a thousand men, as mich.5.2. and else where appeareth.]"}],"20":[{"catchword":null,"tekst":"Now when Samuel had caused all the tribes of Israel to come neer, [viz. to cast the lot. See the like example, Jos.7.14. Before they cast the lot, they prayed unto the Lord, vers.22. Act.1.24.] the tribe of Benjamin was touched. [viz. with the lot. Heb. hit, caught, taken: i.e. the lot fell upon the tribe of Benjamin, whereby the Lord would signifie, that it was one among the families of the tribes, whom he would appoint to be King.]"}],"21":[{"catchword":null,"tekst":"When he made the tribe of Benjamin to come on according to their families, the family of Matri was troubled: and Saul the son of Kis was touched, and they sought him, but he was not found."}],"22":[{"catchword":null,"tekst":"Then they further enquired of the LORD, whether that man would ye come thither? then the LORD said, Behold, he hath hid himself among the vessels. [i.e. among the stuff, or, baggage of the people.]"}],"23":[{"catchword":null,"tekst":"Now they ran, and took him from thence, and he set himself in the midst of the people: and he was taller then all the people, from his shoulder and upward."}],"24":[{"catchword":null,"tekst":"Then said Samuel unto all the people: Do ye see, whom the LORD hath chosen? for there is none like him among all the people: then all the people [i.e. the greatest part of the people: for there were some that despised him, as appeareth vers.27.] shouted, and said, Let the King live. [See I Kings 1. On v.25.]"}],"25":[{"catchword":null,"tekst":"Now Samuel told the people the right of the Kingdom, [Understand this, not of the way, manner,or custome of acting, which Kings sometimes take up contrary to Law, (as the Hebrew word is ta // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
