n met andere talen, zoals de Geest hun gaf uit te spreken.", "Hos 12:11": "En Ik zal spreken tot de profeten, en Ik zal het gezicht vermenigvuldigen; en door de dienst van de profeten zal Ik gelijkenissen voorstellen.", "Neh 9:28": "Maar toen zij rust hadden, keerden zij weer terug om kwaad te doen voor Uw aangezicht; toen verliet U hen in de hand van hun vijanden, zodat zij over hen heersten; en toen zij zich dan bekeerden, en U aanriepen, hebt U hen vanuit de hemel gehoord, en hebt hen naar Uw barmhartigheden vele malen uitgered.", "Hebr 3:5": "En Mozes is wel trouw geweest in heel Zijn huis, als een dienaar, tot getuigenis van de dingen die daarna gesproken zouden worden;", "1 Sam 9:17": "Toen Samuel Saul zag, antwoordde de HEERE hem: Zie, dit is de man, van wie Ik u gezegd heb: Deze zal over Mijn volk heersen.", "Ps 150:3": "Loof Hem met geschal van de bazuin; loof Hem met de luit en met de harp!", "2 Kron 23:11": "Toen brachten zij de zoon van de koning naar buiten, en zetten hem de kroon op, en gaven hem de getuigenis, en zij maakten hem koning; en Jojada en zijn zonen zalfden hem, en zeiden: Leve de koning!", "Hos 4:13": "Op de toppen van de bergen offeren zij, en op de heuvels branden zij reukwerk, onder een eik, en populier, en iepenboom, omdat de schaduw daarvan goed is; daarom hoereren uw dochters, en uw bruiden plegen overspel.", "1 Sam 2:12": "Doch de zonen van Eli waren kinderen van Belial; zij kenden de HEERE niet.", "1 Sam 19:23": "Toen ging hij daarheen naar Najoth bij Rama; en dezelfde Geest van God kwam ook op hem, en al voortgaande profeteerde hij, totdat hij in Najoth in Rama aankwam.", "Num 27:21": "En hij zal voor Eleazar, de priester, staan, die voor hem om raad zal vragen, volgens de wijze van Urim, voor de HEERE; naar zijn woord zullen zij uitgaan, en naar zijn woord zullen zij ingaan, hij, en alle kinderen van Israël met hem, en de hele vergadering.", "Richt 14:6": "Toen kwam de Geest van de HEERE machtig over hem, zodat hij hem uiteenscheurde, zoals men een bokje uiteenscheurt, en er was niets in zijn hand; maar hij vertelde zijn vader en zijn moeder niet wat hij gedaan had.", "2 Sam 16:16": "En het gebeurde, toen Husai, de Archiet, Davids vriend, bij Absalom kwam, dat Husai tegen Absalom zei: Leve de koning, leve de koning!", "1 Kon 18:46": "En de hand van de HEERE was op Elia, en hij gordde zijn lenden, en liep voor het aangezicht van Achab uit, tot waar men bij Jizreël komt.", "1 Sam 24:15": "Achter wie is de koning van Israël uitgetrokken? Wie jaagt u na? Een dode hond, een enkele vlo!", "Openb 14:13": "En ik hoorde een stem uit de hemel, die tegen mij zei: Schrijf, zalig zijn de doden die in de Heere sterven, van nu aan. Ja, zegt de Geest, opdat zij rusten van hun arbeid; en hun werken volgen met hen.", "Hagg 1:13": "Toen sprak Haggai, de bode van de HEERE, in de boodschap van de HEERE, tot het volk, en hij zei: Ik ben met u, spreekt de HEERE.", "Gen 35:18-20": "En het gebeurde, toen haar ziel heenging (want zij stierf), dat zij zijn naam Ben-Oni noemde; maar zijn vader noemde hem Benjamin. Zo stierf Rachel; en zij werd begraven aan de weg naar Efrath, dat is Bethlehem. En Jakob richtte een gedenkteken op boven haar graf; dit is het gedenkteken van Rachels graf tot op deze dag.", "Joël 2:28": "En daarna zal het gebeuren, dat Ik Mijn Geest zal uitgieten over alle vlees, en uw zonen en uw dochters zullen profeteren; uw ouden zullen dromen dromen, uw jongelingen zullen gezichten zien;", "1 Sam 8:7-9": "Doch de HEERE zei tegen Samuël: Hoor naar de stem van het volk in alles wat zij tegen u zeggen zullen; want zij hebben u niet verworpen, maar zij hebben Mij verworpen, dat Ik geen Koning over hen zal zijn. Naar de werken die zij gedaan hebben, vanaf de dag dat Ik hen uit Egypte geleid heb, tot op deze dag toe, en Mij hebben verlaten en andere goden gediend; zo doen zij u ook. Hoor dan nu naar hun stem; doch als u hen op het uiterste zult gewaarschuwd hebben, dan zult u hun de wijze van de koning bekendmaken, die over hen regeren zal.", "1 Sam 9:6": "Hij daarentegen zei tegen hem: Zie toch, er is een man van God in deze stad, en hij is een geëerd man; alles wat hij zegt, komt zeker uit; laten wij nu daarheen gaan, misschien zal hij ons onze weg aanwijzen, die wij gaan zullen.", "Hand 2:7": "En zij ontzetten zich allen, en verwonderden zich, en zeiden tegen elkaar: Zie, zijn deze allen die daar spreken niet Galileeërs?", "Hand 2:30": "Omdat hij dan een profeet was, en wist dat God hem met een eed gezworen had dat Hij uit de vrucht van zijn lichaam, wat het vlees betreft, de Christus zou verwekken om Hem op zijn troon te zetten;", "1 Kron 15:19-21": "De zangers nu, Heman, Asaf en Ethan, lieten zich horen met koperen cimbalen; En Zecharja, en Aziël, en Semiramoth, en Jehiel, en Unni, en Eliab, en Maaseja, en Benaja, met luiten op Alamoth. En Mattithja, en Elifele, en Mikneja, en Obed-edom, en Jeiel, en Azazja, met harpen op de Scheminith, om de toon te versterken.", "1 Sam 9:2": "Die had een zoon, wiens naam Saul was, een jongeman, en knap, ja, er was geen knapper man dan hij onder de kinderen van Israël; van zijn schouders en opwaarts was hij hoger dan al het volk.", "Richt 6:21": "En de Engel van de HEERE stak het uiteinde van de staf uit, die in Zijn hand was, en raakte het vlees en de ongezuurde koeken aan; toen ging er vuur op uit de rots, en verteerde het vlees en de ongezuurde koeken. En de Engel van de HEERE verdween uit zijn ogen.", "Rom 1:2": "(Wat Hij van tevoren beloofd had door Zijn profeten, in de heilige Schriften),", "Ps 103:7": "Hij heeft Mozes Zijn wegen bekendgemaakt, aan de kinderen van Israël Zijn daden.", "1 Sam 19:20-24": "Toen zond Saul boden om David te halen; die zagen een groep profeten, die profeteerden, en Samuël stond daarbij, over hen aangesteld; en de Geest van God kwam over Sauls boden, en ook zij profeteerden. Toen men het Saul berichtte, zond hij andere boden, en ook zij profeteerden; toen zond Saul opnieuw, voor de derde keer, boden, en ook zij profeteerden. Daarna ging hij ook zelf naar Rama, en hij kwam bij de grote waterput die te Sechu was, en hij vroeg: Waar zijn Samuël en David? Toen werd hem gezegd: Zie, zij zijn in Najoth bij Rama.", "1 Kron 15:28": "Zo bracht heel Israël de ark van het verbond van de HEERE op, met gejuich, en met geluid van de bazuin, en met trompetten, en met cimbalen, en maakte geluid met luiten en met harpen.", "Num 9:8-10": "En Mozes zei tot hen: Blijf staan, dat ik hoor wat de HEERE u gebieden zal. Toen sprak de HEERE tot Mozes en zei: Spreek tot de kinderen van Israël en zeg: Wanneer iemand onder u, of onder uw geslachten, onrein is door een dood lichaam, of op een verre reis zal zijn, dan zal hij toch de HEERE het pascha houden.", "Zach 1:1": "In de achtste maand, in het tweede jaar van Darius, kwam het woord van de HEERE tot Zacharia, de zoon van Berechja, de zoon van Iddo, de profeet, en hij zei:", "2 Kon 5:8": "Maar het gebeurde, toen Elisa, de man van God, gehoord had dat de koning van Israël zijn kleren had gescheurd, dat hij naar de koning stuurde, om te zeggen: Waarom hebt u uw kleren gescheurd? Laat hem nu naar mij toe komen, dan zal hij weten dat er een profeet in Israël is.", "Gen 41:38": "Toen zei Farao tegen zijn dienaars: Zouden wij wel een man vinden zoals deze, in wie de Geest van God is?", "Ex 35:35": "Hij heeft hen vervuld met wijsheid van hart, om alle werk te maken van een werkmeester, en van de allervernuftigste handwerker, en van de borduurder in hemelsblauw, en in purper, in scharlaken, en in fijn linnen, en van de wever; die alle werk maken, en vernuftig werk bedenken.", "Hebr 1:1": "Nadat God voortijds veelmaal en op velerlei wijze tot de vaderen gesproken heeft door de profeten, heeft Hij in deze laatste dagen tot ons gesproken door de Zoon;", "2 Kon 3:15": "Nu dan, brengt mij een speelman. En het gebeurde, toen de speelman op de snaren speelde, dat de hand van de HEERE op hem kwam.", "Richt 6:7-10": "En het gebeurde, toen de Israëlieten tot de HEERE riepen vanwege de Midianieten, dat de HEERE een man zond, die een profeet was, naar de Israëlieten; die zei tegen hen: Zo zegt de HEERE, de God van Israël: Ik heb u uit Egypte doen optrekken, en u uit het slavenhuis uitgeleid; en Ik heb u verlost uit de hand van de Egyptenaren, en uit de hand van allen die u onderdrukten; en Ik heb hen voor uw ogen verdreven, en u hun land gegeven;", "Luk 4:23": "En Hij zei tegen hen: U zult zonder twijfel dit spreekwoord tegen Mij zeggen: Dokter, genees Uzelf; al wat wij gehoord hebben dat in Kapernaüm gebeurd is, doe dat ook hier in Uw vaderland.", "Hand 28:25": "En omdat zij het onderling oneens waren, gingen zij uiteen, nadat Paulus dit ene woord gezegd had, namelijk: Terecht heeft de Heilige Geest gesproken door de profeet Jesaja tot onze voorvaders,", "Ex 4:12": "En nu ga heen, en Ik zal met uw mond zijn, en zal u leren, wat u spreken zult.", "Openb 10:7": "maar in de dagen van de stem van de zevende engel, wanneer hij zal bazuinen, dan zal het geheimenis van God vervuld worden, zoals Hij aan Zijn dienstknechten, de profeten, verkondigd heeft.", "Openb 2:7": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, hem zal Ik geven te eten van de boom des levens, die in het midden van het paradijs van God is.", "Hand 11:28": "En een van hen, met de naam Agabus, stond op en maakte door de Geest bekend dat er een grote hongersnood zou komen over de hele wereld; die is ook gekomen onder keizer Claudius.", "1 Kron 28:12": "en een bereiding van alles wat bij hem was door de Geest, namelijk van de voorhoven van het huis van de HEERE, en van alle kamers rondom; van de schatten van het huis van God, en van de schatten van de heilige dingen;", "Ex 19:5": "Nu dan, als u nauwgezet Mijn stem gehoorzaamt en Mijn verbond houdt, zult u Mijn eigendom zijn uit alle volken, want de hele aarde is Mijn;", "Jer 42:7": "En het gebeurde na tien dagen, dat het woord van de HEERE tot Jeremia kwam.", "Job 32:8": "Zeker, de geest die in de mens is, en de inblazing van de Almachtige, maakt hen verstandig.", "Jes 38:7": "En dit zal u een teken zijn van de HEERE, dat de HEERE het woord dat Hij gesproken heeft, doen zal:", "1 Sam 10:9-12": "Het gebeurde nu, toen hij zich omkeerde om van Samuël weg te gaan, dat God hem een ander hart gaf; en al die tekenen kwamen die dag uit. Toen zij daar bij de heuvel kwamen, zie, toen kwam hem een groep profeten tegemoet; en de Geest van de HEERE werd vaardig over hem, en hij profeteerde in hun midden. En het gebeurde, toen ieder die hem vroeger gekend had, zag dat hij, zie, profeteerde met de profeten, dat het volk zei, de een tegen de ander: Wat is dit, dat de zoon van Kis is overkomen? Is Saul ook onder de profeten?", "1 Sam 14:41": "Saul nu sprak tot de HEERE, de God van Israël: Toon de onschuldige. Toen werden Jonathan en Saul aangewezen, en het volk ging vrijuit.", "Jer 18:1": "Het woord dat van de HEERE tot Jeremia gebeurde, en Hij zei:", "1 Sam 22:6": "En Saul hoorde dat David bekend geworden was, en de mannen die bij hem waren. Saul nu zat op een heuvel onder het geboomte te Rama, en hij had zijn speer in zijn hand, en al zijn knechten stonden bij hem.", "1 Kron 12:40": "En ook degenen die dicht bij hen woonden, tot aan Issaschar, en Zebulon, en Nafthali, brachten brood op ezels, en op kamelen, en op muildieren, en op runderen, meel, klompen gedroogde vijgen, en rozijnenkoeken, en wijn, en olie, en runderen, en kleinvee in overvloed; want er was blijdschap in Israël.", "1 Kon 19:9": "En hij kwam daar in een grot, en overnachtte daar; en zie, het woord van de HEERE kwam tot hem, en Hij zei tegen hem: Wat doet u hier, Elia?", "Joz 7:16-18": "Toen stond Jozua 's morgens vroeg op, en liet Israël aankomen naar zijn stammen; en de stam van Juda werd aangewezen. Toen hij het geslacht van Juda liet aankomen, wees hij het geslacht van Zarchi aan. Toen hij het geslacht van Zarchi liet aankomen, man voor man, werd Zabdi aangewezen; Diens huisgezin liet hij aankomen, man voor man, en Achan werd aangewezen, de zoon van Charmi, de zoon van Zabdi, de zoon van Zerah, uit de stam van Juda.", "Hand 13:21": "En vanaf toen verlangden zij naar een koning; en God gaf hun Saul, de zoon van Kis, een man uit de stam van Benjamin, veertig jaar lang.", "2 Kron 17:5": "En de HEERE bevestigde het koninkrijk in zijn hand, en heel Juda gaf Josafat geschenken; en hij had rijkdom en eer in overvloed.", "1 Tess 5:26": "Groet al de broeders met een heilige kus.", "Spr 16:1": "De mens heeft plannen van het hart; maar het antwoord van de tong is van de HEERE.", "Jak 1:17": "Elke goede gave en elk volmaakt geschenk is van boven, afkomstig van de Vader der lichten, bij Wie geen verandering is, of schaduw van omkering.", "Dan 2:19": "Toen werd aan Daniël in een nachtvisioen het geheim geopenbaard; toen loofde Daniël de God van de hemel.", "Lev 3:6": "En als zijn offergave van het kleinvee is, voor de HEERE tot een dankoffer, hetzij mannetje of vrouwtje, volmaakt zal hij het offeren.", "Neh 9:27": "Daarom hebt U hen gegeven in de hand van hun belagers, die hen benauwd hebben; maar toen zij in de tijd van hun benauwdheid tot U riepen, hebt U vanuit de hemel gehoord, en hun naar Uw grote barmhartigheden verlossers gegeven, die hen uit de hand van hun belagers verlosten.", "1 Kron 25:1-7": "David, alsook de leiders van het leger, wees af voor de dienst enkele van de kinderen van Asaf, en van Heman, en van Jeduthun, die met harpen, met luiten en met cimbalen zouden profeteren; en zij die onder hen geteld werden, waren mannen die bekwaam waren tot het werk van hun dienst. Van de kinderen van Asaf waren Zakkur, en Jozef, en Nethanja, en Asarela, kinderen van Asaf; onder leiding van Asaf, die onder leiding van de koning profeteerde. Aangaande Jeduthun: de kinderen van Jeduthun waren Gedalja, en Zeri, en Jesaja, Hasabja en Mattithja, zes; onder leiding van hun vader Jeduthun, die op harpen profeteerde om de HEERE te danken en te loven.", "Jer 31:29": "In die dagen zullen zij niet meer zeggen: De vaders hebben onrijpe druiven gegeten, en de tanden van de kinderen zijn stomp geworden.", "Hand 7:10": "en verloste hem uit al zijn verdrukkingen, en gaf hem genade en wijsheid voor Farao, de koning van Egypteland; en hij stelde hem aan als leider over Egypte en zijn hele huis.", "2 Kron 15:1": "Toen kwam de Geest van God op Azaria, de zoon van Oded.", "Ps 89:13": "Het noorden en het zuiden, die hebt Gij geschapen; Thabor en Hermon juichen in Uw Naam.", "Gen 35:3": "En laten wij ons opmaken en optrekken naar Bethel; en ik zal daar een altaar maken voor de God Die mij antwoordt op de dag van mijn benauwdheid, en met mij geweest is op de weg die ik gegaan heb.", "2 Kron 20:14": "Toen kwam de Geest van de HEERE in het midden van de samenkomst, op Jahaziël, de zoon van Zecharja, de zoon van Benaja, de zoon van Jehiël, de zoon van Matthanja, de Leviet, uit de zonen van Asaf;", "Luk 1:15": "Want hij zal groot zijn voor de Heere; hij zal geen wijn en geen sterke drank drinken, en hij zal met de Heilige Geest vervuld worden, al vanaf de moederschoot.", "2 Petr 1:21": "Want de profetie is vroeger nooit voortgebracht door de wil van een mens, maar de heilige mensen van God hebben gesproken, gedreven door de Heilige Geest.", "Dan 10:7-9": "En ik, Daniël, zag alleen dat gezicht, maar de mannen die bij mij waren, zagen dat gezicht niet; maar er viel een grote schrik op hen, en zij vluchtten om zich te verbergen. Ik dan bleef alleen achter, en zag dit grote gezicht, en er bleef in mij geen kracht over; en mijn schoonheid veranderde in verval, zodat ik geen kracht behield. En ik hoorde de stem van Zijn woorden; en toen ik de stem van Zijn woorden hoorde, viel ik in een diepe slaap op mijn gezicht, met mijn gezicht op de grond.", "Jer 11:18": "De HEERE nu heeft het mij te kennen gegeven, dat ik het weet; toen hebt U mij hun handelingen laten zien.", "Jes 30:29": "Er zal een lofzang bij u zijn, zoals in de nacht wanneer het feest geheiligd wordt; en blijdschap van het hart, zoals van iemand die met pijpen wandelt, om te komen tot de berg van de HEERE, tot de Rotssteen van Israël.", "Ezech 11:24": "Daarna nam de Geest mij op, en bracht mij in een gezicht door de Geest van God naar Chaldea, tot de weggevoerde gevangenen; en het gezicht dat ik gezien had, steeg van mij op.", "Jer 1:2": "Tot wie het woord van de HEERE kwam, in de dagen van Josia, zoon van Amon, koning van Juda, in het dertiende jaar van zijn regering.", "1 Sam 3:4-10": "dat de HEERE Samuël riep; en hij zei: Hier ben ik. En hij liep naar Eli en zei: Hier ben ik, want u hebt mij geroepen. Doch hij zei: Ik heb niet geroepen, keer terug, ga liggen. En hij ging heen en legde zich neer. Toen riep de HEERE Samuël opnieuw; en Samuël stond op en ging naar Eli, en zei: Hier ben ik, want u hebt mij geroepen. Hij dan zei: Ik heb u niet geroepen, mijn zoon; keer terug, ga liggen.", "Hand 21:10": "En toen wij daar veel dagen gebleven waren, kwam er een zekere profeet uit Judea aan, met de naam Agabus.", "Ps 89:21": "Ik heb David, Mijn knecht, gevonden; met Mijn heilige olie heb Ik hem gezalfd;", "Ex 33:9": "En het gebeurde, als Mozes de tent binnengegaan was, dat de wolkkolom neerdaalde en bleef staan in de deur van de tent, en Hij sprak met Mozes.", "Ps 78:27-32": "En Hij regende op hen vlees als stof, en gevleugeld gevogelte als zand van de zeeën; En liet het vallen in het midden van zijn leger, rondom zijn woningen. Toen aten zij, en werden zeer zat; zodat Hij hun hun lust toebracht.", "Jer 3:6": "Verder zei de HEERE tegen mij, in de dagen van koning Josia: Hebt u gezien wat het afgekeerde Israël gedaan heeft? Zij ging op elke hoge berg en onder elke groene boom, en hoereerde daar.", "1 Kron 12:39": "En zij waren daar bij David drie dagen lang, etend en drinkend; want hun broeders hadden voor hen iets toebereid.", "Joh 1:47": "En Nathanaël zei tegen hem: Kan uit Nazareth iets goeds komen? Filippus zei tegen hem: Kom en zie.", "Ps 43:4": "En dat ik inga tot Gods altaar, tot de God van de blijdschap van mijn verheuging, en U met de harp loof, o God, mijn God!", "2 Kron 26:16": "Maar toen hij sterk geworden was, verhief zijn hart zich tot zijn eigen verderf, en hij overtrad tegen de HEERE, zijn God; want hij ging het tempel van de HEERE binnen, om te roken op het reukaltaar.", "Matt 2:11": "En toen zij in het huis gekomen waren, vonden zij het Kindje met Maria, Zijn moeder, en zij vielen neer en aanbaden Het; en na hun schatten geopend te hebben, brachten zij Hem geschenken: goud, wierook en mirre.", "Luk 17:18": "En is er niemand gevonden die terugkeert om God eer te geven, dan deze vreemdeling?", "Richt 2:1": "En een Engel van de HEERE kwam op van Gilgal naar Bochim, en Hij zei: Ik heb u uit Egypte opgevoerd, en u gebracht in het land dat Ik uw vaderen gezworen heb, en gezegd: Ik zal Mijn verbond met u niet verbreken in eeuwigheid.", "Jer 29:30": "Daarom kwam het woord van de HEERE tot Jeremia, en Hij zei:", "Ps 106:21": "Zij vergaten God, hun Heiland, Die grote dingen gedaan had in Egypte;", "Joh 7:15": "En de Joden verwonderden zich en zeiden: Hoe weet Deze de Schriften, terwijl Hij ze niet geleerd heeft?", "1 Sam 13:8": "En hij wachtte zeven dagen, tot de tijd die Samuël bepaald had. Toen Samuël niet naar Gilgal kwam, verspreidde het volk zich van hem weg.", "Hand 8:39": "En toen zij uit het water waren opgekomen, nam de Geest van de Heere Filippus weg, en de kamerling zag hem niet meer; want hij reisde zijn weg met blijdschap.", "Richt 8:34": "En de Israëlieten dachten niet meer aan de HEERE, hun God, Die hen gered had uit de hand van al hun vijanden rondom.", "1 Sam 19:20": "Toen zond Saul boden om David te halen; die zagen een groep profeten, die profeteerden, en Samuël stond daarbij, over hen aangesteld; en de Geest van God kwam over Sauls boden, en ook zij profeteerden.", "1 Sam 16:20": "Toen nam Isaï een ezel met brood, en een leren zak met wijn, en een geitenbokje; en hij stuurde ze door de hand van zijn zoon David naar Saul.", "Jes 54:13": "En al uw kinderen zullen door de HEERE geleerd zijn, en de vrede van uw kinderen zal groot zijn.", "Amos 9:1": "Ik zag de Heere staan op het altaar, en Hij zei: Sla die knop, zodat de posten beven, en kloof ze allen in het hoofd; en Ik zal hun achterste met het zwaard doden; wie van hen probeert te vluchten, zal niet ontkomen, en wie van hen probeert te ontkomen, zal niet gered worden.", "Richt 2:10-12": "en heel dat geslacht werd ook tot zijn vaderen verzameld; toen kwam er een ander geslacht na hen op, dat de HEERE niet kende, en ook niet het werk dat Hij voor Israël gedaan had. Toen deden de kinderen van Israël wat kwaad was in de ogen van de HEERE, en zij dienden de Baäls. En zij verlieten de HEERE, de God van hun vaderen, Die hen uit Egypteland had uitgeleid, en volgden andere goden na, van de goden van de volken die rondom hen waren, en bogen zich voor die neer, en zij verwekten de HEERE tot toorn.", "Amos 7:14": "Toen antwoordde Amos, en zei tegen Amazia: Ik was geen profeet, en ik was geen profetenzoon; maar ik was een ossenherder, en verzamelde wilde vijgen.", "1 Sam 23:2-4": "En David vroeg de HEERE: Zal ik heengaan en deze Filistijnen verslaan? En de HEERE zei tegen David: Ga heen, en u zult de Filistijnen verslaan en Kehila verlossen. Maar de mannen van David zeiden tegen hem: Kijk, wij zijn al bang hier in Juda; hoeveel te meer als wij naar Kehila zullen gaan tegen de slagorden van de Filistijnen. Toen vroeg David de HEERE nog verder; en de HEERE antwoordde hem en zei: Maak u op, trek af naar Kehila; want Ik geef de Filistijnen in uw hand.", "2 Kron 36:12": "En hij deed wat slecht was in de ogen van de HEERE, zijn God; hij verootmoedigde zich niet voor het aangezicht van de profeet Jeremia, die sprak uit de mond van de HEERE.", "Matt 13:55": "Is Dit niet de zoon van de timmerman? Heet Zijn moeder niet Maria, en Zijn broers Jakobus en Joses, en Simon en Judas?", "1 Sam 11:15": "Toen ging heel het volk naar Gilgal, en Saul werd daar koning gemaakt voor het aangezicht van de HEERE te Gilgal; en zij offerden daar dankoffers voor het aangezicht van de HEERE; en Saul verheugde zich daar zeer, met alle mannen van Israël.", "Micha 1:1": "Het woord van de HEERE, dat gebeurd is tot Micha, de Morastiet, in de dagen van Jotham, Achaz en Jehizkia, koningen van Juda; dat hij gezien heeft over Samaria en Jeruzalem.", "Jes 24:8": "De vreugde van de trommelen rust, het geluid van de vrolijk huppelende houdt op, de vreugde van de harp rust.", "Ezech 8:1": "Het gebeurde nu in het zesde jaar, in de zesde maand, op de vijfde van de maand, terwijl ik in mijn huis zat, en de oudsten van Juda voor mij zaten, dat de hand van de Heere HEERE daar over mij viel.", "2 Kon 10:10": "Weet nu, dat niets van het woord van de HEERE, dat de HEERE tegen het huis van Achab gesproken heeft, op de aarde zal vallen; want de HEERE heeft gedaan, wat Hij door de dienst van Zijn knecht Elia gesproken heeft.", "1 Petr 1:11": "en onderzochten op welke of wat voor tijd de Geest van Christus, Die in hen was, doelde, toen Hij vooraf getuigde van het lijden dat over Christus zou komen, en de heerlijkheid daarna.", "Jes 38:8": "Zie, Ik zal de schaduw van de graden, die met de zon in de graden van de zonnewijzer van Achaz omlaag gegaan is, tien graden achterwaarts doen keren. Zo is de zon tien graden teruggekeerd, in de graden die zij omlaag gegaan was.", "Deut 13:13": "Er zijn mannen, kinderen van Belial, uit uw midden uitgegaan, en hebben de inwoners van hun stad aangedreven, en gezegd: Laat ons gaan, en andere goden dienen, die u niet gekend hebt;", "Ps 129:8": "en zij die voorbijgaan, niet zeggen: De zegen van de HEERE zij bij u! Wij zegenen u in de Naam van de HEERE.", "1 Kor 14:32": "En de geesten der profeten zijn aan de profeten onderworpen.", "Ezech 1:1": "In het dertigste jaar, in de vierde maand, op de vijfde dag van die maand, toen ik te midden van de weggevoerden was bij de rivier Chebar, gebeurde het dat de hemelen werden geopend, en ik zag visioenen van God.", "1 Sam 17:4": "Toen ging er een kampvechter uit het leger van de Filistijnen naar buiten; zijn naam was Goliath, uit Gath; zijn hoogte was zes ellen en een span.", "Ezech 11:4": "Daarom, profeteer tegen hen; profeteer, o mensenkind!", "2 Kron 33:18": "Het overige nu van de geschiedenissen van Manasse, en zijn gebed tot zijn God, ook de woorden van de zieners, die tot hem gesproken hebben in de Naam van de HEERE, de God van Israël, zie, die staan in de geschiedenissen van de koningen van Israël;", "Ezech 2:1": "En Hij zei tegen mij: Mensenkind, sta op uw voeten, en Ik zal met u spreken.", "Jer 31:15": "Zo zegt de HEERE: Er is een stem gehoord in Rama, een geklaag, een zeer bitter geween; Rachel weent over haar kinderen; zij weigert zich te laten troosten over haar kinderen, omdat zij er niet meer zijn.", "Ex 15:20": "En Mirjam, de profetes, de zuster van Aäron, nam een trommel in haar hand; en alle vrouwen gingen achter haar aan, met trommels en met reidansen.", "Jer 2:7": "En Ik bracht u in een vruchtbaar land, om de vrucht ervan en het goede ervan te eten; maar toen u daarin kwam, verontreinigde u Mijn land, en maakte u Mijn erfenis tot een gruwel.", "Jer 20:9": "Daarom zei ik: Ik zal Hem niet meer noemen, en niet meer in Zijn Naam spreken; maar het werd in mijn hart als een brandend vuur, opgesloten in mijn beenderen; en ik werd moe van het verdragen, maar ik kon het niet.", "Ezech 3:22": "En de hand van de HEERE was daar op mij, en Hij zei tot mij: Maak u op, ga uit naar de vallei, en Ik zal daar met u spreken.", "Ezech 16:17-22": "Daarbij hebt u de voorwerpen van uw sieraad genomen, van Mijn goud en van Mijn zilver, dat Ik u gegeven had, en u hebt zich mannenbeelden gemaakt, en u hebt daarmee gehoereerd. En u hebt uw geborduurde kleren genomen, en hebt ze daarmee bedekt; en u hebt Mijn olie en Mijn reukwerk voor hun gezichten gezet. En Mijn brood, dat Ik u gaf, meelbloem en olie, en honing, waarmee Ik u voedde, dat hebt u ook voor hun gezichten gezet tot een liefelijke geur; zo is het gebeurd, spreekt de Heere HEERE.", "Jer 10:16": "Jakobs deel is niet gelijk die, want Hij is de Formeerder van alles, en Israël is de roede van Zijn erfenis; HEERE van de heerscharen is Zijn Naam.", "Richt 6:12": "Toen verscheen de Engel van de HEERE aan hem, en zei tegen hem: De HEERE is met u, dappere held!", "Deut 8:12-14": "Opdat niet misschien, als u gegeten zult hebben, en verzadigd bent, en goede huizen gebouwd hebt, en die bewoont, En uw runderen en uw schapen meer worden, ook zilver en goud u meer wordt, ja, al wat u hebt meer wordt; Uw hart zich dan verheft, zodat u de HEERE, uw God, vergeet, Die u uit Egypteland, uit het slavenhuis, uitgeleid heeft;", "Hand 7:55": "Maar hij, vol van de Heilige Geest, hield de ogen gericht naar de hemel, en zag de heerlijkheid van God, en Jezus, staande aan de rechterhand van God.", "Richt 18:15": "Toen weken zij daarheen af, en kwamen bij het huis van de jongeman, de Leviet, ten huize van Micha; en zij vroegen hem naar zijn welzijn.", "2 Kon 6:8-12": "En de koning van Syrië voerde oorlog tegen Israël, en overlegde met zijn knechten, en zei: Mijn legerplaats zal zijn bij die en die plaats. Maar de man van God zond bericht aan de koning van Israël, en zei: Wacht u ervoor dat u door die plaats trekt, want de Syriërs zijn daarheen afgekomen. Daarom zond de koning van Israël bericht naar die plaats, waarover de man van God hem gezegd en gewaarschuwd had, en hij wachtte zich daar, niet één keer, en niet twee keer.", "1 Sam 7:5": "Verder zei Samuël: Verzamel heel Israël naar Mizpa, en ik zal de HEERE voor u bidden.", "Matt 21:9": "En de menigten die voor Hem uit gingen en die volgden, riepen: Hosanna, de Zoon van David! Gezegend is Hij Die komt in de Naam van de Heere! Hosanna in de hoogste hemelen!", "1 Kon 22:28": "En Micha zei: Als u ooit in vrede terugkomt, dan heeft de HEERE niet door mij gesproken! Verder zei hij: Hoor, alle volken!", "Hand 21:4": "En wij vonden de discipelen en bleven daar zeven dagen; die zeiden door de Geest tegen Paulus dat hij niet naar Jeruzalem moest gaan.", "2 Kron 8:14": "Hij stelde ook, naar de wijze van zijn vader David, de verdelingen van de priesters aan over hun dienst, en van de Levieten over hun taken, om God te prijzen en voor de priesters te dienen, naar de eis van elke dag; en de poortwachters in hun verdelingen, bij elke poort; want zo was het gebod van David, de man Gods.", "Mark 12:36": "Want David zelf heeft door de Heilige Geest gezegd: De Heere heeft gezegd tegen mijn Heere: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gemaakt heb.", "1 Kor 15:33": "Dwaal niet. Slechte omgang bederft goede zeden.", "Jer 23:9": "Aangaande de profeten. Mijn hart wordt in mijn binnenste gebroken, al mijn beenderen beven; ik ben als een dronken man, en als een man die de wijn te boven gaat; vanwege de HEERE, en vanwege de woorden van Zijn heiligheid.", "Openb 22:6": "En hij zei tegen mij: Deze woorden zijn getrouw en waarachtig; en de Heere, de God van de heilige profeten, heeft Zijn engel gezonden om Zijn dienstknechten te tonen wat spoedig moet gebeuren.", "Luk 14:11": "Want ieder die zichzelf verhoogt, zal vernederd worden; en wie zichzelf vernedert, zal verhoogd worden.", "Ps 78:17": "Nog gingen zij verder door tegen Hem te zondigen, waarmee zij de Allerhoogste verbitterden in de dorre wildernis.", "Hos 7:13": "Wee hen, want zij zijn van Mij afgezworven; verwoesting over hen, want zij hebben tegen Mij overtreden! Ik zou hen wel verlossen, maar zij spreken leugens tegen Mij.", "Luk 1:70": "zoals Hij gesproken heeft door de mond van Zijn heilige profeten, die er van oudsher geweest zijn;", "1 Kon 18:36": "En het gebeurde, toen men het spijsoffer offerde, dat de profeet Elia naderde en zei: HEERE, God van Abraham, Izak en Israël, laat het vandaag bekend worden, dat U God bent in Israël, en ik Uw knecht; en dat ik al deze dingen naar Uw woord gedaan heb.", "Ex 6:28": "Zo sprak de HEERE tot Mozes en zei: Ik ben de HEERE! Spreek tot Farao, de koning van Egypte, alles wat Ik tot u spreek.", "Joz 19:22": "En deze grens reikt aan Thabor, en Sahazima, en Beth-semes; en de uiteinden van hun grens liggen aan de Jordaan; zestien steden en hun dorpen.", "Hand 21:11": "En hij kwam naar ons toe, nam de gordel van Paulus, bond daarmee zijn eigen handen en voeten, en zei: Dit zegt de Heilige Geest: De man van wie deze gordel is, zullen de Joden zo te Jeruzalem binden en overleveren in de handen van de heidenen.", "Richt 7:11": "En u zult horen wat zij zullen zeggen, en daarna zullen uw handen gesterkt worden, zodat u naar het leger zult aftrekken. Toen ging hij af, met Pura, zijn knecht, tot aan het uiterste van de gewapende mannen die in het leger waren.", "1 Sam 11:12-15": "Toen zei het volk tegen Samuël: Wie is hij die zei: Zou Saul over ons regeren? Geef hier die mannen, dan doden wij hen. Maar Saul zei: Er zal op deze dag geen man gedood worden, want de HEERE heeft heden een verlossing in Israël bewerkt. Verder zei Samuël tegen het volk: Komt, laten wij naar Gilgal gaan, en het koninkrijk daar vernieuwen.", "1 Sam 11:12": "Toen zei het volk tegen Samuël: Wie is hij die zei: Zou Saul over ons regeren? Geef hier die mannen, dan doden wij hen.", "1 Sam 3:1": "En de jongen Samuël diende de HEERE onder toezicht van Eli; en het woord van de HEERE was zeldzaam in die dagen; er was geen openbaar visioen.", "Num 11:17": "Dan zal Ik neerkomen en daar met u spreken; en van de Geest die op u is, zal Ik afnemen, en op hen leggen; en zij zullen met u de last van dit volk dragen, opdat u die niet alleen draagt.", "1 Kon 19:18": "Ook heb Ik in Israël zevenduizend laten overblijven, alle knieën die zich niet voor Baäl gebogen hebben, en alle monden die hem niet gekust hebben.", "Luk 2:25-27": "En zie, er was een mens in Jeruzalem, wiens naam was Simeon; en deze mens was rechtvaardig en godvrezend, en verwachtte de vertroosting van Israël, en de Heilige Geest was op hem. En hem was door de Heilige Geest een goddelijke openbaring gedaan, dat hij de dood niet zien zou voordat hij de Christus van de Heere zou zien. En hij kwam door de Geest in de tempel. En toen de ouders het Kindje Jezus binnenbrachten, om naar de gewoonte van de wet met Hem te doen,", "1 Kon 10:10": "En zij gaf de koning honderdtwintig talenten goud, en zeer veel specerijen, en kostbaar gesteente; zoveel specerijen als de koningin van Scheba de koning Salomo gaf, is er nooit meer in zulke hoeveelheid gekomen.", "Hand 2:8": "En hoe horen wij hen ieder in onze eigen taal, waarin wij geboren zijn?", "Deut 1:5": "Aan deze kant van de Jordaan, in het land Moab, begon Mozes deze wet uit te leggen, en zei:", "Zach 2:9": "Want zie, Ik zal Mijn hand over hen bewegen, en zij zullen hun knechten een roof wezen. Zo zult u weten, dat de HEERE van de heerscharen mij gezonden heeft.", "1 Kon 1:21": "Anders zal het gebeuren, als mijn heer de koning bij zijn vaderen te ruste is gegaan, dat ik en mijn zoon Salomo als zondaars beschouwd zullen worden.", "Dan 7:16": "Ik naderde tot een van hen die daar stonden, en vroeg hem naar de zekerheid over dit alles; en hij zei het mij, en maakte mij de uitleg van deze zaken bekend.", "1 Sam 12:12": "Toen u nu zag dat Nahas, de koning van de kinderen van Ammon, tegen u kwam, zei u tegen mij: Nee, maar een koning zal over ons regeren; terwijl toch de HEERE, uw God, uw Koning was.", "Jes 36:21": "Toch zwegen zij stil, en antwoordden hem geen woord; want het gebod van de koning was: U zult hem niet antwoorden.", "Dan 8:16": "En ik hoorde tussen de oevers van de Ulai een mensenstem, die riep en zei: Gabriël! leg deze man het gezicht uit.", "Ezech 12:22": "Mensenkind, wat is dit voor een spreekwoord dat u hebt in het land Israël, namelijk: de dagen worden verlengd, en elk visioen vervalt?", "2 Kon 20:5": "Keer terug en zeg tegen Hizkia, de leider van Mijn volk: Zo zegt de HEERE, de God van uw vader David: Ik heb uw gebed gehoord, Ik heb uw tranen gezien; zie, Ik zal u gezond maken; op de derde dag zult u opgaan naar het huis van de HEERE;", "1 Sam 11:7": "En hij nam een paar runderen en hakte ze in stukken, en stuurde die door de hand van de boden naar alle grensgebieden van Israël, en zei: Wie niet zelf uittrekt achter Saul en achter Samuël aan, met zijn runderen zal hetzelfde gedaan worden. Toen viel de vreze van de HEERE op het volk, en zij gingen uit als één man.", "Num 23:20": "Zie, ik heb opdracht ontvangen om te zegenen; omdat Hij zegent, zal ik het niet terugdraaien.", "Hand 13:48": "Toen de heidenen dit hoorden, verblijdden zij zich, en prezen het Woord van de Heere; en er geloofden zovelen als er bestemd waren tot het eeuwige leven.", "Neh 9:30": "Doch U hebt geduld met hen gehad, vele jaren lang, en tegen hen getuigd door Uw Geest, door de dienst van Uw profeten, maar zij neigden hun oor niet; daarom hebt U hen gegeven in de hand van de volken van de landen.", "Jak 5:10": "Mijn broeders, neem als voorbeeld van het lijden en van de geduldigheid de profeten, die in de Naam van de Heere gesproken hebben.", "Jer 2:6": "En zij zeiden niet: Waar is de HEERE, Die ons opvoerde uit Egypteland, Die ons leidde in de woestijn, in een land van wildernissen en kuilen, in een land van dorheid en schaduw van de dood, in een land waar niemand doorheen ging, en waar geen mens woonde?", "1 Sam 9:3-5": "De ezelinnen nu van Kis, de vader van Saul, waren kwijtgeraakt; daarom zei Kis tegen zijn zoon Saul: Neem nu een van de knechten met u, en maak u op, ga heen, zoek de ezelinnen. Hij dan ging door het gebergte van Efraïm, en hij ging door het land van Salisa, maar zij vonden ze niet; daarna gingen zij door het land van Sahalim, maar zij waren er niet; verder ging hij door het land van Jemini, maar zij vonden ze niet. Toen zij in het land van Zuf kwamen, zei Saul tegen zijn knecht, die bij hem was: Kom, laten we teruggaan; anders houdt mijn vader misschien op met zich zorgen te maken over de ezelinnen, en maakt hij zich zorgen om ons.", "2 Kron 12:1": "Het gebeurde nu, toen Rehabeam het koninkrijk bevestigd had en hij sterk geworden was, dat hij de wet van de HEERE verliet, en heel Israël met hem.", "Matt 1:23": "Zie, de maagd zal zwanger worden en een Zoon baren, en u zult Hem de naam Emmanuel geven; dat betekent, vertaald: God met ons.", "1 Kon 1:39": "En Zadok, de priester, nam de oliehoorn uit de tent en zalfde Salomo; en zij bliezen op de bazuin, en al het volk zei: Leve de koning Salomo!", "Gen 41:39": "Daarna zei Farao tegen Jozef: Omdat God u dit alles heeft bekendgemaakt, is er niemand zo verstandig en wijs als u.", "Matt 12:33": "Of maak de boom goed en zijn vrucht goed; of maak de boom slecht en zijn vrucht slecht; want aan de vrucht wordt de boom gekend.", "Deut 32:18": "De Rotssteen, Die u verwekt heeft, bent u vergeten; en u hebt de God, Die u gebaard heeft, in vergetelheid gesteld.", "Hos 13:2": "En nu gaan zij voort met zondigen, en hebben zich van hun zilver een gegoten beeld gemaakt, afgoden naar hun eigen inzicht, die allemaal het werk van smeden zijn; waarvan zij toch zeggen: De mensen die offeren, zullen de kalveren kussen.", "1 Kon 13:20": "En het gebeurde, terwijl zij aan tafel zaten, dat het woord van de HEERE kwam tot de profeet die hem had laten terugkeren;", "Luk 1:67": "En Zacharias, zijn vader, werd vervuld met de Heilige Geest, en profeteerde, en zei:", "Joël 2:29": "Ja, ook over de dienstknechten, en over de dienstmaagden, zal Ik in die dagen Mijn Geest uitgieten.", "1 Kron 28:19": "Dit alles, zei David, heeft men mij door geschrift laten verstaan, van de hand van de HEERE, namelijk al de werken van deze bereiding.", "Richt 21:4": "En het gebeurde de volgende dag, dat het volk zich vroeg opmaakte en daar een altaar bouwde; en zij offerden brandoffers en dankoffers.", "Jer 42:4": "En de profeet Jeremia zei tegen hen: Ik heb het gehoord; zie, ik zal tot de HEERE, uw God, bidden naar uw woorden; en het zal gebeuren, elk woord dat de HEERE u zal antwoorden, zal ik u bekendmaken, ik zal u niet één woord onthouden.", "Deut 5:31": "Maar u, sta hier bij Mij, dan zal Ik tot u spreken al de geboden, en inzettingen, en rechten, die u hun leren zult, opdat zij ze doen in het land dat Ik hun geven zal, om dat te erven.", "Richt 6:9": "en Ik heb u verlost uit de hand van de Egyptenaren, en uit de hand van allen die u onderdrukten; en Ik heb hen voor uw ogen verdreven, en u hun land gegeven;", "1 Sam 15:34": "Daarna ging Samuël naar Rama; en Saul ging naar zijn huis te Gibea-Sauls.", "Ezra 6:22": "En zij hielden het feest van de ongezuurde broden zeven dagen, met blijdschap; want de HEERE had hen verblijd, en het hart van de koning van Assur naar hen toe gewend, om hun handen te sterken in het werk van het huis van God, de God van Israël.", "Deut 20:1": "Wanneer u zult uittrekken tot de strijd tegen uw vijanden, en zult zien paarden en wagens, een volk, groter dan u, dan zult u voor hen niet vrezen; want de HEERE, uw God, is met u, Die u uit Egypteland heeft opgevoerd.", "Jer 2:17": "Doet u dit niet zelf, doordat u de HEERE, uw God, verlaat, ten tijde als Hij u op de weg leidt?", "Jer 1:4-10": "Het woord van de HEERE dan kwam tot mij, en zei: Voordat Ik u in moeders buik vormde, heb Ik u gekend, en voordat u uit de baarmoeder voortkwam, heb Ik u geheiligd; Ik heb u de volken tot een profeet gesteld. Toen zei ik: Ach, Heere HEERE! zie, ik kan niet spreken, want ik ben jong.", "Ezra 5:2": "Toen maakten Zerubbabel, de zoon van Sealthiël, en Jesua, de zoon van Jozadak, zich op en begonnen het huis van God te bouwen, Dat te Jeruzalem woont; en met hen de profeten van God, die hen ondersteunden.", "Ps 71:22": "Ook zal ik U loven met het instrument van de luit, Uw trouw, mijn God; ik zal U psalmzingen met de harp, o Heilige van Israël!", "1 Kron 29:24": "En alle vorsten, en helden, ja, ook alle zonen van koning David, gaven de hand, dat zij onder koning Salomo zouden staan.", "1 Sam 12:17-19": "Is het niet vandaag de tarweoogst? Ik zal tot de HEERE roepen, en Hij zal donder en regen geven; weet dan, en zie, dat uw kwaad groot is, dat u voor de ogen van de HEERE gedaan hebt, door voor u een koning te begeren. Toen Samuël de HEERE aanriep, gaf de HEERE die dag donder en regen; daarom vreesde heel het volk de HEERE en Samuël zeer. En heel het volk zei tegen Samuël: Bid voor uw knechten tot de HEERE, uw God, dat wij niet sterven; want boven al onze zonden hebben wij dit kwaad daaraan toegevoegd, dat wij voor ons een koning begeerd hebben.", "Hand 8:29": "En de Geest zei tegen Filippus: Ga erheen, en voeg u bij deze wagen.", "1 Sam 9:1": "Er was nu een man van Benjamin, wiens naam Kis was, een zoon van Abiël, de zoon van Zeror, de zoon van Bechorath, de zoon van Afiah, de zoon van een man van Jemini, een dapper held.", "1 Sam 9:27": "Toen zij afgedaald waren tot aan het einde van de stad, zei Samuel tegen Saul: Zeg tegen de knecht dat hij voor ons uit gaat; toen ging hij heen; maar blijft u nu even staan, en ik zal u het woord van God laten horen.", "Ps 33:2": "Looft de HEERE met de harp; zingt Hem psalmen met de luit, en het tiensnarig instrument.", "2 Kon 2:9": "Het gebeurde nu, toen zij overgekomen waren, dat Elia zei tegen Elisa: Vraag wat ik voor u doen zal, voordat ik van bij u weggenomen word. En Elisa zei: Laat toch een dubbel deel van uw geest op mij zijn!", "Deut 17:15": "Dan moet u zeker die tot koning over u aanstellen die de HEERE, uw God, zal uitkiezen; uit uw broeders moet u een koning over u aanstellen; u mag geen vreemde man over u zetten die uw broeder niet is.", "Ezech 18:2-4": "Wat is er met u, dat u dit spreekwoord gebruikt over het land Israël, en zegt: De vaders hebben onrijpe druiven gegeten, en de tanden van de kinderen zijn stomp geworden? Zo waarachtig als Ik leef, spreekt de Heere HEERE, u zult geen aanleiding meer hebben om dit spreekwoord in Israël te gebruiken! Zie, alle zielen zijn van Mij; zoals de ziel van de vader, zo is ook de ziel van de zoon van Mij; de ziel die zondigt, die zal sterven.", "Hand 9:21": "En allen die het hoorden, waren verbaasd en zeiden: Is dit niet degene die in Jeruzalem verwoestte wie deze Naam aanriepen, en die daarom hierheen gekomen is, opdat hij hen gebonden zou brengen naar de overpriesters?", "Rom 1:1": "Paulus, een dienstknecht van Jezus Christus, een geroepen apostel, afgezonderd tot het Evangelie van God,", "Richt 20:14": "Maar de kinderen van Benjamin verzamelden zich uit de steden naar Gibea, om uit te trekken ten strijde tegen de kinderen van Israël.", "Jer 13:1-3": "Zo heeft de HEERE tegen mij gezegd: Ga heen, en koop u een linnen gordel, en doe die om uw middel, maar breng hem niet in het water. En ik kocht een gordel naar het woord van de HEERE, en ik deed die om mijn middel. Toen kwam het woord van de HEERE voor de tweede keer tot mij, en Hij zei:", "2 Kron 13:8": "En nu, u denkt zich te kunnen verzetten tegen het koninkrijk van de HEERE, dat in de hand is van de zonen van David; u bent wel een grote menigte, maar u hebt gouden kalveren bij u, die Jerobeam voor u tot goden gemaakt heeft.", "Obadja 1:1": "Het visioen van Obadja. Zo zegt de Heere HEERE van Edom: Wij hebben een bericht gehoord van de HEERE, en er is een gezant gestuurd onder de heidenvolken: Sta op, en laten wij tegen haar opstaan ten strijde.", "1 Sam 8:8": "Naar de werken die zij gedaan hebben, vanaf de dag dat Ik hen uit Egypte geleid heb, tot op deze dag toe, en Mij hebben verlaten en andere goden gediend; zo doen zij u ook.", "Gen 21:20": "En God was met de jongen; en hij werd groot, en hij woonde in de woestijn, en werd een boogschutter.", "Ex 24:16": "En de heerlijkheid van de HEERE woonde op de berg Sinaï, en de wolk bedekte hem zes dagen, en op de zevende dag riep Hij Mozes uit het midden van de wolk.", "Ezech 3:27": "Maar als Ik met u spreken zal, zal Ik uw mond opendoen, en u zult tot hen zeggen: Zo zegt de Heere HEERE, wie hoort, laat hij horen, en wie het laat, laat hij het laten; want zij zijn een opstandig huis.", "Jer 5:24": "En zij zeggen niet in hun hart: Laten wij nu de HEERE, onze God, vrezen, Die de regen geeft, zowel de vroege regen als de late regen, op Zijn tijd; Die voor ons de weken, de vastgestelde tijden van de oogst, bewaart.", "Jer 2:31": "Geslacht, let toch op het woord van de HEERE! Ben Ik Israël een woestijn geweest, of een land van de uiterste donkerheid? Waarom zegt Mijn volk dan: Wij zijn heren, wij zullen niet meer tot U komen?", "Richt 6:8": "dat de HEERE een man zond, die een profeet was, naar de Israëlieten; die zei tegen hen: Zo zegt de HEERE, de God van Israël: Ik heb u uit Egypte doen optrekken, en u uit het slavenhuis uitgeleid;", "Ex 29:7": "En u zult de zalfolie nemen, en op zijn hoofd gieten; zo zult u hem zalven.", "Ps 110:3": "Uw volk zal zeer gewillig zijn op de dag van Uw heirkracht, in heilig sieraad; uit de baarmoeder van het dageraad zal U de dauw van Uw jeugd zijn.", "2 Kon 6:17": "En Elisa bad, en zei: HEERE, open toch zijn ogen, dat hij ziet! En de HEERE opende de ogen van de knecht, dat hij zag; en zie, de berg was vol vurige paarden en wagens rondom Elisa.", "1 Sam 16:13": "Toen nam Samuël de oliehoorn, en zalfde hem te midden van zijn broers. En de Geest van de HEERE kwam vanaf die dag over David, en bleef. Daarna stond Samuël op, en ging naar Rama.", "Gen 40:8": "En zij zeiden tegen hem: Wij hebben een droom gehad, en er is niemand die hem uitlegt. En Jozef zei tegen hen: Zijn de uitleggingen niet van God? Vertel ze mij toch.", "1 Kon 14:5": "Maar de HEERE zei tegen Ahia: Zie, Jerobeams vrouw komt om u iets te vragen over haar zoon, want hij is ziek. Zo en zo zult u tot haar spreken, en het zal gebeuren, als zij binnenkomt, dat zij zich als een andere vrouw zal voordoen.", "Richt 10:14": "Ga heen, roep tot de goden die u hebt uitgekozen; laten die u verlossen in de tijd van uw benauwdheid.", "Hos 4:9": "Daarom, zoals het volk, zo zal de priester zijn; en Ik zal zijn wegen aan hem bezoeken¹, en zijn daden hem vergelden.", "Jes 1:2": "Hoor, hemelen! en neem het ter oor, aarde! Want de HEERE spreekt: Ik heb kinderen groot gemaakt en verhoogd, maar zij hebben tegen Mij overtreden.", "Ezech 33:22": "Nu was de hand van de HEERE 's avonds op mij geweest, voordat wie ontkomen was kwam, en Hij had mijn mond geopend, totdat hij 's morgens tot mij kwam. Zo werd mijn mond geopend, en ik was niet meer stom.", "Dan 5:18": "Wat u aangaat, o koning! De allerhoogste God heeft uw vader Nebukadnezar het koninkrijk, en grootheid, en eer, en heerlijkheid gegeven;", "Ezech 3:24": "Toen kwam de Geest in mij, en stelde mij op mijn voeten, en Hij sprak met mij, en zei tot mij: Ga, sluit u binnen in uw huis.", "Richt 19:12-16": "Maar zijn heer zei tegen hem: Wij zullen hierheen niet afwijken naar een vreemde stad, die niet van de kinderen van Israël is; maar wij zullen doortrekken tot aan Gibea. Verder zei hij tegen zijn knecht: Kom, laten wij naderen tot een van die plaatsen, en overnachten in Gibea of in Rama. Zo trokken zij verder, en gingen hun weg; en de zon ging voor hen onder bij Gibea, dat aan Benjamin toebehoort;", "Job 33:14-16": "Maar God spreekt eens of tweemaal; doch men let daar niet op. In de droom, door het gezicht 's nachts, als een diepe slaap op de mensen valt, in de sluimering op het leger; Dan openbaart Hij het voor het oor der mensen, en Hij verzegelt hun kastijding;", "1 Sam 13:14": "Maar nu zal uw koningschap niet blijven bestaan. De HEERE heeft Zich een man gezocht naar Zijn hart, en de HEERE heeft hem bevolen een voorganger te zijn over Zijn volk, omdat u niet gehouden hebt wat de HEERE u geboden had.", "Ps 81:3": "Heft een psalm op, en geeft de trommel; de liefelijke harp met de luit.", "Deut 31:16": "En de HEERE zei tegen Mozes: Zie, u zult slapen met uw vaderen; en dit volk zal opstaan, en overspelig achter de goden van de vreemden van dat land aan gaan, waar het naartoe gaat, in het midden ervan; en het zal Mij verlaten en Mijn verbond vernietigen, dat Ik met hen gesloten heb.", "Micha 6:3": "O Mijn volk! Wat heb Ik u gedaan, en waarmee heb Ik u vermoeid? Getuig tegen Mij.", "Richt 6:34": "Toen bekleedde de Geest van de HEERE Gideon, en hij blies op de bazuin, en de Abiëzrieten werden achter hem bijeengeroepen.", "Joz 3:7": "Want de HEERE had tegen Jozua gezegd: Deze dag zal Ik beginnen u groot te maken voor de ogen van heel Israël, opdat zij weten dat Ik met u zal zijn, zoals Ik met Mozes geweest ben.", "2 Sam 23:3": "De God van Israël heeft gezegd, de Rotssteen van Israël heeft tot mij gesproken: Er zal een Heerser zijn over de mensen, een Rechtvaardige, een Heerser in de vreze van God.", "Jer 1:1": "De woorden van Jeremia, de zoon van Hilkia, uit de priesters die te Anathoth waren, in het land van Benjamin;", "Jes 6:1-9": "In het jaar dat koning Uzzia stierf, zag ik de Heere zitten op een hoge en verheven troon, en Zijn zomen vulden de tempel. De serafs stonden boven Hem; ieder had zes vleugels; met twee bedekte ieder zijn gezicht, en met twee bedekte hij zijn voeten, en met twee vloog hij. En de een riep tot de ander en zei: Heilig, heilig, heilig is de HEERE van de heerscharen! De hele aarde is vol van Zijn heerlijkheid!", "Ps 135:4": "Want de HEERE heeft Zich Jakob verkoren, Israël tot Zijn eigendom.", "Joz 7:14-26": "U zult dan in de morgen aankomen naar uw stammen; en het zal gebeuren: de stam die de HEERE aanwijst, die zal aankomen naar de geslachten, en welk geslacht de HEERE aanwijst, dat zal aankomen bij huisgezinnen, en welk huisgezin de HEERE aanwijst, dat zal aankomen man voor man. En het zal gebeuren: wie aangewezen wordt met de ban, die zal met vuur verbrand worden, hij en alles wat hij heeft; omdat hij het verbond van de HEERE overtreden heeft, en omdat hij dwaasheid in Israël gedaan heeft. Toen stond Jozua 's morgens vroeg op, en liet Israël aankomen naar zijn stammen; en de stam van Juda werd aangewezen.", "1 Sam 9:15-17": "Want de HEERE had het aan Samuël geopenbaard, een dag voordat Saul kwam, en had gezegd: Morgen omstreeks deze tijd zal Ik naar u een man sturen uit het land van Benjamin, die zult u tot voorganger zalven over Mijn volk Israël; en hij zal Mijn volk verlossen uit de hand van de Filistijnen, want Ik heb naar Mijn volk omgezien, omdat hun geroep tot Mij gekomen is. Toen Samuel Saul zag, antwoordde de HEERE hem: Zie, dit is de man, van wie Ik u gezegd heb: Deze zal over Mijn volk heersen.", "2 Sam 20:18": "Toen sprak zij, en zei: In vroeger tijden spraken zij gewoonlijk, en zeiden: Zij zullen zeker te Abel vragen; en zo maakten zij de zaak af.", "Hos 13:6": "Daarna zijn zij, naarmate hun weide was, verzadigd geworden; toen zij verzadigd waren geworden, heeft hun hart zich verheven; daarom hebben zij Mij vergeten.", "Micha 6:4": "Zeker heb Ik u uit Egypteland opgevoerd, en u uit het diensthuis verlost; en Ik heb voor uw aangezicht Mozes, Aäron en Mirjam heen gezonden.", "Luk 17:17": "En Jezus antwoordde en zei: Zijn niet de tien gereinigd? Maar waar zijn de negen?", "1 Kron 29:22": "En zij aten en dronken op die dag voor het aangezicht van de HEERE met grote vreugde; en zij maakten Salomo, de zoon van David, voor de tweede keer koning, en zij zalfden hem voor de HEERE tot voorganger, en Zadok tot priester.", "Spr 21:1": "Het hart van de koning is in de hand van de HEERE als waterbeken. Hij neigt het tot alles wat Hij wil.", "Joh 6:14": "Toen de mensen dan het teken zagen dat Jezus gedaan had, zeiden zij: Deze is werkelijk de Profeet, Die in de wereld komen zou.", "2 Kon 5:25": "Daarna kwam hij binnen, en ging voor zijn heer staan. En Elisa zei tegen hem: Waar kom je vandaan, Gehazi? En hij zei: Uw knecht is nergens heen geweest.", "2 Sam 5:2": "Ook al eerder, toen Saul koning over ons was, was u het die Israël uitleidde en terugbracht; ook heeft de HEERE tegen u gezegd: U zult Mijn volk Israël weiden, en u zult een leider zijn over Israël.", "Richt 20:28": "En Pinehas, de zoon van Eleazar, de zoon van Aäron, stond voor Zijn aangezicht in die dagen, en zei: Zal ik nog meer uittrekken ten strijde tegen de kinderen van Benjamin, mijn broeder, of zal ik ophouden? En de HEERE zei: Trek op, want morgen zal Ik hem in uw hand geven.", "Hand 7:35": "Deze Mozes, die zij verloochend hadden door te zeggen: Wie heeft u tot leider en rechter gesteld? — deze heeft God tot leider en verlosser gezonden, door de hand van de engel die hem verschenen was in de doornstruik.", "Lev 1:10": "En als zijn offerande is van klein vee, van schapen of van geiten, tot een brandoffer, zal hij een volkomen mannetje offeren.", "Ps 147:7": "Zingt beurtelings voor de HEERE met dankzegging; zingt psalmen voor onze God op de harp.", "Richt 10:11": "Maar de HEERE zei tegen de Israëlieten: Heb Ik u niet verlost van de Egyptenaren, van de Amorieten, van de Ammonieten en van de Filistijnen?", "Joz 18:28": "En Zela, Elef en Jebusi (dat is Jeruzalem), Gibath, Kirjath: veertien steden alsook de bijbehorende dorpen. Dit is het erfdeel van de kinderen van Benjamin, naar hun huisgezinnen.", "Num 24:15": "Toen hief hij zijn spreuk op en zei: Bileam, de zoon van Beor, spreekt, en die man wiens ogen geopend zijn, spreekt!", "Ps 78:71": "Van achter de zogende schapen liet Hij hem komen, om Jakob te weiden, Zijn volk, en Israël, Zijn erfenis.", "1 Sam 9:15": "Want de HEERE had het aan Samuël geopenbaard, een dag voordat Saul kwam, en had gezegd:", "1 Sam 23:11": "Zullen de burgers van Kehila mij ook in zijn hand overgeven? Zal Saul afkomen, zoals Uw dienaar gehoord heeft? O HEERE, God van Israël, vertel het toch aan Uw dienaar! En de HEERE zei: Hij zal afkomen."}, "noten": {"1": "Vers 27, \"kinderen Belials\" (SV): letterlijk \"zonen van Belial\" - een uitdrukking voor waardeloze, verdorven mensen.", "2": "Vers 27, \"hij was als doof\" (SV): D.i. hij trok zich er niets van aan / reageerde er niet op."}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H3947\">Toen</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H3947\"> \"L9\" data-code=\"H1961\">hij</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H1961\">het</span> niet hoorde."}, "koppeling_kjv": {"1": "Then <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> a <span class=\"wl wl-kjv\" data-code=\"H6378\">vial</span> of <span class=\"wl wl-kjv\" data-code=\"H8081\">oil,</span> and <span class=\"wl wl-kjv\" data-code=\"H3332\">poured</span> it upon his <span class=\"wl wl-kjv\" data-code=\"H7218\">head,</span> and <span class=\"wl wl-kjv\" data-code=\"H5401\">kissed</span> him, and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Is it not because the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H4886\">anointed</span> thee to be <span class=\"wl wl-kjv\" data-code=\"H5057\">captain</span> over his <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance?</span>", "2": "When thou art <span class=\"wl wl-kjv\" data-code=\"H3212\">departed</span> from <span class=\"wl wl-kjv\" data-code=\"H5978\">me</span> to <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> then thou shalt <span class=\"wl wl-kjv\" data-code=\"H4672\">find</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> by <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel's</span> <span class=\"wl wl-kjv\" data-code=\"H6900\">sepulchre</span> in the <span class=\"wl wl-kjv\" data-code=\"H1366\">border</span> of <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin</span> at <span class=\"wl wl-kjv\" data-code=\"H6766\">Zelzah;</span> and they will <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto thee, The <span class=\"wl wl-kjv\" data-code=\"H860\">asses</span> which thou <span class=\"wl wl-kjv\" data-code=\"H1980\">wentest</span> to <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> are <span class=\"wl wl-kjv\" data-code=\"H4672\">found:</span> and, lo, thy <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> hath <span class=\"wl wl-kjv\" data-code=\"H5203\">left</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">care</span> of the <span class=\"wl wl-kjv\" data-code=\"H860\">asses,</span> and <span class=\"wl wl-kjv\" data-code=\"H1672\">sorroweth</span> for you, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> What shall I <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> for my <span class=\"wl wl-kjv\" data-code=\"H1121\">son?</span>", "3": "Then shalt thou go <span class=\"wl wl-kjv\" data-code=\"H2498\">on</span> <span class=\"wl wl-kjv\" data-code=\"H1973\">forward</span> from thence, and thou shalt <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to the <span class=\"wl wl-kjv\" data-code=\"H436\">plain</span> of <span class=\"wl wl-kjv\" data-code=\"H8396\">Tabor,</span> and there shall <span class=\"wl wl-kjv\" data-code=\"H4672\">meet</span> thee <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> going <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> to <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel,</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H5375\">carrying</span> <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H1423\">kids,</span> and <span class=\"wl wl-kjv\" data-code=\"H259\">another</span> <span class=\"wl wl-kjv\" data-code=\"H5375\">carrying</span> <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3603\">loaves</span> of <span class=\"wl wl-kjv\" data-code=\"H3899\">bread,</span> and <span class=\"wl wl-kjv\" data-code=\"H259\">another</span> <span class=\"wl wl-kjv\" data-code=\"H5375\">carrying</span> a <span class=\"wl wl-kjv\" data-code=\"H5035\">bottle</span> of <span class=\"wl wl-kjv\" data-code=\"H3196\">wine:</span>", "4": "And they <span class=\"wl wl-kjv\" data-code=\"H7592\">will</span> <span class=\"wl wl-kjv\" data-code=\"H7965\">salute</span> thee, and <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thee <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> loaves of <span class=\"wl wl-kjv\" data-code=\"H3899\">bread;</span> which thou shalt <span class=\"wl wl-kjv\" data-code=\"H3947\">receive</span> of their <span class=\"wl wl-kjv\" data-code=\"H3027\">hands.</span>", "5": "<span class=\"wl wl-kjv\" data-code=\"H310\">After</span> that thou shalt <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to the <span class=\"wl wl-kjv\" data-code=\"H1389\">hill</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> where is the <span class=\"wl wl-kjv\" data-code=\"H5333\">garrison</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines:</span> and it shall come to pass, when thou art come <span class=\"wl wl-kjv\" data-code=\"H935\">thither</span> to the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> that thou shalt <span class=\"wl wl-kjv\" data-code=\"H6293\">meet</span> a <span class=\"wl wl-kjv\" data-code=\"H2256\">company</span> of <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> coming <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> from the high <span class=\"wl wl-kjv\" data-code=\"H1116\">place</span> with a <span class=\"wl wl-kjv\" data-code=\"H5035\">psaltery,</span> and a <span class=\"wl wl-kjv\" data-code=\"H8596\">tabret,</span> and a <span class=\"wl wl-kjv\" data-code=\"H2485\">pipe,</span> and a <span class=\"wl wl-kjv\" data-code=\"H3658\">harp,</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> them; and they shall <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesy:</span>", "6": "And the <span class=\"wl wl-kjv\" data-code=\"H7307\">Spirit</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will <span class=\"wl wl-kjv\" data-code=\"H6743\">come</span> upon thee, and thou shalt <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesy</span> with them, and shalt be <span class=\"wl wl-kjv\" data-code=\"H2015\">turned</span> into <span class=\"wl wl-kjv\" data-code=\"H312\">another</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man.</span>", "7": "And let it be, when these <span class=\"wl wl-kjv\" data-code=\"H226\">signs</span> are <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> unto thee, that thou <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> as <span class=\"wl wl-kjv\" data-code=\"H4672\">occasion</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">serve</span> thee; for <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> is with thee.", "8": "And thou shalt go <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> me to <span class=\"wl wl-kjv\" data-code=\"H1537\">Gilgal;</span> and, behold, I will come <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> unto thee, to <span class=\"wl wl-kjv\" data-code=\"H5927\">offer</span> burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offerings,</span> and to <span class=\"wl wl-kjv\" data-code=\"H2076\">sacrifice</span> <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifices</span> of peace <span class=\"wl wl-kjv\" data-code=\"H8002\">offerings:</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> shalt thou <span class=\"wl wl-kjv\" data-code=\"H3176\">tarry,</span> till I <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to thee, and <span class=\"wl wl-kjv\" data-code=\"H3045\">shew</span> thee what thou shalt <span class=\"wl wl-kjv\" data-code=\"H6213\">do.</span>", "9": "And it was so, that when he had <span class=\"wl wl-kjv\" data-code=\"H6437\">turned</span> his <span class=\"wl wl-kjv\" data-code=\"H7926\">back</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> from <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel,</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H2015\">gave</span> him <span class=\"wl wl-kjv\" data-code=\"H312\">another</span> <span class=\"wl wl-kjv\" data-code=\"H3820\">heart:</span> and all those <span class=\"wl wl-kjv\" data-code=\"H226\">signs</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to pass that <span class=\"wl wl-kjv\" data-code=\"H3117\">day.</span>", "10": "And when they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> thither to the <span class=\"wl wl-kjv\" data-code=\"H1389\">hill,</span> behold, a <span class=\"wl wl-kjv\" data-code=\"H2256\">company</span> of <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> <span class=\"wl wl-kjv\" data-code=\"H7125\">met</span> him; and the <span class=\"wl wl-kjv\" data-code=\"H7307\">Spirit</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H6743\">came</span> upon him, and he <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesied</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> them.", "11": "And it came to pass, when all that <span class=\"wl wl-kjv\" data-code=\"H3045\">knew</span> him <span class=\"wl wl-kjv\" data-code=\"H865\">beforetime</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that, behold, he <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesied</span> among the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets,</span> then the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> to <span class=\"wl wl-kjv\" data-code=\"H7453\">another,</span> What is this that is come unto the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H7027\">Kish?</span> Is <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> also among the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets?</span>", "12": "And <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> of the same place <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> But who is their <span class=\"wl wl-kjv\" data-code=\"H1\">father?</span> Therefore it became a <span class=\"wl wl-kjv\" data-code=\"H4912\">proverb,</span> Is <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> also among the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets?</span>", "13": "And when he had made an <span class=\"wl wl-kjv\" data-code=\"H3615\">end</span> of <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesying,</span> he <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the high <span class=\"wl wl-kjv\" data-code=\"H1116\">place.</span>", "14": "And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul's</span> <span class=\"wl wl-kjv\" data-code=\"H1730\">uncle</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him and to his <span class=\"wl wl-kjv\" data-code=\"H5288\">servant,</span> <span class=\"wl wl-kjv\" data-code=\"H575\">Whither</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> ye? And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> To <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> the <span class=\"wl wl-kjv\" data-code=\"H860\">asses:</span> and when we <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that they were no <span class=\"wl wl-kjv\" data-code=\"H369\">where,</span> we <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel.</span>", "15": "And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul's</span> <span class=\"wl wl-kjv\" data-code=\"H1730\">uncle</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">Tell</span> me, I pray thee, what <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto you.", "16": "And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto his <span class=\"wl wl-kjv\" data-code=\"H1730\">uncle,</span> He <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> us <span class=\"wl wl-kjv\" data-code=\"H5046\">plainly</span> that the <span class=\"wl wl-kjv\" data-code=\"H860\">asses</span> were <span class=\"wl wl-kjv\" data-code=\"H4672\">found.</span> But of the <span class=\"wl wl-kjv\" data-code=\"H1697\">matter</span> of the <span class=\"wl wl-kjv\" data-code=\"H4410\">kingdom,</span> whereof <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">spake,</span> he <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> him not.", "17": "And <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> <span class=\"wl wl-kjv\" data-code=\"H6817\">called</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> together unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> to <span class=\"wl wl-kjv\" data-code=\"H4709\">Mizpeh;</span>", "18": "And <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> I brought <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> out of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</ so <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">home</span> to <span class=\"wl wl-kjv\" data-code=\"H1390\">Gibeah;</span> and there <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> with him a band of <span class=\"wl wl-kjv\" data-code=\"H2428\">men,</span> whose <span class=\"wl wl-kjv\" data-code=\"H3820\">hearts</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> had <span class=\"wl wl-kjv\" data-code=\"H5060\">touched.</span>", "27": "But the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H1100\">Belial</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> How shall this man <span class=\"wl wl-kjv\" data-code=\"H3467\">save</span> us? And they <span class=\"wl wl-kjv\" data-code=\"H959\">despised</span> him, and <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> him no <span class=\"wl wl-kjv\" data-code=\"H4503\">presents.</span> But he held his <span class=\"wl wl-kjv\" data-code=\"H2790\">peace.</span>"}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    let h = '<div class="verg-kop">Grondwoorden</div>';
    if (!heeftB && !heeftK) {
      h += '<em>Nog geen woordkoppeling voor dit vers.</em>';
    } else {
      if (heeftB) h += `<div class="tsk-kop">SVnu</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      h += '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
    }
    h += '<div class="verg-kop" style="margin-top:1.4rem">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
