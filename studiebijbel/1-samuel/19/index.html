 David tot zijn vader Saul; en hij zei tegen hem: De koning zondige niet tegen zijn knecht David, omdat hij tegen u niet gezondigd heeft, en omdat zijn daden voor u zeer goed zijn.","5":"Want hij heeft zijn leven gewaagd, en hij heeft de Filistijn geslagen, en de HEERE heeft een grote overwinning aan heel Israël gegeven; u hebt het gezien, en u bent verblijd geweest; waarom zou u dan tegen onschuldig bloed zondigen, David zonder reden doden?","6":"Saul dan luisterde naar de stem van Jonathan; en Saul zwoer: zo waarachtig als de HEERE leeft, hij zal niet gedood worden!","7":"En Jonathan riep David, en Jonathan maakte hem al deze woorden bekend; en Jonathan bracht David tot Saul, en hij was voor zijn aangezicht als voorheen.","8":"En er kwam opnieuw oorlog; en David trok uit, en streed tegen de Filistijnen, en hij bracht hun een grote slachting toe, en zij vluchtten voor hem.","9":"Doch de boze geest van de HEERE kwam over Saul, terwijl hij in zijn huis zat, met zijn speer in zijn hand; en David speelde op de snaren met zijn hand.","10":"Saul nu probeerde David met de speer aan de wand te spietsen, doch hij ontweek Saul, die met de speer in de wand sloeg. Toen vluchtte David, en ontkwam diezelfde nacht.","11":"Maar Saul zond boden naar Davids huis, om hem te bewaken, en om hem 's morgens te doden. Dit maakte Michal, zijn vrouw, aan David bekend, en zei: Als u vannacht uw leven niet redt, zult u morgen gedood worden.","12":"En Michal liet David door een venster naar beneden, en hij ging heen, en vluchtte, en ontkwam.","13":"En Michal nam een beeld, en legde het in het bed, en legde een geitenvel aan zijn hoofdkussen, en dekte het met een kleed toe.","14":"Saul nu zond boden om David te halen. Toen zei zij: Hij is ziek.","15":"Toen zond Saul boden om David te bezien, en zei: Breng hem met bed en al bij mij, zodat men hem kan doden.","16":"Toen de boden kwamen, zie, er was een beeld in het bed, en er was een geitenvel aan zijn hoofdkussen.","17":"Toen zei Saul tegen Michal: Waarom hebt u mij zo bedrogen en mijn vijand laten gaan, zodat hij ontkomen is? Michal nu zei tegen Saul: Hij zei tegen mij: Laat mij gaan, waarom zou ik u doden?","18":"Zo vluchtte David en ontkwam, en hij kwam bij Samuël in Rama, en hij maakte hem alles bekend wat Saul hem aangedaan had; en hij en Samuël gingen heen, en zij bleven in Najoth.","19":"En men berichtte het Saul, en zei: Zie, David is in Najoth, bij Rama.","20":"Toen zond Saul boden om David te halen; die zagen een groep profeten, die profeteerden, en Samuël stond daarbij, over hen aangesteld; en de Geest van God kwam over Sauls boden, en ook zij profeteerden.","21":"Toen men het Saul berichtte, zond hij andere boden, en ook zij profeteerden; toen zond Saul opnieuw, voor de derde keer, boden, en ook zij profeteerden.","22":"Daarna ging hij ook zelf naar Rama, en hij kwam bij de grote waterput die te Sechu was, en hij vroeg: Waar zijn Samuël en David? Toen werd hem gezegd: Zie, zij zijn in Najoth bij Rama.","23":"Toen ging hij daarheen naar Najoth bij Rama; en dezelfde Geest van God kwam ook op hem, en al voortgaande profeteerde hij, totdat hij in Najoth in Rama aankwam.","24":"En hij trok zelf ook zijn kleren uit, en hij profeteerde zelf ook, voor het aangezicht van Samuël; en hij viel naakt neer, diezelfde hele dag en de hele nacht. Daarom zegt men: Is Saul ook onder de profeten?"},"SV":{"1":"Derhalve sprak Saul tot zijn zoon Jonathan en tot al zijn knechten, om David te doden. Doch Jonathan, Sauls zoon, had groot welgevallen aan David.","2":"En Jonathan verkondigde het David, zeggende: Mijn vader Saul zoekt u te doden; nu dan, wacht u toch des morgens, en blijf in het verborgene, en versteek u.","3":"Doch ik zal uitgaan, en aan de hand mijns vaders staan op het veld, waar gij zult zijn; en ik zal van u tot mijn vader spreken, en zal zien wat het zij; dat zal ik u verkondigen.","4":"Zo sprak dan Jonathan goed van David tot zijn vader Saul; en hij zeide tot hem: De koning zondige niet tegen zijn knecht David, omdat hij tegen u niet gezondigd heeft, en omdat zijn daden voor u zeer goed zijn.","5":"Want hij heeft zijn ziel in zijn hand gezet, en hij heeft den Filistijn geslagen, en de HEERE heeft een groot heil aan het ganse Israël gedaan; gij hebt het gezien, en gij zijt verblijd geweest; waarom zoudt gij dan tegen onschuldig bloed zondigen, David zonder oorzaak dodende?","6":"Saul nu hoorde naar de stem van Jonathan; en Saul zwoer: *zo* *waarachtig* *als* de HEERE leeft, hij zal niet gedood worden!","7":"En Jonathan riep David, en Jonathan gaf hem al deze woorden te kennen; en Jonathan bracht David tot Saul, en hij was voor zijn aangezicht als gisteren *en* eergisteren.","8":"En er werd wederom krijg; en David toog uit, en streed tegen de Filistijnen, en hij sloeg hen met een groten slag, en zij vloden voor zijn aangezicht.","9":"Doch de boze geest des HEEREN was over Saul, en hij zat in zijn huis, en zijn spies was in zijn hand; en David speelde op snarenspel met de hand;","10":"Saul nu zocht met de spies David aan den wand te spitten, doch hij ontweek van het aangezicht van Saul, die met de spies in den wand sloeg. Toen vlood David, en ontkwam in dienzelfden nacht.","11":"Maar Saul zond boden heen tot Davids huis, dat zij hem bewaarden, en dat zij hem des morgens doodden. Dit gaf Michal, zijn huisvrouw, David te kennen, zeggende: Indien gij uw ziel dezen nacht niet behoedt, zo zult gij morgen gedood worden.","12":"En Michal liet David door een venster neder, en hij ging heen, en vluchtte, en ontkwam.","13":"En Michal nam een beeld, en zij leide het in het bed, en zij leide een geitenvel aan zijn hoofdpeluw, en dekte het met een kleed toe.","14":"Saul nu zond boden, om David te halen. Zij dan zeide: Hij is ziek.","15":"Toen zond Saul boden, om David te bezien, zeggende: Breng hem op het bed tot mij op, dat men hem dode.","16":"Als de boden kwamen, zo ziet, er was een beeld in het bed, en er was een geitenvel aan zijn hoofdpeluw.","17":"Toen zeide Saul tot Michal: Waarom hebt gij mij alzo bedrogen en hebt mijn vijand laten gaan, dat hij ontkomen is? Michal nu zeide tot Saul: Hij zeide tot mij: Laat mij gaan, waarom zou ik u doden?","18":"Alzo vluchtte David en ontkwam, en hij kwam tot Samuël te Rama, en hij gaf hem te kennen al wat Saul hem gedaan had; en hij en Samuël gingen heen, en zij bleven te Najoth.","19":"En men boodschapte Saul, zeggende: Zie, David is te Najoth, bij Rama.","20":"Toen zond Saul boden heen, om David te halen; die zagen een vergadering van profeten, profeterende, en Samuël staande, over hen gesteld; en de Geest Gods was over Sauls boden, en die profeteerden ook.","21":"Toen men het Saul boodschapte, zo zond hij andere boden, en die profeteerden ook; toen voer Saul voort en zond de derde boden, en die profeteerden ook.","22":"Daarna ging hij ook zelf naar Rama, en hij kwam tot den groten waterput, die te Sechu was, en hij vraagde en zeide: Waar is Samuël, en David? Toen werd hem gezegd: Zie, zij zijn te Najoth bij Rama.","23":"Toen ging hij derwaarts naar Najoth bij Rama; en dezelfde Geest Gods was ook op hem, en hij, al voortgaande, profeteerde, totdat hij te Najoth in Rama kwam.","24":"En hij toog zelf ook zijn klederen uit, en hij profeteerde zelf ook, voor het aangezicht van Samuël; en hij viel bloot neder dienzelfden gansen dag, en den gansen nacht. Daarom zegt men: Is Saul ook onder de profeten?"},"KJV":{"1":"And Saul spake to Jonathan his son, and to all his servants, that they should kill David.","2":"But Jonathan Saul's son delighted much in David: and Jonathan told David, saying, Saul my father seeketh to kill thee: now therefore, I pray thee, take heed to thyself until the morning, and abide in a secret place, and hide thyself:","3":"And I will go out and stand beside my father in the field where thou art, and I will commune with my father of thee; and what I see, that I will tell thee.","4":"And Jonathan spake good of David unto Saul his father, and said unto him, Let not the king sin against his servant, against David; because he hath not sinned against thee, and because his works have been to thee-ward very good:","5":"For he did put his life in his hand, and slew the Philistine, and the LORD wrought a great salvation for all Israel: thou sawest it, and didst rejoice: wherefore then wilt thou sin against innocent blood, to slay David without a cause?","6":"And Saul hearkened unto the voice of Jonathan: and Saul sware, As the LORD liveth, he shall not be slain.","7":"And Jonathan called David, and Jonathan shewed him all those things. And Jonathan brought David to Saul, and he was in his presence, as in times past.","8":"And there was war again: and David went out, and fought with the Philistines, and slew them with a great slaughter; and they fled from him.","9":"And the evil spirit from the LORD was upon Saul, as he sat in his house with his javelin in his hand: and David played with his hand.","10":"And Saul sought to smite David even to the wall with the javelin; but he slipped away out of Saul's presence, and he smote the javelin into the wall: and David fled, and escaped that night.","11":"Saul also sent messengers unto David's house, to watch him, and to slay him in the morning: and Michal David's wife told him, saying, If thou save not thy life to night, to morrow thou shalt be slain.","12":"So Michal let ➔ David down through a window: and he went, and fled, and escaped.","13":"And Michal took an image, and laid it in the bed, and put a pillow of goats' hair for his bolster, and covered it with a cloth.","14":"And when Saul sent messengers to take David, she said, He is sick.","15":"And Saul sent the messengers again to see David, saying, Bring him up to me in the bed, that I may slay him.","16":"And when the messengers were come in, behold, there was an image in the bed, with a pillow of goats' hair for his bolster.","17":"And Saul said unto Michal, Why hast thou deceived me so, and sent away mine enemy, that he is escaped? And Michal answered Saul, He said unto me, Let me go; why should I kill thee?","18":"So David fled, and escaped, and came to Samuel to Ramah, and told him all that Saul had done to him. And he and Samuel went and dwelt in Naioth.","19":"And it was told Saul, saying, Behold, David is at Naioth in Ramah.","20":"And Saul sent messengers to take David: and when they saw the company of the prophets prophesying, and Samuel standing as appointed over them, the Spirit of God was upon the messengers of Saul, and they also prophesied.","21":"And when it was told Saul, he sent other messengers, and they prophesied likewise. And Saul sent messengers again the third time, and they prophesied also.","22":"Then went he also to Ramah, and came to a great well that is in Sechu: and he asked and said, Where are Samuel and David? And one said, Behold, they be at Naioth in Ramah.","23":"And he went thither to Naioth in Ramah: and the Spirit of God was upon him also, and he went on, and prophesied, until he came to Naioth in Ramah.","24":"And he stripped off his clothes also, and prophesied before Samuel in like manner, and lay down naked all that day and all that night. Wherefore they say, Is Saul also among the prophets?"}},"tsk":{"1":[{"kopje":"sprak Saul","refs":["1 Sam 18:8","1 Sam 18:9","Spr 27:4","Pred 9:3","Jer 9:3","2 Tim 3:13"]}],"2":[{"kopje":"delighted","refs":["1 Sam 18:1-3","Ps 16:3","Joh 15:17-19","1 Joh 3:12-14"]},{"kopje":"Jonathan","refs":["1 Sam 20:2","Spr 17:17","Hand 9:24","Hand 23:16"]}],"3":[{"kopje":"wat het is","refs":["1 Sam 20:9","1 Sam 20:13"]}],"4":[{"kopje":"sprak goed","refs":["1 Sam 20:32","1 Sam 22:14","Spr 24:11","Spr 24:12","Spr 31:8","Spr 31:9","Jer 18:20"]},{"kopje":"zondige niet","refs":["1 Sam 2:25","Gen 9:6","Gen 42:22","2 Kron 6:22","1 Kor 8:12","1 Joh 3:15"]},{"kopje":"omdat zijn daden","refs":["Ps 35:12","Ps 109:4","Ps 109:5","Spr 17:13","Jer 18:20"]}],"5":[{"kopje":"gewaagd","refs":["1 Sam 28:21","Richt 9:17","Richt 12:3","Ps 119:109","Hand 20:24","Fil 2: " data-code=\"H6440\">aangezicht</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H6440\">van</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H8050\">Samuël</span>; <span class=\"wl\" data-l=\"L8\" data-code=\"H5307\">en</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H5307\">hij</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H5307\">viel</span> naakt neer, diezelfde hele <span class=\"wl\" data-l=\"L10\" data-code=\"H3117\">dag</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H3605\">en</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H3605\">de</span> hele <span class=\"wl\" data-l=\"L11\" data-code=\"H3915\">nacht</span>. <span class=\"wl\" data-l=\"L12\" data-code=\"H5921\">Daarom</span> <span class=\"wl\" data-l=\"L13\" data-code=\"H559\">zegt</span> <span class=\"wl\" data-l=\"L13\" data-code=\"H559\">men</span>: <span class=\"wl\" data-l=\"L13\" data-code=\"H559\">Is</span> <span class=\"wl\" data-l=\"L14\" data-code=\"H7586\">Saul</span> <span class=\"wl\" data-l=\"L15\" data-code=\"H1571\">ook</span> <span class=\"wl\" data-l=\"L16\" data-code=\"H5030\">onder</span> <span class=\"wl\" data-l=\"L16\" data-code=\"H5030\">de</span> <span class=\"wl\" data-l=\"L16\" data-code=\"H5030\">profeten</span>?"},"koppeling_kjv":{"1":"And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> to <span class=\"wl wl-kjv\" data-code=\"H3129\">Jonathan</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> and to all his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> that they should <span class=\"wl wl-kjv\" data-code=\"H4191\">kill</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David.</span>","2":"But <span class=\"wl wl-kjv\" data-code=\"H3083\">Jonathan</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H2654\">delighted</span> <span class=\"wl wl-kjv\" data-code=\"H3966\">much</span> in <span class=\"wl wl-kjv\" data-code=\"H1732\">David:</span> and <span class=\"wl wl-kjv\" data-code=\"H3083\">Jonathan</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> my <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H1245\">seeketh</span> to <span class=\"wl wl-kjv\" data-code=\"H4191\">kill</span> thee: now therefore, I pray thee, take <span class=\"wl wl-kjv\" data-code=\"H8104\">heed</span> to thyself until the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">abide</span> in a <span class=\"wl wl-kjv\" data-code=\"H5643\">secret</span> place, and <span class=\"wl wl-kjv\" data-code=\"H2244\">hide</span> thyself:","3":"And I will go <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> and <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">beside</span> my <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> where thou art, and I will <span class=\"wl wl-kjv\" data-code=\"H1696\">commune</span> with my <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> of thee; and <span class=\"wl wl-kjv\" data-code=\"H4100\">what</span> I <span class=\"wl wl-kjv\" data-code=\"H7200\">see,</span> that I will <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> thee.","4":"And <span class=\"wl wl-kjv\" data-code=\"H3083\">Jonathan</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> unto <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Let not the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H2398\">sin</span> against his <span class=\"wl wl-kjv\" data-code=\"H5650\">servant,</span> against <span class=\"wl wl-kjv\" data-code=\"H1732\">David;</span> because he hath not <span class=\"wl wl-kjv\" data-code=\"H2398\">sinned</span> against thee, and because his <span class=\"wl wl-kjv\" data-code=\"H4639\">works</span> have been to thee-ward <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">good:</span>","5":"For he did <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> his <span class=\"wl wl-kjv\" data-code=\"H5315\">life</span> in his <span class=\"wl wl-kjv\" data-code=\"H3709\">hand,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">slew</span> the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">wrought</span> a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H8668\">salvation</span> for all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> thou <span class=\"wl wl-kjv\" data-code=\"H7200\">sawest</span> it, and didst <span class=\"wl wl-kjv\" data-code=\"H8055\">rejoice:</span> wherefore then wilt thou <span class=\"wl wl-kjv\" data-code=\"H2398\">sin</span> against <span class=\"wl wl-kjv\" data-code=\"H5355\">innocent</span> <span class=\"wl wl-kjv\" data-code=\"H1818\">blood,</span> to <span class=\"wl wl-kjv\" data-code=\"H4191\">slay</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> without a <span class=\"wl wl-kjv\" data-code=\"H2600\">cause?</span>","6":"And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">hearkened</span> unto the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of <span class=\"wl wl-kjv\" data-code=\"H3083\">Jonathan:</span> and <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H7650\">sware,</span> As the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> he shall <span class=\"wl wl-kjv\" data-code=\"H518\">not</span> be <span class=\"wl wl-kjv\" data-code=\"H4191\">slain.</span>","7":"And <span class=\"wl wl-kjv\" data-code=\"H3083\">Jonathan</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> and <span class=\"wl wl-kjv\" data-code=\"H3083\">Jonathan</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">shewed</span> him all those <span class=\"wl wl-kjv\" data-code=\"H1697\">things.</span> And <span class=\"wl wl-kjv\" data-code=\"H3083\">Jonathan</span> <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> to <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> and he was in his <span class=\"wl wl-kjv\" data-code=\"H6440\">presence,</span> as in times <span class=\"wl wl-kjv\" data-code=\"H865\">past.</span>","8":"And there was <span class=\"wl wl-kjv\" data-code=\"H4421\">war</span> <span class=\"wl wl-kjv\" data-code=\"H3254\">again:</span> and <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out,</span> and <span class=\"wl wl-kjv\" data-code=\"H3898\">fought</span> with the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">slew</span> them with a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4347\">slaughter;</span> and they <span class=\"wl wl-kjv\" data-code=\"H5127\">fled</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">from</span> him.","9":"And the <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> from the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was upon <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> as he <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> in his <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> with his <span class=\"wl wl-kjv\" data-code=\"H2595\">javelin</span> in his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand:</span> and <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H5059\">played</span> with his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand.</span>","10":"And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H1245\">sought</span> to <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> even to the <span class=\"wl wl-kjv\" data-code=\"H7023\">wall</span> with the <span class=\"wl wl-kjv\" data-code=\"H2595\">javelin;</span> but he slipped <span class=\"wl wl-kjv\" data-code=\"H6362\">away</span> out of <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul's</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">presence,</span> and he <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> the <span class=\"wl wl-kjv\" data-code=\"H2595\">javelin</span> into the <span class=\"wl wl-kjv\" data-code=\"H7023\">wall:</span> and <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H5127\">fled,</span> and <span class=\"wl wl-kjv\" data-code=\"H4422\">escaped</span> that <span class=\"wl wl-kjv\" data-code=\"H3915\">night.</span>","11":"<span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> also <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> unto <span class=\"wl wl-kjv\" data-code=\"H1732\">David's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> to <span class=\"wl wl-kjv\" data-code=\"H8104\">watch</span> him, and to <span class=\"wl wl-kjv\" data-code=\"H4191\">slay</span> him in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning:</span> and <span class=\"wl wl-kjv\" data-code=\"H4324\">Michal</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David's</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> him, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> If thou <span class=\"wl wl-kjv\" data-code=\"H4422\">save</span> not thy <span class=\"wl wl-kjv\" data-code=\"H5315\">life</span> to <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> to <span class=\"wl wl-kjv\" data-code=\"H4279\">morrow</span> thou shalt be <span class=\"wl wl-kjv\" data-code=\"H4191\">slain.</span>","12":"So <span class=\"wl wl-kjv\" data-code=\"H4324\">Michal</span> <span class=\"wl wl-kjv\" data-code=\"H3381\">let</span> ➔ <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> through a <span class=\"wl wl-kjv\" data-code=\"H2474\">window:</span> and he <span class=\"wl wl-kjv\" data-code=\"H3212\">went,</span> and <span class=\"wl wl-kjv\" data-code=\"H1272\">fled,</span> and <span class=\"wl wl-kjv\" data-code=\"H4422\">escaped.</span>","13":"And <span class=\"wl wl-kjv\" data-code=\"H4324\">Michal</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> an <span class=\"wl wl-kjv\" data-code=\"H8655\">image,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">laid</span> it in the <span class=\"wl wl-kjv\" data-code=\"H4296\">bed,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> a <span class=\"wl wl-kjv\" data-code=\"H3523\">pillow</span> of <span class=\"wl wl-kjv\" data-code=\"H5795\">goats'</span> hair for his <span class=\"wl wl-kjv\" data-code=\"H4763\">bolster,</span> and <span class=\"wl wl-kjv\" data-code=\"H3680\">covered</span> it with a <span class=\"wl wl-kjv\" data-code=\"H899\">cloth.</span>","14":"And when <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> to <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> she <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> He is <span class=\"wl wl-kjv\" data-code=\"H2470\">sick.</span>","15":"And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> the <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> again to <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Bring him <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to me in the <span class=\"wl wl-kjv\" data-code=\"H4296\">bed,</span> that I may <span class=\"wl wl-kjv\" data-code=\"H4191\">slay</span> him.","16":"And when the <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> were come <span class=\"wl wl-kjv\" data-code=\"H935\">in,</span> behold, there was an <span class=\"wl wl-kjv\" data-code=\"H8655\">image</span> in the <span class=\"wl wl-kjv\" data-code=\"H4296\">bed,</span> with a <span class=\"wl wl-kjv\" data-code=\"H3523\">pillow</span> of <span class=\"wl wl-kjv\" data-code=\"H5795\">goats'</span> hair for his <span class=\"wl wl-kjv\" data-code=\"H4763\">bolster.</span>","17":"And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H4324\">Michal,</span> Why hast thou deceived me <span class=\"wl wl-kjv\" data-code=\"H7411\">so,</span> and sent <span class=\"wl wl-kjv\" data-code=\"H7971\">away</span> mine <span class=\"wl wl-kjv\" data-code=\"H341\">enemy,</span> that he is <span class=\"wl wl-kjv\" data-code=\"H4422\">escaped?</span> And <span class=\"wl wl-kjv\" data-code=\"H4324\">Michal</span> <span class=\"wl wl-kjv\" data-code=\"H559\">answered</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> He <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me, Let me <span class=\"wl wl-kjv\" data-code=\"H7971\">go;</span> why should I <span class=\"wl wl-kjv\" data-code=\"H4191\">kill</span> thee?","18":"So <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H1272\">fled,</span> and <span class=\"wl wl-kjv\" data-code=\"H4422\">escaped,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> to <span class=\"wl wl-kjv\" data-code=\"H7414\">Ramah,</span> and <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> him all that <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> had <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> to him. And he and <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in <span class=\"wl wl-kjv\" data-code=\"H5121\">Naioth.</span>","19":"And it was <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Behold, <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> is at <span class=\"wl wl-kjv\" data-code=\"H5121\">Naioth</span> in <span class=\"wl wl-kjv\" data-code=\"H7414\">Ramah.</span>","20":"And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data- 17\">day</span> and all that <span class=\"wl wl-kjv\" data-code=\"H3915\">night.</span> Wherefore they <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Is <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> also among the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets?</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"des morgens,","tekst":"Want Sauls trawanten meenden hem des morgens te doden, vs.11. Anders, tot morgen, want middelertijd had Jónathan voorgenomen met Saul voor David ten beste te spreken, en te vernemen of Saul nog volhardde in zijn boos voornemen."}],"3":[{"catchword":"op het veld,","tekst":"Anders, in het veld"},{"catchword":"zien wat het zij;","tekst":"Of, vernemen, of, merken."}],"4":[{"catchword":"zondige niet tegen zijn knecht David,","tekst":"Te weten hem ongelijk doende, en hem dus dodelijk vervolgende."}],"5":[{"catchword":"hij heeft zijn ziel in zijn hand gezet,","tekst":"Hij wil zeggen: Hij heeft zijn leven gewaagd en zichzelven in doodsgevaar gesteld. Zie gelijke manier van spreken onder, 1Sa 28:21; Jdg 12:3."},{"catchword":"den Filistijn geslagen,","tekst":"Anders, de Filistijnen. Zie boven, 1Sa 18:6."}],"6":[{"catchword":"hij zal niet gedood worden","tekst":"Te weten, door mijn bevel. Zodat Saul hier van zijn voornemen, vs.1, afstand doet. Hebreeuws, indien hij gedood wordt! Zie de aantekeningen Gen 14:23."}],"7":[{"catchword":"hij was voor zijn aangezicht","tekst":"Dat is, hij kwam aan het hof, en bediende zijn ambt, gelijk hij tevoren gedaan had."}],"10":[{"catchword":"David aan den wand te spitten,","tekst":"Zie boven, 1Sa 18:11."}],"11":[{"catchword":"morgens doodden","tekst":"Zie boven, vs.2."},{"catchword":"ziel dezen nacht niet behoedt,","tekst":"Dat is, uzelven, uw persoon, uw leven."}],"12":[{"catchword":"door een venster neder,","tekst":"Want de deuren waren bezet met de knechten van Saul."}],"13":[{"catchword":"een beeld,","tekst":"Hebreeuws, terafim; gelijk onder, vs.16."},{"catchword":"een geitenvel","tekst":"Kwanswijs of het Davids haar ware."}],"14":[{"catchword":"halen","tekst":"Anders, te vangen. Hebreeuws, te nemen."}],"15":[{"catchword":"bezien,","tekst":"Dat is, te bezoeken, kwanswijs, alsof zij hem uit vriendschap in zijn ziekte kwamen bezoeken. Doch voornamelijk om te zien, of hij in der waarheid ziek was, of dat hij zich ziek hield, en in alle geval hem mede te nemen."}],"17":[{"catchword":"Toen zeide Saul tot Michal","tekst":"Te weten, nadat de boden Saul hadden verteld wat hun wedervaren was."},{"catchword":"waarom zou ik u doden?","tekst":"Zij wil zeggen dat David gedreigd had haar te doden, indien zij hem niet liet gaan. Zie gelijke manier van spreken 2Sa 2:22."}],"18":[{"catchword":"hij kwam tot Samuël te Rama,","tekst":"Te weten, om raad te vragen wat hij doen zou, en ook vermoedende dat hij daar vrijer dan ergens anders wezen zou in het gezelschap van Samuël en de andere profeten, die zelf te Gibea, onaangezien de Filistijnen aldaar hun garnizoen hadden, vrij waren, 1Sa 10:10."},{"catchword":"Najoth","tekst":"Dit is een plaats, waar de profeten, een collegium of school hadden, bij Rama gelegen, waar Samuël zijn woning had."}],"19":[{"catchword":"bij Rama","tekst":"Alzo wordt de Hebreeuwse letter Beth klaarlijk genomen, Jos 5:13, enz."}],"20":[{"catchword":"halen;","tekst":"Zie vs.14."},{"catchword":"zagen een vergadering van profeten,","tekst":"Hebreeuws, zag; dat is, elk een derzelver zag."},{"catchword":"profeterende,","tekst":"Dat is, God lovende en zijn naam groot makende met gebeden en lofzangen."},{"catchword":"profeteerden ook","tekst":"Dat is, zij stelden zich aan gelijk de profeten deden als zij profeteerden. Zie boven, 1Sa 18:10. Het schijnt dat deze boden van Saul zo van zin veranderd zijn geworden dat zij, hun wapenen afleggende, niet verder dachten de handen aan David te slaan, daar zij nochtans om uitgezonden waren."}],"22":[{"catchword":"Sechu was,","tekst":"Zie van deze stad de aantekeningen 1Sa 17:1."}],"24":[{"catchword":"hij toog zelf ook zijn klederen uit,","tekst":"Dat is, hij legde zijn koninklijke of krijgsmans opperkleding af, met welke hij gekomen was om David te vangen."},{"catchword":"hij viel","tekst":"Versta, dat hj gelijk als in een verrukking van zinnen is gevallen, gelijk zulks somtijds den profeten is wedervaren. Zie Num 24:4. Of, hij viel neder, gelijk de anderen in het bidden zich tegen de aarde strekkende, zich alzo tezamen voor den Heere verootmoedigende."},{"catchword":"bloot neder dienzelfden gansen dag,","tekst":"Of, naakt. Versta dit alzo, dat hij zich ontbloot heeft van zijn koninklijk, of opperkleed, of van zijn krijgsmanskleed. Zie dergelijk Isa 20:2; Mic 1:8."},{"catchword":"Is Saul ook onder de profeten?","tekst":"Zie boven, 1Sa 10:12. Hier past dit spreekwoord op diegenen, die van God wonderbaarlijk in hun voornemen verhinderd worden, gelijk Saul hier wedervaren is. Zie dergelijke geschiedenis Num 23:24, in Bileam; en Hand. 9, in Saul."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Therefore Saul spake unto his son Jonathan, and to all his servants, to kill David: but Jonathan; Sauls son, took great delight in David."}],"2":[{"catchword":null,"tekst":"And Jonathan told David, saying, my father Saul seeketh to kill thee: now therefore, I pray thee, take heed to thy self in the morning, [For Sauls&acirc;&euro;&trade;s Life-guard intended to kill him in the morning, ver.11. Oth. until morning; for in the mean while Jonathan had undertaken to speak unto Saul in David&acirc;&euro;&trade;s behalf, and to sift it out, whether Saul yet persisted in his wicked intent] and abide in (a) secret (place), and hide thy self."}],"3":[{"catchword":null,"tekst":"But I will go forth, and stand at my fathers hand on the field, [Oth. In the field] where thou shalt be, and I will speak of thee unto my father: and will see: [or, hearken, or, perceive] what it is, that I will tell thee."}],"4":[{"catchword":null,"tekst":"So then Jonathan spake good of David unto his Father Saul: and he said unto him, Let not the King sinne against his servant David, [viz. Doing him wrong, and pursuing him thus in a deadly manner] because he hath not sinned against thee, and because his actions are very good before thee."}],"5":[{"catchword":null,"tekst":"For he hath put his soul into his hand, [as if he should say, he hath adventured his life, and put himself in danger of death: see the like phrase chap.28.21. Judg.12.3.] and he hath smitten the Philistine, [Oth. the Philistines; see above chap.18.6.] and the LORD wrought great salvation (for) all Israel, thou sawest it, and thou didst rejoice: wherefore shouldest thou then sinne against innocent blood, killing David without a cause?"}],"6":[{"catchword":null,"tekst":"Now Saul hearkened to the voice of Jonathan: and Saul sware, (as true as) the Lord liveth, he shall not be killed. [i.e. by my command: so that Saul here desisteth from his intention, ver.1. Heb. If he be killed: see the annotate. on Gen 14:23.]"}],"7":[{"catchword":null,"tekst":"And Jonathan called David, and acquinted him with all these words: and Jonathan brought David unto Saul, and he was before his face as yesterday (and) ere yesterday. [i.e. He came to Court, and did his office, as he had done a foretime.]"}],"8":[{"catchword":null,"tekst":"And there was war again: and David went forth, and fought against the Philistines, and he smote them with a great slaughter, and they fled before his face."}],"9":[{"catchword":null,"tekst":"But the evil spirit of the LORD was upon Saul, and he sat in his house, and his spear was in his hand: and David played with the hand upon a stringed instrument."}],"10":[{"catchword":null,"tekst":"Now Saul sought to thrust David thorow to the wall, [See above chap.18.11.] Bu he escaped from the face of Saul, that smote with the spear into the wall: then David fled, and escaped the same night."}],"11":[{"catchword":null,"tekst":"But Saul sent away messengers to Davids house, to watch him, and to kill him in the morning: [See above ver.2.] this Michal his wife made known to David, saying, If thou save not thy soul [i.e. thyself, thy person, thy life] this night, then thou shalt be killed in the morning."}],"12":[{"catchword":null,"tekst":"And Michal let David down thorow a window: [For the doors were beset with Sauls servants] and he fled, and went away, and escaped."}],"13":[{"catchword":null,"tekst":"And Michal took an image, [Heb. Teraphin; as below ver.16.] and she laid it in the bed, and she laid a goats skin at his head-pillow, [as if so be it had been David&acirc;&euro;&trade;s hair] and covered it close with a cloth."}],"14":[{"catchword":null,"tekst":"Now Saul sent messengers to fetch, [Otherwise, To apprehend. Heb. to take] David; she then said, he is sick."}],"15":[{"catchword":null,"tekst":"Then Saul sent messengers to see David, [i.e. To visit him; as if so be they out of love came to visit him, or see how he did, in his sickness. But they came chiefly to see if he were sick indeed, or whether he onely feigned himself sick, and in whatever condition he was, to take him along with them,] saying: Bring him up to me in the bed, that they may kill him."}],"16":[{"catchword":null,"tekst":"When the messengers came, then behold, there was an image in the bed, and there was a goat-skin at his head pillow."}],"17":[{"catchword":null,"tekst":"Then Saul said unto Michal, [viz. After Sauls messengers had told him, what had befallen them] Why hast thou deceived me? And hast let mine enemy go, that he is escaped? Now Michal said unto Saul, he said unto me, Let me go, why should I kill thee? [Inimating, that David had threatened to kill her, if she would not have let him go. See the like phrase, 2 Samuel 2.22.]"}],"18":[{"catchword":null,"tekst":"So David fled, and escaped, and he came to Samuel at Rama, [viz. To ask counsel what he should do, and also because he thought he should be there more safe and secure then elsewhere, to wit, in the company of Samuel, and the other Prophets, who were safe & secure eating at Gibea, notwithstanding the Philistines had their garrison there, I Sam.10.10.] and he made known to him all that Saul had done to him; and he and Samuel went their ways, and they abode at Najoth. [This is a place where the Prophets had a Colledge or school, lying by Rama, where Samuel dwelt.]"}],"19":[{"catchword":null,"tekst":"And it was told Saul, saying: Behold, David is at Najoth by Rama, [Thus is the Hebrew letter Beth plainly taken, Jos.5.13, &c.]"}],"20":[{"catchword":null,"tekst":"Then Saul sent forth messengers to fetch David, [See above vers.14.] who saw [Heb. Saw, in the singular number; i.e. every one of them saw] an assembly of Prophets prophesying, [i.e. praising God, and magnifying his Name with prayers and hymnes] and Samuel standing, appointed over them: and the spirit of God was upon Sauls messengers, and they prophesied likewise; [i.e. they behaved themselves as the Prophets did when they prophesie. See above chap.18.10. It seemeth that these messengers of Saul were so altered in their mind and opinion. That putting off their armour, they thought no more of seizing Davids person, whereas they were sent out for that very intent.]"}],"21":[{"catchword":null,"tekst":"When it was told Saul, then he sent other messengers, and they prophesied likewise: then Saul went on, and sent the third messengers, and they prophesied likewise."}],"22":[{"catchword":null,"tekst":"Afterward he himself also went to Rama, and he came to the great Well, which was at Socha, [see concerning this city the annotations on I Sam.17.1.] and he asked, and said, Where is Samuel and David? Then it was told him, Behold, they are at Najoth by Rama."}],"23":[{"catchword":null,"tekst":"Then went he hither to Najoth by Rama: and the same spirit of God was upon him also, and he going on prophecied, until he came to Najoth in Rama."}],"24":[{"catchword":null,"tekst":"And he himself stript off his cloaths also, [i.e. He put off his Royal Robe, or souldiers upper garment wherewith he was come to apprehend David] and he himself prophesied also before the face of Samuel, and he fell down [understand, that he fell as it were into an extasie, as it sometimes befell the Prophets: see Num 24:4. or, he fell down as the other, stretching themselves thus together before the Lord] bare [or, naked. Understand this thus, that he stript himself of his Royal Robe, or upper garment, or of his souldiers coat: see the like, Isa 20:2. Mic 1:8.] that same whole day, and all the night: wherefore they say, Is Saul also among the Prophets? [see above chap. 10. on vers.12. Here this Proverb is applicable to those, who are wonderfully disappointed of God in their intention, as it befell Saul here. See the like History, Numb.23. and 24. in Bileam, and Act.9. in Saul]"}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
