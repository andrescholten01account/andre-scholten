haz en Jehizkia, koningen van Juda; dat hij gezien heeft over Samaria en Jeruzalem.", "Ezech 8:1": "Het gebeurde nu in het zesde jaar, in de zesde maand, op de vijfde van de maand, terwijl ik in mijn huis zat, en de oudsten van Juda voor mij zaten, dat de hand van de Heere HEERE daar over mij viel.", "2 Kon 10:10": "Weet nu, dat niets van het woord van de HEERE, dat de HEERE tegen het huis van Achab gesproken heeft, op de aarde zal vallen; want de HEERE heeft gedaan, wat Hij door de dienst van Zijn knecht Elia gesproken heeft.", "1 Petr 1:11": "en onderzochten op welke of wat voor tijd de Geest van Christus, Die in hen was, doelde, toen Hij vooraf getuigde van het lijden dat over Christus zou komen, en de heerlijkheid daarna.", "1 Kor 14:32": "En de geesten der profeten zijn aan de profeten onderworpen.", "2 Kon 1:9-13": "En hij zond naar hem een leider over vijftig met zijn vijftigtal. En toen hij naar hem opklom (want zie, hij zat op de top van een berg), sprak hij tot hem: Man van God! De koning zegt: Kom naar beneden. Maar Elia antwoordde en sprak tot de leider over vijftig: Als ik dan een man van God ben, laat er dan vuur uit de hemel neerdalen, dat u en uw vijftigtal verteert. Toen daalde er vuur uit de hemel neer, en het verteerde hem en zijn vijftigtal. En hij zond weer naar hem een andere leider over vijftig met zijn vijftigtal. Deze antwoordde en sprak tot hem: Man van God! Zo zegt de koning: Kom snel naar beneden.", "Ezech 1:1": "In het dertigste jaar, in de vierde maand, op de vijfde dag van die maand, toen ik te midden van de weggevoerden was bij de rivier Chebar, gebeurde het dat de hemelen werden geopend, en ik zag visioenen van God.", "Ezech 11:4": "Daarom, profeteer tegen hen; profeteer, o mensenkind!", "Richt 12:3": "Toen ik nu zag dat u mij niet verloste, zette ik mijn leven op het spel en trok tegen de kinderen van Ammon, en de HEERE gaf hen in mijn hand; waarom bent u dan vandaag naar mij toegekomen om tegen mij te strijden?", "2 Kron 33:18": "Het overige nu van de geschiedenissen van Manasse, en zijn gebed tot zijn God, ook de woorden van de zieners, die tot hem gesproken hebben in de Naam van de HEERE, de God van Israël, zie, die staan in de geschiedenissen van de koningen van Israël;", "Ezech 2:1": "En Hij zei tegen mij: Mensenkind, sta op uw voeten, en Ik zal met u spreken.", "Spr 17:13": "Die kwaad voor goed vergeldt, het kwaad zal van zijn huis niet wijken.", "1 Sam 10:10-12": "Toen zij daar bij de heuvel kwamen, zie, toen kwam hem een groep profeten tegemoet; en de Geest van de HEERE werd vaardig over hem, en hij profeteerde in hun midden. En het gebeurde, toen ieder die hem vroeger gekend had, zag dat hij, zie, profeteerde met de profeten, dat het volk zei, de een tegen de ander: Wat is dit, dat de zoon van Kis is overkomen? Is Saul ook onder de profeten? Toen antwoordde een man vandaar, en zei: Wie is toch hun vader? Daarom is het een spreekwoord geworden: Is Saul ook onder de profeten?", "Deut 1:30": "De HEERE, uw God, Die voor u uit gaat, Die zal voor u strijden, naar alles wat Hij voor uw ogen in Egypte voor u gedaan heeft.", "Jer 20:9": "Daarom zei ik: Ik zal Hem niet meer noemen, en niet meer in Zijn Naam spreken; maar het werd in mijn hart als een brandend vuur, opgesloten in mijn beenderen; en ik werd moe van het verdragen, maar ik kon het niet.", "Ezech 3:22": "En de hand van de HEERE was daar op mij, en Hij zei tot mij: Maak u op, ga uit naar de vallei, en Ik zal daar met u spreken.", "Hand 7:55": "Maar hij, vol van de Heilige Geest, hield de ogen gericht naar de hemel, en zag de heerlijkheid van God, en Jezus, staande aan de rechterhand van God.", "1 Sam 20:2": "Hij daarentegen zei tegen hem: Dat zij verre, u zult niet sterven. Zie, mijn vader doet geen grote zaak, en geen kleine zaak, die hij niet aan mij bekendmaakt; waarom zou dan mijn vader deze zaak voor mij verbergen? Dat is niet zo.", "Pred 9:3": "Dit is een kwaad onder alles wat er onder de zon gebeurt, dat eenzelfde lot allen treft, en dat ook het hart van de mensenkinderen vol boosheid is, en dat er in hun leven onzinnigheden zijn in hun hart; en daarna moeten zij naar de doden toe.", "2 Kon 6:8-12": "En de koning van Syrië voerde oorlog tegen Israël, en overlegde met zijn knechten, en zei: Mijn legerplaats zal zijn bij die en die plaats. Maar de man van God zond bericht aan de koning van Israël, en zei: Wacht u ervoor dat u door die plaats trekt, want de Syriërs zijn daarheen afgekomen. Daarom zond de koning van Israël bericht naar die plaats, waarover de man van God hem gezegd en gewaarschuwd had, en hij wachtte zich daar, niet één keer, en niet twee keer.", "Gen 31:2": "Jakob zag ook het gezicht van Laban aan, en zie, het was tegenover hem niet als gisteren en eergisteren.", "Deut 3:22": "Wees niet bang voor hen; want de HEERE, uw God, strijdt voor u.", "Hand 21:4": "En wij vonden de discipelen en bleven daar zeven dagen; die zeiden door de Geest tegen Paulus dat hij niet naar Jeruzalem moest gaan.", "1 Kon 22:28": "En Micha zei: Als u ooit in vrede terugkomt, dan heeft de HEERE niet door mij gesproken! Verder zei hij: Hoor, alle volken!", "Joz 1:9": "Heb Ik het u niet bevolen? Wees sterk en heb goede moed, en wees niet bang, en wees niet ontzet; want de HEERE, uw God, is met u overal waar u heengaat.", "2 Kron 8:14": "Hij stelde ook, naar de wijze van zijn vader David, de verdelingen van de priesters aan over hun dienst, en van de Levieten over hun taken, om God te prijzen en voor de priesters te dienen, naar de eis van elke dag; en de poortwachters in hun verdelingen, bij elke poort; want zo was het gebod van David, de man Gods.", "Ps 35:12": "Zij vergelden mij kwaad voor goed, de beroving van mijn ziel.", "Mark 12:36": "Want David zelf heeft door de Heilige Geest gezegd: De Heere heeft gezegd tegen mijn Heere: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gemaakt heb.", "Joh 15:25": "Maar dit gebeurt, zodat het woord vervuld wordt dat in hun wet geschreven is: Zij hebben Mij zonder oorzaak gehaat.", "Jer 23:9": "Aangaande de profeten. Mijn hart wordt in mijn binnenste gebroken, al mijn beenderen beven; ik ben als een dronken man, en als een man die de wijn te boven gaat; vanwege de HEERE, en vanwege de woorden van Zijn heiligheid.", "Openb 22:6": "En hij zei tegen mij: Deze woorden zijn getrouw en waarachtig; en de Heere, de God van de heilige profeten, heeft Zijn engel gezonden om Zijn dienstknechten te tonen wat spoedig moet gebeuren.", "Luk 1:70": "zoals Hij gesproken heeft door de mond van Zijn heilige profeten, die er van oudsher geweest zijn;", "1 Kon 18:36": "En het gebeurde, toen men het spijsoffer offerde, dat de profeet Elia naderde en zei: HEERE, God van Abraham, Izak en Israël, laat het vandaag bekend worden, dat U God bent in Israël, en ik Uw knecht; en dat ik al deze dingen naar Uw woord gedaan heb.", "Ex 6:28": "Zo sprak de HEERE tot Mozes en zei: Ik ben de HEERE! Spreek tot Farao, de koning van Egypte, alles wat Ik tot u spreek.", "1 Sam 17:49-51": "En David stak zijn hand in de tas, en nam er een steen uit, en slingerde die, en trof de Filistijn in zijn voorhoofd, zodat de steen in zijn voorhoofd wegzonk, en hij viel voorover op de grond. Zo overweldigde David de Filistijn met een slinger en met een steen; en hij versloeg de Filistijn en doodde hem; doch David had geen zwaard in zijn hand. Daarom liep David, en ging op de Filistijn staan, en nam zijn zwaard, en trok het uit zijn schede, en doodde hem, en hakte hem daarmee het hoofd af. Toen de Filistijnen zagen dat hun geweldigste dood was, vluchtten zij.", "Hand 21:11": "En hij kwam naar ons toe, nam de gordel van Paulus, bond daarmee zijn eigen handen en voeten, en zei: Dit zegt de Heilige Geest: De man van wie deze gordel is, zullen de Joden zo te Jeruzalem binden en overleveren in de handen van de heidenen.", "1 Sam 20:9": "Toen zei Jonathan: Dat zij verre van u! Maar als ik zeker merkte dat dit kwaad bij mijn vader ten volle besloten was, dat het u zou overkomen, zou ik u dat dan niet te kennen geven?", "2 Sam 6:20": "Toen David nu terugkwam om zijn huis te zegenen, ging Michal, de dochter van Saul, naar buiten, David tegemoet, en zei: Hoe is de koning van Israël vandaag geëerd, die zich vandaag voor de ogen van de dienstmaagden van zijn dienstknechten heeft ontbloot, zoals een van de nietswaardige mensen zich onbeschaamd ontbloot!", "Jer 18:20": "Zal dan kwaad voor goed vergolden worden? want zij hebben mijn ziel een kuil gegraven; gedenk dat ik voor Uw aangezicht gestaan heb om goed voor hen te spreken, om Uw grimmigheid van hen af te wenden.", "1 Sam 3:1": "En de jongen Samuël diende de HEERE onder toezicht van Eli; en het woord van de HEERE was zeldzaam in die dagen; er was geen openbaar visioen.", "Num 11:17": "Dan zal Ik neerkomen en daar met u spreken; en van de Geest die op u is, zal Ik afnemen, en op hen leggen; en zij zullen met u de last van dit volk dragen, opdat u die niet alleen draagt.", "Amos 5:9": "Die verwoesting brengt over een sterke, zodat de verwoesting komt over een vesting.", "Fil 2:15": "Opdat u onberispelijk en oprecht mag zijn, kinderen van God, onstraffelijk te midden van een krom en verdraaid geslacht, onder wie u schijnt als lichten in de wereld;", "1 Sam 28:16": "Toen zei Samuel: Waarom vraagt u mij dit toch, terwijl de HEERE van u geweken en uw vijand geworden is?", "Luk 2:25-27": "En zie, er was een mens in Jeruzalem, wiens naam was Simeon; en deze mens was rechtvaardig en godvrezend, en verwachtte de vertroosting van Israël, en de Heilige Geest was op hem. En hem was door de Heilige Geest een goddelijke openbaring gedaan, dat hij de dood niet zien zou voordat hij de Christus van de Heere zou zien. En hij kwam door de Geest in de tempel. En toen de ouders het Kindje Jezus binnenbrachten, om naar de gewoonte van de wet met Hem te doen,", "Deut 1:5": "Aan deze kant van de Jordaan, in het land Moab, begon Mozes deze wet uit te leggen, en zei:", "Zach 2:9": "Want zie, Ik zal Mijn hand over hen bewegen, en zij zullen hun knechten een roof wezen. Zo zult u weten, dat de HEERE van de heerscharen mij gezonden heeft.", "Zach 10:5": "En zij zullen zijn als de helden, die in het slijk van de straten treden in de strijd, en zij zullen strijden; want de HEERE zal met hen zijn, en zij zullen hen beschamen die op paarden rijden.", "Dan 7:16": "Ik naderde tot een van hen die daar stonden, en vroeg hem naar de zekerheid over dit alles; en hij zei het mij, en maakte mij de uitleg van deze zaken bekend.", "Dan 8:16": "En ik hoorde tussen de oevers van de Ulai een mensenstem, die riep en zei: Gabriël! leg deze man het gezicht uit.", "2 Kon 15:32-34": "In het tweede jaar van Pekah, de zoon van Remalia, de koning van Israël, werd Jotham koning, de zoon van Uzzia, de koning van Juda. Hij was vijfentwintig jaar oud toen hij koning werd, en regeerde zestien jaar te Jeruzalem; en de naam van zijn moeder was Jerusa, de dochter van Zadok. En hij deed wat recht was in de ogen van de HEERE; precies zoals zijn vader Uzzia gedaan had, deed hij.", "1 Sam 18:1-4": "Het gebeurde nu, toen hij geëindigd had tot Saul te spreken, dat de ziel van Jonathan verbonden werd aan de ziel van David; en Jonathan had hem lief als zijn eigen ziel. En Saul nam hem die dag, en liet hem niet meer terugkeren naar het huis van zijn vader. Jonathan nu en David maakten een verbond, omdat hij hem liefhad als zijn eigen ziel.", "Num 23:20": "Zie, ik heb opdracht ontvangen om te zegenen; omdat Hij zegent, zal ik het niet terugdraaien.", "Num 24:2-9": "Toen Bileam zijn ogen ophief en Israël zag, wonend naar zijn stammen, kwam de Geest van God op hem. En hij hief zijn spreuk op en zei: Bileam, de zoon van Beor, spreekt, en de man wiens ogen geopend zijn, spreekt! Die hoort de woorden van God, spreekt, die het gezicht van de Almachtige ziet; die in verrukking valt, en wiens ogen geopend worden!", "Spr 31:8": "Open uw mond voor de stomme, voor de rechtszaak van allen die dreigen om te komen.", "Neh 9:30": "Doch U hebt geduld met hen gehad, vele jaren lang, en tegen hen getuigd door Uw Geest, door de dienst van Uw profeten, maar zij neigden hun oor niet; daarom hebt U hen gegeven in de hand van de volken van de landen.", "Jak 5:10": "Mijn broeders, neem als voorbeeld van het lijden en van de geduldigheid de profeten, die in de Naam van de Heere gesproken hebben.", "1 Petr 3:16": "en heb een goed geweten, opdat zij die uw goede wandel in Christus belasteren, beschaamd gemaakt worden in datgene waarin zij kwaad van u spreken, alsof u kwaaddoeners bent.", "Gen 41:39": "Daarna zei Farao tegen Jozef: Omdat God u dit alles heeft bekendgemaakt, is er niemand zo verstandig en wijs als u.", "Richt 9:17": "(want mijn vader heeft voor u gestreden, en hij heeft zijn leven ver weggeworpen, en heeft u gered uit de hand van de Midianieten;", "1 Sam 20:24-34": "David nu verborg zich in het veld; en toen het nieuwe maan was, zat de koning bij het voedsel, om te eten. Toen de koning zich op zijn zitplaats had gezet, deze keer net als de andere keren, aan de plaats bij de wand, stond Jonathan op, en Abner zat aan Sauls zijde, en Davids plaats werd leeg gevonden. En Saul sprak die dag niets, want hij zei: Hem is iets overkomen, dat hij niet rein is; zeker, hij is niet rein.", "1 Sam 19:9-24": "Doch de boze geest van de HEERE kwam over Saul, terwijl hij in zijn huis zat, met zijn speer in zijn hand; en David speelde op de snaren met zijn hand. Saul nu probeerde David met de speer aan de wand te spietsen, doch hij ontweek Saul, die met de speer in de wand sloeg. Toen vluchtte David, en ontkwam diezelfde nacht. Maar Saul zond boden naar Davids huis, om hem te bewaken, en om hem 's morgens te doden. Dit maakte Michal, zijn vrouw, aan David bekend, en zei: Als u vannacht uw leven niet redt, zult u morgen gedood worden.", "1 Kon 13:20": "En het gebeurde, terwijl zij aan tafel zaten, dat het woord van de HEERE kwam tot de profeet die hem had laten terugkeren;", "Luk 1:67": "En Zacharias, zijn vader, werd vervuld met de Heilige Geest, en profeteerde, en zei:", "Spr 17:17": "Een vriend heeft te allen tijde lief; en een broeder wordt geboren voor de tijd van benauwdheid.", "Joël 2:29": "Ja, ook over de dienstknechten, en over de dienstmaagden, zal Ik in die dagen Mijn Geest uitgieten.", "1 Kon 22:44": "Toch werden de hoogten niet weggenomen; het volk offerde en bracht nog reukwerk op de hoogten.", "Luk 11:33-36": "En niemand die een lamp aansteekt, zet die op een verborgen plaats, of onder een korenmaat, maar op een standaard, opdat wie binnenkomen het licht kunnen zien. De lamp van het lichaam is het oog: wanneer dan uw oog zuiver is, dan is ook uw hele lichaam verlicht; maar als het slecht is, dan is ook uw lichaam duister. Kijk dan uit, dat niet het licht dat in u is, duisternis is.", "1 Kron 28:19": "Dit alles, zei David, heeft men mij door geschrift laten verstaan, van de hand van de HEERE, namelijk al de werken van deze bereiding.", "2 Kron 17:7-9": "In het derde jaar van zijn regering nu zond hij naar zijn vorsten, naar Ben-chaïl, en naar Obadja, en naar Zecharja, en naar Nathaneël, en naar Michaja, om te leren in de steden van Juda. En met hen de Levieten, Semaja en Nethanja, en Zebadja, en Asaël, en Semiramoth, en Jonathan, en Adonia, en Tobia, en Tob-adonia, de Levieten, en met hen de priesters Elisama en Joram. En zij leerden in Juda, en het wetboek van de HEERE was bij hen; en zij gingen rond in alle steden van Juda, en leerden onder het volk.", "Jer 42:4": "En de profeet Jeremia zei tegen hen: Ik heb het gehoord; zie, ik zal tot de HEERE, uw God, bidden naar uw woorden; en het zal gebeuren, elk woord dat de HEERE u zal antwoorden, zal ik u bekendmaken, ik zal u niet één woord onthouden.", "1 Sam 19:1-6": "Daarom sprak Saul tot zijn zoon Jonathan en tot al zijn knechten, om David te doden. Doch Jonathan, Sauls zoon, had groot welgevallen aan David. En Jonathan verkondigde het David en zei: Mijn vader Saul zoekt u te doden; nu dan, wees toch morgenochtend op uw hoede, en blijf op een geheime plaats, en verberg u. Doch ik zal uitgaan, en aan de hand van mijn vader staan op het veld waar u zult zijn; en ik zal met mijn vader over u spreken, en zien wat het is; dat zal ik u meedelen.", "Luk 11:24-26": "Wanneer de onreine geest van de mens is uitgevaren, gaat hij door dorre plaatsen, op zoek naar rust; en als hij die niet vindt, zegt hij: Ik zal terugkeren naar mijn huis, waar ik uit vandaan kwam. En als hij komt, vindt hij het schoongeveegd en op orde gebracht. Dan gaat hij heen, en neemt zeven andere geesten mee, slechter dan hijzelf, en als ze naar binnen gegaan zijn, wonen zij daar; en het einde van die mens wordt erger dan het begin.", "Hand 9:25": "Maar de discipelen namen hem 's nachts en lieten hem neer door de muur, door hem in een mand te laten zakken.", "1 Sam 20:4-9": "Jonathan nu zei tegen David: Wat uw ziel zegt, dat zal ik voor u doen. En David zei tegen Jonathan: Zie, morgen is de nieuwe maan, wanneer ik zeker met de koning zou aanzitten om te eten; zo laat mij gaan, dat ik mij op het veld verberg tot aan de derde avond. Als uw vader mij zeker mist, zo zult u zeggen: David heeft mij met ernst gevraagd of hij naar zijn stad Bethlehem mocht lopen; want daar is een jaarlijks offer voor het hele geslacht.", "Hand 9:24": "Maar hun plan werd Saulus bekend; en zij bewaakten de poorten, zowel overdag als 's nachts, om hem te kunnen doden.", "Deut 7:17-24": "Als u in uw hart zei: Deze volken zijn groter dan ik; hoe zou ik hen uit hun bezit kunnen verdrijven? — wees niet bevreesd voor hen; denk goed terug aan wat de HEERE, uw God, aan de farao en aan alle Egyptenaren gedaan heeft; de grote verzoekingen die uw ogen gezien hebben, en de tekenen, en de wonderen, en de sterke hand, en de uitgestrekte arm, waardoor de HEERE, uw God, u heeft uitgevoerd; zo zal de HEERE, uw God, doen aan alle volken voor wie u bevreesd bent.", "Deut 5:31": "Maar u, sta hier bij Mij, dan zal Ik tot u spreken al de geboden, en inzettingen, en rechten, die u hun leren zult, opdat zij ze doen in het land dat Ik hun geven zal, om dat te erven.", "1 Sam 15:34": "Daarna ging Samuël naar Rama; en Saul ging naar zijn huis te Gibea-Sauls.", "Spr 26:25": "Als hij vriendelijk spreekt, geloof hem niet, want zeven gruwelen zijn in zijn hart.", "Deut 20:1": "Wanneer u zult uittrekken tot de strijd tegen uw vijanden, en zult zien paarden en wagens, een volk, groter dan u, dan zult u voor hen niet vrezen; want de HEERE, uw God, is met u, Die u uit Egypteland heeft opgevoerd.", "Ezra 5:2": "Toen maakten Zerubbabel, de zoon van Sealthiël, en Jesua, de zoon van Jozadak, zich op en begonnen het huis van God te bouwen, Dat te Jeruzalem woont; en met hen de profeten van God, die hen ondersteunden.", "Jer 1:4-10": "Het woord van de HEERE dan kwam tot mij, en zei: Voordat Ik u in moeders buik vormde, heb Ik u gekend, en voordat u uit de baarmoeder voortkwam, heb Ik u geheiligd; Ik heb u de volken tot een profeet gesteld. Toen zei ik: Ach, Heere HEERE! zie, ik kan niet spreken, want ik ben jong.", "Deut 3:21": "Ook gebood ik Jozua in die tijd: Uw ogen hebben alles gezien wat de HEERE, uw God, aan deze twee koningen gedaan heeft; zo zal de HEERE doen aan alle koninkrijken waar u doorheen trekt.", "Hand 8:29": "En de Geest zei tegen Filippus: Ga erheen, en voeg u bij deze wagen.", "2 Sam 6:14": "En David huppelde met alle macht voor het aangezicht van de HEERE; en David was omgord met een linnen lijfrok.", "2 Kon 2:9": "Het gebeurde nu, toen zij overgekomen waren, dat Elia zei tegen Elisa: Vraag wat ik voor u doen zal, voordat ik van bij u weggenomen word. En Elisa zei: Laat toch een dubbel deel van uw geest op mij zijn!", "Hand 9:21": "En allen die het hoorden, waren verbaasd en zeiden: Is dit niet degene die in Jeruzalem verwoestte wie deze Naam aanriepen, en die daarom hierheen gekomen is, opdat hij hen gebonden zou brengen naar de overpriesters?", "2 Kor 11:32": "De stadhouder van koning Aretas bezette in Damaskus de stad van de Damaskenen, met de bedoeling mij te vangen;", "Rom 1:1": "Paulus, een dienstknecht van Jezus Christus, een geroepen apostel, afgezonderd tot het Evangelie van God,", "Jer 13:1-3": "Zo heeft de HEERE tegen mij gezegd: Ga heen, en koop u een linnen gordel, en doe die om uw middel, maar breng hem niet in het water. En ik kocht een gordel naar het woord van de HEERE, en ik deed die om mijn middel. Toen kwam het woord van de HEERE voor de tweede keer tot mij, en Hij zei:", "2 Kon 4:1": "Een vrouw uit de vrouwen van de zonen der profeten riep tot Elisa en zei: Uw knecht, mijn man, is gestorven, en u weet dat uw knecht de HEERE was vrezende; nu is de schuldeiser gekomen om mijn beide kinderen voor zich tot knechten te nemen.", "1 Sam 13:9": "Toen zei Saul: Breng mij hier een brandoffer en dankoffers; en hij offerde het brandoffer.", "2 Sam 17:20": "Toen nu de knechten van Absalom bij de vrouw in het huis kwamen, zeiden zij: Waar zijn Ahimaäz en Jonathan? En de vrouw zei tegen hen: Zij zijn over dat waterstroompje gegaan. En toen zij hen gezocht en niet gevonden hadden, keerden zij terug naar Jeruzalem.", "1 Sam 30:7": "En David zei tegen de priester Abjathar, de zoon van Achimelech: Breng mij toch de efod hier. En Abjathar bracht de efod naar David.", "Obadja 1:1": "Het visioen van Obadja. Zo zegt de Heere HEERE van Edom: Wij hebben een bericht gehoord van de HEERE, en er is een gezant gestuurd onder de heidenvolken: Sta op, en laten wij tegen haar opstaan ten strijde.", "Ezech 3:27": "Maar als Ik met u spreken zal, zal Ik uw mond opendoen, en u zult tot hen zeggen: Zo zegt de Heere HEERE, wie hoort, laat hij horen, en wie het laat, laat hij het laten; want zij zijn een opstandig huis.", "Ex 24:16": "En de heerlijkheid van de HEERE woonde op de berg Sinaï, en de wolk bedekte hem zes dagen, en op de zevende dag riep Hij Mozes uit het midden van de wolk.", "Matt 27:4": "en zei: Ik heb gezondigd, want ik heb onschuldig bloed verraden! Maar zij zeiden: Wat gaat ons dat aan? U moet maar toezien.", "2 Kon 6:17": "En Elisa bad, en zei: HEERE, open toch zijn ogen, dat hij ziet! En de HEERE opende de ogen van de knecht, dat hij zag; en zie, de berg was vol vurige paarden en wagens rondom Elisa.", "1 Sam 16:13": "Toen nam Samuël de oliehoorn, en zalfde hem te midden van zijn broers. En de Geest van de HEERE kwam vanaf die dag over David, en bleef. Daarna stond Samuël op, en ging naar Rama.", "2 Kon 2:7": "En vijftig mannen van de zonen van de profeten gingen erheen, en gingen op afstand tegenover hen staan; en die beiden stonden bij de Jordaan.", "Gen 40:8": "En zij zeiden tegen hem: Wij hebben een droom gehad, en er is niemand die hem uitlegt. En Jozef zei tegen hen: Zijn de uitleggingen niet van God? Vertel ze mij toch.", "1 Kon 14:5": "Maar de HEERE zei tegen Ahia: Zie, Jerobeams vrouw komt om u iets te vragen over haar zoon, want hij is ziek. Zo en zo zult u tot haar spreken, en het zal gebeuren, als zij binnenkomt, dat zij zich als een andere vrouw zal voordoen.", "1 Sam 28:10": "Saul nu zwoer haar bij de HEERE en zei: Zo waarachtig als de HEERE leeft, u zal geen straf om deze zaak overkomen!", "Ezech 33:22": "Nu was de hand van de HEERE 's avonds op mij geweest, voordat wie ontkomen was kwam, en Hij had mijn mond geopend, totdat hij 's morgens tot mij kwam. Zo werd mijn mond geopend, en ik was niet meer stom.", "Ezech 3:24": "Toen kwam de Geest in mij, en stelde mij op mijn voeten, en Hij sprak met mij, en zei tot mij: Ga, sluit u binnen in uw huis.", "2 Kon 15:1-3": "In het zevenentwintigste jaar van Jerobeam, de koning van Israël, werd Azaria koning, de zoon van Amazia, de koning van Juda. Hij was zestien jaar oud toen hij koning werd, en hij regeerde tweeënvijftig jaar in Jeruzalem; en de naam van zijn moeder was Jecholia, uit Jeruzalem. En hij deed wat recht was in de ogen van de HEERE, precies zoals zijn vader Amazia gedaan had.", "Job 33:14-16": "Maar God spreekt eens of tweemaal; doch men let daar niet op. In de droom, door het gezicht 's nachts, als een diepe slaap op de mensen valt, in de sluimering op het leger; Dan openbaart Hij het voor het oor der mensen, en Hij verzegelt hun kastijding;", "Richt 6:34": "Toen bekleedde de Geest van de HEERE Gideon, en hij blies op de bazuin, en de Abiëzrieten werden achter hem bijeengeroepen.", "Joz 3:7": "Want de HEERE had tegen Jozua gezegd: Deze dag zal Ik beginnen u groot te maken voor de ogen van heel Israël, opdat zij weten dat Ik met u zal zijn, zoals Ik met Mozes geweest ben.", "2 Sam 23:3": "De God van Israël heeft gezegd, de Rotssteen van Israël heeft tot mij gesproken: Er zal een Heerser zijn over de mensen, een Rechtvaardige, een Heerser in de vreze van God.", "Richt 18:14": "Toen antwoordden de vijf mannen die gegaan waren om het land van Lais te verkennen, en zeiden tegen hun broeders: Weet u ook dat er in die huizen een efod is, en terafim, en een gesneden beeld en een gegoten beeld? Bedenk dus nu wat u te doen hebt.", "Jer 1:1": "De woorden van Jeremia, de zoon van Hilkia, uit de priesters die te Anathoth waren, in het land van Benjamin;", "Jes 6:1-9": "In het jaar dat koning Uzzia stierf, zag ik de Heere zitten op een hoge en verheven troon, en Zijn zomen vulden de tempel. De serafs stonden boven Hem; ieder had zes vleugels; met twee bedekte ieder zijn gezicht, en met twee bedekte hij zijn voeten, en met twee vloog hij. En de een riep tot de ander en zei: Heilig, heilig, heilig is de HEERE van de heerscharen! De hele aarde is vol van Zijn heerlijkheid!", "1 Sam 19:1-7": "Daarom sprak Saul tot zijn zoon Jonathan en tot al zijn knechten, om David te doden. Doch Jonathan, Sauls zoon, had groot welgevallen aan David. En Jonathan verkondigde het David en zei: Mijn vader Saul zoekt u te doden; nu dan, wees toch morgenochtend op uw hoede, en blijf op een geheime plaats, en verberg u. Doch ik zal uitgaan, en aan de hand van mijn vader staan op het veld waar u zult zijn; en ik zal met mijn vader over u spreken, en zien wat het is; dat zal ik u meedelen.", "Spr 27:4": "Grimmigheid en overloping van toorn is wreedheid; maar wie zal voor jaloezie standhouden?", "Spr 21:1": "Het hart van de koning is in de hand van de HEERE als waterbeken. Hij neigt het tot alles wat Hij wil.", "1 Sam 22:7-19": "Toen zei Saul tegen zijn knechten die bij hem stonden: Hoor toch, u, zonen van Jemini, zal ook de zoon van Isaï u allemaal akkers en wijngaarden geven? Zal hij u allemaal tot aanvoerders van duizenden en aanvoerders van honderden stellen? Dat u zich allemaal tegen mij verbonden hebt, en niemand het mij laat horen dat mijn zoon een verbond gemaakt heeft met de zoon van Isaï; en niemand onder u heeft er verdriet van vanwege mij, en laat het mij horen; want mijn zoon heeft mijn knecht tegen mij opgehitst, om een hinderlaag te leggen, zoals het op deze dag is. Toen antwoordde Doeg, de Edomiet, die bij de knechten van Saul stond, en zei: Ik zag de zoon van Isaï komen te Nob, naar Achimelech, de zoon van Ahitub;", "1 Kon 21:20": "En Achab zei tegen Elia: Hebt u mij gevonden, o mijn vijand? En hij zei: Ik heb u gevonden, omdat u uzelf verkocht hebt om te doen wat kwaad is in de ogen van de HEERE.", "Num 24:15": "Toen hief hij zijn spreuk op en zei: Bileam, de zoon van Beor, spreekt, en die man wiens ogen geopend zijn, spreekt!", "2 Kron 6:22": "Wanneer iemand tegen zijn naaste zal gezondigd hebben, en die hem een eed van de vloek opgelegd zal hebben om zichzelf te vervloeken, en de eed van de vloek voor Uw altaar in dit huis komen zal;", "2 Kon 2:2": "En Elia zei tegen Elisa: Blijf toch hier, want de HEERE heeft mij naar Beth-el gezonden. Maar Elisa zei: Zo waarachtig als de HEERE leeft en uw ziel leeft, ik zal u niet verlaten! Zo gingen zij af naar Beth-el.", "Hebr 11:4": "Door het geloof heeft Abel een beter offer aan God gebracht dan Kaïn, en daardoor heeft hij het getuigenis gekregen dat hij rechtvaardig was, doordat God over zijn gave getuigenis gaf; en door dit geloof spreekt hij nog, hoewel hij gestorven is."}, "noten": {}, "koppeling": {"1": "Daarom <span class=\"wl\" data-l=\"L1\" data-code=\"H1696\">sprak</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H7586\">Saul</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H7586\">tot</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H1121\">zijn</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H1121\">zoon</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H3129\">Jonathan</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H413\">en</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H413\">tot</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H3605\">al</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H3605\">zijn</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H5650\">knechten</span>, <span class=\"wl\" data-l=\"L7\" data-code=\"H5650\">om</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H1732\">David</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H1732\">te</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H4191\">doden</span>. <span class=\"wl\" data-l=\"L10\" data-code=\"H3083\">Doch</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H3083\">Jonathan</span>, <span class=\"wl\" data-l=\"L11\" data-code=\"H7586\">Sauls</span> <span class=\"wl\" data-l=\"L12\" data-code=\"H1121\">zoon</span>, <span class=\"wl\" data-l=\"L12\" data-code=\"H1121\">had</span> <span class=\"wl\" data-l=\"L14\" data-code=\"H3966\">groot</span> <span class=\"wl\" data-l=\"L13\" data-code=\"H2654\">welgevallen</span> <span class=\"wl\" data-l=\"L13\" data-code=\"H2654\">aan</span> <span class=\"wl\" data-l=\"L15\" data-code=\"H1732\">David</span>.", "2": "<span class=\"wl\" data-l=\"L1\" data-code=\"H3083\">En</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H3083\">Jonathan</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H5046\">verkondigde</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H5046\">het</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H1732\">David</span> en zei: ta-code=\"H5921\">Daarom</span> <span class=\"wl\" data-l=\"L13\" data-code=\"H559\">zegt</span> <span class=\"wl\" data-l=\"L13\" data-code=\"H559\">men</span>: <span class=\"wl\" data-l=\"L13\" data-code=\"H559\">Is</span> <span class=\"wl\" data-l=\"L14\" data-code=\"H7586\">Saul</span> <span class=\"wl\" data-l=\"L15\" data-code=\"H1571\">ook</span> <span class=\"wl\" data-l=\"L16\" data-code=\"H5030\">onder</span> <span class=\"wl\" data-l=\"L16\" data-code=\"H5030\">de</span> <span class=\"wl\" data-l=\"L16\" data-code=\"H5030\">profeten</span>?"}, "koppeling_kjv": {"1": "And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> to <span class=\"wl wl-kjv\" data-code=\"H3129\">Jonathan</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> and to all his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> that they should <span class=\"wl wl-kjv\" data-code=\"H4191\">kill</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David.</span>", "2": "But <span class=\"wl wl-kjv\" data-code=\"H3083\">Jonathan</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H2654\">delighted</span> <span class=\"wl wl-kjv\" data-code=\"H3966\">much</span> in <span class=\"wl wl-kjv\" data-code=\"H1732\">David:</span> and <span class=\"wl wl-kjv\" data-code=\"H3083\">Jonathan</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> my <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H1245\">seeketh</span> to <span class=\"wl wl-kjv\" data-code=\"H4191\">kill</span> thee: now therefore, I pray thee, take <span class=\"wl wl-kjv\" data-code=\"H8104\">heed</span> to thyself until the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">abide</span> in a <span class=\"wl wl-kjv\" data-code=\"H5643\">secret</span> place, and <span class=\"wl wl-kjv\" data-code=\"H2244\">hide</span> thyself:", "3": "And I will go <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> and <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">beside</span> my <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> where thou art, and I will <span class=\"wl wl-kjv\" data-code=\"H1696\">commune</span> with my <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> of thee; and <span class=\"wl wl-kjv\" data-code=\"H4100\">what</span> I <span class=\"wl wl-kjv\" data-code=\"H7200\">see,</span> that I will <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> thee.", "4": "And <span class=\"wl wl-kjv\" data-code=\"H3083\">Jonathan</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> unto <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Let not the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H2398\">sin</span> against his <span class=\"wl wl-kjv\" data-code=\"H5650\">servant,</span> against <span class=\"wl wl-kjv\" data-code=\"H1732\">David;</span> because he hath not <span class=\"wl wl-kjv\" data-code=\"H2398\">sinned</span> against thee, and because his <span class=\"wl wl-kjv\" data-code=\"H4639\">works</span> have been to thee-ward <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">good:</span>", "5": "For he did <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> his <span class=\"wl wl-kjv\" data-code=\"H5315\">life</span> in his <span class=\"wl wl-kjv\" data-code=\"H3709\">hand,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">slew</span> the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">wrought</span> a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H8668\">salvation</span> for all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> thou <span class=\"wl wl-kjv\" data-code=\"H7200\">sawest</span> it, and didst <span class=\"wl wl-kjv\" data-code=\"H8055\">rejoice:</span> wherefore then wilt thou <span class=\"wl wl-kjv\" data-code=\"H2398\">sin</span> against <span class=\"wl wl-kjv\" data-code=\"H5355\">innocent</span> <span class=\"wl wl-kjv\" data-code=\"H1818\">blood,</span> to <span class=\"wl wl-kjv\" data-code=\"H4191\">slay</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> without a <span class=\"wl wl-kjv\" data-code=\"H2600\">cause?</span>", "6": "And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">hearkened</span> unto the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of <span class=\"wl wl-kjv\" data-code=\"H3083\">Jonathan:</span> and <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H7650\">sware,</span> As the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> he shall <span class=\"wl wl-kjv\" data-code=\"H518\">not</span> be <span class=\"wl wl-kjv\" data-code=\"H4191\">slain.</span>", "7": "And <span class=\"wl wl-kjv\" data-code=\"H3083\">Jonathan</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> and <span class=\"wl wl-kjv\" data-code=\"H3083\">Jonathan</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">shewed</span> him all those <span class=\"wl wl-kjv\" data-code=\"H1697\">things.</span> And <span class=\"wl wl-kjv\" data-code=\"H3083\">Jonathan</span> <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> to <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> and he was in his <span class=\"wl wl-kjv\" data-code=\"H6440\">presence,</span> as in times <span class=\"wl wl-kjv\" data-code=\"H865\">past.</span>", "8": "And there was <span class=\"wl wl-kjv\" data-code=\"H4421\">war</span> <span class=\"wl wl-kjv\" data-code=\"H3254\">again:</span> and <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out,</span> and <span class=\"wl wl-kjv\" data-code=\"H3898\">fought</span> with the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">slew</span> them with a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4347\">slaughter;</span> and they <span class=\"wl wl-kjv\" data-code=\"H5127\">fled</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">from</span> him.", "9": "And the <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> from the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was upon <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> as he <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> in his <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> with his <span class=\"wl wl-kjv\" data-code=\"H2595\">javelin</span> in his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand:</span> and <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H5059\">played</span> with his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand.</span>", "10": "And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H1245\">sought</span> to <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> even to the <span class=\"wl wl-kjv\" data-code=\"H7023\">wall</span> with the <span class=\"wl wl-kjv\" data-code=\"H2595\">javelin;</span> but he slipped <span class=\"wl wl-kjv\" data-code=\"H6362\">away</span> out of <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul's</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">presence,</span> and he <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> the <span class=\"wl wl-kjv\" data-code=\"H2595\">javelin</span> into the <span class=\"wl wl-kjv\" data-code=\"H7023\">wall:</span> and <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H5127\">fled,</span> and <span class=\"wl wl-kjv\" data-code=\"H4422\">escaped</span> that <span class=\"wl wl-kjv\" data-code=\"H3915\">night.</span>", "11": "<span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> also <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> unto <span class=\"wl wl-kjv\" data-code=\"H1732\">David's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> to <span class=\"wl wl-kjv\" data-code=\"H8104\">watch</span> him, and to <span class=\"wl wl-kjv\" data-code=\"H4191\">slay</span> him in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning:</span> and <span class=\"wl wl-kjv\" data-code=\"H4324\">Michal</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David's</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> him, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> If thou <span class=\"wl wl-kjv\" data-code=\"H4422\">save</span> not thy <span class=\"wl wl-kjv\" data-code=\"H5315\">life</span> to <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> to <span class=\"wl wl-kjv\" data-code=\"H4279\">morrow</span> thou shalt be <span class=\"wl wl-kjv\" data-code=\"H4191\">slain.</span>", "12": "So <span class=\"wl wl-kjv\" data-code=\"H4324\">Michal</span> <span class=\"wl wl-kjv\" data-code=\"H3381\">let</span> ➔ <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> through a <span class=\"wl wl-kjv\" data-code=\"H2474\">window:</span> and he <span class=\"wl wl-kjv\" data-code=\"H3212\">went,</span> and <span class=\"wl wl-kjv\" data-code=\"H1272\">fled,</span> and <span class=\"wl wl-kjv\" data-code=\"H4422\">escaped.</span>", "13": "And <span class=\"wl wl-kjv\" data-code=\"H4324\">Michal</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> an <span class=\"wl wl-kjv\" data-code=\"H8655\">image,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">laid</span> it in the <span class=\"wl wl-kjv\" data-code=\"H4296\">bed,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> a <span class=\"wl wl-kjv\" data-code=\"H3523\">pillow</span> of <span class=\"wl wl-kjv\" data-code=\"H5795\">goats'</span> hair for his <span class=\"wl wl-kjv\" data-code=\"H4763\">bolster,</span> and <span class=\"wl wl-kjv\" data-code=\"H3680\">covered</span> it with a <span class=\"wl wl-kjv\" data-code=\"H899\">cloth.</span>", "14": "And when <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> to <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> she <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> He is <span class=\"wl wl-kjv\" data-code=\"H2470\">sick.</span>", "15": "And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> the <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> again to <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Bring him <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to me in the <span class=\"wl wl-kjv\" data-code=\"H4296\">bed,</span> that I may <span class=\"wl wl-kjv\" data-code=\"H4191\">slay</span> him.", "16": "And when the <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> were come <span class=\"wl wl-kjv\" data-code=\"H935\">in,</span> behold, there was an <span class=\"wl wl-kjv\" data-code=\"H8655\">image</span> in the <span class=\"wl wl-kjv\" data-code=\"H4296\">bed,</span> with a <span class=\"wl wl-kjv\" data-code=\"H3523\">pillow</span> of <span class=\"wl wl-kjv\" data-code=\"H5795\">goats'</span> hair for his <span class=\"wl wl-kjv\" data-code=\"H4763\">bolster.</span>", "17": "And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H4324\">Michal,</span> Why hast thou deceived me <span class=\"wl wl-kjv\" data-code=\"H7411\">so,</span> and sent <span class=\"wl wl-kjv\" data-code=\"H7971\">away</span> mine <span class=\"wl wl-kjv\" data-code=\"H341\">enemy,</span> that he is <span class=\"wl wl-kjv\" data-code=\"H4422\">escaped?</span> And <span class=\"wl wl-kjv\" data-code=\"H4324\">Michal</span> <span class=\"wl wl-kjv\" data-code=\"H559\">answered</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> He <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me, Let me <span class=\"wl wl-kjv\" data-code=\"H7971\">go;</span> why should I <span class=\"wl wl-kjv\" data-code=\"H4191\">kill</span> thee?", "18": "So <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H1272\">fled,</span> and <span class=\"wl wl-kjv\" data-code=\"H4422\">escaped,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> to <span class=\"wl wl-kjv\" data-code=\"H7414\">Ramah,</span> and <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> him all that <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> had <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> to him. And he and <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in <span class=\"wl wl-kjv\" data-code=\"H5121\">Naioth.</span>", "19": "And it was <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Behold, <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> is at <span class=\"wl wl-kjv\" data-code=\"H5121\">Naioth</span> in <span class=\"wl wl-kjv\" data-code=\"H7414\">Ramah.</span>", "20": "And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> to <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David:</span> and when they <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> the <span class=\"wl wl-kjv\" data-code=\"H3862\">company</span> of the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesying,</span> and <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">standing</span> as <span class=\"wl wl-kjv\" data-code=\"H5324\">appointed</span> over them, the <span class=\"wl w \" data-code=\"H7414\">Ramah.</span>", "23": "And he <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> thither to <span class=\"wl wl-kjv\" data-code=\"H5121\">Naioth</span> in <span class=\"wl wl-kjv\" data-code=\"H7414\">Ramah:</span> and the <span class=\"wl wl-kjv\" data-code=\"H7307\">Spirit</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> was upon him also, and he <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">on,</span> and <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesied,</span> until he <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H5121\">Naioth</span> in <span class=\"wl wl-kjv\" data-code=\"H7414\">Ramah.</span>", "24": "And he stripped <span class=\"wl wl-kjv\" data-code=\"H6584\">off</span> his <span class=\"wl wl-kjv\" data-code=\"H899\">clothes</span> <span class=\"wl wl-kjv\" data-code=\"H1571\">also,</span> and <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesied</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> in like manner, and lay <span class=\"wl wl-kjv\" data-code=\"H5307\">down</span> <span class=\"wl wl-kjv\" data-code=\"H6174\">naked</span> all that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> and all that <span class=\"wl wl-kjv\" data-code=\"H3915\">night.</span> Wherefore they <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Is <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> also among the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets?</span>"}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"

let vertaling = 'SVnu';

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen bij dit vers.</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
