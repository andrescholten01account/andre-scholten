der bij u komen, totdat ik weet wat God met mij doen zal.","4":"En hij bracht hen voor het aangezicht van de koning van de Moabieten; en zij bleven bij hem al de dagen dat David in de vesting was.","5":"Doch de profeet Gad zei tegen David: Blijf niet in de vesting, ga heen, en ga naar het land van Juda. Toen ging David heen, en hij kwam in het woud Chereth.","6":"En Saul hoorde dat David bekend geworden was, en de mannen die bij hem waren. Saul nu zat op een heuvel onder het geboomte te Rama, en hij had zijn speer in zijn hand, en al zijn knechten stonden bij hem.","7":"Toen zei Saul tegen zijn knechten die bij hem stonden: Hoor toch, u, zonen van Jemini, zal ook de zoon van Isaï u allemaal akkers en wijngaarden geven? Zal hij u allemaal tot aanvoerders van duizenden en aanvoerders van honderden stellen?","8":"Dat u zich allemaal tegen mij verbonden hebt, en niemand *het* mij laat horen dat mijn zoon een verbond gemaakt heeft met de zoon van Isaï; en niemand onder u heeft er verdriet van vanwege mij, en laat het mij horen; want mijn zoon heeft mijn knecht tegen mij opgehitst, om een hinderlaag te leggen, zoals het op deze dag is.","9":"Toen antwoordde Doeg, de Edomiet, die bij de knechten van Saul stond, en zei: Ik zag de zoon van Isaï komen te Nob, naar Achimelech, de zoon van Ahitub;","10":"Die de HEERE voor hem raadpleegde, en hem teerkost gaf; hij gaf hem ook het zwaard van Goliath, de Filistijn.","11":"Toen zond de koning heen om de priester Achimelech, de zoon van Ahitub, te laten roepen, en het hele huis van zijn vader, de priesters die te Nob waren; en zij kwamen allemaal naar de koning.","12":"En Saul zei: Hoor nu, u, zoon van Ahitub! En hij zei: Zie, hier ben ik, mijn heer!","13":"Toen zei Saul tegen hem: Waarom hebt u zich samen tegen mij verbonden, u en de zoon van Isaï, doordat u hem brood en het zwaard gegeven hebt, en God voor hem geraadpleegd hebt, zodat hij tegen mij zou opstaan om een hinderlaag te leggen, zoals het op deze dag is?","14":"En Achimelech antwoordde de koning en zei: Wie is er onder al uw knechten zo trouw als David, en schoonzoon van de koning, en die gaat waar u hem heen zendt, en die eerlijk is in uw huis?","15":"Ben ik vandaag begonnen God voor hem te raadplegen? Dat zij verre van mij, dat de koning zijn knecht iets aanrekent, of het hele huis van mijn vader; want uw knecht heeft van al deze dingen niets geweten, klein of groot.","16":"Doch de koning zei: Achimelech, u moet zeker sterven, u en het hele huis van uw vader.","17":"En de koning zei tegen de lijfwachten die bij hem stonden: Wend u om, en dood de priesters van de HEERE, omdat hun hand ook met David is, en omdat zij geweten hebben dat hij vluchtte, en het mij niet hebben laten horen. Doch de knechten van de koning wilden hun hand niet uitsteken om de priesters van de HEERE aan te vallen.","18":"Toen zei de koning tegen Doeg: Wend u om, en val de priesters aan. Toen wendde Doeg, de Edomiet, zich om, en hij viel de priesters aan, en doodde op die dag vijfentachtig mannen die de linnen priesterrok droegen.","19":"Hij sloeg ook Nob, de stad van deze priesters, met de scherpte van het zwaard, zowel de mannen als de vrouwen, zowel de kinderen als de zuigelingen, zelfs de ossen en ezels en de schapen sloeg hij met de scherpte van het zwaard.","20":"Doch een van de zonen van Achimelech, de zoon van Ahitub, ontkwam; zijn naam was Abjathar; die vluchtte David achterna.","21":"En Abjathar vertelde David dat Saul de priesters van de HEERE gedood had.","22":"Toen zei David tegen Abjathar: Ik wist het al op die dag, toen Doeg, de Edomiet, daar was, dat hij het zeker aan Saul zou vertellen; ik heb er de oorzaak van gegeven tegen alle mensen van het huis van uw vader.","23":"Blijf bij mij; wees niet bang; want wie mijn leven zoekt, die zoekt ook uw leven; maar u zult bij mij veilig zijn."},"SV":{"1":"Toen ging David van daar, en ontkwam in de spelonk van Adullam. En zijn broeders hoorden het, en het ganse huis zijns vaders, en kwamen derwaarts tot hem af.","2":"En tot hem vergaderde alle man, die benauwd was, en alle man, die een schuldeiser had, en alle man, wiens ziel bitterlijk bedroefd was, en hij werd tot overste over hen; zodat bij hem waren omtrent vierhonderd mannen.","3":"En David ging van daar naar Mizpa der Moabieten; en hij zeide tot den koning der Moabieten: Laat toch mijn vader en mijn moeder bij ulieden uitgaan, totdat ik weet, wat God mij doen zal.","4":"En hij bracht hen voor het aangezicht van den koning der Moabieten; en zij bleven bij hem al de dagen, die David in de vesting was.","5":"Doch de profeet Gad zeide tot David: Blijf in de vesting niet, ga heen, en ga in het land van Juda. Toen ging David heen, en hij kwam in het woud Chereth.","6":"En Saul hoorde, dat David bekend geworden was, en de mannen, die bij hem waren. Saul nu zat op een heuvel onder het geboomte te Rama, en hij had zijn spies in zijn hand, en al zijn knechten stonden bij hem.","7":"Toen zeide Saul tot zijn knechten, die bij hem stonden: Hoort toch, gij, zonen van Jemini, zal ook de zoon van Isaï u altegader akkers en wijnbergen geven? Zal hij u allen tot oversten van duizenden, en oversten van honderden stellen?","8":"Dat gij u allen tegen mij verbonden hebt, en niemand *voor* mijn oor openbaart, dat mijn zoon een verbond gemaakt heeft met den zoon van Isaï; en niemand is onder ulieden, dien het wee doet van mijnentwege, en die het *voor* mijn oor openbaart; want mijn zoon heeft mijn knecht tegen mij opgewekt, tot een lagenlegger, gelijk het te dezen dage is.","9":"Toen antwoordde Doeg, de Edomiet, die bij de knechten van Saul stond, en zeide: Ik zag den zoon van Isaï, komende te Nob, tot Achimelech, den zoon van Ahitub;","10":"Die den HEERE voor hem vraagde, en gaf hem teerkost; hij gaf hem ook het zwaard van Goliath, den Filistijn.","11":"Toen zond de koning heen, om den priester Achimelech, den zoon van Ahitub, te roepen, en zijns vaders ganse huis, de priesters, die te Nob waren; en zij kwamen allen tot den koning.","12":"En Saul zeide: Hoor nu, gij, zoon van Ahitub! En hij zeide: Zie, *hier* ben ik, mijn heer!","13":"Toen zeide Saul tot hem: Waarom hebt gijlieden samen u tegen mij verbonden, gij en de zoon van Isaï, mits dat gij hem gegeven hebt brood en het zwaard, en God voor hem gevraagd, dat hij zou opstaan tegen mij tot een lagenlegger, gelijk het te dezen dage is?","14":"En Achimelech antwoordde den koning en zeide: Wie is toch onder al uw knechten getrouw als David, en des konings schoonzoon, en voortgaande in uw gehoorzaamheid, en is eerlijk in uw huis?","15":"Heb ik heden begonnen God voor hem te vragen? Dat zij verre van mij, de koning legge op zijn knecht geen ding, *noch* op het ganse huis mijns vader; want uw knecht heeft van al deze dingen niet geweten, klein noch groot.","16":"Doch de koning zeide: Achimelech, gij moet den dood sterven, gij en het ganse huis uws vaders.","17":"En de koning zeide tot de trawanten, die bij hem stonden: Wendt u, en doodt de priesters des HEEREN, omdat hun hand ook met David is, en omdat zij geweten hebben, dat hij vluchtte, en hebben het voor mijn oren niet geopenbaard. Doch de knechten des konings wilden hun hand niet uitsteken, om op de priesters des HEEREN aan te vallen.","18":"Toen zeide de koning tot Doeg: Wend gij u, en val aan op de priesters. Toen wendde zich Doeg, de Edomiet, en hij viel aan op de priesters, en doodde te dien dage vijf en tachtig mannen, die den linnen lijfrok droegen.","19":"Hij sloeg ook Nob, de stad dezer priesters, met de scherpte des zwaards, van den man tot de vrouw, van de kinderen tot de zuigelingen, zelfs de ossen en ezels, en de schapen, *sloeg* *hij* met de scherpte des zwaards.","20":"Doch een der zonen van Achimelech, den zoon van Ahitub, ontkwam, wiens naam was Abjathar; die vluchtte David na.","21":"En Abjathar boodschapte het David, dat Saul de priesteren des HEEREN gedood had.","22":"Toen zeide David tot Abjathar: Ik wist wel te dien dage, toen Doeg, de Edomiet, daar was, dat hij het voorzeker Saul zou te kennen geven; ik heb oorzaak gegeven tegen al de zielen van uws vaders huis.","23":"Blijf bij mij; vrees niet; want wie mijn ziel zoeken zal, die zal uw ziel zoeken; maar gij zult met mij in bewaring zijn."},"KJV":{"1":"David therefore departed thence, and escaped to the cave Adullam: and when his brethren and all his father's house heard it, they went down thither to him.","2":"And every one that was in distress, and every one that was in debt, and every one that was discontented, gathered themselves unto him; and he became a captain over them: and there were with him about four hundred men.","3":"And David went thence to Mizpeh of Moab: and he said unto the king of Moab, Let my father and my mother, I pray thee, come forth, and be with you, till I know what God will do for me.","4":"And he brought them before the king of Moab: and they dwelt with him all the while that David was in the hold.","5":"And the prophet Gad said unto David, Abide not in the hold; depart, and get thee into the land of Judah. Then David departed, and came into the forest of Hareth.","6":"When Saul heard that David was discovered, and the men that were with him, (now Saul abode in Gibeah under a tree in Ramah, having his spear in his hand, and all his servants were standing about him;)","7":"Then Saul said unto his servants that stood about him, Hear now, ye Benjamites; will the son of Jesse give every one of you fields and vineyards, and make you all captains of thousands, and captains of hundreds;","8":"That all of you have conspired against me, and there is none that sheweth me that my son hath made a league with the son of Jesse, and there is none of you that is sorry for me, or sheweth unto me that my son hath stirred up my servant against me, to lie in wait, as at this day?","9":"Then answered Doeg the Edomite, which was set over the servants of Saul, and said, I saw the son of Jesse coming to Nob, to Ahimelech the son of Ahitub.","10":"And he enquired of the LORD for him, and gave him victuals, and gave him the sword of Goliath the Philistine.","11":"Then the king sent to call Ahimelech the priest, the son of Ahitub, and all his father's house, the priests that were in Nob: and they came all of them to the king.","12":"And Saul said, Hear now, thou son of Ahitub. And he answered, Here I am, my lord.","13":"And Saul said unto him, Why have ye conspired against me, thou and the son of Jesse, in that thou hast given him bread, and a sword, and hast enquired of God for him, that he should rise against me, to lie in wait, as at this day?","14":"Then Ahimelech answered the king, and said, And who is so faithful among all thy servants as David, which is the king's son in law, and goeth at thy bidding, and is honourable in thine house?","15":"Did I then begin to enquire of God for him? be it far from me: let not the king impute any thing unto his servant, nor to all the house of my father: for thy servant knew nothing of all this, less or more.","16":"And the king said, Thou shalt surely die, Ahimelech, thou, and all thy father's house.","17":"And the king said unto the footmen that stood about him, Turn, and slay the priests of the LORD; because their hand also is with David, and because they knew when he fled, and did not shew it to me. But the servants of the king would not put forth their hand to fall upon the priests of the LORD.","18":"And the king said to Doeg, Turn thou, and fall upon the priests. And Doeg the Edomite turned, and he fell upon the priests, and slew on that day fourscore and five persons that did wear a linen ephod.","19":"And Nob, the city of the priests, smote he with the edge of the sword, both men and women, children and sucklings, and oxen, and asses, and sheep, with the edge of the sword.","20":"And one of the sons of Ahimelech the son of Ahitub, named Abiathar, escaped, and fled after David.","21":"And Abiathar shewed David that Saul had slain the LORD'S priests.","22":"And David said unto Abiathar, I knew it that day, when Doeg the Edomite was there, that he would surely tell Saul: I have occasioned the death of all the persons of thy father's house.","23":"Abide thou with me, fear not: for he that seeketh my life seeketh thy life: but with me thou shalt be in safeguard."}},"tsk":{"1":[{"kopje":"David","refs":["1 Sam 21:10-15","Ps 34:2","Ps 57:2"]},{"kopje":"de spelonk","refs":["Joz 12:15","Joz 15:35","2 Sam 23:13","2 Sam 23:14","1 Kron 11:15","Ps 142:2","Micha 1:3","Micha 1:15","Hebr 11:38"]}],"2":[{"kopje":"benauwd waren","refs":["Richt 11:3","Matt 11:12","Matt 11:28"]},{"kopje":"een schuldeiser hadden","refs":["Matt 18:25-34"]},{"kopje":"bitter bedroefd was","refs":["1 Sam 1:10","1 Sam 30:6","Richt 18:25","2 Sam 17:8","Spr 31:6"]},{"kopje":"aanvoerder","refs":["1 Sam 9:16","1 Sam 25:15","1 Sam 25:16","1 Sam 30:22-24","2 Sam 5:2","2 Kon 20:5","1 Kron 11:15-19","Ps 72:12-14","Matt 9:12","Matt 9:13","Hebr 2:10"]}],"3":[{"kopje":"Mizpa","refs":["Richt 11:29"]},{"kopje":"de koning","refs":["1 Sam 14:47","Ruth 1:1-4","Ruth 4:10","Ruth 4:17"]},{"kopje":"Laat toch mijn vader","refs":["Gen 47:11","Ex 20:12","Matt 15:4-6","1 Tim 5:4"]},{"kopje":"totdat ik weet","refs":["1 Sam 3:18","2 Sam 15:25","2 Sam 15:26","Fil 2:23","Fil 2:24"]}],"4":[{"kopje":"in de vesting","refs":["2 Sam 23:13","2 Sam 23:14","1 Kron 12:16","2 Sam 24:11","1 Kron 21:9","1 Kron 29:29","2 Kron 29:25","1 Sam 23:1-6","Neh 6:11","Ps 11:1","Jes 8:12-14","Matt 10:23"]}],"6":[{"kopje":"speer","refs":["1 Sam 18:10","1 Sam 19:9","1 Sam 20:33"]}],"7":[{"kopje":"de zoon van Isaï","refs":["1 Sam 22:9","1 Sam 22:13","1 Sam 18:14","1 Sam 20:27","1 Sam 20:30","1 Sam 25:10","2 Sam 20:1","1 Kon 12:16","Jes 11:1","Jes 11:10"]},{"kopje":"geven","refs":["1 Sam 8:14","1 Sam 8:15"]},{"kopje":"aanvoerders","refs":["1 Sam 8:11","1 Sam 8:12"]}],"8":[{"kopje":"laat het mij horen","refs":["1 Sam 20:2","Job 33:16"]},{"kopje":"dat mijn zoon","refs":["1 Sam 18:3","1 Sam 20:8","1 Sam 20:13-17","1 Sam 20:30-34","1 Sam 20:42","1 Sa // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
function kopieerVers(n) {
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
}
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  kopieerVers(k.dataset.n);
});
// rechtermuisklik op een vers kopieert het (in plaats van het browser-contextmenu)
document.addEventListener('contextmenu', e => {
  const rij = e.target.closest('.vers');
  if (!rij || !rij.id.startsWith('v')) return;
  const n = rij.id.slice(1);
  if (!D.vertalingen.SVnu[n]) return;
  e.preventDefault();
  kopieerVers(n);
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

function concordantieHtml(data) {

      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url}) (SVnu)`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
