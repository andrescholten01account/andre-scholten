l waar Saul hem zond; hij gedroeg zich voorzichtig, en Saul stelde hem aan over de krijgslieden; en hij was aangenaam in de ogen van het hele volk, en ook in de ogen van de knechten van Saul.","6":"Het gebeurde nu, toen zij kwamen, en David terugkeerde van het verslaan van de Filistijn, dat de vrouwen uit al de steden van Israël uitgingen, met gezang en reidansen, koning Saul tegemoet, met tamboerijnen, met vreugde en met muziekinstrumenten.","7":"En de vrouwen, spelend, antwoordden elkaar en zeiden: Saul heeft zijn duizenden verslagen, maar David zijn tienduizenden!","8":"Toen ontstak Saul in grote woede, en dat woord was kwaad in zijn ogen, en hij zei: Zij hebben David tienduizend gegeven, doch mij hebben zij maar duizend gegeven; en zeker zal het koninkrijk nog voor hem zijn.","9":"En Saul had het oog op David, van die dag af en voortaan.","10":"En het gebeurde de volgende dag, dat de boze geest van God vaardig werd over Saul, en hij profeteerde midden in het huis, en David speelde snarenspel met zijn hand, zoals van dag tot dag; Saul nu had een speer in zijn hand.","11":"En Saul wierp de speer, en zei: Ik zal David aan de wand spietsen; maar David week tweemaal voor hem opzij.","12":"En Saul vreesde voor David, want de HEERE was met hem, en Hij was van Saul geweken.","13":"Daarom stuurde Saul hem van zich weg, en hij stelde hem aan tot leider van duizend; en hij ging uit en hij ging in voor het aangezicht van het volk.","14":"En David gedroeg zich voorzichtig op al zijn wegen; en de HEERE was met hem.","15":"Toen Saul nu zag dat hij zich zeer voorzichtig gedroeg, vreesde hij voor zijn aangezicht.","16":"Doch heel Israël en Juda had David lief; want hij ging uit en hij ging in voor hun aangezicht.","17":"Daarom zei Saul tegen David: Zie, mijn oudste dochter Merab zal ik u tot vrouw geven; alleen, wees mij een dapper man en voer de oorlogen van de HEERE. Want Saul zei: Laat mijn hand niet tegen hem zijn, maar laat de hand van de Filistijnen tegen hem zijn.","18":"Doch David zei tegen Saul: Wie ben ik, en wat is mijn leven, en het huisgezin van mijn vader in Israël, dat ik de schoonzoon van de koning zou worden?","19":"Het gebeurde nu ten tijde dat men Merab, de dochter van Saul, aan David geven zou, dat zij aan Adriël, de Meholathiet, tot vrouw werd gegeven.","20":"Doch Michal, de dochter van Saul, had David lief. Toen dat Saul te kennen werd gegeven, was die zaak goed in zijn ogen.","21":"En Saul zei: Ik zal haar hem geven, zodat zij hem tot een valstrik is, en zodat de hand van de Filistijnen tegen hem is. Daarom zei Saul tegen David: Met de andere zult u vandaag mijn schoonzoon worden.","22":"En Saul gebood zijn knechten: Spreek in het geheim met David en zeg: Zie, de koning heeft welgevallen aan u, en al zijn knechten hebben u lief; word dan nu de schoonzoon van de koning.","23":"En de knechten van Saul spraken deze woorden ten aanhoren van David. Toen zei David: Is dat licht in uw ogen, de schoonzoon van de koning te worden, terwijl ik een arm en gering man ben?","24":"En de knechten van Saul boodschapten het hem en zeiden: Zulke woorden heeft David gesproken.","25":"Toen zei Saul: Zo zult u tegen David zeggen: De koning heeft geen behoefte aan een bruidsschat, maar aan honderd voorhuiden van de Filistijnen, opdat men zich wreekt op de vijanden van de koning. Want Saul dacht David te doen vallen door de hand van de Filistijnen.","26":"Zijn knechten nu boodschapten David deze woorden. En die zaak was goed in de ogen van David, dat hij de schoonzoon van de koning zou worden; maar de dagen waren nog niet vervuld.","27":"Toen maakte David zich op, en hij en zijn mannen gingen heen, en zij sloegen onder de Filistijnen tweehonderd man, en David bracht hun voorhuiden, en men leverde ze de koning volkomen, opdat hij schoonzoon van de koning zou worden. Toen gaf Saul hem zijn dochter Michal tot vrouw.","28":"En Saul zag en merkte dat de HEERE met David was; en Michal, de dochter van Saul, had hem lief.","29":"Toen vreesde Saul nog meer voor David; en Saul was David een vijand al zijn dagen.","30":"Als de vorsten van de Filistijnen uittrokken, gebeurde het, zo dikwijls als zij uittrokken, dat David verstandiger was dan al de knechten van Saul; zodat zijn naam zeer geacht werd."},"SV":{"1":"Het geschiedde nu, als hij geëindigd had tot Saul te spreken, dat de ziel van Jonathan verbonden werd aan de ziel van David; en Jonathan beminde hem als zijn ziel.","2":"En Saul nam hem te dien dage, en liet hem niet werderkeren tot zijns vaders huis.","3":"Jonathan nu en David maakten een verbond, dewijl hij hem liefhad als zijn ziel.","4":"En Jonathan deed zijn mantel af, dien hij aan had, en gaf hem aan David, ook zijn klederen, ja, tot zijn zwaard toe, en tot zijn boog toe, en tot zijn gordel toe.","5":"En David toog uit, overal, waar Saul hem zond; hij gedroeg zich voorzichtiglijk, en Saul zette hem over de krijgslieden; en hij was aangenaam in de ogen des gansen volks, en ook in de ogen der knechten van Saul.","6":"Het geschiedde nu, toen zij kwamen, en David wederkeerde van het slaan der Filistijnen, dat de vrouwen uitgingen uit al de steden van Israël, met gezang en reien, den koning Saul tegemoet, met trommelen, met vreugde en met muziekinstrumenten.","7":"En de vrouwen, spelende, antwoordden *elkander* en zeiden: Saul heeft zijn duizenden verslagen, maar David zijn tienduizenden!","8":"Toen ontstak Saul zeer, en dat woord was kwaad in zijn ogen, en hij zeide: Zij hebben David tien duizend gegeven, doch mij hebben zij *maar* duizend gegeven; en voorzeker zal het koninkrijk nog voor hem zijn.","9":"En Saul had het oog op David, van dien dag af en voortaan.","10":"En het geschiedde des anderen daags, dat de boze geest Gods over Saul vaardig werd, en hij profeteerde midden in het huis, en David speelde op snarenspel met zijn hand, als van dag tot dag; Saul nu had een spies in zijn hand.","11":"En Saul schoot de spies, en zeide: Ik zal David aan den wand spitten; maar David wendde zich tweemaal van zijn aangezicht af.","12":"En Saul vreesde voor David, want de HEERE was met hem, en Hij was van Saul geweken.","13":"Daarom deed hem Saul van zich weg, en hij zette hem zich tot een overste van duizend; en hij ging uit en hij ging in voor het aangezicht des volks.","14":"En David gedroeg zich voorzichtiglijk op al zijn wegen; en de HEERE was met hem.","15":"Toen nu Saul zag, dat hij zich zeer voorzichtiglijk gedroeg, vreesde hij voor zijn aangezicht.","16":"Doch gans Israël en Juda had David lief; want hij ging uit en hij ging in voor hun aangezicht.","17":"Derhalve zeide Saul tot David: Zie, mijn grootste dochter Merab zal ik u tot een vrouw geven; alleenlijk, wees mij een dapper zoon, en voer den krijg des HEEREN. Want Saul zeide: Dat mijn hand niet tegen hem zij, maar dat de hand der Filistijnen tegen hem zij.","18":"Doch David zeide tot Saul: Wie ben ik, en wat is mijn leven, *en* mijns vaders huisgezin in Israël, dat ik des konings schoonzoon zou worden?","19":"Het geschiedde nu ten tijde als men Merab, de dochter van Saul, aan David geven zou, zo is zij aan Adriël, den Meholathiet, ter vrouw gegeven.","20":"Doch Michal, de dochter van Saul, had David lief. Toen dat Saul te kennen werd gegeven, zo was die zaak recht in zijn ogen.","21":"En Saul zeide: Ik zal haar hem geven, dat zij hem tot een valstrik zij, en dat de hand der Filistijnen tegen hem zij. Daarom zeide Saul tot David: Met de andere zult gij heden mijn schoonzoon worden.","22":"En Saul gebood zijn knechten: Spreekt met David in het heimelijke, zeggende: Zie, de koning heeft lust aan u, en al zijn knechten hebben u lief; word dan nu des konings schoonzoon.","23":"En de knechten van Saul spraken deze woorden voor de oren van David. Toen zeide David: Is dat licht in ulieder ogen, des konings schoonzoon te worden, daar ik een arm en verachtzaam man ben?","24":"En de knechten van Saul boodschapten het hem, zeggende: Zulke woorden heeft David gesproken.","25":"Toen zeide Saul: Aldus zult gijlieden tot David zeggen: De koning heeft geen lust aan den bruidschat, maar aan honderd voorhuiden der Filistijnen, opdat men zich wreke aan des konings vijanden. Want Saul dacht David te vellen door de hand der Filistijnen.","26":"Zijn knechten nu boodschapten David deze woorden. En die zaak was recht in de ogen van David, dat hij des konings schoonzoon zou worden; maar de dagen waren nog niet vervuld.","27":"Toen maakte zich David op, en hij en zijn mannen gingen heen, en zij sloegen onder de Filistijnen tweehonderd mannen, en David bracht hun voorhuiden, en men leverde ze den koning volkomenlijk, opdat hij schoonzoon des konings worden zou. Toen gaf Saul hem zijn dochter Michal ter vrouw.","28":"En Saul zag en merkte, dat de HEERE met David was; en Michal, de dochter van Saul, had hem lief.","29":"Toen vreesde zich Saul nog meer voor David; en Saul was David een vijand al *zijn* dagen.","30":"Als de vorsten der Filistijnen uittogen, zo geschiedde het, als zij uittogen, dat David kloeker was, dan al de knechten van Saul; zodat zijn naam zeer geacht was."},"KJV":{"1":"And it came to pass, when he had made an end of speaking unto Saul, that the soul of Jonathan was knit with the soul of David, and Jonathan loved him as his own soul.","2":"And Saul took him that day, and would let him go no more home to his father's house.","3":"Then Jonathan and David made a covenant, because he loved him as his own soul.","4":"And Jonathan stripped himself of the robe that was upon him, and gave it to David, and his garments, even to his sword, and to his bow, and to his girdle.","5":"And David went out whithersoever Saul sent him, and behaved himself wisely: and Saul set him over the men of war, and he was accepted in the sight of all the people, and also in the sight of Saul's servants.","6":"And it came to pass as they came, when David was returned from the slaughter of the Philistine, that the women came out of all cities of Israel, singing and dancing, to meet king Saul, with tabrets, with joy, and with instruments of musick.","7":"And the women answered one another as they played, and said, Saul hath slain his thousands, and David his ten thousands.","8":"And Saul was very wroth, and the saying displeased him; and he said, They have ascribed unto David ten thousands, and to me they have ascribed but thousands: and what can he have more but the kingdom?","9":"And Saul eyed David from that day and forward.","10":"And it came to pass on the morrow, that the evil spirit from God came upon Saul, and he prophesied in the midst of the house: and David played with his hand, as at other times: and there was a javelin in Saul's hand.","11":"And Saul cast the javelin; for he said, I will smite David even to the wall with it. And David avoided out of his presence twice.","12":"And Saul was afraid of David, because the LORD was with him, and was departed from Saul.","13":"Therefore Saul removed him from him, and made him his captain over a thousand; and he went out and came in before the people.","14":"And David behaved himself wisely in all his ways; and the LORD was with him.","15":"Wherefore when Saul saw that he behaved ➔ himself very wisely, he was afraid of him.","16":"But all Israel and Judah loved David, because he went out and came in before them.","17":"And Saul said to David, Behold my elder daughter Merab, her will I give thee to wife: only be thou valiant for me, and fight the LORD'S battles. For Saul said, Let not mine hand be upon him, but let the hand of the Philistines be upon him.","18":"And David said unto Saul, Who am I? and what is my life, or my father's family in Israel, that I should be son in law to the king?","19":"But it came to pass at the time when Merab Saul's daughter should have been given to David, that she was given unto Adriel the Meholathite to wife.","20":"And Michal Saul's daughter loved David: and they told Saul, and the thing pleased him.","21":"And Saul said, I will give him her, that she may be a snare to him, and that the hand of the Philistines may be against him. Wherefore Saul said to David, Thou shalt this day be my son in law in the one of the twain.","22":"And Saul commanded his servants, saying, Commune with David secretly, and say, Behold, the king hath delight in thee, and all his servants love thee: now therefore be the king's son in law.","23":"And Saul's servants spake those words in the ears of David. And David said, Seemeth it to you a light thing to be a king's son in law, seeing that I am a poor man, and lightly esteemed?","24":"And the servants of Saul told him, saying, On this manner spake David.","25":"And Saul said, Thus shall ye say to David, The king desireth not any dowry, but an hundred foreskins of the Philistines, to be avenged of the king's enemies. But Saul thought to make David fall by the hand of the Philistines.","26":"And when his servants told David these words, it pleased David well to be the king's son in law: and the days were not expired.","27":"Wherefore David arose and went, he and his men, and slew of the Philistines two hundred men; and David brought their foreskins, and they gave them in full tale to the king, that he might be the king's son in law. And Saul gave him Michal his daughter to wife.","28":"And Saul saw and knew that the LORD was with David, and that Michal Saul's daughter loved him.","29":"And Saul was yet the more afraid of David; and Saul became David's enemy continually.","30":"Then the princes of the Philistines went forth: and it came to pass, after they went forth, that David behaved himself more wisely than all the servants of Saul; so that his name was much set by."}},"tsk":{"1":[{"kopje":"de ziel van Jonathan","refs":["1 Sam 14:1-14","1 Sam 14:45","Gen 44:30","Richt 20:11","1 Kron 12:17","Ps 86:11","Kol 2:2"]},{"kopje":"had hem lief","refs":["1 Sam 18:3","1 Sam 19:2","1 Sam 20:17","Deut 13:6","2 Sam 1:26","Spr 18:24"]}],"2":[{"kopje":"nam hem","refs":["1 Sam 16:21-23","1 Sam 17:15"]}],"3":[{"kopje":"maakten een verbond e=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> him that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> and would <span class=\"wl wl-kjv\" data-code=\"H5414\">let</span> him go no more <span class=\"wl wl-kjv\" data-code=\"H7725\">home</span> to his <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house.</span>","3":"Then <span class=\"wl wl-kjv\" data-code=\"H3083\">Jonathan</span> and <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H3772\">made</span> a <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant,</span> because he <span class=\"wl wl-kjv\" data-code=\"H160\">loved</span> him as his own <span class=\"wl wl-kjv\" data-code=\"H5315\">soul.</span>","4":"And <span class=\"wl wl-kjv\" data-code=\"H3083\">Jonathan</span> <span class=\"wl wl-kjv\" data-code=\"H6584\">stripped</span> himself of the <span class=\"wl wl-kjv\" data-code=\"H4598\">robe</span> that was upon him, and <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> it to <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> and his <span class=\"wl wl-kjv\" data-code=\"H4055\">garments,</span> even to his <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> and to his <span class=\"wl wl-kjv\" data-code=\"H7198\">bow,</span> and to his <span class=\"wl wl-kjv\" data-code=\"H2289\">girdle.</span>","5":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> whithersoever <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> him, and behaved himself <span class=\"wl wl-kjv\" data-code=\"H7919\">wisely:</span> and <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> him over the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H4421\">war,</span> and he was <span class=\"wl wl-kjv\" data-code=\"H3190\">accepted</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and also in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul's</span> <span class=\"wl wl-kjv\" data-code=\"H5650\">servants.</span>","6":"And it came to pass as they <span class=\"wl wl-kjv\" data-code=\"H935\">came,</span> when <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> was <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> from the <span class=\"wl wl-kjv\" data-code=\"H5221\">slaughter</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine,</span> that the <span class=\"wl wl-kjv\" data-code=\"H802\">women</span> came <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of all <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H7891\">singing</span> and <span class=\"wl wl-kjv\" data-code=\"H4246\">dancing,</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> with <span class=\"wl wl-kjv\" data-code=\"H8596\">tabrets,</span> with <span class=\"wl wl-kjv\" data-code=\"H8057\">joy,</span> and with <span class=\"wl wl-kjv\" data-code=\"H7991\">instruments</span> of musick.","7":"And the <span class=\"wl wl-kjv\" data-code=\"H802\">women</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> one another as they <span class=\"wl wl-kjv\" data-code=\"H7832\">played,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> hath <span class=\"wl wl-kjv\" data-code=\"H5221\">slain</span> his <span class=\"wl wl-kjv\" data-code=\"H505\">thousands,</span> and <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> his ten <span class=\"wl wl-kjv\" data-code=\"H7233\">thousands.</span>","8":"And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> was <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H2734\">wroth,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1697\">saying</span> <span class=\"wl wl-kjv\" data-code=\"H3415\">displeased</span> him; and he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> They have <span class=\"wl wl-kjv\" data-code=\"H5414\">ascribed</span> unto <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> ten <span class=\"wl wl-kjv\" data-code=\"H7233\">thousands,</span> and to me they have <span class=\"wl wl-kjv\" data-code=\"H5414\">ascribed</span> but <span class=\"wl wl-kjv\" data-code=\"H505\">thousands:</span> and what can he have more but the <span class=\"wl wl-kjv\" data-code=\"H4410\">kingdom?</span>","9":"And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H5770\">eyed</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> from that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> and <span class=\"wl wl-kjv\" data-code=\"H1973\">forward.</span>","10":"And it came to pass on the <span class=\"wl wl-kjv\" data-code=\"H4283\">morrow,</span> that the <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> from <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H6743\">came</span> upon <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> and he <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesied</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house:</span> and <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H5059\">played</span> with his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> as at other <span class=\"wl wl-kjv\" data-code=\"H3117\">times:</span> and there was a <span class=\"wl wl-kjv\" data-code=\"H2595\">javelin</span> in <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul's</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hand.</span>","11":"And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H2904\">cast</span> the <span class=\"wl wl-kjv\" data-code=\"H2595\">javelin;</span> for he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> even to the <span class=\"wl wl-kjv\" data-code=\"H7023\">wall</span> with it. And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> avoided <span class=\"wl wl-kjv\" data-code=\"H5437\">out</span> of his <span class=\"wl wl-kjv\" data-code=\"H6440\">presence</span> <span class=\"wl wl-kjv\" data-code=\"H6471\">twice.</span>","12":"And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> was <span class=\"wl wl-kjv\" data-code=\"H3372\">afraid</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">of</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> because the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was with him, and was <span class=\"wl wl-kjv\" data-code=\"H5493\">departed</span> from <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul.</span>","13":"Therefore <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H5493\">removed</span> him from him, and <span class=\"wl wl-kjv\" data-code=\"H7760\">made</span> him his <span class=\"wl wl-kjv\" data-code=\"H8269\">captain</span> over a <span class=\"wl wl-kjv\" data-code=\"H505\">thousand;</span> and he went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> and came <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people.</span>","14":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> behaved himself <span class=\"wl wl-kjv\" data-code=\"H7919\">wisely</span> in all his <span class=\"wl wl-kjv\" data-code=\"H1870\">ways;</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was with him.","15":"Wherefore when <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that he <span class=\"wl wl-kjv\" data-code=\"H7919\">behaved</span> ➔ himself <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H7919\">wisely,</span> he was <span class=\"wl wl-kjv\" data-code=\"H1481\">afraid</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">of</span> him.","16":"But all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> and <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> <span class=\"wl wl-kjv\" data-code=\"H157\">loved</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> because he went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> and came <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> them.","17":"And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> Behold my <span class=\"wl wl-kjv\" data-code=\"H1419\">elder</span> <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> <span class=\"wl wl-kjv\" data-code=\"H4764\">Merab,</span> her will I <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thee to <span class=\"wl wl-kjv\" data-code=\"H802\">wife:</span> only be thou <span class=\"wl wl-kjv\" data-code=\"H1121\">valiant</span> for me, and <span class=\"wl wl-kjv\" data-code=\"H3898\">fight</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S</span> <span class=\"wl wl-kjv\" data-code=\"H4421\">battles.</span> For <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Let not mine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> be upon him, but let the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> be upon him.","18":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> Who am I? and what is my <span class=\"wl wl-kjv\" data-code=\"H2416\">life,</span> or my <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H4940\">family</span> in <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> that I should be son in <span class=\"wl wl-kjv\" data-code=\"H2860\">law</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king?</span>","19":"But it came to pass at the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> when <span class=\"wl wl-kjv\" data-code=\"H4764\">Merab</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul's</span> <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> should have been <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> to <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> that she was <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> unto <span class=\"wl wl-kjv\" data-code=\"H5741\">Adriel</span> the <span class=\"wl wl-kjv\" data-code=\"H4259\">Meholathite</span> to <span class=\"wl wl-kjv\" data-code=\"H802\">wife.</span>","20":"And <span class=\"wl wl-kjv\" data-code=\"H4324\">Michal</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul's</span> <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> <span class=\"wl wl-kjv\" data-code=\"H157\">loved</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David:</span> and they <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> <span class=\"wl wl-kjv\" data-code=\"H3474\">pleased</span> him.","21":"And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> him her, that she may be a <span class=\"wl wl-kjv\" data-code=\"H4170\">snare</span> to him, and that the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> may be against him. Wherefore <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> Thou shalt this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> be my son in <span class=\"wl wl-kjv\" data-code=\"H2859\">law</span> in the one of the <span class=\"wl wl-kjv\" data-code=\"H8147\">twain.</span>","22":"And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> saying, <span class=\"wl wl-kjv\" data-code=\"H1696\">Commune</span> with <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H3909\">secretly,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Behold, the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> hath <span class=\"wl wl-kjv\" data-code=\"H2654\">delight</span> in thee, and all his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> <span class=\"wl wl-kjv\" data-code=\"H157\">love</span> thee: now therefore be the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> son in <span class=\"wl wl-kjv\" data-code=\"H2859\">law.</span>","23":"And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul's</span> <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> those <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> in the <span class=\"wl wl-kjv\" data-code=\"H241\">ears</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David.</span> And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H5869\">Seemeth</span> it to you a <span class=\"wl wl-kjv\" data-code=\"H7043\">light</span> thing to be a <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> son in <span class=\"wl wl-kjv\" data-code=\"H2859\">law,</span> seeing that I am a <span class=\"wl wl-kjv\" data-code=\"H7326\">poor</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> and lightly <span class=\"wl wl-kjv\" data-code=\"H7034\">esteemed?</span>","24":"And the <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> of <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> him, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> On this <span class=\"wl wl-kjv\" data-code=\"H1697\">manner</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David.</span>","25":"And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Thus shall ye <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> to <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> The <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H2656\">desireth</span> not any <span class=\"wl wl-kjv\" data-code=\"H4119\">dowry,</span> but an <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H6190\">foreskins</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines,</span> to be <span class=\"wl wl-kjv\" data-code=\"H5358\">avenged</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H341\">enemies.</span> But <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H2803\">thought</span> to make <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> by the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines.</span>","26":"And when his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> these <span class=\"wl wl-kjv\" data-code=\"H1697\">words,</span> it <span class=\"wl wl-kjv\" data-code=\"H3474\">pleased</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> well to be the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> son in <span class=\"wl wl-kjv\" data-code=\"H2859\">law:</span> and the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> were not <span class=\"wl wl-kjv\" data-code=\"H4390\">expired.</span>","27":"Wherefore <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">arose</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">went,</span> he and his <span class=\"wl wl-kjv\" data-code=\"H582\">men,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">slew</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> two <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men;</span> and <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> their <span class=\"wl wl-kjv\" data-code=\"H6190\">foreskins,</span> and they gave them in full <span class=\"wl wl-kjv\" data-code=\"H4390\">tale</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> that he might be the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> son in <span class=\"wl wl-kjv\" data-code=\"H2859\">law.</span> And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> him <span class=\"wl wl-kjv\" data-code=\"H4324\">Michal</span> his <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> to <span class=\"wl wl-kjv\" data-code=\"H802\">wife.</span>","28":"And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> and <span class=\"wl wl-kjv\" data-code=\"H3045\">knew</span> that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was with <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> and that <span class=\"wl wl-kjv\" data-code=\"H4324\">Michal</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul's</span> <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> <span class=\"wl wl-kjv\" data-code=\"H157\">loved</span> him.","29":"And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> was yet the <span class=\"wl wl-kjv\" data-code=\"H3254\">more</span> <span class=\"wl wl-kjv\" data-code=\"H3372\">afraid</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">of</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David;</span> and <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> became <span class=\"wl wl-kjv\" data-code=\"H1732\">David's</span> <span class=\"wl wl-kjv\" data-code=\"H341\">enemy</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">continually.</span>","30":"Then the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">forth:</span> and it came to pass, <span class=\"wl wl-kjv\" data-code=\"H1767\">after</span> they went <span class=\"wl wl-kjv\" data-code=\"H3318\">forth,</span> that <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> behaved himself more <span class=\"wl wl-kjv\" data-code=\"H7919\">wisely</span> than all the <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> of <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul;</span> so that his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> was <span class=\"wl wl-kjv\" data-code=\"H3966\">much</span> set <span class=\"wl wl-kjv\" data-code=\"H3365\">by.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"hij geëindigd had","tekst":"Te weten, David."},{"catchword":"dat de ziel van Jónathan","tekst":"Zie de aantekeningen Gen 44:30."},{"catchword":"als zijn ziel","tekst":"Dat is, zichzelven."}],"2":[{"catchword":"Saul nam hem te dien dage,","tekst":"Boven, 1Sa 16:19 wordt gezegd dat Saul David bij zich genomen heeft, opdat hij voor hem op de harp spelen zou, en toen ging hij af en aan; boven, 1Sa 17:15. Nu wordt hier gezegd dat Saul David tot zich genomen heeft, te weten, om hem in den krijg te gebruiken, als een van zijn oversten, vs.5, en derhalve moest hij steeds aan het hof blijven."}],"4":[{"catchword":"dien hij aan had,","tekst":"Hebreeuws, die op hen was"},{"catchword":"zijn klederen,","tekst":"Versta dit van de krijgsklederen."}],"5":[{"catchword":"aangenaam","tekst":"Hebreeuws, goed."}],"6":[{"catchword":"zij kwamen,","tekst":"Te weten, Saul met zijn krijgsvolk."},{"catchword":"der Filistijnen,","tekst":"Hebreeuws, des Filistijns; waaronder men verstaan kan den reus Goliath vooreerst, en daarna het leger der Filistijnen in het algemeen."},{"catchword":"met vreugde","tekst":"Zie dergelijke exempelen Exo 15:20-21; Jdg 11:34."},{"catchword":"muziekinstrumenten","tekst":"Het instrument, dat hier in het Hebreeuws genoemd wordt, is ons heden ten dage onbekend, doch het schijnt dat het een instrument met drie snaren geweest is."}],"7":[{"catchword":"zijn duizenden verslagen,","tekst":"Dat is, vele."},{"catchword":"zijn tienduizenden","tekst":"Dat is, tienmaal zoveel als Saul."}],"9":[{"catchword":"had het oog op David,","tekst":"Hebreeuws, oogde David; dat is, hij loerde op hem, en bespiedde alle gelegenheid om hem te doden; of hij zag hem van dien tijd af met kwade ogen aan, en hij was hem vijand, vs.29."}],"10":[{"catchword":"boze geest Gods","tekst":"Zie boven, 1Sa 16:15."},{"catchword":"profeteerde midden in het huis,","tekst":"De zin is dat Saul, van den bozen geest gekweld wordende, als in verrukking van zinnen viel en vreemde gebaren betoonde. Vergelijk 1Ki 18:29 met de aantekeningen."},{"catchword":"speelde op snarenspel met zijn hand,","tekst":"Te weten, om Saul van de onrust en kwelling des bozen ggestes te verlichten, en hem in zijn melancholie eerst aan het hof geroepen, boven, 1Sa 16:16."}],"11":[{"catchword":"zeide","tekst":"Dat is, hij dacht bij zichzelven. Want het is niet te vermoeden dat hij dit overluid gesproken heeft. Zie dergelijke onder, vs.17, 21."},{"catchword":"Ik zal David aan den wand spitten;","tekst":"Hebreeuws, ik zal in David en in den wand slaan."}],"12":[{"catchword":"vreesde voor David,","tekst":"Saul vreesde dat het volk en de krijgslieden, die David liefhadden, David tot koning kiezen zouden, vs.8."}],"13":[{"catchword":"hij zette hem","tekst":"Niet uit gunst hem dezen staat gevende, maar op hoop dat hij in de handen der vijanden vallen en doodgeslagen zou worden. Zie vs.17, 25."},{"catchword":"ging uit en hij ging in","tekst":"Dat is, hij leidde het volk aan den vijand en van den vijand, gelijk zulks een kloeken overste betaamde. Alzo ook onder, vs.16."}],"15":[{"catchword":"vreesde hij voor zijn aangezicht","tekst":"Zie hiervan de oorzaak boven, vs.8."}],"16":[{"catchword":"gans Israël","tekst":"Versta de elf stammen."},{"catchword":"Juda had David lief;","tekst":"Dat is de stam van Juda."}],"17":[{"catchword":"mijn grootste dochter Merab","tekst":"Omdat Saul David niet openlijk durfde doden, en God hem in den krijg bewaarde, zo zoekt hij hem, onder een schijn van liefde en vriendschap, in het net te krijgen en om te brengen."},{"catchword":"een dapper zoon,","tekst":"Hebreeuws, een zoon der dapperheid"},{"catchword":"den krijg des HEEREN","tekst":"Dat is, de oorlogen des Israëlietischen volks, die zij voeren om de eer Gods voor te staan tegen de afgodische heidenen."},{"catchword":"zeide","tekst":"Te weten, bij zichzelven in zijn hart."},{"catchword":"Dat mijn hand niet tegen hem zij,","tekst":"Dat is, ik zal hem met mijn eigen handen niet doden, maar ik zal hem door de hand der Filistijnen laten omkomen. Dit bedacht Saul daarom, opdat de kwade wil des volks, hetwelk David liefhad, op hem niet vallen zou."}],"18":[{"catchword":"Wie ben ik,","tekst":"Hij wil zeggen: Ik ben veel te gering, dat ik eens konings schoonzoon zou worden. Aldus spreekt David ook 2Sa 7:18."}],"19":[{"catchword":"Adriël,","tekst":"Hij is geweest de zoon van Barzillaï den Efraïmiet, 2Sa 21:8, alwaar gezegd wordt dat de vijf kinderen, die hij Merab gewonnen heeft, van de Gibeonieten zijn gehangen."},{"catchword":"den Meholathiet,","tekst":"Dat is, die te Mehola geboren was. Deze stad werd Abel-Mehola genoemd, Jdg 7:22."}],"21":[{"catchword":"dat zij hem tot een valstrik zij,","tekst":"Zie onder, vs.25."},{"catchword":"andere","tekst":"Hebreeuws, twee; dat is, de tweede. Zie boven, 1Sa 13:1."},{"catchword":"mijn schoonzoon worden","tekst":"Dat is, binnen korten tijd, of, op dien dag; verstaande een zekeren en bestemden dag, dien Saul daartoe bestemd had, gedurende welken tijd David zijn bruidsgift van honderd voorhuiden der Filistijnen zou opbrengen. Zie hieronder, vs.26. Doch Sauls hoop was, dat David, zich hiertoe schikkende, den een of den anderen tijd zou omkomen."}],"22":[{"catchword":"in het heimelijke,","tekst":"Alsof hij zeide: Houd u niet, dat gij zulks door mijn bevel doet, maar alsof gij het uit uzelven deedt, zonder mijn kennis."}],"23":[{"catchword":"daar ik een arm en verachtzaam man ben?","tekst":"Hij wil zeggen: Dewijl ik een arm gezel ben, in vergelijking met den koning, zo heb ik de macht niet om een bruidsgift te geven, gelijk eens konings dochter toestaat. Want de mannen ontvingen te dien tijde geen bruidsgift van de vrouw, maar zij gaven de bruidsgiften. Zie Gen 34:12; Exo 22:16-17. Deze bruidsgift was tenminste vijftig sikkelen zilvers, Deu 22:29. Dat is wat meer dan twaalf en een half onsen zilvers, dat is twaalf rijksdaalders en een halve (Â¦ 31,25)."}],"24":[{"catchword":"Zulke woorden heeft David gesproken","tekst":"Hebreeuws, naar deze woorden."}],"25":[{"catchword":"Want Saul dacht David te vellen","tekst":"Dat is, Saul vermoedde dat David eer in den krijg zou omkomen, eer hij honderd Filistijnen zou ombrengen."}],"26":[{"catchword":"de dagen waren nog niet vervuld","tekst":"Te weten, die dagen, die bestemd waren om de bruiloft te houden, of om de levering der voorhuiden te doen."}],"27":[{"catchword":"volkomenlijk,","tekst":"Dat is, in vol getal."}],"29":[{"catchword":"al zijn dagen","tekst":"Dat is, zolang als Saul leefde."}],"30":[{"catchword":"uittogen,","tekst":"Te weten, om krijg te voeren tegen de Israëlieten."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"It came to pass when he [viz. David] had made an end of speaking unto Saul, that the soul of Jonathan was wed to the soul of David: [See the annotate. on Gen. 44.30.] and Jonathan loved him as his soul. [i.e. as himself.]"}],"2":[{"catchword":null,"tekst":"And Saul took him that day, [Above chap.16.16. it is said, that Saul took David to him, that he might play before him on the harp, and then he was at liberty to go and come when he would, above chap.17.15. Now its said there that Saul took David to him, viz. to use him in the war, as one of his Commanders, or Field-officers, v.5. and in that respect he was continually to abide at Court] and he suffered him not to return to his fathers house."}],"3":[{"catchword":null,"tekst":"Now Jonathan and David made a Covenant, because he loved him as his (own) soul."}],"4":[{"catchword":null,"tekst":"And Jonathan put off his mantle which he had on, [Heb. Which was upon him] and gave it unto David; also his fathers, [understand this of his military clothes or armour] even to his sword, and to his bowe, and to his girdle."}],"5":[{"catchword":null,"tekst":"And David went forth whithersoever Saul sent him, he behaved himself prudently, and Saul set him over the men of war, and he was accepted [Heb. Good] in the eys of all the people, and also in the eyes of Sauls servants."}],"6":[{"catchword":null,"tekst":"Now it came to pass , when they [viz. Saul with his souldiery] came, and David returned from the slaughter of the Philistines, [Heb. of the Philistine; whereby may be understood in the first place the giant Goliath; and secondly the camp of the Philistines in general] that the women went forth out of all the cities of Israel, with singing, dances, to meet King Saul; with tabrets, with joy, and with instruments of musick. [The instrument that here is named in the Hebrew, is now adayes unknown to us, but it seemeth to have been an instrument with three strings: see the like examples, Exo 15:20, 21. Judg.11,34.]"}],"7":[{"catchword":null,"tekst":"And the women playing answered (one another) and said: Saul hath slain his thousands [i.e. ten times as many as Saul.]"}],"8":[{"catchword":null,"tekst":"Then Saul kindled greatly, and that word was evil in his eyes, and he said, They have given David ten thousand, but me (but) a thousand; and assuredly the Kingdome will be for him:"}],"9":[{"catchword":null,"tekst":"And Saul had the eye on David, [Heb. Eyed David, i.e. he laid wait for // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {

  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');

  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}

  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
