gen": {"SVnu": {"1": "De Filistijnen hadden al hun legers verzameld te Afek; en de Israëlieten legerden zich bij de bron die bij Jizreël is.", "2": "En de vorsten van de Filistijnen trokken daarheen met honderden en met duizenden; maar David met zijn mannen trokken met Achis in de achterhoede.", "3": "Toen zeiden de leiders van de Filistijnen: Wat moeten deze Hebreeën hier? Zo zei Achis tegen de leiders van de Filistijnen: Is dit niet David, de knecht van Saul, de koning van Israël, die deze dagen of deze jaren bij mij geweest is? En ik heb in hem niets gevonden vanaf de dag dat hij bij mij gekomen is, tot op deze dag.", "4": "Maar de leiders van de Filistijnen werden zeer toornig op hem, en de leiders van de Filistijnen zeiden tegen hem: Laat de man teruggaan, zodat hij naar zijn plaats teruggaat, waar u hem hebt gesteld, en dat hij niet met ons meetrekt in de strijd, opdat hij niet een tegenstander voor ons wordt in de strijd; want waarmee zou hij zich bij zijn heer aangenaam kunnen maken? Is het niet met de hoofden van deze mannen?", "5": "Is dit niet die David, over wie zij in de rei *tegen elkaar* antwoordden en zeiden: Saul heeft zijn duizenden geslagen, maar David zijn tienduizenden?", "6": "Toen riep Achis David en zei tegen hem: *Zo waar als* de HEERE leeft, dat u oprecht bent, en uw uitgaan en uw ingaan met mij in het leger is goed in mijn ogen; want ik heb geen kwaad bij u gevonden, vanaf de dag dat u tot mij gekomen bent, tot op deze dag; maar u bent niet aangenaam in de ogen van de vorsten.", "7": "Keer nu dan om en ga in vrede, opdat u geen kwaad doet in de ogen van de vorsten van de Filistijnen.", "8": "Toen zei David tegen Achis: Maar wat heb ik gedaan? Of wat hebt u in uw knecht gevonden, vanaf de dag dat ik voor uw aangezicht geweest ben, tot op deze dag, dat ik niet zou mogen gaan en strijden tegen de vijanden van mijn heer, de koning?", "9": "Achis antwoordde en zei tegen David: Ik weet het; voorzeker, u bent aangenaam in mijn ogen, als een engel van God; maar de leiders van de Filistijnen hebben gezegd: Laat hem niet met ons optrekken in deze strijd.", "10": "Welnu dan, maak u morgen vroeg op met de knechten van uw heer, die met u gekomen zijn; en zodra u zich morgen vroeg zult hebben opgemaakt en het licht voor u geworden is, ga dan weg.", "11": "Toen maakte David zich vroeg op, hij en zijn mannen, om 's morgens weg te gaan en terug te keren naar het land van de Filistijnen; de Filistijnen daarentegen trokken op naar Jizreël."}, "SV": {"1": "De Filistijnen nu hadden al hun legers vergaderd te Afek; en de Israëlieten legerden zich bij de fontein, die bij Jizreël is.", "2": "En de vorsten der Filistijnen togen daarheen met honderden, en met duizenden; doch David met zijn mannen togen met Achis in den achtertocht.", "3": "Toen zeiden de oversten der Filistijnen: Wat zullen deze Hebreën? Zo zeide Achis tot de oversten der Filistijnen: Is deze niet David, de knecht van Saul, den koning van Israël, die deze dagen of deze jaren bij mij geweest is? En ik heb in hem niets gevonden van dien dag af, dat hij afgevallen is tot dezen dag toe.", "4": "Doch de oversten der Filistijnen werden zeer toornig op hem, en de oversten der Filistijnen zeiden tot hem: Doe den man wederkeren, dat hij tot zijn plaats wederkere, waar gij hem besteld hebt, en dat hij niet met ons aftrekke in den strijd, opdat hij ons niet tot een tegenpartijder worde in den strijd; want waarmede zou deze zich bij zijn heer aangenaam maken? Is het niet met de hoofden dezer mannen?", "5": "Is dit niet die David, van denwelken zij in den rei *elkander* antwoordden, zeggende: Saul heeft zijn duizenden geslagen, maar David zijn tienduizenden?", "6": "Toen riep Achis, David, en zeide tot hem: *Het* *is* *zo* *waarachtig* *als* de HEERE leeft, dat gij oprecht zijt, en uw uitgang en uw ingang met mij in het leger is goed in mijn ogen; want ik heb geen kwaad bij u gevonden, van dien dag af, dat gij tot mij zijt gekomen, tot dezen dag toe; maar gij zijt niet aangenaam in de ogen der vorsten.", "7": "Zo keer nu om, en ga in vrede, opdat gij geen kwaad doet in de ogen van de vorsten der Filistijnen.", "8": "Toen zeide David tot Achis: Maar wat heb ik gedaan? Of wat hebt gij in uw knecht gevonden, van dien dag af, dat ik voor uw aangezicht geweest ben, tot dezen dag toe, dat ik niet zal gaan en strijden tegen de vijanden van mijn heer, den koning?", "9": "Achis nu antwoordde en zeide tot David: Ik weet het; voorwaar, gij zijt aangenaam in mijn ogen, als een engel Gods; maar de oversten der Filistijnen hebben gezegd: Laat hem met ons in dezen strijd niet optrekken.", "10": "Nu dan, maak u morgen vroeg op met de knechten uws heren, die met u gekomen zijn; en als gijlieden u morgen vroeg zult opgemaakt hebben, en het ulieden licht geworden is, zo gaat heen.", "11": "Toen maakte zich David vroeg op, hij en zijn mannen, dat zij des morgens weggingen, om weder te keren in het land der Filistijnen; de Filistijnen daarentegen togen op naar Jizreël."}, "KJV": {"1": "Now the Philistines gathered together all their armies to Aphek: and the Israelites pitched by a fountain which is in Jezreel.", "2": "And the lords of the Philistines passed on by hundreds, and by thousands: but David and his men passed on in the rereward with Achish.", "3": "Then said the princes of the Philistines, What do these Hebrews here? And Achish said unto the princes of the Philistines, Is not this David, the servant of Saul the king of Israel, which hath been with me these days, or these years, and I have found no fault in him since he fell unto me unto this day?", "4": "And the princes of the Philistines were wroth with him; and the princes of the Philistines said unto him, Make ➔ this fellow return, that he may go again to his place which thou hast appointed him, and let him not go down with us to battle, lest in the battle he be an adversary to us: for wherewith should he reconcile himself unto his master? should it not be with the heads of these men?", "5": "Is not this David, of whom they sang one to another in dances, saying, Saul slew his thousands, and David his ten thousands?", "6": "Then Achish called David, and said unto him, Surely, as the LORD liveth, thou hast been upright, and thy going out and thy coming in with me in the host is good in my sight: for I have not found evil in thee since the day of thy coming unto me unto this day: nevertheless the lords favour thee not.", "7": "Wherefore now return, and go in peace, that thou displease not the lords of the Philistines.", "8": "And David said unto Achish, But what have I done? and what hast thou found in thy servant so long as I have been with thee unto this day, that I may not go fight against the enemies of my lord the king?", "9": "And Achish answered and said to David, I know that thou art good in my sight, as an angel of God: notwithstanding the princes of the Philistines have said, He shall not go up with us to the battle.", "10": "Wherefore now rise up early in the morning with thy master's servants that are come with thee: and as soon as ye be up early in the morning, and have light, depart.", "11": "So David and his men rose up early to depart in the morning, to return into the land of the Philistines. And the Philistines went up to Jezreel."}}, "tsk": {"1": [{"kopje": "de Filistijnen", "refs": ["1 Sam 28:1", "1 Sam 28:2"]}, {"kopje": "Afek", "refs": ["1 Sam 4:1", "Joz 19:30", "1 Kon 20:30"]}, {"kopje": "Jizreël", "refs": ["1 Sam 28:4", "Joz 19:18", "Richt 6:33", "1 Kon 18:45", "1 Kon 18:46", "1 Kon 21:1", "1 Kon 21:23", "2 Kon 9:36", "Hos 1:4-11"]}], "2": [{"kopje": "de vorsten", "refs": ["1 Sam 29:6", "1 Sam 29:7", "1 Sam 5:8-11", "1 Sam 6:4", "Joz 13:3"]}, {"kopje": "maar David", "refs": ["1 Sam 28:1", "1 Sam 28:2"]}], "3": [{"kopje": "deze dagen", "refs": ["1 Sam 27:7"]}, {"kopje": "gevonden", "refs": ["1 Sam 25:28", "Dan 6:6", "Joh 19:6", "Rom 12:17", "1 Petr 3:16"]}], "4": [{"kopje": "Laat de man teruggaan", "refs": ["1 Sam 14:21", "1 Kron 1 1479", "refs": [{"disp": "Joz 15:56", "href": "../../jozua/15/#v56", "ref": "Joz 15:56", "svLabel": null}, {"disp": "1 Sam 25:43", "href": "../../1-samuel/25/#v43", "ref": "1 Sam 25:43", "svLabel": null}, {"disp": "1 Sam 27:3", "href": "../../1-samuel/27/#v3", "ref": "1 Sam 27:3", "svLabel": null}, {"disp": "1 Sam 29:1", "href": "../../1-samuel/29/#v1", "ref": "1 Sam 29:1", "svLabel": null}, {"disp": "1 Sam 29:11", "href": "../../1-samuel/29/#v11", "ref": "1 Sam 29:11", "svLabel": null}], "kinderen": []}, {"label": "3. A valley", "href": "../../nave/j/?hl=1Sam.29.11#i11486", "refs": [], "kinderen": [{"label": "Place of the defeat of the Israelites under Saul and Jonathan", "href": "../../nave/j/?hl=1Sam.29.11#i11488", "refs": [{"disp": "1 Sam 29:1", "href": "../../1-samuel/29/#v1", "ref": "1 Sam 29:1", "svLabel": null}, {"disp": "1 Sam 29:11", "href": "../../1-samuel/29/#v11", "ref": "1 Sam 29:11", "svLabel": null}, {"disp": "1 Sam 31:1-6", "href": "../../1-samuel/31/#v1", "ref": "1 Sam 31:1-6", "svLabel": null}, {"disp": "2 Sam 4:4", "href": "../../2-samuel/4/#v4", "ref": "2 Sam 4:4", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"1 Sam 4:1": "Het woord van Samuël kwam tot heel Israël. En Israël trok uit, de Filistijnen tegemoet ten strijde, en legerde zich bij Eben-haëzer, maar de Filistijnen legerden zich bij Afek.", "Jes 65:16": "Zodat wie zich zal zegenen op aarde, zich zal zegenen in de God van de waarheid; en wie zal zweren op aarde, zal zweren bij de God van de waarheid, omdat de vorige benauwdheden vergeten zullen zijn, en omdat zij voor Mijn ogen verborgen zijn.", "1 Sam 5:11": "En zij zonden heen, en verzamelden alle vorsten van de Filistijnen, en zeiden: Zend de ark van de God van Israël heen, dat die terugkeert naar haar plaats, opdat zij mij en mijn volk niet doodt; want er was een dodelijke kwelling in de hele stad, en de hand van God was daar zeer zwaar.", "2 Sam 19:27": "Bovendien heeft hij uw knecht bij mijn heer de koning valselijk beschuldigd; maar mijn heer de koning is als een engel van God; doe dan wat goed is in uw ogen.", "1 Kon 18:46": "En de hand van de HEERE was op Elia, en hij gordde zijn lenden, en liep voor het aangezicht van Achab uit, tot waar men bij Jizreël komt.", "2 Sam 14:20": "Om de zaak zo een andere gestalte te geven, dat heeft uw dienaar Joab gedaan; maar mijn heer is wijs, met de wijsheid van een Engel van God, om alles te doorzien wat op de aarde is.", "1 Petr 2:12": "En houd uw levenswandel eerlijk onder de heidenen; opdat, waar zij nu kwaad van u spreken als van kwaaddoeners, zij door de goede werken die zij van u zien, God mogen verheerlijken op de dag dat Hij naar hen omziet.", "1 Sam 31:1-6": "De Filistijnen streden tegen Israël; en de mannen van Israël vluchtten voor de Filistijnen, en vielen verslagen op het gebergte Gilboa. En de Filistijnen zaten Saul en zijn zonen dicht op de hielen; en de Filistijnen versloegen Jonathan, en Abinadab, en Malchisua, de zonen van Saul. En de strijd werd zwaar tegen Saul; en de mannen die met de boog schieten, troffen hem, en hij werd zeer bang voor de schutters.", "Deut 10:20": "De HEERE, uw God, zult u vrezen; Hem zult u dienen, en Hem zult u aanhangen, en bij Zijn Naam zweren.", "Joz 13:3": "Van de Sichor af, die voor aan Egypte is, tot aan de grens van Ekron toe naar het noorden, dat aan de Kanaänieten toegerekend wordt; vijf vorsten van de Filistijnen, de Gazatiet en de Asdodiet, de Askeloniet, de Gathiet en de Ekroniet, en de Avvieten.", "2 Sam 3:25": "U kent Abner, de zoon van Ner: hij is gekomen om u te bedriegen, en om uw uitgaan en ingaan te weten te komen, ja, om alles te weten te komen wat u doet.", "1 Sam 27:7": "Het getal nu van de dagen dat David in het land van de Filistijnen woonde, was een jaar en vier maanden.", "1 Sam 17:29": "Toen zei David: Wat heb ik nu gedaan? Is er geen reden voor?", "Richt 16:5": "Toen kwamen de vorsten van de Filistijnen naar haar toe, en zeiden tegen haar: Overreed hem, en zie waarin zijn grote kracht ligt, en waarmee wij hem machtig zouden kunnen worden, en hem binden, om hem te onderwerpen; dan zullen wij u geven, ieder, duizend en honderd zilverstukken.", "Richt 16:30": "En Simson zei: Laat mijn ziel sterven met de Filistijnen; en hij boog zich met kracht, en het huis viel op de vorsten, en op al het volk, dat daarin was. En de doden, die hij bij zijn sterven gedood heeft, waren meer dan die hij tijdens zijn leven had gedood.", "1 Kon 18:45": "En het gebeurde ondertussen, dat de hemel zwart werd van wolken en wind; en er kwam een grote regen; en Achab reed weg, en trok naar Jizreël.", "Gal 4:14": "en mijn beproeving¹, die in mijn vlees gebeurde, hebt u niet veracht, en ook niet verafschuwd; maar u nam mij aan als een engel van God, ja, als Christus Jezus.", "1 Sam 7:7": "Toen de Filistijnen hoorden dat de kinderen van Israël zich verzameld hadden te Mizpa, kwamen de leiders van de Filistijnen op tegen Israël. Toen de kinderen van Israël dat hoorden, werden zij bang voor de Filistijnen.", "Joz 19:18": "En hun grens was Jizreëla, en Chesulloth, en Sunem,", "Gen 16:6": "En Abram zei tegen Sarai: Zie, uw dienstmaagd is in uw hand; doe met haar wat goed is in uw ogen. En Sarai vernederde haar, en zij vluchtte van haar aangezicht.", "Deut 15:12": "Wanneer uw broeder, een Hebreeuwse man of een Hebreeuwse vrouw, aan u verkocht is, dan zal hij u zes jaren dienen; maar in het zevende jaar zult u hem vrij van u laten gaan.", "Ps 34:14": "Nun. Bewaar uw tong voor het kwaad, en uw lippen voor het spreken van bedrog.", "1 Sam 26:18": "Hij zei verder: Waarom vervolgt mijn heer zijn dienaar zo achterna? Want wat heb ik gedaan, en wat kwaad is er in mijn hand?", "1 Sam 4:10": "Toen streden de Filistijnen, en Israël werd verslagen, en zij vluchtten ieder naar zijn tent; en er kwam een zeer grote nederlaag, zodat er van Israël dertigduizend man van het voetvolk vielen.", "Matt 6:13": "En leid ons niet in verzoeking, maar verlos ons van de boze. Want van U is het Koninkrijk, en de kracht, en de heerlijkheid, tot in eeuwigheid. Amen.", "2 Kor 11:22": "Zijn zij Hebreeën? Ik ook. Zijn zij Israëlieten? Ik ook. Zijn zij het zaad van Abraham? Ik ook.", "Matt 5:16": "Laat uw licht zo schijnen voor de mensen, dat zij uw goede werken mogen zien en uw Vader, Die in de hemelen is, verheerlijken.", "1 Sam 4:9": "Wees sterk, en gedraag u als mannen, Filistijnen, zodat u de Hebreeën niet gaat dienen, zoals zij u gediend hebben; wees dus mannen, en strijd.", "1 Sam 28:2": "Toen zei David tegen Achis: Zo zult u weten wat uw dienaar doen zal. En Achis zei tegen David: Daarom zal ik u voor altijd tot bewaarder van mijn hoofd aanstellen.", "1 Sam 28:1": "Het gebeurde in die dagen, toen de Filistijnen hun legers verzamelden om te strijden tegen Israël, dat Achis tegen David zei: U moet goed weten dat u met mij mee zult trekken in het leger, u en uw mannen.", "1 Petr 3:16": "en heb een goed geweten, opdat zij die uw goede wandel in Christus belasteren, beschaamd gemaakt worden in datgene waarin zij kwaad van u spreken, alsof u kwaaddoeners bent.", "1 Sam 25:43": "Ook nam David Ahinoam van Jizreël; zo werden ook die beiden hem tot vrouwen.", "1 Sam 25:28": "Vergeef toch uw dienstmaagd de overtreding, want de HEERE zal mijn heer zeker een bestendig huis maken, omdat mijn heer de oorlogen van de HEERE voert, en er geen kwaad bij u gevonden is al uw dagen.", "Rom 12:17": "Vergeld niemand kwaad voor kwaad. Zorg voor wat eerlijk is voor alle mensen.", "1 Sam 27:3": "En David bleef bij Achis in Gath, hij en zijn mannen, ieder met zijn huisgezin; David met zijn beide vrouwen, Ahinoam, de Jizreëlietische, en Abigaïl, de vrouw van Nabal, de Karmelietische.", "Num 22:34": "Toen zei Bileam tegen de Engel van de HEERE: Ik heb gezondigd, want ik heb niet geweten dat U mij tegemoet op deze weg stond; en nu, als het kwaad is in Uw ogen, zal ik terugkeren.", "Fil 3:5": "Besneden op de achtste dag, uit het geslacht van Israël, van de stam van Benjamin, een Hebreeër uit de Hebreeën, wat de wet betreft een Farizeeër;", "Gen 13:12": "Abram woonde dan in het land Kanaän; en Lot woonde in de steden van de vlakte, en sloeg zijn tenten op tot aan Sodom toe.", "Joz 15:56": "en Jizreël, en Jokdeam, en Zanoah,", "1 Sam 6:4": "Toen zeiden zij: Welk schuldoffer is dat, dat wij Hem teruggeven zullen? En zij zeiden: Vijf gouden gezwellen en vijf gouden muizen, naar het aantal van de vorsten van de Filistijnen; want het is één en dezelfde plaag over u allen en over uw vorsten.", "Jer 12:16": "En het zal gebeuren, als zij de wegen van Mijn volk vlijtig zullen leren, zwerend bij Mijn Naam: Zo waarachtig als de HEERE leeft! – zoals zij Mijn volk geleerd hebben te zweren bij Baäl – dan zullen zij te midden van Mijn volk gebouwd worden.", "Ps 34:15": "Samech. Wijk af van het kwaad, en doe het goede; zoek de vrede, en jaag die na.", "Num 27:17": "Die voor hen uitgaat, en die voor hen ingaat, en die hen uitleidt, en die hen inleidt; opdat de vergadering van de HEERE niet is als schapen die geen herder hebben.", "1 Kon 21:23": "Verder sprak de HEERE ook over Izebel: De honden zullen Izebel eten, bij de voorwal van Jizreël.", "Gen 40:15": "Want ik ben als dief weggehaald uit het land van de Hebreeën; en ook heb ik hier niets gedaan, dat zij mij in deze kuil gezet hebben.", "Jona 1:9": "En hij zei tegen hen: Ik ben een Hebreeër; en ik vrees de HEERE, de God van de hemel, Die de zee en het droge gemaakt heeft.", "Hand 27:23": "Want deze zelfde nacht heeft bij mij gestaan een engel van God, van Wie ik ben en Die ik ook dien,", "Gen 43:32": "En zij richtten voor hem apart aan, en voor hen apart; en voor de Egyptenaren, die met hem aten, apart; want de Egyptenaren mogen geen brood eten met de Hebreeën, omdat dat voor de Egyptenaren een gruwel is.", "Hos 1:1-11": "Het woord van de Heere, dat gebeurd is tot Hosea, de zoon van Beëri, in de dagen van Uzzia, Jotham, Achaz, Hizkia, koningen van Juda, en in de dagen van Jerobeam, zoon van Joas, koning van Israël. Het begin van het woord van de Heere door Hosea. De Heere zei toen tegen Hosea: Ga heen, neem u een vrouw van hoererijen, en kinderen van hoererijen; want het land hoereert helemaal van achter de Heere vandaan. Zo ging hij heen, en nam Gomer, een dochter van Diblaim; en zij ontving, en baarde hem een zoon.", "Hand 6:1": "In diezelfde dagen, toen het aantal discipelen groeide, ontstond er gemor van de Griekssprekenden tegen de Hebreeën, omdat hun weduwen bij de dagelijkse verzorging over het hoofd werden gezien.", "1 Sam 6:12": "De koeien nu gingen recht op die weg, op de weg naar Beth-Semes op één straat; zij gingen steeds voort, al loeiend, en weken noch naar rechts noch naar links af; en de vorsten van de Filistijnen gingen achter hen aan tot aan het gebied van Beth-Semes.", "Richt 6:33": "Alle Midianieten nu, en Amalekieten, en de mensen uit het oosten, waren bijeengebracht, en zij trokken over, en legerden zich in het dal van Jizreël.", "Gen 26:17": "Toen ging Izak daarvandaan, en hij legerde zich in het dal van Gerar, en woonde daar.", "1 Sam 20:3": "Toen zwoer David verder, en zei: Uw vader weet heel goed dat ik genade in uw ogen gevonden heb; daarom heeft hij gezegd: Dat Jonathan dit niet weet, opdat hij zich niet bekommert; en zeker, zo waarachtig als de HEERE leeft, en uw ziel leeft, er is maar als een schrede tussen mij en de dood!", "1 Kron 12:19": "Er vielen ook van Manasse tot David, toen hij met de Filistijnen kwam om tegen Saul te strijden, hoewel zij hen niet hielpen; want de vorsten van de Filistijnen stuurden hem na overleg weg, en zeiden: Met gevaar voor onze hoofden zou hij naar Saul, zijn heer, overlopen.", "1 Sam 20:8": "Doe dan barmhartigheid aan uw knecht, want u hebt uw knecht in een verbond van de HEERE met u gebracht; maar is er een misdaad in mij, dood mij dan zelf; waarom zou u mij toch tot uw vader brengen?", "Ex 14:19": "En de Engel van God, Die voor het leger van Israël uit ging, vertrok, en ging achter hen; de wolkkolom vertrok ook van voor hun gezicht, en stond achter hen.", "Luk 16:8": "En de heer prees de onrechtvaardige rentmeester, omdat hij voorzichtig gehandeld had; want de kinderen van deze wereld zijn voorzichtiger dan de kinderen van het licht, in hun geslacht.", "Gen 39:14": "dat zij de mensen van haar huis riep, en tegen hen zei: Ziet, hij heeft ons de Hebreeuwse man binnengebracht, om met ons te spotten; hij is bij mij gekomen om bij mij te liggen, en ik heb met luide stem geroepen;", "Joh 19:6": "Toen de overpriesters en de dienaars Hem dan zagen, riepen zij: Kruisig Hem, kruisig Hem! Pilatus zei tegen hen: Neemt u Hem en kruisigt Hem; want ik vind in Hem geen schuld.", "1 Sam 5:8": "Daarom zonden zij heen, en verzamelden bij zich alle vorsten van de Filistijnen, en zij zeiden: Wat zullen wij met de ark van de God van Israël doen? En die zeiden: Laat de ark van de God van Israël naar Gath gebracht worden. Zo brachten zij de ark van de God van Israël daarheen.", "1 Kon 21:1": "Het gebeurde nu na deze dingen: Naboth, een Jizreëliet, had een wijngaard, die te Jizreël was, bij het paleis van Achab, de koning van Samaria.", "Gen 26:18": "Toen Izak nu teruggekeerd was, groef hij de waterputten weer open die zij in de tijd van Abraham, zijn vader, gegraven hadden, en die de Filistijnen na Abrahams dood hadden dichtgestopt; en hij noemde ze bij de namen waarmee zijn vader ze genoemd had.", "2 Sam 16:18": "En Husai zei tegen Absalom: Nee, maar wie de HEERE verkiest, en dit hele volk, en alle mannen van Israël, van hem zal ik zijn, en bij hem zal ik blijven.", "1 Kon 20:30": "En de overgeblevenen vluchtten naar Afek, de stad in, en de muur viel op zeven en twintig duizend mannen, die overgebleven waren; ook vluchtte Benhadad, en kwam in de stad van kamer in kamer.", "2 Sam 4:4": "En Jonathan, Sauls zoon, had een zoon die aan beide voeten gewond was; hij was vijf jaar oud toen het bericht over Saul en Jonathan uit Jizreël kwam; en zijn voedster nam hem op en vluchtte; en het gebeurde, toen zij zich haastte om te vluchten, dat hij viel en kreupel werd; en zijn naam was Mefiboseth.", "Ps 121:8": "De HEERE zal uw uitgaan en uw ingaan bewaren, van nu aan tot in eeuwigheid.", "1 Sam 28:10": "Saul nu zwoer haar bij de HEERE en zei: Zo waarachtig als de HEERE leeft, u zal geen straf om deze zaak overkomen!", "1 Sam 28:3-25": "Samuel nu was gestorven, en heel Israël had rouw over hem bedreven; en zij hadden hem begraven in Rama, namelijk in zijn eigen stad. En Saul had de waarzeggers en de geestenbezweerders uit het land weggedaan. En de Filistijnen kwamen en verzamelden zich, en zij sloegen hun kamp op bij Sunem; en Saul verzamelde heel Israël, en zij sloegen hun kamp op bij Gilboa. Toen Saul het leger van de Filistijnen zag, werd hij bang, en zijn hart beefde erg.", "Joz 19:30": "En Umma, en Afek, en Rehob; tweeëntwintig steden en hun dorpen.", "1 Sam 29:2-7": "En de vorsten van de Filistijnen trokken daarheen met honderden en met duizenden; maar David met zijn mannen trokken met Achis in de achterhoede. Toen zeiden de leiders van de Filistijnen: Wat moeten deze Hebreeën hier? Zo zei Achis tegen de leiders van de Filistijnen: Is dit niet David, de knecht van Saul, de koning van Israël, die deze dagen of deze jaren bij mij geweest is? En ik heb in hem niets gevonden vanaf de dag dat hij bij mij gekomen is, tot op deze dag. Maar de leiders van de Filistijnen werden zeer toornig op hem, en de leiders van de Filistijnen zeiden tegen hem: Laat de man teruggaan, zodat hij naar zijn plaats teruggaat, waar u hem hebt gesteld, en dat hij niet met ons meetrekt in de strijd, opdat hij niet een tegenstander voor ons wordt in de strijd; want waarmee zou hij zich bij zijn heer aangenaam kunnen maken? Is het niet met de hoofden van deze mannen?", "1 Sam 14:21": "Er waren ook Hebreeën bij de Filistijnen, zoals eerder, die met hen in het leger opgetrokken waren, van rondom; dezen voegden zich nu ook bij de Israëlieten die bij Saul en Jonathan waren.", "Joz 22:30": "Toen de priester Pinehas, en de leiders van de vergadering, en de hoofden van de duizenden van Israël, die met hem waren, de woorden hoorden, die de kinderen van Ruben, en de kinderen van Gad, en de kinderen van Manasse gesproken hadden, was het goed in hun ogen.", "1 Sam 4:3": "Toen het volk weer in het leger gekomen was, zeiden de oudsten van Israël: Waarom heeft de HEERE ons vandaag verslagen voor de Filistijnen? Laten wij uit Silo de ark van het verbond van de HEERE tot ons nemen, en laat die in ons midden komen, zodat zij ons verlost uit de hand van onze vijanden.", "1 Kon 16:16": "Het volk nu, dat zich gelegerd had, hoorde zeggen: Zimri heeft een verbond gesloten, ja, heeft ook de koning verslagen; daarom maakte heel Israël diezelfde dag Omri, de legeraanvoerder, koning over Israël, in het leger.", "Dan 6:6": "Toen zeiden die mannen: Wij zullen tegen deze Daniël geen gelegenheid vinden, tenzij wij iets tegen hem vinden in de wet van zijn God.", "Hos 1:4-11": "En de Heere zei tegen hem: Noem zijn naam Jizreël, want nog een korte tijd, en Ik zal de bloedschuld van Jizreël bezoeken over het huis van Jehu, en Ik zal het koninkrijk van het huis van Israël doen ophouden. En het zal op die dag gebeuren, dat Ik de boog van Israël zal breken, in het dal van Jizreël. En zij ontving opnieuw, en baarde een dochter; en Hij zei tegen hem: Noem haar naam Lo-Ruchama; want Ik zal Mij voortaan niet meer ontfermen over het huis van Israël, maar Ik zal ze zeker wegvoeren.", "Gen 13:10": "En Lot hief zijn ogen op, en zag de hele vlakte van de Jordaan, dat die overal goed bevochtigd was; voordat de HEERE Sodom en Gomorra verwoest had, was zij als de hof van de HEERE, als het land Egypte, tot waar men bij Zoar komt.", "2 Sam 14:17": "Verder zei uw dienares: Het woord van mijn heer de koning zij toch tot rust; want zoals een Engel van God, zo is mijn heer de koning, om het goede en het kwade te onderscheiden; en de HEERE, uw God, zal met u zijn.", "Ex 2:6": "Toen zij het opendeed, zag zij het kind; en zie, het jongetje huilde; en zij werd door medelijden bewogen, en zei: Dit is een van de kinderen van de Hebreeën!", "1 Sam 5:8-11": "Daarom zonden zij heen, en verzamelden bij zich alle vorsten van de Filistijnen, en zij zeiden: Wat zullen wij met de ark van de God van Israël doen? En die zeiden: Laat de ark van de God van Israël naar Gath gebracht worden. Zo brachten zij de ark van de God van Israël daarheen. En het gebeurde, nadat zij die hadden rondgebracht, dat de hand van de HEERE tegen die stad was met een zeer grote kwelling; want Hij sloeg de mensen van die stad, van klein tot groot, en zij kregen gezwellen op de verborgen plaatsen. Toen zonden zij de ark van God naar Ekron; maar het gebeurde, toen de ark van God te Ekron kwam, dat die van Ekron riepen en zeiden: Zij hebben de ark van de God van Israël naar ons toe gebracht, om mij en mijn volk te doden.", "2 Kon 9:36": "Toen kwamen zij terug, en vertelden het hem, en hij zei: Dit is het woord van de HEERE, dat Hij gesproken heeft door de dienst van Zijn knecht Elia, de Thisbiet, en zei: Op het stuk land van Jizreël zullen de honden het vlees van Izebel eten.", "2 Kon 19:27": "Maar Ik weet uw zitten, en uw uitgaan, en uw binnenkomen, en uw woeden tegen Mij.", "Richt 13:6": "Toen kwam deze vrouw binnen en sprak tegen haar man en zei: Er kwam een Man van God naar mij toe, Wiens gezicht was als het gezicht van een Engel van God, zeer ontzagwekkend; en ik heb Hem niet gevraagd waar Hij vandaan was, en Zijn naam heeft Hij mij niet bekendgemaakt.", "1 Sam 28:4": "En de Filistijnen kwamen en verzamelden zich, en zij sloegen hun kamp op bij Sunem; en Saul verzamelde heel Israël, en zij sloegen hun kamp op bij Gilboa.", "2 Sam 16:19": "En verder, aan wie zou ik dienen? Zou het niet zijn voor het aangezicht van zijn zoon? Zoals ik voor het aangezicht van uw vader gediend heb, zo zal ik voor uw aangezicht zijn.", "Num 21:23": "Doch Sihon liet Israël niet toe door zijn gebied te trekken; maar Sihon verzamelde a-code=\"H7586\">Saul</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> which hath been with me these <span class=\"wl wl-kjv\" data-code=\"H3117\">days,</span> or these <span class=\"wl wl-kjv\" data-code=\"H8141\">years,</span> and I have <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> no <span class=\"wl wl-kjv\" data-code=\"H3972\">fault</span> in him <span class=\"wl wl-kjv\" data-code=\"H3117\">since</span> he <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> unto me unto this <span class=\"wl wl-kjv\" data-code=\"H3117\">day?</span>", "4": "And the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> were <span class=\"wl wl-kjv\" data-code=\"H7107\">wroth</span> with him; and the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H7725\">Make</span> ➔ this <span class=\"wl wl-kjv\" data-code=\"H376\">fellow</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">return,</span> that he may go <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> to his <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> which thou hast <span class=\"wl wl-kjv\" data-code=\"H6485\">appointed</span> him, and let him not go <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> with us to <span class=\"wl wl-kjv\" data-code=\"H4421\">battle,</span> lest in the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle</span> he be an <span class=\"wl wl-kjv\" data-code=\"H7854\">adversary</span> to us: for wherewith should he <span class=\"wl wl-kjv\" data-code=\"H7521\">reconcile</span> himself unto his <span class=\"wl wl-kjv\" data-code=\"H113\">master?</span> should it not be with the <span class=\"wl wl-kj     `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen bij dit vers.</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
</html>
