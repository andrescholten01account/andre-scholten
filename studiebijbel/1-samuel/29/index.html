 gevonden vanaf de dag dat hij bij mij gekomen is, tot op deze dag.","4":"Maar de leiders van de Filistijnen werden zeer toornig op hem, en de leiders van de Filistijnen zeiden tegen hem: Laat de man teruggaan, zodat hij naar zijn plaats teruggaat, waar u hem hebt gesteld, en dat hij niet met ons meetrekt in de strijd, opdat hij niet een tegenstander voor ons wordt in de strijd; want waarmee zou hij zich bij zijn heer aangenaam kunnen maken? Is het niet met de hoofden van deze mannen?","5":"Is dit niet die David, over wie zij in de rei *tegen elkaar* antwoordden en zeiden: Saul heeft zijn duizenden geslagen, maar David zijn tienduizenden?","6":"Toen riep Achis David en zei tegen hem: *Zo waar als* de HEERE leeft, dat u oprecht bent, en uw uitgaan en uw ingaan met mij in het leger is goed in mijn ogen; want ik heb geen kwaad bij u gevonden, vanaf de dag dat u tot mij gekomen bent, tot op deze dag; maar u bent niet aangenaam in de ogen van de vorsten.","7":"Keer nu dan om en ga in vrede, opdat u geen kwaad doet in de ogen van de vorsten van de Filistijnen.","8":"Toen zei David tegen Achis: Maar wat heb ik gedaan? Of wat hebt u in uw knecht gevonden, vanaf de dag dat ik voor uw aangezicht geweest ben, tot op deze dag, dat ik niet zou mogen gaan en strijden tegen de vijanden van mijn heer, de koning?","9":"Achis antwoordde en zei tegen David: Ik weet het; voorzeker, u bent aangenaam in mijn ogen, als een engel van God; maar de leiders van de Filistijnen hebben gezegd: Laat hem niet met ons optrekken in deze strijd.","10":"Welnu dan, maak u morgen vroeg op met de knechten van uw heer, die met u gekomen zijn; en zodra u zich morgen vroeg zult hebben opgemaakt en het licht voor u geworden is, ga dan weg.","11":"Toen maakte David zich vroeg op, hij en zijn mannen, om 's morgens weg te gaan en terug te keren naar het land van de Filistijnen; de Filistijnen daarentegen trokken op naar Jizreël."},"SV":{"1":"De Filistijnen nu hadden al hun legers vergaderd te Afek; en de Israëlieten legerden zich bij de fontein, die bij Jizreël is.","2":"En de vorsten der Filistijnen togen daarheen met honderden, en met duizenden; doch David met zijn mannen togen met Achis in den achtertocht.","3":"Toen zeiden de oversten der Filistijnen: Wat zullen deze Hebreën? Zo zeide Achis tot de oversten der Filistijnen: Is deze niet David, de knecht van Saul, den koning van Israël, die deze dagen of deze jaren bij mij geweest is? En ik heb in hem niets gevonden van dien dag af, dat hij afgevallen is tot dezen dag toe.","4":"Doch de oversten der Filistijnen werden zeer toornig op hem, en de oversten der Filistijnen zeiden tot hem: Doe den man wederkeren, dat hij tot zijn plaats wederkere, waar gij hem besteld hebt, en dat hij niet met ons aftrekke in den strijd, opdat hij ons niet tot een tegenpartijder worde in den strijd; want waarmede zou deze zich bij zijn heer aangenaam maken? Is het niet met de hoofden dezer mannen?","5":"Is dit niet die David, van denwelken zij in den rei *elkander* antwoordden, zeggende: Saul heeft zijn duizenden geslagen, maar David zijn tienduizenden?","6":"Toen riep Achis, David, en zeide tot hem: *Het* *is* *zo* *waarachtig* *als* de HEERE leeft, dat gij oprecht zijt, en uw uitgang en uw ingang met mij in het leger is goed in mijn ogen; want ik heb geen kwaad bij u gevonden, van dien dag af, dat gij tot mij zijt gekomen, tot dezen dag toe; maar gij zijt niet aangenaam in de ogen der vorsten.","7":"Zo keer nu om, en ga in vrede, opdat gij geen kwaad doet in de ogen van de vorsten der Filistijnen.","8":"Toen zeide David tot Achis: Maar wat heb ik gedaan? Of wat hebt gij in uw knecht gevonden, van dien dag af, dat ik voor uw aangezicht geweest ben, tot dezen dag toe, dat ik niet zal gaan en strijden tegen de vijanden van mijn heer, den koning?","9":"Achis nu antwoordde en zeide tot David: Ik weet het; voorwaar, gij zijt aangenaam in mijn ogen, als een engel Gods; maar de oversten der Filistijnen hebben gezegd: Laat hem met ons in dezen strijd niet optrekken.","10":"Nu dan, maak u morgen vroeg op met de knechten uws heren, die met u gekomen zijn; en als gijlieden u morgen vroeg zult opgemaakt hebben, en het ulieden licht geworden is, zo gaat heen.","11":"Toen maakte zich David vroeg op, hij en zijn mannen, dat zij des morgens weggingen, om weder te keren in het land der Filistijnen; de Filistijnen daarentegen togen op naar Jizreël."},"KJV":{"1":"Now the Philistines gathered together all their armies to Aphek: and the Israelites pitched by a fountain which is in Jezreel.","2":"And the lords of the Philistines passed on by hundreds, and by thousands: but David and his men passed on in the rereward with Achish.","3":"Then said the princes of the Philistines, What do these Hebrews here? And Achish said unto the princes of the Philistines, Is not this David, the servant of Saul the king of Israel, which hath been with me these days, or these years, and I have found no fault in him since he fell unto me unto this day?","4":"And the princes of the Philistines were wroth with him; and the princes of the Philistines said unto him, Make ➔ this fellow return, that he may go again to his place which thou hast appointed him, and let him not go down with us to battle, lest in the battle he be an adversary to us: for wherewith should he reconcile himself unto his master? should it not be with the heads of these men?","5":"Is not this David, of whom they sang one to another in dances, saying, Saul slew his thousands, and David his ten thousands?","6":"Then Achish called David, and said unto him, Surely, as the LORD liveth, thou hast been upright, and thy going out and thy coming in with me in the host is good in my sight: for I have not found evil in thee since the day of thy coming unto me unto this day: nevertheless the lords favour thee not.","7":"Wherefore now return, and go in peace, that thou displease not the lords of the Philistines.","8":"And David said unto Achish, But what have I done? and what hast thou found in thy servant so long as I have been with thee unto this day, that I may not go fight against the enemies of my lord the king?","9":"And Achish answered and said to David, I know that thou art good in my sight, as an angel of God: notwithstanding the princes of the Philistines have said, He shall not go up with us to the battle.","10":"Wherefore now rise up early in the morning with thy master's servants that are come with thee: and as soon as ye be up early in the morning, and have light, depart.","11":"So David and his men rose up early to depart in the morning, to return into the land of the Philistines. And the Philistines went up to Jezreel."}},"tsk":{"1":[{"kopje":"de Filistijnen","refs":["1 Sam 28:1","1 Sam 28:2"]},{"kopje":"Afek","refs":["1 Sam 4:1","Joz 19:30","1 Kon 20:30"]},{"kopje":"Jizreël","refs":["1 Sam 28:4","Joz 19:18","Richt 6:33","1 Kon 18:45","1 Kon 18:46","1 Kon 21:1","1 Kon 21:23","2 Kon 9:36","Hos 1:4-11"]}],"2":[{"kopje":"de vorsten","refs":["1 Sam 29:6","1 Sam 29:7","1 Sam 5:8-11","1 Sam 6:4","Joz 13:3"]},{"kopje":"maar David","refs":["1 Sam 28:1","1 Sam 28:2"]}],"3":[{"kopje":"deze dagen","refs":["1 Sam 27:7"]},{"kopje":"gevonden","refs":["1 Sam 25:28","Dan 6:6","Joh 19:6","Rom 12:17","1 Petr 3:16"]}],"4":[{"kopje":"Laat de man teruggaan","refs":["1 Sam 14:21","1 Kron 12:19","Luk 16:8"]}],"6":[{"kopje":"de HEERE","refs":["1 Sam 20:3","1 Sam 28:10","Deut 10:20","Jes 65:16","Jer 12:16"]},{"kopje":"dat u","refs":["Matt 5:16","1 Petr 2:12","1 Petr 3:16"]},{"kopje":"uw uitgaan","refs":["Num 27:17","2 Sam 3:25","2 Kon 19:27","Ps 121:8"]},{"kopje":"ik heb geen","refs":["1 Sam 29:3"]},{"kopje":"de ogen van de vorsten","refs":["Gen 16:6","Joz 22:30"]}],"7":[{"kopje":"geen kwaad doet","refs":["Num 22:34"]}],"8":[{"kopje":"wat heb ik","refs":["1 Sam 12:3","1 Sam 17:29","1 Sam 20:8","1 Sam 26:18"]},{"kopje":"dat ik niet zou","refs":["1 Sam 28:2","2 Sam 16:18","2 Sam 16:19","Ps 34:14","Ps 34:15","Matt 6:13"]}],"9":[{"kopje":"als een engel","refs":[ =\"H8269\">princes</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines,</span> Is not this <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> the <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> of <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> which hath been with me these <span class=\"wl wl-kjv\" data-code=\"H3117\">days,</span> or these <span class=\"wl wl-kjv\" data-code=\"H8141\">years,</span> and I have <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> no <span class=\"wl wl-kjv\" data-code=\"H3972\">fault</span> in him <span class=\"wl wl-kjv\" data-code=\"H3117\">since</span> he <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> unto me unto this <span class=\"wl wl-kjv\" data-code=\"H3117\">day?</span>","4":"And the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> were <span class=\"wl wl-kjv\" data-code=\"H7107\">wroth</span> with him; and the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H7725\">Make</span> ➔ this <span class=\"wl wl-kjv\" data-code=\"H376\">fellow</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">return,</span> that he may go <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> to his <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> which thou hast <span class=\"wl wl-kjv\" data-code=\"H6485\">appointed</span> him, and let him not go <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> with us to <span class=\"wl wl-kjv\" data-code=\"H4421\">battle,</span> lest in the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle</span> he be an <span class=\"wl wl-kjv\" data-code=\"H7854\">adversary</span> to us: for wherewith should he <span class=\"wl wl-kjv\" data-code=\"H7521\">reconcile</span> himself unto his <span class=\"wl wl-kjv\" data-code=\"H113\">master?</span> should it not be with the <span class=\"wl wl-kjv\" data-code=\"H7218\">heads</span> of these <span class=\"wl wl-kjv\" data-code=\"H582\">men?</span>","5":"Is not this <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> of whom they <span class=\"wl wl-kjv\" data-code=\"H6030\">sang</span> one to another in <span class=\"wl wl-kjv\" data-code=\"H4246\">dances,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H5221\">slew</span> his <span class=\"wl wl-kjv\" data-code=\"H505\">thousands,</span> and <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> his ten <span class=\"wl wl-kjv\" data-code=\"H7233\">thousands?</span>","6":"Then <span class=\"wl wl-kjv\" data-code=\"H397\">Achish</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Surely, as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> thou hast been <span class=\"wl wl-kjv\" data-code=\"H3477\">upright,</span> and thy going <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> and thy coming <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> with me in the <span class=\"wl wl-kjv\" data-code=\"H4264\">host</span> is <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> in my <span class=\"wl wl-kjv\" data-code=\"H5869\">sight:</span> for I have not <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> in thee since the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of th ">know</span> that thou art <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> in my <span class=\"wl wl-kjv\" data-code=\"H5869\">sight,</span> as an <span class=\"wl wl-kjv\" data-code=\"H4397\">angel</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> notwithstanding the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> have <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> He shall not go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> with us to the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle.</span>","10":"Wherefore now rise up <span class=\"wl wl-kjv\" data-code=\"H7925\">early</span> in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning</span> with thy <span class=\"wl wl-kjv\" data-code=\"H113\">master's</span> <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> that are <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> with thee: and as soon as ye be up <span class=\"wl wl-kjv\" data-code=\"H7925\">early</span> in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning,</span> and have <span class=\"wl wl-kjv\" data-code=\"H215\">light,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">depart.</span>","11":"So <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> and his <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> rose up <span class=\"wl wl-kjv\" data-code=\"H7925\">early</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">depart</span> in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning,</span> to <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> into the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines.</span> And the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H315 // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;

}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {

  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};

function concordantieHtml(data) {

    data.weergaven.map(w => {

      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);

      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {

  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;

      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }

        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;

  return `<div class="tsk-kop">Bijbelverklaringen</div>` +

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>

    } else {

    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}

    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
