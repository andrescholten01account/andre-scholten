een boom, dan de mensen alleen, die het zegel van God niet aan hun voorhoofden hebben. En hun werd macht gegeven, niet dat zij hen zouden doden, maar dat zij door hen gepijnigd zouden worden vijf maanden; en hun pijniging was als de pijniging van een schorpioen, wanneer hij een mens gestoken heeft. En in die dagen zullen de mensen de dood zoeken, en zullen die niet vinden; en zij zullen ernaar verlangen te sterven, en de dood zal van hen wegvluchten.", "Joh 14:21": "Wie Mijn geboden heeft, en ze bewaart, die is het die Mij liefheeft; en wie Mij liefheeft, zal door Mijn Vader geliefd worden; en Ik zal hem liefhebben, en Ik zal Mijzelf aan hem openbaren.", "Joz 21:45": "Er viel niet één woord weg van al de goede woorden, die de HEERE gesproken had tot het huis van Israël; het kwam allemaal uit.", "Richt 6:14": "Toen keerde de HEERE Zich tot hem, en zei: Ga heen in deze kracht van u, en u zult Israël uit de hand van de Midianieten verlossen; heb Ik u niet gezonden?", "Jes 48:11": "Om Mijnentwil, om Mijnentwil zal Ik het doen, want hoe zou Hij ontheiligd worden? En Ik zal Mijn eer aan geen ander geven.", "Mark 12:1-9": "En Hij begon door gelijkenissen tegen hen te spreken: Een man plantte een wijngaard, en zette er een omheining omheen, en groef een wijnpersbak, en bouwde een toren, en verhuurde hem aan de wijnbouwers, en reisde naar het buitenland. En toen het de tijd was, stuurde hij een dienaar naar de wijnbouwers, opdat hij van de wijnbouwers iets van de vrucht van de wijngaard zou ontvangen. Maar zij grepen hem, en sloegen hem, en stuurden hem met lege handen weg.", "Ezech 20:9": "Doch Ik deed het om Mijn Naam, opdat die niet ontheiligd zou worden voor de ogen van de heidenvolken, in wier midden zij waren; aan wie Ik Mij, voor hun ogen, bekend heb gemaakt, door hen uit Egypteland uit te leiden.", "1 Petr 3:12": "Want de ogen van de Heere zijn over de rechtvaardigen, en Zijn oren gericht op hun gebed; maar het aangezicht van de Heere is tegen hen die kwaad doen.", "Ps 32:3": "Toen ik zweeg, verouderden mijn beenderen, in mijn brullen de hele dag.", "Num 15:38-40": "Spreek tot de kinderen van Israël en zeg tot hen: Dat zij zich snoertjes maken aan de hoeken van hun kleren, bij hun geslachten; en op het snoertje van de hoek zullen zij een hemelsblauwe draad zetten. En het zal voor u aan de snoertjes zijn, opdat u het aanziet en aan al de geboden van de HEERE denkt en die doet; en dat u niet afdwaalt naar uw eigen hart en naar uw eigen ogen, waar u achteraan hoereert; Opdat u denkt aan en doet al Mijn geboden, en voor uw God heilig bent.", "Mark 8:36": "Want wat zou het de mens baten als hij de hele wereld zou winnen, en schade zou lijden aan zijn ziel?", "Job 9:32": "Want Hij is geen man zoals ik, die ik antwoorden zou, zodat wij samen voor het gericht zouden komen.", "Neh 1:7": "Wij hebben het helemaal tegen U verdorven; en wij hebben niet gehouden de geboden, noch de inzettingen, noch de rechten, die U Uw dienaar Mozes geboden hebt.", "1 Kon 18:24": "Roep u dan de naam van uw god aan, en ik zal de Naam van de HEERE aanroepen; en de God Die door vuur antwoorden zal, Die zal God zijn. En heel het volk antwoordde en zei: Dat is goed gezegd.", "Klaagl 4:22": "Thau. Uw ongerechtigheid heeft een einde, o dochter van Sion! Hij zal u niet meer gevangen laten wegvoeren; maar uw ongerechtigheid, o dochter van Edom! zal Hij bezoeken; Hij zal uw zonden aan het licht brengen.", "Jes 2:8": "Ook is hun land vervuld met afgoden; voor het werk van hun handen buigen zij zich neer, voor wat hun vingers gemaakt hebben.", "Matt 22:14": "Want velen zijn geroepen, maar weinigen uitverkoren.", "1 Sam 11:12-15": "Toen zei het volk tegen Samuël: Wie is hij die zei: Zou Saul over ons regeren? Geef hier die mannen, dan doden wij hen. Maar Saul zei: Er zal op deze dag geen man gedood worden, want de HEERE heeft heden een verlossing in Israël bewerkt. Verder zei Samuël tegen het volk: Komt, laten wij naar Gilgal gaan, en het koninkrijk daar vernieuwen.", "Luk 1:54": "Hij heeft Israël, Zijn knecht, opgenomen, om Zijn barmhartigheid te gedenken,", "Deut 5:25-29": "Maar nu, waarom zouden wij sterven? Want dit grote vuur zou ons verteren; als wij nog langer de stem van de HEERE, onze God, blijven horen, zouden wij sterven. Want wie is er van alle vlees, die de stem van de levende God, sprekend uit het midden van het vuur, gehoord heeft zoals wij, en is levend gebleven? Nader u, en hoor alles wat de HEERE, onze God, zeggen zal; en spreek u tot ons alles wat de HEERE, onze God, tot u spreken zal, en wij zullen het horen en doen.", "Amos 9:1-5": "Ik zag de Heere staan op het altaar, en Hij zei: Sla die knop, zodat de posten beven, en kloof ze allen in het hoofd; en Ik zal hun achterste met het zwaard doden; wie van hen probeert te vluchten, zal niet ontkomen, en wie van hen probeert te ontkomen, zal niet gered worden. Al groeven zij tot in het graf, dan zal Mijn hand ze vandaar halen, en al klommen zij in de hemel, dan zal Ik ze vandaar doen neerdalen. En al verstopten zij zich op de top van de Karmel, dan zal Ik ze opsporen en vandaar halen; en al verborgen zij zich voor Mijn ogen op de bodem van de zee, dan zal Ik vandaar de slang gebieden, die zal ze bijten.", "Ps 9:11": "En die Uw Naam kennen, zullen op U vertrouwen, omdat Gij, HEERE, niet hebt verlaten degenen, die U zoeken.", "Openb 3:11": "Zie, Ik kom haastig; houd vast wat u hebt, opdat niemand uw kroon neemt.", "Luk 6:49": "Maar wie het gehoord heeft en het niet gedaan heeft, is als een mens die een huis bouwde op de aarde zonder fundament; de waterstroom sloeg ertegen aan, en het viel meteen om, en de val van dat huis was groot.", "1 Sam 6:6-18": "Waarom toch zou u uw hart verharden, zoals de Egyptenaars en farao hun hart verhard hebben? Hebben zij niet, toen Hij wonderlijk met hen gehandeld had, hen laten trekken, zodat zij heengingen? Neem dan nu en maak een nieuwe wagen, en twee zogende koeien waarop geen juk gekomen is; span de koeien voor de wagen, en breng hun kalveren van achter hen terug naar huis. Neem dan de ark van de HEERE, en zet haar op de wagen, en leg de gouden kleinoden die u Hem als schuldoffer teruggeeft in een koffertje aan haar zijde; en zend haar weg, zodat zij vertrekt.", "Hand 17:23": "Want toen ik door de stad liep en uw heiligdommen bekeek, vond ik ook een altaar waarop een opschrift stond: AAN DE ONBEKENDE GOD. Hem dan, Die u niet kent en toch dient, verkondig ik u.", "Mark 6:56": "En waar Hij ook kwam, in dorpen, of steden, of gehuchten, daar legden zij de zieken op de markten, en smeekten Hem dat zij slechts de zoom van Zijn kleed mochten aanraken; en zovelen als Hem aanraakten, werden gezond.", "2 Kor 13:10": "Daarom schrijf ik deze dingen, terwijl ik afwezig ben, opdat ik niet, wanneer ik aanwezig ben, strengheid zou hoeven te gebruiken, naar de macht die de Heere mij gegeven heeft tot opbouw, en niet tot afbraak.", "Joz 10:12": "Toen sprak Jozua tot de HEERE, op de dag toen de HEERE de Amorieten voor het aangezicht van de kinderen van Israël overgaf, en hij zei voor de ogen van de Israëlieten: Zon, sta stil te Gibeon, en u, maan, in het dal van Ajalon!", "Luk 3:17": "Zijn wan is in Zijn hand, en Hij zal Zijn dorsvloer grondig reinigen, en de tarwe zal Hij in Zijn schuur samenbrengen; maar het kaf zal Hij met onblusbaar vuur verbranden.", "Ps 125:5": "Maar die zich neigen tot hun kromme wegen, die zal de HEERE weg doen gaan met de werkers van de ongerechtigheid. Vrede zal over Israël zijn!", "1 Joh 2:28": "En nu, kinderen, blijft in Hem; opdat, wanneer Hij geopenbaard zal zijn, wij vrijmoedigheid hebben, en wij bij Zijn komst niet beschaamd worden voor Hem.", "Ps 122:7": "Vrede zij binnen uw vesting, welvaart in uw paleizen.", "Hand 13:48": "Toen de heidenen dit hoorden, verblijdden zij zich, en prezen het Woord van de Heere; en er geloofden zovelen als er bestemd waren tot het eeuwige leven.", "Jak 1:25": "Maar wie zich verdiept in de volmaakte wet, die van de vrijheid is, en daarbij blijft, die is geen vergeetachtige hoorder geworden, maar een dader van het werk, die zal, zeg ik, gelukzalig zijn in dit zijn doen.", "Spr 10:6-8": "Zegeningen zijn op het hoofd van de rechtvaardige; maar het geweld bedekt de mond van de goddelozen. De gedachtenis aan de rechtvaardige zal tot zegening zijn; maar de naam van de goddelozen zal wegrotten. Wie wijs van hart is, neemt de geboden aan; maar wie dwaas is van lippen, zal ten val komen.", "Ex 8:22": "En Ik zal op die dag het land Gosen, waarin Mijn volk woont, afzonderen, zodat daar geen vermenging van ongedierte is, opdat u weet dat Ik, de HEERE, in het midden van dit land ben.", "Ps 37:1": "Een psalm van David. Aleph. Wind u niet op over de boosdoeners; benijd hen niet die onrecht doen.", "Ps 106:27": "en dat Hij hun nageslacht zou neervellen onder de heidenen, en hen verstrooien zou door de landen.", "1 Tim 5:24": "Van sommige mensen zijn de zonden al vooraf openbaar, en gaan vooruit tot hun veroordeling; en bij sommigen komen zij later aan het licht.", "Ezech 11:13": "Het gebeurde nu, toen ik profeteerde, dat Pelatja, de zoon van Benaja, stierf. Toen viel ik neer op mijn gezicht, en riep met luide stem, en zei: Ach, Heere HEERE! Zult U een volledig einde maken met het overblijfsel van Israël?", "Hos 10:8": "En de hoogten van Aven, Israëls zonde, zullen vernietigd worden; doorns en distels zullen op hun altaren opkomen; en zij zullen tegen de bergen zeggen: Bedek ons! en tegen de heuvels: Val op ons!", "Openb 9:15": "En de vier engelen zijn losgemaakt, die gereed waren gehouden tegen het uur, en dag, en maand, en jaar, opdat zij het derde deel van de mensen zouden doden.", "Hand 3:1-10": "Petrus en Johannes gingen samen op naar de tempel, omtrent het uur van het gebed, het negende uur. En een zekere man, die kreupel was vanaf zijn moeders schoot, werd gedragen; die zetten ze dagelijks aan de deur van de tempel, genaamd de Schone, om een aalmoes te vragen van hen die de tempel ingingen. Toen deze Petrus en Johannes zag, die de tempel zouden ingaan, vroeg hij om een aalmoes te ontvangen.", "Tit 2:1": "Maar u, spreek wat past bij de gezonde leer.", "Matt 22:21": "Zij zeiden tegen Hem: Van de keizer. Toen zei Hij tegen hen: Geef dan aan de keizer wat van de keizer is, en aan God wat van God is.", "Matt 7:13": "Ga in door de nauwe poort; want wijd is de poort, en breed is de weg die naar het verderf leidt, en velen zijn er die daardoor ingaan.", "Openb 14:9-11": "En een derde engel is hen gevolgd, die met luide stem zei: Als iemand het beest aanbidt en zijn beeld, en het merkteken ontvangt aan zijn voorhoofd, of aan zijn hand, die zal ook drinken uit de wijn van de toorn van God, die onvermengd ingeschonken is in de drinkbeker van Zijn toorn; en hij zal gepijnigd worden met vuur en zwavel voor de heilige engelen en voor het Lam. En de rook van hun pijniging gaat op tot in alle eeuwigheid, en zij hebben geen rust, dag en nacht, zij die het beest aanbidden en zijn beeld, en zo iemand het merkteken van zijn naam ontvangt.", "1 Tim 5:17": "De oudsten die goed leiding geven, moeten dubbele eer waardig geacht worden, vooral wie arbeiden in het Woord en de leer.", "Ex 6:26": "Dezen zijn het die tot Farao, de koning van Egypte, spraken, opdat zij de kinderen van Israël uit Egypte leidden; dit is Mozes en Aäron.", "Ezra 9:5-15": "En rond het avondoffer stond ik op uit mijn bedruktheid, nadat ik mijn kleed en mijn mantel gescheurd had; en ik boog mij op mijn knieën, en breidde mijn handen uit tot de HEERE, mijn God; En ik zei: Mijn God, ik ben beschaamd en schaamrood om mijn aangezicht tot U op te heffen, mijn God; want onze ongerechtigheden zijn vermenigvuldigd tot boven ons hoofd, en onze schuld is groot geworden tot aan de hemel. Vanaf de dagen van onze vaderen zijn wij in grote schuld tot op deze dag; en wij zijn om onze ongerechtigheden overgegeven, wij, onze koningen en onze priesters, in de hand van de koningen van de landen, aan het zwaard, aan gevangenschap, en aan roof, en aan schaamte van het aangezicht, zoals het is op deze dag.", "Spr 11:31": "Zie, de rechtvaardige wordt vergolden op de aarde, hoeveel te meer de goddeloze en de zondaar!", "Jes 41:24": "Zie, u bent minder dan niets, en uw werk is erger dan een adder; hij is een gruwel, die u verkiest.", "Ps 102:2": "O HEERE! Hoor mijn gebed, en laat mijn geroep tot U komen.", "Ps 106:44": "Toch zag Hij hun benauwdheid aan, toen Hij hun geschrei hoorde.", "Mal 2:6": "De wet van de waarheid was in zijn mond, en er werd geen onrecht in zijn lippen gevonden; hij wandelde met Mij in vrede en in rechtvaardigheid, en hij bekeerde er velen van ongerechtigheid.", "Hand 14:15": "Mannen, waarom doet u deze dingen? Ook wij zijn mensen net als u, en wij verkondigen u dat u zich van deze nutteloze dingen zou bekeren tot de levende God, Die de hemel, en de aarde, en de zee, en alles wat daarin is, gemaakt heeft;", "Jak 3:16": "Want waar afgunst en eigenbelang is, daar is verwarring en allerlei kwade praktijk.", "1 Sam 5:3": "Maar toen die van Asdod de volgende dag vroeg opstonden, zie, toen was Dagon voorover op de aarde gevallen voor de ark van de HEERE. En zij namen Dagon en zetten hem weer op zijn plaats.", "Lev 26:14-39": "Maar als u Mij niet zult horen, en al deze geboden niet zult doen; En als u Mijn inzettingen smadelijk verwerpt, en als uw ziel van Mijn rechten walgt, zodat u niet al Mijn geboden doet, om Mijn verbond te vernietigen; Dan zal Ik u dit ook doen: Ik zal over u schrik stellen, tering en koorts, die de ogen verteren en de ziel pijnigen; u zult ook uw zaad tevergeefs zaaien, en uw vijanden zullen dat opeten.", "2 Kron 21:7": "Doch de HEERE wilde het huis van David niet te gronde richten, omwille van het verbond dat Hij met David gesloten had; en zoals Hij gezegd had hem en zijn zonen voor altijd een lamp te zullen geven.", "Spr 16:4": "De HEERE heeft alles gemaakt om Zichzelf; ja, ook de goddeloze tot de dag van het kwaad.", "1 Sam 15:30": "Hij dan zei: Ik heb gezondigd; eer mij toch nu voor de oudsten van mijn volk, en voor Israël; en keer met mij terug, dat ik de HEERE, uw God, aanbid.", "Joh 4:36-38": "En wie maait, ontvangt loon, en verzamelt vrucht voor het eeuwige leven; opdat zij zich samen verblijden, zowel wie zaait als wie maait. Want hierin is dat gezegde waar: De één is het die zaait, en de ander die maait. Ik heb u uitgezonden om te maaien wat u niet bewerkt hebt; anderen hebben het bewerkt, en u bent tot hun arbeid toegetreden.", "Deut 10:21": "Hij is uw lof, en Hij is uw God. Die bij u deze grote en ontzagwekkende dingen gedaan heeft, die uw ogen gezien hebben.", "Matt 24:41": "Er zullen twee vrouwen malen bij de molen: de één zal aangenomen worden, en de ander zal achtergelaten worden.", "Richt 9:18": "maar u bent vandaag opgestaan tegen het huis van mijn vader, en hebt zijn zonen, zeventig mannen, op één steen gedood; en u hebt Abimelech, een zoon van zijn dienstmaagd, koning gemaakt over de burgers van Sichem, omdat hij uw broer is);", "Deut 32:46": "Zei hij tegen hen: Zet uw hart op al de woorden, die ik heden onder u betuig, dat u ze uw kinderen gebieden zult, dat zij nauwlettend zullen doen al de woorden van deze wet.", "Hos 12:15": "Efraïm daarentegen heeft Hem zeer bitter vertoornd; daarom zal Hij zijn bloed op hem laten komen, en zijn Heere zal hem zijn smaad vergelden.", "Ps 86:3": "Wees mij genadig, Heere! want ik roep tot U de hele dag.", "Rom 3:3": "Want wat is het, al zijn sommigen ongelovig geweest? Zal hun ongeloof het geloof van God tenietdoen?", "Jes 5:4": "Wat is er meer te doen aan Mijn wijngaard, wat Ik daaraan niet gedaan heb? Waarom heb Ik verwacht dat hij goede druiven voortbrengen zou, terwijl hij stinkende druiven heeft voortgebracht?", "Deut 30:19": "Ik neem heden tegen u de hemel en de aarde tot getuigen; het leven en de dood heb ik u voorgesteld, de zegen en de vloek! Kies dan het leven, opdat u leeft, u en uw nageslacht;", "Jes 26:16": "HEERE, in benauwdheid hebben zij U bezocht; zij hebben hun stil gebed uitgestort, toen Uw tuchtiging over hen was.", "Openb 3:3": "Bedenk dan hoe u het ontvangen en gehoord hebt, en bewaar het, en bekeer u. Als u dan niet waakt, zal Ik over u komen als een dief, en u zult niet weten op welk uur Ik over u komen zal.", "Matt 24:50": "dan zal de heer van die dienstknecht komen op een dag waarop hij hem niet verwacht, en op een uur dat hij niet weet;", "1 Kor 6:10": "Vergis u niet; hoereerders, afgodendienaars, overspelers, ontuchtigen, mannen die bij mannen liggen, dieven, hebzuchtigen, dronkaards, geen lasteraars, geen rovers, zullen het Koninkrijk van God beërven.", "Jer 13:14": "En Ik zal hen tegen elkaar te pletter slaan, de een tegen de ander, zowel de vaders als de kinderen samen, spreekt de HEERE; Ik zal geen medelijden hebben, en niet sparen, en Mij niet ontfermen, zodat Ik hen zal verderven.", "Joz 11:11": "En zij versloegen alle mensen die daarin waren, met de scherpte van het zwaard, ze met de ban treffend; er bleef niets over dat adem had; en Hazor verbrandde hij met vuur.", "Rom 8:28-30": "En wij weten dat voor hen die God liefhebben, alle dingen meewerken ten goede, namelijk voor hen die naar Zijn voornemen geroepen zijn. Want die Hij van tevoren gekend heeft, die heeft Hij ook van tevoren bestemd om gelijkvormig te zijn aan het beeld van Zijn Zoon, opdat Hij de Eerstgeborene zou zijn onder veel broeders. En die Hij van tevoren bestemd heeft, die heeft Hij ook geroepen; en die Hij geroepen heeft, die heeft Hij ook gerechtvaardigd; en die Hij gerechtvaardigd heeft, die heeft Hij ook verheerlijkt.", "2 Joh 1:1": "De oudste aan de uitverkoren vrouw en aan haar kinderen, die ik in waarheid liefheb, en niet alleen ik, maar ook allen die de waarheid gekend hebben;", "Ps 135:4": "Want de HEERE heeft Zich Jakob verkoren, Israël tot Zijn eigendom.", "Ps 40:5": "Gelukkig is de man die de HEERE tot zijn vertrouwen stelt, en niet omziet naar de hoogmoedigen, en die tot leugen afwijken.", "Ef 2:10": "Want wij zijn Zijn maaksel, geschapen in Christus Jezus tot goede werken, die God voorbereid heeft, opdat wij daarin zouden wandelen.", "Rom 2:21-23": "Die dan een ander leert, leert u uzelf niet? Die predikt dat men niet zal stelen, steelt u? Die zegt dat men geen overspel zal doen, doet u overspel? Die van de afgoden een afkeer hebt, plundert u het heilige? Die op de wet roemt, oneert u God door de overtreding van de wet?", "Hebr 3:6-8": "Maar Christus, als de Zoon over Zijn eigen huis; Wiens huis wij zijn, als wij maar de vrijmoedigheid en de roem van de hoop tot het einde toe onwrikbaar vasthouden. Daarom, zoals de Heilige Geest zegt: Heden, als u Zijn stem hoort, Verhard uw harten niet, zoals bij de verbittering, op de dag van de beproeving, in de woestijn;", "1 Kon 21:20": "En Achab zei tegen Elia: Hebt u mij gevonden, o mijn vijand? En hij zei: Ik heb u gevonden, omdat u uzelf verkocht hebt om te doen wat kwaad is in de ogen van de HEERE.", "Spr 11:21": "Hand aan hand zal de boze niet onschuldig blijven; maar het nageslacht van de rechtvaardigen zal ontkomen.", "Spr 13:5": "De rechtvaardige haat leugentaal; maar de goddeloze maakt zich stinkend, en doet zich schaamte aan.", "1 Petr 1:13": "Omgord daarom de lenden van uw verstand, wees nuchter, en hoop volkomen op de genade die u gebracht wordt bij de openbaring van Jezus Christus.", "Luk 1:73": "en aan de eed die Hij Abraham, onze vader, gezworen heeft, om ons te geven", "1 Sam 15:22": "Doch Samuël zei: Heeft de HEERE evenveel behagen in brandoffers en slachtoffers, als in het gehoorzamen aan de stem van de HEERE? Zie, gehoorzamen is beter dan slachtoffer, opmerken beter dan het vet van rammen.", "Hos 12:3": "Ook heeft de Heere een twist met Juda, en Hij zal bezoeking doen over Jakob naar zijn wegen, naar zijn handelingen zal Hij hem vergelden.", "Jes 64:5-7": "U ontmoet de vrolijke, en die gerechtigheid doet, hun die aan U denken op Uw wegen; zie, U was verbolgen, omdat wij gezondigd hebben; daarin is de eeuwigheid, opdat wij behouden werden. Doch wij allen zijn als een onreine, en al onze gerechtigheden zijn als een wegwerpkleed; en wij allen vallen af als een blad, en onze misdaden voeren ons weg als een wind. En er is niemand, die Uw Naam aanroept, die zichzelf opwekt, dat hij U aangrijpt; want U verbergt Uw aangezicht voor ons, en U doet ons smelten, door middel van onze ongerechtigheden."}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H559\">Toen</span> zei <span class=\"wl\" data-l=\"L2\" data-code=\"H8050\">Samuël</span> tegen heel <span class=\"wl\" data-l=\"L3\" data-code=\"H3478\">Israël</span>: <span class=\"wl\" data-l=\"L4\" data-code=\"H2009\">Zie</span>, <span class=\"wl\" data-l=\"L5\" data-code=\"H6963\">ik</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H6963\">heb</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H6963\">naar</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H6963\">uw</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H6963\">stem</span> geluisterd <span class=\"wl\" data-l=\"L6\" data-code=\"H3605\">in</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H3605\">alles</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H834\">wat</span> u <span class=\"wl\" data-l=\"L1\" data-code=\"H559\">mij</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H559\">gezegd</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H559\">hebt</span>, <span class=\"wl\" data-l=\"L8\" data-code=\"H4428\">en</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H4428\">ik</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H4428\">heb</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H4428\">een</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H4428\">koning</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H4428\">over</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H4427\">u</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H4427\">gezet</span>.", "2": "<span class=\"wl\" data-l=\"L1\" data-code=\"H6258\">En</span> <span class=\"wl\" L4\" data-code=\"H3824\">hart</span>; <span class=\"wl\" data-l=\"L5\" data-code=\"H3588\">want</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H7200\">zie</span>, <span class=\"wl\" data-l=\"L7\" data-code=\"H834\">hoe</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H1431\">grote</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H1431\">dingen</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H1431\">Hij</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H1431\">bij</span> u <span class=\"wl\" data-l=\"L8\" data-code=\"H1431\">gedaan</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H1431\">heeft</span>!", "25": "<span class=\"wl\" data-l=\"L1\" data-code=\"H518\">Maar</span> als <span class=\"wl\" data-l=\"L2\" data-code=\"H7489\">u</span> toch <span class=\"wl\" data-l=\"L3\" data-code=\"H7489\">kwaad</span> blijft doen, <span class=\"wl\" data-l=\"L4\" data-code=\"H859\">zult</span> u, evengoed <span class=\"wl\" data-l=\"L5\" data-code=\"H1571\">als</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H1571\">uw</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H4428\">koning</span>, <span class=\"wl\" data-l=\"L7\" data-code=\"H5595\">omkomen</span>."}, "koppeling_kjv": {"1": "And <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> Behold, I have <span class=\"wl wl-kjv\" data-code=\"H8085\">hearkened</span> unto your <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> in all that ye <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me, and have <span class=\"wl wl-kjv\" data-code=\"H4427\">made</span> a <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> over you.", "2": "And now, behold, the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">walketh</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> you: and I am <span class=\"wl wl-kjv\" data-code=\"H2204\">old</span> and <span class=\"wl wl-kjv\" data-code=\"H7867\">grayheaded;</span> and, behold, my <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> are with you: and I have <span class=\"wl wl-kjv\" data-code=\"H1980\">walked</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> you from my <span class=\"wl wl-kjv\" data-code=\"H5271\">childhood</span> unto this <span class=\"wl wl-kjv\" data-code=\"H3117\">day.</span>", "3": "Behold, here I am: <span class=\"wl wl-kjv\" data-code=\"H6030\">witness</span> against me before the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and before his <span class=\"wl wl-kjv\" data-code=\"H4899\">anointed:</span> whose <span class=\"wl wl-kjv\" data-code=\"H7794\">ox</span> have I <span class=\"wl wl-kjv\" data-code=\"H3947\">taken?</span> or whose <span class=\"wl wl-kjv\" data-code=\"H2543\">ass</span> have I <span class=\"wl wl-kjv\" data-code=\"H3947\">taken?</span> or whom have I <span class=\"wl wl-kjv\" data-code=\"H6231\">defrauded?</span> whom have I <span class=\"wl wl-kjv\" data-code=\"H7533\">oppressed?</span> or of whose <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> have I received any <span class=\"wl wl-kjv\" data-code=\"H3724\">bribe</span> to <span class=\"wl wl-kjv\" data-code=\"H5956\">blind</span> mine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> therewith? and I will <span class=\"wl wl-kjv\" data-code=\"H7725\">restore</span> it you.", "4": "And they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Thou hast not <span class=\"wl wl-kjv\" data-code=\"H6231\">defrauded</span> us, nor <span class=\"wl wl-kjv\" data-code=\"H7533\">oppressed</span> us, neither hast thou <span class=\"wl wl-kjv\" data-code=\"H3947\">taken</span> <span class=\"wl wl-kjv\" data-code=\"H3972\">ought</span> of any <span class=\"wl wl-kjv\" data-code=\"H376\">man's</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hand.</span>", "5": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is <span class=\"wl wl-kjv\" data-code=\"H5707\">witness</span> against you, and his <span class=\"wl wl-kjv\" data-code=\"H4899\">anointed</span> is <span class=\"wl wl-kjv\" data-code=\"H5707\">witness</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> that ye have not <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> <span class=\"wl wl-kjv\" data-code=\"H3972\">ought</span> in my <span class=\"wl wl-kjv\" data-code=\"H3027\">hand.</span> And they <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> He is <span class=\"wl wl-kjv\" data-code=\"H5707\">witness.</span>", "6": "And <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> It is the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> that <span class=\"wl wl-kjv\" data-code=\"H6213\">advanced</span> <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> and <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron,</span> and that <span class=\"wl wl-kjv\" data-code=\"H5927\">brought</span> ➔ your <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt.</span>", "7": "Now therefore stand <span class=\"wl wl-kjv\" data-code=\"H3320\">still,</span> that I may <span class=\"wl wl-kjv\" data-code=\"H8199\">reason</span> with you <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of all the righteous <span class=\"wl wl-kjv\" data-code=\"H6666\">acts</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> which he <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> to you and to your <span class=\"wl wl-kjv\" data-code=\"H1\">fathers.</span>", "8": "When <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> was <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> into <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and your <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> <span class=\"wl wl-kjv\" data-code=\"H2199\">cried</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> then the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> and <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron,</span> which brought <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> your <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> out of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and made them <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> in this <span class=\"wl wl-kjv\" data-code=\"H4725\">place.</span>", "9": "And when they <span class=\"wl wl-kjv\" data-code=\"H7911\">forgat</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> their <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> he <span class=\"wl wl-kjv\" data-code=\"H4376\">sold</span> them into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H5516\">Sisera,</span> <span class=\"wl wl-kjv\" data-code=\"H8269\">captain</span> of the <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> of <span class=\"wl wl-kjv\" data-code=\"H2674\">Hazor,</span> and into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines,</span> and into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab,</span> and they <span class=\"wl wl-kjv\" data-code=\"H3898\">fought</span> against them.", "10": "And they <span class=\"wl wl-kjv\" data-code=\"H2199\">cried</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> We have <span class=\"wl wl-kjv\" data-code=\"H2398\">sinned,</span> because we have <span class=\"wl wl-kjv\" data-code=\"H5800\">forsaken</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and have <span class=\"wl wl-kjv\" data-code=\"H5647\">served</span> <span class=\"wl wl-kjv\" data-code=\"H1168\">Baalim</span> and <span class=\"wl wl-kjv\" data-code=\"H6252\">Ashtaroth:</span> but now <span class=\"wl wl-kjv\" data-code=\"H5337\">deliver</span> us out of the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of our <span class=\"wl wl-kjv\" data-code=\"H341\">enemies,</span> and we will <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> thee.", "11": "And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H3378\">Jerubbaal,</span> and <span class=\"wl wl-kjv\" data-code=\"H917\">Bedan,</span> and <span class=\"wl wl-kjv\" data-code=\"H3316\">Jephthah,</span> and <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel,</span> and <span class=\"wl wl-kjv\" data-code=\"H5337\">delivered</span> you out of the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of your <span class=\"wl wl-kjv\" data-code=\"H341\">enemies</span> on every <span class=\"wl wl-kjv\" data-code=\"H5439\">side,</span> and ye <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelled</span> <span class=\"wl wl-kjv\" data-code=\"H983\">safe.</span>", "12": "And when ye <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that <span class=\"wl wl-kjv\" data-code=\"H5176\">Nahash</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> against you, ye <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me, Nay; but a <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> shall <span class=\"wl wl-kjv\" data-code=\"H4427\">reign</span> over us: when the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> was your <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span>", "13": "Now therefore behold the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> whom ye have <span class=\"wl wl-kjv\" data-code=\"H977\">chosen,</span> and whom ye have <span class=\"wl wl-kjv\" data-code=\"H7592\">desired!</span> and, behold, the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> a <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> over you.", "14": "If ye will <span class=\"wl wl-kjv\" data-code=\"H3372\">fear</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> him, and <span class=\"wl wl-kjv\" data-code=\"H8085\">obey</span> his <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> and not <span class=\"wl wl-kjv\" data-code=\"H4784\">rebel</span> against the <span class=\"wl wl-kjv\" data-code=\"H6310\">commandment</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> then shall both ye and also the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> that <span class=\"wl wl-kjv\" data-code=\"H4427\">reigneth</span> over you continue <span class=\"wl wl-kjv\" data-code=\"H310\">following</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span>", "15": "But if ye will not <span class=\"wl wl-kjv\" data-code=\"H8085\">obey</span> the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> but <span class=\"wl wl-kjv\" data-code=\"H4784\">rebel</span> against the <span class=\"wl wl-kjv\" data-code=\"H6310\">commandment</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> then shall the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> be against you, as it was against your <span class=\"wl wl-kjv\" data-code=\"H1\">fathers.</span>", "16": "Now <span class=\"wl wl-kjv\" data-code=\"H1571\">therefore</span> <span class=\"wl wl-kjv\" data-code=\"H3320\">stand</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> this <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">thing,</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> before your <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes.</span>", "17": "Is it not <span class=\"wl wl-kjv\" data-code=\"H2406\">wheat</span> <span class=\"wl wl-kjv\" data-code=\"H7105\">harvest</span> to <span class=\"wl wl-kjv\" data-code=\"H3117\">day?</span> I will <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H5414\">send</span> <span class=\"wl wl-kjv\" data-code=\"H6963\">thunder</span> and <span class=\"wl wl-kjv\" data-code=\"H4306\">rain;</span> that ye may <span class=\"wl wl-kjv\" data-code=\"H3045\">perceive</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> that your <span class=\"wl wl-kjv\" data-code=\"H7451\">wickedness</span> is <span class=\"wl wl-kjv\" data-code=\"H7227\">great,</span> which ye have <span class=\"wl wl-kjv\" da /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';

}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;

    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
