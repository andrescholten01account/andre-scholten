:"1 Johannes","href":"../../1-johannes/1/"},{"naam":"2 Johannes","href":"../../2-johannes/1/"},{"naam":"3 Johannes","href":"../../3-johannes/1/"},{"naam":"Judas","href":"../../judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Toen zei Samuël tegen heel Israël: Zie, ik heb naar uw stem geluisterd in alles wat u mij gezegd hebt, en ik heb een koning over u gezet.","2":"En nu, zie, daar trekt de koning voor uw ogen heen, en ik ben oud en grijs geworden, en zie, mijn zonen zijn bij u; en ik heb voor uw ogen gewandeld van mijn jeugd af tot vandaag toe.","3":"Zie, *hier* ben ik, getuig tegen mij voor de HEERE, en voor Zijn gezalfde: van wie heb ik een os genomen, en van wie heb ik een ezel genomen, en wie heb ik onrecht aangedaan, wie heb ik onderdrukt, en uit wiens hand heb ik een geschenk genomen om daarmee mijn ogen dicht te doen? Dan zal ik het u teruggeven.","4":"Toen zeiden zij: U hebt ons geen onrecht aangedaan, en u hebt ons niet onderdrukt, en u hebt van niemands hand iets genomen.","5":"Toen zei hij tegen hen: De HEERE is Getuige tegen u, en Zijn gezalfde is vandaag getuige, dat u in mijn hand niets gevonden hebt! En *het volk* zei: Hij is Getuige!","6":"Verder zei Samuël tegen het volk: Het is de HEERE, Die Mozes en Aäron aangesteld heeft, en Die uw vaders uit Egypteland opgevoerd heeft.","7":"En nu, ga *hier* staan, zodat ik met u in het gericht ga, voor het aangezicht van de HEERE, over al de rechtvaardige daden van de HEERE, die Hij aan u en aan uw vaderen gedaan heeft.","8":"Nadat Jakob in Egypte gekomen was, riepen uw vaders tot de HEERE; en de HEERE zond Mozes en Aäron, en zij leidden uw vaders uit Egypte, en lieten hen op deze plaats wonen.","9":"Maar zij vergaten de HEERE, hun God; zo verkocht Hij hen in de hand van Sisera, de legeraanvoerder van Hazor, en in de hand van de Filistijnen, en in de hand van de koning van de Moabieten, die tegen hen streden.","10":"En zij riepen tot de HEERE, en zeiden: Wij hebben gezondigd, omdat wij de HEERE verlaten hebben, en de Baäls en Astharoths gediend hebben; en nu, red ons uit de hand van onze vijanden, en wij zullen U dienen.","11":"En de HEERE zond Jerubbaäl, en Bedan, en Jeftha, en Samuël, en Hij redde u uit de hand van uw vijanden rondom, zodat u zeker woonde.","12":"Toen u nu zag dat Nahas, de koning van de kinderen van Ammon, tegen u kwam, zei u tegen mij: Nee, maar een koning zal over ons regeren; terwijl toch de HEERE, uw God, uw Koning was.","13":"En nu, zie daar de koning die u gekozen hebt, die u begeerd hebt; en zie, de HEERE heeft een koning over u gezet.","14":"Als u de HEERE zult vrezen, en Hem dienen, en naar Zijn stem luisteren, en tegen het bevel van de HEERE niet opstandig bent, dan zult u, zowel u als de koning die over u regeren zal, achter de HEERE, uw God, aan blijven.","15":"Maar als u naar de stem van de HEERE niet zult luisteren, maar tegen het bevel van de HEERE opstandig bent, dan zal de hand van de HEERE tegen u zijn, zoals tegen uw vaders.","16":"Ga nu ook *hier* staan, en zie dit grote wonder, dat de HEERE voor uw ogen doen zal.","17":"Is het niet vandaag de tarweoogst? Ik zal tot de HEERE roepen, en Hij zal donder en regen geven; weet dan, en zie, dat uw kwaad groot is, dat u voor de ogen van de HEERE gedaan hebt, door voor u een koning te begeren.","18":"Toen Samuël de HEERE aanriep, gaf de HEERE die dag donder en regen; daarom vreesde heel het volk de HEERE en Samuël zeer.","19":"En heel het volk zei tegen Samuël: Bid voor uw knechten tot de HEERE, uw God, dat wij niet sterven; want boven al onze zonden hebben wij dit kwaad daaraan toegevoegd, dat wij voor ons een koning begeerd hebben.","20":"Toen zei Samuël tegen het volk: Vrees niet, u hebt al dit kwaad gedaan; maar wijk niet af van achter de HEERE, maar dien de HEERE met uw hele hart.","21":"En wijk niet af; want dan zou u de nietige afgoden achterna gaan, die niet baten, noch verlossen, want zij zijn nietig.","22":"Want de HEERE zal Zijn volk niet verlaten, omwille van Zijn grote Naam, omdat het de HEERE behaagd heeft, u tot een volk voor Zichzelf te maken.","23":"Wat mij aangaat, het zij verre van mij, dat ik tegen de HEERE zou zondigen door op te houden voor u te bidden; maar ik zal u de goede en rechte weg leren.","24":"Vrees alleen de HEERE, en dien Hem trouw met uw hele hart; want zie, hoe grote dingen Hij bij u gedaan heeft!","25":"Maar als u toch kwaad blijft doen, zult u, evengoed als uw koning, omkomen."},"SV":{"1":"Toen zeide Samuël tot gans Israël: Ziet, ik heb naar ulieder stem gehoord in alles, wat gij mij gezegd hebt, en ik heb een koning over u gezet.","2":"En nu, ziet, daar trekt de koning voor uw aangezicht heen, en ik ben oud en grijs geworden, en ziet, mijn zonen zijn bij ulieden; en ik heb voor uw aangezichten gewandeld van mijn jeugd af tot dezen dag toe.","3":"Ziet, *hier* ben ik, betuigt tegen mij voor den HEERE, en voor Zijn gezalfde, wiens os ik genomen heb, en wiens ezel ik genomen heb, en wien ik verongelijkt heb, wien ik onderdrukt heb, en van wiens hand ik een geschenk genomen heb, dat ik mijn ogen van hem zou verborgen hebben; zo zal ik het ulieden wedergeven.","4":"Toen zeiden zij: Gij hebt ons niet verongelijkt, en gij hebt ons niet onderdrukt, en gij hebt van niemands hand iets genomen.","5":"Toen zeide hij tot hen: De HEERE zij een Getuige tegen ulieden, en Zijn gezalfde zij te dezen dage getuige, dat gij in mijn hand niets gevonden hebt! En *het* *volk* zeide: Hij zij Getuige!","6":"Verder zeide Samuël tot het volk: Het is de HEERE, Die Mozes en Aäron gemaakt heeft, en Die uw vaders uit Egypteland opgebracht heeft.","7":"En nu, stelt u *hier*, dat ik met ulieden rechte, voor het aangezicht des HEEREN, over al de gerechtigheden des HEEREN, die Hij aan u en aan uw vaderen gedaan heeft.","8":"Nadat Jakob in Egypte gekomen was, zo riepen uw vaders tot den HEERE; en de HEERE zond Mozes en Aäron, en zij leidden uw vaders uit Egypte, en deden hen aan deze plaats wonen.","9":"Maar zij vergaten den HEERE, hun God; zo verkocht Hij hen in de hand van Sisera, den krijgsoverste, te Hazor, en in de hand der Filistijnen, en in de hand van den koning der Moabieten, die tegen hen streden.","10":"En zij riepen tot den HEERE, en zeiden: Wij hebben gezondigd, dewijl wij den HEERE verlaten, en de Baäls en Astharoths gediend hebben; en nu, ruk ons uit de hand onzer vijanden, en wij zullen U dienen.","11":"En de HEERE zond Jerubbaäl, en Bedan, en Jeftha, en Samuël, en Hij rukte u uit de hand uwer vijanden rondom, alzo dat gij zeker woondet.","12":"Als gij nu zaagt, dat Nahas, de koning van de kinderen Ammons, tegen u kwam, zo zeidet gij tot mij: Neen, maar een koning zal over ons regeren; zo toch de HEERE, uw God, uw Koning was.","13":"En nu, ziet daar den koning, dien gij verkoren hebt, dien gij begeerd hebt; en ziet, de HEERE heeft een koning over ulieden gezet.","14":"Zo gij den HEERE zult vrezen, en Hem dienen, en naar Zijn stem horen, en den mond des HEEREN niet wederspannig zijt, zo zult gijlieden, zowel gij als de koning, die over u regeren zal, achter den HEERE, uw God, zijn.","15":"Doch zo gij naar de stem des HEEREN niet zult horen, maar den mond des HEEREN wederspannig zijn, zo zal de hand des HEEREN, tegen u zijn, als tegen uw vaders.","16":"Ook stelt u nu *hier*, en ziet die grote zaak, die de HEERE voor uw ogen doen zal.","17":"Is het niet vandaag de tarweoogst? Ik zal tot den HEERE roepen, en Hij zal donder en regen geven; zo weet dan, en ziet, dat uw kwaad groot is, dat gij voor de ogen des HEEREN gedaan hebt, dat gij een koning voor u begeerd hebt.","18":"Toen Samuël den HEERE aanriep, zo gaf de HEERE donder en regen te dien dage; daarom vreesde al het volk zeer den HEERE en Samuël.","19":"En al het volk zeide tot Samuël: Bid voor uw knechten den HEERE, uw God, dat wij niet sterven; want boven al onze zonden hebben wij dit kwaad daartoe gedaan, dat wij voor ons een koning begeerd hebben.","20":"Toen zeide Samuël tot het volk: Vreest niet, gij hebt al dit kwaad gedaan; doch wijkt niet van achter den HEERE af, maar dient den HEERE met uw ganse hart.","21":"En wijkt niet af; want gij zoudt de ijdelheden na *volgen*, die niet bevorderlijk zijn, noch verlossen, want zij zijn ijdelheden.","22":"Want de HEERE zal Zijn volk niet verlaten, om Zijns groten Naams wil, dewijl het den HEERE beliefd heeft, ulieden Zich tot een volk te maken.","23":"Wat ook mij aangaat, het zij verre van mij, dat ik tegen den HEERE zou zondigen, dat ik zou aflaten voor ulieden te bidden; maar ik zal u den goeden en rechten weg leren.","24":"Vreest slechts den HEERE, en dient Hem trouwelijk met uw ganse hart; want ziet, hoe grote dingen Hij bij ulieden gedaan heeft!","25":"Maar indien gij voortaan kwaad doet, zo zult gijlieden, als ook uw koning, omkomen."},"KJV":{"1":"And Samuel said unto all Israel, Behold, I have hearkened unto your voice in all that ye said unto me, and have made a king over you.","2":"And now, behold, the king walketh before you: and I am old and grayheaded; and, behold, my sons are with you: and I have walked before you from my childhood unto this day.","3":"Behold, here I am: witness against me before the LORD, and before his anointed: whose ox have I taken? or whose ass have I taken? or whom have I defrauded? whom have I oppressed? or of whose hand have I received any bribe to blind mine eyes therewith? and I will restore it you.","4":"And they said, Thou hast not defrauded us, nor oppressed us, neither hast thou taken ought of any man's hand.","5":"And he said unto them, The LORD is witness against you, and his anointed is witness this day, that ye have not found ought in my hand. And they answered, He is witness.","6":"And Samuel said unto the people, It is the LORD that advanced Moses and Aaron, and that brought ➔ your fathers up out of the land of Egypt.","7":"Now therefore stand still, that I may reason with you before the LORD of all the righteous acts of the LORD, which he did to you and to your fathers.","8":"When Jacob was come into Egypt, and your fathers cried unto the LORD, then the LORD sent Moses and Aaron, which brought forth your fathers out of Egypt, and made them dwell in this place.","9":"And when they forgat the LORD their God, he sold them into the hand of Sisera, captain of the host of Hazor, and into the hand of the Philistines, and into the hand of the king of Moab, and they fought against them.","10":"And they cried unto the LORD, and said, We have sinned, because we have forsaken the LORD, and have served Baalim and Ashtaroth: but now deliver us out of the hand of our enemies, and we will serve thee.","11":"And the LORD sent Jerubbaal, and Bedan, and Jephthah, and Samuel, and delivered you out of the hand of your enemies on every side, and ye dwelled safe.","12":"And when ye saw that Nahash the king of the children of Ammon came against you, ye said unto me, Nay; but a king shall reign over us: when the LORD your God was your king.","13":"Now therefore behold the king whom ye have chosen, and whom ye have desired! and, behold, the LORD hath set a king over you.","14":"If ye will fear the LORD, and serve him, and obey his voice, and not rebel against the commandment of the LORD, then shall both ye and also the king that reigneth over you continue following the LORD your God:","15":"But if ye will not obey the voice of the LORD, but rebel against the commandment of the LORD, then shall the hand of the LORD be against you, as it was against your fathers.","16":"Now therefore stand and see this great thing, which the LORD will do before your eyes.","17":"Is it not wheat harvest to day? I will call unto the LORD, and he shall send thunder and rain; that ye may perceive and see that your wickedness is great, which ye have done in the sight of the LORD, in asking you a king.","18":"So Samuel called unto the LORD; and the LORD sent thunder and rain that day: and all the people greatly feared the LORD and Samuel.","19":"And all the people said unto Samuel, Pray for thy servants unto the LORD thy God, that we die not: for we have added unto all our sins this evil, to ask us a king.","20":"And Samuel said unto the people, Fear not: ye have done all this wickedness: yet turn not aside from following the LORD, but serve the LORD with all your heart;","21":"And turn ye not aside: for then should ye go after vain things, which cannot profit nor deliver; for they are vain.","22":"For the LORD will not forsake his people for his great name's sake: because it hath pleased the LORD to make you his people.","23":"Moreover as for me, God forbid that I should sin against the LORD in ceasing to pray for you: but I will teach you the good and the right way:","24":"Only fear the LORD, and serve him in truth with all your heart: for consider how great things he hath done for you.","25":"But if ye shall still do wickedly, ye shall be consumed, both ye and your king."}},"tsk":{"1":[{"kopje":"Zie","refs":["1 Sam 8:5-8","1 Sam 8:19-22"]},{"kopje":"heb gezet","refs":["1 Sam 10:1","1 Sam 10:24","1 Sam 11:14","1 Sam 11:15"]}],"2":[{"kopje":"trekt","refs":["1 Sam 8:20","Num 27:17"]},{"kopje":"ik ben oud","refs":["1 Sam 8:1","1 Sam 8:5","Ps 71:18","Jes 46:3","Jes 46:4","2 Tim 4:6","2 Petr 1:14"]},{"kopje":"mijn zonen","refs":["1 Sam 2:22","1 Sam 2:29","1 Sam 3:13","1 Sam 3:16","1 Sam 8:3"]},{"kopje":"ik heb gewandeld","refs":["1 Sam 3:19","1 Sam 3:20"]}],"3":[{"kopje":"Zijn gezalfde","refs":["1 Sam 12:5","1 Sam 10:1","1 Sam 24:7","2 Sam 1:14-16","Matt 22:21","Rom 13:1-7"]},{"kopje":"van wie heb ik een os genomen","refs":["Num 16:15","Hand 20:33","2 Kor 12:14","1 Tess 2:5","1 Tess 2:10","1 Petr 5:2"]},{"kopje":"mijn ogen dicht te doen","refs":["Ex 23:8","Deut 16:19"]},{"kopje":"Dan zal ik","refs":["Ex 22:4","Lev 6:4","Luk 19:8"]}],"5":[{"kopje":"De HEERE","refs":["Job 31:35-40","Job 42:7"]},{"kopje":"Zijn gezalfde","refs":["1 Sam 26:9"]},{"kopje":"u niets gevonden hebt","refs":["Joh 18:38","Hand 23:9","Hand 24:16","Hand 24:20","1 Kor 4:4","2 Kor 1:12"]},{"kopje":"in mijn hand","refs":["Ex 22:4","Ps 17:3"]}],"6":[{"kopje":"Het is de HEERE","refs":["Ex 6:25","Neh 9:9-14","Ps 77:20","Ps 77:21","Ps 78:12-72","Ps 99:6","Ps 105:26","Ps 105:41","Jes 63:7-14","Hos 12:14","Micha 6:4"]}],"7":[{"kopje":"gericht","refs":["Jes 1:18","Jes 5:3","Jes 5:4","Ezech 18:25-30","Micha 6:2","Micha 6:3","Hand 17:3"]},{"kopje":"rechtvaardige daden","refs":["Richt 5:11"]}],"8":[{"kopje":"Jakob","refs":["Gen 46:5-7","Num 20:15","Hand 7:15"]},{"kopje":"riepen","refs":["Ex 2:23","Ex 2:24","Ex 3:9"]},{"kopje":"zond Mozes","refs":["1 Sam 12:6","Ex 3:10","Ex 4:14-16","Ex 4:27-31","Ex 6:25"]},{"kopje":"leidden","refs":["Ex 12:51","Ex 14:30","Ex 14:31"]},{"kopje":"lieten hen wonen","refs":["Joz 1:2-4","Joz 1:6","Joz 3:10-13","Ps 44:2-4","Ps 78:54","Ps 78: ss=\"wl wl-kjv\" data-code=\"H1121\">sons</span> are with you: and I have <span class=\"wl wl-kjv\" data-code=\"H1980\">walked</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> you from my <span class=\"wl wl-kjv\" data-code=\"H5271\">childhood</span> unto this <span class=\"wl wl-kjv\" data-code=\"H3117\">day.</span>","3":"Behold, here I am: <span class=\"wl wl-kjv\" data-code=\"H6030\">witness</span> against me before the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and before his <span class=\"wl wl-kjv\" data-code=\"H4899\">anointed:</span> whose <span class=\"wl wl-kjv\" data-code=\"H7794\">ox</span> have I <span class=\"wl wl-kjv\" data-code=\"H3947\">taken?</span> or whose <span class=\"wl wl-kjv\" data-code=\"H2543\">ass</span> have I <span class=\"wl wl-kjv\" data-code=\"H3947\">taken?</span> or whom have I <span class=\"wl wl-kjv\" data-code=\"H6231\">defrauded?</span> whom have I <span class=\"wl wl-kjv\" data-code=\"H7533\">oppressed?</span> or of whose <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> have I received any <span class=\"wl wl-kjv\" data-code=\"H3724\">bribe</span> to <span class=\"wl wl-kjv\" data-code=\"H5956\">blind</span> mine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> therewith? and I will <span class=\"wl wl-kjv\" data-code=\"H7725\">restore</span> it you.","4":"And they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Thou hast not <span class=\"wl wl-kjv\" data-code=\"H6231\">defrauded</span> us, nor <span class=\"wl wl-kjv\" data-code=\"H7533\">oppressed</span> us, neither hast thou <span class=\"wl wl-kjv\" data-code=\"H3947\">taken</span> <span class=\"wl wl-kjv\" data-code=\"H3972\">ought</span> of any <span class=\"wl wl-kjv\" data-code=\"H376\">man's</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hand.</span>","5":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is <span class=\"wl wl-kjv\" data-code=\"H5707\">witness</span> against you, and his <span class=\"wl wl-kjv\" data-code=\"H4899\">anointed</span> is <span class=\"wl wl-kjv\" data-code=\"H5707\">witness</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> that ye have not <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> <span class=\"wl wl-kjv\" data-code=\"H3972\">ought</span> in my <span class=\"wl wl-kjv\" data-code=\"H3027\">hand.</span> And they <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> He is <span class=\"wl wl-kjv\" data-code=\"H5707\">witness.</span>","6":"And <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> It is the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> that <span class=\"wl wl-kjv\" data-code=\"H6213\">advanced</span> <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> and <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron,</span> and that <span class=\"wl wl-kjv\" data-code=\"H5927\">brought</span> ➔ your <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt.</span>","7":"Now therefore stand <span class=\"wl wl-kjv\" data-code=\"H3320\">still,</span> that I may <span class=\"wl wl-kjv\" data-code=\"H8199\">reason</span> with you <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of all the righteous <span class=\"wl wl-kjv\" data-code=\"H6666\">acts</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> which he <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> to you and to your <span class=\"wl wl-kjv\" data-code=\"H1\">fathers.</span>","8":"When <span class=\"wl wl-kjv\" data- /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>

  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
