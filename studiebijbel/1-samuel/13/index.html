en hoorde heel Israël zeggen: Saul heeft de bezetting van de Filistijnen verslagen, en ook is Israël gehaat geworden bij de Filistijnen. Toen werd het volk samengeroepen achter Saul, naar Gilgal.","5":"En de Filistijnen werden verzameld om tegen Israël te strijden, dertigduizend wagens en zesduizend ruiters, en volk in menigte als het zand dat aan de oever van de zee is; en zij trokken op en legerden zich te Michmas, ten oosten van Beth-aven.","6":"Toen de mannen van Israël zagen dat zij in nood waren (want het volk was benauwd), verborg het volk zich in de holen, en in de doornstruiken, en in de rotsen, en in de vestingen, en in de putten.","7":"De Hebreeën nu gingen over de Jordaan naar het land van Gad en Gilead. Saul zelf was nog te Gilgal, en het hele volk volgde hem bevend.","8":"En hij wachtte zeven dagen, tot de tijd die Samuël bepaald had. Toen Samuël niet naar Gilgal kwam, verspreidde het volk zich van hem weg.","9":"Toen zei Saul: Breng mij hier een brandoffer en dankoffers; en hij offerde het brandoffer.","10":"En het gebeurde, toen hij klaar was met het offeren van het brandoffer, zie, dat Samuël kwam; en Saul ging naar buiten, hem tegemoet, om hem te groeten.","11":"Toen zei Samuël: Wat hebt u gedaan? Saul zei: Omdat ik zag dat het volk zich van mij verspreidde, en u niet op de bepaalde dag kwam, en de Filistijnen te Michmas verzameld waren,","12":"zei ik: Nu zullen de Filistijnen tot mij afkomen te Gilgal, en ik heb het aangezicht van de HEERE niet met ernst aangebeden; toen dwong ik mijzelf en heb het brandoffer geofferd.","13":"Toen zei Samuël tegen Saul: U hebt dwaas gedaan; u hebt het gebod van de HEERE, uw God, niet gehouden, dat Hij u geboden had; want de HEERE zou nu uw koningschap over Israël voor eeuwig bevestigd hebben.","14":"Maar nu zal uw koningschap niet blijven bestaan. De HEERE heeft Zich een man gezocht naar Zijn hart, en de HEERE heeft hem bevolen een voorganger te zijn over Zijn volk, omdat u niet gehouden hebt wat de HEERE u geboden had.","15":"Toen stond Samuël op en ging van Gilgal naar Gibea-benjamins; en Saul telde het volk dat bij hem gevonden werd, ongeveer zeshonderd man.","16":"En Saul en zijn zoon Jonathan, en het volk dat bij hen gevonden werd, bleven te Gibea-benjamins; maar de Filistijnen waren te Michmas gelegerd.","17":"En de verwoesters trokken uit het leger van de Filistijnen, in drie groepen; de ene groep sloeg de weg in naar Ofra, naar het land Sual;","18":"en een groep sloeg de weg in naar Beth-horon; en een groep sloeg de weg in naar het gebied dat uitziet op het dal Zeboim, naar de woestijn toe.","19":"En er werd geen smid gevonden in het hele land van Israël; want de Filistijnen hadden gezegd: Anders maken de Hebreeën zwaard of speer.","20":"Daarom moest heel Israël naar de Filistijnen aftrekken, om ieder zijn ploegijzer, of zijn spade, of zijn bijl, of zijn houweel te laten scherpen.","21":"Maar zij hadden tandige vijlen voor hun houwelen, en voor hun spaden, en voor de drietandige vorken, en voor de bijlen, en om de prikkels scherp te maken.","22":"En het gebeurde op de dag van de strijd, dat er geen zwaard of speer gevonden werd in de hand van het hele volk dat bij Saul en bij Jonathan was; maar bij Saul en bij Jonathan, zijn zoon, werden ze wel gevonden.","23":"En het leger van de Filistijnen trok uit naar de doortocht van Michmas."},"SV":{"1":"Saul was een jaar in zijn regering geweest, en het tweede jaar regeerde hij over Israël.","2":"Toen verkoos zich Saul drie duizend *mannen* uit Israël; en er waren bij Saul twee duizend te Michmas en op het gebergte van Beth-el, en duizend waren er bij Jonathan te Gibea-benjamins; en het overige des volks liet hij gaan, een iegelijk naar zijn tent.","3":"Doch Jonathan sloeg de bezetting der Filistijnen, die te Geba was, hetwelk de Filistijnen hoorden. Daarom blies Saul met de bazuin in het ganse land, zeggende: Laat het de Hebreën horen.","4":"Toen hoorde het ganse Israël zeggen: Saul heeft de bezetting der Filistijnen geslagen, en ook is Israël stinkende geworden bij de Filistijnen. Toen werd het volk samengeroepen achter Saul, naar Gilgal.","5":"En de Filistijnen werden verzameld om te strijden tegen Israël, dertig duizend wagens, en zes duizend ruiters, en volk in menigte als het zand, dat aan den oever der zee is; en zij togen op, en legerden zich te Michmas, tegen het oosten van Beth-aven.","6":"Toen de mannen van Israël zagen, dat zij in nood waren ( want het volk was benauwd), zo verborg zich het volk in de spelonken, en in de doornbossen, en in de steenklippen, en in de vestingen, en in de putten.","7":"De Hebreën nu gingen over de Jordaan in het land van Gad en Gilead. Toen Saul nog zelf te Gilgal was, zo kwam al het volk bevende achter hem.","8":"En hij vertoefde zeven dagen, tot den tijd, dien Samuël bestemd had. Als Samuël te Gilgal niet opkwam, zo verstrooide het volk van hem.","9":"Toen zeide Saul: Brengt tot mij herwaarts een brandoffer, en dankofferen; en hij offerde brandoffer.","10":"En het geschiedde, toen hij geëindigd had het brandoffer te offeren, ziet, zo kwam Samuël; en Saul ging uit hem tegemoet, om hem te zegenen.","11":"Toen zeide Samuël: Wat hebt gij gedaan? Saul nu zeide: Omdat ik zag, dat zich het volk van mij verstrooide, en gij op den bestemden tijd der dagen niet kwaamt, en de Filistijnen te Michmas vergaderd waren,","12":"Zo zeide ik: Nu zullen de Filistijnen tot mij afkomen te Gilgal, en ik heb het aangezicht des HEEREN niet ernstelijk aangebeden, zo dwong ik mijzelven, en heb brandoffer geofferd.","13":"Toen zeide Samuël tot Saul: Gij hebt zottelijk gedaan; gij hebt het gebod van den HEERE, uw God, niet gehouden, dat Hij u geboden heeft; want de HEERE zou nu uw rijk over Israël bevestigd hebben tot in eeuwigheid.","14":"Maar nu zal uw rijk niet bestaan. De HEERE heeft Zich een man gezocht naar Zijn hart, en de HEERE heeft hem geboden een voorganger te zijn over Zijn volk, omdat gij niet gehouden hebt, wat u de HEERE geboden had.","15":"Toen maakte zich Samuël op, en hij ging op van Gilgal naar Gibea-benjamins; en Saul telde het volk, dat bij hem gevonden werd, omtrent zeshonderd man.","16":"En Saul en zijn zoon Jonathan, en het volk, dat bij hen gevonden was, bleven te Gibea-benjamins; maar de Filistijnen waren te Michmas gelegerd.","17":"En de verdervers gingen uit het leger der Filistijnen, in drie hopen; de ene hoop keerde zich op den weg naar Ofra, naar het land Sual;","18":"En een hoop keerde zich naar den weg van Beth-horon; en een hoop keerde zich naar den weg der landpale, die naar het dal Zeboim naar de woestijn uitziet.","19":"En er werd geen smid gevonden in het ganse land van Israël; want de Filistijnen hadden gezegd: Opdat de Hebreën geen zwaard noch spies maken.","20":"Daarom moest gans Israël tot de Filistijnen aftrekken, opdat een iegelijk zijn ploegijzer, of zijn spade, of zijn bijl, of zijn houweel scherpen liet.","21":"Maar zij hadden tandige vijlen tot hun houwelen, en tot hun spaden, en tot de drietandige vorken, en tot de bijlen, en tot het stellen der prikkelen.","22":"En het geschiedde ten dage des strijds, dat er geen zwaard noch spies gevonden werd in de hand van het ganse volk, dat bij Saul en bij Jonathan was; doch bij Saul en bij Jonathan, zijn zoon, werden zij gevonden.","23":"En der Filistijnen leger toog naar den doortocht van Michmas."},"KJV":{"1":"Saul reigned one year; and when he had reigned two years over Israel,","2":"Saul chose him three thousand men of Israel; whereof two thousand were with Saul in Michmash and in mount Bethel, and a thousand were with Jonathan in Gibeah of Benjamin: and the rest of the people he sent every man to his tent.","3":"And Jonathan smote the garrison of the Philistines that was in Geba, and the Philistines heard of it. And Saul blew the trumpet throughout all the land, saying, Let the Hebrews hear.","4":"And all Israel heard say that Saul had smitten a garrison of the Philistines, and that Israel also was had in abomination with the Philistines. And the people were called together after Saul to Gilgal.","5":"And the Philistines gathered themselves together to fight with Israel, thirty thousand chariots, and six thousand horsemen, and people as the sand which is on the sea shore in multitude: and they came up, and pitched in Michmash, eastward from Bethaven.","6":"When the men of Israel saw that they were in a strait, (for the people were distressed,) then the people did hide themselves in caves, and in thickets, and in rocks, and in high places, and in pits.","7":"And some of the Hebrews went over Jordan to the land of Gad and Gilead. As for Saul, he was yet in Gilgal, and all the people followed him trembling.","8":"And he tarried seven days, according to the set time that Samuel had appointed: but Samuel came not to Gilgal; and the people were scattered from him.","9":"And Saul said, Bring hither a burnt offering to me, and peace offerings. And he offered the burnt offering.","10":"And it came to pass, that as soon as he had made an end of offering the burnt offering, behold, Samuel came; and Saul went out to meet him, that he might salute him.","11":"And Samuel said, What hast thou done? And Saul said, Because I saw that the people were scattered from me, and that thou camest not within the days appointed, and that the Philistines gathered themselves together at Michmash;","12":"Therefore said I, The Philistines will come down now upon me to Gilgal, and I have not made supplication unto the LORD: I forced myself therefore, and offered a burnt offering.","13":"And Samuel said to Saul, Thou hast done foolishly: thou hast not kept the commandment of the LORD thy God, which he commanded thee: for now would the LORD have established thy kingdom upon Israel for ever.","14":"But now thy kingdom shall not continue: the LORD hath sought him a man after his own heart, and the LORD hath commanded him to be captain over his people, because thou hast not kept that which the LORD commanded thee.","15":"And Samuel arose, and gat him up from Gilgal unto Gibeah of Benjamin. And Saul numbered the people that were present with him, about six hundred men.","16":"And Saul, and Jonathan his son, and the people that were present with them, abode in Gibeah of Benjamin: but the Philistines encamped in Michmash.","17":"And the spoilers came out of the camp of the Philistines in three companies: one company turned unto the way that leadeth to Ophrah, unto the land of Shual:","18":"And another company turned the way to Bethhoron: and another company turned to the way of the border that looketh to the valley of Zeboim toward the wilderness.","19":"Now there was no smith found throughout all the land of Israel: for the Philistines said, Lest the Hebrews make them swords or spears:","20":"But all the Israelites went down to the Philistines, to sharpen every man his share, and his coulter, and his axe, and his mattock.","21":"Yet they had a file for the mattocks, and for the coulters, and for the forks, and for the axes, and to sharpen the goads.","22":"So it came to pass in the day of battle, that there was neither sword nor spear found in the hand of any of the people that were with Saul and Jonathan: but with Saul and with Jonathan his son was there found.","23":"And the garrison of the Philistines went out to the passage of Michmash."}},"tsk":{"1":[{"kopje":"een jaar koning geweest","refs":["Ex 12:5","Micha 6:6"]}],"2":[{"kopje":"koos","refs":["1 Sam 8:11","1 Sam 14:52"]},{"kopje":"Michmas","refs":["1 Sam 13:5","1 Sam 13:23","1 Sam 14:5","1 Sam 14:31","Jes 10:28"]},{"kopje":"te Gibea-benjamins","refs":["1 Sam 10:26","1 Sam 15:34","Joz 18:28","Richt 19:12","2 Sam 21:6","Jes 10:29"]}],"3":[{"kopje":"de bezetting","refs":["1 Sam 10:5","1 Sam 14:1-6","2 Sam 23:14"]},{"kopje":"Geba","refs":["Joz 18:24","Joz 21:17","Jes 10:29","Zach 14:10"]},{"kopje":"blazen","refs":["Richt 3:27","Richt 6:34","2 Sam 2:28","2 Sam 20:1"]}],"4":[{"kopje":"gehaat geworden","refs":["Gen 34:30","Gen 46:34","Ex 5:21","Zac ass=\"wl wl-kjv\" data-code=\"H953\">pits.</span>","7":"And some of the <span class=\"wl wl-kjv\" data-code=\"H5680\">Hebrews</span> went <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan</span> to the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H1410\">Gad</span> and <span class=\"wl wl-kjv\" data-code=\"H1568\">Gilead.</span> As for <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> he was yet in <span class=\"wl wl-kjv\" data-code=\"H1537\">Gilgal,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H310\">followed</span> him <span class=\"wl wl-kjv\" data-code=\"H2729\">trembling.</span>","8":"And he <span class=\"wl wl-kjv\" data-code=\"H3176\">tarried</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days,</span> according to the set <span class=\"wl wl-kjv\" data-code=\"H4150\">time</span> that <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> had appointed: but <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> not to <span class=\"wl wl-kjv\" data-code=\"H1537\">Gilgal;</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> were <span class=\"wl wl-kjv\" data-code=\"H6327\">scattered</span> from him.","9":"And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Bring <span class=\"wl wl-kjv\" data-code=\"H5066\">hither</span> a burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering</span> to me, and peace <span class=\"wl wl-kjv\" data-code=\"H8002\">offerings.</span> And he <span class=\"wl wl-kjv\" data-code=\"H5927\">offered</span> the burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering.</span>","10":"And it came to pass, that as soon as he had made an <span class=\"wl wl-kjv\" data-code=\"H3615\">end</span> of <span class=\"wl wl-kjv\" data-code=\"H5927\">offering</span> the burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering,</span> behold, <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came;</span> and <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> him, that he might <span class=\"wl wl-kjv\" data-code=\"H1288\">salute</span> him.","11":"And <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> What hast thou <span class=\"wl wl-kjv\" data-code=\"H6213\">done?</span> And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Because I <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> were <span class=\"wl wl-kjv\" data-code=\"H5310\">scattered</span> from me, and that thou <span class=\"wl wl-kjv\" data-code=\"H935\">camest</span> not within the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> <span class=\"wl wl-kjv\" data-code=\"H4150\">appointed,</span> and that the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> gathered themselves <span class=\"wl wl-kjv\" data-code=\"H622\">together</span> at <span class=\"wl wl-kjv\" data-code=\"H4363\">Michmash;</span>","12":"Therefore <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> I, The <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> will come <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> now upon me to <span class=\"wl wl-kjv\" data-code=\"H1537\">Gilgal,</span> and I have not made <span class=\"wl wl-kjv\" data-code=\"H2470\">supplication</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">unto</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> I <span class=\"wl wl-kjv\" data-code=\"H662\">forced</span> myself therefore, and <span class=\"wl wl-kjv\" data-code=\"H5927\">offered</span> a burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering.</span>","13":"And <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> Thou hast done <span class=\"wl wl-kjv\" data-code=\"H5528\">foolishly:</span> thou hast not <span class=\"wl wl-kjv\" data-code=\"H8104\">kept</span> the <span class=\"wl wl-kjv\" data-code=\"H4687\">commandment</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> which he <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> thee: for now would the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> have <span class=\"wl wl-kjv\" data-code=\"H3559\">established</span> thy <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdom</span> upon <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H5704\">for</span> <span class=\"wl wl-kjv\" data-code=\"H5769\">ever.</span>","14":"But now thy <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdom</span> shall not <span class=\"wl wl-kjv\" data-code=\"H6965\">continue:</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H1245\">sought</span> him a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> after his own <span class=\"wl wl-kjv\" data-code=\"H3824\">heart,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> him to be <span class=\"wl wl-kjv\" data-code=\"H5057\">captain</span> over his <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> because thou hast not <span class=\"wl wl-kjv\" data-code=\"H8104\">kept</span> that which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> thee.","15":"And <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and gat him <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> from <span class=\"wl wl-kjv\" data-code=\"H1537\">Gilgal</span> unto <span class=\"wl wl-kjv\" data-code=\"H1390\">Gibeah</span> of <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin.</span> And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H6485\">numbered</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that were <span class=\"wl wl-kjv\" data-code=\"H4672\">present</span> with him, about <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men.</span>","16":"And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> and <span class=\"wl wl-kjv\" data-code=\"H3129\">Jonathan</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that were <span class=\"wl wl-kjv\" data-code=\"H4672\">present</span> with them, <span class=\"wl wl-kjv\" data-code=\"H3427\">abode</span> in <span class=\"wl wl-kjv\" data-code=\"H1387\">Gibeah</span> of <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin:</span> but the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> <span class=\"wl wl-kjv\" data-code=\"H2583\">encamped</span> in <span class=\"wl wl-kjv\" data-code=\"H4363\">Michmash.</span>","17":"And the <span class=\"wl wl-kjv\" data-code=\"H7843\">spoilers</span> came <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> in <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H7218\">companies:</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H7218\">company</span> <span class=\"wl wl-kjv\" data-code=\"H6437\">turned</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> that leadeth to <span class=\"wl wl-kjv\" data-code=\"H6084\">Ophrah,</span> unto the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H7777\">Shual:</span>","18":"And <span class=\"wl wl-kjv\" data-code=\"H259\">another</span> <span class=\"wl wl-kjv\" data-code=\"H7218\">company</span> <span class=\"wl wl-kjv\" data-code=\"H6437\">turned</span> the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> to <span class=\"wl wl-kjv\" data-code=\"H1032\">Bethhoron:</span> and <span class=\"wl wl-kjv\" data-code=\"H259\">another</span> <span class=\"wl wl-kjv\" data-code=\"H7218\">company</span> <span class=\"wl wl-kjv\" data-code=\"H6437\">turned</span> to the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of the <span class=\"wl wl-kjv\" data-code=\"H1366\">border</span> that <span class=\"wl wl-kjv\" data-code=\"H8259\">looketh</span> to the <span class=\"wl wl-kjv\" data-code=\"H1516\">valley</span> of <span class=\"wl wl-kjv\" data-code=\"H6650\">Zeboim</span> toward the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness.</span>","19":"Now there was no <span class=\"wl wl-kjv\" data-code=\"H2796\">smith</span> <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> throughout all the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> for the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Lest the <span class=\"wl wl-kjv\" data-code=\"H5680\">Hebrews</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> them <span class=\"wl wl-kjv\" data-code=\"H2719\">swords</span> or <span class=\"wl wl-kjv\" data-code=\"H2595\">spears:</span>","20":"But all the <span class=\"wl wl-kjv\" data-code=\"H3478\">Israelites</span> went <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines,</span> to <span class=\"wl wl-kjv\" data-code=\"H3913\">sharpen</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> his <span class=\"wl wl-kjv\" data-code=\"H4282\">share,</span> and his <span class=\"wl wl-kjv\" data-code=\"H855\">coulter,</span> and his <span class=\"wl wl-kjv\" data-code=\"H7134\">axe,</span> and his <span class=\"wl wl-kjv\" data-code=\"H4281\">mattock.</span>","21":"Yet they had a <span class=\"wl wl-kjv\" data-code=\"H6477\">file</span> for the <span class=\"wl wl-kjv\" data-code=\"H4281\">mattocks,</span> and for the <span class=\"wl wl-kjv\" data-code=\"H855\">coulters,</span> and for the <span class=\"wl wl-kjv\" data-code=\"H7969\">forks,</span> and for the <span class=\"wl wl-kjv\" data-code=\"H7134\">axes,</span> and to <span class=\"wl wl-kjv\" data-code=\"H5324\">sharpen</span> the <span class=\"wl wl-kjv\" data-code=\"H1861\">goads.</span>","22":"So it came to pass in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of <span class=\"wl wl-kjv\" data-code=\"H4421\">battle,</span> that there was neither <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> nor <span class=\"wl wl-kjv\" data-code=\"H2595\">spear</span> <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> in the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of any of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that were with <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> and <span class=\"wl wl-kjv\" data-code=\"H3129\">Jonathan:</span> but with <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> and with <span class=\"wl wl-kjv\" data-code=\"H3129\">Jonathan</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> was there <span class=\"wl wl-kjv\" data-code=\"H4672\">found.</span>","23":"And the <span class=\"wl wl-kjv\" data-code=\"H4673\">garrison</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> to the <span class=\"wl wl-kjv\" data-code=\"H4569\">passage</span> of <span class=\"wl wl-kjv\" data-code=\"H4363\">Michmash.</span>"}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
