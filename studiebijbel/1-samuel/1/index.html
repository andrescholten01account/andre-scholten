m":"1 Johannes","href":"../../1-johannes/1/"},{"naam":"2 Johannes","href":"../../2-johannes/1/"},{"naam":"3 Johannes","href":"../../3-johannes/1/"},{"naam":"Judas","href":"../../judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Er was een man van Ramathaïm-Zofim, van het gebergte van Efraïm, wiens naam was Elkana, een zoon van Jerocham, de zoon van Elihu, de zoon van Tochu, de zoon van Zuf, een Efrathiet.","2":"En hij had twee vrouwen; de naam van de ene was Hanna, en de naam van de andere was Peninna. Peninna nu had kinderen, maar Hanna had geen kinderen.","3":"Deze man ging elk jaar op uit zijn stad om te aanbidden en om te offeren aan de HEERE van de heerscharen[1] te Silo; en daar waren priesters van de HEERE, Hofni en Pinehas, de twee zonen van Eli.","4":"En het gebeurde op die dag, toen Elkana offerde, dat hij aan Peninna, zijn vrouw, en aan al haar zonen en haar dochters delen gaf.","5":"Maar aan Hanna gaf hij een aanzienlijk deel, want hij had Hanna lief; doch de HEERE had haar baarmoeder toegesloten.","6":"En haar tegenpartij tergde haar ook met terging, om haar te ergeren, omdat de HEERE haar baarmoeder toegesloten had.","7":"En zo deed hij jaar op jaar; van toen af dat zij opging naar het huis van de HEERE, zo tergde zij haar steeds; daarom weende zij en at niet.","8":"Toen zei Elkana, haar man: Hanna, waarom weent u, en waarom eet u niet, en waarom is uw hart bedroefd? Ben ik u niet beter dan tien zonen?","9":"Toen stond Hanna op, nadat men in Silo gegeten en gedronken had. En Eli, de priester, zat op een stoel bij een post van de tempel van de HEERE.","10":"Zij dan, bitter bedroefd zijnde, bad tot de HEERE, en zij weende zeer.","11":"En zij deed een gelofte, en zei: HEERE van de heerscharen, als U werkelijk de ellende van Uw dienstmaagd aanziet, en aan mij denkt, en Uw dienstmaagd niet vergeet, maar aan Uw dienstmaagd een zoon geeft, dan zal ik hem aan de HEERE geven al de dagen van zijn leven, en er zal geen scheermes op zijn hoofd komen.","12":"Het gebeurde nu, terwijl zij bleef bidden voor het aangezicht van de HEERE, dat Eli op haar mond lette.","13":"Want Hanna sprak in haar hart; alleen haar lippen bewogen, maar haar stem werd niet gehoord; daarom hield Eli haar voor dronken.","14":"En Eli zei tegen haar: Hoe lang zult u zich dronken aanstellen? Doe uw wijn van u af.","15":"Doch Hanna antwoordde en zei: Nee, mijn heer! Ik ben een vrouw, bezwaard van geest; ik heb geen wijn of sterke drank gedronken, maar ik heb mijn ziel uitgegoten voor het aangezicht van de HEERE.","16":"Beschouw uw dienstmaagd toch niet als een dochter van Belial; want ik heb tot nu toe gesproken uit de veelheid van mijn gedachten en van mijn verdriet.","17":"Toen antwoordde Eli en zei: Ga heen in vrede, en de God van Israël geeft u wat u van Hem gebeden hebt.","18":"En zij zei: Laat uw dienstmaagd genade vinden in uw ogen! Zo ging die vrouw haars weegs; en zij at, en haar gezicht was niet meer zo *bedroefd*.","19":"En zij stonden 's morgens vroeg op, en zij aanbaden voor het aangezicht van de HEERE, en zij keerden terug, en kwamen bij hun huis te Rama. En Elkana had gemeenschap met zijn vrouw Hanna, en de HEERE dacht aan haar.","20":"En het gebeurde, na verloop van dagen, dat Hanna zwanger werd, en een zoon baarde, en zij noemde zijn naam Samuël: Want, zei ze, ik heb hem van de HEERE gebeden.","21":"En die man, Elkana, trok op met zijn hele huis, om aan de HEERE het jaarlijkse offer te offeren, en zijn gelofte.","22":"Doch Hanna trok niet op; maar zij zei tegen haar man: Als de jongen gespeend is, dan zal ik hem brengen, zodat hij voor het aangezicht van de HEERE verschijnt, en daar blijft tot in eeuwigheid.","23":"En Elkana, haar man, zei tegen haar: Doe wat goed is in uw ogen; blijf, totdat u hem gespeend hebt; alleen, de HEERE bevestigt Zijn woord! Zo bleef de vrouw, en zoogde haar zoon, totdat zij hem speende.","24":"Daarna, toen zij hem gespeend had, bracht zij hem met zich mee, met drie stieren, en een efa van het meel, en een fles met wijn; en zij bracht hem in het huis van de HEERE te Silo; en het jongetje was nog zeer jong.","25":"En zij slachtten een stier; zo brachten zij het kind tot Eli.","26":"En zij zei: Och, mijn heer! zo waarachtig als uw ziel leeft, mijn heer! Ik ben die vrouw, die hier bij u stond, om tot de HEERE te bidden.","27":"Ik bad om dit kind, en de HEERE heeft mij gegeven wat ik van Hem gebeden heb.","28":"Daarom heb ik hem ook aan de HEERE overgegeven al de dagen die hij leven zal; hij is aan de HEERE gegeven. En hij aanbad daar de HEERE."},"SV":{"1":"Daar was een man van Ramathaim-zofim, van het gebergte van Efraïm, wiens naam was Elkana, een zoon van Jerocham, den zoon van Elihu, den zoon van Tochu, den zoon van Zuf, een Efrathiet.","2":"En hij had twee vrouwen; de naam van de ene was Hanna, en de naam van de andere was Peninna. Peninna nu had kinderen, maar Hanna had geen kinderen.","3":"Deze man nu ging opwaarts uit zijn stad van jaar tot jaar om te aanbidden, en om te offeren den HEERE der heirscharen te Silo; en aldaar waren priesters des HEEREN, Hofni, en Pinehas, de twee zonen van Eli.","4":"En het geschiedde op dien dag, als Elkana offerde, zo gaf hij aan Peninna, zijn huisvrouw, en aan al haar zonen en haar dochteren, delen.","5":"Maar aan Hanna gaf hij een aanzienlijk deel, want hij had Hanna lief; doch de HEERE had haar baarmoeder toegesloten.","6":"En haar tegenpartijdige tergde haar ook met terging, om haar te vergrimmen, omdat de HEERE haar baarmoeder toegesloten had.","7":"En alzo deed hij jaar op jaar; van dat zij opging tot het huis des HEEREN, zo tergde zij haar alzo; daarom weende zij en at niet.","8":"Toen zeide Elkana, haar man: Hanna, waarom weent gij, en waarom eet gij niet, en waarom is uw hart kwalijk gesteld? Ben ik u niet beter dan tien zonen?","9":"Toen stond Hanna op, nadat *hij* gegeten, en nadat *hij* gedronken had te Silo. En Eli, de priester, zat op een stoel bij een post van den tempel des HEEREN.","10":"Zij dan viel bitterlijk bedroefd zijnde, zo bad zij tot den HEERE, en zij weende zeer.","11":"En zij beloofde een gelofte, en zeide: HEERE der heirscharen, zo Gij eenmaal de ellende Uwer dienstmaagd aanziet, en mijner gedenkt, en Uw dienstmaagd niet vergeet, maar geeft aan Uw dienstmaagd een mannelijk zaad, zo zal ik dat den HEERE geven al de dagen zijns levens, en er zal geen scheermes op zijn hoofd komen.","12":"Het geschiedde nu, als zij evenzeer bleef biddende voor het aangezicht des HEEREN, zo gaf Eli acht op haar mond.","13":"Want Hanna sprak in haar hart; alleenlijk roerden zich haar lippen, maar haar stem werd niet gehoord; daarom hield Eli haar voor dronken.","14":"En Eli zeide tot haar: Hoe lang zult gij u dronken aanstellen? Doe uw wijn van u.","15":"Doch Hanna antwoordde en zeide: Neen, mijn heer! ik ben een vrouw, bezwaard van geest; ik heb noch wijn, noch sterken drank gedronken; maar ik heb mijn ziel uitgegoten voor het aangezicht des HEEREN.","16":"Acht toch uw dienstmaagd niet voor een dochter Belials; want ik heb tot nu toe gesproken uit de veelheid van mijn gedachten en van mijn verdriet.","17":"Toen antwoordde Eli en zeide: Ga heen in vrede, en de God Israëls zal uw bede geven, die gij van Hem gebeden hebt.","18":"En zij zeide: Laat uw dienstmaagd genade vinden in uw ogen! Alzo ging die vrouw haars weegs; en zij at, en haar aangezicht was haar *zodanig* niet meer.","19":"En zij stonden des morgens vroeg op, en zij aanbaden voor het aangezicht des HEEREN, en zij keerden weder, en kwamen tot hun huis te Rama. En Elkana bekende zijn huisvrouw Hanna, en de HEERE gedacht aan haar.","20":"En het geschiedde, na verloop van dagen, dat Hanna bevrucht werd, en baarde een zoon, en zij noemde zijn naam Samuël: Want, *zeide* *zij*, ik heb hem van den HEERE gebeden.","21":"En die man, Elkana toog op met zijn ganse huis, om den HEERE te offeren het jaarlijkse offer, en zijn gelofte.","22":"Doch Hanna toog niet op; maar zij zeide tot haar man: Als de jongen gespeend is, dan zal ik hem brengen, dat hij voor het aangezicht des HEEREN verschijne, en blijve daar tot in eeuwigheid.","23":"En Elkana, haar man, zeide tot haar: Doe, wat goed is in uw ogen; blijf, totdat gij hem zult gespeend hebben; de HEERE bevestige naar Zijn woord! Alzo bleef de vrouw, en zoogde haar zoon, totdat zij hem speende.","24":"Daarna, als zij hem gespeend had, bracht zij hem met zich opwaarts, met drie varren, en een efa meels, en een fles met wijn; en zij bracht hem in het huis des HEEREN te Silo; en het jongsken was *zeer* jong.","25":"En zij slachtten een var; alzo brachten zij het kind tot Eli.","26":"En zij zeide: Och, mijn heer! *zo* *waarachtig* *als* uw ziel leeft, mijn heer! Ik ben die vrouw, die hier bij u stond, om den HEERE te bidden.","27":"Ik bad om dit kind, en de HEERE heeft mij mijn bede gegeven, die ik van Hem gebeden heb.","28":"Daarom heb ik hem ook den HEERE overgegeven al de dagen, die hij wezen zal; hij is van den HEERE gebeden. En hij bad aldaar den HEERE aan."},"KJV":{"1":"Now there was a certain man of Ramathaimzophim, of mount Ephraim, and his name was Elkanah, the son of Jeroham, the son of Elihu, the son of Tohu, the son of Zuph, an Ephrathite:","2":"And he had two wives; the name of the one was Hannah, and the name of the other Peninnah: and Peninnah had children, but Hannah had no children.","3":"And this man went up out of his city yearly to worship and to sacrifice unto the LORD of hosts in Shiloh. And the two sons of Eli, Hophni and Phinehas, the priests of the LORD, were there.","4":"And when the time was that Elkanah offered, he gave to Peninnah his wife, and to all her sons and her daughters, portions:","5":"But unto Hannah he gave a worthy portion; for he loved Hannah: but the LORD had shut up her womb.","6":"And her adversary also provoked her sore, for to make her fret, because the LORD had shut up her womb.","7":"And as he did so year by year, when she went up to the house of the LORD, so she provoked her; therefore she wept, and did not eat.","8":"Then said Elkanah her husband to her, Hannah, why weepest thou? and why eatest thou not? and why is thy heart grieved? am not I better to thee than ten sons?","9":"So Hannah rose up after they had eaten in Shiloh, and after they had drunk. Now Eli the priest sat upon a seat by a post of the temple of the LORD.","10":"And she was in bitterness of soul, and prayed unto the LORD, and wept sore.","11":"And she vowed a vow, and said, O LORD of hosts, if thou wilt indeed look on the affliction of thine handmaid, and remember me, and not forget thine handmaid, but wilt give unto thine handmaid a man child, then I will give him unto the LORD all the days of his life, and there shall no razor come upon his head.","12":"And it came to pass, as she continued praying before the LORD, that Eli marked her mouth.","13":"Now Hannah, she spake in her heart; only her lips moved, but her voice was not heard: therefore Eli thought she had been drunken.","14":"And Eli said unto her, How long wilt thou be drunken? put away thy wine from thee.","15":"And Hannah answered and said, No, my lord, I am a woman of a sorrowful spirit: I have drunk neither wine nor strong drink, but have poured out my soul before the LORD.","16":"Count not thine handmaid for a daughter of Belial: for out of the abundance of my complaint and grief have I spoken hitherto.","17":"Then Eli answered and said, Go in peace: and the God of Israel grant thee thy petition that thou hast asked of him.","18":"And she said, Let thine handmaid find grace in thy sight. So the woman went her way, and did eat, and her countenance was no more sad.","19":"And they rose up ➔ in the morning early, and worshipped before the LORD, and returned, and came to their house to Ramah: and Elkanah knew Hannah his wife; and the LORD remembered her.","20":"Wherefore it came to pass, when the time was come about after Hannah had conceived, that she bare a son, and called his name Samuel, saying, Because I have asked him of the LORD.","21":"And the man Elkanah, and all his house, went up to offer unto the LORD the yearly sacrifice, and his vow.","22":"But Hannah went not up; for she said unto her husband, I will not go up until the child be weaned, and then I will bring him, that he may appear before the LORD, and there abide for ever.","23":"And Elkanah her husband said unto her, Do what seemeth thee good; tarry until thou have weaned him; only the LORD establish his word. So the woman abode, and gave her son suck until she weaned him.","24":"And when she had weaned him, she took him up with her, with three bullocks, and one ephah of flour, and a bottle of wine, and brought him unto the house of the LORD in Shiloh: and the child was young.","25":"And they slew a bullock, and brought the child to Eli.","26":"And she said, Oh my lord, as thy soul liveth, my lord, I am the woman that stood by thee here, praying unto the LORD.","27":"For this child I prayed; and the LORD hath given me my petition which I asked of him:","28":"Therefore also I have lent him to the LORD; as long as he liveth he shall be lent to the LORD. And he worshipped the LORD there."}},"tsk":{"1":[{"kopje":"Ramathaïm-Zofim","refs":["1 Sam 1:19","Matt 27:57"]},{"kopje":"gebergte","refs":["Richt 17:1","Richt 19:1"]},{"kopje":"Elkana","refs":["1 Kron 6:25-27","1 Kron 6:34"]},{"kopje":"Zuf","refs":["1 Sam 9:5"]},{"kopje":"Efrathiet","refs":["1 Sam 17:12","Richt 12:5","Ruth 1:2","1 Kon 11:26"]}],"2":[{"kopje":"twee","refs":["Gen 4:19","Gen 4:23","Gen 29:23-29","Richt 8:30","Matt 19:8"]},{"kopje":"maar","refs":["Gen 16:1","Gen 16:2","Gen 25:21","Gen 29:31","Richt 13:2","Luk 1:7"]}],"3":[{"kopje":"elk jaar","refs":["Ex 23:14","Ex 23:17","Ex 34:23","Deut 16:16","Luk 2:41"]},{"kopje":"om te aanbidden","refs":["Deut 12:5-7","Deut 12:11-14"]},{"kopje":"Silo","refs":["1 Sam 1:9","Joz 18:1","Richt 18:31","Ps 78:60","Jer 7:12-14"]},{"kopje":"En daar","refs":["1 Sam 1:9","1 Sam 2:12-17","1 Sam 2:34","1 Sam 3:13","1 Sam 4:4","1 Sam 4:11","1 Sam 4:17","1 Sam 4:18"]}],"4":[{"kopje":"offerde","refs":["Lev 3:4","Lev 7:15","Deut 12:5-7","Deut 12:17","Deut 16:11"]}],"5":[{"kopje":"een aanzienlijk deel","refs":["Gen 43:34","Gen 45:22"]},{"kopje":"had lief","refs":["Gen 29:30","Gen 29:31","Deut 21:15"]},{"kopje":"toegesloten","refs":["Gen 20:18","Gen 30:2"]}],"6":[{"kopje":"tegenpartij","refs":["Lev 18:18","Job 6:14"]}],"7":[{"kopje":"jaar","refs":["1 Sam 2:19"]}],"8":[{"kopje":"waarom weent u","refs":["2 Sam 12:16","2 Sam 12:17","2 Kon 8:12","Job 6:14","Joh 20:13","Joh 20:15","1 Tess 5:14"]},{"kopje":"Ben ik niet","refs":["Ruth 4:15","Ps 43:4","Jes 54:1","Jes 54:6"]}],"10":[{"kopje":"bitter bedroefd zijnde","refs":["Ruth 1:20","2 Sam 17:8","Job 7:11","Job 9:18","Job 10:1","Jes 38:15","Jes 54:6","Klaa /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
