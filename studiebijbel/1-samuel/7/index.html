 uw midden weg, ook de Astharoths; en richt uw hart op de HEERE, en dien Hem alleen, dan zal Hij u uit de hand van de Filistijnen rukken.","4":"De kinderen van Israël deden toen de Baäls en de Astharoths weg, en zij dienden de HEERE alleen.","5":"Verder zei Samuël: Verzamel heel Israël naar Mizpa, en ik zal de HEERE voor u bidden.","6":"En zij werden verzameld te Mizpa, en zij schepten water en goten het uit voor het aangezicht van de HEERE; en zij vastten die dag, en zeiden daar: Wij hebben tegen de HEERE gezondigd. Zo richtte Samuël de kinderen van Israël te Mizpa.","7":"Toen de Filistijnen hoorden dat de kinderen van Israël zich verzameld hadden te Mizpa, kwamen de leiders van de Filistijnen op tegen Israël. Toen de kinderen van Israël dat hoorden, werden zij bang voor de Filistijnen.","8":"En de kinderen van Israël zeiden tegen Samuël: Zwijg niet voor ons, en houd niet op te roepen tot de HEERE, onze God, opdat Hij ons verlost uit de hand van de Filistijnen.","9":"Toen nam Samuël een melklam, en offerde het geheel aan de HEERE als brandoffer; en Samuël riep tot de HEERE voor Israël; en de HEERE verhoorde hem.","10":"En het gebeurde, terwijl Samuël dat brandoffer offerde, dat de Filistijnen naderden ten strijde tegen Israël; en de HEERE donderde die dag met een grote donder over de Filistijnen, en Hij bracht hen in verwarring, zodat zij verslagen werden voor het aangezicht van Israël.","11":"En de mannen van Israël trokken uit vanuit Mizpa, en vervolgden de Filistijnen, en zij sloegen hen tot onder Beth-kar.","12":"Samuël nam toen een steen, en zette die tussen Mizpa en Sen, en noemde hem Eben-haezer; en hij zei: Tot hiertoe heeft de HEERE ons geholpen.","13":"Zo werden de Filistijnen vernederd, en kwamen niet meer in het gebied van Israël; want de hand van de HEERE was tegen de Filistijnen al de dagen van Samuël.","14":"En de steden, die de Filistijnen van Israël genomen hadden, kwamen weer aan Israël, van Ekron tot Gath toe; ook rukte Israël het bijbehorende gebied uit de hand van de Filistijnen; en er was vrede tussen Israël en de Amorieten.","15":"Samuël nu richtte Israël al de dagen van zijn leven.","16":"En hij ging van jaar tot jaar rond naar Beth-el, Gilgal en Mizpa; en hij richtte Israël op al die plaatsen.","17":"Doch hij keerde terug naar Rama; want daar was zijn huis, en daar richtte hij Israël; en hij bouwde daar een altaar voor de HEERE."},"SV":{"1":"Toen kwamen de mannen van Kirjath-jearim, en haalden de ark des HEEREN op, en zij brachten ze in het huis van Abinadab, op den heuvel; en zij heiligden zijn zoon Eleazar, dat hij de ark des HEEREN bewaarde.","2":"En het geschiedde, van dien dag af, dat de ark *des* *Heeren* te Kirjath-jearim bleef, en de dagen werden twintig jaren; en het ganse huis van Israël klaagde den HEERE achterna.","3":"Toen sprak Samuël tot het ganse huis van Israël, zeggende: Indien gijlieden u met uw ganse hart tot den HEERE bekeert, zo doet de vreemde goden uit het midden van u weg, ook de Astharoths; en richt uw hart tot den HEERE, en dient Hem alleen, zo zal Hij u uit de hand der Filistijnen rukken.","4":"De kinderen Israëls nu deden de Baäls en de Astharoths weg, en zij dienden den HEERE alleen.","5":"Verder zeide Samuël: Vergadert het ganse Israël naar Mizpa, en ik zal den HEERE voor u bidden.","6":"En zij werden vergaderd te Mizpa, en zij schepten water, en goten het uit voor het aangezicht des HEEREN; en zij vastten te dien dage, en zeiden aldaar: Wij hebben tegen den HEERE gezondigd. Alzo richtte Samuël de kinderen Israëls te Mizpa.","7":"Toen de Filistijnen hoorden, dat de kinderen Israëls zich vergaderd hadden te Mizpa, zo kwamen de oversten der Filistijnen op tegen Israël. Als de kinderen Israëls *dat* hoorden, zo vreesden zij voor het aangezicht der Filistijnen.","8":"En de kinderen Israëls zeiden tot Samuël: Zwijg niet van onzentwege, dat gij niet zoudt roepen tot den HEERE, onzen God, opdat Hij ons verlosse uit de hand der Filistijnen.","9":"Toen nam Samuël een melklam, en hij offerde het geheel den HEERE ten brandoffer; en Samuël riep tot den HEERE voor Israël; en de HEERE verhoorde hem.","10":"En het geschiedde, toen Samuël dat brandoffer offerde, zo kwamen de Filistijnen aan ten strijde tegen Israël; en de HEERE donderde te dien dage met een groten donder over de Filistijnen, en Hij verschrikte hen, zodat zij verslagen werden voor het aangezicht van Israël.","11":"En de mannen van Israël togen uit van Mizpa, en vervolgden de Filistijnen, en zij sloegen hen tot onder Beth-kar.","12":"Samuël nu nam een steen, en stelde *dien* tussen Mizpa en tussen Sen, en hij noemde diens naam Eben-haezer; en hij zeide: Tot hiertoe heeft de HEERE ons geholpen.","13":"Alzo werden de Filistijnen vernederd, en kwamen niet meer in de landpalen van Israël; want de hand des HEEREN was tegen de Filistijnen al de dagen van Samuël.","14":"En de steden, welke de Filistijnen van Israël genomen hadden kwamen weder aan Israël, van Ekron tot Gath toe; ook rukte Israël derzelver landpale uit de hand der Filistijnen; en er was vrede tussen Israël en tussen de Amorieten.","15":"Samuël nu richtte Israël al de dagen zijns levens.","16":"En hij toog van jaar tot jaar, en ging rondom naar Beth-el, en Gilgal, en Mizpa; en hij richtte Israël in al die plaatsen.","17":"Doch hij keerde weder naar Rama; want daar was zijn huis, en daar richtte hij Israël; en hij bouwde aldaar den HEERE een altaar."},"KJV":{"1":"And the men of Kirjathjearim came, and fetched up the ark of the LORD, and brought it into the house of Abinadab in the hill, and sanctified Eleazar his son to keep the ark of the LORD.","2":"And it came to pass, while the ark abode in Kirjathjearim, that the time was long; for it was twenty years: and all the house of Israel lamented after the LORD.","3":"And Samuel spake unto all the house of Israel, saying, If ye do return unto the LORD with all your hearts, then put away the strange gods and Ashtaroth from among you, and prepare your hearts unto the LORD, and serve him only: and he will deliver you out of the hand of the Philistines.","4":"Then the children of Israel did put away Baalim and Ashtaroth, and served the LORD only.","5":"And Samuel said, Gather all Israel to Mizpeh, and I will pray for you unto the LORD.","6":"And they gathered together to Mizpeh, and drew water, and poured it out before the LORD, and fasted on that day, and said there, We have sinned against the LORD. And Samuel judged the children of Israel in Mizpeh.","7":"And when the Philistines heard that the children of Israel were gathered together to Mizpeh, the lords of the Philistines went up against Israel. And when the children of Israel heard it, they were afraid of the Philistines.","8":"And the children of Israel said to Samuel, Cease not to cry unto the LORD our God for us, that he will save us out of the hand of the Philistines.","9":"And Samuel took a sucking lamb, and offered it for a burnt offering wholly unto the LORD: and Samuel cried unto the LORD for Israel; and the LORD heard him.","10":"And as Samuel was offering up the burnt offering, the Philistines drew near to battle against Israel: but the LORD thundered with a great thunder on that day upon the Philistines, and discomfited them; and they were smitten before Israel.","11":"And the men of Israel went out of Mizpeh, and pursued the Philistines, and smote them, until they came under Bethcar.","12":"Then Samuel took a stone, and set it between Mizpeh and Shen, and called the name of it Ebenezer, saying, Hitherto hath the LORD helped us.","13":"So the Philistines were subdued, and they came no more into the coast of Israel: and the hand of the LORD was against the Philistines all the days of Samuel.","14":"And the cities which the Philistines had taken from Israel were restored to Israel, from Ekron even unto Gath; and the coasts thereof did Israel deliver out of the hands of the Philistines. And there was peace between Israel and the Amorites.","15":"And Samuel judged Israel all the days of his life.","16":"And he went from year to year in circuit to Bethel, and Gilgal, and Mizpeh, and judged Israel in all those places.","17":"And his return was to Ramah; for there was his house; and there he judged Israel; and there he built an altar unto the LORD."}},"tsk":{"1":[{"kopje":"Kirjath-jearim","refs":["1 Sam 6:21","Joz 18:14","2 Sam 6:2","1 Kron 13:5","1 Kron 13:6","Ps 132:6"]},{"kopje":"Abinadab","refs":["2 Sam 6:3","2 Sam 6:4","1 Kron 13:7","Jes 52:11"]}],"2":[{"kopje":"klaagde","refs":["Richt 2:4","Jer 3:13","Jer 3:22-25","Jer 31:9","Zach 12:10","Zach 12:11","Matt 5:4","2 Kor 7:10","2 Kor 7:11"]}],"3":[{"kopje":"bekeert","refs":["Deut 30:2-10","1 Kon 8:48","Jes 55:7","Hos 6:1","Hos 6:2","Hos 14:2","Joël 2:12","Joël 2:13"]},{"kopje":"doe weg","refs":["Gen 35:2","Joz 24:14","Joz 24:23","Richt 2:13","Richt 10:6"]},{"kopje":"richt","refs":["Deut 30:6","1 Kron 22:19","1 Kron 28:9","2 Kron 30:19","Job 11:13","Job 11:14","Spr 16:1","Jer 4:3","Jer 4:4","Ezech 18:31","Matt 15:8","Joh 4:24"]},{"kopje":"dien Hem","refs":["Deut 6:13","Deut 10:20","Deut 13:4","Matt 4:10","Matt 6:24","Luk 4:8"]}],"5":[{"kopje":"Verzamel","refs":["Neh 9:1","Joël 2:16"]},{"kopje":"Mizpa","refs":["1 Sam 7:12","1 Sam 7:16","1 Sam 10:17","Joz 15:38","Richt 20:1","2 Kon 25:23"]},{"kopje":"ik zal bidden","refs":["1 Sam 12:23"]}],"6":[{"kopje":"schepten water","refs":["Num 29:35","1 Sam 1:15","2 Sam 14:14","Job 16:20","Ps 6:7","Ps 42:4","Ps 119:136","Jer 9:1","Klaagl 2:11","Klaagl 2:18","Klaagl 3:49"]},{"kopje":"vastten","refs":["2 Kron 20:3","Ezra 8:21-23","Neh 9:1-3","Dan 9:3-5","Joël 2:12","Jona 3:1-10"]},{"kopje":"Wij hebben gezondigd","refs":["Lev 26:40","Richt 10:10","1 Kon 8:47","Ezra 9:5-10","Job 33:27","Job 39:37","Job 42:6","Ps 38:4-9","Ps 106:6","Jer 3:13","Jer 3:14","Jer 31:19","Luk 15:18"]},{"kopje":"richtte","refs":["Richt 3:10","Neh 9:27","Ezech 20:4"]}],"7":[{"kopje":"bang","refs":["1 Sam 13:6","1 Sam 17:11","Ex 14:10","2 Kron 20:3"]}],"8":[{"kopje":"Zwijg","refs":["1 S l the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H5091\">lamented</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","3":"And <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> unto all the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> If ye do <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> with all your <span class=\"wl wl-kjv\" data-code=\"H3824\">hearts,</span> then put <span class=\"wl wl-kjv\" data-code=\"H5493\">away</span> the <span class=\"wl wl-kjv\" data-code=\"H5236\">strange</span> <span class=\"wl wl-kjv\" data-code=\"H430\">gods</span> and <span class=\"wl wl-kjv\" data-code=\"H6252\">Ashtaroth</span> from <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> you, and <span class=\"wl wl-kjv\" data-code=\"H3559\">prepare</span> your <span class=\"wl wl-kjv\" data-code=\"H3824\">hearts</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> him only: and he will <span class=\"wl wl-kjv\" data-code=\"H5337\">deliver</span> you out of the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines.</span>","4":"Then the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> did put <span class=\"wl wl-kjv\" data-code=\"H5493\">away</span> <span class=\"wl wl-kjv\" data-code=\"H1168\">Baalim</span> and <span class=\"wl wl-kjv\" data-code=\"H6252\">Ashtaroth,</span> and <span class=\"wl wl-kjv\" data-code=\"H5647\">served</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> only.","5":"And <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H6908\">Gather</span> all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> to <span class=\"wl wl-kjv\" data-code=\"H4708\">Mizpeh,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H6419\">pray</span> for you unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","6":"And they gathered <span class=\"wl wl-kjv\" data-code=\"H6908\">together</span> to <span class=\"wl wl-kjv\" data-code=\"H4709\">Mizpeh,</span> and <span class=\"wl wl-kjv\" data-code=\"H7579\">drew</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and poured it <span class=\"wl wl-kjv\" data-code=\"H8210\">out</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H6684\">fasted</span> on that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> there, We have <span class=\"wl wl-kjv\" data-code=\"H2398\">sinned</span> against the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span> And <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> <span class=\"wl wl-kjv\" data-code=\"H8199\">judged</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> in <span class=\"wl wl-kjv\" data-code=\"H4708\">Mizpeh.</span>","7":"And when the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> that the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> were gathered <span class=\"wl wl-kjv\" data-code=\"H6908\">together</span> to <span class=\"wl wl-kjv\" data-code=\"H4708\">Mizpeh,</span> the <span class=\"wl wl-kjv\" data-code=\"H5633\">lords</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> against <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span> And when the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> it, they were <span class=\"wl wl-kjv\" data-code=\"H3372\">afraid</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">of</span> the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines.</span>","8":"And the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel,</span> <span class=\"wl wl-kjv\" data-code=\"H2790\">Cease</span> not to <span class=\"wl wl-kjv\" data-code=\"H2199\">cry</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> our <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> for us, that he will <span class=\"wl wl-kjv\" data-code=\"H3467\">save</span> us out of the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines.</span>","9":"And <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H259\">a</span> <span class=\"wl wl-kjv\" data-code=\"H2461\">sucking</span> <span class=\"wl wl-kjv\" data-code=\"H2924\">lamb,</span> and <span class=\"wl wl-kjv\" data-code=\"H5927\">offered</span> it for a burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering</span> <span class=\"wl wl-kjv\" data-code=\"H3632\">wholly</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> and <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> <span class=\"wl wl-kjv\" data-code=\"H2199\">cried</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> for <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">heard</span> him.","10":"And as <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> was offering <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> the burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering,</span> the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> drew <span class=\"wl wl-kjv\" data-code=\"H5066\">near</span> to <span class=\"wl wl-kjv\" data-code=\"H4421\">battle</span> against <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> but the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7481\">thundered</span> with a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H6963\">thunder</span> on that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> upon the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines,</span> and <span class=\"wl wl-kjv\" data-code=\"H2000\">discomfited</span> them; and they were <span class=\"wl wl-kjv\" data-code=\"H5062\">smitten</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","11":"And the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of <span class=\"wl wl-kjv\" data-code=\"H4709\">Mizpeh,</span> and <span class=\"wl wl-kjv\" data-code=\"H7291\">pursued</span> the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> them, until they came under <span class=\"wl wl-kjv\" data-code=\"H1033\">Bethcar.</span>","12":"Then <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H259\">a</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stone,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> it between <span class=\"wl wl-kjv\" data-code=\"H4709\">Mizpeh</span> and <span class=\"wl wl-kjv\" data-code=\"H8129\">Shen,</span> and <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of it <span class=\"wl wl-kjv\" data-code=\"H72\">Ebenezer,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Hitherto hath the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5826\">helped</span> us.","13":"So the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> were <span class=\"wl wl-kjv\" data-code=\"H3665\">subdued,</span> and they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> no <span class=\"wl wl-kjv\" data-code=\"H3254\">more</span> into the <span class=\"wl wl-kjv\" data-code=\"H1366\">coast</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> and the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was against the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> all the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel.</span>","14":"And the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> which the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> had <span class=\"wl wl-kjv\" data-code=\"H3947\">taken</span> from <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> were <span class=\"wl wl-kjv\" data-code=\"H7725\">restored</span> to <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> from <span class=\"wl wl-kjv\" data-code=\"H6138\">Ekron</span> even unto <span class=\"wl wl-kjv\" data-code=\"H1661\">Gath;</span> and the <span class=\"wl wl-kjv\" data-code=\"H1366\">coasts</span> thereof did <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H5337\">deliver</span> out of the <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines.</span> And there was <span class=\"wl wl-kjv\" data-code=\"H7965\">peace</span> between <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> and the <span class=\"wl wl-kjv\" data-code=\"H567\">Amorites.</span>","15":"And <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> <span class=\"wl wl-kjv\" data-code=\"H8199\">judged</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> all the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of his <span class=\"wl wl-kjv\" data-code=\"H2416\">life.</span>","16":"And he <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> <span class=\"wl wl-kjv\" data-code=\"H1767\">from</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> to <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> in <span class=\"wl wl-kjv\" data-code=\"H5437\">circuit</span> to <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel,</span> and <span class=\"wl wl-kjv\" data-code=\"H1537\">Gilgal,</span> and <span class=\"wl wl-kjv\" data-code=\"H4709\">Mizpeh,</span> and <span class=\"wl wl-kjv\" data-code=\"H8199\">judged</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> in all those <span class=\"wl wl-kjv\" data-code=\"H4725\">places.</span>","17":"And his <span class=\"wl wl-kjv\" data-code=\"H8666\">return</span> was to <span class=\"wl wl-kjv\" data-code=\"H7414\">Ramah;</span> for there was his <span class=\"wl wl-kjv\" data-code=\"H1004\">house;</span> and there he <span class=\"wl wl-kjv\" data-code=\"H8199\">judged</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> and there he <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> an <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Kirjath-jeárim,","tekst":"Zie van deze stad de aantekeningen op Jdg 18:12."},{"catchword":"op den heuvel;","tekst":"Anders, te Gibea"},{"catchword":"heiligden zijn zoon Eleázar,","tekst":"Dat is, wijdden, of verordineerden hem tot een heiligen dienst."}],"2":[{"catchword":"klaagde den HEERE achterna","tekst":"Anders, zuchtten tot den Heere; te weten, toen zij door de Filistijnen hard verdrukt werden. Zie onder, vs.3."}],"3":[{"catchword":"de vreemde goden uit het midden","tekst":"Hebreeuws, de goden des vreemden. Hij verstaat de afgoden van de vreemde of uitlandse volken, die rondom hen lagen."},{"catchword":"Astharoths;","tekst":"Zie Jdg 2:13."}],"4":[{"catchword":"Baäls en de Astharoths weg,","tekst":"Zie Jdg 2:11. Baäl is een mannelijke naam; maar Astaroth is een vrouwelijke naam; zodat hier gesproken wordt van de afgoden en afgodinnen der heidenen."}],"5":[{"catchword":"Mizpa,","tekst":"Hier plachten de Israëlieten hun landsvergadering te houden; zie Jdg 20:1. Samuël heeft goedgevonden het volk hier bijeen te roepen, opdat hij voor hen, en zij tegelijk met hem, den Heere zouden bidden."}],"6":[{"catchword":"goten het uit","tekst":"Tot een teken dat zij hun harten, [van zonden gewassen en gereinigd zijnde] uitgoten voor den Heere. Zie dergelijk 1Sa 1:15. De zin is: zij riepen den Heere van harte aan om verlossing. Daartoe was ook hun vasten behorende."},{"catchword":"richtte Samuël","tekst":"Dat is, hij regeerde hen, en hij bracht hen door zijn goede vermaning tot bekering. Zie de aantekeningen op Jdg 2:16."}],"7":[{"catchword":"zo kwamen de oversten der Filistijnen","tekst":"Te weten, met heirkracht, gelijk blijkt vs.10."},{"catchword":"voor het aangezicht der Filistijnen","tekst":"Dat is, van de komst. Zie de aantekeningen op Gen 36:6."}],"8":[{"catchword":"Zwijg niet van onzentwege,","tekst":"Of, laat niet af, en houd u niet stil van ons, van te roepen, enz. Zie de aantekeningen Job 13:13."}],"9":[{"catchword":"melklam,","tekst":"Dat is, een jong lam, dat nog de melk van zijn moeder zoog."},{"catchword":"hij offerde","tekst":"Hij zelf, of door een priester."},{"catchword":"verhoorde hem","tekst":"Of, antwoordde hem."}],"10":[{"catchword":"donder over de Filistijnen,","tekst":"Hebreeuws, stem."}],"12":[{"catchword":"Sen,","tekst":"Dat is, de tand, en door gelijkenis, een rots, die als een tand scherp uitsteekt, gelijk 1Sa 14:4-5."},{"catchword":"Eben-haëzer;","tekst":"Dat is, helpsteen, of steen der hulp."}],"13":[{"catchword":"kwamen","tekst":"Hebreeuws, zij voeren niet meer voort te komen; te weten, met heirlegers, om Israël enige steden af te nemen; maar zij hadden en hielden nog hun garnizoenen en soldaten op de grenzen, om die te bewaren, gelijk te zien is 1Sa 10:5. Of, niet meer, betekent hier in langen tijd niet weder. Of, niet meer, voor niet zo dikwijls, gelijk Gen 32:28; 2Ki 6:23-24."},{"catchword":"niet meer","tekst":"Anders, niet weder"},{"catchword":"in de landpalen van Israël;","tekst":"Dat is, in het land der Israëlieten."}],"14":[{"catchword":"er was vrede","tekst":"Dat is, zij voerden geen openbaren krijg tegen elkander."},{"catchword":"de Amorieten","tekst":"Versta, onder den naam der Amorieten ook andere volken des lands Kanaän, of der Filistijnen."}],"15":[{"catchword":"richtte Israël","tekst":"Zie boven, vs.6."},{"catchword":"al de dagen zijns levens","tekst":"Te weten, van dien dag af toen hij richter geworden is tot zijn dood toe, want ofschoon Saul als koning geregeerd heeft, zo is evenwel Samuël mede in de regering gebleven, en hebben zij tezamen geregeerd veertig jaren, Act 13:21."}],"16":[{"catchword":"Beth-el, en Gilgal, en Mizpa;","tekst":"Dit kan verstaan worden van de stad Behtel, of van het huis Gods, [want dat betekent Bethel ] en alzo zou hier verstaan worden Kiriath-Jearim, waar toen ten tijde de ark des verbonds was."}],"17":[{"catchword":"keerde weder","tekst":"Hebreeuws, en zijn wederkomst was naar Rama"},{"catchword":"Rama;","tekst":"Deze stad wordt 1Sa 1:1 genoemd Ramathaïm; zie de aantekeningen aldaar."},{"catchword":"daar richtte hij Israël;","tekst":"Dat is, hij had daar zijn ordinaire woning; toen hij het land omgegaan of doorwandeld had, zo is hij weder daar gekomen."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Then came the men of Kiruath-Jearim [see concerning this city the annotat. on.Judg. 18.12] and fetcht up the Ark of the LORD, and they brought it into the house of Abinadab on the hill; [Oth at Gibea] and they hallowed his son Eleazar, [i.e consecrated, or ordained him to an holy ministery] that he might keep the Ark of the LORD."}],"2":[{"catchword":null,"tekst":"And it came to passe, from that day, that the Ark (of the Lord) abode at Kiriath-Jearim, and the dayes were multiplied, and they were twenty years : and all the house of Israel lamented after the LORD. [Others, sighed unto the Lord, viz. when they were grievously oppressed by the Philistines, see below v.3.]"}],"3":[{"catchword":null,"tekst":"Then spake Samuel unto all the house of Israel, saying : if ye do turn unto the Lord with all your heart, then put away the strange Gods [heb. The gods of strangers : he meaneth the idols of strange or out land is nations, that lay round, also about them] out of the midst of you, also the Astharots, [see judg.2.13.] and compose your heart unto the lord, and serve him onely, then he will deliver you out of the hand of the Philistines."}],"4":[{"catchword":null,"tekst":"Now the children of Israel did put away the Baalims [see Judg chap 2.1.1] and the Astharots, [Baalim is a masculine name, but Asthroth is feminine name: so that here is spoken for the idols or Idolesses, or he- and the-idols of the heathen] and they served the Lord onely."}],"5":[{"catchword":null,"tekst":"Moreover Samuel said, Gather all Israel to Mizpa: [ Here the Israelites were wont to keep their land meetings: See Judg.20.v.1. Samuel thought good to gather people here together, that he might unto the Lord for them, and thy likewise might join with him in prayer unto Lord] and I will pray unto the Lord for you."}],"6":[{"catchword":null,"tekst":"And they gathered together at Mizpa, and they drew water, and poured it out before the face of the LORD, [Which was a token that they poured out their hearts (being washed and cleansed from sinne) before the Lord, see the like 1Sam.11.15. The meaning is, they cried unto the Lord heartily for deliverance: where-unto likewise their fasting appertained] and they fasted on that day, and said there, We have sinned against the LORD: so Samuel judged the children of Israel at Mizpa. [ i.e. he governed them, and he brought them by his good counsel and exhortation unto repentance. See the Annotat. On Judg.2.15.]"}],"7":[{"catchword":null,"tekst":"When the Philistines heard, that the children of Israel had gathered themselves together at Mizpa, then the Prince of the Philistines came up [viz, With armies, military forces, as appeareth ver.10.] against Israel: when the children of Israel heard (it), they feared before the face [i.e. by reason of the coming. See the annotat. on Gen 36:6] of the Philistines."}],"8":[{"catchword":null,"tekst":"And the children of Israel said unto Samuel, Be not silent in our behalf, [ Or, cease no, be not quite from us, from crying, See Job 13. On verse 13.] that thou shouldest not cry unto the LORD or God, that he may deliver us from the hand of the Philistines."}],"9":[{"catchword":null,"tekst":"Then took Samuel a milk-lamb, [i.e. A young lamb, that yet sucked its mothers // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;

}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

document.addEventListener('click', e => {

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
