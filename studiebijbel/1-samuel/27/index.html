uwen, Ahinoam, de Jizreëlietische, en Abigaïl, de vrouw van Nabal, de Karmelietische.","4":"Toen aan Saul verteld werd dat David naar Gath gevlucht was, ging hij hem niet meer zoeken.","5":"En David zei tegen Achis: Als ik nu genade gevonden heb in uw ogen, laat men mij een plaats geven in een van de steden van het land, zodat ik daar kan wonen; want waarom zou uw knecht bij u in de koninklijke stad wonen?","6":"Toen gaf Achis hem op die dag Ziklag; daarom heeft Ziklag aan de koningen van Juda toebehoord, tot op deze dag.","7":"Het getal nu van de dagen dat David in het land van de Filistijnen woonde, was een jaar en vier maanden.","8":"David nu trok op met zijn mannen, en zij overvielen de Gesurieten, en de Girzieten, en de Amalekieten (want dezen zijn van oude tijden af de inwoners van het land geweest), op de weg naar Sur, tot aan Egypteland.","9":"En David sloeg dat land, en liet geen man en geen vrouw in leven; ook nam hij de schapen en runderen, en de ezels, en kamelen, en kleren, en keerde terug en kwam bij Achis.","10":"Toen Achis zei: Waar zijn u vandaag ingevallen? zei David: Tegen het zuiden van Juda, en tegen het zuiden van de Jerahmeelieten, en tegen het zuiden van de Kenieten.","11":"En David liet geen man en geen vrouw in leven om naar Gath te brengen, en hij zei: Anders zouden zij misschien over ons vertellen en zeggen: Zo heeft David gedaan! En zo was zijn gewoonte, al de dagen dat hij in het land van de Filistijnen gewoond heeft.","12":"En Achis geloofde David, en zei: Hij heeft zich helemaal onmogelijk gemaakt bij zijn volk, in Israël; daarom zal hij eeuwig mijn knecht zijn."},"SV":{"1":"David nu zeide in zijn hart: Nu zal ik een der dagen door Sauls hand omkomen; mij is niet beter, dan dat ik haastelijk ontkome in het land der Filistijnen, opdat Saul van mij de hoop verlieze, om mij meer te zoeken in de ganse landpale van Israël; zo zal ik ontkomen uit zijn hand.","2":"Toen maakte zich David op, en hij ging door, hij en de zeshonderd mannen, die bij hem waren, tot Achis, den zoon van Maoch, den koning van Gath.","3":"En David bleef bij Achis te Gath, hij en zijn mannen, een iegelijk met zijn huis; David met zijn beide vrouwen, Ahinoam, en Jizreëlietische, en Abigaïl, de huisvrouw van Nabal, de Karmelietische.","4":"Toen aan Saul geboodschapt werd, dat David gevlucht was naar Gath, zo voer hij niet meer voort hem te zoeken.","5":"En David zeide tot Achis: Indien ik nu genade in uw ogen gevonden heb, men geve mij een plaats in een van de steden des lands, dat ik daar wone; want waarom zou uw knecht in de koninklijke stad bij u wonen?","6":"Toen gaf Achis te dien dage Ziklag; daarom is Ziklag van de koningen van Juda geweest tot op dezen dag.","7":"Het getal nu der dagen, die David in het land der Filistijnen woonde, was een jaar en vier maanden.","8":"David nu toog op met zijn mannen, en zij overvielen de Gesurieten, en de Girzieten, en de Amalekieten ( want deze zijn vanouds geweest de inwoners des lands), dat gij gaat naar Sur, en tot aan Egypteland.","9":"En David sloeg dat land, en liet noch man noch vrouw leven; ook nam hij de schapen en runderen, en de ezelen, en kemels, en klederen, en keerde weder en kwam tot Achis.","10":"Als Achis zeide: Waar zijt gijlieden heden ingevallen? zo zeide David: Tegen het zuiden van Juda, en tegen het zuiden der Jerahmeelieten, en tegen het zuiden der Kenieten.","11":"En David liet noch man noch vrouw leven, om te Gath te brengen, zeggende: Dat zij misschien van ons niet boodschappen, zeggende: Alzo heeft David gedaan! En alzo was zijn wijze al de dagen, die hij in der Filistijnen land gewoond heeft.","12":"En Achis geloofde David, zeggende: Hij heeft zich ten enenmaal stinkende gemaakt bij zijn volk, in Israël; daarom zal hij eeuwiglijk mij tot een knecht zijn."},"KJV":{"1":"And David said in his heart, I shall now perish one day by the hand of Saul: there is nothing better for me than that I should speedily escape into the land of the Philistines; and Saul shall despair of me, to seek me any more in any coast of Israel: so shall I escape out of his hand.","2":"And David arose, and he passed over with the six hundred men that were with him unto Achish, the son of Maoch, king of Gath.","3":"And David dwelt with Achish at Gath, he and his men, every man with his household, even David with his two wives, Ahinoam the Jezreelitess, and Abigail the Carmelitess, Nabal's wife.","4":"And it was told Saul that David was fled to Gath: and he sought no more again for him.","5":"And David said unto Achish, If I have now found grace in thine eyes, let them give me a place in some town in the country, that I may dwell there: for why should thy servant dwell in the royal city with thee?","6":"Then Achish gave him Ziklag that day: wherefore Ziklag pertaineth unto the kings of Judah unto this day.","7":"And the time that David dwelt in the country of the Philistines was a full year and four months.","8":"And David and his men went up, and invaded the Geshurites, and the Gezrites, and the Amalekites: for those nations were of old the inhabitants of the land, as thou goest to Shur, even unto the land of Egypt.","9":"And David smote the land, and left neither man nor woman alive, and took away the sheep, and the oxen, and the asses, and the camels, and the apparel, and returned, and came to Achish.","10":"And Achish said, Whither have ye made a road to day? And David said, Against the south of Judah, and against the south of the Jerahmeelites, and against the south of the Kenites.","11":"And David saved neither man nor woman alive, to bring tidings to Gath, saying, Lest they should tell on us, saying, So did David, and so will be his manner all the while he dwelleth in the country of the Philistines.","12":"And Achish believed David, saying, He hath made his people Israel utterly to abhor him; therefore he shall be my servant for ever."}},"tsk":{"1":[{"kopje":"David","refs":["1 Sam 16:1","1 Sam 16:13","1 Sam 23:17","1 Sam 25:30","Ps 116:11","Spr 13:12 "H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and he passed <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> with the <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> that were with him unto <span class=\"wl wl-kjv\" data-code=\"H397\">Achish,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H4582\">Maoch,</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H1661\">Gath.</span>","3":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> with <span class=\"wl wl-kjv\" data-code=\"H397\">Achish</span> at <span class=\"wl wl-kjv\" data-code=\"H1661\">Gath,</span> he and his <span class=\"wl wl-kjv\" data-code=\"H582\">men,</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> with his <span class=\"wl wl-kjv\" data-code=\"H1004\">household,</span> even <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> with his <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wives,</span> <span class=\"wl wl-kjv\" data-code=\"H293\">Ahinoam</span> the <span class=\"wl wl-kjv\" data-code=\"H3159\">Jezreelitess,</span> and <span class=\"wl wl-kjv\" data-code=\"H26\">Abigail</span> the <span class=\"wl wl-kjv\" data-code=\"H3762\">Carmelitess,</span> <span class=\"wl wl-kjv\" data-code=\"H5037\">Nabal's</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wife.</span>","4":"And it was <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> that <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> was <span class=\"wl wl-kjv\" data-code=\"H1272\">fled</span> to <span class=\"wl wl-kjv\" data-code=\"H1661\">Gath:</span> and he <span class=\"wl wl-kjv\" data-code=\"H1245\">sought</span> no more <span class=\"wl wl-kjv\" data-code=\"H3254\">again</span> for him.","5":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H397\">Achish,</span> If I have now <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> <span class=\"wl wl-kjv\" data-code=\"H2580\">grace</span> in thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> let them <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> me a <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> in <span class=\"wl wl-kjv\" data-code=\"H259\">some</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">town</span> in the <span class=\"wl wl-kjv\" data-code=\"H7704\">country,</span> that I may <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> there: for why should thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> in the <span class=\"wl wl-kjv\" data-code=\"H4467\">royal</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> with thee?","6":"Then <span class=\"wl wl-kjv\" data-code=\"H397\">Achish</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> him <span class=\"wl wl-kjv\" data-code=\"H6860\">Ziklag</span> that <span class=\"wl wl-kjv\" data-code=\"H3117\">day:</span> wherefore <span class=\"wl wl-kjv\" data-code=\"H6860\">Ziklag</span> pertaineth unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> unto this <span class=\"wl wl-kjv\" data-code=\"H3117\">day.</span>","7":"And the <span class=\"wl wl-kjv\" data-code=\"H4557\">time</span> that <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in the <span class=\"wl wl-kjv\" data-code=\"H7704\">country</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> was a full <span class=\"wl wl-kjv\" data-code=\"H3117\">year</span> and <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H2320\">months.</span>","8":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> and his <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> went <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> and <span class=\"wl wl-kjv\" data-code=\"H6584\">invaded</span> the <span class=\"wl wl-kjv\" data-code=\"H1651\">Geshurites,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1511\">Gezrites,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6003\">Amalekites:</span> for <span class=\"wl wl-kjv\" data-code=\"H2007\">those</span> nations were of <span class=\"wl wl-kjv\" data-code=\"H5769\">old</span> the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> as thou <span class=\"wl wl-kjv\" data-code=\"H935\">goest</span> to <span class=\"wl wl-kjv\" data-code=\"H7793\">Shur,</span> even unto the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt.</span>","9":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and left neither <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> nor <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> <span class=\"wl wl-kjv\" data-code=\"H2421\">alive,</span> and took <span class=\"wl wl-kjv\" data-code=\"H3947\">away</span> the <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1241\">oxen,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2543\">asses,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1581\">camels,</span> and the <span class=\"wl wl-kjv\" data-code=\"H899\">apparel,</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">returned,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H397\">Achish.</span>","10":"And <span class=\"wl wl-kjv\" data-code=\"H397\">Achish</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H408\">Whither</span> have ye made a <span class=\"wl wl-kjv\" data-code=\"H6584\">road</span> to <span class=\"wl wl-kjv\" data-code=\"H3117\">day?</span> And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Against the <span class=\"wl wl-kjv\" data-code=\"H5045\">south</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and against the <span class=\"wl wl-kjv\" data-code=\"H5045\">south</span> of the <span class=\"wl wl-kjv\" data-code=\"H3397\">Jerahmeelites,</span> and against the <span class=\"wl wl-kjv\" data-code=\"H5045\">south</span> of the <span class=\"wl wl-kjv\" data-code=\"H7017\">Kenites.</span>","11":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H2421\">saved</span> neither <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> nor <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> <span class=\"wl wl-kjv\" data-code=\"H2421\">alive,</span> to <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> tidings to <span class=\"wl wl-kjv\" data-code=\"H1661\">Gath,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Lest they should <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> on us, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> So <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> and so will be his <span class=\"wl wl-kjv\" data-code=\"H4941\">manner</span> all the <span class=\"wl wl-kjv\" data-code=\"H3117\">while</span> he <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelleth</span> in the <span class=\"wl wl-kjv\" data-code=\"H7704\">country</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines.</span>","12":"And <span class=\"wl wl-kjv\" data-code=\"H397\">Achish</span> <span class=\"wl wl-kjv\" data-code=\"H539\">believed</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> He hath made his <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H887\">utterly</span> to <span class=\"wl wl-kjv\" data-code=\"H887\">abhor</span> him; therefore he shall be my <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"in zijn hart","tekst":"Dat is, bij zichzelven. Dit is een bewijs van de zwakheid Davids in het geloof en het vertrouwen op de voortreffelijke beloften Gods."},{"catchword":"der dagen","tekst":"Dat is, den een of anderen tijd."},{"catchword":"mij is niet beter,","tekst":"Dat is de raad van het zwakke vlees geweest. Zie 1Sa 22:5, waar de profeet Gath David in gelijke zaak bestraft heeft."},{"catchword":"dat ik haastelijk ontkome","tekst":"Hebreeuws, ontkomende ontkome."}],"2":[{"catchword":"hij ging door,","tekst":"Vermoedelijk eerst vrijgeleide van Achis begeerd en verkregen hebbende, om daar te mogen komen en blijven; en niet voor zijn persoon alleen, gelijk hij eerst gedaan heeft, boven, 1Sa 21:10, maar met al de mannen en vrouwen die bij hem waren."},{"catchword":"Gath","tekst":"In der Filistijnen land gelegen, uit welke stad Goliath was, boven 1Sa 6:17."}],"3":[{"catchword":"de huisvrouw van Nabal,","tekst":"Dat is, die Nabals huisvrouw geweest was. Aldus wordt zij ook genoemd onder 1Sa 30:5."}],"5":[{"catchword":"men geve mij een plaats","tekst":"David zocht ergens alleen te wonen met de zijnen, om te ontgaan het gevaar zo des lichaams als der ziel, hetwelk hem van de Filistijnen had mogen overkomen."},{"catchword":"want waarom zou uw knecht","tekst":"David verstond wel hoe zorgelijk het was voor vreemdelingen, [inzonderheid die van enig vermogen zijn] bij een koning in zijn eigen stad te wonen. Daarom wilde hij deze jaloezie gaarne voorkomen. Maar hij geeft het een anderen naam, alsof hij zeide: Deze eer komt mij niet toe, heer koning."}],"6":[{"catchword":"Ziklag;","tekst":"Deze stad heeft eerst den naam van Juda toegekomen, zoveel hun God die steden des lands geschonken had, gelijk te zien is Jos 15:31; maar de Filistijnen hadden haar den Israëlieten afgenomen en tot dezen tijd toe ingehouden. Nu geeft Achis hem aan David."}],"7":[{"catchword":"was een jaar en vier maanden","tekst":"Hebreeuws, was dagen en vier maanden. Het woord dagen in het getal van vele, wordt dikwijls bij de Hebreën voor een jaar genomen; zie Lev 25:29. David is te Ziklag gebleven tot den dood van Saul, toen kwam hij te Hebron, 2Sa 2:1. Sommigen nemen het aldus: [Eenige] dagen en vier maanden."}],"8":[{"catchword":"Gesurieten,","tekst":"Zie de aantekeningen Jos 12:5, en Jos 16:3."},{"catchword":"Girzieten,","tekst":"Voor Gizrieten. Dit waren Kanaänieten, die tevoren te Gezer of te Gazer gewoond hadden, in het land Efraïm. Dezen, vandaar ook verdreven zijnde, gingen wonen tegen het zuiden van het land Kanaän."},{"catchword":"Amalekieten","tekst":"Dezen waren van de nakomelingen van Ezau, welken God Saul geboden had geheellijk uit te roeien en te verdelgen. Doch hij heeft enigen laten overblijven, tegen welken David hier den oorlog voert."},{"catchword":"deze zijn vanouds geweest","tekst":"Te weten, de Gesurieten en Girzieten. Dezen hebben eertijds het land Kanaän bewoond."},{"catchword":"des lands","tekst":"Te weten, van het Joodse land, beide aan deze en gene zijde der Jordaan."}],"9":[{"catchword":"land,","tekst":"Dat is, de inwoners des lands. Dit nu moet verstaan worden van al de Amalekieten, die hij daar vond, welken God bevolen had uit te roeien, Exo 17:14; Deu 25:19, en 1Sa 15:3."},{"catchword":"en liet noch man noch vrouw leven;","tekst":"Dit deed hij daarom, opdat zij hem niet zouden verklappen bij de Filistijnen, welken hij zocht wijs te maken dat hij in het land de Israëlieten gevallen was."}],"10":[{"catchword":"Tegen het zuiden van Juda,","tekst":"Maar niet in het land Juda, gelijk Achis dat verstond en ook David scheen te zeggen; maar David is gevallen in die landen, die daaraan paalden, te weten, in het land der Amalekieten en van hun naburen en alzo heeft David den koning Achis, uit menselijke zwakheid, bedrogen door dubbelzinnige woorden."},{"catchword":"der Jerahmeëlieten,","tekst":"Deze waren inwoners van het land Juda, nakomelingen van Hezron, 1Ch 2:9, 1Ch 2:25."},{"catchword":"der Kenieten","tekst":"Dezen waren de nakomelingen van Jethro, den schoonvader van Mozes. Zie de aantekeningen Jdg 1:16."}],"11":[{"catchword":"David liet noch man noch vrouw leven,","tekst":"Dit deed David daarom, opdat niemand tijding aan Achis brengen zou, gelijk straks gezegd wordt. Doch zo lag ook Ziklag zo ver van Gath, dat ook derhalve de tijding hiervan niet haast aan Achis kon gebracht worden. Ondertussen voerde David de wraak van God uit over deze verbannen volken."},{"catchword":"zeggende","tekst":"Dat is, bij zichzelven denkende."},{"catchword":"Dat zij misschien van ons niet boodschappen,","tekst":"Versta hierbij: Ik moet wel toezien."}],"12":[{"catchword":"zeggende","tekst":"Te weten, bij zichzelven."},{"catchword":"ten enenmaal stinkende gemaakt","tekst":"Hebreeuws, stinkende makende stinkende gemaakt; dat is, zo stinkende, gehaat en verachtzaam gemaakt, dat zijn eigen volk hem niet kan verdragen. Zie de aantekeningen Gen 34:30."},{"catchword":"eeuwiglijk","tekst":"Dat is, altoos, of zijn levenlang."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"David now said in his heart, [i.e. with himself] Now I shall one of the days, [i.e. at one time or another] perish by the hand of Saul: [This is a demonstration of the weakness of Davids faith and confidence in the excellent promises of God] nothing is better for me, then that I should speedily escape [Heb. Escaping escape] into the Land of the Philistines, [This was the counsel of weak flesh. See 1 Sam. 22. 5. There the Prophet God reproved David in a like matter] that Saul may lose the hope of me, to seek me (any) more in all the border of Israel, so shall I escape out of his hand."}],"2":[{"catchword":null,"tekst":"Then David gat up, and he passed thorow, he, and his six hundred men that were with him, unto Achis the son of Moach [Likely having first desired and obtained leave of Achis to come thither, and to tarry there: And that not for his own person alone, as he did at first, chap. 21. 10. But for all the men and women that were with him] the King of Gath. [Lying in the Philistines land, of which City Goliath was, above chap. 6. 17.]"}],"3":[{"catchword":null,"tekst":"And David abode with Achis at Gath, he, and his men, every one with his house: David with both his wives, Abinoam the Jisraelitess, and Abigail wife of Nabal, [i.e. which had been the wife of Nabal. She is likewise so called below, chap. 30. 5.] the Carmelitess."}],"4":[{"catchword":null,"tekst":"When it was told Saul, that David was fled to Gath: the he proceeded not to seek him (any) more."}],"5":[{"catchword":null,"tekst":"And David said unto Achis, If I have now found grace in thine eyes, let them give me a place in one of the Cities of the Land, that I may dwell there: [David sought to dwell somewhere apart by himself, with those that appertained to him, to escape the danger both of body ad soul, which might have befallen him form the Philistines] for why should thy servant dwell in the royal City with thee? [David knew full well how dangerous it was, for strangers (especially that were of any power) to dwell with a King in his own City: Therefore he was desirous to prevent this jealousy or suspicion; but he giveth it another name, as if he had said, This honour belongeth not to me, my Lord, O King.]"}],"6":[{"catchword":null,"tekst":"Then Achis gave him Ziglag [this City belonged first to the tribe of Juda, in as much as God had give them those Cities of the Land, as appeareth, Jos. 15. 31. But the Philistines had take it from the Israelites, and had kept possession of it till now, and now Achis giveth it unto David] that day : Thereofore Ziklag was (or perstained to) the King of Juda unto this day."}],"7":[{"catchword":null,"tekst":"Now the number of the days that David dwelt in the Philistines Land, was a year, and four months. [Heb. Was days, and four months. The word days in the plural number, is often taken by the Hebrews for a year, See Levit. 25. 29. David abode at Ziklag until the death of Saul, then came he to Hebron, 2 Sam. 2. 1. Some take it thus: (Certain) days, and four months]."}],"8":[{"catchword":null,"tekst":"David now went up with his men, and they fell upon the Gesurites, [See the annotat. On Jos. 12. 5. And 16. 3.] and the Girzites, [For Girzites. These were Canaanites, that dwelt before time at Gezer, or Gazer, in the Land of Ephraim. These being thence also expelled, went and dwelt on the South-side of the Land of Canaan.] and the Amalekites; [These were of Esau&acirc;&euro;&trade;s posterity whom the Lord commanded Saul utterly to destroy: but he left some remaining, against whom David here maketh war] (for these) [viz. The Gesurites, and the Girzites; these formerly inhabited the Land of Canaan] were of old the inhabitants of the Land) [viz. The Jewish Land, both on this and on the other side of Jordan] where thou goest to Sur, and unto the Land of Egypt."}],"9":[{"catchword":null,"tekst":"And David smote that Land, [viz. The inhabitants of the Land. This is now to be understood of all the Amalekites, which he found // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 2;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
