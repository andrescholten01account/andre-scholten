een, zoek de ezelinnen.","4":"Hij dan ging door het gebergte van Efraïm, en hij ging door het land van Salisa, maar zij vonden ze niet; daarna gingen zij door het land van Sahalim, maar zij waren er niet; verder ging hij door het land van Jemini, maar zij vonden ze niet.","5":"Toen zij in het land van Zuf kwamen, zei Saul tegen zijn knecht, die bij hem was: Kom, laten we teruggaan; anders houdt mijn vader misschien op met zich zorgen te maken over de ezelinnen, en maakt hij zich zorgen om ons.","6":"Hij daarentegen zei tegen hem: Zie toch, er is een man van God in deze stad, en hij is een geëerd man; alles wat hij zegt, komt zeker uit; laten wij nu daarheen gaan, misschien zal hij ons onze weg aanwijzen, die wij gaan zullen.","7":"Toen zei Saul tegen zijn knecht: Maar zie, als wij gaan, wat zullen we die man dan brengen? Want het brood is op uit onze zakken, en wij hebben geen geschenk om de man van God te brengen; wat hebben wij?","8":"En de knecht antwoordde Saul verder en zei: Zie, ik heb bij me het vierde deel van een zilveren sikkel; dat zal ik de man van God geven, opdat hij ons onze weg wijst.","9":"(Eertijds zei ieder in Israël dit, als hij ging om God te vragen: Kom, laten wij gaan naar de ziener; want wie tegenwoordig een profeet genoemd wordt, werd eertijds een ziener genoemd.)","10":"Toen zei Saul tegen zijn knecht: Uw woord is goed, kom, laten wij gaan. En zij gingen naar de stad, waar de man van God was.","11":"Toen zij door de opgang naar de stad omhoog liepen, vonden zij meisjes, die naar buiten gingen om water te putten; en zij zeiden tegen hen: Is de ziener hier?","12":"Toen antwoordden zij hun, en zeiden: Ja, hij is er, kijk, hij is vlak voor u; haast u nu, want hij is vandaag in de stad gekomen, omdat het volk vandaag een offer heeft op de hoogte.","13":"Wanneer u de stad in komt, zult u hem meteen vinden, voordat hij naar de hoogte gaat om te eten; want het volk zal niet eten totdat hij komt, want hij zegent het offer, en daarna eten de genodigden; ga daarom nu naar boven, want juist nu zult u hem vinden.","14":"Zo gingen zij de stad in. Toen zij midden in de stad kwamen, zie, kwam Samuel hun tegemoet, om naar de hoogte te gaan.","15":"Want de HEERE had het aan Samuël geopenbaard, een dag voordat Saul kwam, en had gezegd:","16":"Morgen omstreeks deze tijd zal Ik naar u een man sturen uit het land van Benjamin, die zult u tot voorganger zalven over Mijn volk Israël; en hij zal Mijn volk verlossen uit de hand van de Filistijnen, want Ik heb naar Mijn volk omgezien, omdat hun geroep tot Mij gekomen is.","17":"Toen Samuel Saul zag, antwoordde de HEERE hem: Zie, dit is de man, van wie Ik u gezegd heb: Deze zal over Mijn volk heersen.","18":"En Saul kwam naar Samuel toe, midden in de poort, en zei: Wijs mij toch, waar is hier het huis van de ziener?","19":"En Samuel antwoordde Saul en zei: Ik ben de ziener; ga voor mij uit naar de hoogte, zodat u vandaag met mij eet; dan zal ik u morgenvroeg laten gaan, en alles wat in uw hart is, zal ik u bekendmaken.","20":"Wat de ezelinnen betreft, die u nu drie dagen geleden kwijt bent geraakt, maak u daar geen zorgen over, want zij zijn gevonden; en van wie zal alles zijn wat begerenswaardig is in Israël? Is het niet van u, en van heel het huis van uw vader?","21":"Toen antwoordde Saul, en zei: Ben ik niet een zoon van Jemini, van de kleinste van de stammen van Israël? En is mijn geslacht niet het kleinste van alle geslachten van de stam van Benjamin? Waarom spreekt u mij dan aan met zulke woorden?","22":"Samuel dan nam Saul en zijn knecht, en bracht hen in de kamer; en hij gaf hun de voornaamste plaats onder de genodigden; die nu waren ongeveer dertig man.","23":"Toen zei Samuel tegen de kok: Breng dat stuk, dat ik u gegeven heb, waarvan ik tegen u zei: Zet het bij u weg.","24":"De kok nu bracht een schouder, met wat daaraan was, en zette het voor Saul; en hij zei: Zie, dit is wat overgebleven is; zet het voor u, eet, want het is voor u bewaard tot deze bestemde tijd, toen ik zei: Ik heb het volk genodigd. Zo at Saul die dag met Samuel.","25":"Daarna gingen zij van de hoogte af naar de stad; en hij sprak met Saul op het dak.","26":"En zij stonden vroeg op; en het gebeurde, omstreeks het opkomen van het dageraad, dat Samuel Saul riep op het dak, en zei: Sta op, dan zal ik u laten gaan. Toen stond Saul op, en zij gingen beiden naar buiten, hij en Samuel.","27":"Toen zij afgedaald waren tot aan het einde van de stad, zei Samuel tegen Saul: Zeg tegen de knecht dat hij voor ons uit gaat; toen ging hij heen; maar blijft u nu even staan, en ik zal u het woord van God laten horen."},"SV":{"1":"Er was nu een man van Benjamin, wiens naam was Kis, een zoon van Abiël, den zoon van Zeror, den zoon van Bechorath, den zoon van Afiah, den zoon eens mans van Jemini, een dapper held.","2":"Die had een zoon, wiens naam was Saul, een jongeling, en schoon, ja, er was geen schoner man dan hij onder de kinderen Israëls; van zijn schouderen en opwaarts was hij hoger dan al het volk.","3":"De ezelinnen nu van Kis, den vader van Saul, waren verloren; daarom zeide Kis tot zijn zoon Saul: Neem nu een van de jongens met u, en maak u op, ga heen, zoek de ezelinnen.","4":"Hij dan ging door het gebergte van Efraïm, en hij ging door het land van Salisa, maar zij vonden ze niet; daarna gingen zij door het land van Sahalim, maar zij waren er niet; verder ging hij door het land van Jemini, doch zij vonden ze niet.","5":"Toen zij in het land van Zuf kwamen, zeide Saul tot zijn jongen, die bij hem was: Kom en laat ons wederkeren; dat niet misschien mijn vader van de ezelinnen aflate, en voor ons bekommerd zij.","6":"Hij daarentegen zeide tot hem: Zie toch, er is een man Gods in deze stad, en hij is een geëerd man; al wat hij spreekt, dat komt zekerlijk; laat ons nu derwaarts gaan, misschien zal hij ons onzen weg aanwijzen, op denwelken wij gaan zullen.","7":"Toen zeide Saul tot zijn jongen: Maar zie, zo wij gaan, wat zullen wij toch dien man brengen? Want het brood is weg uit onze vaten, en wij hebben geen gaven, om den man Gods te brengen; wat hebben wij?","8":"En de jongen antwoordde Saul verder en zeide: Zie, er vindt zich in mijn hand het vierendeel eens zilveren sikkels; dat zal ik den man Gods geven, opdat hij ons onzen weg wijze.","9":"( Eertijds zeide een ieder aldus in Israël, als hij ging om God te vragen: Komt en laat ons gaan tot den ziener; want die heden een profeet *genoemd* *wordt*, die werd eertijds een ziener genoemd.)","10":"Toen zeide Saul tot zijn jongen: Uw woord is goed, kom, laat ons gaan. En zij gingen naar de stad, waar de man Gods was.","11":"Als zij opklommen door den opgang der stad, zo vonden zij maagden, die uitgingen om water te putten; en zij zeiden tot haar: Is de ziener hier?","12":"Toen antwoordden zij hun, en zeiden: Ziet, hij is voor uw aangezicht; haast u nu, want hij is heden in de stad gekomen, dewijl het volk heden een offerande heeft op de hoogte.","13":"Wanneer gijlieden in de stad komt, zo zult gij hem vinden, eer hij opgaat op de hoogte om te eten; want het volk zal niet eten, totdat hij komt, want hij zegent het offer, daarna eten de genodigden; daarom gaat nu op, want hem, als heden zult gij hem vinden.","14":"Alzo gingen zij op in de stad. Toen zij in het midden der stad kwamen, ziet, zo ging Samuël uit hun tegemoet, om op te gaan naar de hoogte.","15":"Want de HEERE had het *voor* Samuëls oor geopenbaard, een dag eer Saul kwam, zeggende:","16":"Morgen omtrent dezen tijd zal Ik tot u zenden een man uit het land van Benjamin, dien zult gij ten voorganger zalven over Mijn volk Israël; en hij zal Mijn volk verlossen uit der Filistijnen hand, want Ik heb Mijn volk aangezien, dewijl deszelfs geroep tot Mij gekomen is.","17":"Toen Samuël Saul aanzag, zo antwoordde hem de HEERE: Zie, dit is de man, van welken Ik u gezegd heb: Deze zal over Mijn volk heersen.","18":"En Saul naderde tot Samuël in het midden der poort, en zeide: Wijs mij toch, waar is hier het huis des zieners?","19":"En Samuël antwoordde Saul en zeide: Ik ben de ziener; ga op voor mijn aangezicht op de hoogte, dat gijlieden heden met mij eet; zo zal ik u morgen vroeg laten gaan, en alles, wat in uw hart is, zal ik u te kennen geven.","20":"Want de ezelinnen aangaande, die gij heden den derden dag verloren hebt, zet uw hart daarop niet, want zij zijn gevonden; en wiens zal zijn al het gewenste, dat in Israël is? Is het niet van u, en van het ganse huis uws vaders?","21":"Toen antwoordde Saul, en zeide: Ben ik niet een zoon van Jemini, van den kleinsten der stammen van Israël? en mijn geslacht *is* *het* *niet* het kleinste van al de geslachten van den stam van Benjamin? Waarom spreekt gij mij dan aan met zulke woorden?","22":"Samuël dan nam Saul en zijn jongen, en hij bracht ze in de kamer; en hij gaf hun plaats aan het opperste der genodigden; die nu waren omtrent dertig man.","23":"Toen zeide Samuël tot den kok: Lang dat stuk, hetwelk Ik u gegeven heb, waarvan ik tot u zeide: Zet het bij u weg.","24":"De kok nu bracht een schouder op, met wat daaraan was, en zette het voor Saul; en hij zeide: Zie, dit is het overgeblevene; zet het voor u, eet, want het is ter bestemder tijd voor u bewaard, als ik zeide: Ik heb het volk genodigd. Alzo at Saul met Samuël op dien dag.","25":"Daarna gingen zij af van de hoogte in de stad; en hij sprak met Saul op het dak.","26":"En zij stonden vroeg op; en het geschiedde, omtrent den opgang des dageraads, zo riep Samuël Saul op het dak, zeggende: Sta op, dat ik u gaan late. Toen stond Saul op, en zij beiden gingen uit, hij en Samuël, naar buiten.","27":"Toen zij afgegaan waren aan het einde der stad, zo zeide Samuël tot Saul: Zeg den jongen, dat hij voor onze aangezichten heenga; toen ging hij heen; maar sta gij als nu stil, en ik zal u Gods woord doen horen."},"KJV":{"1":"Now there was a man of Benjamin, whose name was Kish, the son of Abiel, the son of Zeror, the son of Bechorath, the son of Aphiah, a Benjamite, a mighty man of power.","2":"And he had a son, whose name was Saul, a choice young man, and a goodly: and there was not among the children of Israel a goodlier person than he: from his shoulders and upward he was higher than any of the people.","3":"And the asses of Kish Saul's father were lost. And Kish said to Saul his son, Take now one of the servants with thee, and arise, go seek the asses.","4":"And he passed through mount Ephraim, and passed through the land of Shalisha, but they found them not: then they passed through the land of Shalim, and there they were not: and he passed through the land of the Benjamites, but they found them not.","5":"And when they were come to the land of Zuph, Saul said to his servant that was with him, Come, and let us return; lest my father leave caring for the asses, and take thought for us.","6":"And he said unto him, Behold now, there is in this city a man of God, and he is an honourable man; all that he saith cometh surely to pass: now let us go thither; peradventure he can shew us our way that we should go.","7":"Then said Saul to his servant, But, behold, if we go, what shall we bring the man? for the bread is spent in our vessels, and there is not a present to bring to the man of God: what have we?","8":"And the servant answered Saul again, and said, Behold, I have here at hand the fourth part of a shekel of silver: that will I give to the man of God, to tell us our way.","9":"(Beforetime in Israel, when a man went to enquire of God, thus he spake, Come, and let us go to the seer: for he that is now called a Prophet was beforetime called a Seer.)","10":"Then said Saul to his servant, Well said; come, let us go. So they went unto the city where the man of God was.","11":"And as they went up the hill to the city, they found young maidens going out to draw water, and said unto them, Is the seer here?","12":"And they answered them, and said, He is; behold, he is before you: make haste now, for he came to day to the city; for there is a sacrifice of the people to day in the high place:","13":"As soon as ye be come into the city, ye shall straightway find him, before he go up to the high place to eat: for the people will not eat until he come, because he doth bless the sacrifice; and afterwards they eat that be bidden. Now therefore get you up; for about this time ye shall find him.","14":"And they went up into the city: and when they were come into the city, behold, Samuel came out against them, for to go up to the high place.","15":"Now the LORD had told Samuel in his ear a day before Saul came, saying,","16":"To morrow about this time I will send thee a man out of the land of Benjamin, and thou shalt anoint him to be captain over my people Israel, that he may save my people out of the hand of the Philistines: for I have looked upon my people, because their cry is come unto me.","17":"And when Samuel saw Saul, the LORD said unto him, Behold the man whom I spake to thee of! this same shall reign over my people.","18":"Then Saul drew near to Samuel in the gate, and said, Tell me, I pray thee, where the seer's house is.","19":"And Samuel answered Saul, and said, I am the seer: go up before me unto the high place; for ye shall eat with me to day, and to morrow I will let thee go, and will tell thee all that is in thine heart.","20":"And as for thine asses that were lost three days ago, set not thy mind on them; for they are found. And on whom is all the desire of Israel? Is it not on thee, and on all thy father's house?","21":"And Saul answered and said, Am not I a Benjamite, of the smallest of the tribes of Israel? and my family the least of all the families of the tribe of Benjamin? wherefore then speakest thou so to me?","22":"And Samuel took Saul and his servant, and brought them into the parlour, and made them sit in the chiefest place among them that were bidden, which were about thirty persons.","23":"And Samuel said unto the cook, Bring the portion which I gave thee, of which I said unto thee, Set it by thee.","24":"And the cook took up the shoulder, and that which was upon it, and set it before Saul. And Samuel said, Behold that which is left! set it before thee, and eat: for unto this time hath it been kept for thee since I said, I have invited the people. So Saul did eat with Samuel that day.","25":"And when they were come down from the high place into the city, Samuel communed with Saul upon the top of the house.","26":"And they arose early: and it came to pass about the spring of the day, that Samuel called Saul to the top of the house, saying, Up, that I may send thee away. And Saul arose, and they went out both of them, he and Samuel, abroad.","27":"And as they were going down to the end of the city, Samuel said to Saul, Bid the servant pass on before us, (and he passed on,) but stand thou still a while, that I may shew thee the word of God."}},"tsk":{"1":[{"kopje":"Kis","refs":["1 Sam 14:51","1 Kron 8:30-33","1 Kron 9:36-39","Hand 13:21"]},{"kopje":"dapper held","refs":["1 Sam 25:2","2 Sam 19:32","Job 1:3"]}],"2":[{"kopje":"knap","refs":["1 Sam 16:7","Gen 6:2","2 Sam 14:25","2 Sam 14:26","Jer 9:23"]},{"kopje":"van zijn schouders","refs":["1 Sam 10:23","1 Sam 17:4","Num 13:33"]}],"4":[{"kopje":"gebergte","refs":["Richt 17:1","Richt 19:1"]},{"kopje":"Salisa","refs":["2 Kon 4:42"]},{"kopje":"Sahalim","refs":["Gen 33:18","Joh 3:23"]}],"5":[{"kopje":"Zuf","refs":["1 Sam 1:1"]},{"kopje":"zich zorgen te maken","refs":["1 Sam 10:2","Matt 6:25","Matt 6:28","Matt 6:34","Luk 12:11","Luk 12:22"]}],"6":[{"kopje":"stad","refs":["1 Sam 2:27","Deut 33:1","1 Kon 13:1","2 Kon 6:6","1 Tim 6:11"]},{"kopje":"geëerd","refs":["1 Tess 2:10","1 Tess 5:13"]},{"kopje":"alles wat hij zegt","refs":["1 Sam 3:19","1 Sam 3:20","Jes 44:26","Zach 1:5","Zach 1:6","Matt 24:35"]}],"7":[{"kopje":"wat zullen we","refs":["Richt 6:18","Richt 13:15-17","1 Kon 14:3","2 Kon 4:42","2 Kon 5:5","2 Kon 8:8"]}],"8":[{"kopje":"ik heb bij me","refs":["1 Sam 9:8"]}],"9":[{"kopje":"vragen","refs":["Gen 25:22","Richt 1:1"]},{"kopje \"wl wl-kjv\" data-code=\"H4605\">upward</span> he was <span class=\"wl wl-kjv\" data-code=\"H1364\">higher</span> than any of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people.</span>","3":"And the <span class=\"wl wl-kjv\" data-code=\"H860\">asses</span> of <span class=\"wl wl-kjv\" data-code=\"H7027\">Kish</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul's</span> <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> were <span class=\"wl wl-kjv\" data-code=\"H6\">lost.</span> And <span class=\"wl wl-kjv\" data-code=\"H7027\">Kish</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">Take</span> now <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of the <span class=\"wl wl-kjv\" data-code=\"H5288\">servants</span> with thee, and <span class=\"wl wl-kjv\" data-code=\"H6965\">arise,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> the <span class=\"wl wl-kjv\" data-code=\"H860\">asses.</span>","4":"And he passed <span class=\"wl wl-kjv\" data-code=\"H5674\">through</span> <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim,</span> and passed <span class=\"wl wl-kjv\" data-code=\"H5674\">through</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H8031\">Shalisha,</span> but they <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> them not: then they passed <span class=\"wl wl-kjv\" data-code=\"H5674\">through</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H8171\">Shalim,</span> and there they were not: and he passed <span class=\"wl wl-kjv\" data-code=\"H5674\">through</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of the <span class=\"wl wl-kjv\" data-code=\"H1145\">Benjamites,</span> but they <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> them not.","5":"And when they were <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H6689\">Zuph,</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to his <span class=\"wl wl-kjv\" data-code=\"H5288\">servant</span> that was with him, <span class=\"wl wl-kjv\" data-code=\"H3212\">Come,</span> and let us <span class=\"wl wl-kjv\" data-code=\"H7725\">return;</span> lest my <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H2308\">leave</span> caring for the <span class=\"wl wl-kjv\" data-code=\"H860\">asses,</span> and take <span class=\"wl wl-kjv\" data-code=\"H1672\">thought</span> for us.","6":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Behold now, there is in this <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and he is an <span class=\"wl wl-kjv\" data-code=\"H3513\">honourable</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man;</span> all that he <span class=\"wl wl-kjv\" data-code=\"H1696\">saith</span> <span class=\"wl wl-kjv\" data-code=\"H935\">cometh</span> surely to <span class=\"wl wl-kjv\" data-code=\"H935\">pass:</span> now let us <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> thither; peradventure he can <span class=\"wl wl-kjv\" data-code=\"H5046\">shew</span> us our <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> that we should <span class=\"wl wl-kjv\" data-code=\"H1980\">go.</span>","7":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> to his <span class=\"wl wl-kjv\" data-code=\"H5288\">servant,</span> But, behold, if we <span class=\"wl wl-kjv\" data-code=\"H3212\">go,</span> what shall we <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> the <span class=\"wl wl-kjv\" data-code=\"H376\">man?</span> for the <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> is <span class=\"wl wl-kjv\" data-code=\"H235\">spent</span> in our <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels,</span> and there is not a <span class=\"wl wl-kjv\" data-code=\"H8670\">present</span> to <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> to the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> what have we?","8":"And the <span class=\"wl wl-kjv\" data-code=\"H5288\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H3254\">again,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Behold, I <span class=\"wl wl-kjv\" data-code=\"H4672\">have</span> here at <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> the fourth <span class=\"wl wl-kjv\" data-code=\"H7253\">part</span> of a <span class=\"wl wl-kjv\" data-code=\"H8255\">shekel</span> of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver:</span> that will I <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> to the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> to <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> us our <span class=\"wl wl-kjv\" data-code=\"H1870\">way.</span>","9":"<span class=\"wl wl-kjv\" data-code=\"H6440\">(Beforetime</span> in <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> when a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> to <span class=\"wl wl-kjv\" data-code=\"H1875\">enquire</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> thus he <span class=\"wl wl-kjv\" data-code=\"H559\">spake,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Come,</span> and let us <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> to the <span class=\"wl wl-kjv\" data-code=\"H7200\">seer:</span> for he that is <span class=\"wl wl-kjv\" data-code=\"H3117\">now</span> called a <span class=\"wl wl-kjv\" data-code=\"H5030\">Prophet</span> was <span class=\"wl wl-kjv\" data-code=\"H6440\">beforetime</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> a <span class=\"wl wl-kjv\" data-code=\"H7200\">Seer.)</span>","10":"Then <span class=\"wl wl-kjv\" data-code=\"H1697\">said</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> to his <span class=\"wl wl-kjv\" data-code=\"H5288\">servant,</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">Well</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said;</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">come,</span> let us <span class=\"wl wl-kjv\" data-code=\"H3212\">go.</span> So they <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> where the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> was.","11":"And as they went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H4608\">hill</span> to the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> they <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> young <span class=\"wl wl-kjv\" data-code=\"H5291\">maidens</span> going <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> to <span class=\"wl wl-kjv\" data-code=\"H7579\">draw</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, <span class=\"wl wl-kjv\" data-code=\"H3426\">Is</span> the <span class=\"wl wl-kjv\" data-code=\"H7200\">seer</span> here?","12":"And they <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> them, and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> He <span class=\"wl wl-kjv\" data-code=\"H3426\">is;</span> behold, he is <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> you: make <span class=\"wl wl-kjv\" data-code=\"H4116\">haste</span> now, for he <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> to the <span class=\"wl wl-kjv\" data-code=\"H5892\">city;</span> for there is a <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifice</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> to <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> in the high <span class=\"wl wl-kjv\" data-code=\"H1116\">place:</span>","13":"As soon as ye be <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> into the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> ye shall <span class=\"wl wl-kjv\" data-code=\"H3651\">straightway</span> <span class=\"wl wl-kjv\" data-code=\"H4672\">find</span> him, before he go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to the high <span class=\"wl wl-kjv\" data-code=\"H1116\">place</span> to <span class=\"wl wl-kjv\" data-code=\"H398\">eat:</span> for the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> will not <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> until he <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> because he doth <span class=\"wl wl-kjv\" data-code=\"H1288\">bless</span> the <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifice;</span> and <span class=\"wl wl-kjv\" data-code=\"H310\">afterwards</span> they <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> that be <span class=\"wl wl-kjv\" data-code=\"H7121\">bidden.</span> Now therefore get you <span class=\"wl wl-kjv\" data-code=\"H5927\">up;</span> for about this <span class=\"wl wl-kjv\" data-code=\"H3117\">time</span> ye shall <span class=\"wl wl-kjv\" data-code=\"H4672\">find</span> him.","14":"And they went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">into</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city:</span> and when they were <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> into the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> behold, <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> came <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> <span class=\"wl wl-kjv\" data-code=\"H7125\">against</span> them, for to go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to the high <span class=\"wl wl-kjv\" data-code=\"H1116\">place.</span>","15":"Now the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> had <span class=\"wl wl-kjv\" data-code=\"H1540\">told</span> <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> in his <span class=\"wl wl-kjv\" data-code=\"H241\">ear</span> <span class=\"wl wl-kjv\" data-code=\"H259\">a</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span>","16":"To <span class=\"wl wl-kjv\" data-code=\"H4279\">morrow</span> about this <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> I will <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> thee a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin,</span> and thou shalt <span class=\"wl wl-kjv\" data-code=\"H4886\">anoint</span> him to be <span class=\"wl wl-kjv\" data-code=\"H5057\">captain</span> over my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> that he may <span class=\"wl wl-kjv\" data-code=\"H3467\">save</span> my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> out of the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines:</span> for I have <span class=\"wl wl-kjv\" data-code=\"H7200\">looked</span> upon my <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> because their <span class=\"wl wl-kjv\" data-code=\"H6818\">cry</span> is <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> unto me.","17":"And when <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">said</span> unto him, Behold the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> whom I <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> to thee of! this same shall <span class=\"wl wl-kjv\" data-code=\"H6113\">reign</span> over my <span class=\"wl wl-kjv\" data-code=\"H5971\">people.</span>","18":"Then <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> drew <span class=\"wl wl-kjv\" data-code=\"H5066\">near</span> to <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">in</span> the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">Tell</span> me, I pray thee, <span class=\"wl wl-kjv\" data-code=\"H335\">where</span> the <span class=\"wl wl-kjv\" data-code=\"H7200\">seer's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> is.","19":"And <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I am the <span class=\"wl wl-kjv\" data-code=\"H7200\">seer:</span> go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> me unto the high <span class=\"wl wl-kjv\" data-code=\"H1116\">place;</span> for ye shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> with me to <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> and to <span class=\"wl wl-kjv\" data-code=\"H1242\">morrow</span> I will let thee <span class=\"wl wl-kjv\" data-code=\"H7971\">go,</span> and will <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> thee all that is in thine <span class=\"wl wl-kjv\" data-code=\"H3824\">heart.</span>","20":"And as for thine <span class=\"wl wl-kjv\" data-code=\"H860\">asses</span> that were <span class=\"wl wl-kjv\" data-code=\"H6\">lost</span> <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">ago,</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> not thy <span class=\"wl wl-kjv\" data-code=\"H3820\">mind</span> on them; for they are <span class=\"wl wl-kjv\" data-code=\"H4672\">found.</span> And on whom is all the <span class=\"wl wl-kjv\" data-code=\"H2532\">desire</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel?</span> Is it not on thee, and on all thy <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house?</span>","21":"And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Am not I a <span class=\"wl wl-kjv\" data-code=\"H1145\">Benjamite,</span> of the <span class=\"wl wl-kjv\" data-code=\"H6996\">smallest</span> of the <span class=\"wl wl-kjv\" data-code=\"H7626\">tribes</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel?</span> and my <span class=\"wl wl-kjv\" data-code=\"H4940\">family</span> the <span class=\"wl wl-kjv\" data-code=\"H6810\">least</span> of all the <span class=\"wl wl-kjv\" data-code=\"H4940\">families</span> of the <span class=\"wl wl-kjv\" data-code=\"H7626\">tribe</span> of <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin?</span> wherefore then <span class=\"wl wl-kjv\" data-code=\"H1696\">speakest</span> thou <span class=\"wl wl-kjv\" data-code=\"H1697\">so</span> to me?","22":"And <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> and his <span class=\"wl wl-kjv\" data-code=\"H5288\">servant,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> them into the <span class=\"wl wl-kjv\" data-code=\"H3957\">parlour,</span> and made them <span class=\"wl wl-kjv\" data-code=\"H5414\">sit</span> in the <span class=\"wl wl-kjv\" data-code=\"H7218\">chiefest</span> <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> among them that were <span class=\"wl wl-kjv\" data-code=\"H7121\">bidden,</span> which were about <span class=\"wl wl-kjv\" data-code=\"H7970\">thirty</span> <span class=\"wl wl-kjv\" data-code=\"H376\">persons.</span>","23":"And <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H2876\">cook,</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">Bring</span> the <span class=\"wl wl-kjv\" data-code=\"H4490\">portion</span> which I <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> thee, of which I <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto thee, <span class=\"wl wl-kjv\" data-code=\"H7760\">Set</span> it by thee.","24":"And the <span class=\"wl wl-kjv\" data-code=\"H2876\">cook</span> took <span class=\"wl wl-kjv\" data-code=\"H7311\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H7785\">shoulder,</span> and that which was upon it, and <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> it <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul.</span> And Samuel <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Behold that which is <span class=\"wl wl-kjv\" data-code=\"H7604\">left!</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> it <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thee, and <span class=\"wl wl-kjv\" data-code=\"H398\">eat:</span> for unto this <span class=\"wl wl-kjv\" data-code=\"H4150\">time</span> hath it been <span class=\"wl wl-kjv\" data-code=\"H8104\">kept</span> for thee since I <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I have <span class=\"wl wl-kjv\" data-code=\"H7121\">invited</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people.</span> So <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> did <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> with <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> that <span class=\"wl wl-kjv\" data-code=\"H3117\">day.</span>","25":"And when they were come <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> from the high <span class=\"wl wl-kjv\" data-code=\"H1116\">place</span> into the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> Samuel <span class=\"wl wl-kjv\" data-code=\"H1696\">communed</span> with <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> upon the top of the <span class=\"wl wl-kjv\" data-code=\"H1406\">house.</span>","26":"And they arose <span class=\"wl wl-kjv\" data-code=\"H7925\">early:</span> and it came to pass about the <span class=\"wl wl-kjv\" data-code=\"H5927\">spring</span> of the <span class=\"wl wl-kjv\" data-code=\"H7837\">day,</span> that <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> to the top of the <span class=\"wl wl-kjv\" data-code=\"H1406\">house,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">Up,</span> that I may send thee <span class=\"wl wl-kjv\" data-code=\"H7971\">away.</span> And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and they went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">both</span> of them, he and <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel,</span> <span class=\"wl wl-kjv\" data-code=\"H2351\">abroad.</span>","27":"And as they were going <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to the <span class=\"wl wl-kjv\" data-code=\"H7097\">end</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">Bid</span> the <span class=\"wl wl-kjv\" data-code=\"H5288\">servant</span> pass <span class=\"wl wl-kjv\" data-code=\"H5674\">on</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> us, (and he passed <span class=\"wl wl-kjv\" data-code=\"H5674\">on,)</span> but <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> thou still a <span class=\"wl wl-kjv\" data-code=\"H3117\">while,</span> that I may <span class=\"wl wl-kjv\" data-code=\"H8085\">shew</span> thee the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Abiël,","tekst":"Anders, Ner; 1Ch 8:33, en 1Ch 9:39."},{"catchword":"zoon eens mans van Jemini,","tekst":"Anders, een man, die een Benjaminiet was."}],"2":[{"catchword":"schoon,","tekst":"Hebreeuws, goed; alzo ook Gen 6:2."}],"3":[{"catchword":"verloren;","tekst":"Dit is niet bij geval geschied, maar door de voorzienigheid Gods, om alzo Saul tot Samuël te brengen en tot koning te doen zalven."}],"4":[{"catchword":"Salisa,","tekst":"Dit is een vlak land, gelijk te zien is 2Ki 4:42."},{"catchword":"Sáhalim,","tekst":"In dit land, gelegen in den stam van Benjamin, lag de stad Salim, waarvan melding wordt gedaan Joh 3:23, niet wijd van Gilgal, bij de Jordaan."},{"catchword":"door het land van Jemini,","tekst":"Of, door het land der Benjaminieten."}],"5":[{"catchword":"Zuf kwamen,","tekst":"Zie boven, 1Sa 1:1."}],"6":[{"catchword":"man Gods in deze stad,","tekst":"Dat is, een profeet; te weten, Samuël. Zie de aantekeningen Jdg 13:6."},{"catchword":"komt zekerlijk;","tekst":"Hebreeuws, het komt komende"},{"catchword":"ons onzen weg aanwijzen,","tekst":"Dat is, welken weg wij moeten ingaan om onze ezelinnen te vinden, waarom wij ons op deze reis begeven hebben."}],"7":[{"catchword":"wat zullen wij toch dien man brengen?","tekst":"Alsof hij zeide: Wij kennen dezen man Gods niet, noch hij ons, en wij zullen hem moeite aandoen, de eerbaarheid zou wel vereisen dat wij hem iets vereren zouden. Zie dergelijk exempel 1Ki 14:3, en 2Ki 4:42."},{"catchword":"het brood is weg","tekst":"Dat is, onze voorraad of provisie, zodat wij niets hebben om den profeet te vereren."},{"catchword":"vaten,","tekst":"Dat is, onze knapzakken of malen."},{"catchword":"gaven,","tekst":"Zie de aantekeningen Jdg 13:17, en 1Ki 14:3."}],"8":[{"catchword":"vindt zich in mijn hand","tekst":"Dat is, ik heb in mijn hand. Alzo staat er 1Pe 2:22 : Er is geen bedrog in zijn mond gevonden; dat is, er was geen bedrog in zijn mond. Zie Isa 53:9."},{"catchword":"zilveren sikkels;","tekst":"Van de waarde des sikkels zie de aantekeningen Gen 20:16. Het vierendeel van een zilveren sikkel was niet veel meer dan drie stuivers. Zodat er in deze verering meer werd gezien op het dankbaar gemoed dan op de waardigheid des geschenks."}],"9":[{"catchword":"Eertijds zeide een","tekst":"De woorden van dit vs. zijn de woorden van den schrijver van dit boek, en hieruit willen enigen besluiten dat niet Samuël maar Ezra of iemand anders dit boek geschreven heeft."},{"catchword":"vragen","tekst":"Te weten, door een profeet."},{"catchword":"ziener genoemd","tekst":"Alzo werden de profeten genoemd, omdat zich God door gezichten aan hen openbaarde, hetgeen zij het volk te kennen gaven. Zie Num 12:6, en Num 24:4."}],"10":[{"catchword":"Uw woord is goed,","tekst":"Dat is, gij hebt recht en wel gesproken."},{"catchword":"naar de stad,","tekst":"Te weten, naar Rama."}],"11":[{"catchword":"ziener hier?","tekst":"Anders, is hier een ziener?"}],"12":[{"catchword":"hij is voor uw aangezicht;","tekst":"Dit is niet te zeggen, dat Saul en zijn knecht te dier stond Samuël zagen, of met den opslag hunner ogen zien konden; zij zagen hem niet vóór zij in de stad bij hem kwamen, zodat de woorden voor uw aangezicht betekenen nabij, of bij de Hand."},{"catchword":"een offerande heeft op de hoogte","tekst":"Hebreeuws, een slachting. Anders, een maaltijd, gelijk Gen 31:54, en 1Sa 28:24; 1Ki 19:21."}],"13":[{"catchword":"hij zegent","tekst":"Te weten, door het gebed en met dankzegging, Deu 8:10."},{"catchword":"het offer,","tekst":"Dat is, het geofferd vlees, waarmede men maaltijd zal houden."}],"14":[{"catchword":"ging Samuël uit hun tegemoet,","tekst":"Want hij wist wel dat zij te dien tijde tot hem komen zouden, gelijk blijkt uit vs.15,16."}],"15":[{"catchword":"Want de HEERE","tekst":"Hier wordt aangewezen de oorzaak waarom Samuël Saul tegemoet gegaan is, om wien hij dien plechtigen maaltijd had laten toebereiden."},{"catchword":"had het voor Samuëls oor geopenbaard,","tekst":"Dat is, de Heere had het Samuël klaarlijk te kennen gegeven. Zie dergelijke manier van spreken Rth 4:4; 1Sa 20:12-13; 2Sa 7:27; Job 33:16; Isa 22:14, en Isa 48:8."}],"16":[{"catchword":"tot u zenden","tekst":"Te weten, door een heimelijke drift want Saul dacht hier niet op, maar hij was uitgegaan om de ezelinnen te zoeken."}],"17":[{"catchword":"zo antwoordde hem de HEERE","tekst":"Te weten, door een heimelijke aanspraak, gelijk onder, 1Sa 16:7, 1Sa 16:12."},{"catchword":"heersen","tekst":"Hebreeuws, terughouden. Het is zoveel te zeggen als, hij zal door zijn autoriteit, bevel en straf, de boze mensen terughouden, tomen, bedwingen van zondigen, of van te doen wat zij willen."}],"18":[{"catchword":"het midden der poort,","tekst":"Dat is, in het midden der stad. Zie boven, vs.14."}],"19":[{"catchword":"alles, wat in uw hart is,","tekst":"Dat is, al hetgeen waar gij mede bekommerd zijt, en mij vragen wilt."}],"20":[{"catchword":"zet uw hart daarop niet,","tekst":"Dat is, neem het niet ter harte."},{"catchword":"al het gewenste,","tekst":"Dat is, het beste en uitgelezenste, dat in Israël is. Zie boven 1Sa 8:11. Anders, tot wien is de ganse begeerte Israëls? Dat is, wien begeert al het volk van Israël tot hun koning liever dan u? Anderen nemen het in dezen zin, alsof hij zeide, op wien zal de keus tot koning, wien gans Israël begeert, vallen, anders dan op u?"}],"21":[{"catchword":"zoon van Jemini,","tekst":"Dat is, van een Benjaminiet."},{"catchword":"kleinsten der stammen van Israël?","tekst":"Deze stam, te weten de stam Benjamins, was schier geheel verdelgd geworden, vanwege het bijwijf van den Leviet. Alzo dat er maar zes honderd mannen waren overgebleven, Jdg 20:47."},{"catchword":"spreekt gij mij dan aan met zulke woorden?","tekst":"Hebreeuws, spreekt gij tot mij naar dit woord."}],"22":[{"catchword":"hij gaf hun plaats","tekst":"Dat is, hij zette hen boven aan. Hiermede heeft Samuël den aanwezenden gasten enigermate te kennen gegeven de waardigheid van het ambt, waartoe God Saul verordineerd had; gelijk hij ook zulks deed met Saul het voornaamste stuk spijs voor te zetten. Zie iets dergelijks Gen 43:34. Ja om Sauls wil heeft hij ook zijn jongen geëerd en mede bovenaan gezet."}],"23":[{"catchword":"tot den kok","tekst":"Uit dit voorzegde blijkt genoegzaam dat Samuël om Sauls wil, dien hij wist dat op komenden weg was, dezen maaltijd had doen bereiden."}],"24":[{"catchword":"een schouder op,","tekst":"Het Hebreeuwse woord betekent zowel den voorbout als den achterbout."},{"catchword":"hij zeide","tekst":"Te weten, Samuël."},{"catchword":"want het is ter bestemder tijd voor u bewaard,","tekst":"Hij wil zeggen: Toen ik dezen maaltijd u ter ere liet bereiden, heb ik bevolen dat dit voornaamste stuk voor u zou bewaard worden."},{"catchword":"als ik zeide","tekst":"Te weten, tot den kok, of hofmeester, of dienaars, knechten, volk."}],"25":[{"catchword":"sprak met Saul","tekst":"Dat is, hij zeide hem het bevel Gods aan, dat hij koning zou worden."},{"catchword":"op het dak","tekst":"Te weten, op zijn, Samuëls dak. Eertijds waren de daken bij de Joden plat, zodat men er op kon gaan en wandelen; zie Deu 22:8."}],"26":[{"catchword":"zo riep Samuël Saul op het dak,","tekst":"Te weten, om daar met hem alleen te spreken van zijn roeping tot het koninkrijk."}],"27":[{"catchword":"dat hij voor onze aangezichten heenga;","tekst":"Te weten, opdat hij niet hore wat wij spreken."},{"catchword":"als nu stil,","tekst":"Hebreeuws, als dezen dag; dat is, in dezen tijd."},{"catchword":"en ik zal u Gods woord doen horen","tekst":"Samuël heeft wel Saul, toen zij alleen met hun beiden op het dak waren, den wil des Heeren, aangaande zijn verkiezing tot het koninklijke ambt, verklaard, maar naderhand, in het scheiden, heeft Samuël Saul zulks nog breder te kennen gegeven, hem daarbij voorzeggende de tekenen, die hem tot verzekering daarvan ontmoeten zouden, waarvan breder 1Sa 10 gesproken wordt."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Now there was a man of Benjamin, whose name was Kis, a son of Abiel, [Oth. Ner, 2 Chron.8.33. and 9.39.] the son of Zecor, the son of Bechorath, the son of Aphiah, the son of a man of Jemini, [Oth, a man that was a Benjamite] a mighty man of power."}],"2":[{"catchword":null,"tekst":"The same had a son whose name was Saul, a young man, and beautiful [Heb. Good, also, Gen 6:2.] Then there was not a more beautiful man then he among the children of Israel: from his shoulders and upward, he was taller than all the people."}],"3":[{"catchword":null,"tekst":"Now the she-asses of Kis Sauls father were lost: [ This came not to pass by chance, but by the providence of GOD, so to bring Saul unto Samuel, and to cause him to be anointed King] therefore said Kis unto his son Saul, Take now the lads with thee, and get thee up, go thy ways, seek the she-ashes."}],"4":[{"catchword":null,"tekst":"He then went through the mountain of Ephraim, and he went through the land of Salisa, [This is a plain country, as may be seen 2 King. 4.42.] but they found them not: therefore they passed thorough the land of Sahalim, [In this land, lying in tribe of Benjamin. Lay the city of Salan, whereof mention is made, Job .3.23. not far from Gilgal by Jordan] But they were not there: moreover he passed thorough the land of Jemini, [Or thorough the land of the Benjamites,] but they found them not."}],"5":[{"catchword":null,"tekst":"Then they came into the land of Zuph, [See above chap.1.1.] Sauk said unto his lad that was with him, Come and let us return: left perhaps my father cease (thinking) of the she-asses, and he careful for us."}],"6":[{"catchword":null,"tekst":"He on the contrary said unto him, Behold now, there is a man of God [i.e. Prophet, viz Samuel: see the annotat. Judg.13 on verse 6] in this city, and he is an honourable man, all that he speaketh what cometh surely ( to pass): [Heb. it cometh coming] Now let us go thither, per adventure he will show us our way that we should go. [i.e. which way we must go, for to find our she-asses, for which cause we have undertaken this journey.]"}],"7":[{"catchword":null,"tekst":"The said Saul unto his lad, But behold, if we go, what shall we bring unto that man: [As if he had said, We know not this man of God, neither doth he know us: we shall be troublesome to him: and it is both suitable honesty and decency, that we should grace him with some present or other: see the like example, 1 King. 14.3. and 2 King 4.42.] for the bread [i.e. our store, or provision] is gone [i.e. all our provision is spent: so that we have nothing to present the man of God with] out of our vessels, [i.e. out of our knapsacks or budgets] and we have no man of gift [ see the annotations of Judge.13.17. and 1 king 14.3] to bring unto man of God, what have we?"}],"8":[{"catchword":null,"tekst":"And the lad answered Saul further, and said, Behold, there is found in mine hand. [i.e. I have mine hand: see 1 Pet 2.22. It&acirc;&euro;&trade;s said, There was no guile found in his mouth: i.e. there was no guile in his mouth see Isa53. 9.] the fourth part of s shekel of silver. [ Of the value of the shekel, see the annotate. On Gen 20.16. The fourth part of a shekel of silver was not much more than three styvers, that is about three pence half penny of our English money: So that in this present, more was looked on the thankful mind, then on the worth or value of the gift] that will I give to the man of God that he may show us our way."}],"9":[{"catchword":null,"tekst":"(Before time everyone spake thus Israel, [The words of this verse are the words of the writer or Penman of this book, and hence some other man, wrote this book] when he went to enquire of God, [to wit, by a prophet] Come, and let us go to the seer: for he that this day, (is called) a Prophet, was before time called a seer.)[So were the prophets called , because God revealed that unto them in visions, which they made known unto people, see Numb. 12.6 and 24.4]"}],"10":[{"catchword":null,"tekst":"Then said Saul unto his lad, thy word is good, [i.e Thou hast spoken well, or right] come let us go : and they went unto the City, [Viz. Unto Rama] where the man of God was."}],"11":[{"catchword":null,"tekst":"As they went up by the ascent of the city, they found maidens that went forth to draw water; and they said unto them, is the seer here? [Otherwise, is here a seer?]"}],"12":[{"catchword":null,"tekst":"Then answered they them, and said, behold, he is before your face : [ This doth not intimate, that Saul and his servant did at that very instant, see Samuel, or with the lifting up of their eyes could see him : They saw him not, till they came to him in the City. So that the words, before your face, signifie, hard by, or neer at hand] make haste now, for he came to day into the city, for as much as the people have to day into the city, for as much as the people have to day a sacrifice [Heb. a slaughtering. Oth. a feast, or, banquet, as Gen 31:54 and I Sam.28.24, I Kings 19.21.] on the high place."}],"13":[{"catchword":null,"tekst":"When ye come into the city, so shall ye find him, before he go up to the high place to eat, for the people will not eat till he come, for he bleeseth [Viz. By prayer : and with thanksgiving, Deut.8.10.] the offering, [i.e the flesh that is offered, wherewith the feast or banquet is to be made] afterwards they eat that be hidden : therefore now go up, for him, as to day ye shall find him."}],"14":[{"catchword":null,"tekst":"So they went up into the city : when they came into the midst of the City, behold, Samuel went out to meet them, [For he knew full well, that they should come to him at that time, as appeareth from verse 15. and 16] for to go up to the high place."}],"15":[{"catchword":null,"tekst":"For the LORD had revealed it (before) Samuels ear, [i.e. the Lord plainly told Samuel. See the like phrase, Ruth.4.47 and I Sam.250.12,13. and 2 Sam.7.27. Job 33:16. Isai.22.14. and chap 48.8] a day before Saul came, saying, [here the cau // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {

  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;

      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
