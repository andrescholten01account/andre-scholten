eeft hij gezegd: Dat Jonathan dit niet weet, opdat hij zich niet bekommert; en zeker, zo waarachtig als de HEERE leeft, en uw ziel leeft, er is maar als een schrede tussen mij en de dood!","4":"Jonathan nu zei tegen David: Wat uw ziel zegt, dat zal ik voor u doen.","5":"En David zei tegen Jonathan: Zie, morgen is de nieuwe maan, wanneer ik zeker met de koning zou aanzitten om te eten; zo laat mij gaan, dat ik mij op het veld verberg tot aan de derde avond.","6":"Als uw vader mij zeker mist, zo zult u zeggen: David heeft mij met ernst gevraagd of hij naar zijn stad Bethlehem mocht lopen; want daar is een jaarlijks offer voor het hele geslacht.","7":"Als hij zo zegt: Het is goed, dan heeft uw knecht vrede; maar als hij in gloed van toorn ontstoken is, weet dan zeker dat het kwaad bij hem ten volle besloten is.","8":"Doe dan barmhartigheid aan uw knecht, want u hebt uw knecht in een verbond van de HEERE met u gebracht; maar is er een misdaad in mij, dood mij dan zelf; waarom zou u mij toch tot uw vader brengen?","9":"Toen zei Jonathan: Dat zij verre van u! Maar als ik zeker merkte dat dit kwaad bij mijn vader ten volle besloten was, dat het u zou overkomen, zou ik u dat dan niet te kennen geven?","10":"David nu zei tegen Jonathan: Wie zal het mij te kennen geven, als uw vader u iets hards antwoordt?","11":"Toen zei Jonathan tegen David: Kom, laat ons toch uitgaan in het veld; en die twee gingen uit in het veld.","12":"En Jonathan zei tegen David: De HEERE, de God van Israël, is *mijn getuige*: als ik mijn vader onderzocht zal hebben omtrent deze tijd, morgen of overmorgen, en zie, het is goed voor David, en ik dan niet naar u zend en het u bekendmaak;","13":"Zo doet de HEERE aan Jonathan, en zo doet Hij daar nog meer bij! Als het mijn vader behaagt kwaad over u te brengen, zal ik het u bekendmaken, en ik zal u laten gaan, dat u in vrede weggaat; en de HEERE zij met u, zoals Hij met mijn vader geweest is.","14":"En zult u niet, als ik dan nog leef, ja, zult u niet de weldadigheid van de HEERE aan mij doen, dat ik niet sterf?","15":"Ook zult u uw weldadigheid niet afsnijden van mijn huis tot in eeuwigheid; ook niet wanneer de HEERE ieder van de vijanden van David van de aardbodem zal hebben afgesneden.","16":"Zo sloot Jonathan een verbond met het huis van David, en zei: Dat de HEERE het eist van de hand van de vijanden van David!","17":"En Jonathan liet David nogmaals zweren, omdat hij hem liefhad; want hij had hem lief met de liefde van zijn ziel.","18":"Daarna zei Jonathan tegen hem: Morgen is de nieuwe maan; dan zal men u missen, want uw zitplaats zal leeg gevonden worden.","19":"En als u de drie dagen zult zijn weggebleven, kom dan snel af, en ga naar die plaats waar u zich verborgen had ten dage van deze handeling; en blijf bij de steen Ezel.","20":"Zo zal ik drie pijlen terzijde schieten, alsof ik naar een doel schoot.","21":"En zie, ik zal de jongen zenden, en zeggen: Ga heen, zoek de pijlen. Als ik uitdrukkelijk tegen de jongen zeg: Zie, de pijlen liggen dichterbij, neem hem, en kom dan zelf; want er is vrede voor u, en er is niets aan de hand, zo waarlijk als de HEERE leeft!","22":"Maar als ik zo tegen de jongen zeg: Zie, de pijlen liggen verderop; ga dan heen, want de HEERE heeft u laten gaan.","23":"En aangaande de zaak waarover ik en u gesproken hebben, zie, de HEERE zij tussen mij en tussen u, tot in eeuwigheid!","24":"David nu verborg zich in het veld; en toen het nieuwe maan was, zat de koning bij het voedsel, om te eten.","25":"Toen de koning zich op zijn zitplaats had gezet, deze keer net als de andere keren, aan de plaats bij de wand, stond Jonathan op, en Abner zat aan Sauls zijde, en Davids plaats werd leeg gevonden.","26":"En Saul sprak die dag niets, want hij zei: Hem is iets overkomen, dat hij niet rein is; zeker, hij is niet rein.","27":"Het gebeurde nu de volgende dag, de tweede dag van de nieuwe maan, dat Davids plaats leeg gevonden werd, zo zei Saul tegen zijn zoon Jonathan: Waarom is de zoon van Isaï noch gisteren noch vandaag bij het voedsel gekomen?","28":"En Jonathan antwoordde Saul: David vroeg mij met ernst of hij naar Bethlehem mocht gaan.","29":"En hij zei: Laat mij toch gaan; want ons geslacht heeft een offer in de stad, en mijn broer heeft het mij zelf opgedragen; heb ik nu genade in uw ogen gevonden, laat mij toch wegkomen, dat ik mijn broers zie; hierom is hij niet aan de tafel van de koning gekomen.","30":"Toen ontstak de toorn van Saul tegen Jonathan, en hij zei tegen hem: U, zoon van de verkeerde in weerspannigheid, weet ik het niet, dat u de zoon van Isaï verkozen hebt tot uw eigen schande, en tot schande van de naaktheid van uw moeder?","31":"Want alle dagen dat de zoon van Isaï op de aardbodem leeft, zult u noch uw koninkrijk bevestigd worden; nu dan, stuur iemand heen, en haal hem tot mij, want hij is een kind van de dood.","32":"Toen antwoordde Jonathan Saul, zijn vader, en zei tegen hem: Waarom zal hij gedood worden? Wat heeft hij gedaan?","33":"Toen wierp Saul de speer naar hem, om hem te treffen. Zo merkte Jonathan dat het bij zijn vader ten volle besloten was, om David te doden.","34":"Daarom stond Jonathan van de tafel op in gloed van de toorn; en hij at op de tweede dag van de nieuwe maan geen brood, want hij was bekommerd om David, omdat zijn vader hem gesmaad had.","35":"En het gebeurde 's morgens, dat Jonathan het veld inging, op de tijd die met David was afgesproken; en er was een kleine jongen bij hem.","36":"En hij zei tegen zijn jongen: Loop, zoek nu de pijlen die ik schieten zal. De jongen liep heen, en hij schoot een pijl die hij over hem heen liet vliegen.","37":"Toen de jongen bij de plaats van de pijl gekomen was die Jonathan geschoten had, riep Jonathan de jongen na, en zei: Ligt de pijl niet verderop?","38":"Wederom riep Jonathan de jongen na: Haast u, spoed u, sta niet stil! De jongen van Jonathan raapte de pijl op, en hij kwam bij zijn heer.","39":"Doch de jongen wist er niets van; alleen Jonathan en David wisten van de zaak.","40":"Toen gaf Jonathan zijn wapentuig aan de jongen die hij bij zich had; en hij zei tegen hem: Ga heen, breng het naar de stad.","41":"Toen de jongen weg was, stond David op van de zuidzijde, en hij viel op zijn gezicht ter aarde, en boog zich driemaal; en zij kusten elkaar, en weenden met elkaar, totdat David het meest deed.","42":"Toen zei Jonathan tegen David: Ga in vrede; wat wij beiden in de Naam van de HEERE gezworen hebben, toen wij zeiden: De HEERE zij tussen mij en tussen u, en tussen mijn nageslacht en tussen uw nageslacht, zij tot in eeuwigheid! Daarna stond hij op, en ging heen; en Jonathan kwam in de stad."},"SV":{"1":"Toen vluchtte David van Najoth bij Rama, en hij kwam, en zeide voor het aangezicht van Jonathan: Wat heb ik gedaan, wat is mijn misdaad, en wat is mijn zonde voor het aangezicht uws vaders, dat hij mijn ziel zoekt?","2":"Hij daarentegen zeide tot hem: Dat zij verre, gij zult niet sterven. Zie, mijn vader doet geen grote zaak, en geen kleine zaak, die hij voor mijn oor niet openbaart; waarom zou dan mijn vader deze zaak van mij verbergen? Dat is niet.","3":"Toen zwoer David verder, en zeide: Uw vader weet zeer wel, dat ik genade in uw ogen gevonden heb; daarom heeft hij gezegd: Dat Jonathan dit niet wete, opdat hij zich niet bekommere; en zekerlijk, *zo* *waarachtig* *als* de HEERE leeft, en uw ziel leeft, er is maar als een schrede tussen mij en tussen den dood!","4":"Jonathan nu zeide tot David: Wat uw ziel zegt, dat zal ik u doen.","5":"En David zeide tot Jonathan: Zie, morgen is de nieuwe maan, dat ik zekerlijk met den koning zou aanzitten om te eten; zo laat mij gaan, dat ik mij op het veld verberge tot aan den derden avond.","6":"Indien uw vader mij gewisselijk mist, zo zult gij zeggen: David heeft van mij zeer begeerd, dat hij tot zijn stad Bethlehem mocht lopen; want aldaar is een jaarlijks offer voor het ganse geslacht.","7":"Indien hij aldus zegt: Het is goed, zo heeft uw knecht vrede; maar indien hij gans ontstoken is, zo weet, dat het kwaad bij hem ten volle besloten is.","8":"Doe dan barmhartigheid aan uw knecht, want gij hebt uw knecht in een verbond des HEEREN met u gebracht; maar is er een misdaad in mij, zo dood gij mij; waarom zoudt gij mij toch tot uw vader brengen?","9":"Toen zeide Jonathan: Dat zij verre van u! Maar indien ik zekerlijk merkte, dat dit kwaad bij mijn vader ten volle besloten ware, dat het u zou overkomen, zou ik dat u dan niet te kennen geven?","10":"David nu zeide tot Jonathan: Wie zal het mij te kennen geven, indien uw vader u wat hards antwoordt?","11":"Toen zeide Jonathan tot David: Kom, laat ons toch uitgaan in het veld; en die beiden gingen uit in het veld.","12":"En Jonathan zeide tot David: De HEERE, de God Israëls, indien ik mijn vader onderzocht zal hebben omtrent dezen tijd, morgen *of* overmorgen, en zie, het is goed voor David, en ik dan tot u niet zende, en *voor* uw oor openbare;","13":"Alzo doe de HEERE aan Jonathan, en alzo doe Hij daartoe! Als mijn vader het kwaad over u behaagt, zo zal ik het voor uw oor ontdekken, en ik zal u trekken laten, dat gij in vrede heengaat; en de HEERE zij met u, gelijk als Hij met mijn vader geweest is.","14":"En zult gij niet, indien ik dan nog leve, ja, zult gij niet de weldadigheid des HEEREN aan mij doen, dat ik niet sterve?","15":"Ook zult gij uw weldadigheid niet afsnijden van mijn huis tot in eeuwigheid; ook niet wanneer de HEERE een iegelijk der vijanden van David van den aardbodem zal afgesneden hebben.","16":"Alzo maakte Jonathan *een* *verbond* met het huis van David, *zeggende*: Dat het de HEERE eise van de hand der vijanden Davids!","17":"En Jonathan voer voort, met David te doen zweren, omdat hij hem liefhad; want hij had hem lief met de liefde zijner ziel.","18":"Daarna zeide Jonathan tot hem: Morgen is de nieuwe maan; dan zal men u missen, want uw zitplaats zal ledig gevonden worden.","19":"En als gij de drie dagen zult uitgebleven zijn, kom haastig af, en ga tot die plaats, waar gij u verborgen hadt ten dage dezer handeling; en blijf bij den steen Ezel.","20":"Zo zal ik drie pijlen ter zijde schieten, als of ik naar een teken schoot.","21":"En zie, ik zal den jongen zenden, *zeggende*: Ga heen, zoek de pijlen, indien ik uitdrukkelijk tot den jongen zeg: Zie, de pijlen zijn van u af en herwaarts, neem hem; en kom gij, want er is vrede voor u, en er is geen ding, *zo* *waarlijk* de HEERE leeft!","22":"Maar indien ik tot den jongen alzo zeg: Zie, de pijlen zijn van u af en verder; ga heen, want de HEERE heeft u laten gaan.","23":"En aangaande de zaak, waarvan ik en gij gesproken hebben, zie, de HEERE zij tussen mij en tussen u, tot in eeuwigheid!","24":"David nu verborg zich in het veld; en als het nieuwe maan was, zat de koning bij de spijze, om te eten.","25":"Toen zich de koning gezet had op zijn zitplaats, op dit maal gelijk de andere maal, aan de stede bij den wand, zo stond Jonathan op, en Abner zat aan Sauls zijde, en Davids plaats werd ledig gevonden.","26":"En Saul sprak te dien dage niets, want hij zeide: Hem is wat voorgevallen, dat hij niet rein is; voorzeker, hij is niet rein.","27":"Het geschiedde nu des anderen daags, den tweeden der nieuwe maan, als Davids plaats ledig gevonden werd, zo zeide Saul tot zijn zoon Jonathan: Waarom is de zoon van Isaï noch gisteren noch heden tot de spijze gekomen?","28":"En Jonathan antwoordde Saul: David begeerde van mij ernstelijk naar Bethlehem te mogen gaan.","29":"En hij zeide: Laat mij toch gaan; want ons geslacht heeft een offer in de stad, en mijn broeder heeft het mij zelfs geboden; heb ik nu genade in uw ogen gevonden, laat mij toch ontslagen zijn, dat ik mijn broeders zie; hierom is hij aan des konings tafel niet gekomen.","30":"Toen ontstak de toorn van Saul tegen Jonathan, en hij zeide tot hem: Gij, zoon der verkeerde in wederspannigheid, weet ik het niet, dat gij den zoon van Isaï verkoren hebt tot uw schande, en tot schande van de naaktheid uwer moeder?","31":"Want al de dagen, die de zoon van Isaï op den aardbodem leven zal, zo zult gij noch uw koninkrijk bevestigd worden; nu dan, schik heen, en haal hem tot mij, want hij is een kind des doods.","32":"Toen antwoordde Jonathan Saul, zijn vader, en zeide tot hem: Waarom zal hij gedood worden? Wat heeft hij gedaan?","33":"Toen schoot Saul de spies op hem, om hem te slaan. Alzo merkte Jonathan, dat dit ten volle bij zijn vader besloten was, David te doden.","34":"Daarom stond Jonathan van de tafel op in hittigheid des toorns; en hij at op den tweeden dag der nieuwe maan geen brood, want hij was bekommerd om David, omdat zijn vader hem gesmaad had.","35":"En het geschiedde des morgens, dat Jonathan in het veld ging, op den tijd, die David bestemd was; en er was een kleine jongen bij hem.","36":"En hij zeide tot zijn jongen: Loop, zoek nu de pijlen, die ik schieten zal. De jongen liep heen, en hij schoot een pijl, dien hij deed over hem vliegen.","37":"Toen de jongen tot aan de plaats des pijls, dien Jonathan geschoten had, gekomen was, zo riep Jonathan den jongen na, en zeide: Is niet de pijl van u af en verder?","38":"Wederom riep Jonathan den jongen na: Haast u, spoed u, sta niet stil! De jongen van Jonathan nu raapte den pijl op, en hij kwam tot zijn heer.","39":"Doch de jongen wist er niets van; Jonathan en David alleen wisten van de zaak.","40":"Toen gaf Jonathan zijn gereedschap aan den jongen, dien hij had; en hij zeide tot hem: Ga heen, breng het in de stad.","41":"Als de jongen heenging, zo stond David op van de zuidzijde, en hij viel op zijn aangezicht ter aarde, en hij boog zich driemaal; en zij kusten elkander, en weenden met elkander, totdat het David gans veel maakte.","42":"Toen zeide Jonathan tot David: Ga in vrede; hetgeen wij beiden in den Naam des HEEREN gezworen hebben, zeggende: De HEERE zij tussen mij en tussen u, en tussen mijn zaad en tussen uw zaad, zij tot in eeuwigheid! Daarna stond hij op, en ging heen; en Jonathan kwam in de stad."},"KJV":{"1":"And David fled from Naioth in Ramah, and came and said before Jonathan, What have I done? what is mine iniquity? and what is my sin before thy father, that he seeketh my life?","2":"And he said unto him, God forbid; thou shalt not die: behold, my father will do nothing either great or small, but that he will shew it me: and why should my father hide this thing from me? it is not so.","3":"And David sware moreover, and said, Thy father certainly knoweth that I have found grace in thine eyes; and he saith, Let not Jonathan know this, lest he be grieved: but truly as the LORD liveth, and as thy soul liveth, there is but a step between me and death.","4":"Then said Jonathan unto David, Whatsoever thy soul desireth, I will even do it for thee.","5":"And David said unto Jonathan, Behold, to morrow is the new moon, and I should not fail to sit with the king at meat: but let me go, that I may hide myself in the field unto the third day at even.","6":"If thy father at all miss me, then say, David earnestly asked leave of me that he might run to Bethlehem his city: for there is a yearly sacrifice there for all the family.","7":"If he say thus, It is well; thy servant shall have peace: but if he be very wroth, then be sure that evil is determined by him.","8":"Therefore thou shalt deal kindly with thy servant; for thou hast brought thy servant into a covenant of the LORD with thee: notwithstanding, if there be in me iniquity, slay me thyself; for why shouldest thou bring me to thy father?","9":"And Jonathan said, Far be it from thee: for if I knew certainly that evil were determined by my father to come upon thee, then would not I tell it thee?","10":"Then said David to Jonathan, Who shall tell me? or what if thy father answer thee roughly?","11":"And Jonathan said unto David, Come, and let us go out into the field. And they went out both of them into the field.","12":"And Jonathan said unto David, O LORD God of Israel, when I have sounded my father about to morrow any time, or the third day, and, behold, if there be good toward David, and I then send not unto thee, and shew it thee;","13":"The LORD do so and much more to Jonathan: but if it please my father to do thee evil, then I will shew it thee, and send thee away, that thou mayest go in peace: and the LORD be with thee, as he hath been with my father.","14":"And thou shalt not only while yet I live shew me the kindness of the LORD, that I die not:","15":"But also thou shalt not cut off thy kindness from my house for ever: no, not when the LORD hath cut off the enemies of David every one from the face of the earth.","16":"So Jonathan made a covenant with the house of David, saying, Let the LORD even require it at the hand of David's enemies.","17":"And Jonathan caused David to swear again, because he loved him: for he loved him as he loved his own soul.","18":"Then Jonathan said to David, To morrow is the new moon: and thou shalt be missed, because thy seat will be empty.","19":"And when thou hast stayed three days, then thou shalt go down quickly, and come to the place where thou didst hide thyself when the business was in hand, and shalt remain by the stone Ezel.","20":"And I will shoot three arrows on the side thereof, as though I shot at a mark.","21":"And, behold, I will send a lad, saying, Go, find out the arrows. If I expressly say unto the lad, Behold, the arrows are on this side of thee, take them; then come thou: for there is peace to thee, and no hurt; as the LORD liveth.","22":"But if I say thus unto the young man, Behold, the arrows are beyond thee; go thy way: for the LORD hath sent thee away.","23":"And as touching the matter which thou and I have spoken of, behold, the LORD be between thee and me for ever.","24":"So David hid himself in the field: and when the new moon was come, the king sat him down to eat meat.","25":"And the king sat upon his seat, as at other times, even upon a seat by the wall: and Jonathan arose, and Abner sat by Saul's side, and David's place was empty.","26":"Nevertheless Saul spake not any thing that day: for he thought, Something hath befallen him, he is not clean; surely he is not clean.","27":"And it came to pass on the morrow, which was the second day of the month, that David's place was empty: and Saul said unto Jonathan his son, Wherefore cometh not the son of Jesse to meat, neither yesterday, nor to day?","28":"And Jonathan answered Saul, David earnestly asked leave of me to go to Bethlehem:","29":"And he said, Let me go, I pray thee; for our family hath a sacrifice in the city; and my brother, he hath commanded me to be there: and now, if I have found favour in thine eyes, let me get away, I pray thee, and see my brethren. Therefore he cometh not unto the king's table.","30":"Then Saul's anger was kindled against Jonathan, and he said unto him, Thou son of the perverse rebellious woman, do not I know that thou hast chosen the son of Jesse to thine own confusion, and unto the confusion of thy mother's nakedness?","31":"For as long as the son of Jesse liveth upon the ground, thou shalt not be established, nor thy kingdom. Wherefore now send and fetch him unto me, for he shall surely die.","32":"And Jonathan answered Saul his father, and said unto him, Wherefore shall he be slain? what hath he done?","33":"And Saul cast a javelin at him to smite him: whereby Jonathan knew that it was determined of his father to slay David.","34":"So Jonathan arose from the table in fierce anger, and did eat no meat the second day of the month: for he was grieved for David, because his father had done him shame.","35":"And it came to pass in the morning, that Jonathan went out into the field at the time appointed with David, and a little lad with him.","36":"And he said unto his lad, Run, find out now the arrows which I shoot. And as the lad ran, he shot an arrow beyond him.","37":"And when the lad was come to the place of the arrow which Jonathan had shot, Jonathan cried after the lad, and said, Is not the arrow beyond thee?","38":"And Jonathan cried after the lad, Make speed, haste, stay not. And Jonathan's lad gathered up the arrows, and came to his master.","39":"But the lad knew not any thing: only Jonathan and David knew the matter.","40":"And Jonathan gave his artillery unto his lad, and said unto him, Go, carry them to the city.","41":"And as soon as the lad was gone, David arose out of a place toward the south, and fell on his face to the ground, and bowed himself three times: and they kissed one another, and wept one with another, until David exceeded.","42":"And Jonathan said to David, Go in peace, forasmuch as we have sworn both of us in the name of the LORD, saying, The LORD be between me and thee, and between my seed and thy seed for ever. And he arose and departed: and Jonathan went into the city."}},"tsk":{"1":[{"kopje":"vluchtte","refs":["1 Sam 19:19-24","1 Sam 23:26-28","Ps 124:6-8","2 Petr 2:9"]},{"kopje":"Wat heb ik gedaan","refs":["1 Sam 12:3","1 Sam 24:12","1 Sam 24:18","Ps 7:4-6","Ps 18:21-25","2 Kor 1:12","1 Joh 3:21"]}],"2":[{"kopje":"Dat zij verre","refs":["1 Sam 14:45","Gen 44:7","Joz 22:29","Joz 24:16","Luk 20:16"]},{"kopje":"bekendmaakt","refs":["1 Sam 20:12","1 Sam 9:15","Ps 40:7","Jes 50:5","Joh 15:15","Joh 17:8"]}],"3":[{"kopje":"zwoer","refs":["Deut 6:13","Jer 4:2","Hebr 6:16"]},{"kopje":"maar","refs":["1 Sam 25:26","1 Sam 27:1","2 Sam 15:21","2 Kon 2:2","2 Kon 2:4","2 Kon 2:6"]},{"kopje":"en uw ziel leeft","refs":["1 Sam 1:26","1 Sam 17:55","Jer 38:16"]},{"kopje":"er is maar als een schrede","refs":["1 Sam 27:1","Deut 28:66","Ps 116:3","1 Kor 15:30","1 Kor 15:31","2 Kor 1:9","2 Kor 1:10"]}],"5":[{"kopje":"de nieuwe maan","refs":["1 Sam 20:6","Num 10:10","Num 28:11","2 Kon 4:23","Ps 81:4","Kol 2:16"]},{"kopje":"dat ik mij","refs":["1 Sam 20:19","1 Sam 19:2","Ps 55:13","Spr 22:3","Joh 8:59","Hand 17:14"]}],"6":[{"kopje":"Bethlehem","refs":["1 Sam 17:58","Joh 7:42"]},{"kopje":"offer","refs":["1 Sam 9:12","1 Sam 16:2-5"]}],"7":[{"kopje":"Het is goed","refs":["Deut 1:23","2 Sam 17:4"]}, 9\">said</span> unto him, God <span class=\"wl wl-kjv\" data-code=\"H2486\">forbid;</span> thou shalt not <span class=\"wl wl-kjv\" data-code=\"H4191\">die:</span> behold, my <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> will <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">nothing</span> either <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> or <span class=\"wl wl-kjv\" data-code=\"H6996\">small,</span> but that he will <span class=\"wl wl-kjv\" data-code=\"H1540\">shew</span> it me: and why should my <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H5641\">hide</span> this <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> from me? it is not so.","3":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H7650\">sware</span> moreover, and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Thy <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">certainly</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">knoweth</span> that I have <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> <span class=\"wl wl-kjv\" data-code=\"H2580\">grace</span> in thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes;</span> and he <span class=\"wl wl-kjv\" data-code=\"H559\">saith,</span> Let not <span class=\"wl wl-kjv\" data-code=\"H3083\">Jonathan</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> this, lest he be <span class=\"wl wl-kjv\" data-code=\"H6087\">grieved:</span> but <span class=\"wl wl-kjv\" data-code=\"H199\">truly</span> as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> and as thy <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> there is but a <span class=\"wl wl-kjv\" data-code=\"H6587\">step</span> between me and <span class=\"wl wl-kjv\" data-code=\"H4194\">death.</span>","4":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H3083\">Jonathan</span> unto <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> Whatsoever thy <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> <span class=\"wl wl-kjv\" data-code=\"H559\">desireth,</span> I will even <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> it for thee.","5":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3083\">Jonathan,</span> Behold, to <span class=\"wl wl-kjv\" data-code=\"H4279\">morrow</span> is the new <span class=\"wl wl-kjv\" data-code=\"H2320\">moon,</span> and I should not <span class=\"wl wl-kjv\" data-code=\"H3427\">fail</span> to <span class=\"wl wl-kjv\" data-code=\"H3427\">sit</span> with the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> at <span class=\"wl wl-kjv\" data-code=\"H398\">meat:</span> but let me <span class=\"wl wl-kjv\" data-code=\"H7971\">go,</span> that I may <span class=\"wl wl-kjv\" data-code=\"H5641\">hide</span> myself in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> unto the <span class=\"wl wl-kjv\" data-code=\"H7992\">third</span> day at <span class=\"wl wl-kjv\" data-code=\"H6153\">even.</span>","6":"If thy <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> at <span class=\"wl wl-kjv\" data-code=\"H6485\">all</span> <span class=\"wl wl-kjv\" data-code=\"H6485\">miss</span> me, then <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H7592\">earnestly</span> <span class=\"wl wl-kjv\" data-code=\"H7592\">asked</span> leave of me that he might <span class=\"wl wl-kjv\" data-code=\"H7323\">run</span> to <span class=\"wl wl-kjv\" data-code=\"H1035\">Bethlehem</span> his <span class=\"wl wl-kjv\" data-code=\"H5892\">city:</span> for there is a <span class=\"wl wl-kjv\" data-code=\"H3117\">yearly</span> <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifice</span> there for all the <span class=\"wl wl-kjv\" data-code=\"H4940\">family.</span>","7":"If he <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> thus, It is <span class=\"wl wl-kjv\" data-code=\"H2896\">well;</span> thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> shall have <span class=\"wl wl-kjv\" data-code=\"H7965\">peace:</span> but if he be <span class=\"wl wl-kjv\" data-code=\"H2734\">very</span> <span class=\"wl wl-kjv\" data-code=\"H2734\">wroth,</span> then be <span class=\"wl wl-kjv\" data-code=\"H3045\">sure</span> that <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> is <span class=\"wl wl-kjv\" data-code=\"H3615\">determined</span> by him.","8":"Therefore thou shalt <span class=\"wl wl-kjv\" data-code=\"H6213\">deal</span> <span class=\"wl wl-kjv\" data-code=\"H2617\">kindly</span> with thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant;</span> for thou hast <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> into a <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> with thee: notwithstanding, if there <span class=\"wl wl-kjv\" data-code=\"H3426\">be</span> in me <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity,</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">slay</span> me thyself; for why shouldest thou <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> me to thy <span class=\"wl wl-kjv\" data-code=\"H1\">father?</span>","9":"And <span class=\"wl wl-kjv\" data-code=\"H3083\">Jonathan</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Far be it from <span class=\"wl wl-kjv\" data-code=\"H2486\">thee:</span> for if I <span class=\"wl wl-kjv\" data-code=\"H3045\">knew</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">certainly</span> that <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> were <span class=\"wl wl-kjv\" data-code=\"H3615\">determined</span> by my <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> to <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> upon thee, then would not I <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> it thee?","10":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> to <span class=\"wl wl-kjv\" data-code=\"H3083\">Jonathan,</span> Who shall <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> me? or what if thy <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answer</span> thee <span class=\"wl wl-kjv\" data-code=\"H7186\">roughly?</span>","11":"And <span class=\"wl wl-kjv\" data-code=\"H3083\">Jonathan</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Come,</span> and let us go <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> into the <span class=\"wl wl-kjv\" data-code=\"H7704\">field.</span> And they went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">both</span> of them into the <span class=\"wl wl-kjv\" data-code=\"H7704\">field.</span>","12":"And <span class=\"wl wl-kjv\" data-code=\"H3083\">Jonathan</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> when I have <span class=\"wl wl-kjv\" data-code=\"H2713\">sounded</span> my <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> about to <span class=\"wl wl-kjv\" data-code=\"H4279\">morrow</span> any <span class=\"wl wl-kjv\" data-code=\"H6256\">time,</span> or the <span class=\"wl wl-kjv\" data-code=\"H7992\">third</span> day, and, behold, if there be <span class=\"wl wl-kjv\" data-code=\"H2895\">good</span> toward <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> and I then <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> not unto thee, and <span class=\"wl wl-kjv\" data-code=\"H1540\">shew</span> it thee;","13":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> <span class=\"wl wl-kjv\" data-code=\"H3541\">so</span> and much <span class=\"wl wl-kjv\" data-code=\"H3254\">more</span> to <span class=\"wl wl-kjv\" data-code=\"H3083\">Jonathan:</span> but if it <span class=\"wl wl-kjv\" data-code=\"H3190\">please</span> my <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> to do thee <span class=\"wl wl-kjv\" data-code=\"H7451\">evil,</span> then I will <span class=\"wl wl-kjv\" data-code=\"H1540\">shew</span> it thee, and send thee <span class=\"wl wl-kjv\" data-code=\"H7971\">away,</span> that thou mayest <span class=\"wl wl-kjv\" data-code=\"H1980\">go</span> in <span class=\"wl wl-kjv\" data-code=\"H7965\">peace:</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> be with thee, as he hath been with my <span class=\"wl wl-kjv\" data-code=\"H1\">father.</span>","14":"And thou shalt not only while <span class=\"wl wl-kjv\" data-code=\"H518\">yet</span> I <span class=\"wl wl-kjv\" data-code=\"H2416\">live</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">shew</span> me the <span class=\"wl wl-kjv\" data-code=\"H2617\">kindness</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> that I <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> not:","15":"But also thou shalt not cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> thy <span class=\"wl wl-kjv\" data-code=\"H2617\">kindness</span> from my <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> <span class=\"wl wl-kjv\" data-code=\"H5704\">for</span> <span class=\"wl wl-kjv\" data-code=\"H5769\">ever:</span> no, not when the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> the <span class=\"wl wl-kjv\" data-code=\"H341\">enemies</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> from the <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> of the <span class=\"wl wl-kjv\" data-code=\"H127\">earth.</span>","16":"So <span class=\"wl wl-kjv\" data-code=\"H3083\">Jonathan</span> <span class=\"wl wl-kjv\" data-code=\"H3772\">made</span> a covenant with the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> saying, Let the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> even <span class=\"wl wl-kjv\" data-code=\"H1245\">require</span> it at the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David's</span> <span class=\"wl wl-kjv\" data-code=\"H341\">enemies.</span>","17":"And <span class=\"wl wl-kjv\" data-code=\"H3083\">Jonathan</span> caused <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> to <span class=\"wl wl-kjv\" data-code=\"H7650\">swear</span> <span class=\"wl wl-kjv\" data-code=\"H3254\">again,</span> because he <span class=\"wl wl-kjv\" data-code=\"H160\">loved</span> him: for he <span class=\"wl wl-kjv\" data-code=\"H157\">loved</span> him as he <span class=\"wl wl-kjv\" data-code=\"H160\">loved</span> his own <span class=\"wl wl-kjv\" data-code=\"H5315\">soul.</span>","18":"Then <span class=\"wl wl-kjv\" data-code=\"H3083\">Jonathan</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> To <span class=\"wl wl-kjv\" data-code=\"H4279\">morrow</span> is the new <span class=\"wl wl-kjv\" data-code=\"H2320\">moon:</span> and thou shalt be <span class=\"wl wl-kjv\" data-code=\"H6485\">missed,</span> because thy <span class=\"wl wl-kjv\" data-code=\"H4186\">seat</span> will be <span class=\"wl wl-kjv\" data-code=\"H6485\">empty.</span>","19":"And when thou hast stayed three <span class=\"wl wl-kjv\" data-code=\"H8027\">days,</span> then thou shalt go <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> <span class=\"wl wl-kjv\" data-code=\"H3966\">quickly,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> where thou didst <span class=\"wl wl-kjv\" data-code=\"H5641\">hide</span> thyself <span class=\"wl wl-kjv\" data-code=\"H3117\">when</span> the <span class=\"wl wl-kjv\" data-code=\"H4639\">business</span> was in hand, and shalt <span class=\"wl wl-kjv\" data-code=\"H3427\">remain</span> <span class=\"wl wl-kjv\" data-code=\"H681\">by</span> the <span class=\"wl wl-kjv\" data-code=\"H68\">stone</span> <span class=\"wl wl-kjv\" data-code=\"H237\">Ezel.</span>","20":"And I will <span class=\"wl wl-kjv\" data-code=\"H3384\">shoot</span> <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H2671\">arrows</span> on the <span class=\"wl wl-kjv\" data-code=\"H6654\">side</span> thereof, as though I <span class=\"wl wl-kjv\" data-code=\"H7971\">shot</span> at a <span class=\"wl wl-kjv\" data-code=\"H4307\">mark.</span>","21":"And, behold, I will <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> a <span class=\"wl wl-kjv\" data-code=\"H5288\">lad,</span> saying, <span class=\"wl wl-kjv\" data-code=\"H3212\">Go,</span> find <span class=\"wl wl-kjv\" data-code=\"H4672\">out</span> the <span class=\"wl wl-kjv\" data-code=\"H2671\">arrows.</span> If I <span class=\"wl wl-kjv\" data-code=\"H559\">expressly</span> <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5288\">lad,</span> Behold, the <span class=\"wl wl-kjv\" data-code=\"H2671\">arrows</span> are on this side of thee, <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> them; then <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> thou: for there is <span class=\"wl wl-kjv\" data-code=\"H7965\">peace</span> to thee, and no <span class=\"wl wl-kjv\" data-code=\"H1697\">hurt;</span> as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth.</span>","22":"But if I <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> thus unto the young <span class=\"wl wl-kjv\" data-code=\"H5958\">man,</span> Behold, the <span class=\"wl wl-kjv\" data-code=\"H2671\">arrows</span> are <span class=\"wl wl-kjv\" data-code=\"H1973\">beyond</span> thee; go thy <span class=\"wl wl-kjv\" data-code=\"H3212\">way:</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath sent thee <span class=\"wl wl-kjv\" data-code=\"H7971\">away.</span>","23":"And as touching the <span class=\"wl wl-kjv\" data-code=\"H1697\">matter</span> which thou and I have <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> of, behold, the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> be between thee and me <span class=\"wl wl-kjv\" data-code=\"H5704\">for</span> <span class=\"wl wl-kjv\" data-code=\"H5769\">ever.</span>","24":"So <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H5641\">hid</span> himself in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field:</span> and when the new <span class=\"wl wl-kjv\" data-code=\"H2320\">moon</span> was come, the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> sat him <span class=\"wl wl-kjv\" data-code=\"H3427\">down</span> to <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">meat.</span>","25":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> upon his <span class=\"wl wl-kjv\" data-code=\"H4186\">seat,</span> as at other <span class=\"wl wl-kjv\" data-code=\"H6471\">times,</span> even upon a <span class=\"wl wl-kjv\" data-code=\"H4186\">seat</span> by the <span class=\"wl wl-kjv\" data-code=\"H7023\">wall:</span> and <span class=\"wl wl-kjv\" data-code=\"H3083\">Jonathan</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> by <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul's</span> <span class=\"wl wl-kjv\" data-code=\"H6654\">side,</span> and <span class=\"wl wl-kjv\" data-code=\"H1732\">David's</span> <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> was <span class=\"wl wl-kjv\" data-code=\"H6485\">empty.</span>","26":"Nevertheless <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> not any <span class=\"wl wl-kjv\" data-code=\"H3972\">thing</span> that <span class=\"wl wl-kjv\" data-code=\"H3117\">day:</span> for he <span class=\"wl wl-kjv\" data-code=\"H559\">thought,</span> Something hath <span class=\"wl wl-kjv\" data-code=\"H4745\">befallen</span> him, he is <span class=\"wl wl-kjv\" data-code=\"H1115\">not</span> <span class=\"wl wl-kjv\" data-code=\"H2889\">clean;</span> surely he is not <span class=\"wl wl-kjv\" data-code=\"H2889\">clean.</span>","27":"And it came to pass on the <span class=\"wl wl-kjv\" data-code=\"H4283\">morrow,</span> which was the <span class=\"wl wl-kjv\" data-code=\"H8145\">second</span> day of the <span class=\"wl wl-kjv\" data-code=\"H2320\">month,</span> that <span class=\"wl wl-kjv\" data-code=\"H1732\">David's</span> <span cla "H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> be between me and thee, and between my <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> and thy <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> <span class=\"wl wl-kjv\" data-code=\"H5704\">for</span> <span class=\"wl wl-kjv\" data-code=\"H5769\">ever.</span> And he <span class=\"wl wl-kjv\" data-code=\"H6965\">arose</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">departed:</span> and <span class=\"wl wl-kjv\" data-code=\"H3083\">Jonathan</span> <span class=\"wl wl-kjv\" data-code=\"H935\">went</span> into the <span class=\"wl wl-kjv\" data-code=\"H5892\">city.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"vluchtte David van Najoth bij Rama,","tekst":"Te weten, toen Saul alzo in zijn geest verrukt zijnde, profeteerde, en te Najoth een dag en een nacht bleEf."},{"catchword":"hij kwam,","tekst":"Te weten, te Gibea Sauls, waar Jónathan toen was hof houdende, als zijnde stadhouder zijns vaders."},{"catchword":"dat hij mijn ziel zoekt?","tekst":"Dat is, dat hij naar mijn leven staat, gelijk Mat 2:20."}],"2":[{"catchword":"mijn vader doet geen grote zaak,","tekst":"De vrome Jónathan was in zijn mening bedrogen, een al te goed gevoelen van zijn vader hebbende, die hem zijn boos voornemen tegen David niet geopenbaard heeft."},{"catchword":"voor mijn oor niet openbaart;","tekst":"Zie de aantekeningen Rth 4:4."},{"catchword":"van mij verbergen?","tekst":"Of, voor mij."}],"3":[{"catchword":"weet zeer wel,","tekst":"Hebreeuws, wetende weet"},{"catchword":"gezegd","tekst":"Te weten, bij zichzelven, in zijn eigen hart; dat is, hij heeft gedacht."},{"catchword":"opdat hij zich niet bekommere;","tekst":"Of, opdat het hem niet smarte"},{"catchword":"is maar als een schrede","tekst":"Dat is, ik ben in een zeker en merkelijk gevaar des doods."}],"4":[{"catchword":"ziel zegt,","tekst":"Dat is, begeerte. Zie Gen 34:3."}],"5":[{"catchword":"de nieuwe maan,","tekst":"Op welken dag zij plachten met elkander maaltijd te houden, en vrolijk te zijn, nadat men dankoffers geofferd had."},{"catchword":"dat ik zekerlijk","tekst":"Hebreeuws, dat ik zittende zou zitten; te weten, na het gehouden slachtoffer. Zie Num 10:10."},{"catchword":"laat mij gaan,","tekst":"Dat is, geef mij verlof om te mogen uitblijven tot aan den avond van den derden dag der nieuwe maan, dan wil ik mij in het veld vervoegen, maar eerst wil ik heengaan naar Bethlehem, om aldaar het feest der nieuwe maan met mijn maagschap te houden. Zie vs.19, 35."}],"6":[{"catchword":"zeer begeerd,","tekst":"Hebreeuws, begerende begeerd"},{"catchword":"zijn stad Bethlehem mocht lopen;","tekst":"Dit is, naar Bethlehem, waar hij geboren is, gelijk Joh 7:42. Zie Gen 23:10, en Gen 24:10."},{"catchword":"een jaarlijks offer","tekst":"Hebreeuws, een offer der dagen; dat is, van een vol jaar. Zie Lev 25:29, namelijk een dankoffer, waarbij dan een maaltijd gehouden werd. Zie de aantekeningen boven, 1Sa 9:12."}],"7":[{"catchword":"uw knecht vrede;","tekst":"Uw knecht; dat is, ik."},{"catchword":"gans ontstoken is,","tekst":"Hebreeuws, ontstoken zijnde ontstoken is."}],"8":[{"catchword":"Doe dan barmhartigheid aan uw knecht,","tekst":"Dat is, bewijs mij nu deze gunst en weldaad, dat gij mij bijtijds waarschuwt."},{"catchword":"waarom zoudt gij mij","tekst":"Te weten, om van hem gedood te worden. Alsof hij zeide: Gij zelf hebt macht om mij te doden indien ik het verdiend heb, zonder dat gij mij behoeft tot uw vader te brengen om van hem gedood te worden."}],"9":[{"catchword":"Dat zij verre van u","tekst":"Te weten, dat gij zoudt gedood worden."}],"10":[{"catchword":"Wie zal het mij te kennen geven,","tekst":"Anders, wie zal mij [het goede] te kennen geven, of indien, enz."},{"catchword":"wat hards antwoordt?","tekst":"Te weten, dat hij dreigde mij te doden, of iets dergelijks."}],"12":[{"catchword":"De HEERE, de God Israëls,","tekst":"Anders, o Heere, God Israëls, en aldus zou Jónathan God aanroepen tot getuige zijner oprechtheid."},{"catchword":"overmorgen,","tekst":"Dit was des anderen daags na de nieuwe maan, want deze samenspreking van Jónathan met David geschiedde daags vóór de nieuwe maan, vs.5."}],"13":[{"catchword":"Alzo doe de HEERE aan Jónathan,","tekst":"Zie van deze manier van spreken Rth 1:17."},{"catchword":"Als mijn vader","tekst":"Dat is, indien ik zie dat mijn vader heeft voorgenomen u kwaad te doen."},{"catchword":"de HEERE zij met u,","tekst":"Te weten, als gij na mijns vaders dood zult koning zijn geworden. Hieruit is af te nemen dat Jónathan toen wel geweten heeft, dat David koning zou worden, als alrede van Samuël gezalfd zijnde. Jónathan heeft de ordinantie Gods willen gehoorzamen, al was hij Sauls oudste zoon en de naaste tot de kroon."},{"catchword":"gelijk als Hij met mijn vader geweest is","tekst":"Te weten, toen Hij hem gezegend en victorie gegeven heeft."}],"14":[{"catchword":"dan nog leve,","tekst":"Te weten, als gij koning zult zijn."},{"catchword":"de weldadigheid des HEEREN","tekst":"Dat is, een goeddadigheid, die den Heere aangenaam is; of, hij verstaat de vriendschap en trouw, die zij elkander voor den Heere gezworen hadden."},{"catchword":"dat ik niet sterve?","tekst":"Dat is, dat gij mij niet doodt, mij latende ontgelden het geweld en ongelijk, dat mijn vader u is doende."}],"15":[{"catchword":"huis tot in eeuwigheid;","tekst":"Dat is, geslacht, maagschap, bloedvrienden."}],"16":[{"catchword":"maakte Jónathan","tekst":"Dat is, hij vernieuwde en bevestigde het verbond, dat hij tevoren met David gemaakt had, 1Sa 18:3."},{"catchword":"Dat het de HEERE eise van de hand der vijanden Davids","tekst":"Jónathan, om David volkomenlijk te verzekeren, wenst met een eed Gods rechtvaardige wraak over Davids vijanden, waaronder hij ook zou zijn, indien hij het verbond kwam te verbreken. Sommigen nemen het alzo, dat Jónathan hier David bezweert, dat het God van Davids hand zal eisen, indien hij het verbond aan zijn zijde verbrak, noemende de vijanden Davids inplaats van David zelf; vergelijk onder, 1Sa 25:22, met de aantekeningen. Sommigen zetten het aldus over: [Maar de Heere eise het van de hand der vijanden Davids] willende zeggen, dat David wel dit verbond, zoveel in hem was, heeft onderhouden, maar dat God, dies niettegenstaande, zijn rechtvaardig oordeel over Sauls huis heeft uitgevoerd."}],"17":[{"catchword":"Jónathan voer voort,","tekst":"Eerst heeft Jónathan David een eed gedaan, en beloofd hem voor te staan, vs.13. Nu verzoekt Jónathan, dat David hem ook met ede belove, dat hij hem en den zijnen barmhartigheid wil bewijzen, als hij koning zou geworden zijn."},{"catchword":"want hij had hem lief","tekst":"Dat is, hij had hem zo lief als zichzelven."}],"19":[{"catchword":"af,","tekst":"Te weten, naar Bethlehem."},{"catchword":"dezer handeling;","tekst":"Te weten, toen ik ten beste voor u bij mijn vader spreken zou. Zie boven, 1Sa 19:2."},{"catchword":"bij den steen Ezel","tekst":"Anders, bij den steen die den weg aanwijst; dat is, een steen die aan den weg staat, en wijst den reizenden man welken weg hij moet ingaan; of bij den steen van den gang; dat is, daar gij en ik gewoon zijn naar toe te gaan als wij wat heimelijks met elkander te spreken hebben."}],"20":[{"catchword":"naar een teken schoot","tekst":"Anders, naar het doel."}],"21":[{"catchword":"zoek de pijlen,","tekst":"Hebreeuws, vind de pijlen; dat is, zoek de pijlen totdat gij ze gevonden hebt."},{"catchword":"uitdrukkelijk","tekst":"Hebreeuws, zeggende zeg"},{"catchword":"hem;","tekst":"Te weten, den jongen. Anders, neem ze, te weten, de pijlen."},{"catchword":"er is geen ding,","tekst":"Te weten, wat u in den weg is, of waar gij u voor te vrezen hebt."}],"22":[{"catchword":"ga heen,","tekst":"Alsof hij zeide: Uit die woorden, of uit dat teken, zult gij kunnen verstaan en afnemen, dat het Gods wil is, dat gij u voor een tijdlang ter zijde trekt en niet aan het hof komt."}],"23":[{"catchword":"tussen mij en tussen u,","tekst":"Te weten, tot getuige."}],"24":[{"catchword":"verborg zich in het veld;","tekst":"Te weten, ter bestemder tijd, waarvan boven vs.5, 19 gesproken is; gedurende welken tijd geschied is hetgeen in de elf naastvolgende verzen verhaald wordt."},{"catchword":"spijze,","tekst":"Hebreeuws, bij het brood; gelijk vs.27."}],"25":[{"catchword":"op dit maal","tekst":"Hebreeuws, gelijk maal in maal; gelijk Num 24:1, en Jdg 16:20."},{"catchword":"zo stond Jónathan op,","tekst":"Te weten, opdat hij Abner de eer doen zou, dat hij hem liet bovenaan zitten, want Abner was Sauls oom, en daarenboven ook zijn veldoverste."}],"26":[{"catchword":"sprak te dien dage niets,","tekst":"Te weten, aan David; dat is, hij vraagde niet waarom David niet aan de tafel was gekomen."},{"catchword":"hij zeide","tekst":"Te weten, bij zichzelven, dat is, hij dacht."},{"catchword":"Hem is wat voorgevallen,","tekst":"Hebreeuws, het is een toeval"},{"catchword":"niet rein is;","tekst":"Er worden veel dingen in de wet verhaald, die de mensen onrein maakten. Zie Lev 11:24, en Lev 15:16. Den onreinen nu wordt verboden te eten van het vlees, dat den Heere opgeofferd was, Lev 7:19-21. Ja zij moesten zich ook onthouden van het gezelschap van andere mensen, opdat anderen door hen niet ontreinigd werden."},{"catchword":"hij is niet rein","tekst":"Versta hierbij: En daarom is hij niet gekomen."}],"27":[{"catchword":"Waarom","tekst":"Saul kon wel denken dat David grote oorzaak had uit zijn ogen te blijven, dewijl Saul had gezocht hem te doden. Maar hij dacht dat David zulks aan zijn onzinnigheid zou toeschrijven, en dat hij zich voor hem niet vrezen zou, dewijl hij nu weder tot zijn verstand gekomen was."},{"catchword":"is de zoon van Isaï","tekst":"Aldus noemt hij David verachtelijk, niet eens denkende dat hij zelf de zoon van Kis was."},{"catchword":"tot de spijze gekomen?","tekst":"Hebreeuws, tot het brood, of bij de spijs; gelijk boven, vs.24."}],"29":[{"catchword":"geboden;","tekst":"Te weten, in mijns vaders naam, dien ik schuldig ben te gehoorzamen."}],"30":[{"catchword":"der verkeerde in wederspannigheid,","tekst":"Dat is, van een verkeerde wederspannige moeder."},{"catchword":"tot schande van de naaktheid uwer moeder?","tekst":"Alsof Saul zeggen wilde: Alzo doende, zal men u niet houden voor mijn echten zoon, maar voor een bastaard, dien uw moeder buiten het echte bed geworven heeft."}],"31":[{"catchword":"want hij is een kind des doods","tekst":"Wij zouden zeggen: Hij is een dood man, dat is, hij is den dood waardig, hij moet zekerlijk sterven. Alzo staat er Eph 2:3 : kinderen des toorns. Zie 2Sa 12:5."}],"33":[{"catchword":"op hem,","tekst":"Anders, naar hem"},{"catchword":"hem te slaan","tekst":"Even gelijk hij David had menen te doen."}],"35":[{"catchword":"des morgens,","tekst":"Te weten, op den derden dag der nieuwe maan."},{"catchword":"David bestemd was;","tekst":"Zie boven, vs.19."}],"36":[{"catchword":"zoek nu de pijlen,","tekst":"Hebreeuws, vind; zie vs.21."},{"catchword":"hij schoot een pijl,","tekst":"Te weten, Jónathan."}],"40":[{"catchword":"gereedschap aan den jongen,","tekst":"Anders, wapenen, vaten; dat is, gereedschap, als zijn boog, koker en pijlen. Hiermede verzond Jónathan zijn jongen naar de stad, opdat hij, alleen zijnde, des te vrijer met David mocht spreken."}],"41":[{"catchword":"de zuidzijde,","tekst":"Versta hier, de zuidzijde des velds waar zij op waren, of de zuidzijde van den steen, bij welken zich David verborgen had."},{"catchword":"elkander,","tekst":"Hebreeuws, de man zijn naasten"},{"catchword":"totdat het David gans veel maakte","tekst":"Hebreeuws, totdat het David groot maakte; te weten, met wenen."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Then David fled from Najoth by Rama: [viz. When Saul being thus ravished in his spirit, prophesied, and abode a day and a night at Najoth] and he came, [Viz. to Gibea of Saul, where Jonathan then kept Court, being his Fathers Deputy] and said before the face of Jonathan, What have I done? What is mine offence, and what is my sinne before the face of thy father, that he seeketh my soul? [i.e. that he seeketh my life; as Mat 2:20]"}],"2":[{"catchword":null,"tekst":"On the contrary he said unto him: God forbid, thou shalt not die, behold, ny father doth no great thing, nor small thing, which he revealeth not before mine ear. [See the annotate on Ruth chap 4.v.4. Good Jonathan was deceived in his opinion, having too good a conceit of his Father, who discovered not to him his will and intent against David] why then should my father hide this thing from me? [or, before me] that&acirc;&euro;&trade;s not (so)."}],"3":[{"catchword":null,"tekst":"Then sware David further, and said, Thy Father knoweth very well, [Heb. Knowing knoweth] that I have found grace in thine eyes, therefore he said, [viz. with himself in his own heart; i.e. he thought] Let not Jonathan know this, lest he be troubled (at it): [Or, lest it grieve him} and surely (as true as) the LORD liveth, and thy soul liveth, there is but as it were a step between me, and between death. [i.e. I am assuredly in danger of death.]"}],"4":[{"catchword":null,"tekst":"Now Jonathan said unto David: What thy soul [i.e. Desire; see Gen.34.ver.3.] saith, that I will do unto thee."}],"5":[{"catchword":null,"tekst":"And David said unto Jonathan, Behold, tomorrow is the new moon, [On which day they were wont to feast; and to make merry together, after they had offered thank-offerings] that I should surely sit down. [Heb. that I sitting should sit; to wit, after the slay-offering that is kept; see Num 10:10.] to eat with the King: therefore let me go, that I may hide me in the field unto the third evening. [i.e. give me leave to stay until the evening of the third day of the new Moon, then will I be in the field: but I will first go to Bethlehem, to keep there the Feast of the new Moon with my kindred: see v.19.35.]"}],"6":[{"catchword":null,"tekst":"If thy father do certainly misse me; then thou shalt say, David had greatly desired [Heb. Desiring desired] of me, that he might run to his City Bethlehem, [i.e. to Bethlehem where he was born; as Job 7:42. see Genes.23.v.0. and chap.34.ver.10.] for there is a yearly offering [Heb. an offering of days; i.e. of a full and compleat year: see Lev.25.ver.29. namely, thank-offering, wherewith a feast was then kept: see the annotate. Above chap 9.v.2.] for the whole family."}],"7":[{"catchword":null,"tekst":"If he saith thus, It is good, then thy servant [i.e. I] hath peace: but if he be at all kindled, [Heb. being kindled, be kindled] then know that evil is fully determined by him."}],"8":[{"catchword":null,"tekst":"Shew then mercy to thy servant, [i.e. Do me this favour and kindness, that thou advertise, or give me notice betimes] for thou hast brought thy servant into a covenant of the LORD with thy self: but if there be an offence in me, then do thou kill me, why shouldest thou now bring me to thy father? [viz. to be put to death by him: as if he had said Thou thyself hast power to put me to death, if I have deserved it, without bringing me to thy father, to be put to death by him.]"}],"9":[{"catchword":null,"tekst":"Then said Jonathan, Far be it from me, [viz. That thou shouldest be put to death] but if I knew certainly, that this evil were fully determined by my father, that it should come upon thee, would I not then make it known unto thee?"}],"10":[{"catchword":null,"tekst":"Now then David said unto Jonathan, Who shall make it known to me, if thy father answer thee some hard thing? [viz. that he threatened to slay me, or the like. Oth. Who shall make (the good thing) known to me, or, if, &c.]"}],"11":[{"catchword":null,"tekst":"Then said Jonathan unto David, Come, let us go forth into the field: and they went both forth into the field."}],"12":[{"catchword":null,"tekst":"And Jonathan said unto David, The LORD, the God of Israel, [Others, O Lord, God of Israel: and thus did Jonathan call upon God, to be witnesse of his sincerity] if I shall have sounded my father tomorrow about this time, (or) the day after tomorrow, [This was the second day after the new moon; for this communication of Jonathan with David, happened the day before the new moon, ver.5.] and behold, it is good for David, and I then send not unto thee, and reveal it before thine ear."}],"13":[{"catchword":null,"tekst":"Let the LORD do so unto Jonathan, and let him so adde thereunto! [See of this phrase, Ruth 1.17.] When evil towards thee pleaseth my father, [i.e. If I perceive that my father hath an intention to hurt thee] then will I discover it to thine ear, and I will let thee depart, that thou mayest go thy ways in peace: and th e LORD be with thee, [viz. when thou shalt be King after my Fathers decease. Hence may be gathered, that Jonathan well knew that David should be King, as being already anointed by Samuel. Jonathan was ready and willing to yield obedience to the Ordinance of God, although he was Sauls eldest son, and the next heir apparent to the Crown] according as he was with my father. [viz. when he blessed him, and gave him victory.]"}],"14":[{"catchword":null,"tekst":"And wilt thou not, if I then yet live, [viz. When thou art King] yea wilt thou not shew me the kindnesse of the LORD, [i.e. a kindnesse that is acceptable and well-pleasing to the Lord: or, he meaneth the amity and servency which they had sworn one to another before the Lord] that I die not? [i.e. that thou put me not to death, suffering me to smart for the evil and mischief that my father intendeth towards thee]"}],"15":[{"catchword":null,"tekst":"Also thou shalt not cut off thy kindness from mine house [i.e. family, kindered, kinsmen,] for ever: neither, when the LORD shall have cut off from the earth, every one of the enemies of David."}],"16":[{"catchword":null,"tekst":"So Jonathan made (a covenant) with the house of David, [i.e. he renewed and ratified the covenant, formerly entred into with David, I Sam.18.3.] (saying) Let the LORD require it at the hand of Davids enemies of which number he should be accounted one, if he came to break the covenant. Some take it thus, that Jonathan here adjureth David, that God will require it at Davids hand if on his part he should break the covenant, naming Davids enemies, instead of David himself. Compare below chap.25.22. with the annotate. Some translate it thus: (But the Lord required it at the hand of Davids enemies) intimating that David indeed kept this covenant, as much as in him lay, but that God notwithstanding executed his just judgement upon Sauls house.]"}],"17":[{"catchword":null,"tekst":"And Jonathan proceeded, in causing David to swear, [First Jonathan sware unto David, and vowed to protect him, vers.13. Now Jonathan requireth, that David would promise him, and satisfy his promise with an oath, that he will shew mercy and kindness both to him and his, when he should come to the King,] because he loved him: for he loved him with the love of his (own) soul. [i.e. he loved him so, as he did his own soul: i.e. he loved him so entirely as he did himself.]"}],"18":[{"catchword":null,"tekst":"Afterward Jonathan said unto him, To morrow is the new Moon: then they will misse thee, for thy seat will be found empty."}],"19":[{"catchword":null,"tekst":"And when thou shall have tarried out the three days, come down quickly, [viz. from Bethlehem] and go to that place, where thou didst hide thy self in the day of this transaction; [viz. when I should speak to my father in thy befall. See above chap.19.2.] and tarry by the stone Ezel. Oth. by the stone that sheweth the way; i.e. a stone that standeth by the way-side, and sheweth the Traveller which way he must go: or, by the stone of going, i.e. whither thou and I are wont to go, when we have occasion to talk together in private.]"}],"20":[{"catchword":null,"tekst":"Then will I shoot three arrows on the side (thereof,) as if I shot at a mark. [Oth. at the but]"}],"21":[{"catchword":null,"tekst":"And behold, I will send the youth, (saying) Go thy ways, seek the arrows: [Heb. finde the arrows: i.e. seek the arrows till thou hast found them] if I say expressely [Heb. saying say] to the youth, Behold, the arrows are on this side of thee, take him, [viz. the youth. Oth. take them, viz. the arrows] and come thou, for there is peace for thee, and there is nothing, [viz. in thy way, to hinder thee, or, that thou needest to be afraid] (as truly as) the LORD liveth."}],"22":[{"catchword":null,"tekst":"But if I say thus to the youth, Behold, the arrows are beyond thee: go thy ways, for the LORD set thee to go. [As if he should say, by these words, or by this token thou mayest know and gather, that it&acirc;&euro;&trade;s Gods will that thou shouldst for a while keep out of the way, and not come to Court.]"}],"23":[{"catchword":null,"tekst":"And as touching the matter which thou and I have spoken of: behold, the LORD be [Viz: witness] between me, and between thee for ever."}],"24":[{"catchword":null,"tekst":"Now David hid himself in the field [viz. Till the appointed time, whereof mention is made above vers.5. and 10. During which time was affected that, which is related in the eleven following verses] and when it was new moon, the King sat at meat, [Heb. at the bread, as vers.27.] to eat."}],"25":[{"catchword":null,"tekst":"When the King had set him (down) his seat, at this time, as at other times, [Heb. as time in time, as Num 24:1. and Judg.6.20.] on the place by the wall, then Jonathan rose up, [viz. to give place to Abner, to let him sit above him, for Abner was Sauls Uncle, and besides Captain General] and Abner sat by Sauls side: And Davids place was found empty."}],"26":[{"catchword":null,"tekst":"And Saul spake nothing that day, [viz. of David; i.e. he asked not why David was not come to meal] for he said, [viz. with himself; i.e. he thought] Something hath be fallen him, [Heb. it is an accident] that he is not clean, [Many things are recorded in the Law, that made men unclean: See Levit.11.24. and 15.16. Now the unclean persons were forbidden to eat of the flesh which was offered up unto the Lord, Levit.7.19,20,21. Yea they were to obtain from the society of other men, that others by means of them might not be made unclean] surely he is not clean. [Understand withal, and therefore he is not come.]"}],"27":[{"catchword":null,"tekst":"Now it came to pass&Atilde;&copy; the next day, the second (day) of the new moon, when Davids place was found empty, that Saul said unto his son Jonathan, Wherefore is the son of Isai [Thus he calleth David in a scornful and contemptible manner, not once thinking, that he himself was the son of Kiss] not come to meat, [Heb. to the bread, or, at meat, as above vers.24.] neither yesterday, nor to day. [Saul might well think, that David had great cause to tarry out of his sight, seeing Saul had sought to take away his life: But he thought that David would ascribe it to his madness or phrensie, and would not be afraid of him, seeing he was now come to his right senses again]"}],"28":[{"catchword":null,"tekst":"And Jonathan answered Saul: David desired earnestly of me, that he might go to Bethlehem."}],"29":[{"catchword":null,"tekst":"And he said, Let me go, I pray thee, for our family hath an offering in the City, and my brother himself hath commanded me [viz. in my fathers name, whom I am bound to obey] (to do) it; now if I have found favour in thine eyes, let me I pray thee get away, that I may see my brethren, for this cause is he not come to the Kings table."}],"30":[{"catchword":null,"tekst":"Then Sauls anger kindled against Jonathan, and he said unto him, Thou son of the perverse in Rebellion: [i.e. of a preserve Rebellious mother] do not I know, that thou hast chosen the son of Isai to thy shame, and to the shame of thy mothers nakedness? [As if Saul should say, doing thus, thou wilt not be held to be my legitimate son, but a bast (function bouwHfdnav() {

  document.getElementById('hfdnav').innerHTML =

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
