pan> <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep,</span> and a <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H5795\">goats:</span> and he was <span class=\"wl wl-kjv\" data-code=\"H1494\">shearing</span> his <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep</span> in <span class=\"wl wl-kjv\" data-code=\"H3760\">Carmel.</span>", "3": "Now the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> was <span class=\"wl wl-kjv\" data-code=\"H5037\">Nabal;</span> and the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of his <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> <span class=\"wl wl-kjv\" data-code=\"H26\">Abigail:</span> and she was a <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> of <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H7922\">understanding,</span> and of a <span class=\"wl wl-kjv\" data-code=\"H3303\">beautiful</span> <span class=\"wl wl-kjv\" data-code=\"H8389\">countenance:</span> but the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> was <span class=\"wl wl-kjv\" data-code=\"H7186\">churlish</span> and <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> in his <span class=\"wl wl-kjv\" data-code=\"H4611\">doings;</span> and he was of the house of <span class=\"wl wl-kjv\" data-code=\"H3614\">Caleb.</span>", "4": "And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> that <span class=\"wl wl-kjv\" data-code=\"H5037\">Nabal</span> did <span class=\"wl wl-kjv\" data-code=\"H1494\">shear</span> his <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep.</span>", "5": "And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> sent <span class=\"wl wl-kjv\" data-code=\"H7971\">out</span> <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> young <span class=\"wl wl-kjv\" data-code=\"H5288\">men,</span> and <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the young <span class=\"wl wl-kjv\" data-code=\"H5288\">men,</span> Get you <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H3760\">Carmel,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">go</span> to <span class=\"wl wl-kjv\" data-code=\"H5037\">Nabal,</span> and <span class=\"wl wl-kjv\" data-code=\"H7592\">greet</span> him in my <span class=\"wl wl-kjv\" data-code=\"H8034\">name:</span>", "6": "And thus shall ye <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> to him that <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth</span> in prosperity, <span class=\"wl wl-kjv\" data-code=\"H7965\">Peace</span> be both to thee, and <span class=\"wl wl-kjv\" data-code=\"H7965\">peace</span> be to thine <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and <span class=\"wl wl-kjv\" data-code=\"H7965\">peace</span> be unto all that thou hast.", "7": "And now I have <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> that thou hast <span class=\"wl wl-kjv\" data-code=\"H1494\">shearers:</span> now thy <span class=\"wl wl-kjv\" data-code=\"H7462\">shepherds</span> which were with us, we <span class=\"wl wl-kjv\" data-code=\"H3637\">hurt</span> them not, neither was there <span class=\"wl wl-kjv\" data-code=\"H3972\">ought</span> <span class=\"wl wl-kjv\" data-code=\"H6485\">missing</span> unto them, all the <span class=\"wl wl-kjv\" data-code=\"H3117\">while</span> they were in <span class=\"wl wl-kjv\" data-code=\"H3760\">Carmel.</span>", "8": "<span class=\"wl wl-kjv\" data-code=\"H7592\">Ask</span> thy young <span class=\"wl wl-kjv\" data-code=\"H5288\">men,</span> and they will <span class=\"wl wl-kjv\" data-code=\"H5046\">shew</span> thee. Wherefore let the young <span class=\"wl wl-kjv\" data-code=\"H5288\">men</span> <span class=\"wl wl-kjv\" data-code=\"H4672\">find</span> <span class=\"wl wl-kjv\" data-code=\"H2580\">favour</span> in thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes:</span> for we <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> in a <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day:</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">give,</span> I pray thee, whatsoever <span class=\"wl wl-kjv\" data-code=\"H4672\">cometh</span> to thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> unto thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> and to thy <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David.</span>", "9": "And when <span class=\"wl wl-kjv\" data-code=\"H1732\">David's</span> young <span class=\"wl wl-kjv\" data-code=\"H5288\">men</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came,</span> they <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> to <span class=\"wl wl-kjv\" data-code=\"H5037\">Nabal</span> according to all those <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> in the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> and <span class=\"wl wl-kjv\" data-code=\"H5117\">ceased.</span>", "10": "And <span class=\"wl wl-kjv\" data-code=\"H5037\">Nabal</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David's</span> <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Who is <span class=\"wl wl-kjv\" data-code=\"H1732\">David?</span> and who is the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3448\">Jesse?</span> there be <span class=\"wl wl-kjv\" data-code=\"H7231\">many</span> <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> now a <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> that break <span class=\"wl wl-kjv\" data-code=\"H6555\">away</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">from</span> his <span class=\"wl wl-kjv\" data-code=\"H113\">master.</span>", "11": "Shall I then <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> my <span class=\"wl wl-kjv\" data-code=\"H3899\">bread,</span> and my <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and my <span class=\"wl wl-kjv\" data-code=\"H2878\">flesh</span> that I have <span class=\"wl wl-kjv\" data-code=\"H2873\">killed</span> for my <span class=\"wl wl-kjv\" data-code=\"H1494\">shearers,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> it unto <span class=\"wl wl-kjv\" data-code=\"H582\">men,</span> whom I <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> not whence they be?", "12": "So <span class=\"wl wl-kjv\" data-code=\"H1732\">David's</span> young <span class=\"wl wl-kjv\" data-code=\"H5288\">men</span> <span class=\"wl wl-kjv\" data-code=\"H2015\">turned</span> their <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> and went <span class=\"wl wl-kjv\" data-code=\"H7725\">again,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> and <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> him all those <span class=\"wl wl-kjv\" data-code=\"H1697\">sayings.</span>", "13": "And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto his <span class=\"wl wl-kjv\" data-code=\"H582\">men,</span> Gird ye <span class=\"wl wl-kjv\" data-code=\"H2296\">on</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> his <span class=\"wl wl-kjv\" data-code=\"H2719\">sword.</span> And they girded <span class=\"wl wl-kjv\" data-code=\"H2296\">on</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> his <span class=\"wl wl-kjv\" data-code=\"H2719\">sword;</span> and <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> also girded <span class=\"wl wl-kjv\" data-code=\"H2296\">on</span> his <span class=\"wl wl-kjv\" data-code=\"H2719\">sword:</span> and there went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> about <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men;</span> and two <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">abode</span> by the <span class=\"wl wl-kjv\" data-code=\"H3627\">stuff.</span>", "14": "But <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of the young <span class=\"wl wl-kjv\" data-code=\"H5288\">men</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> <span class=\"wl wl-kjv\" data-code=\"H26\">Abigail,</span> <span class=\"wl wl-kjv\" data-code=\"H5037\">Nabal's</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wife,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Behold, <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> out of the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> to <span class=\"wl wl-kjv\" data-code=\"H1288\">salute</span> our <span class=\"wl wl-kjv\" data-code=\"H113\">master;</span> and he <span class=\"wl wl-kjv\" data-code=\"H5860\">railed</span> on them.", "15": "But the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> were <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> unto us, and we were not <span class=\"wl wl-kjv\" data-code=\"H3637\">hurt,</span> neither <span class=\"wl wl-kjv\" data-code=\"H6485\">missed</span> we any <span class=\"wl wl-kjv\" data-code=\"H3972\">thing,</span> as long <span class=\"wl wl-kjv\" data-code=\"H3117\">as</span> we were <span class=\"wl wl-kjv\" data-code=\"H1980\">conversant</span> with them, when we were in the <span class=\"wl wl-kjv\" data-code=\"H7704\">fields:</span>", "16": "They were a <span class=\"wl wl-kjv\" data-code=\"H2346\">wall</span> unto us both by <span class=\"wl wl-kjv\" data-code=\"H3915\">night</span> and <span class=\"wl wl-kjv\" data-code=\"H3119\">day,</span> all the <span class=\"wl wl-kjv\" data-code=\"H3117\">while</span> we were with them <span class=\"wl wl-kjv\" data-code=\"H7462\">keeping</span> the <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep.</span>", "17": "Now therefore <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">consider</span> what thou wilt <span class=\"wl wl-kjv\" data-code=\"H6213\">do;</span> for <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> is <span class=\"wl wl-kjv\" data-code=\"H3615\">determined</span> against our <span class=\"wl wl-kjv\" data-code=\"H113\">master,</span> and against all his <span class=\"wl wl-kjv\" data-code=\"H1004\">household:</span> for he is such a <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H1100\">Belial,</span> that a man cannot <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> to him.", "18": "Then <span class=\"wl wl-kjv\" data-code=\"H26\">Abigail</span> made <span class=\"wl wl-kjv\" data-code=\"H4116\">haste,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> two <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">loaves,</span> and <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H5035\">bottles</span> of <span class=\"wl wl-kjv\" data-code=\"H3196\">wine,</span> and <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep</span> ready <span class=\"wl wl-kjv\" data-code=\"H6213\">dressed,</span> and <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H5429\">measures</span> of <span class=\"wl wl-kjv\" data-code=\"H7039\">parched</span> corn, and an <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> clusters of <span class=\"wl wl-kjv\" data-code=\"H6778\">raisins,</span> and two <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H1690\">cakes</span> of figs, and <span class=\"wl wl-kjv\" data-code=\"H7760\">laid</span> them on <span class=\"wl wl-kjv\" data-code=\"H2543\">asses.</span>", "19": "And she <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her <span class=\"wl wl-kjv\" data-code=\"H5288\">servants,</span> Go <span class=\"wl wl-kjv\" data-code=\"H5674\">on</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> me; behold, I <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> you. But she <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> not her <span class=\"wl wl-kjv\" data-code=\"H376\">husband</span> <span class=\"wl wl-kjv\" data-code=\"H5037\">Nabal.</span>", "20": "And it was so, as she <span class=\"wl wl-kjv\" data-code=\"H7392\">rode</span> on the <span class=\"wl wl-kjv\" data-code=\"H2543\">ass,</span> that she came <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> by the <span class=\"wl wl-kjv\" data-code=\"H5643\">covert</span> of the <span class=\"wl wl-kjv\" data-code=\"H2022\">hill,</span> and, behold, <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> and his <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> came <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> <span class=\"wl wl-kjv\" data-code=\"H7125\">against</span> her; and she <span class=\"wl wl-kjv\" data-code=\"H6298\">met</span> them.", "21": "Now <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> had <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Surely in <span class=\"wl wl-kjv\" data-code=\"H8267\">vain</span> have I <span class=\"wl wl-kjv\" data-code=\"H8104\">kept</span> all that <span class=\"wl wl-kjv\" data-code=\"H2088\">this</span> fellow hath in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness,</span> so that <span class=\"wl wl-kjv\" data-code=\"H3972\">nothing</span> was <span class=\"wl wl-kjv\" data-code=\"H6485\">missed</span> of all that pertained unto him: and he hath <span class=\"wl wl-kjv\" data-code=\"H7725\">requited</span> me <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> for <span class=\"wl wl-kjv\" data-code=\"H2896\">good.</span>", "22": "<span class=\"wl wl-kjv\" data-code=\"H3541\">So</span> and <span class=\"wl wl-kjv\" data-code=\"H3254\">more</span> also <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> unto the <span class=\"wl wl-kjv\" data-code=\"H341\">enemies</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> if I <span class=\"wl wl-kjv\" data-code=\"H7604\">leave</span> of all that pertain to him <span class=\"wl wl-kjv\" data-code=\"H5704\">by</span> the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning</span> <span class=\"wl wl-kjv\" data-code=\"H216\">light</span> any that <span class=\"wl wl-kjv\" data-code=\"H8366\">pisseth</span> against the <span class=\"wl wl-kjv\" data-code=\"H7023\">wall.</span>", "23": "And when <span class=\"wl wl-kjv\" data-code=\"H26\">Abigail</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> she <span class=\"wl wl-kjv\" data-code=\"H4116\">hasted,</span> and lighted <span class=\"wl wl-kjv\" data-code=\"H3381\">off</span> the <span class=\"wl wl-kjv\" data-code=\"H2543\">ass,</span> and <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> <span class=\"wl wl-kjv\" data-code=\"H639\">before</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> on her <span class=\"wl wl-kjv\" data-code=\"H6440\">face,</span> and <span class=\"wl wl-kjv\" data-code=\"H7812\">bowed</span> herself to the <span class=\"wl wl-kjv\" data-code=\"H776\">ground,</span>", "24": "And <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> at his <span class=\"wl wl-kjv\" data-code=\"H7272\">feet,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Upon me, my <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> upon me let this <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity</span> be: and let thine <span class=\"wl wl-kjv\" data-code=\"H519\">handmaid,</span> I pray thee, <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> in thine <span class=\"wl wl-kjv\" data-code=\"H241\">audience,</span> and <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of thine <span class=\"wl wl-kjv\" data-code=\"H589\">handmaid.</span>", "25": "<span class=\"wl wl-kjv\" data-code=\"H7760\">Let</span> not my <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> I pray thee, <span class=\"wl wl-kjv\" data-code=\"H3820\">regard</span> this <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H1100\">Belial,</span> even <span class=\"wl wl-kjv\" data-code=\"H5037\">Nabal:</span> for as his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> is, so is he; <span class=\"wl wl-kjv\" data-code=\"H5037\">Nabal</span> is his <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> and <span class=\"wl wl-kjv\" data-code=\"H5039\">folly</span> is with him: but I thine <span class=\"wl wl-kjv\" data-code=\"H519\">handmaid</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> not the young <span class=\"wl wl-kjv\" data-code=\"H5288\">men</span> of my <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> whom thou didst <span class=\"wl wl-kjv\" data-code=\"H7971\">send.</span>", "26": "Now therefore, my <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> and as thy <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> seeing the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H4513\">withholden</span> thee from <span class=\"wl wl-kjv\" data-code=\"H935\">coming</span> to shed <span class=\"wl wl-kjv\" data-code=\"H1818\">blood,</span> and from <span class=\"wl wl-kjv\" data-code=\"H3467\">avenging</span> thyself with thine own <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> now let thine <span class=\"wl wl-kjv\" data-code=\"H341\">enemies,</span> and they that <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> to my <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> be as <span class=\"wl wl-kjv\" data-code=\"H5037\">Nabal.</span>", "27": "And now this <span class=\"wl wl-kjv\" data-code=\"H1293\">blessing</span> which thine <span class=\"wl wl-kjv\" data-code=\"H8198\">handmaid</span> hath <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> unto my <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> let it even be <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> unto the young <span class=\"wl wl-kjv\" data-code=\"H5288\">men</span> that <span class=\"wl wl-kjv\" data-code=\"H1980\">follow</span> my <span class=\"wl wl-kjv\" data-code=\"H113\">lord.</span>", "28": "I pray thee, <span class=\"wl wl-kjv\" data-code=\"H5375\">forgive</span> the <span class=\"wl wl-kjv\" data-code=\"H6588\">trespass</span> of thine <span class=\"wl wl-kjv\" data-code=\"H519\">handmaid:</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will <span class=\"wl wl-kjv\" data-code=\"H6213\">certainly</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> a <span class=\"wl wl-kjv\" data-code=\"H539\">sure</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house;</span> because my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> <span class=\"wl wl-kjv\" data-code=\"H3898\">fighteth</span> the <span class=\"wl wl-kjv\" data-code=\"H4421\">battles</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> hath not been <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> in thee all thy <span class=\"wl wl-kjv\" data-code=\"H3117\">days.</span>", "29": "Yet a <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> is <span class=\"wl wl-kjv\" data-code=\"H6965\">risen</span> to <span class=\"wl wl-kjv\" data-code=\"H7291\">pursue</span> thee, and to <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> thy <span class=\"wl wl-kjv\" data-code=\"H5315\">soul:</span> but the <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> of my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> shall be <span class=\"wl wl-kjv\" data-code=\"H6887\">bound</span> in the <span class=\"wl wl-kjv\" data-code=\"H6872\">bundle</span> of <span class=\"wl wl-kjv\" data-code=\"H2416\">life</span> with the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God;</span> and the <span class=\"wl wl-kjv\" data-code=\"H5315\">souls</span> of thine <span class=\"wl wl-kjv\" data-code=\"H341\">enemies,</span> them shall he sling <span class=\"wl wl-kjv\" data-code=\"H7049\">out,</span> as out of the <span class=\"wl wl-kjv\" data-code=\"H8432\">middle</span> of a <span class=\"wl wl-kjv\" data-code=\"H7050\">sling.</span>", "30": "And it shall come to pass, when the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall have <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> to my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> according to all the <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> that he hath <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> concerning thee, and shall have <span class=\"wl wl-kjv\" data-code=\"H6680\">appointed</span> thee <span class=\"wl wl-kjv\" data-code=\"H5057\">ruler</span> over <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span>", "31": "That this shall be no <span class=\"wl wl-kjv\" data-code=\"H6330\">grief</span> unto thee, nor <span class=\"wl wl-kjv\" data-code=\"H4383\">offence</span> of <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> unto my <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> either that thou hast <span class=\"wl wl-kjv\" data-code=\"H8210\">shed</span> <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> <span class=\"wl wl-kjv\" data-code=\"H2600\">causeless,</span> or that my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> hath <span class=\"wl wl-kjv\" data-code=\"H3467\">avenged</span> himself: but when the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall have dealt <span class=\"wl wl-kjv\" data-code=\"H3190\">well</span> with my <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> then <span class=\"wl wl-kjv\" data-code=\"H2142\">remember</span> thine <span class=\"wl wl-kjv\" data-code=\"H519\">handmaid.</span>", "32": "And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H26\">Abigail,</span> <span class=\"wl wl-kjv\" data-code=\"H1288\">Blessed</span> be the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> which <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> thee this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> me:", "33": "And <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed</span> be thy <span class=\"wl wl-kjv\" data-code=\"H2940\">advice,</span> and <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed</span> be thou, which hast <span class=\"wl wl-kjv\" data-code=\"H3607\">kept</span> me this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> from <span class=\"wl wl-kjv\" data-code=\"H935\">coming</span> to shed <span class=\"wl wl-kjv\" data-code=\"H1818\">blood,</span> and from <span class=\"wl wl-kjv\" data-code=\"H3467\">avenging</span> myself with mine own <span class=\"wl wl-kjv\" data-code=\"H3027\">hand.</span>", "34": "For in very <span class=\"wl wl-kjv\" data-code=\"H199\">deed,</span> as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> which hath kept me <span class=\"wl wl-kjv\" data-code=\"H4513\">back</span> from <span class=\"wl wl-kjv\" data-code=\"H7489\">hurting</span> thee, <span class=\"wl wl-kjv\" data-code=\"H3884\">except</span> thou hadst <span class=\"wl wl-kjv\" data-code=\"H4116\">hasted</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> me, surely there had not been <span class=\"wl wl-kjv\" data-code=\"H3498\">left</span> unto <span class=\"wl wl-kjv\" data-code=\"H5037\">Nabal</span> by the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning</span> <span class=\"wl wl-kjv\" data-code=\"H216\">light</span> any that <span class=\"wl wl-kjv\" data-code=\"H8366\">pisseth</span> against the <span class=\"wl wl-kjv\" data-code=\"H7023\">wall.</span>", "35": "So <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">received</span> of her <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> that which she had <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> him, and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, Go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> in <span class=\"wl wl-kjv\" data-code=\"H7965\">peace</span> to thine <span class=\"wl wl-kjv\" data-code=\"H1004\">house;</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">see,</span> I have <span class=\"wl wl-kjv\" data-code=\"H8085\">hearkened</span> to thy <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> and have <span class=\"wl wl-kjv\" data-code=\"H5375\">accepted</span> thy <span class=\"wl wl-kjv\" data-code=\"H6440\">person.</span>", "36": "And <span class=\"wl wl-kjv\" data-code=\"H26\">Abigail</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H5037\">Nabal;</span> and, behold, he held a <span class=\"wl wl-kjv\" data-code=\"H4960\">feast</span> in his <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> like the <span class=\"wl wl-kjv\" data-code=\"H4960\">feast</span> of a <span class=\"wl wl-kjv\" data-code=\"H4428\">king;</span> and <span class=\"wl wl-kjv\" data-code=\"H5037\">Nabal's</span> <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> was <span class=\"wl wl-kjv\" data-code=\"H2896\">merry</span> within him, for he was <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H7910\">drunken:</span> wherefore she <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> him <span class=\"wl wl-kjv\" data-code=\"H1697\">nothing,</span> <span class=\"wl wl-kjv\" data-code=\"H6996\">less</span> or <span class=\"wl wl-kjv\" data-code=\"H1419\">more,</span> until the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning</span> <span class=\"wl wl-kjv\" data-code=\"H216\">light.</span>", "37": "But it came to pass in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning,</span> when the <span class=\"wl wl-kjv\" data-code=\"H3196\">wine</span> was gone <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of <span class=\"wl wl-kjv\" data-code=\"H5037\">Nabal,</span> and his <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> had <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> him these <span class=\"wl wl-kjv\" data-code=\"H1697\">things,</span> that his <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">died</span> <span class=\"wl wl-kjv\" data-code=\"H7130\">within</span> him, and he became as a <span class=\"wl wl-kjv\" data-code=\"H68\">stone.</span>", "38": "And it came to pass about <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> after, that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5062\">smote</span> <span class=\"wl wl-kjv\" data-code=\"H5037\">Nabal,</span> that he <span class=\"wl wl-kjv\" data-code=\"H4191\">died.</span>", "39": "And when <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> that <span class=\"wl wl-kjv\" data-code=\"H5037\">Nabal</span> was <span class=\"wl wl-kjv\" data-code=\"H4191\">dead,</span> he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H1288\">Blessed</span> be the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> that hath <span class=\"wl wl-kjv\" data-code=\"H7378\">pleaded</span> the <span class=\"wl wl-kjv\" data-code=\"H7379\">cause</span> of my <span class=\"wl wl-kjv\" data-code=\"H2781\">reproach</span> from the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H5037\">Nabal,</span> and hath <span class=\"wl wl-kjv\" data-code=\"H2820\">kept</span> his <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> from <span class=\"wl wl-kjv\" data-code=\"H7451\">evil:</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> the <span class=\"wl wl-kjv\" data-code=\"H7451\">wickedness</span> of <span class=\"wl wl-kjv\" data-code=\"H5037\">Nabal</span> upon his own <span class=\"wl wl-kjv\" data-code=\"H7218\">head.</span> And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> and <span class=\"wl wl-kjv\" data-code=\"H1696\">communed</span> with <span class=\"wl wl-kjv\" data-code=\"H26\">Abigail,</span> to <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> her to him to <span class=\"wl wl-kjv\" data-code=\"H802\">wife.</span>", "40": "And when the <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> were <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to <span class=\"wl wl-kjv\" data-code=\"H26\">Abigail</span> to <span class=\"wl wl-kjv\" data-code=\"H3760\">Carmel,</span> they <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto her, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> us unto thee, to <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> thee to him to <span class=\"wl wl-kjv\" data-code=\"H802\">wife.</span>", "41": "And she <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and <span class=\"wl wl-kjv\" data-code=\"H7812\">bowed</span> herself on her <span class=\"wl wl-kjv\" data-code=\"H639\">face</span> to the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Behold, let thine <span class=\"wl wl-kjv\" data-code=\"H519\">handmaid</span> be a <span class=\"wl wl-kjv\" data-code=\"H8198\">servant</span> to <span class=\"wl wl-kjv\" data-code=\"H7364\">wash</span> the <span class=\"wl wl-kjv\" data-code=\"H7272\">feet</span> of the <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> of my <span class=\"wl wl-kjv\" data-code=\"H113\">lord.</span>", "42": "And <span class=\"wl wl-kjv\" data-code=\"H26\">Abigail</span> <span class=\"wl wl-kjv\" data-code=\"H4116\">hasted,</span> and <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and <span class=\"wl wl-kjv\" data-code=\"H7392\">rode</span> upon an <span class=\"wl wl-kjv\" data-code=\"H2543\">ass,</span> with <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H5291\">damsels</span> of hers that <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> <span class=\"wl wl-kjv\" data-code=\"H7272\">after</span> her; and she <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> the <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> and became his <span class=\"wl wl-kjv\" data-code=\"H802\">wife.</span>", "43": "<span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> also <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H293\">Ahinoam</span> of <span class=\"wl wl-kjv\" data-code=\"H3157\">Jezreel;</span> and they were also <span class=\"wl wl-kjv\" data-code=\"H8147\">both</span> of them his <span class=\"wl wl-kjv\" data-code=\"H802\">wives.</span>", "44": "But <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> ha /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling', 'Matthew Henry-verklaring']],
  ['Geloofsbelijdenissen', ['1689 Baptist Confession', 'Westminster Confession']],
  ['Boeken', ['Institutie — Calvijn', 'A Body of Divinity — Watson']],
  ['Preken', ['Spurgeon']],
  ['Devotionals', ['Spurgeon']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    let h = '<div class="verg-kop">Grondwoorden</div>';
    if (!heeftB && !heeftK) {
      h += '<em>Nog geen woordkoppeling voor dit vers.</em>';
    } else {
      if (heeftB) h += `<div class="tsk-kop">SVnu</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      h += '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
    }
    h += '<div class="verg-kop" style="margin-top:1.4rem">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vergelijk</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
