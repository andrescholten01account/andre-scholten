:"1 Johannes","href":"../../1-johannes/1/"},{"naam":"2 Johannes","href":"../../2-johannes/1/"},{"naam":"3 Johannes","href":"../../3-johannes/1/"},{"naam":"Judas","href":"../../judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"En Samuël stierf; en heel Israël verzamelde zich, en zij bedreven rouw over hem, en begroeven hem in zijn huis te Rama. En David maakte zich op, en trok af naar de woestijn Paran.","2":"En er was een man te Maon, en zijn bedrijf was te Karmel; en die man was zeer groot, en hij had drieduizend schapen, en duizend geiten; en hij was bezig met het scheren van zijn schapen te Karmel.","3":"En de naam van de man was Nabal, en de naam van zijn vrouw was Abigaïl; en de vrouw was goed van verstand, en mooi van gedaante; maar de man was hard en slecht van daden, en hij was een Kalebiet.","4":"Toen David in de woestijn hoorde dat Nabal zijn schapen schoor,","5":"zond David tien jongemannen; en David zei tegen de jongemannen: Ga op naar Karmel, en als u bij Nabal komt, zult u hem in mijn naam naar zijn welstand vragen;","6":"en u zult zo zeggen tegen die welvarende man: Vrede zij u, en uw huis zij vrede, en alles wat u hebt, zij vrede!","7":"En nu, ik heb gehoord dat u scheerders hebt; nu, de herders die u hebt, zijn bij ons geweest; wij hebben hun geen smaad aangedaan, en zij hebben ook niets gemist, al de dagen dat zij te Karmel geweest zijn.","8":"Vraag het uw jongemannen, en zij zullen het u vertellen. Laat dan deze jongemannen genade vinden in uw ogen, want wij zijn op een goede dag gekomen; geef toch uw knechten, en uw zoon David, wat uw hand vinden zal.","9":"Toen de jongemannen van David gekomen waren, en in Davids naam al die woorden tegen Nabal gesproken hadden, hielden zij stil.","10":"En Nabal antwoordde de knechten van David en zei: Wie is David, en wie is de zoon van Isaï? Er zijn tegenwoordig veel knechten die zich losscheuren, ieder van zijn heer.","11":"Zou ik dan mijn brood, en mijn water, en mijn geslacht *vlees* nemen, dat ik voor mijn scheerders geslacht heb, en zou ik dat geven aan mannen van wie ik niet weet waar zij vandaan komen?","12":"Toen keerden de jongemannen van David zich om naar hun weg; en zij keerden terug, en kwamen, en boodschapten hem van het achtervolgen al deze woorden.","13":"David dan zei tegen zijn mannen: Ieder gordt zijn zwaard aan. Toen gordde ieder zijn zwaard aan, en David gordde ook zijn zwaard aan; en zij trokken op achter David, ongeveer vierhonderd man, en er bleven er tweehonderd bij het gereedschap.","14":"Doch een van de jongemannen boodschapte het aan Abigaïl, de vrouw van Nabal, en zei: Zie, David heeft boden gezonden uit de woestijn om onze heer te zegenen; maar hij is tegen hen uitgevaren.","15":"Nochtans zijn zij ons zeer goede mannen geweest; en wij hebben geen smaad geleden, en wij hebben niets gemist, al de dagen dat wij met hen omgingen, toen wij op het veld waren.","16":"Zij zijn een muur om ons geweest, zowel bij nacht als bij dag, al de dagen dat wij bij hen geweest zijn, terwijl wij de schapen weidden.","17":"Weet dan nu, en zie wat u doen zult; want het kwaad is ten volle over onze heer besloten, en over zijn hele huis; en hij is een zoon van Belial, zodat men hem niet kan aanspreken.","18":"Toen haastte Abigaïl zich, en nam tweehonderd broden, en twee lederzakken wijn, en vijf toebereide schapen, en vijf maten geroosterd koren, en honderd stukken rozijnen, en tweehonderd klompen vijgen, en legde die op ezels.","19":"En zij zei tegen haar jongemannen: Trek voor mij uit; zie, ik kom achter u aan. Doch aan haar man Nabal vertelde zij het niet.","20":"Het gebeurde nu, toen zij op de ezel reed, en afkwam in het verborgene van de berg, en zie, David en zijn mannen kwamen haar tegemoet, en zij ontmoette hen.","21":"David nu had gezegd: Zeker heb ik tevergeefs bewaakt al wat deze man in de woestijn heeft, zodat er niets gemist is van alles wat hij heeft; en hij heeft mij kwaad voor goed vergolden.","22":"Zo doet God aan de vijanden van David, en zo doet Hij daar nog aan toe, als ik van allen die hij heeft iets tot morgen overlaat dat mannelijk is!","23":"Toen Abigaïl nu David zag, haastte zij zich, en kwam van de ezel af, en zij viel voor het aangezicht van David op haar aangezicht, en zij boog zich ter aarde.","24":"En zij viel aan zijn voeten en zei: Och, mijn heer, laat de misdaad op mij zijn, en laat toch uw dienstmaagd voor uw oren spreken, en hoor de woorden van uw dienstmaagd.","25":"Laat mijn heer toch zijn hart niet richten op deze Belials man, op Nabal; want zoals zijn naam is, zo is hij; zijn naam is Nabal, en dwaasheid is bij hem; en ik, uw dienstmaagd, heb de jongemannen van mijn heer niet gezien, die u gezonden hebt.","26":"En nu, mijn heer! Zo waarachtig als de HEERE leeft, en uw ziel leeft, het is de HEERE Die u ervan weerhouden heeft om te komen met bloedvergieten, en dat uw hand u zou verlossen; en nu, laat uw vijanden worden als Nabal, en die kwaad zoeken tegen mijn heer!","27":"En nu, dit is de zegen die uw dienstmaagd mijn heer gebracht heeft, dat die gegeven wordt aan de jongemannen die de voetstappen van mijn heer navolgen.","28":"Vergeef toch uw dienstmaagd de overtreding, want de HEERE zal mijn heer zeker een bestendig huis maken, omdat mijn heer de oorlogen van de HEERE voert, en er geen kwaad bij u gevonden is al uw dagen.","29":"Wanneer een mens opstaat om u te vervolgen en om uw ziel te zoeken, dan zal de ziel van mijn heer ingebonden zijn in het bundeltje van de levenden bij de HEERE, uw God; maar de ziel van uw vijanden zal Hij wegslingeren uit de holte van de slinger.","30":"En het zal gebeuren, wanneer de HEERE mijn heer al het goede zal doen dat Hij over u gesproken heeft, en Hij u zal gebieden een voorganger te zijn over Israël;","31":"dan zal dit u, mijn heer, niet tot wankeling zijn, noch tot aanstoot van het hart, namelijk dat u bloed zonder oorzaak zou vergoten hebben, en dat mijn heer zichzelf zou verlost hebben; en wanneer de HEERE mijn heer goed zal doen, dan zult u aan uw dienstmaagd denken.","32":"Toen zei David tegen Abigaïl: Gezegend zij de HEERE, de God van Israël, Die u vandaag mij tegemoet gezonden heeft!","33":"En gezegend zij uw raad, en gezegend bent u, dat u mij vandaag ervan weerhouden hebt te komen met bloedvergieten, en dat mijn hand mij verlost zou hebben!","34":"Want voorzeker, zo waarachtig als de HEERE, de God van Israël, leeft, Die mij ervan weerhouden heeft u kwaad te doen: als u zich niet had gehaast en mij tegemoet was gekomen, dan zou er van Nabal niemand die mannelijk is, zijn overgebleven tot het morgenlicht!","35":"Toen nam David uit haar hand wat zij hem gebracht had; en hij zei tegen haar: Trek in vrede op naar uw huis; zie, ik heb naar uw stem geluisterd, en heb u aanvaard.","36":"Toen Abigaïl nu bij Nabal kwam, zie, zo had hij een maaltijd in zijn huis, als een koningsmaaltijd; en het hart van Nabal was vrolijk in hem, en hij was zeer dronken; daarom vertelde zij hem niets, klein of groot, tot het morgenlicht.","37":"Het gebeurde nu 's morgens, toen de wijn van Nabal uitgewerkt was, dat zijn vrouw hem die woorden vertelde. Toen bestierf zijn hart in zijn binnenste, en hij werd als een steen.","38":"En het gebeurde ongeveer tien dagen later, dat de HEERE Nabal sloeg, zodat hij stierf.","39":"Toen David hoorde dat Nabal dood was, zei hij: Gezegend zij de HEERE, Die de twist om mijn smaad getwist heeft met de hand van Nabal, en Zijn knecht onthouden heeft van het kwade, en dat de HEERE het kwaad van Nabal op zijn eigen hoofd heeft doen wederkeren! En David zond heen, en liet met Abigaïl spreken, om haar tot vrouw te nemen.","40":"Toen de knechten van David bij Abigaïl gekomen waren te Karmel, spraken zij tegen haar en zeiden: David heeft ons tot u gezonden, om u tot vrouw te nemen.","41":"Toen stond zij op, en boog zich met het aangezicht ter aarde, en zij zei: Zie, uw dienstmaagd zij een dienares, om de voeten van de knechten van mijn heer te wassen.","42":"Abigaïl nu haastte zich, en maakte zich op, en zij reed op een ezel, met haar vijf jonge dienaressen, die haar voetstappen navolgden; zij dan volgde de boden van David na, en zij werd hem tot vrouw.","43":"Ook nam David Ahinoam van Jizreël; zo werden ook die beiden hem tot vrouwen.","44":"Want Saul had zijn dochter Michal, de vrouw van David, gegeven aan Palti, de zoon van Lais, die van Gallim was."},"SV":{"1":"En Samuël stierf; en gans Israël vergaderde zich, en zij bedreven rouw over hem, en begroeven hem in zijn huis te Rama. En David maakte zich op, en toog af naar de woestijn Paran.","2":"En er was een man te Maon, en zijn bedrijf was te Karmel; en die man was zeer groot, en hij had drie duizend schapen, en duizend geiten; en hij was in het scheren zijner schapen te Karmel.","3":"En de naam des mans was Nabal, en de naam zijner huisvrouw was Abigaïl; en de vrouw was goed van verstand, en schoon van gedaante; maar de man was hard en boos van daden, en hij was een Kalebiet.","4":"Als David hoorde in de woestijn, dat Nabal zijn schapen schoor,","5":"Zo zond David tien jongelingen; en David zeide tot de jongelingen: Gaat op naar Karmel, en als gij tot Nabal komt, zo zult gij hem in mijn naam naar den welstand vragen;","6":"En zult alzo zeggen tot dien welvarende: Vrede zij u, en uw huize zij vrede, en alles, wat gij hebt, zij vrede!","7":"En nu, ik heb gehoord, dat gij scheerders hebt; nu, de herders, die gij hebt, zijn bij ons geweest; wij hebben hun geen smaadheid aangedaan, en zij hebben ook niets gemist al de dagen, die zij te Karmel geweest zijn.","8":"Vraag het uw jongelingen, en zij zullen het u te kennen geven. Laat dan deze jongelingen genade vinden in uw ogen, want wij zijn op een goeden dag gekomen; geef toch uw knechten, en uw zoon David, hetgeen uw hand vinden zal.","9":"Toen de jongelingen van David gekomen waren, en in Davids naam naar al die woorden tot Nabal gesproken hadden, zo hielden zij stil.","10":"En Nabal antwoordde den knechten van David, en zeide: Wie is David, en wie is de zoon van Isaï? Er zijn heden vele knechten, die zich afscheuren, elk van zijn heer.","11":"Zou ik dan mijn brood, en mijn water, en mijn geslacht *vlees* nemen, dat ik voor mijn scheerders geslacht heb, en zou ik het den mannen geven, die ik niet weet, van waar zij zijn?","12":"Toen keerden zich de jongelingen van David naar hun weg; en zij keerden weder, en kwamen, en boodschapten hem achtervolgens al deze woorden.","13":"David dan zeide tot zijn mannen: Een iegelijk gorde zijn zwaard aan. Toen gordde een iegelijk zijn zwaard aan, en David gordde ook zijn zwaard aan; en zij togen op achter David, omtrent vierhonderd man, en daar bleven er tweehonderd bij het gereedschap.","14":"Doch een jongeling uit de jongelingen boodschapte het aan Abigaïl, de huisvrouw van Nabal, zeggende: Zie, David heeft boden gezonden uit de woestijn, om onzen heer te zegenen; maar hij is tegen hen uitgevaren.","15":"Nochtans zijn zij ons zeer goede mannen geweest; en wij hebben geen smaadheid geleden, en wij hebben niets gemist al de dagen, *die* wij met hen verkeerd hebben, toen wij op het veld waren.","16":"Zij zijn een muur om ons geweest, zo bij nacht als bij dag, al de dagen, die wij bij hen geweest zijn, weidende de schapen.","17":"Weet dan nu, en zie, wat gij doen zult; want het kwaad is ten volle over onzen heer besloten, en over zijn ganse huis; en hij is een zoon Belials, dat men hem niet mag aanspreken.","18":"Toen haastte zich Abigaïl, en nam tweehonderd broden, en twee lederzakken wijns, en vijf toebereide schapen, en vijf maten geroost koren, en honderd stukken rozijnen, en tweehonderd klompen vijgen, en leide *die* op ezelen.","19":"En zij zeide tot haar jongelingen: Trekt heen voor mijn aangezicht; ziet, ik kom achter ulieden; doch haar man Nabal gaf zij het niet te kennen.","20":"Het geschiedde nu, toen zij op den ezel reed, en dat zij afkwam in het verborgene des bergs, en ziet, David en zijn mannen kwamen af haar tegemoet, en zij ontmoette hen.","21":"David nu had gezegd: Trouwens ik heb te vergeefs bewaard al wat deze in de woestijn heeft, alzo dat er niets van alles, wat hij heeft, gemist is; en hij heeft mij kwaad voor goed vergolden.","22":"Zo doe God aan de vijanden van David, en zo doe Hij daartoe, indien ik van allen, die hij heeft, iets tot morgen overlaat, dat mannelijk is!","23":"Toen nu Abigaïl David zag, zo haastte zij zich, en kwam van den ezel af, en zij viel voor het aangezicht van David op haar aangezicht, en zij boog zich ter aarde.","24":"En zij viel aan zijn voeten en zeide: Och, mijn heer, mijn zij de misdaad, en laat toch uw dienstmaagd voor uw oren spreken, en hoor de woorden uwer dienstmaagd.","25":"Mijn heer stelle toch zijn hart niet aan dezen Belials man, aan Nabal; want gelijk zijn naam is, alzo is hij; zijn naam is Nabal, en dwaasheid is bij hem; en ik, uw dienstmaagd, heb de jongelingen van mijn heer niet gezien, die gij gezonden hebt.","26":"En nu, mijn heer! *zo* *waarachtig* *als* de HEERE leeft, en uw ziel leeft, het is de HEERE, Die u verhinderd heeft van te komen met bloedstorting, dat uw hand u zou verlossen; en nu, dat als Nabal worden uw vijanden, en die tegen mijn heer kwaad zoeken!","27":"En nu, dit is de zegen, dien uw dienstmaagd mijn heer toegebracht heeft, dat hij gegeven worde den jongelingen, die mijns heren voetstappen nawandelen.","28":"Vergeef toch aan uw dienstmaagd de overtreding, want de HEERE zal zekerlijk mijn heer een bestendig huis maken, dewijl mijn heer de oorlogen des HEEREN oorloogt, en geen kwaad bij u gevonden is van uw dagen af.","29":"Wanneer een mens opstaan zal om u te vervolgen, en om uw ziel te zoeken, zo zal de ziel mijns heren ingebonden zijn in het bundeltje der levenden bij den HEERE, uw God; maar de ziel uwer vijanden zal Hij slingeren uit het midden van de holligheid des slingers.","30":"En het zal geschieden, als de HEERE mijn heer naar al het goede doen zal, dat Hij over u gesproken heeft, en Hij u gebieden zal een voorganger te zijn over Israël;","31":"Zo zal dit u, mijn heer, niet zijn tot wankeling, noch aanstoot des harten, te weten, dat gij bloed zonder oorzaak zoudt vergoten hebben, en dat mijn heer zichzelven zou verlost hebben; en als de HEERE mijn heer weldoen zal, zo zult gij uwer dienstmaagd gedenken.","32":"Toen zeide David tot Abigaïl: Gezegend zij de HEERE, de God Israëls, Die u te dezen dage mij tegemoet gezonden heeft!","33":"En gezegend zij uw raad en gezegend zijt gij, dat gij mij te dezen dage geweerd hebt, van te komen met bloedstorting, dat mijn hand mij verlost zou hebben!","34":"Want voorzeker, *het* *is* *zo* *waarachtig* *als* de HEERE, de God Israëls, leeft, Die mij verhinderd heeft, van u kwaad te doen, dat, ten ware dat gij u gehaast hadt, en mij tegemoet gekomen waart, zo ware van Nabal niemand, die mannelijk is, overgebleven tot het morgenlicht!","35":"Toen nam David uit haar hand, wat zij hem gebracht had; en hij zeide tot haar: Trek met vrede op naar uw huis; zie, ik heb naar uw stem gehoord, en heb uw aangezicht aangenomen.","36":"Toen nu Abigaïl tot Nabal kwam, ziet, zo had hij een maaltijd in zijn huis, als eens konings maaltijd; en het hart van Nabal was vrolijk op denzelven, en hij was zeer dronken; daarom gaf zij hem niet een woord, klein noch groot, te kennen, tot aan het morgenlicht.","37":"Het geschiedde nu in den morgen, toen de wijn van Nabal gegaan was, zo gaf hem zijn huisvrouw die woorden te kennen. Toen bestierf zijn hart in het binnenste van hem, en hij werd als een steen.","38":"En het geschiedde omtrent *na* tien dagen, zo sloeg de HEERE Nabal, dat hij stierf.","39":"Toen David hoorde, dat Nabal dood was, zo zeide hij: Gezegend zij de HEERE, Die den twist mijner smaadheid getwist heeft van de hand van Nabal, en heeft zijn knecht onthouden van het kwade, en *dat* de HEERE het kwaad van Nabal op zijn hoofd heeft doen wederkeren! En David zond heen, en liet met Abigaïl spreken, dat hij ze zich ter vrouwe nam.","40":"Als nu de knechten van David tot Abigaïl gekomen waren te Karmel, zo spraken zij tot haar, zeggende: David heeft ons tot u gezonden, dat hij zich u ter vrouwe neme.","41":"Toen stond zij op, en neigde zich met het aangezicht ter aarde, en zij zeide: Ziet, uw dienstmaagd zij tot een dienares, om de voeten der knechten mijns heren te wassen.","42":"Abigaïl nu haastte, en maakte zich op, en zij reed op een ezel, met haar vijf jonge maagden, die haar voetstappen nawandelden; zij dan volgde de boden van David na, en zij werd hem ter huisvrouw.","43":"Ook nam David Ahinoam van Jizreël; alzo waren ook die beiden hem tot vrouwen.","44":"Want Saul had zijn dochter Michal, de huisvrouw van David, gegeven aan Palti, den zoon van Lais, die van Gallim was."},"KJV":{"1":"And Samuel died; and all the Israelites were gathered together, and lamented him, and buried him in his house at Ramah. And David arose, and went down to the wilderness of Paran.","2":"And there was a man in Maon, whose possessions were in Carmel; and the man was very great, and he had three thousand sheep, and a thousand goats: and he was shearing his sheep in Carmel.","3":"Now the name of the man was Nabal; and the name of his wife Abigail: and she was a woman of good understanding, and of a beautiful countenance: but the man was churlish and evil in his doings; and he was of the house of Caleb.","4":"And David heard in the wilderness that Nabal did shear his sheep.","5":"And David sent out ten young men, and David said unto the young men, Get you up to Carmel, and go to Nabal, and greet him in my name:","6":"And thus shall ye say to him that liveth in prosperity, Peace be both to thee, and peace be to thine house, and peace be unto all that thou hast.","7":"And now I have heard that thou hast shearers: now thy shepherds which were with us, we hurt them not, neither was there ought missing unto them, all the while they were in Carmel.","8":"Ask thy young men, and they will shew thee. Wherefore let the young men find favour in thine eyes: for we come in a good day: give, I pray thee, whatsoever cometh to thine hand unto thy servants, and to thy son David.","9":"And when David's young men came, they spake to Nabal according to all those words in the name of David, and ceased.","10":"And Nabal answered David's servants, and said, Who is David? and who is the son of Jesse? there be many servants now a days that break away every man from his master.","11":"Shall I then take my bread, and my water, and my flesh that I have killed for my shearers, and give it unto men, whom I know not whence they be?","12":"So David's young men turned their way, and went again, and came and told him all those sayings.","13":"And David said unto his men, Gird ye on every man his sword. And they girded on every man his sword; and David also girded on his sword: and there went up after David about four hundred men; and two hundred abode by the stuff.","14":"But one of the young men told Abigail, Nabal's wife, saying, Behold, David sent messengers out of the wilderness to salute our master; and he railed on them.","15":"But the men were very good unto us, and we were not hurt, neither missed we any thing, as long as we were conversant with them, when we were in the fields:","16":"They were a wall unto us both by night and day, all the while we were with them keeping the sheep.","17":"Now therefore know and consider what thou wilt do; for evil is determined against our master, and against all his household: for he is such a son of Belial, that a man cannot speak to him.","18":"Then Abigail made haste, and took two hundred loaves, and two bottles of wine, and five sheep ready dressed, and five measures of parched corn, and an hundred clusters of raisins, and two hundred cakes of figs, and laid them on asses.","19":"And she said unto her servants, Go on before me; behold, I come after you. But she told not her husband Nabal.","20":"And it was so, as she rode on the ass, that she came down by the covert of the hill, and, behold, David and his men came down against her; and she met them.","21":"Now David had said, Surely in vain have I kept all that this fellow hath in the wilderness, so that nothing was missed of all that pertained unto him: and he hath requited me evil for good.","22":"So and more also do God unto the enemies of David, if I leave of all that pertain to him by the morning light any that pisseth against the wall.","23":"And when Abigail saw David, she hasted, and lighted off the ass, and fell before David on her face, and bowed herself to the ground,","24":"And fell at his feet, and said, Upon me, my lord, upon me let this iniquity be: and let thine handmaid, I pray thee, speak in thine audience, and hear the words of thine handmaid.","25":"Let not my lord, I pray thee, regard this man of Belial, even Nabal: for as his name is, so is he; Nabal is his name, and folly is with him: but I thine handmaid saw not the young men of my lord, whom thou didst send.","26":"Now therefore, my lord, as the LORD liveth, and as thy soul liveth, seeing the LORD hath withholden thee from coming to shed blood, and from avenging thyself with thine own hand, now let thine enemies, and they that seek evil to my lord, be as Nabal.","27":"And now this blessing which thine handmaid hath brought unto my lord, let it even be given unto the young men that follow my lord.","28":"I pray thee, forgive the trespass of thine handmaid: for the LORD will certainly make my lord a sure house; because my lord fighteth the battles of the LORD, and evil hath not been found in thee all thy days.","29":"Yet a man is risen to pursue thee, and to seek thy soul: but the soul of my lord shall be bound in the bundle of life with the LORD thy God; and the souls of thine enemies, them shall he sling out, as out of the middle of a sling.","30":"And it shall come to pass, when the LORD shall have done to my lord according to all the good that he hath spoken concerning thee, and shall have appointed thee ruler over Israel;","31":"That this shall be no grief unto thee, nor offence of heart unto my lord, either that thou hast shed blood causeless, or that my lord hath avenged himself: but when the LORD shall have dealt well with my lord, then remember thine handmaid.","32":"And David said to Abigail, Blessed be the LORD God of Israel, which sent thee this day to meet me:","33":"And blessed be thy advice, and blessed be thou, which hast kept me this day from coming to shed blood, and from avenging myself with mine own hand.","34":"For in very deed, as the LORD God of Israel liveth, which hath kept me back from hurting thee, except thou hadst hasted and come to meet me, surely there had not been left unto Nabal by the morning light any that pisseth against the wall.","35":"So David received of her hand that which she had brought him, and said unto her, Go up in peace to thine house; see, I have hearkened to thy voice, and have accepted thy person.","36":"And Abigail came to Nabal; and, behold, he held a feast in his house, like the feast of a king; and Nabal's heart was merry within him, for he was very drunken: wherefore she told him nothing, less or more, until the morning light.","37":"But it came to pass in the morning, when the wine was gone out of Nabal, and his wife had told him these things, that his heart died within him, and he became as a stone.","38":"And it came to pass about ten days after, that the LORD smote Nabal, that he died.","39":"And when David heard that Nabal was dead, he said, Blessed be the LORD, that hath pleaded the cause of my reproach from the hand of Nabal, and hath kept his servant from evil: for the LORD hath returned the wickedness of Nabal upon his own head. And David sent and communed with Abigail, to take her to him to wife.","40":"And when the servants of David were come to Abigail to Carmel, they spake unto her, saying, David sent us unto thee, to take thee to him to wife.","41":"And she arose, and bowed herself on her face to the earth, and said, Behold, let thine handmaid be a servant to wash the feet of the servants of my lord.","42":"And Abigail hasted, and arose, and rode upon an ass, with five damsels of hers that went after her; and she went after the messengers of David, and became his wife.","43":"David also took Ahinoam of Jezreel; and they were also both of them his wives.","44":"But Saul had given Michal his daughter, David's wife, to Phalti the son of Laish, which was of Gallim."}},"tsk":{"1":[{"kopje":"Samuël","refs":["1 Sam 28:3"]},{"kopje":"bedreven rouw","refs":["Gen 50:11","Num 20:29","Deut 34:8","Hand 8:2"]},{"kopje":"in zijn huis","refs":["1 Sam 7:17","1 Kon 2:34","2 Kron 33:20","Jes 14:18"]},{"kopje":"de woestijn","refs":["Gen 14:6","Gen 21:21","Num 10:12","Num 12:16","Num 13:3","Num 13:26","Ps 120:5"]}],"2":[{"kopje": <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of his <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> <span class=\"wl wl-kjv\" data-code=\"H26\">Abigail:</span> and she was a <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> of <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H7922\">understanding,</span> and of a <span class=\"wl wl-kjv\" data-code=\"H3303\">beautiful</span> <span class=\"wl wl-kjv\" data-code=\"H8389\">countenance:</span> but the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> was <span class=\"wl wl-kjv\" data-code=\"H7186\">churlish</span> and <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> in his <span class=\"wl wl-kjv\" data-code=\"H4611\">doings;</span> and he was of the house of <span class=\"wl wl-kjv\" data-code=\"H3614\">Caleb.</span>","4":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> that <span class=\"wl wl-kjv\" data-code=\"H5037\">Nabal</span> did <span class=\"wl wl-kjv\" data-code=\"H1494\">shear</span> his <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep.</span>","5":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> sent <span class=\"wl wl-kjv\" data-code=\"H7971\">out</span> <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> young <span class=\"wl wl-kjv\" data-code=\"H5288\">men,</span> and <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the young <span class=\"wl wl-kjv\" data-code=\"H5288\">men,</span> Get you <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H3760\">Carmel,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">go</span> to <span class=\"wl wl-kjv\" data-code=\"H5037\">Nabal,</span> and <span class=\"wl wl-kjv\" data-code=\"H7592\">greet</span> him in my <span class=\"wl wl-kjv\" data-code=\"H8034\">name:</span>","6":"And thus shall ye <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> to him that <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth</span> in prosperity, <span class=\"wl wl-kjv\" data-code=\"H7965\">Peace</span> be both to thee, and <span class=\"wl wl-kjv\" data-code=\"H7965\">peace</span> be to thine <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and <span class=\"wl wl-kjv\" data-code=\"H7965\">peace</span> be unto all that thou hast.","7":"And now I have <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> that thou hast <span class=\"wl wl-kjv\" data-code=\"H1494\">shearers:</span> now thy <span class=\"wl wl-kjv\" data-code=\"H7462\">shepherds</span> which were with us, we <span class=\"wl wl-kjv\" data-code=\"H3637\">hurt</span> them not, neither was there <span class=\"wl wl-kjv\" data-code=\"H3972\">ought</span> <span class=\"wl wl-kjv\" data-code=\"H6485\">missing</span> unto them, all the <span class=\"wl wl-kjv\" data-code=\"H3117\">while</span> they were in <span class=\"wl wl-kjv\" data-code=\"H3760\">Carmel.</span>","8":"<span class=\"wl wl-kjv\" data-code=\"H7592\">Ask</span> thy young <span class=\"wl wl-kjv\" data-code=\"H5288\">men,</span> and they will <span class=\"wl wl-kjv\" data-code=\"H5046\">shew</span> thee. Wherefore let the young <span class=\"wl wl-kjv\" data-code=\"H5288\">men</span> <span class=\"wl wl-kjv\" data-code=\"H4672\">find</span> <span class=\"wl wl-kjv\" data-code=\"H2580\">favour</span> in thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes:</span> for we <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> in a <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day:</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">give,</span> I pray thee, whatsoever <span class=\"wl wl-kjv\" data-code=\"H4672\">cometh</span> to thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> unto thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> and to thy <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David.</span>","9":"And when <span class=\"wl wl-kjv\" data-code=\"H1732\">David's</span> young <span class=\"wl wl-kjv\" data-code=\"H5288\">men</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came,</span> they <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> to <span class=\"wl wl-kjv\" data-code=\"H5037\">Nabal</span> according to all those <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> in the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> and <span class=\"wl wl-kjv\" data-code=\"H5117\">ceased.</span>","10":"And <span class=\"wl wl-kjv\" data-code=\"H5037\">Nabal</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David's</span> <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Who is <span class=\"wl wl-kjv\" data-code=\"H1732\">David?</span> and who is the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3448\">Jesse?</span> there be <span class=\"wl wl-kjv\" data-code=\"H7231\">many</span> <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> now a <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> that break <span class=\"wl wl-kjv\" data-code=\"H6555\">away</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">from</span> his <span class=\"wl wl-kjv\" data-code=\"H113\">master.</span>","11":"Shall I then <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> my <span class=\"wl wl-kjv\" data-code=\"H3899\">bread,</span> and my <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and my <span class=\"wl wl-kjv\" data-code=\"H2878\">flesh</span> that I have <span class=\"wl wl-kjv\" data-code=\"H2873\">killed</span> for my <span class=\"wl wl-kjv\" data-code=\"H1494\">shearers,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> it unto <span class=\"wl wl-kjv\" data-code=\"H582\">men,</span> whom I <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> not whence they be?","12":"So <span class=\"wl wl-kjv\" data-code=\"H1732\">David's</span> young <span class=\"wl wl-kjv\" data-code=\"H5288\">men</span> <span class=\"wl wl-kjv\" data-code=\"H2015\">turned</span> their <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> and went <span class=\"wl wl-kjv\" data-code=\"H7725\">again,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> and <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> him all those <span class=\"wl wl-kjv\" data-code=\"H1697\">sayings.</span>","13":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto his <span class=\"wl wl-kjv\" data-code=\"H582\">men,</span> Gird ye <span class=\"wl wl-kjv\" data-code=\"H2296\">on</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> his <span class=\"wl wl-kjv\" data-code=\"H2719\">sword.</span> And they girded <span class=\"wl wl-kjv\" data-code=\"H2296\">on</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> his <span class=\"wl wl-kjv\" data-code=\"H2719\">sword;</span> and <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> also girded <span class=\"wl wl-kjv\" data-code=\"H2296\">on</span> his <span class=\"wl wl-kjv\" data-code=\"H2719\">sword:</span> and there went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> about <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men;</span> and two <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">abode</span> by the <span class=\"wl wl-kjv\" data-code=\"H3627\">stuff.</span>","14":"But <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of the young <span class=\"wl wl-kjv\" data-code=\"H5288\">men</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> <span class=\"wl wl-kjv\" data-code=\"H26\">Abigail,</span> <span class=\"wl wl-kjv\" data-code=\"H5037\">Nabal's</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wife,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Behold, <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> out of the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> to <span class=\"wl wl-kjv\" data-code=\"H1288\">salute</span> our <span class=\"wl wl-kjv\" data-code=\"H113\">master;</span> and he <span class=\"wl wl-kjv\" data-code=\"H5860\">railed</span> on them.","15":"But the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> were <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> unto us, and we were not <span class=\"wl wl-kjv\" data-code=\"H3637\">hurt,</span> neither <span class=\"wl wl-kjv\" data-code=\"H6485\">missed</span> we any <span class=\"wl wl-kjv\" data-code=\"H3972\">thing,</span> as long <span class=\"wl wl-kjv\" data-code=\"H3117\">as</span> we were <span class=\"wl wl-kjv\" data-code=\"H1980\">conversant</span> with them, when we were in the <span class=\"wl wl-kjv\" data-code=\"H7704\">fields:</span>","16":"They were a <span class=\"wl wl-kjv\" data-code=\"H2346\">wall</span> unto us both by <span class=\"wl wl-kjv\" data-code=\"H3915\">night</span> and <span class=\"wl wl-kjv\" data-code=\"H3119\">day,</span> all the <span class=\"wl wl-kjv\" data-code=\"H3117\">while</span> we were with them <span class=\"wl wl-kjv\" data-code=\"H7462\">keeping</span> the <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep.</span>","17":"Now therefore <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">consider</span> what thou wilt <span class=\"wl wl-kjv\" data-code=\"H6213\">do;</span> for <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> is <span class=\"wl wl-kjv\" data-code=\"H3615\">determined</span> against our <span class=\"wl wl-kjv\" data-code=\"H113\">master,</span> and against all his <span class=\"wl wl-kjv\" data-code=\"H1004\">household:</span> for he is such a <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H1100\">Belial,</span> that a man cannot <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> to him.","18":"Then <span class=\"wl wl-kjv\" data-code=\"H26\">Abigail</span> made <span class=\"wl wl-kjv\" data-code=\"H4116\">haste,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> two <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">loaves,</span> and <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H5035\">bottles</span> of <span class=\"wl wl-kjv\" data-code=\"H3196\">wine,</span> and <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep</span> ready <span class=\"wl wl-kjv\" data-code=\"H6213\">dressed,</span> and <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H5429\">measures</span> of <span class=\"wl wl-kjv\" data-code=\"H7039\">parched</span> corn, and an <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> clusters of <span class=\"wl wl-kjv\" data-code=\"H6778\">raisins,</span> and two <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H1690\">cakes</span> of figs, and <span class=\"wl wl-kjv\" data-code=\"H7760\">laid</span> them on <span class=\"wl wl-kjv\" data-code=\"H2543\">asses.</span>","19":"And she <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her <span class=\"wl wl-kjv\" data-code=\"H5288\">servants,</span> Go <span class=\"wl wl-kjv\" data-code=\"H5674\">on</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> me; behold, I <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> you. But she <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> not her <span class=\"wl wl-kjv\" data-code=\"H376\">husband</span> <span class=\"wl wl-kjv\" data-code=\"H5037\">Nabal.</span>","20":"And it was so, as she <span class=\"wl wl-kjv\" data-code=\"H7392\">rode</span> on the <span class=\"wl wl-kjv\" data-code=\"H2543\">ass,</span> that she came <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> by the <span class=\"wl wl-kjv\" data-code=\"H5643\">covert</span> of the <span class=\"wl wl-kjv\" data-code=\"H2022\">hill,</span> and, behold, <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> and his <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> came <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> <span class=\"wl wl-kjv\" data-code=\"H7125\">against</span> her; and she <span class=\"wl wl-kjv\" data-code=\"H6298\">met</span> them.","21":"Now <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> had <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Surely in <span class=\"wl wl-kjv\" data-code=\"H8267\">vain</span> have I <span class=\"wl wl-kjv\" data-code=\"H8104\">kept</span> all that <span class=\"wl wl-kjv\" data-code=\"H2088\">this</span> fellow hath in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness,</span> so that <span class=\"wl wl-kjv\" data-code=\"H3972\">nothing</span> was <span class=\"wl wl-kjv\" data-code=\"H6485\">missed</span> of all that pertained unto him: and he hath <span class=\"wl wl-kjv\" data-code=\"H7725\">requited</span> me <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> for <span class=\"wl wl-kjv\" data-code=\"H2896\">good.</span>","22":"<span class=\"wl wl-kjv\" data-code=\"H3541\">So</span> and <span class=\"wl wl-kjv\" data-code=\"H3254\">more</span> also <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> unto the <span class=\"wl wl-kjv\" data-code=\"H341\">enemies</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> if I <span class=\"wl wl-kjv\" data-code=\"H7604\">leave</span> of all that pertain to him <span class=\"wl wl-kjv\" data-code=\"H5704\">by</span> the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning</span> <span class=\"wl wl-kjv\" data-code=\"H216\">light</span> any that <span class=\"wl wl-kjv\" data-code=\"H8366\">pisseth</span> against the <span class=\"wl wl-kjv\" data-code=\"H7023\">wall.</span>","23":"And when <span class=\"wl wl-kjv\" data-code=\"H26\">Abigail</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> she <span class=\"wl wl-kjv\" data-code=\"H4116\">hasted,</span> and lighted <span class=\"wl wl-kjv\" data-code=\"H3381\">off</span> the <span class=\"wl wl-kjv\" data-code=\"H2543\">ass,</span> and <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> <span class=\"wl wl-kjv\" data-code=\"H639\">before</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> on her <span class=\"wl wl-kjv\" data-code=\"H6440\">face,</span> and <span class=\"wl wl-kjv\" data-code=\"H7812\">bowed</span> herself to the <span class=\"wl wl-kjv\" data-code=\"H776\">ground,</span>","24":"And <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> at his <span class=\"wl wl-kjv\" data-code=\"H7272\">feet,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Upon me, my <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> upon me let this <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity</span> be: and let thine <span class=\"wl wl-kjv\" data-code=\"H519\">handmaid,</span> I pray thee, <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> in thine <span class=\"wl wl-kjv\" data-code=\"H241\">audience,</span> and <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of thine <span class=\"wl wl-kjv\" data-code=\"H589\">handmaid.</span>","25":"<span class=\"wl wl-kjv\" data-code=\"H7760\">Let</span> not my <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> I pray thee, <span class=\"wl wl-kjv\" data-code=\"H3820\">regard</span> this <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H1100\">Belial,</span> even <span class=\"wl wl-kjv\" data-code=\"H5037\">Nabal:</span> for as his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> is, so is he; <span class=\"wl wl-kjv\" data-code=\"H5037\">Nabal</span> is his <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> and <span class=\"wl wl-kjv\" data-code=\"H5039\">folly</span> is with him: but I thine <span class=\"wl wl-kjv\" data-code=\"H519\">handmaid</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> not the young <span class=\"wl wl-kjv\" data-code=\"H5288\">men</span> of my <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> whom thou didst <span class=\"wl wl-kjv\" data-code=\"H7971\">send.</span>","26":"Now therefore, my <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> and as thy <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> seeing the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H4513\">withholden</span> thee from <span class=\"wl wl-kjv\" data-code=\"H935\">coming</span> to shed <span class=\"wl wl-kjv\" data-code=\"H1818\">blood,</span> and from <span class=\"wl wl-kjv\" data-code=\"H3467\">avenging</span> thyself with thine own <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> now let thine <span class=\"wl wl-kjv\" data-code=\"H341\">enemies,</span> and they that <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> to my <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> be as <span class=\"wl wl-kjv\" data-code=\"H5037\">Nabal.</span>","27":"And now this <span class=\"wl wl-kjv\" data-code=\"H1293\">blessing</span> which thine <span class=\"wl wl-kjv\" data-code=\"H8198\">handmaid</span> hath <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> unto my <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> let it even be <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> unto the young <span class=\"wl wl-kjv\" data-code=\"H5288\">men</span> that <span class=\"wl wl-kjv\" data-code=\"H1980\">follow</span> my <span class=\"wl wl-kjv\" data-code=\"H113\">lord.</span>","28":"I pray thee, <span class=\"wl wl-kjv\" data-code=\"H5375\">forgive</span> the <span class=\"wl wl-kjv\" data-code=\"H6588\">trespass</span> of thine <span class=\"wl wl-kjv\" data-code=\"H519\">handmaid:</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will <span class=\"wl wl-kjv\" data-code=\"H6213\">certainly</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> a <span class=\"wl wl-kjv\" data-code=\"H539\">sure</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house;</span> because my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> <span class=\"wl wl-kjv\" data-code=\"H3898\">fighteth</span> the <span class=\"wl wl-kjv\" data-code=\"H4421\">battles</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> hath not been <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> in thee all thy <span class=\"wl wl-kjv\" data-code=\"H3117\">days.</span>","29":"Yet a <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> is <span class=\"wl wl-kjv\" data-code=\"H6965\">risen</span> to <span class=\"wl wl-kjv\" data-code=\"H7291\">pursue</span> thee, and to <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> thy <span class=\"wl wl-kjv\" data-code=\"H5315\">soul:</span> but the <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> of my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> shall be <span class=\"wl wl-kjv\" data-code=\"H6887\">bound</span> in the <span class=\"wl wl-kjv\" data-code=\"H6872\">bundle</span> of <span class=\"wl wl-kjv\" data-code=\"H2416\">life</span> with the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God;</span> and the <span class=\"wl wl-kjv\" data-code=\"H5315\">souls</span> of thine <span class=\"wl wl-kjv\" data-code=\"H341\">enemies,</span> them shall he sling <span class=\"wl wl-kjv\" data-code=\"H7049\">out,</span> as out of the <span class=\"wl wl-kjv\" data-code=\"H8432\">middle</span> of a <span class=\"wl wl-kjv\" data-code=\"H7050\">sling.</span>","30":"And it shall come to pass, when the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall have <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> to my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> according to all the <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> that he hath <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> concerning thee, and shall have <span class=\"wl wl-kjv\" data-code=\"H6680\">appointed</span> thee <span class=\"wl wl-kjv\" data-code=\"H5057\">ruler</span> over <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span>","31":"That this shall be no <span class=\"wl wl-kjv\" data-code=\"H6330\">grief</span> unto thee, nor <span class=\"wl wl-kjv\" data-code=\"H4383\">offence</span> of <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> unto my <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> either that thou hast <span class=\"wl wl-kjv\" data-code=\"H8210\">shed</span> <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> <span class=\"wl wl-kjv\" data-code=\"H2600\">causeless,</span> or that my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> hath <span class=\"wl wl-kjv\" data-code=\"H3467\">avenged</span> himself: but when the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall have dealt <span class=\"wl wl-kjv\" data-code=\"H3190\">well</span> with my <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> then <span class=\"wl wl-kjv\" data-code=\"H2142\">remember</span> thine <span class=\"wl wl-kjv\" data-code=\"H519\">handmaid.</span>","32":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H26\">Abigail,</span> <span class=\"wl wl-kjv\" data-code=\"H1288\">Blessed</span> be the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> which <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> thee this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> me:","33":"And <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed</span> be thy <span class=\"wl wl-kjv\" data-code=\"H2940\">advice,</span> and <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed</span> be thou, which hast <span class=\"wl wl-kjv\" data-code=\"H3607\">kept</span> me this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> from <span class=\"wl wl-kjv\" data-code=\"H935\">coming</span> to shed <span class=\"wl wl-kjv\" data-code=\"H1818\">blood,</span> and from <span class=\"wl wl-kjv\" data-code=\"H3467\">avenging</span> myself with mine own <span class=\"wl wl-kjv\" data-code=\"H3027\">hand.</span>","34":"For in very <span class=\"wl wl-kjv\" data-code=\"H199\">deed,</span> as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> which hath kept me <span class=\"wl wl-kjv\" data-code=\"H4513\">back</span> from <span class=\"wl wl-kjv\" data-code=\"H7489\">hurting</span> thee, <span class=\"wl wl-kjv\" data-code=\"H3884\">except</span> thou hadst <span class=\"wl wl-kjv\" data-code=\"H4116\">hasted</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> me, surely there had not been <span class=\"wl wl-kjv\" data-code=\"H3498\">left</span> unto <span class=\"wl wl-kjv\" data-code=\"H5037\">Nabal</span> by the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning</span> <span class=\"wl wl-kjv\" data-code=\"H216\">light</span> any that <span class=\"wl wl-kjv\" data-code=\"H8366\">pisseth</span> against the <span class=\"wl wl-kjv\" data-code=\"H7023\">wall.</span>","35":"So <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">received</span> of her <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> that which she had <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> him, and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, Go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> in <span class=\"wl wl-kjv\" data-code=\"H7965\">peace</span> to thine <span class=\"wl wl-kjv\" data-code=\"H1004\">house;</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">see,</span> I have <span class=\"wl wl-kjv\" data-code=\"H8085\">hearkened</span> to thy <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> and have <span class=\"wl wl-kjv\" data-code=\"H5375\">accepted</span> thy <span class=\"wl wl-kjv\" data-code=\"H6440\">person.</span>","36":"And <span class=\"wl wl-kjv\" data-code=\"H26\">Abigail</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H5037\">Nabal;</span> and, behold, he held a <span class=\"wl wl-kjv\" data-code=\"H4960\">feast</span> in his <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> like the <span class=\"wl wl-kjv\" data-code=\"H4960\">feast</span> of a <span class=\"wl wl-kjv\" data-code=\"H4428\">king;</span> and <span class=\"wl wl-kjv\" data-code=\"H5037\">Nabal's</span> <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> was <span class=\"wl wl-kjv\" data-code=\"H2896\">merry</span> within him, for he was <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H7910\">drunken:</span> wherefore she <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> him <span class=\"wl wl-kjv\" data-code=\"H1697\">nothing,</span> <span class=\"wl wl-kjv\" data-code=\"H6996\">less</span> or <span class=\"wl wl-kjv\" data-code=\"H1419\">more,</span> until the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning</span> <span class=\"wl wl-kjv\" data-code=\"H216\">light.</span>","37":"But it came to pass in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning,</span> when the <span class=\"wl wl-kjv\" data-code=\"H3196\">wine</span> was gone <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of <span class=\"wl wl-kjv\" data-code=\"H5037\">Nabal,</span> and his <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> had <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> him these <span class=\"wl wl-kjv\" data-code=\"H1697\">things,</span> that his <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">died</span> <span class=\"wl wl-kjv\" data-code=\"H7130\">within</span> him, and he became as a <span class=\"wl wl-kjv\" data-code=\"H68\">stone.</span>","38":"And it came to pass about <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> after, that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5062\">smote</span> <span class=\"wl wl-kjv\" data-code=\"H5037\">Nabal,</span> that he <span class=\"wl wl-kjv\" data-code=\"H4191\">died.</span>","39":"And when <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> that <span class=\"wl wl-kjv\" data-code=\"H5037\">Nabal</span> was <span class=\"wl wl-kjv\" data-code=\"H4191\">dead,</span> he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H1288\">Blessed</span> be the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> that hath <span class=\"wl wl-kjv\" data-code=\"H7378\">pleaded</span> the <span class=\"wl wl-kjv\" data-code=\"H7379\">cause</span> of my <span class=\"wl wl-kjv\" data-code=\"H2781\">reproach</span> from the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H5037\">Nabal,</span> and hath <span class=\"wl wl-kjv\" data-code=\"H2820\">kept</span> his <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> from <span class=\"wl wl-kjv\" data-code=\"H7451\">evil:</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> the <span class=\"wl wl-kjv\" data-code=\"H7451\">wickedness</span> of <span class=\"wl wl-kjv\" data-code=\"H5037\">Nabal</span> upon his own <span class=\"wl wl-kjv\" data-code=\"H7218\">head.</span> And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> and <span class=\"wl wl-kjv\" data-code=\"H1696\">communed</span> with <span class=\"wl wl-kjv\" data-code=\"H26\">Abigail,</span> to <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> her to him to <span class=\"wl wl-kjv\" data-code=\"H802\">wife.</span>","40":"And when the <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> were <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to <span class=\"wl wl-kjv\" data-code=\"H26\">Abigail</span> to <span class=\"wl wl-kjv\" data-code=\"H3760\">Carmel,</span> they <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto her, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> us unto thee, to <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> thee to him to <span class=\"wl wl-kjv\" data-code=\"H802\">wife.</span>","41":"And she <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and <span class=\"wl wl-kjv\" data-code=\"H7812\">bowed</span> herself on her <span class=\"wl wl-kjv\" data-code=\"H639\">face</span> to the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Behold, let thine <span class=\"wl wl-kjv\" data-code=\"H519\">handmaid</span> be a <span class=\"wl wl-kjv\" data-code=\"H8198\">servant</span> to <span class=\"wl wl-kjv\" data-code=\"H7364\">wash</span> the <span class=\"wl wl-kjv\" data-code=\"H7272\">feet</span> of the <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> of my <span class=\"wl wl-kjv\" data-code=\"H113\">lord.</span>","42":"And <span class=\"wl wl-kjv\" data-code=\"H26\">Abigail</span> <span class=\"wl wl-kjv\" data-code=\"H4116\">hasted,</span> and <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and <span class=\"wl wl-kjv\" data-code=\"H7392\">rode</span> upon an <span class=\"wl wl-kjv\" data-code=\"H2543\">ass,</span> with <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H5291\">damsels</span> of hers that <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> <span class=\"wl wl-kjv\" data-code=\"H7272\">after</span> her; and she <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> the <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> and became his <span class=\"wl wl-kjv\" data-code=\"H802\">wife.</span>","43":"<span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> also <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H293\">Ahinoam</span> of <span class=\"wl wl-kjv\" data-code=\"H3157\">Jezreel;</span> and they were also <span class=\"wl wl-kjv\" data-code=\"H8147\">both</span> of them his <span class=\"wl wl-kjv\" data-code=\"H802\">wives.</span>","44":"But <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> had <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> <span class=\"wl wl-kjv\" data-code=\"H4324\">Michal</span> his <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter,</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David's</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wife,</span> to <span class=\"wl wl-kjv\" data-code=\"H6406\">Phalti</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3919\">Laish,</span> which was of <span class=\"wl wl-kjv\" data-code=\"H1554\">Gallim.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"David maakte zich op,","tekst":"Zolang Samuël leefde heeft David troost en raad bij hem gezocht, daarom bleef hij zo nabij hem als hij kon of mocht. Maar als nu Samuël gestorven was, zo vertrok David naar de woestijn Paran, welke gelegen is aan de zuidzijde van het land Kanaän. Zie van Paran de aantekeningen Gen 14:6."}],"2":[{"catchword":"Maon,","tekst":"Van deze plaats, gelegen in den stam van Juda, zie de aantekeningen Jos 15:55."},{"catchword":"Karmel;","tekst":"Deze berg met de stad en omstreken is te onderscheiden van den anderen, gelegen in den stam van Issaschar, beroemd vanwege den profeet Elia. Zie 1Ki 18:19, en boven, 1Sa 15:12."},{"catchword":"groot,","tekst":"Dat is, rijk, groot van vermogen, gelijk 2Sa 19:32."}],"3":[{"catchword":"Kalebiet","tekst":"Dat is, [gelijk men meent] van de nakomelingen van Kaleb. Vergelijk onder, 1Sa 30:14 met de aantekeningen."}],"5":[{"catchword":"naar den welstand vragen;","tekst":"Hebreeuws, naar den vrede vragen; dat is, vragen of het hem welgaat."}],"6":[{"catchword":"welvarende","tekst":"Hebreeuws, levenden; dat is, die vrolijk of voorspoediglijk leeft. Vergelijk de gelukwensing aan de koningen gebruikelijk: De koning leve, 1Sa 10:24, enz."},{"catchword":"Vrede zij u,","tekst":"Hebreeuws, gij vrede; dat is, u zij vrede, gelijk 2Sa 17:3, en 1Sa 20:9."}],"7":[{"catchword":"smaadheid aangedaan,","tekst":"Of, niet gehoond, beschaamd"},{"catchword":"zij hebben ook niets gemist","tekst":"Dat is, in het tellen hunner schapen, die hun vertrouwd en te bewaren gegeven waren, is niet te zoeken geweest, dat men gemist zou hebben, alzo ook onder vs.15, 21."}],"8":[{"catchword":"uw jongelingen,","tekst":"Dat is, uw herders en knechten, die bij uw schapen geweest zijn."},{"catchword":"dan deze jongelingen","tekst":"Zij verhalen Davids woorden, daarom spreken zij van zichzelven als van een derden persoon. Zij willen zeggen: Laat ons, die jongelingen of knechten Davids zijn, en van hem tot u gezonden, genade en gunst bij u vinden."},{"catchword":"op een goeden dag gekomen;","tekst":"Dat is, op een vrolijken dag, dewijl gij nu de schapen ontvangt en vergadert. Het is recht en billijk, dat gij van uw overvloed den bedrukten en verjaagden wat mededeelt, volgende de wet Deu 12:12, en Deu 14:26, Deu 14:29, en Deu 15:7."},{"catchword":"uw zoon David,","tekst":"Hij wil zeggen: Die u eert als een zoon zijn vader."},{"catchword":"uw hand vinden zal","tekst":"Dat is, enig geschenk of gift, zo veel en wat u belieft ons te geven. Zie Jdg 9:33."}],"9":[{"catchword":"zo hielden zij stil","tekst":"Hebreeuws, zij rustten; dat is, zij zwegen en hielden zich stil, om te horen wat Nabal antwoorden zou."}],"10":[{"catchword":"die zich afscheuren,","tekst":"Dat is, die weglopen of afvallen van hun heren. Aldus verwijt hij David, alsof hij zich tegen zijn heer Saul verhiEf."}],"11":[{"catchword":"water,","tekst":"In die landstreek was het water kwalijk te bekomen, alzo het land waar Nabal woonde een dor land was, zodat des waters halve in die landen dikwijls twist viel. Zie Gen 21:25, en Gen 26:15."},{"catchword":"mijn geslacht","tekst":"Hebreeuws, mijn slachting, die ik geslacht heb."}],"12":[{"catchword":"hem achtervolgens al deze woorden","tekst":"Te weten, David."}],"13":[{"catchword":"gereedschap","tekst":"Hebreeuws, vaten; dat is gereedschap, bagage, tuig of tros, gelijk boven, 1Sa 17:22."}],"14":[{"catchword":"een jongeling uit de jongelingen","tekst":"Te weten, een van Nabals knechten."},{"catchword":"te zegenen;","tekst":"Dat is, te groeten, en veel geluk te wensen, gelijk Gen 31:55."},{"catchword":"uitgevaren","tekst":"Het Hebreeuwse woord, hetwelk hier gebruikt wordt, is bij gelijkenis genomen van een roofvogel of grijpvogel, die met geweld en snellijk op een aas valt, om dat te verscheuren. Alzo, wil hij zeggen, heeft Nabal de boden Davids met bijtende en spijtige woorden bejegend en afgewezen, hen toesnauwende alsof hij hen had willen bijten."}],"16":[{"catchword":"Zij zijn een muur om ons geweest,","tekst":"Alsof zij zeiden: Zij hebben ons niet alleen zelfs niet beschadigd, maar ook voor andere, zo dieven als wilde beesten, die ons hadden mogen beschadigen, bewaard."}],"17":[{"catchword":"zoon Belials,","tekst":"Zie Deu 13:13."}],"18":[{"catchword":"toebereide schapen,","tekst":"Hebreeuws, gemaakte"},{"catchword":"maten geroost koren,","tekst":"Hebreeuws, Seïm. Zie Gen 18:6."}],"20":[{"catchword":"zij ontmoette hen","tekst":"De tekst wil zeggen dat David en Abigaïl elkander onverhoeds ontmoet hebben, komende de een van deze, de ander van de andere zijde des bergs."}],"21":[{"catchword":"deze in de woestijn heeft,","tekst":"Te weten, Nabal. Hij verwaardigt zich niet zijn naam uit te drukken, vanwege de grote onbeleefdheid en ondankbaarheid, die hij tegen hem gebruikte."}],"22":[{"catchword":"Zo","tekst":"Zie de aantekeningen Rth 1:17, aangaande deze manier van spreken."},{"catchword":"doe God aan de vijanden van David,","tekst":"Dat is, God geve dat alle vijanden Davids alzo mogen varen als ik dezen Nabal denk te doen. Hoewel enigen menen, dat David inplaats van te zeggen: God doe mij dit of dat, zijn vijanden het kwaad toegewenst heeft, dat sommigen lichtvaardiglijk zichzelven al vloekende toe te wensen plegen. Vergelijk boven, 1Sa 20:16."},{"catchword":"van allen,","tekst":"Of, van allen dat hij heeft"},{"catchword":"die aan den wand pist","tekst":"Een manier van spreken, waarmede te kennen gegeven wordt een gehele uitroeiing van een huis, alzo dat niemand overig gelaten wordt, zelfs niet een hond, die gemeenlijk aan den wand pist; alzo ook vs.34, en 1Ki 14:10, en 2Ki 9:8."}],"24":[{"catchword":"zij viel aan zijn voeten","tekst":"Tot een teken van ootmoedige eerbieding. Zie dergelijke 2Ki 4:27."},{"catchword":"mijn zij de misdaad,","tekst":"Alsof zij zeide: Straf mij inplaats van mijn man en al die anderen, die gij voorgenomen hebt te straffen."},{"catchword":"uw dienstmaagd","tekst":"Dat is, mij."}],"25":[{"catchword":"Nabal,","tekst":"Dat is, dwaas, zot, een wien de wijsheid en vroomheid ontvallen is."},{"catchword":"van mijn heer niet gezien,","tekst":"Dat is, uwe."}],"26":[{"catchword":"uw ziel leeft,","tekst":"Zie 2Ki 2:2."},{"catchword":"het is de HEERE,","tekst":"Te weten, toen Hij mij u heeft tegemoet gezonden, om met beleefde woorden en geschenken uw toorn en kwaad voornemen te stillen en te breken."},{"catchword":"met bloedstorting,","tekst":"Hebreeuws, met bloeden; gelijk Gen 4:10, en hier onder, vs.33."},{"catchword":"dat uw hand u zou verlossen;","tekst":"Alzo namelijk, dat gij u tegen mijn heillozen man met eigen hand niet komt wreken en u van den smaad, welken hij u aangedaan heeft, verlossen."},{"catchword":"als Nabal worden uw vijanden,","tekst":"Zij wil zeggen: Ik wens dat uw vijanden zo weinig vermogen en zo verachte mensen zijn mogen, als Nabal is, die niet waardig is dat gij u aldus over hem zoudt vertoornen, veel weiniger, dat gij om zijnentwil mij en mijn ganse huisgezin zoudt verdelgen. Anderen verstaan die woorden aldus: Ik wens dat het uw vijanden ga, gelijk het Nabal zou gaan, indien gij in uw voornemen voortgingt."}],"27":[{"catchword":"is de zegen,","tekst":"Dat is, dit is het geschenk, dat gij door uw afgezonden knechten van Nabal begeerd hebt, boven, vs.8."},{"catchword":"die mijns heren voetstappen nawandelen","tekst":"Hebreeuws, die bij, of aan de voeten mijns heren gaan; dat is, die hem volgen."}],"28":[{"catchword":"Vergeef toch aan uw dienstmaagd","tekst":"Alsof zij zeggen wilde: Ik neem op mij de schuld en straf mijns heillozen mans, maar vergeef ze mij, daar bid ik u om."},{"catchword":"een bestendig huis maken,","tekst":"Dat is, dat gij gerustelijk zult mogen wonen en regeren, en niet langer, gelijk gij nu doen moet, alle dagen van de ene plaats tot de andere zult moeten vluchten."},{"catchword":"oorlogen des HEEREN oorloogt,","tekst":"Zie de aantekeningen boven, 1Sa 18:17."},{"catchword":"geen kwaad bij u gevonden is","tekst":"Dit is hier eigenlijk te verstaan van eigen wraakgierigheid of andere grote wandaden; derhalve, wil zij zeggen, hoop ik niet dat gij het nu eerst doen zult."}],"29":[{"catchword":"ziel mijns heren","tekst":"Dit is een manier van spreken genomen van de mensen, die hetgeen zij dierbaar houden en wel bewaren willen, binden in een bundeltje en sluiten het op. Het is, alsof zij zeide: Het leven zal u niet ontnomen worden, dewijl gij in de bewaring des Allerhoogsten zult zijn. Saul zal u tevergeefs vervolgen; daarentegen zullen die goddelozen, die u vervolgen, verstrooid en verslingerd worden, alsof zij met een slinger uitgeworpen en weggeslingerd werden."},{"catchword":"uit het midden van de holligheid des slingers","tekst":"Of, in, te weten, zijnde. Alsof de ziel, gelijk een steen, in den slinger lag."}],"31":[{"catchword":"Zo zal dit u,","tekst":"Alsof zij zeide: Dan zult gij geen knagende conscientie hebben, noch droefheid des gemoeds, dat gij uzelven gewroken hebt met het vergieten van onschuldig bloed."},{"catchword":"zo zult gij uwer dienstmaagd gedenken","tekst":"Zij wil zeggen: Als gij na dezen hieraan gedenkt, dat ik u verhinderd hebt onnozel bloed te vergieten, zo zult gij mij nog daarvoor bedanken."}],"33":[{"catchword":"uw raad","tekst":"Te weten, de raad, welken gij genomen hebt, om door deze uw komst en beleefdheid mij af te raden en te beletten van het storten van het onschuldig bloed."},{"catchword":"bloedstorting,","tekst":"Gelijk boven, vs.26."}],"34":[{"catchword":"u kwaad te doen,","tekst":"Versta hierbij, en uw ganse huisgezin; gelijk ik onvoorzichtiglijk in mijn toorn gezworen had, vs.22."}],"35":[{"catchword":"heb uw aangezicht aangenomen","tekst":"Dat is, ik heb u in genade aangenomen, en zal doen wat gij begeert. Zie de aantekeningen Gen 19:21, en Gen 32:20."}],"36":[{"catchword":"een maaltijd in zijn huis,","tekst":"Zie dergelijke 2Sa 13:23."},{"catchword":"als eens konings maaltijd;","tekst":"Nabal deed gelijk die rijke man Luk 16:19, vergetende de arme en gebrekkelijke mensen."},{"catchword":"vrolijk","tekst":"Hebreeuws, goed"},{"catchword":"op denzelven,","tekst":"Te weten, maaltijd, anders, in hem."}],"37":[{"catchword":"toen de wijn van Nabal gegaan was,","tekst":"Dat is, toen hij zijn dronkenschap geheel uitgeslapen had. Zolang hij dronken was, zouden haar vermaningen geweest zijn als rozen voor de varkens gestrooid."},{"catchword":"die woorden te kennen","tekst":"Te weten, die hij gesproken had; wat zij tot David gezegd had, en wat David haar wederom geantwoord had, enz."},{"catchword":"Toen bestierf zijn hart in het binnenste van hem,","tekst":"Dat is, hij verschrikte zozeer, dat hij schier dood nederviel."},{"catchword":"hij werd als een steen","tekst":"Hebreeuws, hij werd tot een steen, dat is, hij werd zonder gevoel, zijn bloed veranderde in zijn lijf, verstaande het perijkel waarin hij zichzelven gebracht had."}],"39":[{"catchword":"knecht","tekst":"Dat is, mij."},{"catchword":"onthouden","tekst":"Anders, teruggehouden"},{"catchword":"van het kwade,","tekst":"Of, van die boze daad; te weten, dat ik onschuldig bloed zou vergoten hebben, uit eigen wraakgierigheid."},{"catchword":"liet met Abigaïl spreken,","tekst":"Te weten, door zijn gezanten, en nadat Nabal een tijdlang was dood geweest."}],"41":[{"catchword":"zij zeide","tekst":"Te weten, tot David, alhoewel afwezig, begerende dat zijn boden hem deze haar woorden zouden te kennen geven, en David in haar naam boodschappen."},{"catchword":"om de voeten der knechten mijns heren te wassen","tekst":"Dat is, om den allergeringsten en nederigsten dienst te doen."}],"42":[{"catchword":"die haar voetstappen nawandelden;","tekst":"Anders, die haar op den voet volgden."}],"43":[{"catchword":"Jizreël;","tekst":"Dit was een stad in den stam van Juda, gelijk te zien is Jos 15:56."}],"44":[{"catchword":"Saul had zijn dochter Michal,","tekst":"In deze daad hebben kwalijk gedaan en gezondigd Saul, Michal en Palti, verbrekende het wettelijke huwelijk van Michal met David."},{"catchword":"Palti,","tekst":"Hij wordt Palthiël genoemd 2Sa 3:15."},{"catchword":"Gallim was","tekst":"Dit schijnt gelegen te hebben in den stam Benjamins, niet ver van Gibea Sauls. Zie Isa 10:30."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And Samuel died, and all Israel gathered themselves together, and they mourned for him, and buried him in his house at Rama: and David gat him up, and went down to the wilderness of Paran. [As long as Samuel lived. David sought to him for comfort and counsel, therefore he abode as near to him as he could or might do: But when Samuel was dead, David departed to the wilderness of Paran, which lieth on the south side of Canaan. See concerning Paran the annotations on Genes.14.6.]"}],"2":[{"catchword":null,"tekst":"And there was a man at Maon, [Concerning this place, lying in the tribe of Juda, see the annotate. on Jos.15.55.] and his occupation was at Carmel, [This mountain, with the city and country, is to be distinguished from the other lying in the tribe of Issaschar, renowned in respect of the Prophet Elia: see I King.18. on verse 19.and above chap.15. on ver.12.] and that man was very great, [i.e. rich, wealthy, great in power; as 2 Sam.19.32.] and he had three thousand sheep, and a thousand goats: and he was at the shearing of his sheep at Carmel."}],"3":[{"catchword":null,"tekst":"And the name of the man was Nabal, and the name of his wife was Abigail; he the woman was good of understanding, and beautiful of countenance; but the man was churlish, and evil of doings, and he was a Calebite. [i.e. (as it is thought) of Calebs posterity. Compare below chap.30.14. with the annotat.]"}],"4":[{"catchword":null,"tekst":"When David heard in the wilderness, that Nabal did shear his sheep;"}],"5":[{"catchword":null,"tekst":"Then David sent ten young men; and David said to the young men, Go up to Carmel, and when ye come to Nabal then shall ye ask him in my name, touching the welfare. [Heb. Touching the peace; i.e. ask how he doeth, whether he be in good plight.]"}],"6":[{"catchword":null,"tekst":"And shall say thus to that prosperous (man) [Heb. Living; i.e. that liveth merrily or prosperously. Compare the salutation used toward Kings: let the King live, I Sam.10.24, &c.] Peace be to thee [Heb. thou peace; i.e. to thee be peace; as 2 Sam. 17.3. & 20.9.] and peace be to thine house, and peace be to all that thou hast."}],"7":[{"catchword":null,"tekst":"And now, I have heard, that thou hast shearers: Now the shepherds which thou hast, were with us, we offered them no disgrace, [Or, Scorned them not, made them not ashamed] neither missed they any thing [i.e. in the tale and number of their sheep that were committed to their trust and keeping, there was not any one missing or wanting, which they needed to have sought after: so also below, vers. 15, and 21.] all the days that they were at Carmel."}],"8":[{"catchword":null,"tekst":"Ask thy young men, [i.e. Thy shepherds and servants that were with thy sheep] and they will tell thee; let then these young men find grace in thine eyes, [They relate Davids words, therefore they spake of themselves, as of a third person, as if they should say, Let us, who are the young men or servants of David, and sent by him to thee, find grace and favour with thee] for we are come on a good day; [i.e. on a merry day, because thou doest now receive and gather the wooll of thy sheep: it is therefore just and equal, that thou out of thy superfluity abd abundance shouldest communicate something to the distressed and persecuted ones, according to the law, Deut.12.12. & 14.26,29. & 15.7.] give, I pray thee, unto thy servants, and thy son David, [as if he should say, who honoureth thee, as a son doth his father] that which thine hand shall find. [i.e. any Present or gift, as much, and whatever thou art pleased to give us. See Judg.9. on ver.33.]"}],"9":[{"catchword":null,"tekst":"When Davids young men were come, and in Davids name had spoken unto Nabal according to all those words, then they ceased, [Heb. they rested; i.e. they kept their peace, and were silent, to hear what Nabal should answer.]"}],"10":[{"catchword":null,"tekst":"And Nabal answered Davids servants, and said, Who is David, and who is the son of Isai? There be to day many servants that rent themselves every one from his lord. [i.e. That ran away from, and forsook their lords or masters. Thus doth he upbraid David, as if he lifted himself up against his lord and master Saul.]"}],"11":[{"catchword":null,"tekst":"Should I then take my bread, and my water, [In that country water was hard to come by, for that the land where Nabal dwelt was dry land; so that for and in respect of water, there often happened strife and contention in those parts. See Gen 21:25. & chap.26.15.] and my killed (flesh), which I have killed [Heb. my slaying which I have slain] for my shearers, and should I give it to the men whom I know not whence they be?"}],"12":[{"catchword":null,"tekst":"Then Davids young men turned them to their way; and they returned, and came, and told him, [viz. David] according to all these words."}],"13":[{"catchword":null,"tekst":"Then David said unto his men, Every man gird on his sword, and David also girded on his sword: and they marched up after David, about four hundred men, and there remained two hundred by the stuff. [Heb. Vessels. i.e. stuff, baggage, loading, carriage; as above chap.17. vers.22.]"}],"14":[{"catchword":null,"tekst":"But one young man of the young men [viz. One of Nabals servants] told Abigail, Nabals wife, of it, saying, Behold, David hath sent messengers out of the wilderness to bless [i.e. to salute, and to wish much happiness; as Gen. 31.55.] our lord, but he railed on them. [The Hebrew word that is here used, is by similitude taken from a bird of prey, that violently and swiftly falleth upon a carcase, to rent it in pieces: so, he would say, hat Nabal treated and sent away Davids messengers with biting and spiteful words, snarling at them, as if he would have bitten them in pieces.]"}],"15":[{"catchword":null,"tekst":"Yet they were d do so to the enemies of David, and let him so adde thereunto, [i.e. God grant that all Davids enemies may fare so, as I intend to do to this Nabal: Although some conceive that David instead of saying, God do this or that to me, wished the evil to befall his enemies, which some are wont to wish to themselves, by rashly cursing themselves See the annotat. on Ruth I.17. concerning this phrase, and compare ch.2.on v.16.] if of all those that he hath [or, if of all that he hath] I leave until morning (him) that pisseth, against the wall? [a phrase, or manner of speaking, whereby is implied a total ruine and destruction of a house, so that no man be left, or escape, not so much as a dog that commonly pisseth against that wall: so also v.34. & I King.14.10. & 2 King.9.8.]"}],"23":[{"catchword":null,"tekst":"Now when Abigail saw David, then she made hast, and lighted off the asse; and she fell on her face before the face of David, and she bowed her self to the ground,"}],"24":[{"catchword":null,"tekst":"And she fell at his feet, [In token of humble reverence: see the like, 2 King.4.27.] and said, Ah my Lord, let the offence be mine, [as if she had said, punish me instead of mine husband, and all the rest, which thou didst intend to punish] and let, I pray thee, thine handmaid [i.e. me] speak before tine ears, and hear the words of thine hand-maid."}],"25":[{"catchword":null,"tekst":"Let not my Lord, I pray thee, set his heart on this man of Belial, on Nabal, for as his name is, so is he, he is Nabal, [i.e. Fool, sot; one that is void of wisdom and goodness] and folly is with him: and I thine had-maid have not seen the young men of my Lord, [i.e. thy] which thou didst send."}],"26":[{"catchword":null,"tekst":"And now, my LORD, (as true as) the LORD liveth, and thy soul liveth, [See 2 King 2 on v 2] it is the LORD that hath hindered thee [viz. When he sent me to meet thee, to pacify thine anger with courteous words and presents, and to stop and hinder thine evil intent and
