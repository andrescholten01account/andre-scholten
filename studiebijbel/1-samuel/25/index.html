s", "href": "../../1-timotheus/1/"}, {"naam": "2 Timotheüs", "href": "../../2-timotheus/1/"}, {"naam": "Titus", "href": "../../titus/1/"}, {"naam": "Filemon", "href": "../../filemon/1/"}, {"naam": "Hebreeën", "href": "../../hebreeen/1/"}, {"naam": "Jakobus", "href": "../../jakobus/1/"}, {"naam": "1 Petrus", "href": "../../1-petrus/1/"}, {"naam": "2 Petrus", "href": "../../2-petrus/1/"}, {"naam": "1 Johannes", "href": "../../1-johannes/1/"}, {"naam": "2 Johannes", "href": "../../2-johannes/1/"}, {"naam": "3 Johannes", "href": "../../3-johannes/1/"}, {"naam": "Judas", "href": "../../judas/1/"}, {"naam": "Openbaring", "href": "../../openbaring/1/"}], "slugmap": {"Gen": "genesis", "Ex": "exodus", "Lev": "leviticus", "Num": "numeri", "Deut": "deuteronomium", "Joz": "jozua", "Richt": "richteren", "Ruth": "ruth", "1 Sam": "1-samuel", "2 Sam": "2-samuel", "1 Kon": "1-koningen", "2 Kon": "2-koningen", "1 Kron": "1-kronieken", "2 Kron": "2-kronieken", "Ezra": "ezra", "Neh": "nehemia", "Est": "esther", "Job": "job", "Ps": "psalmen", "Spr": "spreuken", "Pred": "prediker", "Hoogl": "hooglied", "Jes": "jesaja", "Jer": "jeremia", "Klaagl": "klaagliederen", "Ezech": "ezechiel", "Dan": "daniel", "Hos": "hosea", "Joël": "joel", "Amos": "amos", "Obadja": "obadja", "Jona": "jona", "Micha": "micha", "Nahum": "nahum", "Hab": "habakuk", "Zef": "zefanja", "Hagg": "haggai", "Zach": "zacharia", "Mal": "maleachi", "Matt": "mattheus", "Mark": "markus", "Luk": "lukas", "Joh": "johannes", "Hand": "handelingen", "Rom": "romeinen", "1 Kor": "1-korinthe", "2 Kor": "2-korinthe", "Gal": "galaten", "Ef": "efeze", "Fil": "filippenzen", "Kol": "kolossenzen", "1 Tess": "1-thessalonicenzen", "2 Tess": "2-thessalonicenzen", "1 Tim": "1-timotheus", "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "En Samuël stierf; en heel Israël verzamelde zich, en zij bedreven rouw over hem, en begroeven hem in zijn huis te Rama. En David maakte zich op, en trok af naar de woestijn Paran.", "2": "En er was een man te Maon, en zijn bedrijf was te Karmel; en die man was zeer groot, en hij had drieduizend schapen, en duizend geiten; en hij was bezig met het scheren van zijn schapen te Karmel.", "3": "En de naam van de man was Nabal, en de naam van zijn vrouw was Abigaïl; en de vrouw was goed van verstand, en mooi van gedaante; maar de man was hard en slecht van daden, en hij was een Kalebiet.", "4": "Toen David in de woestijn hoorde dat Nabal zijn schapen schoor,", "5": "zond David tien jongemannen; en David zei tegen de jongemannen: Ga op naar Karmel, en als u bij Nabal komt, zult u hem in mijn naam naar zijn welstand vragen;", "6": "en u zult zo zeggen tegen die welvarende man: Vrede zij u, en uw huis zij vrede, en alles wat u hebt, zij vrede!", "7": "En nu, ik heb gehoord dat u scheerders hebt; nu, de herders die u hebt, zijn bij ons geweest; wij hebben hun geen smaad aangedaan, en zij hebben ook niets gemist, al de dagen dat zij te Karmel geweest zijn.", "8": "Vraag het uw jongemannen, en zij zullen het u vertellen. Laat dan deze jongemannen genade vinden in uw ogen, want wij zijn op een goede dag gekomen; geef toch uw knechten, en uw zoon David, wat uw hand vinden zal.", "9": "Toen de jongemannen van David gekomen waren, en in Davids naam al die woorden tegen Nabal gesproken hadden, hielden zij stil.", "10": "En Nabal antwoordde de knechten van David en zei: Wie is David, en wie is de zoon van Isaï? Er zijn tegenwoordig veel knechten die zich losscheuren, ieder van zijn heer.", "11": "Zou ik dan mijn brood, en mijn water, en mijn geslacht *vlees* nemen, dat ik voor mijn scheerders geslacht heb, en zou ik dat geven aan mannen van wie ik niet weet waar zij vandaan komen?", "12": "Toen keerden de jongemannen van David zich om naar hun weg; en zij keerden terug, en kwamen, en boodschapten hem van het achtervolgen al deze woorden.", "13": "David dan zei tegen zijn mannen: Ieder gordt zijn zwaard aan. Toen gordde ieder zijn zwaard aan, en David gordde ook zijn zwaard aan; en zij trokken op achter David, ongeveer vierhonderd man, en er bleven er tweehonderd bij het gereedschap.", "14": "Doch een van de jongemannen boodschapte het aan Abigaïl, de vrouw van Nabal, en zei: Zie, David heeft boden gezonden uit de woestijn om onze heer te zegenen; maar hij is tegen hen uitgevaren.", "15": "Nochtans zijn zij ons zeer goede mannen geweest; en wij hebben geen smaad geleden, en wij hebben niets gemist, al de dagen dat wij met hen omgingen, toen wij op het veld waren.", "16": "Zij zijn een muur om ons geweest, zowel bij nacht als bij dag, al de dagen dat wij bij hen geweest zijn, terwijl wij de schapen weidden.", "17": "Weet dan nu, en zie wat u doen zult; want het kwaad is ten volle over onze heer besloten, en over zijn hele huis; en hij is een zoon van Belial, zodat men hem niet kan aanspreken.", "18": "Toen haastte Abigaïl zich, en nam tweehonderd broden, en twee lederzakken wijn, en vijf toebereide schapen, en vijf maten geroosterd koren, en honderd stukken rozijnen, en tweehonderd klompen vijgen, en legde die op ezels.", "19": "En zij zei tegen haar jongemannen: Trek voor mij uit; zie, ik kom achter u aan. Doch aan haar man Nabal vertelde zij het niet.", "20": "Het gebeurde nu, toen zij op de ezel reed, en afkwam in het verborgene van de berg, en zie, David en zijn mannen kwamen haar tegemoet, en zij ontmoette hen.", "21": "David nu had gezegd: Zeker heb ik tevergeefs bewaakt al wat deze man in de woestijn heeft, zodat er niets gemist is van alles wat hij heeft; en hij heeft mij kwaad voor goed vergolden.", "22": "Zo doet God aan de vijanden van David, en zo doet Hij daar nog aan toe, als ik van allen die hij heeft iets tot morgen overlaat dat mannelijk is!", "23": "Toen Abigaïl nu David zag, haastte zij zich, en kwam van de ezel af, en zij viel voor het aangezicht van David op haar aangezicht, en zij boog zich ter aarde.", "24": "En zij viel aan zijn voeten en zei: Och, mijn heer, laat de misdaad op mij zijn, en laat toch uw dienstmaagd voor uw oren spreken, en hoor de woorden van uw dienstmaagd.", "25": "Laat mijn heer toch zijn hart niet richten op deze Belials man, op Nabal; want zoals zijn naam is, zo is hij; zijn naam is Nabal, en dwaasheid is bij hem; en ik, uw dienstmaagd, heb de jongemannen van mijn heer niet gezien, die u gezonden hebt.", "26": "En nu, mijn heer! Zo waarachtig als de HEERE leeft, en uw ziel leeft, het is de HEERE Die u ervan weerhouden heeft om te komen met bloedvergieten, en dat uw hand u zou verlossen; en nu, laat uw vijanden worden als Nabal, en die kwaad zoeken tegen mijn heer!", "27": "En nu, dit is de zegen die uw dienstmaagd mijn heer gebracht heeft, dat die gegeven wordt aan de jongemannen die de voetstappen van mijn heer navolgen.", "28": "Vergeef toch uw dienstmaagd de overtreding, want de HEERE zal mijn heer zeker een bestendig huis maken, omdat mijn heer de oorlogen van de HEERE voert, en er geen kwaad bij u gevonden is al uw dagen.", "29": "Wanneer een mens opstaat om u te vervolgen en om uw ziel te zoeken, dan zal de ziel van mijn heer ingebonden zijn in het bundeltje van de levenden bij de HEERE, uw God; maar de ziel van uw vijanden zal Hij wegslingeren uit de holte van de slinger.", "30": "En het zal gebeuren, wanneer de HEERE mijn heer al het goede zal doen dat Hij over u gesproken heeft, en Hij u zal gebieden een voorganger te zijn over Israël;", "31": "dan zal dit u, mijn heer, niet tot wankeling zijn, noch tot aanstoot van het hart, namelijk dat u bloed zonder oorzaak zou vergoten hebben, en dat mijn heer zichzelf zou verlost hebben; en wanneer de HEERE mijn heer goed zal doen, dan zult u aan uw dienstmaagd denken.", "32": "Toen zei David tegen Abigaïl: Gezegend zij de HEERE, de God van Israël, Die u vandaag mij tegemoet gezonden heeft!", "33": "En gezegend zij uw raad, en gezegend bent u, dat u mij vandaag ervan weerhouden hebt te komen met bloedvergieten, en dat mijn hand mij verlost zou hebben!", "34": "Want voorzeker, zo waarachtig als de HEERE, de God van Israël, leeft, Die mij ervan weerhouden heeft u kwaad te doen: als u zich niet had gehaast en mij tegemoet was gekomen, dan zou er van Nabal niemand die mannelijk is, zijn overgebleven tot het morgenlicht!", "35": "Toen nam David uit haar hand wat zij hem gebracht had; en hij zei tegen haar: Trek in vrede op naar uw huis; zie, ik heb naar uw stem geluisterd, en heb u aanvaard.", "36": "Toen Abigaïl nu bij Nabal kwam, zie, zo had hij een maaltijd in zijn huis, als een koningsmaaltijd; en het hart van Nabal was vrolijk in hem, en hij was zeer dronken; daarom vertelde zij hem niets, klein of groot, tot het morgenlicht.", "37": "Het gebeurde nu 's morgens, toen de wijn van Nabal uitgewerkt was, dat zijn vrouw hem die woorden vertelde. Toen bestierf zijn hart in zijn binnenste, en hij werd als een steen.", "38": "En het gebeurde ongeveer tien dagen later, dat de HEERE Nabal sloeg, zodat hij stierf.", "39": "Toen David hoorde dat Nabal dood was, zei hij: Gezegend zij de HEERE, Die de twist om mijn smaad getwist heeft met de hand van Nabal, en Zijn knecht onthouden heeft van het kwade, en dat de HEERE het kwaad van Nabal op zijn eigen hoofd heeft doen wederkeren! En David zond heen, en liet met Abigaïl spreken, om haar tot vrouw te nemen.", "40": "Toen de knechten van David bij Abigaïl gekomen waren te Karmel, spraken zij tegen haar en zeiden: David heeft ons tot u gezonden, om u tot vrouw te nemen.", "41": "Toen stond zij op, en boog zich met het aangezicht ter aarde, en zij zei: Zie, uw dienstmaagd zij een dienares, om de voeten van de knechten van mijn heer te wassen.", "42": "Abigaïl nu haastte zich, en maakte zich op, en zij reed op een ezel, met haar vijf jonge dienaressen, die haar voetstappen navolgden; zij dan volgde de boden van David na, en zij werd hem tot vrouw.", "43": "Ook nam David Ahinoam van Jizreël; zo werden ook die beiden hem tot vrouwen.", "44": "Want Saul had zijn dochter Michal, de vrouw van David, gegeven aan Palti, de zoon van Lais, die van Gallim was."}, "SV": {"1": "En Samuël stierf; en gans Israël vergaderde zich, en zij bedreven rouw over hem, en begroeven hem in zijn huis te Rama. En David maakte zich op, en toog af naar de woestijn Paran.", "2": "En er was een man te Maon, en zijn bedrijf was te Karmel; en die man was zeer groot, en hij had drie duizend schapen, en duizend geiten; en hij was in het scheren zijner schapen te Karmel.", "3": "En de naam des mans was Nabal, en de naam zijner huisvrouw was Abigaïl; en de vrouw was goed van verstand, en schoon van gedaante; maar de man was hard en boos van daden, en hij was een Kalebiet.", "4": "Als David hoorde in de woestijn, dat Nabal zijn schapen schoor,", "5": "Zo zond David tien jongelingen; en David zeide tot de jongelingen: Gaat op naar Karmel, en als gij tot Nabal komt, zo zult gij hem in mijn naam naar den welstand vragen;", "6": "En zult alzo zeggen tot dien welvarende: Vrede zij u, en uw huize zij vrede, en alles, wat gij hebt, zij vrede!", "7": "En nu, ik heb gehoord, dat gij scheerders hebt; nu, de herders, die gij hebt, zijn bij ons geweest; wij hebben hun geen smaadheid aangedaan, en zij hebben ook niets gemist al de dagen, die zij te Karmel geweest zijn.", "8": "Vraag het uw jongelingen, en zij zullen het u te kennen geven. Laat dan deze jongelingen genade vinden in uw ogen, want wij zijn op een goeden dag gekomen; geef toch uw knechten, en uw zoon David, hetgeen uw hand vinden zal.", "9": "Toen de jongelingen van David gekomen waren, en in Davids naam naar al die woorden tot Nabal gesproken hadden, zo hielden zij stil.", "10": "En Nabal antwoordde den knechten van David, en zeide: Wie is David, en wie is de zoon van Isaï? Er zijn heden vele knechten, die zich afscheuren, elk van zijn heer.", "11": "Zou ik dan mijn brood, en mijn water, en mijn geslacht *vlees* nemen, dat ik voor mijn scheerders geslacht heb, en zou ik het den mannen geven, die ik niet weet, van waar zij zijn?", "12": "Toen keerden zich de jongelingen van David naar hun weg; en zij keerden weder, en kwamen, en boodschapten hem achtervolgens al deze woorden.", "13": "David dan zeide tot zijn mannen: Een iegelijk gorde zijn zwaard aan. Toen gordde een iegelijk zijn zwaard aan, en David gordde ook zijn zwaard aan; en zij togen op achter David, omtrent vierhonderd man, en daar bleven er tweehonderd bij het gereedschap.", "14": "Doch een jongeling uit de jongelingen boodschapte het aan Abigaïl, de huisvrouw van Nabal, zeggende: Zie, David heeft boden gezonden uit de woestijn, om onzen heer te zegenen; maar hij is tegen hen uitgevaren.", "15": "Nochtans zijn zij ons zeer goede mannen geweest; en wij hebben geen smaadheid geleden, en wij hebben niets gemist al de dagen, *die* wij met hen verkeerd hebben, toen wij op het veld waren.", "16": "Zij zijn een muur om ons geweest, zo bij nacht als bij dag, al de dagen, die wij bij hen geweest zijn, weidende de schapen.", "17": "Weet dan nu, en zie, wat gij doen zult; want het kwaad is ten volle over onzen heer besloten, en over zijn ganse huis; en hij is een zoon Belials, dat men hem niet mag aanspreken.", "18": "Toen haastte zich Abigaïl, en nam tweehonderd broden, en twee lederzakken wijns, en vijf toebereide schapen, en vijf maten geroost koren, en honderd stukken rozijnen, en tweehonderd klompen vijgen, en leide *die* op ezelen.", "19": "En zij zeide tot haar jongelingen: Trekt heen voor mijn aangezicht; ziet, ik kom achter ulieden; doch haar man Nabal gaf zij het niet te kennen.", "20": "Het geschiedde nu, toen zij op den ezel reed, en dat zij afkwam in het verborgene des bergs, en ziet, David en zijn mannen kwamen af haar tegemoet, en zij ontmoette hen.", "21": "David nu had gezegd: Trouwens ik heb te vergeefs bewaard al wat deze in de woestijn heeft, alzo dat er niets van alles, wat hij heeft, gemist is; en hij heeft mij kwaad voor goed vergolden.", "22": "Zo doe God aan de vijanden van David, en zo doe Hij daartoe, indien ik van allen, die hij heeft, iets tot morgen overlaat, dat mannelijk is!", "23": "Toen nu Abigaïl David zag, zo haastte zij zich, en kwam van den ezel af, en zij viel voor het aangezicht van David op haar aangezicht, en zij boog zich ter aarde.", "24": "En zij viel aan zijn voeten en zeide: Och, mijn heer, mijn zij de misdaad, en laat toch uw dienstmaagd voor uw oren spreken, en hoor de woorden uwer dienstmaagd.", "25": "Mijn heer stelle toch zijn hart niet aan dezen Belials man, aan Nabal; want gelijk zijn naam is, alzo is hij; zijn naam is Nabal, en dwaasheid is bij hem; en ik, uw dienstmaagd, heb de jongelingen van mijn heer niet gezien, die gij gezonden hebt.", "26": "En nu, mijn heer! *zo* *waarachtig* *als* de HEERE leeft, en uw ziel leeft, het is de HEERE, Die u verhinderd heeft van te komen met bloedstorting, dat uw hand u zou verlossen; en nu, dat als Nabal worden uw vijanden, en die tegen mijn heer kwaad zoeken!", "27": "En nu, dit is de zegen, dien uw dienstmaagd mijn heer toegebracht heeft, dat hij gegeven worde den jongelingen, die mijns heren voetstappen nawandelen.", "28": "Vergeef toch aan uw dienstmaagd de overtreding, want de HEERE zal zekerlijk mijn heer een bestendig huis maken, dewijl mijn heer de oorlogen des HEEREN oorloogt, en geen kwaad bij u gevonden is van uw dagen af.", "29": "Wanneer een mens opstaan zal om u te vervolgen, en om uw ziel te zoeken, zo zal de ziel mijns heren ingebonden zijn in het bundeltje der levenden bij den HEERE, uw God; maar de ziel uwer vijanden zal Hij slingeren uit het midden van de holligheid des slingers.", "30": "En het zal geschieden, als de HEERE mijn heer naar al het goede doen zal, dat Hij over u gesproken heeft, en Hij u gebieden zal een voorganger te zijn over Israël;", "31": "Zo zal dit u, mijn heer, niet zijn tot wankeling, noch aanstoot des harten, te weten, dat gij bloed zonder oorzaak zoudt vergoten hebben, en dat mijn heer zichzelven zou verlost hebben; en als de HEERE mijn heer weldoen zal, zo zult gij uwer dienstmaagd gedenken.", "32": "Toen zeide David tot Abigaïl: Gezegend zij de HEERE, de God Israëls, Die u te dezen dage mij tegemoet gezonden heeft!", "33": "En gezegend zij uw raad en gezegend zijt gij, dat gij mij te dezen dage geweerd hebt, van te komen met bloedstorting, dat mijn hand mij verlost zou hebben!", "34": "Want voorzeker, *het* *is* *zo* *waarachtig* *als* de HEERE, de God Israëls, leeft, Die mij verhinderd heeft, van u kwaad te doen, dat, ten ware dat gij u gehaast hadt, en mij tegemoet gekomen waart, zo ware van Nabal niemand, die mannelijk is, overgebleven tot het morgenlicht!", "35": "Toen nam David uit haar hand, wat zij hem gebracht had; en hij zeide tot haar: Trek met vrede op naar uw huis; zie, ik heb naar uw stem gehoord, en heb uw aangezicht aangenomen.", "36": "Toen nu Abigaïl tot Nabal kwam, ziet, zo had hij een maaltijd in zijn huis, als eens konings maaltijd; en het hart van Nabal was vrolijk op denzelven, en hij was zeer dronken; daarom gaf zij hem niet een woord, klein noch groot, te kennen, tot aan het morgenlicht.", "37": "Het geschiedde nu in den morgen, toen de wijn van Nabal gegaan was, zo gaf hem zijn huisvrouw die woorden te kennen. Toen bestierf zijn hart in het binnenste van hem, en hij werd als een steen.", "38": "En het geschiedde omtrent *na* tien dagen, zo sloeg de HEERE Nabal, dat hij stierf.", "39": "Toen David hoorde, dat Nabal dood was, zo zeide hij: Gezegend zij de HEERE, Die den twist mijner smaadheid getwist heeft van de hand van Nabal, en heeft zijn knecht onthouden van het kwade, en *dat* de HEERE het kwaad van Nabal op zijn hoofd heeft doen wederkeren! En David zond heen, en liet met Abigaïl spreken, dat hij ze zich ter vrouwe nam.", "40": "Als nu de knechten van David tot Abigaïl gekomen waren te Karmel, zo spraken zij tot haar, zeggende: David heeft ons tot u gezonden, dat hij zich u ter vrouwe neme.", "41": "Toen stond zij op, en neigde zich met het aangezicht ter aarde, en zij zeide: Ziet, uw dienstmaagd zij tot een dienares, om de voeten der knechten mijns heren te wassen.", "42": "Abigaïl nu haastte, en maakte zich op, en zij reed op een ezel, met haar vijf jonge maagden, die haar voetstappen nawandelden; zij dan volgde de boden van David na, en zij werd hem ter huisvrouw.", "43": "Ook nam David Ahinoam van Jizreël; alzo waren ook die beiden hem tot vrouwen.", "44": "Want Saul had zijn dochter Michal, de huisvrouw van David, gegeven aan Palti, den zoon van Lais, die van Gallim was."}, "KJV": {"1": "And Samuel died; and all the Israelites were gathered together, and lamented him, and buried him in his house at Ramah. And David arose, and went down to the wilderness of Paran.", "2": "And there was a man in Maon, whose possessions were in Carmel; and the man was very great, and he had three thousand sheep, and a thousand goats: and he was shearing his sheep in Carmel.", "3": "Now the name of the man was Nabal; and the name of his wife Abigail: and she was a woman of good understanding, and of a beautiful countenance: but the man was churlish and evil in his doings; and he was of the house of Caleb.", "4": "And David heard in the wilderness that Nabal did shear his sheep.", "5": "And David sent out ten young men, and David said unto the young men, Get you up to Carmel, and go to Nabal, and greet him in my name:", "6": "And thus shall ye say to him that liveth in prosperity, Peace be both to thee, and peace be to thine house, and peace be unto all that thou hast.", "7": "And now I have heard that thou hast shearers: now thy shepherds which were with us, we hurt them not, neither was there ought missing unto them, all the while they were in Carmel.", "8": "Ask thy young men, and they will shew thee. Wherefore let the young men find favour in thine eyes: for we come in a good day: give, I pray thee, whatsoever cometh to thine hand unto thy servants, and to thy son David.", "9": "And when David's young men came, they spake to Nabal according to all those words in the name of David, and ceased.", "10": "And Nabal answered David's servants, and said, Who is David? and who is the son of Jesse? there be many servants now a days that break away every man from his master.", "11": "Shall I then take my bread, and my water, and my flesh that I have killed for my shearers, and give it unto men, whom I know not whence they be?", "12": "So David's young men turned their way, and went again, and came and told him all those sayings.", "13": "And David said unto his men, Gird ye on every man his sword. And they girded on every man his sword; and David also girded on his sword: and there went up after David about four hundred men; and two hundred abode by the stuff.", "14": "But one of the young men told Abigail, Nabal's wife, saying, Behold, David sent messengers out of the wilderness to salute our master; and he railed on them.", "15": "But the men were very good unto us, and we were not hurt, neither missed we any thing, as long as we were conversant with them, when we were in the fields:", "16": "They were a wall unto us both by night and day, all the while we were with them keeping the sheep.", "17": "Now therefore know and consider what thou wilt do; for evil is determined against our master, and against all his household: for he is such a son of Belial, that a man cannot speak to him.", "18": "Then Abigail made haste, and took two hundred loaves, and two bottles of wine, and five sheep ready dressed, and five measures of parched corn, and an hundred clusters of raisins, and two hundred cakes of figs, and laid them on asses.", "19": "And she said unto her servants, Go on before me; behold, I come after you. But she told not her husband Nabal.", "20": "And it was so, as she rode on the ass, that she came down by the covert of the hill, and, behold, David and his men came down against her; and she met them.", "21": "Now David had said, Surely in vain have I kept all that this fellow hath in the wilderness, so that nothing was missed of all that pertained unto him: and he hath requited me evil for good.", "22": "So and more also do God unto the enemies of David, if I leave of all that pertain to him by the morning light any that pisseth against the wall.", "23": "And when Abigail saw David, she hasted, and lighted off the ass, and fell before David on her face, and bowed herself to the ground,", "24": "And fell at his feet, and said, Upon me, my lord, upon me let this iniquity be: and let thine handmaid, I pray thee, speak in thine audience, and hear the words of thine handmaid.", "25": "Let not my lord, I pray thee, regard this man of Belial, even Nabal: for as his name is, so is he; Nabal is his name, and folly is with him: but I thine handmaid saw not the young men of my lord, whom thou didst send.", "26": "Now therefore, my lord, as the LORD liveth, and as thy soul liveth, seeing the LORD hath withholden thee from coming to shed blood, and from avenging thyself with thine own hand, now let thine enemies, and they that seek evil to my lord, be as Nabal.", "27": "And now this blessing which thine handmaid hath brought unto my lord, let it even be given unto the young men that follow my lord.", "28": "I pray thee, forgive the trespass of thine handmaid: for the LORD will certainly make my lord a sure house; because my lord fighteth the battles of the LORD, and evil hath not been found in thee all thy days.", "29": "Yet a man is risen to pursue thee, and to seek thy soul: but the soul of my lord shall be bound in the bundle of life with the LORD thy God; and the souls of thine enemies, them shall he sling out, as out of the middle of a sling.", "30": "And it shall come to pass, when the LORD shall have done to my lord according to all the good that he hath spoken concerning thee, and shall have appointed thee ruler over Israel;", "31": "That this shall be no grief unto thee, nor offence of heart unto my lord, either that thou hast shed blood causeless, or that my lord hath avenged himself: but when the LORD shall have dealt well with my lord, then remember thine handmaid.", "32": "And David said to Abigail, Blessed be the LORD God of Israel, which sent thee this day to meet me:", "33": "And blessed be thy advice, and blessed be thou, which hast kept me this day from coming to shed blood, and from avenging myself with mine own hand.", "34": "For in very deed, as the LORD God of Israel liveth, which hath kept me back from hurting thee, except thou hadst hasted and come to meet me, surely there had not been left unto Nabal by the morning light any that pisseth against the wall.", "35": "So David received of her hand that which she had brought him, and said unto her, Go up in peace to thine house; see, I have hearkened to thy voice, and have accepted thy person.", "36": "And Abigail came to Nabal; and, behold, he held a feast in his house, like the feast of a king; and Nabal's heart was merry within him, for he was very drunken: wherefore she told him nothing, less or more, until the morning light.", "37": "But it came to pass in the morning, when the wine was gone out of Nabal, and his wife had told him these things, that his heart died within him, and he became as a stone.", "38": "And it came to pass about ten days after, that the LORD smote Nabal, that he died.", "39": "And when David heard that Nabal was dead, he said, Blessed be the LORD, that hath pleaded the cause of my reproach from the hand of Nabal, and hath kept his servant from evil: for the LORD hath returned the wickedness of Nabal upon his own head. And David sent and communed with Abigail, to take her to him to wife.", "40": "And when the servants of David were come to Abigail to Carmel, they spake unto her, saying, David sent us unto thee, to take thee to him to wife.", "41": "And she arose, and bowed herself on her face to the earth, and said, Behold, let thine handmaid be a servant to wash the feet of the servants of my lord.", "42": "And Abigail hasted, and arose, and rode upon an ass, with five damsels of hers that went after her; and she went after the messengers of David, and became his wife.", "43": "David also took Ahinoam of Jezreel; and they were also both of them his wives.", "44": "But Saul had given Michal his daughter, David's wife, to Phalti the son of Laish, which was of Gallim."}}, "tsk": {"1": [{"kopje": "Samuël", "refs": ["1 Sam 28:3"]}, {"kopje": "bedreven rouw", "refs": ["Gen 50:11", "Num 20:29", "Deut 34:8", "Hand 8:2"]}, {"kopje": "in zijn huis", "refs": ["1 Sam 7:17", "1 Kon 2:34", "2 Kron 33:20", "Jes 14:18"]}, {"kopje": "de woestijn", "refs": ["Gen 14:6", "Gen 21:21", "Num 10:12", "Num 12:16", "Num 13:3", "Num 13:26", "Ps 120:5"]}], "2": [{"kopje": "Maon", "refs": ["1 Sam 23:24"]}, {"kopje": "man", "refs": ["Gen 26:13", "2 Sam 19:32", "Ps 17:14", "Ps 73:3-7", "Luk 16:19-25"]}, {"kopje": "drieduizend", "refs": ["Gen 13:2", "Job 1:3", "Job 42:12"]}, {"kopje": "het scheren", "refs": ["Gen 38:13", "2 Sam 13:23", "2 Sam 13:24"]}, {"kopje": "Karmel", "refs": ["1 Sam 30:5", "Joz 15:55"]}], "3": [{"kopje": "goed", "refs": ["Spr 14:1", "Spr 31:26", "Spr 31:30", "Spr 31:31"]}, {"kopje": "was hard", "refs": ["1 Sam 25:10", "1 Sam 25:11", "1 Sam 25:17", "Ps 10:3", "Jes 32:5-7"]}], "4": [{"kopje": "zijn schapen schoor", "refs": ["Gen 38:13", "2 Sam 13:23"]}], "5": [{"kopje": "naar zijn welstand vragen", "refs": ["1 Sam 17:22", "Gen 43:23"]}], "6": [{"kopje": "welvarende", "refs": ["1 Tess 3:8", "1 Tim 5:6"]}, {"kopje": "Vrede zij u", "refs": ["2 Sam 18:28", "1 Kron 12:18", "Ps 122:7", "Matt 10:12", "Matt 10:13", "Luk 10:5", "Joh 14:27", "2 Tess 3:16"]}], "7": [{"kopje": "wij hebben hun geen smaad aangedaan", "refs": ["1 Sam 25:15", "1 Sam 25:16", "1 Sam 25:21", "1 Sam 22:2", "Jes 11:6-9", "Luk 3:14", "Fil 2:15", "Fil 4:8"]}], "8": [{"kopje": "een goede dag", "refs": ["Neh 8:11-13", "Est 9: w of Saul", "href": "../../nave/p/?hl=1Sam.25.44#i15621", "refs": [{"disp": "1 Sam 25:44", "href": "../../1-samuel/25/#v44", "ref": "1 Sam 25:44", "svLabel": null}, {"disp": "2 Sam 3:15", "href": "../../2-samuel/3/#v15", "ref": "2 Sam 3:15", "svLabel": null}, {"disp": "2 Sam 3:16", "href": "../../2-samuel/3/#v16", "ref": "2 Sam 3:16", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"1 Kon 12:16": "Toen heel Israël zag dat de koning niet naar hen hoorde, gaf het volk de koning antwoord terug en zei: Wat deel hebben wij aan David? Ja, wij hebben geen erfdeel aan de zoon van Isaï; naar uw tenten, o Israël! Zie nu naar uw eigen huis om, o David! Zo ging Israël naar zijn tenten.", "Micha 7:9": "Ik zal de gramschap van de HEERE dragen, want ik heb tegen Hem gezondigd; totdat Hij mijn twist twist, en mijn recht uitvoert; Hij zal mij naar buiten brengen aan het licht; ik zal met vreugde zien naar Zijn gerechtigheid.", "Ps 37:36": "Maar hij ging voorbij, en zie, hij was er niet meer; en ik zocht hem, maar hij werd niet gevonden.", "Luk 12:20": "Maar God zei tegen hem: Jij dwaas! Nog deze nacht zal men uw ziel van u opeisen; en wat u hebt klaargemaakt, van wie zal het dan zijn?", "Spr 31:11": "Beth. Het hart van haar man vertrouwt op haar, zodat het hem aan geen goed zal ontbreken.", "Klaagl 3:58-60": "Resch. Heere! U hebt de rechtszaken van mijn ziel bepleit, U hebt mijn leven verlost. Resch. HEERE! U hebt de verkeerdheid gezien, die men mij aangedaan heeft, oordeel mijn rechtszaak. Resch. U hebt al hun wraak gezien, al hun gedachten tegen mij.", "Jes 32:7": "En het hele gereedschap van een gierigaard is kwaad; hij bedenkt schandelijke plannen, om de ellendigen te gronde te richten met valse woorden, ook als de arme spreekt wat recht is.", "Luk 14:12-14": "En Hij zei ook tegen hem die Hem genodigd had: Wanneer u een middagmaal of avondmaal houdt, roep dan niet uw vrienden, of uw broers, of uw familie, of uw rijke buren; anders zouden zij u ook op hun beurt weer kunnen uitnodigen, en zou u vergelding gebeuren. Maar wanneer u een maaltijd houdt, nodig dan armen, verminkten, kreupelen en blinden uit; en u zult gelukkig zijn, omdat zij niets hebben om u te vergelden; want het zal u vergolden worden bij de opstanding van de rechtvaardigen.", "Jer 29:22": "En van hen zal een vloek genomen worden bij al de gevankelijk weggevoerden van Juda die in Babel zijn, zodat men zegt: De HEERE stelt u als Zedekia en als Achab, die de koning van Babel aan het vuur heeft geroosterd;", "Spr 21:14": "Een gift in het verborgene houdt de toorn onder, en een geschenk in de schoot de sterke woede.", "2 Kron 33:20": "En Manasse ontsliep met zijn vaderen, en zij begroeven hem in zijn huis; en zijn zoon Amon werd koning in zijn plaats.", "1 Kon 14:3": "En neem in uw hand tien broden, en koeken, en een kruik honing, en ga naar hem toe; hij zal u vertellen wat er met deze jongen gebeuren zal.", "1 Sam 30:5": "Davids beide vrouwen waren ook gevangen weggevoerd, Ahinoam, de Jizreëlitische, en Abigaïl, de vrouw van Nabal, de Karmeliet.", "1 Kon 9:5": "Dan zal Ik de troon van uw koninkrijk over Israël bevestigen in eeuwigheid; zoals Ik gesproken heb over uw vader David, en zei: Er zal u geen man afgesneden worden van de troon van Israël.", "Ps 37:8": "He. Laat af van toorn, en verlaat de woede; wind u niet op, zeker niet, om kwaad te doen.", "1 Sam 24:20": "Wanneer iemand zijn vijand gevonden heeft, zal hij hem dan ongedeerd zijn weg laten gaan? De HEERE nu vergeldt u het goede, voor deze dag die u mij heden aangedaan hebt.", "Luk 21:34": "En let op uzelf, dat uw harten niet op enig moment bezwaard worden met brasserij en dronkenschap, en zorgen van dit leven, en dat die dag u niet onvoorzien overkomt.", "Job 20:11": "Zijn beenderen zullen vol zijn van zijn zonden uit zijn jeugd; die zullen met hem in het stof neerliggen.", "Zach 2:5": "En Ik zal haar wezen, spreekt de HEERE, een vurige muur rondom; en Ik zal tot heerlijkheid wezen in het midden van haar.", "Richt 8:6": "Maar de leiders van Sukkoth zeiden: Is de handpalm van Zebah en Tsalmuna dan al in uw hand, dat wij aan uw leger brood zouden geven?", "Spr 6:5": "red uzelf, als een ree uit de hand van de jager, en als een vogel uit de hand van de vogelvanger.", "Job 34:19": "Hoe dan tot Hem, Die het aangezicht van de vorsten niet aanneemt, en de rijke voor de arme niet kent? Want zij zijn allen het werk van Zijn handen.", "Ps 49:11": "Want hij ziet dat de wijzen sterven, dat samen een dwaas en een onverstandig mens omkomen, en hun bezit aan anderen nalaten.", "Spr 14:29": "Wie lankmoedig is, is groot van verstand; maar wie haastig is van gemoed, verheft de dwaasheid.", "Job 36:18": "Omdat er grimmigheid is, pas op, dat Hij u niet misschien met een klap wegstoot; zodat u een groot rantsoen er niet af zou kunnen brengen.", "1 Kon 21:13": "Toen kwamen de twee mannen, zonen van Belial, en gingen tegenover hem zitten; en de mannen van Belial getuigden tegen hem, tegen Naboth, voor het volk, en zeiden: Naboth heeft God en de koning gevloekt. En zij voerden hem de stad uit, en stenigden hem met stenen, zodat hij stierf.", "Mark 15:29": "En zij die voorbijkwamen, lasterden Hem, en schudden hun hoofden, en zeiden: Ha! U die de tempel afbreekt, en in drie dagen opbouwt,", "Hebr 13:17": "Wees uw voorgangers gehoorzaam en wees hun onderdanig; want zij waken over uw zielen, als degenen die rekenschap moeten geven, opdat zij dit met vreugde mogen doen en niet al zuchtend; want dat is voor u niet nuttig.", "Gen 41:43": "En hij liet hem rijden op de tweede wagen die hij had; en zij riepen voor hem uit: Kniel! Zo stelde hij hem over heel Egypteland.", "Ps 123:3": "Wees ons genadig, HEERE! Wees ons genadig, want wij zijn de verachting veel te zat.", "2 Sam 7:16": "Doch uw huis zal bestendig zijn, en uw koninkrijk tot in eeuwigheid, voor uw aangezicht; uw troon zal vast zijn tot in eeuwigheid.", "2 Sam 13:23": "En het gebeurde, na twee volle jaren, dat Absalom schaapscheerders had bij Baäl-Hazor, dat bij Efraïm ligt; en Absalom nodigde alle zonen van de koning uit.", "Spr 24:20": "Want de kwade zal geen beloning hebben, de lamp van de goddelozen zal uitgeblust worden.", "1 Sam 17:17": "En Isaï zei tegen zijn zoon David: Neem toch voor uw broers een efa van dit geroosterde koren, en deze tien broden, en breng ze snel naar het leger, naar uw broers.", "Jes 14:11": "Uw hoogmoed is in het rijk van de dood neergestort, met het geschal van uw luiten; de maden zullen onder u gestrooid worden, en de wormen zullen u bedekken.", "Filem 1:19": "Ik, Paulus, heb het geschreven met mijn eigen hand, ik zal het betalen; opdat ik u niet zeg dat u ook uzelf aan mij schuldig bent.", "Jes 14:15": "Ja, in het rijk van de dood zult u neergestoten worden, aan de zijden van de kuil!", "Ps 17:14": "Met Uw hand van de mensen, o HEERE! Van de mensen, die van de wereld zijn, wier deel in dit leven is, wier buik U vult met Uw verborgen schat; de kinderen worden verzadigd, en zij laten hun overschot achter aan hun kinderen.", "Job 27:8": "Want wat is de verwachting van de huichelaar, als hij gierig geweest zal zijn, wanneer God zijn ziel zal uittrekken?", "2 Sam 19:32": "Barzillai nu was zeer oud, een man van tachtig jaar; en hij had de koning van voedsel voorzien toen hij in Mahanaïm verbleef; want hij was een zeer belangrijk man.", "Ef 6:11": "Doe de hele wapenrusting van God aan, opdat u kunt staan tegen de listige omleidingen van de duivel.", "Jes 36:22": "Toen kwam Eljakim, de zoon van Hilkia, de hofmeester, en Sebna, de schrijver, en Joah, de zoon van Asaf, de kanselier, naar Hizkia met gescheurde kleren; en zij vertelden hem de woorden van Rabsake.", "Jer 15:20": "Want Ik heb u tegen dit volk gesteld tot een koperen versterkte muur; zij zullen wel tegen u strijden, maar u niet overwinnen; want Ik ben met u, om u te behouden en om u te redden, spreekt de HEERE.", "2 Kon 5:3": "Deze zei tegen haar meesteres: Och, was mijn heer maar bij de profeet die in Samaria is, dan zou hij hem van zijn melaatsheid verlossen.", "Jer 16:3": "Want zo zegt de HEERE van de zonen en van de dochters, die in deze plaats geboren worden; en van hun moeders, die hen baren, en van hun vaders, die hen verwekken in dit land:", "Deut 33:29": "Gelukkig bent u, o Israël! wie is u gelijk? u bent een volk, verlost door de HEERE, het Schild van uw hulp, en Die een Zwaard is van uw hoogheid; daarom zullen uw vijanden zich geveinsd aan u onderwerpen, en u zult op hun hoogten treden!", "Hand 8:2": "En godvruchtige mannen droegen Stefanus samen naar het graf en bedreven grote rouw over hem.", "Job 36:12": "Maar als zij niet horen, dan gaan zij door het zwaard om, en geven zij de geest zonder kennis.", "1 Petr 1:5": "Die in de kracht van God bewaard wordt door het geloof tot de zaligheid, die klaarligt om geopenbaard te worden in de laatste tijd.", "2 Kron 13:7": "Daarbij hebben zich nietswaardige mannen, kinderen van Belial, bij hem verzameld en zich sterk gemaakt tegen Rehabeam, de zoon van Salomo, toen Rehabeam jong was en teder van hart, zodat hij zich tegen hen niet kon verzetten.", "Spr 11:7": "Als de goddeloze mens sterft, vergaat zijn verwachting; zelfs de allersterkste hoop is vergaan.", "Joh 17:23": "Ik in hen, en U in Mij; opdat zij volmaakt zijn tot één, en opdat de wereld erkent dat U Mij gezonden hebt, en hen liefgehad hebt, zoals U Mij liefgehad hebt.", "1 Tim 5:6": "Maar wie haar lust volgt, die is levend gestorven.", "Deut 32:14": "Boter van koeien, en melk van klein vee, met het vet van de lammeren en van de rammen, die in Basan weiden, en van de bokken, met het vette van de nieren van tarwe; en het druivenbloed, reine wijn, hebt u gedronken.", "1 Kon 11:6": "Zo deed Salomo wat kwaad was in de ogen van de HEERE; en hij volhardde niet in het volgen van de HEERE, zoals zijn vader David.", "Ps 55:24": "Maar U, o God! zult hen doen neerdalen in de put van het verderf; de mannen van het bloed en het bedrog zullen hun dagen niet tot de helft brengen; ik, daarentegen, zal op U vertrouwen.", "2 Kon 5:14": "Toen daalde hij af, en doopte zich zeven keer onder in de Jordaan, naar het woord van de man van God; en zijn vlees kwam weer terug, zoals het vlees van een klein kind; en hij werd rein.", "1 Sam 30:18": "Zo redde David alles wat de Amalekieten genomen hadden; ook redde David zijn twee vrouwen.", "Fil 4:8": "Verder, broeders, alles wat waar is, alles wat eerbaar is, alles wat rechtvaardig is, alles wat rein is, alles wat lieflijk is, alles wat goed klinkt, als er enige deugd is, en als er enige lof is, denk daaraan;", "Gen 15:1": "Na deze dingen kwam het woord van de HEERE tot Abram in een visioen, en Hij zei: Vrees niet, Abram! Ik ben u een Schild, uw Loon zeer groot.", "Rom 13:13": "Laten wij, als bij daglicht, eerbaar wandelen; niet in bras­partijen en dronkenschappen, niet in ontucht en losbandigheid, niet in twist en jaloezie;", "2 Kon 5:19": "En hij zei tegen hem: Ga in vrede. En hij ging van hem weg, een klein stuk weegs.", "1 Sam 30:26": "Toen David in Ziklag kwam, zond hij van de buit naar de oudsten van Juda, zijn vrienden, en zei: Zie, hier is een geschenk voor u, van de buit van de vijanden van de HEERE.", "Est 9:19": "Daarom maakten de Joden van de dorpen, die in de dorpsteden woonden, van de veertiende dag van de maand Adar een dag van vreugde en maaltijden, en een vrolijke dag, en van het zenden van gedeelten aan elkaar.", "Est 1:3-8": "in het derde jaar van zijn regering, dat hij een maaltijd gaf voor al zijn vorsten en zijn knechten; de machthebbers van Perzië en Medië, de grootste heren en de leiders van de landschappen waren voor hem aanwezig. Hij liet daarbij de rijkdom van de heerlijkheid van zijn koninkrijk zien, en de kostbaarheid van het sieraad van zijn grootheid, vele dagen lang: honderdtachtig dagen. Toen die dagen voorbij waren, gaf de koning een maaltijd voor heel het volk dat zich op de burcht Susan bevond, van de grootste tot de kleinste, zeven dagen lang, in het voorhof van de tuin van het koninklijk paleis.", "Kol 3:3": "Want u bent gestorven, en uw leven is met Christus verborgen in God.", "Spr 31:27": "Tsade. Zij houdt toezicht op de gangen van haar huis; en het brood van de luiheid eet zij niet.", "Luk 23:41": "En wij toch terecht; want wij ontvangen straf die past bij wat wij gedaan hebben; maar Deze heeft niets onbehoorlijks gedaan.", "1 Sam 17:18": "Maar breng deze tien melkkazen naar de aanvoerder over duizend; en u zult naar uw broers omzien, of het hun goed gaat, en u zult van hen een teken meenemen.", "2 Sam 16:1": "Toen David een klein stuk voorbij de top gegaan was, zie, daar ontmoette Ziba hem, de knecht van Mefiboseth, met een paar gezadelde ezels, en daarop tweehonderd broden, honderd stukken rozijnen, honderd stukken zomervruchten en een leren zak wijn.", "1 Kron 12:18": "En de Geest bekleedde Amasai, de leider van de aanvoerders, en hij zei: Wij zijn van u, o David, en met u zijn wij, zoon van Isaï. Vrede, vrede zij u, en vrede uw helpers; want uw God helpt u. Toen nam David hen aan, en stelde hen tot aanvoerders van de benden.", "Ef 5:18": "En word niet dronken van wijn, waarin overdaad is, maar word vervuld met de Geest,", "Filem 1:18": "En als hij u iets aangedaan heeft, of iets schuldig is, reken dat mij toe.", "Gen 37:10": "En toen hij het aan zijn vader en aan zijn broers vertelde, bestrafte zijn vader hem en zei tegen hem: Wat is dit voor een droom die u gedroomd hebt? Zullen wij dan werkelijk komen, ik, en uw moeder, en uw broers, om ons voor u ter aarde te buigen?", "Gen 2:24": "Daarom zal de man zijn vader en zijn moeder verlaten, en zich hechten aan zijn vrouw; en zij zullen tot een vlees zijn.", "Joh 14:27": "Vrede laat Ik u na, Mijn vrede geef Ik u; niet zoals de wereld die geeft, geef Ik hem u. Laat uw hart niet ontroerd worden en niet bevreesd zijn.", "1 Sam 1:26": "En zij zei: Och, mijn heer! zo waarachtig als uw ziel leeft, mijn heer! Ik ben die vrouw, die hier bij u stond, om tot de HEERE te bidden.", "Deut 8:17": "En u in uw hart zegt: Mijn kracht, en de sterkte van mijn hand heeft mij dit vermogen verworven.", "1 Kon 15:5": "Omdat David gedaan had wat recht was in de ogen van de HEERE, en niet geweken was van alles wat Hij hem geboden had, al de dagen van zijn leven, behalve alleen in de zaak van Uria, de Hethiet.", "Ps 141:5": "Laat de rechtvaardige mij slaan, het zal weldadigheid zijn; en laat hij mij bestraffen, het zal olie van het hoofd zijn, het zal mijn hoofd niet breken; want ook dan zal mijn gebed voor hen zijn in hun tegenspoeden.", "Ps 116:15": "Kostbaar is in de ogen van de HEERE de dood van Zijn gunstgenoten.", "Richt 5:2": "Looft de HEERE, om het wreken van de wraken in Israël, om dat het volk zich gewillig heeft aangeboden.", "Gen 27:29": "Volken zullen u dienen, en volken zullen zich voor u neerbuigen; wees heer over uw broers, en de zonen van uw moeder zullen zich voor u neerbuigen! Vervloekt moet hij zijn, wie u vervloekt; en wie u zegent, zij gezegend!", "Jes 10:30": "Roep luid met uw stem, dochter van Gallim! Laat het horen tot Lais toe, o ellendige Anathoth!", "Jes 32:5": "De dwaas zal niet meer milddadig genoemd worden, en de gierige zal niet meer mild geheten worden.", "2 Kon 15:5": "En de HEERE plaagde de koning, zodat hij melaats werd tot de dag van zijn dood; en hij woonde in een afgezonderd huis, terwijl Jotham, de zoon van de koning, over het huis ging en het volk van het land rechtsprak.", "2 Kor 13:7": "En ik verlang van God, dat u geen kwaad doet; niet opdat wij beproefd bevonden zouden worden, maar opdat u het goede zou doen, ook al zouden wij als verwerpelijk zijn.", "1 Tess 5:7": "Want wie slapen, slapen 's nachts, en wie dronken zijn, zijn 's nachts dronken;", "Joz 15:55": "Maon, Karmel, en Zif, en Juta,", "Spr 18:16": "Het geschenk van een mens maakt hem ruimte, en het brengt hem voor het aangezicht van de groten.", "Spr 5:22": "De goddeloze zullen zijn eigen ongerechtigheden vangen, en met de banden van zijn zonden zal hij vastgehouden worden.", "Num 12:16": "Maar daarna trok het volk verder van Hazeroth, en zij sloegen hun kamp op in de woestijn van Paran.", "1 Sam 22:3": "En David ging vandaar naar Mizpa van de Moabieten; en hij zei tegen de koning van de Moabieten: Laat toch mijn vader en mijn moeder bij u komen, totdat ik weet wat God met mij doen zal.", "2 Sam 15:32-34": "En het gebeurde, toen David tot op de hoogte kwam, waar hij God aanbad, zie, toen ontmoette Husai, de Archiet, hem, met zijn kleed gescheurd, en aarde op zijn hoofd. En David zei tegen hem: Als u met mij meegaat, zult u mij tot een last zijn; maar als u teruggaat naar de stad, en tegen Absalom zegt: Uw knecht, ik zal van de koning zijn; ik ben eerder wel de knecht van uw vader geweest, maar nu zal ik uw knecht zijn; dan zou u voor mij de raad van Achitofel teniet doen.", "Ps 73:3-7": "Want ik was jaloers op de dwazen, toen ik de vrede van de goddelozen zag. Want er zijn geen boeien tot hun dood toe, en hun kracht is fris. Zij zijn niet in de moeite zoals andere mensen, en worden niet met andere mensen geplaagd.", "Pred 7:10": "Zeg niet: Wat is er, dat de vorige dagen beter geweest zijn dan deze? Want u zou daar niet uit wijsheid naar vragen.", "1 Sam 20:16": "Zo sloot Jonathan een verbond met het huis van David, en zei: Dat de HEERE het eist van de hand van de vijanden van David!", "2 Sam 17:6-14": "En toen Husai bij Absalom binnenkwam, sprak Absalom tegen hem en zei: Zo heeft Achitofel gesproken; zullen wij doen wat hij zegt? Zo niet, spreek u dan. Toen zei Husai tegen Absalom: De raad die Achitofel deze keer gegeven heeft, is niet goed. Verder zei Husai: U kent uw vader en zijn mannen, dat zij helden zijn, en verbitterd van gemoed, als een beer die van haar jongen beroofd is in het veld; daarbij is uw vader een krijgsman, en zal niet overnachten bij het volk.", "1 Sam 26:10": "Verder zei David: Zo waarachtig als de HEERE leeft, de HEERE zal hem slaan, of zijn dag zal komen dat hij zal sterven, of hij zal in een strijd trekken en daarin omkomen.", "1 Sam 25:18-35": "Toen haastte Abigaïl zich, en nam tweehonderd broden, en twee lederzakken wijn, en vijf toebereide schapen, en vijf maten geroosterd koren, en honderd stukken rozijnen, en tweehonderd klompen vijgen, en legde die op ezels. En zij zei tegen haar jongemannen: Trek voor mij uit; zie, ik kom achter u aan. Doch aan haar man Nabal vertelde zij het niet. Het gebeurde nu, toen zij op de ezel reed, en afkwam in het verborgene van de berg, en zie, David en zijn mannen kwamen haar tegemoet, en zij ontmoette hen.", "2 Sam 3:16": "En haar man ging met haar mee, huilend achter haar aan lopend, tot Bahurim toe. Toen zei Abner tegen hem: Ga weg, keer terug. En hij keerde terug.", "1 Sam 15:28": "Toen zei Samuël tegen hem: De HEERE heeft heden het koninkrijk van Israël van u afgescheurd, en heeft het aan uw naaste gegeven, die beter is dan u.", "1 Sam 23:17": "En hij zei tegen hem: Wees niet bang, want de hand van Saul, mijn vader, zal u niet vinden, maar u zult koning worden over Israël, en ik zal de tweede zijn na u; ook mijn vader Saul weet dat wel.", "1 Kon 20:16": "En zij trokken uit op de middag. Benhadad nu dronk zich dronken in de tenten, hij en de koningen, de twee en dertig koningen, die hem hielpen.", "2 Kon 2:15": "Toen de zonen van de profeten, die tegenover te Jericho waren, hem zagen, zeiden zij: De geest van Elia rust op Elisa; en zij kwamen hem tegemoet, en bogen zich voor hem neer ter aarde.", "2 Sam 17:28": "Beddengoed, en schalen, en aarden vaten, en tarwe, en gerst, en meel, en geroosterd koren, en bonen, en linzen, ook geroosterd,", "1 Sam 28:3": "Samuel nu was gestorven, en heel Israël had rouw over hem bedreven; en zij hadden hem begraven in Rama, namelijk in zijn eigen stad. En Saul had de waarzeggers en de geestenbezweerders uit het land weggedaan.", "1 Tess 5:8": "Maar wij, die van de dag zijn, laten wij nuchter zijn, terwijl wij aandoen het borstwapen van het geloof en de liefde, en tot een helm de hoop van de zaligheid.", "Matt 19:5": "En gezegd heeft: Daarom zal een mens vader en moeder verlaten, en zal zijn vrouw aanhangen, en die twee zullen tot één vlees zijn?", "Joh 9:29": "Wij weten dat God tot Mozes gesproken heeft; maar van Deze weten wij niet vanwaar Hij is.", "Ps 49:20": "zo zal zij toch komen tot het geslacht van haar vaderen; tot in eeuwigheid zullen zij het licht niet zien.", "Richt 19:22": "Toen zij nu hun hart vrolijk maakten, zie, omringden de mannen van die stad (mannen, die kinderen van Belial waren) het huis, en klopten op de deur; en zij spraken tegen de oude man, de heer van het huis, en zeiden: Breng de man die in uw huis gekomen is naar buiten, zodat wij hem bekennen.", "Ex 14:22": "En de kinderen van Israël gingen het midden van de zee in, op het droge; en de wateren waren hun een muur, aan hun rechterhand en aan hun linkerhand.", "1 Kon 4:23": "Tien vette runderen, en twintig weiderunderen, en honderd schapen; niet meegerekend de herten, en reeën, en buffels, en gemeste vogels.", "Spr 23:29-35": "Bij wie is wee? bij wie ach en wee? bij wie geruzie? bij wie geklaag? bij wie wonden zonder oorzaak? bij wie roodheid van de ogen? Bij hen die bij de wijn blijven hangen; bij hen die komen om gemengde drank op te zoeken. Zie niet naar de wijn, als hij zich rood vertoont, als hij in de beker zijn kleur geeft, als hij vlot naar binnen glijdt;", "Gen 19:21": "En Hij zei tegen hem: Zie, Ik heb ook in deze zaak rekening met u gehouden, dat Ik deze stad niet zal omkeren waarvan u gesproken hebt.", "1 Sam 2:9": "Hij zal de voeten van Zijn gunstgenoten bewaren; maar de goddelozen zullen zwijgen in duisternis; want een man vermag niet door kracht.", "1 Sam 24:12": "Zie toch, mijn vader, ja, zie de slip van uw mantel in mijn hand; want al heb ik de slip van uw mantel afgesneden, ik heb u niet gedood; erken en zie, dat er in mijn hand geen kwaad of overtreding is, en dat ik tegen u niet gezondigd heb; toch jaagt u mijn ziel na, om ze weg te nemen.", "Spr 6:4": "Laat uw ogen geen slaap toe, en uw oogleden geen sluimering;", "Job 18:18": "Men zal hem stoten van het licht in de duisternis, en men zal hem uit de wereld verjagen.", "1 Kron 17:10": "En vanaf die dagen dat Ik geboden heb dat er richters zouden zijn over Mijn volk Israël; en Ik heb al uw vijanden vernederd; ook heb Ik u bekendgemaakt dat de HEERE u een huis bouwen zal.", "Gen 24:51": "Zie, Rebekka staat voor u; neem haar en ga heen; laat zij de vrouw worden van de zoon van uw heer, zoals de HEERE gesproken heeft!", "Gen 34:6": "En Hemor, de vader van Sichem, ging naar buiten naar Jakob, om met hem te spreken.", "Gen 43:15": "En die mannen namen dat geschenk, en namen dubbel geld in hun hand, en Benjamin; en zij maakten zich op, en trokken af naar Egypte, en zij stonden voor Jozefs gezicht.", "Dan 5:1-5": "De koning Belsazar maakte een grote maaltijd voor zijn duizend leiders, en hij dronk wijn ten overstaan van die duizend. Toen Belsazar de wijn geproefd had, zei hij dat men de gouden en zilveren vaten voor moest brengen, die zijn vader Nebukadnezar uit de tempel die te Jeruzalem geweest was, weggevoerd had; opdat de koning en zijn leiders, zijn vrouwen en zijn bijvrouwen daaruit zouden drinken. Toen bracht men de gouden vaten, die men uit de tempel van het huis van God, die te Jeruzalem geweest was, weggevoerd had; en de koning en zijn leiders, zijn vrouwen en zijn bijvrouwen dronken daaruit.", "Dan 5:1-4": "De koning Belsazar maakte een grote maaltijd voor zijn duizend leiders, en hij dronk wijn ten overstaan van die duizend. Toen Belsazar de wijn geproefd had, zei hij dat men de gouden en zilveren vaten voor moest brengen, die zijn vader Nebukadnezar uit de tempel die te Jeruzalem geweest was, weggevoerd had; opdat de koning en zijn leiders, zijn vrouwen en zijn bijvrouwen daaruit zouden drinken. Toen bracht men de gouden vaten, die men uit de tempel van het huis van God, die te Jeruzalem geweest was, weggevoerd had; en de koning en zijn leiders, zijn vrouwen en zijn bijvrouwen dronken daaruit.", "1 Sam 24:14": "Zoals het spreekwoord van de ouden zegt: Van de goddelozen komt goddeloosheid voort; maar mijn hand zal niet tegen u zijn.", "Ex 12:29": "En het gebeurde te middernacht, dat de HEERE alle eerstgeborenen in Egypteland sloeg, van de eerstgeborene van Farao af, die op zijn troon zou zitten, tot de eerstgeborene van de gevangene, die in de gevangenis was, en alle eerstgeborenen van het vee.", "Job 1:10": "Hebt U niet een omheining gemaakt om hem heen, en om zijn huis, en om alles wat hij heeft rondom? Het werk van zijn handen hebt U gezegend, en zijn vee heeft zich in menigte uitgebreid in het land.", "1 Sam 20:42": "Toen zei Jonathan tegen David: Ga in vrede; wat wij beiden in de Naam van de HEERE gezworen hebben, toen wij zeiden: De HEERE zij tussen mij en tussen u, en tussen mijn nageslacht en tussen uw nageslacht, zij tot in eeuwigheid! Daarna stond hij op, en ging heen; en Jonathan kwam in de stad.", "Job 42:12": "En de HEERE zegende Jobs laatste meer dan zijn eerste; want hij had veertien duizend schapen, en zes duizend kamelen, en duizend juk runderen, en duizend ezelinnen.", "1 Kon 2:44": "Verder zei de koning tegen Simeï: U weet zelf al de boosheid die uw hart kent, die u aan mijn vader David gedaan hebt; daarom heeft de HEERE uw boosheid op uw eigen hoofd doen terugkeren.", "2 Kon 5:2": "En er waren benden uit Syrië getrokken, en hadden een klein meisje uit het land van Israël gevangen meegenomen, die in dienst van de vrouw van Naäman was.", "1 Sam 20:7": "Als hij zo zegt: Het is goed, dan heeft uw knecht vrede; maar als hij in gloed van toorn ontstoken is, weet dan zeker dat het kwaad bij hem ten volle besloten is.", "Ezech 28:10": "U zult de dood van de onbesnedenen sterven, door de hand van vreemden; want Ik heb het gesproken, spreekt de Heere HEERE.", "Gen 26:13": "En die man werd groot, ja, hij bleef groter worden, totdat hij zeer groot geworden was.", "2 Sam 15:9": "Toen zei de koning tegen hem: Ga in vrede. Zo stond hij op, en ging naar Hebron.", "Deut 34:8": "En de kinderen van Israël beweenden Mozes, in de vlakke velden van Moab, dertig dagen; en de dagen van het wenen, van de rouw over Mozes, kwamen ten einde.", "2 Kron 20:15": "En hij zei: Merk op, heel Juda, en u, inwoners van Jeruzalem, en u, koning Josafat! Zo zegt de HEERE tegen u: Wees niet bevreesd en wees niet ontzet vanwege deze grote menigte; want de strijd is niet van u, maar van God.", "Spr 11:10": "Een stad springt op van vreugde over het welvaren van de rechtvaardigen; en als de goddelozen vergaan, is er gejuich.", "Gen 18:2": "En hij hief zijn ogen op en keek; en zie, daar stonden drie mannen tegenover hem; toen hij hen zag, liep hij hun tegemoet vanuit de deur van de tent, en boog zich tot op de grond.", "1 Sam 18:17": "Daarom zei Saul tegen David: Zie, mijn oudste dochter Merab zal ik u tot vrouw geven; alleen, wees mij een dapper man en voer de oorlogen van de HEERE. Want Saul zei: Laat mijn hand niet tegen hem zijn, maar laat de hand van de Filistijnen tegen hem zijn.", "Spr 25:12": "Een wijze bestraffer bij een luisterend oor, is een gouden oorsieraad, en een halssieraad van het fijnste goud.", "Ef 6:10": "Vervolgens, mijn broeders, word krachtig in de Heere, en in de sterkte van Zijn macht.", "Num 22:21-33": "Toen stond Bileam 's morgens op, en zadelde zijn ezelin, en hij trok heen met de vorsten van Moab. Doch de toorn van God ontstak, omdat hij heenging; en de Engel van de HEERE stelde Zich in de weg, als tegenpartij tegen hem; hij reed op zijn ezelin, en twee van zijn knechten waren bij hem. De ezelin nu zag de Engel van de HEERE staan in de weg, met Zijn getrokken zwaard in Zijn hand; daarom week de ezelin van de weg af, en ging het veld in. Toen sloeg Bileam de ezelin, om haar weer op de weg te laten gaan.", "Gen 21:21": "En hij woonde in de woestijn Paran; en zijn moeder nam voor hem een vrouw uit Egypteland.", "Luk 10:5": "En in welk huis u ook binnengaat, zeg eerst: Vrede zij dit huis!", "Gen 13:2": "En Abram was zeer rijk, in vee, in zilver, en in goud.", "2 Kon 4:24": "Toen zadelde zij de ezelin, en zei tegen haar knecht: Drijf aan, en ga voort; houd mij niet op met rijden, tenzij ik het u zeg.", "Hand 12:23": "En meteen sloeg hem een engel van de Heere, omdat hij God de eer niet gaf; en hij werd door de wormen opgegeten, en gaf de geest.", "2 Kon 4:37": "Zo kwam zij, en viel voor zijn voeten neer, en boog zich ter aarde, en zij nam haar zoon op, en ging naar buiten.", "Job 21:18": "Dat zij worden als stro voor de wind, en als kaf, dat de wervelwind wegsteelt;", "Richt 4:10": "Toen riep Barak Zebulon en Nafthali bijeen te Kedes, en hij trok op, te voet, met tienduizend man; ook trok Debora met hem op.", "Matt 10:29": "Worden niet twee musjes voor een penninkje verkocht? En niet één daarvan zal op de aarde vallen zonder uw Vader.", "Joz 10:9": "Zo kwam Jozua snel tot hen; de hele nacht door was hij van Gilgal opgetrokken.", "Num 13:3": "Mozes dan zond hen uit de woestijn van Paran, op bevel van de HEERE; al die mannen waren hoofden van de kinderen van Israël.", "Rom 14:21": "Het is goed geen vlees te eten, en geen wijn te drinken, en niets waaraan uw broeder zich stoot, of geërgerd wordt, of waarin hij zwak is.", "1 Sam 25:14-17": "Doch een van de jongemannen boodschapte het aan Abigaïl, de vrouw van Nabal, en zei: Zie, David heeft boden gezonden uit de woestijn om onze heer te zegenen; maar hij is tegen hen uitgevaren. Nochtans zijn zij ons zeer goede mannen geweest; en wij hebben geen smaad geleden, en wij hebben niets gemist, al de dagen dat wij met hen omgingen, toen wij op het veld waren. Zij zijn een muur om ons geweest, zowel bij nacht als bij dag, al de dagen dat wij bij hen geweest zijn, terwijl wij de schapen weidden.", "1 Tess 5:15": "Zie erop toe dat niemand kwaad met kwaad vergeldt bij wie dan ook; maar jaag altijd het goede na, zowel tegenover elkaar als tegenover allen.", "2 Kron 21:6": "En hij ging de weg van de koningen van Israël, zoals het huis van Achab deed; want hij had de dochter van Achab tot vrouw; en hij deed wat slecht was in de ogen van de HEERE.", "1 Sam 25:39-44": "Toen David hoorde dat Nabal dood was, zei hij: Gezegend zij de HEERE, Die de twist om mijn smaad getwist heeft met de hand van Nabal, en Zijn knecht onthouden heeft van het kwade, en dat de HEERE het kwaad van Nabal op zijn eigen hoofd heeft doen wederkeren! En David zond heen, en liet met Abigaïl spreken, om haar tot vrouw te nemen. Toen de knechten van David bij Abigaïl gekomen waren te Karmel, spraken zij tegen haar en zeiden: David heeft ons tot u gezonden, om u tot vrouw te nemen. Toen stond zij op, en boog zich met het aangezicht ter aarde, en zij zei: Zie, uw dienstmaagd zij een dienares, om de voeten van de knechten van mijn heer te wassen.", "Gen 34:8": "Toen sprak Hemor met hen en zei: Mijn zoon Sichems ziel is verliefd op uw dochter; geef hem haar toch tot vrouw.", "Rom 12:21": "Word niet door het kwade overwonnen, maar overwin het kwade door het goede.", "Amos 9:10": "Alle zondaars van Mijn volk zullen door het zwaard sterven; zij die zeggen: Het kwaad zal ons niet naderen, en ons niet treffen.", "Spr 28:23": "Wie een mens bestraft, zal daarna meer gunst vinden dan wie met de tong vleit.", "2 Sam 7:27": "Want U, HEERE van de heerscharen, God van Israël! U hebt het voor het oor van Uw knecht geopenbaard, en gezegd: Ik zal u een huis bouwen; daarom heeft Uw knecht in zijn hart gevonden, dit gebed tot U te bidden.", "Pred 10:7": "Ik heb knechten te paard gezien, en vorsten die als knechten op de aarde gingen.", "Jes 2:15": "En tegen elke hoge toren, en tegen elke versterkte muur;", "1 Petr 2:21-23": "Want hiertoe bent u geroepen, omdat ook Christus voor ons geleden heeft, ons een voorbeeld nalatend, opdat u Zijn voetstappen zou navolgen; Die geen zonde gedaan heeft, en in Zijn mond is geen bedrog gevonden; Die, toen Hij uitgescholden werd, niet terugschold, en toen Hij leed, niet dreigde; maar het overgaf aan Hem Die rechtvaardig oordeelt;", "Spr 14:32": "De goddeloze zal weggedreven worden in zijn kwaad; maar de rechtvaardige vertrouwt zelfs in zijn dood.", "1 Sam 3:6": "Toen riep de HEERE Samuël opnieuw; en Samuël stond op en ging naar Eli, en zei: Hier ben ik, want u hebt mij geroepen. Hij dan zei: Ik heb u niet geroepen, mijn zoon; keer terug, ga liggen.", "Gen 18:6": "En Abraham haastte zich naar de tent, naar Sara, en zei: Haast u; kneed drie maten meelbloem en maak koeken.", "Joh 13:5-14": "Daarna goot Hij water in het bekken en begon de voeten van de discipelen te wassen, en af te drogen met de linnen doek waarmee Hij omgord was. Hij kwam dan bij Simon Petrus; en die zei tegen Hem: Heere, zult U mijn voeten wassen? Jezus antwoordde en zei tegen hem: Wat Ik doe, weet u nu niet, maar u zult het hierna verstaan.", "1 Tess 5:3": "Want wanneer zij zullen zeggen: Het is vrede en veilig; dan zal een plotseling verderf hun overkomen, zoals de barensweeën een zwangere vrouw overkomen; en zij zullen het geenszins ontvluchten;", "1 Sam 18:14": "En David gedroeg zich voorzichtig op al zijn wegen; en de HEERE was met hem.", "1 Kon 22:17": "En hij zei: Ik zag heel Israël verstrooid op de bergen, als schapen die geen herder hebben; en de HEERE zei: Dezen hebben geen heer; ieder keert terug naar zijn huis in vrede.", "Job 21:13": "In het goede verslijten zij hun dagen; en in een ogenblik dalen zij af in het graf.", "Gen 24:37": "En mijn heer heeft mij laten zweren en zei: U zult voor mijn zoon geen vrouw nemen van de dochters van de Kanaänieten, in wiens land ik woon;", "Ps 18:49": "Die mij uithelpt van mijn vijanden; ja, U verhoogt mij boven hen die tegen mij opstaan; U redt mij van de man van het geweld.", "Hand 13:22": "En nadat Hij hem afgezet had, verwekte Hij hun David tot koning; aan wie Hij ook getuigenis gaf, en zei: Ik heb David gevonden, de zoon van Isaï, een man naar Mijn hart, die al Mijn wil zal doen.", "Gen 43:23": "En hij zei: Vrede zij u, wees niet bang! Uw God en de God van uw vader heeft u een schat in uw zakken gegeven; uw geld is bij mij aangekomen. En hij bracht Simeon naar hen toe.", "1 Sam 25:18-37": "Toen haastte Abigaïl zich, en nam tweehonderd broden, en twee lederzakken wijn, en vijf toebereide schapen, en vijf maten geroosterd koren, en honderd stukken rozijnen, en tweehonderd klompen vijgen, en legde die op ezels. En zij zei tegen haar jongemannen: Trek voor mij uit; zie, ik kom achter u aan. Doch aan haar man Nabal vertelde zij het niet. Het gebeurde nu, toen zij op de ezel reed, en afkwam in het verborgene van de berg, en zie, David en zijn mannen kwamen haar tegemoet, en zij ontmoette hen.", "Spr 22:23": "Want de HEERE zal hun rechtszaak voeren, en Hij zal aan hen die hen beroven, de ziel roven.", "Spr 5:12": "En zegt: Hoe heb ik de tucht gehaat, en heeft mijn hart de bestraffing versmaad!", "Mark 5:22": "En zie, er kwam een van de leiders van de synagoge, van wie de naam Jaïrus was; en toen hij Hem zag, viel hij aan Zijn voeten,", "Joh 9:30": "De man antwoordde en zei tegen hen: Hierin zit toch iets wonderlijks, dat u niet weet vanwaar Hij is, en Hij heeft toch mijn ogen geopend.", "Ps 89:30": "En Ik zal zijn zaad in eeuwigheid vestigen, en zijn troon als de dagen van de hemelen.", "1 Sam 22:8": "Dat u zich allemaal tegen mij verbonden hebt, en niemand het mij laat horen dat mijn zoon een verbond gemaakt heeft met de zoon van Isaï; en niemand onder u heeft er verdriet van vanwege mij, en laat het mij horen; want mijn zoon heeft mijn knecht tegen mij opgehitst, om een hinderlaag te leggen, zoals het op deze dag is.", "Jes 22:13": "Maar zie, er is vreugde en blijdschap met runderen te doden, en schapen te slachten, vlees te eten, en wijn te drinken, en te zeggen: Laten we eten en drinken, want morgen zullen we sterven.", "Gen 42:26": "En zij laadden hun koren op hun ezels, en trokken vandaar weg.", "1 Sam 25:14-42": "Doch een van de jongemannen boodschapte het aan Abigaïl, de vrouw van Nabal, en zei: Zie, David heeft boden gezonden uit de woestijn om onze heer te zegenen; maar hij is tegen hen uitgevaren. Nochtans zijn zij ons zeer goede mannen geweest; en wij hebben geen smaad geleden, en wij hebben niets gemist, al de dagen dat wij met hen omgingen, toen wij op het veld waren. Zij zijn een muur om ons geweest, zowel bij nacht als bij dag, al de dagen dat wij bij hen geweest zijn, terwijl wij de schapen weidden.", "Num 20:29": "Toen de hele vergadering zag dat Aäron overleden was, beweenden zij Aäron dertig dagen lang, het hele huis van Israël.", "Jes 26:14": "Zij die dood zijn, zullen niet opnieuw leven, overledenen zullen niet opstaan; daarom hebt U hen bezocht en hebt U hen verdelgd, en U hebt al hun gedachtenis doen vergaan.", "Gen 40:14": "Maar denk aan mij, wanneer het u goed gaat, en bewijs mij toch weldadigheid, en maak melding van mij bij Farao, en zorg dat ik uit dit huis kom.", "Jes 28:7": "Maar ook dezen dwalen door de wijn, en zij dolen door de sterke drank; de priester en de profeet dwalen door de sterke drank; zij zijn verslonden door de wijn, zij dolen door sterke drank; zij dwalen in het zien van visioenen; zij waggelen in het rechtspreken.", "Richt 8:5": "En hij zei tegen de mannen van Sukkoth: Geef toch enige broden aan het volk dat mij volgt, want zij zijn moe; en ik jaag Zebah en Tsalmuna, de koningen van de Midianieten, achterna.", "1 Sam 25:10-17": "En Nabal antwoordde de knechten van David en zei: Wie is David, en wie is de zoon van Isaï? Er zijn tegenwoordig veel knechten die zich losscheuren, ieder van zijn heer. Zou ik dan mijn brood, en mijn water, en mijn geslacht vlees nemen, dat ik voor mijn scheerders geslacht heb, en zou ik dat geven aan mannen van wie ik niet weet waar zij vandaan komen? Toen keerden de jongemannen van David zich om naar hun weg; en zij keerden terug, en kwamen, en boodschapten hem van het achtervolgen al deze woorden.", "2 Kon 7:1": "Toen zei Elisa: Hoor het woord van de HEERE; zo zegt de HEERE: Morgen omtrent deze tijd zal een maat meelbloem verkocht worden voor een sikkel, en twee maten gerst voor een sikkel, in de poort van Samaria.", "Spr 16:32": "Wie geduldig is, is beter dan de sterke; en wie heerst over zijn geest, dan wie een stad inneemt.", "1 Kon 1:23": "En zij maakten dit aan de koning bekend en zeiden: Zie, de profeet Nathan is er; en hij kwam voor het aangezicht van de koning, en boog zich voor de koning met zijn gezicht ter aarde.", "Joz 15:18": "En het gebeurde, toen zij bij hem kwam, dat zij hem aanspoorde om een veld van haar vader te vragen; en zij sprong van de ezel af; toen zei Kaleb tegen haar: Wat wilt u?", "Hos 4:11": "Hoererij, en wijn, en jonge wijn neemt het hart weg.", "Hab 2:15": "Wee hem die zijn naaste te drinken geeft, u die uw wijnfles daarbij voegt, en hem ook dronken maakt, om hun naaktheid te aanschouwen.", "Ef 5:14": "Daarom zegt Hij: Ontwaak, u die slaapt, en sta op uit de doden; en Christus zal over u lichten.", "Matt 10:30": "En ook uw haren van het hoofd zijn alle geteld.", "Hand 5:3-10": "En Petrus zei: Ananias, waarom heeft de satan uw hart vervuld, dat u de Heilige Geest zou liegen, en onttrekken van de prijs van het land? Zolang het bleef, bleef het niet uw eigendom? En verkocht zijnde, was het niet in uw macht? Wat is het, dat u deze daad in uw hart hebt voorgenomen? U hebt niet mensen gelogen, maar God. En Ananias, deze woorden horend, viel neer en gaf de geest. En er kwam grote vrees over allen die dit hoorden.", "1 Sam 23:24": "Toen maakten zij zich op, en gingen naar Zif, voor Saul uit. David nu en zijn mannen waren in de woestijn van Maon, in de vlakte, ten zuiden van de wildernis.", "Num 16:46-48": "En Mozes zei tegen Aäron: Neem het wierookvat, en doe daar vuur in van het altaar, en leg reukwerk daarop, en ga haastig naar de vergadering, doe verzoening over hen; want er is grote toorn van voor het aangezicht van de HEERE uitgegaan, de plaag is begonnen. En Aäron nam het, zoals Mozes gesproken had, en liep midden in de gemeente, en zie, de plaag was al begonnen onder het volk; en hij legde reukwerk daarin, en deed verzoening over het volk. En hij stond tussen de doden en tussen de levenden; zo werd de plaag tot stilstand gebracht.", "Jer 51:57": "En Ik zal haar vorsten, en haar wijzen, haar landvoogden, en haar overheden, en haar helden dronken maken; en zij zullen een eeuwige slaap slapen, en niet ontwaken, spreekt de Koning, Wiens Naam is HEERE van de heerscharen.", "1 Sam 7:17": "Doch hij keerde terug naar Rama; want daar was zijn huis, en daar richtte hij Israël; en hij bouwde daar een altaar voor de HEERE.", "Gen 14:6": "en de Horieten op hun gebergte Seir, tot aan het effen veld van Paran, dat aan de woestijn is.", "Job 36:14": "Hun ziel zal in de jeugd sterven, en hun leven onder de schandjongens.", "Ps 120:5": "O, wee mij, dat ik een vreemdeling ben in Mesech, dat ik in de tenten van Kedar woont.", "1 Sam 17:22": "David nu liet zijn spullen achter bij de bewaarder van de spullen, en hij liep naar de slagorde toe; en hij kwam en vroeg zijn broers hoe het met hen ging.", "Gen 32:16": "En hij gaf die in de hand van zijn knechten, elke kudde apart; en hij zei tegen zijn knechten: Trekt u voor mij uit, en houdt ruimte tussen de ene kudde en de andere kudde.", "1 Sam 24:7": "En hij zei tegen zijn mannen: Laat het ver van mij zijn bij de HEERE, dat ik deze zaak zou doen aan mijn heer, de gezalfde van de HEERE, dat ik mijn hand tegen hem uit zou steken; want hij is de gezalfde van de HEERE!", "2 Kron 25:16": "En het gebeurde, toen hij tot hem sprak, dat hij hem zei: Heeft men u tot raadgever van de koning aangesteld? Houd op; waarom zou men u slaan? Toen hield de profeet op, en zei: Ik merk dat God besloten heeft u te vernietigen, omdat u dit gedaan hebt, en naar mijn raad niet hebt geluisterd.", "1 Sam 30:10": "En David vervolgde hen, hij en die vierhonderd mannen; en tweehonderd mannen bleven staan, die zo moe waren dat zij niet over de beek Besor konden gaan.", "Nahum 1:10": "Omdat zij als doornen ineengevlochten zijn, en dronken zijn zoals zij plegen dronken te zijn, zo worden zij helemaal verteerd, als een dorre stoppel.", "Spr 18:22": "Wie een vrouw gevonden heeft, heeft iets goeds gevonden, en hij heeft welgevallen verkregen van de HEERE.", "Pred 11:1": "Werp uw brood uit op het water, want u zult het vinden na veel dagen.", "Ps 10:3": "Want de goddeloze roemt over de wens van zijn ziel; hij zegent de gierigaard, hij lastert de HEERE.", "Ps 109:3-5": "En met hatelijke woorden hebben zij mij omsingeld; ja, zij hebben mij bestreden zonder oorzaak. Voor mijn liefde staan zij mij tegen; maar ik was steeds in het gebed. En zij hebben mij kwaad voor goed opgelegd, en haat voor mijn liefde.", "1 Sam 26:23": "De HEERE vergeldt aan ieder zijn rechtvaardigheid en zijn trouw; want de HEERE had u vandaag in mijn hand gegeven, maar ik heb mijn hand niet willen uitsteken tegen de gezalfde van de HEERE.", "Richt 9:28": "En Gaal, de zoon van Ebed, zei: Wie is Abimelech, en wat is Sichem, dat wij hem zouden dienen? Is hij niet een zoon van Jerubbaäl, en Zebul zijn aanvoerder? Dient liever de mannen van Hemor, de vader van Sichem; want waarom zouden wij hem dienen?", "Ps 78:50": "Hij baande een pad voor Zijn toorn; Hij onttrok hun ziel niet aan de dood; en hun gedierte gaf Hij over aan de pestilentie.", "Hoogl 6:5": "Wend uw ogen van Mij af, want zij overweldigen Mij; uw haar is als een kudde geiten, die van de berghellingen van Gilead afdalen.", "2 Sam 20:1": "Toen was daar bij toeval een man van Belial, wiens naam was Seba, een zoon van Bichri, een man van Jemini; die blies op de bazuin, en zei: Wij hebben geen deel aan David, en wij hebben geen erfenis aan de zoon van Isaï, ieder naar zijn tenten, o Israël!", "Spr 27:21": "De smeltkroes is voor het zilver, en de oven voor het goud; zo wordt een man beproefd naar zijn lof.", "Job 21:23-26": "De één sterft in de kracht van zijn volkomenheid, terwijl hij helemaal stil en gerust was; Zijn melkvaten waren vol melk, en het merg van zijn beenderen was bevochtigd. De ander daarentegen sterft met een bittere ziel, en hij heeft van het goede niet gegeten.", "Job 24:24": "Zij zijn een korte tijd verheven, daarna is er niemand meer van hen; zij worden neergedrukt; net als alle anderen worden zij weggenomen; en net als de top van een aar worden zij afgesneden.", "Gen 23:7": "Toen stond Abraham op, en boog zich neer voor het volk van het land, voor de zonen van Heth;", "2 Kron 29:2": "En hij deed wat recht was in de ogen van de HEERE, naar alles wat zijn vader David gedaan had.", "Joh 13:5": "Daarna goot Hij water in het bekken en begon de voeten van de discipelen te wassen, en af te drogen met de linnen doek waarmee Hij omgord was.", "Spr 31:31": "Thau. Geef haar van de vrucht van haar handen, en laat haar werken haar prijzen in de poorten.", "1 Sam 22:7": "Toen zei Saul tegen zijn knechten die bij hem stonden: Hoor toch, u, zonen van Jemini, zal ook de zoon van Isaï u allemaal akkers en wijngaarden geven? Zal hij u allemaal tot aanvoerders van duizenden en aanvoerders van honderden stellen?", "Pred 2:2": "Tot het lachen zei ik: U bent onzinnig, en tot de vreugde: Wat maakt deze?", "Dan 5:4": "Zij dronken de wijn, en prezen de gouden, zilveren, koperen, ijzeren, houten en stenen goden.", "Joh 14:19": "Nog een korte tijd, en de wereld zal Mij niet meer zien; maar u zult Mij zien; want Ik leef, en u zult leven.", "2 Sam 3:2-5": "En David werden zonen geboren in Hebron. Zijn eerstgeborene was Amnon, van Ahinoam, de Jizreëlietische; en zijn tweede was Chileab, van Abigaïl, de vrouw van Nabal, de Karmeliet; en de derde, Absalom, de zoon van Maächa, de dochter van Thalmai, koning van Gesur; en de vierde, Adonia, de zoon van Haggith; en de vijfde Sefatja, de zoon van Abital;", "1 Sam 25:32-34": "Toen zei David tegen Abigaïl: Gezegend zij de HEERE, de God van Israël, Die u vandaag mij tegemoet gezonden heeft! En gezegend zij uw raad, en gezegend bent u, dat u mij vandaag ervan weerhouden hebt te komen met bloedvergieten, en dat mijn hand mij verlost zou hebben! Want voorzeker, zo waarachtig als de HEERE, de God van Israël, leeft, Die mij ervan weerhouden heeft u kwaad te doen: als u zich niet had gehaast en mij tegemoet was gekomen, dan zou er van Nabal niemand die mannelijk is, zijn overgebleven tot het morgenlicht!", "Ps 49:15": "Men zet hen als schapen in het graf, de dood zal hen afweiden; en de oprechten zullen over hen heersen in die morgenstond; en het graf zal hun gedaante verslijten, elk uit zijn woning.", "1 Kon 2:7": "Maar aan de zonen van Barzillai, de Gileadiet, zult u vriendelijkheid bewijzen, en zij zullen bij hen horen die aan uw tafel eten; want zo kwamen zij naar mij toe, toen ik vluchtte voor het aangezicht van uw broer Absalom.", "Spr 19:2": "Ook is het niet goed als de ziel zonder kennis is; en die met de voeten haastig is, zondigt.", "Gen 22:3": "Toen stond Abraham 's morgens vroeg op, en zadelde zijn ezel, en nam twee van zijn knechten met zich, en Izak zijn zoon; en hij kloofde hout voor het brandoffer, en maakte zich op, en ging naar de plaats die God hem gezegd had.", "Spr 20:1": "De wijn is een spotter, de sterke drank is woelachtig; al wie daarin dwaalt, zal niet wijs zijn.", "2 Sam 5:13-16": "En David nam nog meer bijvrouwen en vrouwen uit Jeruzalem, nadat hij uit Hebron gekomen was; en David werden nog meer zonen en dochters geboren. En dit zijn de namen van hen die hem in Jeruzalem geboren zijn: Schammua, en Schobab, en Nathan, en Salomo. En Ibchar, en Elischua, en Nefeg, en Jafia,", "Job 24:20": "De baarmoeder vergeet hem, het gewormte vindt hem zoet, aan hem wordt niet meer gedacht; en het onrecht wordt gebroken als een stuk hout.", "1 Kon 2:34": "En Benaja, de zoon van Jojada, ging omhoog, en viel op hem aan, en doodde hem; en hij werd begraven in zijn huis, in de woestijn.", "Mark 8:14": "En Zijn discipelen waren vergeten brood mee te nemen, en hadden niet meer dan één brood bij zich in het schip.", "Job 27:19-23": "Rijk ligt hij neder, en wordt niet weggenomen; doet hij zijn ogen open, zo is hij er niet. Verschrikkingen zullen hem als water aangrijpen; 's nachts zal hem een wervelwind wegstelen. De oostenwind zal hem wegvoeren, dat hij heengaat, en zal hem wegstormen uit zijn plaats.", "Jes 14:18": "Al de koningen van de heidenvolken, zij liggen allemaal neer met eer, ieder in zijn huis;", "Jer 10:18": "Want zo zegt de HEERE: Ziet, Ik zal de inwoners van het land op deze keer wegslingeren, en zal hen benauwen, opdat zij het vinden.", "Neh 5:18": "En wat voor een dag klaargemaakt werd, was één os en zes uitgelezen schapen; ook werden voor mij vogels klaargemaakt, en om de tien dagen zeer veel van allerlei wijn; toch heb ik ondanks dit het brood van het landvoogdschap niet gezocht, omdat de dienstbaarheid zwaar was over dit volk.", "2 Sam 3:15": "Isboseth dan stuurde iemand, en nam haar van de man, van Paltiël, de zoon van Lais.", "2 Kor 6:9": "als onbekenden, en toch bekend; als stervenden, en zie, wij leven; als getuchtigd, en niet gedood;", "Ps 58:12": "En de mens zal zeggen: Zeker, er is vrucht voor de rechtvaardige; zeker, er is een God, Die op de aarde recht spreekt.", "Gen 19:1": "En die twee engelen kwamen 's avonds in Sodom aan; en Lot zat in de poort van Sodom; en toen Lot hen zag, stond hij op om hun tegemoet te gaan, en boog zich met het gezicht ter aarde.", "Gen 43:11-14": "Toen zei Israël, hun vader, tegen hen: Is het nu zo, doe dan dit; neem van het beste fruit van dit land in uw zakken, en breng die man een geschenk mee: een weinig balsem, en een weinig honing, specerijen en mirre, terpentijnnoten en amandelen. En neem dubbel geld in uw hand; en breng het geld, dat in de opening van uw zakken teruggekeerd is, weer terug in uw hand; misschien is het een vergissing. Neem ook uw broer mee, en maak u op, ga terug naar die man.", "Gen 43:11": "Toen zei Israël, hun vader, tegen hen: Is het nu zo, doe dan dit; neem van het beste fruit van dit land in uw zakken, en breng die man een geschenk mee: een weinig balsem, en een weinig honing, specerijen en mirre, terpentijnnoten en amandelen.", "1 Sam 25:23-31": "Toen Abigaïl nu David zag, haastte zij zich, en kwam van de ezel af, en zij viel voor het aangezicht van David op haar aangezicht, en zij boog zich ter aarde. En zij viel aan zijn voeten en zei: Och, mijn heer, laat de misdaad op mij zijn, en laat toch uw dienstmaagd voor uw oren spreken, en hoor de woorden van uw dienstmaagd. Laat mijn heer toch zijn hart niet richten op deze Belials man, op Nabal; want zoals zijn naam is, zo is hij; zijn naam is Nabal, en dwaasheid is bij hem; en ik, uw dienstmaagd, heb de jongemannen van mijn heer niet gezien, die u gezonden hebt.", "1 Sam 29:11": "Toen maakte David zich vroeg op, hij en zijn mannen, om 's morgens weg te gaan en terug te keren naar het land van de Filistijnen; de Filistijnen daarentegen trokken op naar Jizreël.", "1 Sam 20:32": "Toen antwoordde Jonathan Saul, zijn vader, en zei tegen hem: Waarom zal hij gedood worden? Wat heeft hij gedaan?", "Gen 43:28": "En zij zeiden: Het gaat goed met uw dienaar, onze vader, hij leeft nog; en zij neigden het hoofd en bogen zich neer.", "Gen 50:11": "Toen de inwoners van het land, de Kanaänieten, die rouw zagen op het plein van het doornbos, zeiden zij: Dit is een zware rouw van de Egyptenaars; daarom noemde men haar naam Abel-mizraim, dat aan de overzijde van de Jordaan is.", "1 Petr 3:17": "Want het is beter, als het de wil van God is, dat u lijdt om het goeddoen, dan om het kwaaddoen.", "Est 1:3-7": "in het derde jaar van zijn regering, dat hij een maaltijd gaf voor al zijn vorsten en zijn knechten; de machthebbers van Perzië en Medië, de grootste heren en de leiders van de landschappen waren voor hem aanwezig. Hij liet daarbij de rijkdom van de heerlijkheid van zijn koninkrijk zien, en de kostbaarheid van het sieraad van zijn grootheid, vele dagen lang: honderdtachtig dagen. Toen die dagen voorbij waren, gaf de koning een maaltijd voor
