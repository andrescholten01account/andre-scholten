heel het volk dat zich op de burcht Susan bevond, van de grootste tot de kleinste, zeven dagen lang, in het voorhof van de tuin van het koninklijk paleis.", "Ps 73:17-20": "Totdat ik in Gods heiligdommen inging, en op hun einde lette. Zeker, U zet hen op gladde plaatsen; U doet hen vallen in verwoestingen. Hoe worden zij als in een ogenblik tot verwoesting, komen zij aan hun einde, gaan zij te niet van verschrikkingen!", "1 Sam 30:21-24": "Toen David bij de tweehonderd mannen kwam, die zo moe waren geweest dat zij David niet hadden kunnen volgen, en die zij aan de beek Besor hadden laten blijven, gingen die David tegemoet, en het volk dat bij hem was tegemoet; en David trad naar het volk toe, en vroeg hen naar hun welstand. Toen antwoordde ieder slecht en verdorven man onder de mannen die met David waren meegegaan, en zij zeiden: Omdat zij niet met ons zijn meegegaan, zullen wij hun van de buit die wij gered hebben, niets geven, maar aan ieder zijn vrouw en zijn kinderen; laat hen die meenemen en weggaan. Maar David zei: Zo zult u niet doen, mijn broeders, met wat de HEERE ons gegeven heeft, en Hij heeft ons bewaard, en heeft de bende die tegen ons kwam, in onze hand gegeven.", "Gen 24:61-67": "En Rebekka stond op met haar dienstmeisjes, en zij reden op kamelen, en volgden de man; en die knecht nam Rebekka, en vertrok. Izak nu kwam van de weg naar de put Lachai-Roi; want hij woonde in het zuiderland. En Izak was naar buiten gegaan om te bidden in het veld, tegen het vallen van de avond; en hij hief zijn ogen op en keek, en zie, de kamelen kwamen eraan!", "2 Sam 9:6": "Toen nu Mefiboseth, de zoon van Jonathan, de zoon van Saul, bij David kwam, viel hij op zijn aangezicht en boog zich neer. En David zei: Mefiboseth! En hij zei: Zie, hier is uw knecht.", "2 Sam 3:14": "Ook zond David boden naar Isboseth, de zoon van Saul, en zei: Geef mij mijn vrouw Michal, die ik mij met honderd voorhuiden van de Filistijnen ondertrouwd heb.", "Deut 28:28": "De HEERE zal u slaan met waanzin, en met blindheid, en met verbijstering van hart;", "1 Sam 2:12": "Doch de zonen van Eli waren kinderen van Belial; zij kenden de HEERE niet.", "1 Sam 17:47": "En heel deze verzameling zal weten dat de HEERE niet door zwaard of door speer verlost; want de strijd is van de HEERE, Die zal u in onze hand geven.", "1 Sam 25:2-38": "En er was een man te Maon, en zijn bedrijf was te Karmel; en die man was zeer groot, en hij had drieduizend schapen, en duizend geiten; en hij was bezig met het scheren van zijn schapen te Karmel. En de naam van de man was Nabal, en de naam van zijn vrouw was Abigaïl; en de vrouw was goed van verstand, en mooi van gedaante; maar de man was hard en slecht van daden, en hij was een Kalebiet. Toen David in de woestijn hoorde dat Nabal zijn schapen schoor,", "Spr 14:1": "Elke wijze vrouw bouwt haar huis; maar wie zeer dwaas is, breekt het met eigen handen af.", "Spr 25:8": "Ga niet haastig een geschil aan om te twisten, opdat u misschien aan het einde daarvan niet weet wat u moet doen, wanneer uw naaste u beschaamd zou hebben.", "1 Kon 18:46": "En de hand van de HEERE was op Elia, en hij gordde zijn lenden, en liep voor het aangezicht van Achab uit, tot waar men bij Jizreël komt.", "2 Kon 7:18": "Want het was gebeurd, zoals de man Gods tegen de koning gesproken had, en gezegd: Morgen omtrent deze tijd zullen twee maten gerst voor een sikkel, en een maat meelbloem voor een sikkel verkocht worden, in de poort van Samaria.", "Spr 31:12": "Gimel. Zij doet hem goed en geen kwaad, al de dagen van haar leven.", "1 Sam 24:11": "Zie, op deze dag hebben uw ogen gezien dat de HEERE u heden in mijn hand gegeven heeft in deze spelonk, en men zei dat ik u doden zou; doch mijn hand spaarde u, want ik zei: Ik zal mijn hand niet uitsteken tegen mijn heer, want hij is de gezalfde van de HEERE.", "Spr 21:16": "Een mens die van de weg van het verstand afdwaalt, zal in de gemeente van de doden rusten.", "1 Petr 4:9": "Wees gastvrij voor elkaar, zonder gemopper.", "2 Kon 8:9": "Zo ging Hazaël hem tegemoet, en nam een geschenk mee, namelijk al het goede van Damaskus, een last van veertig kamelen; en hij kwam, en stond voor hem, en zei: Uw zoon Benhadad, de koning van Syrië, heeft mij naar u gezonden om te vragen: Zal ik van deze ziekte genezen?", "Matt 10:13": "En als dat huis waardig is, laat uw vrede dan over dat huis komen; maar als het niet waardig is, laat uw vrede dan naar u terugkeren.", "Matt 18:29": "Zijn mededienstknecht viel toen aan zijn voeten neer en smeekte hem: Heb geduld met mij, en ik zal u alles betalen.", "1 Kon 4:22": "Het voedsel nu van Salomo was voor één dag: dertig kor meelbloem, en zestig kor meel;", "Joh 10:27-30": "Mijn schapen horen Mijn stem, en Ik ken ze, en zij volgen Mij. En Ik geef hun het eeuwige leven; en zij zullen niet verloren gaan in eeuwigheid, en niemand zal ze uit Mijn hand rukken. Mijn Vader, die ze Mij gegeven heeft, is meer dan allen; en niemand kan ze rukken uit de hand van Mijn Vader.", "Jes 32:5-7": "De dwaas zal niet meer milddadig genoemd worden, en de gierige zal niet meer mild geheten worden. Want een dwaas spreekt dwaasheid, en zijn hart doet ongerechtigheid, om huichelarij te plegen, en om dwaling te spreken tegen de HEERE, om de ziel van de hongerige leeg te laten, en de dorstige drank te doen ontbreken. En het hele gereedschap van een gierigaard is kwaad; hij bedenkt schandelijke plannen, om de ellendigen te gronde te richten met valse woorden, ook als de arme spreekt wat recht is.", "Pred 11:2": "Geef een deel aan zeven, ja, ook aan acht; want u weet niet wat voor kwaad er op de aarde zal zijn.", "Gen 33:3": "En hij ging voor hen uit heen, en boog zich zeven keer ter aarde, totdat hij bij zijn broer kwam.", "2 Sam 16:12": "Misschien zal de HEERE naar mijn ellende omzien; en de HEERE zal mij goed vergelden voor zijn vloek van vandaag.", "1 Sam 20:5": "En David zei tegen Jonathan: Zie, morgen is de nieuwe maan, wanneer ik zeker met de koning zou aanzitten om te eten; zo laat mij gaan, dat ik mij op het veld verberg tot aan de derde avond.", "Job 4:21": "Verdwijnt hun uitnemendheid niet met hen? Zij sterven, maar niet in wijsheid.", "2 Sam 16:2": "En de koning zei tegen Ziba: Wat wilt u daarmee? En Ziba zei: De ezels zijn voor het huis van de koning, om op te rijden, en het brood en de zomervruchten om te eten voor de knechten; en de wijn, opdat wie moede zijn in de woestijn, kunnen drinken.", "Hos 7:5": "Het is de dag van onze koning; de vorsten maken hem ziek door verhitting van de wijn; hij strekt zijn hand uit met de spotters.", "Ps 73:4": "Want er zijn geen boeien tot hun dood toe, en hun kracht is fris.", "Hab 2:16": "U zult ook verzadigd worden met schande, in plaats van eer; drink ook zelf, en laat uw voorhuid ontbloot worden; de beker van de rechterhand van de HEERE zal zich tot u wenden, en er zal een schandelijk uitbraaksel over uw heerlijkheid zijn.", "Num 13:26": "En zij gingen heen, en kwamen tot Mozes en tot Aäron, en tot de hele vergadering van de kinderen van Israël, in de woestijn van Paran, naar Kades; en brachten hun bescheid terug, aan hen en aan de hele vergadering, en lieten hun de vrucht van het land zien.", "1 Sam 20:33": "Toen wierp Saul de speer naar hem, om hem te treffen. Zo merkte Jonathan dat het bij zijn vader ten volle besloten was, om David te doden.", "2 Sam 3:2": "En David werden zonen geboren in Hebron. Zijn eerstgeborene was Amnon, van Ahinoam, de Jizreëlietische;", "Ps 58:10": "Voordat uw potten de doornstruik gewaarworden, zal Hij hen wegstormen, springlevend, in zijn brandende toorn.", "Est 8:3": "En Esther sprak verder voor de koning, en zij viel voor zijn voeten, en zij weende, en zij smeekte hem, dat hij de boosheid van Haman, de Agagiet, en zijn plan, dat hij tegen de Joden bedacht had, zou wegnemen.", "2 Kon 5:15": "Toen keerde hij terug naar de man van God, hij en zijn hele leger, en kwam, en stond voor zijn aangezicht en zei: Zie, nu weet ik dat er geen God is op de hele aarde, dan alleen in Israël! Neem dan nu toch een geschenk aan van uw knecht.", "Gen 24:58": "En zij riepen Rebekka, en zeiden tegen haar: Wilt u met deze man meegaan? En zij antwoordde: Ik zal gaan.", "Ps 123:4": "Onze ziel is veel te zat van de spot van de weldenkenden, van de verachting van de hoogmoedigen.", "2 Sam 9:10": "Daarom zult u voor hem het land bewerken, u, en uw zonen, en uw knechten, en de opbrengst inbrengen, zodat de zoon van uw heer brood heeft om te eten; en Mefiboseth, de zoon van uw heer, zal voortdurend brood eten aan mijn tafel. Ziba nu had vijftien zonen en twintig knechten.", "2 Sam 5:13": "En David nam nog meer bijvrouwen en vrouwen uit Jeruzalem, nadat hij uit Hebron gekomen was; en David werden nog meer zonen en dochters geboren.", "2 Sam 18:28": "Ahimaäz dan riep en zei tegen de koning: Vrede! En hij boog zich voor de koning met het gezicht ter aarde, en zei: Geloofd zij de HEERE, uw God, Die de mannen heeft overgegeven die hun hand tegen mijn heer de koning ophieven.", "Ps 73:8": "Zij mergelen de mensen uit, en spreken bos van verdrukking; zij spreken uit de hoogte.", "2 Kron 10:15": "Zo luisterde de koning niet naar het volk; want deze ommekeer kwam van God, opdat de HEERE Zijn woord zou bevestigen, dat Hij door de dienst van Ahia, de Siloniet, gesproken had tot Jerobeam, de zoon van Nebat.", "Matt 5:16": "Laat uw licht zo schijnen voor de mensen, dat zij uw goede werken mogen zien en uw Vader, Die in de hemelen is, verheerlijken.", "Luk 7:50": "Maar Hij zei tegen de vrouw: Uw geloof heeft u behouden; ga heen in vrede.", "Luk 23:47": "Toen de hoofdman over honderd zag wat er gebeurd was, verheerlijkte hij God en zei: Waarlijk, deze Mens was rechtvaardig.", "Rom 12:20": "Als dan uw vijand honger heeft, geef hem te eten; als hij dorst heeft, geef hem te drinken; want als u dat doet, zult u kolen van het vuur op zijn hoofd hopen.", "1 Sam 3:17": "En hij zei: Wat is het woord dat Hij tot u gesproken heeft? Verberg het toch niet voor mij; God doe u zo, en zo doe Hij daar nog aan toe, als u een woord voor mij verbergt van al de woorden die Hij tot u gesproken heeft!", "Job 34:20": "In een ogenblik sterven zij; zelfs te middernacht wordt een volk geschud, dat het doorgaat; en de machtige wordt weggenomen zonder hand.", "Ps 38:21": "En die kwaad voor goed vergelden, staan mij tegen, omdat ik het goede najaag.", "Gen 32:14": "tweehonderd geiten en twintig bokken, tweehonderd ooien en twintig rammen;", "Jes 42:25": "Daarom heeft Hij over hen uitgestort de grimmigheid van Zijn toorn en de macht van de oorlog; en Hij heeft ze rondom in vlam gezet, doch zij merken het niet; en Hij heeft ze in brand gestoken, doch zij nemen het niet ter harte.", "Gen 43:26": "Toen Jozef nu thuisgekomen was, brachten zij hem het geschenk, dat in hun hand was, in het huis, en zij bogen zich voor hem ter aarde.", "Matt 19:8": "Hij zei tegen hen: Mozes heeft vanwege de hardheid van uw harten u toegestaan uw vrouwen te verlaten; maar van het begin af is het zo niet geweest.", "1 Kron 17:25": "Want U, mijn God, hebt aan het oor van Uw knecht geopenbaard dat U hem een huis bouwen zou; daarom heeft Uw knecht in zijn hart de vrijmoedigheid gevonden om voor Uw aangezicht te bidden.", "Luk 11:41": "Geef liever als aalmoes wat erin is; en zie, dan is alles voor u rein.", "1 Kron 12:40": "En ook degenen die dicht bij hen woonden, tot aan Issaschar, en Zebulon, en Nafthali, brachten brood op ezels, en op kamelen, en op muildieren, en op runderen, meel, klompen gedroogde vijgen, en rozijnenkoeken, en wijn, en olie, en runderen, en kleinvee in overvloed; want er was blijdschap in Israël.", "Job 21:17": "Hoe vaak gebeurt het, dat de lamp van de goddelozen wordt uitgeblust, en hun ondergang over hen komt; dat God hun smarten uitdeelt in Zijn toorn!", "Neh 8:11-13": "Verder zei hij tegen hen: Ga, eet het vette, en drink het zoete, en stuur delen aan hen voor wie niets bereid is, want deze dag is heilig voor onze Heere; wees dus niet bedroefd, want de blijdschap van de HEERE, die is uw sterkte. En de Levieten stilden heel het volk, en zeiden: Wees stil, want deze dag is heilig, dus wees niet bedroefd. Toen ging heel het volk weg om te eten en te drinken en delen te sturen en grote blijdschap te bedrijven; want zij hadden de woorden begrepen die men hun bekendgemaakt had.", "Gen 38:13": "En men liet Thamar weten: Zie, uw schoonvader gaat naar Timna om zijn schapen te scheren.", "2 Tim 4:18": "En de Heere zal mij verlossen van alle slecht werk, en bewaren tot Zijn hemels Koninkrijk; aan Hem zij de heerlijkheid, tot in alle eeuwigheid. Amen.", "1 Sam 27:3": "En David bleef bij Achis in Gath, hij en zijn mannen, ieder met zijn huisgezin; David met zijn beide vrouwen, Ahinoam, de Jizreëlietische, en Abigaïl, de vrouw van Nabal, de Karmelietische.", "Spr 10:27": "De vreze van de HEERE vermeerdert de dagen; maar de jaren van de goddelozen worden verkort.", "2 Sam 16:7": "Zo zei Simeï, terwijl hij vloekte: Ga weg, ga weg, man van bloed, en man van Belial!", "Num 16:30": "Maar als de HEERE iets nieuws schept, en het aardrijk zijn mond opendoet en hen verslindt met alles wat van hen is, en zij levend in het dodenrijk neerdalen, dan zult u weten dat deze mannen de HEERE getergd hebben.", "2 Kon 9:8": "En het hele huis van Achab zal omkomen; en Ik zal van Achab uitroeien wie mannelijk is, ook wie in Israël opgesloten is en wie verlaten is.", "Gen 44:18": "Toen kwam Juda dichter bij hem, en zei: Och, mijn heer! Laat toch uw knecht een woord spreken voor de oren van mijn heer, en laat uw toorn tegen uw knecht niet ontsteken; want u bent gelijk aan Farao!", "Richt 3:17": "En hij bracht dat geschenk aan Eglon, de koning van de Moabieten; Eglon nu was een zeer vette man.", "Job 1:3": "Daartoe had hij zeven duizend schapen, en drie duizend kamelen, en vijfhonderd juk ossen, en vijfhonderd ezelinnen; ook had hij zeer veel dienstvolk; zodat deze man groter was dan al die van het oosten.", "2 Sam 23:6": "Maar de mannen van Belial zullen allemaal zijn als doornen, die weggeworpen worden, omdat men ze met de hand niet kan vatten;", "Jes 28:8": "Want alle tafels zijn vol uitspuwsel en drek, zodat er geen schone plaats is.", "Mal 2:2": "Als u niet zult horen, en als u het niet ter harte zult nemen om Mijn Naam eer te geven, zegt de HEERE van de heerscharen, dan zal Ik de vloek onder u zenden, en Ik zal uw zegeningen vervloeken; ja, Ik heb ook al elk daarvan vervloekt, omdat u het niet ter harte neemt.", "2 Kron 14:7": "Want hij zei tegen Juda: Laten wij deze steden bouwen, en er muren omheen trekken, en torens, deuren en grendels, terwijl het land nog voor ons open ligt; want wij hebben de HEERE, onze God, gezocht, wij hebben Hem gezocht, en Hij heeft ons rondom rust gegeven. Zo bouwden zij en hadden voorspoed.", "1 Kron 14:3": "En David nam nog meer vrouwen te Jeruzalem, en David verwekte nog meer zonen en dochters.", "Ef 4:31": "Alle bitterheid, en toorn, en gramschap, en geroep, en lastering worde van u geweerd, met alle boosheid;", "2 Sam 14:9": "En de vrouw uit Thekoa zei tegen de koning: Mijn heer koning, de schuld zij op mij en op het huis van mijn vader; de koning daarentegen, en zijn troon, zij onschuldig.", "Jes 11:6-9": "En de wolf zal bij het lam wonen, en de luipaard zal bij de geitenbok neerliggen; en het kalf, en de jonge leeuw, en het mestvee samen, en een klein jongetje zal ze drijven. De koe en de berin zullen samen weiden, hun jongen zullen samen neerliggen, en de leeuw zal stro eten, net als de os. En een zuigeling zal zich vermaken bij het hol van een adder; en een gespeend kind zal zijn hand uitsteken naar de kuil van de basilisk.", "Gen 33:11": "Neem toch mijn zegen aan, die u gebracht is, omdat God mij genadig behandeld heeft, en omdat ik alles heb wat ik nodig heb; en hij hield bij hem aan, zodat hij het aannam.", "1 Sam 30:9": "David dan ging op weg, hij en de zeshonderd mannen die bij hem waren; en toen zij bij de beek Besor kwamen, bleven de overigen staan.", "Gen 49:8": "Juda! U bent het, u zullen uw broers loven; uw hand zal zijn op de nek van uw vijanden; voor u zullen de zonen van uw vader zich neerbuigen.", "1 Kon 1:31": "Toen boog Bathseba met haar gezicht ter aarde, en boog zich neer voor de koning, en zei: Mijn heer de koning David leve in eeuwigheid!", "1 Sam 20:13": "Zo doet de HEERE aan Jonathan, en zo doet Hij daar nog meer bij! Als het mijn vader behaagt kwaad over u te brengen, zal ik het u bekendmaken, en ik zal u laten gaan, dat u in vrede weggaat; en de HEERE zij met u, zoals Hij met mijn vader geweest is.", "Richt 5:10": "U, die op witte ezelinnen rijdt, u, die aan het gericht zit, en u, die over de weg wandelt, spreek erover!", "Joz 10:6": "De mannen van Gibeon nu stuurden tot Jozua, in het leger van Gilgal, en zeiden: Trek uw handen niet terug van uw knechten, kom haastig tot ons op, en verlos ons, en help ons; want al de koningen van de Amorieten, die op het gebergte wonen, hebben zich tegen ons verzameld.", "Ef 4:26": "Word toornig, en zondig niet; laat de zon niet ondergaan over uw toorn;", "Ps 44:4": "Want zij hebben het land niet geërfd door hun zwaard, en hun arm heeft hun geen heil gegeven; maar Uw rechterhand, en Uw arm, en het licht van Uw aangezicht, omdat U een welbehagen in hen had.", "1 Sam 25:24-31": "En zij viel aan zijn voeten en zei: Och, mijn heer, laat de misdaad op mij zijn, en laat toch uw dienstmaagd voor uw oren spreken, en hoor de woorden van uw dienstmaagd. Laat mijn heer toch zijn hart niet richten op deze Belials man, op Nabal; want zoals zijn naam is, zo is hij; zijn naam is Nabal, en dwaasheid is bij hem; en ik, uw dienstmaagd, heb de jongemannen van mijn heer niet gezien, die u gezonden hebt. En nu, mijn heer! Zo waarachtig als de HEERE leeft, en uw ziel leeft, het is de HEERE Die u ervan weerhouden heeft om te komen met bloedvergieten, en dat uw hand u zou verlossen; en nu, laat uw vijanden worden als Nabal, en die kwaad zoeken tegen mijn heer!", "Ps 66:9": "Die onze zielen in het leven houdt, en niet toelaat dat onze voet wankelt.", "Ps 49:18": "want hij zal bij zijn sterven niets meenemen, zijn eer zal hem niet achterna dalen.", "Jes 17:14": "Ten tijde van de avond, zie, dan is er verschrikking; voordat het morgen is, is hij er niet meer. Dit is het deel van hen die ons beroven, en het lot van hen die ons plunderen.", "2 Sam 14:12": "Toen zei deze vrouw: Laat uw dienares toch een woord tot mijn heer de koning spreken. En hij zei: Spreek.", "Ps 92:8": "Dat de goddelozen groeien als het gras, en al de werkers van de ongerechtigheid bloeien, opdat zij tot in eeuwigheid weggevaagd worden.", "1 Sam 25:5-11": "zond David tien jongemannen; en David zei tegen de jongemannen: Ga op naar Karmel, en als u bij Nabal komt, zult u hem in mijn naam naar zijn welstand vragen; en u zult zo zeggen tegen die welvarende man: Vrede zij u, en uw huis zij vrede, en alles wat u hebt, zij vrede! En nu, ik heb gehoord dat u scheerders hebt; nu, de herders die u hebt, zijn bij ons geweest; wij hebben hun geen smaad aangedaan, en zij hebben ook niets gemist, al de dagen dat zij te Karmel geweest zijn.", "1 Sam 25:18-31": "Toen haastte Abigaïl zich, en nam tweehonderd broden, en twee lederzakken wijn, en vijf toebereide schapen, en vijf maten geroosterd koren, en honderd stukken rozijnen, en tweehonderd klompen vijgen, en legde die op ezels. En zij zei tegen haar jongemannen: Trek voor mij uit; zie, ik kom achter u aan. Doch aan haar man Nabal vertelde zij het niet. Het gebeurde nu, toen zij op de ezel reed, en afkwam in het verborgene van de berg, en zie, David en zijn mannen kwamen haar tegemoet, en zij ontmoette hen.", "1 Sam 24:16": "Doch de HEERE zal Rechter zijn, en rechtspreken tussen mij en tussen u, en zien daarin, en mijn geschil beslechten, en mij redden uit uw hand.", "Ps 89:21": "Ik heb David, Mijn knecht, gevonden; met Mijn heilige olie heb Ik hem gezalfd;", "Amos 4:1": "Hoor dit woord, koeien van Basan, u die op de berg van Samaria bent, die de armen verdrukt, die de behoeftigen verplettert; u die tegen uw heren zegt: Breng aan, opdat wij drinken.", "2 Kron 9:1": "En toen de koningin van Scheba het gerucht van Salomo hoorde, kwam zij naar Jeruzalem, om Salomo met raadsels op de proef te stellen, met een zeer groot leger, en kamelen die specerijen droegen, en veel goud, en kostbaar gesteente; en zij kwam bij Salomo, en sprak met hem over alles wat in haar hart was.", "Spr 31:10": "Aleph. Wie zal een deugdelijke huisvrouw vinden? Want haar waarde gaat ver boven de robijnen.", "Jak 1:19": "Daarom, mijn geliefde broeders, laat ieder mens snel zijn om te horen, traag om te spreken, traag tot toorn;", "Zach 9:9": "Verheug u zeer, dochter van Sion! Juich, dochter van Jeruzalem! Zie, uw Koning zal tot u komen, rechtvaardig, en Hij is een Heiland; arm, en rijdend op een ezel, en op een veulen, het jong van de ezelinnen.", "Gen 44:33": "Nu dan, laat toch uw knecht in plaats van deze jongen als slaaf van mijn heer blijven, en laat de jongen met zijn broers optrekken!", "Pred 10:19": "Men maakt maaltijden om te lachen, en de wijn verheugt de levenden, en het geld verschaft alles.", "Matt 2:11": "En toen zij in het huis gekomen waren, vonden zij het Kindje met Maria, Zijn moeder, en zij vielen neer en aanbaden Het; en na hun schatten geopend te hebben, brachten zij Hem geschenken: goud, wierook en mirre.", "2 Kon 4:6": "En het gebeurde, toen de vaten vol waren, dat zij tegen haar zoon zei: Breng mij nog een vat aan; maar hij zei tegen haar: Er is geen vat meer. En de olie stond stil.", "1 Kon 1:19": "En hij heeft ossen en gemest vee en schapen in overvloed geslacht, en alle zonen van de koning genodigd, en Abjathar, de priester, en Joab, de legeraanvoerder, maar uw knecht Salomo heeft hij niet genodigd.", "Job 20:5": "Dat het gejuich van de goddelozen van dichtbij geweest is², en de vreugde van de huichelaar maar voor een ogenblik?", "Ps 18:48": "De God, Die mij volkomen wraak geeft, en de volken onder mij brengt;", "Hand 10:25": "En toen het gebeurde dat Petrus binnenkwam, ging Cornelius hem tegemoet, en viel voor zijn voeten neer, en aanbad hem.", "1 Kon 18:32": "En hij bouwde met die stenen het altaar in de Naam van de HEERE; daarna maakte hij een geul rondom het altaar, zo breed als voor twee maten zaaigoed nodig is.", "2 Kor 1:12": "Want onze roem is dit: de getuigenis van ons geweten, dat wij in eenvoud en oprechtheid van God, niet in vleselijke wijsheid, maar in de genade van God, in de wereld verkeerd hebben, en allermeest bij u.", "Gen 24:4": "maar dat u naar mijn land en naar mijn familie zult gaan, en voor mijn zoon Izak een vrouw zult nemen.", "Ps 94:1": "O God van de wraken! O HEERE, God van de wraken! Verschijn blinkend!", "Ps 147:8": "Die de hemel met wolken bedekt, Die voor de aarde regen klaarmaakt; Die het gras op de bergen laat opkomen;", "1 Sam 25:4-37": "Toen David in de woestijn hoorde dat Nabal zijn schapen schoor, zond David tien jongemannen; en David zei tegen de jongemannen: Ga op naar Karmel, en als u bij Nabal komt, zult u hem in mijn naam naar zijn welstand vragen; en u zult zo zeggen tegen die welvarende man: Vrede zij u, en uw huis zij vrede, en alles wat u hebt, zij vrede!", "1 Kon 14:10": "daarom, zie, Ik zal kwaad brengen over het huis van Jerobeam, en van Jerobeam uitroeien alwie mannelijk is, zowel wie in de macht is als wie is overgebleven in Israël; en Ik zal de nakomelingen van het huis van Jerobeam wegvegen, zoals men drek wegveegt, totdat het helemaal vergaan is.", "Gen 44:34": "Want hoe zou ik optrekken naar mijn vader, als de jongen niet bij mij was, zodat ik het verdriet niet hoef te zien dat mijn vader zou overkomen.", "1 Sam 25:4-13": "Toen David in de woestijn hoorde dat Nabal zijn schapen schoor, zond David tien jongemannen; en David zei tegen de jongemannen: Ga op naar Karmel, en als u bij Nabal komt, zult u hem in mijn naam naar zijn welstand vragen; en u zult zo zeggen tegen die welvarende man: Vrede zij u, en uw huis zij vrede, en alles wat u hebt, zij vrede!", "Spr 13:9": "Het licht van de rechtvaardigen zal zich verblijden; maar de lamp van de goddelozen zal uitgeblust worden.", "Gen 24:38": "maar u zult gaan naar het huis van mijn vader, en naar mijn geslacht, en zult voor mijn zoon een vrouw nemen!", "2 Sam 8:10": "zond Thoi zijn zoon Joram naar de koning David om hem naar zijn welstand te vragen, en om hem te zegenen, omdat hij tegen Hadad-Ezer had gevochten en hem geslagen had (want Hadad-Ezer voerde steeds oorlog tegen Thoi); en in zijn hand waren zilveren vaten, en gouden vaten, en koperen vaten;", "Joh 17:21": "Opdat zij allen één zijn, zoals U, Vader, in Mij, en Ik in U, dat ook zij in Ons één zijn; opdat de wereld gelooft dat U Mij gezonden hebt.", "1 Sam 30:12": "Zij gaven hem ook een stuk van een klomp vijgen, en twee stukken rozijnen; en hij at, en zijn geest kwam weer in hem terug; want hij had drie dagen en drie nachten geen brood gegeten, en geen water gedronken.", "Ps 49:10": "dat hij ook voortaan voor altijd zou leven, en de vergankelijkheid niet zien.", "Deut 13:13": "Er zijn mannen, kinderen van Belial, uit uw midden uitgegaan, en hebben de inwoners van hun stad aangedreven, en gezegd: Laat ons gaan, en andere goden dienen, die u niet gekend hebt;", "Openb 19:1-4": "En hierna hoorde ik als een grote stem van een grote menigte in de hemel, die zei: Halleluja, de zaligheid, en de heerlijkheid, en de eer, en de kracht zij de Heere, onze God. Want Zijn oordelen zijn waarachtig en rechtvaardig; omdat Hij de grote hoer geoordeeld heeft, die de aarde verdorven heeft met haar hoererij, en Hij het bloed van Zijn dienaren van haar hand gewroken heeft. En zij zeiden ten tweeden maal: Halleluja! En haar rook gaat op in alle eeuwigheid.", "1 Sam 18:27": "Toen maakte David zich op, en hij en zijn mannen gingen heen, en zij sloegen onder de Filistijnen tweehonderd man, en David bracht hun voorhuiden, en men leverde ze de koning volkomen, opdat hij schoonzoon van de koning zou worden. Toen gaf Saul hem zijn dochter Michal tot vrouw.", "Luk 8:48": "En Hij zei tegen haar: Dochter, heb goede moed, uw geloof heeft u behouden; ga heen in vrede.", "Spr 17:10": "De bestraffing gaat dieper in de verstandige, dan de dwaas honderdmaal te slaan.", "Spr 17:13": "Die kwaad voor goed vergeldt, het kwaad zal van zijn huis niet wijken.", "1 Sam 25:23-35": "Toen Abigaïl nu David zag, haastte zij zich, en kwam van de ezel af, en zij viel voor het aangezicht van David op haar aangezicht, en zij boog zich ter aarde. En zij viel aan zijn voeten en zei: Och, mijn heer, laat de misdaad op mij zijn, en laat toch uw dienstmaagd voor uw oren spreken, en hoor de woorden van uw dienstmaagd. Laat mijn heer toch zijn hart niet richten op deze Belials man, op Nabal; want zoals zijn naam is, zo is hij; zijn naam is Nabal, en dwaasheid is bij hem; en ik, uw dienstmaagd, heb de jongemannen van mijn heer niet gezien, die u gezonden hebt.", "2 Sam 23:7": "maar ieder die ze zal aantasten, voorziet zich met ijzer en het hout van een speer; en zij zullen helemaal met vuur verbrand worden, op dezelfde plaats.", "1 Sam 14:44": "Toen zei Saul: Zo moet God mij doen, en nog erger, Jonathan! U moet zeker sterven.", "2 Sam 3:28": "Toen David dat later hoorde, zei hij: Ik ben onschuldig, en mijn koninkrijk is dat, bij de HEERE, tot in eeuwigheid, aan het bloed van Abner, de zoon van Ner.", "Gen 32:20": "En u zult ook zeggen: Zie, uw knecht Jakob is achter ons! Want hij zei: Ik zal hem verzoenen met dit geschenk, dat voor mij uit gaat, en daarna zal ik hem zien; misschien zal hij mij aannemen.", "Gen 20:6": "En God zei tegen hem in de droom: Ik heb ook geweten dat u dit in oprechtheid van uw hart gedaan hebt, en Ik heb u ook belet om tegen Mij te zondigen; daarom heb Ik u niet toegelaten haar aan te raken.", "1 Sam 10:3": "Als u van daar verder gaat, en komt tot bij Elon-thabor, zullen u daar drie mannen vinden, die opgaan naar God, naar Beth-el; een die drie bokjes draagt, en een die drie broden draagt, en een die een fles wijn draagt.", "Ps 7:17": "Zijn moeite zal op zijn eigen hoofd terugkeren, en zijn geweld op zijn eigen schedel neerdalen.", "Job 30:8": "Zij waren kinderen van dwazen, en kinderen zonder naam; zij waren uit het land verjaagd.", "Matt 5:25": "Wees snel welgezind tegenover uw tegenpartij, terwijl u nog met hem onderweg bent, opdat de tegenpartij u misschien niet aan de rechter overlevert, en de rechter u aan de gerechtsdienaar overlevert, en u in de gevangenis geworpen wordt.", "1 Kon 1:16": "En Bathseba boog haar hoofd en boog zich neer voor de koning; en de koning zei: Wat wilt u?", "2 Sam 9:8": "Toen boog hij zich neer, en zei: Wat is uw knecht, dat u omgezien hebt naar een dode hond, zoals ik ben?", "1 Sam 24:8": "En David hield zijn mannen met woorden tegen, en liet hun niet toe dat zij opstonden tegen Saul. En Saul maakte zich op uit de spelonk, en ging op de weg.", "Spr 31:30": "Schin. De bevalligheid is bedrog, en de schoonheid vergankelijk; maar een vrouw die de HEERE vreest, die zal geprezen worden.", "Ps 35:12": "Zij vergelden mij kwaad voor goed, de beroving van mijn ziel.", "Spr 19:14": "Huis en bezit zijn een erfdeel van de vaderen; maar een verstandige vrouw is van de HEERE.", "2 Sam 13:33": "Zo moet mijn heer de koning nu de zaak niet ter harte nemen, door te denken dat alle zonen van de koning dood zijn; want Amnon alleen is dood.", "Gen 24:57": "Toen zeiden zij: Laten we het meisje roepen, en het haar zelf vragen.", "Spr 29:16": "Als de goddelozen talrijk worden, wordt de overtreding groot; maar de rechtvaardigen zullen hun val aanschouwen.", "Gal 6:10": "Zo dan, terwijl we tijd hebben, laten we goeddoen aan allen, maar vooral aan de huisgenoten van het geloof.", "Ps 45:12": "Zo zal de Koning verlangen naar uw schoonheid; omdat Hij uw Heere is, buig u voor Hem neer.", "1 Kon 1:47": "Ook zijn de knechten van de koning gekomen om onze heer, de koning David, te zegenen, en zeiden: Uw God make de naam van Salomo beter dan uw naam, en make zijn troon groter dan uw troon; en de koning heeft zich neergebogen op het bed.", "Spr 5:23": "Hij zal sterven, omdat hij zonder tucht geweest is, en in de grootheid van zijn dwaasheid zal hij verdwalen.", "1 Sam 6:9": "Kijk dan toe: als zij de weg naar haar eigen gebied opgaat naar Beth-Semes, dan heeft Hij ons dit grote kwaad gedaan; maar zo niet, dan zullen wij weten dat Zijn hand ons niet geraakt heeft; het is ons een toeval geweest.", "Richt 8:8": "En hij trok vandaar op naar Pnuël, en sprak hen op dezelfde manier toe. En de mannen van Pnuël antwoordden hem, zoals de mannen van Sukkoth geantwoord hadden.", "1 Sam 20:9": "Toen zei Jonathan: Dat zij verre van u! Maar als ik zeker merkte dat dit kwaad bij mijn vader ten volle besloten was, dat het u zou overkomen, zou ik u dat dan niet te kennen geven?", "Jes 28:3": "De hoogmoedige kroon van de dronkaards van Efraïm zal met voeten vertrapt worden.", "Gen 32:13-20": "En hij overnachtte daar diezelfde nacht; en hij nam van wat hem onder handen kwam een geschenk voor Ezau, zijn broer; tweehonderd geiten en twintig bokken, tweehonderd ooien en twintig rammen; dertig zogende kamelinnen met haar veulens, veertig koeien en tien stieren, twintig ezelinnen en tien jonge ezels.", "Gen 14:18": "En Melchizedek, koning van Salem, bracht brood en wijn; en hij was een priester van de allerhoogste God.", "Dan 5:3": "Toen bracht men de gouden vaten, die men uit de tempel van het huis van God, die te Jeruzalem geweest was, weggevoerd had; en de koning en zijn leiders, zijn vrouwen en zijn bijvrouwen dronken daaruit.", "Gen 24:3": "opdat ik u laat zweren bij de HEERE, de God van de hemel en de God van de aarde, dat u voor mijn zoon geen vrouw zult nemen van de dochters van de Kanaänieten, in het midden van wie ik woon;", "Rom 12:19": "Wreek uzelf niet, geliefden, maar geef de toorn plaats; want er is geschreven: Mij komt de wraak toe; Ik zal het vergelden, zegt de Heere.", "Job 20:8": "Hij zal wegvluchten als een droom, zodat men hem niet vinden zal, en hij zal verjaagd worden als een visioen in de nacht.", "Jer 18:20": "Zal dan kwaad voor goed vergolden worden? want zij hebben mijn ziel een kuil gegraven; gedenk dat ik voor Uw aangezicht gestaan heb om goed voor hen te spreken, om Uw grimmigheid van hen af te wenden.", "1 Sam 29:1": "De Filistijnen hadden al hun legers verzameld te Afek; en de Israëlieten legerden zich bij de bron die bij Jizreël is.", "Job 36:20": "Verlang niet naar die nacht, wanneer de volken van hun plaats worden weggenomen.", "Ps 37:35": "Resch. Ik heb een geweldenaar gezien, een goddeloze, die zich uitbreidde als een groene inlandse boom.", "2 Kon 19:35": "Het gebeurde toen in diezelfde nacht, dat de Engel van de HEERE uittrok en in het leger van Assyrië honderdvijfentachtigduizend man sloeg. En toen zij zich 's morgens vroeg opmaakten, zie, dat waren allemaal dode lichamen.", "Spr 18:12": "Vóór de ondergang verheft zich het hart van de mens; en de nederigheid gaat vóór de eer.", "2 Tess 3:16": "De Heere nu van de vrede Zelf geeft u vrede te allen tijde, op allerlei wijze. De Heere zij met u allen.", "Gen 8:4": "En de ark rustte in de zevende maand, op de zeventiende dag van de maand, op de bergen van Ararat.", "Spr 5:13": "En heb niet geluisterd naar de stem van mijn onderwijzers, mijn oren niet geneigd tot mijn leraars!", "Ruth 2:14": "Toen het etenstijd was, zei Boaz tegen haar: Kom hierbij, en eet van het brood, en doop uw stukje in de azijn. Zo zat zij neer aan de zijde van de maaiers, en hij reikte haar geroost koren aan, en zij at, en werd verzadigd, en hield over.", "2 Kor 9:5": "Ik heb dan nodig geacht deze broeders te vermanen, dat zij eerst tot u zouden komen en van tevoren uw eerder aangediende zegen klaarmaken; zodat die gereed is, als een zegen, en niet als een vrekkigheid.", "Fil 2:15": "Opdat u onberispelijk en oprecht mag zijn, kinderen van God, onstraffelijk te midden van een krom en verdraaid geslacht, onder wie u schijnt als lichten in de wereld;", "1 Sam 20:41": "Toen de jongen weg was, stond David op van de zuidzijde, en hij viel op zijn gezicht ter aarde, en boog zich driemaal; en zij kusten elkaar, en weenden met elkaar, totdat David het meest deed.", "Mal 3:17": "En zij zullen, zegt de HEERE van de heerscharen, op die dag, die Ik maken zal, Mij een eigendom zijn; en Ik zal hen verschonen, zoals een man zijn zoon verschoont, die hem dient.", "Ps 37:9": "Want de boosdoeners zullen uitgeroeid worden, maar wie de HEERE verwachten, die zullen de aarde erfelijk bezitten.", "Ex 5:2": "Maar Farao zei: Wie is de HEERE, Wiens stem ik gehoorzamen zou, om Israël te laten trekken? Ik ken de HEERE niet, en ik zal ook Israël niet laten trekken.", "Spr 19:11": "Het verstand van de mens vertraagt zijn toorn; en zijn sieraad is een overtreding voorbij te gaan.", "2 Sam 13:24": "En Absalom kwam bij de koning, en zei: Zie, uw knecht heeft nu schaapscheerders; laat toch de koning en zijn knechten met uw knecht meegaan.", "1 Petr 2:20": "Want wat lof is het, als u het verdraagt wanneer u zondigt en daarvoor geslagen wordt? Maar als u het verdraagt wanneer u goeddoet en daarvoor lijdt, dat is genade bij God.", "2 Kon 5:13": "Toen kwamen zijn knechten dichterbij, en spraken tegen hem, en zeiden: Mijn vader, als die profeet u een grote zaak opgedragen had, zou u het dan niet gedaan hebben? Hoeveel te meer dan, nu hij tegen u gezegd heeft: Was u, en u zult rein zijn?", "Joh 13:3-5": "Jezus, die wist dat de Vader Hem alle dingen in de handen gegeven had, en dat Hij van God uitgegaan was en tot God heenging, stond op van het avondmaal en legde Zijn kleren af, en nam een linnen doek en omgordde Zichzelf. Daarna goot Hij water in het bekken en begon de voeten van de discipelen te wassen, en af te drogen met de linnen doek waarmee Hij omgord was.", "2 Sam 18:32": "Toen zei de koning tegen Cuschi: Is het goed met de jongeman, met Absalom? En Cuschi zei: Laat het de vijanden van mijn heer de koning, en allen die tegen u opstaan om u kwaad te doen, vergaan als die jongeman.", "Pred 8:10": "Zo heb ik ook gezien dat de goddelozen begraven werden, en degenen die kwamen en uit de heilige plaats gingen, werden vergeten in die stad, waarin zij zo gehandeld hadden. Dit is ook vluchtigheid.", "Jes 36:21": "Toch zwegen zij stil, en antwoordden hem geen woord; want het gebod van de koning was: U zult hem niet antwoorden.", "Ps 122:7": "Vrede zij binnen uw vesting, welvaart in uw paleizen.", "1 Tess 5:23": "En de God van de vrede Zelf heilige u geheel en al; en uw geheel oprechte geest, en ziel, en lichaam moeten onberispelijk bewaard worden bij de komst van onze Heere Jezus Christus.", "Job 20:4": "Weet u dit niet? Van oudsher af, van toen God de mens op de wereld gezet heeft,", "1 Sam 25:4-8": "Toen David in de woestijn hoorde dat Nabal zijn schapen schoor, zond David tien jongemannen; en David zei tegen de jongemannen: Ga op naar Karmel, en als u bij Nabal komt, zult u hem in mijn naam naar zijn welstand vragen; en u zult zo zeggen tegen die welvarende man: Vrede zij u, en uw huis zij vrede, en alles wat u hebt, zij vrede!", "Hos 2:6": "En zij zal haar minnaars nalopen, maar hen niet aantreffen; en zij zal hen zoeken, maar niet vinden; dan zal zij zeggen: Ik zal heengaan, en terugkeren naar mijn vorige Man, want toen ging het mij beter dan nu.", "Ps 37:1": "Een psalm van David. Aleph. Wind u niet op over de boosdoeners; benijd hen niet die onrecht doen.", "Job 15:22": "Hij gelooft niet uit de duisternis terug te keren, maar dat hij beloerd wordt voor het zwaard.", "Est 7:7": "En de koning stond op in zijn grimmigheid van het maaltijd van de wijn, en ging naar de tuin van het paleis. En Haman bleef staan, om bij de koningin Esther aangaande zijn leven verzoek te doen; want hij zag dat het kwaad van de koning over hem ten volle besloten was.", "Hos 2:5": "Daarom, zie, Ik zal uw weg met doornen omtuinen, en Ik zal een omheiningsmuur maken, zodat zij haar paden niet zal vinden.", "Ps 49:21": "De mens, die in aanzien is, en geen verstand heeft, wordt gelijk aan de dieren, die vergaan.", "1 Kon 16:11": "En het gebeurde, toen hij ging regeren, zodra hij op zijn troon zat, dat hij het hele huis van Baësa neersloeg; hij liet hem niemand over die tegen een muur waterde, noch van zijn bloedverwanten, noch van zijn vrienden.", "Ruth 2:13": "En zij zei: Laat mij genade vinden in uw ogen, mijn heer, omdat u mij getroost hebt, en omdat u naar het hart van uw dienstmaagd gesproken hebt, hoewel ik niet ben als een van uw dienstmaagden.", "Ruth 1:17": "Waar u zult sterven, zal ik sterven, en daar zal ik begraven worden; zo doe mij de HEERE en zo doe Hij daar nog aan toe, als niet de dood alléén scheiding zal maken tussen mij en u!", "Spr 2:22": "Maar de goddelozen zullen van de aarde uitgeroeid worden, en de trouwelozen zullen eruit weggerukt worden.", "Luk 23:42": "En hij zei tegen Jezus: Heere, denk aan mij, wanneer U in Uw Koninkrijk gekomen bent.", "Ps 49:8": "niemand van hen zal zijn broeder ooit kunnen verlossen; hij zal aan God zijn losprijs niet kunnen geven;", "Spr 10:25": "Zoals een wervelwind voorbijgaat, zo is de goddeloze niet meer; maar de rechtvaardige is een eeuwig fundament.", "Joz 9:14": "Toen namen de mannen van hun reiskost; en zij vroegen het de mond van de HEERE niet.", "Joz 15:56": "en Jizreël, en Jokdeam, en Zanoah,", "Jer 16:4": "Zij zullen pijnlijke doden sterven, zij zullen niet beklaagd en niet begraven worden, zij zullen tot mest op de aardbodem zijn, en zij zullen door het zwaard en door de honger verteerd worden, en hun dode lichamen zullen voedsel zijn voor de vogels van de hemel en voor de dieren van de aarde.", "1 Kon 21:10": "En zet tegenover hem twee mannen, zonen van Belial, die tegen hem getuigen en zeggen: U hebt God en de koning gevloekt; en voer hem naar buiten, en stenig hem, dat hij sterft.", "2 Sam 17:29": "En honing, en boter, en schapen, en koeienkaas, brachten naar David, en naar het volk dat bij hem was, om te eten, want zij zeiden: Dit volk is hongerig, en moe, en dorstig in de woestijn.", "Job 31:17": "En mijn bete alleen gegeten heb, zodat de wees daarvan niet gegeten heeft;", "Luk 3:14": "En ook de soldaten vroegen hem: En wij, wat zullen wij doen? En hij zei tegen hen: Doe niemand geweld aan, en pers niemand af door bedrog, en wees tevreden met uw soldij.", "1 Sam 24:6": "Doch het gebeurde daarna, dat het hart van David hem sloeg, omdat hij de slip van Saul afgesneden had.", "1 Sam 22:2": "En bij hem verzamelden zich alle mannen die benauwd waren, en alle mannen die een schuldeiser hadden, en alle mannen wier ziel bitter bedroefd was, en hij werd hun aanvoerder; zodat er bij hem omtrent vierhonderd mannen waren.", "Dan 4:19": "Toen schrok Daniël, wiens naam Beltsazar is, ongeveer een uur lang, en zijn gedachten verontrustten hem. De koning antwoordde en zei: Beltsazar, laat de droom en zijn uitleg u niet verontrusten. Beltsazar antwoordde en zei: Mijn heer! De droom moge uw haters wedervaren, en zijn uitleg uw tegenstanders!", "Gen 18:4": "Laat er toch een beetje water gebracht worden, en was Uw voeten, en rust onder deze boom.", "1 Kon 18:19": "Nu dan, zend heen, verzamel bij mij heel Israël op de berg Karmel, en de vierhonderdvijftig profeten van Baäl, en de vierhonderd profeten van het bos, die van de tafel van Izebel eten.", "Ps 112:5": "Teth. Goed gaat het die man, die zich ontfermt en uitleent; Jod. hij regelt zijn zaken met recht.", "Richt 1:14": "En het gebeurde, toen zij bij hem kwam, dat zij hem aanspoorde om van haar vader een veld te vragen; en zij sprong van de ezel af; toen zei Kaleb tegen haar: Wat wilt u?", "2 Sam 24:13": "Zo kwam Gad bij David, en maakte het hem bekend, en zei tegen hem: Zal er een hongersnood van zeven jaar in uw land tot u komen? Of wilt u drie maanden vluchten voor uw vijanden, terwijl zij u achtervolgen? Of dat er drie dagen pestilentie in uw land is? Merk nu op, en zie toe, wat antwoord ik terug moet brengen aan Hem die mij gezonden heeft.", "Luk 16:22-28": "En het gebeurde dat de bedelaar stierf, en door de engelen gedragen werd in de schoot van Abraham; en de rijke stierf ook, en werd begraven. En toen hij in de hel zijn ogen ophief, terwijl hij in de pijn was, zag hij Abraham van verre, en Lazarus in zijn schoot. En hij riep en zei: Vader Abraham, ontferm u over mij, en zend Lazarus, dat hij het uiterste puntje van zijn vinger in het water dompelt, en mijn tong verkoelt; want ik lijd pijn in deze vlam.", "Matt 10:12": "En als u het huis ingaat, groet het dan.", "2 Kron 21:20": "Hij was tweeëndertig jaar oud toen hij koning werd, en regeerde acht jaar in Jeruzalem; en hij ging heen zonder dat men hem miste; en zij begroeven hem in de stad van David, maar niet in de graven van de koningen.", "Rom 12:19-21": "Wreek uzelf niet, geliefden, maar geef de toorn plaats; want er is geschreven: Mij komt de wraak toe; Ik zal het vergelden, zegt de Heere. Als dan uw vijand honger heeft, geef hem te eten; als hij dorst heeft, geef hem te drinken; want als u dat doet, zult u kolen van het vuur op zijn hoofd hopen. Word niet door het kwade overwonnen, maar overwin het kwade door het goede.", "2 Sam 22:48": "De God, Die mij volkomen wraak geeft, en de volken onder mij neerwerpt;", "Ps 37:10": "Vau. En nog een korte tijd, en de goddeloze zal er niet zijn; en u zult goed opletten op zijn plaats, maar hij zal er niet zijn.", "Spr 15:33": "De vreze van de HEERE is de tucht van de wijsheid; en de nederigheid gaat vooraf aan de eer.", "2 Sam 7:11": "En vanaf de dag dat Ik geboden heb richters te wezen over Mijn volk Israël. Toch heb Ik u rust gegeven van al uw vijanden. Ook maakt de HEERE u bekend, dat de HEERE u een huis maken zal.", "Job 15:21": "Het geluid van verschrikkingen is in zijn oren; in de vrede zelf komt de verwoester hem over.", "Job 18:14": "Zijn vertrouwen zal uit zijn tent uitgerukt worden; dat zal hem doen treden tot de koning der verschrikkingen.", "2 Kon 7:16": "Toen ging het volk naar buiten, en plunderde het leger van de Syriërs; en een maat meelbloem werd verkocht voor een sikkel, en twee maten gerst voor een sikkel, naar het woord van de HEERE.", "1 Tess 3:8": "want nu leven wij, als u vast staat in de Heere.", "1 Sam 18:20": "Doch Michal, de dochter van Saul, had David lief. Toen dat Saul te kennen werd gegeven, was die zaak goed in zijn ogen.", "1 Sam 24:9": "Daarna maakte David zich ook op, en ging uit de spelonk, en hij riep Saul achterna en zei: Mijn heer koning! Toen keek Saul achter zich om, en David boog zich met het gezicht ter aarde en boog zich neer.", "Kol 3:4": "Wanneer nu Christus geopenbaard zal zijn, Die ons leven is, dan zult ook u met Hem geopenbaard worden in heerlijkheid.", "Est 7:10": "Zo hingen zij Haman aan de galg, die hij voor Mordechai had laten maken; en de grimmigheid van de koning werd gestild.", "1 Kon 11:34": "Toch zal Ik niets van dit koninkrijk uit zijn hand nemen; maar Ik stel hem tot vorst al de dagen van zijn leven, omwille van Mijn dienaar David, die Ik verkozen heb, die Mijn geboden en Mijn inzettingen gehouden heeft.", "Ruth 2:10": "Toen viel zij op haar gezicht, en boog zich ter aarde, en zei tegen hem: Waarom heb ik genade gevonden in uw ogen, dat u mij kent, terwijl ik een vreemde ben?", "Luk 14:12": "En Hij zei ook tegen hem die Hem genodigd had: Wanneer u een middagmaal of avondmaal houdt, roep dan niet uw vrienden, of uw broers, of uw familie, of uw rijke buren; anders zouden zij u ook op hun beurt weer kunnen uitnodigen, en zou u vergelding gebeuren.", "Luk 16:19-25": "En er was een zeker rijk mens, en die was gekleed met purper en zeer fijn linnen, en leefde elke dag vrolijk en overvloedig. En er was een zekere bedelaar, met de naam Lazarus, die voor zijn poort lag, vol zweren; En hij verlangde verzadigd te worden van de kruimels die van de tafel van de rijke vielen; maar ook de honden kwamen en likten zijn zweren.", "Ezech 28:8": "Naar de groeve zullen zij u doen neerdalen; en u zult sterven de dood van een verslagene, in het hart van de zeeën.", "Ps 73:3": "Want ik was jaloers op de dwazen, toen ik de vrede van de goddelozen zag.", "1 Sam 26:9": "David zei daarentegen tegen Abisai: Breng hem niet om; want wie heeft ooit zijn hand tegen de gezalfde van de HEERE opgeheven en is onschuldig gebleven?", "Gen 44:4": "Zij waren de stad uitgegaan; zij waren nog niet ver gekomen, toen Jozef tegen degene die over zijn huis ging, zei: Maak u op en jaag deze mannen achterna; en als u hen zult hebben ingehaald, moet u tegen hen zeggen: Waarom hebt u kwaad met goed vergolden?", "1 Sam 13:14": "Maar nu zal uw koningschap niet blijven bestaan. De HEERE heeft Zich een man gezocht naar Zijn hart, en de HEERE heeft hem bevolen een voorganger te zijn over Zijn volk, omdat u niet gehouden hebt wat de HEERE u geboden had.", "Gen 19:2": "En hij zei: Zie toch, mijn heren! Keert u toch af naar het huis van uw knecht, en overnacht daar, en wast uw voeten; dan kunt u vroeg opstaan en verder gaan op uw weg. En zij zeiden: Nee, maar wij zullen op straat overnachten.", "Jak 1:20": "Want de toorn van de man werkt de gerechtigheid van God niet.", "Ex 3:1": "Mozes hoedde de kudde van Jethro, zijn schoonvader, de priester in Midian; en hij leidde de kudde tot voorbij de woestijn, en hij kwam aan de berg van God, aan Horeb.", "Hoogl 4:1": "Zie, u bent mooi, Mijn vriendin! Zie, u bent mooi; uw ogen zijn duivenogen tussen uw vlechten; uw haar is als een kudde geiten, die van de berg Gilead afscheren.", "Est 1:10": "Op de zevende dag, toen het hart van de koning vrolijk was van de wijn, zei hij tegen Mehuman, Biztha, Charbona, Bigtha en Abagtha, Zethar en Charchas, de zeven kamerlingen die dienden voor het aangezicht van de koning Ahasveros,", "Spr 31:26": "Pe. Zij doet haar mond open met wijsheid; en op haar tong is onderwijs van goedheid.", "1 Sam 11:11": "Het gebeurde nu de volgende dag, dat Saul het volk in drie groepen indeelde, en zij kwamen midden in het leger, tijdens de morgenwake, en zij versloegen Ammon, totdat de dag heet werd; en het gebeurde dat de overgeblevenen zo verstrooid werden, dat er onder hen geen twee samen bleven.", "2 Kron 28:15": "De mannen nu, die met naam genoemd zijn, stonden op en grepen de gevangenen, en kleedden van de roof allen die naakt onder hen waren; en zij kleedden hen, en gaven hun schoeisel, en gaven hun te eten en te drinken, en zalfden hen, en voerden allen die zwak waren op ezels, en brachten hen naar Jericho, de Palmstad, bij hun broeders; daarna keerden zij terug naar Samaria.", "Joh 13:4": "stond op van het avondmaal en legde Zijn kleren af, en nam een linnen doek en omgordde Zichzelf.", "Num 10:12": "En de kinderen van Israël trokken op naar hun tochten, uit de woestijn Sinaï; en de wolk bleef in de woestijn Paran.", "Spr 29:1": "Een man die, vaak bestraft, zijn nek verhardt, zal plotseling verbroken worden, zodat er geen genezing meer mogelijk is.", "1 Kon 21:21": "Zie, Ik zal kwaad over u brengen, en uw nakomelingen wegdoen; en Ik zal van Achab uitroeien wie mannelijk is, alsook wie in Israël afgesloten is en wie verlaten is.", "1 Sam 20:30": "Toen ontstak de toorn van Saul tegen Jonathan, en hij zei tegen hem: U, zoon van de verkeerde in weerspannigheid, weet ik het niet, dat u de zoon van Isaï verkozen hebt tot uw eigen schande, en tot schande van de naaktheid van uw moeder?", "2 Sam 5:2": "Ook al eerder, toen Saul koning over ons was, was u het die Israël uitleidde en terugbracht; ook heeft de HEERE tegen u gezegd: U zult Mijn volk Israël weiden, en u zult een leider zijn over Israël.", "Spr 9:9": "Leer de wijze, dan zal hij nog wijzer worden; onderwijs de rechtvaardige, dan zal hij toenemen in kennis.", "Ps 58:11": "De rechtvaardige zal zich verblijden, als hij de wraak aanschouwt; hij zal zijn voeten wassen in het bloed van de goddeloze.", "Ps 45:11": "Hoor, o Dochter! en zie, en neig uw oor; en vergeet uw volk en het huis van uw vader.", "1 Sam 24:18": "En hij zei tegen David: U bent rechtvaardiger dan ik; want u hebt mij goed vergolden, en ik heb u kwaad vergolden.", "1 Petr 3:9": "vergeld geen kwaad met kwaad, of schelden met schelden, maar zegen daarentegen; want u weet dat u daartoe geroepen bent, opdat u zegening zou beërven.", "Pred 2:3": "Ik heb in mijn hart nagespeurd om mijn vlees op te houden in de wijn, (en toch mijn hart leidend in wijsheid) en om de dwaasheid vast te houden, totdat ik zou zien wat voor de kinderen van de mensen het beste zou zijn om te doen onder de hemel, gedurende het aantal dagen van hun leven.", "Matt 10:16": "Zie, Ik zend u als schapen te midden van de wolven; wees dan voorzichtig zoals de slangen, en oprecht zoals de duiven.", "2 Sam 22:47-49": "De HEERE leeft, en geloofd zij mijn Rotssteen; en verhoogd zij God, de Rotssteen van mijn heil! De God, Die mij volkomen wraak geeft, en de volken onder mij neerwerpt; En Die mij uitvoert van mijn vijanden; en U verhoogt mij boven degenen die tegen mij opstaan; U redt mij van de man van het geweld.", "Ps 37:2": "Want als gras zullen zij snel worden afgesneden, en als het groene grasscheutje zullen zij afvallen.", "2 Sam 3:29": "Het moet blijven op het hoofd van Joab, en op heel het huis van zijn vader; en het mag van het huis van Joab niet ontbreken dat er iemand is die een vloed heeft, of melaats is, of zich aan de kruk moet vasthouden, of door het zwaard valt, of gebrek aan brood heeft!", "2 Sam 13:28": "Absalom nu gebood zijn knechten: Let er nu op, wanneer Amnons hart vrolijk is van de wijn, en ik tegen u zeg: Sla Amnon neer, dan zult u hem doden; wees niet bang; heb ik het u niet geboden? Wees sterk en wees dapper.", "Ps 73:7": "Hun ogen puilen uit van het vet; zij gaan de inbeeldingen van hun hart te boven.", "Ps 119:1-3": "Aleph. Gelukkig zijn de oprechten van wandel, die in de wet van de HEERE gaan. Gelukkig zijn zij, die Zijn getuigenissen onderhouden, die Hem van ganser harte zoeken; Ook geen onrecht werken, maar wandelen in Zijn wegen.", "2 Kron 17:11": "En van de Filistijnen brachten zij Josafat geschenken met het opgelegde geld; ook brachten de Arabieren hem klein vee, zevenduizend en zevenhonderd rammen, en zevenduizend en zevenhonderd bokken.", "2 Kon 2:2": "En Elia zei tegen Elisa: Blijf toch hier, want de HEERE heeft mij naar Beth-el gezonden. Maar Elisa zei: Zo waarachtig als de HEERE leeft en uw ziel leeft, ik zal u niet verlaten! Zo gingen zij af naar Beth-el.", "1 Tim 5:10": "Met getuigenis van goede werken: als zij kinderen opgevoed heeft, als zij gastvrij is geweest, als zij de voeten van de heiligen heeft gewassen, als zij verdrukten voldoende hulp heeft gegeven, als zij elk goed werk heeft nagestreefd."}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H8050\">En</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H8050\">Samuël</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H4191\">stierf</span>; <span class=\"wl\" data-l=\"L3\" data-code=\"H3605\">en</span> heel <span class=\"wl\" data-l=\"L4\" data-code=\"H3478\">Israël</span> verzamelde <span class=\"wl\" data-l=\"L5\" data-code=\"H6908\">zich</span>, <span class=\"wl\" data-l=\"L7\" data-code=\"H6912\">en</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H5594\">zij</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H5594\">bedreven</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H5594\">rouw</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H5594\">over</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H6912\">hem</span>, <span class=\"wl\" data-l=\"L6\" data-code=\"H5594\">en</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H6912\">begroeven</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H1004\">hem</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H1004\">in</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H1004\">zijn</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H1004\">huis</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H1004\">te</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H7414\">Rama</span>. <span class=
