l dan nu een koning over ons aan, om ons te richten, zoals alle volken *hebben*.","6":"Maar dit woord was kwaad in de ogen van Samuël, toen zij zeiden: Geef ons een koning, om ons te richten. En Samuël bad de HEERE aan.","7":"Doch de HEERE zei tegen Samuël: Hoor naar de stem van het volk in alles wat zij tegen u zeggen zullen; want zij hebben u niet verworpen, maar zij hebben Mij verworpen, dat Ik geen Koning over hen zal zijn.","8":"Naar de werken die zij gedaan hebben, vanaf de dag dat Ik hen uit Egypte geleid heb, tot op deze dag toe, en Mij hebben verlaten en andere goden gediend; zo doen zij u ook.","9":"Hoor dan nu naar hun stem; doch als u hen op het uiterste zult gewaarschuwd hebben, dan zult u hun de wijze van de koning bekendmaken, die over hen regeren zal.","10":"Samuël nu zei al de woorden van de HEERE aan het volk, dat een koning van hem begeerde.","11":"En hij zei: Dit zal de wijze van de koning zijn, die over u regeren zal: hij zal uw zonen nemen, en hen voor zichzelf aanstellen, voor zijn wagen en tot zijn ruiters, zodat zij voor zijn wagen uit zullen lopen;","12":"en hij zal hen voor zich aanstellen als leiders over duizend, en als leiders over vijftigtallen; en hij zal hen zijn akker laten ploegen, en zijn oogst laten oogsten, en zijn oorlogswapens laten maken, alsook zijn wagentuig.","13":"En uw dochters zal hij nemen tot apothekeressen, en tot keukenmeiden, en tot baksters.","14":"En uw akkers, en uw wijngaarden, en uw olijfgaarden, die het beste zijn, zal hij nemen, en aan zijn knechten geven.","15":"En van uw zaad en uw wijngaarden zal hij het tiende deel nemen, en dat aan zijn hovelingen en aan zijn knechten geven.","16":"En hij zal uw knechten, en uw dienstmeiden, en uw beste jongemannen, en uw ezels nemen, en hij zal zijn werk daarmee doen.","17":"Van uw kudden zal hij het tiende deel nemen; en u zult hem tot knechten zijn.","18":"U zult in die dag wel roepen, vanwege uw koning die u voor uzelf gekozen zult hebben, maar de HEERE zal u in die dag niet verhoren.","19":"Doch het volk weigerde naar Samuëls stem te horen; en zij zeiden: Nee, maar er zal een koning over ons zijn;","20":"en wij zullen ook zijn zoals alle volken; en onze koning zal ons richten, en hij zal voor ons uit gaan, en hij zal onze oorlogen voeren.","21":"Toen Samuël al de woorden van het volk gehoord had, sprak hij ze voor de oren van de HEERE.","22":"De HEERE nu zei tegen Samuël: Hoor naar hun stem, en stel hun een koning aan. Toen zei Samuël tegen de mannen van Israël: Gaat heen, ieder naar zijn stad."},"SV":{"1":"Het geschiedde nu, toen Samuël oud geworden was, zo stelde hij zijn zonen tot richters over Israël.","2":"De naam van zijn eerstgeborenen zoon nu was Joël, en de naam van zijn tweeden was Abia; zij waren richters te Ber-seba.","3":"Doch zijn zonen wandelden niet in zijn wegen; maar zij neigden zich tot de gierigheid, en namen geschenken, en bogen het recht.","4":"Toen vergaderden zich alle oudsten van Israël, en zij kwamen tot Samuël te Rama;","5":"En zij zeiden tot hem: Zie, gij zijt oud geworden, en uw zonen wandelen niet in uw wegen; zo zet nu een koning over ons, om ons te richten, gelijk al de volken *hebben*.","6":"Maar dit woord was kwaad in de ogen van Samuël, als zij zeiden: Geef ons een koning, om ons te richten. En Samuël bad den HEERE aan.","7":"Doch de HEERE zeide tot Samuël: Hoor naar de stem des volks in alles, wat zij tot u zeggen zullen; want zij hebben u niet verworpen, maar zij hebben Mij verworpen, dat Ik geen Koning over hen zal zijn.","8":"Naar de werken, die zij gedaan hebben, van dien dag af, toen Ik hen uit Egypte geleid heb, tot op dezen dag toe, en hebben Mij verlaten en andere goden gediend; alzo doen zij u ook.","9":"Hoor dan nu naar hun stem; doch als gij hen op het hoogste zult betuigd hebben, zo zult gij hen te kennen geven de wijze des konings, die over hen regeren zal.","10":"Samuël nu zeide al de woorden des HEEREN het volk aan, hetwelk een koning van hem begeerde.","11":"En zeide: Dit zal des konings wijze zijn, die over u regeren zal: hij zal uw zonen nemen, dat hij hen zich stelle tot zijn wagen, en tot zijn ruiteren, dat zij voor zijn wagen henen lopen;","12":"En dat hij hen zich stelle tot oversten der duizenden, en tot oversten der vijftigen; en dat zij zijn akker ploegen, en dat zij zijn oogst oogsten, en dat zij zijn krijgswapenen maken, mitsgaders zijn wagentuig.","13":"En uw dochteren zal hij nemen tot apothekeressen, en tot keukenmaagden, en tot baksters.","14":"En uw akkers, en uw wijngaarden, en uw olijfgaarden, die de beste zijn, zal hij nemen, en zal ze aan zijn knechten geven.","15":"En uw zaad, en uw wijngaarden zal hij vertienen, en hij zal ze aan zijn hovelingen, en aan zijn knechten geven.","16":"En hij zal uw knechten, en uw dienstmaagden, en uw beste jongelingen, en uw ezelen nemen, en hij zal zijn werk daarmede doen.","17":"Hij zal uw kudden vertienen; en gij zult hem tot knechten zijn.","18":"Gij zult wel te dien dage roepen, vanwege uw koning, dien gij u zult verkoren hebben, maar de HEERE zal u te dien dage niet verhoren.","19":"Doch het volk weigerde Samuëls stem te horen; en zij zeiden: Neen, maar er zal een koning over ons zijn.","20":"En wij zullen ook zijn gelijk al de volken; en onze koning zal ons richten, en hij zal voor onze aangezichten uitgaan, en hij zal onze krijgen voeren.","21":"Als Samuël al de woorden des volks gehoord had, zo sprak hij dezelve voor de oren des HEEREN.","22":"De HEERE nu zeide tot Samuël: Hoor naar hun stem, en stel hun een koning. Toen zeide Samuël tot de mannen van Israël: Gaat heen, een iegelijk naar zijn stad."},"KJV":{"1":"And it came to pass, when Samuel was old, that he made his sons judges over Israel.","2":"Now the name of his firstborn was Joel; and the name of his second, Abiah: they were judges in Beersheba.","3":"And his sons walked not in his ways, but turned aside after lucre, and took bribes, and perverted judgment.","4":"Then all the elders of Israel gathered themselves together, and came to Samuel unto Ramah,","5":"And said unto him, Behold, thou art old, and thy sons walk not in thy ways: now make us a king to judge us like all the nations.","6":"But the thing displeased Samuel, when they said, Give us a king to judge us. And Samuel prayed unto the LORD.","7":"And the LORD said unto Samuel, Hearken unto the voice of the people in all that they say unto thee: for they have not rejected thee, but they have rejected me, that I should not reign over them.","8":"According to all the works which they have done since the day that I brought them up out of Egypt even unto this day, wherewith they have forsaken me, and served other gods, so do they also unto thee.","9":"Now therefore hearken unto their voice: howbeit yet protest solemnly unto them, and shew them the manner of the king that shall reign over them.","10":"And Samuel told all the words of the LORD unto the people that asked of him a king.","11":"And he said, This will be the manner of the king that shall reign over you: He will take your sons, and appoint them for himself, for his chariots, and to be his horsemen; and some shall run before his chariots.","12":"And he will appoint him captains over thousands, and captains over fifties; and will set them to ear his ground, and to reap his harvest, and to make his instruments of war, and instruments of his chariots.","13":"And he will take your daughters to be confectionaries, and to be cooks, and to be bakers.","14":"And he will take your fields, and your vineyards, and your oliveyards, even the best of them, and give them to his servants.","15":"And he will take the tenth of your seed, and of your vineyards, and give to his officers, and to his servants.","16":"And he will take your menservants, and your maidservants, and your goodliest young men, and your asses, and put them to his work.","17":"He will take the tenth of your sheep: and ye shall be his servants.","18":"And ye shall cry out in that day because of your king which ye shall have chosen you; and the LORD will not hear you in that day.","19":"Nevertheless the people refused to obey the voice of Samuel; and they said, Nay; but we will have a king over us;","20":"That we also may be like all the nations; and that our king may judge us, and go out before us, and fight our battles.","21":"And Samuel heard all the words of the people, and he rehearsed them in the ears of the LORD.","22":"And the LORD said to Samuel, Hearken unto their voice, and make them a king. And Samuel said unto the men of Israel, Go ye every man unto his city."}},"tsk":{"1":[{"kopje":"aanstelde","refs":["Deut 16:18","Deut 16:19","Richt 8:22","Richt 8:23","2 Kron 19:5","2 Kron 19:6","Neh 7:2","1 Tim 5:21"]},{"kopje":"richters","refs":["Richt 5:10","Richt 10:4","Richt 12:14"]}],"2":[{"kopje":"Joël","refs":["1 Kron 6:28","1 Kron 6:38"]}],"3":[{"kopje":"zijn zonen","refs":["2 Sam 15:4","1 Kon 12:6-11","2 Kon 21:1-3","Pred 2:19","Jer 22:15-17"]},{"kopje":"maar neigden zich","refs":["Ex 18:21","Deut 16:19","Ps 15:5","Ps 26:10","Jes 33:15","1 Tim 3:3","1 Tim 6:10"]}],"4":[{"kopje":"de oudsten","refs":["Ex 3:16","Ex 24:1","2 Sam 5:3"]}],"5":[{"kopje":"stel dan nu","refs":["1 Sam 8:6-8","1 Sam 8:19","1 Sam 8:20","1 Sam 12:17","Num 23:9","Deut 17:14","Deut 17:15","Hos 13:10","Hos 13:11","Hand 13:21"]}],"6":[{"kopje":"kwaad","refs":["1 Sam 12:17"]},{"kopje":"bad","refs":["1 Sam 15:11","Ex 32:21","Ex 32:32","Num 16:15","Num 16:22","Num 16:46","Ezra 9:3-5","Ps 109:4","Luk 6:11","Luk 6:12","Fil 4:6","Jak 1:5"]}],"7":[{"kopje":"Hoor","refs":["Num 22:20","Ps 81:12","Ps 81:13","Jes 66:4","Hos 13:10","Hos 13:11"]},{"kopje":"zij hebben u niet","refs":["1 Sam 10:19","1 Sam 12:17-19","Ex 16:8","Matt 10:24","Matt 10:25","Matt 10:40","Luk 10:16","Luk 19:14","Luk 19:27","Joh 13:16","Joh 15:20","Joh 15:21"]}],"9":[{"kopje":"doch","refs":["Ezech 3:18"]},{"kopje":"de wijze","refs":["1 Sam 8:11-18","1 Sam 2:13","1 Sam 10:25","1 Sam 14:52","Ezech 45:7","Ezech 45:8","Ezech 46:18"]}],"11":[{"k heba.</span>","3":"And his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">walked</span> not in his <span class=\"wl wl-kjv\" data-code=\"H1870\">ways,</span> but turned <span class=\"wl wl-kjv\" data-code=\"H5186\">aside</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> <span class=\"wl wl-kjv\" data-code=\"H1215\">lucre,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H7810\">bribes,</span> and <span class=\"wl wl-kjv\" data-code=\"H5186\">perverted</span> <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment.</span>","4":"Then all the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> gathered themselves <span class=\"wl wl-kjv\" data-code=\"H6908\">together,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> unto <span class=\"wl wl-kjv\" data-code=\"H7414\">Ramah,</span>","5":"And <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Behold, thou art <span class=\"wl wl-kjv\" data-code=\"H2204\">old,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">walk</span> not in thy <span class=\"wl wl-kjv\" data-code=\"H1870\">ways:</span> now <span class=\"wl wl-kjv\" data-code=\"H7760\">make</span> us a <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> to <span class=\"wl wl-kjv\" data-code=\"H8199\">judge</span> us like all the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations.</span>","6":"But the <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> <span class=\"wl wl-kjv\" data-code=\"H3415\">displeased</span> <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel,</span> when they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">Give</span> us a <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> to <span class=\"wl wl-kjv\" data-code=\"H8199\">judge</span> us. And <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> <span class=\"wl wl-kjv\" data-code=\"H6419\">prayed</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","7":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel,</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">Hearken</span> unto the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> in all that they <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto thee: for they have not <span class=\"wl wl-kjv\" data-code=\"H3988\">rejected</span> thee, but they have <span class=\"wl wl-kjv\" data-code=\"H3988\">rejected</span> me, that I should not <span class=\"wl wl-kjv\" data-code=\"H4427\">reign</span> over them.","8":"According to all the <span class=\"wl wl-kjv\" data-code=\"H4639\">works</span> which they have <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> since the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that I brought them <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> out of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> even unto this <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> wherewith they have <span class=\"wl wl-kjv\" data-code=\"H5800\">forsaken</span> me, and <span class=\"wl wl-kjv\" data-code=\"H5647\">served</span> <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> <span class=\"wl wl-kjv\" data-code=\"H430\">gods,</span> so <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> they also unto thee.","9":"Now therefore <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> unto their <span class=\"wl wl-kjv\" data-code=\"H6963\">voice:</span> <span class=\"wl wl-kjv\" data-code=\"H389\">howbeit</span> yet <span class=\"wl wl-kjv\" data-code=\"H5749\">protest</span> <span class=\"wl wl-kjv\" data-code=\"H5749\">solemnly</span> unto them, and <span class=\"wl wl-kjv\" data-code=\"H5046\">shew</span> them the <span class=\"wl wl-kjv\" data-code=\"H4941\">manner</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> that shall <span class=\"wl wl-kjv\" data-code=\"H4427\">reign</span> over them.","10":"And <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">told</span> all the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that <span class=\"wl wl-kjv\" data-code=\"H7592\">asked</span> of him a <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span>","11":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> This will be the <span class=\"wl wl-kjv\" data-code=\"H4941\">manner</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> that shall <span class=\"wl wl-kjv\" data-code=\"H4427\">reign</span> over you: He will <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> your <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">appoint</span> them for himself, for his <span class=\"wl wl-kjv\" data-code=\"H4818\">chariots,</span> and to be his <span class=\"wl wl-kjv\" data-code=\"H6571\">horsemen;</span> and some shall <span class=\"wl wl-kjv\" data-code=\"H7323\">run</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> his <span class=\"wl wl-kjv\" data-code=\"H4818\">chariots.</span>","12":"And he will <span class=\"wl wl-kjv\" data-code=\"H7760\">appoint</span> him <span class=\"wl wl-kjv\" data-code=\"H8269\">captains</span> over <span class=\"wl wl-kjv\" data-code=\"H505\">thousands,</span> and <span class=\"wl wl-kjv\" data-code=\"H8269\">captains</span> over <span class=\"wl wl-kjv\" data-code=\"H2572\">fifties;</span> and will set them to <span class=\"wl wl-kjv\" data-code=\"H2790\">ear</span> his <span class=\"wl wl-kjv\" data-code=\"H2758\">ground,</span> and to <span class=\"wl wl-kjv\" data-code=\"H7114\">reap</span> his <span class=\"wl wl-kjv\" data-code=\"H7105\">harvest,</span> and to <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> his <span class=\"wl wl-kjv\" data-code=\"H3627\">instruments</span> of <span class=\"wl wl-kjv\" data-code=\"H4421\">war,</span> and <span class=\"wl wl-kjv\" data-code=\"H3627\">instruments</span> of his <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots.</span>","13":"And he will <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> your <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> to be <span class=\"wl wl-kjv\" data-code=\"H7548\">confectionaries,</span> and to be <span class=\"wl wl-kjv\" data-code=\"H2879\">cooks,</span> and to be <span class=\"wl wl-kjv\" data-code=\"H644\">bakers.</span>","14":"And he will <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> your <span class=\"wl wl-kjv\" data-code=\"H7704\">fields,</span> and your <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyards,</span> and your <span class=\"wl wl-kjv\" data-code=\"H2132\">oliveyards,</span> even the <span class=\"wl wl-kjv\" data-code=\"H2896\">best</span> of them, and <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> them to his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants.</span>","15":"And he will take the <span class=\"wl wl-kjv\" data-code=\"H6237\">tenth</span> of your <span class=\"wl wl-kjv\" data-code=\"H2233\">seed,</span> and of your <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyards,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> to his <span class=\"wl wl-kjv\" data-code=\"H5631\">officers,</span> and to his <span class=\"wl wl-kjv // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

function plaatsPopup(el, html) {
  popup.innerHTML = html;

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
function kopieerVers(n) {
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n})`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
}
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  kopieerVers(k.dataset.n);
});
// rechtermuisklik op een vers kopieert het (in plaats van het browser-contextmenu)
document.addEventListener('contextmenu', e => {
  const rij = e.target.closest('.vers');
  if (!rij || !rij.id.startsWith('v')) return;
  const n = rij.id.slice(1);
  if (!D.vertalingen.SVnu[n]) return;
  e.preventDefault();
  kopieerVers(n);
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

function concordantieHtml(data) {

  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // slug -> volledige boeknaam (voor citaten met de volle boeknaam i.p.v. de afkorting)
  const boeknaamPerSlug = {};
  (D.meta.boeken || []).forEach(b => {
    const m = b.href.match(/^\.\.\/\.\.\/([^/]+)\//);
    if (m) boeknaamPerSlug[m[1]] = b.naam;
  });
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const naam = boeknaamPerSlug[ref.slug] || chip.textContent.replace(/\s+\d+:\d+.*$/, '');
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${naam} ${ref.hfd}:${ref.vers}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
