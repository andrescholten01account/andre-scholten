4":"En de priester antwoordde David, en zei: Er is geen gewoon brood onder mijn hand; maar er is heilig brood, als de knechten zich tenminste van vrouwen onthouden hebben.","5":"David antwoordde de priester, en zei tegen hem: Ja zeker, de vrouwen zijn ons onthouden geweest, gisteren en eergisteren, toen ik uitging, en de spullen van de knechten zijn heilig; en het is *brood* dat op zekere manier gewoon is, temeer omdat er heden *ander* in de spullen geheiligd zal worden.","6":"Toen gaf de priester hem dat heilige *brood*, omdat er geen brood was dan de toonbroden, die van voor het aangezicht van de HEERE weggenomen waren, om er warm brood voor in de plaats te leggen, op de dag dat dat weggenomen werd.","7":"Daar was nu een man van de knechten van Saul, diezelfde dag opgehouden voor het aangezicht van de HEERE, en zijn naam was Doeg, een Edomiet, de machtigste onder de herders die Saul had.","8":"En David zei tegen Achimelech: Is hier onder uw hand geen speer of zwaard? Want ik heb mijn zwaard noch mijn wapens in mijn hand meegenomen, omdat de zaak van de koning haastig was.","9":"Toen zei de priester: Het zwaard van Goliath, de Filistijn, aan wie u sloeg in het eikendal, zie, dat is *hier*, gewikkeld in een kleed, achter de efod[1]; als u dat wilt nemen, neem het dan, want hier is geen ander dan dit. David nu zei: Er is niets zoals dat; geef het mij.","10":"En David stond op, en vluchtte diezelfde dag van het aangezicht van Saul weg; en hij kwam bij Achis, de koning van Gath.","11":"Doch de knechten van Achis zeiden tegen hem: Is dit niet David, de koning van het land? Zong men niet van hem in de reidansen, en zei: Saul heeft zijn duizenden verslagen, maar David zijn tienduizenden?","12":"En David nam deze woorden ter harte; en hij was zeer bevreesd voor het aangezicht van Achis, de koning van Gath.","13":"Daarom veranderde hij zijn gelaat voor hun ogen, en hij deed zichzelf gek voor onder hun handen; en hij krabbelde op de deuren van de poort, en hij liet zijn kwijl in zijn baard aflopen.","14":"Toen zei Achis tegen zijn knechten: Zie, u ziet dat de man razend is, waarom hebt u hem bij mij gebracht?","15":"Heb ik gebrek aan razenden, dat u deze gebracht hebt om voor mij te razen? Zal deze in mijn huis komen?"},"SV":{"1":"Toen kwam David te Nob, tot den priester Achimelech; en Achimelech kwam bevende David tegemoet, en hij zeide tot hem: Waarom zijt gij alleen, en geen man met u?","2":"En David zeide tot den priester Achimelech: De koning heeft mij een zaak bevolen, en zeide tot mij: Laat niemand iets van de zaak weten, om dewelke ik u gezonden heb, en die ik u geboden heb; den jongelingen nu heb ik de plaats van zulk een te kennen gegeven.","3":"En nu wat is er onder uw hand? Geef mij vijf broden in mijn hand, of wat er gevonden wordt.","4":"En de priester antwoordde David, en zeide: Er is geen gemeen brood onder mijn hand; maar er is heilig brood, wanneer zich de jongelingen slechts van de vrouwen onthouden hebben.","5":"David nu antwoordde den priester, en zeide tot hem: Ja trouwens, de vrouwen zijn ons onthouden geweest gisteren en eergisteren, toen ik uitging, en de vaten der jongelingen zijn heilig; en het is enigerwijze gemeen *brood*, te meer dewijl heden *ander* in de vaten zal geheiligd worden.","6":"Toen gaf de priester hem dat heilige *brood*, dewijl er geen brood was dan de toonbroden, die van voor het aangezicht des HEEREN weggenomen waren, dat men er warm brood leide, ten dage als dat weggenomen werd.","7":"Daar was nu een man van de knechten van Saul, te dienzelven dage opgehouden voor het aangezicht des HEEREN, en zijn naam was Doeg, een Edomiet, de machtigste onder de herderen, die Saul had.","8":"En David zeide tot Achimelech: Is hier onder uw hand geen spies of zwaard? Want ik heb noch mijn zwaard noch ook mijn wapenen in mijn hand genomen, dewijl de zaak des konings haastig was.","9":"Toen zeide de priester: Het zwaard van Goliath, den Filistijn, denwelken gij sloegt in het eikendal, zie, dat is *hier*, gewonden in een kleed, achter den efod; indien gij u dat nemen wilt, zo neem het, want hier is geen ander dan dit. David nu zeide: Er is zijns gelijke niet; geef het mij.","10":"En David maakte zich op, en vluchtte te dien dage van het aangezicht van Saul; en hij kwam tot Achis, den koning van Gath.","11":"Doch de knechten van Achis zeiden tot hem: Is deze niet David, de koning des lands? Zong men niet van dezen in de reien, zeggende: Saul heeft zijn duizenden verslagen, maar David zijn tienduizenden?","12":"En David leide deze woorden in zijn hart; en hij was zeer bevreesd voor het aangezicht van Achis, den koning van Gath.","13":"Daarom veranderde hij zijn gelaat voor hun ogen, en hij maakte zichzelven gek onder hun handen; en hij bekrabbelde de deuren der poort, en hij liet zijn zever in zijn baard aflopen.","14":"Toen zeide Achis tot zijn knechten: Ziet, gij ziet, dat de man razende is, waarom hebt gij hem tot mij gebracht?","15":"Heb ik razenden gebrek, dat gij dezen gebracht hebt, om voor mij te razen? Zal deze in mijn huis komen?"},"KJV":{"1":"Then came David to Nob to Ahimelech the priest: and Ahimelech was afraid at the meeting of David, and said unto him, Why art thou alone, and no man with thee?","2":"And David said unto Ahimelech the priest, The king hath commanded me a business, and hath said unto me, Let no man know any thing of the business whereabout I send thee, and what I have commanded thee: and I have appointed my servants to such and such a place.","3":"Now therefore what is under thine hand? give me five loaves of bread in mine hand, or what there is present.","4":"And the priest answered David, and said, There is no common bread under mine hand, but there is hallowed bread; if the young men have kept themselves at least from women.","5":"And David answered the priest, and said unto him, Of a truth women have been kept from us about these three days, since I came out, and the vessels of the young men are holy, and the bread is in a manner common, yea, though it were sanctified this day in the vessel.","6":"So the priest gave him hallowed bread: for there was no bread there but the shewbread, that was taken from before the LORD, to put hot bread in the day when it was taken away.","7":"Now a certain man of the servants of Saul was there that day, detained before the LORD; and his name was Doeg, an Edomite, the chiefest of the herdmen that belonged to Saul.","8":"And David said unto Ahimelech, And is there not here under thine hand spear or sword? for I have neither brought my sword nor my weapons with me, because the king's business required haste.","9":"And the priest said, The sword of Goliath the Philistine, whom thou slewest in the valley of Elah, behold, it is here wrapped in a cloth behind the ephod: if thou wilt take that, take it: for there is no other save that here. And David said, There is none like that; give it me.","10":"And David arose, and fled that day for fear of Saul, and went to Achish the king of Gath.","11":"And the servants of Achish said unto him, Is not this David the king of the land? did they not sing one to another of him in dances, saying, Saul hath slain his thousands, and David his ten thousands?","12":"And David laid up these words in his heart, and was sore afraid of Achish the king of Gath.","13":"And he changed his behaviour before them, and feigned himself mad in their hands, and scrabbled on the doors of the gate, and let his spittle fall down upon his beard.","14":"Then said Achish unto his servants, Lo, ye see the man is mad: wherefore then have ye brought him to me?","15":"Have I need of mad men, that ye have brought this fellow to play the mad man in my presence? shall this fellow come into my house?"}},"tsk":{"1":[{"kopje":"Nob","refs":["1 Sam 22:19","Neh 11:32","Jes 10:32"]},{"kopje":"bij de priester Achimelech","refs":["1 Sam 14:3","1 Sam 22:9-19","Mark 2:26"]},{"kopje":"bevend","refs":["1 Sam 16:4"]}],"2":[{"kopje":"De koning","refs":["1 Sam 19:17","1 Sam 22:22"," jv\" data-code=\"H3045\">appointed</span> my <span class=\"wl wl-kjv\" data-code=\"H5288\">servants</span> to <span class=\"wl wl-kjv\" data-code=\"H6423\">such</span> and <span class=\"wl wl-kjv\" data-code=\"H492\">such</span> a <span class=\"wl wl-kjv\" data-code=\"H4725\">place.</span>","3":"Now therefore what <span class=\"wl wl-kjv\" data-code=\"H3426\">is</span> under thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand?</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> me <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> loaves of <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> in mine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> or what there is <span class=\"wl wl-kjv\" data-code=\"H4672\">present.</span>","4":"And the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> There is no <span class=\"wl wl-kjv\" data-code=\"H2455\">common</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> under mine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> but there <span class=\"wl wl-kjv\" data-code=\"H3426\">is</span> <span class=\"wl wl-kjv\" data-code=\"H6944\">hallowed</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread;</span> if the young <span class=\"wl wl-kjv\" data-code=\"H5288\">men</span> have <span class=\"wl wl-kjv\" data-code=\"H8104\">kept</span> themselves at <span class=\"wl wl-kjv\" data-code=\"H389\">least</span> from <span class=\"wl wl-kjv\" data-code=\"H802\">women.</span>","5":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Of a <span class=\"wl wl-kjv\" data-code=\"H518\">truth</span> <span class=\"wl wl-kjv\" data-code=\"H802\">women</span> have been <span class=\"wl wl-kjv\" data-code=\"H6113\">kept</span> from us about these <span class=\"wl wl-kjv\" data-code=\"H8032\">three</span> <span class=\"wl wl-kjv\" data-code=\"H8543\">days,</span> since I came <span class=\"wl wl-kjv\" data-code=\"H3318\">out,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels</span> of the young <span class=\"wl wl-kjv\" data-code=\"H5288\">men</span> are <span class=\"wl wl-kjv\" data-code=\"H6944\">holy,</span> and the bread is in a <span class=\"wl wl-kjv\" data-code=\"H1870\">manner</span> <span class=\"wl wl-kjv\" data-code=\"H2455\">common,</span> yea, though it were <span class=\"wl wl-kjv\" data-code=\"H6942\">sanctified</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> in the <span class=\"wl wl-kjv\" data-code=\"H3627\">vessel.</span>","6":"So the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> him <span class=\"wl wl-kjv\" data-code=\"H6944\">hallowed</span> bread: for there was no <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> there but the <span class=\"wl wl-kjv\" data-code=\"H3899\">shewbread,</span> that was <span class=\"wl wl-kjv\" data-code=\"H5493\">taken</span> from <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> to <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> <span class=\"wl wl-kjv\" data-code=\"H2527\">hot</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> when it was taken <span class=\"wl wl-kjv\" data-code=\"H3947\">away.</span>","7":"Now a certain <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of the <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> of <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> was there that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> <span class=\"wl wl-kjv\" data-code=\"H6113\">detained</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> and his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> was <span class=\"wl wl-kjv\" data-code=\"H1673\">Doeg,</span> an <span class=\"wl wl-kjv\" data-code=\"H130\">Edomite,</span> the <span class=\"wl wl-kjv\" data-code=\"H47\">chiefest</span> of the <span class=\"wl wl-kjv\" data-code=\"H7462\">herdmen</span> that belonged to <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul.</span>","8":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H288\">Ahimelech,</span> And is <span class=\"wl wl-kjv\" data-code=\"H3426\">there</span> <span class=\"wl wl-kjv\" data-code=\"H371\">not</span> here under thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> <span class=\"wl wl-kjv\" data-code=\"H2595\">spear</span> or <span class=\"wl wl-kjv\" data-code=\"H2719\">sword?</span> for I have neither <span class=\"wl wl-kjv\" data-code=\"H3947\">brought</span> my <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> nor my <span class=\"wl wl-kjv\" data-code=\"H3627\">weapons</span> with <span class=\"wl wl-kjv\" data-code=\"H3027\">me,</span> because the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">business</span> <span class=\"wl wl-kjv\" data-code=\"H1961\">required</span> <span class=\"wl wl-kjv\" data-code=\"H5169\">haste.</span>","9":"And the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> The <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> of <span class=\"wl wl-kjv\" data-code=\"H1555\">Goliath</span> the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine,</span> whom thou <span class=\"wl wl-kjv\" data-code=\"H5221\">slewest</span> in the <span class=\"wl wl-kjv\" data-code=\"H6010\">valley</span> of <span class=\"wl wl-kjv\" data-code=\"H425\">Elah,</span> behold, it is here <span class=\"wl wl-kjv\" data-code=\"H3874\">wrapped</span> in a <span class=\"wl wl-kjv\" data-code=\"H8071\">cloth</span> <span class=\"wl wl-kjv\" data-code=\"H310\">behind</span> the <span class=\"wl wl-kjv\" data-code=\"H646\">ephod:</span> if thou wilt <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> that, <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> it: for there is no <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> <span class=\"wl wl-kjv\" data-code=\"H2108\">save</span> that <span class=\"wl wl-kjv\" data-code=\"H2088\">here.</span> And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> There is none like that; <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> it me.","10":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and <span class=\"wl wl-kjv\" data-code=\"H1272\">fled</span> that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> for <span class=\"wl wl-kjv\" data-code=\"H6440\">fear</span> of <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">went</span> to <span class=\"wl wl-kjv\" data-code=\"H397\">Achish</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H1661\">Gath.</span>","11":"And the <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> of <span class=\"wl wl-kjv\" data-code=\"H397\">Achish</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Is not this <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land?</span> did they not <span class=\"wl wl-kjv\" data-code=\"H6030\">sing</span> one to another of <span class=\"wl wl-kjv\" data-code=\"H2088\">him</span> in <span class=\"wl wl-kjv\" data-code=\"H4246\">dances,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> hath <span class=\"wl wl-kjv\" data-code=\"H5221\">slain</span> his <span class=\"wl wl-kjv\" data-code=\"H505\">thousands,</span> and <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> his ten <span class=\"wl wl-kjv\" data-code=\"H7233\">thousands?</span>","12":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> laid <span class=\"wl wl-kjv\" data-code=\"H7760\">up</span> these <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> in his <span class=\"wl wl-kjv\" data-code=\"H3824\">heart,</span> and was <span class=\"wl wl-kjv\" data-code=\"H3966\">sore</span> <span class=\"wl wl-kjv\" data-code=\"H3372\">afraid</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">of</span> <span class=\"wl wl-kjv\" data-code=\"H397\">Achish</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H1661\">Gath.</span>","13":"And he <span class=\"wl wl-kjv\" data-code=\"H8138\">changed</span> his <span class=\"wl wl-kjv\" data-code=\"H2940\">behaviour</span> <span class=\"wl wl-kjv\" data-code=\"H5869\">before</span> them, and feigned himself <span class=\"wl wl-kjv\" data-code=\"H1984\">mad</span> in their <span class=\"wl wl-kjv\" data-code=\"H3027\">hands,</span> and <span class=\"wl wl-kjv\" data-code=\"H8427\">scrabbled</span> on the <span class=\"wl wl-kjv\" data-code=\"H1817\">doors</span> of the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate,</span> and let his <span class=\"wl wl-kjv\" data-code=\"H7388\">spittle</span> fall <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> upon his <span class=\"wl wl-kjv\" data-code=\"H2206\">beard.</span>","14":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H397\">Achish</span> unto his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> Lo, ye <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> is <span class=\"wl wl-kjv\" data-code=\"H7696\">mad:</span> wherefore then have ye <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> him to me?","15":"Have I <span class=\"wl wl-kjv\" data-code=\"H2638\">need</span> of mad <span class=\"wl wl-kjv\" data-code=\"H7696\">men,</span> that ye have <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> this fellow to play the mad <span class=\"wl wl-kjv\" data-code=\"H7696\">man</span> in my presence? shall this fellow <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> into my <span class=\"wl wl-kjv\" data-code=\"H1004\">house?</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Nob,","tekst":"Dit was een priesterlijke stad, niet ver van Anathoth, in den stam Benjamins, 1Ki 2:26, Neh 11:32, waar te dezer tijd de ark des verbonds was. Hierdoor is het geschied, dat daar zoveel priesters bij elkander waren, gelijk verhaald wordt, 1Sa 22:18."},{"catchword":"kwam bevende David tegemoet,","tekst":"Hebreeuws, beefde David tegemoet. Vergelijk boven, 1Sa 13:7, en 1Sa 16:4."},{"catchword":"alleen,","tekst":"Mat 12:3-4, wordt vermeld van David en die met hem waren, van welken hier gezegd wordt dat David hun een zekere plaats te kennen gegeven had, alzo dat het schijnt, dat David alleen tot den priester gekomen is."}],"2":[{"catchword":"koning heeft mij een zaak bevolen,","tekst":"Dit is een leugen, uit menselijke zwakheid gesproten, om de rechte oorzaak zijner vlucht te bedekken. Zie Exo 1:19."},{"catchword":"den jongelingen","tekst":"Dat is, de mannen, die mij van den koning bijgevoegd zijn."},{"catchword":"zulk een te kennen gegeven","tekst":"Hebreeuws, Peloni Almoni. Zie Rth 4:1. Anders, op de plaats van N.N. bescheiden. Anders, op de plaats van een zo en zo genoemd."}],"3":[{"catchword":"wat is er onder uw hand?","tekst":"Te weten, van eetwaren."}],"4":[{"catchword":"gemeen brood","tekst":"Het woord gemeen wordt hier en elders gesteld tegen het woord heilig, of geheiligde"},{"catchword":"maar","tekst":"Hij spreekt van de toonbroden, die voor den Heere gesteld en alzo den Heere geheiligd werden, van welke niemand mocht eten dan alleen de priesters. Zie Exo 25:30, en Lev 24:5."},{"catchword":"heilig brood,","tekst":"Hebreeuws, brood der heiligheid; dat is, heilig brood, en alzo onder vs.5."},{"catchword":"de vrouwen","tekst":"Versta, van hun echte huisvrouwen, want hoewel het huwelijk eerlijk is bij allen, en een onbevlekt bed, Heb 13:4, nochtans, vanwege de zwakheid des mensen, vermengt zich lichtelijk de zonde hierin; daarom wil de Heere dat men op zekere voorvallende gelegenheid en tijden zich van de huwelijkse samenkomst zal onthouden. Zie 1Sa 19:15; 1Co 7:5."},{"catchword":"hebben","tekst":"Versta hierbij, zo zal ik u dat geven."}],"5":[{"catchword":"gisteren en eergisteren,","tekst":"David wil zeggen: Wij zijn drie dagen op de reis, en alzo van onze vrouwen afgescheiden geweest."},{"catchword":"de vaten","tekst":"Dat is, hun lichaam, klederen, en al wat zij op de reis medegenomen hebben. En heilig is hier te zeggen, niet ontreinigd door het aanroeren van iets onreins."},{"catchword":"enigerwijze","tekst":"Hebreeuws, en deze weg is onheilig, of gemeen. David wil zeggen, gij behoeft zo grote zwarigheid niet te maken van mij en die bij mij zijn van deze broden te eten te geven; want ofschoon die heilig zijn zolang zij op de tafel voor den Heere staan, nochtans dewijl gij die nu moet veranderen en wegnemen, [of, ze al weggenomen en veranderd zijn] en verse broden in de plaats leggen, [of, gelegd mogen zijn], zo zal hun heiligheid nu zodanig niet zijn als tevoren; zij zullen enigszins gemeen worden, omdat de priesters met hun huisgezinnen die zullen eten, daar zij tevoren, voor des Heeren aangezicht liggende, van niemand mochten gegeten worden. Daarom, naar den regel en wet der liefde, [die meer is dan de ceremoniën] zo mogen ook wel anderen in den tijd van nood en bij gebrek van andere spijs, daarvan eten; gelijk Christus deze wet heeft uitgelegd, Mat 12:4, Mat 12:7."},{"catchword":"vaten","tekst":"Van deze vaten zie Exo 25:29."}],"6":[{"catchword":"warm brood legde,","tekst":"Dat is, vers, nieuw-gebakken brood."},{"catchword":"dage als dat weggenomen werd","tekst":"Te weten, als de sabbatdag aankwam, gelijk er geboden wordt Lev 24:8."}],"7":[{"catchword":"opgehouden","tekst":"Of, zich opgesloten hebbende. Het zij vanwege den sabbat, op welken hij daar wilde rusten, of dat hij daar een tijdlang wilde blijven om te aanbidden, of om enige zijner beloften te volbrengen."},{"catchword":"voor het aangezicht des HEEREN,","tekst":"Te weten, in den tabernakel."},{"catchword":"Edomiet,","tekst":"Te weten, van geboorte, maar door aanneming der Israëlietische religie een Jodengenoot geworden. Anders, een Adomiet, dat is, van de stad Adama, gelegen in den stam Nafthali, Jos 19:36."}],"9":[{"catchword":"achter den efod;","tekst":"Alzo, dat het bij den efod in de tent bewaard en opgesloten lag. Anders, nadat hij [Achimelech] den efod aangedaan had, en den Heere raad gevraagd had. Zie 1Sa 22:10, 1Sa 22:13, 1Sa 22:15. Zie gelijke manier van spreken Gen 24:67, en Deu 24:20-21."}],"10":[{"catchword":"Achis,","tekst":"Deze koning wordt Psa 34:1 Abimelech genoemd, Achis was zijn eigen naam; maar Abimelech was een algemene naam van alle koningen der Filistijnen. Zie Gen 20, Gen 21, Gen 26."},{"catchword":"Gath","tekst":"In der Filistijnen land gelegen. Zie 1Sa 5:8, en 1Sa 17:4."}],"11":[{"catchword":"de koning des lands?","tekst":"Dat is gouverneur of regent van het Israëlietische land, die de dochter van koning Saul getrouwd heeft, en die na hem wel koning kon worden."}],"12":[{"catchword":"hij was zeer bevreesd","tekst":"Zie Psa 34."}],"13":[{"catchword":"zijn gelaat voor hun ogen,","tekst":"Hebreeuws, zijn smaak. Gelijk men aan den smaak verneemt of de spijs goed of kwaad, zuur of zoet is; alzo aan het gelaat of gebaren verneemt men of een man wijs of dwaas, vroom of kwaad is."},{"catchword":"onder hun handen;","tekst":"Dat is, als zij hem gevangen hadden en tot den koning leidden. Zie Psa 34, en Psa 56:1."},{"catchword":"hij bekrabbelde de deuren der poort,","tekst":"Anders, hij tekende aan de deuren der poorten; dat is, hij schilderde, of maakte enige schreefjes aan de deuren, alsof hij slecht of gek ware geweest."}],"15":[{"catchword":"voor mij te razen?","tekst":"Dat is, in mijn tegenwoordigheid."}]},"kanttekeningen_en":{"1":[{"catchword":"Then came David to Nob","tekst":"This was a City, pertaining to the Priests, not far from Anathoth, in the tribe of Benjamin, I Kings 2.26. Nehem.11.32. where at this time the Ark of the covenant was. Hence it came to pass&Atilde;&copy; that so many Priests were all together, as is related, chap.22.18."},{"catchword":"to Achimelech the Priest: and Achimelech came trembling to meet David","tekst":"Heb. trembled to meet David. Compare above c.13.17. & 16.4."},{"catchword":"and he said unto him, Why art thou alone","tekst":"Mat 12:3,4/ is mention made of David, and them that were with him: of whom it is said here, that David had made known to them some certain place: so that it seemeth that David came alone to the Priest and no man with thee?"}],"2":[{"catchword":"And David said unto Achimelech the Priest, The King hath commanded me a business, and said unto me, Let no man know any thing, of the business where about I have sent thee, and which i have commanded thee:","tekst":"This is a lie, proceeding from humane frailty, to conceal and hide the right cause of this flight. See Exo 1:19."},{"catchword":"now I have made known to the young men","tekst":"i.e. the men, which were added to me by the King"},{"catchword":"the place of such a one","tekst":"Heb. Peloni Almoni. See Ruth.4.11. Oth. on the place of one so and so called."}],"3":[{"catchword":"And now what","tekst":"viz. of eatable ware, or of things fit to be eaten is there under thine hand, give me five loaves in mine hand, or what there is found."}],"4":[{"catchword":"And the Priest answered David, and said, There is no common","tekst":"The word common is both here and elsewhere opposed to the word holy, or, hallowed"},{"catchword":"bread under mine hand: but there is holy bread","tekst":"Heb. bread of holinesse; i.e. holy bread: and so below vers.5. He speaketh here of the shew-bread loaves, here set before the Lord, and so hallowed unto the Lord, whereof no man might eat, but the Priests onely. See Exod. 25.30. and Levit. 24.5. when the young men have at least kept themselves from women. Understand it from their lawful wives; for although marriage be honourable in all, and an undefiled bed, Heb. 13.4. yet by reason of mens weakness, is sin easily mixed therewith, therefore the Lord requireth that at certain and occasional times and seasons people should abstain from marriage-copulation or coming together. See Exod. 19.15. I Cor. 7.5. Understand withal, then I will give thee that.]"}],"5":[{"catchword":"Now David answered the Priest, and said unto him, Yea of a truth verily, the women have been kept from us yesterday, and ere yesterday, when I went forth","tekst":"As if David should say, we have been three days on the journey, and consequently so long time separated from our wives"},{"catchword":"and the vessels of the young men","tekst":"i.e. their bodies, garments, and whatsoever they have taken along with the on the journey"},{"catchword":"are holy:","tekst":"Holy signifieth in this place, not defiled, or polluted by touching any unclean thing"},{"catchword":"the rather because (other) will be hallowed in the vessels","tekst":"Of these vessels, see Exod. 25.29."}],"6":[{"catchword":"Then the Priest gave him that holy (bread,) because there was no bread, but the shew-bread (loaves,) which were taken away from before the face of the LORD, that they might lay warm bread","tekst":"i.e. fresh, new-baked bread"},{"catchword":"there, in the day","tekst":"viz. when the Sabbath-day came, as is there commanded, Levit. 24.8. when that is taken away."}],"7":[{"catchword":"Now there was that same day a man of the servants of Saul deteined","tekst":"Or, having shut-up himself: Be it either in respect of the Sabbath, whereon he would rest there; or, because he would tarry there a while, for to worship; or, because he would perform some vow that he had made"},{"catchword":"before the face of the LORD","tekst":"viz. in the Tabernacle"},{"catchword":"and his name was Doeg, an Edomite:","tekst":"viz. by birth, but by receiving and embracing the Jewish Religion, become a Proselyte. Oth. an Adomite; i.e. of the City Adama, lying in the tribe of Naphthali; Jos. 19.36. the mightiest among the Shepheards, that Saul had."}],"9":[{"catchword":"Then said the Priest, The sword of Goliath the Philistine, whom thou smotest in the oak-valley, behold, that is (here) wrapt in a cloth, behind the Ephod","tekst":"So that it is kept and lockt up by, or with the Ephod in the Tent. Oth. after that the priest (Achimelech) had put on the Ephod, and had asked counsel of the Lord. See chap. 22.10, 13, 15. See the like phrase, Genes. 24.67. and Deut. 24.20,21. if thou will take that for thy self, take it, for here is no other but that: Then said David, There is none like it, give it me."}],"10":[{"catchword":"And David gat him up, and fled that day from the face of Saul: and he came to Achis","tekst":"This King is, Psal. 34.1. called Abimelech. Achis wsa his proper name, but abimelecch a name common to all the Kings of the Philistines. See Genes. 20. vers. 21.26."},{"catchword":"the King of Gath","tekst":"Lying in the Philistines Land; see I Sam. 5.8. and 17.1."}],"11":[{"catchword":"But the servants of /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const KJVKEY2AFK = {"Gen":"Gen","Exo":"Ex","Lev":"Lev","Num":"Num","Deu":"Deut","Jos":"Joz","Jdg":"Richt","Rth":"Ruth","1Sa":"1 Sam","2Sa":"2 Sam","1Ki":"1 Kon","2Ki":"2 Kon","1Ch":"1 Kron","2Ch":"2 Kron","Ezr":"Ezra","Neh":"Neh","Est":"Est","Job":"Job","Psa":"Ps","Pro":"Spr","Ecc":"Pred","Sng":"Hoogl","Isa":"Jes","Jer":"Jer","Lam":"Klaagl","Eze":"Ezech","Dan":"Dan","Hos":"Hos","Joe":"Joël","Amo":"Amos","Oba":"Obadja","Jon":"Jona","Mic":"Micha","Nah":"Nahum","Hab":"Hab","Zep":"Zef","Hag":"Hagg","Zec":"Zach","Mal":"Mal","Mat":"Matt","Mar":"Mark","Luk":"Luk","Jhn":"Joh","Act":"Hand","Rom":"Rom","1Co":"1 Kor","2Co":"2 Kor","Gal":"Gal","Eph":"Ef","Phl":"Fil","Col":"Kol","1Th":"1 Tess","2Th":"2 Tess","1Ti":"1 Tim","2Ti":"2 Tim","Tit":"Tit","Phm":"Filem","Heb":"Hebr","Jas":"Jak","1Pe":"1 Petr","2Pe":"2 Petr","1Jo":"1 Joh","2Jo":"2 Joh","3Jo":"3 Joh","Jde":"Judas","Rev":"Openb"};
const REF_RE = /\b(\d?[A-Za-z]{2,3})\s+(\d{1,3}):(\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek) => {
    const afk = KJVKEY2AFK[boek];
    return afk ? `<a class="refchip" data-ref="${heel.replace(boek, afk)}">${heel}</a>` : heel;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

document.addEventListener('click', e => {

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', vert: 'KJV',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
    const items = lijst.map((it, i) => {
      const nr = i + 1;
      const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
      if (kortCw) {
        const idx = brontekstHtml.indexOf(kortCw);
        if (idx !== -1) {
          brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
        }
      }
      const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
      return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
    }).join('');
    const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${brontekstBlok}${items}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
