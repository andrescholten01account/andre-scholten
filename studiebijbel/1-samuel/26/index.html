 werkelijk gekomen was.","5":"En David maakte zich op en kwam bij de plaats waar Saul zich gelegerd had, en David bekeek de plaats waar Saul lag, met Abner, de zoon van Ner, zijn legeraanvoerder. En Saul lag in de wagenburg, en het volk was rondom hem gelegerd.","6":"Toen antwoordde David en sprak tegen Achimelech, de Hethiet, en tegen Abisai, de zoon van Zeruja, de broer van Joab, en zei: Wie zal met mij naar Saul in het leger afgaan? Toen zei Abisai: Ik zal met u afgaan.","7":"Zo kwamen David en Abisai 's nachts bij het volk; en zie, Saul lag te slapen in de wagenburg, en zijn speer stak in de aarde bij zijn hoofdeinde, en Abner en het volk lagen rondom hem.","8":"Toen zei Abisai tegen David: God heeft vandaag uw vijand in uw hand gegeven; laat mij hem toch nu met de speer in één keer aan de grond spijkeren, en ik zal het hem geen tweede keer hoeven te doen.","9":"David zei daarentegen tegen Abisai: Breng hem niet om; want wie heeft ooit zijn hand tegen de gezalfde van de HEERE opgeheven en is onschuldig gebleven?","10":"Verder zei David: Zo waarachtig als de HEERE leeft, de HEERE zal hem slaan, of zijn dag zal komen dat hij zal sterven, of hij zal in een strijd trekken en daarin omkomen.","11":"De HEERE late het verre van mij zijn, dat ik mijn hand zou leggen aan de gezalfde van de HEERE! Neem toch nu de speer die bij zijn hoofdeinde ligt, en de waterfles, en laten we gaan.","12":"Zo nam David de speer en de waterfles van Sauls hoofdeinde, en zij gingen weg; en er was niemand die het zag, en niemand die het merkte, ook niemand die wakker werd; want zij sliepen allen, want er was een diepe slaap van de HEERE op hen gevallen.","13":"Toen David naar de overkant gegaan was, ging hij op de top van de berg staan, ver weg, zodat er een grote afstand tussen hen was.","14":"En David riep naar het volk en naar Abner, de zoon van Ner, en zei: Zult u niet antwoorden, Abner? Toen antwoordde Abner en zei: Wie bent u, die naar de koning roept?","15":"Toen zei David tegen Abner: Bent u niet een man, en wie is u gelijk in Israël? Waarom hebt u dan geen wacht gehouden over uw heer, de koning? Want er is iemand van het volk gekomen om de koning, uw heer, om te brengen.","16":"Deze zaak die u gedaan hebt, is niet goed; zo waarachtig als de HEERE leeft, u bent kinderen van de dood, omdat u geen wacht gehouden hebt over uw heer, de gezalfde van de HEERE! En nu, kijk waar de speer van de koning is, en de waterfles die bij zijn hoofdeinde was.","17":"Saul nu herkende de stem van David, en zei: Is dit uw stem, mijn zoon David? David zei: Het is mijn stem, mijn heer koning!","18":"Hij zei verder: Waarom vervolgt mijn heer zijn dienaar zo achterna? Want wat heb ik gedaan, en wat kwaad is er in mijn hand?","19":"En nu, laat mijn heer de koning toch luisteren naar de woorden van zijn dienaar. Als de HEERE u tegen mij opzet, laat Hem dan het spijsoffer ruiken; maar als het mensenkinderen zijn, dan zijn zij vervloekt voor het aangezicht van de HEERE, omdat zij mij vandaag verjaagd hebben, zodat ik niet vast verbonden kan blijven aan het erfdeel van de HEERE, en zeggen: Ga heen, dien andere goden.","20":"En nu, laat mijn bloed niet op de aarde vallen, ver van het aangezicht van de HEERE; want de koning van Israël is uitgegaan om een enkele vlo te zoeken, zoals men een veldhoen op de bergen najaagt.","21":"Toen zei Saul: Ik heb gezondigd; keer terug, mijn zoon David, want ik zal u geen kwaad meer doen, omdat mijn leven vandaag kostbaar geweest is in uw ogen; zie, ik heb dwaas gehandeld en ben zeer ernstig misgegaan.","22":"Toen antwoordde David en zei: Zie, de speer van de koning; laat een van de jongemannen overkomen en hem halen.","23":"De HEERE vergeldt aan ieder zijn rechtvaardigheid en zijn trouw; want de HEERE had u vandaag in mijn hand gegeven, maar ik heb mijn hand niet willen uitsteken tegen de gezalfde van de HEERE.","24":"En zie, zoals uw leven vandaag in mijn ogen groot geacht is geweest, zo mag mijn leven in de ogen van de HEERE groot geacht worden, en Hij verlost mij uit alle nood.","25":"Toen zei Saul tegen David: Gezegend bent u, mijn zoon David; u zult het zeker volbrengen, en u zult ook zeker de overhand hebben. Toen ging David zijns weegs, en Saul keerde terug naar zijn plaats."},"SV":{"1":"De Zifieten nu kwamen tot Saul te Gibea, zeggende: Houdt zich David niet verborgen op den heuvel van Hachila, voor aan de wildernis?","2":"Toen maakte zich Saul op, en toog af naar de woestijn Zif, en met hem drie duizend man, uitgelezenen van Israël, om David te zoeken in de woestijn Zif.","3":"En Saul legerde zich op den heuvel van Hachila, die voor aan de wildernis is aan den weg, maar David bleef in de woestijn, en zag, dat Saul achter hem kwam naar de woestijn.","4":"Want David had verspieders gezonden, en hij vernam, dat Saul voorzeker kwam.","5":"En David maakte zich op, en kwam aan de plaats, waar Saul zich gelegerd had, en David bezag de plaats, waar Saul lag, met Abner, den zoon van Ner, zijn krijgsoverste. En Saul lag in den wagenburg, en het volk was rondom hem gelegerd.","6":"Toen antwoordde David, en sprak tot Achimelech, den Hethiet, en tot Abisai, den zoon van Zeruja, den broeder van Joab, zeggende: Wie zal met mij tot Saul in het leger afgaan? Toen zeide Abisai: Ik zal met u afgaan.","7":"Alzo kwamen David en Abisai tot het volk des nachts; en ziet, Saul lag te slapen in den wagenburg, en zijn spies stak in de aarde aan zijn hoofdeinde, en Abner, en het volk lag rondom hem.","8":"Toen zeide Abisai tot David: God heeft heden uw vijand in uw hand besloten; laat mij toch hem nu met de spies op eenmaal ter aarde slaan, en ik zal het hem niet ten tweeden male doen.","9":"David daarentegen zeide tot Abisai: Verderf hem niet; want wie heeft zijn hand aan den gezalfde des HEEREN gelegd, en is onschuldig gebleven?","10":"Verder zeide David: *Zo* *waarachtig* *als* de HEERE leeft, maar de HEERE zal hem slaan, of zijn dag zal komen, dat hij zal sterven, of hij zal in een strijd trekken, dat hij omkome.","11":"De HEERE late het verre van mij zijn, dat ik mijn hand legge aan den gezalfde des HEEREN! zo neem toch nu de spies, die aan zijn hoofdeinde is, en de waterfles, en laat ons gaan.","12":"Zo nam David de spies en de waterfles van Sauls hoofdeinde, en zij gingen heen; en er was niemand, die het zag, en niemand, die het merkte, ook niemand, die ontwaakte; want zij sliepen allen; want er was een diepe slaap des HEEREN op hen gevallen.","13":"Toen David over aan gene zijde gekomen was, zo stond hij op de hoogte des bergs van verre, dat er een grote plaats tussen hen was.","14":"En David riep tot het volk, en tot Abner, den zoon van Ner, zeggende: Zult gij niet antwoorden, Abner? Toen antwoordde Abner en zeide: Wie zijt gij, die tot den koning roept?","15":"Toen zeide David tot Abner: Zijt gij niet een man, en wie is u gelijk in Israël? Waarom dan hebt gij over uw heer, den koning, geen wacht gehouden? Want daar is een van het volk gekomen, om den koning, uw heer, te verderven.","16":"Deze zaak, die gij gedaan hebt, is niet goed; *zo* *waarachtig* *als* de HEERE leeft, gijlieden zijt kinderen des doods, die over uw heer, den gezalfde des HEEREN, geen wacht gehouden hebt! En nu, zie, waar de spies des konings is, en de waterfles, die aan zijn hoofdeinde was.","17":"Saul nu kende de stem van David, en zeide: Is dit uw stem, mijn zoon David? David zeide: Het is mijn stem, mijn heer koning!","18":"Hij zeide verder: Waarom vervolgt mijn heer zijn knecht alzo achterna, want wat heb ik gedaan, en wat kwaad is er in mijn hand?","19":"En nu, mijn heer de koning hore toch naar de woorden zijns knechts. Indien de HEERE u tegen mij aanport, laat Hem het spijsoffer rieken; maar indien het mensenkinderen zijn, zo zijn zij vervloekt voor het aangezicht des HEEREN, dewijl zij mij heden verstoten, dat ik niet mag vastgehecht blijven in het erfdeel des HEEREN, zeggende: Ga heen, dien andere goden.","20":"En nu, mijn bloed valle niet op de aarde van voor het aangezicht des HEEREN; want de koning van Israël is uitgegaan om een enige vlo te zoeken, gelijk als men een veldhoen op de bergen najaagt.","21":"Toen zeide Saul: Ik heb gezondigd; keer weder, mijn zoon David, want ik zal u geen kwaad meer doen, voor dat mijn ziel dezen dag dierbaar in uw ogen geweest is; zie, ik heb dwaselijk gedaan, en ik heb zeer grotelijks gedwaald.","22":"Toen antwoordde David, en zeide: Zie, de spies des konings; zo laat een van de jongelingen overkomen, en halen ze.","23":"De HEERE dan vergelde aan een iegelijk zijn gerechtigheid en zijn getrouwheid; want de HEERE had u heden in *mijn* hand gegeven; maar ik heb mijn hand niet willen uitsteken, aan den gezalfde des HEEREN.","24":"En zie, gelijk als te dezen dage uw ziel in mijn ogen is groot geacht geweest, alzo zij mijn ziel in de ogen des HEEREN groot geacht, en Hij verlosse mij uit allen nood.","25":"Toen zeide Saul tot David: Gezegend zijt gij, mijn zoon David; gij zult het ja gewisselijk doen, en gij zult ook gewisselijk de overhand hebben. Toen ging David op zijn weg, en Saul keerde weder naar zijn plaats."},"KJV":{"1":"And the Ziphites came unto Saul to Gibeah, saying, Doth not David hide himself in the hill of Hachilah, which is before Jeshimon?","2":"Then Saul arose, and went down to the wilderness of Ziph, having three thousand chosen men of Israel with him, to seek David in the wilderness of Ziph.","3":"And Saul pitched in the hill of Hachilah, which is before Jeshimon, by the way. But David abode in the wilderness, and he saw that Saul came after him into the wilderness.","4":"David therefore sent out spies, and understood that Saul was come in very deed.","5":"And David arose, and came to the place where Saul had pitched: and David beheld the place where Saul lay, and Abner the son of Ner, the captain of his host: and Saul lay in the trench, and the people pitched round about him.","6":"Then answered David and said to Ahimelech the Hittite, and to Abishai the son of Zeruiah, brother to Joab, saying, Who will go down with me to Saul to the camp? And Abishai said, I will go down with thee.","7":"So David and Abishai came to the people by night: and, behold, Saul lay sleeping within the trench, and his spear stuck in the ground at his bolster: but Abner and the people lay round about him.","8":"Then said Abishai to David, God hath delivered thine enemy into thine hand this day: now therefore let me smite him, I pray thee, with the spear even to the earth at once, and I will not smite him the second time.","9":"And David said to Abishai, Destroy him not: for who can stretch forth his hand against the LORD'S anointed, and be guiltless?","10":"David said furthermore, As the LORD liveth, the LORD shall smite him; or his day shall come to die; or he shall descend into battle, and perish.","11":"The LORD forbid that I should stretch forth mine hand against the LORD'S anointed: but, I pray thee, take thou now the spear that is at his bolster, and the cruse of water, and let us go.","12":"So David took the spear and the cruse of water from Saul's bolster; and they gat them away, and no man saw it, nor knew it, neither awaked: for they were all asleep; because a deep sleep from the LORD was fallen upon them.","13":"Then David went over to the other side, and stood on the top of an hill afar off; a great space being between them:","14":"And David cried to the people, and to Abner the son of Ner, saying, Answerest thou not, Abner? Then Abner answered and said, Who art thou that criest to the king?","15":"And David said to Abner, Art not thou a valiant man? and who is like to thee in Israel? wherefore then hast thou not kept thy lord the king? for there came one of the people in to destroy the king thy lord.","16":"This thing is not good that thou hast done. As the LORD liveth, ye are worthy to die, because ye have not kept your master, the LORD'S anointed. And now see where the king's spear is, and the cruse of water that was at his bolster.","17":"And Saul knew David's voice, and said, Is this thy voice, my son David? And David said, It is my voice, my lord, O king.","18":"And he said, Wherefore doth my lord thus pursue after his servant? for what have I done? or what evil is in mine hand?","19":"Now therefore, I pray thee, let my lord the king hear the words of his servant. If the LORD have stirred thee up against me, let him accept an offering: but if they be the children of men, cursed be they before the LORD; for they have driven me out this day from abiding in the inheritance of the LORD, saying, Go, serve other gods.","20":"Now therefore, let not my blood fall to the earth before the face of the LORD: for the king of Israel is come out to seek a flea, as when one doth hunt a partridge in the mountains.","21":"Then said Saul, I have sinned: return, my son David: for I will no more do thee harm, because my soul was precious in thine eyes this day: behold, I have played the fool, and have erred exceedingly.","22":"And David answered and said, Behold the king's spear! and let one of the young men come over and fetch it.","23":"The LORD render to every man his righteousness and his faithfulness: for the LORD delivered thee into my hand to day, but I would not stretch forth mine hand against the LORD'S anointed.","24":"And, behold, as thy life was much set by this day in mine eyes, so let my life be much set by in the eyes of the LORD, and let him deliver me out of all tribulation.","25":"Then Saul said to David, Blessed be thou, my son David: thou shalt both do great things, and also shalt still prevail. So David went on his way, and Saul returned to his place."}},"tsk":{"1":[{"kopje":"Zifieten","refs":["Joz 15:24","Joz 15:55"]},{"kopje":"Houdt ... niet","refs":["1 Sam 26:3","1 Sam 23:19","Ps 54:3"]}],"2":[{"kopje":"maakte Saul zich op","refs":["1 Sam 23:23-25","1 Sam 24:18","Ps 38:13","Ps 140:5-10"]},{"kopje":"drieduizend","refs":["1 Sam 24:3"]}],"3":[{"kopje":"Hachila","refs":["1 Sam 26:1","1 Sam 23:19"]}],"5":[{"kopje":"Abner","refs":["1 > to the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> by <span class=\"wl wl-kjv\" data-code=\"H3915\">night:</span> and, behold, <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H7901\">lay</span> <span class=\"wl wl-kjv\" data-code=\"H3463\">sleeping</span> within the <span class=\"wl wl-kjv\" data-code=\"H4570\">trench,</span> and his <span class=\"wl wl-kjv\" data-code=\"H2595\">spear</span> <span class=\"wl wl-kjv\" data-code=\"H4600\">stuck</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">ground</span> at his <span class=\"wl wl-kjv\" data-code=\"H4763\">bolster:</span> but <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H7901\">lay</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> him.","8":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H52\">Abishai</span> to <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> hath <span class=\"wl wl-kjv\" data-code=\"H5462\">delivered</span> thine <span class=\"wl wl-kjv\" data-code=\"H341\">enemy</span> into thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day:</span> now therefore let me <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> him, I pray thee, with the <span class=\"wl wl-kjv\" data-code=\"H2595\">spear</span> even to the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> at <span class=\"wl wl-kjv\" data-code=\"H6471\">once,</span> and I will not smite him the second <span class=\"wl wl-kjv\" data-code=\"H8138\">time.</span>","9":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H52\">Abishai,</spa "wl wl-kjv\" data-code=\"H5369\">Ner,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">Answerest</span> thou not, <span class=\"wl wl-kjv\" data-code=\"H74\">Abner?</span> Then <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Who art thou that <span class=\"wl wl-kjv\" data-code=\"H7121\">criest</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king?</span>","15":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H74\">Abner,</span> Art not thou a valiant <span class=\"wl wl-kjv\" data-code=\"H376\">man?</span> and who is like to thee in <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel?</span> wherefore then hast thou not <span class=\"wl wl-kjv\" data-code=\"H8104\">kept</span> thy <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king?</span> for there <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> in to <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> thy <span class=\"wl wl-kjv\" data-code=\"H113\">lord.</span>","16":"This <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> is not <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> that thou hast <span class=\"wl wl-kjv\" data-code=\"H6213\">done.</span> As the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> ye are <span class=\"wl wl-kjv\" data-code=\"H1121\">worthy</span> to <span class=\"wl wl-kjv\" data-code=\"H4194\">die,</span> because ye have not <span class=\"wl wl-kjv\" data-code=\"H8104\">kept</span> your <span class=\"wl wl-kjv\" data-code=\"H113\">master,</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S</span> <span class=\"wl wl-kjv\" data-code=\"H4899\">anointed.</span> And now <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> where the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H2595\">spear</span> is, and the <span class=\"wl wl-kjv\" data-code=\"H6835\">cruse</span> of <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> that was at his <span class=\"wl wl-kjv\" data-code=\"H4763\">bolster.</span>","17":"And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H5234\">knew</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David's</span> <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Is this thy <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> my <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David?</span> And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> It is my <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> my <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> O <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span>","18":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Wherefore doth my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> thus <span class=\"wl wl-kjv\" data-code=\"H7291\">pursue</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> his <span class=\"wl wl-kjv\" data-code=\"H5650\">servant?</span> for what have I <span class=\"wl wl-kjv\" data-code=\"H6213\">done?</span> or what <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> is in mine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand?</span>","19":"Now therefore, I pray thee, let my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of his <span class=\"wl wl-kjv\" data-code=\"H5650\">servant.</span> If the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> have stirred thee <span class=\"wl wl-kjv\" data-code=\"H5496\">up</span> against me, let him <span class=\"wl wl-kjv\" data-code=\"H7306\">accept</span> an <span class=\"wl wl-kjv\" data-code=\"H4503\">offering:</span> but if they be the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">men,</span> <span class=\"wl wl-kjv\" data-code=\"H779\">cursed</span> be they <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> for they have <span class=\"wl wl-kjv\" data-code=\"H1644\">driven</span> me out this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> from <span class=\"wl wl-kjv\" data-code=\"H5596\">abiding</span> in the <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Go,</span> <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> <span class=\"wl wl-kjv\" data-code=\"H430\">gods.</span>","20":"Now therefore, let not my <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> to the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> before the <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> for the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> is come <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> to <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> <span class=\"wl wl-kjv\" data-code=\"H259\">a</span> <span class=\"wl wl-kjv\" data-code=\"H6550\">flea,</span> as when one doth <span class=\"wl wl-kjv\" data-code=\"H7291\">hunt</span> a <span class=\"wl wl-kjv\" data-code=\"H7124\">partridge</span> in the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains.</span>","21":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> I have <span class=\"wl wl-kjv\" data-code=\"H2398\">sinned:</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">return,</span> my <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David:</span> for I will no more do thee <span class=\"wl wl-kjv\" data-code=\"H7489\">harm,</span> because my <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> was <span class=\"wl wl-kjv\" data-code=\"H3365\">precious</span> in thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day:</span> behold, I have played the <span class=\"wl wl-kjv\" data-code=\"H5528\">fool,</span> and have <span class=\"wl wl-kjv\" data-code=\"H7686\">erred</span> <span class=\"wl wl-kjv\" data-code=\"H7235\">exceedingly.</span>","22":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Behold the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H2595\">spear!</span> and let <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of the young <span class=\"wl wl-kjv\" data-code=\"H5288\">men</span> come <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">fetch</span> it.","23":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">render</span> to every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> his <span class=\"wl wl-kjv\" data-code=\"H6666\">righteousness</span> and his <span class=\"wl wl-kjv\" data-code=\"H530\">faithfulness:</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> thee into my <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> to <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> but I <span class=\"wl wl-kjv\" data-code=\"H14\">would</span> not stretch <span class=\"wl wl-kjv\" data-code=\"H7971\">forth</span> mine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> against the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S</span> <span class=\"wl wl-kjv\" data-code=\"H4899\">anointed.</span>","24":"And, behold, as thy <span class=\"wl wl-kjv\" data-code=\"H5315\">life</span> was much set <span class=\"wl wl-kjv\" data-code=\"H1431\">by</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> in mine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> so let my <span class=\"wl wl-kjv\" data-code=\"H5315\">life</span> be much set <span class=\"wl wl-kjv\" data-code=\"H1431\">by</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and let him <span class=\"wl wl-kjv\" data-code=\"H5337\">deliver</span> me out of all <span class=\"wl wl-kjv\" data-code=\"H6869\">tribulation.</span>","25":"Then <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> <span class=\"wl wl-kjv\" data-code=\"H1288\">Blessed</span> be thou, my <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David:</span> thou shalt both <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">great</span> things, and also shalt <span class=\"wl wl-kjv\" data-code=\"H3201\">still</span> <span class=\"wl wl-kjv\" data-code=\"H3201\">prevail.</span> So <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> on his <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> and <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> to his <span class=\"wl wl-kjv\" data-code=\"H4725\">place.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Zifieten nu kwamen","tekst":"Dit is de tweede verraderij van de Zifieten; de eerste staat geschreven 1Sa 23:19."},{"catchword":"Houdt zich David niet verborgen","tekst":"Zij willen zeggen: Ja gewisselijk, hij is weder bij ons gekomen en verbergt zich op, enz."}],"5":[{"catchword":"in den wagenburg,","tekst":"Zie de aantekeningen boven, 1Sa 17:20."},{"catchword":"het volk was rondom hem gelegerd","tekst":"Anders, het krijgsvolk."}],"6":[{"catchword":"antwoordde David,","tekst":"Dat is, sprak, want er gaat geen vraag voor."},{"catchword":"Hethiet,","tekst":"Te weten, van afkomst, maar een Israëliet of Jodengenoot van religie. Eigenlijk worden Hethieten genoemd die van Heth, Kanaäns zoon, afkomstig waren. Zie Gen 10:15, en Gen 15:20."},{"catchword":"Zeruja,","tekst":"Deze was de zuster van David, zij heeft drie zonen gehad, te weten, Joab, Abisai en Asahel, die naar hun moeder genoemd worden de zonen van Zeruja, hier en 1Ch 2:16, vanwege de vermaardheid van David; maar van hun vader wordt geen gewag gemaakt."}],"7":[{"catchword":"het volk des nachts;","tekst":"Te weten, in het leger van Saul."}],"8":[{"catchword":"op eenmaal ter aarde slaan,","tekst":"Of, met een slag. Abisai wil zeggen: Ik zal hem met den eersten slag wel zo treffen, dat ik hem voorzeker zal doden, zodat het niet van node zal zijn hem ten tweeden male te slaan."}],"9":[{"catchword":"Verderf hem niet;","tekst":"Dat is, dood hem niet."},{"catchword":"den gezalfde des HEEREN gelegd,","tekst":"Zie boven, 1Sa 24:7, in de aantekeningen."},{"catchword":"onschuldig gebleven?","tekst":"Dat is ongestraft gebleven."}],"10":[{"catchword":"waarachtig als","tekst":"de HEERE leeft,] Versta hierop: Ik zal het niet toelaten."},{"catchword":"maar de HEERE zal hem slaan,","tekst":"David wil zeggen: Ik laat den Heere met hem doen zoals het Hem belieft; wat mij aangaat, ik wil de hand aan hem niet leggen."},{"catchword":"zijn dag zal komen,","tekst":"Dat is, de tijd, welken hem God gestemd of besteld heeft, dat hij zijn natuurlijken dood sterve. Zie Job 15:32."}],"11":[{"catchword":"dat ik mijn hand legge","tekst":"Hebreeuws, van mijn hand te leggen."}],"12":[{"catchword":"een diepe slaap","tekst":"Dat is, een zeer diepe slaap van God gezonden."}],"13":[{"catchword":"op de hoogte des bergs","tekst":"Hebreeuws, op het hoofd."}],"14":[{"catchword":"tot het volk,","tekst":"Te weten, tot Sauls krijgsvolk."},{"catchword":"die tot den koning roept?","tekst":"Abner wil zeggen: Die dus roept en tiert, dat gij zelfs den koning niet verschoont, maar hem mede uit zijn slaap opwekt."}],"15":[{"catchword":"Zijt gij niet een man,","tekst":"Deze vraag bevestigt, gelijk elders meer. Hij wil zeggen: Abner, gij zijt immers een dapper man, een held, kloek en moedig."},{"catchword":"wie is u gelijk in Israël?","tekst":"Alsof hij zeide: Niemand is u gelijk in dapperheid."}],"16":[{"catchword":"gijlieden zijt kinderen des doods,","tekst":"Dat is, gij hebt den dood verdiend."}],"18":[{"catchword":"zijn knecht alzo achterna,","tekst":"Dat is, mij."},{"catchword":"wat kwaad is er in mijn hand?","tekst":"Dat is, wat heb ik kwaads gedaan? Zie de aantekeningen boven, 1Sa 24:12."}],"19":[{"catchword":"aanport,","tekst":"Te weten, door zijn bevel of bijzondere beschikking."},{"catchword":"Hem het spijsoffer rieken;","tekst":"Of aldus: Hij zal het spijsoffer rieken, of Hij rieke het spijsoffer. Dit verstaan sommigen aldus: Indien God u dat bevolen heeft, zo zal uw spijsoffer hem aangenaam zijn. Anderen aldus: Zo zal ik den Heere door offerande verzoenen voor de zonde, met welke ik dat verdiend heb."},{"catchword":"vastgehecht blijven","tekst":"Dat is, dat ik niet steeds den godsdienst mag bijwonen, maar gedurig moet omzwerven van de ene plaats tot de andere."},{"catchword":"in het erfdeel des HEEREN,","tekst":"Dat is, bij het volk des Heeren, dat hem zo lief is als enig mens zijn erfgoed wezen kan."},{"catchword":"Ga heen,","tekst":"Dat is, zij bewegen mij, zoveel in hen is, van den waren godsdienst af te vallen tot de afgoderij der heidenen."}],"20":[{"catchword":"mijn bloed valle niet op de aarde","tekst":"Alsof hij zeide: De Heere, voor wiens aangezicht ik oprechtelijk wandel, wil u niet toelaten dat gij mijn bloed zoudt vergieten."},{"catchword":"van voor het aangezicht des HEEREN;","tekst":"Dat is, de Heere zie het en straffe het. Anders, voor het aangezicht des Heeren."}],"21":[{"catchword":"voor dat mijn ziel","tekst":"Dat is, omdat gij mij hebt verschoond en mij mijn leven niet hebt genomen, daar gij het wel hadt kunnen doen."}],"23":[{"catchword":"gerechtigheid en zijn getrouwheid;","tekst":"Dat is, naardat een iegelijk oprechtelijk gehandeld en trouw en geloof gehouden heeft."},{"catchword":"aan den gezalfde des HEEREN","tekst":"Dat is, aan u, die de gezalfde des Heeren zijt."}],"25":[{"catchword":"gij zult het ja gewisselijk doen,","tekst":"Hebreeuws, doende zult gij het doen, en vermogende zult gij vermogen"},{"catchword":"gij zult ook gewisselijk","tekst":"Dat is, zij zult uwen vijand te machtig vallen, en gij zult hen overweldigen. Anderen nemen het in dezen zin: Ga zo voort in al uw zaken met gerechtigheid en trouw, gelijk gij tegen mij doet, en twijfel niet, gij zult de overhand behouden en tot de koninklijke waardigheid komen."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"The Ziphites now came the second treachery of the first is described, chap. 23. 19.] Doth not David hide himself on the hill of Hachila, before the wilderness? [As if they should say, yea certainly he is come again to us, and hideth himself on, etc.]"}],"2":[{"catchword":null,"tekst":"Then Saul gat up, and went down to the wilderness of Ziph, and three thousand chosen men of Israel with him: to seek David in the wilderness of Ziph."}],"3":[{"catchword":null,"tekst":"And Saul camped himself on the hill of Hachila, which is before the wilderness by the way, but David abode in the wilderness, and saw that Saul came after him to the wilderness."}],"4":[{"catchword":null,"tekst":"For David had sent spies, and he understood that Saul came of a certain."}],"5":[{"catchword":null,"tekst":"And David gat up, and came to the place where Saul had camped himself, and David viewed the place where Saul lay, with Abner the so of Ner, the Commander of his host: and Saul lay in the trench, [See the annotate. Above chap. 17. 20.] and the people [Others the souldiers, men of war] were camped round about him."}],"6":[{"catchword":null,"tekst":"Then answered [i.e. spake, for there goeth no question before] David, and spake unto Achimeth the Hethite, [viz. By descent, but by Religion an Israelite or Proselite. They are properly called Hethites, that descended from Heth, the son of Canaan: See Genes. 10. 16. And 15. 20.] and to Abisai the son of Zeruja, [This was Davids sister, she had three sons, viz. Joab, Abisai, and Asahel, who from the mother are called the sons of Zeruja, here, and 1 Chron. 2. 16. In respect of David fame or renown: but no mention is made of their father] the brother of Joab, saying, who will go down with me to Saul into the Camp? Then said Abisai, I will go down with thee."}],"7":[{"catchword":null,"tekst":"Thus David ad Abisai came to the people [viz. In the camp of Saul] by night, and behold, Saul lay sleeping in the trench, and his spear stuck in the ground at his head-end, and Abner, and the people lay round about."}],"8":[{"catchword":null,"tekst":"Then said Abisai unto David: God hath shut up thine enemy in thine hand this day: let me now, I pray thee, smite him with the first] and I will not do it to him the second time. [As if he should say, I&acirc;&euro;&trade;le be sure so to hit him at the first blow, that I shall surely kill him out right, and shall not need to smite him the second time.]"}],"9":[{"catchword":null,"tekst":"David on the contrary said unto Abisai: Destroy him not: [i.e. do not kill him] for who hath laid his hand on the LORDS anointed, [See above chap. 24. 7. In the anotat.] and remained guiltless? [i.e. unpunished]"}],"10":[{"catchword":null,"tekst":"Moreover, David said, (As true as) the LORD liveth; [Understand withal, I will not suffer it] but the Lord do with him, what pleaseth him; as for me, I&acirc;&euro;&trade;le not lay my hand on him] or his day shall come, [i.e. the time that God hath limited and appointed him to die his natural death. See Job 15. On vers. 34.] or he shall into battle, that he may perish."}],"11":[{"catchword":null,"tekst":"The LORD let it be far from me, that I should lay mine hand [Heb. From laying mine hand.] on the LORDS anointed: take therefore now, I pray thee, the spear that is at his head-end, and the water bottle, and let us go."}],"12":[{"catchword":null,"tekst":"So David took the spear, and the water bottle from Saul&acirc;&euro;&trade;s head-end, and they went their way; and there was no man that saw it, and no man that heeded it, also no man that awaked, for they were all asleep, for there was a deep sleep of the LORD fallen upon them. [i.e. a deep sleep sent from God.]"}],"13":[{"catchword":null,"tekst":"When David was come over on the other side, then he stood on the top [Heb. On the head] of the mountain afar off: (so) that there was a great place (or space) between them."}],"14":[{"catchword":null,"tekst":"And David cried to the people, [viz. To Saul&acirc;&euro;&trade;s soldiers] and to Abner the son of Ner, saying, Wilt thou not answer, Abner? Then answered Abner, and said, Who art thou that criest to the King? [As if he should say, Who art thou, that thus criest, roarest, that thou even sparest not the King himself, but awakes him also out of his sleep?]"}],"15":[{"catchword":null,"tekst":"Then said David unto Abner, Art thou not a man? [This question affirmeth, as elsewhere besides. As if he should say, Abner, thou art indeed a stout man, a champion, valiant and courageous] and who is like to thee in Israel? [As if he had said, no man is like to thee in strength, and valour] wherefore then hast thou kept guard over thy Lord the King? For there came one of the people to destroy thy Lord the King."}],"16":[{"catchword":null,"tekst":"This thing which thou hast done is not good, (as true as) the LORD liveth ye are children of death, [i.e. ye have deserved death] who have not kept a guard over your Lord the kind: and now behold, where the Kings spear is, and the water-bottle, which was at his head-ed."}],"17":[{"catchword":null,"tekst":"Now Saul knew Davids voice, and said, Is this thy voice, my son David? David said, It is my voice, my Lord, (O) King."}],"18":[{"catchword":null,"tekst":"He said further, Wherefore doth my Lord thus pursue after his servant, [i.e. me] for what have I done ? what evil is there in mine hand? [i.e. what evil have I done. See the annotate. Above chap. 24. Vers. 12.]"}],"19":[{"catchword":null,"tekst":"And now, my Lord the King, hearken, I pray thee to the words of thy servant: if the LORD stir thee up against me [viz. By his command, or special ordering] let him smell the meat-offering. Some do understand this thus: If God hath commanded thee to do this, then he will accept thy meat offering. Others thus: then will I appease the Lord with sacrifice for the sin, whereb // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
