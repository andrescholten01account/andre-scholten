s", "href": "../../1-timotheus/1/"}, {"naam": "2 Timotheüs", "href": "../../2-timotheus/1/"}, {"naam": "Titus", "href": "../../titus/1/"}, {"naam": "Filemon", "href": "../../filemon/1/"}, {"naam": "Hebreeën", "href": "../../hebreeen/1/"}, {"naam": "Jakobus", "href": "../../jakobus/1/"}, {"naam": "1 Petrus", "href": "../../1-petrus/1/"}, {"naam": "2 Petrus", "href": "../../2-petrus/1/"}, {"naam": "1 Johannes", "href": "../../1-johannes/1/"}, {"naam": "2 Johannes", "href": "../../2-johannes/1/"}, {"naam": "3 Johannes", "href": "../../3-johannes/1/"}, {"naam": "Judas", "href": "../../judas/1/"}, {"naam": "Openbaring", "href": "../../openbaring/1/"}], "slugmap": {"Gen": "genesis", "Ex": "exodus", "Lev": "leviticus", "Num": "numeri", "Deut": "deuteronomium", "Joz": "jozua", "Richt": "richteren", "Ruth": "ruth", "1 Sam": "1-samuel", "2 Sam": "2-samuel", "1 Kon": "1-koningen", "2 Kon": "2-koningen", "1 Kron": "1-kronieken", "2 Kron": "2-kronieken", "Ezra": "ezra", "Neh": "nehemia", "Est": "esther", "Job": "job", "Ps": "psalmen", "Spr": "spreuken", "Pred": "prediker", "Hoogl": "hooglied", "Jes": "jesaja", "Jer": "jeremia", "Klaagl": "klaagliederen", "Ezech": "ezechiel", "Dan": "daniel", "Hos": "hosea", "Joël": "joel", "Amos": "amos", "Obadja": "obadja", "Jona": "jona", "Micha": "micha", "Nahum": "nahum", "Hab": "habakuk", "Zef": "zefanja", "Hagg": "haggai", "Zach": "zacharia", "Mal": "maleachi", "Matt": "mattheus", "Mark": "markus", "Luk": "lukas", "Joh": "johannes", "Hand": "handelingen", "Rom": "romeinen", "1 Kor": "1-korinthe", "2 Kor": "2-korinthe", "Gal": "galaten", "Ef": "efeze", "Fil": "filippenzen", "Kol": "kolossenzen", "1 Tess": "1-thessalonicenzen", "2 Tess": "2-thessalonicenzen", "1 Tim": "1-timotheus", "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "De Zifieten kwamen bij Saul in Gibea en zeiden: Houdt David zich niet verborgen op de heuvel van Hachila, tegenover de wildernis?", "2": "Toen maakte Saul zich op en trok af naar de woestijn Zif, met drieduizend man, uitgelezen mannen van Israël, om David te zoeken in de woestijn Zif.", "3": "En Saul legerde zich op de heuvel van Hachila, die tegenover de wildernis aan de weg ligt, maar David bleef in de woestijn, en zag dat Saul achter hem aan kwam naar de woestijn.", "4": "Want David had verspieders gezonden, en hij vernam dat Saul werkelijk gekomen was.", "5": "En David maakte zich op en kwam bij de plaats waar Saul zich gelegerd had, en David bekeek de plaats waar Saul lag, met Abner, de zoon van Ner, zijn legeraanvoerder. En Saul lag in de wagenburg, en het volk was rondom hem gelegerd.", "6": "Toen antwoordde David en sprak tegen Achimelech, de Hethiet, en tegen Abisai, de zoon van Zeruja, de broer van Joab, en zei: Wie zal met mij naar Saul in het leger afgaan? Toen zei Abisai: Ik zal met u afgaan.", "7": "Zo kwamen David en Abisai 's nachts bij het volk; en zie, Saul lag te slapen in de wagenburg, en zijn speer stak in de aarde bij zijn hoofdeinde, en Abner en het volk lagen rondom hem.", "8": "Toen zei Abisai tegen David: God heeft vandaag uw vijand in uw hand gegeven; laat mij hem toch nu met de speer in één keer aan de grond spijkeren, en ik zal het hem geen tweede keer hoeven te doen.", "9": "David zei daarentegen tegen Abisai: Breng hem niet om; want wie heeft ooit zijn hand tegen de gezalfde van de HEERE opgeheven en is onschuldig gebleven?", "10": "Verder zei David: Zo waarachtig als de HEERE leeft, de HEERE zal hem slaan, of zijn dag zal komen dat hij zal sterven, of hij zal in een strijd trekken en daarin omkomen.", "11": "De HEERE late het verre van mij zijn, dat ik mijn hand zou leggen aan de gezalfde van de HEERE! Neem toch nu de speer die bij zijn hoofdeinde ligt, en de waterfles, en laten we gaan.", "12": "Zo nam David de speer en de waterfles van Sauls hoofdeinde, en zij gingen weg; en er was niemand die het zag, en niemand die het merkte, ook niemand die wakker werd; want zij sliepen allen, want er was een diepe slaap van de HEERE op hen gevallen.", "13": "Toen David naar de overkant gegaan was, ging hij op de top van de berg staan, ver weg, zodat er een grote afstand tussen hen was.", "14": "En David riep naar het volk en naar Abner, de zoon van Ner, en zei: Zult u niet antwoorden, Abner? Toen antwoordde Abner en zei: Wie bent u, die naar de koning roept?", "15": "Toen zei David tegen Abner: Bent u niet een man, en wie is u gelijk in Israël? Waarom hebt u dan geen wacht gehouden over uw heer, de koning? Want er is iemand van het volk gekomen om de koning, uw heer, om te brengen.", "16": "Deze zaak die u gedaan hebt, is niet goed; zo waarachtig als de HEERE leeft, u bent kinderen van de dood, omdat u geen wacht gehouden hebt over uw heer, de gezalfde van de HEERE! En nu, kijk waar de speer van de koning is, en de waterfles die bij zijn hoofdeinde was.", "17": "Saul nu herkende de stem van David, en zei: Is dit uw stem, mijn zoon David? David zei: Het is mijn stem, mijn heer koning!", "18": "Hij zei verder: Waarom vervolgt mijn heer zijn dienaar zo achterna? Want wat heb ik gedaan, en wat kwaad is er in mijn hand?", "19": "En nu, laat mijn heer de koning toch luisteren naar de woorden van zijn dienaar. Als de HEERE u tegen mij opzet, laat Hem dan het spijsoffer ruiken; maar als het mensenkinderen zijn, dan zijn zij vervloekt voor het aangezicht van de HEERE, omdat zij mij vandaag verjaagd hebben, zodat ik niet vast verbonden kan blijven aan het erfdeel van de HEERE, en zeggen: Ga heen, dien andere goden.", "20": "En nu, laat mijn bloed niet op de aarde vallen, ver van het aangezicht van de HEERE; want de koning van Israël is uitgegaan om een enkele vlo te zoeken, zoals men een veldhoen op de bergen najaagt.", "21": "Toen zei Saul: Ik heb gezondigd; keer terug, mijn zoon David, want ik zal u geen kwaad meer doen, omdat mijn leven vandaag kostbaar geweest is in uw ogen; zie, ik heb dwaas gehandeld en ben zeer ernstig misgegaan.", "22": "Toen antwoordde David en zei: Zie, de speer van de koning; laat een van de jongemannen overkomen en hem halen.", "23": "De HEERE vergeldt aan ieder zijn rechtvaardigheid en zijn trouw; want de HEERE had u vandaag in mijn hand gegeven, maar ik heb mijn hand niet willen uitsteken tegen de gezalfde van de HEERE.", "24": "En zie, zoals uw leven vandaag in mijn ogen groot geacht is geweest, zo mag mijn leven in de ogen van de HEERE groot geacht worden, en Hij verlost mij uit alle nood.", "25": "Toen zei Saul tegen David: Gezegend bent u, mijn zoon David; u zult het zeker volbrengen, en u zult ook zeker de overhand hebben. Toen ging David zijns weegs, en Saul keerde terug naar zijn plaats."}, "SV": {"1": "De Zifieten nu kwamen tot Saul te Gibea, zeggende: Houdt zich David niet verborgen op den heuvel van Hachila, voor aan de wildernis?", "2": "Toen maakte zich Saul op, en toog af naar de woestijn Zif, en met hem drie duizend man, uitgelezenen van Israël, om David te zoeken in de woestijn Zif.", "3": "En Saul legerde zich op den heuvel van Hachila, die voor aan de wildernis is aan den weg, maar David bleef in de woestijn, en zag, dat Saul achter hem kwam naar de woestijn.", "4": "Want David had verspieders gezonden, en hij vernam, dat Saul voorzeker kwam.", "5": "En David maakte zich op, en kwam aan de plaats, waar Saul zich gelegerd had, en David bezag de plaats, waar Saul lag, met Abner, den zoon van Ner, zijn krijgsoverste. En Saul lag in den wagenburg, en het volk was rondom hem gelegerd.", "6": "Toen antwoordde David, en sprak tot Achimelech, den Hethiet, en tot Abisai, den zoon van Zeruja, den broeder van Joab, zeggende: Wie zal met mij tot Saul in het leger afgaan? Toen zeide Abisai: Ik zal met u afgaan.", "7": "Alzo kwamen David en Abisai tot het volk des nachts; en ziet, Saul lag te slapen in den wagenburg, en zijn spies stak in de aarde aan zijn hoofdeinde, en Abner, en het volk lag rondom hem.", "8": "Toen zeide Abisai tot David: God heeft heden uw vijand in uw hand besloten; laat mij toch hem nu met de spies op eenmaal ter aarde slaan, en ik zal het hem niet ten tweeden male doen.", "9": "David daarentegen zeide tot Abisai: Verderf hem niet; want wie heeft zijn hand aan den gezalfde des HEEREN gelegd, en is onschuldig gebleven?", "10": "Verder zeide David: *Zo* *waarachtig* *als* de HEERE leeft, maar de HEERE zal hem slaan, of zijn dag zal komen, dat hij zal sterven, of hij zal in een strijd trekken, dat hij omkome.", "11": "De HEERE late het verre van mij zijn, dat ik mijn hand legge aan den gezalfde des HEEREN! zo neem toch nu de spies, die aan zijn hoofdeinde is, en de waterfles, en laat ons gaan.", "12": "Zo nam David de spies en de waterfles van Sauls hoofdeinde, en zij gingen heen; en er was niemand, die het zag, en niemand, die het merkte, ook niemand, die ontwaakte; want zij sliepen allen; want er was een diepe slaap des HEEREN op hen gevallen.", "13": "Toen David over aan gene zijde gekomen was, zo stond hij op de hoogte des bergs van verre, dat er een grote plaats tussen hen was.", "14": "En David riep tot het volk, en tot Abner, den zoon van Ner, zeggende: Zult gij niet antwoorden, Abner? Toen antwoordde Abner en zeide: Wie zijt gij, die tot den koning roept?", "15": "Toen zeide David tot Abner: Zijt gij niet een man, en wie is u gelijk in Israël? Waarom dan hebt gij over uw heer, den koning, geen wacht gehouden? Want daar is een van het volk gekomen, om den koning, uw heer, te verderven.", "16": "Deze zaak, die gij gedaan hebt, is niet goed; *zo* *waarachtig* *als* de HEERE leeft, gijlieden zijt kinderen des doods, die over uw heer, den gezalfde des HEEREN, geen wacht gehouden hebt! En nu, zie, waar de spies des konings is, en de waterfles, die aan zijn hoofdeinde was.", "17": "Saul nu kende de stem van David, en zeide: Is dit uw stem, mijn zoon David? David zeide: Het is mijn stem, mijn heer koning!", "18": "Hij zeide verder: Waarom vervolgt mijn heer zijn knecht alzo achterna, want wat heb ik gedaan, en wat kwaad is er in mijn hand?", "19": "En nu, mijn heer de koning hore toch naar de woorden zijns knechts. Indien de HEERE u tegen mij aanport, laat Hem het spijsoffer rieken; maar indien het mensenkinderen zijn, zo zijn zij vervloekt voor het aangezicht des HEEREN, dewijl zij mij heden verstoten, dat ik niet mag vastgehecht blijven in het erfdeel des HEEREN, zeggende: Ga heen, dien andere goden.", "20": "En nu, mijn bloed valle niet op de aarde van voor het aangezicht des HEEREN; want de koning van Israël is uitgegaan om een enige vlo te zoeken, gelijk als men een veldhoen op de bergen najaagt.", "21": "Toen zeide Saul: Ik heb gezondigd; keer weder, mijn zoon David, want ik zal u geen kwaad meer doen, voor dat mijn ziel dezen dag dierbaar in uw ogen geweest is; zie, ik heb dwaselijk gedaan, en ik heb zeer grotelijks gedwaald.", "22": "Toen antwoordde David, en zeide: Zie, de spies des konings; zo laat een van de jongelingen overkomen, en halen ze.", "23": "De HEERE dan vergelde aan een iegelijk zijn gerechtigheid en zijn getrouwheid; want de HEERE had u heden in *mijn* hand gegeven; maar ik heb mijn hand niet willen uitsteken, aan den gezalfde des HEEREN.", "24": "En zie, gelijk als te dezen dage uw ziel in mijn ogen is groot geacht geweest, alzo zij mijn ziel in de ogen des HEEREN groot geacht, en Hij verlosse mij uit allen nood.", "25": "Toen zeide Saul tot David: Gezegend zijt gij, mijn zoon David; gij zult het ja gewisselijk doen, en gij zult ook gewisselijk de overhand hebben. Toen ging David op zijn weg, en Saul keerde weder naar zijn plaats."}, "KJV": {"1": "And the Ziphites came unto Saul to Gibeah, saying, Doth not David hide himself in the hill of Hachilah, which is before Jeshimon?", "2": "Then Saul arose, and went down to the wilderness of Ziph, having three thousand chosen men of Israel with him, to seek David in the wilderness of Ziph.", "3": "And Saul pitched in the hill of Hachilah, which is before Jeshimon, by the way. But David abode in the wilderness, and he saw that Saul came after him into the wilderness.", "4": "David therefore sent out spies, and understood that Saul was come in very deed.", "5": "And David arose, and came to the place where Saul had pitched: and David beheld the place where Saul lay, and Abner the son of Ner, the captain of his host: and Saul lay in the trench, and the people pitched round about him.", "6": "Then answered David and said to Ahimelech the Hittite, and to Abishai the son of Zeruiah, brother to Joab, saying, Who will go down with me to Saul to the camp? And Abishai said, I will go down with thee.", "7": "So David and Abishai came to the people by night: and, behold, Saul lay sleeping within the trench, and his spear stuck in the ground at his bolster: but Abner and the people lay round about him.", "8": "Then said Abishai to David, God hath delivered thine enemy into thine hand this day: now therefore let me smite him, I pray thee, with the spear even to the earth at once, and I will not smite him the second time.", "9": "And David said to Abishai, Destroy him not: for who can stretch forth his hand against the LORD'S anointed, and be guiltless?", "10": "David said furthermore, As the LORD liveth, the LORD shall smite him; or his day shall come to die; or he shall descend into battle, and perish.", "11": "The LORD forbid that I should stretch forth mine hand against the LORD'S anointed: but, I pray thee, take thou now the spear that is at his bolster, and the cruse of water, and let us go.", "12": "So David took the spear and the cruse of water from Saul's bolster; and they gat them away, and no man saw it, nor knew it, neither awaked: for they were all asleep; because a deep sleep from the LORD was fallen upon them.", "13": "Then David went over to the other side, and stood on the top of an hill afar off; a great space being between them:", "14": "And David cried to the people, and to Abner the son of Ner, saying, Answerest thou not, Abner? Then Abner answered and said, Who art thou that criest to the king?", "15": "And David said to Abner, Art not thou a valiant man? and who is like to thee in Israel? wherefore then hast thou not kept thy lord the king? for there came one of the people in to destroy the king thy lord.", "16": "This thing is not good that thou hast done. As the LORD liveth, ye are worthy to die, because ye have not kept your master, the LORD'S anointed. And now see where the king's spear is, and the cruse of water that was at his bolster.", "17": "And Saul knew David's voice, and said, Is this thy voice, my son David? And David said, It is my voice, my lord, O king.", "18": "And he said, Wherefore doth my lord thus pursue after his servant? for what have I done? or what evil is in mine hand?", "19": "Now therefore, I pray thee, let my lord the king hear the words of his servant. If the LORD have stirred thee up against me, let him accept an offering: but if they be the children of men, cursed be they before the LORD; for they have driven me out this day from abiding in the inheritance of the LORD, saying, Go, serve other gods.", "20": "Now therefore, let not my blood fall to the earth before the face of the LORD: for the king of Israel is come out to seek a flea, as when one doth hunt a partridge in the mountains.", "21": "Then said Saul, I have sinned: return, my son David: for I will no more do thee harm, because my soul was precious in thine eyes this day: behold, I have played the fool, and have erred exceedingly.", "22": "And David answered and said, Behold the king's spear! and let one of the young men come over and fetch it.", "23": "The LORD render to every man his righteousness and his faithfulness: for the LORD delivered thee into my hand to day, but I would not stretch forth mine hand against the LORD'S anointed.", "24": "And, behold, as thy life was much ", "refs": [{"disp": "1 Sam 24:10-12", "href": "../../1-samuel/24/#v11", "ref": "1 Sam 24:11-13", "svLabel": "SV 11"}, {"disp": "1 Sam 26:9", "href": "../../1-samuel/26/#v9", "ref": "1 Sam 26:9", "svLabel": null}, {"disp": "1 Sam 26:23", "href": "../../1-samuel/26/#v23", "ref": "1 Sam 26:23", "svLabel": null}, {"disp": "2 Sam 1:14-17", "href": "../../2-samuel/1/#v14", "ref": "2 Sam 1:14-17", "svLabel": null}], "kinderen": []}]}]}], "torrey": [{"topic": "Faithfulness", "href": "../../torrey/f/#t-faithfulness", "kinderen": [{"label": "Blessedness of", "href": "../../torrey/f/?hl=1Sam.26.23#i6163", "refs": [{"disp": "1 Sam 26:23", "href": "../../1-samuel/26/#v23", "ref": "1 Sam 26:23", "svLabel": null}, {"disp": "Spr 28:20", "href": "../../spreuken/28/#v20", "ref": "Spr 28:20", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"2 Sam 19:21": "Toen antwoordde Abisai, de zoon van Zeruja, en zei: Zou Simeï hiervoor niet gedood moeten worden? Hij heeft toch de gezalfde van de HEERE vervloekt?", "Ps 49:9": "(want de verlossing van hun ziel is te kostbaar, en zal voor eeuwig ophouden);", "2 Kor 1:9": "Ja, wij hadden zelf al in onszelf het vonnis van de dood, opdat wij niet op onszelf zouden vertrouwen, maar op God, Die de doden opwekt;", "Gen 2:21": "Toen deed de HEERE God een diepe slaap op Adam vallen, en hij sliep; en Hij nam een van zijn ribben, en sloot de plaats daarvan toe met vlees.", "2 Sam 2:18": "Nu waren daar drie zonen van Zeruja, Joab, en Abisai en Asahel; en Asahel was licht op zijn voeten, als een van de reeën die in het veld zijn.", "1 Sam 14:51": "En Kis was Sauls vader, en Ner, Abners vader, was een zoon van Abiël.", "Deut 32:30": "Hoe zou één duizend achtervolgen, en twee tienduizend doen vluchten, als niet hun Rotssteen hen verkocht had, en de HEERE hen overgeleverd had?", "1 Sam 24:8": "En David hield zijn mannen met woorden tegen, en liet hun niet toe dat zij opstonden tegen Saul. En Saul maakte zich op uit de spelonk, en ging op de weg.", "2 Sam 14:16": "Want de koning zal horen, om zijn dienares te redden uit de hand van de man, die van plan is mij en mijn zoon samen uit het erfdeel van God weg te vagen.", "Gal 3:22": "Maar de Schrift heeft alles onder de zonde gesloten, opdat de belofte uit het geloof van Jezus Christus aan de gelovigen gegeven zou worden.", "Ps 94:2": "Gij, Rechter der aarde! Verhef U; breng vergelding weer over de hoogmoedigen.", "Jes 54:17": "Elk instrument dat tegen u gemaakt wordt, zal niet gelukken, en elke tong, die in het gericht tegen u opstaat, zult u verdoemen; dit is het erfdeel van de knechten van de HEERE, en hun gerechtigheid is uit Mij, spreekt de HEERE.", "Ps 144:2": "Mijn Goedertierenheid en mijn Burg, mijn Hoog Vertrek en mijn Bevrijder voor mij, mijn Schild, en op Wie ik vertrouw; Die mijn volk aan mij onderwerpt!", "Ps 42:2": "Zoals een hert schreeuwt naar de waterstromen, zo schreeuwt mijn ziel tot U, o God!", "1 Sam 24:15": "Achter wie is de koning van Israël uitgetrokken? Wie jaagt u na? Een dode hond, een enkele vlo!", "Joh 8:46": "Wie van u overtuigt Mij van zonde? En als Ik de waarheid zeg, waarom gelooft u Mij dan niet?", "1 Sam 24:7-11": "En hij zei tegen zijn mannen: Laat het ver van mij zijn bij de HEERE, dat ik deze zaak zou doen aan mijn heer, de gezalfde van de HEERE, dat ik mijn hand tegen hem uit zou steken; want hij is de gezalfde van de HEERE! En David hield zijn mannen met woorden tegen, en liet hun niet toe dat zij opstonden tegen Saul. En Saul maakte zich op uit de spelonk, en ging op de weg. Daarna maakte David zich ook op, en ging uit de spelonk, en hij riep Saul achterna en zei: Mijn heer koning! Toen keek Saul achter zich om, en David boog zich met het gezicht ter aarde en boog zich neer.", "1 Sam 23:14": "David nu bleef in de woestijn, in de vestingen, en hij bleef op de berg in de woestijn Zif; en Saul zocht hem elke dag, maar God gaf hem niet over in zijn hand.", "1 Sam 14:6": "Jonathan nu zei tegen de jongen die zijn wapens droeg: Kom, laten we naar de bezetting van deze onbesnedenen oversteken; misschien zal de HEERE voor ons werken, want bij de HEERE is geen belemmering om te verlossen door velen of door weinigen.", "1 Sam 24:11": "Zie, op deze dag hebben uw ogen gezien dat de HEERE u heden in mijn hand gegeven heeft in deze spelonk, en men zei dat ik u doden zou; doch mijn hand spaarde u, want ik zei: Ik zal mijn hand niet uitsteken tegen mijn heer, want hij is de gezalfde van de HEERE.", "1 Sam 26:7-12": "Zo kwamen David en Abisai 's nachts bij het volk; en zie, Saul lag te slapen in de wagenburg, en zijn speer stak in de aarde bij zijn hoofdeinde, en Abner en het volk lagen rondom hem. Toen zei Abisai tegen David: God heeft vandaag uw vijand in uw hand gegeven; laat mij hem toch nu met de speer in één keer aan de grond spijkeren, en ik zal het hem geen tweede keer hoeven te doen. David zei daarentegen tegen Abisai: Breng hem niet om; want wie heeft ooit zijn hand tegen de gezalfde van de HEERE opgeheven en is onschuldig gebleven?", "1 Kon 14:3": "En neem in uw hand tien broden, en koeken, en een kruik honing, en ga naar hem toe; hij zal u vertellen wat er met deze jongen gebeuren zal.", "Gen 8:21": "En de HEERE rook die liefelijke reuk, en de HEERE zei in Zijn hart: Ik zal voortaan de aardbodem niet meer vervloeken om de mens; want het gedichtsel van het hart van de mens is slecht van zijn jeugd aan; en Ik zal voortaan niet meer al het levende slaan, zoals Ik gedaan heb.", "Mark 14:13": "En Hij stuurde twee van Zijn discipelen uit, en zei tegen hen: Ga de stad in, en er zal u een man tegemoetkomen die een kruik water draagt; volg hem;", "1 Sam 24:17": "En het gebeurde, toen David geëindigd had al deze woorden tegen Saul te spreken, dat Saul zei: Is dit uw stem, mijn zoon David? Toen verhief Saul zijn stem en weende.", "2 Sam 2:8-12": "Abner nu, de zoon van Ner, de legeraanvoerder die Saul gehad had, nam Isboseth, Sauls zoon, en voerde hem over naar Mahanaim, en maakte hem koning over Gilead, en over de Aschurieten, en over Jizreël, en over Efraïm, en over Benjamin, en over heel Israël. Veertig jaar was Isboseth, Sauls zoon, oud, toen hij koning werd over Israël; en hij regeerde het tweede jaar; alleen zij die van het huis van Juda waren, volgden David na.", "2 Sam 11:24": "Toen schoten de schutters van de muur af op uw knechten, zodat er van de knechten van de koning dood zijn; en uw knecht, Uria, de Hethiet, is ook dood.", "2 Sam 12:9": "Waarom hebt u dan het woord van de HEERE veracht, door te doen wat kwaad is in Zijn ogen? U hebt Uria, de Hethiet, met het zwaard verslagen, en zijn vrouw hebt u tot uw vrouw genomen; en hem hebt u met het zwaard van de kinderen van Ammon gedood.", "Deut 31:14": "En de HEERE zei tegen Mozes: Zie, uw dagen zijn genaderd om te sterven; roep Jozua, en stel u op in de tent van de samenkomst, zodat Ik hem een opdracht geef. Zo ging Mozes, en Jozua, en zij stelden zich op in de tent van de samenkomst.", "2 Sam 1:14-17": "En David zei tegen hem: Hoe hebt u niet gevreesd uw hand uit te strekken om de gezalfde van de HEERE te doden? En David riep een van de jongens, en zei: Kom dichterbij, val hem aan. En hij sloeg hem, zodat hij stierf. En David zei tegen hem: Uw bloed komt op uw hoofd; want uw mond heeft tegen u getuigd, toen u zei: ik heb de gezalfde van de HEERE gedood.", "Spr 1:17": "Zeker, het net wordt tevergeefs gespreid voor de ogen van allerlei gevogelte;", "Richt 7:11": "En u zult horen wat zij zullen zeggen, en daarna zullen uw handen gesterkt worden, zodat u naar het leger zult aftrekken. Toen ging hij af, met Pura, zijn knecht, tot aan het uiterste van de gewapende mannen die in het leger waren.", "Jes 29:10": "Want de HEERE heeft over u uitgegoten een geest van diepe slaap, en Hij heeft uw ogen dichtgesloten; de profeten, en uw hoofden, en de zieners heeft Hij verblind.", "Ps 119:1-8": "Aleph. Gelukkig zijn de oprechten van wandel, die in de wet van de HEERE gaan. Gelukkig zijn zij, die Zijn getuigenissen onderhouden, die Hem van ganser harte zoeken; Ook geen onrecht werken, maar wandelen in Zijn wegen.", "1 Sam 25:29": "Wanneer een mens opstaat om u te vervolgen en om uw ziel te zoeken, dan zal de ziel van mijn heer ingebonden zijn in het bundeltje van de levenden bij de HEERE, uw God; maar de ziel van uw vijanden zal Hij wegslingeren uit de holte van de slinger.", "Gen 48:16": "Die Engel, Die mij verlost heeft van alle kwaad, zegent deze jongens, en laat in hen mijn naam genoemd worden, en de naam van mijn vaders Abraham en Izak, en laat hen vermenigvuldigen als vissen in menigte, midden in het land!", "1 Sam 23:7-23": "Toen aan Saul te kennen gegeven werd dat David in Kehila gekomen was, zei Saul: God heeft hem in mijn hand overgegeven, want hij zit vast, nu hij in een stad met poorten en grendels is gekomen. Toen liet Saul heel het volk oproepen voor de strijd, om af te trekken naar Kehila, om David en zijn mannen te belegeren. Toen David begreep dat Saul dit kwaad heimelijk tegen hem voorhad, zei hij tegen de priester Abjathar: Breng de efod hierheen.", "1 Sam 24:20": "Wanneer iemand zijn vijand gevonden heeft, zal hij hem dan ongedeerd zijn weg laten gaan? De HEERE nu vergeldt u het goede, voor deze dag die u mij heden aangedaan hebt.", "Lev 26:31": "En Ik zal uw steden een woestijn maken, en uw heiligdommen verwoesten; en Ik zal uw liefelijke geur niet ruiken.", "Rom 12:19": "Wreek uzelf niet, geliefden, maar geef de toorn plaats; want er is geschreven: Mij komt de wraak toe; Ik zal het vergelden, zegt de Heere.", "Spr 6:16-19": "Deze zes dingen haat de HEERE; ja, zeven zijn een gruwel voor Zijn ziel: hoogmoedige ogen, een valse tong, en handen die onschuldig bloed vergieten; een hart dat verdorven plannen smeedt; voeten die zich haasten om naar het kwaad te lopen;", "Matt 7:2": "Want met het oordeel waarmee u oordeelt, zult u geoordeeld worden; en met de maat waarmee u meet, zal u weer gemeten worden.", "Spr 30:10": "Belaster een knecht niet bij zijn heer, opdat hij u niet vloekt, en u schuldig wordt.", "Gen 28:11": "En hij kwam op een plaats, waar hij overnachtte, want de zon was ondergegaan; en hij nam van de stenen van die plaats, en maakte er zijn hoofdkussen van, en legde zich te slapen op die plaats.", "Hebr 9:27": "En zoals het de mensen beschikt is eenmaal te sterven, en daarna het oordeel;", "1 Sam 24:19": "En u hebt mij heden laten zien dat u mij goed gedaan hebt; want de HEERE had mij in uw hand overgeleverd, en u hebt mij niet gedood.", "1 Sam 17:29": "Toen zei David: Wat heb ik nu gedaan? Is er geen reden voor?", "2 Tim 4:14": "Alexander, de kopersmid, heeft mij veel kwaad aangedaan; de Heere zal hem vergelden naar zijn werken.", "Ps 140:6": "De hoogmoedigen hebben een strik voor mij verborgen, en koorden; zij hebben een net uitgespreid aan de kant van de weg; valstrikken hebben zij mij gezet. Sela.", "1 Sam 16:14-23": "En de Geest van de HEERE week van Saul; en een boze geest van de HEERE verschrikte hem. Toen zeiden Sauls dienaren tegen hem: Zie toch, een boze geest van God verschrikt u. Laat onze heer toch tegen zijn dienaren die voor hem staan zeggen dat zij een man zoeken die op de harp kan spelen; en het zal gebeuren, als de boze geest van God over u komt, dat hij met zijn hand speelt, zodat het beter met u wordt.", "Joh 18:23": "Jezus antwoordde hem: Als Ik verkeerd gesproken heb, getuig dan van het kwade; en als Ik goed gesproken heb, waarom slaat u Mij?", "Neh 13:14": "Denk aan mij, mijn God, in dit opzicht; en delg mijn weldaden niet uit, die ik aan het huis van mijn God en aan Zijn wachten gedaan heb.", "Jer 50:42": "Boog en spies zullen zij voeren; wreed zijn zij, en zullen niet barmhartig zijn; hun stem zal bruisen als de zee, en op paarden zullen zij rijden; het is opgesteld als een man ten oorlog, tegen u, o dochter van Babel!", "Pred 10:20": "Vloek de koning niet, zelfs niet in uw gedachten, en vloek de rijke niet in het binnenste van uw slaapkamer; want het gevogelte des hemels zou de stem wegvoeren, en het gevleugelde zou het woord bekendmaken.", "1 Tess 5:3": "Want wanneer zij zullen zeggen: Het is vrede en veilig; dan zal een plotseling verderf hun overkomen, zoals de barensweeën een zwangere vrouw overkomen; en zij zullen het geenszins ontvluchten;", "2 Sam 1:15": "En David riep een van de jongens, en zei: Kom dichterbij, val hem aan. En hij sloeg hem, zodat hij stierf.", "Ps 7:4-6": "HEERE, mijn God, als ik dat gedaan heb, als er onrecht in mijn handen is; Als ik kwaad vergolden heb aan hem die vrede met mij had; (ja, ik heb hem gered, die mij zonder reden benauwde!) Laat dan de vijand mijn ziel vervolgen, en achterhaalt haar, en vertreedt mijn leven ter aarde, en mijn eer in het stof doet wonen! Sela.", "Klaagl 3:52": "Tsade. Zij die mijn vijanden zijn zonder oorzaak, hebben mij als een vogeltje dapper gejaagd.", "Ex 9:27": "Toen stuurde Farao mensen, en riep Mozes en Aäron, en zei tegen hen: Ik heb ditmaal gezondigd; de HEERE is rechtvaardig; ik daarentegen en mijn volk zijn goddelozen!", "Matt 26:55": "Op datzelfde moment zei Jezus tegen de menigten: Bent u uitgegaan als tegen een rover, met zwaarden en stokken, om Mij te vangen? Dagelijks zat Ik bij u, terwijl Ik leerde in de tempel, en u hebt Mij niet gegrepen;", "Ps 18:49": "Die mij uithelpt van mijn vijanden; ja, U verhoogt mij boven hen die tegen mij opstaan; U redt mij van de man van het geweld.", "2 Sam 16:21": "En Achitofel zei tegen Absalom: Ga naar de bijvrouwen van uw vader, die hij heeft achtergelaten om het huis te bewaren; zo zal heel Israël horen dat u zich bij uw vader gehaat gemaakt hebt, en de handen van allen die bij u zijn, zullen gesterkt worden.", "1 Sam 23:19": "Toen trokken de Zifieten op naar Saul in Gibea, en zeiden: Heeft David zich niet bij ons verborgen in de vestingen in het woud, op de heuvel van Hachila, die ten zuiden van de wildernis ligt?", "Ps 141:10": "Laat de goddelozen ieder in zijn eigen net vallen, samen, totdat ik voorbijgegaan zal zijn.", "1 Sam 24:2-16": "En het gebeurde, nadat Saul teruggekeerd was van het achtervolgen van de Filistijnen, dat men hem berichtte en zei: Zie, David is in de woestijn van En-gedi. Toen nam Saul drieduizend uitgelezen mannen uit heel Israël, en hij trok op om David en zijn mannen te zoeken boven op de rotsen van de steenbokken. En hij kwam bij de schaapskooien aan de weg, waar een spelonk was; en Saul ging daarin, om zijn voeten te bedekken. David nu en zijn mannen zaten aan de zijkanten van de spelonk.", "Ps 18:2": "Hij zei dan: Ik zal U hartelijk liefhebben, HEERE, mijn Sterkte!", "1 Sam 23:23-25": "Kijk daarom goed uit, en verneem naar alle schuilplaatsen waarin hij zich schuilhoudt; kom dan terug bij mij met zeker bericht, dan zal ik met u meegaan; en het zal gebeuren, als hij in het land is, dat ik hem opspoor onder alle duizenden van Juda. Toen maakten zij zich op, en gingen naar Zif, voor Saul uit. David nu en zijn mannen waren in de woestijn van Maon, in de vlakte, ten zuiden van de wildernis. Saul en zijn mannen gingen ook om hem te zoeken. Dat werd David verteld, en hij trok af naar die rots, en bleef in de woestijn van Maon. Toen Saul dat hoorde, joeg hij David na in de woestijn van Maon.", "Deut 4:27": "En de HEERE zal u verstrooien onder de volken; en u zult met weinigen in getal overblijven onder de heidenvolken waarheen de HEERE u zal leiden.", "Ps 7:9": "De HEERE zal de volken recht doen; doe mij recht, HEERE, naar mijn gerechtigheid, en naar mijn oprechtheid, die bij mij is.", "2 Kor 1:10": "Die ons uit zo’n grote dood verlost heeft, en nog verlost; op Wie wij hopen dat Hij ons ook nog verlossen zal.", "1 Sam 18:18-23": "Doch David zei tegen Saul: Wie ben ik, en wat is mijn leven, en het huisgezin van mijn vader in Israël, dat ik de schoonzoon van de koning zou worden? Het gebeurde nu ten tijde dat men Merab, de dochter van Saul, aan David geven zou, dat zij aan Adriël, de Meholathiet, tot vrouw werd gegeven. Doch Michal, de dochter van Saul, had David lief. Toen dat Saul te kennen werd gegeven, was die zaak goed in zijn ogen.", "Jer 17:11": "Zoals een veldhoen eieren verzamelt, maar ze niet uitbroedt, zo is hij die rijkdom verzamelt, maar niet met recht; in de helft van zijn dagen zal hij die moeten verlaten, en in zijn laatste dagen een dwaas zijn.", "Job 14:14": "Als een man gestorven is, zal hij dan weer leven? Ik zou al de dagen van het strijd hopen, totdat mijn verandering zou komen.", "Ps 34:18": "Tsade. Zij roepen, en de HEERE hoort, en Hij redt hen uit al hun benauwdheden.", "Ps 35:7": "Want zij hebben zonder oorzaak de groeve van hun net voor mij verborgen; zij hebben zonder oorzaak gegraven voor mijn ziel.", "1 Kon 22:22": "En de HEERE zei tegen hem: Waarmee? En hij zei: Ik zal uitgaan en een leugengeest zijn in de mond van al zijn profeten. En Hij zei: U zult overreden, en het ook kunnen; ga uit en doe zo.", "Amos 3:5": "Zal een vogel in de strik op de aarde vallen, als er geen strik voor hem is? Zal men de strik van de aardbodem opnemen, als men helemaal niets gevangen heeft?", "2 Sam 19:23": "En de koning zei tegen Simeï: U zult niet sterven. En de koning zwoer het hem.", "1 Sam 24:3": "Toen nam Saul drieduizend uitgelezen mannen uit heel Israël, en hij trok op om David en zijn mannen te zoeken boven op de rotsen van de steenbokken.", "Deut 4:28": "En daar zult u goden dienen, die het werk van mensenhanden zijn, hout en steen, die niet zien, niet horen, niet eten en niet ruiken.", "2 Sam 20:19": "Ik ben een van de vreedzamen, van de getrouwen in Israël, en u zoekt een stad te doden, die een moeder is in Israël; waarom zou u het erfdeel van de HEERE verslinden?", "1 Kron 9:39": "En Ner verwekte Kis, en Kis verwekte Saul, en Saul verwekte Jonathan, en Malchi-sua, en Abinadab, en Esbaal.", "Ef 2:3": "onder wie ook wij allen eertijds verkeerd hebben, in de begeerten van ons vlees, terwijl wij deden de wil van het vlees en van de gedachten; en wij waren van nature kinderen van de toorn, net als ook de anderen;", "2 Sam 16:11": "Verder zei David tegen Abisai en tegen al zijn knechten: Zie, mijn zoon, die uit mijn lijf is voortgekomen, zoekt mijn leven; hoeveel te meer dan nu deze zoon van Jemini? Laat hem begaan, laat hij vloeken, want de HEERE heeft het hem gezegd.", "Jes 60:5": "Dan zult u het zien en stralen, en uw hart zal vervaard zijn en verwijd worden; want de menigte van de zee zal tot u gekeerd worden, het leger van de heidenen zal tot u komen.", "1 Kron 21:1": "Toen stond de satan op tegen Israël, en hij porde David aan, dat hij Israël telde.", "Ps 94:23": "En Hij zal hun ongerechtigheid op hen doen terugkeren, en Hij zal hen in hun boosheid verdelgen; de HEERE, onze God, zal hen verdelgen.", "Ps 140:5-10": "Bewaar mij, HEERE, voor de handen van de goddeloze; behoed mij voor de man van geweld; van hen die bedacht hebben mijn voeten weg te stoten. De hoogmoedigen hebben een strik voor mij verborgen, en koorden; zij hebben een net uitgespreid aan de kant van de weg; valstrikken hebben zij mij gezet. Sela. Ik heb tegen de HEERE gezegd: U bent mijn God; neem ter ore, HEERE, de stem van mijn smekingen.", "Num 22:34": "Toen zei Bileam tegen de Engel van de HEERE: Ik heb gezondigd, want ik heb niet geweten dat U mij tegemoet op deze weg stond; en nu, als het kwaad is in Uw ogen, zal ik terugkeren.", "1 Kon 8:32": "hoor Ú dan in de hemel, en doe, en oordeel Uw dienaren, veroordeel de onrechtvaardige door zijn weg op zijn hoofd te leggen, en verklaar de rechtvaardige rechtvaardig door hem te geven naar zijn gerechtigheid.", "1 Sam 26:6-16": "Toen antwoordde David en sprak tegen Achimelech, de Hethiet, en tegen Abisai, de zoon van Zeruja, de broer van Joab, en zei: Wie zal met mij naar Saul in het leger afgaan? Toen zei Abisai: Ik zal met u afgaan. Zo kwamen David en Abisai 's nachts bij het volk; en zie, Saul lag te slapen in de wagenburg, en zijn speer stak in de aarde bij zijn hoofdeinde, en Abner en het volk lagen rondom hem. Toen zei Abisai tegen David: God heeft vandaag uw vijand in uw hand gegeven; laat mij hem toch nu met de speer in één keer aan de grond spijkeren, en ik zal het hem geen tweede keer hoeven te doen.", "1 Kron 2:16": "En hun zusters waren Zeruja en Abigaïl. De kinderen nu van Zeruja waren Abisai, en Joab, en Asa-el; drie.", "Num 24:10": "Toen ontstak de toorn van Balak tegen Bileam, en hij sloeg zijn handen samen; en Balak zei tegen Bileam: Ik heb u geroepen om mijn vijanden te vervloeken; maar zie, u hebt hen nu al driemaal gezegend!", "1 Sam 24:10": "En David zei tegen Saul: Waarom luistert u naar de woorden van mensen die zeggen: Zie, David zoekt uw ongeluk?", "Gen 44:18": "Toen kwam Juda dichter bij hem, en zei: Och, mijn heer! Laat toch uw knecht een woord spreken voor de oren van mijn heer, en laat uw toorn tegen uw knecht niet ontsteken; want u bent gelijk aan Farao!", "2 Sam 3:7": "Saul had een bijvrouw gehad, met de naam Rizpa, dochter van Aja; en Isboseth zei tegen Abner: Waarom bent u naar mijn vaders bijvrouw gegaan?", "Ps 18:21-27": "De HEERE vergold mij naar mijn gerechtigheid, Hij gaf mij weer naar de reinheid van mijn handen. Want ik heb de wegen van de HEERE gehouden, en ben van mijn God niet goddeloos afgegaan. Want al Zijn rechten waren voor mij, en Zijn inzettingen deed ik niet van mij weg.", "Gen 15:20": "En de Hethieten, en de Ferezieten, en de Refaïeten,", "2 Sam 11:6": "Toen zond David naar Joab en zei: Stuur Uria, de Hethiet, naar mij. En Joab stuurde Uria naar David.", "1 Sam 26:7-11": "Zo kwamen David en Abisai 's nachts bij het volk; en zie, Saul lag te slapen in de wagenburg, en zijn speer stak in de aarde bij zijn hoofdeinde, en Abner en het volk lagen rondom hem. Toen zei Abisai tegen David: God heeft vandaag uw vijand in uw hand gegeven; laat mij hem toch nu met de speer in één keer aan de grond spijkeren, en ik zal het hem geen tweede keer hoeven te doen. David zei daarentegen tegen Abisai: Breng hem niet om; want wie heeft ooit zijn hand tegen de gezalfde van de HEERE opgeheven en is onschuldig gebleven?", "1 Sam 23:24": "Toen maakten zij zich op, en gingen naar Zif, voor Saul uit. David nu en zijn mannen waren in de woestijn van Maon, in de vlakte, ten zuiden van de wildernis.", "Rom 11:32": "Want God heeft hen allen onder de ongehoorzaamheid besloten, opdat Hij hun allen barmhartig zou zijn.", "Richt 1:4": "En Juda trok op, en de HEERE gaf de Kanaänieten en de Ferezieten in hun hand; en zij versloegen hen bij Bezek, tienduizend man.", "1 Sam 24:12-15": "Zie toch, mijn vader, ja, zie de slip van uw mantel in mijn hand; want al heb ik de slip van uw mantel afgesneden, ik heb u niet gedood; erken en zie, dat er in mijn hand geen kwaad of overtreding is, en dat ik tegen u niet gezondigd heb; toch jaagt u mijn ziel na, om ze weg te nemen. De HEERE zal rechtspreken tussen mij en tussen u, en de HEERE zal mij op u wreken; maar mijn hand zal niet tegen u zijn. Zoals het spreekwoord van de ouden zegt: Van de goddelozen komt goddeloosheid voort; maar mijn hand zal niet tegen u zijn.", "Joh 10:32": "Jezus antwoordde hun: Ik heb u veel goede werken getoond van Mijn Vader; om welk van die werken stenigt u Mij?", "Spr 26:25": "Als hij vriendelijk spreekt, geloof hem niet, want zeven gruwelen zijn in zijn hart.", "2 Sam 11:21": "Wie sloeg Abimelech, de zoon van Jerubbeseth? Wierp niet een vrouw een stuk van een molensteen op hem van de muur, zodat hij te Thebez stierf? Waarom bent u tot de muur genaderd? Dan moet u zeggen: Uw knecht, Uria, de Hethiet, is ook dood.", "2 Sam 18:5": "En de koning gaf bevel aan Joab, en Abisai, en Ithai, en zei: Ga zachtzinnig om met de jongeman, met Absalom. En al het volk hoorde het, toen de koning aan alle leiders bevel gaf over de zaak van Absalom.", "1 Sam 31:6": "Zo stierf Saul, en zijn drie zonen, en zijn wapendrager, en ook al zijn mannen, op diezelfde dag tegelijk.", "Ps 120:5": "O, wee mij, dat ik een vreemdeling ben in Mesech, dat ik in de tenten van Kedar woont.", "1 Sam 22:6-18": "En Saul hoorde dat David bekend geworden was, en de mannen die bij hem waren. Saul nu zat op een heuvel onder het geboomte te Rama, en hij had zijn speer in zijn hand, en al zijn knechten stonden bij hem. Toen zei Saul tegen zijn knechten die bij hem stonden: Hoor toch, u, zonen van Jemini, zal ook de zoon van Isaï u allemaal akkers en wijngaarden geven? Zal hij u allemaal tot aanvoerders van duizenden en aanvoerders van honderden stellen? Dat u zich allemaal tegen mij verbonden hebt, en niemand het mij laat horen dat mijn zoon een verbond gemaakt heeft met de zoon van Isaï; en niemand onder u heeft er verdriet van vanwege mij, en laat het mij horen; want mijn zoon heeft mijn knecht tegen mij opgehitst, om een hinderlaag te leggen, zoals het op deze dag is.", "1 Tess 5:2": "Want u weet zelf zeer goed dat de dag van de Heere zo zal komen, zoals een dief in de nacht.", "1 Sam 18:8-29": "Toen ontstak Saul in grote woede, en dat woord was kwaad in zijn ogen, en hij zei: Zij hebben David tienduizend gegeven, doch mij hebben zij maar duizend gegeven; en zeker zal het koninkrijk nog voor hem zijn. En Saul had het oog op David, van die dag af en voortaan. En het gebeurde de volgende dag, dat de boze geest van God vaardig werd over Saul, en hij profeteerde midden in het huis, en David speelde snarenspel met zijn hand, zoals van dag tot dag; Saul nu had een speer in zijn hand.", "2 Sam 11:3": "En David zond iemand, en liet naar deze vrouw navragen; en men zei: Is dat niet Bathseba, de dochter van Eliam, de vrouw van Uria, de Hethiet?", "2 Sam 3:33-38": "En de koning hief een klaaglied aan over Abner, en zei: Moest Abner sterven zoals een dwaas sterft? Uw handen waren niet gebonden, en uw voeten waren niet in koperen boeien gezet, maar u bent gevallen, zoals men valt voor het aangezicht van kinderen van onrecht. Toen huilde heel het volk nog meer over hem. Daarna kwam al het volk om David brood te laten eten, terwijl het nog dag was; maar David zwoer: God moet mij zo doen, en er nog meer aan toevoegen, als ik vóór het ondergaan van de zon brood of iets anders smaak!", "2 Sam 3:8": "Toen ontstak Abner in grote woede over de woorden van Isboseth, en zei: Ben ik dan een hondenkop, ik, die tegen Juda, aan het huis van Saul, uw vader, aan zijn broers en aan zijn vrienden, tot op vandaag trouw bewijs, en u niet in Davids hand overgeleverd heb, dat u mij vandaag beschuldigt vanwege de schuld met deze vrouw?", "Joz 22:25-27": "De HEERE heeft immers de Jordaan tot grens gezet tussen ons en tussen u, u, kinderen van Ruben, en u, kinderen van Gad! U hebt geen deel aan de HEERE. Zo zouden uw kinderen onze kinderen kunnen doen ophouden de HEERE te vrezen. Daarom zeiden wij: Laten wij toch voor ons een altaar maken, door het te bouwen, niet voor brandoffer, en ook niet voor offer. Maar dat het een getuige zij tussen ons en tussen u, en tussen onze geslachten na ons, opdat wij de dienst van de HEERE voor Zijn aangezicht mogen dienen met onze brandoffers, en met onze slachtoffers, en met onze dankoffers; en dat uw kinderen tot onze kinderen morgen niet zeggen: U hebt geen deel aan de HEERE.", "Deut 32:35": "Aan Mij is de wraak en de vergelding, op de tijd dat hun voet zal wankelen; want de dag van hun ondergang is nabij, en de dingen die hun zullen gebeuren, haasten zich.", "2 Sam 24:1": "En de toorn van de HEERE ging verder tegen Israël ontsteken; en Hij porde David tegen hen aan en zei: Ga, tel Israël en Juda.", "1 Sam 9:1": "Er was nu een man van Benjamin, wiens naam Kis was, een zoon van Abiël, de zoon van Zeror, de zoon van Bechorath, de zoon van Afiah, de zoon van een man van Jemini, een dapper held.", "1 Sam 24:7": "En hij zei tegen zijn mannen: Laat het ver van mij zijn bij de HEERE, dat ik deze zaak zou doen aan mijn heer, de gezalfde van de HEERE, dat ik mijn hand tegen hem uit zou steken; want hij is de gezalfde van de HEERE!", "1 Petr 2:17": "Eer ieder; heb de broederschap lief; vrees God; eer de koning.", "1 Sam 25:24": "En zij viel aan zijn voeten en zei: Och, mijn heer, laat de misdaad op mij zijn, en laat toch uw dienstmaagd voor uw oren spreken, en hoor de woorden van uw dienstmaagd.", "Num 24:9": "Hij heeft zich gekromd, hij heeft zich neergelegd, als een leeuw, en als een oude leeuw; wie zal hem doen opstaan? Wie u zegent, die zij gezegend, en vervloekt zij wie u vervloekt!", "Gen 47:29": "Toen de dagen naderden dat Israël zou sterven, riep hij zijn zoon Jozef, en zei tegen hem: Als ik nu genade gevonden heb in uw ogen, leg dan toch uw hand onder mijn heup, en bewijs mij goedheid en trouw: begraaf mij toch niet in Egypte;", "Ps 102:21": "Om het zuchten van de gevangenen te horen, om los te maken de kinderen van de dood;", "Ps 141:9": "Bewaar mij voor het geweld van de strik, die zij mij gelegd hebben, en voor de valstrikken van de werkers van de ongerechtigheid.", "1 Sam 17:55": "Toen Saul David zag uitgaan, de Filistijn tegemoet, zei hij tegen Abner, de legeraanvoerder: Wiens zoon is deze jongeman, Abner? En Abner zei: Zo waarachtig als uw ziel leeft, o koning, ik weet het niet.", "Richt 7:10": "Maar als u ervoor terugschrikt naar beneden te gaan, ga dan af, u en Pura, uw knecht, naar het leger.", "Hos 12:5": "Ja, hij gedroeg zich vorstelijk tegen de Engel, en kreeg de overhand op Hem; hij weende en smeekte Hem. Te Bethel vond hij Hem, en daar sprak Hij met ons;", "2 Tess 3:2": "En opdat wij verlost mogen worden van de ongeschikte en boze mensen; want het geloof is niet ieders deel.", "1 Sam 14:50": "En de naam van Sauls vrouw was Ahinoam, een dochter van Ahimaäz; en de naam van zijn legeraanvoerder was Abner, een zoon van Ner, Sauls oom.", "Ps 37:10": "Vau. En nog een korte tijd, en de goddeloze zal er niet zijn; en u zult goed opletten op zijn plaats, maar hij zal er niet zijn.", "2 Sam 7:18-29": "Toen ging koning David naar binnen, en bleef voor het aangezicht van de HEERE, en hij zei: Wie ben ik, Heere HEERE, en wat is mijn huis, dat U mij tot hiertoe gebracht hebt? Daarbij is dit in Uw ogen nog klein geweest, Heere HEERE, maar U hebt ook over het huis van uw knecht gesproken tot ver in de toekomst; en dit naar de wet van de mensen, Heere HEERE! En wat zal David nog meer tot U spreken? Want U kent Uw knecht, Heere HEERE!", "Ps 116:15": "Kostbaar is in de ogen van de HEERE de dood van Zijn gunstgenoten.", "Matt 27:4": "en zei: Ik heb gezondigd, want ik heb onschuldig bloed verraden! Maar zij zeiden: Wat gaat ons dat aan? U moet maar toezien.", "1 Kron 17:16-27": "Toen kwam koning David binnen, en bleef voor het aangezicht van de HEERE, en hij zei: Wie ben ik, HEERE God, en wat is mijn huis, dat U mij tot hiertoe gebracht hebt? En dit is nog klein geweest in Uw ogen, o God! Daarom hebt U over het huis van Uw knecht ook gesproken voor een verre toekomst, en U hebt mij naar menselijke maatstaf voorzien met deze verhoging, o HEERE God! Wat zal David hier verder aan toevoegen, vanwege de eer aan Uw knecht? Maar U kent Uw knecht wel.", "1 Sam 27:4": "Toen aan Saul verteld werd dat David naar Gath gevlucht was, ging hij hem niet meer zoeken.", "1 Sam 14:7": "Toen zei zijn wapendrager tegen hem: Doe alles wat in uw hart is; ga uw gang, zie, ik ben met u, naar uw hart.", "Ps 37:13": "De Heere belacht hem, want Hij ziet dat zijn dag komt.", "Pred 9:12": "Want ook de mens kent zijn tijd niet: zoals de vissen die gevangen worden met een kwaadaardig net, en zoals de vogels die gevangen worden met de strik, zo worden de mensenkinderen verstrikt, op een kwade tijd, wanneer die plotseling over hen valt.", "2 Sam 23:39": "Uria, de Hethiet, zevenendertig in alles.", "1 Sam 25:26": "En nu, mijn heer! Zo waarachtig als de HEERE leeft, en uw ziel leeft, het is de HEERE Die u ervan weerhouden heeft om te komen met bloedvergieten, en dat uw hand u zou verlossen; en nu, laat uw vijanden worden als Nabal, en die kwaad zoeken tegen mijn heer!", "1 Sam 25:24-31": "En zij viel aan zijn voeten en zei: Och, mijn heer, laat de misdaad op mij zijn, en laat toch uw dienstmaagd voor uw oren spreken, en hoor de woorden van uw dienstmaagd. Laat mijn heer toch zijn hart niet richten op deze Belials man, op Nabal; want zoals zijn naam is, zo is hij; zijn naam is Nabal, en dwaasheid is bij hem; en ik, uw dienstmaagd, heb de jongemannen van mijn heer niet gezien, die u gezonden hebt. En nu, mijn heer! Zo waarachtig als de HEERE leeft, en uw ziel leeft, het is de HEERE Die u ervan weerhouden heeft om te komen met bloedvergieten, en dat uw hand u zou verlossen; en nu, laat uw vijanden worden als Nabal, en die kwaad zoeken tegen mijn heer!", "1 Sam 15:30": "Hij dan zei: Ik heb gezondigd; eer mij toch nu voor de oudsten van mijn volk, en voor Israël; en keer met mij terug, dat ik de HEERE, uw God, aanbid.", "Matt 5:7": "Zalig zijn de barmhartigen, want hun zal barmhartigheid geschieden.", "Gen 21:14": "Toen stond Abraham 's morgens vroeg op, en nam brood en een fles water, en gaf ze aan Hagar, die hij op haar schouder legde; ook gaf hij haar het kind, en stuurde haar weg. En zij ging op weg, en dwaalde rond in de woestijn Berseba.", "Gal 1:9": "Zoals wij al eerder gezegd hebben, zeg ik het nu ook weer: als iemand u een evangelie verkondigt naast wat u ontvangen hebt, laat hij vervloekt zijn.", "Ps 18:26": "Bij de goedertierene houdt U Zich goedertieren, bij de oprechte man houdt U Zich oprecht.", "1 Sam 17:20": "Toen maakte David zich 's morgens vroeg op, en hij liet de schapen bij de hoeder, en hij nam het op en ging heen, zoals Isaï hem bevolen had; en hij kwam bij de wagenburg, toen het leger in slagorde uittrok en men ten strijde riep.", "1 Sam 24:16": "Doch de HEERE zal Rechter zijn, en rechtspreken tussen mij en tussen u, en zien daarin, en mijn geschil beslechten, en mij redden uit uw hand.", "Ps 79:11": "Laat het gekerm van de gevangenen voor Uw aangezicht komen; behoud, naar de grootheid van Uw arm, hen die tot de dood bestemd zijn.", "Openb 18:8": "Daarom zullen haar plagen op één dag komen, namelijk dood, en rouw, en honger, en zij zal met vuur verbrand worden; want sterk is de Heere God, Die haar oordeelt.", "1 Sam 24:11-13": "Zie, op deze dag hebben uw ogen gezien dat de HEERE u heden in mijn hand gegeven heeft in deze spelonk, en men zei dat ik u doden zou; doch mijn hand spaarde u, want ik zei: Ik zal mijn hand niet uitsteken tegen mijn heer, want hij is de gezalfde van de HEERE. Zie toch, mijn vader, ja, zie de slip van uw mantel in mijn hand; want al heb ik de slip van uw mantel afgesneden, ik heb u niet gedood; erken en zie, dat er in mijn hand geen kwaad of overtreding is, en dat ik tegen u niet gezondigd heb; toch jaagt u mijn ziel na, om ze weg te nemen. De HEERE zal rechtspreken tussen mij en tussen u, en de HEERE zal mij op u wreken; maar mijn hand zal niet tegen u zijn.", "Joz 15:55": "Maon, Karmel, en Zif, en Juta,", "1 Sam 20:30-33": "Toen ontstak de toorn van Saul tegen Jonathan, en hij zei tegen hem: U, zoon van de verkeerde in weerspannigheid, weet ik het niet, dat u de zoon van Isaï verkozen hebt tot uw eigen schande, en tot schande van de naaktheid van uw moeder? Want alle dagen dat de zoon van Isaï op de aardbodem leeft, zult u noch uw koninkrijk bevestigd worden; nu dan, stuur iemand heen, en haal hem tot mij, want hij is een kind van de dood. Toen antwoordde Jonathan Saul, zijn vader, en zei tegen hem: Waarom zal hij gedood worden? Wat heeft hij gedaan?", "Gen 10:15": "En Kanaän verwekte Sidon, zijn eerstgeborene, en Heth,", "Gen 28:18": "Toen stond Jakob 's morgens vroeg op, en hij nam de steen die hij als hoofdkussen gelegd had, en zette hem op als een opgericht teken, en goot er olie boven op.", "Job 7:1": "Heeft de mens niet een strijd op de aarde, en zijn zijn dagen niet als de dagen van de dagloner?", "1 Sam 24:9": "Daarna maakte David zich ook op, en ging uit de spelonk, en hij riep Saul achterna en zei: Mijn heer koning! Toen keek Saul achter zich om, en David boog zich met het gezicht ter aarde en boog zich neer.", "Ps 34:19": "Koph. De HEERE is nabij de gebrokenen van hart, en Hij behoudt de verslagenen van geest.", "Gen 32:28": "Toen zei Hij: Uw naam zal voortaan niet meer Jakob heten, maar Israël; want u hebt zich als een vorst gedragen tegenover God en tegenover de mensen, en hebt de overhand gekregen.", "2 Sam 19:22": "Maar David zei: Wat heb ik met u te maken, zonen van Zeruja, dat u mij vandaag tot tegenstander zou willen zijn? Zou er vandaag iemand gedood moeten worden in Israël? Want weet ik niet dat ik vandaag koning geworden ben over Israël?", "1 Sam 18:30": "Als de vorsten van de Filistijnen uittrokken, gebeurde het, zo dikwijls als zij uittrokken, dat David verstandiger was dan al de knechten van Saul; zodat zijn naam zeer geacht werd.", "Ps 38:13": "En die mijn ziel zoeken, leggen mij strikken; en die mijn kwaad zoeken, spreken verderfelijke dingen, en zij overdenken de hele dag listen.", "Job 14:5": "Omdat zijn dagen bepaald zijn, het aantal van zijn maanden bij U bekend is, en U zijn grenzen gesteld hebt, die hij niet zal overschrijden;", "Joz 21:44": "En de HEERE gaf hun rust rondom, naar alles wat Hij hun vaderen gezworen had; en er stond niet één man van al hun vijanden voor hen staande; al hun vijanden gaf de HEERE in hun hand.", "Gal 3:23": "Maar voordat het geloof kwam, werden wij onder de wet bewaakt, en gesloten gehouden tot op het geloof, dat geopenbaard zou worden.", "Est 6:1": "Diezelfde nacht kon de koning niet slapen, en hij zei dat men het boek van de gedenkwaardigheden, de kronieken, moest brengen; en die werden voorgelezen in de tegenwoordigheid van de koning.", "1 Sam 18:10": "En het gebeurde de volgende dag, dat de boze geest van God vaardig werd over Saul, en hij profeteerde midden in het huis, en David speelde snarenspel met zijn hand, zoals van dag tot dag; Saul nu had een speer in zijn hand.", "2 Sam 19:28": "Want heel mijn vaders huis was voor mijn heer de koning niets anders dan mensen die de dood verdienen; toch hebt u uw knecht een plaats gegeven onder hen die aan uw tafel eten; wat recht heb ik dan nog om verder te klagen bij de koning?", "Nahum 1:9": "Wat bedenkt u tegen de HEERE? Hij zal zelf een einde maken; de benauwdheid zal niet tweemaal opkomen.", "Ps 54:3": "O God! Verlos mij door Uw Naam, en doe mij recht door Uw macht.", "2 Sam 12:5": "Toen ontstak Davids woede erg tegen die man, en hij zei tegen Nathan: Zo waar de HEERE leeft, de man die dat gedaan heeft, is een kind des doods!", "2 Sam 16:10": "Maar de koning zei: Wat heb ik met u te doen, zonen van Zeruja? Ja, laat hem vloeken; want de HEERE heeft immers tegen hem gezegd: Vloek David; wie zou dan zeggen: Waarom hebt u dat gedaan?", "Gal 5:12": "Och, waren zij maar afgesneden, die u onrustig maken!", "Ps 105:15": "Raak Mijn gezalfden niet aan, en doe Mijn profeten geen kwaad.", "Openb 7:14": "En ik zei tegen hem: Heere, u weet het. En hij zei tegen mij: Dezen zijn het, die uit de grote verdrukking komen; en zij hebben hun lange kleren gewassen, en hebben hun lange kleren wit gemaakt in het bloed van het Lam.", "1 Sam 24:23": "Toen zwoer David aan Saul; en Saul ging naar zijn huis, maar David en zijn mannen gingen op naar de vesting.", "Ps 94:1": "O God van de wraken! O HEERE, God van de wraken! Verschijn blinkend!", "2 Kron 11:8": "En Gath, en Maresa, en Zif,", "2 Sam 23:18": "Abisai, Joabs broer, de zoon van Zeruja, die was ook een hoofd van drie; en hij hief zijn speer op tegen driehonderd man, die door hem verslagen werden; en hij had een naam onder die drie.", "2 Sam 1:14": "En David zei tegen hem: Hoe hebt u niet gevreesd uw hand uit te strekken om de gezalfde van de HEERE te doden?", "Pred 3:2": "Er is een tijd om geboren te worden, en een tijd om te sterven; een tijd om te planten, en een tijd om het geplante uit te roeien;", "1 Sam 19:13": "En Michal nam een beeld, en legde het in het bed, en legde een geitenvel aan zijn hoofdkussen, en dekte het met een kleed toe.", "1 Kron 2:15": "Ozem, de zesde, David, de zevende.", "Ps 31:9": "En mij niet hebt overgeleverd in de hand van de vijand; U hebt mijn voeten doen staan in de ruimte.", "1 Sam 20:31": "Want alle dagen dat de zoon van Isaï op de aardbodem leeft, zult u noch uw koninkrijk bevestigd worden; nu dan, stuur iemand heen, en haal hem tot mij, want hij is een kind van de dood.", "Gal 1:8": "Maar al zouden wij, of een engel uit de hemel, u een evangelie verkondigen naast wat wij u verkondigd hebben, laat hij vervloekt zijn.", "2 Kon 2:20": "En hij zei: Brengt mij een nieuwe schaal, en legt er zout in. En zij brachten ze naar hem toe.", "2 Sam 1:16": "En David zei tegen hem: Uw bloed komt op uw hoofd; want uw mond heeft tegen u getuigd, toen u zei: ik heb de gezalfde van de HEERE gedood.", "Gen 15:12": "En het gebeurde, toen de zon aan het ondergaan was, dat een diepe slaap op Abram viel; en zie, een schrik en grote duisternis vielen op hem.", "Rom 8:37": "Maar in dit alles zijn wij meer dan overwinnaars, door Hem Die ons heeft liefgehad.", "1 Sam 26:6-8": "Toen antwoordde David en sprak tegen Achimelech, de Hethiet, en tegen Abisai, de zoon van Zeruja, de broer van Joab, en zei: Wie zal met mij naar Saul in het leger afgaan? Toen zei Abisai: Ik zal met u afgaan. Zo kwamen David en Abisai 's nachts bij het volk; en zie, Saul lag te slapen in de wagenburg, en zijn speer stak in de aarde bij zijn hoofdeinde, en Abner en het volk lagen rondom hem. Toen zei Abisai tegen David: God heeft vandaag uw vijand in uw hand gegeven; laat mij hem toch nu met de speer in één keer aan de grond spijkeren, en ik zal het hem geen tweede keer hoeven te doen.", "Rom 8:35": "Wie zal ons scheiden van de liefde van Christus? Verdrukking, of benauwdheid, of vervolging, of honger, of naaktheid, of gevaar, of het zwaard?", "Ps 7:10": "Laat toch de slechtheid van de goddelozen een einde nemen, maar bevestig de rechtvaardige, U, Die harten en nieren doorziet, o rechtvaardige God!", "2 Sam 16:9": "Toen zei Abisai, de zoon van Zeruja, tegen de koning: Waarom zou deze dode hond mijn heer de koning vloeken? Laat mij toch oversteken en zijn kop wegnemen.", "Ps 69:5": "Die mij zonder oorzaak haten, zijn meer dan de haren van mijn hoofd; die mij zoeken te vernielen, die mij om valse oorzaken vijand zijn, zijn machtig geworden; wat ik niet geroofd heb, moet ik dan teruggeven.", "Rom 14:15": "Maar als uw broeder om het voedsel bedroefd wordt, dan wandelt u niet meer naar liefde. Breng hem niet ten verderve met uw voedsel, voor wie Christus gestorven is.", "1 Sam 26:1-20": "De Zifieten kwamen bij Saul in Gibea en zeiden: Houdt David zich niet verborgen op de heuvel van Hachila, tegenover de wildernis? Toen maakte Saul zich op en trok af naar de woestijn Zif, met drieduizend man, uitgelezen mannen van Israël, om David te zoeken in de woestijn Zif. En Saul legerde zich op de heuvel van Hachila, die tegenover de wildernis aan de weg ligt, maar David bleef in de woestijn, en zag dat Saul achter hem aan kwam naar de woestijn.", "1 Sam 2:9": "Hij zal de voeten van Zijn gunstgenoten bewaren; maar de goddelozen zullen zwijgen in duisternis; want een man vermag niet door kracht.", "Matt 26:47": "En terwijl Hij nog sprak, zie, Judas, één van de twaalf, kwam, en met hem een grote menigte met zwaarden en stokken, gezonden door de overpriesters en oudsten van het volk.", "1 Sam 24:18": "En hij zei tegen David: U bent rechtvaardiger dan ik; want u hebt mij goed vergolden, en ik heb u kwaad vergolden.", "1 Sam 25:38": "En het gebeurde ongeveer tien dagen later, dat de HEERE Nabal sloeg, zodat hij stierf.", "1 Sam 15:24": "Toen zei Saul tegen Samuël: Ik heb gezondigd, omdat ik het bevel van de HEERE en uw woorden overtreden heb; want ik heb het volk gevreesd en naar hun stem geluisterd.", "Joz 15:24": "Zif, en Telem, en Bealoth,", "Richt 9:7": "Toen ze dit aan Jotham vertelden, ging hij heen en ging op de top van de berg Gerizim staan, en verhief zijn stem, en riep, en hij zei tegen hen: Luistert naar mij, burgers van Sichem! Dan zal God ook naar u luisteren.", "Spr 28:20": "Een geheel getrouw man zal overvloedig zijn in zegeningen; maar wie zich haast om rijk te worden, zal niet onschuldig blijven.", "2 Sam 3:27": "Toen Abner naar Hebron terugkwam, nam Joab hem apart in het midden van de poort om in stilte met hem te spreken; en hij sloeg hem daar onder de vijfde rib, zodat hij stierf, vanwege het bloed van zijn broer Asaël.", "Luk 18:7": "Zal God dan geen recht doen aan Zijn uitverkorenen, die dag en nacht tot Hem roepen, hoewel Hij geduldig is met hen?", "1 Sam 24:13": "De HEERE zal rechtspreken tussen mij en tussen u, en de HEERE zal mij op u wreken; maar mijn hand zal niet tegen u zijn.", "1 Sam 23:15": "Toen David zag dat Saul was uitgetrokken om hem naar het leven te staan, bleef David in de woestijn Zif, in een woud.", "Hand 14:22": "en versterkten de harten van de discipelen, en vermaanden hen om te blijven in het geloof, en dat wij door veel verdrukkingen het Koninkrijk van God moeten binnengaan.", "Ps 42:3": "Mijn ziel dorst naar God, naar de levende God; wanneer zal ik binnengaan en voor het aangezicht van God verschijnen?", "1 Sam 24:5": "Toen zeiden de mannen van David tegen hem: Zie de dag waarop de HEERE tegen u zegt: Zie, Ik geef uw vijand in uw hand, en u zult hem doen zoals het goed zal zijn in uw ogen. En David stond op, en sneed stilletjes een slip van Sauls mantel af."}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H2130\">De</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H2130\">Zifieten</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H935\">kwamen</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H935\">bij</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H7586\">Saul</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H7586\">in</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H1390\">Gibea</span> en zeiden: <span class=\"wl\" data-l=\"L5\" data-code=\"H5641\">Houdt</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H1732\">David</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H5641\">zich</span> <span class=\"wl\" data-l=\"L7\" data-code= >seek</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> of <span class=\"wl wl-kjv\" data-code=\"H2128\">Ziph.</span>", "3": "And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> in the <span class=\"wl wl-kjv\" data-code=\"H1389\">hill</span> of <span class=\"wl wl-kjv\" data-code=\"H2444\">Hachilah,</span> which is <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H3452\">Jeshimon,</span> by the <span class=\"wl wl-kjv\" data-code=\"H1870\">way.</span> But <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">abode</span> in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness,</span> and he <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> him into the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness.</span>", "4": "<span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> therefore sent <span class=\"wl wl-kjv\" data-code=\"H7971\">out</span> <span class=\"wl wl-kjv\" data-code=\"H7270\">spies,</span> and <span class=\"wl wl-kjv\" data-code=\"H3045\">understood</span> that <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> was <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> in very <span class=\"wl wl-kjv\" data-code=\"H3559\">deed.</span>", "5": "And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> where <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> had <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched:</span> and <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">beheld</span> the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> where <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H7901\">lay,</span> and <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5369\">Ner,</span> the <span class=\"wl wl-kjv\" data-code=\"H8269\">captain</span> of his <span class=\"wl wl-kjv\" data-code=\"H6635\">host:</span> and <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H7901\">lay</span> in the <span class=\"wl wl-kjv\" data-code=\"H4570\">trench,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> him.", "6": "Then <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H288\">Ahimelech</span> the <span class=\"wl wl-kjv\" data-code=\"H2850\">Hittite,</span> and to <span class=\"wl wl-kjv\" data-code=\"H52\">Abishai</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H6870\">Zeruiah,</span> <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> to <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Who will go <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> with me to <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> to the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp?</span> And <span class=\"wl wl-kjv\" data-code=\"H52\">Abishai</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will go <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> with thee.", "7": "So <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> and <span class=\"wl wl-kjv\" data-code=\"H52\">Abishai</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> by <span class=\"wl wl-kjv\" data-code=\"H3915\">night:</span> and, behold, <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H7901\">lay</span> <span class=\"wl wl-kjv\" data-code=\"H3463\">sleeping</span> within the <span class=\"wl wl-kjv\" data-code=\"H4570\">trench,</span> and his <span class=\"wl wl-kjv\" data-code=\"H2595\">spear</span> <span class=\"wl wl-kjv\" data-code=\"H4600\">stuck</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">ground</span> at his <span class=\"wl wl-kjv\" data-code=\"H4763\">bolster:</span> but <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H7901\">lay</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> him.", "8": "Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H52\">Abishai</span> to <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> hath <span class=\"wl wl-kjv\" data-code=\"H5462\">delivered</span> thine <span class=\"wl wl-kjv\" data-code=\"H341\">enemy</span> into thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day:</span> now therefore let me <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> him, I pray thee, with the <span class=\"wl wl-kjv\" data-code=\"H2595\">spear</span> even to the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> at <span class=\"wl wl-kjv\" data-code=\"H6471\">once,</span> and I will not smite him the second <span class=\"wl wl-kjv\" data-code=\"H8138\">time.</span>", "9": "And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H52\">Abishai,</span> <span class=\"wl wl-kjv\" data-code=\"H7843\">Destroy</span> him not: for who can stretch <span class=\"wl wl-kjv\" data-code=\"H7971\">forth</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> against the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S</span> <span class=\"wl wl-kjv\" data-code=\"H4899\">anointed,</span> and be <span class=\"wl wl-kjv\" data-code=\"H5352\">guiltless?</span>", "10": "<span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> furthermore, As the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H5062\">smite</span> him; or his <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to <span class=\"wl wl-kjv\" data-code=\"H4191\">die;</span> or he shall <span class=\"wl wl-kjv\" data-code=\"H3381\">descend</span> into <span class=\"wl wl-kjv\" data-code=\"H4421\">battle,</span> and <span class=\"wl wl-kjv\" data-code=\"H5595\">perish.</span>", "11": "The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2486\">forbid</span> that I should stretch <span class=\"wl wl-kjv\" data-code=\"H7971\">forth</span> mine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> against the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S</span> <span class=\"wl wl-kjv\" data-code=\"H4899\">anointed:</span> but, I pray thee, <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> thou now the <span class=\"wl wl-kjv\" data-code=\"H2595\">spear</span> that is at his <span class=\"wl wl-kjv\" data-code=\"H4763\">bolster,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6835\">cruse</span> of <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and let us <span class=\"wl wl-kjv\" data-code=\"H3212\">go.</span>", "12": "So <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> the <span class=\"wl wl-kjv\" data-code=\"H2595\">spear</span> and the <span class=\"wl wl-kjv\" data-code=\"H6835\">cruse</span> of <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> from <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul's</span> <span class=\"wl wl-kjv\" data-code=\"H7226\">bolster;</span> and they gat them <span class=\"wl wl-kjv\" data-code=\"H3212\">away,</span> and no man <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> it, nor <span class=\"wl wl-kjv\" data-code=\"H3045\">knew</span> it, neither <span class=\"wl wl-kjv\" data-code=\"H6974\">awaked:</span> for they were all <span class=\"wl wl-kjv\" data-code=\"H3463\">asleep;</span> because a deep <span class=\"wl wl-kjv\" data-code=\"H8639\">sleep</span> from the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was <span class=\"wl wl-kjv\" data-code=\"H5307\">fallen</span> upon them.", "13": "Then <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> went <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> to the other <span class=\"wl wl-kjv\" data-code=\"H5676\">side,</span> and <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> on the <span class=\"wl wl-kjv\" data-code=\"H7218\">top</span> of an <span class=\"wl wl-kjv\" data-code=\"H2022\">hill</span> afar <span class=\"wl wl-kjv\" data-code=\"H7350\">off;</span> a <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4725\">space</span> being between them:", "14": "And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">cried</span> to the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and to <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5369\">Ner,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">Answerest</span> thou not, <span class=\"wl wl-kjv\" data-code=\"H74\">Abner?</span> Then <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Who art thou that <span class=\"wl wl-kjv\" data-code=\"H7121\">criest</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king?</span>", "15": "And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H74\">Abner,</span> Art not thou a valiant <span class=\"wl wl-kjv\" data-code=\"H376\">man?</span> and who is like to thee in <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel?</span> wherefore then hast thou not <span class=\"wl wl-kjv\" data-code=\"H8104\">kept</span> thy <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king?</span> for there <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> in to <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> thy <span class=\"wl wl-kjv\" data-code=\"H113\">lord.</span>", "16": "This <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> is not <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> that thou hast <span class=\"wl wl-kjv\" data-code=\"H6213\">done.</span> As the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> ye are <span class=\"wl wl-kjv\" data-code=\"H1121\">worthy</span> to <span class=\"wl wl-kjv\" data-code=\"H4194\">die,</span> because ye have not <span class=\"wl wl-kjv\" data-code=\"H8104\">kept</span> your <span class=\"wl wl-kjv\" data-code=\"H113\">master,</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S</span> <span class=\"wl wl-kjv\" data-code=\"H4899\">anointed.</span> And now <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> where the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H2595\">spear</span> is, and the <span class=\"wl wl-kjv\" data-code=\"H6835\">cruse</span> of <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> that was at his <span class=\"wl wl-kjv\" data-code=\"H4763\">bolster.</span>", "17": "And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H5234\">knew</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David's</span> <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Is this thy <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> my <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David?</span> And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> It is my <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> my <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> O <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span>", "18": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Wherefore doth my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> thus <span class=\"wl wl-kjv\" data-code=\"H7291\">pursue</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> his <span class=\"wl wl-kjv\" data-code=\"H5650\">servant?</span> for what have I <span class=\"wl wl-kjv\" data-code=\"H6213\">done?</span> or what <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> is in mine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand?</span>", "19": "Now therefore, I pray thee, let my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of his <span class=\"wl wl-kjv\" data-code=\"H5650\">servant.</span> If the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> have stirred thee <span class=\"wl wl-kjv\" data-code=\"H5496\">up</span> against me, let him <span class=\"wl wl-kjv\" data-code=\"H7306\">accept</span> an <span class=\"wl wl-kjv\" data-code=\"H4503\">offering:</span> but if they be the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">men,</span> <span class=\"wl wl-kjv\" data-code=\"H779\">cursed</span> be they <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> for they have <span class=\"wl wl-kjv\" data-code=\"H1644\">driven</span> me out this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> from <span class=\"wl wl-kjv\" data-code=\"H5596\">abiding</span> in the <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Go,</span> <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> <span class=\"wl wl-kjv\" data-code=\"H430\">gods.</span>", "20": "Now therefore, let not
