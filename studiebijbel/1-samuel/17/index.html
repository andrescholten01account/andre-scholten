s", "href": "../../1-timotheus/1/"}, {"naam": "2 Timotheüs", "href": "../../2-timotheus/1/"}, {"naam": "Titus", "href": "../../titus/1/"}, {"naam": "Filemon", "href": "../../filemon/1/"}, {"naam": "Hebreeën", "href": "../../hebreeen/1/"}, {"naam": "Jakobus", "href": "../../jakobus/1/"}, {"naam": "1 Petrus", "href": "../../1-petrus/1/"}, {"naam": "2 Petrus", "href": "../../2-petrus/1/"}, {"naam": "1 Johannes", "href": "../../1-johannes/1/"}, {"naam": "2 Johannes", "href": "../../2-johannes/1/"}, {"naam": "3 Johannes", "href": "../../3-johannes/1/"}, {"naam": "Judas", "href": "../../judas/1/"}, {"naam": "Openbaring", "href": "../../openbaring/1/"}], "slugmap": {"Gen": "genesis", "Ex": "exodus", "Lev": "leviticus", "Num": "numeri", "Deut": "deuteronomium", "Joz": "jozua", "Richt": "richteren", "Ruth": "ruth", "1 Sam": "1-samuel", "2 Sam": "2-samuel", "1 Kon": "1-koningen", "2 Kon": "2-koningen", "1 Kron": "1-kronieken", "2 Kron": "2-kronieken", "Ezra": "ezra", "Neh": "nehemia", "Est": "esther", "Job": "job", "Ps": "psalmen", "Spr": "spreuken", "Pred": "prediker", "Hoogl": "hooglied", "Jes": "jesaja", "Jer": "jeremia", "Klaagl": "klaagliederen", "Ezech": "ezechiel", "Dan": "daniel", "Hos": "hosea", "Joël": "joel", "Amos": "amos", "Obadja": "obadja", "Jona": "jona", "Micha": "micha", "Nahum": "nahum", "Hab": "habakuk", "Zef": "zefanja", "Hagg": "haggai", "Zach": "zacharia", "Mal": "maleachi", "Matt": "mattheus", "Mark": "markus", "Luk": "lukas", "Joh": "johannes", "Hand": "handelingen", "Rom": "romeinen", "1 Kor": "1-korinthe", "2 Kor": "2-korinthe", "Gal": "galaten", "Ef": "efeze", "Fil": "filippenzen", "Kol": "kolossenzen", "1 Tess": "1-thessalonicenzen", "2 Tess": "2-thessalonicenzen", "1 Tim": "1-timotheus", "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "En de Filistijnen verzamelden hun leger ten strijde, en verzamelden zich te Socho, dat in Juda ligt; en zij legerden zich tussen Socho en Azeka, aan het einde van Dammim.", "2": "Maar Saul en de mannen van Israël verzamelden zich, en legerden zich in het eikendal; en stelden de slagorde tegen de Filistijnen op.", "3": "De Filistijnen nu stonden aan een berg aan de ene kant, en de Israëlieten stonden aan een berg aan de andere kant; en de vallei was tussen hen.", "4": "Toen ging er een kampvechter uit het leger van de Filistijnen naar buiten; zijn naam was Goliath, uit Gath; zijn hoogte was zes ellen en een span.", "5": "En hij had een koperen helm op zijn hoofd, en hij had een schubachtig pantser aan; en het gewicht van het pantser was vijfduizend sikkel koper.", "6": "En een koperen scheenharnas boven zijn voeten, en een koperen schild tussen zijn schouders.", "7": "En de schacht van zijn speer was als een weversboom, en het lemmer van zijn speer was van zeshonderd sikkel ijzer; en de schilddrager ging voor hem uit.", "8": "Hij nu stond en riep tegen de slagorden van Israël, en zei tegen hen: Waarom zou u uittrekken om de slagorde op te stellen? Ben ik niet een Filistijn, en u knechten van Saul? Kies een man onder u, die naar mij toe komt.", "9": "Als hij tegen mij kan strijden en mij kan verslaan, dan zullen wij u tot knechten zijn; maar als ik hem overwin en hem versla, dan zult u ons tot knechten zijn en ons dienen.", "10": "Verder zei de Filistijn: Ik heb vandaag de slagorden van Israël gehoond, en gezegd: Geef mij een man, dat wij samen strijden!", "11": "Toen Saul en heel Israël deze woorden van de Filistijn hoorden, schrokken zij enorm, en vreesden zeer.", "12": "David nu was de zoon van de Efrathitische man uit Bethlehem-Juda, wiens naam Isaï was, en die acht zonen had, en in de dagen van Saul was hij een man, oud, hoogbejaard onder de mannen.", "13": "En de drie oudste zonen van Isaï gingen op weg; zij volgden Saul na in de strijd. De namen nu van zijn drie zonen die in de strijd gingen, waren: Eliab, de eerstgeborene, en zijn tweede Abinadab, en de derde Samma.", "14": "En David was de jongste; en de drie oudsten waren Saul nagevolgd.", "15": "Doch David ging heen, en keerde terug van Saul, om de schapen van zijn vader te weiden te Bethlehem.", "16": "De Filistijn nu trad naar voren, 's morgens vroeg en 's avonds. Zo stelde hij zich daar veertig dagen lang op.", "17": "En Isaï zei tegen zijn zoon David: Neem toch voor uw broers een efa[1] van dit geroosterde koren, en deze tien broden, en breng ze snel naar het leger, naar uw broers.", "18": "Maar breng deze tien melkkazen naar de aanvoerder over duizend; en u zult naar uw broers omzien, of het hun goed gaat, en u zult van hen een teken meenemen.", "19": "Saul nu, en zij, en alle mannen van Israël waren bij het eikendal met de Filistijnen aan het strijden.", "20": "Toen maakte David zich 's morgens vroeg op, en hij liet de schapen bij de hoeder, en hij nam het op en ging heen, zoals Isaï hem bevolen had; en hij kwam bij de wagenburg, toen het leger in slagorde uittrok en men ten strijde riep.", "21": "En de Israëlieten en de Filistijnen stelden slagorde tegen slagorde op.", "22": "David nu liet zijn spullen achter bij de bewaarder van de spullen, en hij liep naar de slagorde toe; en hij kwam en vroeg zijn broers hoe het met hen ging.", "23": "Terwijl hij met hen sprak, zie, toen kwam de kampvechter naar boven; zijn naam was Goliath, de Filistijn uit Gath, uit het leger van de Filistijnen, en hij sprak dezelfde woorden als daarvoor; en David hoorde ze.", "24": "Doch alle mannen in Israël vluchtten voor hem weg toen zij die man zagen, en zij vreesden zeer.", "25": "En de mannen van Israël zeiden: Hebt u die man wel gezien, die is opgekomen? Want hij is opgekomen om Israël te honen; en het zal gebeuren dat de koning de man die hem verslaat, met grote rijkdom zal verrijken, en hij zal hem zijn dochter geven, en hij zal het huis van zijn vader vrijmaken in Israël.", "26": "Toen zei David tegen de mannen die bij hem stonden: Wat zal men de man doen die deze Filistijn verslaat en de smaad van Israël wegneemt? Want wie is deze onbesneden Filistijn, dat hij de slagorden van de levende God zou honen?", "27": "Weer zei het volk hem hetzelfde woord: Zo zal men de man doen die hem verslaat.", "28": "Toen Eliab, zijn oudste broer, hem tegen die mannen hoorde spreken, ontstak de toorn van Eliab tegen David, en hij zei: Waarom bent u nu hierheen gekomen, en bij wie hebt u die paar schapen in de woestijn gelaten? Ik ken uw overmoed en de slechtheid van uw hart wel; want u bent gekomen om de strijd te zien.", "29": "Toen zei David: Wat heb ik nu gedaan? Is er geen reden voor?", "30": "En hij wendde zich van hem af naar een ander toe, en zei hetzelfde; en het volk gaf hem weer hetzelfde antwoord als eerst.", "31": "Toen die woorden die David gesproken had, gehoord werden en aan Saul verteld werden, liet hij hem halen.", "32": "En David zei tegen Saul: Laat aan niemand het hart ontvallen om hem. Uw knecht zal gaan en met deze Filistijn strijden.", "33": "Maar Saul zei tegen David: U zult niet kunnen gaan om tegen deze Filistijn te strijden; want u bent een jongeman, en hij is een krijgsman van jongs af aan.", "34": "Toen zei David tegen Saul: Uw knecht weidde de schapen van zijn vader, en er kwam een leeuw en een beer, en nam een schaap uit de kudde weg.", "35": "En ik ging hem achterna, en sloeg hem, en redde het uit zijn muil; toen hij tegen mij opstond, greep ik hem bij zijn baard, en sloeg hem, en doodde hem.", "36": "Uw knecht heeft zowel de leeuw als de beer verslagen; zo zal het deze onbesneden Filistijn vergaan, zoals een van hen, omdat hij de slagorden van de levende God gehoond heeft.", "37": "Verder zei David: De HEERE, Die mij gered heeft uit de klauw van de leeuw en uit de klauw van de beer, Die zal mij redden uit de hand van deze Filistijn. Toen zei Saul tegen David: Ga heen, en de HEERE zij met u!", "38": "En Saul kleedde David met zijn kleren, en zette een koperen helm op zijn hoofd, en kleedde hem met een pantser.", "39": "En David gordde zijn zwaard aan over zijn kleren, en probeerde te lopen; want hij was er niet mee vertrouwd. Toen zei David tegen Saul: Ik kan hier niet in lopen, want ik ben er niet mee vertrouwd; en David deed ze weer uit.", "40": "En hij nam zijn staf in zijn hand, en koos zich vijf gladde stenen uit de beek, en legde ze in de herderstas die hij had, namelijk in de zak, en zijn slinger was in zijn hand; zo naderde hij de Filistijn.", "41": "De Filistijn ging ook op weg, en kwam dichterbij naar David toe, en zijn schilddrager ging voor hem uit.", "42": "Toen de Filistijn opkeek en David zag, verachtte hij hem; want hij was een jongeman, roodachtig, en daarbij mooi om te zien.", "43": "De Filistijn nu zei tegen David: Ben ik een hond, dat u met stokken naar mij toe komt? En de Filistijn vervloekte David bij zijn goden.", "44": "Daarna zei de Filistijn tegen David: Kom naar mij toe, dan zal ik uw vlees aan de vogels van de hemel geven, en aan de dieren van het veld.", "45": "David daarentegen zei tegen de Filistijn: U komt naar mij toe met een zwaard, en met een speer, en met een schild; maar ik kom naar u toe in de Naam van de HEERE van de heerscharen[2], de God van de slagorden van Israël, Die u gehoond hebt.", "46": "Vandaag zal de HEERE u overleveren in mijn hand, en ik zal u verslaan, en ik zal uw hoofd van u wegnemen, en ik zal de dode lichamen van het leger van de Filistijnen vandaag aan de vogels van de hemel en aan de dieren van het veld geven; en heel de aarde zal weten dat Israël een God heeft.", "47": "En heel deze verzameling zal weten dat de HEERE niet door zwaard of door speer verlost; want de strijd is van de HEERE, Die zal u in onze hand geven.", "48": "En het gebeurde, toen de Filistijn zich opmaakte en dichterbij kwam, David tegemoet, dat David zich haastte en naar de slagorde toe liep, de Filistijn tegemoet.", "49": "En David stak zijn hand in de tas, en nam er een steen uit, en slingerde die, en trof de Filistijn in zijn voorhoofd, zodat de steen in zijn voorhoofd wegzonk, en hij viel voorover op de grond.", "50": "Zo overweldigde David de Filistijn met een slinger en met een steen; en hij versloeg de Filistijn en doodde hem; doch David had geen zwaard in zijn hand.", "51": "Daarom liep David, en ging op de Filistijn staan, en nam zijn zwaard, en trok het uit zijn schede, en doodde hem, en hakte hem daarmee het hoofd af. Toen de Filistijnen zagen dat hun geweldigste dood was, vluchtten zij.", "52": "Toen maakten de mannen van Israël en Juda zich op, en juichten, en achtervolgden de Filistijnen tot waar men bij de vallei komt, en tot aan de poorten van Ekron; en de gewonden van de Filistijnen vielen op de weg naar Saäraïm, en tot aan Gath, en tot aan Ekron.", "53": "Daarna keerden de kinderen van Israël terug van het fel achtervolgen van de Filistijnen, en zij plunderden hun legerkampen.", "54": "Daarna nam David het hoofd van de Filistijn en bracht het naar Jeruzalem; maar zijn wapens legde hij in zijn tent.", "55": "Toen Saul David zag uitgaan, de Filistijn tegemoet, zei hij tegen Abner, de legeraanvoerder: Wiens zoon is deze jongeman, Abner? En Abner zei: Zo waarachtig als uw ziel leeft, o koning, ik weet het niet.", "56": "De koning nu zei: Vraag u het na, wiens zoon deze jongeman is.", "57": "Toen David terugkeerde van het verslaan van de Filistijn, nam Abner hem mee, en bracht hem voor Saul, met het hoofd van de Filistijn in zijn hand.", "58": "En Saul zei tegen hem: Wiens zoon bent u, jongeman? En David zei: Ik ben een zoon van uw knecht Isaï, de Bethlehemiet."}, "SV": {"1": "En de Filistijnen verzamelden hun heir ten strijde, en verzamelden zich te Socho, dat in Juda is; en zij legerden zich tussen Socho en tussen Azeka, aan het einde van Dammim.", "2": "Doch Saul en de mannen van Israël verzamelden zich, en legerden zich in het eikendal; en stelden de slagorde tegen de Filistijnen aan.", "3": "De Filistijnen nu stonden aan een berg aan gene, en de Israëlieten stonden aan een berg aan deze zijde; en de vallei was tussen hen.", "4": "Toen ging er een kampvechter uit, uit het leger der Filistijnen; zijn naam was Goliath, van Gath; zijn hoogte was zes ellen en een span.", "5": "En hij had een koperen helm op zijn hoofd, en hij had een schubachtig pantsier aan; en het gewicht van het pantsier was vijf duizend sikkelen kopers;", "6": "En een koperen scheenharnas boven zijn voeten, en een koperen schild tussen zijn schouders;", "7": "En de schacht zijner spies was als een weversboom, en het lemmer zijner spies was van zeshonderd sikkelen ijzers; en de schilddrager ging voor zijn aangezicht.", "8": "Deze nu stond, en riep tot de slagorden van Israël, en zeide tot hen: Waarom zoudt gijlieden uittrekken, om de slagorde te stellen? Ben ik niet een Filistijn, en gijlieden knechten van Saul? Kiest een man onder u, die tot mij afkome.", "9": "Indien hij tegen mij strijden en mij verslaan kan, zo zullen wij ulieden tot knechten zijn; maar indien ik hem overwin en hem sla, zo zult gij ons tot knechten zijn, en ons dienen.", "10": "Verder zeide de Filistijn: Ik heb heden de slagorden van Israël gehoond, *zeggende*: Geeft mij een man, dat wij te zamen strijden!", "11": "Toen Saul en het ganse Israël deze woorden van den Filistijn hoorden, zo ontzetten zij zich, en vreesden zeer.", "12": "David nu was de zoon van den Efrathischen man van Bethlehem-juda, wiens naam was Isaï, en *die* acht zonen had, en in de dagen van Saul was hij een man, oud, afgaande onder de mannen.", "13": "En de drie grootste zonen van Isaï gingen heen; zij volgden Saul na in den krijg. De namen nu zijner drie zonen, die in den krijg gingen, waren: Eliab, de eerstgeborene, en zijn tweede Abinadab, en de derde Samma.", "14": "En David was de kleinste; en de drie grootsten waren Saul nagevolgd.", "15": "Doch David ging henen, en kwam weder van Saul, om zijns vaders schapen te weiden te Bethlehem.", "16": "De Filistijn nu trad toe, des morgens vroeg en des avonds. Alzo stelde hij zich *daar* veertig dagen lang.", "17": "En Isaï zeide tot zijn zoon David: Neem toch voor uw broeders een efa van dit geroost koren, en deze tien broden, en breng ze terloops in het leger tot uw broederen.", "18": "Maar breng deze tien melkkazen aan de oversten over duizend; en gij zult uw broederen bezoeken, of het hun welga, en gij zult van hen pand medenemen.", "19": "Saul nu, en zij, en alle mannen van Israël waren bij het eikendal met de Filistijnen strijdende.", "20": "Toen maakte zich David des morgens vroeg op, en hij liet de schapen bij den hoeder, en hij nam het op, en ging henen, gelijk als Isaï hem bevolen had; en hij kwam aan den wagenburg, als het heir in slagorde uittoog, en men ten strijde riep.", "21": "En de Israëlieten en Filistijnen stelden slagorde tegen slagorde.", "22": "David nu liet de vaten van zich, onder de hand van den bewaarder der vaten, en hij liep ter slagorde; en hij kwam en vraagde zijn broederen naar *hun* welstand.", "23": "Toen hij met hen sprak, ziet, zo kwam de kampvechter op; zijn naam was Goliath, de Filistijn van Gath, uit het heir der Filistijnen, en hij sprak achtereenvolgens die woorden; en David hoorde ze.", "24": "Doch alle mannen in Israël, als zij dien man zagen, zo vluchtten zij voor zijn aangezicht, en zij vreesden zeer.", "25": "En de mannen Israëls zeiden: Hebt gijlieden dien man wel gezien, die opgekomen is? Want hij is opgekomen, om Israël te honen; en het zal geschieden, dat de koning dien man, die hem slaat, met groten rijkdom verrijken zal, en hij zal hem zijn dochter geven, en hij zal zijns vaders huis vrijmaken in Israël.", "26": "Toen zeide David tot de mannen, die bij hem stonden, zeggende: Wat zal men dien man doen, die dezen Filistijn slaat, en den smaad van Israël wendt? Want wie is deze onbesneden Filistijn, dat hij de slagorden van den levenden God zou honen?", "27": "Wederom zeide hem het volk achtervolgens dat woord, zeggende: Alzo zal men den man doen, die hem slaat.", "28": "Als Eliab, zijn grootste broeder, hem tot die mannen hoorde spreken, zo ontstak de toorn van Eliab tegen David, en hij zeide: Waarom zijt gij nu afgekomen, en onder wien hebt gij de weinige schapen in de woestijn gelaten? Ik ken uw vermetelheid, en de boosheid uws harten wel; want gij zijt afgekomen, opdat gij den strijd zaagt.", "29": "Toen zeide David: Wat heb ik nu gedaan? Is er geen oorzaak?", "30": "En hij wendde zich af van dien naar een anderen toe, en hij zeide achtereenvolgens dat woord; en het volk gaf hem weder antwoord, achtervolgens de eerste woorden.", "31": "Toen die woorden gehoord werden, die David gesproken had, en in de tegenwoordigheid van Saul verkondigd werden, zo liet hij hem halen.", "32": "En David zeide tot Saul: Aan geen mens ontvalle het hart, om zijnentwil. Uw knecht zal heengaan en hij zal met dezen Filistijn strijden.", "33": "Maar Saul zeide tot David: Gij zult niet kunnen heengaan tot dezen Filistijn, om met hem te strijden; want gij zijt een jongeling, en hij is een krijgsman van zijn jeugd af.", "34": "Toen zeide David tot Saul: Uw knecht weidde de schapen zijns vaders, en er kwam een leeuw en een beer, en nam een schaap van de kudde weg.", "35": "En ik ging uit hem na, en ik sloeg hem, en redde het uit zijn mond; toen hij tegen mij opstond, zo vatte ik hem bij zijn baard, en sloeg hem, en doodde hem.", "36": "Uw knecht heeft zo den leeuw als den beer geslagen; alzo zal deze onbesneden Filistijn zijn, gelijk een van die, omdat hij de slagorden van den levenden God gehoond heeft.", "37": "Verder zeide David: De HEERE, Die mij van de hand des leeuws gered heeft, en uit de hand des beers, Die zal mij redden uit de hand van dezen Filistijn. Toen zeide Saul tot David: Ga heen, en de HEERE zij met u!", "38": "En Saul kleedde David met zijn klederen, en zette een koperen helm op zijn hoofd, en kleedde hem met een pantsier.", "39": "En David gordde zijn zwaard aan over zijn klederen, en wilde gaan; want hij had het nooit verzocht. Toen zeide David tot Saul: Ik kan in deze niet gaan, want ik heb het nooit verzocht; en David leide ze van zich.", "40": "En hij nam zijn staf in zijn hand, en hij koos zich vijf gladde stenen uit de beek, en leide ze in de herderstas, die hij had, te weten in den zak, en zijn slinger was in zijn hand; alzo naderde hij tot den Filistijn.", "41": "De Filistijn ging ook heen, gaande en naderende tot David, en zijn schilddrager *ging* voor zijn aangezicht.", "42": "Toen de Filistijn opzag, en David zag, zo verachtte hij hem; want hij was een jongeling, roodachtig, mitsgaders schoon van aanzien.", "43": "De Filistijn nu zeide tot David: Ben ik een hond, dat gij tot mij komt met stokken? En de Filistijn vloekte David bij zijn goden.", "44": "Daarna zeide de Filistijn tot David: Kom tot mij, zo zal ik uw vlees aan de vogelen des hemels geven, en aan de dieren des velds.", "45": "David daarentegen zeide tot den Filistijn: gij komt tot mij met een zwaard, en met een spies, en met een schild; maar ik kom tot u in den Naam van den HEERE der heirscharen, den God der slagorden van Israël, Dien gij gehoond hebt.", "46": "Te dezen dage zal de HEERE u besluiten in mijn hand, en ik zal u slaan, en ik zal uw hoofd van u wegnemen, en ik zal de dode lichamen van der Filistijnen leger dezen dag aan de vogelen des hemels, en aan de beesten des velds geven; en de ganse aarde zal weten, dat Israël een God heeft.", "47": "En deze ganse vergadering zal weten, dat de HEERE niet door het zwaard, noch door de spies verlost; want de krijg is des HEEREN, Die zal ulieden in onze hand geven.", "48": "En het geschiedde, toen de Filistijn zich opmaakte, en heenging, en David tegemoet naderde, zo haastte David, en liep naar de slagorde toe, den Filistijn tegemoet.", "49": "En David stak zijn hand in de tas, en hij nam een steen daaruit, en hij slingerde, en trof den Filistijn in zijn voorhoofd; zodat de steen zonk in zijn voorhoofd, en hij viel op zijn aangezicht ter aarde.", "50": "Alzo overweldigde David den Filistijn met een slinger en met een steen; en hij versloeg den Filistijn, en doodde hem; doch David had geen zwaard in de hand.", "51": "Daarom liep David, en stond op den Filistijn, en nam zijn zwaard, en hij trok het uit zijn schede, en hij doodde hem, en hij hieuw hem het hoofd daarmede af. Toen de Filistijnen zagen, dat hun geweldigste dood was, zo vluchtten zij.", "52": "Toen maakten zich de mannen van Israël en van Juda op, en juichten, en vervolgden de Filistijnen, tot daar men komt aan de vallei, en tot aan de poorten van Ekron; en de verwonden der Filistijnen vielen op den weg van Saaraim, en tot aan Gath, en tot aan Ekron.", "53": "Daarna keerden de kinderen Israëls om, van het hittig najagen der Filistijnen, en zij beroofden hun legers.", "54": "Daarna nam David het hoofd van den Filistijn, en bracht het naar Jeruzalem; maar zijn wapenen leide hij in zijn tent.", "55": "Toen Saul David zag uitgaan den Filistijn tegemoet, zeide hij tot Abner, den krijgsoverste: Wiens zoon is deze jongeling, Abner? En Abner zeide: *Zo* *waarachtig* *als* uw ziel leeft, o koning! ik weet het niet.", "56": "De koning nu zeide: Vraag gij het, wiens zoon deze jongeling is.", "57": "Als David wederkeerde van het slaan des Filistijns, zo nam hem Abner, en hij bracht hem voor het aangezicht van Saul, en het hoofd van den Filistijn was in zijn hand.", "58": "En Saul zeide tot hem: Wiens zoon zijt gij, jongeling? En David zeide: Ik ben een zoon van uw knecht Isaï, den Bethlehemiet."}, "KJV": {"1": "Now the Philistines gathered together their armies to battle, and were gathered together at Shochoh, which belongeth to Judah, and pitched between Shochoh and Azekah, in Ephesdammim.", "2": "And Saul and the men of Israel were gathered together, and pitched by the valley of Elah, and set the battle in array against the Philistines.", "3": "And the Philistines stood on a mountain on the one side, and Israel stood on a mountain on the other side: and there was a valley between them.", "4": "And there went out a champion out of the camp of the Philistines, named Goliath, of Gath, whose height was six cubits and a span.", "5": "And he had an helmet of brass upon his head, and he was armed with a coat of mail; and the weight of the coat was five thousand shekels of brass.", "6": "And he had greaves of brass upon his legs, and a target of brass between his shoulders.", "7": "And the staff of his spear was like a weaver's beam; and his spear's head weighed six hundred shekels of iron: and one bearing a shield went before him.", "8": "And he stood and cried unto the armies of Israel, and said unto them, Why are ye come out to set your battle in array? am not I a Philistine, and ye servants to Saul? choose you a man for you, and let him come down to me.", "9": "If he be able to fight with me, and to kill me, then will we be your servants: but if I prevail against him, and kill him, then shall ye be our servants, and serve us.", "10": "And the Philistine said, I defy the armies of Israel this day; give me a man, that we may fight together.", "11": "When Saul and all Israel heard those words of the Philistine, they were dismayed, and greatly afraid.", "12": "Now David was the son of that Ephrathite of Bethlehemjudah, whose name was Jesse; and he had eight sons: and the man went among men for an old man in the days of Saul.", "13": "And the three eldest sons of Jesse went and followed Saul to the battle: and the names of his three sons that went to the battle were Eliab the firstborn, and next unto him Abinadab, and the third Shammah.", "14": "And David was the youngest: and the three eldest followed Saul.", "15": "But David went and returned from Saul to feed his father's sheep at Bethlehem.", "16": "And the Philistine drew near morning and evening, and presented himself forty days.", "17": "And Jesse said unto David his son, Take now for thy brethren an ephah of this parched corn, and these ten loaves, and run to the camp to thy brethren;", "18": "And carry these ten cheeses unto the captain of their thousand, and look how thy brethren fare, and take their pledge.", "19": "Now Saul, and they, and all the men of Israel, were in the valley of Elah, fighting with the Philistines.", "20": "And David rose up early in the morning, and left the sheep with a keeper, and took, and went, as Jesse had commanded him; and he came to the trench, as the host was going forth to the fight, and shouted for the battle.", "21": "For Israel and the Philistines had put the battle in array, army against army.", "22": "And David left his carriage in the hand of the keeper of the carriage, and ran into the army, and came and saluted his brethren.", "23": "And as he talked with them, behold, there came up the champion, the Philistine of Gath, Goliath by name, out of the armies of the Philistines, and spake according to the same words: and David heard them.", "24": "And all the men of Israel, when they saw the man, fled from him, and were sore afraid.", "25": "And the men of Israel said, Have ye seen this man that is come up? surely to defy Israel is he come up: and it shall be, that the man who killeth him, the king will enrich him with great riches, and will give him his daughter, and make his father's house free in Israel.", "26": "And David spake to the men that stood by him, saying, What shall be done to the man that killeth this Philistine, and taketh away the reproach from Israel? for who is this uncircumcised Philistine, that he should defy the armies of the living God?", "27": "And the people answered him after this manner, saying, So shall it be done to the man that killeth him.", "28": "And Eliab his eldest brother heard when he spake unto the men; and Eliab's anger was kindled against David, and he said, Why camest thou down hither? and with whom hast thou left those few sheep in the wilderness? I know thy pride, and the naughtiness of thine heart; for thou art come down that thou mightest see the battle.", "29": "And David said, What have I now done? Is there not a cause?", "30": "And he turned from him toward another, and spake after the same manner: and the people answered him again after the former manner.", "31": "And when the words were heard which David spake, they rehearsed them before Saul: and he sent for him.", "32": "And David said to Saul, Let no man's heart fail because of him; thy servant will go and fight with this Philistine.", "33": "And Saul said to David, Thou art not able to go against this Philistine to fight with him: for thou art but a youth, and he a man of war from his youth.", "34": "And David said unto Saul, Thy servant kept his father's sheep, and there came a lion, and a bear, and took a lamb out of the flock:", "35": "And I went out after him, and smote him, and delivered it out of his mouth: and when he arose against me, I caught him by his beard, and smote him, and slew him.", "36": "Thy servant slew both the lion and the bear: and this uncircumcised Philistine shall be as one of them, seeing he hath defied the armies of the living God.", "37": "David said moreover, The LORD that delivered me out of the paw of the lion, and out of the paw of the bear, he will deliver me out of the hand of this Philistine. And Saul said unto David, Go, and the LORD be with thee.", "38": "And Saul armed David with his armour, and he put an helmet of brass upon his head; also he armed him with a coat of mail.", "39": "And David girded his sword upon his armour, and he assayed to go; for he had not proved it. And David said unto Saul, I cannot go with these; for I have not proved them. And David put them off him.", "40": "And he took his staff in his hand, and chose him five smooth stones out of the brook, and put them in a shepherd's bag which he had, even in a scrip; and his sling was in his hand: and he drew near to the Philistine.", "41": "And the Philistine came on and drew near unto David; and the man that bare the shield went before him.", "42": "And when the Philistine looked about, and saw David, he disdained him: for he was but a youth, and ruddy, and of a fair countenance.", "43": "And the Philistine said unto David, Am I a dog, that thou comest to me with staves? And the Philistine cursed David by his gods.", "44": "And the Philistine said to David, Come to me, and I will give thy flesh unto the fowls of the air, and to the beasts of the field.", "45": "Then said David to the Philistine, Thou comest to me with a sword, and with a spear, and with a shield: but I come to thee in the name of the LORD of hosts, the God of the armies of Israel, whom thou hast defied.", "46": "This day will the LORD deliver thee into mine hand; and I will smite thee, and take thine head from thee; and I will give the carcases of the host of the Philistines this day unto the fowls of the air, and to the wild beasts of the earth; that all the earth may know that there is a God in Israel.", "47": "And all this assembly shall know that the LORD saveth not with sword and spear: for the battle is the LORD'S, and he will give you into our hands.", "48": "And it came to pass, when the Philistine arose, and came and drew nigh to meet David, that David hasted, and ran toward the army to meet the Philistine.", "49": "And David put his hand in his bag, and took thence a stone, and slang it, and smote the Philistine in his forehead, that the stone sunk into his forehead; and he fell upon his face to the earth.", "50": "So David prevailed over the Philistine with a sling and with a stone, and smote the Philistine, and slew him; but there was no sword in the hand of David.", "51": "Therefore David ran, and stood upon the Philistine, and took his sword, and drew it out of the sheath thereof, and slew him, and cut off his head therewith. And when the Philistines saw their champion was dead, they fled.", "52": "And the men of Israel and of Judah arose, and shouted, and pursued the Philistines, until thou come to the valley, and to the gates of Ekron. And the wounded of the Philistines fell down by the way to Shaaraim, even unto Gath, and unto Ekron.", "53": "And the children of Israel returned from chasing after the Philistines, and they spoiled their tents.", "54": "And David took the head of the Philistine, and brought it to Jerusalem; but he put his armour in his tent.", "55": "And when Saul saw David go forth against the Philistine, he said unto Abner, the captain of the host, Abner, whose son is this youth? And Abner said, As thy soul liveth, O king, I cannot tell.", "56": "And the king said, Enquire thou whose son the stripling is.", "57": "And as David returned from the slaughter of the Philistine, Abner took him, and brought him before Saul with the head of the Philistine in his hand.", "58": "And Saul said to him, Whose son art thou, thou young man? And David answered, I am the son of thy servant Jesse the Bethlehemite."}}, "tsk": {"1": [{"kopje": "verzamelden", "refs": ["1 Sam 7:7", "1 Sam 13:5", "1 Sam 14:46", "1 Sam 14:52", "Richt 3:3"]}, {"kopje": "Socho", "refs": ["Joz 15:35", "2 Kron 11:7", "2 Kron 28:18"]}, {"kopje": "Azeka", "refs": ["Joz 10:10", "Joz 10:11", "Joz 15:35", "Jer 34:7"]}, {"kopje": "Dammim", "refs": ["1 Kron 11:13"]}], "2": [{"kopje": "het eikendal", "refs": ["1 Sam 17:19", "1 Sam 21:9"]}], "4": [{"kopje": "Goliath", "refs": ["1 Sam 17:23", "1 Sam 21:9", "1 Sam 21:10", "2 Sam 21:19", "1 Kron 20:5"]}, {"kopje": "uit Gath", "refs": ["1 Sam 27:4", "Joz 11:22", "2 Sam 21:16-22", "1 Kron 20:4-8"]}, {"kopje": "zijn hoogte", "refs": ["Deut 3:11", "1 Kron 11:23", "Amos 2:9"]}], "5": [{"kopje": "pantser aan", "refs": ["1 Sam 17:38"]}], "6": [{"kopje": "koperen schild", "refs": ["1 Kon 10:16", "2 Kron 9:15"]}], "7": [{"kopje": "de schacht", "refs": ["2 Sam 21:19", "1 Kron 11:23", "1 Kron 20:5"]}], "8": [{"kopje": "knechten van Saul", "refs": ["1 Sam 17:26", "1 Sam 8:17", "2 Sam 11:11", "1 Kron 21:3"]}], "9": [{"kopje": "ons dienen", "refs": ", "href": "../../nave/a/?hl=1Sam.17.55#i148", "refs": [{"disp": "1 Sam 14:50", "href": "../../1-samuel/14/#v50", "ref": "1 Sam 14:50", "svLabel": null}, {"disp": "1 Sam 17:55", "href": "../../1-samuel/17/#v55", "ref": "1 Sam 17:55", "svLabel": null}, {"disp": "1 Sam 26:5", "href": "../../1-samuel/26/#v5", "ref": "1 Sam 26:5", "svLabel": null}, {"disp": "1 Sam 26:14", "href": "../../1-samuel/26/#v14", "ref": "1 Sam 26:14", "svLabel": null}], "kinderen": []}]}], "torrey": [{"topic": "Benjamin, Tribe Of", "href": "../../torrey/b/#t-benjamin-tribe-of", "kinderen": [{"label": "Celebrated persons of", "href": "../../torrey/b/?hl=1Sam.17.55#i1697", "refs": [], "kinderen": [{"label": "Abner", "href": "../../torrey/b/?hl=1Sam.17.55#i1701", "refs": [{"disp": "1 Sam 14:51", "href": "../../1-samuel/14/#v51", "ref": "1 Sam 14:51", "svLabel": null}, {"disp": "1 Sam 17:55", "href": "../../1-samuel/17/#v55", "ref": "1 Sam 17:55", "svLabel": null}], "kinderen": []}]}]}]}, "57": {"torrey": [{"topic": "Head", "href": "../../torrey/h/#t-head", "kinderen": [{"label": "Of enemies slain in war, often cut off", "href": "../../torrey/h/?hl=1Sam.17.57#i8398", "refs": [{"disp": "Richt 5:26", "href": "../../richteren/5/#v26", "ref": "Richt 5:26", "svLabel": null}, {"disp": "1 Sam 17:51", "href": "../../1-samuel/17/#v51", "ref": "1 Sam 17:51", "svLabel": null}, {"disp": "1 Sam 17:57", "href": "../../1-samuel/17/#v57", "ref": "1 Sam 17:57", "svLabel": null}, {"disp": "1 Sam 31:9", "href": "../../1-samuel/31/#v9", "ref": "1 Sam 31:9", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"1 Kron 20:5": "Daarna was er nog een oorlog tegen de Filistijnen, en Elhanan, de zoon van Jaïr, versloeg Lachmi, de broer van Goliath, de Gethiet, wiens speerhout was als een weversboom.", "Matt 17:26": "Petrus zei tegen Hem: Van vreemden. Jezus zei tegen hem: Dan zijn de zonen dus vrij.", "Ef 2:15": "doordat Hij de vijandschap in Zijn vlees teniet gemaakt heeft, namelijk de wet van de geboden die in inzettingen bestond; opdat Hij die twee in Zichzelf tot één nieuwe mens zou scheppen, en zo vrede zou maken;", "Deut 5:26": "Want wie is er van alle vlees, die de stem van de levende God, sprekend uit het midden van het vuur, gehoord heeft zoals wij, en is levend gebleven?", "Fil 4:13": "Ik kan alle dingen door Christus, Die mij kracht geeft.", "Ps 4:4": "Weet toch, dat de HEERE Zich een gunstgenoot heeft afgezonderd; de HEERE zal horen, als ik tot Hem roep.", "1 Sam 17:43-45": "De Filistijn nu zei tegen David: Ben ik een hond, dat u met stokken naar mij toe komt? En de Filistijn vervloekte David bij zijn goden. Daarna zei de Filistijn tegen David: Kom naar mij toe, dan zal ik uw vlees aan de vogels van de hemel geven, en aan de dieren van het veld. David daarentegen zei tegen de Filistijn: U komt naar mij toe met een zwaard, en met een speer, en met een schild; maar ik kom naar u toe in de Naam van de HEERE van de heerscharen, de God van de slagorden van Israël, Die u gehoond hebt.", "Ps 73:26": "Bezwijkt mijn vlees en mijn hart, dan is God de Rotssteen van mijn hart, en mijn Deel in eeuwigheid.", "Deut 31:23": "En Hij gebood Jozua, de zoon van Nun, en zei: Wees sterk en heb goede moed, want u zult de kinderen van Israël brengen in het land, dat Ik hun gezworen heb; en Ik zal met u zijn.", "Rom 1:11": "Want ik verlang ernaar u te zien, opdat ik u enige geestelijke gave zou mogen meedelen, opdat u versterkt zou worden;", "Richt 6:19": "En Gideon ging naar binnen, en maakte een geitenbokje klaar, en ongezuurde koeken van een efa meel; het vlees legde hij in een mand, en het vleesnat deed hij in een pot; en hij bracht het naar Hem toe, onder de eik, en zette het neer.", "Ps 119:126": "Het is tijd voor de HEERE, dat Hij werkt, want zij hebben Uw wet verbroken.", "Jer 10:10": "Maar de HEERE God is de Waarheid, Hij is de levende God, en een eeuwige Koning; van Zijn verbolgenheid beeft de aarde, en de heidenen kunnen Zijn gramschap niet verdragen.", "Ps 77:12": "Ik zal de daden van de HEERE gedenken; ja, ik zal Uw wonderen van vroeger gedenken;", "2 Sam 21:21": "En hij hoonde Israël; maar Jonathan, de zoon van Simea, Davids broer, sloeg hem.", "Richt 11:29": "Toen kwam de Geest van de HEERE op Jeftha, zodat hij Gilead en Manasse doortrok; want hij trok door tot Mizpa in Gilead, en van Mizpa in Gilead trok hij door naar de kinderen van Ammon.", "Jes 37:28": "Maar Ik weet uw zitten, en uw uitgaan, en uw binnenkomen, en uw woede tegen Mij.", "Joz 4:7": "Zo zult u tegen hen zeggen: Omdat de wateren van de Jordaan zijn afgesneden geweest voor de ark van het verbond van de HEERE; toen zij door de Jordaan trok, werden de wateren van de Jordaan afgesneden; zo zullen deze stenen de kinderen van Israël tot een gedachtenis zijn tot in eeuwigheid.", "Ps 51:15": "Zo zal ik de overtreders Uw wegen leren; en de zondaars zullen zich tot U bekeren.", "1 Sam 16:21": "Zo kwam David bij Saul, en stond voor hem; en hij hield veel van hem, en hij werd zijn wapendrager.", "Ps 43:5": "Wat buigt u zich neer, o mijn ziel! En wat bent u onrustig in mij? Hoop op God, want ik zal Hem nog loven; Hij is de rijke Verlossing van mijn aangezicht, en mijn God.", "Matt 8:23-27": "En toen Hij in het schip gegaan was, volgden Zijn discipelen Hem. En zie, er ontstond een grote storm op de zee, zodat het schip door de golven bedekt werd; maar Hij sliep. En Zijn discipelen kwamen bij Hem en maakten Hem wakker, en zeiden: Heere, red ons, wij vergaan!", "Ps 62:6-8": "Maar u, o mijn ziel! zwijg voor God; want van Hem is mijn verwachting. Hij is zeker mijn Rots en mijn Heil, mijn Hoog Vertrek; ik zal niet wankelen. In God is mijn Heil en mijn Eer; de Rots van mijn sterkte, mijn Toevlucht is in God.", "1 Kon 14:3": "En neem in uw hand tien broden, en koeken, en een kruik honing, en ga naar hem toe; hij zal u vertellen wat er met deze jongen gebeuren zal.", "Gen 8:21": "En de HEERE rook die liefelijke reuk, en de HEERE zei in Zijn hart: Ik zal voortaan de aardbodem niet meer vervloeken om de mens; want het gedichtsel van het hart van de mens is slecht van zijn jeugd aan; en Ik zal voortaan niet meer al het levende slaan, zoals Ik gedaan heb.", "Ex 4:1": "Toen antwoordde Mozes, en zei: Maar zie, zij zullen mij niet geloven, en niet naar mijn stem luisteren; want zij zullen zeggen: De HEERE is u niet verschenen!", "Joz 4:24": "Opdat alle volken van de aarde de hand van de HEERE zouden kennen, dat die sterk is; opdat u de HEERE, uw God, vreest, alle dagen.", "Ps 70:6": "Doch ik ben ellendig en nooddruftig; o God, haast U tot mij; Gij zijt mijn Hulp en mijn Bevrijder; HEERE, vertoef niet!", "2 Kor 10:5": "Waarbij wij de overleggingen neerwerpen, en alle hoogte die zich verheft tegen de kennis van God, en elke gedachte gevangennemen tot de gehoorzaamheid van Christus;", "2 Sam 23:9": "En na hem was Eleazar, de zoon van Dodo, zoon van Ahohi; deze was onder de drie helden met David, toen zij de Filistijnen beschimpten, die daar ten strijde verzameld waren, en de mannen van Israël waren teruggetrokken.", "1 Sam 16:7": "Doch de HEERE zei tegen Samuël: Kijk niet naar zijn gestalte, en ook niet naar zijn lange lengte, want Ik heb hem verworpen; want het is niet zoals de mens ziet; want de mens kijkt naar wat voor ogen is, maar de HEERE kijkt naar het hart.", "Ps 42:6": "Wat buigt u zich neer, o mijn ziel! En bent u onrustig in mij? Hoop op God, want ik zal Hem nog loven voor de verlossingen van Zijn aangezicht.", "Ps 94:15": "Want het oordeel zal terugkeren tot de gerechtigheid; en alle oprechten van hart zullen dat navolgen.", "Ps 39:8": "En nu, wat verwacht ik, Heere? Mijn hoop is op U.", "Matt 1:6": "en Isaï verwekte David, de koning; en David, de koning, verwekte Salomo bij haar die de vrouw van Uria geweest was;", "2 Kron 14:11": "En Asa riep tot de HEERE, zijn God, en zei: HEERE, het is voor U niets, te helpen hetzij de machtige, hetzij de krachteloze; help ons, o HEERE, onze God! Want wij steunen op U, en in Uw Naam zijn wij gekomen tegen deze menigte; o HEERE! U bent onze God; laat een sterfelijk mens tegen U niets vermogen.", "1 Sam 24:20": "Wanneer iemand zijn vijand gevonden heeft, zal hij hem dan ongedeerd zijn weg laten gaan? De HEERE nu vergeldt u het goede, voor deze dag die u mij heden aangedaan hebt.", "Ps 138:7": "Als ik wandel in het midden van de benauwdheid, maakt Gij mij levend; Uw hand strekt Gij uit tegen de toorn van mijn vijanden, en Uw rechterhand behoudt mij.", "Job 20:24": "Hij zal vluchten voor de ijzeren wapens, de stalen boog zal hem doorschieten.", "Ps 17:6": "Ik roep U aan, omdat U mij verhoort; o God! Neig Uw oor tot mij; hoor mijn woorden.", "1 Sam 30:6": "En David werd erg bang, want het volk sprak ervan hem te stenigen; want de zielen van heel het volk waren verbitterd, ieder over zijn zonen en over zijn dochters; maar David sterkte zich in de HEERE, zijn God.", "2 Sam 23:5": "Hoewel mijn huis zo niet is bij God, heeft Hij mij toch een eeuwig verbond gesteld, dat in alles goed geordend en bewaard is; zeker is daarin al mijn heil, en alle lust, hoewel Hij het nog niet laat uitspruiten.", "1 Kron 20:4-8": "En het gebeurde daarna, toen de oorlog met de Filistijnen bij Gezer opstond, dat Sibchai, de Husathiet, toen Sippai versloeg, die van de kinderen van Rafa was; en zij werden onderworpen. Daarna was er nog een oorlog tegen de Filistijnen, en Elhanan, de zoon van Jaïr, versloeg Lachmi, de broer van Goliath, de Gethiet, wiens speerhout was als een weversboom. Daarna was er nog een oorlog bij Gath; en daar was een zeer lange man, en zijn vingers en tenen waren zes en zes, vierentwintig, en hij was ook geboren uit Rafa;", "Ps 27:1-3": "Een psalm van David. De HEERE is mijn Licht en mijn Heil, voor wie zou ik vrezen? De HEERE is de kracht van mijn leven, voor wie zou ik bang zijn? Toen de bozen, mijn tegenpartijen en mijn vijanden, tegen mij naar mij toe kwamen om mijn vlees te eten, stieten zij zelf aan en vielen. Ofschoon een leger mij belegerde, mijn hart zou niet vrezen; ofschoon een oorlog tegen mij opstond, toch vertrouw ik hierop.", "Ef 6:21": "En opdat ook u mag weten hoe het met mij gaat; en wat ik doe, dat alles zal Tychikus u bekendmaken, de geliefde broeder en trouwe dienaar in de Heere;", "Hand 5:25": "En er kwam iemand, en berichtte hun, en zei: Zie, de mannen die u in de gevangenis gezet hebt, staan in de tempel, en leren het volk.", "Hand 5:29-32": "Maar Petrus en de apostelen antwoordden, en zeiden: Men moet God meer gehoorzaam zijn dan de mensen. De God van onze vaderen heeft Jezus opgewekt, Die u omgebracht hebt, door Hem aan het hout te hangen. Deze heeft God door Zijn rechterhand verhoogd tot een Vorst en Zaligmaker, om Israël bekering en vergeving van zonden te geven.", "1 Sam 7:7": "Toen de Filistijnen hoorden dat de kinderen van Israël zich verzameld hadden te Mizpa, kwamen de leiders van de Filistijnen op tegen Israël. Toen de kinderen van Israël dat hoorden, werden zij bang voor de Filistijnen.", "Hand 24:15": "Terwijl ik hoop heb op God, welke ook zijzelf verwachten, dat er een opstanding van de doden zal zijn, van de rechtvaardigen zowel als van de onrechtvaardigen.", "2 Sam 23:21": "Daarbij versloeg hij een Egyptische man, een man van aanzien; en in de hand van de Egyptenaar was een speer, maar hij ging op hem af met een staf; en hij rukte de speer uit de hand van de Egyptenaar, en doodde hem met zijn eigen speer.", "2 Sam 23:10": "Deze stond op en sloeg onder de Filistijnen, totdat zijn hand moe werd, ja, zijn hand aan het zwaard kleefde; en de HEERE bracht een grote overwinning tot stand op die dag; en het volk keerde terug achter hem aan, alleen om te plunderen.", "2 Kon 9:24": "Maar Jehu spande de boog met volle kracht, en schoot Joram tussen zijn armen, zodat de pijl door zijn hart naar buiten kwam; en hij zeeg neer in zijn wagen.", "Ps 123:3": "Wees ons genadig, HEERE! Wees ons genadig, want wij zijn de verachting veel te zat.", "Ps 48:9": "Zoals wij gehoord hadden, zo hebben wij gezien in de stad van de HEERE van de heerscharen, in de stad van onze God; God zal haar bevestigen tot in eeuwigheid. Sela.", "Jes 33:22": "Want de HEERE is onze Rechter, de HEERE is onze Wetgever, de HEERE is onze Koning. Hij zal ons redden.", "Jes 8:10": "Beraadslaag een plan, toch zal het vernietigd worden; spreek een woord, toch zal het niet standhouden; want God is met ons!", "1 Kon 22:34": "Toen spande een man zijn boog, zomaar, zonder te mikken, en schoot de koning van Israël tussen de gespen en het pantser. Toen zei hij tegen zijn voerman: Keer uw hand, en breng mij uit het leger, want ik ben zwaar gewond.", "Ps 71:1": "Op U, o HEERE! vertrouw ik; laat mij niet beschaamd worden in eeuwigheid.", "Hand 27:25": "Daarom, houd moed, mannen, want ik geloof God, dat het zo zal zijn zoals het mij gezegd is.", "Rom 10:1": "Broeders, de toegenegenheid van mijn hart en het gebed dat ik tot God doe voor Israël, is tot hun zaligheid.", "Deut 32:29": "O, dat zij wijs waren; zij zouden dit vernemen, zij zouden op hun einde letten.", "2 Kon 3:25": "De steden nu braken zij af, en ieder wierp zijn steen op alle goede stukken land, en zij vulden ze, en stopten alle waterfonteinen dicht, en velden alle goede bomen, totdat zij in Kir-hareseth alleen de stenen daarvan lieten overblijven; en de slingeraars omsingelden en sloegen de stad.", "Deut 20:4": "Want het is de HEERE, uw God, Die met u meegaat, om voor u te strijden tegen uw vijanden, om u te verlossen.", "Ps 142:6": "Tot U riep ik, o HEERE! Ik zei: U bent mijn Toevlucht, mijn Deel in het land van de levenden.", "Ps 118:7": "De HEERE is bij mij onder degenen die mij helpen; daarom zal ik mijn lust zien aan degenen die mij haten.", "Dan 3:18": "Maar als dat niet zo is, laat het u bekend zijn, o koning, dat wij uw goden niet zullen eren, en ook het gouden beeld, dat u hebt opgericht, niet zullen aanbidden.", "Num 13:33": "Wij hebben daar ook de reuzen gezien, en de kinderen van Enak, van de reuzen; en wij waren als sprinkhanen in onze ogen, en zo waren wij ook in hun ogen.", "2 Sam 22:22-24": "Want ik heb de wegen van de HEERE gehouden, en ben van mijn God niet goddeloos afgegaan. Want al Zijn rechten waren voor mij, en Zijn inzettingen, daarvan week ik niet af. Maar ik was oprecht voor Hem; en ik wachtte mij voor mijn ongerechtigheid.", "Jes 56:9": "Alle dieren van het veld, kom om te eten, ja, alle dieren in het woud!", "1 Kron 2:3-15": "De kinderen van Juda zijn: Er, en Onan, en Sela; drie zijn hem geboren van de dochter van Sua, de Kanaänietische; en Er, de eerstgeborene van Juda, was slecht in de ogen van de HEERE; daarom doodde Hij hem. Maar Thamar, zijn schoondochter, baarde hem Perez en Zerah. Al de zonen van Juda waren vijf. De kinderen van Perez waren Hezron en Hamul.", "Ps 46:8": "De HEERE van de heerscharen is met ons; de God van Jakob is ons een Hoog Vertrek. Sela.", "Ezech 45:24": "Ook zal hij een spijsoffer klaarmaken, een efa bij een var, en een efa bij een ram; en een hin olie bij een efa.", "Richt 1:2": "En de HEERE zei: Juda zal optrekken; zie, Ik heb dat land in zijn hand gegeven.", "1 Kon 20:11": "Maar de koning van Israël antwoordde en zei: Spreekt tot hem: Die zich aangordt, beroemt zich niet, als die zich los maakt.", "Ps 27:1": "Een psalm van David. De HEERE is mijn Licht en mijn Heil, voor wie zou ik vrezen? De HEERE is de kracht van mijn leven, voor wie zou ik bang zijn?", "Kol 4:7-11": "Al mijn zaken zal Tychikus u bekendmaken, de geliefde broeder, en trouwe dienaar, en mededienstknecht in de Heere; hem heb ik met dit doel naar u toe gestuurd, opdat hij weet hoe het met u gaat, en uw harten troost; samen met Onesimus, de trouwe en geliefde broeder, die één van u is; zij zullen u alles bekendmaken wat hier gebeurt.", "1 Sam 17:45-47": "David daarentegen zei tegen de Filistijn: U komt naar mij toe met een zwaard, en met een speer, en met een schild; maar ik kom naar u toe in de Naam van de HEERE van de heerscharen, de God van de slagorden van Israël, Die u gehoond hebt. Vandaag zal de HEERE u overleveren in mijn hand, en ik zal u verslaan, en ik zal uw hoofd van u wegnemen, en ik zal de dode lichamen van het leger van de Filistijnen vandaag aan de vogels van de hemel en aan de dieren van het veld geven; en heel de aarde zal weten dat Israël een God heeft. En heel deze verzameling zal weten dat de HEERE niet door zwaard of door speer verlost; want de strijd is van de HEERE, Die zal u in onze hand geven.", "Job 14:15": "Dat U zou roepen, en ik U zou antwoorden, dat U naar het werk van Uw handen zou verlangen.", "Ps 16:11": "U zult mij het pad van het leven bekendmaken; overvloed van vreugde is bij Uw aangezicht; liefelijkheden zijn in Uw rechterhand, eeuwig.", "Ps 116:14": "Mijn geloften zal ik de HEERE betalen, nu, in de tegenwoordigheid van heel Zijn volk.", "Ps 71:18": "Daarom ook, terwijl het ouderdom en de grijsheid daar zijn, verlaat mij niet, o God, totdat ik aan dit geslacht Uw arm verkondig, aan alle nakomelingen Uw macht.", "Ps 18:2-4": "Hij zei dan: Ik zal U hartelijk liefhebben, HEERE, mijn Sterkte! De HEERE is mijn Steenrots, en mijn Burg, en mijn Uithelper; mijn God, mijn Rots, op Wie ik vertrouw; mijn Schild, en de Hoorn van mijn heil, mijn Hoog Vertrek. Ik riep de HEERE aan, die te prijzen is, en werd verlost van mijn vijanden.", "Ps 66:16": "Komt, hoort toe, allen die God vrezen, en ik zal vertellen wat Hij aan mijn ziel gedaan heeft.", "Deut 9:19": "Want ik vreesde vanwege de toorn en de grimmigheid waarmee de HEERE zeer op u vertoornd was, om u te verdelgen; toch verhoorde de HEERE mij ook op dat moment.", "1 Sam 25:18": "Toen haastte Abigaïl zich, en nam tweehonderd broden, en twee lederzakken wijn, en vijf toebereide schapen, en vijf maten geroosterd koren, en honderd stukken rozijnen, en tweehonderd klompen vijgen, en legde die op ezels.", "Ps 119:8": "Ik zal Uw inzettingen bewaren; verlaat mij niet al te zeer.", "Ps 16:5": "De HEERE is het deel van mijn erfenis en van mijn beker; U onderhoudt mijn lot.", "Jes 51:12": "Ik, Ik ben het, Die u troost; wie bent u, dat u vreest voor de mens, die sterven zal? En voor het kind van een mens, dat hooi worden zal?", "Joz 7:8": "Och, Heere! Wat zal ik zeggen, nu Israël voor het aangezicht van zijn vijanden de rug heeft gekeerd?", "Gen 50:20": "U wel, u hebt kwaad tegen mij gedacht; doch God heeft dat ten goede gedacht; opdat Hij deed, zoals het op deze dag is, om een groot volk in het leven te behouden.", "2 Sam 7:28": "Nu dan, Heere HEERE! U bent die God, en Uw woorden zullen waarheid zijn, en U hebt dit goede tot Uw knecht gesproken.", "1 Kon 8:42": "(want zij zullen horen van Uw grote Naam, en van Uw sterke hand, en van Uw uitgestrekte arm) wanneer hij komen en bidden zal in dit huis;", "Ps 89:27": "Hij zal Mij noemen: Gij zijt mijn Vader! mijn God, en de Rotssteen van mijn heil!", "1 Kon 20:28": "En de man van God trad toe, en sprak tegen de koning van Israël, en zei: Zo zegt de HEERE: Omdat de Syriërs gezegd hebben: De HEERE is een God van de bergen, en Hij is niet een God van de laagten; zo zal Ik al deze grote menigte in uw hand geven, opdat u weet, dat Ik de HEERE ben.", "Ezech 45:13": "Dit is het hefoffer dat u brengen zult: het zesde deel van een efa van een homer tarwe; ook zult u het zesde deel van een efa geven van een homer gerst.", "Ps 18:30": "Want met U loop ik door een bende, en met mijn God spring ik over een muur.", "Ps 55:24": "Maar U, o God! zult hen doen neerdalen in de put van het verderf; de mannen van het bloed en het bedrog zullen hun dagen niet tot de helft brengen; ik, daarentegen, zal op U vertrouwen.", "Ps 116:7": "Mijn ziel, keer terug tot uw rust, want de HEERE heeft u goedgedaan.", "Gen 48:21": "Daarna zei Israël tegen Jozef: Zie, ik sterf; maar God zal met u zijn, en Hij zal u terugbrengen naar het land van uw vaders.", "Jer 16:19": "O HEERE! U bent mijn Sterkte, en mijn Sterkheid, en mijn Toevlucht ten dage van de benauwdheid; tot U zullen de heidenen komen van de einden van de aarde, en zeggen: Zeker hebben onze vaders leugen erfelijk bezeten, en ijdelheid, waarin toch niets was, dat nut deed.", "Ps 119:158": "Ik heb gezien degenen, die trouweloos handelen, en het verdroot mij, dat zij Uw woord niet onderhielden.", "Richt 6:16": "En de HEERE zei tegen hem: Omdat Ik met u zal zijn, zult u de Midianieten verslaan alsof het één man was.", "2 Kron 20:12": "O, onze God, zult U geen recht over hen oefenen? Want in ons is geen kracht tegen deze grote menigte, die tegen ons optrekt, en wij weten niet wat wij moeten doen; maar onze ogen zijn op U gericht.", "Jes 7:2": "Toen men het huis van David boodschapte en zei: De Syriërs liggen bij Efraïm, bewoog zijn hart zich, en het hart van zijn volk, zoals de bomen van het woud bewegen door de wind.", "Ps 6:9": "Wijk van mij, alle werkers van de ongerechtigheid; want de HEERE heeft de stem van mijn geween gehoord.", "Jer 46:4": "Spant de paarden aan, en klimt op, ruiters! En stelt u op met helmen; veegt de speren, trekt de pantsers aan!", "2 Kron 13:11": "En zij steken voor de HEERE brandoffers aan, op elke morgen en op elke avond, ook reukwerk van welriekende specerijen, met de bereiding van het brood op de reine tafel, en de gouden kandelaar en zijn lampen, om die elke avond te laten branden; want wij nemen de wacht van de HEERE, onze God, waar; maar u hebt Hem verlaten.", "Ruth 4:18-22": "Dit nu zijn de geboorten van Perez: Perez verwekte Hezron; En Hezron verwekte Ram; en Ram verwekte Amminadab; En Amminadab verwekte Nahesson; en Nahesson verwekte Salma;", "Hand 9:5": "En hij zei: Wie bent U, Heere? En de Heere zei: Ik ben Jezus, Die u vervolgt. Het is u hard, de hielen tegen de prikkels te slaan.", "Matt 2:6": "En u, Bethlehem, land van Juda! U bent geenszins de minste onder de vorsten van Juda; want uit u zal de Leidsman voortkomen, Die Mijn volk Israël weiden zal.", "Ps 44:8": "Maar U verlost ons van onze tegenstanders, en U maakt onze haters beschaamd.", "Richt 7:19-23": "Zo kwam Gideon, en honderd mannen die met hem waren, aan het uiterste van het leger, aan het begin van de middelste nachtwaak, net toen zij de wachters gesteld hadden; en zij bliezen op de bazuinen, en sloegen de kruiken die in hun hand waren stuk. Zo bliezen de drie groepen op de bazuinen, en braken de kruiken; en zij hielden met de linkerhand de fakkels vast, en met hun rechterhand de bazuinen om te blazen; en zij riepen: Het zwaard van de HEERE, en van Gideon! En zij bleven staan, ieder op zijn plaats, rondom het leger. Toen liep het hele leger uiteen, en zij schreeuwden en vluchtten.", "Job 19:25-27": "Want ik weet: mijn Verlosser leeft, en Hij zal als de laatste over het stof opstaan; En als zij na mijn huid dit doorknaagd zullen hebben, zal ik uit mijn vlees God aanschouwen; Aan Wie ik voor mij aanschouwen zal, en mijn ogen zien zullen, en niet een vreemde; mijn nieren verlangen zeer in mijn schoot.", "2 Sam 21:19": "Verder was er nog een oorlog te Gob tegen de Filistijnen; en Elhanan, de zoon van Jaäre-Oregim, de Bethlehemiet, sloeg de broer van Goliath, de Gethiet, wiens speersteel was als een weversboom.", "Deut 31:6-8": "Wees sterk en heb goede moed, en vrees niet, en schrik niet voor hen; want het is de HEERE, uw God, Die met u meegaat; Hij zal u niet loslaten, en u niet verlaten. En Mozes riep Jozua, en zei tegen hem voor de ogen van heel Israël: Wees sterk en heb goede moed, want u zult met dit volk gaan in het land dat de HEERE hun vaderen gezworen heeft hun te zullen geven; en u zult het hun laten erven. De HEERE nu is Degene, Die voor u uitgaat; Die zal met u zijn; Hij zal u niet loslaten, en u niet verlaten; vrees niet, en wees niet ontsteld.", "Micha 3:8": "Maar waarlijk, ik ben vol van de kracht van de Geest van de HEERE; en vol van gericht en dapperheid, om Jakob zijn overtreding te verkondigen, en Israël zijn zonde.", "Openb 3:12": "Wie overwint, hem zal Ik maken tot een pilaar in de tempel van Mijn God, en hij zal daar niet meer uitgaan; en Ik zal op hem de Naam van Mijn God schrijven, en de naam van de stad van Mijn God, namelijk het nieuwe Jeruzalem, dat uit de hemel neerdaalt van Mijn God vandaan, en ook Mijn nieuwe Naam.", "2 Kor 4:16-18": "Daarom worden wij niet moedeloos; maar hoewel onze uitwendige mens verdorven wordt, wordt toch de inwendige vernieuwd van dag tot dag. Want onze lichte verdrukking, die zeer haast voorbijgaat, brengt ons een geheel bijzonder groot en eeuwig gewicht van heerlijkheid; Omdat wij niet letten op de dingen die men ziet, maar op de dingen die men niet ziet; want de dingen die men ziet, zijn tijdelijk, maar de dingen die men niet ziet, zijn eeuwig.", "Gen 37:14": "En hij zei tegen hem: Ga toch heen, zie naar het welzijn van uw broers en naar het welzijn van de kudde, en breng mij een woord terug. Zo zond hij hem uit het dal Hebron, en hij kwam te Sichem.", "Ps 130:5": "Ik verwacht de HEERE; mijn ziel verwacht, en ik hoop op Zijn Woord.", "Jer 30:16": "Daarom, allen die u opeten, zullen opgegeten worden, en al uw tegenstanders, zij allen zullen in gevangenschap gaan; en die u beroven, zullen tot beroving zijn, en allen die u plunderen, zal Ik tot plundering overgeven.", "1 Kon 20:18": "En hij zei: Of zij nu tot vrede uitgetrokken zijn, grijpt hen levend; of ook, dat zij ten strijde uitgetrokken zijn, grijpt hen levend.", "2 Sam 3:8": "Toen ontstak Abner in grote woede over de woorden van Isboseth, en zei: Ben ik dan een hondenkop, ik, die tegen Juda, aan het huis van Saul, uw vader, aan zijn broers en aan zijn vrienden, tot op vandaag trouw bewijs, en u niet in Davids hand overgeleverd heb, dat u mij vandaag beschuldigt vanwege de schuld met deze vrouw?", "2 Sam 16:1": "Toen David een klein stuk voorbij de top gegaan was, zie, daar ontmoette Ziba hem, de knecht van Mefiboseth, met een paar gezadelde ezels, en daarop tweehonderd broden, honderd stukken rozijnen, honderd stukken zomervruchten en een leren zak wijn.", "Gen 37:11": "Zijn broers benijdden hem; maar zijn vader bewaarde deze zaak.", "Ex 14:15": "Toen zei de HEERE tegen Mozes: Wat roept u tot Mij? Zeg tegen de kinderen van Israël dat zij verder trekken.", "Spr 28:4": "Wie de wet verlaten, prijzen de goddelozen; maar wie de wet bewaren, gaan de strijd met hen aan.", "Ps 124:8": "Onze hulp is in de Naam van de HEERE, Die hemel en aarde gemaakt heeft.", "Ps 42:7": "O mijn God! Mijn ziel buigt zich neer in mij, daarom denk ik aan U vanuit het land van de Jordaan en de Hermon, vanuit het kleine gebergte.", "Jer 14:9": "Waarom zou U zijn als een verschrikte man, als een held die niet kan verlossen? U bent toch in het midden van ons, o HEERE! En wij zijn naar Uw Naam genoemd; verlaat ons niet.", "Num 5:15": "Dan zal die man zijn huisvrouw tot de priester brengen, en zal haar offerande voor haar meebrengen, een tiende deel van een efa gerstemeel; hij zal geen olie daarop gieten, en geen wierook daarop leggen, omdat het een spijsoffer van de ijveringen is, een spijsoffer van de gedachtenis, dat de ongerechtigheid in gedachtenis brengt.", "Jer 26:12-15": "Maar Jeremia sprak tot al de vorsten en tot al het volk, en zei: De HEERE heeft mij gezonden, om tegen dit huis en tegen deze stad te profeteren al de woorden die u gehoord hebt; Nu dan, maak uw wegen en uw daden goed, en gehoorzaam de stem van de HEERE, uw God; dan zal het de HEERE berouwen over het kwaad dat Hij tegen u gesproken heeft. Maar ik, zie, ik ben in uw handen; doe met mij zoals het goed en recht is in uw ogen;", "1 Sam 31:9": "En zij hakten zijn hoofd af, en trokken zijn wapenrusting uit, en zonden die in het land van de Filistijnen rondom, om het bekend te maken in het huis van hun afgoden en onder het volk.", "Ps 40:8-11": "Toen zei ik: Zie, ik kom; in de rol van het boek is van mij geschreven. Ik heb lust, o mijn God! om Uw welbehagen te doen; en Uw wet is in het midden van mijn ingewand. Ik verkondig de gerechtigheid in de grote gemeente; zie, mijn lippen bedwing ik niet; HEERE! Gij weet het.", "Jes 37:23": "Wie hebt u gehoond en gelasterd, en tegen wie hebt u de stem verheven en uw ogen omhoog opgeheven? Tegen de Heilige van Israël!", "Hebr 11:14": "Want wie zulke dingen zeggen, laten daarmee duidelijk zien dat zij een vaderland zoeken.", "Num 22:11": "Zie, er is een volk uit Egypte getrokken, dat het gezicht van het land bedekt; kom nu, vervloek het voor mij; misschien kan ik dan tegen hen strijden, of hen verdrijven.", "Ezech 46:7": "En als spijsoffer zal hij bereiden een efa bij de var, en een efa bij de ram; maar bij de lammeren, naar wat zijn hand kan opbrengen; en een hin olie bij een efa.", "Ps 56:12": "Ik vertrouw op God, ik zal niet vrezen; wat zou de mens mij doen?", "1 Sam 14:50": "En de naam van Sauls vrouw was Ahinoam, een dochter van Ahimaäz; en de naam van zijn legeraanvoerder was Abner, een zoon van Ner, Sauls oom.", "Joz 15:16": "En Kaleb zei: Wie Kirjath-sefer zal verslaan en innemen, aan hem zal ik mijn dochter Achsa tot vrouw geven.", "Gen 27:29": "Volken zullen u dienen, en volken zullen zich voor u neerbuigen; wees heer over uw broers, en de zonen van uw moeder zullen zich voor u neerbuigen! Vervloekt moet hij zijn, wie u vervloekt; en wie u zegent, zij gezegend!", "1 Kron 22:11": "Nu, mijn zoon, de HEERE zal met u zijn, en u zult voorspoedig zijn, en u zult het huis van de HEERE, van uw God, bouwen, zoals Hij van u gesproken heeft.", "Ps 40:10": "Ik verkondig de gerechtigheid in de grote gemeente; zie, mijn lippen bedwing ik niet; HEERE! Gij weet het.", "Ezech 9:4": "En de HEERE zei tot hem: Ga door, door het midden van de stad, door het midden van Jeruzalem, en zet een teken op de voorhoofden van de mensen die zuchten en uitroepen over al die gruwelen die in haar midden gedaan worden.", "Neh 4:16-22": "En het gebeurde van die dag af, dat de helft van mijn knechten bezig was met het werk, en de andere helft van hen de speren, de schilden, de bogen en de pantsers vasthield; en de aanvoerders stonden achter het hele huis van Juda. Zij die aan de muur bouwden en zij die de lasten droegen, en zij die inlaadden, waren ieder met de ene hand bezig met het werk, en met de andere hielden zij het wapen vast. En de bouwers hadden ieder zijn zwaard aan zijn heup gegord en bouwden; en hij die op de bazuin blies, was bij mij.", "Klaagl 3:24-32": "Cheth. De HEERE is mijn deel, zegt mijn ziel, daarom zal ik op Hem hopen. Teth. De HEERE is goed voor hen die Hem verwachten, voor de ziel die Hem zoekt. Teth. Het is goed dat men hoopt, en stil is op het heil van de HEERE.", "Hand 6:10": "En zij konden niet opgewassen zijn tegen de wijsheid en de Geest, door Wie hij sprak.", "1 Sam 26:5": "En David maakte zich op en kwam bij de plaats waar Saul zich gelegerd had, en David bekeek de plaats waar Saul lag, met Abner, de zoon van Ner, zijn legeraanvoerder. En Saul lag in de wagenburg, en het volk was rondom hem gelegerd.", "Pred 12:10": "De prediker zocht aangename woorden te vinden, en wat er geschreven is, is recht: woorden van de waarheid.", "Ruth 4:17": "En de buurvrouwen gaven hem een naam en zeiden: Aan Naomi is een zoon geboren; en zij noemden zijn naam Obed; deze is de vader van Isaï, Davids vader.", "Ps 138:3": "Ten dage, als ik riep, hebt Gij mij verhoord; Gij hebt mij versterkt met kracht in mijn ziel.", "Joz 10:8": "Want de HEERE had tot Jozua gezegd: Vrees niet voor hen, want Ik heb ze in uw hand gegeven; niemand van hen zal voor uw aangezicht standhouden.", "Spr 6:18": "een hart dat verdorven plannen smeedt; voeten die zich haasten om naar het kwaad te lopen;", "Ex 14:13": "Doch Mozes zei tegen het volk: Vrees niet, sta vast, en zie het heil van de HEERE, dat Hij heden aan u doen zal, want de Egyptenaren die u heden gezien hebt, zult u niet meer zien in eeuwigheid.", "1 Sam 22:3": "En David ging vandaar naar Mizpa van de Moabieten; en hij zei tegen de koning van de Moabieten: Laat toch mijn vader en mijn moeder bij u komen, totdat ik weet wat God met mij doen zal.", "1 Tess 3:2": "en wij hebben Timotheüs gezonden, onze broeder en Gods dienaar en onze medearbeider in het Evangelie van Christus, om u te versterken en u te vermanen aangaande uw geloof;", "Hab 1:12": "Bent U niet van ouds af de HEERE, mijn God, mijn Heilige? Wij zullen niet sterven; o HEERE! Tot een oordeel hebt U hem gesteld, en o Rots! Om te straffen hebt U hem gegrondvest.", "1 Kor 1:28": "En het onedele van de wereld, en het verachte heeft God uitverkoren, en wat niets is, opdat Hij wat iets is, teniet zou maken;", "Ps 140:8": "HEERE, Heere, sterkte van mijn heil! U hebt mijn hoofd bedekt op de dag van de wapening.", "Ps 119:42": "Opdat ik mijn smader wat heb te antwoorden, want ik vertrouw op Uw woord.", "Matt 23:37": "Jeruzalem, Jeruzalem! U die de profeten doodt, en stenigt hen die tot u gezonden zijn! Hoe vaak heb Ik uw kinderen bijeen willen brengen, zoals een hen haar kuikens bijeenbrengt onder de vleugels; en u hebt niet gewild.", "1 Sam 14:21": "Er waren ook Hebreeën bij de Filistijnen, zoals eerder, die met hen in het leger opgetrokken waren, van rondom; dezen voegden zich nu ook bij de Israëlieten die bij Saul en Jonathan waren.", "1 Tess 1:9": "Want zijzelf vertellen over ons, wat voor ontvangst wij bij u gehad hebben, en hoe u zich tot God bekeerd hebt van de afgoden, om de levende en waarachtige God te dienen;", "1 Kron 22:16": "Van het goud, van het zilver, en van het koper, en van het ijzer is geen getal; maak u op, en doe het, en de HEERE zal met u zijn.", "Jes 48:13": "Ook heeft Mijn hand de aarde gegrond, en Mijn rechterhand heeft de hemelen met de palm afgemeten; wanneer Ik ze roep, staan zij daar samen.", "Ps 74:18-23": "Denk hieraan; de vijand heeft de HEERE gesmaad, en een dwaas volk heeft Uw Naam gelasterd. Geef het leven van Uw tortelduif niet over aan het wilde gedierte; vergeet het leven van Uw ellendigen niet voor eeuwig. Zie naar het verbond; want de duistere plaatsen van het land zijn vol woningen van geweld.", "Rom 15:18-21": "Want ik zou niet durven iets zeggen dat Christus niet door mij gewerkt heeft, tot gehoorzaamheid van de heidenen, met woorden en werken; door kracht van tekenen en wonderen, en door de kracht van de Geest van God, zodat ik, van Jeruzalem af en rondom, tot Illyricum toe, het Evangelie van Christus vervuld heb. En zo zeer begerig geweest ben om het Evangelie te verkondigen, niet waar Christus genoemd was, opdat ik niet op eens anders fundament zou bouwen;", "1 Sam 1:24": "Daarna, toen zij hem gespeend had, bracht zij hem met zich mee, met drie stieren, en een efa van het meel, en een fles met wijn; en zij bracht hem in het huis van de HEERE te Silo; en het jongetje was nog zeer jong.", "Ps 9:21": "O HEERE! jaag hun vrees aan; laat de heidenen weten, dat zij mensen zijn. Sela.", "Ps 6:10": "De HEERE heeft mijn smeking gehoord; de HEERE zal mijn gebed aannemen.", "Spr 26:2": "Zoals de mus wegzweeft, zoals een zwaluw wegvliegt, zo zal een vloek die zonder oorzaak is, niet komen.", "1 Kor 1:27": "Maar het dwaze van de wereld heeft God uitverkoren, opdat Hij de wijzen beschamen zou; en het zwakke van de wereld heeft God uitverkoren, opdat Hij het sterke zou beschamen;", "Gen 24:7": "De HEERE, de God van de hemel, Die mij uit het huis van mijn vader en uit het land van mijn familie genomen heeft, en Die tot mij gesproken heeft, en Die mij gezworen heeft en zei: Aan uw nageslacht zal Ik dit land geven! Die Zelf zal Zijn Engel voor uw aangezicht zenden, zodat u voor mijn zoon van daar een vrouw neemt.", "1 Kon 8:43": "hoor Ú in de hemel, de vaste plaats van Uw woning, en doe naar alles waarom die vreemdeling tot U roepen zal; opdat alle volken van de aarde Uw Naam kennen, om U te vrezen, zoals Uw volk Israël, en om te weten, dat Uw Naam genoemd wordt over dit huis, dat ik gebouwd heb.", "1 Kron 11:13": "Hij was met David te Pas-Dammim, toen de Filistijnen daar ten strijde verzameld waren, en het stuk akker vol gerst was, en het volk voor het aangezicht van de Filistijnen vluchtte;", "Num 13:30": "Toen bracht Kaleb het volk tot rust voor Mozes, en zei: Laat ons vrijmoedig optrekken, en het in bezit nemen; want wij zullen het zeker kunnen overweldigen!", "2 Sam 23:20": "Verder Benaja, de zoon van Jojada, de zoon van een dappere man, groot van daden, uit Kabzeel; die versloeg twee sterke leeuwen van Moab; ook ging hij af, en sloeg een leeuw in het midden van een kuil in de sneeuwtijd.", "Jer 10:23": "Ik weet, o HEERE! dat bij de mens zijn weg niet is; het is niet bij een man die wandelt, dat hij zijn gang oordeelt.", "Ps 69:20": "U weet mijn smaad, en mijn schaamte, en mijn schande; al mijn belagers zijn voor U.", "Num 11:21": "En Mozes zei: Zeshonderdduizend man te voet is dit volk, in wiens midden ik ben; en U hebt gezegd: Ik zal hun vlees geven, en zij zullen een hele maand eten!", "Ps 121:2": "Mijn hulp is van de HEERE, Die hemel en aarde gemaakt heeft.", "Ezech 32:27-32": "Maar zij liggen niet met de helden die onder de onbesnedenen gevallen zijn; die naar het dodenrijk zijn neergedaald met hun oorlogswapens, en van wie de zwaarden gelegd zijn onder hun hoofden; hun ongerechtigheid is nochtans op hun beenderen, omdat de schrik van de helden in het land van de levenden geweest is. U ook zult verbroken worden in het midden van de onbesnedenen, en zult liggen met de verslagenen van het zwaard. Daar is Edom, haar koningen en al haar vorsten, die met hun macht gelegd zijn bij de verslagenen van het zwaard; die liggen met de onbesnedenen en met hen die in het kuil zijn neergedaald.", "Rom 1:21": "Omdat zij, hoewel zij God kenden, Hem niet als God verheerlijkt of gedankt hebben; maar in hun overleggingen zijn zij verijdeld geworden, en hun onverstandig hart is verduisterd geworden;", "2 Sam 17:28": "Beddengoed, en schalen, en aarden vaten, en tarwe, en gerst, en meel, en geroosterd koren, en bonen, en linzen, ook geroosterd,", "Hand 8:40": "Maar Filippus werd gevonden te Azote; en terwijl hij het land doortrok, verkondigde hij het Evangelie in alle steden, totdat hij in Cesarea kwam.", "Ef 2:11": "Denk daarom eraan, dat u, die eertijds heidenen was in het vlees, en die voorhuid genoemd werd door hen die genoemd worden besnijdenis in het vlees, wat met handen gebeurt;", "Ezech 46:14": "En u zult als spijsoffer daarbij doen, elke morgen een zesde deel van een efa, en olie een derde deel van een hin, om de meelbloem te bevochtigen; als een spijsoffer voor de HEERE, als eeuwige inzettingen, voortdurend.", "Ex 32:32": "Nu dan, als Gij hun zonde wilt vergeven! Maar zo niet, delg mij dan nu uit Uw boek, dat Gij geschreven hebt.", "Ps 18:17": "Hij zond van de hoogte, Hij nam mij, Hij trok mij op uit veel water.", "Hand 4:8-13": "Toen zei Petrus, vervuld met de Heilige Geest, tegen hen: Leiders van het volk, en oudsten van Israël! Als wij vandaag ondervraagd worden over de weldaad aan een zieke mens gedaan, waardoor hij gezond geworden is; Laat het u allen bekend zijn, en het hele volk van Israël, dat door de Naam van Jezus Christus, de Nazarener, Die u gekruisigd hebt, Die God uit de doden heeft opgewekt, door Hem, zeg ik, staat deze man hier gezond voor u.", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "Ps 46:6": "God is in het midden van haar, zij zal niet wankelen; God zal haar helpen bij het aanbreken van de morgenstond.", "Ps 61:3": "Van het einde van het land roep ik tot U als mijn hart overstelpt is; leid mij op een rotssteen, die mij te hoog zou zijn.", "1 Sam 16:6-9": "En het gebeurde, toen zij binnenkwamen, dat hij Eliab aanzag, en dacht: Zeker, deze staat hier voor de HEERE, Zijn gezalfde. Doch de HEERE zei tegen Samuël: Kijk niet naar zijn gestalte, en ook niet naar zijn lange lengte, want Ik heb hem verworpen; want het is niet zoals de mens ziet; want de mens kijkt naar wat voor ogen is, maar de HEERE kijkt naar het hart. Toen riep Isaï Abinadab, en liet hem voor Samuël langslopen; doch hij zei: Ook deze heeft de HEERE niet uitgekozen.", "Jes 40:12": "Wie heeft het water met Zijn vuist gemeten, en van de hemel met de span de maat genomen, en heeft met een drieling het stof van de aarde begrepen, en de bergen gewogen in een waag, en de heuvels in een weegschaal?", "1 Tim 4:10": "Want hiervoor spannen wij ons in en worden wij versmaad, omdat wij onze hoop gevestigd hebben op de levende God, Die een Redder is van alle mensen, maar vooral van de gelovigen.", "2 Kron 6:33": "Hoor U dan uit de hemel, uit de vaste plaats van Uw woning, en doe naar alles waarom die vreemdeling tot U roepen zal; opdat alle volken der aarde Uw Naam kennen, om U te vrezen, zoals Uw volk Israël, en om te weten dat Uw Naam genoemd wordt over dit huis, dat ik gebouwd heb.", "2 Kron 25:5": "En Amazia verzamelde Juda, en stelde hen, naar de families van hun vaderen, aan tot leiders van duizenden en tot leiders van honderden, door heel Juda en Benjamin; en hij monsterde hen, van twintig jaar oud en daarboven, en vond hen driehonderdduizend uitgelezen mannen, die uit konden trekken ten strijde, en die speer en schild konden hanteren.", "Hebr 10:34": "Want u hebt ook medelijden gehad met mij in mijn boeien, en de beroving van uw bezittingen met blijdschap aanvaard, wetende dat u voor uzelf een beter en blijvend bezit hebt in de hemelen.", "2 Sam 21:18-20": "En het gebeurde daarna, dat er opnieuw een oorlog was te Gob tegen de Filistijnen. Toen sloeg Sibbechai, de Husathiet, Saf, die van de kinderen van Rafa was. Verder was er nog een oorlog te Gob tegen de Filistijnen; en Elhanan, de zoon van Jaäre-Oregim, de Bethlehemiet, sloeg de broer van Goliath, de Gethiet, wiens speersteel was als een weversboom. Ook was er nog een oorlog te Gath; en er was een zeer lange man, die zes vingers had aan zijn handen, en zes tenen aan zijn voeten, vierentwintig in getal, en deze was ook aan Rafa geboren.", "Luk 19:42": "en zei: Och, had u ook maar geweten, ook nog op deze dag van u, wat tot uw vrede dient! Maar nu is het verborgen voor uw ogen.", "Luk 11:13": "Als u dan, die slecht bent, weet uw kinderen goede gaven te geven, hoeveel te meer zal de hemelse Vader de Heilige Geest geven aan hen die Hem daarom bidden?", "Openb 3:21": "Wie overwint, hem zal Ik geven met Mij te zitten op Mijn troon, zoals Ik ook overwonnen heb, en Mij gezet heb met Mijn Vader op Zijn troon.", "Ps 9:4": "Omdat mijn vijanden achterwaarts gekeerd, gevallen en vergaan zijn van Uw aangezicht.", "Neh 4:18": "En de bouwers hadden ieder zijn zwaard aan zijn heup gegord en bouwden; en hij die op de bazuin blies, was bij mij.", "2 Petr 1:12": "Daarom zal ik niet nalaten u er altijd aan te herinneren, hoewel u het weet en versterkt bent in de waarheid die u nu hebt.", "Ps 118:17": "Ik zal niet sterven, maar leven; en ik zal de werken van de HEERE vertellen.", "Ex 15:14": "De volken hebben het gehoord, zij zullen sidderen; angst heeft de inwoners van Palestina bevangen.", "Ps 118:10": "Alle heidenen hadden mij omringd; het is in de Naam van de HEERE, dat ik hen verslagen heb.", "Gen 26:7": "En toen de mannen van die plaats hem naar zijn vrouw vroegen, zei hij: Zij is mijn zuster; want hij was bang om te zeggen: mijn vrouw; want, dacht hij, misschien doden de mannen van deze plaats mij om Rebekka, want zij was mooi om te zien.", "2 Sam 5:22-24": "Daarna trokken de Filistijnen weer op; en zij verspreidden zich in het dal Refaïm. En David vroeg de HEERE, Die zei: U zult niet optrekken; maar trek om, tot achter hen, zodat u bij hen komt van tegenover de moerbeibomen; En het zal gebeuren, als u het geluid van een gang hoort in de toppen van de moerbeibomen, dat u zich dan haast; want dan is de HEERE voor uw aangezicht uitgegaan, om het leger van de Filistijnen te verslaan.", "Ps 60:11": "Wie zal mij brengen in een vaste stad? Wie zal mij leiden tot in Edom?", "Mark 16:10": "Zij ging heen, en vertelde het aan hen die met Hem geweest waren, die treurden en weenden.", "Fil 1:12-18": "En ik wil dat u weet, broeders, dat wat er met mij gebeurd is, meer tot bevordering van het Evangelie gekomen is; Zodat mijn banden in Christus openbaar geworden zijn in het hele rechthuis, en aan alle anderen; En dat het merendeel van de broeders in de Heere, doordat zij vertrouwen gekregen hebben door mijn banden, veel overvloediger het Woord onbevreesd durven spreken.", "Rom 8:39": "Noch hoogte, noch diepte, noch enig ander schepsel ons zal kunnen scheiden van de liefde van God, die er is in Christus Jezus, onze Heere.", "Hab 1:2-4": "HEERE! Hoe lang schreeuw ik, en U hoort niet, hoe lang roep ik: Geweld! tot U, en U verlost niet! Waarom laat U mij ongerechtigheid zien, en aanschouwt U de kwelling? Want verwoesting en geweld is tegen mij, en er is twist, en men neemt gekijf op. Daarom wordt de wet losgelaten, en het recht komt nooit meer voort; want de goddeloze omringt de rechtvaardige; daarom komt het recht verdraaid voort.", "Ps 26:1": "Een psalm van David. Doe mij recht, HEERE! Want ik wandel in mijn oprechtheid; en ik vertrouw op de HEERE, ik zal niet wankelen.", "Joh 1:41-43": "Andreas, de broer van Simon Petrus, was een van de twee die het van Johannes gehoord hadden, en Hem gevolgd waren. Deze vond eerst zijn broer Simon, en zei tegen hem: Wij hebben de Messias gevonden, wat vertaald betekent: de Christus. En hij bracht hem tot Jezus. En Jezus keek hem aan, en zei: U bent Simon, de zoon van Jona; u zult Cefas genoemd worden, wat vertaald wordt als Petrus.", "Richt 7:20": "Zo bliezen de drie groepen op de bazuinen, en braken de kruiken; en zij hielden met de linkerhand de fakkels vast, en met hun rechterhand de bazuinen om te blazen; en zij riepen: Het zwaard van de HEERE, en van Gideon!", "Ps 119:30": "Ik heb gekozen de weg van de waarheid, Uw rechten heb ik mij voorgesteld.", "Ps 23:1-6": "Een psalm van David. De HEERE is mijn Herder, mij zal niets ontbreken. Hij laat mij neerliggen in grazige weiden; Hij voert mij zachtjes naar zeer stille wateren. Hij verkwikt mijn ziel; Hij leidt mij in het spoor van de gerechtigheid, omwille van Zijn Naam.", "Ps 33:20-22": "Onze ziel wacht op de HEERE: Hij is onze Hulp en ons Schild. Want ons hart is in Hem verblijd, omdat wij op de Naam van Zijn heiligheid vertrouwen. Uw goedertierenheid, HEERE! zij over ons, zoals wij op U hopen.", "Ezech 28:10": "U zult de dood van de onbesnedenen sterven, door de hand van vreemden; want Ik heb het gesproken, spreekt de Heere HEERE.", "Deut 31:8": "De HEERE nu is Degene, Die voor u uitgaat; Die zal met u zijn; Hij zal u niet loslaten, en u niet verlaten; vrees niet, en wees niet ontsteld.", "Gen 35:19": "Zo stierf Rachel; en zij werd begraven aan de weg naar Efrath, dat is Bethlehem.", "Jes 61:5": "En vreemdelingen zullen klaarstaan en uw kudden weiden; en buitenlanders zullen uw akkerlieden en uw wijngaardeniers zijn.", "1 Kon 22:14": "Doch Micha zei: Zo waarachtig als de HEERE leeft, wat de HEERE tegen mij zeggen zal, dat zal ik spreken.", "Hand 11:20": "En er waren enige mannen uit Cyprus en Cyrene onder hen, die naar Antiochië gekomen waren en tot de Grieken spraken, terwijl zij de Heere Jezus verkondigden.", "1 Sam 14:51": "En Kis was Sauls vader, en Ner, Abners vader, was een zoon van Abiël.", "2 Kor 11:27-29": "In arbeid en moeite, in waken menigmaal, in honger en dorst, in vasten menigmaal, in koude en naaktheid. Afgezien van de dingen die van buiten komen, overvalt mij dagelijks de zorg voor al de gemeenten. Wie is er zwak, dat ik niet zwak ben? Wie wordt er in de val gebracht, dat ik niet brand?", "Spr 18:10": "De Naam van de HEERE is een sterke toren; de rechtvaardige zal daarheen lopen, en in veiligheid gesteld worden.", "1 Kron 20:5-8": "Daarna was er nog een oorlog tegen de Filistijnen, en Elhanan, de zoon van Jaïr, versloeg Lachmi, de broer van Goliath, de Gethiet, wiens speerhout was als een weversboom. Daarna was er nog een oorlog bij Gath; en daar was een zeer lange man, en zijn vingers en tenen waren zes en zes, vierentwintig, en hij was ook geboren uit Rafa; En hij hoonde Israël, maar Jonathan, de zoon van Simea, de broer van David, versloeg hem.", "3 Joh
