een schubachtig pantser aan; en het gewicht van het pantser was vijfduizend sikkel koper. En een koperen scheenharnas boven zijn voeten, en een koperen schild tussen zijn schouders.", "1 Sam 7:12": "Samuël nam toen een steen, en zette die tussen Mizpa en Sen, en noemde hem Eben-haezer; en hij zei: Tot hiertoe heeft de HEERE ons geholpen.", "Joz 15:33-36": "In de laagte zijn: Esthaol, en Zora, en Asna, en Zanoah, en En-gannim, Tappuah, en Enam, Jarmuth, en Adullam, Socho en Azeka,", "2 Sam 13:32": "Maar Jonadab, de zoon van Simea, Davids broer, antwoordde en zei: Mijn heer moet niet denken dat zij alle jongemannen, de zonen van de koning, gedood hebben; maar Amnon alleen is dood; want Absalom had dit van tevoren zo besloten, vanaf de dag dat hij zijn zuster Thamar verkracht heeft.", "Hand 8:30": "En Filippus liep erheen en hoorde hem de profeet Jesaja lezen, en zei: Begrijpt u ook wat u leest?", "Ps 140:13": "Ik weet dat de HEERE de rechtszaak van de ellendigen, en het recht van de behoeftigen, zal uitvoeren.", "Rom 9:1-3": "Ik zeg de waarheid in Christus, ik lieg niet (mijn geweten geeft mij daarbij getuigenis door de Heilige Geest), dat het mij een grote droefheid en mijn hart een aanhoudend verdriet is. Want ik zou zelf wel wensen verbannen te zijn van Christus, voor mijn broeders, die mijn verwanten zijn naar het vlees;", "Ps 94:14": "Want de HEERE zal Zijn volk niet verlaten, en Hij zal Zijn erfdeel niet in de steek laten.", "Ps 27:5": "Want Hij verbergt mij in Zijn hut, op de dag van het kwaad; Hij verbergt mij in het verborgene van Zijn tent; Hij verhoogt mij op een rotssteen.", "Jes 25:9": "En men zal op die dag zeggen: Zie, Deze is onze God; wij hebben Hem verwacht, en Hij zal ons zalig maken. Deze is de HEERE, wij hebben Hem verwacht, wij zullen ons verheugen en verblijden in Zijn zaligheid.", "1 Kron 21:3": "Toen zei Joab: De HEERE doet Zijn volk, hoeveel zij nu ook zijn, honderd keer zoveel worden; zijn zij niet allen, o mijn heer koning, mijn heer tot knechten? Waarom verzoekt mijn heer dit? Waarom zou het Israël tot schuld worden?", "1 Sam 18:27": "Toen maakte David zich op, en hij en zijn mannen gingen heen, en zij sloegen onder de Filistijnen tweehonderd man, en David bracht hun voorhuiden, en men leverde ze de koning volkomen, opdat hij schoonzoon van de koning zou worden. Toen gaf Saul hem zijn dochter Michal tot vrouw.", "Ps 40:4": "En Hij heeft een nieuw lied in mijn mond gegeven, een lofzang voor onze God; velen zullen het zien, en vrezen, en op de HEERE vertrouwen.", "Job 22:24": "Dan zult u het goud op het stof leggen, en het goud van Ofir bij de rotssteen van de beken;", "Joh 4:35": "Zegt u niet: Het zijn nog vier maanden, en dan komt de oogst? Zie, Ik zeg u: Sla uw ogen op en bekijk de velden; want ze zijn al wit om te oogsten.", "Jer 32:25": "Evenwel hebt U tegen mij gezegd, Heere HEERE: koop voor uzelf dat veld voor geld, en laat het door getuigen bevestigen; terwijl de stad in de hand van de Chaldeeën gegeven is.", "Ezech 32:19": "Boven wie bent u zo liefelijk! Daal neer, en leg u bij de onbesnedenen.", "Ps 130:6": "Mijn ziel wacht op de Heere, meer dan de wachters op de morgen; de wachters op de morgen.", "Fil 1:19-21": "Want ik weet dat dit mij ter zaligheid zal gedijen, door uw gebed en de toebrenging van de Geest van Jezus Christus. Overeenkomstig mijn oprechte verwachting en hoop, dat ik in geen enkele zaak beschaamd zal worden; maar dat, met alle vrijmoedigheid, zoals altijd, zo ook nu, Christus groot gemaakt zal worden in mijn lichaam, hetzij door het leven, hetzij door de dood. Want het leven is voor mij Christus, en het sterven is winst.", "Hand 4:33": "En de apostelen gaven met grote kracht getuigenis van de opstanding van de Heere Jezus; en er was grote genade over hen allen.", "Jer 20:9": "Daarom zei ik: Ik zal Hem niet meer noemen, en niet meer in Zijn Naam spreken; maar het werd in mijn hart als een brandend vuur, opgesloten in mijn beenderen; en ik werd moe van het verdragen, maar ik kon het niet.", "2 Kor 5:7": "(Want wij wandelen door geloof en niet door aanschouwen.)", "Deut 1:30": "De HEERE, uw God, Die voor u uit gaat, Die zal voor u strijden, naar alles wat Hij voor uw ogen in Egypte voor u gedaan heeft.", "Jes 37:22": "Dit is het woord dat de HEERE over hem gesproken heeft: De jonkvrouw, de dochter van Sion, veracht u, zij bespot u; de dochter van Jeruzalem schudt het hoofd achter u.", "2 Kon 19:4": "Misschien zal de HEERE, uw God, alle woorden horen van Rabsake, door wie zijn heer, de koning van Assyrië, gezonden is, om de levende God te honen en met woorden te schelden, die de HEERE, uw God, gehoord heeft; hef dan een gebed op voor het overblijfsel dat nog gevonden wordt.", "Ps 7:17": "Zijn moeite zal op zijn eigen hoofd terugkeren, en zijn geweld op zijn eigen schedel neerdalen.", "Gen 15:8": "En hij zei: Heere HEERE, waarbij zal ik weten dat ik het erfelijk bezitten zal?", "1 Sam 10:3": "Als u van daar verder gaat, en komt tot bij Elon-thabor, zullen u daar drie mannen vinden, die opgaan naar God, naar Beth-el; een die drie bokjes draagt, en een die drie broden draagt, en een die een fles wijn draagt.", "Ps 17:3": "U hebt mijn hart geproefd, 's nachts bezocht, U hebt mij getoetst. U vindt niets; wat ik gedacht heb, overtreedt mijn mond niet.", "2 Sam 9:8": "Toen boog hij zich neer, en zei: Wat is uw knecht, dat u omgezien hebt naar een dode hond, zoals ik ben?", "Pred 9:3": "Dit is een kwaad onder alles wat er onder de zon gebeurt, dat eenzelfde lot allen treft, en dat ook het hart van de mensenkinderen vol boosheid is, en dat er in hun leven onzinnigheden zijn in hun hart; en daarna moeten zij naar de doden toe.", "Richt 18:15": "Toen weken zij daarheen af, en kwamen bij het huis van de jongeman, de Leviet, ten huize van Micha; en zij vroegen hem naar zijn welzijn.", "Deut 3:22": "Wees niet bang voor hen; want de HEERE, uw God, strijdt voor u.", "2 Petr 1:15": "Maar ik zal er ook mijn best voor doen, dat u bij elke gelegenheid, na mijn heengaan, hieraan kunt terugdenken.", "Joz 1:9": "Heb Ik het u niet bevolen? Wees sterk en heb goede moed, en wees niet bang, en wees niet ontzet; want de HEERE, uw God, is met u overal waar u heengaat.", "1 Sam 9:3": "De ezelinnen nu van Kis, de vader van Saul, waren kwijtgeraakt; daarom zei Kis tegen zijn zoon Saul: Neem nu een van de knechten met u, en maak u op, ga heen, zoek de ezelinnen.", "1 Sam 13:6": "Toen de mannen van Israël zagen dat zij in nood waren (want het volk was benauwd), verborg het volk zich in de holen, en in de doornstruiken, en in de rotsen, en in de vestingen, en in de putten.", "Ps 25:20": "Schin. Bewaar mijn ziel, en red mij; laat mij niet beschaamd worden, want ik vertrouw op U.", "2 Petr 3:13": "Maar wij verwachten, naar Zijn belofte, nieuwe hemelen en een nieuwe aarde, waarin gerechtigheid woont.", "1 Sam 16:8": "Toen riep Isaï Abinadab, en liet hem voor Samuël langslopen; doch hij zei: Ook deze heeft de HEERE niet uitgekozen.", "Ps 119:125": "Ik ben Uw knecht, maak mij verstandig, en ik zal Uw getuigenissen kennen.", "Ps 38:10": "Heere! Voor U is al mijn verlangen; en mijn zuchten is voor U niet verborgen.", "Jes 30:17": "Duizend zullen vluchten voor het schelden van één, voor het schelden van vijf zult u allen vluchten; totdat u overgelaten wordt, als een mast op de top van een berg, en als een banier op een heuvel.", "1 Sam 17:40-50": "En hij nam zijn staf in zijn hand, en koos zich vijf gladde stenen uit de beek, en legde ze in de herderstas die hij had, namelijk in de zak, en zijn slinger was in zijn hand; zo naderde hij de Filistijn. De Filistijn ging ook op weg, en kwam dichterbij naar David toe, en zijn schilddrager ging voor hem uit. Toen de Filistijn opkeek en David zag, verachtte hij hem; want hij was een jongeman, roodachtig, en daarbij mooi om te zien.", "1 Sam 17:45-49": "David daarentegen zei tegen de Filistijn: U komt naar mij toe met een zwaard, en met een speer, en met een schild; maar ik kom naar u toe in de Naam van de HEERE van de heerscharen, de God van de slagorden van Israël, Die u gehoond hebt. Vandaag zal de HEERE u overleveren in mijn hand, en ik zal u verslaan, en ik zal uw hoofd van u wegnemen, en ik zal de dode lichamen van het leger van de Filistijnen vandaag aan de vogels van de hemel en aan de dieren van het veld geven; en heel de aarde zal weten dat Israël een God heeft. En heel deze verzameling zal weten dat de HEERE niet door zwaard of door speer verlost; want de strijd is van de HEERE, Die zal u in onze hand geven.", "2 Kron 32:7": "Weest sterk, en houd goede moed, weest niet bevreesd en niet ontsteld voor het aangezicht van de koning van Assyrië, noch voor het aangezicht van de hele menigte die met hem is; want met ons is er meer dan met hem.", "1 Sam 14:46": "Saul nu trok terug van het achtervolgen van de Filistijnen, en de Filistijnen trokken naar hun eigen plaats.", "1 Sam 18:21": "En Saul zei: Ik zal haar hem geven, zodat zij hem tot een valstrik is, en zodat de hand van de Filistijnen tegen hem is. Daarom zei Saul tegen David: Met de andere zult u vandaag mijn schoonzoon worden.", "2 Kron 28:18": "Daartoe waren de Filistijnen ingevallen in de steden van het laagland en het zuiden van Juda, en hadden ingenomen Beth-Semes, en Ajalon, en Gederoth, en Socho met haar bijbehorende plaatsen, en Timna met haar bijbehorende plaatsen, en Gimzo met haar bijbehorende plaatsen; en zij woonden daar.", "1 Kron 11:23": "Hij versloeg ook een Egyptische man, een man van grote lengte, van vijf ellen; en die Egyptenaar had een speer in de hand, als een weversboom; maar hij ging naar hem af met een staf, en rukte de speer uit de hand van de Egyptenaar, en hij doodde hem met zijn eigen speer.", "1 Kon 18:36": "En het gebeurde, toen men het spijsoffer offerde, dat de profeet Elia naderde en zei: HEERE, God van Abraham, Izak en Israël, laat het vandaag bekend worden, dat U God bent in Israël, en ik Uw knecht; en dat ik al deze dingen naar Uw woord gedaan heb.", "2 Petr 1:13": "En ik acht het juist, zolang ik in deze tent ben, u door herinnering op te wekken;", "Dan 3:16": "Sadrach, Mesach en Abed-nego antwoordden en zeiden tegen de koning Nebukadnezar: Wij hebben het niet nodig u op deze zaak te antwoorden.", "2 Kon 7:7": "Daarom hadden zij zich klaargemaakt, en waren in de schemering gevlucht, en hadden hun tenten achtergelaten, en hun paarden, en hun ezels, het leger precies zoals het was; en waren gevlucht om hun leven te redden.", "Ps 44:7": "Want ik vertrouw niet op mijn boog, en mijn zwaard zal mij niet verlossen.", "Ex 15:15": "Dan zullen de vorsten van Edom verbaasd zijn; beving zal de machtigen van de Moabieten bevangen; alle inwoners van Kanaän zullen wegsmelten!", "Joz 7:9": "Als de Kanaänieten en alle inwoners van het land dit horen, zullen zij ons omsingelen, en onze naam van de aarde uitroeien; wat zult U dan doen voor Uw grote Naam?", "Ps 86:7": "In de dag van mijn benauwdheid roep ik U aan, want Gij verhoort mij.", "Ps 115:2": "Waarom zouden de heidenen zeggen: Waar is nu hun God?", "Ps 74:10": "Hoe lang, o God, zal de tegenstander smaden? Zal de vijand Uw Naam voor eeuwig lasteren?", "Openb 13:4": "En zij aanbaden de draak, die het beest macht gegeven had; en zij aanbaden het beest en zeiden: Wie is aan dit beest gelijk? Wie kan er oorlog tegen voeren?", "Jes 51:13": "En u vergeet de HEERE, Die u gemaakt heeft, Die de hemelen heeft uitgebreid, en de aarde gegrond heeft, en u vreest voortdurend de hele dag, vanwege de grimmigheid van de benauwer, wanneer hij zich bereidt om te verderven? Waar is dan de grimmigheid van de benauwer?", "Jer 18:20": "Zal dan kwaad voor goed vergolden worden? want zij hebben mijn ziel een kuil gegraven; gedenk dat ik voor Uw aangezicht gestaan heb om goed voor hen te spreken, om Uw grimmigheid van hen af te wenden.", "Deut 28:26": "En uw dode lichaam zal voedsel zijn voor alle vogels van de hemel, en voor de dieren van de aarde; en niemand zal ze verjagen.", "1 Sam 16:19": "Saul stuurde toen boden naar Isaï, en zei: Stuur uw zoon David naar mij, die bij de schapen is.", "1 Sam 16:9": "Daarna liet Isaï Samma langslopen; doch hij zei: Ook deze heeft de HEERE niet uitgekozen.", "Neh 1:8-10": "Denk toch aan het woord, dat U Uw dienaar Mozes geboden hebt, en zei: Als u ontrouw wordt, zal Ik u onder de volken verstrooien. Maar als u zich tot Mij bekeert, en Mijn geboden houdt, en die doet; al waren uw verdrevenen aan het einde van de hemel, Ik zal hen vandaar verzamelen, en zal ze brengen naar de plaats die Ik gekozen heb om Mijn Naam daar te doen wonen. Zij zijn toch Uw dienaren en Uw volk, dat U verlost hebt door Uw grote kracht en door Uw sterke hand.", "Lev 5:11": "Maar als zijn hand niet twee tortelduiven of twee jonge duiven kan bereiken, dan zal hij die gezondigd heeft, als zijn offergave het tiende deel van een efa meelbloem brengen als zondoffer; hij zal er geen olie overheen doen, en er ook geen wierook op leggen; want het is een zondoffer.", "2 Sam 13:3": "Maar Amnon had een vriend, wiens naam Jonadab was, een zoon van Simea, Davids broer; en Jonadab was een zeer sluwe man.", "Spr 18:12": "Vóór de ondergang verheft zich het hart van de mens; en de nederigheid gaat vóór de eer.", "Rom 8:18": "Want ik houd het ervoor, dat het lijden van deze tegenwoordige tijd niet opweegt tegen de heerlijkheid die aan ons geopenbaard zal worden.", "2 Kor 6:11": "Onze mond is opengegaan tegen u, Korinthiërs, ons hart is verruimd.", "Ex 5:23": "Want vanaf het moment dat ik bij Farao ben gekomen, om in Uw Naam te spreken, heeft hij dit volk kwaad gedaan; en U hebt Uw volk geenszins verlost.", "2 Petr 2:5": "en de oude wereld niet gespaard heeft, maar Noach, de prediker van de gerechtigheid, met zeven anderen bewaard heeft, toen Hij de zondvloed over de wereld van de goddelozen bracht;", "1 Sam 19:5": "Want hij heeft zijn leven gewaagd, en hij heeft de Filistijn geslagen, en de HEERE heeft een grote overwinning aan heel Israël gegeven; u hebt het gezien, en u bent verblijd geweest; waarom zou u dan tegen onschuldig bloed zondigen, David zonder reden doden?", "Ruth 2:14": "Toen het etenstijd was, zei Boaz tegen haar: Kom hierbij, en eet van het brood, en doop uw stukje in de azijn. Zo zat zij neer aan de zijde van de maaiers, en hij reikte haar geroost koren aan, en zij at, en werd verzadigd, en hield over.", "Job 23:6": "Zou Hij naar de grootheid van Zijn macht met mij twisten? Nee; maar Hij zou acht op mij slaan.", "1 Sam 25:27": "En nu, dit is de zegen die uw dienstmaagd mijn heer gebracht heeft, dat die gegeven wordt aan de jongemannen die de voetstappen van mijn heer navolgen.", "Amos 5:9": "Die verwoesting brengt over een sterke, zodat de verwoesting komt over een vesting.", "Ps 21:8": "Want de koning vertrouwt op de HEERE, en door de goedertierenheid van de Allerhoogste zal hij niet wankelen.", "1 Kron 5:10": "En in de dagen van Saul voerden zij oorlog tegen de Hagarenen, die vielen door hun hand; en zij woonden in hun tenten over de gehele oostzijde van Gilead.", "Matt 17:14-21": "En toen zij bij de menigte gekomen waren, kwam er iemand naar Hem toe, die voor Hem op de knieën viel en zei: Heere, ontferm U over mijn zoon, want hij is maanziek en lijdt zwaar; want vaak valt hij in het vuur, en vaak in het water. En ik heb hem naar Uw discipelen gebracht, maar zij hebben hem niet kunnen genezen.", "1 Sam 16:2": "Maar Samuël zei: Hoe zou ik kunnen gaan? Saul zal het horen en mij doden. Toen zei de HEERE: Neem een kalf van de runderen met u mee, en zeg: Ik ben gekomen om de HEERE een offer te brengen.", "Ps 4:9": "Ik zal in vrede samen neerliggen en slapen; want U, o HEERE! alleen zult mij zeker doen wonen.", "Matt 24:28": "Want waar het dode lichaam ook zal zijn, daar zullen de arenden verzameld worden.", "Jer 4:20": "Ondergang op ondergang wordt uitgeroepen; want het hele land is verwoest; haastig zijn mijn tenten verwoest, mijn gordijnen in een ogenblik!", "1 Kron 11:6": "Want David zei: Al wie de Jebusieten het eerst verslaat, zal tot hoofd en leider worden. Toen klom Joab, de zoon van Zeruja, er als eerste op; daarom werd hij tot hoofd.", "Joz 15:45": "Ekron, en haar onderhorige plaatsen, en haar dorpen.", "Zach 10:5": "En zij zullen zijn als de helden, die in het slijk van de straten treden in de strijd, en zij zullen strijden; want de HEERE zal met hen zijn, en zij zullen hen beschamen die op paarden rijden.", "Joh 4:34": "Jezus zei tegen hen: Mijn voedsel is dat Ik de wil doe van Hem die Mij gezonden heeft, en Zijn werk volbreng.", "Jes 56:11": "En deze honden zijn sterk van begeerte, zij kunnen niet verzadigd worden, ja, het zijn herders die niets kunnen begrijpen; zij keren zich allemaal naar hun eigen weg, ieder naar zijn eigen winst, elk uit zijn eigen hoek.", "Spr 28:1": "De goddelozen vluchten, terwijl geen vervolger er is; maar elke rechtvaardige is moedig, als een jonge leeuw.", "Ps 28:7": "De HEERE is mijn Sterkte en mijn Schild; op Hem heeft mijn hart vertrouwd, en ik ben geholpen; daarom springt mijn hart op van vreugde, en ik zal Hem met mijn gezang loven.", "Ps 138:8": "De HEERE zal het voor mij voleinden; Uw goedertierenheid, HEERE! is in eeuwigheid; en laat de werken van Uw handen niet varen.", "Hand 9:4": "en hij viel op de grond en hoorde een stem, die tegen hem zei: Saul, Saul, waarom vervolgt u Mij?", "2 Kon 13:18": "Daarna zei hij: Neem de pijlen. En hij nam ze. Toen zei hij tegen de koning van Israël: Sla tegen de aarde. En hij sloeg driemaal; daarna stond hij stil.", "1 Kon 20:10": "En Benhadad zond naar hem en zei: De goden doen mij zo, en doen zo daartoe, als het stof van Samaria genoeg zal zijn tot handvollen voor al het volk, dat mijn voetstappen volgt!", "2 Kor 1:10": "Die ons uit zo’n grote dood verlost heeft, en nog verlost; op Wie wij hopen dat Hij ons ook nog verlossen zal.", "Ps 71:5-7": "Want Gij zijt mijn Verwachting, Heere HEERE! mijn Vertrouwen van mijn jeugd af aan. Op U heb ik gesteund van de buik af aan; van de ingewanden van mijn moeder af aan zijt Gij mijn Uithelper; mijn lof is voortdurend van U. Ik ben voor velen als een wonder geweest; doch Gij zijt mijn sterke Toevlucht.", "Rom 8:38": "Want ik ben ervan overtuigd dat noch dood, noch leven, noch engelen, noch overheden, noch machten, noch wat nu is, noch wat komen zal,", "Matt 16:27": "Want de Zoon des mensen zal komen in de heerlijkheid van Zijn Vader, met Zijn engelen, en dan zal Hij ieder vergelden naar zijn daden.", "1 Sam 16:6": "En het gebeurde, toen zij binnenkwamen, dat hij Eliab aanzag, en dacht: Zeker, deze staat hier voor de HEERE, Zijn gezalfde.", "Richt 7:8": "En het volk nam de teerkost in hun hand, en hun bazuinen; en hij liet alle andere mannen van Israël gaan, ieder naar zijn tent, maar die driehonderd man hield hij bij zich. En het leger van de Midianieten lag beneden hem in het dal.", "Richt 7:7": "En de HEERE zei tegen Gideon: Door deze driehonderd mannen die gelekt hebben, zal Ik u verlossen, en de Midianieten in uw hand geven; laat daarom al het andere volk weggaan, ieder naar zijn eigen plaats.", "2 Sam 21:16": "En Isbi-Benob, die van de kinderen van Rafa was, met een speer die driehonderd sikkel koper woog, en hij was omgord met een nieuw zwaard; deze dacht David te doden.", "Ruth 4:22": "En Obed verwekte Isaï; en Isaï verwekte David.", "Ps 16:8": "Ik stel de HEERE voortdurend voor mij, omdat Hij aan mijn rechterhand is, zal ik niet wankelen.", "Hand 6:4": "Maar wíj zullen ons blijven wijden aan het gebed en aan de bediening van het Woord.", "Ruth 2:17": "Zo las zij op in dat veld, tot aan de avond; en zij sloeg uit wat zij opgelezen had, en het was ongeveer een efa gerst.", "Dan 6:17": "Toen beval de koning, en zij brachten Daniël naar voren, en wierpen hem in de kuil van de leeuwen; en de koning antwoordde en zei tegen Daniël: Uw God, Die u voortdurend eert, Die verlost u!", "Ps 42:9": "Maar de HEERE zal overdag Zijn goedertierenheid gebieden, en 's nachts zal Zijn lied bij mij zijn: het gebed tot de God van mijn leven.", "Ps 11:1": "Een psalm van David, voor de koorleider. Ik vertrouw op de HEERE; hoe zegt u tegen mijn ziel: Vlucht naar uw gebergte, als een vogel?", "Ps 69:37": "En het zaad van Zijn dienaars zal haar beërven; en de liefhebbers van Zijn Naam zullen daarin wonen.", "Richt 3:31": "Na hem nu was Samgar, een zoon van Anath, die de Filistijnen sloeg, zeshonderd man, met een ossenstok; zo verloste ook hij Israël.", "Jer 17:16": "Ik heb toch niet aangedrongen, meer dan een herder achter U betaamde; ook heb ik de dodelijke dag niet begeerd, Gij weet het; wat uit mijn lippen is gegaan, is voor Uw aangezicht geweest.", "Richt 9:27": "En zij trokken het veld in en oogstten hun wijngaarden af, en persten de druiven, en hielden een oogstfeest; en zij gingen het huis van hun god binnen, en aten en dronken, en vervloekten Abimelech.", "2 Tim 2:11-13": "Dit is een betrouwbaar woord: want als wij met Hem gestorven zijn, zullen wij ook met Hem leven; als wij volharden, zullen wij ook met Hem heersen; als wij Hem verloochenen, zal Hij ons ook verloochenen; als wij ontrouw zijn, blijft Hij trouw; Hij kan Zichzelf niet verloochenen.", "Luk 4:2": "En werd veertig dagen beproefd door de duivel; en at helemaal niets in die dagen, en toen ze voorbij waren, kreeg Hij ten laatste honger.", "Jes 36:15": "Bovendien, laat Hizkia u niet doen vertrouwen op de HEERE, door te zeggen: De HEERE zal ons zeker redden; deze stad zal niet in de hand van de koning van Assyrië gegeven worden.", "2 Kron 13:10": "Maar wat ons betreft, de HEERE is onze God, en wij hebben Hem niet verlaten; en de priesters die de HEERE dienen, zijn de zonen van Aäron, en de Levieten zijn bezig met hun werk.", "Dan 3:29": "Daarom wordt door mij een bevel gegeven, dat elk volk, natie en tong, die iets verkeerds spreekt tegen de God van Sadrach, Mesach en Abed-nego, in stukken gehouwen wordt, en zijn huis tot een puinhoop gemaakt wordt; want er is geen andere God die op zo'n manier kan verlossen.", "Micha 7:2": "De goedertierene is verdwenen uit het land, en er is niemand oprecht onder de mensen; zij loeren allemaal op bloed, zij jagen, ieder op zijn broeder, met een jachtnet.", "Ps 144:10": "U, Die de koningen overwinning geeft, Die Zijn dienaar David bevrijdt van het boze zwaard;", "Hebr 11:7-11": "Door het geloof heeft Noach, door God gewaarschuwd over de dingen die nog niet gezien werden, en bevreesd geworden, de ark gebouwd tot redding van zijn huisgezin; door dit geloof heeft hij de wereld veroordeeld, en is hij een erfgenaam geworden van de rechtvaardigheid die naar het geloof is. Door het geloof is Abraham, toen hij geroepen werd, gehoorzaam geweest om uit te gaan naar de plaats die hij tot een erfdeel zou ontvangen; en hij is uitgegaan zonder te weten waar hij komen zou. Door het geloof is hij een inwoner geweest in het land van de belofte, als in een vreemd land, en heeft hij in tenten gewoond met Izak en Jakob, die medeerfgenamen waren van dezelfde belofte.", "1 Joh 4:16": "En wij hebben de liefde gekend en geloofd, die God tot ons heeft. God is liefde; en die in de liefde blijft, blijft in God, en God in hem.", "Lev 6:20": "Dit is de offerande van Aäron en van zijn zonen, die zij de HEERE offeren zullen op de dag dat hij gezalfd wordt: het tiende deel van een efa meelbloem, een voortdurend spijsoffer; de helft daarvan op de morgen, en de helft daarvan op de avond.", "Ps 60:14": "In God zullen wij kloeke daden doen, en Hij zal onze tegenstanders vertreden.", "Jes 26:8": "Wij hebben ook op de weg van Uw oordelen, U, o HEERE, verwacht; naar Uw Naam en naar Uw gedachtenis gaat het verlangen van onze ziel uit.", "Ex 5:22": "Toen keerde Mozes weer terug tot de HEERE, en zei: Heere! Waarom hebt U dit volk kwaad gedaan, waarom hebt U mij nu gezonden?", "Jes 12:2": "Zie, God is mijn Heil, ik zal vertrouwen en niet vrezen; want de HEERE HEERE is mijn Sterkte en mijn Psalm, en Hij is mij tot Heil geworden.", "Ps 102:14": "U zult opstaan, U zult U ontfermen over Sion, want de tijd om haar genadig te zijn, want de bestemde tijd is gekomen.", "1 Sam 18:1": "Het gebeurde nu, toen hij geëindigd had tot Saul te spreken, dat de ziel van Jonathan verbonden werd aan de ziel van David; en Jonathan had hem lief als zijn eigen ziel.", "Hand 4:31": "En toen zij gebeden hadden, werd de plaats waarin zij bijeen waren, geschud. En zij werden allen vervuld met de Heilige Geest, en spraken het Woord van God met vrijmoedigheid.", "Deut 7:17-24": "Als u in uw hart zei: Deze volken zijn groter dan ik; hoe zou ik hen uit hun bezit kunnen verdrijven? — wees niet bevreesd voor hen; denk goed terug aan wat de HEERE, uw God, aan de farao en aan alle Egyptenaren gedaan heeft; de grote verzoekingen die uw ogen gezien hebben, en de tekenen, en de wonderen, en de sterke hand, en de uitgestrekte arm, waardoor de HEERE, uw God, u heeft uitgevoerd; zo zal de HEERE, uw God, doen aan alle volken voor wie u bevreesd bent.", "2 Sam 17:29": "En honing, en boter, en schapen, en koeienkaas, brachten naar David, en naar het volk dat bij hem was, om te eten, want zij zeiden: Dit volk is hongerig, en moe, en dorstig in de woestijn.", "Joël 2:19": "En de HEERE zal antwoorden en tegen Zijn volk zeggen: Ziet, Ik zend u het koren, en de most, en de olie, zodat u daarvan verzadigd zult worden; en Ik zal u niet meer overgeven tot een smaad onder de heidenen.", "Gen 29:6": "Verder zei hij tegen hen: Gaat het goed met hem? En zij zeiden: Het gaat goed; en zie, Rachel, zijn dochter, komt met de schapen.", "Deut 20:1": "Wanneer u zult uittrekken tot de strijd tegen uw vijanden, en zult zien paarden en wagens, een volk, groter dan u, dan zult u voor hen niet vrezen; want de HEERE, uw God, is met u, Die u uit Egypteland heeft opgevoerd.", "2 Kron 20:15-17": "En hij zei: Merk op, heel Juda, en u, inwoners van Jeruzalem, en u, koning Josafat! Zo zegt de HEERE tegen u: Wees niet bevreesd en wees niet ontzet vanwege deze grote menigte; want de strijd is niet van u, maar van God. Trek morgen tegen hen af; zie, zij komen op bij de weg naar Ziz; en u zult hen vinden aan het einde van het dal, voor de woestijn van Jeruël. U zult in deze strijd niet hoeven te strijden; stel u op, blijf staan en zie het heil van de HEERE met u, o Juda en Jeruzalem! Wees niet bevreesd en wees niet ontzet, ga morgen op hen af, want de HEERE zal met u zijn.", "Joz 10:10": "En de HEERE bracht hen in verwarring voor het aangezicht van Israël; en hij sloeg hen met een grote slag te Gibeon, en vervolgde hen op de weg waar men naar Beth-horon opgaat, en sloeg hen tot Azeka en tot Makkeda toe.", "Ps 40:11": "Uw gerechtigheid bedek ik niet in het midden van mijn hart; Uw waarheid en Uw heil spreek ik uit; Uw weldadigheid en Uw trouw verheel ik niet in de grote gemeente.", "1 Sam 17:8-53": "Hij nu stond en riep tegen de slagorden van Israël, en zei tegen hen: Waarom zou u uittrekken om de slagorde op te stellen? Ben ik niet een Filistijn, en u knechten van Saul? Kies een man onder u, die naar mij toe komt. Als hij tegen mij kan strijden en mij kan verslaan, dan zullen wij u tot knechten zijn; maar als ik hem overwin en hem versla, dan zult u ons tot knechten zijn en ons dienen. Verder zei de Filistijn: Ik heb vandaag de slagorden van Israël gehoond, en gezegd: Geef mij een man, dat wij samen strijden!", "Ps 47:5": "Hij kiest voor ons onze erfenis, de heerlijkheid van Jakob, die Hij heeft liefgehad. Sela.", "Jes 33:2": "HEERE, wees ons genadig, wij hebben op U gewacht; wees hun arm elke morgen, en ook onze redding in tijd van benauwdheid.", "Deut 3:21": "Ook gebood ik Jozua in die tijd: Uw ogen hebben alles gezien wat de HEERE, uw God, aan deze twee koningen gedaan heeft; zo zal de HEERE doen aan alle koninkrijken waar u doorheen trekt.", "1 Kron 28:1": "Toen verzamelde David alle leiders van Israël in Jeruzalem: de leiders van de stammen, de leiders van de afdelingen die de koning dienden bij toerbeurt, de leiders over de duizenden, de leiders over de honderden, de beheerders over alle bezittingen en het vee van de koning en zijn zonen, met de hovelingen, de helden en alle dappere mannen.", "Ps 31:4-7": "Want U bent mijn Steenrots en mijn Burg; leid mij dan, en voer mij, omwille van Uw Naam. Doe mij uitgaan uit het net, dat zij voor mij verborgen hebben, want U bent mijn Sterkte. In Uw hand beveel ik mijn geest; U hebt mij verlost, HEERE, U, God van de waarheid!", "Rom 2:28": "Want die is niet een Jood, die het in het openbaar is; en dat is ook niet de besnijdenis, die het in het openbaar in het vlees is;", "Ps 9:5": "Want Gij hebt mijn recht en mijn rechtszaak afgedaan; Gij hebt gezeten op de troon, o Rechter der gerechtigheid.", "1 Sam 26:14": "En David riep naar het volk en naar Abner, de zoon van Ner, en zei: Zult u niet antwoorden, Abner? Toen antwoordde Abner en zei: Wie bent u, die naar de koning roept?", "2 Kon 19:19": "Nu dan, HEERE, onze God, verlos ons toch uit zijn hand; zo zullen alle koninkrijken van de aarde weten dat U, HEERE, alleen God bent.", "Ps 46:2-4": "God is ons een Toevlucht en Sterkte; Hij is met kracht bevonden een Hulp in benauwdheden. Daarom zullen wij niet vrezen, al veranderde de aarde haar plaats, en al werden de bergen verzet in het hart van de zeeën; Laat haar water bruisen, laat het beroerd worden; laat de bergen daveren, door de verheffing daarvan! Sela.", "Matt 10:12": "En als u het huis ingaat, groet het dan.", "Ps 119:44-46": "Zo zal ik Uw wet voortdurend onderhouden, eeuwig en altijd. En ik zal wandelen in de ruimte, omdat ik Uw bevelen gezocht heb. Ook zal ik voor koningen spreken van Uw getuigenissen, en mij niet schamen.", "Hand 12:1": "In diezelfde tijd sloeg koning Herodes de handen aan sommigen van de gemeente, om hen kwalijk te behandelen.", "1 Sam 16:11": "Vervolgens zei Samuël tegen Isaï: Zijn dit al de jongens? En hij zei: De jongste is nog over, en zie, hij weidt de schapen. Samuël zei toen tegen Isaï: Stuur iemand en laat hem halen; want wij zullen niet aan tafel gaan totdat hij hier gekomen is.", "Ps 61:7": "U zult dagen tot de dagen van de koning toedoen; zijn jaren zullen zijn als van geslacht tot geslacht;", "Ps 74:12": "Toch is God mijn Koning van oudsher, Die verlossingen werkt in het midden van de aarde.", "Ps 119:74": "Die U vrezen, zullen mij aanzien, en zich verblijden, omdat ik op Uw woord gehoopt heb.", "2 Kron 26:14": "En Uzzia bereidde voor hen, voor het gehele leger, schilden, en speren, en helmen, en pantsers, en bogen, zelfs tot de slingerstenen toe.", "Richt 7:16-20": "En hij deelde de driehonderd man in drie groepen; en hij gaf ieder een bazuin in zijn hand, en lege kruiken, en fakkels in het midden van de kruiken. En hij zei tegen hen: Kijk naar mij en doe hetzelfde; en zie, wanneer ik aan het uiterste van het leger kom, zal het zo zijn: zoals ik zal doen, zo zult u doen. Als ik met de bazuin blaas, ik en allen die met mij zijn, dan zult ook u met de bazuin blazen, rondom het hele leger, en u zult zeggen: Voor de HEERE en voor Gideon!", "Hand 11:24": "Want hij was een goed man, en vol van de Heilige Geest en van het geloof; en er werd een grote menigte aan de Heere toegevoegd.", "1 Tess 3:6": "Maar nu Timotheüs van u tot ons gekomen is, en ons de goede boodschap gebracht heeft van uw geloof en liefde, en dat u altijd goede herinnering aan ons hebt, zeer verlangend om ons te zien, zoals wij ook naar u;", "Ps 91:13": "Op de felle leeuw en de adder zult u treden, u zult de jonge leeuw en de draak vertrappen.", "Richt 5:15": "Ook waren de vorsten in Issaschar met Debora; en zoals Issaschar, zo was Barak; op zijn voeten werd hij gezonden in het dal. In Rubens gedeelten waren de inbeeldingen van het hart groot.", "Hand 5:21": "Toen zij dit gehoord hadden, gingen zij tegen de vroege morgen de tempel in, en leerden. Maar de hogepriester kwam, en die met hem waren, en riepen de raad samen, en alle oudsten van de kinderen van Israël, en zonden naar de kerker om hen te halen.", "2 Kon 18:5": "Hij vertrouwde op de HEERE, de God van Israël, zodat na hem zijns gelijke niet was onder alle koningen van Juda, noch die vóór hem geweest waren.", "Ps 69:36": "Want God zal Sion verlossen, en de steden van Juda bouwen; en daar zullen zij wonen, en haar erfelijk bezitten;", "Ezech 43:13": "En dit zijn de maten van het altaar naar de ellen, waarbij de el een el en een handbreed is; de voet van een el, en een el de breedte; en zijn rand aan zijn zoom rondom een span; en dit is de rug van het altaar.", "Ps 120:5-7": "O, wee mij, dat ik een vreemdeling ben in Mesech, dat ik in de tenten van Kedar woont. Mijn ziel heeft lang gewoond bij hen die de vrede haten. Ik ben vreedzaam; maar als ik spreek, zijn zij uit op oorlog.", "Ps 3:9": "Het heil is van de HEERE; Uw zegen is over Uw volk. Sela.", "1 Sam 30:7": "En David zei tegen de priester Abjathar, de zoon van Achimelech: Breng mij toch de efod hier. En Abjathar bracht de efod naar David.", "Ps 60:12": "Zult U het niet zijn, o God! Die ons verstoten had, en niet uittrok, o God! met onze legers?", "Jes 5:10": "Ja, tien bunders wijngaard zullen maar één bath geven, en een homer zaad zal een efa geven.", "Ps 26:6": "Ik was mijn handen in onschuld, en ik ga rondom Uw altaar, o HEERE!", "Ps 44:6": "Door U zullen wij onze tegenstanders met hoorns stoten; in Uw Naam zullen wij vertrappen die tegen ons opstaan.", "Ef 4:25": "Daarom, leg de leugen af, en spreek de waarheid, ieder met zijn naaste; want wij zijn elkaars leden.", "1 Sam 16:13": "Toen nam Samuël de oliehoorn, en zalfde hem te midden van zijn broers. En de Geest van de HEERE kwam vanaf die dag over David, en bleef. Daarna stond Samuël op, en ging naar Rama.", "Mark 9:14-29": "En toen Hij bij de discipelen kwam, zag Hij een grote menigte om hen heen, en enige Schriftgeleerden die met hen aan het twisten waren. En meteen, toen de hele menigte Hem zag, was zij zeer verbaasd, en zij liepen naar Hem toe en groetten Hem. En Hij vroeg de Schriftgeleerden: Waarover twist u met hen?", "Ex 16:36": "Een gomer nu is het tiende deel van een efa.", "Micha 5:7": "Ja, het overblijfsel van Jakob zal zijn onder de heidenen, in het midden van veel volken, als een leeuw onder de dieren van het woud, als een jonge leeuw onder de schaapskudden; die, wanneer hij erdoorheen gaat, vertreedt en verscheurt, zodat niemand redt.", "Ps 91:2": "Ik zal tegen de HEERE zeggen: Mijn Toevlucht en mijn Burg! Mijn God, op Wie ik vertrouw!", "1 Kor 1:27-29": "Maar het dwaze van de wereld heeft God uitverkoren, opdat Hij de wijzen beschamen zou; en het zwakke van de wereld heeft God uitverkoren, opdat Hij het sterke zou beschamen; En het onedele van de wereld, en het verachte heeft God uitverkoren, en wat niets is, opdat Hij wat iets is, teniet zou maken; Opdat geen vlees zou roemen voor Hem.", "Openb 19:18": "Opdat u eet het vlees van de koningen, en het vlees van de aanvoerders over duizend, en het vlees van de sterken, en het vlees van de paarden en van hen die daarop zitten; en het vlees van alle vrijen en dienstknechten, en kleinen en groten.", "Spr 21:31": "Het paard wordt bereid tegen de dag van het strijd; maar de overwinning is van de HEERE.", "2 Kor 4:13": "Omdat wij nu dezelfde Geest van het geloof hebben, zoals er geschreven is: Ik heb geloofd, daarom heb ik gesproken; zo geloven wij ook, daarom spreken wij ook;", "Job 40:4-7": "Hebt u een arm gelijk God? En kunt u, gelijk Hij, met de stem donderen? Versier u nu met voortreffelijkheid en hoogheid, en bekleed u met majesteit en heerlijkheid! Strooi de verbolgenheden van uw toorn uit, en zie ieder hoogmoedige, en verneder hem!", "Ps 89:19": "Want ons schild is van de HEERE, en onze koning is van de Heilige van Israël.", "Ps 25:5": "He. Vau. Leid mij in Uw waarheid, en leer mij, want Gij zijt de God van mijn heil; U verwacht ik de hele dag.", "1 Sam 21:10": "En David stond op, en vluchtte diezelfde dag van het aangezicht van Saul weg; en hij kwam bij Achis, de koning van Gath.", "1 Sam 18:20": "Doch Michal, de dochter van Saul, had David lief. Toen dat Saul te kennen werd gegeven, was die zaak goed in zijn ogen.", "Ezech 44:15": "Maar de Levitische priesters, de kinderen van Zadok, die de wacht van Mijn heiligdom in acht genomen hebben, toen de kinderen van Israël van Mij afdwaalden, die zullen tot Mij naderen om Mij te dienen; en zullen voor Mijn aangezicht staan om Mij het vette en het bloed te offeren, spreekt de Heere HEERE;", "Jona 2:2-9": "En hij zei: Ik riep uit mijn benauwdheid tot de HEERE, en Hij antwoordde mij; uit de buik van het graf schreide ik, en U hoorde mijn stem. Want U had mij geworpen in de diepte, in het hart van de zeeën, en de stroom omving mij; al Uw baren en Uw golven gingen over mij heen. En ik zei: Ik ben weggestoten van voor Uw ogen; toch zal ik de tempel van Uw heiligheid weer aanschouwen.", "Ps 118:11": "Zij hadden mij omringd, ja, zij hadden mij omringd; het is in de Naam van de HEERE, dat ik hen verslagen heb.", "Est 7:10": "Zo hingen zij Haman aan de galg, die hij voor Mordechai had laten maken; en de grimmigheid van de koning werd gestild.", "Luk 19:43": "Want er zullen dagen over u komen, dat uw vijanden een wal rondom u zullen opwerpen, en u zullen omsingelen, en u van alle kanten in het nauw drijven;", "Zach 2:8": "Want zo zegt de HEERE van de heerscharen: Naar de heerlijkheid over u, heeft Hij mij gezonden tot die heidenen, die u beroofd hebben; want die u aanraakt, die raakt Zijn oogappel aan.", "Joz 18:9": "De mannen dan gingen heen, en trokken het land door en beschreven het, naar de steden, in zeven delen, in een boek; en kwamen weer tot Jozua in het leger te Silo.", "Rom 8:28": "En wij weten dat voor hen die God liefhebben, alle dingen meewerken ten goede, namelijk voor hen die naar Zijn voornemen geroepen zijn.", "Gen 12:12": "En het zal gebeuren, wanneer de Egyptenaren u zien, dat zij zullen zeggen: Dat is zijn vrouw; en zij zullen mij doden, en u in leven laten.", "Deut 9:2": "Een groot en lang volk, kinderen van de Enakieten, die u kent, en waarvan u gehoord hebt: Wie zou standhouden voor het aangezicht van de kinderen van Enak?", "1 Kor 9:26": "Ik loop dan zo, niet als op het onzekere; ik strijd zo, niet als iemand die de lucht slaat;", "Zach 5:6-10": "En ik zei: Wat is dat? En Hij zei: Dit is een efa die tevoorschijn komt. Verder zei Hij: Dit is het beeld van hen in het hele land. En zie, een plaat van lood werd opgeheven, en er was een vrouw, zittend midden in de efa. En Hij zei: Dit is de goddeloosheid; en Hij wierp haar midden in de efa; en Hij wierp het loden gewicht op de mond daarvan.", "Gen 6:22": "En Noach deed het; naar alles wat God hem geboden had, zo deed hij.", "1 Sam 16:10": "Zo liet Isaï zijn zeven zonen voor Samuël langslopen; doch Samuël zei tegen Isaï: De HEERE heeft dezen niet uitgekozen.", "Gen 6:5": "En de HEERE zag dat de slechtheid van de mens groot was op de aarde, en dat elk bedenksel van de gedachten van zijn hart alle dagen alleen maar slecht was.", "Jes 50:7-9": "Want de Heere HEERE helpt Mij, daarom word Ik niet te schande; daarom heb Ik Mijn gezicht gemaakt als een keisteen, want Ik weet dat Ik niet beschaamd zal worden. Hij is nabij, Die Mij rechtvaardigt, wie zal met Mij twisten? Laten wij samen staan; wie heeft een rechtszaak tegen Mij? Laat hij hierheen komen tot Mij. Zie, de Heere HEERE helpt Mij, wie is het die Mij zal veroordelen? Zie, zij zullen allemaal verslijten als een kleed, de mot zal hen opeten.", "Micha 7:20": "U zult Jakob de trouw, Abraham de goedertierenheid geven, die U onze vaderen van oude dagen af gezworen hebt.", "Hand 28:4-6": "En toen de inwoners het beest aan zijn hand zagen hangen, zeiden zij tegen elkaar: Deze man is zeker een moordenaar, die, hoewel hij uit de zee ontkomen is, door de wraak niet in leven gelaten wordt. Maar hij schudde het beest af in het vuur, en had er geen kwaad van te lijden. En zij verwachtten dat hij zou opzwellen, of meteen dood neervallen. Maar toen zij lang gewacht hadden en zagen dat hem geen ongemak overkwam, veranderden zij van gedachten en zeiden dat hij een god was.", "Ps 94:18": "Toen ik zei: Mijn voet wankelt; Uw goedertierenheid, o HEERE! ondersteunde mij.", "Ps 101:3": "Ik zal geen slechte zaak voor mijn ogen stellen; ik haat het doen van de afvalligen, het zal mij niet aankleven.", "Job 6:10": "Dat zou nog mijn troost zijn, en zou mij verkwikken in de weedom, zo Hij niet spaarde; want ik heb de redenen van de Heilige niet verborgen gehouden.", "Mark 5:19": "Maar Jezus stond hem dat niet toe, maar zei tegen hem: Ga naar uw huis, naar de uwen, en vertel hun wat grote dingen de Heere aan u gedaan heeft, en hoe Hij Zich over u ontfermd heeft.", "1 Kon 18:37": "Antwoord mij, HEERE, antwoord mij; opdat dit volk erkent dat U, HEERE, die God bent, en dat U hun hart weer terug hebt gebracht.", "Ps 119:146": "Ik heb U aangeroepen, verlos mij, en ik zal Uw getuigenissen onderhouden.", "Ps 31:9": "En mij niet hebt overgeleverd in de hand van de vijand; U hebt mijn voeten doen staan in de ruimte.", "Spr 27:4": "Grimmigheid en overloping van toorn is wreedheid; maar wie zal voor jaloezie standhouden?", "Jer 32:24": "Zie de wallen! Zij zijn tot aan de stad gekomen om die in te nemen, en de stad is gegeven in de hand van de Chaldeeën, die tegen haar strijden; vanwege het zwaard en de honger en de pest; en wat U gesproken hebt, is gebeurd, en zie, U ziet het.", "Richt 19:18": "En hij zei tegen hem: Wij trekken door van Bethlehem-Juda tot aan de zijden van het gebergte van Efraïm, vandaar kom ik; en ik was naar Bethlehem-Juda gegaan, maar ik ga nu naar het huis van de HEERE; en er is niemand die mij in huis neemt.", "Ps 71:20": "Gij, Die mij veel benauwdheden en kwaden hebt doen zien, zult mij weer levend maken, en zult mij weer ophalen uit de afgronden van de aarde.", "2 Kor 12:21": "opdat mijn God mij niet opnieuw vernedert bij u, als ik gekomen zal zijn, en ik verdriet heb over velen, die eerder gezondigd hebben, en die zich niet bekeerd zullen hebben van de onreinheid, en hoererij, en losbandigheid, die zij bedreven hebben.", "Ps 40:5": "Gelukkig is de man die de HEERE tot zijn vertrouwen stelt, en niet omziet naar de hoogmoedigen, en die tot leugen afwijken.", "Ps 56:5": "In God zal ik Zijn woord prijzen; ik vertrouw op God, ik zal niet vrezen; wat zou vlees mij doen?", "Micha 7:1": "Ai mij! Want ik ben als wanneer de zomervruchten zijn ingezameld; als wanneer de nalezingen in de wijnoogst gebeurd zijn; er is geen druif om te eten; mijn ziel begeert vroegrijpe vrucht.", "Ps 9:6": "Gij hebt de heidenen gescholden, de goddeloze verdaan, hun naam uitgedelgd, tot in eeuwigheid en altoos.", "Ps 101:8": "Elke morgen zal ik alle goddelozen van het land verdelgen, om uit de stad van de HEERE alle werkers van de ongerechtigheid uit te roeien.", "2 Sam 16:9": "Toen zei Abisai, de zoon van Zeruja, tegen de koning: Waarom zou deze dode hond mijn heer de koning vloeken? Laat mij toch oversteken en zijn kop wegnemen.", "Hand 24:14": "Maar dit beken ik u, dat ik naar die weg, die zij een sekte noemen, de God van de vaderen zo dien, gelovend alles wat in de wet en in de profeten geschreven is;", "1 Sam 14:52": "En er was een zware oorlog tegen de Filistijnen al de dagen van Saul; daarom nam Saul iedere held en iedere dappere man die hij zag, bij zich in dienst.", "Matt 11:3": "En zei tegen Hem: Bent U Degene, Die komen zou, of verwachten wij een ander?", "Ps 56:13": "O God! Op mij zijn Uw geloften; ik zal U dankzeggingen vergelden;", "Richt 20:16": "Onder al dit volk waren zevenhonderd uitgelezen mannen, die linkshandig waren; deze allen slingerden met een steen op een haar nauwkeurig, zodat het hun niet miste.", "Hand 11:19": "Degenen nu die verstrooid waren door de verdrukking die over Stefanus gebeurd was, trokken het land door tot Fenicië toe, en Cyprus, en Antiochië, en spraken tot niemand het Woord dan alleen tot de Joden.", "Ps 71:16": "Ik zal heengaan in de mogendheden van de Heere HEERE; ik zal Uw gerechtigheid vermelden, de Uwe alleen.", "Ps 119:151": "Maar U, HEERE! bent nabij, en al Uw geboden zijn waarheid.", "Ps 7:2": "HEERE, mijn God, op U vertrouw ik; verlos mij van al mijn vervolgers, en red mij.", "Dan 6:23": "Mijn God heeft Zijn engel gezonden, en Hij heeft de bek van de leeuwen dichtgehouden, zodat zij mij niet beschadigd hebben, omdat voor Zijn aangezicht onschuld in mij gevonden is; en ook heb ik, o koning, tegen u geen misdaad begaan.", "Openb 2:17": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, hem zal Ik geven te eten van het manna dat verborgen is, en Ik zal hem een witte keursteen geven, en op de keursteen een nieuwe naam geschreven, die niemand kent dan wie hem ontvangt.", "2 Kron 18:33": "Toen spande een man de boog op goed geluk, en schoot de koning van Israël tussen de gespen en het pantser. Toen zei hij tegen de voerman: Keer uw hand en breng mij uit het leger, want ik ben gewond.", "Job 10:12": "Naast het leven hebt U goedertierenheid aan mij bewezen, en Uw zorg heeft mijn geest bewaard.", "Ps 79:12": "En geef onze buren zevenvoudig terug in hun schoot hun smaad, waarmee zij U, o Heere, gesmaad hebben.", "Ps 16:1": "Een gouden kleinood van David. Bewaar mij, o God! Want ik vertrouw op U.", "Richt 3:3": "Vijf vorsten van de Filistijnen, en al de Kanaänieten, en de Sidoniërs, en de Hevieten, die woonden in het gebergte van de Libanon, van de berg Baäl-Hermon tot waar men bij Hamath komt.", "Jer 9:23": "Zo zegt de HEERE: Een wijze beroemt zich niet op zijn wijsheid, en de sterke beroemt zich niet op zijn sterkte; een rijke beroemt zich niet op zijn rijkdom;", "Jes 36:8-10": "Nu dan, wed toch met mijn heer, de koning van Assyrië; en ik zal u tweeduizend paarden geven, als u voor uzelf de ruiters daarop kunt geven. Hoe zou u dan het gezicht van één enkele vorst, van de geringste knechten van mijn heer, kunnen afkeren? Maar u vertrouwt op Egypte, vanwege de wagens en de ruiters. En ben ik nu zonder de HEERE opgetrokken tegen dit land, om het te verderven? De HEERE heeft tegen mij gezegd: Trek op tegen dat land, en verderf het.", "1 Sam 18:17-27": "Daarom zei Saul tegen David: Zie, mijn oudste dochter Merab zal ik u tot vrouw geven; alleen, wees mij een dapper man en voer de oorlogen van de HEERE. Want Saul zei: Laat mijn hand niet tegen hem zijn, maar laat de hand van de Filistijnen tegen hem zijn. Doch David zei tegen Saul: Wie ben ik, en wat is mijn leven, en het huisgezin van mijn vader in Israël, dat ik de schoonzoon van de koning zou worden? Het gebeurde nu ten tijde dat men Merab, de dochter van Saul, aan David geven zou, dat zij aan Adriël, de Meholathiet, tot vrouw werd gegeven.", "Ps 115:1": "Niet ons, o HEERE, niet ons, maar geef aan Uw Naam eer, om Uw goedertierenheid, om Uw waarheid.", "2 Kron 32:8": "Met hem is een arm van vlees, maar met ons is de HEERE, onze God, om ons te helpen en om onze oorlogen te voeren. En het volk steunde op de woorden van Jehizkia, de koning van Juda.", "Job 42:2": "Ik weet, dat U alles vermag, en dat geen van Uw gedachten kan afgesneden worden.", "Ps 119:81": "Caph. Mijn ziel is bezweken van verlangen naar Uw heil; op Uw woord heb ik gehoopt.", "Ps 94:17": "Als de HEERE mij geen Hulp was geweest, had mijn ziel bijna in de stilte gewoond.", "Ezech 46:11": "Verder, op de feesten en op de vastgestelde hoogtijden zal het spijsoffer zijn: een efa bij een var, en een efa bij een ram; maar bij de lammeren, een gave van zijn hand; en olie, een hin bij een efa.", "Ezech 28:9": "Zult u dan nog, voor het aangezicht van hem die u doodslaat, zeggen: Ik ben God? terwijl u een mens bent en geen God, in de hand van hem die u verslaat?", "Ps 119:166": "O HEERE! ik hoop op Uw heil, en doe Uw geboden.", "Ps 73:24": "U zult mij leiden door Uw raad; en daarna zult U mij in heerlijkheid opnemen.", "Hebr 11:4": "Door het geloof heeft Abel een beter offer aan God gebracht dan Kaïn, en daardoor heeft hij het getuigenis gekregen dat hij rechtvaardig was, doordat God over zijn gave getuigenis gaf; en door dit geloof spreekt hij nog, hoewel hij gestorven i
