:"1 Johannes","href":"../../1-johannes/1/"},{"naam":"2 Johannes","href":"../../2-johannes/1/"},{"naam":"3 Johannes","href":"../../3-johannes/1/"},{"naam":"Judas","href":"../../judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"En de Filistijnen verzamelden hun leger ten strijde, en verzamelden zich te Socho, dat in Juda ligt; en zij legerden zich tussen Socho en Azeka, aan het einde van Dammim.","2":"Maar Saul en de mannen van Israël verzamelden zich, en legerden zich in het eikendal; en stelden de slagorde tegen de Filistijnen op.","3":"De Filistijnen nu stonden aan een berg aan de ene kant, en de Israëlieten stonden aan een berg aan de andere kant; en de vallei was tussen hen.","4":"Toen ging er een kampvechter uit het leger van de Filistijnen naar buiten; zijn naam was Goliath, uit Gath; zijn hoogte was zes ellen en een span.","5":"En hij had een koperen helm op zijn hoofd, en hij had een schubachtig pantser aan; en het gewicht van het pantser was vijfduizend sikkel koper.","6":"En een koperen scheenharnas boven zijn voeten, en een koperen schild tussen zijn schouders.","7":"En de schacht van zijn speer was als een weversboom, en het lemmer van zijn speer was van zeshonderd sikkel ijzer; en de schilddrager ging voor hem uit.","8":"Hij nu stond en riep tegen de slagorden van Israël, en zei tegen hen: Waarom zou u uittrekken om de slagorde op te stellen? Ben ik niet een Filistijn, en u knechten van Saul? Kies een man onder u, die naar mij toe komt.","9":"Als hij tegen mij kan strijden en mij kan verslaan, dan zullen wij u tot knechten zijn; maar als ik hem overwin en hem versla, dan zult u ons tot knechten zijn en ons dienen.","10":"Verder zei de Filistijn: Ik heb vandaag de slagorden van Israël gehoond, en gezegd: Geef mij een man, dat wij samen strijden!","11":"Toen Saul en heel Israël deze woorden van de Filistijn hoorden, schrokken zij enorm, en vreesden zeer.","12":"David nu was de zoon van de Efrathitische man uit Bethlehem-Juda, wiens naam Isaï was, en die acht zonen had, en in de dagen van Saul was hij een man, oud, hoogbejaard onder de mannen.","13":"En de drie oudste zonen van Isaï gingen op weg; zij volgden Saul na in de strijd. De namen nu van zijn drie zonen die in de strijd gingen, waren: Eliab, de eerstgeborene, en zijn tweede Abinadab, en de derde Samma.","14":"En David was de jongste; en de drie oudsten waren Saul nagevolgd.","15":"Doch David ging heen, en keerde terug van Saul, om de schapen van zijn vader te weiden te Bethlehem.","16":"De Filistijn nu trad naar voren, 's morgens vroeg en 's avonds. Zo stelde hij zich daar veertig dagen lang op.","17":"En Isaï zei tegen zijn zoon David: Neem toch voor uw broers een efa[1] van dit geroosterde koren, en deze tien broden, en breng ze snel naar het leger, naar uw broers.","18":"Maar breng deze tien melkkazen naar de aanvoerder over duizend; en u zult naar uw broers omzien, of het hun goed gaat, en u zult van hen een teken meenemen.","19":"Saul nu, en zij, en alle mannen van Israël waren bij het eikendal met de Filistijnen aan het strijden.","20":"Toen maakte David zich 's morgens vroeg op, en hij liet de schapen bij de hoeder, en hij nam het op en ging heen, zoals Isaï hem bevolen had; en hij kwam bij de wagenburg, toen het leger in slagorde uittrok en men ten strijde riep.","21":"En de Israëlieten en de Filistijnen stelden slagorde tegen slagorde op.","22":"David nu liet zijn spullen achter bij de bewaarder van de spullen, en hij liep naar de slagorde toe; en hij kwam en vroeg zijn broers hoe het met hen ging.","23":"Terwijl hij met hen sprak, zie, toen kwam de kampvechter naar boven; zijn naam was Goliath, de Filistijn uit Gath, uit het leger van de Filistijnen, en hij sprak dezelfde woorden als daarvoor; en David hoorde ze.","24":"Doch alle mannen in Israël vluchtten voor hem weg toen zij die man zagen, en zij vreesden zeer.","25":"En de mannen van Israël zeiden: Hebt u die man wel gezien, die is opgekomen? Want hij is opgekomen om Israël te honen; en het zal gebeuren dat de koning de man die hem verslaat, met grote rijkdom zal verrijken, en hij zal hem zijn dochter geven, en hij zal het huis van zijn vader vrijmaken in Israël.","26":"Toen zei David tegen de mannen die bij hem stonden: Wat zal men de man doen die deze Filistijn verslaat en de smaad van Israël wegneemt? Want wie is deze onbesneden Filistijn, dat hij de slagorden van de levende God zou honen?","27":"Weer zei het volk hem hetzelfde woord: Zo zal men de man doen die hem verslaat.","28":"Toen Eliab, zijn oudste broer, hem tegen die mannen hoorde spreken, ontstak de toorn van Eliab tegen David, en hij zei: Waarom bent u nu hierheen gekomen, en bij wie hebt u die paar schapen in de woestijn gelaten? Ik ken uw overmoed en de slechtheid van uw hart wel; want u bent gekomen om de strijd te zien.","29":"Toen zei David: Wat heb ik nu gedaan? Is er geen reden voor?","30":"En hij wendde zich van hem af naar een ander toe, en zei hetzelfde; en het volk gaf hem weer hetzelfde antwoord als eerst.","31":"Toen die woorden die David gesproken had, gehoord werden en aan Saul verteld werden, liet hij hem halen.","32":"En David zei tegen Saul: Laat aan niemand het hart ontvallen om hem. Uw knecht zal gaan en met deze Filistijn strijden.","33":"Maar Saul zei tegen David: U zult niet kunnen gaan om tegen deze Filistijn te strijden; want u bent een jongeman, en hij is een krijgsman van jongs af aan.","34":"Toen zei David tegen Saul: Uw knecht weidde de schapen van zijn vader, en er kwam een leeuw en een beer, en nam een schaap uit de kudde weg.","35":"En ik ging hem achterna, en sloeg hem, en redde het uit zijn muil; toen hij tegen mij opstond, greep ik hem bij zijn baard, en sloeg hem, en doodde hem.","36":"Uw knecht heeft zowel de leeuw als de beer verslagen; zo zal het deze onbesneden Filistijn vergaan, zoals een van hen, omdat hij de slagorden van de levende God gehoond heeft.","37":"Verder zei David: De HEERE, Die mij gered heeft uit de klauw van de leeuw en uit de klauw van de beer, Die zal mij redden uit de hand van deze Filistijn. Toen zei Saul tegen David: Ga heen, en de HEERE zij met u!","38":"En Saul kleedde David met zijn kleren, en zette een koperen helm op zijn hoofd, en kleedde hem met een pantser.","39":"En David gordde zijn zwaard aan over zijn kleren, en probeerde te lopen; want hij was er niet mee vertrouwd. Toen zei David tegen Saul: Ik kan hier niet in lopen, want ik ben er niet mee vertrouwd; en David deed ze weer uit.","40":"En hij nam zijn staf in zijn hand, en koos zich vijf gladde stenen uit de beek, en legde ze in de herderstas die hij had, namelijk in de zak, en zijn slinger was in zijn hand; zo naderde hij de Filistijn.","41":"De Filistijn ging ook op weg, en kwam dichterbij naar David toe, en zijn schilddrager ging voor hem uit.","42":"Toen de Filistijn opkeek en David zag, verachtte hij hem; want hij was een jongeman, roodachtig, en daarbij mooi om te zien.","43":"De Filistijn nu zei tegen David: Ben ik een hond, dat u met stokken naar mij toe komt? En de Filistijn vervloekte David bij zijn goden.","44":"Daarna zei de Filistijn tegen David: Kom naar mij toe, dan zal ik uw vlees aan de vogels van de hemel geven, en aan de dieren van het veld.","45":"David daarentegen zei tegen de Filistijn: U komt naar mij toe met een zwaard, en met een speer, en met een schild; maar ik kom naar u toe in de Naam van de HEERE van de heerscharen[2], de God van de slagorden van Israël, Die u gehoond hebt.","46":"Vandaag zal de HEERE u overleveren in mijn hand, en ik zal u verslaan, en ik zal uw hoofd van u wegnemen, en ik zal de dode lichamen van het leger van de Filistijnen vandaag aan de vogels van de hemel en aan de dieren van het veld geven; en heel de aarde zal weten dat Israël een God heeft.","47":"En heel deze verzameling zal weten dat de HEERE niet door zwaard of door speer verlost; want de strijd is van de HEERE, Die zal u in onze hand geven.","48":"En het gebeurde, toen de Filistijn zich opmaakte en dichterbij kwam, David tegemoet, dat David zich haastte en naar de slagorde toe liep, de Filistijn tegemoet.","49":"En David stak zijn hand in de tas, en nam er een steen uit, en slingerde die, en trof de Filistijn in zijn voorhoofd, zodat de steen in zijn voorhoofd wegzonk, en hij viel voorover op de grond.","50":"Zo overweldigde David de Filistijn met een slinger en met een steen; en hij versloeg de Filistijn en doodde hem; doch David had geen zwaard in zijn hand.","51":"Daarom liep David, en ging op de Filistijn staan, en nam zijn zwaard, en trok het uit zijn schede, en doodde hem, en hakte hem daarmee het hoofd af. Toen de Filistijnen zagen dat hun geweldigste dood was, vluchtten zij.","52":"Toen maakten de mannen van Israël en Juda zich op, en juichten, en achtervolgden de Filistijnen tot waar men bij de vallei komt, en tot aan de poorten van Ekron; en de gewonden van de Filistijnen vielen op de weg naar Saäraïm, en tot aan Gath, en tot aan Ekron.","53":"Daarna keerden de kinderen van Israël terug van het fel achtervolgen van de Filistijnen, en zij plunderden hun legerkampen.","54":"Daarna nam David het hoofd van de Filistijn en bracht het naar Jeruzalem; maar zijn wapens legde hij in zijn tent.","55":"Toen Saul David zag uitgaan, de Filistijn tegemoet, zei hij tegen Abner, de legeraanvoerder: Wiens zoon is deze jongeman, Abner? En Abner zei: Zo waarachtig als uw ziel leeft, o koning, ik weet het niet.","56":"De koning nu zei: Vraag u het na, wiens zoon deze jongeman is.","57":"Toen David terugkeerde van het verslaan van de Filistijn, nam Abner hem mee, en bracht hem voor Saul, met het hoofd van de Filistijn in zijn hand.","58":"En Saul zei tegen hem: Wiens zoon bent u, jongeman? En David zei: Ik ben een zoon van uw knecht Isaï, de Bethlehemiet."},"SV":{"1":"En de Filistijnen verzamelden hun heir ten strijde, en verzamelden zich te Socho, dat in Juda is; en zij legerden zich tussen Socho en tussen Azeka, aan het einde van Dammim.","2":"Doch Saul en de mannen van Israël verzamelden zich, en legerden zich in het eikendal; en stelden de slagorde tegen de Filistijnen aan.","3":"De Filistijnen nu stonden aan een berg aan gene, en de Israëlieten stonden aan een berg aan deze zijde; en de vallei was tussen hen.","4":"Toen ging er een kampvechter uit, uit het leger der Filistijnen; zijn naam was Goliath, van Gath; zijn hoogte was zes ellen en een span.","5":"En hij had een koperen helm op zijn hoofd, en hij had een schubachtig pantsier aan; en het gewicht van het pantsier was vijf duizend sikkelen kopers;","6":"En een koperen scheenharnas boven zijn voeten, en een koperen schild tussen zijn schouders;","7":"En de schacht zijner spies was als een weversboom, en het lemmer zijner spies was van zeshonderd sikkelen ijzers; en de schilddrager ging voor zijn aangezicht.","8":"Deze nu stond, en riep tot de slagorden van Israël, en zeide tot hen: Waarom zoudt gijlieden uittrekken, om de slagorde te stellen? Ben ik niet een Filistijn, en gijlieden knechten van Saul? Kiest een man onder u, die tot mij afkome.","9":"Indien hij tegen mij strijden en mij verslaan kan, zo zullen wij ulieden tot knechten zijn; maar indien ik hem overwin en hem sla, zo zult gij ons tot knechten zijn, en ons dienen.","10":"Verder zeide de Filistijn: Ik heb heden de slagorden van Israël gehoond, *zeggende*: Geeft mij een man, dat wij te zamen strijden!","11":"Toen Saul en het ganse Israël deze woorden van den Filistijn hoorden, zo ontzetten zij zich, en vreesden zeer.","12":"David nu was de zoon van den Efrathischen man van Bethlehem-juda, wiens naam was Isaï, en *die* acht zonen had, en in de dagen van Saul was hij een man, oud, afgaande onder de mannen.","13":"En de drie grootste zonen van Isaï gingen heen; zij volgden Saul na in den krijg. De namen nu zijner drie zonen, die in den krijg gingen, waren: Eliab, de eerstgeborene, en zijn tweede Abinadab, en de derde Samma.","14":"En David was de kleinste; en de drie grootsten waren Saul nagevolgd.","15":"Doch David ging henen, en kwam weder van Saul, om zijns vaders schapen te weiden te Bethlehem.","16":"De Filistijn nu trad toe, des morgens vroeg en des avonds. Alzo stelde hij zich *daar* veertig dagen lang.","17":"En Isaï zeide tot zijn zoon David: Neem toch voor uw broeders een efa van dit geroost koren, en deze tien broden, en breng ze terloops in het leger tot uw broederen.","18":"Maar breng deze tien melkkazen aan de oversten over duizend; en gij zult uw broederen bezoeken, of het hun welga, en gij zult van hen pand medenemen.","19":"Saul nu, en zij, en alle mannen van Israël waren bij het eikendal met de Filistijnen strijdende.","20":"Toen maakte zich David des morgens vroeg op, en hij liet de schapen bij den hoeder, en hij nam het op, en ging henen, gelijk als Isaï hem bevolen had; en hij kwam aan den wagenburg, als het heir in slagorde uittoog, en men ten strijde riep.","21":"En de Israëlieten en Filistijnen stelden slagorde tegen slagorde.","22":"David nu liet de vaten van zich, onder de hand van den bewaarder der vaten, en hij liep ter slagorde; en hij kwam en vraagde zijn broederen naar *hun* welstand.","23":"Toen hij met hen sprak, ziet, zo kwam de kampvechter op; zijn naam was Goliath, de Filistijn van Gath, uit het heir der Filistijnen, en hij sprak achtereenvolgens die woorden; en David hoorde ze.","24":"Doch alle mannen in Israël, als zij dien man zagen, zo vluchtten zij voor zijn aangezicht, en zij vreesden zeer.","25":"En de mannen Israëls zeiden: Hebt gijlieden dien man wel gezien, die opgekomen is? Want hij is opgekomen, om Israël te honen; en het zal geschieden, dat de koning dien man, die hem slaat, met groten rijkdom verrijken zal, en hij zal hem zijn dochter geven, en hij zal zijns vaders huis vrijmaken in Israël.","26":"Toen zeide David tot de mannen, die bij hem stonden, zeggende: Wat zal men dien man doen, die dezen Filistijn slaat, en den smaad van Israël wendt? Want wie is deze onbesneden Filistijn, dat hij de slagorden van den levenden God zou honen?","27":"Wederom zeide hem het volk achtervolgens dat woord, zeggende: Alzo zal men den man doen, die hem slaat.","28":"Als Eliab, zijn grootste broeder, hem tot die mannen hoorde spreken, zo ontstak de toorn van Eliab tegen David, en hij zeide: Waarom zijt gij nu afgekomen, en onder wien hebt gij de weinige schapen in de woestijn gelaten? Ik ken uw vermetelheid, en de boosheid uws harten wel; want gij zijt afgekomen, opdat gij den strijd zaagt.","29":"Toen zeide David: Wat heb ik nu gedaan? Is er geen oorzaak?","30":"En hij wendde zich af van dien naar een anderen toe, en hij zeide achtereenvolgens dat woord; en het volk gaf hem weder antwoord, achtervolgens de eerste woorden.","31":"Toen die woorden gehoord werden, die David gesproken had, en in de tegenwoordigheid van Saul verkondigd werden, zo liet hij hem halen.","32":"En David zeide tot Saul: Aan geen mens ontvalle het hart, om zijnentwil. Uw knecht zal heengaan en hij zal met dezen Filistijn strijden.","33":"Maar Saul zeide tot David: Gij zult niet kunnen heengaan tot dezen Filistijn, om met hem te strijden; want gij zijt een jongeling, en hij is een krijgsman van zijn jeugd af.","34":"Toen zeide David tot Saul: Uw knecht weidde de schapen zijns vaders, en er kwam een leeuw en een beer, en nam een schaap van de kudde weg.","35":"En ik ging uit hem na, en ik sloeg hem, en redde het uit zijn mond; toen hij tegen mij opstond, zo vatte ik hem bij zijn baard, en sloeg hem, en doodde hem.","36":"Uw knecht heeft zo den leeuw als den beer geslagen; alzo zal deze onbesneden Filistijn zijn, gelijk een van die, omdat hij de slagorden van den levenden God gehoond heeft.","37":"Verder zeide David: De HEERE, Die mij van de hand des leeuws gered heeft, en uit de hand des beers, Die zal mij redden uit de hand van dezen Filistijn. Toen zeide Saul tot David: Ga heen, en de HEERE zij met u!","38":"En Saul kleedde David met zijn klederen, en zette een koperen helm op zijn hoofd, en kleedde hem met een pantsier.","39":"En David gordde zijn zwaard aan over zijn klederen, en wilde gaan; want hij had het nooit verzocht. Toen zeide David tot Saul: Ik kan in deze niet gaan, want ik heb het nooit verzocht; en David leide ze van zich.","40":"En hij nam zijn staf in zijn hand, en hij koos zich vijf gladde stenen uit de beek, en leide ze in de herderstas, die hij had, te weten in den zak, en zijn slinger was in zijn hand; alzo naderde hij tot den Filistijn.","41":"De Filistijn ging ook heen, gaande en naderende tot David, en zijn schilddrager *ging* voor zijn aangezicht.","42":"Toen de Filistijn opzag, en David zag, zo verachtte hij hem; want hij was een jongeling, roodachtig, mitsgaders schoon van aanzien.","43":"De Filistijn nu zeide tot David: Ben ik een hond, dat gij tot mij komt met stokken? En de Filistijn vloekte David bij zijn goden.","44":"Daarna zeide de Filistijn tot David: Kom tot mij, zo zal ik uw vlees aan de vogelen des hemels geven, en aan de dieren des velds.","45":"David daarentegen zeide tot den Filistijn: gij komt tot mij met een zwaard, en met een spies, en met een schild; maar ik kom tot u in den Naam van den HEERE der heirscharen, den God der slagorden van Israël, Dien gij gehoond hebt.","46":"Te dezen dage zal de HEERE u besluiten in mijn hand, en ik zal u slaan, en ik zal uw hoofd van u wegnemen, en ik zal de dode lichamen van der Filistijnen leger dezen dag aan de vogelen des hemels, en aan de beesten des velds geven; en de ganse aarde zal weten, dat Israël een God heeft.","47":"En deze ganse vergadering zal weten, dat de HEERE niet door het zwaard, noch door de spies verlost; want de krijg is des HEEREN, Die zal ulieden in onze hand geven.","48":"En het geschiedde, toen de Filistijn zich opmaakte, en heenging, en David tegemoet naderde, zo haastte David, en liep naar de slagorde toe, den Filistijn tegemoet.","49":"En David stak zijn hand in de tas, en hij nam een steen daaruit, en hij slingerde, en trof den Filistijn in zijn voorhoofd; zodat de steen zonk in zijn voorhoofd, en hij viel op zijn aangezicht ter aarde.","50":"Alzo overweldigde David den Filistijn met een slinger en met een steen; en hij versloeg den Filistijn, en doodde hem; doch David had geen zwaard in de hand.","51":"Daarom liep David, en stond op den Filistijn, en nam zijn zwaard, en hij trok het uit zijn schede, en hij doodde hem, en hij hieuw hem het hoofd daarmede af. Toen de Filistijnen zagen, dat hun geweldigste dood was, zo vluchtten zij.","52":"Toen maakten zich de mannen van Israël en van Juda op, en juichten, en vervolgden de Filistijnen, tot daar men komt aan de vallei, en tot aan de poorten van Ekron; en de verwonden der Filistijnen vielen op den weg van Saaraim, en tot aan Gath, en tot aan Ekron.","53":"Daarna keerden de kinderen Israëls om, van het hittig najagen der Filistijnen, en zij beroofden hun legers.","54":"Daarna nam David het hoofd van den Filistijn, en bracht het naar Jeruzalem; maar zijn wapenen leide hij in zijn tent.","55":"Toen Saul David zag uitgaan den Filistijn tegemoet, zeide hij tot Abner, den krijgsoverste: Wiens zoon is deze jongeling, Abner? En Abner zeide: *Zo* *waarachtig* *als* uw ziel leeft, o koning! ik weet het niet.","56":"De koning nu zeide: Vraag gij het, wiens zoon deze jongeling is.","57":"Als David wederkeerde van het slaan des Filistijns, zo nam hem Abner, en hij bracht hem voor het aangezicht van Saul, en het hoofd van den Filistijn was in zijn hand.","58":"En Saul zeide tot hem: Wiens zoon zijt gij, jongeling? En David zeide: Ik ben een zoon van uw knecht Isaï, den Bethlehemiet."},"KJV":{"1":"Now the Philistines gathered together their armies to battle, and were gathered together at Shochoh, which belongeth to Judah, and pitched between Shochoh and Azekah, in Ephesdammim.","2":"And Saul and the men of Israel were gathered together, and pitched by the valley of Elah, and set the battle in array against the Philistines.","3":"And the Philistines stood on a mountain on the one side, and Israel stood on a mountain on the other side: and there was a valley between them.","4":"And there went out a champion out of the camp of the Philistines, named Goliath, of Gath, whose height was six cubits and a span.","5":"And he had an helmet of brass upon his head, and he was armed with a coat of mail; and the weight of the coat was five thousand shekels of brass.","6":"And he had greaves of brass upon his legs, and a target of brass between his shoulders.","7":"And the staff of his spear was like a weaver's beam; and his spear's head weighed six hundred shekels of iron: and one bearing a shield went before him.","8":"And he stood and cried unto the armies of Israel, and said unto them, Why are ye come out to set your battle in array? am not I a Philistine, and ye servants to Saul? choose you a man for you, and let him come down to me.","9":"If he be able to fight with me, and to kill me, then will we be your servants: but if I prevail against him, and kill him, then shall ye be our servants, and serve us.","10":"And the Philistine said, I defy the armies of Israel this day; give me a man, that we may fight together.","11":"When Saul and all Israel heard those words of the Philistine, they were dismayed, and greatly afraid.","12":"Now David was the son of that Ephrathite of Bethlehemjudah, whose name was Jesse; and he had eight sons: and the man went among men for an old man in the days of Saul.","13":"And the three eldest sons of Jesse went and followed Saul to the battle: and the names of his three sons that went to the battle were Eliab the firstborn, and next unto him Abinadab, and the third Shammah.","14":"And David was the youngest: and the three eldest followed Saul.","15":"But David went and returned from Saul to feed his father's sheep at Bethlehem.","16":"And the Philistine drew near morning and evening, and presented himself forty days.","17":"And Jesse said unto David his son, Take now for thy brethren an ephah of this parched corn, and these ten loaves, and run to the camp to thy brethren;","18":"And carry these ten cheeses unto the captain of their thousand, and look how thy brethren fare, and take their pledge.","19":"Now Saul, and they, and all the men of Israel, were in the valley of Elah, fighting with the Philistines.","20":"And David rose up early in the morning, and left the sheep with a keeper, and took, and went, as Jesse had commanded him; and he came to the trench, as the host was going forth to the fight, and shouted for the battle.","21":"For Israel and the Philistines had put the battle in array, army against army.","22":"And David left his carriage in the hand of the keeper of the carriage, and ran into the army, and came and saluted his brethren.","23":"And as he talked with them, behold, there came up the champion, the Philistine of Gath, Goliath by name, out of the armies of the Philistines, and spake according to the same words: and David heard them.","24":"And all the men of Israel, when they saw the man, fled from him, and were sore afraid.","25":"And the men of Israel said, Have ye seen this man that is come up? surely to defy Israel is he come up: and it shall be, that the man who killeth him, the king will enrich him with great riches, and will give him his daughter, and make his father's house free in Israel.","26":"And David spake to the men that stood by him, saying, What shall be done to the man that killeth this Philistine, and taketh away the reproach from Israel? for who is this uncircumcised Philistine, that he should defy the armies of the living God?","27":"And the people answered him after this manner, saying, So shall it be done to the man that killeth him.","28":"And Eliab his eldest brother heard when he spake unto the men; and Eliab's anger was kindled against David, and he said, Why camest thou down hither? and with whom hast thou left those few sheep in the wilderness? I know thy pride, and the naughtiness of thine heart; for thou art come down that thou mightest see the battle.","29":"And David said, What have I now done? Is there not a cause?","30":"And he turned from him toward another, and spake after the same manner: and the people answered him again after the former manner.","31":"And when the words were heard which David spake, they rehearsed them before Saul: and he sent for him.","32":"And David said to Saul, Let no man's heart fail because of him; thy servant will go and fight with this Philistine.","33":"And Saul said to David, Thou art not able to go against this Philistine to fight with him: for thou art but a youth, and he a man of war from his youth.","34":"And David said unto Saul, Thy servant kept his father's sheep, and there came a lion, and a bear, and took a lamb out of the flock:","35":"And I went out after him, and smote him, and delivered it out of his mouth: and when he arose against me, I caught him by his beard, and smote him, and slew him.","36":"Thy servant slew both the lion and the bear: and this uncircumcised Philistine shall be as one of them, seeing he hath defied the armies of the living God.","37":"David said moreover, The LORD that delivered me out of the paw of the lion, and out of the paw of the bear, he will deliver me out of the hand of this Philistine. And Saul said unto David, Go, and the LORD be with thee.","38":"And Saul armed David with his armour, and he put an helmet of brass upon his head; also he armed him with a coat of mail.","39":"And David girded his sword upon his armour, and he assayed to go; for he had not proved it. And David said unto Saul, I cannot go with these; for I have not proved them. And David put them off him.","40":"And he took his staff in his hand, and chose him five smooth stones out of the brook, and put them in a shepherd's bag which he had, even in a scrip; and his sling was in his hand: and he drew near to the Philistine.","41":"And the Philistine came on and drew near unto David; and the man that bare the shield went before him.","42":"And when the Philistine looked about, and saw David, he disdained him: for he was but a youth, and ruddy, and of a fair countenance.","43":"And the Philistine said unto David, Am I a dog, that thou comest to me with staves? And the Philistine cursed David by his gods.","44":"And the Philistine said to David, Come to me, and I will give thy flesh unto the fowls of the air, and to the beasts of the field.","45":"Then said David to the Philistine, Thou comest to me with a sword, and with a spear, and with a shield: but I come to thee in the name of the LORD of hosts, the God of the armies of Israel, whom thou hast defied.","46":"This day will the LORD deliver thee into mine hand; and I will smite thee, and take thine head from thee; and I will give the carcases of the host of the Philistines this day unto the fowls of the air, and to the wild beasts of the earth; that all the earth may know that there is a God in Israel.","47":"And all this assembly shall know that the LORD saveth not with sword and spear: for the battle is the LORD'S, and he will give you into our hands.","48":"And it came to pass, when the Philistine arose, and came and drew nigh to meet David, that David hasted, and ran toward the army to meet the Philistine.","49":"And David put his hand in his bag, and took thence a stone, and slang it, and smote the Philistine in his forehead, that the stone sunk into his forehead; and he fell upon his face to the earth.","50":"So David prevailed over the Philistine with a sling and with a stone, and smote the Philistine, and slew him; but there was no sword in the hand of David.","51":"Therefore David ran, and stood upon the Philistine, and took his sword, and drew it out of the sheath thereof, and slew him, and cut off his head therewith. And when the Philistines saw their champion was dead, they fled.","52":"And the men of Israel and of Judah arose, and shouted, and pursued the Philistines, until thou come to the valley, and to the gates of Ekron. And the wounded of the Philistines fell down by the way to Shaaraim, even unto Gath, and unto Ekron.","53":"And the children of Israel returned from chasing after the Philistines, and they spoiled their tents.","54":"And David took the head of the Philistine, and brought it to Jerusalem; but he put his armour in his tent.","55":"And when Saul saw David go forth against the Philistine, he said unto Abner, the captain of the host, Abner, whose son is this youth? And Abner said, As thy soul liveth, O king, I cannot tell.","56":"And the king said, Enquire thou whose son the stripling is.","57":"And as David returned from the slaughter of the Philistine, Abner took him, and brought him before Saul with the head of the Philistine in his hand.","58":"And Saul said to him, Whose son art thou, thou young man? And David answered, I am
