=\"H622\">together,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> by the <span class=\"wl wl-kjv\" data-code=\"H6010\">valley</span> of <span class=\"wl wl-kjv\" data-code=\"H425\">Elah,</span> and set the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle</span> in <span class=\"wl wl-kjv\" data-code=\"H6186\">array</span> <span class=\"wl wl-kjv\" data-code=\"H7125\">against</span> the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines.</span>","3":"And the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> on a <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain</span> on the one side, and <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> on a <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain</span> on the other side: and there was a <span class=\"wl wl-kjv\" data-code=\"H1516\">valley</span> between them.","4":"And there went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> a <span class=\"wl wl-kjv\" data-code=\"H376\">champion</span> out of the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines,</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">named</span> <span class=\"wl wl-kjv\" data-code=\"H1555\">Goliath,</span> of <span class=\"wl wl-kjv\" data-code=\"H1661\">Gath,</span> whose <span class=\"wl wl-kjv\" data-code=\"H1363\">height</span> was <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H520\">cubits</span> and a <span class=\"wl wl-kjv\" data-code=\"H2239\">span.</span>","5":"And he had an <span class=\"wl wl-kjv\" data-code=\"H3553\">helmet</span> of <span class=\"wl wl-kjv\" data-code=\"H5178\">brass</span> upon his <span class=\"wl wl-kjv\" data-code=\"H7218\">head,</span> and he was <span class=\"wl wl-kjv\" data-code=\"H3847\">armed</span> with a <span class=\"wl wl-kjv\" data-code=\"H8302\">coat</span> of <span class=\"wl wl-kjv\" data-code=\"H7193\">mail;</span> and the <span class=\"wl wl-kjv\" data-code=\"H4948\">weight</span> of the <span class=\"wl wl-kjv\" data-code=\"H8302\">coat</span> was <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H8255\">shekels</span> of <span class=\"wl wl-kjv\" data-code=\"H5178\">brass.</span>","6":"And he had <span class=\"wl wl-kjv\" data-code=\"H4697\">greaves</span> of <span class=\"wl wl-kjv\" data-code=\"H5178\">brass</span> upon his <span class=\"wl wl-kjv\" data-code=\"H7272\">legs,</span> and a <span class=\"wl wl-kjv\" data-code=\"H3591\">target</span> of <span class=\"wl wl-kjv\" data-code=\"H5178\">brass</span> between his <span class=\"wl wl-kjv\" data-code=\"H3802\">shoulders.</span>","7":"And the <span class=\"wl wl-kjv\" data-code=\"H6086\">staff</span> of his <span class=\"wl wl-kjv\" data-code=\"H2595\">spear</span> was like a <span class=\"wl wl-kjv\" data-code=\"H707\">weaver's</span> <span class=\"wl wl-kjv\" data-code=\"H4500\">beam;</span> and his <span class=\"wl wl-kjv\" data-code=\"H2595\">spear's</span> <span class=\"wl wl-kjv\" data-code=\"H3852\">head</span> weighed <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H8255\">shekels</span> of <span class=\"wl wl-kjv\" data-code=\"H1270\">iron:</span> and one <span class=\"wl wl-kjv\" data-code=\"H5375\">bearing</span> a <span class=\"wl wl-kjv\" data-code=\"H6793\">shield</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him.","8":"And he <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> and <span class=\"wl wl-kjv\" data-code=\"H7121\">cried</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4634\">armies</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, Why are ye come <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> to set your <span class=\"wl wl-kjv\" data-code=\"H4421\">battle</span> in <span class=\"wl wl-kjv\" data-code=\"H6186\">array?</span> am not I a <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine,</span> and ye <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> to <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul?</span> <span class=\"wl wl-kjv\" data-code=\"H1262\">choose</span> you a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> for you, and let him come <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to me.","9":"If he be <span class=\"wl wl-kjv\" data-code=\"H3201\">able</span> to <span class=\"wl wl-kjv\" data-code=\"H3898\">fight</span> with me, and to <span class=\"wl wl-kjv\" data-code=\"H5221\">kill</span> me, then will we be your <span class=\"wl wl-kjv\" data-code=\"H5650\">servants:</span> but if I <span class=\"wl wl-kjv\" data-code=\"H3201\">prevail</span> against him, and <span class=\"wl wl-kjv\" data-code=\"H5221\">kill</span> him, then shall ye be our <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> and <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> us.","10":"And the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I <span class=\"wl wl-kjv\" data-code=\"H2778\">defy</span> the <span class=\"wl wl-kjv\" data-code=\"H4634\">armies</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day;</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> me a <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> that we may <span class=\"wl wl-kjv\" data-code=\"H3898\">fight</span> <span class=\"wl wl-kjv\" data-code=\"H3162\">together.</span>","11":"When <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> and all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> those <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine,</span> they were <span class=\"wl wl-kjv\" data-code=\"H2865\">dismayed,</span> and <span class=\"wl wl-kjv\" data-code=\"H3966\">greatly</span> <span class=\"wl wl-kjv\" data-code=\"H3372\">afraid.</span>","12":"Now <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> was the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of that <span class=\"wl wl-kjv\" data-code=\"H376\">Ephrathite</span> of <span class=\"wl wl-kjv\" data-code=\"H1035\">Bethlehemjudah,</span> whose <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> was <span class=\"wl wl-kjv\" data-code=\"H3448\">Jesse;</span> and he had <span class=\"wl wl-kjv\" data-code=\"H8083\">eight</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons:</span> and the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H935\">went</span> among <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> for an old <span class=\"wl wl-kjv\" data-code=\"H2204\">man</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul.</span>","13":"And the <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H1419\">eldest</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H3448\">Jesse</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> and <span class=\"wl wl-kjv\" data-code=\"H310\">followed</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> to the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle:</span> and the <span class=\"wl wl-kjv\" data-code=\"H8034\">names</span> of his <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> that <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> to the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle</span> were <span class=\"wl wl-kjv\" data-code=\"H446\">Eliab</span> the <span class=\"wl wl-kjv\" data-code=\"H1060\">firstborn,</span> and <span class=\"wl wl-kjv\" data-code=\"H4932\">next</span> unto him <span class=\"wl wl-kjv\" data-code=\"H41\">Abinadab,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7992\">third</span> <span class=\"wl wl-kjv\" data-code=\"H8048\">Shammah.</span>","14":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> was the <span class=\"wl wl-kjv\" data-code=\"H6996\">youngest:</span> and the <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H1419\">eldest</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">followed</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul.</span>","15":"But <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> from <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> to <span class=\"wl wl-kjv\" data-code=\"H7462\">feed</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep</span> at <span class=\"wl wl-kjv\" data-code=\"H1035\">Bethlehem.</span>","16":"And the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine</span> drew <span class=\"wl wl-kjv\" data-code=\"H5066\">near</span> <span class=\"wl wl-kjv\" data-code=\"H7925\">morning</span> and <span class=\"wl wl-kjv\" data-code=\"H6150\">evening,</span> and <span class=\"wl wl-kjv\" data-code=\"H3320\">presented</span> himself <span class=\"wl wl-kjv\" data-code=\"H705\">forty</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days.</span>","17":"And <span class=\"wl wl-kjv\" data-code=\"H3448\">Jesse</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">Take</span> now for thy <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> an <span class=\"wl wl-kjv\" data-code=\"H374\">ephah</span> of <span class=\"wl wl-kjv\" data-code=\"H2088\">this</span> <span class=\"wl wl-kjv\" data-code=\"H7039\">parched</span> corn, and these <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">loaves,</span> and <span class=\"wl wl-kjv\" data-code=\"H7323\">run</span> to the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp</span> to thy <span class=\"wl wl-kjv\" data-code=\"H251\">brethren;</span>","18":"And <span class=\"wl wl-kjv\" data-code=\"H935\">carry</span> these <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H2461\">cheeses</span> unto the <span class=\"wl wl-kjv\" data-code=\"H8269\">captain</span> of their <span class=\"wl wl-kjv\" data-code=\"H505\">thousand,</span> and <span class=\"wl wl-kjv\" data-code=\"H6485\">look</span> how thy <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> <span class=\"wl wl-kjv\" data-code=\"H7965\">fare,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> their <span class=\"wl wl-kjv\" data-code=\"H6161\">pledge.</span>","19":"Now <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> and they, and all the <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> were in the <span class=\"wl wl-kjv\" data-code=\"H6010\">valley</span> of <span class=\"wl wl-kjv\" data-code=\"H425\">Elah,</span> <span class=\"wl wl-kjv\" data-code=\"H3898\">fighting</span> with the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines.</span>","20":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> rose up <span class=\"wl wl-kjv\" data-code=\"H7925\">early</span> in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning,</span> and <span class=\"wl wl-kjv\" data-code=\"H5203\">left</span> the <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep</span> with a <span class=\"wl wl-kjv\" data-code=\"H8104\">keeper,</span> and <span class=\"wl wl-kjv\" data-code=\"H5375\">took,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">went,</span> as <span class=\"wl wl-kjv\" data-code=\"H3448\">Jesse</span> had <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> him; and he <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the <span class=\"wl wl-kjv\" data-code=\"H4570\">trench,</span> as the <span class=\"wl wl-kjv\" data-code=\"H2428\">host</span> was going <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> to the <span class=\"wl wl-kjv\" data-code=\"H4634\">fight,</span> and <span class=\"wl wl-kjv\" data-code=\"H7321\">shouted</span> for the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle.</span>","21":"For <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> and the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> had put the battle in <span class=\"wl wl-kjv\" data-code=\"H6186\">array,</span> <span class=\"wl wl-kjv\" data-code=\"H4634\">army</span> <span class=\"wl wl-kjv\" data-code=\"H7125\">against</span> <span class=\"wl wl-kjv\" data-code=\"H4634\">army.</span>","22":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H5203\">left</span> his <span class=\"wl wl-kjv\" data-code=\"H3627\">carriage</span> in the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H8104\">keeper</span> of the <span class=\"wl wl-kjv\" data-code=\"H3627\">carriage,</span> and <span class=\"wl wl-kjv\" data-code=\"H7323\">ran</span> into the <span class=\"wl wl-kjv\" data-code=\"H4634\">army,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> and <span class=\"wl wl-kjv\" data-code=\"H7592\">saluted</span> his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren.</span>","23":"And as he <span class=\"wl wl-kjv\" data-code=\"H1696\">talked</span> with them, behold, there came <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H376\">champion,</span> the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine</span> of <span class=\"wl wl-kjv\" data-code=\"H1661\">Gath,</span> <span class=\"wl wl-kjv\" data-code=\"H1555\">Goliath</span> by <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> out of the <span class=\"wl wl-kjv\" data-code=\"H4634\">armies</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines,</span> and <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> according to the <span class=\"wl wl-kjv\" data-code=\"H428\">same</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">words:</span> and <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> them.","24":"And all the <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> when they <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> the <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> <span class=\"wl wl-kjv\" data-code=\"H5127\">fled</span> from <span class=\"wl wl-kjv\" data-code=\"H6440\">him,</span> and were <span class=\"wl wl-kjv\" data-code=\"H3966\">sore</span> <span class=\"wl wl-kjv\" data-code=\"H3372\">afraid.</span>","25":"And the <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Have ye <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> this <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> that is come <span class=\"wl wl-kjv\" data-code=\"H5927\">up?</span> surely to <span class=\"wl wl-kjv\" data-code=\"H2778\">defy</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> is he come <span class=\"wl wl-kjv\" data-code=\"H5927\">up:</span> and it shall be, that the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> who <span class=\"wl wl-kjv\" data-code=\"H5221\">killeth</span> him, the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> will <span class=\"wl wl-kjv\" data-code=\"H6238\">enrich</span> him with <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H6239\">riches,</span> and will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> him his <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> <span class=\"wl wl-kjv\" data-code=\"H2670\">free</span> in <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","26":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> to the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> that <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> by him, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> What shall be <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> to the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> that <span class=\"wl wl-kjv\" data-code=\"H5221\">killeth</span> <span class=\"wl wl-kjv\" data-code=\"H1975\">this</span> <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine,</span> and taketh <span class=\"wl wl-kjv\" data-code=\"H5493\">away</span> the <span class=\"wl wl-kjv\" data-code=\"H2781\">reproach</span> from <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel?</span> for who is this <span class=\"wl wl-kjv\" data-code=\"H6189\">uncircumcised</span> <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine,</span> that he should <span class=\"wl wl-kjv\" data-code=\"H2778\">defy</span> the <span class=\"wl wl-kjv\" data-code=\"H4634\">armies</span> of the <span class=\"wl wl-kjv\" data-code=\"H2416\">living</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God?</span>","27":"And the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H559\">answered</span> him after this <span class=\"wl wl-kjv\" data-code=\"H1697\">manner,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> So shall it be <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> to the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> that <span class=\"wl wl-kjv\" data-code=\"H5221\">killeth</span> him.","28":"And <span class=\"wl wl-kjv\" data-code=\"H446\">Eliab</span> his <span class=\"wl wl-kjv\" data-code=\"H1419\">eldest</span> <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> when he <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto the <span class=\"wl wl-kjv\" data-code=\"H582\">men;</span> and <span class=\"wl wl-kjv\" data-code=\"H446\">Eliab's</span> <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> was <span class=\"wl wl-kjv\" data-code=\"H2734\">kindled</span> against <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> and he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Why camest thou <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> hither? and with whom hast thou <span class=\"wl wl-kjv\" data-code=\"H5203\">left</span> <span class=\"wl wl-kjv\" data-code=\"H2007\">those</span> <span class=\"wl wl-kjv\" data-code=\"H4592\">few</span> <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep</span> in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness?</span> I <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> thy <span class=\"wl wl-kjv\" data-code=\"H2087\">pride,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7455\">naughtiness</span> of thine <span class=\"wl wl-kjv\" data-code=\"H3824\">heart;</span> for thou art come <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> that thou mightest <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle.</span>","29":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> What have I now <span class=\"wl wl-kjv\" data-code=\"H6213\">done?</span> Is there not a <span class=\"wl wl-kjv\" data-code=\"H1697\">cause?</span>","30":"And he <span class=\"wl wl-kjv\" data-code=\"H5437\">turned</span> from <span class=\"wl wl-kjv\" data-code=\"H681\">him</span> <span class=\"wl wl-kjv\" data-code=\"H4136\">toward</span> <span class=\"wl wl-kjv\" data-code=\"H312\">another,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> after the same <span class=\"wl wl-kjv\" data-code=\"H1697\">manner:</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">answered</span> him <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> after the <span class=\"wl wl-kjv\" data-code=\"H7223\">former</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">manner.</span>","31":"And when the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> were <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> which <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake,</span> they <span class=\"wl wl-kjv\" data-code=\"H5046\">rehearsed</span> them <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul:</span> and he <span class=\"wl wl-kjv\" data-code=\"H3947\">sent</span> for him.","32":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> Let no <span class=\"wl wl-kjv\" data-code=\"H120\">man's</span> <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> <span class=\"wl wl-kjv\" data-code=\"H5307\">fail</span> because of him; thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> will <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> and <span class=\"wl wl-kjv\" data-code=\"H3898\">fight</span> with this <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine.</span>","33":"And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> Thou art not <span class=\"wl wl-kjv\" data-code=\"H3201\">able</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> against this <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine</span> to <span class=\"wl wl-kjv\" data-code=\"H3898\">fight</span> with him: for thou art but a <span class=\"wl wl-kjv\" data-code=\"H5288\">youth,</span> and he a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H4421\">war</span> from his <span class=\"wl wl-kjv\" data-code=\"H5271\">youth.</span>","34":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> Thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H7462\">kept</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep,</span> and there <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> a <span class=\"wl wl-kjv\" data-code=\"H738\">lion,</span> and a <span class=\"wl wl-kjv\" data-code=\"H1677\">bear,</span> and <span class=\"wl wl-kjv\" data-code=\"H5375\">took</span> a <span class=\"wl wl-kjv\" data-code=\"H7716\">lamb</span> out of the <span class=\"wl wl-kjv\" data-code=\"H5739\">flock:</span>","35":"And I went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> him, and <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> him, and <span class=\"wl wl-kjv\" data-code=\"H5337\">delivered</span> it out of his <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth:</span> and when he <span class=\"wl wl-kjv\" data-code=\"H6965\">arose</span> against me, I <span class=\"wl wl-kjv\" data-code=\"H2388\">caught</span> him by his <span class=\"wl wl-kjv\" data-code=\"H2206\">beard,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> him, and <span class=\"wl wl-kjv\" data-code=\"H4191\">slew</span> him.","36":"Thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H5221\">slew</span> both the <span class=\"wl wl-kjv\" data-code=\"H738\">lion</span> and the <span class=\"wl wl-kjv\" data-code=\"H1677\">bear:</span> and this <span class=\"wl wl-kjv\" data-code=\"H6189\">uncircumcised</span> <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine</span> shall be as <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of them, seeing he hath <span class=\"wl wl-kjv\" data-code=\"H2778\">defied</span> the <span class=\"wl wl-kjv\" data-code=\"H4634\">armies</span> of the <span class=\"wl wl-kjv\" data-code=\"H2416\">living</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God.</span>","37":"<span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> moreover, The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> that <span class=\"wl wl-kjv\" data-code=\"H5337\">delivered</span> me out of the <span class=\"wl wl-kjv\" data-code=\"H3027\">paw</span> of the <span class=\"wl wl-kjv\" data-code=\"H738\">lion,</span> and out of the <span class=\"wl wl-kjv\" data-code=\"H3027\">paw</span> of the <span class=\"wl wl-kjv\" data-code=\"H1677\">bear,</span> he will <span class=\"wl wl-kjv\" data-code=\"H5337\">deliver</span> me out of the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of this <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine.</span> And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Go,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> be with thee.","38":"And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H3847\">armed</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> with his <span class=\"wl wl-kjv\" data-code=\"H4055\">armour,</span> and he <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> an <span class=\"wl wl-kjv\" data-code=\"H6959\">helmet</span> of <span class=\"wl wl-kjv\" data-code=\"H5178\">brass</span> upon his <span class=\"wl wl-kjv\" data-code=\"H7218\">head;</span> also he <span class=\"wl wl-kjv\" data-code=\"H3847\">armed</span> him with a coat of <span class=\"wl wl-kjv\" data-code=\"H8302\">mail.</span>","39":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H2296\">girded</span> his <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> upon his <span class=\"wl wl-kjv\" data-code=\"H4055\">armour,</span> and he <span class=\"wl wl-kjv\" data-code=\"H2974\">assayed</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">go;</span> for he had not <span class=\"wl wl-kjv\" data-code=\"H5254\">proved</span> it. And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> I <span class=\"wl wl-kjv\" data-code=\"H3201\">cannot</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> with these; for I have not <span class=\"wl wl-kjv\" data-code=\"H5254\">proved</span> them. And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H5493\">put</span> them off him.","40":"And he <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> his <span class=\"wl wl-kjv\" data-code=\"H4731\">staff</span> in his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and <span class=\"wl wl-kjv\" data-code=\"H977\">chose</span> him <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H2512\">smooth</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stones</span> out of the <span class=\"wl wl-kjv\" data-code=\"H5158\">brook,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> them in a <span class=\"wl wl-kjv\" data-code=\"H7462\">shepherd's</span> <span class=\"wl wl-kjv\" data-code=\"H3627\">bag</span> which he had, even in a <span class=\"wl wl-kjv\" data-code=\"H3219\">scrip;</span> and his <span class=\"wl wl-kjv\" data-code=\"H7050\">sling</span> was in his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand:</span> and he drew <span class=\"wl wl-kjv\" data-code=\"H5066\">near</span> to the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine.</span>","41":"And the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">came</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">on</span> and drew <span class=\"wl wl-kjv\" data-code=\"H7131\">near</span> unto <span class=\"wl wl-kjv\" data-code=\"H1732\">David;</span> and the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> that <span class=\"wl wl-kjv\" data-code=\"H5375\">bare</span> the <span class=\"wl wl-kjv\" data-code=\"H6793\">shield</span> went <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him.","42":"And when the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine</span> looked <span class=\"wl wl-kjv\" data-code=\"H5027\">about,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> he <span class=\"wl wl-kjv\" data-code=\"H959\">disdained</span> him: for he was but a <span class=\"wl wl-kjv\" data-code=\"H5288\">youth,</span> and <span class=\"wl wl-kjv\" data-code=\"H132\">ruddy,</span> and of a <span class=\"wl wl-kjv\" data-code=\"H3303\">fair</span> <span class=\"wl wl-kjv\" data-code=\"H4758\">countenance.</span>","43":"And the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> Am I a <span class=\"wl wl-kjv\" data-code=\"H3611\">dog,</span> that thou <span class=\"wl wl-kjv\" data-code=\"H935\">comest</span> to me with <span class=\"wl wl-kjv\" data-code=\"H4731\">staves?</span> And the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine</span> <span class=\"wl wl-kjv\" data-code=\"H7043\">cursed</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> by his <span class=\"wl wl-kjv\" data-code=\"H430\">gods.</span>","44":"And the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Come</span> to me, and I will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thy <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5775\">fowls</span> of the <span class=\"wl wl-kjv\" data-code=\"H8064\">air,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H929\">beasts</span> of the <span class=\"wl wl-kjv\" data-code=\"H7704\">field.</span>","45":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> to the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine,</span> Thou <span class=\"wl wl-kjv\" data-code=\"H935\">comest</span> to me with a <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> and with a <span class=\"wl wl-kjv\" data-code=\"H2595\">spear,</span> and with a <span class=\"wl wl-kjv\" data-code=\"H3591\">shield:</span> but I <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to thee in the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of the <span class=\"wl wl-kjv\" data-code=\"H4634\">armies</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> whom thou hast <span class=\"wl wl-kjv\" data-code=\"H2778\">defied.</span>","46":"This <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> will the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5462\">deliver</span> thee into mine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand;</span> and I will <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> thee, and <span class=\"wl wl-kjv\" data-code=\"H5493\">take</span> thine <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> from thee; and I will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> the <span class=\"wl wl-kjv\" data-code=\"H6297\">carcases</span> of the <span class=\"wl wl-kjv\" data-code=\"H4264\">host</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5775\">fowls</span> of the <span class=\"wl wl-kjv\" data-code=\"H8064\">air,</span> and to the wild <span class=\"wl wl-kjv\" data-code=\"H2416\">beasts</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth;</span> that all the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> may <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that there <span class=\"wl wl-kjv\" data-code=\"H3426\">is</span> a <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> in <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","47":"And all this <span class=\"wl wl-kjv\" data-code=\"H6951\">assembly</span> shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H3467\">saveth</span> not with <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> and <span class=\"wl wl-kjv\" data-code=\"H2595\">spear:</span> for the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle</span> is the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S,</span> and he will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> you into our <span class=\"wl wl-kjv\" data-code=\"H3027\">hands.</span>","48":"And it came to pass, when the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">came</span> and drew <span class=\"wl wl-kjv\" data-code=\"H7126\">nigh</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> that <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H4116\">hasted,</span> and <span class=\"wl wl-kjv\" data-code=\"H7323\">ran</span> toward the <span class=\"wl wl-kjv\" data-code=\"H4634\">army</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine.</span>","49":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">put</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> in his <span class=\"wl wl-kjv\" data-code=\"H3627\">bag,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> thence a <span class=\"wl wl-kjv\" data-code=\"H68\">stone,</span> and <span class=\"wl wl-kjv\" data-code=\"H7049\">slang</span> it, and <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine</span> in his <span class=\"wl wl-kjv\" data-code=\"H4696\">forehead,</span> that the <span class=\"wl wl-kjv\" data-code=\"H68\">stone</span> <span class=\"wl wl-kjv\" data-code=\"H2883\">sunk</span> into his <span class=\"wl wl-kjv\" data-code=\"H4696\">forehead;</span> and he <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> upon his <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> to the <span class=\"wl wl-kjv\" data-code=\"H776\">earth.</span>","50":"So <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H2388\">prevailed</span> <span class=\"wl wl-kjv\" data-code=\"H4480\">over</span> the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine</span> with a <span class=\"wl wl-kjv\" data-code=\"H7050\">sling</span> and with a <span class=\"wl wl-kjv\" data-code=\"H68\">stone,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine,</span> and <span class=\"wl wl-kjv\" data-code=\"H4191\">slew</span> him; but there was no <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> in the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David.</span>","51":"Therefore <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H7323\">ran,</span> and <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> upon the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> his <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> and <span class=\"wl wl-kjv\" data-code=\"H8025\">drew</span> it out of the <span class=\"wl wl-kjv\" data-code=\"H8593\">sheath</span> thereof, and <span class=\"wl wl-kjv\" data-code=\"H4191\">slew</span> him, and cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> his <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> therewith. And when the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> their <span class=\"wl wl-kjv\" data-code=\"H1368\">champion</span> was <span class=\"wl wl-kjv\" data-code=\"H4191\">dead,</span> they <span class=\"wl wl-kjv\" data-code=\"H5127\">fled.</span>","52":"And the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> and of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and <span class=\"wl wl-kjv\" data-code=\"H7321\">shouted,</span> and <span class=\"wl wl-kjv\" data-code=\"H7291\">pursued</span> the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines,</span> until thou <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to the <span class=\"wl wl-kjv\" data-code=\"H1516\">valley,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H8179\">gates</span> of <span class=\"wl wl-kjv\" data-code=\"H6138\">Ekron.</span> And the <span class=\"wl wl-kjv\" data-code=\"H2491\">wounded</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> fell <span class=\"wl wl-kjv\" data-code=\"H5307\">down</span> by the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> to <span class=\"wl wl-kjv\" data-code=\"H8189\">Shaaraim,</span> even unto <span class=\"wl wl-kjv\" data-code=\"H1661\">Gath,</span> and unto <span class=\"wl wl-kjv\" data-code=\"H6138\">Ekron.</span>","53":"And the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> from <span class=\"wl wl-kjv\" data-code=\"H1814\">chasing</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines,</span> and they <span class=\"wl wl-kjv\" data-code=\"H8155\">spoiled</span> their <span class=\"wl wl-kjv\" data-code=\"H4264\">tents.</span>","54":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> the <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> it to <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem;</span> but he <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> his <span class=\"wl wl-kjv\" data-code=\"H3627\">armour</span> in his <span class=\"wl wl-kjv\" data-code=\"H168\">tent.</span>","55":"And when <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> go <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> <span class=\"wl wl-kjv\" data-code=\"H7125\">against</span> the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine,</span> he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H74\">Abner,</span> the <span class=\"wl wl-kjv\" data-code=\"H8269\">captain</span> of the <span class=\"wl wl-kjv\" data-code=\"H6635\">host,</span> <span class=\"wl wl-kjv\" data-code=\"H74\">Abner,</span> whose <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> is this <span class=\"wl wl-kjv\" data-code=\"H5288\">youth?</span> And <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> As thy <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> O <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> I <span class=\"wl wl-kjv\" data-code=\"H518\">cannot</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">tell.</span>","56":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H7592\">Enquire</span> thou whose <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> the <span class=\"wl wl-kjv\" data-code=\"H5958\">stripling</span> is.","57":"And as <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> from the <span class=\"wl wl-kjv\" data-code=\"H5221\">slaughter</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine,</span> <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> him, and <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> him <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> with the <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine</span> in his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand.</span>","58":"And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to him, Whose <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> art thou, thou young <span class=\"wl wl-kjv\" data-code=\"H5288\">man?</span> And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> I am the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H3448\">Jesse</span> the <span class=\"wl wl-kjv\" data-code=\"H1022\">Bethlehemite.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"de Filistijnen","tekst":"Hier wordt, volgens eniger gevoelen, verhaald hetgeen geschied is eer David aan het hof gekomen is, hetwelk op het einde van 1Sa 16 beschreven staat; maar het wordt hier gesteld, om aan te wijzen door wat oorzaak David aan Sauls hof gekomen is."},{"catchword":"Socho,","tekst":"Een stad, gelegen in den stam van Juda, Jos 15:35. Rehabeam heeft haar gebouwd en gesterkt, 2Ch 11:7. Maar ten tijde van Achaz hebben de Filistijnen haar weder ingenomen, 2Ch 28:18."},{"catchword":"Azéka,","tekst":"Deze stad was gelegen in de uiterste palen van den stam van Juda tegen het westen, Jos 15:35. Rehabeam heeft haar vastgemaakt, 2Ch 11:9; en zij is van Nebukadnezar belegerd. Zie Jer 34:7."},{"catchword":"het einde van Dammim","tekst":"Anders, Efes-Dammim genoemd en Pas-Dammim, 1Ch 11:13."}],"4":[{"catchword":"een kampvechter uit,","tekst":"Hebreeuws, een man tussen twee, of, tussenbeiden, of, tussenbeiden treden. Deze reus schijnt aldus genaamd te zijn omdat hij zich tussen de beide legers stelde, en aanbood met iemand te vechten; of, een man tussen twee; dat is, die tussen hun tweeën een kamp leveren willen. Anders, een tweevechter"},{"catchword":"een span","tekst":"Begrijpende wel drie handbreedten, of twaalf vingers."}],"5":[{"catchword":"vijf duizend sikkelen kopers;","tekst":"Vier gemene sikkelen doen een ons, zodat, naar die rekening, dit harnas gewogen heeft 1250 onsen; dat is, 78 pond en twee onsen."}],"6":[{"catchword":"schild tussen zijn schouders;","tekst":"Of, halskraag, ringkraag, of, schouderwapen."}],"8":[{"catchword":"Waarom zoudt gijlieden uittrekken,","tekst":"Hij wil zeggen: Wat is het van node, dat het gehele leger in de wapenen komt om te strijden? Het kan met minder moeite geschieden, te weten, als gij iemand van de uwen uitmaakt, die man voor man met mij vecht."},{"catchword":"mij afkome","tekst":"Te weten, om alleen tegen mij alleen te vechten."}],"10":[{"catchword":"Verder zeide de Filistijn","tekst":"Te weten, toen hij zag dat er niemand uitkwam om met hem te vechten."},{"catchword":"Ik heb heden","tekst":"Te weten, dewijl ik hen uitgeroepen heb, om een uit te zenden, die tegen mij alleen zou komen strijden, en daar is niemand onder hen allen, die dat durft bestaan. Dit zal hun een eeuwige schande en verwijt zijn; wat mij aangaat, ik heb, enz."}],"12":[{"catchword":"Efrathischen man","tekst":"Van welken gesproken wordt boven, 1Sa 16:19."},{"catchword":"acht zonen had,","tekst":"Vergelijk 1Ch 2:13-14."}],"14":[{"catchword":"kleinste;","tekst":"Te weten, onder die, die eigenlijk zonen genoemd worden. Zie boven, 1Sa 16:11."}],"15":[{"catchword":"Doch David ging henen,","tekst":"Sommigen verstaan dit alzo, dat David dikwijls heeft over en weder gegaan, zijnde van zijn vader telkens gezonden in het leger om te vernemen, hoe het met zijn zonen al ging, en om hen van nooddruft te verzorgen, vs.17; als hij dit verricht had, zo keerde hij weder tot de schapen."},{"catchword":"van Saul,","tekst":"Dat is, naar sommiger gevoelen, van zijn broeders, die bij Saul in het leger waren, want dit is geschied eer David aan het hof gekomen was."}],"17":[{"catchword":"toch voor uw broeders","tekst":"Anders, nu"},{"catchword":"een efa","tekst":"Zie van deze maat Exo 16:36."}],"18":[{"catchword":"melkkazen","tekst":"Dat is, verse kazen, waar men de melk nog kon uitdrukken."},{"catchword":"gij zult van hen pand medenemen","tekst":"Te weten, opdat ik daaruit voorzeker moge afnemen dat gij uw boodschap terdeeg gedaan hebt."}],"20":[{"catchword":"aan den wagenburg,","tekst":"Dat is, aan die plaats, waar het leger met de bagagewagens als besloten of omsingeld was. Alzo ook onder, 1Sa 26:5."},{"catchword":"men ten strijde riep","tekst":"Anders, en zij maakten een veldgeschrei tot den oorlog, of, zij maakten een groot geroep in het leger, gelijk wanneer daar een alarm is."}],"22":[{"catchword":"de vaten van zich,","tekst":"Versta hier, dat David zijn gereedschap, of bagage, of zak, waarin hij de kazen en de broden droeg [waarvan vs.17 staat] bij de bewaarders der vaten gelaten heeft, om des te spoediger het leger te gaan doorzien."},{"catchword":"naar hun welstand","tekst":"Hebreeuws, naar den vrede."}],"23":[{"catchword":"op;","tekst":"Te weten, opwaarts naar den berg, waar het leger der Israëlieten lag, vs.3."},{"catchword":"het heir der Filistijnen,","tekst":"Of, slagordening"},{"catchword":"achtervolgens die woorden;","tekst":"Te weten, die vs.8 staan."}],"25":[{"catchword":"hij zal zijns vaders huis vrijmaken in Israël","tekst":"Dat is, hij zal hem en zijn huis edel maken, en die privilegiën en vrijheden geven, die men placht den edelen te geven, wanneer zij zich in den dienst van het land en hun prins wel gekweten hadden."}],"26":[{"catchword":"Wat zal men dien man doen,","tekst":"Hebreeuws, wat zal dien man gedaan worden?"}],"29":[{"catchword":"Wat heb ik nu gedaan?","tekst":"Te weten, waarom gij mij dus bekijft, en beschuldigt van hovaardij?"},{"catchword":"Is er geen oorzaak?","tekst":"Alsof hij zeide: Mijn vader heeft mij immers hier tot ulieden gezonden. Anders, is het niet dit woord, of oorzaak? Dat is, naar sommiger mening: Is dat woord, dat ik daar gesproken heb, oorzaak dat gij op mij zo vergramd zijt en mij zo bekijft? Anders, is dat de zaak niet?"}],"30":[{"catchword":"en hij zeide achtervolgens dat woord;","tekst":"David heeft dikwijls verscheidene personen gevraagd, eensdeels om de zekerheid der zaak volkomenlijk te vernemen, anderdeels om zijn genegenheid om met dezen Flistijn te kampen, ruchtbaar te maken, opdat het alzo voor den koning mocht komen."}],"31":[{"catchword":"zo liet hij hem halen","tekst":"Hebreeuws, nam hij hem."}],"32":[{"catchword":"Uw knecht zal heengaan","tekst":"Dat is, ik die uw knecht ben, alzo ook onder, vs.34."}],"33":[{"catchword":"kunnen heengaan","tekst":"Te weten met hoop of uitzicht van hem te overwinnen."},{"catchword":"een jongeling,","tekst":"En derhalve nog onervaren in zaken van oorlog; of, een kind; te weten, vergeleken zijn met dezen reus."}],"34":[{"catchword":"weidde de schapen zijns vaders,","tekst":"Hebreeuws, was weidende onder de schapen"},{"catchword":"een schaap van de kudde weg","tekst":"Of, lam, of, geit."}],"36":[{"catchword":"alzo zal deze onbesneden Filistijn zijn,","tekst":"Of hij zeggen wilde: Hij zal van mij geslagen en gedood worden, gelijk ik den leeuw en den beer gedood heb."}],"37":[{"catchword":"hand des leeuws gered heeft,","tekst":"Of, poot, klauw. 41. hand des beers, Of, poot, klauw."}],"38":[{"catchword":"zijn klederen,","tekst":"Versta dit van Sauls klederen, dat is, wapenen, die hij placht aan te trekken als hij ten strijde ging, of die hij uit zijn wapenhuis heeft genomen, die David pasten."}],"39":[{"catchword":"en wilde gaan;","tekst":"Of, en begon te gaan"},{"catchword":"deze niet gaan,","tekst":"Te weten, wapenen, of rustingen, of harnassen."}],"40":[{"catchword":"herderstas,","tekst":"Hebreeuws, vat."}],"41":[{"catchword":"zijn schilddrager","tekst":"Hebreeuws, de man die het schild droeg."}],"43":[{"catchword":"met stokken?","tekst":"Andes, met een stok. David had maar een stok of herdersstaf, vs.40, zodat hier het getal van velen schijnt te staan voor het getal van een. Zie Gen 21:7."}],"45":[{"catchword":"Gij komt tot mij met een zwaard,","tekst":"Dat is, gij verlaat u op uw zwaard, enz. Zie boven, vs.5,6."},{"catchword":"den","tekst":"Dat is, door ingeving Gods, en hebbende zijn naam eerst aangeroepen, en verlaat mij op zijn genadige hulp en bijstand, welke Hij dengenen, die op hem vertrouwen, beloofd heeft."},{"catchword":"Naam van den HEERE der heirscharen,","tekst":"Zie Pro 18:10."},{"catchword":"Dien gij gehoond hebt","tekst":"Of, dat; te weten, heir."}],"46":[{"catchword":"een God heeft","tekst":"Te weten, een God, die met de daad doet blijken dat Hij almachtig is."}],"47":[{"catchword":"want de krijg is des HEEREN,","tekst":"Dat is, God, die den krijg regeert, geeft de overwinning die het hem belieft. Anders, want deze krijg is des Heeren; alsof hij zeide: Gijlieden voert krijg tegen den Heere, maar wij voor den Heere. Hij betreft zijn eer en de verlossing zijns volks."}],"48":[{"catchword":"naar de slagorde toe,","tekst":"Te weten, tot de kampplaats tussen de beide legers."}],"49":[{"catchword":"trof den Filistijn in zijn voorhoofd;","tekst":"Hebreeuws, sloeg"},{"catchword":"zodat de steen zonk","tekst":"Dat is, zodat de steen in zijn voorhoofd bleef stekende. Het Hebreeuwse woord betekent eigenlijk in het water dopen of inzinken. De zin is: dat de steen zo lichtelijk en zo diep in zijn voorhoofd ging en bleef zitten, alsof hij daarin versmoord en bedekt ware geweest, en dit door de kracht Gods, die met David was."}],"52":[{"catchword":"aan de vallei,","tekst":"Van welken gesproken is vs.3."},{"catchword":"Saäráïm,","tekst":"Een stad, gelegen in den stam van Juda, gelijk te zien is Jos 15:36."}],"53":[{"catchword":"legers","tekst":"Hij spreekt in het getal van velen, ten aanzien van de verscheidene kwartieren en het groot getal der krijgslieden, der paarden en andere lastdragende beesten, die in dit leger der Filistijnen waren."}],"54":[{"catchword":"wapenen","tekst":"Te weten, Goliaths wapenen, die David hem had afgenomen. Maar Goliaths zwaard heeft David, eer hij koning werd, in de tent der samenkomst te Nob gelegd. Zie onder, 1Sa 21:9."}],"55":[{"catchword":"Wiens zoon is deze jongeling,","tekst":"Deze dingen zijn geschied eer David aan het hof kwam; zie op vs.1. Eenigen menen dat Sauls verstand en memorie, doordien hem de kwade geest zo plaagde, gekrenkt en gekwetst was, alzo dat hij vergeten had wiens zoon David was. Anderen zeggen dat Saul David wel kende, zoveel zijn persoon aanging, maar dat hij nu begeert te weten van welk geslacht en plaats hij gesproten was. Wat Abner aangaat, sommigen menen dat hij niet aan het hof was toen David van Saul geroepen werd om voor hem te spelen, maar hier of daar bij het leger mag geweest zijn, gelijk hij den meesten tijd was."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And the Philistines gathered together their army to battle, [here, according to the opinion of some, is related that which was done before David came to the Court, which is described at the end of the 10. Chapter, but it&acirc;&euro;&trade;s here set down, to shew by what means, or upon what occasion David came into the Court of Saul] and gathered themselves together at Socho [ a city lying in the tribe if Juda, Jos 15.35. Rehabeam built and fortified the same, 2 Chron 11.8. But in the time of Achaz the Philistines took the same again, 2 Chron 28.18.] which is Juda: and they camped themselves between Socho, and between Azeka, [This city lay in the uttermost borders of the tribe of Juda towards the West, Jos.15.45, Rehabeam feared the lame,1Cron.11.9 and it was besieged by Nebuchadnezzar: see Jer 34.] at the end of Dammim. [Oth. called Ephes-Dammim, and Paul-Dammim, 1 Chron 11.13.]"}],"2":[{"catchword":null,"tekst":"But Saul and the men of Israel gathered themselves together, and camped in the Oak-valley: and set the battle in array against the Philistines."}],"3":[{"catchword":null,"tekst":"Now the Philistines stood on a mount on that (side) and the Israelites stood on a mountain on this side: and the valley was between them."}],"4":[{"catchword":null,"tekst":"Then went there out a champion, [Heb. a man between two, or, between both, or, a treader between both. This Giant seemeth to be called thus, because he put himself between both the camps, and challenged to fight with any: or, a man between two; i e. that between them the two will fight a duel, or single- combate. Oth. a dueller] out of the camp of the Philistines, his name was Goliath of Gath: his height was fix ells (or cubits), and a span,) [containing about three hundred breaths, or twelve inches]."}],"5":[{"catchword":null,"tekst":"And he had a copper-helmet on his head, and he had a scaly coat of male on: and the weight of the coat of mil was five thousand shekel of copper: [Four common shekels make an ounce so that after that reckoning this harnass weighed 1 250ounces;i.e.78 pound, and two ounces.]"}],"6":[{"catchword":null,"tekst":"And a copper leg-harnass upon his feet, and a copper target [Or, neck-piece, breast-plate, or, shoulder-harnass] between his shoulders."}],"7":[{"catchword":null,"tekst":"And the staff of his spear was as a Weavers beam, and the head of his spear was (made) of six hundred shekels of iron: and the target-bearer went before his face."}],"8":[{"catchword":null,"tekst":"Now this (man) stood ,and cried to the armies of Israel, and said unto them, Why should you go forth to the battle in aray? am not I a Philistine, and the servant of Saul? Chuse a man among you, that may come down to me [viz. To fight singly with me alone; as if he should say, What need is there that the whole army be engaged in battle, the chusing one man out amongst you all that may enter the List with me, and fight with me hand to hand.]"}],"9":[{"catchword":null,"tekst":"If he be able to fight with me, and kill me, then we will be servants unto you: but if I conquer him, and smite him, then shall ye be servants unto us, and serve us."}],"10":[{"catchword":null,"tekst":"Moreover, the Philistine said, [viz. When he saw that no man came forth to fight with him] I have defied the armies of Israel this day,[viz. seeing I have challenged them, to send one man forth from among them, to fight a single combat with me, and there&acirc;&euro;&trade;s none of them all the dares attempt to do it: this will lie as a perpertual shame and reproach upon them; as concerning me I have 8zc.(saying) give me a man, that we may fight together."}],"11":[{"catchword":null,"tekst":"When Saul and Israel heard these word of the Philistine: they were then dismayed, and feared greatly."}],"12":[{"catchword":null,"tekst":"Now David was the son of the Ephraitish man of Bethlehem Juda, [Of whom mention is made above chap. 16.19.] whose name was Isai, and (he) had eight sons: [compare 1 Chron. 2.on ver. 13,14.] and in the days of Saul he was a man, old, decaying, among men."}],"13":[{"catchword":null,"tekst":"And the three greatest sons of Isai went their way they followed after Saul into the war: Now the names of the three sons, that went into war, were, Eliab the first-born, and his second Abinadab, and the third Samma."}],"14":[{"catchword":null,"tekst":"And David was the least: {viz. Among them, that properly are called sons; see above Chapter 16.12.] and the three greatest followed after Saul."}],"15":[{"catchword":null,"tekst":"But David went his ways, [Some do understand this thus, that David went often to and fro, being eftstoons sent by his Farther into the camp, to enquire how the caf&Atilde;&copy; stood with his sons, and to furnish them with necessaries, ver. 17. Which when he had done, he then returned to the sheep] and returned from Saul,[i.e. according to the opinion of some, from his bretheren, which were with Saul in the camp, for this happened before David came to the Court] to feed his fathers sheep at Bethelehem.]"}],"16":[{"catchword":null,"tekst":"Now the Philistines drew near early in the morning, and at evening: Thus he presented himself (there) fourty days together."}],"17":[{"catchword":null,"tekst":"And Isai said unto his son David, Take, I pray thee, [Oth. Now] for thy brethren an Epha [see of this measure, Exod16.36] of this parched corn, and these ten loaves, and carry them speedily into the camp unto thy brethren."}],"18":[{"catchword":null,"tekst":"But carry these ten milk-cheeses [i.e. Fresh-cheeses, out of which the milk might be yet presled] unto the Captain over the thousand:/thou shalt visit thy b // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}

          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
