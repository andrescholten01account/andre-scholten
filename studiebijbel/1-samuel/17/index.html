ass=\"wl\" data-l=\"L2\" data-code=\"H559\">zei</span> tegen <span class=\"wl\" data-l=\"L3\" data-code=\"H4310\">hem</span>: <span class=\"wl\" data-l=\"L3\" data-code=\"H4310\">Wiens</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H1121\">zoon</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H1121\">bent</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H859\">u</span>, <span class=\"wl\" data-l=\"L6\" data-code=\"H5288\">jongeman</span>? <span class=\"wl\" data-l=\"L7\" data-code=\"H1732\">En</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H1732\">David</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H559\">zei</span>: <span class=\"wl\" data-l=\"L4\" data-code=\"H1121\">Ik</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H1121\">ben</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H1121\">een</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H1121\">zoon</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H1121\">van</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H5650\">uw</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H5650\">knecht</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H3448\">Isaï</span>, <span class=\"wl\" data-l=\"L10\" data-code=\"H3448\">de</span> <span class=\"wl\" data-l=\"L11\" data-code=\"H1022\">Bethlehemiet</span>."}, "koppeling_kjv": {"1": "Now the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> gathered <span class=\"wl wl-kjv\" data-code=\"H622\">together</span> their <span class=\"wl wl-kjv\" data-code=\"H4264\">armies</span> to <span class=\"wl wl-kjv\" data-code=\"H4421\">battle,</span> and were gathered <span class=\"wl wl-kjv\" data-code=\"H622\">together</span> at <span class=\"wl wl-kjv\" data-code=\"H7755\">Shochoh,</span> which belongeth to <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> between <span class=\"wl wl-kjv\" data-code=\"H7755\">Shochoh</span> and <span class=\"wl wl-kjv\" data-code=\"H5825\">Azekah,</span> in <span class=\"wl wl-kjv\" data-code=\"H658\">Ephesdammim.</span>", "2": "And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> and the <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> were gathered <span class=\"wl wl-kjv\" data-code=\"H622\">together,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> by the <span class=\"wl wl-kjv\" data-code=\"H6010\">valley</span> of <span class=\"wl wl-kjv\" data-code=\"H425\">Elah,</span> and set the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle</span> in <span class=\"wl wl-kjv\" data-code=\"H6186\">array</span> <span class=\"wl wl-kjv\" data-code=\"H7125\">against</span> the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines.</span>", "3": "And the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> on a <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain</span> on the one side, and <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> on a <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain</span> on the other side: and there was a <span class=\"wl wl-kjv\" data-code=\"H1516\">valley</span> between them.", "4": "And there went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> a <span class=\"wl wl-kjv\" data-code=\"H376\">champion</span> out of the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines,</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">named</span> <span class=\"wl wl-kjv\" data-code=\"H1555\">Goliath,</span> of <span class=\"wl wl-kjv\" data-code=\"H1661\">Gath,</span> whose <span class=\"wl wl-kjv\" data-code=\"H1363\">height</span> was <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H520\">cubits</span> and a <span class=\"wl wl-kjv\" data-code=\"H2239\">span.</span>", "5": "And he had an <span class=\"wl wl-kjv\" data-code=\"H3553\">helmet</span> of <span class=\"wl wl-kjv\" data-code=\"H5178\">brass</span> upon his <span class=\"wl wl-kjv\" data-code=\"H7218\">head,</span> and he was <span class=\"wl wl-kjv\" data-code=\"H3847\">armed</span> with a <span class=\"wl wl-kjv\" data-code=\"H8302\">coat</span> of <span class=\"wl wl-kjv\" data-code=\"H7193\">mail;</span> and the <span class=\"wl wl-kjv\" data-code=\"H4948\">weight</span> of the <span class=\"wl wl-kjv\" data-code=\"H8302\">coat</span> was <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H8255\">shekels</span> of <span class=\"wl wl-kjv\" data-code=\"H5178\">brass.</span>", "6": "And he had <span class=\"wl wl-kjv\" data-code=\"H4697\">greaves</span> of <span class=\"wl wl-kjv\" data-code=\"H5178\">brass</span> upon his <span class=\"wl wl-kjv\" data-code=\"H7272\">legs,</span> and a <span class=\"wl wl-kjv\" data-code=\"H3591\">target</span> of <span class=\"wl wl-kjv\" data-code=\"H5178\">brass</span> between his <span class=\"wl wl-kjv\" data-code=\"H3802\">shoulders.</span>", "7": "And the <span class=\"wl wl-kjv\" data-code=\"H6086\">staff</span> of his <span class=\"wl wl-kjv\" data-code=\"H2595\">spear</span> was like a <span class=\"wl wl-kjv\" data-code=\"H707\">weaver's</span> <span class=\"wl wl-kjv\" data-code=\"H4500\">beam;</span> and his <span class=\"wl wl-kjv\" data-code=\"H2595\">spear's</span> <span class=\"wl wl-kjv\" data-code=\"H3852\">head</span> weighed <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H8255\">shekels</span> of <span class=\"wl wl-kjv\" data-code=\"H1270\">iron:</span> and one <span class=\"wl wl-kjv\" data-code=\"H5375\">bearing</span> a <span class=\"wl wl-kjv\" data-code=\"H6793\">shield</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him.", "8": "And he <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> and <span class=\"wl wl-kjv\" data-code=\"H7121\">cried</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4634\">armies</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, Why are ye come <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> to set your <span class=\"wl wl-kjv\" data-code=\"H4421\">battle</span> in <span class=\"wl wl-kjv\" data-code=\"H6186\">array?</span> am not I a <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine,</span> and ye <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> to <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul?</span> <span class=\"wl wl-kjv\" data-code=\"H1262\">choose</span> you a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> for you, and let him come <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to me.", "9": "If he be <span class=\"wl wl-kjv\" data-code=\"H3201\">able</span> to <span class=\"wl wl-kjv\" data-code=\"H3898\">fight</span> with me, and to <span class=\"wl wl-kjv\" data-code=\"H5221\">kill</span> me, then will we be your <span class=\"wl wl-kjv\" data-code=\"H5650\">servants:</span> but if I <span class=\"wl wl-kjv\" data-code=\"H3201\">prevail</span> against him, and <span class=\"wl wl-kjv\" data-code=\"H5221\">kill</span> him, then shall ye be our <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> and <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> us.", "10": "And the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I <span class=\"wl wl-kjv\" data-code=\"H2778\">defy</span> the <span class=\"wl wl-kjv\" data-code=\"H4634\">armies</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day;</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> me a <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> that we may <span class=\"wl wl-kjv\" data-code=\"H3898\">fight</span> <span class=\"wl wl-kjv\" data-code=\"H3162\">together.</span>", "11": "When <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> and all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> those <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine,</span> they were <span class=\"wl wl-kjv\" data-code=\"H2865\">dismayed,</span> and <span class=\"wl wl-kjv\" data-code=\"H3966\">greatly</span> <span class=\"wl wl-kjv\" data-code=\"H3372\">afraid.</span>", "12": "Now <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> was the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of that <span class=\"wl wl-kjv\" data-code=\"H376\">Ephrathite</span> of <span class=\"wl wl-kjv\" data-code=\"H1035\">Bethlehemjudah,</span> whose <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> was <span class=\"wl wl-kjv\" data-code=\"H3448\">Jesse;</span> and he had <span class=\"wl wl-kjv\" data-code=\"H8083\">eight</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons:</span> and the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H935\">went</span> among <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> for an old <span class=\"wl wl-kjv\" data-code=\"H2204\">man</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul.</span>", "13": "And the <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H1419\">eldest</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H3448\">Jesse</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> and <span class=\"wl wl-kjv\" data-code=\"H310\">followed</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> to the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle:</span> and the <span class=\"wl wl-kjv\" data-code=\"H8034\">names</span> of his <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> that <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> to the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle</span> were <span class=\"wl wl-kjv\" data-code=\"H446\">Eliab</span> the <span class=\"wl wl-kjv\" data-code=\"H1060\">firstborn,</span> and <span class=\"wl wl-kjv\" data-code=\"H4932\">next</span> unto him <span class=\"wl wl-kjv\" data-code=\"H41\">Abinadab,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7992\">third</span> <span class=\"wl wl-kjv\" data-code=\"H8048\">Shammah.</span>", "14": "And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> was the <span class=\"wl wl-kjv\" data-code=\"H6996\">youngest:</span> and the <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H1419\">eldest</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">followed</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul.</span>", "15": "But <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> from <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> to <span class=\"wl wl-kjv\" data-code=\"H7462\">feed</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep</span> at <span class=\"wl wl-kjv\" data-code=\"H1035\">Bethlehem.</span>", "16": "And the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine</span> drew <span class=\"wl wl-kjv\" data-code=\"H5066\">near</span> <span class=\"wl wl-kjv\" data-code=\"H7925\">morning</span> and <span class=\"wl wl-kjv\" data-code=\"H6150\">evening,</span> and <span class=\"wl wl-kjv\" data-code=\"H3320\">presented</span> himself <span class=\"wl wl-kjv\" data-code=\"H705\">forty</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days.</span>", "17": "And <span class=\"wl wl-kjv\" data-code=\"H3448\">Jesse</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">Take</span> now for thy <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> an <span class=\"wl wl-kjv\" data-code=\"H374\">ephah</span> of <span class=\"wl wl-kjv\" data-code=\"H2088\">this</span> <span class=\"wl wl-kjv\" data-code=\"H7039\">parched</span> corn, and these <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">loaves,</span> and <span class=\"wl wl-kjv\" data-code=\"H7323\">run</span> to the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp</span> to thy <span class=\"wl wl-kjv\" data-code=\"H251\">brethren;</span>", "18": "And <span class=\"wl wl-kjv\" data-code=\"H935\">carry</span> these <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H2461\">cheeses</span> unto the <span class=\"wl wl-kjv\" data-code=\"H8269\">captain</span> of their <span class=\"wl wl-kjv\" data-code=\"H505\">thousand,</span> and <span class=\"wl wl-kjv\" data-code=\"H6485\">look</span> how thy <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> <span class=\"wl wl-kjv\" data-code=\"H7965\">fare,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> their <span class=\"wl wl-kjv\" data-code=\"H6161\">pledge.</span>", "19": "Now <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> and they, and all the <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> were in the <span class=\"wl wl-kjv\" data-code=\"H6010\">valley</span> of <span class=\"wl wl-kjv\" data-code=\"H425\">Elah,</span> <span class=\"wl wl-kjv\" data-code=\"H3898\">fighting</span> with the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines.</span>", "20": "And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> rose up <span class=\"wl wl-kjv\" data-code=\"H7925\">early</span> in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning,</span> and <span class=\"wl wl-kjv\" data-code=\"H5203\">left</span> the <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep</span> with a <span class=\"wl wl-kjv\" data-code=\"H8104\">keeper,</span> and <span class=\"wl wl-kjv\" data-code=\"H5375\">took,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">went,</span> as <span class=\"wl wl-kjv\" data-code=\"H3448\">Jesse</span> had <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> him; and he <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the <span class=\"wl wl-kjv\" data-code=\"H4570\">trench,</span> as the <span class=\"wl wl-kjv\" data-code=\"H2428\">host</span> was going <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> to the <span class=\"wl wl-kjv\" data-code=\"H4634\">fight,</span> and <span class=\"wl wl-kjv\" data-code=\"H7321\">shouted</span> for the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle.</span>", "21": "For <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> and the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> had put the battle in <span class=\"wl wl-kjv\" data-code=\"H6186\">array,</span> <span class=\"wl wl-kjv\" data-code=\"H4634\">army</span> <span class=\"wl wl-kjv\" data-code=\"H7125\">against</span> <span class=\"wl wl-kjv\" data-code=\"H4634\">army.</span>", "22": "And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H5203\">left</span> his <span class=\"wl wl-kjv\" data-code=\"H3627\">carriage</span> in the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H8104\">keeper</span> of the <span class=\"wl wl-kjv\" data-code=\"H3627\">carriage,</span> and <span class=\"wl wl-kjv\" data-code=\"H7323\">ran</span> into the <span class=\"wl wl-kjv\" data-code=\"H4634\">army,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> and <span class=\"wl wl-kjv\" data-code=\"H7592\">saluted</span> his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren.</span>", "23": "And as he <span class=\"wl wl-kjv\" data-code=\"H1696\">talked</span> with them, behold, there came <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H376\">champion,</span> the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine</span> of <span class=\"wl wl-kjv\" data-code=\"H1661\">Gath,</span> <span class=\"wl wl-kjv\" data-code=\"H1555\">Goliath</span> by <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> out of the <span class=\"wl wl-kjv\" data-code=\"H4634\">armies</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines,</span> and <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> according to the <span class=\"wl wl-kjv\" data-code=\"H428\">same</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">words:</span> and <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> them.", "24": "And all the <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> when they <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> the <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> <span class=\"wl wl-kjv\" data-code=\"H5127\">fled</span> from <span class=\"wl wl-kjv\" data-code=\"H6440\">him,</span> and were <span class=\"wl wl-kjv\" data-code=\"H3966\">sore</span> <span class=\"wl wl-kjv\" data-code=\"H3372\">afraid.</span>", "25": "And the <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Have ye <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> this <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> that is come <span class=\"wl wl-kjv\" data-code=\"H5927\">up?</span> surely to <span class=\"wl wl-kjv\" data-code=\"H2778\">defy</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> is he come <span class=\"wl wl-kjv\" data-code=\"H5927\">up:</span> and it shall be, that the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> who <span class=\"wl wl-kjv\" data-code=\"H5221\">killeth</span> him, the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> will <span class=\"wl wl-kjv\" data-code=\"H6238\">enrich</span> him with <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H6239\">riches,</span> and will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> him his <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> <span class=\"wl wl-kjv\" data-code=\"H2670\">free</span> in <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>", "26": "And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> to the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> that <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> by him, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> What shall be <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> to the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> that <span class=\"wl wl-kjv\" data-code=\"H5221\">killeth</span> <span class=\"wl wl-kjv\" data-code=\"H1975\">this</span> <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine,</span> and taketh <span class=\"wl wl-kjv\" data-code=\"H5493\">away</span> the <span class=\"wl wl-kjv\" data-code=\"H2781\">reproach</span> from <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel?</span> for who is this <span class=\"wl wl-kjv\" data-code=\"H6189\">uncircumcised</span> <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine,</span> that he should <span class=\"wl wl-kjv\" data-code=\"H2778\">defy</span> the <span class=\"wl wl-kjv\" data-code=\"H4634\">armies</span> of the <span class=\"wl wl-kjv\" data-code=\"H2416\">living</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God?</span>", "27": "And the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H559\">answered</span> him after this <span class=\"wl wl-kjv\" data-code=\"H1697\">manner,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> So shall it be <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> to the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> that <span class=\"wl wl-kjv\" data-code=\"H5221\">killeth</span> him.", "28": "And <span class=\"wl wl-kjv\" data-code=\"H446\">Eliab</span> his <span class=\"wl wl-kjv\" data-code=\"H1419\">eldest</span> <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> when he <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto the <span class=\"wl wl-kjv\" data-code=\"H582\">men;</span> and <span class=\"wl wl-kjv\" data-code=\"H446\">Eliab's</span> <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> was <span class=\"wl wl-kjv\" data-code=\"H2734\">kindled</span> against <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> and he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Why camest thou <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> hither? and with whom hast thou <span class=\"wl wl-kjv\" data-code=\"H5203\">left</span> <span class=\"wl wl-kjv\" data-code=\"H2007\">those</span> <span class=\"wl wl-kjv\" data-code=\"H4592\">few</span> <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep</span> in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness?</span> I <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> thy <span class=\"wl wl-kjv\" data-code=\"H2087\">pride,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7455\">naughtiness</span> of thine <span class=\"wl wl-kjv\" data-code=\"H3824\">heart;</span> for thou art come <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> that thou mightest <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle.</span>", "29": "And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> What have I now <span class=\"wl wl-kjv\" data-code=\"H6213\">done?</span> Is there not a <span class=\"wl wl-kjv\" data-code=\"H1697\">cause?</span>", "30": "And he <span class=\"wl wl-kjv\" data-code=\"H5437\">turned</span> from <span class=\"wl wl-kjv\" data-code=\"H681\">him</span> <span class=\"wl wl-kjv\" data-code=\"H4136\">toward</span> <span class=\"wl wl-kjv\" data-code=\"H312\">another,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> after the same <span class=\"wl wl-kjv\" data-code=\"H1697\">manner:</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">answered</span> him <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> after the <span class=\"wl wl-kjv\" data-code=\"H7223\">former</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">manner.</span>", "31": "And when the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> were <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> which <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake,</span> they <span class=\"wl wl-kjv\" data-code=\"H5046\">rehearsed</span> them <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul:</span> and he <span class=\"wl wl-kjv\" data-code=\"H3947\">sent</span> for him.", "32": "And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> Let no <span class=\"wl wl-kjv\" data-code=\"H120\">man's</span> <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> <span class=\"wl wl-kjv\" data-code=\"H5307\">fail</span> because of him; thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> will <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> and <span class=\"wl wl-kjv\" data-code=\"H3898\">fight</span> with this <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine.</span>", "33": "And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> Thou art not <span class=\"wl wl-kjv\" data-code=\"H3201\">able</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> against this <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine</span> to <span class=\"wl wl-kjv\" data-code=\"H3898\">fight</span> with him: for thou art but a <span class=\"wl wl-kjv\" data-code=\"H5288\">youth,</span> and he a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H4421\">war</span> from his <span class=\"wl wl-kjv\" data-code=\"H5271\">youth.</span>", "34": "And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> Thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H7462\">kept</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep,</span> and there <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> a <span class=\"wl wl-kjv\" data-code=\"H738\">lion,</span> and a <span class=\"wl wl-kjv\" data-code=\"H1677\">bear,</span> and <span class=\"wl wl-kjv\" data-code=\"H5375\">took</span> a <span class=\"wl wl-kjv\" data-code=\"H7716\">lamb</span> out of the <span class=\"wl wl-kjv\" data-code=\"H5739\">flock:</span>", "35": "And I went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> him, and <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> him, and <span class=\"wl wl-kjv\" data-code=\"H5337\">delivered</span> it out of his <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth:</span> and when he <span class=\"wl wl-kjv\" data-code=\"H6965\">arose</span> against me, I <span class=\"wl wl-kjv\" data-code=\"H2388\">caught</span> him by his <span class=\"wl wl-kjv\" data-code=\"H2206\">beard,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> him, and <span class=\"wl wl-kjv\" data-code=\"H4191\">slew</span> him.", "36": "Thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H5221\">slew</span> both the <span class=\"wl wl-kjv\" data-code=\"H738\">lion</span> and the <span class=\"wl wl-kjv\" data-code=\"H1677\">bear:</span> and this <span class=\"wl wl-kjv\" data-code=\"H6189\">uncircumcised</span> <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine</span> shall be as <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of them, seeing he hath <span class=\"wl wl-kjv\" data-code=\"H2778\">defied</span> the <span class=\"wl wl-kjv\" data-code=\"H4634\">armies</span> of the <span class=\"wl wl-kjv\" data-code=\"H2416\">living</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God.</span>", "37": "<span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> moreover, The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> that <span class=\"wl wl-kjv\" data-code=\"H5337\">delivered</span> me out of the <span class=\"wl wl-kjv\" data-code=\"H3027\">paw</span> of the <span class=\"wl wl-kjv\" data-code=\"H738\">lion,</span> and out of the <span class=\"wl wl-kjv\" data-code=\"H3027\">paw</span> of the <span class=\"wl wl-kjv\" data-code=\"H1677\">bear,</span> he will <span class=\"wl wl-kjv\" data-code=\"H5337\">deliver</span> me out of the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of this <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine.</span> And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Go,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> be with thee.", "38": "And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H3847\">armed</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> with his <span class=\"wl wl-kjv\" data-code=\"H4055\">armour,</span> and he <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> an <span class=\"wl wl-kjv\" data-code=\"H6959\">helmet</span> of <span class=\"wl wl-kjv\" data-code=\"H5178\">brass</span> upon his <span class=\"wl wl-kjv\" data-code=\"H7218\">head;</span> also he <span class=\"wl wl-kjv\" data-code=\"H3847\">armed</span> him with a coat of <span class=\"wl wl-kjv\" data-code=\"H8302\">mail.</span>", "39": "And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H2296\">girded</span> his <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> upon his <span class=\"wl wl-kjv\" data-code=\"H4055\">armour,</span> and he <span class=\"wl wl-kjv\" data-code=\"H2974\">assayed</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">go;</span> for he had not <span class=\"wl wl-kjv\" data-code=\"H5254\">proved</span> it. And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> I <span class=\"wl wl-kjv\" data-code=\"H3201\">cannot</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> with these; for I have not <span class=\"wl wl-kjv\" data-code=\"H5254\">proved</span> them. And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H5493\">put</span> them off him.", "40": "And he <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> his <span class=\"wl wl-kjv\" data-code=\"H4731\">staff</span> in his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and <span class=\"wl wl-kjv\" data-code=\"H977\">chose</span> him <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H2512\">smooth</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stones</span> out of the <span class=\"wl wl-kjv\" data-code=\"H5158\">brook,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> them in a <span class=\"wl wl-kjv\" data-code=\"H7462\">shepherd's</span> <span class=\"wl wl-kjv\" data-code=\"H3627\">bag</span> which he had, even in a <span class=\"wl wl-kjv\" data-code=\"H3219\">scrip;</span> and his <span class=\"wl wl-kjv\" data-code=\"H7050\">sling</span> was in his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand:</span> and he drew <span class=\"wl wl-kjv\" data-code=\"H5066\">near</span> to the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine.</span>", "41": "And the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">came</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">on</span> and drew <span class=\"wl wl-kjv\" data-code=\"H7131\">near</span> unto <span class=\"wl wl-kjv\" data-code=\"H1732\">David;</span> and the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> that <span class=\"wl wl-kjv\" data-code=\"H5375\">bare</span> the <span class=\"wl wl-kjv\" data-code=\"H6793\">shield</span> went <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him.", "42": "And when the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine</span> looked <span class=\"wl wl-kjv\" data-code=\"H5027\">about,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> he <span class=\"wl wl-kjv\" data-code=\"H959\">disdained</span> him: for he was but a <span class=\"wl wl-kjv\" data-code=\"H5288\">youth,</span> and <span class=\"wl wl-kjv\" data-code=\"H132\">ruddy,</span> and of a <span class=\"wl wl-kjv\" data-code=\"H3303\">fair</span> <span class=\"wl wl-kjv\" data-code=\"H4758\">countenance.</span>", "43": "And the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> Am I a <span class=\"wl wl-kjv\" data-code=\"H3611\">dog,</span> that thou <span class=\"wl wl-kjv\" data-code=\"H935\">comest</span> to me with <span class=\"wl wl-kjv\" data-code=\"H4731\">staves?</span> And the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine</span> <span class=\"wl wl-kjv\" data-code=\"H7043\">cursed</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> by his <span class=\"wl wl-kjv\" data-code=\"H430\">gods.</span>", "44": "And the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Come</span> to me, and I will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thy <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5775\">fowls</span> of the <span class=\"wl wl-kjv\" data-code=\"H8064\">air,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H929\">beasts</span> of the <span class=\"wl wl-kjv\" data-code=\"H7704\">field.</span>", "45": "Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> to the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine,</span> Thou <span class=\"wl wl-kjv\" data-code=\"H935\">comest</span> to me with a <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> and with a <span class=\"wl wl-kjv\" data-code=\"H2595\">spear,</span> and with a <span class=\"wl wl-kjv\" data-code=\"H3591\">shield:</span> but I <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to thee in the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of the <span class=\"wl wl-kjv\" data-code=\"H4634\">armies</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> whom thou hast <span class=\"wl wl-kjv\" data-code=\"H2778\">defied.</span>", "46": "This <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> will the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5462\">deliver</span> thee into mine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand;</span> and I will <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> thee, and <span class=\"wl wl-kjv\" data-code=\"H5493\">take</span> thine <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> from thee; const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen bij dit vers.</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
