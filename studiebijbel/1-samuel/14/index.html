rd":"te Migron was;","tekst":"Van Migron wordt ook gesproken Isa 10:28. Het is een stuk lands, gelegen aan de ene zijde der engte naar Gibea aan; hier lag Saul in de spelonk met zijn zes honderd mannen, loerende wat de Filistijnen doen zouden; onder, vs.11."}],"3":[{"catchword":"Ikabod,","tekst":"Zie boven, 1Sa 4:21."},{"catchword":"was priester des HEEREN,","tekst":"Of, van den priester des Heeren te Silo"},{"catchword":"dragende","tekst":"Of, droeg"},{"catchword":"efod;","tekst":"Versta hierbij ook den borstlap en urim en thummim, welken de hogepriester aantoog als hij den Heere om raad vraagde."},{"catchword":"het volk wist niet,","tekst":"Ja ook Saul en de priester wisten het niet."}],"4":[{"catchword":"scherpte van een steenklip","tekst":"Hebreeuws; tand; en zo in het volgende."},{"catchword":"gene zijde;","tekst":"Zodat de wegt tussen twee steenrotsen was."},{"catchword":"andere Séne","tekst":"Hebreeuws, der ene."}],"6":[{"catchword":"dezer onbesnedenen overgaan;","tekst":"Alsof hij zeggen wilde: Deze Filistijnen zijn vreemd van Gods verbond, en derhalve hatelijk voor zijn ogen, maar wij zijn besneden en dragen het teken en het verbond Gods aan onze lichamen."},{"catchword":"misschien zal de HEERE","tekst":"Aldus spreekt Jónathan, omdat hij geen belofte der victorie van God had."},{"catchword":"voor ons werken;","tekst":"Of, [wat] voor ons doen"},{"catchword":"door weinigen","tekst":"Zie hiervan een exempel Jdg 7:7; 2Ch 14. Zie ook Jos 14:12."}],"7":[{"catchword":"al, wat in uw hart is;","tekst":"Dat is, al wat u goeddunkt."},{"catchword":"naar uw hart","tekst":"Dat is, zoals het u belieft of goeddunkt."}],"8":[{"catchword":"wij zullen ons","tekst":"Dat is, wij zullen ons van hen laten zien."}],"9":[{"catchword":"zij aldus tot ons zeggen","tekst":"Zie dergelijk Gen 24:14."},{"catchword":"Staat stil,","tekst":"Hebreeuws, zwijgt. Zie Jos 10:12-13."}],"10":[{"catchword":"dit zal ons een teken zijn","tekst":"Vergelijk Gen 24:14 met de aantekeningen."}],"12":[{"catchword":"antwoordden de mannen","tekst":"Dat is, zeiden, of spraken. Want er gaat geen vraag voor."},{"catchword":"wij zullen het u wijs maken","tekst":"Alsof zij zeiden: Wij zullen u leren en doen gevoelen wat het is zichzelven dus lichtvaardiglijk in perijkel te brengen."}],"13":[{"catchword":"zij vielen voor Jónathans aangezicht,","tekst":"Te weten, zijn vijanden, die hij versloeg."},{"catchword":"zijn wapendrager doodde ze achter hem","tekst":"Hebbende nu een zwaard en wapen gekregen van een der verslagenen; want tevoren hadden Saul en Jónathan alleen zwaarden, gelijk 1Sa 13:22 staat."}],"14":[{"catchword":"geschiedde","tekst":"Met deze woorden wordt te kennen gegeven dat deze slachting geschied is in een klein deel, alzo dat Jónathan lichtelijk van zijne vijanden had kunnen omsingeld en overvallen worden, had hem God niet wonderbaarlijk bijgestaan."},{"catchword":"een juk ossen lands","tekst":"Dat is, zoveel als een jok ossen, onder een jok gaande, op een dag kunnen ploegen."}],"15":[{"catchword":"het leger,","tekst":"Te weten, in het leger der Filistijnen."},{"catchword":"verdervers beefden ook zelven;","tekst":"Te weten, die soldaten, die uitgetrokken waren om het land te verderven, waarvan 1Sa 13:17, gesproken wordt."},{"catchword":"een beving Gods","tekst":"Zie de aantekeningen op Gen 30:8. Hij wil zeggen dat het een verschrikking was, die God over hen zond; of een beving Gods, dat is, een zeer grote beving."}],"16":[{"catchword":"menigte versmolt,","tekst":"Te weten, der Filistijnen."}],"18":[{"catchword":"Ahia","tekst":"Zie boven, vs.3."},{"catchword":"Breng de ark Gods herwaarts","tekst":"Te weten, om God bij de ark te vragen, of ik de Filistijnen vervolgen zal."},{"catchword":"bij de kinderen Israëls","tekst":"Te weten, in het leger, daar zij anders [gelijk men meent] te Silo was."}],"19":[{"catchword":"zeer toenam en vermenigvuldigde;","tekst":"Hebreeuws, gaande ging, en vermenigvuldigde"},{"catchword":"Haal uw hand in","tekst":"Dat is, laat verblijven hetgeen ik u straks bevolen had aangaande de ark. Saul heeft zolang niet willen wachten totdat hij antwoord van God ontvangen had."}],"20":[{"catchword":"het zwaard des enen was tegen den anderen,","tekst":"Hebreeuws, het zwaard des mans tegen zijn naaste; dat is, de Filistijnen sloegen elkander. Zie dergelijk exempel Jdg 7:22, en 2Ch 20:23."}],"21":[{"catchword":"bij de Filistijnen,","tekst":"Te weten, hen als knechten dienende, of, tot hen overgelopen, die bij deze gelegenheid bij de Israëlieten zich vervoegden."},{"catchword":"als eertijds,","tekst":"Hebreeuws, als gisteren eergisteren"},{"catchword":"vervoegden zich ook met de Israëlieten,","tekst":"Hebreeuws, zij [waren] om te zijn met Israël."}],"22":[{"catchword":"die zich verstoken hadden","tekst":"Zie boven, 1Sa 13:6."},{"catchword":"zo kleefden zij ook hen achteraan","tekst":"Dat is, zij hielpen ook de Filistijnen vervolgen en verslaan."}],"23":[{"catchword":"leger trok over naar","tekst":"Hebreeuws, de krijg, of strijd; dat is, de krijgslieden; versta, van het krijgsvolk, hetwelk de Filistijnen vervolgde."},{"catchword":"Beth-aven","tekst":"Niet ver van Michmas gelegen, gelijk te zien is boven, 1Sa 13:5."}],"24":[{"catchword":"mat te dien dage;","tekst":"Of, benauwd, bedrukt, geperst; te weten, door den honger, gelijk volgt."},{"catchword":"had het volk bezworen,","tekst":"Saul heeft het volk verboden te eten, opdat hij te spoediger zijn vijanden zou vervolgen en dempen, vrezende dat zij hem ontkomen zouden indien het volk zich aan het eten begeven had, maar hij gebruikt kwade middelen daartoe."},{"catchword":"Vervloekt zij de man,","tekst":"En volgens dien waardig aan het leven gestraft te worden. Zie vs.39."},{"catchword":"spijze eet tot aan den avond,","tekst":"Hebreeuws, brood; alzo in het volgende. Hier blijkt dat brood genomen wordt voor allerlei spijs, want honig wordt daaronder ook begrepen; alzo ook onder, vs.28, en Gen 43:31."}],"25":[{"catchword":"het ganse volk kwam in een woud;","tekst":"Dat is, al het volk des lands; alzo ook boven, vs.15, en onder, vs.29, en Gen 41:57."}],"26":[{"catchword":"niemand raakte met zijn hand aan zijn mond,","tekst":"Te weten, nadat hij haar in den honig gedoopt had, om daarvan in den mond te steken en te eten; dat is, niemand at daarvan."}],"27":[{"catchword":"Jónathan had het niet gehoord,","tekst":"Want hij was in het leger niet geweest, nadat hij de Filistijnen geslagen had."},{"catchword":"zijn hand tot zijn mond wendde,","tekst":"Versta hierbij, nadat hij van den honig gegeten had, hetwelk men hem aan de ogen kon merken."},{"catchword":"werden zijn ogen verlicht","tekst":"Of, zo zagen zijn ogen; te weten, klaarlijk. Dat is, hij kreeg als nieuwe kracht en wakkerheid."}],"28":[{"catchword":"antwoordde een man uit het volk,","tekst":"Dat is, sprak, of nam het woord."},{"catchword":"heeft het volk zwaarlijk bezworen,","tekst":"Hebreeuws, bezwerende bezworen"},{"catchword":"heden brood eet","tekst":"Te weten, tot aan den avond, gelijk vs.24 staat. Want bij de Hebreën eindigde de dag met den ondergang der zon."},{"catchword":"Daarom bezwijkt het volk","tekst":"Of, het volk is vermoeid, of, moede."}],"29":[{"catchword":"het land beroerd;","tekst":"Dat is, de inwoners des lands, of de krijgslieden, die in het leger zijn."}],"30":[{"catchword":"meer,","tekst":"Te weten, zou het volk sterk en kloek geworden zijn om de vijanden te vervolgen, indien, enz."},{"catchword":"vrijelijk eten","tekst":"Hebreeuws, etende eten"},{"catchword":"den buit zijner vijanden,","tekst":"Te weten, van het vee en anderen voorraad van spijs."}],"31":[{"catchword":"Ajálon;","tekst":"Er was een Ajalon in den stam van Dan, Jos 19:42, den priesters gegeven, Jos 21:24, en 1Ch 6:69. Maar hier wordt gesproken van een ander in den stam van Juda. Rehabeam heeft die gesterkt, en zij wordt gesteld onder de sterkste steden des koninkrijks van Juda, 2Ch 11:10."}],"32":[{"catchword":"maakte zich het volk aan den buit,","tekst":"Anders, wendde, of keerde zich het volk aan den buit"},{"catchword":"kalveren,","tekst":"Hebreeuws, de zonen der runderen"},{"catchword":"met het bloed","tekst":"Te weten, eer het bloed geheel uit het vlees gedropen was. Dit deed het volk vanwege den groten honger, dien het had, niet kunnende wachten totdat de beesten uitgebloed hadden. Zie Lev 3:17, en Lev 17:10; Deu 12:16, Deu 12:23."}],"33":[{"catchword":"trouwelooslijk gehandeld;","tekst":"Namelijk, tegen God."},{"catchword":"heden","tekst":"Dat is, terstond, eer het avond wordt."},{"catchword":"een groten steen tot mij","tekst":"Te weten, om op denzelven de beesten te slachten, opdat het bloed te eer en te meer daar uitlope, of vliete. Sommigen menen dat men van dien groten steen het altaar gemaakt heeft, waarvan vs.35 gesproken wordt."}],"35":[{"catchword":"dit was het eerste altaar,","tekst":"Hebreeuws, dit altaar begon hij den Heere te bouwen."}],"36":[{"catchword":"tot God naderen","tekst":"Dat is, tot de ark Gods; te weten, om hem te vragen, of het zijn wil is dat wij dit doen."}],"37":[{"catchword":"vraagde Saul God","tekst":"Te weten, door den hogepriester."},{"catchword":"Hij antwoordde hem niet","tekst":"Dit was een teken dat God op hem vertoornd was; zie dergelijk exempel 1Sa 28:6. De Heere was gram, niet op Jónathan, maar op Saul, omdat hij zulk een dwazen en onvoorzichtigen eed gedaan en het volk afgenomen had."}],"38":[{"catchword":"uit alle hoeken des volks,","tekst":"Zie Jdg 20:2."},{"catchword":"verneemt,","tekst":"Anders, weet, bekent."}],"39":[{"catchword":"den dood sterven;","tekst":"Hebreeuws, hij zal stervende sterven."}],"41":[{"catchword":"Toon den onschuldige","tekst":"Hebreeuws, geef den volkomene, of, oprechte. Anders, geef een oprecht [lot.]"},{"catchword":"Saul geraakt,","tekst":"Te weten, door het lot. Getroffen worden, en vrij uitgaan, worden hier tegen elkander gesteld."}],"42":[{"catchword":"werd Jónathan geraakt","tekst":"Saul bidt vs.41: Toon den onschuldige, willende zeggen den schuldige. Maar God toont hier dien, die inderdaad onschuldig was, naar luid van Sauls woorden."}],"43":[{"catchword":"maar een weinig honigs geproefd,","tekst":"Hebreeuws, proevende geproefd, enz."}],"44":[{"catchword":"Zo doe mij God,","tekst":"Van deze manier van eedzweren, zie Rth 1:17. Doordien Saul hier en elders zo dikwijls zweert, blijkt genoegzaam dat hij tot vloeken en zweren geneigd en gewend was."}],"45":[{"catchword":"als er een haar van zijn hoofd","tekst":"Versta hierbij, zo straffe ons God, of iets dergelijks. Het is een afgebroken manier van eedzweren bij de Hebreën, en zie wijders 2Sa 14:11."},{"catchword":"met God gedaan","tekst":"Dat is, door de hulp en regering van God. Zie boven, vs.6."}],"46":[{"catchword":"van achter de Filistijnen,","tekst":"Dat is, hij hield op van de Filistijnen te vervolgen, eensdeels omdat de nacht voorbij was, anderdeels omdat God hem niet geantwoord had, vs.37."}],"47":[{"catchword":"Moab,","tekst":"Dat is, de Moabieten"},{"catchword":"Edom,","tekst":"Dat is, de Edomieten"},{"catchword":"koningen van Zoba,","tekst":"Het land van dezen lag van Batanea tot de Eufraat. Zie wijders op 2Sa 10:6."},{"catchword":"oefende hij straf","tekst":"Dat is, God gebruikte hem als een instrument om de vijanden zijner kerk te straffen. Anders, maakte hij het kwalijk, of deed hij kwaad, beroerde hij hen, plaagde hij hen. Te weten, de vijanden beschadigende."}],"48":[{"catchword":"handelde dapper,","tekst":"Anders, hij maakte, of, verzamelde een heir"},{"catchword":"sloeg de Amalekieten,","tekst":"Hiervan wordt breder gesproken onder 1Sa 15."}],"49":[{"catchword":"Isvi, en Malchi-sua;","tekst":"Hij wordt onder, 1Sa 31:2, genoemd Abinadab, als ook 1Ch 8:33, en 1Ch 10:2."},{"catchword":"kleinste Michal","tekst":"Of, jongste."}],"50":[{"catchword":"Abner,","tekst":"Anders, Abner."}],"51":[{"catchword":"Abiël","tekst":"Hij wordt Ner genoemd 1Ch 8:33. Zie boven, 1Sa 9:1."}],"52":[{"catchword":"alle kloeke mannen,","tekst":"Hebreeuws, alle zonen der kloekheid, of, der sterkte."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Now it came to pass upon a day, that Jonathan the son of Saul said unto the young man that bare his Armour, Come, and let us go over unto the Garison of the Philistines, which is on the other side: but he told it not to his Father. [Perhaps because he feared his father would not have consented hereunto.]"}],"2":[{"catchword":null,"tekst":"Now Saul sat [i.e Hadd pitched his tent] in the uttermost (part) of Gibea under the pome granate-tree; that was at Migron: [Of Migron is likewise spoken, Isa 10:28. It&acirc;&euro;&trade;s a portion of Land lying on the one side of the strait toward Gibea; here Saul with his six hundred men lay in the caves, watching to see what the Philistines would do, below vers.11.] and the people that were with him, they were about six hundred men."}],"3":[{"catchword":null,"tekst":"And Ahia the son of Achitub, the brother of Icabod, [See above chap.4.21.] the son of Pinehas, the son of Eli, was the LORDS Priests at Silo, [Or, pertained to the Lords Priests at Silo] wearing [Or, wore] the Ephod: [Understand withal likewise the brest-plate, and the Urim and Thummim, which the high Priset put on, when he asked counsel of the Lord] but the people knew not that Jonathan was gone away, [yea, neither did Saul nor the Priest know it.]"}],"4":[{"catchword":null,"tekst":"Now between the passages where Jonathan sought to go over unto the garrison of the Philistines, there was a sharpness [Heb. Tooth, and so in the following words] of a rock on this side, and a sharpness of a rock on the other side: [So that the way lay between two rocks] and the name of the one was Bozez, and the name of the other [Heb. Of the one] Sene."}],"5":[{"catchword":null,"tekst":"The one tooth lay toward the north, over against Michmas: and the other toward the south, over against Giba."}],"6":[{"catchword":null,"tekst":"Now Jonathan said to the young man, that bare his armour, Come, and let us go over unto the garrison of these uncircumcised, [As is he should say, These Philistines are strangers from the covenant of God, and therefore have full in his eyes: but we are circumcised, and bear the token of Gods covenant in our bodies] it may be [Jonathan speaketh thus, because he had no promise of victory from God] the LORD will work for us: [Or, do (somewhat) for us] for there is no hinderance with the LORD to deliver by many, or by few. [See an example hereof, Judg.7.7. and 2 Chron.14. See also Jos 14.12.]"}],"7":[{"catchword":null,"tekst":"Then his armour-bearer said unto him, Do all that is in thine heart, [i.e. all that seemeth good unto thee] turn thee, behold, I am with thee, according to thine heart. [i.e. so as it pleaseth thee, or seemeth good unto thee.]"}],"8":[{"catchword":null,"tekst":"Now Jonathan said, behold, we will pass&Atilde;&copy; over unto these men, and we will discover our selves unto them. [i.e. we will let our selves be seen of them, or, shew our selves to them.]"}],"9":[{"catchword":null,"tekst":"If they say to us thus, [See the like, Genes.24.14.] Stand still, [Heb. Be silent. See Jos. 10.12,13.] till we come to you, then we will tarry in our place, and not go up unto them."}],"10":[{"catchword":null,"tekst":"But (if) they say thus, Come up to us, then we will go up, for the LORD hath delivered them into our hand: and this shall be a token to us. [Compare Genes.24.14. with the annotate.]"}],"11":[{"catchword":null,"tekst":"When they both discovered themselves into the garrison of the Philistines: then the Philistines said, Behold, the Hebrews are gone forth out of the holes, where they had hid themselves."}],"12":[{"catchword":null,"tekst":"Moreover the men of the garrison answered, [i.e. said, or spake; for there goeth no question before] Jonathan, and his armour-beared, and said, Come up to us, and we will shew it you. [As if they had said thus, we will teach you, and make you feel it, what it is for a man to jeopardy himself rashly] And Jonathan said unto his armour-bearer, Come up after me, for the LORD hath delivered them unto the hand of Israel."}],"13":[{"catchword":null,"tekst":"Then Jonathan climbed upon his hand, and upon his feet, and his armour bearer after him: and they [viz. His enemies, whom he slew] fell before Jonathans face, and his armour-bearer [viz. Having now gotten a sword, and arms of one of them that were slain: for before onely Saul and Jonathan had swords, as appeareth chap.13.22.] slew them after him,"}],"14":[{"catchword":null,"tekst":"Now this first slaughter, wherewith Jonathan and his armour-bearer slew about twenty men, was made within about half an acre, being a yoke of Oxen going under the yoke are able to plow in one day. By these words is intimated, that this slaughter was made i a small plat or compasse of ground, so that Jonathan might easily have been surrounded and set upon his enemies, had not God wonderfully assisted him.]"}],"15":[{"catchword":null,"tekst":"And there was a trembling in the camp, [viz. In the camp of the Philistines] on the field, and among all the people: the garrison and the spoilers [viz. Those Souldiers that were gone forth to spoil and destroy the Land, whereof mention is made chap.13.17.] themselves also trembled; yea the Land was troubled, for it was a trembling of God. [See the annotate. on Gen 30:8. Intimating that it was a terrour, that God sent upon them: or a trembling of God; i.e. a very great trembling.]"}],"16":[{"catchword":null,"tekst":"Now when the watchmen of Saul at Gibea of Benjamin saw, that; behold the multitude [viz. Of the Philistines] melted away, and went on, and were beaten:"}],"17":[{"catchword":null,"tekst":"Then said Saul unto the people that were with him, Number now, and see, who is gone away from us: and they numbered, and behold, Jonathan and his armour-bearer were not there."}],"18":[{"catchword":null,"tekst":"Then said Saul unto Ahia, [See above vers.3.] Bring hither the ark of God, [viz. To inquire of God by the Ark, whether I shall pursue the Philistines] (for the Ark of God was on that day with the Children of Israel) [viz. In the camp, whereas it was at other times, (as it&acirc;&euro;&trade;s thought) at Silo]"}],"19":[{"catchword":null,"tekst":"And it came to pass&Atilde;&copy; while Saul yet talked unto the Priest, that the noise, that was in the Philistines camp, greatly increased, and multiplied: [Heb. Going went, and multiplied] then Saul said unto the Priest, Put in thine hand. [i.e. Let that alone, which I commanded thee ere-while concerning the Ark. Saul would not tarry so long, till he received answer from God.]"}],"20":[{"catchword":null,"tekst":"Now Saul, and all the people that were with him, were called together, and they came to battle: and behold, the sword of the one was against the other, [Heb. The sword of the man against his neighbour: i.e. the Philistines slew one another. See the like example, Judg.7.22. and 2 Chron.20.23.] there was a very great noise."}],"21":[{"catchword":null,"tekst":"There were also Hebrews with the Philistines, [viz. That ministered to them as servants, or, were run away from their colours to them, who upon this occasion joined themselves to the Israelites] as formerly, [Heb. As yesterday ere-yesterday] which went up with them into the camp round about: now these also joined themselves with the Israelites, [Heb. They (were) to be with Israel] that were with Saul and Jonathan."}],"22":[{"catchword":null,"tekst":"When all the men of Israel, that had hid themselves [See above chap.13. vers.6.] in mount Ephraim, heard that the Philistines fled, then they also clave unto them behinde in the battle. [i.e. they likewise helped to pursue and slay the Philistines.]"}],"23":[{"catchword":null,"tekst":"So the LORD delivered Israel that day: and the camp [Heb. The war, or, battle; i.e. the men of war, or Souldiers; understand it of the men of war, that pursued the Philistines] marched over unto Bethaven. [Lying far from Michmas, as appeareth above chap.13. not5.]"}],"24":[{"catchword":null,"tekst":"And the men of Israel were tired [Or, distressed, pressed, oppressed, viz. by the famine, as followeth] that day. For Saul had adjured the people, [Saul forbade the people to eat, that he might the speedie pursue and vanquish his enemies, fearing they might escape his hands, if the people should give themselves to eating; but he useth ill means to accomplish his design] saying, cursed [and consequently worthy to lose his life. See vers.39.] be the man, that eateth meat [Heb. Bread, so in the following words here, it appeareth, that bread is taken for all manner of food, for even honey is comprehended under that name; so also below vers.28. and Genes.43.31.] until evening, that I may avenge me on mine enemies: therefore all that people tasted no food."}],"25":[{"catchword":null,"tekst":"And all the land [i.e. All the people, of the land; so also above vers.15. and below vers.29. and Genes.41.57.] came into a wood: and there was honey in the field."}],"26":[{"catchword":null,"tekst":"When the people came into the wood, behold, there was a honey-flood: but no man touched his mouth with his hand, [viz. After that he had dipt it into the honey, to put thereof into his mouth, and to eat; that is, no man did eat thereof] for the people feared the adjuration."}],"27":[{"catchword":null,"tekst":"But Jonathan had not heard it, [For he had not been in the camp after that he had smitten the Philistines] when his father had adjured the people, and he put forth the end of his staff that was in his hand, and he dipt the same in an honey-comb: now when he turned his hand to his mouth, [Understand withal, after that he had eaten of the honey, which might be perceived by his eyes] then his eyes were enlightened. [or, then his eyes saw, viz. clearly; i.e. he got as it were new strength and vigour.]"}],"28":[{"catchword":null,"tekst":"Then answered [i.e. spake, or, said] one of the people, and said, Thy father hath straitly adjured [Heb. adjuring adjured] the people, saying, cursed be the man, that eateth bread this day: [viz. until evening, as vers.24. for among the Hebrews the day endeth at Sun-setting] therefore the people fainteth. [Or, is wearied, or, weary.]"}],"29":[{"catchword":null,"tekst":"Then said Jonathan, My father hath troubled the land: [i.e. the inhabitants of the Land, or, the Souldiers that are in the camp] see, I pray, how mine eyes are enlightened, because I have tasted a little of this honey."}],"30":[{"catchword":null,"tekst":"How much more; [viz. would the people have been strong and lusty to pursue the enemie, if, &c.] if the people to day might have freely eaten [Heb. eating eaten] of the prey [viz. of the cattel, and other provision of food] of their enemies, which they found? but now that defeat of the Philistines was not great."}],"31":[{"catchword":null,"tekst":"Yet they smote the Philistines that day from Michmas to Ajalon. [there was an Ajolan in the tribe of Dan, Jos.19.42. given to the Priests, Jos 21.24. and I Chro.6.69. But here mention is made of another in the tribe of Juda. Rehabean strengthened or fenced the same, and i is accounted among the strongest or best fenced Cities of the Kingdom of Juda, 2 Chron.11.10.] and the people was very weary."}],"32":[{"catchword":null,"tekst":"Then the people got to them to the prey, [Oth.. the people turned themselves to the prey] and they took sheep, and oxen, and calves, [Heb. the sons of oxen] and they slew them to the ground: and the people did eat them with the blood. [viz. before the blood was quite severed from the flesh. This the people did by reason of the great hunger they sustained, being not able to tarry till the beasts had left bleeding. See Levit.3.17. and 17.10. Deut.12.16. and 23.]"}],"33":[{"catchword":null,"tekst":"And it was told Saul, saying, Behold, the people sin against the LORD, eating with the blood: and he said, ye have dealt treacherously, [viz. against God] roll a great stone [viz. to slay (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +

  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>

  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;

  const knoop = nd => {

    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
