:"1 Johannes","href":"../../1-johannes/1/"},{"naam":"2 Johannes","href":"../../2-johannes/1/"},{"naam":"3 Johannes","href":"../../3-johannes/1/"},{"naam":"Judas","href":"../../judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Het gebeurde nu op een dag dat Jonathan, de zoon van Saul, tegen de jongen die zijn wapens droeg, zei: Kom, laten we naar de bezetting van de Filistijnen oversteken, die aan de overkant is. Maar hij vertelde het zijn vader niet.","2":"Saul zat toen aan het uiterste van Gibea onder de granaatappelboom die bij Migron staat; en het volk dat bij hem was, was ongeveer zeshonderd man.","3":"En Ahia, de zoon van Ahitub, de broer van Ikabod, de zoon van Pinehas, de zoon van Eli, was priester van de HEERE te Silo en droeg de efod[1]; maar het volk wist niet dat Jonathan weggegaan was.","4":"Nu was er tussen de doorgangen, waar Jonathan door probeerde te gaan naar de bezetting van de Filistijnen, een scherpe rots aan deze kant en een scherpe rots aan de andere kant; en de naam van de ene was Bozes en de naam van de andere Sene.","5":"De ene rots lag naar het noorden, tegenover Michmas, en de andere naar het zuiden, tegenover Geba.","6":"Jonathan nu zei tegen de jongen die zijn wapens droeg: Kom, laten we naar de bezetting van deze onbesnedenen oversteken; misschien zal de HEERE voor ons werken, want bij de HEERE is geen belemmering om te verlossen door velen of door weinigen.","7":"Toen zei zijn wapendrager tegen hem: Doe alles wat in uw hart is; ga uw gang, zie, ik ben met u, naar uw hart.","8":"Jonathan nu zei: Zie, wij zullen naar die mannen oversteken, en wij zullen ons aan hen laten zien.","9":"Als zij zo tegen ons zeggen: Blijf staan, totdat wij bij u komen, dan zullen wij op onze plaats blijven staan en niet naar hen opklimmen.","10":"Maar zeggen zij zo: Klim naar ons op, dan zullen wij opklimmen, want de HEERE heeft hen in onze hand gegeven; en dit zal ons een teken zijn.","11":"Toen zij beiden zich lieten zien aan de bezetting van de Filistijnen, zeiden de Filistijnen: Zie, de Hebreeën komen uit de holen waarin zij zich verstopt hadden.","12":"Verder antwoordden de mannen van de bezetting Jonathan en zijn wapendrager, en zeiden: Klim op naar ons, en wij zullen u iets duidelijk maken. En Jonathan zei tegen zijn wapendrager: Klim achter mij op, want de HEERE heeft hen gegeven in de hand van Israël.","13":"Toen klom Jonathan op zijn handen en op zijn voeten omhoog, en zijn wapendrager achter hem aan; en zij vielen voor Jonathan neer, en zijn wapendrager doodde ze achter hem.","14":"Deze eerste aanval, waarmee Jonathan en zijn wapendrager ongeveer twintig man versloegen, gebeurde op ongeveer de helft van een halve morgen land, zoveel als een span ossen kan omploegen.","15":"En er kwam beving in het leger, op het veld en onder heel het volk; de bezetting en de plunderaars beefden ook zelf; ja, het land schudde, want het was een beving van God.","16":"Toen de wachters van Saul te Gibea van Benjamin zagen dat, zie, de menigte wegsmolt en heen en weer liep en elkaar neersloeg,","17":"zei Saul tegen het volk dat bij hem was: Tel toch, en zie wie van ons weggegaan zijn. En zij telden, en zie, Jonathan en zijn wapendrager waren daar niet.","18":"Toen zei Saul tegen Ahia: Breng de ark van God hierheen. Want de ark van God was op die dag bij de kinderen van Israël.","19":"En het gebeurde, terwijl Saul nog tot de priester sprak, dat het rumoer dat in het leger van de Filistijnen was, steeds meer toenam en uitbreidde; zo zei Saul tegen de priester: Trek uw hand terug.","20":"Saul nu, en al het volk dat bij hem was, werden samengeroepen, en zij kwamen bij de strijd; en zie, het zwaard van de een was tegen de ander, er was een zeer grote verwarring.","21":"Er waren ook Hebreeën bij de Filistijnen, zoals eerder, die met hen in het leger opgetrokken waren, van rondom; dezen voegden zich nu ook bij de Israëlieten die bij Saul en Jonathan waren.","22":"Toen alle mannen van Israël die zich verstopt hadden in het bergland van Efraïm, hoorden dat de Filistijnen vluchtten, zetten zij hen ook achterna in de strijd.","23":"Zo verloste de HEERE Israël op die dag; en het leger trok verder naar Beth-aven.","24":"En de mannen van Israël werden uitgeput op die dag, want Saul had het volk bezworen en gezegd: Vervloekt is de man die voedsel eet vóór de avond, totdat ik mij op mijn vijanden gewroken heb! Daarom proefde heel het volk geen voedsel.","25":"En heel het volk kwam in een bos; en daar was honig op het veld.","26":"Toen het volk het bos in kwam, zie, er was een stroom honig; maar niemand raakte met zijn hand zijn mond aan, want het volk was bang voor de eed.","27":"Maar Jonathan had het niet gehoord, toen zijn vader het volk bezworen had, en hij stak het uiteinde van de staf die in zijn hand was uit, en doopte die in een honigraat; en toen hij zijn hand naar zijn mond bracht, werden zijn ogen weer helder.","28":"Toen antwoordde iemand uit het volk en zei: Uw vader heeft het volk streng bezworen en gezegd: Vervloekt is de man die vandaag brood eet! Daarom bezwijkt het volk.","29":"Toen zei Jonathan: Mijn vader heeft het land in moeilijkheden gebracht; kijk toch hoe helder mijn ogen zijn geworden, omdat ik een beetje van deze honing geproefd heb.","30":"Hoeveel te meer als het volk vandaag vrij had mogen eten van de buit van zijn vijanden, die het gevonden heeft! Maar nu is er geen grote slag geweest onder de Filistijnen.","31":"Toch versloegen zij op die dag de Filistijnen van Michmas tot Ajalon; en het volk was zeer moe.","32":"Toen stortte het volk zich op de buit, en zij namen schapen, en runderen, en kalveren, en slachtten ze op de grond; en het volk at ze met het bloed.","33":"En men berichtte het aan Saul en zei: Zie, het volk zondigt tegen de HEERE door met het bloed te eten. En hij zei: U hebt trouweloos gehandeld; rol vandaag een grote steen naar mij toe.","34":"Verder zei Saul: Verspreid u onder het volk, en zeg tegen hen: Breng ieder zijn os en ieder zijn schaap naar mij, en slacht het hier, en eet, en zondig niet tegen de HEERE door met het bloed te eten. Toen bracht heel het volk ieder zijn os met zijn hand, 's nachts, en slachtte ze daar.","35":"Toen bouwde Saul voor de HEERE een altaar; dit was het eerste altaar dat hij voor de HEERE bouwde.","36":"Daarna zei Saul: Laten we de Filistijnen achterna trekken, bij nacht, en hen beroven totdat het morgen licht wordt, en laten we niet één man van hen overlaten. Zij nu zeiden: Doe alles wat goed is in uw ogen; maar de priester zei: Laten we hier tot God naderen.","37":"Toen vroeg Saul God: Zal ik de Filistijnen achterna trekken? Zult U ze in de hand van Israël overgeven? Maar Hij antwoordde hem die dag niet.","38":"Toen zei Saul: Kom hierheen, alle hoofden van het volk, en onderzoek en kijk waarin deze zonde vandaag gebeurd is.","39":"Want zo waarachtig als de HEERE leeft, Die Israël verlost: al was het bij mijn zoon Jonathan, dan zal hij zeker sterven; en niemand uit heel het volk antwoordde hem.","40":"Verder zei hij tegen heel Israël: U zult aan de ene kant staan, en ik en mijn zoon Jonathan zullen aan de andere kant staan. Toen zei het volk tegen Saul: Doe wat goed is in uw ogen.","41":"Saul nu sprak tot de HEERE, de God van Israël: Toon de onschuldige. Toen werden Jonathan en Saul aangewezen, en het volk ging vrijuit.","42":"Toen zei Saul: Werp het lot tussen mij en mijn zoon Jonathan. Toen werd Jonathan aangewezen.","43":"Saul dan zei tegen Jonathan: Vertel mij wat u gedaan hebt. Toen vertelde Jonathan het hem, en zei: Ik heb maar een beetje honing geproefd, met het uiteinde van de staf die ik in mijn hand had; zie, hier ben ik, moet ik sterven?","44":"Toen zei Saul: Zo moet God mij doen, en nog erger, Jonathan! U moet zeker sterven.","45":"Maar het volk zei tegen Saul: Zou Jonathan sterven, die deze grote verlossing in Israël teweeggebracht heeft? Dat zij verre! Zo waarachtig als de HEERE leeft: geen haar van zijn hoofd zal op de aarde vallen, want hij heeft dit vandaag met God gedaan. Zo redde het volk Jonathan, zodat hij niet stierf.","46":"Saul nu trok terug van het achtervolgen van de Filistijnen, en de Filistijnen trokken naar hun eigen plaats.","47":"Toen nam Saul het koningschap over Israël in bezit; en hij streed rondom tegen al zijn vijanden: tegen Moab, en tegen de kinderen van Ammon, en tegen Edom, en tegen de koningen van Zoba, en tegen de Filistijnen; en overal waarheen hij zich wendde, strafte hij hen.","48":"En hij handelde dapper, en hij versloeg de Amalekieten, en hij redde Israël uit de hand van hem die hen beroofde.","49":"De zonen van Saul nu waren: Jonathan, en Isvi, en Malchi-sua; en de namen van zijn twee dochters waren deze: de naam van de oudste was Merab, en de naam van de jongste Michal.","50":"En de naam van Sauls vrouw was Ahinoam, een dochter van Ahimaäz; en de naam van zijn legeraanvoerder was Abner, een zoon van Ner, Sauls oom.","51":"En Kis was Sauls vader, en Ner, Abners vader, was een zoon van Abiël.","52":"En er was een zware oorlog tegen de Filistijnen al de dagen van Saul; daarom nam Saul iedere held en iedere dappere man die hij zag, bij zich in dienst."},"SV":{"1":"Het geschiedde nu op een dag, dat Jonathan, de zoon van Saul, tot den jongen, die zijn wapenen droeg, zeide: Kom, en laat ons tot de bezetting der Filistijnen overgaan, welke aan gene zijde is; doch hij gaf het zijn vader niet te kennen.","2":"Saul nu zat aan het uiterste van Gibea onder den granatenboom, die te Migron was; en het volk, dat bij hem was, was omtrent zeshonderd man.","3":"En Ahia, de zoon van Ahitub, den broeder van Ikabod, den zoon van Pinehas, den zoon van Eli, was priester des HEEREN, te Silo, dragende den efod; doch het volk wist niet, dat Jonathan heengegaan was.","4":"Er was nu tussen de doortochten, waar Jonathan zocht door te gaan tot der Filistijnen bezetting, een scherpte van een steenklip aan deze zijde, en een scherpte van een steenklip aan gene zijde; en de naam der ene was Bozes, en de naam der andere Sene.","5":"De ene tand was gelegen tegen het noorden, tegenover Michmas, en de andere tegen het zuiden, tegenover Geba.","6":"Jonathan nu zeide tot den jongen, die zijn wapenen droeg: Kom, en laat ons tot de bezetting dezer onbesnedenen overgaan; misschien zal de HEERE voor ons werken; want bij den HEERE is geen verhindering, om te verlossen door velen of door weinigen.","7":"Toen zeide zijn wapendrager tot hem: Doe al, wat in uw hart is; wend u, zie ik ben met u, naar uw hart.","8":"Jonathan nu zeide: Zie, wij zullen overgaan tot die mannen, en wij zullen ons aan hen ontdekken.","9":"Indien zij aldus tot ons zeggen: Staat stil, totdat wij aan ulieden komen; zo zullen wij blijven staan aan onze plaats, en tot hen niet opklimmen.","10":"Maar zeggen zij aldus: Klimt tot ons op; zo zullen wij opklimmen, want de HEERE heeft hen in onze hand gegeven; en dit zal ons een teken zijn.","11":"Toen zij beiden zich aan der Filistijnen bezetting ontdekten, zo zeiden de Filistijnen: Ziet, de Hebreën zijn uit de holen uitgegaan, waarin zij zich verstoken hadden.","12":"Verder antwoordden de mannen der bezetting aan Jonathan en zijn wapendrager, en zeiden: Klimt op tot ons, en wij zullen het u wijs maken. En Jonathan zeide tot zijn wapendrager: Klim op achter mij, want de HEERE heeft hen gegeven in de hand van Israël.","13":"Toen klom Jonathan op zijn handen en op zijn voeten, en zijn wapendrager hem na; en zij vielen voor Jonathans aangezicht, en zijn wapendrager doodde ze achter hem.","14":"Deze eerste slag nu, waarmede Jonathan en zijn wapendrager omtrent twintig mannen versloegen, geschiedde omtrent in de helft eens bunders, zijnde een juk ossen lands.","15":"En er was een beving in het leger, op het veld en onder het ganse volk; de bezetting en de verdervers beefden ook zelven; ja, het land werd beroerd, want het was een beving Gods.","16":"Als nu de wachters van Saul te Gibea-benjamins zagen, dat, ziet, de menigte versmolt, en doorging, en geklopt werd;","17":"Toen zeide Saul tot het volk, dat bij hem was: Telt toch, en beziet, wie van ons weggegaan zijn. En zij telden, en ziet, Jonathan en zijn wapendrager waren daar niet.","18":"Toen zeide Saul tot Ahia: Breng de ark Gods herwaarts. Want de ark Gods was te dien dage bij de kinderen Israëls.","19":"En het geschiedde, toen Saul nog tot den priester sprak, dat het rumoer, hetwelk in der Filistijnen leger was, zeer toenam en vermenigvuldigde; zo zeide Saul tot den priester: Haal uw hand in.","20":"Saul nu, en al het volk, dat bij hem was, werd samengeroepen, en zij kwamen ten strijde; en ziet, het zwaard des enen was tegen den anderen, er was een zeer groot gedruis.","21":"Er waren ook Hebreën bij de Filistijnen, als eertijds, die met hen in het leger opgetogen waren rondom; dezen nu vervoegden zich ook met de Israëlieten, die bij Saul en Jonathan waren.","22":"Als alle mannen van Israël, die zich verstoken hadden in het gebergte van Efraïm, hoorden, dat de Filistijnen vluchtten, zo kleefden zij ook hen achteraan in den strijd.","23":"Alzo verloste de HEERE Israël te dien dage; en het leger trok over naar Beth-aven.","24":"En de mannen van Israël werden mat te dien dage; want Saul had het volk bezworen, zeggende: Vervloekt zij de man, die spijze eet tot aan den avond, opdat ik mij aan mijn vijanden wreke! Daarom proefde dat ganse volk geen spijs.","25":"En het ganse volk kwam in een woud; en daar was honig op het veld.","26":"Toen het volk in het woud kwam, ziet, zo was er een honigvloed; maar niemand raakte met zijn hand aan zijn mond, want het volk vreesde de bezwering.","27":"Maar Jonathan had het niet gehoord, toen zijn vader het volk bezworen had, en hij reikte het einde van den staf uit, die in zijn hand was, en hij doopte denzelven in een honigraat; als hij nu zijn hand tot zijn mond wendde, zo werden zijn ogen verlicht.","28":"Toen antwoordde een man uit het volk, en zeide: Uw vader heeft het volk zwaarlijk bezworen, zeggende: Vervloekt zij de man, die heden brood eet! Daarom bezwijkt het volk.","29":"Toen zeide Jonathan: Mijn vader heeft het land beroerd; zie toch, hoe mijn ogen verlicht zijn, omdat ik een weinig van dezen honig gesmaakt heb;","30":"Hoe veel meer, indien het volk heden had mogen vrijelijk eten van den buit zijner vijanden, dien het gevonden heeft! Maar nu is die slag niet groot geweest over de Filistijnen.","31":"Doch zij sloegen te dien dage de Filistijnen van Michmas tot Ajalon; en het volk was zeer moede.","32":"Toen maakte zich het volk aan den buit, en zij namen schapen, en runderen, en kalveren, en zij slachtten ze tegen de aarde; en het volk at ze met het bloed.","33":"En men boodschapte het Saul, zeggende: Zie, het volk verzondigt zich aan den HEERE, etende met het bloed. En hij zeide: Gij hebt trouwelooslijk gehandeld; wentelt heden een groten steen tot mij.","34":"Verder sprak Saul: Verstrooit u onder het volk, en zegt tot hen: Brengt tot mij een iegelijk zijn os, en een iegelijk zijn schaap, en slacht het hier, en eet, en bezondigt u niet aan den HEERE, die etende met het bloed. Toen bracht al het volk een iegelijk zijn os met zijn hand, des nachts, en slachtte ze aldaar.","35":"Toen bouwde Saul den HEERE een altaar; dit was het eerste altaar, dat hij den HEERE bouwde.","36":"Daarna zeide Saul: Laat ons aftrekken de Filistijnen na, bij nacht, en laat ons dezelve beroven, totdat het morgen licht worde, en laat ons niet een man onder hen overig laten. Zij nu zeiden: Doe al wat goed is in uw ogen; maar de priester zeide: Laat ons herwaarts tot God naderen.","37":"Toen vraagde Saul God: Zal ik aftrekken de Filistijnen na? Zult Gij ze in de hand van Israël overgeven? Doch Hij antwoordde hem niet te dien dage.","38":"Toen zeide Saul: Komt herwaarts *uit* alle hoeken des volks, en verneemt, en ziet, waarin deze zonde heden geschied zij.","39":"Want *zo* *waarachtig* *als* de HEERE leeft, Die Israël verlost, al ware het in mijn zoon Jonathan, zo zal hij den dood sterven; en niemand uit het ganse volk antwoordde hem.","40":"Verder zeide hij tot het ganse Israël: Gijlieden zult aan de ene zijde zijn, en ik en mijn zoon Jonathan zullen aan de andere zijde zijn. Toen zeide het volk tot Saul: Doe, wat goed is in uw ogen.","41":"Saul nu sprak tot den HEERE, den God Israëls: Toon den onschuldige. Toen werd Jonathan en Saul geraakt, en het volk ging *vrij* uit.","42":"Toen zeide Saul: Werpt *het* *lot* tussen mij en tussen mijn zoon Jonathan. Toen werd Jonathan geraakt.","43":"Saul dan zeide tot Jonathan: Geef mij te kennen, wat gij gedaan hebt. Toen gaf het Jonathan hem te kennen, en zeide: Ik heb maar een weinig honigs geproefd, met het uiterste des stafs, dien ik in mijn hand had; zie *hier* ben ik, moet ik sterven?","44":"Toen zeide Saul: Zo doe *mij* God, en zo doe Hij daartoe, Jonathan! gij moet den dood sterven.","45":"Maar het volk zeide tot Saul: Zou Jonathan sterven, die deze grote verlossing in Israël gedaan heeft? Dat zij verre! *zo* *waarachtig* *als* de HEERE leeft, als er een haar van zijn hoofd op de aarde vallen zal; want hij heeft *dit* heden met God gedaan. Alzo verloste het volk Jonathan, dat hij niet stierf.","46":"Saul nu toog op van achter de Filistijnen, en de Filistijnen trokken aan hun plaats.","47":"Toen nam Saul het koninkrijk over Israël in; en hij streed rondom tegen al zijn vijanden, tegen Moab, en tegen de kinderen Ammons, en tegen Edom, en tegen de koningen van Zoba, en tegen de Filistijnen; en overal, waar hij zich wendde, oefende hij straf.","48":"En hij handelde dapper, en hij sloeg de Amalekieten, en hij redde Israël uit de hand desgenen, die hem beroofde.","49":"De zonen van Saul nu waren: Jonathan, en Isvi, en Malchi-sua; en de namen zijner twee dochteren waren *deze*: de naam der eerstgeborene was Merab, en de naam der kleinste Michal.","50":"En de naam van Sauls huisvrouw was Ahinoam, een dochter van Ahimaäz; en de naam van zijn krijgsoverste was Abi-ner, een zoon van Ner, Sauls oom.","51":"En Kis was Sauls vader, en Ner, Abners vader, was een zoon van Abiël.","52":"En er was een sterke krijg tegen de Filistijnen al de dagen van Saul; daarom alle helden en alle kloeke mannen, die Saul zag, die vergaderde hij tot zich."},"KJV":{"1":"Now it came to pass upon a day, that Jonathan the son of Saul said unto the young man that bare his armour, Come, and let us go over to the Philistines' garrison, that is on the other side. But he told not his father.","2":"And Saul tarried in the uttermost part of Gibeah under a pomegranate tree which is in Migron: and the people that were with him were about six hundred men;","3":"And Ahiah, the son of Ahitub, Ichabod's brother, the son of Phinehas, the son of Eli, the LORD'S priest in Shiloh, wearing an ephod. And the people knew not that Jonathan was gone.","4":"And between the passages, by which Jonathan sought to go over unto the Philistines' garrison, there was a sharp rock on the one side, and a sharp rock on the other side: and the name of the one was Bozez, and the name of the other Seneh.","5":"The forefront of the one was situate northward over against Michmash, and the other southward over against Gibeah.","6":"And Jonathan said to the young man that bare his armour, Come, and let us go over unto the garrison of these uncircumcised: it may be that the LORD will work for us: for there is no restraint to the LORD to save by many or by few.","7":"And his armourbearer said unto him, Do all that is in thine heart: turn thee; behold, I am with thee according to thy heart.","8":"Then said Jonathan, Behold, we will pass over unto these men, and we will discover ourselves unto them.","9":"If they say thus unto us, Tarry until we come to you; then we will stand still in our place, and will not go up unto them.","10":"But if they say thus, Come up unto us; then we will go up: for the LORD hath delivered them into our hand: and this shall be a sign unto us.","11":"And both of them discovered themselves unto the garrison of the Philistines: and the Philistines said, Behold, the Hebrews come forth out of the holes where they had hid themselves.","12":"And the men of the garrison answered Jonathan and his armourbearer, and said, Come up to us, and we will shew you a thing. And Jonathan said unto his armourbearer, Come up after me: for the LORD hath delivered them into the hand of Israel.","13":"And Jonathan climbed up upon his hands and upon his feet, and his armourbearer after him: and they fell before Jonathan; and his armourbearer slew after him.","14":"And that first slaughter, which Jonathan and his armourbearer made, was about twenty men, within as it were an half acre of land, which a yoke of oxen might plow.","15":"And there was trembling in the host, in the field, and among all the people: the garrison, and the spoilers, they also trembled, and the earth quaked: so it was a very great trembling.","16":"And the watchmen of Saul in Gibeah of Benjamin looked; and, behold, the multitude melted away, and they went on beating down one another.","17":"Then said Saul unto the people that were with him, Number now, and see who is gone from us. And when they had numbered, behold, Jonathan and his armourbearer were not there.","18":"And Saul said unto Ahiah, Bring hither the ark of God. For the ark of God was at that time with the children of Israel.","19":"And it came to pass, while Saul talked unto the priest, that the noise that was in the host of the Philistines went on and increased: and Saul said unto the priest, Withdraw thine hand.","20":"And Saul and all the people that were with him assembled themselves, and they came to the battle: and, behold, every man's sword was against his fellow, and there was a very great discomfiture.","21":"Moreover the Hebrews that were with the Philistines before that time, which went up with them into the camp from the country round about, even they also turned to be with the Israelites that were with Saul and Jonathan.","22":"Likewise all the men of Israel which had hid themselves in mount Ephraim, when they heard that the Philistines fled, even they also followed hard after them in the battle.","23":"So the LORD saved Israel that day: and the battle passed over unto Bethaven.","24":"And the men of Israel were distressed that day: for Saul had adjured the people, saying, Cursed be the man that eateth any food until evening, that I may be avenged on mine enemies. So none of the people tasted any food.","25":"And all they of the land came to a wood; and there was honey upon the ground.","26":"And when the people were come into the wood, behold, the honey dropped; but no man put his hand to his mouth: for the people feared the oath.","27":"But Jonathan heard not when his father charged ➔ the people with the oath: wherefore he put forth the end of the rod that was in his hand, and dipped it in an honeycomb, and put his hand to his mouth; and his eyes were enlightened.","28":"Then answered one of the people, and said, Thy father straitly charged ➔ the people with an oath, saying, Cursed be the man that eateth any food this day. And the people were faint.","29":"Then said Jonathan, My father hath troubled the land: see, I pray you, how mine eyes have been enlightened, because I tasted a little of this honey.","30":"How much more, if haply the people had eaten freely to day of the spoil of their enemies which they found? for had there not been now a much greater slaughter among the Philistines?","31":"And they smote the Philistines that day from Michmash to Aijalon: and the people were very faint.","32":"And the people flew upon the spoil, and took sheep, and oxen, and calves, and slew them on the ground: and the people did eat them with the blood.","33":"Then they told Saul, saying, Behold, the people sin against the LORD, in that they eat with the blood. And he said, Ye have transgressed: roll a great stone unto me this day.","34":"And Saul said, Disperse yourselves among the people, and say unto them, Bring me hither every man his ox, and every man his sheep, and slay them here, and eat; and sin not against the LORD in eating with the blood. And all the people brought every man his ox with him that night, and slew them there.","35":"And Saul built an altar unto the LORD: the same was the first altar that he built unto the LORD.","36":"And Saul said, Let us go down after the Philistines by night, and spoil them until the morning light, and let us not leave a man of them. And they said, Do whatsoever seemeth good unto thee. Then said the priest, Let us draw near hither unto God.","37":"And Saul asked counsel of God, Shall I go down after the Philistines? wilt thou deliver them into the hand of Israel? But he answered him not that day.","38":"And Saul said, Draw ye near hither, all the chief of the people: and know and see wherein this sin hath been this day.","39":"For, as the LORD liveth, which saveth Israel, though it be in Jonathan my son, he shall surely die. But there was not a man among all the people that answered him.","40":"Then said he unto all Israel, Be ye on one side, and I and Jonathan my son will be on the other side. And the people said unto Saul, Do what seemeth good unto thee.","41":"Therefore Saul said unto the LORD God of Israel, Give a perfect lot. And Saul and Jonathan were taken: but the people escaped.","42":"And Saul said, Cast lots between me and Jonathan my son. And Jonathan was taken.","43":"Then Saul said to Jonathan, Tell me what thou hast done. And Jonathan told him, and said, I did but taste a little honey with the end of the rod that was in mine hand, and, lo, I must die.","44":"And Saul answered, God do so and more also: for thou shalt surely die, Jonathan.","45":"And the people said unto Saul, Shall Jonathan die, who hath wrought this great salvation in Israel? God forbid: as the LORD liveth, there shall not one hair of his head fall to the ground; for he hath wrought with God this day. So the people rescued Jonathan, that he died not.","46":"Then Saul went up from following the Philistines: and the Philistines went to their own place.","47":"So Saul took the kingdom over Israel, and fought against all his enemies on every side, against Moab, and against the children of Ammon, and against Edom, and against the kings of Zobah, and against the Philistines: and whithersoever he turned himself, he vexed them.","48":"And he gathered an host, and smote the Amalekites, and delivered Israel out of the hands of them that spoiled them.","49":"Now the sons of Saul were Jonathan, and Ishui, and Melchishua: and the names of his two daughters were these; the name of the firstborn Merab, and the name of the younger Michal:","50":"And the name of Saul's wife was Ahinoam, the daughter of Ahimaaz: and the name of the captain of his host was Abner, the son of Ner, Saul's uncle.","51":"And Kish was the father of Saul; and Ner the father of Abner was the son of Abiel.","52":"And there was sore war against the Philistines all the days of Saul: and when Saul saw any strong man, or any valiant man, he took him unto him."}},"tsk":{"1":[{"kopje":"Jonathan","refs":["1 Sam 14:39-45","1 Sam 13:2","1 Sam 13:22","1 Sam 18:1-4","2 Sam 1:4","2 Sam 1:5","2 Sam 1:25","2 Sam 1:26"]},{"kopje":"hij vertelde het niet","refs":["1 Sam 25:19","Richt 6:27","Richt 14:6","Micha 7:5"]}],"2":[{"kopje":"aan het uiterste","refs":["1 Sam 13:15","1 Sam 13:16","Jes 10:28","Jes 10:29"]},{"kopje":"granaatappelboom","refs":["Richt 20:45"]}],"3":[{"kopje":"Ahia","refs":["1 Sam 22:9-12","1 Sam 22:20"]},{"kopje":"Ikabod","refs":["1 Sam 4:21"]},{"kopje":"droeg","refs":["1 Sam 2:28","Ex 28:26-32"]}],"4":[{"kopje":"de doorgangen","refs":["1 Sam 13:23"]}],"5":[{"kopje":"tegenover","refs":["1 Sam 14:4"]}],"6":[{"kopje":"onbesnedenen","refs":["1 Sam 17:26","1 Sam 17:36","Gen 17:7-11","Richt 15:18","2 Sam 1:20","Jer 9:23","Jer 9:26","Ef 2:11","Ef 2:12","Fil 3:3"]},{"kopje":"misschien","refs":["2 Sam 16:12","2 Kon 19:4","Amos 5:15","Zef 2:3"]},{"kopje":"want bij de HEERE is geen belemmering","refs":["Deut 32:30","Richt 7:4-7","2 Kron 14:11","Ps 115:1-3","Zach 4:6","Matt 19:26","Rom 8:31"]}],"7":[{"kopje":"Doe alles","refs":["1 Sam 10:7","2 Sam 7:3","Ps 46:8","Zach 8:23"]}],"8":[{"kopje":"wij zullen oversteken","refs":["Richt 7:9-14"]}],"9":[{"kopje":"zij","refs":["Gen 24:13","Gen 24:14","Richt 6:36-40"]}],"10":[{"kopje":"dit zal ons een teken zijn","refs":["1 Sam 10:7","Gen 24:14","Richt 7:11","Jes 7:11-14"]}],"11":[{"kopje":"uit de holen","refs":["1 Sam 14:22","1 Sam 13:6","Richt 6:2"]}],"12":[{"kopje":"Klim op naar ons","refs":["1 Sam 14:10","1 Sam 17:43","1 Sam 17:44","2 Sam 2:14-17","2 Kon 14:8"]},{"kopje":"Klim achter mij op","refs":["Gen 24:26","Gen 24:27","Gen 24:42","Gen 24:48","Richt 4:14","Richt 7:15","2 Sam 5:24"]}],"13":[{"kopje":"klom omhoog","refs":["Ps 18:30","Hebr 11:34" 17\">day,</span> that <span class=\"wl wl-kjv\" data-code=\"H3129\">Jonathan</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the young <span class=\"wl wl-kjv\" data-code=\"H5288\">man</span> that <span class=\"wl wl-kjv\" data-code=\"H5375\">bare</span> his <span class=\"wl wl-kjv\" data-code=\"H3627\">armour,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Come,</span> and let us go <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> to the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines'</span> <span class=\"wl wl-kjv\" data-code=\"H4673\">garrison,</span> that is on the other <span class=\"wl wl-kjv\" data-code=\"H5676\">side.</span> But he <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> not his <span class=\"wl wl-kjv\" data-code=\"H1\">father.</span>","2":"And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">tarried</span> in the <span class=\"wl wl-kjv\" data-code=\"H7097\">uttermost</span> part of <span class=\"wl wl-kjv\" data-code=\"H1390\">Gibeah</span> under a pomegranate <span class=\"wl wl-kjv\" data-code=\"H7416\">tree</span> which is in <span class=\"wl wl-kjv\" data-code=\"H4051\">Migron:</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that were with him were about <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men;</span>","3":"And <span class=\"wl wl-kjv\" data-code=\"H281\">Ahiah,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H285\">Ahitub,</span> <span class=\"wl wl-kjv\" data-code=\"H350\">Ichabod's</span> <span class=\"wl wl-kjv\" data-code=\"H251\">brother,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H6372\">Phinehas,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5941\">Eli,</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S</span> <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> in <span class=\"wl wl-kjv\" data-code=\"H7887\">Shiloh,</span> <span class=\"wl wl-kjv\" data-code=\"H5375\">wearing</span> an <span class=\"wl wl-kjv\" data-code=\"H646\">ephod.</span> And the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">knew</span> not that <span class=\"wl wl-kjv\" data-code=\"H3129\">Jonathan</span> was <span class=\"wl wl-kjv\" data-code=\"H1980\">gone.</span>","4":"And between the <span class=\"wl wl-kjv\" data-code=\"H4569\">passages,</span> by which <span class=\"wl wl-kjv\" data-code=\"H3129\">Jonathan</span> <span class=\"wl wl-kjv\" data-code=\"H1245\">sought</span> to go <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> unto the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines'</span> <span class=\"wl wl-kjv\" data-code=\"H4673\">garrison,</span> there was a <span class=\"wl wl-kjv\" data-code=\"H8127\">sharp</span> <span class=\"wl wl-kjv\" data-code=\"H5553\">rock</span> on the one <span class=\"wl wl-kjv\" data-code=\"H5676\">side,</span> and a <span class=\"wl wl-kjv\" data-code=\"H8127\">sharp</span> <span class=\"wl wl-kjv\" data-code=\"H5553\">rock</span> on the other <span class=\"wl wl-kjv\" data-code=\"H5676\">side:</span> and the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> was <span class=\"wl wl-kjv\" data-code=\"H949\">Bozez,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H259\">other</span> <span class=\"wl wl-kjv\" data-code=\"H5573\">Seneh.</span>","5":"The <span class=\"wl wl-kjv\" data-code=\"H8127\">forefront</span> of the <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> was <span class=\"wl wl-kjv\" data-code=\"H4690\">situate</span> <span class=\"wl wl-kjv\" data-code=\"H6828\">northward</span> over <span class=\"wl wl-kjv\" data-code=\"H4136\">against</span> <span class=\"wl wl-kjv\" data-code=\"H4363\">Michmash,</span> and the <span class=\"wl wl-kjv\" data-code=\"H259\">other</span> <span class=\"wl wl-kjv\" data-code=\"H5045\">southward</span> over <span class=\"wl wl-kjv\" data-code=\"H4136\">against</span> <span class=\"wl wl-kjv\" data-code=\"H1387\">Gibeah.</span>","6":"And <span class=\"wl wl-kjv\" data-code=\"H3083\">Jonathan</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to the young <span class=\"wl wl-kjv\" data-code=\"H5288\">man</span> that <span class=\"wl wl-kjv\" data-code=\"H5375\">bare</span> his <span class=\"wl wl-kjv\" data-code=\"H3627\">armour,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Come,</span> and let us go <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4673\">garrison</span> of these <span class=\"wl wl-kjv\" data-code=\"H6189\">uncircumcised:</span> it may be that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will <span class=\"wl wl-kjv\" data-code=\"H6213\">work</span> for us: for there is no <span class=\"wl wl-kjv\" data-code=\"H4622\">restraint</span> to the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> to <span class=\"wl wl-kjv\" data-code=\"H3467\">save</span> by <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> or by <span class=\"wl wl-kjv\" data-code=\"H4592\">few.</span>","7":"And his <span class=\"wl wl-kjv\" data-code=\"H5375\">armourbearer</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H6213\">Do</span> all that is in thine <span class=\"wl wl-kjv\" data-code=\"H3824\">heart:</span> <span class=\"wl wl-kjv\" data-code=\"H5186\">turn</span> thee; behold, I am with thee according to thy <span class=\"wl wl-kjv\" data-code=\"H3824\">heart.</span>","8":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H3083\">Jonathan,</span> Behold, we will pass <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> unto these <span class=\"wl wl-kjv\" data-code=\"H582\">men,</span> and we will <span class=\"wl wl-kjv\" data-code=\"H1540\">discover</span> ourselves unto them.","9":"If they <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> thus unto us, <span class=\"wl wl-kjv\" data-code=\"H1826\">Tarry</span> until we <span class=\"wl wl-kjv\" data-code=\"H5060\">come</span> to you; then we will stand <span class=\"wl wl-kjv\" data-code=\"H5975\">still</span> in our place, and will not go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> unto them.","10":"But if they <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> thus, Come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> unto us; then we will go <span class=\"wl wl-kjv\" data-code=\"H5927\">up:</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> them into our <span class=\"wl wl-kjv\" data-code=\"H3027\">hand:</span> and this shall be a <span class=\"wl wl-kjv\" data-code=\"H226\">sign</span> unto us.","11":"And <span class=\"wl wl-kjv\" data-code=\"H8147\">both</span> of them <span class=\"wl wl-kjv\" data-code=\"H1540\">discovered</span> themselves unto the <span class=\"wl wl-kjv\" data-code=\"H4673\">garrison</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines:</span> and the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Behold, the <span class=\"wl wl-kjv\" data-code=\"H5680\">Hebrews</span> come <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> out of the <span class=\"wl wl-kjv\" data-code=\"H2356\">holes</span> where they had <span class=\"wl wl-kjv\" data-code=\"H2244\">hid</span> themselves.","12":"And the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of the <span class=\"wl wl-kjv\" data-code=\"H4675\">garrison</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> <span class=\"wl wl-kjv\" data-code=\"H3129\">Jonathan</span> and his <span class=\"wl wl-kjv\" data-code=\"H5375\">armourbearer,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to us, and we will <span class=\"wl wl-kjv\" data-code=\"H3045\">shew</span> you a <span class=\"wl wl-kjv\" data-code=\"H1697\">thing.</span> And <span class=\"wl wl-kjv\" data-code=\"H3129\">Jonathan</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto his <span class=\"wl wl-kjv\" data-code=\"H5375\">armourbearer,</span> Come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> me: for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> them into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","13":"And <span class=\"wl wl-kjv\" data-code=\"H3129\">Jonathan</span> climbed <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> upon his <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> and upon his <span class=\"wl wl-kjv\" data-code=\"H7272\">feet,</span> and his <span class=\"wl wl-kjv\" data-code=\"H5375\">armourbearer</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> him: and they <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H3129\">Jonathan;</span> and his <span class=\"wl wl-kjv\" data-code=\"H5375\">armourbearer</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">slew</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> him.","14":"And that <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> <span class=\"wl wl-kjv\" data-code=\"H4347\">slaughter,</span> which <span class=\"wl wl-kjv\" data-code=\"H3129\">Jonathan</span> and his <span class=\"wl wl-kjv\" data-code=\"H5375\">armourbearer</span> <span class=\"wl wl-kjv\" data-code=\"H5221\">made,</span> was about <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men,</span> within as it were an <span class=\"wl wl-kjv\" data-code=\"H2677\">half</span> <span class=\"wl wl-kjv\" data-code=\"H4618\">acre</span> of <span class=\"wl wl-kjv\" data-code=\"H7704\">land,</span> which a <span class=\"wl wl-kjv\" data-code=\"H6776\">yoke</span> of oxen might plow.","15":"And there was <span class=\"wl wl-kjv\" data-code=\"H2731\">trembling</span> in the <span class=\"wl wl-kjv\" data-code=\"H4264\">host,</span> in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> and among all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people:</span> the <span class=\"wl wl-kjv\" data-code=\"H4673\">garrison,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7843\">spoilers,</span> they also <span class=\"wl wl-kjv\" data-code=\"H2729\">trembled,</span> and the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> <span class=\"wl wl-kjv\" data-code=\"H7264\">quaked:</span> so it was a very <span class=\"wl wl-kjv\" data-code=\"H430\">great</span> <span class=\"wl wl-kjv\" data-code=\"H2731\">trembling.</span>","16":"And the <span class=\"wl wl-kjv\" data-code=\"H6822\">watchmen</span> of <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> in <span class=\"wl wl-kjv\" data-code=\"H1390\">Gibeah</span> of <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">looked;</span> and, behold, the <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude</span> melted <span class=\"wl wl-kjv\" data-code=\"H4127\">away,</span> and they <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> on beating <span class=\"wl wl-kjv\" data-code=\"H1986\">down</span> one another.","17":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that were with him, <span class=\"wl wl-kjv\" data-code=\"H6485\">Number</span> now, and <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> who is <span class=\"wl wl-kjv\" data-code=\"H1980\">gone</span> from us. And when they had <span class=\"wl wl-kjv\" data-code=\"H6485\">numbered,</span> behold, <span class=\"wl wl-kjv\" data-code=\"H3129\">Jonathan</span> and his <span class=\"wl wl-kjv\" data-code=\"H5375\">armourbearer</span> were not there.","18":"And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H281\">Ahiah,</span> Bring <span class=\"wl wl-kjv\" data-code=\"H5066\">hither</span> the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God.</span> For the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> was at that <span class=\"wl wl-kjv\" data-code=\"H3117\">time</span> with the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","19":"And it came to pass, while <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">talked</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> that the <span class=\"wl wl-kjv\" data-code=\"H1995\">noise</span> that was in the <span class=\"wl wl-kjv\" data-code=\"H4264\">host</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">on</span> and <span class=\"wl wl-kjv\" data-code=\"H7227\">increased:</span> and <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> <span class=\"wl wl-kjv\" data-code=\"H622\">Withdraw</span> thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand.</span>","20":"And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that were with him <span class=\"wl wl-kjv\" data-code=\"H2199\">assembled</span> themselves, and they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle:</span> and, behold, every <span class=\"wl wl-kjv\" data-code=\"H376\">man's</span> <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> was against his <span class=\"wl wl-kjv\" data-code=\"H7453\">fellow,</span> and there was a <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4103\">discomfiture.</span>","21":"Moreover the <span class=\"wl wl-kjv\" data-code=\"H5680\">Hebrews</span> that were with the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> <span class=\"wl wl-kjv\" data-code=\"H865\">before</span> that <span class=\"wl wl-kjv\" data-code=\"H8032\">time,</span> which went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> with them into the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp</span> from the country round <span class=\"wl wl-kjv\" data-code=\"H5439\">about,</span> even they also turned to be with the <span class=\"wl wl-kjv\" data-code=\"H3478\">Israelites</span> that were with <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> and <span class=\"wl wl-kjv\" data-code=\"H3129\">Jonathan.</span>","22":"Likewise all the <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> which had <span class=\"wl wl-kjv\" data-code=\"H2244\">hid</span> themselves in <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim,</span> when they <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> that the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> <span class=\"wl wl-kjv\" data-code=\"H5127\">fled,</span> even they also followed <span class=\"wl wl-kjv\" data-code=\"H1692\">hard</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> them in the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle.</span>","23":"So the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H3467\">saved</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> that <span class=\"wl wl-kjv\" data-code=\"H3117\">day:</span> and the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle</span> passed <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> unto <span class=\"wl wl-kjv\" data-code=\"H1007\">Bethaven.</span>","24":"And the <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> were <span class=\"wl wl-kjv\" data-code=\"H5065\">distressed</span> that <span class=\"wl wl-kjv\" data-code=\"H3117\">day:</span> for <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> had <span class=\"wl wl-kjv\" data-code=\"H422\">adjured</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H779\">Cursed</span> be the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> that <span class=\"wl wl-kjv\" data-code=\"H398\">eateth</span> any <span class=\"wl wl-kjv\" data-code=\"H3899\">food</span> until <span class=\"wl wl-kjv\" data-code=\"H6153\">evening,</span> that I may be <span class=\"wl wl-kjv\" data-code=\"H5358\">avenged</span> on mine <span class=\"wl wl-kjv\" data-code=\"H341\">enemies.</span> So none of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H2938\">tasted</span> any <span class=\"wl wl-kjv\" data-code=\"H3899\">food.</span>","25":"And all they of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to a <span class=\"wl wl-kjv\" data-code=\"H3293\">wood;</span> and there was <span class=\"wl wl-kjv\" data-code=\"H1706\">honey</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">upon</span> the <span class=\"wl wl-kjv\" data-code=\"H7704\">ground.</span>","26":"And when the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> were <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> into the <span class=\"wl wl-kjv\" data-code=\"H3293\">wood,</span> behold, the <span class=\"wl wl-kjv\" data-code=\"H1706\">honey</span> <span class=\"wl wl-kjv\" data-code=\"H1982\">dropped;</span> but no man <span class=\"wl wl-kjv\" data-code=\"H5381\">put</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> to his <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth:</span> for the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3372\">feared</span> the <span class=\"wl wl-kjv\" data-code=\"H7621\">oath.</span>","27":"But <span class=\"wl wl-kjv\" data-code=\"H3129\">Jonathan</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> not when his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H7650\">charged</span> ➔ the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> with the <span class=\"wl wl-kjv\" data-code=\"H7650\">oath:</span> wherefore he put <span class=\"wl wl-kjv\" data-code=\"H7971\">forth</span> the <span class=\"wl wl-kjv\" data-code=\"H7097\">end</span> of the <span class=\"wl wl-kjv\" data-code=\"H4294\">rod</span> that was in his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and <span class=\"wl wl-kjv\" data-code=\"H2881\">dipped</span> it in an <span class=\"wl wl-kjv\" data-code=\"H3295\">honeycomb,</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">put</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> to his <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth;</span> and his <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> were <span class=\"wl wl-kjv\" data-code=\"H215\">enlightened.</span>","28":"Then <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Thy <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H7650\">straitly</span> <span class=\"wl wl-kjv\" data-code=\"H7650\">charged</span> ➔ the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> with an <span class=\"wl wl-kjv\" data-code=\"H7650\">oath,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H779\">Cursed</span> be the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> that <span class=\"wl wl-kjv\" data-code=\"H398\">eateth</span> any <span class=\"wl wl-kjv\" data-code=\"H3899\">food</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day.</span> And the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> were <span class=\"wl wl-kjv\" data-code=\"H5774\">faint.</span>","29":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H3129\">Jonathan,</span> My <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> hath <span class=\"wl wl-kjv\" data-code=\"H5916\">troubled</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land:</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">see,</span> I pray you, how mine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> have been <span class=\"wl wl-kjv\" data-code=\"H215\">enlightened,</span> because I <span class=\"wl wl-kjv\" data-code=\"H2938\">tasted</span> a <span class=\"wl wl-kjv\" data-code=\"H4592\">little</span> of this <span class=\"wl wl-kjv\" data-code=\"H1706\">honey.</span>","30":"How much <span class=\"wl wl-kjv\" data-code=\"H637\">more,</span> if <span class=\"wl wl-kjv\" data-code=\"H3863\">haply</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> had <span class=\"wl wl-kjv\" data-code=\"H398\">eaten</span> <span class=\"wl wl-kjv\" data-code=\"H398\">freely</span> to <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of the <span class=\"wl wl-kjv\" data-code=\"H7998\">spoil</span> of their <span class=\"wl wl-kjv\" data-code=\"H341\">enemies</span> which they <span class=\"wl wl-kjv\" data-code=\"H4672\">found?</span> for had there not been now a much <span class=\"wl wl-kjv\" data-code=\"H7235\">greater</span> <span class=\"wl wl-kjv\" data-code=\"H4347\">slaughter</span> among the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines?</span>","31":"And they <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> from <span class=\"wl wl-kjv\" data-code=\"H4363\">Michmash</span> to <span class=\"wl wl-kjv\" data-code=\"H357\">Aijalon:</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> were <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H5774\">faint.</span>","32":"And the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H5860\">flew</span> upon the <span class=\"wl wl-kjv\" data-code=\"H7998\">spoil,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep,</span> and <span class=\"wl wl-kjv\" data-code=\"H1241\">oxen,</span> and <span class=\"wl wl-kjv\" data-code=\"H1121\">calves,</span> and <span class=\"wl wl-kjv\" data-code=\"H7819\">slew</span> them on the <span class=\"wl wl-kjv\" data-code=\"H776\">ground:</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> did <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> them with the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood.</span>","33":"Then they <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Behold, the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H2398\">sin</span> against the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> in that they <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> with the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood.</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Ye have <span class=\"wl wl-kjv\" data-code=\"H898\">transgressed:</span> <span class=\"wl wl-kjv\" data-code=\"H1556\">roll</span> a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stone</span> unto me this <span class=\"wl wl-kjv\" data-code=\"H3117\">day.</span>","34":"And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H6327\">Disperse</span> yourselves among the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto them, Bring me <span class=\"wl wl-kjv\" data-code=\"H5066\">hither</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> his <span class=\"wl wl-kjv\" data-code=\"H7794\">ox,</span> and every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> his <span class=\"wl wl-kjv\" data-code=\"H7716\">sheep,</span> and <span class=\"wl wl-kjv\" data-code=\"H7819\">slay</span> them here, and <span class=\"wl wl-kjv\" data-code=\"H398\">eat;</span> and <span class=\"wl wl-kjv\" data-code=\"H2398\">sin</span> not against the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> in <span class=\"wl wl-kjv\" data-code=\"H398\">eating</span> with the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood.</span> And all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H5066\">brought</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> his <span class=\"wl wl-kjv\" data-code=\"H7794\">ox</span> with <span class=\"wl wl-kjv\" data-code=\"H3027\">him</span> that <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> and <span class=\"wl wl-kjv\" data-code=\"H7819\">slew</span> them there.","35":"And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> an <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> the same was the <span class=\"wl wl-kjv\" data-code=\"H2490\">first</span> <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> that he <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","36":"And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Let us go <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> by <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> and <span class=\"wl wl-kjv\" data-code=\"H962\">spoil</span> them until the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning</span> <span class=\"wl wl-kjv\" data-code=\"H216\">light,</span> and let us not <span class=\"wl wl-kjv\" data-code=\"H7604\">leave</span> a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of them. And they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">Do</span> whatsoever <span class=\"wl wl-kjv\" data-code=\"H5869\">seemeth</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> unto thee. Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> Let us draw <span class=\"wl wl-kjv\" data-code=\"H7126\">near</span> <span class=\"wl wl-kjv\" data-code=\"H1988\">hither</span> unto <span class=\"wl wl-kjv\" data-code=\"H430\">God.</span>","37":"And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H7592\">asked</span> counsel of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> Shall I go <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines?</span> wilt thou <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> them into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel?</span> But he <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> him not that <span class=\"wl wl-kjv\" data-code=\"H3117\">day.</span>","38":"And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Draw ye <span class=\"wl wl-kjv\" data-code=\"H5066\">near</span> <span class=\"wl wl-kjv\" data-code=\"H1988\">hither,</span> all th
