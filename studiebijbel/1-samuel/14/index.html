span> <span class=\"wl\" data-l=\"L2\" data-code=\"H5921\">de</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H6430\">Filistijnen</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H3605\">al</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H3605\">de</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H3117\">dagen</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H3117\">van</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H7586\">Saul</span>; <span class=\"wl\" data-l=\"L7\" data-code=\"H3605\">daarom</span> nam <span class=\"wl\" data-l=\"L8\" data-code=\"H7586\">Saul</span> iedere held <span class=\"wl\" data-l=\"L4\" data-code=\"H3605\">en</span> iedere dappere man <span class=\"wl\" data-l=\"L8\" data-code=\"H7586\">die</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H622\">hij</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H7200\">zag</span>, <span class=\"wl\" data-l=\"L9\" data-code=\"H7200\">bij</span> zich in dienst."}, "koppeling_kjv": {"1": "Now it came to pass upon a <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> that <span class=\"wl wl-kjv\" data-code=\"H3129\">Jonathan</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the young <span class=\"wl wl-kjv\" data-code=\"H5288\">man</span> that <span class=\"wl wl-kjv\" data-code=\"H5375\">bare</span> his <span class=\"wl wl-kjv\" data-code=\"H3627\">armour,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Come,</span> and let us go <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> to the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines'</span> <span class=\"wl wl-kjv\" data-code=\"H4673\">garrison,</span> that is on the other <span class=\"wl wl-kjv\" data-code=\"H5676\">side.</span> But he <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> not his <span class=\"wl wl-kjv\" data-code=\"H1\">father.</span>", "2": "And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">tarried</span> in the <span class=\"wl wl-kjv\" data-code=\"H7097\">uttermost</span> part of <span class=\"wl wl-kjv\" data-code=\"H1390\">Gibeah</span> under a pomegranate <span class=\"wl wl-kjv\" data-code=\"H7416\">tree</span> which is in <span class=\"wl wl-kjv\" data-code=\"H4051\">Migron:</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that were with him were about <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men;</span>", "3": "And <span class=\"wl wl-kjv\" data-code=\"H281\">Ahiah,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H285\">Ahitub,</span> <span class=\"wl wl-kjv\" data-code=\"H350\">Ichabod's</span> <span class=\"wl wl-kjv\" data-code=\"H251\">brother,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H6372\">Phinehas,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5941\">Eli,</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S</span> <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> in <span class=\"wl wl-kjv\" data-code=\"H7887\">Shiloh,</span> <span class=\"wl wl-kjv\" data-code=\"H5375\">wearing</span> an <span class=\"wl wl-kjv\" data-code=\"H646\">ephod.</span> And the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">knew</span> not that <span class=\"wl wl-kjv\" data-code=\"H3129\">Jonathan</span> was <span class=\"wl wl-kjv\" data-code=\"H1980\">gone.</span>", "4": "And between the <span class=\"wl wl-kjv\" data-code=\"H4569\">passages,</span> by which <span class=\"wl wl-kjv\" data-code=\"H3129\">Jonathan</span> <span class=\"wl wl-kjv\" data-code=\"H1245\">sought</span> to go <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> unto the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines'</span> <span class=\"wl wl-kjv\" data-code=\"H4673\">garrison,</span> there was a <span class=\"wl wl-kjv\" data-code=\"H8127\">sharp</span> <span class=\"wl wl-kjv\" data-code=\"H5553\">rock</span> on the one <span class=\"wl wl-kjv\" data-code=\"H5676\">side,</span> and a <span class=\"wl wl-kjv\" data-code=\"H8127\">sharp</span> <span class=\"wl wl-kjv\" data-code=\"H5553\">rock</span> on the other <span class=\"wl wl-kjv\" data-code=\"H5676\">side:</span> and the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> was <span class=\"wl wl-kjv\" data-code=\"H949\">Bozez,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H259\">other</span> <span class=\"wl wl-kjv\" data-code=\"H5573\">Seneh.</span>", "5": "The <span class=\"wl wl-kjv\" data-code=\"H8127\">forefront</span> of the <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> was <span class=\"wl wl-kjv\" data-code=\"H4690\">situate</span> <span class=\"wl wl-kjv\" data-code=\"H6828\">northward</span> over <span class=\"wl wl-kjv\" data-code=\"H4136\">against</span> <span class=\"wl wl-kjv\" data-code=\"H4363\">Michmash,</span> and the <span class=\"wl wl-kjv\" data-code=\"H259\">other</span> <span class=\"wl wl-kjv\" data-code=\"H5045\">southward</span> over <span class=\"wl wl-kjv\" data-code=\"H4136\">against</span> <span class=\"wl wl-kjv\" data-code=\"H1387\">Gibeah.</span>", "6": "And <span class=\"wl wl-kjv\" data-code=\"H3083\">Jonathan</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to the young <span class=\"wl wl-kjv\" data-code=\"H5288\">man</span> that <span class=\"wl wl-kjv\" data-code=\"H5375\">bare</span> his <span class=\"wl wl-kjv\" data-code=\"H3627\">armour,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Come,</span> and let us go <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4673\">garrison</span> of these <span class=\"wl wl-kjv\" data-code=\"H6189\">uncircumcised:</span> it may be that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will <span class=\"wl wl-kjv\" data-code=\"H6213\">work</span> for us: for there is no <span class=\"wl wl-kjv\" data-code=\"H4622\">restraint</span> to the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> to <span class=\"wl wl-kjv\" data-code=\"H3467\">save</span> by <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> or by <span class=\"wl wl-kjv\" data-code=\"H4592\">few.</span>", "7": "And his <span class=\"wl wl-kjv\" data-code=\"H5375\">armourbearer</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H6213\">Do</span> all that is in thine <span class=\"wl wl-kjv\" data-code=\"H3824\">heart:</span> <span class=\"wl wl-kjv\" data-code=\"H5186\">turn</span> thee; behold, I am with thee according to thy <span class=\"wl wl-kjv\" data-code=\"H3824\">heart.</span>", "8": "Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H3083\">Jonathan,</span> Behold, we will pass <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> unto these <span class=\"wl wl-kjv\" data-code=\"H582\">men,</span> and we will <span class=\"wl wl-kjv\" data-code=\"H1540\">discover</span> ourselves unto them.", "9": "If they <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> thus unto us, <span class=\"wl wl-kjv\" data-code=\"H1826\">Tarry</span> until we <span class=\"wl wl-kjv\" data-code=\"H5060\">come</span> to you; then we will stand <span class=\"wl wl-kjv\" data-code=\"H5975\">still</span> in our place, and will not go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> unto them.", "10": "But if they <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> thus, Come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> unto us; then we will go <span class=\"wl wl-kjv\" data-code=\"H5927\">up:</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> them into our <span class=\"wl wl-kjv\" data-code=\"H3027\">hand:</span> and this shall be a <span class=\"wl wl-kjv\" data-code=\"H226\">sign</span> unto us.", "11": "And <span class=\"wl wl-kjv\" data-code=\"H8147\">both</span> of them <span class=\"wl wl-kjv\" data-code=\"H1540\">discovered</span> themselves unto the <span class=\"wl wl-kjv\" data-code=\"H4673\">garrison</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines:</span> and the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Behold, the <span class=\"wl wl-kjv\" data-code=\"H5680\">Hebrews</span> come <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> out of the <span class=\"wl wl-kjv\" data-code=\"H2356\">holes</span> where they had <span class=\"wl wl-kjv\" data-code=\"H2244\">hid</span> themselves.", "12": "And the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of the <span class=\"wl wl-kjv\" data-code=\"H4675\">garrison</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> <span class=\"wl wl-kjv\" data-code=\"H3129\">Jonathan</span> and his <span class=\"wl wl-kjv\" data-code=\"H5375\">armourbearer,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to us, and we will <span class=\"wl wl-kjv\" data-code=\"H3045\">shew</span> you a <span class=\"wl wl-kjv\" data-code=\"H1697\">thing.</span> And <span class=\"wl wl-kjv\" data-code=\"H3129\">Jonathan</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto his <span class=\"wl wl-kjv\" data-code=\"H5375\">armourbearer,</span> Come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> me: for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> them into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>", "13": "And <span class=\"wl wl-kjv\" data-code=\"H3129\">Jonathan</span> climbed <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> upon his <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> and upon his <span class=\"wl wl-kjv\" data-code=\"H7272\">feet,</span> and his <span class=\"wl wl-kjv\" data-code=\"H5375\">armourbearer</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> him: and they <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H3129\">Jonathan;</span> and his <span class=\"wl wl-kjv\" data-code=\"H5375\">armourbearer</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">slew</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> him.", "14": "And that <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> <span class=\"wl wl-kjv\" data-code=\"H4347\">slaughter,</span> which <span class=\"wl wl-kjv\" data-code=\"H3129\">Jonathan</span> and his <span class=\"wl wl-kjv\" data-code=\"H5375\">armourbearer</span> <span class=\"wl wl-kjv\" data-code=\"H5221\">made,</span> was about <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men,</span> within as it were an <span class=\"wl wl-kjv\" data-code=\"H2677\">half</span> <span class=\"wl wl-kjv\" data-code=\"H4618\">acre</span> of <span class=\"wl wl-kjv\" data-code=\"H7704\">land,</span> which a <span class=\"wl wl-kjv\" data-code=\"H6776\">yoke</span> of oxen might plow.", "15": "And there was <span class=\"wl wl-kjv\" data-code=\"H2731\">trembling</span> in the <span class=\"wl wl-kjv\" data-code=\"H4264\">host,</span> in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> and among all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people:</span> the <span class=\"wl wl-kjv\" data-code=\"H4673\">garrison,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7843\">spoilers,</span> they also <span class=\"wl wl-kjv\" data-code=\"H2729\">trembled,</span> and the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> <span class=\"wl wl-kjv\" data-code=\"H7264\">quaked:</span> so it was a very <span class=\"wl wl-kjv\" data-code=\"H430\">great</span> <span class=\"wl wl-kjv\" data-code=\"H2731\">trembling.</span>", "16": "And the <span class=\"wl wl-kjv\" data-code=\"H6822\">watchmen</span> of <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> in <span class=\"wl wl-kjv\" data-code=\"H1390\">Gibeah</span> of <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">looked;</span> and, behold, the <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude</span> melted <span class=\"wl wl-kjv\" data-code=\"H4127\">away,</span> and they <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> on beating <span class=\"wl wl-kjv\" data-code=\"H1986\">down</span> one another.", "17": "Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that were with him, <span class=\"wl wl-kjv\" data-code=\"H6485\">Number</span> now, and <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> who is <span class=\"wl wl-kjv\" data-code=\"H1980\">gone</span> from us. And when they had <span class=\"wl wl-kjv\" data-code=\"H6485\">numbered,</span> behold, <span class=\"wl wl-kjv\" data-code=\"H3129\">Jonathan</span> and his <span class=\"wl wl-kjv\" data-code=\"H5375\">armourbearer</span> were not there.", "18": "And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H281\">Ahiah,</span> Bring <span class=\"wl wl-kjv\" data-code=\"H5066\">hither</span> the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God.</span> For the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> was at that <span class=\"wl wl-kjv\" data-code=\"H3117\">time</span> with the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>", "19": "And it came to pass, while <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">talked</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> that the <span class=\"wl wl-kjv\" data-code=\"H1995\">noise</span> that was in the <span class=\"wl wl-kjv\" data-code=\"H4264\">host</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">on</span> and <span class=\"wl wl-kjv\" data-code=\"H7227\">increased:</span> and <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> <span class=\"wl wl-kjv\" data-code=\"H622\">Withdraw</span> thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand.</span>", "20": "And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that were with him <span class=\"wl wl-kjv\" data-code=\"H2199\">assembled</span> themselves, and they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle:</span> and, behold, every <span class=\"wl wl-kjv\" data-code=\"H376\">man's</span> <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> was against his <span class=\"wl wl-kjv\" data-code=\"H7453\">fellow,</span> and there was a <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4103\">discomfiture.</span>", "21": "Moreover the <span class=\"wl wl-kjv\" data-code=\"H5680\">Hebrews</span> that were with the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> <span class=\"wl wl-kjv\" data-code=\"H865\">before</span> that <span class=\"wl wl-kjv\" data-code=\"H8032\">time,</span> which went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> with them into the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp</span> from the country round <span class=\"wl wl-kjv\" data-code=\"H5439\">about,</span> even they also turned to be with the <span class=\"wl wl-kjv\" data-code=\"H3478\">Israelites</span> that were with <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> and <span class=\"wl wl-kjv\" data-code=\"H3129\">Jonathan.</span>", "22": "Likewise all the <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> which had <span class=\"wl wl-kjv\" data-code=\"H2244\">hid</span> themselves in <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim,</span> when they <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> that the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> <span class=\"wl wl-kjv\" data-code=\"H5127\">fled,</span> even they also followed <span class=\"wl wl-kjv\" data-code=\"H1692\">hard</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> them in the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle.</span>", "23": "So the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H3467\">saved</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> that <span class=\"wl wl-kjv\" data-code=\"H3117\">day:</span> and the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle</span> passed <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> unto <span class=\"wl wl-kjv\" data-code=\"H1007\">Bethaven.</span>", "24": "And the <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> were <span class=\"wl wl-kjv\" data-code=\"H5065\">distressed</span> that <span class=\"wl wl-kjv\" data-code=\"H3117\">day:</span> for <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> had <span class=\"wl wl-kjv\" data-code=\"H422\">adjured</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H779\">Cursed</span> be the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> that <span class=\"wl wl-kjv\" data-code=\"H398\">eateth</span> any <span class=\"wl wl-kjv\" data-code=\"H3899\">food</span> until <span class=\"wl wl-kjv\" data-code=\"H6153\">evening,</span> that I may be <span class=\"wl wl-kjv\" data-code=\"H5358\">avenged</span> on mine <span class=\"wl wl-kjv\" data-code=\"H341\">enemies.</span> So none of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H2938\">tasted</span> any <span class=\"wl wl-kjv\" data-code=\"H3899\">food.</span>", "25": "And all they of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to a <span class=\"wl wl-kjv\" data-code=\"H3293\">wood;</span> and there was <span class=\"wl wl-kjv\" data-code=\"H1706\">honey</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">upon</span> the <span class=\"wl wl-kjv\" data-code=\"H7704\">ground.</span>", "26": "And when the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> were <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> into the <span class=\"wl wl-kjv\" data-code=\"H3293\">wood,</span> behold, the <span class=\"wl wl-kjv\" data-code=\"H1706\">honey</span> <span class=\"wl wl-kjv\" data-code=\"H1982\">dropped;</span> but no man <span class=\"wl wl-kjv\" data-code=\"H5381\">put</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> to his <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth:</span> for the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3372\">feared</span> the <span class=\"wl wl-kjv\" data-code=\"H7621\">oath.</span>", "27": "But <span class=\"wl wl-kjv\" data-code=\"H3129\">Jonathan</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> not when his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H7650\">charged</span> ➔ the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> with the <span class=\"wl wl-kjv\" data-code=\"H7650\">oath:</span> wherefore he put <span class=\"wl wl-kjv\" data-code=\"H7971\">forth</span> the <span class=\"wl wl-kjv\" data-code=\"H7097\">end</span> of the <span class=\"wl wl-kjv\" data-code=\"H4294\">rod</span> that was in his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and <span class=\"wl wl-kjv\" data-code=\"H2881\">dipped</span> it in an <span class=\"wl wl-kjv\" data-code=\"H3295\">honeycomb,</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">put</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> to his <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth;</span> and his <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> were <span class=\"wl wl-kjv\" data-code=\"H215\">enlightened.</span>", "28": "Then <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Thy <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H7650\">straitly</span> <span class=\"wl wl-kjv\" data-code=\"H7650\">charged</span> ➔ the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> with an <span class=\"wl wl-kjv\" data-code=\"H7650\">oath,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H779\">Cursed</span> be the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> that <span class=\"wl wl-kjv\" data-code=\"H398\">eateth</span> any <span class=\"wl wl-kjv\" data-code=\"H3899\">food</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day.</span> And the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> were <span class=\"wl wl-kjv\" data-code=\"H5774\">faint.</span>", "29": "Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H3129\">Jonathan,</span> My <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> hath <span class=\"wl wl-kjv\" data-code=\"H5916\">troubled</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land:</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">see,</span> I pray you, how mine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> have been <span class=\"wl wl-kjv\" data-code=\"H215\">enlightened,</span> because I <span class=\"wl wl-kjv\" data-code=\"H2938\">tasted</span> a <span class=\"wl wl-kjv\" data-code=\"H4592\">little</span> of this <span class=\"wl wl-kjv\" data-code=\"H1706\">honey.</span>", "30": "How much <span class=\"wl wl-kjv\" data-code=\"H637\">more,</span> if <span class=\"wl wl-kjv\" data-code=\"H3863\">haply</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> had <span class=\"wl wl-kjv\" data-code=\"H398\">eaten</span> <span class=\"wl wl-kjv\" data-code=\"H398\">freely</span> to <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of the <span class=\"wl wl-kjv\" data-code=\"H7998\">spoil</span> of their <span class=\"wl wl-kjv\" data-code=\"H341\">enemies</span> which they <span class=\"wl wl-kjv\" data-code=\"H4672\">found?</span> for had there not been now a much <span class=\"wl wl-kjv\" data-code=\"H7235\">greater</span> <span class=\"wl wl-kjv\" data-code=\"H4347\">slaughter</span> among the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines?</span>", "31": "And they <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> from <span class=\"wl wl-kjv\" data-code=\"H4363\">Michmash</span> to <span class=\"wl wl-kjv\" data-code=\"H357\">Aijalon:</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> were <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H5774\">faint.</span>", "32": "And the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H5860\">flew</span> upon the <span class=\"wl wl-kjv\" data-code=\"H7998\">spoil,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep,</span> and <span class=\"wl wl-kjv\" data-code=\"H1241\">oxen,</span> and <span class=\"wl wl-kjv\" data-code=\"H1121\">calves,</span> and <span class=\"wl wl-kjv\" data-code=\"H7819\">slew</span> them on the <span class=\"wl wl-kjv\" data-code=\"H776\">ground:</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> did <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> them with the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood.</span>", "33": "Then they <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Behold, the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H2398\">sin</span> against the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> in that they <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> with the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood.</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Ye have <span class=\"wl wl-kjv\" data-code=\"H898\">transgressed:</span> <span class=\"wl wl-kjv\" data-code=\"H1556\">roll</span> a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stone</span> unto me this <span class=\"wl wl-kjv\" data-code=\"H3117\">day.</span>", "34": "And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H6327\">Disperse</span> yourselves among the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto them, Bring me <span class=\"wl wl-kjv\" data-code=\"H5066\">hither</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> his <span class=\"wl wl-kjv\" data-code=\"H7794\">ox,</span> and every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> his <span class=\"wl wl-kjv\" data-code=\"H7716\">sheep,</span> and <span class=\"wl wl-kjv\" data-code=\"H7819\">slay</span> them here, and <span class=\"wl wl-kjv\" data-code=\"H398\">eat;</span> and <span class=\"wl wl-kjv\" data-code=\"H2398\">sin</span> not against the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> in <span class=\"wl wl-kjv\" data-code=\"H398\">eating</span> with the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood.</span> And all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H5066\">brought</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> his <span class=\"wl wl-kjv\" data-code=\"H7794\">ox</span> with <span class=\"wl wl-kjv\" data-code=\"H3027\">him</span> that <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> and <span class=\"wl wl-kjv\" data-code=\"H7819\">slew</span> them there.", "35": "And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> an <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> the same was the <span class=\"wl wl-kjv\" data-code=\"H2490\">first</span> <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> that he <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>", "36": "And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Let us go <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> by <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> and <span class=\"wl wl-kjv\" data-code=\"H962\">spoil</span> them until the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning</span> <span class=\"wl wl-kjv\" data-code=\"H216\">light,</span> and let us not <span class=\"wl wl-kjv\" data-code=\"H7604\">leave</span> a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of them. And they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">Do</span> whatsoever <span class=\"wl wl-kjv\" data-code=\"H5869\">seemeth</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> unto thee. Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> Let us draw <span class=\"wl wl-kjv\" data-code=\"H7126\">near</span> <span class=\"wl wl-kjv\" data-code=\"H1988\">hither</span> unto <span class=\"wl wl-kjv\" data-code=\"H430\">God.</span>", "37": "And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H7592\">asked</span> counsel of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> Shall I go <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines?</span> wilt thou <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> them into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel?</span> But he <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> him not that <span class=\"wl wl-kjv\" data-code=\"H3117\">day.</span>", "38": "And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Draw ye <span class=\"wl wl-kjv\" data-code=\"H5066\">near</span> <span class=\"wl wl-kjv\" data-code=\"H1988\">hither,</span> all the <span class=\"wl wl-kjv\" data-code=\"H6438\">chief</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people:</span> and <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> <span class=\"wl wl-kjv\" data-code=\"H4100\">wherein</span> this <span class=\"wl wl-kjv\" data-code=\"H2403\">sin</span> hath been this <span class=\"wl wl-kjv\" data-code=\"H3117\">day.</span>", "39": "For, as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> which <span class=\"wl wl-kjv\" data-code=\"H3467\">saveth</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> though it <span class=\"wl wl-kjv\" data-code=\"H3426\">be</span> in <span class=\"wl wl-kjv\" data-code=\"H3129\">Jonathan</span> my <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> he shall <span class=\"wl wl-kjv\" data-code=\"H4191\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">die.</span> But there was not a man among all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> him.", "40": "Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> he unto all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> Be ye on <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H5676\">side,</span> and I and <span class=\"wl wl-kjv\" data-code=\"H3129\">Jonathan</span> my <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> will be on the <span class=\"wl wl-kjv\" data-code=\"H259\">other</span> <span class=\"wl wl-kjv\" data-code=\"H5676\">side.</span> And the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">Do</span> what <span class=\"wl wl-kjv\" data-code=\"H5869\">seemeth</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> unto thee.", "41": "Therefore <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H3051\">Give</span> a <span class=\"wl wl-kjv\" data-code=\"H8549\">perfect</span> lot. And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> and <span class=\"wl wl-kjv\" data-code=\"H3129\">Jonathan</span> were <span class=\"wl wl-kjv\" data-code=\"H3920\">taken:</span> but the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3318\">escaped.</span>", "42": "And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H5307\">Cast</span> lots between me and <span class=\"wl wl-kjv\" data-code=\"H3129\">Jonathan</span> my <span class=\"wl wl-kjv\" data-code=\"H1121\">son.</span> And <span class=\"wl wl-kjv\" data-code=\"H3129\">Jonathan</span> was <span class=\"wl wl-kjv\" data-code=\"H3920\">taken.</span>", "43": "Then <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H3129\">Jonathan,</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">Tell</span> me what thou hast <span class=\"wl wl-kjv\" data-code=\"H6213\">done.</span> And <span class=\"wl wl-kjv\" data-code=\"H3129\">Jonathan</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> him, and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I did <span class=\"wl wl-kjv\" data-code=\"H2938\">but</span> <span class=\"wl wl-kjv\" data-code=\"H2938\">taste</span> a <span class=\"wl wl-kjv\" data-code=\"H4592\">little</span> <span class=\"wl wl-kjv\" data-code=\"H1706\">honey</span> with the <span class=\"wl wl-kjv\" data-code=\"H7097\">end</span> of the <span class=\"wl wl-kjv\" data-code=\"H4294\">rod</span> that was in mine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and, <span class=\"wl wl-kjv\" data-code=\"H2009\">lo,</span> I must <span class=\"wl wl-kjv\" data-code=\"H4191\">die.</span>", "44": "And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> do <span class=\"wl wl-kjv\" data-code=\"H6213\">so</span> and more <span class=\"wl wl-kjv\" data-code=\"H3254\">also:</span> for thou shalt <span class=\"wl wl-kjv\" data-code=\"H4191\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">die,</span> <span class=\"wl wl-kjv\" data-code=\"H3129\">Jonathan.</span>", "45": "And the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> Shall <span class=\"wl wl-kjv\" data-code=\"H3129\">Jonathan</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">die,</span> who hath <span class=\"wl wl-kjv\" data-code=\"H6213\">wrought</span> this <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H3444\">salvation</span> in <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel?</span> God <span class=\"wl wl-kjv\" data-code=\"H2486\">forbid:</span> as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> there shall not one <span class=\"wl wl-kjv\" data-code=\"H8185\">hair</span> of his <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> to the <span class=\"wl wl-kjv\" data-code=\"H776\">ground;</span> for he hath <span class=\"wl wl-kjv\" data-code=\"H6213\">wrought</span> with <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day.</span> So the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H6299\">rescued</span> <span class=\"wl wl-kjv\" data-code=\"H3129\">Jonathan,</span> that he <span class=\"wl wl-kjv\" data-code=\"H4191\">died</span> not.", "46": "Then <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> from <span class=\"wl wl-kjv\" data-code=\"H310\">following</span> the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines:</span> and the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> to their own <span class=\"wl wl-kjv\" data-code=\"H4725\">place.</span>", "47": "So <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H3920\">took</span> the <span class=\"wl wl-kjv\" data-code=\"H4410\">kingdom</span> over <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and <span class=\"wl wl-kjv\" data-code=\"H3898\">fought</span> against all his <span class=\"wl wl-kjv\" data-code=\"H341\">enemies</span> on every <span class=\"wl wl-kjv\" data-code=\"H5439\">side,</span> against <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab,</span> and against the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon,</span> and against <span class=\"wl wl-kjv\" data-code=\"H123\">Edom,</span> and against the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H6678\">Zobah,</span> and against the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines:</span> and whithersoever he <span class=\"wl wl-kjv\" data-code=\"H6437\">turned</span> himself, he <span class=\"wl wl-kjv\" data-code=\"H7561\">vexed</span> them.", "48": "And he <span class=\"wl wl-kjv\" data-code=\"H6213\">gathered</span> an <span class=\"wl wl-kjv\" data-code=\"H2428\">host,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> the <span class=\"wl wl-kjv\" data-code=\"H6002\">Amalekites,</span> and <span class=\"wl wl-kjv\" data-code=\"H5337\">delivered</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> out of the <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> of them that <span class=\"wl wl-kjv\" data-code=\"H8154\">spoiled</span> them.", "49": "Now the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> were <span class=\"wl wl-kjv\" data-code=\"H3129\">Jonathan,</span> and <span class=\"wl wl-kjv\" data-code=\"H3440\">Ishui,</span> and <span class=\"wl wl-kjv\" data-code=\"H4444\">Melchishua:</span> and the <span class=\"wl wl-kjv\" data-code=\"H8034\">names</span> of his <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> were these; the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H1067\">firstborn</span> <span class=\"wl wl-kjv\" data-code=\"H4764\">Merab,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H6996\">younger</span> <span class=\"wl wl-kjv\" data-code=\"H4324\">Michal:</span>", "50": "And the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul's</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> was <span class=\"wl wl-kjv\" data-code=\"H293\">Ahinoam,</span> the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H290\">Ahimaaz:</span> and the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H8269\">captain</span> of his <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> was <span class=\"wl wl-kjv\" data-code=\"H74\">Abner,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5369\">Ner,</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul's</span> <span class=\"wl wl-kjv\" data-code=\"H1730\">uncle.</span>", "51": "And <span class=\"wl wl-kjv\" data-code=\"H7027\">Kish</span> was the <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> of <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul;</span> and <span class=\"wl wl-kjv\" data-code=\"H5369\">Ner</span> the <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> of <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> was the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H22\">Abiel.</span>", "52": "And there was <span class=\"wl wl-kjv\" data-code=\"H2389\">sore</span> <span class=\"wl wl-kjv\" data-code=\"H4421\">war</span> against the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> all the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul:</span> and when <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> any <span class=\"wl wl-kjv\" data-code=\"H1368\">strong</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> or any <span class=\"wl wl-kjv\" data-code=\"H2428\">valiant</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">man,</span> he <span class=\"wl wl-kjv\" data-code=\"H622\">took</span> him unto him."}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling', 'Matthew Henry-verklaring']],
  ['Geloofsbelijdenissen', ['1689 Baptist Confession', 'Westminster Confession']],
  ['Boeken', ['Institutie — Calvijn', 'A Body of Divinity — Watson']],
  ['Preken', ['Spurgeon']],
  ['Devotionals', ['Spurgeon']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    let h = '<div class="verg-kop">Grondwoorden</div>';
    if (!heeftB && !heeftK) {
      h += '<em>Nog geen woordkoppeling voor dit vers.</em>';
    } else {
      if (heeftB) h += `<div class="tsk-kop">SVnu</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      h += '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
    }
    h += '<div class="verg-kop" style="margin-top:1.4rem">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vergelijk</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
