s", "href": "../../1-timotheus/1/"}, {"naam": "2 Timotheüs", "href": "../../2-timotheus/1/"}, {"naam": "Titus", "href": "../../titus/1/"}, {"naam": "Filemon", "href": "../../filemon/1/"}, {"naam": "Hebreeën", "href": "../../hebreeen/1/"}, {"naam": "Jakobus", "href": "../../jakobus/1/"}, {"naam": "1 Petrus", "href": "../../1-petrus/1/"}, {"naam": "2 Petrus", "href": "../../2-petrus/1/"}, {"naam": "1 Johannes", "href": "../../1-johannes/1/"}, {"naam": "2 Johannes", "href": "../../2-johannes/1/"}, {"naam": "3 Johannes", "href": "../../3-johannes/1/"}, {"naam": "Judas", "href": "../../judas/1/"}, {"naam": "Openbaring", "href": "../../openbaring/1/"}], "slugmap": {"Gen": "genesis", "Ex": "exodus", "Lev": "leviticus", "Num": "numeri", "Deut": "deuteronomium", "Joz": "jozua", "Richt": "richteren", "Ruth": "ruth", "1 Sam": "1-samuel", "2 Sam": "2-samuel", "1 Kon": "1-koningen", "2 Kon": "2-koningen", "1 Kron": "1-kronieken", "2 Kron": "2-kronieken", "Ezra": "ezra", "Neh": "nehemia", "Est": "esther", "Job": "job", "Ps": "psalmen", "Spr": "spreuken", "Pred": "prediker", "Hoogl": "hooglied", "Jes": "jesaja", "Jer": "jeremia", "Klaagl": "klaagliederen", "Ezech": "ezechiel", "Dan": "daniel", "Hos": "hosea", "Joël": "joel", "Amos": "amos", "Obadja": "obadja", "Jona": "jona", "Micha": "micha", "Nahum": "nahum", "Hab": "habakuk", "Zef": "zefanja", "Hagg": "haggai", "Zach": "zacharia", "Mal": "maleachi", "Matt": "mattheus", "Mark": "markus", "Luk": "lukas", "Joh": "johannes", "Hand": "handelingen", "Rom": "romeinen", "1 Kor": "1-korinthe", "2 Kor": "2-korinthe", "Gal": "galaten", "Ef": "efeze", "Fil": "filippenzen", "Kol": "kolossenzen", "1 Tess": "1-thessalonicenzen", "2 Tess": "2-thessalonicenzen", "1 Tim": "1-timotheus", "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "Het gebeurde nu op een dag dat Jonathan, de zoon van Saul, tegen de jongen die zijn wapens droeg, zei: Kom, laten we naar de bezetting van de Filistijnen oversteken, die aan de overkant is. Maar hij vertelde het zijn vader niet.", "2": "Saul zat toen aan het uiterste van Gibea onder de granaatappelboom die bij Migron staat; en het volk dat bij hem was, was ongeveer zeshonderd man.", "3": "En Ahia, de zoon van Ahitub, de broer van Ikabod, de zoon van Pinehas, de zoon van Eli, was priester van de HEERE te Silo en droeg de efod[1]; maar het volk wist niet dat Jonathan weggegaan was.", "4": "Nu was er tussen de doorgangen, waar Jonathan door probeerde te gaan naar de bezetting van de Filistijnen, een scherpe rots aan deze kant en een scherpe rots aan de andere kant; en de naam van de ene was Bozes en de naam van de andere Sene.", "5": "De ene rots lag naar het noorden, tegenover Michmas, en de andere naar het zuiden, tegenover Geba.", "6": "Jonathan nu zei tegen de jongen die zijn wapens droeg: Kom, laten we naar de bezetting van deze onbesnedenen oversteken; misschien zal de HEERE voor ons werken, want bij de HEERE is geen belemmering om te verlossen door velen of door weinigen.", "7": "Toen zei zijn wapendrager tegen hem: Doe alles wat in uw hart is; ga uw gang, zie, ik ben met u, naar uw hart.", "8": "Jonathan nu zei: Zie, wij zullen naar die mannen oversteken, en wij zullen ons aan hen laten zien.", "9": "Als zij zo tegen ons zeggen: Blijf staan, totdat wij bij u komen, dan zullen wij op onze plaats blijven staan en niet naar hen opklimmen.", "10": "Maar zeggen zij zo: Klim naar ons op, dan zullen wij opklimmen, want de HEERE heeft hen in onze hand gegeven; en dit zal ons een teken zijn.", "11": "Toen zij beiden zich lieten zien aan de bezetting van de Filistijnen, zeiden de Filistijnen: Zie, de Hebreeën komen uit de holen waarin zij zich verstopt hadden.", "12": "Verder antwoordden de mannen van de bezetting Jonathan en zijn wapendrager, en zeiden: Klim op naar ons, en wij zullen u iets duidelijk maken. En Jonathan zei tegen zijn wapendrager: Klim achter mij op, want de HEERE heeft hen gegeven in de hand van Israël.", "13": "Toen klom Jonathan op zijn handen en op zijn voeten omhoog, en zijn wapendrager achter hem aan; en zij vielen voor Jonathan neer, en zijn wapendrager doodde ze achter hem.", "14": "Deze eerste aanval, waarmee Jonathan en zijn wapendrager ongeveer twintig man versloegen, gebeurde op ongeveer de helft van een halve morgen land, zoveel als een span ossen kan omploegen.", "15": "En er kwam beving in het leger, op het veld en onder heel het volk; de bezetting en de plunderaars beefden ook zelf; ja, het land schudde, want het was een beving van God.", "16": "Toen de wachters van Saul te Gibea van Benjamin zagen dat, zie, de menigte wegsmolt en heen en weer liep en elkaar neersloeg,", "17": "zei Saul tegen het volk dat bij hem was: Tel toch, en zie wie van ons weggegaan zijn. En zij telden, en zie, Jonathan en zijn wapendrager waren daar niet.", "18": "Toen zei Saul tegen Ahia: Breng de ark van God hierheen. Want de ark van God was op die dag bij de kinderen van Israël.", "19": "En het gebeurde, terwijl Saul nog tot de priester sprak, dat het rumoer dat in het leger van de Filistijnen was, steeds meer toenam en uitbreidde; zo zei Saul tegen de priester: Trek uw hand terug.", "20": "Saul nu, en al het volk dat bij hem was, werden samengeroepen, en zij kwamen bij de strijd; en zie, het zwaard van de een was tegen de ander, er was een zeer grote verwarring.", "21": "Er waren ook Hebreeën bij de Filistijnen, zoals eerder, die met hen in het leger opgetrokken waren, van rondom; dezen voegden zich nu ook bij de Israëlieten die bij Saul en Jonathan waren.", "22": "Toen alle mannen van Israël die zich verstopt hadden in het bergland van Efraïm, hoorden dat de Filistijnen vluchtten, zetten zij hen ook achterna in de strijd.", "23": "Zo verloste de HEERE Israël op die dag; en het leger trok verder naar Beth-aven.", "24": "En de mannen van Israël werden uitgeput op die dag, want Saul had het volk bezworen en gezegd: Vervloekt is de man die voedsel eet vóór de avond, totdat ik mij op mijn vijanden gewroken heb! Daarom proefde heel het volk geen voedsel.", "25": "En heel het volk kwam in een bos; en daar was honig op het veld.", "26": "Toen het volk het bos in kwam, zie, er was een stroom honig; maar niemand raakte met zijn hand zijn mond aan, want het volk was bang voor de eed.", "27": "Maar Jonathan had het niet gehoord, toen zijn vader het volk bezworen had, en hij stak het uiteinde van de staf die in zijn hand was uit, en doopte die in een honigraat; en toen hij zijn hand naar zijn mond bracht, werden zijn ogen weer helder.", "28": "Toen antwoordde iemand uit het volk en zei: Uw vader heeft het volk streng bezworen en gezegd: Vervloekt is de man die vandaag brood eet! Daarom bezwijkt het volk.", "29": "Toen zei Jonathan: Mijn vader heeft het land in moeilijkheden gebracht; kijk toch hoe helder mijn ogen zijn geworden, omdat ik een beetje van deze honing geproefd heb.", "30": "Hoeveel te meer als het volk vandaag vrij had mogen eten van de buit van zijn vijanden, die het gevonden heeft! Maar nu is er geen grote slag geweest onder de Filistijnen.", "31": "Toch versloegen zij op die dag de Filistijnen van Michmas tot Ajalon; en het volk was zeer moe.", "32": "Toen stortte het volk zich op de buit, en zij namen schapen, en runderen, en kalveren, en slachtten ze op de grond; en het volk at ze met het bloed.", "33": "En men berichtte het aan Saul en zei: Zie, het volk zondigt tegen de HEERE door met het bloed te eten. En hij zei: U hebt trouweloos gehandeld; rol vandaag een grote steen naar mij toe.", "34": "Verder zei Saul: Verspreid u onder het volk, en zeg tegen hen: Breng ieder zijn os en ieder zijn schaap naar mij, en slacht het hier, en eet, en zondig niet tegen de HEERE door met het bloed te eten. Toen bracht heel het volk ieder zijn os met zijn hand, 's nachts, en slachtte ze daar.", "35": "Toen bouwde Saul voor de HEERE een altaar; dit was het eerste altaar dat hij voor de HEERE bouwde.", "36": "Daarna zei Saul: Laten we de Filistijnen achterna trekken, bij nacht, en hen beroven totdat het morgen licht wordt, en laten we niet één man van hen overlaten. Zij nu zeiden: Doe alles wat goed is in uw ogen; maar de priester zei: Laten we hier tot God naderen.", "37": "Toen vroeg Saul God: Zal ik de Filistijnen achterna trekken? Zult U ze in de hand van Israël overgeven? Maar Hij antwoordde hem die dag niet.", "38": "Toen zei Saul: Kom hierheen, alle hoofden van het volk, en onderzoek en kijk waarin deze zonde vandaag gebeurd is.", "39": "Want zo waarachtig als de HEERE leeft, Die Israël verlost: al was het bij mijn zoon Jonathan, dan zal hij zeker sterven; en niemand uit heel het volk antwoordde hem.", "40": "Verder zei hij tegen heel Israël: U zult aan de ene kant staan, en ik en mijn zoon Jonathan zullen aan de andere kant staan. Toen zei het volk tegen Saul: Doe wat goed is in uw ogen.", "41": "Saul nu sprak tot de HEERE, de God van Israël: Toon de onschuldige. Toen werden Jonathan en Saul aangewezen, en het volk ging vrijuit.", "42": "Toen zei Saul: Werp het lot tussen mij en mijn zoon Jonathan. Toen werd Jonathan aangewezen.", "43": "Saul dan zei tegen Jonathan: Vertel mij wat u gedaan hebt. Toen vertelde Jonathan het hem, en zei: Ik heb maar een beetje honing geproefd, met het uiteinde van de staf die ik in mijn hand had; zie, hier ben ik, moet ik sterven?", "44": "Toen zei Saul: Zo moet God mij doen, en nog erger, Jonathan! U moet zeker sterven.", "45": "Maar het volk zei tegen Saul: Zou Jonathan sterven, die deze grote verlossing in Israël teweeggebracht heeft? Dat zij verre! Zo waarachtig als de HEERE leeft: geen haar van zijn hoofd zal op de aarde vallen, want hij heeft dit vandaag met God gedaan. Zo redde het volk Jonathan, zodat hij niet stierf.", "46": "Saul nu trok terug van het achtervolgen van de Filistijnen, en de Filistijnen trokken naar hun eigen plaats.", "47": "Toen nam Saul het koningschap over Israël in bezit; en hij streed rondom tegen al zijn vijanden: tegen Moab, en tegen de kinderen van Ammon, en tegen Edom, en tegen de koningen van Zoba, en tegen de Filistijnen; en overal waarheen hij zich wendde, strafte hij hen.", "48": "En hij handelde dapper, en hij versloeg de Amalekieten, en hij redde Israël uit de hand van hem die hen beroofde.", "49": "De zonen van Saul nu waren: Jonathan, en Isvi, en Malchi-sua; en de namen van zijn twee dochters waren deze: de naam van de oudste was Merab, en de naam van de jongste Michal.", "50": "En de naam van Sauls vrouw was Ahinoam, een dochter van Ahimaäz; en de naam van zijn legeraanvoerder was Abner, een zoon van Ner, Sauls oom.", "51": "En Kis was Sauls vader, en Ner, Abners vader, was een zoon van Abiël.", "52": "En er was een zware oorlog tegen de Filistijnen al de dagen van Saul; daarom nam Saul iedere held en iedere dappere man die hij zag, bij zich in dienst."}, "SV": {"1": "Het geschiedde nu op een dag, dat Jonathan, de zoon van Saul, tot den jongen, die zijn wapenen droeg, zeide: Kom, en laat ons tot de bezetting der Filistijnen overgaan, welke aan gene zijde is; doch hij gaf het zijn vader niet te kennen.", "2": "Saul nu zat aan het uiterste van Gibea onder den granatenboom, die te Migron was; en het volk, dat bij hem was, was omtrent zeshonderd man.", "3": "En Ahia, de zoon van Ahitub, den broeder van Ikabod, den zoon van Pinehas, den zoon van Eli, was priester des HEEREN, te Silo, dragende den efod; doch het volk wist niet, dat Jonathan heengegaan was.", "4": "Er was nu tussen de doortochten, waar Jonathan zocht door te gaan tot der Filistijnen bezetting, een scherpte van een steenklip aan deze zijde, en een scherpte van een steenklip aan gene zijde; en de naam der ene was Bozes, en de naam der andere Sene.", "5": "De ene tand was gelegen tegen het noorden, tegenover Michmas, en de andere tegen het zuiden, tegenover Geba.", "6": "Jonathan nu zeide tot den jongen, die zijn wapenen droeg: Kom, en laat ons tot de bezetting dezer onbesnedenen overgaan; misschien zal de HEERE voor ons werken; want bij den HEERE is geen verhindering, om te verlossen door velen of door weinigen.", "7": "Toen zeide zijn wapendrager tot hem: Doe al, wat in uw hart is; wend u, zie ik ben met u, naar uw hart.", "8": "Jonathan nu zeide: Zie, wij zullen overgaan tot die mannen, en wij zullen ons aan hen ontdekken.", "9": "Indien zij aldus tot ons zeggen: Staat stil, totdat wij aan ulieden komen; zo zullen wij blijven staan aan onze plaats, en tot hen niet opklimmen.", "10": "Maar zeggen zij aldus: Klimt tot ons op; zo zullen wij opklimmen, want de HEERE heeft hen in onze hand gegeven; en dit zal ons een teken zijn.", "11": "Toen zij beiden zich aan der Filistijnen bezetting ontdekten, zo zeiden de Filistijnen: Ziet, de Hebreën zijn uit de holen uitgegaan, waarin zij zich verstoken hadden.", "12": "Verder antwoordden de mannen der bezetting aan Jonathan en zijn wapendrager, en zeiden: Klimt op tot ons, en wij zullen het u wijs maken. En Jonathan zeide tot zijn wapendrager: Klim op achter mij, want de HEERE heeft hen gegeven in de hand van Israël.", "13": "Toen klom Jonathan op zijn handen en op zijn voeten, en zijn wapendrager hem na; en zij vielen voor Jonathans aangezicht, en zijn wapendrager doodde ze achter hem.", "14": "Deze eerste slag nu, waarmede Jonathan en zijn wapendrager omtrent twintig mannen versloegen, geschiedde omtrent in de helft eens bunders, zijnde een juk ossen lands.", "15": "En er was een beving in het leger, op het veld en onder het ganse volk; de bezetting en de verdervers beefden ook zelven; ja, het land werd beroerd, want het was een beving Gods.", "16": "Als nu de wachters van Saul te Gibea-benjamins zagen, dat, ziet, de menigte versmolt, en doorging, en geklopt werd;", "17": "Toen zeide Saul tot het volk, dat bij hem was: Telt toch, en beziet, wie van ons weggegaan zijn. En zij telden, en ziet, Jonathan en zijn wapendrager waren daar niet.", "18": "Toen zeide Saul tot Ahia: Breng de ark Gods herwaarts. Want de ark Gods was te dien dage bij de kinderen Israëls.", "19": "En het geschiedde, toen Saul nog tot den priester sprak, dat het rumoer, hetwelk in der Filistijnen leger was, zeer toenam en vermenigvuldigde; zo zeide Saul tot den priester: Haal uw hand in.", "20": "Saul nu, en al het volk, dat bij hem was, werd samengeroepen, en zij kwamen ten strijde; en ziet, het zwaard des enen was tegen den anderen, er was een zeer groot gedruis.", "21": "Er waren ook Hebreën bij de Filistijnen, als eertijds, die met hen in het leger opgetogen waren rondom; dezen nu vervoegden zich ook met de Israëlieten, die bij Saul en Jonathan waren.", "22": "Als alle mannen van Israël, die zich verstoken hadden in het gebergte van Efraïm, hoorden, dat de Filistijnen vluchtten, zo kleefden zij ook hen achteraan in den strijd.", "23": "Alzo verloste de HEERE Israël te dien dage; en het leger trok over naar Beth-aven.", "24": "En de mannen van Israël werden mat te dien dage; want Saul had het volk bezworen, zeggende: Vervloekt zij de man, die spijze eet tot aan den avond, opdat ik mij aan mijn vijanden wreke! Daarom proefde dat ganse volk geen spijs.", "25": "En het ganse volk kwam in een woud; en daar was honig op het veld.", "26": "Toen het volk in het woud kwam, ziet, zo was er een honigvloed; maar niemand raakte met zijn hand aan zijn mond, want het volk vreesde de bezwering.", "27": "Maar Jonathan had het niet gehoord, toen zijn vader het volk bezworen had, en hij reikte het einde van den staf uit, die in zijn hand was, en hij doopte denzelven in een honigraat; als hij nu zijn hand tot zijn mond wendde, zo werden zijn ogen verlicht.", "28": "Toen antwoordde een man uit het volk, en zeide: Uw vader heeft het volk zwaarlijk bezworen, zeggende: Vervloekt zij de man, die heden brood eet! Daarom bezwijkt het volk.", "29": "Toen zeide Jonathan: Mijn vader heeft het land beroerd; zie toch, hoe mijn ogen verlicht zijn, omdat ik een weinig van dezen honig gesmaakt heb;", "30": "Hoe veel meer, indien het volk heden had mogen vrijelijk eten van den buit zijner vijanden, dien het gevonden heeft! Maar nu is die slag niet groot geweest over de Filistijnen.", "31": "Doch zij sloegen te dien dage de Filistijnen van Michmas tot Ajalon; en het volk was zeer moede.", "32": "Toen maakte zich het volk aan den buit, en zij namen schapen, en runderen, en kalveren, en zij slachtten ze tegen de aarde; en het volk at ze met het bloed.", "33": "En men boodschapte het Saul, zeggende: Zie, het volk verzondigt zich aan den HEERE, etende met het bloed. En hij zeide: Gij hebt trouwelooslijk gehandeld; wentelt heden een groten steen tot mij.", "34": "Verder sprak Saul: Verstrooit u onder het volk, en zegt tot hen: Brengt tot mij een iegelijk zijn os, en een iegelijk zijn schaap, en slacht het hier, en eet, en bezondigt u niet aan den HEERE, die etende met het bloed. Toen bracht al het volk een iegelijk zijn os met zijn hand, des nachts, en slachtte ze aldaar.", "35": "Toen bouwde Saul den HEERE een altaar; dit was het eerste altaar, dat hij den HEERE bouwde.", "36": "Daarna zeide Saul: Laat ons aftrekken de Filistijnen na, bij nacht, en laat ons dezelve beroven, totdat het morgen licht worde, en laat ons niet een man onder hen overig laten. Zij nu zeiden: Doe al wat goed is in uw ogen; maar de priester zeide: Laat ons herwaarts tot God naderen.", "37": "Toen vraagde Saul God: Zal ik aftrekken de Filistijnen na? Zult Gij ze in de hand van Israël overgeven? Doch Hij antwoordde hem niet te dien dage.", "38": "Toen zeide Saul: Komt herwaarts *uit* alle hoeken des volks, en verneemt, en ziet, waarin deze zonde heden geschied zij.", "39": "Want *zo* *waarachtig* *als* de HEERE leeft, Die Israël verlost, al ware het in mijn zoon Jonathan, zo zal hij den dood sterven; en niemand uit het ganse volk antwoordde hem.", "40": "Verder zeide hij tot het ganse Israël: Gijlieden zult aan de ene zijde zijn, en ik en mijn zoon Jonathan zullen aan de andere zijde zijn. Toen zeide het volk tot Saul: Doe, wat goed is in uw ogen.", "41": "Saul nu sprak tot den HEERE, den God Israëls: Toon den onschuldige. Toen werd Jonathan en Saul geraakt, en het volk ging *vrij* uit.", "42": "Toen zeide Saul: Werpt *het* *lot* tussen mij en tussen mijn zoon Jonathan. Toen werd Jonathan geraakt.", "43": "Saul dan zeide tot Jonathan: Geef mij te kennen, wat gij gedaan hebt. Toen gaf het Jonathan hem te kennen, en zeide: Ik heb maar een weinig honigs geproefd, met het uiterste des stafs, dien ik in mijn hand had; zie *hier* ben ik, moet ik sterven?", "44": "Toen zeide Saul: Zo doe *mij* God, en zo doe Hij daartoe, Jonathan! gij moet den dood sterven.", "45": "Maar het volk zeide tot Saul: Zou Jonathan sterven, die deze grote verlossing in Israël gedaan heeft? Dat zij verre! *zo* *waarachtig* *als* de HEERE leeft, als er een haar van zijn hoofd op de aarde vallen zal; want hij heeft *dit* heden met God gedaan. Alzo verloste het volk Jonathan, dat hij niet stierf.", "46": "Saul nu toog op van achter de Filistijnen, en de Filistijnen trokken aan hun plaats.", "47": "Toen nam Saul het koninkrijk over Israël in; en hij streed rondom tegen al zijn vijanden, tegen Moab, en tegen de kinderen Ammons, en tegen Edom, en tegen de koningen van Zoba, en tegen de Filistijnen; en overal, waar hij zich wendde, oefende hij straf.", "48": "En hij handelde dapper, en hij sloeg de Amalekieten, en hij redde Israël uit de hand desgenen, die hem beroofde.", "49": "De zonen van Saul nu waren: Jonathan, en Isvi, en Malchi-sua; en de namen zijner twee dochteren waren *deze*: de naam der eerstgeborene was Merab, en de naam der kleinste Michal.", "50": "En de naam van Sauls huisvrouw was Ahinoam, een dochter van Ahimaäz; en de naam van zijn krijgsoverste was Abi-ner, een zoon van Ner, Sauls oom.", "51": "En Kis was Sauls vader, en Ner, Abners vader, was een zoon van Abiël.", "52": "En er was een sterke krijg tegen de Filistijnen al de dagen van Saul; daarom alle helden en alle kloeke mannen, die Saul zag, die vergaderde hij tot zich."}, "KJV": {"1": "Now it came to pass upon a day, that Jonathan the son of Saul said unto the young man that bare his armour, Come, and let us go over to the Philistines' garrison, that is on the other side. But he told not his father.", "2": "And Saul tarried in the uttermost part of Gibeah under a pomegranate tree which is in Migron: and the people that were with him were about six hundred men;", "3": "And Ahiah, the son of Ahitub, Ichabod's brother, the son of Phinehas, the son of Eli, the LORD'S priest in Shiloh, wearing an ephod. And the people knew not that Jonathan was gone.", "4": "And between the passages, by which Jonathan sought to go over unto the Philistines' garrison, there was a sharp rock on the one side, and a sharp rock on the other side: and the name of the one was Bozez, and the name of the other Seneh.", "5": "The forefront of the one was situate northward over against Michmash, and the other southward over against Gibeah.", "6": "And Jonathan said to the young man that bare his armour, Come, and let us go over unto the garrison of these uncircumcised: it may be that the LORD will work for us: for there is no restraint to the LORD to save by many or by few.", "7": "And his armourbearer said unto him, Do all that is in thine heart: turn thee; behold, I am with thee according to thy heart.", "8": "Then said Jonathan, Behold, we will pass over unto these men, and we will discover ourselves unto them.", "9": "If they say thus unto us, Tarry until we come to you; then we will stand still in our place, and will not go up unto them.", "10": "But if they say thus, Come up unto us; then we will go up: for the LORD hath delivered them into our hand: and this shall be a sign unto us.", "11": "And both of them discovered themselves unto the garrison of the Philistines: and the Philistines said, Behold, the Hebrews come forth out of the holes where they had hid themselves.", "12": "And the men of the garrison answered Jonathan and his armourbearer, and said, Come up to us, and we will shew you a thing. And Jonathan said unto his armourbearer, Come up after me: for the LORD hath delivered them into the hand of Israel.", "13": "And Jonathan climbed up upon his hands and upon his feet, and his armourbearer after him: and they fell before Jonathan; and his armourbearer slew after him.", "14": "And that first slaughter, which Jonathan and his armourbearer made, was about twenty men, within as it were an half acre of land, which a yoke of oxen might plow.", "15": "And there was trembling in the host, in the field, and among all the people: the garrison, and the spoilers, they also trembled, and the earth quaked: so it was a very great trembling.", "16": "And the watchmen of Saul in Gibeah of Benjamin looked; and, behold, the multitude melted away, and they went on beating down one another.", "17": "Then said Saul unto the people that were with him, Number now, and see who is gone from us. And when they had numbered, behold, Jonathan and his armourbearer were not there.", "18": "And Saul said unto Ahiah, Bring hither the ark of God. For the ark of God was at that time with the children of Israel.", "19": "And it came to pass, while Saul talked unto the priest, that the noise that was in the host of the Philistines went on and increased: and Saul said unto the priest, Withdraw thine hand.", "20": "And Saul and all the people that were with him assembled themselves, and they came to the battle: and, behold, every man's sword was against his fellow, and there was a very great discomfiture.", "21": "Moreover the Hebrews that were with the Philistines before that time, which went up with them into the camp from the country round about, even they also turned to be with the Israelites that were with Saul and Jonathan.", "22": "Likewise all the men of Israel which had hid themselves in mount Ephraim, when they heard that the Philistines fled, even they also followed hard after them in the battle.", "23": "So the LORD saved Israel that day: and the battle passed over unto Bethaven.", "24": "And the men of Israel were distressed that day: for Saul had adjured the people, saying, Cursed be the man that eateth any food until evening, that I may be avenged on mine enemies. So none of the people tasted any food.", "25": "And all they of the land came to a wood; and there was honey upon the ground.", "26": "And when the people were come into the wood, behold, the honey dropped; but no man put his hand to his mouth: for the people feared the oath.", "27": "But Jonathan heard not when his father charged ➔ the people with the oath: wherefore he put forth the end of the rod that was in his hand, and dipped it in an honeycomb, and put his hand to his mouth; and his eyes were enlightened.", "28": "Then answered one of the people, and said, Thy father straitly charged ➔ the people with an oath, saying, Cursed be the man that eateth any food this day. And the people were faint.", "29": "Then said Jonathan, My father hath troubled the land: see, I pray you, how mine eyes have been enlightened, because I tasted a little of this honey.", "30": "How much more, if haply the people had eaten freely to day of the spoil of their enemies which they found? for had there not been now a much greater slaughter among the Philistines?", "31": "And they smote the Philistines that day from Michmash to Aijalon: and the people were very faint.", "32": "And the people flew upon the spoil, and took sheep, and oxen, and calves, and slew them on the ground: and the people did eat them with the blood.", "33": "Then they told Saul, saying, Behold, the people sin against the LORD, in that they eat with the blood. And he said, Ye have transgressed: roll a great stone unto me this day.", "34": "And Saul said, Disperse yourselves among the people, and say unto them, Bring me hither every man his ox, and every man his sheep, and slay them here, and eat; and sin not against the LORD in eating with the blood. And all the people brought every man his ox with him that night, and slew them there.", "35": "And Saul built an altar unto the LORD: the same was the first altar that he built unto the LORD.", "36": "And Saul said, Let us go down after the Philistines by night, and spoil them until the morning light, and let us not leave a man of them. And they said, Do whatsoever seemeth good unto thee. Then said the priest, Let us draw near hither unto God.", "37": "And Saul asked counsel of God, Shall I go down after the Philistines? wilt thou deliver them into the hand of Israel? But he answered him not that day.", "38": "And Saul said, Draw ye near hither, all the chief of the people: and know and see wherein this sin hath been this day.", "39": "For, as the LORD liveth, which saveth Israel, though it be in Jonathan my son, he shall surely die. But there was not a man among all the people that answered him.", "40": "Then said he unto all Israel, Be ye on one side, and I and Jonathan my son will be on the other side. And the people said unto Saul, Do what seemeth good unto thee.", "41": "Therefore Saul said unto the LORD God of Israel, Give a perfect lot. And Saul and Jonathan were taken: but the people escaped.", "42": "And Saul said, Cast lots between me and Jonathan my son. And Jonathan was taken.", "43": "Then Saul said to Jonathan, Tell me what thou hast done. And Jonathan told him, and said, I did but taste a little honey with the end of the rod that was in mine hand, and, lo, I must die.", "44": "And Saul answered, God do so and more also: for thou shalt surely die, Jonathan.", "45": "And the people said unto Saul, Shall Jonathan die, who hath wrought this great salvation in Israel? God forbid: as the LORD liveth, there shall not one hair of his head fall to the ground; for he hath wrought with God this day. So the people rescued Jonathan, that he died not.", "46": "Then Saul went up from following the Philistines: and the Philistines went to their own place.", "47": "So Saul took the kingdom over Israel, and fought against all his enemies on every side, against Moab, and against the children of Ammon, and against Edom, and against the kings of Zobah, and against the Philistines: and whithersoever he turned himself, he vexed them.", "48": "And he gathered an host, and smote the Amalekites, and delivered Israel out of the hands of them that spoiled them.", "49": "Now the sons of Saul were Jonathan, and Ishui, and Melchishua: and the names of his two daughters were these; the name of the firstborn Merab, and the name of the younger Michal:", "50": "And the name of Saul's wife was Ahinoam, the daughter of Ahimaaz: and the name of the captain of his host was Abner, the son of Ner, Saul's uncle.", "51": "And Kish was the father of Saul; and Ner the father of Abner was the son of Abiel.", "52": "And there was sore war against the Philistines all the days of Saul: and when Saul saw any strong man, or any valiant man, he took him unto him."}}, "tsk": {"1": [{"kopje": "Jonathan", "refs": ["1 Sam 14:39-45", "1 Sam 13:2", "1 Sam 13:22", "1 Sam 18:1-4", "2 Sam 1:4", "2 Sam 1:5", "2 Sam 1:25", "2 Sam 1:26"]}, {"kopje": "hij vertelde het niet", "refs": ["1 Sam 25:19", "Richt 6:27", "Richt 14:6", "Micha 7:5"]}], "2": [{"kopje": "aan het uiterste", "refs": ["1 Sam 13:15", "1 Sam 13:16", "Jes 10:28", "Jes 10:29"]}, {"kopje": "granaatappelboom", "refs": ["Richt 20:45"]}], "3": [{"kopje": "Ahia", "refs": ["1 Sam 22:9-12", "1 Sam 22:20"]}, {"kopje": "Ikabod", "refs": ["1 Sam 4:21"]}, {"kopje": "droeg", "refs": ["1 Sam 2:28", "Ex 28:26-32"]}], "4": [{"kopje": "de doorgangen", "refs": ["1 Sam 13:23"]}], "5": [{"kopje": "tegenover", "refs": ["1 Sam 14:4"]}], "6": [{"kopje": "onbesnedenen", "refs": ["1 Sam 17:26", "1 Sam 17:36", "Gen 17:7-11", "Richt 15:18", "2 Sam 1:20", "Jer 9:23", "Jer 9:26", "Ef 2:11", "Ef 2:12", "Fil 3:3"]}, {" ], "kinderen": [{"label": "Defeats the Philistines", "href": "../../nave/s/?hl=1Sam.14.52#i17958", "refs": [{"disp": "1 Sam 14:46", "href": "../../1-samuel/14/#v46", "ref": "1 Sam 14:46", "svLabel": null}, {"disp": "1 Sam 14:52", "href": "../../1-samuel/14/#v52", "ref": "1 Sam 14:52", "svLabel": null}], "kinderen": []}]}]}], "torrey": [{"topic": "Philistines, The", "href": "../../torrey/p/#t-philistines-the", "kinderen": [{"label": "Saul constantly at war with", "href": "../../torrey/p/?hl=1Sam.14.52#i14988", "refs": [{"disp": "1 Sam 14:52", "href": "../../1-samuel/14/#v52", "ref": "1 Sam 14:52", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"Job 26:12": "Door Zijn kracht klieft Hij de zee, en door Zijn verstand verslaat Hij haar trots.", "Ps 4:4": "Weet toch, dat de HEERE Zich een gunstgenoot heeft afgezonderd; de HEERE zal horen, als ik tot Hem roep.", "Pred 2:24": "Is het dan niet goed voor de mens dat hij eet en drinkt, en dat hij zijn ziel het goede laat genieten in zijn arbeid? Ik heb ook gezien dat dit uit de hand van God is.", "Ef 2:15": "doordat Hij de vijandschap in Zijn vlees teniet gemaakt heeft, namelijk de wet van de geboden die in inzettingen bestond; opdat Hij die twee in Zichzelf tot één nieuwe mens zou scheppen, en zo vrede zou maken;", "Deut 11:12-15": "Een land, dat de HEERE, uw God, verzorgt; de ogen van de HEERE, uw God, zijn er voortdurend op gericht, van het begin van het jaar tot het einde van het jaar. En het zal gebeuren, als u zorgvuldig zult horen naar Mijn geboden, die Ik u heden gebied, om de HEERE, uw God, lief te hebben, en Hem te dienen, met uw hele hart en met uw hele ziel; Zo zal Ik de regen van uw land geven op zijn tijd, vroege regen en late regen, opdat u uw koren, en uw most, en uw olie inzamelt.", "Ps 73:26": "Bezwijkt mijn vlees en mijn hart, dan is God de Rotssteen van mijn hart, en mijn Deel in eeuwigheid.", "Ps 85:13": "Ook zal de HEERE het goede geven; en ons land zal zijn vrucht geven.", "Deut 32:47": "Want dat is geen leeg woord voor u; maar het is uw leven; en door ditzelfde woord zult u de dagen verlengen op het land, waar u over de Jordaan naartoe gaat, om dat te erven.", "Gen 17:7-11": "En Ik zal Mijn verbond oprichten tussen Mij en u, en uw nageslacht na u, in hun geslachten, tot een eeuwig verbond, om u en uw nageslacht na u tot een God te zijn. En Ik zal u en uw nageslacht na u het land waar u als vreemdeling verblijft geven, het hele land Kanaän, tot eeuwig eigendom; en Ik zal hun tot een God zijn. Verder zei God tegen Abraham: U dan zult Mijn verbond houden, u en uw nageslacht na u, in hun geslachten.", "Job 36:5": "Zie, God is machtig, toch veracht Hij niemand; machtig is Hij in kracht van hart.", "Ps 93:1": "De HEERE regeert, Hij is met majesteit bekleed; de HEERE is bekleed met sterkte, Hij heeft Zich omgord. Ook is de wereld bevestigd, zij zal niet wankelen.", "1 Sam 8:1": "Het gebeurde nu, toen Samuël oud geworden was, dat hij zijn zonen tot richters over Israël aanstelde.", "Richt 6:4": "En zij legerden zich tegen hen, en vernielden de opbrengst van het land, tot waar u bij Gaza komt; en zij lieten geen middelen van bestaan over in Israël, geen klein vee, geen os, geen ezel.", "2 Sam 8:6": "En David legde bezettingen in Syrië van Damaskus, en de Syriërs werden David tot knechten, en zij brachten geschenken; en de HEERE behoedde David overal waar hij heentrok.", "Spr 2:21": "Want de vromen zullen de aarde bewonen, en de oprechten zullen daarin overblijven;", "1 Sam 14:1-14": "Het gebeurde nu op een dag dat Jonathan, de zoon van Saul, tegen de jongen die zijn wapens droeg, zei: Kom, laten we naar de bezetting van de Filistijnen oversteken, die aan de overkant is. Maar hij vertelde het zijn vader niet. Saul zat toen aan het uiterste van Gibea onder de granaatappelboom die bij Migron staat; en het volk dat bij hem was, was ongeveer zeshonderd man. En Ahia, de zoon van Ahitub, de broer van Ikabod, de zoon van Pinehas, de zoon van Eli, was priester van de HEERE te Silo en droeg de efod; maar het volk wist niet dat Jonathan weggegaan was.", "1 Sam 16:21": "Zo kwam David bij Saul, en stond voor hem; en hij hield veel van hem, en hij werd zijn wapendrager.", "Ps 43:5": "Wat buigt u zich neer, o mijn ziel! En wat bent u onrustig in mij? Hoop op God, want ik zal Hem nog loven; Hij is de rijke Verlossing van mijn aangezicht, en mijn God.", "1 Kor 6:14": "En God heeft ook de Heere opgewekt, en zal ons opwekken door Zijn kracht.", "Gen 22:14": "En Abraham noemde de naam van die plaats: De Heere zal het voorzien! Waarom tot op deze dag gezegd wordt: Op de berg van de HEERE zal het voorzien worden!", "Ps 136:5-25": "Hem, Die de hemelen met verstand gemaakt heeft; want Zijn goedertierenheid is voor eeuwig. Hem, Die de aarde op het water uitgespreid heeft; want Zijn goedertierenheid is voor eeuwig. Hem, Die de grote lichten heeft gemaakt; want Zijn goedertierenheid is voor eeuwig.", "Jes 48:17": "Zo zegt de HEERE, uw Verlosser, de Heilige van Israël: Ik ben de HEERE, uw God, Die u leert wat nuttig is, Die u leidt op de weg, die u gaan moet.", "1 Kron 15:24": "En Sebanja, en Josafat, en Nethaneel, en Amasai, en Zecharja, en Benaja, en Eliëzer, de priesters, bliezen op trompetten voor de ark van God; en Obed-edom en Jehia waren poortwachters van de ark.", "Ps 62:6-8": "Maar u, o mijn ziel! zwijg voor God; want van Hem is mijn verwachting. Hij is zeker mijn Rots en mijn Heil, mijn Hoog Vertrek; ik zal niet wankelen. In God is mijn Heil en mijn Eer; de Rots van mijn sterkte, mijn Toevlucht is in God.", "1 Sam 28:6": "En Saul vroeg de HEERE, maar de HEERE antwoordde hem niet; niet door dromen, niet door de Urim, niet door de profeten.", "Rom 1:20": "Want Zijn onzichtbare dingen worden, vanaf de schepping van de wereld, uit de schepselen begrepen en doorzien, namelijk Zijn eeuwige kracht en Goddelijkheid, opdat zij niet te verontschuldigen zouden zijn.", "Fil 3:3": "Want wij zijn de besnijding, wij, die God in de Geest dienen, en in Christus Jezus roemen, en niet vertrouwen op het vlees.", "Ps 70:6": "Doch ik ben ellendig en nooddruftig; o God, haast U tot mij; Gij zijt mijn Hulp en mijn Bevrijder; HEERE, vertoef niet!", "Joz 4:24": "Opdat alle volken van de aarde de hand van de HEERE zouden kennen, dat die sterk is; opdat u de HEERE, uw God, vreest, alle dagen.", "Hebr 12:29": "Want onze God is een verterend vuur.", "Gen 24:26": "Toen boog die man zijn hoofd, en aanbad de HEERE;", "Ef 2:20": "gebouwd op het fundament van de apostelen en profeten, waarvan Jezus Christus Zelf is de uiterste Hoeksteen;", "Spr 14:34": "Gerechtigheid verhoogt een volk, maar de zonde is een schandvlek voor de naties.", "Hos 10:5": "De inwoners van Samaria zullen bang zijn vanwege het kalf van Beth-aven; want zijn volk zal erover treuren, alsook zijn afgodspriesters (die zich erover verheugden), over zijn heerlijkheid, omdat die van hen is weggegaan.", "1 Sam 15:3-7": "Ga nu heen, en sla Amalek, en verban alles wat hij heeft, en verschoon hem niet; maar dood van de man af tot de vrouw toe, van de kinderen tot de zuigelingen, van de ossen tot de schapen, van de kamelen tot de ezels toe. Dit verkondigde Saul aan het volk, en hij telde hen te Telaïm, tweehonderdduizend man van het voetvolk, en tienduizend man van Juda. Toen Saul tot aan de stad Amalek kwam, legde hij een hinderlaag in het dal.", "1 Kon 9:5": "Dan zal Ik de troon van uw koninkrijk over Israël bevestigen in eeuwigheid; zoals Ik gesproken heb over uw vader David, en zei: Er zal u geen man afgesneden worden van de troon van Israël.", "Ps 42:6": "Wat buigt u zich neer, o mijn ziel! En bent u onrustig in mij? Hoop op God, want ik zal Hem nog loven voor de verlossingen van Zijn aangezicht.", "Ps 94:15": "Want het oordeel zal terugkeren tot de gerechtigheid; en alle oprechten van hart zullen dat navolgen.", "Ps 39:8": "En nu, wat verwacht ik, Heere? Mijn hoop is op U.", "Ps 122:9": "Om het huis van de HEERE, onze God, zal ik het goede voor u zoeken.", "Spr 14:4": "Als er geen ossen zijn, is de krib rein; maar door de kracht van de os is er veel inkomen.", "Ps 104:32": "Als Hij de aarde aanschouwt, dan beeft zij; als Hij de bergen aanraakt, dan roken zij.", "Job 39:9": "Die Ik de wildernis tot zijn huis besteld heb, en het ziltige tot zijn woningen.", "Jer 10:6": "Omdat niemand U gelijk is, o HEERE! zo bent U groot, en groot is Uw Naam in macht.", "Mark 14:36": "En Hij zei: Abba, Vader! Alle dingen zijn U mogelijk; neem deze drinkbeker van Mij weg; maar niet wat Ik wil, maar wat U wilt.", "2 Kron 14:11": "En Asa riep tot de HEERE, zijn God, en zei: HEERE, het is voor U niets, te helpen hetzij de machtige, hetzij de krachteloze; help ons, o HEERE, onze God! Want wij steunen op U, en in Uw Naam zijn wij gekomen tegen deze menigte; o HEERE! U bent onze God; laat een sterfelijk mens tegen U niets vermogen.", "1 Kron 27:34": "En na Achitofel was Jojada, de zoon van Benaja, en Abjathar; maar Joab was de legeraanvoerder van de koning.", "Joz 7:16-21": "Toen stond Jozua 's morgens vroeg op, en liet Israël aankomen naar zijn stammen; en de stam van Juda werd aangewezen. Toen hij het geslacht van Juda liet aankomen, wees hij het geslacht van Zarchi aan. Toen hij het geslacht van Zarchi liet aankomen, man voor man, werd Zabdi aangewezen; Diens huisgezin liet hij aankomen, man voor man, en Achan werd aangewezen, de zoon van Charmi, de zoon van Zabdi, de zoon van Zerah, uit de stam van Juda.", "Ps 138:7": "Als ik wandel in het midden van de benauwdheid, maakt Gij mij levend; Uw hand strekt Gij uit tegen de toorn van mijn vijanden, en Uw rechterhand behoudt mij.", "Ps 17:6": "Ik roep U aan, omdat U mij verhoort; o God! Neig Uw oor tot mij; hoor mijn woorden.", "Openb 17:14": "Dezen zullen oorlog voeren tegen het Lam, en het Lam zal hen overwinnen (want Het is een Heere der heren, en een Koning der koningen), en zij die met Hem zijn, de geroepenen en uitverkorenen en gelovigen.", "Ps 107:29": "Hij doet de storm stilstaan, zodat hun golven zwijgen.", "Deut 9:28": "Opdat het land, van waar U ons hebt uitgevoerd, niet zegt: Omdat de HEERE hen niet kon brengen in het land waarvan Hij hun gesproken had, en omdat Hij hen haatte, heeft Hij ze uitgevoerd om hen te doden in de woestijn.", "2 Kron 20:22": "Toen zij nu begonnen met vreugdegeroep en lofzang, stelde de HEERE hinderlagen tegen de kinderen van Ammon, Moab, en die van het gebergte Seir, die tegen Juda gekomen waren; en zij werden verslagen.", "Ps 68:34-36": "Voor Hem, Die daar rijdt in de hemel der hemelen, Die er van oudsher is; zie, Hij geeft Zijn stem, een stem van sterkte. Geeft God sterkte! Zijn hoogheid is over Israël, en Zijn sterkte in de bovenste wolken. O God! U bent ontzagwekkend vanuit Uw heiligdommen; de God van Israël, Die aan het volk sterkte en krachten geeft. Geloofd zij God!", "Lev 26:7": "En u zult uw vijanden vervolgen; en zij zullen voor uw aangezicht door het zwaard vallen.", "2 Sam 23:5": "Hoewel mijn huis zo niet is bij God, heeft Hij mij toch een eeuwig verbond gesteld, dat in alles goed geordend en bewaard is; zeker is daarin al mijn heil, en alle lust, hoewel Hij het nog niet laat uitspruiten.", "Hos 8:14": "Want Israël heeft zijn Maker vergeten en tempels gebouwd, en Juda heeft versterkte steden vermenigvuldigd; maar Ik zal een vuur zenden in zijn steden, dat zal hun paleizen verteren.", "Jona 1:7-10": "Vervolgens zeiden zij, ieder tegen zijn metgezel: Kom, laten we loten werpen, zodat wij mogen weten om wie het gaat dat dit kwaad ons overkomt. Zo wierpen zij loten, en het lot viel op Jona. Toen zeiden zij tegen hem: Vertel ons toch, om wie het gaat dat dit kwaad ons overkomt. Wat is uw werk en waar komt u vandaan? Welk is uw land en van welk volk bent u? En hij zei tegen hen: Ik ben een Hebreeër; en ik vrees de HEERE, de God van de hemel, Die de zee en het droge gemaakt heeft.", "2 Kron 1:12": "De wijsheid en de kennis is u gegeven; daartoe zal Ik u rijkdom, en goederen, en eer geven, zoals geen koningen die vóór u geweest zijn, gehad hebben, en na u zal niemand zoiets hebben.", "Richt 6:27": "Toen nam Gideon tien mannen uit zijn knechten, en deed zoals de HEERE tegen hem gesproken had. Doch het gebeurde, omdat hij bang was voor zijn vaders huis en de mannen van die stad om het overdag te doen, dat hij het 's nachts deed.", "Jak 4:8": "Kom dicht bij God, en Hij zal dicht bij u komen. Reinig de handen, zondaars, en zuiver de harten, dubbelhartigen!", "Hand 24:15": "Terwijl ik hoop heb op God, welke ook zijzelf verwachten, dat er een opstanding van de doden zal zijn, van de rechtvaardigen zowel als van de onrechtvaardigen.", "Amos 1:2": "En hij zei: De HEERE zal brullen uit Sion, en Zijn stem verheffen uit Jeruzalem; en de woningen van de herders zullen treuren, en de top van Karmel zal verdorren.", "Ps 48:9": "Zoals wij gehoord hadden, zo hebben wij gezien in de stad van de HEERE van de heerscharen, in de stad van onze God; God zal haar bevestigen tot in eeuwigheid. Sela.", "1 Sam 10:7": "En het zal gebeuren, als deze tekenen u overkomen, doe dan wat uw hand vindt te doen, want God zal met u zijn.", "Jes 33:22": "Want de HEERE is onze Rechter, de HEERE is onze Wetgever, de HEERE is onze Koning. Hij zal ons redden.", "Job 34:14": "Als Hij Zijn hart tegen hem zette, Zijn geest en Zijn adem zou Hij tot Zich verzamelen;", "Jes 8:10": "Beraadslaag een plan, toch zal het vernietigd worden; spreek een woord, toch zal het niet standhouden; want God is met ons!", "1 Kon 18:18": "Toen zei hij: Ik heb Israël niet in beroering gebracht, maar u en het huis van uw vader, doordat u de geboden van de HEERE verlaten hebt en de Baäls bent gaan navolgen.", "Ps 71:1": "Op U, o HEERE! vertrouw ik; laat mij niet beschaamd worden in eeuwigheid.", "Hand 27:25": "Daarom, houd moed, mannen, want ik geloof God, dat het zo zal zijn zoals het mij gezegd is.", "Ps 148:5": "Laat hen de Naam van de HEERE loven; want toen Hij het beval, werden zij geschapen.", "Deut 5:33": "In heel de weg die de HEERE, uw God, u gebiedt, zult u gaan; opdat u leeft, en opdat het u goed gaat, en u de dagen verlengt in het land dat u erven zult.", "Ex 3:8": "Daarom ben Ik neergekomen, om het te verlossen uit de hand van de Egyptenaren, en het op te voeren uit dit land, naar een goed en ruim land, naar een land dat overvloeit van melk en honing, naar de plaats van de Kanaänieten, en de Hethieten, en de Amorieten, en de Ferezieten, en de Hevieten, en de Jebusieten.", "Job 9:12": "Zie, Hij zal roven, wie zal het Hem doen teruggeven? Wie zal tegen Hem zeggen: Wat doet U?", "Deut 7:13-24": "en Hij zal u liefhebben, en zal u zegenen, en u meer maken; en Hij zal de vrucht van uw buik zegenen, en de vrucht van uw land, uw koren, en uw most, en uw olie, de nakomelingen van uw koeien, en de kudden van uw kleinvee, in het land dat Hij uw vaderen gezworen heeft aan u te geven. Gezegend zult u zijn boven alle volken; er zal onder u geen man of vrouw onvruchtbaar zijn, ook niet onder uw beesten; en de HEERE zal alle ziekte van u afweren, en Hij zal u geen van de kwade ziekten van de Egyptenaren, die u kent, opleggen, maar zal ze leggen op allen die u haten.", "Ps 34:11": "Caph. De jonge leeuwen lijden armoede en honger; maar die de HEERE zoeken hebben geen gebrek aan enig goed.", "Pred 3:13": "Ja ook, dat ieder mens eet en drinkt, en het goede geniet van al zijn arbeid, dit is een gave van God.", "1 Sam 25:44": "Want Saul had zijn dochter Michal, de vrouw van David, gegeven aan Palti, de zoon van Lais, die van Gallim was.", "Ps 142:6": "Tot U riep ik, o HEERE! Ik zei: U bent mijn Toevlucht, mijn Deel in het land van de levenden.", "Ps 74:15": "U hebt een bron en beek gekliefd; U hebt sterke rivieren uitgedroogd.", "Ps 118:7": "De HEERE is bij mij onder degenen die mij helpen; daarom zal ik mijn lust zien aan degenen die mij haten.", "Jes 25:4": "Want U bent voor de arme een Sterkte geweest, een Sterkte voor de nooddruftige, toen het hem bang was; een Toevlucht tegen de vloed, een Schaduw tegen de hitte; want het blazen van de tirannen is als een vloed tegen een wand.", "Luk 1:37": "Want geen ding zal bij God onmogelijk zijn.", "2 Kon 7:6": "Want de Heere had het leger van de Syriërs een geluid van wagens laten horen, en een geluid van paarden, het geluid van een groot leger; zodat zij tegen elkaar zeiden: Zie, de koning van Israël heeft tegen ons de koningen van de Hethieten en de koningen van de Egyptenaren gehuurd, om tegen ons op te trekken.", "Ps 46:8": "De HEERE van de heerscharen is met ons; de God van Jakob is ons een Hoog Vertrek. Sela.", "Ps 93:4": "Maar de HEERE in de hoogte is machtiger dan het bruisen van veel water, dan de machtige golven van de zee.", "Richt 7:15": "En het gebeurde, toen Gideon het vertellen van deze droom, en de uitleg ervan, hoorde, dat hij aanbad; en hij keerde terug naar het leger van Israël, en zei: Maak u op, want de HEERE heeft het leger van de Midianieten in uw hand gegeven.", "Ex 14:30": "Zo verloste de HEERE Israël op die dag uit de hand van de Egyptenaren; en Israël zag de Egyptenaren dood aan de oever van de zee.", "Ps 44:7-9": "Want ik vertrouw niet op mijn boog, en mijn zwaard zal mij niet verlossen. Maar U verlost ons van onze tegenstanders, en U maakt onze haters beschaamd. In God roemen wij de hele dag, en Uw Naam zullen wij loven tot in eeuwigheid. Sela.", "Jona 1:7": "Vervolgens zeiden zij, ieder tegen zijn metgezel: Kom, laten we loten werpen, zodat wij mogen weten om wie het gaat dat dit kwaad ons overkomt. Zo wierpen zij loten, en het lot viel op Jona.", "Jes 29:20": "Wanneer de tiran een einde zal hebben, en het met de spotter voorbij zal zijn, en allen die op ongerechtigheid loeren, uitgeroeid zullen zijn;", "2 Sam 19:13": "En tegen Amasa moet u zeggen: Bent u niet mijn gebeente en mijn vlees? God doe mij zo, en meer dan dat, als u niet legeraanvoerder wordt voor mijn aangezicht, alle dagen, in de plaats van Joab.", "2 Kron 20:6": "En hij zei: HEERE, God van onze vaderen, bent U niet de God in de hemel? Ja, U heerst over alle koninkrijken van de heidenvolken; en in Uw hand is kracht en sterkte, zodat niemand tegen U stand kan houden.", "Jes 40:26": "Hef uw ogen op omhoog, en ziet, Wie deze dingen geschapen heeft; Die in getal hun leger voortbrengt; Die ze alle bij naam roept, vanwege de grootheid van Zijn krachten, en omdat Hij sterk van vermogen is; er wordt er niet één gemist.", "Richt 20:23": "En de kinderen van Israël trokken op, en weenden voor het aangezicht van de HEERE tot de avond, en vroegen de HEERE en zeiden: Zal ik weer naderen ten strijde tegen de kinderen van Benjamin, mijn broeder? En de HEERE zei: Trek tegen hem op.", "1 Sam 22:9": "Toen antwoordde Doeg, de Edomiet, die bij de knechten van Saul stond, en zei: Ik zag de zoon van Isaï komen te Nob, naar Achimelech, de zoon van Ahitub;", "Deut 12:16": "Alleen het bloed zult u niet eten; u zult het op de aarde uitgieten als water.", "Gen 49:25": "Van de God van uw vader, Die u zal helpen, en van de Almachtige, Die u zal zegenen, met zegeningen van de hemel van boven, met zegeningen van het afgrond, dat daaronder ligt, met zegeningen van de borsten en van de baarmoeder!", "1 Sam 17:45-47": "David daarentegen zei tegen de Filistijn: U komt naar mij toe met een zwaard, en met een speer, en met een schild; maar ik kom naar u toe in de Naam van de HEERE van de heerscharen, de God van de slagorden van Israël, Die u gehoond hebt. Vandaag zal de HEERE u overleveren in mijn hand, en ik zal u verslaan, en ik zal uw hoofd van u wegnemen, en ik zal de dode lichamen van het leger van de Filistijnen vandaag aan de vogels van de hemel en aan de dieren van het veld geven; en heel de aarde zal weten dat Israël een God heeft. En heel deze verzameling zal weten dat de HEERE niet door zwaard of door speer verlost; want de strijd is van de HEERE, Die zal u in onze hand geven.", "Ps 16:11": "U zult mij het pad van het leven bekendmaken; overvloed van vreugde is bij Uw aangezicht; liefelijkheden zijn in Uw rechterhand, eeuwig.", "Job 14:15": "Dat U zou roepen, en ik U zou antwoorden, dat U naar het werk van Uw handen zou verlangen.", "Ps 27:1": "Een psalm van David. De HEERE is mijn Licht en mijn Heil, voor wie zou ik vrezen? De HEERE is de kracht van mijn leven, voor wie zou ik bang zijn?", "1 Kor 16:2": "Op elke eerste dag van de week legt ieder van u iets bij zichzelf weg en verzamelt een schat, naardat hij welvaren verkregen heeft, opdat de verzamelingen niet eerst gebeuren wanneer ik gekomen zal zijn.", "Ps 18:2-4": "Hij zei dan: Ik zal U hartelijk liefhebben, HEERE, mijn Sterkte! De HEERE is mijn Steenrots, en mijn Burg, en mijn Uithelper; mijn God, mijn Rots, op Wie ik vertrouw; mijn Schild, en de Hoorn van mijn heil, mijn Hoog Vertrek. Ik riep de HEERE aan, die te prijzen is, en werd verlost van mijn vijanden.", "Ef 1:20": "Die Hij gewrocht heeft in Christus, toen Hij Hem uit de doden heeft opgewekt; en Hem heeft gezet aan Zijn rechterhand in de hemel;", "Gen 26:5": "omdat Abraham Mijn stem gehoorzaam is geweest, en Mijn bevel heeft onderhouden, Mijn geboden, Mijn inzettingen en Mijn wetten.", "Ps 16:5": "De HEERE is het deel van mijn erfenis en van mijn beker; U onderhoudt mijn lot.", "1 Petr 1:5": "Die in de kracht van God bewaard wordt door het geloof tot de zaligheid, die klaarligt om geopenbaard te worden in de laatste tijd.", "Jes 59:1": "Zie, de hand van de HEERE is niet te kort om te kunnen verlossen, en Zijn oor is niet zwaar geworden om te kunnen horen.", "1 Sam 2:7": "De HEERE maakt arm en maakt rijk; Hij vernedert, ook verhoogt Hij.", "1 Kron 9:39": "En Ner verwekte Kis, en Kis verwekte Saul, en Saul verwekte Jonathan, en Malchi-sua, en Abinadab, en Esbaal.", "Gen 26:4": "En Ik zal uw nageslacht vermenigvuldigen als de sterren van de hemel, en zal aan uw nageslacht al deze landen geven; en in uw nageslacht zullen alle volken van de aarde gezegend worden,", "Gen 50:20": "U wel, u hebt kwaad tegen mij gedacht; doch God heeft dat ten goede gedacht; opdat Hij deed, zoals het op deze dag is, om een groot volk in het leven te behouden.", "2 Sam 7:28": "Nu dan, Heere HEERE! U bent die God, en Uw woorden zullen waarheid zijn, en U hebt dit goede tot Uw knecht gesproken.", "Amos 4:7-12": "Daarbij heb Ik ook de regen van u geweerd, toen er nog drie maanden waren tot de oogst, en heb doen regenen over de ene stad, maar over de andere stad niet doen regenen; het ene stuk land werd beregend, maar het andere stuk land, waar het niet op regende, verdorde. En twee, drie steden trokken rond naar één stad, opdat zij water zouden kunnen drinken, maar werden niet verzadigd; toch hebt u zich niet bekeerd tot Mij, spreekt de HEERE. Ik heb u geslagen met brandkoren en met honingdauw; de veelheid van uw hoven, en uw wijngaarden, en uw vijgenbomen, en uw olijfbomen at de rups op; toch hebt u zich niet bekeerd tot Mij, spreekt de HEERE.", "1 Kon 19:19": "Zo ging hij vandaar, en vond Elisa, de zoon van Safat; die was aan het ploegen met twaalf span runderen voor zich uit, en hij zelf was bij het twaalfde; en Elia ging naar hem toe, en wierp zijn mantel op hem.", "Deut 13:18": "wanneer u de stem van de HEERE, uw God, gehoorzaam zult zijn, om al Zijn geboden te houden, die ik u heden gebied, om te doen wat recht is in de ogen van de HEERE, uw God.", "Pred 2:26": "Want Hij geeft wijsheid, kennis en vreugde aan de mens die goed is voor Zijn aangezicht; maar aan de zondaar geeft Hij de bezigheid om te verzamelen en te vergaderen, opdat Hij het geeft aan wie goed is voor Gods aangezicht. Dit is ook ijdelheid en kwelling van de geest.", "Ps 89:27": "Hij zal Mij noemen: Gij zijt mijn Vader! mijn God, en de Rotssteen van mijn heil!", "1 Sam 6:3": "Zij dan zeiden: Als u de ark van de God van Israël wegzendt, zend haar niet leeg weg, maar geef Hem in elk geval een schuldoffer terug; dan zult u genezen worden, en aan u zal bekend worden waarom Zijn hand niet van u afwijkt.", "Ps 18:30": "Want met U loop ik door een bende, en met mijn God spring ik over een muur.", "Ps 55:24": "Maar U, o God! zult hen doen neerdalen in de put van het verderf; de mannen van het bloed en het bedrog zullen hun dagen niet tot de helft brengen; ik, daarentegen, zal op U vertrouwen.", "Ps 116:7": "Mijn ziel, keer terug tot uw rust, want de HEERE heeft u goedgedaan.", "Jer 16:19": "O HEERE! U bent mijn Sterkte, en mijn Sterkheid, en mijn Toevlucht ten dage van de benauwdheid; tot U zullen de heidenen komen van de einden van de aarde, en zeggen: Zeker hebben onze vaders leugen erfelijk bezeten, en ijdelheid, waarin toch niets was, dat nut deed.", "Gen 48:21": "Daarna zei Israël tegen Jozef: Zie, ik sterf; maar God zal met u zijn, en Hij zal u terugbrengen naar het land van uw vaders.", "Fil 3:5": "Besneden op de achtste dag, uit het geslacht van Israël, van de stam van Benjamin, een Hebreeër uit de Hebreeën, wat de wet betreft een Farizeeër;", "Gen 9:4": "Maar het vlees met zijn ziel, dat is zijn bloed, zult u niet eten.", "2 Kron 20:12": "O, onze God, zult U geen recht over hen oefenen? Want in ons is geen kracht tegen deze grote menigte, die tegen ons optrekt, en wij weten niet wat wij moeten doen; maar onze ogen zijn op U gericht.", "Lev 7:27": "Elke ziel die enig bloed eet, die ziel zal uit haar volk uitgeroeid worden.", "Ps 111:6": "Caph. Hij heeft de kracht van Zijn werken aan Zijn volk bekendgemaakt; Lamed. door hun de erve van de heidenen te geven.", "Amos 9:5": "Want de Heere HEERE van de heerscharen is het, Die het land aanraakt, zodat het versmelt, en allen die daarin wonen treuren; en heel het land stijgt op als een rivier, en wordt verdronken als door de rivier van Egypte.", "Job 5:6-11": "Want uit het stof komt het verdriet niet voort, en de moeite spruit niet uit de aarde; Maar de mens wordt tot moeite geboren; zoals de vonken van het vuur zich verheffen om te vliegen. Doch ik zou God zoeken, en tot God mijn aanspraak richten;", "Ps 6:9": "Wijk van mij, alle werkers van de ongerechtigheid; want de HEERE heeft de stem van mijn geween gehoord.", "2 Kron 13:11": "En zij steken voor de HEERE brandoffers aan, op elke morgen en op elke avond, ook reukwerk van welriekende specerijen, met de bereiding van het brood op de reine tafel, en de gouden kandelaar en zijn lampen, om die elke avond te laten branden; want wij nemen de wacht van de HEERE, onze God, waar; maar u hebt Hem verlaten.", "2 Kron 25:8": "Maar als u toch gaat, doe het dan, wees sterk voor de strijd; God zal u laten vallen voor de vijand; want in God is kracht om te helpen en om te doen vallen.", "Job 12:23": "Hij vermenigvuldigt de volken, en verdelgt ze; Hij breidt de volken uit, en leidt ze.", "1 Kron 18:5": "En de Syriërs van Damaskus kwamen om Hadar-ezer, de koning van Zoba, te helpen; maar David sloeg van de Syriërs tweeëntwintigduizend man.", "2 Kron 31:10": "En Azarja, de hoofdpriester, van het huis van Zadok, sprak tot hem en zei: Sinds men deze heffing is begonnen tot het huis van de HEERE te brengen, is er te eten geweest en genoeg om verzadigd te worden, ja, tot overvloed toe; want de HEERE heeft Zijn volk gezegend, zodat deze grote hoeveelheid overgebleven is.", "Richt 7:19-23": "Zo kwam Gideon, en honderd mannen die met hem waren, aan het uiterste van het leger, aan het begin van de middelste nachtwaak, net toen zij de wachters gesteld hadden; en zij bliezen op de bazuinen, en sloegen de kruiken die in hun hand waren stuk. Zo bliezen de drie groepen op de bazuinen, en braken de kruiken; en zij hielden met de linkerhand de fakkels vast, en met hun rechterhand de bazuinen om te blazen; en zij riepen: Het zwaard van de HEERE, en van Gideon! En zij bleven staan, ieder op zijn plaats, rondom het leger. Toen liep het hele leger uiteen, en zij schreeuwden en vluchtten.", "Job 19:25-27": "Want ik weet: mijn Verlosser leeft, en Hij zal als de laatste over het stof opstaan; En als zij na mijn huid dit doorknaagd zullen hebben, zal ik uit mijn vlees God aanschouwen; Aan Wie ik voor mij aanschouwen zal, en mijn ogen zien zullen, en niet een vreemde; mijn nieren verlangen zeer in mijn schoot.", "Jes 10:28": "Hij komt te Ajath, hij trekt door Migron; te Michmas legt hij zijn gereedschap af.", "Jer 41:8": "Doch onder hen werden tien mannen gevonden, die tegen Ismaël zeiden: Dood ons niet, want wij hebben verborgen schatten in het veld, van tarwe, en gerst, en olie, en honing. Zo liet hij af, en doodde hen niet te midden van hun broeders.", "Ex 19:18": "En de hele berg Sinaï rookte, omdat de HEERE daarop neerkwam in vuur; en zijn rook steeg op, als de rook van een oven; en de hele berg beefde erg.", "Joz 7:19": "Toen zei Jozua tegen Achan: Mijn zoon! Geef toch de HEERE, de God van Israël, de eer, en leg voor Hem een belijdenis af; en vertel mij toch wat u gedaan hebt, verberg het niet voor mij.", "2 Kor 4:16-18": "Daarom worden wij niet moedeloos; maar hoewel onze uitwendige mens verdorven wordt, wordt toch de inwendige vernieuwd van dag tot dag. Want onze lichte verdrukking, die zeer haast voorbijgaat, brengt ons een geheel bijzonder groot en eeuwig gewicht van heerlijkheid; Omdat wij niet letten op de dingen die men ziet, maar op de dingen die men niet ziet; want de dingen die men ziet, zijn tijdelijk, maar de dingen die men niet ziet, zijn eeuwig.", "Lev 3:17": "Dit is een eeuwige inzetting voor uw geslachten, in al uw woningen: geen vet en geen bloed zult u eten.", "Ps 130:5": "Ik verwacht de HEERE; mijn ziel verwacht, en ik hoop op Zijn Woord.", "1 Sam 10:21": "Toen hij de stam van Benjamin liet aantreden naar zijn geslachten, werd het geslacht van Matri aangewezen; en Saul, de zoon van Kis, werd aangewezen. En zij zochten hem, maar hij werd niet gevonden.", "Ex 15:3": "De HEERE is een krijgsman; HEERE is Zijn Naam!", "Richt 1:1": "En het gebeurde na de dood van Jozua, dat de Israëlieten de HEERE vroegen: Wie zal onder ons het eerst optrekken naar de Kanaänieten, om tegen hen te strijden?", "Job 29:20": "Mijn heerlijkheid was nieuw bij mij, en mijn boog vernieuwde zich in mijn hand.", "Deut 8:4": "Uw kleding is aan u niet versleten, en uw voet is niet gezwollen, deze veertig jaar.", "1 Sam 2:10": "Zij die met de HEERE twisten, zullen verpletterd worden; Hij zal in de hemel over hen donderen; de HEERE zal de einden van de aarde richten, en zal Zijn Koning sterkte geven, en de hoorn van Zijn Gezalfde verhogen.", "Ps 124:8": "Onze hulp is in de Naam van de HEERE, Die hemel en aarde gemaakt heeft.", "1 Kor 16:22": "Als iemand de Heere Jezus Christus niet liefheeft, laat die een vervloeking zijn; Maran-atha!", "Ps 42:7": "O mijn God! Mijn ziel buigt zich neer in mij, daarom denk ik aan U vanuit het land van de Jordaan en de Hermon, vanuit het kleine gebergte.", "2 Sam 1:4": "Verder zei David tegen hem: Wat is er gebeurd? Vertel het mij toch. En hij zei dat het volk uit de strijd gevlucht was, en dat er ook velen van het volk gevallen en gestorven waren, en dat ook Saul en zijn zoon Jonathan dood waren.", "Jer 14:9": "Waarom zou U zijn als een verschrikte man, als een held die niet kan verlossen? U bent toch in het midden van ons, o HEERE! En wij zijn naar Uw Naam genoemd; verlaat ons niet.", "Jer 31:18": "Ik heb wel gehoord dat Efraïm zich beklaagt, en zegt: U hebt mij getuchtigd, en ik ben getuchtigd zoals een ongewend kalf. Bekeer mij, dan zal ik bekeerd zijn, want U bent de HEERE, mijn God!", "Hab 3:9-11": "De naakte grond werd ontbloot door Uw boog, om de eden, aan de stammen gedaan door het woord. Sela. U hebt de rivieren van de aarde gekloofd. De bergen zagen U, en leden smart; de waterstroom ging erdoorheen, de afgrond gaf zijn stem, hij hief zijn handen op in de hoogte. De zon en de maan stonden stil in hun woning; met het licht gingen Uw pijlen daarheen, met glans Uw bliksemende speer.", "Hebr 11:14": "Want wie zulke dingen zeggen, laten daarmee duidelijk zien dat zij een vaderland zoeken.", "2 Sam 7:2": "Dat de koning zei tegen de profeet Nathan: Zie toch, ik woon in een huis van cederhout, en de ark van God woont in het midden van de tentkleden.", "Ps 56:12": "Ik vertrouw op God, ik zal niet vrezen; wat zou de mens mij doen?", "Jes 40:28": "Weet u het niet? Hebt u niet gehoord, dat de eeuwige God, de HEERE, de Schepper van de einden van de aarde, noch moede noch mat wordt? Er is geen doorgronding van Zijn verstand.", "Ps 148:8": "Vuur en hagel, sneeuw en damp; stormwind, die Zijn woord doet!", "Richt 5:2": "Looft de HEERE, om het wreken van de wraken in Israël, om dat het volk zich gewillig heeft aangeboden.", "Job 23:13": "Maar is Hij tegen iemand, wie zal Hem dan afkeren? Wat Zijn ziel begeert, dat zal Hij doen.", "1 Sam 7:1": "Toen kwamen de mannen van Kirjath-jearim, en haalden de ark van de HEERE op, en zij brachten haar in het huis van Abinadab, op de heuvel; en zij heiligden zijn zoon Eleazar, om de ark van de HEERE te bewaren.", "Richt 1:28": "En het gebeurde, toen Israël sterk werd, dat het de Kanaänieten aan zich dienstbaar maakte; maar het verdreef hen niet volledig.", "Ps 128:2-6": "Want u zult eten van het werk van uw handen; gelukkig zult u zijn, en het zal u goed gaan. Uw vrouw zal zijn als een vruchtbare wijnstok aan de zijkant van uw huis; uw kinderen als olijfplanten rondom uw tafel. Zie, zo zal die man zeker gezegend worden, die de HEERE vreest.", "Ps 144:5": "Buig Uw hemelen, HEERE, en daal neer; raak de bergen aan, zodat ze roken.", "Jes 19:1": "De last van Egypte. Zie, de HEERE rijdt op een snelle wolk, en Hij zal in Egypte komen; en de afgoden van Egypte zullen bewogen worden vanwege Zijn aangezicht, en het hart van de Egyptenaren zal smelten in hun binnenste.", "Neh 4:16-22": "En het gebeurde van die dag af, dat de helft van mijn knechten bezig was met het werk, en de andere helft van hen de speren, de schilden, de bogen en de pantsers vasthield; en de aanvoerders stonden achter het hele huis van Juda. Zij die aan de muur bouwden en zij die de lasten droegen, en zij die inlaadden, waren ieder met de ene hand bezig met het werk, en met de andere hielden zij het wapen vast. En de bouwers hadden ieder zijn zwaard aan zijn heup gegord en bouwden; en hij die op de bazuin blies, was bij mij.", "Klaagl 3:24-32": "Cheth. De HEERE is mijn deel, zegt mijn ziel, daarom zal ik op Hem hopen. Teth. De HEERE is goed voor hen die Hem verwachten, voor de ziel die Hem zoekt. Teth. Het is goed dat men hoopt, en stil is op het heil van de HEERE.", "Ex 15:6-8": "O HEERE! Uw rechterhand is verheerlijkt in macht; Uw rechterhand, o HEERE, heeft de vijand verbroken! En door Uw grote hoogheid hebt U hen die tegen U opstonden, omgeworpen; U hebt Uw brandende toorn losgelaten, die hen verteerd heeft als een stoppel. En door het geblaas van Uw neus zijn de wateren opgehoopt; de stromen hebben overeind gestaan als een hoop; de afgronden zijn stijf geworden in het hart van de zee.", "Hos 2:21": "En de aarde zal het koren verhoren, alsook de nieuwe wijn en de olie; en die zullen Jizreël verhoren.", "1 Kron 13:12": "En David vreesde de HEERE op die dag, en zei: Hoe zal ik de ark van God tot mij brengen?", "1 Sam 26:5": "En David maakte zich op en kwam bij de plaats waar Saul zich gelegerd had, en David bekeek de plaats waar Saul lag, met Abner, de zoon van Ner, zijn legeraanvoerder. En Saul lag in de wagenburg, en het volk was rondom hem gelegerd.", "Deut 30:15-20": "Zie, ik heb u heden voorgesteld het leven en het goede, en de dood en het kwade. Want ik gebied u heden, de HEERE, uw God, lief te hebben, in Zijn wegen te wandelen, en Zijn geboden, en Zijn inzettingen, en Zijn rechten te houden, opdat u leeft en meer wordt, en de HEERE, uw God, u zegent in het land waar u naartoe gaat, om dat te erven. Maar als uw hart zich zal afwenden, en u niet horen zult, en u gedreven wordt om u voor andere goden te buigen, en die te dienen;", "Jes 13:4": "Er is een ruisende stem op de bergen, gelijk aan een groot volk; een stem van gedruis van de koninkrijken, van de verzamelde heidenvolken; de HEERE van de heerscharen monstert het krijgsleger.", "Ruth 1:6": "Toen maakte zij zich klaar met haar schoondochters, en keerde terug uit de velden van Moab; want zij had in het land van Moab gehoord dat de HEERE naar Zijn volk had omgezien en hun brood gaf.", "Ex 17:14": "Toen zei de HEERE tegen Mozes: Schrijf dit ter gedachtenis in een boek, en prent het in de oren van Jozua, dat Ik de gedachtenis van Amalek geheel zal uitwissen van onder de hemel.", "Richt 11:31": "dan zal het zo zijn, dat wat uit de deur van mijn huis mij tegemoet komt, wanneer ik in vrede terugkeer van de kinderen van Ammon, dat zal van de HEERE zijn, en ik zal het offeren als brandoffer.", "Richt 6:36-40": "En Gideon zei tegen God: Als U Israël door mijn hand zult verlossen, zoals U gesproken hebt, zie, ik zal een wollen vlies op de dorsvloer leggen; als er dauw op het vlies alleen zal zijn, en droogte op de hele aarde, dan zal ik weten dat U Israël door mijn hand zult verlossen, zoals U gesproken hebt. En het gebeurde zo; want hij stond de volgende morgen vroeg op, en kneep het vlies uit, en hij wrong de dauw uit het vlies, een schaal vol water.", "Gen 9:1-3": "En God zegende Noach en zijn zonen, en Hij zei tegen hen: Wees vruchtbaar en word talrijk, en vervul de aarde! En vrees en angst voor u zal er zijn over al het gedierte van de aarde, en over al het gevogelte van de hemel; over alles wat zich op de aardbodem beweegt, en over alle vissen van de zee; zij zijn in uw hand overgegeven. Alles wat zich beweegt, dat leeft, zal u tot voedsel zijn; Ik heb het u allemaal gegeven, zoals het groene kruid.", "2 Kron 14:15": "En zij sloegen ook de tenten van het vee, en voerden schapen in menigte weg, en kamelen; en kwamen weer naar Jeruzalem.", "Amos 9:6": "Die Zijn bovenzalen in de hemel bouwt, en Zijn gewelf heeft Hij op de aarde gegrondvest; Die de wateren van de zee roept, en giet ze uit over de aardbodem; HEERE is Zijn Naam.", "2 Kor 13:4": "Want al is Hij gekruisigd door zwakheid, toch leeft Hij door de kracht van God. Want ook wij zijn zwak in Hem, maar zullen met Hem leven door de kracht van God, tot u.", "Deut 28:2-13": "En al deze zegeningen zullen over u komen, en u aantreffen, wanneer u naar de stem van de HEERE, uw God, luistert. Gezegend zult u zijn in de stad, en gezegend zult u zijn op het veld. Gezegend zal zijn de vrucht van uw schoot, en de vrucht van uw land, en de vrucht van uw vee, de aanwas van uw koeien, en de kudden van uw kleinvee.", "Zach 9:14": "En de HEERE zal over hen verschijnen, en Zijn pijlen zullen uitgaan als een bliksem; en de Heere HEERE zal met de bazuin blazen, en Hij zal voorttrekken met stormen uit het zuiden.", "Openb 19:6": "En ik hoorde als een stem van een grote menigte, en als een stem van veel water, en als een stem van sterke donderslagen, die zei: Halleluja, want de Heere, de almachtige God, heeft als Koning geheerst.", "Ps 146:7-9": "Die de verdrukte recht doet, Die de hongerige brood geeft; de HEERE maakt de gevangenen los. De HEERE opent de ogen van de blinden; de HEERE richt de gebogenen op; de HEERE heeft de rechtvaardigen lief. De HEERE bewaart de vreemdelingen; Hij houdt de wees en de weduwe staande; maar de weg van de goddelozen keert Hij om.", "Hos 2:20": "En het zal op die dag gebeuren, dat Ik verhoren zal, spreekt de Heere; Ik zal de hemel verhoren, en die zal de aarde verhoren.", "Jer 22:15": "Zou u regeren, omdat u zich omringt met ceder? Heeft uw vader niet gegeten en gedronken, en recht en gerechtigheid gedaan, en ging het hem toen niet goed?", "Hab 1:12": "Bent U niet van ouds af de HEERE, mijn God, mijn Heilige? Wij zullen niet sterven; o HEERE! Tot een oordeel hebt U hem gesteld, en o Rots! Om te straffen hebt U hem gegrondvest.", "Jes 65:13": "Daarom zegt de Heere HEERE zo: Zie, Mijn knechten zullen eten, maar u zult hongeren; zie, Mijn knechten zullen drinken, maar u zult dorsten; zie, Mijn knechten zullen blij zijn, maar u zult beschaamd zijn.", "Ps 140:8": "HEERE, Heere, sterkte van mijn heil! U hebt mijn hoofd bedekt op de dag van de wapening.", "Joz 10:9-14": "Zo kwam Jozua snel tot hen; de hele nacht door was hij van Gilgal opgetrokken. En de HEERE bracht hen in verwarring voor het aangezicht van Israël; en hij sloeg hen met een grote slag te Gibeon, en vervolgde hen op de weg waar men naar Beth-horon opgaat, en sloeg hen tot Azeka en tot Makkeda toe. Het gebeurde nu, toen zij voor het aangezicht van Israël vluchtten, terwijl ze in de afdaling van Beth-horon waren, dat de HEERE grote stenen op hen wierp van de hemel, tot Azeka toe, zodat zij stierven; er waren er meer die van de hagelstenen stierven, dan die de kinderen van Israël met het zwaard doodden.", "2 Kor 6:1": "En wij, als medearbeiders, bidden u ook dat u de genade van God niet tevergeefs mag hebben ontvangen.", "Ps 119:42": "Opdat ik mijn smader wat heb te antwoorden, want ik vertrouw op Uw woord.", "1 Sam 13:15": "Toen stond Samuël op en ging van Gilgal naar Gibea-benjamins; en Saul telde het volk dat bij hem gevonden werd, ongeveer zeshonderd man.", "1 Sam 4:6": "Toen de Filistijnen het geluid van dat gejuich hoorden, zeiden zij: Wat betekent dit grote gejuich in het leger van de Hebreeën? Toen begrepen zij dat de ark van de HEERE in het leger gekomen was.", "Gen 24:27": "en hij zei: Geloofd zij de HEERE, de God van mijn heer Abraham, Die Zijn weldadigheid en trouw niet onthouden heeft aan mijn heer; wat mij betreft, de HEERE heeft mij op deze weg geleid, naar het huis van de broers van mijn heer.", "Neh 9:25": "En zij hebben vaste steden en een vet land ingenomen, en erfelijk bezeten, huizen, vol van allerlei goed, uitgehouwen waterputten, wijngaarden, olijfgaarden en fruitbomen, in overvloed; en zij hebben gegeten, en zijn verzadigd en vet geworden, en hebben in weelde geleefd, door Uw grote goedheid.", "Ps 78:52-55": "En Hij voerde Zijn volk als schapen, en leidde hen, als een kudde, door de woestijn. Ja, Hij leidde hen zeker, zodat zij niet vreesden; want de zee had hun vijanden overdekt. En Hij bracht hen tot het gebied van Zijn heiligheid, tot deze berg, die Zijn rechterhand verkregen heeft.", "2 Sam 14:11": "En zij zei: De koning gedenkt toch aan de HEERE, uw God, dat de bloedwrekers niet te talrijk worden om te verderven, zodat zij mijn zoon niet ombrengen. Toen zei hij: Zo waarachtig als de HEERE leeft, er zal geen haar van uw zoon op de aarde vallen!", "Jes 48:13": "Ook heeft Mijn hand de aarde gegrond, en Mijn rechterhand heeft de hemelen met de palm afgemeten; wanneer Ik ze roep, staan zij daar samen.", "Jes 51:10": "Bent U het niet, Die de zee, het water van het grote afgrond, droog gemaakt hebt? Die de diepten van de zee gemaakt hebt tot een weg, opdat de verlosten daardoor gingen?", "Jer 10:13": "Als Hij Zijn stem geeft, zo is er een gedruis van water in de hemel, en Hij doet de dampen opklimmen van het einde van de aarde; Hij maakt de bliksems met de regen, en doet de wind voortkomen uit Zijn schatkamers.", "Matt 24:6": "En u zult horen van oorlogen en geruchten van oorlogen; kijk uit, wordt niet verschrikt; want al die dingen moeten gebeuren, maar het einde is er nog niet.", "Ps 6:10": "De HEERE heeft mijn smeking gehoord; de HEERE zal mijn gebed aannemen.", "Jes 14:24": "De HEERE van de heerscharen heeft gezworen: Voorzeker, zoals Ik gedacht heb, zo zal het gebeuren, en zoals Ik beraadslaagd heb, zo zal het bestaan!", "Amos 4:13": "Want zie, Die de bergen vormt, en de wind schept, en de mens bekendmaakt wat Zijn gedachte is, Die de dageraad duisternis maakt, en op de hoogten van de aarde treedt, HEERE, God van de heerscharen, is Zijn Naam.", "Gen 24:7": "De HEERE, de God van de hemel, Die mij uit het huis van mijn vader en uit het land van mijn familie genomen heeft, en Die tot mij gesproken heeft, en Die mij gezworen heeft en zei: Aan uw nageslacht zal Ik dit land geven! Die Zelf zal Zijn Engel voor uw aangezicht zenden, zodat u voor mijn zoon van daar een vrouw neemt.", "1 Sam 18:7-21": "En de vrouwen, spelend, antwoordden elkaar en zeiden: Saul heeft zijn duizenden verslagen, maar David zijn tienduizenden! Toen ontstak Saul in grote woede, en dat woord was kwaad in zijn ogen, en hij zei: Zij hebben David tienduizend gegeven, doch mij hebben zij maar duizend gegeven; en zeker zal het koninkrijk nog voor hem zijn. En Saul had het oog op David, van die dag af en voortaan.", "2 Sam 18:3": "Maar het volk zei: U mag niet meetrekken; want als wij op de vlucht slaan, zullen zij zich niet om ons bekommeren; ja, al stierf de helft van ons, zij zullen zich niet om ons bekommeren; maar u bent nu als tienduizend van ons waard. Zo zal het nu beter zijn, dat u ons vanuit de stad te hulp komt.", "Jer 10:23": "Ik weet, o HEERE! dat bij de mens zijn weg niet is; het is niet bij een man die wandelt, dat hij zijn gang oordeelt.", "Ps 69:20": "U weet mijn smaad, en mijn schaamte, en mijn schande; al mijn belagers zijn voor U.", "Ps 71:7": "Ik ben voor velen als een wonder geweest; doch Gij zijt mijn sterke Toevlucht.", "Ps 121:2": "Mijn hulp is van de HEERE, Die hemel en aarde gemaakt heeft.", "1 Sam 12:2": "En nu, zie, daar trekt de koning voor uw ogen heen, en ik ben oud en grijs geworden, en zie, mijn zonen zijn bij u; en ik heb voor uw ogen gewandeld van mijn jeugd af tot vandaag toe.", "Luk 12:6": "Worden niet vijf musjes verkocht voor twee penningen? En niet één van die is bij God vergeten.", "Ef 2:11": "Denk daarom eraan, dat u, die eertijds heidenen was in het vlees, en die voorhuid genoemd werd door hen die genoemd worden besnijdenis in het vlees, wat met handen gebeurt;", "Jer 10:12": "Die de aarde gemaakt heeft door Zijn kracht, Die de wereld bereid heeft door Zijn wijsheid, en de hemel uitgebreid heeft door Zijn verstand.", "Jes 61:9": "En hun nageslacht zal onder de heidenvolken bekend worden, en hun nakomelingen te midden van de volken; allen die hen zien zullen, zullen hen erkennen, dat zij een nageslacht zijn, dat de HEERE gezegend heeft.", "Lev 27:29": "Alles wat verboden is, dat van de mensen verboden zal zijn, zal niet afgekocht worden; het zal zeker gedood worden.", "Ps 115:1-3": "Niet ons, o HEERE, niet ons, maar geef aan Uw Naam eer, om Uw goedertierenheid, om Uw waarheid. Waarom zouden de heidenen zeggen: Waar is nu hun God? Onze God is toch in de hemel, Hij doet al wat Hem behaagt.", "Ps 66:7": "Hij heerst eeuwig met Zijn macht; Zijn ogen houden wacht over de heidenvolken; laat de afvalligen niet verhoogd worden. Sela.", "1 Kron 5:22": "Want er vielen veel gewonden, omdat de strijd van God was; en zij woonden in hun plaats, totdat zij gevankelijk werden weggevoerd.", "Rom 10:2": "Want ik geef hun getuigenis, dat zij een ijver voor God hebben, maar niet met verstand.", "Ps 61:3": "Van het einde van het land roep ik tot U als mijn hart overstelpt is; leid mij op een rotssteen, die mij te hoog zou zijn.", "Ps 46:6": "God is in het midden van haar, zij zal niet wankelen; God zal haar helpen bij het aanbreken van de morgenstond.", "1 Sam 14:8-12": "Jonathan nu zei: Zie, wij zullen naar die mannen oversteken, en wij zullen ons aan hen laten zien. Als zij zo tegen ons zeggen: Blijf staan, totdat wij bij u komen, dan zullen wij op onze plaats blijven staan en niet naar hen opklimmen. Maar zeggen zij zo: Klim naar ons op, dan zullen wij opklimmen, want de HEERE heeft hen in onze hand gegeven; en dit zal ons een teken zijn.", "1 Tim 4:10": "Want hiervoor spannen wij ons in en worden wij versmaad, omdat wij onze hoop gevestigd hebben op de levende God, Die een Redder is van alle mensen, maar vooral van de gelovigen.", "Jes 40:12": "Wie heeft het water met Zijn vuist gemeten, en van de hemel met de span de maat genomen, en heeft met een drieling het stof van de aarde begrepen, en de bergen gewogen in een waag, en de heuvels in een weegschaal?", "1 Kon 2:3": "En neem de wacht van de HEERE, uw God, in acht, om te wandelen in Zijn wegen, om Zijn inzettingen te onderhouden, en Zijn geboden, en Zijn rechten, en Zijn getuigenissen, zoals geschreven is in de wet van Mozes; opdat u verstandig handelt in alles wat u doet, en overal waar u zich heen wendt;", "Ps 147:13": "Want Hij maakt de grendels van uw poorten sterk; Hij zegent uw kinderen binnen in u.", "Joz 11:14": "En alle buit van deze steden, en het vee, roofden de kinderen van Israël voor zichzelf; alleen sloegen zij alle mensen met de scherpte van het zwaard, totdat zij hen vernietigden; zij lieten niemand overblijven die adem had.", "Jes 46:10": "Die vanaf het begin aan verkondigt het einde, en van oudsher af die dingen, die nog niet gebeurd zijn; Die zegt: Mijn raad zal standhouden, en Ik zal al Mijn welbehagen doen.", "Nahum 1:3-6": "De HEERE is geduldig, maar van grote kracht, en Hij houdt de schuldige zeker niet onschuldig. De weg van de HEERE is in wervelwind en in storm, en de wolken zijn het stof van Zijn voeten. Hij bestraft de zee, en maakt haar droog, en Hij droogt alle rivieren uit; Basan en Karmel kwijnen weg, ook kwijnt de bloem van Libanon weg. De bergen beven voor Hem, en de heuvels smelten; en de aarde licht zich op voor Zijn aangezicht, ja de wereld, en allen die daarin wonen.", "Ef 1:19": "En wat de uitnemende grootheid is van Zijn kracht aan ons, die geloven, naar de werking van de sterkte van Zijn macht,", "Hebr 10:34": "Want u hebt ook medelijden gehad met mij in mijn boeien, en de beroving van uw bezittingen met blijdschap aanvaard, wetende dat u voor uzelf een beter en blijvend bezit hebt in de hemelen.", "Hebr 12:26": "Wiens stem toen de aarde deed beven; maar nu heeft Hij verkondigd en gezegd: Nog eenmaal zal Ik niet alleen de aarde doen beven, maar ook de hemel.", "Deut 26:19": "opdat Hij u zo boven alle volken die Hij gemaakt heeft, hoog zet, tot lof, en tot een naam, en tot heerlijkheid; en opdat u een heilig volk bent voor de HEERE, uw God, zoals Hij gesproken heeft.", "Luk 18:27": "En Hij zei: De dingen die onmogelijk zijn bij de mensen, zijn mogelijk bij God.", "Job 11:10": "Als Hij voorbijgaat, om af te snijden of te vergaderen, wie zal Hem dan tegenhouden?", "Dan 5:6": "Toen veranderde de gezichtskleur van de koning, en zijn gedachten verschrikten hem; en
