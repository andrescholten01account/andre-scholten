, van de kamelen tot de ezels toe.","4":"Dit verkondigde Saul aan het volk, en hij telde hen te Telaïm, tweehonderdduizend man van het voetvolk, en tienduizend man van Juda.","5":"Toen Saul tot aan de stad Amalek kwam, legde hij een hinderlaag in het dal.","6":"En Saul liet de Kenieten zeggen: Ga weg, wijk, trek weg uit het midden van de Amalekieten, opdat ik u niet met hen wegruim; want u hebt barmhartigheid gedaan aan al de kinderen van Israël, toen zij uit Egypte optrokken. Zo weken de Kenieten uit het midden van de Amalekieten.","7":"Toen sloeg Saul de Amalekieten van Havila af, tot daar waar u komt bij Sur, dat voor Egypte ligt.","8":"En hij ving Agag, de koning van de Amalekieten, levend; maar al het volk verbande hij door de scherpte van het zwaard.","9":"Doch Saul en het hele volk verschoonden Agag, en de beste schapen, en runderen, en het naastbeste, en de lammeren, en alles wat goed was, en zij wilden dat niet verbannen; maar alles wat minderwaardig was en waardeloos, dat verbanden zij.","10":"Toen kwam het woord van de HEERE tot Samuël:","11":"Het berouwt Mij dat Ik Saul tot koning gemaakt heb, omdat hij zich van Mij afgekeerd heeft, en Mijn woorden niet volbracht heeft. Toen ontstak Samuël in toorn, en hij riep tot de HEERE de hele nacht.","12":"Daarna maakte Samuël zich ‘s morgens vroeg op, Saul tegemoet; en het werd Samuël bericht: Saul is te Karmel gekomen, en zie, hij heeft voor zichzelf een gedenkteken opgericht; daarna is hij omgetrokken, en verdergegaan, en naar Gilgal afgedaald.","13":"Samuël nu kwam bij Saul, en Saul zei tegen hem: Gezegend bent u door de HEERE! Ik heb het woord van de HEERE volbracht.","14":"Toen zei Samuël: Wat is dan dit voor een geluid van schapen in mijn oren, en een geluid van runderen dat ik hoor?","15":"Saul nu zei: Ze hebben ze van de Amalekieten gebracht, want het volk heeft de beste schapen en runderen verschoond, om ze aan de HEERE, uw God, te offeren; maar de rest hebben wij verbannen.","16":"Toen zei Samuël tegen Saul: Houd op, dan zal ik u vertellen wat de HEERE vannacht tot mij gesproken heeft. Hij dan zei tegen hem: Spreek.","17":"En Samuël zei: Is het niet zo, toen u klein was in uw eigen ogen, dat u het hoofd van de stammen van Israël geworden bent, en dat de HEERE u tot koning over Israël gezalfd heeft?","18":"En de HEERE heeft u op weg gezonden, en gezegd: Ga heen en verban de zondaars, de Amalekieten, en strijd tegen hen, totdat u hen vernietigt.","19":"Waarom toch hebt u niet naar de stem van de HEERE gehoord, maar bent u op de buit afgevlogen, en hebt u gedaan wat kwaad was in de ogen van de HEERE?","20":"Toen zei Saul tegen Samuël: Ik heb zeker naar de stem van de HEERE gehoord, en ben gegaan op de weg waarop de HEERE mij gezonden heeft; en ik heb Agag, de koning van de Amalekieten, meegebracht, maar de Amalekieten heb ik verbannen.","21":"Het volk nu heeft van de buit genomen, schapen en runderen, het voornaamste van het verbannene[3], om aan de HEERE, uw God, te offeren te Gilgal.","22":"Doch Samuël zei: Heeft de HEERE evenveel behagen in brandoffers en slachtoffers, als in het gehoorzamen aan de stem van de HEERE? Zie, gehoorzamen is beter dan slachtoffer, opmerken beter dan het vet van rammen.","23":"Want weerspannigheid is een zonde als toverij, en weerstreven is afgoderij en beeldendienst. Omdat u het woord van de HEERE verworpen hebt, zo heeft Hij u verworpen, dat u geen koning meer zult zijn.","24":"Toen zei Saul tegen Samuël: Ik heb gezondigd, omdat ik het bevel van de HEERE en uw woorden overtreden heb; want ik heb het volk gevreesd en naar hun stem geluisterd.","25":"Nu dan, vergeef mij toch mijn zonde, en keer met mij terug, dat ik de HEERE aanbid.","26":"Doch Samuël zei tegen Saul: Ik zal niet met u terugkeren; omdat u het woord van de HEERE verworpen hebt, zo heeft de HEERE u verworpen, dat u geen koning over Israël meer zult zijn.","27":"Toen Samuël zich omkeerde om weg te gaan, greep hij een slip van zijn mantel, en die scheurde.","28":"Toen zei Samuël tegen hem: De HEERE heeft heden het koninkrijk van Israël van u afgescheurd, en heeft het aan uw naaste gegeven, die beter is dan u.","29":"En ook liegt Hij niet, Die de Overwinning van Israël is, en het berouwt Hem niet; want Hij is geen mens, dat Hem iets berouwen zou.","30":"Hij dan zei: Ik heb gezondigd; eer mij toch nu voor de oudsten van mijn volk, en voor Israël; en keer met mij terug, dat ik de HEERE, uw God, aanbid.","31":"Toen keerde Samuël terug, Saul achterna; en Saul aanbad de HEERE.","32":"Toen zei Samuël: Breng Agag, de koning van de Amalekieten, hier bij mij. Agag nu ging vol vertrouwen naar hem toe; en Agag zei: Voorwaar, de bitterheid van de dood is geweken!","33":"Maar Samuël zei: Zoals uw zwaard vrouwen van hun kinderen beroofd heeft, zo zal uw moeder van haar kinderen beroofd worden onder de vrouwen. Toen hieuw Samuël Agag in stukken, voor het aangezicht van de HEERE te Gilgal.","34":"Daarna ging Samuël naar Rama; en Saul ging naar zijn huis te Gibea-Sauls.","35":"En Samuël zag Saul niet meer tot de dag van zijn dood toe; toch droeg Samuël leed om Saul; en het berouwde de HEERE, dat Hij Saul tot koning over Israël gemaakt had."},"SV":{"1":"Toen zeide Samuël tot Saul: de HEERE heeft mij gezonden, dat ik u ten koning zalfde over Zijn volk, over Israël; hoor dan nu de stem van de woorden des HEEREN.","2":"Alzo zegt de HEERE der heirscharen: Ik heb bezocht, hetgeen Amalek aan Israël gedaan heeft, hoe hij zich tegen hem gesteld heeft op den weg, toen hij uit Egypte opkwam.","3":"Ga nu heen, en sla Amalek, en verban alles, wat hij heeft, en verschoon hem niet; maar dood van den man af tot de vrouw toe, van de kinderen tot de zuigelingen, van de ossen tot de schapen, van de kemelen tot de ezelen toe.","4":"Dit verkondigde Saul het volk, en hij telde hen te Telaim, tweehonderd duizend voetvolks, en tien duizend mannen van Juda.","5":"Als Saul tot aan de stad Amalek kwam, zo leide hij een achterlage in het dal.","6":"En Saul liet den Kenieten zeggen: Gaat weg, wijkt, trekt af uit het midden der Amalekieten, opdat ik u met hen niet wegruime; want gij hebt barmhartigheid gedaan aan al de kinderen Israëls, toen zij uit Egypte opkwamen. Alzo weken de Kenieten uit het midden der Amalekieten.","7":"Toen sloeg Saul de Amalekieten van Havila af, tot daar gij komt te Sur, dat voor aan Egypte is.","8":"En hij ving Agag, den koning der Amalekieten, levend; maar al het volk verbande hij door de scherpte des zwaards.","9":"Doch Saul en het *ganse* volk verschoonde Agag, en de beste schapen, en runderen, en de naast *beste*, en de lammeren, en al wat best was, en zij wilden ze niet verbannen; maar alle ding, dat verachtzaam, en dat verdwijnende was, verbanden zij.","10":"Toen geschiedde het woord des HEEREN tot Samuël, zeggende:","11":"Het berouwt Mij, dat Ik Saul tot koning gemaakt heb, dewijl hij zich van achter Mij afgekeerd heeft, en Mijn woorden niet bevestigd heeft. Toen ontstak Samuël, en hij riep tot den HEERE den gansen nacht.","12":"Daarna maakte zich Samuël des morgens vroeg op, Saul tegemoet; en het werd Samuël geboodschapt, zeggende: Saul is te Karmel gekomen, en zie, hij heeft zich een pilaar gesteld; daarna is hij omgetogen, en doorgetrokken, en naar Gilgal afgekomen.","13":"Samuël nu kwam tot Saul, en Saul zeide tot hem: Gezegend zijt gij den HEERE! Ik heb des HEEREN woord bevestigd.","14":"Toen zeide Samuël: Wat is dan dit voor een stem der schapen in mijn oren, en een stem der runderen, die ik hoor?","15":"Saul nu zeide: Zij hebben ze van de Amalekieten gebracht, want het volk heeft de beste schapen en runderen verschoond, om den HEERE, uw God, te offeren; maar het overige hebben wij verbannen.","16":"Toen zeide Samuël tot Saul: Houd op, zo zal ik u te kennen geven, wat de HEERE vannacht tot mij gesproken heeft. Hij dan zeide tot hem: Spreek.","17":"En Samuël zeide: Is het niet *alzo*, toen ge klein waart in uw ogen, dat gij het hoofd der stammen van Israël geworden zijt, en dat u de HEERE tot koning over Israël gezalfd heeft?","18":"En de HEERE heeft u op den weg gezonden, en gezegd: Ga heen en verban de zondaars, de Amalekieten, en strijd tegen hen, totdat gij dezelve te niet doet.","19":"Waarom toch hebt gij naar de stem des HEEREN niet gehoord, maar zijt tot den roof gevlogen, en hebt gedaan dat kwaad was in de ogen des HEEREN?","20":"Toen zeide Saul tot Samuël: Ik heb immers naar de stem des HEEREN gehoord, en heb gewandeld op den weg, op denwelken mij de HEERE gezonden heeft; en ik heb Agag, den koning der Amalekieten, *mede* gebracht, maar de Amalekieten heb ik verbannen.","21":"Het volk nu heeft genomen van den roof, schapen en runderen, het voornaamste van het verbannene, om den HEERE, uw God, op te offeren te Gilgal.","22":"Doch Samuël zeide: Heeft de HEERE lust aan brandofferen, en slachtofferen, als aan het gehoorzamen van de stem des HEEREN? Zie, gehoorzamen is beter dan slachtoffer, opmerken dan het vette der rammen.","23":"Want wederspannigheid is een zonde der toverij, en wederstreven is afgoderij en beeldendienst. Omdat gij des HEEREN woord verworpen hebt, zo heeft Hij u verworpen, dat gij geen koning zult zijn.","24":"Toen zeide Saul tot Samuël: Ik heb gezondigd, omdat ik des HEEREN bevel en uw woorden overtreden heb; want ik heb het volk gevreesd en naar hun stem gehoord.","25":"Nu dan, vergeef *mij* toch mijn zonde, en keer met mij wederom, dat ik den HEERE aanbidde.","26":"Doch Samuël zeide tot Saul: Ik zal met u niet wederkeren; omdat gij het woord des HEEREN verworpen hebt, zo heeft u de HEERE verworpen, dat gij geen koning over Israël zult zijn.","27":"Als zich Samuël omkeerde om weg te gaan, zo greep hij een slip van zijn mantel en zij scheurde.","28":"Toen zeide Samuël tot hem: De HEERE heeft heden het koninkrijk van Israël van u afgescheurd, en heeft het aan uw naaste gegeven, die beter is dan gij.","29":"En ook liegt Hij, Die de Overwinning van Israël is, niet, en het berouwt Hem niet; want Hij is geen mens, dat Hem *iets* berouwen zou.","30":"Hij dan zeide: Ik heb gezondigd; eer mij toch nu voor de oudsten mijns volks, en voor Israël; en keer wederom met mij, dat ik den HEERE, uw God, aanbidde.","31":"Toen keerde Samuël wederom Saul na; en Saul aanbad den HEERE.","32":"Toen zeide Samuël: Breng Agag, den koning der Amalekieten, hier tot mij; Agag nu ging tot hem weeldelijk; en Agag zeide: Voorwaar, de bitterheid des doods is geweken!","33":"Maar Samuël zeide: Gelijk als uw zwaard de vrouwen van haar kinderen beroofd heeft, alzo zal uw moeder van haar kinderen beroofd worden onder de vrouwen. Toen hieuw Samuël Agag in stukken, voor het aangezicht des HEEREN te Gilgal.","34":"Daarna ging Samuël naar Rama; en Saul ging op naar zijn huis te Gibea-sauls.","35":"En Samuël zag Saul niet meer tot den dag zijns doods toe; evenwel droeg Samuël leed om Saul; en het berouwde den HEERE, dat Hij Saul tot koning over Israël gemaakt had."},"KJV":{"1":"Samuel also said unto Saul, The LORD sent me to anoint thee to be king over his people, over Israel: now therefore hearken thou unto the voice of the words of the LORD.","2":"Thus saith the LORD of hosts, I remember that which Amalek did to Israel, how he laid wait for him in the way, when he came up from Egypt.","3":"Now go and smite Amalek, and utterly destroy all that they have, and spare them not; but slay both man and woman, infant and suckling, ox and sheep, camel and ass.","4":"And Saul gathered ➔ the people together, and numbered them in Telaim, two hundred thousand footmen, and ten thousand men of Judah.","5":"And Saul came to a city of Amalek, and laid wait in the valley.","6":"And Saul said unto the Kenites, Go, depart, get you down from among the Amalekites, lest I destroy you with them: for ye shewed kindness to all the children of Israel, when they came up out of Egypt. So the Kenites departed from among the Amalekites.","7":"And Saul smote the Amalekites from Havilah until thou comest to Shur, that is over against Egypt.","8":"And he took Agag the king of the Amalekites alive, and utterly destroyed all the people with the edge of the sword.","9":"But Saul and the people spared Agag, and the best of the sheep, and of the oxen, and of the fatlings, and the lambs, and all that was good, and would not utterly destroy them: but every thing that was vile and refuse, that they destroyed utterly.","10":"Then came the word of the LORD unto Samuel, saying,","11":"It repenteth me that I have set up Saul to be king: for he is turned back from following me, and hath not performed my commandments. And it grieved Samuel; and he cried unto the LORD all night.","12":"And when Samuel rose early to meet Saul in the morning, it was told Samuel, saying, Saul came to Carmel, and, behold, he set him up a place, and is gone about, and passed on, and gone down to Gilgal.","13":"And Samuel came to Saul: and Saul said unto him, Blessed be thou of the LORD: I have performed the commandment of the LORD.","14":"And Samuel said, What meaneth then this bleating of the sheep in mine ears, and the lowing of the oxen which I hear?","15":"And Saul said, They have brought them from the Amalekites: for the people spared the best of the sheep and of the oxen, to sacrifice unto the LORD thy God; and the rest we have utterly destroyed.","16":"Then Samuel said unto Saul, Stay, and I will tell thee what the LORD hath said to me this night. And he said unto him, Say on.","17":"And Samuel said, When thou wast little in thine own sight, wast thou not made the head of the tribes of Israel, and the LORD anointed thee king over Israel?","18":"And the LORD sent thee on a journey, and said, Go and utterly destroy the sinners the Amalekites, and fight against them until they be consumed.","19":"Wherefore then didst thou not obey the voice of the LORD, but didst fly upon the spoil, and didst evil in the sight of the LORD?","20":"And Saul said unto Samuel, Yea, I have obeyed the voice of the LORD, and have gone the way which the LORD sent me, and have brought Agag the king of Amalek, and have utterly destroyed the Amalekites.","21":"But the people took of the spoil, sheep and oxen, the chief of the things which should have been utterly destroyed, to sacrifice unto the LORD thy God in Gilgal.","22":"And Samuel said, Hath the LORD as great delight in burnt offerings and sacrifices, as in obeying the voice of the LORD? Behold, to obey is better than sacrifice, and to hearken than the fat of rams.","23":"For rebellion is as the sin of witchcraft, and stubbornness is as iniquity and idolatry. Because thou hast rejected the word of the LORD, he hath also rejected thee from being king.","24":"And Saul said unto Samuel, I have sinned: for I have transgressed the commandment of the LORD, and thy words: because I feared the people, and obeyed their voice.","25":"Now therefore, I pray thee, pardon my sin, and turn again with me, that I may worship the LORD.","26":"And Samuel said unto Saul, I will not return with thee: for thou hast rejected the word of the LORD, and the LORD hath rejected thee from being king over Israel.","27":"And as Samuel turned about to go away, he laid hold upon the skirt of his mantle, and it rent.","28":"And Samuel said unto him, The LORD hath rent the kingdom of Israel from thee this day, and hath given it to a neighbour of thine, that is better than thou.","29":"And also the Strength of Israel will not lie nor repent: for he is not a man, that he should repent.","30":"Then he said, I have sinned: yet honour me now, I pray thee, before the elders of my people, and before Israel, and turn again with me, that I may worship the LORD thy God.","31":"So Samuel turned again after Saul; and Saul worshipped the LORD.","32":"Then said Samuel, Bring ye hither to me Agag the king of the Amalekites. And Agag came unto him delicately. And Agag said, Surely the bitterness of death is past.","33":"And Samuel said, As thy sword hath made women childless, so shall thy mother be childless among women. And Samuel hewed ➔ Agag in pieces before the LORD in Gilgal.","34":"Then Samuel went to Ramah; and Saul went up to his house to Gibeah of Saul.","35":"And Samuel came no more to see Saul until the day of his death: nevertheless Samuel mourned for Saul: and the LORD repented that he had made Saul king over Israel."}},"tsk":{"1":[{"kopje":"De HEERE","refs":["1 Sam 15:17","1 Sam 15:18","1 Sam 9:16","1 Sam 10:1"]},{"kopje":"hoor","refs":["1 Sam 15:16","1 Sam 12:14","1 Sam 13:13","2 Sam 23:2","2 Sam 23:3","1 Kron 22:12","1 Kron 22:13","Ps 2:10","Ps 2:11"]}],"2":[{"kopje":"Ik heb bezocht","refs":["Jer 31:34","Hos 7:2","Amos 8:7"]},{"kopje":"Amalek","refs":["Ex 17:8-16","Num 24:20","Deut 25:17-19"]}],"3":[{"kopje":"verban","refs":["Lev 27:28","Lev 27:29","Num 24:20","Deut 13:15","Deut 13:16","Deut 20:16-18","Joz 6:17-21"]},{"kopje":"dood","refs":["Ex 20:5","Num 31:17","Jes 14:21","Jes 14:22"]},{"kopje":"ossen tot de schapen","refs":["Gen 3:17","Gen 3:18","Rom 8:20-22"]}],"4":[{"kopje":"Telaïm","refs":["Joz 15:24"]},{"kopje":"tweehonderdduizend","refs":["1 Sam 11:8","1 Sam 13:15"]}],"5":[{"kopje":"legde hij een hinderlaag","refs":["1 Sam 15:5"]}],"6":[{"kopje":"de Kenieten","refs":["1 Sam 27:10","Num 24:21","Num 24:22","Richt 1:16","Richt 4:11","Richt 5:24","1 Kron 2:55"]},{"kopje":"wijk","refs":["Gen 18:25","Gen 19:12-16","Num 16:26","Num 16:27","Num 16:34","Spr 9:6","Hand 2:40","2 Kor 6:17","Openb 18:14"]},{"kopje":"hebt barmhartigheid gedaan","refs":["Ex 18:9","Ex 18:10","Ex 18:19","Num 10:29-32","2 Tim 1:16"]}],"7":[{"kopje":"sloeg","refs":["1 Sam 14:48","Job 21:30","Pred 8:13"]},{"kopje":"Havila","refs":["Gen 2:11","Gen 25:18"]},{"kopje":"Sur","refs":["1 Sam 27:8","Gen 16:7"]}],"8":[{"kopje":"Agag","refs":["1 Sam 15:3","Num 24:7","1 Kon 20:30","1 Kon 20:34-42","Est 3:1"]},{"kopje":"verbande","refs":["1 Sam 27:8","1 Sam 30:1","Joz 10:39","Joz 11:12"]}],"9":[{"kopje":"de beste","refs":["1 Sam 15:3","1 Sam 15:15","1 Sam 15:19","Joz 7:21"]},{"kopje":"het naastbeste","refs":["2 Sam 6:13"]}],"11":[{"kopj span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> me to <span class=\"wl wl-kjv\" data-code=\"H4886\">anoint</span> thee to be <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> over his <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> over <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> now therefore <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> thou unto the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","2":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> I <span class=\"wl wl-kjv\" data-code=\"H6485\">remember</span> that which <span class=\"wl wl-kjv\" data-code=\"H6002\">Amalek</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> to <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> how he <span class=\"wl wl-kjv\" data-code=\"H7760\">laid</span> wait for him in the <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> when he came <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> from <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt.</span>","3":"Now <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> <span class=\"wl wl-kjv\" data-code=\"H6002\">Amalek,</span> and utterly <span class=\"wl wl-kjv\" data-code=\"H2763\">destroy</span> all that they have, and <span class=\"wl wl-kjv\" data-code=\"H2550\">spare</span> them not; but <span class=\"wl wl-kjv\" data-code=\"H4191\">slay</span> both <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> and <span class=\"wl wl-kjv\" data-code=\"H802\">woman,</span> <span class=\"wl wl-kjv\" data-code=\"H5768\">infant</span> and <span class=\"wl wl-kjv\" data-code=\"H3243\">suckling,</span> <span class=\"wl wl-kjv\" data-code=\"H7794\">ox</span> and <span class=\"wl wl-kjv\" data-code=\"H7716\">sheep,</span> <span class=\"wl wl-kjv\" data-code=\"H1581\">camel</span> and <span class=\"wl wl-kjv\" data-code=\"H2543\">ass.</span>","4":"And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">gathered</span> ➔ the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">together,</span> and <span class=\"wl wl-kjv\" data-code=\"H6485\">numbered</span> them in <span class=\"wl wl-kjv\" data-code=\"H2923\">Telaim,</span> two <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H7273\">footmen,</span> and <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah.</span>","5":"And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to a <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> of <span class=\"wl wl-kjv\" data-code=\"H6002\">Amalek,</span> and laid <span class=\"wl wl-kjv\" data-code=\"H7378\">wait</span> in the <span class=\"wl wl-kjv\" data-code=\"H5158\">valley.</span>","6":"And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H7017\">Kenites,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Go,</span> <span class=\"wl wl-kjv\" data-code=\"H5493\">depart,</span> get you <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> from <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> the <span class=\"wl wl-kjv\" data-code=\"H6002\">Amalekites,</span> lest I <span class=\"wl wl-kjv\" data-code=\"H622\">destroy</span> you with them: for ye <span class=\"wl wl-kjv\" data-code=\"H6213\">shewed</span> <span class=\"wl wl-kjv\" data-code=\"H2617\">kindness</span> to all the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> when they came <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> out of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt.</span> So the <span class=\"wl wl-kjv\" data-code=\"H7017\">Kenites</span> <span class=\"wl wl-kjv\" data-code=\"H5493\">departed</span> from <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> the <span class=\"wl wl-kjv\" data-code=\"H6003\">Amalekites.</span>","7":"And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> the <span class=\"wl wl-kjv\" data-code=\"H6002\">Amalekites</span> from <span class=\"wl wl-kjv\" data-code=\"H2341\">Havilah</span> until thou <span class=\"wl wl-kjv\" data-code=\"H935\">comest</span> to <span class=\"wl wl-kjv\" data-code=\"H7793\">Shur,</span> that is over <span class=\"wl wl-kjv\" data-code=\"H6440\">against</span> <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt.</span>","8":"And he <span class=\"wl wl-kjv\" data-code=\"H8610\">took</span> <span class=\"wl wl-kjv\" data-code=\"H90\">Agag</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of the <span class=\"wl wl-kjv\" data-code=\"H6002\">Amalekites</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">alive,</span> and utterly <span class=\"wl wl-kjv\" data-code=\"H2763\">destroyed</span> all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> with the <span class=\"wl wl-kjv\" data-code=\"H6310\">edge</span> of the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword.</span>","9":"But <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H2550\">spared</span> <span class=\"wl wl-kjv\" data-code=\"H90\">Agag,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4315\">best</span> of the <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep,</span> and of the <span class=\"wl wl-kjv\" data-code=\"H1241\">oxen,</span> and of the <span class=\"wl wl-kjv\" data-code=\"H4932\">fatlings,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3733\">lambs,</span> and all that was <span class=\"wl wl-kjv\" data-code=\"H2896\">good,</span> and <span class=\"wl wl-kjv\" data-code=\"H14\">would</span> not utterly <span class=\"wl wl-kjv\" data-code=\"H2763\">destroy</span> them: but every <span class=\"wl wl-kjv\" data-code=\"H4399\">thing</span> that was <span class=\"wl wl-kjv\" data-code=\"H5240\">vile</span> and <span class=\"wl wl-kjv\" data-code=\"H4549\">refuse,</span> that they destroyed <span class=\"wl wl-kjv\" data-code=\"H2763\">utterly.</span>","10":"Then came the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> unto <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span>","11":"It <span class=\"wl wl-kjv\" data-code=\"H5162\">repenteth</span> me that I have set <span class=\"wl wl-kjv\" data-code=\"H4427\">up</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> to be <span class=\"wl wl-kjv\" data-code=\"H4428\">king:</span> for he is turned <span class=\"wl wl-kjv\" data-code=\"H7725\">back</span> from <span class=\"wl wl-kjv\" data-code=\"H310\">following</span> me, and hath not <span class=\"wl wl-kjv\" data-code=\"H6965\">performed</span> my <span class=\"wl wl-kjv\" data-code=\"H1697\">commandments.</span> And it <span class=\"wl wl-kjv\" data-code=\"H2734\">grieved</span> <span class=\"wl wl-kjv\" data-code=\"H8 class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> What meaneth then this <span class=\"wl wl-kjv\" data-code=\"H6963\">bleating</span> of the <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep</span> in mine <span class=\"wl wl-kjv\" data-code=\"H241\">ears,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6963\">lowing</span> of the <span class=\"wl wl-kjv\" data-code=\"H1241\">oxen</span> which I <span class=\"wl wl-kjv\" data-code=\"H8085\">hear?</span>","15":"And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> They have <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> them from the <span class=\"wl wl-kjv\" data-code=\"H6003\">Amalekites:</span> for the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H2550\">spared</span> the <span class=\"wl wl-kjv\" data-code=\"H4315\">best</span> of the <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep</span> and of the <span class=\"wl wl-kjv\" data-code=\"H1241\">oxen,</span> to <span class=\"wl wl-kjv\" data-code=\"H2076\">sacrifice</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God;</span> and the <span class=\"wl wl-kjv\" data-code=\"H3498\">rest</span> we have utterly <span class=\"wl wl-kjv\" data-code=\"H2763\">destroyed.</span>","16":"Then <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> <span class=\"wl wl-kjv\" data-code=\"H7503\">Stay,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> thee what the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H1696\">said</span> to me this <span class=\"wl wl-kjv\" data-code=\"H3915\">night.</span> An ch Amalek did unto Israel, how he set himself against him on the way, when he came up out of Egypt."}],"3":[{"catchword":null,"tekst":"Now go thy way, and smite Amalek, and ban all that he hath, [i.e. destroy utterly, and slay all that hath life, or every living thing] and spare him not: but slay from the man to the woman, from the children to the sucklings, from the Oxen to the Sheep, from the Camels to the Asses."}],"4":[{"catchword":null,"tekst":"This Saul told to the people, and numbered them at Telaim, [i.e. in the field by the City Telaim, lying in the tribe of Juda, which Jos.15.24. is called Thelem] two hundred thousand footmen: and ten thousand men of Juda."}],"5":[{"catchword":null,"tekst":"When Saul came to the City of Amalek, [Understand this either of the first City of the Amalekites, before with Saul came, or of the metropolis or chief City of the Amalekites, where peradventure the King dwelt, and kept his Souldiers: Or City may be taken for Cities, for the Amalekites inhabited more Cities then one] then he had an ambush in the valley."}],"6":[{"catchword":null,"tekst":"And Saul send word to the Kenites, (saying) Go away, depart, go down out of the midst of the Amalekites, [This short abrupt manner of speaking, signifieth that they were to make haste in breaking up. See the like phrase, Genes.18.6.] left I convey you away with them, [i.e. lest I deal by you, as I inted to deal by them] for ye shewed mercy unto all the children of Israel, when they came up out of Egypt: [This is properly to be understood of Jethro the Kenite, Moseh his father in Law, from whom the Kenites descended] So the Kenites departed out of the midst of the Amalekites."}],"7":[{"catchword":null,"tekst":"Then smote Saul the Amalekites from Havila [A Land lying in Arabia. See Genes. Chap.2. vers.11.] until where thou comest to Sur, [this is the border of Arabia toward Egypt. See Genes.16.17. and 25.18. There is likewise mention made, Exo 15:22. of the wildernesse of Sur] which is over against Egypt."}],"8":[{"catchword":null,"tekst":"And he took Agag [It&acirc;&euro;&trade;s thought that this was a name common to all the Kings of the Amalekites, as Pharao to the Kings of Egypt, and Abimelech to the Kings at Gerar] the King of the Amalekites alive, but he handed all the people by the edge of the sword."}],"9":[{"catchword":null,"tekst":"But Saul and all the people spared Agag, and the best Sheep, and Oxen, and the next (to the best,) [i.e. the middle sort. Oth. the fatted, or, fatlings] and the Lambs, [Oth. Leaders of the cattel, Oth. Bell-weathers] and all that was best, [this God had forbidden, vers.3.] and they would not ban them: but every thing that was despicable, and that was perishing, [Heb. that melted; i.e. that in it self perished, and as it were melted away] that they banned."}],"10":[{"catchword":null,"tekst":"Then came the word of the LORD unto Samuel, saying:"}],"11":[{"catchword":null,"tekst":"It repenteth me [This is spoken after the manner of men. See the annotat. On Genes.6.6. also below chap.16.1. So that that which is said below vers.29. is no way contrary or repugnant to this] that I have made Saul King, because he hath turned himself back away from after me, and hath not established my words: [i.e. he hath not suffered my command to prevail with him, that he should have faithfully excuted the same. Compare Deut.27.26.] then Samuel kindled, [viz. with grief and wrath. He kindled against Saul, because he had not performed Gods command] and he cried unto the LORD all night. [Samuel prayed unto the Lord for Saul, that he would not despose him from the Kingdom, but God heard not this prayer of Samuel, as may appear below vers.23.26. and 28.]"}],"12":[{"catchword":null,"tekst":"Afterward Samuel gat him up early in the morning, to meet Saul: and it was told Samuel, [Oth. notice was given, &c. saying, Saul is come to Carmel, [a City and hill in the tribe of Juda, which lay on the way, as they pass&Atilde;&copy; out of the Amalekites Countrey into Juda, Jos.15.55. very fruitful in pasture and other fruits. There is another Carmel in the tribe of Issaschan, I Kings 18.19.] and behold, he hath set him (up) a pillar. [Heb. a hand; i.e. a memorial, perhaps in the fashion of a hand, in remembrance that he smote and consumed the enemies with the hand. See like, 2 Sam18.18. Oth. and had appointed a place, viz. to refresh and view his army, and to divide the prey] afterward he is gone about, and passed thorow, and come down to Gilgal."}],"13":[{"catchword":null,"tekst":"Now Samuel came unto Soul said unto him, Blessed art thou unto the LORD, I have established the word of the LORD. [See Above VII.]"}],"14":[{"catchword":null,"tekst":"Then said Samuel, what meaneth then he voice of sheep in mine ears, and the voice of the oxen that I hear?"}],"15":[{"catchword":null,"tekst":"Now Saul said, they have brought the Amalekites, for the people have spared the best sheep and oxen, [See above verse 9] to offer unto the LORD thy God: but the rest we have banned."}],"16":[{"catchword":null,"tekst":"Then said Samuel, cease, so will I tell thee, what the LORD spake to me this night: the he said speak (on)."}],"17":[{"catchword":null,"tekst":"And Samuel said, Is it not (thus), when thou wast little in thine eyes, [I e. when thou esteemedst thy slf little and mean/; see above chapter 9.21] that thou art be come the head of tribes of Israeel? And that the LORD hath anointed thee [viz. by me] to be King over Isreal?"}],"18":[{"catchword":null,"tekst":"And the LORD hath set thee on the way, [i. e. Upon this design and expectation against the Amalekites, to also ver. 20.] and said go thy way and ban the sinners ,overtopping others in sinnes and wickedness. Compare Gen 13.13.Psalm1.1.Matt.9.10& 11.19. Job 9. 24, 31] the Amalekites, and fight against them, until thou bring them nothing."}],"19":[{"catchword":null,"tekst":"Wherefore now didst thou not hearken to the voice of the LORD, but didst fly to the prey, [ See the annotate on 1 Sam 25.14] and didst that which was evil in the eyes of the LORD?"}],"20":[{"catchword":null,"tekst":"Then said Saul unto Samuel, yes, I have hearkened to the voice of the LORD, and have walked on the way on which the LORD sent me: and I have brought (with me) Agag the King of the Amalekites, but I have banned the Amalekites."}],"21":[{"catchword":null,"tekst":"Now the people took of the spoil, [ As if he had said not I, but the people, whom I feared , verse 24. Took of the prey] Sheep and oxen the chiefest, [Heb. The firstlings] of the banned (thing) to offer unto the LORD thy God at Gilgal."}],"22":[{"catchword":null,"tekst":"But Samuel said, Hath the Lord delight in burnt-offerings, and slay-offerings, as in obeying the voice of the LORD? behold, to obey is better than slay-offerings, to attend then the fat of the ram."}],"23":[{"catchword":null,"tekst":"For rebellion is a sinne of witchcraft, [i.e. It&acirc;&euro;&trade;s as great a sinne as witchcraft is] and to oppose is Idolatry, [the Hebrew word signifieth Vanity, iniquity, and sometimes labour, pain, travel, also an idol, and idol-worship, or idolatry, so called, because Idolaters bestow much labour and pains in the performance of their idolatrous superstitions, which are all meer vanities, and have nothing of reality in them]and image- worship: [Heb. Teraphim. See the annotat on Gen 31:19] because thou hast rejected the word of the LORD, therefore he hath rejected thee, that thou shalt not be King."}],"24":[{"catchword":null,"tekst":"Then said Saul unto Samuel, I have sinned, because I have transgressed the LORD&acirc;&euro;&trade;S command [Heb. mouth: i.e. That which God by thy mouth hath spoken] and thy words : for I feared the people, and hearkened to their voice."}],"25":[{"catchword":null,"tekst":"Now therefore, I pray thee, pardon my sinne: and turn again with me. That I may worship the LORD."}],"26":[{"catchword":null,"tekst":"But Samuel said unto Saul, I will not return with thee; because thou hast rejected the word of the LORD, therefore the LORD hath rejected thee, that thou shalt not be King over Israel."}],"27":[{"catchword":null,"tekst":"Then Samuel turned himself about to go away: then he [viz. Saul] took hold of a skirt [ Heb. a wing; i.e. skirt, or, gard, by which Saul would hold the Prophet Samuel fait] of his mantle, and it rent."}],"28":[{"catchword":null,"tekst":"Then said Samuel unto him, The LORD hath said this day rent off the Kingdome of Israel from thee, and hath given it to thy neighbour, that is better then thee."}],"29":[{"catchword":null,"tekst":"And also he that is the victory of Israel [i.e. The Lord who fighteth for Israel, and conquereth his enemy. Oth.the strength of Israel ] lieth not, and repenteth him not: [see the annotat. On Gen 6:6.] for he is not a man, that he should repent (of anything)"}],"30":[{"catchword":null,"tekst":"Then he said, I have sinned, honour me now, I pray thee, before the Eldest [Or, in the preference of the Eldest] of my people, and before Israel: and turn again with me, that ye may worship the LORD thy God."}],"31":[{"catchword":null,"tekst":"Then Samuel turned again after Saul: [ viz. To honour the Kingly Dignity in the presence and repute of the people] and Saul worshipped the LORD."}],"32":[{"catchword":null,"tekst":"Then said Samuel, Bring hither to me Agag the King of Amalekites: now Agag went unto him delicately; [Or, flately, delicately, tenderely. This may be understood of his and costly garments, which ( it may be) he put on, to come thus before the Prophet with aflatelt countenance] and Agag said, [ i.e. thought with himself, or , he said this to his servants, or those that stood about him] Verily the bitterness of death is past. [ As if he had said, I perceive now plainly that I shall not be put to death, as I hitherto feared, because I am brought before a Prophet, having escaped the hands of an armed King]"}],"33":[{"catchword":null,"tekst":"But Samuel said , According as thy sword berest women of their children, So shall thy mother be bereaved of her children among women: Then Samuel hewed Agag in pieces before the face of the LORD at Gilgal. [ See the like example in the prophet Elias, 1 King. 18. 40 & 2 King . 1. 10,11 These Prophets were moved hereunto by an inward motion and instinct of God; so that this may not be followed by every one, whose calling properly is not to use the sword of Justice ]"}],"34":[{"catchword":null,"tekst":"Afterward Samuel went to Rama, and Saul went up to his house at Gibea of Saul."}],"35":[{"catchword":null,"tekst":"And Samuel saw Saul no more [ Oth: Visited Saul no more. Viz to instruct him concerning the government of the kingdom, or to ask counsel of God for him otherwise Samuel saw Saul unawares at Najoth in Rama, below chap. 19.24. Seeing for visiting, is likewise used 2 King. 8.29. and in other places more] until the day of his death, [ the fame being likewise counted in with the rest; intimating that he never visited him again, or after that time] never the less Samuel mourned for Saul [ Samuel mourned not for Saul all his life-time, but so long, until he was forbidden by God to do it, and he was commanded by God to anoint David King over Israel; as appeareth below chap. 16.1] and it repented the LORD, that he had made Saul King over Israel."}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
