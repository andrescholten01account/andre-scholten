gen": {"SVnu": {"1": "Toen trok Nahas, de Ammoniet, op en belegerde Jabes in Gilead. En alle mannen van Jabes zeiden tegen Nahas: Sluit een verbond met ons, en wij zullen u dienen.", "2": "Maar Nahas, de Ammoniet, zei tegen hen: Op deze voorwaarde zal ik een verbond met u sluiten, dat ik bij u allen het rechteroog uitsteek, en dat ik deze schande op heel Israël leg.", "3": "Toen zeiden de oudsten van Jabes tegen hem: Geef ons zeven dagen de tijd, zodat wij boden kunnen sturen naar alle grensgebieden van Israël; is er dan niemand die ons verlost, dan zullen wij naar u uitgaan.", "4": "Toen de boden in Gibea-Sauls kwamen, spraken zij deze woorden ten aanhoren van het volk. Toen verhief heel het volk zijn stem, en zij weenden.", "5": "En zie, Saul kwam achter de runderen aan uit het veld, en Saul zei: Wat is er met het volk, dat zij wenen? Toen vertelden zij hem de woorden van de mannen van Jabes.", "6": "Toen kwam de Geest van God vaardig over Saul, toen hij deze woorden hoorde; en zijn toorn ontstak zeer.", "7": "En hij nam een paar runderen en hakte ze in stukken, en stuurde die door de hand van de boden naar alle grensgebieden van Israël, en zei: Wie niet zelf uittrekt achter Saul en achter Samuël aan, met zijn runderen zal hetzelfde gedaan worden. Toen viel de vreze van de HEERE op het volk, en zij gingen uit als één man.", "8": "En hij telde hen in Bezek; en van de kinderen van Israël waren er driehonderdduizend, en van de mannen van Juda dertigduizend.", "9": "Toen zeiden zij tegen de boden die gekomen waren: Zo zult u tegen de mannen van Jabes in Gilead zeggen: Morgen, als de zon heet is geworden, zal aan u verlossing gebeuren. Toen de boden kwamen en dit aan de mannen van Jabes verkondigden, werden zij blij.", "10": "En de mannen van Jabes zeiden: Morgen zullen wij naar u uitgaan, en u zult met ons doen naar alles wat goed is in uw ogen.", "11": "Het gebeurde nu de volgende dag, dat Saul het volk in drie groepen indeelde, en zij kwamen midden in het leger, tijdens de morgenwake, en zij versloegen Ammon, totdat de dag heet werd; en het gebeurde dat de overgeblevenen zo verstrooid werden, dat er onder hen geen twee samen bleven.", "12": "Toen zei het volk tegen Samuël: Wie is hij die zei: Zou Saul over ons regeren? Geef hier die mannen, dan doden wij hen.", "13": "Maar Saul zei: Er zal op deze dag geen man gedood worden, want de HEERE heeft heden een verlossing in Israël bewerkt.", "14": "Verder zei Samuël tegen het volk: Komt, laten wij naar Gilgal gaan, en het koninkrijk daar vernieuwen.", "15": "Toen ging heel het volk naar Gilgal, en Saul werd daar koning gemaakt voor het aangezicht van de HEERE te Gilgal; en zij offerden daar dankoffers voor het aangezicht van de HEERE; en Saul verheugde zich daar zeer, met alle mannen van Israël."}, "SV": {"1": "Toen toog Nahas, de Ammoniet, op, en belegerde, Jabes in Gilead. En al de mannen van Jabes zeiden tot Nahas: Maak een verbond met ons, zo zullen wij u dienen.", "2": "Doch Nahas, de Ammoniet, zeide tot hen: Mits dezen zal ik *een* *verbond* met ulieden maken, dat ik u allen het rechteroog uitsteke; en dat ik deze schande op gans Israël legge.", "3": "Toen zeiden tot hem de oudsten Jabes: Laat zeven dagen van ons af, dat wij boden zenden in al de landpalen van Israël; is er dan niemand, die ons verlost, zo zullen wij tot u uitgaan.", "4": "Als de boden te Gibea-sauls kwamen, zo spraken zij deze woorden voor de oren van het volk. Toen hief al het volk zijn stem op, en weende.", "5": "En ziet, Saul kwam achter de runderen uit het veld, en Saul zeide: Wat is den volke, dat zij wenen? Toen vertelden zij hem de woorden der mannen van Jabes.", "6": "Toen werd de Geest Gods vaardig over Saul, als hij deze woorden hoorde; en zijn toorn ontstak zeer.", "7": "En hij nam een paar runderen, en hieuw ze in stukken, en hij zond ze in alle landpalen van Israël door de hand der boden, zeggende: Die niet zelf uittrekt achter Saul en achter Samuël, alzo zal men zijn runderen doen. Toen viel de vreze des HEEREN op het volk, en zij gingen uit als een enig man.", "8": "En hij telde hen te Bezek; en van de kinderen Israëls waren driehonderd duizend, en van de mannen van Juda dertig duizend.", "9": "Toen zeiden zij tot de boden, die gekomen waren: Aldus zult gijlieden den mannen te Jabes in Gilead zeggen: Morgen zal u verlossing geschieden, als de zon heet worden zal. Als de boden kwamen, en verkondigden *dat* aan de mannen te Jabes, zo werden zij verblijd.", "10": "En de mannen van Jabes zeiden: Morgen zullen wij tot ulieden uitgaan, en gij zult ons doen naar alles, wat goed is in uw ogen.", "11": "Het geschiedde nu des anderen daags, dat Saul het volk stelde in drie hopen, en zij kwamen in het midden des legers, in de morgenwake, en zij sloegen Ammon, totdat de dag heet werd; en het geschiedde, dat de overigen alzo verstrooid werden, dat er onder hen geen twee te zamen bleven.", "12": "Toen zeide het volk tot Samuël: Wie is hij, die zeide: Zou Saul over ons regeren? Geeft hier die mannen, dat wij hen doden.", "13": "Maar Saul zeide: Er zal te dezen dage geen man gedood worden, want de HEERE heeft heden een verlossing in Israël gedaan.", "14": "Verder zeide Samuël tot het volk: Komt en laat ons naar Gilgal gaan, en het koninkrijk aldaar vernieuwen.", "15": "Toen ging al het volk naar Gilgal, en maakte Saul aldaar koning voor het aangezicht des HEEREN te Gilgal; en zij offerden aldaar dankofferen voor het aangezicht des HEEREN; en Saul verheugde zich aldaar gans zeer, met al de mannen van Israël."}, "KJV": {"1": "Then Nahash the Ammonite came up, and encamped against Jabeshgilead: and all the men of Jabesh said unto Nahash, Make a covenant with us, and we will serve thee.", "2": "And Nahash the Ammonite answered them, On this condition will I make a covenant with you, that I may thrust out all your right eyes, and lay it for a reproach upon all Israel.", "3": "And the elders of Jabesh said unto him, Give us seven days' respite, that we may send messengers unto all the coasts of Israel: and then, if there be no man to save us, we will come out to thee.", "4": "Then came the messengers to Gibeah of Saul, and told the tidings in the ears of the people: and all the people lifted up their voices, and wept.", "5": "And, behold, Saul came after the herd out of the field; and Saul said, What aileth the people that they weep? And they told him the tidings of the men of Jabesh.", "6": "And the Spirit of God came upon Saul when he heard those tidings, and his anger was kindled greatly.", "7": "And he took a yoke of oxen, and hewed them in pieces, and sent them throughout all the coasts of Israel by the hands of messengers, saying, Whosoever cometh not forth after Saul and after Samuel, so shall it be done unto his oxen. And the fear of the LORD fell on the people, and they came out with one consent.", "8": "And when he numbered them in Bezek, the children of Israel were three hundred thousand, and the men of Judah thirty thousand.", "9": "And they said unto the messengers that came, Thus shall ye say unto the men of Jabeshgilead, To morrow, by that time the sun be hot, ye shall have help. And the messengers came and shewed it to the men of Jabesh; and they were glad.", "10": "Therefore the men of Jabesh said, To morrow we will come out unto you, and ye shall do with us all that seemeth good unto you.", "11": "And it was so on the morrow, that Saul put the people in three companies; and they came into the midst of the host in the morning watch, and slew the Ammonites until the heat of the day: and it came to pass, that they which remained were scattered, so that two of them were not left together.", "12": "And the people said unto Samuel, Who is he that said, Shall Saul reign over us? bring the men, that we may put them to death.", "13": "And Saul said, There shall not a man be put to death this day: for to day the LORD hath wrought salvation in Israel.", "14": "Then said Samuel to the people, Come, and let us go to Gilgal, and renew the kingdom there.", "15": "And all the people went to Gilgal; and there they made Saul king before the LORD in Gilgal; and there they sacrificed sacrifices of peace offerings before the LORD; and there Saul and all the men of Israel rejoiced greatly."}}, "tsk": {"1": [{"kopje": "Nahas", "refs": ["1 Sam 12:12", "Richt 10:7", "Richt 11:8-33"]}, {"kopje": "Jabes in Gilead", "refs": ["1 Sam 31:11-13", "Richt 21:8"]}, {"kopje": "Sluit", "refs": ["Gen 26:28", "Ex 23:32", "Deut 23:3", "1 Kon 20:34", "Job 40:23", "Jes 36:16", "Ezech 17:13"]}], "2": [{"kopje": "Op deze voorwaarde", "refs": ["2 Kon 18:31"]}, {"kopje": "uitsteek", "refs": ["Richt 16:21", "Ex 3:6", "Spr 12:10", "Jer 39:7"]}, {"kopje": "schande", "refs": ["1 Sam 17:26", "Gen 34:14"]}], "4": [{"kopje": "Gibea-Sauls", "refs": ["1 Sam 10:26", "1 Sam 14:2", "1 Sam 15:34", "2 Sam 21:6"]}, {"kopje": "verhief", "refs": ["1 Sam 30:4", "Richt 2:4", "Richt 21:2", "Rom 12:15", "1 Kor 12:26", "Gal 6:2", "Hebr 13:3"]}], "5": [{"kopje": "achter de runderen", "refs": ["1 Sam 9:1", "1 Kon 19:19", "Ps 78:71"]}, {"kopje": "Wat is er", "refs": ["Gen 21:17", "Richt 18:23", "Jes 22:1"]}], "6": [{"kopje": "Geest van God", "refs": ["1 Sam 10:10", "1 Sam 16:13", "Richt 3:10", "Richt 6:34", "Richt 11:29", "Richt 13:25", "Richt 14:6"]}, {"kopje": "zijn toorn", "refs": ["Ex 32:19", "Num 12:3", "Mark 3:5", "Ef 4:26"]}], "7": [{"kopje": "hij nam", "refs": ["Richt 19:29"]}, {"kopje": "hakte", "refs": ["Richt 19:29"]}, {"kopje": "Wie", "refs": ["Richt 21:5-11"]}, {"kopje": "de vreze", "refs": ["Gen 35:5", "2 Kron 14:14", "2 Kron 17:10"]}, {"kopje": "als één man", "refs": ["Richt 20:1"]}], "8": [{"kopje": "Bezek", "refs": ["Richt 1:4", "Richt 1:5"]}, {"kopje": "de kinderen", "refs": ["1 Sam 13:15", "1 Sam 15:4", "2 Sam 24:9", "2 Kron 17:12-19"]}], "9": [{"kopje": "verlossing", "refs": ["Ps 18:18"]}], "10": [{"kopje": "Morgen", "refs": ["1 Sam 11:2", "1 Sam 11:3"]}], "11": [{"kopje": "de volgende dag", "refs": ["Gen 22:14", "Ps 46:2"]}, {"ko tegen hem: Geef ons zeven dagen de tijd, zodat wij boden kunnen sturen naar alle grensgebieden van Israël; is er dan niemand die ons verlost, dan zullen wij naar u uitgaan.", "Neh 3:9": "En aan hun hand verbeterde Refaja, de zoon van Hur, leider van het halve deel van Jeruzalem.", "1 Sam 11:1-11": "Toen trok Nahas, de Ammoniet, op en belegerde Jabes in Gilead. En alle mannen van Jabes zeiden tegen Nahas: Sluit een verbond met ons, en wij zullen u dienen. Maar Nahas, de Ammoniet, zei tegen hen: Op deze voorwaarde zal ik een verbond met u sluiten, dat ik bij u allen het rechteroog uitsteek, en dat ik deze schande op heel Israël leg. Toen zeiden de oudsten van Jabes tegen hem: Geef ons zeven dagen de tijd, zodat wij boden kunnen sturen naar alle grensgebieden van Israël; is er dan niemand die ons verlost, dan zullen wij naar u uitgaan.", "Richt 20:11": "Zo werden alle mannen van Israël verzameld bij deze stad, verbonden als één man.", "Richt 14:6": "Toen kwam de Geest van de HEERE machtig over hem, zodat hij hem uiteenscheurde, zoals men een bokje uiteenscheurt, en er was niets in zijn hand; maar hij vertelde zijn vader en zijn moeder niet wat hij gedaan had.", "Ex 32:19": "En het gebeurde, toen hij bij het kamp kwam en het kalf en de reidansen zag, dat de toorn van Mozes ontstak, en dat hij de tafelen uit zijn handen wierp en ze onder aan de berg verbrak.", "Richt 11:29": "Toen kwam de Geest van de HEERE op Jeftha, zodat hij Gilead en Manasse doortrok; want hij trok door tot Mizpa in Gilead, en van Mizpa in Gilead trok hij door naar de kinderen van Ammon.", "Joz 10:5": "Toen werden de vijf koningen van de Amorieten verzameld en trokken op, de koning van Jeruzalem, de koning van Hebron, de koning van Jarmuth, de koning van Lachis, de koning van Eglon, zij en al hun legers; en zij belegerden Gibeon, en streden tegen haar.", "2 Kon 10:1-7": "Achab had zeventig zonen te Samaria; en Jehu schreef brieven, die hij zond naar Samaria, tot de leiders van Jizreël, de oudsten, en tot de voedsterheren van Achab, en zei: Zo gauw deze brief tot u komt - omdat de zonen van uw heer bij u zijn, ook de wagens en de paarden bij u zijn, alsook een vaste stad, en wapens - zo kijkt naar de beste en meest geschikte van de zonen van uw heer, zet hem op de troon van zijn vader; en strijdt voor het huis van uw heer.", "Gen 22:14": "En Abraham noemde de naam van die plaats: De Heere zal het voorzien! Waarom tot op deze dag gezegd wordt: Op de berg van de HEERE zal het voorzien worden!", "2 Sam 18:1": "En David monsterde het volk dat bij hem was, en hij stelde over hen leiders van duizend, en leiders van honderd aan.", "Jes 36:16": "Luister niet naar Hizkia; want zo zegt de koning van Assyrië: Sluit vrede met mij door een geschenk, en kom naar buiten tot mij, en eet ieder van zijn wijnstok, en ieder van zijn vijgenboom, en drink ieder het water van zijn eigen bornput,", "Num 12:3": "Doch de man Mozes was zeer zachtmoedig, meer dan alle mensen die op de aardbodem waren.", "Richt 8:14-16": "ving hij een jongeman van de mensen van Sukkoth, en ondervroeg hem; die schreef voor hem de leiders van Sukkoth op, en hun oudsten, zevenenzeventig man. Toen kwam hij bij de mannen van Sukkoth en zei: Zie hier Zebah en Tsalmuna, over wie u mij smadelijk verweten hebt: Is de handpalm van Zebah en Tsalmuna dan al in uw hand, dat wij aan uw mannen, die moe zijn, brood zouden geven? En hij nam de oudsten van die stad, en doornen uit de woestijn, en distels, en liet het de mannen van Sukkoth daarmee ondervinden.", "1 Kron 29:21-24": "En zij offerden de HEERE slachtoffers; ook brachten zij de HEERE brandoffers, de volgende morgen na die dag: duizend jonge stieren, duizend rammen, duizend lammeren, met hun drankoffers; en slachtoffers in overvloed, voor heel Israël. En zij aten en dronken op die dag voor het aangezicht van de HEERE met grote vreugde; en zij maakten Salomo, de zoon van David, voor de tweede keer koning, en zij zalfden hem voor de HEERE tot voorganger, en Zadok tot priester. Zo zat Salomo op de troon van de HEERE, als koning in de plaats van zijn vader David, en hij was voorspoedig; en heel Israël luisterde naar hem.", "Neh 3:19": "Aan zijn hand verbeterde Ezer, de zoon van Jesua, de leider van Mizpa, een ander stuk; tegenover de opgang naar het wapenhuis, aan de hoek.", "Deut 19:12": "dan zullen de oudsten van zijn stad iemand sturen, en hem vandaar laten halen, en zij zullen hem overgeven in de hand van de bloedwreker, zodat hij sterft.", "1 Sam 13:17": "En de verwoesters trokken uit het leger van de Filistijnen, in drie groepen; de ene groep sloeg de weg in naar Ofra, naar het land Sual;", "1 Sam 10:10": "Toen zij daar bij de heuvel kwamen, zie, toen kwam hem een groep profeten tegemoet; en de Geest van de HEERE werd vaardig over hem, en hij profeteerde in hun midden.", "Ps 44:5-9": "U Zelf bent mijn Koning, o God! Gebied de verlossingen van Jakob. Door U zullen wij onze tegenstanders met hoorns stoten; in Uw Naam zullen wij vertrappen die tegen ons opstaan. Want ik vertrouw niet op mijn boog, en mijn zwaard zal mij niet verlossen.", "1 Kor 12:26": "En hetzij dat één lid lijdt, alle leden lijden mee; hetzij dat één lid geëerd wordt, alle leden verblijden zich mee.", "1 Sam 11:12-15": "Toen zei het volk tegen Samuël: Wie is hij die zei: Zou Saul over ons regeren? Geef hier die mannen, dan doden wij hen. Maar Saul zei: Er zal op deze dag geen man gedood worden, want de HEERE heeft heden een verlossing in Israël bewerkt. Verder zei Samuël tegen het volk: Komt, laten wij naar Gilgal gaan, en het koninkrijk daar vernieuwen.", "Matt 7:2": "Want met het oordeel waarmee u oordeelt, zult u geoordeeld worden; en met de maat waarmee u meet, zal u weer gemeten worden.", "Ruth 4:2-11": "En hij nam tien mannen van de oudsten van de stad en zei: Zet u hier neer; en zij zetten zich neer. Toen zei hij tegen die losser: Het stuk land dat van onze broeder Elimelech was, heeft Naomi, die uit het land van de Moabieten teruggekomen is, verkocht. En ik heb gezegd: Ik zal het voor uw oor bekendmaken en zeggen: Koop het in tegenwoordigheid van de inwoners en in tegenwoordigheid van de oudsten van mijn volk; als u het zult lossen, los het; en als men het niet zou lossen, verklaar het mij, zodat ik het weet; want er is niemand behalve u die het kan lossen, en ik na u. Toen zei hij: Ik zal het lossen.", "1 Sam 12:13": "En nu, zie daar de koning die u gekozen hebt, die u begeerd hebt; en zie, de HEERE heeft een koning over u gezet.", "Rom 12:15": "Verblijd u met de blijden, en ween met de wenende.", "Richt 19:29": "Toen hij nu in zijn huis kwam, nam hij een mes, en greep zijn bijvrouw, en verdeelde haar met haar botten in twaalf stukken; en hij zond ze naar alle gebieden van Israël.", "Gen 35:5": "En zij reisden verder; en er kwam een schrik van God over de steden die rondom hen waren, zodat zij de zonen van Jakob niet achterna joegen.", "Ps 63:7": "Als ik aan U denk op mijn bed, dan peins ik over U in de nachtwaken.", "1 Sam 30:17": "En David sloeg hen van de schemering tot aan de avond van de volgende dag; en er ontkwam niet één man van hen, behalve vierhonderd jonge mannen, die op kamelen reden en vluchtten.", "Gal 6:2": "Draag elkaars lasten, en vervul zo de wet van Christus.", "1 Sam 19:5": "Want hij heeft zijn leven gewaagd, en hij heeft de Filistijn geslagen, en de HEERE heeft een grote overwinning aan heel Israël gegeven; u hebt het gezien, en u bent verblijd geweest; waarom zou u dan tegen onschuldig bloed zondigen, David zonder reden doden?", "Ezra 10:8": "En ieder die niet binnen drie dagen kwam, naar de raad van de vorsten en de oudsten, al zijn bezit zou verbeurd worden; en hijzelf zou afgezonderd worden van de gemeente van de weggevoerden.", "Spr 12:10": "De rechtvaardige kent het leven van zijn dier; maar de barmhartigheden van de goddelozen zijn wreed.", "1 Sam 10:26": "En Saul ging ook naar zijn huis te Gibea, en met hem gingen mannen uit het leger, van wie God het hart geraakt had.", "Joz 20:4": "Als hij vlucht naar één van die steden, dan zal hij staan aan de deur van de stadspoort, en hij zal zijn woorden spreken voor de oren van de oudsten van die stad; dan zullen zij hem bij zich in de stad opnemen, en hem een plaats geven, zodat hij bij hen kan wonen.", "Richt 7:19": "Zo kwam Gideon, en honderd mannen die met hem waren, aan het uiterste van het leger, aan het begin van de middelste nachtwaak, net toen zij de wachters gesteld hadden; en zij bliezen op de bazuinen, en sloegen de kruiken die in hun hand waren stuk.", "1 Sam 14:47": "Toen nam Saul het koningschap over Israël in bezit; en hij streed rondom tegen al zijn vijanden: tegen Moab, en tegen de kinderen van Ammon, en tegen Edom, en tegen de koningen van Zoba, en tegen de Filistijnen; en overal waarheen hij zich wendde, strafte hij hen.", "Deut 25:7-9": "Maar als die man geen zin heeft om de vrouw van zijn broer te nemen, dan zal de vrouw van zijn broer naar de poort gaan, naar de oudsten, en zeggen: Mijn zwager weigert voor zijn broer een naam te doen voortbestaan in Israël; hij wil de plicht van een zwager niet aan mij vervullen. Dan zullen de oudsten van zijn stad hem roepen, en met hem spreken; blijft hij dan daarbij staan en zegt: Ik heb geen zin haar te nemen; dan zal de vrouw van zijn broer voor de ogen van de oudsten tot hem toetreden, en zijn schoen van zijn voet uittrekken, en in zijn gezicht spugen, en verklaren en zeggen: Zo zal met die man gedaan worden, die het huis van zijn broer niet wil opbouwen.", "1 Sam 31:11-13": "Toen de inwoners van Jabes in Gilead hoorden wat de Filistijnen met Saul gedaan hadden, maakten alle strijdbare mannen zich op, en gingen de hele nacht, en zij namen het lichaam van Saul en de lichamen van zijn zonen van de muur bij Beth-San; en zij kwamen bij Jabes en verbrandden ze daar. En zij namen hun beenderen en begroeven ze onder het geboomte bij Jabes; en zij vastten zeven dagen.", "Richt 1:7": "Toen zei Adoni-bezek: Zeventig koningen, van wie de duimen van hun handen en voeten waren afgehouwen, verzamelden de kruimen onder mijn tafel; zoals ik gedaan heb, zo heeft God mij vergolden! En zij brachten hem naar Jeruzalem, en hij stierf daar.", "Ezech 17:13": "Daartoe heeft hij van het koninklijke zaad genomen, en daarmee een verbond gemaakt, en heeft hem tot een eed gebracht, en de machtigen van het land heeft hij weggenomen;", "Jak 2:13": "Want een onbarmhartig oordeel zal komen over hem die geen barmhartigheid bewezen heeft; en de barmhartigheid triomfeert over het oordeel.", "1 Sam 10:17": "Doch Samuël riep het volk samen bij de HEERE, te Mizpa.", "Richt 16:21": "Toen grepen de Filistijnen hem, en groeven zijn ogen uit; en zij voerden hem af naar Gaza, en bonden hem met twee koperen ketenen, en hij moest malen in de gevangenis.", "1 Sam 12:12": "Toen u nu zag dat Nahas, de koning van de kinderen van Ammon, tegen u kwam, zei u tegen mij: Nee, maar een koning zal over ons regeren; terwijl toch de HEERE, uw God, uw Koning was.", "1 Sam 11:4-7": "Toen de boden in Gibea-Sauls kwamen, spraken zij deze woorden ten aanhoren van het volk. Toen verhief heel het volk zijn stem, en zij weenden. En zie, Saul kwam achter de runderen aan uit het veld, en Saul zei: Wat is er met het volk, dat zij wenen? Toen vertelden zij hem de woorden van de mannen van Jabes. Toen kwam de Geest van God vaardig over Saul, toen hij deze woorden hoorde; en zijn toorn ontstak zeer.", "Mark 3:5": "En nadat Hij hen met toorn had aangekeken, bedroefd over de verharding van hun hart, zei Hij tegen de man: Strek uw hand uit. En hij strekte hem uit; en zijn hand werd hersteld, gezond als de andere.", "1 Kron 12:38": "Al deze krijgslieden, die zich in slagorde konden houden, kwamen met een volkomen hart naar Hebron om David koning te maken over heel Israël. En ook heel de rest van Israël was één van hart om David tot koning te maken.", "Ex 14:30": "Zo verloste de HEERE Israël op die dag uit de hand van de Egyptenaren; en Israël zag de Egyptenaren dood aan de oever van de zee.", "Richt 11:5-11": "Toen nu de kinderen van Ammon tegen Israël streden, gingen de oudsten van Gilead heen om Jeftha te halen uit het land van Tob. En zij zeiden tegen Jeftha: Kom, en word onze aanvoerder, zodat wij kunnen strijden tegen de kinderen van Ammon. Maar Jeftha zei tegen de oudsten van Gilead: Hebt u mij niet gehaat, en mij uit het huis van mijn vader verstoten? Waarom bent u dan nu naar mij toegekomen, nu u in benauwdheid verkeert?", "Jer 39:7": "En hij verblindde de ogen van Zedekia, en bond hem met twee koperen ketenen, om hem naar Babel te voeren.", "1 Sam 16:4": "Samuël deed toen wat de HEERE gesproken had, en hij kwam in Bethlehem. Toen kwamen de oudsten van de stad hem bevend tegemoet, en zeiden: Komt u met vrede?", "1 Kron 10:1-10": "En de Filistijnen streden tegen Israël, en de mannen van Israël vluchtten voor de Filistijnen, en zij vielen verslagen op het gebergte Gilboa. En de Filistijnen bleven Saul en zijn zonen op de hielen zitten; en de Filistijnen sloegen Jonathan, en Abinadab, en Malchi-sua, de zonen van Saul. En de strijd werd zwaar tegen Saul, en de schutters met de bogen troffen hem; en hij vreesde zeer voor de schutters.", "Neh 3:18": "Na hem verbeterden hun broeders, Bavai, de zoon van Henadad, de leider van het andere halve deel van Kehila.", "Richt 21:5": "En de kinderen van Israël zeiden: Wie is er, van al de stammen van Israël, die niet is opgekomen in de vergadering tot de HEERE? Want er was een grote eed gezworen aangaande hem die niet opkwam tot de HEERE te Mizpa: Hij zal zeker gedood worden.", "1 Sam 30:4": "Toen verhieven David en het volk dat bij hem was hun stem, en huilden, tot er geen kracht meer in hen was om te huilen.", "Richt 2:4": "En het gebeurde, toen de Engel van de HEERE deze woorden tot alle kinderen van Israël gesproken had, dat het volk zijn stem verhief en weende.", "2 Sam 21:6": "Laat ons zeven mannen van zijn zonen gegeven worden, zodat wij hen voor de HEERE ophangen te Gibea van Saul, o, u verkorene van de HEERE! En de koning zei: Ik zal hen geven.", "1 Kon 19:19": "Zo ging hij vandaar, en vond Elisa, de zoon van Safat; die was aan het ploegen met twaalf span runderen voor zich uit, en hij zelf was bij het twaalfde; en Elia ging naar hem toe, en wierp zijn mantel op hem.", "Ruth 1:16": "Maar Ruth zei: Dring er bij mij niet op aan om u te verlaten, om van achter u terug te keren; want waar u heen zult gaan, zal ik ook heen gaan, en waar u zult overnachten, zal ik overnachten; uw volk is mijn volk, en uw God mijn God.", "Jes 22:1": "De last van het dal van het gezicht. Wat is er nu met u, dat u helemaal naar de daken bent geklommen?", "Richt 20:1": "Toen trokken alle kinderen van Israël uit, en de gemeenschap verzamelde zich, als één man, van Dan af tot Ber-seba toe, ook het land van Gilead, tot de HEERE te Mizpa.", "2 Sam 24:9": "En Joab gaf de som van het getelde volk aan de koning; en in Israël waren achthonderdduizend strijdbare mannen die het zwaard trokken, en de mannen van Juda waren vijfhonderdduizend man.", "Ps 119:148": "Mijn ogen komen de nachtwaken voor, om Uw rede te betrachten.", "1 Sam 13:18": "en een groep sloeg de weg in naar Beth-horon; en een groep sloeg de weg in naar het gebied dat uitziet op het dal Zeboim, naar de woestijn toe.", "1 Sam 30:18": "Zo redde David alles wat de Amalekieten genomen hadden; ook redde David zijn twee vrouwen.", "Gen 21:17": "En God hoorde de stem van de jongen; en de Engel van God riep Hagar toe uit de hemel, en zei tegen haar: Wat is er met u, Hagar? Wees niet bang; want God heeft naar de stem van de jongen geluisterd, op de plaats waar hij is.", "1 Sam 30:26": "Toen David in Ziklag kwam, zond hij van de buit naar de oudsten van Juda, zijn vrienden, en zei: Zie, hier is een geschenk voor u, van de buit van de vijanden van de HEERE.", "Richt 21:2": "Zo kwam het volk naar het huis van God, en zij bleven daar tot de avond, voor het aangezicht van God; en zij hieven hun stem op en weenden met groot geween.", "Richt 1:5": "En zij vonden Adoni-bezek te Bezek, en streden tegen hem; en zij versloegen de Kanaänieten en de Ferezieten.", "Richt 7:16": "En hij deelde de driehonderd man in drie groepen; en hij gaf ieder een bazuin in zijn hand, en lege kruiken, en fakkels in het midden van de kruiken.", "Deut 23:3": "Geen Ammoniet, noch Moabiet zal in de vergadering van de HEERE komen; zelfs hun tiende geslacht zal in eeuwigheid niet in de vergadering van de HEERE komen.", "Mark 6:48": "En Hij zag dat zij zich zeer inspanden om het schip vooruit te krijgen; want de wind was hun tegen; en omstreeks de vierde nachtwake kwam Hij naar hen toe, lopend op de zee, en Hij wilde hen voorbijgaan.", "Ex 3:6": "Hij zei verder: Ik ben de God van uw vader, de God van Abraham, de God van Izak en de God van Jakob. En Mozes verborg zijn gezicht, want hij was bang om God aan te zien.", "1 Sam 11:5-7": "En zie, Saul kwam achter de runderen aan uit het veld, en Saul zei: Wat is er met het volk, dat zij wenen? Toen vertelden zij hem de woorden van de mannen van Jabes. Toen kwam de Geest van God vaardig over Saul, toen hij deze woorden hoorde; en zijn toorn ontstak zeer. En hij nam een paar runderen en hakte ze in stukken, en stuurde die door de hand van de boden naar alle grensgebieden van Israël, en zei: Wie niet zelf uittrekt achter Saul en achter Samuël aan, met zijn runderen zal hetzelfde gedaan worden. Toen viel de vreze van de HEERE op het volk, en zij gingen uit als één man.", "Ex 23:32": "U zult met hen, noch met hun goden, een verbond sluiten.", "Richt 1:4": "En Juda trok op, en de HEERE gaf de Kanaänieten en de Ferezieten in hun hand; en zij versloegen hen bij Bezek, tienduizend man.", "Gen 26:28": "En zij zeiden: Wij hebben duidelijk gezien dat de HEERE met u is; daarom hebben wij gezegd: Laat er toch een eed zijn tussen ons, tussen ons en u, en laat ons een verbond met u sluiten:", "1 Sam 15:34": "Daarna ging Samuël naar Rama; en Saul ging naar zijn huis te Gibea-Sauls.", "Klaagl 5:14": "De oudsten houden op met zitten in de poort, de jongemannen met hun snarenspel.", "Num 1:3": "Van twintig jaar oud en daarboven, allen die in Israël uittrekken ten leger; die zult u tellen naar hun legers, u en Aäron.", "Richt 11:8-33": "En de oudsten van Gilead zeiden tegen Jeftha: Daarom zijn wij nu naar u teruggekomen, dat u met ons meegaat en tegen de kinderen van Ammon strijdt; en u zult ons tot hoofd zijn, over alle inwoners van Gilead. Toen zei Jeftha tegen de oudsten van Gilead: Als u mij terughaalt om te strijden tegen de kinderen van Ammon, en de HEERE hen aan mij overgeeft, zal ik dan uw hoofd zijn? En de oudsten van Gilead zeiden tegen Jeftha: De HEERE zij getuige tussen ons, als wij niet zo doen naar uw woord.", "Ezra 10:14": "Laat toch onze leiders namens de hele gemeente hierover aangesteld worden, en laat allen die in onze steden vreemde vrouwen bij zich hebben laten wonen, op vastgestelde tijden komen, en met hen de oudsten van elke stad en de rechters daarvan; totdat wij van ons afwenden de gloed van de toorn van onze God, vanwege deze zaak.", "1 Sam 10:27": "Doch de verdorven mensen zeiden: Wat zou deze man ons kunnen redden? En zij verachtten hem, en brachten hem geen geschenk. Doch hij deed alsof hij het niet hoorde.", "1 Sam 9:1": "Er was nu een man van Benjamin, wiens naam Kis was, een zoon van Abiël, de zoon van Zeror, de zoon van Bechorath, de zoon van Afiah, de zoon van een man van Jemini, een dapper held.", "Job 40:23": "Zal hij een verbond met u maken? Zult u hem aannemen tot een eeuwige slaaf?", "Jes 59:16": "Omdat Hij zag dat er niemand was, ontzette Hij Zich, omdat er geen voorbidder was; daarom bracht Zijn arm Hem heil, en Zijn gerechtigheid ondersteunde Hem.", "Neh 12:9": "En Bakbukja, en Unni, hun broeders, waren tegenover hen bij de wachten.", "Ex 14:24": "En het gebeurde in dezelfde morgenwake, dat de HEERE, in de kolom van vuur en wolk, neerkeek op het leger van de Egyptenaren; en Hij bracht het leger van de Egyptenaren in verwarring.", "1 Sam 5:3": "Maar toen die van Asdod de volgende dag vroeg opstonden, zie, toen was Dagon voorover op de aarde gevallen voor de ark van de HEERE. En zij namen Dagon en zetten hem weer op zijn plaats.", "Ps 46:2": "God is ons een Toevlucht en Sterkte; Hij is met kracht bevonden een Hulp in benauwdheden.", "1 Sam 17:26": "Toen zei David tegen de mannen die bij hem stonden: Wat zal men de man doen die deze Filistijn verslaat en de smaad van Israël wegneemt? Want wie is deze onbesneden Filistijn, dat hij de slagorden van de levende God zou honen?", "Job 1:17": "Terwijl deze nog sprak, kwam er een ander en zei: De Chaldeeën stelden drie groepen op, en vielen de kamelen aan, en namen ze mee, en sloegen de knechten met de scherpte van het zwaard; en ik ben maar alleen ontkomen om het u te vertellen.", "Ps 21:9": "Uw hand zal alle vijanden vinden; uw rechterhand zal uw haters vinden.", "1 Sam 10:24": "Toen zei Samuël tegen heel het volk: Ziet u wie de HEERE gekozen heeft? Want er is niemand zoals hij onder heel het volk. Toen juichte heel het volk, en zij zeiden: Leve de koning!", "Richt 21:8": "En zij zeiden: Is er iemand van de stammen van Israël, die niet is opgekomen tot de HEERE te Mizpa? En zie, van Jabes in Gilead was niemand opgekomen naar het leger, naar de gemeente.", "1 Sam 13:4-15": "Toen hoorde heel Israël zeggen: Saul heeft de bezetting van de Filistijnen verslagen, en ook is Israël gehaat geworden bij de Filistijnen. Toen werd het volk samengeroepen achter Saul, naar Gilgal. En de Filistijnen werden verzameld om tegen Israël te strijden, dertigduizend wagens en zesduizend ruiters, en volk in menigte als het zand dat aan de oever van de zee is; en zij trokken op en legerden zich te Michmas, ten oosten van Beth-aven. Toen de mannen van Israël zagen dat zij in nood waren (want het volk was benauwd), verborg het volk zich in de holen, en in de doornstruiken, en in de rotsen, en in de vestingen, en in de putten.", "Num 32:20-22": "Toen zei Mozes tegen hen: Als u deze zaak doen zult, als u zich voor het aangezicht van de HEERE toerust ten strijde, en ieder van u die toegerust is, over de Jordaan trekt voor het aangezicht van de HEERE, totdat Hij Zijn vijanden voor Zijn aangezicht uit de bezitting verdreven heeft, en het land voor het aangezicht van de HEERE onderworpen is, dan zult u daarna terugkeren en onschuldig zijn voor de HEERE en voor Israël, en dit land zal u ter bezitting zijn voor het aangezicht van de HEERE.", "Luk 12:38": "En als hij komt in de tweede nachtwake, of komt in de derde nachtwake, en hen zo aantreft, zalig zijn die dienstknechten.", "Hos 13:11": "Ik gaf u een koning in Mijn toorn en nam hem weg in Mijn woede.", "Gen 34:14": "en zij zeiden tegen hen: Wij kunnen dit niet doen, om onze zuster te geven aan een man die onbesneden is; want dat zou voor ons een schande zijn.", "Ef 4:26": "Word toornig, en zondig niet; laat de zon niet ondergaan over uw toorn;", "Hebr 13:3": "Denk aan de gevangenen, alsof u mee gevangen was; en aan hen die kwalijk behandeld worden, alsof u ook zelf in het lichaam kwalijk behandeld was.", "1 Sam 16:13": "Toen nam Samuël de oliehoorn, en zalfde hem te midden van zijn broers. En de Geest van de HEERE kwam vanaf die dag over David, en bleef. Daarna stond Samuël op, en ging naar Rama.", "Jak 4:16": "Maar nu roemt u in uw hoogmoed; alle roem van dat soort is slecht.", "Richt 10:7": "Toen ontstak de toorn van de HEERE tegen Israël; en Hij verkocht hen in de hand van de Filistijnen en in de hand van de Ammonieten.", "Richt 21:5-11": "En de kinderen van Israël zeiden: Wie is er, van al de stammen van Israël, die niet is opgekomen in de vergadering tot de HEERE? Want er was een grote eed gezworen aangaande hem die niet opkwam tot de HEERE te Mizpa: Hij zal zeker gedood worden. En het berouwde de kinderen van Israël over Benjamin, hun broeder; en zij zeiden: Vandaag is één stam van Israël afgesneden. Wat zullen wij doen, als het gaat om vrouwen voor hen die overgebleven zijn? Want wij hebben bij de HEERE gezworen dat wij hun geen van onze dochters tot vrouwen zullen geven.", "Richt 9:43": "Toen nam hij het volk, en verdeelde hen in drie groepen, en legde een hinderlaag in het veld; en hij zag toe, en zie, het volk trok de stad uit, en hij kwam tegen hen op en sloeg hen.", "2 Kron 17:12-19": "Zo nam Josafat toe, en werd bijzonder groot; daartoe bouwde hij in Juda burchten en voorraadsteden. En hij had veel van het werk in de steden van Juda, en krijgslieden, kloeke helden, in Jeruzalem. Dit nu is hun telling, naar de huizen van hun vaderen. In Juda waren leiders van de duizenden: Adna de aanvoerder, en met hem waren driehonderdduizend kloeke helden.", "2 Kron 17:10": "En een verschrikking van de HEERE kwam over alle koninkrijken van de landen, die rondom Juda waren, zodat zij niet streden tegen Josafat.", "Num 1:2": "Neem het aantal op van de gehele vergadering van de kinderen van Israël, naar hun geslachten, naar het huis van hun vaderen, in het getal van de namen, van al wat mannelijk is, hoofd voor hoofd.", "Richt 3:10": "En de Geest van de HEERE kwam op hem, en hij richtte Israël, en trok uit ten strijde; en de HEERE gaf Cuschan-Rischataïm, de koning van Syrië, in zijn hand, zodat zijn hand sterk werd over Cuschan-Rischataïm.", "1 Sam 14:45": "Maar het volk zei tegen Saul: Zou Jonathan sterven, die deze grote verlossing in Israël teweeggebracht heeft? Dat zij verre! Zo waarachtig als de HEERE leeft: geen haar van zijn hoofd zal op de aarde vallen, want hij heeft dit vandaag met God gedaan. Zo redde het volk Jonathan, zodat hij niet stierf.", "Richt 18:23": "En zij riepen de kinderen van Dan achterna; en dezen keerden zich om, en zeiden tegen Micha: Wat is er met u, dat u zo bent bijeengeroepen?", "Ex 14:13": "Doch Mozes zei tegen het volk: Vrees niet, sta vast, en zie het heil van de HEERE, dat Hij heden aan u doen zal, want de Egyptenaren die u heden gezien hebt, zult u niet meer zien in eeuwigheid.", "1 Kron 12:39": "En zij waren daar bij David drie dagen lang, etend en drinkend; want hun broeders hadden voor hen iets toebereid.", "Richt 13:25": "En de Geest van de HEERE begon hem soms te drijven in het leger van Dan, tussen Zora en Esthaol.", "Luk 19:27": "Maar breng die vijanden van mij, die niet wilden dat ik koning over hen zou zijn, hier, en dood ze hier voor mij.", "2 Sam 19:22": "Maar David zei: Wat heb ik met u te maken, zonen van Zeruja, dat u mij vandaag tot tegenstander zou willen zijn? Zou er vandaag iemand gedood moeten worden in Israël? Want weet ik niet dat ik vandaag koning geworden ben over Israël?", "Deut 21:18-21": "Wanneer iemand een koppige en opstandige zoon heeft, die niet luistert naar de stem van zijn vader en de stem van zijn moeder; en zij hem gestraft hebben, en hij toch niet naar hen wil horen, Dan zullen zijn vader en zijn moeder hem grijpen, en hem brengen naar de oudsten van zijn stad, en naar de poort van zijn plaats. En zij zullen tegen de oudsten van zijn stad zeggen: Deze zoon van ons is koppig en opstandig, hij wil niet naar ons luisteren; hij is een brasser en een dronkaard.", "Klaagl 2:19": "Koph. Maak u op, maak geschrei 's nachts, in het begin van de nachtwaken, stort uw hart uit voor het aangezicht van de Heere als water; hef uw handen tot Hem op voor de ziel van uw kinderen, die in onmacht gevallen zijn van honger, vooraan op alle straten.", "Neh 3:12": "En aan zijn hand verbeterde Sallum, de zoon van Lohes, leider van het andere halve deel van Jeruzalem, hij en zijn dochters.", "Deut 22:13-21": "Wanneer een man een vrouw genomen heeft, en tot haar ingegaan is, en haar dan haat, En haar oorzaak geeft tot naspraak, en een kwade naam over haar verspreidt, en zegt: Deze vrouw heb ik genomen, en toen ik tot haar naderde, heb ik haar maagdelijkheid niet gevonden; Dan zullen de vader van deze jonge dochter en haar moeder haar meenemen, en naar de oudsten van de stad brengen, bij de poort, met het bewijs van de maagdelijkheid van deze jonge vrouw.", "1 Sam 14:2": "Saul zat toen aan het uiterste van Gibea onder de granaatappelboom die bij Migron staat; en het volk dat bij hem was, was ongeveer zeshonderd man.", "1 Kon 20:15": "Toen telde hij de jongens van de leiders van de landschappen, en zij waren tweehonderdtwee en dertig; en na hen telde hij al het volk, alle kinderen van Israël, zevenduizend.", "1 Sam 13:15": "Toen stond Samuël op en ging van Gilgal naar Gibea-benjamins; en Saul telde het volk dat bij hem gevonden werd, ongeveer zeshonderd man.", "1 Sam 23:5": "Zo trok David met zijn mannen naar Kehila, en hij streed tegen de Filistijnen, en dreef hun vee weg, en hij bracht hun een grote slag toe; zo verloste David de inwoners van Kehila.", "Matt 14:25": "Maar in de vierde nachtwake kwam Jezus naar hen toe, lopend op de zee.", "Ex 24:5": "En hij zond de jongelingen van de kinderen Israëls, die brandoffers offerden, en de HEERE dankoffers offerden, van jonge ossen.", "2 Sam 24:1-9": "En de toorn van de HEERE ging verder tegen Israël ontsteken; en Hij porde David tegen hen aan en zei: Ga, tel Israël en Juda. De koning zei toen tegen Joab, de legeraanvoerder die bij hem was: Trek nu rond door alle stammen van Israël, van Dan tot Ber-seba toe, en tel het volk, zodat ik het getal van het volk weet. Toen zei Joab tegen de koning: Laat de HEERE, uw God, aan dit volk, hoeveel het er ook mogen zijn, honderdmaal meer toevoegen, zodat de ogen van mijn heer de koning het mogen aanzien; maar waarom heeft mijn heer de koning zin in deze zaak?", "1 Sam 15:4": "Dit verkondigde Saul aan het volk, en hij telde hen te Telaïm, tweehonderdduizend man van het voetvolk, en tienduizend man van Juda.", "Richt 6:34": "Toen bekleedde de Geest van de HEERE Gideon, en hij blies op de bazuin, en de Abiëzrieten werden achter hem bijeengeroepen.", "1 Sam 8:19": "Doch het volk weigerde naar Samuëls stem te horen; en zij zeiden: Nee, maar er zal een koning over ons zijn;", "1 Kon 21:8-14": "Zij schreef dan brieven in de naam van Achab, en verzegelde ze met zijn zegel; en zond de brieven aan de oudsten en aan de edelen, die in zijn stad waren, wonend bij Naboth. En zij schreef in die brieven: Roept een vasten uit, en zet Naboth vooraan onder het volk; En zet tegenover hem twee mannen, zonen van Belial, die tegen hem getuigen en zeggen: U hebt God en de koning gevloekt; en voer hem naar buiten, en stenig hem, dat hij sterft.", "1 Sam 12:17": "Is het niet vandaag de tarweoogst? Ik zal tot de HEERE roepen, en Hij zal donder en regen geven; weet dan, en zie, dat uw kwaad groot is, dat u voor de ogen van de HEERE gedaan hebt, door voor u een koning te begeren.", "1 Kor 15:10": "Maar door de genade van God ben ik wat ik ben; en Zijn genade die aan mij bewezen is, is niet tevergeefs geweest, maar ik heb overvloediger gewerkt dan zij allen; toch niet ik, maar de genade van God, Die met mij is.", "2 Kron 14:14": "En zij sloegen alle steden rondom Gerar; want de verschrikking van de HEERE was over hen; en zij beroofden al de steden, omdat er veel roof in was.", "Ps 18:18": "Hij verloste mij van mijn sterke vijand, en van mijn haters, omdat zij machtiger waren dan ik.", "2 Sam 18:2": "Verder zond David het volk uit, een derde deel onder leiding van Joab, en een derde deel onder leiding van Abisai, de zoon van Zeruja, Joabs broer, en een derde deel onder leiding van Ithai, de Gethiet. En de koning zei tegen het volk: Ik zal ook zelf zeker met u meetrekken.", "1 Sam 7:16": "En hij ging van jaar tot jaar rond naar Beth-el, Gilgal en Mizpa; en hij richtte Israël op al die plaatsen.", "Deut 21:2-8": "Dan zullen uw oudsten en uw rechters uitgaan, en zij zullen meten naar de steden die rondom de gedode liggen. De stad nu die het dichtst bij de gedode ligt, daar zullen de oudsten van die stad een jonge koe nemen waarmee niet gewerkt is, die aan het juk niet getrokken heeft. En de oudsten van die stad zullen de jonge koe naar beneden brengen in een ruw dal, dat niet bewerkt of bezaaid is; en zij zullen deze jonge koe daar in het dal de nek doorhouwen.", "Num 26:2": "Neem de som op van de hele vergadering van de kinderen van Israël, van twintig jaar oud en daarboven, naar het huis van hun vaderen, ieder die in Israël voor het leger uittrekt.", "1 Sam 11:15-31": "Toen ging heel het volk naar Gilgal, en Saul werd daar koning gemaakt voor het aangezicht van de HEERE te Gilgal; en zij offerden daar dankoffers voor het aangezicht van de HEERE; en Saul verheugde zich daar zeer, met alle mannen van Israël.", "Richt 21:8-11": "En zij zeiden: Is er iemand van de stammen van Israël, die niet is opgekomen tot de HEERE te Mizpa? En zie, van Jabes in Gilead was niemand opgekomen naar het leger, naar de gemeente. Want het volk werd geteld, en zie, er was niemand van de inwoners van Jabes in Gilead. Toen zond de vergadering daarheen twaalfduizend man, van de strijdbaarste; en zij geboden hun: Trekt heen, en slaat met de scherpte van het zwaard de inwoners van Jabes in Gilead, met de vrouwen en de kinderen.", "2 Kron 25:5": "En Amazia verzamelde Juda, en stelde hen, naar de families van hun vaderen, aan tot leiders van duizenden en tot leiders van honderden, door heel Juda en Benjamin; en hij monsterde hen, van twintig jaar oud en daarboven, en vond hen driehonderdduizend uitgelezen mannen, die uit konden trekken ten strijde, en die speer en schild konden hanteren.", "Richt 4:16": "En Barak achtervolgde hen, achter de wagens en achter het leger, tot aan Haroseth der heidenen. En het hele leger van Sisera viel door de scherpte van het zwaard, zodat er niemand overbleef.", "1 Kon 20:34": "En hij zei tegen hem: De steden, die mijn vader van uw vader genomen heeft, zal ik teruggeven, en maak u straten in Damaskus, zoals mijn vader in Samaria gemaakt heeft. En ik, antwoordde Achab, zal u met dit verbond dan laten gaan. Zo sloot hij een verbond met hem, en liet hem gaan.", "1 Sam 10:8": "U nu zult voor mijn aangezicht naar Gilgal afgaan, en zie, ik zal naar u toe komen, om brandoffers te offeren, en om dankoffers te offeren; zeven dagen zult u daar wachten, totdat ik naar u toe kom, en u bekendmaak wat u doen zult.", "Hos 13:10": "Waar is uw koning nu? Laat hij u toch redden in al uw steden! En uw rechters, van wie u zei: Geef mij een koning en vorsten?", "Ps 78:71": "Van achter de zogende schapen liet Hij hem komen, om Jakob te weiden, Zijn volk, en Israël, Zijn erfenis.", "2 Kon 25:7": "En zij slachtten de zonen van Zedekia voor zijn ogen, en men verblindde Zedekia's ogen, en zij bonden hem met twee koperen ketenen, en voerden hem naar Babel.", "Richt 20:1-48": "Toen trokken alle kinderen van Israël uit, en de gemeenschap verzamelde zich, als één man, van Dan af tot Ber-seba toe, ook het land van Gilead, tot de HEERE te Mizpa. En de leiders van heel het volk stelden zich op, alle stammen van Israël, in de vergadering van het volk van God, vierhonderdduizend man te voet, die het zwaard uittrokken. (De kinderen van Benjamin nu hoorden dat de kinderen van Israël opgetrokken waren naar Mizpa.) En de kinderen van Israël zeiden: Vertel ons, hoe is dit kwaad gebeurd?", "1 Sam 15:6-23": "En Saul liet de Kenieten zeggen: Ga weg, wijk, trek weg uit het midden van de Amalekieten, opdat ik u niet met hen wegruim; want u hebt barmhartigheid gedaan aan al de kinderen van Israël, toen zij uit Egypte optrokken. Zo weken de Kenieten uit het midden van de Amalekieten. Toen sloeg Saul de Amalekieten van Havila af, tot daar waar u komt bij Sur, dat voor Egypte ligt. En hij ving Agag, de koning van de Amalekieten, levend; maar al het volk verbande hij door de scherpte van het zwaard.", "2 Kon 18:31": "Hoort naar Hizkia niet; want zo zegt de koning van Assyrië: Handelt met mij door een geschenk, en komt tot mij uit, en eet, ieder van zijn wijnstok, en ieder van zijn vijgenboom; en drinkt, ieder het water van zijn bornput;", "1 Sam 12:13-15": "En nu, zie daar de koning die u gekozen hebt, die u begeerd hebt; en zie, de HEERE heeft een koning over u gezet. Als u de HEERE zult vrezen, en Hem dienen, en naar Zijn stem luisteren, en tegen het bevel van de HEERE niet opstandig bent, dan zult u, zowel u als de koning die over u regeren zal, achter de HEERE, uw God, aan blijven. Maar als u naar de stem van de HEERE niet zult luisteren, maar tegen het bevel van de HEERE opstandig bent, dan zal de hand van de HEERE tegen u zijn, zoals tegen uw vaders.", "Neh 3:16": "Na hem verbeterde Nehemia, de zoon van Azbuk, leider van het halve deel van Beth-Zur, tot tegenover Davids graven, en tot aan de aangelegde vijver, en tot aan het huis van de helden."}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H5927\">Toen</span> trok <span class=\"wl\" data-l=\"L2\" data-code=\"H5176\">Nahas</span>, <span class=\"wl\" data-l=\"L2\" data-code=\"H5176\">de</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H5984\">Ammoniet</span>, <span class=\"wl\" data-l=\"L3\" data-code=\"H5984\">op</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H2583\">en</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H2583\">belegerde</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H3003\">Jabes</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H3003\">in</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H1568\">Gilead</span>. <span class=\"wl\" data-l=\"L7\" data-code=\"H3605\">En</span> alle <span class=\"wl\" data-l=\"L8\" data-code=\"H582\">mannen</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H582\">van</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H3003\">Jabes</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H559\">zeiden</span> tegen <span class=\"wl\" data-l=\"L11\" data-code=\"H5176\">Nahas</span>: Sluit <span class=\"wl\" data-l=\"L12\" data-code=\"H1285\">een</span> <span class=\"wl\" data-l=\"L12\" data-code=\"H1285\">verbond</span> <span class=\"wl\" data-l=\"L12\" data-code=\"H1285\">met</span> <span class=\"wl\" data-l=\"L13\" data-code=\"H5647\">ons</span>, en <span class=\"wl\" data-l=\"L13\" data-code=\"H5647\">wij</span> <sp an> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H5176\">Nahash,</span> <span class=\"wl wl-kjv\" data-code=\"H3772\">Make</span> a <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> with us, and we will <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> thee.", "2": "And <span class=\"wl wl-kjv\" data-code=\"H5176\">Nahash</span> the <span class=\"wl wl-kjv\" data-code=\"H5984\">Ammonite</span> <span class=\"wl wl-kjv\" data-code=\"H559\">answered</span> them, On <span class=\"wl wl-kjv\" data-code=\"H2063\">this</span> condition will I <span class=\"wl wl-kjv\" data-code=\"H3772\">make</span> a covenant with you, that I may thrust <span class=\"wl wl-kjv\" data-code=\"H5365\">out</span> all your <span class=\"wl wl-kjv\" data-code=\"H3225\">right</span> <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">lay</span> it for a <span class=\"wl wl-kjv\" data-code=\"H2781\">reproach</span> upon all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>", "3": "And the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of <span class=\"wl wl-kjv\" data-code=\"H3003\">Jabesh</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Give us <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days'</span> <span class=\"wl wl-kjv\" data-code=\"H7503\">respite,</span> that we may <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> unto all the <span class=\"wl wl-kjv\" data-code=\"H1366\">coasts</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> and then, if there be no man to <span class=\"wl wl-kjv\" data-code=\"H3467\">save</span> us, we will come <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> to thee.", "4": "Then <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> the <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> to <span class=\"wl wl-kjv\" data-code=\"H1390\">Gibeah</span> of <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> and <span class=\"wl wl-kjv\" data-code=\"H1696\">told</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">tidings</span> in the <span class=\"wl wl-kjv\" data-code=\"H241\">ears</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people:</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> their <span class=\"wl wl-kjv\" data-code=\"H6963\">voices,</span> and <span class=\"wl wl-kjv\" data-code=\"H1058\">wept.</span>", "5": "And, behold, <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> the <span class=\"wl wl-kjv\" data-code=\"H1241\">herd</span> out of the <span class=\"wl wl-kjv\" data-code=\"H7704\">field;</span> and <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> What aileth the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that they <span class=\"wl wl-kjv\" data-code=\"H1058\">weep?</span> And they <span class=\"wl wl-kjv\" data-code=\"H5608\">told</span> him the <span class=\"wl wl-kjv\" data-code=\"H1697\">tidings</span> of the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3003\">Jabesh.</span>", "6": "And the <span class=\"wl wl-kjv\" data-code=\"H7307\">Spirit</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H6743\">came</span> upon <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> when he <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> those <span class=\"wl wl-kjv\" data-code=\"H1697\">tidings,</span> and his <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> was <span class=\"wl wl-kjv\" data-code=\"H2734\">kindled</span> <span class=\"wl wl-kjv\" data-code=\"H3966\">greatly.</span>", "7": "And he <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> a <span class=\"wl wl-kjv\" data-code=\"H6776\">yoke</span> of <span class=\"wl wl-kjv\" data-code=\"H1241\">oxen,</span> and hewed them in <span class=\"wl wl-kjv\" data-code=\"H5408\">pieces,</span> and <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> them throughout all the <span class=\"wl wl-kjv\" data-code=\"H1366\">coasts</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> by the <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> of <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Whosoever cometh not <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> and <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel,</span> so shall it be <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> unto his <span class=\"wl wl-kjv\" data-code=\"H1241\">oxen.</span> And the <span class=\"wl wl-kjv\" data-code=\"H6343\">fear</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> on the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and they came <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> with <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H376\">consent.</span>", "8": "And when he <span class=\"wl wl-kjv\" data-code=\"H6485\">numbered</span> them in <span class=\"wl wl-kjv\" data-code=\"H966\">Bezek,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> were <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand,</span> and the <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> <span class=\"wl wl-kjv\" data-code=\"H7970\">thirty</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand.</span>", "9": "And they <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> that <span class=\"wl wl-kjv\" data-code=\"H935\">came,</span> Thus shall ye <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto the <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3003\">Jabeshgilead,</span> To <span class=\"wl wl-kjv\" data-code=\"H4279\">morrow,</span> by that time the <span class=\"wl wl-kjv\" data-code=\"H8121\">sun</span> be <span class=\"wl wl-kjv\" data-code=\"H2527\">hot,</span> ye shall have <span class=\"wl wl-kjv\" data-code=\"H8668\">help.</span> And the <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> and <span class=\"wl wl-kjv\" data-code=\"H5046\">shewed</span> it to the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3003\">Jabesh;</span> and they were <span class=\"wl wl-kjv\" data-code=\"H8055\">glad.</span>", "10": "Therefore the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3003\">Jabesh</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> To <span class=\"wl wl-kjv\" data-code=\"H4279\">morrow</span> we will come <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> unto you, and ye shall <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> with us all that <span class=\"wl wl-kjv\" data-code=\"H5869\">seemeth</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> unto you.", "11": "And it was so on the <span class=\"wl wl-kjv\" data-code=\"H4283\">morrow,</span> that <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> in <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H7218\">companies;</span> and they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> into the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H4264\">host</span> in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning</span> <span class=\"wl wl-kjv\" data-code=\"H821\">watch,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">slew</span> the <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammonites</span> until the <span class=\"wl wl-kjv\" data-code=\"H2527\">heat</span> of the <span class=\"wl wl-kjv\" data-code=\"H3117\">day:</span> and it came to pass, that they which <span class=\"wl wl-kjv\" data-code=\"H7604\">remained</span> were <span class=\"wl wl-kjv\" data-code=\"H6327\">scattered,</span> so that <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> of them were not <span class=\"wl wl-kjv\" data-code=\"H7604\">left</span> <span class=\"wl wl-kjv\" data-code=\"H3162\">together.</span>", "12": "And the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel,</span> Who is he that <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Shall <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">reign</span> over us? <span class=\"wl wl-kjv\" data-code=\"H5414\">bring</span> the <span class=\"wl wl-kjv\" data-code=\"H582\">men,</span> that we m /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +

  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };

})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    let h = '<div class="verg-kop">Grondwoorden</div>';
    if (!heeftB && !heeftK) {
      h += '<em>Nog geen woordkoppeling voor dit vers.</em>';
    } else {
      if (heeftB) h += `<div class="tsk-kop">SVnu</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      h += '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
    }
    h += '<div class="verg-kop" style="margin-top:1.4rem">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>

      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');

    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>

    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>

function toggle(n) {

  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een vers: snel wisselen van vertaling ---------- */
(function () {
  const menu = document.createElement('div');
  menu.id = 'vertmenu';
  menu.style.cssText = 'position:absolute;display:none;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.3rem;font-family:sans-serif;font-size:.85rem;z-index:30;min-width:7rem;';
  document.body.appendChild(menu);
  function toon(x, y) {
    menu.innerHTML = Object.keys(D.vertalingen).map(naam =>
      `<div class="vm-optie" data-v="${naam}" style="padding:.35rem .6rem;border-radius:5px;cursor:pointer;${naam === vertaling ? 'font-weight:700;color:var(--accent-donker)' : ''}">${naam}</div>`
    ).join('');
    const breedte = document.documentElement.clientWidth;
    menu.style.left = Math.max(4, Math.min(x, breedte - 130)) + 'px';
    menu.style.top = y + 'px';
    menu.style.display = 'block';
  }
  document.addEventListener('contextmenu', e => {
    const rij = e.target.closest('.vers');
    if (!rij) return;
    e.preventDefault();
    toon(e.pageX, e.pageY);
  });
  menu.addEventListener('mouseover', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = 'var(--bg-soft)';
  });
  menu.addEventListener('mouseout', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = '';
  });
  menu.addEventListener('click', e => {
    const o = e.target.closest('.vm-optie');
    if (!o) return;
    vertaling = o.dataset.v;
    const kies = document.getElementById('vertaalkies');
    if (kies) kies.value = vertaling;
    bouwRijen();
    menu.style.display = 'none';
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#vertmenu')) menu.style.display = 'none';
  });
  document.addEventListener('scroll', () => { menu.style.display = 'none'; }, true);
})();
</script>
