listijnen? Laten wij uit Silo de ark van het verbond van de HEERE tot ons nemen, en laat die in ons midden komen, zodat zij ons verlost uit de hand van onze vijanden.","4":"Het volk zond dan naar Silo, en men bracht vandaar de ark van het verbond van de HEERE van de heerscharen*, die tussen de cherubs† woont; en de twee zonen van Eli, Hofni en Pinehas, waren daar bij de ark van het verbond van God.","5":"En het gebeurde, toen de ark van het verbond van de HEERE in het leger kwam, dat heel Israël juichte met een groot gejuich, zodat de aarde dreunde.","6":"Toen de Filistijnen het geluid van dat gejuich hoorden, zeiden zij: Wat betekent dit grote gejuich in het leger van de Hebreeën? Toen begrepen zij dat de ark van de HEERE in het leger gekomen was.","7":"Daarom werden de Filistijnen bang, want zij zeiden: God is in het leger gekomen. En zij zeiden: Wee ons, want zoiets is eerder nooit gebeurd!","8":"Wee ons, wie zal ons redden uit de hand van deze machtige goden? Dit zijn dezelfde goden die de Egyptenaren met allerlei plagen troffen in de woestijn.","9":"Wees sterk, en gedraag u als mannen, Filistijnen, zodat u de Hebreeën niet gaat dienen, zoals zij u gediend hebben; wees dus mannen, en strijd.","10":"Toen streden de Filistijnen, en Israël werd verslagen, en zij vluchtten ieder naar zijn tent; en er kwam een zeer grote nederlaag, zodat er van Israël dertigduizend man van het voetvolk vielen.","11":"En de ark van God werd genomen, en de twee zonen van Eli, Hofni en Pinehas, stierven.","12":"Toen liep er een Benjaminiet uit de slagorde, en kwam dezelfde dag in Silo aan; zijn kleren waren gescheurd, en er was aarde op zijn hoofd.","13":"En toen hij aankwam, zie, daar zat Eli op een stoel bij de kant van de weg, uit te kijken; want zijn hart beefde vanwege de ark van God. Toen de man de stad binnenkwam om het te vertellen, schreeuwde de hele stad het uit.","14":"Toen Eli het geluid van het geroep hoorde, zei hij: Wat betekent dit geluid van deze opschudding? Toen haastte die man zich, en hij kwam en vertelde het aan Eli.","15":"(Eli was namelijk achtennegentig jaar oud, en zijn ogen waren star geworden, zodat hij niet kon zien.)","16":"En die man zei tegen Eli: Ik ben het die uit de slagorde kom, en ik ben vandaag uit de slagorde gevlucht. Hij zei toen: Wat is er gebeurd, mijn zoon?","17":"Toen antwoordde de brenger van de boodschap en zei: Israël is gevlucht voor de Filistijnen, en er is ook een grote nederlaag onder het volk gebeurd; bovendien zijn uw twee zonen, Hofni en Pinehas, gestorven, en de ark van God is genomen.","18":"En het gebeurde, toen hij de ark van God noemde, dat hij achterover van de stoel viel, bij de kant van de poort, en zijn nek brak, en stierf; want de man was oud en zwaar. En hij had Israël veertig jaar geleid.","19":"En zijn schoondochter, de vrouw van Pinehas, was zwanger en stond op het punt te bevallen; toen zij het bericht hoorde dat de ark van God genomen was, en dat haar schoonvader en haar man gestorven waren, kromde zij zich ineen en baarde; want haar weeën overvielen haar.","20":"En omstreeks het tijdstip van haar sterven zeiden de vrouwen die bij haar stonden: Wees niet bang, want u hebt een zoon gebaard. Maar zij antwoordde niet, en trok het zich niet aan.","21":"En zij noemde de jongen Ikabod, en zei: De eer is weggevoerd uit Israël! Omdat de ark van God gevankelijk was weggevoerd, en vanwege haar schoonvader en haar man.","22":"En zij zei: De eer is gevankelijk weggevoerd uit Israël, want de ark van God is genomen."},"SV":{"1":"En het woord van Samuël geschiedde aan gans Israël. En Israël toog uit, den Filistijnen tegemoet, ten strijde, en legerde zich bij Eben-haezer, maar de Filistijnen legerden zich bij Afek.","2":"En de Filistijnen stelden zich in slagorden, om Israël te ontmoeten; en als zich de strijd uitspreidde, zo werd Israël voor der Filistijnen aangezicht geslagen; want zij sloegen in de slagorden in het veld omtrent vier duizend man.","3":"Als het volk *wederom* in het leger gekomen was, zo zeiden de oudsten van Israël: Waarom heeft ons de HEERE heden geslagen voor het aangezicht der Filistijnen? Laat ons van Silo tot ons nemen de ark des verbonds des HEEREN, en laat die in het midden van ons komen, opdat zij ons verlosse van de hand onzer vijanden.","4":"Het volk dan zond naar Silo, en men bracht van daar de ark des verbonds des HEEREN der heirscharen, die tussen de cherubim woont; en de twee zonen van Eli, Hofni en Pinehas, waren daar met de ark des verbonds van God.","5":"En het geschiedde, als de ark des verbonds des HEEREN in het leger kwam, zo juichte gans Israël met een groot gejuich, alzo dat de aarde dreunde.","6":"Als nu de Filistijnen de stem van het juichen hoorden, zo zeiden zij: Wat is de stem van dit grote juichen in het leger der Hebreën? Toen vernamen zij, dat de ark des HEEREN in het leger gekomen was.","7":"Daarom vreesden de Filistijnen, want zij zeiden: God is in het leger gekomen. En zij zeiden: Wee ons, want diergelijke is gisteren *en* eergisteren niet geschied!","8":"Wee ons, wie zal ons redden uit de hand van deze heerlijke goden? Dit zijn dezelfde goden, die de Egyptenaars met alle plagen geplaagd hebben, bij de woestijn.","9":"Zijt sterk, en weest mannen, gij Filistijnen, opdat gij de Hebreën niet misschien dient, gelijk als zij ulieden gediend hebben; zo zijt mannen, en strijdt.","10":"Toen streden de Filistijnen, en Israël werd geslagen, en zij vloden een iegelijk in zijn tenten; en er geschiedde een zeer grote nederlaag, zodat er van Israël vielen dertig duizend voetvolks.","11":"En de ark Gods werd genomen, en de twee zonen van Eli, Hofni en Pinehas, stierven.","12":"Toen liep er een Benjaminiet uit de slagorden, en kwam te Silo denzelfden dag; en zijn klederen waren gescheurd, en er was aarde op zijn hoofd.","13":"En als hij kwam, ziet, zo zat Eli op een stoel aan de zijde van den weg, uitziende; want zijn hart was sidderende vanwege de ark Gods. Als die man kwam, om *zulks* te verkondigen in de stad, toen schreeuwde de ganse stad.","14":"En als Eli de stem des geroeps hoorde, zo zeide hij: Wat is de stem dezer beroerte? Toen haastte zich die man, en hij kwam en boodschapte het aan Eli.","15":"( Eli nu was een man van acht en negentig jaren, en zijn ogen stonden stijf, dat hij niet zien kon.)","16":"En die man zeide tot Eli: Ik ben het, die uit de slagorden kom, en ik ben heden uit de slagorden gevloden. Hij dan zeide: Wat is er geschied, mijn zoon?","17":"Toen antwoordde hij, die de boodschap bracht, en zeide: Israël is gevloden voor het aangezicht der Filistijnen, en er is ook een grote nederlaag onder het volk geschied; daarenboven zijn uw twee zonen, Hofni en Pinehas, gestorven, en de ark Gods is genomen.","18":"En het geschiedde, als hij van de ark Gods vermeldde, zo viel hij achterwaarts van den stoel af, aan de zijde der poort, en brak den nek, en stierf; want de man was oud en zwaar; en hij richtte Israël veertig jaren.","19":"En zijn schoondochter, de huisvrouw van Pinehas, was bevrucht, zij zou baren; als deze de tijding hoorde, dat de ark Gods genomen was, en haar schoonvader gestorven was, en haar man, zo kromde zij zich, en baarde; want haar weeën overvielen haar.","20":"En omtrent den tijd van haar sterven, zo spraken de vrouwen, die bij haar stonden: Vrees niet, want gij hebt een zoon gebaard. Doch zij antwoordde niet, en nam het niet ter harte.","21":"En zij noemde het jongsken Ikabod, zeggende: De eer is weggevoerd uit Israël! Omdat de ark Gods gevankelijk weggevoerd was, en om haars schoonvaders en haars mans wil.","22":"En zij zeide: De eer is gevankelijk weggevoerd uit Israël, want de ark Gods is genomen."},"KJV":{"1":"And the word of Samuel came to all Israel. Now Israel went out against the Philistines to battle, and pitched beside Ebenezer: and the Philistines pitched in Aphek.","2":"And the Philistines put themselves in array against Israel: and when they joined battle, Israel was smitten before the Philistines: and they slew of the army in the field about four thousand men.","3":"And when the people were come into the camp, the elders of Israel said, Wherefore hath the LORD smitten us to day before the Philistines? Let us fetch the ark of the covenant of the LORD out of Shiloh unto us, that, when it cometh among us, it may save us out of the hand of our enemies.","4":"So the people sent to Shiloh, that they might bring from thence the ark of the covenant of the LORD of hosts, which dwelleth between the cherubims: and the two sons of Eli, Hophni and Phinehas, were there with the ark of the covenant of God.","5":"And when the ark of the covenant of the LORD came into the camp, all Israel shouted with a great shout, so that the earth rang again.","6":"And when the Philistines heard the noise of the shout, they said, What meaneth the noise of this great shout in the camp of the Hebrews? And they understood that the ark of the LORD was come into the camp.","7":"And the Philistines were afraid, for they said, God is come into the camp. And they said, Woe unto us! for there hath not been such a thing heretofore.","8":"Woe unto us! who shall deliver us out of the hand of these mighty Gods? these are the Gods that smote the Egyptians with all the plagues in the wilderness.","9":"Be strong, and quit yourselves like men, O ye Philistines, that ye be not servants unto the Hebrews, as they have been to you: quit yourselves like men, and fight.","10":"And the Philistines fought, and Israel was smitten, and they fled every man into his tent: and there was a very great slaughter; for there fell of Israel thirty thousand footmen.","11":"And the ark of God was taken; and the two sons of Eli, Hophni and Phinehas, were slain.","12":"And there ran a man of Benjamin out of the army, and came to Shiloh the same day with his clothes rent, and with earth upon his head.","13":"And when he came, lo, Eli sat upon a seat by the wayside watching: for his heart trembled for the ark of God. And when the man came into the city, and told it, all the city cried out.","14":"And when Eli heard the noise of the crying, he said, What meaneth the noise of this tumult? And the man came in hastily, and told Eli.","15":"Now Eli was ninety and eight years old; and his eyes were dim, that he could not see.","16":"And the man said unto Eli, I am he that came out of the army, and I fled to day out of the army. And he said, What is there done, my son?","17":"And the messenger answered and said, Israel is fled before the Philistines, and there hath been also a great slaughter among the people, and thy two sons also, Hophni and Phinehas, are dead, and the ark of God is taken.","18":"And it came to pass, when he made mention of the ark of God, that he fell from off the seat backward by the side of the gate, and his neck brake, and he died: for he was an old man, and heavy. And he had judged Israel forty years.","19":"And his daughter in law, Phinehas' wife, was with child, near to be delivered: and when she heard the tidings that the ark of God was taken, and that her father in law and her husband were dead, she bowed herself and travailed; for her pains came upon her.","20":"And about the time of her death the women that stood by her said unto her, Fear not; for thou hast born a son. But she answered not, neither did she regard it.","21":"And she named the child Ichabod, saying, The glory is departed from Israel: because the ark of God was taken, and because of her father in law and her husband.","22":"And she said, The glory is departed from Israel: for the ark of God is taken."}},"tsk":{"1":[{"kopje":"kwam","refs":["1 Sam 3:11"]},{"kopje":"Eben-haëzer","refs":["1 Sam 5:1","1 Sam 7:12"]},{"kopje":"Afek","refs":["Joz 15:53","1 Sam 29:1","Joz 19:30","1 Kon 20:30"]}],"2":[{"kopje":"stelden zich op","refs":["1 Sam 17:8","1 Sam 17:21"]},{"kopje":"Israël","refs":["Joz 7:5-8","Joz 7:12","Ps 44:10","Ps 44:11"]},{"kopje":"want zij","refs":["Ps 79:7","Ps 79:8","Ps 106:40","Ps 106:41","Klaagl 3:40"]}],"3":[{"kopje":"Waarom" code=\"H3027\">hand</span> of these <span class=\"wl wl-kjv\" data-code=\"H117\">mighty</span> <span class=\"wl wl-kjv\" data-code=\"H430\">Gods?</span> these are the <span class=\"wl wl-kjv\" data-code=\"H430\">Gods</span> that <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians</span> with all the <span class=\"wl wl-kjv\" data-code=\"H4347\">plagues</span> in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness.</span>","9":"Be <span class=\"wl wl-kjv\" data-code=\"H2388\">strong,</span> and <span class=\"wl wl-kjv\" data-code=\"H1961\">quit</span> yourselves like <span class=\"wl wl-kjv\" data-code=\"H582\">men,</span> O ye <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines,</span> that ye be not <span class=\"wl wl-kjv\" data-code=\"H5647\">servants</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5680\">Hebrews,</span> as they have <span class=\"wl wl-kjv\" data-code=\"H5647\">been</span> to you: <span class=\"wl wl-kjv\" data-code=\"H1961\">quit</span> yourselves like <span class=\"wl wl-kjv\" data-code=\"H582\">men,</span> and <span class=\"wl wl-kjv\" data-code=\"H3898\">fight.</span>","10":"And the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> <span class=\"wl wl-kjv\" data-code=\"H3898\">fought,</span> and <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> was <span class=\"wl wl-kjv\" data-code=\"H5062\">smitten,</span> and they <span class=\"wl wl-kjv\" data-code=\"H5127\">fled</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> into his <span class=\"wl wl-kjv\" data-code=\"H168\">tent:</span> and there was a <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4347\">slaughter;</span> for there <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H7970\">thirty</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H7273\">footmen.</span>","11":"And the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> was <span class=\"wl wl-kjv\" data-code=\"H3947\">taken;</span> and the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H5941\">Eli,</span> <span class=\"wl wl-kjv\" data-code=\"H2652\">Hophni</span> and <span class=\"wl wl-kjv\" data-code=\"H6372\">Phinehas,</span> were <span class=\"wl wl-kjv\" data-code=\"H4191\">slain.</span>","12":"And there <span class=\"wl wl-kjv\" data-code=\"H7323\">ran</span> a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin</span> out of the <span class=\"wl wl-kjv\" data-code=\"H4634\">army,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H7887\">Shiloh</span> the same <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> with his <span class=\"wl wl-kjv\" data-code=\"H4055\">clothes</span> <span class=\"wl wl-kjv\" data-code=\"H7167\">rent,</span> and with <span class=\"wl wl-kjv\" data-code=\"H127\">earth</span> upon his <span class=\"wl wl-kjv\" data-code=\"H7218\">head.</span>","13":"And when he <span class=\"wl wl-kjv\" data-code=\"H935\">came,</span> lo, <span class=\"wl wl-kjv\" data-code=\"H5941\">Eli</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> upon a <span class=\"wl wl-kjv\" data-code=\"H3678\">seat</span> by the <span class=\"wl wl-kjv\" data-code=\"H1870\">wayside</span> <span class=\"wl wl-kjv\" data-code=\"H6822\">watching:</span> for his <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> <span class=\"wl wl-kjv\" data-code=\"H2730\">trembled</span> for the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God.</span> And when the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> into the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> it, all the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> cried <span class=\"wl wl-kjv\" data-code=\"H2199\">out.</span>","14":"And when <span class=\"wl wl-kjv\" data-code=\"H5941\">Eli</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> the <span class=\"wl wl-kjv\" data-code=\"H6963\">noise</span> of the <span class=\"wl wl-kjv\" data-code=\"H6818\">crying,</span> he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> What meaneth the <span class=\"wl wl-kjv\" data-code=\"H6963\">noise</span> of this <span class=\"wl wl-kjv\" data-code=\"H1995\">tumult?</span> And the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> in <span class=\"wl wl-kjv\" data-code=\"H4116\">hastily,</span> and <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> <span class=\"wl wl-kjv\" data-code=\"H5941\">Eli.</span>","15":"Now <span class=\"wl wl-kjv\" data-code=\"H5941\">Eli</span> was <span class=\"wl wl-kjv\" data-code=\"H8673\">ninety</span> and <span class=\"wl wl-kjv\" data-code=\"H8083\">eight</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">old;</span> and his <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> were <span class=\"wl wl-kjv\" data-code=\"H6965\">dim,</span> that he <span class=\"wl wl-kjv\" data-code=\"H3201\">could</span> not <span class=\"wl wl-kjv\" data-code=\"H7200\">see.</span>","16":"And the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H5941\">Eli,</span> I am he that <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> out of the <span class=\"wl wl-kjv\" data-code=\"H4634\">army,</span> and I <span class=\"wl wl-kjv\" data-code=\"H5127\">fled</span> to <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> out of the <span class=\"wl wl-kjv\" data-code=\"H4634\">army.</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> What is there <span class=\"wl wl-kjv\" data-code=\"H1697\">done,</span> my <span class=\"wl wl-kjv\" data-code=\"H1121\">son?</span>","17":"And the <span class=\"wl wl-kjv\" data-code=\"H1319\">messenger</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> is <span class=\"wl wl-kjv\" data-code=\"H5127\">fled</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines,</span> and there hath been also a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4046\">slaughter</span> among the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> also, <span class=\"wl wl-kjv\" data-code=\"H2652\">Hophni</span> and <span class=\"wl wl-kjv\" data-code=\"H6372\">Phinehas,</span> are <span class=\"wl wl-kjv\" data-code=\"H4191\">dead,</span> and the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> is <span class=\"wl wl-kjv\" data-code=\"H3947\">taken.</span>","18":"And it came to pass, when he made <span class=\"wl wl-kjv\" data-code=\"H2142\">mention</span> of the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> that he <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> from off the <span class=\"wl wl-kjv\" data-code=\"H3678\">seat</span> <span class=\"wl wl-kjv\" data-code=\"H322\">backward</span> <span class=\"wl wl-kjv\" data-code=\"H1157\">by</span> the <span class=\"wl wl-kjv\" data-code=\"H3027\">side</span> of the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate,</span> and his <span class=\"wl wl-kjv\" data-code=\"H4665\">neck</span> <span class=\"wl wl-kjv\" data-code=\"H7665\">brake,</span> and he <span class=\"wl wl-kjv\" data-code=\"H4191\">died:</span> for he was an <span class=\"wl wl-kjv\" data-code=\"H2204\">old</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> and <span class=\"wl wl-kjv\" data-code=\"H3513\">heavy.</span> And he had <span class=\"wl wl-kjv\" data-code=\"H8199\">judged</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H705\">forty</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years.</span>","19":"And his daughter in <span class=\"wl wl-kjv\" data-code=\"H3618\">law,</span> <span class=\"wl wl-kjv\" data-code=\"H6372\">Phinehas'</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wife,</span> was with <span class=\"wl wl-kjv\" data-code=\"H2030\">child,</span> near to be <span class=\"wl wl-kjv\" data-code=\"H3205\">delivered:</span> and when she <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> the <span class=\"wl wl-kjv\" data-code=\"H8052\">tidings</span> <span class=\"wl wl-kjv\" data-code=\"H413\">that</span> the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> was <span class=\"wl wl-kjv\" data-code=\"H3947\">taken,</span> and that her father in <span class=\"wl wl-kjv\" data-code=\"H2524\">law</span> and her <span class=\"wl wl-kjv\" data-code=\"H376\">husband</span> were <span class=\"wl wl-kjv\" data-code=\"H4191\">dead,</span> she <span class=\"wl wl-kjv\" data-code=\"H3766\">bowed</span> herself and <span class=\"wl wl-kjv\" data-code=\"H3205\">travailed;</span> for her <span class=\"wl wl-kjv\" data-code=\"H6735\">pains</span> <span class=\"wl wl-kjv\" data-code=\"H2015\">came</span> upon her.","20":"And about the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> of her <span class=\"wl wl-kjv\" data-code=\"H4191\">death</span> the women that <span class=\"wl wl-kjv\" data-code=\"H5324\">stood</span> by her <span class=\"wl wl-kjv\" data-code=\"H1696\">said</span> unto her, <span class=\"wl wl-kjv\" data-code=\"H3372\">Fear</span> not; for thou hast <span class=\"wl wl-kjv\" data-code=\"H3205\">born</span> a <span class=\"wl wl-kjv\" data-code=\"H1121\">son.</span> But she <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> not, neither did she <span class=\"wl wl-kjv\" data-code=\"H7896\">regard</span> it.","21":"And she <span class=\"wl wl-kjv\" data-code=\"H7121\">named</span> the <span class=\"wl wl-kjv\" data-code=\"H5288\">child</span> <span class=\"wl wl-kjv\" data-code=\"H350\">Ichabod,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> The <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> is <span class=\"wl wl-kjv\" data-code=\"H1540\">departed</span> from <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> <span class=\"wl wl-kjv\" data-code=\"H413\">because</span> the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> was <span class=\"wl wl-kjv\" data-code=\"H3947\">taken,</span> and because of her father in <span class=\"wl wl-kjv\" data-code=\"H2524\">law</span> and her <span class=\"wl wl-kjv\" data-code=\"H376\">husband.</span>","22":"And she <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> The <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> is <span class=\"wl wl-kjv\" data-code=\"H1540\">departed</span> from <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> for the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> is <span class=\"wl wl-kjv\" data-code=\"H3947\">taken.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"het woord van Samuël","tekst":"Dat is, de profetie, die Samuël van den Heere geopenbaard was, heeft hij het volk verkondigd, en is volbracht; zie 1Sa 3:11, 1Sa 3:21."},{"catchword":"Eben-haëzer,","tekst":"Dat is, steen der hulpe, helpsteen. Deze plaats heeft eerst naderhand dezen naam gekregen. Zie onder, 1Sa 7:12; alzo wordt Luz Gen 12 genoemd, welken naam Jakob deze plaats lang daarna eerst gegeven heeft; Gen 28"},{"catchword":"Afek","tekst":"Een stad in den stam van Juda gelegen; Jos 15:53. Doch er is een ander Afek in den stam van Isschaschar, 1Sa 29; ook een in den stam van Aser, Jos 19:30; Jdg 1:31."}],"2":[{"catchword":"de strijd uitspreidde,","tekst":"Dat is, de krijgslieden die streden. Hij wil zeggen, wanneer nu al de benden en compagnieën beiderzijds aan elkander gekomen waren om te vechten, zo sloegen zij, enz."},{"catchword":"zij sloegen","tekst":"Te weten, de Filistijnen."},{"catchword":"in de slagorden","tekst":"Hij wil zeggen, gedurende den slag, toen de beide legers nog in hun slagorden stonden."}],"3":[{"catchword":"Laat ons van Silo tot ons nemen de ark des verbonds des HEEREN,","tekst":"Dit hebben zij gedaan zonder God raad te vragen, menende dat deze uiterlijke ceremonie hen zou kunnen beschermen, of verlossen uit de handen hunner vijanden."}],"4":[{"catchword":"de cherubim woont;","tekst":"Van tussen welke God tot Mozes en anderen sprak; Exo 25:22; Num 7:89."},{"catchword":"daar met de ark des verbonds van God","tekst":"Te weten, in het leger."}],"6":[{"catchword":"is de stem","tekst":"Dat is, beduidt."}],"8":[{"catchword":"deze heerlijke Goden?","tekst":"Of, van dezen heerlijken God."},{"catchword":"de woestijn","tekst":"Dat is, in de Schelfzee, welke ligt aan de woestijn Etham. Zie Exo 13:20, en Exo 14."}],"10":[{"catchword":"zijn tenten;","tekst":"Dat is, in zijn huis, gelijk onder, 1Sa 13:2, en 1Ki 12:16, enz."},{"catchword":"nederlaag,","tekst":"Hebreeuws, slag."}],"12":[{"catchword":"zijn klederen waren gescheurd,","tekst":"Tot een teken van droefenis, en dat hij kwade tijding bracht. Van deze manier van doen, zie de aantekening Gen 37:29; Jos 7:6, enz., en 2Sa 1:2, 2Sa 1:11."},{"catchword":"er was aarde op zijn hoofd","tekst":"Zie dergelijk exempel Jos 7:6, en 2Sa 1:2."}],"13":[{"catchword":"schreeuwde de ganse stad","tekst":"Dat is, de inwoners der stad riepen en schreeuwden overluid van droefheid, toen zij hoorden dat de ark des verbonds genomen was."}],"15":[{"catchword":"stonden stijf,","tekst":"Hebreeuws, stonden."}],"17":[{"catchword":"hij,","tekst":"Of, de boodschapper."}],"18":[{"catchword":"poort,","tekst":"Versta dit van de stadspoort."}],"19":[{"catchword":"kromde zij zich,","tekst":"Te weten, van pijn en benauwdheid, die zij gevoelde."},{"catchword":"haar","tekst":"Hebreeuws, haar noden wendden zich over haar"},{"catchword":"weeën overvielen haar","tekst":"Angsten, benauwdheden, nood."}],"20":[{"catchword":"bij haar stonden","tekst":"Of, over haar"},{"catchword":"nam het niet ter harte","tekst":"Hebreeuws, zij zette haar hart daar niet [op]; dat is, zij werd door zulke woorden niet bewogen; zij verkwikten haar hart niet."}],"21":[{"catchword":"Ikabod,","tekst":"Dat is, waar is de heerlijkheid? Anders, er is geen eer. Alsof zij zeide: Alle heerlijkheid en treffelijkheid van Israël is ons nu benomen, nu de ark ons benomen is, welke Israël grote heerlijkheid en vermaardheid toebracht. Want zij was een teken der genadige tegenwoordigheid Gods onder zijn volk. Deze manier van spreken wordt ook gebruikt Psa 26:8, en Psa 78:61."}],"22":[{"catchword":"eer is gevankelijk weggevoerd uit Israël,","tekst":"Deze vrouw beklaagt zich meer en is bedroefder om de algemene schade dan om haar eigen verlies. Zie ook boven, vs.18."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And the word of Samuel came to all Israel: [i.e. The Prophecie which was revealed unto Samuel by the Lord, he revealed unto the people, and it was fulfilled. See chap.3.11, 21.] and Israel went out to meet the Philistines to battel, and camped themselves by Eben-haezer, [i.e. the stone of help, help-stone. This place got first afterward this name. See below chap.7.12. So is Laz, Gen.12. called Bethel, which name Jacob a long while after gave unto this place, Gen 28:19.] but the Philistines camped themselves by Aphek. [A city lying in the tribe of Juda, Jos.chap.15.53. but there is another Aphek in the tribe of Ascher, Jos.19.30. Judg.1. vers.31.]"}],"2":[{"catchword":null,"tekst":"And the Philistines put themselves in battel-array to meet Israel: and when the battel [i.e. the souldiers that fought] spread it self out, [Intimating that when all the bands and companies were met together to fight, they smote, &c.] then was Israel smitten before the face of the Philistine: for they [to wit, the Philistines] slew in the battel-array in the field, [intimating, while the battel lasted, when both the camps yet stood in their battel-array] about four thousand man."}],"3":[{"catchword":null,"tekst":"When the people were (again) come into the camp, then the eldest of Israel said, Wherefore hath the LORD to day smitten us before the face of the Philistines? let us take unto us out of Silo the Ark of the covenant of the LORD, and let it come into the midst of us, that it may deliver us from our enemies. [This they did without asking counsel of God, thinking that this outward ceremony was able to protect and deliver them from the hands of their enemies.]"}],"4":[{"catchword":null,"tekst":"Therefore the people sent to Silo, and they brought from thence the Ark of the covenant of the LORD of hosts, who dwelleth between the Cherubims: [From between which God spake with Moseh, and others, Exo 25:22. Num 7:89.] and the two sons of Eli, Hophni and Pinehas, were there [viz. in the camp] with the Ark of the covenant of God."}],"5":[{"catchword":null,"tekst":"And it came to pass&Atilde;&copy; when the Ark of the covenant of the LORD came into the camp, that all Israel shouted with a great shout, so that the earth shook."}],"6":[{"catchword":null,"tekst":"Now when the Philistines heard the voice of the shout, then they said, what is [i.e. meaneth] the voice of this great shouting in the camp of the Hebrews: then they understood that the Ark of the LORD was come into the camp."}],"7":[{"catchword":null,"tekst":"Therefore the Philistines feared; for they said God is come into the camp: and said, wo unto us, for the like hath not been done yesterday (nor) ere yesterday."}],"8":[{"catchword":null,"tekst":"Wo unto us, who shall deliver us out of the land of these glorious Gods? [Or, of this glorious God] these are the same Gods, which plagued the Egyptians with all plagues by the wilderness. [i.e. in the reed See, which lieth by the wilderness of Etham; see Exo 13:20. and chap.14.]"}],"9":[{"catchword":null,"tekst":"Be strong, and be men, the Philistines, left ye perhaps serve the Hebrew, according as they have served you, therefore be men, and fight."}],"10":[{"catchword":null,"tekst":"Then the Philistines fought, and Israel was smitten, and every one fled into his tent, [i.e. into his house, as below chap.13.2. and I Kings 12.16,&c.] and there was made a very great slaughter, [Heb. blow] so that there fell of Israel thirty thousand footmen."}],"11":[{"catchword":null,"tekst":"And the Ark of God was taken: and the two sons of Eli, Hophni and Pinehas died."}],"12":[{"catchword":null,"tekst":"Then there ran a Benjamite out of the Battel-array, and came to Silo the same day: and his clothes were rent, [In token of grief, and that he brought bad tidings. Of this phrase, see the annotat. in Genes.37.29. and Jos.7.6,&c. and 2 Sam.1.2,11.] and there was earth upon his head. [See the like example, Jos.7.6. and 2 Sam.1.2.]"}],"13":[{"catchword":null,"tekst":"And when he came, lo, Eli sat upon a stool by the wayes side, looking out: for his heart trembled because of the Ark of God: when that man came, to tell (it) in the city, then all the city cried out. [i.e. the inhabitants of the city called and cried loud out of grief, when they heard that the Ark of the covenant was taken]"}],"14":[{"catchword":null,"tekst":"And when Eli heard the voice of the cry, he said, what is the voice of this tumult? Then the man made haste, and he came and told it Eli."}],"15":[{"catchword":null,"tekst":"Now Eli was a man of four score and eighteen years, and his eyes stood stiff, [Heb. stood] (so to he could not see.)"}],"16":[{"catchword":null,"tekst":"And that man said unto Eli: I am he, that come out of the battel-array, and I am fled to day out of the battel-array: then he said, what is there done, ny son?"}],"17":[{"catchword":null,"tekst":"Then answered he, that brought the message, [Or, the messenger] and said, Israel is fled before the face of the Philistines, and there is likewise a great slaughter made among the people: besides thy two son s Hophni and Pinehas are dead, and the Ark of God is taken."}],"18":[{"catchword":null,"tekst":"And it came to pass&Atilde;&copy;, when he made mention of the Ark of God, that he fell backward from off the seat, at the side of the gate, [Understand this of the city-gate] and brake his neck, and died, for the man was old and heavy: and he judged Israel fourty years."}],"19":[{"catchword":null,"tekst":"And his daughter in law, Pinehas wife, was with child, ready to travel: when this (woman) heard the tidings, that the Ark of God was taken, and her father in law was dead, and her husband, then she bowed her self, [viz. through pain and anguish which she felt] and travelled, for her woes [Pains, sorrows, anxieties, need] fell upon her, [Heb. her needs turned themselves upon her.]"}],"20":[{"catchword":null,"tekst":"And about the time of her dying, the woman that stood by her, [Or, over her] spake, fear not, for thou ha // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;

    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
