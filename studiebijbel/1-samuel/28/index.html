arzeggers en de geestenbezweerders uit het land weggedaan.","4":"En de Filistijnen kwamen en verzamelden zich, en zij sloegen hun kamp op bij Sunem; en Saul verzamelde heel Israël, en zij sloegen hun kamp op bij Gilboa.","5":"Toen Saul het leger van de Filistijnen zag, werd hij bang, en zijn hart beefde erg.","6":"En Saul vroeg de HEERE, maar de HEERE antwoordde hem niet; niet door dromen, niet door de Urim[1], niet door de profeten.","7":"Toen zei Saul tegen zijn dienaren: Zoek voor mij een vrouw die een waarzeggende geest heeft, zodat ik naar haar toe ga en door haar onderzoek doe. Zijn dienaren nu zeiden tegen hem: Zie, in Endor is een vrouw die een waarzeggende geest heeft.","8":"En Saul vermomde zich, en trok andere kleren aan, en ging op weg, met twee mannen bij hem, en zij kwamen 's nachts bij de vrouw, en hij zei: Voorspel mij toch door de waarzeggende geest, en laat opkomen wie ik u zeggen zal.","9":"Toen zei de vrouw tegen hem: Zie, u weet wat Saul gedaan heeft, hoe hij de waarzeggers en de geestenbezweerders uit dit land heeft uitgeroeid; waarom legt u mij dan een valstrik, om mij te doden?","10":"Saul nu zwoer haar bij de HEERE en zei: *Zo waarachtig als* de HEERE leeft, u zal geen straf om deze zaak overkomen!","11":"Toen zei de vrouw: Wie zal ik voor u laten opkomen? En hij zei: Laat Samuel voor mij opkomen.","12":"Toen de vrouw Samuel zag, riep zij met luide stem, en de vrouw sprak tegen Saul en zei: Waarom hebt u mij bedrogen? Want u bent Saul.","13":"En de koning zei tegen haar: Wees niet bang; maar wat ziet u? Toen zei de vrouw tegen Saul: Ik zie goden, opkomend uit de aarde.","14":"Hij dan zei tegen haar: Hoe ziet hij eruit? En zij zei: Er komt een oude man op, en hij is met een mantel bekleed. Toen Saul begreep dat het Samuel was, boog hij zich met zijn gezicht ter aarde, en boog hij zich neer.","15":"En Samuel zei tegen Saul: Waarom hebt u mij onrustig gemaakt, door mij te laten opkomen? Toen zei Saul: Ik ben erg beangstigd, want de Filistijnen strijden tegen mij, en God is van mij geweken, en antwoordt mij niet meer, niet door de dienst van de profeten, niet door dromen; daarom heb ik u geroepen, zodat u mij te kennen geeft wat ik doen zal.","16":"Toen zei Samuel: Waarom vraagt u mij dit toch, terwijl de HEERE van u geweken en uw vijand geworden is?","17":"Want de HEERE heeft voor Zich gedaan, zoals Hij door mijn dienst gesproken heeft; en Hij heeft het koninkrijk uit uw hand gescheurd, en Hij heeft het gegeven aan uw naaste, aan David.","18":"Zoals u naar de stem van de HEERE niet geluisterd hebt, en de gloed van Zijn toorn niet uitgevoerd hebt tegen Amalek; daarom heeft de HEERE u deze zaak aangedaan op deze dag.","19":"En de HEERE zal ook Israël met u in de hand van de Filistijnen geven, en morgen zult u en uw zonen bij mij zijn; ook zal de HEERE het leger van Israël in de hand van de Filistijnen geven.","20":"Toen viel Saul haastig ter aarde, zo lang als hij was, en hij was erg bang vanwege de woorden van Samuel; ook was er geen kracht in hem, want hij had de hele dag en de hele nacht geen brood gegeten.","21":"De vrouw nu kwam bij Saul, en zag dat hij erg verbijsterd was; en zij zei tegen hem: Zie, uw dienstmaagd heeft naar uw stem geluisterd, en ik heb mijn leven in mijn hand gesteld, en ik heb uw woorden gehoord die u tegen mij gesproken hebt.","22":"Zo luister toch ook naar de stem van uw dienstmaagd, en laat mij een stuk van het brood voor u zetten, en eet; zo zal er kracht in u zijn, zodat u op weg kunt gaan.","23":"Doch hij weigerde het, en zei: Ik zal niet eten. Maar zijn dienaren, en ook de vrouw, drongen bij hem aan. Toen luisterde hij naar hun stem, en hij stond op van de aarde, en ging op het bed zitten.","24":"En de vrouw had een gemest kalf in het huis; en zij haastte zich en slachtte het; en zij nam meel, en kneedde het, en bakte daar ongezuurde *koeken* van.","25":"En zij bracht ze voor Saul en voor zijn dienaren, en zij aten; daarna stonden zij op, en gingen weg diezelfde nacht."},"SV":{"1":"En het geschiedde in die dagen, als de Filistijnen hun legers vergaderden tot den strijd, om tegen Israël te strijden, zo zeide Achis tot David: Gij zult zekerlijk weten, dat gij met mij in het leger zult uittrekken, gij en uw mannen.","2":"Toen zeide David tot Achis: Aldus zult gij weten, wat uw knecht doen zal. En Achis zeide tot David: Daarom zal ik u ten bewaarder mijns hoofds zetten, te allen dage.","3":"Samuël nu was gestorven, en gans Israël had rouw over hem bedreven; en zij hadden hem begraven te Rama, te weten in zijn stad. En Saul had uit het land weggedaan de waarzeggers en duivelskunstenaars.","4":"En de Filistijnen kwamen en vergaderden zich, en zij legerden zich te Sunem; en Saul vergaderde gans Israël, en zij legerden zich op Gilboa.","5":"Toen Saul het leger der Filistijnen zag, zo vreesde hij, en zijn hart beefde zeer.","6":"En Saul vraagde den HEERE; maar de HEERE antwoordde hem niet; noch door dromen, noch door de urim, noch door de profeten.","7":"Toen zeide Saul tot zijn knechten: Zoekt mij een vrouw, die een waarzeggenden geest heeft, dat ik tot haar ga, en door haar onderzoeke. Zijn knechten nu zeiden tot hem: Zie, te Endor is een vrouw, die een waarzeggenden geest heeft.","8":"En Saul verstelde zich, en trok andere klederen aan, en ging heen, en twee mannen met hem, en zij kwamen des nachts tot de vrouw, en hij zeide: Voorzeg mij toch door den waarzeggenden geest, en doe mij opkomen, dien ik tot u zeggen zal.","9":"Toen zeide de vrouw tot hem: Zie, gij weet, wat Saul gedaan heeft, hoe hij de waarzegsters en de duivelskunstenaars uit dit land heeft uitgeroeid; waarom stelt gij dan mijn ziel een strik, om mij te doden?","10":"Saul nu zwoer haar bij den HEERE, zeggende: *Zo* *waarachtig* *als* de HEERE leeft, indien u een straf om deze zaak zal overkomen!","11":"Toen zeide de vrouw: Wien zal ik u doen opkomen? En hij zeide: Doe mij Samuël opkomen.","12":"Toen nu de vrouw Samuël zag, zo riep zij met luider stem, en de vrouw sprak tot Saul, zeggende: Waarom hebt gij mij bedrogen? Want gij zijt Saul.","13":"En de koning zeide tot haar: Vrees niet; maar wat ziet gij? Toen zeide de vrouw tot Saul: Ik zie goden, uit de aarde opkomende.","14":"Hij dan zeide tot haar: Hoe is zijn gedaante? En zij zeide: Er komt een oud man op, en hij is met een mantel bekleed. Toen Saul vernam, dat het Samuël was, zo neigde hij zich met het aangezicht ter aarde, en hij boog zich.","15":"En Samuël zeide tot Saul: Waarom hebt gij mij onrustig gemaakt, mij doende opkomen? Toen zeide Saul: Ik ben zeer beangstigd, want de Filistijnen krijgen tegen mij, en God is van mij geweken, en antwoordt mij niet meer, noch door den dienst der profeten, noch door dromen; daarom heb ik u geroepen, dat gij mij te kennen geeft, wat ik doen zal.","16":"Toen zeide Samuël: Waarom vraagt gij mij toch, dewijl de HEERE van u geweken en uw vijand geworden is?","17":"Want de HEERE heeft voor Zich gedaan, gelijk als Hij door mijn dienst gesproken heeft; en heeft het koninkrijk van uw hand gescheurd, en Hij heeft dat gegeven aan uw naaste, aan David.","18":"Gelijk als gij naar de stem des HEEREN niet gehoord hebt, en de hittigheid Zijns toorns niet uitgericht hebt tegen Amalek; daarom heeft de HEERE u deze zaak gedaan te dezen dage.","19":"En de HEERE zal ook Israël met u in de hand der Filistijnen geven, en morgen zult gij en uw zonen bij mij zijn; ook zal de HEERE het leger van Israël in de hand der Filistijnen geven.","20":"Toen viel Saul haastelijk ter aarde, zo lang als hij was, en hij vreesde zeer vanwege de woorden van Samuël; ook was er geen kracht in hem; want hij had den gehelen dag en den gehelen nacht geen brood gegeten.","21":"De vrouw nu kwam tot Saul, en zag, dat hij zeer verbaasd was; en zij zeide tot hem: Zie, uw dienstmaagd heeft naar uw stem gehoord, en ik heb mijn ziel in mijn hand gesteld, en ik heb uw woorden gehoord, die gij tot mij gesproken hebt.","22":"Zo hoor toch gij nu ook naar de stem uwer dienstmaagd, en laat mij een bete broods voor u zetten, en eet; zo zal er kracht in u zijn, dat gij over weg gaat.","23":"Doch hij weigerde het, en zeide: Ik zal niet eten. Maar zijn knechten, en ook de vrouw, hielden bij hem aan. Toen hoorde hij naar hun stem, en hij stond op van de aarde, en zette zich op het bed.","24":"En de vrouw had een gemest kalf in het huis; en zij haastte zich en slachtte het; en zij nam meel, en kneedde het, en bakte daar ongezuurde *koeken* van.","25":"En zij bracht ze voor Saul en voor zijn knechten, en zij aten; daarna stonden zij op, en gingen weg in dienzelfden nacht."},"KJV":{"1":"And it came to pass in those days, that the Philistines gathered ➔ their armies together for warfare, to fight with Israel. And Achish said unto David, Know thou assuredly, that thou shalt go out with me to battle, thou and thy men.","2":"And David said to Achish, Surely thou shalt know what thy servant can do. And Achish said to David, Therefore will I make thee keeper of mine head for ever.","3":"Now Samuel was dead, and all Israel had lamented him, and buried him in Ramah, even in his own city. And Saul had put away those that had familiar spirits, and the wizards, out of the land.","4":"And the Philistines gathered themselves together, and came and pitched in Shunem: and Saul gathered ➔ all Israel together, and they pitched in Gilboa.","5":"And when Saul saw the host of the Philistines, he was afraid, and his heart greatly trembled.","6":"And when Saul enquired of the LORD, the LORD answered him not, neither by dreams, nor by Urim, nor by prophets.","7":"Then said Saul unto his servants, Seek me a woman that hath a familiar spirit, that I may go to her, and enquire of her. And his servants said to him, Behold, there is a woman that hath a familiar spirit at Endor.","8":"And Saul disguised himself, and put on other raiment, and he went, and two men with him, and they came to the woman by night: and he said, I pray thee, divine unto me by the familiar spirit, and bring me him up, whom I shall name unto thee.","9":"And the woman said unto him, Behold, thou knowest what Saul hath done, how he hath cut off those that have familiar spirits, and the wizards, out of the land: wherefore then layest thou a snare for my life, to cause me to die?","10":"And Saul sware to her by the LORD, saying, As the LORD liveth, there shall no punishment happen to thee for this thing.","11":"Then said the woman, Whom shall I bring up unto thee? And he said, Bring me up Samuel.","12":"And when the woman saw Samuel, she cried with a loud voice: and the woman spake to Saul, saying, Why hast thou deceived me? for thou art Saul.","13":"And the king said unto her, Be not afraid: for what sawest thou? And the woman said unto Saul, I saw gods ascending out of the earth.","14":"And he said unto her, What form is he of? And she said, An old man cometh up; and he is covered with a mantle. And Saul perceived that it was Samuel, and he stooped with his face to the ground, and bowed himself.","15":"And Samuel said to Saul, Why hast thou disquieted me, to bring me up? And Saul answered, I am sore distressed; for the Philistines make war against me, and God is departed from me, and answereth me no more, neither by prophets, nor by dreams: therefore I have called thee, that thou mayest make known unto me what I shall do.","16":"Then said Samuel, Wherefore then dost thou ask of me, seeing the LORD is departed from thee, and is become thine enemy?","17":"And the LORD hath done to him, as he spake by me: for the LORD hath rent the kingdom out of thine hand, and given it to thy neighbour, even to David:","18":"Because thou obeyedst not the voice of the LORD, nor executedst his fierce wrath upon Amalek, therefore hath the LORD done this thing unto thee this day.","19":"Moreover the LORD will also deliver Israel with thee into the hand of the Philistines: and to morrow shalt thou and thy sons be with me: the LORD also shall deliver the host of Israel into the hand of the Philistines.","20":"Then Saul fell straightway all along on the earth, and was sore afraid, because of the words of Samuel: and there was no strength in him; for he had eaten no bread all the day, nor all the night.","21":"And the woman came unto Saul, and saw that he was sore troubled, and said unto him, Behold, thine handmaid hath obeyed thy voice, and I have put my life in my hand, and have hearkened unto thy words which thou spakest unto me.","22":"Now therefore, I pray thee, hearken thou also unto the voice of thine handmaid, and let me set a morsel of bread before thee; and eat, that thou mayest have strength, when thou goest on thy way.","23":"But he refused, and said, I will not eat. But his servants, together with the woman, compelled him; and he hearkened unto their voice. So he arose from the earth, and sat upon the bed.","24":"And the woman had a fat calf in the house; and she hasted, and killed it, and took flour, and kneaded it, and did bake unleavened bread thereof:","25":"And she brought it before Saul, and before his servants; and they did eat. Then they rose up, and went away that night."}},"tsk":{"1":[{"kopje":"dat de","refs":["1 Sam 7:7","1 Sam 13:5","1 Sam 17:1","1 Sam 29:1"]},{"kopje":"Filistijnen","refs":["Richt 3:1-4"]},{"kopje":"u ... zult trekken","refs":["1 Sam 27:12","1 Sam 29:2","1 Sam 29:3"]}],"2":[{"kopje":"Zo","refs":["1 Sam 27:10","2 Sam 16:16-19","Rom 12:9"]}],"3":[{"kopje":"Samuel","refs":["1 Sam 25:1","Jes 57:1","Jes 57:2"]},{"kopje":"weggedaan","refs":["1 Sam 28:9","Ex 22:18","Lev 19:31","Lev 20:6","Lev 20:27","Deut 18:10","Deut 18:11","Hand 16:16-19"]}],"4":[{"kopje":"Sunem","refs":["Joz 19:18","2 Kon 4:8"]},{"kopje":"Gilboa","refs":["1 Sam 31:1","2 Sam 1:6","2 Sam 1:21","2 Sam 21:12"]}],"5":[{"kopje":"werd hij bang","refs":["Job 15:21","Job 18:11","Ps 48:6","Ps 48:7","Ps 73:19","Spr 10:24","Jes 7:2","Jes 21:3","Jes 21:4","Jes 57:20","Jes 57:21","Dan 5:6"]}],"6":[{"kopje":"vroeg","refs":["1 Sam 14:37","1 Kron 10:14","Spr 1:27","Spr 1:28","Klaagl 2:9" ">ze</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H6440\">voor</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H7586\">Saul</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H6440\">en</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H6440\">voor</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H1931\">zijn</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H1931\">dienaren</span>, <span class=\"wl\" data-l=\"L4\" data-code=\"H398\">en</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H398\">zij</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H398\">aten</span>; <span class=\"wl\" data-l=\"L5\" data-code=\"H6965\">daarna</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H6965\">stonden</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H6965\">zij</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H6965\">op</span>, <span class=\"wl\" data-l=\"L6\" data-code=\"H3212\">en</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H3212\">gingen</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H3212\">weg</span> diezelfde <span class=\"wl\" data-l=\"L8\" data-code=\"H3915\">nacht</span>."},"koppeling_kjv":{"1":"And it came to pass in those <span class=\"wl wl-kjv\" data-code=\"H3117\">days,</span> that the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> <span class=\"wl wl-kjv\" data-code=\"H6908\">gathered</span> ➔ their <span class=\"wl wl-kjv\" data-code=\"H4264\">armies</span> <span class=\"wl wl-kjv\" data-code=\"H6908\">together</span> for <span class=\"wl wl-kjv\" data-code=\"H6635\">warfare,</span> to <span class=\"wl wl-kjv\" data-code=\"H3898\">fight</span> with <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span> And <span class=\"wl wl-kjv\" data-code=\"H397\">Achish</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">Know</span> thou <span class=\"wl wl-kjv\" data-code=\"H3045\">assuredly,</span> that thou shalt go <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> with me to <span class=\"wl wl-kjv\" data-code=\"H4264\">battle,</span> thou and thy <span class=\"wl wl-kjv\" data-code=\"H582\">men.</span>","2":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H397\">Achish,</span> <span class=\"wl wl-kjv\" data-code=\"H3651\">Surely</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> what thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> can <span class=\"wl wl-kjv\" data-code=\"H6213\">do.</span> And <span class=\"wl wl-kjv\" data-code=\"H397\">Achish</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> Therefore will I <span class=\"wl wl-kjv\" data-code=\"H7760\">make</span> thee <span class=\"wl wl-kjv\" data-code=\"H8104\">keeper</span> of mine <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> for <span class=\"wl wl-kjv\" data-code=\"H3117\">ever.</span>","3":"Now <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> was <span class=\"wl wl-kjv\" data-code=\"H4191\">dead,</span> and all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> had <span class=\"wl wl-kjv\" data-code=\"H5594\">lamented</span> him, and <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> him in <span class=\"wl wl-kjv\" data-code=\"H7414\">Ramah,</span> even in his own <span class=\"wl wl-kjv\" data-code=\"H5892\">city.</span> And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> had put <span class=\"wl wl-kjv\" data-code=\"H5493\">away</span> those that had familiar <span class=\"wl wl-kjv\" data-code=\"H178\">spirits,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3049\">wizards,</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land.</span>","4":"And the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> gathered themselves <span class=\"wl wl-kjv\" data-code=\"H6908\">together,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> in <span class=\"wl wl-kjv\" data-code=\"H7766\">Shunem:</span> and <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H6908\">gathered</span> ➔ all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H6908\">together,</span> and they <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> in <span class=\"wl wl-kjv\" data-code=\"H1533\">Gilboa.</span>","5":"And when <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> the <span class=\"wl wl-kjv\" data-code=\"H4264\">host</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines,</span> he was <span class=\"wl wl-kjv\" data-code=\"H3372\">afraid,</span> and his <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> <span class=\"wl wl-kjv\" data-code=\"H3966\">greatly</span> <span class=\"wl wl-kjv\" data-code=\"H2729\">trembled.</span>","6":"And when <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H7592\">enquired</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> him not, neither by <span class=\"wl wl-kjv\" data-code=\"H2472\">dreams,</span> nor by <span class=\"wl wl-kjv\" data-code=\"H224\">Urim,</span> nor by <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets.</span>","7":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> unto his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> <span class=\"wl wl-kjv\" data-code=\"H1245\">Seek</span> me a <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> that <span class=\"wl wl-kjv\" data-code=\"H1172\">hath</span> a familiar <span class=\"wl wl-kjv\" data-code=\"H178\">spirit,</span> that I may <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> to her, and <span class=\"wl wl-kjv\" data-code=\"H1875\">enquire</span> of her. And his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to him, Behold, there is a <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> that <span class=\"wl wl-kjv\" data-code=\"H1172\">hath</span> a familiar <span class=\"wl wl-kjv\" data-code=\"H178\">spirit</span> at <span class=\"wl wl-kjv\" data-code=\"H5874\">Endor.</span>","8":"And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H2664\">disguised</span> himself, and put <span class=\"wl wl-kjv\" data-code=\"H3847\">on</span> <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> <span class=\"wl wl-kjv\" data-code=\"H899\">raiment,</span> and he <span class=\"wl wl-kjv\" data-code=\"H3212\">went,</span> and <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> with him, and they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> by <span class=\"wl wl-kjv\" data-code=\"H3915\">night:</span> and he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I pray thee, <span class=\"wl wl-kjv\" data-code=\"H7080\">divine</span> unto me by the familiar <span class=\"wl wl-kjv\" data-code=\"H178\">spirit,</span> and bring me him <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> whom I shall <span class=\"wl wl-kjv\" data-code=\"H559\">name</span> unto thee.","9":"And the <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Behold, thou <span class=\"wl wl-kjv\" data-code=\"H3045\">knowest</span> what <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> hath <span class=\"wl wl-kjv\" data-code=\"H6213\">done,</span> how he hath cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> those that have familiar <span class=\"wl wl-kjv\" data-code=\"H178\">spirits,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3049\">wizards,</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land:</span> wherefore then layest thou a <span class=\"wl wl-kjv\" data-code=\"H5367\">snare</span> for my <span class=\"wl wl-kjv\" data-code=\"H5315\">life,</span> to cause me to <span class=\"wl wl-kjv\" data-code=\"H4191\">die?</span>","10":"And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H7650\">sware</span> to her by the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> As the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> there <span class=\"wl wl-kjv\" data-code=\"H518\">shall</span> no <span class=\"wl wl-kjv\" data-code=\"H5771\">punishment</span> <span class=\"wl wl-kjv\" data-code=\"H7136\">happen</span> to thee for this <span class=\"wl wl-kjv\" data-code=\"H1697\">thing.</span>","11":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> the <span class=\"wl wl-kjv\" data-code=\"H802\">woman,</span> Whom shall I bring <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> unto thee? And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Bring me <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel.</span>","12":"And when the <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel,</span> she <span class=\"wl wl-kjv\" data-code=\"H2199\">cried</span> with a <span class=\"wl wl-kjv\" data-code=\"H1419\">loud</span> <span class=\"wl wl-kjv\" data-code=\"H6963\">voice:</span> and the <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> to <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Why hast thou <span class=\"wl wl-kjv\" data-code=\"H7411\">deceived</span> me? for thou art <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul.</span>","13":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, Be not <span class=\"wl wl-kjv\" data-code=\"H3372\">afraid:</span> for what <span class=\"wl wl-kjv\" data-code=\"H7200\">sawest</span> thou? And the <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> I <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> <span class=\"wl wl-kjv\" data-code=\"H430\">gods</span> <span class=\"wl wl-kjv\" data-code=\"H5927\">ascending</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth.</span>","14":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, What <span class=\"wl wl-kjv\" data-code=\"H8389\">form</span> is he of? And she <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> An <span class=\"wl wl-kjv\" data-code=\"H2205\">old</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> cometh <span class=\"wl wl-kjv\" data-code=\"H5927\">up;</span> and he is <span class=\"wl wl-kjv\" data-code=\"H5844\">covered</span> with a <span class=\"wl wl-kjv\" data-code=\"H4598\">mantle.</span> And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">perceived</span> that it was <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel,</span> and he <span class=\"wl wl-kjv\" data-code=\"H6915\">stooped</span> with his <span class=\"wl wl-kjv\" data-code=\"H639\">face</span> to the <span class=\"wl wl-kjv\" data-code=\"H776\">ground,</span> and <span class=\"wl wl-kjv\" data-code=\"H7812\">bowed</span> himself.","15":"And <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> Why hast thou <span class=\"wl wl-kjv\" data-code=\"H7264\">disquieted</span> me, to bring me <span class=\"wl wl-kjv\" data-code=\"H5927\">up?</span> And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> I am <span class=\"wl wl-kjv\" data-code=\"H3966\">sore</span> <span class=\"wl wl-kjv\" data-code=\"H6887\">distressed;</span> for the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> make <span class=\"wl wl-kjv\" data-code=\"H3898\">war</span> against me, and <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> is <span class=\"wl wl-kjv\" data-code=\"H5493\">departed</span> from me, and <span class=\"wl wl-kjv\" data-code=\"H6030\">answereth</span> me no more, neither <span class=\"wl wl-kjv\" data-code=\"H3027\">by</span> <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets,</span> nor by <span class=\"wl wl-kjv\" data-code=\"H2472\">dreams:</span> therefore I have <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> thee, that thou mayest make <span class=\"wl wl-kjv\" data-code=\"H3045\">known</span> unto me what I shall <span class=\"wl wl-kjv\" data-code=\"H6213\">do.</span>","16":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel,</span> Wherefore then dost thou <span class=\"wl wl-kjv\" data-code=\"H7592\">ask</span> of me, seeing the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is <span class=\"wl wl-kjv\" data-code=\"H5493\">departed</span> from thee, and is become thine <span class=\"wl wl-kjv\" data-code=\"H6145\">enemy?</span>","17":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> to him, as he <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> by <span class=\"wl wl-kjv\" data-code=\"H3027\">me:</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H7167\">rent</span> the <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdom</span> out of thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> it to thy <span class=\"wl wl-kjv\" data-code=\"H7453\">neighbour,</span> even to <span class=\"wl wl-kjv\" data-code=\"H1732\">David:</span>","18":"<span class=\"wl wl-kjv\" data-code=\"H834\">Because</span> thou <span class=\"wl wl-kjv\" data-code=\"H8085\">obeyedst</span> not the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> nor <span class=\"wl wl-kjv\" data-code=\"H6213\">executedst</span> his <span class=\"wl wl-kjv\" data-code=\"H2740\">fierce</span> <span class=\"wl wl-kjv\" data-code=\"H639\">wrath</span> upon <span class=\"wl wl-kjv\" data-code=\"H6002\">Amalek,</span> therefore hath the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> this <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> unto thee this <span class=\"wl wl-kjv\" data-code=\"H3117\">day.</span>","19":"Moreover the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will also <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> with thee into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines:</span> and to <span class=\"wl wl-kjv\" data-code=\"H4279\">morrow</span> shalt thou and thy <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> be with me: the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> also shall <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> the <span class=\"wl wl-kjv\" data-code=\"H4264\">host</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines.</span>","20":"Then <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> <span class=\"wl wl-kjv\" data-code=\"H4116\">straightway</span> <span class=\"wl wl-kjv\" data-code=\"H4393\">all</span> <span class=\"wl wl-kjv\" data-code=\"H6967\">along</span> on the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> and was <span class=\"wl wl-kjv\" data-code=\"H3966\">sore</span> <span class=\"wl wl-kjv\" data-code=\"H3372\">afraid,</span> because of the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel:</span> and there was no <span class=\"wl wl-kjv\" data-code=\"H3581\">strength</span> in him; for he had <span class=\"wl wl-kjv\" data-code=\"H398\">eaten</span> no <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> all the <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> nor all the <span class=\"wl wl-kjv\" data-code=\"H3915\">night.</span>","21":"And the <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> unto <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that he was <span class=\"wl wl-kjv\" data-code=\"H3966\">sore</span> <span class=\"wl wl-kjv\" data-code=\"H926\">troubled,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Behold, thine <span class=\"wl wl-kjv\" data-code=\"H8198\">handmaid</span> hath <span class=\"wl wl-kjv\" data-code=\"H8085\">obeyed</span> thy <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> and I have <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> my <span class=\"wl wl-kjv\" data-code=\"H5315\">life</span> in my <span class=\"wl wl-kjv\" data-code=\"H3709\">hand,</span> and have <span class=\"wl wl-kjv\" data-code=\"H8085\">hearkened</span> unto thy <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> which thou <span class=\"wl wl-kjv\" data-code=\"H1696\">spakest</span> unto me.","22":"Now therefore, I pray thee, <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> thou also unto the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of thine <span class=\"wl wl-kjv\" data-code=\"H8198\">handmaid,</span> and let me <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> a <span class=\"wl wl-kjv\" data-code=\"H6595\">morsel</span> of <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thee; and <span class=\"wl wl-kjv\" data-code=\"H398\">eat,</span> that thou mayest have <span class=\"wl wl-kjv\" data-code=\"H3581\">strength,</span> when thou <span class=\"wl wl-kjv\" data-code=\"H3212\">goest</span> on thy <span class=\"wl wl-kjv\" data-code=\"H1870\">way.</span>","23":"But he <span class=\"wl wl-kjv\" data-code=\"H3985\">refused,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will not <span class=\"wl wl-kjv\" data-code=\"H398\">eat.</span> But his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> together with the <span class=\"wl wl-kjv\" data-code=\"H802\">woman,</span> <span class=\"wl wl-kjv\" data-code=\"H6555\">compelled</span> him; and he <span class=\"wl wl-kjv\" data-code=\"H8085\">hearkened</span> unto their <span class=\"wl wl-kjv\" data-code=\"H6963\">voice.</span> So he <span class=\"wl wl-kjv\" data-code=\"H6965\">arose</span> from the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> upon the <span class=\"wl wl-kjv\" data-code=\"H4296\">bed.</span>","24":"And the <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> had a <span class=\"wl wl-kjv\" data-code=\"H4770\">fat</span> <span class=\"wl wl-kjv\" data-code=\"H5695\">calf</span> in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house;</span> and she <span class=\"wl wl-kjv\" data-code=\"H4116\">hasted,</span> and <span class=\"wl wl-kjv\" data-code=\"H2076\">killed</span> it, and <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H7058\">flour,</span> and <span class=\"wl wl-kjv\" data-code=\"H3888\">kneaded</span> it, and did <span class=\"wl wl-kjv\" data-code=\"H644\">bake</span> unleavened <span class=\"wl wl-kjv\" data-code=\"H4682\">bread</span> thereof:","25":"And she <span class=\"wl wl-kjv\" data-code=\"H5066\">brought</span> it <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> and <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants;</span> and they did <span class=\"wl wl-kjv\" data-code=\"H398\">eat.</span> Then they rose <span class=\"wl wl-kjv\" data-code=\"H6965\">up,</span> and went <span class=\"wl wl-kjv\" data-code=\"H3212\">away</span> that <span class=\"wl wl-kjv\" data-code=\"H3915\">night.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"legers vergaderden","tekst":"Hier staat legers in het getal van vele, alsook onder, 1Sa 29:1, waaruit af te nemen is dat de Filistijnen verscheidene legers samen hebben te veld gebracht."},{"catchword":"Gij zult zekerlijk weten,","tekst":"Hebreeuws, wetende zult gij weten."}],"2":[{"catchword":"Aldus zult gij weten,","tekst":"Of, hier aan. Dit is wederom een dubbelzinnige manier van spreken, gelijk boven, 1Sa 27:10."},{"catchword":"Daarom zal ik u","tekst":"Alsof hij zeide: Dewijl ik u toevertrouw dat gij u kloekelijk in mijn dienst zult laten gebruiken, zo zal ik u tot een bewaarder van mijn hoofd, dat is, van mijn lijf en leven stellen, zolang als ik en gij leven."}],"3":[{"catchword":"Samuël nu was gestorven,","tekst":"Dit wordt hier gesteld om aan te wijzen, waarom Saul aan Samuël geen raad gevraagd had, maar had bevolen een toveres te zoeken."},{"catchword":"zijn stad","tekst":"Dat is, in de stad, in welke hij geboren en opgetogen was, en meest gewoond had."},{"catchword":"uit het land","tekst":"Versta, het land van Israël. Zie Lev 19:31."},{"catchword":"waarzeggers","tekst":"Zie Lev 19:31."},{"catchword":"duivelskunstenaars","tekst":"Of, zwarte kunstenaars."}],"4":[{"catchword":"Sunem;","tekst":"Zie de aantekeningen Jos 19:18."},{"catchword":"Gilbóa","tekst":"Dit is een gebergte, gelegen niet ver van het dal Jizreël, waar de slag geschied is, waar Saul met zijn zonen zijn omgekomen. Zie onder, 1Sa 31:1, en 2Sa 1:21."}],"6":[{"catchword":"vraagde den HEERE;","tekst":"Te weten, door enigen profeet, want Abjathar was dezen tijd bij David, met den efod, waar de urim en thummim, door welke men den Heere vraagde, in waren. Zie boven, 1Sa 23:6, en 1Sa 30:7."},{"catchword":"noch door","tekst":"In het Hebreeuws staat voor noch driemaal ook. Waarop men moet verstaan het woordje niet, uit het voorgaande, hetwelk tezamen zoveel is als noch"},{"catchword":"dromen,","tekst":"Zie Num 12:6."},{"catchword":"de urim,","tekst":"Zie Num 27:21."},{"catchword":"door de profeten","tekst":"Dat is, noch door gewoonlijke, noch op een bijzondere wijze."}],"7":[{"catchword":"Endor is een vrouw,","tekst":"Een stad in den stam van Manasse gelegen, aan deze zijde der Jordaan. Zie de aantekeningen Jos 17:11."}],"8":[{"catchword":"verstelde zich,","tekst":"Of, veranderde zich, maakte zich onbekend, verkleedde zich. Vergelijk 1Ki 22:30. Te weten, opdat deze vrouw hem niet kennen zou."},{"catchword":"doe mij opkomen,","tekst":"Te weten, uit het graf. Aldus vraagt Saul den doden raad voor den levende, hetwelk Jesaja bestraft, Isa 8:19."}],"9":[{"catchword":"gij weet,","tekst":"Te weten, als zijnde een Israëlietisch man, hetwelk zij uit zijn spraak en kleding kon vernemen; maar toen zij dit sprak wist zij nog niet dat zij met Saul sprak."},{"catchword":"om mij te doden?","tekst":"Zij wil zeggen, om Saul, als hij dit vernemen zal, oorzaak te geven mij te doden."}],"10":[{"catchword":"indien u","tekst":"Versta hierbij, zo straffe mij God, of iets dergelijks. Zie de aantekeningen Gen 14:23."},{"catchword":"straf","tekst":"Hebreeuws, ongerechtigheid, of misdaad; dat is, straf der ongerechtigheid. Zie Lev 5:1."}],"12":[{"catchword":"Samuël zag,","tekst":"Dat is, een boze geest, in de gedaante van Samuël, welken zij door haar duivelskunst had doen opkomen. Jezus Sirach in een groot misverstand als hij schrijft dat Samuël, nadat hij ontslapen was, geprofeteerd en Saul zijn einde voorzegd heeft, Jezus Sirach.46:22."},{"catchword":"riep zij met luider stem,","tekst":"Uit vrees dat zij van Saul zou gevangen en gedood worden; want zij vernam door ingeving des duivels of anderszins dat hij Saul zelf was. Of, zij riep, toen zij Samuël zag opkomen."}],"13":[{"catchword":"Vrees niet;","tekst":"Te weten, dat ik u zal doden, of laten doden."},{"catchword":"wat ziet gij?","tekst":"Te weten, dat gij dus bevreesd en verschrikt zijt."},{"catchword":"goden,","tekst":"Dat is, een aanzienlijk statelijk persoon in de gedaante van Samuël. Zij spreekt alzo, Elohim, in het getal van velen, op zijn heidens en als een toveres. Sommigen verstaan hier door goden de gedaante van Samuël met een gespuis van boze geesten."}],"14":[{"catchword":"Toen Saul vernam,","tekst":"Te weten, naar het oordeel zijner verwarde zinnen en uit de woorden der toveres, maar hij zelf heeft dezen Samuël niet gezien."},{"catchword":"neigde hij zich","tekst":"Saul, door deze toveres van den duivel bedrogen zijnde, heeft den duivel geëerd inplaats van Samuël."}],"15":[{"catchword":"Samuël zeide","tekst":"Gelijk boven, vs.12."},{"catchword":"Waarom hebt gij mij onrustig gemaakt,","tekst":"Het was in des duivels en in der toveresse macht niet den waren Samuël op te wekken en daar te doen verschijnen. Het is niet dan enkel bedriegerij des duivels geweest, denwelken God somtijds enige werkingen toelaat, tot verderf dergenen, die daaraan geloven."},{"catchword":"Ik ben zeer beangstigd,","tekst":"Hebreeuws, mij is bangheid zeer; dat is, grote bangheid."},{"catchword":"door den dienst der profeten,","tekst":"Hebreeuws, door de hand der profeten; dat is, door middel van enigen profeet. Zie wijders vs.6."}],"17":[{"catchword":"voor Zich gedaan,","tekst":"Dat is, tot zijn eer, naar zijn welgevallen. Anders, hem, te weten David. Of slechts, hij heeft het gedaan"},{"catchword":"door mijn dienst","tekst":"Hebreeuws, door mijn hand. Dit had God door den bozen geest niet gesproken, maar door den waren Sameul, boven, 1Sa 15:28."}],"18":[{"catchword":"uitgericht hebt","tekst":"Hebreeuws, gedaan"},{"catchword":"te dezen dage","tekst":"Dat is, in dezen tijd."}],"19":[{"catchword":"En de HEERE","tekst":"Dit kon de duivel enigszins raden, dewijl hij wist dat de Heere van Saul geweken was, en dat Saul nu dus versaagd en vreesachtig was, en ook omdat er weinig moed en orde bij de Israëlieten was tot tegenstand der Filistijnen."},{"catchword":"Israël met u","tekst":"Dat is, het leger der Israëlieten."},{"catchword":"bij mij zijn;","tekst":"Te weten, bij de doden; dat is, gij zult dood zijn. Zie dergelijke manier van spreken 2Sa 12:23. Want dat men dit zou verstaan van in de hel te zijn, waar de duivelen zijn, zou op Jónathan en velen van de Israëlieten niet passen, die wel in den slag zijn dood gebleven, maar niet naar de ziel in de verdoemenis gevaren."}],"20":[{"catchword":"viel Saul haastelijk ter aarde,","tekst":"Hebreeuws, toen haastte Saul en viel ter aarde"},{"catchword":"zo lang als hij was,","tekst":"Hebreeuws, [met] de volheid zijner statuur, of lengte"},{"catchword":"geen brood gegeten","tekst":"Dat is, geen spijs genuttigd."}],"21":[{"catchword":"uw dienstmaagd heeft naar uw stem gehoord,","tekst":"Dat is, ik heb uw stem gehoord."},{"catchword":"hand gesteld,","tekst":"Hebreeuws, palm. Zij wil zeggen: Ik heb mijn leven gewaagd; want zij had Saul ten gevalle zich tot waarzegging laten gebruiken, hetwelk aan het leven zou zijn gestraft geworden, had Saul bij zijn voornemen gebleven, waarvan vs.9 gesproken wordt. Zie de aantekeningen Jdg 12:3."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And it came to pass in those days, when the Philistines gathered their camps [Here mention is made of camps in the plural number, as also below chap. 29. 1. Whence may be gathered that the Philistines brought divers camps together into the field] together to battle, to fight against Israel: that Achis said unto David, Thou shalt surely know, [Heb. Knowing thou shall know] that thou shalt march forth with me into the camp, thou and thy men."}],"2":[{"catchword":null,"tekst":"Then David said unto Achis, Thus [Or, hereby,] thou shalt know what thy servant will do [This is again an ambiguous Phrase, as above chap. 27. 10.] and Achis said unto David, Therefore will I make thee a keeper of mine head all days. [As if he had said, Because I trust to thee, that thou wilt behave thy self valiantly in my service, therefore I will make thee a keeper of mine head, that is, of my body and life, as long as I shall live.]"}],"3":[{"catchword":null,"tekst":"Now Samuel was dead, and all Israel had mourned for him, and had buried him at Rama, [This is mentioned here, to shew, why Saul did not ask counsel of Samuel, but gave order to seek out a witch] to wit, in his City: [viz. In the City where he was born and bred, and had lived the most part of his time] and Saul had put away the sooth-sayers [See Levit. 19. On vers. 31.] and the wizards [Or, black artists] out of the Land. [Understand the Land of Israel. See Levit. 19. 31.]"}],"4":[{"catchword":null,"tekst":"And the Philistines came, and gathered themselves together, and they camped themselves at Sunem: [See the annotate. Jos. 19. 18.] and Saul gathered all Israel together, and they camped themselves upon Giboa. [This is a mountain lying not far from the valley of Jizreel, where the battle happened, in which Saul & his sons perished : See below chap. 31. 1. And 2 Sam. 1. 21.]"}],"5":[{"catchword":null,"tekst":"When Saul saw the Philistines camp: then he feared, and his heart trembled greatly."}],"6":[{"catchword":null,"tekst":"And Saul required of the LORD, [viz. By some Prophet, for Abiathar was at this time with David, with the Ephod, wherein were the Urim and Thummim, whereby they enquired of the Lord: See above chap. 23. Vers. 6. And below chap. 30. Vers. 7.] but the LORD answered him not: neither [In the Hebrew, for neither, or nor is the word also thrice mentioned, whereby must also be understood, out of the foregoing words, the particle not, which together is as much as neither or not] by dreams , [See Numb. 12. 6.] nor by Urim, [See numb. 27. Vers. 21.] nor by Prophets. [i.e. nor by neither ordinary, or extraordinary means.]"}],"7":[{"catchword":null,"tekst":"Then said Saul to his Servants, seek me a woman, that hath a sooth saying spirit, that I may go to her, and enquire by her: now his servants said unto him, Behold, (there) is a woman at Endor, [A City lying in the tribe Manasseh, on this side of Jordan. See the annotate. On Jos. 17. Vers. 11.] that hath a sooth saying spirit."}],"8":[{"catchword":null,"tekst":"And Saul disguised himself, [Or changed himself, made himself unknown, put on other apparel. Compare 1 King 22. On vers. 30. Viz. That this woman might not know him] and put on other apparel, and went his way, and two men with him, and they came to the woman by night: and he said, I pray thee, foretell unto me by the sooth saying spirit, and cause him to come up, [viz. Out of the grave, or selpuchre. This Saul asketh counsel of the dead for the living, which the Prophet Isaias reproveth chap. 8. Vers. 19.] unto me, whom I shall name unto thee."}],"9":[{"catchword":null,"tekst":"Then said the woman unto him, Behold, thou knowest what Saul hath done, [viz. As being an Israelitish woman, she might perceive by his speech and apparel: but when she spake this, she knew not yet that she communed with Saul himself] how he hath cut off the sooth-sayers and the wizards out of this Land: wherefore then layest thou a snare for my soul, to put me to death? [As if she would say, to give Saul occasion, when he shall come to hear of it, to put me to death]"}],"10":[{"catchword":null,"tekst":"Now Saul sware unto her by the LORD, saying, (As true as) the LORD liveth, if a punishment [Heb. Iniquity, or, trespass: i.e. punishment of iniquity. See Levit. 5. On vers. 1.] shall happen to thee for this thing? [Understand withal, then let God punish me, or some thing like to it. See the annotate. On Genes. 14. 23.]"}],"11":[{"catchword":null,"tekst":"The said the woman, whom shall I cause to come up unto thee? And he said, and he said , make Samuel come up unto me."}],"12":[{"catchword":null,"tekst":"Now when the Woman saw Samuel, [i.e. an evil spirit in the shape and form of Samuel, whom she had raised by her Devilish art. Jesus Syrach is in a great error when he writeth, that Samuel after he was fallen asleep prophesied, and foretold Saul his end, chap. 46. 23.] then she cried with a loud voice: [viz. For fear of being imprisoned and put to death by Saul: for by the Devils instinct or otherwise she came to know that it was Saul himself: Or, she cried, when she saw Samuel come up] and the woman spake unto Saul, saying, Why hast thou deceived me? For thou art Saul:"}],"13":[{"catchword":null,"tekst":"And the King said unto her, Be not afraid [viz. That I will put thee to death, or cause the to be put to death ] but what seest thou? [viz. That thou art thus afraid and affrighted.] then said the woman unto Saul, I see Gods ascending out of the earth. [i.e. stately honourable person in the shape & form of Samuel. She speaketh thus, Elohim in the plural number, in a heathernish manner, and as a witch. Some understand here by Gods, the counterfeit Samuel, with a company of evil spirits waiting upon him]"}],"14":[{"catchword":null,"tekst":"He then said unto her, how is his shape, and she said: There cometh up an old ma, and he is clothed with a mantle: when Saul perceived [viz. According to the judgement of his distracted senses, and the witches words: for he himself saw not this Samuel] that it was Samuel, then he bowed himself . [Saul being cozened by the Devil by this witches means, did honour the Devil in stead of Samuel]"}],"15":[{"catchword":null,"tekst":"And Samuel [As above vers. 12.] said unto Saul, why hast thou disquieted me, causing me to come up [It was neither in the Devils nor in the witches power to raise up the true Samuel, and to make him appear there; &acirc;&euro;&tilde;twas nothing but meer deceit and collusion of the devil, whom God sometimes permitteth to do some actions for the ruin ad destruction of those that give credit thereunto] then said Saul, I am greatly distressed, [Heb. Distress is greatly to me, that is, great distress] for the philistines war against me, and God is departed from me, and answereth me no more, neither by the ministry of the Prophets, [Heb. By the hand of the Prophets : i.e. by means of any Prophet. See further on ver. 6.] nor by dreams, therefore have I called thee, that thou mayest make known to me what I shall do."}],"16":[{"catchword":null,"tekst":"Then said Samuel, Wherefore doest thou now ask of me? Seeing the LORD is departed from thee, and is become thine enemy."}],"17":[{"catchword":null,"tekst":"For the LORD hath done for himself, [viz. To his glory, according to his good pleasure. Oth. Him; viz. David. Or, simply, he hath done it] as he spake by my ministry: [Heb. By my hand. God had not spoken this by the evil spirit, but by the true Samuel, above chap. 15. 28.] and hath rent the Kingdom out of thine hand, and he hath given that to thy neighbours, to David."}],"18":[{"catchword":null,"tekst":"According as thou hast not hearkened to the voice of the LORD, and hast not executed [Heb. Done] the heat of his wrath against Amalek: therefore hath the LORD done this thing unto thee this day. [i.e. at this time]"}],"19":[{"catchword":null,"tekst":"And the LORD will also deliver Israel [i.e. the camp of the Israelites] with thee, into the hand of Philistines, [The Devil might guess this in part, because he knew that the Lord was departed from Saul and that Saul was now thus dismayed and fearful, and also because there was but little courage and order among the Israelites to oppose and resist the Philistines] and tomorrow shalt thou, and thy sons be with me: [viz. Among the dead; i.e. thou shalt be dead. See the like phrase, 2 Sam 12. 23. For that this should be understood of being in hell, where the Devils are, cannot be applied to Jonathan , and to many of the Israelites, who indeed died in the battle, but went not (in respect of the soul) to the place of the damned] the LORD also shall deliver the camp of Israel into the hand of the Philistines."}],"20":[{"catchword":null,"tekst":"Then Saul fell hastily on the ground, [Heb. Then Saul hasted and fell on the ground] as long as he was, [Heb. (with) the fullness of his stature, or, length] and he was sore afraid, because of the words of Samuel, there was also no strength in him; for he had eaten no bread [i.e. take no food] all the day, nor all the night."}],"21":[{"catchword":null,"tekst":"Now the Woman came to Saul, and saw that he was sore amazed: and she said unto him, Behold, thine handmaid hath hearkened to thy voice, [i.e. I have hearkened to thy voice] and I have put my soul in mine hand, [Heb. Palm. As if she would say, I have ventured my life: for she had to please Saul, done that which ought to have been punished with death, If Saul had persisted in his former intent whereof mention is made, vers.9. See the annotate. On Judg. 12. 3.] and I have hearkened unto thy words, which thou spakest unto me."}],"22":[{"catchword":null,"tekst":"Now therefore, I pray thee, hearken thou also unto the voice of thine hand maid, and let me set a morsel of bread before thee, and eat: so shall there be strength in thee, that thou mayest go on (thy) way."}],"23":[{"catchword":null,"tekst":"But he refused it, and said, I will not eat: but his servants, and also the woman were instant with him: then hearkened he to their voice: and he arose from the ground, and set himself on the bed,"}],"24":[{"catchword":null,"tekst":"And the Woman had fatted Calf in the house, and she hasted, and killed it, and she took meal, and kneaded it, and baked thereof unleavened (cakes)"}],"25":[{"catchword":null,"tekst":"And she brought them before Saul, and before his servants, and they did eat: after that they rose up, and went away the same night."}]}}};

function md(t) {  // *cursief* -> <em>, noot [n] -> sup

  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
