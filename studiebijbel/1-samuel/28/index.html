gen": {"SVnu": {"1": "Het gebeurde in die dagen, toen de Filistijnen hun legers verzamelden om te strijden tegen Israël, dat Achis tegen David zei: U moet goed weten dat u met mij mee zult trekken in het leger, u en uw mannen.", "2": "Toen zei David tegen Achis: Zo zult u weten wat uw dienaar doen zal. En Achis zei tegen David: Daarom zal ik u voor altijd tot bewaarder van mijn hoofd aanstellen.", "3": "Samuel nu was gestorven, en heel Israël had rouw over hem bedreven; en zij hadden hem begraven in Rama, namelijk in zijn eigen stad. En Saul had de waarzeggers en de geestenbezweerders uit het land weggedaan.", "4": "En de Filistijnen kwamen en verzamelden zich, en zij sloegen hun kamp op bij Sunem; en Saul verzamelde heel Israël, en zij sloegen hun kamp op bij Gilboa.", "5": "Toen Saul het leger van de Filistijnen zag, werd hij bang, en zijn hart beefde erg.", "6": "En Saul vroeg de HEERE, maar de HEERE antwoordde hem niet; niet door dromen, niet door de Urim[1], niet door de profeten.", "7": "Toen zei Saul tegen zijn dienaren: Zoek voor mij een vrouw die een waarzeggende geest heeft, zodat ik naar haar toe ga en door haar onderzoek doe. Zijn dienaren nu zeiden tegen hem: Zie, in Endor is een vrouw die een waarzeggende geest heeft.", "8": "En Saul vermomde zich, en trok andere kleren aan, en ging op weg, met twee mannen bij hem, en zij kwamen 's nachts bij de vrouw, en hij zei: Voorspel mij toch door de waarzeggende geest, en laat opkomen wie ik u zeggen zal.", "9": "Toen zei de vrouw tegen hem: Zie, u weet wat Saul gedaan heeft, hoe hij de waarzeggers en de geestenbezweerders uit dit land heeft uitgeroeid; waarom legt u mij dan een valstrik, om mij te doden?", "10": "Saul nu zwoer haar bij de HEERE en zei: *Zo waarachtig als* de HEERE leeft, u zal geen straf om deze zaak overkomen!", "11": "Toen zei de vrouw: Wie zal ik voor u laten opkomen? En hij zei: Laat Samuel voor mij opkomen.", "12": "Toen de vrouw Samuel zag, riep zij met luide stem, en de vrouw sprak tegen Saul en zei: Waarom hebt u mij bedrogen? Want u bent Saul.", "13": "En de koning zei tegen haar: Wees niet bang; maar wat ziet u? Toen zei de vrouw tegen Saul: Ik zie goden, opkomend uit de aarde.", "14": "Hij dan zei tegen haar: Hoe ziet hij eruit? En zij zei: Er komt een oude man op, en hij is met een mantel bekleed. Toen Saul begreep dat het Samuel was, boog hij zich met zijn gezicht ter aarde, en boog hij zich neer.", "15": "En Samuel zei tegen Saul: Waarom hebt u mij onrustig gemaakt, door mij te laten opkomen? Toen zei Saul: Ik ben erg beangstigd, want de Filistijnen strijden tegen mij, en God is van mij geweken, en antwoordt mij niet meer, niet door de dienst van de profeten, niet door dromen; daarom heb ik u geroepen, zodat u mij te kennen geeft wat ik doen zal.", "16": "Toen zei Samuel: Waarom vraagt u mij dit toch, terwijl de HEERE van u geweken en uw vijand geworden is?", "17": "Want de HEERE heeft voor Zich gedaan, zoals Hij door mijn dienst gesproken heeft; en Hij heeft het koninkrijk uit uw hand gescheurd, en Hij heeft het gegeven aan uw naaste, aan David.", "18": "Zoals u naar de stem van de HEERE niet geluisterd hebt, en de gloed van Zijn toorn niet uitgevoerd hebt tegen Amalek; daarom heeft de HEERE u deze zaak aangedaan op deze dag.", "19": "En de HEERE zal ook Israël met u in de hand van de Filistijnen geven, en morgen zult u en uw zonen bij mij zijn; ook zal de HEERE het leger van Israël in de hand van de Filistijnen geven.", "20": "Toen viel Saul haastig ter aarde, zo lang als hij was, en hij was erg bang vanwege de woorden van Samuel; ook was er geen kracht in hem, want hij had de hele dag en de hele nacht geen brood gegeten.", "21": "De vrouw nu kwam bij Saul, en zag dat hij erg verbijsterd was; en zij zei tegen hem: Zie, uw dienstmaagd heeft naar uw stem geluisterd, en ik heb mijn leven in mijn hand gesteld, en ik heb uw woorden gehoord die u tegen mij gesproken hebt.", "22": "Zo luister toch ook naar de stem van uw dienstmaagd, en laat mij een stuk van het brood voor u zetten, en eet; zo zal er kracht in u zijn, zodat u op weg kunt gaan.", "23": "Doch hij weigerde het, en zei: Ik zal niet eten. Maar zijn dienaren, en ook de vrouw, drongen bij hem aan. Toen luisterde hij naar hun stem, en hij stond op van de aarde, en ging op het bed zitten.", "24": "En de vrouw had een gemest kalf in het huis; en zij haastte zich en slachtte het; en zij nam meel, en kneedde het, en bakte daar ongezuurde *koeken* van.", "25": "En zij bracht ze voor Saul en voor zijn dienaren, en zij aten; daarna stonden zij op, en gingen weg diezelfde nacht."}, "SV": {"1": "En het geschiedde in die dagen, als de Filistijnen hun legers vergaderden tot den strijd, om tegen Israël te strijden, zo zeide Achis tot David: Gij zult zekerlijk weten, dat gij met mij in het leger zult uittrekken, gij en uw mannen.", "2": "Toen zeide David tot Achis: Aldus zult gij weten, wat uw knecht doen zal. En Achis zeide tot David: Daarom zal ik u ten bewaarder mijns hoofds zetten, te allen dage.", "3": "Samuël nu was gestorven, en gans Israël had rouw over hem bedreven; en zij hadden hem begraven te Rama, te weten in zijn stad. En Saul had uit het land weggedaan de waarzeggers en duivelskunstenaars.", "4": "En de Filistijnen kwamen en vergaderden zich, en zij legerden zich te Sunem; en Saul vergaderde gans Israël, en zij legerden zich op Gilboa.", "5": "Toen Saul het leger der Filistijnen zag, zo vreesde hij, en zijn hart beefde zeer.", "6": "En Saul vraagde den HEERE; maar de HEERE antwoordde hem niet; noch door dromen, noch door de urim, noch door de profeten.", "7": "Toen zeide Saul tot zijn knechten: Zoekt mij een vrouw, die een waarzeggenden geest heeft, dat ik tot haar ga, en door haar onderzoeke. Zijn knechten nu zeiden tot hem: Zie, te Endor is een vrouw, die een waarzeggenden geest heeft.", "8": "En Saul verstelde zich, en trok andere klederen aan, en ging heen, en twee mannen met hem, en zij kwamen des nachts tot de vrouw, en hij zeide: Voorzeg mij toch door den waarzeggenden geest, en doe mij opkomen, dien ik tot u zeggen zal.", "9": "Toen zeide de vrouw tot hem: Zie, gij weet, wat Saul gedaan heeft, hoe hij de waarzegsters en de duivelskunstenaars uit dit land heeft uitgeroeid; waarom stelt gij dan mijn ziel een strik, om mij te doden?", "10": "Saul nu zwoer haar bij den HEERE, zeggende: *Zo* *waarachtig* *als* de HEERE leeft, indien u een straf om deze zaak zal overkomen!", "11": "Toen zeide de vrouw: Wien zal ik u doen opkomen? En hij zeide: Doe mij Samuël opkomen.", "12": "Toen nu de vrouw Samuël zag, zo riep zij met luider stem, en de vrouw sprak tot Saul, zeggende: Waarom hebt gij mij bedrogen? Want gij zijt Saul.", "13": "En de koning zeide tot haar: Vrees niet; maar wat ziet gij? Toen zeide de vrouw tot Saul: Ik zie goden, uit de aarde opkomende.", "14": "Hij dan zeide tot haar: Hoe is zijn gedaante? En zij zeide: Er komt een oud man op, en hij is met een mantel bekleed. Toen Saul vernam, dat het Samuël was, zo neigde hij zich met het aangezicht ter aarde, en hij boog zich.", "15": "En Samuël zeide tot Saul: Waarom hebt gij mij onrustig gemaakt, mij doende opkomen? Toen zeide Saul: Ik ben zeer beangstigd, want de Filistijnen krijgen tegen mij, en God is van mij geweken, en antwoordt mij niet meer, noch door den dienst der profeten, noch door dromen; daarom heb ik u geroepen, dat gij mij te kennen geeft, wat ik doen zal.", "16": "Toen zeide Samuël: Waarom vraagt gij mij toch, dewijl de HEERE van u geweken en uw vijand geworden is?", "17": "Want de HEERE heeft voor Zich gedaan, gelijk als Hij door mijn dienst gesproken heeft; en heeft het koninkrijk van uw hand gescheurd, en Hij heeft dat gegeven aan uw naaste, aan David.", "18": "Gelijk als gij naar de stem des HEEREN niet gehoord hebt, en de hittigheid Zijns toorns niet uitgericht hebt tegen Amalek; daarom heeft de HEERE u deze zaak gedaan te dezen dage.", "19": "En de HEERE zal ook Israël met u in de hand der Filistijnen geven, en morgen zult gij en uw zonen bij mij zijn; ook zal de HEERE het leger van Israël in de hand der Filistijnen geven.", "20": "Toen viel Saul haastelijk ter aarde, zo lang als hij was, en hij vreesde zeer vanwege de woorden van Samuël; ook was er geen kracht in hem; want hij had den gehelen dag en den gehelen nacht geen brood gegeten.", "21": "De vrouw nu kwam tot Saul, en zag, dat hij zeer verbaasd was; en zij zeide tot hem: Zie, uw dienstmaagd heeft naar uw stem gehoord, en ik heb mijn ziel in mijn hand gesteld, en ik heb uw woorden gehoord, die gij tot mij gesproken hebt.", "22": "Zo hoor toch gij nu ook naar de stem uwer dienstmaagd, en laat mij een bete broods voor u zetten, en eet; zo zal er kracht in u zijn, dat gij over weg gaat.", "23": "Doch hij weigerde het, en zeide: Ik zal niet eten. Maar zijn knechten, en ook de vrouw, hielden bij hem aan. Toen hoorde hij naar hun stem, en hij stond op van de aarde, en zette zich op het bed.", "24": "En de vrouw had een gemest kalf in het huis; en zij haastte zich en slachtte het; en zij nam meel, en kneedde het, en bakte daar ongezuurde *koeken* van.", "25": "En zij bracht ze voor Saul en voor zijn knechten, en zij aten; daarna stonden zij op, en gingen weg in dienzelfden nacht."}, "KJV": {"1": "And it came to pass in those days, that the Philistines gathered ➔ their armies together for warfare, to fight with Israel. And Achish said unto David, Know thou assuredly, that thou shalt go out with me to battle, thou and thy men.", "2": "And David said to Achish, Surely thou shalt know what thy servant can do. And Achish said to David, Therefore will I make thee keeper of mine head for ever.", "3": "Now Samuel was dead, and all Israel had lamented him, and buried him in Ramah, even in his own city. And Saul had put away those that had familiar spirits, and the wizards, out of the land.", "4": "And the Philistines gathered themselves together, and came and pitched in Shunem: and Saul gathered ➔ all Israel together, and they pitched in Gilboa.", "5": "And when Saul saw the host of the Philistines, he was afraid, and his heart greatly trembled.", "6": "And when Saul enquired of the LORD, the LORD answered him not, neither by dreams, nor by Urim, nor by prophets.", "7": "Then said Saul unto his servants, Seek me a woman that hath a familiar spirit, that I may go to her, and enquire of her. And his servants said to him, Behold, there is a woman that hath a familiar spirit at Endor.", "8": "And Saul disguised himself, and put on other raiment, and he went, and two men with him, and they came to the woman by night: and he said, I pray thee, divine unto me by the familiar spirit, and bring me him up, whom I shall name unto thee.", "9": "And the woman said unto him, Behold, thou knowest what Saul hath done, how he hath cut off those that have familiar spirits, and the wizards, out of the land: wherefore then layest thou a snare for my life, to cause me to die?", "10": "And Saul sware to her by the LORD, saying, As the LORD liveth, there shall no punishment happen to thee for this thing.", "11": "Then said the woman, Whom shall I bring up unto thee? And he said, Bring me up Samuel.", "12": "And when the woman saw Samuel, she cried with a loud voice: and the woman spake to Saul, saying, Why hast thou deceived me? for thou art Saul.", "13": "And the king said unto her, Be not afraid: for what sawest thou? And the woman said unto Saul, I saw gods ascending out of the earth.", "14": "And he said unto her, What form is he of? And she said, An old man cometh up; and he is covered with a mantle. And Saul perceived that it was Samuel, and he stooped with his face to the ground, and bowed himself.", "15": "And Samuel said to Saul, Why hast thou disquieted me, to bring me up? And Saul answered, I am sore distressed; for the Philistines make war against me, and God is departed from me, and answereth me no more, neither by prophets, nor by dreams: therefore I have called thee, that thou mayest make known unto me what I shall do.", "16": "Then said Samuel, Wherefore then dost thou ask of me, seeing the LORD is departed from thee, and is become thine enemy?", "17": "And the LORD hath done to him, as he spake by me: for the LORD hath rent the kingdom out of thine hand, and given it to thy neighbour, even to David:", "18": "Because thou obeyedst not the voice of the LORD, nor executedst his fierce wrath upon Amalek, therefore hath the LORD done this thing unto thee this day.", "19": "Moreover the LORD will also deliver Israel with thee into the hand of the Philistines: and to morrow shalt thou and thy sons be with me: the LORD also shall deliver the host of Israel into the hand of the Philistines.", "20": "Then Saul fell straightway all along on the earth, and was sore afraid, because of the words of Samuel: and there was no strength in him; for he had eaten no bread all the day, nor all the night.", "21": "And the woman came unto Saul, and saw that he was sore troubled, and said unto him, Behold, thine handmaid hath obeyed thy voice, and I have put my life in my hand, and have hearkened unto thy words which thou spakest unto me.", "22": "Now therefore, I pray thee, hearken thou also unto the voice of thine handmaid, and let me set a morsel of bread before thee; and eat, that thou mayest have strength, when thou goest on thy way.", "23": "But he refused, and said, I will not eat. But his servants, together with the woman, compelled him; and he hearkened unto their voice. So he arose from the earth, and sat upon the bed.", "24": "And the woman had a fat calf in the house; and she hasted, and killed it, and took flour, and kneaded it, and did bake unleavened bread thereof:", "25": "And she brought it before Saul, and before his servants; and they did eat. Then they rose up, and went away that night."}}, "tsk": {"1": [{"kopje": "dat de", "refs": ["1 Sam 7:7", "1 Sam 13:5", "1 Sam 17:1", "1 Sam 29:1"]}, {"kopje": "Filistijnen", "refs": ["Richt 3:1-4"]}, {"kopje": "u ... zult trekken", "refs": [
