: "Luk 15:27", "href": "../../lukas/15/#v27", "ref": "Luk 15:27", "svLabel": null}], "kinderen": []}]}]}, "25": {"torrey": [{"topic": "Calf, The", "href": "../../torrey/c/#t-calf-the", "kinderen": [{"label": "When fattened considered a delicacy", "href": "../../torrey/c/?hl=1Sam.28.25#i2324", "refs": [{"disp": "1 Sam 28:24", "href": "../../1-samuel/28/#v24", "ref": "1 Sam 28:24", "svLabel": null}, {"disp": "1 Sam 28:25", "href": "../../1-samuel/28/#v25", "ref": "1 Sam 28:25", "svLabel": null}, {"disp": "Amos 6:4", "href": "../../amos/6/#v4", "ref": "Amos 6:4", "svLabel": null}, {"disp": "Luk 15:23", "href": "../../lukas/15/#v23", "ref": "Luk 15:23", "svLabel": null}, {"disp": "Luk 15:27", "href": "../../lukas/15/#v27", "ref": "Luk 15:27", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"Jer 4:4": "Besnijd u voor de HEERE en doe de voorhuiden van uw hart weg, mannen van Juda en inwoners van Jeruzalem! Anders zal Mijn grimmigheid uitvaren als een vuur, en branden zodat niemand het kan blussen, vanwege de slechtheid van uw daden.", "1 Sam 27:2-12": "Toen maakte David zich op en trok weg, hij en de zeshonderd mannen die bij hem waren, naar Achis, de zoon van Maoch, de koning van Gath. En David bleef bij Achis in Gath, hij en zijn mannen, ieder met zijn huisgezin; David met zijn beide vrouwen, Ahinoam, de Jizreëlietische, en Abigaïl, de vrouw van Nabal, de Karmelietische. Toen aan Saul verteld werd dat David naar Gath gevlucht was, ging hij hem niet meer zoeken.", "Richt 6:19": "En Gideon ging naar binnen, en maakte een geitenbokje klaar, en ongezuurde koeken van een efa meel; het vlees legde hij in een mand, en het vleesnat deed hij in een pot; en hij bracht het naar Hem toe, onder de eik, en zette het neer.", "Jer 51:45": "Ga uit, Mijn volk, uit haar midden, en red ieder zijn ziel, vanwege de gloed van de toorn van de HEERE.", "Jer 10:10": "Maar de HEERE God is de Waarheid, Hij is de levende God, en een eeuwige Koning; van Zijn verbolgenheid beeft de aarde, en de heidenen kunnen Zijn gramschap niet verdragen.", "Jer 3:12": "Ga heen, en roep deze woorden uit naar het noorden, en zeg: Bekeer u, afgekeerd Israël! spreekt de HEERE, dan zal Ik Mijn toorn niet op u laten vallen; want Ik ben goedertieren, spreekt de HEERE. Ik zal de toorn niet voor eeuwig behouden.", "Rom 1:18": "Want de toorn van God wordt geopenbaard van de hemel over alle goddeloosheid en ongerechtigheid van de mensen, die de waarheid in ongerechtigheid ten onder houden.", "1 Sam 13:13": "Toen zei Samuël tegen Saul: U hebt dwaas gedaan; u hebt het gebod van de HEERE, uw God, niet gehouden, dat Hij u geboden had; want de HEERE zou nu uw koningschap over Israël voor eeuwig bevestigd hebben.", "Jes 21:4": "Mijn hart bonst, huivering verschrikt mij; de schemering waar ik naar verlangd heb, die maakt Hij voor mij tot beving.", "1 Kon 14:3": "En neem in uw hand tien broden, en koeken, en een kruik honing, en ga naar hem toe; hij zal u vertellen wat er met deze jongen gebeuren zal.", "Matt 26:24": "De Zoon des mensen gaat wel heen, zoals over Hem geschreven is; maar wee die mens door wie de Zoon des mensen verraden wordt; het zou beter voor hem geweest zijn als die mens niet geboren was.", "Ex 12:34": "En het volk nam zijn deeg op, voordat het gedesemd was, hun deegbakken, gebonden in hun kleren, op hun schouders.", "Jer 28:16": "Daarom, zo zegt de HEERE: Zie, Ik zal u wegwerpen van de aardbodem; dit jaar zult u sterven, omdat u een afval gesproken hebt tegen de HEERE.", "Amos 6:4-6": "Die daar liggen op ivoren bedsteden, en weelderig zijn op hun rustbanken, en de lammeren van de kudde eten, en de kalveren uit het midden van de meststal. Die bij het geschal van de luit kwinkeleren, en zichzelf instrumenten van muziek bedenken, zoals David; Die wijn uit schalen drinken, en zich zalven met de beste olie, maar zich niet bekommeren over de verbreking van Jozef.", "Jer 7:20": "Daarom zegt de Heere HEERE zo: Zie, Mijn toorn en Mijn grimmigheid zal uitgestort worden over deze plaats, over de mensen en over de dieren, en over de bomen van het veld, en over de vrucht van het aardrijk; en het zal branden, en niet uitgeblust worden.", "1 Sam 25:37": "Het gebeurde nu 's morgens, toen de wijn van Nabal uitgewerkt was, dat zijn vrouw hem die woorden vertelde. Toen bestierf zijn hart in zijn binnenste, en hij werd als een steen.", "1 Sam 7:7": "Toen de Filistijnen hoorden dat de kinderen van Israël zich verzameld hadden te Mizpa, kwamen de leiders van de Filistijnen op tegen Israël. Toen de kinderen van Israël dat hoorden, werden zij bang voor de Filistijnen.", "Klaagl 2:9": "Teth. Haar poorten zijn in de aarde verzonken; Hij heeft haar grendels verdorven en gebroken; haar koning en haar vorsten zijn onder de heidenen; er is geen wet; haar profeten vinden ook geen gezicht van de HEERE.", "Klaagl 4:11": "Caph. De HEERE heeft Zijn grimmigheid volbracht, Hij heeft de gloed van Zijn toorn uitgestort; en Hij heeft in Sion een vuur aangestoken, dat haar fundamenten verteerd heeft.", "Ps 74:9": "Wij zien onze tekens niet; er is geen profeet meer, en er is niemand bij ons die weet hoe lang.", "Hand 5:9": "En Petrus zei tot haar: Wat is het, dat u onderling hebt afgesproken om de Geest van de Heere te verzoeken? Zie, de voeten van hen die uw man begraven hebben, zijn voor de deur, en zullen u uitdragen.", "1 Sam 28:3-20": "Samuel nu was gestorven, en heel Israël had rouw over hem bedreven; en zij hadden hem begraven in Rama, namelijk in zijn eigen stad. En Saul had de waarzeggers en de geestenbezweerders uit het land weggedaan. En de Filistijnen kwamen en verzamelden zich, en zij sloegen hun kamp op bij Sunem; en Saul verzamelde heel Israël, en zij sloegen hun kamp op bij Gilboa. Toen Saul het leger van de Filistijnen zag, werd hij bang, en zijn hart beefde erg.", "1 Kon 22:34": "Toen spande een man zijn boog, zomaar, zonder te mikken, en schoot de koning van Israël tussen de gespen en het pantser. Toen zei hij tegen zijn voerman: Keer uw hand, en breng mij uit het leger, want ik ben zwaar gewond.", "Ps 106:23": "Daarom zei Hij dat Hij hen zou verdelgen, ware het niet dat Mozes, Zijn uitverkorene, in de scheur voor Zijn aangezicht gestaan had, om Zijn grimmigheid af te keren, zodat Hij hen niet verdierf.", "Jes 57:1": "De rechtvaardige komt om, en er is niemand die het ter harte neemt; en de goede mensen worden weggenomen, zonder dat iemand erop let dat de rechtvaardige weggenomen wordt vóór het kwaad komt.", "1 Kon 21:4": "Toen kwam Achab in zijn huis, knorrig en toornig over het woord dat Naboth, de Jizreëliet, tot hem gesproken had, want hij had gezegd: Ik zal de erfenis van mijn vaderen niet geven. En hij legde zich neer op zijn bed, keerde zijn gezicht om, en at geen brood.", "Ps 78:21": "Daarom hoorde de HEERE, en werd verbolgen; en een vuur werd ontstoken tegen Jakob, en ook toorn ging op tegen Israël;", "Ex 29:2": "En ongezuurd brood, en ongezuurde koeken, met olie gemengd, en ongezuurde vladen, met olie bestreken; van tarwemeelbloem zult u ze maken.", "Jes 9:18": "Vanwege de verbolgenheid van de HEERE van de heerscharen, zal het land verduisterd worden; en het volk zal zijn als een voedsel van het vuur: de een zal de ander niet ontzien.", "Job 26:2": "Hoe hebt u hem geholpen die geen kracht heeft, en de arm gered die geen sterkte heeft?", "Luk 24:29": "En zij drongen bij Hem aan en zeiden: Blijf bij ons, want het is bijna avond, en de dag is bijna voorbij. En Hij ging naar binnen om bij hen te blijven.", "Openb 16:19": "En de grote stad werd in drie delen gescheurd, en de steden van de heidenvolken vielen; en aan het grote Babylon werd gedacht voor God, om haar de drinkbeker te geven van de wijn van de toorn van Zijn gramschap.", "Jes 7:2": "Toen men het huis van David boodschapte en zei: De Syriërs liggen bij Efraïm, bewoog zijn hart zich, en het hart van zijn volk, zoals de bomen van het woud bewegen door de wind.", "2 Sam 1:6": "Toen zei de jongeman die hem de boodschap bracht: Ik kwam toevallig op het gebergte van Gilboa; en kijk, Saul leunde op zijn speer; en kijk, de wagens en ruiters zaten hem dicht op de hielen.", "Klaagl 2:1": "Aleph. Hoe heeft de Heere de dochter Sion in Zijn toorn bewolkt? Hij heeft de heerlijkheid van Israël van de hemel op de aarde neergeworpen; en Hij heeft aan de voetbank van Zijn voeten niet gedacht in de dag van Zijn toorn.", "Hab 2:3": "Want het visioen is nog bestemd voor een vastgestelde tijd, maar op het einde zal Hij het vervullen, en het zal niet liegen; al blijft het uit, verwacht het toch, want het zal zeker komen, het zal niet achterblijven.", "2 Sam 18:13": "Of had ik uit valsheid tegen mijn eigen leven gehandeld? Want geen ding blijft voor de koning verborgen; ook u zelf zou u er dan tegenover mij van afzijdig gehouden hebben.", "Jer 30:24": "De gloed van de toorn van de HEERE zal zich niet afwenden, totdat Hij het gedaan heeft, en totdat Hij tot stand gebracht heeft de gedachten van Zijn hart; in het laatste van de dagen zult u daarop letten.", "Ps 90:11": "Wie kent de sterkte van de toorn van U, en Uw verbolgenheid, naarmate U te vrezen bent?", "Joh 13:23": "En een van Zijn discipelen, die Jezus liefhad, lag aan tafel dicht bij Jezus.", "Jes 8:19": "Wanneer zij dan tegen u zeggen zullen: Vraag waarzeggers en duivelskunstenaars, die daar piepen en binnensmonds mompelen; zo zeg: Zal een volk niet zijn God vragen? Zal men voor de levenden de doden vragen?", "Hos 9:12": "Ofschoon zij hun kinderen mochten grootbrengen, Ik zal hen er toch van beroven, zodat er geen mens over zal blijven; want ook, wee hun, wanneer Ik van hen zal zijn weggegaan!", "Gen 19:3": "En hij hield sterk bij hen aan, zodat zij bij hem introkken, en in zijn huis kwamen; en hij maakte hun een maaltijd, en bakte ongezuurde koeken, en zij aten.", "1 Sam 23:9": "Toen David begreep dat Saul dit kwaad heimelijk tegen hem voorhad, zei hij tegen de priester Abjathar: Breng de efod hierheen.", "Jak 4:3": "U bidt, en u ontvangt niet, omdat u verkeerd bidt, met de bedoeling het in uw lusten door te brengen.", "Spr 25:20": "Wie liederen zingt bij een treurig hart, is als iemand die een kleed aflegt op de dag van de koude, en als azijn op salpeter.", "Ex 4:16": "En hij zal voor u tot het volk spreken; en het zal gebeuren, dat hij u tot een mond zal zijn, en u zult hem tot een god zijn.", "2 Kon 1:2": "En Ahazia viel door een traliewerk in zijn bovenzaal, die te Samaria was, en werd ziek. En hij zond boden en zei tegen hen: Ga heen, vraag Baäl-Zebub, de god van Ekron, of ik van deze ziekte genezen zal worden.", "Jes 9:20": "Manasse Efraïm, en Efraïm Manasse, en zij zullen samen tegen Juda zijn. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.", "1 Kon 2:40": "Toen maakte Simeï zich klaar, en zadelde zijn ezel, en ging naar Gath, naar Achis, om zijn knechten te zoeken; zo ging Simeï, en bracht zijn knechten terug uit Gath.", "Hos 13:11": "Ik gaf u een koning in Mijn toorn en nam hem weg in Mijn woede.", "Deut 9:18-20": "En ik wierp mij neer voor het aangezicht van de HEERE, zoals de eerste keer, veertig dagen en veertig nachten; ik at geen brood, en dronk geen water; om al uw zonde, die u had gezondigd door te doen wat kwaad is in de ogen van de HEERE, om Hem tot toorn te verwekken. Want ik vreesde vanwege de toorn en de grimmigheid waarmee de HEERE zeer op u vertoornd was, om u te verdelgen; toch verhoorde de HEERE mij ook op dat moment. Ook vertoornde de HEERE Zich zeer tegen Aäron, om hem te verdelgen; toch bad ik ook op datzelfde tijdstip voor Aäron.", "Richt 10:7": "Toen ontstak de toorn van de HEERE tegen Israël; en Hij verkocht hen in de hand van de Filistijnen en in de hand van de Ammonieten.", "Jes 57:21": "De goddelozen, zegt mijn God, hebben geen vrede.", "Jer 23:20": "De toorn van de HEERE zal zich niet afwenden, totdat Hij het zal hebben gedaan, en totdat Hij de gedachten van Zijn hart tot stand zal hebben gebracht; in de laatste dagen zult u dat met verstand inzien.", "1 Sam 20:30-33": "Toen ontstak de toorn van Saul tegen Jonathan, en hij zei tegen hem: U, zoon van de verkeerde in weerspannigheid, weet ik het niet, dat u de zoon van Isaï verkozen hebt tot uw eigen schande, en tot schande van de naaktheid van uw moeder? Want alle dagen dat de zoon van Isaï op de aardbodem leeft, zult u noch uw koninkrijk bevestigd worden; nu dan, stuur iemand heen, en haal hem tot mij, want hij is een kind van de dood. Toen antwoordde Jonathan Saul, zijn vader, en zei tegen hem: Waarom zal hij gedood worden? Wat heeft hij gedaan?", "Jer 48:10": "Vervloekt is hij die het werk van de HEERE bedrieglijk doet; ja, vervloekt is hij die zijn zwaard van het bloed onthoudt!", "Hos 11:9": "Ik zal de gloed van Mijn toorn niet uitvoeren; Ik zal niet terugkeren om Efraïm te verderven; want Ik ben God en geen mens, de Heilige in uw midden, en Ik zal niet in de stad komen.", "1 Sam 28:7-19": "Toen zei Saul tegen zijn dienaren: Zoek voor mij een vrouw die een waarzeggende geest heeft, zodat ik naar haar toe ga en door haar onderzoek doe. Zijn dienaren nu zeiden tegen hem: Zie, in Endor is een vrouw die een waarzeggende geest heeft. En Saul vermomde zich, en trok andere kleren aan, en ging op weg, met twee mannen bij hem, en zij kwamen 's nachts bij de vrouw, en hij zei: Voorspel mij toch door de waarzeggende geest, en laat opkomen wie ik u zeggen zal. Toen zei de vrouw tegen hem: Zie, u weet wat Saul gedaan heeft, hoe hij de waarzeggers en de geestenbezweerders uit dit land heeft uitgeroeid; waarom legt u mij dan een valstrik, om mij te doden?", "2 Sam 14:11": "En zij zei: De koning gedenkt toch aan de HEERE, uw God, dat de bloedwrekers niet te talrijk worden om te verderven, zodat zij mijn zoon niet ombrengen. Toen zei hij: Zo waarachtig als de HEERE leeft, er zal geen haar van uw zoon op de aarde vallen!", "1 Kon 22:7": "Maar Josafat zei: Is hier niet nog een profeet van de HEERE, zodat wij het hem konden vragen?", "1 Sam 15:28": "Toen zei Samuël tegen hem: De HEERE heeft heden het koninkrijk van Israël van u afgescheurd, en heeft het aan uw naaste gegeven, die beter is dan u.", "1 Sam 23:10": "En David zei: HEERE, God van Israël! Uw dienaar heeft zeker gehoord dat Saul van plan is naar Kehila te komen, om de stad te vernietigen om mijnentwil.", "1 Sam 27:12": "En Achis geloofde David, en zei: Hij heeft zich helemaal onmogelijk gemaakt bij zijn volk, in Israël; daarom zal hij eeuwig mijn knecht zijn.", "2 Kon 6:27": "En hij zei: De HEERE helpt u niet; waarmee zou ik u helpen? Van de dorsvloer of van de wijnpers?", "1 Sam 25:1": "En Samuël stierf; en heel Israël verzamelde zich, en zij bedreven rouw over hem, en begroeven hem in zijn huis te Rama. En David maakte zich op, en trok af naar de woestijn Paran.", "1 Kron 10:13": "Zo stierf Saul in zijn overtreding, waarmee hij overtreden had tegen de HEERE, tegen het woord van de HEERE dat hij niet gehouden had; en ook omdat hij de waarzegster geraadpleegd had, haar zoekende,", "Jes 8:20": "Tot de wet en tot de getuigenis! Als zij niet spreken naar dit woord, zal het zijn dat zij geen dageraad zullen hebben.", "Openb 14:10": "die zal ook drinken uit de wijn van de toorn van God, die onvermengd ingeschonken is in de drinkbeker van Zijn toorn; en hij zal gepijnigd worden met vuur en zwavel voor de heilige engelen en voor het Lam.", "2 Kon 4:8": "Het gebeurde ook op een dag, toen Elisa naar Sunem doortrok, dat daar een voorname vrouw was, die hem drong om brood te eten. Verder gebeurde het, zo dikwijls hij doortrok, dat hij daar inwijkt om brood te eten.", "Joh 3:19": "En dit is het oordeel: dat het licht in de wereld gekomen is, en de mensen hebben de duisternis liever gehad dan het licht; want hun werken waren slecht.", "1 Sam 15:9-26": "Doch Saul en het hele volk verschoonden Agag, en de beste schapen, en runderen, en het naastbeste, en de lammeren, en alles wat goed was, en zij wilden dat niet verbannen; maar alles wat minderwaardig was en waardeloos, dat verbanden zij. Toen kwam het woord van de HEERE tot Samuël: Het berouwt Mij dat Ik Saul tot koning gemaakt heb, omdat hij zich van Mij afgekeerd heeft, en Mijn woorden niet volbracht heeft. Toen ontstak Samuël in toorn, en hij riep tot de HEERE de hele nacht.", "Dan 5:6": "Toen veranderde de gezichtskleur van de koning, en zijn gedachten verschrikten hem; en de banden van zijn heupen werden los, en zijn knieën stootten tegen elkaar aan.", "Gen 18:7": "En Abraham liep naar de runderen, en nam een kalf, mals en goed, en gaf het aan de knecht, die zich haastte om het klaar te maken.", "1 Sam 29:9": "Achis antwoordde en zei tegen David: Ik weet het; voorzeker, u bent aangenaam in mijn ogen, als een engel van God; maar de leiders van de Filistijnen hebben gezegd: Laat hem niet met ons optrekken in deze strijd.", "Matt 22:13": "Toen zei de koning tegen de dienaars: Bind zijn handen en voeten, neem hem mee en werp hem in de buitenste duisternis; daar zal het huilen zijn en het geknars van de tanden.", "Ex 33:5": "En de HEERE had tot Mozes gezegd: Zeg tegen de Israëlieten: U bent een hardnekkig volk; in één ogenblik zou Ik in uw midden optrekken, en u vernietigen; doch nu, leg uw sieraad van u af, en Ik zal weten wat Ik u doen zal.", "Rom 2:5": "Maar naar uw hardheid en onbekeerlijk hart, verzamelt u voor uzelf toorn als een schat, voor de dag van de toorn en de openbaring van het rechtvaardig oordeel van God.", "Joh 9:31": "En wij weten dat God de zondaars niet hoort; maar als iemand godvruchtig is en Zijn wil doet, die hoort Hij.", "1 Sam 15:27": "Toen Samuël zich omkeerde om weg te gaan, greep hij een slip van zijn mantel, en die scheurde.", "Ps 69:25": "Stort over hen Uw gramschap uit; en de gloed van Uw toorn grijpt hen aan.", "1 Sam 18:10-12": "En het gebeurde de volgende dag, dat de boze geest van God vaardig werd over Saul, en hij profeteerde midden in het huis, en David speelde snarenspel met zijn hand, zoals van dag tot dag; Saul nu had een speer in zijn hand. En Saul wierp de speer, en zei: Ik zal David aan de wand spietsen; maar David week tweemaal voor hem opzij. En Saul vreesde voor David, want de HEERE was met hem, en Hij was van Saul geweken.", "Ps 78:49": "Hij zond onder hen de gloed van Zijn toorn, verbolgenheid, en verstoordheid, en benauwdheid, met uitzending van boden van veel kwaad.", "Num 25:11": "Pinehas, de zoon van Eleazar, de zoon van Aäron, de priester, heeft Mijn grimmigheid van over de kinderen van Israël afgewend, omdat hij Mijn ijver geijverd heeft in hun midden, zodat Ik de kinderen van Israël in Mijn ijver niet vernietigd heb.", "Ps 48:6": "Zoals zij het zagen, zo waren zij verwonderd; zij werden verschrikt, zij haastten weg.", "Jes 13:9": "Zie, de dag van de HEERE komt, gruwelijk, met verbolgenheid en hevige toorn, om het land tot verwoesting te stellen, en de zondaars daaruit te verdelgen.", "1 Sam 24:21": "En nu, zie, ik weet dat u zeker koning worden zult, en dat het koninkrijk van Israël in uw hand bestaan zal.", "Jer 25:37": "Want de landerijen van de vrede zullen uitgeroeid worden, vanwege de gloed van de toorn van de HEERE.", "Matt 1:20": "En terwijl hij deze dingen overwoog, zie, de engel van de Heere verscheen hem in een droom en zei: Jozef, zoon van David! Wees niet bevreesd Maria, uw vrouw, tot u te nemen, want wat in haar ontvangen is, dat is uit de Heilige Geest;", "Dan 9:16": "O Heere! naar al Uw gerechtigheden, laat toch Uw toorn en Uw grimmigheid afgekeerd worden van Uw stad Jeruzalem, Uw heilige berg; want om onze zonden en om de ongerechtigheden van onze vaderen zijn Jeruzalem en Uw volk tot smaad bij allen die rondom ons zijn.", "Jes 21:3": "Daarom zijn mijn lendenen vol grote pijn, weeën hebben mij aangegrepen, zoals de weeën van een barende vrouw; ik krom mij van wat ik hoor, ik word ontsteld van wat ik zie.", "Jes 63:3-6": "Ik heb de pers alleen getreden, en er was niemand van de volken met Mij; en Ik heb hen getreden in Mijn toorn, en heb hen vertrapt in Mijn grimmigheid; en hun bloed is gesprenkeld op Mijn kleren, en heel Mijn gewaad heb Ik bezoedeld. Want de dag van de wraak was in Mijn hart, en het jaar van Mijn verlosten was gekomen. En Ik zag toe, en er was niemand die hielp; en Ik ontzette Mij, en er was niemand die ondersteunde; daarom heeft Mijn arm Mij heil beschikt, en Mijn grimmigheid heeft Mij ondersteund,", "Openb 6:16": "En zeiden tot de bergen en tot de steenrotsen: Valt op ons, en verbergt ons van het aangezicht van Hem Die op de troon zit, en van de toorn van het Lam.", "1 Sam 23:4": "Toen vroeg David de HEERE nog verder; en de HEERE antwoordde hem en zei: Maak u op, trek af naar Kehila; want Ik geef de Filistijnen in uw hand.", "1 Sam 18:12": "En Saul vreesde voor David, want de HEERE was met hem, en Hij was van Saul geweken.", "Joz 19:18": "En hun grens was Jizreëla, en Chesulloth, en Sunem,", "Gen 18:6": "En Abraham haastte zich naar de tent, naar Sara, en zei: Haast u; kneed drie maten meelbloem en maak koeken.", "Ex 28:20": "En de vierde rij van een Turkoois, en een Sardonix, en een Jaspis; zij zullen met goud ingevat zijn in hun vullingen.", "Ps 50:22": "Verstaat dit toch, u die God vergeet! opdat Ik niet verscheur en niemand redt.", "Richt 3:8": "Toen ontstak de toorn van de HEERE tegen Israël; en Hij verkocht hen in de hand van Cuschan-Rischataïm, koning van Mesopotamië; en de kinderen van Israël dienden Cuschan-Rischataïm acht jaren.", "2 Sam 16:16-19": "En het gebeurde, toen Husai, de Archiet, Davids vriend, bij Absalom kwam, dat Husai tegen Absalom zei: Leve de koning, leve de koning! Maar Absalom zei tegen Husai: Is dit uw trouw aan uw vriend? Waarom bent u niet met uw vriend meegegaan? En Husai zei tegen Absalom: Nee, maar wie de HEERE verkiest, en dit hele volk, en alle mannen van Israël, van hem zal ik zijn, en bij hem zal ik blijven.", "Deut 18:10": "Onder u mag niemand gevonden worden die zijn zoon of zijn dochter door het vuur laat gaan, die met waarzeggerij omgaat, een guichelaar, of die op vogelgeschrei let, of een tovenaar,", "2 Kon 22:13": "Ga heen, vraag de HEERE voor mij, en voor het volk, en voor heel Juda, over de woorden van dit boek dat gevonden is; want de grimmigheid van de HEERE is groot, die tegen ons ontstoken is, omdat onze vaderen niet geluisterd hebben naar de woorden van dit boek, om te doen naar alles wat voor ons geschreven is.", "Joh 10:35": "Als de wet hen goden genoemd heeft, tot wie het woord van God gekomen is, en de Schrift niet gebroken kan worden,", "Spr 14:14": "Wie afvallig van hart is, zal verzadigd worden van zijn eigen wegen; maar een goed man van zichzelf.", "Ps 73:19": "Hoe worden zij als in een ogenblik tot verwoesting, komen zij aan hun einde, gaan zij te niet van verschrikkingen!", "Jer 25:15-17": "Want zo heeft de HEERE, de God van Israël, tot mij gezegd: Neem deze beker van de wijn van de grimmigheid van Mijn hand, en geef die te drinken aan alle volken, tot wie Ik u zend; Dat zij drinken, en beven, en dol worden, vanwege het zwaard, dat Ik onder hen zal zenden. En ik nam de beker uit de hand van de HEERE, en ik gaf te drinken aan alle volken, tot wie de HEERE mij gezonden had;", "Ps 106:29": "En zij hebben de Heere tot toorn verwekt met hun daden, zodat de plaag een inbreuk onder hen deed.", "Deut 32:21": "Zij hebben Mij tot ijver verwekt door wat geen God is; zij hebben Mij tot toorn verwekt door hun ijdelheden; Ik dan zal hen tot ijver verwekken door hen die geen volk zijn; door een dwaas volk zal Ik hen tot toorn verwekken.", "Rom 12:9": "De liefde moet ongeveinsd zijn. Heb een afkeer van het kwade, en houd vast aan het goede.", "2 Kon 2:14": "En hij nam de mantel van Elia, die van hem afgevallen was, en sloeg het water, en zei: Waar is de HEERE, de God van Elia? Ja, Dezelfde? En hij sloeg het water, en het werd naar de ene en de andere kant verdeeld, en Elisa ging er door.", "Num 14:11": "En de HEERE zei tegen Mozes: Hoelang zal dit volk Mij tergen? En hoelang zullen zij niet aan Mij geloven, ondanks alle tekenen die Ik onder hen gedaan heb?", "1 Sam 15:23-26": "Want weerspannigheid is een zonde als toverij, en weerstreven is afgoderij en beeldendienst. Omdat u het woord van de HEERE verworpen hebt, zo heeft Hij u verworpen, dat u geen koning meer zult zijn. Toen zei Saul tegen Samuël: Ik heb gezondigd, omdat ik het bevel van de HEERE en uw woorden overtreden heb; want ik heb het volk gevreesd en naar hun stem geluisterd. Nu dan, vergeef mij toch mijn zonde, en keer met mij terug, dat ik de HEERE aanbid.", "Jer 4:26": "Ik keek, en zie, het vruchtbare land was een woestijn, en al zijn steden waren afgebroken, vanwege de HEERE, vanwege de gloed van Zijn toorn.", "Num 16:20": "En de HEERE sprak tot Mozes en tot Aäron, en zei:", "Hand 16:15": "En toen zij gedoopt was, en haar huis, smeekte zij ons: Als u geoordeeld hebt dat ik de Heere trouw ben, kom dan in mijn huis en blijf daar. En zij drong er sterk op aan.", "Amos 6:4": "Die daar liggen op ivoren bedsteden, en weelderig zijn op hun rustbanken, en de lammeren van de kudde eten, en de kalveren uit het midden van de meststal.", "Ps 106:32": "Zij maakten Hem ook zeer toornig aan het twistwater, en het ging Mozes kwalijk om hunnentwil.", "Joz 7:1": "Maar de kinderen van Israël overtraden door overtreding met het verbannene; want Achan, de zoon van Charmi, de zoon van Zabdi, de zoon van Zerah, uit de stam van Juda, nam van het verbannene. Toen ontstak de toorn van de HEERE tegen de kinderen van Israël.", "Ps 82:7": "Toch zult u sterven als een mens; en als een van de vorsten zult u vallen.", "Joz 7:26": "En zij richtten over hem een grote steenhoop op, die er tot op deze dag nog is. Zo keerde de HEERE zich af van de gloed van Zijn toorn. Daarom noemde men de naam van die plaats het dal van Achor, tot op deze dag toe.", "Ps 78:50": "Hij baande een pad voor Zijn toorn; Hij onttrok hun ziel niet aan de dood; en hun gedierte gaf Hij over aan de pestilentie.", "Jer 23:28": "De profeet, bij wie een droom is, vertelt de droom; en bij wie Mijn woord is, spreekt Mijn woord waarachtig; wat heeft het stro met het koren te maken? spreekt de HEERE.", "1 Kon 16:2-13": "Omdat Ik u uit het stof heb verheven, en u tot een voorganger over Mijn volk Israël heb aangesteld, en u gewandeld hebt in de weg van Jerobeam, en Mijn volk Israël hebt doen zondigen, en Mij tot toorn hebt verwekt door hun zonden; Zie, zo zal Ik de nakomelingen van Baësa, en de nakomelingen van zijn huis wegdoen; en Ik zal uw huis maken zoals het huis van Jerobeam, de zoon van Nebat. Wie van Baësa in de stad sterft, zullen de honden opeten, en wie van hem in het veld sterft, zullen de vogels van de hemel opeten.", "Ex 20:7": "U zult de naam van de HEERE, uw God, niet ijdel gebruiken; want de HEERE zal niet onschuldig houden wie Zijn naam ijdel gebruikt.", "2 Kon 6:33": "Terwijl hij nog met hen sprak, zie, zo kwam de bode bij hem af; en hij zei: Zie, dit kwaad is van de HEERE; wat zou ik nog langer op de HEERE wachten?", "Jes 57:20": "Maar de goddelozen zijn als een voortgejaagde zee, want die kan niet tot rust komen, en haar water werpt slijk en modder op.", "Lev 20:27": "Als nu een man of vrouw in zich een waarzeggende geest heeft, of een duivelskunstenaar is, zullen zij zeker gedood worden; men zal hen met stenen stenigen; hun bloed is op hen.", "1 Sam 28:3-25": "Samuel nu was gestorven, en heel Israël had rouw over hem bedreven; en zij hadden hem begraven in Rama, namelijk in zijn eigen stad. En Saul had de waarzeggers en de geestenbezweerders uit het land weggedaan. En de Filistijnen kwamen en verzamelden zich, en zij sloegen hun kamp op bij Sunem; en Saul verzamelde heel Israël, en zij sloegen hun kamp op bij Gilboa. Toen Saul het leger van de Filistijnen zag, werd hij bang, en zijn hart beefde erg.", "Ps 74:1": "Een onderwijzing, voor Asaf. O God! Waarom verstoot U ons voor eeuwig? Waarom zou Uw toorn roken tegen de schapen van Uw weide?", "Spr 5:11-13": "En u in uw laatste dagen kermt, als uw vlees en uw lijf verteerd zijn; En zegt: Hoe heb ik de tucht gehaat, en heeft mijn hart de bestraffing versmaad! En heb niet geluisterd naar de stem van mijn onderwijzers, mijn oren niet geneigd tot mijn leraars!", "1 Kon 20:42": "En hij zei tegen hem: Zo zegt de HEERE: Omdat u de man, die Ik verbannen had, uit uw hand hebt laten gaan, zal uw leven in de plaats van zijn leven zijn, en uw volk in de plaats van zijn volk.", "Openb 18:20": "Bedrijf vreugde over haar, u hemel, en u heilige apostelen en profeten, want God heeft uw oordeel aan haar voltrokken.", "1 Sam 12:25": "Maar als u toch kwaad blijft doen, zult u, evengoed als uw koning, omkomen.", "Ex 9:18": "Zie, Ik zal morgen omstreeks deze tijd een zeer zware hagel laten regenen, zoals in Egypte niet geweest is vanaf de dag dat het gegrond is, tot nu toe.", "Dan 5:25-28": "Dit nu is het schrift dat daar getekend is: MENE, MENE, TEKEL, UPHARSIN. Dit is de uitleg van deze woorden: MENE; God heeft uw koninkrijk geteld, en Hij heeft het beëindigd. TEKEL; u bent op een weegschaal gewogen, en u bent te licht bevonden.", "Jer 33:5": "Er zijn er wel gekomen om te strijden tegen de Chaldeeën, maar het is om die te vullen met de dode lichamen van mensen die Ik verslagen heb in Mijn toorn en in Mijn grimmigheid; en omdat Ik Mijn aangezicht van deze stad verborgen heb, vanwege al hun slechtheid.", "Jer 17:4": "Zo zult u aflaten (en dat om uzelf) van uw erfenis, die Ik u gegeven heb, en Ik zal u uw vijanden doen dienen in een land, dat u niet kent; want u hebt een vuur aangestoken in Mijn toorn, tot in eeuwigheid zal het branden.", "Matt 26:72": "En hij loochende het opnieuw met een eed: Ik ken de Mens niet.", "Dan 1:10": "Want de leider van de kamerlingen zei tegen Daniël: Ik ben bang voor mijn heer, de koning, die uw voedsel en uw drank heeft bepaald; want waarom zou hij zien dat uw gezichten er slechter uitzien dan die van de jongemannen die dezelfde leeftijd hebben als u? Dan zou u mijn hoofd bij de koning in gevaar brengen.", "1 Sam 17:1": "En de Filistijnen verzamelden hun leger ten strijde, en verzamelden zich te Socho, dat in Juda ligt; en zij legerden zich tussen Socho en Azeka, aan het einde van Dammim.", "Ex 22:28": "U mag de rechters niet vervloeken, en de leiders van uw volk mag u niet belasteren.", "1 Sam 16:14": "En de Geest van de HEERE week van Saul; en een boze geest van de HEERE verschrikte hem.", "Jer 21:5": "En Ik Zelf zal tegen u strijden, met een uitgestrekte hand en met een sterke arm, ja, met toorn, en met grimmigheid, en met grote verbolgenheid.", "Jes 13:13": "Daarom zal Ik de hemel beroeren, en de aarde zal bewogen worden van haar plaats, vanwege de verbolgenheid van de HEERE van de heerscharen, en vanwege de dag van Zijn hevige toorn.", "1 Sam 13:5": "En de Filistijnen werden verzameld om tegen Israël te strijden, dertigduizend wagens en zesduizend ruiters, en volk in menigte als het zand dat aan de oever van de zee is; en zij trokken op en legerden zich te Michmas, ten oosten van Beth-aven.", "Richt 5:31": "Zo moeten omkomen al Uw vijanden, o HEERE! Die Hem daarentegen liefhebben, moeten zijn, als wanneer de zon opgaat in haar kracht. En het land was stil, veertig jaren.", "Job 18:11": "De verschrikkingen zullen hem van alle kanten schrik aanjagen, en hem opjagen, hem op de voet volgend.", "2 Sam 7:15": "Maar Mijn goedertierenheid zal van hem niet wijken, zoals Ik die weggenomen heb van Saul, die Ik van voor uw aangezicht heb weggenomen.", "Num 32:13": "Zo ontstak de toorn van de HEERE tegen Israël, en Hij liet hen ronddwalen in de woestijn, veertig jaar lang, totdat heel het geslacht verteerd was dat gedaan had wat kwaad was in de ogen van de HEERE.", "Jes 57:16": "Want Ik zal niet eeuwig twisten, en Ik zal niet voortdurend toornig zijn; want de geest zou van voor Mijn aangezicht bezwijken, en de zielen die Ik gemaakt heb.", "Hos 7:4": "Zij plegen allemaal samen overspel, zij zijn als een bakoven, die heet gemaakt is door de bakker; die ophoudt met opstoken nadat hij het deeg heeft gekneed, totdat het doorgezuurd is.", "Jer 42:18": "Want zo zegt de HEERE van de heerscharen, de God van Israël: Zoals Mijn toorn en Mijn grimmigheid uitgestort is over de inwoners van Jeruzalem, zo zal Mijn grimmigheid over u uitgestort worden, als u in Egypte gekomen zult zijn; en u zult tot een vervloeking zijn, en tot een ontzetting, en tot een vloek, en tot smaad, en u zult deze plaats niet meer zien.", "Num 27:21": "En hij zal voor Eleazar, de priester, staan, die voor hem om raad zal vragen, volgens de wijze van Urim, voor de HEERE; naar zijn woord zullen zij uitgaan, en naar zijn woord zullen zij ingaan, hij, en alle kinderen van Israël met hem, en de hele vergadering.", "Jes 12:1": "En diezelfde dag zult u zeggen: Ik dank U, HEERE! Dat U toornig op mij geweest bent, maar Uw toorn is afgekeerd, en U troost mij.", "Num 32:11": "Zeker, deze mannen die uit Egypte zijn opgetrokken, van twintig jaar oud en daarboven, zullen het land niet zien dat Ik Abraham, Izak en Jakob gezworen heb! Want zij hebben Mij niet volledig gevolgd;", "1 Sam 9:6": "Hij daarentegen zei tegen hem: Zie toch, er is een man van God in deze stad, en hij is een geëerd man; alles wat hij zegt, komt zeker uit; laten wij nu daarheen gaan, misschien zal hij ons onze weg aanwijzen, die wij gaan zullen.", "1 Sam 14:37": "Toen vroeg Saul God: Zal ik de Filistijnen achterna trekken? Zult U ze in de hand van Israël overgeven? Maar Hij antwoordde hem die dag niet.", "1 Sam 21:10-15": "En David stond op, en vluchtte diezelfde dag van het aangezicht van Saul weg; en hij kwam bij Achis, de koning van Gath. Doch de knechten van Achis zeiden tegen hem: Is dit niet David, de koning van het land? Zong men niet van hem in de reidansen, en zei: Saul heeft zijn duizenden verslagen, maar David zijn tienduizenden? En David nam deze woorden ter harte; en hij was zeer bevreesd voor het aangezicht van Achis, de koning van Gath.", "Jer 2:18": "En nu, wat hebt u te doen met de weg van Egypte, om de wateren van Sihor te drinken? En wat hebt u te doen met de weg van Assur, om de wateren van de rivier te drinken?", "Num 12:9": "Zo ontstak de toorn van de HEERE tegen hen, en Hij ging weg.", "1 Sam 31:1-8": "De Filistijnen streden tegen Israël; en de mannen van Israël vluchtten voor de Filistijnen, en vielen verslagen op het gebergte Gilboa. En de Filistijnen zaten Saul en zijn zonen dicht op de hielen; en de Filistijnen versloegen Jonathan, en Abinadab, en Malchisua, de zonen van Saul. En de strijd werd zwaar tegen Saul; en de mannen die met de boog schieten, troffen hem, en hij werd zeer bang voor de schutters.", "2 Kon 2:13": "Hij nam ook Elia's mantel op, die van hem afgevallen was, en keerde terug, en ging bij de oever van de Jordaan staan.", "Ezech 7:26": "Ellende zal op ellende komen, en er zal gerucht op gerucht wezen; dan zullen zij het visioen van een profeet zoeken; maar de wet zal vergaan van de priester, en de raad van de oudsten.", "Ps 78:38": "Doch Hij, barmhartig zijnde, verzoende de ongerechtigheid, en verdierf hen niet; maar wendde dikwijls Zijn toorn af, en wekte Zijn hele grimmigheid niet op.", "Ezech 20:1-3": "En het gebeurde in het zevende jaar, in de vijfde maand, op de tiende van die maand, dat er mannen uit de oudsten van Israël kwamen, om de HEERE te vragen; en zij gingen voor mijn aangezicht zitten. Toen kwam het woord van de HEERE tot mij en Hij zei: Mensenkind, spreek tot de oudsten van Israël, en zeg tegen hen: Zo zegt de Heere HEERE: Komt u om Mij te vragen? Zo waarachtig als Ik leef, zo Ik door u gevraagd word, spreekt de Heere HEERE!", "Spr 1:27": "Wanneer uw vrees komt als een verwoesting, en uw verderf aankomt als een wervelwind; wanneer benauwdheid en angst u overkomt;", "Hand 5:10": "En zij viel meteen neer voor zijn voeten, en gaf de geest. En de jongelingen kwamen binnen, vonden haar dood, en droegen haar uit, en begroeven haar bij haar man.", "1 Sam 15:23": "Want weerspannigheid is een zonde als toverij, en weerstreven is afgoderij en beeldendienst. Omdat u het woord van de HEERE verworpen hebt, zo heeft Hij u verworpen, dat u geen koning meer zult zijn.", "Deut 25:17-19": "Denk eraan, wat Amalek u gedaan heeft op de weg, toen u uit Egypte wegtrok; hoe hij u op de weg tegemoetkwam, en van achteren allen sloeg die zwak waren en achterbleven, toen u moe en mat was; en hij vreesde God niet. Het zal dan gebeuren, als de HEERE, uw God, u rust gegeven heeft van al uw vijanden rondom, in het land dat de HEERE, uw God, u als erfdeel geven zal om het te bezitten, dat u de gedachtenis aan Amalek van onder de hemel zult uitwissen; vergeet het niet!", "2 Kon 1:3": "Maar de Engel van de HEERE sprak tot Elia, de Thisbiet: Maak u op, ga de boden van de koning van Samaria tegemoet, en spreek tot hen: Is het omdat er geen God in Israël is, dat u heengaat om Baäl-Zebub, de god van Ekron, te vragen?", "1 Sam 27:10": "Toen Achis zei: Waar zijn u vandaag ingevallen? zei David: Tegen het zuiden van Juda, en tegen het zuiden van de Jerahmeelieten, en tegen het zuiden van de Kenieten.", "Klaagl 3:25": "Teth. De HEERE is goed voor hen die Hem verwachten, voor de ziel die Hem zoekt.", "Openb 15:1": "En ik zag een ander groot en wonderlijk teken in de hemel: namelijk zeven engelen, die de zeven laatste plagen hadden; want in deze is de toorn van God geëindigd.", "Jes 42:25": "Daarom heeft Hij over hen uitgestort de grimmigheid van Zijn toorn en de macht van de oorlog; en Hij heeft ze rondom in vlam gezet, doch zij merken het niet; en Hij heeft ze in brand gestoken, doch zij nemen het niet ter harte.", "1 Sam 28:7-25": "Toen zei Saul tegen zijn dienaren: Zoek voor mij een vrouw die een waarzeggende geest heeft, zodat ik naar haar toe ga en door haar onderzoek doe. Zijn dienaren nu zeiden tegen hem: Zie, in Endor is een vrouw die een waarzeggende geest heeft. En Saul vermomde zich, en trok andere kleren aan, en ging op weg, met twee mannen bij hem, en zij kwamen 's nachts bij de vrouw, en hij zei: Voorspel mij toch door de waarzeggende geest, en laat opkomen wie ik u zeggen zal. Toen zei de vrouw tegen hem: Zie, u weet wat Saul gedaan heeft, hoe hij de waarzeggers en de geestenbezweerders uit dit land heeft uitgeroeid; waarom legt u mij dan een valstrik, om mij te doden?", "Ps 50:21": "Deze dingen doet u, en Ik zwijg; u meent dat Ik helemaal ben zoals u; Ik zal u straffen, en zal het ordelijk voor uw ogen op een rij zetten.", "Jer 4:8": "Hierom, doe zakken aan, bedrijf misbaar en huil; want de gloed van de toorn van de HEERE is niet van ons afgekeerd.", "Ps 7:12": "God is een rechtvaardige Rechter, en een God, Die iedere dag toornt.", "1 Kon 11:9": "Daarom vertoornde de HEERE Zich tegen Salomo, omdat hij zijn hart van de HEERE, de God van Israël, had afgewend, Die hem tweemaal verschenen was,", "Ps 83:11": "die verdelgd zijn bij Endor; zij zijn geworden tot mest voor de aarde.", "Num 11:1": "En het gebeurde dat het volk zich beklaagde, en dat was kwaad in de oren van de HEERE; want de HEERE hoorde het, zodat Zijn toorn ontstak, en het vuur van de HEERE onder hen ontbrandde en verteerde hen die in het uiterste van het leger waren.", "Jes 9:16": "Daarom zal de Heere Zich niet verblijden over hun jongelingen, en over hun wezen en hun weduwen zal Hij Zich niet ontfermen, want zij zijn allen samen huichelaars en boosdoeners, en elke mond spreekt dwaasheid. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.", "1 Sam 28:23-25": "Doch hij weigerde het, en zei: Ik zal niet eten. Maar zijn dienaren, en ook de vrouw, drongen bij hem aan. Toen luisterde hij naar hun stem, en hij stond op van de aarde, en ging op het bed zitten. En de vrouw had een gemest kalf in het huis; en zij haastte zich en slachtte het; en zij nam meel, en kneedde het, en bakte daar ongezuurde koeken van. En zij bracht ze voor Saul en voor zijn dienaren, en zij aten; daarna stonden zij op, en gingen weg diezelfde nacht.", "2 Kon 23:26": "Toch keerde de HEERE Zich niet af van de brand van Zijn grote toorn, waarmee Zijn toorn tegen Juda ontbrand was, om alle tergingen waarmee Manasse Hem getergd had.", "Jer 21:6": "En Ik zal de inwoners van deze stad slaan, zowel de mensen als de dieren; door een grote pest zullen zij sterven.", "Luk 16:23-26": "En toen hij in de hel zijn ogen ophief, terwijl hij in de pijn was, zag hij Abraham van verre, en Lazarus in zijn schoot. En hij riep en zei: Vader Abraham, ontferm u over mij, en zend Lazarus, dat hij het uiterste puntje van zijn vinger in het water dompelt, en mijn tong verkoelt; want ik lijd pijn in deze vlam. Maar Abraham zei: Kind, herinner u dat u uw goed ontvangen hebt in uw leven, en Lazarus evenzo het kwade; en nu wordt hij vertroost, en u lijdt pijn.", "Deut 6:14": "U zult andere goden niet navolgen, van de goden van de volken, die rondom u zijn.", "Ef 5:6": "Laat niemand u verleiden met loze woorden; want om deze dingen komt de toorn van God over de kinderen van de ongehoorzaamheid.", "2 Kon 2:8": "Toen nam Elia zijn mantel, en wond hem samen, en sloeg het water, en het werd naar de ene en de andere kant verdeeld; en zij beiden gingen er door op het droge.", "Num 11:10": "Toen hoorde Mozes het volk wenen door hun huisgezinnen, ieder aan de deur van zijn tent; en de toorn van de HEERE ontstak zeer; ook was dat kwaad in de ogen van Mozes.", "1 Kon 22:20": "En de HEERE zei: Wie zal Achab overreden, zodat hij optrekt en valt bij Ramoth in Gilead? De één zei dit, en de ander zei dat.", "Richt 3:1-4": "Dit nu zijn de heidenvolken die de HEERE liet blijven om door hen Israël op de proef te stellen, allen die niet wisten van al de oorlogen om Kanaän; alleen opdat de generaties van de kinderen van Israël, die er niet van wisten, zouden leren wat oorlog is, in elk geval hun die daarvóór er niets van wisten. Vijf vorsten van de Filistijnen, en al de Kanaänieten, en de Sidoniërs, en de Hevieten, die woonden in het gebergte van de Libanon, van de berg Baäl-Hermon tot waar men bij Hamath komt.", "1 Sam 31:1": "De Filistijnen streden tegen Israël; en de mannen van Israël vluchtten voor de Filistijnen, en vielen verslagen op het gebergte Gilboa.", "Gen 46:2-4": "En God sprak tot Israël in visioenen in de nacht, en zei: Jakob, Jakob! En hij zei: Zie, hier ben ik! En Hij zei: Ik ben die God, de God van uw vader; wees niet bang om af te trekken naar Egypte; want Ik zal u daar tot een groot volk maken. Ik zal met u aftrekken naar Egypte, en Ik zal u ook weer laten optrekken; en Jozef zal zijn hand op uw ogen leggen.", "Matt 25:41": "Dan zal Hij ook zeggen tegen hen die aan de linkerhand zijn: Ga weg van Mij, u vervloekten, in het eeuwige vuur, dat voor de duivel en zijn engelen bereid is.", "2 Kon 13:3": "Daarom ontstak de toorn van de HEERE tegen Israël; en Hij gaf hen in de hand van Hazaël, de koning van Syrië, en in de hand van Benhadad, de zoon van Hazaël, al die dagen.", "Matt 22:7": "Toen de koning dat hoorde, werd hij toornig, en hij stuurde zijn legers en heeft die moordenaars omgebracht en hun stad in brand gestoken.", "Jes 5:25": "Daarom is de toorn van de HEERE ontstoken tegen Zijn volk, en heeft Hij Zijn hand tegen hen uitgestrekt, en heeft Hij hen geslagen, zodat de bergen hebben gebeefd, en hun dode lichamen zijn geworden als vuil in het midden van de straten. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.", "Joz 17:11": "Want Manasse had, in Issaschar en in Aser, Beth-Sean en haar onderhorige plaatsen, en Jibleam en haar onderhorige plaatsen, en de inwoners van Dor en haar onderhorige plaatsen, en de inwoners van En-Dor en haar onderhorige plaatsen, en de inwoners van Thaänach en haar onderhorige plaatsen, en de inwoners van Megiddo en haar onderhorige plaatsen: drie landstreken.", "1 Sam 14:39": "Want zo waarachtig als de HEERE leeft, Die Israël verlost: al was het bij mijn zoon Jonathan, dan zal hij zeker sterven; en niemand uit heel het volk antwoordde hem.", "Ezech 5:13": "Zo zal Mijn toorn volbracht worden, en Ik zal Mijn grimmigheid op hen laten rusten, en Mij troosten; en zij zullen weten dat Ik, de HEERE, in Mijn ijver gesproken heb, als Ik Mijn grimmigheid tegen hen volbracht zal hebben.", "1 Sam 19:9-11": "Doch de boze geest van de HEERE kwam over Saul, terwijl hij in zijn huis zat, met zijn speer in zijn hand; en David speelde op de snaren met zijn hand. Saul nu probeerde David met de speer aan de wand te spietsen, doch hij ontweek Saul, die met de speer in de wand sloeg. Toen vluchtte David, en ontkwam diezelfde nacht. Maar Saul zond boden naar Davids huis, om hem te bewaken, en om hem 's morgens te doden. Dit maakte Michal, zijn vrouw, aan David bekend, en zei: Als u vannacht uw leven niet redt, zult u morgen gedood worden.", "Jer 28:17": "Zo stierf de profeet Hananja in datzelfde jaar, in de zevende maand.", "Ps 103:8": "Barmhartig en genadig is de HEERE, geduldig en groot van goedertierenheid.", "1 Sam 19:6": "Saul dan luisterde naar de stem van Jonathan; en Saul zwoer: zo waarachtig als de HEERE leeft, hij zal niet gedood worden!", "Luk 15:23": "en breng het gemeste kalf, en slacht het; en laten wij eten en vrolijk zijn.", "Ex 22:24": "en Mijn toorn zal ontbranden, en Ik zal u met het zwaard doden; en uw vrouwen zullen weduwen worden, en uw kinderen wezen.", "Gen 28:12-15": "En hij droomde, en zie, een ladder stond op de aarde opgesteld, waarvan de top tot de hemel reikte; en zie, de engelen van God klommen daarlangs op en neer. En zie, de HEERE stond boven op de ladder en zei: Ik ben de HEERE, de God van uw vader Abraham, en de God van Izak; dit land, waarop u ligt te slapen, zal Ik aan u geven, en aan uw nageslacht. En uw nageslacht zal zijn als het stof van de aarde, en u zult uitbreiden in menigte, westwaarts en oostwaarts, en noordwaarts en zuidwaarts; en in u, en in uw nageslacht zullen alle geslachten van de aardbodem gezegend worden.", "2 Kon 6:15-17": "En de dienaar van de man van God stond zeer vroeg op, en ging naar buiten; en zie, een leger omringde de stad met paarden en wagens. Toen zei zijn knecht tegen hem: Ach, mijn heer, hoe zullen wij het doen? En hij zei: Vrees niet; want die bij ons zijn, zijn meer dan die bij hen zijn. En Elisa bad, en zei: HEERE, open toch zijn ogen, dat hij ziet! En de HEERE opende de ogen van de knecht, dat hij zag; en zie, de berg was vol vurige paarden en wagens rondom Elisa.", "Num 25:4": "En de HEERE zei tot Mozes: Neem alle hoofden van het volk, en hang hen op voor de HEERE tegen de zon, zo zal de gloed van de toorn van de HEERE gekeerd worden van Israël.", "Joh 10:34": "Jezus antwoordde hun: Staat er niet geschreven in uw wet: Ik heb gezegd, u bent goden?", "1 Kon 22:30": "En de koning van Israël zei tegen Josafat: Ik zal mij vermommen en dan in de strijd komen; maar u, trek uw kleren aan. Zo vermomde de koning van Israël zich, en kwam in de strijd.", "Joz 23:16": "Wanneer u het verbond van de HEERE, uw God, overtreedt, dat Hij u geboden heeft, en u heengaat en dient andere goden, en u voor hen neerbuigt, zo zal de toorn van de HEERE over u ontsteken, en u zult haastig omkomen van het goede land, dat Hij u gegeven heeft.", "Richt 2:12": "En zij verlieten de HEERE, de God van hun vaderen, Die hen uit Egypteland had uitgeleid, en volgden andere goden na, van de goden van de volken die rondom hen waren, en bogen zich voor die neer, en zij verwekten de HEERE tot toorn.", "Hand 16:16-19": "En het gebeurde, toen wij naar het gebed gingen, dat een zekere dienstmeisje, dat een waarzeggende geest had, ons tegemoet kwam; zij bracht haar heren veel van het gewin met waarzeggen. Zij volgde Paulus en ons achterna en riep: Deze mensen zijn dienstknechten van God, de Allerhoogste, die ons de weg van de zaligheid verkondigen. En dit deed zij vele dagen lang. Maar Paulus, die daarover geërgerd was, keerde zich om en zei tegen de geest: Ik gebied u in de Naam van Jezus Christus dat u van haar uitgaat. En hij ging uit op datzelfde moment.", "Openb 19:1-6": "En hierna hoorde ik als een grote stem van een grote menigte in de hemel, die zei: Halleluja, de zaligheid, en de heerlijkheid, en de eer, en de kracht zij de Heere, onze God. Want Zijn oordelen zijn waarachtig en rechtvaardig; omdat Hij de grote hoer geoordeeld heeft, die de aarde verdorven heeft met haar hoererij, en Hij het bloed van Zijn dienaren van haar hand gewroken heeft. En zij zeiden ten tweeden maal: Halleluja! En haar rook gaat op in alle eeuwigheid.", "Richt 16:20": "En zij zei: De Filistijnen over u, Simson! En hij werd wakker uit zijn slaap, en zei: Ik zal ditmaal uitgaan, zoals de andere keren, en mij uitschudden; want hij wist niet, dat de HEERE van hem geweken was.", "1 Kron 10:14": "en de HEERE niet gezocht had; daarom doodde Hij hem, en keerde het koninkrijk tot David, de zoon van Isaï.", "Klaagl 3:26": "Teth. Het is goed dat men hoopt, en stil is op het heil van de HEERE.", "Job 15:20-24": "Al zijn dagen doet de goddeloze zichzelf weedom aan; en weinige jaren in getal zijn voor de tiran weggelegd. Het geluid van verschrikkingen is in zijn oren; in de vrede zelf komt de verwoester hem over. Hij gelooft niet uit de duisternis terug te keren, maar dat hij beloerd wordt voor het zwaard.", "Nahum 1:6": "Wie zal voor Zijn gramschap staan, en wie zal bestaan voor de gloed van Zijn toorn? Zijn grimmigheid is uitgestort als vuur, en de rotsen worden door Hem verbrijzeld.", "Openb 15:7": "En een van de vier dieren gaf de zeven engelen zeven gouden schalen, vol van de toorn van God, Die leeft in alle eeuwigheid.", "Ezech 5:15": "Zo zal de smaad en hoon een lering en ontzetting zijn voor de heidenvolken die rondom u zijn, wanneer Ik over u gerichten in toorn, en in grimmigheid, en in grimmige straffen oefenen zal; Ik, de HEERE, heb het gesproken!", "Jes 48:9": "Om Mijn Naams wil zal Ik Mijn toorn langer uitstellen, en om het roem van Mij wil zal Ik, u ten goede, Mij bedwingen, opdat Ik u niet afhouw.", "Richt 12:3": "Toen ik nu zag dat u mij niet verloste, zette ik mijn leven op het spel en trok tegen de kinderen van Ammon, en de HEERE gaf hen in mijn hand; waarom bent u dan vandaag naar mij toegekomen om tegen mij te strijden?", "Num 32:10": "Toen ontstak de toorn van de HEERE op die dag, en Hij zwoer en zei:", "2 Sam 13:8": "En Thamar ging naar het huis van haar broer Amnon (hij lag namelijk neer), en zij nam deeg, en kneedde het, en maakte er voor zijn ogen koekjes van, en bakte de koekjes.", "Ps 82:6": "Ik heb wel gezegd: U bent goden; en u bent allen kinderen van de Allerhoogste;", "1 Kron 10:1-8": "En de Filistijnen streden tegen Israël, en de mannen van Israël vluchtten voor de Filistijnen, en zij vielen verslagen op het gebergte Gilboa. En de Filistijnen bleven Saul en zijn zonen op de hielen zitten; en de Filistijnen sloegen Jonathan, en Abinadab, en Malchi-sua, de zonen van Saul. En de strijd werd zwaar tegen Saul, en de schutters met de bogen troffen hem; en hij vreesde zeer voor de schutters.", "Num 16:21": "Scheid u af uit het midden van deze vergadering, en Ik zal hen in een ogenblik verteren!", "1 Kon 22:28": "En Micha zei: Als u ooit in vrede terugkomt, dan heeft de HEERE niet door mij gesproken! Verder zei hij: Hoor, alle volken!", "Luk 15:27": "En deze zei tegen hem: Uw broer is gekomen, en uw vader heeft het gemeste kalf geslacht, omdat hij hem gezond en wel heeft teruggekregen.", "1 Sam 29:2": "En de vorsten van de Filistijnen trokken daarheen met honderden en met duizenden; maar David met zijn mannen trokken met Achis in de achterhoede.", "2 Kon 17:18": "Daarom werd de HEERE zeer toornig op Israël, zodat Hij hen wegdeed van Zijn aangezicht; er bleef niets over, behalve de stam van Juda alleen.", "Openb 18:24": "En in haar is het bloed gevonden van de profeten en van de heiligen, en van allen die gedood zijn op de aarde.", "Jer 44:6": "Daarom is Mijn grimmigheid en Mijn toorn uitgestort, en heeft gebrand in de steden van Juda en in de straten van Jeruzalem; zodat ze tot eenzaamheid en tot verwoesting geworden zijn, zoals het is op deze dag.", "Openb 19:15": "En uit Zijn mond ging een scherp zwaard, opdat Hij daarmee de heidenen slaan zou. En Hij zal hen hoeden met een ijzeren staf; en Hij treedt de wijnpersbak van de wijn van de toorn en van de gramschap van de Almachtige God.", "Hebr 3:11": "Zo heb Ik dan gezworen in Mijn toorn: Zij zullen Mijn rust niet binnengaan!", "Jer 25:38": "Hij heeft, als een jonge leeuw, Zijn hut verlaten; want hun land is geworden tot een verwoesting, vanwege de gloed van de verdrukker, ja, vanwege de gloed van Zijn toorn.", "1 Kon 14:2-4": "En Jerobeam zei tegen zijn vrouw: Sta nu op, en verkleed u, zodat men niet merkt dat u Jerobeams vrouw bent, en ga naar Silo. Zie, daar is de profeet Ahia, die tegen mij gezegd heeft dat ik koning zou zijn over dit volk. En neem in uw hand tien broden, en koeken, en een kruik honing, en ga naar hem toe; hij zal u vertellen wat er met deze jongen gebeuren zal. En Jerobeams vrouw deed zo, en stond op, en ging naar Silo, en kwam in het huis van Ahia. Ahia nu kon niet zien, want zijn ogen waren star geworden vanwege zijn ouderdom.", "1 Sam 29:3": "Toen zeiden de leiders van de Filistijnen: Wat moeten deze Hebreeën hier? Zo zei Achis tegen de leiders van de Filistijnen: Is dit niet David, de knecht van Saul, de koning van Israël, die deze dagen of deze jaren bij mij geweest is? En ik heb in hem niets gevonden vanaf de dag dat hij bij mij gekomen is, tot op deze dag.", "Ps 76:8": "U, vreselijk bent U; en wie zal voor Uw aangezicht bestaan, vanaf het moment van uw toorn?", "Klaagl 2:6": "Vau. En Hij heeft Zijn hut met geweld afgerukt, als een hof, Hij heeft Zijn vergaderplaats verdorven; de HEERE heeft in Sion doen vergeten het hoogtijd en de sabbat, en Hij heeft in de gramschap van Zijn toorn de koning en de priester smadelijk verworpen.", "Gen 18:8": "En hij nam boter en melk, en het kalf dat hij klaargemaakt had, en zette het hun voor, en stond zelf bij hen onder de boom, en zij aten.", "Num 11:33": "Dat vlees was nog tussen hun tanden, voordat het gekauwd was, toen ontstak de toorn van de HEERE tegen het volk, en de HEERE sloeg het volk met een zeer grote plaag.", "1 Sam 31:1-6": "De Filistijnen streden tegen Israël; en de mannen van Israël vluchtten voor de Filistijnen, en vielen verslagen op het gebergte Gilboa. En de Filistijnen zaten Saul en zijn zonen dicht op de hielen; en de Filistijnen versloegen Jonathan, en Abinadab, en Malchisua, de zonen van Saul. En de strijd werd zwaar tegen Saul; en de mannen die met de boog schieten, troffen hem, en hij werd zeer bang voor de schutters.", "Hand 5:5": "En Ananias, deze woorden horend, viel neer en gaf de geest. En er kwam grote vrees over allen die dit hoorden.", "Ps 68:2-4": "God zal opstaan, Zijn vijanden zullen verstrooid worden, en Zij die Hem haten zullen van Zijn aangezicht vluchten. U zult hen verdrijven, zoals rook verdreven wordt; zoals was voor het vuur smelt, zullen de goddelozen vergaan van Gods aangezicht. Maar de rechtvaardigen zullen zich verblijden; zij zullen van vreugde opspringen voor Gods aangezicht, en van blijdschap vrolijk zijn.", "1 Sam 29:1": "De Filistijnen hadden al hun legers verzameld te Afek; en de Israëlieten legerden zich bij de bron die bij Jizreël is.", "2 Sam 6:7": "Toen ontstak de toorn van de HEERE tegen Uza, en God sloeg hem daar, om deze onbedachtzaamheid; en hij stierf daar bij de ark van God.", "Deut 33:8": "En van Levi zei hij: Uw Tummim en Uw Urim zijn bij de man, Uw gunstgenoot, die Gij beproefd hebt in Massa, met wie Gij getwist hebt aan de wateren van Meriba.", "1 Sam 19:5": "Want hij heeft zijn leven gewaagd, en hij heeft de Filistijn geslagen, en de HEERE heeft een grote overwinning aan heel Israël gegeven; u hebt het gezien, en u bent verblijd geweest; waarom zou u dan tegen onschuldig bloed zondigen, David zonder reden doden?", "Jer 36:7": "Misschien zal hun smeking voor het aangezicht van de HEERE neervallen, en zullen zij zich bekeren, ieder van zijn boze weg; want groot is de toorn en de grimmigheid die de HEERE tegen dit volk heeft uitgesproken.", "Openb 14:11": "En de rook van hun pijniging gaat op tot in alle eeuwigheid, en zij hebben geen rust, dag en nacht, zij die het beest aanbidden en zijn beeld, en zo iemand het merkteken van zijn naam ontvangt.", "Kol 3:6": "Om deze dingen komt de toorn van God over de kinderen van de ongehoorzaamheid.", "Job 13:14": "Waarom zou ik mijn vlees in mijn tanden nemen, en mijn ziel in mijn hand stellen?", "Ps 85:4": "U hebt al Uw verbolgenheid weggenomen; U hebt U afgewend van de gloed van Uw toorn.", "2 Kor 5:14": "Want de liefde van Christus dringt ons;", "2 Kon 5:7": "En het gebeurde, toen de koning van Israël de brief gelezen had, dat hij zijn kleren scheurde, en zei: Ben ik dan God, om te doden en levend te maken, dat deze man naar mij toe stuurt, om een man van zijn melaatsheid te verlossen? Want inderdaad, let toch op en zie, dat hij een aanleiding tegen mij zoekt.", "2 Sam 21:12": "Toen ging David heen, en nam de beenderen van Saul, en de beenderen van Jonathan, zijn zoon, van de burgers van Jabes in Gilead, die ze gestolen hadden van de straat van Beth-San, waar de Filistijnen ze hadden opgehangen, op de dag dat de Filistijnen Saul sloegen op Gilboa.", "Spr 10:24": "Wat de goddeloze vreest, dat zal hem overkomen; maar wat de rechtvaardigen verlangen, zal God geven.", "Job 24:13-15": "Zij horen bij hen die zich verzetten tegen het licht; zij kennen Zijn wegen niet, en zij blijven niet op Zijn paden. Met het licht staat de moordenaar op, doodt de arme en de behoeftige; en 's nachts is hij als een dief. Ook houdt het oog van de overspeler de schemering in de gaten, en zegt: Geen oog zal mij zien; en hij bedekt zijn gezicht.", "Openb 6:17": "Want de grote dag van Zijn toorn is gekomen, en wie kan bestaan?", "Ex 8:3": "Zodat de rivier van kikkers zal krioelen; die zullen opkomen en in uw huis komen, en in uw slaapkamer, ja, op uw bed; ook in de huizen van uw knechten, en op uw volk, en in uw bakovens, en in uw baktroggen.", "Jer 32:37": "Zie, Ik zal hen verzamelen uit al de landen waarheen Ik hen verdreven zal hebben in Mijn toorn, en in Mijn grimmigheid, en in grote verbolgenheid; en Ik zal hen naar deze plaats terugbrengen, en zal hen zeker doen wonen.", "2 Sam 22:8": "Toen daverde en beefde de aarde; de fundamenten van de hemel beroerden zich, en daverden, omdat Hij in toorn ontstoken was.", "Lev 20:6": "Wanneer er iemand is, die zich tot de waarzeggers en tot de duivelskunstenaars keert, om hen achterna te hoereren, zal Ik Mijn aangezicht tegen die ziel richten, en zal hem uit het midden van zijn volk uitroeien.", "Ezech 25:14-17": "En Ik zal Mijn wraak brengen over Edom, door de hand van Mijn volk Israël; en zij zullen tegen Edom handelen naar Mijn toorn en naar Mijn grimmigheid; zo zullen zij Mijn wraak leren kennen, spreekt de Heere HEERE. Zo zegt de Heere HEERE: Omdat de Filistijnen uit wraak gehandeld hebben, en van harte wraak geoefend hebben door plundering, om te vernielen vanuit een eeuwige vijandschap; Daarom, zo zegt de Heere HEERE: Zie, Ik strek Mijn hand uit tegen de Filistijnen, en Ik zal de Cherethieten uitroeien, en het overblijfsel van de zeehaven doen verdwijnen.", "Ps 110:5": "De Heere is aan Uw rechterhand; Hij zal koningen verslaan op de dag van Zijn toorn.", "1 Kon 14:2": "En Jerobeam zei tegen zijn vrouw: Sta nu op, en verkleed u, zodat men niet merkt dat u Jerobeams vrouw bent, en ga naar Silo. Zie, daar is de profeet Ahia, die tegen mij gezegd heeft dat ik koning zou zijn over dit volk.", "Jer 2:17": "Doet u dit niet zelf, doordat u de HEERE, uw God, verlaat, ten tijde als Hij u op de weg leidt?", "Deut 23:9": "Wanneer het leger tegen uw vijanden uittrekt, dan zult u zich wachten voor elke kwade zaak.", "Hand 16:16": "En het gebeurde, toen wij naar het gebed gingen, dat een zekere dienstmeisje, dat een waarzeggende geest had, ons tegemoet kwam; zij bracht haar heren veel van het gewin met waarzeggen.", "Luk 7:36-38": "En een van de Farizeeën vroeg Hem of Hij met hem wilde eten; en Hij ging het huis van de Farizeeër binnen, en ging aanliggen. En zie, een vrouw in de stad, die een zondares was, kwam er, toen zij te weten kwam dat Hij in het huis van de Farizeeër aan tafel aanlag, met een albasten fles met zalf, en ging huilend achter Zijn voeten staan, en begon Zijn voeten nat te maken met tranen, en droogde ze af met het haar van haar hoofd, en kuste Zijn voeten, en zalfde ze met de zalf.", "Hebr 4:3": "Want wij die geloofd hebben, gaan de rust in, zoals Hij gezegd heeft: Zo heb Ik dan in Mijn toorn gezworen: Zij zullen Mijn rust niet ingaan! Hoewel Zijn werken al vanaf de grondlegging van de wereld volbracht waren.", "Luk 14:23": "En de heer zei tegen de dienstknecht: Ga de wegen en heggen langs, en dwing hen binnen te komen, zodat mijn huis vol wordt.", "1 Sam 15:9": "Doch Saul en het hele volk verschoonden Agag, en de beste schapen, en runderen, en het naastbeste, en de lammeren, en alles wat goed was, en zij wilden dat niet verbannen; maar alles wat minderwaardig was en waardeloos, dat verbanden zij.", "Num 16:45": "Maak u op uit het midden van deze vergadering, en Ik zal hen verteren, in een ogenblik! Toen vielen zij op hun aangezichten.", "Deut 18:11": "of een bezweerder, die met bezwering omgaat, of die een waarzeggende geest raadpleegt, of een duivelskunstenaar, of die de doden raadpleegt.", "1 Sam 13:9": "Toen zei Saul: Breng mij hier een brandoffer en dankoffers; en hij offerde het brandoffer.", "2 Sam 22:9": "Rook ging op van Zijn neus, en een vuur uit Zijn mond verteerde; kolen werden daardoor aangestoken.", "Spr 16:4": "De HEERE heeft alles gemaakt om Zichzelf; ja, ook de goddeloze tot de dag van het kwaad.", "Jes 57:17": "Ik was toornig over de ongerechtigheid van zijn hebzucht, en sloeg hem; Ik verborg Mij, en was toornig; toch ging hij afkerig zijn eigen weg, de weg van zijn hart.", "Num 12:6": "En Hij zei: Hoor nu Mijn woorden! Als er een profeet onder u is, zal Ik, de HEERE, Mij door een gezicht aan hem bekendmaken, door een droom zal Ik met hem spreken.", "1 Sam 16:13": "Toen nam Samuël de oliehoorn, en zalfde hem te midden van zijn broers. En de Geest van de HEERE kwam vanaf die dag over David, en bleef. Daarna stond Samuël op, en ging naar Rama.", "Job 15:21": "Het geluid van verschrikkingen is in zijn oren; in de vrede zelf komt de verwoester hem over.", "Jes 66:15": "Want zie, de HEERE zal met vuur komen, en Zijn wagens als een wervelwind; om met grimmigheid Zijn toorn hiertoe te wenden, en Zijn bestraffing met vuurvlammen.", "1 Kon 14:5": "Maar de HEERE zei tegen Ahia: Zie, Jerobeams vrouw komt om u iets te vragen over haar zoon, want hij is ziek. Zo en zo zult u tot haar spreken, en het zal gebeuren, als zij binnenkomt, dat zij zich als een andere vrouw zal voordoen.", "Deut 6:15": "Want de HEERE, uw God, is een na-ijverig God in uw midden; dat de toorn van de HEERE, uw God, tegen u niet ontsteekt, en Hij u van de aardbodem verdelgt.", "Ex 32:10": "En nu, laat Mij begaan, dat Mijn toorn tegen hen ontsteekt en hen verteert; dan zal Ik u tot een groot volk maken.", "Deut 32:22": "Want een vuur is aangestoken in Mijn toorn, en zal branden tot in de onderste hel, en zal het land met zijn opbrengst verteren, en de gronden van de bergen in vlam zetten.", "1 Sam 28:7-14": "Toen zei Saul tegen zijn dienaren: Zoek voor mij een vrouw die een waarzeggende geest heeft, zodat ik naar haar toe ga en door haar onderzoek doe. Zijn dienaren nu zeiden tegen hem: Zie, in Endor is een vrouw die een waarzeggende geest heeft. En Saul vermomde zich, en trok andere kleren aan, en ging op weg, met twee mannen bij hem, en zij kwamen 's nachts bij de vrouw, en hij zei: Voorspel mij toch door de waarzeggende geest, en laat opkomen wie ik u zeggen zal. Toen zei de vrouw tegen hem: Zie, u weet wat Saul gedaan heeft, hoe hij de waarzeggers en de geestenbezweerders uit dit land heeft uitgeroeid; waarom legt u mij dan een valstrik, om mij te doden?", "Jes 30:27": "Ziet, de Naam van de HEERE komt van verre, Zijn toorn brandt, en de last is zwaar; Zijn lippen zijn vol gramschap, en Zijn tong als een verterend vuur;", "Ex 22:18": "De tovenares mag u niet in leven laten.", "Num 25:3": "Toen Israël zich koppelde aan Baäl-peor, ontstak de toorn van de HEERE tegen Israël.", "Job 33:14-16": "Maar God spreekt eens of tweemaal; doch men let daar niet op. In de droom, door het gezicht 's nachts, als een diepe slaap op de mensen valt, in de sluimering op het leger; Dan openbaart Hij het voor het oor der mensen, en Hij verzegelt hun kastijding;", "1 Sam 13:14": "Maar nu zal uw koningschap niet blijven bestaan. De HEERE heeft Zich een man gezocht naar Zijn hart, en de HEERE heeft hem bevolen een voorganger te zijn over Zijn volk, omdat u niet gehouden hebt wat de HEERE u geboden had.", "Gen 3:5": "Maar God weet dat, op de dag dat u daarvan eet, uw ogen geopend zullen worden, en u als God zult zijn, kennend het goed en het kwaad.", "Nahum 1:3": "De HEERE is geduldig, maar van grote kracht, en Hij houdt de schuldige zeker niet onschuldig. De weg van de HEERE is in wervelwind en in storm, en de wolken zijn het stof van Zijn voeten.", "Lev 19:31": "U zult zich niet keren tot de waarzeggers, en tot de duivelskunstenaars; zoek hen niet, en verontreinig u niet met hen; Ik ben de HEERE, uw God!", "2 Sam 1:21": "U, bergen van Gilboa, geen dauw en geen regen mag op u zijn, en geen velden met hefoffers; want daar is het schild van de helden smadelijk weggeworpen, het schild van Saul, alsof hij niet met olie gezalfd was geweest.", "Klaagl 2:5": "He. De Heere is geworden als een vijand; Hij heeft Israël verslonden, Hij heeft al haar paleizen verslonden. Hij heeft haar vestingen verdorven; en Hij heeft bij de dochter van Juda het klagen en kermen vermenigvuldigd.", "Deut 18:10-12": "Onder u mag niemand gevonden worden die zijn zoon of zijn dochter door het vuur laat gaan, die met waarzeggerij omgaat, een guichelaar, of die op vogelgeschrei let, of een tovenaar, of een bezweerder, die met bezwering omgaat, of die een waarzeggende geest raadpleegt, of een duivelskunstenaar, of die de doden raadpleegt. Want ieder die zulke dingen doet, is de HEERE een gruwel; en om deze gruwelen verdrijft de HEERE, uw God, hen voor uw aangezicht uit hun bezit.", "1 Kon 2:39": "Maar het gebeurde na drie jaar, dat twee knechten van Simeï wegliepen naar Achis, de zoon van Maächa, de koning van Gath; en men liet het Simeï weten en zei: Zie, uw knechten zijn in Gath.", "1 Sam 15:26-29": "Doch Samuël zei tegen Saul: Ik zal niet met u terugkeren; omdat u het woord van de HEERE verworpen hebt, zo heeft de HEERE u verworpen, dat u geen koning over Israël meer zult zijn. Toen Samuël zich omkeerde om weg te gaan, greep hij een slip van zijn mantel, en die scheurde. Toen zei Samuël tegen hem: De HEERE heeft heden het koninkrijk van Israël van u afgescheurd, en heeft het aan uw naaste gegeven, die beter is dan u.", "1 Sam 15:27-29": "Toen Samuël zich omkeerde om weg te gaan, greep hij een slip van zijn mantel, en die scheurde. Toen zei Samuël tegen hem: De HEERE heeft heden het koninkrijk van Israël van u afgescheurd, en heeft het aan uw naaste gegeven, die beter is dan u. En ook liegt Hij niet, Die de Overwinning van Israël is, en het berouwt Hem niet; want Hij is geen mens, dat Hem iets berouwen zou.", "Jes 57:2": "Hij zal ingaan in de vrede; zij zullen rusten op hun slaapsteden, ieder die in zijn oprechtheid gewandeld heeft.", "Klaagl 2:3": "Gimel. Hij heeft, in ontsteking van de toorn, de gehele hoorn van Israël afgehouwen; Hij heeft Zijn rechterhand achterwaarts getrokken, toen de vijand kwam, en Hij is tegen Jakob ontstoken als een vlammend vuur, dat rondom verteert.", "Spr 1:28": "Dan zullen zij tot Mij roepen, maar Ik zal niet antwoorden; zij zullen Mij vroeg zoeken, maar zullen Mij niet vinden;", "1 Sam 22:7-19": "Toen zei Saul tegen zijn knechten die bij hem stonden: Hoor toch, u, zonen van Jemini, zal ook de zoon van Isaï u allemaal akkers en wijngaarden geven? Zal hij u allemaal tot aanvoerders van duizenden en aanvoerders van honderden stellen? Dat u zich allemaal tegen mij verbonden hebt, en niemand het mij laat horen dat mijn zoon een verbond gemaakt heeft met de zoon van Isaï; en niemand onder u heeft er verdriet van vanwege mij, en laat het mij horen; want mijn zoon heeft mijn knecht tegen mij opgehitst, om een hinderlaag te leggen, zoals het op deze dag is. Toen antwoordde Doeg, de Edomiet, die bij de knechten van Saul stond, en zei: Ik zag de zoon van Isaï komen te Nob, naar Achimelech, de zoon van Ahitub;", "Hos 14:5": "Ik zal hun afkering genezen, Ik zal hen vrijwillig liefhebben; want Mijn toorn is van hem gekeerd.", "Jes 19:3": "En de geest van de Egyptenaren zal uitgeledigd worden in hun binnenste, en hun raad zal Ik verslinden; dan zullen zij hun afgoden vragen, en de bezweerders, en de waarzeggers, en de duivelskunstenaars.", "Mark 6:23": "En hij zwoer haar: Wat u mij ook zult vragen, ik zal het u geven, zelfs tot de helft van mijn koninkrijk!", "1 Sam 23:2": "En David vroeg de HEERE: Zal ik heengaan en deze Filistijnen verslaan? En de HEERE zei tegen David: Ga heen, en u zult de Filistijnen verslaan en Kehila verlossen.", "Ps 51:13": "Verwerp mij niet van Uw aangezicht, en neem Uw Heilige Geest niet van mij.", "Ps 48:7": "Beving greep hen daar aan, smart als van een barende vrouw.", "Jer 23:24": "Zou iemand zich in verborgen plaatsen kunnen verbergen, zodat Ik hem niet zou zien? spreekt de HEERE; vervul Ik niet de hemel en de aarde? spreekt de HEERE.", "Jer 7:18": "De kinderen rapen hout, en de vaders steken het vuur aan, en de vrouwen kneden het deeg, om koeken te maken voor de koningin van de hemel, en drankoffers te offeren aan andere goden, om Mij verdriet aan te doen.", "Deut 9:13": "Verder sprak de HEERE tot mij en zei: Ik heb dit volk aangemerkt, en zie, het is een hardnekkig volk.", "Ezech 20:3": "Mensenkind, spreek tot de oudsten van Israël, en zeg tegen hen: Zo zegt de Heere HEERE: Komt u om Mij te vragen? Zo waarachtig als Ik leef, zo Ik door u gevraagd word, spreekt de Heere HEERE!", "Nahum 1:2": "Een ijverig God en een wreker is de HEERE, een wreker is de HEERE, en zeer grimmig; een wreker is de HEERE aan Zijn tegenstanders, en Hij bewaart de toorn voor Zijn vijanden.", "Deut 9:14": "Laat Mij begaan, dat Ik hen verdelg, en hun naam van onder de hemel uitwis; en Ik zal u tot een machtiger en groter volk maken dan dit is."}, "noten": {"1": "Urim en Tummim: middel om Gods wil te vragen."}, "koppeling": {"1": "Het gebeurde <span class=\"wl\" data-l=\"L2\" data-code=\"H1992\">in</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H1992\">die</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H3117\">dagen</span>, toen <span class=\"wl\" data-l=\"L4\" data-code=\"H6430\">de</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H6430\">Filistijnen</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H6430\">hun</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H4264\">legers</span> verzamelden om <span class=\"wl\" data-l=\"L6\" data-code=\"H6635\">te</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H6635\">strijden</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H3478\">tegen</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H3478\">Israël</span>, dat <span class=\"wl\" data-l=\"L9\" data-code=\"H397\">Achis</span> tegen <span class=\"wl\" data-l=\"L10\" data-code=\"H1732\">David</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H559\">zei</span>: <span class=\"wl\" data-l=\"L13\" data-code=\"H854\">U</span> moet goed <span class=\"wl\" data-l=\"L11\" data-code=\"H3045\">weten</span> <span class=\"wl\" data-l=\"L12\" data-code=\"H3588\">dat</span> <span class=\"wl\" data-l=\"L15\" data-code=\"H859\">u</span> <span class=\"wl\" data-l=\"L14\" data-code=\"H4264\">met</span> <span class=\"wl\" data-l=\"L14\" data-code=\"H4264\">mij</span> mee <span class=\"wl\" data-l=\"L11\" data-code=\"H3045\">zult</span> trekken in <span class=\"wl\" data-l=\"L14\" data-code=\"H4264\">het</span> <span class=\"wl\" data-l=\"L14\" data-code=\"
