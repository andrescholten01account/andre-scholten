chters waren gevangen weggevoerd.","4":"Toen verhieven David en het volk dat bij hem was hun stem, en huilden, tot er geen kracht *meer* in hen was om te huilen.","5":"Davids beide vrouwen waren ook gevangen weggevoerd, Ahinoam, de Jizreëlitische, en Abigaïl, de vrouw van Nabal, de Karmeliet.","6":"En David werd erg bang, want het volk sprak ervan hem te stenigen; want de zielen van heel het volk waren verbitterd, ieder over zijn zonen en over zijn dochters; maar David sterkte zich in de HEERE, zijn God.","7":"En David zei tegen de priester Abjathar, de zoon van Achimelech: Breng mij toch de efod[1] hier. En Abjathar bracht de efod naar David.","8":"Toen vroeg David de HEERE: Zal ik deze bende achternajagen? Zal ik ze inhalen? En Hij zei tegen hem: Jaag na, want u zult zeker inhalen, en u zult zeker verlossen.","9":"David dan ging op weg, hij en de zeshonderd mannen die bij hem waren; en toen zij bij de beek Besor kwamen, bleven de overigen staan.","10":"En David vervolgde hen, hij en die vierhonderd mannen; en tweehonderd mannen bleven staan, die zo moe waren dat zij niet over de beek Besor konden gaan.","11":"En zij vonden een Egyptische man op het veld, en zij brachten hem naar David; en zij gaven hem brood, en hij at, en zij gaven hem water te drinken.","12":"Zij gaven hem ook een stuk van een klomp vijgen, en twee stukken rozijnen; en hij at, en zijn geest kwam weer in hem terug; want hij had drie dagen en drie nachten geen brood gegeten, en geen water gedronken.","13":"Daarna zei David tegen hem: Van wie bent u? En waar komt u vandaan? Toen zei de Egyptische jongen: Ik ben de knecht van een Amalekitische man, en mijn heer heeft mij verlaten, omdat ik drie dagen geleden ziek geworden ben.","14":"Wij waren binnengevallen in het zuiden van de Cherethieten, en in het gebied dat aan Juda toebehoort, en in het zuiden van Kaleb; en wij hebben Ziklag met vuur verbrand.","15":"Toen zei David tegen hem: Zou u mij naar beneden kunnen leiden naar deze bende? Hij dan zei: Zweer mij bij God, dat u mij niet zult doden, en dat u mij niet zult overleveren in de hand van mijn heer! Dan zal ik u naar deze bende leiden.","16":"En hij leidde hem naar beneden, en zie, zij lagen verspreid over het hele land, etend, en drinkend, en dansend, vanwege al de grote buit die zij genomen hadden uit het land van de Filistijnen, en uit het land van Juda.","17":"En David sloeg hen van de schemering tot aan de avond van de volgende dag; en er ontkwam niet één man van hen, behalve vierhonderd jonge mannen, die op kamelen reden en vluchtten.","18":"Zo redde David alles wat de Amalekieten genomen hadden; ook redde David zijn twee vrouwen.","19":"En onder hen werd niets gemist, van de kleinste tot de grootste, en tot aan de zonen en dochters; en van de buit, ook tot alles wat zij van hen genomen hadden; David bracht het allemaal terug.","20":"David nam ook al de schapen en de runderen; zij dreven ze voor dat vee uit, en zeiden: Dit is Davids buit.","21":"Toen David bij de tweehonderd mannen kwam, die zo moe waren geweest dat zij David niet hadden kunnen volgen, en die zij aan de beek Besor hadden laten blijven, gingen die David tegemoet, en het volk dat bij hem was tegemoet; en David trad naar het volk toe, en vroeg hen naar hun welstand.","22":"Toen antwoordde ieder slecht en verdorven man onder de mannen die met David waren meegegaan, en zij zeiden: Omdat zij niet met ons zijn meegegaan, zullen wij hun van de buit die wij gered hebben, niets geven, maar aan ieder zijn vrouw en zijn kinderen; laat hen die meenemen en weggaan.","23":"Maar David zei: Zo zult u niet doen, mijn broeders, met wat de HEERE ons gegeven heeft, en Hij heeft ons bewaard, en heeft de bende die tegen ons kwam, in onze hand gegeven.","24":"Wie zou u toch in deze zaak horen? Want zoals het deel is van hen die mee de strijd in zijn getrokken, zo zal ook het deel zijn van hen die bij de spullen gebleven zijn; zij zullen gelijk delen.","25":"En dit is vanaf die dag en voortaan zo geweest; want hij heeft het tot een verordening en tot een recht gesteld in Israël, tot op deze dag.","26":"Toen David in Ziklag kwam, zond hij van de buit naar de oudsten van Juda, zijn vrienden, en zei: Zie, hier is een geschenk voor u, van de buit van de vijanden van de HEERE.","27":"*Namelijk* aan hen die in Beth-el waren, en aan hen die in Ramoth in het zuiden waren, en aan hen die in Jather waren,","28":"en aan hen die in Aroër waren, en aan hen die in Sifmoth waren, en aan hen die in Esthemoa waren,","29":"en aan hen die in Rachel waren, en aan hen die in de steden van de Jerahmeelieten waren, en aan hen die in de steden van de Kenieten waren,","30":"en aan hen die in Horma waren, en aan hen die in Chor-asan waren, en aan hen die in Atach waren,","31":"en aan hen die in Hebron waren, en aan al de plaatsen waar David rondgetrokken had, hij en zijn mannen."},"SV":{"1":"Het geschiedde nu, als David en zijn mannen den derden dag te Ziklag kwamen, dat de Amalekieten in het zuiden en te Ziklag ingevallen waren, en Ziklag geslagen, en dezelve met vuur verbrand hadden;","2":"En dat zij de vrouwen, die daarin waren, gevankelijk weggevoerd hadden; *doch* zij hadden niemand doodgeslagen, van den kleinste tot den grootste, maar hadden ze weggevoerd en waren huns weegs gegaan.","3":"En David en zijn mannen kwamen aan de stad, en ziet, zij was met vuur verbrand; en hun vrouwen, en hun zonen en hun dochteren waren gevankelijk weggevoerd.","4":"Toen hief David en het volk, dat bij hem was, hun stem op, en weenden, tot dat er geen kracht *meer* in hen was om te wenen.","5":"Davids beide vrouwen waren ook gevankelijk weggevoerd, Ahinoam, de Jizreëlietische, en Abigaïl, de huisvrouw van Nabal, den Karmeliet.","6":"En David werd zeer bang, want het volk sprak van hem te stenigen; want de zielen van het ganse volk waren verbitterd, een iegelijk over zijn zonen en over zijn dochteren; doch David sterkte zich in den HEERE, zijn God.","7":"En David zeide tot den priester Abjathar, den zoon van Achimelech: Breng mij toch den efod hier. En Abjathar bracht den efod tot David.","8":"Toen vraagde David den HEERE, zeggende: Zal ik deze bende achternajagen? Zal ik ze achterhalen? En Hij zeide tot hem: Jaag na, want gij zult gewisselijk achterhalen, en gij zult gewisselijk verlossen.","9":"David dan ging heen, hij en de zes honderd mannen, die bij hem waren; en als zij kwamen aan de beek Besor, zo bleven de overigen staan.","10":"En David vervolgde hen, hij en die vierhonderd mannen; en tweehonderd mannen bleven staan, die zo moede waren, dat zij over de beek Besor niet konden gaan.","11":"En zij vonden een Egyptischen man op het veld, en zij brachten hem tot David; en zij gaven hem brood, en hij at, en zij gaven hem water te drinken.","12":"Zij gaven hem ook een stuk van een klomp vijgen, en twee stukken rozijnen; en hij at, en zijn geest kwam weder in hem; want hij had *in* drie dagen en drie nachten geen brood gegeten, noch water gedronken.","13":"Daarna zeide David tot hem: Wiens zijt gij? En van waar zijt gij? Toen zeide de Egyptische jongen: Ik ben de knecht van een Amalekietischen man, en mijn heer heeft mij verlaten, omdat ik *voor* drie dagen krank geworden ben.","14":"Wij waren ingevallen tegen het zuiden van de Cherethieten, en op hetgeen van Juda is, en tegen het zuiden van Kaleb; en wij hebben Ziklag met vuur verbrand.","15":"Toen zeide David tot hem: Zoudt gij mij wel henen afleiden tot deze bende? Hij dan zeide: Zweer mij bij God, dat gij mij niet zult doden, en dat gij mij niet zult overleveren in de hand mijns heren! Zo zal ik u tot deze bende afleiden.","16":"En hij leidde hem af, en ziet, zij lagen verstrooid over de ganse aarde, etende, en drinkende, en dansende, om al den groten buit, dien zij genomen hadden uit het land der Filistijnen, en uit het land van Juda.","17":"En David sloeg hen van de schemering tot aan den avond van hunlieder anderen dag; en er ontkwam niet een man van hen, behalve vierhonderd jonge mannen, die op kemelen reden en vloden.","18":"Alzo redde David al wat de Amalekieten genomen hadden; ook redde David zijn twee vrouwen.","19":"En onder hen werd niet gemist van den kleinste tot aan den grootste, en tot aan de zonen en dochteren; en van den buit, ook tot alles, wat zij van hen genomen hadden; David bracht het altemaal weder.","20":"David nam ook al de schapen en de runderen; zij dreven ze voor datzelve vee heen, en zeiden: Dit is Davids buit.","21":"Als David tot de tweehonderd mannen kwam, die zo moede waren geweest, dat zij David niet hadden kunnen navolgen, en die zij aan de beek Besor hadden laten blijven, die gingen David tegemoet, en het volk, dat bij hem was, tegemoet; en David trad tot het volk, en hij vraagde hen naar den welstand.","22":"Toen antwoordde een ieder boos en Belials man onder de mannen, die met David getogen waren, en zij zeiden: Omdat zij met ons niet getogen zijn, zullen wij hun van den buit, dien wij gered hebben, niet geven, maar aan een iegelijk zijn vrouw en zijn kinderen; laat hen die heenleiden, en weggaan.","23":"Maar David zeide: Alzo zult gij niet doen, mijn broeders, met hetgeen ons de HEERE gegeven heeft, en Hij heeft ons bewaard, en heeft de bende, die tegen ons kwam, in onze hand gegeven.","24":"Wie zou toch ulieden in deze zaak horen? Want gelijk het deel dergenen is, die in den strijd mede afgetogen zijn , alzo zal ook het deel dergenen zijn, die bij het gereedschap gebleven zijn; zij zullen gelijkelijk delen.","25":"En dit is van dien dag af en voortaan *alzo* geweest; want hij heeft het tot een inzetting en tot een recht gesteld in Israël, tot op dezen dag.","26":"Als nu David te Ziklag kwam, zo zond hij tot de oudsten van Juda, zijn vrienden, van den buit, zeggende: Ziet, daar is een zegen voor ulieden, van den buit der vijanden des HEEREN.","27":"*Namelijk* tot die te Beth-el, en tot die te Ramoth tegen het zuiden, en tot die te Jather,","28":"En tot die te Aroer, en tot die te Sifmoth, en tot die te Esthemoa,","29":"En tot die te Rachel, en tot die, welke in de steden der Jerahmeelieten waren, en tot die, welke in de steden der Kenieten waren,","30":"En tot die te Horma, en tot die te Chor-asan, en tot die te Atach,","31":"En tot die te Hebron, en tot al de plaatsen, waar David gewandeld had, hij en zijn mannen."},"KJV":{"1":"And it came to pass, when David and his men were come to Ziklag on the third day, that the Amalekites had invaded the south, and Ziklag, and smitten Ziklag, and burned it with fire;","2":"And had taken the women captives, that were therein: they slew not any, either great or small, but carried them away, and went on their way.","3":"So David and his men came to the city, and, behold, it was burned with fire; and their wives, and their sons, and their daughters, were taken captives.","4":"Then David and the people that were with him lifted up their voice and wept, until they had no more power to weep.","5":"And David's two wives were taken captives, Ahinoam the Jezreelitess, and Abigail the wife of Nabal the Carmelite.","6":"And David was greatly distressed; for the people spake of stoning him, because the soul of all the people was grieved, every man for his sons and for his daughters: but David encouraged himself in the LORD his God.","7":"And David said to Abiathar the priest, Ahimelech's son, I pray thee, bring me hither the ephod. And Abiathar brought thither the ephod to David.","8":"And David enquired at the LORD, saying, Shall I pursue after this troop? shall I overtake them? And he answered him, Pursue: for thou shalt surely overtake them, and without fail recover all.","9":"So David went, he and the six hundred men that were with him, and came to the brook Besor, where those that were left behind stayed.","10":"But David pursued, he and four hundred men: for two hundred abode behind, which were so faint that they could not go over the brook Besor.","11":"And they found an Egyptian in the field, and brought him to David, and gave him bread, and he did eat; and they made him drink water;","12":"And they gave him a piece of a cake of figs, and two clusters of raisins: and when he had eaten, his spirit came again to him: for he had eaten no bread, nor drunk any water, three days and three nights.","13":"And David said unto him, To whom belongest thou? and whence art thou? And he said, I am a young man of Egypt, servant to an Amalekite; and my master left me, because three days agone I fell sick.","14":"We made an invasion upon the south of the Cherethites, and upon the coast which belongeth to Judah, and upon the south of Caleb; and we burned Ziklag with fire.","15":"And David said to him, Canst thou bring me down to this company? And he said, Swear unto me by God, that thou wilt neither kill me, nor deliver me into the hands of my master, and I will bring thee down to this company.","16":"And when he had brought him down, behold, they were spread abroad upon all the earth, eating and drinking, and dancing, because of all the great spoil that they had taken out of the land of the Philistines, and out of the land of Judah.","17":"And David smote them from the twilight even unto the evening of the next day: and there escaped not a man of them, save four hundred young men, which rode upon camels, and fled.","18":"And David recovered all that the Amalekites had carried away: and David rescued his two wives.","19":"And there was nothing lacking to them, neither small nor great, neither sons nor daughters, neither spoil, nor any thing that they had taken to them: David recovered all.","20":"And David took all the flocks and the herds, which they drave before those other cattle, and said, This is David's spoil.","21":"And David came to the two hundred men, which were so faint that they could not follow David, whom they had made also to abide at the brook Besor: and they went forth to meet David, and to meet the people that were with him: and when David came near to the people, he saluted them.","22":"Then answered all the wicked men and men of Belial, of those that went with David, and said, Because they went not with us, we will not give them ought of the spoil that we have recovered, save to every man his wife and his children, that they may lead them away, and depart.","23":"Then said David, Ye shall not do so, my brethren, with that which the LORD hath given us, who hath preserved us, and delivered the company that came against us into our hand.","24":"For who will hearken unto you in this matter? but as his part is that goeth down to the battle, so shall his part be that tarrieth by the stuff: they shall part alike.","25":"And it was so from that day forward, that he made it a statute and an ordinance for Israel unto this day.","26":"And when David came to Ziklag, he sent of the spoil unto the elders of Judah, even to his friends, saying, Behold a present for you of the spoil of the enemies of the LORD;","27":"To them which were in Bethel, and to them which were in south Ramoth, and to them which were in Jattir,","28":"And to them which were in Aroer, and to them which were in Siphmoth, and to them which were in Eshtemoa,","29":"And to them which were in Rachal, and to them which were in the cities of the Jerahmeelites, and to them which were in the cities of the Kenites,","30":"And to them which were in Hormah, and to them which were in Chorashan, and to them which were in Athach,","31":"And to them which were in Hebron, and to all the places where David himself and his men were wont to haunt."}},"tsk":{"1":[{"kopje":"kwamen","refs":["1 Sam 29:11","2 Sam 1:2"]},{"kopje":"de Amalekieten","refs":["1 Sam 15:7","1 Sam 27:8-10","Gen 24:62","Joz 11:6"]}],"2":[{"kopje":"niemand doodgeslagen","refs":["1 Sam 30:19","1 Sam 27:11","Job 38:11","Ps 76:11","Jes 27:8","Jes 27:9"]}],"3":[{"kopje":"verbrand","refs":["Ps 34:20","Hebr 12:6","1 Petr 1:6","1 Petr 1:7","Openb 3:9"]}],"4":[{"kopje":"verhieven","refs":["1 Sam 4:13","1 Sam 11:4","Gen 37:33-35","Num 14:1","Num 14:39","Richt 2:4","Richt 21:2","Ezra 10 l=\"L1\" data-code=\"H2767\">Horma</span> waren, <span class=\"wl\" data-l=\"L2\" data-code=\"H3565\">en</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3565\">aan</span> hen <span class=\"wl\" data-l=\"L2\" data-code=\"H3565\">die</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3565\">in</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3565\">Chor</span>-<span class=\"wl\" data-l=\"L2\" data-code=\"H3565\">asan</span> waren, <span class=\"wl\" data-l=\"L3\" data-code=\"H6269\">en</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H6269\">aan</span> hen <span class=\"wl\" data-l=\"L3\" data-code=\"H6269\">die</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H6269\">in</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H6269\">Atach</span> waren,","31":"<span class=\"wl\" data-l=\"L1\" data-code=\"H2275\">en</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H2275\">aan</span> hen <span class=\"wl\" data-l=\"L1\" data-code=\"H2275\">die</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H2275\">in</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H2275\">Hebron</span> waren, <span class=\"wl\" data-l=\"L2\" data-code=\"H3605\">en</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3605\">aan</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3605\">al</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3605\">de</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H4725\">plaatsen</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H834\">waar</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H1732\">David</span> rondgetrokken <span class=\"wl\" data-l=\"L6\" data-code=\"H1931\">had</span>, <span class=\"wl\" data-l=\"L6\" data-code=\"H1931\">hij</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H582\">en</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H582\">zijn</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H582\">mannen</span>."},"koppeling_kjv":{"1":"And it came to pass, when <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> and his <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> were <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to <span class=\"wl wl-kjv\" data-code=\"H6860\">Ziklag</span> on the <span class=\"wl wl-kjv\" data-code=\"H7992\">third</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> that the <span class=\"wl wl-kjv\" data-code=\"H6003\">Amalekites</span> had <span class=\"wl wl-kjv\" data-code=\"H6584\">invaded</span> the <span class=\"wl wl-kjv\" data-code=\"H5045\">south,</span> and <span class=\"wl wl-kjv\" data-code=\"H6860\">Ziklag,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">smitten</span> <span class=\"wl wl-kjv\" data-code=\"H6860\">Ziklag,</span> and <span class=\"wl wl-kjv\" data-code=\"H8313\">burned</span> it with <span class=\"wl wl-kjv\" data-code=\"H784\">fire;</span>","2":"And had taken the <span class=\"wl wl-kjv\" data-code=\"H802\">women</span> <span class=\"wl wl-kjv\" data-code=\"H7617\">captives,</span> that were therein: they <span class=\"wl wl-kjv\" data-code=\"H4191\">slew</span> not <span class=\"wl wl-kjv\" data-code=\"H376\">any,</span> either <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> or <span class=\"wl wl-kjv\" data-code=\"H6996\">small,</span> but carried them <span class=\"wl wl-kjv\" data-code=\"H5090\">away,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> on their <span class=\"wl wl-kjv\" data-code=\"H1870\">way.</span>","3":"So <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> and his <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and, behold, it was <span class=\"wl wl-kjv\" data-code=\"H8313\">burned</span> with <span class=\"wl wl-kjv\" data-code=\"H784\">fire;</span> and their <span class=\"wl wl-kjv\" data-code=\"H802\">wives,</span> and their <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> and their <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters,</span> were taken <span class=\"wl wl-kjv\" data-code=\"H7617\">captives.</span>","4":"Then <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that were with him lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> their <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> and <span class=\"wl wl-kjv\" data-code=\"H1058\">wept,</span> until they had no more <span class=\"wl wl-kjv\" data-code=\"H3581\">power</span> to <span class=\"wl wl-kjv\" data-code=\"H1058\">weep.</span>","5":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David's</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wives</span> were taken <span class=\"wl wl-kjv\" data-code=\"H7617\">captives,</span> <span class=\"wl wl-kjv\" data-code=\"H293\">Ahinoam</span> the <span class=\"wl wl-kjv\" data-code=\"H3159\">Jezreelitess,</span> and <span class=\"wl wl-kjv\" data-code=\"H26\">Abigail</span> the <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> of <span class=\"wl wl-kjv\" data-code=\"H5037\">Nabal</span> the <span class=\"wl wl-kjv\" data-code=\"H3761\">Carmelite.</span>","6":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> was <span class=\"wl wl-kjv\" data-code=\"H3966\">greatly</span> <span class=\"wl wl-kjv\" data-code=\"H3334\">distressed;</span> for the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> of <span class=\"wl wl-kjv\" data-code=\"H5619\">stoning</span> him, because the <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> of all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> was <span class=\"wl wl-kjv\" data-code=\"H4843\">grieved,</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> for his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> and for his <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters:</span> but <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H2388\">encouraged</span> himself in the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> his <span class=\"wl wl-kjv\" data-code=\"H430\">God.</span>","7":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H54\">Abiathar</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> <span class=\"wl wl-kjv\" data-code=\"H288\">Ahimelech's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> I pray thee, bring me <span class=\"wl wl-kjv\" data-code=\"H5066\">hither</span> the <span class=\"wl wl-kjv\" data-code=\"H646\">ephod.</span> And <span class=\"wl wl-kjv\" data-code=\"H54\">Abiathar</span> <span class=\"wl wl-kjv\" data-code=\"H5066\">brought</span> thither the <span class=\"wl wl-kjv\" data-code=\"H646\">ephod</span> to <span class=\"wl wl-kjv\" data-code=\"H1732\">David.</span>","8":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H7592\">enquired</span> at the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Shall I <span class=\"wl wl-kjv\" data-code=\"H7291\">pursue</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> this <span class=\"wl wl-kjv\" data-code=\"H1416\">troop?</span> shall I <span class=\"wl wl-kjv\" data-code=\"H5381\">overtake</span> them? And he <span class=\"wl wl-kjv\" data-code=\"H559\">answered</span> him, <span class=\"wl wl-kjv\" data-code=\"H7291\">Pursue:</span> for thou shalt <span class=\"wl wl-kjv\" data-code=\"H5381\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H5381\">overtake</span> them, and without <span class=\"wl wl-kjv\" data-code=\"H5337\">fail</span> <span class=\"wl wl-kjv\" data-code=\"H5337\">recover</span> all.","9":"So <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went,</span> he and the <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> that were with him, and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the <span class=\"wl wl-kjv\" data-code=\"H5158\">brook</span> <span class=\"wl wl-kjv\" data-code=\"H1308\">Besor,</span> where those that were left <span class=\"wl wl-kjv\" data-code=\"H3498\">behind</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">stayed.</span>","10":"But <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H7291\">pursued,</span> he and <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men:</span> for two <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> abode <span class=\"wl wl-kjv\" data-code=\"H5975\">behind,</span> which were so <span class=\"wl wl-kjv\" data-code=\"H6296\">faint</span> that they could not go <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> the <span class=\"wl wl-kjv\" data-code=\"H5158\">brook</span> <span class=\"wl wl-kjv\" data-code=\"H1308\">Besor.</span>","11":"And they <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> an <span class=\"wl wl-kjv\" data-code=\"H376\">Egyptian</span> in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">brought</span> him to <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> him <span class=\"wl wl-kjv\" data-code=\"H3899\">bread,</span> and he did <span class=\"wl wl-kjv\" data-code=\"H398\">eat;</span> and they made him <span class=\"wl wl-kjv\" data-code=\"H8248\">drink</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water;</span>","12":"And they <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> him a <span class=\"wl wl-kjv\" data-code=\"H6400\">piece</span> of a <span class=\"wl wl-kjv\" data-code=\"H1690\">cake</span> of figs, and <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> clusters of <span class=\"wl wl-kjv\" data-code=\"H6778\">raisins:</span> and when he had <span class=\"wl wl-kjv\" data-code=\"H398\">eaten,</span> his <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> came <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> to him: for he had <span class=\"wl wl-kjv\" data-code=\"H398\">eaten</span> no <span class=\"wl wl-kjv\" data-code=\"H3899\">bread,</span> nor <span class=\"wl wl-kjv\" data-code=\"H8354\">drunk</span> any <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> and <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3915\">nights.</span>","13":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, To whom belongest thou? and whence art thou? And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I am a young <span class=\"wl wl-kjv\" data-code=\"H5288\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H4713\">Egypt,</span> <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> to an <span class=\"wl wl-kjv\" data-code=\"H376\">Amalekite;</span> and my <span class=\"wl wl-kjv\" data-code=\"H113\">master</span> <span class=\"wl wl-kjv\" data-code=\"H5800\">left</span> me, because <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> agone I fell <span class=\"wl wl-kjv\" data-code=\"H2470\">sick.</span>","14":"We made an <span class=\"wl wl-kjv\" data-code=\"H6584\">invasion</span> upon the <span class=\"wl wl-kjv\" data-code=\"H5045\">south</span> of the <span class=\"wl wl-kjv\" data-code=\"H3774\">Cherethites,</span> and upon the coast which belongeth to <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and upon the <span class=\"wl wl-kjv\" data-code=\"H5045\">south</span> of <span class=\"wl wl-kjv\" data-code=\"H3612\">Caleb;</span> and we <span class=\"wl wl-kjv\" data-code=\"H8313\">burned</span> <span class=\"wl wl-kjv\" data-code=\"H6860\">Ziklag</span> with <span class=\"wl wl-kjv\" data-code=\"H784\">fire.</span>","15":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to him, Canst thou bring me <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to this <span class=\"wl wl-kjv\" data-code=\"H1416\">company?</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H7650\">Swear</span> unto me by <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> that thou wilt neither <span class=\"wl wl-kjv\" data-code=\"H4191\">kill</span> me, <span class=\"wl wl-kjv\" data-code=\"H518\">nor</span> <span class=\"wl wl-kjv\" data-code=\"H5462\">deliver</span> me into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> of my <span class=\"wl wl-kjv\" data-code=\"H113\">master,</span> and I will bring thee <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to this <span class=\"wl wl-kjv\" data-code=\"H1416\">company.</span>","16":"And when he had brought him <span class=\"wl wl-kjv\" data-code=\"H3381\">down,</span> behold, they were spread <span class=\"wl wl-kjv\" data-code=\"H5203\">abroad</span> upon <span class=\"wl wl-kjv\" data-code=\"H6440\">all</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> <span class=\"wl wl-kjv\" data-code=\"H398\">eating</span> and <span class=\"wl wl-kjv\" data-code=\"H8354\">drinking,</span> and <span class=\"wl wl-kjv\" data-code=\"H2287\">dancing,</span> because of all the <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H7998\">spoil</span> that they had <span class=\"wl wl-kjv\" data-code=\"H3947\">taken</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines,</span> and out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah.</span>","17":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> them from the <span class=\"wl wl-kjv\" data-code=\"H5399\">twilight</span> even unto the <span class=\"wl wl-kjv\" data-code=\"H6153\">evening</span> of the next <span class=\"wl wl-kjv\" data-code=\"H4283\">day:</span> and there <span class=\"wl wl-kjv\" data-code=\"H4422\">escaped</span> not a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of them, save <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H5288\">young</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men,</span> which <span class=\"wl wl-kjv\" data-code=\"H7392\">rode</span> upon <span class=\"wl wl-kjv\" data-code=\"H1581\">camels,</span> and <span class=\"wl wl-kjv\" data-code=\"H5127\">fled.</span>","18":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H5337\">recovered</span> all that the <span class=\"wl wl-kjv\" data-code=\"H6002\">Amalekites</span> had carried <span class=\"wl wl-kjv\" data-code=\"H3947\">away:</span> and <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H5337\">rescued</span> his <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wives.</span>","19":"And there was nothing <span class=\"wl wl-kjv\" data-code=\"H5737\">lacking</span> to them, <span class=\"wl wl-kjv\" data-code=\"H4480\">neither</span> <span class=\"wl wl-kjv\" data-code=\"H6996\">small</span> nor <span class=\"wl wl-kjv\" data-code=\"H1419\">great,</span> neither <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> nor <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters,</span> neither <span class=\"wl wl-kjv\" data-code=\"H7998\">spoil,</span> nor any thing that they had <span class=\"wl wl-kjv\" data-code=\"H3947\">taken</span> to them: <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">recovered</span> all.","20":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> all the <span class=\"wl wl-kjv\" data-code=\"H6629\">flocks</span> and the <span class=\"wl wl-kjv\" data-code=\"H1241\">herds,</span> which they <span class=\"wl wl-kjv\" data-code=\"H5090\">drave</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H1931\">those</span> other <span class=\"wl wl-kjv\" data-code=\"H4735\">cattle,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> This is <span class=\"wl wl-kjv\" data-code=\"H1732\">David's</span> <span class=\"wl wl-kjv\" data-code=\"H7998\">spoil.</span>","21":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the two <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men,</span> which were so <span class=\"wl wl-kjv\" data-code=\"H6296\">faint</span> that they could not <span class=\"wl wl-kjv\" data-code=\"H3212\">follow</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> whom they had made also to <span class=\"wl wl-kjv\" data-code=\"H3427\">abide</span> at the <span class=\"wl wl-kjv\" data-code=\"H5158\">brook</span> <span class=\"wl wl-kjv\" data-code=\"H1308\">Besor:</span> and they went <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> and to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that were with him: and when <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> came <span class=\"wl wl-kjv\" data-code=\"H5066\">near</span> to the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> he <span class=\"wl wl-kjv\" data-code=\"H7592\">saluted</span> them.","22":"Then <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> all the <span class=\"wl wl-kjv\" data-code=\"H7451\">wicked</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> and men of <span class=\"wl wl-kjv\" data-code=\"H1100\">Belial,</span> of <span class=\"wl wl-kjv\" data-code=\"H582\">those</span> that <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> with <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Because they <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> not with us, we will not <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> them ought of the <span class=\"wl wl-kjv\" data-code=\"H7998\">spoil</span> that we have <span class=\"wl wl-kjv\" data-code=\"H5337\">recovered,</span> save to every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> his <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> and his <span class=\"wl wl-kjv\" data-code=\"H1121\">children,</span> that they may lead them <span class=\"wl wl-kjv\" data-code=\"H5090\">away,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">depart.</span>","23":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> Ye shall not do <span class=\"wl wl-kjv\" data-code=\"H6213\">so,</span> my <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> with that which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> us, who hath <span class=\"wl wl-kjv\" data-code=\"H8104\">preserved</span> us, and <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> the <span class=\"wl wl-kjv\" data-code=\"H1416\">company</span> that <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> against us into our <span class=\"wl wl-kjv\" data-code=\"H3027\">hand.</span>","24":"For who will <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> unto you in this <span class=\"wl wl-kjv\" data-code=\"H1697\">matter?</span> but as his <span class=\"wl wl-kjv\" data-code=\"H2506\">part</span> is that goeth <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle,</span> so shall his <span class=\"wl wl-kjv\" data-code=\"H2506\">part</span> be that <span class=\"wl wl-kjv\" data-code=\"H3427\">tarrieth</span> by the <span class=\"wl wl-kjv\" data-code=\"H3627\">stuff:</span> they shall <span class=\"wl wl-kjv\" data-code=\"H2505\">part</span> <span class=\"wl wl-kjv\" data-code=\"H3162\">alike.</span>","25":"And it was so from that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> <span class=\"wl wl-kjv\" data-code=\"H4605\">forward,</span> that he <span class=\"wl wl-kjv\" data-code=\"H7760\">made</span> it a <span class=\"wl wl-kjv\" data-code=\"H2706\">statute</span> and an <span class=\"wl wl-kjv\" data-code=\"H4941\">ordinance</span> for <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> unto this <span class=\"wl wl-kjv\" data-code=\"H3117\">day.</span>","26":"And when <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H6860\">Ziklag,</span> he <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> of the <span class=\"wl wl-kjv\" data-code=\"H7998\">spoil</span> unto the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> even to his <span class=\"wl wl-kjv\" data-code=\"H7453\">friends,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Behold a <span class=\"wl wl-kjv\" data-code=\"H1293\">present</span> for you of the <span class=\"wl wl-kjv\" data-code=\"H7998\">spoil</span> of the <span class=\"wl wl-kjv\" data-code=\"H341\">enemies</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span>","27":"To <span class=\"wl wl-kjv\" data-code=\"H834\">them</span> which were in <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel,</span> and to them which were in <span class=\"wl wl-kjv\" data-code=\"H5045\">south</span> <span class=\"wl wl-kjv\" data-code=\"H7418\">Ramoth,</span> and to them which were in <span class=\"wl wl-kjv\" data-code=\"H3492\">Jattir,</span>","28":"And to them which were in <span class=\"wl wl-kjv\" data-code=\"H6177\">Aroer,</span> and to them which were in <span class=\"wl wl-kjv\" data-code=\"H8224\">Siphmoth,</span> and to them which were in <span class=\"wl wl-kjv\" data-code=\"H851\">Eshtemoa,</span>","29":"And to them which were in <span class=\"wl wl-kjv\" data-code=\"H7403\">Rachal,</span> and to them which were in the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of the <span class=\"wl wl-kjv\" data-code=\"H3397\">Jerahmeelites,</span> and to them which were in the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of the <span class=\"wl wl-kjv\" data-code=\"H7017\">Kenites,</span>","30":"And to them which were in <span class=\"wl wl-kjv\" data-code=\"H2767\">Hormah,</span> and to them which were in <span class=\"wl wl-kjv\" data-code=\"H3565\">Chorashan,</span> and to them which were in <span class=\"wl wl-kjv\" data-code=\"H6269\">Athach,</span>","31":"And to them which were in <span class=\"wl wl-kjv\" data-code=\"H2275\">Hebron,</span> and to all the <span class=\"wl wl-kjv\" data-code=\"H4725\">places</span> where <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> himself and his <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> were wont to <span class=\"wl wl-kjv\" data-code=\"H1980\">haunt.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"den derden dag","tekst":"Te weten, nadat David uit het leger der Filistijnen gescheiden was, want zo ver lag wel het leger der Filistijnen [waar David met zijn mannen geweest was] van de stad Ziklag, gelijk af te nemen is uit 2Sa 1:2."},{"catchword":"de Amalekieten","tekst":"Versta, de overgebleven Amalekieten, die ontkomen waren toen Saul die sloeg, 1Sa 15:7. Of dit is te verstaan van de Amalekieten, die ergens in een andere streek of hoek lands woonden dan die, welke door Saul zijn uitgeroeid. Dezen hebben hun ouden haat tegen de Israëlieten getoond."},{"catchword":"geslagen,","tekst":"Dat is, geruïneerd en de inwoners kwalijk gehandeld. Zie Eze 33:21."}],"2":[{"catchword":"kleinste","tekst":"Anders, kleinen, groten. 4. den grootste, Anders, kleinen, groten."}],"5":[{"catchword":"huisvrouw van Nabal,","tekst":"Zie de aantekeningen 1Sa 27:3."}],"6":[{"catchword":"de zielen van het ganse volk","tekst":"Hebreeuws, de ziel des gansen volks was bitter; dat is, zij waren van harte bedroefd, daartoe met bitterheid en gramschap ingenomen tegen David, hem de schuld gevende dat zij van hun vrouwen en kinderen beroofd waren door de Amalekieten; daartoe zijnde bewogen geworden, omdat David hen eerst vijandelijk aangetast en geslagen had, 1Sa 27:8."},{"catchword":"over zijn zonen en over zijn dochteren;","tekst":"Of, vanwege"},{"catchword":"David sterkte zich in den HEERE, zijn God","tekst":"Vertrouwende op de beloften en toezeggingen, die God hem gedaan had, dat hij koning worden zou. Zie de aantekeningen boven, 1Sa 23:16."}],"7":[{"catchword":"Breng mij toch den efod hier","tekst":"Dat is, trek den efod aan om mijnentwil, opdat gij daardoor den Heere raad vraagt. Zie Num 27:21, en boven, 1Sa 23:9."}],"8":[{"catchword":"deze bende achternajagen?","tekst":"Hij verstaat de Amalekieten, alook vs.15."}],"9":[{"catchword":"de overigen staan","tekst":"Te weten, twee honderd mannen, die zo moede waren dat zij niet volgen konden, vs.10."}],"11":[{"catchword":"zij vonden een Egyptischen man","tekst":"Te weten, de mannen, die bij David waren."},{"catchword":"zij brachten hem tot David;","tekst":"Hebreeuws, zij namen hem tot David; dat is, zij namen en brachten. Zie de aantekeningen Gen 12:15."}],"12":[{"catchword":"geest kwam weder","tekst":"Dat is, hij die flauw en amechtig was en van honger schier versmacht, werd door de spijs verkwikt. Zodat het woord geest hier betekent ademing"},{"catchword":"in hem;","tekst":"Anders, tot hem"},{"catchword":"brood gegeten, noch water gedronken","tekst":"Dat is, spijs."}],"13":[{"catchword":"jongen","tekst":"Dat is, jonkman, jongeling. Zie Gen 22:5."},{"catchword":"voor drie dagen","tekst":"Hebreeuws, die is de derde dag."}],"14":[{"catchword":"de Cherethieten,","tekst":"Dat is, der Filistijnen, gelijk men kan afnemen uit vs.16. Aldus worden de Filistijnen ook genaamd Eze 25:16; Zep 2:5."},{"catchword":"tegen het zuiden van Kaleb;","tekst":"Dat is, tegen het zuiden des lands, waar de nakomelingen van Kaleb woonden. Zie Jos 14:13, en Jos 15:13."}],"15":[{"catchword":"dat gij mij niet zult doden,","tekst":"Hebreeuws, zo gij mij zult doden, en zo gij mij zult overleveren, enz. Zie van zulke eedzweren, Gen 14:23. De zin is: Dat gij mij niet zult doden, of dat, enz. Vergelijk boven, 1Sa 24:22, enz."}],"16":[{"catchword":"het land van Juda","tekst":"Daaronder behoorde nu Ziklag en het land van Kaleb."}],"17":[{"catchword":"de schemering","tekst":"Het Hebreeuwse woord, dat hier gebruikt wordt, gelijk ook ons woord schemering, betekent zowel de avond-al de morgenschemering. Sommigen menen dat David dit volk in de avondschemering heeft aangevallen [want hij vond hen etende, drinkende en dansende, hetwelk gemeenlijk des avonds, niet met het aanbreken van den dag geschiedt], houden ook dat David, zijnde maar vier honderd man sterk, liever de duisternis van den nacht heeft waargenomen, om deze grote menigte te overvallen in hun dronkenschap en vreugde, dan de schemering van den morgenstond, toen de dag aankwam. Anderen nochtans nemen het hier voor de schemering des morgens, achtende dat David en zijn mannen des avonds te moede waren om een aanval op hun vijanden te doen."},{"catchword":"tot aan den avond","tekst":"Dat is, des avonds van den anderen dag, in welken David met zijn mannen was uitgetogen."}],"20":[{"catchword":"zij dreven ze","tekst":"Te weten, de mannen van David."},{"catchword":"voor datzelve vee heen,","tekst":"Dat is, voor het vee, dat hun van de Amalekieten was ontnomen geweest."},{"catchword":"Dit is Davids buit","tekst":"Dat is, die David toebehoort, daarom heeft hij ook daarvan weggeschonken waar en aan wie het hem beliefde. Zie onder, vs.26."}],"21":[{"catchword":"de tweehonderd mannen kwam,","tekst":"Zie boven, vs.9,10."},{"catchword":"hij vraagde hen naar den welstand","tekst":"Dat is, hij groette hen vriendelijk, en vraagde hun of het hun al welging."}],"22":[{"catchword":"Toen antwoordde een ieder boos","tekst":"Te weten, als men begon te spreken van den buit te delen."},{"catchword":"met ons niet getogen zijn,","tekst":"Hebreeuws, met mij."}],"23":[{"catchword":"met hetgeen ons de HEERE gegeven heeft,","tekst":"Te weten, met den buit, welken wij gekregen hebben, niet door onze eigen macht, maar dien ons de Heere gegeven heeft."}],"24":[{"catchword":"zij zullen gelijkelijk delen","tekst":"Dat is, de mannen, die achtergebleven zijn en die bij de bagage gebleven zijn, zullen alzo wel hun deel van den buit hebben als die, wel ord":"waar David gewandeld had,","tekst":"Dat is, waar David zich somwijlen met zijn volk onthouden had, als hij voor Saul heeft moeten vluchten. David is dankbaar geweest jegens diegenen, die hem met de zijnen geherbergd en goed gedaan hebben."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And it came to pass when David and his men cam e to Ziklag on the third day: [viz. After that David was parted from the Philistines camp, for at so great a distance lay the Philistines camp (where David and his men had been) from the city of Ziklag, as may be gathered from 2 Sam 1. 2.] that the Amalekites [understand the remnant of the Amalekites that escaped, when Saul smote that people, 1 Sam. 5. 7. Or this may be understood of the Amalekites that lived in another part or corner of the land, then those did that were destroyed by Saul. These bewrayed their old inveterate hatred against the Israelites] were fallen into the South, ad Ziklag, and had smitten Ziklag, [i.e. ruined it, and ill intreated the inhabitants thereof: See Ezek. 33. On v. 22.] and burnt the same with fire."}],"2":[{"catchword":null,"tekst":"And had carried away the women captives, that were therein, (but) they had slaid none, from the least to the greatest: [Oth. Small or great] but had carried them away, and were gone their way."}],"3":[{"catchword":null,"tekst":"And David and his men came to the city, ad behold, it was burnt with fire ; and their women, and sons, and their daughters, were carried away captives."}],"4":[{"catchword":null,"tekst":"Then David and the people that were with him, lift up their voice, and wept: until there was no (more) power in them to weep."}],"5":[{"catchword":null,"tekst":"Both Davids wives also, carried away captives, Achioam the Jisreelitess, and Abigail the wife of Nabal, [See the annotate. On chap. 27. 3.] the Carmelite."}],"6":[{"catchword":null,"tekst":"And David was sore distressed, for the people spake of stoning him, for the souls of all the people were embi (function bouwHfdnav() {

  const boekOpties = m.boeken.map(b =>

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {

      }).join('');

    } else {

    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
