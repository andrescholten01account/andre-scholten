ed", "href": "../../torrey/j/?hl=Ruth.4.21#i10604", "refs": [{"disp": "Ruth 4:21", "href": "../../ruth/4/#v21", "ref": "Ruth 4:21", "svLabel": null}], "kinderen": []}]}]}]}, "22": {"nave": [{"topic": "Ruth", "href": "../../nave/r/#t-ruth", "kinderen": [{"label": "Becomes an ancestor of Jesus", "href": "../../nave/r/?hl=Ruth.4.22#i17650", "refs": [{"disp": "Ruth 4:13", "href": "../../ruth/4/#v13", "ref": "Ruth 4:13", "svLabel": null}, {"disp": "Ruth 4:21", "href": "../../ruth/4/#v21", "ref": "Ruth 4:21", "svLabel": null}, {"disp": "Ruth 4:22", "href": "../../ruth/4/#v22", "ref": "Ruth 4:22", "svLabel": null}], "kinderen": []}]}], "torrey": [{"topic": "Judah, The Tribe Of", "href": "../../torrey/j/#t-judah-the-tribe-of", "kinderen": [{"label": "Remarkable persons of", "href": "../../torrey/j/?hl=Ruth.4.22#i10600", "refs": [], "kinderen": [{"label": "Jesse", "href": "../../torrey/j/?hl=Ruth.4.22#i10605", "refs": [{"disp": "Ruth 4:22", "href": "../../ruth/4/#v22", "ref": "Ruth 4:22", "svLabel": null}, {"disp": "1 Sam 16:1", "href": "../../1-samuel/16/#v1", "ref": "1 Sam 16:1", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"Ruth 4:9-13": "Toen zei Boaz tegen de oudsten en al het volk: U bent heden getuigen, dat ik alles gekocht heb wat van Elimelech geweest is, en alles wat van Chiljon en Machlon geweest is, van de hand van Naomi. Daarbij koop ik ook Ruth, de Moabitische, de vrouw van Machlon, tot vrouw, om de naam van de gestorvene te doen voortbestaan over zijn erfdeel, opdat de naam van de gestorvene niet wordt uitgeroeid onder zijn broeders en uit de poort van zijn woonplaats; u bent heden getuigen. En al het volk dat in de poort was, alsook de oudsten, zeiden: Wij zijn getuigen; de HEERE make deze vrouw, die in uw huis komt, als Rachel en als Lea, die beiden het huis van Israël gebouwd hebben; en handel kloek in Efratha, en maak uw naam vermaard in Bethlehem!", "Ruth 2:20": "Toen zei Naomi tegen haar schoondochter: Gezegend zij hij door de HEERE, Die Zijn goedertierenheid niet nagelaten heeft aan de levenden en aan de doden! Verder zei Naomi tegen haar: Die man is onze nabestaande; hij is een van onze lossers.", "Gen 35:19": "Zo stierf Rachel; en zij werd begraven aan de weg naar Efrath, dat is Bethlehem.", "Jer 32:9-12": "Dus kocht ik van Hanameel, de zoon van mijn oom, het veld dat bij Anathoth is; en ik woog hem het geld toe, zeventien zilveren sikkels. En ik ondertekende de brief en verzegelde hem, en liet het door getuigen bevestigen, toen ik het geld op de weegschaal gewogen had. En ik nam de koopbrief, die verzegeld was volgens het gebod en de bepalingen, en de open brief;", "Neh 3:9": "En aan hun hand verbeterde Refaja, de zoon van Hur, leider van het halve deel van Jeruzalem.", "Gen 29:19": "Toen zei Laban: Het is beter dat ik haar aan u geef, dan dat ik haar aan een andere man geef; blijf bij mij.", "Matt 22:24": "En zeiden: Meester! Mozes heeft gezegd: Als iemand sterft zonder kinderen te hebben, zal zijn broer met zijn vrouw trouwen en voor zijn broer nakomelingen verwekken.", "Pred 2:19": "Want wie weet of hij wijs zal zijn of dwaas? Toch zal hij heersen over al mijn arbeid, die ik met inspanning verricht heb en waarin ik mij wijs heb betoond onder de zon. Dat is ook ijdelheid.", "Ruth 4:2-5": "En hij nam tien mannen van de oudsten van de stad en zei: Zet u hier neer; en zij zetten zich neer. Toen zei hij tegen die losser: Het stuk land dat van onze broeder Elimelech was, heeft Naomi, die uit het land van de Moabieten teruggekomen is, verkocht. En ik heb gezegd: Ik zal het voor uw oor bekendmaken en zeggen: Koop het in tegenwoordigheid van de inwoners en in tegenwoordigheid van de oudsten van mijn volk; als u het zult lossen, los het; en als men het niet zou lossen, verklaar het mij, zodat ik het weet; want er is niemand behalve u die het kan lossen, en ik na u. Toen zei hij: Ik zal het lossen.", "Spr 31:11": "Beth. Het hart van haar man vertrouwt op haar, zodat het hem aan geen goed zal ontbreken.", "Ruth 1:5": "En die twee, Machlon en Chiljon, stierven ook allebei; zo bleef deze vrouw achter na haar twee zonen en na haar man.", "Jes 46:4": "En tot de ouderdom toe zal Ik Dezelfde zijn, ja, tot de grijsheid toe zal Ik u dragen; Ik heb het gedaan, en Ik zal u opnemen, en Ik zal dragen en redden.", "Gen 35:8": "En Debora, de voedster van Rebekka, stierf, en zij werd begraven onder aan Bethel, onder die eik, waarvan hij de naam Allon-Bachuth noemde.", "Spr 14:1": "Elke wijze vrouw bouwt haar huis; maar wie zeer dwaas is, breekt het met eigen handen af.", "Ruth 4:3-9": "Toen zei hij tegen die losser: Het stuk land dat van onze broeder Elimelech was, heeft Naomi, die uit het land van de Moabieten teruggekomen is, verkocht. En ik heb gezegd: Ik zal het voor uw oor bekendmaken en zeggen: Koop het in tegenwoordigheid van de inwoners en in tegenwoordigheid van de oudsten van mijn volk; als u het zult lossen, los het; en als men het niet zou lossen, verklaar het mij, zodat ik het weet; want er is niemand behalve u die het kan lossen, en ik na u. Toen zei hij: Ik zal het lossen. Maar Boaz zei: Op de dag dat u het land aanvaardt van de hand van Naomi, zult u het ook aanvaarden van Ruth, de Moabitische, de vrouw van de gestorvene, om de naam van de gestorvene te doen voortbestaan over zijn erfdeel.", "Jer 32:9-14": "Dus kocht ik van Hanameel, de zoon van mijn oom, het veld dat bij Anathoth is; en ik woog hem het geld toe, zeventien zilveren sikkels. En ik ondertekende de brief en verzegelde hem, en liet het door getuigen bevestigen, toen ik het geld op de weegschaal gewogen had. En ik nam de koopbrief, die verzegeld was volgens het gebod en de bepalingen, en de open brief;", "Gen 23:13-16": "En hij sprak tot Efron, ten aanhoren van het volk van het land, en zei: Trouwens, als u het toch wilt geven, hoor mij dan alstublieft; ik zal het geld van de akker geven; neem het van mij aan, dan zal ik mijn dode daar begraven. En Efron antwoordde Abraham en zei tegen hem: Mijn heer! Hoor mij; een stuk land van vierhonderd sikkel van het zilver, wat is dat tussen mij en u? Begraaf toch uw dode.", "Spr 19:14": "Huis en bezit zijn een erfdeel van de vaderen; maar een verstandige vrouw is van de HEERE.", "Jer 32:10-12": "En ik ondertekende de brief en verzegelde hem, en liet het door getuigen bevestigen, toen ik het geld op de weegschaal gewogen had. En ik nam de koopbrief, die verzegeld was volgens het gebod en de bepalingen, en de open brief; En ik gaf de koopbrief aan Baruch, de zoon van Nerija, de zoon van Machseja, voor de ogen van Hanameel, de zoon van mijn oom, en voor de ogen van de getuigen die de koopbrief hadden ondertekend; voor de ogen van alle Joden die in het voorhof van de bewaking zaten.", "Jer 32:44": "Velden zal men voor geld kopen, en de brieven ondertekenen en verzegelen, en getuigen doen bevestigen, in het land van Benjamin, en in de plaatsen rondom Jeruzalem, en in de steden van Juda, en in de steden van het gebergte, en in de steden van de laagvlakte, en in de steden van het zuiden; want Ik zal hun gevangenschap ten goede keren, spreekt de HEERE.", "Deut 25:7-10": "Maar als die man geen zin heeft om de vrouw van zijn broer te nemen, dan zal de vrouw van zijn broer naar de poort gaan, naar de oudsten, en zeggen: Mijn zwager weigert voor zijn broer een naam te doen voortbestaan in Israël; hij wil de plicht van een zwager niet aan mij vervullen. Dan zullen de oudsten van zijn stad hem roepen, en met hem spreken; blijft hij dan daarbij staan en zegt: Ik heb geen zin haar te nemen; dan zal de vrouw van zijn broer voor de ogen van de oudsten tot hem toetreden, en zijn schoen van zijn voet uittrekken, en in zijn gezicht spugen, en verklaren en zeggen: Zo zal met die man gedaan worden, die het huis van zijn broer niet wil opbouwen.", "2 Kon 10:1-7": "Achab had zeventig zonen te Samaria; en Jehu schreef brieven, die hij zond naar Samaria, tot de leiders van Jizreël, de oudsten, en tot de voedsterheren van Achab, en zei: Zo gauw deze brief tot u komt - omdat de zonen van uw heer bij u zijn, ook de wagens en de paarden bij u zijn, alsook een vaste stad, en wapens - zo kijkt naar de beste en meest geschikte van de zonen van uw heer, zet hem op de troon van zijn vader; en strijdt voor het huis van uw heer.", "Ruth 3:13": "Blijf deze nacht hier; vervolgens zal het in de morgen gebeuren: als hij u lost, goed, laat hem lossen; maar als hij u niet wil lossen, dan zal ik u lossen, zo waarachtig als de HEERE leeft; ga liggen tot de morgen toe.", "Gen 25:21": "En Izak bad de HEERE vurig voor zijn vrouw; want zij was onvruchtbaar; en de HEERE liet Zich door hem verbidden, zodat Rebekka, zijn vrouw, zwanger werd.", "Ruth 4:3-8": "Toen zei hij tegen die losser: Het stuk land dat van onze broeder Elimelech was, heeft Naomi, die uit het land van de Moabieten teruggekomen is, verkocht. En ik heb gezegd: Ik zal het voor uw oor bekendmaken en zeggen: Koop het in tegenwoordigheid van de inwoners en in tegenwoordigheid van de oudsten van mijn volk; als u het zult lossen, los het; en als men het niet zou lossen, verklaar het mij, zodat ik het weet; want er is niemand behalve u die het kan lossen, en ik na u. Toen zei hij: Ik zal het lossen. Maar Boaz zei: Op de dag dat u het land aanvaardt van de hand van Naomi, zult u het ook aanvaarden van Ruth, de Moabitische, de vrouw van de gestorvene, om de naam van de gestorvene te doen voortbestaan over zijn erfdeel.", "Gen 21:10": "En zij zei tegen Abraham: Jaag deze slavin en haar zoon weg; want de zoon van deze slavin zal niet erven met mijn zoon, met Izak.", "Gen 20:18": "Want de HEERE had al de baarmoeders van het huis van Abimelech helemaal gesloten, vanwege Sara, Abrahams vrouw.", "Gen 21:1-3": "En de HEERE bezocht Sara, zoals Hij gezegd had; en de HEERE deed aan Sara, zoals Hij gesproken had. En Sara werd zwanger, en baarde Abraham een zoon in zijn ouderdom, op de vastgestelde tijd die God hem gezegd had. En Abraham noemde de naam van zijn zoon die hem geboren was, die Sara hem gebaard had, Izak.", "Ps 34:2-4": "Aleph. Ik zal de HEERE loven te allen tijde; Zijn lof zal voortdurend in mijn mond zijn. Beth. Mijn ziel zal zich beroemen in de HEERE; de zachtmoedigen zullen het horen en zich verblijden. Gimel. Maakt de HEERE met mij groot, en laten wij Zijn Naam samen verhogen.", "Matt 22:24-26": "En zeiden: Meester! Mozes heeft gezegd: Als iemand sterft zonder kinderen te hebben, zal zijn broer met zijn vrouw trouwen en voor zijn broer nakomelingen verwekken. Nu waren er bij ons zeven broers; en de eerste trouwde en stierf, en omdat hij geen kinderen had, liet hij zijn vrouw na aan zijn broer. Evenzo ook de tweede, en de derde, tot de zevende toe.", "Joz 17:3-6": "Zelafead nu, de zoon van Hefer, de zoon van Gilead, de zoon van Machir, de zoon van Manasse, had geen zonen, maar dochters; en dit zijn de namen van zijn dochters: Machla en Noa, Hogla, Milka en Tirza. Dezen dan traden toe voor Eleazar, de priester, en voor Jozua, de zoon van Nun, en voor de leiders, en zeiden: De HEERE heeft Mozes geboden dat men ons een erfdeel geven zou te midden van onze broeders. Daarom gaf hij haar, naar het woord van de HEERE, een erfdeel te midden van de broeders van hun vader. En aan Manasse vielen tien snoeren toe, behalve het land Gilead en Bazan, dat aan de overkant van de Jordaan is.", "Richt 8:14-16": "ving hij een jongeman van de mensen van Sukkoth, en ondervroeg hem; die schreef voor hem de leiders van Sukkoth op, en hun oudsten, zevenenzeventig man. Toen kwam hij bij de mannen van Sukkoth en zei: Zie hier Zebah en Tsalmuna, over wie u mij smadelijk verweten hebt: Is de handpalm van Zebah en Tsalmuna dan al in uw hand, dat wij aan uw mannen, die moe zijn, brood zouden geven? En hij nam de oudsten van die stad, en doornen uit de woestijn, en distels, en liet het de mannen van Sukkoth daarmee ondervinden.", "Ruth 4:9-11": "Toen zei Boaz tegen de oudsten en al het volk: U bent heden getuigen, dat ik alles gekocht heb wat van Elimelech geweest is, en alles wat van Chiljon en Machlon geweest is, van de hand van Naomi. Daarbij koop ik ook Ruth, de Moabitische, de vrouw van Machlon, tot vrouw, om de naam van de gestorvene te doen voortbestaan over zijn erfdeel, opdat de naam van de gestorvene niet wordt uitgeroeid onder zijn broeders en uit de poort van zijn woonplaats; u bent heden getuigen. En al het volk dat in de poort was, alsook de oudsten, zeiden: Wij zijn getuigen; de HEERE make deze vrouw, die in uw huis komt, als Rachel en als Lea, die beiden het huis van Israël gebouwd hebben; en handel kloek in Efratha, en maak uw naam vermaard in Bethlehem!", "Spr 18:24": "Een man die vrienden heeft, moet zich vriendelijk gedragen; want er is een vriend die meer aankleeft dan een broeder.", "Jes 8:2": "Toen nam ik mij betrouwbare getuigen, Uria, de priester, en Zacharia, de zoon van Jeberechja.", "Ruth 4:18-20": "Dit nu zijn de geboorten van Perez: Perez verwekte Hezron; En Hezron verwekte Ram; en Ram verwekte Amminadab; En Amminadab verwekte Nahesson; en Nahesson verwekte Salma;", "1 Kron 2:12": "En Boaz verwekte Obed, en Obed verwekte Isaï,", "Matt 1:5-20": "en Salmon verwekte Boaz bij Rachab, en Boaz verwekte Obed bij Ruth, en Obed verwekte Isaï; en Isaï verwekte David, de koning; en David, de koning, verwekte Salomo bij haar die de vrouw van Uria geweest was; en Salomo verwekte Rehabeam, en Rehabeam verwekte Abia, en Abia verwekte Asa;", "Ex 18:25": "En Mozes koos bekwame mannen, uit heel Israël, en stelde hen aan tot hoofden over het volk; leiders over duizend, leiders over honderd, leiders over vijftig, en leiders over tien;", "Gen 28:3": "En God, de Almachtige, zegent u, en maakt u vruchtbaar, en vermenigvuldigt u, zodat u tot een groep volken wordt.", "Num 27:1-11": "Toen kwamen de dochters van Zelafead naar voren, de zoon van Hefer, de zoon van Gilead, de zoon van Machir, de zoon van Manasse, onder de geslachten van Manasse, de zoon van Jozef (en dit zijn de namen van zijn dochters: Machla, Noa, en Hogla, en Milka, en Tirza); En zij gingen staan voor Mozes, en voor Eleazar, de priester, en voor de leiders, en de hele vergadering, bij de deur van de tent van de samenkomst, en zeiden: Onze vader is gestorven in de woestijn, en hij is niet geweest onder hen die zich tegen de HEERE verzameld hebben, in de groep van Korach; maar hij is in zijn eigen zonde gestorven, en had geen zonen.", "Neh 3:19": "Aan zijn hand verbeterde Ezer, de zoon van Jesua, de leider van Mizpa, een ander stuk; tegenover de opgang naar het wapenhuis, aan de hoek.", "Ruth 4:6-8": "Toen zei die losser: Ik zal het voor mijzelf niet kunnen lossen, want anders verderf ik mijn eigen erfdeel; los u mijn lossingsrecht voor uzelf; want ik zal het niet kunnen lossen. Nu was dit van oude tijden af een gewoonte in Israël, bij de lossing en bij de ruil, om de hele zaak te bevestigen: de man trok zijn schoen uit en gaf die aan zijn naaste; en dit was een getuigenis in Israël. Zo zei de losser tegen Boaz: Koop het voor uzelf; en hij trok zijn schoen uit.", "Gen 35:16": "En zij reisden verder van Bethel; en er was nog een kleine afstand om tot Efrath te komen; en Rachel baarde, en zij had het zwaar bij haar bevalling.", "Lev 25:45": "U zult ze ook kopen van de kinderen van de bijwoners, die als vreemdelingen bij u verblijven, uit hen en uit hun geslachten, die bij u zullen zijn, die zij in uw land verwekt zullen hebben; en zij zullen u tot een bezitting zijn.", "Joh 18:13-28": "En zij leidden Hem weg, eerst naar Annas; want hij was de schoonvader van Kajafas, die dat jaar hogepriester was. Kajafas nu was degene die de Joden geadviseerd had dat het nuttig was dat één Mens sterven zou voor het volk. En Simon Petrus volgde Jezus, en ook een andere discipel. Deze discipel nu was bekend bij de hogepriester en ging met Jezus mee naar binnen, in het paleis van de hogepriester.", "Deut 19:12": "dan zullen de oudsten van zijn stad iemand sturen, en hem vandaar laten halen, en zij zullen hem overgeven in de hand van de bloedwreker, zodat hij sterft.", "Gen 30:22": "God dacht ook aan Rachel; en God verhoorde haar, en opende haar baarmoeder.", "Ex 18:22": "Laat hen dit volk te allen tijde oordelen; doch laat het zo zijn dat zij alle grote zaken bij u brengen, maar dat zij alle kleine zaken zelf oordelen; verlicht zo uzelf, en laat hen met u meedragen.", "Ps 113:9": "Die de onvruchtbare vrouw doet wonen als moeder in een huisgezin, een blijde moeder van kinderen. Halleluja!", "Matt 1:6": "en Isaï verwekte David, de koning; en David, de koning, verwekte Salomo bij haar die de vrouw van Uria geweest was;", "1 Kor 12:26": "En hetzij dat één lid lijdt, alle leden lijden mee; hetzij dat één lid geëerd wordt, alle leden verblijden zich mee.", "Amos 5:15": "Haat het kwade, en heb het goede lief, en zorg voor recht in de poort; misschien zal de HEERE, de God van de heerscharen, aan het overblijfsel van Jozef genadig zijn.", "1 Kron 2:4-8": "Maar Thamar, zijn schoondochter, baarde hem Perez en Zerah. Al de zonen van Juda waren vijf. De kinderen van Perez waren Hezron en Hamul. En de kinderen van Zerah waren Zimri, en Ethan, en Heman, en Chalcol, en Dara. Deze allen zijn vijf.", "Gen 20:17": "En Abraham bad tot God; en God genas Abimelech, en zijn vrouw, en zijn dienstmaagden, zodat zij weer kinderen kregen.", "Joz 7:9": "Als de Kanaänieten en alle inwoners van het land dit horen, zullen zij ons omsingelen, en onze naam van de aarde uitroeien; wat zult U dan doen voor Uw grote Naam?", "Luk 1:58-63": "En zij die daar rondom woonden, en haar verwanten, hoorden dat de Heere Zijn barmhartigheid overvloedig aan haar bewezen had, en zij verblijdden zich met haar. En het gebeurde dat zij op de achtste dag kwamen om het kindje te besnijden, en zij noemden hem Zacharias, naar de naam van zijn vader. En zijn moeder antwoordde en zei: Nee, maar hij zal Johannes heten.", "Pred 2:18": "Ik haatte ook al mijn arbeid die ik onder de zon verricht had, omdat ik die zou moeten achterlaten aan een mens die na mij komen zal.", "Ruth 4:2-11": "En hij nam tien mannen van de oudsten van de stad en zei: Zet u hier neer; en zij zetten zich neer. Toen zei hij tegen die losser: Het stuk land dat van onze broeder Elimelech was, heeft Naomi, die uit het land van de Moabieten teruggekomen is, verkocht. En ik heb gezegd: Ik zal het voor uw oor bekendmaken en zeggen: Koop het in tegenwoordigheid van de inwoners en in tegenwoordigheid van de oudsten van mijn volk; als u het zult lossen, los het; en als men het niet zou lossen, verklaar het mij, zodat ik het weet; want er is niemand behalve u die het kan lossen, en ik na u. Toen zei hij: Ik zal het lossen.", "Ruth 4:3-10": "Toen zei hij tegen die losser: Het stuk land dat van onze broeder Elimelech was, heeft Naomi, die uit het land van de Moabieten teruggekomen is, verkocht. En ik heb gezegd: Ik zal het voor uw oor bekendmaken en zeggen: Koop het in tegenwoordigheid van de inwoners en in tegenwoordigheid van de oudsten van mijn volk; als u het zult lossen, los het; en als men het niet zou lossen, verklaar het mij, zodat ik het weet; want er is niemand behalve u die het kan lossen, en ik na u. Toen zei hij: Ik zal het lossen. Maar Boaz zei: Op de dag dat u het land aanvaardt van de hand van Naomi, zult u het ook aanvaarden van Ruth, de Moabitische, de vrouw van de gestorvene, om de naam van de gestorvene te doen voortbestaan over zijn erfdeel.", "Deut 22:15": "Dan zullen de vader van deze jonge dochter en haar moeder haar meenemen, en naar de oudsten van de stad brengen, bij de poort, met het bewijs van de maagdelijkheid van deze jonge vrouw.", "Rom 12:15": "Verblijd u met de blijden, en ween met de wenende.", "Ex 21:8": "Als zij niet bevalt in de ogen van haar heer, die haar tot vrouw beloofd heeft, zal hij haar laten vrijkopen; aan een vreemd volk mag hij haar niet verkopen, omdat hij trouweloos met haar gehandeld heeft.", "Gen 23:11": "Nee, mijn heer! Hoor mij; de akker geef ik u; ook de spelonk die daarin is, die geef ik u; voor de ogen van de zonen van mijn volk geef ik u die; begraaf uw dode.", "1 Kron 26:29-32": "Van de Jizharieten waren Chenanja en zijn zonen belast met het buitenwerk in Israël, als opzichters en als rechters. Van de Hebronieten was Hasabja, en zijn broers, dappere mannen, duizend zevenhonderd, over de ambten van Israël aan deze kant van de Jordaan naar het westen, over al het werk van de HEERE, en tot de dienst van de koning. Van de Hebronieten was Jeria het hoofd, van de Hebronieten naar zijn geslachten onder de families; in het veertigste jaar van het koninkrijk van David zijn er gezocht en onder hen gevonden dappere helden in Jaëzer in Gilead.", "Luk 3:33": "de zoon van Aminadab, de zoon van Aram, de zoon van Esrom, de zoon van Fares, de zoon van Juda,", "Gen 29:20": "Zo diende Jakob zeven jaar voor Rachel; en die waren in zijn ogen als enkele dagen, omdat hij haar liefhad.", "Ezra 10:8": "En ieder die niet binnen drie dagen kwam, naar de raad van de vorsten en de oudsten, al zijn bezit zou verbeurd worden; en hijzelf zou afgezonderd worden van de gemeente van de weggevoerden.", "Gen 47:12": "En Jozef verzorgde zijn vader en zijn broers en het hele huis van zijn vader met brood, tot aan de kleinste kinderen toe.", "Gen 23:3-20": "Daarna stond Abraham op van bij zijn dode, en hij sprak tot de zonen van Heth en zei: Ik ben een vreemdeling en inwoner bij u; geef mij een eigen graf bij u, zodat ik mijn dode van voor mijn aangezicht kan begraven. En de zonen van Heth antwoordden Abraham en zeiden tegen hem:", "Joz 20:4": "Als hij vlucht naar één van die steden, dan zal hij staan aan de deur van de stadspoort, en hij zal zijn woorden spreken voor de oren van de oudsten van die stad; dan zullen zij hem bij zich in de stad opnemen, en hem een plaats geven, zodat hij bij hen kan wonen.", "Ruth 1:2": "De naam van deze man was Elimelech, en de naam van zijn vrouw Naomi, en de naam van zijn twee zonen Machlon en Chiljon, Efrathieten, uit Bethlehem-juda; en zij kwamen in de velden van Moab, en bleven daar.", "Luk 3:31": "de zoon van Meleas, de zoon van Mainan, de zoon van Mattatha, de zoon van Nathan, de zoon van David,", "2 Sam 15:2": "Ook stond Absalom 's morgens vroeg op, en ging staan aan de kant van de weg naar de poort. En het gebeurde dat Absalom iedere man die een geschil had en naar de koning wilde komen voor een rechtszaak, tot zich riep en zei: Uit welke stad bent u? Als hij dan zei: Uw knecht is uit een van de stammen van Israël,", "Hand 5:17-21": "En de hogepriester stond op, en allen die met hem waren (dat was de sekte van de Sadduceeën), en werden vervuld met nijd; en zij sloegen hun handen aan de apostelen, en zetten hen in de gemeenschappelijke gevangenis. Maar de engel van de Heere opende 's nachts de deuren van de gevangenis en leidde hen naar buiten, en zei:", "Deut 25:7-9": "Maar als die man geen zin heeft om de vrouw van zijn broer te nemen, dan zal de vrouw van zijn broer naar de poort gaan, naar de oudsten, en zeggen: Mijn zwager weigert voor zijn broer een naam te doen voortbestaan in Israël; hij wil de plicht van een zwager niet aan mij vervullen. Dan zullen de oudsten van zijn stad hem roepen, en met hem spreken; blijft hij dan daarbij staan en zegt: Ik heb geen zin haar te nemen; dan zal de vrouw van zijn broer voor de ogen van de oudsten tot hem toetreden, en zijn schoen van zijn voet uittrekken, en in zijn gezicht spugen, en verklaren en zeggen: Zo zal met die man gedaan worden, die het huis van zijn broer niet wil opbouwen.", "Jes 48:19": "Ook zou uw nageslacht geweest zijn als het zand, en die uit uw ingewanden voortkomen als de steentjes ervan; wiens naam niet zou worden afgehouwen, noch verdelgd van voor Mijn aangezicht.", "Ps 132:6": "Zie, wij hebben van haar gehoord in Efratha; wij hebben haar gevonden in de velden van Jaar.", "1 Sam 2:5": "Zij die verzadigd waren, hebben zich verhuurd om brood, en zij die hongerig waren, hebben opgehouden; totdat de onvruchtbare zeven heeft gebaard, en zij die veel kinderen had, krachteloos is geworden.", "1 Sam 16:1": "Toen zei de HEERE tegen Samuël: Hoe lang draagt u leed om Saul, die Ik toch verworpen heb, dat hij geen koning meer zal zijn over Israël? Vul uw hoorn met olie, en ga op weg; Ik zal u zenden naar Isaï, de Bethlehemiet; want Ik heb Mij een koning uitgekozen onder zijn zonen.", "2 Kron 19:8-11": "Daarbij stelde Josafat ook in Jeruzalem enigen aan van de Levieten, en van de priesters, en van de hoofden van de vaderen van Israël, over het recht van de HEERE en over rechtsgeschillen, toen zij naar Jeruzalem waren teruggekomen. En hij gaf hun bevel en zei: Doe zo in de vreze van de HEERE, met trouw en met een volkomen hart. En bij elk geschil dat van uw broeders die in hun steden wonen tot u zal komen, tussen bloed en bloed, tussen wet en gebod, en inzettingen en rechten, waarschuw hen dan, dat zij niet schuldig worden aan de HEERE, en er grote toorn over u en over uw broeders komt; doe zo, en u zult niet schuldig worden.", "Gen 4:25": "En Adam had opnieuw gemeenschap met zijn vrouw, en zij baarde een zoon, en zij noemde zijn naam Seth; want God heeft mij, zei zij, een ander nageslacht gegeven in de plaats van Abel; want Kaïn heeft hem doodgeslagen.", "Job 31:21": "Als ik mijn hand tegen de wees bewogen heb, omdat ik in de poort mijn hulp zag;", "Spr 13:10": "Door hoogmoed maakt men niet dan gekijf; maar bij hen die zich laten raden is wijsheid.", "Deut 25:9": "dan zal de vrouw van zijn broer voor de ogen van de oudsten tot hem toetreden, en zijn schoen van zijn voet uittrekken, en in zijn gezicht spugen, en verklaren en zeggen: Zo zal met die man gedaan worden, die het huis van zijn broer niet wil opbouwen.", "Num 26:20-22": "Zo waren de zonen van Juda naar hun geslachten: van Sela het geslacht der Selanieten; van Perez het geslacht der Perezieten; van Zerah het geslacht der Zerahieten. En de zonen van Perez waren: van Hezron het geslacht der Hezronieten; van Hamul het geslacht der Hamulieten. Dat zijn de geslachten van Juda, naar hun getelden: zesenzeventigduizend vijfhonderd.", "Ex 22:16": "Wanneer iemand een maagd verleidt die nog niet ondertrouwd is, en hij slaapt met haar, dan moet hij zonder uitstel een bruidsprijs voor haar betalen, zodat zij zijn vrouw wordt.", "Richt 11:5-11": "Toen nu de kinderen van Ammon tegen Israël streden, gingen de oudsten van Gilead heen om Jeftha te halen uit het land van Tob. En zij zeiden tegen Jeftha: Kom, en word onze aanvoerder, zodat wij kunnen strijden tegen de kinderen van Ammon. Maar Jeftha zei tegen de oudsten van Gilead: Hebt u mij niet gehaat, en mij uit het huis van mijn vader verstoten? Waarom bent u dan nu naar mij toegekomen, nu u in benauwdheid verkeert?", "1 Kron 2:3-15": "De kinderen van Juda zijn: Er, en Onan, en Sela; drie zijn hem geboren van de dochter van Sua, de Kanaänietische; en Er, de eerstgeborene van Juda, was slecht in de ogen van de HEERE; daarom doodde Hij hem. Maar Thamar, zijn schoondochter, baarde hem Perez en Zerah. Al de zonen van Juda waren vijf. De kinderen van Perez waren Hezron en Hamul.", "Gen 17:16": "Want Ik zal haar zegenen, en u ook uit haar een zoon geven; ja, Ik zal haar zegenen, zodat zij tot volken wordt: koningen van volken zullen uit haar voortkomen!", "Micha 5:1": "En u, Bethlehem Efratha, bent u klein om te zijn onder de duizenden van Juda? Uit u zal Mij Iemand voortkomen, Die een Heerser zal zijn in Israël, en Wiens uitgangen zijn van oudsher, van de dagen van de eeuwigheid.", "Zach 8:16": "Dit zijn de dingen die u doen zult: spreek de waarheid, ieder met zijn naaste; oordeel de waarheid en een oordeel van vrede in uw poorten.", "Hebr 13:4": "Het huwelijk is eerbaar onder allen, en het huwelijksbed onbevlekt; maar hoereerders en overspelers zal God oordelen.", "Jes 8:1-3": "Verder zei de HEERE tegen mij: Neem u een grote rol, en schrijf daarop met een gewone schrijfstift: Haastende tot de roof, is hij spoedig tot de buit! Toen nam ik mij betrouwbare getuigen, Uria, de priester, en Zacharia, de zoon van Jeberechja. En ik was tot de profetes genaderd, die werd zwanger en baarde een zoon; en de HEERE zei tegen mij: Noem zijn naam Maher-Schalal, Chazbaz.", "Ruth 2:1": "Naomi had een bloedverwant van haar man, een man, machtig van vermogen, uit het geslacht van Elimelech; en zijn naam was Boaz.", "1 Sam 16:4": "Samuël deed toen wat de HEERE gesproken had, en hij kwam in Bethlehem. Toen kwamen de oudsten van de stad hem bevend tegemoet, en zeiden: Komt u met vrede?", "Ps 34:17": "Pe. Het aangezicht van de HEERE is tegen hen die kwaad doen, om hun gedachtenis van de aarde uit te roeien.", "Ps 103:2": "Loof de HEERE, mijn ziel, en vergeet geen van Zijn weldaden;", "Jes 11:1-4": "Want er zal een Rijsje voortkomen uit de afgehouwen tronk van Isaï, en een Scheut uit zijn wortels zal vrucht voortbrengen. En op Hem zal de Geest van de HEERE rusten, de Geest van wijsheid en van verstand, de Geest van raad en van sterkte, de Geest van kennis en van vreze van de HEERE. En Zijn vreugde zal zijn in de vreze van de HEERE; en Hij zal niet oordelen naar wat Zijn ogen zien, en niet bestraffen naar wat Zijn oren horen.", "Neh 3:18": "Na hem verbeterden hun broeders, Bavai, de zoon van Henadad, de leider van het andere halve deel van Kehila.", "Gen 45:11": "En ik zal u daar onderhouden; want er zullen nog vijf jaren van de honger zijn, opdat u niet verarmt, u en uw huis, en alles wat u hebt!", "Gen 46:12": "En de zonen van Juda: Er, en Onan, en Sela, en Perez, en Zerah. Maar Er en Onan waren gestorven in het land Kanaän; en de zonen van Perez waren Hezron en Hamul.", "2 Tess 1:3": "Wij moeten God altijd danken over u, broeders, zoals het behoort, omdat uw geloof zeer meer wordt, en de liefde van elk van u allen jegens elkaar overvloedig wordt;", "Num 36:6-9": "Dit is het woord dat de HEERE geboden heeft over de dochters van Zelafead: Laat hen trouwen met wie in hun ogen goed is; alleen moeten zij trouwen met iemand uit het geslacht van de stam van hun vader. Zo zal de erfenis van de kinderen van Israël niet overgaan van stam naar stam; want de kinderen van Israël zullen vasthouden, ieder aan de erfenis van de stam van zijn vaderen. Verder zal elke dochter die een erfenis erft, van de stammen van de kinderen van Israël, de vrouw worden van iemand uit het geslacht van de stam van haar vader; opdat de kinderen van Israël erfelijk bezitten, ieder de erfenis van zijn vaderen.", "Mark 14:53": "En zij leidden Jezus weg naar de hogepriester; en bij hem kwamen alle overpriesters, en de oudsten, en de Schriftgeleerden bijeen.", "1 Kron 2:9": "En de kinderen van Hezron, die hem geboren zijn, waren Jerahmeel, en Ram, en Chelubai.", "Jes 55:1": "O, alle dorstigen, kom tot de wateren, en u die geen geld heeft, kom, koop en eet, ja kom, koop zonder geld en zonder prijs, wijn en melk!", "Jes 8:3": "En ik was tot de profetes genaderd, die werd zwanger en baarde een zoon; en de HEERE zei tegen mij: Noem zijn naam Maher-Schalal, Chazbaz.", "Ruth 3:10-13": "En hij zei: Gezegend bent u door de HEERE, mijn dochter! U hebt deze laatste blijk van uw goedheid beter gemaakt dan de eerste, omdat u geen jonge mannen bent nagegaan, hetzij arm of rijk. En nu, mijn dochter, wees niet bang; alles wat u gezegd hebt, zal ik voor u doen; want de hele stad van mijn volk weet dat u een deugdzame vrouw bent. Nu dan, het is waar dat ik een losser ben; maar er is nog een losser, die nader is dan ik.", "Matt 1:5": "en Salmon verwekte Boaz bij Rachab, en Boaz verwekte Obed bij Ruth, en Obed verwekte Isaï;", "Ruth 1:11-18": "Maar Naomi zei: Keer terug, mijn dochters! Waarom zouden jullie met mij meegaan? Heb ik nog zonen in mijn schoot, die jullie tot mannen zouden kunnen zijn? Keer terug, mijn dochters! Ga heen; want ik ben te oud om een man te hebben. Al zou ik zeggen: Ik heb hoop, ook al zou ik vannacht een man hebben, en ook zonen baren, zouden jullie daarop wachten totdat ze groot geworden zijn? Zouden jullie je daarvoor onthouden van een man te nemen? Nee, mijn dochters! Want het is voor mij veel bitterder dan voor u; want de hand van de HEERE is tegen mij uitgegaan.", "Gen 21:25-30": "En Abraham berispte Abimelech vanwege een waterput, die Abimelechs knechten met geweld hadden afgenomen. Toen zei Abimelech: Ik heb niet geweten wie dit gedaan heeft; en u hebt het mij ook niet verteld, en ik heb er ook niet van gehoord, dan vandaag. En Abraham nam schapen en runderen, en gaf die aan Abimelech; en zij beiden sloten een verbond.", "1 Sam 11:3": "Toen zeiden de oudsten van Jabes tegen hem: Geef ons zeven dagen de tijd, zodat wij boden kunnen sturen naar alle grensgebieden van Israël; is er dan niemand die ons verlost, dan zullen wij naar u uitgaan.", "Hand 6:12": "En zij hitsten het volk op, en de oudsten en de schriftgeleerden; en zij overvielen hem, grepen hem, en brachten hem voor de Raad;", "Rom 12:17": "Vergeld niemand kwaad voor kwaad. Zorg voor wat eerlijk is voor alle mensen.", "Hos 12:13": "Jakob vluchtte toch naar het veld van Syrië, en Israël diende om een vrouw, en hoedde de kudde om een vrouw.", "Luk 3:32": "de zoon van Isaï, de zoon van Obed, de zoon van Boaz, de zoon van Salmon, de zoon van Nahasson,", "Zach 13:2": "En het zal op die dag gebeuren, spreekt de HEERE van de heerscharen, dat Ik de namen van de afgoden uit het land zal uitroeien, zodat er niet meer aan gedacht wordt; en ook de profeten en de onreine geest zal Ik uit het land wegdoen.", "Gen 23:17": "Zo werd de akker van Efron, die in Machpela was, tegenover Mamre lag, de akker en de spelonk die daarin was, en al het geboomte dat op de akker stond, dat rondom in zijn hele gebied lag, aan Abraham toegewezen,", "Ruth 1:3": "En Elimelech, de man van Naomi, stierf; maar zij bleef achter met haar twee zonen.", "Ex 22:17": "Als haar vader hardnekkig weigert haar aan hem te geven, dan moet hij geld betalen overeenkomstig de bruidsprijs voor maagden.", "Hand 5:38-41": "En nu zeg ik u: Houd u afzijdig van deze mensen, en laat hen gaan; want als deze raad of dit werk uit mensen is, zal het gebroken worden; maar als het uit God is, dan kunt u dat niet breken; anders zou u misschien bevonden worden ook tegen God te strijden. En zij gaven hem gehoor; en toen zij de apostelen bij zich geroepen hadden, geselden zij hen, en geboden hun dat zij niet zouden spreken in de Naam van Jezus; en lieten hen gaan.", "Fil 4:8": "Verder, broeders, alles wat waar is, alles wat eerbaar is, alles wat rechtvaardig is, alles wat rein is, alles wat lieflijk is, alles wat goed klinkt, als er enige deugd is, en als er enige lof is, denk daaraan;", "Gen 23:18": "Tot een bezitting, voor de ogen van de zonen van Heth, bij allen die de poort van zijn stad binnengingen.", "Gen 29:32-35": "En Lea werd zwanger, en baarde een zoon, en zij noemde zijn naam Ruben; want zij zei: Zeker, de HEERE heeft mijn verdrukking aangezien; daarom zal mijn man mij nu liefhebben. En zij werd opnieuw zwanger, en baarde een zoon, en zei: Omdat de HEERE gehoord heeft dat ik gehaat was, heeft Hij mij ook deze gegeven; en zij noemde zijn naam Simeon. En zij werd nog zwanger, en baarde een zoon, en zei: Nu zal mijn man zich ditmaal aan mij hechten, omdat ik hem drie zonen gebaard heb; daarom noemde zij zijn naam Levi.", "Ps 103:1": "Een psalm van David. Loof de HEERE, mijn ziel, en al wat binnen in mij is, Zijn heilige Naam.", "Zach 2:6": "Hoi, hoi, vlucht toch uit het Noorderland, spreekt de HEERE; want Ik heb u uitgebreid naar de vier winden van de hemel, spreekt de HEERE.", "1 Sam 30:26": "Toen David in Ziklag kwam, zond hij van de buit naar de oudsten van Juda, zijn vrienden, en zei: Zie, hier is een geschenk voor u, van de buit van de vijanden van de HEERE.", "Ruth 4:18-22": "Dit nu zijn de geboorten van Perez: Perez verwekte Hezron; En Hezron verwekte Ram; en Ram verwekte Amminadab; En Amminadab verwekte Nahesson; en Nahesson verwekte Salma;", "Gen 38:29": "Maar het gebeurde, toen hij zijn hand terugtrok, zie, dat zijn broer naar buiten kwam; en zij zei: Hoe bent u doorgebroken? Op u komt de breuk! En men noemde hem Perez.", "Matt 2:6": "En u, Bethlehem, land van Juda! U bent geenszins de minste onder de vorsten van Juda; want uit u zal de Leidsman voortkomen, Die Mijn volk Israël weiden zal.", "Deut 25:7": "Maar als die man geen zin heeft om de vrouw van zijn broer te nemen, dan zal de vrouw van zijn broer naar de poort gaan, naar de oudsten, en zeggen: Mijn zwager weigert voor zijn broer een naam te doen voortbestaan in Israël; hij wil de plicht van een zwager niet aan mij vervullen.", "Ruth 4:1-12": "Boaz ging naar de poort en zette zich daar neer. En zie, de losser, van wie Boaz gesproken had, kwam voorbij. Toen zei hij: Kom eens hier, zet u hier neer, u daar! En hij kwam erbij en zette zich neer. En hij nam tien mannen van de oudsten van de stad en zei: Zet u hier neer; en zij zetten zich neer. Toen zei hij tegen die losser: Het stuk land dat van onze broeder Elimelech was, heeft Naomi, die uit het land van de Moabieten teruggekomen is, verkocht.", "Mal 2:14": "U zegt nu: Waarom? Omdat de HEERE een Getuige geweest is tussen u en de vrouw van uw jeugd, met wie u trouweloos handelt; terwijl zij toch uw metgezellin is, en de vrouw van uw verbond.", "Matt 1:3": "en Juda verwekte Fares en Zara bij Thamar; en Fares verwekte Esrom, en Esrom verwekte Aram;", "Gen 30:2": "Toen ontstak Jakobs toorn tegen Rachel, en hij zei: Ben ik dan in de plaats van God, Die de vrucht van uw buik van u geweerd heeft?", "Luk 22:50-71": "En één van hen sloeg de dienstknecht van de hogepriester, en hakte hem zijn rechteroor af. En Jezus antwoordde en zei: Laat het hierbij; en Hij raakte zijn oor aan en genas hem. En Jezus zei tegen de overpriesters, en de hoofdmannen van de tempel, en de oudsten, die tegen Hem gekomen waren: Bent u uitgegaan met zwaarden en stokken alsof tegen een rover?", "Lev 25:25-29": "Wanneer uw broeder verarmd zal zijn, en iets van zijn bezitting verkocht zal hebben, dan zal zijn losser, die hem het naast bestaat, komen, en zal het verkochte van zijn broeder lossen. En wanneer iemand geen losser zal hebben, maar zijn hand het bekomen heeft en hij gevonden zal hebben, zoveel als genoeg is tot zijn lossing; Dan zal hij de jaren van zijn verkoop berekenen, en het overschot zal hij uitkeren aan de man aan wie hij het verkocht had; en hij zal terugkeren tot zijn bezitting.", "1 Kron 4:1": "De kinderen van Juda waren Perez, Hezron en Charmi, en Hur, en Sobal.", "Klaagl 5:14": "De oudsten houden op met zitten in de poort, de jongemannen met hun snarenspel.", "1 Tess 2:7": "maar wij zijn vriendelijk geweest in uw midden, zoals een voedster haar kinderen koestert;", "Jer 32:7-9": "Zie, Hanameel, de zoon van Sallum, uw oom, zal naar u toe komen en zeggen: Koop voor uzelf mijn veld dat bij Anathoth is, want u hebt het recht van lossing, om het te kopen. Zo kwam Hanameel, de zoon van mijn oom, naar het woord van de HEERE, tot mij, in het voorhof van de bewaking, en zei tegen mij: Koop toch mijn veld, dat bij Anathoth is, dat in het land van Benjamin is; want u hebt het erfrecht, en u hebt de lossing, koop het voor uzelf. Toen merkte ik dat het woord van de HEERE was. Dus kocht ik van Hanameel, de zoon van mijn oom, het veld dat bij Anathoth is; en ik woog hem het geld toe, zeventien zilveren sikkels.", "Ps 127:3-5": "Zie, de kinderen zijn een erfdeel van de HEERE; de vrucht van de buik is een beloning. Zoals de pijlen zijn in de hand van een held, zo zijn de zonen van de jeugd. Gelukkig is de man die zijn pijlkoker ermee gevuld heeft; zij zullen niet beschaamd worden als zij met de vijanden spreken zullen in de poort.", "Ezra 10:14": "Laat toch onze leiders namens de hele gemeente hierover aangesteld worden, en laat allen die in onze steden vreemde vrouwen bij zich hebben laten wonen, op vastgestelde tijden komen, en met hen de oudsten van elke stad en de rechters daarvan; totdat wij van ons afwenden de gloed van de toorn van onze God, vanwege deze zaak.", "Deut 21:15-17": "Wanneer een man twee vrouwen heeft, een geliefde en een gehate, en de geliefde en de gehate hem zonen gebaard hebben, en de eerstgeboren zoon van de gehate is; Dan zal het gebeuren, op de dag dat hij zijn zonen laat erven wat hij heeft, dat hij niet het eerstgeboorterecht mag geven aan de zoon van de geliefde, ten koste van de zoon van de gehate, die de eerstgeborene is. Maar de eerstgeborene, de zoon van de gehate, zal hij erkennen, door hem het dubbele deel te geven van alles wat bij hem gevonden wordt; want hij is het begin van zijn kracht, het recht van de eerstgeboorte komt hem toe.", "Deut 17:5": "Dan moet u die man of die vrouw, die dit boze stuk gedaan hebben, naar uw poorten brengen, die man of die vrouw, zeg ik, en u moet hen met stenen stenigen, totdat zij sterven.", "Gen 38:8": "Toen zei Juda tegen Onan: Ga naar de vrouw van uw broer, en trouw met haar volgens het zwagerrecht, en verwek voor uw broer nageslacht.", "Deut 17:9": "En u moet komen bij de Levitische priesters en bij de rechter die er in die dagen is; en u moet vragen, en zij zullen u de rechterlijke uitspraak bekendmaken.", "Hand 5:25-28": "En er kwam iemand, en berichtte hun, en zei: Zie, de mannen die u in de gevangenis gezet hebt, staan in de tempel, en leren het volk. Toen ging de hoofdman heen, met de dienaren, en bracht hen, doch niet met geweld (want zij vreesden het volk, dat zij niet gestenigd zouden worden). En toen zij hen gebracht hadden, stelden zij hen voor de raad; en de hogepriester vroeg hun, en zei:", "Ps 112:5": "Teth. Goed gaat het die man, die zich ontfermt en uitleent; Jod. hij regelt zijn zaken met recht.", "Ex 18:21": "Doch zoek u onder al het volk uit naar bekwame mannen, die God vrezen, betrouwbare mannen, die hebzucht haten; stel hen aan over hen als leiders over duizend, leiders over honderd, leiders over vijftig, en leiders over tien.", "Spr 18:22": "Wie een vrouw gevonden heeft, heeft iets goeds gevonden, en hij heeft welgevallen verkregen van de HEERE.", "Gen 46:8-27": "En dit zijn de namen van de zonen van Israël die naar Egypte kwamen: Jakob en zijn zonen. De eerstgeborene van Jakob: Ruben. En de zonen van Ruben: Hanoch, en Pallu, en Hezron, en Karmi. En de zonen van Simeon: Jemuël, en Jamin, en Ohad, en Jachin, en Zohar, en Saul, de zoon van een Kanaänitische vrouw.", "1 Sam 1:8": "Toen zei Elkana, haar man: Hanna, waarom weent u, en waarom eet u niet, en waarom is uw hart bedroefd? Ben ik u niet beter dan tien zonen?", "Ruth 3:12": "Nu dan, het is waar dat ik een losser ben; maar er is nog een losser, die nader is dan ik.", "Deut 25:6": "En het zal gebeuren, dat de eerstgeborene die zij baart, de naam van zijn overleden broer zal dragen; opdat zijn naam niet uitgewist wordt uit Israël.", "Ruth 2:2": "En Ruth, de Moabitische, zei tegen Naomi: Laat mij toch naar het veld gaan, en aren oplezen achter hem in wiens ogen ik genade zal vinden. En zij zei tegen haar: Ga, mijn dochter!", "1 Sam 16:11": "Vervolgens zei Samuël tegen Isaï: Zijn dit al de jongens? En hij zei: De jongste is nog over, en zie, hij weidt de schapen. Samuël zei toen tegen Isaï: Stuur iemand en laat hem halen; want wij zullen niet aan tafel gaan totdat hij hier gekomen is.", "Matt 26:54-71": "Hoe zouden dan de Schriften vervuld worden, die zeggen dat het zo moet gebeuren? Op datzelfde moment zei Jezus tegen de menigten: Bent u uitgegaan als tegen een rover, met zwaarden en stokken, om Mij te vangen? Dagelijks zat Ik bij u, terwijl Ik leerde in de tempel, en u hebt Mij niet gegrepen; maar dit alles is gebeurd, opdat de Schriften van de profeten vervuld zouden worden. Toen vluchtten alle discipelen en lieten Hem in de steek.", "Gen 29:35": "En zij werd opnieuw zwanger, en baarde een zoon, en zei: Ditmaal zal ik de HEERE loven; daarom noemde zij zijn naam Juda. En zij hield op met baren.", "1 Tess 5:18": "Dank God in alles; want dit is de wil van God in Christus Jezus over u.", "Ef 5:25": "Mannen, heb uw eigen vrouwen lief, zoals ook Christus de Gemeente liefgehad heeft, en Zichzelf voor haar heeft overgegeven,", "Gen 29:31": "Toen de HEERE nu zag dat Lea gehaat was, opende Hij haar baarmoeder; maar Rachel was onvruchtbaar.", "Gen 12:2": "En Ik zal u tot een groot volk maken, en u zegenen, en uw naam groot maken; en wees een zegen!", "Gen 30:22-24": "God dacht ook aan Rachel; en God verhoorde haar, en opende haar baarmoeder. En zij werd zwanger, en baarde een zoon; en zij zei: God heeft mijn smaad weggenomen! En zij noemde zijn naam Jozef, en zei: De HEERE voegt mij nog een andere zoon toe.", "Gen 30:1-24": "Toen Rachel zag dat zij Jakob geen kinderen gaf, benijdde Rachel haar zuster; en zij zei tegen Jakob: Geef mij kinderen! Anders ben ik dood. Toen ontstak Jakobs toorn tegen Rachel, en hij zei: Ben ik dan in de plaats van God, Die de vrucht van uw buik van u geweerd heeft? En zij zei: Zie, daar is mijn dienstmaagd Bilha, ga bij haar; dat zij op mijn knieën baart, en ik ook uit haar gebouwd word.", "Gen 33:5": "Daarna sloeg hij zijn ogen op en zag die vrouwen en die kinderen, en zei: Wie zijn dit bij u? En hij zei: De kinderen die God aan uw knecht genadig gegeven heeft.", "Deut 16:18": "Rechters en opzichters zult u voor uzelf aanstellen in al uw poorten die de HEERE, uw God, u geven zal, onder uw stammen; opdat zij het volk richten met een rechtvaardig oordeel.", "Mark 14:55-65": "En de overpriesters, en de hele Raad, zochten getuigenis tegen Jezus, om Hem te doden, en vonden het niet. Want velen getuigden vals tegen Hem, maar de getuigenissen kwamen niet overeen. En sommigen stonden op en getuigden vals tegen Hem, en zeiden:", "Ruth 1:4": "Die namen voor zich Moabitische vrouwen; de naam van de ene was Orpa, en de naam van de andere Ruth; en zij bleven daar ongeveer tien jaar.", "Job 1:21": "En hij zei: Naakt ben ik uit mijn moeders buik gekomen, en naakt zal ik daarheen terugkeren. De HEERE heeft gegeven, en de HEERE heeft genomen; de Naam van de HEERE zij geloofd!", "Gen 30:6": "Toen zei Rachel: God heeft mij recht gedaan, en heeft ook mijn stem verhoord, en heeft mij een zoon gegeven; daarom noemde zij zijn naam Dan.", "Gen 15:3": "Verder zei Abram: Zie, mij hebt U geen nageslacht gegeven, en zie, de zoon van mijn huis zal mijn erfgenaam zijn!", "2 Sam 4:4": "En Jonathan, Sauls zoon, had een zoon die aan beide voeten gewond was; hij was vijf jaar oud toen het bericht over Saul en Jonathan uit Jizreël kwam; en zijn voedster nam hem op en vluchtte; en het gebeurde, toen zij zich haastte om te vluchten, dat hij viel en kreupel werd; en zijn naam was Mefiboseth.", "Hos 3:2": "En ik kocht haar voor mij voor vijftien zilverstukken, en een homer gerst, en een halve homer gerst.", "Gen 23:16-18": "En Abraham luisterde naar Efron; en Abraham woog Efron het geld af, waarover hij gesproken had ten aanhoren van de zonen van Heth, vierhonderd sikkel van het zilver, gangbaar bij de koopman. Zo werd de akker van Efron, die in Machpela was, tegenover Mamre lag, de akker en de spelonk die daarin was, en al het geboomte dat op de akker stond, dat rondom in zijn hele gebied lag, aan Abraham toegewezen, Tot een bezitting, voor de ogen van de zonen van Heth, bij allen die de poort van zijn stad binnengingen.", "Matt 1:1-6": "Het geslachtsregister van JEZUS CHRISTUS, de Zoon van David, de zoon van Abraham. Abraham verwekte Izak, en Izak verwekte Jakob, en Jakob verwekte Juda en zijn broers; en Juda verwekte Fares en Zara bij Thamar; en Fares verwekte Esrom, en Esrom verwekte Aram;", "Spr 31:10": "Aleph. Wie zal een deugdelijke huisvrouw vinden? Want haar waarde gaat ver boven de robijnen.", "Num 1:7": "Van Juda, Nahesson, de zoon van Amminadab.", "Ps 127:3": "Zie, de kinderen zijn een erfdeel van de HEERE; de vrucht van de buik is een beloning.", "Num 36:1-8": "En de familiehoofden van het geslacht van de kinderen van Gilead, de zoon van Machir, de zoon van Manasse, uit de geslachten van de kinderen van Jozef, traden naar voren en spraken voor Mozes en voor de leiders, de familiehoofden van de kinderen van Israël. En zij zeiden: De HEERE heeft mijn heer geboden dat land door het lot aan de kinderen van Israël in erfenis te geven; en mijn heer is door de HEERE geboden de erfenis van onze broeder Zelafead te geven aan zijn dochters. Wanneer zij aan een van de zonen van de andere stammen van de kinderen van Israël tot vrouw zouden worden, dan zou hun erfenis van de erfenis van onze vaderen afgetrokken worden, en toegevoegd worden aan de erfenis van die stam waaraan zij zouden komen; zo zou van het lot van onze erfenis worden afgetrokken.", "Mark 12:19-23": "Meester, Mozes heeft ons geschreven: Als iemands broer sterft, en een vrouw achterlaat, en geen kinderen nalaat, dat zijn broer diens vrouw moet nemen en voor zijn broer nageslacht moet verwekken. Nu waren er zeven broers, en de eerste nam een vrouw, en stervend liet hij geen nageslacht na. De tweede nam haar ook, en stierf, en ook deze liet geen nageslacht na; en de derde evenzo.", "Luk 1:58": "En zij die daar rondom woonden, en haar verwanten, hoorden dat de Heere Zijn barmhartigheid overvloedig aan haar bewezen had, en zij verblijdden zich met haar.", "2 Kor 8:21": "Als mensen die zorgen voor wat eerlijk is, niet alleen voor het oog van de Heere, maar ook voor het oog van de mensen.", "Gen 24:59": "Toen lieten zij Rebekka, hun zuster, en haar voedster vertrekken, alsook de knecht van Abraham en zijn mannen.", "Jer 15:9": "Zij die zeven kinderen baarde, is zwak geworden; zij heeft haar ziel uitgeblazen, haar zon is ondergegaan, toen het nog dag was; zij is beschaamd en te schande geworden; en hun overblijfsel zal Ik aan het zwaard overgeven, voor het aangezicht van hun vijanden, spreekt de HEERE.", "Jes 60:4": "Hef uw ogen rondom op, en zie: die allen zijn samengebracht, zij komen tot u; uw zonen zullen van verre komen, en uw dochters zullen aan uw zijde grootgebracht worden.", "Deut 21:18-21": "Wanneer iemand een koppige en opstandige zoon heeft, die niet luistert naar de stem van zijn vader en de stem van zijn moeder; en zij hem gestraft hebben, en hij toch niet naar hen wil horen, Dan zullen zijn vader en zijn moeder hem grijpen, en hem brengen naar de oudsten van zijn stad, en naar de poort van zijn plaats. En zij zullen tegen de oudsten van zijn stad zeggen: Deze zoon van ons is koppig en opstandig, hij wil niet naar ons luisteren; hij is een brasser en een dronkaard.", "Luk 3:31-38": "de zoon van Meleas, de zoon van Mainan, de zoon van Mattatha, de zoon van Nathan, de zoon van David, de zoon van Isaï, de zoon van Obed, de zoon van Boaz, de zoon van Salmon, de zoon van Nahasson, de zoon van Aminadab, de zoon van Aram, de zoon van Esrom, de zoon van Fares, de zoon van Juda,", "Neh 3:12": "En aan zijn hand verbeterde Sallum, de zoon van Lohes, leider van het andere halve deel van Jeruzalem, hij en zijn dochters.", "Gen 35:16-20": "En zij reisden verder van Bethel; en er was nog een kleine afstand om tot Efrath te komen; en Rachel baarde, en zij had het zwaar bij haar bevalling. En het gebeurde, toen zij het zwaar had bij haar bevalling, dat de vroedvrouw tegen haar zei: Wees niet bang; want ook dit is een zoon voor u! En het gebeurde, toen haar ziel heenging (want zij stierf), dat zij zijn naam Ben-Oni noemde; maar zijn vader noemde hem Benjamin.", "Gal 4:1": "Maar ik zeg: zolang de erfgenaam een kind is, verschilt hij niets van een dienstknecht, hoewel hij een heer is van alles;", "Deut 22:13-21": "Wanneer een man een vrouw genomen heeft, en tot haar ingegaan is, en haar dan haat, En haar oorzaak geeft tot naspraak, en een kwade naam over haar verspreidt, en zegt: Deze vrouw heb ik genomen, en toen ik tot haar naderde, heb ik haar maagdelijkheid niet gevonden; Dan zullen de vader van deze jonge dochter en haar moeder haar meenemen, en naar de oudsten van de stad brengen, bij de poort, met het bewijs van de maagdelijkheid van deze jonge vrouw.", "Ps 128:3-6": "Uw vrouw zal zijn als een vruchtbare wijnstok aan de zijkant van uw huis; uw kinderen als olijfplanten rondom uw tafel. Zie, zo zal die man zeker gezegend worden, die de HEERE vreest. De HEERE zal u zegenen uit Sion, en u zult het goede van Jeruzalem zien al de dagen van uw leven;", "Gen 29:27": "Maak de week van deze vol; dan zullen wij u ook die geven, voor de dienst die u nog zeven andere jaren bij mij dienen zult.", "Lev 25:46": "En u zult u tot bezitters over hen stellen voor uw kinderen na u, opdat zij de bezitting erven; u zult hen voor eeuwig laten dienen; maar over uw broeders, de kinderen van Israël, ieder over zijn broeder, zult u geen heerschappij hebben met wreedheid.", "Ps 55:23": "Werp uw zorg op de HEERE, en Hij zal u onderhouden; Hij zal in eeuwigheid niet toelaten dat de rechtvaardige wankelt.", "Luk 20:28": "Meester, Mozes heeft ons geschreven: Als iemands broer sterft, die een vrouw heeft, en zonder kinderen sterft, dat zijn broer de vrouw moet nemen, en voor zijn broer nakomelingen moet verwekken.", "Gen 24:27": "en hij zei: Geloofd zij de HEERE, de God van mijn heer Abraham, Die Zijn weldadigheid en trouw niet onthouden heeft aan mijn heer; wat mij betreft, de HEERE heeft mij op deze weg geleid, naar het huis van de broers van mijn heer.", "Gen 24:60": "En zij zegenden Rebekka, en zeiden tegen haar: O, onze zuster! Word u tot duizenden miljoenen, en laat uw nageslacht de poort van hun haters bezitten!", "Ruth 4:7-11": "Nu was dit van oude tijden af een gewoonte in Israël, bij de lossing en bij de ruil, om de hele zaak te bevestigen: de man trok zijn schoen uit en gaf die aan zijn naaste; en dit was een getuigenis in Israël. Zo zei de losser tegen Boaz: Koop het voor uzelf; en hij trok zijn schoen uit. Toen zei Boaz tegen de oudsten en al het volk: U bent heden getuigen, dat ik alles gekocht heb wat van Elimelech geweest is, en alles wat van Chiljon en Machlon geweest is, van de hand van Naomi.", "Spr 31:23": "Nun. Haar man is bekend in de poorten, als hij zit met de oudsten van het land.", "Gal 4:30": "Maar wat zegt de Schrift? Werp de dienstmaagd uit en haar zoon; want de zoon van de dienstmaagd zal geenszins erven met de zoon van de vrije.", "Gen 38:11": "Toen zei Juda tegen Thamar, zijn schoondochter: Blijf weduwe in het huis van uw vader, totdat mijn zoon Sela groot wordt; want hij zei: Anders sterft misschien ook deze, net als zijn broers! Zo ging Thamar heen, en bleef in het huis van haar vader.", "Deut 21:19": "Dan zullen zijn vader en zijn moeder hem grijpen, en hem brengen naar de oudsten van zijn stad, en naar de poort van zijn plaats.", "1 Sam 1:27": "Ik bad om dit kind, en de HEERE heeft mij gegeven wat ik van Hem gebeden heb.", "Gen 38:7-11": "Maar Er, de eerstgeborene van Juda, was slecht in de ogen van de HEERE; daarom doodde de HEERE hem. Toen zei Juda tegen Onan: Ga naar de vrouw van uw broer, en trouw met haar volgens het zwagerrecht, en verwek voor uw broer nageslacht. Maar Onan wist dat dit nageslacht niet voor hem zou zijn; en het gebeurde, wanneer hij bij de vrouw van zijn broer inging, dat hij het verspilde op de grond, om zijn broer geen nageslacht te geven.", "Ruth 4:1-11": "Boaz ging naar de poort en zette zich daar neer. En zie, de losser, van wie Boaz gesproken had, kwam voorbij. Toen zei hij: Kom eens hier, zet u hier neer, u daar! En hij kwam erbij en zette zich neer. En hij nam tien mannen van de oudsten van de stad en zei: Zet u hier neer; en zij zetten zich neer. Toen zei hij tegen die losser: Het stuk land dat van onze broeder Elimelech was, heeft Naomi, die uit het land van de Moabieten teruggekomen is, verkocht.", "Job 29:7": "Toen ik uitging naar de poort door de stad, toen ik mijn stoel op de straat liet klaarzetten.", "Spr 22:22": "Beroof de arme niet, omdat hij arm is; en verbrijzel de ellendige niet in de poort.", "Num 27:8-11": "En tegen de kinderen van Israël zult u zeggen: Wanneer iemand sterft, en geen zoon heeft, dan zult u zijn erfenis op zijn dochter laten overgaan. En als hij geen dochter heeft, dan zult u zijn erfenis aan zijn broers geven. Als hij nu geen broers heeft, dan zult u zijn erfenis aan de broers van zijn vader geven.", "Mark 15:1": "En meteen, vroeg in de morgen, hielden de overpriesters samen overleg, met de oudsten en Schriftgeleerden, en de hele Raad, en nadat zij Jezus gebonden hadden, brachten zij Hem weg, en gaven Hem aan Pilatus over.", "Ruth 2:5": "Daarna zei Boaz tegen zijn knecht, die over de maaiers gezet was: Van wie is deze jonge vrouw?", "Deut 31:28": "Verzamel bij mij alle oudsten van uw stammen, en uw opzichters; opdat ik ten aanhoren van hen deze woorden spreek, en tegen hen de hemel en de aarde tot getuigen neem.", "Deut 29:10": "U staat heden allen voor het aangezicht van de HEERE, uw God: uw hoofden van uw stammen, uw oudsten, en uw opzichters, alle mannen van Israël;", "1 Sam 2:20": "En Eli zegende Elkana en zijn vrouw, en zei: De HEERE geeft u nageslacht uit deze vrouw, voor de bede die zij aan de HEERE heeft afgebeden. En zij gingen naar hun eigen plaats.", "Gen 25:6": "Maar aan de zonen van de bijvrouwen die Abraham had, gaf Abraham geschenken; en zond hen weg van zijn zoon Izak, terwijl hij nog leefde, oostwaarts naar het land van het Oosten.", "Gen 38:6-24": "Juda nam een vrouw voor Er, zijn eerstgeborene, en haar naam was Thamar. Maar Er, de eerstgeborene van Juda, was slecht in de ogen van de HEERE; daarom doodde de HEERE hem. Toen zei Juda tegen Onan: Ga naar de vrouw van uw broer, en trouw met haar volgens het zwagerrecht, en verwek voor uw broer nageslacht.", "Ps 109:15": "Laat ze voortdurend voor de HEERE zijn; en Hij roeit hun gedachtenis uit van de aarde.", "Gen 48:7": "Toen ik nu van Paddan kwam, is Rachel bij mij gestorven in het land Kanaän, op de weg, toen er nog maar een klein stuk land was om tot Efrath te komen; en ik begroef haar daar aan de weg van Efrath, dat is Bethlehem.", "1 Kron 2:15": "Ozem, de zesde, David, de zevende.", "1 Kon 21:8-14": "Zij schreef dan brieven in de naam van Achab, en verzegelde ze met zijn zegel; en zond de brieven aan de oudsten en aan de edelen, die in zijn stad waren, wonend bij Naboth. En zij schreef in die brieven: Roept een vasten uit, en zet Naboth vooraan onder het volk; En zet tegenover hem twee mannen, zonen van Belial, die tegen hem getuigen en zeggen: U hebt God en de koning gevloekt; en voer hem naar buiten, en stenig hem, dat hij sterft.", "Gen 4:1": "En Adam had gemeenschap met Eva, zijn vrouw, en zij werd zwanger en baarde Kaïn, en zei: Ik heb een man van de HEERE verkregen!", "1 Kron 2:10": "Ram nu verwekte Amminadab, en Amminadab verwekte Nahesson, de vorst van de kinderen van Juda;", "Deut 25:5-10": "Wanneer broeders samenwonen, en één van hen sterft zonder zoon, dan mag de vrouw van de gestorvene niet trouwen met een vreemde man van buiten; haar zwager zal tot haar ingaan, en haar tot vrouw nemen, en zo de plicht van een zwager aan haar vervullen. En het zal gebeuren, dat de eerstgeborene die zij baart, de naam van zijn overleden broer zal dragen; opdat zijn naam niet uitgewist wordt uit Israël. Maar als die man geen zin heeft om de vrouw van zijn broer te nemen, dan zal de vrouw van zijn broer naar de poort gaan, naar de oudsten, en zeggen: Mijn zwager weigert voor zijn broer een naam te doen voortbestaan in Israël; hij wil de plicht van een zwager niet aan mij vervullen.", "Num 26:1-65": "Het gebeurde nu na die plaag, dat de HEERE sprak tot Mozes, en tot Eleazar, de zoon van Aäron, de priester, en zei: Neem de som op van de hele vergadering van de kinderen van Israël, van twintig jaar oud en daarboven, naar het huis van hun vaderen, ieder die in Israël voor het leger uittrekt. Mozes dan en Eleazar, de priester, spraken hen aan, in de vlakke velden van Moab, aan de Jordaan bij Jericho, en zeiden:", "Amos 5:10-12": "Zij haten in de poort hem die bestraft, en verafschuwen hem die oprecht spreekt. Daarom, omdat u de arme vertreedt en een last koren van hem neemt, hebt u wel huizen gebouwd van gehouwen steen, maar u zult daarin niet wonen; u hebt heerlijke wijngaarden geplant, maar u zult de wijn daarvan niet drinken. Want Ik weet dat uw overtredingen talrijk, en uw zonden machtig veel zijn; zij benauwen de rechtvaardige, nemen steekpenningen aan, en verdringen de behoeftigen in de poort.", "Gen 30:23": "En zij werd zwanger, en baarde een zoon; en zij zei: God heeft mijn smaad weggenomen!", "Ruth 4:1-9": "Boaz ging naar de poort en zette zich daar neer. En zie, de losser, van wie Boaz gesproken had, kwam voorbij. Toen zei hij: Kom eens hier, zet u hier neer, u daar! En hij kwam erbij en zette zich neer. En hij nam tien mannen van de oudsten van de stad en zei: Zet u hier neer; en zij zetten zich neer. Toen zei hij tegen die losser: Het stuk land dat van onze broeder Elimelech was, heeft Naomi, die uit het land van de Moabieten teruggekomen is, verkocht.", "Ps 107:41": "Maar Hij brengt de nooddruftige uit de verdrukking in een veilig verblijf, en maakt de huisgezinnen als kudden.", "Ex 21:7-11": "Wanneer nu iemand zijn dochter verkoopt tot een dienstmeisje, zal zij niet uitgaan zoals de knechten uitgaan. Als zij niet bevalt in de ogen van haar heer, die haar tot vrouw beloofd heeft, zal hij haar laten vrijkopen; aan een vreemd volk mag hij haar niet verkopen, omdat hij trouweloos met haar gehandeld heeft. Maar als hij haar aan zijn zoon tot vrouw geeft, zal hij met haar doen naar het recht van de dochters.", "1 Kron 2:4": "Maar Thamar, zijn schoondochter, baarde hem Perez en Zerah. Al de zonen van Juda waren vijf.", "Ruth 4:17-22": "En de buurvrouwen gaven hem een naam en zeiden: Aan Naomi is een zoon geboren; en zij noemden zijn naam Obed; deze is de vader van Isaï, Davids vader. Dit nu zijn de geboorten van Perez: Perez verwekte Hezron; En Hezron verwekte Ram; en Ram verwekte Amminadab;", "1 Kron 2:11": "En Nahesson verwekte Salma, en Salma verwekte Boaz,", "Matt 1:4": "en Aram verwekte Aminadab, en Aminadab verwekte Nahasson, en Nahasson verwekte Salmon;", "Gen 23:10": "Efron nu zat in het midden van de zonen van Heth; en Efron de Hethiet antwoordde Abraham, ten aanhoren van de zonen van Heth, van allen die door de poort van zijn stad naar binnen gingen, en zei:", "Lev 27:14-33": "En wanneer iemand zijn huis geheiligd heeft, zodat het de HEERE heilig is, dan zal de priester dat schatten, naardat het goed of slecht is; zoals de priester het geschat heeft, zo zal het blijven staan. En als hij die het geheiligd heeft, zijn huis wil afkopen, dan zal hij een vijfde deel van het geld van uw schatting daarboven toevoegen, en het zal zijn eigendom zijn. Als ook iemand van de akker van zijn eigendom iets aan de HEERE heiligt, dan zal uw schatting zijn naar het zaad ervan; een homer gerstezaad zal geschat worden op vijftig sikkel zilver.", "1 Kon 21:8": "Zij schreef dan brieven in de naam van Achab, en verzegelde ze met zijn zegel; en zond de brieven aan de oudsten en aan de edelen, die in zijn stad waren, wonend bij Naboth.", "Deut 21:2-8": "Dan zullen uw oudsten en uw rechters uitgaan, en zij zullen meten naar de steden die rondom de gedode liggen. De stad nu die het dichtst bij de gedode ligt, daar zullen de oudsten van die stad een jonge koe nemen waarmee niet gewerkt is, die aan het juk niet getrokken heeft. En de oudsten van die stad zullen de jonge koe naar beneden brengen in een ruw dal, dat niet bewerkt of bezaaid is; en zij zullen deze jonge koe daar in het dal de nek doorhouwen.", "Deut 25:5": "Wanneer broeders samenwonen, en één van hen sterft zonder zoon, dan mag de vrouw van de gestorvene niet trouwen met een vreemde man van buiten; haar zwager zal tot haar ingaan, en haar tot vrouw nemen, en zo de plicht van een zwager aan haar vervullen.", "Gen 23:17-20": "Zo werd de akker van Efron, die in Machpela was, tegenover Mamre lag, de akker en de spelonk die daarin was, en al het geboomte dat op de akker stond, dat rondom in zijn hele gebied lag, aan Abraham toegewezen, Tot een bezitting, voor de ogen van de zonen van Heth, bij allen die de poort van zijn stad binnengingen. En daarna begroef Abraham zijn vrouw Sara in de spelonk van de akker van Machpela, tegenover Mamre, dat is Hebron, in het land Kanaän.", "Gal 4:2": "maar hij staat onder voogden en verzorgers, tot de tijd die de vader van tevoren heeft vastgesteld.", "Hand 7:20": "In die tijd werd Mozes geboren, en hij was buitengewoon mooi; hij werd drie maanden opgevoed in het huis van zijn vader.", "Ex 2:7": "Toen zei zijn zuster tegen de dochter van Farao: Zal ik gaan en een voedstermoeder uit de Hebreeuwse vrouwen voor u roepen, die dit kind voor u zoogt?", "2 Kon 11:2": "Maar Joseba, de dochter van koning Joram, de zuster van Ahazia, nam Joas, de zoon van Ahazia, en stal hem uit het midden van de zonen van de koning die gedood werden. Zij zette hem en zijn voedster in een slaapkamer en verborg hem voor Athalia, zodat hij niet gedood werd.", "Gen 29:18": "En Jakob had Rachel lief; en hij zei: Ik zal u zeven jaar dienen, voor Rachel, uw jongste dochter.", "Hand 5:34": "Maar een zeker Farizeeër stond op in de raad, met name Gamaliël, een leraar van de wet, in aanzien gehouden bij al het volk, en gebood dat men de apostelen een weinig naar buiten zou laten staan.", "Lev 25:25-34": "Wanneer uw broeder verarmd zal zijn, en iets van zijn bezitting verkocht zal hebben, dan zal zijn losser, die hem het naast bestaat, komen, en zal het verkochte van zijn broeder lossen. En wanneer iemand geen losser zal hebben, maar zijn hand het bekomen heeft en hij gevonden zal hebben, zoveel als genoeg is tot zijn lossing; Dan zal hij de jaren van zijn verkoop berekenen, en het overschot zal hij uitkeren aan de man aan wie hij het verkocht had; en hij zal terugkeren tot zijn bezitting.", "1 Sam 17:12": "David nu was de zoon van de Efrathitische man uit Bethlehem-Juda, wiens naam Isaï was, en die acht zonen had, en in de dagen van Saul was hij een man, oud, hoogbejaard onder de mannen.", "Ruth 3:1-8": "Naomi, haar schoonmoeder, zei tegen haar: Mijn dochter! Zou ik geen rust voor u zoeken, opdat het u goed gaat? Nu dan, is Boaz, met wiens dienstmeisjes u geweest bent, niet van onze bloedverwantschap? Zie, hij zal deze nacht gerst wannen op de dorsvloer. Was u dan, en zalf u, en trek uw kleren aan, en ga naar de dorsvloer; maar maak u aan de man niet bekend, totdat hij klaar is met eten en drinken.", "Deut 1:15-17": "Zo nam ik de hoofden van uw stammen, wijze en ervaren mannen, en stelde hen tot hoofden over u aan, leiders over duizend, en leiders over honderd, en leiders over vijftig, en leiders over tien, en opzichters voor uw stammen. En ik gebood in die tijd uw rechters, en zei: Hoor de geschillen tussen uw broeders, en oordeel rechtvaardig tussen de man en zijn broeder, en zijn vreemdeling. U zult in het gericht niemand voortrekken; u zult de kleine, evenals de grote, horen; u zult voor niemands aangezicht bang zijn; want het gericht is van God; maar de zaak die voor u te zwaar zal zijn, zult u naar mij laten komen, en ik zal die horen.", "Jes 11:1": "Want er zal een Rijsje voortkomen uit de afgehouwen tronk van Isaï, en een Scheut uit zijn wortels zal vrucht voortbrengen.", "Ps 107:38": "En Hij zegent hen, zodat zij zeer meer worden, en hun vee vermindert Hij niet.", "Gen 25:5": "Doch Abraham gaf aan Izak al wat hij had.", "Ruth 1:16-18": "Maar Ruth zei: Dring er bij mij niet op aan om u te verlaten, om van achter u terug te keren; want waar u heen zult gaan, zal ik ook heen gaan, en waar u zult overnachten, zal ik overnachten; uw volk is mijn volk, en uw God mijn God. Waar u zult sterven, zal ik sterven, en daar zal ik begraven worden; zo doe mij de HEERE en zo doe Hij daar nog aan toe, als niet de dood alléén scheiding zal maken tussen mij en u! Toen zij nu zag dat zij vast van plan was met haar mee te gaan, hield zij op tegen haar te spreken.", "Ex 2:7-9": "Toen zei zijn zuster tegen de dochter van Farao: Zal ik gaan en een voedstermoeder uit de Hebreeuwse vrouwen voor u roepen, die dit kind voor u zoogt? En de dochter van Farao zei tegen haar: Ga. En het meisje ging, en riep de moeder van het kind. Toen zei de dochter van Farao tegen haar: Neem dit kind mee, en zoog het voor mij; ik zal u uw loon geven. En de vrouw nam het kind en zoogde het.", "Ruth 4:7-17": "Nu was dit van oude tijden af een gewoonte in Israël, bij de lossing en bij de ruil, om de hele zaak te bevestigen: de man trok zijn schoen uit en gaf die aan zijn naaste; en dit was een getuigenis in Israël. Zo zei de losser tegen Boaz: Koop het voor uzelf; en hij trok zijn schoen uit. Toen zei Boaz tegen de oudsten en al het volk: U bent heden getuigen, dat ik alles gekocht heb wat van Elimelech geweest is, en alles wat van Chiljon en Machlon geweest is, van de hand van Naomi.", "Gen 30:17-20": "En God verhoorde Lea; en zij werd zwanger, en baarde Jakob de vijfde zoon. Toen zei Lea: God heeft mij mijn loon gegeven, omdat ik mijn dienstmaagd aan mijn man gegeven heb; en zij noemde zijn naam Issaschar. En Lea werd opnieuw zwanger, en zij baarde Jakob de zesde zoon.", "Lev 27:2-13": "Spreek tot de kinderen van Israël, en zeg tegen hen: Wanneer iemand een gelofte gedaan heeft om iemand af te zonderen, zullen de zielen naar uw schatting van de HEERE zijn. Als uw schatting van een man geldt, van twintig jaar oud tot iemand die zestig jaar oud is, dan zal uw schatting vijftig sikkel zilver zijn, naar de sikkel van het heiligdom. Maar is het een vrouw, dan zal uw schatting dertig sikkel zijn.", "Jer 32:25": "Evenwel hebt U tegen mij gezegd, Heere HEERE: koop voor uzelf dat veld voor geld, en laat het door getuigen bevestigen; terwijl de stad in de hand van de Chaldeeën gegeven is.", "Ex 18:26": "zij oordeelden het volk te allen tijde, de moeilijke zaak brachten zij tot Mozes, maar alle kleine zaak oordeelden zij zelf.", "Gen 17:20": "En wat Ismaël betreft, Ik heb u verhoord; zie, Ik heb hem gezegend, en zal hem vruchtbaar maken, en hem heel erg veel meer maken; twaalf vorsten zal hij voortbrengen, en Ik zal hem tot een groot volk maken;", "Neh 3:16": "Na hem verbeterde Nehemia, de zoon van Azbuk, leider van het halve deel van Beth-Zur, tot tegenover Davids graven, en tot aan de aangelegde vijver, en tot aan het huis van de helden.", "Ruth 3:11": "En nu, mijn dochter, wees niet bang; alles wat u gezegd hebt, zal ik voor u doen; want de hele stad van mijn volk weet dat u een deugdzame vrouw bent."}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H1162\">Boaz</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H5927\">ging</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H5927\">naar</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H8179\">de</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H8179\">poort</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1162\">en</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H3427\">zette</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H3427\">zich</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H8033\">daar</span> neer. <span class=\"wl\" data-l=\"L4\" data-code=\"H3427\">En</span> zie, <span class=\"wl\" data-l=\"L7\" data-code=\"H1350\">de</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H1350\">losser</span>, <span class=\"wl\" data-l=\"L7\" data-code=\"H1350\">van</span> wie <span class=\"wl\" data-l=\"L1\" data-code=\"H1162\">Boaz</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H1696\">gesproken</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H1696\">had</span>, kwam <span class=\"wl\" data-l=\"L9\" data-code=\"H5674\">voorbij</span>. Toen zei <span class=\"wl\" data-l=\"L10\" data-code=\"H559\">hij</span>: Kom eens hier, <span class=\"wl\" data-l=\"L4\" data-code=\"H3427\">zet</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H3427\">u</span> <span class=\"wl\" data-l=\"L12\" data-code=\"H6311\">hier</span> neer, <span class=\"wl\" data-l=\"L13\" data-code=\"H1945\">u</span> daar! <span class=\"wl\" data-l=\"L4\" data-code=\"H3427\">En</span> <span class=\"wl\" data-l=\"L11\" data-code=\"H5493\">hij</span> kwam erbij <span class=\"wl\" data-l=\"L6\" data-code=\"H2009\">en</span> <span class=\"wl\" e=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H1945\">Ho,</span> <span class=\"wl wl-kjv\" data-code=\"H6423\">such</span> a <span class=\"wl wl-kjv\" data-code=\"H492\">one!</span> turn <span class=\"wl wl-kjv\" data-code=\"H5493\">aside,</span> sit <span class=\"wl wl-kjv\" data-code=\"H3427\">down</span> here. And he turned <span class=\"wl wl-kjv\" data-code=\"H5493\">aside,</span> and sat down.", "2": "And he <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Sit ye <span class=\"wl wl-kjv\" data-code=\"H3427\">down</span> here. And they sat down.", "3": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1350\">kinsman,</span> <span class=\"wl wl-kjv\" data-code=\"H5281\">Naomi,</span> that is come <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> out of the <span class=\"wl wl-kjv\" data-code=\"H7704\">country</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab,</span> <span class=\"wl wl-kjv\" data-code=\"H4376\">selleth</span> a <span class=\"wl wl-kjv\" data-code=\"H2513\">parcel</span> of <span class=\"wl wl-kjv\" data-code=\"H7704\">land,</span> which was our <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> Elimelech's:", "4": "And I <span class=\"wl wl-kjv\" data-code=\"H559\">thought</span> to <span class=\"wl wl-kjv\" data-code=\"H1540\">advertise</span> thee, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H7069\">Buy</span> it before the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants,</span> and before the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of my <span class=\"wl wl-kjv\" data-code=\"H5971\">people.</span> If thou wilt <span class=\"wl wl-kjv\" data-code=\"H1350\">redeem</span> it, <span class=\"wl wl-kjv\" data-code=\"H1350\">redeem</span> it: but if thou wilt not <span class=\"wl wl-kjv\" data-code=\"H1350\">redeem</span> it, then <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> me, that I may <span class=\"wl wl-kjv\" data-code=\"H3045\">know:</span> for there is none to <span class=\"wl wl-kjv\" data-code=\"H1350\">redeem</span> it <span class=\"wl wl-kjv\" data-code=\"H2108\">beside</span> thee; and I am <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> thee. And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will redeem", "5": "Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H1162\">Boaz,</span> What <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> thou <span class=\"wl wl-kjv\" data-code=\"H7069\">buyest</span> the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> of the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H5281\">Naomi,</span> thou must <span class=\"wl wl-kjv\" data-code=\"H7069\">buy</span> it also of <span class=\"wl wl-kjv\" data-code=\"H7327\">Ruth</span> the <span class=\"wl wl-kjv\" data-code=\"H4125\">Moabitess,</span> the <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> of the <span class=\"wl wl-kjv\" data-code=\"H4191\">dead,</span> to raise <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H4191\">dead</span> upon his inheritance.", "6": "And the <span class=\"wl wl-kjv\" data-code=\"H1350\">kinsman</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I <span class=\"wl wl-kjv\" data-code=\"H3201\">cannot</span> <span class=\"wl wl-kjv\" data-code=\"H1350\">redeem</span> it for myself, lest I <span cl
