l", "2 Sam": "2-samuel", "1 Kon": "1-koningen", "2 Kon": "2-koningen", "1 Kron": "1-kronieken", "2 Kron": "2-kronieken", "Ezra": "ezra", "Neh": "nehemia", "Est": "esther", "Job": "job", "Ps": "psalmen", "Spr": "spreuken", "Pred": "prediker", "Hoogl": "hooglied", "Jes": "jesaja", "Jer": "jeremia", "Klaagl": "klaagliederen", "Ezech": "ezechiel", "Dan": "daniel", "Hos": "hosea", "Joël": "joel", "Amos": "amos", "Obadja": "obadja", "Jona": "jona", "Micha": "micha", "Nahum": "nahum", "Hab": "habakuk", "Zef": "zefanja", "Hagg": "haggai", "Zach": "zacharia", "Mal": "maleachi", "Matt": "mattheus", "Mark": "markus", "Luk": "lukas", "Joh": "johannes", "Hand": "handelingen", "Rom": "romeinen", "1 Kor": "1-korinthe", "2 Kor": "2-korinthe", "Gal": "galaten", "Ef": "efeze", "Fil": "filippenzen", "Kol": "kolossenzen", "1 Tess": "1-thessalonicenzen", "2 Tess": "2-thessalonicenzen", "1 Tim": "1-timotheus", "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "Boaz ging naar de poort en zette zich daar neer. En zie, de losser, van wie Boaz gesproken had, kwam voorbij. Toen zei hij: Kom eens hier, zet u hier neer, u daar! En hij kwam erbij en zette zich neer.", "2": "En hij nam tien mannen van de oudsten van de stad en zei: Zet u hier neer; en zij zetten zich neer.", "3": "Toen zei hij tegen die losser: Het stuk land dat van onze broeder Elimelech was, heeft Naomi, die uit het land van de Moabieten teruggekomen is, verkocht.", "4": "En ik heb gezegd: Ik zal het *voor* uw oor bekendmaken en zeggen: Koop het in tegenwoordigheid van de inwoners en in tegenwoordigheid van de oudsten van mijn volk; als u het zult lossen, los het; en als men het niet zou lossen, verklaar het mij, zodat ik het weet; want er is niemand behalve u die het kan lossen, en ik na u. Toen zei hij: Ik zal het lossen.", "5": "Maar Boaz zei: Op de dag dat u het land aanvaardt van de hand van Naomi, zult u het ook aanvaarden van Ruth, de Moabitische, de vrouw van de gestorvene, om de naam van de gestorvene te doen voortbestaan over zijn erfdeel.", "6": "Toen zei die losser: Ik zal het voor mijzelf niet kunnen lossen, want anders verderf ik mijn eigen erfdeel; los u mijn lossingsrecht voor uzelf; want ik zal het niet kunnen lossen.", "7": "Nu was dit van oude tijden af een gewoonte in Israël, bij de lossing en bij de ruil, om de hele zaak te bevestigen: de man trok zijn schoen uit en gaf die aan zijn naaste; en dit was een getuigenis in Israël.", "8": "Zo zei de losser tegen Boaz: Koop het voor uzelf; en hij trok zijn schoen uit.", "9": "Toen zei Boaz tegen de oudsten en al het volk: U bent heden getuigen, dat ik alles gekocht heb wat van Elimelech geweest is, en alles wat van Chiljon en Machlon geweest is, van de hand van Naomi.", "10": "Daarbij koop ik ook Ruth, de Moabitische, de vrouw van Machlon, tot vrouw, om de naam van de gestorvene te doen voortbestaan over zijn erfdeel, opdat de naam van de gestorvene niet wordt uitgeroeid onder zijn broeders en uit de poort van zijn woonplaats; u bent heden getuigen.", "11": "En al het volk dat in de poort was, alsook de oudsten, zeiden: Wij zijn getuigen; de HEERE make deze vrouw, die in uw huis komt, als Rachel en als Lea, die beiden het huis van Israël gebouwd hebben; en handel kloek in Efratha, en maak *uw* naam vermaard in Bethlehem!", "12": "En uw huis zij als het huis van Perez (die Thamar aan Juda baarde), door het nageslacht dat de HEERE u geven zal uit deze jonge vrouw.", "13": "Zo nam Boaz Ruth, en zij werd hem tot vrouw, en hij ging tot haar in; en de HEERE gaf haar dat zij zwanger werd en een zoon baarde.", "14": "Toen zeiden de vrouwen tegen Naomi: Geloofd zij de HEERE, Die niet heeft nagelaten u heden een losser te geven; en zijn naam worde vermaard in Israël!", "15": "Die zal u zijn tot een verkwikker van de ziel, en om uw ouderdom te onderhouden; want uw schoondochter, die u liefheeft, heeft hem gebaard, en zij is u beter dan zeven zonen.", "16": "En Naomi nam dat kind en zette het op haar schoot, en werd zijn voedster.", "17": "En de buurvrouwen gaven hem een naam en zeiden: Aan Naomi is een zoon geboren; en zij noemden zijn naam Obed; deze is de vader van Isaï, Davids vader.", "18": "Dit nu zijn de geboorten van Perez: Perez verwekte Hezron;", "19": "En Hezron verwekte Ram; en Ram verwekte Amminadab;", "20": "En Amminadab verwekte Nahesson; en Nahesson verwekte Salma;", "21": "En Salmon verwekte Boaz, en Boaz verwekte Obed;", "22": "En Obed verwekte Isaï; en Isaï verwekte David."}, "SV": {"1": "En Boaz ging op in de poort, en zette zich aldaar en ziet, de losser, van welken Boaz gesproken had, ging voorbij; zo zeide hij: Wijk herwaarts, zet u hier, gij, zulk een! En hij week derwaarts, en zette zich.", "2": "En hij nam tien mannen van de oudsten der stad, en zeide: Zet u hier; en zij zetten zich.", "3": "Toen zeide hij tot dien losser: Het stuk lands, dat van onzen broeder Elimelech was, heeft Naomi, die uit der Moabieten land wedergekomen is, verkocht;", "4": "En ik heb gezegd: Ik zal het *voor* uw oor openbaren, zeggende: Aanvaard het in tegenwoordigheid der inwoners, en in tegenwoordigheid der oudsten mijns volks; zo gij het zult lossen, los het; en zo men het ook niet zou lossen, verklaar het mij, dat ik het wete; want er is niemand, behalve gij, die het losse, en ik na u. Toen zeide hij: Ik zal het lossen.", "5": "Maar Boaz zeide: Ten dage, als gij het land aanvaardt van de hand van Naomi, zo zult gij het ook aanvaarden van Ruth, de Moabietische, de huisvrouw des verstorvenen, om den naam des verstorvenen te verwekken over zijn erfdeel.", "6": "Toen zeide die losser: Ik zal het voor mij niet kunnen lossen, opdat ik mijn erfdeel niet misschien verderve; los gij mijn lossing voor u; want ik zal niet kunnen lossen.", "7": "Nu was dit van ouds *een* *gewoonheid* in Israël, bij de lossing en bij de verwisseling, om de ganse zaak te bevestigen, zo trok de man zijn schoen uit en gaf die aan zijn naaste; en dit was tot een getuigenis in Israël.", "8": "Zo zeide de losser tot Boaz: Aanvaard gij het voor u; en hij trok zijn schoen uit.", "9": "Toen zeide Boaz tot de oudsten en al het volk: Gijlieden zijt heden getuigen, dat ik aanvaard heb alles, wat van Elimelech geweest is, en alles, wat van Chiljon en Machlon geweest is, van de hand van Naomi.", "10": "Daartoe aanvaard ik mij ook Ruth, de Moabietische, de huisvrouw van Machlon, tot een vrouw, om den naam des verstorvenen over zijn erfdeel te verwekken, opdat de naam des verstorvenen niet worde uitgeroeid van zijn broederen, en van de poort zijner plaats; gijlieden zijt heden getuigen.", "11": "En al het volk, dat in de poort was, mitsgaders de oudsten zeiden: Wij zijn getuigen; de HEERE make deze vrouw, die in uw huis komt, als Rachel en als Lea, die beiden het huis van Israël gebouwd hebben; en handel kloekelijk in Efratha, en maak *uw* naam vermaard in Bethlehem!", "12": "En uw huis zij, als het huis van Perez ( die Thamar aan Juda baarde), van het zaad, dat de HEERE u geven zal uit deze jonge vrouw.", "13": "Alzo nam Boaz Ruth, en zij werd hem ter vrouwe, en hij ging tot haar in; en de HEERE gaf haar, dat zij zwanger werd en een zoon baarde.", "14": "Toen zeiden de vrouwen tot Naomi: Geloofd zij de HEERE, Die niet heeft nagelaten u heden een losser te geven; en zijn naam worde vermaard in Israël!", "15": "Die zal u zijn tot een verkwikker der ziel, en om uw ouderdom te onderhouden; want uw schoondochter, die u liefheeft, heeft hem gebaard, dewelke u beter is dan zeven zonen.", "16": "En Naomi nam dat kind, en zette het op haar schoot, en werd zijn voedster.", "17": "En de naburinnen gaven hem een naam, zeggende: Aan Naomi is een zoon geboren; en zij noemden zijn naam Obed; deze is de vader van Isaï, Davids vader.", "18": "Dit nu zijn de geboorten van Perez: Perez gewon Hezron;", "19": "En Hezron gewon Ram; en Ram gewon Amminadab;", "20": "En Amminadab gewon Nahesson; en Nahesson gewon Salma;", "21": "En Salmon gewon Boaz, en Boaz gewon Obed;", "22": "En Obed gewon Isaï; en Isaï gewon David."}, "KJV": {"1": "Then went Boaz up to the gate, and sat him down there: and, behold, the kinsman of whom Boaz spake came by; unto whom he said, Ho, such a one! turn aside, sit down here. And he turned aside, and sat down.", "2": "And he took ten men of the elders of the city, and said, Sit ye down here. And they sat down.", "3": "And he said unto the kinsman, Naomi, that is come again out of the country of Moab, selleth a parcel of land, which *was* our brother Elimelech's:", "4": "And I thought to advertise thee, saying, Buy *it* before the inhabitants, and before the elders of my people. If thou wilt redeem *it*, redeem *it*: but if thou wilt not redeem *it, then* tell me, that I may know: for *there is* none to redeem *it* beside thee; and I *am* after thee. And he said, I will redeem", "5": "Then said Boaz, What day thou buyest the field of the hand of Naomi, thou must buy *it* also of Ruth the Moabitess, the wife of the dead, to raise up the name of the dead upon his inheritance.", "6": "And the kinsman said, I cannot redeem *it* for myself, lest I mar mine own inheritance: redeem thou my right to thyself; for I cannot redeem", "7": "Now this *was the manner* in former time in Israel concerning redeeming and concerning changing, for to confirm all things; a man plucked off his shoe, and gave *it* to his neighbour: and this *was* a testimony in Israel.", "8": "Therefore the kinsman said unto Boaz, Buy *it* for thee. So he drew off his shoe.", "9": "And Boaz said unto the elders, and *unto* all the people, Ye *are* witnesses this day, that I have bought all that *was* Elimelech's, and all that *was* Chilion's and Mahlon's, of the hand of Naomi.", "10": "Moreover Ruth the Moabitess, the wife of Mahlon, have I purchased to be my wife, to raise up the name of the dead upon his inheritance, that the name of the dead be not cut off from among his brethren, and from the gate of his place: ye *are* witnesses this day.", "11": "And all the people that *were* in the gate, and the elders, said, *We are* witnesses. The LORD make the woman that is come into thine house like Rachel and like Leah, which two did build the house of Israel: and do thou worthily in Ephratah, and be famous in Bethlehem:", "12": "And let thy house be like the house of Pharez, whom Tamar bare unto Judah, of the seed which the LORD shall give thee of this young woman.", "13": "So Boaz took Ruth, and she was his wife: and when he went in unto her, the LORD gave her conception, and she bare a son.", "14": "And the women said unto Naomi, Blessed *be* the LORD, which hath not left thee this day without a kinsman, that his name may be famous in Israel.", "15": "And he shall be unto thee a restorer of *thy* life, and a nourisher of thine old age: for thy daughter in law, which loveth thee, which is better to thee than seven sons, hath born", "16": "And Naomi took the child, and laid it in her bosom, and became nurse", "17": "And the women her neighbours gave it a name, saying, There is a son born to Naomi; and they called his name Obed: he *is* the father of Jesse, the father of David.", "18": "Now these *are* the generations of Pharez: Pharez begat Hezron,", "19": "And Hezron begat Ram, and Ram begat Amminadab,", "20": "And Amminadab begat Nahshon, and Nahshon begat Salmon,", "21": "And Salmon begat Boaz, and Boaz begat Obed,", "22": "And Obed begat Jesse, and Jesse begat David."}}, "tsk": {"1": [{"kopje": "naar de poort", "refs": ["Deut 16:18", "Deut 17:5", "Deut 21:19", "Deut 25:7", "Job 29:7", "Job 31:21", "Amos 5:10-12", "Amos 5:15"]}, {"kopje": "de losser", "refs": ["Ruth 3:12"]}, {"kopje": "u daar", "refs": ["Jes 55:1", "Zach 2:6"]}], "2": [{"kopje": "de oudsten", "refs": ["Ex 18:21", "Ex 18:22", "Ex 21:8", "Deut 29:10", "Deut 31:28"
