ood eet? En hij zei tegen haar: Omdat ik tot Naboth, de Jizreëliet, gesproken heb en tegen hem gezegd heb: Geef mij uw wijngaard voor geld, of, als het u zint, zal ik u een andere wijngaard in zijn plaats geven; maar hij heeft gezegd: Ik zal u mijn wijngaard niet geven. Toen zei Izebel, zijn vrouw, tegen hem: Regeert u nu het koninkrijk over Israël? Sta op, eet brood, en laat uw hart vrolijk zijn; ik zal u de wijngaard van Naboth, de Jizreëliet, geven.","1 Sam 24:4":"En hij kwam bij de schaapskooien aan de weg, waar een spelonk was; en Saul ging daarin, om zijn voeten te bedekken. David nu en zijn mannen zaten aan de zijkanten van de spelonk.","Job 33:14-16":"Maar God spreekt eens of tweemaal; doch men let daar niet op. In de droom, door het gezicht 's nachts, als een diepe slaap op de mensen valt, in de sluimering op het leger; Dan openbaart Hij het voor het oor der mensen, en Hij verzegelt hun kastijding;","1 Kon 18:13":"Is mijn heer niet verteld wat ik gedaan heb, toen Izebel de profeten van de HEERE doodde? Dat ik van de profeten van de HEERE honderd man heb verborgen, elk vijftig man in een grot, en hen met brood en water heb onderhouden?","Ps 97:9":"Want U, HEERE, bent de Allerhoogste over de hele aarde; U bent zeer hoog verheven boven alle goden.","Hos 5:11":"Efraïm is verdrukt, hij is verpletterd met recht; want hij heeft dat zo gewild; hij heeft gewandeld naar het gebod.","2 Sam 23:3":"De God van Israël heeft gezegd, de Rotssteen van Israël heeft tot mij gesproken: Er zal een Heerser zijn over de mensen, een Rechtvaardige, een Heerser in de vreze van God.","Deut 5:16":"Eer uw vader en uw moeder, zoals de HEERE, uw God, u geboden heeft, opdat uw dagen verlengd worden, en opdat het u goed gaat in het land dat de HEERE, uw God, u geven zal.","Hand 1:20":"Want er staat geschreven in het boek van de Psalmen: Zijn woonstede moet woest worden, en er mag niemand zijn die erin woont. En: Een ander moet zijn opzienersambt overnemen.","Rom 11:8":"(Zoals geschreven is: God heeft hun een geest van diepe slaap gegeven; ogen om niet te zien, en oren om niet te horen) tot op deze huidige dag.","Jes 62:3":"En u zult een sierlijke kroon zijn in de hand van de HEERE, en een koninklijke hoed in de hand van uw God.","Rom 13:9":"Want dit: u zult geen overspel doen, u zult niet doden, u zult niet stelen, u zult geen valse getuigenis geven, u zult niet begeren; en als er nog enig ander gebod is, wordt het in dit woord samengevat, namelijk in dit: u zult uw naaste liefhebben als uzelf.","2 Kor 5:18-20":"En dit alles is uit God, Die ons met Zichzelf verzoend heeft door Jezus Christus, en ons de bediening van de verzoening gegeven heeft. Want God was in Christus de wereld met Zichzelf aan het verzoenen, doordat Hij hun zonden hun niet toerekende; en Hij heeft het woord van de verzoening in ons gelegd. Zo zijn wij dan gezanten namens Christus, alsof God door ons bad; wij bidden namens Christus: laat u met God verzoenen.","1 Kor 3:20":"En opnieuw: De Heere kent de overleggingen van de wijzen, dat zij nutteloos zijn.","Jes 6:1-5":"In het jaar dat koning Uzzia stierf, zag ik de Heere zitten op een hoge en verheven troon, en Zijn zomen vulden de tempel. De serafs stonden boven Hem; ieder had zes vleugels; met twee bedekte ieder zijn gezicht, en met twee bedekte hij zijn voeten, en met twee vloog hij. En de een riep tot de ander en zei: Heilig, heilig, heilig is de HEERE van de heerscharen! De hele aarde is vol van Zijn heerlijkheid!","1 Kon 1:9":"En Adonia slachtte schapen en runderen en gemest vee bij de steen Zoheleth, die bij de bron Rogel is; en nodigde al zijn broers, de zonen van de koning, en alle mannen van Juda, de knechten van de koning.","Jes 29:13":"Want de Heere heeft gezegd: Omdat dit volk tot Mij nadert met zijn mond, en zij Mij met hun lippen eren, maar hun hart ver van Mij houden; en hun vrees, waarmee zij Mij vrezen, mensengeboden zijn, die hun geleerd zijn;","Zach 3:5":"Daarom zeg Ik: Laat ze een reine hoed op zijn hoofd zetten. En zij zetten die reine hoed op zijn hoofd, en zij trokken hem kleren aan; en de Engel van de HEERE stond daarbij.","Fil 2:11":"En elke tong zou belijden dat Jezus Christus de Heere is, tot heerlijkheid van God de Vader.","Hand 12:4-6":"hem greep hij ook en zette hem in de gevangenis, en gaf hem over aan vier wachten, elk van vier soldaten, om hem te bewaken, want hij was van plan hem na het paasfeest voor het volk te brengen. Petrus dan werd in de gevangenis bewaakt; maar door de gemeente werd voortdurend tot God voor hem gebeden. Toen Herodes hem zou voorbrengen, sliep Petrus die nacht tussen twee soldaten, gebonden met twee kettingen; en de bewakers voor de deur bewaakten de gevangenis.","1 Kon 19:1-18":"Achab vertelde Izebel alles wat Elia gedaan had, en ook dat hij alle profeten met het zwaard gedood had. Toen stuurde Izebel een bode naar Elia, om te zeggen: Zo mogen de goden mij doen, en nog erger, als ik uw leven niet morgen omstreeks deze tijd maak als het leven van één van hen. Toen hij dat zag, maakte hij zich op en ging heen om zijn leven te redden, en kwam in Berseba, dat in Juda ligt, en liet zijn knecht daar.","Jes 49:6":"Verder zei Hij: Het is te gering, dat U Mij een Knecht zou zijn, om op te richten de stammen van Jakob, en om terug te brengen de bewaarden in Israël; Ik heb U ook gegeven tot een Licht van de heidenen, om Mijn heil te zijn tot aan het einde van de aarde.","Jona 1:1":"Het woord van de HEERE gebeurde tot Jona, de zoon van Amitthai, en Hij zei:","Job 37:5":"God dondert met Zijn stem heel wonderlijk; Hij doet grote dingen, en wij begrijpen ze niet.","Deut 4:12":"Zo sprak de HEERE tot u uit het midden van het vuur; u hoorde de stem van de woorden, maar u zag geen gelijkenis, alleen de stem.","Amos 1:4":"Daarom zal Ik een vuur in het huis van Hazaël zenden, dat zal de paleizen van Benhadad verteren.","Deut 1:2":"Elf dagreizen is het van Horeb, via de weg van het gebergte Seïr, tot aan Kades-Barnea.","Hebr 12:29":"Want onze God is een verterend vuur.","Jes 8:11":"Want zo heeft de HEERE tegen mij gezegd, met een sterke hand, en Hij onderwees mij om niet te wandelen op de weg van dit volk, en zei:","Ex 10:28":"Maar Farao zei tegen hem: Ga weg van mij! Pas op dat u mijn aangezicht niet meer ziet; want op de dag dat u mijn aangezicht zult zien, zult u sterven!","Ezech 2:4":"En deze kinderen zijn hard van gezicht, en stijf van hart; Ik zend u tot hen, en u zult tegen hen zeggen: Zo zegt de Heere HEERE!","Jes 60:19-21":"De zon zal voor u niet meer zijn tot een licht overdag, en tot een glans zal de maan u niet lichten; maar de HEERE zal u tot een eeuwig licht zijn, en uw God tot uw sierlijkheid. Uw zon zal niet meer ondergaan, en uw maan zal haar licht niet intrekken; want de HEERE zal u tot een eeuwig licht zijn, en de dagen van uw treuren zullen een einde nemen. En uw volk zullen allen samen rechtvaardig zijn, zij zullen voor eeuwig de aarde erfelijk bezitten; zij zullen zijn een scheut van Mijn planting, een werk van Mijn handen, opdat Ik verheerlijkt word.","Jer 33:1":"Verder kwam het woord van de HEERE voor de tweede keer tot Jeremia, toen hij nog opgesloten was in het voorhof van de bewaring, en Hij zei:","Jes 59:7":"Hun voeten lopen naar het kwade, en zij haasten zich om onschuldig bloed te vergieten; hun gedachten zijn gedachten van ongerechtigheid, verwoesting en verderf is op hun wegen.","Rom 10:5":"Want Mozes beschrijft de rechtvaardigheid die uit de wet is, en zegt: De mens die deze dingen doet, zal daardoor leven.","1 Kor 1:19":"Want er is geschreven: Ik zal de wijsheid van de wijzen doen vergaan, en het verstand van de verstandigen zal Ik tenietdoen.","Luk 23:30":"Dan zullen zij beginnen te zeggen tegen de bergen: Valt op ons; en tegen de heuvels: Bedekt ons.","Jer 2:30":"Tevergeefs heb Ik uw kinderen geslagen; zij hebben de tucht niet aangenomen; uw eigen zwaard heeft uw profeten verteerd, als een verdervende leeuw.","Hebr 11:37":"zij zijn gestenigd, in stukken gezaagd, beproefd, met het zwaard gedood; zij hebben rondgezworven in schapenvellen en geitenvellen; berooid, verdrukt, mishandeld;","1 Kon 18:18":"Toen zei hij: Ik heb Israël niet in beroering gebracht, maar u en het huis van uw vader, doordat u de geboden van de HEERE verlaten hebt en de Baäls bent gaan navolgen.","Deut 32:36":"Want de HEERE zal Zijn volk recht doen, en het zal Hem berouwen over Zijn knechten; want Hij zal zien, dat de hand is weggegaan, en er niemand meer over is, gebonden of vrij.","Openb 2:27":"En hij zal hen hoeden met een ijzeren staf; zij zullen als pottenbakkersvaten vermorzeld worden; zoals ook Ik van Mijn Vader ontvangen heb.","Ps 32:2":"Gelukkig is de mens, die de HEERE de ongerechtigheid niet toerekent, en in wiens geest geen bedrog is.","Jes 33:10":"Nu zal Ik opstaan, zegt de HEERE, nu zal Ik verhoogd worden, nu zal Ik verheven worden.","Jes 66:24":"En zij zullen naar buiten gaan, en zij zullen de dode lichamen zien van de mensen die tegen Mij in opstand zijn gekomen; want hun worm zal niet sterven, en hun vuur zal niet uitgeblust worden, en zij zullen voor alle vlees een afgrijzen zijn.","1 Sam 3:20":"En heel Israël, van Dan tot Berseba toe, wist dat Samuël bevestigd was tot een profeet van de HEERE.","Deut 33:2":"Hij zei: De HEERE is van Sinaï gekomen, en is hun opgegaan van Seïr; Hij is blinkend verschenen van het gebergte Paran, en is aangekomen met tienduizenden van de heiligen; tot Zijn rechterhand was een vurige wet aan hen.","Hand 13:35":"Daarom zegt hij ook in een andere psalm: U zult Uw Heilige geen verderving laten zien.","Lev 18:5":"Ja, Mijn inzettingen en Mijn rechten zult u houden; welk mens die doet, die zal daardoor leven; Ik ben de HEERE!","2 Kon 10:30":"De HEERE dan zei tot Jehu: Omdat u goed gedaan hebt, door te doen wat recht is in Mijn ogen, en hebt aan het huis van Achab gedaan, naar alles wat in Mijn hart was, zullen uw zonen tot het vierde geslacht op de troon van Israël zitten.","2 Tim 1:11":"Waartoe ik gesteld ben als prediker, en apostel, en leraar van de heidenen;","1 Kon 20:22":"Toen trad die profeet naar de koning van Israël, en zei tegen hem: Ga heen, sterk u; en let op, en zie, wat u doen zult; want bij de wederkomst van het jaar zal de koning van Syrië tegen u optrekken.","Dan 11:30":"Want er zullen schepen van Chittim tegen hem komen, daarom zal hij door smart getroffen worden, en hij zal terugkeren, en gram worden tegen het heilige verbond, en hij zal het doen; want bij zijn terugkeer zal hij aandacht geven aan hen die het heilige verbond verlaten.","Rom 15:21":"maar zoals geschreven is: Aan wie van Hem niet was verkondigd, die zullen het zien; en die het niet gehoord hebben, die zullen het verstaan.","Zach 13:5":"Maar hij zal zeggen: Ik ben geen profeet, ik ben een man die het land bewerkt; want een mens heeft mij daartoe aangesteld om het vee te hoeden, van mijn jeugd af.","Hand 3:22":"Want Mozes heeft tegen de vaderen gezegd: De Heere, uw God, zal u een Profeet doen opstaan uit uw broeders, zoals mij; naar Hem moet u luisteren, in alles wat Hij tegen u zal zeggen.","Ex 24:17":"En het aanzien van de heerlijkheid van de HEERE was als een verterend vuur, op de top van die berg, in de ogen van de kinderen Israëls.","Rom 11:1":"Ik zeg dan: Heeft God Zijn volk verstoten? Dat zij verre. Want ik ben ook een Israëliet, uit het zaad van Abraham, van de stam Benjamin.","Mark 11:17":"En Hij onderwees hen, en zei: Staat er niet geschreven: Mijn huis zal een huis van gebed genoemd worden voor alle volken? Maar u hebt het tot een rovershol gemaakt.","Joh 14:13":"En wat u ook zult vragen in Mijn Naam, dat zal Ik doen, opdat de Vader in de Zoon verheerlijkt wordt.","Ezech 3:14":"Toen hief de Geest mij op, en nam mij weg, en ik ging heen, bitter bedroefd door de hitte van mijn geest; maar de hand van de HEERE was sterk op mij.","1 Kon 18:22":"Toen zei Elia tegen het volk: Ik ben als enige profeet van de HEERE overgebleven, en de profeten van Baäl zijn vierhonderdvijftig mannen.","Deut 26:17":"Heden hebt u de HEERE laten zeggen dat Hij u tot een God zal zijn, en dat u zult wandelen in Zijn wegen, en Zijn inzettingen houden, en Zijn geboden, en Zijn rechten, en dat u Zijn stem zult gehoorzamen.","Lev 12:8":"Maar als haar hand niet genoeg vindt voor een lam, zal zij twee tortelduiven of twee jonge duiven nemen, één als brandoffer en één als zondoffer; en de priester zal voor haar verzoening doen; zo zal zij rein zijn.","Job 3:20-22":"Waarom geeft Hij de ellendigen het licht, en het leven de bitterlijk bedroefden van gemoed? Die verlangen naar de dood, maar hij is er niet; en graven daarnaar meer dan naar verborgen schatten; Die blij zijn tot het opspringen toe, en zich verheugen, als zij het graf vinden;","Richt 13:13-21":"En de Engel van de HEERE zei tegen Manoach: Van alles wat Ik tegen de vrouw gezegd heb, moet zij zich weerhouden. Zij mag niets eten van wat van de wijnstok voortkomt; en wijn en sterke drank mag zij niet drinken, en ook niets van het onreine eten; alles wat Ik haar geboden heb, moet zij houden. Toen zei Manoach tegen de Engel van de HEERE: Laat ons U toch ophouden, en een geitenbokje voor U bereiden.","Ps 6:9":"Wijk van mij, alle werkers van de ongerechtigheid; want de HEERE heeft de stem van mijn geween gehoord.","Ps 5:10":"Want in hun mond is niets rechts, hun binnenste is enkel verderving, hun keel is een open graf, met hun tong vleien zij.","Jer 7:1":"Het woord dat tot Jeremia gebeurd is, van de HEERE, en Hij zei:","Ezech 24:15-18":"Verder kwam het woord van de HEERE tot mij, en Hij zei: Mensenkind! Zie, Ik zal de lust van uw ogen van u wegnemen door een plaag; toch zult u niet rouwklagen, en ook niet wenen, en uw tranen zullen niet komen. Houd stil met kermen, u zult geen dodenrouw bedrijven, bind uw hoofddeksel op u, en doe uw schoenen aan uw voeten; en de bovenlip zult u niet bedekken, en het brood van de mensen zult u niet eten.","Jes 49:3":"En Hij heeft tegen Mij gezegd: U bent Mijn Knecht, Israël, door Wie Ik verheerlijkt zal worden.","Job 13:11":"Zal Zijn hoogheid u niet verschrikken, en Zijn schrik over u vallen?","Jes 63:14":"Zoals een dier dat afgaat in de valleien, heeft de Geest van de HEERE hun rust gegeven. Zo hebt U Uw volk geleid, opdat U Uzelf een heerlijke Naam zou maken.","Gal 3:12":"Maar de wet is niet uit het geloof; maar de mens die deze dingen doet, zal daardoor leven.","Mark 7:10":"Want Mozes heeft gezegd: Eer uw vader en uw moeder; en: Wie vader of moeder vervloekt, die zal zeker sterven.","2 Sam 7:14":"Ik zal hem tot een Vader zijn, en hij zal Mij tot een zoon zijn; wanneer hij misdoet, zal Ik hem straffen met een mensenroede en met plagen van de mensenkinderen.","Dan 1:17":"Aan deze vier jongemannen nu gaf God kennis en verstand in alle boeken, en wijsheid; maar Daniël gaf Hij inzicht in allerlei visioenen en dromen.","Hebr 2:13":"En verder: Ik zal Mijn vertrouwen op Hem stellen. En verder: Zie, hier ben Ik met de kinderen die God Mij gegeven heeft.","Rom 11:4":"Maar wat zegt het Goddelijk antwoord tegen hem? Ik heb Mijzelf nog zevenduizend mannen overgelaten, die de knie voor het beeld van Baäl niet gebogen hebben.","Richt 14:19":"Toen kwam de Geest van de HEERE machtig over hem, en hij ging af naar de Askelonieten, en sloeg van hen dertig man; en hij nam hun kleren, en gaf de stellen (extra) kleren aan hen die het raadsel verklaard hadden. Maar zijn toorn ontstak, en hij ging naar het huis van zijn vader.","Hand 15:17":"opdat de overige mensen de Heere zoeken, en alle heidenen, over wie Mijn Naam aangeroepen is, zegt de Heere, Die dit alles doet.","Rom 9:17":"Want de Schrift zegt tegen Farao: Hiertoe heb Ik u doen opstaan, opdat Ik in u Mijn kracht zou bewijzen, en opdat Mijn Naam verkondigd wordt op de hele aarde.","2 Kron 5:10":"Er was niets in de ark, dan alleen de twee tafelen, die Mozes bij Horeb erin gedaan had toen de HEERE een verbond maakte met de kinderen van Israël, toen zij uit Egypte weggetrokken waren.","Joh 19:36":"Want deze dingen zijn gebeurd, opdat de Schrift vervuld wordt: Geen been van Hem zal verbroken worden.","Zach 7:12":"En zij maakten hun hart als een diamant, zodat zij niet hoorden de wet en de woorden die de HEERE van de heerscharen zond door Zijn Geest, door de dienst van de vorige profeten, waardoor een grote toorn is ontstaan van de HEERE van de heerscharen.","Rom 10:13":"Want ieder die de Naam van de Heere zal aanroepen, zal zalig worden.","Joh 7:38":"Wie in Mij gelooft, zoals de Schrift zegt: stromen van levend water zullen uit zijn buik vloeien.","1 Kor 1:28":"En het onedele van de wereld, en het verachte heeft God uitverkoren, en wat niets is, opdat Hij wat iets is, teniet zou maken;","Jes 60:2":"Want zie, de duisternis zal de aarde bedekken, en donkerheid de volken; maar over u zal de HEERE opgaan, en Zijn heerlijkheid zal over u gezien worden.","Gal 4:30":"Maar wat zegt de Schrift? Werp de dienstmaagd uit en haar zoon; want de zoon van de dienstmaagd zal geenszins erven met de zoon van de vrije.","Hand 7:49":"De hemel is Mij een troon, en de aarde een voetbank voor Mijn voeten. Wat voor huis zult u Mij bouwen, zegt de Heere, of wat is de plaats van Mijn rust?","Ps 72:18":"Geloofd zij de HEERE God, de God van Israël, Die alleen wonderen doet.","Rom 11:26":"En zo zal heel Israël zalig worden; zoals geschreven is: De Verlosser zal uit Sion komen en zal de goddeloosheden afwenden van Jakob.","Hebr 1:9":"U hebt rechtvaardigheid liefgehad, en ongerechtigheid gehaat; daarom heeft God, Uw God, U gezalfd met de olie van vreugde boven Uw medegenoten.","Luk 12:6":"Worden niet vijf musjes verkocht voor twee penningen? En niet één van die is bij God vergeten.","Ex 26:30":"Dan moet u de tabernakel oprichten volgens de manier die u op de berg getoond is.","Matt 27:51-54":"En zie, het voorhangsel van de tempel scheurde in tweeën, van boven tot beneden; en de aarde beefde, en de rotsen scheurden. En de graven werden geopend, en veel lichamen van de heiligen die ontslapen waren, werden opgewekt; en nadat zij na Zijn opstanding uit de graven weggegaan waren, kwamen zij in de heilige stad, en zijn aan velen verschenen.","Ex 32:34":"Ga nu heen, leid dit volk naar waar Ik u gezegd heb; zie, Mijn Engel zal voor u uit gaan! Maar op de dag van het bezoeken zal Ik hun zonde over hen bezoeken!","Deut 32:17":"Zij hebben aan de duivelen geofferd, niet aan God; aan de goden, die zij niet kenden; nieuwe, die van dichtbij gekomen waren, voor wie uw vaders niet geschrikt hebben.","Jes 40:13":"Wie heeft de Geest van de HEERE bestierd, en wie heeft Hem als Zijn raadsman onderwezen?","2 Sam 12:1":"En de HEERE zond Nathan naar David. Toen hij bij hem kwam, zei hij tegen hem: Er waren twee mannen in één stad, de één rijk en de ander arm.","Num 22:18":"Toen antwoordde Bileam, en zei tegen de dienaren van Balak: Al zou Balak mij zijn huis vol zilver en goud geven, dan nog zou ik het bevel van de HEERE, mijn God, niet kunnen overtreden, om iets kleins of groots te doen.","1 Sam 17:11":"Toen Saul en heel Israël deze woorden van de Filistijn hoorden, schrokken zij enorm, en vreesden zeer.","Ps 104:31":"De heerlijkheid van de HEERE zij tot in eeuwigheid; de HEERE verblijde Zich in Zijn werken.","Hand 7:14":"En Jozef stuurde iemand heen, en liet zijn vader Jakob halen, en heel zijn familie, vijfenzeventig zielen in totaal.","Ps 2:2":"De koningen van de aarde stellen zich op, en de vorsten beraadslagen samen tegen de HEERE, en tegen Zijn Gezalfde, en zeggen:","2 Tim 2:19":"Toch staat het vaste fundament van God, met dit zegel: De Heere kent hen die van Hem zijn; en: Ieder die de Naam van Christus noemt, moet afstand nemen van ongerechtigheid.","Ps 36:2":"De overtreding van de goddeloze spreekt in het binnenste van mijn hart: Er is geen vreze van God voor zijn ogen.","1 Kon 22:14":"Doch Micha zei: Zo waarachtig als de HEERE leeft, wat de HEERE tegen mij zeggen zal, dat zal ik spreken.","Hebr 10:17":"En aan hun zonden en hun ongerechtigheden zal Ik geenszins meer denken.","Deut 31:8":"De HEERE nu is Degene, Die voor u uitgaat; Die zal met u zijn; Hij zal u niet loslaten, en u niet verlaten; vrees niet, en wees niet ontsteld.","Hand 7:37":"Dit is de Mozes die tegen de kinderen van Israël gezegd heeft: De Heere, uw God, zal u een Profeet doen opstaan uit uw broeders, zoals mij; naar Hem zult u luisteren.","Ps 14:1-3":"Een psalm van David, voor de koorleider. De dwaas zegt in zijn hart: Er is geen God. Zij verderven het, zij maken het gruwelijk met hun werk; er is niemand die goed doet. De HEERE heeft uit de hemel neergezien op de mensenkinderen, om te zien of iemand verstandig was, die God zocht. Zij zijn allen afgeweken, samen zijn zij smerig geworden; er is niemand die goed doet, ook niet één.","Hebr 9:20":"en zei: Dit is het bloed van het testament, dat God u geboden heeft.","Matt 4:4":"Maar Hij antwoordde en zei: Er is geschreven: De mens zal niet van brood alleen leven, maar van elk woord dat uit de mond van God komt.","Rom 10:14":"Hoe zullen zij Hem dan aanroepen, in Wie zij niet geloofd hebben? En hoe zullen zij in Hem geloven, van Wie zij niet gehoord hebben? En hoe zullen zij horen, zonder iemand die hun predikt?","Jes 56:7":"Die zal Ik ook brengen naar Mijn heilige berg, en Ik zal hen verheugen in Mijn huis van gebed; hun brandoffers en hun slachtoffers zullen aangenaam zijn op Mijn altaar; want Mijn huis zal een huis van gebed genoemd worden voor alle volken.","Joh 8:50":"Maar Ik zoek Mijn eer niet; er is Iemand Die haar zoekt en oordeelt.","Jer 26:2":"Zo zegt de HEERE: Sta in het voorhof van het huis van de HEERE, en spreek tot alle steden van Juda, die komen om aan te bidden in het huis van de HEERE, al de woorden die Ik u geboden heb tot hen te spreken; doe er niet één woord af.","Hand 13:33":"dat God die vervuld heeft aan ons, hun kinderen, doordat Hij Jezus verwekt heeft. Zoals ook in de tweede psalm geschreven staat: U bent Mijn Zoon, heden heb Ik U verwekt.","1 Petr 3:14":"Maar als u ook lijdt om de gerechtigheid, dan bent u gelukkig te prijzen; en wees niet bang voor hun dreiging, en raak niet in verwarring;","Num 24:16":"Die hoort de woorden van God, spreekt, en die de kennis van de allerhoogste weet; die het gezicht van de Almachtige ziet, die in verrukking valt, en wiens ogen geopend worden.","Num 11:22":"Zullen dan voor hen schapen en runderen geslacht worden, zodat het voor hen genoeg is? Zullen alle vissen van de zee voor hen verzameld worden, zodat het voor hen genoeg is?","Mark 1:13":"En Hij was daar in de woestijn veertig dagen, beproefd door de satan; en Hij was bij de wilde dieren; en de engelen dienden Hem.","Ex 35:31":"En de Geest van God heeft hem vervuld met wijsheid, met verstand, en met kennis, namelijk in alle handwerk;","1 Kon 19:19-21":"Zo ging hij vandaar, en vond Elisa, de zoon van Safat; die was aan het ploegen met twaalf span runderen voor zich uit, en hij zelf was bij het twaalfde; en Elia ging naar hem toe, en wierp zijn mantel op hem. En hij liet de runderen achter, en liep Elia achterna, en zei: Laat mij toch mijn vader en mijn moeder kussen, daarna zal ik u volgen. En hij zei tegen hem: Ga, keer terug; want wat heb ik u gedaan? Zo keerde hij van achter hem terug, en nam een span runderen, en slachtte het, en met het gereedschap van de runderen kookte hij hun vlees, dat hij aan het volk gaf; en zij aten. Daarna stond hij op, en volgde Elia, en diende hem.","1 Kon 18:4":"Want het gebeurde, toen Izebel de profeten van de HEERE uitroeide, dat Obadja honderd profeten nam, en ze verborg bij vijftig man in een grot, en hen onderhield met brood en water.","Ex 23:20":"Zie, Ik zend een Engel voor uw aangezicht, om u te behoeden op deze weg, en om u te brengen naar de plaats die Ik voorbereid heb.","Ex 14:10-12":"Toen Farao dichtbij gekomen was, hieven de kinderen van Israël hun ogen op, en zie, de Egyptenaren trokken achter hen aan; en zij vreesden zeer; toen riepen de kinderen van Israël tot de HEERE. En zij zeiden tegen Mozes: Had u ons daarom, omdat er in Egypte helemaal geen graven waren, weggehaald, opdat wij in deze woestijn zouden sterven? Waarom heeft u ons dit aangedaan, dat u ons uit Egypte hebt weggevoerd? Is dit niet het woord dat wij in Egypte tot u spraken en zeiden: Houd op met ons, en laat ons de Egyptenaren dienen? Want het was ons beter geweest de Egyptenaren te dienen, dan in deze woestijn te sterven.","Jes 62:1":"Om Sion zal Ik niet zwijgen, en om Jeruzalem zal Ik niet stil zijn; totdat haar gerechtigheid voortkomt als een glans, en haar heil als een fakkel, die brandt.","Ps 34:21":"Schin. Hij bewaart al zijn beenderen; niet een daarvan wordt gebroken.","Matt 15:4-6":"Want God heeft geboden en gezegd: Eer uw vader en moeder, en: Wie vader of moeder vervloekt, die zal de dood sterven. Maar u zegt: Wie tegen vader of moeder zal zeggen: Het is een gave, wat u ook van mij zou kunnen ten nutte komen; en zijn vader of zijn moeder geenszins zal eren, die voldoet. En u hebt zo het gebod van God krachteloos gemaakt door uw overlevering.","2 Kron 36:15":"En de HEERE, de God van hun vaderen, zond tot hen, door de hand van Zijn boden, vroeg opstaand, om hen te zenden; want Hij spaarde Zijn volk en Zijn woning.","2 Kon 9:14":"Zo smeedde Jehu, de zoon van Josafat, de zoon van Nimsi, een samenzwering tegen Joram. (Joram had namelijk Ramoth in Gilead bewaakt, hij en heel Israël, vanwege Hazaël, de koning van Syrië;","Matt 21:13":"En Hij zei tegen hen: Er is geschreven: Mijn huis zal een huis van gebed genoemd worden; maar u hebt het tot een rovershol gemaakt.","Gal 3:6":"Zoals Abraham God geloofd heeft, en het is hem tot rechtvaardigheid gerekend;","Hos 13:14":"Toch zal Ik hen verlossen van de macht van het graf, Ik zal hen vrijmaken van de dood: o dood, waar zijn uw pestilentiën? Graf, waar is uw verderf? Berouw zal voor Mijn ogen verborgen zijn,","2 Kon 9:12":"Maar zij zeiden: Het is een leugen; vertel het ons nu. En hij zei: Zo en zo heeft hij tegen mij gesproken, en hij zei: Zo zegt de HEERE: Ik heb u gezalfd tot koning over Israël.","Lev 19:12":"U zult niet vals bij Mijn Naam zweren; want u zou de Naam van uw God ontheiligen; Ik ben de HEERE.","Hebr 8:9":"Niet naar het verbond dat Ik met hun vaderen gemaakt heb, op de dag dat Ik hen bij de hand nam om hen uit Egypteland te leiden; want zij zijn in dit Mijn verbond niet gebleven, en Ik heb niet meer naar hen omgekeken, zegt de Heere.","Jak 4:13":"Kom nu, u die zegt: Wij zullen vandaag of morgen naar die en die stad reizen, en daar een jaar doorbrengen, en handel drijven, en winst maken.","Ps 44:23":"Maar om Uwentwil worden wij de hele dag gedood; wij worden geacht als slachtschapen.","1 Kon 18:40":"En Elia zei tegen hen: Grijp de profeten van Baäl, laat niemand van hen ontkomen. En zij grepen hen; en Elia voerde hen af naar de beek Kison, en slachtte hen daar.","Micha 5:1":"En u, Bethlehem Efratha, bent u klein om te zijn onder de duizenden van Juda? Uit u zal Mij Iemand voortkomen, Die een Heerser zal zijn in Israël, en Wiens uitgangen zijn van oudsher, van de dagen van de eeuwigheid.","Ps 95:7-11":"Want Hij is onze God, en wij zijn het volk van Zijn weide, en de schapen van Zijn hand. Heden, als u Zijn stem hoort, Verhard uw hart niet, zoals te Meriba, zoals ten dage van Massa in de woestijn; Waar uw vaders Mij verzochten, Mij beproefden, ook Mijn werk zagen.","Ps 103:13":"Zoals een vader zich ontfermt over zijn kinderen, ontfermt de HEERE Zich over hen die Hem vrezen.","Ex 34:33":"Zo eindigde Mozes met hen te spreken, en hij had een sluier op zijn aangezicht gelegd.","Gen 15:6":"En hij geloofde in de HEERE; en Hij rekende het hem tot gerechtigheid.","Deut 24:14":"U zult de arme en behoeftige dagloner niet verdrukken, die uit uw broeders is, of uit uw vreemdelingen die in uw land en in uw poorten zijn.","Num 16:5":"En hij sprak tot Korach en tot zijn hele vergadering, en zei: Morgenvroeg zal de HEERE bekendmaken wie van Hem is, en wie de heilige is, die Hij tot Zich zal laten naderen; en wie Hij verkoren zal hebben, die zal Hij tot Zich laten naderen.","Jes 55:9":"Want zoals de hemelen hoger zijn dan de aarde, zo zijn Mijn wegen hoger dan uw wegen, en Mijn gedachten dan uw gedachten.","Jer 1:5":"Voordat Ik u in moeders buik vormde, heb Ik u gekend, en voordat u uit de baarmoeder voortkwam, heb Ik u geheiligd; Ik heb u de volken tot een profeet gesteld.","Ps 91:12":"Zij zullen u op de handen dragen, opdat u uw voet aan geen steen stoot.","Gal 3:10":"Want zovelen als er uit de werken van de wet zijn, die zijn onder de vloek; want er is geschreven: Vervloekt is ieder die niet blijft in alles wat geschreven is in het boek van de wet, om dat te doen.","Hand 13:41":"Zie, u verachters, verwonder u, en verdwijn; want Ik doe een werk in uw dagen, een werk dat u beslist niet zult geloven, ook al vertelt iemand het u.","2 Sam 24:16":"Toen nu de engel zijn hand uitstrekte over Jeruzalem om haar te verderven, kreeg de HEERE berouw over dat kwaad, en Hij zei tegen de engel die het verderf onder het volk aanrichtte: Het is genoeg, trek uw hand nu terug. De engel van de HEERE was nu bij de dorsvloer van Arauna, de Jebusiet.","1 Kon 19:13-18":"En het gebeurde, toen Elia dat hoorde, dat hij zijn gezicht bedekte met zijn mantel, en naar buiten ging, en ging staan in de ingang van de grot. En zie, een stem kwam tot hem, die zei: Wat doet u hier, Elia? En hij zei: Ik heb mij zeer sterk ingezet voor de HEERE, de God van de heerscharen; want de Israëlieten hebben Uw verbond verlaten, Uw altaren afgebroken en Uw profeten met het zwaard gedood; en ik alleen ben overgebleven, en zij zoeken mij te doden. En de HEERE zei tegen hem: Ga, keer terug op uw weg, naar de woestijn van Damaskus; en als u daar aankomt, zalf dan Hazaël tot koning over Syrië.","Jes 53:7":"Toen die geëist werd, werd Hij verdrukt; maar Hij deed Zijn mond niet open; als een lam werd Hij ter slachting geleid, en zoals een schaap stom is voor het aangezicht van zijn scheerders, zo deed Hij Zijn mond niet open.","Job 22:12":"Is God niet in de hoogte van de hemel? Zie toch het opperste van de sterren aan, hoe hoog zij zijn.","Hebr 10:16":"want nadat Hij eerder gezegd had: Dit is het verbond, dat Ik met hen sluiten zal na die dagen, zegt de Heere: Ik zal Mijn wetten in hun harten geven, en Ik zal die in hun verstand schrijven;","Hand 27:23":"Want deze zelfde nacht heeft bij mij gestaan een engel van God, van Wie ik ben en Die ik ook dien,","Jer 27:2":"Zo zei de HEERE tegen mij: Maak u banden en jukken, en doe die om uw hals.","Jes 24:23":"En de maan zal schaamrood worden, en de zon zal beschaamd worden, als de HEERE van de heerscharen regeren zal op de berg Sion en te Jeruzalem, en voor Zijn oudsten zal heerlijkheid zijn.","Hebr 6:14":"en zei: Waarlijk, Ik zal u overvloedig zegenen, en Ik zal u overvloedig meer maken.","Jes 11:4":"Maar Hij zal de armen met gerechtigheid oordelen, en de zachtmoedigen van het land met rechtmatigheid bestraffen; doch Hij zal de aarde slaan met de roede van Zijn mond, en met de adem van Zijn lippen zal Hij de goddeloze doden.","Gen 12:1":"De HEERE had tegen Abram gezegd: Ga uit uw land, uit uw familie en uit het huis van uw vader, naar het land dat Ik u wijzen zal.","2 Kron 18:27":"En Micha zei: Als u werkelijk met vrede terugkomt, dan heeft de HEERE niet door mij gesproken. Verder zei hij: Hoor, alle volken!","Rom 7:7":"Wat zullen wij dan zeggen? Is de wet zonde? Volstrekt niet. Ja, ik kende de zonde niet dan door de wet; want ik had ook de begeerte niet gekend als zonde, als de wet niet zei: U zult niet begeren.","Jak 2:23":"En de Schrift is vervuld die zegt: En Abraham geloofde God, en het is hem tot rechtvaardigheid gerekend, en hij is een vriend van God genoemd.","2 Kron 11:16":"Na hen kwamen ook uit alle stammen van Israël naar Jeruzalem, mensen die hun hart erop gericht hadden om de HEERE, de God van Israël, te zoeken, om aan de HEERE, de God van hun vaderen, offers te brengen.","Jes 33:5":"De HEERE is verheven, want Hij woont in de hoogte; Hij heeft Sion vervuld met recht en gerechtigheid.","Openb 22:8":"En ik, Johannes, ben degene die deze dingen gezien en gehoord heeft. En toen ik ze gehoord en gezien had, viel ik neer om aan te bidden voor de voeten van de engel die mij deze dingen toonde.","Hos 1:2":"Het begin van het woord van de Heere door Hosea. De Heere zei toen tegen Hosea: Ga heen, neem u een vrouw van hoererijen, en kinderen van hoererijen; want het land hoereert helemaal van achter de Heere vandaan.","Jer 31:34":"En zij zullen niet meer, ieder zijn naaste, en ieder zijn broeder, onderwijzen door te zeggen: Kent de HEERE! Want zij zullen Mij allen kennen, van hun kleinste tot hun grootste toe, spreekt de HEERE; want Ik zal hun ongerechtigheid vergeven, en aan hun zonden niet meer denken.","1 Kor 10:20":"Nee, maar ik zeg dat wat de heidenen offeren, zij dat aan de duivelen offeren en niet aan God; en ik wil niet dat u gemeenschap hebt met de duivelen.","Ex 3:5":"En Hij zei: Kom hier niet dichterbij; trek uw schoenen uit van uw voeten; want de plaats waarop u staat, is heilig land.","Ps 2:12":"Kust de Zoon, opdat Hij niet toornt, en u op de weg vergaat, wanneer Zijn toorn maar een weinig zou ontbranden. Gelukkig zijn allen die op Hem vertrouwen.","Mark 15:34":"En op het negende uur riep Jezus met luide stem: ELOÏ, ELOÏ, LAMMA SABACHTANI, dat vertaald betekent: Mijn God, Mijn God, waarom hebt U Mij verlaten?","Amos 5:19":"Zoals wanneer iemand vlucht voor het aangezicht van een leeuw, en een beer hem ontmoet; of dat hij in een huis komt, en met zijn hand tegen de wand leunt, en een slang hem bijt.","Jes 26:15":"U, o HEERE, had dit volk vermeerderd, U had dit volk vermeerderd; U was verheerlijkt; maar U hebt hen tot alle einden van het aardrijk ver weggedaan.","Num 7:89":"En toen Mozes de tent van de samenkomst inging om met Hem te spreken, hoorde hij een stem tot hem spreken, van boven het verzoendeksel dat op de ark van de getuigenis was, van tussen de twee cherubs. Zo sprak Hij tot hem.","Nahum 3:8":"Bent u beter dan No, de volkrijke, gelegen in de rivieren? die rondom heen water heeft, waarvan de voormuur de zee is, haar muur is van de zee.","Luk 22:37":"Want Ik zeg u, dat nog dit, wat geschreven is, in Mij vervuld moet worden, namelijk: En Hij is met de misdadigers gerekend. Want ook wat over Mij geschreven is, heeft een einde.","2 Kon 4:27":"Toen zij nu bij de man Gods op de berg kwam, greep zij zijn voeten vast. Maar Gehazi kwam dichterbij om haar weg te duwen. Maar de man Gods zei: Laat haar begaan; want haar ziel is in haar bitter bedroefd, en de HEERE heeft het voor mij verborgen, en het mij niet verteld.","Jer 11:1":"Het woord dat tot Jeremia gebeurd is, van de HEERE, en Hij zei:","Gal 4:13":"En u weet, dat ik u door zwakheid van het vlees het Evangelie de eerste keer verkondigd heb;","Jes 35:2":"Zij zal uitbundig bloeien, en zich verheugen, ja, met verheuging, en juichen; de heerlijkheid van Libanon is haar gegeven, het sieraad van Karmel en Saron; zij zullen de heerlijkheid van de HEERE zien, het sieraad van onze God.","Ezech 11:1":"Toen tilde de Geest mij op en bracht mij naar de Oostpoort van het huis van de HEERE, die oostwaarts ziet; en zie, aan de deur van de poort waren vijfentwintig mannen, en in hun midden zag ik Jaazanja, de zoon van Azzur, en Pelatja, de zoon van Benaja, vorsten van het volk.","2 Kon 8:12":"Toen zei Hazaël: Waarom weent mijn heer? En hij zei: Omdat ik weet welk kwaad u de Israëlieten aan zult doen; u zult hun vestingen in vuur laten opgaan, en hun jonge mannen met het zwaard doden, en hun kleine kinderen verpletteren, en hun zwangere vrouwen opensnijden.","Lev 18:7":"U zult de schaamte van uw vader en de schaamte van uw moeder niet ontdekken; zij is uw moeder; u zult haar schaamte niet ontdekken.","Mal 4:5":"Zie, Ik zend u de profeet Elia, voordat die grote en vreselijke dag van de HEERE komt.","Rom 10:15":"En hoe zullen zij prediken, als zij niet gezonden worden? Zoals geschreven is: Hoe lieflijk zijn de voeten van hen die vrede verkondigen, van hen die het goede verkondigen!","Ps 69:5":"Die mij zonder oorzaak haten, zijn meer dan de haren van mijn hoofd; die mij zoeken te vernielen, die mij om valse oorzaken vijand zijn, zijn machtig geworden; wat ik niet geroofd heb, moet ik dan teruggeven.","Ex 33:23":"En wanneer Ik Mijn hand zal hebben weggenomen, zult u Mijn achterste delen zien; maar Mijn aangezicht zal niet gezien worden!","Luk 2:32":"een licht tot verlichting van de heidenen, en tot heerlijkheid van Uw volk Israël.","Num 24:2-4":"Toen Bileam zijn ogen ophief en Israël zag, wonend naar zijn stammen, kwam de Geest van God op hem. En hij hief zijn spreuk op en zei: Bileam, de zoon van Beor, spreekt, en de man wiens ogen geopend zijn, spreekt! Die hoort de woorden van God, spreekt, die het gezicht van de Almachtige ziet; die in verrukking valt, en wiens ogen geopend worden!","Ef 1:14":"Die het onderpand is van onze erfenis, tot de verkregen verlossing, tot prijs van Zijn heerlijkheid.","Jes 45:1":"Zo zegt de HEERE tegen Zijn gezalfde, tegen Kores, wiens rechterhand Ik vastheb, om de volken voor zijn aangezicht neer te werpen; en Ik zal de lendenen van de koningen ontbinden, om voor zijn aangezicht de deuren te openen, en de poorten zullen niet gesloten worden:","Deut 5:25":"Maar nu, waarom zouden wij sterven? Want dit grote vuur zou ons verteren; als wij nog langer de stem van de HEERE, onze God, blijven horen, zouden wij sterven.","Amos 2:11":"En Ik heb sommigen uit uw zonen tot profeten verwekt, en uit uw jongelingen tot nazireeërs; is dit niet zo, kinderen van Israël? spreekt de HEERE.","Jes 65:2":"Ik heb Mijn handen uitgebreid, de hele dag, tot een opstandig volk, dat wandelt op een weg die niet goed is, naar hun eigen gedachten.","Hos 12:11":"En Ik zal spreken tot de profeten, en Ik zal het gezicht vermenigvuldigen; en door de dienst van de profeten zal Ik gelijkenissen voorstellen.","Hebr 3:5":"En Mozes is wel trouw geweest in heel Zijn huis, als een dienaar, tot getuigenis van de dingen die daarna gesproken zouden worden;","Matt 2:18":"Een stem is in Rama gehoord, geklaag, geween en veel gekerm; Rachel beweende haar kinderen, en wilde niet getroost worden, omdat zij er niet meer zijn!","Ef 3:21":"Hem, zeg ik, zij de heerlijkheid in de Gemeente, door Christus Jezus, tot in alle geslachten, tot in alle eeuwigheid. Amen.","Openb 14:13":"En ik hoorde een stem uit de hemel, die tegen mij zei: Schrijf, zalig zijn de doden die in de Heere sterven, van nu aan. Ja, zegt de Geest, opdat zij rusten van hun arbeid; en hun werken volgen met hen.","Deut 6:4":"Hoor, Israël! De HEERE, onze God, is een enig HEERE!","2 Kon 9:6":"Toen stond hij op, en ging het huis in; hij goot de olie op zijn hoofd, en zei tegen hem: Zo zegt de HEERE, de God van Israël: Ik heb u gezalfd tot koning over het volk van de HEERE, over Israël.","Gen 12:13":"Zeg toch: U bent mijn zuster; opdat het mij goed gaat om u, en ik in leven blijf om uwentwil.","Luk 10:2":"Hij zei dan tegen hen: De oogst is wel groot, maar de arbeiders zijn weinige; bid daarom de Heere van de oogst, dat Hij arbeiders in Zijn oogst uitstuurt.","Hand 9:13":"En Ananias antwoordde: Heere, ik heb van velen gehoord over deze man, hoeveel kwaad hij Uw heiligen in Jeruzalem heeft aangedaan;","Jer 2:18":"En nu, wat hebt u te doen met de weg van Egypte, om de wateren van Sihor te drinken? En wat hebt u te doen met de weg van Assur, om de wateren van de rivier te drinken?","Rom 1:2":"(Wat Hij van tevoren beloofd had door Zijn profeten, in de heilige Schriften),","Ps 41:10":"Zelfs de man van mijn vrede, op wie ik vertrouwde, die mijn brood at, heeft zijn hiel tegen mij groot gemaakt.","Jes 2:10":"Ga in de rotssteen, en verberg u in het stof, vanwege de schrik van de HEERE, en om de heerlijkheid van Zijn majesteit.","Ex 34:28":"En hij was daar met de HEERE, veertig dagen en veertig nachten; hij at geen brood, en hij dronk geen water; en Hij schreef op de tafelen de woorden van het verbond, de tien woorden.","1 Kon 19:9-21":"En hij kwam daar in een grot, en overnachtte daar; en zie, het woord van de HEERE kwam tot hem, en Hij zei tegen hem: Wat doet u hier, Elia? En hij zei: Ik heb mij zeer sterk ingezet voor de HEERE, de God van de heerscharen; want de Israëlieten hebben Uw verbond verlaten, Uw altaren afgebroken en Uw profeten met het zwaard gedood; en ik alleen ben overgebleven, en zij zoeken mij te doden. En Hij zei: Ga naar buiten, en sta op deze berg, voor het aangezicht van de HEERE. En zie, de HEERE ging voorbij, en een grote en sterke wind, die de bergen scheurde en de rotsen stukbrak, ging voor de HEERE uit; maar de HEERE was in de wind niet; en na deze wind een aardbeving; de HEERE was ook in de aardbeving niet;","Ps 118:6":"De HEERE is bij mij, ik zal niet vrezen; wat zal een mens mij doen?","Ps 8:7":"U doet hem heersen over de werken van Uw handen; U hebt alles onder zijn voeten gezet;","Ex 6:11":"Doch Mozes sprak voor de HEERE en zei: Zie, de kinderen van Israël hebben naar mij niet geluisterd; hoe zou Farao dan naar mij luisteren? Bovendien ben ik onbesneden van lippen.","Ex 35:35":"Hij heeft hen vervuld met wijsheid van hart, om alle werk te maken van een werkmeester, en van de allervernuftigste handwerker, en van de borduurder in hemelsblauw, en in purper, in scharlaken, en in fijn linnen, en van de wever; die alle werk maken, en vernuftig werk bedenken.","Ef 6:2":"Eer uw vader en moeder (dat is het eerste gebod met een belofte),","Openb 4:11":"U, Heere, bent waardig te ontvangen de heerlijkheid, en de eer, en de kracht; want U hebt alle dingen geschapen, en door Uw wil zijn zij, en zijn zij geschapen.","Ex 4:12":"En nu ga heen, en Ik zal met uw mond zijn, en zal u leren, wat u spreken zult.","Openb 10:7":"maar in de dagen van de stem van de zevende engel, wanneer hij zal bazuinen, dan zal het geheimenis van God vervuld worden, zoals Hij aan Zijn dienstknechten, de profeten, verkondigd heeft.","Jona 1:3":"Maar Jona maakte zich op om te vluchten naar Tarsis, van het aangezicht van de HEERE; en hij kwam af te Jafo, en vond een schip dat naar Tarsis ging, en hij betaalde de vracht ervoor, en ging erin om met hen mee te gaan naar Tarsis, van het aangezicht van de HEERE.","1 Kron 28:12":"en een bereiding van alles wat bij hem was door de Geest, namelijk van de voorhoven van het huis van de HEERE, en van alle kamers rondom; van de schatten van het huis van God, en van de schatten van de heilige dingen;","Joh 13:31":"Toen hij dan naar buiten gegaan was, zei Jezus: Nu is de Zoon des mensen verheerlijkt, en God is in Hem verheerlijkt.","Hebr 1:6":"En als Hij de Eerstgeborene opnieuw in de wereld inbrengt, zegt Hij: En dat alle engelen van God Hem aanbidden.","Jes 52:15":"zo zal Hij veel heidenvolken besprenkelen; ja, koningen zullen hun mond over Hem dichthouden; want aan wie het niet verkondigd was, die zullen het zien, en wie het niet gehoord hebben, die zullen het begrijpen.","Zach 1:11":"En zij antwoordden de Engel van de HEERE Die tussen de mirten stond, en zeiden: Wij hebben het land doorwandeld, en zie, het hele land zit rustig en is stil.","Jes 57:15":"Want zo zegt de Hoge en Verhevene, Die in de eeuwigheid woont, en Wiens Naam heilig is: Ik woon in de hoogte en in het heilige, en bij hem die een verbrijzelde en nederige geest heeft, om de geest van de nederigen levend te maken, en om het hart van de verbrijzelden levend te maken.","Deut 5:5":"(ik stond in die tijd tussen de HEERE en tussen u, om u het woord van de HEERE bekend te maken; want u was bang voor het vuur en klom niet op de berg) en Hij zei:","Ex 20:13":"U zult niet doodslaan.","Jes 59:8":"De weg van de vrede kennen zij niet; en er is geen recht in hun gangen; hun paden maken zij krom voor zichzelf; ieder die daarop gaat, kent de vrede niet.","Hebr 13:2":"Vergeet de herbergzaamheid niet; want hierdoor hebben sommigen zonder het te weten engelen geherbergd.","Ps 35:5":"Laat hen worden als kaf voor de wind, en de Engel van de HEERE drijft hen weg.","Ps 117:1":"Loof de HEERE, alle heidenvolken; prijs Hem, alle natiën!","Ps 78:2":"Ik zal mijn mond opendoen met spreuken; ik zal geheimen overvloedig uitstorten, van oude tijden af.","2 Kor 12:7":"En opdat ik mij door de overvloed van de openbaringen niet zou verheffen, is mij een scherpe doorn in het vlees gegeven, namelijk een engel van de satan, om mij met vuisten te slaan, opdat ik mij niet zou verheffen.","1 Petr 1:25":"maar het Woord van de Heere blijft in eeuwigheid. En dit is het Woord dat onder u verkondigd is.","Hebr 1:14":"Zijn zij niet allemaal dienende geesten, die uitgezonden worden om te dienen, om hen die de zaligheid zullen beërven?","Dan 2:19":"Toen werd aan Daniël in een nachtvisioen het geheim geopenbaard; toen loofde Daniël de God van de hemel.","Hebr 2:6-8":"Maar iemand heeft ergens verklaard: Wat is de mens, dat U aan hem denkt, of de zoon van de mens, dat U naar hem omziet! U hebt hem een weinig minder gemaakt dan de engelen; met heerlijkheid en eer hebt U hem gekroond, en hebt U hem gesteld over de werken van Uw handen; Alle dingen hebt U onder zijn voeten onderworpen. Want doordat Hij hem alle dingen onderworpen heeft, heeft Hij niets overgelaten dat hem niet onderworpen is; maar nu zien wij nog niet dat hem alle dingen onderworpen zijn;","Hand 2:35":"Totdat Ik Uw vijanden tot een voetbank voor Uw voeten gezet zal hebben.","Hand 2:34":"Want David is niet opgevaren naar de hemel; maar hij zegt zelf: De Heere heeft gesproken tot mijn Heere: Zit aan Mijn rechterhand,","2 Kron 15:1":"Toen kwam de Geest van God op Azaria, de zoon van Oded.","1 Kor 15:25":"Want Hij moet als Koning heersen, totdat Hij alle vijanden onder Zijn voeten zal hebben gelegd.","Ps 46:11":"Laat af, en weet, dat Ik God ben; Ik zal verhoogd worden onder de heidenen, Ik zal verhoogd worden op de aarde.","Luk 1:15":"Want hij zal groot zijn voor de Heere; hij zal geen wijn en geen sterke drank drinken, en hij zal met de Heilige Geest vervuld worden, al vanaf de moederschoot.","Ezech 11:24":"Daarna nam de Geest mij op, en bracht mij in een gezicht door de Geest van God naar Chaldea, tot de weggevoerde gevangenen; en het gezicht dat ik gezien had, steeg van mij op.","1 Kor 4:9-13":"Want ik denk dat God ons, de laatste apostelen, ten toon heeft gesteld als tot de dood veroordeeld; want wij zijn een schouwspel geworden voor de wereld, en voor de engelen, en voor de mensen. Wij zijn dwazen om Christus' wil, maar u bent wijzen in Christus; wij zijn zwakken, maar u sterken; u bent heerlijke mensen, maar wij worden veracht. Tot op dit huidige uur lijden wij honger, en lijden wij dorst, en zijn naakt, en worden met vuisten geslagen, en hebben geen vaste woonplaats;","Num 11:15":"En als U zo met mij doet, dood mij dan toch maar meteen, als ik genade in Uw ogen gevonden heb; en laat mij mijn ongeluk niet aanzien!","Jes 53:12":"Daarom zal Ik Hem een deel geven onder velen, en Hij zal de machtigen als buit verdelen, omdat Hij Zijn ziel uitgestort heeft in de dood, en onder de overtreders geteld is geweest, en Hij de zonden van velen gedragen heeft, en voor de overtreders gebeden heeft.","Rom 9:6":"Maar ik zeg dit niet alsof het woord van God vervallen zou zijn; want niet allen die uit Israël zijn, zijn Israël.","Jes 8:14":"Dan zal Hij u tot een Heiligdom zijn; maar tot een steen des aanstoots en tot een rots der struikeling voor de twee huizen van Israël, tot een strik en tot een net voor de inwoners van Jeruzalem.","Joh 6:31":"Onze vaders hebben het manna gegeten in de woestijn, zoals geschreven is: Hij gaf hun brood uit de hemel te eten.","Joh 1:52":"En Hij zei tegen hem: Voorwaar, voorwaar, Ik zeg u: Van nu af aan zult u de hemel geopend zien, en de engelen van God opklimmen en neerdalen op de Zoon des mensen.","Hand 26:14-18":"En toen wij allen op de grond neergevallen waren, hoorde ik een stem tot mij spreken, die zei in de Hebreeuwse taal: Saul, Saul, waarom vervolgt u Mij? Het is u hard, tegen de prikkels de hielen te slaan. En ik zei: Wie bent U, Heere? En Hij zei: Ik ben Jezus, Die u vervolgt. Maar richt u op en sta op uw voeten; want hiertoe ben Ik u verschenen, om u aan te stellen tot een dienaar en getuige, zowel van de dingen die u gezien hebt als van de dingen waarin Ik u nog zal verschijnen;","Deut 5:17":"U zult niet doodslaan.","2 Kor 12:7-12":"En opdat ik mij door de overvloed van de openbaringen niet zou verheffen, is mij een scherpe doorn in het vlees gegeven, namelijk een engel van de satan, om mij met vuisten te slaan, opdat ik mij niet zou verheffen. Hierover heb ik de Heere driemaal gebeden, dat hij van mij zou wijken. En Hij heeft tegen mij gezegd: Mijn genade is u genoeg; want Mijn kracht wordt in zwakheid volbracht. Zo zal ik dan veel liever roemen in mijn zwakheden, opdat de kracht van Christus in mij woont.","Rom 3:9":"Wat dan? Zijn wij voortreffelijker? Helemaal niet; want wij hebben al eerder beschuldigd zowel Joden als Grieken, dat zij allen onder de zonde zijn;","Hand 12:7":"En zie, een engel van de Heere stond daar, en een licht scheen in de cel, en hij sloeg Petrus op de zij, wekte hem en zei: Sta snel op. En zijn kettingen vielen van zijn handen af.","Jer 29:30":"Daarom kwam het woord van de HEERE tot Jeremia, en Hij zei:","Joh 2:17":"En Zijn discipelen herinnerden zich dat er geschreven is: De ijver voor Uw huis heeft mij verslonden.","Rom 9:27":"En Jesaja roept over Israël: Al zou het aantal kinderen van Israël zijn als het zand van de zee, toch zal het overblijfsel behouden worden.","1 Sam 19:20":"Toen zond Saul boden om David te halen; die zagen een groep profeten, die profeteerden, en Samuël stond daarbij, over hen aangesteld; en de Geest van God kwam over Sauls boden, en ook zij profeteerden.","1 Kron 23:13":"De kinderen van Amram waren Aäron en Mozes. Aäron nu werd afgezonderd om de allerheiligste dingen te heiligen, hij en zijn zonen, tot in eeuwigheid, om te roken voor het aangezicht van de HEERE, om Hem te dienen en om in Zijn Naam tot in eeuwigheid te zegenen.","Ps 57:12":"Verhef U boven de hemelen, o God! Uw eer zij over de hele aarde.","Rom 4:3":"Want wat zegt de Schrift? En Abraham geloofde God, en het is hem gerekend tot rechtvaardigheid.","Amos 9:1":"Ik zag de Heere staan op het altaar, en Hij zei: Sla die knop, zodat de posten beven, en kloof ze allen in het hoofd; en Ik zal hun achterste met het zwaard doden; wie van hen probeert te vluchten, zal niet ontkomen, en wie van hen probeert te ontkomen, zal niet gered worden.","Ps 16:8-11":"Ik stel de HEERE voortdurend voor mij, omdat Hij aan mijn rechterhand is, zal ik niet wankelen. Daarom is mijn hart blij, en mijn eer verheugt zich; ook zal mijn lichaam met zekerheid rusten. Want U zult mijn ziel in het graf niet verlaten; U zult niet toelaten dat Uw Heilige de ontbinding ziet.","Matt 19:18":"Hij zei tegen Hem: Welke? En Jezus zei: Deze: U zult niet doden; u zult geen overspel doen; u zult niet stelen; u zult geen valse getuigenis geven;","Amos 7:14":"Toen antwoordde Amos, en zei tegen Amazia: Ik was geen profeet, en ik was geen profetenzoon; maar ik was een ossenherder, en verzamelde wilde vijgen.","Rom 9:7":"Ook zijn zij niet allen kinderen omdat zij nageslacht van Abraham zijn; maar: In Izaak zal uw nageslacht genoemd worden.","Rom 11:3":"Heere! Zij hebben Uw profeten gedood, en Uw altaren omgeworpen; en ik ben alleen overgebleven en zij zoeken mijn leven.","Jes 53:9":"En men heeft Zijn graf bij de goddelozen gesteld, en Hij is bij de rijke in Zijn dood geweest, omdat Hij geen onrecht gedaan heeft, en er geen bedrog in Zijn mond geweest is.","Ex 20:13-17":"U zult niet doodslaan. U zult geen echtbreuk plegen. U zult niet stelen.","Richt 13:6":"Toen kwam deze vrouw binnen en sprak tegen haar man en zei: Er kwam een Man van God naar mij toe, Wiens gezicht was als het gezicht van een Engel van God, zeer ontzagwekkend; en ik heb Hem niet gevraagd waar Hij vandaan was, en Zijn naam heeft Hij mij niet bekendgemaakt.","1 Kon 18:10-12":"Zo waarachtig als de HEERE, uw God, leeft: er is geen volk of koninkrijk waar mijn heer niet naartoe gezonden heeft om u te zoeken; en als zij zeiden: Hij is hier niet, liet hij dat koninkrijk en dat volk zweren dat zij u niet hadden gevonden. En nu zegt u: Ga heen, zeg tegen uw heer: Zie, Elia is hier. En het zou kunnen gebeuren, zodra ik van u weggegaan ben, dat de Geest van de HEERE u wegneemt, ik weet niet waarheen; en dan kom ik om dat aan Achab te melden, en hij vindt u niet, dan zou hij mij doden; terwijl ik, uw knecht, de HEERE al van mijn jeugd af aan vrees.","1 Petr 1:11":"en onderzochten op welke of wat voor tijd de Geest van Christus, Die in hen was, doelde, toen Hij vooraf getuigde van het lijden dat over Christus zou komen, en de heerlijkheid daarna.","Ezech 1:1":"In het dertigste jaar, in de vierde maand, op de vijfde dag van die maand, toen ik te midden van de weggevoerden was bij de rivier Chebar, gebeurde het dat de hemelen werden geopend, en ik zag visioenen van God.","Ezech 11:4":"Daarom, profeteer tegen hen; profeteer, o mensenkind!","Joh 17:10":"En al het Mijne is van U, en het Uwe is van Mij; en Ik ben in hen verheerlijkt.","Ezech 2:1":"En Hij zei tegen mij: Mensenkind, sta op uw voeten, en Ik zal met u spreken.","Job 4:16":"Hij stond stil, maar ik herkende zijn gedaante niet; er was een beeltenis voor mijn ogen; er was stilte, en ik hoorde een stem, die zei:","Jes 8:13":"De HEERE van de heerscharen, Die zult u heiligen, en Hij zij uw vrees, en Hij zij uw verschrikking.","Rom 15:11":"En opnieuw: Looft de Heere, alle heidenen, en prijst Hem, alle volken!","Openb 21:10":"En hij voerde mij weg in de geest op een grote en hoge berg, en hij toonde mij de grote stad, het heilige Jeruzalem, neerdalend uit de hemel van God.","Jak 2:8":"Als u dan de koninklijke wet vervult, naar de Schrift: U zult uw naaste liefhebben als uzelf, dan doet u goed;","Ezech 3:22":"En de hand van de HEERE was daar op mij, en Hij zei tot mij: Maak u op, ga uit naar de vallei, en Ik zal daar met u spreken.","Joh 12:40":"Hij heeft hun ogen verblind, en hun hart verhard; opdat zij met de ogen niet zien, en met het hart niet verstaan, en zij zich bekeren, en Ik hen genees.","Ps 120:4":"Scherpe pijlen van een machtige, alsook gloeiende jeneverkolen.","Matt 21:9":"En de menigten die voor Hem uit gingen en die volgden, riepen: Hosanna, de Zoon van David! Gezegend is Hij Die komt in de Naam van de Heere! Hosanna in de hoogste hemelen!","Gal 3:16":"Nu zijn de beloften gesproken tot Abraham en zijn nageslacht. Hij zegt niet: En aan de nageslachten, alsof het over velen ging; maar alsof het over één ging: En uw nageslacht; dat is Christus.","Mark 12:36":"Want David zelf heeft door de Heilige Geest gezegd: De Heere heeft gezegd tegen mijn Heere: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gemaakt heb.","Num 20:16":"Toen riepen wij tot de HEERE, en Hij hoorde onze stem, en Hij zond een Engel, en Hij leidde ons uit Egypte; en zie, wij zijn te Kades, een stad aan de rand van uw gebied.","Joh 15:25":"Maar dit gebeurt, zodat het woord vervuld wordt dat in hun wet geschreven is: Zij hebben Mij zonder oorzaak gehaat.","Jer 23:9":"Aangaande de profeten. Mijn hart wordt in mijn binnenste gebroken, al mijn beenderen beven; ik ben als een dronken man, en als een man die de wijn te boven gaat; vanwege de HEERE, en vanwege de woorden van Zijn heiligheid.","Luk 1:70":"zoals Hij gesproken heeft door de mond van Zijn heilige profeten, die er van oudsher geweest zijn;","1 Petr 2:6":"Daarom staat er ook in de Schrift: Zie, Ik leg in Sion een uitverkoren, kostbare hoeksteen; en wie in Hem gelooft, zal niet beschaamd worden.","Rom 9:9":"Want dit is het woord van de belofte: Rond deze tijd zal Ik komen, en Sara zal een zoon hebben.","Mark 12:19":"Meester, Mozes heeft ons geschreven: Als iemands broer sterft, en een vrouw achterlaat, en geen kinderen nalaat, dat zijn broer diens vrouw moet nemen en voor zijn broer nageslacht moet verwekken.","Hand 7:42":"En God keerde Zich af, en gaf hen over om het leger van de hemel te dienen, zoals geschreven staat in het boek van de profeten: Hebt u soms slachtoffers en offers aan Mij gebracht, veertig jaar lang in de woestijn, huis van Israël?","Hebr 13:6":"Zodat wij vrijmoedig durven zeggen: De Heere is mij een Helper, en ik zal niet vrezen wat een mens mij zal doen.","Hebr 1:10-12":"En: U, Heere! hebt in het begin de aarde gegrond, en de hemelen zijn werken van Uw handen; Die zullen vergaan, maar U blijft altijd, en zij zullen allemaal verouderen als een kleed; En als een dekkleed zult U ze oprollen, en zij zullen veranderd worden; maar U bent Dezelfde, en Uw jaren zullen niet ophouden.","1 Sam 3:1":"En de jongen Samuël diende de HEERE onder toezicht van Eli; en het woord van de HEERE was zeldzaam in die dagen; er was geen openbaar visioen.","Spr 6:20":"Mijn zoon, bewaar het gebod van uw vader, en verlaat de wet van uw moeder niet.","Ex 5:23":"Want vanaf het moment dat ik bij Farao ben gekomen, om in Uw Naam te spreken, heeft hij dit volk kwaad gedaan; en U hebt Uw volk geenszins verlost.","Deut 1:5":"Aan deze kant van de Jordaan, in het land Moab, begon Mozes deze wet uit te leggen, en zei:","Matt 6:13":"En leid ons niet in verzoeking, maar verlos ons van de boze. Want van U is het Koninkrijk, en de kracht, en de heerlijkheid, tot in eeuwigheid. Amen.","2 Kon 13:18":"Daarna zei hij: Neem de pijlen. En hij nam ze. Toen zei hij tegen de koning van Israël: Sla tegen de aarde. En hij sloeg driemaal; daarna stond hij stil.","Num 23:20":"Zie, ik heb opdracht ontvangen om te zegenen; omdat Hij zegent, zal ik het niet terugdraaien.","Ps 68:18":"Gods wagens zijn tweemaal tienduizend, de duizenden verdubbeld. De Heere is onder hen, een Sinaï in heiligheid!","2 Kor 12:9":"En Hij heeft tegen mij gezegd: Mijn genade is u genoeg; want Mijn kracht wordt in zwakheid volbracht. Zo zal ik dan veel liever roemen in mijn zwakheden, opdat de kracht van Christus in mij woont.","Hand 13:2":"En terwijl zij de Heere dienden en vastten, zei de Heilige Geest: Zonder Mij Barnabas en Saulus af voor het werk waartoe Ik hen geroepen heb.","Matt 11:10":"Want deze is het, van wie geschreven staat: Zie, Ik zend Mijn engel voor Uw aangezicht, die Uw weg bereiden zal voor U heen.","2 Kon 2:11":"En het gebeurde, terwijl zij verder gingen, al gaande en sprekende, zie, zo was er een vurige wagen met vurige paarden, die tussen hen beiden scheiding maakten. Zo voer Elia met een storm ten hemel.","Gen 41:39":"Daarna zei Farao tegen Jozef: Omdat God u dit alles heeft bekendgemaakt, is er niemand zo verstandig en wijs als u.","Hand 23:5":"En Paulus zei: Ik wist niet, broeders, dat hij de hogepriester was; want er is geschreven: De leider van uw volk zult u niet vervloeken.","Jes 32:20":"Gelukkig bent u, die aan alle wateren zaait; u, die de voet van het osse en van de ezel daarheen laat gaan!","Deut 30:12-14":"Het is niet in de hemel, om te zeggen: Wie zal voor ons naar de hemel gaan, dat hij het voor ons haalt, en het ons laat horen, dat wij het doen? Het is ook niet aan de andere kant van de zee, om te zeggen: Wie zal voor ons oversteken naar de andere kant van de zee, dat hij het voor ons haalt, en het ons laat horen, dat wij het doen? Want dit woord is heel dichtbij u, in uw mond, en in uw hart, om dat te doen.","Ex 32:6":"En zij stonden de volgende dag vroeg op, en offerden brandoffers en brachten dankoffers; en het volk zat neer om te eten en te drinken, daarna stonden zij op om te spelen.","Rom 11:2-4":"God heeft Zijn volk niet verstoten, dat Hij van tevoren gekend heeft. Of weet u niet wat de Schrift zegt van Elia, hoe hij God aanspreekt tegen Israël, en zegt: Heere! Zij hebben Uw profeten gedood, en Uw altaren omgeworpen; en ik ben alleen overgebleven en zij zoeken mijn leven. Maar wat zegt het Goddelijk antwoord tegen hem? Ik heb Mijzelf nog zevenduizend mannen overgelaten, die de knie voor het beeld van Baäl niet gebogen hebben.","Hand 4:26":"De koningen van de aarde zijn samen opgestaan, en de leiders zijn bijeengebracht tegen de Heere, en tegen Zijn Gezalfde.","1 Kron 28:19":"Dit alles, zei David, heeft men mij door geschrift laten verstaan, van de hand van de HEERE, namelijk al de werken van deze bereiding.","Mark 15:28":"En de Schrift is vervuld die zegt: En Hij is met de misdadigers gerekend.","Deut 31:20":"Want Ik zal dit volk brengen in het land, dat Ik hun vaderen gezworen heb, vloeiend van melk en honing, en het zal eten, en verzadigd, en vet worden; dan zal het zich wenden tot andere goden, en hen dienen, en zij zullen Mij tergen, en Mijn verbond vernietigen.","Jer 42:4":"En de profeet Jeremia zei tegen hen: Ik heb het gehoord; zie, ik zal tot de HEERE, uw God, bidden naar uw woorden; en het zal gebeuren, elk woord dat de HEERE u zal antwoorden, zal ik u bekendmaken, ik zal u niet één woord onthouden.","Job 33:7":"Zie, mijn verschrikking zal u niet beroeren, en mijn hand zal over u niet zwaar zijn.","Hebr 12:5":"En u bent de vermaning vergeten, die tot u spreekt als tot zonen: Mijn zoon, acht de kastijding van de Heere niet klein, en bezwijk niet als u door Hem bestraft wordt;","Mark 4:12":"opdat zij ziende zien, en niet opmerken; en horende horen, en niet verstaan; opdat zij zich niet op enig moment bekeren en hun de zonden vergeven worden.","2 Kron 15:12":"En zij sloten een verbond, dat zij de HEERE, de God van hun vaderen, zouden zoeken met hun hele hart en met hun hele ziel.","Rom 4:18":"Hij heeft tegen hoop op hoop geloofd, dat hij een vader van veel volken zou worden, volgens wat gezegd was: Zo zal uw nageslacht zijn.","Jona 3:4":"En Jona begon in de stad te gaan, een dagreis; en hij predikte, en zei: Nog veertig dagen, dan zal Nineve worden omgekeerd.","Jer 13:1-3":"Zo heeft de HEERE tegen mij gezegd: Ga heen, en koop u een linnen gordel, en doe die om uw middel, maar breng hem niet in het water. En ik kocht een gordel naar het woord van de HEERE, en ik deed die om mijn middel. Toen kwam het woord van de HEERE voor de tweede keer tot mij, en Hij zei:","2 Kon 8:7":"Daarna kwam Elisa in Damaskus, toen Benhadad, de koning van Syrië, ziek was; en men vertelde hem: De man Gods is hierheen gekomen.","Obadja 1:1":"Het visioen van Obadja. Zo zegt de Heere HEERE van Edom: Wij hebben een bericht gehoord van de HEERE, en er is een gezant gestuurd onder de heidenvolken: Sta op, en laten wij tegen haar opstaan ten strijde.","Ezech 3:27":"Maar als Ik met u spreken zal, zal Ik uw mond opendoen, en u zult tot hen zeggen: Zo zegt de Heere HEERE, wie hoort, laat hij horen, en wie het laat, laat hij het laten; want zij zijn een opstandig huis.","2 Kon 15:12":"Dit was het woord van de HEERE, dat Hij tot Jehu gesproken had: Uw zonen zullen tot het vierde geslacht op de troon van Israël zitten; en zo is het gebeurd.","1 Sam 28:14":"Hij dan zei tegen haar: Hoe ziet hij eruit? En zij zei: Er komt een oude man op, en hij is met een mantel bekleed. Toen Saul begreep dat het Samuel was, boog hij zich met zijn gezicht ter aarde, en boog hij zich neer.","Matt 19:19":"Eer uw vader en moeder; en: U zult uw naaste liefhebben als uzelf.","2 Kron 29:10":"Nu is het mijn hartsverlangen om een verbond te sluiten met de HEERE, de God van Israël, opdat de hitte van Zijn toorn van ons afkeert.","2 Kor 4:13":"Omdat wij nu dezelfde Geest van het geloof hebben, zoals er geschreven is: Ik heb geloofd, daarom heb ik gesproken; zo geloven wij ook, daarom spreken wij ook;","Hand 22:12-15":"En een zekere Ananias, een godvruchtig man naar de wet, die goede getuigenis had van al de Joden die daar woonden, kwam naar mij toe, en bij mij staande zei hij tegen mij: Saul, broeder, word weer ziende! En op datzelfde moment kon ik hem weer zien. En hij zei: De God van onze vaderen heeft u van tevoren bestemd om Zijn wil te kennen, en de Rechtvaardige te zien, en de stem uit Zijn mond te horen.","Luk 16:22":"En het gebeurde dat de bedelaar stierf, en door de engelen gedragen werd in de schoot van Abraham; en de rijke stierf ook, en werd begraven.","Mark 10:6":"Maar van het begin van de schepping af heeft God hen man en vrouw gemaakt.","1 Sam 13:14":"Maar nu zal uw koningschap niet blijven bestaan. De HEERE heeft Zich een man gezocht naar Zijn hart, en de HEERE heeft hem bevolen een voorganger te zijn over Zijn volk, omdat u niet gehouden hebt wat de HEERE u geboden had.","Matt 28:2":"En zie, er kwam een grote aardbeving; want een engel van de Heere daalde neer uit de hemel, kwam erbij, rolde de steen van de deur af, en ging erop zitten.","Openb 15:8":"En de tempel werd vervuld met rook uit de heerlijkheid van God, en uit Zijn kracht; en niemand kon de tempel binnengaan, totdat de zeven plagen van de zeven engelen geëindigd waren.","Richt 6:34":"Toen bekleedde de Geest van de HEERE Gideon, en hij blies op de bazuin, en de Abiëzrieten werden achter hem bijeengeroepen.","Dan 3:15":"Nu dan, als u gereed bent om, op het moment dat u het geluid zult horen van de hoorn, de pijp, de citer, de vedel, de psalters, en het akkoordgezang, en allerlei soort muziek, neer te vallen en het beeld te aanbidden dat ik gemaakt heb, dan is het goed; maar als u het niet aanbidt, zult u op datzelfde moment geworpen worden in het midden van de brandende vuuroven; en wie is de god die u uit mijn handen zou kunnen verlossen?","Joz 3:7":"Want de HEERE had tegen Jozua gezegd: Deze dag zal Ik beginnen u groot te maken voor de ogen van heel Israël, opdat zij weten dat Ik met u zal zijn, zoals Ik met Mozes geweest ben.","Matt 5:38":"U hebt gehoord dat gezegd is: Oog om oog, en tand om tand.","Deut 9:8":"Want bij Horeb vertoornde u de HEERE zeer, zodat Hij Zich tegen u vertoornde, om u te verdelgen.","Spr 3:11":"Mijn zoon! Verwerp de tucht van de HEERE niet, en word niet verdrietig over Zijn kastijding;","Jer 32:24":"Zie de wallen! Zij zijn tot aan de stad gekomen om die in te nemen, en de stad is gegeven in de hand van de Chaldeeën, die tegen haar strijden; vanwege het zwaard en de honger en de pest; en wat U gesproken hebt, is gebeurd, en zie, U ziet het.","Ps 68:19":"U bent opgevaren in de hoogte; U hebt de gevangenis gevankelijk weggevoerd; U hebt gaven genomen om uit te delen onder de mensen; ja, ook de opstandigen, om bij U te wonen, o HEERE God!","Ex 2:15":"Toen Farao deze zaak hoorde, zocht hij Mozes te doden; maar Mozes vluchtte voor Farao, en woonde in het land Midian, en hij ging bij een waterput zitten.","Mark 8:2":"Ik word innerlijk met ontferming bewogen over de menigte; want zij zijn nu drie dagen bij Mij gebleven, en hebben niets om te eten.","Hand 13:5":"En toen zij in Salamis gekomen waren, verkondigden zij het woord van God in de synagogen van de Joden; en zij hadden ook Johannes als dienaar.","Fil 1:21-24":"Want het leven is voor mij Christus, en het sterven is winst. Maar of ik in het vlees zal leven, dat is voor mij een vruchtbare arbeid, en wat ik zal kiezen, weet ik niet. Want ik word door deze twee gedrongen: ik heb het verlangen om heen te gaan en met Christus te zijn, want dat is verreweg het beste;","Jes 27:9":"Daarom zal daardoor de ongerechtigheid van Jakob verzoend worden, en dit is de hele vrucht, dat Hij zijn zonde zal wegdoen: wanneer Hij alle stenen van het altaar maakt als verstrooide kalkstenen, zullen de bossen en de zonnebeelden niet blijven bestaan.","Matt 11:3":"En zei tegen Hem: Bent U Degene, Die komen zou, of verwachten wij een ander?","Deut 25:5":"Wanneer broeders samenwonen, en één van hen sterft zonder zoon, dan mag de vrouw van de gestorvene niet trouwen met een vreemde man van buiten; haar zwager zal tot haar ingaan, en haar tot vrouw nemen, en zo de plicht van een zwager aan haar vervullen.","Gen 21:16":"En zij ging weg en ging tegenover hem zitten, op een afstand zo ver als een boogschot; want zij zei: Laat ik het kind niet zien sterven; en zij zat tegenover hem, en hief haar stem op, en huilde.","Matt 9:9":"En toen Jezus vandaar verder ging, zag Hij een man in het tolhuis zitten, genaamd Mattheüs; en Hij zei tegen hem: Volg Mij. En hij stond op en volgde Hem.","1 Petr 5:5":"Evenzo, u jongeren, wees de ouderen onderdanig; en wees allen elkaar onderdanig; bekleed u met nederigheid; want God weerstaat de hoogmoedigen, maar aan de nederigen geeft Hij genade.","Deut 32:43":"Juich, heidenen, met Zijn volk! want Hij zal het bloed van Zijn knechten wreken; en Hij zal de wraak op Zijn tegenpartijen doen wederkeren, en verzoenen Zijn land en Zijn volk.","Lev 19:3":"Want ieder zal zijn moeder en zijn vader vrezen, en Mijn sabbatten houden; Ik ben de HEERE, uw God!","2 Kor 8:15":"Zoals geschreven is: Wie veel verzameld had, had niet over; en wie weinig verzameld had, had niet te weinig.","Gen 3:9":"En de HEERE God riep Adam, en zei tegen hem: Waar bent u?","Ezech 11:5":"Toen viel de Geest van de HEERE op mij, en Hij zei tegen mij: Zeg: Zo zegt de HEERE: Zo hebt u gezegd, huis van Israël! Want Ik weet elk van de dingen die in uw geest opkomen.","Num 23:5":"Toen legde de HEERE het woord in de mond van Bileam, en zei: Keer terug naar Balak, en spreek zo.","Matt 4:22":"Zij lieten meteen het schip en hun vader achter en volgden Hem na.","Ezech 36:22":"Daarom, zeg tot het huis van Israël: Zo zegt de Heere HEERE: Ik doe het niet om u, huis van Israël! Maar om Mijn heilige Naam, die u ontheiligd hebt onder de heidenen waarheen u gekomen bent.","Luk 2:23":"(zoals geschreven is in de wet van de Heere: Al wat mannelijk is, dat de moeder opent, zal de Heere heilig genoemd worden.)","Hos 2:22":"En Ik zal ze Mij op de aarde zaaien, en Ik zal Mij ontfermen over Lo-Ruchama; en Ik zal zeggen tegen Lo-Ammi: U bent Mijn volk; en dat zal zeggen: O, mijn God!","Matt 8:23-27":"En toen Hij in het schip gegaan was, volgden Zijn discipelen Hem. En zie, er ontstond een grote storm op de zee, zodat het schip door de golven bedekt werd; maar Hij sliep. En Zijn discipelen kwamen bij Hem en maakten Hem wakker, en zeiden: Heere, red ons, wij vergaan!","Spr 14:4":"Als er geen ossen zijn, is de krib rein; maar door de kracht van de os is er veel inkomen.","Rom 15:3":"Want ook Christus heeft Zichzelf niet behaagd, maar zoals geschreven is: De smadingen van hen die U smaden, zijn op Mij gevallen.","Neh 9:38":"En om dit alles maken wij een vast verbond en schrijven het; en onze vorsten, onze Levieten en onze priesters zullen het verzegelen.","Spr 15:20":"Een wijze zoon verblijdt de vader; maar een dwaas mens veracht zijn moeder.","Lev 1:1":"En de HEERE riep Mozes, en sprak tot hem uit de tent van de samenkomst, en zei:","Matt 27:46":"En omstreeks het negende uur riep Jezus met luide stem: ELI, ELI, LAMA SABACHTHANI! Dat is: Mijn God, Mijn God, waarom hebt U Mij verlaten?","Ex 3:2":"En de Engel van de HEERE verscheen hem in een vuurvlam uit het midden van een braambos; en hij zag, en zie, het braambos brandde in het vuur, en het braambos werd niet verteerd.","Gen 15:5":"Toen leidde Hij hem naar buiten, en zei: Zie nu op naar de hemel, en tel de sterren, als u ze tellen kunt; en Hij zei tegen hem: Zo zal uw nageslacht zijn!","Rom 1:23":"en hebben de heerlijkheid van de onvergankelijke God veranderd in de gelijkenis van het beeld van een vergankelijk mens, en van vogels, en van viervoetige en kruipende dieren.","Jes 53:1":"Wie heeft onze prediking geloofd, en aan wie is de arm van de HEERE geopenbaard?","1 Sam 10:7":"En het zal gebeuren, als deze tekenen u overkomen, doe dan wat uw hand vindt te doen, want God zal met u zijn.","Hand 20:37":"En er ontstond een groot geween bij hen allen; en zij vielen Paulus om de hals en kusten hem;","Ps 78:24":"En Hij regende op hen het Manna om te eten, en gaf hun hemels koren.","Ps 34:11":"Caph. De jonge leeuwen lijden armoede en honger; maar die de HEERE zoeken hebben geen gebrek aan enig goed.","Jes 1:9":"Als de HEERE van de heerscharen ons niet nog een klein overblijfsel had gelaten, zouden wij als Sodom geworden zijn; wij zouden Gomorra gelijk zijn geworden.","Jona 1:2":"Maak u op, ga naar de grote stad Nineve, en predik tegen haar; want hun boosheid is opgeklommen voor Mijn aangezicht.","Deut 5:27":"Nader u, en hoor alles wat de HEERE, onze God, zeggen zal; en spreek u tot ons alles wat de HEERE, onze God, tot u spreken zal, en wij zullen het horen en doen.","Gal 1:16":"om Zijn Zoon in mij te openbaren, opdat ik Hem door het Evangelie onder de heidenen zou verkondigen, ben ik meteen niet te rade gegaan met vlees en bloed;","Deut 4:11":"En u kwam dichterbij en stond onder aan die berg (die berg brandde nu van vuur tot aan het midden van de hemel; er was duisternis, wolken en donkerheid).","1 Kon 2:28":"Toen het bericht Joab bereikte (want Joab had zich achter Adonia geschaard, hoewel hij zich niet achter Absalom had geschaard), vluchtte Joab naar de tent van de HEERE, en greep de hoornen van het altaar vast.","Num 12:6-8":"En Hij zei: Hoor nu Mijn woorden! Als er een profeet onder u is, zal Ik, de HEERE, Mij door een gezicht aan hem bekendmaken, door een droom zal Ik met hem spreken. Zo is Mijn knecht Mozes niet, die in heel Mijn huis trouw is. Van mond tot mond spreek Ik met hem, en duidelijk zichtbaar, en niet door duistere woorden; en de gestalte van de HEERE aanschouwt hij; waarom hebt u er dan niet voor gevreesd om tegen Mijn knecht, tegen Mozes, te spreken?","Matt 26:31":"Toen zei Jezus tegen hen: U zult allen deze nacht aan Mij geërgerd worden; want er is geschreven: Ik zal de Herder slaan, en de schapen van de kudde zullen verstrooid worden.","Jes 28:12":"tot wie Hij gezegd heeft: Dit is de rust, geef de moede rust, en dit is de verkwikking; toch hebben zij niet willen horen.","Num 11:25":"Toen kwam de HEERE neer in de wolk, en sprak tot hem, en Hij nam van de Geest die op hem was, en legde die op de zeventig mannen, de oudsten; en het gebeurde, toen de Geest op hen rustte, dat zij profeteerden, maar daarna niet meer.","Ex 2:14":"Hij dan zei: Wie heeft u tot een leider en rechter over ons gezet? Wilt u mij doden, zoals u de Egyptenaar gedood hebt? Toen werd Mozes bang, en zei: Zeker, deze zaak is bekend geworden!","Deut 5:11":"U zult de Naam van de HEERE, uw God, niet ijdel gebruiken; want de HEERE zal hem die Zijn Naam ijdel gebruikt, niet onschuldig houden.","2 Kon 8:8-15":"Toen zei de koning tegen Hazaël: Neem een geschenk mee, en ga de man Gods tegemoet, en vraag door hem de HEERE: Zal ik van deze ziekte genezen? Zo ging Hazaël hem tegemoet, en nam een geschenk mee, namelijk al het goede van Damaskus, een last van veertig kamelen; en hij kwam, en stond voor hem, en zei: Uw zoon Benhadad, de koning van Syrië, heeft mij naar u gezonden om te vragen: Zal ik van deze ziekte genezen? En Elisa zei tegen hem: Ga, zeg hem: U zult beslist niet genezen; want de HEERE heeft mij getoond dat hij zeker zal sterven.","Gen 41:16":"En Jozef antwoordde Farao: Het is niet aan mij! God zal Farao welzijn aanzeggen.","1 Tim 1:12-14":"En ik dank Hem, Die mij kracht gegeven heeft, namelijk Christus Jezus, onze Heere, dat Hij mij trouw geacht heeft, doordat Hij mij in de bediening gesteld heeft; Ik was voorheen een godslasteraar, en een vervolger, en een geweldenaar; maar mij is barmhartigheid overkomen, omdat ik het onwetend gedaan heb in mijn ongeloof. Maar de genade van onze Heere is zeer overvloedig geweest, met geloof en liefde, die er is in Christus Jezus.","2 Kon 6:32":"(Elisa nu zat in zijn huis, en de oudsten zaten bij hem.) En hij zond een man voor zijn aangezicht; maar voordat de bode bij hem gekomen was, had hij tegen de oudsten gezegd: Hebt u gezien hoe deze zoon van een moordenaar gezonden heeft om mijn hoofd af te nemen? Let op, wanneer die bode komt, sluit de deur toe, en houd hem tegen bij de deur; is niet het geluid van de voeten van zijn heer achter hem?","Jer 34:1":"Het woord dat tot Jeremia gebeurde van de HEERE, toen Nebukadnezar, koning van Babel, en zijn hele leger, en alle koninkrijken van de aarde die onder de heerschappij van zijn hand waren, en alle volken tegen Jeruzalem streden, en tegen al haar steden, en zei:","Ps 69:10":"Want de ijver voor Uw huis heeft mij verteerd; en de smaad van hen die U smaden, is op mij gevallen.","Rom 3:13":"Hun keel is een geopend graf; met hun tongen plegen zij bedrog; slangenvenijn is onder hun lippen.","2 Kron 13:11":"En zij steken voor de HEERE brandoffers aan, op elke morgen en op elke avond, ook reukwerk van welriekende specerijen, met de bereiding van het brood op de reine tafel, en de gouden kandelaar en zijn lampen, om die elke avond te laten branden; want wij nemen de wacht van de HEERE, onze God, waar; maar u hebt Hem verlaten.","Job 30:4":"Die ziltige kruiden plukten bij de struiken, en wiens voedsel de wortel van de jenevers was.","Num 22:35":"De Engel van de HEERE zei toen tegen Bileam: Ga met deze mannen mee; maar alleen dat woord dat Ik tot u spreken zal, dat zult u spreken. Zo ging Bileam met de vorsten van Balak mee.","Ps 109:3":"En met hatelijke woorden hebben zij mij omsingeld; ja, zij hebben mij bestreden zonder oorzaak.","Ex 19:18":"En de hele berg Sinaï rookte, omdat de HEERE daarop neerkwam in vuur; en zijn rook steeg op, als de rook van een oven; en de hele berg beefde erg.","Deut 4:10":"Denk aan de dag dat u voor de HEERE, uw God, bij Horeb stond, toen de HEERE tegen mij zei: Verzamel dit volk voor Mij, en Ik zal hun Mijn woorden laten horen, die zij zullen leren, om Mij te vrezen al de dagen dat zij op de aardbodem leven, en zij zullen ze hun kinderen leren;","Kol 1:1":"Paulus, een apostel van Jezus Christus door de wil van God, en Timotheüs, de broeder,","Spr 25:22":"Want u zult vurige kolen op zijn hoofd hopen, en de HEERE zal het u vergelden.","1 Kon 19:4-15":"Maar hijzelf ging een dagreis de woestijn in, en kwam en ging zitten onder een jeneverboom; en bad dat hij mocht sterven, en zei: Het is genoeg; neem nu, HEERE, mijn leven, want ik ben niet beter dan mijn vaderen. En hij ging liggen en sliep onder een jeneverboom; en zie, toen raakte een engel hem aan, en zei tegen hem: Sta op, eet. En hij keek om, en zie, aan zijn hoofdeinde lag een koek op de kolen gebakken, en een fles met water; zo at hij en dronk, en ging weer liggen.","Jer 31:31-34":"Zie, de dagen komen, spreekt de HEERE, dat Ik met het huis van Israël en met het huis van Juda een nieuw verbond zal sluiten; Niet naar het verbond dat Ik met hun vaderen gemaakt heb, op de dag dat Ik hun hand vastgreep om hen uit het land Egypte uit te leiden, welk verbond van Mij zij verbroken hebben, hoewel Ik hen getrouwd had, spreekt de HEERE; Maar dit is het verbond dat Ik na die dagen met het huis van Israël sluiten zal, spreekt de HEERE: Ik zal Mijn wet in hun binnenste geven, en zal die in hun hart schrijven; en Ik zal hun tot een God zijn, en zij zullen Mij tot een volk zijn.","Ezech 37:1":"De hand van de HEERE was op mij, en de HEERE voerde mij uit in de geest, en zette mij neer in het midden van een vallei; die was nu vol beenderen.","Deut 34:9-11":"Jozua nu, de zoon van Nun, was vol van de Geest van wijsheid; want Mozes had zijn handen op hem gelegd; zo luisterden de kinderen van Israël naar hem, en deden zoals de HEERE Mozes geboden had. En er stond in Israël geen profeet meer op zoals Mozes, die de HEERE gekend had, van aangezicht tot aangezicht, In al de tekenen en de wonderen, waartoe de HEERE hem gezonden had, om die te doen in het land Egypte aan farao, en aan al zijn knechten, en aan heel zijn land;","Hos 6:5":"Daarom heb Ik hen gehakt door de profeten; Ik heb hen gedood door de woorden van Mijn mond; en uw oordelen zullen voortkomen als het licht.","2 Kon 2:23":"En hij ging vandaar op naar Beth-el. Toen hij nu de weg opging, kwamen er kleine jongens uit de stad; die bespotten hem, en zeiden tegen hem: Kaalkop, ga op, kaalkop, ga op!","Ezech 3:10-12":"Verder zei Hij tot mij: Mensenkind, vat al Mijn woorden, die Ik tot u spreken zal, in uw hart, en hoor ze met uw oren. En ga heen, kom tot de weggevoerden, tot de kinderen van uw volk, en spreek tot hen, en zeg tot hen: Zo zegt de Heere HEERE, hetzij dat zij horen zullen, of hetzij dat zij het laten zullen. Toen nam de Geest mij op, en ik hoorde achter mij een stem van een groot ruisen, en zei: Geloofd zij de heerlijkhe
