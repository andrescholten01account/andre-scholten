ijden.","Ex 20:17":"U zult niet begeren het huis van uw naaste; u zult niet begeren de vrouw van uw naaste, of zijn dienstknecht, of zijn dienstmaagd, of zijn os, of zijn ezel, of iets dat van uw naaste is.","Matt 5:31":"Er is ook gezegd: Wie zijn vrouw verlaat, moet haar een scheidbrief geven.","1 Kron 21:15":"En God zond een engel naar Jeruzalem, om die te verderven; en toen hij haar verdierf, zag de HEERE het, en het berouwde Hem over dat kwaad; en Hij zei tegen de verdervende engel: Het is genoeg, trek nu uw hand terug. De engel van de HEERE nu stond bij de dorsvloer van Ornan, de Jebusiet.","Deut 9:18":"En ik wierp mij neer voor het aangezicht van de HEERE, zoals de eerste keer, veertig dagen en veertig nachten; ik at geen brood, en dronk geen water; om al uw zonde, die u had gezondigd door te doen wat kwaad is in de ogen van de HEERE, om Hem tot toorn te verwekken.","Num 23:26":"Maar Bileam antwoordde en zei tegen Balak: Heb ik u niet gezegd: Alles wat de HEERE zal spreken, dat zal ik doen?","Jer 2:1":"En het woord van de HEERE gebeurde tot mij, en Hij zei:","Matt 19:4":"Maar Hij antwoordde en zei tegen hen: Hebt u niet gelezen dat Hij Die van het begin de mens gemaakt heeft, hen gemaakt heeft man en vrouw?","Deut 4:36":"Vanuit de hemel heeft Hij u Zijn stem laten horen, om u te onderwijzen; en op de aarde heeft Hij u Zijn grote vuur laten zien; en u hebt Zijn woorden uit het midden van het vuur gehoord.","Jes 43:7":"ieder, die naar Mijn Naam genoemd is, en die Ik geschapen heb tot Mijn eer, die Ik geformeerd heb, die Ik ook gemaakt heb.","Hebr 1:5":"Want tegen wie van de engelen heeft Hij ooit gezegd: U bent Mijn Zoon, heden heb Ik U verwekt? En opnieuw: Ik zal Hem tot een Vader zijn, en Hij zal Mij tot een Zoon zijn?","Ex 4:15":"U dan zult tot hem spreken, en de woorden in zijn mond leggen; en Ik zal met uw mond, en met zijn mond zijn; en Ik zal u leren, wat u doen zult.","Ps 102:17":"Als de HEERE Sion zal opgebouwd hebben, in Zijn heerlijkheid zal verschenen zijn,","Matt 13:35":"Opdat vervuld zou worden wat gesproken is door de profeet, die zei: Ik zal Mijn mond opendoen door gelijkenissen; Ik zal dingen voortbrengen die verborgen waren van de grondlegging van de wereld af.","2 Kron 26:10":"Hij bouwde ook torens in de woestijn, en hakte veel putten uit, omdat hij veel vee had, zowel in de laagten als in de effent velden; akkerlieden en wijngaardeniers op de bergen en op de vruchtbare velden; want hij was een liefhebber van het bewerken van het land.","Ps 34:8":"Cheth. De Engel van de HEERE legert Zich rondom hen die Hem vrezen, en redt hen.","Luk 12:7":"Ja, ook de haren van uw hoofd zijn allemaal geteld. Wees dan niet bang; u gaat vele musjes te boven.","Ex 3:6":"Hij zei verder: Ik ben de God van uw vader, de God van Abraham, de God van Izak en de God van Jakob. En Mozes verborg zijn gezicht, want hij was bang om God aan te zien.","2 Kon 9:14-26":"Zo smeedde Jehu, de zoon van Josafat, de zoon van Nimsi, een samenzwering tegen Joram. (Joram had namelijk Ramoth in Gilead bewaakt, hij en heel Israël, vanwege Hazaël, de koning van Syrië; maar de koning Joram was teruggekeerd om zich in Jizreël te laten genezen van de verwondingen die de Syriërs hem toegebracht hadden, toen hij streed tegen Hazaël, de koning van Syrië.) En Jehu zei: Als dit uw wens is, laat dan niemand uit de stad ontkomen, die dit in Jizreël zou gaan vertellen. Toen reed Jehu, en trok naar Jizreël; want Joram lag daar; en Ahazia, de koning van Juda, was afgekomen om Joram te bezoeken.","Ex 4:27":"De HEERE zei ook tegen Aäron: Ga Mozes tegemoet in de woestijn. En hij ging, en ontmoette hem bij de berg van God, en kuste hem.","Jes 10:22":"Want ofschoon uw volk, o Israël, is als het zand van de zee, zo zal toch maar het overblijfsel daarvan terugkeren; de verdelging is vast besloten, overvloeiend met gerechtigheid.","Jona 4:8":"En het gebeurde, toen de zon opkwam, dat God een hete oostenwind liet waaien; en de zon stak op het hoofd van Jona, zodat hij bijna bezweek; en hij wenste dat hij mocht sterven, en zei: Het is beter voor mij te sterven dan te leven.","Deut 6:16":"U zult de HEERE, uw God, niet beproeven, zoals u Hem beproefd hebt te Massa.","Ex 19:7":"En Mozes kwam en riep de oudsten van het volk, en legde hun al deze woorden voor, die de HEERE hem geboden had.","Job 1:20":"Toen stond Job op, en scheurde zijn mantel, en schoor zijn hoofd, en viel op de aarde, en boog zich neer;","Dan 9:1-22":"In het eerste jaar van Darius, de zoon van Ahasveros, uit het nageslacht van de Meden, die koning gemaakt was over het koninkrijk van de Chaldeeën; in het eerste jaar van zijn regering, merkte ik, Daniël, in de boeken dat het getal van de jaren waarover het woord van de HEERE tot de profeet Jeremia gekomen was, in het vervullen van de verwoestingen van Jeruzalem, zeventig jaren was. En ik richtte mijn gezicht tot God, de HEERE, om Hem te zoeken met gebed en smekingen, met vasten, en een zak, en as.","Gen 25:23":"En de HEERE zei tegen haar: Twee volken zijn in uw buik, en twee naties zullen zich uit uw ingewand van elkaar scheiden; en het ene volk zal sterker zijn dan het andere volk; en de oudste zal de jongste dienen.","2 Kon 11:17":"En Jojada sloot een verbond tussen de HEERE en de koning, en het volk, dat het de HEERE tot een volk zou zijn; alsook tussen de koning en het volk.","Ex 20:18":"En al het volk zag de donderslagen, en de bliksemflitsen, en het geluid van de bazuin, en de rokende berg; toen het volk dit zag, weken zij terug en bleven op een afstand staan;","Luk 5:28":"En hij verliet alles, stond op en volgde Hem.","Ps 68:9":"Daverde de aarde, ook dropen de hemelen voor Gods aanschijn; zelfs deze Sinaï, voor het aanschijn van God, de God van Israël.","Jer 26:12":"Maar Jeremia sprak tot al de vorsten en tot al het volk, en zei: De HEERE heeft mij gezonden, om tegen dit huis en tegen deze stad te profeteren al de woorden die u gehoord hebt;","Luk 4:19":"Om aan de gevangenen vrijlating te prediken, en aan de blinden het gezicht, om de verslagenen in vrijheid heen te zenden; om te prediken het aangename jaar van de Heere.","Pred 5:5":"Laat uw mond niet toe dat hij uw lichaam laat zondigen; en zeg niet voor het aangezicht van de engel dat het een vergissing was; waarom zou God erg toornen om wat u zegt, en het werk van uw handen te gronde richten?","Ex 7:2":"U zult alles spreken wat Ik u gebieden zal; en Aäron, uw broer, zal tegen Farao spreken, dat hij de kinderen van Israël uit zijn land laat trekken.","Num 23:12":"Hij antwoordde en zei: Moet ik er niet op letten te spreken wat de HEERE in mijn mond gelegd heeft?","Hand 3:18":"Maar God heeft zo vervuld wat Hij door de mond van al Zijn profeten van tevoren had verkondigd, dat de Christus zou lijden.","Joh 14:8-11":"Filippus zei tegen Hem: Heere, toon ons de Vader, en het is ons genoeg. Jezus zei tegen hem: Ben Ik zo lange tijd bij u, en hebt u Mij niet gekend, Filippus? Wie Mij gezien heeft, heeft de Vader gezien; en hoe zegt u dan: Toon ons de Vader? Gelooft u niet dat Ik in de Vader ben, en de Vader in Mij is? De woorden die Ik tegen u spreek, spreek Ik niet uit Mijzelf, maar de Vader, Die in Mij blijft, Die doet de werken.","Jer 17:12":"Een troon van heerlijkheid, een hoogheid van het eerste af aan, is de plaats van ons heiligdom.","Matt 13:14":"En in hen wordt de profetie van Jesaja vervuld, die zegt: Met het gehoor zult u horen, en geenszins begrijpen; en ziende zult u zien, en geenszins opmerken.","Joh 6:45":"Er is geschreven in de profeten: En zij zullen allen door God onderwezen zijn. Ieder dan die het van de Vader gehoord en geleerd heeft, komt tot Mij.","Openb 19:21":"En de overigen werden gedood met het zwaard van Hem Die op het paard zat, dat uit Zijn mond ging; en alle vogels werden verzadigd van hun vlees.","Gen 16:7":"En de Engel van de HEERE vond haar bij een waterbron in de woestijn, bij de bron op de weg naar Sur.","Jona 3:2":"Maak u op, ga naar de grote stad Nineve, en predik tegen haar de prediking, die Ik tot u spreek.","Mark 16:11":"En toen dezen hoorden dat Hij leefde, en door haar gezien was, geloofden zij het niet.","Matt 5:21":"U hebt gehoord dat tot de ouden gezegd is: U zult niet doden; en wie doodt, die zal strafbaar zijn voor het gericht.","1 Sam 14:15":"En er kwam beving in het leger, op het veld en onder heel het volk; de bezetting en de plunderaars beefden ook zelf; ja, het land schudde, want het was een beving van God.","Spr 26:11":"Zoals een hond terugkeert naar zijn uitspuwsel, zo herneemt de dwaas zijn dwaasheid.","2 Tim 1:5":"Als ik mij in herinnering breng het ongeveinsde geloof, dat in u is, dat eerst gewoond heeft in uw grootmoeder Lois, en in uw moeder Eunice; en ik ben verzekerd, dat het ook in u woont.","Jer 26:1":"In het begin van het koningschap van Jojakim, de zoon van Josia, koning van Juda, kwam dit woord van de HEERE, en Hij zei:","Hand 9:14":"en hij heeft hier macht van de overpriesters om allen te binden die Uw Naam aanroepen.","Gen 20:2":"Toen Abraham nu van Sara, zijn vrouw, gezegd had: Zij is mijn zuster, stuurde Abimelech, de koning van Gerar, iemand en nam Sara weg.","Jes 6:5":"Toen zei ik: Wee mij, want ik ga ten onder! Omdat ik een man van onreine lippen ben, en ik woon te midden van een volk dat onrein van lippen is; want mijn ogen hebben de Koning, de HEERE van de heerscharen, gezien.","Hand 7:32":"die zei: Ik ben de God van uw vaders, de God van Abraham, en de God van Izak, en de God van Jakob. En Mozes begon hevig te beven, en durfde niet te kijken.","Deut 30:11-14":"Want dit gebod, dat ik u heden gebied, dat is voor u niet verborgen, en dat is niet ver weg. Het is niet in de hemel, om te zeggen: Wie zal voor ons naar de hemel gaan, dat hij het voor ons haalt, en het ons laat horen, dat wij het doen? Het is ook niet aan de andere kant van de zee, om te zeggen: Wie zal voor ons oversteken naar de andere kant van de zee, dat hij het voor ons haalt, en het ons laat horen, dat wij het doen?","Luk 2:14":"Ere zij God in de hoogste hemelen, en vrede op aarde, in de mensen een welbehagen.","Hand 7:26-28":"En de volgende dag liet hij zich aan hen zien, terwijl zij vochten; en hij drong hen tot vrede, en zei: Mannen, u bent broeders; waarom doet u elkaar onrecht aan? Maar die zijn naaste onrecht aandeed, stiet hem weg, en zei: Wie heeft u tot leider en rechter over ons gesteld? Wilt u mij ook ombrengen, zoals u gisteren de Egyptenaar hebt omgebracht?","Hand 7:3":"en zei tegen hem: Ga uit uw land en uit uw familie, en kom in een land dat Ik u wijzen zal.","Jer 33:9":"En het zal Mij zijn tot een vreugdevolle naam, tot een roem, en tot een sieraad bij alle heidenvolken van de aarde; die al het goede zullen horen dat Ik hun doe; en zij zullen vrezen en beven over al het goede, en over alle vrede die Ik hun geef.","Ps 145:12":"Lamed. Om aan de mensenkinderen bekend te maken Zijn machtige daden, en de eer van de heerlijkheid van Zijn Koninkrijk.","Ps 45:7":"Uw troon, o God! is eeuwig en altijd; de scepter van Uw koninkrijk is een scepter van rechtmatigheid.","Hand 2:2-4":"En er kwam plotseling uit de hemel een geluid, als van een geweldige, gedreven wind, en het vervulde het hele huis waar zij zaten. En er werden door hen verdeelde tongen gezien, als van vuur, en het zat op ieder van hen. En zij werden allen vervuld met de Heilige Geest, en begonnen te spreken met andere talen, zoals de Geest hun gaf uit te spreken.","Mal 4:4":"Denk aan de wet van Mozes, Mijn knecht, die Ik hem geboden heb op Horeb voor heel Israël, met de inzettingen en rechten.","Lev 19:18":"U zult niet wreken, noch toorn koesteren tegen de kinderen van uw volk; maar u zult uw naaste liefhebben als uzelf; Ik ben de HEERE!","Rom 3:14":"Hun mond is vol vervloeking en bitterheid;","Ex 21:15":"Wie zijn vader of zijn moeder slaat, die zal zeker gedood worden.","Lev 8:12":"Daarna goot hij van de zalfolie op het hoofd van Aäron, en hij zalfde hem, om hem te heiligen.","Richt 6:13":"Maar Gideon zei tegen Hem: Och, mijn heer! Als de HEERE met ons is, waarom is ons dan dit alles overkomen? En waar zijn al Zijn wonderen, die onze vaders ons verteld hebben en zeiden: Heeft de HEERE ons niet uit Egypte opgevoerd? Maar nu heeft de HEERE ons verlaten, en heeft ons in de hand van de Midianieten gegeven.","Matt 15:7-9":"Huichelaars! Terecht heeft Jesaja over u geprofeteerd, toen hij zei: Dit volk nadert Mij met hun mond, en eert Mij met de lippen, maar hun hart houdt zich ver van Mij; Maar tevergeefs eren zij Mij, terwijl zij leringen leren die geboden van mensen zijn.","Joël 2:28":"En daarna zal het gebeuren, dat Ik Mijn Geest zal uitgieten over alle vlees, en uw zonen en uw dochters zullen profeteren; uw ouden zullen dromen dromen, uw jongelingen zullen gezichten zien;","Gal 3:13":"Christus heeft ons verlost van de vloek van de wet, doordat Hij voor ons een vloek geworden is; want er is geschreven: Vervloekt is ieder die aan het hout hangt.","1 Sam 10:10":"Toen zij daar bij de heuvel kwamen, zie, toen kwam hem een groep profeten tegemoet; en de Geest van de HEERE werd vaardig over hem, en hij profeteerde in hun midden.","Ps 145:5":"He. Ik zal uitspreken de heerlijkheid van de eer van Uw majesteit, en Uw wonderlijke daden.","Rom 9:15":"Want Hij zegt tegen Mozes: Ik zal Mij ontfermen over wie Ik Mij ontferm, en zal barmhartig zijn voor wie Ik barmhartig ben.","Hebr 10:13":"verder wachtend, totdat Zijn vijanden neergelegd worden als een voetbank voor Zijn voeten.","Jes 60:6":"Een menigte kamelen zal u bedekken, de snelle kamelen van Midian en Hefa; zij allen uit Scheba zullen komen; goud en wierook zullen zij aanbrengen, en zij zullen de overvloedige lof van de HEERE verkondigen.","Ps 119:161":"Schin. De vorsten hebben mij vervolgd zonder oorzaak; maar mijn hart heeft gevreesd voor Uw woord.","Hand 2:17-21":"En het zal gebeuren in de laatste dagen, zegt God, dat Ik van Mijn Geest zal uitstorten op alle vlees; en uw zonen en uw dochters zullen profeteren, en uw jongemannen zullen visioenen zien, en uw ouden zullen dromen dromen. En ook op Mijn dienstknechten, en op Mijn dienstmaagden, zal Ik in die dagen van Mijn Geest uitstorten, en zij zullen profeteren. En Ik zal wonderen geven in de hemel boven, en tekenen op de aarde beneden: bloed en vuur en rookwalm.","2 Kon 2:13":"Hij nam ook Elia's mantel op, die van hem afgevallen was, en keerde terug, en ging bij de oever van de Jordaan staan.","Zach 1:1":"In de achtste maand, in het tweede jaar van Darius, kwam het woord van de HEERE tot Zacharia, de zoon van Berechja, de zoon van Iddo, de profeet, en hij zei:","Num 9:8-10":"En Mozes zei tot hen: Blijf staan, dat ik hoor wat de HEERE u gebieden zal. Toen sprak de HEERE tot Mozes en zei: Spreek tot de kinderen van Israël en zeg: Wanneer iemand onder u, of onder uw geslachten, onrein is door een dood lichaam, of op een verre reis zal zijn, dan zal hij toch de HEERE het pascha houden.","2 Kon 5:8":"Maar het gebeurde, toen Elisa, de man van God, gehoord had dat de koning van Israël zijn kleren had gescheurd, dat hij naar de koning stuurde, om te zeggen: Waarom hebt u uw kleren gescheurd? Laat hem nu naar mij toe komen, dan zal hij weten dat er een profeet in Israël is.","Num 22:32":"Toen zei de Engel van de HEERE tegen hem: Waarom hebt u uw ezelin nu al driemaal geslagen? Zie, Ik ben uitgegaan als tegenpartij tegen u, omdat deze weg van Mij afwijkt.","Zach 11:12":"Want ik had tegen hen gezegd: Als het goed is in uw ogen, breng mijn loon, en zo niet, laat het na. En zij hebben mijn loon gewogen, dertig zilverlingen.","Gen 41:38":"Toen zei Farao tegen zijn dienaars: Zouden wij wel een man vinden zoals deze, in wie de Geest van God is?","Ps 19:2-5":"De hemelen vertellen Gods eer, en het uitspansel verkondigt het werk van Zijn handen. De dag aan de dag stort overvloedig spraak uit, en de nacht aan de nacht toont wetenschap. Geen spraak, en geen woorden zijn er, waar hun stem niet wordt gehoord.","Hand 12:7-10":"En zie, een engel van de Heere stond daar, en een licht scheen in de cel, en hij sloeg Petrus op de zij, wekte hem en zei: Sta snel op. En zijn kettingen vielen van zijn handen af. En de engel zei tegen hem: Doe uw gordel om, en bind uw sandalen aan. En hij deed zo. En hij zei tegen hem: Sla uw mantel om, en volg mij. En hij ging naar buiten en volgde hem, en wist niet dat het waarachtig was wat door de engel gebeurde, maar hij dacht dat hij een visioen zag.","Num 22:25":"Toen de ezelin de Engel van de HEERE zag, klemde zij zichzelf tegen de wand, en klemde Bileams voet tegen de wand; daarom ging hij door met haar te slaan.","Joz 24:21-25":"Toen zei het volk tegen Jozua: Nee, want wij zullen de HEERE dienen. Jozua nu zei tegen het volk: U bent getuigen tegen uzelf, dat u de HEERE gekozen hebt om Hem te dienen. En zij zeiden: Wij zijn getuigen. En nu, doe de vreemde goden weg die in uw midden zijn, en neig uw hart tot de HEERE, de God van Israël.","Ex 33:2":"En Ik zal een Engel voor uw aangezicht zenden (en Ik zal uitdrijven de Kanaänieten, de Amorieten, en de Hethieten, en de Ferezieten, de Hevieten, en de Jebusieten),","Hand 11:28":"En een van hen, met de naam Agabus, stond op en maakte door de Geest bekend dat er een grote hongersnood zou komen over de hele wereld; die is ook gekomen onder keizer Claudius.","Ps 102:26-28":"U hebt voormaals de aarde gegrond, en de hemelen zijn het werk van Uw handen; Die zullen vergaan, maar U zult staande blijven; en zij alle zullen als een kleed verouderen; U zult ze veranderen als een gewaad, en zij zullen veranderd zijn. Maar U bent Dezelfde, en Uw jaren zullen niet geëindigd worden.","Jer 42:7":"En het gebeurde na tien dagen, dat het woord van de HEERE tot Jeremia kwam.","Ex 40:34":"Toen bedekte de wolk de tent der samenkomst; en de heerlijkheid van de HEERE vervulde de tabernakel.","Rom 12:20":"Als dan uw vijand honger heeft, geef hem te eten; als hij dorst heeft, geef hem te drinken; want als u dat doet, zult u kolen van het vuur op zijn hoofd hopen.","Hebr 8:8-12":"Want omdat Hij hen berispt, zegt Hij tegen hen: Zie, de dagen komen, spreekt de Heere, dat Ik over het huis van Israël en over het huis van Juda een nieuw verbond zal oprichten; Niet naar het verbond dat Ik met hun vaderen gemaakt heb, op de dag dat Ik hen bij de hand nam om hen uit Egypteland te leiden; want zij zijn in dit Mijn verbond niet gebleven, en Ik heb niet meer naar hen omgekeken, zegt de Heere. Want dit is het verbond dat Ik met het huis van Israël maken zal na die dagen, zegt de Heere: Ik zal Mijn wetten in hun verstand geven, en in hun harten zal Ik ze inschrijven; en Ik zal hun tot een God zijn, en zij zullen Mij tot een volk zijn.","Deut 1:19":"Toen vertrokken wij van Horeb, en trokken door die hele grote en vreselijke woestijn, die u gezien hebt, op de weg van het gebergte van de Amorieten, zoals de HEERE, onze God, ons geboden had; en wij kwamen bij Kades-Barnea.","Matt 4:16":"het volk dat in duisternis zat, heeft een groot licht gezien; en over hen die zaten in het land en de schaduw van de dood, is een licht opgegaan.","Jes 66:1":"Zo zegt de HEERE: De hemel is Mijn troon, en de aarde is de voetbank van Mijn voeten; waar zou dat huis zijn, dat u Mij zou bouwen, en waar is de plaats van Mijn rust?","2 Kon 2:24":"En hij keerde zich achterom, en hij zag hen, en vervloekte hen, in de Naam van de HEERE. Toen kwamen er twee berinnen uit het woud, en verscheurden van hen tweeënveertig kinderen.","Mark 1:3":"De stem van hem die roept in de woestijn: Bereid de weg van de Heere, maak Zijn paden recht.","Ps 69:26":"Hun paleis worde verwoest; in hun tenten zij geen inwoner.","Matt 3:3":"Want deze is het, van wie gesproken is door Jesaja, de profeet, toen hij zei: De stem van hem die roept in de woestijn: Bereid de weg van de Heere, maak Zijn paden recht!","Luk 5:29":"En Levi richtte voor Hem een grote maaltijd aan in zijn huis; en er was een grote menigte van tollenaars en anderen die met hen aanzaten.","Hos 14:3":"Neem deze woorden met u, en bekeer u tot de Heere; zeg tegen Hem: Neem weg alle ongerechtigheid, en geef het goede, zo zullen wij betalen de stieren van onze lippen.","Jes 63:9":"In al hun benauwdheid was Hij benauwd, en de Engel van Zijn aangezicht heeft hen behouden; door Zijn liefde en door Zijn genade heeft Hij hen verlost; en Hij nam hen op, en Hij droeg hen al de dagen van ouds.","Ezech 1:26-28":"En boven het uitspansel dat boven hun hoofden was, was de gelijkenis van een troon, als de gedaante van een saffiersteen; en op de gelijkenis van de troon was de gelijkenis als de gedaante van een mens, daarboven op zittend. En ik zag iets als de kleur van amber, als de gedaante van vuur rondom daarbinnen, vanaf de gedaante van Zijn lendenen en opwaarts; en vanaf de gedaante van Zijn lendenen en neerwaarts, zag ik iets als de gedaante van vuur, en een glans rondom Hem. Zoals de gedaante van de boog die in de wolk is op de dag van de regen, zo was de gedaante van de glans rondom; dit was de gedaante van de gelijkenis van de heerlijkheid van de HEERE; en toen ik het zag, viel ik op mijn gezicht, en ik hoorde een stem van Iemand Die sprak.","Gen 21:12":"Maar God zei tegen Abraham: Laat het niet kwaad zijn in uw ogen vanwege de jongen en vanwege uw slavin; alles wat Sara tegen u zegt, luister naar haar stem; want in Izak zal uw nageslacht genoemd worden.","Hab 3:3-5":"God kwam van Theman, en de Heilige van de berg Paran. Sela. Zijn heerlijkheid bedekte de hemelen, en het aardrijk was vol van Zijn lof. En er was een glans als van het licht, Hij had hoornen aan Zijn hand, en daar was Zijn sterkte verborgen. Voor Zijn aangezicht ging de pestilentie, en de vurige kool ging voor Zijn voeten uit.","Ps 68:25":"O God! Zij hebben Uw gangen gezien, de gangen van mijn God, mijn Koning, in het heiligdom.","Nahum 1:5":"De bergen beven voor Hem, en de heuvels smelten; en de aarde licht zich op voor Zijn aangezicht, ja de wereld, en allen die daarin wonen.","Matt 15:4":"Want God heeft geboden en gezegd: Eer uw vader en moeder, en: Wie vader of moeder vervloekt, die zal de dood sterven.","Hebr 8:5":"Deze priesters dienen het voorbeeld en de schaduw van de hemelse dingen, zoals Mozes door een goddelijke aanwijzing gewaarschuwd werd toen hij de tabernakel zou voltooien: Want, zegt Hij, zie erop toe dat u alles maakt naar het patroon dat u op de berg getoond is.","Ex 4:10":"Toen zei Mozes tegen de HEERE: Och Heere! ik ben geen man die goed kan spreken, niet van gisteren, niet van eergisteren, en ook niet van toen af, toen U tot Uw knecht gesproken hebt; want ik ben zwaar van mond, en zwaar van tong.","1 Kon 20:35":"Toen zei een man uit de zonen van de profeten tegen zijn naaste, door het woord van de HEERE: Sla mij toch. En de man weigerde hem te slaan.","Gen 2:2":"Toen God op de zevende dag Zijn werk voltooid had, dat Hij gemaakt had, heeft Hij op de zevende dag gerust van al Zijn werk, dat Hij gemaakt had.","Rom 4:8":"Gelukkig is de man, aan wie de Heere de zonden niet toerekent.","Gen 22:16":"En zei: Ik zweer bij Mijzelf, spreekt de HEERE; omdat u dit gedaan hebt, en uw zoon, uw enige, niet onthouden hebt;","Matt 23:34-37":"Daarom, zie, Ik zend tot u profeten, en wijzen, en schriftgeleerden, en van hen zult u sommigen doden en kruisigen, en sommigen van hen zult u geselen in uw synagogen, en vervolgen van stad tot stad; opdat over u komt al het rechtvaardige bloed dat vergoten is op de aarde, vanaf het bloed van de rechtvaardige Abel tot het bloed van Zacharia, de zoon van Barachia, die u gedood hebt tussen de tempel en het altaar. Voorwaar, Ik zeg u: Al deze dingen zullen komen over dit geslacht.","Dan 10:7-9":"En ik, Daniël, zag alleen dat gezicht, maar de mannen die bij mij waren, zagen dat gezicht niet; maar er viel een grote schrik op hen, en zij vluchtten om zich te verbergen. Ik dan bleef alleen achter, en zag dit grote gezicht, en er bleef in mij geen kracht over; en mijn schoonheid veranderde in verval, zodat ik geen kracht behield. En ik hoorde de stem van Zijn woorden; en toen ik de stem van Zijn woorden hoorde, viel ik in een diepe slaap op mijn gezicht, met mijn gezicht op de grond.","1 Petr 3:15":"maar heilig God, de Heere, in uw harten; en wees altijd bereid tot verantwoording aan ieder die u rekenschap vraagt van de hoop die in u is, met zachtmoedigheid en vreze,","Hebr 10:5-7":"Daarom zegt Hij, bij Zijn komst in de wereld: Slachtoffer en offergave hebt U niet gewild, maar U hebt Mij een lichaam toebereid; Brandoffers en offers voor de zonde hebben U niet behaagd. Toen zei Ik: Zie, Ik kom (in het begin van het boek is over Mij geschreven) om Uw wil te doen, o God!","Gen 22:17":"Voorzeker zal Ik u rijk zegenen, en uw nageslacht zeer talrijk maken, als de sterren van de hemel, en als het zand dat aan de oever van de zee is; en uw nageslacht zal de poort van zijn vijanden erfelijk bezitten.","Rom 4:17":"(Zoals geschreven staat: Ik heb u tot een vader van veel volken gesteld) voor Hem, aan Wie hij geloofd heeft, namelijk God, Die de doden levend maakt, en de dingen die niet zijn roept alsof zij waren;","Ps 102:23":"Wanneer de volken samen zullen vergaderd worden, ook de koninkrijken, om de HEERE te dienen.","Ps 96:6":"Majesteit en heerlijkheid zijn voor Zijn aangezicht, sterkte en sieraad in Zijn heiligdom.","Ex 33:19":"Doch Hij zei: Ik zal al Mijn goedheid voorbij uw aangezicht laten gaan, en zal de Naam van de HEERE uitroepen voor uw aangezicht; maar Ik zal genadig zijn aan wie Ik genadig zal zijn, en Ik zal Mij ontfermen over wie Ik Mij ontfermen zal.","Jer 1:6":"Toen zei ik: Ach, Heere HEERE! zie, ik kan niet spreken, want ik ben jong.","Hebr 11:38":"(de wereld was hen niet waard) zij hebben rondgedoold in woestijnen, en op bergen, en in spelonken, en in holen van de aarde.","Ex 20:12":"Eer uw vader en uw moeder, opdat uw dagen verlengd worden in het land dat de HEERE, uw God, u geeft.","Luk 9:62":"En Jezus zei tegen hem: Niemand die zijn hand aan de ploeg slaat en achterom kijkt, is geschikt voor het Koninkrijk van God.","Hand 21:10":"En toen wij daar veel dagen gebleven waren, kwam er een zekere profeet uit Judea aan, met de naam Agabus.","Hand 7:50":"Heeft Mijn hand niet al deze dingen gemaakt?","Ex 9:16":"Maar juist daarom heb Ik u laten opstaan, opdat Ik Mijn kracht aan u zou tonen, en opdat men Mijn Naam vertelt op de hele aarde.","Ex 33:9":"En het gebeurde, als Mozes de tent binnengegaan was, dat de wolkkolom neerdaalde en bleef staan in de deur van de tent, en Hij sprak met Mozes.","Luk 20:37":"En dat de doden opgewekt zullen worden, heeft ook Mozes aangewezen bij de doornstruik, toen hij de Heere de God van Abraham noemt, en de God van Izak, en de God van Jakob.","Zach 9:9":"Verheug u zeer, dochter van Sion! Juich, dochter van Jeruzalem! Zie, uw Koning zal tot u komen, rechtvaardig, en Hij is een Heiland; arm, en rijdend op een ezel, en op een veulen, het jong van de ezelinnen.","2 Kor 6:18":"en Ik zal u tot een Vader zijn, en u zult Mij tot zonen en dochters zijn, zegt de Heere, de Almachtige.","Ps 69:24":"Laat hun ogen duister worden, dat zij niet zien; en doe hun heupen voortdurend waggelen.","2 Kor 1:20":"Want zoveel beloften van God er ook zijn, die zijn in Hem ja, en zijn in Hem amen, tot heerlijkheid van God door ons.","Ps 118:26":"Gezegend is hij die daar komt in de Naam van de HEERE! Wij zegenen u uit het huis van de HEERE.","Jes 10:23":"Want een verdelging, die vast besloten is, zal de Heere HEERE van de heerscharen doen in het midden van dit hele land.","Joh 10:34":"Jezus antwoordde hun: Staat er niet geschreven in uw wet: Ik heb gezegd, u bent goden?","Ex 34:5":"De HEERE nu kwam neerwaarts in een wolk, en stelde Zich daar bij hem; en Hij riep de Naam van de HEERE uit.","Ex 2:13":"De volgende dag ging hij er weer op uit, en zie, twee Hebreeuwse mannen waren aan het vechten; en hij zei tegen degene die ongelijk had: Waarom slaat u uw naaste?","Jes 8:18":"Zie, ik en de kinderen die de HEERE mij gegeven heeft, zijn tot tekenen en tot wonderen in Israël, van de HEERE van de heerscharen, Die op de berg Sion woont.","Jer 20:14-18":"Vervloekt zij de dag waarop ik geboren ben; de dag waarop mijn moeder mij gebaard heeft, die zij niet gezegend! Vervloekt zij de man die mijn vader boodschapte en zei: U is een zoon geboren, waardoor hij hem zeer verblijdde! Ja, laat die man zijn als de steden die de HEERE heeft omgekeerd, en het heeft Hem niet berouwd; en laat hij in de morgenstond een geroep horen, en op de middag een geschreeuw.","Hebr 4:7":"bepaalt Hij opnieuw een zekere dag, namelijk heden, doordat Hij door David zegt, zo lange tijd daarna (zoals gezegd is): Heden, als u Zijn stem hoort, verhard dan uw harten niet.","1 Kon 16:31-33":"En het gebeurde (was het een lichte zaak dat hij wandelde in de zonden van Jerobeam, de zoon van Nebat?), dat hij ook nog Izebel, de dochter van Eth-baal, de koning van de Sidoniërs, tot vrouw nam, en heenging, en Baäl diende, en zich voor hem neerboog. En hij richtte voor Baäl een altaar op, in het huis van Baäl, dat hij te Samaria gebouwd had. Ook maakte Achab een gewijd bos, zodat Achab nog meer deed om de HEERE, de God van Israël, tot toorn te verwekken, dan alle koningen van Israël die voor hem geweest waren.","Rom 11:27":"En dit is hun een verbond van Mij, als Ik hun zonden zal wegnemen.","Jes 11:10":"Want het zal gebeuren op die dag, dat de heidenen zullen vragen naar de Wortel van Isaï, Die zal staan als een banier voor de volken, en Zijn rust zal heerlijk zijn.","Matt 28:17":"En toen zij Hem zagen, aanbaden zij Hem; maar sommigen twijfelden.","Ps 95:11":"Daarom heb Ik in Mijn toorn gezworen: Zij zullen in Mijn rust niet ingaan!","Openb 16:18":"En er kwamen stemmen, en donderslagen, en bliksemflitsen; en er kwam een grote aardbeving, wat voor aardbeving niet is voorgekomen sinds er mensen op de aarde geweest zijn, namelijk zo'n aardbeving, en zo groot.","Gen 19:30":"En Lot trok weg uit Zoar, en woonde op de berg, en zijn twee dochters met hem; want hij was bang om in Zoar te wonen. En hij woonde in een grot, hij en zijn twee dochters.","2 Kon 19:27":"Maar Ik weet uw zitten, en uw uitgaan, en uw binnenkomen, en uw woeden tegen Mij.","Micha 1:1":"Het woord van de HEERE, dat gebeurd is tot Micha, de Morastiet, in de dagen van Jotham, Achaz en Jehizkia, koningen van Juda; dat hij gezien heeft over Samaria en Jeruzalem.","Jes 48:9":"Om Mijn Naams wil zal Ik Mijn toorn langer uitstellen, en om het roem van Mij wil zal Ik, u ten goede, Mij bedwingen, opdat Ik u niet afhouw.","Jes 11:1":"Want er zal een Rijsje voortkomen uit de afgehouwen tronk van Isaï, en een Scheut uit zijn wortels zal vrucht voortbrengen.","1 Petr 2:24":"Die Zelf onze zonden in Zijn lichaam gedragen heeft op het hout; opdat wij, voor de zonden afgestorven, voor de gerechtigheid zouden leven; door Wiens striemen u genezen bent.","Matt 2:15":"en hij was daar tot de dood van Herodes; opdat vervuld zou worden wat door de Heere gesproken is door de profeet: Uit Egypte heb Ik Mijn Zoon geroepen.","Job 35:5-7":"Kijk naar de hemel en zie; en aanschouw de bovenste wolken, zij zijn hoger dan u. Als u zondigt, wat doet u Hem daarmee aan? Als uw overtredingen talrijk zijn, wat doet u Hem daarmee? Als u rechtvaardig bent, wat geeft u Hem, of wat ontvangt Hij uit uw hand?","Ps 82:6":"Ik heb wel gezegd: U bent goden; en u bent allen kinderen van de Allerhoogste;","Ex 23:23":"Want Mijn Engel zal voor uw aangezicht gaan, en Hij zal u brengen tot de Amorieten, en Hethieten, en Ferezieten, en Kanaänieten, Hevieten, en Jebusieten; en Ik zal hen uitroeien.","Hand 7:55":"Maar hij, vol van de Heilige Geest, hield de ogen gericht naar de hemel, en zag de heerlijkheid van God, en Jezus, staande aan de rechterhand van God.","Ex 33:21-23":"De HEERE zei verder: Zie, er is een plaats bij Mij; daar zult u zich op de steenrots stellen. En het zal gebeuren, wanneer Mijn heerlijkheid voorbijgaat, dat Ik u in een kloof van de steenrots zal zetten; en Ik zal u met Mijn hand overdekken, totdat Ik voorbijgegaan zal zijn. En wanneer Ik Mijn hand zal hebben weggenomen, zult u Mijn achterste delen zien; maar Mijn aangezicht zal niet gezien worden!","2 Kon 6:8-12":"En de koning van Syrië voerde oorlog tegen Israël, en overlegde met zijn knechten, en zei: Mijn legerplaats zal zijn bij die en die plaats. Maar de man van God zond bericht aan de koning van Israël, en zei: Wacht u ervoor dat u door die plaats trekt, want de Syriërs zijn daarheen afgekomen. Daarom zond de koning van Israël bericht naar die plaats, waarover de man van God hem gezegd en gewaarschuwd had, en hij wachtte zich daar, niet één keer, en niet twee keer.","Hand 21:4":"En wij vonden de discipelen en bleven daar zeven dagen; die zeiden door de Geest tegen Paulus dat hij niet naar Jeruzalem moest gaan.","1 Kon 8:9":"Er was niets in de ark, dan alleen de twee stenen platen, die Mozes bij Horeb daarin gelegd had, toen de HEERE een verbond maakte met de kinderen van Israël, toen zij uit Egypteland waren uitgetrokken.","1 Kon 22:28":"En Micha zei: Als u ooit in vrede terugkomt, dan heeft de HEERE niet door mij gesproken! Verder zei hij: Hoor, alle volken!","Jes 48:11":"Om Mijnentwil, om Mijnentwil zal Ik het doen, want hoe zou Hij ontheiligd worden? En Ik zal Mijn eer aan geen ander geven.","Ezech 3:23":"En ik maakte mij op, en ging uit naar de vallei, en zie, de heerlijkheid van de HEERE stond daar, gelijk de heerlijkheid, die ik gezien had bij de rivier Chebar; en ik viel op mijn gezicht.","1 Sam 13:6":"Toen de mannen van Israël zagen dat zij in nood waren (want het volk was benauwd), verborg het volk zich in de holen, en in de doornstruiken, en in de rotsen, en in de vestingen, en in de putten.","1 Kon 18:43":"En hij zei tegen zijn knecht: Ga nu op, en kijk uit naar de zee. Toen ging hij op, en keek uit, en zei: Er is niets. Toen zei hij: Ga weer terug, zevenmaal.","Job 9:32":"Want Hij is geen man zoals ik, die ik antwoorden zou, zodat wij samen voor het gericht zouden komen.","Ps 37:3":"Beth. Vertrouw op de HEERE, en doe het goede; bewoon de aarde, en voed u met trouw.","Jes 29:10":"Want de HEERE heeft over u uitgegoten een geest van diepe slaap, en Hij heeft uw ogen dichtgesloten; de profeten, en uw hoofden, en de zieners heeft Hij verblind.","Zach 1:12":"Toen antwoordde de Engel van de HEERE, en zei: HEERE van de heerscharen! Hoelang zult U Zich niet ontfermen over Jeruzalem en over de steden van Juda, op wie U toornig geweest bent, deze zeventig jaren?","Ex 4:10-14":"Toen zei Mozes tegen de HEERE: Och Heere! ik ben geen man die goed kan spreken, niet van gisteren, niet van eergisteren, en ook niet van toen af, toen U tot Uw knecht gesproken hebt; want ik ben zwaar van mond, en zwaar van tong. En de HEERE zei tegen hem: Wie heeft de mens de mond gemaakt, of wie maakt de stomme, of dove, of ziende, of blinde? Ben Ik het niet, de HEERE? En nu ga heen, en Ik zal met uw mond zijn, en zal u leren, wat u spreken zult.","Jes 1:4":"Wee het zondige volk, het volk van zware ongerechtigheid, het nageslacht van de boosdoeners, de verdervende kinderen! Zij hebben de HEERE verlaten, zij hebben de Heilige van Israël gelasterd, zij hebben zich vervreemd, wijkende achterwaarts.","Luk 11:50":"Opdat van dit geslacht opgeëist wordt het bloed van al de profeten, dat vergoten is vanaf de grondlegging van de wereld.","Matt 23:34":"Daarom, zie, Ik zend tot u profeten, en wijzen, en schriftgeleerden, en van hen zult u sommigen doden en kruisigen, en sommigen van hen zult u geselen in uw synagogen, en vervolgen van stad tot stad;","Hand 2:36":"Laat dan het hele huis van Israël zeker weten dat God Hem tot een Heere en Christus gemaakt heeft, namelijk deze Jezus, Die u gekruisigd hebt.","Num 11:17":"Dan zal Ik neerkomen en daar met u spreken; en van de Geest die op u is, zal Ik afnemen, en op hen leggen; en zij zullen met u de last van dit volk dragen, opdat u die niet alleen draagt.","Jes 55:3":"Neig uw oor, en kom tot Mij, hoor en uw ziel zal leven; want Ik zal met u een eeuwig verbond maken, en u geven de zekere weldaden van David.","Jona 1:4":"Maar de HEERE wierp een grote wind op de zee; en er kwam een grote storm in de zee, zodat het schip dreigde te breken.","Job 5:13":"Hij vangt de wijzen in hun arglistigheid; zodat de raad van de verdraaiden overhaast valt.","Ps 94:11":"De HEERE kent de gedachten van de mens, dat zij vluchtig zijn.","Ps 2:1":"Waarom woeden de heidenen, en bedenken de volken iets zinloos?","Joh 12:15":"Vrees niet, dochter van Sion, zie, uw Koning komt, zittend op het veulen van een ezelin.","Dan 8:16":"En ik hoorde tussen de oevers van de Ulai een mensenstem, die riep en zei: Gabriël! leg deze man het gezicht uit.","Ex 33:18-20":"Toen zei hij: Toon mij nu Uw heerlijkheid! Doch Hij zei: Ik zal al Mijn goedheid voorbij uw aangezicht laten gaan, en zal de Naam van de HEERE uitroepen voor uw aangezicht; maar Ik zal genadig zijn aan wie Ik genadig zal zijn, en Ik zal Mij ontfermen over wie Ik Mij ontfermen zal. Hij zei verder: U zou Mijn aangezicht niet kunnen zien; want Mij zal geen mens zien en leven.","Ex 21:17":"Wie ook zijn vader of zijn moeder vervloekt, die zal zeker gedood worden.","Ps 118:22":"De steen, die de bouwlieden verworpen hadden, is tot een hoofd van de hoek geworden.","Matt 1:23":"Zie, de maagd zal zwanger worden en een Zoon baren, en u zult Hem de naam Emmanuel geven; dat betekent, vertaald: God met ons.","2 Kor 4:15":"Want al deze dingen zijn om uw wil, opdat de vermenigvuldigde genade, door de dankzegging van velen, overvloedig wordt tot heerlijkheid van God.","2 Kron 13:10":"Maar wat ons betreft, de HEERE is onze God, en wij hebben Hem niet verlaten; en de priesters die de HEERE dienen, zijn de zonen van Aäron, en de Levieten zijn bezig met hun werk.","1 Kon 22:8":"Toen zei de koning van Israël tegen Josafat: Er is nog een man om door hem de HEERE te vragen; maar ik haat hem, omdat hij over mij niets goeds profeteert, maar kwaad: Micha, de zoon van Jimla. En Josafat zei: De koning moet dat niet zeggen!","Hos 10:8":"En de hoogten van Aven, Israëls zonde, zullen vernietigd worden; doorns en distels zullen op hun altaren opkomen; en zij zullen tegen de bergen zeggen: Bedek ons! en tegen de heuvels: Val op ons!","Ruth 1:17":"Waar u zult sterven, zal ik sterven, en daar zal ik begraven worden; zo doe mij de HEERE en zo doe Hij daar nog aan toe, als niet de dood alléén scheiding zal maken tussen mij en u!","Fil 2:10":"Opdat in de Naam van Jezus zich zou buigen elke knie van hen die in de hemel, en die op de aarde, en die onder de aarde zijn.","Ps 72:19":"En geloofd zij de Naam van Zijn heerlijkheid tot in eeuwigheid; en de hele aarde moet met Zijn heerlijkheid vervuld worden. Amen, ja, amen.","Ps 96:3":"Vertelt onder de heidenen Zijn eer, onder alle volken Zijn wonderen.","Joz 10:16-27":"Maar die vijf koningen waren gevlucht, en hadden zich verborgen in de grot bij Makkeda. En aan Jozua werd gemeld: Die vijf koningen zijn gevonden, verborgen in de grot bij Makkeda. Toen zei Jozua: Rol grote stenen voor de opening van de grot, en zet mannen ervoor om hen te bewaken.","Jes 40:3":"Een stem van iemand die roept in de woestijn: Bereidt de weg van de HEERE, maakt recht in de wildernis een baan voor onze God!","Ex 40:35":"Zodat Mozes niet in de tent der samenkomst kon ingaan, omdat de wolk daarop bleef, en de heerlijkheid van de HEERE de tabernakel vervulde.","Jes 6:13":"Toch zal er nog een tiende deel in zijn, en het zal terugkeren, en zijn om af te weiden; maar zoals de eik, en zoals de haageik, waarin na het afwerpen van hun bladeren nog steunsel is, zo zal het heilige zaad het steunsel daarvan zijn.","Matt 8:17":"opdat vervuld zou worden wat gesproken was door de profeet Jesaja, die zei: Hij heeft onze ziekten op Zich genomen, en onze kwalen gedragen.","Hand 2:25-28":"Want David zegt van Hem: Ik zag de Heere altijd voor mij; want Hij is aan mijn rechterhand, opdat ik niet bewogen zou worden. Daarom is mijn hart verblijd, en mijn tong verheugt zich; ja, ook mijn vlees zal rusten in hoop; Want U zult mijn ziel niet verlaten in het rijk van de dood, en Uw Heilige zult U niet overgeven om verderving te zien.","Deut 29:25":"Dan zal men zeggen: Omdat zij het verbond van de HEERE, de God van hun vaderen, verlaten hebben, dat Hij met hen gemaakt had, toen Hij hen uit Egypteland uitleidde;","Ezra 5:2":"Toen maakten Zerubbabel, de zoon van Sealthiël, en Jesua, de zoon van Jozadak, zich op en begonnen het huis van God te bouwen, Dat te Jeruzalem woont; en met hen de profeten van God, die hen ondersteunden.","1 Petr 3:10-12":"Want wie het leven wil liefhebben en goede dagen wil zien, die moet zijn tong weerhouden van het kwade, en zijn lippen, zodat ze geen bedrog spreken; hij moet wijken van het kwade en het goede doen; hij moet vrede zoeken en die najagen. Want de ogen van de Heere zijn over de rechtvaardigen, en Zijn oren gericht op hun gebed; maar het aangezicht van de Heere is tegen hen die kwaad doen.","Hand 7:7":"En het volk dat zij zullen dienen, zal Ik oordelen, zei God; en daarna zullen zij uitgaan, en zij zullen Mij dienen op deze plaats.","Jes 6:9":"Toen zei Hij: Ga heen, en zeg tegen dit volk: Blijf horen, maar begrijp het niet, en blijf zien, maar merk het niet op.","Ex 33:21":"De HEERE zei verder: Zie, er is een plaats bij Mij; daar zult u zich op de steenrots stellen.","1 Tim 6:16":"Die als enige onsterfelijkheid heeft, en een ontoegankelijk licht bewoont; aan Wie geen mens gezien heeft, en ook niet zien kan; aan Wie eer en eeuwige kracht zij. Amen.","Hebr 4:3":"Want wij die geloofd hebben, gaan de rust in, zoals Hij gezegd heeft: Zo heb Ik dan in Mijn toorn gezworen: Zij zullen Mijn rust niet ingaan! Hoewel Zijn werken al vanaf de grondlegging van de wereld volbracht waren.","Hos 12:1":"Die van Efraïm hebben Mij omsingeld met leugen, en het huis van Israël met bedrog; maar Juda heerste nog met God, en was met de heiligen getrouw.","Rom 1:1":"Paulus, een dienstknecht van Jezus Christus, een geroepen apostel, afgezonderd tot het Evangelie van God,","Hand 24:25":"En toen hij sprak over rechtvaardigheid, en zelfbeheersing, en over het komende oordeel, werd Felix zeer bevreesd, en antwoordde: Voor nu kunt u gaan; en wanneer ik een geschikte tijd zal hebben, zal ik u weer bij mij roepen.","Zach 13:7":"Zwaard! Word wakker tegen Mijn Herder, en tegen de Man Die Mijn Metgezel is, spreekt de HEERE van de heerscharen; sla die Herder, en de schapen zullen verstrooid worden; maar Ik zal Mijn hand tot de kleinen wenden.","Ex 24:16":"En de heerlijkheid van de HEERE woonde op de berg Sinaï, en de wolk bedekte hem zes dagen, en op de zevende dag riep Hij Mozes uit het midden van de wolk.","Ef 4:25":"Daarom, leg de leugen af, en spreek de waarheid, ieder met zijn naaste; want wij zijn elkaars leden.","1 Sam 16:13":"Toen nam Samuël de oliehoorn, en zalfde hem te midden van zijn broers. En de Geest van de HEERE kwam vanaf die dag over David, en bleef. Daarna stond Samuël op, en ging naar Rama.","Luk 7:27":"Deze is het, over wie geschreven is: Zie, Ik zend Mijn engel voor Uw aangezicht uit, die Uw weg voor U klaar zal maken.","Ps 97:7":"Beschaamd moeten worden allen die de beelden dienen, die zich op afgoden beroemen; buig u neer voor Hem, alle goden!","Joz 22:34":"En de kinderen van Ruben en de kinderen van Gad noemden dat altaar: Getuige, want het zij een getuige tussen ons, dat de HEERE God is.","Rom 9:26":"En het zal zijn: op de plaats waar tot hen gezegd was: U bent Mijn volk niet, daar zullen zij kinderen van de levende God genoemd worden.","Mark 12:26":"Maar wat de doden betreft, dat zij opgewekt zullen worden: hebt u niet gelezen in het boek van Mozes, hoe God in de doornstruik tot hem gesproken heeft: Ik ben de God van Abraham, en de God van Izak, en de God van Jakob?","Matt 4:18-22":"En Jezus liep langs de zee van Galilea en zag twee broers, namelijk Simon, genaamd Petrus, en Andreas, zijn broer, die een net in de zee wierpen (want zij waren vissers); en Hij zei tegen hen: Volg Mij, en Ik zal u vissers van mensen maken. Zij lieten meteen de netten achter en volgden Hem na.","Deut 21:23":"Dan zal zijn dode lichaam niet aan het hout overnachten; maar u zult hem beslist diezelfde dag begraven; want een opgehangene is door God vervloekt. Zo zult u uw land niet verontreinigen, dat de HEERE, uw God, u als erfdeel geeft.","Hebr 1:13":"En tegen wie van de engelen heeft Hij ooit gezegd: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gezet heb?","Ezech 33:22":"Nu was de hand van de HEERE 's avonds op mij geweest, voordat wie ontkomen was kwam, en Hij had mijn mond geopend, totdat hij 's morgens tot mij kwam. Zo werd mijn mond geopend, en ik was niet meer stom.","Ezech 3:24":"Toen kwam de Geest in mij, en stelde mij op mijn voeten, en Hij sprak met mij, en zei tot mij: Ga, sluit u binnen in uw huis.","Ps 8:10":"O HEERE, onze Heere! Hoe heerlijk is Uw Naam op de hele aarde!","Ps 22:19":"Zij delen mijn kleren onder zich, en werpen het lot over mijn gewaad.","Gen 12:12":"En het zal gebeuren, wanneer de Egyptenaren u zien, dat zij zullen zeggen: Dat is zijn vrouw; en zij zullen mij doden, en u in leven laten.","Jer 42:5":"Toen zeiden zij tegen Jeremia: De HEERE zij tussen ons tot een waarachtig en betrouwbaar Getuige: als wij niet handelen naar elk woord waarmee de HEERE, uw God, u naar ons toe zal zenden!","Ex 3:1":"Mozes hoedde de kudde van Jethro, zijn schoonvader, de priester in Midian; en hij leidde de kudde tot voorbij de woestijn, en hij kwam aan de berg van God, aan Horeb.","Nahum 1:3":"De HEERE is geduldig, maar van grote kracht, en Hij houdt de schuldige zeker niet onschuldig. De weg van de HEERE is in wervelwind en in storm, en de wolken zijn het stof van Zijn voeten.","Lev 11:44":"Want Ik ben de HEERE, uw God; daarom zult u uzelf heiligen, en heilig zijn, omdat Ik heilig ben; en u zult uw ziel niet verontreinigen aan enig kruipend gedierte dat zich op de aarde beweegt.","Matt 4:18":"En Jezus liep langs de zee van Galilea en zag twee broers, namelijk Simon, genaamd Petrus, en Andreas, zijn broer, die een net in de zee wierpen (want zij waren vissers);","2 Kon 9:6-14":"Toen stond hij op, en ging het huis in; hij goot de olie op zijn hoofd, en zei tegen hem: Zo zegt de HEERE, de God van Israël: Ik heb u gezalfd tot koning over het volk van de HEERE, over Israël. En u zult het huis van Achab, uw heer, verslaan, opdat Ik het bloed van Mijn knechten, de profeten, en het bloed van alle knechten van de HEERE, wreekt op de hand van Izebel. En het hele huis van Achab zal omkomen; en Ik zal van Achab uitroeien wie mannelijk is, ook wie in Israël opgesloten is en wie verlaten is.","Jes 61:1":"De Geest van de Heere HEERE is op Mij, omdat de HEERE Mij gezalfd heeft, om een blijde boodschap te brengen aan de zachtmoedigen; Hij heeft Mij gezonden om te verbinden de gebrokenen van hart, om de gevangenen vrijheid uit te roepen, en de gebondenen opening van de gevangenis;","Luk 11:51":"Van het bloed van Abel tot het bloed van Zacharia, die omgekomen is tussen het altaar en het huis van God; ja, Ik zeg u, het zal opgeëist worden van dit geslacht!","1 Kon 18:30":"Toen zei Elia tegen heel het volk: Kom naar mij toe. En heel het volk kwam naar hem toe; en hij herstelde het altaar van de HEERE, dat was afgebroken.","Ps 104:4":"Hij maakt Zijn engelen geesten, Zijn dienaars tot een vlammend vuur.","Dan 6:23":"Mijn God heeft Zijn engel gezonden, en Hij heeft de bek van de leeuwen dichtgehouden, zodat zij mij niet beschadigd hebben, omdat voor Zijn aangezicht onschuld in mij gevonden is; en ook heb ik, o koning, tegen u geen misdaad begaan.","Ps 91:11":"Want Hij zal Zijn engelen aangaande u bevelen, dat zij u bewaren op al uw wegen.","Gen 15:14":"Maar Ik zal ook het volk rechten dat zij zullen dienen; en daarna zullen zij uittrekken met veel bezit.","Num 24:15":"Toen hief hij zijn spreuk op en zei: Bileam, de zoon van Beor, spreekt, en die man wiens ogen geopend zijn, spreekt!","Rom 10:20":"En Jesaja durft het aan, en zegt: Ik ben gevonden door hen die Mij niet zochten; Ik ben openbaar geworden aan hen die naar Mij niet vroegen.","Deut 7:21":"Schrik niet terug voor hen; want de HEERE, uw God, is in uw midden, een groot en ontzagwekkend God.","Matt 19:27":"Toen antwoordde Petrus, en zei tegen Hem: Zie, wij hebben alles verlaten, en zijn U gevolgd, wat zal ons dan geworden?","Ex 24:13":"Toen maakte Mozes zich op, met Jozua, zijn dienaar; en Mozes klom op de berg van God.","Jes 40:3-5":"Een stem van iemand die roept in de woestijn: Bereidt de weg van de HEERE, maakt recht in de wildernis een baan voor onze God! Alle dalen zullen verhoogd worden, en alle bergen en heuvels zullen vernederd worden; en wat krom is, dat zal recht, en wat hobbelig is, dat zal tot een vallei gemaakt worden. En de heerlijkheid van de HEERE zal geopenbaard worden; en alle vlees tegelijk zal zien, dat de mond van de HEERE het gesproken heeft.","Amos 6:2":"Ga over naar Kalne, en zie toe; en ga vandaar naar Hamath, de grote stad, en trek af naar Gath van de Filistijnen; zijn zij beter dan deze koninkrijken, of is hun gebied groter dan uw gebied?","Ef 4:8":"Daarom zegt Hij: Toen Hij opgevaren is in de hoogte, heeft Hij de gevangenis gevangengenomen, en heeft Hij de mensen gaven gegeven."},"noten":{"1":"D.i. legermachten"},"koppeling":{"1":"<span class=\"wl\" data-l=\"L1\" data-code=\"H256\">Achab</span> vertelde <span class=\"wl\" data-l=\"L2\" data-code=\"H348\">Izebel</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H3605\">alles</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H834\">wat</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H452\">Elia</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H6213\">gedaan</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H256\">had</span>, <span class=\"wl\" data-l=\"L1\" data-code=\"H256\">en</span> ook dat <span class=\"wl\" data-l=\"L7\" data-code=\"H2026\">hij</span> alle <span class=\"wl\" data-l=\"L8\" data-code=\"H5030\">profeten</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H5030\">met</span> <span class=\"wl\" data-l=\"L9\ span> It is <span class=\"wl wl-kjv\" data-code=\"H7227\">enough;</span> now, O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> take <span class=\"wl wl-kjv\" data-code=\"H3947\">away</span> my <span class=\"wl wl-kjv\" data-code=\"H5315\">life;</span> for I am not <span class=\"wl wl-kjv\" data-code=\"H2896\">better</span> than my <span class=\"wl wl-kjv\" data-code=\"H1\">fathers.</span>","5":"And as he <span class=\"wl wl-kjv\" data-code=\"H7901\">lay</span> and <span class=\"wl wl-kjv\" data-code=\"H3462\">slept</span> under <span class=\"wl wl-kjv\" data-code=\"H259\">a</span> juniper <span class=\"wl wl-kjv\" data-code=\"H7574\">tree,</span> behold, then an <span class=\"wl wl-kjv\" data-code=\"H4397\">angel</span> <span class=\"wl wl-kjv\" data-code=\"H5060\">touched</span> him, and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H6965\">Arise</span> and <span class=\"wl wl-kjv\" data-code=\"H398\">eat.</span>","6":"And he <span class=\"wl wl-kjv\" data-code=\"H5027\">looked,</span> and, behold, there was a <span class=\"wl wl-kjv\" data-code=\"H5692\">cake</span> baken on the <span class=\"wl wl-kjv\" data-code=\"H7529\">coals,</span> and a <span class=\"wl wl-kjv\" data-code=\"H6835\">cruse</span> of <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> at his <span class=\"wl wl-kjv\" data-code=\"H4763\">head.</span> And he did <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> and <span class=\"wl wl-kjv\" data-code=\"H8354\">drink,</span> and laid him <span class=\"wl wl-kjv\" data-code=\"H7901\">down</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">again.</span>","7":"And the <span class=\"wl wl-kjv\" data-code=\"H4397\">angel</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> came <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> the second <span class=\"wl wl-kjv\" data-code=\"H8145\">time,</span> and <span class=\"wl wl-kjv\" data-code=\"H5060\">touched</span> him, and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">Arise</span> and <span class=\"wl wl-kjv\" data-code=\"H398\">eat;</span> because the <span class=\"wl wl-kjv\" data-code=\"H1870\">journey</span> is too <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> for thee.","8":"And he <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and did <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> and <span class=\"wl wl-kjv\" data-code=\"H8354\">drink,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> in the <span class=\"wl wl-kjv\" data-code=\"H3581\">strength</span> of that <span class=\"wl wl-kjv\" data-code=\"H396\">meat</span> <span class=\"wl wl-kjv\" data-code=\"H705\">forty</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> and <span class=\"wl wl-kjv\" data-code=\"H705\">forty</span> <span class=\"wl wl-kjv\" data-code=\"H3915\">nights</span> unto <span class=\"wl wl-kjv\" data-code=\"H2722\">Horeb</span> the <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God.</span>","9":"And he <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> thither unto a <span class=\"wl wl-kjv\" data-code=\"H4631\">cave,</span> and <span class=\"wl wl-kjv\" data-code=\"H3885\">lodged</span> there; and, behold, the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> came to him, and he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, What doest thou here, <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah?</span>","10":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I have been <span class=\"wl wl-kjv\" data-code=\"H7065\">very</span> <span class=\"wl wl-kjv\" data-code=\"H7065\">jealous</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts:</span> for the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> have <span class=\"wl wl-kjv\" data-code=\"H5800\">forsaken</span> thy <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant,</span> thrown <span class=\"wl wl-kjv\" data-code=\"H2040\">down</span> thine <span class=\"wl wl-kjv\" data-code=\"H4196\">altars,</span> and <span class=\"wl wl-kjv\" data-code=\"H2026\">slain</span> thy <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> with the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword;</span> and I, even I only, am <span class=\"wl wl-kjv\" data-code=\"H3498\">left;</span> and they <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> my <span class=\"wl wl-kjv\" data-code=\"H5315\">life,</span> to take it <span class=\"wl wl-kjv\" data-code=\"H3947\">away.</span>","11":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Go <span class=\"wl wl-kjv\" data-code=\"H3318\">forth,</span> and <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> upon the <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span> And, behold, the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> passed <span class=\"wl wl-kjv\" data-code=\"H5674\">by,</span> and a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> and <span class=\"wl wl-kjv\" data-code=\"H2389\">strong</span> <span class=\"wl wl-kjv\" data-code=\"H7307\">wind</span> <span class=\"wl wl-kjv\" data-code=\"H6561\">rent</span> the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains,</span> and brake in <span class=\"wl wl-kjv\" data-code=\"H7665\">pieces</span> the <span class=\"wl wl-kjv\" data-code=\"H5553\">rocks</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> but the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was not in the <span class=\"wl wl-kjv\" data-code=\"H7307\">wind:</span> and <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> the <span class=\"wl wl-kjv\" data-code=\"H7307\">wind</span> an <span class=\"wl wl-kjv\" data-code=\"H7494\">earthquake;</span> but the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was not in the <span class=\"wl wl-kjv\" data-code=\"H7494\">earthquake:</span>","12":"And <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> the <span class=\"wl wl-kjv\" data-code=\"H7494\">earthquake</span> a <span class=\"wl wl-kjv\" data-code=\"H784\">fire;</span> but the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was not in the <span class=\"wl wl-kjv\" data-code=\"H784\">fire:</span> and <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> the <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> a <span class=\"wl wl-kjv\" data-code=\"H1827\">still</span> <span class=\"wl wl-kjv\" data-code=\"H1851\">small</span> <span class=\"wl wl-kjv\" data-code=\"H6963\">voice.</span>","13":"And it was so, when <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> it, that he <span class=\"wl wl-kjv\" data-code=\"H3874\">wrapped</span> his <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> in his <span class=\"wl wl-kjv\" data-code=\"H155\">mantle,</span> and went <span class=\"wl wl-kjv\" data-code=\"H3318\">out,</span> and <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> in the entering <span class=\"wl wl-kjv\" data-code=\"H6607\">in</span> of the <span class=\"wl wl-kjv\" data-code=\"H4631\">cave.</span> And, behold, there came a <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> unto him, and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> What doest thou here, <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah?</span>","14":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I have been <span class=\"wl wl-kjv\" data-code=\"H7065\">very</span> <span class=\"wl wl-kjv\" data-code=\"H7065\">jealous</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts:</span> because the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> have <span class=\"wl wl-kjv\" data-code=\"H5800\">forsaken</span> thy <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant,</span> thrown <span class=\"wl wl-kjv\" data-code=\"H2040\">down</span> thine <span class=\"wl wl-kjv\" data-code=\"H4196\">altars,</span> and <span class=\"wl wl-kjv\" data-code=\"H2026\">slain</span> thy <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> with the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword;</span> and I, even I only, am <span class=\"wl wl-kjv\" data-code=\"H3498\">left;</span> and they <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> my <span class=\"wl wl-kjv\" data-code=\"H5315\">life,</span> to take it <span class=\"wl wl-kjv\" data-code=\"H3947\">away.</span>","15":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H3212\">Go,</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> on thy <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> to the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> of <span class=\"wl wl-kjv\" data-code=\"H1834\">Damascus:</span> and when thou <span class=\"wl wl-kjv\" data-code=\"H935\">comest,</span> <span class=\"wl wl-kjv\" data-code=\"H4886\">anoint</span> <span class=\"wl wl-kjv\" data-code=\"H2371\">Hazael</span> to be <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> over <span class=\"wl wl-kjv\" data-code=\"H758\">Syria:</span>","16":"And <span class=\"wl wl-kjv\" data-code=\"H3058\">Jehu</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5250\">Nimshi</span> shalt thou <span class=\"wl wl-kjv\" data-code=\"H4886\">anoint</span> to be <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> over <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> and <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H8202\">Shaphat</span> of <span class=\"wl wl-kjv\" data-code=\"H65\">Abelmeholah</span> shalt thou <span class=\"wl wl-kjv\" data-code=\"H4886\">anoint</span> to be <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> in thy room.","17":"And it shall come to pass, that him that <span class=\"wl wl-kjv\" data-code=\"H4422\">escapeth</span> the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> of <span class=\"wl wl-kjv\" data-code=\"H2371\">Hazael</span> shall <span class=\"wl wl-kjv\" data-code=\"H3058\">Jehu</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">slay:</span> and him that <span class=\"wl wl-kjv\" data-code=\"H4422\">escapeth</span> from the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> of <span class=\"wl wl-kjv\" data-code=\"H3058\">Jehu</span> shall <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">slay.</span>","18":"Yet I have <span class=\"wl wl-kjv\" data-code=\"H7604\">left</span> me <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> in <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> all the <span class=\"wl wl-kjv\" data-code=\"H1290\">knees</span> which have not <span class=\"wl wl-kjv\" data-code=\"H3766\">bowed</span> unto <span class=\"wl wl-kjv\" data-code=\"H1168\">Baal,</span> and every <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> which hath not <span class=\"wl wl-kjv\" data-code=\"H5401\">kissed</span> him.","19":"So he <span class=\"wl wl-kjv\" data-code=\"H3212\">departed</span> thence, and <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H8202\">Shaphat,</span> who was <span class=\"wl wl-kjv\" data-code=\"H2790\">plowing</span> with <span class=\"wl wl-kjv\" data-code=\"H8147\">twelve</span> <span class=\"wl wl-kjv\" data-code=\"H6776\">yoke</span> of oxen <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him, and he with the <span class=\"wl wl-kjv\" data-code=\"H8147\">twelfth:</span> and <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah</span> <span class=\"wl wl-kjv\" data-code=\"H5674\">passed</span> by him, and <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> his <span class=\"wl wl-kjv\" data-code=\"H155\">mantle</span> upon him.","20":"And he <span class=\"wl wl-kjv\" data-code=\"H5800\">left</span> the <span class=\"wl wl-kjv\" data-code=\"H1241\">oxen,</span> and <span class=\"wl wl-kjv\" data-code=\"H7323\">ran</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Let me, I pray thee, <span class=\"wl wl-kjv\" data-code=\"H5401\">kiss</span> my <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> and my <span class=\"wl wl-kjv\" data-code=\"H517\">mother,</span> and then I will <span class=\"wl wl-kjv\" data-code=\"H3212\">follow</span> thee. And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Go <span class=\"wl wl-kjv\" data-code=\"H3212\">back</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">again:</span> for what have I <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> to thee?","21":"And he returned <span class=\"wl wl-kjv\" data-code=\"H7725\">back</span> from <span class=\"wl wl-kjv\" data-code=\"H310\">him,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> a <span class=\"wl wl-kjv\" data-code=\"H6776\">yoke</span> of <span class=\"wl wl-kjv\" data-code=\"H1241\">oxen,</span> and <span class=\"wl wl-kjv\" data-code=\"H2076\">slew</span> them, and <span class=\"wl wl-kjv\" data-code=\"H1310\">boiled</span> their <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> with the <span class=\"wl wl-kjv\" data-code=\"H3627\">instruments</span> of the <span class=\"wl wl-kjv\" data-code=\"H1241\">oxen,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and they did <span class=\"wl wl-kjv\" data-code=\"H398\">eat.</span> Then he <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah,</span> and <span class=\"wl wl-kjv\" data-code=\"H8334\">ministered</span> unto him."}};

    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    if (!kjvTekst && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
