id van de HEERE uit Zijn plaats!","Jes 7:14":"Daarom zal de Heere Zelf u een teken geven; zie, een maagd zal zwanger worden, en zij zal een Zoon baren, en Zijn naam Immanuel noemen.","Spr 3:12":"Want de HEERE kastijdt hem die Hij liefheeft, ja, zoals een vader de zoon in wie hij een welbehagen heeft.","1 Kon 18:38":"Toen viel het vuur van de HEERE, en verteerde dat brandoffer, en dat hout, en die stenen, en dat stof, ja, likte dat water op dat in de geul was.","Deut 5:2":"De HEERE, onze God, heeft een verbond met ons gemaakt bij Horeb.","Ezech 3:12":"Toen nam de Geest mij op, en ik hoorde achter mij een stem van een groot ruisen, en zei: Geloofd zij de heerlijkheid van de HEERE uit Zijn plaats!","Deut 28:58":"Als u niet oplet om al de woorden van deze wet te doen, die in dit boek geschreven zijn, om deze heerlijke en ontzagwekkende Naam te vrezen, de HEERE, uw God;","Ex 19:3":"En Mozes klom op naar God. En de HEERE riep tot hem van de berg en zei: Zo zult u tot het huis van Jakob spreken, en de kinderen van Israël verkondigen:","Jer 9:2":"Och, dat ik in de woestijn een herberg voor reizigers had, dan zou ik mijn volk verlaten, en van hen wegtrekken; want zij zijn allemaal overspelers, een trouweloze hoop.","Ex 3:15":"Toen zei God verder tegen Mozes: Zo zult u tegen de kinderen van Israël zeggen: De HEERE, de God van uw vaderen, de God van Abraham, de God van Izak, en de God van Jakob, heeft mij tot u gezonden; dat is Mijn Naam eeuwig, en dat is Mijn gedachtenis van geslacht tot geslacht.","2 Kon 2:15":"Toen de zonen van de profeten, die tegenover te Jericho waren, hem zagen, zeiden zij: De geest van Elia rust op Elisa; en zij kwamen hem tegemoet, en bogen zich voor hem neer ter aarde.","Hos 6:7":"Maar zij hebben het verbond overtreden als Adam; daar hebben zij trouweloos tegen Mij gehandeld.","Judas 1:1":"Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:","Fil 1:11":"Vervuld met vruchten van de gerechtigheid, die door Jezus Christus zijn tot heerlijkheid en lof van God.","1 Sam 19:24":"En hij trok zelf ook zijn kleren uit, en hij profeteerde zelf ook, voor het aangezicht van Samuël; en hij viel naakt neer, diezelfde hele dag en de hele nacht. Daarom zegt men: Is Saul ook onder de profeten?","Ps 19:5":"Hun richtsnoer gaat uit over de hele aarde, en hun redenen tot het einde van de wereld; Hij heeft daarin een tent gesteld voor de zon.","Deut 18:15-19":"Een Profeet uit uw midden, uit uw broeders, zoals ik, zal de HEERE, uw God, u doen opstaan; naar Hem zult u luisteren, naar alles wat u van de HEERE, uw God, bij Horeb, op de dag van de samenkomst, gevraagd hebt, en zei: Ik wil de stem van de HEERE, mijn God, niet meer horen, en dit grote vuur wil ik niet meer zien, opdat ik niet sterf. Toen zei de HEERE tot mij: Het is goed, wat zij gesproken hebben.","Deut 4:4":"U daarentegen, die de HEERE, uw God, aanhing, u bent vandaag allemaal nog in leven.","Mark 12:10":"Hebt u deze Schrift niet gelezen: De steen die de bouwers verworpen hebben, die is tot een hoeksteen geworden;","Gen 26:7":"En toen de mannen van die plaats hem naar zijn vrouw vroegen, zei hij: Zij is mijn zuster; want hij was bang om te zeggen: mijn vrouw; want, dacht hij, misschien doden de mannen van deze plaats mij om Rebekka, want zij was mooi om te zien.","Jer 24:4":"Toen kwam het woord van de HEERE tot mij, en Hij zei:","Luk 4:8":"En Jezus antwoordde en zei tegen hem: Ga weg van Mij, satan, want er is geschreven: U zult de Heere, uw God, aanbidden, en Hem alleen dienen.","1 Sam 3:21":"En de HEERE ging door met verschijnen te Silo; want de HEERE openbaarde Zich aan Samuël te Silo, door het woord van de HEERE.","Jes 63:11":"Toch dacht Hij aan de dagen van ouds, aan Mozes en Zijn volk; maar nu, waar is Hij, Die hen uit de zee opgebracht heeft, met de herders van Zijn kudde? Waar is Hij, Die Zijn Heilige Geest in het midden van hen stelde?","1 Sam 10:6":"En de Geest van de HEERE zal vaardig worden over u, en u zult met hen profeteren; en u zult in een andere man veranderd worden.","Num 25:11":"Pinehas, de zoon van Eleazar, de zoon van Aäron, de priester, heeft Mijn grimmigheid van over de kinderen van Israël afgewend, omdat hij Mijn ijver geijverd heeft in hun midden, zodat Ik de kinderen van Israël in Mijn ijver niet vernietigd heb.","Amos 7:15":"Maar de HEERE nam mij van achter de kudde vandaan; en de HEERE zei tegen mij: Ga heen, profeteer tegen Mijn volk Israël.","Jer 27:2-22":"Zo zei de HEERE tegen mij: Maak u banden en jukken, en doe die om uw hals. En stuur ze naar de koning van Edom, en naar de koning van Moab, en naar de koning van de kinderen van Ammon, en naar de koning van Tyrus, en naar de koning van Sidon; door de hand van de boden die naar Jeruzalem komen, naar Zedekia, de koning van Juda. En beveel hun om tegen hun heren te zeggen: Zo zegt de HEERE van de heerscharen, de God van Israël: Zo zult u tegen uw heren zeggen:","Matt 22:24":"En zeiden: Meester! Mozes heeft gezegd: Als iemand sterft zonder kinderen te hebben, zal zijn broer met zijn vrouw trouwen en voor zijn broer nakomelingen verwekken.","Ef 3:8":"Aan mij, de allerminste van al de heiligen, is deze genade gegeven, om onder de heidenen door het Evangelie de onnaspeurlijke rijkdom van Christus te verkondigen,","Jes 52:12":"Want u zult niet haastig weggaan, en ook niet vluchtend heengaan; want de HEERE zal voor uw aangezicht heentrekken, en de God van Israël zal uw achterhoede zijn.","Spr 28:24":"Wie zijn vader of zijn moeder berooft, en zegt: Het is geen overtreding; die is de metgezel van een verwoestend man.","2 Kor 6:16":"Of welke samenvoeging heeft de tempel van God met de afgoden? Want u bent de tempel van de levende God; zoals God gezegd heeft: Ik zal in hen wonen, en Ik zal onder hen wandelen; en Ik zal hun God zijn, en zij zullen Mij een volk zijn.","Ps 50:5":"Verzamelt Mij Mijn gunstgenoten¹, die Mijn verbond maken met een offer!","Neh 10:1-39":"Wat betreft de verzegelingen: het waren Nehemia, de Tirsatha, zoon van Hachalja, en Zidkia, Seraja, Azarja, Jeremia, Pashur, Amarja, Malchia,","Matt 4:11":"Toen liet de duivel Hem los; en zie, de engelen kwamen naar Hem toe, en dienden Hem.","Hebr 10:38":"Maar de rechtvaardige zal uit het geloof leven; en als iemand zich terugtrekt, heeft Mijn ziel in hem geen behagen.","Rom 10:19":"Maar ik zeg: Heeft Israël het niet begrepen? Mozes zegt eerst: Ik zal u tot jaloersheid verwekken door hen die geen volk zijn; door een onverstandig volk zal Ik u tot toorn verwekken.","Ef 1:6":"Tot prijs van de heerlijkheid van Zijn genade, waardoor Hij ons begenadigd heeft in de Geliefde;","Rom 10:6-8":"Maar de rechtvaardigheid die uit het geloof is, spreekt zo: Zeg niet in uw hart: Wie zal naar de hemel opklimmen? Dat is: om Christus van boven af te brengen. Of: wie zal in de afgrond neerdalen? Dat is: om Christus uit de doden op te brengen. Maar wat zegt zij? Dicht bij u is het Woord, in uw mond en in uw hart. Dit is het Woord van het geloof, dat wij prediken;","Jes 52:10":"De HEERE heeft Zijn heilige arm ontbloot voor de ogen van alle heidenvolken; en alle einden van de aarde zullen het heil van onze God zien.","Luk 3:4-6":"zoals geschreven is in het boek van de woorden van Jesaja, de profeet, die zei: De stem van iemand die roept in de woestijn: Bereid de weg van de Heere, maak Zijn paden recht! Elk dal zal gevuld worden, en elke berg en heuvel zal verlaagd worden, en de kromme wegen zullen tot een rechte weg worden, en de oneffen tot effen wegen. En alle vlees zal de zaligheid van God zien.","Matt 4:19":"en Hij zei tegen hen: Volg Mij, en Ik zal u vissers van mensen maken.","1 Kor 1:31":"Opdat het zij, zoals geschreven is: Wie roemt, laat hij roemen in de Heere.","Ex 20:19":"en zij zeiden tegen Mozes: Spreek ú met ons, en wij zullen horen; en laat God niet met ons spreken, opdat wij niet sterven!","Matt 27:9":"Toen is vervuld wat gesproken is door de profeet Jeremia, die zei: En zij hebben de dertig zilverstukken genomen, de prijs van Hem Die gewaardeerd was, op wie de kinderen van Israël een waarde gesteld hadden;","Zach 12:10":"Doch over het huis van David, en over de inwoners van Jeruzalem, zal Ik uitstorten de Geest van de genade en van de gebeden; en zij zullen Mij aanschouwen, Die zij doorstoken hebben, en zij zullen over Hem rouwklagen, zoals met de rouwklacht over een enige zoon; en zij zullen over Hem bitter kermen, zoals men bitter kermt over een eerstgeborene.","Luk 20:42":"En David zelf zegt in het boek van de Psalmen: De Heere heeft gezegd tegen mijn Heere: Zit aan Mijn rechterhand,","1 Kon 17:24":"Toen zei die vrouw tegen Elia: Nu weet ik dat u een man van God bent, en dat het woord van de HEERE in uw mond waarheid is.","Ps 76:5":"U bent doorluchtiger en heerlijker dan de roofbergen.","Amos 7:10-17":"Toen stuurde Amazia, de priester te Beth-el, iemand naar Jerobeam, de koning van Israël, en zei: Amos heeft een samenzwering tegen u gesmeed, in het midden van het huis van Israël; het land kan al zijn woorden niet verdragen. Want zo zegt Amos: Jerobeam zal door het zwaard sterven, en Israël zal zeker uit zijn land gevankelijk worden weggevoerd. Daarna zei Amazia tegen Amos: Gij ziener, ga weg, vlucht naar het land van Juda, en eet daar brood, en profeteer daar.","Mal 1:2":"Ik heb u liefgehad, zegt de HEERE; maar u zegt: Waarin hebt U ons liefgehad? Was Ezau niet Jakobs broeder? spreekt de HEERE; toch heb Ik Jakob liefgehad,","2 Kon 3:11":"En Josafat zei: Is hier geen profeet van de HEERE, zodat wij door hem de HEERE kunnen raadplegen? Toen antwoordde een van de dienaren van de koning van Israël, en zei: Hier is Elisa, de zoon van Safat, die water op Elia's handen goot.","Num 22:27":"Toen de ezelin de Engel van de HEERE zag, ging zij liggen onder Bileam; en de toorn van Bileam ontstak, en hij sloeg de ezelin met een stok.","Ps 22:23":"Zo zal ik Uw Naam aan mijn broeders vertellen; in het midden van de gemeente zal ik U prijzen.","Rom 1:17":"Want de rechtvaardigheid van God wordt daarin geopenbaard uit geloof tot geloof; zoals geschreven is: Maar de rechtvaardige zal uit het geloof leven.","Ex 20:12-17":"Eer uw vader en uw moeder, opdat uw dagen verlengd worden in het land dat de HEERE, uw God, u geeft. U zult niet doodslaan. U zult geen echtbreuk plegen.","Amos 3:8":"De leeuw heeft gebruld, wie zou niet vrezen? De Heere HEERE heeft gesproken, wie zou niet profeteren?","Zach 1:7":"Op de vierentwintigste dag, in de elfde maand (dat is de maand Schebat), in het tweede jaar van Darius, kwam het woord van de HEERE tot Zacharia, de zoon van Berechja, de zoon van Iddo, de profeet, en hij zei:","Dan 7:10":"Een vurige rivier vloeide, en ging voor Hem uit, duizendmaal duizenden dienden Hem, en tien duizendmaal tien duizenden stonden voor Hem; het gericht zette zich, en de boeken werden geopend.","Kol 4:17":"En zeg tegen Archippus: Let op de bediening die u hebt aangenomen in de Heere, dat u die vervult.","Deut 5:24":"en u zei: Zie, de HEERE, onze God, heeft ons Zijn heerlijkheid en Zijn grootheid laten zien, en wij hebben Zijn stem gehoord uit het midden van het vuur; vandaag hebben wij gezien dat God met de mens spreekt, en dat hij levend blijft.","1 Kor 10:26":"want de aarde is van de Heere, en al wat zij bevat.","Ps 119:139":"Mijn ijver heeft mij doen vergaan, omdat mijn tegenstanders Uw woorden vergeten hebben.","Amos 7:7":"Nog liet Hij mij dit zien: zie, de Heere stond op een muur, die met een paslood gemaakt was, en een paslood was in Zijn hand.","Amos 6:12":"Zullen paarden ook rennen op een steenrots? Zal men daarop ook met runderen ploegen? Want u hebt het recht in gal veranderd, en de vrucht van de gerechtigheid in alsem.","Jer 9:24":"Maar wie zich beroemt, beroemt zich hierin, dat hij begrijpt, en Mij kent, dat Ik de HEERE ben, Die weldadigheid, recht en gerechtigheid doe op de aarde, want in die dingen heb Ik behagen, spreekt de HEERE.","Gen 46:26":"Al de zielen die met Jakob naar Egypte  hart verlokt is geweest in het verborgen, dat mijn hand mijn mond gekust heeft;","Openb 21:23":"En de stad heeft de zon en de maan niet nodig, om in haar te schijnen; want de heerlijkheid van God heeft haar verlicht, en het Lam is haar lamp.","Ex 20:7":"U zult de naam van de HEERE, uw God, niet ijdel gebruiken; want de HEERE zal niet onschuldig houden wie Zijn naam ijdel gebruikt.","Matt 22:38":"Dit is het eerste en het grootste gebod.","Gen 24:40":"En hij zei tegen mij: De HEERE, voor Wiens aangezicht ik gewandeld heb, zal Zijn Engel met u zenden, en Hij zal uw weg voorspoedig maken, zodat u voor mijn zoon een vrouw neemt, uit mijn geslacht en uit het huis van mijn vader.","Rom 9:33":"zoals geschreven is: Zie, Ik leg in Sion een steen des aanstoots, en een rots der ergernis; en ieder die in Hem gelooft, zal niet beschaamd worden.","2 Kor 3:13":"en doen niet zoals Mozes, die een sluier op zijn gezicht legde, opdat de kinderen van Israël niet strak zouden kijken naar het einde van wat teniet gedaan wordt.","Richt 13:25":"En de Geest van de HEERE begon hem soms te drijven in het leger van Dan, tussen Zora en Esthaol.","Hab 3:2":"HEERE! Toen ik Uw rede gehoord heb, ben ik bevreesd geworden; Uw werk, o HEERE! Behoud dat in het leven in het midden van de jaren, maak het bekend in het midden van de jaren; gedenk in de toorn aan het ontfermen.","Gen 18:10":"En Hij zei: Ik zal zeker bij u terugkomen, omstreeks deze tijd volgend jaar; en zie, Sara, uw vrouw, zal een zoon hebben! En Sara hoorde het aan de deur van de tent, die achter Hem was.","Zach 12:8":"Op die dag zal de HEERE de inwoners van Jeruzalem beschutten; en wie onder hen struikelen zou, zal op die dag zijn als David; en het huis van David zal zijn als goden, als de Engel van de HEERE voor hun aangezicht.","Spr 30:11":"Er is een geslacht dat zijn vader vervloekt, en zijn moeder niet zegent;","Jes 29:14":"daarom, zie, Ik zal verder wonderlijk handelen met dit volk, wonderlijk en wonderbaarlijk; want de wijsheid van zijn wijzen zal vergaan, en het verstand van zijn verstandigen zal zich verbergen.","1 Kon 20:42":"En hij zei tegen hem: Zo zegt de HEERE: Omdat u de man, die Ik verbannen had, uit uw hand hebt laten gaan, zal uw leven in de plaats van zijn leven zijn, en uw volk in de plaats van zijn volk.","Num 3:5-13":"En de HEERE sprak tot Mozes en zei: Laat de stam van Levi naderen, en stel hem voor het aangezicht van de priester Aäron, opdat zij hem dienen; En dat zij zijn wacht waarnemen, en de wacht van de hele vergadering, voor de tent der samenkomst, om de dienst van de tabernakel te bedienen;","Ex 4:13":"Doch hij zei: Och, Heere! zend toch door de hand van hem die U zult zenden.","Luk 4:10":"Want er is geschreven dat Hij Zijn engelen bevelen zal geven over U, dat zij U bewaren zullen;","Ex 25:22":"En daar zal Ik bij u komen, en Ik zal met u spreken van boven het verzoendeksel af, van tussen de twee cherubs die op de ark van de getuigenis zullen zijn, alles wat Ik u gebieden zal aan de kinderen van Israël.","Jes 6:8-10":"Daarna hoorde ik de stem van de Heere, die zei: Wie zal Ik zenden, en wie zal voor Ons heengaan? Toen zei ik: Zie, hier ben ik, zend mij heen. Toen zei Hij: Ga heen, en zeg tegen dit volk: Blijf horen, maar begrijp het niet, en blijf zien, maar merk het niet op. Maak het hart van dit volk vet, en maak hun oren zwaar, en sluit hun ogen, opdat het niet ziet met zijn ogen, of met zijn oren hoort, of met zijn hart begrijpt, of zich bekeert, en Hij het geneest.","Joh 4:6":"En daar was de fontein van Jakob. Jezus dan, vermoeid van de reis, ging zo bij de fontein zitten. Het was ongeveer het zesde uur.","Deut 27:26":"Vervloekt is hij die de woorden van deze wet niet bevestigt door ze te doen! En heel het volk zal zeggen: Amen.","Jes 58:11":"En de HEERE zal u voortdurend leiden, en Hij zal uw ziel verzadigen in grote droogte, en uw beenderen sterk maken; en u zult zijn als een gewaterde hof, en als een springader van water, waarvan het water niet ontbreekt.","Hand 13:3":"Toen vastten en baden zij, en nadat zij hun de handen opgelegd hadden, lieten zij hen gaan.","Matt 26:56":"maar dit alles is gebeurd, opdat de Schriften van de profeten vervuld zouden worden. Toen vluchtten alle discipelen en lieten Hem in de steek.","Ex 32:1-6":"Toen het volk zag dat Mozes lang wegbleef om van de berg af te komen, verzamelde het volk zich bij Aäron, en zij zeiden tegen hem: Sta op, maak ons goden, die voor ons uit gaan; want van deze Mozes, die man die ons uit Egypteland heeft weggeleid, weten wij niet wat er van hem geworden is. Aäron zei tegen hen: Rukt de gouden oorringen af, die in de oren van uw vrouwen, uw zonen en uw dochters zijn, en breng ze bij mij. Toen rukte heel het volk de gouden oorringen af die in hun oren waren, en zij brachten ze bij Aäron.","Luk 13:35":"Zie, uw huis wordt aan u woest achtergelaten. En voorwaar, Ik zeg u, dat u Mij niet zult zien, totdat de tijd zal zijn gekomen dat u zult zeggen: Gezegend is Hij Die komt in de Naam van de Heere!","Jes 53:4":"Waarlijk, Hij heeft onze ziekten op Zich genomen, en onze smarten heeft Hij gedragen; maar wij hielden Hem voor een geplaagde, door God geslagen en verdrukt.","Matt 10:16-27":"Zie, Ik zend u als schapen te midden van de wolven; wees dan voorzichtig zoals de slangen, en oprecht zoals de duiven. Maar wees op uw hoede voor de mensen; want zij zullen u overleveren aan de raadsvergaderingen, en zij zullen u geselen in hun synagogen; En u zult ook voor stadhouders en koningen geleid worden, om Mij, tot een getuigenis voor hen en de heidenen.","Jak 4:14":"U weet niet wat morgen gebeuren zal, want hoe is uw leven? Het is immers een damp, die voor een korte tijd zichtbaar is, en daarna verdwijnt.","Matt 27:10":"en zij hebben die gegeven voor de akker van de pottenbakker, zoals de Heere mij bevolen heeft.","Jes 1:24":"Daarom spreekt de Heere, HEERE van de heerscharen, de Machtige van Israël: O wee! Ik zal Mij troosten over Mijn tegenstanders. Ik zal Mij wreken op Mijn vijanden.","Ps 8:5-7":"Wat is de mens, dat U aan hem denkt, en de zoon des mensen, dat U hem bezoekt? En hebt U hem een weinig minder gemaakt dan de engelen, en hebt U hem met eer en heerlijkheid gekroond? U doet hem heersen over de werken van Uw handen; U hebt alles onder zijn voeten gezet;","Luk 20:43":"totdat Ik Uw vijanden tot een voetbank voor Uw voeten zal gezet hebben.","1 Kon 18:46":"En de hand van de HEERE was op Elia, en hij gordde zijn lenden, en liep voor het aangezicht van Achab uit, tot waar men bij Jizreël komt.","Ps 2:9":"U zult hen verpletteren met een ijzeren scepter; U zult hen in stukken slaan als een pottenbakkersvat.","1 Sam 9:6":"Hij daarentegen zei tegen hem: Zie toch, er is een man van God in deze stad, en hij is een geëerd man; alles wat hij zegt, komt zeker uit; laten wij nu daarheen gaan, misschien zal hij ons onze weg aanwijzen, die wij gaan zullen.","Ezech 37:7":"Toen profeteerde ik, zoals mij bevolen was, en er kwam een geluid, terwijl ik profeteerde, en zie, een beroering! En de beenderen kwamen bij elkaar, elk been bij zijn been.","Rom 11:9":"En David zegt: Hun tafel moet worden tot een strik, en tot een val, en tot een aanstoot, en tot een vergelding voor hen.","Hebr 5:5":"Zo heeft ook Christus Zichzelf niet verheerlijkt om Hogepriester te worden, maar Hij die tot Hem gesproken heeft: U bent Mijn Zoon, heden heb Ik U gegenereerd.","Richt 6:21":"En de Engel van de HEERE stak het uiteinde van de staf uit, die in Zijn hand was, en raakte het vlees en de ongezuurde koeken aan; toen ging er vuur op uit de rots, en verteerde het vlees en de ongezuurde koeken. En de Engel van de HEERE verdween uit zijn ogen.","Ps 113:4":"De HEERE is hoog boven alle heidenvolken, boven de hemelen is Zijn heerlijkheid.","2 Kon 3:15":"Nu dan, brengt mij een speelman. En het gebeurde, toen de speelman op de snaren speelde, dat de hand van de HEERE op hem kwam.","1 Kor 15:27":"Want Hij heeft alle dingen aan Zijn voeten onderworpen. Maar wanneer Hij zegt dat Hem alle dingen onderworpen zijn, dan is het duidelijk dat Hij Zelf wordt uitgezonderd, Die Hem alle dingen onderworpen heeft.","Jes 24:17":"De angst, en de kuil, en de strik over u, o inwoners van het land!","Hand 5:19":"Maar de engel van de Heere opende 's nachts de deuren van de gevangenis en leidde hen naar buiten, en zei:","Rom 9:25":"Zoals Hij ook bij Hosea zegt: Ik zal hen die Mijn volk niet waren, Mijn volk noemen, en haar die niet bemind was, Mijn beminde.","Job 32:8":"Zeker, de geest die in de mens is, en de inblazing van de Almachtige, maakt hen verstandig.","Tit 1:3":"Namelijk Zijn Woord, door de prediking, die mij toevertrouwd is, naar het bevel van God, onze Zaligmaker;","Ps 51:6":"Tegen U, U alleen, heb ik gezondigd, en gedaan wat kwaad is in Uw ogen; opdat U rechtvaardig bent in Uw spreken, en rein bent in Uw oordelen.","2 Kon 19:10-12":"Zo zult u spreken tegen Hizkia, de koning van Juda: Laat uw God, op Wie u vertrouwt, u niet bedriegen door te zeggen: Jeruzalem zal niet in de hand van de koning van Assyrië gegeven worden. Zie, u hebt gehoord wat de koningen van Assyrië aan alle landen gedaan hebben, door ze volledig te verwoesten; en zou u dan gered worden? Hebben de goden van de volken die mijn vaders vernietigd hebben, hen gered — zoals Gozan, en Haran, en Rezef, en de kinderen van Eden die in Telasser waren?","Hand 7:40":"en zeiden tegen Aäron: Maak ons goden, die voor ons uit gaan; want wat deze Mozes betreft, die ons uit het land van Egypte geleid heeft, wij weten niet wat er met hem gebeurd is.","Mal 1:3":"en Ezau heb Ik gehaat; en Ik heb zijn bergen gesteld tot een verwoesting, en zijn erfdeel voor de jakhalzen van de woestijn.","Rom 10:21":"Maar tegen Israël zegt Hij: De hele dag heb Ik Mijn handen uitgestrekt naar een ongehoorzaam en tegensprekend volk.","Richt 7:22":"Toen de driehonderd op de bazuinen bliezen, richtte de HEERE het zwaard van de een tegen de ander, door het hele leger heen; en het leger vluchtte tot Beth-sitta toe, naar Tseredath, tot aan de grens van Abel-mehola, boven Tabbath.","Luk 10:27":"En hij antwoordde: U zult de Heere, uw God, liefhebben met heel uw hart, en met heel uw ziel, en met heel uw kracht, en met heel uw verstand; en uw naaste als uzelf.","Num 22:23":"De ezelin nu zag de Engel van de HEERE staan in de weg, met Zijn getrokken zwaard in Zijn hand; daarom week de ezelin van de weg af, en ging het veld in. Toen sloeg Bileam de ezelin, om haar weer op de weg te laten gaan.","Jes 25:8":"Hij zal de dood verslinden tot overwinning, en de Heere HEERE zal de tranen van alle aangezichten afwissen; en Hij zal de smaad van Zijn volk van de hele aarde wegnemen; want de HEERE heeft het gesproken.","2 Kon 10:32":"In die dagen begon de HEERE Israël in te korten, want Hazaël sloeg hen in alle grensgebieden van Israël:","Mark 10:7":"Daarom zal een man zijn vader en zijn moeder verlaten, en zich aan zijn vrouw hechten;","Deut 18:15":"Een Profeet uit uw midden, uit uw broeders, zoals ik, zal de HEERE, uw God, u doen opstaan; naar Hem zult u luisteren,","2 Kon 2:8":"Toen nam Elia zijn mantel, en wond hem samen, en sloeg het water, en het werd naar de ene en de andere kant verdeeld; en zij beiden gingen er door op het droge.","Matt 27:35":"Nadat zij Hem gekruisigd hadden, verdeelden zij Zijn kleren, door het lot te werpen; opdat vervuld zou worden wat gezegd is door de profeet: Zij hebben Mijn kleren onder elkaar verdeeld, en over Mijn kleding hebben zij het lot geworpen.","Mark 10:8":"en die twee zullen tot één vlees zijn, zodat zij niet meer twee zijn, maar één vlees.","Jes 66:2":"Want Mijn hand heeft al deze dingen gemaakt, en al deze dingen zijn geweest, spreekt de HEERE; maar op deze zal Ik zien, op de arme en verslagene van geest, en die voor Mijn woord beeft.","Ef 3:1":"Om deze reden ben ik, Paulus, de gevangene van Christus Jezus, voor u, die heidenen bent.","Matt 6:26":"Kijk naar de vogels van de hemel: zij zaaien niet, maaien niet, en verzamelen niet in schuren; en uw hemelse Vader voedt ze toch. Gaat u ze niet ver te boven?","Ef 5:31":"Daarom zal een mens zijn vader en moeder verlaten, en zal zich aan zijn vrouw hechten; en die twee zullen tot één vlees worden.","2 Kon 13:3":"Daarom ontstak de toorn van de HEERE tegen Israël; en Hij gaf hen in de hand van Hazaël, de koning van Syrië, en in de hand van Benhadad, de zoon van Hazaël, al die dagen.","1 Kor 2:9":"Maar zoals geschreven is: Wat het oog niet heeft gezien, en het oor niet heeft gehoord, en in het hart van de mens niet is opgekomen, dat wat God bereid heeft voor hen die Hem liefhebben.","Ex 3:5-10":"En Hij zei: Kom hier niet dichterbij; trek uw schoenen uit van uw voeten; want de plaats waarop u staat, is heilig land. Hij zei verder: Ik ben de God van uw vader, de God van Abraham, de God van Izak en de God van Jakob. En Mozes verborg zijn gezicht, want hij was bang om God aan te zien. En de HEERE zei: Ik heb heel goed gezien de verdrukking van Mijn volk dat in Egypte is, en heb hun geschrei gehoord vanwege hun drijvers; want Ik ken hun smarten.","Rom 10:18":"Maar ik zeg: Hebben zij het niet gehoord? Zeker wel, hun geluid is over de hele aarde uitgegaan, en hun woorden tot de einden van de wereld.","2 Kon 4:10":"Laten we toch een kleine bovenkamer aan een muur maken, en daar voor hem neerzetten een bed, en tafel, en stoel, en kandelaar; dan zal het gebeuren, wanneer hij bij ons komt, dat hij daar inwijkt.","Job 1:14":"Dat er een bode tot Job kwam en zei: De runderen waren aan het ploegen, en de ezelinnen weidden aan hun zijden.","Dan 9:21":"terwijl ik nog sprak in het gebed, kwam de man Gabriël, die ik in het begin in een visioen gezien had, snel gevlogen, en raakte mij aan, omtrent de tijd van het avondoffer.","Jer 11:18":"De HEERE nu heeft het mij te kennen gegeven, dat ik het weet; toen hebt U mij hun handelingen laten zien.","Ex 19:8":"Toen antwoordde al het volk gezamenlijk en zei: Al wat de HEERE gesproken heeft, zullen wij doen! En Mozes bracht de woorden van het volk terug naar de HEERE.","Spr 1:8":"Mijn zoon! hoor de tucht van uw vader, en verlaat de leer van uw moeder niet;","Ex 20:11":"want in zes dagen heeft de HEERE de hemel en de aarde gemaakt, de zee en alles wat daarin is, en Hij rustte op de zevende dag; daarom zegende de HEERE de sabbatdag en heiligde hem.","Gen 21:14":"Toen stond Abraham 's morgens vroeg op, en nam brood en een fles water, en gaf ze aan Hagar, die hij op haar schouder legde; ook gaf hij haar het kind, en stuurde haar weg. En zij ging op weg, en dwaalde rond in de woestijn Berseba.","Joh 21:15-17":"Toen zij dan de maaltijd gehouden hadden, zei Jezus tegen Simon Petrus: Simon, zoon van Jonas, hebt u Mij meer lief dan dezen? Hij zei tegen Hem: Ja, Heere! U weet dat ik U liefheb. Hij zei tegen hem: Weid Mijn lammeren. Hij zei opnieuw tegen hem, voor de tweede keer: Simon, zoon van Jonas, hebt u Mij lief? Hij zei tegen Hem: Ja, Heere, U weet dat ik U liefheb. Hij zei tegen hem: Hoed Mijn schapen. Hij zei tegen hem voor de derde keer: Simon, zoon van Jonas, hebt u Mij lief? Petrus werd bedroefd, omdat Hij voor de derde keer tegen hem zei: Hebt u Mij lief? en hij zei tegen Hem: Heere! U weet alle dingen, U weet dat ik U liefheb. Jezus zei tegen hem: Weid Mijn schapen.","1 Sam 3:4-10":"dat de HEERE Samuël riep; en hij zei: Hier ben ik. En hij liep naar Eli en zei: Hier ben ik, want u hebt mij geroepen. Doch hij zei: Ik heb niet geroepen, keer terug, ga liggen. En hij ging heen en legde zich neer. Toen riep de HEERE Samuël opnieuw; en Samuël stond op en ging naar Eli, en zei: Hier ben ik, want u hebt mij geroepen. Hij dan zei: Ik heb u niet geroepen, mijn zoon; keer terug, ga liggen.","Jes 44:19":"En niemand van hen brengt het in zijn hart, en er is geen kennis en geen verstand, zodat hij zou zeggen: De helft daarvan heb ik verbrand in het vuur, ja, ook op de kolen daarvan heb ik brood gebakken, ik heb vlees daarbij gebraden, en heb het gegeten; en zou ik het overblijfsel daarvan tot een gruwel maken, zou ik neerknielen voor iets dat van een boom gekomen is?","Ps 89:21":"Ik heb David, Mijn knecht, gevonden; met Mijn heilige olie heb Ik hem gezalfd;","Jes 6:2":"De serafs stonden boven Hem; ieder had zes vleugels; met twee bedekte ieder zijn gezicht, en met twee bedekte hij zijn voeten, en met twee vloog hij.","Matt 9:13":"Ga heen en leer wat dit betekent: Ik wil barmhartigheid, en geen offerande; want Ik ben niet gekomen om rechtvaardigen te roepen, maar zondaars, tot bekering.","Richt 6:2":"Toen de hand van de Midianieten sterk werd over Israël, maakten de Israëlieten voor zichzelf, vanwege de Midianieten, de holen die in de bergen zijn, en de spelonken, en de vestingen.","Gen 1:27":"En God schiep de mens naar Zijn beeld; naar het beeld van God schiep Hij hem; man en vrouw schiep Hij hen.","1 Kon 18:17":"En het gebeurde, toen Achab Elia zag, dat Achab tegen hem zei: Bent u degene die Israël in beroering brengt?","Deut 9:9":"Toen ik op de berg geklommen was, om de stenen tafelen te ontvangen, de tafelen van het verbond dat de HEERE met u gemaakt had, bleef ik veertig dagen en veertig nachten op de berg, ik at geen brood en dronk geen water.","Hand 8:39":"En toen zij uit het water waren opgekomen, nam de Geest van de Heere Filippus weg, en de kamerling zag hem niet meer; want hij reisde zijn weg met blijdschap.","Ps 78:37":"Want hun hart was niet recht met Hem, en zij waren niet trouw in Zijn verbond.","Matt 14:29-31":"En Hij zei: Kom. En Petrus klom uit het schip, en liep op het water, om naar Jezus toe te komen. Maar toen hij de sterke wind zag, werd hij bevreesd, en toen hij begon te zinken, riep hij: Heere, red mij! En Jezus stak meteen Zijn hand uit, greep hem vast, en zei tegen hem: Kleingelovige! Waarom heb je getwijfeld?","Deut 33:25":"IJzer en koper zal onder uw schoen zijn; en uw sterkte gelijk uw dagen!","1 Sam 22:4":"En hij bracht hen voor het aangezicht van de koning van de Moabieten; en zij bleven bij hem al de dagen dat David in de vesting was.","Jes 54:13":"En al uw kinderen zullen door de HEERE geleerd zijn, en de vrede van uw kinderen zal groot zijn.","Jes 24:18":"En het zal gebeuren: wie voor het geluid van de angst vlucht, die zal in de kuil vallen; en wie uit de kuil opklimt, die zal in de strik gevangen worden; want de sluizen in de hoogte zijn opengedaan, en de fundamenten van de aarde zullen beven.","Hand 7:43":"Ja, u hebt de tent van Moloch opgenomen, en de ster van uw god Remfan, de beelden die u gemaakt hebt om die te aanbidden; en Ik zal u wegvoeren tot voorbij Babylon.","2 Kon 9:1-14":"Toen riep de profeet Elisa een van de zonen van de profeten, en hij zei tegen hem: Gord uw lenden, en neem deze oliekruik in uw hand, en ga naar Ramoth in Gilead. Als u daar gekomen bent, kijk dan waar Jehu, de zoon van Josafat, de zoon van Nimsi, is; ga naar binnen, en laat hem opstaan uit het midden van zijn broeders, en breng hem in een binnenste kamer. En neem de oliekruik, en giet die uit over zijn hoofd, en zeg: Zo zegt de HEERE: Ik heb u tot koning gezalfd over Israël. Doe daarna de deur open, en vlucht, en wacht niet.","Luk 4:12":"En Jezus antwoordde en zei tegen hem: Er is gezegd: U zult de Heere, uw God, niet verzoeken.","2 Kron 23:16":"En Jojada sloot een verbond tussen zichzelf, en tussen heel het volk, en tussen de koning, dat zij het volk van de HEERE zouden zijn.","Gen 28:11-15":"En hij kwam op een plaats, waar hij overnachtte, want de zon was ondergegaan; en hij nam van de stenen van die plaats, en maakte er zijn hoofdkussen van, en legde zich te slapen op die plaats. En hij droomde, en zie, een ladder stond op de aarde opgesteld, waarvan de top tot de hemel reikte; en zie, de engelen van God klommen daarlangs op en neer. En zie, de HEERE stond boven op de ladder en zei: Ik ben de HEERE, de God van uw vader Abraham, en de God van Izak; dit land, waarop u ligt te slapen, zal Ik aan u geven, en aan uw nageslacht.","Jes 63:12":"Die de arm van Zijn heerlijkheid heeft laten gaan aan de rechterhand van Mozes; Die de wateren voor hun aangezicht kliefde, opdat Hij Zich een eeuwige Naam maakte?","Jes 45:23":"Ik heb bij Mijzelf gezworen, er is een woord van gerechtigheid uit Mijn mond gegaan, en het zal niet terugkeren: dat voor Mij alle knie zich zal buigen, alle tong Mij zal zweren.","Ezech 8:1":"Het gebeurde nu in het zesde jaar, in de zesde maand, op de vijfde van de maand, terwijl ik in mijn huis zat, en de oudsten van Juda voor mij zaten, dat de hand van de Heere HEERE daar over mij viel.","Luk 8:10":"En Hij zei: Aan u is het gegeven de verborgenheden van het Koninkrijk van God te verstaan; maar tot de anderen spreek Ik in gelijkenissen, opdat zij ziende niet zien, en horende niet verstaan.","Ps 106:8":"Toch verloste Hij hen om Zijn Naams wil, opdat Hij Zijn macht bekend maakte.","Jer 31:15":"Zo zegt de HEERE: Er is een stem gehoord in Rama, een geklaag, een zeer bitter geween; Rachel weent over haar kinderen; zij weigert zich te laten troosten over haar kinderen, omdat zij er niet meer zijn.","Gen 16:8":"En hij zei: Hagar, dienstmaagd van Sarai, waar komt u vandaan, en waar zult u heengaan? En zij zei: Ik vlucht van het aangezicht van mijn meesteres Sarai!","Jer 32:25":"Evenwel hebt U tegen mij gezegd, Heere HEERE: koop voor uzelf dat veld voor geld, en laat het door getuigen bevestigen; terwijl de stad in de hand van de Chaldeeën gegeven is.","Rom 9:12":"werd tot haar gezegd: De oudste zal de jongste dienen.","2 Kor 1:1":"Paulus, een apostel van Jezus Christus door de wil van God, en Timotheüs, de broeder, aan de gemeente van God, die te Korinthe is, met al de heiligen, die in heel Achaje zijn:","Ps 10:7":"Zijn mond is vol vloek, bedrog en list; onder zijn tong is moeite en onrecht.","Richt 6:12":"Toen verscheen de Engel van de HEERE aan hem, en zei tegen hem: De HEERE is met u, dappere held!","Gen 15:8":"En hij zei: Heere HEERE, waarbij zal ik weten dat ik het erfelijk bezitten zal?","Spr 18:4":"De woorden uit de mond van een man zijn diepe wateren; en de bron van wijsheid is een stromende beek.","2 Kron 8:14":"Hij stelde ook, naar de wijze van zijn vader David, de verdelingen van de priesters aan over hun dienst, en van de Levieten over hun taken, om God te prijzen en voor de priesters te dienen, naar de eis van elke dag; en de poortwachters in hun verdelingen, bij elke poort; want zo was het gebod van David, de man Gods.","Ex 40:13-15":"En u zult Aäron de heilige kleren aantrekken; en u zult hem zalven, en hem heiligen, zodat hij Mij als priester bedient. U zult ook zijn zonen laten naderen, en u zult hun de rokken aantrekken. En u zult hen zalven, zoals u hun vader gezalfd zult hebben, zodat zij Mij als priester bedienen. En het zal gebeuren, dat hun zalving voor hen zal zijn tot een eeuwig priesterschap, door al hun generaties heen.","Openb 22:6":"En hij zei tegen mij: Deze woorden zijn getrouw en waarachtig; en de Heere, de God van de heilige profeten, heeft Zijn engel gezonden om Zijn dienstknechten te tonen wat spoedig moet gebeuren.","Gen 21:10":"En zij zei tegen Abraham: Jaag deze slavin en haar zoon weg; want de zoon van deze slavin zal niet erven met mijn zoon, met Izak.","Hebr 2:12":"En Hij zegt: Ik zal Uw naam aan Mijn broeders verkondigen; in het midden van de Gemeente zal Ik U lofzingen.","Ex 6:28":"Zo sprak de HEERE tot Mozes en zei: Ik ben de HEERE! Spreek tot Farao, de koning van Egypte, alles wat Ik tot u spreek.","Luk 4:27":"En er waren veel melaatsen in Israël, in de tijd van de profeet Elisa; en geen van hen werd gereinigd, behalve Naäman, de Syriër.","2 Kon 5:10-14":"Toen stuurde Elisa een bode naar hem, en zei: Ga heen en was u zeven keer in de Jordaan, en uw vlees zal weer gezond worden, en u zult rein zijn. Maar Naäman werd erg boos, en ging weg, en zei: Zie, ik zei bij mijzelf: Hij zal zeker naar buiten komen, en gaan staan, en de Naam van de HEERE, zijn God, aanroepen, en zijn hand over de plaats bewegen, en de melaatse genezen. Zijn Abana en Farpar, de rivieren van Damaskus, niet beter dan al het water van Israël? Zou ik mij daarin niet kunnen wassen en rein worden? Zo keerde hij zich om, en ging weg in woede.","Jes 12:6":"Juich en zing vrolijk, u inwoners van Sion! Want de Heilige van Israël is groot in uw midden.","Joh 21:9":"Toen zij dan aan land gegaan waren, zagen zij een kolenvuur liggen, en vis daarop liggen, en brood.","Rom 4:7":"En zei: Gelukkig zijn zij wier ongerechtigheden vergeven zijn, en wier zonden bedekt zijn;","Lev 19:2":"Spreek tot de hele vergadering van de kinderen van Israël, en zeg tegen hen: U zult heilig zijn, want Ik, de HEERE, uw God, ben heilig!","2 Kon 19:35":"Het gebeurde toen in diezelfde nacht, dat de Engel van de HEERE uittrok en in het leger van Assyrië honderdvijfentachtigduizend man sloeg. En toen zij zich 's morgens vroeg opmaakten, zie, dat waren allemaal dode lichamen.","Amos 5:10":"Zij haten in de poort hem die bestraft, en verafschuwen hem die oprecht spreekt.","Jak 5:17":"Elia was een mens net zo onderhevig aan gevoelens als wij; en hij bad een gebed, dat het niet zou regenen; en het regende niet op de aarde, drie jaar en zes maanden lang.","2 Kon 10:6-11":"Toen schreef hij voor de tweede keer een brief tot hen, en zei: Als u mijn kant kiest, en u naar mijn stem luistert, neem dan de hoofden van de mannen, de zonen van uw heer, en kom tot mij morgen omtrent deze tijd naar Jizreël. (De zonen van de koning nu, zeventig mannen, waren bij de groten van de stad, die hen opvoedden.) Het gebeurde dan, toen die brief tot hen kwam, dat zij de zonen van de koning namen, en zeventig mannen slachtten; en zij legden hun hoofden in korven, die zij tot hem zonden naar Jizreël. En er kwam een bode, en meldde hem, en zei: Zij hebben de hoofden van de zonen van de koning gebracht. En hij zei: Legt ze in twee hopen, aan de deur van de poort, tot morgen.","Rom 15:12":"En opnieuw zegt Jesaja: Er zal de wortel van Isaï zijn, en Die opstaat om over de heidenen te heersen; op Hem zullen de heidenen hopen.","Jes 64:4":"Ja, van oudsher heeft men het niet gehoord, ook niet met de oren opgemerkt, en geen oog heeft het gezien, behalve U, o God! wat Hij doen zal aan hem, die op Hem wacht.","Richt 6:12-17":"Toen verscheen de Engel van de HEERE aan hem, en zei tegen hem: De HEERE is met u, dappere held! Maar Gideon zei tegen Hem: Och, mijn heer! Als de HEERE met ons is, waarom is ons dan dit alles overkomen? En waar zijn al Zijn wonderen, die onze vaders ons verteld hebben en zeiden: Heeft de HEERE ons niet uit Egypte opgevoerd? Maar nu heeft de HEERE ons verlaten, en heeft ons in de hand van de Midianieten gegeven. Toen keerde de HEERE Zich tot hem, en zei: Ga heen in deze kracht van u, en u zult Israël uit de hand van de Midianieten verlossen; heb Ik u niet gezonden?","Matt 17:14-21":"En toen zij bij de menigte gekomen waren, kwam er iemand naar Hem toe, die voor Hem op de knieën viel en zei: Heere, ontferm U over mijn zoon, want hij is maanziek en lijdt zwaar; want vaak valt hij in het vuur, en vaak in het water. En ik heb hem naar Uw discipelen gebracht, maar zij hebben hem niet kunnen genezen.","1 Kor 14:21":"In de wet is geschreven: Ik zal door lieden van andere talen, en door andere lippen tot dit volk spreken, en toch zullen zij Mij ook zo niet horen, zegt de Heere.","Luk 2:25-27":"En zie, er was een mens in Jeruzalem, wiens naam was Simeon; en deze mens was rechtvaardig en godvrezend, en verwachtte de vertroosting van Israël, en de Heilige Geest was op hem. En hem was door de Heilige Geest een goddelijke openbaring gedaan, dat hij de dood niet zien zou voordat hij de Christus van de Heere zou zien. En hij kwam door de Geest in de tempel. En toen de ouders het Kindje Jezus binnenbrachten, om naar de gewoonte van de wet met Hem te doen,","Ex 13:2":"Heilig voor Mij alle eerstgeborenen; wat er ook onder de kinderen van Israël de baarmoeder opent, van mensen en van dieren, dat is Mijn eigendom.","Rom 3:4":"Dat zij verre. Maar God is waarachtig, en ieder mens leugenachtig; zoals geschreven is: Opdat U gerechtvaardigd wordt in Uw woorden, en overwint, wanneer U oordeelt.","Klaagl 3:52":"Tsade. Zij die mijn vijanden zijn zonder oorzaak, hebben mij als een vogeltje dapper gejaagd.","Ex 34:14":"(Want u zult zich niet buigen voor een andere god; want de Naam van de HEERE is IJveraar! Een ijverig God is Hij!)","Dan 7:16":"Ik naderde tot een van hen die daar stonden, en vroeg hem naar de zekerheid over dit alles; en hij zei het mij, en maakte mij de uitleg van deze zaken bekend.","Openb 21:11":"En zij had de heerlijkheid van God, en haar licht was gelijk aan de allerkostbaarste steen, namelijk als de steen Jaspis, blinkend als kristal.","Deut 29:1":"Dit zijn de woorden van het verbond, dat de HEERE Mozes geboden heeft te maken met de kinderen van Israël, in het land van Moab, naast het verbond, dat Hij met hen gemaakt had aan Horeb.","Zach 8:16":"Dit zijn de dingen die u doen zult: spreek de waarheid, ieder met zijn naaste; oordeel de waarheid en een oordeel van vrede in uw poorten.","1 Kor 15:45":"Zo staat er ook geschreven: De eerste mens Adam is geworden tot een levende ziel; de laatste Adam tot een levendmakende Geest.","Jak 5:10":"Mijn broeders, neem als voorbeeld van het lijden en van de geduldigheid de profeten, die in de Naam van de Heere gesproken hebben.","1 Petr 2:9":"Maar u bent een uitverkoren geslacht, een koninklijk priesterschap, een heilig volk, een volk dat God Zich verworven heeft; opdat u de deugden zou verkondigen van Hem Die u uit de duisternis geroepen heeft tot Zijn wonderbaar licht;","Gen 15:13":"Toen zei Hij tegen Abram: Weet voorzeker dat uw nageslacht vreemdeling zal zijn in een land dat niet van hen is, en zij zullen hen dienen, en zij zullen hen verdrukken, vierhonderd jaar.","Matt 10:37":"Wie vader of moeder liefheeft boven Mij, is Mij niet waard; en wie zoon of dochter liefheeft boven Mij, is Mij niet waard.","1 Kon 20:41":"Toen haastte hij zich, en veegde de as van zijn ogen af; en de koning van Israël herkende hem, dat hij een van de profeten was.","Luk 2:24":"En om een offer te geven, naar wat in de wet van de Heere gezegd is, een paar tortelduiven of twee jonge duiven.","Jes 49:26":"En Ik zal uw verdrukkers spijzen met hun eigen vlees, en van hun eigen bloed zullen zij dronken worden, als van zoete wijn; en alle vlees zal gewaarworden, dat Ik, de HEERE, uw Heiland ben, en uw Verlosser, de Machtige van Jakob.","Gen 22:18":"En in uw nageslacht zullen alle volken van de aarde gezegend worden, omdat u Mijn stem gehoorzaam bent geweest.","Hos 13:2":"En nu gaan zij voort met zondigen, en hebben zich van hun zilver een gegoten beeld gemaakt, afgoden naar hun eigen inzicht, die allemaal het werk van smeden zijn; waarvan zij toch zeggen: De mensen die offeren, zullen de kalveren kussen.","Jes 59:21":"Wat Mij aangaat, dit is Mijn Verbond met hen, zegt de HEERE: Mijn Geest, Die op u is, en Mijn woorden, die Ik in uw mond gelegd heb, die zullen van uw mond niet wijken, ook niet van de mond van uw zaad, ook niet van de mond van het zaad van uw zaad, zegt de HEERE, van nu af tot in eeuwigheid toe.","1 Kor 2:1-4":"En ik, broeders, toen ik bij u kwam, kwam niet met voortreffelijkheid van woorden of van wijsheid, terwijl ik u de getuigenis van God verkondigde. Want ik had besloten niets te weten onder u, dan Jezus Christus, en Die gekruisigd. En ik was bij u in zwakheid, en in vrees, en in veel beven.","Ezra 10:3-44":"Laten wij dan nu een verbond maken met onze God, dat wij al die vrouwen, en wat van hen geboren is, zullen wegsturen, naar de raad van de Heere, en van hen die beven voor het gebod van onze God; en laat er gedaan worden naar de wet. Sta op, want deze zaak komt u toe; en wij zullen met u zijn; wees sterk en doe het. Toen stond Ezra op en liet de leiders van de priesters, de Levieten en heel Israël zweren dat zij zouden doen naar dit woord; en zij zwoeren.","Ex 5:22":"Toen keerde Mozes weer terug tot de HEERE, en zei: Heere! Waarom hebt U dit volk kwaad gedaan, waarom hebt U mij nu gezonden?","Rom 3:15-17":"hun voeten zijn snel om bloed te vergieten; vernieling en ellende is op hun wegen; en de weg van de vrede hebben zij niet gekend.","Jes 52:5":"En nu, wat heb Ik hier te doen? spreekt de HEERE, omdat Mijn volk voor niets is weggenomen, en degenen die over hen heersen, hen laten huilen, spreekt de HEERE, en Mijn Naam voortdurend de hele dag gelasterd wordt;","Deut 5:31":"Maar u, sta hier bij Mij, dan zal Ik tot u spreken al de geboden, en inzettingen, en rechten, die u hun leren zult, opdat zij ze doen in het land dat Ik hun geven zal, om dat te erven.","Hebr 13:5":"Laat uw wandel zonder geldgierigheid zijn, en wees tevreden met wat u hebt; want Hij heeft gezegd: Ik zal u niet begeven, en Ik zal u niet verlaten.","Hand 3:23":"En het zal gebeuren dat iedere ziel die niet naar deze Profeet zal hebben geluisterd, uitgeroeid zal worden uit het volk.","Rom 11:5":"Zo is er dan ook in deze tegenwoordige tijd een overblijfsel geworden, naar de verkiezing van de genade.","Deut 32:35":"Aan Mij is de wraak en de vergelding, op de tijd dat hun voet zal wankelen; want de dag van hun ondergang is nabij, en de dingen die hun zullen gebeuren, haasten zich.","Hand 8:29":"En de Geest zei tegen Filippus: Ga erheen, en voeg u bij deze wagen.","1 Sam 10:1":"Toen nam Samuël een oliekruik, en goot ze uit op zijn hoofd, en kuste hem, en zei: Is het niet zo, dat de HEERE u tot een voorganger over Zijn erfdeel gezalfd heeft?","Luk 4:18":"De Geest van de Heere is op Mij, daarom heeft Hij Mij gezalfd; Hij heeft Mij gezonden om aan de armen het Evangelie te verkondigen, om te genezen wie gebroken zijn van hart;","Matt 7:23":"En dan zal Ik hun openlijk zeggen: Ik heb u nooit gekend; ga weg van Mij, u die de ongerechtigheid werkt!","Jes 49:8":"Zo zegt de HEERE: In de tijd van het welbehagen heb Ik U verhoord, en op de dag van het heil heb Ik U geholpen; en Ik zal U bewaren, en Ik zal U geven tot een verbond van het volk, om het aardrijk op te richten, om de verwoeste erfenissen te doen beërven;","2 Kon 6:31":"En hij zei: Zo doe God mij, en doe zo daartoe, als het hoofd van Elisa, de zoon van Safat, vandaag op hem zal blijven staan!","Hand 10:3-6":"Deze zag in een gezicht klaar, omtrent het negende uur van de dag, een engel van God bij hem binnenkomen, die tegen hem zei: Cornelius! En hij hield de ogen op hem gericht, en werd zeer bevreesd, en zei: Wat is er, Heere? En Hij zei tegen hem: Uw gebeden en uw aalmoezen zijn als gedachtenis opgekomen voor God. En nu, zend mannen naar Joppe, en ontbied Simon, die ook Petrus genoemd wordt.","Mark 14:27":"En Jezus zei tegen hen: U zult deze nacht allen aanstoot aan Mij nemen; want er is geschreven: Ik zal de Herder slaan, en de schapen zullen verstrooid worden.","2 Petr 1:18":"En deze stem hebben wij gehoord, toen zij vanuit de hemel gebracht werd, terwijl wij met Hem op de heilige berg waren.","1 Tim 6:15":"die op Zijn tijd zal laten zien de gelukkige en enige machtige Heerser, de Koning der koningen en Heere der heren;","Richt 6:22":"Toen zag Gideon dat het een Engel van de HEERE was; en Gideon zei: Ach, Heere HEERE! Want ik heb een Engel van de HEERE gezien, van aangezicht tot aangezicht.","Ex 21:24":"oog voor oog, tand voor tand, hand voor hand, voet voor voet,","1 Kon 18:10":"Zo waarachtig als de HEERE, uw God, leeft: er is geen volk of koninkrijk waar mijn heer niet naartoe gezonden heeft om u te zoeken; en als zij zeiden: Hij is hier niet, liet hij dat koninkrijk en dat volk zweren dat zij u niet hadden gevonden.","Ef 2:7":"opdat Hij zou tonen in de toekomende eeuwen de uitnemende rijkdom van Zijn genade, door de goedertierenheid over ons in Christus Jezus.","Mark 9:14-29":"En toen Hij bij de discipelen kwam, zag Hij een grote menigte om hen heen, en enige Schriftgeleerden die met hen aan het twisten waren. En meteen, toen de hele menigte Hem zag, was zij zeer verbaasd, en zij liepen naar Hem toe en groetten Hem. En Hij vroeg de Schriftgeleerden: Waarover twist u met hen?","2 Kron 15:15":"En heel Juda was verblijd over deze eed; want zij hadden met hun hele hart gezworen, en met hun hele wil Hem gezocht; en Hij werd door hen gevonden, en de HEERE gaf hun rust van rondom.","1 Kon 14:5":"Maar de HEERE zei tegen Ahia: Zie, Jerobeams vrouw komt om u iets te vragen over haar zoon, want hij is ziek. Zo en zo zult u tot haar spreken, en het zal gebeuren, als zij binnenkomt, dat zij zich als een andere vrouw zal voordoen.","1 Kon 21:25":"Doch er was niemand geweest zoals Achab, die zichzelf verkocht had om te doen wat kwaad is in de ogen van de HEERE, omdat Izebel, zijn vrouw, hem ophitste.","Jer 34:15":"U nu was heden weer teruggekeerd, en had gedaan wat recht is in Mijn ogen, vrijheid uitroepend, ieder voor zijn naaste; en u had een verbond gemaakt voor Mijn aangezicht, in het huis dat naar Mijn Naam genoemd is.","Lev 20:9":"Als iemand zijn vader of zijn moeder vervloekt, zal hij zeker gedood worden; hij heeft zijn vader of zijn moeder vervloekt; zijn bloed is op hem!","Matt 5:27":"U hebt gehoord dat gezegd is: U zult geen overspel plegen.","Ps 110:1":"Een psalm van David. De HEERE heeft tot mijn Heere gesproken: Zit aan Mijn rechterhand, totdat Ik Uw vijanden gezet zal hebben tot een voetbank van Uw voeten.","Hand 8:32":"En het gedeelte van de Schrift dat hij las, was dit: Hij is als een schaap naar de slachting geleid; en zoals een lam stemloos is voor wie het scheert, zo doet Hij Zijn mond niet open.","1 Kon 20:13":"En zie, een profeet trad naar Achab, de koning van Israël, en zei: Zo zegt de HEERE: Hebt u al deze grote menigte gezien? Zie, Ik zal ze heden in uw hand geven, opdat u weet, dat Ik de HEERE ben.","Jer 1:1":"De woorden van Jeremia, de zoon van Hilkia, uit de priesters die te Anathoth waren, in het land van Benjamin;","Jes 6:1-9":"In het jaar dat koning Uzzia stierf, zag ik de Heere zitten op een hoge en verheven troon, en Zijn zomen vulden de tempel. De serafs stonden boven Hem; ieder had zes vleugels; met twee bedekte ieder zijn gezicht, en met twee bedekte hij zijn voeten, en met twee vloog hij. En de een riep tot de ander en zei: Heilig, heilig, heilig is de HEERE van de heerscharen! De hele aarde is vol van Zijn heerlijkheid!","Spr 20:20":"Wie zijn vader of zijn moeder vervloekt, diens lamp zal uitgeblust worden in zwarte duisternis.","Deut 10:17":"Want de HEERE, uw God, is een God der goden, en een Heere der heren; die grote, die machtige, en die ontzagwekkende God, Die niemand aanziet naar het aangezicht, en geen geschenk aanneemt;","Hand 7:31":"Toen Mozes dat zag, verwonderde hij zich over het gezicht; en toen hij erheen ging om het van dichtbij te bekijken, kwam er een stem van de Heere tot hem,","Jes 60:1":"Maak u op, word verlicht, want uw licht komt, en de heerlijkheid van de HEERE gaat over u op.","Matt 21:5":"Zeg tegen de dochter van Sion: Zie, uw Koning komt naar u toe, zachtmoedig en gezeten op een ezelin, en een veulen, het jong van een lastdier.","Deut 29:12":"Om over te gaan in het verbond van de HEERE, uw God, en in Zijn vloek, die de HEERE, uw God, heden met u maakt;","Ps 31:6":"In Uw hand beveel ik mijn geest; U hebt mij verlost, HEERE, U, God van de waarheid!","Hebr 4:4":"Want Hij heeft ergens over de zevende dag zo gesproken: En God heeft op de zevende dag van al Zijn werken gerust.","Matt 21:16":"en zeiden tegen Hem: Hoort U wel wat dezen zeggen? En Jezus zei tegen hen: Ja; hebt u nooit gelezen: Uit de mond van de jonge kinderen en de zuigelingen hebt U Zichzelf lof toebereid?","Ezech 43:4":"En de heerlijkheid van de HEERE kwam in het huis, door de weg van de poort die de weg naar het oosten ziet.","Ef 3:7":"waarvan ik een dienaar geworden ben, naar de gave van de genade van God, die mij gegeven is, naar de werking van Zijn kracht.","Amos 9:12":"Opdat zij het overblijfsel van Edom erfelijk bezitten, en alle heidenvolken die naar Mijn Naam genoemd worden, spreekt de HEERE, Die dit doet.","Ps 50:3":"Onze God zal komen en zal niet zwijgen; een vuur voor Zijn aangezicht zal verteren, en rondom Hem zal het zeer stormen.","Joh 12:41":"Dit zei Jesaja, toen hij Zijn heerlijkheid zag, en over Hem sprak.","Num 16:28":"Toen zei Mozes: Hieraan zult u herkennen dat de HEERE mij gezonden heeft om al deze daden te doen, dat ze niet uit mijn eigen hart komen.","Rom 1:20":"Want Zijn onzichtbare dingen worden, vanaf de schepping van de wereld, uit de schepselen begrepen en doorzien, namelijk Zijn eeuwige kracht en Goddelijkheid, opdat zij niet te verontschuldigen zouden zijn.","Ex 4:1":"Toen antwoordde Mozes, en zei: Maar zie, zij zullen mij niet geloven, en niet naar mijn stem luisteren; want zij zullen zeggen: De HEERE is u niet verschenen!","1 Kor 12:7-11":"Maar aan ieder wordt de openbaring van de Geest gegeven tot wat nuttig is. Want aan de een wordt door de Geest het woord van wijsheid gegeven, en aan een ander het woord van kennis, door dezelfde Geest; en aan een ander het geloof, door dezelfde Geest; en aan een ander de gaven van gezondmaking, door dezelfde Geest.","Ex 24:10":"En zij zagen de God van Israël, en onder Zijn voeten als een werk van saffierstenen, en als de gestalte van de hemel in Zijn klaarheid.","Hand 28:25-27":"En omdat zij het onderling oneens waren, gingen zij uiteen, nadat Paulus dit ene woord gezegd had, namelijk: Terecht heeft de Heilige Geest gesproken door de profeet Jesaja tot onze voorvaders, Toen hij zei: Ga naar dit volk, en zeg: Met het gehoor zult u horen, en beslist niet begrijpen; en ziende zult u zien, en beslist niet opmerken. Want het hart van dit volk is ongevoelig geworden, en met de oren hebben zij slecht gehoord, en hun ogen hebben zij gesloten; opdat zij niet op enig moment met de ogen zouden zien, en met de oren horen, en met het hart begrijpen, en zich zouden bekeren, en Ik hen zou genezen.","Deut 4:33":"Of een volk ooit de stem van God gehoord heeft, sprekend uit het midden van het vuur, zoals u gehoord hebt, en in leven is gebleven?","Ps 18:50":"Daarom zal ik U, o HEERE! loven onder de heidenen; en Uw Naam zal ik psalmzingen;","Amos 9:11":"Op die dag zal Ik de vervallen hut van David weer oprichten, en Ik zal haar scheuren dichtmaken, en wat aan haar is afgebroken weer oprichten, en zal haar bouwen, als in de dagen van vroeger;","1 Kon 19:1-10":"Achab vertelde Izebel alles wat Elia gedaan had, en ook dat hij alle profeten met het zwaard gedood had. Toen stuurde Izebel een bode naar Elia, om te zeggen: Zo mogen de goden mij doen, en nog erger, als ik uw leven niet morgen omstreeks deze tijd maak als het leven van één van hen. Toen hij dat zag, maakte hij zich op en ging heen om zijn leven te redden, en kwam in Berseba, dat in Juda ligt, en liet zijn knecht daar.","1 Kon 17:1-16":"En Elia, de Thisbiet, van de inwoners van Gilead, zei tegen Achab: Zo waarachtig als de HEERE, de God van Israël, leeft, voor Wiens aangezicht ik sta, indien deze jaren dauw of regen zijn zal, tenzij dan naar mijn woord! Daarna kwam het woord van de HEERE tot hem, en Hij zei: Ga weg van hier, en wend u naar het oosten, en verberg u aan de beek Krith, die voor de Jordaan ligt.","Ex 34:6":"Toen de HEERE nu voor zijn aangezicht voorbijging, riep Hij: HEERE, HEERE, God, barmhartig en genadig, geduldig en groot van goedertierenheid en waarheid.","Ezech 43:5":"En de Geest nam mij op, en bracht mij in het binnenste voorhof; en zie, de heerlijkheid van de HEERE had het huis vervuld.","Jona 3:1":"En het woord van de HEERE gebeurde voor de tweede keer tot Jona, en zei:","Job 37:4":"Daarna brult Hij met de stem; Hij dondert met de stem van Zijn hoogheid, en houdt die dingen niet terug, wanneer Zijn stem gehoord wordt.","1 Tim 5:18":"Want de Schrift zegt: Een dorsende os zult u niet muilbanden; en: De arbeider is zijn loon waard.","Deut 25:4":"Een os zult u niet muilbanden, als hij graan dorst.","Jes 40:6-8":"Een stem zegt: Roept! En hij zegt: Wat zal ik roepen? Alle vlees is gras, en al zijn goedertierenheid als een bloem van het veld. Het gras verdort, de bloem valt af, als de Geest van de HEERE daarin waait; voorwaar, het volk is gras. Het gras verdort, de bloem valt af; maar het Woord van onze God bestaat in eeuwigheid.","Ex 28:1":"Daarna zult u uw broeder Aäron en zijn zonen met hem, uit het midden van de kinderen van Israël tot u laten naderen, om Mij het priesterambt te bedienen: namelijk Aäron, Nadab en Abihu, Eleazar en Ithamar, de zonen van Aäron.","Jes 6:10":"Maak het hart van dit volk vet, en maak hun oren zwaar, en sluit hun ogen, opdat het niet ziet met zijn ogen, of met zijn oren hoort, of met zijn hart begrijpt, of zich bekeert, en Hij het geneest.","Deut 5:4-6":"Van aangezicht tot aangezicht heeft de HEERE met u op de berg gesproken uit het midden van het vuur, (ik stond in die tijd tussen de HEERE en tussen u, om u het woord van de HEERE bekend te maken; want u was bang voor het vuur en klom niet op de berg) en Hij zei: Ik ben de HEERE, uw God, Die u uit Egypteland, uit het diensthuis, uitgeleid heb.","1 Tim 2:7":"waartoe ik gesteld ben als prediker en apostel (ik zeg de waarheid in Christus, ik lieg niet), een leraar van de heidenen, in geloof en waarheid.","Jes 54:1":"Zing vrolijk, u onvruchtbare, die niet gebaard hebt! Maak geschal met vrolijk gezang, en juich, die geen barensnood gehad hebt! Want de kinderen van de eenzame zijn meer dan de kinderen van de getrouwde, zegt de HEERE.","Gen 21:15":"Toen het water uit de fles op was, gooide zij het kind onder een van de struiken.","Gen 2:7":"En de HEERE God had de mens gevormd uit het stof van de aarde, en in zijn neusgaten de adem van het leven geblazen; zo werd de mens tot een levende ziel.","Mark 9:44":"Waar hun worm niet sterft, en het vuur niet uitgeblust wordt.","Dan 1:15":"Aan het einde van de tien dagen nu zag men dat hun gedaanten er beter uitzagen, en zij vetter waren van vlees dan alle jongemannen die het voedsel van de koning aten.","Matt 2:6":"En u, Bethlehem, land van Juda! U bent geenszins de minste onder de vorsten van Juda; want uit u zal de Leidsman voortkomen, Die Mijn volk Israël weiden zal.","Rom 11:2":"God heeft Zijn volk niet verstoten, dat Hij van tevoren gekend heeft. Of weet u niet wat de Schrift zegt van Elia, hoe hij God aanspreekt tegen Israël, en zegt:","Job 9:33":"Er is geen scheidsman tussen ons, die zijn hand op ons beiden leggen mocht.","Hab 2:3":"Want het visioen is nog bestemd voor een vastgestelde tijd, maar op het einde zal Hij het vervullen, en het zal niet liegen; al blijft het uit, verwacht het toch, want het zal zeker komen, het zal niet achterblijven.","Micha 3:8":"Maar waarlijk, ik ben vol van de kracht van de Geest van de HEERE; en vol van gericht en dapperheid, om Jakob zijn overtreding te verkondigen, en Israël zijn zonde.","Job 25:3":"Is er een aantal te noemen van Zijn legers? En over wie gaat Zijn licht niet op?","Ef 4:12":"Tot de volmaking van de heiligen, tot het werk van de bediening, tot opbouw van het lichaam van Christus;","Joh 21:5":"Jezus dan zei tegen hen: Kinderen, hebt u niet iets te eten? Zij antwoordden Hem: Nee.","Hand 7:34":"Ik heb zeker gezien de mishandeling van Mijn volk, dat in Egypte is, en Ik heb hun zuchten gehoord en ben neergekomen om hen daaruit te verlossen; en nu, kom hierheen, Ik zal u naar Egypte zenden.","1 Kron 12:18":"En de Geest bekleedde Amasai, de leider van de aanvoerders, en hij zei: Wij zijn van u, o David, en met u zijn wij, zoon van Isaï. Vrede, vrede zij u, en vrede uw helpers; want uw God helpt u. Toen nam David hen aan, en stelde hen tot aanvoerders van de benden.","Ezech 1:20":"Waarheen de geest wilde gaan, gingen zij, waarheen de geest wilde gaan; en de raderen werden tegenover hen opgeheven; want de geest van de levende wezens was in de raderen.","Jer 31:18":"Ik heb wel gehoord dat Efraïm zich beklaagt, en zegt: U hebt mij getuchtigd, en ik ben getuchtigd zoals een ongewend kalf. Bekeer mij, dan zal ik bekeerd zijn, want U bent de HEERE, mijn God!","Spr 30:17":"Het oog dat de vader bespot, of de gehoorzaamheid aan de moeder veracht, dat zullen de raven van de beek uitpikken, en de jongen van de arend zull wel, zwijgt u stil.","Amos 3:7":"Zeker, de Heere HEERE zal niets doen, tenzij Hij Zijn verborgenheid aan Zijn dienaren, de profeten, geopenbaard heeft.","Hab 3:16":"Toen ik het hoorde, werd mijn buik beroerd; voor de stem hebben mijn lippen gebeefd; verrotting kwam in mijn beenderen, en ik werd beroerd op mijn plaats. Zeker, ik zal rusten op de dag van de benauwdheid, wanneer hij zal optrekken tegen het volk, om het met troepen aan te vallen.","1 Kon 17:6":"En de raven brachten hem 's morgens brood en vlees, en zo ook brood en vlees 's avonds; en hij dronk uit de beek.","Gen 3:12":"Toen zei Adam: De vrouw die U bij mij gegeven hebt, die heeft mij van die boom gegeven, en ik heb gegeten.","1 Kon 16:31":"En het gebeurde (was het een lichte zaak dat hij wandelde in de zonden van Jerobeam, de zoon van Nebat?), dat hij ook nog Izebel, de dochter van Eth-baal, de koning van de Sidoniërs, tot vrouw nam, en heenging, en Baäl diende, en zich voor hem neerboog.","Hab 2:4":"Zie, wie zich verheft, zijn ziel is niet oprecht in hem; maar de rechtvaardige zal door zijn geloof leven.","Gen 18:12-14":"Zo lachte Sara bij zichzelf en zei: Zal ik nog wellust hebben, nu ik oud geworden ben, en mijn heer ook oud is? En de HEERE zei tegen Abraham: Waarom heeft Sara gelachen en gezegd: Zou ik werkelijk nog een kind baren, nu ik oud geworden ben? Zou iets voor de HEERE te wonderlijk zijn? Op de vastgestelde tijd zal Ik bij u terugkomen, omstreeks deze tijd volgend jaar, en Sara zal een zoon hebben!","2 Petr 2:22":"Maar hun is overkomen wat een waar spreekwoord zegt: De hond is teruggekeerd naar zijn eigen uitbraaksel; en het gewassen varken naar de modderpoel om zich erin te wentelen.","2 Kon 1:12":"En Elia antwoordde en sprak tot hem: Ben ik een man van God, laat er dan vuur uit de hemel neerdalen, dat u en uw vijftigtal verteert. Toen daalde het vuur van God uit de hemel neer en verteerde hem en zijn vijftigtal.","Jer 16:1":"En het woord van de HEERE kwam tot mij, en Hij zei:","1 Kor 6:16
