gebeurde na verloop van *vele* dagen, dat de beek uitdroogde; want er was geen regen in het land geweest.","8":"Toen kwam het woord van de HEERE tot hem, en Hij zei:","9":"Maak u op, ga naar Zarfath, dat bij Sidon ligt, en woon daar; zie, Ik heb daar een weduwvrouw geboden dat zij u onderhoudt.","10":"Toen maakte hij zich op, en ging naar Zarfath. Toen hij nu aan de poort van de stad kwam, zie, daar was een weduwvrouw hout aan het sprokkelen; en hij riep haar en zei: Haal mij toch een beetje water in dit vat, zodat ik kan drinken.","11":"Toen zij nu heenging om het te halen, riep hij haar, en zei: Haal mij toch *ook* een stuk van het brood in uw hand.","12":"Maar zij zei: Zo waarachtig als de HEERE, uw God, leeft, ik heb geen koek, alleen een hand vol van het meel in de kruik, en een beetje olie in de fles! En zie, ik heb een paar stukken hout gesprokkeld, en ik ga naar binnen, en zal het voor mij en voor mijn zoon bereiden, zodat wij het eten, en sterven.","13":"En Elia zei tegen haar: Vrees niet, ga naar binnen, doe naar uw woord; maar maak mij eerst een kleine koek daarvan, en breng die mij hier naar buiten; maar voor u en uw zoon zult u daarna *iets* maken.","14":"Want zo zegt de HEERE, de God van Israël: Het meel van de kruik zal niet verteerd worden, en de olie van de fles zal niet ontbreken, tot op de dag dat de HEERE regen op de aardbodem geven zal.","15":"En zij ging heen, en deed naar het woord van Elia; zo at zij, en hij, en haar huis, *vele* dagen.","16":"Het meel van de kruik werd niet verteerd, en de olie van de fles ontbrak niet, naar het woord van de HEERE, dat Hij gesproken had door de dienst van Elia.","17":"En het gebeurde na deze dingen, dat de zoon van deze vrouw, de waardin van het huis, ziek werd; en zijn ziekte werd zeer sterk, totdat er geen adem in hem overgebleven was.","18":"En zij zei tegen Elia: Wat heb ik met u te doen, man van God? Bent u bij mij binnengekomen om mijn ongerechtigheid in gedachtenis te brengen, en om mijn zoon te doden?","19":"En hij zei tegen haar: Geef mij uw zoon. En hij nam hem van haar schoot, en droeg hem naar boven, naar de opperzaal, waar hij zelf woonde, en hij legde hem neer op zijn bed.","20":"En hij riep de HEERE aan, en zei: HEERE, mijn God, hebt Gij dan ook deze weduwe, bij wie ik herberg, zo kwalijk behandeld, dat Gij haar zoon gedood hebt?","21":"En hij strekte zich driemaal uit over dat kind, en riep de HEERE aan, en zei: HEERE, mijn God, laat toch de ziel van dit kind in hem wederkeren.","22":"En de HEERE verhoorde de stem van Elia; en de ziel van het kind kwam weer in hem, zodat het weer levend werd.","23":"En Elia nam het kind, en bracht hem van de opperzaal naar beneden, het huis in, en gaf hem aan zijn moeder; en Elia zei: Zie, uw zoon leeft.","24":"Toen zei die vrouw tegen Elia: Nu weet ik dat u een man van God bent, en dat het woord van de HEERE in uw mond waarheid is."},"SV":{"1":"En Elia, de Thisbiet, van de inwoneren van Gilead, zeide tot Achab: *Zo* *waarachtig* *als* de HEERE, de God Israëls, leeft, voor Wiens aangezicht ik sta, indien deze jaren dauw of regen zijn zal, tenzij dan naar mijn woord!","2":"Daarna geschiedde het woord des HEEREN tot hem, zeggende:","3":"Ga weg van hier, en wend u naar het oosten, en verberg u aan de beek Krith, die voor aan de Jordaan is.","4":"En het zal geschieden, dat gij uit de beek drinken zult; en Ik heb de raven geboden, dat zij u daar onderhouden zullen.","5":"Hij ging dan heen, en deed naar het woord des HEEREN; want hij ging en woonde bij de beek Krith, die voor aan de Jordaan is.","6":"En de raven brachten hem des morgens brood en vlees, desgelijks brood en vlees des avonds; en hij dronk uit de beek.","7":"En het geschiedde ten einde van *vele* dagen, dat de beek uitdroogde; want geen regen was in het land geweest.","8":"Toen geschiedde het woord des HEEREN tot hem, zeggende:","9":"Maak u op, ga heen naar Zarfath, dat bij Sidon is, en woon aldaar; zie, Ik heb daar een weduwvrouw geboden, dat zij u onderhoude.","10":"Toen maakte hij zich op, en ging naar Zarfath. Als hij nu aan de poort der stad kwam, ziet, zo was daar een weduwvrouw, hout lezende; en hij riep tot haar, en zeide: Haal mij toch een weinig waters in dit vat, dat ik drinke.","11":"Toen zij nu heenging om te halen, zo riep hij tot haar, en zeide: Haal mij toch *ook* een bete broods in uw hand.","12":"Maar zij zeide: *Zo* *waarachtig* *als* de HEERE, uw God, leeft, indien ik een koek heb, dan alleen een hand vol meels in de kruik, en een weinig olie in de fles! En zie ik heb een paar houten gelezen, en ik ga heen, en zal het voor mij en voor mijn zoon bereiden, dat wij het eten, en sterven.","13":"En Elia zeide tot haar: Vrees niet, ga heen, doe naar uw woord; maar maak mij vooreerst een kleinen koek daarvan, en breng mij dien hier uit; doch voor u en uw zoon zult gij daarna *wat* maken.","14":"Want zo zegt de HEERE, de God Israëls: Het meel van de kruik zal niet verteerd worden, en de olie der fles zal niet ontbreken, tot op den dag, dat de HEERE regen op den aardbodem geven zal.","15":"En zij ging heen, en deed naar het woord van Elia; zo at zij, en hij, en haar huis, *vele* dagen.","16":"Het meel van de kruik werd niet verteerd, en de olie van de fles ontbrak niet, naar het woord des HEEREN, dat Hij gesproken had door den dienst van Elia.","17":"En het geschiedde na deze dingen, dat de zoon dezer vrouw, der waardin van het huis, krank werd; en zijn krankheid werd zeer sterk, totdat geen adem in hem overgebleven was.","18":"En zij zeide tot Elia: Wat heb ik met u te doen, gij man Gods? Zijt gij bij mij ingekomen, om mijn ongerechtigheid in gedachtenis te brengen, en om mijn zoon te doden?","19":"En hij zeide tot haar: Geef mij uw zoon. En hij nam hem van haar schoot, en droeg hem boven in de opperzaal, waar hij zelf woonde, en hij leide hem neder op zijn bed.","20":"En hij riep den HEERE aan, en zeide: HEERE, mijn God, hebt Gij dan ook deze weduwe, bij dewelke ik herberge, zo kwalijk gedaan, dat Gij haar zoon gedood hebt?","21":"En hij mat zich driemaal uit over dat kind, en riep den HEERE aan, en zeide: HEERE, mijn God, laat toch de ziel van dit kind in hem wederkomen.","22":"En de HEERE verhoorde de stem van Elia; en de ziel van het kind kwam weder in hem, dat het weder levend werd.","23":"En Elia nam het kind, en bracht het af van de opperzaal in het huis, en gaf het aan zijn moeder; en Elia zeide: Zie, uw zoon leeft.","24":"Toen zeide die vrouw tot Elia: Nu weet ik, dat gij een man Gods zijt, en dat het woord des HEEREN in uw mond waarheid is."},"KJV":{"1":"And Elijah the Tishbite, who was of the inhabitants of Gilead, said unto Ahab, As the LORD God of Israel liveth, before whom I stand, there shall not be dew nor rain these years, but according to my word.","2":"And the word of the LORD came unto him, saying,","3":"Get thee hence, and turn thee eastward, and hide thyself by the brook Cherith, that is before Jordan.","4":"And it shall be, that thou shalt drink of the brook; and I have commanded the ravens to feed thee there.","5":"So he went and did according unto the word of the LORD: for he went and dwelt by the brook Cherith, that is before Jordan.","6":"And the ravens brought him bread and flesh in the morning, and bread and flesh in the evening; and he drank of the brook.","7":"And it came to pass after a while, that the brook dried up, because there had been no rain in the land.","8":"And the word of the LORD came unto him, saying,","9":"Arise, get thee to Zarephath, which belongeth to Zidon, and dwell there: behold, I have commanded a widow woman there to sustain thee.","10":"So he arose and went to Zarephath. And when he came to the gate of the city, behold, the widow woman was there gathering of sticks: and he called to her, and said, Fetch me, I pray thee, a little water in a vessel, that I may drink.","11":"And as she was going to fetch it, he called to her, and said, Bring me, I pray thee, a morsel of bread in thine hand.","12":"And she said, As the LORD thy God liveth, I have not a cake, but an handful of meal in a barrel, and a little oil in a cruse: and, behold, I am gathering two sticks, that I may go in and dress it for me and my son, that we may eat it, and die.","13":"And Elijah said unto her, Fear not; go and do as thou hast said: but make me thereof a little cake first, and bring it unto me, and after make for thee and for thy son.","14":"For thus saith the LORD God of Israel, The barrel of meal shall not waste, neither shall the cruse of oil fail, until the day that the LORD sendeth rain upon the earth.","15":"And she went and did according to the saying of Elijah: and she, and he, and her house, did eat many days.","16":"And the barrel of meal wasted not, neither did the cruse of oil fail, according to the word of the LORD, which he spake by Elijah.","17":"And it came to pass after these things, that the son of the woman, the mistress of the house, fell sick; and his sickness was so sore, that there was no breath left in him.","18":"And she said unto Elijah, What have I to do with thee, O thou man of God? art thou come unto me to call ➔ my sin to remembrance, and to slay my son?","19":"And he said unto her, Give me thy son. And he took him out of her bosom, and carried him up into a loft, where he abode, and laid him upon his own bed.","20":"And he cried unto the LORD, and said, O LORD my God, hast thou also brought evil upon the widow with whom I sojourn, by slaying her son?","21":"And he stretched himself upon the child three times, and cried unto the LORD, and said, O LORD my God, I pray thee, let this child's soul come ➔ into him again.","22":"And the LORD heard the voice of Elijah; and the soul of the child came ➔ into him again, and he revived.","23":"And Elijah took the child, and brought him down out of the chamber into the house, and delivered him unto his mother: and Elijah said, See, thy son liveth.","24":"And the woman said to Elijah, Now by this I know that thou art a man of God, and that the word of the LORD in thy mouth is truth."}},"tsk":{"1":[{"kopje":"Elia","refs":["Matt 11:14","Matt 16:14","Matt 27:47","Matt 27:49","Luk 1:17","Luk 4:25","Luk 4:26","Luk 9:30","Luk 9:33","Luk 9:54","Joh 1:21","Joh 1:25","Rom 11:2"]},{"kopje":"Zo waarachtig als de HEERE, de God","refs":["1 Kon 22:14","2 Kon 3:14","2 Kon 5:16","Jes 49:18","Matt 7:29","Luk 1:17"]},{"kopje":"voor Wiens aangezicht","refs":["Deut 10:8","Jer 15:19","Luk 1:19","Luk 21:36","Hand 27:23"]},{"kopje":"dauw of regen","refs":["Luk 4:25","Jak 5:17","Openb 11:6"]}],"3":[{"kopje":"verberg u","refs":["1 Kon 22:25","Ps 31:21","Ps 83:4","Jer 36:19","Jer 36:26","Joh 8:59","Hand 17:14","Hebr 11:38","Openb 12:6","Openb 12:14"]}],"4":[{"kopje":"Ik heb geboden","refs":["1 Kon 17:9","1 Kon 19:5-8","Num 20:8","Job 34:29","Job 38:8-13","Job 39:3","Ps 33:8","Ps 33:9","Ps 147:9","Amos 9:3","Amos 9:4","Matt 4:4","Matt 4:11"]}],"5":[{"kopje":"deed naar het woord","refs":["1 Kon 19:9","Spr 3:5","Matt 16:24","Joh 15:14"]}],"6":[{"kopje":"de raven","refs":["Ex 16:35","Num 11:23","Richt 14:14","Richt 15:18","Richt 15:19","Ps 34:10","Ps 34:11","Ps 37:3","Ps 37:19","Ps 78:15","Ps 78:16","Ps 78:23","Ps 78:24","Jes 33:16","Jer 37:21","Jer 40:4","Hab 3:17","Hab 3:18","Matt 6:31-33","Matt 14:19-21","Matt 19:26","Luk 22:35","Hebr 6:18","Hebr 13:5","Hebr 13:6"]}],"7":[{"kopje":"de beek","refs":["Jes 40:30","Jes 40:31","Jes 54:10"]}],"8":[{"kopje":"het woord","refs":["1 Kon 17:2","Gen 22:14","Jes 41:17","Hebr 13:6"]}],"9":[{"kopje":"Zarfath","refs":["Obadja 1:20","Luk 4:26"]},{"kopje":"dat bij Sidon ligt","refs":["Matt 15:21","Matt 15:22"]},{"kopje":"weduwvrouw","refs":["1 Kon 17:4","Richt 7:2","Richt 7:4","Rom 4:17-21","2 Kor 4:7"]}],"10":[{"kopje":"Haal mij toch","refs":["Gen 21:15","Gen 24:17","Joh 4:7","2 Kor 11:27","Hebr 11:37"]}],"11":[{"kopje":"nu heenging","refs":["Gen 24:18","Gen 24:19","Matt 10:42","Matt 25:35-40","Hebr 13:2"]},{"kopje":"een stuk","refs":["1 Kon 17:9","1 Kon 18:4","Gen 18:5"]}],"12":[{"kopje":"Zo wa 75\">stand,</span> there shall not be <span class=\"wl wl-kjv\" data-code=\"H2919\">dew</span> nor <span class=\"wl wl-kjv\" data-code=\"H4306\">rain</span> these <span class=\"wl wl-kjv\" data-code=\"H8141\">years,</span> but <span class=\"wl wl-kjv\" data-code=\"H6310\">according</span> to my <span class=\"wl wl-kjv\" data-code=\"H1697\">word.</span>","2":"And the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> came unto him, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span>","3":"<span class=\"wl wl-kjv\" data-code=\"H3212\">Get</span> thee hence, and <span class=\"wl wl-kjv\" data-code=\"H6437\">turn</span> thee <span class=\"wl wl-kjv\" data-code=\"H6924\">eastward,</span> and <span class=\"wl wl-kjv\" data-code=\"H5641\">hide</span> thyself by the <span class=\"wl wl-kjv\" data-code=\"H5158\">brook</span> <span class=\"wl wl-kjv\" data-code=\"H3747\">Cherith,</span> that is <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan.</span>","4":"And it shall be, that thou shalt <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> of the <span class=\"wl wl-kjv\" data-code=\"H5158\">brook;</span> and I have <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> the <span class=\"wl wl-kjv\" data-code=\"H6158\">ravens</span> to <span class=\"wl wl-kjv\" data-code=\"H3557\">feed</span> thee there.","5":"So he <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> according unto the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> for he <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> by the <span class=\"wl wl-kjv\" data-code=\"H5158\">brook</span> <span class=\"wl wl-kjv\" data-code=\"H3747\">Cherith,</span> that is <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan.</span>","6":"And the <span class=\"wl wl-kjv\" data-code=\"H6158\">ravens</span> <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> him <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> and <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning,</span> and <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> and <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> in the <span class=\"wl wl-kjv\" data-code=\"H6153\">evening;</span> and he <span class=\"wl wl-kjv\" data-code=\"H8354\">drank</span> of the <span class=\"wl wl-kjv\" data-code=\"H5158\">brook.</span>","7":"And it came to pass <span class=\"wl wl-kjv\" data-code=\"H7093\">after</span> a <span class=\"wl wl-kjv\" data-code=\"H3117\">while,</span> that the <span class=\"wl wl-kjv\" data-code=\"H5158\">brook</span> dried <span class=\"wl wl-kjv\" data-code=\"H3001\">up,</span> because there had been no <span class=\"wl wl-kjv\" data-code=\"H1653\">rain</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land.</span>","8":"And the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> came unto him, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span>","9":"<span class=\"wl wl-kjv\" data-code=\"H6965\">Arise,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">get</span> thee to <span class=\"wl wl-kjv\" data-code=\"H6886\">Zarephath,</span> which belongeth to <span class=\"wl wl-kjv\" data-code=\"H6721\">Zidon,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> there: behold, I have <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> a <span class=\"wl wl-kjv\" data-code=\"H490\">widow</span> <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> there to <span class=\"wl wl-kjv\" data-code=\"H3557\">sustain</span> thee.","10":"So he <span class=\"wl wl-kjv\" data-code=\"H6965\">arose</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> to <span class=\"wl wl-kjv\" data-code=\"H6886\">Zarephath.</span> And when he <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the <span class=\"wl wl-kjv\" data-code=\"H6607\">gate</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> behold, the <span class=\"wl wl-kjv\" data-code=\"H490\">widow</span> <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> was there <span class=\"wl wl-kjv\" data-code=\"H7197\">gathering</span> of <span class=\"wl wl-kjv\" data-code=\"H6086\">sticks:</span> and he <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> to her, and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">Fetch</span> me, I pray thee, a <span class=\"wl wl-kjv\" data-code=\"H4592\">little</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> in a <span class=\"wl wl-kjv\" data-code=\"H3627\">vessel,</span> that I may <span class=\"wl wl-kjv\" data-code=\"H8354\">drink.</span>","11":"And as she was <span class=\"wl wl-kjv\" data-code=\"H3212\">going</span> to <span class=\"wl wl-kjv\" data-code=\"H3947\">fetch</span> it, he <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> to her, and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">Bring</span> me, I pray thee, a <span class=\"wl wl-kjv\" data-code=\"H6595\">morsel</span> of <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> in thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand.</span>","12":"And she <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> As the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> I <span cl d the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah;</span> and the <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> of the <span class=\"wl wl-kjv\" data-code=\"H3206\">child</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">came</span> ➔ into <span class=\"wl wl-kjv\" data-code=\"H7130\">him</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">again,</span> and he <span class=\"wl wl-kjv\" data-code=\"H2421\">revived.</span>","23":"And <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> the <span class=\"wl wl-kjv\" data-code=\"H3206\">child,</span> and brought him <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> out of the <span class=\"wl wl-kjv\" data-code=\"H5944\">chamber</span> into the <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> him unto his <span class=\"wl wl-kjv\" data-code=\"H517\">mother:</span> and <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">See,</span> thy <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth.</span>","24":"And the <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah,</span> Now by <span class=\"wl wl-kjv\" data-code=\"H2088\">this</span> I <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that thou art a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and that the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> in thy <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> is <span class=\"wl wl-kjv\" data-code=\"H571\">truth.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Gilead,","tekst":"Een land, gelegen over de Jordaan. Zie Gen 31:21. Sommigen verstaan een deel deszelven lands, hetwelk oostwaarts gelegen was, dat de Rubenieten, Gadieten en de halve stam van Manasse ten tijde van Saul den Hagarenen afgenomen, en daarna met nieuwe inwoners uit hun eigen volk bezet hadden, 1Ch 5:20-22, die van deze nieuwe inwoning den naam van Tisbieten zouden gekregen hebben; want Toschab betekent bij de Hebreën een inwoner."},{"catchword":"voor Wiens","tekst":"Dit is, welken ik dien. Zie Deu 10:8."},{"catchword":"indien","tekst":"Dit is een manier van zweren van welke zie Gen 14:23, en onder, vs.12."},{"catchword":"deze jaren","tekst":"Versta, de aanstaande jaren, in getal drie en zes maanden, Luk 4:25, en Jam 5:17."},{"catchword":"dan naar mijn woord","tekst":"Dat is, dan als ik het verkondigen zal, daartoe last en bevel van den Heere ontvangen hebbende; of als ik door mijn gebed den dauw en den regen van den Heere verkrijgen zal."}],"3":[{"catchword":"Krith,","tekst":"Die uit het gebergte Efraïms haar oorsprong nemende, in de Jordaan valt."}],"4":[{"catchword":"raven","tekst":"Dat God dezer beesten dienst gebruikt heeft om den profeet te spijzigen, maakt zijn wonderwerk te meer wonderlijk, overmits deze vogel zo gulzig en voor zichzelven is, dat hij zijn eigen jongen verlaat, die van honger zouden sterven, indien ze God niet wonderlijk spijzigde, Job 39:3; Psa 147:9."},{"catchword":"geboden,","tekst":"Dat is, bij Mij voorgenomen door mijn voorzienige regering, die alzo te gebruiken, dat zij u voedsel zullen toebrengen. Gebieden heet hier voornemen, waarop het uitvoeren is volgende. Alzo vs.9; Psa 78:23; Isa 5:6; Amo 9:3-4."}],"7":[{"catchword":"ten einde","tekst":"Hebreeuws, van het einde der dagen; dat is, na het einde van vele dagen. Alzo Gen 4:3; Num 9:22. Zie de aantekeningen aldaar. Deze vele dagen nu schijnen zes maanden geweest te zijn, en dat uit vergelijking van 1Ki 16:1 van het volgende 1Ki 18. Zodat Elia zes maanden geweest zou zijn bij de beek Krith, en drie jaren bij de weduwe van Sarepta."}],"8":[{"catchword":"hem,","tekst":"Namelijk, tot den profeet Elia."}],"9":[{"catchword":"Zarfath,","tekst":"Anders genaamd Sarepta, Luk 4:26, een stad, gelegen in den stam van Aser, tussen Tyrus en Sidon, van welke ook te zien is Oba 1:20."},{"catchword":"geboden,","tekst":"Dat is, voorgenomen te verwekken en te gebruiken om u van spijs te verzorgen. Vergelijk boven, de aantekeningen vs.4."}],"10":[{"catchword":"Haal mij toch","tekst":"Hebreeuws, neem mij, enz.; dat is, haal wat water, om mij daarna dat te geven. Zie Gen 12:15. Alzo in het volgende vs.11: neem mij een bete, enz.; dat is, haal het, of breng het om mij te geven."}],"12":[{"catchword":"koek heb,","tekst":"Het woord betekent eigenlijk een brood, of koek, die onder, of op de kolen, en niet in den oven gebakken is. Zie Gen 18:6. De zin is dat zij in haar huis geen gebakken brood ten beste had, zelfs niet een koekje op den heten haard met kolen gebakken."},{"catchword":"een paar houten","tekst":"Dat is, weinige houtjes, en gelijk wij zeggen: een of twee."},{"catchword":"en sterven","tekst":"Alsof zij zeide: Wanneer dit zal opgegeten zijn, wij hebben niets meer ten beste, zodat wij niet anders hebben te verwachten dan van honger te zullen moeten sterven."}],"14":[{"catchword":"Het meel","tekst":"Hebreeuws, de kruik des meels, enz., en de fles der olie, enz. De zin is dat dit zekerlijk zou geschieden, zo de vrouw Gods belofte geloofde en deed wat haar hier bevolen werd."}],"15":[{"catchword":"en deed","tekst":"De gehoorzaamheid van dit werk kwam uit de vaste toestemming van haar geloof, waardoor zij de voorzegde beloftenis aannam."},{"catchword":"huis,","tekst":"Dat is, huisgezin. Zie Gen 7:1"},{"catchword":"dagen","tekst":"Eenigen menen den tijd van drie jaren. Vergelijk de aantekeningen boven, vs.7, en onder, 1Ki 18:1."}],"16":[{"catchword":"dienst van Elia","tekst":"Hebreeuws, hand."}],"17":[{"catchword":"totdat geen adem","tekst":"Dat is, dat hij zijn geest gegeven had en waarlijk gestorven was; want het Hebreeuwse woord nesama wordt dikwijls genomen voor de ziel of geest des mensen, die van het lichaam onderscheiden is, en door den dood daar uitscheidt, gelijk Gen 2:7; Job 27:3, enz."}],"18":[{"catchword":"Wat heb ik","tekst":"Hebreeuws, wat is mij en u? Zie van deze manier van spreken 2Sa 16:10. Zij wil zeggen: Ik heb u gaarne geherbergd, verwachtende door middel van u des Heeren zegening; maar nu door het overlijden mijns zoons word ik gewaar Gods straf, die over mij komt, omdat gij misschien enige gebreken in mij gezien hebbende, God tegen mij gebeden hebt. Zou het zo zijn, tot mijn ongeluk zou ik u geherbergd hebben."},{"catchword":"gij man Gods?","tekst":"Zie boven, 1Ki 13:1."},{"catchword":"Zijt gij","tekst":"Anders, gij zijt bij mij ingekomen, enz., maar vragender wijze worden deze woorden meest overgezet."},{"catchword":"in gedachtenis","tekst":"Te weten, bij den Heere, en hem alzo tot toorn tegen mij te verwekken?"}],"20":[{"catchword":"hebt Gij","tekst":"Hij spreekt aldus, niet om God te berispen dat Hij deze vrouw tehuis zocht, maar om te klagen dat hij hieruit vreesde de lastering van Gods naam en de verachting van zijn dienst, overmits hij dit huis den zegen Gods toegezegd had."},{"catchword":"ook deze weduwe,","tekst":"Te weten, zowel als vele anderen, die door honger en dorst vergaan."}],"21":[{"catchword":"mat zich","tekst":"Dat is, hij strekt zich uit. Zie gelijke exempelen 2Ki 4:34; Act 20:10."},{"catchword":"hem","tekst":"Hebreeuws, in zijn midden, of innerste, binnenste; alzo in vs.22. Anders, in zijn lijf."},{"catchword":"wederkomen","tekst":"Een schoon bewijs, tonende dat de ziel des mensen is een onderscheiden wezen van het lichaam, d // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
