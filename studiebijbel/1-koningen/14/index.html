,"Deut 28:63-68":"En het zal gebeuren: zoals de HEERE Zich over u verblijdde door u goed te doen en u meer te maken, zo zal de HEERE Zich over u verblijden door u te vernietigen en u te verdelgen; en u zult weggerukt worden uit het land waar u naartoe gaat om het te erven. En de HEERE zal u verstrooien onder alle volken, van het ene einde van de aarde tot het andere einde van de aarde; en daar zult u andere goden dienen die u niet gekend hebt, noch uw vaderen, hout en steen. Daarbij zult u onder die volken geen rust vinden, en uw voetzool zal geen rust hebben; want de HEERE zal u daar een bevend hart geven, en bezwijking van de ogen, en kwelling van de ziel.","1 Kon 13:34":"En dit werd voor het huis van Jerobeam tot zonde, om het te doen afsnijden en te verdelgen van de aardbodem.","Hos 1:1-9":"Het woord van de Heere, dat gebeurd is tot Hosea, de zoon van Beëri, in de dagen van Uzzia, Jotham, Achaz, Hizkia, koningen van Juda, en in de dagen van Jerobeam, zoon van Joas, koning van Israël. Het begin van het woord van de Heere door Hosea. De Heere zei toen tegen Hosea: Ga heen, neem u een vrouw van hoererijen, en kinderen van hoererijen; want het land hoereert helemaal van achter de Heere vandaan. Zo ging hij heen, en nam Gomer, een dochter van Diblaim; en zij ontving, en baarde hem een zoon.","Hebr 4:13":"En er is geen schepsel onzichtbaar voor Hem; maar alle dingen zijn naakt en geopend voor de ogen van Hem, met Wie wij te maken hebben.","Filem 1:6":"Opdat de gemeenschap van uw geloof krachtig wordt in de bekendmaking van al het goede dat in u is door Christus Jezus.","Ezech 33:22":"Nu was de hand van de HEERE 's avonds op mij geweest, voordat wie ontkomen was kwam, en Hij had mijn mond geopend, totdat hij 's morgens tot mij kwam. Zo werd mijn mond geopend, en ik was niet meer stom.","Est 6:1":"Diezelfde nacht kon de koning niet slapen, en hij zei dat men het boek van de gedenkwaardigheden, de kronieken, moest brengen; en die werden voorgelezen in de tegenwoordigheid van de koning.","Ezech 3:24":"Toen kwam de Geest in mij, en stelde mij op mijn voeten, en Hij sprak met mij, en zei tot mij: Ga, sluit u binnen in uw huis.","Ps 90:10":"Aangaande de dagen van onze jaren, daarin zijn zeventig jaren, of, als wij zeer sterk zijn, tachtig jaren; en het voortreffelijkste van die is moeite en verdriet; want het wordt snel afgesneden, en wij vliegen daarheen.","Job 33:14-16":"Maar God spreekt eens of tweemaal; doch men let daar niet op. In de droom, door het gezicht 's nachts, als een diepe slaap op de mensen valt, in de sluimering op het leger; Dan openbaart Hij het voor het oor der mensen, en Hij verzegelt hun kastijding;","Joz 18:1":"En de hele gemeenschap van de kinderen van Israël verzamelde zich te Silo, en zij richtten daar de tent van de samenkomst op, nadat het land aan hen onderworpen was.","Hos 5:11":"Efraïm is verdrukt, hij is verpletterd met recht; want hij heeft dat zo gewild; hij heeft gewandeld naar het gebod.","Richt 6:34":"Toen bekleedde de Geest van de HEERE Gideon, en hij blies op de bazuin, en de Abiëzrieten werden achter hem bijeengeroepen.","Joz 3:7":"Want de HEERE had tegen Jozua gezegd: Deze dag zal Ik beginnen u groot te maken voor de ogen van heel Israël, opdat zij weten dat Ik met u zal zijn, zoals Ik met Mozes geweest ben.","2 Sam 23:3":"De God van Israël heeft gezegd, de Rotssteen van Israël heeft tot mij gesproken: Er zal een Heerser zijn over de mensen, een Rechtvaardige, een Heerser in de vreze van God.","1 Petr 4:4":"waarin zij het vreemd vinden dat u niet meeloopt naar dezelfde uitspatting van losbandigheid, en u belasteren;","Hand 13:36":"Want David is, nadat hij in zijn tijd de raad van God gediend had, ontslapen, en is bij zijn vaderen gelegd, en heeft wel verderving gezien;","Ezech 39:17-19":"U dan, mensenkind! Zo zegt de Heere HEERE: Zeg tegen het gevogelte van elke vleugel, en tegen alle dieren van het veld: Verzamel u, en kom aan, verzamel u van rondom, bij Mijn slachtoffer dat Ik voor u geslacht heb, een groot slachtoffer, op de bergen van Israël, en eet vlees, en drink bloed. Het vlees van de helden zult u eten, en het bloed van de vorsten van de aarde drinken; van rammen, van lammeren, en bokken, en stieren, die allemaal gemest zijn van Basan. En u zult het vet eten tot verzadiging toe, en bloed drinken tot dronkenschap toe; van Mijn slachtoffer, dat Ik voor u geslacht heb.","Ps 87:2":"De HEERE heeft de poorten van Sion lief, boven alle woningen van Jakob.","Jer 1:1":"De woorden van Jeremia, de zoon van Hilkia, uit de priesters die te Anathoth waren, in het land van Benjamin;","1 Kon 22:47":"Ook verwijderde hij uit het land de overige schandjongens, die in de dagen van zijn vader Asa overgebleven waren.","1 Sam 4:20":"En omstreeks het tijdstip van haar sterven zeiden de vrouwen die bij haar stonden: Wees niet bang, want u hebt een zoon gebaard. Maar zij antwoordde niet, en trok het zich niet aan.","Jes 6:1-9":"In het jaar dat koning Uzzia stierf, zag ik de Heere zitten op een hoge en verheven troon, en Zijn zomen vulden de tempel. De serafs stonden boven Hem; ieder had zes vleugels; met twee bedekte ieder zijn gezicht, en met twee bedekte hij zijn voeten, en met twee vloog hij. En de een riep tot de ander en zei: Heilig, heilig, heilig is de HEERE van de heerscharen! De hele aarde is vol van Zijn heerlijkheid!","1 Sam 15:16":"Toen zei Samuël tegen Saul: Houd op, dan zal ik u vertellen wat de HEERE vannacht tot mij gesproken heeft. Hij dan zei tegen hem: Spreek.","1 Kon 7:51":"Zo werd al het werk voltooid dat koning Salomo voor het huis van de HEERE maakte. Daarna bracht Salomo de geheiligde dingen van zijn vader David: het zilver, het goud, en de voorwerpen legde hij bij de schatten van het huis van de HEERE.","1 Kon 14:5-16":"Maar de HEERE zei tegen Ahia: Zie, Jerobeams vrouw komt om u iets te vragen over haar zoon, want hij is ziek. Zo en zo zult u tot haar spreken, en het zal gebeuren, als zij binnenkomt, dat zij zich als een andere vrouw zal voordoen. En het gebeurde, toen Ahia het geluid van haar voeten hoorde, terwijl zij bij de deur binnenkwam, dat hij zei: Kom binnen, vrouw van Jerobeam! Waarom stelt u zich zo vreemd aan? Want ik ben naar u toe gestuurd met een harde boodschap. Ga heen, zeg tegen Jerobeam: Zo zegt de HEERE, de God van Israël: Omdat Ik u verheven heb uit het midden van het volk, en u tot een leider over Mijn volk Israël gesteld heb;","1 Kon 12:28":"Daarom hield de koning een raad, en maakte twee gouden kalveren; en hij zei tegen hen: Het is voor u teveel om naar Jeruzalem op te gaan; zie uw goden, o Israël, die u uit het land Egypte hebben opgevoerd.","Matt 11:7":"Toen nu deze mensen weggingen, begon Jezus tot de menigten te zeggen van Johannes: Wat bent u uitgegaan te zien in de woestijn? Een riet, dat door de wind heen en weer bewogen wordt?","1 Kon 21:21":"Zie, Ik zal kwaad over u brengen, en uw nakomelingen wegdoen; en Ik zal van Achab uitroeien wie mannelijk is, alsook wie in Israël afgesloten is en wie verlaten is.","Luk 20:20-23":"En zij hielden Hem in de gaten, en stuurden spionnen die zichzelf voordeden als rechtvaardige mensen, opdat zij Hem in Zijn woorden konden vangen, om Hem aan de heerschappij en de macht van de stadhouder over te leveren. En zij vroegen Hem: Meester, wij weten dat U juist spreekt en leert, en niemand naar de ogen ziet, maar de weg van God in waarheid leert. Is het ons geoorloofd de keizer belasting te betalen, of niet?","2 Kon 18:12":"Omdat zij de stem van de HEERE, hun God, niet gehoorzaam waren geweest, maar Zijn verbond overtreden hadden; en al wat Mozes, de knecht van de HEERE, geboden had, dat hadden zij niet gehoord, noch gedaan.","Jer 5:31":"De profeten profeteren vals, en de priesters heersen door hun eigen hand; en Mijn volk heeft het graag zo; maar wat zult u aan het einde daarvan doen?","Jes 30:2":"Die gaan om af te trekken naar Egypte, en vragen Mijn mond niet; om zich te sterken met de macht van Farao, en om hun toevlucht te nemen onder de schaduw van Egypte.","1 Kon 15:1":"In het achttiende jaar van koning Jerobeam, de zoon van Nebat, werd Abiam koning over Juda.","1 Kon 20:13-28":"En zie, een profeet trad naar Achab, de koning van Israël, en zei: Zo zegt de HEERE: Hebt u al deze grote menigte gezien? Zie, Ik zal ze heden in uw hand geven, opdat u weet, dat Ik de HEERE ben. En Achab zei: Door wie? En hij zei: Zo zegt de HEERE: Door de jongens van de leiders van de landschappen. En hij zei: Wie zal de strijd aanbinden? En hij zei: U. Toen telde hij de jongens van de leiders van de landschappen, en zij waren tweehonderdtwee en dertig; en na hen telde hij al het volk, alle kinderen van Israël, zevenduizend.","1 Kon 15:14":"De hoogten werden wel niet weggenomen; toch was het hart van Asa volkomen met de HEERE, al zijn dagen.","Num 24:15":"Toen hief hij zijn spreuk op en zei: Bileam, de zoon van Beor, spreekt, en die man wiens ogen geopend zijn, spreekt!","1 Kon 11:29-39":"Het gebeurde nu in die tijd, toen Jerobeam uit Jeruzalem wegging, dat de profeet Ahia, de Siloniet, hem op de weg vond; hij had zich een nieuw kleed aangedaan, en zij beiden waren alleen op het veld; toen greep Ahia het nieuwe kleed dat hij aanhad, en scheurde het in twaalf stukken. En hij zei tegen Jerobeam: Neem tien stukken voor uzelf; want zo zegt de HEERE, de God van Israël: Zie, Ik zal het koninkrijk uit de hand van Salomo scheuren, en u tien stammen geven.","Ezech 16:17":"Daarbij hebt u de voorwerpen van uw sieraad genomen, van Mijn goud en van Mijn zilver, dat Ik u gegeven had, en u hebt zich mannenbeelden gemaakt, en u hebt daarmee gehoereerd.","2 Petr 2:3":"En zij zullen door hebzucht, met gemaakte woorden, van u een koopwaar maken; over hen is het oordeel van lang geleden niet werkeloos, en hun verderf sluimert niet.","1 Sam 2:20-34":"En Eli zegende Elkana en zijn vrouw, en zei: De HEERE geeft u nageslacht uit deze vrouw, voor de bede die zij aan de HEERE heeft afgebeden. En zij gingen naar hun eigen plaats. Want de HEERE bezocht Hanna, en zij werd zwanger en baarde drie zonen en twee dochters; en de jongen Samuël werd groot bij de HEERE. Doch Eli was zeer oud, en hoorde alles wat zijn zonen aan heel Israël deden, en dat zij sliepen bij de vrouwen die met velen samenkwamen bij de deur van de tent van de samenkomst."},"noten":{},"koppeling":{"1":"In die <span class=\"wl\" data-l=\"L2\" data-code=\"H6256\">tijd</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H6256\">werd</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H29\">Abia</span>, <span class=\"wl\" data-l=\"L3\" data-code=\"H29\">de</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H1121\">zoon</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1931\">van</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H3379\">Jerobeam</span>, <span class=\"wl\" data-l=\"L6\" data-code=\"H2470\">ziek</span>.","2":"<span class=\"wl\" data-l=\"L1\" data-code=\"H3379\">En</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H3379\">Jerobeam</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H559\">zei</span> tegen zijn vrouw: Sta <span class=\"wl\" data-l=\"L3\" data-code=\"H6258\">nu</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H6258\">op</span>, <span class=\"wl\" data-l=\"L4\" data-code=\"H8138\">en</span> verkleed <span class=\"wl\" data-l=\"L3\" data-code=\"H6258\">u</span>, zodat <span class=\"wl\" data-l=\"L5\" data-code=\"H3808\">men</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H3808\">niet</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H3045\">merkt</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H3808\">dat</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H8138\">u</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H3379\">Jerobeams</span> vrouw <span class=\"wl\" data-l=\"L8\" data-code=\"H1980\">bent</span>, <span class=\"wl\" data-l=\"L8\" data-code=\"H1980\">en</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H1980\">ga</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H1980\">naar</span> <span cl  wl-kjv\" data-code=\"H3045\">known</span> to be the <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> of <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam;</span> and <span class=\"wl wl-kjv\" data-code=\"H1980\">get</span> thee to <span class=\"wl wl-kjv\" data-code=\"H7887\">Shiloh:</span> behold, there is <span class=\"wl wl-kjv\" data-code=\"H281\">Ahijah</span> the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet,</span> which <span class=\"wl wl-kjv\" data-code=\"H1696\">told</span> me that I should be <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> over this <span class=\"wl wl-kjv\" data-code=\"H5971\">people.</span>","3":"And <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> with <span class=\"wl wl-kjv\" data-code=\"H3027\">thee</span> <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">loaves,</span> and <span class=\"wl wl-kjv\" data-code=\"H5350\">cracknels,</span> and a <span class=\"wl wl-kjv\" data-code=\"H1228\">cruse</span> of <span class=\"wl wl-kjv\" data-code=\"H1706\">honey,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">go</span> to him: he shall <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> thee what shall become of the <span class=\"wl wl-kjv\" data-code=\"H5288\">child.</span>","4":"And <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam's</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> did <span class=\"wl wl-kjv\" data-code=\"H6213\">so,</span> and <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> to <span class=\"wl wl-kjv\" data-code=\"H7887\">Shiloh,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H281\">Ahijah.</span> But <span class=\"wl wl-kjv\" data-code=\"H281\">Ahijah</span> <span class=\"wl wl-kjv\" data-code=\"H3201\">could</span> not <span class=\"wl wl-kjv\" data-code=\"H7200\">see;</span> for his <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> were <span class=\"wl wl-kjv\" data-code=\"H6965\">set</span> by reason of his <span class=\"wl wl-kjv\" data-code=\"H7869\">age.</span>","5":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H281\">Ahijah,</span> Behold, the <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> of <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam</span> <span class=\"wl wl-kjv\" data-code=\"H935\">cometh</span> to <span class=\"wl wl-kjv\" data-code=\"H1875\">ask</span> a <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> of thee for her <span class=\"wl wl-kjv\" data-code=\"H1121\">son;</span> for he is <span class=\"wl wl-kjv\" data-code=\"H2470\">sick:</span> <span class=\"wl wl-kjv\" data-code=\"H2090\">thus</span> and thus shalt thou <span class=\"wl wl-kjv\" data-code=\"H1696\">say</span> unto her: for it shall be, when she cometh <span class=\"wl wl-kjv\" data-code=\"H935\">in,</span> that she shall feign herself to be <span class=\"wl wl-kjv\" data-code=\"H5234\">another</span> woman.","6":"And it was so, when <span class=\"wl wl-kjv\" data-code=\"H281\">Ahijah</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> the <span class=\"wl wl-kjv\" data-code=\"H6963\">sound</span> of her <span class=\"wl wl-kjv\" data-code=\"H7272\">feet,</span> as she came <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> at the <span class=\"wl wl-kjv\" data-code=\"H6607\">door,</span> that he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Come <span class=\"wl wl-kjv\" data-code=\"H935\">in,</span> thou <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> of <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam;</span> why feignest thou thyself to be <span class=\"wl wl-kjv\" data-code=\"H5234\">another?</span> for I am <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> to thee with <span class=\"wl wl-kjv\" data-code=\"H7186\">heavy</span> tidings.","7":"<span class=\"wl wl-kjv\" data-code=\"H3212\">Go,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">tell</span> <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> Forasmuch <span class=\"wl wl-kjv\" data-code=\"H3282\">as</span> I <span class=\"wl wl-kjv\" data-code=\"H7311\">exalted</span> thee from <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">made</span> thee <span class=\"wl wl-kjv\" data-code=\"H5057\">prince</span> over my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span>","8":"And <span class=\"wl wl-kjv\" data-code=\"H7167\">rent</span> ➔ the <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdom</span> <span class=\"wl wl-kjv\" data-code=\"H7167\">away</span> from the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> it thee: and yet thou hast not been as my <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> who <span class=\"wl wl-kjv\" data-code=\"H8104\">kept</span> my <span class=\"wl wl-kjv\" data-code=\"H4687\">commandments,</span> and who <span class=\"wl wl-kjv\" data-code=\"H1980\">followed</span> me with all his <span class=\"wl wl-kjv\" data-code=\"H3824\">heart,</span> to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> that only which was <span class=\"wl wl-kjv\" data-code=\"H3477\">right</span> in mine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes;</span>","9":"But hast <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> <span class=\"wl wl-kjv\" data-code=\"H7489\">evil</span> above all that were <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thee: for thou hast <span class=\"wl wl-kjv\" data-code=\"H3212\">gone</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> thee <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> <span class=\"wl wl-kjv\" data-code=\"H430\">gods,</span> and molten <span class=\"wl wl-kjv\" data-code=\"H4541\">images,</span> to provoke me to <span class=\"wl wl-kjv\" data-code=\"H3707\">anger,</span> and hast <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> me <span class=\"wl wl-kjv\" data-code=\"H310\">behind</span> thy <span class=\"wl wl-kjv\" data-code=\"H1458\">back:</span>","10":"Therefore, behold, I will <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> upon the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam,</span> and will cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> from <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam</span> him that <span class=\"wl wl-kjv\" data-code=\"H8366\">pisseth</span> against the <span class=\"wl wl-kjv\" data-code=\"H7023\">wall,</span> and him that is shut <span class=\"wl wl-kjv\" data-code=\"H6113\">up</span> and <span class=\"wl wl-kjv\" data-code=\"H5800\">left</span> in <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and will take <span class=\"wl wl-kjv\" data-code=\"H1197\">away</span> the <span class=\"wl wl-kjv\" data-code=\"H310\">remnant</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam,</span> as a man taketh <span class=\"wl wl-kjv\" data-code=\"H1197\">away</span> <span class=\"wl wl-kjv\" data-code=\"H1557\">dung,</span> till it be all <span class=\"wl wl-kjv\" data-code=\"H8552\">gone.</span>","11":"Him that <span class=\"wl wl-kjv\" data-code=\"H4191\">dieth</span> of <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam</span> in the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> shall the <span class=\"wl wl-kjv\" data-code=\"H3611\">dogs</span> <span class=\"wl wl-kjv\" data-code=\"H398\">eat;</span> and him that <span class=\"wl wl-kjv\" data-code=\"H4191\">dieth</span> in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> shall the <span class=\"wl wl-kjv\" data-code=\"H5775\">fowls</span> of the <span class=\"wl wl-kjv\" data-code=\"H8064\">air</span> <span class=\"wl wl-kjv\" data-code=\"H398\">eat:</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> it.","12":"<span class=\"wl wl-kjv\" data-code=\"H6965\">Arise</span> thou therefore, <span class=\"wl wl-kjv\" data-code=\"H3212\">get</span> thee to thine own <span class=\"wl wl-kjv\" data-code=\"H1004\">house:</span> and when thy <span class=\"wl wl-kjv\" data-code=\"H7272\">feet</span> <span class=\"wl wl-kjv\" data-code=\"H935\">enter</span> into the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> the <span class=\"wl wl-kjv\" data-code=\"H3206\">child</span> shall <span class=\"wl wl-kjv\" data-code=\"H4191\">die.</span>","13":"And all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> shall <span class=\"wl wl-kjv\" data-code=\"H5594\">mourn</span> for him, and <span class=\"wl wl-kjv\" data-code=\"H6912\">bury</span> him: for he only of <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to the <span class=\"wl wl-kjv\" data-code=\"H6913\">grave,</span> because in him there is <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> some <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> toward the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam.</span>","14":"Moreover the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall raise him <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> a <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> over <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> who shall cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam</span> that <span class=\"wl wl-kjv\" data-code=\"H3117\">day:</span> but what? even now.","15":"For the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> as a <span class=\"wl wl-kjv\" data-code=\"H7070\">reed</span> is <span class=\"wl wl-kjv\" data-code=\"H5110\">shaken</span> in the <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and he shall root <span class=\"wl wl-kjv\" data-code=\"H5428\">up</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> out of this <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H127\">land,</span> which he <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> to their <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H2219\">scatter</span> them <span class=\"wl wl-kjv\" data-code=\"H5676\">beyond</span> the <span class=\"wl wl-kjv\" data-code=\"H5104\">river,</span> because they have <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> their <span class=\"wl wl-kjv\" data-code=\"H842\">groves,</span> provoking the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> to <span class=\"wl wl-kjv\" data-code=\"H3707\">anger.</span>","16":"And he shall <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> ➔ <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">up</span> <span class=\"wl wl-kjv\" data-code=\"H1558\">because</span> of the <span class=\"wl wl-kjv\" data-code=\"H2403\">sins</span> of <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam,</span> who did <span class=\"wl wl-kjv\" data-code=\"H2398\">sin,</span> and who made <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> to <span class=\"wl wl-kjv\" data-code=\"H2398\">sin.</span>","17":"And <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam's</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">departed,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H8656\">Tirzah:</span> and when she <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the <span class=\"wl wl-kjv\" data-code=\"H5592\">threshold</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">door,</span> the <span class=\"wl wl-kjv\" data-code=\"H5288\">child</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">died;</span>","18":"And they <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> him; and all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H5594\">mourned</span> for him, according to the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> which he <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> by the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of his <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H281\">Ahijah</span> the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet.</span>","19":"And the <span class=\"wl wl-kjv\" data-code=\"H3499\">rest</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">acts</span> of <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam,</span> how he <span class=\"wl wl-kjv\" data-code=\"H3898\">warred,</span> and how he <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned,</span> behold, they are <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in the <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">chronicles</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","20":"And the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> which <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> were <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> and <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years:</span> and he <span class=\"wl wl-kjv\" data-code=\"H7901\">slept</span> with his <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> and <span class=\"wl wl-kjv\" data-code=\"H5070\">Nadab</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> in his stead.","21":"And <span class=\"wl wl-kjv\" data-code=\"H7346\">Rehoboam</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> in <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah.</span> <span class=\"wl wl-kjv\" data-code=\"H7346\">Rehoboam</span> was <span class=\"wl wl-kjv\" data-code=\"H705\">forty</span> and <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">old</span> when he began to <span class=\"wl wl-kjv\" data-code=\"H4427\">reign,</span> and he <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seventeen</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> did <span class=\"wl wl-kjv\" data-code=\"H977\">choose</span> out of all the <span class=\"wl wl-kjv\" data-code=\"H7626\">tribes</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> to <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> there. And his <span class=\"wl wl-kjv\" data-code=\"H517\">mother's</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> was <span class=\"wl wl-kjv\" data-code=\"H5279\">Naamah</span> an <span class=\"wl wl-kjv\" data-code=\"H5985\">Ammonitess.</span>","22":"And <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and they provoked him to <span class=\"wl wl-kjv\" data-code=\"H7065\">jealousy</span> with their <span class=\"wl wl-kjv\" data-code=\"H2403\">sins</span> which they had <span class=\"wl wl-kjv\" data-code=\"H2398\">committed,</span> above all that their <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> had <span class=\"wl wl-kjv\" data-code=\"H6213\">done.</span>","23":"For they also <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> them high <span class=\"wl wl-kjv\" data-code=\"H1116\">places,</span> and <span class=\"wl wl-kjv\" data-code=\"H4676\">images,</span> and <span class=\"wl wl-kjv\" data-code=\"H842\">groves,</span> on every <span class=\"wl wl-kjv\" data-code=\"H1364\">high</span> <span class=\"wl wl-kjv\" data-code=\"H1389\">hill,</span> and under every <span class=\"wl wl-kjv\" data-code=\"H7488\">green</span> <span class=\"wl wl-kjv\" data-code=\"H6086\">tree.</span>","24":"And there were also <span class=\"wl wl-kjv\" data-code=\"H6945\">sodomites</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land:</span> and they <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> according to all the <span class=\"wl wl-kjv\" data-code=\"H8441\">abominations</span> of the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> cast <span class=\"wl wl-kjv\" data-code=\"H3423\">out</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","25":"And it came to pass in the <span class=\"wl wl-kjv\" data-code=\"H2549\">fifth</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H7346\">Rehoboam,</span> that <span class=\"wl wl-kjv\" data-code=\"H7895\">Shishak</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> came <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> against <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem:</span>","26":"And he took <span class=\"wl wl-kjv\" data-code=\"H3947\">away</span> the <span l wl-kjv\" data-code=\"H7323\">guard</span> <span class=\"wl wl-kjv\" data-code=\"H5375\">bare</span> them, and brought them <span class=\"wl wl-kjv\" data-code=\"H7725\">back</span> into the <span class=\"wl wl-kjv\" data-code=\"H7323\">guard</span> <span class=\"wl wl-kjv\" data-code=\"H8372\">chamber.</span>","29":"Now the <span class=\"wl wl-kjv\" data-code=\"H3499\">rest</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">acts</span> of <span class=\"wl wl-kjv\" data-code=\"H7346\">Rehoboam,</span> and all that he <span class=\"wl wl-kjv\" data-code=\"H6213\">did,</span> are they not <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in the <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">chronicles</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah?</span>","30":"And there was <span class=\"wl wl-kjv\" data-code=\"H4421\">war</span> between <span class=\"wl wl-kjv\" data-code=\"H7346\">Rehoboam</span> and <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam</span> all their <span class=\"wl wl-kjv\" data-code=\"H3117\">days.</span>","31":"And <span class=\"wl wl-kjv\" data-code=\"H7346\">Rehoboam</span> <span class=\"wl wl-kjv\" data-code=\"H7901\">slept</span> with his <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> and was <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> with his <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> in the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David.</span> And his <span class=\"wl wl-kjv\" data-code=\"H517\">mother's</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> was <span class=\"wl wl-kjv\" data-code=\"H5279\">Naamah</span> an <span class=\"wl wl-kjv\" data-code=\"H5985\">Ammonitess.</span> And <span class=\"wl wl-kjv\" data-code=\"H38\">Abijam</span> his const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    if (!kjvTekst && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
</html>
