ren, als zij binnenkomt, dat zij zich als een andere vrouw zal voordoen.","6":"En het gebeurde, toen Ahia het geluid van haar voeten hoorde, terwijl zij bij de deur binnenkwam, dat hij zei: Kom binnen, vrouw van Jerobeam! Waarom stelt u zich zo vreemd aan? Want ik ben naar u toe gestuurd met een harde *boodschap*.","7":"Ga heen, zeg tegen Jerobeam: Zo zegt de HEERE, de God van Israël: Omdat Ik u verheven heb uit het midden van het volk, en u tot een leider over Mijn volk Israël gesteld heb;","8":"en het koninkrijk van het huis van David weggescheurd heb, en dat aan u gegeven heb, en u niet geweest bent zoals Mijn dienaar David, die Mijn geboden hield, en Mij met heel zijn hart navolgde, om alleen te doen wat recht is in Mijn ogen;","9":"maar kwaad gedaan hebt, meer dan allen die vóór u geweest zijn, en heengegaan bent, en u andere goden en gegoten beelden gemaakt hebt, om Mij tot toorn te verwekken, en Mij achter uw rug geworpen hebt;","10":"daarom, zie, Ik zal kwaad brengen over het huis van Jerobeam, en van Jerobeam uitroeien alwie mannelijk is, zowel wie in de macht is als wie is overgebleven in Israël; en Ik zal de nakomelingen van het huis van Jerobeam wegvegen, zoals men drek wegveegt, totdat het helemaal vergaan is.","11":"Wie van Jerobeam in de stad sterft, zullen de honden opeten; en wie in het veld sterft, zullen de vogels van de hemel opeten; want de HEERE heeft het gesproken.","12":"U dan, sta op, ga naar uw huis; zodra uw voeten de stad binnenkomen, zal het kind sterven.","13":"En heel Israël zal hem beklagen en hem begraven; want deze alleen van Jerobeam zal in het graf komen, omdat in hem iets goeds gevonden is voor de HEERE, de God van Israël, in het huis van Jerobeam.","14":"Doch de HEERE zal Zich een koning verwekken over Israël, die het huis van Jerobeam op diezelfde dag zal uitroeien; maar wat zal het ook nu zijn?","15":"De HEERE zal ook Israël slaan, zoals een riet heen en weer bewogen wordt in het water, en zal Israël uitrukken uit dit goede land, dat Hij hun vaderen gegeven heeft, en zal hen verstrooien aan de overkant van de rivier; omdat zij hun gewijde palen gemaakt hebben, en de HEERE tot toorn verwekt hebben.","16":"En Hij zal Israël overgeven, vanwege de zonden van Jerobeam, die gezondigd heeft, en die Israël heeft doen zondigen.","17":"Toen stond Jerobeams vrouw op, en ging heen, en kwam in Thirza; en toen zij op de drempel van het huis kwam, stierf de jongen.","18":"En zij begroeven hem, en heel Israël beklaagde hem; naar het woord van de HEERE, dat Hij gesproken had door de dienst van Zijn dienaar Ahia, de profeet.","19":"Het overige nu van de geschiedenis van Jerobeam, hoe hij oorlog voerde, en hoe hij geregeerd heeft, zie, dat staat geschreven in het boek van de kronieken van de koningen van Israël.","20":"De dagen nu dat Jerobeam geregeerd heeft, zijn tweeëntwintig jaren; en hij ontsliep met zijn vaderen, en Nadab, zijn zoon, regeerde in zijn plaats.","21":"Rehabeam nu, de zoon van Salomo, regeerde in Juda; eenenveertig jaren was Rehabeam oud toen hij koning werd, en hij regeerde zeventien jaren te Jeruzalem, in de stad die de HEERE gekozen had uit al de stammen van Israël, om Zijn Naam daar te vestigen; en de naam van zijn moeder was Naäma, de Ammonietische.","22":"En Juda deed wat kwaad was in de ogen van de HEERE, en zij verwekten Hem tot ijver, meer dan al hun vaderen gedaan hadden, met hun zonden die zij zondigden.","23":"Want ook zij bouwden zich hoogten, en gewijde stenen, en gewijde palen, op elke hoge heuvel, en onder elke bladerrijke boom.","24":"Er waren ook schandjongens in het land; zij deden naar al de gruwelen van de heidenvolken, die de HEERE van voor het aangezicht van de kinderen van Israël uit hun bezit verdreven had.","25":"Het gebeurde nu in het vijfde jaar van koning Rehabeam, dat Sisak, de koning van Egypte, optrok tegen Jeruzalem.","26":"En hij nam de schatten van het huis van de HEERE, en de schatten van het huis van de koning weg, ja, hij nam alles weg; hij nam ook al de gouden schilden weg die Salomo gemaakt had.","27":"En koning Rehabeam maakte in plaats daarvan koperen schilden; en hij vertrouwde die toe aan de hand van de aanvoerders van de lijfwacht, die de deur van het huis van de koning bewaakten.","28":"En het gebeurde, telkens wanneer de koning in het huis van de HEERE ging, dat de lijfwacht ze droeg, en ze terugbracht naar de wachtkamer van de lijfwacht.","29":"Het overige nu van de geschiedenis van Rehabeam, en alles wat hij gedaan heeft, staat dat niet geschreven in het boek van de kronieken van de koningen van Juda?","30":"En er was oorlog tussen Rehabeam en Jerobeam, al hun dagen.","31":"En Rehabeam ontsliep met zijn vaderen, en werd begraven bij zijn vaderen in de stad van David; en de naam van zijn moeder was Naäma, de Ammonietische; en zijn zoon Abiam regeerde in zijn plaats."},"SV":{"1":"Te dierzelfder tijd was Abia, de zoon van Jerobeam, krank.","2":"En Jerobeam zeide tot zijn huisvrouw: Maak u nu op, en verstel u, dat men niet merkte, dat gij Jerobeams huisvrouw zijt, en ga heen naar Silo, zie, daar is de profeet Ahia, die van mij gesproken heeft, dat ik koning zou zijn over dit volk.","3":"En neem in uw hand tien broden, en koeken, en een kruik honig, en ga tot hem; hij zal u te kennen geven, wat dezen jongen geschieden zal.","4":"En Jerobeams huisvrouw deed alzo, en maakte zich op, en ging naar Silo, en kwam in het huis van Ahia. Ahia nu kon niet zien, want zijn ogen stonden stijf vanwege zijn ouderdom.","5":"Maar de HEERE zeide tot Ahia: Zie, Jerobeams huisvrouw komt, om een zaak van u te vragen, aangaande haar zoon, want hij is krank; zo en zo zult gij tot haar spreken, en het zal zijn, als zij inkomt, dat zij zich vreemd aanstellen zal.","6":"En het geschiedde, als Ahia het geruis harer voeten hoorde, toen zij ter deure inkwam, dat hij zeide: Kom in, gij huisvrouw van Jerobeam! Waarom stelt gij u dus vreemd aan? Want ik ben tot u gezonden met een harde *boodschap*.","7":"Ga heen, zeg Jerobeam: Zo zegt de HEERE, de God Israëls: Daarom, dat Ik u verheven heb uit het midden des volks, en u tot een voorganger over Mijn volk Israël gesteld heb;","8":"En het koninkrijk van het huis van David gescheurd, en dat u gegeven heb, en gij niet geweest zijt, gelijk Mijn knecht David, die Mijn geboden hield, en die Mij met zijn ganse hart navolgde, om te doen alleen wat recht is in Mijn ogen;","9":"Maar kwaad gedaan hebt, doende des meer dan allen, die voor u geweest zijn, en henengegaan zijt, en hebt u andere goden en gegotene beelden gemaakt, om Mij tot toorn te verwekken, en hebt Mij achter uw rug geworpen;","10":"Daarom, zie, Ik zal kwaad over het huis van Jerobeam brengen, en van Jerobeam uitroeien wat mannelijk is, den beslotene en verlatene in Israël; en Ik zal de nakomelingen van het huis van Jerobeam wegdoen, gelijk de drek weggedaan wordt, totdat het ganselijk vergaan zij.","11":"Die van Jerobeam in de stad sterft, zullen de honden eten; en die in het veld sterft, zullen de vogelen des hemels eten; want de HEERE heeft het gesproken.","12":"Gij dan maak u op, ga naar uw huis; als uw voeten in de stad zullen gekomen zijn, zo zal het kind sterven.","13":"En gans Israël zal hem beklagen, en hem begraven; want deze alleen van Jerobeam zal in het graf komen, omdat in hem wat goeds voor den HEERE, den God Israëls, in het huis van Jerobeam gevonden is.","14":"Doch de HEERE zal Zich een koning verwekken over Israël, die het huis van Jerobeam ten zelfden dage uitroeien zal; maar wat zal het ook nu zijn?","15":"De HEERE zal ook Israël slaan, gelijk een riet in het water omgedreven wordt, en zal Israël uitrukken uit dit goede land, dat Hij hun vaderen gegeven heeft, en zal hen verstrooien op gene zijde der rivier; daarom dat zij hun bossen gemaakt hebben, den HEERE tot toorn verwekkende.","16":"En Hij zal Israël overgeven, om Jerobeams zonden wil, die gezondigd heeft, en die Israël heeft doen zondigen.","17":"Toen maakte zich Jerobeams vrouw op, en ging heen, en kwam te Thirza; ls zij nu op den dorpel van het huis kwam, zo stierf de jongeling.","18":"En zij begroeven hem, en gans Israël beklaagde hem; naar het woord des HEEREN, dat Hij gesproken had door den dienst van Zijn knecht Ahia, den profeet.","19":"Het overige nu der geschiedenissen van Jerobeam, hoe hij gekrijgd, en hoe hij geregeerd heeft, ziet, die zijn geschreven in het boek der kronieken der koningen van Israël.","20":"De dagen nu, die Jerobeam heeft geregeerd, zijn twee en twintig jaren; en hij ontsliep met zijn vaderen, en Nadab, zijn zoon, regeerde in zijn plaats.","21":"Rehabeam nu, de zoon van Salomo, regeerde in Juda; een en veertig jaren was Rehabeam oud, als hij koning werd, en regeerde zeventien jaren te Jeruzalem, in de stad, die de HEERE verkoren had uit al de stammen van Israël, om Zijn Naam daar te zetten; en de naam zijner moeder was Naäma, de Ammonietische.","22":"En Juda deed, wat kwaad was in de ogen des HEEREN, en zij verwekten Hem tot ijver, meer dan al hun vaderen gedaan hadden, met hun zonden, die zij zondigden.","23":"Want ook zij bouwden zich hoogten, en opgerichte beelden, en bossen, op allen hogen heuvel, en onder allen groenen boom.","24":"Er waren ook schandjongens in het land; zij deden naar al de gruwelen der heidenen, die de HEERE van het aangezicht der kinderen Israëls uit de bezitting verdreven had.","25":"Het geschiedde nu in het vijfde jaar van den koning Rehabeam, *dat* Sisak, de koning van Egypte, optoog tegen Jeruzalem.","26":"En hij nam de schatten van het huis des HEEREN, en de schatten van het huis des konings weg, ja, hij nam alles weg; hij nam ook al de gouden schilden weg, die Salomo gemaakt had.","27":"En de koning Rehabeam maakte, in plaats van die, koperen schilden; en hij beval *die* onder de hand van de oversten der trawanten, die de deur van het huis des konings bewaarden.","28":"En het geschiedde, zo wanneer de koning in het huis des HEEREN ging, *dat* de trawanten dezelve droegen, en die wederbrachten in der trawanten wachtkamer.","29":"Het overige nu der geschiedenissen van Rehabeam, en al wat hij gedaan heeft, zijn die niet geschreven in het boek der kronieken der koningen van Juda?","30":"En er was krijg tussen Rehabeam en tussen Jerobeam, al *hun* dagen.","31":"En Rehabeam ontsliep met zijn vaderen, en werd begraven bij zijn vaderen in de stad Davids; en de naam zijner moeder was Naäma, de Ammonietische; en zijn zoon Abiam regeerde in zijn plaats."},"KJV":{"1":"At that time Abijah the son of Jeroboam fell sick.","2":"And Jeroboam said to his wife, Arise, I pray thee, and disguise thyself, that thou be not known to be the wife of Jeroboam; and get thee to Shiloh: behold, there is Ahijah the prophet, which told me that I should be king over this people.","3":"And take with thee ten loaves, and cracknels, and a cruse of honey, and go to him: he shall tell thee what shall become of the child.","4":"And Jeroboam's wife did so, and arose, and went to Shiloh, and came to the house of Ahijah. But Ahijah could not see; for his eyes were set by reason of his age.","5":"And the LORD said unto Ahijah, Behold, the wife of Jeroboam cometh to ask a thing of thee for her son; for he is sick: thus and thus shalt thou say unto her: for it shall be, when she cometh in, that she shall feign herself to be another woman.","6":"And it was so, when Ahijah heard the sound of her feet, as she came in at the door, that he said, Come in, thou wife of Jeroboam; why feignest thou thyself to be another? for I am sent to thee with heavy tidings.","7":"Go, tell Jeroboam, Thus saith the LORD God of Israel, Forasmuch as I exalted thee from among the people, and made thee prince over my people Israel,","8":"And rent ➔ the kingdom away from the house of David, and gave it thee: and yet thou hast not been as my servant David, who kept my commandments, and who followed me with all his heart, to do that only which was right in mine eyes;","9":"But hast done evil above all that were before thee: for thou hast gone and made thee other gods, and molten images, to provoke me to anger, and hast cast me behind thy back:","10":"Therefore, behold, I will bring evil upon the house of Jeroboam, and will cut off from Jeroboam him that pisseth against the wall, and him that is shut up and left in Israel, and will take away the remnant of the house of Jeroboam, as a man taketh away dung, till it be all gone.","11":"Him that dieth of Jeroboam in the city shall the dogs eat; and him that dieth in the field shall the fowls of the air eat: for the LORD hath spoken it.","12":"Arise thou therefore, get thee to thine own house: and when thy feet enter into the city, the child shall die.","13":"And all Israel shall mourn for him, and bury him: for he only of Jeroboam shall come to the grave, because in him there is found some good thing toward the LORD God of Israel in the house of Jeroboam.","14":"Moreover the LORD shall raise him up a king over Israel, who shall cut off the house of Jeroboam that day: but what? even now.","15":"For the LORD shall smite Israel, as a reed is shaken in the water, and he shall root up Israel out of this good land, which he gave to their fathers, and shall scatter them beyond the river, because they have made their groves, provoking the LORD to anger.","16":"And he shall give ➔ Israel up because of the sins of Jeroboam, who did sin, and who made Israel to sin.","17":"And Jeroboam's wife arose, and departed, and came to Tirzah: and when she came to the threshold of the door, the child died;","18":"And they buried him; and all Israel mourned for him, according to the word of the LORD, which he spake by the hand of his servant Ahijah the prophet.","19":"And the rest of the acts of Jeroboam, how he warred, and how he reigned, behold, they are written in the book of the chronicles of the kings of Israel.","20":"And the days which Jeroboam reigned were two and twenty years: and he slept with his fathers, and Nadab his son reigned in his stead.","21":"And Rehoboam the son of Solomon reigned in Judah. Rehoboam was forty and one years old when he began to reign, and he reigned seventeen years in Jerusalem, the city which the LORD did choose out of all the tribes of Israel, to put his name there. And his mother's name was Naamah an Ammonitess.","22":"And Judah did evil in the sight of the LORD, and they provoked him to jealousy with their sins which they had committed, above all that their fathers had done.","23":"For they also built them high places, and images, and groves, on every high hill, and under every green tree.","24":"And there were also sodomites in the land: and they did according to all the abominations of the nations which the LORD cast out before the children of Israel.","25":"And it came to pass in the fifth year of king Rehoboam, that Shishak king of Egypt came up against Jerusalem:","26":"And he took away the treasures of the house of the LORD, and the treasures of the king's house; he even took away all: and he took away all the shields of gold which Solomon had made.","27":"And king Rehoboam made in their stead brasen shields, and committed them unto the hands of the chief of the guard, which kept the door of the king's house.","28":"And it was so, when the king went into the house of the LORD, that the guard bare them, and brought them back into the guard chamber.","29":"Now the rest of the acts of Rehoboam, and all that he did, are they not written in the book of the chronicles of the kings of Judah?","30":"And there was war between Rehoboam and Jeroboam all their days.","31":"And Rehoboam slept with his fathers, and was buried with his fathers in the city of David. And his mother's name was Naamah an Ammonitess. And Abijam his son reigned in his stead."}},"tsk":{"1":[{"kopje":"die tijd","refs":["1 Kon 13:33","1 Kon 13:34"]},{"kopje":"de zoon","refs":["1 Kon 14:12","1 Kon 14:13","Ex 20:5","1 Sam 4:19","1 Sam 4:20","1 Sam 31:2","2 Sam 12:15"]}],"2":[{"kopje":"verkleed u","refs":["1 Kon 14:5","1 Kon 14:6","1 Kon 22:30","1 Sam 79\">Jeroboam</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to his <span class=\"wl wl-kjv\" data-code=\"H802\">wife,</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">Arise,</span> I pray thee, and <span class=\"wl wl-kjv\" data-code=\"H8138\">disguise</span> thyself, that thou be not <span class=\"wl wl-kjv\" data-code=\"H3045\">known</span> to be the <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> of <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam;</span> and <span class=\"wl wl-kjv\" data-code=\"H1980\">get</span> thee to <span class=\"wl wl-kjv\" data-code=\"H7887\">Shiloh:</span> behold, there is <span class=\"wl wl-kjv\" data-code=\"H281\">Ahijah</span> the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet,</span> which <span class=\"wl wl-kjv\" data-code=\"H1696\">told</span> me that I should be <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> over this <span class=\"wl wl-kjv\" data-code=\"H5971\">people.</span>","3":"And <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> with <span class=\"wl wl-kjv\" data-code=\"H3027\">thee</span> <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">loaves,</span> and <span class=\"wl wl-kjv\" data-code=\"H5350\">cracknels,</span> and a <span class=\"wl wl-kjv\" data-code=\"H1228\">cruse</span> of <span class=\"wl wl-kjv\" data-code=\"H1706\">honey,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">go</span> to him: he shall <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> thee what shall become of the <span class=\"wl wl-kjv\" data-code=\"H5288\">child.</span>","4":"And <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam's</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> did <span class=\"wl wl-kjv\" data-code=\"H6213\">so,</span> and <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> to <span class=\"wl wl-kjv\" data-code=\"H7887\">Shiloh,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H281\">Ahijah.</span> But <span class=\"wl wl-kjv\" data-code=\"H281\">Ahijah</span> <span class=\"wl wl-kjv\" data-code=\"H3201\">could</span> not <span class=\"wl wl-kjv\" data-code=\"H7200\">see;</span> for his <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> were <span class=\"wl wl-kjv\" data-code=\"H6965\">set</span> by reason of his <span class=\"wl wl-kjv\" data-code=\"H7869\">age.</span>","5":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H281\">Ahijah,</span> Behold, the <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> of <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam</span> <span class=\"wl wl-kjv\" data-code=\"H935\">cometh</span> to <span class=\"wl wl-kjv\" data-code=\"H1875\">ask</span> a <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> of thee for her <span class=\"wl wl-kjv\" data-code=\"H1121\">son;</span> for he is <span class=\"wl wl-kjv\" data-code=\"H2470\">sick:</span> <span class=\"wl wl-kjv\" data-code=\"H2090\">thus</span> and thus shalt thou <span class=\"wl wl-kjv\" data-code=\"H1696\">say</span> unto her: for it shall be, when she cometh <span class=\"wl wl-kjv\" data-code=\"H935\">in,</span> that she shall feign herself to be <span class=\"wl wl-kjv\" data-code=\"H5234\">another</span> woman.","6":"And it was so, when <span class=\"wl wl-kjv\" data-code=\"H281\">Ahijah</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> the <span class=\"wl wl-kjv\" data-code=\"H6963\">sound</span> of her <span class=\"wl wl-kjv\" data-code=\"H7272\">feet,</span> as she came <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> at the <span class=\"wl wl-kjv\" data-code=\"H6607\">door,</span> that he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Come <span class=\"wl wl-kjv\" data-code=\"H935\">in,</span> thou <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> of <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam;</span> why feignest thou thyself to be <span class=\"wl wl-kjv\" data-code=\"H5234\">another?</span> for I am <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> to thee with <span class=\"wl wl-kjv\" data-code=\"H7186\">heavy</span> tidings.","7":"<span class=\"wl wl-kjv\" data-code=\"H3212\">Go,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">tell</span> <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> Forasmuch <span class=\"wl wl-kjv\" data-code=\"H3282\">as</span> I <span class=\"wl wl-kjv\" data-code=\"H7311\">exalted</span> thee from <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">made</span> thee <span class=\"wl wl-kjv\" data-code=\"H5057\">prince</span> over my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span>","8":"And <span class=\"wl wl-kjv\" data-code=\"H7167\">rent</span> ➔ the <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdom</span> <span class=\"wl wl-kjv\" data-code=\"H7167\">away</span> from the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> it thee: and yet thou hast not been as my <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> who <span class=\"wl wl-kjv\" data-code=\"H8104\">kept</span> my <span class=\"wl wl-kjv\" data-code=\"H4687\">commandments,</span> and who <span class=\"wl wl-kjv\" data-code=\"H1980\">followed</span> me with all his <span class=\"wl wl-kjv\" data-code=\"H3824\">heart,</span> to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> that only which was <span class=\"wl wl-kjv\" data-code=\"H3477\">right</span> in mine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes;</span>","9":"But hast <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> <span class=\"wl wl-kjv\" data-code=\"H7489\">evil</span> above all that were <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thee: for thou hast <span class=\"wl wl-kjv\" data-code=\"H3212\">gone</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> thee <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> <span class=\"wl wl-kjv\" data-code=\"H430\">gods,</span> and molten <span class=\"wl wl-kjv\" data-code=\"H4541\">images,</span> to provoke me to <span class=\"wl wl-kjv\" data-code=\"H3707\">anger,</span> and hast <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> me <span class=\"wl wl-kjv\" data-code=\"H310\">behind</span> thy <span class=\"wl wl-kjv\" data-code=\"H1458\">back:</span>","10":"Therefore, behold, I will <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> upon the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam,</span> and will cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> from <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam</span> him that <span class=\"wl wl-kjv\" data-code=\"H8366\">pisseth</span> against the <span class=\"wl wl-kjv\" data-code=\"H7023\">wall,</span> and him that is shut <span class=\"wl wl-kjv\" data-code=\"H6113\">up</span> and <span class=\"wl wl-kjv\" data-code=\"H5800\">left</span> in <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and will take <span class=\"wl wl-kjv\" data-code=\"H1197\">away</span> the <span class=\"wl wl-kjv\" data-code=\"H310\">remnant</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam,</span> as a man taketh <span class=\"wl wl-kjv\" data-code=\"H1197\">away</span> <span class=\"wl wl-kjv\" data-code=\"H1557\">dung,</span> till it be all <span class=\"wl wl-kjv\" data-code=\"H8552\">gone.</span>","11":"Him that <span class=\"wl wl-kjv\" data-code=\"H4191\">dieth</span> of <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam</span> in the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> shall the <span class=\"wl wl-kjv\" data-code=\"H3611\">dogs</span> <span class=\"wl wl-kjv\" data-code=\"H398\">eat;</span> and him that <span class=\"wl wl-kjv\" data-code=\"H4191\">dieth</span> in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> shall the <span class=\"wl wl-kjv\" data-code=\"H5775\">fowls</span> of the <span class=\"wl wl-kjv\" data-code=\"H8064\">air</span> <span class=\"wl wl-kjv\" data-code=\"H398\">eat:</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> it.","12":"<span class=\"wl wl-kjv\" data-code=\"H6965\">Arise</span> thou therefore, <span class=\"wl wl-kjv\" data-code=\"H3212\">get</span> thee to thine own <span class=\"wl wl-kjv\" data-code=\"H1004\">house:</span> and when thy <span class=\"wl wl-kjv\" data-code=\"H7272\">feet</span> <span class=\"wl wl-kjv\" data-code=\"H935\">enter</span> into the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> the <span class=\"wl wl-kjv\" data-code=\"H3206\">child</span> shall <span class=\"wl wl-kjv\" data-code=\"H4191\">die.</span>","13":"And all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> shall <span class=\"wl wl-kjv\" data-code=\"H5594\">mourn</span> for him, and <span class=\"wl wl-kjv\" data-code=\"H6912\">bury</span> him: for he only of <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to the <span class=\"wl wl-kjv\" data-code=\"H6913\">grave,</span> because in him there is <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> some <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> toward the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam.</span>","14":"Moreover the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall raise him <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> a <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> over <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> who shall cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam</span> that <span class=\"wl wl-kjv\" data-code=\"H3117\">day:</span> but what? even now.","15":"For the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> as a <span class=\"wl wl-kjv\" data-code=\"H7070\">reed</span> is <span class=\"wl wl-kjv\" data-code=\"H5110\">shaken</span> in the <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and he shall root <span class=\"wl wl-kjv\" data-code=\"H5428\">up</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> out of this <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H127\">land,</span> which he <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> to their <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H2219\">scatter</span> them <span class=\"wl wl-kjv\" data-code=\"H5676\">beyond</span> the <span class=\"wl wl-kjv\" data-code=\"H5104\">river,</span> because they have <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> their <span class=\"wl wl-kjv\" data-code=\"H842\">groves,</span> provoking the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> to <span class=\"wl wl-kjv\" data-code=\"H3707\">anger.</span>","16":"And he shall <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> ➔ <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">up</span> <span class=\"wl wl-kjv\" data-code=\"H1558\">because</span> of the <span class=\"wl wl-kjv\" data-code=\"H2403\">sins</span> of <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam,</span> who did <span class=\"wl wl-kjv\" data-code=\"H2398\">sin,</span> and who made <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> to <span class=\"wl wl-kjv\" data-code=\"H2398\">sin.</span>","17":"And <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam's</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">departed,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H8656\">Tirzah:</span> and when she <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the <span class=\"wl wl-kjv\" data-code=\"H5592\">threshold</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">door,</span> the <span class=\"wl wl-kjv\" data-code=\"H5288\">child</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">died;</span>","18":"And they <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> him; and all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H5594\">mourned</span> for him, according to the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> which he <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> by the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of his <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H281\">Ahijah</span> the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet.</span>","19":"And the <span class=\"wl wl-kjv\" data-code=\"H3499\">rest</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">acts</span> of <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam,</span> how he <span class=\"wl wl-kjv\" data-code=\"H3898\">warred,</span> and how he <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned,</span> behold, they are <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in the <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">chronicles</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","20":"And the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> which <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> were <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> and <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years:</span> and he <span class=\"wl wl-kjv\" data-code=\"H7901\">slept</span> with his <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> and <span class=\"wl wl-kjv\" data-code=\"H5070\">Nadab</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> in his stead.","21":"And <span class=\"wl wl-kjv\" data-code=\"H7346\">Rehoboam</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> in <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah.</span> <span class=\"wl wl-kjv\" data-code=\"H7346\">Rehoboam</span> was <span class=\"wl wl-kjv\" data-code=\"H705\">forty</span> and <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">old</span> when he began to <span class=\"wl wl-kjv\" data-code=\"H4427\">reign,</span> and he <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seventeen</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> did <span class=\"wl wl-kjv\" data-code=\"H977\">choose</span> out of all the <span class=\"wl wl-kjv\" data-code=\"H7626\">tribes</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> to <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> there. And his <span class=\"wl wl-kjv\" data-code=\"H517\">mother's</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> was <span class=\"wl wl-kjv\" data-code=\"H5279\">Naamah</span> an <span class=\"wl wl-kjv\" data-code=\"H5985\">Ammonitess.</span>","22":"And <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of the <span class=\"wl wl-kjv\" dat /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

function bouwRijen() {

    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
