"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"En Benhadad, de koning van Syrië, verzamelde al zijn leger; en twee en dertig koningen waren met hem, en paarden en wagens; en hij trok op, en belegerde Samaria en streed tegen haar.","2":"En hij zond boden naar Achab, de koning van Israël, in de stad.","3":"En hij liet hem weten: Zo zegt Benhadad: Uw zilver en uw goud, dat is mijn, daartoe uw vrouwen en uw beste kinderen, die zijn mijn.","4":"En de koning van Israël antwoordde en zei: Naar uw woord, mijn heer de koning, ik ben van u, en al wat ik heb.","5":"Daarna kwamen de boden terug, en zeiden: Zo spreekt Benhadad en zegt: Ik heb wel naar u gezonden en gezegd: Uw zilver, en uw goud, en uw vrouwen, en uw kinderen zult u mij geven;","6":"Maar morgen om deze tijd zal ik mijn knechten naar u zenden, dat zij uw huis en de huizen van uw knechten doorzoeken; en het zal gebeuren, dat zij alles wat begeerlijk is voor uw ogen in hun handen leggen en wegnemen zullen.","7":"Toen riep de koning van Israël alle oudsten van het land, en zei: Merk toch op en zie, dat deze het kwade zoekt; want hij had naar mij gezonden, om mijn vrouwen, en om mijn kinderen, en om mijn zilver, en om mijn goud, en ik heb het hem niet geweigerd.","8":"Doch alle oudsten, en het hele volk, zeiden tegen hem: Hoor niet, en bewillig niet.","9":"Daarom zei hij tegen de boden van Benhadad: Zeg mijn heer de koning: Alles waarom u in het eerst naar uw knecht gezonden heeft, zal ik doen; maar deze zaak kan ik niet doen. Zo gingen de boden heen en brachten hem weer bescheid.","10":"En Benhadad zond naar hem en zei: De goden doen mij zo, en doen zo daartoe, als het stof van Samaria genoeg zal zijn tot handvollen voor al het volk, dat mijn voetstappen volgt!","11":"Maar de koning van Israël antwoordde en zei: Spreekt tot hem: Die zich aangordt, beroemt zich niet, als die zich los maakt.","12":"En het gebeurde, toen hij dit woord hoorde, terwijl hij aan het drinken was, hij en de koningen in de tenten, dat hij zei tegen zijn knechten: Legt aan! En zij legden aan tegen de stad.","13":"En zie, een profeet trad naar Achab, de koning van Israël, en zei: Zo zegt de HEERE: Hebt u al deze grote menigte gezien? Zie, Ik zal ze heden in uw hand geven, opdat u weet, dat Ik de HEERE ben.","14":"En Achab zei: Door wie? En hij zei: Zo zegt de HEERE: Door de jongens van de leiders van de landschappen. En hij zei: Wie zal de strijd aanbinden? En hij zei: U.","15":"Toen telde hij de jongens van de leiders van de landschappen, en zij waren tweehonderdtwee en dertig; en na hen telde hij al het volk, alle kinderen van Israël, zevenduizend.","16":"En zij trokken uit op de middag. Benhadad nu dronk zich dronken in de tenten, hij en de koningen, de twee en dertig koningen, die hem hielpen.","17":"En de jongens van de leiders van de landschappen trokken eerst uit. Doch Benhadad zond enigen uit, en zij boodschapten hem en zeiden: Uit Samaria zijn mannen uitgetrokken.","18":"En hij zei: Of zij nu tot vrede uitgetrokken zijn, grijpt hen levend; of ook, dat zij ten strijde uitgetrokken zijn, grijpt hen levend.","19":"Zo trokken deze jongens van de leiders van de landschappen uit de stad, en het leger, dat hen navolgde.","20":"En ieder sloeg zijn man, zodat de Syriërs vluchtten, en Israël joeg hen na. Doch Benhadad, de koning van Syrië, ontkwam op een paard, met enige ruiters.","21":"En de koning van Israël trok uit, en sloeg paarden en wagens, zodat hij een grote slag aan de Syriërs toebracht.","22":"Toen trad die profeet naar de koning van Israël, en zei tegen hem: Ga heen, sterk u; en let op, en zie, wat u doen zult; want bij de wederkomst van het jaar zal de koning van Syrië tegen u optrekken.","23":"Want de knechten van de koning van Syrië hadden tegen hem gezegd: Hun goden zijn berggoden, daarom zijn zij sterker geweest dan wij; maar zeker, laat ons tegen hen op het effen veld strijden, dan zullen wij sterker zijn dan zij!","24":"Daarom doe deze zaak: Doe de koningen weg, elk uit zijn plaats, en stel landvoogden in hun plaats.","25":"En u, tel u een leger, zoals dat leger, dat van de uwen gevallen is, en paarden, zoals die paarden, en wagens, zoals die wagens; en laat ons tegen hen op het effen veld strijden, dan zullen wij sterker zijn dan zij! En hij hoorde naar hun stem, en deed zo.","26":"Het gebeurde nu bij de wederkomst van het jaar, dat Benhadad de Syriërs monsterde; en hij trok op naar Afek, ten strijde tegen Israël.","27":"De kinderen van Israël werden ook gemonsterd, en waren verzorgd met middelen van bestaan, en trokken hun tegemoet; en de kinderen van Israël legerden zich tegenover hen, als twee blote geitenkudden, maar de Syriërs vervulden het land.","28":"En de man van God trad toe, en sprak tegen de koning van Israël, en zei: Zo zegt de HEERE: Omdat de Syriërs gezegd hebben: De HEERE is een God van de bergen, en Hij is niet een God van de laagten; zo zal Ik al deze grote menigte in uw hand geven, opdat u weet, dat Ik de HEERE ben.","29":"En dezen waren gelegerd tegenover die, zeven dagen; het gebeurde nu op de zevende dag, dat de strijd aanging; en de kinderen van Israël sloegen van de Syriërs honderdduizend van het voetvolk op één dag.","30":"En de overgeblevenen vluchtten naar Afek, de stad in, en de muur viel op zeven en twintig duizend mannen, die overgebleven waren; ook vluchtte Benhadad, en kwam in de stad van kamer in kamer.","31":"Toen zeiden de knechten tegen hem: Zie toch, wij hebben gehoord, dat de koningen van het huis van Israël goedertierene koningen zijn; laat ons toch rouwgewaad om onze lenden leggen, en koorden om onze hoofden, en uitgaan naar de koning van Israël; misschien zal hij uw leven sparen.","32":"Toen gordden zij rouwgewaad om hun lenden, en koorden om hun hoofden, en kwamen naar de koning van Israël, en zeiden: Uw knecht Benhadad zegt: Laat toch mijn leven gespaard blijven. En hij zei: Leeft hij dan nog? Hij is mijn broeder.","33":"De mannen namen dat nauwkeurig waar, en vatten het snel op, of het van hem was, en zeiden: Uw broeder Benhadad leeft. En hij zei: Komt, brengt hem. Toen kwam Benhadad naar hem uit, en hij liet hem op de wagen klimmen.","34":"En hij zei tegen hem: De steden, die mijn vader van uw vader genomen heeft, zal ik teruggeven, en maak u straten in Damaskus, zoals mijn vader in Samaria gemaakt heeft. En ik, antwoordde Achab, zal u met dit verbond dan laten gaan. Zo sloot hij een verbond met hem, en liet hem gaan.","35":"Toen zei een man uit de zonen van de profeten tegen zijn naaste, door het woord van de HEERE: Sla mij toch. En de man weigerde hem te slaan.","36":"En hij zei tegen hem: Omdat u de stem van de HEERE niet gehoorzaam bent geweest, zie, zodra u van mij weggegaan bent, zal een leeuw u doden. En toen hij van bij hem weggegaan was, vond een leeuw hem, die hem doodde.","37":"Daarna vond hij een andere man, en zei: Sla mij toch. En die man sloeg hem, en verwondde hem door hem te slaan.","38":"Toen ging de profeet heen, en stond voor de koning op de weg; en hij vermomde zich met as over zijn ogen.","39":"En het gebeurde, toen de koning voorbijging, dat hij naar de koning riep, en zei: Uw knecht was uitgegaan midden in de strijd; en zie, een man was afgeweken, en bracht een man naar mij toe, en zei: Bewaar deze man, als hij enigszins gemist wordt, dan zal uw leven in de plaats van zijn leven zijn, of u zult een talent van het zilver opwegen.","40":"Het gebeurde nu, terwijl uw knecht hier en daar doende was, dat hij er niet meer was. Toen zei de koning van Israël tegen hem: Zo is uw oordeel; u hebt het zelf geveld.","41":"Toen haastte hij zich, en veegde de as van zijn ogen af; en de koning van Israël herkende hem, dat hij een van de profeten was.","42":"En hij zei tegen hem: Zo zegt de HEERE: Omdat u de man, die Ik verbannen had, uit uw hand hebt laten gaan, zal uw leven in de plaats van zijn leven zijn, en uw volk in de plaats van zijn volk.","43":"En de koning van Israël ging heen, verdrietig en toornig, naar zijn huis, en kwam te Samaria."},"SV":{"1":"En Benhadad, de koning van Syrië, vergaderde al zijn macht; en twee en dertig koningen waren met hem, en paarden en wagenen; en hij toog op, en belegerde Samaria en krijgde tegen haar.","2":"En hij zond boden tot Achab, den koning van Israël, in de stad.","3":"En hij zeide hem aan: Zo zegt Benhadad: Uw zilver en uw goud, dat is mijn, daartoe uw vrouwen en uw beste kinderen, die zijn mijn.","4":"En de koning van Israël antwoordde en zeide: Naar uw woord, mijn heer de koning, ik ben uwe, en al wat ik heb.","5":"Daarna kwamen de boden weder, en zeiden: Alzo spreekt Benhadad, zeggende: Ik heb wel tot u gezonden, zeggende: Uw zilver, en uw goud, en uw vrouwen, en uw kinderen zult gij mij geven;","6":"Maar morgen om dezen tijd zal ik mijn knechten tot u zenden, dat zij uw huis en de huizen uwer knechten bezoeken; en het zal geschieden, dat zij al het begeerlijke uwer ogen in hun handen leggen en wegnemen zullen.","7":"Toen riep de koning van Israël alle oudsten des lands, en zeide: Merkt toch en ziet, dat deze het kwade zoekt; want hij had tot mij gezonden, om mijn vrouwen, en om mijn kinderen, en om mijn zilver, en om mijn goud, en ik heb het hem niet geweigerd.","8":"Doch al de oudsten, en het ganse volk, zeiden tot hem: Hoor niet, en bewillig niet.","9":"Daarom zeide hij tot de boden van Benhadad: Zegt mijn heer den koning: Alles, waarom gij in het eerst tot uw knecht gezonden hebt, zal ik doen; maar deze zaak kan ik niet doen. Zo gingen de boden heen en brachten hem bescheid weder.","10":"En Benhadad zond tot hem en zeide: De goden doen mij zo, en doen zo daartoe, indien het stof van Samaria genoeg zal zijn tot handvollen voor al het volk, dat mijn voetstappen volgt!","11":"Maar de koning van Israël antwoordde en zeide: Spreekt *tot* *hem*: Die zich aangordt, beroeme zich niet, als die zich los maakt.","12":"En het geschiedde, als hij dit woord hoorde, daar hij was drinkende, hij en de koningen in de tenten, dat hij zeide tot zijn knechten: Legt aan! En zij leiden aan tegen de stad.","13":"En ziet, een profeet trad tot Achab, den koning van Israël, en zeide: Zo zegt de HEERE: Hebt gij gezien al deze grote menigte? Zie, Ik zal ze heden in uw hand geven, opdat gij weet, dat Ik de HEERE ben.","14":"En Achab zeide: Door wie? En hij zeide: Zo zegt de HEERE: Door de jongens van de oversten der landschappen. En hij zeide: Wie zal den strijd aanbinden? En hij zeide: Gij.","15":"Toen telde hij de jongens van de oversten der landschappen, en zij waren tweehonderd twee en dertig; en na hen telde hij al het volk, al de kinderen Israëls, zeven duizend.","16":"En zij togen uit op den middag. Benhadad nu dronk zich dronken in de tenten, hij en de koningen, de twee en dertig koningen, die hem hielpen.","17":"En de jongens van de oversten der landschappen togen eerst uit. Doch Benhadad zond *enigen* uit, en zij boodschapten hem, zeggende: Uit Samaria zijn mannen uitgetogen.","18":"En hij zeide: Hetzij dat zij tot vrede uitgetogen zijn, grijpt hen levend; hetzij ook, dat zij ten strijde uitgetogen zijn, grijpt hen levend.","19":"Zo togen deze jongens van de oversten der landschappen uit de stad, en het heir, dat hen navolgde.","20":"En een ieder sloeg zijn man, zodat de Syriërs vloden, en Israël jaagde hen na. Doch Benhadad, de koning van Syrië, ontkwam op een paard, met *enige* ruiteren.","21":"En de koning van Israël toog uit, en sloeg paarden en wagenen, dat hij een groten slag aan de Syriërs sloeg.","22":"Toen trad die profeet tot den koning van Israël, en zeide tot hem: Ga heen, sterk u; en bemerk, en zie, wat gij doen zult; want met de wederkomst des jaars zal de koning van Syrië tegen u optrekken.","23":"Want de knechten van den koning van Syrië hadden tot hem gezegd: Hun goden zijn berggoden, daarom zijn zij sterker geweest dan wij; maar zeker, laat ons tegen hen op het effen veld strijden, zo wij niet sterker zijn dan zij!","24":"Daarom doe deze zaak: Doe de koningen weg, elkeen uit zijn plaats, en stel landvoogden in hun plaats.","25":"En gij, tel u een heir, als dat heir, dat van de uwen gevallen is, en paarden, als die paarden, en wagenen, als die wagenen; en laat ons tegen hen op het effen veld strijden, zo wij niet sterker zijn dan zij! En hij hoorde naar hun stem, en deed alzo.","26":"Het geschiedde nu met de wederkomst des jaars, dat Benhadad de Syriërs monsterde; en hij toog op naar Afek, ten krijge tegen Israël.","27":"De kinderen Israëls werden ook gemonsterd, en waren verzorgd van leeftocht, en trokken hun tegemoet; en de kinderen Israëls legerden zich tegenover hen, als twee blote geitenkudden, maar de Syriërs vervulden het land.","28":"En de man Gods trad toe, en sprak tot den koning van Israël, en zeide: Zo zegt de HEERE: Daarom dat de Syriërs gezegd hebben: De HEERE is een God der bergen, en Hij is niet een God der laagten; zo zal Ik al deze grote menigte in uw hand geven, opdat gijlieden weet, dat Ik de HEERE ben.","29":"En dezen waren gelegerd tegenover die, zeven dagen; het geschiedde nu op den zevenden dag, dat de strijd aanging; en de kinderen Israëls sloegen van de Syriërs honderd duizend voetvolks op een dag.","30":"En de overgeblevenen vloden naar Afek in de stad, en de muur viel op zeven en twintig duizend mannen, die overgebleven waren; ook vlood Benhadad, en kwam in de stad *van* kamer in kamer.","31":"Toen zeiden de knechten tot hem: Zie toch, wij hebben gehoord, dat de koningen van het huis Israëls goedertierene koningen zijn; laat ons toch zakken om onze lenden leggen, en koorden om onze hoofden, en uitgaan tot den koning van Israël; mogelijk zal hij uw ziel in het leven behouden.","32":"Toen gordden zij zakken om hun lenden, en koorden om hun hoofden, en kwamen tot den koning van Israël, en zeiden: Uw knecht Benhadad zegt: Laat toch mijn ziel leven. En hij zeide: Leeft hij dan nog? Hij is mijn broeder.","33":"De mannen nu namen naarstiglijk waar, en vatten het haastelijk, of het van hem ware, en zeiden: Uw broeder Benhadad *leeft*. En hij zeide: Komt, brengt hem. Toen kwam Benhadad tot hem uit, en hij deed hem op den wagen klimmen.","34":"En hij zeide tot hem: De steden, die mijn vader van uw vader genomen heeft, zal ik wedergeven, en maak u straten in Damaskus, gelijk mijn vader in Samaria gemaakt heeft. En ik, *antwoordde* *Achab*, zal u met dit verbond dan laten gaan. Zo maakte hij een verbond met hem, en liet hem gaan.","35":"Toen zeide een man uit de zonen der profeten tot zijn naaste, door het woord des HEEREN: Sla mij toch. En de man weigerde hem te slaan.","36":"En hij zeide tot hem: Daarom dat gij de stem des HEEREN niet gehoorzaam zijt geweest, zie, als gij van mij weggegaan zijt, zo zal u een leeuw slaan. En als hij van bij hem weggegaan was, zo vond hem een leeuw, die hem sloeg.","37":"Daarna vond hij een anderen man, en zeide: Sla mij toch. En die man sloeg hem, slaande en wondende.","38":"Toen ging de profeet heen, en stond voor den koning op den weg; en hij verstelde zich met as boven zijn ogen.","39":"En het geschiedde, als de koning voorbijging, dat hij tot den koning riep, en zeide: Uw knecht was uitgegaan in het midden des strijds; en zie, een man was afgeweken, en bracht tot mij een man, en zeide: Bewaar dezen man, indien hij enigszins gemist wordt, zo zal uw ziel in de plaats zijner ziel zijn, of gij zult een talent zilvers opwegen.","40":"Het geschiedde nu, als uw knecht hier en daar doende was, dat hij er niet was. Toen zeide de koning van Israël tot hem: Zo is uw oordeel; gij hebt zelf het geveld.","41":"Toen haastte hij zich, en deed de as af van zijn ogen; en de koning van Israël kende hem, dat hij een der profeten was.","42":"En hij zeide tot hem: Zo zegt de HEERE: Omdat gij den man, dien Ik verbannen heb, uit de hand hebt laten gaan, zo zal uw ziel in de plaats van zijn ziel zijn, en uw volk in de plaats van zijn volk.","43":"En de koning van Israël toog henen, gemelijk en toornig, naar zijn huis, en kwam te Samaria."},"KJV":{"1":"And Benhadad the king of Syria gathered ➔ all his host together: and there were thirty and two kings with him, and horses, and chariots: and he went up and besieged Samaria, and warred against it.","2":"And he sent messengers to Ahab king of Israel into the city, and said unto him, Thus saith Benhadad,","3":"Thy silver and thy gold is mine; thy wives also and thy children, even the goodliest, are mine.","4":"And the king of Israel answered and said, My lord, O king, according to thy saying, I am thine, and all that I have.","5":"And the messengers came again, and said, Thus speaketh Benhadad, saying, Although I have sent unto thee, saying, Thou shalt deliver me thy silver, and thy gold, and thy wives, and thy children;","6":"Yet I will send my servants unto thee to morrow about this time, and they shall search thine house, and the houses of thy servants; and it shall be, that whatsoever is pleasant in thine eyes, they shall put it in their hand, and take it away.","7":"Then the king of Israel called all the elders of the land, and said, Mark, I pray you, and see how this man seeketh mischief: for he sent unto me for my wives, and for my children, and for my silver, and for my gold; and I denied him not.","8":"And all the elders and all the people said unto him, Hearken not unto him, nor consent.","9":"Wherefore he said unto the messengers of Benhadad, Tell my lord the king, All that thou didst send for to thy servant at the first I will do: but this thing I may not do. And the messengers departed, and brought ➔ him word again.","10":"And Benhadad sent unto him, and said, The gods do so unto me, and more also, if the dust of Samaria shall suffice for handfuls for all the people that follow me.","11":"And the king of Israel answered and said, Tell him, Let not him that girdeth on his harness boast himself as he that putteth it off.","12":"And it came to pass, when Benhadad heard this message, as he was drinking, he and the kings in the pavilions, that he said unto his servants, Set yourselves in array. And they set themselves in array against the city.","13":"And, behold, there came a prophet unto Ahab king of Israel, saying, Thus saith the LORD, Hast thou seen all this great multitude? behold, I will deliver it into thine hand this day; and thou shalt know that I am the LORD.","14":"And Ahab said, By whom? And he said, Thus saith the LORD, Even by the young men of the princes of the provinces. Then he said, Who shall order the battle? And he answered, Thou.","15":"Then he numbered the young men of the princes of the provinces, and they were two hundred and thirty two: and after them he numbered all the people, even all the children of Israel, being seven thousand.","16":"And they went out at noon. But Benhadad was drinking himself drunk in the pavilions, he and the kings, the thirty and two kings that helped him.","17":"And the young men of the princes of the provinces went out first; and Benhadad sent out, and they told him, saying, There are men come out of Samaria.","18":"And he said, Whether they be come out for peace, take them alive; or whether they be come out for war, take them alive.","19":"So these young men of the princes of the provinces came out of the city, and the army which followed them.","20":"And they slew every one his man: and the Syrians fled; and Israel pursued them: and Benhadad the king of Syria escaped on an horse with the horsemen.","21":"And the king of Israel went out, and smote the horses and chariots, and slew the Syrians with a great slaughter.","22":"And the prophet came to the king of Israel, and said unto him, Go, strengthen thyself, and mark, and see what thou doest: for at the return of the year the king of Syria will come up against thee.","23":"And the servants of the king of Syria said unto him, Their gods are gods of the hills; therefore they were stronger than we; but let us fight against them in the plain, and surely we shall be stronger than they.","24":"And do this thing, Take the kings away, every man out of his place, and put captains in their rooms:","25":"And number thee an army, like the army that thou hast lost, horse for horse, and chariot for chariot: and we will fight against them in the plain, and surely we shall be stronger than they. And he hearkened unto their voice, and did so.","26":"And it came to pass at the return of the year, that Benhadad numbered the Syrians, and went up to Aphek, to fight against Israel.","27":"And the children of Israel were numbered, and were all present, and went against them: and the children of Israel pitched before them like two little flocks of kids; but the Syrians filled the country.","28":"And there came a man of God, and spake unto the king of Israel, and said, Thus saith the LORD, Because the Syrians have said, The LORD is God of the hills, but he is not God of the valleys, therefore will I deliver all this great multitude into thine hand, and ye shall know that I am the LORD.","29":"And they pitched one over against the other seven days. And so it was, that in the seventh day the battle was joined: and the children of Israel slew of the Syrians an hundred thousand footmen in one day.","30":"But the rest fled to Aphek, into the city; and there a wall fell upon twenty and seven thousand of the men that were left. And Benhadad fled, and came into the city, into an inner chamber.","31":"And his servants said unto him, Behold now, we have heard that the kings of the house of Israel are merciful kings: let us, I pray thee, put sackcloth on our loins, and ropes upon our heads, and go out to the king of Israel: peradventure he will save thy life.","32":"So they girded sackcloth on their loins, and put ropes on their heads, and came to the king of Israel, and said, Thy servant Benhadad saith, I pray thee, let me live. And he said, Is he yet alive? he is my brother.","33":"Now the men did diligently observe whether any thing would come from him, and did hastily catch it: and they said, Thy brother Benhadad. Then he said, Go ye, bring him. Then Benhadad came forth to him; and he caused him to come up into the chariot.","34":"And Benhadad said unto him, The cities, which my father took from thy father, I will restore; and thou shalt make streets for thee in Damascus, as my father made in Samaria. Then said Ahab, I will send thee away with this covenant. So he made a covenant with him, and sent him away.","35":"And a certain man of the sons of the prophets said unto his neighbour in the word of the LORD, Smite me, I pray thee. And the man refused to smite him.","36":"Then said he unto him, Because thou hast not obeyed the voice of the LORD, behold, as soon as thou art departed from me, a lion shall slay thee. And as soon as he was departed from him, a lion found him, and slew him.","37":"Then he found another man, and said, Smite me, I pray thee. And the man smote him, so that in smiting he wounded him.","38":"So the prophet departed, and waited for the king by the way, and disguised himself with ashes upon his face.","39":"And as the king passed by, he cried unto the king: and he said, Thy servant went out into the midst of the battle; and, behold, a man turned aside, and brought a man unto me, and said, Keep this man: if by any means he be missing, then shall thy life be for his life, or else thou shalt pay a talent of silver.","40":"And as thy servant was busy here and there, he was gone. And the king of Israel said unto him, So shall thy judgment be; thyself hast decided it.","41":"And he hasted, and took the ashes away from his face; and the king of Israel discerned him that he was of the prophets.","42":"And he said unto him, Thus saith the LORD, Because thou hast let go out of thy hand a man whom I appointed to utter destruction, therefore thy life shall go for his life, and thy people for his people.","43":"And the king of Israel went to his house heavy and displeased, and came to Samaria."}},"tsk":{"1":[{"kopje":"Benhadad","refs":["1 Kon 15:18","1 Kon 15:20","2 Kon 8:7-10","2 Kron 16:2-4","Jer 49:27","Amos 1:4"]},{"kopje":"twee en dertig koningen","refs":["1 Kon 20:16","1 Kon 20:24","Gen 14:1-5","Richt 1:7","Ezra 7:12","Jes 10:8","Ezech 26:7","Dan 2:37"]},{"kopje":"en paarden","refs":["Ex 14:7","Deut 20:1","Richt 4:3","1 Sam 13:5","Jes 37:24"]},{"kopje":"belegerde","refs":["Lev 26:25","Deut 28:52","2 Kon 6:24-29","2 Kon 17:5","2 Kon 17:6"]}],"4":[{"kopje":"ik ben van u","refs":["Lev 26:36","Deut 28:48","Richt 15:11-13","1 Sam 13:6","1 Sam 13:7","2 Kon 18:14-16"]}],"6":[{"kopje":"dat zij doorzoeken","refs":["1 Sam 13:19-21","2 Sam 24:14","2 Kon 18:31","2 Kon 18:32"]},{"kopje":"begeerlijk","refs":["Gen 27:15","Ezra 8:27","Jes 44:9","Jer 25:34","Klaagl 1:7","Klaagl 1:10","Hos 13:15","Joël 3:5"]}],"7":[{"kopje":"alle oudsten","refs":["1 Kon 8:1","2 Kon 5:7","1 Kron 13:1","1 Kron 28:1","Spr 11:14"]},{"kopje":"Merk toch op","refs":["2 arred</span> against it.","2":"And he <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> to <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> into the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> <span class=\"wl wl-kjv\" data-code=\"H1130\">Benhadad,</span>","3":"Thy <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> and thy <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> is mine; thy <span class=\"wl wl-kjv\" data-code=\"H802\">wives</span> also and thy <span class=\"wl wl-kjv\" data-code=\"H1121\">children,</span> even the <span class=\"wl wl-kjv\" data-code=\"H2896\">goodliest,</span> are mine.","4":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> My <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> O <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> according to thy <span class=\"wl wl-kjv\" data-code=\"H1697\">saying,</span> I am thine, and all that I have.","5":"And the <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> came <span class=\"wl wl-kjv\" data-code=\"H7725\">again,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">speaketh</span> <span class=\"wl wl-kjv\" data-code=\"H1130\">Benhadad,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Although I have <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> unto thee, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Thou shalt <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> me thy <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H802\">wives,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H1121\">children;</span>","6":"Yet I will <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> my <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> unto thee to <span class=\"wl wl-kjv\" data-code=\"H4279\">morrow</span> about this <span class=\"wl wl-kjv\" data-code=\"H6256\">time,</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H2664\">search</span> thine <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1004\">houses</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants;</span> and it shall <span class=\"wl wl-kjv\" data-code=\"H1961\">be,</span> that whatsoever is <span class=\"wl wl-kjv\" data-code=\"H4261\">pleasant</span> in thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> they shall <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> it in their <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and take it <span class=\"wl wl-kjv\" data-code=\"H3947\">away.</span>","7":"Then the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> all the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">Mark,</span> I pray you, and <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> how this man <span class=\"wl wl-kjv\" data-code=\"H1245\">seeketh</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">mischief:</span> for he <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> unto me for my <span class=\"wl wl-kjv\" data-code=\"H802\">wives,</span> and for my <span class=\"wl wl-kjv\" data-code=\"H1121\">children,</span> and for my <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> and for my <span class=\"wl wl-kjv\" data-code=\"H2091\">gold;</span> and I <span class=\"wl wl-kjv\" data-code=\"H4513\">denied</span> him not.","8":"And all the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H8085\">Hearken</span> not unto him, nor <span class=\"wl wl-kjv\" data-code=\"H14\">consent.</span>","9":"Wherefore he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> of <span class=\"wl wl-kjv\" data-code=\"H1130\">Benhadad,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">Tell</span> my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> All that thou didst <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> for to thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> at the <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> I will <span class=\"wl wl-kjv\" data-code=\"H6213\">do:</span> but this <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> I <span class=\"wl wl-kjv\" data-code=\"H3201\">may</span> not <span class=\"wl wl-kjv\" data-code=\"H6213\">do.</span> And the <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">departed,</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">brought</span> ➔ him <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">again.</span>","10":"And <span class=\"wl wl-kjv\" data-code=\"H1130\">Benhadad</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> unto him, and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> The <span class=\"wl wl-kjv\" data-code=\"H430\">gods</span> do <span class=\"wl wl-kjv\" data-code=\"H6213\">so</span> unto me, and more <span class=\"wl wl-kjv\" data-code=\"H3254\">also,</span> if the <span class=\"wl wl-kjv\" data-code=\"H6083\">dust</span> of <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria</span> shall <span class=\"wl wl-kjv\" data-code=\"H5606\">suffice</span> for <span class=\"wl wl-kjv\" data-code=\"H8168\">handfuls</span> for all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that <span class=\"wl wl-kjv\" data-code=\"H7272\">follow</span> me.","11":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">Tell</span> him, Let not him that <span class=\"wl wl-kjv\" data-code=\"H2296\">girdeth</span> on his harness <span class=\"wl wl-kjv\" data-code=\"H1984\">boast</span> himself as he that putteth it <span class=\"wl wl-kjv\" data-code=\"H6605\">off.</span>","12":"And it came to pass, when Benhadad <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> this <span class=\"wl wl-kjv\" data-code=\"H1697\">message,</span> as he was <span class=\"wl wl-kjv\" data-code=\"H8354\">drinking,</span> he and the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> in the <span class=\"wl wl-kjv\" data-code=\"H5521\">pavilions,</span> that he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">Set</span> yourselves in array. And they <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> themselves in array against the <span class=\"wl wl-kjv\" data-code=\"H5892\">city.</span>","13":"And, behold, there <span class=\"wl wl-kjv\" data-code=\"H5066\">came</span> <span class=\"wl wl-kjv\" data-code=\"H259\">a</span> <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> unto <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> Hast thou <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> all this <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude?</span> behold, I will <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> it into thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day;</span> and thou shalt <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","14":"And <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> By whom? And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> Even by the young <span class=\"wl wl-kjv\" data-code=\"H5288\">men</span> of the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> of the <span class=\"wl wl-kjv\" data-code=\"H4082\">provinces.</span> Then he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Who shall <span class=\"wl wl-kjv\" data-code=\"H631\">order</span> the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle?</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> Thou.","15":"Then he <span class=\"wl wl-kjv\" data-code=\"H6485\">numbered</span> the young <span class=\"wl wl-kjv\" data-code=\"H5288\">men</span> of the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> of the <span class=\"wl wl-kjv\" data-code=\"H4082\">provinces,</span> and they were <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> and <span class=\"wl wl-kjv\" data-code=\"H7970\">thirty</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">two:</span> and <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> them he <span class=\"wl wl-kjv\" data-code=\"H6485\">numbered</span> all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> even all the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> being <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand.</span>","16":"And they went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> at <span class=\"wl wl-kjv\" data-code=\"H6672\">noon.</span> But <span class=\"wl wl-kjv\" data-code=\"H1130\">Benhadad</span> was <span class=\"wl wl-kjv\" data-code=\"H8354\">drinking</span> himself <span class=\"wl wl-kjv\" data-code=\"H7910\">drunk</span> in the <span class=\"wl wl-kjv\" data-code=\"H5521\">pavilions,</span> he and the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings,</span> the <span class=\"wl wl-kjv\" data-code=\"H7970\">thirty</span> and <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> that <span class=\"wl wl-kjv\" data-code=\"H5826\">helped</span> him.","17":"And the young <span class=\"wl wl-kjv\" data-code=\"H5288\">men</span> of the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> of the <span class=\"wl wl-kjv\" data-code=\"H4082\">provinces</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> <span class=\"wl wl-kjv\" data-code=\"H7223\">first;</span> and <span class=\"wl wl-kjv\" data-code=\"H1130\">Benhadad</span> sent <span class=\"wl wl-kjv\" data-code=\"H7971\">out,</span> and they <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> him, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> There are <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> come <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria.</span>","18":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Whether they be come <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> for <span class=\"wl wl-kjv\" data-code=\"H7965\">peace,</span> <span class=\"wl wl-kjv\" data-code=\"H8610\">take</span> them <span class=\"wl wl-kjv\" data-code=\"H2416\">alive;</span> or whether they be come <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> for <span class=\"wl wl-kjv\" data-code=\"H4421\">war,</span> <span class=\"wl wl-kjv\" data-code=\"H8610\">take</span> them <span class=\"wl wl-kjv\" data-code=\"H2416\">alive.</span>","19":"So these young <span class=\"wl wl-kjv\" data-code=\"H5288\">men</span> of the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> of the <span class=\"wl wl-kjv\" data-code=\"H4082\">provinces</span> came <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2428\">army</span> which <span class=\"wl wl-kjv\" data-code=\"H310\">followed</span> them.","20":"And they <span class=\"wl wl-kjv\" data-code=\"H5221\">slew</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> his <span class=\"wl wl-kjv\" data-code=\"H376\">man:</span> and the <span class=\"wl wl-kjv\" data-code=\"H758\">Syrians</span> <span class=\"wl wl-kjv\" data-code=\"H5127\">fled;</span> and <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H7291\">pursued</span> them: and <span class=\"wl wl-kjv\" data-code=\"H1130\">Benhadad</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H758\">Syria</span> <span class=\"wl wl-kjv\" data-code=\"H4422\">escaped</span> on an <span class=\"wl wl-kjv\" data-code=\"H5483\">horse</span> with the <span class=\"wl wl-kjv\" data-code=\"H6571\">horsemen.</span>","21":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> the <span class=\"wl wl-kjv\" data-code=\"H5483\">horses</span> and <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">slew</span> the <span class=\"wl wl-kjv\" data-code=\"H758\">Syrians</span> with a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4347\">slaughter.</span>","22":"And the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> <span class=\"wl wl-kjv\" data-code=\"H5066\">came</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H3212\">Go,</span> <span class=\"wl wl-kjv\" data-code=\"H2388\">strengthen</span> thyself, and <span class=\"wl wl-kjv\" data-code=\"H3045\">mark,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> what thou <span class=\"wl wl-kjv\" data-code=\"H6213\">doest:</span> for at the <span class=\"wl wl-kjv\" data-code=\"H8666\">return</span> of the <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H758\">Syria</span> will come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> against thee.","23":"And the <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H758\">Syria</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Their <span class=\"wl wl-kjv\" data-code=\"H430\">gods</span> are <span class=\"wl wl-kjv\" data-code=\"H430\">gods</span> of the <span class=\"wl wl-kjv\" data-code=\"H2022\">hills;</span> therefore they were <span class=\"wl wl-kjv\" data-code=\"H2388\">stronger</span> than we; <span class=\"wl wl-kjv\" data-code=\"H199\">but</span> let us <span class=\"wl wl-kjv\" data-code=\"H3898\">fight</span> against them in the <span class=\"wl wl-kjv\" data-code=\"H4334\">plain,</span> and <span class=\"wl wl-kjv\" data-code=\"H3808\">surely</span> we shall be <span class=\"wl wl-kjv\" data-code=\"H2388\">stronger</span> than they.","24":"And <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> this <span class=\"wl wl-kjv\" data-code=\"H1697\">thing,</span> <span class=\"wl wl-kjv\" data-code=\"H5493\">Take</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> away, every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> out of his <span class=\"wl wl-kjv\" data-code=\"H4725\">place,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> <span class=\"wl wl-kjv\" data-code=\"H6346\">captains</span> in their rooms:","25":"And <span class=\"wl wl-kjv\" data-code=\"H4487\">number</span> thee an <span class=\"wl wl-kjv\" data-code=\"H2428\">army,</span> like the <span class=\"wl wl-kjv\" data-code=\"H2428\">army</span> that thou hast <span class=\"wl wl-kjv\" data-code=\"H5307\">lost,</span> <span class=\"wl wl-kjv\" data-code=\"H5483\">horse</span> for <span class=\"wl wl-kjv\" data-code=\"H5483\">horse,</span> and <span class=\"wl wl-kjv\" data-code=\"H7393\">chariot</span> for <span class=\"wl wl-kjv\" data-code=\"H7393\">chariot:</span> and we will <span class=\"wl wl-kjv\" data-code=\"H3898\">fight</span> <span class=\"wl wl-kjv\" data-code=\"H854\">against</span> them in the <span class=\"wl wl-kjv\" data-code=\"H4334\">plain,</span> and surely we shall be <span class=\"wl wl-kjv\" data-code=\"H2388\">stronger</span> than they. And he <span class=\"wl wl-kjv\" data-code=\"H8085\">hearkened</span> unto their <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> and did <span class=\"wl wl-kjv\" data-code=\"H6213\">so.</span>","26":"And it came to pass at the <span class=\"wl wl-kjv\" data-code=\"H8666\">return</span> of the <span class=\"wl wl-kjv\" data-code=\"H8141\">year,</span> that <span class=\"wl wl-kjv\" data-code=\"H1130\">Benhadad</span> <span class=\"wl wl-kjv\" data-code=\"H6485\">numbered</span> the <span class=\"wl wl-kjv\" data-code=\"H758\">Syrians,</span> and went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H663\">Aphek,</span> to <span class=\"wl wl-kjv\" data-code=\"H4421\">fight</span> against <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","27":"And the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> were <span class=\"wl wl-kjv\" data-code=\"H6485\">numbered,</span> and were all <span class=\"wl wl-kjv\" data-code=\"H3557\">present,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> <span class=\"wl wl-kjv\" data-code=\"H7125\">against</span> them: and the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> before them like <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> little <span class=\"wl wl-kjv\" data-code=\"H2835\">flocks</span> of <span class=\"wl wl-kjv\" data-code=\"H5795\">kids;</span> but the <span class=\"wl wl-kjv\" data-code=\"H758\">Syrians</span> <span class=\"wl wl-kjv\" data-code=\"H4390\">filled</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">country.</span>","28":"And there <span class=\"wl wl-kjv\" data-code=\"H5066\">came</span> a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> Because the <span class=\"wl wl-kjv\" data-code=\"H758\">Syrians</span> have <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of the <span class=\"wl wl-kjv\" data-code=\"H2022\">hills,</span> but he is not <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of the <span class=\"wl wl-kjv\" data-code=\"H6010\">valleys,</span> therefore will I <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> all this <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude</span> into thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and ye shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","29":"And they <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> <span class=\"wl wl-kjv\" data-code=\"H428\">one</span> over <span class=\"wl wl-kjv\" data-code=\"H5227\">against</span> the <span class=\"wl wl-kjv\" data-code=\"H428\">other</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days.</span> And so it was, that in the <span class=\"wl wl-kjv\" data-code=\"H7637\">seventh</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle</span> was <span class=\"wl wl-kjv\" data-code=\"H7126\">joined:</span> and the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H5221\">slew</span> of the <span class=\"wl wl-kjv\" data-code=\"H758\">Syrians</span> an <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H7273\">footmen</span> in <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day.</span>","30":"But the <span class=\"wl wl-kjv\" data-code=\"H3498\">rest</span> <span class=\"wl wl-kjv\" data-code=\"H5127\">fled</span> to <span class=\"wl wl-kjv\" data-code=\"H663\">Aphek,</span> into the <span class=\"wl wl-kjv\" data-code=\"H5892\">city;</span> and there a <span class=\"wl wl-kjv\" data-code=\"H2346\">wall</span> <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> upon <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> and <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> of the <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> that were <span class=\"wl wl-kjv\" data-code=\"H3498\">left.</span> And <span class=\"wl wl-kjv\" data-code=\"H1130\">Benhadad</span> <span class=\"wl wl-kjv\" data-code=\"H5127\">fled,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> into the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> into an <span class=\"wl wl-kjv\" data-code=\"H2315\">inner</span> <span class=\"wl wl-kjv\" data-code=\"H2315\">chamber.</span>","31":"And his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Behold now, we have <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> that the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> are <span class=\"wl wl-kjv\" data-code=\"H2617\">merciful</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">kings:</span> let us, I pray thee, <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> <span class=\"wl wl-kjv\" data-code=\"H8242\">sackcloth</span> on our <span class=\"wl wl-kjv\" data-code=\"H4975\">loins,</span> and <span class=\"wl wl-kjv\" data-code=\"H2256\">ropes</span> upon our <span class=\"wl wl-kjv\" data-code=\"H7218\">heads,</span> and go <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> peradventure he will <span class=\"wl wl-kjv\" data-code=\"H2421\">save</span> thy <span class=\"wl wl-kjv\" data-code=\"H5315\">life.</span>","32":"So they <span class=\"wl wl-kjv\" data-code=\"H2296\">girded</span> <span class=\"wl wl-kjv\" data-code=\"H8242\">sackcloth</span> on their <span class=\"wl wl-kjv\" data-code=\"H4975\">loins,</span> and put <span class=\"wl wl-kjv\" data-code=\"H2256\">ropes</span> on their <span class=\"wl wl-kjv\" data-code=\"H7218\">heads,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H1130\">Benhadad</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saith,</span> I pray thee, let me <span class=\"wl wl-kjv\" data-code=\"H2421\">live.</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Is he yet <span class=\"wl wl-kjv\" data-code=\"H2416\">alive?</span> he is my <span class=\"wl wl-kjv\" data-code=\"H251\">brother.</span>","33":"Now the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> did diligently <span class=\"wl wl-kjv\" data-code=\"H5172\">observe</span> whether any thing would come from him, and did <span class=\"wl wl-kjv\" data-code=\"H4116\">hastily</span> <span class=\"wl wl-kjv\" data-code=\"H2480\">catch</span> it: and they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Thy <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> <span class=\"wl wl-kjv\" data-code=\"H1130\">Benhadad.</span> Then he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H935\">Go</span> ye, <span class=\"wl wl-kjv\" data-code=\"H3947\">bring</span> him. Then <span class=\"wl wl-kjv\" data-code=\"H1130\">Benhadad</span> came <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> to him; and he caused him to come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> into the <span class=\"wl wl-kjv\" data-code=\"H4818\">chariot.</span>","34":"And Benhadad <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, The <span class=\"wl wl-kjv\" data-code=\"H5892\">cities,</span> which my <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> from thy <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> I will <span class=\"wl wl-kjv\" data-code=\"H7725\">restore;</span> and thou shalt <span class=\"wl wl-kjv\" data-code=\"H7760\">make</span> <span class=\"wl wl-kjv\" data-code=\"H2351\">streets</span> for thee in <span class=\"wl wl-kjv\" data-code=\"H1834\">Damascus,</span> as my <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">made</span> in <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria.</span> Then said Ahab, I will send thee <span class=\"wl wl-kjv\" data-code=\"H7971\">away</span> with this <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant.</span> So he <span class=\"wl wl-kjv\" data-code=\"H3772\">made</span> a <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> with him, and sent him <span class=\"wl wl-kjv\" data-code=\"H7971\">away.</span>","35":"And a <span class=\"wl wl-kjv\" data-code=\"H259\">certain</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto his <span class=\"wl wl-kjv\" data-code=\"H7453\">neighbour</span> in the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H5221\">Smite</span> me, I pray thee. And the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H3985\">refused</span> to <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> him.","36":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> he unto him, Because thou hast not <span class=\"wl wl-kjv\" data-code=\"H8085\">obeyed</span> the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> behold, as soon as thou art <span class=\"wl wl-kjv\" data-code=\"H1980\">departed</span> from me, a <span class=\"wl wl-kjv\" data-code=\"H738\">lion</span> shall <span class=\"wl wl-kjv\" data-code=\"H5221\">slay</span> thee. And as soon as he was <span class=\"wl wl-kjv\" data-code=\"H3212\">departed</span> from <span class=\"wl wl-kjv\" data-code=\"H681\">him,</span> a <span class=\"wl wl-kjv\" data-code=\"H738\">lion</span> <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> him, and <span class=\"wl wl-kjv\" data-code=\"H5221\">slew</span> him.","37":"Then he <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> <span class=\"wl wl-kjv\" data-code=\"H312\">another</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H5221\">Smite</span> me, I pray thee. And the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> him, so that in <span class=\"wl wl-kjv\" data-code=\"H5221\">smiting</span> he <span class=\"wl wl-kjv\" data-code=\"H6481\">wounded</span> him.","38":"So the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">departed,</span> and <span class=\"wl wl-kjv\" data-code=\"H5975\">waited</span> for the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> by the <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> and <span class=\"wl wl-kjv\" data-code=\"H2664\">disguised</span> himself with <span class=\"wl wl-kjv\" data-code=\"H666\">ashes</span> upon his <span class=\"wl wl-kjv\" data-code=\"H5869\">face.</span>","39":"And as the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> passed <span class=\"wl wl-kjv\" data-code=\"H5674\">by,</span> he <span class=\"wl wl-kjv\" data-code=\"H6817\">cried</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king:</span> and he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> into the <span class=\"wl wl-kjv\" data-code=\"H7130\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle;</span> and, behold, a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> turned <span class=\"wl wl-kjv\" data-code=\"H5493\">aside,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> unto me, and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H8104\">Keep</span> this <span class=\"wl wl-kjv\" data-code=\"H376\">man:</span> if by any <span class=\"wl wl-kjv\" data-code=\"H6485\">means</span> he be <span class=\"wl wl-kjv\" data-code=\"H6485\">missing,</span> then shall thy <span class=\"wl wl-kjv\" data-code=\"H5315\">life</span> be for his <span class=\"wl wl-kjv\" data-code=\"H5315\">life,</span> or else thou shalt <span class=\"wl wl-kjv\" data-code=\"H8254\">pay</span> a <span class=\"wl wl-kjv\" data-code=\"H3603\">talent</span> of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver.</span>","40":"And as thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> was <span class=\"wl wl-kjv\" data-code=\"H6213\">busy</span> here and there, he was <span class=\"wl wl-kjv\" data-code=\"H369\">gone.</span> And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, So shall thy <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment</span> be; thyself hast <span class=\"wl wl-kjv\" data-code=\"H2782\">decided</span> it.","41":"And he <span class=\"wl wl-kjv\" data-code=\"H4116\">hasted,</span> and took the <span class=\"wl wl-kjv\" data-code=\"H666\">ashes</span> <span class=\"wl wl-kjv\" data-code=\"H5493\">away</span> from his <span class=\"wl wl-kjv\" data-code=\"H5869\">face;</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H5234\">discerned</span> him that he was of the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets.</span>","42":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> Because thou hast let <span class=\"wl wl-kjv\" data-code=\"H7971\">go</span> out of thy <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> whom I appointed to utter <span class=\"wl wl-kjv\" data-code=\"H2764\">destruction,</span> therefore thy <span class=\"wl wl-kjv\" data-code=\"H5315\">life</span> shall go for his <span class=\"wl wl-kjv\" data-code=\"H5315\">life,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> for his <span class=\"wl wl-kjv\" data-code=\"H5971\">people.</span>","43":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> to his <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> <span class=\"wl wl-kjv\" data-code=\"H5620\">heavy</span> and <span class=\"wl wl-kjv\" data-code=\"H2198\">displeased,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Syrië,","tekst":"Hebreeuws, Aram; dat is, Syrië, en zo in het volgende. Zie Gen 10:22, en Gen 22:21."},{"catchword":"twee en dertig","tekst":"Zonder twijfel niet zo grote kongingen, als wel Benhadad was. Vergelijk de aantekeningen Gen 14:1."}],"3":[{"catchword":"die zijn mijn","tekst":"Dat is, behoren mij toe in eigendom, en zult ze daarom mij ten eerste toezenden, zo gij vrede van mij begeert en wilt dat ik aflate uwe stad te belegeren. Dat dit zijn mening geweest is, nemen enigen af, onder, uit vs.5,6. Hoewel Achab de woorden van Benhadad alleen schijnt uitgelegd te hebben van de souvereiniteit en opperheid, die hij over hem, zijn vrouwen, zijn kinderen en zijn goed door deze belegering scheen te zoeken; gelijk te zien is vs.4, 7, 9."}],"4":[{"catchword":"uwe,","tekst":"Dat is, uw vazal of leenman, die u als mijn souverein en leenheer erken."}],"5":[{"catchword":"Ik heb wel","tekst":"Alsof hij zeide: Het is gewis alzo, gelijk ik ontboden heb en gij mede hebt moeten bekennen, dat het uwe mij toebehoort, doch met dezen verstande, dat gij zulks mij met den eersten zonder uitstel dadelijk zoudt toeschikken; hetwelk nadien gij niet gedaan hebt, zo zal ik morgen omtrent dezen tijd, enz."}],"6":[{"catchword":"uwer knechten","tekst":"Sommigen menen dat hij hiermede zijn eersten eis verzwaart, merkende de kleinhartigheid van Achab uit zijn antwoord, vermeld boven, vs.4, want hij begeert nu niet alleen Achabs, maar ook zijner knechten goederen."},{"catchword":"het begeerlijke","tekst":"Dat is, al hetgeen gij gaarne ziet, met begeerte van dat te mogen behouden."}],"7":[{"catchword":"oudsten","tekst":"Zie Lev 4:15."},{"catchword":"het kwade","tekst":"Dat is, mijn en mijns koninkrijks verderf; niet zijnde tevreden met redelijke conditiën, die ik hem aangeboden heb."},{"catchword":"niet geweigerd","tekst":"Te weten, mits de mijnen en mijn goed hem als souverein en beschermheer te onderwerpen; hoewel niet eigendom over te geven."}],"9":[{"catchword":"waarom gij","tekst":"Hetwelk Achab verstond van de souvereiniteit of opperheid in het burgerlijk gebied, en niet van den eigendom en het gebruik. Zie boven, de aantekeningen vs.3."},{"catchword":"hem bescheid","tekst":"Namelijk, den koning Benhadad."}],"10":[{"catchword":"De goden","tekst":"Zie boven, 1Ki 19:2."},{"catchword":"indien","tekst":"De zin is, dat hij zoveel volk in zijn leger had, dat in Samaria geen stof genoeg was, zo elkeen der zijnen een handvol daarvan wilde nemen."},{"catchword":"dat mijn voetstappen","tekst":"Hebreeuws, dat aan mijn voeten is. Zie Exo 11:8, en Jdg 4:10, met de aantekening."}],"11":[{"catchword":"Die zich aangordt,","tekst":"Dat is, die zich wapent ten strijde eer hij de overwinning heeft, houde zich niet gelijk dengene, die zich ontwapent als hij overwinning heeft. Het is een spreekwoord van gelijken zin als wanneer zij zeggen: Men moet geen triomflied zingen vóór de victorie."}],"12":[{"catchword":"Legt aan","tekst":"Te weten, uw geweer en alle krijgsgereedschap, om u in orde te zetten, de stad te bestormen en met geweld in te nemen."}],"13":[{"catchword":"opdat gij weet,","tekst":"Alzo onder, vs.28. Dit is het einde van alle weldaden Gods, dat Hij recht bekend, ernstiglijk gedankt en trouwelijk gediend worde."}],"14":[{"catchword":"Door de jongens","tekst":"Versta door dezen de dienaars en pages van de oversten der provinciën en stammen, of de jonge edelieden, zonen van de heren des lands, die bij den koning woonden en in de wapenen geoefend werden."},{"catchword":"aanbinden?","tekst":"Dat is, zoals enigen overzetten, in orde stellen, of, gelijk anderen, wie zal den strijd beginnen; te weten, wij Israëlieten; of zullen wij de Syriërs verwachten, dat zij ons aanvallen? Dezelfde manier van spreken is ook 2Ch 13:3."}],"17":[{"catchword":"Doch Benhadad","tekst":"De zin is, dat hij, verstaan hebbende van zijn wacht dat enige mannen zich omtrent de stad vertoonden, gezonden heeft om te vernemen, wat zij voor lieden waren. Het rapport was dat zij waren mannen, uit de stad getogen."}],"19":[{"catchword":"dat hen navolgde","tekst":"Hebreeuws, dat achter hen was."}],"20":[{"catchword":"een ieder","tekst":"Te weten, der Israëlieten, van welken ieder een der Syriërs versloeg, die aankwamen om de Israëlieten levend te grijpen."}],"22":[{"catchword":"die profeet","tekst":"Van denwelken gesproken is boven, vs.13."},{"catchword":"doen zult;","tekst":"Te weten, niet alleen met menselijke middelen te gebruiken, maar voornamelijk de goddelijke hulp te verkrijgen door ware bekering."},{"catchword":"met de wederkomst des jaars","tekst":"Dat is, met de aankomst van den zomer, als de legers, om de bekwaamheid van den leeftocht en voeder te genieten, plegen te velde te komen. Alzo onder, vs.26. Vergelijk 2Sa 11:1; 1Ch 20:1; 2Ch 36:10."}],"23":[{"catchword":"Want de knechten","tekst":"Dit was den profeet bekend geworden, òf door enig gerucht, dat tot hem gekomen was, òf door de openbaring Gods, van welke een schoon exempel te zien is 2Ki 6:8."},{"catchword":"hem gezegd","tekst":"Namelijk, tot hunnen koning."},{"catchword":"berggoden,","tekst":"Dat is, op bergen [zo zij hielden] wonende, die hun volk daar alleen kunnen helpen, en niet op het effen veld."},{"catchword":"zo wij niet","tekst":"Voeg hierbij den verzwegen vloek of straf; als, vergaan moeten wij, of eerloos worden; of, of wij, enz. Te weten, laat zien, of wat geldt het! Anders, zullen wij niet sterker zijn? alzo onder, vs.25. Zie Gen 14:23."}],"24":[{"catchword":"koningen weg,","tekst":"Te weten, welker hulp hij tevoren gebruikt had, boven, vs.1, 16."},{"catchword":"uit zijn plaats,","tekst":"Dat is, uit het gebied, dat zij in uw heirleger gehad hebben."},{"catchword":"landvoogden","tekst":"Dat is, heren en vorsten van uw eigen land, die gij beter kent en die u getrouwer zullen wezen."}],"25":[{"catchword":"van de uwen","tekst":"Hebreeuws, van, of uit u; dat is, die, in uw dienst zijnde, van de Israëlieten hier tevoren zijn verslagen. Zie boven, vs.20,21."},{"catchword":"gevallen is,","tekst":"Dat is, in den strijd omgekomen. Zie Gen 14:10."},{"catchword":"zo wij niet","tekst":"Zie boven, vs.23."}],"26":[{"catchword":"Afek,","tekst":"Een stad, gelegen in den stam van Aser, die de Syriërs in dezen krijgstocht schijnen, uit vs.30, in hun geweld gekregen te hebben. Zie van dezelve Jos 13:4, en Jos 19:30; Jdg 1:31."}],"27":[{"catchword":"verzorgd","tekst":"Anders, waren in vollen getale gevonden."},{"catchword":"twee blote","tekst":"Hierbij wordt het heir der Israëlieten, hetwelk in tweeën gedeeld was, vergeleken; om te kennen te geven, niet alleen dat zij weinig in getal, maar ook zwak in krijgsrusting en wapenen, ten aanzien van de Syriërs waren."}],"28":[{"catchword":"de man Gods","tekst":"Te weten, de profeet, van denwelken gesproken is vs.13, 22, of een andere."},{"catchword":"opdat gijlieden","tekst":"Zie boven, vs.13."}],"30":[{"catchword":"Afek","tekst":"Zie boven, vs.26. Het schijnt hieruit, dat de Syriërs deze stad ingenomen hadden."},{"catchword":"van kamer","tekst":"Alzo onder, 1Ki 22:25. De zin is, dat Benhadad, zeer verslagen zijnde door zijn grote nederlagen en vrezende voor zijn persoon, van de ene kamer in de andere gevlucht is, niet wetende waar hij zich bergen zou. Anders, tot ener kamer, binnenkamer. Versta, een geheim vertrek, of verborgen plaats, die in enige kamer tot verzekering gemaakt is."}],"31":[{"catchword":"goedertierene","tekst":"Hebreeuws, koningen der goedertierenheid, of, weldadigheid."},{"catchword":"om onze lenden","tekst":"Zij wilden met dit teken te kennen geven dat zij den dood verdiend hadden, en riepen om genade, als met groot leedwezen en deemoedigheid des harten. Zie Gen 37:34."},{"catchword":"koorden","tekst":"Dewelke ook heden de misdadigers aan den hals somtijds hebben moeten, tot een teken dat zij den dood waardig zijn."},{"catchword":"uw ziel","tekst":"Dat is, persoon; alzo in het volgende. Zie boven, 1Ki 19:4."}],"32":[{"catchword":"broeder","tekst":"Dat is, dien ik als een broeder vriendschap te bewijzen bereid ben."}],"33":[{"catchword":"en vatten","tekst":"Hebreeuws, en zij haastten en vatten het; te weten, dat de koning Israëls hun koning Benhadad zijn broeder genoemd had, houdende zulks voor een teken van zijn goede genegenheid tot Benhadad. Anders, raapten het op, sneden het af; te weten, van Achabs woorden."},{"catchword":"of het van hem ware,","tekst":"Dat is, of het woord broeder uit een oprecht hart gekomen was, en of hij de broederschap meende, dan of zijn zeggen alleen een bedriegelijke veinzing van den mond geweest was."},{"catchword":"brengt hem","tekst":"Hebreeuws, neemt hem; dat is, neemt en brengt hem. Zie Gen 12:15."}],"34":[{"catchword":"hij zeide","tekst":"Namelijk, Benhadad."},{"catchword":"De steden,","tekst":"Zie van deze boven, 1Ki 15:20."},{"catchword":"straten in Damaskus,","tekst":"Versta, markten, uit welk Achab enige schatting zou trekken; of richtplaatsen, in welke het opperste oordeel hem zou toekomen; of enige aankomsten en grenzen des lands, die in zijn geweld zouden wezen."}],"35":[{"catchword":"zonen","tekst":"Welke waren jonge lieden, onderricht door de profeten in de ware leer, bestuurd tot den zuiveren godsdienst, en vermaand tot de oprechtheid des levens. Zij hadden hun collegiën, in welke de profeten waren als hunne kinderen; gelijk zij ook zo genoemd worden vs.35, 1Sa 10:12; 2Ki 2:3, 2Ki 2:5, en Isa 8:18. Vergelijk Jdg 17:10."},{"catchword":"door het woord","tekst":"Dat is, door Gods bevel, hetwelk hij dezen zijnen naaste te kennen gaf."},{"catchword":"Sla mij toch","tekst":"Het woor slaan betekent hier niet doden, gelijk in vs.36, maar smijten, als met vuisten, stokken, touwen, enz., zonder dat de dood daarna volgt, gelijk Exo 21:15, Exo 21:18; Pro 23:13, en onder, vs.37."},{"catchword":"weigerde hem","tekst":"Waarin hij kwalijk deed, dewijl hij verstaan had dat zulks van God bevolen was."}],"36":[{"catchword":"slaan","tekst":"Dat is, doden. Alzo Gen 32:11; Lev 24:21, en boven, vs.20, enz. Zie Gen 8:21."}],"37":[{"catchword":"slaande en wondende","tekst":"Dat is, sloeg hem lang en veel, zodat hij hem kwetste."}],"38":[{"catchword":"verstelde","tekst":"Het Hebreeuwse woord betekent zich veranderen om niet bekend te worden; hetwelk deze profeet gedaan heeft met as op zijn aangezicht te strooien, of [gelijk anderen overzetten] met een deksel op zijn ogen te doen. Onder, 1Ki 22:30, betekent het, zich veranderen en vermommen door verandering van klederen. Vergelijk boven, 1Ki 14:2."},{"catchword":"as","tekst":"Anders, sluier, of deksel."},{"catchword":"boven zijn ogen","tekst":"Dat is, op het hoofd, en voorts in het aangezicht."}],"39":[{"catchword":"riep,","tekst":"Als hebbende enige zaak hem aan te dienen."},{"catchword":"man was afgeweken,","tekst":"Versta, een gevangene om dien te bewaren dat hij niet ontliep."},{"catchword":"enigszins","tekst":"Hebreeuws, missende gemist wordt."},{"catchword":"ziel in de plaats","tekst":"Dat is, uw leven voor zijn leven; dat is, gij zult voor hem sterven. Alzo onder, vs.42; idem Exo 21:23."},{"catchword":"talent zilvers","tekst":"Zie van deze waarde, boven, 1Ki 16:24."},{"catchword":"opwegen","tekst":"Dat is, betalen."}],"40":[{"catchword":"hij er niet was","tekst":"Te weten, de gevangen man."},{"catchword":"oordeel;","tekst":"Dat is, zodanig is uw eigen oordeel. Versta, het oordeel der verwijzing, waardoor iemand schuldig en strafwaardig verklaard wordt. Alzo is ook het woord oordelen genomen, Luk 19:22; Joh 12:48; 1Co 6:2. De zin is: Gij brengt uw eigen vonnis mede, dewijl gij aangenomen hebt den man te bewaren, met de conditie van u verhaald."}],"41":[{"catchword":"deed de as af","tekst":"Zie boven, vs.38, en de aantekeningen daarop."}],"42":[{"catchword":"den man,","tekst":"Namelijk, Benhadad. Hebreeuws, den man mijner verbanning; dat is, dien ik wilde gedood en gans uitgeroeid hebben. Zie Deu 2:34."}],"43":[{"catchword":"gemelijk","tekst":"Of, afkerig, verdrietig, ongezind, korzel."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And Benhadad the king of Syria [Heb. Aram that is Syria and so in the sequel see Genesis 10 on verse 22 and22 on verse 21] gathered all his strength together and two and thirty kings were with him [doubtless not so great kings as Benhadad was compare Genesis 14 the annotate on verse 1] and horses and charets and he marched up and besieged Samaria and warred against it."}],"2":[{"catchword":null,"tekst":"And he sent messenger to Achab king of Israel into the city."}],"3":[{"catchword":null,"tekst":"And he said unto him thus said Benhadad thine silver and thine gold that is mine besides thy wives and thy children they are mine [ that is belong to me as my own that is they send them to the forth with if thou wouldst have peace and have me desist from besieging thy city that is was his intent and meaning some do gather below from verse 5,6 although Achab seemeth to have interpreteth his words only of the sovereign and supremacy which he sought to have over him his wives his children and his estate by this siege as appeareth by verse 4,7,9.]"}],"4":[{"catchword":null,"tekst":"And the king of Israel answered and said according to thy word my Lord the king I am thine [that is thy vassal acknowledging thee to be my sovereign &c.] and all that I have."}],"5":[{"catchword":null,"tekst":"then came the messengers again and said thus speaketh Behadad saying I sent indeed to thee saying thou shalt deliver me thy silver and thy gold and thy wives and thy children [as if he had said it is true as I sent word unto thee and thyself wast fain to acknowledge that all thy own belongs to me but it was to this end that thou shouldst have transmitted the same unto me forth with actually without delay which being not performed I shall tomorrow &c. as it followeth in the sixth verse.]"}],"6":[{"catchword":null,"tekst":"But I will send tomorrow about this time my servants unto thee to search thine house and the houses of the servants some conceive that hereby aggraveteth his first demand perceiving the pullfilanimity of Achab by his answer mentioned above verse 4 for now he not only desireth Achabs but also his servant estate ]and it shall come to pass that they shall put into their hands all the desirable of thine eyes [that is whatsoever thou willingly seest with desire still to keep it by thee] and take it away."}],"7":[{"catchword":null,"tekst":"Then the king of Israel called all the eldest of the land [see Leviticus 4 on verse 15] and said consider I pray and see that this man seeketh evil [that I mine and my kingdoms ruine not being contempt with the reasonable terms that I have proferred him ]for he had sent to me for my wives and for my children and for my silver and for my Gold and I denied it not unto him [viz. in subjection of mine estate unto him as my sovereign and protector though not delivering up the propriety thereof.]"}],"8":[{"catchword":null,"tekst":"But all the eldest and all the people said unto him hearken not unto him nor consent."}],"9":[{"catchword":null,"tekst":"Wherefore he said unto the messengers of Benhadad tell my Lord the king all that thou didst send me thy servant at the first I will do [which Achab understood of the sovereignty and supremacy in the civil jurisdiction and not of the propriety and use see above the annotate on verse 3] but this thing I cannot do so the messengers departed and brought him [viz. king Benhadad ] word again."}],"10":[{"catchword":null,"tekst":"And the king Benhadad sent unto him and said the Lord do so unto me and so add thereunto [see above chapter 19 on verse 2]if the dust of Samaria shall suffice the handful of all the people that follow my footsteps [Heb. that are at my feet see Exo 11:8 and Jud 4:10 with the annotate the meaning is that he had so much people in his camp that was not dust enough in Samaria in every one of his man to take an handful of it.]"}],"11":[{"catchword":null,"tekst":"But the king of Israel answered and said speak to him let not him that girdeth himself boast himself as he that loosneth himself [that is let not him that armeth himself for the battle carry himself before he hath gotten the victory as he that disarmes himself after he hath had the victory it is a proverb of this like sence when we say the song of triumph is not the sing before the victory.]"}],"12":[{"catchword":null,"tekst":"And it came topass when he heard this word when he was drinking he and the kings in the tents that he said unto the servants lay on [that is your weapon and all the instruments of war to put yourselves in array to storm the city and to take it by force ] and they laid on against the city."}],"13":[{"catchword":null,"tekst":"And behold a prophet stepped to Achab the king of Israel and said thus saidth the lord hast thou seen all this great multitude behold I will deliver them this day unto thine hand that thou mayst know that I am the lord [so below verse 28 this is the end of all the mercies of God that he may be rightly acknowledged seriously thanked and faithfully served.]"}],"14":[{"catchword":null,"tekst":"And Achab said; by whom? and; he said; thus saith the LORD; by the young men of the chief of the Provinces: [under stand by these the servants and pages of the prines of the Provinces, and tribes, or the young gentlemen son of Lords of the Land, that lived with the King, or foot-men, which were practised in armes] and he said who shall bind the battle ?[that is as some translate it order teh battle to set the battle in array or as others who shall begin the battle to wit we Israelites ? or shall we wait till the Syrians fall upon us? the like phrase is also 2Ch 13:3] and he said thou."}],"15":[{"catchword":null,"tekst":"Then he numbered the Lord of the governors of the countries and there were two hundred thirty and two and after them he numbered all the people all the children of Israel seven thousand."}],"16":[{"catchword":null,"tekst":"And they marched forth at noon now Benhadad drank himself drunk in the tents he and the kings and the two and thirty kings led him."}],"17":[{"catchword":null,"tekst":"And the lids of the governors of the country marched forth first but Benhadad sent forth so he and they told him saying they are men marched out of Samaria [the meaning is that he having understood by his guard that some men shewed themselves about the city sent to enquite what they were the report was that there were men march out of the city.]"}],"18":[{"catchword":null,"tekst":"And he said whether they become in peace take them alive whether there also become out of the battle take them alive."}],"19":[{"catchword":null,"tekst":"So these lads of governors of countries marched out of the city and the hosts that followed them [Heb. that was after them.]"}],"20":[{"ca
