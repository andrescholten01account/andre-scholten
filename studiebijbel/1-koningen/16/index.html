van de koningen van Israël?","6":"En Baësa ontsliep met zijn vaderen, en werd begraven te Thirza; en zijn zoon Ela regeerde in zijn plaats.","7":"Zo kwam ook het woord van de HEERE, door de dienst van de profeet Jehu, de zoon van Hanani, tegen Baësa en tegen zijn huis; en dat om al het kwaad dat hij gedaan had in de ogen van de HEERE, waarmee hij Hem tot toorn verwekte door het werk van zijn handen, omdat hij was als het huis van Jerobeam, en omdat hij hem had verslagen.","8":"In het zesentwintigste jaar van Asa, de koning van Juda, werd Ela, de zoon van Baësa, koning over Israël, te Thirza, en regeerde twee jaren.","9":"En Zimri, zijn knecht, aanvoerder van de helft van de wagens, maakte een verbond tegen hem, toen hij te Thirza was, zich dronken drinkend in het huis van Arza, die hofmeester te Thirza was.","10":"Zo kwam Zimri binnen, en sloeg hem, en doodde hem, in het zevenentwintigste jaar van Asa, de koning van Juda; en hij werd koning in zijn plaats.","11":"En het gebeurde, toen hij ging regeren, zodra hij op zijn troon zat, dat hij het hele huis van Baësa neersloeg; hij liet hem niemand over die tegen een muur waterde, noch van zijn bloedverwanten, noch van zijn vrienden.","12":"Zo vernietigde Zimri het hele huis van Baësa, naar het woord van de HEERE, dat Hij over Baësa gesproken had, door de dienst van de profeet Jehu;","13":"Om al de zonden van Baësa, en de zonden van Ela, zijn zoon, waarmee zij gezondigd hadden, en waarmee zij Israël hadden doen zondigen, en de HEERE, de God van Israël, tot toorn verwekten door hun nietige afgoden.","14":"Het overige nu van de geschiedenis van Ela, en alles wat hij gedaan heeft, is dat niet geschreven in het boek van de kronieken van de koningen van Israël?","15":"In het zevenentwintigste jaar van Asa, de koning van Juda, regeerde Zimri zeven dagen te Thirza; en het volk had zich gelegerd tegen Gibbethon, dat van de Filistijnen is.","16":"Het volk nu, dat zich gelegerd had, hoorde zeggen: Zimri heeft een verbond gesloten, ja, heeft ook de koning verslagen; daarom maakte heel Israël diezelfde dag Omri, de legeraanvoerder, koning over Israël, in het leger.","17":"En Omri trok op, en heel Israël met hem, van Gibbethon, en zij belegerden Thirza.","18":"En het gebeurde, toen Zimri zag dat de stad ingenomen was, dat hij het paleis van het huis van de koning inging, en het huis van de koning boven zich met vuur verbrandde, en stierf;","19":"Om zijn zonden, die hij gezondigd had, door te doen wat kwaad was in de ogen van de HEERE, door te wandelen in de weg van Jerobeam, en in zijn zonde, die hij gedaan had, door Israël te doen zondigen.","20":"Het overige nu van de geschiedenis van Zimri, en zijn verraad, dat hij gepleegd heeft, is dat niet geschreven in het boek van de kronieken van de koningen van Israël?","21":"Toen werd het volk van Israël verdeeld in twee helften; de helft van het volk volgde Tibni, de zoon van Ginath, om hem koning te maken; en de andere helft volgde Omri.","22":"Maar het volk dat Omri volgde, was sterker dan het volk dat Tibni, de zoon van Ginath, volgde; en Tibni stierf, en Omri regeerde.","23":"In het eenendertigste jaar van Asa, de koning van Juda, werd Omri koning over Israël, en regeerde twaalf jaren; te Thirza regeerde hij zes jaren.","24":"En hij kocht de berg Samaria van Semer, voor twee talenten van het zilver, en bebouwde de berg; en noemde de naam van de stad die hij bouwde, naar de naam van Semer, de heer van de berg, Samaria.","25":"En Omri deed wat kwaad was in de ogen van de HEERE; ja, hij deed erger dan allen die voor hem geweest waren.","26":"En hij wandelde in alle wegen van Jerobeam, de zoon van Nebat, en in zijn zonden, waarmee hij Israël had doen zondigen, en verwekte de HEERE, de God van Israël, tot toorn, door hun nietige afgoden.","27":"Het overige nu van de geschiedenis van Omri, wat hij gedaan heeft, en zijn macht die hij getoond heeft, is dat niet geschreven in het boek van de kronieken van de koningen van Israël?","28":"En Omri ontsliep met zijn vaderen, en werd begraven te Samaria; en zijn zoon Achab regeerde in zijn plaats.","29":"En Achab, de zoon van Omri, werd koning over Israël, in het achtendertigste jaar van Asa, de koning van Juda; en Achab, de zoon van Omri, regeerde over Israël, te Samaria, tweeëntwintig jaren.","30":"En Achab, de zoon van Omri, deed wat kwaad was in de ogen van de HEERE, meer dan allen die voor hem geweest waren.","31":"En het gebeurde (was het een lichte zaak dat hij wandelde in de zonden van Jerobeam, de zoon van Nebat?), dat hij ook nog Izebel, de dochter van Eth-baal, de koning van de Sidoniërs, tot vrouw nam, en heenging, en Baäl diende, en zich voor hem neerboog.","32":"En hij richtte voor Baäl een altaar op, in het huis van Baäl, dat hij te Samaria gebouwd had.","33":"Ook maakte Achab een gewijd bos, zodat Achab nog meer deed om de HEERE, de God van Israël, tot toorn te verwekken, dan alle koningen van Israël die voor hem geweest waren.","34":"In zijn dagen bouwde Hiel, de Betheliet, Jericho; op Abiram, zijn eerstgeboren zoon, heeft hij het gegrondvest, en op Segub, zijn jongste zoon, heeft hij de poorten ervan geplaatst; naar het woord van de HEERE, dat Hij door de dienst van Jozua, de zoon van Nun, gesproken had."},"SV":{"1":"Toen geschiedde het woord des HEEREN tot Jehu, den zoon van Hanani, tegen Baësa, zeggende:","2":"Daarom, dat Ik u uit het stof verheven, en u tot een voorganger over Mijn volk Israël gesteld heb, en gij gewandeld hebt in den weg van Jerobeam, en Mijn volk Israël hebt doen zondigen, Mij tot toorn verwekkende door hun zonden;","3":"Zie, zo zal Ik de nakomelingen van Baësa, en de nakomelingen van zijn huis wegdoen; en Ik zal uw huis maken, gelijk het huis van Jerobeam, den zoon van Nebat.","4":"Die van Baësa in de stad sterft, zullen de honden eten, en die van hem in het veld sterft, zullen de vogelen des hemels eten.","5":"Het overige nu der geschiedenissen van Baësa, en wat hij gedaan heeft, en zijn macht, zijn die niet geschreven in het boek der kronieken der koningen van Israël?","6":"En Baësa ontsliep met zijn vaderen, en werd begraven te Thirza; en zijn zoon Ela regeerde in zijn plaats.","7":"Alzo geschiedde ook het woord des HEEREN, door den dienst van den profeet Jehu, den zoon van Hanani, tegen Baësa en tegen zijn huis; en dat om al het kwaad, dat hij gedaan had in de ogen des HEEREN, Hem tot toorn verwekkende door het werk zijner handen, omdat hij was gelijk het huis van Jerobeam, en omdat hij hetzelve verslagen had.","8":"In het zes en twintigste jaar van Asa, den koning van Juda, werd Ela, de zoon van Baësa, koning over Israël, te Thirza, *en* *regeerde* twee jaren.","9":"En Zimri, zijn knecht, overste van de helft der wagenen, maakte een verbintenis tegen hem, als hij te Thirza was, zich dronken drinkende in het huis van Arza, den hofmeester te Thirza;","10":"Zo kwam Zimri in, en sloeg hem, en doodde hem, in het zeven en twintigste jaar van Asa, den koning van Juda; en hij werd koning in zijn plaats.","11":"En het geschiedde, als hij regeerde, als hij op zijn troon zat, dat hij het ganse huis van Baësa sloeg; hij liet hem niet over die mannelijk was, noch zijn bloedverwanten, noch zijn vrienden.","12":"Alzo verdelgde Zimri het ganse huis van Baësa, naar het woord des HEEREN, dat Hij over Baësa gesproken had, door den dienst van den profeet Jehu;","13":"Om al de zonden van Baësa, en de zonden van Ela, zijn zoon, waarmede zij gezondigd hadden, en waarmede zij Israël hadden doen zondigen, tot toorn verwekkende den HEERE, den God Israëls, door hun ijdelheden.","14":"Het overige nu der geschiedenissen van Ela, en al wat hij gedaan heeft, is dat niet geschreven in het boek der kronieken der koningen van Israël?","15":"In het zeven en twintigste jaar van Asa, den koning van Juda, regeerde Zimri zeven dagen te Thirza; en het volk had zich gelegerd tegen Gibbethon, dat der Filistijnen is.","16":"Het volk nu, dat zich gelegerd had, hoorde zeggen: Zimri heeft een verbintenis gemaakt, ja, heeft ook den koning verslagen; daarom maakte het ganse Israël ten zelfden dage Omri, den krijgsoverste, koning over Israël, in het leger.","17":"En Omri toog op, en gans Israël met hem van Gibbethon, en belegerde Thirza.","18":"En het geschiedde, als Zimri zag, dat de stad ingenomen was, dat hij ging in het paleis van het huis des konings, en verbrandde boven zich het huis des konings met vuur, en stierf;","19":"Om zijn zonden, die hij gezondigd had, doende wat kwaad was in de ogen des HEEREN, wandelende in den weg van Jerobeam, en in zijn zonde, die hij gedaan had, doende Israël zondigen.","20":"Het overige nu der geschiedenissen van Zimri, en zijn verbintenis, die hij gemaakt heeft, zijn die niet geschreven in het boek der kronieken der koningen van Israël?","21":"Toen werd het volk van Israël verdeeld in twee helften; de helft des volks volgde Tibni, den zoon van Ginath, om hem koning te maken; en de helft volgde Omri.","22":"Maar het volk, dat Omri volgde, was sterker dan het volk, dat Tibni, den zoon van Ginath, volgde; en Tibni stierf, en Omri regeerde.","23":"In het een en dertigste jaar van Asa, den koning van Juda, werd Omri koning over Israël, *en* *regeerde* twaalf jaren; te Thirza regeerde hij zes jaren.","24":"En hij kocht den berg Samaria van Semer, voor twee talenten zilvers, en bebouwde den berg; en noemde den naam der stad, die hij bouwde, naar den naam van Semer, den heer des bergs, Samaria.","25":"En Omri deed wat kwaad was in de ogen des HEEREN; ja, hij deed erger dan allen, die voor hem geweest waren.","26":"En hij wandelde in alle wegen van Jerobeam, den zoon van Nebat, en in zijn zonden, waarmede hij Israël had doen zondigen, verwekkende den HEERE, den God Israëls, tot toorn, door hun ijdelheden.","27":"Het overige nu der geschiedenissen van Omri, wat hij gedaan heeft, en zijn macht die hij gepleegd heeft, zijn die niet geschreven in het boek der kronieken der koningen van Israël?","28":"En Omri ontsliep met zijn vaderen, en werd begraven te Samaria; en zijn zoon Achab regeerde in zijn plaats.","29":"En Achab, de zoon van Omri, werd koning over Israël, in het acht en dertigste jaar van Asa, den koning van Juda; en Achab, de zoon van Omri, regeerde over Israël, te Samaria, twee en twintig jaren.","30":"En Achab, den zoon van Omri, deed wat kwaad was in de ogen des HEEREN, meer dan allen, die voor hem geweest waren.","31":"En het geschiedde (was het een lichte zaak, dat hij wandelde in de zonden van Jerobeam, den zoon van Nebat?), dat hij nog ter vrouwe nam Izebel, de dochter van Eth-baal, den koning der Sidoniërs, en heenging, en diende Baäl, en boog zich voor hem.","32":"En hij richtte voor Baäl een altaar op, in het huis van Baäl, hetwelk hij te Samaria gebouwd had.","33":"Ook maakte Achab een bos, zodat Achab nog meer deed, om den HEERE, den God Israëls, tot toorn te verwekken, dan alle koningen van Israël, die voor hem geweest waren.","34":"In zijn dagen bouwde Hiel, de Betheliet, Jericho; op Abiram, zijn eerstgeborenen zoon, heeft hij haar gegrondvest, en op Segub, zijn jongsten *zoon*, heeft hij haar poorten gesteld; naar het woord des HEEREN, dat Hij door den dienst van Jozua, den zoon van Nun, gesproken had."},"KJV":{"1":"Then the word of the LORD came to Jehu the son of Hanani against Baasha, saying,","2":"Forasmuch as I exalted thee out of the dust, and made thee prince over my people Israel; and thou hast walked in the way of Jeroboam, and hast made my people Israel to sin, to provoke me to anger with their sins;","3":"Behold, I will take away the posterity of Baasha, and the posterity of his house; and will make thy house like the house of Jeroboam the son of Nebat.","4":"Him that dieth of Baasha in the city shall the dogs eat; and him that dieth of his in the fields shall the fowls of the air eat.","5":"Now the rest of the acts of Baasha, and what he did, and his might, are they not written in the book of the chronicles of the kings of Israel?","6":"So Baasha slept with his fathers, and was buried in Tirzah: and Elah his son reigned in his stead.","7":"And also by the hand of the prophet Jehu the son of Hanani came the word of the LORD against Baasha, and against his house, even for all the evil that he did in the sight of the LORD, in provoking him to anger with the work of his hands, in being like the house of Jeroboam; and because he killed him.","8":"In the twenty and sixth year of Asa king of Judah began Elah the son of Baasha to reign over Israel in Tirzah, two years.","9":"And his servant Zimri, captain of half his chariots, conspired against him, as he was in Tirzah, drinking himself drunk in the house of Arza steward of his house in Tirzah.","10":"And Zimri went in and smote him, and killed him, in the twenty and seventh year of Asa king of Judah, and reigned in his stead.","11":"And it came to pass, when he began to reign, as soon as he sat on his throne, that he slew all the house of Baasha: he left him not one that pisseth against a wall, neither of his kinsfolks, nor of his friends.","12":"Thus did Zimri destroy all the house of Baasha, according to the word of the LORD, which he spake against Baasha by Jehu the prophet,","13":"For all the sins of Baasha, and the sins of Elah his son, by which they sinned, and by which they made Israel to sin, in provoking the LORD God of Israel to anger with their vanities.","14":"Now the rest of the acts of Elah, and all that he did, are they not written in the book of the chronicles of the kings of Israel?","15":"In the twenty and seventh year of Asa king of Judah did Zimri reign seven days in Tirzah. And the people were encamped against Gibbethon, which belonged to the Philistines.","16":"And the people that were encamped heard say, Zimri hath conspired, and hath also slain the king: wherefore all Israel made Omri, the captain of the host, king over Israel that day in the camp.","17":"And Omri went up from Gibbethon, and all Israel with him, and they besieged Tirzah.","18":"And it came to pass, when Zimri saw that the city was taken, that he went into the palace of the king's house, and burnt the king's house over him with fire, and died,","19":"For his sins which he sinned in doing evil in the sight of the LORD, in walking in the way of Jeroboam, and in his sin which he did, to make Israel to sin.","20":"Now the rest of the acts of Zimri, and his treason that he wrought, are they not written in the book of the chronicles of the kings of Israel?","21":"Then were the people of Israel divided into two parts: half of the people followed Tibni the son of Ginath, to make him king; and half followed Omri.","22":"But the people that followed Omri prevailed against the people that followed Tibni the son of Ginath: so Tibni died, and Omri reigned.","23":"In the thirty and first year of Asa king of Judah began Omri to reign over Israel, twelve years: six years reigned he in Tirzah.","24":"And he bought the hill Samaria of Shemer for two talents of silver, and built on the hill, and called the name of the city which he built, after the name of Shemer, owner of the hill, Samaria.","25":"But Omri wrought evil in the eyes of the LORD, and did worse than all that were before him.","26":"For he walked in all the way of Jeroboam the son of Nebat, and in his sin wherewith he made Israel to sin, to provoke the LORD God of Israel to anger with their vanities.","27":"Now the rest of the acts of Omri which he did, and his might that he shewed, are they not written in the book of the chronicles of the kings of Israel?","28":"So Omri slept with his fathers, and was buried in Samaria: and Ahab his son reigned in his stead.","29":"And in the thirty and eighth year of Asa king of Judah began Ahab the son of Omri to reign over Israel: and Ahab the son of Omri reigned over Israel in Samaria twenty and two years.","30":"And Ahab the son of Omri did evil in the sight of the LORD above all that were before him.","31":"And it came to pass, as if it had been a light thing for him to walk in the sins of Jeroboam the son of Nebat, that he took to wife Jezebel the daughter of Ethbaal king of the Zidonians, and went and served Baal, and worshipped him.","32":"And he reared up an altar for Baal in the house of Baal, which he had built in Samaria.","33":"And Ahab made a grove; and Ahab did more to provoke the LORD God of Israel to anger than all the kings of Israel that were before him.","34":"In his days did Hiel the Bethelite build Jericho: he laid the foundation thereof in Abiram his firstborn, and set up the gates thereof in his youngest son Segub, according to the word of the LORD, which he spake by Joshua the son of Nun."}},"tsk":{"1":[{"kopje":"Jehu","refs":["1 Kon 16:7","2 Kron 19:2","2 Kron 20:34"]},{"kopje":"Hanani","refs":["1 Kon 15:33","2 Kron 16:7-10"]}],"2":[{"kopje":"Ik u uit het stof heb verheven","refs":["1 Kon 14:7","1 Sam 2:8","1 Sam 2:27","1 Sam 2:28","1 Sam 15:17-19","2 Sam 12:7-11","Ps 113:7","Ps 113:8","Luk 1:52"]},{"kopje":"gewandeld hebt","refs":["1 Kon 13:33","1 Kon 13:34","1 Kon 15:34"]},{"kopje":"Mijn volk Israël hebt doen zondigen","refs":["1 Kon 14:16","1 Kon 15:26","Ex 32:21","1 Sam 2:24","1 Sam 26:19","Matt 5:19"]}],"3":[{"kopje":"Ik zal uw huis maken","refs":["1 Kon 16:11","1 Kon 16:12","1 Kon 14:10","1 Kon 15:29","1 Kon 15:30","1 Kon 21:21-24","Jes 66:24","Jer 22:19"]}],"4":[{"kopje":"zullen de honden opeten","refs":["1 Kon 14:11"]}],"5":[{"kopje":"het overige","refs":["1 Kon 14:19","1 Kon 15:31","2 Kron 16:1-6"]}],"6":[{"kopje":"Baësa","refs":["1 Kon 14:20","1 Kon 15:25"]},{"kopje":"Thirza","refs":["1 Kon 14:17","1 Kon 15:21"]},{"kopje":"Ela","refs":["1 Kon 16:8","1 Kon 16:13","1 Kon 16:14"]}],"7":[{"kopje":"de dienst","refs":["1 Kon 16:1","1 Kon 16:2"]},{"kopje":"en tegen zijn huis","refs":["Ex 20:5"]},{"kopje":"Hem tot toorn verwekte","refs":["1 Kon 16:13"]},{"kopje":"door het werk","refs":["Ps 115:4","Jes 2:8","Jes 44:9-20"]},{"kopje":"omdat hij hem had verslagen","refs":["1 Kon 14:14","1 Kon 15:27-29","2 Kon 10:30","2 Kon 10:31","Jes 10:6 .","11":"And it came to pass, when he began to <span class=\"wl wl-kjv\" data-code=\"H4427\">reign,</span> as soon as he <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> on his <span class=\"wl wl-kjv\" data-code=\"H3678\">throne,</span> that he <span class=\"wl wl-kjv\" data-code=\"H5221\">slew</span> all the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H1201\">Baasha:</span> he <span class=\"wl wl-kjv\" data-code=\"H7604\">left</span> him not one that <span class=\"wl wl-kjv\" data-code=\"H8366\">pisseth</span> against a <span class=\"wl wl-kjv\" data-code=\"H7023\">wall,</span> neither of his <span class=\"wl wl-kjv\" data-code=\"H1350\">kinsfolks,</span> nor of his <span class=\"wl wl-kjv\" data-code=\"H7453\">friends.</span>","12":"Thus did <span class=\"wl wl-kjv\" data-code=\"H2174\">Zimri</span> <span class=\"wl wl-kjv\" data-code=\"H8045\">destroy</span> all the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H1201\">Baasha,</span> according to the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> which he <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> against <span class=\"wl wl-kjv\" data-code=\"H1201\">Baasha</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">by</span> <span class=\"wl wl-kjv\" data-code=\"H3058\">Jehu</span> the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet,</span>","13":"For all the <span class=\"wl wl-kjv\" data-code=\"H2403\">sins</span> of <span class=\"wl wl-kjv\" data-code=\"H1201\">Baasha,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2403\">sins</span> of <span class=\"wl wl-kjv\" data-code=\"H425\">Elah</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> by which they <span class=\"wl wl-kjv\" data-code=\"H2398\">sinned,</span> and by which they made <span class=\"wl wl-kjv\" data-code=\"H3478\"> :"Hanáni,","tekst":"Die mede te onderscheiden is van anderen, die denzelfden naam gehad hebben, 1Ch 25:4; Ezr 10:20."}],"2":[{"catchword":"uit het stof","tekst":"Dat is, uit een zeer lagen en geringen staat. Vergelijk 1Sa 2:8; Psa 113:7. Het woordje stof is dikwijls genomen voor laagheid, verachting, onvermogen, droefheid, nietigheid, Job 16:15; Psa 7:6, en Psa 119:25; Isa 26:5; Lam 3:16."},{"catchword":"gewandeld hebt","tekst":"Zie boven, 1Ki 15:26."},{"catchword":"doen zondigen,","tekst":"Zie boven, 1Ki 14:16."}],"3":[{"catchword":"zo zal Ik","tekst":"Anders, zo zal Ik doen branden achter Baesa en achter zijn huis."},{"catchword":"huis wegdoen;","tekst":"Dat is, geslacht; alzo in het volgende. Zie boven, 1Ki 14:10."}],"4":[{"catchword":"Die van Báësa","tekst":"Zie boven, 1Ki 14:11."}],"6":[{"catchword":"Thirza;","tekst":"Zie van deze stad boven, 1Ki 14:17."}],"7":[{"catchword":"Alzo geschiedde","tekst":"De zin is: Gelijk tevoren het woord des Heeren geschied was door den profeet Ahia tegen Jerobeam, boven, 1Ki 14:7 dat ook alzo hetzelfde geschied is door den profeet Jehu tegen Baesa en dat beide voorzeggingen elk op haar tijd vervuld zijn."},{"catchword":"den dienst","tekst":"Hebreeuws, door de hand; alzo onder, vs.1. Zie Lev 8:36."},{"catchword":"in de ogen","tekst":"Alzo onder, vs.19, 25, 30. Zie Gen 38:7, en boven, 1Ki 11:6."},{"catchword":"het werk","tekst":"Hetwelk meest tweeërlei was:&lt;i&gt;I.&lt;/i&gt; afgoderij, in welke hij Jerobeam was gelijk geweest;&lt;i&gt;II.&lt;/i&gt; moorddadigheid en tirannie tegen diens huis bedreven, gelijk de volgende woorden van vs.7 uitwijzen. Vergelijk Hos 1:4."},{"catchword":"hetzelve","tekst":"Te weten, het huis van Jerobeam."}],"8":[{"catchword":"twee jaren","tekst":"Versta, niet ten volle twee jaren; maar, tot in het tweede jaar. Want in het zes en twintigste jaar des konings Aza is hij koning geworden, gelijk in vs.8 gezegd is, en in het zeven en twintigste is hij omgebracht, onder, vs.10. Het is de gewoonste der Heilige Schrift, een effen getal te gebruiken voor een oneffen, en een volkomen voor een onvolkomen. Zie Gen 15:13; idem boven, 1Ki 7:15, en 1Ki 15:25, 1Ki 15:33, en vs.10, enz."}],"9":[{"catchword":"hofmeester","tekst":"Hebreeuws, die over het huis was; te weten, des konings. Versta daardoor, het gehele hofgezin. Die nu daarover gesteld is, wordt bij ons hofmeester genoemd. Vergelijk boven, 1Ki 4:6, en de aantekeningen daarop."}],"10":[{"catchword":"zeven en twintigste jaar","tekst":"Zie boven, vs.8."},{"catchword":"werd koning","tekst":"Te weten, den tijd van zeven dagen. Zie onder, vs.15."}],"11":[{"catchword":"troon zat,","tekst":"Op dezen te zitten, is als koning te regeren; welk woord hier ook tot verklaring voorgaat, gelijk boven, 1Ki 1:13. Zie voorts aldaar de aantekeningen."},{"catchword":"die mannelijk was,","tekst":"Zo boven, 1Ki 14:10."},{"catchword":"zijn bloedverwanten,","tekst":"Hebreeuws, zijn lossers; wien het toekwam de wraak des doodslags wettelijk te verzorgen, welke waren de naasten van den bloede; Num 35:12."},{"catchword":"zijn vrienden","tekst":"Dat is, zijn goede beminden en bekenden, ofschoon zij door maagschap hem niet bestonden."}],"13":[{"catchword":"zonden van Báësa,","tekst":"Op welke God gezien heeft, die aldus zijn gerechtige wraak uitvoerde, en niet Zimri, die alleen zijn ongerechtigen moedwil volgde, boven, vs.7. Vergelijk ook boven de aantekeningen op 1Ki 15:29."},{"catchword":"ijdelheden","tekst":"Dat is, afgoden, die gans niets zijn in de wereld; 1Co 8:4, en 1Co 10:19. Zie Lev 19:4."}],"14":[{"catchword":"in het boek","tekst":"Zie boven, 1Ki 14:19."}],"15":[{"catchword":"Gibbethon,","tekst":"Zie boven, 1Ki 15:27."}],"16":[{"catchword":"gelegerd had,","tekst":"Namelijk voor Gibbethon."},{"catchword":"een verbintenis","tekst":"Zie boven, 1Ki 15:27."},{"catchword":"Omri,","tekst":"De vader van Achab, met welken hij in het stuk van valsen godsdienst, ijdele bijgelovigheden en kwade werken gevoegd wordt, Mic 6:16, en wordt in dezen verklaard erger geweest te zijn dan al de koningen, die vóór hem geweest waren, onder, vs.25."}],"18":[{"catchword":"boven zich","tekst":"Dat is, het huis waarin hij was, verbrandde hij met zichzelven. Een gelijke manier van spreken is Jdg 12:1."}],"19":[{"catchword":"in de ogen","tekst":"Zie boven, 1Ki 11:6."},{"catchword":"wandelende","tekst":"Dat is, volgende de zonden van Jerobeam. Zie boven, 1Ki 15:26."},{"catchword":"zijn zonde,","tekst":"Zie boven, 1Ki 14:16."}],"20":[{"catchword":"verbintenis,","tekst":"Zie boven, 1Ki 15:27."},{"catchword":"gemaakt heeft,","tekst":"Hebreeuws, verbonden heeft."},{"catchword":"boek der kronieken","tekst":"Hieruit blijkt dat dit boek niet te verstaan is van de twee boeken der kronieken, die in den Bijbel achter de twee boeken der koningen volgen; gelijk aangetekend is boven, 1Ki 14:19; overmits in deze kronieken niet geschreven is hetgeen hier en onder, vs.27, verhaald wordt."}],"21":[{"catchword":"in twee helften;","tekst":"Hebreeuws, in de helft."},{"catchword":"volgde Tibni,","tekst":"Hebreeuws, was achter Tibni; alzo in het volgende. Zie boven, 1Ki 1:7."}],"23":[{"catchword":"twaalf jaren;","tekst":"Zijnde daaronder begrepen de vier jaren, die hij met Tibni geregeerd had, beginnende van het zeven en twintigste jaar des koninkrijks van Asa."}],"24":[{"catchword":"Samaria","tekst":"Hebreeuws, Schomeron. Is een berg, gelegen in den stam van Efraïm, omtrent de palen van den stam van Manasse; van welken de stad Samaria, daarop gebouwd, en het gehele omliggende landschap zijn naam gekregen heeft. Vergelijk boven, de aantekeninge op 1Ki 13:32."},{"catchword":"talenten zilvers,","tekst":"Zie van het gewicht eens talents, Exo 25:39."},{"catchword":"Semer,","tekst":"Onderscheiden van de anderen, die dezen naam gehad hebben, 1Ch 6:46, en 1Ch 7:34."},{"catchword":"Samaria","tekst":"Een stad, gebouwd op het voorgemelde gebergte; in welke de koningen Israëls, nadat zij Thirza verlaten hadden, hun hof en woning gehad hebben, meer dan twee honderd jaren eer Salmanasser deze stad ingenomen, het rijk Israëls uitgeroeid en de tien stammen gevankelijk in Assyrië vervoerd heeft, 2Ki 17:5, enz."}],"26":[{"catchword":"ijdelheden","tekst":"Zie boven, vs.13."}],"27":[{"catchword":"gepleegd heeft,","tekst":"Hebreeuws, gedaan heeft. Anders, waardoor hij het gedaan heeft."},{"catchword":"zijn die niet","tekst":"Zie boven, vs.20."}],"29":[{"catchword":"jaren","tekst":"Te weten, niet volkomen; want het eerste jaar heeft hij gemeen gehad met zijn vader, het laatste met zijn zoon. Zie boven, vs.8."}],"31":[{"catchword":"was het een lichte zaak,","tekst":"Dat is, was het een kleine en geringe zonde, dat hij de afgoderij en gruwelen van Jerobeam navolgde? versta, neen het, geenszins; maar het was [wil de Heilige Geest zeggen] een afgrijslijke afwijking van den waren God. Want deze manier van vragen brengt zeer sterke loochening mede. Zie Gen 18:17."},{"catchword":"Baäl,","tekst":"Zie Jdg 2:11."}],"32":[{"catchword":"huis van Baäl,","tekst":"Dat is, in den tempel; alzo 1Sa 5:2, en 1Sa 31:9-10; boven, 1Ki 12:31; 2Ki 10:21."}],"33":[{"catchword":"bos,","tekst":"Te weten, ter ere van den afgod Baäl. Zie Deu 7:5."},{"catchword":"nog meer deed,","tekst":"Hebreeuws, toedeed, of, toevoegde te doen. Zie Gen 8:10."}],"34":[{"catchword":"op Abiram,","tekst":"De zin is, dat hij de bouwing begonnen heeft met het verlies van zijn eerstgeboren zoon, en voleind met het verlies van zijn jongsten, waarmede vervuld werd de vervloeking van Jozua over de vijfhonderd jaren tegen den herbouwer dezer stad uitgesproken; Jos 6:26."},{"catchword":"den dienst van Jozua,","tekst":"Hebreeuws, door de hand. Vergelijk Lev 8:36, en de aantekeningen."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Then the word of the Lord came to Jebu [of this prophet we read also 2Ch 19:2 and 20.34 and he is to be distinguished from Jebu that was king of Israel below chapter 19.16 and from others that have likewise had this name 1Ch 2:38 &12.3] the son of Hanani // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;

    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
