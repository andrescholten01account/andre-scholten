],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"En Rehabeam ging naar Sichem, want het hele Israël was naar Sichem gekomen om hem koning te maken.","2":"Het gebeurde nu, toen Jerobeam, de zoon van Nebat, dit hoorde, terwijl hij nog in Egypte was (want hij was voor het aangezicht van koning Salomo gevlucht, en Jerobeam woonde in Egypte),","3":"dat zij heen zonden en hem lieten roepen; en Jerobeam en de hele gemeente van Israël kwamen en spraken tegen Rehabeam en zeiden:","4":"Uw vader heeft ons juk hard gemaakt; maak u dan nu de harde dienst van uw vader, en zijn zware juk, dat hij ons opgelegd heeft, lichter, en wij zullen u dienen.","5":"En hij zei tegen hen: Ga heen tot aan de derde dag, kom dan weer bij mij. En het volk ging heen.","6":"En koning Rehabeam hield raad met de oudsten, die voor het aangezicht van zijn vader Salomo gestaan hadden toen hij nog leefde, en zei: Hoe raadt u mij, dat men dit volk antwoorden zal?","7":"En zij spraken tegen hem en zeiden: Als u vandaag een knecht van dit volk wilt zijn, en hen dient, en hun antwoordt, en tot hen goede woorden spreekt, dan zullen zij voor altijd uw knechten zijn.","8":"Maar hij liet de raad van de oudsten varen, die zij hem gegeven hadden; en hij hield raad met de jongemannen, die met hem opgegroeid waren, die voor zijn aangezicht stonden.","9":"En hij zei tegen hen: Wat raadt u, dat wij dit volk antwoorden zullen, die tegen mij gesproken hebben en zeiden: Maak het juk, dat uw vader ons opgelegd heeft, lichter?","10":"En de jongemannen, die met hem opgegroeid waren, spraken tegen hem en zeiden: Zo moet u zeggen tegen dit volk, dat tegen u gesproken heeft en zei: Uw vader heeft ons juk zwaar gemaakt, maar maak u het over ons lichter; zo moet u tegen hen spreken: Mijn kleinste *vinger* zal dikker zijn dan de lenden van mijn vader.","11":"Als nu mijn vader een zwaar juk op u heeft laten leggen, dan zal ik nog meer bovenop uw juk doen; mijn vader heeft u met zwepen getuchtigd, maar ik zal u met schorpioenen tuchtigen.","12":"Zo kwam Jerobeam en het hele volk bij Rehabeam op de derde dag, zoals de koning gesproken had en gezegd: Kom weer bij mij op de derde dag.","13":"En de koning antwoordde het volk hard; want hij liet de raad van de oudsten varen, die zij hem gegeven hadden.","14":"En hij sprak tegen hen naar de raad van de jongemannen en zei: Mijn vader heeft uw juk zwaar gemaakt, maar ik zal nog meer bovenop uw juk doen; mijn vader heeft u met zwepen getuchtigd, maar ik zal u met schorpioenen tuchtigen.","15":"Zo hoorde de koning niet naar het volk; want deze ommekeer kwam van de HEERE, opdat Hij Zijn woord zou bevestigen, dat de HEERE door de dienst van Ahia, de Siloniet, gesproken had tot Jerobeam, de zoon van Nebat.","16":"Toen heel Israël zag dat de koning niet naar hen hoorde, gaf het volk de koning antwoord terug en zei: Wat deel hebben wij aan David? Ja, wij hebben geen erfdeel aan de zoon van Isaï; naar uw tenten, o Israël! Zie nu naar uw eigen huis om, o David! Zo ging Israël naar zijn tenten.","17":"Doch wat betreft de kinderen van Israël die in de steden van Juda woonden, over hen regeerde Rehabeam ook.","18":"Toen zond koning Rehabeam Adoram, die over de belastingheffing was; en heel Israël stenigde hem met stenen, zodat hij stierf; maar koning Rehabeam maakte zich haastig gereed om op een wagen te klimmen, om naar Jeruzalem te vluchten.","19":"Zo vielen de Israëlieten van het huis van David af, tot op deze dag.","20":"En het gebeurde, toen heel Israël hoorde dat Jerobeam teruggekomen was, dat zij heen zonden en hem in de vergadering riepen, en hem over heel Israël koning maakten; niemand volgde het huis van David, dan de stam van Juda alleen.","21":"Toen Rehabeam nu in Jeruzalem gekomen was, verzamelde hij het hele huis van Juda en de stam van Benjamin, honderdtachtigduizend uitgelezen mannen, geoefend ten oorlog, om tegen het huis van Israël te strijden, opdat hij het koninkrijk weer aan Rehabeam, de zoon van Salomo, zou brengen.","22":"Doch het woord van God kwam tot Semaja, de man van God, en zei:","23":"Zeg tegen Rehabeam, de zoon van Salomo, de koning van Juda, en tegen het hele huis van Juda en Benjamin, en de rest van het volk:","24":"Zo zegt de HEERE: U zult niet optrekken, noch strijden tegen uw broeders, de kinderen van Israël; ieder keert terug naar zijn huis, want deze zaak is van Mij gebeurd. En zij hoorden het woord van de HEERE, en keerden terug om weg te trekken naar het woord van de HEERE.","25":"Jerobeam nu bouwde Sichem op het gebergte van Efraïm, en woonde daarin, en trok van daar verder, en bouwde Penuël.","26":"En Jerobeam zei in zijn hart: Nu zal het koninkrijk weer naar het huis van David terugkeren.","27":"Als dit volk zal opgaan om offers te brengen in het huis van de HEERE te Jeruzalem, dan zal het hart van dit volk terugkeren naar hun heer, naar Rehabeam, de koning van Juda; ja, zij zullen mij doden, en terugkeren naar Rehabeam, de koning van Juda.","28":"Daarom hield de koning een raad, en maakte twee gouden kalveren; en hij zei tegen hen: Het is voor u teveel om naar Jeruzalem op te gaan; zie uw goden, o Israël, die u uit het land Egypte hebben opgevoerd.","29":"En hij zette het ene te Beth-el, en het andere plaatste hij te Dan.","30":"En deze zaak werd tot zonde; want het volk ging heen voor het ene, tot Dan toe.","31":"Hij maakte ook een huis der hoogten; en maakte priesters van de geringste mensen van het volk, die niet uit de zonen van Levi waren.","32":"En Jerobeam maakte een feest in de achtste maand, op de vijftiende dag van de maand, gelijk het feest dat in Juda was, en offerde op het altaar; op dezelfde manier deed hij te Beth-el, terwijl hij de kalveren offerde die hij gemaakt had; hij stelde ook te Beth-el priesters der hoogten aan, die hij gemaakt had.","33":"En hij offerde op het altaar, dat hij te Beth-el gemaakt had, op de vijftiende dag van de achtste maand, van de maand die hij uit zijn eigen hart bedacht had; zo maakte hij voor de kinderen van Israël een feest, en offerde op dat altaar, en bracht reukwerk."},"SV":{"1":"En Rehabeam toog naar Sichem, want het ganse Israël was te Sichem gekomen, om hem koning te maken.","2":"Het geschiedde nu, als Jerobeam, de zoon van Nebat, *dit* hoorde, daar hij nog in Egypte was ( want hij was van het aangezicht van den koning Salomo gevloden; en Jerobeam woonde in Egypte),","3":"Dat zij henen zonden, en lieten hem roepen; en Jerobeam en de ganse gemeente van Israël kwamen en spraken tot Rehabeam, zeggende:","4":"Uw vader heeft ons juk hard gemaakt; gij dan nu, maak uws vaders harden dienst, en zijn zwaar juk, dat hij ons opgelegd heeft, lichter, en wij zullen u dienen.","5":"En hij zeide tot hen: Gaat heen tot aan den derden dag, komt dan weder tot mij. En het volk ging heen.","6":"En de koning Rehabeam hield raad met de oudsten, die gestaan hadden voor het aangezicht van zijn vader Salomo, als hij leefde, zeggende: Hoe raadt gijlieden, dat men dit volk antwoorden zal?","7":"En zij spraken tot hem, zeggende: Indien gij heden knecht van dit volk wezen zult, en hen dienen, en hun antwoorden, en tot hen goede woorden spreken zult, zo zullen zij te allen dage uw knechten zijn.","8":"Maar hij verliet den raad der oudsten, dien zij hem geraden hadden; en hij hield raad met de jongelingen, die met hem opgewassen waren, die voor zijn aangezicht stonden.","9":"En hij zeide tot hen: Wat raadt gijlieden, dat wij dit volk antwoorden zullen, die tot mij gesproken hebben, zeggende: Maak het juk, dat uw vader ons opgelegd heeft, lichter.","10":"En de jongelingen, die met hem opgewassen waren, spraken tot hem, zeggende: Alzo zult gij zeggen tot dat volk, die tot u gesproken hebben, zeggende: Uw vader heeft ons juk zwaar gemaakt, maar maak gij het over ons lichter; alzo zult gij tot hen spreken: Mijn kleinste *vinger* zal dikker zijn dan mijns vaders lenden.","11":"Indien nu mijn vader een zwaar juk op u heeft doen laden, zo zal ik boven uw juk nog daartoe doen; mijn vader heeft u met geselen gekastijd, maar ik zal u met schorpioenen kastijden.","12":"Zo kwam Jerobeam en het ganse volk tot Rehabeam op den derden dag, gelijk als de koning gesproken had, zeggende: Komt weder tot mij op den derden dag.","13":"En de koning antwoordde het volk hardelijk; want hij verliet den raad der oudsten, dien zij hem geraden hadden.","14":"En hij sprak tot hen naar den raad der jongelingen, zeggende: Mijn vader heeft uw juk zwaar gemaakt, maar ik zal boven uw juk nog daartoe doen; mijn vader heeft u met geselen gekastijd, maar ik zal u met schorpioenen kastijden.","15":"Alzo hoorde de koning naar het volk niet; want deze omwending was van den HEERE, opdat Hij Zijn woord bevestigde, hetwelk de HEERE door den dienst van Ahia, den Siloniet, gesproken had tot Jerobeam, den zoon van Nebat.","16":"Toen gans Israël zag, dat de koning naar hen niet hoorde, zo gaf het volk den koning weder antwoord, zeggende: Wat deel hebben wij aan David? Ja, geen erve *hebben* *wij* aan den zoon van Isaï; naar uw tenten, o Israël! Voorzie nu uw huis, o David! Zo ging Israël naar zijn tenten.","17":"Doch aangaande de kinderen van Israël, die in de steden van Juda woonden, over die regeerde Rehabeam ook.","18":"Toen zond de koning Rehabeam Adoram, die over de schatting was; en het ganse Israël stenigde hem met stenen, dat hij stierf; maar de koning Rehabeam verkloekte zich om op een wagen te klimmen, dat hij naar Jeruzalem vluchtte.","19":"Alzo vielen de Israëlieten van het huis Davids af, tot op dezen dag.","20":"En het geschiedde, als gans Israël hoorde, dat Jerobeam wedergekomen was, dat zij henen zonden, en hem in de vergadering riepen, en hem over gans Israël koning maakten; niemand volgde het huis Davids, dan de stam van Juda alleen.","21":"Toen nu Rehabeam te Jeruzalem gekomen was, vergaderde hij het ganse huis van Juda en den stam van Benjamin, honderd en tachtig duizend uitgelezenen, geoefend ten oorlog, om tegen het huis Israëls te strijden, opdat hij het koninkrijk weder aan Rehabeam, den zoon van Salomo, bracht.","22":"Doch het woord van God geschiedde tot Semaja, den man Gods, zeggende:","23":"Zeg tot Rehabeam, den zoon van Salomo, den koning van Juda, en tot het ganse huis van Juda en Benjamin, en overige des volks, zeggende:","24":"Zo zegt de HEERE: Gij zult niet optrekken, noch strijden tegen uw broederen, de kinderen Israëls; een ieder kere weder tot zijn huis, want deze zaak is van Mij geschied. En zij hoorden het woord des HEEREN, en keerden weder, om weg te trekken naar het woord des HEEREN.","25":"Jerobeam nu bouwde Sichem op het gebergte van Efraïm, en woonde daarin, en toog van daar uit, en bouwde Penuël.","26":"En Jerobeam zeide in zijn hart: Nu zal het koninkrijk weder tot het huis van David keren.","27":"Zo dit volk opgaan zal om offeranden te doen in het huis des HEEREN te Jeruzalem, zo zal het hart dezes volks tot hun heer, tot Rehabeam, den koning van Juda, wederkeren; ja, zij zullen mij doden, en tot Rehabeam, den koning van Juda, wederkeren.","28":"Daarom hield de koning een raad, en maakte twee gouden kalveren; en hij zeide tot hen: Het is ulieden te veel om op te gaan naar Jeruzalem; zie uw goden, o Israël, die u uit Egypteland opgebracht hebben.","29":"En hij zette het ene te Beth-el, en het andere stelde hij te Dan.","30":"En deze zaak werd tot zonde; want het volk ging heen voor het ene, tot Dan toe.","31":"Hij maakte ook een huis der hoogten; en maakte priesteren van de geringsten des volks, die niet waren uit de zonen van Levi.","32":"En Jerobeam maakte een feest in de achtste maand, op den vijftienden dag der maand, gelijk het feest, dat in Juda was, en offerde op het altaar; van gelijken deed hij te Beth-el, offerende den kalveren, die hij gemaakt had; hij stelde ook te Beth-el priesteren der hoogten, die hij gemaakt had.","33":"En hij offerde op het altaar, dat hij te Beth-el gemaakt had, op den vijftienden dag der achtste maand, der maand, dewelke hij uit zijn hart verdacht had; zo maakte hij den kinderen Israëls een feest, en offerde op dat altaar, rokende."},"KJV":{"1":"And Rehoboam went to Shechem: for all Israel were come to Shechem to make him king.","2":"And it came to pass, when Jeroboam the son of Nebat, who was yet in Egypt, heard of it, (for he was fled from the presence of king Solomon, and Jeroboam dwelt in Egypt;)","3":"That they sent and called him. And Jeroboam and all the congregation of Israel came, and spake unto Rehoboam, saying,","4":"Thy father made ➔ our yoke grievous: now therefore make thou the grievous service of thy father, and his heavy yoke which he put upon us, lighter, and we will serve thee.","5":"And he said unto them, Depart yet for three days, then come again to me. And the people departed.","6":"And king Rehoboam consulted with the old men, that stood before Solomon his father while he yet lived, and said, How do ye advise that I may answer this people?","7":"And they spake unto him, saying, If thou wilt be a servant unto this people this day, and wilt serve them, and answer them, and speak good words to them, then they will be thy servants for ever.","8":"But he forsook the counsel of the old men, which they had given him, and consulted with the young men that were grown up with him, and which stood before him:","9":"And he said unto them, What counsel give ye that we may answer this people, who have spoken to me, saying, Make ➔ the yoke which thy father did put upon us lighter?","10":"And the young men that were grown up with him spake unto him, saying, Thus shalt thou speak unto this people that spake unto thee, saying, Thy father made ➔ our yoke heavy, but make thou it lighter unto us; thus shalt thou say unto them, My little finger shall be thicker than my father's loins.","11":"And now whereas my father did lade you with a heavy yoke, I will add to your yoke: my father hath chastised you with whips, but I will chastise you with scorpions.","12":"So Jeroboam and all the people came to Rehoboam the third day, as the king had appointed, saying, Come to me again the third day.","13":"And the king answered the people roughly, and forsook the old men's counsel that they gave him;","14":"And spake to them after the counsel of the young men, saying, My father made ➔ your yoke heavy, and I will add to your yoke: my father also chastised you with whips, but I will chastise you with scorpions.","15":"Wherefore the king hearkened not unto the people; for the cause was from the LORD, that he might perform his saying, which the LORD spake by Ahijah the Shilonite unto Jeroboam the son of Nebat.","16":"So when all Israel saw that the king hearkened not unto them, the people answered the king, saying, What portion have we in David? neither have we inheritance in the son of Jesse: to your tents, O Israel: now see to thine own house, David. So Israel departed unto their tents.","17":"But as for the children of Israel which dwelt in the cities of Judah, Rehoboam reigned over them.","18":"Then king Rehoboam sent Adoram, who was over the tribute; and all Israel stoned him with stones, that he died. Therefore king Rehoboam made speed to get him up to his chariot, to flee to Jerusalem.","19":"So Israel rebelled against the house of David unto this day.","20":"And it came to pass, when all Israel heard that Jeroboam was come again, that they sent and called him unto the congregation, and made him king over all Israel: there was none that followed the house of David, but the tribe of Judah only.","21":"And when Rehoboam was come to Jerusalem, he assembled all the house of Judah, with the tribe of Benjamin, an hundred and fourscore thousand chosen men, which were warriors, to fight against the house of Israel, to bring ➔ the kingdom again to Rehoboam the son of Solomon.","22":"But the word of God came unto Shemaiah the man of God, saying,","23":"Speak unto Rehoboam, the son of Solomon, king of Judah, and unto all the house of Judah and Benjamin, and to the remnant of the people, saying,","24":"Thus saith the LORD, Ye shall not go up, nor fight against your brethren the children of Israel: return every man to his house; for this thing is from me. They hearkened therefore to the word of the LORD, and returned to depart, according to the word of the LORD.","25":"Then Jeroboam built Shechem in mount Ephraim, and dwelt therein; and went out from thence, and built Penuel.","26":"And Jeroboam said in his heart, Now shall the kingdom return to the house of David:","27":"If this people go up to do sacrifice in the house of the LORD at Jerusalem, then shall the heart of this people turn again unto their lord, even unto Rehoboam king of Judah, and they shall kill me, and go again to Rehoboam king of Judah.","28":"Whereupon the king took counsel, and made two calves of gold, and said unto them, It is too much for you to go up to Jerusalem: behold thy gods, O Israel, which brought thee up out of the land of Egypt.","29":"And he set the one in Bethel, and the other put he in Dan.","30":"And this thing became a sin: for the people went to worship before the one, even unto Dan.","31":"And he made an house of high places, and made priests of the lowest of the people, which were not of the sons of Levi.","32":"And Jeroboam ordained a feast in the eighth month, on the fifteenth day of the month, like unto the feast that is in Judah, and he offered upon the altar. So did he in Bethel, sacrificing unto the calves that he had made: and he placed in Bethel the priests of the high places which he had made.","33":"So he offered upon the altar which he had made in Bethel the fifteenth day of the eighth month, even in the month which he had devised of his own heart; and ordained a feast unto the children of Israel: and he offered upon the altar, and burnt incense."}},"tsk":{"1":[{"kopje":"Rehabeam","refs":["1 Kon 11:43","2 Kron 10:1-19"]},{"kopje":"Sichem","refs":["Gen 12:6","Gen 33:18","Gen 33:19","Joz 20:7","Joz 24:1","Joz 24:32","Richt 9:1","Ps 60:8","Hand 7:16"]}],"2":[{"kopje":"Jerobeam, de zoon van Nebat","refs":["1 Kon 11:26-31","1 Kon 11:40","2 Kron 10:2","2 Kron 10:3"]}],"4":[{"kopje":"ons juk","refs":["1 Kon 4:7","1 Kon 4:20","1 Kon 4:22","1 Kon 4:23","1 Kon 4:25","1 Kon 9:15","1 Kon 9:22","1 Kon 9:23","1 Sam 8:11-18","2 Kron 10:4","2 Kron 10:5","Matt 11:29","Matt 11:30","Matt 23:4","1 Joh 5:3"]}],"6":[{"kopje":"hield raad","refs":["2 Sam 16:20","2 Sam 17:5","Job 12:12","Job 32:7","Spr 27:10","Jer 42:2-5","Jer 43:2"]}],"7":[{"kopje":"Als u vandaag","refs":["2 Kron 10:6","2 Kron 10:7","Spr 15:1","Mark 10:43","Mark 10:44","Fil 2:7-11"]},{"kopje":"goede woorden spreekt","refs":["1 Kon 12:13","2 Sam 15:3-6","Pred 10:4","Zach 1:13"]}],"10":[{"kopje":"Zo moet u","refs":["2 Sam 17:7-13"]},{"kopje":"Mijn kleinste vinger","refs":["2 Kron 10:10","2 Kron 10:11","Spr 10:14","Spr 18:6","Spr 18:7","Spr 28:25","Spr 29:23","Jes 47:6"]}] ass=\"wl wl-kjv\" data-code=\"H8085\">heard</span> of it, (for he was <span class=\"wl wl-kjv\" data-code=\"H1272\">fled</span> from the <span class=\"wl wl-kjv\" data-code=\"H6440\">presence</span> of <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon,</span> and <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt;)</span>","3":"That they <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> and <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> him. And <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam</span> and all the <span class=\"wl wl-kjv\" data-code=\"H6951\">congregation</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came,</span> and <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto <span class=\"wl wl-kjv\" data-code=\"H7346\">Rehoboam,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span>","4":"Thy <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H7185\">made</span> ➔ our <span class=\"wl wl-kjv\" data-code=\"H5923\">yoke</span> <span class=\"wl wl-kjv\" data-code=\"H7185\">grievous:</span> now therefore make thou the <span class=\"wl wl-kjv\" data-code=\"H7186\">grievous</span> <span class=\"wl wl-kjv\" data-code=\"H5656\">service</span> of thy <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> and his <span class=\"wl wl-kjv\" data-code=\"H3515\">heavy</span> <span class=\"wl wl-kjv\" data-code=\"H5923\">yoke</span> which he <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> upon us, <span class=\"wl wl-kjv\" data-code=\"H7043\">lighter,</span> and we will <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> thee.","5":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, <span class=\"wl wl-kjv\" data-code=\"H3212\">Depart</span> yet for <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days,</span> then come <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> to me. And the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">departed.</span>","6":"And <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H7346\">Rehoboam</span> <span class=\"wl wl-kjv\" data-code=\"H3289\">consulted</span> with the old <span class=\"wl wl-kjv\" data-code=\"H2205\">men,</span> that <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> while he yet <span class=\"wl wl-kjv\" data-code=\"H2416\">lived,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> How do ye <span class=\"wl wl-kjv\" data-code=\"H3289\">advise</span> that I <span class=\"wl wl-kjv\" data-code=\"H7725\">may</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">answer</span> this <span class=\"wl wl-kjv\" data-code=\"H5971\">people?</span>","7":"And they <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> If thou wilt be a <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> unto this <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> and wilt <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> them, and <span class=\"wl wl-kjv\" data-code=\"H6030\">answer</span> them, and <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> to them, then they will be thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> for <span class=\"wl wl-kjv\" data-code=\"H3117\">ever.</span>","8":"But he <span class=\"wl wl-kjv\" data-code=\"H5800\">forsook</span> the <span class=\"wl wl-kjv\" data-code=\"H6098\">counsel</span> of the old <span class=\"wl wl-kjv\" data-code=\"H2205\">men,</span> which they had <span class=\"wl wl-kjv\" data-code=\"H3289\">given</span> him, and <span class=\"wl wl-kjv\" data-code=\"H3289\">consulted</span> with the young <span class=\"wl wl-kjv\" data-code=\"H3206\">men</span> that were grown <span class=\"wl wl-kjv\" data-code=\"H1431\">up</span> with him, and which <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him:","9":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, What counsel <span class=\"wl wl-kjv\" data-code=\"H3289\">give</span> ye that we <span class=\"wl wl-kjv\" data-code=\"H7725\">may</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">answer</span> this <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> who have <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> to me, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H7043\">Make</span> ➔ the <span class=\"wl wl-kjv\" data-code=\"H5923\">yoke</span> which thy <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> did <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> upon us <span class=\"wl wl-kjv\" data-code=\"H7043\">lighter?</span>","10":"And the young <span class=\"wl wl-kjv\" data-code=\"H3206\">men</span> that were grown <span class=\"wl wl-kjv\" data-code=\"H1431\">up</span> with him <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Thus shalt thou <span class=\"wl wl-kjv\" data-code=\"H559\">speak</span> unto this <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto thee, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Thy <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H3513\">made</span> ➔ our <span class=\"wl wl-kjv\" data-code=\"H5923\">yoke</span> <span class=\"wl wl-kjv\" data-code=\"H3513\">heavy,</span> but make thou it <span class=\"wl wl-kjv\" data-code=\"H7043\">lighter</span> unto us; thus shalt thou <span class=\"wl wl-kjv\" data-code=\"H1696\">say</span> unto them, My <span class=\"wl wl-kjv\" data-code=\"H6995\">little</span> finger shall be <span class=\"wl wl-kjv\" data-code=\"H5666\">thicker</span> than my <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H4975\">loins.</span>","11":"And now whereas my <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> did <span class=\"wl wl-kjv\" data-code=\"H6006\">lade</span> you with a <span class=\"wl wl-kjv\" data-code=\"H3515\">heavy</span> <span class=\"wl wl-kjv\" data-code=\"H5923\">yoke,</span> I will <span class=\"wl wl-kjv\" data-code=\"H3254\">add</span> to your <span class=\"wl wl-kjv\" data-code=\"H5923\">yoke:</span> my <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> hath <span class=\"wl wl-kjv\" data-code=\"H3256\">chastised</span> you with <span class=\"wl wl-kjv\" data-code=\"H7752\">whips,</span> but I will <span class=\"wl wl-kjv\" data-code=\"H3256\">chastise</span> you with <span class=\"wl wl-kjv\" data-code=\"H6137\">scorpions.</span>","12":"So <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H7346\">Rehoboam</span> the <span class=\"wl wl-kjv\" data-code=\"H7992\">third</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> as the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> had <span class=\"wl wl-kjv\" data-code=\"H1696\">appointed,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Come to me <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> the <span class=\"wl wl-kjv\" data-code=\"H7992\">third</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day.</span>","13":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H7186\">roughly,</span> and <span class=\"wl wl-kjv\" data-code=\"H5800\">forsook</span> the old <span class=\"wl wl-kjv\" data-code=\"H2205\">men's</span> <span class=\"wl wl-kjv\" data-code=\"H6098\">counsel</span> that they <span class=\"wl wl-kjv\" data-code=\"H3289\">gave</span> him;","14":"And <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> to them after the <span class=\"wl wl-kjv\" data-code=\"H6098\">counsel</span> of the young <span class=\"wl wl-kjv\" data-code=\"H3206\">men,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> My <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H3513\">made</span> ➔ your <span class=\"wl wl-kjv\" data-code=\"H5923\">yoke</span> <span class=\"wl wl-kjv\" data-code=\"H3513\">heavy,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H3254\">add</span> to your <span class=\"wl wl-kjv\" data-code=\"H5923\">yoke:</span> my <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> also <span class=\"wl wl-kjv\" data-code=\"H3256\">chastised</span> you with <span class=\"wl wl-kjv\" data-code=\"H7752\">whips,</span> but I will <span class=\"wl wl-kjv\" data-code=\"H3256\">chastise</span> you with <span class=\"wl wl-kjv\" data-code=\"H6137\">scorpions.</span>","15":"Wherefore the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">hearkened</span> not unto the <span class=\"wl wl-kjv\" data-code=\"H5971\">people;</span> for the <span class=\"wl wl-kjv\" data-code=\"H5438\">cause</span> was from the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> that he might <span class=\"wl wl-kjv\" data-code=\"H6965\">perform</span> his <span class=\"wl wl-kjv\" data-code=\"H1697\">saying,</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">by</span> <span class=\"wl wl-kjv\" data-code=\"H281\">Ahijah</span> the <span class=\"wl wl-kjv\" data-code=\"H7888\">Shilonite</span> unto <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5028\">Nebat.</span>","16":"<span class=\"wl wl-kjv\" data-code=\"H7725\">So</span> when all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">hearkened</span> not unto them, the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">answered</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> What <span class=\"wl wl-kjv\" data-code=\"H2506\">portion</span> have we in <span class=\"wl wl-kjv\" data-code=\"H1732\">David?</span> neither have we <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance</span> in the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3448\">Jesse:</span> to your <span class=\"wl wl-kjv\" data-code=\"H168\">tents,</span> O <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> now <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> to thine own <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David.</span> So <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">departed</span> unto their <span class=\"wl wl-kjv\" data-code=\"H168\">tents.</span>","17":"But as for the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> which <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> <span class=\"wl wl-kjv\" data-code=\"H7346\">Rehoboam</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> over them.","18":"Then <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H7346\">Rehoboam</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H151\">Adoram,</span> who was over the <span class=\"wl wl-kjv\" data-code=\"H4522\">tribute;</span> and all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H7275\">stoned</span> him with <span class=\"wl wl-kjv\" data-code=\"H68\">stones,</span> that he <span class=\"wl wl-kjv\" data-code=\"H4191\">died.</span> Therefore <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H7346\">Rehoboam</span> made <span class=\"wl wl-kjv\" data-code=\"H553\">speed</span> to get him <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to his <span class=\"wl wl-kjv\" data-code=\"H4818\">chariot,</span> to <span class=\"wl wl-kjv\" data-code=\"H5127\">flee</span> to <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem.</span>","19":"So <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H6586\">rebelled</span> against the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> unto this <span class=\"wl wl-kjv\" data-code=\"H3117\">day.</span>","20":"And it came to pass, when all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> that <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam</span> was come <span class=\"wl wl-kjv\" data-code=\"H7725\">again,</span> that they <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> and <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> him unto the <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation,</span> and made him <span class=\"wl wl-kjv\" data-code=\"H4427\">king</span> over all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> there was none that <span class=\"wl wl-kjv\" data-code=\"H310\">followed</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> <span class=\"wl wl-kjv\" data-code=\"H2108\">but</span> the <span class=\"wl wl-kjv\" data-code=\"H7626\">tribe</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> only.","21":"And when <span class=\"wl wl-kjv\" data-code=\"H7346\">Rehoboam</span> was <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> he <span class=\"wl wl-kjv\" data-code=\"H6950\">assembled</span> all the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> with the <span class=\"wl wl-kjv\" data-code=\"H7626\">tribe</span> of <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin,</span> an <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> and <span class=\"wl wl-kjv\" data-code=\"H8084\">fourscore</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> chosen <span class=\"wl wl-kjv\" data-code=\"H977\">men,</span> which were <span class=\"wl wl-kjv\" data-code=\"H6213\">warriors,</span> to <span class=\"wl wl-kjv\" data-code=\"H3898\">fight</span> against the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> to <span class=\"wl wl-kjv\" data-code=\"H7725\">bring</span> ➔ the <span class=\"wl wl-kjv\" data-code=\"H4410\">kingdom</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> to <span class=\"wl wl-kjv\" data-code=\"H7346\">Rehoboam</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon.</span>","22":"But the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> came unto <span class=\"wl wl-kjv\" data-code=\"H8098\">Shemaiah</span> the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span>","23":"<span class=\"wl wl-kjv\" data-code=\"H559\">Speak</span> unto <span class=\"wl wl-kjv\" data-code=\"H7346\">Rehoboam,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon,</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and unto all the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> and <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H3499\">remnant</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span>","24":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> Ye shall not go <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> nor <span class=\"wl wl-kjv\" data-code=\"H3898\">fight</span> against your <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> to his <span class=\"wl wl-kjv\" data-code=\"H1004\">house;</span> for this <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> <span class=\"wl wl-kjv\" data-code=\"H1961\">is</span> from me. They <span class=\"wl wl-kjv\" data-code=\"H8085\">hearkened</span> therefore to the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">depart,</span> according to the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","25":"Then <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam</span> <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> <span class=\"wl wl-kjv\" data-code=\"H7927\">Shechem</span> in <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> therein; and went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> from thence, and <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> <span class=\"wl wl-kjv\" data-code=\"H6439\">Penuel.</span>","26":"And <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> in his <span class=\"wl wl-kjv\" data-code=\"H3820\">heart,</span> Now shall the <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdom</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> to the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David:</span>","27":"If this <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifice</span> in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> at <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> then shall the <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> of this <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> turn <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> unto their <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> even unto <span class=\"wl wl-kjv\" data-code=\"H7346\">Rehoboam</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H2026\">kill</span> me, and go <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> to <span class=\"wl wl-kjv\" data-code=\"H7346\">Rehoboam</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah.</span>","28":"Whereupon the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> took <span class=\"wl wl-kjv\" data-code=\"H3289\">counsel,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H5695\">calves</span> of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, It is too <span class=\"wl wl-kjv\" data-code=\"H7227\">much</span> for you to go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem:</span> behold thy <span class=\"wl wl-kjv\" data-code=\"H430\">gods,</span> O <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> which brought thee <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt.</span>","29":"And he <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> the <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> in <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel,</span> and the <span class=\"wl wl-kjv\" data-code=\"H259\">other</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> he in <span class=\"wl wl-kjv\" data-code=\"H1835\">Dan.</span>","30":"And this <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> became a <span class=\"wl wl-kjv\" data-code=\"H2403\">sin:</span> for the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> to worship <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H259\">one,</span> even unto <span class=\"wl wl-kjv\" data-code=\"H1835\">Dan.</span>","31":"And he <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> an <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of high <span class=\"wl wl-kjv\" data-code=\"H1116\">places,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> of the <span class=\"wl wl-kjv\" data-code=\"H7098\">lowest</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> which were not of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H3878\">Levi.</span>","32":"And <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">ordained</span> a <span class=\"wl wl-kjv\" data-code=\"H2282\">feast</span> in the <span class=\"wl wl-kjv\" data-code=\"H8066\">eighth</span> <span class=\"wl wl-kjv\" data-code=\"H2320\">month,</span> on the <span class=\"wl wl-kjv\" data-code=\"H2568\">fifteenth</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of the <span class=\"wl wl-kjv\" data-code=\"H2320\">month,</span> like unto the <span class=\"wl wl-kjv\" data-code=\"H2282\">feast</span> that is in <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and he <span class=\"wl wl-kjv\" data-code=\"H5927\">offered</span> upon the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar.</span> So <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> he in <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel,</span> <span class=\"wl wl-kjv\" data-code=\"H2076\">sacrificing</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5695\">calves</span> that he had <span class=\"wl wl-kjv\" data-code=\"H6213\">made:</span> and he <span class=\"wl wl-kjv\" data-code=\"H5975\">placed</span> in <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> of the high <span class=\"wl wl-kjv\" data-code=\"H1116\">places</span> which he had <span class=\"wl wl-kjv\" data-code=\"H6213\">made.</span>","33":"So he <span class=\"wl wl-kjv\" data-code=\"H5927\">offered</span> upon the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> which he had <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> in <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel</span> the <span class=\"wl wl-kjv\" data-code=\"H2568\">fifteenth</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of the <span class=\"wl wl-kjv\" data-code=\"H8066\">eighth</span> <span class=\"wl wl-kjv\" data-code=\"H2320\">month,</span> even in the <span class=\"wl wl-kjv\" data-code=\"H2320\">month</span> which he had <span class=\"wl wl-kjv\" data-code=\"H908\">devised</span> of his own <span class=\"wl wl-kjv\" data-code=\"H3820\">heart;</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">ordained</span> a <span class=\"wl wl-kjv\" data-code=\"H2282\">feast</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> and he <span class=\"wl wl-kjv\" data-code=\"H5927\">offered</span> upon the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar,</span> and burnt <span class=\"wl wl-kjv\" data-code=\"H6999\">incense.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Sichem,","tekst":"De naam ener stad gelegen in Efraïm, van welke zie breder Gen 12:6. In deze stad, als in het midden des lands, was de vergadering belegd, in welke men van de huldiging des nieuwen konings en van de zaken des rijks handelen zou."}],"2":[{"catchword":"want hij was van het aangezicht van den koning Sálomo gevloden;","tekst":"Zie boven, 1Ki 11:40."},{"catchword":"woonde in Egypte","tekst":"Te weten, wachtende bekwame gelegenheid om tot het koninkrijk, hem van God door den profeet Ahia toegezegd, boven, 1Ki 11:31, te geraken."}],"4":[{"catchword":"juk","tekst":"Dat is, de dienstbaarheid en den last der schatting, die hun Salomo opgelegd had. Zie boven, 1Ki 4:7, en 1Ki 5:13; alzo is het woord juk gebruikt in het volgende; idem Gen 27:40, en Lev 26:13."},{"catchword":"hard gemaakt;","tekst":"Hoewel Salomo de goederen zijns volks belast had met schattingen, tot onderhouding van zijn staat en hofgezin, boven, 1Ki 4:7, 1Ki 4:22, nochtans hadden zij geen oorzaak om dus te klagen, dewijl zij onder zijn regering, durende veertig jaren lang, 2Ch 9:30, nevens de ware religie, groten vrede en rijkdom genoten hadden, boven 1Ki 4:24-25, en 1Ki 10:27."},{"catchword":"maak","tekst":"Of, minder van den harden dienst uws vaders, enz."},{"catchword":"vaders harden dienst,","tekst":"Dat is, dien uw vader ons opgelegd heeft. Alzo, de last des konings, Hos 8:10, dat is, dien de koning oplegt."},{"catchword":"ons opgelegd heeft,","tekst":"Hebreeuws, op ons gegeven heeft; alzo vs.9."},{"catchword":"u dienen","tekst":"Dat is, uw onderzaten zijn, en u voor onzen koning aannemen, erkennen en u gehoorzamen. Dat heet onder, vs.7, knechten zijn."}],"6":[{"catchword":"oudsten,","tekst":"Dat is, met de raadsheren des rijks. Zie Gen 50:7."},{"catchword":"gestaan hadden","tekst":"Dat is, die hem met raad gediend hadden. Vergelijk onder, vs.8, en zie Deu 1:38, en boven, 1Ki 1:2."}],"7":[{"catchword":"knecht van dit volk wezen zult,","tekst":"Dat is, hen involgen zult, hun toestaande hetgeen zij met beleefdheid aan u verzoeken. Vergelijk hiermede 2Ch 10:7."},{"catchword":"goede woorden","tekst":"Dat is, aangename, vriendelijke en troostrijke redenen. Zie boven, 1Ki 1:42."},{"catchword":"knechten zijn","tekst":"Zie boven, vs.4."}],"8":[{"catchword":"jongelingen,","tekst":"Zie van het Hebreeuwse woord Gen 44:20."},{"catchword":"opgewassen waren,","tekst":"Of, opgevoed waren."},{"catchword":"die voor zijn aangezicht stonden","tekst":"Dat is, die in zijn dienst waren, gelijk boven, vs.6."}],"10":[{"catchword":"Mijn kleinste vinger","tekst":"Of, mijn kleinste [lid] enz. Een algemeen spreekwoord, waardoor te kennen gegeven wordt dat hij meerder geweld zou gebruiken om zijn volk te verdrukken, dan zijn vader gedaan had."}],"11":[{"catchword":"schorpioenen kastijden","tekst":"Dat is, met geselen, welke scherpe haken aanhebben om te steken en te doorwonden, gelijk de scorpioenen doen. Anderen verstaan geselen van egelentier of andere doornen gemaakt, waarbij de dienstbaarheid vergeleken wordt, waarmede de koning geraden wordt zijn volk te dreigen."}],"13":[{"catchword":"den raad der oudsten,","tekst":"Zie boven, vs.7."}],"14":[{"catchword":"raad der jongelingen,","tekst":"Zie boven, vs.10,11."}],"15":[{"catchword":"omwending","tekst":"Of, omgang, omkering; idem, oorzaak. De zin is hier dat deze geschiedenis, of handel, waardoor de staat des lands dus omkeerde en omgewend werd, geschiedde naar het beleid der voorzienigheid Gods, opdat Hij zijn straf, die Hij Salomo om zijn afwijking bedreigd had, uitvoeren zou, zonder nochtans dat God van der mensen doen enige besmetting heeft gekregen. Vergelijk onder, vs.24; idem Gen 45:5, Gen 45:7-8, en Gen 50:20; Exo 9:16; 2Sa 12:12; 2Ch 25:20."},{"catchword":"dienst van Ahia,","tekst":"Hebreeuws, hand. Zie Lev 8:36."}],"16":[{"catchword":"Wat deel hebben wij aan David?","tekst":"Vergelijk 2Sa 20:1. De zin is dat zij met het koninkrijk van David niet wilden te doen hebben, omdat zij, naar hun gevoelen, geen voordeel te verwachten hadden. Zij spreken vragenderwijze, om te sterker te loochenen. Zie Gen 18:17."},{"catchword":"uw tenten,","tekst":"Dat is, een iedere kere weder naar zijn huis en naar de zijnen."},{"catchword":"Voorzie nu uw huis,","tekst":"Dat is, dat hij zorg voor zichzelven drage, en niet voor ons, maar ons met vrede late."},{"catchword":"David","tekst":"Zij verstaan de nakomelingen Davids en die hem toegedaan waren; maar hebben hem genaamd, uit verachting, den zoon van Isaï."}],"17":[{"catchword":"de kinderen van Israël,","tekst":"Versta bij dezen den stam van Simeon, die voor een deel onder den stam van Juda vermengd was, de Levieten en een deel van den stam van Benjamin, die noordwaarts aan den stam van Juda gelegen was. Zie boven, 1Ki 11:32, en vergelijk onder, vs.23."}],"18":[{"catchword":"Adóram,","tekst":"Deze is die ook [naar eniger gevoelen] Adoniram genoemd werd, boven, 1Ki 4:6, en 1Ki 5:14, van wien daar gezegd wordt dat hij over des konings schatting was, gelijk ook hier van dezen; welk ambt degenen, die het bedienen, placht bij het volk hatelijk te maken; zodat het onvoorzichtigheid was, zulk een te zenden om de Israëlieten tot vrede te brengen."},{"catchword":"verkloekte","tekst":"Te weten, zich haastende om het gevaar te ontkomen."}],"19":[{"catchword":"vielen de Israëlieten","tekst":"Anders, alzo waren de Israëlieten wederspannig, of, rebel, of, trouweloos tegen het huis Davids. Zo wordt het oorspronkelijke woord in gelijke zaak gebruikt, 2Ki 1:1, en 2Ki 3:7, en 2Ki 8:22."}],"20":[{"catchword":"vergadering riepen,","tekst":"Te weten, die de oversten der stammen Israëls geleid hadden om te beraadslagen wat hun in deze verdeling der stammen en gelegenheid huns lands te doen stond. Vergelijk boven de aantekeningen vs.1."},{"catchword":"niemand","tekst":"Hebreeuws, niemand was achter het huis Davids."},{"catchword":"Juda alleen","tekst":"Zie boven, vs.17."}],"21":[{"catchword":"stam van Benjamin,","tekst":"Dat is, een deel van dien stam, want Bethel en andere steden waren met Jerobeam."},{"catchword":"geoefend ten oorlog,","tekst":"Hebreeuws, doende krijg, of oorlog; dat is, bekwaam om ten oorlog gebruikt te worden, of welbedreven in het stuk van den oorlog, of hanterende den oorlog. Alzo 2Ch 11:1, en 2Ch 26:13."},{"catchword":"huis Israëls","tekst":"Dat is, de tien stammen, die van Rehabeam en het huis van Juda afgeweken waren; boven, vs.16, en 2Ch 10:16."},{"catchword":"Rehábeam,","tekst":"Dat is, aan zichzelven. Zie boven, 1Ki 2:19."}],"22":[{"catchword":"Semája,","tekst":"Zie van dezen profeet ook 2Ch 12:5, 2Ch 12:15, en is te onderscheiden van twee valse profeten van dezen naam; de ene was de zoon van Delaja, Neh 6:10, de andere toegenaamd de Nehelamiet; Jer 29:31."}],"23":[{"catchword":"volks,","tekst":"Te weten, Israëls, dat in Juda en Benjamin was; 2Ch 11:3."}],"24":[{"catchword":"deze zaak","tekst":"Zie boven, vs.15."}],"25":[{"catchword":"Sichem","tekst":"Dat is, hij sterkte haar, en maakte haar vast. Zie van deze stad boven, vs.1."},{"catchword":"Penuël","tekst":"Een stad, gelegen over de Jordaan in den stam van Gad. Zie Gen 32:30."}],"26":[{"catchword":"zeide in zijn hart","tekst":"Dat is, dacht en oordeelde, alzo Psa 14:1, en Psa 36:2. In zijn hart zeggen is ook bij zichzelven voornemen en besluiten, Psa 74:8."}],"28":[{"catchword":"te veel","tekst":"Dat is, het zou u te moeilijk en te kostelijk vallen. Anders, het zij u genoeg, dat gij tot nog toe naar Jeruzalem getrokken zijt, om aldaar uw offeranden te brengen. Het is voortaan niet nodig, vindende de gelegenheid daartoe in uw eigen land. Vergelijk deze manier van spreken met Num 16:2-3."},{"catchword":"uw goden,","tekst":"Hij wist wel dat deze gouden kalveren geen goden waren, en dat de Israëlieten dat ook wel verstaan zouden; maar hij wilde dat zij den waren God door deze beelden zouden eren en dienen, tegen het uitgedrukte gebod des Heeren; Exo 20:4-5; Deu 4:14-17, enz. Zie dergelijke misdaad, Exo 32:4."}],"29":[{"catchword":"Beth-el,","tekst":"Dat is, aan beide de uiterste palen zijns koninkrijks; want Beth-el was in de zuidpale gelegen en Dan in de noordpale."}],"30":[{"catchword":"werd tot zonde;","tekst":"Te weten, der afgoderij, die met uitneming zonde genoemd wordt, omdat zij regelrecht gekant worden tegen de majesteit Gods. Hierom wordt dikwijls van Jerobeam gezegd dat hij Israël zondigen deed; 1Ki 16:19, enz. Zie ook 2Ki 21:16."},{"catchword":"voor het ene,","tekst":"Te weten, om dat aan te bidden en offerande te doen. En het schijnt hieruit dat het ene kalf eerst te Dan, en het andere daarna te Beth-el is opgericht geweest. Alzo het blijkt uit vs.32."}],"31":[{"catchword":"huis der hoogten;","tekst":"Dat is, een tempel op een verheven plaats, alwaar altaren opgericht waren, om afgoderij daarop te bedrijven."},{"catchword":"geringsten","tekst":"Hebreeuws, uit de einden, of uiterste delen des volks, dat is van de slechtsten en verachtsten des volks, en niet van de aanzienlijken. Of versta dit van beide soorten des volks; te weten, de hoge en de lage. Vergelijk deze manier van spreken met Gen 47:2, en zie de aantekeningen daarop."},{"catchword":"zonen van Levi","tekst":"Uit welke, en namelijk uit het geslacht Aärons, de priesters naar Gods instelling verkoren moesten worden."}],"32":[{"catchword":"een feest in de achtste maand,","tekst":"Namelijk een loofhuttenfeest, om hetgeen dat in Juda zo genoemd werd, na te bootsen ove chap. 4. 7. And 5. 13. So is the word yoak used in the following words: Item, Gen. 27. 40. And Lev. 26. 13.] hard: although Salomon had charged the goods and estates of his subjects with taxes for maintaining of his state and court, above chap. 4. 7. 22. Yet they had no cause to complain thus, for as much as they had under his government, (which lasted fourty years, 2 Chron. 9. 30.) enjoyed besides the true Religion, great peace and outward prosperity, as appeareth make thy fathers hard service, [i.e. which thy father hath laid upon us: so, the burden of the King, Hos. 8. 10. That is, which the King imposeth, or layeth upon] and his heavy yoak which he laid upon us, [Heb. Gave upon us, so v. 9] lighter, [or, lessen, diminish somewhat of thy fathers hard service, etc.] and we will serve thee. [i.e. be thy subjects, and accept of and acknowledge thee of our King, and obey thee. This is expressed below v. 7.] to be servants."}],"5":[{"catchword":null,"tekst":"And he said unto them: go your ways until the third day, then come to me again : and the people went their ways."}],"6":[{"catchword":null,"tekst":"And the King Rehabeam consulted with the eldest, [i.e. with the Counsellors of the Kingdom. See Gen. 50. On v. 7.] that had stood before the face of Solomon his Father, [i.e. that had served him with advice and counsel. Compare below v. 8. And see Deut. 1. On v. 38. And above chap. 1. On v. 2.] when he lived; saying; how do you advise, that we may answer this people?"}],"7":[{"catchword":null,"tekst":"And they spoke unto him saying ; If thou wilt be a servant unto this people this day, and wilt answer them, speak good words [i.e. acceptable, friendly, comfortable words. See above chap. 1. On v. 42.] unto them: then they will be thy servants [see ab. On v. 42.] unto them: then they will be thy servants [see ab. On v. 4.] at all days."}],"8":[{"catchword":null,"tekst":"But he forsook the counsel of the eldest, which they had counselled him, and he consulted with the young men, [See on the Hebrew word, Gen. 44. On v. 20.] that were grown up [or nourished] with him, which stood before his face. [i.e. which were in his service, as ab. V. 6.]"}],"9":[{"catchword":null,"tekst":"And he said unto them; what counsel give ye, that we may answer this people, who have spoken to me, saying, make the yeak which thy father laid upon us, lighter."}],"10":[{"catchword":null,"tekst":"And the young men that were grown up with him, spake unto him, saying: Thus shalt thou speak unto that people, that spake unto thee, saying; thy father made our yoak heavy; but make thou it lighter upon us: Thus shalt thou speak unto them; my least (finger) shall be thicker then my Fathers loins. [or, my least (joint) etc. A common proverb, whereby is intimated, that he would use more violence to oppress his people, then his Father had done.]"}],"11":[{"catchword":null,"tekst":"Now if my Father hath caused an heavy yoak to be laden upon you; then I will besides your yoak yet add thereunto: my Father hath chastised you with scourges, but I will chastise you with scorpions. [i.e. with scourges that have sharp hooks out them, to prick, and to wound thorough, as the scorpions do. Others understand scourges made of Eglantine or other thorns, whereunto bondage is compared, with which the King is counselled to threaten his people.]"}],"12":[{"catchword":null,"tekst":"So Jerobeam and all the people came to Rehabeam the third day, according as the King had spoken, saying; come to me again the third day."}],"13":[{"catchword":null,"tekst":"And the King answered the people hardly: for he forsook the counsel of the eldest, [See above v. 7.] which they had counselled him."}],"14":[{"catchword":null,"tekst":"And he spake to them after the counsel of the young men, [See above verse 10 and 11.] saying; my father made your yoak heavy, but I will besides your yoak yet add thereunto: my father chastised you with scourges, but I will chastise you with scorpions."}],"15":[{"catchword":null,"tekst":"So the King hearkened not unto the people: for this turning about [ Or, going about, revolution : item, cause] was from the LORD, that he might confirm his word, which the LORD had spoken by the ministry [Heb. Hand. See Lev. 8. On v. 36.] of Ahia the Silonite unto Jerobeam the son of Nebat. [the meaning here is, that this act, passage, or dealing, whereby the state and condition of the land thus wheeled and turned about, happened according to the dispose of Gods providence, that he might execute his judgement which he had threatened to Salomon for his back-filling, yet so as that God in no wise contracted any person from men&acirc;&euro;&trade;s sinful acts or doings. See below v. 24. Item, Gen. 45. 5, 7, 8. And 50. 20. Exod. 9. 16. 2 Sam. 12. 12. 2 Chron. 25. 20.]"}],"16":[{"catchword":null,"tekst":"When all Israel saw, that the King hearkened not unto them, then the people returned answer to the King hearkened not saying, what portion have we in David? [ Compare 2 Sam 20. 1. The meaning is, that they expected benefit or advantage by it. They speak by way of question, to deny it the stronger. See Gen. 18. On ver. 17. ] yea (we have) no inheritance in the son of Isai; to your tents, O Israel ; [i.e. let every man return to his own home, and to those that be his] now see to thine own house, [i.e. let him take care of himself, and not of us, but let him take care of himself, and not of us, but let us alone] O David: [they mean the posterity of David, and those that were addicted to him, but called him out of scorn and disdain, the son of Isai] so Israel departed to their tents."}],"17":[{"catchword":null,"tekst":"But as for the children of Israel, which dwelt in the Cities of Judah; [Understand by these, the tribes of Simeon, who were in part intermixed with the tribe of Judah, the Levites, and a part of the tribe of Benjamin, which lay by North-ward by the tribe of Judah. See above chap. 11. On v. 22. And compare below v. 23.] Rehabeam reigned also over  Vers. 16.] to bring the Kingdom again to Rehabeam the son of Salomon. [i.e. to himself. See above chap. 2. On v. 19.]"}],"22":[{"catchword":null,"tekst":"But the word of God came to Semaja the man of God, [See of this Prophet also, 2 Chron. 12, 5, 15. He is to be distinguished from two false Prophets of this name: the one was the son of Delaja, Nehem. 6. 10. The other was surnamed the Nehelamite, Jerem. 29. 31.] saying;"}],"23":[{"catchword":null,"tekst":"Speak unto Rehabeam the son of Salomon, the King of Juda, and to all the house of Judah and Benjamin; and in Judah and Benjamin, 2 Chron. 11. 3.] saying;"}],"24":[{"catchword":null,"tekst":"Thus saith the LORD, ye shall not march up, nor fight against your brethren the children of Israel; let every man return to his (own) house, for this thing is happened from me: [See above on ver. 15.] and they hearkened to the word of LORD, and returned to depart according to the word of the LORD."}],"25":[{"catchword":null,"tekst":"Now Jerebeam built Sichem [i.e. he strengthen and fenced it. See of the City above on v. 1.] on mount Ephraim, and dwelt therein, and went out from thence, and built Penuel. [ a City lying beyond Jordan in the tribe of God. See Gen. 32. 30.]"}],"26":[{"catchword":null,"tekst":"And Jerobeam said in his heart; [i.e. thought, conceived, imagined, judged: so Psal. 14. 2. And 36. 2. To say in his heart, is to purpose and conclude somewhat with himself, Psa. 74. V. 8.] now shall the Kingdom return to the house of David."}],"27":[{"catchword":null,"tekst":"If this people shall go up to make offerings in the house of the LORD at Jerusalem, then shall the heart of this people turn again unto their Lord, unto Rehabeam the King of Judah: yea they shall kill me, and turn again unto Rehebeam the King of Judah: yea they shall kill me, and turn again unto Rehabeam the King of Judah."}],"28":[{"catchword":null,"tekst":"Therefore the King held a counsel, et made two golden Calves: and he said unto them, it is too much for you to go up to Jerusalem, [i.e. it will be too troublesome, and too chargeable for you. Oth. Let it suffice you, that hitherto ye have gone up to Jerusalem, to bring your offerings thither. Henceforward it&acirc;&euro;&trade;s no more needful, seeing you have so fit an opportunity for it in your own land. Compare this phrase with Numb. 16. 2. 3.] Behold, thy Gods, O Israel, which brought thee up out of the land of Egypt. [ He knew well enough that these golden calves were no Gods, and that the Israelites would so conceive of them: But his meaning is, that they should honour and serve the true God by these images, contrary to the express command of God, Exod. 20. 4, 5. Deu. 4. 14, 15, 16, 17, etc. See the like offence, Exod. 32. 4.]"}],"29":[{"catchword":null,"tekst":"And he set the one at Bethel, and he put the other at Dan. [i.e. at both the uttermost borders of his Kingdom, for Bethel lay in the South-border, and Dan in the North-border.]"}],"30":[{"catchword":null,"tekst":"And this thing became sin: [viz. Of idolatry which is called sin, by way of eminency, because it is directly opposite against the Majesty of God. Hence it&acirc;&euro;&trade;s often said of Jerobeam, that he made Israel to sin, 1 Kings 16, 19. Etc. See also 2 Kings 21. On vers. 16.] for the people went before the one unto Dan. [viz. To worship it, and to offer sacrifice unto it. And it seemeth hence, that the one Calf was first set up at Dan, and the other afterward at Bethel, as appeareth by the following 32 verse.]"}],"31":[{"catchword":null,"tekst":"He made also an house of the high places; [i.e. a Temple on the exalted place; were altars were reared, to commit idolatry thereon] and made Priests of the meanest of the people, [Heb. Of the ends, or uttermost parts of the people, i.e. of the meanest and most contemptible sort of the people, and not of the worthiest and ablest. Or understand it of both sorts of people, both high and low. Compare this phrase with Gen. 47. 2. And see the a (function bouwHfdnav() {

    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

function linkifyRefs(html) {
