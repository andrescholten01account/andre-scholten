n het gebergte van Efraïm.","9":"De zoon van Deker in Makaz, en in Saalbim, en Beth-semes, en Elon-beth-hanan.","10":"De zoon van Hesed in Arubboth; hij had daarbij Socho en het hele land Hefer.","11":"De zoon van Abinadab had de hele landstreek van Dor; deze had Tafath, de dochter van Salomo, tot vrouw.","12":"Baäna, de zoon van Ahilud, had Taanach, en Megiddo, en heel Beth-sean, dat bij Zartana ligt, beneden Jizreël, van Beth-sean af tot Abel-mehola toe, tot aan de overkant van Jokmeam.","13":"De zoon van Geber was te Ramoth in Gilead; hij had de dorpen van Jaïr, de zoon van Manasse, die in Gilead zijn; ook had hij de streek van Argob, die in Basan is, zestig grote steden met muren en koperen grendels.","14":"Abinadab, de zoon van Iddo, was te Mahanaïm.","15":"Ahimaäz was in Nafthali; deze nam ook een dochter van Salomo, Basmath, tot vrouw.","16":"Baäna, de zoon van Husai, was in Aser en in Aloth.","17":"Josafath, de zoon van Paruah, in Issaschar.","18":"Simeï, de zoon van Ela, in Benjamin.","19":"Geber, de zoon van Uri, was in het land Gilead, het land van Sihon, de koning van de Amorieten, en van Og, de koning van Basan; en hij was de enige bestelmeester die in dat land was.","20":"Juda nu en Israël waren met velen, als het zand dat aan de zee in menigte is; zij aten, en dronken, en waren blij.","21":"En Salomo heerste over al de koninkrijken, van de rivier tot het land van de Filistijnen, en tot aan het gebied van Egypte; die brachten geschenken, en dienden Salomo al de dagen van zijn leven.","22":"Het voedsel nu van Salomo was voor één dag: dertig kor meelbloem, en zestig kor meel;","23":"Tien vette runderen, en twintig weiderunderen, en honderd schapen; niet meegerekend de herten, en reeën, en buffels, en gemeste vogels.","24":"Want hij had heerschappij over alles wat aan deze kant van de rivier was, van Thifsah tot aan Gaza toe, over alle koningen aan deze kant van de rivier; en hij had vrede van al zijn zijden rondom.","25":"En Juda en Israël woonden zeker, ieder onder zijn wijnstok en onder zijn vijgenboom, van Dan tot Ber-seba toe, al de dagen van Salomo.","26":"Salomo had ook veertigduizend paardenstallen voor zijn wagens, en twaalfduizend ruiters.","27":"Deze bestelmeesters nu, ieder in zijn maand, verzorgden de koning Salomo, en allen die aan de tafel van de koning Salomo kwamen; zij lieten niets ontbreken.","28":"De gerst nu en het stro voor de paarden, en voor de snelle kamelen, brachten zij naar de plaats waar hij was, ieder naar zijn taak.","29":"En God gaf Salomo wijsheid en zeer veel verstand, en een wijd begrip van hart, als het zand dat aan de oever van de zee is.","30":"En de wijsheid van Salomo was groter dan de wijsheid van allen uit het oosten, en dan alle wijsheid van de Egyptenaren;","31":"Ja, hij was wijzer dan alle mensen; dan Ethan, de Ezrahiet, en Heman, en Chalcol, en Darda, de zonen van Mahol; en zijn naam was bekend onder alle heidenvolken rondom.","32":"En hij sprak drieduizend spreuken; daarnaast waren zijn liederen duizend en vijf.","33":"Hij sprak ook over de bomen, van de cederboom af, die op de Libanon is, tot de hysop toe, die aan de muur uitgroeit; hij sprak ook over het vee, en over het gevogelte, en over de kruipende dieren, en over de vissen.","34":"En uit alle volken kwamen er mensen om de wijsheid van Salomo te horen, gestuurd door alle koningen van de aarde, die van zijn wijsheid gehoord hadden."},"SV":{"1":"Alzo was de koning Salomo koning over gans Israël.","2":"En deze waren de vorsten, die hij had: Azaria, de zoon van Zadok, was opperambtman.","3":"Elihoref, en Ahia, de zoon van Sisa, waren schrijvers; Josafat, de zoon van Ahilud, was kanselier.","4":"En Benaja, de zoon van Jojada, was over het heir; en Zadok en Abjathar waren priesters.","5":"En Azaria, de zoon van Nathan, was over de bestelmeesters; en Zabud, de zoon van Nathan, was overambtman, des konings vriend.","6":"En Ahisar was hofmeester; en Adoniram, de zoon van Abda, was over de schatting.","7":"En Salomo had twaalf bestelmeesters over gans Israël, die den koning en zijn huis verzorgden; voor elk was een maand in het jaar om te verzorgen.","8":"En dit zijn hun namen: de zoon van Hur was in het gebergte van Efraïm.","9":"De zoon van Deker in Makaz, en in Saalbim, en Beth-semes, en Elon-beth-hanan.","10":"De zoon van Hesed in Arubboth; hij had *daartoe* Socho en het ganse land Hefer.","11":"De zoon van Abinadab *had* de ganse landstreek van Dor; deze had Tafath, de dochter van Salomo, tot een vrouw.","12":"Baäna, de zoon van Ahilud, had Taanach, en Megiddo, en het ganse Beth-sean, hetwelk is bij Zartana, beneden van Jizreël, van Beth-sean aan tot Abel-mehola, tot op gene zijde van Jokmeam.","13":"De zoon van Geber was te Ramoth in Gilead; hij had de dorpen van Jaïr, den zoon van Manasse, die in Gilead zijn; *ook* had hij de streek van Argob, welke is in Basan, zestig grote steden, met muren en koperen grendelen.","14":"Abinadab, de zoon van Iddo, was te Mahanaim.","15":"Ahimaäz was in Nafthali; deze nam ook Salomo’s dochter, Basmath, ter vrouwe.","16":"Baäna, de zoon van Husai, was in Aser en in Aloth.","17":"Josafath, de zoon van Paruah, in Issaschar.","18":"Simeï, de zoon van Ela, in Benjamin.","19":"Geber, de zoon van Uri, was in het land Gilead, het land van Sihon, den koning der Amorieten, en van Og, den koning van Basan, en hij was de enige bestelmeester, die in dat land was.","20":"Juda *nu* en Israël waren velen, als zand, dat aan de zee is in menigte, etende, en drinkende, en blijde zijnde.","21":"En Salomo was heersende over al de koninkrijken, van de rivier *tot* het land der Filistijnen, en tot aan de landpale van Egypte; die brachten geschenken, en dienden Salomo al de dagen zijns levens.","22":"De spijze nu van Salomo was voor een dag, dertig kor meelbloem, en zestig kor meel;","23":"Tien vette runderen, en twintig weiderunderen, en honderd schapen; uitgenomen de herten, en reeën, en buffelen en gemeste vogelen.","24":"Want hij had heerschappij over al wat op deze zijde der rivier was van Thifsah tot aan Gaza, over alle koningen op deze zijde der rivier; en hij had vrede van al zijn zijden rondom.","25":"En Juda en Israël woonden zeker, een iegelijk onder zijn wijnstok en onder zijn vijgeboom, van Dan tot Ber-seba, al de dagen van Salomo.","26":"Salomo had ook veertig duizend paardenstallen tot zijn wagenen, en twaalf duizend ruiteren.","27":"Die bestelmeesters nu, een ieder op zijn maand, verzorgden den koning Salomo, en al degenen, die tot de tafel van den koning Salomo naderden; zij lieten geen ding ontbreken.","28":"De gerst nu en het stro voor de paarden, en voor de snelle kemelen, brachten zij aan de plaats, waar hij was, een iegelijk naar zijn last.","29":"En God gaf Salomo wijsheid en zeer veel verstand, en een wijd begrip des harten, gelijk zand, dat aan den oever der zee is.","30":"En de wijsheid van Salomo was groter dan de wijsheid van al die van het oosten, en dan alle wijsheid der Egyptenaren;","31":"Ja, hij was wijzer dan alle mensen; dan Ethan, de Ezrahiet, en Heman, en Chalcol, en Darda, de zonen van Mahol; en zijn naam was onder alle heidenen rondom.","32":"En hij sprak drie duizend spreuken; daartoe waren zijn liederen duizend en vijf.","33":"Hij sprak ook van de bomen, van den cederboom af, die op den Libanon is, tot op den hysop, die aan den wand uitwast; hij sprak ook van het vee, en van het gevogelte, en van de kruipende *dieren*, en van de vissen.","34":"En van alle volken kwamen er, om de wijsheid van Salomo te horen, van alle koningen der aarde, die van zijn wijsheid gehoord hadden."},"KJV":{"1":"So king Solomon was king over all Israel.","2":"And these were the princes which he had; Azariah the son of Zadok the priest,","3":"Elihoreph and Ahiah, the sons of Shisha, scribes; Jehoshaphat the son of Ahilud, the recorder.","4":"And Benaiah the son of Jehoiada was over the host: and Zadok and Abiathar were the priests:","5":"And Azariah the son of Nathan was over the officers: and Zabud the son of Nathan was principal officer, and the king's friend:","6":"And Ahishar was over the household: and Adoniram the son of Abda was over the tribute.","7":"And Solomon had twelve officers over all Israel, which provided victuals for the king and his household: each man his month in a year made provision.","8":"And these are their names: The son of Hur, in mount Ephraim:","9":"The son of Dekar, in Makaz, and in Shaalbim, and Bethshemesh, and Elonbethhanan:","10":"The son of Hesed, in Aruboth; to him pertained Sochoh, and all the land of Hepher:","11":"The son of Abinadab, in all the region of Dor; which had Taphath the daughter of Solomon to wife:","12":"Baana the son of Ahilud; to him pertained Taanach and Megiddo, and all Bethshean, which is by Zartanah beneath Jezreel, from Bethshean to Abelmeholah, even unto the place that is beyond Jokneam:","13":"The son of Geber, in Ramothgilead; to him pertained the towns of Jair the son of Manasseh, which are in Gilead; to him also pertained the region of Argob, which is in Bashan, threescore great cities with walls and brasen bars:","14":"Ahinadab the son of Iddo had Mahanaim:","15":"Ahimaaz was in Naphtali; he also took Basmath the daughter of Solomon to wife:","16":"Baanah the son of Hushai was in Asher and in Aloth:","17":"Jehoshaphat the son of Paruah, in Issachar:","18":"Shimei the son of Elah, in Benjamin:","19":"Geber the son of Uri was in the country of Gilead, in the country of Sihon king of the Amorites, and of Og king of Bashan; and he was the only officer which was in the land.","20":"Judah and Israel were many, as the sand which is by the sea in multitude, eating and drinking, and making merry.","21":"And Solomon reigned over all kingdoms from the river unto the land of the Philistines, and unto the border of Egypt: they brought presents, and served Solomon all the days of his life.","22":"And Solomon's provision for one day was thirty measures of fine flour, and threescore measures of meal,","23":"Ten fat oxen, and twenty oxen out of the pastures, and an hundred sheep, beside harts, and roebucks, and fallowdeer, and fatted fowl.","24":"For he had dominion over all the region on this side the river, from Tiphsah even to Azzah, over all the kings on this side the river: and he had peace on all sides round about him.","25":"And Judah and Israel dwelt safely, every man under his vine and under his fig tree, from Dan even to Beersheba, all the days of Solomon.","26":"And Solomon had forty thousand stalls of horses for his chariots, and twelve thousand horsemen.","27":"And those officers provided victual for king Solomon, and for all that came unto king Solomon's table, every man in his month: they lacked nothing.","28":"Barley also and straw for the horses and dromedaries brought they unto the place where the officers were, every man according to his charge.","29":"And God gave Solomon wisdom and understanding exceeding much, and largeness of heart, even as the sand that is on the sea shore.","30":"And Solomon's wisdom excelled the wisdom of all the children of the east country, and all the wisdom of Egypt.","31":"For he was wiser than all men; than Ethan the Ezrahite, and Heman, and Chalcol, and Darda, the sons of Mahol: and his fame was in all nations round about.","32":"And he spake three thousand proverbs: and his songs were a thousand and five.","33":"And he spake of trees, from the cedar tree that is in Lebanon even unto the hyssop that springeth out of the wall: he spake also of beasts, and of fowl, and of creeping things, and of fishes.","34":"And there came of all people to hear the wisdom of Solomon, from all kings of the earth, which had heard of his wisdom."}},"tsk":{"1":[{"kopje":"over heel Israël","refs":["1 Kon 11:13","1 Kon 11:35","1 Kon 11:36","1 Kon 12:19","1 Kon 12:20","2 Sam 5:5","1 Kron 12:38","2 Kron 9:30","Pred 1:12"]}],"2":[{"kopje":"de vorsten","refs":["Ex 18:21","2 Sam 8:15-18","2 Sam 20:23-26","1 Kor 12:28"]},{"kopje":"Azaria","refs":["1 Kron 6:8-10","1 Kr nd his family in divine things.]"}],"3":[{"catchword":null,"tekst":"Elihoreph, and Achia, the son of Sisa, were Scribes: [Or, Secretaries. See likewise of such Officers, 2 Sam.8.17. Esth.3.12.] Josaphat, the son of Achilud, was Chancellour. [Or, Register, Master of the Rolls, or, Recorder: see of this office, 2 Sam.8.16.]"}],"4":[{"catchword":null,"tekst":"And Benaja the son of Jojada was over the hast and Zadok and Abjathar [Who kept the name of Priest while he was alive, without the deed or actual Ministery: see above chap.on v.26,27.] were Priests."}],"5":[{"catchword":null,"tekst":"And Azaria, the son of Nathan, was over the Surveyors: [Heb. Appointers, or, appointed. Understand the twelve Officers hereafter named from the 7. verse to the 19. Who were appointed and ordained, every one in his moneth to furnish the King and his Household with a set quantity, or provision of meat and drink. The Hebrew word is elsewhere taken for a Kings Deputy, or, Lieutenant, who supplyeth the Kings place in the Government of the Land: below chap.22.48. Item, for any other Governour, or, commander, below chap 5.16. 2 Chron.8.10.] and Zabud, the son of Nathan, was principal Officer, [or, President, viz. in the Kings Privy Councel; for which cause he had daily access to the King, as his familiar and special friend. He is to be distinguished from the Supreme Officers, mentioned verse 2. Compare the annotate.] the Kings friend."}],"6":[{"catchword":null,"tekst":"And Ahisar was a steward; [Heb. Was over the house i.e. over all the Kings Court-Household, as the word house was so used above chap.2.ver.4. See gen.34.on ver.29.] and Adoniram, the son of Abda, was over the tribute, [i.e. over the Kings Moneyes, Treasures, yearly revenues, Tolls, Customes, Taxes, Tributes, &c. So that this Officer might well be called the Kings Receiver General, Cash-keeper, Treasurer, or Master of the Kings Treasure. Others understand here, him that is set over the Leavie of the chosen men, which were given to the King as a tribute to minister unto him: so below, chap.5.13, 14.]"}],"7":[{"catchword":null,"tekst":"And Salomon had twelve Purveyors over all Israel, which provided [viz. Meat and drink] for the King [i.e. for him] and his household: each man had a month in a year (allotted to him) to make provision."}],"8":[{"catchword":null,"tekst":"And these be their names the son of Hur [Oth. Ben-Hur; and so in these following verses] was in the mountain of Ephraim."}],"9":[{"catchword":null,"tekst":"The son of Deker in Makaz, and in Sarabbim [These Cities, and those which follow, are mostly in, the tribe of Dan: see Jos.19.41, 42,43.] and Beth-Semes; [called Ir-Semes, Jos.19.41.] and Elon-Beth-Hanan."}],"10":[{"catchword":null,"tekst":"The son of Hesed in Aruboth, [This was a part of the Land of Juda] he had (besides) Socho, [see of this City, Jos.15.35.] and all the land of Hepher, [see Jos.12.17.]"}],"11":[{"catchword":null,"tekst":"The son of Abinadab all the Region of Dor: [Which was in the tribe of Manasseh beyond Jordan, Jos.17.11. Judg.17.27.] this (man) had Taphath the Daughter of Salomon to wife."}],"12":[{"catchword":null,"tekst":"Baana the son of Achilud had Taanach, and Megiddo, and all Beth-Sean, [These belonged to the tribe of Manasseh, Jos.17.11.] which is by Zartana [see of other Zartans, Jos.3.16.] beneath Jizreel; [a city in Jos.17.11. & Judg.1.27] to Abel-Mehola; [see was in the tribe of Zebulon, Jos.19.12.]"}],"13":[{"catchword":null,"tekst":"The son of Geber was at Ranoth, [See Deut.4.43. & 1 King.22.20.] in Gilead: [see Geb.31.on ver.21.] he had the villages of Jair [see of these Num 32:41.] the son of Manasseh, which are in Gilead; he had also the is in Basan, threescore great cities, with walls, and copper bars."}],"14":[{"catchword":null,"tekst":"Abinadab the son of Iddo, was at Mahanaim. [See Gen.32.on v.2.]"}],"15":[{"catchword":null,"tekst":"Ahimaaz was in Naphtali: this man took also Basmath, the daughter of Salomon, to wise."}],"16":[{"cat (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
