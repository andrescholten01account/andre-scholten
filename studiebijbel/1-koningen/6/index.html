gmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Het gebeurde nu in het vierhonderdtachtigste jaar, na de uittocht van de kinderen van Israël uit Egypte, in het vierde jaar van het koninkrijk van Salomo over Israël, in de maand Ziv (dat is de tweede maand), dat hij het huis van de HEERE bouwde.","2":"En dat huis, dat de koning Salomo voor de HEERE bouwde, was zestig ellen in zijn lengte, en twintig in zijn breedte, en dertig ellen in zijn hoogte.","3":"En het voorhuis, vooraan de tempel van dat huis, was in zijn lengte twintig ellen, overeenkomstig de breedte van het huis, tien ellen in zijn breedte, vooraan het huis.","4":"En hij maakte vensters aan het huis met gesloten traliewerk.","5":"En rondom aan de wand van het huis bouwde hij kamers, aan de wanden van het huis rondom, zowel van de tempel als van het binnenste heiligdom¹. Zo maakte hij zijkamers rondom.","6":"De onderste kamer was vijf ellen breed, en de middelste zes ellen breed, en de derde zeven ellen breed; want hij had aan het huis rondom aan de buitenkant inkortingen gemaakt, zodat de balken niet in de wanden van het huis bevestigd hoefden te worden.","7":"Het huis nu werd, toen het gebouwd werd, gebouwd met volmaakte steen, zoals die aangevoerd was; zodat geen hamer, noch bijl, noch enig ijzeren gereedschap gehoord werd in het huis, toen het gebouwd werd.","8":"De deur van de middelste zijkamer was aan de rechterzijde van het huis; en door wenteltrappen ging men naar de middelste zijkamer, en van de middelste naar de derde.","9":"Zo bouwde hij het huis, en voltooide het; en bedekte dat huis met gewelven en rijen cederhout.","10":"Hij bouwde ook de kamers tegen het hele huis, vijf ellen hoog; en hij voegde ze vast aan dat huis met cederhout.","11":"Toen kwam het woord van de HEERE tot Salomo:","12":"Aangaande dit huis, dat u bouwt: als u wandelt in Mijn inzettingen, en Mijn rechten doet, en al Mijn geboden onderhoudt door erin te wandelen, dan zal Ik Mijn woord met u bevestigen, dat Ik tot uw vader David gesproken heb;","13":"En Ik zal in het midden van de kinderen van Israël wonen; en Ik zal Mijn volk Israël niet verlaten.","14":"Zo bouwde Salomo dat huis en voltooide het.","15":"Ook bouwde hij de wanden van het huis van binnen met cederen planken; van de vloer van het huis tot aan het dak van de wanden beschoot hij ze van binnen met hout; en bedekte de vloer van het huis met dennen planken.","16":"Daartoe bouwde hij twintig ellen met cederen planken aan de zijden van het huis, van de vloer af tot de wanden; dit bouwde hij Hem van binnen tot een binnenste heiligdom¹, tot het heilige der heiligen.","17":"Dat huis nu was veertig ellen, namelijk de tempel, die vooraan was.","18":"En het ceder aan het huis, van binnen, was gesneden met knoppen en open bloemen; het was allemaal ceder, geen steen werd gezien.","19":"En het binnenste heiligdom¹ bereidde hij van binnen in het huis, om de ark van het verbond van de HEERE daar te zetten.","20":"En het binnenste heiligdom¹ was vooraan twintig ellen in lengte, en twintig ellen in breedte, en twintig ellen in zijn hoogte, en hij overtrok het met gelouterd goud; ook overtrok hij het cederen altaar.","21":"En Salomo overtrok het huis van binnen met gelouterd goud; en hij trok voor het binnenste heiligdom¹ een voorhang door met gouden kettingen, en overtrok die met goud.","22":"Zo overtrok hij het hele huis met goud, totdat het hele huis voltooid was; daartoe overtrok hij met goud het hele altaar dat voor het binnenste heiligdom¹ was.","23":"In het binnenste heiligdom¹ nu maakte hij twee cherubs van olijfhout; de hoogte van elk was tien ellen.","24":"En vijf ellen was de ene vleugel van de cherub, en vijf ellen de andere vleugel van de cherub; van het einde van zijn ene vleugel tot aan het einde van zijn andere vleugel waren het tien ellen.","25":"Zo was de andere cherub ook tien ellen; beide cherubs hadden dezelfde maat en dezelfde vorm.","26":"De hoogte van de ene cherub was tien ellen, en zo ook van de andere cherub.","27":"En hij zette deze cherubs in het midden van het binnenste huis; en de cherubs spreidden hun vleugels uit, zodat de vleugel van de ene raakte aan deze wand, en de vleugel van de andere cherub raakte aan de andere wand; en hun vleugels raakten elkaar in het midden van het huis, vleugel aan vleugel.","28":"En hij overtrok deze cherubs met goud.","29":"En al de wanden van het huis, rondom, graveerde hij met uitgesneden graveringen van cherubs, en van palmbomen, en open bloemen, van binnen en van buiten.","30":"Daartoe overtrok hij de vloer van het huis met goud, van binnen en van buiten.","31":"En aan de ingang van het binnenste heiligdom¹ maakte hij deuren van olijfhout; de bovendorpel met de posten was een vijfde deel van de wand.","32":"De twee deuren waren ook van olijfhout; en hij graveerde daarop graveringen van cherubs, en van palmbomen, en van open bloemen, die hij met goud overtrok; ook trok hij goud over de cherubs en over de palmbomen.","33":"En zo maakte hij ook aan de deuren van de tempel posten van olijfhout, een vierde deel van de wand.","34":"En de twee deuren waren van dennenhout; de twee zijden van de ene deur konden opzij gezet worden; en zo konden de twee gegraveerde zijden van de andere deur ook opzij gezet worden.","35":"En hij graveerde ze met cherubs, en palmbomen, en open bloemen, die hij met goud overtrok, precies passend op het gesneden werk.","36":"Daarna bouwde hij het binnenste voorhof met drie rijen gehouwen stenen, en een rij cederen balken.","37":"In het vierde jaar werd de grond van het huis van de HEERE gelegd, in de maand Ziv;","38":"En in het elfde jaar, in de maand Bul, welke de achtste maand is, was dit huis voltooid, naar al zijn onderdelen en naar al zijn ontwerp; zo heeft hij er zeven jaar aan gebouwd."},"SV":{"1":"Het geschiedde nu in het vierhonderd en tachtigste jaar, na den uitgang der kinderen Israëls uit Egypte, in het vierde jaar van het koninkrijk van Salomo over Israël, in de maand Ziv ( deze is de tweede maand), dat hij het huis des HEEREN bouwde.","2":"En dat huis, hetwelk de koning Salomo den HEERE bouwde, was van zestig ellen in zijn lengte, en van twintig in zijn breedte, en van dertig ellen in zijn hoogte.","3":"En het voorhuis, vooraan den tempel van dat huis, was in zijn lengte van twintig ellen, naar de breedte van het huis, tien ellen in zijn breedte, vooraan het huis.","4":"En hij maakte vensteren aan het huis van gesloten uitzichten.","5":"En rondom aan den wand van het huis bouwde hij kameren, aan de wanden van het huis rondom, *beide* van den tempel en van de aanspraakplaats. Alzo maakte hij zijkameren rondom.","6":"De onderste kamer was van vijf ellen in haar breedte, en de middelste van zes ellen in haar breedte, en de derde van zeven ellen in haar breedte; want hij had aan het huis rondom buitenwaarts inkortingen gemaakt, opdat zij zich niet hielden in de wanden van het huis.","7":"Het huis nu, als het gebouwd werd, werd met volmaakten steen, zoals dezelve toegevoerd was, gebouwd; zodat geen hameren, noch bijl *of* enig ijzeren gereedschap gehoord werd in het huis, als het gebouwd werd.","8":"De deur der middelste zijkamer was aan de rechterzijde van het huis; en door wenteltrappen ging men tot de middelste *zijkamer*, en van de middelste tot de derde.","9":"Alzo bouwde hij het huis, en volmaakte het; en bedekte dat huis met gewelven en rijen van cederen.","10":"Hij bouwde ook de kameren aan het ganse huis, van vijf ellen in haar hoogte; en hij voegde ze vast aan dat huis met cederenhout.","11":"Toen geschiedde het woord des HEEREN tot Salomo, zeggende:","12":"Aangaande dit huis, dat gij bouwt, zo gij wandelt in Mijn inzettingen, en doet Mijn rechten, en onderhoudt al Mijn geboden, wandelende in dezelve; zo zal Ik Mijn woord met u bevestigen, dat Ik tot uw vader David gesproken heb;","13":"En Ik zal in het midden der kinderen Israëls wonen; en Ik zal Mijn volk Israël niet verlaten.","14":"Alzo bouwde Salomo dat huis en volmaakte hetzelve.","15":"Ook bouwde hij de wanden van het huis van binnen met cederen planken; van den vloer des huizes tot aan het dak der wanden, beschoot hij ze van binnen met hout; en overdekte den vloer van het huis met dennen planken.","16":"Daartoe bouwde hij twintig ellen met cederen planken aan de zijden van het huis, van den vloer af tot de wanden; dit bouwde hij Hem van binnen tot een aanspraakplaats, tot het heilige der heiligen.","17":"Dat huis nu was van veertig ellen, *namelijk* de tempel, die vooraan was.","18":"En het ceder aan het huis inwendig was gesneden met knoppen en open bloemen; het was al ceder, geen steen werd gezien.","19":"En de aanspraakplaats bereidde hij inwaarts in het huis, om de ark des verbonds des HEEREN daar te zetten.","20":"En de aanspraakplaats vooraan was van twintig ellen in lengte, en van twintig ellen in breedte, en van twintig ellen in haar hoogte, en hij overtoog ze met gesloten goud; ook overtoog hij het cederen altaar.","21":"En Salomo overtoog het huis van binnen met gesloten goud; en hij toog voor de aanspraakplaats *een* *voorhang* henen door met gouden ketenen, en overtoog dien met goud.","22":"Alzo overtoog hij het ganse huis met goud, totdat het ganse huis volmaakt was; daartoe overtoog hij met goud het gehele altaar, dat voor de aanspraakplaats was.","23":"In de aanspraakplaats nu maakte hij twee cherubs van olieachtig hout; elks hoogte was tien ellen.","24":"En van vijf ellen was de ene vleugel des cherubs, en van vijf ellen de andere vleugel des cherubs; van het einde van zijn enen vleugel, tot aan het einde van zijn anderen vleugel, waren tien ellen.","25":"Alzo was de andere cherub van tien ellen; beide cherubs hadden enerlei maat, en enerlei snede.","26":"De hoogte van den enen cherub was van tien ellen, en alzo van den anderen cherub.","27":"En hij zette deze cherubs in het midden van het binnenste huis; en de cherubs spreidden de vleugelen uit, zodat de vleugel des enen raakte aan dezen wand, en de vleugel des anderen cherubs raakte aan den anderen wand; en hun vleugelen naar het midden van het huis raakten vleugel aan vleugel.","28":"En hij overtoog deze cherubs met goud.","29":"En al de wanden van het huis, in het ronde, graveerde hij met uitgesneden graveringen van cherubs, en van palmbomen, en open bloemen, van binnen en van buiten.","30":"Daartoe overtoog hij den vloer van het huis met goud van binnen en van buiten.","31":"En aan den ingang der aanspraakplaats maakte hij deuren van olieachtig hout; de bovendorpel *met* de posten was het vijfde deel *des* *wands*.","32":"De twee deuren ook waren van olieachtige bomen; en hij graveerde daarop graveringen van cherubs, en van palmbomen, en van open bloemen, dewelke hij met goud overtoog; ook trok hij goud over de cherubs en over de palmbomen.","33":"En alzo maakte hij aan de deuren des tempels posten van olieachtige bomen, uit het vierde deel *van* *de* *wand*.","34":"En de twee deuren waren van dennenhout; de twee zijden der ene deur waren omdraaiende; alzo waren de twee gegraveerde *zijden* der andere deur omdraaiende.","35":"En hij graveerde ze met cherubs, en palmbomen, en open bloemen, dewelke hij met goud overtoog, gericht naar het uitgesnedene.","36":"Daarna bouwde hij het binnenste voorhof van drie rijen gehouwen stenen, en een rij cederen balken.","37":"In het vierde jaar werd de grond van het huis des HEEREN gelegd, in de maand Ziv;","38":"En in het elfde jaar, in de maand Bul, welke is de achtste maand, was dit huis volmaakt, naar al zijn stukken en naar al zijn behoren; alzo heeft hij zeven jaren daaraan gebouwd."},"KJV":{"1":"And it came to pass in the four hundred and eightieth year after the children of Israel were come out of the land of Egypt, in the fourth year of Solomon's reign over Israel, in the month Zif, which is the second month, that he began to build the house of the LORD.","2":"And the house which king Solomon built for the LORD, the length thereof was threescore cubits, and the breadth thereof twenty cubits, and the height thereof thirty cubits.","3":"And the porch before the temple of the house, twenty cubits was the length thereof, according to the breadth of the house; and ten cubits was the breadth thereof before the house.","4":"And for the house he made windows of narrow lights.","5":"And against the wall of the house he built chambers round about, against the walls of the house round about, both of the temple and of the oracle: and he made chambers round about:","6":"The nethermost chamber was five cubits broad, and the middle was six cubits broad, and the third was seven cubits broad: for without in the wall of the house he made narrowed rests round about, that the beams should not be fastened in the walls of the house.","7":"And the house, when it was in building, was built of stone made ready before it was brought thither: so that there was neither hammer nor axe nor any tool of iron heard in the house, while it was in building.","8":"The door for the middle chamber was in the right side of the house: and they went up with winding stairs into the middle chamber, and out of the middle into the third.","9":"So he built the house, and finished it; and covered the house with beams and boards of cedar.","10":"And then he built chambers against all the house, five cubits high: and they rested on the house with timber of cedar.","11":"And the word of the LORD came to Solomon, saying,","12":"Concerning this house which thou art in building, if thou wilt walk in my statutes, and execute my judgments, and keep all my commandments to walk in them; then will I perform my word with thee, which I spake unto David thy father:","13":"And I will dwell among the children of Israel, and will not forsake my people Israel.","14":"So Solomon built the house, and finished it.","15":"And he built the walls of the house within with boards of cedar, both the floor of the house, and the walls of the cieling: and he covered them on the inside with wood, and covered the floor of the house with planks of fir.","16":"And he built twenty cubits on the sides of the house, both the floor and the walls with boards of cedar: he even built them for it within, even for the oracle, even for the most holy place.","17":"And the house, that is, the temple before it, was forty cubits long.","18":"And the cedar of the house within was carved with knops and open flowers: all was cedar; there was no stone seen.","19":"And the oracle he prepared in the house within, to set there the ark of the covenant of the LORD.","20":"And the oracle in the forepart was twenty cubits in length, and twenty cubits in breadth, and twenty cubits in the height thereof: and he overlaid it with pure gold; and so covered the altar which was of cedar.","21":"So Solomon overlaid the house within with pure gold: and he made a partition by the chains of gold before the oracle; and he overlaid it with gold.","22":"And the whole house he overlaid with gold, until he had finished all the house: also the whole altar that was by the oracle he overlaid with gold.","23":"And within the oracle he made two cherubims of olive tree, each ten cubits high.","24":"And five cubits was the one wing of the cherub, and five cubits the other wing of the cherub: from the uttermost part of the one wing unto the uttermost part of the other were ten cubits.","25":"And the other cherub was ten cubits: both the cherubims were of one measure and one size.","26":"The height of the one cherub was ten cubits, and so was it of the other cherub.","27":"And he set the cherubims within the inner house: and they stretched forth the wings of the cherubims, so that the wing of the one touched the one wall, and the wing of the other cherub touched the other wall; and their wings touched one another in the midst of the house.","28":"And he overlaid the cherubims with gold.","29":"And he carved all the walls of the house round about with carved figures of cherubims and palm trees and open flowers, within and without.","30":"And the floor of the house he overlaid with gold, within and without.","31":"And for the entering of the oracle he made doors of olive tree: the lintel and side posts were a fifth part of the wall.","32":"The two doors also were of olive tree; and he carved upon them carvings of cherubims and palm trees and open flowers, and overlaid them with gold, and spread gold upon the cherubims, and upon the palm trees.","33":"So also made he for the door of the temple posts of olive tree, a fourth part of the wall.","34":"And the two doors were of fir tree: the two leaves of the one door were folding, and the two leaves of the other door were folding.","35":"And he carved thereon cherubims and palm trees and open flowers: and covered them with gold fitted upon the carved work.","36":"And he built the inner court with three rows of hewed stone, and a row of cedar beams.","37":"In the fourth year was the foundation ➔ of the house of the LORD laid, in the month Zif:","38":"And in the eleventh year, in the month Bul, which is the eighth month, was the house finished throughout all the parts thereof, and according to all the fashion of it. So was he seven years in building it."}},"tsk":{"1":[{"kopje":"Het gebeurde","refs":["Richt 11:26","2 Kron 3:1","2 Kron 3:2"]},{"kopje":"in de maand Ziv","refs":["1 Kon 6:37","Num 1:1"]},{"kopje":"bouwde","refs":["Hand 7:47"]},{"kopje":"bouwen","refs":["1 Kron 29:19","Zach 6:12","Zach 6:13","Zach 6:15","Joh 2:19-21","1 Kor 6:19","2 Kor 6:16","Ef 2:20-22","Kol 2:7","Hebr 9:11","Hebr 11:10","1 Petr 2:5"]}],"2":[{"kopje":"dat huis","refs":["Ezech 40:1","Ezech 41:26"]},{"kopje":"zestig","refs":["Ezra 6:3","Ezra 6:4","Ezech 41:1-15","Openb 21:16","Openb 21:17"]}],"4":[{"kopje":"vensters","refs":["1 Kon 6:4","Hoogl 2:9","Ezech 40:16","Ezech 41:26"]}],"5":[{"kopje":"bouwde","refs":["1 Kron 9:26","1 Kron 23:28","1 Kron 28:11","2 Kron 31:11","Neh 10:37","Neh 12:44","Neh 13:5-9","Hoogl 1:4","Jer 35:4","Ezech 40:44","Ezech 41:5-11","Ezech 42:3-12"]},{"kopje":"binnenste heiligdom","refs":["1 Kon 6:16","1 Kon 6:19-21","1 Kon 6:31","Ex 25:22","Lev 16:2","Num 7:89","2 Kron 4:20","2 Kron 5:7","2 Kron 5:9","Ps 28:2"]}],"6":[{"kopje":"inkortingen","refs":["1 Kon 6:6"]}],"7":[{"kopje":"gebouwd met volmaakte steen","refs":["1 Kon 5:17","1 Kon 5:18","Deut 27:5","Deut 27:6","Spr 24:27","Rom 9:23","2 Kor 5:5","Kol 1:12","1 Petr 2:5"]},{"kopje":"geen hamer","refs":["Jes 42:2","Hand 9:31","Jak 1:20","Jak 3:17","Jak 3:18"]}],"8":[{"kopje":"ging men","refs":["Ezech 41:6","Ezech 41:7"]}],"9":[{"kopje":"bouwde hij het huis","refs":["1 Kon 6:14","1 Kon 6:38"]}],"12":[{"kopje":"als u wandelt","refs":["1 Kon 2:3","1 Kon 2:4","1 Kon 3:14","1 Kon 8:25","1 Kon 9:3-6","1 Sam 12:14","1 Sam 12:15","1 Kron 28:9","2 Kron 7:17","2 Kron 7:18","Ps 132:12","Zach 3:7","Kol 1:23"]},{"kopje":"dan zal Ik Mijn woord bevestig s</span> <span class=\"wl wl-kjv\" data-code=\"H7341\">broad,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7992\">third</span> was <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H520\">cubits</span> <span class=\"wl wl-kjv\" data-code=\"H7341\">broad:</span> for without in the wall <span class=\"wl wl-kjv\" data-code=\"H2351\">of</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> he <span class=\"wl wl-kjv\" data-code=\"H5414\">made</span> narrowed <span class=\"wl wl-kjv\" data-code=\"H4052\">rests</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about,</span> that the beams should not be <span class=\"wl wl-kjv\" data-code=\"H270\">fastened</span> in the <span class=\"wl wl-kjv\" data-code=\"H7023\">walls</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house.</span>","7":"And the <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> when it was in <span class=\"wl wl-kjv\" data-code=\"H1129\">building,</span> was <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> of <span class=\"wl wl-kjv\" data-code=\"H68\">stone</span> made <span class=\"wl wl-kjv\" data-code=\"H8003\">ready</span> before it was <span class=\"wl wl-kjv\" data-code=\"H4551\">brought</span> thither: so that there was neither <span class=\"wl wl-kjv\" data-code=\"H4717\">hammer</span> nor <span class=\"wl wl-kjv\" data-code=\"H1631\">axe</span> nor any <span class=\"wl wl-kjv\" data-code=\"H3627\">tool</span> of <span class=\"wl wl-kjv\" data-code=\"H1270\">iron</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> while it was in <span class=\"wl wl-kjv\" data-code=\"H1129\">building.</span>","8":"The <span class=\"wl wl-kjv\" data-code=\"H6607\">door</span> for the <span class=\"wl wl-kjv\" data-code=\"H8484\">middle</span> <span class=\"wl wl-kjv\" data-code=\"H6763\">chamber</span> was in the <span class this <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> which thou art in <span class=\"wl wl-kjv\" data-code=\"H1129\">building,</span> if thou wilt <span class=\"wl wl-kjv\" data-code=\"H3212\">walk</span> in my <span class=\"wl wl-kjv\" data-code=\"H2708\">statutes,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">execute</span> my <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments,</span> and <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> all my <span class=\"wl wl-kjv\" data-code=\"H4687\">commandments</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">walk</span> in them; then will I <span class=\"wl wl-kjv\" data-code=\"H6965\">perform</span> my <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> with thee, which I <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> thy <span class=\"wl wl-kjv\" data-code=\"H1\">father:</span>","13":"And I will <span class=\"wl wl-kjv\" data-code=\"H7931\">dwell</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and will not <span class=\"wl wl-kjv\" data-code=\"H5800\">forsake</span> my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","14":"So <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and <span class=\"wl wl-kjv\" data-code=\"H3615\">finished</span> it.","15":"And he <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> the <span class=\"wl wl-kjv\" data-code=\"H7023\">walls</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">within</span> with <span class=\"wl wl-kjv\" data-code=\"H6763\" e=\"H3245\">foundation</span> ➔ of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H3245\">laid,</span> in the <span class=\"wl wl-kjv\" data-code=\"H3391\">month</span> <span class=\"wl wl-kjv\" data-code=\"H2099\">Zif:</span>","38":"And in the <span class=\"wl wl-kjv\" data-code=\"H259\">eleventh</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year,</span> in the <span class=\"wl wl-kjv\" data-code=\"H3391\">month</span> <span class=\"wl wl-kjv\" data-code=\"H945\">Bul,</span> which is the <span class=\"wl wl-kjv\" data-code=\"H8066\">eighth</span> <span class=\"wl wl-kjv\" data-code=\"H2320\">month,</span> was the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> <span class=\"wl wl-kjv\" data-code=\"H3615\">finished</span> throughout all the <span class=\"wl wl-kjv\" data-code=\"H1697\">parts</span> thereof, and according to all the <span class=\"wl wl-kjv\" data-code=\"H4941\">fashion</span> of it. So was he <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> in <span class=\"wl wl-kjv\" data-code=\"H1129\">building</span> it."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"in het vierhonderd en tachtigste jaar,","tekst":"Sommigen rekenen deze jaren aldus: onder Mozes in de woestijn zijn de kinderen Israëls geweest veertig jaren, onder Jozua zeventien, onder de richters 299, onder Eli, Samuel en Saul tachtig, onder David veertig. Deze tezamen gerekend, met vier jaren van het koninkrijk Salomo's, maken 480 jaren."},{"catchword":"Ziv","tekst":"Meest overeenkomende met onzen April, en ten dele met onzen Mei. Zie van deze maand ook onder vs.37; idem Num 1:1."},{"catchword":"de tweede maand","tekst":"Naar de ordinantie des Heeren, Exo 12:2."},{"catchword":"bouwde","tekst":"Dat is, begon te bouwen, alzo Gen 5:32. Zie hiervan breder onder vs.37,38; 2Ch 3:1."}],"2":[{"catchword":"ellen in zijn","tekst":"Te weten, heilige. Zie van deze maat, Gen 6:15."},{"catchword":"lengte,","tekst":"Deze strekt zich van het oosten tot het westen."},{"catchword":"breedte,","tekst":"Deze was van het zuiden tot het noorden."}],"3":[{"catchword":"het voorhuis,","tekst":"Versta niet hierdoor een ruimte voor aan den ingang van het heilige."},{"catchword":"naar de breedte van het huis,","tekst":"Dat is, dit voorhof is zo lang geweest, als het huis des Heeren of de tempel breed was. Vergelijk vs.2."},{"catchword":"breedte,","tekst":"Hier wordt maar gesproken van zijn lengte en breedte; maar 2Ch 3:4 vinden wij ook zijn hoogte, welke was van honderd twintig ellen."}],"4":[{"catchword":"gesloten uitzichten","tekst":"Dat is, die ten dele eng en als gesloten waren, tegen het inkijken en ongemak des weders, ten dele breed, en alzo bekwaam voor het vatten van den zonneschijn en het uitzicht. Aldus, naar eniger gevoelen, zijn de vensters in den muur, die zeer dik was, van buiten eng en van binnen wijd geweest. Anderen menen dat zij van buiten wijd en van binnen eng waren; anderen van buiten en van binnen wijd, doch allengskens van beide zijden nauw, ingaande tot het midden van den muur, alwaar zij met glas toegesloten waren, tegen het kwade weder. Anders, die men openen en sluiten Kon."}],"5":[{"catchword":"rondom","tekst":"Te weten, aan de zuid- en west- en noordzijden van het huis, doch niet aan de oostzijde, welke met het portaal bezet was."},{"catchword":"aan den wand","tekst":"Dat is, aan den muur des tempels; en dat alzo, dat de balken de kamers hier gemeld, niet waren gewrocht in den muur van den tempel, maar lagen op de neuten of balkstenen van denzelfden muur daar hij van buiten ingekort was. Deze inkorting geschiedde tot driemaal toe, telkens met het opbouwen van vijf ellen, en dan waren op die uitstekende neutstenen de balken der kamers, die van drie verdiepingen waren, gelegd en gepast."},{"catchword":"kameren,","tekst":"Hebreeuws, vloeren; dat is, kamergebouwen en vertrekken buiten aan den tempel ten gebruike der priesters, als zij hun ambt bedienen zouden, en om daarin op te sluiten de eerstelingen, de tienden, de priesterlijke klederen, de offeranden en andere dingen behorende tot den godsdienst enz. Zie 2Ki 11:2, en 1Ch 28:12, en Eze 42:13-14."},{"catchword":"van den tempel","tekst":"Versta het voorste deel van den tempel, anders genoemd het heilige, waarin de priesters dagelijks gingen om te roken en de lampen toe te maken."},{"catchword":"aanspraakplaats","tekst":"Of, Antwoordplaats. Het Hebreeuwse woord heeft zijn naam van aanspreken. Versta, de innerste plaats des tempels, anders genoemd het heilige der heiligen, vanwaar God zijn aanspraak en antwoord gaf. Vergelijk onder, vs.16, 20."},{"catchword":"zijkameren rondom","tekst":"Hebreeuws, ribben. Versta, dezelfde kamer, van welke in het begin van vs.5 gesproken is, of zekere gangen van galerijen, die vooraan langs de tweede en derde verdieping dezer kamers waren."}],"6":[{"catchword":"De onderste kamer","tekst":"Alzo de muur des tempels drie inkortingen had, de onderste, de middelste en de opperste, zo was de onderste verdieping der kamers een el nauwer dan de middelste, en de middelste weder zoveel nauwer dan de opperste."},{"catchword":"hij had aan het huis","tekst":"Hij had de dikte van den muur des tempels telkens een el gesmald, om op de neutstenen de balken der kamers te leggen. Deze smalling of inkorting was in de hoogte van den muur van vijf en tien en vijftien ellen."},{"catchword":"zich niet","tekst":"Te weten, de kamers."},{"catchword":"hielden","tekst":"Dat is, met hun balken in den muur des tempels niet ingelaten werden met doorboring en verbreking van denzelven. Vergelijk Eze 41:6."}],"7":[{"catchword":"volmaakten steen,","tekst":"Dat is, die tevoren tot het werk volkomenlijk bereid was, hetwelk ook van het hout is gezegd, boven, 1Ki 5:18."},{"catchword":"zoals dezelve toegevoerd was,","tekst":"Hebreeuws, der toevoering; dat is, met steen, zoals die daar aangevoerd kwam."}],"8":[{"catchword":"der middelste zijkamer","tekst":"Dat is, door welke men opging naar de middelste zijkamer."},{"catchword":"rechterzijde","tekst":"Hebreeuws, schouder. De rechterzijde des tempels in het uitgaan was het zuiden. Want de ingang des tempels stond in het oosten, en het allerheiligste in het westen."},{"catchword":"derde","tekst":"Te weten, zijkamers. Uit het getal van velen kan men hier verstaan dat elke verdieping verscheidene kamers en hoeken heeft gehad. Zie 2Ki 11:2."}],"9":[{"catchword":"bedekte","tekst":"Te weten, van binnen aan zijn dak."},{"catchword":"gewelven","tekst":"Hebreeuws, naar sommiger gevoelen, ruggen."},{"catchword":"rijen van cederen","tekst":"Hebreeuws, ordeningen in, of, met cederen; dat is, met ordelijke samenhechting van cederen balken, planken, of berderen."}],"10":[{"catchword":"hij voegde","tekst":"Dat is, hij legde ze en paste ze op de inkorting van den muur des tempels. Zie boven, vs.6."}],"12":[{"catchword":"inzettingen,","tekst":"Hoe deze drie woorden: inzettingen, rechten en geboden, onderscheiden worden, zie boven, 1Ki 2:3."}],"13":[{"catchword":"in het midden","tekst":"Zie Lev 26:12."}],"14":[{"catchword":"bouwde","tekst":"Dat is, hij ging in de bouwing des tempels voort, om dien van binnen te volmaken en te versieren."}],"15":[{"catchword":"bouwde hij","tekst":"Dat is, hij beschoot de wanden met cederen planken enz. alzo in vs.16."},{"catchword":"planken;","tekst":"Hebreeuws, zijden; en zo in het volgende."},{"catchword":"tot aan het dak","tekst":"Hebreeuws, tot aan de wanden van het dak; dat is, tot aan het opperste deel des muurs, waarop het dak rust."},{"catchword":"het huis","tekst":"Versta dit niet van het innerste deel des huizes, maar van het voorste, genaamd het heilige."}],"16":[{"catchword":"bouwde","tekst":"De zin is, dat hij den tussenmuur, waardoor het heilige van het allerheiligste onderscheiden werd, met cederen planken beschoten heeft."},{"catchword":"twintig ellen","tekst":"De lengte des tempels was zestig ellen, boven, vs.2, waarvan het voorste had veertig, en vervolgens het innerste twintig."},{"catchword":"van den vloer af","tekst":"Dat is, den gehelen vloer van den enen muur tot den anderen."},{"catchword":"Hem","tekst":"Namelijk, den Heere, van wien recht tevoren in vs.13 gesproken is."}],"17":[{"catchword":"tempel,","tekst":"Genaamd het heilige. Dit was dubbel zo lang als het heilige der heiligen, hetwelk maar twintig ellen in de lengte had, onder vs.20."}],"18":[{"catchword":"knoppen","tekst":"Anders, wilde kouwoerden, alzo onder, 1Ki 7:24."},{"catchword":"open bloemen;","tekst":"Hebreeuws, opening der bloem. Alzo in het volgende."}],"19":[{"catchword":"inwaarts","tekst":"Te weten, de plaats waar het allerheiligste was; in het uiterste van den tempel."},{"catchword":"het huis,","tekst":"Hebreeuws, in het midden van het huis. Het woordje huis betekent hier het gehele gesticht des tempels."}],"20":[{"catchword":"vooraan","tekst":"Dat is, welke, als iemand inging van het oosten naar het westen, voor hem lag in het einde van het heilige. Anders, de ruimte, [of, de aangezichten ] van de aanspraakplaats, was van, enz."},{"catchword":"twintig ellen in haar hoogte,","tekst":"Boven, vs.2, staat wel, van het gehele huis, dat het dertig ellen in zijn hoogte had, maar dewijl men van het eerste voorhof tot het tweede, en van het tweede tot het heilige, en van dit tot het allerheiligste met trappen moest opklimmen, gelijk men kan afnemen, Eze 40:6, zo is het geen wonder, dat de vloer enige ellen hoger, en nader aan het dak geweest is."},{"catchword":"met gesloten goud;","tekst":"Dat is, dicht fijn, rein. Zie 2Ch 3:4. Of, alzo genoemd [gelijk anderen menen] omdat het van David tot de timmering des tempels was opgesloten en bewaard geweest, 1Ch 29:3-4, waar het ook goud van Ofir genoemd wordt, hetwelk om zijn waardigheid altijd in grote achting geweest is, Job 22:24; maar het edelste en kostelijkste goud is in het algemeen ook zou genoemd geweest, omdat men dat zeer nauw pleegt op te sluiten, Job 28:15."},{"catchword":"cederen altaar","tekst":"Versta het reukaltaar, van hetwelk ook gesproken wordt onder, vs.22, en 1Ki 9:25. Dit heeft Salomo ook met goud overtogen, en wordt daarom genoemd het gouden altaar, onder 1Ki 7:48."}],"21":[{"catchword":"huis van binnen","tekst":"Versta, het heilige der heiligen; gelijk in het einde van vs.21 verklaard wordt."},{"catchword":"hij toog","tekst":"De zin is dat Salomo een voorhang heeft laten maken, welken hij langs henen aan het schutsel, hetwelk het heilige van het allerheiligste onderscheidde, heeft opgetogen, hangende aan gouden ketenen. Zie van den voorhang Exo 26:31-33."}],"22":[{"catchword":"gehele altaar,","tekst":"Zie boven, vs.20."}],"23":[{"catchword":"cherubs","tekst":"Zie Gen 3:24."},{"catchword":"olieachtig hout;","tekst":"De cherubim, die Mozes liet maken, waren van louter goud, Exo 25:18. Sommigen nu houden deze olieachtige bomen niet voor olijfbomen, maar voor andere bomen, die mede olie uitgeven, gelijk cederbomen en pijnbomen, enz., want de olijfbomen worden van de olieachtige onderscheiden, gelijk Neh 8:16."}],"24":[{"catchword":"van het einde van zijn enen vleugel,","tekst":"Hebreeuws, van de einden zijner vleugelen tot aan de einden zijner vleugelen."}],"25":[{"catchword":"snede","tekst":"Dat is, maaksel."}],"27":[{"catchword":"binnenste huis;","tekst":"Dat is, het heilige der heiligen; alzo wordt het heilige genoemd de tempel die vooraan was, boven vs.17."},{"catchword":"cherubs spreidden de vleugelen uit,","tekst":"De zin is, dat de twee cherubim, in het heilige der heiligen staande, elk met zijn enen vleugel raakte den wand, de een die aan de zuidzijde, de andere die aan de noordzijde was, en dat zij dan met hun andere vleugelen elkander raakten; zodat zij met dezelve de gehele breedte der plaats overreikten; want gelijk deze twintig ellen breed was, boven vs.20, alzo was elke vleugel vijf ellen lang, boven vs.24; vervolgens stonden beide de cherubim van elkander tien ellen, en elk van den wand zijner zijde vijf ellen, makende tezamen twintig ellen. Vergelijk 2Ch 3:11, enz."}],"29":[{"catchword":"van buiten","tekst":"Hierdoor verstaan sommigen den wand, die het allerheiligste van het heilige onderscheidde, welken hij versierd heeft, niet alleen van binnen aan de zijde, die in het allerheiligste was, maar ook van buiten aan de zijde, die in het heilige stond. Anderen verstaan het in het algemeen van de wanden, zo van het allerheiligste als van het heilige."}],"30":[{"catchword":"van binnen en van buiten","tekst":"Dat is, in het allerheiligste en in het heilige."}],"31":[{"catchword":"was","tekst":"Dat is, hij was zo breed en hoog als het vijfde deel des wands, te weten, vier ellen. Want de wand der aanspraakplaats was twintig ellen breed en hoog. Zie boven, vs.16. Anderen vertalen dit alzo, dat de bovendorpel en de posten van vijf hoeken, of leden waren."}],"32":[{"catchword":"ook trok hij","tekst":"Hierdoor kon het maaksel van het gegraveerde werk altijd gezien worden."}],"33":[{"catchword":"het vierde deel","tekst":"Want de posten [de deur mede gerekend zijnde] waren vijf ellen breed en hoog, hetwelk is het vierde deel van twintig. Andere verstaan dit alzo van de posten, dat zij vierhoekig of vierledig waren. Vergelijk boven, vs.31, en de aantekeningen."}],"34":[{"catchword":"dennenhout;","tekst":"Zie boven, 1Ki 5:8."}],"36":[{"catchword":"het binnenste voorhof","tekst":"Versta, het voorhof, dat naast den tempel was, en het voorhof der priesters genoemd wordt, 2Ch 4:9, omdat niemand dan zij en de Levieten daarin mocht komen, en omdat de priesters daarop het brandofferaltaar offeranden deden en den godsdienst waarnamen."}],"37":[{"catchword":"Ziv;","tekst":"Zie boven, vs.1."}],"38":[{"catchword":"welke is","tekst":"Deze maand komt overeen ten dele met onzen October, ten dele met onzen November."},{"catchword":"stukken","tekst":"Hebreeuws, dingen, of woorden; dat is, naar alles wat daarvan gezegd en geordineerd was."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Now it came to pass in the four hundred and fourscore year, [Some count these years thus; the children of Israel were fourty year under Moseh in the Wilderness, seventeen under Josua, and two hundred ninety nine under the Judges, eighty under Eli, Samuel and Saul, fourty under David. These being summed up together, with four years of Salomons Reign, make in all four hundred and eighty years] after the departure of the children of Israel out of Egypt, in the fourth year of Salomons reign over Israel [see 2 Chron.2.2.] in the month Zihu, [almost agreeing with our April, and partly with our May. See of this month also below v.37. Item, Numb.1.on v.1.] (this is the second month) [according to Gods appointment, Exo 12:2.] that he built [i.e. begun to build: so Gen 5:22. See hereof further below v.37.38. 2 Chron.3.1.] the house of the LORD. [see Act 7:47.]"}],"2":[{"catchword":null,"tekst":"And that house which King Solomon built unto the LORD, was threescore ells (or cubits) [viz. of the sanctuary. See of this measure, Gen.6.on ver.15.] in the length thereof, [this extended from the East to the West] and twenty in the breadth thereof, [this was from the South to the North] and of thirty ells in the height thereof."}],"3":[{"catchword":null,"tekst":"And the Porch before the Temple of that house, [See Jos.10.23. Act 3:11.and 5.12.] was twenty ells in the length thereof, according to the breadth of the house, [i.e. this porch was just as long as the LORDS house, or the Temple was broad. Compare the foregoing verse] ten ells in the breadth thereof, before the house. [here is only spoken of the length and breadth thereof: but 2 Chron.3.4. we find also the height thereof, which was of a hundred and twenty ells.]"}],"4":[{"catchword":null,"tekst":"And he made windows to the house of close lookings out. [i.e. which were partly narrow, and as it were shut against the looking in and inconveniency of the weather, partly broad, and so consequently sit to let in the sunbeams, and to look out. Thus according to the opinion of some, the windows in the wall, (which was very thick) were narrow without, and wide within. Others think that they were wide without, and narrow within: others, that they were wide both without and within, but by degrees narrow on both sides, entring to the middle of the wall, where they were shut close with glass, against foul weather. Oth. which might be opened and shut.]"}],"5":[{"catchword":null,"tekst":"And round about, [viz. on the South, West and North-side of the house, and not on the East-side, which was filled up with the entry or porch] at the wall of the house [i.e. at the wall of the Temple; and that so, as that the beames of the chambers here mentioned, were not wrought into the wall of the Temple, but lay upon the buttresses of the same wall, where it was narrowed from without. This narrowing happened three times at each, with the raising of it five ells or cubits, and then upon those sticking out were buttresses laid and sitted for the beams of the chambers, which were three stories high] he built chambers. [Heb. floors, i.e. chamber-buildings and with-drawings, rooms without the Temple for the Priests use, when they executed their office, and to look up in them the first fruits, tenths, Priest garments, offerings and other things appertaining to the service of God, &c. See 2 Kings 11.2. and 1 Chron.28.12. and Eze 42:13, 144.] against the walls of the house round about (both) of the Temple, [understand the foremost part of the Temple, otherwise called the holy place, into which the Priest daily entered to burn incense, and to dress the Lamps] and oracles-place: [or answering-place. The Hebrew word hath its name from communing, or speaking to. Understand the innermost place of the Temple, otherwise called the holy of holies, from whence God gave his oracle and answer. Compare below ver.16. and 20.] So he made side-chambers [Heb. ribs. Understand the same chambers, whereof was spoken in the beginning of this verse, or certain passages of galleries, which were before, all along the second and third story of these chambers] round about."}],"6":[{"catchword":null,"tekst":"The lowermost chamber was five ells in the breadth thereof, and the middlemost six ells in the breadth thereof, and the third seven ells in the breadth thereof: [The wall of the Temple having three narrowing&acirc;&euro;&trade;s, the lowermost, the middlemost and the uppermost, the lowermost story of the chambers was an ell narrower then the middlemost, and the middlemost was again so much narrower then the uppermost] for he had made narrowed rests round about at the house, [he each time had made the thickness of the wall an ell narrower, to lay the beams of the chambers without upon the rests. This narrowing or shortning was in the top of the wall of 5 and 10 and 15 ells] that they [viz. the chambers] should not be fastened in the walls of the house. [i.e. that they might not with their beams be fastned in the wall of the temple by boring thorough or breaking the wall. Compare Eze 41:6.]"}],"7":[{"catchword":null,"tekst":"Now the house when it was built with perfect stone, [i.e. which was before perfectly prepared and sitted for the work, which is likewise affirmed of the wood or timber, above chap.5.18.] as it was brought thither [Heb.or bringing thither, i.e. as it came (being brought) thither] so that no hammers, nor axe (or iron tool was heard in the house, when it was built."}],"8":[{"catchword":null,"tekst":"The door of the middlemost side-chamber, [i.e. thorough which they went up to the middlemost side-chamber] was on the right side of the house: [Hebr.shoulder, etc. The right side of the Temple as they went forth, was the south, for the entrance of the Temple stood in the Eats, and the most holy place in the West] and they went by winding stirs to the middlemost (side-chamber) and from the middlemost to the third. [viz. side-chambers. By the plural number here may be understood that every story had divers chambers and corners. See 2 Kings 11.2.]"}],"9":[{"catchword":null,"tekst":"So he built the house, and perfected it: and covered the house [viz. within on its roof] with arches, [Heb. according to the opinion of some, backs] and rowes of Cedars, [Hebr. orderings in, or with Cedars, i.e. with orderly fastening or joying together of Cedar-beams, planks or boards.]"}],"10":[{"catchword":null,"tekst":"He built also the chambers against all the house, five ells in the height thereof: and joined them fast to the house, [i.e. he joined and sitted them on the narrowings of the wall of the Temple. See ab.v.6.] with Cedar-wood."}],"11":[{"catchword":null,"tekst":"Then came the word of the LORD unto Salomon, saying;"}],"12":[{"catchword":null,"tekst":"Concerning this house that thou buildest, if thou walkest in my statutes, and executes my judgements, and keepest all my commandments, [How these three words, statutes, judgements, and commandments are distinguished, see above chap.2.on v.3.] walking in the same: then will I confirm my word with thee, which I spake unto David thy Fathers. [see 1 Kings 2.4. and 9.4. 2 Sam.7.13. 1 Chron.22.10, 19.]"}],"13":[{"catchword":null,"tekst":"And I will dwell in the midst of the children of Israel: [See Lev.26.on v.12.] and I will forsake my people of Israel."}],"14":[{"catchword":null,"tekst":"So Solomon built that house, [i.e. he went on in the building of the Temple, to perfect and adorn the same within] and finished it."}],"15":[{"catchword":null,"tekst":"He also built the walls of the house within with Cedar-planks; [Heb. sides, and so in the following verse, i.e. he covered the walls with Cedar-planks, etc. so in the following word] from the floor of the house to the roof of the walls, [Heb. to the walls of the roof; i.e. to the uppermost part of the wall, on which the rooftesteth] he covered it within with wood: and covered over the floor of the house [understand this not of the innermost part of the house, but of the fore most, called the holy place] with planks of fir."}],"16":[{"catchword":null,"tekst":"Besides he built twenty ells [The length of the Temple was threescore ells, above v.2. whereof the foremost part had forty, and consequently the innermost twenty] with planks of Cedar, on the sides of the house, [the meaning is, that he covered the partition-wall (whereby the holy place was distinguished or divided from the holy of holies) with planks Cedar] from the floor to the walls: [i.e. the whole floor from one wall to another] he built this for him [viz. for the Lord, of whom was spoken immediately before ver.13.] within for an oracles-place for the holy of holies."}],"17":[{"catchword":null,"tekst":"Now that house was fourty ells; (namely) the Temple, [Called, the holy place. This was as long again as the holy of holies, which had but twenty ells in length below v.20.] that was before it."}],"18":[{"catchword":null,"tekst":"And the Cedar on the house within was carved with knops, [Others, wild gourds, so below chap.7.24.] and open flowers: [Heb. opening of flowers. So in the sequel] it was all Cedar, (there) was no stone seen."}],"19":[{"catchword":null,"tekst":"And the Oracles-place he prepared in the house [Heb. in the midst of the house. The word house signifieth here the whole fabric or building of the Temple] within [viz. the place where the holy of holies was in the outermost part of the Temple] to set there the Ark of the covenant of the LORD."}],"20":[{"catchword":null,"tekst":"And the Oracles-place in the forepart [i.e. which as a man entered in from the East to the West, lay before him in the end of the holy place. Oth. the space, (or the faces) of the Oracles-place] was twenty ells in length, and twenty ells in breadth, and twenty ells in the height thereof, [indeed above v.2. is mentioned concerning the whole house that it was thirty ells high: but seeing they were to go up by steps o without on the side, which stood in the holy place. Others understand it of the walls in general both of the most holy and holy place.]"}],"30":[{"catchword":null,"tekst":"He also overlaid the floor of the house with gold within and without. [i.e. in the most holy and in the holy place.]"}],"31":[{"catchword":null,"tekst":"And at the entering of the Oracles-place he made doors of oily wood; the lintel, (with) the posts was the fifth part (of the wall). [i.e. it was as broad and high, as the fifth part of the wall; to wit, four ells: for the wall of the Oracles-place was twenty ells broad and high. See above v.16. Others interpret this thus, that the lintel and post were five square, or five-cornered.]"}],"32":[{"catchword":null,"tekst":"The two doors also were of oil-trees, and he carved upon them carvings of Cherubims, and of Palm-trees, and of open flowers, which he overlaid with gold: he also spread gold upon the Cherubims, and upon the Palm-trees. [Hereby the making might ever be discerned from the carved work.]"}],"33":[{"catchword":null,"tekst":"And he also made at the door of the Temple posts of oily trees: out of the fourth part (of the wall). [For the posts (the door being also counted) were five ells broad, and high, which is the fourth part of twenty. Others understand this of the posts, that they were foursquare, or four-cornered. Compare above the 31 verse with the annotat.]"}],"34":[{"catchword":null,"tekst":"And the two doors were of fir-wood, [See above chap.5.on v.8.] the two sides of the one door were turning about, so the two carved (sides) of the other door were turning about."}],"35":[{"catchword":null,"tekst":"And he carved them with Cherubims, and Palm-trees, and open flowers; which he overlaid with gold; sited to the carved work."}],"36":[{"catchword":null,"tekst":"Then he built the innermost Court [Meaning the Court that was next to the Temple, and was called the Priests court, 2 Chron.4.9. because none but they and the Levites might enter // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {
  const noten = D.noten || {};

  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte

function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {

        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
