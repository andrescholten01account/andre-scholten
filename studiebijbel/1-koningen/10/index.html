de HEERE, toen was er in haar geen geest meer.","6":"En zij zei tegen de koning: Het woord is waarheid geweest, dat ik in mijn land gehoord heb, over uw zaken en over uw wijsheid.","7":"Ik heb die woorden niet geloofd, totdat ik gekomen ben, en mijn ogen het gezien hebben; en zie, de helft is mij niet verteld; u hebt met wijsheid en welvaart het gerucht overtroffen dat ik gehoord heb.","8":"Gelukkig zijn uw mannen, gelukkig deze knechten van u, die voortdurend voor uw aangezicht staan, die uw wijsheid horen!","9":"Geloofd zij de HEERE, uw God, Die behagen in u heeft gehad, om u op de troon van Israël te zetten! Omdat de HEERE Israël in eeuwigheid liefheeft, daarom heeft Hij u tot koning gesteld, om recht en gerechtigheid te doen.","10":"En zij gaf de koning honderdtwintig talenten goud, en zeer veel specerijen, en kostbaar gesteente; zoveel specerijen als de koningin van Scheba de koning Salomo gaf, is er nooit meer in zulke hoeveelheid gekomen.","11":"Verder brachten ook de schepen van Hiram, die goud uit Ofir haalden, uit Ofir zeer veel almuggimhout en kostbaar gesteente.","12":"En de koning maakte van dit almuggimhout steunsels voor het huis van de HEERE, en voor het huis van de koning, alsook harpen en luiten voor de zangers. Zulk almuggimhout was niet eerder gekomen, en ook niet gezien, tot op deze dag.","13":"En de koning Salomo gaf de koningin van Scheba alles wat zij begeerde, wat zij ook vroeg; naast wat hij haar gaf naar het vermogen van de koning Salomo. Zo keerde zij terug en ging naar haar land, zij en haar knechten.","14":"Het gewicht nu van het goud dat voor Salomo in één jaar binnenkwam, was zeshonderdzesenzestig talenten goud;","15":"behalve wat er binnenkwam van de kramers, en van de handel van de kruideniers, en van alle koningen van Arabië, en van de bestuurders van dat land.","16":"Ook maakte de koning Salomo tweehonderd schilden van gehamerd goud; zeshonderd sikkel goud liet hij besteden aan elk schild.","17":"Ook driehonderd rondassen van gehamerd goud; drie pond goud liet hij besteden aan elke rondas; en de koning legde ze in het huis van het woud van Libanon.","18":"Verder maakte de koning een grote ivoren troon, en overtrok die met zuiver goud.","19":"Deze troon had zes treden, en de bovenkant van de troon was van achteren rond, en aan beide zijden waren leuningen tot bij de zitplaats, en er stonden twee leeuwen bij die leuningen.","20":"En er stonden twaalf leeuwen op de zes treden, aan beide zijden; zoiets is in geen enkel koninkrijk gemaakt.","21":"Ook waren alle drinkvaten van de koning Salomo van goud, en alle vaten van het huis van het woud van Libanon waren van zuiver goud; er was geen zilver bij, want dat werd in de dagen van Salomo nergens voor gerekend.","22":"Want de koning had op zee schepen van Tharsis, samen met de schepen van Hiram; deze schepen van Tharsis kwamen eens in de drie jaar binnen, met goud, en zilver, ivoor, en apen, en pauwen.","23":"Zo werd de koning Salomo groter dan alle koningen van de aarde, in rijkdom en in wijsheid.","24":"En heel de aarde zocht het aangezicht van Salomo, om zijn wijsheid te horen, die God in zijn hart gegeven had.","25":"En zij brachten ieder zijn geschenk, zilveren vaten, en gouden vaten, en klederen, en wapenrusting, en specerijen, paarden en muilezels, elk jaar opnieuw.","26":"Verder verzamelde Salomo wagens en ruiters, en hij had duizend vierhonderd wagens, en twaalfduizend ruiters, en hij bracht ze onder in de wagensteden en bij de koning in Jeruzalem.","27":"En de koning maakte dat het zilver in Jeruzalem zo gewoon was als stenen, en de ceders maakte hij zo gewoon als de wilde vijgenbomen die in de laagte staan, in grote hoeveelheid.","28":"En de paarden die Salomo had, kwamen uit Egypte; en wat het linnen garen betreft, de kooplieden van de koning namen het linnen garen voor een vaste prijs.","29":"En een wagen kwam op en ging uit Egypte weg voor zeshonderd sikkel van het zilver, en een paard voor honderdvijftig; en zo voerden zij die uit door hun toedoen, voor alle koningen van de Hethieten, en voor de koningen van Syrië."},"SV":{"1":"En toen de koningin van Scheba het gerucht van Salomo hoorde, aangaande den Naam des HEEREN, kwam zij, om hem met raadselen te verzoeken.","2":"En zij kwam te Jeruzalem, met een zeer zwaar heir, met kemelen, dragende specerijen, en zeer veel gouds, en kostelijk gesteente; en zij kwam tot Salomo, en sprak tot hem al wat in haar hart was.","3":"En Salomo verklaarde haar al haar woorden; geen ding was er verborgen voor den koning, dat hij haar niet verklaarde.","4":"Als nu de koningin van Scheba zag al de wijsheid van Salomo, en het huis, hetwelk hij gebouwd had,","5":"En de spijze zijner tafel, en het zitten zijner knechten, en het staan zijner dienaren, en hun kledingen, en zijn schenkers, en zijn opgang, waardoor hij henen opging in het huis des HEEREN, zo was in haar geen geest meer.","6":"En zij zeide tot den koning: Het woord is waarheid geweest, dat ik in mijn land gehoord heb, van uw zaken en van uw wijsheid.","7":"Ik heb die woorden niet geloofd, totdat ik gekomen ben, en mijn ogen *dat* gezien hebben; en zie, de helft is mij niet aangezegd; gij hebt met wijsheid en goed overtroffen het gerucht, dat ik gehoord heb.","8":"Welgelukzalig zijn uw mannen, welgelukzalig deze uw knechten, die gedurig voor uw aangezicht staan, die uw wijsheid horen!","9":"Geloofd zij de HEERE, uw God, Die behagen in u heeft gehad, om u op den troon van Israël te zetten! Omdat de HEERE Israël in eeuwigheid bemint, daarom heeft Hij u tot koning gesteld, om recht en gerechtigheid te doen.","10":"En zij gaf den koning honderd en twintig talenten gouds, en zeer veel specerijen, en kostelijk gesteente; als deze specerij, die de koningin van Scheba den koning Salomo gaf, is er nooit meer in menigte gekomen.","11":"Verder ook de schepen van Hiram, die goud uit Ofir voerden, brachten uit Ofir zeer veel almuggimhout en kostelijk gesteente.","12":"En de koning maakte van dit almuggimhout steunselen voor het huis des HEEREN, en voor het huis des konings, mitsgaders harpen en luiten voor de zangers. Het almuggimhout was zo niet gekomen noch gezien geweest, tot op dezen dag.","13":"En de koning Salomo gaf de koningin van Scheba al haar behagen, wat zij begeerde; behalve dat hij haar gaf naar het vermogen van den koning Salomo; zo keerde zij en toog in haar land, zij en haar knechten.","14":"Het gewicht nu van het goud, dat voor Salomo op een jaar inkwam was zeshonderd zes en zestig talenten gouds;","15":"Behalve dat van de kramers was, en van den handel der kruideniers, en van alle koningen van Arabië, en van de geweldigen van dat land.","16":"Ook maakte de koning Salomo tweehonderd rondassen van geslagen goud; zeshonderd *sikkelen* gouds liet hij opwegen tot elke rondas.","17":"Insgelijks driehonderd schilden van geslagen goud; drie pond gouds liet hij opwegen tot elk schild; en de koning leide ze in het huis des wouds van Libanon.","18":"Nog maakte de koning een groten elpenbenen troon, en hij overtoog denzelven met dicht goud.","19":"Deze troon had zes trappen, en het hoofd van den troon was van achteren rond, en aan beide zijden waren leuningen tot de zitplaats toe, en twee leeuwen stonden bij die leuningen.","20":"En twaalf leeuwen stonden daar op de zes trappen aan beide zijden, desgelijks is in geen koninkrijken gemaakt geweest.","21":"Ook waren alle drinkvaten van den koning Salomo van goud, en alle vaten van het huis des wouds van Libanon waren van gesloten goud; geen zilver was er aan; *want* het werd in de dagen van Salomo niet voor enig ding geacht.","22":"Want de koning had in zee schepen van Tharsis, met de schepen van Hiram; deze schepen van Tharsis kwamen in, eenmaal in drie jaren, brengende goud, en zilver, elpenbeen, en apen, en pauwen.","23":"Alzo werd de koning Salomo groter dan alle koningen der aarde, in rijkdom en in wijsheid.","24":"En de ganse aarde zocht het aangezicht van Salomo, om zijn wijsheid te horen, die God in zijn hart gegeven had.","25":"En zij brachten een ieder zijn geschenk, zilveren vaten, en gouden vaten, en klederen, en harnas, en specerijen, paarden en muilezelen, elk ding van jaar tot jaar.","26":"Daartoe vergaderde Salomo wagenen en ruiteren, en hij had duizend en vierhonderd wagenen, en twaalf duizend ruiteren, en leide ze in de wagensteden en bij den koning in Jeruzalem.","27":"En de koning maakte het zilver in Jeruzalem te zijn als stenen, en de cederen maakte hij te zijn als de wilde vijgebomen, die in de laagte zijn, in menigte.","28":"En het uitbrengen der paarden was hetgeen Salomo uit Egypte had; en aangaande het linnen garen, de kooplieden des konings namen het linnen garen voor den prijs.","29":"En een wagen kwam op, en ging uit van Egypte, voor zeshonderd *sikkelen* zilvers, en een paard voor honderd en vijftig; en alzo voerden ze *die* uit door hun hand voor alle koningen der Hethieten, en voor de koningen van Syrië."},"KJV":{"1":"And when the queen of Sheba heard of the fame of Solomon concerning the name of the LORD, she came to prove him with hard questions.","2":"And she came to Jerusalem with a very great train, with camels that bare spices, and very much gold, and precious stones: and when she was come to Solomon, she communed with him of all that was in her heart.","3":"And Solomon told her all her questions: there was not any thing hid from the king, which he told her not.","4":"And when the queen of Sheba had seen all Solomon's wisdom, and the house that he had built,","5":"And the meat of his table, and the sitting of his servants, and the attendance of his ministers, and their apparel, and his cupbearers, and his ascent by which he went up unto the house of the LORD; there was no more spirit in her.","6":"And she said to the king, It was a true report that I heard in mine own land of thy acts and of thy wisdom.","7":"Howbeit I believed not the words, until I came, and mine eyes had seen it: and, behold, the half was not told me: thy wisdom and prosperity exceedeth the fame which I heard.","8":"Happy are thy men, happy are these thy servants, which stand continually before thee, and that hear thy wisdom.","9":"Blessed be the LORD thy God, which delighted in thee, to set thee on the throne of Israel: because the LORD loved Israel for ever, therefore made he thee king, to do judgment and justice.","10":"And she gave the king an hundred and twenty talents of gold, and of spices very great store, and precious stones: there came no more such abundance of spices as these which the queen of Sheba gave to king Solomon.","11":"And the navy also of Hiram, that brought gold from Ophir, brought in from Ophir great plenty of almug trees, and precious stones.","12":"And the king made of the almug trees pillars for the house of the LORD, and for the king's house, harps also and psalteries for singers: there came no such almug trees, nor were seen unto this day.","13":"And king Solomon gave unto the queen of Sheba all her desire, whatsoever she asked, beside that which Solomon gave her of his royal bounty. So she turned and went to her own country, she and her servants.","14":"Now the weight of gold that came to Solomon in one year was six hundred threescore and six talents of gold,","15":"Beside that he had of the merchantmen, and of the traffick of the spice merchants, and of all the kings of Arabia, and of the governors of the country.","16":"And king Solomon made two hundred targets of beaten gold: six hundred shekels of gold went to one target.","17":"And he made three hundred shields of beaten gold; three pound of gold went to one shield: and the king put them in the house of the forest of Lebanon.","18":"Moreover the king made a great throne of ivory, and overlaid it with the best gold.","19":"The throne had six steps, and the top of the throne was round behind: and there were stays on either side on the place of the seat, and two lions stood beside the stays.","20":"And twelve lions stood there on the one side and on the other upon the six steps: there was not the like made in any kingdom.","21":"And all king Solomon's drinking vessels were of gold, and all the vessels of the house of the forest of Lebanon were of pure gold; none were of silver: it was nothing accounted of in the days of Solomon.","22":"For the king had at sea a navy of Tharshish with the navy of Hiram: once in three years came the navy of Tharshish, bringing gold, and silver, ivory, and apes, and peacocks.","23":"So king Solomon exceeded all the kings of the earth for riches and for wisdom.","24":"And all the earth sought to Solomon, to hear his wisdom, which God had put in his heart.","25":"And they brought every man his present, vessels of silver, and vessels of gold, and garments, and armour, and spices, horses, and mules, a rate year by year.","26":"And Solomon gathered together chariots and horsemen: and he had a thousand and four hundred chariots, and twelve thousand horsemen, whom he bestowed in the cities for chariots, and with the king at Jerusalem.","27":"And the king made silver to be in Jerusalem as stones, and cedars made he to be as the sycomore trees that are in the vale, for abundance.","28":"And Solomon had horses brought out of Egypt, and linen yarn: the king's merchants received the linen yarn at a price.","29":"And a chariot came up and went out of Egypt for six hundred shekels of silver, and an horse for an hundred and fifty: and so for all the kings of the Hittites, and for the kings of Syria, did they bring them out by their means."}},"tsk":{"1":[{"kopje":"En toen","refs":["2 Kron 9:1-12","Matt 12:42","Luk 11:31"]},{"kopje":"Scheba","refs":["Gen 10:7","Gen 10:28","Gen 25:3","Job 6:19","Ps 72:10","Ps 72:15","Jes 60:6","Jer 6:20","Ezech 27:22","Ezech 27:23","Ezech 38:13"]},{"kopje":"hoorde","refs":["1 Kon 4:31","1 Kon 4:34"]},{"kopje":"aangaande","refs":["Job 28:28","Spr 2:3-6","Joh 17:3","1 Kor 1:20","1 Kor 1:21"]},{"kopje":"toetsen","refs":["Richt 14:12-14","Ps 49:5","Spr 1:5","Spr 1:6","Matt 13:11" 28\">koningen</span> <span class=\"wl\" data-l=\"L12\" data-code=\"H4428\">van</span> <span class=\"wl\" data-l=\"L14\" data-code=\"H758\">Syrië</span>."},"koppeling_kjv":{"1":"And when the <span class=\"wl wl-kjv\" data-code=\"H4436\">queen</span> of <span class=\"wl wl-kjv\" data-code=\"H7614\">Sheba</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> of the <span class=\"wl wl-kjv\" data-code=\"H8088\">fame</span> of <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> concerning the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> she <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H5254\">prove</span> him with hard <span class=\"wl wl-kjv\" data-code=\"H2420\">questions.</span>","2":"And she <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> with a <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H3515\">great</span> <span class=\"wl wl-kjv\" data-code=\"H2428\">train,</span> with <span class=\"wl wl-kjv\" data-code=\"H1581\">camels</span> that <span class=\"wl wl-kjv\" data-code=\"H5375\">bare</span> <span class=\"wl wl-kjv\" data-code=\"H1314\">spices,</span> and <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">much</span> <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> and <span class=\"wl wl-kjv\" data-code=\"H3368\">precious</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stones:</span> and when she was <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon,</span> she <span class=\"wl wl-kjv\" data-code=\"H1696\">communed</span> with him of all that was in her <span class=\"wl wl-kjv\" data-code=\"H3824\">heart.</span>","3":"And <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> her all her <span class=\"wl wl-kjv\" data-code=\"H1697\">questions:</span> there was not any <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> <span class=\"wl wl-kjv\" data-code=\"H5956\">hid</span> from the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> which he <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> her not.","4":"And when the <span class=\"wl wl-kjv\" data-code=\"H4436\">queen</span> of <span class=\"wl wl-kjv\" data-code=\"H7614\">Sheba</span> had <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> all <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon's</span> <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> that he had <span class=\"wl wl-kjv\" data-code=\"H1129\">built,</span>","5":"And the <span class=\"wl wl-kjv\" data-code=\"H3978\">meat</span> of his <span class=\"wl wl-kjv\" data-code=\"H7979\">table,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4186\">sitting</span> of his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4612\">attendance</span> of his <span class=\"wl wl-kjv\" data-code=\"H8334\">ministers,</span> and their <span class=\"wl wl-kjv\" data-code=\"H4403\">apparel,</span> and his <span class=\"wl wl-kjv\" data-code=\"H8248\">cupbearers,</span> and his <span class=\"wl wl-kjv\" data-code=\"H5930\">ascent</span> by which he went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> there was no more <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> in her.","6":"And she <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> It was a <span class=\"wl wl-kjv\" data-code=\"H571\">true</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">report</span> that I <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> in mine own <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of thy <span class=\"wl wl-kjv\" data-code=\"H1697\">acts</span> and of thy <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom.</span>","7":"Howbeit I <span class=\"wl wl-kjv\" data-code=\"H539\">believed</span> not the <span class=\"wl wl-kjv\" data-code=\"H1697\">words,</span> until I <span class=\"wl wl-kjv\" data-code=\"H935\">came,</span> and mine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> had <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> it: and, behold, the <span class=\"wl wl-kjv\" data-code=\"H2677\">half</span> was not <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> me: thy <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom</span> and <span class=\"wl wl-kjv\" data-code=\"H2896\">prosperity</span> <span class=\"wl wl-kjv\" data-code=\"H3254\">exceedeth</span> the <span class=\"wl wl-kjv\" data-code=\"H8052\">fame</span> which I <span class=\"wl wl-kjv\" data-code=\"H8085\">heard.</span>","8":"<span class=\"wl wl-kjv\" data-code=\"H835\">Happy</span> are thy <span class=\"wl wl-kjv\" data-code=\"H582\">men,</span> <span class=\"wl wl-kjv\" data-code=\"H835\">happy</span> are these thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> which <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> <span class=\"wl wl-kjv\" data-code=\"H8548\">continually</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thee, and that <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> thy <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom.</span>","9":"<span class=\"wl wl-kjv\" data-code=\"H1288\">Blessed</span> be the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> which <span class=\"wl wl-kjv\" data-code=\"H2654\">delighted</span> in thee, to <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> thee on the <span class=\"wl wl-kjv\" data-code=\"H3678\">throne</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> because the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H160\">loved</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever,</span> therefore <span class=\"wl wl-kjv\" data-code=\"H7760\">made</span> he thee <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment</span> and <span class=\"wl wl-kjv\" data-code=\"H6666\">justice.</span>","10":"And she <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> an <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> and <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H3603\">talents</span> of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> and of <span class=\"wl wl-kjv\" data-code=\"H1314\">spices</span> <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> great <span class=\"wl wl-kjv\" data-code=\"H7235\">store,</span> and <span class=\"wl wl-kjv\" data-code=\"H3368\">precious</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stones:</span> there <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> no more <span class=\"wl wl-kjv\" data-code=\"H1931\">such</span> <span class=\"wl wl-kjv\" data-code=\"H7230\">abundance</span> of <span class=\"wl wl-kjv\" data-code=\"H1314\">spices</span> as these which the <span class=\"wl wl-kjv\" data-code=\"H4436\">queen</span> of <span class=\"wl wl-kjv\" data-code=\"H7614\">Sheba</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> to <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon.</span>","11":"And the <span class=\"wl wl-kjv\" data-code=\"H590\">navy</span> also of <span class=\"wl wl-kjv\" data-code=\"H2438\">Hiram,</span> that <span class=\"wl wl-kjv\" data-code=\"H5375\">brought</span> <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> from <span class=\"wl wl-kjv\" data-code=\"H211\">Ophir,</span> brought <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> from <span class=\"wl wl-kjv\" data-code=\"H211\">Ophir</span> <span class=\"wl wl-kjv\" data-code=\"H3966\">great</span> <span class=\"wl wl-kjv\" data-code=\"H7235\">plenty</span> of <span class=\"wl wl-kjv\" data-code=\"H484\">almug</span> <span class=\"wl wl-kjv\" data-code=\"H6086\">trees,</span> and <span class=\"wl wl-kjv\" data-code=\"H3368\">precious</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stones.</span>","12":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> of the <span class=\"wl wl-kjv\" data-code=\"H484\">almug</span> <span class=\"wl wl-kjv\" data-code=\"H6086\">trees</span> <span class=\"wl wl-kjv\" data-code=\"H4552\">pillars</span> for the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and for the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> <span class=\"wl wl-kjv\" data-code=\"H3658\">harps</span> also and <span class=\"wl wl-kjv\" data-code=\"H5035\">psalteries</span> for <span class=\"wl wl-kjv\" data-code=\"H7891\">singers:</span> there <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> no such <span class=\"wl wl-kjv\" data-code=\"H484\">almug</span> <span class=\"wl wl-kjv\" data-code=\"H6086\">trees,</span> nor were <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> unto this <span class=\"wl wl-kjv\" data-code=\"H3117\">day.</span>","13":"And <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4436\">queen</span> of <span class=\"wl wl-kjv\" data-code=\"H7614\">Sheba</span> all her <span class=\"wl wl-kjv\" data-code=\"H2656\">desire,</span> whatsoever she <span class=\"wl wl-kjv\" data-code=\"H7592\">asked,</span> beside that which <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> her of his <span class=\"wl wl-kjv\" data-code=\"H4428\">royal</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">bounty.</span> So she <span class=\"wl wl-kjv\" data-code=\"H6437\">turned</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> to her own <span class=\"wl wl-kjv\" data-code=\"H776\">country,</span> she and her <span class=\"wl wl-kjv\" data-code=\"H5650\">servants.</span>","14":"Now the <span class=\"wl wl-kjv\" data-code=\"H4948\">weight</span> of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> that <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> in <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> was <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H8346\">threescore</span> and <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H3603\">talents</span> of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span>","15":"Beside that he had of the <span class=\"wl wl-kjv\" data-code=\"H582\">merchantmen,</span> and of the <span class=\"wl wl-kjv\" data-code=\"H4536\">traffick</span> of the spice <span class=\"wl wl-kjv\" data-code=\"H7402\">merch de two hundred targets of beaten gold: he caused six hundred (shekels) of gold [understand common shekels, of whose value, see Gen.24. on v.24.] to be weighed [Heb. to ascend, or go up] for every target."}],"17":[{"catchword":null,"tekst":"Likewise three hundred shekels of beaten gold: he caused three pound of gold [Heb. Manin, etc. One mina or pound made ordinarily an hundred common shekels: and consequently every shield was worth three hundred shekels of gold. See 2.Chron.9.16.] to be weighed for every shield: and the King laid them in the house of the forest of Libanon, [see hereof above chap.7.on vers.2.]"}],"18":[{"catchword":null,"tekst":"Moreover, the King made a great Throne of Ivory; [Heb. a throne of the tooth; viz. of Elephants, whereof the Ivory cometh, of which divers things are made for ornament, as appeareth here, and below chap.22.39. Psa 45:9. Amos 3.15. and 6.4.] and he overlaid the same with gold. [i.e. which was well purified and refined: and therefore also very close and solid.]"}],"19":[{"catchword":null,"tekst":"This throne had six steps, and the head of the Throne was round behind [i.e. like a bow, or of the shape and fashion of a bow] and on both sides [Hebr.bence, and thence, or to, and fro. So in the following verse] were stays [Heb. hands] unto the seat, and two lions stood by those stays."}],"20":[{"catchword":null,"tekst":"And twelve lions stood there on the six steps on both sides: the like hath not been made in any Kingdoms:"}],"21":[{"catchword":null,"tekst":"Also all King Solomons drinking vessels were of gold, and all the vessels of the house of the forest of Libanon were of. close gold: [see above chap.8.on v.20.] (there) was no silver on them: (for) it [viz. Silver] was nothing accounted of in the days of Salomon. [an hyperbole, or excessive manner of speaking. Compare below v.27. and annotate. Thereon.]"}],"22":[{"catchword":null,"tekst":"For the King had at Sea ships of Tarsis. [Some understand by this word the great sea, called the Ocean, and by the ships of Tarsis, the ships that failed in that sea, Others take Tarsis to be Cilicia, whose metropolis or chief city called Tarsus, had a very well known port or haven, in which they found opportunity to sail into Africa, Juda, and other remote countrys. Compare Gen.10.on v.4. Others conceive Tarsis to be Africa, and by the ships of Tarsis to be understood a sleet or navy, sitted and prepared for to sail unto the African sea] with the ships of Hiram: these ships of Tharsis came home once in three years, bringing gold, and silver, ivory, and apes, [or munkies] and peacocks. [or parrats.]"}],"23":[{"catchword":null,"tekst":"So King Solomon waxed greater than all the Kings of the Earth, in riches, and in wisdom. [See chap.3.13.]"}],"24":[{"catchword":null,"tekst":"And all the Earth [Understand not all the men of the whole world, but the chiefest, as the Kings, Princes, Lords, etc. of all the countrys round about. See 2 Chron.9.23.] sought the face of Solomon, to hear his wisdom, which God had put in his heart."}],"25":[{"catchword":null,"tekst":"And they brought every man his present, vessels of silver, and vessels of Gold, and garments, and armour, and spices, horses, and mules, every thing from year to year, [Heb. the thing of the year in the year, i.e. every present yearly.]"}],"26":[{"catchword":null,"tekst":"Besides, Salomon gathered together charets, and horsemen, and he had a thousand and four hundred charets, and twelve thousand horsemen: [see above chap.24.6. and 2 Chron.1.14. and 9.25.] and bestowed them in the charet-cities, and with the King [i.e. with him. Compare v.16.] in Jerusalem."}],"27":[{"catchword":null,"tekst":"And the King made [Heb.gave] silver to be in Jerusalem as stones, [An hyperbole, or excessive manner of speaking, intimating exceeding great abundance. See Gen.13.on v.13. and above v.21. so 2 Chron.9 27.] and he made the Cedar-trees to be as the wild fig-trees, [or, as the sycamore-trees, i.e. fig-mulbeery-trees] in /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
