akte hij een voorhuis voor de troon, waar hij rechtsprak, het voorhuis van het gericht; dat was met ceder bedekt, van vloer tot vloer.","8":"En bij zijn huis, waar hij woonde, was een andere voorhof, meer naar binnen dan dat voorhuis, van hetzelfde werk gemaakt; ook maakte hij voor de dochter van Farao, die Salomo tot vrouw genomen had, een huis, gelijk aan dat voorhuis.","9":"Al deze dingen waren van kostbare stenen, naar de maten gehouwen, van binnen en van buiten met de zaag gezaagd; en dat van de fundering tot aan de kroonlijst, een handbreed, en van buiten tot aan de grote voorhof.","10":"Het was ook gegrondvest met kostbare stenen, grote stenen: stenen van tien el, en stenen van acht el.","11":"En daarboven kostbare stenen, naar de maten gehouwen, en cederhout.","12":"En de grote voorhof was rondom van drie rijen gehouwen stenen, met een rij cederen balken. Zo was het ook met de binnenste voorhof van het huis van de HEERE, en met het voorhuis van dat huis.","13":"En koning Salomo stuurde een boodschap, en liet Hiram uit Tyrus halen.","14":"Hij was de zoon van een weduwe, uit de stam van Naftali, en zijn vader was een man uit Tyrus geweest, een koperbewerker, vervuld met wijsheid, verstand en vakkennis om alle werk in koper te maken; hij kwam bij koning Salomo, en maakte al zijn werk.","15":"Want hij goot twee koperen pilaren; de hoogte van de ene pilaar was achttien el, en een draad van twaalf el kon de andere pilaar omvatten.","16":"Hij maakte ook twee kapitelen, van gegoten koper, om op de koppen van de pilaren te zetten; vijf el was de hoogte van het ene kapiteel, en vijf el de hoogte van het andere kapiteel.","17":"De netten waren van vlechtwerk, de banden van ketenwerk voor de kapitelen, die op de kop van de pilaren waren; zeven voor het ene kapiteel, en zeven voor het andere kapiteel.","18":"Zo maakte hij de pilaren, alsook twee rijen rondom over het ene net, om de kapitelen te bedekken die boven op de granaatappels waren; zo deed hij ook bij het andere kapiteel.","19":"En de kapitelen die op de kop van de pilaren waren, waren van leliewerk in het voorhuis, van vier el.","20":"De kapitelen nu waren op de twee pilaren, ja, ook daarboven bij de ronding die naast het net lag; en tweehonderd granaatappels waren in rijen rondom, ook op het andere kapiteel.","21":"Daarna richtte hij de pilaren op in het voorhuis van de tempel; en toen hij de rechterpilaar had opgericht, noemde hij die Jachin, en toen hij de linkerpilaar had opgericht, noemde hij die Boaz.","22":"En op de kop van de pilaren was het leliewerk; zo werd het werk van de pilaren voltooid.","23":"Verder maakte hij de gegoten zee; van tien el was zij van de ene rand tot de andere, helemaal rond, en vijf el hoog, en een meetsnoer van dertig el kon haar rondom omvatten.","24":"En onder haar rand waren knoppen, die haar rondom omzetten, tien op elke el, die de zee rondom omringden; deze knoppen waren in twee rijen bij de gieting meegegoten.","25":"Zij stond op twaalf runderen; drie kijkend naar het noorden, en drie kijkend naar het westen, en drie kijkend naar het zuiden, en drie kijkend naar het oosten; en de zee stond boven op hen, en al hun achterdelen waren naar binnen gekeerd.","26":"Haar dikte nu was een handbreed, en haar rand was gemaakt als de rand van een beker, met leliebloemen; zij hield tweeduizend bath.","27":"Hij maakte ook tien koperen stellingen; vier el was de lengte van één stelling, en vier el haar breedte, en drie el haar hoogte.","28":"En dit was het werk van de stelling: zij hadden lijsten, en de lijsten zaten tussen kransen.","29":"En op de lijsten die tussen de kransen zaten, waren leeuwen, runderen en cherubs; en op de kransen was daarboven nog een voetstuk; en onder de leeuwen en runderen zaten toevoegingen van dun uitgewerkt werk.","30":"En één stelling had vier koperen wielen, en koperen assen; en haar vier hoeken hadden draagstukken; onder het wasvat waren deze gegoten draagstukken, aan de zijkant van elk van de toevoegingen.","31":"En de opening ervan zat van binnen in de krans, en die stak een el naar boven uit; en de opening was rond, gemaakt als het voetwerk, van anderhalve el; en ook op de opening zaten graveringen, en de lijsten ervan waren vierkant, niet rond.","32":"De vier wielen nu zaten onder de lijsten, en de assen van de wielen zaten aan de stelling vast; en de hoogte van één wiel was anderhalve el.","33":"En het werk van die wielen was als het werk van een wagenwiel; hun assen, hun naven, hun velgen en hun spaken waren allemaal gegoten.","34":"En er waren vier draagstukken op de vier hoeken van één stelling; haar draagstukken waren uit één stuk met de stelling.","35":"En op de kop van een stelling was een ronde verhoging van een halve el rondom; ook waren op de kop van de stelling haar handvatten, en haar lijsten uit één stuk daarmee.","36":"Hij sneed nu in de platen van haar handvatten, en in haar lijsten, cherubs, leeuwen en palmbomen, ieder op zijn eigen open plek, met toevoegingen rondom.","37":"Hierop leken de tien stellingen die hij maakte; ze hadden allemaal dezelfde gieting, dezelfde maat, dezelfde vorm.","38":"Hij maakte ook tien koperen wasvaten; één wasvat hield veertig bath; één wasvat was vier el groot; op elk van de tien stellingen stond één wasvat.","39":"En hij zette vijf van die stellingen aan de rechterzijde van het huis, en vijf aan de linkerzijde van het huis; maar de zee zette hij aan de rechterzijde van het huis, oostwaarts, tegenover het zuiden.","40":"Daartoe maakte Hiram de wasvaten, de scheppen, en de sprenkelschalen; en Hiram maakte al het werk af dat hij voor koning Salomo maakte voor het huis van de HEERE:","41":"Namelijk de twee pilaren, en de bollen van de kapitelen die op de kop van de twee pilaren waren, en de twee netten om de twee bollen van de kapitelen te bedekken die op de kop van de pilaren waren;","42":"En de vierhonderd granaatappels voor de twee netten, namelijk twee rijen granaatappels voor elk net, om de twee bollen van de kapitelen te bedekken die boven op de pilaren waren;","43":"Alsook de tien stellingen, en de tien wasvaten op de stellingen;","44":"Daartoe de ene zee, en de twaalf runderen onder die zee.","45":"De potten ook, en de scheppen, en de sprenkelschalen, en al deze voorwerpen die Hiram voor koning Salomo maakte voor het huis van de HEERE, alle van gepolijst koper.","46":"In de vlakte van de Jordaan liet de koning ze gieten, in de kleigrond, tussen Sukkoth en Zarthan.","47":"En Salomo liet al deze voorwerpen ongewogen vanwege de zeer grote hoeveelheid; het gewicht van het koper werd niet vastgesteld.","48":"Ook maakte Salomo alle voorwerpen die voor het huis van de HEERE bestemd waren: het gouden altaar, en de gouden tafel waarop de toonbroden lagen;","49":"En de kandelaars, vijf aan de rechterkant, en vijf aan de linkerkant, voor het binnenste heiligdom, van zuiver goud; en de bloemen, de lampen, en de snuiters van goud;","50":"Alsook de schalen, de vorken, de sprenkelschalen, de rookschalen, en de wierookvaten, van zuiver goud; daartoe de scharnieren van de deuren van het binnenste huis, het heilige der heiligen, en van de deuren van het huis van de tempel, van goud.","51":"Zo werd al het werk voltooid dat koning Salomo voor het huis van de HEERE maakte. Daarna bracht Salomo de geheiligde dingen van zijn vader David: het zilver, het goud, en de voorwerpen legde hij bij de schatten van het huis van de HEERE."},"SV":{"1":"Maar aan zijn huis bouwde Salomo dertien jaren, en hij volmaakte zijn ganse huis.","2":"Hij bouwde ook het huis des wouds van Libanon, van honderd ellen in zijn lengte, en vijftig ellen in zijn breedte, en dertig ellen in zijn hoogte, op vier rijen van cederen pilaren, en cederen balken op de pilaren.","3":"En het was bedekt met ceder van boven op de ribben, die op vijf en veertig pilaren waren, vijftien in een rij.","4":"Er waren drie rijen van uitzichten, dat het ene venster was over het andere venster, in drie orden.","5":"Ook waren al de deuren en de posten vierkantig van *enerlei* uitzicht; en venster was tegenover venster, in drie orden.","6":"Daarna maakte hij een voorhuis van pilaren; vijftig ellen was zijn lengte, en dertig ellen zijn breedte; en het voorhuis was tegenover die, en de pilaren met de dikke balken tegenover dezelve.","7":"Ook maakte hij een voorhuis voor den troon, alwaar hij richtte, tot een voorhuis des gerichts, dat met ceder bedekt was, van vloer tot vloer.","8":"En *aan* zijn huis, alwaar hij woonde, was een ander voorhof, *meer* inwaarts dan dat voorhuis, hetwelk aan hetzelve werk gelijk was; ook maakte hij voor de dochter van Farao, die Salomo *tot* *vrouw* genomen had, een huis, aan dat voorhuis gelijk.","9":"Al deze dingen waren van kostelijke stenen, naar de maten gehouwen, van binnen en van buiten met de zaag gezaagd; en dat van den grondslag tot aan de neutstenen een palm breed, en van buiten tot het grote voorhof.","10":"Het was ook gegrondvest met kostelijke stenen, grote stenen; met stenen van tien ellen, en stenen van acht ellen.","11":"En bovenop kostelijke stenen, naar de winkelmaten gehouwen, en cederen.","12":"En het grote voorhof was rondom van drie rijen gehouwen stenen, met een rij van cederen balken. Zo was het met het binnenste voorhof, van het huis des HEEREN, en met het voorhuis van dat huis.","13":"En de koning Salomo zond heen, en liet Hiram van Tyrus halen.","14":"Hij was de zoon ener weduwvrouw, uit den stam van Nafthali, en zijn vader was een man van Tyrus geweest, een koperwerker, die vervuld was met wijsheid, en met verstand, en met wetenschap, om alle werk in het koper te maken; deze kwam tot den koning Salomo, en maakte al zijn werk.","15":"Want hij vormde twee koperen pilaren; de hoogte van den enen pilaar was achttien ellen, en een draad van twaalf ellen omving den anderen pilaar.","16":"Hij maakte ook twee kapitelen, van gegoten koper, om op de hoofden der pilaren te zetten; vijf ellen was de hoogte van het ene kapiteel, en vijf ellen de hoogte van het andere kapiteel.","17":"De netten waren van nettenwerk, de banden van ketenwerk voor de kapitelen, die op het hoofd der pilaren waren; zeven waren voor het ene kapiteel, en zeven voor het andere kapiteel.","18":"Zo maakte hij de pilaren, mitsgaders twee rijen rondom over het ene net, om de kapitelen, die boven het hoofd der granaatappelen waren, te bedekken; alzo deed hij ook aan het andere kapiteel.","19":"En de kapitelen, dewelke waren op het hoofd der pilaren, waren van leliewerk in het voorhuis, van vier ellen.","20":"De kapitelen nu waren op de twee pilaren, ja, daarboven tegenover den buik, dewelke was nevens het net; en tweehonderd granaatappelen waren in rijen rondom, *ook* over het andere kapiteel.","21":"Daarna richtte hij de pilaren op in het voorhuis des tempels; en den rechter pilaar opgericht hebbende, zo noemde hij zijn naam Jachin, en den linker pilaar opgericht hebbende, zo noemde hij zijn naam Boaz.","22":"En op het hoofd der pilaren was het leliewerk; alzo werd het werk der pilaren volmaakt.","23":"Verder maakte hij de gegotene zee; van tien ellen was zij van haar enen rand tot haar anderen rand, rondom rond, en van vijf ellen in haar hoogte, en een meetsnoer van dertig ellen omving ze rondom.","24":"En onder haar rand waren knoppen, dezelve rondom omsingelende, tien in een el, omringende die zee rondom; twee rijen dezer knoppen waren in haar gieting gegoten.","25":"Zij stond op twaalf runderen; drie ziende naar het noorden, en drie ziende naar het westen, en drie ziende naar het zuiden, en drie ziende naar het oosten; en de zee was boven op dezelve; en al hun achterdelen waren inwaarts.","26":"Haar dikte nu was een hand breed, en haar rand als het werk van den rand eens bekers *of* ener leliebloem; zij hield twee duizend bath.","27":"Hij maakte ook tien koperen stellingen; van vier ellen was de lengte ener stelling, en van vier ellen haar breedte, en van drie ellen haar hoogte.","28":"En dit was het werk der stelling; zij hadden lijsten, en de lijsten waren tussen kransen.","29":"En op de lijsten, die tussen de kransen waren, waren leeuwen, runderen en cherubs; en op de kransen was een voet boven henen; en onder de leeuwen en runderen bijvoegselen van uitgerekt werk.","30":"En een stelling had vier koperen raderen, en koperen platen; en haar vier hoeken hadden schouderen; onder het wasvat waren deze gegoten schouderen ter zijde van ieders bijvoegselen.","31":"En de mond daarvan was van binnen den krans, en daarboven van een el, en de mond hiervan was rond van voetwerk van een el en een halve el; en op de mond daarvan waren ook graveringen, en de lijsten daarvan waren vierkantig, niet rond.","32":"De vier raderen nu waren onder de lijsten, en de assen der raderen aan de stelling; en de hoogte van een rad was een el en een halve el.","33":"En het werk van die raderen was als het werk van een wagenrad; hun assen, en hun naven, en hun randen, en hun spaken waren alle gegoten.","34":"En er waren vier schouderen op de vier hoeken ener stelling; haar schouderen waren uit de stelling.","35":"En op het hoofd ener stelling was een ronde hoogte van een halve el rondom; ook waren op het hoofd der stelling haar handhaven, en haar lijsten uit denzelve.","36":"Hij sneed nu op de platen van haar handhaven, en op haar lijsten, cherubs, leeuwen, en palmbomen, naar elks ledige plaats, en bijvoegselen rondom.","37":"Dezen gelijk maakte hij de tien stellingen; enerlei gieting, enerlei maat, enerlei snede hadden zij allen.","38":"Hij maakte ook tien koperen wasvaten; een wasvat hield veertig bath; een wasvat was van vier ellen; op elke stelling van die tien stellingen was een wasvat.","39":"En hij zette vijf dier stellingen aan de rechterzijde van het huis, en vijf aan de linkerzijde van het huis; maar de zee zette hij aan de rechterzijde van het huis, oostwaarts tegen het zuiden.","40":"Daartoe maakte Hiram de wasvaten, en de schoffelen, en de besprengbekkens; en Hiram voleindde al het werk te maken, dat hij voor den koning Salomo maakte voor het huis des HEEREN;","41":"*Te* *weten* de twee pilaren, en bollen der kapitelen, die op het hoofd der twee pilaren waren, en de twee netten, om de twee bollen der kapitelen te bedekken, die op het hoofd der pilaren waren;","42":"En de vierhonderd granaatappelen tot de twee netten, *namelijk* twee rijen van granaatappelen tot het ene net, om de twee bollen der kapitelen te bedekken, die boven op de pilaren waren;","43":"Mitsgaders de tien stellingen, en de tien wasvaten op de stellingen;","44":"Daartoe de enige zee; en de twaalf runderen onder die zee.","45":"De potten ook, en de schoffelen, en de besprengbekkens, en al deze vaten, die Hiram voor den koning Salomo tot het huis des HEEREN maakte, *alle* van gepolijst koper.","46":"In de vlakte van de Jordaan goot ze de koning, in dichte aarde, tussen Sukkoth en tussen Zarthan.","47":"En Salomo liet al deze vaten *ongewogen* vanwege de zeer grote menigte; het gewicht des kopers werd niet onderzocht.","48":"Ook maakte Salomo al de vaten, die voor het huis des HEEREN waren; het gouden altaar, en de gouden tafel, op dewelke de toonbroden waren;","49":"En de kandelaren, vijf aan de rechterhand, en vijf aan de linkerhand, voor de aanspraakplaats, van gesloten goud; en de bloemen, en de lampen, en de snuiters van goud;","50":"Mitsgaders de schalen, en de gaffelen, en de sprengbekkens, en de rookschalen, en de wierookvaten, van gesloten goud; daartoe de herren der deuren van het binnenste huis, van het heilige der heiligen, *en* der deuren van het huis des tempels, van goud.","51":"Alzo werd al het werk volbracht, dat de koning Salomo aan het huis des HEEREN maakte. Daarna bracht Salomo de geheiligde dingen van zijn vader David; het zilver en het goud, en de vaten leide hij onder de schatten van het huis des HEEREN."},"KJV":{"1":"But Solomon was building his own house thirteen years, and he finished all his house.","2":"He built also the house of the forest of Lebanon; the length thereof was an hundred cubits, and the breadth thereof fifty cubits, and the height thereof thirty cubits, upon four rows of cedar pillars, with cedar beams upon the pillars.","3":"And it was covered with cedar above upon the beams, that lay on forty five pillars, fifteen in a row.","4":"And there were windows in three rows, and light was against light in three ranks.","5":"And all the doors and posts were square, with the windows: and light was against light in three ranks.","6":"And he made a porch of pillars; the length thereof was fifty cubits, and the breadth thereof thirty cubits: and the porch was before them: and the other pillars and the thick beam were before them.","7":"Then he made a porch for the throne where he might judge, even the porch of judgment: and it was covered with cedar from one side of the floor to the other.","8":"And his house where he dwelt had another court within the porch, which was of the like work. Solomon made also an house for Pharaoh's daughter, whom he had taken to wife, like unto this porch.","9":"All these were of costly stones, according to the measures of hewed stones, sawed with saws, within and without, even from the foundation unto the coping, and so on the outside toward the great court.","10":"And the foundation was of costly stones, even great stones, stones of ten cubits, and stones of eight cubits.","11":"And above were costly stones, after the measures of hewed stones, and cedars.","12":"And the great court round about was with three rows of hewed stones, and a row of cedar beams, both for the inner court of the house of the LORD, and for the porch of the house.","13":"And king Solomon sent and fetched Hiram out of Tyre.","14":"He was a widow's son of the tribe of Naphtali, and his father was a man of Tyre, a worker in brass: and he was filled with wisdom, and understanding, and cunning to work all works in brass. And he came to king Solomon, and wrought all his work.","15":"For he cast two pillars of brass, of eighteen cubits high apiece: and a line of twelve cubits did compass ➔ either of them about.","16":"And he made two chapiters of molten brass, to set upon the tops of the pillars: the height of the one chapiter was five cubits, and the height of the other chapiter was five cubits:","17":"And nets of checker work, and wreaths of chain work, for the chapiters which were upon the top of the pillars; seven for the one chapiter, and seven for the other chapiter.","18":"And he made the pillars, and two rows round about upon the one network, to cover the chapiters that were upon the top, with pomegranates: and so did he for the other chapiter.","19":"And the chapiters that were upon the top of the pillars were of lily work in the porch, four cubits.","20":"And the chapiters upon the two pillars had pomegranates also above, over against the belly which was by the network: and the pomegranates were two hundred in rows round about upon the other chapiter.","21":"And he set up the pillars in the porch of the temple: and he set up the right pillar, and called the name thereof Jachin: and he set up the left pillar, and called the name thereof Boaz.","22":"And upon the top of the pillars was lily work: so was the work of the pillars finished.","23":"And he made a molten sea, ten cubits from the one brim to the other: it was round all about, and his height was five cubits: and a line of thirty cubits did compass it round about.","24":"And under the brim of it round about there were knops compassing it, ten in a cubit, compassing the sea round about: the knops were cast in two rows, when it was cast.","25":"It stood upon twelve oxen, three looking toward the north, and three looking toward the west, and three looking toward the south, and three looking toward the east: and the sea was set above upon them, and all their hinder parts were inward.","26":"And it was an hand breadth thick, and the brim thereof was wrought like the brim of a cup, with flowers of lilies: it contained two thousand baths.","27":"And he made ten bases of brass; four cubits was the length of one base, and four cubits the breadth thereof, and three cubits the height of it.","28":"And the work of the bases was on this manner: they had borders, and the borders were between the ledges:","29":"And on the borders that were between the ledges were lions, oxen, and cherubims: and upon the ledges there was a base above: and beneath the lions and oxen were certain additions made of thin work.","30":"And every base had four brasen wheels, and plates of brass: and the four corners thereof had undersetters: under the laver were undersetters molten, at the side of every addition.","31":"And the mouth of it within the chapiter and above was a cubit: but the mouth thereof was round after the work of the base, a cubit and an half: and also upon the mouth of it were gravings with their borders, foursquare, not round.","32":"And under the borders were four wheels; and the axletrees of the wheels were joined to the base: and the height of a wheel was a cubit and half a cubit.","33":"And the work of the wheels was like the work of a chariot wheel: their axletrees, and their naves, and their felloes, and their spokes, were all molten.","34":"And there were four undersetters to the four corners of one base: and the undersetters were of the very base itself.","35":"And in the top of the base was there a round compass of half a cubit high: and on the top of the base the ledges thereof and the borders thereof were of the same.","36":"For on the plates of the ledges thereof, and on the borders thereof, he graved cherubims, lions, and palm trees, according to the proportion of every one, and additions round about.","37":"After this manner he made the ten bases: all of them had one casting, one measure, and one size.","38":"Then made he ten lavers of brass: one laver contained forty baths: and every laver was four cubits: and upon every one of the ten bases one laver.","39":"And he put five bases on the right side of the house, and five on the left side of the house: and he set the sea on the right side of the house eastward over against the south.","40":"And Hiram made the lavers, and the shovels, and the basons. So Hiram made an end of doing all the work that he made king Solomon for the house of the LORD:","41":"The two pillars, and the two bowls of the chapiters that were on the top of the two pillars; and the two networks, to cover the two bowls of the chapiters which were upon the top of the pillars;","42":"And four hundred pomegranates for the two networks, even two rows of pomegranates for one network, to cover the two bowls of the chapiters that were upon the pillars;","43":"And the ten bases, and ten lavers on the bases;","44":"And one sea, and twelve oxen under the sea;","45":"And the pots, and the shovels, and the basons: and all these vessels, which Hiram made to king Solomon for the house of the LORD, were of bright brass.","46":"In the plain of Jordan did the king cast them, in the clay ground between Succoth and Zarthan.","47":"And Solomon left all the vessels unweighed, because they were exceeding many: neither was the weight of the brass found out.","48":"And Solomon made all the vessels that pertained unto the house of the LORD: the altar of gold, and the table of gold, whereupon the shewbread was,","49":"And the candlesticks of pure gold, five on the right side, and five on the left, before the oracle, with the flowers, and the lamps, and the tongs of gold,","50":"And the bowls, and the snuffers, and the basons, and the spoons, and the censers of pure gold; and the hinges of gold, both for the doors of the inner house, the most holy place, and for the doors of the house, to wit, of the temple.","51":"So was ended all the work that king Solomon made for the house of the LORD. And Solomon brought in the things which David his father had dedicated; even the silver, and the gold, and the vessels, did he put among the treasures of the house of the LORD."}},"tsk":{"1":[{"kopje":"dertien jaar", dden, boven, vs.2, zijnde elke rij van vijftien pilaren."}],"4":[{"catchword":"Er waren","tekst":"Gelijk het huis drie verdiepingen hoog was, alzo heeft het ook drie rijen van vensters gehad, in elke verdieping een rij, waarvan de opperste recht tegenover de onderste kwamen."}],"5":[{"catchword":"van enerlei uitzicht;","tekst":"Dat is, de vensters en de poorten van twee zijden waren in elke zoldering regelrecht de ene op de andere gericht, dat men van de ene tot de andere daar tegenover zijnde, zijn gezicht strekken Kon. Anderen vertalen dit: Al de deuren en de posten waren vierkantig met de uitzichten, enz."},{"catchword":"in drie orden","tekst":"Hebreeuws, drie malen."}],"6":[{"catchword":"een voorhuis","tekst":"Hier wordt van drieërlei voorhuis gewag gemaakt, waarvan dit het eerste is, en was voor aan het huis des wouds Libanons. Zie van het tweede vs.7, en van het derde vs.8."},{"catchword":"van pilaren;","tekst":"Dat is, bestaande uit vele pilaren en uit het dak daarop rustende."},{"catchword":"vijftig ellen","tekst":"Naar de breedte van het huis. Vergelijk boven, vs.2."},{"catchword":"die,","tekst":"Te weten, deuren; van welke in vs.5 gesproken is, of pilaren, van het huis des wouds; zulks dat de pilaren en balken, waaruit dit voorhuis bestond, recht over de deuren, en alzo in het gezicht waren van het voorgemelde huis."}],"7":[{"catchword":"een voorhuis","tekst":"Namelijk, binnen Jeruzalem, voor aan zijn huis, zeer bekwaam voor het volk, hetwelk ten gerichte verscheen, om aldaar tegen het ongemak des weders bewaard te worden."},{"catchword":"van vloer tot vloer","tekst":"Dat is, van het ene einde van den vloer tot het aan het andere. Eenigen verstaan dit van de muren of wanden, te weten, dat zij met ceder beschoten zijn geweest, van beneden aan den vloer tot boven aan de zoldering, die mede een vloer is."}],"8":[{"catchword":"inwaarts","tekst":"Het derde voorhuis, hetwelk was tussen het voorhuis des gerichts en het huis des konings."},{"catchword":"een huis,","tekst":"Onderscheiden van den burg Davids, waar zij eerst haar woning gehad had. Zie boven, 1Ki 3:1, en 2Ch 8:11."},{"catchword":"voorhuis gelijk","tekst":"Versta, het derde voorhuis, dat inwaarts was, even tevoren genoemd; welk voorhuis het huis der koningin gelijk gezegd wordt, ten aanzien niet zozeer van den vorm, als wel van de materie, gelijk af te nemen is uit het volgende."}],"9":[{"catchword":"Al deze dingen","tekst":"Versta, al de gebouwen, die in het voorgaande hfdst. en 1Ki 6 verhaald worden. Vergelijk onder, vs.12."},{"catchword":"naar de maten gehouwen,","tekst":"Dat is, naar de maten, die de kunstige steenhouwers volgen, om een werk in den allernetsten en sierlijksten vorm te voltrekken; alzo onder, vs.11."},{"catchword":"neutstenen","tekst":"Dat is, de uitstekendste bakstenen, aan het opperste van den muur, op welken het verwuifsel des daks rustte, en staken een palmbreed buiten den muur."},{"catchword":"voorhof","tekst":"Alwaar het volk vergaderde."}],"11":[{"catchword":"bovenop","tekst":"Te weten, op de grondstenen."},{"catchword":"cederen","tekst":"Dat is, geschaafde planken van cederhout, waarmede de gesneden stenen bekleed waren."}],"12":[{"catchword":"grote voorhof","tekst":"Zie boven, vs.9."},{"catchword":"binnenste voorhof,","tekst":"Zie boven, 1Ki 6:36."}],"13":[{"catchword":"liet","tekst":"Hebreeuws, nam, of, nam aan. Zie Gen 12:15."},{"catchword":"Hiram","tekst":"Zie boven, 1Ki 5:1."},{"catchword":"Tyrus halen","tekst":"Zie op dezelfde plaats."}],"14":[{"catchword":"weduwvrouw,","tekst":"Dewelke was van afkomst uit den stam van Dan; 2Ch 2:14."},{"catchword":"uit den stam","tekst":"Versta dit van der weduwe zoon, die naar zijns vaders afkomst was uit den stam van Nafthali."},{"catchword":"man van Tyrus","tekst":"Te weten, ten aanzien van de stad zijner woning, en niet van zijn geslacht, naar hetwelk hij een Israëliet was. Anders kan dit ook verstaan worden, dat deze vader een Tyriër geweest is, ook van geslacht en afkomst, dat is, een heiden, maar zijn huisvrouw tezamen van Dan en Nafthali, te weten, van een stam uit haar vader, en van den anderen uit haar moeder, hetwelk kan geschied zijn door vermenging der stammen, omdat de Israëlieten niet altijd gevolgd hebben de wet Gods, die hun verbood buiten hun stam te trouwen. Zie breder 2Ch 2:14."}],"15":[{"catchword":"vormde","tekst":"Of, hij goot."},{"catchword":"ellen,","tekst":"Gerekend naar de maat des heiligdoms, die nog eens zolang waren als de gemene ellen. Zie Gen 6:15, en hierom worden 2Ch 3:15 naar de gemene maat der ellen, dezen pilaren vijf en dertig ellen toegeschreven, waarbij alsnog komt een el voor den voet òf het onderzetsel; zo is elke pilaar zes en dertig gemene ellen hoog geweest, dat is, achttien heilige."},{"catchword":"anderen pilaar","tekst":"Te weten, den omloop en de rondigheid van zijn stijl; versta hetzelfde ook van den eersten pilaar."}],"16":[{"catchword":"twee","tekst":"Te weten, voor elken pilaar een."},{"catchword":"kapitelen,","tekst":"Versta door het woord kapiteel alhier een sieraad, gemaakt boven op den top van den stijl eens pilaars, bestaande uit drie delen: den voet, het gevlochten werk der granaatappelen, en de kroon."},{"catchword":"vijf ellen was de hoogte","tekst":"Welverstaande het gehele kapiteel tezamen met zijn drie delen gemeten zijnde. Want de voet was een el hoog, het granaatappelwerk ook een el en de kroon drie ellen. Zoveel ellen wordt de kroon alleen toegeschreven, 2Ki 25:17, en gerekend zijnde met de granaatappelen, vier ellen. Zie onder, vs.19."}],"17":[{"catchword":"De netten","tekst":"De zin is dat het opperste deel, of de kroon des kapiteels bestond uit een zeer kunstige samenvlechting van loof, bloemen en vruchtenwerk in zekere orden door bandjes aan elkander gans sierlijk gehecht. Vergelijk 2Ch 3:16."},{"catchword":"nettenwerk,","tekst":"Of, van gevlochten, of van traliewerk."},{"catchword":"zeven waren","tekst":"Dit getal verstaan enigen van de orden des lofwerks en van de snoertjes, die dat werk verbonden en tezamen begrepen; anderen van de snoertjes of bandjes alleen."}],"18":[{"catchword":"rijen rondom","tekst":"Te weten, van granaatappelen, die het middelste deel des knoops omsingelden."},{"catchword":"de kapitelen,","tekst":"Dat is, de kronen, het opperste deel der kapitelen. Zie boven, vs.16."}],"19":[{"catchword":"waren van leliewerk","tekst":"Dat is, hadden het fatsoen, de gedaante en gelijkenis van leliën."},{"catchword":"in het voorhuis,","tekst":"Dat is, om in het voorhuis gesteld te worden."},{"catchword":"van vier ellen","tekst":"Versta dit van des kapiteels twee delen, het opperste en middelste, namelijk de kroon en het granaatappelwerk tezamen begrepen. Zie boven, vs.16."}],"20":[{"catchword":"De kapitelen nu","tekst":"Het kapiteel betekent hier het opperste deel van een geheel kapiteel, genaamd de kroon, die rond was als een bol, of in het geheel als een bal, of in de lengte als een ei."},{"catchword":"buik,","tekst":"Versta, het middelste, of het ruimste en meest uitstekende deel van den bol. Anderen verstaan door den buik het hol, dat boven midden in den pilaar geweest zou zijn, waarin de kapitelen ingelaten werden om vast te staan."}],"21":[{"catchword":"Jachin,","tekst":"Dat is, Hij [namelijk de Heere] zal bevestigen."},{"catchword":"Boaz","tekst":"Dat is, in hem is kracht. Deze twee namen geven te kennen dat de geestelijke tempel, welke is de gemeente der ware gelovigen en uitverkorenen, rustende op den pilaar der almogende kracht des Heeren, tegen alle uitwendig en inwendig geweld zou staande blijven, zodat de poorten der hel daartegen niets zouden vermogen, Mat 16:18."}],"22":[{"catchword":"het leliewerk;","tekst":"Zie hiervan boven, vs.19."}],"23":[{"catchword":"gegotene zee;","tekst":"Zo ook genaamd 2Ch 4:2, maar 2Ki 25:13"},{"catchword":"van haar","tekst":"Dat is, dwars overgemeten in een rechte doorgaande linie, van den enen rand tot den anderen."},{"catchword":"rand","tekst":"Hebreeuws, lip; en zo in het volgende."},{"catchword":"van dertig ellen","tekst":"Dat is, dit vat, in de rondte van buiten gemeten, was dertig ellen wijd. Want de rondte begrijpt driemaal zoveel lengte als de recht doorgaande linie. Vergelijk 2Ch 4:2."}],"24":[{"catchword":"onder haar rand","tekst":"Te weten, aan de buitenzijde dezer gegoten zee."},{"catchword":"knoppen,","tekst":"Het Hebreeuwse woord betekent eigenlijk kolokwinthen, of wilde kouwoerden, of de figuren en afbeeldingen derzelve gelijk boven, 1Ki 6:18, en 2Ki 4:39; maar het schijnt dat het in het algemeen ook betekent allerlei figuren van loof, bloemen, vruchten en beesten, tot versiering ergens op of in gewrocht. Want 2Ch 4:3 wordt tot breder verklaring dezer plaats gesteld de gelijkenis, of beeltenissen van ossen."},{"catchword":"tien in een el,","tekst":"De zin is, dat in ieder kubiet, of el, geweest zijn tien knoppen. En alzo nu in vs.23 gezegd is dat een rij dezer knoppen dertig ellen in haar omgang had, zo volgt dat het getal der knoppen in een rij geweest is driehonderd, en in de twee tezamen zeshonderd."},{"catchword":"haar gieting","tekst":"Te weten, der zee. Want zij waren niet gesneden of gegraveerd aan deze koperen zee, maar tezamen met dezelve gegoten. Alzo 2Ki 4:3."}],"25":[{"catchword":"hun achterdelen","tekst":"Dat is, de achterste delen dezer runderen waren inwaarts onder deze koperen zee verborgen, dat zij niet welk konden gezien worden. Alzo 2Ch 4:4."}],"26":[{"catchword":"twee duizend","tekst":"Versta, dat men daarin gewoonlijk zoveel water deed; maar tot boven toe vol zijnde hield zij drie duizend bath, 2Ch 4:5."},{"catchword":"bath","tekst":"Een grote maat der Hebreën van natte waren, houdende zoveel als een efa in droge waren, Eze 45:11. Een efa nu hield tien gomer, Exo 16:36, en Lev 5:11. Een gomer hield drie en veertig gemene eierschalen; zes dezer schalen houden de maat van een log. Zie Lev 14:10. Twee en zeventig log maakt omtrent een bath."}],"27":[{"catchword":"stellingen;","tekst":"Of, onderzetstelen, voeten, ondersteunselen, of pedestallen, die vierhoeking stonden, op welken boven een wasvat vast ingezet was, veel waters houdende, waarin de offeranden afgewassen werden; tot welke einde zij ook wielen hadden, waarmede zij van de ene plaats in de andere vervoerd werden."}],"28":[{"catchword":"lijsten, en de lijsten","tekst":"Hebreeuws, besluitingen. Versta, ruimten tussen twee kransen besloten, in welke de figuren van beesten en cherubim tot versiering gemaakt waren. Zie vs.29 en onder, vs.36."},{"catchword":"kransen","tekst":"Hebreeuws, trapjes. Deze waren uitstekende boorden, of randen, rondom elk gestoelte gemaakt, die trapsgewijze elkander volgden, en de voorgemelde lijsten of ruimten van boven en onder besloten. De opperste waren in figuren en afbeeldingen als een dak; de onderste als haar grond en bodem."}],"29":[{"catchword":"voet boven henen;","tekst":"Versta, een effen plaats of ruimte, dienende tot ondersteuning van het wasvat, dat daarop leunde."},{"catchword":"bijvoegselen","tekst":"Dat is, bijgevoegde versierselen van doorvlochten en uitgetrokken werk, welke waren aan den hals van het wasvat, een halve el daaronder. Zie onder, vs.35."}],"30":[{"catchword":"koperen platen;","tekst":"In welke de assen der wielen staken, tot ondersteuning der stellingen, die daarop lagen."},{"catchword":"schouderen;","tekst":"Dat is, houvasten, als schouders die boven uit de holligheid aan de vier hoeken der stelling uitkwamen; niet van buiten daaraan gemaakt, maar daaruit ontspringende, en daarmede gegoten zijnde, om het wasvat, dat daarop lag, vast te houden, opdat het in het vervoeren van de stelling niet zou waggelen. Vergelijk onder, vs.34."},{"catchword":"wasvat","tekst":"Zie hiervan onder, vs.38."}],"31":[{"catchword":"mond daarvan","tekst":"Versta, een eenparige en gelijke holligheid in de plaat, die boven over de stelling was, en die het wasvat, daarin tot een halve el toe ingelaten zijnde, even vulde."},{"catchword":"krans,","tekst":"Dat is, de omloop des monds, of der holligheid, waarin het wasvat ingelaten werd."},{"catchword":"voetwerk","tekst":"Gelijkvormig aan het werk, dat tot ondersteuning van enig ding gemaakt wordt, en op hetzelve alleszins wel moet passen. Daarom, gelijk het wasvat rond was, zo moest ook deze holligheid des monds rond wezen."},{"catchword":"van een el","tekst":"Te weten, naar de maat van het wasvat, dat in het gestoelte ingelaten werd."},{"catchword":"op de mond","tekst":"Dat is, op de plaat, of het deksel waarin de mond was, die het wasvat vatte."},{"catchword":"lijsten daarvan","tekst":"Dat is, de uiterste omgangen of omlopen, die het opperste deksel der stelling besloten."}],"32":[{"catchword":"de assen der raderen","tekst":"Hebreeuws, handen."}],"34":[{"catchword":"schouderen op de vier hoeken","tekst":"Sommigen menen dat deze schouders van de voorgemelde, boven, vs.30, zouden onderscheiden zijn geweest, zodat die kwamen uit de holligheid, waarin het wasvat ingelaten wordt, maar dat deze van buiten de holligheid van het wasvat het middelste deel deszelven onderstutten."},{"catchword":"waren uit de stelling","tekst":"Dat is, zij waren niet van buiten daaraan gehecht, maar een werk uit de stelling voortkomende. Zie boven, vs.30."}],"35":[{"catchword":"het hoofd ener stelling","tekst":"Te weten, boven de stelling en de schouders derzelve."},{"catchword":"handhaven,","tekst":"Hebreeuws, handen. Alzo in vs.36. Versta, het opperste der schouders, waarmede, als met handen, het wasvat ondersteund werd. Of versta hierdoor, kleine pilaartjes, die boven uit de vier hoeken der stelling doorgingen, hebbende vierkante lijsten, in welke sierlijke graveringen waren."}],"36":[{"catchword":"op haar lijsten,","tekst":"Zie boven, vs.31."}],"38":[{"catchword":"wasvaten;","tekst":"Staande op de koperen stellingen, die men vervoeren kon, beschreven in de voorgaande verzen vanaf vs.27. Deze vaten werden gevuld met water, hetwelk de priesters in hun dienst gebruiken moesten. Zie 2Ch 5:6, en vergelijk Lev 8:11 en de aantekeningen."},{"catchword":"bath;","tekst":"Te weten, waters. Zie van deze maat boven, vs.26."}],"39":[{"catchword":"het huis,","tekst":"TE weten, in het voorhof der priesters, alwaar de offeranden bereid werden."},{"catchword":"de zee","tekst":"Zie boven, vs.23."},{"catchword":"oostwaarts","tekst":"Alwaar de ingang was van het huis."}],"40":[{"catchword":"Hiram","tekst":"Terstond in ditzelfde vs. genoemd Hiram en elders ook Huram. Zie boven, vs.13. Denzelfden naam had de koning van Tyrus."}],"41":[{"catchword":"bollen","tekst":"Versta hierdoor kronen, die het opperste deel des kapiteels waren, van welke zie boven, vs.19,20."}],"42":[{"catchword":"de vierhonderd","tekst":"Zie boven, vs.20."}],"43":[{"catchword":"stellingen,","tekst":"Zie van deze boven, vs.27."},{"catchword":"tien wasvaten","tekst":"Zie boven, vs.38."}],"44":[{"catchword":"enige zee;","tekst":"Zie boven, vs.23."},{"catchword":"twaalf runderen","tekst":"Zie boven, vs.25."}],"45":[{"catchword":"potten ook,","tekst":"Om het vlees van enige offeranden, dat door de priesters en die de beesten ter offering brachten, gegeten werd, daarin te zieden. Eenige potten waren ook om de as der offeranden daarin te vergaderen en uit te dragen. Zie Exo 27:3."}],"46":[{"catchword":"dichte aarde,","tekst":"Dat is, kleiige, vette en taaie aarde. Alzo 2Ch 4:17."},{"catchword":"Sukkoth","tekst":"Gelegen in den stam van Gad over de Jordaan. Zie Gen 33:17."},{"catchword":"Zarthan","tekst":"Zie Jos 3:16."}],"47":[{"catchword":"zeer grote menigte;","tekst":"Hebreeuws, van de menigte zeer zeer."}],"48":[{"catchword":"gouden altaar,","tekst":"Dat is, overtrokken met goud, Exo 30:3, maar anders gemaakt van cederenhout, boven, 1Ki 6:20, hetwelk sittimhout genoemd wordt, Exo 30:1."},{"catchword":"tafel,","tekst":"Versta, tafelen in het getal van velen. Want in den tempel van Salomo zijn er tien geweest, 2Ch 4:8. Zij waren van goud, daarmede van buiten overtogen zijnde, maar van binnen waren zij van hout. Vergelijk Exo 25:23-24."},{"catchword":"toonbroden waren;","tekst":"Hebreeuws, broden der aangezichten; zo genoemd niet omdat zij aangezichten hadden, maar omdat zij voor het aangezicht des Heeren, dat is voor het heilige der heiligen lagen. Zie Exo 25:30."}],"49":[{"catchword":"aan de rechterhand,","tekst":"Dat is, aan de noord- en zuidzijde van het heilige."},{"catchword":"de aanspraakplaats,","tekst":"Zie boven, 1Ki 6:5."},{"catchword":"gesloten goud;","tekst":"Zie boven, 1Ki 6:20. Van zodanig goud waren deze kandelaars gemaakt, zijnde daarmede niet slechts overtrokken, maar daaruit geheel bestaande, gelijk de kandelaar van Mozes, in welken met zijn toebehoren een talent gouds gegaan is, Exo 25:31, Exo 25:39."},{"catchword":"bloemen,","tekst":"Zie van deze drie Exo 25:31, Exo 25:37-38."}],"50":[{"catchword":"gaffelen,","tekst":"Of, vorkjes, of snijmessen. Anders, muzikale instrumenten."},{"catchword":"sprengbekkens,","tekst":"Dewelke waren honderd in getal, 2Ch 4:8."},{"catchword":"rookschalen,","tekst":"Anders, lepels."},{"catchword":"gesloten goud;","tekst":"Zie boven, 1Ki 6:20."}],"51":[{"catchword":"de geheiligde dingen","tekst":"Dat is, die den Heere tot een heilig gebruik van David geëigend waren."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":":\\p sis, and four Ells the breadth thereof, and three Ells the height thereof."}],"2":[{"catchword":"He built also the Forest of Libanon","tekst":"So called (as some conceive) because it was built in a very pleasant and exalted place in Jerusalem, or without the city, and was beatified with many fair and high trees, like the forest of Libanon, serving the King for an house of pleasure, and recreation. Compare below chap.9.19."},{"catchword":"an hundred","tekst":"understand common ells: and see concerning this length, Gen.6.on vers.15."},{"catchword":"and fifty ells in the breadth thereof, and thirty ells in the height thereof; upon four rows of Cedar-pillars","tekst":"this house being six stories high, and having three dwellings one above another, this is to be understood of the lowermost"},{"catchword":"and Cedar-beams","tekst":"which made the floor of the middlemost dwelling upon the pillars."}],"3":[{"catchword":"And it was covered with Cedar above","tekst":"Whence arose the third or uppermost flooring"},{"catchword":"upon the ribs","tekst":"or, beams, lofts, chambers"},{"catchword":"which were upon five and fourty pillars, fifteen in a row","tekst":"understand the uppermost part of this house, which (because it had a less burden or stress to hear then the lowermost) had only three rowes of pillars, whereas the lowermost had four, above v.2. each row consisting of fifteen pillars."}],"4":[{"catchword":"There were three rows of lookings out: (so) that the one window was against the other window in three ranks","tekst":"As the house was three stories high, so it had likewise three rows of windows, in every story one row, whereof the uppermost stood right against the lowermost."}],"5":[{"catchword":"Also all the doors and posts were four square of (one manner of) looking out: and window was over against window, in three ranks","tekst":"Heb. three times. The meaning is, the windows and gates of both sides, were in each loft raised up just one above another, so that man could extend his sight from the one to the other being over against it. Others interpret it thus, all the doors and posts were four square with the lookings out, etc."}],"6":[{"catchword":"Then he made a porch","tekst":"Here three porches are mentioned, whereof this is the first, and was in the forepart of the house of the forest of Libanon. See of the second, v.7. and of the third, v.8."},{"catchword":"of Pillars","tekst":"i.e. consisting of many pillars, and from the roof resting upon them"},{"catchword":"fifty ells was the length thereof","tekst":"according to the breadth of the house. Compare above v.2."},{"catchword":"and thirty ells the breadth thereof: and the porch was over against them","tekst":"viz. the doors, of which mention is made in the former verse, or the pillars, or house of the forest. The meaning is, that this porch was before the house of the forest; so that the pillars and beams, of which this porch consisted, were right against the doors, and consequently in the sight of the fore-mentioned house and the pillars with the thick beams over against the same."}],"7":[{"catchword":"He also made a porch","tekst":"viz.in Jerusalem, before his house, very convenient for the people, which came for judgement, to be sheltred there against the intemperateness or foulness of the weather"},{"catchword":"before the throne, where he judged, (to be) a porch of judgement, which was covered with Cedar, from floor to floor","tekst":"i.e. from the one end of the floor to the other. Some understand this of the walls, viz. that they were covered with Cedar, from below on the floor, to the ceiling above which is a floor likewise."}],"8":[{"catchword":"And (at) his house where he dwelt, there was a Court more inward then that porch, which was like unto the same work","tekst":"The third porch, which was between the porch of judgement and the Kings house"},{"catchword":"he made also for Pharaos daughter, whom Salomon had taken (to wife) an house","tekst":"distinct from the strong hold of David, where he first dwelt. See above chap.3.1. and 2 Chron.8.11."},{"catchword":"like unto that porch","tekst":"understand the third porch which was more inward, mentioned immediately before, unto the porch, the Queens house is said to be like, not so much in regard of the form, as of the matter, as appeareth by the following verse."}],"9":[{"catchword":"All these things","tekst":"Meaning all the buildings mentioned in this and the former Chapters. Compare below v.12."},{"catchword":"were of costly stones, hewed according to measures","tekst":"i.e. according to the measures, which skilful masons or stone-cutters follow, to finish a work in the 11."},{"catchword":"sawed with the saw within and without; and that from the foundation unto the rests an hand-breadth","tekst":"i.e. the rests sticking out, at the uppermost part of the wall, whereon the vault of the roof rested, and stook out an hand-breadth without the wall"},{"catchword":"and so without unto the great court","tekst":"where the people met."}],"11":[{"catchword":"And above","tekst":"viz. upon the foundation-stones"},{"catchword":"upon costly stones, hewed after the square, and Cedars","tekst":"i.e. planed planks of Cedar-wood, wherewith the hewed stones were covered over."}],"12":[{"catchword":"And the great court","tekst":"See above on v.9."},{"catchword":"was round about of three rows of hewed stones, with one row of Cedar-beams: So it was with the inner court","tekst":"see above chap 6.on v.36. of the LORDS house, and with the porch of that house."}],"13":[{"catchword":"And King Salomon sent forth, and caused Hiram","tekst":"See above chap.5.on v.1."},{"catchword":"to be fetch","tekst":"Heb. took, or took on. See Gen 12.on vers.15."},{"catchword":"out of Tyrus","tekst":"see above chap.5.on v.1."}],"14":[{"catchword":"He was the son of a widow-woman","tekst":"By the descent of the tribe of Dan, 2 Chron.2.14."},{"catchword":"of the tribe of Naphtali","tekst":"understand this of the widows son, whose descent by the Father side was of the tribe of Naphtali"},{"catchword":"and his father had been a man of Tyre","tekst":"viz. in respect of the city where he dwelt, and not in respect of his descent, according which he was an Israelite. Oth. this may be also understood, that this Father was likewise Tyrian by pedigree and descent, that is, an heathen, but that his wife was both of Dan and Naphtali; to wit, of one tribe by the Fathers side, and of another by the Mothers side, which might be done by the mixtures of the tribes one with another; for the Israelites did not always follow the rule of Gods law, which forbade them to marry out of their own tribe. See further 2 Chr.2.on v.14."},{"catchword":"a worker (in) copper, who was filled with wisdom, and with understanding, and with knowledge, to make all (kind of) work in copper","tekst":"see Exo 31:3. this (man) came unto King Salomon, and made all his work."}],"15":[{"catchword":"For he formed","tekst":"Or cast"},{"catchword":"two copper pillars","tekst":"See Jer 52:21. 2 Kings 25.16, 17."},{"catchword":"the height of the one pillar was eighteen ells","tekst":"Counted after the measure of the sanctuary, which were again as long as the common ells: see Gen.6, on v.15. and hence 2 Chron.3.15. there are thirty five ells (after the common measure of ells) ascribed to these pillars, to which one ell more being allowed to the foot, or basis, each pillar was thirty six common ells high, that is, eighteen holy ones, or ells of the Sanctuary"},{"catchword":"and a filler of twelve ells compass of the other pillar about","tekst":"viz. the compass and roundness of its body: understand the same likewise of the first pillar."}],"16":[{"catchword":"He made also two","tekst":"viz. For each pillar one"},{"catchword":"Chapters","tekst":"understand hereby the Chapter, an Ornament, made above on the top of the top of the body of a pillar, consisting of three parts, viz. the Foot or Basis, the plaited work of the Pomegranates, and the Crown"},{"catchword":"of molten copper, to set upon the heads of the pillars: five ells was the height of the one Chapter, and five ells the height of the other Chapter","tekst":"Meaning the whole Chapter being measured altogether with all the three parts thereof: for the foot or basis was an ell high, the pomegranate work an ell also, and the crown three ells: so many ells are attributed to the crown alone, 2 King.23.17. and being counted with the pomegranates four ell: see below vers 19."}],"17":[{"catchword":"The nets were of net-work","tekst":"Or, of twisted, or of grated work"},{"catchword":"the wreaths of chain-work, for the chapters, which were on the head of the Pillars:","tekst":"The meaning is, that the uppermost part, or the crown of the Chapter consisted of a most artificial twisting together of leaf, flower, and fruit-work, in certain rows fastened with wreaths most curiously one to another: compare 2 Chron.3.16."},{"catchword":"seven were for the one Chapter, and seven for the other chapter","tekst":"some understand this work of the rows of the leaf-work, and of the strings or wreaths that tied the work close together: Others, of the strings or wreaths alone."}],"18":[{"catchword":"So he made the pillars; as also two rows","tekst":"viz. Of pomegranates that compassed the middle part of the knop about"},{"catchword":"round about upon the one net, to cover the Chapters","tekst":"i.e. the crowns, the uppermost part of the Chapters: see above on v.16. that were upon the head of the pomegranates; he did likewise so to the other Chapter."}],"19":[{"catchword":"And the Chapters, which were upon the head of the pillars, were of Lilie-work","tekst":"i.e. Had the form, fashion, and resemblance of Lilies"},{"catchword":"in the porch","tekst":"i.e. to be set in the porch"},{"catchword":"four ells","tekst":"understand this of two parts of the Chapter, the uppermost, and middlemost, namely the crown, and the pomegranate work both together: see above on v.16."}],"20":[{"catchword":"Now the Chapters","tekst":"The Chapter here signifieth the uppermost part of a whole chapter, called the Crown, which was round like a bowl, either in bulk like a ball, or in oval length"},{"catchword":"were upon the two pillars, yea upon it over against the belly","tekst":"understand the middlemost, or the middle part of the bowl, that which sticketh most out. Others understand by the belly, the hole that was above in the midst of the pillar, into which the Chapter were put, to stand fast which was by the net, and two hundred pomegranates were in rows round about, (also) upon the other Chapter."}],"21":[{"catchword":"After that he reared up the pillars in the porch of the Temple; and having reared up the right pillar, he called the name thereof Jachin","tekst":"i.e. He (viz. the LORD) will establish"},{"catchword":"and having reared up the left pillar, he called the name thereof Boaz","tekst":"i.e. Power is in him. These two names intimated, that spiritual Temple, which is the Church of true Believers, and of the Elect, resting on the almighty power of God, should be able to stand against all outward and inward violence whatsoever, so that the gates of hell should never prevail against it, Mat 16:18."}],"22":[{"catchword":"And upon the head of the pillar was Lilies-work:","tekst":"See hereof above ver.19. so the work of the pillars was finished."}],"23":[{"catchword":"Moreover, he made the molten sea","tekst":"Called likewise so, 2 Chron.4.2. but 2 King.25.13. a copper-sea. Understand a huge great vessel, or kettle, containing great store of water, and in that regard called a Sea, according to the instance of the Hebrews, who were wont to call the gatherings of many waters together, Seas. This water served for the washings of the Priest and Levites: compare Exod.30. ver.18,19,20. & 40. ver 30,31,32. & Lev.8.on ver.11. 2 King.16,17. 2 Chron,4.6."},{"catchword":"it was ten ells from the one brain direct","tekst":"Heb. lip so in the following verse"},{"catchword":"thereof, to the other brim thereof","tekst":"i.e. measured over thwart in a direct thorough, from the one brim to the other"},{"catchword":"round all about, and five ells in the height thereof, and a measuring-line of thirty ells did compass it round about","tekst":"i.e. this which being measured in roundness without was thirty ells wide: for the roundness containeth twice as much room as the direct line doth: compare 2 Chron.4.2."}],"24":[{"catchword":"And under the brim thereof","tekst":"viz. At the outside of this molten sea"},{"catchword":"were knops","tekst":"The Hebrew word signifieth properly wild gourds, or the pictures and droughts, or representations thereof, as above chap.6.v.18. & 2 King.4.39. but it seemeth that it signifieth also in general all manner of pictures of leaves, flowers, fruits, and beasts wrought upon, or in any thing for ornament: for 2 Chron.4.3. for further expounding of this place is put the resemblance or picture of Oxen"},{"catchword":"compassing the same round about, ten in an ell","tekst":"the meaning is, that in a cubit, or ell, were ten knops. And it being said in the former verse, that one row of these knops was thirty Ells in compass, it followed, that the number of knops in one row was three hundred; and in two together six hundred"},{"catchword":"compassing that Sea round about: two rows of these knops were casting of it","tekst":"viz. of the sea: for they were not carved or engraven in this copper sea, but cast together with the same: so 2 Chron.4.3."}],"25":[{"catchword":"It stood upon twelve oxen, three looking toward the North, and three looking toward the West, and three looking toward the south, and three looking toward the East, and the Sea was above upon them: and all their hinder parts were inward","tekst":"i.e. the hinder parts of these Oxen were inward hidden under this copper sea, that they could not easily be seen. So 2 Chron.4.4."}],"26":[{"catchword":"Now the thickness of it was an hand-breadth, and the brim thereof as the work of the brim of a cup: (or) of a Lilie-flower: it contained two thousand Baths","tekst":"Meaning that ordinarily so much water was put into it: but being brim-full, it held three thousand Baths, 2 Chron.4.5. A Bath was a great measure of the Hebrews of liquid or moist Wares, containing as much as an Epha did in dry Wares, Ezk.45.11. an Epha held ten Gomers, Exo 16:36. and Lev.5.on ver.11. a Gomer contained fourty three common Egg-shels: six of these shells contain the measure of a Log: see Levt.14. on verse 10. threescore and twelve Logs make about a Bath."}],"27":[{"catchword":"He made also ten Copper-bases","tekst":"Or, undershoarings, feet, under-proppings, which stood foursquare, or four-cornered, upon which was set a Laver, or Wash-vessel, containing a great quantity of Water, wherein the Offerings were washed; for which end they had also Wheels, by which they were carried from one place to another four Ells was the length of one be"}],"28":[{"catchword":"And this was the work of the bases; they had borders","tekst":"Heb. Shuttings in. Understand wide spaces inclosed or shut in between two ledges, wherein Pictures of Beasts and Cherubims were made for ornaments. See the following verses, and below verse 36."},{"catchword":"and the borders were between the ledges","tekst":"Heb.steps. These were borders sticking out, or bands, or brims made round about each seat, which followed one upon another like steps or stairs, and enclosed the afore-mentioned borders or spaces both above and below. The uppermost were as the roof of the pictures and images, the lowermost as their ground and bottom."}],"29":[{"catchword":"And upon the borders that were between the ledger, were Lions, Oxen and Cherubims, and upon the ledges (there) was the foot","tekst":"Meaning an even place or space ,serving for the under &acirc;&euro;&ldquo;propping of the Laver, rested thereon"},{"catchword":"above: and between the Lions and Oxen in addition of extend work","tekst":"i.e. adjoined ornaments of work twisted thorough and drawn out ,which were at the neck of the laver, an half ell below it :see below verse .35."}],"30":[{"catchword":"And one base four copper wheels, and copper plates","tekst":"Wherein the axle-trees of the wheels stuck ,for the under &acirc;&euro;&ldquo;propping of the bases ,that lay thereon"},{"catchword":"and the four corners of the bad shoulders :","tekst":"i.e. tenons, or stays, like unto shoulders ,that came above out of the hollowness at the four corners of the base; not made thereon without, but from the thence ifluing, and begin cast there with to hold the laver fast that lay thereon, that it might not wag or glide off from the base, when it was carried or transported from one place to another. Compared below v.34."},{"catchword":"under the laver","tekst":"see hereof below on v.38. were these molten shoulders at the side of every ones additions."}],"31":[{"catchword":"And the mouth","tekst":"Understand an equal and like hollowness in the plate, which was above upon the base, and which even filled the laver that was let into it about an half ell deep"},{"catchword":"of it was within the ledge","tekst":"i.e. the circumference of the mouth, or of the hollowness into which the laver was let in"},{"catchword":"and above it an ell, and the mouth thereof was round of foot-work","tekst":"comformable unto the work which is made to support or under prop anything, and must every way fit the same. Therefore as the laver was round, so was it likewise requisite that this hollowness of the mouth should be round"},{"catchword":"an ell and half an ell:","tekst":"viz. according to the measure of the laver which was let into the seat"},{"catchword":"and also upon the mouth of it","tekst":"i.e. upon the plate, or the covering wherein the mouth was, which comprehended the laver"},{"catchword":"were covenant rings, and the border thereof","tekst":"i.e. the outer most compass or circumferences, which conclude the uppermost covering of the base were four square, not round."}],"32":[{"catchword":"Now the four wheels were under the borders, and the axles-trees","tekst":"Heb. hants of the wheels at the base: and the height of a wheel was an ell and half an ell."}],"34":[{"catchword":"And there were four shoulders","tekst":"Some conceive that these shoulders differed from these mentioned above ver.30. for that those came out of the hollowness into which the laver is let, but these in the outside of the hollowness of the laver supported the middlemost part thereof"},{"catchword":"upon the four corners of one base: the shoulders thereof were of the base","tekst":"i.e. they were not fastened to it without, but one work issuing out of the base: see above on ver.30."}],"35":[{"catchword":"And upon the head of one base","tekst":"viz. above the face, and the shoulders thereof"},{"catchword":"was around height of half an ell round about: also upon the head of the base the handles thereof","tekst":"Heb. the hands thereof: so in the following verse. Understand the uppermost part of the shoulders, wherewith as with hants the laver was supported: or, understand hereby little pillars, which issued above out of the four corners of the base, have foursquare borders, wherein were curious gravings and the borders thereof were of the same."}],"36":[{"catchword":"Now he carried upon the plates of the handles thereof, and upon the borders thereof","tekst":"See above on ver.31. Cherubims, lions, and Palm-trees: according to every ones empty place, and additions rounds about."}],"38":[{"catchword":"He made also ten copper lavers:","tekst":"Standing upon the copper bases, which might be transported from place to place, described in the former verses beginning at the 27. These vessels were filled with water, which the Priests were to use in their ministration. See 2 Chron.4.6. and compare Lev.8. the annotate. on verse 11."},{"catchword":"one laver contained fourty Baths","tekst":"viz. of water: see of this measure above on verse 26. one laver was four ells; upon every base, of those ten bales, was one laver."}],"39":[{"catchword":"And he set five of those bases on the right side of the house","tekst":"viz. In the Court of Priests, where the Offerings were prepared"},{"catchword":"and five on the left side of the house; but he set the sea","tekst":"see above on verse 23."},{"catchword":"on the right side of the house Eastward","tekst":"where the entering of the house was over against the south."}],"40":[{"catchword":"Moreover, Hirom","tekst":"Straightway called in this verse Hiram, and elsewhere also Huram: see above on vers.13. the same name the King of Tyre had made the laver, and the shovels, and the sprinkling basins; and Hiram made an end of doing all the work, that he made King Salomon for the house of the LORD."}],"41":[{"catchword":"(To wit) the two pillars, and bowls of the Chapters","tekst":"Understand hereby Crowns, which were the uppermost part of the Chapter, of which see above verse 19. and 20. that were on the head of the two pillars: and the two nets, to cover the bowls of the Chapters, which were on the head of the pillars."}],"42":[{"catchword":"And the four hundred Pomegranates","tekst":"See above verse 20. for the two nets: (namely) two rows of Pomegranates for one net, to cover the two bowls of the Chapters, that were above upon the pillars."}],"43":[{"catchword":"Also the ten bases","tekst":"See of these above ver.27."},{"catchword":"and the ten lavers","tekst":"see above ver.38. upon the bases."}],"44":[{"catchword":"Moreover, one sea:","tekst":"see above ver.23."},{"catchword":"and the twelve oxen under that sea:","tekst":"see above verse 25."}],"45":[{"catchword":"Also the poes","tekst":"To seeth the flesh in of certain sacrifices, that was eaten by the Priests, and by those that brought the beasts to be offered. Some pots were also to gather the ashes of the sacrifices in, and to carry them forth: see Exod.27 3. and the shovels; and the sprinkling basins, and all these vessels which Hiram made for King Salomon for the house of the LORD; (all) of polished copper."}],"46":[{"catchword":"In the plain of Jordan did the King cast it in close earth:","tekst":"i.e. Clayie, and tough ground: so 2 Chron.4.17."},{"catchword":"between Succoth","tekst":"lying in the tribe of Gad beyond the Jordan: see Gen.33.on ver.17."},{"catchword":"and between Zarthan","tekst":"see Jos.3.on v.16."}],"47":[{"catchword":"And Salomon left all these vessels (unweighed) because of the exceeding great multitude:","tekst":"Heb. For the multitude greatly the weight of the Copper was not searched."}],"48":[{"catchword":"Salomon likewise made all the vessels, that were for the house of the LORD: the golden altar","tekst":"i.e. Overlaid with gold, Exod.30 3. but otherwise made of Cedar-wood, above chap.6.20. which is called Sittim-wood, Exo 30:1."},{"catchword":"and the great table","tekst":"understand tables in the plural number: for there were ten in Salomons temple, 2 Chron.4 8. They were of gold, viz. being therewith overlaid without, but within they were of wood: compare Exod.25. ver.23, 24."},{"catchword":"upon which the shew bread, (loaves)","tekst":"Heb. bread-(loaves) of faces: so called, not because they had faces, but because they lay before the face of the Lord, that is, before the Holy of Holies. see Exo 25:30. were."}],"49":[{"catchword":"And the candlesticks of inclosed gold","tekst":"See above chap 6.on ver.20. Of such kind of gold were these candlesticks made, being not onely overlaid therewith, be-wholly consisting of it, as Moseh&acirc;&euro;&trade;s candlestick did, to which with its appurtenances, a whole talent of gold went, Exo 25:31, 39."},{"catchword":"five on the right hand, and five on the left hand","tekst":"that is, on the North and South side of the holy place"},{"catchword":"before the Oracles place; and the flowers and the lamps, and the snuffer","tekst":"see of these three, Exod 25 v.31,37, and 38. of gold."}],"50":[{"catchword":"Or, Forks, or, chopping-knives","tekst":"of which there were an hundred in number, 2Chron.4 8."},{"catchword":"and the incense cups","tekst":"others spoons"},{"catchword":"and the censers of inclosed gold:","tekst":"see above chap.6.on ver.20. beside the hinges, the hinges of the door of the innermost house, of the Holy of Holies, (and) of the doors of the house of the Temple of gold."}],"51":[{"catchword":"So all the work was finished that King Salomon made for the house of the LORD: After that Salomon brought the dedicated things of David his father","tekst":"i.e. Which were dedicated unto the Lord by David for an holy use: see 2 Sam.8.7,11. & 2 Chron.5.1. the silver and the gold, and the vessels did he put among the treasure of the house of the LORD."}]}}};

    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const KJVKEY2AFK = {"Gen":"Gen","Exo":"Ex","Lev":"Lev","Num":"Num","Deu":"Deut","Jos":"Joz","Jdg":"Richt","Rth":"Ruth","1Sa":"1 Sam","2Sa":"2 Sam","1Ki":"1 Kon","2Ki":"2 Kon","1Ch":"1 Kron","2Ch":"2 Kron","Ezr":"Ezra","Neh":"Neh","Est":"Est","Job":"Job","Psa":"Ps","Pro":"Spr","Ecc":"Pred","Sng":"Hoogl","Isa":"Jes","Jer":"Jer","Lam":"Klaagl","Eze":"Ezech","Dan":"Dan","Hos":"Hos","Joe":"Joël","Amo":"Amos","Oba":"Obadja","Jon":"Jona","Mic":"Micha","Nah":"Nahum","Hab":"Hab","Zep":"Zef","Hag":"Hagg","Zec":"Zach","Mal":"Mal","Mat":"Matt","Mar":"Mark","Luk":"Luk","Jhn":"Joh","Act":"Hand","Rom":"Rom","1Co":"1 Kor","2Co":"2 Kor","Gal":"Gal","Eph":"Ef","Phl":"Fil","Col":"Kol","1Th":"1 Tess","2Th":"2 Tess","1Ti":"1 Tim","2Ti":"2 Tim","Tit":"Tit","Phm":"Filem","Heb":"Hebr","Jas":"Jak","1Pe":"1 Petr","2Pe":"2 Petr","1Jo":"1 Joh","2Jo":"2 Joh","3Jo":"3 Joh","Jde":"Judas","Rev":"Openb"};
const REF_RE = /\b(\d?[A-Za-z]{2,3})\s+(\d{1,3}):(\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek) => {
    const afk = KJVKEY2AFK[boek];
    return afk ? `<a class="refchip" data-ref="${heel.replace(boek, afk)}">${heel}</a>` : heel;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;

  const n = k.dataset.n;
