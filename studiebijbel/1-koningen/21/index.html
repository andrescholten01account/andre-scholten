 gezonden had; zoals geschreven was in de brieven die zij hun gezonden had.","Spr 11:31":"Zie, de rechtvaardige wordt vergolden op de aarde, hoeveel te meer de goddeloze en de zondaar!","Hand 27:31":"zei Paulus tegen de hoofdman en tegen de soldaten: Als dezen niet in het schip blijven, kunt u niet gered worden.","1 Kon 21:17-29":"Doch het woord van de HEERE kwam tot Elia, de Thisbiet: Maak u op, ga naar beneden, Achab, de koning van Israël, tegemoet, die in Samaria is; zie, hij is in de wijngaard van Naboth, waarheen hij afgegaan is om die in bezit te nemen. En u zult tot hem spreken en zeggen: Zo zegt de HEERE: Hebt u doodgeslagen, en ook een erfelijke bezitting ingenomen? Daartoe zult u tot hem spreken en zeggen: Zo zegt de HEERE: Op de plaats waar de honden het bloed van Naboth gelekt hebben, zullen de honden ook uw bloed lekken, ja, het uwe!","2 Kor 7:10":"Want de droefheid naar God werkt een onberouwelijke bekering tot zaligheid; maar de droefheid van de wereld werkt de dood.","Ps 37:32":"Tsade. De goddeloze loert op de rechtvaardige, en zoekt hem te doden.","Jer 22:3":"Zo zegt de HEERE: Doe recht en gerechtigheid, en red de beroofde uit de hand van de verdrukker; en onderdruk de vreemdeling niet, de wees, noch de weduwe; doe geen geweld en vergiet geen onschuldig bloed op deze plaats.","2 Kron 28:22":"Ja, in de tijd toen men hem benauwde, ging hij nog meer overtreden tegen de HEERE; dit was koning Achaz.","Jes 5:24":"Daarom, zoals de tong van het vuur de stoppel verteert, en het kaf door de vlam verteerd wordt, zo zal hun wortel als verrotting zijn; en hun bloesem zal als stof opstijgen; omdat zij de wet van de HEERE van de heerscharen verwerpen, en het woord van de Heilige van Israël versmaden.","1 Kon 18:19":"Nu dan, zend heen, verzamel bij mij heel Israël op de berg Karmel, en de vierhonderdvijftig profeten van Baäl, en de vierhonderd profeten van het bos, die van de tafel van Izebel eten.","Pred 5:7":"Als u de onderdrukking van de arme, en de beroving van het recht en de gerechtigheid ziet in een landstreek, verwonder u dan niet over zo'n gang van zaken; want wie hoger is dan de hoge, let daarop; en er zijn hogeren boven hen.","Ps 75:9":"Want in de hand van de HEERE is een beker, en de wijn is beroerd, vol van mengeling, en Hij schenkt daaruit; doch alle goddelozen van de aarde zullen zijn droesems drinken, terwijl ze die uitzuigen.","Hand 3:23":"En het zal gebeuren dat iedere ziel die niet naar deze Profeet zal hebben geluisterd, uitgeroeid zal worden uit het volk.","Gen 13:13":"En de mannen van Sodom waren slecht, en grote zondaars tegen de HEERE.","Deut 5:21":"En u zult niet begeren de vrouw van uw naaste; en u zult zich niet laten gelusten naar het huis van uw naaste, zijn akker, noch zijn dienstknecht, noch zijn dienstmaagd, zijn os, noch zijn ezel, noch iets dat van uw naaste is.","Mark 4:12":"opdat zij ziende zien, en niet opmerken; en horende horen, en niet verstaan; opdat zij zich niet op enig moment bekeren en hun de zonden vergeven worden.","Jes 55:2":"Waarom weegt u geld uit voor wat geen brood is, en uw arbeid voor wat niet verzadigen kan? Hoor aandachtig naar Mij, en eet het goede, en laat uw ziel zich verlustigen in vettigheid.","2 Kron 34:17":"En zij hebben het geld dat in het huis van de HEERE gevonden is, samengevoegd, en hebben het gegeven in de hand van de opzichters, en in de hand van hen die het werk verrichtten.","Deut 9:24":"Opstandig bent u geweest tegen de HEERE, vanaf de dag dat ik u gekend heb.","Job 5:2":"Want de dwaas brengt de toorn om, en de ijver doodt de eenvoudige.","Luk 16:22-28":"En het gebeurde dat de bedelaar stierf, en door de engelen gedragen werd in de schoot van Abraham; en de rijke stierf ook, en werd begraven. En toen hij in de hel zijn ogen ophief, terwijl hij in de pijn was, zag hij Abraham van verre, en Lazarus in zijn schoot. En hij riep en zei: Vader Abraham, ontferm u over mij, en zend Lazarus, dat hij het uiterste puntje van zijn vinger in het water dompelt, en mijn tong verkoelt; want ik lijd pijn in deze vlam.","Rom 6:16":"Weet u niet dat aan wie u uzelf ter beschikking stelt als dienstknechten tot gehoorzaamheid, u dienstknechten bent van hem die u gehoorzaamt, óf van de zonde tot de dood, óf van de gehoorzaamheid tot gerechtigheid?","2 Kon 9:10":"Ook zullen de honden Izebel eten op het stuk land van Jizreël, en er zal niemand zijn die haar kan begraven. Toen deed hij de deur open en vluchtte.","Est 8:8":"Schrijft u dan voor de Joden, zoals het goed is in uw ogen, in de naam van de koning, en verzegelt het met de ring van de koning; want het geschrift, dat in de naam van de koning geschreven, en met de ring van de koning verzegeld is, kan door niemand teruggeroepen worden.","Mark 6:17-27":"Want Herodes zelf had sommigen uitgezonden en Johannes gevangengenomen, en hem in de gevangenis geketend, vanwege Herodias, de vrouw van zijn broer Filippus, omdat hij haar getrouwd had. Want Johannes had tegen Herodes gezegd: Het is u niet geoorloofd de vrouw van uw broer te hebben. En Herodias had het op hem voorzien, en wilde hem doden, maar kon het niet;","Matt 7:23":"En dan zal Ik hun openlijk zeggen: Ik heb u nooit gekend; ga weg van Mij, u die de ongerechtigheid werkt!","Joh 17:12":"Toen Ik met hen in de wereld was, bewaarde Ik hen in Uw Naam. Hen die U Mij gegeven hebt, heb Ik bewaard, en niemand van hen is verloren gegaan, dan de zoon van het verderf, opdat de Schrift vervuld wordt.","Matt 10:28":"En weest niet bang voor hen die het lichaam doden, en de ziel niet kunnen doden; maar vreest veel meer Hem, Die zowel ziel als lichaam kan verderven in de hel.","Micha 3:9-11":"Hoor nu dit, hoofden van het huis van Jakob, en leiders van het huis van Israël! die van het gericht een gruwel hebben, en alles wat recht is verdraaien; Zij bouwen Sion met bloed, en Jeruzalem met onrecht. Haar hoofden rechtspreken om geschenken, en haar priesters leren om loon, en haar profeten waarzeggen om geld; nog steunen zij op de HEERE, en zeggen: Is de HEERE niet in ons midden? Ons zal geen kwaad overkomen.","Joz 9:15-21":"En Jozua sloot vrede met hen, en hij sloot een verbond met hen, dat hij hen in leven zou laten; en de leiders van de vergadering zwoeren het hun. En het gebeurde na verloop van drie dagen, nadat zij het verbond met hen gesloten hadden, dat zij hoorden dat zij hun naburen waren, en dat zij te midden van hen woonden. Want toen de kinderen van Israël verder trokken, kwamen zij op de derde dag bij hun steden aan; hun steden nu waren Gibeon, en Chefira, en Beeroth, en Kirjath-jearim.","Spr 14:12":"Er is een weg die iemand recht schijnt; maar het einde ervan is de weg van de dood.","Job 20:12":"Al is het kwaad zoet in zijn mond, al verbergt hij dat onder zijn tong,","1 Kon 21:17-22":"Doch het woord van de HEERE kwam tot Elia, de Thisbiet: Maak u op, ga naar beneden, Achab, de koning van Israël, tegemoet, die in Samaria is; zie, hij is in de wijngaard van Naboth, waarheen hij afgegaan is om die in bezit te nemen. En u zult tot hem spreken en zeggen: Zo zegt de HEERE: Hebt u doodgeslagen, en ook een erfelijke bezitting ingenomen? Daartoe zult u tot hem spreken en zeggen: Zo zegt de HEERE: Op de plaats waar de honden het bloed van Naboth gelekt hebben, zullen de honden ook uw bloed lekken, ja, het uwe!","Rom 9:22":"En wat nu, als God, terwijl Hij Zijn toorn wilde bewijzen en Zijn macht bekend wilde maken, met veel geduld de vaten van de toorn verdragen heeft, die klaargemaakt zijn tot verderf;","Rom 3:31":"Doen wij dan de wet teniet door het geloof? Dat zij verre; maar wij bevestigen de wet.","Num 7:10":"En de leiders offerden ter inwijding van het altaar, op de dag dat het gezalfd werd; de leiders dan offerden hun offergaven voor het altaar.","Luk 19:10":"Want de Zoon des mensen is gekomen om te zoeken en zalig te maken wat verloren was.","Jer 13:10":"Dit boosaardige volk, dat weigert Mijn woorden te horen, dat wandelt naar het goeddunken van zijn hart, en andere goden navolgt om die te dienen en zich voor die neer te buigen; dat zal worden als deze gordel, die nergens meer voor deugt.","Ps 37:10":"Vau. En nog een korte tijd, en de goddeloze zal er niet zijn; en u zult goed opletten op zijn plaats, maar hij zal er niet zijn.","Spr 16:4":"De HEERE heeft alles gemaakt om Zichzelf; ja, ook de goddeloze tot de dag van het kwaad.","Spr 1:12":"Laat ons hen levend verslinden, als het graf; ja, geheel en al, zoals zij die in de kuil neerdalen;","Hos 13:3":"Daarom zullen zij zijn als een morgenwolk, en als een vroege dauw, die heengaat; als kaf van de dorsvloer, en als rook uit de schoorsteen, weggejaagd door de wind.","Luk 20:18":"Ieder die op die steen valt, zal verpletterd worden, en op wie hij valt, die zal hij vermorzelen.","Jes 3:11":"Wee de goddeloze, het zal hem kwalijk gaan, want de vergelding van zijn handen zal hem overkomen.","Gen 3:6":"En de vrouw zag dat die boom goed was om van te eten, en dat hij een lust was voor de ogen, ja, een boom die begerenswaardig was om er verstandig van te worden; en zij nam van zijn vrucht en at; en zij gaf ook aan haar man, die bij haar was, en hij at.","Ps 28:5":"Omdat zij niet letten op de daden van de HEERE, en ook niet op het werk van Zijn handen, zal Hij hen afbreken en niet meer opbouwen.","2 Sam 11:15":"En hij schreef in die brief: Stel Uria vooraan tegenover de sterkste strijd, en trek u van achter hem terug, opdat hij geslagen wordt en sterft.","Spr 12:6":"De woorden van de goddelozen zijn om op bloed te loeren; maar de mond van de oprechten zal ze redden.","Openb 19:18":"Opdat u eet het vlees van de koningen, en het vlees van de aanvoerders over duizend, en het vlees van de sterken, en het vlees van de paarden en van hen die daarop zitten; en het vlees van alle vrijen en dienstknechten, en kleinen en groten.","2 Kron 24:11":"Het gebeurde nu ter tijd, als hij de kist, naar het bevel van de koning, door de hand van de Levieten inbracht, en als zij zagen dat er veel van het geld was, dat de schrijver van de koning kwam, en de gestelde van de hoofdpriester, en de kist leegmaakten, en die opnamen, en die terugbrachten naar haar plaats; zo deden zij van dag tot dag, en verzamelden geld in overvloed;","2 Kon 9:25-37":"Toen zei Jehu tegen Bidkar, zijn hoofdman: Neem hem op, werp hem op dat stuk land van Naboth, de Jizreëliet; want gedenk, toen ik en u samen achter zijn vader Achab reden, dat de HEERE hem deze last oplegde, en zei: Zeker heb Ik gisteravond het bloed van Naboth gezien, en het bloed van zijn zonen, zegt de HEERE, en Ik zal het u vergelden op dit stuk land, zegt de HEERE. Nu dan, neem hem op, werp hem op dat stuk land, naar het woord van de HEERE. Toen Ahazia, de koning van Juda, dat zag, vluchtte hij via de weg naar het huis van de hoftuin; maar Jehu vervolgde hem, en zei: Sla hem ook neer op de wagen, bij de opgang naar Gur, die bij Jibleam is; en hij vluchtte naar Megiddo, en stierf daar.","Rom 6:15":"Wat dan? Zullen wij zondigen, omdat wij niet onder de wet zijn, maar onder de genade? Dat zij verre.","Gen 15:3":"Verder zei Abram: Zie, mij hebt U geen nageslacht gegeven, en zie, de zoon van mijn huis zal mijn erfgenaam zijn!","Rom 1:20-32":"Want Zijn onzichtbare dingen worden, vanaf de schepping van de wereld, uit de schepselen begrepen en doorzien, namelijk Zijn eeuwige kracht en Goddelijkheid, opdat zij niet te verontschuldigen zouden zijn. Omdat zij, hoewel zij God kenden, Hem niet als God verheerlijkt of gedankt hebben; maar in hun overleggingen zijn zij verijdeld geworden, en hun onverstandig hart is verduisterd geworden; terwijl zij zich voor wijzen uitgaven, zijn zij dwaas geworden;","Num 36:7":"Zo zal de erfenis van de kinderen van Israël niet overgaan van stam naar stam; want de kinderen van Israël zullen vasthouden, ieder aan de erfenis van de stam van zijn vaderen.","Jer 3:5":"Zal Hij voor eeuwig Zijn toorn behouden? Zal Hij die voortdurend bewaren? Zie, u spreekt en doet die slechte dingen, en u zet door zoveel u kunt.","2 Kon 14:26":"Want de HEERE zag dat de ellende van Israël zeer bitter was, en dat er niemand was die opgesloten of achtergelaten was, en dat Israël geen helper had.","Gen 17:27":"En alle mannen van zijn huis, degenen die in het huis geboren waren, en degenen die met geld gekocht waren, van de vreemdeling af, werden met hem besneden.","Jer 8:12":"Zijn zij beschaamd, omdat zij gruwel bedreven hebben? Nee, zij schamen zich in het geheel niet, en weten niet hoe ze schaamrood moeten worden; daarom zullen zij vallen onder de vallende; ten tijde van hun bezoeking zullen zij struikelen, zegt de HEERE.","Hos 12:15":"Efraïm daarentegen heeft Hem zeer bitter vertoornd; daarom zal Hij zijn bloed op hem laten komen, en zijn Heere zal hem zijn smaad vergelden.","Deut 11:26":"Zie, ik stel u heden voor: zegen en vloek:","2 Kron 22:3-5":"Hij wandelde ook in de wegen van het huis van Achab; want zijn moeder was zijn raadgeefster, om goddeloos te handelen. En hij deed wat kwaad was in de ogen van de HEERE, net als het huis van Achab; want zij waren zijn raadgevers, na de dood van zijn vader, tot zijn verderf. Hij wandelde ook naar hun raad, en ging met Joram, de zoon van Achab, de koning van Israël, ten strijde tegen Hazaël, de koning van Syrië, bij Ramoth in Gilead; en de Syriërs sloegen Joram.","Num 14:10":"Toen zei de hele vergadering dat men hen met stenen zou stenigen. Maar de heerlijkheid van de HEERE verscheen in de tent van de samenkomst, voor al de kinderen van Israël.","Hos 4:9":"Daarom, zoals het volk, zo zal de priester zijn; en Ik zal zijn wegen aan hem bezoeken¹, en zijn daden hem vergelden.","1 Kon 2:36-46":"Daarna stuurde de koning, en riep Simeï, en zei tegen hem: Bouw u een huis in Jeruzalem, en woon daar, en ga vandaar niet naar hier of daar. Want het zal gebeuren op de dag dat u weggaat, wanneer u over de beek Kidron trekt, weet u zeker, dat u zult sterven; uw bloed zal op uw eigen hoofd zijn. En Simeï zei tegen de koning: Dat woord is goed; zoals mijn heer de koning gesproken heeft, zo zal uw dienaar doen. En Simeï woonde in Jeruzalem vele dagen.","Jes 50:1":"Zo zegt de HEERE: Waar is de scheidbrief van uw moeder, waarmee Ik haar weggezonden heb? Of wie is er van Mijn schuldeisers, aan wie Ik u verkocht heb? Zie, om uw ongerechtigheden bent u verkocht, en om uw overtredingen is uw moeder weggezonden.","Micha 2:2":"En zij begeren akkers en roven ze, en huizen, en nemen ze weg; zo doen zij de man en zijn huis geweld aan, ja, ieder en zijn erfenis.","Est 7:10":"Zo hingen zij Haman aan de galg, die hij voor Mordechai had laten maken; en de grimmigheid van de koning werd gestild.","Ezra 9:11":"die Gij geboden had door de dienst van Uw knechten, de profeten, en zei: Het land, waar u naartoe gaat om het te erven, is een vuil land, door de vuiligheid van de volken van de landen, om hun gruwelen, waarmee zij het vervuld hebben, van het ene einde tot het andere einde, met hun onreinheid.","Luk 12:1":"Ondertussen, toen er vele duizenden mensen uit de menigte bijeengebracht waren, zodat zij elkaar vertraden, begon Hij tegen Zijn discipelen te zeggen: Let vooral op uzelf voor het zuurdeeg van de Farizeeën, dat is huichelarij.","1 Kon 21:1-16":"Het gebeurde nu na deze dingen: Naboth, een Jizreëliet, had een wijngaard, die te Jizreël was, bij het paleis van Achab, de koning van Samaria. Achab sprak tot Naboth en zei: Geef mij uw wijngaard, opdat hij mij tot een kruidhof zij, omdat hij dicht bij mijn huis is; en ik zal u ervoor een wijngaard geven die beter is dan die; of, als het goed is in uw ogen, zal ik u de waarde ervan in geld geven. Maar Naboth zei tegen Achab: Dat de HEERE ver van mij houde, dat ik u de erfenis van mijn vaderen zou geven!","2 Kron 21:3":"En hun vader had hun veel geschenken gegeven van zilver, van goud en van kostbaarheden, alsook versterkte steden in Juda; maar het koninkrijk gaf hij aan Joram, omdat hij de eerstgeborene was.","Hos 5:9":"Efraïm zal tot verwoesting worden, op de dag van de straf; onder de stammen van Israël heb Ik bekendgemaakt wat zeker is.","2 Sam 12:11":"Zo zegt de HEERE: Zie, Ik zal kwaad over u verwekken uit uw eigen huis, en Ik zal uw vrouwen nemen voor uw ogen, en zal ze aan uw naaste geven; die zal bij uw vrouwen liggen, voor de ogen van deze zon.","Deut 22:13-21":"Wanneer een man een vrouw genomen heeft, en tot haar ingegaan is, en haar dan haat, En haar oorzaak geeft tot naspraak, en een kwade naam over haar verspreidt, en zegt: Deze vrouw heb ik genomen, en toen ik tot haar naderde, heb ik haar maagdelijkheid niet gevonden; Dan zullen de vader van deze jonge dochter en haar moeder haar meenemen, en naar de oudsten van de stad brengen, bij de poort, met het bewijs van de maagdelijkheid van deze jonge vrouw.","Jes 14:20":"U zult niet bij hen gevoegd worden in de begrafenis; want u hebt uw land verdorven, en uw volk gedood; het nageslacht van de boosdoeners zal in eeuwigheid niet genoemd worden.","Deut 30:19":"Ik neem heden tegen u de hemel en de aarde tot getuigen; het leven en de dood heb ik u voorgesteld, de zegen en de vloek! Kies dan het leven, opdat u leeft, u en uw nageslacht;","1 Kon 21:5-16":"Maar Izebel, zijn vrouw, kwam bij hem en zei tegen hem: Wat is dit, dat uw geest zo knorrig is, en dat u geen brood eet? En hij zei tegen haar: Omdat ik tot Naboth, de Jizreëliet, gesproken heb en tegen hem gezegd heb: Geef mij uw wijngaard voor geld, of, als het u zint, zal ik u een andere wijngaard in zijn plaats geven; maar hij heeft gezegd: Ik zal u mijn wijngaard niet geven. Toen zei Izebel, zijn vrouw, tegen hem: Regeert u nu het koninkrijk over Israël? Sta op, eet brood, en laat uw hart vrolijk zijn; ik zal u de wijngaard van Naboth, de Jizreëliet, geven.","Ps 36:13":"Daar zijn de werkers van de ongerechtigheid gevallen; zij zijn neergestoten, en kunnen niet weer opstaan.","Openb 3:3":"Bedenk dan hoe u het ontvangen en gehoord hebt, en bewaar het, en bekeer u. Als u dan niet waakt, zal Ik over u komen als een dief, en u zult niet weten op welk uur Ik over u komen zal.","Ezech 33:10":"Daarom, mensenkind! Zeg tegen het huis van Israël: U spreekt zo en zegt: Omdat onze overtredingen en onze zonden op ons zijn, en wij daarin wegkwijnen, hoe zouden wij dan leven?","Deut 22:21":"Dan zullen zij deze jonge dochter naar de deur van haar vaders huis brengen, en de mannen van haar stad zullen haar met stenen stenigen, zodat zij sterft, omdat zij een dwaasheid in Israël gedaan heeft door in haars vaders huis te hoereren; zo zult u het kwaad uit uw midden wegdoen.","1 Kon 18:13":"Is mijn heer niet verteld wat ik gedaan heb, toen Izebel de profeten van de HEERE doodde? Dat ik van de profeten van de HEERE honderd man heb verborgen, elk vijftig man in een grot, en hen met brood en water heb onderhouden?","2 Sam 12:7-12":"Toen zei Nathan tegen David: U bent die man! Zo zegt de HEERE, de God van Israël: Ik heb u tot koning gezalfd over Israël, en Ik heb u uit de hand van Saul gered; en Ik heb u het huis van uw heer gegeven, en de vrouwen van uw heer in uw schoot; ja, Ik heb u het huis van Israël en Juda gegeven; en als dat weinig was, zou Ik u dit en dat er nog bij gegeven hebben. Waarom hebt u dan het woord van de HEERE veracht, door te doen wat kwaad is in Zijn ogen? U hebt Uria, de Hethiet, met het zwaard verslagen, en zijn vrouw hebt u tot uw vrouw genomen; en hem hebt u met het zwaard van de kinderen van Ammon gedood.","Matt 24:50":"dan zal de heer van die dienstknecht komen op een dag waarop hij hem niet verwacht, en op een uur dat hij niet weet;","1 Kor 6:10":"Vergis u niet; hoereerders, afgodendienaars, overspelers, ontuchtigen, mannen die bij mannen liggen, dieven, hebzuchtigen, dronkaards, geen lasteraars, geen rovers, zullen het Koninkrijk van God beërven.","Jer 13:14":"En Ik zal hen tegen elkaar te pletter slaan, de een tegen de ander, zowel de vaders als de kinderen samen, spreekt de HEERE; Ik zal geen medelijden hebben, en niet sparen, en Mij niet ontfermen, zodat Ik hen zal verderven.","Job 36:17":"Maar u hebt het oordeel van de goddeloze vervuld; het oordeel en het recht houden u vast.","Hos 5:11":"Efraïm is verdrukt, hij is verpletterd met recht; want hij heeft dat zo gewild; hij heeft gewandeld naar het gebod.","Ex 34:7":"Die de goedertierenheid bewaart aan vele duizenden, Die de ongerechtigheid, en overtreding, en zonde vergeeft; Die de schuldige geenszins onschuldig houdt, en de ongerechtigheid van de vaders bezoekt aan de kinderen, en aan de kindskinderen, tot in het derde en vierde geslacht.","Ex 21:21":"Als hij echter een dag of twee dagen overeind blijft, zal hij niet gewroken worden; want hij is zijn eigen geld waard.","Ps 26:9":"Raap mijn ziel niet weg met de zondaars, en mijn leven niet met de mannen van het bloed;","2 Kron 18:17":"Toen zei de koning van Israël tegen Josafat: Heb ik u niet gezegd: Hij zal over mij niets goeds, maar kwaad profeteren?","Deut 2:6":"Voedsel zult u voor geld van hen kopen, dat u eet; en ook zult u water voor geld van hen kopen, dat u drinkt.","Gen 34:13-17":"Toen antwoordden Jakobs zonen Sichem en zijn vader Hemor bedrieglijk, en spraken (omdat hij Dina, hun zuster, verontreinigd had); en zij zeiden tegen hen: Wij kunnen dit niet doen, om onze zuster te geven aan een man die onbesneden is; want dat zou voor ons een schande zijn. Doch hierin zullen wij het met u eens zijn: als u wordt zoals wij, dat onder u besneden wordt al wie mannelijk is.","Num 15:36":"Toen bracht de hele vergadering hem naar buiten, buiten het leger, en zij stenigden hem met stenen, zodat hij stierf, zoals de HEERE Mozes geboden had.","Job 20:13":"Al spaart hij het en laat het niet los, maar houdt het midden in zijn gehemelte binnen;","Lev 26:14":"Maar als u Mij niet zult horen, en al deze geboden niet zult doen;","Jes 33:12":"En de volken zullen zijn als de verbrandingen van het kalk; als afgehouwen doornen zullen zij met het vuur verbrand worden.","Ps 18:27":"Bij de reine houdt U Zich rein, maar bij de verkeerde bewijst U Zich een Worstelaar.","Ps 9:6":"Gij hebt de heidenen gescholden, de goddeloze verdaan, hun naam uitgedelgd, tot in eeuwigheid en altoos.","Ps 101:8":"Elke morgen zal ik alle goddelozen van het land verdelgen, om uit de stad van de HEERE alle werkers van de ongerechtigheid uit te roeien.","Rom 13:9":"Want dit: u zult geen overspel doen, u zult niet doden, u zult niet stelen, u zult geen valse getuigenis geven, u zult niet begeren; en als er nog enig ander gebod is, wordt het in dit woord samengevat, namelijk in dit: u zult uw naaste liefhebben als uzelf.","Openb 19:17-21":"En ik zag een engel, staande in de zon; en hij riep met een grote stem, en zei tegen alle vogels, die in het midden van de hemel vlogen: Kom hierheen, en verzamel u tot het avondmaal van de grote God; Opdat u eet het vlees van de koningen, en het vlees van de aanvoerders over duizend, en het vlees van de sterken, en het vlees van de paarden en van hen die daarop zitten; en het vlees van alle vrijen en dienstknechten, en kleinen en groten. En ik zag het beest, en de koningen van de aarde, en hun legers verzameld, om krijg te voeren tegen Hem, Die op het paard zat, en tegen Zijn legers.","Job 31:3":"Is niet het verderf voor de verkeerde, ja, wat vreemds voor de werkers van ongerechtigheid?","Spr 29:1":"Een man die, vaak bestraft, zijn nek verhardt, zal plotseling verbroken worden, zodat er geen genezing meer mogelijk is.","Rom 8:8":"En zij die in het vlees zijn, kunnen God niet behagen.","Ps 58:11":"De rechtvaardige zal zich verblijden, als hij de wraak aanschouwt; hij zal zijn voeten wassen in het bloed van de goddeloze.","Est 3:12-15":"Toen werden de schrijvers van de koning geroepen, in de eerste maand, op de dertiende dag daarvan, en er werd geschreven naar alles wat Haman beval, aan de stadhouders van de koning, en aan de landvoogden die over elk landschap waren, en aan de vorsten van elk volk, elk landschap naar zijn schrift, en elk volk naar zijn taal; er werd geschreven in de naam van de koning Ahasveros, en het werd met de ring van de koning verzegeld. De brieven nu werden gezonden door de hand van de lopers naar alle landschappen van de koning, dat men zou uitroeien, doden en ombrengen alle Joden, van jong tot oud toe, de kleine kinderen en de vrouwen, op één dag, op de dertiende van de twaalfde maand (dat is de maand Adar), en dat men hun buit zou roven. De inhoud van het schrift was, dat er een wet zou worden gegeven in alle landschappen, openbaar gemaakt aan alle volken, dat zij tegen dezelfde dag gereed zouden zijn.","Jer 44:23":"Vanwege dat u wierook gebrand hebt, en dat u tegen de HEERE gezondigd hebt, en de stem van de HEERE niet gehoorzaam bent geweest, en in Zijn wet en in Zijn inzettingen, en in Zijn getuigenissen niet hebt gewandeld; daarom is u dit kwaad overkomen, zoals het is op deze dag.","Pred 3:18":"Ik zei in mijn hart over de toestand van de mensenkinderen, dat God hen zal aantonen, en dat zij zullen zien, dat zij als de dieren zijn aan zichzelf.","Ps 21:10":"U zult hen zetten als een vurige oven ter tijd van uw toornige aangezicht; de HEERE zal hen in Zijn toorn verslinden, en het vuur zal hen verteren.","Neh 6:5":"Toen stuurde Sanballat voor de vijfde keer op dezelfde manier zijn knecht naar mij, met een open brief in zijn hand.","2 Petr 2:15":"zij hebben de rechte weg verlaten en zijn verdwaald, en volgen de weg van Bileam, de zoon van Bosor, die het loon van de onrechtvaardigheid heeft liefgehad;","Ezech 22:9":"Achterklappers zijn in u geweest om bloed te vergieten, en in u hebben zij op de bergen gegeten, zij hebben schandelijkheid in uw midden gedaan.","Ps 1:4-6":"Zo zijn de goddelozen niet, maar als het kaf dat de wind wegdrijft. Daarom zullen de goddelozen niet standhouden in het gericht, noch de zondaars in de vergadering van de rechtvaardigen. Want de HEERE kent de weg van de rechtvaardigen; maar de weg van de goddelozen zal vergaan.","Spr 11:21":"Hand aan hand zal de boze niet onschuldig blijven; maar het nageslacht van de rechtvaardigen zal ontkomen.","Ps 94:3":"Hoe lang zullen de goddelozen, o HEERE! hoe lang zullen de goddelozen van vreugde opspringen?","Klaagl 5:16":"De kroon van ons hoofd is afgevallen; o wee nu ons, dat wij zo gezondigd hebben!","Deut 27:25":"Vervloekt is hij die geschenken aanneemt om een ziel, het bloed van een onschuldige, te doden! En heel het volk zal zeggen: Amen.","1 Tim 6:9":"Maar zij die rijk willen worden, vallen in verzoeking en in een valstrik, en in veel dwaze en schadelijke begeerten, die de mensen doen wegzinken in verderf en ondergang.","Gen 17:23":"Toen nam Abraham zijn zoon Ismaël, en alle mannen die in zijn huis geboren waren, en alle die met zijn geld gekocht waren, alles wat mannelijk was onder de mensen van het huis van Abraham, en hij besneed het vlees van hun voorhuid, op diezelfde dag, zoals God met hem gesproken had.","Ps 59:6":"Ja, U HEERE, God van de heerscharen, God van Israël! Ontwaak om al deze heidenen te bezoeken; wees niemand van hen genadig die trouweloos ongerechtigheid bedrijven. Sela.","Ps 37:2":"Want als gras zullen zij snel worden afgesneden, en als het groene grasscheutje zullen zij afvallen.","Spr 16:5":"Ieder die hoog van hart is, is de HEERE een gruwel; al slaat hij de handen ineen, hij zal niet onschuldig blijven.","Gen 25:5":"Doch Abraham gaf aan Izak al wat hij had.","Spr 13:5":"De rechtvaardige haat leugentaal; maar de goddeloze maakt zich stinkend, en doet zich schaamte aan.","Richt 16:18":"Toen Delila nu zag, dat hij haar zijn hele hart bekend had gemaakt, zond zij mensen weg, en riep de vorsten van de Filistijnen, en zei: Komt ditmaal, want hij heeft mij zijn hele hart bekendgemaakt. En de vorsten van de Filistijnen kwamen naar haar toe, en brachten dat geld in hun hand.","Deut 9:13":"Verder sprak de HEERE tot mij en zei: Ik heb dit volk aangemerkt, en zie, het is een hardnekkig volk.","Ex 23:2":"U zult de menigte niet volgen tot boze zaken; en u zult niet spreken in een geschil om u naar de menigte te neigen, om het recht te buigen.","Hos 12:3":"Ook heeft de Heere een twist met Juda, en Hij zal bezoeking doen over Jakob naar zijn wegen, naar zijn handelingen zal Hij hem vergelden.","Joh 7:34":"U zult Mij zoeken en u zult Mij niet vinden; en waar Ik ben, kunt u niet komen.","Hos 7:14":"Zij roepen ook niet tot Mij met hun hart, wanneer zij huilen op hun bedden; om koren en most verzamelen zij zich, maar zij weerstreven Mij.","2 Kron 28:10":"Daartoe denkt u er nu aan om de kinderen van Juda en Jeruzalem u tot slaven en slavinnen te onderwerpen; bent u het zelf niet die schuldig staan? Bij u zijn schulden tegen de HEERE, uw God.","Ps 78:34-37":"Toen Hij hen doodde, zochten zij Hem, en keerden weer, en zochten God vroeg; En zij dachten eraan, dat God hun Rotssteen was, en God, de Allerhoogste, hun Verlosser. En zij vleiden Hem met hun mond, en logen tegen Hem met hun tong.","Joh 18:28":"Zij leidden Jezus dan van Kajafas naar het gerechtsgebouw. En het was 's morgens vroeg; en zij zelf gingen niet naar binnen in het gerechtsgebouw, opdat zij niet verontreinigd zouden worden, maar opdat zij het pascha konden eten.","Jes 43:24":"Mij hebt u geen kalmoes voor geld gekocht, en met het vet van uw slachtoffers hebt u Mij niet gedrenkt; maar u hebt Mij arbeid gemaakt met uw zonden, u hebt Mij vermoeid met uw ongerechtigheden.","Jer 5:3":"HEERE, zien Uw ogen niet naar waarheid? U hebt hen geslagen, maar zij hebben geen pijn gevoeld; U hebt hen verteerd, maar zij hebben geweigerd de tucht aan te nemen; zij hebben hun gezicht harder gemaakt dan een steenrots, zij hebben geweigerd zich te bekeren.","2 Kon 10:17":"En toen hij te Samaria kwam, sloeg hij allen, die aan Achab te Samaria overgebleven waren, totdat hij hem had uitgeroeid, naar het woord van de HEERE, dat Hij tot Elia gesproken had.","Hab 2:9-11":"Wee hem die met kwade hebzucht rijkdom vergaart voor zijn huis, om zijn nest in de hoogte te zetten, om bevrijd te zijn uit de hand van het kwaad. U hebt schande beraamd voor uw huis; door veel volken uit te roeien hebt u tegen uw eigen ziel gezondigd. Want de =\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria.</span>","2":"And <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto <span class=\"wl wl-kjv\" data-code=\"H5022\">Naboth,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">Give</span> me thy <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyard,</span> that I may have it for a <span class=\"wl wl-kjv\" data-code=\"H1588\">garden</span> of <span class=\"wl wl-kjv\" data-code=\"H3419\">herbs,</span> because it is <span class=\"wl wl-kjv\" data-code=\"H7138\">near</span> <span class=\"wl wl-kjv\" data-code=\"H681\">unto</span> my <span class=\"wl wl-kjv\" data-code=\"H1004\">house:</span> and I will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thee for it a <span class=\"wl wl-kjv\" data-code=\"H2896\">better</span> <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyard</span> than it; or, if it seem <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> to <span class=\"wl wl-kjv\" data-code=\"H5869\">thee,</span> I will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thee the <span class=\"wl wl-kjv\" data-code=\"H4242\">worth</span> of it in <span class=\"wl wl-kjv\" data-code=\"H3701\">money.</span>","3":"And <span class=\"wl wl-kjv\" data-code=\"H5022\">Naboth</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab,</span> The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2486\">forbid</span> it me, that I should <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> the <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance</span> of my <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> unto thee.","4":"And <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> into his <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> <span class=\"wl wl-kjv\" data-code=\"H5620\">heavy</span> and <span class=\"wl wl-kjv\" data-code=\"H2198\">displeased</span> because of the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> which <span class=\"wl wl-kjv\" data-code=\"H5022\">Naboth</span> the <span class=\"wl wl-kjv\" data-code=\"H3158\">Jezreelite</span> had <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> to him: for he had <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will not <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thee the <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance</span> of my <span class=\"wl wl-kjv\" data-code=\"H1\">fathers.</span> And he laid him <span class=\"wl wl-kjv\" data-code=\"H7901\">down</span> upon his <span class=\"wl wl-kjv\" data-code=\"H4296\">bed,</span> and turned <span class=\"wl wl-kjv\" data-code=\"H5437\">away</span> his <span class=\"wl wl-kjv\" data-code=\"H6440\">face,</span> and would <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> no <span class=\"wl wl-kjv\" data-code=\"H3899\">bread.</span>","5":"But <span class=\"wl wl-kjv\" data-code=\"H348\">Jezebel</span> his <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to him, and <span class=\"wl wl-kjv\" data-code=\"H1696\">said</span> unto him, Why is thy <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> so <span class=\"wl wl-kjv\" data-code=\"H5620\">sad,</span> that thou <span class=\"wl wl-kjv\" data-code=\"H398\">eatest</span> no <span class=\"wl wl-kjv\" data-code=\"H3899\">bread?</span>","6":"And he <span class=\"wl wl-kjv\" data-code=\"H1696\">said</span> unto her, Because I <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto <span class=\"wl wl-kjv\" data-code=\"H5022\">Naboth</span> the <span class=\"wl wl-kjv\" data-code=\"H3158\">Jezreelite,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H5414\">Give</span> me thy <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyard</span> for <span class=\"wl wl-kjv\" data-code=\"H3701\">money;</span> or else, if it <span class=\"wl wl-kjv\" data-code=\"H2655\">please</span> thee, I will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thee another <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyard</span> for it: and he <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> I will not <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thee my <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyard.</span>","7":"And <span class=\"wl wl-kjv\" data-code=\"H348\">Jezebel</span> his <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Dost thou now <span class=\"wl wl-kjv\" data-code=\"H6213\">govern</span> the <span class=\"wl wl-kjv\" data-code=\"H4410\">kingdom</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel?</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">arise,</span> and <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread,</span> and let thine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> be <span class=\"wl wl-kjv\" data-code=\"H3190\">merry:</span> I will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thee the <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyard</span> of <span class=\"wl wl-kjv\" data-code=\"H5022\">Naboth</span> the <span class=\"wl wl-kjv\" data-code=\"H3158\">Jezreelite.</span>","8":"So she <span class=\"wl wl-kjv\" data-code=\"H3789\">wrote</span> <span class=\"wl wl-kjv\" data-code=\"H5612\">letters</span> in <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab's</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> and <span class=\"wl wl-kjv\" data-code=\"H2856\">sealed</span> them with his <span class=\"wl wl-kjv\" data-code=\"H2368\">seal,</span> and <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> the <span class=\"wl wl-kjv\" data-code=\"H5612\">letters</span> unto the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> and to the <span class=\"wl wl-kjv\" data-code=\"H2715\">nobles</span> that were in his <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelling</span> with <span class=\"wl wl-kjv\" data-code=\"H5022\">Naboth.</span>","9":"And she <span class=\"wl wl-kjv\" data-code=\"H3789\">wrote</span> in the <span class=\"wl wl-kjv\" data-code=\"H5612\">letters,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">Proclaim</span> a <span class=\"wl wl-kjv\" data-code=\"H6685\">fast,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">set</span> <span class=\"wl wl-kjv\" data-code=\"H5022\">Naboth</span> on <span class=\"wl wl-kjv\" data-code=\"H7218\">high</span> among the <span class=\"wl wl-kjv\" data-code=\"H5971\">people:</span>","10":"And <span class=\"wl wl-kjv\" data-code=\"H3427\">set</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men,</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H1100\">Belial,</span> before him, to bear <span class=\"wl wl-kjv\" data-code=\"H5749\">witness</span> against him, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Thou didst <span class=\"wl wl-kjv\" data-code=\"H1288\">blaspheme</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span> And then carry him <span class=\"wl wl-kjv\" data-code=\"H3318\">out,</span> and <span class=\"wl wl-kjv\" data-code=\"H5619\">stone</span> him, that he may <span class=\"wl wl-kjv\" data-code=\"H4191\">die.</span>","11":"And the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of his <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> even the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> and the <span class=\"wl wl-kjv\" data-code=\"H2715\">nobles</span> who were the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> in his <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> as <span class=\"wl wl-kjv\" data-code=\"H348\">Jezebel</span> had <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> unto them, and as it was <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in the <span class=\"wl wl-kjv\" data-code=\"H5612\">letters</span> which she had <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> unto them.","12":"They <span class=\"wl wl-kjv\" data-code=\"H7121\">proclaimed</span> a <span class=\"wl wl-kjv\" data-code=\"H6685\">fast,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">set</span> <span class=\"wl wl-kjv\" data-code=\"H5022\">Naboth</span> on <span class=\"wl wl-kjv\" data-code=\"H7218\">high</span> among the <span class=\"wl wl-kjv\" data-code=\"H5971\">people.</span>","13":"And there <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> in <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men,</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H1100\">Belial,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> before him: and the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H1100\">Belial</span> <span class=\"wl wl-kjv\" data-code=\"H5749\">witnessed</span> against him, even against <span class=\"wl wl-kjv\" data-code=\"H5022\">Naboth,</span> in the presence of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H5022\">Naboth</span> did <span class=\"wl wl-kjv\" data-code=\"H1288\">blaspheme</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span> Then they carried him <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> <span class=\"wl wl-kjv\" data-code=\"H2351\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and <span class=\"wl wl-kjv\" data-code=\"H5619\">stoned</span> him with <span class=\"wl wl-kjv\" data-code=\"H68\">stones,</span> that he <span class=\"wl wl-kjv\" data-code=\"H4191\">died.</span>","14":"Then they <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> to <span class=\"wl wl-kjv\" data-code=\"H348\">Jezebel,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H5022\">Naboth</span> is <span class=\"wl wl-kjv\" data-code=\"H5619\">stoned,</span> and is <span class=\"wl wl-kjv\" data-code=\"H4191\">dead.</span>","15":"And it came to pass, when <span class=\"wl wl-kjv\" data-code=\"H348\">Jezebel</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> that <span class=\"wl wl-kjv\" data-code=\"H5022\">Naboth</span> was <span class=\"wl wl-kjv\" data-code=\"H5619\">stoned,</span> and was <span class=\"wl wl-kjv\" data-code=\"H4191\">dead,</span> that <span class=\"wl wl-kjv\" data-code=\"H348\">Jezebel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab,</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">Arise,</span> take <span class=\"wl wl-kjv\" data-code=\"H3423\">possession</span> of the <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyard</span> of <span class=\"wl wl-kjv\" data-code=\"H5022\">Naboth</span> the <span class=\"wl wl-kjv\" data-code=\"H3158\">Jezreelite,</span> which he <span class=\"wl wl-kjv\" data-code=\"H3985\">refused</span> to <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thee for <span class=\"wl wl-kjv\" data-code=\"H3701\">money:</span> for <span class=\"wl wl-kjv\" data-code=\"H5022\">Naboth</span> is not <span class=\"wl wl-kjv\" data-code=\"H2416\">alive,</span> but <span class=\"wl wl-kjv\" data-code=\"H4191\">dead.</span>","16":"And it came to pass, when <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> that <span class=\"wl wl-kjv\" data-code=\"H5022\">Naboth</span> was <span class=\"wl wl-kjv\" data-code=\"H4191\">dead,</span> that <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> rose <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> to go <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to the <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyard</span> of <span class=\"wl wl-kjv\" data-code=\"H5022\">Naboth</span> the <span class=\"wl wl-kjv\" data-code=\"H3158\">Jezreelite,</span> to take <span class=\"wl wl-kjv\" data-code=\"H3423\">possession</span> of it.","17":"And the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> came to <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah</span> the <span class=\"wl wl-kjv\" data-code=\"H8664\">Tishbite,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span>","18":"<span class=\"wl wl-kjv\" data-code=\"H6965\">Arise,</span> go <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> which is in <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria:</span> behold, he is in the <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyard</span> of <span class=\"wl wl-kjv\" data-code=\"H5022\">Naboth,</span> whither he is gone <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to <span class=\"wl wl-kjv\" data-code=\"H3423\">possess</span> it.","19":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> Hast thou <span class=\"wl wl-kjv\" data-code=\"H7523\">killed,</span> and also taken <span class=\"wl wl-kjv\" data-code=\"H3423\">possession?</span> And thou shalt <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> In the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> where <span class=\"wl wl-kjv\" data-code=\"H3611\">dogs</span> <span class=\"wl wl-kjv\" data-code=\"H3952\">licked</span> the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> of <span class=\"wl wl-kjv\" data-code=\"H5022\">Naboth</span> shall <span class=\"wl wl-kjv\" data-code=\"H3611\">dogs</span> <span class=\"wl wl-kjv\" data-code=\"H3952\">lick</span> thy <span class=\"wl wl-kjv\" data-code=\"H1818\">blood,</span> even thine.","20":"And <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah,</span> Hast thou <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> me, O mine <span class=\"wl wl-kjv\" data-code=\"H341\">enemy?</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> I have <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> thee: because thou hast <span class=\"wl wl-kjv\" data-code=\"H4376\">sold</span> thyself to <span class=\"wl wl-kjv\" data-code=\"H6213\">work</span> <span class=\"wl wl-kjv\" 1696\">spake</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> The <span class=\"wl wl-kjv\" data-code=\"H3611\">dogs</span> shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> <span class=\"wl wl-kjv\" data-code=\"H348\">Jezebel</span> by the <span class=\"wl wl-kjv\" data-code=\"H2426\">wall</span> of <span class=\"wl wl-kjv\" data-code=\"H3157\">Jezreel.</span>","24":"Him that <span class=\"wl wl-kjv\" data-code=\"H4191\">dieth</span> of <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> in the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> the <span class=\"wl wl-kjv\" data-code=\"H3611\">dogs</span> shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat;</span> and him that <span class=\"wl wl-kjv\" data-code=\"H4191\">dieth</span> in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> shall the <span class=\"wl wl-kjv\" data-code=\"H5775\">fowls</span> of the <span class=\"wl wl-kjv\" data-code=\"H8064\">air</span> <span class=\"wl wl-kjv\" data-code=\"H398\">eat.</span>","25":"But there was none like unto <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab,</span> which did <span class=\"wl wl-kjv\" data-code=\"H4376\">sell</span> himself to <span class=\"wl wl-kjv\" data-code=\"H6213\">work</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">wickedness</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> whom <span class=\"wl wl-kjv\" data-code=\"H348\">Jezebel</span> his <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> stirred <span class=\"wl wl-kjv\" data-code=\"H5496\">up.</span>","26":"And he did <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H8581\">abominably</span> in <span class=\"wl wl-kjv\" data-code=\"H3212\">following</span> <span class=\"wl wl-kjv\" data-code=\"H1544\">idols,</span> according to all things as <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> the <span class=\"wl wl-kjv\" data-code=\"H567\">Amorites,</span> whom the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> cast <span class=\"wl wl-kjv\" data-code=\"H3423\">out</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","27":"And it came to pass, when <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> those <span class=\"wl wl-kjv\" data-code=\"H1697\">words,</span> that he <span class=\"wl wl-kjv\" data-code=\"H7167\">rent</span> his <span class=\"wl wl-kjv\" data-code=\"H899\">clothes,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> <span class=\"wl wl-kjv\" data-code=\"H8242\">sackcloth</span> upon his <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh,</span> and <span class=\"wl wl-kjv\" data-code=\"H6684\">fasted,</span> and <span class=\"wl wl-kjv\" data-code=\"H7901\">lay</span> in <span class=\"wl wl-kjv\" data-code=\"H8242\">sackcloth,</span> and <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> <span class=\"wl wl-kjv\" data-code=\"H328\">softly.</span>","28":"And the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> came to <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah</span> the <span class=\"wl wl-kjv\" data-code=\"H8664\">Tishbite,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span>","29":"<span class=\"wl wl-kjv\" data-code=\"H7200\">Seest</span> thou how <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> <span class=\"wl wl-kjv\" data-code=\"H3665\">humbleth</span> himself <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> me? <span class=\"wl wl-kjv\" data-code=\"H3282\">because</span> he <span class=\"wl wl-kjv\" data-code=\"H3665\">humbleth</span> himself <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> me, I will not <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> the <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> in his <span class=\"wl wl-kjv\" data-code=\"H3117\">days:</span> but in his <span class=\"wl wl-kjv\" data-code=\"H1121\">son's</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> will I <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> the <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> upon his <span class=\"wl wl-kjv\" data-code=\"H1004\">house.</span>"}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
