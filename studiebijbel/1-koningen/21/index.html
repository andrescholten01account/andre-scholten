 gesproken had. 's Morgens, toen het licht werd, liet men deze mannen vertrekken, hen en hun ezels.","1 Kon 11:3":"En hij had zevenhonderd vrouwen, vorstinnen, en driehonderd bijvrouwen, en zijn vrouwen deden zijn hart neigen.","Fil 3:18":"Want velen wandelen anders; over wie ik u dikwijls gezegd heb, en nu ook wenend zeg, dat zij vijanden zijn van het kruis van Christus;","1 Kon 22:52-54":"Ahazia, de zoon van Achab, werd koning over Israël te Samaria, in het zeventiende jaar van Josafat, de koning van Juda, en regeerde twee jaar over Israël. En hij deed wat kwaad was in de ogen van de HEERE; want hij wandelde in de weg van zijn vader, en in de weg van zijn moeder, en in de weg van Jerobeam, de zoon van Nebat, die Israël deed zondigen. En hij diende Baäl, en boog zich voor hem neer, en tergde de HEERE, de God van Israël, naar alles wat zijn vader gedaan had.","Pred 8:12":"Hoewel een zondaar honderd maal kwaad doet, en God zijn dagen verlengt, weet ik toch zeker, dat het hun goed zal gaan die God vrezen, die voor Zijn aangezicht vrezen.","Matt 25:30":"En werp de nutteloze dienstknecht buiten, in de uiterste duisternis; daar zal geween zijn en het geknars van de tanden.","Matt 23:14":"Wee u, Schriftgeleerden en Farizeeën, huichelaars, want u eet de huizen van de weduwen op, en dat onder de schijn van lang te bidden; daarom zult u des te zwaarder oordeel ontvangen.","Richt 11:5-11":"Toen nu de kinderen van Ammon tegen Israël streden, gingen de oudsten van Gilead heen om Jeftha te halen uit het land van Tob. En zij zeiden tegen Jeftha: Kom, en word onze aanvoerder, zodat wij kunnen strijden tegen de kinderen van Ammon. Maar Jeftha zei tegen de oudsten van Gilead: Hebt u mij niet gehaat, en mij uit het huis van mijn vader verstoten? Waarom bent u dan nu naar mij toegekomen, nu u in benauwdheid verkeert?","Ex 30:16":"U dan moet het geld van de verzoeningen van de kinderen van Israël nemen, en het bestemmen voor de dienst van de tent van de samenkomst; en het zal voor de kinderen van Israël een gedachtenis zijn, voor het aangezicht van de HEERE, om voor uw zielen verzoening te doen.","Matt 6:23":"maar als uw oog slecht is, zal heel uw lichaam duister zijn. Als dan het licht dat in u is duisternis is, hoe groot is dan die duisternis!","1 Sam 26:9-11":"David zei daarentegen tegen Abisai: Breng hem niet om; want wie heeft ooit zijn hand tegen de gezalfde van de HEERE opgeheven en is onschuldig gebleven? Verder zei David: Zo waarachtig als de HEERE leeft, de HEERE zal hem slaan, of zijn dag zal komen dat hij zal sterven, of hij zal in een strijd trekken en daarin omkomen. De HEERE late het verre van mij zijn, dat ik mijn hand zou leggen aan de gezalfde van de HEERE! Neem toch nu de speer die bij zijn hoofdeinde ligt, en de waterfles, en laten we gaan.","1 Kon 19:2":"Toen stuurde Izebel een bode naar Elia, om te zeggen: Zo mogen de goden mij doen, en nog erger, als ik uw leven niet morgen omstreeks deze tijd maak als het leven van één van hen.","Hand 27:22":"Maar nu vermaan ik u om moed te houden; want er zal geen enkel leven onder u verloren gaan, alleen het schip.","Ps 92:10":"Want zie, Uw vijanden, o HEERE! Want zie, Uw vijanden zullen vergaan; al de werkers van de ongerechtigheid zullen verstrooid worden.","Luk 19:26":"Want ik zeg u dat ieder die heeft, gegeven zal worden; maar van hem die niet heeft, zal ook wat hij heeft afgenomen worden.","Gen 43:12-23":"En neem dubbel geld in uw hand; en breng het geld, dat in de opening van uw zakken teruggekeerd is, weer terug in uw hand; misschien is het een vergissing. Neem ook uw broer mee, en maak u op, ga terug naar die man. En God, de Almachtige, geve u barmhartigheid bij die man, dat hij uw andere broer en Benjamin met u laat teruggaan! En wat mij aangaat, als ik van mijn kinderen beroofd word, dan ben ik maar beroofd!","Matt 26:14":"Toen ging één van de twaalf, Judas Iskariot genaamd, naar de overpriesters,","1 Sam 15:16-19":"Toen zei Samuël tegen Saul: Houd op, dan zal ik u vertellen wat de HEERE vannacht tot mij gesproken heeft. Hij dan zei tegen hem: Spreek. En Samuël zei: Is het niet zo, toen u klein was in uw eigen ogen, dat u het hoofd van de stammen van Israël geworden bent, en dat de HEERE u tot koning over Israël gezalfd heeft? En de HEERE heeft u op weg gezonden, en gezegd: Ga heen en verban de zondaars, de Amalekieten, en strijd tegen hen, totdat u hen vernietigt.","Jes 65:12-14":"Ik zal u ook tellen voor het zwaard, zodat u zich allen ter slachting zult buigen, omdat Ik geroepen heb, maar u hebt niet geantwoord; Ik gesproken heb, maar u hebt niet gehoord; maar hebt gedaan wat kwaad was in Mijn ogen, en hebt gekozen waaraan Ik geen lust heb. Daarom zegt de Heere HEERE zo: Zie, Mijn knechten zullen eten, maar u zult hongeren; zie, Mijn knechten zullen drinken, maar u zult dorsten; zie, Mijn knechten zullen blij zijn, maar u zult beschaamd zijn. Zie, Mijn knechten zullen juichen van een goed hart, maar u zult schreeuwen van harteleed, en van verbreking van de geest zult u huilen.","Rom 6:19":"Ik spreek op menselijke wijze, vanwege de zwakheid van uw vlees; want zoals u uw leden gesteld hebt om dienstbaar te zijn aan de onreinheid en de ongerechtigheid, tot ongerechtigheid, zo stel nu uw leden om dienstbaar te zijn aan de gerechtigheid, tot heiliging.","Matt 4:16":"het volk dat in duisternis zat, heeft een groot licht gezien; en over hen die zaten in het land en de schaduw van de dood, is een licht opgegaan.","Mark 7:21":"Want van binnenuit, uit het hart van de mensen, komen voort kwade gedachten, overspel, hoererijen, moorden,","1 Kon 21:5-13":"Maar Izebel, zijn vrouw, kwam bij hem en zei tegen hem: Wat is dit, dat uw geest zo knorrig is, en dat u geen brood eet? En hij zei tegen haar: Omdat ik tot Naboth, de Jizreëliet, gesproken heb en tegen hem gezegd heb: Geef mij uw wijngaard voor geld, of, als het u zint, zal ik u een andere wijngaard in zijn plaats geven; maar hij heeft gezegd: Ik zal u mijn wijngaard niet geven. Toen zei Izebel, zijn vrouw, tegen hem: Regeert u nu het koninkrijk over Israël? Sta op, eet brood, en laat uw hart vrolijk zijn; ik zal u de wijngaard van Naboth, de Jizreëliet, geven.","Micha 2:1":"Wee hun die onrecht bedenken en kwaad beramen op hun slaapplaatsen; in het licht van de morgen doen zij het, omdat het in de macht van hun hand is.","Ps 139:19":"O God! Dat U de goddeloze zou ombrengen! En u, mannen van het bloed, wijkt van mij!","Jer 25:31":"Het geschal zal komen tot aan het einde van de aarde; want de HEERE heeft een geschil met de volken, Hij zal gericht houden met alle vlees; de goddelozen heeft Hij aan het zwaard overgegeven, spreekt de HEERE.","2 Kron 24:14":"Toen zij het nu klaar hadden, brachten zij voor de koning en Jojada het overige van het geld, waarvan hij vaten maakte voor het huis van de HEERE, vaten om te dienen en te offeren, en rookschalen, en gouden en zilveren vaten; en zij offerden voortdurend brandoffers in het huis van de HEERE, al de dagen van Jojada.","Num 36:1":"En de familiehoofden van het geslacht van de kinderen van Gilead, de zoon van Machir, de zoon van Manasse, uit de geslachten van de kinderen van Jozef, traden naar voren en spraken voor Mozes en voor de leiders, de familiehoofden van de kinderen van Israël.","Hebr 9:17":"want een testament is van kracht bij de doden, omdat het geen kracht heeft zolang hij die het testament maakte leeft.","Ps 109:6-19":"Stel een goddeloze over hem, en de satan sta aan zijn rechterhand. Als hij geoordeeld wordt, laat hij dan schuldig uitgaan, en zijn gebed moet tot zonde worden. Laat zijn dagen weinig zijn; een ander neemt zijn ambt;","1 Tim 1:10":"De hoereerders, mannen die met mannen omgang hebben, de mensenrovers, de leugenaars, de meinedigen, en al wat verder tegen de gezonde leer ingaat;","2 Kon 17:22":"Zo wandelden de kinderen van Israël in alle zonden van Jerobeam die hij gedaan had; zij weken daar niet van af;","Hand 24:5":"Want wij hebben deze man bevonden een pest te zijn, en iemand die oproer verwekt onder alle Joden, door de hele wereld, en een leidend voorstander van de sekte der Nazarenen.","Ezech 22:20":"Zoals zilver, of koper, of ijzer, of lood, of tin in het midden van een oven verzameld wordt, om het vuur daarover op te blazen, zodat men het smelt, zo zal Ik u verzamelen in Mijn toorn, en in Mijn grimmigheid daar laten liggen en smelten.","Ex 20:13":"U zult niet doodslaan.","Mal 4:1":"Want zie, die dag komt, brandend als een oven. Dan zullen alle hoogmoedigen, en ieder die goddeloosheid doet, een stoppel zijn, en de komende dag zal ze in vlam zetten, zegt de HEERE van de heerscharen, Die hun noch wortel, noch tak laten zal.","Jer 5:26-28":"Want onder Mijn volk worden goddelozen gevonden; ieder van hen loert, zoals de vogelvanger zich schikt; zij zetten een verderfelijke strik, zij vangen de mensen. Zoals een kooi vol is van vogels, zo zijn hun huizen vol van bedrog; daarom zijn zij groot en rijk geworden. Zij zijn vet, zij zijn glad, zelfs de daden van de bozen gaan zij te boven; de rechtszaak richten zij niet, zelfs de rechtszaak van de wees niet, toch is het hun voorspoedig; ook oordelen zij het recht van de behoeftigen niet.","Hos 14:10":"Wie is wijs? die begrijpt deze dingen; wie is verstandig? die bekent ze; want de wegen van de Heere zijn recht, en de rechtvaardigen zullen daarin wandelen, maar de overtreders zullen daarin vallen.","Deut 19:15":"Eén enkele getuige zal tegen niemand opstaan in verband met enige ongerechtigheid of enige zonde, van welke zonde hij ook zou hebben gezondigd; op de verklaring van twee getuigen, of op de verklaring van drie getuigen, zal de zaak vaststaan.","Jes 13:11":"Want Ik zal over de wereld de boosheid bezoeken, en over de goddelozen hun ongerechtigheid; en Ik zal de hoogmoed van de trotsen doen ophouden, en de hovaardij van de tirannen zal Ik vernederen.","2 Kon 5:26":"Maar hij zei tegen hem: Ging mijn hart niet mee, toen die man zich van zijn wagen omkeerde, u tegemoet? Was dit het moment om dat zilver aan te ker gevonden is, die zal mijn slaaf zijn; maar u, trek in vrede op naar uw vader.","Micha 2:3":"Daarom, zo zegt de HEERE: Zie, Ik bedenk een kwaad over dit geslacht, waaruit u uw halzen niet zult uittrekken, en zo rechtop niet zult gaan; want het zal een boze tijd zijn.","2 Sam 23:15-17":"En David kreeg lust en zei: Wie zal mij water te drinken geven uit Bethlehems bornput, die in de poort is? Toen braken die drie helden door het leger van de Filistijnen, en putten water uit Bethlehems bornput, die in de poort is, en droegen het, en kwamen bij David; maar hij wilde dat niet drinken, maar goot het uit voor de HEERE. En hij zei: Het zij verre van mij, o HEERE, dat ik dit zou doen; zou ik het bloed drinken van de mannen die heengegaan zijn met gevaar voor hun leven? En hij wilde het niet drinken. Dit deden die drie helden.","Ezech 3:18-20":"Als Ik tot de goddeloze zeg: U zult zeker sterven, en u waarschuwt hem niet, en spreekt niet, om de goddeloze van zijn goddeloze weg te waarschuwen, opdat u hem in het leven behoudt; die goddeloze zal in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen. Doch als u de goddeloze waarschuwt, en hij zich van zijn goddeloosheid en van zijn goddeloze weg niet bekeert, zal hij in zijn ongerechtigheid sterven; maar u hebt uw ziel bevrijd. Als ook een rechtvaardige zich van zijn gerechtigheid afkeert, en onrecht doet, en Ik een aanstoot voor zijn gezicht leg, zal hij sterven; omdat u hem niet gewaarschuwd hebt, zal hij in zijn zonde sterven, en zijn gerechtigheden, die hij gedaan heeft, zullen niet gedacht worden; maar zijn bloed zal Ik van uw hand eisen.","Neh 5:4":"Evenzo waren er die zeiden: Wij hebben geld geleend voor de belasting van de koning, op onze akkers en onze wijngaarden.","Micha 7:2-4":"De goedertierene is verdwenen uit het land, en er is niemand oprecht onder de mensen; zij loeren allemaal op bloed, zij jagen, ieder op zijn broeder, met een jachtnet. Om met beide handen goed hun best te doen om kwaad te doen, zo eist de vorst, en de rechter oordeelt om vergelding; en de grote spreekt de verderving van zijn ziel uit, en zij draaien het samen dicht ineen. De beste van hen is als een doorn; de oprechtste is scherper dan een doornheg; de dag van uw wachters, uw bezoeking, is gekomen; nu zal hun verwarring zijn.","Matt 13:38-42":"En de akker is de wereld; en het goede zaad, dat zijn de kinderen van het koninkrijk; en het onkruid zijn de kinderen van de boze; En de vijand die het gezaaid heeft, is de duivel; en de oogst is de voleinding van de wereld; en de maaiers zijn de engelen. Zoals dan het onkruid verzameld en met vuur verbrand wordt, zo zal het ook zijn in de voleinding van deze wereld.","Spr 18:3":"Als de goddeloze komt, komt ook de verachting, en met schande smaad.","2 Sam 23:6":"Maar de mannen van Belial zullen allemaal zijn als doornen, die weggeworpen worden, omdat men ze met de hand niet kan vatten;","2 Sam 16:4":"Zo zei de koning tegen Ziba: Zie, alles wat Mefiboseth heeft, zal van u zijn. En Ziba zei: Ik buig mij neer, laat mij genade vinden in uw ogen, mijn heer koning!","2 Kon 15:20":"Menahem nu bracht dit geld op van Israël, van alle vermogende mannen, om aan de koning van Assyrië te geven, voor elke man vijftig zilveren sikkels; zo keerde de koning van Assyrië terug, en bleef daar niet in het land.","Rom 9:8":"Dat is: niet de kinderen van het vlees zijn kinderen van God, maar de kinderen van de belofte worden als nageslacht gerekend.","Deut 23:19":"U zult uw broeder geen rente laten betalen, rente van geld, rente van voedsel, rente van enig ding waarover men rente vraagt.","Ef 5:6":"Laat niemand u verleiden met loze woorden; want om deze dingen komt de toorn van God over de kinderen van de ongehoorzaamheid.","Spr 14:19":"De kwaden buigen neer voor de goeden, en de goddelozen voor de poorten van de rechtvaardige.","Spr 10:27-31":"De vreze van de HEERE vermeerdert de dagen; maar de jaren van de goddelozen worden verkort. De hoop van de rechtvaardigen is n kracht, het recht van de eerstgeboorte komt hem toe.","Job 21:7-33":"Waarom leven de goddelozen, worden oud, ja, worden geweldig in vermogen? Hun nakomelingen zijn bestendig bij hen voor hun ogen, en hun spruiten voor hun aangezicht. Hun huizen hebben vrede zonder vrees, en de roede van God is niet op hen.","Jer 8:20-22":"De oogst is voorbij, de zomer is ten einde; nog zijn wij niet verlost. Ik ben gebroken vanwege de breuk van de dochter van mijn volk; ik ga gehuld in het zwart, ontzetting heeft mij aangegrepen. Is er geen balsem in Gilead? Is er geen heelmeester daar? Want waarom is de genezing van de dochter van mijn volk niet gekomen?","1 Kon 21:7-19":"Toen zei Izebel, zijn vrouw, tegen hem: Regeert u nu het koninkrijk over Israël? Sta op, eet brood, en laat uw hart vrolijk zijn; ik zal u de wijngaard van Naboth, de Jizreëliet, geven. Zij schreef dan brieven in de naam van Achab, en verzegelde ze met zijn zegel; en zond de brieven aan de oudsten en aan de edelen, die in zijn stad waren, wonend bij Naboth. En zij schreef in die brieven: Roept een vasten uit, en zet Naboth vooraan onder het volk;","Spr 19:5":"Een vals getuige zal niet onschuldig blijven; en die leugens waait, zal niet ontkomen.","Lev 25:23":"Het land ook zal niet voor altijd verkocht worden; want het land is van Mij, omdat u vreemdelingen en bijwoners bij Mij bent.","Matt 25:41":"Dan zal Hij ook zeggen tegen hen die aan de linkerhand zijn: Ga weg van Mij, u vervloekten, in het eeuwige vuur, dat voor de duivel en zijn engelen bereid is.","Jer 22:17":"Maar uw ogen en uw hart zijn nergens op gericht dan op uw hebzucht, en op onschuldig bloed, om dat te vergieten, en op verdrukking en geweld, om die te doen.","Matt 9:3":"En zie, sommigen van de Schriftgeleerden zeiden bij zichzelf: Deze man lastert God.","2 Sam 21:10":"Toen nam Rizpa, de dochter van Aja, een rouwkleed, en spande dit voor zich uit op een rotssteen, vanaf het begin van de oogst, totdat er water op hen drupte uit de hemel; en zij liet het gevogelte van de hemel overdag niet op hen rusten, en het gedierte van het veld 's nachts ook niet.","Luk 18:20":"U kent de geboden: U zult geen overspel doen; u zult niet doden; u zult niet stelen; u zult geen valse getuigenis geven; eer uw vader en uw moeder.","Luk 13:3":"Ik zeg u: Nee; maar als u zich niet bekeert, zult u allen net zo omkomen.","Jer 49:12":"Want zo zegt de HEERE: Zie, van hen wier oordeel het niet is de beker te drinken, zullen er helemaal drinken; en zou u dan enigszins ongestraft blijven? U zult niet ongestraft blijven, maar u zult helemaal drinken.","Ps 64:9":"En hun tong zal hen doen struikelen tegen zichzelf; ieder, die hen ziet, zal wegvluchten.","2 Kon 10:11-14":"Daartoe sloeg Jehu al de overgeblevenen van het huis van Achab te Jizreël, en al zijn groten, en zijn bekenden, en zijn priesters; totdat hij hem geen overigen liet overblijven. En hij maakte zich op, en trok heen en ging naar Samaria; en toen hij was te Beth-heked van de herders, onderweg, vond Jehu de broeders van Ahazia, de koning van Juda, en hij zei: Wie bent u? En zij zeiden: Wij zijn de broeders van Ahazia, en zijn afgekomen, om de zonen van de koning en de zonen van de koningin te groeten.","Num 18:16":"Wie hiervan gelost zullen worden, zult u van een maand oud lossen, naar uw schatting, voor het geld van vijf sikkels, naar de sikkel van het heiligdom, die is twintig gera.","Luk 23:2":"En zij begonnen Hem te beschuldigen en zeiden: Wij hebben bevonden dat Deze het volk verkeerd voorlicht, en verbiedt de keizer schattingen te geven, en zegt dat Hij Zelf Christus, de Koning is.","Gen 3:16-19":"Tegen de vrouw zei Hij: Ik zal uw smart zeer vermeerderen, namelijk de smart van uw zwangerschap; met smart zult u kinderen baren; en naar uw man zal uw begeerte uitgaan, en hij zal over u heersen. En tegen Adam zei Hij: Omdat u geluisterd hebt naar de stem van uw vrouw, en van die boom hebt gegeten waarvan Ik u geboden had: Daarvan zult u niet eten; is het aardrijk vervloekt om u; en met smart zult u daarvan eten, alle dagen van uw leven. Ook zal het u doornen en distels laten opgroeien, en u zult het gewas van het veld eten.","Ex 20:16":"U zult geen valse getuigenis spreken tegen uw naaste.","Ex 22:25":"Als u Mijn volk, dat arm is onder u, geld leent, mag u zich niet als een woekeraar tegenover hen gedragen; u mag geen rente van hen vragen.","Ps 89:32":"als zij Mijn inzettingen ontheiligen, en Mijn geboden niet houden;","1 Petr 4:17":"Want het is de tijd dat het oordeel moet beginnen bij het huis van God; en als het eerst bij ons begint, wat zal dan het einde zijn van hen die het Evangelie van God ongehoorzaam zijn?","Ps 107:17":"De zotten worden geplaagd om de weg van hun overtreding, en om hun ongerechtigheden;","Rom 14:23":"Maar hij die twijfelt, is veroordeeld als hij eet, omdat hij niet uit het geloof eet. En alles wat niet uit het geloof is, dat is zonde.","Gen 6:3":"Toen zei de HEERE: Mijn Geest zal niet in eeuwigheid twisten met de mens, omdat hij ook vlees is; doch zijn dagen zullen honderdtwintig jaren zijn.","Joh 3:36":"Wie in de Zoon gelooft, heeft het eeuwige leven; maar wie de Zoon ongehoorzaam is, zal het leven niet zien, maar de toorn van God blijft op hem.","Neh 13:26":"Heeft Salomo, de koning van Israël, daarin niet gezondigd, hoewel er onder veel heidenvolken geen koning was zoals hij, en hij door zijn God bemind was, en God hem tot koning over heel Israël gesteld had? Ook hem lieten de vreemde vrouwen zondigen.","Matt 18:11":"Want de Zoon des mensen is gekomen om dat wat verloren was, zalig te maken.","Lev 18:25-30":"Zodat het land onrein is, en Ik over hen zijn ongerechtigheid bezoek, en het land zijn inwoners uitspuwt. Maar u zult Mijn inzettingen en Mijn rechten onderhouden, en van al die gruwelen niets doen, inboorling noch vreemdeling, die te midden van u als vreemdeling verkeert. Want de mensen van dit land, die vóór u geweest zijn, hebben al deze gruwelen gedaan; en het land is onrein geworden.","Lev 24:11-16":"Toen lasterde de zoon van de Israëlitische vrouw uitdrukkelijk de NAAM, en vloekte; daarom brachten zij hem tot Mozes; de naam van zijn moeder nu was Selomith, de dochter van Dibri, van de stam Dan. En zij zetten hem in bewaring, totdat hun, naar de mond van de HEERE, uitspraak gedaan zou worden. En de HEERE sprak tot Mozes en zei:","Spr 12:3":"De mens zal niet bevestigd worden door goddeloosheid; maar de wortel van de rechtvaardigen zal niet bewogen worden.","Luk 23:31":"Want als zij dit doen aan het groene hout, wat zal er dan aan het dorre gebeuren?","1 Kon 21:2-16":"Achab sprak tot Naboth en zei: Geef mij uw wijngaard, opdat hij mij tot een kruidhof zij, omdat hij dicht bij mijn huis is; en ik zal u ervoor een wijngaard geven die beter is dan die; of, als het goed is in uw ogen, zal ik u de waarde ervan in geld geven. Maar Naboth zei tegen Achab: Dat de HEERE ver van mij houde, dat ik u de erfenis van mijn vaderen zou geven! Toen kwam Achab in zijn huis, knorrig en toornig over het woord dat Naboth, de Jizreëliet, tot hem gesproken had, want hij had gezegd: Ik zal de erfenis van mijn vaderen niet geven. En hij legde zich neer op zijn bed, keerde zijn gezicht om, en at geen brood.","Ps 27:12":"Geef mij niet over in de begeerte van mijn tegenstanders; want valse getuigen zijn tegen mij opgestaan, alsook wie geweld uitblaast.","Jes 33:14":"De zondaars in Sion zijn verschrikt; beving heeft de huichelaars aangegrepen; zij zeggen: Wie onder ons kan bij een verterend vuur wonen? Wie onder ons kan bij een eeuwige gloed wonen?","Job 4:8":"Maar zoals ik gezien heb: wie ondeugd ploegen en moeite zaaien, maaien dat ook.","Gal 3:15":"Broeders, ik spreek naar de mens: zelfs bij het verbond van een mens, dat bevestigd is, doet niemand het teniet, en niemand voegt er iets aan toe.","Pred 8:14":"Er is nog een vluchtigheid, die op aarde gebeurt: dat er rechtvaardigen zijn, die overkomt wat de goddelozen toekomt, en er zijn goddelozen, die overkomt wat de rechtvaardigen toekomt. Ik zeg, dat dit ook vluchtigheid is.","2 Kron 34:14":"En toen zij het geld uithaalden dat naar het huis van de HEERE gebracht was, vond de priester Hilkia het wetboek van de HEERE, dat door de hand van Mozes gegeven was.","1 Joh 3:8":"Die de zonde doet, is uit de duivel; want de duivel zondigt vanaf het begin. Hiertoe is de Zoon van God geopenbaard, opdat Hij de werken van de duivel zou verbreken.","Klaagl 3:3":"Aleph. Hij heeft Zich zeker tegen mij gewend, Hij heeft Zijn hand de hele dag veranderd.","Jes 33:11":"U gaat met stro zwanger, u zult stoppels baren; uw geest zal u als vuur verslinden.","Ps 92:8":"Dat de goddelozen groeien als het gras, en al de werkers van de ongerechtigheid bloeien, opdat zij tot in eeuwigheid weggevaagd worden.","Ezech 16:40":"Daarna zullen zij een menigte tegen u laten opkomen, en zij zullen u met stenen stenigen, en u met hun zwaarden doorsteken.","Lev 20:23":"En wandel niet in de gewoonten van het volk, dat Ik voor uw aangezicht wegjaag; want al deze dingen hebben zij gedaan; daarom ben Ik verdrietig op hen geworden.","Spr 1:15":"Mijn zoon! wandel niet met hen op de weg; weer uw voet van hun pad.","2 Tess 1:5-9":"Een bewijs van het rechtvaardige oordeel van God, opdat u waardig geacht wordt voor het Koninkrijk van God, waarvoor u ook lijdt; Aangezien het recht is bij God, verdrukking te vergelden aan hen die u verdrukken; En aan u, die verdrukt wordt, verkwikking te geven met ons, bij de openbaring van de Heere Jezus vanuit de hemel met de engelen van Zijn kracht;","2 Tim 3:2-13":"Want de mensen zullen zijn: liefhebbers van zichzelf, geldgierig, grootsprakerig, hoogmoedig, lasteraars, aan hun ouders ongehoorzaam, ondankbaar, onheilig, zonder natuurlijke liefde, onverzoenlijk, kwaadsprekers, onmatig, wreed, zonder liefde tot het goede, verraders, roekeloos, opgeblazen, meer liefhebbers van de wellusten dan liefhebbers van God;","Spr 28:17":"Een mens, gedrukt door het bloed van iemand, zal naar de kuil toevluchten; men houde hem niet tegen!","Jer 13:16":"Geeft eer aan de HEERE, uw God, voor Hij het duister maakt, en voor uw voeten zich stoten aan de schemerende bergen; terwijl u naar licht uitkijkt, en Hij dat tot een schaduw van de dood maakt, en tot diepe duisternis zet.","Deut 5:17":"U zult niet doodslaan.","Amos 7:10":"Toen stuurde Amazia, de priester te Beth-el, iemand naar Jerobeam, de koning van Israël, en zei: Amos heeft een samenzwering tegen u gesmeed, in het midden van het huis van Israël; het land kan al zijn woorden niet verdragen.","2 Kon 12:7-16":"Toen riep koning Joas de priester Jojada en de andere priesters, en zei tegen hen: Waarom herstelt u niet de breuken van het huis? Nu dan, neem geen geld van uw bekenden aan, tenzij u het geeft voor de breuken van het huis. En de priesters stemden erin toe geen geld van het volk aan te nemen, noch de breuken van het huis te herstellen. Maar de priester Jojada nam een kist, en boorde een gat in het deksel ervan, en zette die bij het altaar aan de rechterkant, waar iemand het huis van de HEERE binnenkwam; en de priesters die de drempel bewaakten, staken daarin al het geld dat naar het huis van de HEERE gebracht werd.","Pred 10:19":"Men maakt maaltijden om te lachen, en de wijn verheugt de levenden, en het geld verschaft alles.","Deut 32:10":"Hij vond hem in een land van de woestijn, en in een woeste huilende wildernis; Hij voerde hem rondom, Hij onderwees hem, Hij bewaarde hem als Zijn oogappel.","Mark 4:25":"Want wie heeft, aan hem zal gegeven worden; en wie niet heeft, van hem zal ook afgenomen worden wat hij heeft.","2 Sam 11:25-27":"Toen zei David tegen de bode: Zo moet u tegen Joab zeggen: Laat deze zaak niet kwaad zijn in uw ogen, want het zwaard verteert zowel de een als de ander; versterk uw strijd tegen de stad, en verstoor haar; bemoedig hem zo. Toen de vrouw van Uria hoorde dat haar man Uria dood was, droeg zij leed over haar heer. En toen de rouw voorbij was, stuurde David iemand heen, en nam haar in zijn huis; en zij werd hem tot vrouw, en baarde hem een zoon. Doch deze daad, die David gedaan had, was kwaad in de ogen van de HEERE.","Spr 11:5-8":"De gerechtigheid van de oprechte maakt zijn weg recht; maar de goddeloze valt door zijn goddeloosheid. De gerechtigheid van de vromen zal hen redden; maar de trouwelozen worden gevangen in hun eigen verkeerdheid. Als de goddeloze mens sterft, vergaat zijn verwachting; zelfs de allersterkste hoop is vergaan.","Pred 7:26":"En ik vond iets bitterders dan de dood: een vrouw, wier hart netten en garen, en haar handen boeien zijn; wie goed is voor Gods aangezicht, zal aan haar ontkomen; daarentegen zal de zondaar door haar gevangen worden.","Deut 2:28":"Verkoop mij voedsel voor geld, dat ik eet, en geef mij water voor geld, dat ik drink; laat mij alleen te voet doortrekken;","Lev 20:22":"Houd dan al Mijn inzettingen en al Mijn rechten, en doe ze; opdat het land waarheen Ik u breng om daarin te wonen, u niet uitspuwt.","Job 10:14":"Als ik zondig, dan zult U mij in het oog houden, en van mijn misdaad zult U mij niet onschuldig houden.","Ps 68:7":"Een God, Die de eenzamen zet in een gezin, uitleidt wie in boeien gevangen zitten; maar de afvalligen wonen in het dorre land.","Jes 59:3":"Want uw handen zijn met bloed bevlekt, en uw vingers met ongerechtigheid; uw lippen spreken valsheid, uw tong spreekt onrecht uit.","Hoogl 4:15":"O fontein van de hoven, put van levend water, dat uit de Libanon vloeit!","Openb 16:2-21":"En de eerste ging heen, en goot zijn schaal uit op de aarde; en er kwam een kwaad en boosaardig gezwel aan de mensen, die het merkteken van het beest hadden, en die zijn beeld aanbaden. En de tweede engel goot zijn schaal uit in de zee, en zij werd bloed als van een dode; en elke levende ziel in de zee stierf. En de derde engel goot zijn schaal uit in de rivieren en in de bronnen van het water; en het water werd bloed.","Gen 42:25-35":"En Jozef gebood dat men hun zakken met koren vullen zou, en dat men hun geld terug zou geven, ieder in zijn zak, en dat men hun proviand zou geven voor onderweg; en men deed hun zo. En zij laadden hun koren op hun ezels, en trokken vandaar weg. Toen één zijn zak opendeed om zijn ezel voer te geven in de herberg, zag hij zijn geld; want zie, het was in de opening van zijn zak.","Rom 1:32":"die, hoewel zij het recht van God kennen, namelijk dat zij die zulke dingen doen de dood waard zijn, deze dingen niet alleen doen, maar ook nog instemming betonen aan hen die ze doen.","1 Kon 18:17":"En het gebeurde, toen Achab Elia zag, dat Achab tegen hem zei: Bent u degene die Israël in beroering brengt?","Jer 11:8":"Maar zij hebben niet gehoord, en ook hun oor niet geneigd, maar hebben gewandeld, ieder naar het goeddunken van hun boze hart; daarom heb Ik over hen gebracht al de woorden van dit verbond, dat Ik geboden had te doen, maar zij hebben het niet gedaan.","Ezech 3:7":"Maar het huis Israëls wil naar u niet horen, omdat zij naar Mij niet willen horen; want het hele huis Israëls is stijf van voorhoofd, en hard van hart zijn zij.","Ps 2:5":"Dan zal Hij tot hen spreken in Zijn toorn, en in Zijn grimmigheid zal Hij hen verschrikken.","Luk 12:47":"En die dienstknecht die de wil van zijn heer geweten heeft, en zich niet klaargemaakt heeft, en ook niet naar zijn wil gehandeld heeft, die zal met veel slagen geslagen worden.","Ps 107:34":"Het vruchtbare land tot zoute grond, om de boosheid van hen die daarin wonen.","Lev 20:5":"dan zal Ik Mijn aangezicht tegen die man en tegen zijn familie richten, en Ik zal hem, en allen die hem naar de Molech achterna hoereren, uit het midden van hun volk uitroeien.","2 Kron 24:22":"Zo dacht de koning Joas niet aan de weldadigheid die zijn vader Jojada aan hem gedaan had, maar doodde zijn zoon; en toen deze stierf, zei hij: De HEERE zal het zien en het vergelden!","Job 8:22":"Wie u haten, zullen met schaamte bekleed worden; en de tent van de goddelozen zal er niet meer zijn.","Gen 25:6":"Maar aan de zonen van de bijvrouwen die Abraham had, gaf Abraham geschenken; en zond hen weg van zijn zoon Izak, terwijl hij nog leefde, oostwaarts naar het land van het Oosten.","Num 7:84":"Dit was de inwijding van het altaar door de leiders van Israël, op de dag dat het gezalfd werd: twaalf zilveren schotels, twaalf zilveren sprenkelschalen, twaalf gouden reukschalen.","1 Kron 10:14":"en de HEERE niet gezocht had; daarom doodde Hij hem, en keerde het koninkrijk tot David, de zoon van Isaï.","Gen 23:13":"En hij sprak tot Efron, ten aanhoren van het volk van het land, en zei: Trouwens, als u het toch wilt geven, hoor mij dan alstublieft; ik zal het geld van de akker geven; neem het van mij aan, dan zal ik mijn dode daar begraven.","Matt 7:26":"En ieder die deze woorden van Mij hoort en ze niet doet, zal vergeleken worden met een dwaze man, die zijn huis op het zand gebouwd heeft;","1 Kor 3:17":"Als iemand de tempel van God schendt, die zal God schenden; want de tempel van God is heilig, en dat bent u.","1 Kon 14:10":"daarom, zie, Ik zal kwaad brengen over het huis van Jerobeam, en van Jerobeam uitroeien alwie mannelijk is, zowel wie in de macht is als wie is overgebleven in Israël; en Ik zal de nakomelingen van het huis van Jerobeam wegvegen, zoals men drek wegveegt, totdat het helemaal vergaan is.","Jes 24:18":"En het zal gebeuren: wie voor het geluid van de angst vlucht, die zal in de kuil vallen; en wie uit de kuil opklimt, die zal in de strik gevangen worden; want de sluizen in de hoogte zijn opengedaan, en de fundamenten van de aarde zullen beven.","2 Kron 33:3":"Want hij bouwde de hoogten weer op, die zijn vader Jehizkia afgebroken had, en richtte voor de Baäls altaren op, en maakte offerbossen, en boog zich neer voor heel het leger van de hemel, en diende ze.","Micha 6:13":"zo zal Ik u ook slaan met ziekte, u treffend, en u verwoestend om uw zonden.","Spr 15:10":"De tucht is onaangenaam voor hem die het pad verlaat; en wie de bestraffing haat, zal sterven.","Matt 19:18":"Hij zei tegen Hem: Welke? En Jezus zei: Deze: U zult niet doden; u zult geen overspel doen; u zult niet stelen; u zult geen valse getuigenis geven;","Ezech 18:1-32":"Verder kwam het woord van de HEERE tot mij en Hij zei: Wat is er met u, dat u dit spreekwoord gebruikt over het land Israël, en zegt: De vaders hebben onrijpe druiven gegeten, en de tanden van de kinderen zijn stomp geworden? Zo waarachtig als Ik leef, spreekt de Heere HEERE, u zult geen aanleiding meer hebben om dit spreekwoord in Israël te gebruiken!","Ps 146:9":"De HEERE bewaart de vreemdelingen; Hij houdt de wees en de weduwe staande; maar de weg van de goddelozen keert Hij om.","2 Tess 2:8-10":"En dan zal de onrechtvaardige geopenbaard worden, die de Heere zal doden door de Geest van Zijn mond, en teniet zal doen door de verschijning van Zijn komst; hem, zeg ik, wiens komst is naar de werking van de satan, met alle kracht en tekenen en wonderen van de leugen; en met alle verleiding van de onrechtvaardigheid in hen die verloren gaan; omdat zij de liefde voor de waarheid niet aangenomen hebben, om behouden te worden.","Spr 13:9":"Het licht van de rechtvaardigen zal zich verblijden; maar de lamp van de goddelozen zal uitgeblust worden.","Ezech 5:4":"En nog zult u daarvan nemen, en dat werpen in het midden van het vuur, en zult ze verbranden met vuur; daaruit zal een vuur voortkomen tegen het hele huis van Israël.","Spr 22:25":"opdat u zijn paden niet leert, en een strik over uw ziel haalt.","Ef 5:12":"Want wat heimelijk door hen gebeurt, is ook schandelijk om te noemen.","Deut 31:29":"Want ik weet dat u na mijn dood zeker helemaal zult verdorven raken, en afwijken van de weg die ik u geboden heb; dan zal dit kwaad u in de laatste dagen overkomen, wanneer u zult hebben gedaan wat kwaad is in de ogen van de HEERE, om Hem door het werk van uw handen tot toorn te verwekken.","Luk 12:15":"En Hij zei tegen hen: Kijk uit en wees op uw hoede voor hebzucht; want het leven van iemand hangt niet af van de overvloed van zijn bezittingen.","Jer 30:12-15":"Want zo zegt de HEERE: Uw breuk is dodelijk, uw plaag is smartelijk. Er is niemand die uw zaak behartigt, aangaande het gezwel; u hebt geen heelpleisters. Al uw minnaars hebben u vergeten, zij vragen niet naar u; want Ik heb u geslagen met de plaag van een vijand, met de kastijding van iemand wrede; om de grootheid van uw ongerechtigheid, omdat uw zonden machtig veel zijn.","1 Kon 12:1-16":"En Rehabeam ging naar Sichem, want het hele Israël was naar Sichem gekomen om hem koning te maken. Het gebeurde nu, toen Jerobeam, de zoon van Nebat, dit hoorde, terwijl hij nog in Egypte was (want hij was voor het aangezicht van koning Salomo gevlucht, en Jerobeam woonde in Egypte), dat zij heen zonden en hem lieten roepen; en Jerobeam en de hele gemeente van Israël kwamen en spraken tegen Rehabeam en zeiden:","Job 15:20-24":"Al zijn dagen doet de goddeloze zichzelf weedom aan; en weinige jaren in getal zijn voor de tiran weggelegd. Het geluid van verschrikkingen is in zijn oren; in de vrede zelf komt de verwoester hem over. Hij gelooft niet uit de duisternis terug te keren, maar dat hij beloerd wordt voor het zwaard.","Ef 5:5":"Want dit weet u, dat geen hoereerder, of onreine, of hebzuchtige, die een afgodendienaar is, erfenis heeft in het Koninkrijk van Christus en van God.","Spr 13:21":"Het kwaad zal de zondaars vervolgen; maar de rechtvaardige zal men met goed vergelden.","Ps 59:9":"Maar U, HEERE, zult hen belachen; U zult alle heidenen bespotten.","Est 3:12":"Toen werden de schrijvers van de koning geroepen, in de eerste maand, op de dertiende dag daarvan, en er werd geschreven naar alles wat Haman beval, aan de stadhouders van de koning, en aan de landvoogden die over elk landschap waren, en aan de vorsten van elk volk, elk landschap naar zijn schrift, en elk volk naar zijn taal; er werd geschreven in de naam van de koning Ahasveros, en het werd met de ring van de koning verzegeld.","Spr 6:16":"Deze zes dingen haat de HEERE; ja, zeven zijn een gruwel voor Zijn ziel:","Joh 3:18-20":"Wie in Hem gelooft, wordt niet veroordeeld, maar wie niet gelooft, is al veroordeeld, omdat hij niet geloofd heeft in de Naam van de eniggeboren Zoon van God. En dit is het oordeel: dat het licht in de wereld gekomen is, en de mensen hebben de duisternis liever gehad dan het licht; want hun werken waren slecht. Want ieder die kwaad doet, haat het licht en komt niet tot het licht, opdat zijn werken niet bestraft worden.","Openb 9:21":"En hebben zich ook niet bekeerd van hun doodslagen, noch van hun toverijen, noch van hun hoererij, noch van hun dieverijen.","Rom 5:12":"Daarom, zoals door één mens de zonde in de wereld ingekomen is, en door de zonde de dood; en zo de dood tot alle mensen doorgegaan is, doordat allen gezondigd hebben.","2 Sam 13:4":"Die zei tegen hem: Waarom bent u, dag na dag, zo mager, u koningszoon, zult u het mij niet vertellen? Toen zei Amnon tegen hem: Ik heb Thamar, de zuster van mijn broer Absalom, lief.","2 Tim 2:13":"als wij ontrouw zijn, blijft Hij trouw; Hij kan Zichzelf niet verloochenen.","1 Kon 21:10-24":"En zet tegenover hem twee mannen, zonen van Belial, die tegen hem getuigen en zeggen: U hebt God en de koning gevloekt; en voer hem naar buiten, en stenig hem, dat hij sterft. En de mannen van zijn stad, die oudsten en die edelen, die in zijn stad woonden, deden zoals Izebel hun gezonden had; zoals geschreven was in de brieven die zij hun gezonden had. Zij riepen een vasten uit; en zij zetten Naboth vooraan onder het volk.","Deut 13:13":"Er zijn mannen, kinderen van Belial, uit uw midden uitgegaan, en hebben de inwoners van hun stad aangedreven, en gezegd: Laat ons gaan, en andere goden dienen, die u niet gekend hebt;","Joh 10:33":"De Joden antwoordden Hem: Wij stenigen U niet vanwege enig goed werk, maar vanwege godslastering, en omdat U, die een Mens bent, Uzelf God maakt.","2 Sam 4:9-12":"Maar David antwoordde Rechab en zijn broer Baëna, de zonen van Rimmon, de Beerothiet, en zei tegen hen: Zo waarachtig als de HEERE leeft, Die mijn ziel uit alle benauwdheid verlost heeft! Toen hij die mij het bericht bracht en zei: Zie, Saul is dood – terwijl hij zelf dacht dat hij goed nieuws bracht – heb ik hem gegrepen en te Ziklag gedood, hoewel hij meende dat ik hem daarvoor loon zou geven; Hoeveel te meer, wanneer goddeloze mannen een rechtvaardig man in zijn eigen huis op zijn bed hebben gedood? Zou ik dan nu zijn bloed niet van uw handen eisen, en u van de aarde wegdoen?","Jes 58:5-8":"Zou dit zulk een vasten zijn dat Ik verkiezen zou, dat de mens zijn ziel een dag kwelt, dat hij zijn hoofd kromt zoals een bieze, en een zak en as onder zich spreidt? Zou u dat een vasten noemen, en een dag die de HEERE aangenaam is? Is dit niet het vasten dat Ik verkies: dat u de knopen van de goddeloosheid losmaakt, dat u de banden van het juk ontdoet, en dat u de verpletterden vrij loslaat, en elk juk verscheurt? Is het niet dit, dat u de hongerige uw brood meedeelt, en de armen, verdrevenen, in huis brengt? Als u een naakte ziet, dat u hem dekt, en dat u zich voor uw eigen vlees niet verbergt?","2 Tess 1:8":"Met vlammend vuur, wraak oefenend over hen die God niet kennen, en over hen die het Evangelie van onze Heere Jezus Christus niet gehoorzaam zijn.","Ex 21:35":"Wanneer nu iemands os de os van zijn naaste zo kwetst, dat hij sterft, dan zal men de levende os verkopen en het geld daarvan gelijk delen, en het dode dier zal men ook gelijk delen.","Hos 4:8":"Zij eten de zonde van Mijn volk, en verlangen, ieder met zijn ziel, naar hun ongerechtigheid.","Ef 4:17-19":"Ik zeg dan dit, en betuig het in de Heere, dat u niet meer wandelt zoals de andere heidenen wandelen, in de zinloosheid van hun gemoed. Verduisterd in het verstand, vervreemd van het leven van God, door de onwetendheid die in hen is, door de verharding van hun hart; Zij hebben, ongevoelig geworden, zichzelf overgegeven aan losbandigheid, om alle onreinheid gierig te bedrijven.","Mark 14:56-59":"Want velen getuigden vals tegen Hem, maar de getuigenissen kwamen niet overeen. En sommigen stonden op en getuigden vals tegen Hem, en zeiden: Wij hebben Hem horen zeggen: Ik zal deze tempel, die met handen gemaakt is, afbreken, en in drie dagen een andere, zonder handen gemaakt, bouwen.","1 Kon 21:2-4":"Achab sprak tot Naboth en zei: Geef mij uw wijngaard, opdat hij mij tot een kruidhof zij, omdat hij dicht bij mijn huis is; en ik zal u ervoor een wijngaard geven die beter is dan die; of, als het goed is in uw ogen, zal ik u de waarde ervan in geld geven. Maar Naboth zei tegen Achab: Dat de HEERE ver van mij houde, dat ik u de erfenis van mijn vaderen zou geven! Toen kwam Achab in zijn huis, knorrig en toornig over het woord dat Naboth, de Jizreëliet, tot hem gesproken had, want hij had gezegd: Ik zal de erfenis van mijn vaderen niet geven. En hij legde zich neer op zijn bed, keerde zijn gezicht om, en at geen brood.","Matt 15:19":"Want uit het hart komen voort boze overwegingen, doodslagen, overspelen, hoererijen, dieverijen, valse getuigenissen, lasteringen.","1 Kon 11:4":"Want het gebeurde in de tijd van Salomo's ouderdom, dat zijn vrouwen zijn hart deden neigen naar andere goden; zodat zijn hart niet volkomen was met de HEERE, zijn God, zoals het hart van zijn vader David.","Num 7:54":"Op de achtste dag offerde de leider van de kinderen van Manasse, Gamaliël, de zoon van Pedazur.","Jer 32:25":"Evenwel hebt U tegen mij gezegd, Heere HEERE: koop voor uzelf dat veld voor geld, en laat het door getuigen bevestigen; terwijl de stad in de hand van de Chaldeeën gegeven is.","Ezech 20:8":"Maar zij waren opstandig tegen Mij, en wilden naar Mij niet horen; niemand wierp de verfoeisels van zijn ogen weg, en niemand verliet de drekgoden van Egypte; daarom zei Ik dat Ik Mijn grimmigheid over hen zou uitgieten, om Mijn toorn tegen hen te volbrengen midden in Egypteland.","Est 4:7":"gaf Mordechai hem te kennen alles wat hem overkomen was, en de opgave van het zilver dat Haman gezegd had te zullen wegen in de schatten van de koning, voor de Joden, om hen om te brengen.","Hos 9:9":"Zij hebben zich zeer diep verdorven, zoals in de dagen van Gibea; Hij zal aan hun ongerechtigheid denken, Hij zal hun zonden straffen.","Kol 3:25":"Maar wie onrecht doet, zal het onrecht dragen dat hij gedaan heeft; en er is geen aanneming van het persoon.","2 Sam 23:7":"maar ieder die ze zal aantasten, voorziet zich met ijzer en het hout van een speer; en zij zullen helemaal met vuur verbrand worden, op dezelfde plaats.","Matt 21:44":"En wie op deze steen valt, zal verpletterd worden; en op wie hij valt, die zal hij vermorzelen.","Jer 8:6":"Ik heb geluisterd en toegehoord, zij spreken wat niet recht is, er is niemand die berouw heeft over zijn slechtheid, en zegt: Wat heb ik gedaan? Ieder keert zich om in zijn eigen loop, zoals een onbesuisd paard zich stort in de strijd.","Jer 11:15":"Wat heeft Mijn beminde in Mijn huis te doen, terwijl zij die schandelijke daad met velen doet, en het heilige vlees van u geweken is? Wanneer u kwaad doet, dan springt u op van vreugde.","1 Kon 21:1-19":"Het gebeurde nu na deze dingen: Naboth, een Jizreëliet, had een wijngaard, die te Jizreël was, bij het paleis van Achab, de koning van Samaria. Achab sprak tot Naboth en zei: Geef mij uw wijngaard, opdat hij mij tot een kruidhof zij, omdat hij dicht bij mijn huis is; en ik zal u ervoor een wijngaard geven die beter is dan die; of, als het goed is in uw ogen, zal ik u de waarde ervan in geld geven. Maar Naboth zei tegen Achab: Dat de HEERE ver van mij houde, dat ik u de erfenis van mijn vaderen zou geven!","Gen 17:12":"Een zoontje van acht dagen zal bij u besneden worden, alles wat mannelijk is in uw geslachten: degene die in het huis geboren is, en degene die met geld gekocht is van elke vreemdeling die niet van uw nageslacht is;","2 Petr 2:12-19":"Maar dezen, als onredelijke dieren, die de natuur volgen en geboren zijn om gevangen en gedood te worden, lasteren wat zij niet begrijpen, en zullen in hun verdorvenheid ook zelf verdorven worden; en zij zullen het loon van de onrechtvaardigheid ontvangen, omdat zij het als een genot beschouwen dagelijks in weelde te leven; zij zijn vlekken en smetten, en genieten uitbundig van hun eigen bedrog, terwijl zij met u aan de maaltijd zijn; zij hebben ogen vol overspel, die niet ophouden met zondigen; zij verleiden onvaste zielen, hebben een hart geoefend in hebzucht, en zijn kinderen van de vervloeking;","Joh 12:40":"Hij heeft hun ogen verblind, en hun hart verhard; opdat zij met de ogen niet zien, en met het hart niet verstaan, en zij zich bekeren, en Ik hen genees.","Openb 9:4-6":"En hun werd gezegd, dat zij het gras van de aarde niet zouden beschadigen, ook geen groente, ook geen boom, dan de mensen alleen, die het zegel van God niet aan hun voorhoofden hebben. En hun werd macht gegeven, niet dat zij hen zouden doden, maar dat zij door hen gepijnigd zouden worden vijf maanden; en hun pijniging was als de pijniging van een schorpioen, wanneer hij een mens gestoken heeft. En in die dagen zullen de mensen de dood zoeken, en zullen die niet vinden; en zij zullen ernaar verlangen te sterven, en de dood zal van hen wegvluchten.","Ps 7:17":"Zijn moeite zal op zijn eigen hoofd terugkeren, en zijn geweld op zijn eigen schedel neerdalen.","Ezech 5:8-17":"Daarom zegt de Heere HEERE zo: Zie, Ik wil tegen u, ja Ik, want Ik zal gerichten in het midden van u oefenen, voor de ogen van die heidenvolken. En Ik zal onder u doen, wat Ik niet gedaan heb, en zoals Ik voortaan niet meer doen zal, vanwege al uw gruwelen. Daarom zullen de vaders de kinderen eten in het midden van u, en de kinderen zullen hun vaders eten; en Ik zal gerichten onder u oefenen, en al uw overblijfsel zal Ik naar alle windrichtingen verstrooien.","Deut 14:26":"En geef dat geld voor alles wat uw ziel verlangt, voor runderen en voor schapen, en voor wijn, en voor sterke drank, en voor alles wat uw ziel van u begeren zal, en eet daar voor het aangezicht van de HEERE, uw God, en wees vrolijk, u en uw huis.","2 Kon 12:4":"En Joas zei tegen de priesters: Al het geld van de geheiligde dingen, dat gebracht zal worden in het huis van de HEERE, te weten het geld van hem die overgaat tot de getelden, het geld van ieder man naar zijn schatting, en al het geld, dat in het hart van ieder komt, om dat te brengen in het huis van de HEERE,","Spr 13:25":"De rechtvaardige eet tot verzadiging van zijn ziel toe; maar de buik van de goddelozen zal gebrek hebben.","Gen 24:36":"En Sara, de vrouw van mijn heer, heeft mijn heer een zoon gebaard, nadat zij oud geworden was; en hij heeft hem gegeven alles wat hij heeft.","1 Tim 6:10":"Want de geldzucht is een wortel van alle kwaad; sommigen hebben daarnaar verlangd en zijn van het geloof afgedwaald, en hebben zichzelf met veel smarten doorstoken.","Spr 7:20":"Hij heeft een bundel van het geld in zijn hand genomen; op de vastgestelde dag zal hij naar zijn huis komen.","Jes 14:19":"maar u bent verworpen van uw graf, als een gruwelijke scheut, als een kleed van de gedoden, die met het zwaard doorstoken zijn; als wie neerdalen in een steenkuil, als een vertreden dood lichaam.","Jer 9:3-6":"En zij spannen hun tong als hun boog voor leugen; zij worden geweldig in het land, maar niet voor waarheid; want zij gaan voort van slechtheid tot slechtheid, maar Mij kennen zij niet, spreekt de HEERE. Wacht u, ieder voor zijn vriend, en vertrouw niet op enige broeder; want elke broeder doet niet dan bedriegen, en elke vriend gaat om met achterklap. En zij bedriegen, ieder zijn vriend, en spreken de waarheid niet; zij leren hun tong leugen spreken, zij maken zich moe met verkeerd te handelen.","Jes 5:18-25":"Wee hun die de ongerechtigheid trekken met koorden van ijdelheid, en de zonde als met dikke wagentouwen! Die zeggen: Laat Hij haasten, laat Hij Zijn werk bespoedigen, opdat wij het zien; en laat het raadsbesluit van de Heilige van Israël naderen en komen, opdat wij het vernemen! Wee hun die het kwade goed noemen, en het goede kwaad; die duisternis tot licht stellen, en het licht tot duisternis; die het bittere tot zoet stellen, en het zoete tot bitterheid!","Mark 12:1-9":"En Hij begon door gelijkenissen tegen hen te spreken: Een man plantte een wijngaard, en zette er een omheining omheen, en groef een wijnpersbak, en bouwde een toren, en verhuurde hem aan de wijnbouwers, en reisde naar het buitenland. En toen het de tijd was, stuurde hij een dienaar naar de wijnbouwers, opdat hij van de wijnbouwers iets van de vrucht van de wijngaard zou ontvangen. Maar zij grepen hem, en sloegen hem, en stuurden hem met lege handen weg.","1 Petr 3:12":"Want de ogen van de Heere zijn over de rechtvaardigen, en Zijn oren gericht op hun gebed; maar het aangezicht van de Heere is tegen hen die kwaad doen.","Openb 19:15":"En uit Zijn mond ging een scherp zwaard, opdat Hij daarmee de heidenen slaan zou. En Hij zal hen hoeden met een ijzeren staf; en Hij treedt de wijnpersbak van de wijn van de toorn en van de gramschap van de Almachtige God.","Num 31:13":"Maar Mozes en Eleazar, de priester, en alle leiders van de vergadering, gingen naar buiten, hun tegemoet, tot buiten voor het leger.","Ezech 20:16":"Omdat zij Mijn rechten verwierpen, en in Mijn inzettingen niet wandelden, en Mijn sabbatten ontheiligden; want hun hart ging hun drekgoden achterna.","Spr 29:16":"Als de goddelozen talrijk worden, wordt de overtreding groot; maar de rechtvaardigen zullen hun val aanschouwen.","Rom 5:21":"Opdat, zoals de zonde geheerst heeft tot de dood, zo ook de genade zou heersen door rechtvaardigheid tot het eeuwige leven, door Jezus Christus onze Heere.","1 Kor 15:21":"Want omdat de dood door een mens is, is ook de opstanding van de doden door een Mens.","Neh 5:11":"Geeft hun toch, nog vandaag, hun akkers, hun wijngaarden, hun olijfgaarden en hun huizen terug; en het honderdste deel van het geld en van het koren, de most en de olie, die u van hen gevorderd hebt.","Hos 7:13":"Wee hen, want zij zijn van Mij afgezworven; verwoesting over hen, want zij hebben tegen Mij overtreden! Ik zou hen wel verlossen, maar zij spreken leugens tegen Mij.","1 Joh 3:14":"Wij weten dat wij overgegaan zijn uit de dood in het leven, omdat wij de broeders liefhebben; wie zijn broeder niet liefheeft, blijft in de dood.","Ex 21:29-32":"Maar als de os al eerder stotig was, en zijn eigenaar daarvan gewaarschuwd is, en hij hem niet bewaakt heeft, en hij doodt een man of een vrouw, zal die os gestenigd worden, en zijn eigenaar zal ook gedood worden. Als hem losgeld opgelegd wordt, zal hij tot vrijkoop van zijn leven geven naar alles wat hem opgelegd wordt; of hij nu een zoon gestoten heeft, of een dochter gestoten heeft, naar dit recht zal hem gedaan worden.","Matt 13:30":"Laat ze beide samen opgroeien tot de oogst, en in de tijd van de oogst zal ik tegen de maaiers zeggen: Verzamel eerst het onkruid, en bind het in bundels om het te verbranden; maar breng de tarwe samen in mijn schuur.","Mark 8:36":"Want wat zou het de mens baten als hij de hele wereld zou winnen, en schade zou lijden aan zijn ziel?","Num 1:4-16":"En met u zullen er zijn van elke stam een man, die hoofd is over het huis van zijn vaderen. Dit zijn nu de namen van de mannen die bij u zullen staan: van Ruben, Elizur, de zoon van Sedeur. Van Simeon, Selumiël, de zoon van Zurisaddai.","Ps 37:34-38":"Koph. Wacht op de HEERE, en houd Zijn weg, en Hij zal u verhogen om de aarde erfelijk te bezitten; u zult zien dat de goddelozen worden uitgeroeid. Resch. Ik heb een geweldenaar gezien, een goddeloze, die zich uitbreidde als een groene inlandse boom. Maar hij ging voorbij, en zie, hij was er niet meer; en ik zocht hem, maar hij werd niet gevonden.","Lev 18:25":"Zodat het land onrein is, en Ik over hen zijn ongerechtigheid bezoek, en het land zijn inwoners uitspuwt.","Hand 7:57-59":"Maar zij riepen met luide stem, stopten hun oren, en vielen eendrachtig op hem aan; en wierpen hem de stad uit, en stenigden hem; en de getuigen legden hun kleren af aan de voeten van een jongeman, die Saulus heette. En zij stenigden Stefanus, terwijl hij aanriep en zei: Heere Jezus, ontvang mijn geest.","Ezech 24:14":"Ik, de HEERE, heb het gesproken; het zal komen, en Ik zal het doen; Ik zal er niet van wijken, en Ik zal niet sparen, en geen berouw hebben; naar uw wegen en naar uw daden zullen zij u oordelen, spreekt de Heere HEERE.","Deut 21:1-9":"Wanneer in het land, dat de HEERE, uw God, u geven zal om dat te erven, iemand gevonden wordt die gedood is, liggend in het veld, zonder dat bekend is wie hem gedood heeft; Dan zullen uw oudsten en uw rechters uitgaan, en zij zullen meten naar de steden die rondom de gedode liggen. De stad nu die het dichtst bij de gedode ligt, daar zullen de oudsten van die stad een jonge koe nemen waarmee niet gewerkt is, die aan het juk niet getrokken heeft.","Deut 19:12":"dan zullen de oudsten van zijn stad iemand sturen, en hem vandaar laten halen, en zij zullen hem overgeven in de hand van de bloedwreker, zodat hij sterft.","Matt 13:50":"En zij zullen hen in de vurige oven werpen; daar zal geween zijn en het geknars van de tanden.","Spr 11:19":"Zo is de gerechtigheid ten leven, zoals wie het kwade najaagt, naar zijn eigen dood jaagt.","Klaagl 4:22":"Thau. Uw ongerechtigheid heeft een einde, o dochter van Sion! Hij zal u niet meer gevangen laten wegvoeren; maar uw ongerechtigheid, o dochter van Edom! zal Hij bezoeken; Hij zal uw zonden aan het licht brengen.","Job 31:39":"Als ik zijn vermogen gegeten heb zonder geld, en de ziel van zijn akkerlieden heb doen hijgen;","Jer 6:15":"Zijn zij beschaamd, omdat zij gruwel bedreven hebben? Ja, zij schamen zich in het minste niet, weten ook niet van schaamrood te maken; daarom zullen zij vallen onder de vallende, ten tijde als Ik hen bezoeken zal, zullen zij struikelen, zegt de HEERE.","1 Sam 12:23":"Wat mij aangaat, het zij verre van mij, dat ik tegen de HEERE zou zondigen door op te houden voor u te bidden; maar ik zal u de goede en rechte weg leren.","Hand 4:19":"Maar Petrus en Johannes antwoordden hun: Oordeelt u zelf, of het recht is voor God, meer naar u te luisteren dan naar God.","Matt 5:22":"Maar Ik zeg u: ieder die zonder reden toornig is op zijn broeder, die zal strafbaar zijn voor het gericht; en wie tegen zijn broeder zegt: Raka! die zal strafbaar zijn voor de grote raad; maar wie zegt: Dwaas! die zal strafbaar zijn voor het helse vuur.","Openb 6:15-17":"En de koningen van de aarde, en de groten, en de rijken, en de leiders over duizend, en de machtigen, en alle dienstknechten, en alle vrijen, verborgen zichzelf in de spelonken, en in de steenrotsen van de bergen; En zeiden tot de bergen en tot de steenrotsen: Valt op ons, en verbergt ons van het aangezicht van Hem Die op de troon zit, en van de toorn van het Lam. Want de grote dag van Zijn toorn is gekomen, en wie kan bestaan?","Num 15:33-36":"En zij die hem hout zagen lezen, brachten hem tot Mozes en tot Aäron en tot de hele vergadering. En zij stelden hem in bewaring; want het was niet duidelijk gemaakt wat hem gedaan moest worden. Toen zei de HEERE tot Mozes: Die man zal zeker gedood worden; de hele vergadering zal hem met stenen stenigen buiten het leger.","Spr 6:17":"hoogmoedige ogen, een valse tong, en handen die onschuldig bloed vergieten;","Job 15:28-30":"En heeft verdelgde steden bewoond, en huizen die men niet bewoonde, die gereed waren om een puinhoop te worden. Hij zal niet rijk worden, en zijn vermogen zal niet bestaan; en hun volmaaktheid zal zich niet uitbreiden op de aarde. Hij zal van de duisternis niet ontwijken, de vlam zal zijn scheut verdrogen; hij zal wijken door het geblaas van zijn mond.","1 Sam 29:1":"De Filistijnen hadden al hun legers verzameld te Afek; en de Israëlieten legerden zich bij de bron die bij Jizreël is.","Matt 3:12":"Zijn wan is in Zijn hand, en Hij zal Zijn dorsvloer helemaal zuiveren, en Zijn tarwe in Zijn schuur samenbrengen, en Hij zal het kaf met onblusbaar vuur verbranden.","1 Kor 5:13":"Maar hen die buiten zijn oordeelt God. En doe deze boze man uit uw midden weg.","Amos 9:1-5":"Ik zag de Heere staan op het altaar, en Hij zei: Sla die knop, zodat de posten beven, en kloof ze allen in het hoofd; en Ik zal hun achterste met het zwaard doden; wie van hen probeert te vluchten, zal niet ontkomen, en wie van hen probeert te ontkomen, zal niet gered worden. Al groeven zij tot in het graf, dan zal Mijn hand ze vandaar halen, en al klommen zij in de hemel, dan zal Ik ze vandaar doen neerdalen. En al verstopten zij zich op de top van de Karmel, dan zal Ik ze opsporen en vandaar halen; en al verborgen zij zich voor Mijn ogen op de bodem van de zee, dan zal Ik vandaar de slang gebieden, die zal ze bijten.","Luk 6:49":"Maar wie het gehoord heeft en het niet gedaan heeft, is als een mens die een huis bouwde op de aarde zonder fundament; de waterstroom sloeg ertegen aan, en het viel meteen om, en de val van dat huis was groot.","Pred 2:5":"Ik maakte mij tuinen en parken, en ik plantte er bomen in van allerlei vrucht.","Spr 14:30":"Een gezond hart is het leven van het vlees; maar afgunst is verrotting van de beenderen.","1 Kon 15:29":"Het gebeurde nu, toen hij koning werd, dat hij het gehele huis van Jerobeam sloeg; hij liet niets van Jerobeam over wat adem had, totdat hij hem verdelgd had, naar het woord van de HEERE, dat Hij gesproken had door de dienst van Zijn knecht Ahia, de Siloniet;","Ezra 10:8":"En ieder die niet binnen drie dagen kwam, naar de raad van de vorsten en de oudsten, al zijn bezit zou verbeurd worden; en hijzelf zou afgezonderd worden van de gemeente van de weggevoerden.","Deut 28:15-68":"Daarentegen zal het gebeuren, als u niet naar de stem van de HEERE, uw God, luistert, om op te letten dat u al Zijn geboden en Zijn inzettingen doet, die ik u heden gebied; zo zullen al deze vloeken over u komen, en u treffen. Vervloekt zult u zijn in de stad, en vervloekt zult u zijn op het veld. Vervloekt zal zijn uw korf, en uw baktrog.","Amos 5:10":"Zij haten in de poort hem die bestraft, en verafschuwen hem die oprecht spreekt.","Gen 16:6":"En Abram zei tegen Sarai: Zie, uw dienstmaagd is in uw hand; doe met haar wat goed is in uw ogen. En Sarai vernederde haar, en zij vluchtte van haar aangezicht.","2 Kon 9:9":"Want Ik zal het huis van Achab maken als het huis van Jerobeam, de zoon van Nebat, en als het huis van Baësa, de zoon van Ahia.","Ps 64:4-7":"Die hun tong scherpen als een zwaard, een bitter woord richten als hun pijl; Om in verborgen plaatsen de oprechte te schieten; haastig schieten zij naar hem, en vrezen niet. Zij sterken zichzelf in een boze zaak; zij overleggen om strikken te verbergen; zij zeggen: Wie zal ze zien?","Micha 6:16":"Want de inzettingen van Omri worden onderhouden, en al het werk van het huis van Achab; en u wandelt in hun raadslagen; opdat Ik u stel tot verwoesting, en haar inwoners tot aanfluiting; zo zult u de smaad van Mijn volk dragen.","Fil 2:15":"Opdat u onberispelijk en oprecht mag zijn, kinderen van God, onstraffelijk te midden van een krom en verdraaid geslacht, onder wie u schijnt als lichten in de wereld;","Ex 21:34":"dan zal de eigenaar van de kuil het vergoeden; hij zal aan de eigenaar van het dier het geld teruggeven; maar het dode dier zal hem toebehoren.","Spr 3:33":"De vloek van de HEERE is in het huis van de goddeloze; maar de woning van de rechtvaardigen zal Hij zegenen.","Mal 3:17":"En zij zullen, zegt de HEERE van de heerscharen, op die dag, die Ik maken zal, Mij een eigendom zijn; en Ik zal hen verschonen, zoals een man zijn zoon verschoont, die hem dient.","Ps 37:9":"Want de boosdoeners zullen uitgeroeid worden, maar wie de HEERE verwachten, die zullen de aarde erfelijk bezitten.","Openb 3:17":"Want u zegt: Ik ben rijk, en verrijkt geworden, en heb aan niets gebrek; en u weet niet dat u ellendig bent, en jammerlijk, en arm, en blind, en naakt.","Rom 3:4":"Dat zij verre. Maar God is waarachtig, en ieder mens leugenachtig; zoals geschreven is: Opdat U gerechtvaardigd wordt in Uw woorden, en overwint, wanneer U oordeelt.","Hos 7:12":"Wanneer zij zullen heengaan, zal Ik Mijn net over hen uitspreiden, Ik zal ze als vogels van de hemel doen neerdalen. Ik zal ze tuchtigen, zoals gehoord is in hun samenkomst.","Openb 11:10":"En zij die op de aarde wonen, die zullen zich verblijden over hen, en zullen vreugde bedrijven, en zullen elkaar geschenken zenden; omdat deze twee profeten hen die op de aarde wonen, gepijnigd hadden.","Ps 18:15":"En Hij zond Zijn pijlen uit, en verstrooide ze; en Hij vermenigvuldigde de bliksemen, en verschrikte ze.","Gen 20:16":"En tegen Sara zei hij: Zie, ik heb uw broeder duizend zilverlingen gegeven; zie, dat moet voor u een bedekking van de ogen zijn, voor allen die bij u zijn, ja, tegenover allen, en wees terechtgewezen.","2 Kon 15:25":"En Pekah, de zoon van Remalia, zijn hoofdman, maakte een samenzwering tegen hem, en sloeg hem te Samaria neer, in het paleis van het huis van de koning, samen met Argob en Arje, en met hem vijftig mannen van de kinderen van de Gileadieten; zo doodde hij hem, en werd koning in zijn plaats.","1 Kon 2:23-25":"En de koning Salomo zwoer bij de HEERE en zei: Zo doe God mij, en zo doet Hij daar nog aan toe, zeker zal Adonia dat woord met zijn leven bekopen! En nu, zo waarachtig als de HEERE leeft, Die mij bevestigd heeft, en mij heeft doen zitten op de troon van mijn vader David, en Die mij een huis gemaakt heeft, zoals Hij gesproken had; zeker, Adonia zal vandaag gedood worden! En de koning Salomo stuurde Benaja, de zoon van Jojada; die viel op hem aan, zodat hij stierf.","Richt 17:4":"Maar hij gaf dat geld aan zijn moeder terug. En zijn moeder nam tweehonderd zilverlingen, en gaf ze aan de goudsmid, die maakte daarvan een gesneden beeld en een gegoten beeld; dat was in het huis van Micha.","Matt 11:23":"En u, Kapernaüm! Die tot de hemel toe verhoogd bent, u zult tot de hel toe neergestoten worden. Want als in Sodom die krachten gebeurd waren die in u gebeurd zijn, zouden zij tot op deze huidige dag gebleven zijn.","Ezech 11:12":"En u zult weten dat Ik de HEERE ben, omdat u in Mijn inzettingen niet gewandeld hebt, en Mijn rechten niet gedaan hebt, maar naar de rechten van de heidenvolken die rondom u zijn, gedaan hebt.","Ps 68:3":"U zult hen verdrijven, zoals rook verdreven wordt; zoals was voor het vuur smelt, zullen de goddelozen vergaan van Gods aangezicht.","Spr 21:12":"De rechtvaardige let verstandig op het huis van de goddeloze, als God de goddelozen in het kwaad stort.","1 Kor 5:5":"Hem over te geven aan de satan, tot verderf van het vlees, opdat de geest behouden mag worden op de dag van de Heere Jezus.","Joh 8:44":"U bent uit uw vader de duivel, en u wilt de begeerten van uw vader doen; die was een mensenmoordenaar van het begin af aan, en is niet in de waarheid blijven staan, want er is geen waarheid in hem. Wanneer hij de leugen spreekt, spreekt hij uit wat van hemzelf is; want hij is een leugenaar, en de vader daarvan.","2 Kon 21:9":"Maar zij luisterden niet; want Manasse deed hen dwalen, zodat zij erger deden dan de heidenvolken, die de HEERE voor de kinderen van Israël weggevaagd had.","Luk 3:17":"Zijn wan is in Zijn hand, en Hij zal Zijn dorsvloer grondig reinigen, en de tarwe zal Hij in Zijn schuur samenbrengen; maar het kaf zal Hij met onblusbaar vuur verbranden.","2 Kron 32:17":"Ook schreef hij brieven, om de HEERE, de God van Israël, te honen en om tegen Hem te spreken, en zei: Zoals de goden van de volken van de landen hun volk niet gered hebben uit mijn hand, zo zal de God van Jehizkia Zijn volk niet redden uit mijn hand.","Hos 7:3":"Zij verblijden de koning met hun boosheid, en de vorsten met hun leugens.","Luk 19:15":"En het gebeurde, toen hij terugkwam nadat hij het koninkrijk ontvangen had, dat hij zei dat die dienstknechten aan wie hij het geld gegeven had bij hem geroepen moesten worden, opdat hij zou weten wat ieder met handel verdiend had.","Rom 2:8":"Maar hun die twistgierig zijn, en die de waarheid ongehoorzaam zijn, maar de ongerechtigheid gehoorzaam zijn, zal verbolgenheid en toorn vergolden worden;","2 Sam 3:39":"Maar ik ben vandaag teder, hoewel tot koning gezalfd, en deze mannen, de zonen van Zeruja, zijn te hard voor mij; de HEERE zal de boosdoener vergelden naar zijn boosheid.","1 Sam 8:4":"Toen kwamen alle oudsten van Israël bijeen, en zij kwamen tot Samuël te Rama;","Spr 22:24":"Ga geen vriendschap aan met een driftig man, en ga niet om met een zeer grimmig man;","Joz 24:16":"Toen antwoordde het volk en zei: Het zij verre van ons, dat wij de HEERE zouden verlaten om andere goden te dienen.","Job 27:5":"Het zij verre van mij, dat ik u rechtvaardigen zou; totdat ik de geest zal gegeven hebben, zal ik mijn oprechtheid niet van mij wegdoen.","Num 35:16-22":"Maar als hij hem met een ijzeren voorwerp geslagen heeft, zodat hij sterft, is hij een doodslager; deze doodslager zal zeker gedood worden. Of als hij hem met een handsteen, waardoor men zou kunnen sterven, geslagen heeft, zodat hij sterft, is hij een doodslager; deze doodslager zal zeker gedood worden. Of als hij hem met een houten handwapen, waardoor men zou kunnen sterven, geslagen heeft, zodat hij sterft, is hij een doodslager; deze doodslager zal zeker gedood worden.","Jer 7:9":"Zult u stelen, doodslaan en overspel bedrijven, en vals zweren, en voor Baäl reukwerk branden, en andere goden nawandelen, die u niet kent,","1 Sam 16:4":"Samuël deed toen wat de HEERE gesproken had, en hij kwam in Bethlehem. Toen kwamen de oudsten van de stad hem bevend tegemoet, en zeiden: Komt u met vrede?","Ps 34:17":"Pe. Het aangezicht van de HEERE is tegen hen die kwaad doen, om hun gedachtenis van de aarde uit te roeien.","Spr 10:6-8":"Zegeningen zijn op het hoofd van de rechtvaardige; maar het geweld bedekt de mond van de goddelozen. De gedachtenis aan de rechtvaardige zal tot zegening zijn; maar de naam van de goddelozen zal wegrotten. Wie wijs van hart is, neemt de geboden aan; maar wie dwaas is van lippen, zal ten val komen.","Micha 3:2":"Zij haten het goede, en hebben het kwade lief; zij roven hun huid van hen af, en hun vlees van hun beenderen.","Jer 32:9":"Dus kocht ik van Hanameel, de zoon van mijn oom, het veld dat bij Anathoth is; en ik woog hem het geld toe, zeventien zilveren sikkels.","Jer 32:6-8":"Jeremia dan zei: Het woord van de HEERE is tot mij gekomen, en het zei: Zie, Hanameel, de zoon van Sallum, uw oom, zal naar u toe komen en zeggen: Koop voor uzelf mijn veld dat bij Anathoth is, want u hebt het recht van lossing, om het te kopen. Zo kwam Hanameel, de zoon van mijn oom, naar het woord van de HEERE, tot mij, in het voorhof van de bewaking, en zei tegen mij: Koop toch mijn veld, dat bij Anathoth is, dat in het land van Benjamin is; want u hebt het erfrecht, en u hebt de lossing, koop het voor uzelf. Toen merkte ik dat het woord van de HEERE was.","Ps 37:1":"Een psalm van David. Aleph. Wind u niet op over de boosdoeners; benijd hen niet die onrecht doen.","Spr 10:24":"Wat de goddeloze vreest, dat zal hem overkomen; maar wat de rechtvaardigen verlangen, zal God geven.","Rom 8:6":"Want het bedenken van het vlees is de dood, maar het bedenken van de Geest is leven en vrede.","Luk 1:79":"om te verschijnen aan hen die gezeten zijn in duisternis en schaduw van de dood, om onze voeten te richten op de weg van de vrede.","Deut 30:15":"Zie, ik heb u heden voorgesteld het leven en het goede, en de dood en het kwade.","Num 17:6":"Mozes dan sprak tot de kinderen van Israël, en al hun leiders gaven hem een staf, voor elke leider één staf, naar het huis van hun vaderen, twaalf staven; Aärons staf was ook onder hun staven.","1 Joh 3:12":"Niet zoals Kaïn, die uit de boze was en zijn broeder doodsloeg; en waarom sloeg hij hem dood? Omdat zijn werken slecht waren, en die van zijn broeder rechtvaardig.","Rom 8:5":"Want wie naar het vlees zijn, bedenken de dingen van het vlees; maar wie naar de Geest zijn, bedenken de dingen van de Geest.","Ps 55:20":"God zal horen, en zal hen vernederen, Hij die van oudsher zit, Sela; omdat er bij hen helemaal geen verandering is, en zij God niet vrezen.","1 Tim 5:24":"Van sommige mensen zijn de zonden al vooraf openbaar, en gaan vooruit tot hun veroordeling; en bij sommigen komen zij later aan het licht.","Pred 7:12":"Want de wijsheid is tot een schaduw, en het geld is tot een schaduw; maar de uitnemendheid van de wetenschap is, dat de wijsheid haar bezitters het leven geeft.","Ps 94:13":"Om hem rust te geven van de kwade dagen; totdat de kuil voor de goddeloze gegraven wordt.","1 Kon 11:1-4":"En koning Salomo had, behalve de dochter van Farao, veel vreemde vrouwen lief: Moabitische, Ammonitische, Edomitische, Sidonische en Hethitische vrouwen; van de volken waarvan de HEERE tegen de kinderen van Israël gezegd had: U zult tot hen niet ingaan, en zij zullen tot u niet inkomen; zij zouden zeker uw hart naar hun goden doen neigen; aan deze hing Salomo met liefde. En hij had zevenhonderd vrouwen, vorstinnen, en driehonderd bijvrouwen, en zijn vrouwen deden zijn hart neigen.","1 Kon 14:16":"En Hij zal Israël overgeven, vanwege de zonden van Jerobeam, die gezondigd heeft, en die Israël heeft doen zondigen.","Job 14:4":"Wie kan een reine geven uit een onreine? Niemand.","Ezech 39:18-20":"Het vlees van de helden zult u eten, en het bloed van de vorsten van de aarde drinken; van rammen, van lammeren, en bokken, en stieren, die allemaal gemest zijn van Basan. En u zult het vet eten tot verzadiging toe, en bloed drinken tot dronkenschap toe; van Mijn slachtoffer, dat Ik voor u geslacht heb. En u zult verzadigd worden aan Mijn tafel van paarden en wagenpaarden, van helden en alle krijgslieden, spreekt de Heere HEERE.","Hand 6:12":"En zij hitsten het volk op, en de oudsten en de schriftgeleerden; en zij overvielen hem, grepen hem, en brachten hem voor de Raad;","1 Petr 4:3":"Want het is ons genoeg dat wij in de voorgaande tijd van ons leven de wil van de heidenen volbracht hebben, en geleefd hebben in losbandigheid, begeerten, dronkenschap, zwelgpartijen, drinkgelagen en gruwelijke afgoderij;","Ps 49:21":"De mens, die in aanzien is, en geen verstand heeft, wordt gelijk aan de dieren, die vergaan.","Num 11:16":"En de HEERE zei tegen Mozes: Verzamel voor Mij zeventig mannen uit de oudsten van Israël, van wie u weet dat zij de oudsten van het volk en zijn opzichters zijn; en u zult hen brengen naar de tent van de samenkomst, en zij zullen zich daar bij u opstellen.","Ps 9:17":"De HEERE is bekend geworden; Hij heeft recht gedaan; de goddeloze is verstrikt in het werk van zijn handen! Higgajon, Sela.","Spr 2:12-19":"Om u te redden van de kwade weg, van de man die verkeerdheden spreekt; Van hen die de paden van de oprechtheid verlaten, om te gaan in de wegen van de duisternis; Die blij zijn met het doen van kwaad, zich verheugen in de verkeerdheden van de kwade;","1 Kon 22:8":"Toen zei de koning van Israël tegen Josafat: Er is nog een man om door hem de HEERE te vragen; maar ik haat hem, omdat hij over mij niets goeds profeteert, maar kwaad: Micha, de zoon van Jimla. En Josafat zei: De koning moet dat niet zeggen!","Hand 8:23":"Want ik zie dat u bent in een geheel bittere gal en in de samenknoping van ongerechtigheid.","1 Kon 16:11":"En het gebeurde, toen hij ging regeren, zodra hij op zijn troon zat, dat hij het hele huis van Baësa neersloeg; hij liet hem niemand over die tegen een muur waterde, noch van zijn bloedverwanten, noch van zijn vrienden.","1 Kon 17:8":"Toen kwam het woord van de HEERE tot hem, en Hij zei:","Est 5:9-14":"Toen ging Haman diezelfde dag naar buiten, vrolijk en goedsmoeds; maar toen Haman Mordechai zag in de poort van de koning, en dat hij niet opstond en zich niet voor hem verroerde, werd Haman vervuld met woede op Mordechai. Toch bedwong Haman zich, en hij kwam bij zijn huis; en hij stuurde mensen, en liet zijn vrienden komen, en Zeres, zijn vrouw. En Haman vertelde hun over de heerlijkheid van zijn rijkdom, en de veelheid van zijn zonen, en alles waarin de koning hem groot gemaakt had, en waarin hij hem verheven had boven de vorsten en dienaren van de koning.","Ex 22:17":"Als haar vader hardnekkig weigert haar aan hem te geven, dan moet hij geld betalen overeenkomstig de bruidsprijs voor maagden.","Ps 94:23":"En Hij zal hun ongerechtigheid op hen doen terugkeren, en Hij zal hen in hun boosheid verdelgen; de HEERE, onze God, zal hen verdelgen.","Ezra 3:7":"Zo gaven zij geld aan de houwers en werkmeesters, ook eten en drinken, en olie aan de Sidoniërs en aan de Tyriërs, om cederhout van de Libanon te brengen naar de zee bij Jafo, naar de vergunning die Kores, koning van Perzië, hun gegeven had.","Ezra 9:11-14":"die Gij geboden had door de dienst van Uw knechten, de profeten, en zei: Het land, waar u naartoe gaat om het te erven, is een vuil land, door de vuiligheid van de volken van de landen, om hun gruwelen, waarmee zij het vervuld hebben, van het ene einde tot het andere einde, met hun onreinheid. Zo zult u nu uw dochters niet geven aan hun zonen, en hun dochters niet nemen voor uw zonen, en zult hun vrede en hun welvaart niet zoeken, tot in eeuwigheid; opdat u sterk wordt, en het goede van het land eet, en uw kinderen het laat erven tot in eeuwigheid. En na alles wat over ons gekomen is, om onze slechte werken, en om onze grote schuld, omdat U, o onze God, ons minder gestraft hebt dan onze ongerechtigheid verdient, en ons een ontkoming gegeven hebt, zoals deze is;","Hos 10:8":"En de hoogten van Aven, Israëls zonde, zullen vernietigd worden; doorns en distels zullen op hun altaren opkomen; en zij zullen tegen de bergen zeggen: Bedek ons! en tegen de heuvels: Val op ons!","Openb 9:15":"En de vier engelen zijn losgemaakt, die gereed waren gehouden tegen het uur, en dag, en maand, en jaar, opdat zij het derde deel van de mensen zouden doden.","Spr 2:22":"Maar de goddelozen zullen van de aarde uitgeroeid worden, en de trouwelozen zullen eruit weggerukt worden.","Est 8:8-13":"Schrijft u dan voor de Joden, zoals het goed is in uw ogen, in de naam van de koning, en verzegelt het met de ring van de koning; want het geschrift, dat in de naam van de koning geschreven, en met de ring van de koning verzegeld is, kan door niemand teruggeroepen worden. Toen werden de schrijvers van de koning geroepen, op datzelfde moment, in de derde maand (dat is de maand Sivan), op de drieëntwintigste daarvan, en er werd geschreven naar alles wat Mordechai gebood, aan de Joden, en aan de stadhouders, en landvoogden, en leiders van de landschappen, die van Indië af tot aan Morenland reiken, honderdzevenentwintig landschappen, ieder landschap naar zijn eigen schrift, ieder volk naar zijn eigen taal; ook aan de Joden naar hun schrift en naar hun taal. En men schreef in de naam van koning Ahasveros, en men verzegelde het met de ring van de koning; en men zond de brieven door de hand van de lopers te paard, die reden op snelle kamelen, op muildieren, geteeld uit merries;","Matt 7:13":"Ga in door de nauwe poort; want wijd is de poort, en breed is de weg die naar het verderf leidt, en velen zijn er die daardoor ingaan.","Ps 2:4":"Die in de hemel woont, zal lachen; de Heere zal hen bespotten.","1 Kon 15:27-34":"En Baësa, de zoon van Ahia, van het huis van Issaschar, smeedde een samenzwering tegen hem, en Baësa sloeg hem te Gibbethon, dat aan de Filistijnen toebehoort, toen Nadab en heel Israël Gibbethon belegerden. En Baësa doodde hem, in het derde jaar van Asa, de koning van Juda, en werd koning in zijn plaats. Het gebeurde nu, toen hij koning werd, dat hij het gehele huis van Jerobeam sloeg; hij liet niets van Jerobeam over wat adem had, totdat hij hem verdelgd had, naar het woord van de HEERE, dat Hij gesproken had door de dienst van Zijn knecht Ahia, de Siloniet;","Hab 2:9-12":"Wee hem die met kwade hebzucht rijkdom vergaart voor zijn huis, om zijn nest in de hoogte te zetten, om bevrijd te zijn uit de hand van het kwaad. U hebt schande beraamd voor uw huis; door veel volken uit te roeien hebt u tegen uw eigen ziel gezondigd. Want de steen uit de muur roept, en de balk uit het hout antwoordt hem.","Dan 5:19-21":"En vanwege de grootheid die Hij hem gegeven had, beefden en sidderden alle volken, naties en talen voor hem; wie hij wilde, doodde hij, en wie hij wilde, hield hij in leven, en wie hij wilde, verhoogde hij, en wie hij wilde, vernederde hij. Maar toen zijn hart zich verhief, en zijn geest verstijfd werd tot hoogmoed, werd hij van de troon van zijn koninkrijk afgestoten, en men nam de eer van hem weg. En hij werd van de mensenkinderen verstoten, en zijn hart werd gelijk gemaakt aan de dieren, en zijn woning was bij de woudezels; men gaf hem gras te eten zoals de ossen; en zijn lichaam werd nat gemaakt door de dauw van de hemel, totdat hij erkende dat God, de Allerhoogste, Heerser is over de koninkrijken van de mensen, en daarover stelt wie Hij wil.","Gen 4:5-8":"maar Kaïn en zijn offer zag Hij niet met welgevallen aan. Toen ontstak Kaïn zeer, en zijn gezicht betrok. En de HEERE zei tegen Kaïn: Waarom bent u ontstoken, en waarom is uw gezicht betrokken? Is het niet zo: als u goed doet, wordt u aanvaard? En als u niet goed doet, ligt de zonde aan de deur. Naar u gaat zijn begeerte uit, en u zult over hem heersen.","Openb 14:9-11":"En een derde engel is hen gevolgd, die met luide stem zei: Als iemand het beest aanbidt en zijn beeld, en het merkteken ontvangt aan zijn voorhoofd, of aan zijn hand, die zal ook drinken uit de wijn van de toorn van God, die onvermengd ingeschonken is in de drinkbeker van Zijn toorn; en hij zal gepijnigd worden met vuur en zwavel voor de heilige engelen en voor het Lam. En de rook van hun pijniging gaat op tot in alle eeuwigheid, en zij hebben geen rust, dag en nacht, zij die het beest aanbidden en zijn beeld, en zo iemand het merkteken van zijn naam ontvangt.","Gen 4:10":"En Hij zei: Wat hebt u gedaan? Daar is een stem van het bloed van uw broeder, die tot Mij roept vanuit de aardbodem.","Ezech 35:6":"Daarom, zo waarachtig als Ik leef, spreekt de Heere HEERE; Ik zal u voorzeker tot bloed bestemmen, en het bloed zal u achtervolgen; omdat u het bloed niet hebt gehaat, zal het bloed u ook achtervolgen.","Spr 10:25":"Zoals een wervelwind voorbijgaat, zo is de goddeloze niet meer; maar de rechtvaardige is een eeuwig fundament.","Ef 2:12":"dat u in die tijd was zonder Christus, vervreemd van het burgerschap van Israël, en vreemdelingen van de verbonden van de belofte, geen hoop hebbend, en zonder God in de wereld.","Hos 9:15":"Al hun slechtheid is in Gilgal, want daar heb Ik ze gehaat, om de slechtheid van hun daden; Ik zal ze uit Mijn huis verdrijven, Ik zal ze voortaan niet meer liefhebben; al hun vorsten zijn afvalligen.","Jes 10:3":"Maar wat zult u doen op de dag van de bezoeking, en van de verwoesting, die van verre komen zal? Naar wie zult u vluchten om hulp, en waar zult u uw heerlijkheid laten?","Hos 13:12":"Efraïms ongerechtigheid is samengebonden, zijn zonde is opgeslagen.","Ps 86:15":"Maar Gij, Heere! zijt een barmhartig en genadig God, geduldig, en groot van goedertierenheid en waarheid.","Hand 6:11":"Toen zetten zij mannen op die zeiden: Wij hebben hem lasterlijke woorden horen spreken tegen Mozes en God.","Spr 10:23":"Het is voor de dwaas als een spel om iets schandelijks te doen; maar voor een man van verstand, om wijsheid te plegen.","Jer 17:2":"Zoals hun kinderen aan hun altaren denken, en aan hun bossen, bij het groene geboomte, op de hoge heuvels.","Zef 3:7":"Ik zei: Zeker zult u Mij vrezen, u zult de tucht aannemen, opdat haar woning niet uitgeroeid zou worden; alles waarmee Ik haar bezocht heb¹, waarlijk, zij hebben zich vroeg opgemaakt, zij hebben al hun handelingen verdorven.","1 Kon 21:9-14":"En zij schreef in die brieven: Roept een vasten uit, en zet Naboth vooraan onder het volk; En zet tegenover hem twee mannen, zonen van Belial, die tegen hem getuigen en zeggen: U hebt God en de koning gevloekt; en voer hem naar buiten, en stenig hem, dat hij sterft. En de mannen van zijn stad, die oudsten en die edelen, die in zijn stad woonden, deden zoals Izebel hun
