 bed, keerde zijn gezicht om, en at geen brood.","5":"Maar Izebel, zijn vrouw, kwam bij hem en zei tegen hem: Wat is dit, dat uw geest zo knorrig is, en dat u geen brood eet?","6":"En hij zei tegen haar: Omdat ik tot Naboth, de Jizreëliet, gesproken heb en tegen hem gezegd heb: Geef mij uw wijngaard voor geld, of, als het u zint, zal ik u een andere wijngaard in zijn plaats geven; maar hij heeft gezegd: Ik zal u mijn wijngaard niet geven.","7":"Toen zei Izebel, zijn vrouw, tegen hem: Regeert u nu het koninkrijk over Israël? Sta op, eet brood, en laat uw hart vrolijk zijn; ik zal u de wijngaard van Naboth, de Jizreëliet, geven.","8":"Zij schreef dan brieven in de naam van Achab, en verzegelde ze met zijn zegel; en zond de brieven aan de oudsten en aan de edelen, die in zijn stad waren, wonend bij Naboth.","9":"En zij schreef in die brieven: Roept een vasten uit, en zet Naboth vooraan onder het volk;","10":"En zet tegenover hem twee mannen, zonen van Belial, die tegen hem getuigen en zeggen: U hebt God en de koning gevloekt; en voer hem naar buiten, en stenig hem, dat hij sterft.","11":"En de mannen van zijn stad, die oudsten en die edelen, die in zijn stad woonden, deden zoals Izebel hun gezonden had; zoals geschreven was in de brieven die zij hun gezonden had.","12":"Zij riepen een vasten uit; en zij zetten Naboth vooraan onder het volk.","13":"Toen kwamen de twee mannen, zonen van Belial, en gingen tegenover hem zitten; en de mannen van Belial getuigden tegen hem, tegen Naboth, voor het volk, en zeiden: Naboth heeft God en de koning gevloekt. En zij voerden hem de stad uit, en stenigden hem met stenen, zodat hij stierf.","14":"Daarna zonden zij een bericht aan Izebel: Naboth is gestenigd en is dood.","15":"Het gebeurde nu, toen Izebel hoorde dat Naboth gestenigd en dood was, dat Izebel tegen Achab zei: Sta op, neem de wijngaard van Naboth, de Jizreëliet, in bezit, die hij u weigerde voor geld te geven; want Naboth leeft niet meer, maar is dood.","16":"En het gebeurde, toen Achab hoorde dat Naboth dood was, dat Achab opstond om naar de wijngaard van Naboth, de Jizreëliet, af te gaan, om die in bezit te nemen.","17":"Doch het woord van de HEERE kwam tot Elia, de Thisbiet:","18":"Maak u op, ga naar beneden, Achab, de koning van Israël, tegemoet, die in Samaria is; zie, hij is in de wijngaard van Naboth, waarheen hij afgegaan is om die in bezit te nemen.","19":"En u zult tot hem spreken en zeggen: Zo zegt de HEERE: Hebt u doodgeslagen, en ook een erfelijke bezitting ingenomen? Daartoe zult u tot hem spreken en zeggen: Zo zegt de HEERE: Op de plaats waar de honden het bloed van Naboth gelekt hebben, zullen de honden ook uw bloed lekken, ja, het uwe!","20":"En Achab zei tegen Elia: Hebt u mij gevonden, o mijn vijand? En hij zei: Ik heb u gevonden, omdat u uzelf verkocht hebt om te doen wat kwaad is in de ogen van de HEERE.","21":"Zie, Ik zal kwaad over u brengen, en uw nakomelingen wegdoen; en Ik zal van Achab uitroeien wie mannelijk is[1], alsook wie in Israël afgesloten is en wie verlaten is.","22":"En Ik zal uw huis maken als het huis van Jerobeam, de zoon van Nebat, en als het huis van Baësa, de zoon van Ahia; om de terging waarmee u Mij getergd hebt, en dat u Israël hebt doen zondigen.","23":"Verder sprak de HEERE ook over Izebel: De honden zullen Izebel eten, bij de voorwal van Jizreël.","24":"Wie van Achab in de stad sterft, zullen de honden eten; en wie in het veld sterft, zullen de vogels van de hemel eten.","25":"Doch er was niemand geweest zoals Achab, die zichzelf verkocht had om te doen wat kwaad is in de ogen van de HEERE, omdat Izebel, zijn vrouw, hem ophitste.","26":"En hij deed zeer gruwelijk, door achter de drekgoden[2] aan te gaan; naar alles wat de Amorieten gedaan hadden, die God voor het aangezicht van de kinderen van Israël uit hun bezit verdreven had.","27":"Het gebeurde nu, toen Achab deze woorden hoorde, dat hij zijn kleren scheurde, en een zak om zijn lichaam legde, en vastte; hij lag ook neer in de zak, en ging langzaam.","28":"En het woord van de HEERE kwam tot Elia, de Thisbiet:","29":"Hebt u gezien dat Achab zich vernedert voor Mijn aangezicht? Omdat hij zich vernedert voor Mijn aangezicht, zal Ik dat kwaad in zijn dagen niet brengen; in de dagen van zijn zoon zal Ik dat kwaad over zijn huis brengen."},"SV":{"1":"Het geschiedde nu na deze dingen, *alzo* Naboth, een Jizreëliet, een wijngaard had, die te Jizreël was, bij het paleis van Achab, den koning van Samaria.","2":"Dat Achab sprak tot Naboth, zeggende: Geef mij uw wijngaard, opdat hij mij zij tot een kruidhof, dewijl hij nabij mijn huis is; en ik zal u daarvoor geven een wijngaard, die beter is dan die; *of*, zo het goed in uw ogen is, zal ik u in geld deszelfs waarde geven.","3":"Maar Naboth zeide tot Achab: Dat late de HEERE verre van mij zijn, dat ik u de erve mijner vaderen geven zou!","4":"Toen kwam Achab in zijn huis, gemelijk en toornig over het woord, dat Naboth, de Jizreëliet, tot hem gesproken had, en gezegd: Ik zal de erve mijner vaderen niet geven. En hij leide zich neder op zijn bed, en keerde zijn aangezicht om, en at geen brood.","5":"Maar Izebel, zijn huisvrouw, kwam tot hem, en sprak tot hem: Wat is dit, dat uw geest dus gemelijk is, en dat gij geen brood eet?","6":"En hij sprak tot haar: Omdat ik tot Naboth, den Jizreëliet, gesproken en hem gezegd heb: Geef mij uw wijngaard om geld, of, zo het u behaagt, zal ik u een wijngaard in zijn plaats geven; maar hij heeft gezegd: Ik zal u mijn wijngaard niet geven.","7":"Toen zeide Izebel, zijn huisvrouw, tot hem: Zoudt gij nu het koninkrijk over Israël regeren? Sta op, eet brood, en uw hart zij vrolijk; ik zal u den wijngaard van Naboth, den Jizreëliet, geven.","8":"Zij dan schreef brieven in den naam van Achab, en verzegelde ze met zijn signet; en zond de brieven tot de oudsten en tot de edelen, die in zijn stad waren, wonende met Naboth.","9":"En zij schreef in die brieven, zeggende: Roept een vasten uit, en zet Naboth in de hoogste plaats des volks;","10":"En zet tegenover hem twee mannen, zonen Belials, die tegen hem getuigen, zeggende: Gij hebt God en den koning gezegend; en voert hem uit, en stenigt hem, dat hij sterve.","11":"En de mannen zijner stad, die oudsten en die edelen, die in zijn stad woonden, deden gelijk als Izebel tot hen gezonden had; gelijk als geschreven was in de brieven, die zij tot hen gezonden had.","12":"Zij riepen een vasten uit; en zij zetten Naboth in de hoogste plaats des volks.","13":"Toen kwamen de twee mannen, zonen Belials, en zetten zich tegenover hem; en de mannen Belials getuigden tegen hem, tegen Naboth, voor het volk, zeggende: Naboth heeft God en den koning gezegend. En zij voerden hem buiten de stad, en stenigden hem met stenen, dat hij stierf.","14":"Daarna zonden zij tot Izebel, zeggende: Naboth is gestenigd en is dood.","15":"Het geschiedde nu, toen Izebel hoorde, dat Naboth gestenigd en dood was, dat Izebel tot Achab zeide: Sta op, bezit den wijngaard van Naboth, den Jizreëliet, erfelijk, dien hij u weigerde om geld te geven; want Naboth leeft niet, maar is dood.","16":"En het geschiedde, als Achab hoorde, dat Naboth dood was, dat Achab opstond, om naar den wijngaard van Naboth, den Jizreëliet, af te gaan, om dien erfelijk te bezitten.","17":"Doch het woord des HEEREN geschiedde tot Elia, den Thisbiet, zeggende:","18":"Maak u op, ga henen af, Achab, den koning van Israël, tegemoet, die in Samaria is; zie hij is in den wijngaard van Naboth, waarhenen hij afgegaan is, om dien erfelijk te bezitten.","19":"En gij zult tot hem spreken, zeggende: Alzo zegt de HEERE: Hebt gij doodgeslagen, en ook een erfelijke bezitting ingenomen? Daartoe zult gij tot hem spreken, zeggende: Alzo zegt de HEERE: In plaats dat de honden het bloed van Naboth gelekt hebben, zullen de honden uw bloed lekken, ja het uwe!","20":"En Achab zeide tot Elia: Hebt gij mij gevonden, o, mijn vijand? En hij zeide: Ik heb *u* gevonden, overmits gij uzelven verkocht hebt, om te doen dat kwaad is in de ogen des HEEREN.","21":"Zie, Ik zal kwaad over u brengen, en uw nakomelingen wegdoen; en Ik zal van Achab uitroeien wat mannelijk is, mitsgaders den beslotene en verlatene in Israël.","22":"En Ik zal uw huis maken gelijk het huis van Jerobeam, den zoon van Nebat, en gelijk het huis van Baësa, den zoon van Ahia; om de terging, waarmede gij *Mij* getergd hebt, en dat gij Israël hebt doen zondigen.","23":"Verder ook over Izebel sprak de HEERE, zeggende: De honden zullen Izebel eten, aan den voorwal van Jizreël.","24":"Die van Achab sterft in de stad, zullen de honden eten; en die in het veld sterft, zullen de vogelen des hemels eten.","25":"Doch er was niemand geweest gelijk Achab, die zichzelven verkocht had, om te doen dat kwaad is in de ogen des HEEREN, dewijl Izebel, zijn huisvrouw, hem ophitste.","26":"En hij deed zeer gruwelijk, wandelende achter de drekgoden; naar alles, wat de Amorieten gedaan hadden, die God voor het aangezicht van de kinderen Israëls uit de bezitting verdreven had.","27":"Het geschiedde nu, als Achab deze woorden hoorde, dat hij zijn klederen scheurde, en een zak om zijn vlees leide, en vastte; hij lag ook neder in den zak, en ging langzaam.","28":"En het woord des HEEREN geschiedde tot Elia, den Thisbiet, zeggende:","29":"Hebt gij gezien, dat Achab zich vernedert voor Mijn aangezicht? Daarom dewijl hij zich vernedert voor Mijn aangezicht, zo zal Ik dat kwaad in zijn dagen niet brengen; in de dagen zijns zoons zal Ik dat kwaad over zijn huis brengen."},"KJV":{"1":"And it came to pass after these things, that Naboth the Jezreelite had a vineyard, which was in Jezreel, hard by the palace of Ahab king of Samaria.","2":"And Ahab spake unto Naboth, saying, Give me thy vineyard, that I may have it for a garden of herbs, because it is near unto my house: and I will give thee for it a better vineyard than it; or, if it seem good to thee, I will give thee the worth of it in money.","3":"And Naboth said to Ahab, The LORD forbid it me, that I should give the inheritance of my fathers unto thee.","4":"And Ahab came into his house heavy and displeased because of the word which Naboth the Jezreelite had spoken to him: for he had said, I will not give thee the inheritance of my fathers. And he laid him down upon his bed, and turned away his face, and would eat no bread.","5":"But Jezebel his wife came to him, and said unto him, Why is thy spirit so sad, that thou eatest no bread?","6":"And he said unto her, Because I spake unto Naboth the Jezreelite, and said unto him, Give me thy vineyard for money; or else, if it please thee, I will give thee another vineyard for it: and he answered, I will not give thee my vineyard.","7":"And Jezebel his wife said unto him, Dost thou now govern the kingdom of Israel? arise, and eat bread, and let thine heart be merry: I will give thee the vineyard of Naboth the Jezreelite.","8":"So she wrote letters in Ahab's name, and sealed them with his seal, and sent the letters unto the elders and to the nobles that were in his city, dwelling with Naboth.","9":"And she wrote in the letters, saying, Proclaim a fast, and set Naboth on high among the people:","10":"And set two men, sons of Belial, before him, to bear witness against him, saying, Thou didst blaspheme God and the king. And then carry him out, and stone him, that he may die.","11":"And the men of his city, even the elders and the nobles who were the inhabitants in his city, did as Jezebel had sent unto them, and as it was written in the letters which she had sent unto them.","12":"They proclaimed a fast, and set Naboth on high among the people.","13":"And there came in two men, children of Belial, and sat before him: and the men of Belial witnessed against him, even against Naboth, in the presence of the people, saying, Naboth did blaspheme God and the king. Then they carried him forth out of the city, and stoned him with stones, that he died.","14":"Then they sent to Jezebel, saying, Naboth is stoned, and is dead.","15":"And it came to pass, when Jezebel heard that Naboth was stoned, and was dead, that Jezebel said to Ahab, Arise, take possession of the vineyard of Naboth the Jezreelite, which he refused to give thee for money: for Naboth is not alive, but dead.","16":"And it came to pass, when Ahab heard that Naboth was dead, that Ahab rose up to go down to the vineyard of Naboth the Jezreelite, to take possession of it.","17":"And the word of the LORD came to Elijah the Tishbite, saying,","18":"Arise, go down to meet Ahab king of Israel, which is in Samaria: behold, he is in the vineyard of Naboth, whither he is gone down to possess it.","19":"And thou shalt speak unto him, saying, Thus saith the LORD, Hast thou killed, and also taken possession? And thou shalt speak unto him, saying, Thus saith the LORD, In the place where dogs licked the blood of Naboth shall dogs lick thy blood, even thine.","20":"And Ahab said to Elijah, Hast thou found me, O mine enemy? And he answered, I have found thee: because thou hast sold thyself to work evil in the sight of the LORD.","21":"Behold, I will bring evil upon thee, and will take away thy posterity, and will cut off from Ahab him that pisseth against the wall, and him that is shut up and left in Israel,","22":"And will make thine house like the house of Jeroboam the son of Nebat, and like the house of Baasha the son of Ahijah, for the provocation wherewith thou hast provoked me to anger, and made Israel to sin.","23":"And of Jezebel also spake the LORD, saying, The dogs shall eat Jezebel by the wall of Jezreel.","24":"Him that dieth of Ahab in the city the dogs shall eat; and him that dieth in the field shall the fowls of the air eat.","25":"But there was none like unto Ahab, which did sell himself to work wickedness in the sight of the LORD, whom Jezebel his wife stirred up.","26":"And he did very abominably in following idols, according to all things as did the Amorites, whom the LORD cast out before the children of Israel.","27":"And it came to pass, :35-39"},{"disp":"Eze 16:47","ref":"Ezech 16:47"}]}],"27":[{"kopje":"he rent","refs":[{"disp":"Gen 37:34","ref":"Gen 37:34"},{"disp":"2Ki 6:30","ref":"2 Kon 6:30"},{"disp":"2Ki 18:37","ref":"2 Kon 18:37"},{"disp":"Jon 3:6","ref":"Jona 3:6"}]},{"kopje":"lay in sackcloth","refs":[{"disp":"2Sa 12:17","ref":"2 Sam 12:17"},{"disp":"Job 16:15","ref":"Job 16:15"},{"disp":"Isa 22:12","ref":"Jes 22:12"},{"disp":"Isa 58:5-8","ref":"Jes 58:5-8"},{"disp":"Joe 1:13","ref":"Joël 1:13"}]},{"kopje":"went softly","refs":[{"disp":"Isa 38:15","ref":"Jes 38:15"}]}],"29":[{"kopje":"Seest thou","refs":[{"disp":"Jer 7:17","ref":"Jer 7:17"},{"disp":"Luk 7:44","ref":"Luk 7:44"}]},{"kopje":"Ahab","refs":[{"disp":"Exo 10:3","ref":"Ex 10:3"},{"disp":"Psa 18:44","ref":"Ps 18:45"},{"disp":"Psa 66:3","ref":"Ps 66:3"},{"disp":"Psa 78:34-37","ref":"Ps 78:34-37"}]},{"kopje":"I will not","refs":[{"disp":"Psa 86:15","ref":"Ps 86:15"},{"disp":"Eze 33:10","ref":"Ezech 33:10"},{"disp":"Eze 33:11","ref":"Ezech 33:11"},{"disp":"Mic 7:18","ref":"Micha 7:18"},{"disp":"Rom 2:4","ref":"Rom 2:4"},{"disp":"2Pe 3:9","ref":"2 Petr 3:9"}]},{"kopje":"the evil in","refs":[{"disp":"1Ki 21:21-23","ref":"1 Kon 21:21-23"}]},{"kopje":"in his son's days","refs":[{"disp":"2Ki 9:25","ref":"2 Kon 9:25"},{"disp":"2Ki 9:26","ref":"2 Kon 9:26"},{"disp":"2Ki 9:33-37","ref":"2 Kon 9:33-37"},{"disp":"2Ki 10:1-7","ref":"2 Kon 10:1-7"},{"disp":"2Ki 10:11","ref":"2 Kon 10:11"}]}]},"koppeling_kjv":{"1":"And it came to pass <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> these <span class=\"wl wl-kjv\" data-code=\"H1697\">things,</span> that <span class=\"wl wl-kjv\" data-code=\"H5022\">Naboth</span> the <span class=\"wl wl-kjv\" data-code=\"H3158\">Jezreelite</span> had a <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyard,</span> which was in <span class=\"wl wl-kjv\" data-code=\"H3157\">Jezreel,</span> hard <span class=\"wl wl-kjv\" data-code=\"H681\">by</span> the <span class=\"wl wl-kjv\" data-code=\"H1964\">palace</span> of <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria.</span>","2":"And <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto <span class=\"wl wl-kjv\" data-code=\"H5022\">Naboth,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">Give</span> me thy <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyard,</span> that I may have it for a <span class=\"wl wl-kjv\" data-code=\"H1588\">garden</span> of <span class=\"wl wl-kjv\" data-code=\"H3419\">herbs,</span> because it is <span class=\"wl wl-kjv\" data-code=\"H7138\">near</span> <span class=\"wl wl-kjv\" data-code=\"H681\">unto</span> my <span class=\"wl wl-kjv\" data-code=\"H1004\">house:</span> and I will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thee for it a <span class=\"wl wl-kjv\" data-code=\"H2896\">better</span> <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyard</span> than it; or, if it seem <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> to <span class=\"wl wl-kjv\" data-code=\"H5869\">thee,</span> I will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thee the <span class=\"wl wl-kjv\" data-code=\"H4242\">worth</span> of it in <span class=\"wl wl-kjv\" data-code=\"H3701\">money.</span>","3":"And <span class=\"wl wl-kjv\" data-code=\"H5022\">Naboth</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab,</span> The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2486\">forbid</span> it me, that I should <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> the <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance</span> of my <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> unto thee.","4":"And <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> into his <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> <span class=\"wl wl-kjv\" data-code=\"H5620\">heavy</span> and <span class=\"wl wl-kjv\" data-code=\"H2198\">displeased</span> because of the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> which <span class=\"wl wl-kjv\" data-code=\"H5022\">Naboth</span> the <span class=\"wl wl-kjv\" data-code=\"H3158\">Jezreelite</span> had <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> to him: for he had <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will not <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thee the <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance</span> of my <span class=\"wl wl-kjv\" data-code=\"H1\">fathers.</span> And he laid him <span class=\"wl wl-kjv\" data-code=\"H7901\">down</span> upon his <span class=\"wl wl-kjv\" data-code=\"H4296\">bed,</span> and turned <span class=\"wl wl-kjv\" data-code=\"H5437\">away</span> his <span class=\"wl wl-kjv\" data-code=\"H6440\">face,</span> and would <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> no <span class=\"wl wl-kjv\" data-code=\"H3899\">bread.</span>","5":"But <span class=\"wl wl-kjv\" data-code=\"H348\">Jezebel</span> his <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to him, and <span class=\"wl wl-kjv\" data-code=\"H1696\">said</span> unto him, Why is thy <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> so <span class=\"wl wl-kjv\" data-code=\"H5620\">sad,</span> that thou <span class=\"wl wl-kjv\" data-code=\"H398\">eatest</span> no <span class=\"wl wl-kjv\" data-code=\"H3899\">bread?</span>","6":"And he <span class=\"wl wl-kjv\" data-code=\"H1696\">said</span> unto her, Because I <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto <span class=\"wl wl-kjv\" data-code=\"H5022\">Naboth</span> the <span class=\"wl wl-kjv\" data-code=\"H3158\">Jezreelite,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H5414\">Give</span> me thy <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyard</span> for <span class=\"wl wl-kjv\" data-code=\"H3701\">money;</span> or else, if it <span class=\"wl wl-kjv\" data-code=\"H2655\">please</span> thee, I will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thee another <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyard</span> for it: and he <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> I will not <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thee my <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyard.</span>","7":"And <span class=\"wl wl-kjv\" data-code=\"H348\">Jezebel</span> his <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Dost thou now <span class=\"wl wl-kjv\" data-code=\"H6213\">govern</span> the <span class=\"wl wl-kjv\" data-code=\"H4410\">kingdom</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel?</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">arise,</span> and <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread,</span> and let thine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> be <span class=\"wl wl-kjv\" data-code=\"H3190\">merry:</span> I will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thee the <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyard</span> of <span class=\"wl wl-kjv\" data-code=\"H5022\">Naboth</span> the <span class=\"wl wl-kjv\" data-code=\"H3158\">Jezreelite.</span>","8":"So she <span class=\"wl wl-kjv\" data-code=\"H3789\">wrote</span> <span class=\"wl wl-kjv\" data-code=\"H5612\">letters</span> in <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab's</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> and <span class=\"wl wl-kjv\" data-code=\"H2856\">sealed</span> them with his <span class=\"wl wl-kjv\" data-code=\"H2368\">seal,</span> and <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> the <span class=\"wl wl-kjv\" data-code=\"H5612\">letters</span> unto the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> and to the <span class=\"wl wl-kjv\" data-code=\"H2715\">nobles</span> that were in his <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelling</span> with <span class=\"wl wl-kjv\" data-code=\"H5022\">Naboth.</span>","9":"And she <span class=\"wl wl-kjv\" data-code=\"H3789\">wrote</span> in the <span class=\"wl wl-kjv\" data-code=\"H5612\">letters,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">Proclaim</span> a <span class=\"wl wl-kjv\" data-code=\"H6685\">fast,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">set</span> <span class=\"wl wl-kjv\" data-code=\"H5022\">Naboth</span> on <span class=\"wl wl-kjv\" data-code=\"H7218\">high</span> among the <span class=\"wl wl-kjv\" data-code=\"H5971\">people:</span>","10":"And <span class=\"wl wl-kjv\" data-code=\"H3427\">set</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men,</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H1100\">Belial,</span> before him, to bear <span class=\"wl wl-kjv\" data-code=\"H5749\">witness</span> against him, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Thou didst <span class=\"wl wl-kjv\" data-code=\"H1288\">blaspheme</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span> And then carry him <span class=\"wl wl-kjv\" data-code=\"H3318\">out,</span> and <span class=\"wl wl-kjv\" data-code=\"H5619\">stone</span> him, that he may <span class=\"wl wl-kjv\" data-code=\"H4191\">die.</span>","11":"And the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of his <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> even the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> and the <span class=\"wl wl-kjv\" data-code=\"H2715\">nobles</span> who were the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> in his <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> as <span class=\"wl wl-kjv\" data-code=\"H348\">Jezebel</span> had <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> unto them, and as it was <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in the <span class=\"wl wl-kjv\" data-code=\"H5612\">letters</span> which she had <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> unto them.","12":"They <span class=\"wl wl-kjv\" data-code=\"H7121\">proclaimed</span> a <span class=\"wl wl-kjv\" data-code=\"H6685\">fast,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">set</span> <span class=\"wl wl-kjv\" data-code=\"H5022\">Naboth</span> on <span class=\"wl wl-kjv\" data-code=\"H7218\">high</span> among the <span class=\"wl wl-kjv\" data-code=\"H5971\">people.</span>","13":"And there <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> in <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men,</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H1100\">Belial,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> before him: and the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H1100\">Belial</span> <span class=\"wl wl-kjv\" data-code=\"H5749\">witnessed</span> against him, even against <span class=\"wl wl-kjv\" data-code=\"H5022\">Naboth,</span> in the presence of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H5022\">Naboth</span> did <span class=\"wl wl-kjv\" data-code=\"H1288\">blaspheme</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span> Then they carried him <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> <span class=\"wl wl-kjv\" data-code=\"H2351\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and <span class=\"wl wl-kjv\" data-code=\"H5619\">stoned</span> him with <span class=\"wl wl-kjv\" data-code=\"H68\">stones,</span> that he <span class=\"wl wl-kjv\" data-code=\"H4191\">died.</span>","14":"Then they <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> to <span class=\"wl wl-kjv\" data-code=\"H348\">Jezebel,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H5022\">Naboth</span> is <span class=\"wl wl-kjv\" data-code=\"H5619\">stoned,</span> and is <span class=\"wl wl-kjv\" data-code=\"H4191\">dead.</span>","15":"And it came to pass, when <span class=\"wl wl-kjv\" data-code=\"H348\">Jezebel</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> that <span class=\"wl wl-kjv\" data-code=\"H5022\">Naboth</span> was <span class=\"wl wl-kjv\" data-code=\"H5619\">stoned,</span> and was <span class=\"wl wl-kjv\" data-code=\"H4191\">dead,</span> that <span class=\"wl wl-kjv\" data-code=\"H348\">Jezebel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab,</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">Arise,</span> take <span class=\"wl wl-kjv\" data-code=\"H3423\">possession</span> of the <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyard</span> of <span class=\"wl wl-kjv\" data-code=\"H5022\">Naboth</span> the <span class=\"wl wl-kjv\" data-code=\"H3158\">Jezreelite,</span> which he <span class=\"wl wl-kjv\" data-code=\"H3985\">refused</span> to <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thee for <span class=\"wl wl-kjv\" data-code=\"H3701\">money:</span> for <span class=\"wl wl-kjv\" data-code=\"H5022\">Naboth</span> is not <span class=\"wl wl-kjv\" data-code=\"H2416\">alive,</span> but <span class=\"wl wl-kjv\" data-code=\"H4191\">dead.</span>","16":"And it came to pass, when <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> that <span class=\"wl wl-kjv\" data-code=\"H5022\">Naboth</span> was <span class=\"wl wl-kjv\" data-code=\"H4191\">dead,</span> that <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> rose <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> to go <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to the <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyard</span> of <span class=\"wl wl-kjv\" data-code=\"H5022\">Naboth</span> the <span class=\"wl wl-kjv\" data-code=\"H3158\">Jezreelite,</span> to take <span class=\"wl wl-kjv\" data-code=\"H3423\">possession</span> of it.","17":"And the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> came to <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah</span> the <span class=\"wl wl-kjv\" data-code=\"H8664\">Tishbite,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span>","18":"<span class=\"wl wl-kjv\" data-code=\"H6965\">Arise,</span> go <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> which is in <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria:</span> behold, he is in the <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyard</span> of <span class=\"wl wl-kjv\" data-code=\"H5022\">Naboth,</span> whither he is gone <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to <span class=\"wl wl-kjv\" data-code=\"H3423\">possess</span> it.","19":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> Hast thou <span class=\"wl wl-kjv\" data-code=\"H7523\">killed,</span> and also taken <span class=\"wl wl-kjv\" data-code=\"H3423\">possession?</span> And thou shalt <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> In the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> where <span class=\"wl wl-kjv\" data-code=\"H3611\">dogs</span> <span class=\"wl wl-kjv\" data-code=\"H3952\">licked</span> the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> of <span class=\"wl wl-kjv\" data-code=\"H5022\">Naboth</span> shall <span class=\"wl wl-kjv\" data-code=\"H3611\">dogs</span> <span class=\"wl wl-kjv\" data-code=\"H3952\">lick</span> thy <span class=\"wl wl-kjv\" data-code=\"H1818\">blood,</span> even thine.","20":"And <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah,</span> Hast thou <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> me, O mine <span class=\"wl wl-kjv\" data-code=\"H341\">enemy?</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> I have <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> thee: because thou hast <span class=\"wl wl-kjv\" data-code=\"H4376\">sold</span> thyself to <span class=\"wl wl-kjv\" data-code=\"H6213\">work</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","21":"Behold, I will <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> upon thee, and will take <span class=\"wl wl-kjv\" data-code=\"H1197\">away</span> thy <span class=\"wl wl-kjv\" data-code=\"H310\">posterity,</span> and will cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> from <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> him that <span class=\"wl wl-kjv\" data-code=\"H8366\">pisseth</span> against the <span class=\"wl wl-kjv\" data-code=\"H7023\">wall,</span> and him that is shut <span class=\"wl wl-kjv\" data-code=\"H6113\">up</span> and <span class=\"wl wl-kjv\" data-code=\"H5800\">left</span> in <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span>","22":"And will <span class=\"wl wl-kjv\" data-code=\"H5414\">make</span> thine <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> like the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5028\">Nebat,</span> and like the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H1201\">Baasha</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H281\">Ahijah,</span> for the <span class=\"wl wl-kjv\" data-code=\"H3708\">provocation</span> wherewith thou hast provoked me to <span class=\"wl wl-kjv\" data-code=\"H3707\">anger,</span> and made <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> to <span class=\"wl wl-kjv\" data-code=\"H2398\">sin.</span>","23":"And of <span class=\"wl wl-kjv\" data-code=\"H348\">Jezebel</span> also <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> The <span class=\"wl wl-kjv\" data-code=\"H3611\">dogs</span> shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> <span class=\"wl wl-kjv\" data-code=\"H348\">Jezebel</span> by the <span class=\"wl wl-kjv\" data-code=\"H2426\">wall</span> of <span class=\"wl wl-kjv\" data-code=\"H3157\">Jezreel.</span>","24":"Him that <span class=\"wl wl-kjv\" data-code=\"H4191\">dieth</span> of <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> in the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> the <span class=\"wl wl-kjv\" data-code=\"H3611\">dogs</span> shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat;</span> and him that <span class=\"wl wl-kjv\" data-code=\"H4191\">dieth</span> in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> shall the <span class=\"wl wl-kjv\" data-code=\"H5775\">fowls</span> of the <span class=\"wl wl-kjv\" data-code=\"H8064\">air</span> <span class=\"wl wl-kjv\" data-code=\"H398\">eat.</span>","25":"But there was none like unto <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab,</span> which did <span class=\"wl wl-kjv\" data-code=\"H4376\">sell</span> himself to <span class=\"wl wl-kjv\" data-code=\"H6213\">work</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">wickedness</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> whom <span class=\"wl wl-kjv\" data-code=\"H348\">Jezebel</span> his <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> stirred <span class=\"wl wl-kjv\" data-code=\"H5496\">up.</span>","26":"And he did <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H8581\">abominably</span> in <span class=\"wl wl-kjv\" data-code=\"H3212\">following</span> <span class=\"wl wl-kjv\" data-code=\"H1544\">idols,</span> according to all things as <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> the <span class=\"wl wl-kjv\" data-code=\"H567\">Amorites,</span> whom the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> cast <span class=\"wl wl-kjv\" data-code=\"H3423\">out</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","27":"And it came to pass, when <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> those <span class=\"wl wl-kjv\" data-code=\"H1697\">words,</span> that he <span class=\"wl wl-kjv\" data-code=\"H7167\">rent</span> his <span class=\"wl wl-kjv\" data-code=\"H899\">clothes,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> <span class=\"wl wl-kjv\" data-code=\"H8242\">sackcloth</span> upon his <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh,</span> and <span class=\"wl wl-kjv\" data-code=\"H6684\">fasted,</span> and <span class=\"wl wl-kjv\" data-code=\"H7901\">lay</span> in <span class=\"wl wl-kjv\" data-code=\"H8242\">sackcloth,</span> and <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> <span class=\"wl wl-kjv\" data-code=\"H328\">softly.</span>","28":"And the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> came to <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah</span> the <span class=\"wl wl-kjv\" data-code=\"H8664\">Tishbite,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span>","29":"<span class=\"wl wl-kjv\" data-code=\"H7200\">Seest</span> thou how <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> <span class=\"wl wl-kjv\" data-code=\"H3665\">humbleth</span> himself <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> me? <span class=\"wl wl-kjv\" data-code=\"H3282\">because</span> he <span class=\"wl wl-kjv\" data-code=\"H3665\">humbleth</span> himself <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> me, I will not <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> the <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> in his <span class=\"wl wl-kjv\" data-code=\"H3117\">days:</span> but in his <span class=\"wl wl-kjv\" data-code=\"H1121\">son's</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> will I <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> the <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> upon his <span class=\"wl wl-kjv\" data-code=\"H1004\">house.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Jizreël was,","tekst":"Zie van deze stad boven, 1Ki 18:45."}],"2":[{"catchword":"kruidhof,","tekst":"Of, groenselhof. Hebreeuws, een hof der groente, of, des groensels. Het Hebreeuwse woord betekent allerlei groen kruid, voornamelijk dat gezaaid en tot spijs gebruikt wordt. Vergelijk Deu 11:10."},{"catchword":"goed in uw ogen is,","tekst":"Zie van deze manier van spreken Gen 19:8; voor dezelve is onder, vs.6, zo het u behaagt."}],"3":[{"catchword":"Dat late de HEERE","tekst":"Hebreeuws, dat zij mij verre vanwege, of om den Heere. De reden dezer weigering was, omdat God in zijn wet verboden had de erfgoederen der stammen en huisgezinnen in eigendom te vervreemden; Lev 25:23; Num 36:7, enz."}],"4":[{"catchword":"gemelijk","tekst":"Alzo onder, vs.5. Zie boven, 1Ki 20:43."},{"catchword":"keerde zijn aangezicht","tekst":"Te weten, naar den wand, van de mensen af, niet willende iemand spraak leveren, of met iemand te doen hebben."},{"catchword":"brood","tekst":"Dat is, geen spijs. Zie Gen 3:19; alzo in het volgende."}],"7":[{"catchword":"regeren?","tekst":"Hebreeuws, doen; dat is, regeren, bedienen, handhaven. De zin is dat hij niet waardig zou zijn koning over Israël te wezen, indien hij zoveel verstand of courage niet had, waarmede men een Naboth bedwingen en hem zijn wijnberg afhandig kon maken."},{"catchword":"vrolijk;","tekst":"Hebreeuws, zij goed; dat is, vrolijk. Zie goed, voor vrolijk, Jdg 16:25, en Jdg 18:20; 1Sa 25:8, 1Sa 25:36."}],"8":[{"catchword":"de oudsten","tekst":"Dat is, magistraat, raad en overste der stad. Alzo Deu 21:2; Jdg 8:14; Rth 4:2."},{"catchword":"edelen,","tekst":"Het Hebreeuwse woord betekent eigenlijk witte, door welke men verstaan moet de edele, voornaamste en aanzienlijkste lieden, omdat die gemeenlijk met witte klederen gekleed gingen. Zie de aantekeningen Gen 41:42; idem Est 8:15, en onder, vs.11."},{"catchword":"zijn stad waren,","tekst":"Alzo onder, vs.11. Versta Jizreël, welke Naboths stad genoemd wordt [gelijk ook hij zelf een Jizreëliet, boven, vs.1, 7], omdat hij daarin woonde, of misschien ook daarin geboren was. Zie dezelfde manier van spreken, Gen 23:10, en Gen 24:10, en de aantekeningen daarop."},{"catchword":"wonende met Naboth","tekst":"Dat is, die zijn medeburgers waren."}],"9":[{"catchword":"Roept","tekst":"Dit beveelt zijt, opdat men kennis zou nemen van het leven en den wandel van Naboth. Want de vastendagen werden onderhouden om, onder andere redenen, ook onderzoek te doen naar enige grove zonden, die openbaar geworden waren, en die naar behoren te straffen, ten einde alzo de gramschap Gods van de gehele gemeente afgekeerd mocht worden."},{"catchword":"in de hoogste plaats","tekst":"Hebreeuws, in het hoofd des volks, alzo onder, vs.12. Versta hierdoor, een verheven plaats der vergadering, in welke de beschuldigden gesteld werden, opdat zij te beter van het volk zouden gezien en gehoord worden. Of, versta, een verheven en waardig gestoelte, waarin de voornaamsten der stad [onder welken men meent, dat Naboth een geweest is] plachten te zitten, en dat Naboth daar, in zijn gewoonlijke plaats te zitten, toegelaten werd, om hem alle nadenken te benemen van het kwaad, dat tegen hem gestookt werd."}],"10":[{"catchword":"zonen Belials,","tekst":"Versta door dezen ondeugende mensen, die, het juk der goddelijke vreze en der menselijke eerbaarheid afgeworpen hebbende, slechts genegen zijn om zonder enige conscientie kwaad te doen. Zie Deu 13:13."},{"catchword":"gezegend;","tekst":"Zegenen heet hier vloeken. Want dit is zo afgrijslijk gehouden geweest, dat men het kwalijk durfde noemen, zodat in de plaats daarvan het tegendeel bedekter wijze gezegd wordt. Alzo onder, vs.13, en Job 1:5, Job 1:11, en Job 2:9."},{"catchword":"voert hem uit,","tekst":"Te weten, buiten de stad. Want hier in voortijden was het een gebruik, dat de misdadigers buiten de steden en plaatsen der gemene woningen gestraft werden, als onwaardig zijnde onder het gewoonlijke gezelschap der mensen hun geest te geven. Zie Lev 24:14, Lev 24:1423; Jos 7:24, en Mar 15:20."},{"catchword":"stenigt hem,","tekst":"Naar uitwijzen der wet, die daarvan gegeven was door Mozes, Lev 24:15-16, enz."}],"11":[{"catchword":"zijner stad,","tekst":"Zie boven, vs.8."},{"catchword":"die oudsten","tekst":"Zie boven, vs.8."},{"catchword":"gezonden had;","tekst":"Dat is, door brieven ontboden had."}],"12":[{"catchword":"in de hoogste","tekst":"Zie boven, vs.9."}],"13":[{"catchword":"zonen Belials,","tekst":"Zie boven, vs.10."},{"catchword":"gezegend","tekst":"Zie boven, vs.10."}],"15":[{"catchword":"erfelijk,","tekst":"Het schijnt hieruit dat de goederen van Naboth ten profijte des konings zijn geconfisceerd geweest, zijnde Naboths zonen mede gedood, 2Ki 9:26, en dat onder een vals deksel van religie, even alsof zij hierin hadden willen volgen het exempel der goddelijke straffen, in vorige tijden alzo uitgevoerd over Dathan en Abiram, Num 16:32, en Achan, Jos 7:24-25, dat ook hun kinderen niet gespaard werden. En alzo zouden deze rechters verkeerdelijk gevolgd hebben de exempelen der extraordinaire wraak Gods, die wel enigszins ons verborgen, maar nochtans rechtvaardig is, en niet de ordinaire wet voor de mensen gesteld, welke verbiedt de kinderen om hunner oud (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +

    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };

})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}

     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', vert: 'KJV',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
    const items = lijst.map((it, i) => {
      const nr = i + 1;
      const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
      if (kortCw) {
        const idx = brontekstHtml.indexOf(kortCw);
        if (idx !== -1) {
          brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
        }
      }
      const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
      return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
    }).join('');
    const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${brontekstBlok}${items}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
