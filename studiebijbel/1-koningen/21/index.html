":"Zo zegt de HEERE van dit volk: Zij hebben zo liefgehad om te zwerven, zij hebben hun voeten niet bedwongen; daarom heeft de HEERE geen welgevallen aan hen, nu zal Hij aan hun ongerechtigheden denken, en hun zonden bezoeken.","Spr 28:18":"Wie oprecht wandelt, zal behouden worden; maar wie zich verkeerd gedraagt op twee wegen, zal op een van de twee vallen.","Hab 2:10":"U hebt schande beraamd voor uw huis; door veel volken uit te roeien hebt u tegen uw eigen ziel gezondigd.","Gen 31:15":"Worden wij niet door hem als vreemden beschouwd? Want hij heeft ons verkocht, en hij heeft ook steeds ons geld verteerd.","1 Sam 24:14":"Zoals het spreekwoord van de ouden zegt: Van de goddelozen komt goddeloosheid voort; maar mijn hand zal niet tegen u zijn.","Matt 22:13":"Toen zei de koning tegen de dienaars: Bind zijn handen en voeten, neem hem mee en werp hem in de buitenste duisternis; daar zal het huilen zijn en het geknars van de tanden.","Micha 7:3":"Om met beide handen goed hun best te doen om kwaad te doen, zo eist de vorst, en de rechter oordeelt om vergelding; en de grote spreekt de verderving van zijn ziel uit, en zij draaien het samen dicht ineen.","Rom 2:5":"Maar naar uw hardheid en onbekeerlijk hart, verzamelt u voor uzelf toorn als een schat, voor de dag van de toorn en de openbaring van het rechtvaardig oordeel van God.","Matt 26:60":"En hoewel er veel valse getuigen gekomen waren, vonden zij toch niets. Maar tenslotte kwamen er twee valse getuigen,","Ezech 32:4":"Dan zal Ik u achterlaten op het land, Ik zal u wegwerpen op het open veld; en Ik zal al het gevogelte van de hemel op u laten wonen, en het gedierte van de hele aarde van u verzadigen.","Ezech 32:5":"En Ik zal uw vlees op de bergen leggen, en de dalen vullen met uw hoogheid.","Ps 75:11":"En ik zal alle hoorns van de goddelozen afhouwen; de hoorns van de rechtvaardige zullen verhoogd worden.","Jes 64:5-7":"U ontmoet de vrolijke, en die gerechtigheid doet, hun die aan U denken op Uw wegen; zie, U was verbolgen, omdat wij gezondigd hebben; daarin is de eeuwigheid, opdat wij behouden werden. Doch wij allen zijn als een onreine, en al onze gerechtigheden zijn als een wegwerpkleed; en wij allen vallen af als een blad, en onze misdaden voeren ons weg als een wind. En er is niemand, die Uw Naam aanroept, die zichzelf opwekt, dat hij U aangrijpt; want U verbergt Uw aangezicht voor ons, en U doet ons smelten, door middel van onze ongerechtigheden.","Matt 26:59-66":"En de overpriesters en de oudsten en de hele Grote Raad zochten valse getuigenis tegen Jezus, opdat zij Hem konden doden; en zij vonden niets. En hoewel er veel valse getuigen gekomen waren, vonden zij toch niets. Maar tenslotte kwamen er twee valse getuigen, en zeiden: Deze heeft gezegd: Ik kan de tempel van God afbreken en in drie dagen weer opbouwen.","Matt 13:12-15":"Want wie heeft, hem zal gegeven worden, en hij zal overvloedig hebben; maar wie niet heeft, van hem zal genomen worden ook wat hij heeft. Daarom spreek Ik tot hen door gelijkenissen, omdat zij ziende niet zien, en horende niet horen, en ook niet begrijpen. En in hen wordt de profetie van Jesaja vervuld, die zegt: Met het gehoor zult u horen, en geenszins begrijpen; en ziende zult u zien, en geenszins opmerken.","Ezech 8:11":"En zeventig mannen uit de oudsten van het huis van Israël, met Jaazanja, de zoon van Safan, die in hun midden stond, stonden voor hun aangezicht; en ieder had zijn rookvat in zijn hand, en een dikke wolk van het reukwerk steeg op.","Spr 15:9":"De weg van de goddelozen is de HEERE een gruwel; maar hem die de gerechtigheid najaagt, zal Hij liefhebben.","Jer 16:18":"Daarom zal Ik eerst hun ongerechtigheid en hun zonde dubbel vergelden, omdat zij Mijn land ontheiligd hebben; zij hebben Mijn erfenis met de dode lichamen van hun verfoeisels en hun gruwelen vervuld.","Matt 3:10":"En ook ligt de bijl al aan de wortel van de bomen; elke boom dan die geen goede vrucht voortbrengt, wordt omgehakt en in het vuur geworpen.","Matt 25:32":"En voor Hem zullen alle volken verzameld worden, en Hij zal ze van elkaar scheiden, zoals de herder de schapen van de bokken scheidt.","Neh 3:9":"En aan hun hand verbeterde Refaja, de zoon van Hur, leider van het halve deel van Jeruzalem.","Jes 30:1":"Wee de kinderen die afvallen, spreekt de HEERE, om een raadslag te maken, maar niet uit Mij, en om zich met een bedekking te bedekken, maar niet uit Mijn Geest, om zonde tot zonde te doen;","Micha 7:18":"Wie is een God gelijk U, Die de ongerechtigheid vergeeft, en de overtreding van het overblijfsel van Zijn erfenis voorbijgaat? Hij houdt Zijn toorn niet voor eeuwig vast; want Hij heeft lust aan goedertierenheid.","Jak 4:2-7":"U begeert, en hebt niet; u benijdt en jaagt naar dingen, en kunt ze niet krijgen; u vecht en voert strijd, maar u hebt niet, omdat u niet bidt. U bidt, en u ontvangt niet, omdat u verkeerd bidt, met de bedoeling het in uw lusten door te brengen. Overspelers en overspeleressen, weet u niet dat de vriendschap met de wereld vijandschap tegen God is? Wie dan ook een vriend van de wereld wil zijn, wordt daarmee een vijand van God.","Pred 2:19":"Want wie weet of hij wijs zal zijn of dwaas? Toch zal hij heersen over al mijn arbeid, die ik met inspanning verricht heb en waarin ik mij wijs heb betoond onder de zon. Dat is ook ijdelheid.","Deut 22:8":"Wanneer u een nieuw huis bouwt, zult u op uw dak een leuning maken; opdat u geen bloedschuld op uw huis legt, wanneer iemand ervan afvalt.","Jes 40:2":"Spreekt naar het hart van Jeruzalem, en roept haar toe, dat haar strijd vervuld is, dat haar ongerechtigheid verzoend is, dat zij van de hand van de HEERE dubbel ontvangen heeft voor al haar zonden.","2 Kron 15:2":"En hij ging Asa tegemoet, en hij zei tegen hem: Hoor mij, Asa, en heel Juda en Benjamin! De HEERE is met u, zolang u met Hem bent; en als u Hem zoekt, zal Hij door u gevonden worden; maar als u Hem verlaat, zal Hij u verlaten.","Lev 22:11":"Maar wanneer de priester een mens met zijn geld gekocht zal hebben, die zal daarvan eten; en wie in zijn huis geboren is, die zullen van zijn voedsel eten.","Luk 15:25-31":"En zijn oudste zoon was op het veld; en toen hij kwam en het huis naderde, hoorde hij het gezang en het gedans, en hij riep één van de knechten tot zich, en vroeg wat dat te betekenen had. En deze zei tegen hem: Uw broer is gekomen, en uw vader heeft het gemeste kalf geslacht, omdat hij hem gezond en wel heeft teruggekregen.","Ps 64:8":"Maar God zal hen haastig met een pijl schieten; hun plagen zijn er.","1 Kon 16:1-7":"Toen kwam het woord van de HEERE tot Jehu, de zoon van Hanani, tegen Baësa, en Hij zei: Omdat Ik u uit het stof heb verheven, en u tot een voorganger over Mijn volk Israël heb aangesteld, en u gewandeld hebt in de weg van Jerobeam, en Mijn volk Israël hebt doen zondigen, en Mij tot toorn hebt verwekt door hun zonden; Zie, zo zal Ik de nakomelingen van Baësa, en de nakomelingen van zijn huis wegdoen; en Ik zal uw huis maken zoals het huis van Jerobeam, de zoon van Nebat.","1 Kon 16:31":"En het gebeurde (was het een lichte zaak dat hij wandelde in de zonden van Jerobeam, de zoon van Nebat?), dat hij ook nog Izebel, de dochter van Eth-baal, de koning van de Sidoniërs, tot vrouw nam, en heenging, en Baäl diende, en zich voor hem neerboog.","1 Kon 15:26":"En hij deed wat kwaad was in de ogen van de HEERE, en wandelde in de weg van zijn vader, en in zijn zonde, waarmee hij Israël had doen zondigen.","Jes 13:9":"Zie, de dag van de HEERE komt, gruwelijk, met verbolgenheid en hevige toorn, om het land tot verwoesting te stellen, en de zondaars daaruit te verdelgen.","Jer 49:27":"En Ik zal een vuur aansteken in de muur van Damaskus, en het zal Benhadads paleizen verteren.","Jer 41:9":"Het kuil nu, waarin Ismaël alle dode lichamen van de mannen die hij aan de zijde van Gedalia gedood had, wierp, is hetzelfde dat koning Asa maakte vanwege Baësa, de koning van Israël; dit vulde Ismaël, de zoon van Nethanja, met de gedoden.","Joh 5:42":"maar Ik ken u, dat u de liefde van God niet in uzelf hebt.","2 Kon 10:1-7":"Achab had zeventig zonen te Samaria; en Jehu schreef brieven, die hij zond naar Samaria, tot de leiders van Jizreël, de oudsten, en tot de voedsterheren van Achab, en zei: Zo gauw deze brief tot u komt - omdat de zonen van uw heer bij u zijn, ook de wagens en de paarden bij u zijn, alsook een vaste stad, en wapens - zo kijkt naar de beste en meest geschikte van de zonen van uw heer, zet hem op de troon van zijn vader; en strijdt voor het huis van uw heer.","Joz 7:24":"Toen nam Jozua, en heel Israël met hem, Achan, de zoon van Zerah, en het zilver, en het sierlijke overkleed, en de gouden staaf, en zijn zonen, en zijn dochters, en zijn ossen, en zijn ezels, en zijn vee, en zijn tent, en alles wat hij had; en zij brachten ze naar het dal Achor.","Ef 2:1-3":"En u heeft Hij mede levend gemaakt, terwijl u dood was door de misdaden en de zonden; waarin u eertijds gewandeld hebt, naar de eeuw van deze wereld, naar de leider van de macht van de lucht, van de geest die nu werkt in de kinderen van de ongehoorzaamheid; onder wie ook wij allen eertijds verkeerd hebben, in de begeerten van ons vlees, terwijl wij deden de wil van het vlees en van de gedachten; en wij waren van nature kinderen van de toorn, net als ook de anderen;","Job 19:29":"Schroom voor het zwaard; want de grimmigheid is over de misdaden van het zwaard; opdat u weet, dat er een gericht is.","Num 34:18-29":"Verder zult u uit elke stam één leider nemen, om het land ter erfenis uit te delen. En dit zijn de namen van deze mannen: van de stam van Juda, Kaleb, zoon van Jefunne; En van de stam der kinderen van Simeon, Semuël, zoon van Ammihud;","Gen 21:9-11":"En Sara zag de zoon van Hagar, de Egyptische, die zij Abraham gebaard had, spotten. En zij zei tegen Abraham: Jaag deze slavin en haar zoon weg; want de zoon van deze slavin zal niet erven met mijn zoon, met Izak. En dit woord was zeer kwaad in Abrahams ogen, vanwege zijn zoon.","Openb 21:27":"En in haar zal niets binnenkomen dat verontreinigt, en gruwelijkheid doet, en leugen spreekt; maar alleen wie geschreven zijn in het boek van het leven van het Lam.","2 Kron 33:2":"En hij deed wat kwaad was in de ogen van de HEERE, naar de gruwelen van de heidenen, die de HEERE voor het aangezicht van de kinderen van Israël uit de bezitting verdreven had.","1 Kon 21:11-13":"En de mannen van zijn stad, die oudsten en die edelen, die in zijn stad woonden, deden zoals Izebel hun gezonden had; zoals geschreven was in de brieven die zij hun gezonden had. Zij riepen een vasten uit; en zij zetten Naboth vooraan onder het volk. Toen kwamen de twee mannen, zonen van Belial, en gingen tegenover hem zitten; en de mannen van Belial getuigden tegen hem, tegen Naboth, voor het volk, en zeiden: Naboth heeft God en de koning gevloekt. En zij voerden hem de stad uit, en stenigden hem met stenen, zodat hij stierf.","Openb 20:10":"En de duivel, die hen verleidde, werd geworpen in de poel van het vuur en sulfer, waar het beest en de valse profeet zijn; en zij zullen gepijnigd worden dag en nacht in alle eeuwigheid.","Gen 6:7":"En de HEERE zei: Ik zal de mens, die Ik geschapen heb, wegvagen van de aardbodem, van de mens tot het vee, tot het kruipend gedierte, en tot het gevogelte van de hemel toe; want het berouwt Mij dat Ik hen gemaakt heb.","1 Kon 16:30":"En Achab, de zoon van Omri, deed wat kwaad was in de ogen van de HEERE, meer dan allen die voor hem geweest waren.","Jes 28:18-22":"En uw verbond met de dood zal teniet gedaan worden, en uw voorzichtig verdrag met het rijk van de dood zal niet standhouden; wanneer de overstromende gesel doortrekt, dan zult u erdoor vertrapt worden. Vanaf de tijd dat hij doortrekt, zal hij u wegnemen, want elke morgen zal hij doortrekken, bij dag en bij nacht; en het zal gebeuren, dat louter het verstaan van het gerucht een verschrikking zal zijn. Want het bed zal korter zijn dan dat men zich erop kan uitstrekken; en het deksel zal te smal zijn, als men zich eronder wikkelt.","1 Kon 18:4":"Want het gebeurde, toen Izebel de profeten van de HEERE uitroeide, dat Obadja honderd profeten nam, en ze verborg bij vijftig man in een grot, en hen onderhield met brood en water.","Num 32:2":"Toen kwamen de kinderen van Gad en de kinderen van Ruben en spraken tot Mozes, tot Eleazar de priester, en tot de leiders van de vergadering, en zeiden:","Ps 50:17-20":"Omdat u de kastijding haat, en Mijn woorden achter u weggooit. Als u een dief ziet, dan loopt u met hem mee; en uw deel is met de overspelers. Uw mond zet u in voor het kwade, en uw tong koppelt bedrog.","1 Kon 19:1-3":"Achab vertelde Izebel alles wat Elia gedaan had, en ook dat hij alle profeten met het zwaard gedood had. Toen stuurde Izebel een bode naar Elia, om te zeggen: Zo mogen de goden mij doen, en nog erger, als ik uw leven niet morgen omstreeks deze tijd maak als het leven van één van hen. Toen hij dat zag, maakte hij zich op en ging heen om zijn leven te redden, en kwam in Berseba, dat in Juda ligt, en liet zijn knecht daar.","2 Kon 9:7-9":"En u zult het huis van Achab, uw heer, verslaan, opdat Ik het bloed van Mijn knechten, de profeten, en het bloed van alle knechten van de HEERE, wreekt op de hand van Izebel. En het hele huis van Achab zal omkomen; en Ik zal van Achab uitroeien wie mannelijk is, ook wie in Israël opgesloten is en wie verlaten is. Want Ik zal het huis van Achab maken als het huis van Jerobeam, de zoon van Nebat, en als het huis van Baësa, de zoon van Ahia.","Matt 13:49":"Zo zal het bij de voleinding van de wereld zijn; de engelen zullen uitgaan, en de bozen uit het midden van de rechtvaardigen afscheiden;","Jes 52:3":"Want zo zegt de HEERE: U bent voor niets verkocht, u zult ook zonder geld vrijgekocht worden.","Spr 13:2":"Ieder zal van de vrucht van de mond het goede eten; maar de ziel van de trouwelozen het geweld.","2 Kon 16:3":"Want hij wandelde in de weg van de koningen van Israël; ja, hij liet ook zijn zoon door het vuur gaan, naar de gruwelen van de heidenvolken, die de HEERE voor de kinderen van Israël verdreven had.","Jes 2:19":"Dan zullen zij in de spelonken van de rotsstenen gaan, en in de holen van de aarde, vanwege de schrik van de HEERE, en vanwege de heerlijkheid van Zijn majesteit, wanneer Hij Zich zal opmaken, om de aarde te verschrikken.","1 Kor 10:5-11":"Maar in het meerdere deel van hen heeft God geen welgevallen gehad; want zij zijn in de woestijn neergeslagen. En deze dingen zijn ons tot voorbeelden gebeurd, opdat wij geen lust tot het kwade zouden hebben, zoals zij ook lust gehad hebben. En word geen afgodendienaars, zoals sommigen van hen, zoals geschreven staat: Het volk zat neer om te eten en te drinken, en zij stonden op om te spelen.","2 Kron 21:6":"En hij ging de weg van de koningen van Israël, zoals het huis van Achab deed; want hij had de dochter van Achab tot vrouw; en hij deed wat slecht was in de ogen van de HEERE.","Ps 9:18":"De goddelozen zullen terugkeren, naar de hel toe, alle heidenen die God vergeten zijn.","2 Kon 22:9":"Daarna kwam Safan, de schrijver, bij de koning, en bracht de koning verslag terug, en hij zei: Uw dienaren hebben het geld dat in het huis gevonden was bij elkaar gebracht, en hebben het gegeven in de hand van de opzichters van het werk, die aangesteld waren over het huis van de HEERE.","Deut 22:24":"Dan zult u hen beiden naar de poort van die stad brengen, en u zult hen met stenen stenigen, zodat zij sterven; de jonge dochter, omdat zij niet geroepen heeft, terwijl zij in de stad was, en de man, omdat hij de vrouw van zijn naaste vernederd heeft; zo zult u het kwaad uit uw midden wegdoen.","Jes 9:12":"Want dit volk keert zich niet tot Hem, Die het slaat, en de HEERE van de heerscharen zoeken zij niet.","Pred 2:18":"Ik haatte ook al mijn arbeid die ik onder de zon verricht had, omdat ik die zou moeten achterlaten aan een mens die na mij komen zal.","Ps 53:2-6":"De dwaas zegt in zijn hart: Er is geen God; zij verderven het, en zij bedrijven gruwelijk onrecht; er is niemand die goed doet. God heeft uit de hemel neergezien op de mensenkinderen, om te zien of iemand verstandig was, die God zocht. Een ieder van hen is teruggekeerd, samen zijn zij stinkend geworden, er is niemand die goed doet, ook niet één.","Mark 12:40":"die de huizen van weduwen opeten, en dat onder de schijn van lang te bidden. Dezen zullen een zwaarder oordeel ontvangen.","Gen 17:13":"Degene die in uw huis geboren is, en degene die met uw geld gekocht is, zal zeker besneden worden; en Mijn verbond zal in uw vlees zijn, tot een eeuwig verbond.","Joh 3:18":"Wie in Hem gelooft, wordt niet veroordeeld, maar wie niet gelooft, is al veroordeeld, omdat hij niet geloofd heeft in de Naam van de eniggeboren Zoon van God.","1 Kron 15:13":"Want omdat u dit de eerste keer niet deed, heeft de HEERE, onze God, onder ons een scheur gemaakt, omdat wij Hem niet gezocht hebben naar het recht.","Joh 8:34":"Jezus antwoordde hun: Voorwaar, voorwaar, Ik zeg u: Ieder die de zonde doet, is een dienstknecht van de zonde.","Ezech 22:14":"Zal uw hart standhouden? Zullen uw handen sterk zijn, in de dagen dat Ik met u zal handelen? Ik, de HEERE, heb het gesproken, en zal het doen.","2 Kron 28:2-4":"Maar hij wandelde in de wegen van de koningen van Israël; daartoe maakte hij ook gegoten beelden voor de Baäls. Hij brandde ook reukwerk in het dal van de zoon van Hinnom, en hij verbrandde zijn zonen in het vuur, naar de gruwelen van de heidenen die de HEERE voor het aangezicht van de kinderen van Israël uit hun bezit verdreven had. Ook offerde hij en brandde reukwerk op de hoogten en op de heuvels, alsook onder elke groene boom.","Amos 9:10":"Alle zondaars van Mijn volk zullen door het zwaard sterven; zij die zeggen: Het kwaad zal ons niet naderen, en ons niet treffen.","Matt 26:15":"en zei: Wat wilt u mij geven, en ik zal Hem aan u overleveren? En zij hebben hem dertig zilveren munten toegezegd.","Jer 13:22":"Wanneer u dan in uw hart zult zeggen: Waarom zijn mij deze dingen overkomen? Om de veelheid van uw ongerechtigheid zijn uw zomen ontbloot, en uw hielen hebben geweld geleden.","Rom 7:13":"Is dan het goede voor mij de dood geworden? Volstrekt niet. Maar de zonde is mij de dood geworden; opdat zij openbaar zou worden als zonde, doordat zij door het goede de dood in mij bewerkte; opdat de zonde bovenmate zou blijken te zondigen door het gebod.","Jona 3:9":"Wie weet, God mocht Zich wenden, en berouw hebben; en Hij mocht Zich wenden van de gloed van Zijn toorn, zodat wij niet vergaan!","Num 14:33":"En uw kinderen zullen als herders rondtrekken in deze woestijn, veertig jaar, en zullen uw hoererijen dragen, totdat uw dode lichamen verteerd zijn in deze woestijn.","Spr 14:32":"De goddeloze zal weggedreven worden in zijn kwaad; maar de rechtvaardige vertrouwt zelfs in zijn dood.","Joz 20:4":"Als hij vlucht naar één van die steden, dan zal hij staan aan de deur van de stadspoort, en hij zal zijn woorden spreken voor de oren van de oudsten van die stad; dan zullen zij hem bij zich in de stad opnemen, en hem een plaats geven, zodat hij bij hen kan wonen.","Luk 13:24":"Strijd om binnen te gaan door de nauwe poort; want velen, zeg Ik u, zullen zoeken binnen te gaan en zullen dat niet kunnen;","Joz 19:18":"En hun grens was Jizreëla, en Chesulloth, en Sunem,","Matt 21:41":"Zij zeiden tegen hem: Hij zal die kwaden een kwade dood laten sterven, en de wijngaard verhuren aan andere landbouwers, die hem de vruchten op de juiste tijd zullen geven.","Luk 17:1":"En Hij zei tegen de discipelen: Het kan niet anders, dan dat er ergernissen komen; maar wee hem, door wie ze komen.","Richt 1:7":"Toen zei Adoni-bezek: Zeventig koningen, van wie de duimen van hun handen en voeten waren afgehouwen, verzamelden de kruimen onder mijn tafel; zoals ik gedaan heb, zo heeft God mij vergolden! En zij brachten hem naar Jeruzalem, en hij stierf daar.","Jak 1:14":"Maar ieder wordt verzocht, als hij door zijn eigen begeerte afgetrokken en verlokt wordt.","Ps 50:22":"Verstaat dit toch, u die God vergeet! opdat Ik niet verscheur en niemand redt.","1 Tess 5:3":"Want wanneer zij zullen zeggen: Het is vrede en veilig; dan zal een plotseling verderf hun overkomen, zoals de barensweeën een zwangere vrouw overkomen; en zij zullen het geenszins ontvluchten;","Num 1:44":"Dezen zijn de getelden, die Mozes geteld heeft, en Aäron, en de leiders van Israël; twaalf mannen waren het, elk over het huis van zijn vaderen.","Mark 10:19":"U kent de geboden: U zult geen overspel plegen; u zult niet doden; u zult niet stelen; u zult geen vals getuigenis geven; u zult niemand tekortdoen; eer uw vader en uw moeder.","Gen 4:7":"Is het niet zo: als u goed doet, wordt u aanvaard? En als u niet goed doet, ligt de zonde aan de deur. Naar u gaat zijn begeerte uit, en u zult over hem heersen.","Ex 1:21":"En het gebeurde, omdat de vroedvrouwen God vreesden, dat Hij hun huizen gaf.","Job 27:8-23":"Want wat is de verwachting van de huichelaar, als hij gierig geweest zal zijn, wanneer God zijn ziel zal uittrekken? Zal God zijn geroep horen, als benauwdheid over hem komt? Zal hij zich verlustigen in de Almachtige? Zal hij God aanroepen te aller tijd?","Ps 97:3":"Een vuur gaat voor Zijn aangezicht heen, en het steekt Zijn tegenstanders rondom in brand.","Num 7:3":"En zij brachten hun offergave voor het aangezicht van de HEERE: zes overdekte wagens en twaalf runderen; een wagen voor twee leiders, en een os voor ieder een; en zij brachten ze voor de tabernakel.","Ps 9:13":"Want Hij zoekt de bloedstortingen, Hij gedenkt daarvan; Hij vergeet het geroep van de ellendigen niet.","Spr 13:19":"De begeerte die vervuld wordt, is zoet voor de ziel; maar het is de dwazen een gruwel om van het kwade af te wijken.","Hos 1:5":"En het zal op die dag gebeuren, dat Ik de boog van Israël zal breken, in het dal van Jizreël.","Ex 20:17":"U zult niet begeren het huis van uw naaste; u zult niet begeren de vrouw van uw naaste, of zijn dienstknecht, of zijn dienstmaagd, of zijn os, of zijn ezel, of iets dat van uw naaste is.","Gal 6:8":"Want die in zijn eigen vlees zaait, zal uit het vlees verderf maaien; maar die in de Geest zaait, zal uit de Geest het eeuwige leven maaien.","Ps 18:28":"Want U verlost het bedrukte volk, maar de hoge ogen vernedert U.","Spr 22:23":"Want de HEERE zal hun rechtszaak voeren, en Hij zal aan hen die hen beroven, de ziel roven.","Spr 13:6":"De gerechtigheid bewaart de oprechte op de weg; maar de goddeloosheid zal de zondaar omkeren.","Micha 5:1":"En u, Bethlehem Efratha, bent u klein om te zijn onder de duizenden van Juda? Uit u zal Mij Iemand voortkomen, Die een Heerser zal zijn in Israël, en Wiens uitgangen zijn van oudsher, van de dagen van de eeuwigheid.","2 Kon 8:16-18":"In het vijfde jaar van Joram, de zoon van Achab, de koning van Israël, toen Josafat koning was van Juda, begon Jehoram, de zoon van Josafat, de koning van Juda, te regeren. Hij was tweeëndertig jaar oud toen hij koning werd, en hij regeerde acht jaar in Jeruzalem. En hij ging de weg van de koningen van Israël, zoals het huis van Achab deed; want de dochter van Achab was zijn vrouw geworden; en hij deed wat slecht was in de ogen van de HEERE.","Ps 68:2":"God zal opstaan, Zijn vijanden zullen verstrooid worden, en Zij die Hem haten zullen van Zijn aangezicht vluchten.","Lev 26:39-42":"En de overgeblevenen onder u zullen om hun ongerechtigheid in de landen van uw vijanden wegteren; ja, ook om de ongerechtigheden van hun vaderen zullen zij met hen wegteren. Dan zullen zij hun ongerechtigheid belijden, en de ongerechtigheid van hun vaderen met hun overtredingen, waarmee zij tegen Mij overtreden hebben, en ook dat zij tegen Mij in gewandeld hebben. Dat Ik ook tegen hen in gewandeld heb, en hen in het land van hun vijanden gebracht heb. Als dan hun onbesneden hart gebogen wordt, en zij dan de straf voor hun ongerechtigheid aanvaarden;","Hebr 10:27-31":"maar een schrikwekkend uitzicht op het oordeel, en een felle hitte van het vuur, die de tegenstanders zal verslinden. Als iemand de wet van Mozes heeft verworpen, sterft hij zonder ontferming, op het woord van twee of drie getuigen; hoeveel zwaarder straf, denkt u, zal hij waard geacht worden, die de Zoon van God met voeten heeft getreden, en het bloed van het testament, waardoor hij geheiligd was, als onrein heeft beschouwd, en de Geest van de genade smaad heeft aangedaan?","1 Kor 9:27":"Maar ik bedwing mijn lichaam, en breng het tot dienstbaarheid, opdat ik niet, nadat ik anderen gepredikt heb, zelf verwerpelijk word.","1 Sam 22:17":"En de koning zei tegen de lijfwachten die bij hem stonden: Wend u om, en dood de priesters van de HEERE, omdat hun hand ook met David is, en omdat zij geweten hebben dat hij vluchtte, en het mij niet hebben laten horen. Doch de knechten van de koning wilden hun hand niet uitsteken om de priesters van de HEERE aan te vallen.","2 Sam 11:14-24":"'s Morgens nu gebeurde het, dat David een brief schreef aan Joab; en hij stuurde die door de hand van Uria. En hij schreef in die brief: Stel Uria vooraan tegenover de sterkste strijd, en trek u van achter hem terug, opdat hij geslagen wordt en sterft. Zo gebeurde het, toen Joab op de stad had gelet, dat hij Uria stelde op de plaats waarvan hij wist dat daar strijdbare mannen waren.","Matt 15:13":"Maar Hij antwoordde en zei: Elke plant die Mijn hemelse Vader niet geplant heeft, zal uitgeroeid worden.","Matt 5:19-30":"Wie dan een van deze minste geboden afschaft, en de mensen zo leert, die zal de minste genoemd worden in het Koninkrijk der hemelen; maar wie ze doet en leert, die zal groot genoemd worden in het Koninkrijk der hemelen. Want Ik zeg u: als uw gerechtigheid niet overvloediger is dan die van de Schriftgeleerden en de Farizeeën, zult u het Koninkrijk der hemelen beslist niet binnengaan. U hebt gehoord dat tot de ouden gezegd is: U zult niet doden; en wie doodt, die zal strafbaar zijn voor het gericht.","Matt 7:27":"En de slagregen is neergevallen, en de waterstromen zijn gekomen, en de winden hebben gewaaid en zijn tegen dat huis aangeslagen, en het is gevallen, en zijn val was groot.","Ps 37:28":"Want de HEERE heeft het recht lief, en zal Zijn gunstgenoten niet verlaten; in eeuwigheid worden zij bewaard; maar het nageslacht van de goddelozen wordt uitgeroeid.","Joh 3:16":"Want zo lief heeft God de wereld gehad, dat Hij Zijn eniggeboren Zoon gegeven heeft, opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft.","Deut 7:9":"U zult dan weten dat de HEERE, uw God, dié God is, de getrouwe God, Die het verbond en de goedertierenheid houdt met wie Hem liefhebben en Zijn geboden houden, tot in duizend geslachten.","Matt 8:12":"maar de kinderen van het koninkrijk zullen uitgeworpen worden in de buitenste duisternis; daar zal gehuil zijn, en het geknars van de tanden.","Hebr 9:16":"Want waar een testament is, daar is het nodig dat de dood van hem die het testament maakte, tussenbeide komt;","Ex 32:33-35":"Toen zei de HEERE tegen Mozes: Wie tegen Mij zondigt, die zal Ik uit Mijn boek delgen. Ga nu heen, leid dit volk naar waar Ik u gezegd heb; zie, Mijn Engel zal voor u uit gaan! Maar op de dag van het bezoeken zal Ik hun zonde over hen bezoeken! Zo trof de HEERE dit volk met een plaag, omdat zij dat kalf gemaakt hadden, dat Aäron gemaakt had.","Num 7:11":"En de HEERE zei tegen Mozes: Elke leider zal, ieder op zijn dag, zijn offergave brengen ter inwijding van het altaar.","Ezech 46:18":"En de vorst zal niets nemen van de erfenis van het volk, door hen van hun bezitting te beroven; van zijn eigen bezitting zal hij zijn zonen erfenis nalaten; opdat niet Mijn volk, ieder uit zijn bezitting, verstrooid wordt.","Amos 3:2":"Uit alle geslachten van de aardbodem heb Ik u alleen gekend; daarom zal Ik al uw ongerechtigheden over u bezoeken.","Gal 5:20":"Afgoderij, toverij, vijandschappen, ruzies, jaloersheden, toorn, twisten, verdeeldheid, afwijkingen in de leer,","Jer 19:4":"Omdat zij Mij verlaten, en deze plaats vervreemd hebben, en andere goden daarin gerookt hebben die zij niet gekend hebben, zij, noch hun vaders, noch de koningen van Juda; en hebben deze plaats vervuld met bloed van onschuldigen.","Jes 1:4-6":"Wee het zondige volk, het volk van zware ongerechtigheid, het nageslacht van de boosdoeners, de verdervende kinderen! Zij hebben de HEERE verlaten, zij hebben de Heilige van Israël gelasterd, zij hebben zich vervreemd, wijkende achterwaarts. Waartoe zou u nog meer geslagen worden? U zou van het afval des te meer maken; het hele hoofd is ziek, en het hele hart is mat. Van de voetzool af tot het hoofd toe is er niets van het geheel gaaf aan hem; maar wonden, en striemen, en etterbuilen, die niet uitgedrukt noch verbonden zijn, en geen daarvan is met olie verzacht.","Deut 32:33":"Hun wijn is vurig drakenvenijn, en een wreed adderenvergif.","Joz 22:29":"Het zij verre van ons, dat wij opstandig zouden zijn tegen de HEERE, of dat wij ons vandaag van achter de HEERE zouden afkeren, door een altaar te bouwen voor brandoffer, spijsoffer, of slachtoffer, buiten het altaar van de HEERE, onze God, dat vóór Zijn tabernakel is.","Ex 1:17":"Maar de vroedvrouwen vreesden God, en deden niet wat de koning van Egypte tegen hen gezegd had, maar zij hielden de jongetjes in leven.","Matt 18:34":"En zijn heer werd toornig en leverde hem over aan de pijnigers, totdat hij alles zou betaald hebben wat hij hem schuldig was.","Num 27:6-11":"En de HEERE zei tegen Mozes: De dochters van Zelafead spreken terecht; u zult hun zeker een bezitting geven als erfenis, onder de broers van hun vader; en u zult de erfenis van hun vader op hen laten overgaan. En tegen de kinderen van Israël zult u zeggen: Wanneer iemand sterft, en geen zoon heeft, dan zult u zijn erfenis op zijn dochter laten overgaan.","Deut 16:19":"U zult het recht niet buigen; u zult niet partijdig zijn; ook zult u geen geschenk aannemen; want het geschenk verblindt de ogen van de wijzen, en verdraait de woorden van de rechtvaardigen.","2 Sam 11:14":"'s Morgens nu gebeurde het, dat David een brief schreef aan Joab; en hij stuurde die door de hand van Uria.","Hand 6:13":"en zetten valse getuigen in, die zeiden: Deze man houdt niet op lasterlijke woorden te spreken tegen deze heilige plaats en de wet.","Luk 22:5":"En zij waren blij, en zijn het eens geworden dat zij hem geld zouden geven.","Job 15:16":"Hoeveel te meer is een man gruwelijk en stinkend, die het onrecht indrinkt als water?","Jes 5:11-14":"Wee hun die zich vroeg in de morgen opmaken om sterke drank na te jagen, en die doorgaan tot in de schemering, totdat de wijn hen verhit heeft! En harp en luit, tamboerijn en fluit, en wijn zijn bij hun feesten; maar zij letten niet op het werk van de HEERE, en zij zien niet op het maaksel van Zijn handen. Daarom zal mijn volk gevankelijk weggevoerd worden, omdat het geen kennis heeft; en zijn heerlijke mannen zullen honger lijden, en zijn menigte zal verdorren van dorst.","Gen 18:20":"Verder zei de HEERE: Omdat het geroep van Sodom en Gomorra groot is, en omdat hun zonde zeer zwaar is,","Job 8:20":"Zie, God zal de oprechte niet verwerpen; Hij zal ook de boosdoeners niet bij de hand vatten;","Micha 3:11":"Haar hoofden rechtspreken om geschenken, en haar priesters leren om loon, en haar profeten waarzeggen om geld; nog steunen zij op de HEERE, en zeggen: Is de HEERE niet in ons midden? Ons zal geen kwaad overkomen.","Hos 4:1-3":"Hoor het woord van de Heere, kinderen van Israël! Want de Heere heeft een geschil met de inwoners van het land, omdat er geen trouw, en geen goedertierenheid, en geen kennis van God in het land is; Maar vloeken en liegen, en doodslaan, en stelen, en overspel plegen; zij breken door, en bloedschuld raakt aan bloedschuld. Daarom zal het land treuren, en ieder die daarin woont, kwijnen weg, met de dieren van het veld, en met de vogels van de hemel; ja, ook de vissen van de zee zullen weggeraapt worden.","Ef 4:19":"Zij hebben, ongevoelig geworden, zichzelf overgegeven aan losbandigheid, om alle onreinheid gierig te bedrijven.","Jer 8:12-14":"Zijn zij beschaamd, omdat zij gruwel bedreven hebben? Nee, zij schamen zich in het geheel niet, en weten niet hoe ze schaamrood moeten worden; daarom zullen zij vallen onder de vallende; ten tijde van hun bezoeking zullen zij struikelen, zegt de HEERE. Ik zal hen voorzeker wegrapen, spreekt de HEERE; er zijn geen druiven aan de wijnstok, en geen vijgen aan de vijgenboom, ja, het blad is afgevallen; en de geboden die Ik hun gegeven heb, die overtreden zij. Waarom blijven wij zitten? Verzamel u, en laat ons ingaan in de versterkte steden, en daar stilzwijgen; zeker heeft de HEERE, onze God, ons doen stilzwijgen, en ons met gallewater gedrenkt, omdat wij tegen de HEERE gezondigd hebben.","2 Kon 23:35":"En Jojakim gaf dat zilver en dat goud aan Farao; doch hij belastte het land, om dat geld naar het bevel van Farao te geven; ieder naar zijn aanslag eiste hij het zilver en goud af van het volk van het land, om aan Farao Necho te geven.","1 Kor 6:9":"Of weet u niet, dat de onrechtvaardigen het Koninkrijk van God niet zullen beërven?","Joh 15:2":"Elke rank die in Mij geen vrucht draagt, die neemt Hij weg; en elke rank die vrucht draagt, die reinigt Hij, zodat zij meer vrucht draagt.","Matt 18:7-9":"Wee de wereld vanwege de struikelblokken, want het is onvermijdelijk dat de struikelblokken komen; maar wee die mens door wie het struikelblok komt! Als dan uw hand of uw voet u doet struikelen, hak ze af en werp ze van u weg. Het is beter voor u om kreupel of verminkt het leven in te gaan, dan met twee handen of twee voeten in het eeuwige vuur geworpen te worden. En als uw oog u doet struikelen, trek het uit en werp het van u weg. Het is beter voor u om met één oog het leven in te gaan, dan met twee ogen in het helse vuur geworpen te worden.","2 Kron 34:9":"En zij kwamen bij Hilkia, de hogepriester, en zij gaven hem het geld dat naar het huis van God gebracht was, dat de Levieten die de drempel bewaakten, verzameld hadden uit de hand van Manasse en Efraïm, en uit heel het overblijfsel van Israël, en uit heel Juda en Benjamin, en waarmee zij naar Jeruzalem waren teruggekomen.","Gal 3:10":"Want zovelen als er uit de werken van de wet zijn, die zijn onder de vloek; want er is geschreven: Vervloekt is ieder die niet blijft in alles wat geschreven is in het boek van de wet, om dat te doen.","1 Kon 15:34":"En hij deed wat kwaad was in de ogen van de HEERE, en wandelde in de weg van Jerobeam, en in zijn zonde, waarmee hij Israël had doen zondigen.","Jer 15:3":"Want Ik zal een bezoeking over hen brengen met vier soorten straf, spreekt de HEERE: met het zwaard, om te doden; en met de honden, om te verscheuren; en met het gevogelte van de hemel, en met het gedierte van de aarde, om op te eten en te vernietigen.","2 Kron 18:7":"Toen zei de koning van Israël tegen Josafat: Er is nog een man om de HEERE door hem te raadplegen; maar ik haat hem, want hij profeteert nooit iets goeds over mij, maar altijd kwaad; dat is Micha, de zoon van Jimla. En Josafat zei: Laat de koning zo niet spreken.","Jes 22:12":"En op die dag zal de Heere, de HEERE van de heerscharen, roepen tot geween, en tot rouwklacht, en tot kaalheid, en tot omgording met de zak.","Openb 2:22":"Zie, Ik werp haar op een bed, en hen die met haar overspel bedrijven in grote verdrukking, als zij zich niet bekeren van hun werken.","Ex 20:5":"U zult zich daarvoor niet buigen, en ze niet dienen; want Ik, de HEERE, uw God, ben een ijverig God, Die de misdaad van de vaders bezoek aan de kinderen, aan het derde en aan het vierde geslacht van hen die Mij haten;","Openb 22:19":"En als iemand iets afdoet van de woorden van het boek van deze profetie, zal God zijn deel afdoen uit het boek des levens, en uit de heilige stad, en uit wat in dit boek geschreven is.","Deut 17:5":"Dan moet u die man of die vrouw, die dit boze stuk gedaan hebben, naar uw poorten brengen, die man of die vrouw, zeg ik, en u moet hen met stenen stenigen, totdat zij sterven.","2 Tim 2:14":"Breng deze dingen in gedachtenis, en houd hun voor, voor de Heere, dat zij geen woordenstrijd voeren, wat tot niets nut is, dan tot verderf van de toehoorders.","Gen 6:12":"Toen zag God de aarde, en zie, zij was verdorven; want alle vlees had zijn weg verdorven op de aarde.","Pred 7:9":"Wees niet haastig in uw geest om te toornen; want de toorn rust in de boezem van de dwazen.","Hos 1:4":"En de Heere zei tegen hem: Noem zijn naam Jizreël, want nog een korte tijd, en Ik zal de bloedschuld van Jizreël bezoeken over het huis van Jehu, en Ik zal het koninkrijk van het huis van Israël doen ophouden.","Matt 13:24":"Een andere gelijkenis heeft Hij hun voorgehouden en zei: Het Koninkrijk der hemelen is gelijk aan een mens die goed zaad zaaide in zijn akker.","1 Sam 24:7":"En hij zei tegen zijn mannen: Laat het ver van mij zijn bij de HEERE, dat ik deze zaak zou doen aan mijn heer, de gezalfde van de HEERE, dat ik mijn hand tegen hem uit zou steken; want hij is de gezalfde van de HEERE!","Nahum 1:8-10":"En met een doorgaande vloed zal Hij haar plaats volledig vernietigen; en duisternis zal Zijn vijanden vervolgen. Wat bedenkt u tegen de HEERE? Hij zal zelf een einde maken; de benauwdheid zal niet tweemaal opkomen. Omdat zij als doornen ineengevlochten zijn, en dronken zijn zoals zij plegen dronken te zijn, zo worden zij helemaal verteerd, als een dorre stoppel.","1 Kon 20:43":"En de koning van Israël ging heen, verdrietig en toornig, naar zijn huis, en kwam te Samaria.","Gen 37:28":"Toen nu de Midianitische kooplieden voorbijtrokken, trokken en hesen zij Jozef op uit de kuil, en verkochten Jozef aan deze Ismaëlieten voor twintig zilverstukken; die brachten Jozef naar Egypte.","Joz 17:4":"Dezen dan traden toe voor Eleazar, de priester, en voor Jozua, de zoon van Nun, en voor de leiders, en zeiden: De HEERE heeft Mozes geboden dat men ons een erfdeel geven zou te midden van onze broeders. Daarom gaf hij haar, naar het woord van de HEERE, een erfdeel te midden van de broeders van hun vader.","Jes 26:10":"Wordt de goddeloze genade bewezen, dan leert hij toch geen gerechtigheid; hij doet onrecht in een geheel rechtvaardig land, en hij ziet de hoogheid van de HEERE niet aan.","Jes 26:11":"HEERE, is Uw hand verhoogd, zij zien het niet; maar zij zullen het zien, en beschaamd worden, vanwege de ijver over Uw volk, ook zal het vuur Uw tegenstanders verteren.","Ps 52:3-6":"Wat beroemt u zich in het kwaad, o u geweldige? Gods goedertierenheid duurt toch de hele dag. Uw tong denkt enkel schade uit, als een geslepen scheermes, en werkt bedrog. U hebt het kwade liever dan het goede, de leugen liever dan gerechtigheid te spreken. Sela.","Jes 11:4":"Maar Hij zal de armen met gerechtigheid oordelen, en de zachtmoedigen van het land met rechtmatigheid bestraffen; doch Hij zal de aarde slaan met de roede van Zijn mond, en met de adem van Zijn lippen zal Hij de goddeloze doden.","Openb 21:8":"Maar de bangen, en ongelovigen, en verfoeilijken, en moordenaars, en hoereerders, en tovenaars, en afgodendienaars, en alle leugenaars, hun deel is in de poel die daar brandt van vuur en zwavel; dat is de tweede dood.","2 Kon 9:30-37":"En Jehu kwam te Jizreël. Toen Izebel dat hoorde, blankette zij haar gezicht, en versierde haar hoofd, en keek uit het venster. Toen Jehu nu door de poort naar binnen kwam, zei zij: Is het goed, o Zimri, doodslager van zijn heer? En hij hief zijn gezicht op naar het venster, en zei: Wie is met mij? Wie? Toen keken er twee, drie kamerlingen naar hem.","2 Kron 16:1-6":"In het zesendertigste jaar van het koninkrijk van Asa trok Baësa, de koning van Israël, op tegen Juda, en bouwde Rama, opdat hij niemand toeliet uit te gaan en in te komen tot Asa, de koning van Juda. Toen bracht Asa het zilver en het goud voort, uit de schatten van het huis van de HEERE en van het huis van de koning, en zond het tot Benhadad, de koning van Syrië, die in Damaskus woonde, en zei: Er is een verbond tussen mij en u, en tussen mijn vader en uw vader; zie, ik zend u zilver en goud; ga heen, verbreek uw verbond met Baësa, de koning van Israël, zodat hij van tegen mij aftrekt.","Ps 28:4":"Geef hun naar hun doen, en naar de boosheid van hun handelingen; geef hun naar het werk van hun handen; laat de vergelding voor hen tot hen terugkeren.","Fil 3:19":"Van wie het einde het verderf is, van wie God de buik is, en van wie de heerlijkheid in hun schande is, die aardse dingen bedenken.","Ps 73:27":"Want zie, wie ver van U zijn, zullen vergaan; U roeit uit al wie van U afhoereert;","Ps 147:6":"De HEERE houdt de zachtmoedigen staande; de goddelozen vernedert Hij, tot op de aarde toe.","Spr 26:10":"De groten doen ieder verdriet aan, en huren de dwazen, en huren de overtreders.","Richt 6:33":"Alle Midianieten nu, en Amalekieten, en de mensen uit het oosten, waren bijeengebracht, en zij trokken over, en legerden zich in het dal van Jizreël.","Rom 7:7":"Wat zullen wij dan zeggen? Is de wet zonde? Volstrekt niet. Ja, ik kende de zonde niet dan door de wet; want ik had ook de begeerte niet gekend als zonde, als de wet niet zei: U zult niet begeren.","Hos 13:1":"Toen Efraïm sprak, beefde men; hij heeft zich verheven in Israël; maar hij is schuldig geworden aan de Baäl en is gestorven.","Ezech 9:5-7":"Maar tot die anderen zei Hij voor mijn oren: Ga door de stad achter hem, en sla, uw oog verschoont niet, en spaar niet! Dood oude mensen, jonge mannen en meisjes, en kinderen en vrouwen, tot het verderven toe; maar kom niemand nabij op wie het teken is, en begin bij Mijn heiligdom. En zij begonnen bij de oude mannen, die vóór het huis waren. En Hij zei tot hen: Verontreinig het huis, en vervul de voorhoven met gedoden; ga naar buiten. En zij gingen naar buiten, en zij sloegen in de stad.","Pred 4:1":"Daarna richtte ik mijn aandacht en zag alle onderdrukkingen die onder de zon gebeuren; en zie, er waren de tranen van de verdrukten, en van hen die geen trooster hadden; en aan de kant van hun verdrukkers was macht, zij daarentegen hadden geen trooster.","Deut 11:10":"Want het land, waar u naartoe gaat, om dat te erven, is niet als Egypteland, van waar u uitgegaan bent, waar u uw zaad zaaide, en bewaterde met uw voet, als een kruidhof.","Rom 11:22":"Zie dan de goedertierenheid en de strengheid van God; de strengheid wel over hen die gevallen zijn, maar de goedertierenheid over u, als u in de goedertierenheid blijft; anders zult ook u afgehouwen worden.","Ps 3:8":"Sta op, HEERE, verlos mij, mijn God; want U hebt al mijn vijanden op het kinnebakken geslagen; de tanden van de goddelozen hebt U verbrijzeld.","Spr 17:2":"Een verstandige knecht zal heersen over een zoon die beschaamd maakt, en in het midden van de broeders zal hij erfenis delen.","2 Petr 2:10":"maar vooral hen, die naar het vlees wandelen in onreine begeerte, en het gezag verachten; die vermetel zijn, zichzelf behagen, en die er niet voor terugschrikken de heerlijkheden te lasteren;","Ps 39:12":"Kastijdt U iemand met straffen om de ongerechtigheid, dan doet U zijn schoonheid wegteren als door een mot; zeker, ieder mens is ijdelheid. Sela.","2 Tim 2:18":"die van de waarheid zijn afgeweken, en zeggen dat de opstanding al gebeurd is, en het geloof van sommigen omverwerpen.","Matt 2:12":"En omdat zij door God in een droom gewaarschuwd waren dat zij niet naar Herodes zouden terugkeren, vertrokken zij via een andere weg naar hun land.","2 Petr 3:9":"De Heere stelt Zijn belofte niet uit (zoals sommigen dat als uitstel zien), maar Hij is geduldig voor ons, omdat Hij niet wil dat er iemand verloren gaat, maar dat allen tot bekering komen.","Num 31:14":"En Mozes werd zeer boos op de aanvoerders van het leger, de hoofdlieden over de duizenden, en de hoofdlieden over de honderden, die uit de strijd van die oorlog kwamen.","2 Kon 9:27":"Toen Ahazia, de koning van Juda, dat zag, vluchtte hij via de weg naar het huis van de hoftuin; maar Jehu vervolgde hem, en zei: Sla hem ook neer op de wagen, bij de opgang naar Gur, die bij Jibleam is; en hij vluchtte naar Megiddo, en stierf daar.","Deut 16:18":"Rechters en opzichters zult u voor uzelf aanstellen in al uw poorten die de HEERE, uw God, u geven zal, onder uw stammen; opdat zij het volk richten met een rechtvaardig oordeel.","Job 2:9":"Toen zei zijn vrouw tegen hem: Houdt u nog steeds vast aan uw oprechtheid? Vervloek God en sterf.","Spr 1:10-16":"Mijn zoon! als de zondaars u aanlokken, stem er niet mee in; Als zij zeggen: Ga met ons, laat ons loeren op bloed, ons verstoppen tegen de onschuldige, zonder oorzaak; Laat ons hen levend verslinden, als het graf; ja, geheel en al, zoals zij die in de kuil neerdalen;","1 Kon 15:30":"Om de zonden van Jerobeam, die hij gezondigd had, en die hij Israël had doen zondigen, en om zijn terging, waarmee hij de HEERE, de God van Israël, getergd had.","Jer 4:22":"Zeker, Mijn volk is dwaas, Mij kennen zij niet; het zijn zotte kinderen, en zij hebben geen inzicht; wijs zijn zij om kwaad te doen, maar goed te doen weten zij niet.","1 Joh 3:10":"Hierin zijn de kinderen van God en de kinderen van de duivel openbaar. Ieder die de rechtvaardigheid niet doet, is niet uit God; en ook wie zijn broeder niet liefheeft,","1 Sam 3:11-14":"En de HEERE zei tegen Samuël: Zie, Ik doe een ding in Israël, dat bij ieder die het horen zal, beide oren zullen tuiten. Op diezelfde dag zal Ik over Eli alles tot stand brengen wat Ik tegen zijn huis gesproken heb; Ik zal het beginnen en voltooien. Want Ik heb hem laten weten dat Ik zijn huis zal oordelen tot in eeuwigheid, vanwege het ongerecht dat hij gekend heeft; want toen zijn zonen zich vervloekt hebben gemaakt, heeft hij hen niet eens streng aangezien.","Ps 62:4":"Hoelang zult u kwaad aanstichten tegen een man? U zult allen gedood worden; u zult zijn als een ingebogen wand, een aangestoten muur.","Gal 3:1":"O onverstandige Galaten, wie heeft u betoverd, dat u de waarheid niet zou gehoorzamen? U voor wie ogen Jezus Christus is voorgeschilderd, onder u gekruisigd.","Spr 25:5":"Doe de goddeloze weg van het aangezicht van de koning, en zijn troon zal door gerechtigheid bevestigd worden.","Jes 65:6":"Zie, het is voor Mijn aangezicht geschreven; Ik zal niet zwijgen, maar Ik zal vergelden, ja, in hun boezem zal Ik vergelden;","Tit 1:16":"Zij belijden dat zij God kennen, maar zij verloochenen Hem met hun werken, omdat zij verfoeilijk zijn en ongehoorzaam, en voor elk goed werk ongeschikt.","Jer 32:10":"En ik ondertekende de brief en verzegelde hem, en liet het door getuigen bevestigen, toen ik het geld op de weegschaal gewogen had.","Pred 8:13":"Maar de goddeloze zal het niet goed gaan, en hij zal zijn dagen niet verlengen; hij zal zijn als een schaduw, omdat hij niet vreest voor het aangezicht van God.","Ezech 25:7":"Daarom, zie, Ik zal Mijn hand tegen u uitstrekken, en u aan de heidenvolken tot buit geven, en Ik zal u uit de volken uitroeien, en u uit de landen doen verdwijnen; Ik zal u verdelgen; en u zult weten dat Ik de HEERE ben.","Joël 2:1":"Waait op de bazuin te Sion, en roept luide op de berg van Mijn heiligheid; laat alle inwoners van het land beroerd zijn, want de dag van de HEERE komt, want hij is nabij.","Jes 57:20":"Maar de goddelozen zijn als een voortgejaagde zee, want die kan niet tot rust komen, en haar water werpt slijk en modder op.","Ezech 22:31":"Daarom heb Ik Mijn gramschap over hen uitgegoten; door het vuur van Mijn verbolgenheid heb Ik hen verteerd; hun weg heb Ik op hun hoofd gegeven, spreekt de Heere HEERE.","Gal 6:14":"Maar laat het ver van mij zijn dat ik zou roemen, anders dan in het kruis van onze Heere Jezus Christus; door Wie de wereld mij gekruisigd is, en ik de wereld.","2 Sam 13:2":"En Amnon werd zo door haar in beslag genomen dat hij er ziek van werd, vanwege zijn zuster Thamar; want zij was een maagd, zodat het in Amnons ogen onmogelijk leek haar iets te doen.","1 Petr 4:18":"En als de rechtvaardige nauwelijks behouden wordt, waar zal dan de goddeloze en de zondaar verschijnen?","Lev 20:27":"Als nu een man of vrouw in zich een waarzeggende geest heeft, of een duivelskunstenaar is, zullen zij zeker gedood worden; men zal hen met stenen stenigen; hun bloed is op hen.","Spr 22:5":"Doornen en strikken liggen op de weg van de verkeerde; wie zijn ziel bewaart, zal zich ver daarvan houden.","Ps 7:16":"Hij heeft een kuil gegraven, en hem uitgegraven, maar hij is gevallen in de groeve, die hij gemaakt heeft.","1 Sam 25:22":"Zo doet God aan de vijanden van David, en zo doet Hij daar nog aan toe, als ik van allen die hij heeft iets tot morgen overlaat dat mannelijk is!","Spr 6:12-15":"Een nietsnut, een verdorven man, gaat om met een verkeerde mond; hij knipoogt met zijn ogen, spreekt met zijn voeten, wijst met zijn vingers; in zijn hart zijn verkeerdheden, hij smeedt voortdurend kwaad, hij zaait ruzie.","Luk 19:27":"Maar breng die vijanden van mij, die niet wilden dat ik koning over hen zou zijn, hier, en dood ze hier voor mij.","Mark 8:38":"Want wie zich voor Mij en Mijn woorden zal schamen, in dit overspelig en zondig geslacht, voor hem zal ook de Zoon des mensen Zich schamen, wanneer Hij komt in de heerlijkheid van Zijn Vader, met de heilige engelen.","Deut 21:18-21":"Wanneer iemand een koppige en opstandige zoon heeft, die niet luistert naar de stem van zijn vader en de stem van zijn moeder; en zij hem gestraft hebben, en hij toch niet naar hen wil horen, Dan zullen zijn vader en zijn moeder hem grijpen, en hem brengen naar de oudsten van zijn stad, en naar de poort van zijn plaats. En zij zullen tegen de oudsten van zijn stad zeggen: Deze zoon van ons is koppig en opstandig, hij wil niet naar ons luisteren; hij is een brasser en een dronkaard.","Micha 3:1":"Verder zei ik: Hoor nu, hoofden van Jakob, en leiders van het huis van Israël! Betaamt het u niet om het recht te weten?","Rom 2:4":"Of veracht u de rijkdom van Zijn goedertierenheid, en verdraagzaamheid, en geduld, zonder te weten dat de goedertierenheid van God u tot bekering leidt?","Luk 22:22":"En de Zoon des mensen gaat wel heen, zoals besloten is; maar wee die mens, door wie Hij verraden wordt!","Jak 5:1-3":"Welaan nu, u rijken, huil en jammer over uw ellenden, die over u komen. Uw rijkdom is verrot, en uw kleren zijn door de motten opgegeten. Uw goud en zilver is verroest; en hun roest zal tegen u getuigen, en zal uw vlees verteren als een vuur. U hebt schatten verzameld in de laatste dagen.","Ps 66:3":"Zegt tot God: Hoe ontzagwekkend bent U in Uw werken! Om de grootheid van Uw sterkte zullen Uw vijanden zich geveinsd aan U onderwerpen.","Luk 7:44":"En Hij keerde Zich om naar de vrouw, en zei tegen Simon: Ziet u deze vrouw? Ik ben uw huis binnengekomen; water hebt u Mij niet over de voeten gegeven; maar deze heeft Mijn voeten met tranen nat gemaakt, en met het haar van haar hoofd afgedroogd.","Zef 1:12-18":"En het zal gebeuren in die tijd, Ik zal Jeruzalem met lantaarns doorzoeken; en Ik zal bezoeking doen over de mannen die star geworden zijn op hun droesem, die in hun hart zeggen: De HEERE doet geen goed, en Hij doet geen kwaad. Daarom zal hun vermogen tot roof worden, en hun huizen tot verwoesting; zij bouwen wel huizen, maar zij zullen ze niet bewonen; en zij planten wijngaarden, maar zij zullen de wijn daarvan niet drinken. De grote dag van de HEERE is nabij; hij is nabij, en zeer haastende; de stem van de dag van de HEERE; de held zal daar bitter schreeuwen.","Joh 19:12":"Van toen af zocht Pilatus Hem los te laten; maar de Joden riepen: Als u Deze loslaat, bent u geen vriend van de keizer; ieder die zichzelf koning maakt, weerspreekt de keizer.","Ps 94:3-8":"Hoe lang zullen de goddelozen, o HEERE! hoe lang zullen de goddelozen van vreugde opspringen? Uitgieten? Hard spreken? Zullen alle werkers van de ongerechtigheid zich beroemen? O HEERE! Zij verbrijzelen Uw volk, en zij verdrukken Uw erfdeel.","Pred 8:11":"Omdat het oordeel over de boze daad niet snel wordt uitgevoerd, daarom is het hart van de mensenkinderen in hen vol om kwaad te doen.","Job 24:1-25":"Waarom zouden voor de Almachtige de tijden niet verborgen zijn, terwijl zij die Hem kennen Zijn dagen niet zien? Zij verzetten de landpalen; de kudden roven zij, en weiden ze. De ezel van de wezen drijven zij weg; de os van een weduwe nemen zij te pand.","Jes 13:8":"en zij zullen verschrikt worden, smarten en weeën zullen hen aangrijpen, zij zullen bang zijn als een barende vrouw; ieder zal over zijn naaste verbaasd zijn; hun gezichten zullen vlammende gezichten zijn.","Jes 65:7":"Uw ongerechtigheden, en de ongerechtigheden van uw vaderen tegelijk, zegt de HEERE, die op de bergen wierook gebrand hebben, en Mij smaad aangedaan hebben op de heuvels; daarom zal Ik hun vorige werkloon weer in hun boezem toemeten.","Matt 5:21":"U hebt gehoord dat tot de ouden gezegd is: U zult niet doden; en wie doodt, die zal strafbaar zijn voor het gericht.","Ezra 4:7":"En in de dagen van Arthahsasta schreven Bislam, Mithredath, Tabeel en de overigen van zijn gezelschap aan Arthahsasta, de koning van Perzië; en het schrift van de brief was in het Syrisch geschreven en in het Syrisch vertaald.","1 Kon 15:25":"Nadab nu, de zoon van Jerobeam, werd koning over Israël, in het tweede jaar van Asa, de koning van Juda; en hij regeerde twee jaren over Israël.","1 Kon 20:42":"En hij zei tegen hem: Zo zegt de HEERE: Omdat u de man, die Ik verbannen had, uit uw hand hebt laten gaan, zal uw leven in de plaats van zijn leven zijn, en uw volk in de plaats van zijn volk.","Spr 12:2":"De goede zal een welgevallen krijgen van de HEERE; maar een man van schandelijke verdichtsels zal Hij verdoemen.","Klaagl 5:4":"Ons water moeten wij voor geld drinken; ons hout komt ons op prijs te staan.","1 Kron 28:9":"En u, mijn zoon Salomo, ken de God van uw vader, en dien Hem met een volkomen hart en met een gewillige ziel; want de HEERE doorzoekt alle harten, en Hij doorziet elk bedenksel van de gedachten; als u Hem zoekt, zal Hij door u gevonden worden; maar als u Hem verlaat, zal Hij u voor altijd verstoten.","Ex 10:3":"Zo gingen Mozes en Aäron naar Farao, en zeiden tegen hem: Zo zegt de HEERE, de God van de Hebreeën: Hoe lang weigert u zich voor Mijn aangezicht te verootmoedigen? Laat Mijn volk gaan, dat zij Mij dienen.","Openb 11:18":"en de volken waren toornig geworden, en Uw toorn is gekomen, en de tijd van de doden, om geoordeeld te worden, en om het loon te geven aan Uw dienstknechten, de profeten, en de heiligen, en aan hen die Uw Naam vrezen, de kleinen en de groten; en om hen te verderven die de aarde verdierven.","Gen 44:7":"En zij zeiden tegen hem: Waarom spreekt mijn heer zulke woorden? Het zij verre van uw knechten dat zij zoiets zouden doen.","Ezech 46:16-18":"Zo zegt de Heere HEERE: Wanneer de vorst aan iemand van zijn zonen een geschenk zal geven van zijn erfenis, dan zullen zijn zonen dat hebben; het zal hun bezitting zijn in erfenis. Maar wanneer hij van zijn erfenis een geschenk zal geven aan een van zijn knechten, dan zal die dat hebben tot het vrijjaar toe; dan zal het naar de vorst terugkeren; het is immers zijn erfenis, zijn zonen zullen het hebben. En de vorst zal niets nemen van de erfenis van het volk, door hen van hun bezitting te beroven; van zijn eigen bezitting zal hij zijn zonen erfenis nalaten; opdat niet Mijn volk, ieder uit zijn bezitting, verstrooid wordt.","Gen 49:7":"Vervloekt is hun toorn, want hij is heftig; en hun verbolgenheid, want zij is hard! Ik zal hen verdelen onder Jakob, en zal hen verstrooien onder Israël.","1 Kon 21:8-14":"Zij schreef dan brieven in de naam van Achab, en verzegelde ze met zijn zegel; en zond de brieven aan de oudsten en aan de edelen, die in zijn stad waren, wonend bij Naboth. En zij schreef in die brieven: Roept een vasten uit, en zet Naboth vooraan onder het volk; En zet tegenover hem twee mannen, zonen van Belial, die tegen hem getuigen en zeggen: U hebt God en de koning gevloekt; en voer hem naar buiten, en stenig hem, dat hij sterft.","1 Sam 12:25":"Maar als u toch kwaad blijft doen, zult u, evengoed als uw koning, omkomen.","Jes 65:4":"Zittend bij de graven, zo overnachten zij bij de bewaarde plaatsen, etend zwijnenvlees, en er is sap van gruwelijke dingen in hun vaten.","Mark 11:26":"Maar als u niet vergeeft, zal ook uw Vader, Die in de hemelen is, uw overtredingen niet vergeven.","Job 24:2-24":"Zij verzetten de landpalen; de kudden roven zij, en weiden ze. De ezel van de wezen drijven zij weg; de os van een weduwe nemen zij te pand. Zij doen de behoeftigen wijken van de weg; samen verstoppen zich de ellendigen van het land.","Jes 50:11":"Zie, u allen, die een vuur aansteekt, die u met vuurvonken omgordt! Wandel in de vlam van uw vuur, en in de vuurvonken die u ontstoken hebt. Dit overkomt u van Mijn hand: in smart zult u neerliggen.","Ps 5:7":"U zult de leugensprekers verdoen; van de man van het bloed en van het bedrog heeft de HEERE een gruwel.","Spr 19:16":"Die het gebod bewaart, bewaart zijn ziel; die zijn wegen veracht, zal sterven.","Jes 3:9":"Het gelaat van hun aangezicht getuigt tegen hen, en hun zonden spreken zij vrij uit, net als Sodom; zij verbergen ze niet. Wee hun ziel; want zij doen zichzelf kwaad.","Spr 4:16":"Want zij slapen niet, als zij geen kwaad gedaan hebben; en hun slaap wordt weggenomen, als zij niemand hebben doen struikelen.","Joh 3:15":"Opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft.","Ps 58:12":"En de mens zal zeggen: Zeker, er is vrucht voor de rechtvaardige; zeker, er is een God, Die op de aarde recht spreekt.","Spr 10:3":"De HEERE laat de ziel van de rechtvaardige niet hongeren; maar de have van de goddelozen stoot Hij weg.","1 Kon 21:8-13":"Zij schreef dan brieven in de naam van Achab, en verzegelde ze met zijn zegel; en zond de brieven aan de oudsten en aan de edelen, die in zijn stad waren, wonend bij Naboth. En zij schreef in die brieven: Roept een vasten uit, en zet Naboth vooraan onder het volk; En zet tegenover hem twee mannen, zonen van Belial, die tegen hem getuigen en zeggen: U hebt God en de koning gevloekt; en voer hem naar buiten, en stenig hem, dat hij sterft.","1 Kon 16:2":"Omdat Ik u uit het stof heb verheven, en u tot een voorganger over Mijn volk Israël heb aangesteld, en u gewandeld hebt in de weg van Jerobeam, en Mijn volk Israël hebt doen zondigen, en Mij tot toorn hebt verwekt door hun zonden;","Spr 1:11":"Als zij zeggen: Ga met ons, laat ons loeren op bloed, ons verstoppen tegen de onschuldige, zonder oorzaak;","Est 4:5":"Toen riep Esther Hatach, een van de kamerlingen van de koning, die hij voor haar aangesteld had, en zij gaf hem opdracht aan Mordechai, om te weten wat dit was, en waarom dit was.","Joël 1:13":"Omgord u, en rouwklaag, priesters! Huil, dienaars van het altaar! Ga naar binnen, overnacht in zakken, dienaars van mijn God! Want spijsoffer en drankoffer is geweerd van het huis van uw God.","Ps 52:7":"God zal u ook afbreken voor eeuwig; Hij zal u wegrapen en u uit de tent uitrukken; ja, Hij zal u uitwortelen uit het land van de levenden. Sela.","Ps 89:33":"dan zal Ik hun overtreding met de roede bezoeken, en hun ongerechtigheid met plagen.","2 Kon 9:26":"Zeker heb Ik gisteravond het bloed van Naboth gezien, en het bloed van zijn zonen, zegt de HEERE, en Ik zal het u vergelden op dit stuk land, zegt de HEERE. Nu dan, neem hem op, werp hem op dat stuk land, naar het woord van de HEERE.","1 Joh 3:15":"Ieder die zijn broeder haat, is een moordenaar; en u weet dat geen moordenaar het eeuwige leven in zich heeft blijven.","Jer 36:31":"En Ik zal over hem, en over zijn nageslacht, en over zijn dienaren hun ongerechtigheid bezoeken; en Ik zal over hen, en over de inwoners van Jeruzalem, en over de mannen van Juda, al het kwaad brengen dat Ik tot hen gesproken heb; maar zij hebben niet geluisterd.","2 Kron 24:5":"Zo verzamelde hij de priesters en de Levieten, en zei tegen hen: Trek uit naar de steden van Juda, en verzamel geld van heel Israël, om het huis van uw God te herstellen van jaar tot jaar; en u, haast u met deze zaak; maar de Levieten haastten zich niet.","Deut 21:2-8":"Dan zullen uw oudsten en uw rechters uitgaan, en zij zullen meten naar de steden die rondom de gedode liggen. De stad nu die het dichtst bij de gedode ligt, daar zullen de oudsten van die stad een jonge koe nemen waarmee niet gewerkt is, die aan het juk niet getrokken heeft. En de oudsten van die stad zullen de jonge koe naar beneden brengen in een ruw dal, dat niet bewerkt of bezaaid is; en zij zullen deze jonge koe daar in het dal de nek doorhouwen.","Job 34:22":"Er is geen duisternis, en er is geen schaduw van de dood, dat daar de werkers van de ongerechtigheid zich verbergen mochten.","Ps 68:22":"Zeker zal God de kop van Zijn vijanden verslaan, de harige schedel van hem die in zijn schulden wandelt.","Hos 5:4-6":"Zij richten hun daden niet zo in dat zij zich tot hun God bekeren; want de geest van de hoererijen is in hun midden, en de Heere kennen zij niet. Daarom zal Israël hoogmoed in zijn gezicht getuigen; en Israël en Efraïm zullen vallen door hun ongerechtigheid; ook Juda zal met hen vallen. Met hun schapen en met hun runderen zullen zij dan gaan om de Heere te zoeken, maar niet vinden; Hij heeft Zich van hen teruggetrokken.","Ps 119:21":"U scheldt de vervloekte hoogmoedigen, die van Uw geboden afdwalen.","Jer 9:1":"Och, dat mijn hoofd water was, en mijn oog een springader van tranen! Dan zou ik dag en nacht bewenen de verslagenen van de dochter van mijn volk.","Num 15:31":"Want zij heeft het woord van de HEERE veracht en Zijn gebod vernietigd; die ziel zal helemaal uitgeroeid worden; haar ongerechtigheid is op haar.","Matt 10:33":"Maar wie Mij verloochend zal hebben voor de mensen, die zal Ik ook verloochenen voor Mijn Vader, Die in de hemelen is.","1 Kon 21:20-24":"En Achab zei tegen Elia: Hebt u mij gevonden, o mijn vijand? En hij zei: Ik heb u gevonden, omdat u uzelf verkocht hebt om te doen wat kwaad is in de ogen van de HEERE. Zie, Ik zal kwaad over u brengen, en uw nakomelingen wegdoen; en Ik zal van Achab uitroeien wie mannelijk is, alsook wie in Israël afgesloten is en wie verlaten is. En Ik zal uw huis maken als het huis van Jerobeam, de zoon van Nebat, en als het huis van Baësa, de zoon van Ahia; om de terging waarmee u Mij getergd hebt, en dat u Israël hebt doen zondigen.","2 Kon 17:17":"Ook lieten zij hun zonen en hun dochters door het vuur gaan, en gebruikten waarzeggerij, en letten op vogelgeschrei, en verkochten zich om te doen wat kwaad was in de ogen van de HEERE, om Hem tot toorn te verwekken.","Ps 15:5":"Die zijn geld niet uitleent tegen woeker, en geen geschenk aanneemt tegen de onschuldige. Wie deze dingen doet, zal niet wankelen in eeuwigheid.","Ex 22:28":"U mag de rechters niet vervloeken, en de leiders van uw volk mag u niet belasteren.","Lev 25:51":"Als er nog veel van die jaren zijn, zal hij naar verhouding daarvan tot zijn lossing van het geld waarvoor hij gekocht is, teruggeven.","Spr 4:17":"Want zij eten brood van goddeloosheid, en drinken wijn van enkel geweld.","2 Kon 10:11":"Daartoe sloeg Jehu al de overgeblevenen van het huis van Achab te Jizreël, en al zijn groten, en zijn bekenden, en zijn priesters; totdat hij hem geen overigen liet overblijven.","Ps 50:18":"Als u een dief ziet, dan loopt u met hem mee; en uw deel is met de overspelers.","Spr 1:10-14":"Mijn zoon! als de zondaars u aanlokken, stem er niet mee in; Als zij zeggen: Ga met ons, laat ons loeren op bloed, ons verstoppen tegen de onschuldige, zonder oorzaak; Laat ons hen levend verslinden, als het graf; ja, geheel en al, zoals zij die in de kuil neerdalen;","Ps 145:20":"Schin. De HEERE bewaart allen die Hem liefhebben; maar Hij verdelgt alle goddelozen.","Ezech 9:10":"Daarom ook, wat Mij aangaat, Mijn oog zal niet verschonen, en Ik zal niet sparen; Ik zal hun weg op hun hoofd geven.","2 Kon 22:7":"Doch er werd met hen geen rekening gehouden van het geld dat in hun hand geleverd was, want zij handelden trouw.","Num 35:31":"En u zult geen losgeld nemen voor het leven van de doodslager, die schuldig is te sterven; want hij zal zeker gedood worden.","Richt 6:10":"en Ik zei tegen u: Ik ben de HEERE, uw God; vrees de goden van de Amorieten niet, in wier land u woont; maar u bent Mijn stem niet gehoorzaam geweest.","2 Sam 12:17":"Toen kwamen de oudsten van zijn huis naar hem toe, om hem te laten opstaan van de aarde; maar hij wilde niet, en at ook geen brood met hen.","Jona 4:9":"Toen zei God tegen Jona: Is het terecht dat uw woede oplaait over de wonderboom? En hij zei: Terecht laait mijn woede op, tot de dood toe.","Joh 5:29":"en zij zullen uitgaan, zij die het goede gedaan hebben tot de opstanding van het leven, en zij die het kwade gedaan hebben tot de opstanding van het oordeel.","Neh 3:16":"Na hem verbeterde Nehemia, de zoon van Azbuk, leider van het halve deel van Beth-Zur, tot tegenover Davids graven, en tot aan de aangelegde vijver, en tot aan het huis van de helden.","Jer 5:4":"Toch zei ik: Zeker, dit zijn de armen; zij handelen dwaas, omdat zij de weg van de HEERE, het recht van hun God, niet kennen.","1 Kon 16:26":"En hij wandelde in alle wegen van Jerobeam, de zoon van Nebat, en in zijn zonden, waarmee hij Israël had doen zondigen, en verwekte de HEERE, de God van Israël, tot toorn, door hun nietige afgoden.","Lev 24:15":"En tegen de Israëlieten zult u spreken en zeggen: Ieder die zijn God vloekt, zal zijn zonde dragen.","Ezech 33:11":"Zeg tegen hen: Zo waarachtig als Ik leef, spreekt de Heere HEERE, Ik heb geen behagen in de dood van de goddeloze! Maar hierin heb Ik behagen, dat de goddeloze zich bekeert van zijn weg en leeft. Bekeert u, bekeert u van uw slechte wegen, want waarom zou u sterven, o huis van Israël?","Openb 3:18":"Ik raad u aan dat u van Mij goud koopt, gelouterd door het vuur, opdat u rijk mag worden; en witte kleren, opdat u bekleed mag worden, en de schande van uw naaktheid niet openbaar wordt; en zalf uw ogen met ogenzalf, opdat u zien kunt.","Job 21:19":"Dat God Zijn geweld weglegt voor Zijn kinderen, hem vergeldt, zodat hij het gewaarwordt;","1 Sam 2:12":"Doch de zonen van Eli waren kinderen van Belial; zij kenden de HEERE niet.","Rom 3:6":"Dat zij verre, anders hoe zal God de wereld oordelen?","Matt 2:8":"En hij stuurde hen naar Bethlehem en zei: Ga erheen, en onderzoek nauwkeurig naar dat Kindje, en als u Het gevonden hebt, laat het mij weten, opdat ik ook kom en Het aanbid.","Ps 59:7":"Tegen de avond keren zij terug, zij tieren als een hond, en gaan rond om de stad.","Deut 27:24":"Vervloekt is hij die zijn naaste in het verborgene doodslaat! En heel het volk zal zeggen: Amen.","Jer 7:10":"en dan komen en staan voor Mijn aangezicht in dit huis, dat naar Mijn Naam genoemd is, en zeggen: Wij zijn verlost, om al deze gruwelen te doen?","Gal 5:19-21":"De werken van het vlees nu zijn openbaar; dat zijn: overspel, hoererij, onreinheid, losbandigheid, Afgoderij, toverij, vijandschappen, ruzies, jaloersheden, toorn, twisten, verdeeldheid, afwijkingen in de leer, Afgunst, moord, dronkenschappen, uitspattingen, en dergelijke; waarvan ik u van tevoren zeg, zoals ik ook eerder gezegd heb, dat wie zulke dingen doen, het Koninkrijk van God niet zullen beërven.","Matt 21:19":"En Hij zag een vijgenboom aan de weg, ging ernaartoe, en vond er niets aan dan alleen bladeren; en Hij zei tegen hem: Laat er in eeuwigheid geen vrucht meer aan u komen! En de vijgenboom verdorde meteen.","Mark 16:16":"Wie geloofd zal hebben, en gedoopt zal zijn, zal behouden worden; maar wie niet geloofd zal hebben, zal verdoemd worden.","1 Kon 18:46":"En de hand van de HEERE was op Elia, en hij gordde zijn lenden, en liep voor het aangezicht van Achab uit, tot waar men bij Jizreël komt.","1 Kon 16:3":"Zie, zo zal Ik de nakomelingen van Baësa, en de nakomelingen van zijn huis wegdoen; en Ik zal uw huis maken zoals het huis van Jerobeam, de zoon van Nebat.","Num 31:16":"Zie, dezen waren het, die door de raad van Bileam de kinderen van Israël ertoe brachten trouweloos te handelen tegen de HEERE, in de zaak van Peor; waardoor die plaag kwam onder de vergadering van de HEERE.","Ezech 16:47":"Toch hebt u niet in hun wegen gewandeld, noch naar hun gruwelen gedaan; het was iets van het geringe, een verdriet; maar u hebt het meer verdorven dan zij, in al uw wegen.","Spr 21:16":"Een mens die van de weg van het verstand afdwaalt, zal in de gemeente van de doden rusten.","Gen 37:34":"Toen scheurde Jakob zijn kleren en legde een zak om zijn heupen; en hij bedreef rouw over zijn zoon, vele dagen.","2 Tim 2:12":"als wij volharden, zullen wij ook met Hem heersen; als wij Hem verloochenen, zal Hij ons ook verloochenen;","Ezech 18:12":"De ellendige en de arme verdrukt, veel van het roof rooft, het pand niet teruggeeft, en zijn ogen opheft tot de drekgoden, gruwel doet;","Jes 33:15":"Wie in gerechtigheid wandelt, en wat recht is spreekt; wie de winst van onderdrukking verwerpt; wie zijn handen uitschudt, zodat zij geen geschenken vasthouden; wie zijn oor dichtstopt, zodat hij geen bloedschuld hoort, en zijn ogen dichtdoet; zodat hij het kwade niet aanziet;","Ps 2:9":"U zult hen verpletteren met een ijzeren scepter; U zult hen in stukken slaan als een pottenbakkersvat.","Matt 16:26":"Want wat baat het een mens, als hij de hele wereld wint, en schade lijdt aan zijn ziel? Of wat zal een mens geven, als losprijs voor zijn ziel?","Ps 119:155":"Het heil is ver van de goddelozen, want zij zoeken Uw inzettingen niet.","1 Sam 8:6":"Maar dit woord was kwaad in de ogen van Samuël, toen zij zeiden: Geef ons een koning, om ons te richten. En Samuël bad de HEERE aan.","Ezech 33:7-20":"U dan, o mensenkind! Ik heb u tot een wachter gesteld over het huis van Israël; u zult dus het woord uit Mijn mond horen, en hen namens Mij waarschuwen. Als Ik tegen de goddeloze zeg: O goddeloze, u zult zeker sterven! en u spreekt niet, om de goddeloze van zijn weg af te manen, dan zal die goddeloze in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen. Maar als u de goddeloze van zijn weg afmaant, dat hij zich ervan bekeert, en hij zich van zijn weg niet bekeert, dan zal hij in zijn ongerechtigheid sterven; maar u hebt uw leven bevrijd.","Gal 5:19":"De werken van het vlees nu zijn openbaar; dat zijn: overspel, hoererij, onreinheid, losbandigheid,","1 Tim 1:20":"Onder hen zijn Hymeneüs en Alexander, die ik aan de satan overgegeven heb, opdat zij zouden leren niet meer te lasteren.","Hebr 2:3":"hoe zullen wij dan ontvluchten, als wij zo'n grote zaligheid veronachtzamen? Deze is eerst door de Heere Zelf verkondigd, en aan ons bevestigd door hen die Hem gehoord hebben;","Openb 20:15":"En zo iemand niet gevonden werd geschreven in het boek van het leven, die werd geworpen in de poel van het vuur.","Ps 78:1-67":"Een onderwijzing van Asaf. O mijn volk, neem mijn leer ter ore; neig uw oor tot de woorden van mijn mond. Ik zal mijn mond opendoen met spreuken; ik zal geheimen overvloedig uitstorten, van oude tijden af. Die wij gehoord hebben en weten, en onze vaders ons verteld hebben.","2 Sam 12:9":"Waarom hebt u dan het woord van de HEERE veracht, door te doen wat kwaad is in Zijn ogen? U hebt Uria, de Hethiet, met het zwaard verslagen, en zijn vrouw hebt u tot uw vrouw genomen; en hem hebt u met het zwaard van de kinderen van Ammon gedood.","Mark 12:12":"En zij probeerden Hem te grijpen, maar zij waren bang voor de menigte; want zij begrepen dat Hij die gelijkenis tegen hen gesproken had; en zij lieten Hem met rust en gingen weg.","Ps 26:10":"In wier handen schandelijk bedrijf is, en van wie de rechterhand vol geschenken is.","Deut 21:14":"En het zal gebeuren, als u geen behagen meer in haar hebt, dat u haar zult laten gaan waarheen zij wil; maar u zult haar beslist niet voor geld verkopen, u zult geen handel met haar drijven, omdat u haar vernederd hebt.","Jer 14:12":"Ofschoon zij vasten, zal Ik naar hun geschrei niet horen, en ofschoon zij brandoffer en spijsoffer offeren, zal Ik aan hen geen welgevallen hebben; maar door het zwaard, en door de honger, en door de pest zal Ik hen verteren.","Jes 48:22":"Maar de goddelozen hebben geen vrede, zegt de HEERE.","Neh 5:10":"Ik, mijn broeders en mijn knechten, vorderen wij ook geld en koren van hen? Laten wij toch deze last nalaten.","Rom 7:14":"Want wij weten dat de wet geestelijk is, maar ik ben vleselijk, verkocht onder de zonde.","1 Kon 20:35-43":"Toen zei een man uit de zonen van de profeten tegen zijn naaste, door het woord van de HEERE: Sla mij toch. En de man weigerde hem te slaan. En hij zei tegen hem: Omdat u de stem van de HEERE niet gehoorzaam bent geweest, zie, zodra u van mij weggegaan bent, zal een leeuw u doden. En toen hij van bij hem weggegaan was, vond een leeuw hem, die hem doodde. Daarna vond hij een andere man, en zei: Sla mij toch. En die man sloeg hem, en verwondde hem door hem te slaan.","2 Kon 21:11":"Omdat Manasse, de koning van Juda, deze gruwelen gedaan heeft, erger doend dan alles wat de Amorieten gedaan hebben die vóór hem geweest zijn, ja, ook Juda door zijn drekgoden heeft doen zondigen;","Matt 2:16":"Toen Herodes zag dat hij door de wijzen bedrogen was, werd hij zeer toornig, en na enigen uitgezonden te hebben, bracht hij al de kinderen om die binnen Bethlehem en in heel dat gebied waren, van twee jaar oud en daaronder, overeenkomstig de tijd die hij van de wijzen nauwkeurig had nagevraagd.","Ps 35:11":"Wrevelige getuigen staan op; wat ik niet weet, eisen zij van mij.","Gen 23:9":"Dat hij mij de spelonk van Machpela geeft, die hij heeft, die aan het eind van zijn akker is; dat hij die mij voor het volle geld geeft, tot een eigen graf in het midden van u.","Matt 7:2":"Want met het oordeel waarmee u oordeelt, zult u geoordeeld worden; en met de maat waarmee u meet, zal u weer gemeten worden.","Ezra 9:13":"En na alles wat over ons gekomen is, om onze slechte werken, en om onze grote schuld, omdat U, o onze God, ons minder gestraft hebt dan onze ongerechtigheid verdient, en ons een ontkoming gegeven hebt, zoals deze is;","Matt 24:51":"en hij zal hem in stukken houwen, en hem zijn deel geven met de huichelaars; daar zal geween zijn en het geknars van de tanden.","1 Kon 21:21-23":"Zie, Ik zal kwaad over u brengen, en uw nakomelingen wegdoen; en Ik zal van Achab uitroeien wie mannelijk is, alsook wie in Israël afgesloten is en wie verlaten is. En Ik zal uw huis maken als het huis van Jerobeam, de zoon van Nebat, en als het huis van Baësa, de zoon van Ahia; om de terging waarmee u Mij getergd hebt, en dat u Israël hebt doen zondigen. Verder sprak de HEERE ook over Izebel: De honden zullen Izebel eten, bij de voorwal van Jizreël.","Job 18:5-21":"Ja, het licht van de goddelozen zal uitgeblust worden, en de vonk van zijn vuur zal niet glinsteren. Het licht zal verduisteren in zijn tent, en zijn lamp zal boven hem uitgeblust worden. De stappen van zijn kracht zullen beperkt worden, en zijn eigen plan zal hem neerwerpen.","Luk 20:47":"die de huizen van de weduwen opeten, en voor de schijn lange gebeden uitspreken; zij zullen een des te zwaarder oordeel ontvangen.","Luk 9:3":"En Hij zei tegen hen: Neem niets mee voor onderweg, geen stok, geen reistas, geen brood, geen geld; en niemand van u mag twee stel kleren hebben.","Matt 18:35":"Zo zal ook Mijn hemelse Vader met u doen, als u niet ieder van harte uw broeder zijn misdaden vergeeft.","Ps 10:15":"Breek de arm van de goddeloze en de bozen; zoek zijn goddeloosheid, totdat U haar niet meer vindt.","Ps 36:2-5":"De overtreding van de goddeloze spreekt in het binnenste van mijn hart: Er is geen vreze van God voor zijn ogen. Want hij vleit zichzelf in zijn ogen, als men zijn ongerechtigheid bevindt, die te haten is. De woorden van de mond van hem zijn onrecht en bedrog; hij laat na te verstaan tot weldoen.","1 Kon 16:30-33":"En Achab, de zoon van Omri, deed wat kwaad was in de ogen van de HEERE, meer dan allen die voor hem geweest waren. En het gebeurde (was het een lichte zaak dat hij wandelde in de zonden van Jerobeam, de zoon van Nebat?), dat hij ook nog Izebel, de dochter van Eth-baal, de koning van de Sidoniërs, tot vrouw nam, en heenging, en Baäl diende, en zich voor hem neerboog. En hij richtte voor Baäl een altaar op, in het huis van Baäl, dat hij te Samaria gebouwd had.","Lev 25:37":"Uw geld zult u hem niet op rente geven, en uw voedsel zult u niet op overwinst geven.","Matt 3:7":"Toen hij dan velen van de Farizeeën en Sadduceeën naar zijn doop zag komen, zei hij tegen hen: Adderengebroed! Wie heeft u laten weten dat u moet vluchten voor de komende toorn?","Luk 13:5-7":"Ik zeg u: Nee; maar als u zich niet bekeert, zult u allen net zo omkomen. En Hij vertelde deze gelijkenis: Iemand had een vijgenboom, geplant in zijn wijngaard; en hij kwam en zocht daarop vrucht, en vond ze niet. En hij zei tegen de wijngaardenier: Zie, ik kom nu al drie jaar vrucht zoeken op deze vijgenboom en vind ze niet; hak hem om; waarom put hij ook nog de grond onnodig uit?","2 Petr 2:12-17":"Maar dezen, als onredelijke dieren, die de natuur volgen en geboren zijn om gevangen en gedood te worden, lasteren wat zij niet begrijpen, en zullen in hun verdorvenheid ook zelf verdorven worden; en zij zullen het loon van de onrechtvaardigheid ontvangen, omdat zij het als een genot beschouwen dagelijks in weelde te leven; zij zijn vlekken en smetten, en genieten uitbundig van hun eigen bedrog, terwijl zij met u aan de maaltijd zijn; zij hebben ogen vol overspel, die niet ophouden met zondigen; zij verleiden onvaste zielen, hebben een hart geoefend in hebzucht, en zijn kinderen van de vervloeking;","Jer 17:1":"De zonde van Juda is geschreven met een ijzeren griffie, met de punt van een diamant; gegraven in de tafel van hun hart, en aan de hoornen van uw altaren;","2 Kron 22:9":"Daarna zocht hij Ahazia, en zij kregen hem te pakken (want hij had zich verstopt in Samaria), en zij brachten hem tot Jehu, en zij doodden hem, en begroeven hem; want zij zeiden: Hij is de zoon van Josafat, die de HEERE met zijn hele hart gezocht heeft. Zo had het huis van Ahazia niemand die de kracht behield tot het koningschap.","Pred 7:8":"Het einde van een ding is beter dan zijn begin; de geduldige is beter dan de hoogmoedige.","Luk 15:12":"En de jongste van hen zei tegen de vader: Vader, geef mij het deel van het bezit, dat mij toekomt. En hij verdeelde onder hen het bezit.","Num 32:23":"Maar als u dat niet zo zult doen, zie, dan hebt u tegen de HEERE gezondigd; en weet zeker dat uw zonde u vinden zal!","Hagg 2:15":"Toen antwoordde Haggai en zei: Zo is dit volk, en zo is deze natie voor Mijn aangezicht, spreekt de HEERE, en zo is al het werk van hun handen; en wat zij daar offeren, dat is onrein.","2 Kon 1:3":"Maar de Engel van de HEERE sprak tot Elia, de Thisbiet: Maak u op, ga de boden van de koning van Samaria tegemoet, en spreek tot hen: Is het omdat er geen God in Israël is, dat u heengaat om Baäl-Zebub, de god van Ekron, te vragen?","1 Kon 21:7-16":"Toen zei Izebel, zijn vrouw, tegen hem: Regeert u nu het koninkrijk over Israël? Sta op, eet brood, en laat uw hart vrolijk zijn; ik zal u de wijngaard van Naboth, de Jizreëliet, geven. Zij schreef dan brieven in de naam van Achab, en verzegelde ze met zijn zegel; en zond de brieven aan de oudsten en aan de edelen, die in zijn stad waren, wonend bij Naboth. En zij schreef in die brieven: Roept een vasten uit, en zet Naboth vooraan onder het volk;","2 Kron 33:9":"Zo deed Manasse Juda en de inwoners van Jeruzalem dwalen, dat zij erger deden dan de heidenen, die de HEERE voor het aangezicht van de kinderen van Israël verdelgd had.","Num 15:35":"Toen zei de HEERE tot Mozes: Die man zal zeker gedood worden; de hele vergadering zal hem met stenen stenigen buiten het leger.","Jes 24:17":"De angst, en de kuil, en de strik over u, o inwoners van het land!","Gen 44:1-8":"En hij gebood degene die over zijn huis ging, en zei: Vul de zakken van deze mannen met voedsel, zoveel als zij kunnen dragen, en leg ieders geld in de mond van zijn zak; En mijn beker, de zilveren beker, moet u leggen in de mond van de zak van de jongste, met het geld van zijn koren. En hij deed naar Jozefs woord, dat hij
