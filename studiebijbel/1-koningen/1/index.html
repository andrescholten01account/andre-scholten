m":"Lukas","href":"../../lukas/1/"},{"naam":"Johannes","href":"../../johannes/1/"},{"naam":"Handelingen","href":"../../handelingen/1/"},{"naam":"Romeinen","href":"../../romeinen/1/"},{"naam":"1 Korinthe","href":"../../1-korinthe/1/"},{"naam":"2 Korinthe","href":"../../2-korinthe/1/"},{"naam":"Galaten","href":"../../galaten/1/"},{"naam":"Efeze","href":"../../efeze/1/"},{"naam":"Filippenzen","href":"../../filippenzen/1/"},{"naam":"Kolossenzen","href":"../../kolossenzen/1/"},{"naam":"1 Thessalonicenzen","href":"../../1-thessalonicenzen/1/"},{"naam":"2 Thessalonicenzen","href":"../../2-thessalonicenzen/1/"},{"naam":"1 Timotheüs","href":"../../1-timotheus/1/"},{"naam":"2 Timotheüs","href":"../../2-timotheus/1/"},{"naam":"Titus","href":"../../titus/1/"},{"naam":"Filemon","href":"../../filemon/1/"},{"naam":"Hebreeën","href":"../../hebreeen/1/"},{"naam":"Jakobus","href":"../../jakobus/1/"},{"naam":"1 Petrus","href":"../../1-petrus/1/"},{"naam":"2 Petrus","href":"../../2-petrus/1/"},{"naam":"1 Johannes","href":"../../1-johannes/1/"},{"naam":"2 Johannes","href":"../../2-johannes/1/"},{"naam":"3 Johannes","href":"../../3-johannes/1/"},{"naam":"Judas","href":"../../judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}]},"vertalingen":{"SVnu":{"1":"De koning David was oud en had veel jaren geleefd; en zij dekten hem toe met kleren, maar hij kreeg er geen warmte van.","2":"Toen zeiden zijn knechten tegen hem: Laat men voor mijn heer de koning een jonge dochter, een maagd zoeken, die voor het aangezicht van de koning staat en hem koestert; en zij slaapt in uw schoot, zodat mijn heer de koning warm wordt.","3":"Zo zochten zij een mooie jonge dochter in alle gebieden van Israël; en zij vonden Abisag, een Sunamitische, en brachten haar tot de koning.","4":"En de jonge dochter was buitengewoon mooi, en zij koesterde de koning en diende hem; maar de koning had geen gemeenschap met haar.","5":"Adonia nu, de zoon van Haggith, verhief zich en zei: Ik zal koning zijn; en hij bereidde zich wagens en ruiters, en vijftig mannen die voor hem uit liepen.","6":"En zijn vader had hem nooit bedroefd door te zeggen: Waarom hebt u zo gedaan? En ook was hij zeer knap van gedaante, en *Haggith* had hem gebaard na Absalom.","7":"En hij overlegde met Joab, de zoon van Zeruja, en met Abjathar, de priester; die hielpen hem, en volgden Adonia.","8":"Maar Zadok, de priester, en Benaja, de zoon van Jojada, en Nathan, de profeet, en Simeï, en Rei, en de helden die David had, waren niet met Adonia.","9":"En Adonia slachtte schapen en runderen en gemest vee bij de steen Zoheleth, die bij de bron Rogel is; en nodigde al zijn broers, de zonen van de koning, en alle mannen van Juda, de knechten van de koning.","10":"Maar Nathan, de profeet, en Benaja, en de helden, en Salomo, zijn broer, nodigde hij niet.","11":"Toen sprak Nathan tot Bathseba, de moeder van Salomo, en zei: Hebt u niet gehoord dat Adonia, de zoon van Haggith, koning is? En onze heer David weet dat niet.","12":"Nu dan, kom, laat ik u toch een raad geven, zodat u uw leven redt en het leven van uw zoon Salomo.","13":"Ga heen, en ga naar binnen bij de koning David, en zeg tegen hem: Hebt u niet, mijn heer koning, uw dienstmaagd gezworen: Zeker, uw zoon Salomo zal na mij koning zijn, en hij zal op mijn troon zitten! Waarom is dan Adonia koning geworden?","14":"Zie, terwijl u daar nog met de koning spreekt, zal ik na u binnenkomen, en zal uw woorden bevestigen.","15":"En Bathseba ging naar binnen bij de koning, in de binnenkamer; de koning was zeer oud, en Abisag, de Sunamitische, diende de koning.","16":"En Bathseba boog haar hoofd en boog zich neer voor de koning; en de koning zei: Wat wilt u?","17":"En zij zei tegen hem: Mijn heer! U hebt bij de HEERE, uw God, uw dienstmaagd gezworen: Zeker, Salomo, uw zoon, zal na mij koning zijn, en hij zal op mijn troon zitten!","18":"En nu, zie, Adonia is koning; en nu, mijn heer koning, u weet het niet.","19":"En hij heeft ossen en gemest vee en schapen in overvloed geslacht, en alle zonen van de koning genodigd, en Abjathar, de priester, en Joab, de legeraanvoerder, maar uw knecht Salomo heeft hij niet genodigd.","20":"Maar u, mijn heer koning, de ogen van heel Israël zijn op u gericht, opdat u hun bekend zou maken wie op de troon van mijn heer de koning na hem zal zitten.","21":"Anders zal het gebeuren, als mijn heer de koning bij zijn vaderen te ruste is gegaan, dat ik en mijn zoon Salomo als zondaars beschouwd zullen worden.","22":"En zie, zij sprak nog met de koning, toen de profeet Nathan binnenkwam.","23":"En zij maakten dit aan de koning bekend en zeiden: Zie, de profeet Nathan is er; en hij kwam voor het aangezicht van de koning, en boog zich voor de koning met zijn gezicht ter aarde.","24":"En Nathan zei: Mijn heer koning! Hebt u gezegd: Adonia zal na mij koning zijn, en hij zal op mijn troon zitten?","25":"Want hij is vandaag afgegaan en heeft ossen geslacht, en gemest vee, en schapen in overvloed, en heeft alle zonen van de koning genodigd, en de aanvoerders van het leger, en Abjathar, de priester; en zie, zij eten en drinken voor zijn aangezicht, en zeggen: Leve de koning Adonia!","26":"Maar mij, die uw knecht ben, en Zadok, de priester, en Benaja, de zoon van Jojada, en Salomo, uw knecht, heeft hij niet genodigd.","27":"Is deze zaak door mijn heer de koning gebeurd? En hebt u uw knecht niet bekendgemaakt wie op de troon van mijn heer de koning na hem zou zitten?","28":"En de koning David antwoordde en zei: Roep mij Bathseba; en zij kwam voor het aangezicht van de koning, en stond voor het aangezicht van de koning.","29":"Toen zwoer de koning en zei: *Zo waarachtig als* de HEERE leeft, Die mijn ziel uit alle nood verlost heeft;","30":"Zeker, zoals ik u gezworen heb bij de HEERE, de God van Israël: Zeker zal uw zoon Salomo na mij koning zijn, en hij zal op mijn troon in mijn plaats zitten; zeker, zo zal ik het op deze dezelfde dag doen.","31":"Toen boog Bathseba met haar gezicht ter aarde, en boog zich neer voor de koning, en zei: Mijn heer de koning David leve in eeuwigheid!","32":"En de koning David zei: Roep mij Zadok, de priester, en Nathan, de profeet, en Benaja, de zoon van Jojada; en zij kwamen voor het aangezicht van de koning.","33":"En de koning zei tegen hen: Neem de knechten van uw heer met u mee, en laat mijn zoon Salomo rijden op de muilezelin die van mij is; en breng hem naar Gihon.","34":"En laat Zadok, de priester, met Nathan, de profeet, hem daar tot koning over Israël zalven. Daarna moet u op de bazuin blazen, en zeggen: Leve de koning Salomo!","35":"Dan moet u achter hem optrekken, en hij zal komen en op mijn troon zitten, en hij zal koning zijn in mijn plaats; want ik heb geboden dat hij een voorganger zal zijn over Israël en over Juda.","36":"Toen antwoordde Benaja, de zoon van Jojada, de koning, en zei: Amen; zo zegt ook de HEERE, de God van mijn heer de koning!","37":"Zoals de HEERE met mijn heer de koning geweest is, zo zij Hij met Salomo; en Hij make zijn troon groter dan de troon van mijn heer de koning David!","38":"Toen ging Zadok, de priester, met Nathan, de profeet, en Benaja, de zoon van Jojada, en de Krethi en de Plethi naar beneden, en zij lieten Salomo rijden op de muilezelin van de koning David, en geleidden hem naar Gihon.","39":"En Zadok, de priester, nam de oliehoorn uit de tent en zalfde Salomo; en zij bliezen op de bazuin, en al het volk zei: Leve de koning Salomo!","40":"En al het volk kwam achter hem aan omhoog, en het volk speelde op fluiten, en verblijdde zich met grote blijdschap, zodat de aarde van hun geluid barstte.","41":"En Adonia hoorde het, en alle genodigden die met hem waren, die net klaar waren met eten; ook hoorde Joab het geluid van de bazuinen, en zei: Waarom is er zo'n geroep in de stad, die in rep en roer is?","42":"Terwijl hij nog sprak, zie, kwam Jonathan, de zoon van Abjathar, de priester; en Adonia zei: Kom binnen, want u bent een dapper man, en zult goed nieuws brengen.","43":"En Jonathan antwoordde en zei tegen Adonia: Ja, maar onze heer, de koning David, heeft Salomo tot koning gemaakt.","44":"En de koning heeft met hem gezonden Zadok, de priester, en Nathan, de profeet, en Benaja, de zoon van Jojada, en de Krethi en de Plethi; en zij hebben hem laten rijden op de muilezelin van de koning.","45":"Daarbij hebben Zadok, de priester, en Nathan, de profeet, hem in Gihon tot koning gezalfd, en zijn van daar blij omhooggetrokken, zodat de stad in rep en roer is; dat is het geroep dat u gehoord hebt.","46":"En ook zit Salomo op de troon van het koninkrijk.","47":"Ook zijn de knechten van de koning gekomen om onze heer, de koning David, te zegenen, en zeiden: Uw God make de naam van Salomo beter dan uw naam, en make zijn troon groter dan uw troon; en de koning heeft zich neergebogen op het bed.","48":"Ja, ook heeft de koning aldus gezegd: Geprezen zij de HEERE, de God van Israël, Die vandaag gegeven heeft iemand die op mijn troon zit, terwijl mijn eigen ogen het gezien hebben!","49":"Toen schrokken alle genodigden die bij Adonia waren, en stonden op, en gingen ieder zijns weegs.","50":"Maar Adonia was bevreesd voor Salomo, en hij stond op, en ging heen, en greep de hoornen van het altaar vast.","51":"En men maakte aan Salomo bekend en zei: Zie, Adonia is bevreesd voor de koning Salomo, want zie, hij heeft de hoornen van het altaar gegrepen, en gezegd: Laat de koning Salomo mij vandaag zweren dat hij zijn knecht niet met het zwaard zal doden!","52":"En Salomo zei: Als hij een oprecht man zal zijn, zal er geen haar van hem op de aarde vallen; maar als er kwaad in hem gevonden wordt, zal hij sterven.","53":"En de koning Salomo zond heen, en zij lieten hem afgaan van het altaar; en hij kwam en boog zich neer voor de koning Salomo. En Salomo zei tegen hem: Ga naar uw huis."},"SV":{"1":"De koning David nu was oud, wel bedaagd; en zij dekten hem met klederen, doch hij kreeg gene warmte.","2":"Toen zeiden zijn knechten tot hem: Laat ze mijn heer den koning een jonge dochter, een maagd zoeken, die voor het aangezicht des konings sta, en hem koestere; en zij slape in uw schoot, dat mijn heer de koning warm worde.","3":"Zo zochten zij een schone jonge dochter in alle landpalen van Israël; en zij vonden Abisag, een Sunamietische, en brachten ze tot den koning.","4":"En de jonge dochter was bovenmate schoon, en koesterde den koning, en diende hem; doch den koning bekende ze niet.","5":"Adonia nu, de zoon van Haggith, verhief zich, zeggende: Ik zal koning zijn; en hij bereidde zich wagenen en ruiteren, en vijftig mannen, lopende voor zijn aangezicht.","6":"En zijn vader had hem niet bedroefd van zijn dagen, zeggende: Waarom hebt gij alzo gedaan? En ook was hij zeer schoon van gedaante, en *Haggith* had hem gebaard na Absalom.","7":"En zijn raadslagen waren met Joab, den zoon van Zeruja, en met Abjathar, den priester; die hielpen, volgende Adonia.","8":"Maar Zadok, de priester, en Benaja, de zoon van Jojada, en Nathan, de profeet, en Simeï, en Rei, en de helden, die David had, waren met Adonia niet.","9":"En Adonia slachtte schapen en runderen, en gemest vee bij den steen Zoheleth, die bij de fontein Rogel is; en noodde al zijn broederen, de zonen des konings, en alle mannen van Juda, des konings knechten.","10":"Maar Nathan, den profeet, en Benaja, en de helden, en Salomo, zijn broeder, noodde hij niet.","11":"Toen sprak Nathan tot Bathseba, de moeder van Salomo, zeggende: Hebt gij niet gehoord, dat Adonia, de zoon van Haggith, koning is? En onze heer David weet dat niet.","12":"Nu dan, kom, laat mij u toch een raad geven, dat gij uw ziel en de ziel van uw zoon Salomo redt.","13":"Ga heen, en treed in tot den koning David, en zeg tot hem: Hebt gij niet, mijn heer koning, uw dienstmaagd gezworen, zeggende: Voorzeker, uw zoon Salomo zal na mij koning zijn, en hij zal op mijn troon zitten! Waarom dan is Adonia koning?","14":"Zie, als gij daar nog met den koning spreken zult, zo zal ik na u inkomen, en zal uw woorden vervullen.","15":"En Bathseba ging in tot den koning in de binnenkamer; doch de koning was zeer oud, en Abisag, de Sunamietische, diende den koning.","16":"En Bathseba neigde het hoofd en boog zich neder voor den koning; en de koning zeide: Wat is u?","17":"En zij zeide tot hem: Mijn heer! gij hebt uw dienstmaagd bij den HEERE, uw God, gezworen: Voorzeker Salomo, uw zoon, zal na mij koning zijn, en hij zal op mijn troon zitten!","18":"En nu zie, Adonia is koning; en nu, mijn heer koning, gij weet het niet.","19":"En hij heeft ossen, en gemest vee, en schapen in menigte geslacht, en genood al de zonen des konings, en Abjathar, den priester, en Joab, den krijgsoverste, maar uw knecht Salomo heeft hij niet genood.","20":"Maar gij, mijn heer koning, de ogen van het ganse Israël zijn op u, dat gij hun zoudt te kennen geven, wie op den troon van mijn heer den koning na hem zitten zal.","21":"Anders zal het geschieden, als mijn heer de koning met zijn vaderen zal ontslapen zijn, dat ik en mijn zoon Salomo *als* zondaars zullen zijn.","22":"En ziet, zij sprak nog met den koning, als de profeet Nathan inkwam.","23":"En zij gaven den koning te kennen, zeggende: Zie, de profeet Nathan is daar; en hij kwam voor het aangezicht des konings, en boog zich voor den koning op zijn aangezicht ter aarde.","24":"En Nathan zeide: Mijn heer koning! hebt gij gezegd: Adonia zal na mij koning zijn, en hij zal op mijn troon zitten?","25":"Want hij is heden afgegaan, en heeft geslacht ossen, en gemest vee, en schapen in menigte, en heeft genood al de zonen des konings, en de oversten des heirs, en Abjathar, den priester; en zie, zij eten, en drinken voor zijn aangezicht, en zeggen: De koning Adonia leve!","26":"Maar mij, die uw knecht ben, en Zadok, den priester, en Benaja, den zoon van Jojada, en Salomo, uw knecht, heeft hij niet genood.","27":"Is deze zaak van mijn heer den koning geschied? En hebt gij uw knecht niet bekend gemaakt, wie op den troon van mijn heer den koning na hem zitten zou?","28":"En de koning David antwoordde en zeide: Roept mij Bathseba; en zij kwam voor het aangezicht des konings, en stond voor het aangezicht des konings.","29":"Toen zwoer de koning, en zeide: *Zo* *waarachtig* *als* de HEERE leeft, die mijn ziel uit allen nood verlost heeft;","30":"Voorzeker, gelijk als ik u gezworen heb bij den HEERE, den God Israëls, zeggende: Voorzeker zal uw zoon Salomo na mij koning zijn, en zal op mijn troon in mijn plaats zitten; voorzeker, alzo zal ik te dezen zelfden dage doen.","31":"Toen neigde zich Bathseba met het aangezicht ter aarde, en boog zich neder voor den koning, en zeide: Mijn heer de koning David leve in eeuwigheid!","32":"En de koning David zeide: Roep mij Zadok, den priester, en Nathan, den profeet, en Benaja, den zoon van Jojada; en zij kwamen voor het aangezicht des konings.","33":"En de koning zeide tot hen: Neemt met u de knechten uws heren, en doet mijn zoon Salomo rijden op de muilezelin, die voor mij is; en voert hem af naar Gihon.","34":"En dat Zadok, de priester, met Nathan, den profeet, hem aldaar tot koning over Israël zalven. Daarna zult gij met de bazuin blazen, en zeggen: De koning Salomo leve!","35":"Dan zult gij achter hem optrekken, en hij zal komen, en zal op mijn troon zitten, en hij zal koning zijn in mijn plaats; want ik heb geboden, dat hij een voorganger zou zijn over Israël en over Juda.","36":"Toen antwoordde Benaja, de zoon van Jojada, den koning, en zeide: Amen; alzo zegge de HEERE, de God van mijn heer den koning!","37":"Gelijk als de HEERE met mijn heer den koning geweest is, alzo zij Hij met Salomo; en Hij make zijn troon groter dan den troon van mijn heer den koning David!","38":"Toen ging Zadok, de priester, af, met Nathan, den profeet, en Benaja, den zoon van Jojada, en de Krethi en de Plethi, en zij deden Salomo rijden op de muilezelin van den koning David, en geleidden hem naar Gihon.","39":"En Zadok, de priester, nam den oliehoorn uit de tent, en zalfde Salomo; en zij bliezen met de bazuin, en al het volk zeide: De koning Salomo leve!","40":"En al het volk kwam op achter hem, en het volk pijpte met pijpen, en verblijdde zich met grote blijdschap, zodat de aarde van hun geluid spleet.","41":"En Adonia hoorde het, en al de genoden, die met hem waren, die nu geëindigd hadden te eten; ook hoorde Joab het geluid der bazuinen, en zeide: Waarom is het geroep dier stad, die in roer is?","42":"Als hij nog sprak, ziet, zo kwam Jonathan, de zoon van Abjathar, den priester; en Adonia zeide: Kom in, want gij zijt een kloek man, en zult het goede boodschappen.","43":"En Jonathan antwoordde en zeide tot Adonia: Ja, maar onze heer, de koning David, heeft Salomo tot koning gemaakt.","44":"En de koning heeft met hem gezonden Zadok, den priester, en Nathan, den profeet, en Benaja, den zoon van Jojada, en de Krethi en de Plethi; en zij hebben hem doen rijden op de muilezelin des konings.","45":"Daartoe hebben hem Zadok, de priester, en Nathan, de profeet, in Gihon tot koning gezalfd, en zijn van daar blijde opgetogen, zodat de stad in roer is; dat is het geroep, dat gij gehoord hebt.","46":"En ook zit Salomo op den troon des koninkrijks.","47":"Zo zijn ook de knechten des konings gekomen, om onzen heer, den koning David, te zegenen, zeggende: Uw God make den naam van Salomo beter dan uw naam, en make zijn troon groter dan uw troon; en de koning heeft aangebeden op de slaapstede.","48":"Ja, ook heeft de koning aldus gezegd: Geloofd zij de HEERE, de God Israëls, Die heden gegeven heeft een, zittende op mijn troon, dat het mijn ogen gezien hebben!","49":"Toen verschrikten en stonden op al de genoden, die bij Adonia waren, en gingen een iegelijk zijns weegs.","50":"Doch Adonia vreesde voor Salomo, en hij stond op, en ging heen, en vatte de hoornen des altaars.","51":"En men maakte Salomo bekend, zeggende: Zie, Adonia vreest den koning Salomo, want zie, hij heeft de hoornen des altaars gevat, zeggende: Dat de koning Salomo mij als heden zwere, dat hij zijn knecht met het zwaard niet doden zal!","52":"En Salomo zeide: Indien hij een vroom man zal zijn, daar zal niet van zijn haar op de aarde vallen; maar indien in hem kwaad bevonden zal worden, zo zal hij sterven.","53":"En de koning Salomo zond heen, en zij deden hem afgaan van het altaar; en hij kwam, en boog zich neder voor den koning Salomo. En Salomo zeide tot hem: Ga heen naar uw huis."},"KJV":{"1":"Now king David was old and stricken in years; and they covered him with clothes, but he gat no heat.","2":"Wherefore his servants said unto him, Let there be sought for my lord the king a young virgin: and let her stand before the king, and let her cherish him, and let her lie in thy bosom, that my lord the king may get heat.","3":"So they sought for a fair damsel throughout all the coasts of Israel, and found Abishag a Shunammite, and brought her to the king.","4":"And the damsel was very fair, and cherished the king, and ministered to him: but the king knew her not.","5":"Then Adonijah the son of Haggith exalted himself, saying, I will be king: and he prepared him chariots and horsemen, and fifty men to run before him.","6":"And his father had not displeased him at any time in saying, Why hast thou done so? and he also was a very goodly man; and his mother bare him after Absalom.","7":"And he conferred with Joab the son of Zeruiah, and with Abiathar the priest: and they following Adonijah helped him.","8":"But Zadok the priest, and Benaiah the son of Jehoiada, and Nathan the prophet, and Shimei, and Rei, and the mighty men which belonged to David, were not with Adonijah.","9":"And Adonijah slew sheep and oxen and fat cattle by the stone of Zoheleth, which is by Enrogel, and called all his brethren the king's sons, and all the men of Judah the king's servants:","10":"But Nathan the prophet, and Benaiah, and the mighty men, and Solomon his brother, he called not.","11":"Wherefore Nathan spake unto Bathsheba the mother of Solomon, saying, Hast thou not heard that Adonijah the son of Haggith doth reign, and David our lord knoweth it not?","12":"Now therefore come, let me, I pray thee, give thee counsel, that thou mayest save thine own life, and the life of thy son Solomon.","13":"Go and get thee in unto king David, and say unto him, Didst not thou, my lord, O king, swear unto thine handmaid, saying, Assuredly Solomon thy son shall reign after me, and he shall sit upon my throne? why then doth Adonijah reign?","14":"Behold, while thou yet talkest there with the king, I also will come in after thee, and confirm thy words.","15":"And Bathsheba went in unto the king into the chamber: and the king was very old; and Abishag the Shunammite ministered unto the king.","16":"And Bathsheba bowed, and did obeisance unto the king. And the king said, What wouldest thou?","17":"And she said unto him, My lord, thou swarest by the LORD thy God unto thine handmaid, saying, Assuredly Solomon thy son shall reign after me, and he shall sit upon my throne.","18":"And now, behold, Adonijah reigneth; and now, my lord the king, thou knowest it not:","19":"And he hath slain oxen and fat cattle and sheep in abundance, and hath called all the sons of the king, and Abiathar the priest, and Joab the captain of the host: but Solomon thy servant hath he not called.","20":"And thou, my lord, O king, the eyes of all Israel are upon thee, that thou shouldest tell them who shall sit on the throne of my lord the king after him.","21":"Otherwise it shall come to pass, when my lord the king shall sleep with his fathers, that I and my son Solomon shall be counted offenders.","22":"And, lo, while she yet talked with the king, Nathan the prophet also came in.","23":"And they told the king, saying, Behold Nathan the prophet. And when he was come in before the king, he bowed himself before the king with his face to the ground.","24":"And Nathan said, My lord, O king, hast thou said, Adonijah shall reign after me, and he shall sit upon my throne?","25":"For he is gone down this day, and hath slain oxen and fat cattle and sheep in abundance, and hath called all the king's sons, and the captains of the host, and Abiathar the priest; and, behold, they eat and drink before him, and say, God save king Adonijah.","26":"But me, even me thy servant, and Zadok the priest, and Benaiah the son of Jehoiada, and thy servant Solomon, hath he not called.","27":"Is this thing done by my lord the king, and thou hast not shewed it unto thy servant, who should sit on the throne of my lord the king after him?","28":"Then king David answered and said, Call me Bathsheba. And she came into the king's presence, and stood before the king.","29":"And the king sware, and said, As the LORD liveth, that hath redeemed my soul out of all distress,","30":"Even as I sware unto thee by the LORD God of Israel, saying, Assuredly Solomon thy son shall reign after me, and he shall sit upon my throne in my stead; even so will I certainly do this day.","31":"Then Bathsheba bowed with her face to the earth, and did reverence to the king, and said, Let my lord king David live for ever.","32":"And king David said, Call me Zadok the priest, and Nathan the prophet, and Benaiah the son of Jehoiada. And they came before the king.","33":"The king also said unto them, Take with you the servants of your lord, and cause Solomon my son to ride upon mine own mule, and bring him down to Gihon:","34":"And let Zadok the priest and Nathan the prophet anoint him there king over Israel: and blow ye with the trumpet, and say, God save king Solomon.","35":"Then ye shall come up after him, that he may come and sit upon my throne; for he shall be king in my stead: and I have appointed him to be ruler over Israel and over Judah.","36":"And Benaiah the son of Jehoiada answered the king, and said, Amen: the LORD God of my lord the king say so too.","37":"As the LORD hath been with my lord the king, even so be he with Solomon, and make ➔ his throne greater than the throne of my lord king David.","38":"So Zadok the priest, and Nathan the prophet, and Benaiah the son of Jehoiada, and the Cherethites, and the Pelethites, went down, and caused Solomon to ride upon king David's mule, and brought him to Gihon.","39":"And Zadok the priest took an horn of oil out of the tabernacle, and anointed Solomon. And they blew the trumpet; and all the people said, God save king Solomon.","40":"And all the people came up after him, and the people piped with pipes, and rejoiced with great joy, so that the earth rent with the sound of them.","41":"And Adonijah and all the guests that were with him heard it as they had made an end of eating. And when Joab heard the sound of the trumpet, he said, Wherefore is this noise of the city being in an uproar?","42":"And while he yet spake, behold, Jonathan the son of Abiathar the priest came: and Adonijah said unto him, Come in; for thou art a valiant man, and bringest ➔ good tidings.","43":"And Jonathan answered and said to Adonijah, Verily our lord king David hath made Solomon king.","44":"And the king hath sent with him Zadok the priest, and Nathan the prophet, and Benaiah the son of Jehoiada, and the Cherethites, and the Pelethites, and they have caused him to ride upon the king's mule:","45":"And Zadok the priest and Nathan the prophet have anointed him king in Gihon: and they are come up from thence rejoicing, so that the city rang again. This is the noise that ye have heard.","46":"And also Solomon sitteth on the throne of the kingdom.","47":"And moreover the king's servants came to bless our lord king David, saying, God make the name of Solomon better than thy name, and make ➔ his throne greater than thy throne. And the king bowed himself upon the bed.","48":"And also thus said the king, Blessed be the LORD God of Israel, which hath given one to sit on my throne this day, mine eyes even seeing it.","49":"And all the guests that were with Adonijah were afraid, and rose up, and went every man his way.","50":"And Adonijah feared because of Solomon, and arose, and went, and caught hold on the horns of the altar.","51":"And it was told Solomon, saying, Behold, Adonijah feareth king Solomon: for, lo, he hath caught hold on the horns of the altar, saying, Let king Solomon swear unto me to day that he will not slay his servant with the sword.","52":"And Solomon said, If he will shew himself a worthy man, there shall not an hair of him fall to the earth: but if wickedness shall be found in him, he shall die.","53":"So king Solomon sent, and they brought him down from the altar. And he came and bowed himself to king Solomon: and Solomon said unto him, Go to thine house."}},"tsk":{"1":[{"kopje":"oud","refs":["2 Sam 5:4","1 Kron 23:1","1 Kron 29:27","1 Kron 29:28","Ps 90:10"]},{"kopje":"en had veel jaren geleefd","refs":["Gen 18:11","Gen 24:1","Joz 23:1","Joz 23:2","Luk 1:7"]}],"2":[{"kopje":"een jonge dochter, een maagd","refs":["Deut 10:8","1 Sam 16:21","1 Sam 16:22","2 Kron 29:11"]},{"kopje":"slaapt","refs":["Gen 16:5","Deut 13:6","2 Sam 12:3","Micha 7:5"]},{"kopje":"warm wordt","refs":["Pred 4:11"]}],"3":[{"kopje":"Zo","refs":["Est 2:2","Est 2:4"]},{"kopje":"Abisag","refs":["1 Kon 2:17-25"]},{"kopje":"Sunamitische","refs":["Joz 19:18","1 Sam 28:4","2 Kon 4:8","2 Kon 4:25"]}],"4":[{"kopje":"had geen gemeenschap met haar","refs":["Matt 1:25"]}],"5":[{"kopje":"Adonia","refs":["2 Sam 3:4","1 Kron 3:2"]},{"kopje":"verhief zich","refs":["1 Kon 1:11","1 Kon 2:24","Ex 9:17","Spr 16:18","Spr 18:12","Luk 14:11","Luk 18:14"]},{"kopje":"Ik zal","refs":["Deut 17:15","Richt 9:2","1 Kron 22:5-11","1 Kron 28:5","1 Kron 29:1"]},{"kopje":"en hij","refs":["Deut 17:16","2 Sam 15:1","Jes 2:7"]}],"6":[{"kopje":"had hem nooit","refs":["1 Sam 3:13","Spr 22:15","Spr 23:13","Spr 23:14","Spr 29:15","Hebr 12:5","Hebr 12:6"]},{"kopje":"zeer","refs":["1 Sam 9:2","1 Sam 10:23","2 Sam 14:25"]},{"kopje":"had hem gebaard","refs":["2 Sam 3:3","2 Sam 3:4","1 Kron 3:2"]}],"7":[{"kopje":"En hij overlegde","refs":["2 Sam 15:12","Ps 2:2"]},{"kopje":"Joab","refs":["1 Kon 2:28","2 Sam 8:16","2 Sam  <span class=\"wl wl-kjv\" data-code=\"H7901\">lie</span> in thy <span class=\"wl wl-kjv\" data-code=\"H2436\">bosom,</span> that my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> may get <span class=\"wl wl-kjv\" data-code=\"H2552\">heat.</span>","3":"So they <span class=\"wl wl-kjv\" data-code=\"H1245\">sought</span> for a <span class=\"wl wl-kjv\" data-code=\"H3303\">fair</span> <span class=\"wl wl-kjv\" data-code=\"H5291\">damsel</span> throughout all the <span class=\"wl wl-kjv\" data-code=\"H1366\">coasts</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> <span class=\"wl wl-kjv\" data-code=\"H49\">Abishag</span> a <span class=\"wl wl-kjv\" data-code=\"H7767\">Shunammite,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> her to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span>","4":"And the <span class=\"wl wl-kjv\" data-code=\"H5291\">damsel</span> was <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H3303\">fair,</span> and <span class=\"wl wl-kjv\" data-code=\"H5532\">cherished</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> and <span class=\"wl wl-kjv\" data-code=\"H8334\">ministered</span> to him: but the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">knew</span> her not.","5":"Then <span class=\"wl wl-kjv\" data-code=\"H138\">Adonijah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H2294\">Haggith</span> <span class=\"wl wl-kjv\" data-code=\"H4984\">exalted</span> himself, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> I will be <span class=\"wl wl-kjv\" data-code=\"H4427\">king:</span> and he <span class=\"wl wl-kjv\" data-code=\"H6213\">prepared</span> him <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots</span> and <span class=\"wl wl-kjv\" data-code=\"H6571\">horsemen,</span> and <span class=\"wl wl-kjv\" data-code=\"H2572\">fifty</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> to <span class=\"wl wl-kjv\" data-code=\"H7323\">run</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him.","6":"And his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> had not <span class=\"wl wl-kjv\" data-code=\"H6087\">displeased</span> him at any <span class=\"wl wl-kjv\" data-code=\"H3117\">time</span> in <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Why hast thou done <span class=\"wl wl-kjv\" data-code=\"H6213\">so?</span> and he also was a <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">goodly</span> man; and his mother <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> him <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom.</span>","7":"And he <span class=\"wl wl-kjv\" data-code=\"H1697\">conferred</span> with <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H6870\">Zeruiah,</span> and with <span class=\"wl wl-kjv\" data-code=\"H54\">Abiathar</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest:</span> and they <span class=\"wl wl-kjv\" data-code=\"H310\">following</span> <span class=\"wl wl-kjv\" data-code=\"H138\">Adonijah</span> <span class=\"wl wl-kjv\" data-code=\"H5826\">helped</span> him.","8":"But <span class=\"wl wl-kjv\" data-code=\"H6659\">Zadok</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> and <span class=\"wl wl-kjv\" data-code=\"H1141\">Benaiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3077\">Jehoiada,</span> and <span class=\"wl wl-kjv\" data-code=\"H5416\">Nathan</span> the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet,</span> and <span class=\"wl wl-kjv\" data-code=\"H8096\">Shimei,</span> and <span class=\"wl wl-kjv\" data-code=\"H7472\">Rei,</span> and the mighty <span class=\"wl wl-kjv\" data-code=\"H1368\">men</span> which belonged to <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> were not with <span class=\"wl wl-kjv\" data-code=\"H138\">Adonijah.</span>","9":"And <span class=\"wl wl-kjv\" data-code=\"H138\">Adonijah</span> <span class=\"wl wl-kjv\" data-code=\"H2076\">slew</span> <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep</span> and <span class=\"wl wl-kjv\" data-code=\"H1241\">oxen</span> and fat <span class=\"wl wl-kjv\" data-code=\"H4806\">cattle</span> by the <span class=\"wl wl-kjv\" data-code=\"H68\">stone</span> of <span class=\"wl wl-kjv\" data-code=\"H2120\">Zoheleth,</span> which is <span class=\"wl wl-kjv\" data-code=\"H681\">by</span> <span class=\"wl wl-kjv\" data-code=\"H5883\">Enrogel,</span> and <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> all his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H5650\">servants:</span>","10":"But <span class=\"wl wl-kjv\" data-code=\"H5416\">Nathan</span> the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet,</span> and <span class=\"wl wl-kjv\" data-code=\"H1141\">Benaiah,</span> and the mighty <span class=\"wl wl-kjv\" data-code=\"H1368\">men,</span> and <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> his <span class=\"wl wl-kjv\" data-code=\"H251\">brother,</span> he <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> not.","11":"Wherefore <span class=\"wl wl-kjv\" data-code=\"H5416\">Nathan</span> <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> unto <span class=\"wl wl-kjv\" data-code=\"H1339\">Bathsheba</span> the <span class=\"wl wl-kjv\" data-code=\"H517\">mother</span> of <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Hast thou not <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> that <span class=\"wl wl-kjv\" data-code=\"H138\">Adonijah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H2294\">Haggith</span> doth <span class=\"wl wl-kjv\" data-code=\"H4427\">reign,</span> and <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> our <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">knoweth</span> it not?","12":"Now therefore <span class=\"wl wl-kjv\" data-code=\"H3212\">come,</span> let me, I pray thee, give thee <span class=\"wl wl-kjv\" data-code=\"H3289\">counsel,</span> that thou mayest <span class=\"wl wl-kjv\" data-code=\"H4422\">save</span> thine own <span class=\"wl wl-kjv\" data-code=\"H5315\">life,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5315\">life</span> of thy <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon.</span>","13":"<span class=\"wl wl-kjv\" data-code=\"H3212\">Go</span> and get thee <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> unto <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto him, Didst not thou, my <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> O <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> <span class=\"wl wl-kjv\" data-code=\"H7650\">swear</span> unto thine <span class=\"wl wl-kjv\" data-code=\"H519\">handmaid,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H3588\">Assuredly</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> thy <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> shall <span class=\"wl wl-kjv\" data-code=\"H4427\">reign</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> me, and he shall <span class=\"wl wl-kjv\" data-code=\"H3427\">sit</span> upon my <span class=\"wl wl-kjv\" data-code=\"H3678\">throne?</span> why then doth <span class=\"wl wl-kjv\" data-code=\"H138\">Adonijah</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">reign?</span>","14":"Behold, while thou yet <span class=\"wl wl-kjv\" data-code=\"H1696\">talkest</span> there with the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> I also will come <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> thee, and <span class=\"wl wl-kjv\" data-code=\"H4390\">confirm</span> thy <span class=\"wl wl-kjv\" data-code=\"H1697\">words.</span>","15":"And <span class=\"wl wl-kjv\" data-code=\"H1339\">Bathsheba</span> went <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> into the <span class=\"wl wl-kjv\" data-code=\"H2315\">chamber:</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> was <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H2204\">old;</span> and <span class=\"wl wl-kjv\" data-code=\"H49\">Abishag</span> the <span class=\"wl wl-kjv\" data-code=\"H7767\">Shunammite</span> <span class=\"wl wl-kjv\" data-code=\"H8334\">ministered</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span>","16":"And <span class=\"wl wl-kjv\" data-code=\"H1339\">Bathsheba</span> <span class=\"wl wl-kjv\" data-code=\"H6915\">bowed,</span> and did <span class=\"wl wl-kjv\" data-code=\"H7812\">obeisance</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span> And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> What wouldest thou?","17":"And she <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, My <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> thou <span class=\"wl wl-kjv\" data-code=\"H7650\">swarest</span> by the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> unto thine <span class=\"wl wl-kjv\" data-code=\"H519\">handmaid,</span> saying, Assuredly <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> thy <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> shall <span class=\"wl wl-kjv\" data-code=\"H4427\">reign</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> me, and he shall <span class=\"wl wl-kjv\" data-code=\"H3427\">sit</span> upon my <span class=\"wl wl-kjv\" data-code=\"H3678\">throne.</span>","18":"And now, behold, <span class=\"wl wl-kjv\" data-code=\"H138\">Adonijah</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">reigneth;</span> and now, my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> thou <span class=\"wl wl-kjv\" data-code=\"H3045\">knowest</span> it not:","19":"And he hath <span class=\"wl wl-kjv\" data-code=\"H2076\">slain</span> <span class=\"wl wl-kjv\" data-code=\"H7794\">oxen</span> and fat <span class=\"wl wl-kjv\" data-code=\"H4806\">cattle</span> and <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep</span> in <span class=\"wl wl-kjv\" data-code=\"H7230\">abundance,</span> and hath <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> all the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> and <span class=\"wl wl-kjv\" data-code=\"H54\">Abiathar</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> and <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> the <span class=\"wl wl-kjv\" data-code=\"H8269\">captain</span> of the <span class=\"wl wl-kjv\" data-code=\"H6635\">host:</span> but <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> hath he not <span class=\"wl wl-kjv\" data-code=\"H7121\">called.</span>","20":"And thou, my <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> O <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> the <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> of all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> are upon thee, that thou shouldest <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> them who shall <span class=\"wl wl-kjv\" data-code=\"H3427\">sit</span> on the <span class=\"wl wl-kjv\" data-code=\"H3678\">throne</span> of my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> him.","21":"Otherwise it shall come to pass, when my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> shall <span class=\"wl wl-kjv\" data-code=\"H7901\">sleep</span> with his <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> that I and my <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> shall be counted <span class=\"wl wl-kjv\" data-code=\"H2400\">offenders.</span>","22":"And, lo, while she yet <span class=\"wl wl-kjv\" data-code=\"H1696\">talked</span> with the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> <span class=\"wl wl-kjv\" data-code=\"H5416\">Nathan</span> the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> also came <span class=\"wl wl-kjv\" data-code=\"H935\">in.</span>","23":"And they <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Behold <span class=\"wl wl-kjv\" data-code=\"H5416\">Nathan</span> the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet.</span> And when he was come <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> he <span class=\"wl wl-kjv\" data-code=\"H7812\">bowed</span> himself before the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> with his <span class=\"wl wl-kjv\" data-code=\"H639\">face</span> to the <span class=\"wl wl-kjv\" data-code=\"H776\">ground.</span>","24":"And <span class=\"wl wl-kjv\" data-code=\"H5416\">Nathan</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> My <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> O <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> hast thou <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H138\">Adonijah</span> shall <span class=\"wl wl-kjv\" data-code=\"H4427\">reign</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> me, and he shall <span class=\"wl wl-kjv\" data-code=\"H3427\">sit</span> upon my <span class=\"wl wl-kjv\" data-code=\"H3678\">throne?</span>","25":"For he is gone <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> and hath <span class=\"wl wl-kjv\" data-code=\"H2076\">slain</span> <span class=\"wl wl-kjv\" data-code=\"H7794\">oxen</span> and fat <span class=\"wl wl-kjv\" data-code=\"H4806\">cattle</span> and <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep</span> in <span class=\"wl wl-kjv\" data-code=\"H7230\">abundance,</span> and hath <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> all the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8269\">captains</span> of the <span class=\"wl wl-kjv\" data-code=\"H6635\">host,</span> and <span class=\"wl wl-kjv\" data-code=\"H54\">Abiathar</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest;</span> and, behold, they <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> and <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him, and <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> God <span class=\"wl wl-kjv\" data-code=\"H2421\">save</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H138\">Adonijah.</span>","26":"But me, even me thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant,</span> and <span class=\"wl wl-kjv\" data-code=\"H6659\">Zadok</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> and <span class=\"wl wl-kjv\" data-code=\"H1141\">Benaiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3077\">Jehoiada,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon,</span> hath he not <span class=\"wl wl-kjv\" data-code=\"H7121\">called.</span>","27":"Is this <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> <span class=\"wl wl-kjv\" data-code=\"H1961\">done</span> by my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> and thou hast not <span class=\"wl wl-kjv\" data-code=\"H3045\">shewed</span> it unto thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant,</span> who should <span class=\"wl wl-kjv\" data-code=\"H3427\">sit</span> on the <span class=\"wl wl-kjv\" data-code=\"H3678\">throne</span> of my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> him?","28":"Then <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">Call</span> me <span class=\"wl wl-kjv\" data-code=\"H1339\">Bathsheba.</span> And she <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> into the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">presence,</span> and <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span>","29":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H7650\">sware,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> As the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> that hath <span class=\"wl wl-kjv\" data-code=\"H6299\">redeemed</span> my <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> out of all <span class=\"wl wl-kjv\" data-code=\"H6869\">distress,</span>","30":"Even as I <span class=\"wl wl-kjv\" data-code=\"H7650\">sware</span> unto thee by the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Assuredly <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> thy <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> shall <span class=\"wl wl-kjv\" data-code=\"H4427\">reign</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> me, and he shall <span class=\"wl wl-kjv\" data-code=\"H3427\">sit</span> upon my <span class=\"wl wl-kjv\" data-code=\"H3678\">throne</span> in my stead; even so will I certainly <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day.</span>","31":"Then <span class=\"wl wl-kjv\" data-code=\"H1339\">Bathsheba</span> <span class=\"wl wl-kjv\" data-code=\"H6915\">bowed</span> with her <span class=\"wl wl-kjv\" data-code=\"H639\">face</span> to the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> and did <span class=\"wl wl-kjv\" data-code=\"H7812\">reverence</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Let my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H2421\">live</span> for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever.</span>","32":"And <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">Call</span> me <span class=\"wl wl-kjv\" data-code=\"H6659\">Zadok</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> and <span class=\"wl wl-kjv\" data-code=\"H5416\">Nathan</span> the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet,</span> and <span class=\"wl wl-kjv\" data-code=\"H1141\">Benaiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3077\">Jehoiada.</span> And they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span>","33":"The <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> also <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, <span class=\"wl wl-kjv\" data-code=\"H3947\">Take</span> with you the <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> of your <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> and cause <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> my <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> to <span class=\"wl wl-kjv\" data-code=\"H7392\">ride</span> upon mine own <span class=\"wl wl-kjv\" data-code=\"H6506\">mule,</span> and bring him <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to <span class=\"wl wl-kjv\" data-code=\"H1521\">Gihon:</span>","34":"And let <span class=\"wl wl-kjv\" data-code=\"H6659\">Zadok</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> and <span class=\"wl wl-kjv\" data-code=\"H5416\">Nathan</span> the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> <span class=\"wl wl-kjv\" data-code=\"H4886\">anoint</span> him there <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> over <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> and <span class=\"wl wl-kjv\" data-code=\"H8628\">blow</span> ye with the <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpet,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> God <span class=\"wl wl-kjv\" data-code=\"H2421\">save</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon.</span>","35":"Then ye shall come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> him, that he may <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">sit</span> upon my <span class=\"wl wl-kjv\" data-code=\"H3678\">throne;</span> for he shall be <span class=\"wl wl-kjv\" data-code=\"H4427\">king</span> in my stead: and I have <span class=\"wl wl-kjv\" data-code=\"H6680\">appointed</span> him to be <span class=\"wl wl-kjv\" data-code=\"H5057\">ruler</span> over <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> and over <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah.</span>","36":"And <span class=\"wl wl-kjv\" data-code=\"H1141\">Benaiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3077\">Jehoiada</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H543\">Amen:</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> so too.","37":"As the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath been with my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> even so be he with <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon,</span> and <span class=\"wl wl-kjv\" data-code=\"H1431\">make</span> ➔ his <span class=\"wl wl-kjv\" data-code=\"H3678\">throne</span> <span class=\"wl wl-kjv\" data-code=\"H1431\">greater</span> than the <span class=\"wl wl-kjv\" data-code=\"H3678\">throne</span> of my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David.</span>","38":"So <span class=\"wl wl-kjv\" data-code=\"H6659\">Zadok</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> and <span class=\"wl wl-kjv\" data-code=\"H5416\">Nathan</span> the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet,</span> and <span class=\"wl wl-kjv\" data-code=\"H1141\">Benaiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3077\">Jehoiada,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3774\">Cherethites,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6432\">Pelethites,</span> went <span class=\"wl wl-kjv\" data-code=\"H3381\">down,</span> and caused <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> to <span class=\"wl wl-kjv\" data-code=\"H7392\">ride</span> upon <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David's</span> <span class=\"wl wl-kjv\" data-code=\"H6506\">mule,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">brought</span> him to <span class=\"wl wl-kjv\" data-code=\"H1521\">Gihon.</span>","39":"And <span class=\"wl wl-kjv\" data-code=\"H6659\">Zadok</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> an <span class=\"wl wl-kjv\" data-code=\"H7161\">horn</span> of <span class=\"wl wl-kjv\" data-code=\"H8081\">oil</span> out of the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle,</span> and <span class=\"wl wl-kjv\" data-code=\"H4886\">anointed</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon.</span> And they <span class=\"wl wl-kjv\" data-code=\"H8628\">blew</span> the <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpet;</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> God <span class=\"wl wl-kjv\" data-code=\"H2421\">save</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon.</span>","40":"And all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> came <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> him, and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H2490\">piped</span> with <span class=\"wl wl-kjv\" data-code=\"H2485\">pipes,</span> and <span class=\"wl wl-kjv\" data-code=\"H8056\">rejoiced</span> with <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H8057\">joy,</span> so that the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> <span class=\"wl wl-kjv\" data-code=\"H1234\">rent</span> with the <span class=\"wl wl-kjv\" data-code=\"H6963\">sound</span> of them.","41":"And <span class=\"wl wl-kjv\" data-code=\"H138\">Adonijah</span> and all the <span class=\"wl wl-kjv\" data-code=\"H7121\">guests</span> that were with him <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> it as they had made an <span class=\"wl wl-kjv\" data-code=\"H3615\">end</span> of <span class=\"wl wl-kjv\" data-code=\"H398\">eating.</span> And when <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> the <span class=\"wl wl-kjv\" data-code=\"H6963\">sound</span> of the <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpet,</span> he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Wherefore is this <span class=\"wl wl-kjv\" data-code=\"H6963\">noise</span> of the <span class=\"wl wl-kjv\" data-code=\"H7151\">city</span> being in an <span class=\"wl wl-kjv\" data-code=\"H1993\">uproar?</span>","42":"And while he yet <span class=\"wl wl-kjv\" data-code=\"H1696\">spake,</span> behold, <span class=\"wl wl-kjv\" data-code=\"H3129\">Jonathan</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H54\">Abiathar</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came:</span> and <span class=\"wl wl-kjv\" data-code=\"H138\">Adonijah</s /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
