g gebeurde toen Cyrenius over Syrië stadhouder was. En zij gingen allen om ingeschreven te worden, ieder naar zijn eigen stad.","1 Sam 9:15-20":"Want de HEERE had het aan Samuël geopenbaard, een dag voordat Saul kwam, en had gezegd: Morgen omstreeks deze tijd zal Ik naar u een man sturen uit het land van Benjamin, die zult u tot voorganger zalven over Mijn volk Israël; en hij zal Mijn volk verlossen uit de hand van de Filistijnen, want Ik heb naar Mijn volk omgezien, omdat hun geroep tot Mij gekomen is. Toen Samuel Saul zag, antwoordde de HEERE hem: Zie, dit is de man, van wie Ik u gezegd heb: Deze zal over Mijn volk heersen.","2 Kron 21:1":"Daarna stierf Josafat en werd bij zijn voorouders begraven, in de stad van David; en zijn zoon Joram werd koning in zijn plaats.","Luk 19:42":"en zei: Och, had u ook maar geweten, ook nog op deze dag van u, wat tot uw vrede dient! Maar nu is het verborgen voor uw ogen.","1 Kon 14:29":"Het overige nu van de geschiedenis van Rehabeam, en alles wat hij gedaan heeft, staat dat niet geschreven in het boek van de kronieken van de koningen van Juda?","Amos 3:7":"Zeker, de Heere HEERE zal niets doen, tenzij Hij Zijn verborgenheid aan Zijn dienaren, de profeten, geopenbaard heeft.","Hab 1:2-4":"HEERE! Hoe lang schreeuw ik, en U hoort niet, hoe lang roep ik: Geweld! tot U, en U verlost niet! Waarom laat U mij ongerechtigheid zien, en aanschouwt U de kwelling? Want verwoesting en geweld is tegen mij, en er is twist, en men neemt gekijf op. Daarom wordt de wet losgelaten, en het recht komt nooit meer voort; want de goddeloze omringt de rechtvaardige; daarom komt het recht verdraaid voort.","Hab 3:16":"Toen ik het hoorde, werd mijn buik beroerd; voor de stem hebben mijn lippen gebeefd; verrotting kwam in mijn beenderen, en ik werd beroerd op mijn plaats. Zeker, ik zal rusten op de dag van de benauwdheid, wanneer hij zal optrekken tegen het volk, om het met troepen aan te vallen.","1 Kon 22:30-36":"En de koning van Israël zei tegen Josafat: Ik zal mij vermommen en dan in de strijd komen; maar u, trek uw kleren aan. Zo vermomde de koning van Israël zich, en kwam in de strijd. De koning van Syrië nu had zijn tweeëndertig aanvoerders van de wagens geboden en gezegd: U zult niet vechten tegen klein of groot, maar alleen tegen de koning van Israël. Het gebeurde dan, toen de aanvoerders van de wagens Josafat zagen, dat zij zeiden: Zeker, dat is de koning van Israël; en zij keerden zich naar hem toe om te strijden; maar Josafat riep het uit.","Spr 15:12":"De spotter zal hem die hem bestraft niet liefhebben; hij zal niet naar de wijzen gaan.","1 Kon 16:31":"En het gebeurde (was het een lichte zaak dat hij wandelde in de zonden van Jerobeam, de zoon van Nebat?), dat hij ook nog Izebel, de dochter van Eth-baal, de koning van de Sidoniërs, tot vrouw nam, en heenging, en Baäl diende, en zich voor hem neerboog.","Num 31:8":"Daarbij doodden zij, behalve hun overige gesneuvelden, de koningen van de Midianieten: Evi, en Rekem, en Zur, en Hur, en Reba, vijf koningen van de Midianieten; ook doodden zij met het zwaard Bileam, de zoon van Beor.","Matt 27:42":"Anderen heeft Hij verlost, Zichzelf kan Hij niet verlossen. Als Hij de Koning van Israël is, laat Hij nu van het kruis afkomen, en wij zullen Hem geloven.","Jer 23:2":"Daarom zegt de HEERE, de God van Israël, zo van de herders, die Mijn volk weiden: U hebt Mijn schapen verstrooid, en hebt ze verdreven, en hebt niet naar hen omgezien; zie, Ik zal over u de boosheid van uw handelingen bezoeken, spreekt de HEERE.","2 Kon 1:12":"En Elia antwoordde en sprak tot hem: Ben ik een man van God, laat er dan vuur uit de hemel neerdalen, dat u en uw vijftigtal verteert. Toen daalde het vuur van God uit de hemel neer en verteerde hem en zijn vijftigtal.","Jer 16:1":"En het woord van de HEERE kwam tot mij, en Hij zei:","Hand 23:8":"Want de Sadduceeën zeggen dat er geen opstanding is, en ook geen engel of geest; maar de Farizeeën belijden het beide.","Jer 14:14":"En de HEERE zei tegen mij: Die profeten profeteren vals in Mijn Naam; Ik heb hen niet gezonden, hun ook geen bevel gegeven, noch tot hen gesproken; zij profeteren u een vals gezicht, en waarzeggerij, en nietigheid, en bedrog van hun hart.","Job 36:23":"Wie heeft Hem gesteld over Zijn weg? Of wie heeft gezegd: U hebt onrecht gedaan?","Matt 24:24":"Want er zullen valse christussen en valse profeten opstaan, en zij zullen grote tekenen en wonderen doen, zodat zij, als het mogelijk was, ook de uitverkorenen zouden misleiden.","2 Kron 18:6":"Maar Josafat zei: Is hier niet nog een profeet van de HEERE, zodat wij hem konden raadplegen?","Ezech 22:28":"Haar profeten nu pleisteren hen met loze kalk; zij zien ijdelheid en voorzeggen hun leugen, en zeggen: Zo zegt de Heere HEERE! terwijl de HEERE niet gesproken heeft.","2 Kron 21:6":"En hij ging de weg van de koningen van Israël, zoals het huis van Achab deed; want hij had de dochter van Achab tot vrouw; en hij deed wat slecht was in de ogen van de HEERE.","Hand 8:35":"En Filippus deed zijn mond open en begon vanaf datzelfde Schriftgedeelte, en verkondigde hem Jezus.","2 Kor 2:17":"Want wij verkopen niet, zoals velen, het Woord van God, maar wij spreken het in Christus als uit oprechtheid, als uit God, in de tegenwoordigheid van God.","Ex 6:12":"Evenwel sprak de HEERE tot Mozes en tot Aäron, en gaf hun bevel aan de kinderen van Israël, en aan Farao, de koning van Egypte, om de kinderen van Israël uit Egypteland te leiden.","Ps 14:1":"Een psalm van David, voor de koorleider. De dwaas zegt in zijn hart: Er is geen God. Zij verderven het, zij maken het gruwelijk met hun werk; er is niemand die goed doet.","Openb 12:10":"En ik hoorde een grote stem, die zei in de hemel: Nu is de zaligheid, en de kracht, en het koninkrijk van onze God gekomen; en de macht van Zijn Christus; want de aanklager van onze broeders, die hen aanklaagde voor onze God dag en nacht, is neergeworpen.","Jer 37:7-10":"Zo zegt de HEERE, de God van Israël: Zo zult u zeggen tegen de koning van Juda, die u naar Mij gestuurd heeft om Mij te raadplegen: Zie, het leger van Farao, dat u ter hulp is uitgetrokken, zal terugkeren naar zijn land, naar Egypte; En de Chaldeeën zullen terugkeren en tegen deze stad strijden; en zij zullen haar innemen en met vuur verbranden. Zo zegt de HEERE: Bedrieg uzelf niet door te zeggen: De Chaldeeën zullen zeker van ons wegtrekken; want zij zullen niet wegtrekken.","Ezech 9:9":"Toen zei Hij tot mij: De ongerechtigheid van het huis van Israël en van Juda is heel erg groot, en het land is met bloed vervuld, en de stad is vol van afwijking; want zij zeggen: De HEERE heeft het land verlaten, en de HEERE ziet niet.","Jer 18:18":"Toen zeiden zij: Kom, laten wij gedachten tegen Jeremia denken; want de wet zal niet vergaan van de priester, evenmin de raad van de wijze, of het woord van de profeet; kom, laten wij hem slaan met de tong, en laten wij niet luisteren naar enig van zijn woorden!","2 Kron 18:25-27":"De koning van Israël nu zei: Neem Micha, en breng hem terug naar Amon, de leider van de stad, en naar Joas, de zoon van de koning; En u zult zeggen: Zo zegt de koning: Zet deze man in de gevangenis, en geef hem brood en water van ellende te eten, totdat ik met vrede terugkom. En Micha zei: Als u werkelijk met vrede terugkomt, dan heeft de HEERE niet door mij gesproken. Verder zei hij: Hoor, alle volken!","2 Kon 14:12":"En Juda werd verslagen voor Israël, en zij vluchtten, ieder naar zijn tent.","2 Kron 20:35-37":"Doch hierna verbond Josafat, de koning van Juda, zich met Ahazia, de koning van Israël; die handelde goddeloos in wat hij deed. En hij verbond zich met hem om schepen te maken, om naar Tharsis te gaan; en zij maakten de schepen in Ezeon-Geber. Maar Eliëzer, de zoon van Dodava, uit Maresa, profeteerde tegen Josafat en zei: Omdat u zich met Ahazia verbonden hebt, heeft de HEERE uw werken verscheurd. Zo werden de schepen verbroken, zodat zij niet naar Tharsis konden gaan.","Fil 2:22":"En u kent zijn beproefdheid, dat hij, zoals een kind zijn vader dient, met mij gediend heeft in het Evangelie.","Deut 16:3":"U zult daarbij niets eten van het gedesemd; zeven dagen zult u daarbij ongezuurde broden eten, brood van de ellende (want u bent in haast uit Egypteland getrokken), opdat u gedenkt aan de dag van uw uittrekken uit Egypteland, alle dagen van uw leven.","1 Kon 19:10":"En hij zei: Ik heb mij zeer sterk ingezet voor de HEERE, de God van de heerscharen; want de Israëlieten hebben Uw verbond verlaten, Uw altaren afgebroken en Uw profeten met het zwaard gedood; en ik alleen ben overgebleven, en zij zoeken mij te doden.","Deut 9:18":"En ik wierp mij neer voor het aangezicht van de HEERE, zoals de eerste keer, veertig dagen en veertig nachten; ik at geen brood, en dronk geen water; om al uw zonde, die u had gezondigd door te doen wat kwaad is in de ogen van de HEERE, om Hem tot toorn te verwekken.","Num 23:26":"Maar Bileam antwoordde en zei tegen Balak: Heb ik u niet gezegd: Alles wat de HEERE zal spreken, dat zal ik doen?","Jer 2:1":"En het woord van de HEERE gebeurde tot mij, en Hij zei:","Jes 10:15":"Zal een bijl zich beroemen tegen hem die daarmee houwt? Zal een zaag pochen tegen hem die ze trekt? Alsof een staf beweegt wie hem opheffen? Als men een stok opheft, is het geen hout?","2 Kron 35:22":"Doch Josia keerde zijn aangezicht niet van hem; maar hij vermomde zich, om tegen hem te strijden, en hoorde niet naar de woorden van Necho uit de mond van God; maar hij kwam om te strijden in het dal Megiddo.","Matt 12:40":"Want zoals Jona drie dagen en drie nachten in de buik van de walvis was, zo zal de Zoon des mensen drie dagen en drie nachten in het hart van de aarde zijn.","Ex 4:15":"U dan zult tot hem spreken, en de woorden in zijn mond leggen; en Ik zal met uw mond, en met zijn mond zijn; en Ik zal u leren, wat u doen zult.","Matt 4:5-7":"Toen nam de duivel Hem mee naar de heilige stad, en zette Hem op de tinne van de tempel, en zei tegen Hem: Als U Gods Zoon bent, werp Uzelf naar beneden; want er is geschreven dat Hij Zijn engelen bevelen zal U te beschermen, en dat zij U op de handen zullen dragen, opdat U niet op enig moment Uw voet aan een steen stoot. Jezus zei tegen hem: Er is ook geschreven: U zult de Heere, uw God, niet beproeven.","2 Kron 18:3":"Want Achab, de koning van Israël, zei tegen Josafat, de koning van Juda: Zult u met mij meegaan naar Ramoth in Gilead? En hij zei tegen hem: Ik zal zijn zoals u bent, en zoals uw volk is, zo zal mijn volk zijn, en wij zullen met u zijn in deze strijd.","Hand 23:2":"Maar de hogepriester Ananias beval hun die bij hem stonden dat zij hem op de mond zouden slaan.","Job 22:17":"Die tegen God zeiden: Wijk van ons! En wat zou de Almachtige voor hen kunnen doen?","Spr 3:5":"Vertrouw op de HEERE met heel uw hart, en steun op uw eigen verstand niet.","1 Kor 6:9":"Of weet u niet, dat de onrechtvaardigen het Koninkrijk van God niet zullen beërven?","Job 36:14":"Hun ziel zal in de jeugd sterven, en hun leven onder de schandjongens.","Ex 4:27":"De HEERE zei ook tegen Aäron: Ga Mozes tegemoet in de woestijn. En hij ging, en ontmoette hem bij de berg van God, en kuste hem.","Ps 7:14":"En heeft dodelijke wapens voor hem gereedgemaakt; Hij zal Zijn pijlen tegen de felle vervolgers inzetten.","2 Kon 3:2":"En hij deed wat kwaad was in de ogen van de HEERE, doch niet zoals zijn vader en zoals zijn moeder; want hij deed het opgerichte beeld van Baäl weg, dat zijn vader gemaakt had.","Deut 6:16":"U zult de HEERE, uw God, niet beproeven, zoals u Hem beproefd hebt te Massa.","Matt 13:24":"Een andere gelijkenis heeft Hij hun voorgehouden en zei: Het Koninkrijk der hemelen is gelijk aan een mens die goed zaad zaaide in zijn akker.","Ef 4:32":"Maar wees jegens elkaar goedertieren, barmhartig, en vergeef elkaar, zoals ook God in Christus u vergeven heeft.","Gen 25:23":"En de HEERE zei tegen haar: Twee volken zijn in uw buik, en twee naties zullen zich uit uw ingewand van elkaar scheiden; en het ene volk zal sterker zijn dan het andere volk; en de oudste zal de jongste dienen.","Dan 9:1-22":"In het eerste jaar van Darius, de zoon van Ahasveros, uit het nageslacht van de Meden, die koning gemaakt was over het koninkrijk van de Chaldeeën; in het eerste jaar van zijn regering, merkte ik, Daniël, in de boeken dat het getal van de jaren waarover het woord van de HEERE tot de profeet Jeremia gekomen was, in het vervullen van de verwoestingen van Jeruzalem, zeventig jaren was. En ik richtte mijn gezicht tot God, de HEERE, om Hem te zoeken met gebed en smekingen, met vasten, en een zak, en as.","Jes 30:11":"Wijkt af van de weg, maakt u van het pad; laat de Heilige van Israël van ons ophouden!","Spr 24:9":"De gedachte van de dwaasheid is zonde; en een spotter is de mensen een gruwel.","Lev 20:16":"Zo ook, wanneer een vrouw tot enig dier nadert, om daarmee gemeenschap te hebben, zult u die vrouw en dat dier doden; zij zullen zeker gedood worden; hun bloed is op hen!","Hand 11:26":"en toen hij hem gevonden had, bracht hij hem naar Antiochië. En het gebeurde dat zij een heel jaar samenkwamen in de gemeente en een grote menigte onderwezen; en dat de discipelen voor het eerst in Antiochië Christenen genoemd werden.","Jes 28:17-22":"En Ik zal het oordeel stellen naar het richtsnoer, en de gerechtigheid naar het paslood; en de hagel zal de toevlucht van de leugen wegvagen, en het water zal de schuilplaats overstromen. En uw verbond met de dood zal teniet gedaan worden, en uw voorzichtig verdrag met het rijk van de dood zal niet standhouden; wanneer de overstromende gesel doortrekt, dan zult u erdoor vertrapt worden. Vanaf de tijd dat hij doortrekt, zal hij u wegnemen, want elke morgen zal hij doortrekken, bij dag en bij nacht; en het zal gebeuren, dat louter het verstaan van het gerucht een verschrikking zal zijn.","Jer 26:12":"Maar Jeremia sprak tot al de vorsten en tot al het volk, en zei: De HEERE heeft mij gezonden, om tegen dit huis en tegen deze stad te profeteren al de woorden die u gehoord hebt;","2 Kor 5:9":"Daarom stellen wij er ook alles aan, hetzij wij thuis zijn, hetzij afwezig, om Hem welgevallig te zijn.","Ex 7:2":"U zult alles spreken wat Ik u gebieden zal; en Aäron, uw broer, zal tegen Farao spreken, dat hij de kinderen van Israël uit zijn land laat trekken.","Num 23:12":"Hij antwoordde en zei: Moet ik er niet op letten te spreken wat de HEERE in mijn mond gelegd heeft?","Hand 3:18":"Maar God heeft zo vervuld wat Hij door de mond van al Zijn profeten van tevoren had verkondigd, dat de Christus zou lijden.","Zach 10:2":"Want de terafim² spreken onwaarheid, en de waarzeggers zien bedrog, en zij spreken loze dromen, zij troosten met leegte; daarom zijn zij weggetrokken als schapen, zij zijn onderdrukt geworden, want er was geen herder.","2 Sam 5:23":"En David vroeg de HEERE, Die zei: U zult niet optrekken; maar trek om, tot achter hen, zodat u bij hen komt van tegenover de moerbeibomen;","2 Kon 3:11-19":"En Josafat zei: Is hier geen profeet van de HEERE, zodat wij door hem de HEERE kunnen raadplegen? Toen antwoordde een van de dienaren van de koning van Israël, en zei: Hier is Elisa, de zoon van Safat, die water op Elia's handen goot. En Josafat zei: Het woord van de HEERE is bij hem. Zo trokken naar hem toe de koning van Israël, en Josafat, en de koning van Edom. Maar Elisa zei tegen de koning van Israël: Wat heb ik met u te doen? Ga naar de profeten van uw vader, en naar de profeten van uw moeder. Doch de koning van Israël zei tegen hem: Nee, want de HEERE heeft deze drie koningen bij elkaar geroepen, om hen in de hand van de Moabieten te geven.","Judas 1:7":"Zoals Sodom en Gomorra, en de steden daaromheen, die op vergelijkbare wijze als deze gehoereerd hebben, en ander vlees zijn nagegaan, tot een voorbeeld voorgesteld zijn, en de straf van het eeuwige vuur dragen.","1 Sam 30:2":"en dat zij de vrouwen die daarin waren, gevangen hadden weggevoerd; maar zij hadden niemand doodgeslagen, van de kleinste tot de grootste, maar hadden hen weggevoerd en waren hun weegs gegaan.","Jona 3:2":"Maak u op, ga naar de grote stad Nineve, en predik tegen haar de prediking, die Ik tot u spreek.","Jer 5:12":"Zij verloochenen de HEERE, en zeggen: Hij is het niet, en ons zal geen kwaad overkomen, wij zullen geen zwaard en geen honger zien.","Jer 7:31":"En zij hebben de hoogten van Tofeth gebouwd, dat in het dal van de zoon van Hinnom is, om hun zonen en hun dochters met vuur te verbranden; wat Ik niet heb geboden, en wat niet in Mijn hart is opgekomen.","Jer 26:1":"In het begin van het koningschap van Jojakim, de zoon van Josia, koning van Juda, kwam dit woord van de HEERE, en Hij zei:","Openb 2:26":"En wie overwint, en Mijn werken tot het einde toe bewaart, hem zal Ik macht geven over de heidenen;","2 Kron 18:16-22":"En hij zei: Ik zag heel Israël verstrooid op de bergen, als schapen die geen herder hebben; en de HEERE zei: Dezen hebben geen heer; ieder keert terug naar zijn huis in vrede. Toen zei de koning van Israël tegen Josafat: Heb ik u niet gezegd: Hij zal over mij niets goeds, maar kwaad profeteren? Verder zei hij: Daarom, hoor het woord van de HEERE: Ik zag de HEERE zitten op Zijn troon, en heel het hemelse leger staande aan Zijn rechterhand en Zijn linkerhand.","Spr 19:29":"Gerichten zijn voor de spotters bereid, en slagen voor de rug van de dwazen.","Mark 7:14-16":"En Hij riep de hele menigte tot Zich, en zei tegen hen: Hoor Mij allen, en versta. Er is niets van buiten de mens dat in hem ingaat, dat hem kan verontreinigen; maar de dingen die van hem uitgaan, die zijn het die de mens verontreinigen. Als iemand oren heeft om te horen, laat hij horen.","1 Sam 12:20":"Toen zei Samuël tegen het volk: Vrees niet, u hebt al dit kwaad gedaan; maar wijk niet af van achter de HEERE, maar dien de HEERE met uw hele hart.","Rom 9:21":"Of heeft de pottenbakker geen macht over het leem, om uit dezelfde klomp het ene vat tot eer te maken, en het andere tot oneer?","Num 15:31":"Want zij heeft het woord van de HEERE veracht en Zijn gebod vernietigd; die ziel zal helemaal uitgeroeid worden; haar ongerechtigheid is op haar.","Jer 32:2":"(Het leger van de koning van Babel belegerde toen Jeruzalem, en de profeet Jeremia zat opgesloten in het voorhof van de bewaking, dat bij het huis van de koning van Juda is.","1 Kon 16:5":"Het overige nu van de geschiedenis van Baësa, en wat hij gedaan heeft, en zijn macht, is dat niet geschreven in het boek van de kronieken van de koningen van Israël?","Ps 1:1":"Gelukkig is de man die niet wandelt in de raad van de goddelozen, noch staat op de weg van de zondaars, noch zit op de zetel van de spotters;","Luk 11:45":"En een van de wetgeleerden antwoordde en zei tegen Hem: Meester, als U dit zegt, doet U ons ook smaad aan.","2 Sam 15:11":"En met Absalom gingen er tweehonderd mannen mee uit Jeruzalem, die uitgenodigd waren, maar in hun eenvoudigheid meegingen, want zij wisten van niets.","Matt 22:17":"Zeg ons dan: wat denkt U? Is het geoorloofd de keizer belasting te betalen of niet?","Joh 3:19-21":"En dit is het oordeel: dat het licht in de wereld gekomen is, en de mensen hebben de duisternis liever gehad dan het licht; want hun werken waren slecht. Want ieder die kwaad doet, haat het licht en komt niet tot het licht, opdat zijn werken niet bestraft worden. Maar wie de waarheid doet, komt tot het licht, opdat van zijn werken openbaar wordt dat zij in God gedaan zijn.","Hand 2:2-4":"En er kwam plotseling uit de hemel een geluid, als van een geweldige, gedreven wind, en het vervulde het hele huis waar zij zaten. En er werden door hen verdeelde tongen gezien, als van vuur, en het zat op ieder van hen. En zij werden allen vervuld met de Heilige Geest, en begonnen te spreken met andere talen, zoals de Geest hun gaf uit te spreken.","Jer 14:13":"Toen zei ik: Ach, Heere HEERE! Zie, die profeten zeggen hun: U zult geen zwaard zien, en u zult geen honger hebben; maar Ik zal u een zekere vrede geven op deze plaats.","1 Sam 14:18":"Toen zei Saul tegen Ahia: Breng de ark van God hierheen. Want de ark van God was op die dag bij de kinderen van Israël.","2 Kor 8:1-5":"Verder maken wij u bekend, broeders, de genade van God, die in de gemeenten van Macedonië gegeven is. Dat in veel beproeving van de verdrukking de overvloed van hun blijdschap, en hun zeer diepe armoede overvloedig geweest is tot de rijkdom van hun goeddadigheid. Want zij zijn naar vermogen (ik betuig het), ja, boven vermogen gewillig geweest;","Ex 32:31":"Zo keerde Mozes terug tot de HEERE, en zei: Och, dit volk heeft een grote zonde gezondigd, doordat zij zich gouden goden gemaakt hebben.","2 Kron 20:3-30":"Josafat nu werd bevreesd, en richtte zich erop om de HEERE te zoeken; en hij riep een vasten uit in heel Juda. En Juda kwam bijeen om hulp te zoeken bij de HEERE; ook kwamen zij uit alle steden van Juda om de HEERE te zoeken. En Josafat stond in de samenkomst van Juda en Jeruzalem, in het huis van de HEERE, voor het nieuwe voorhof.","2 Kon 13:1":"In het drieëntwintigste jaar van Joas, de zoon van Ahazia, de koning van Juda, werd Joahaz, de zoon van Jehu, koning over Israël, te Samaria, en regeerde zeventien jaren.","Joël 2:28":"En daarna zal het gebeuren, dat Ik Mijn Geest zal uitgieten over alle vlees, en uw zonen en uw dochters zullen profeteren; uw ouden zullen dromen dromen, uw jongelingen zullen gezichten zien;","2 Kor 11:25":"Driemaal ben ik met roeden gegeseld geweest, eens ben ik gestenigd, driemaal heb ik schipbreuk geleden, een hele nacht en dag heb ik in de diepte doorgebracht.","1 Kron 14:14":"En David vroeg God nog een keer; en God zei tegen hem: U zult niet achter hen aan optrekken; maar omsingel hen van boven, en kom op hen af tegenover de moerbeibomen.","1 Kon 16:7":"Zo kwam ook het woord van de HEERE, door de dienst van de profeet Jehu, de zoon van Hanani, tegen Baësa en tegen zijn huis; en dat om al het kwaad dat hij gedaan had in de ogen van de HEERE, waarmee hij Hem tot toorn verwekte door het werk van zijn handen, omdat hij was als het huis van Jerobeam, en omdat hij hem had verslagen.","1 Sam 10:10":"Toen zij daar bij de heuvel kwamen, zie, toen kwam hem een groep profeten tegemoet; en de Geest van de HEERE werd vaardig over hem, en hij profeteerde in hun midden.","Jer 37:16":"Toen Jeremia in het kuil-gedeelte en in de kotjes gekomen was, en Jeremia daar veel dagen gezeten had,","Hos 7:5":"Het is de dag van onze koning; de vorsten maken hem ziek door verhitting van de wijn; hij strekt zijn hand uit met de spotters.","Zach 1:1":"In de achtste maand, in het tweede jaar van Darius, kwam het woord van de HEERE tot Zacharia, de zoon van Berechja, de zoon van Iddo, de profeet, en hij zei:","Num 9:8-10":"En Mozes zei tot hen: Blijf staan, dat ik hoor wat de HEERE u gebieden zal. Toen sprak de HEERE tot Mozes en zei: Spreek tot de kinderen van Israël en zeg: Wanneer iemand onder u, of onder uw geslachten, onrein is door een dood lichaam, of op een verre reis zal zijn, dan zal hij toch de HEERE het pascha houden.","2 Kon 5:8":"Maar het gebeurde, toen Elisa, de man van God, gehoord had dat de koning van Israël zijn kleren had gescheurd, dat hij naar de koning stuurde, om te zeggen: Waarom hebt u uw kleren gescheurd? Laat hem nu naar mij toe komen, dan zal hij weten dat er een profeet in Israël is.","Ezech 20:1-3":"En het gebeurde in het zevende jaar, in de vijfde maand, op de tiende van die maand, dat er mannen uit de oudsten van Israël kwamen, om de HEERE te vragen; en zij gingen voor mijn aangezicht zitten. Toen kwam het woord van de HEERE tot mij en Hij zei: Mensenkind, spreek tot de oudsten van Israël, en zeg tegen hen: Zo zegt de Heere HEERE: Komt u om Mij te vragen? Zo waarachtig als Ik leef, zo Ik door u gevraagd word, spreekt de Heere HEERE!","Hand 24:25-27":"En toen hij sprak over rechtvaardigheid, en zelfbeheersing, en over het komende oordeel, werd Felix zeer bevreesd, en antwoordde: Voor nu kunt u gaan; en wanneer ik een geschikte tijd zal hebben, zal ik u weer bij mij roepen. En tegelijk ook hopend, dat hem door Paulus geld gegeven zou worden, opdat hij hem zou vrijlaten; daarom ontbood hij hem ook vaak, en sprak met hem. Maar toen twee jaren voorbij waren, kreeg Felix Porcius Festus als opvolger; en Felix, die de Joden een gunst wilde bewijzen, liet Paulus gevangen achter.","Zach 11:8":"En ik heb drie herders in één maand afgesneden; want mijn ziel was verdrietig over hen geworden, en ook had hun ziel een walg van mij.","Gen 41:38":"Toen zei Farao tegen zijn dienaars: Zouden wij wel een man vinden zoals deze, in wie de Geest van God is?","2 Kron 22:9":"Daarna zocht hij Ahazia, en zij kregen hem te pakken (want hij had zich verstopt in Samaria), en zij brachten hem tot Jehu, en zij doodden hem, en begroeven hem; want zij zeiden: Hij is de zoon van Josafat, die de HEERE met zijn hele hart gezocht heeft. Zo had het huis van Ahazia niemand die de kracht behield tot het koningschap.","Hand 11:28":"En een van hen, met de naam Agabus, stond op en maakte door de Geest bekend dat er een grote hongersnood zou komen over de hele wereld; die is ook gekomen onder keizer Claudius.","1 Kon 22:52-54":"Ahazia, de zoon van Achab, werd koning over Israël te Samaria, in het zeventiende jaar van Josafat, de koning van Juda, en regeerde twee jaar over Israël. En hij deed wat kwaad was in de ogen van de HEERE; want hij wandelde in de weg van zijn vader, en in de weg van zijn moeder, en in de weg van Jerobeam, de zoon van Nebat, die Israël deed zondigen. En hij diende Baäl, en boog zich voor hem neer, en tergde de HEERE, de God van Israël, naar alles wat zijn vader gedaan had.","Jer 42:7":"En het gebeurde na tien dagen, dat het woord van de HEERE tot Jeremia kwam.","Deut 27:21":"Vervloekt is hij die bij enig beest ligt! En heel het volk zal zeggen: Amen.","2 Kron 18:10":"En Zedekia, de zoon van Kenaana, had zich ijzeren hoornen gemaakt, en zei: Zo zegt de HEERE: Met deze zult u de Syriërs stoten, totdat u hen helemaal hebt vernietigd.","Matt 26:68":"En anderen gaven Hem kinnebakslagen en zeiden: Profeteer ons, Christus, wie is het die U geslagen heeft?","Jes 58:3":"En zeggen: Waarom vasten wij, en ziet U het niet aan, waarom kwellen wij onze ziel, en weet U het niet? Zie, op de dag waarop u vast, vindt u uw genoegen, en u eist streng al uw arbeid.","Num 14:27-34":"Hoelang zal Ik het bij deze slechte vergadering uithouden, die tegen Mij morren? Ik heb het gemor van de kinderen van Israël gehoord, waarmee zij tegen Mij morren. Zeg tegen hen: Zo waarachtig als Ik leef, spreekt de HEERE, zoals u in Mijn oren gesproken hebt, zo zal Ik u doen! Uw dode lichamen zullen in deze woestijn vallen; en al uw getelden, naar uw hele aantal, van twintig jaar oud en daarboven, u die tegen Mij gemord hebt.","2 Kon 2:24":"En hij keerde zich achterom, en hij zag hen, en vervloekte hen, in de Naam van de HEERE. Toen kwamen er twee berinnen uit het woud, en verscheurden van hen tweeënveertig kinderen.","Jona 2:2":"En hij zei: Ik riep uit mijn benauwdheid tot de HEERE, en Hij antwoordde mij; uit de buik van het graf schreide ik, en U hoorde mijn stem.","1 Tim 1:10":"De hoereerders, mannen die met mannen omgang hebben, de mensenrovers, de leugenaars, de meinedigen, en al wat verder tegen de gezonde leer ingaat;","Ex 14:10":"Toen Farao dichtbij gekomen was, hieven de kinderen van Israël hun ogen op, en zie, de Egyptenaren trokken achter hen aan; en zij vreesden zeer; toen riepen de kinderen van Israël tot de HEERE.","Job 22:13":"Daarom zegt u: Wat weet God ervan? Zal Hij door de donkere wolk oordelen?","Ezech 1:26-28":"En boven het uitspansel dat boven hun hoofden was, was de gelijkenis van een troon, als de gedaante van een saffiersteen; en op de gelijkenis van de troon was de gelijkenis als de gedaante van een mens, daarboven op zittend. En ik zag iets als de kleur van amber, als de gedaante van vuur rondom daarbinnen, vanaf de gedaante van Zijn lendenen en opwaarts; en vanaf de gedaante van Zijn lendenen en neerwaarts, zag ik iets als de gedaante van vuur, en een glans rondom Hem. Zoals de gedaante van de boog die in de wolk is op de dag van de regen, zo was de gedaante van de glans rondom; dit was de gedaante van de gelijkenis van de heerlijkheid van de HEERE; en toen ik het zag, viel ik op mijn gezicht, en ik hoorde een stem van Iemand Die sprak.","2 Kor 6:14":"Trek niet een ander juk aan met de ongelovigen; want wat heeft de gerechtigheid gemeen met de ongerechtigheid, en welke gemeenschap heeft het licht met de duisternis?","Pred 11:9":"Verblijd u, jongeman, in uw jeugd, en laat uw hart zich vermaken in de dagen van uw jongelingschap, en wandel in de wegen van uw hart, en in wat uw ogen zien; maar weet dat God u, om al deze dingen, voor het gericht zal doen komen.","Jes 2:16":"En tegen alle schepen van Tarsis, en tegen alle gewenste schilderijen.","Kol 1:7":"Zoals u ook geleerd hebt van Epafras, onze geliefde mededienstknecht, die een trouw dienaar van Christus is voor u;","Jer 23:31":"Zie, Ik wil tegen de profeten, spreekt de HEERE, die hun tong gebruiken, en spreken: Hij heeft het gesproken;","Hand 27:32":"Toen hakten de soldaten de touwen van de boot af, en lieten haar vallen.","2 Sam 5:19":"Toen vroeg David de HEERE: Zal ik optrekken tegen de Filistijnen? Zult U hen in mijn hand geven? En de HEERE zei tegen David: Trek op, want Ik zal de Filistijnen zeker in uw hand geven.","2 Kon 12:3":"Zeker werden de hoogten niet weggenomen; het volk offerde en rookte nog op de hoogten.","Dan 10:7-9":"En ik, Daniël, zag alleen dat gezicht, maar de mannen die bij mij waren, zagen dat gezicht niet; maar er viel een grote schrik op hen, en zij vluchtten om zich te verbergen. Ik dan bleef alleen achter, en zag dit grote gezicht, en er bleef in mij geen kracht over; en mijn schoonheid veranderde in verval, zodat ik geen kracht behield. En ik hoorde de stem van Zijn woorden; en toen ik de stem van Zijn woorden hoorde, viel ik in een diepe slaap op mijn gezicht, met mijn gezicht op de grond.","1 Petr 3:15":"maar heilig God, de Heere, in uw harten; en wees altijd bereid tot verantwoording aan ieder die u rekenschap vraagt van de hoop die in u is, met zachtmoedigheid en vreze,","Ezech 27:6":"Zij hebben uw riemen uit eiken van Basan gemaakt; uw dekken hebben zij gemaakt van welbewerkt ivoor, uit de eilanden van de Chittieten.","Hand 8:25":"Zij dan nu, toen zij het Woord van de Heere betuigd en gesproken hadden, keerden terug naar Jeruzalem, en verkondigden het Evangelie in veel dorpen van de Samaritanen.","Jer 28:17":"Zo stierf de profeet Hananja in datzelfde jaar, in de zevende maand.","Hand 21:10":"En toen wij daar veel dagen gebleven waren, kwam er een zekere profeet uit Judea aan, met de naam Agabus.","Ex 33:9":"En het gebeurde, als Mozes de tent binnengegaan was, dat de wolkkolom neerdaalde en bleef staan in de deur van de tent, en Hij sprak met Mozes.","Deut 23:17":"Er zal geen hoer zijn onder de dochters van Israël; en er zal geen schandjongen zijn onder de zonen van Israël.","Ezech 14:9":"Als nu een profeet overreed is en iets gesproken heeft, Ik, de HEERE, heb die profeet overreed, en Ik zal Mijn hand tegen hem uitstrekken, en zal hem verdelgen uit het midden van Mijn volk Israël.","Openb 19:20":"En het beest werd gegrepen, en met hem de valse profeet, die de tekenen in de tegenwoordigheid van hem gedaan had, waardoor hij verleid had hen die het merkteken van het beest ontvangen hadden, en die zijn beeld aanbaden. Deze twee zijn levend geworpen in de poel van het vuur, die met sulfer brandt.","Matt 9:36":"En Hij zag de menigten, en werd innerlijk met ontferming bewogen over hen, omdat zij vermoeid en verstrooid waren, zoals schapen die geen herder hebben.","1 Sam 15:4":"Dit verkondigde Saul aan het volk, en hij telde hen te Telaïm, tweehonderdduizend man van het voetvolk, en tienduizend man van Juda.","Ezech 38:13":"Scheba, en Dedan, en de kooplieden van Tarsis, en al hun jonge leeuwen zullen tegen u zeggen: Komt u, om buit te buiten? Hebt u uw verzameling verzameld, om roof te roven? Om zilver en goud weg te voeren, om vee en have weg te nemen, om een grote buit te buiten?","Mal 3:14":"U zegt: Het is tevergeefs God te dienen; want wat nut heeft het, dat wij Zijn wacht in acht nemen, en dat wij in het zwart gaan, voor het aangezicht van de HEERE van de heerscharen?","Ex 14:11":"En zij zeiden tegen Mozes: Had u ons daarom, omdat er in Egypte helemaal geen graven waren, weggehaald, opdat wij in deze woestijn zouden sterven? Waarom heeft u ons dit aangedaan, dat u ons uit Egypte hebt weggevoerd?","Jes 50:5":"De Heere HEERE heeft Mij het oor geopend, en Ik ben niet opstandig, Ik wijk niet terug.","Micha 1:1":"Het woord van de HEERE, dat gebeurd is tot Micha, de Morastiet, in de dagen van Jotham, Achaz en Jehizkia, koningen van Juda; dat hij gezien heeft over Samaria en Jeruzalem.","Openb 12:9":"En de grote draak is neergeworpen, namelijk de oude slang, die genoemd wordt duivel en satan, die de hele wereld verleidt; hij is, zeg ik, neergeworpen op de aarde; en zijn engelen zijn met hem neergeworpen.","Ps 76:11":"Want de grimmigheid van de mens zal U loffelijk maken; het overblijfsel van de grimmigheden zult U opbinden.","1 Sam 17:5":"En hij had een koperen helm op zijn hoofd, en hij had een schubachtig pantser aan; en het gewicht van het pantser was vijfduizend sikkel koper.","Jes 1:10":"Hoor het woord van de HEERE, leiders van Sodom! Neem de wet van onze God ter oor, volk van Gomorra!","Hand 7:55":"Maar hij, vol van de Heilige Geest, hield de ogen gericht naar de hemel, en zag de heerlijkheid van God, en Jezus, staande aan de rechterhand van God.","1 Sam 14:37-41":"Toen vroeg Saul God: Zal ik de Filistijnen achterna trekken? Zult U ze in de hand van Israël overgeven? Maar Hij antwoordde hem die dag niet. Toen zei Saul: Kom hierheen, alle hoofden van het volk, en onderzoek en kijk waarin deze zonde vandaag gebeurd is. Want zo waarachtig als de HEERE leeft, Die Israël verlost: al was het bij mijn zoon Jonathan, dan zal hij zeker sterven; en niemand uit heel het volk antwoordde hem.","Matt 18:10":"Kijk uit dat u niet één van deze kleinen veracht. Want Ik zeg u dat hun engelen in de hemelen altijd het aangezicht zien van Mijn Vader, Die in de hemelen is.","2 Kon 6:8-12":"En de koning van Syrië voerde oorlog tegen Israël, en overlegde met zijn knechten, en zei: Mijn legerplaats zal zijn bij die en die plaats. Maar de man van God zond bericht aan de koning van Israël, en zei: Wacht u ervoor dat u door die plaats trekt, want de Syriërs zijn daarheen afgekomen. Daarom zond de koning van Israël bericht naar die plaats, waarover de man van God hem gezegd en gewaarschuwd had, en hij wachtte zich daar, niet één keer, en niet twee keer.","Hand 21:4":"En wij vonden de discipelen en bleven daar zeven dagen; die zeiden door de Geest tegen Paulus dat hij niet naar Jeruzalem moest gaan.","1 Kon 14:2-4":"En Jerobeam zei tegen zijn vrouw: Sta nu op, en verkleed u, zodat men niet merkt dat u Jerobeams vrouw bent, en ga naar Silo. Zie, daar is de profeet Ahia, die tegen mij gezegd heeft dat ik koning zou zijn over dit volk. En neem in uw hand tien broden, en koeken, en een kruik honing, en ga naar hem toe; hij zal u vertellen wat er met deze jongen gebeuren zal. En Jerobeams vrouw deed zo, en stond op, en ging naar Silo, en kwam in het huis van Ahia. Ahia nu kon niet zien, want zijn ogen waren star geworden vanwege zijn ouderdom.","2 Kron 20:1-32":"Het gebeurde nu hierna, dat de kinderen van Moab, en de kinderen van Ammon, en met hen anderen naast de Ammonieten, tegen Josafat kwamen om te strijden. Toen kwamen er mensen die Josafat berichtten en zeiden: Er komt een grote menigte tegen u aan van de overkant van de zee, uit Syrië; en zie, zij zijn in Hazezon-Thamar, dat is Engedi. Josafat nu werd bevreesd, en richtte zich erop om de HEERE te zoeken; en hij riep een vasten uit in heel Juda.","Jer 21:2":"Vraag toch de HEERE voor ons, want Nebukadnezar, de koning van Babel, strijdt tegen ons; misschien zal de HEERE met ons doen naar al Zijn wonderen, zodat hij van ons optrekt.","Spr 18:13":"Wie antwoord geeft eer hij geluisterd heeft, dat is hem dwaasheid en schande.","2 Sam 10:15":"Toen nu de Syriërs zagen, dat zij voor Israëls aangezicht geslagen waren, verzamelden zij zich weer samen.","Openb 13:14":"En het verleidt hen die op de aarde wonen, door de tekenen die hem gegeven zijn te doen in de tegenwoordigheid van het beest; en het zegt tegen hen die op de aarde wonen dat zij een beeld moeten maken voor het beest dat de wond van het zwaard had, en weer levend werd.","Hebr 12:22":"Maar u bent gekomen tot de berg Sion, en de stad van de levende God, tot het hemelse Jeruzalem, en de vele duizenden engelen;","Hand 20:26":"Daarom verklaar ik u op deze huidige dag, dat ik rein ben van het bloed van u allen.","Spr 18:12":"Vóór de ondergang verheft zich het hart van de mens; en de nederigheid gaat vóór de eer.","Ps 19:14":"Houd Uw knecht ook terug van trotsheden; laat ze niet over mij heersen; dan zal ik oprecht zijn en rein van grote overtreding.","Num 11:17":"Dan zal Ik neerkomen en daar met u spreken; en van de Geest die op u is, zal Ik afnemen, en op hen leggen; en zij zullen met u de last van dit volk dragen, opdat u die niet alleen draagt.","Jer 27:14-16":"Luister dan niet naar de woorden van de profeten die tegen u spreken en zeggen: U zult de koning van Babel niet dienen; want zij profeteren u leugens. Want Ik heb ze niet gezonden, spreekt de HEERE, en zij profeteren leugens in Mijn Naam; met als gevolg dat Ik u wegjaag, en u omkomt, u en de profeten die u profeteren. Ook sprak ik tot de priesters, en tot heel dit volk, en zei: Zo zegt de HEERE: Luister niet naar de woorden van uw profeten, die u profeteren en zeggen: Zie, de voorwerpen van het huis van de HEERE zullen nu spoedig uit Babel teruggebracht worden; want zij profeteren u leugens.","Ex 5:2":"Maar Farao zei: Wie is de HEERE, Wiens stem ik gehoorzamen zou, om Israël te laten trekken? Ik ken de HEERE niet, en ik zal ook Israël niet laten trekken.","Joh 8:44":"U bent uit uw vader de duivel, en u wilt de begeerten van uw vader doen; die was een mensenmoordenaar van het begin af aan, en is niet in de waarheid blijven staan, want er is geen waarheid in hem. Wanneer hij de leugen spreekt, spreekt hij uit wat van hemzelf is; want hij is een leugenaar, en de vader daarvan.","Jer 43:4":"Zo gehoorzaamde Johanan, de zoon van Kareah, en alle aanvoerders van de legers, en heel het volk, niet aan de stem van de HEERE, om in het land van Juda te blijven.","Joh 4:34":"Jezus zei tegen hen: Mijn voedsel is dat Ik de wil doe van Hem die Mij gezonden heeft, en Zijn werk volbreng.","Jer 2:4":"Hoort het woord van de HEERE, huis van Jakob, en alle geslachten van het huis van Israël!","Dan 8:16":"En ik hoorde tussen de oevers van de Ulai een mensenstem, die riep en zei: Gabriël! leg deze man het gezicht uit.","2 Kon 15:32-34":"In het tweede jaar van Pekah, de zoon van Remalia, de koning van Israël, werd Jotham koning, de zoon van Uzzia, de koning van Juda. Hij was vijfentwintig jaar oud toen hij koning werd, en regeerde zestien jaar te Jeruzalem; en de naam van zijn moeder was Jerusa, de dochter van Zadok. En hij deed wat recht was in de ogen van de HEERE; precies zoals zijn vader Uzzia gedaan had, deed hij.","Ps 125:5":"Maar die zich neigen tot hun kromme wegen, die zal de HEERE weg doen gaan met de werkers van de ongerechtigheid. Vrede zal over Israël zijn!","1 Kon 15:24":"En Asa ontsliep met zijn vaderen, en werd begraven met zijn vaderen, in de stad van zijn vader David; en zijn zoon Josafat werd koning in zijn plaats.","Spr 9:12":"Als u wijs bent, bent u wijs voor uzelf; en bent u een spotter, dan zult u het alleen dragen.","2 Kon 9:22":"Het gebeurde nu, toen Joram Jehu zag, dat hij zei: Is het ook vrede, Jehu? Maar hij zei: Wat vrede, zolang de hoererijen van uw moeder Izebel, en haar toverijen, zo veel zijn?","1 Kon 10:22":"Want de koning had op zee schepen van Tharsis, samen met de schepen van Hiram; deze schepen van Tharsis kwamen eens in de drie jaar binnen, met goud, en zilver, ivoor, en apen, en pauwen.","Jer 17:16":"Ik heb toch niet aangedrongen, meer dan een herder achter U betaamde; ook heb ik de dodelijke dag niet begeerd, Gij weet het; wat uit mijn lippen is gegaan, is voor Uw aangezicht geweest.","Ezech 34:4-6":"De zwakke sterkt u niet, en het zieke heelt u niet, en het gebrokene verbindt u niet, en het weggedrevene brengt u niet terug, en het verlorene zoekt u niet; maar u heerst over hen met strengheid en met hardheid. Zo zijn zij verstrooid, omdat er geen herder is; en zij zijn al het wilde gedierte van het veld tot voedsel geworden, omdat zij verstrooid waren. Mijn schapen dolen op alle bergen en op elke hoge heuvel, ja, Mijn schapen zijn verstrooid over de hele aardbodem; en er is niemand, die ernaar vraagt, en niemand, die ze zoekt.","Ps 116:1":"Ik heb Hem lief, want de HEERE hoort mijn stem, mijn smekingen;","1 Sam 23:9-12":"Toen David begreep dat Saul dit kwaad heimelijk tegen hem voorhad, zei hij tegen de priester Abjathar: Breng de efod hierheen. En David zei: HEERE, God van Israël! Uw dienaar heeft zeker gehoord dat Saul van plan is naar Kehila te komen, om de stad te vernietigen om mijnentwil. Zullen de burgers van Kehila mij ook in zijn hand overgeven? Zal Saul afkomen, zoals Uw dienaar gehoord heeft? O HEERE, God van Israël, vertel het toch aan Uw dienaar! En de HEERE zei: Hij zal afkomen.","Ex 10:20":"Doch de HEERE verstokte het hart van Farao, zodat hij de kinderen van Israël niet liet gaan.","Luk 11:33-36":"En niemand die een lamp aansteekt, zet die op een verborgen plaats, of onder een korenmaat, maar op een standaard, opdat wie binnenkomen het licht kunnen zien. De lamp van het lichaam is het oog: wanneer dan uw oog zuiver is, dan is ook uw hele lichaam verlicht; maar als het slecht is, dan is ook uw lichaam duister. Kijk dan uit, dat niet het licht dat in u is, duisternis is.","2 Kron 17:7-9":"In het derde jaar van zijn regering nu zond hij naar zijn vorsten, naar Ben-chaïl, en naar Obadja, en naar Zecharja, en naar Nathaneël, en naar Michaja, om te leren in de steden van Juda. En met hen de Levieten, Semaja en Nethanja, en Zebadja, en Asaël, en Semiramoth, en Jonathan, en Adonia, en Tobia, en Tob-adonia, de Levieten, en met hen de priesters Elisama en Joram. En zij leerden in Juda, en het wetboek van de HEERE was bij hen; en zij gingen rond in alle steden van Juda, en leerden onder het volk.","Jer 17:2":"Zoals hun kinderen aan hun altaren denken, en aan hun bossen, bij het groene geboomte, op de hoge heuvels.","Ezra 5:2":"Toen maakten Zerubbabel, de zoon van Sealthiël, en Jesua, de zoon van Jozadak, zich op en begonnen het huis van God te bouwen, Dat te Jeruzalem woont; en met hen de profeten van God, die hen ondersteunden.","1 Kon 18:19":"Nu dan, zend heen, verzamel bij mij heel Israël op de berg Karmel, en de vierhonderdvijftig profeten van Baäl, en de vierhonderd profeten van het bos, die van de tafel van Izebel eten.","2 Sam 2:1":"Daarna gebeurde het, dat David de HEERE vroeg en zei: Zal ik optrekken in een van de steden van Juda? En de HEERE zei tegen hem: Trek op. En David zei: Waarheen zal ik optrekken? En Hij zei: Naar Hebron.","Jes 6:9":"Toen zei Hij: Ga heen, en zeg tegen dit volk: Blijf horen, maar begrijp het niet, en blijf zien, maar merk het niet op.","1 Kron 19:6":"Toen de kinderen van Ammon zagen dat zij zich stinkend gemaakt hadden bij David, stuurden Hanun en de kinderen van Ammon duizend talenten van het zilver, om zich wagens en ruiters te huren uit Mesopotamië, en uit Syrië-Maächa, en uit Zoba;","Num 33:36":"En zij vertrokken van Ezeon-geber, en legerden zich in de woestijn Zin, dat is Kades.","Rom 1:1":"Paulus, een dienstknecht van Jezus Christus, een geroepen apostel, afgezonderd tot het Evangelie van God,","2 Kon 19:32":"Daarom zegt de HEERE dit over de koning van Assyrië: Hij zal in deze stad niet komen, en daar geen pijl inschieten; ook zal hij er niet met een schild voor aankomen, en geen wal daartegen opwerpen.","Klaagl 3:30":"Jod. Hij geeft zijn wang aan hem die hem slaat, hij wordt zat van smaad.","Zach 13:7":"Zwaard! Word wakker tegen Mijn Herder, en tegen de Man Die Mijn Metgezel is, spreekt de HEERE van de heerscharen; sla die Herder, en de schapen zullen verstrooid worden; maar Ik zal Mijn hand tot de kleinen wenden.","2 Kron 20:31":"Zo regeerde Josafat over Juda; hij was vijfendertig jaar oud, toen hij koning werd, en hij regeerde vijfentwintig jaar in Jeruzalem; en de naam van zijn moeder was Azuba, een dochter van Silhi.","2 Kon 1:18":"Het overige nu van de daden van Ahazia, die hij gedaan heeft, is dat niet geschreven in het boek van de kronieken van de koningen van Israël?","Ex 24:16":"En de heerlijkheid van de HEERE woonde op de berg Sinaï, en de wolk bedekte hem zes dagen, en op de zevende dag riep Hij Mozes uit het midden van de wolk.","Ef 4:25":"Daarom, leg de leugen af, en spreek de waarheid, ieder met zijn naaste; want wij zijn elkaars leden.","1 Kon 11:7":"Toen bouwde Salomo een hoogte voor Kamos, het verfoeisel van de Moabieten, op de berg die tegenover Jeruzalem ligt, en voor Molech, het verfoeisel van de kinderen Ammons.","Hand 27:41-44":"Maar zij liepen vast op een plaats waar de zee aan beide zijden kwam, en zetten het schip daarop vast; en het voorschip bleef onbeweeglijk vastzitten, maar het achterschip brak stuk door het geweld van de golven. De soldaten hadden nu het plan om de gevangenen te doden, opdat niemand zou wegzwemmen en ontsnappen. Maar de hoofdman, die Paulus wilde redden, verhinderde hun dat plan, en beval dat wie kon zwemmen, zich eerst zou afwerpen om aan land te komen;","1 Sam 16:13":"Toen nam Samuël de oliehoorn, en zalfde hem te midden van zijn broers. En de Geest van de HEERE kwam vanaf die dag over David, en bleef. Daarna stond Samuël op, en ging naar Rama.","Jer 29:27":"Nu dan, waarom hebt u Jeremia, de Anathothiet, niet bestraft, die zich bij u voor een profeet uitgeeft?","2 Joh 1:11":"Want die tegen lia: Hebt u mij gevonden, o mijn vijand? En hij zei: Ik heb u gevonden, omdat u uzelf verkocht hebt om te doen wat kwaad is in de ogen van de HEERE.","Jer 5:31":"De profeten profeteren vals, en de priesters heersen door hun eigen hand; en Mijn volk heeft het graag zo; maar wat zult u aan het einde daarvan doen?","Num 24:15":"Toen hief hij zijn spreuk op en zei: Bileam, de zoon van Beor, spreekt, en die man wiens ogen geopend zijn, spreekt!","2 Kron 18:33":"Toen spande een man de boog op goed geluk, en schoot de koning van Israël tussen de gespen en het pantser. Toen zei hij tegen de voerman: Keer uw hand en breng mij uit het leger, want ik ben gewond.","Ex 17:7":"En hij noemde die plaats Massa en Meriba, vanwege de ruzie van de kinderen van Israël, en omdat zij de HEERE op de proef gesteld hadden door te zeggen: Is de HEERE in ons midden, of niet?","Ezech 2:4-8":"En deze kinderen zijn hard van gezicht, en stijf van hart; Ik zend u tot hen, en u zult tegen hen zeggen: Zo zegt de Heere HEERE! En zij, hetzij dat zij het horen zullen, of hetzij dat zij het laten zullen (want zij zijn een opstandig huis), zo zullen zij weten, dat er een profeet in hun midden geweest is. En u, mensenkind! Wees niet bevreesd voor hen, en wees niet bevreesd voor hun woorden, hoewel er wederwillige mensen en doornen bij u zijn, en u bij schorpioenen woont; wees voor hun woorden niet bevreesd, en schrik niet voor hun gezicht, want zij zijn een opstandig huis."},"noten":{},"koppeling":{"1":"<span class=\"wl\" data-l=\"L1\" data-code=\"H3427\">En</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H3427\">zij</span> bleven <span class=\"wl\" data-l=\"L2\" data-code=\"H7969\">drie</span> jaar <span class=\"wl\" data-l=\"L1\" data-code=\"H3427\">stil</span>, zodat <span class=\"wl\" data-l=\"L3\" data-code=\"H369\">er</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H369\">geen</span> oorlog <span class=\"wl\" data-l=\"L4\" data-code=\"H996\">was</span> <span class=\"wl\" data-l=\"L4\" data-co >gathered</span> ➔ the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> <span class=\"wl wl-kjv\" data-code=\"H6908\">together,</span> about <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, Shall I <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> against <span class=\"wl wl-kjv\" data-code=\"H7433\">Ramothgilead</span> to <span class=\"wl wl-kjv\" data-code=\"H4421\">battle,</span> or shall I <span class=\"wl wl-kjv\" data-code=\"H2308\">forbear?</span> And they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Go <span class=\"wl wl-kjv\" data-code=\"H5927\">up;</span> for the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> shall <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> it into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span>","7":"And <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Is there not here a <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5750\">besides,</span> that we might <span class=\"wl wl-kjv\" data-code=\"H1875\">enquire</span> of him?","8":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat,</span> There is yet <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> <span class=\"wl wl-kjv\" data-code=\"H4321\">Micaiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3229\">Imlah,</span> by whom we may <span class=\"wl wl-kjv\" data-code=\"H1875\">enquire</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> but I <span class=\"wl wl-kjv\" data-code=\"H8130\">hate</span> him; for he doth not <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesy</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> concerning me, but <span class=\"wl wl-kjv\" data-code=\"H7451\">evil.</span> And <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Let not the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> so.","9":"Then the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> <span class=\"wl wl-kjv\" data-code=\"H259\">an</span> <span class=\"wl wl-kjv\" data-code=\"H5631\">officer,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H4116\">Hasten</span> hither <span class=\"wl wl-kjv\" data-code=\"H4321\">Micaiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3229\">Imlah.</span>","10":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> and <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> <span class=\"wl wl-kjv\" data-code=\"H376\">each</span> on his <span class=\"wl wl-kjv\" data-code=\"H3678\">throne,</span> having put <span class=\"wl wl-kjv\" data-code=\"H3847\">on</span> their <span class=\"wl wl-kjv\" data-code=\"H899\">robes,</span> in a void <span class=\"wl wl-kjv\" data-code=\"H1637\">place</span> in the <span class=\"wl wl-kjv\" data-code=\"H6607\">entrance</span> of the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> of <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria;</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesied</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> them.","11":"And <span class=\"wl wl-kjv\" data-code=\"H6667\">Zedekiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3668\">Chenaanah</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> him <span class=\"wl wl-kjv\" data-code=\"H7161\">horns</span> of <span class=\"wl wl-kjv\" data-code=\"H1270\">iron:</span> and he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> With these shalt thou <span class=\"wl wl-kjv\" data-code=\"H5055\">push</span> the <span class=\"wl wl-kjv\" data-code=\"H758\">Syrians,</span> until thou have <span class=\"wl wl-kjv\" data-code=\"H3615\">consumed</span> them.","12":"And all the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesied</span> so, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H7433\">Ramothgilead,</span> and <span class=\"wl wl-kjv\" data-code=\"H6743\">prosper:</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> it into the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hand.</span>","13":"And the <span class=\"wl wl-kjv\" data-code=\"H4397\">messenger</span> that was <span class=\"wl wl-kjv\" data-code=\"H1980\">gone</span> to <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> <span class=\"wl wl-kjv\" data-code=\"H4321\">Micaiah</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Behold now, the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> declare <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> with <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth:</span> let thy <span class=\"wl wl-kjv\" data-code=\"H1697\">word,</span> I pray thee, be like the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of them, and <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> that which is <span class=\"wl wl-kjv\" data-code=\"H2896\">good.</span>","14":"And <span class=\"wl wl-kjv\" data-code=\"H4321\">Micaiah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> As the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> what the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> unto me, that will I <span class=\"wl wl-kjv\" data-code=\"H1696\">speak.</span>","15":"So he <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span> And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H4321\">Micaiah,</span> shall we <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> against <span class=\"wl wl-kjv\" data-code=\"H7433\">Ramothgilead</span> to <span class=\"wl wl-kjv\" data-code=\"H4421\">battle,</span> or shall we <span class=\"wl wl-kjv\" data-code=\"H2308\">forbear?</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">answered</span> him, <span class=\"wl wl-kjv\" data-code=\"H5927\">Go,</span> and <span class=\"wl wl-kjv\" data-code=\"H6743\">prosper:</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> it into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span>","16":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, How many <span class=\"wl wl-kjv\" data-code=\"H6471\">times</span> shall I <span class=\"wl wl-kjv\" data-code=\"H7650\">adjure</span> thee that thou <span class=\"wl wl-kjv\" data-code=\"H1696\">tell</span> me nothing but that which is <span class=\"wl wl-kjv\" data-code=\"H571\">true</span> in the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD?</span>","17":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H6327\">scattered</span> upon the <span class=\"wl wl-kjv\" data-code=\"H2022\">hills,</span> as <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep</span> that have not a <span class=\"wl wl-kjv\" data-code=\"H7462\">shepherd:</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> These have no <span class=\"wl wl-kjv\" data-code=\"H113\">master:</span> let them <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> to his <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> in <span class=\"wl wl-kjv\" data-code=\"H7965\">peace.</span>","18":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat,</span> Did I not <span class=\"wl wl-kjv\" data-code=\"H559\">tell</span> thee that he would <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesy</span> no <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> concerning me, but <span class=\"wl wl-kjv\" data-code=\"H7451\">evil?</span>","19":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">Hear</span> thou therefore the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> I <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">sitting</span> on his <span class=\"wl wl-kjv\" data-code=\"H3678\">throne,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">standing</span> by him on his right <span class=\"wl wl-kjv\" data-code=\"H3225\">hand</span> and on his <span class=\"wl wl-kjv\" data-code=\"H8040\">left.</span>","20":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Who shall <span class=\"wl wl-kjv\" data-code=\"H6601\">persuade</span> <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab,</span> that he may go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> and <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> at <span class=\"wl wl-kjv\" data-code=\"H7433\">Ramothgilead?</span> And one <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> on this <span class=\"wl wl-kjv\" data-code=\"H3541\">manner,</span> and another <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> on that <span class=\"wl wl-kjv\" data-code=\"H3541\">manner.</span>","21":"And there came <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> a <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit,</span> and <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will <span class=\"wl wl-kjv\" data-code=\"H6601\">persuade</span> him.","22":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Wherewith? And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will go <span class=\"wl wl-kjv\" data-code=\"H3318\">forth,</span> and I will be a <span class=\"wl wl-kjv\" data-code=\"H8267\">lying</span> <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> in the <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> of all his <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets.</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Thou shalt <span class=\"wl wl-kjv\" data-code=\"H6601\">persuade</span> him, and <span class=\"wl wl-kjv\" data-code=\"H3201\">prevail</span> also: go <span class=\"wl wl-kjv\" data-code=\"H3318\">forth,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> so.","23":"Now therefore, behold, the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> a <span class=\"wl wl-kjv\" data-code=\"H8267\">lying</span> <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> in the <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> of all these thy <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> concerning thee.","24":"But <span class=\"wl wl-kjv\" data-code=\"H6667\">Zedekiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3668\">Chenaanah</span> went <span class=\"wl wl-kjv\" data-code=\"H5066\">near,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> <span class=\"wl wl-kjv\" data-code=\"H4321\">Micaiah</span> on the <span class=\"wl wl-kjv\" data-code=\"H3895\">cheek,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Which <span class=\"wl wl-kjv\" data-code=\"H335\">way</span> <span class=\"wl wl-kjv\" data-code=\"H5674\">went</span> the <span class=\"wl wl-kjv\" data-code=\"H7307\">Spirit</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> from me to <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> unto thee?","25":"And <span class=\"wl wl-kjv\" data-code=\"H4321\">Micaiah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Behold, thou shalt <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> when thou shalt <span class=\"wl wl-kjv\" data-code=\"H935\">go</span> into an <span class=\"wl wl-kjv\" data-code=\"H2315\">inner</span> <span class=\"wl wl-kjv\" data-code=\"H2315\">chamber</span> to <span class=\"wl wl-kjv\" data-code=\"H2247\">hide</span> thyself.","26":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">Take</span> <span class=\"wl wl-kjv\" data-code=\"H4321\">Micaiah,</span> and carry him <span class=\"wl wl-kjv\" data-code=\"H7725\">back</span> unto <span class=\"wl wl-kjv\" data-code=\"H526\">Amon</span> the <span class=\"wl wl-kjv\" data-code=\"H8269\">governor</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and to <span class=\"wl wl-kjv\" data-code=\"H3101\">Joash</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son;</span>","27":"And <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">Put</span> this fellow in the <span class=\"wl wl-kjv\" data-code=\"H1004\">prison,</span> and <span class=\"wl wl-kjv\" data-code=\"H398\">feed</span> him with <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> of <span class=\"wl wl-kjv\" data-code=\"H3906\">affliction</span> and with <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> of <span class=\"wl wl-kjv\" data-code=\"H3906\">affliction,</span> until I <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> in <span class=\"wl wl-kjv\" data-code=\"H7965\">peace.</span>","28":"And <span class=\"wl wl-kjv\" data-code=\"H4321\">Micaiah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> If thou <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> at <span class=\"wl wl-kjv\" data-code=\"H7725\">all</span> in <span class=\"wl wl-kjv\" data-code=\"H7965\">peace,</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath not <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> by me. And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">Hearken,</span> O <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> every one of you.","29":"So the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> and <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H7433\">Ramothgilead.</span>","30":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat,</span> I will <span class=\"wl wl-kjv\" data-code=\"H2664\">disguise</span> myself, and <span class=\"wl wl-kjv\" data-code=\"H935\">enter</span> into the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle;</span> but put thou <span class=\"wl wl-kjv\" data-code=\"H3847\">on</span> thy <span class=\"wl wl-kjv\" data-code=\"H899\">robes.</span> And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H2664\">disguised</span> himself, and <span class=\"wl wl-kjv\" data-code=\"H935\">went</span> into the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle.</span>","31":"But the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H758\">Syria</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> his <span class=\"wl wl-kjv\" data-code=\"H7970\">thirty</span> and <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H8269\">captains</span> that had rule over his <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H3898\">Fight</span> neither with <span class=\"wl wl-kjv\" data-code=\"H6996\">small</span> nor <span class=\"wl wl-kjv\" data-code=\"
