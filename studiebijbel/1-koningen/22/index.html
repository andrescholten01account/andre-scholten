enbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"En zij bleven drie jaar stil, zodat er geen oorlog was tussen Syrië en Israël.","2":"En het gebeurde in het derde jaar, dat Josafat, de koning van Juda, naar de koning van Israël afkwam.","3":"Toen zei de koning van Israël tegen zijn knechten: Weet u dat Ramoth in Gilead van ons is? En wij blijven stil, zonder het uit de hand van de koning van Syrië te nemen.","4":"Daarna zei hij tegen Josafat: Zult u met mij optrekken naar de strijd bij Ramoth in Gilead? En Josafat zei tegen de koning van Israël: Ik zal zijn zoals u bent, mijn volk zoals uw volk, mijn paarden zoals uw paarden.","5":"Verder zei Josafat tegen de koning van Israël: Vraag toch vandaag naar het woord van de HEERE.","6":"Toen verzamelde de koning van Israël de profeten, ongeveer vierhonderd man, en hij zei tegen hen: Zal ik tegen Ramoth in Gilead ten strijde trekken, of zal ik het nalaten? En zij zeiden: Trek op, want de Heere zal ze in de hand van de koning geven.","7":"Maar Josafat zei: Is hier niet nog een profeet van de HEERE, zodat wij het hem konden vragen?","8":"Toen zei de koning van Israël tegen Josafat: Er is nog een man om door hem de HEERE te vragen; maar ik haat hem, omdat hij over mij niets goeds profeteert, maar kwaad: Micha, de zoon van Jimla. En Josafat zei: De koning moet dat niet zeggen!","9":"Toen riep de koning van Israël een kamerling en zei: Haal snel Micha, de zoon van Jimla.","10":"De koning van Israël nu, en Josafat, de koning van Juda, zaten elk op zijn troon, bekleed met *hun* klederen, op het plein, aan de deur van de poort van Samaria; en al de profeten profeteerden in hun tegenwoordigheid.","11":"En Zedekia, de zoon van Kenaana, had voor zichzelf ijzeren horens gemaakt, en hij zei: Zo zegt de HEERE: Met deze zult u de Syriërs neerstoten, totdat u hen helemaal hebt vernietigd.","12":"En al de profeten profeteerden zo en zeiden: Trek op naar Ramoth in Gilead, en u zult voorspoedig zijn; want de HEERE zal hen in de hand van de koning geven.","13":"De bode nu, die heengegaan was om Micha te roepen, sprak tegen hem en zei: Zie toch, de woorden van de profeten zijn eensgezind goed voor de koning; laat toch uw woord zijn als het woord van één van hen, en spreek het goede.","14":"Doch Micha zei: *Zo waarachtig als* de HEERE leeft, wat de HEERE tegen mij zeggen zal, dat zal ik spreken.","15":"Toen hij bij de koning gekomen was, zei de koning tegen hem: Micha, zullen wij naar Ramoth in Gilead ten strijde trekken, of zullen wij *het* nalaten? En hij zei tegen hem: Trek op, en u zult voorspoedig zijn, want de HEERE zal ze in de hand van de koning geven.","16":"En de koning zei tegen hem: Tot hoeveel keer zal ik u bezweren, dat u tegen mij niet anders spreekt dan de waarheid, in de Naam van de HEERE?","17":"En hij zei: Ik zag heel Israël verstrooid op de bergen, als schapen die geen herder hebben; en de HEERE zei: Dezen hebben geen heer; ieder keert terug naar zijn huis in vrede.","18":"Toen zei de koning van Israël tegen Josafat: Heb ik u niet gezegd: Hij zal over mij niets goeds, maar kwaad profeteren?","19":"Verder zei hij: Daarom, hoor het woord van de HEERE: Ik zag de HEERE zitten op Zijn troon, en heel het hemelse leger stond naast Hem, aan Zijn rechterhand en aan Zijn linkerhand.","20":"En de HEERE zei: Wie zal Achab overreden, zodat hij optrekt en valt bij Ramoth in Gilead? De één zei dit, en de ander zei dat.","21":"Toen ging een geest naar voren en stond voor het aangezicht van de HEERE, en zei: Ik zal hem overreden.","22":"En de HEERE zei tegen hem: Waarmee? En hij zei: Ik zal uitgaan en een leugengeest zijn in de mond van al zijn profeten. En Hij zei: U zult overreden, en het ook kunnen; ga uit en doe zo.","23":"Nu dan, zie, de HEERE heeft een leugengeest in de mond van al deze uw profeten gegeven; en de HEERE heeft kwaad over u gesproken.","24":"Toen kwam Zedekia, de zoon van Kenaana, dichterbij en sloeg Micha op de wang, en hij zei: Langs welke weg is de geest van de HEERE van mij weggegaan om u aan te spreken?","25":"En Micha zei: Zie, u zult het zien, op diezelfde dag, als u van kamer naar kamer zult gaan om u te verstoppen.","26":"De koning van Israël nu zei: Neem Micha, en breng hem terug naar Amon, de leider van de stad, en naar Joas, de zoon van de koning;","27":"En u zult zeggen: Zo zegt de koning: Zet deze man in de gevangenis, en geef hem brood van benauwdheid en water van benauwdheid, totdat ik in vrede terugkom.","28":"En Micha zei: Als u ooit in vrede terugkomt, dan heeft de HEERE niet door mij gesproken! Verder zei hij: Hoor, alle volken!","29":"Zo trok de koning van Israël en Josafat, de koning van Juda, op naar Ramoth in Gilead.","30":"En de koning van Israël zei tegen Josafat: Ik zal mij vermommen en dan in de strijd komen; maar u, trek uw kleren aan. Zo vermomde de koning van Israël zich, en kwam in de strijd.","31":"De koning van Syrië nu had zijn tweeëndertig aanvoerders van de wagens geboden en gezegd: U zult niet vechten tegen klein of groot, maar alleen tegen de koning van Israël.","32":"Het gebeurde dan, toen de aanvoerders van de wagens Josafat zagen, dat zij zeiden: Zeker, dat is de koning van Israël; en zij keerden zich naar hem toe om te strijden; maar Josafat riep het uit.","33":"En het gebeurde, toen de aanvoerders van de wagens zagen dat hij de koning van Israël niet was, dat zij zich van hem afkeerden en niet meer achtervolgden.","34":"Toen spande een man zijn boog, zomaar, zonder te mikken, en schoot de koning van Israël tussen de gespen en het pantser. Toen zei hij tegen zijn voerman: Keer uw hand, en breng mij uit het leger, want ik ben zwaar gewond.","35":"En de strijd nam die dag toe, en de koning werd rechtop gehouden in de wagen tegenover de Syriërs; maar hij stierf 's avonds, en het bloed van de wond vloeide in de bak van de wagen.","36":"En er ging een oproep door het leger, toen de zon onderging, en men zei: Ieder keert naar zijn stad, en ieder naar zijn land!","37":"Zo stierf de koning, en werd naar Samaria gebracht; en zij begroeven de koning te Samaria.","38":"Toen men de wagen in de vijver van Samaria spoelde, likten de honden zijn bloed, waar de hoeren zich wasten, naar het woord van de HEERE, dat Hij gesproken had.","39":"Het overige nu van de geschiedenis van Achab, en alles wat hij gedaan heeft, en het huis van ivoor dat hij gebouwd heeft, en al de steden die hij gebouwd heeft, staat dat niet geschreven in het boek van de kronieken van de koningen van Israël?","40":"Zo ontsliep Achab met zijn vaderen; en zijn zoon Ahazia werd koning in zijn plaats.","41":"Josafat nu, de zoon van Asa, werd koning over Juda, in het vierde jaar van Achab, de koning van Israël.","42":"Josafat was vijfendertig jaar oud toen hij koning werd, en regeerde vijfentwintig jaar te Jeruzalem; en de naam van zijn moeder was Azuba, de dochter van Silchi.","43":"En hij wandelde in heel de weg van zijn vader Asa; hij week daar niet van af, en deed wat recht was in de ogen van de HEERE.","44":"Toch werden de hoogten niet weggenomen; het volk offerde en bracht nog reukwerk op de hoogten.","45":"En Josafat maakte vrede met de koning van Israël.","46":"Het overige nu van de geschiedenis van Josafat, en zijn macht, die hij bewezen heeft, en hoe hij oorlog heeft gevoerd, staat dat niet geschreven in het boek van de kronieken van de koningen van Juda?","47":"Ook verwijderde hij uit het land de overige schandjongens, die in de dagen van zijn vader Asa overgebleven waren.","48":"Toen was er geen koning in Edom, *maar* een stadhouder van de koning.","49":"*En* Josafat maakte schepen van Tharsis, om naar Ofir te gaan voor goud; maar zij gingen niet, want de schepen werden gebroken bij Ezeon-Geber.","50":"Toen zei Ahazia, de zoon van Achab, tegen Josafat: Laat mijn knechten met uw knechten op de schepen meevaren; maar Josafat wilde niet.","51":"En Josafat ontsliep met zijn vaderen, en werd bij zijn vaderen begraven in de stad van zijn vader David; en zijn zoon Joram werd koning in zijn plaats.","52":"Ahazia, de zoon van Achab, werd koning over Israël te Samaria, in het zeventiende jaar van Josafat, de koning van Juda, en regeerde twee jaar over Israël.","53":"En hij deed wat kwaad was in de ogen van de HEERE; want hij wandelde in de weg van zijn vader, en in de weg van zijn moeder, en in de weg van Jerobeam, de zoon van Nebat, die Israël deed zondigen.","54":"En hij diende Baäl, en boog zich voor hem neer, en tergde de HEERE, de God van Israël, naar alles wat zijn vader gedaan had."},"SV":{"1":"En zij zaten drie jaren stil, dat er geen krijg was tussen Syrië en tussen Israël.","2":"Maar het geschiedde in het derde jaar, als Josafat, de koning van Juda, tot den koning van Israël afgekomen was,","3":"Dat de koning van Israël tot zijn knechten zeide: Weet gij, dat Ramoth in Gilead onze is? En wij zijn stil, zonder dat te nemen uit de hand van den koning van Syrië.","4":"Daarna zeide hij tot Josafat: Zult gij met mij trekken in den strijd naar Ramoth in Gilead? En Josafat zeide tot den koning van Israël: Zo zal ik zijn gelijk gij zijt, zo mijn volk als uw volk, zo mijn paarden als uw paarden.","5":"Verder zeide Josafat tot den koning van Israël: Vraag toch als heden naar het woord des HEEREN.","6":"Toen vergaderde de koning van Israël de profeten, omtrent vierhonderd man, en hij zeide tot hen: Zal ik tegen Ramoth in Gilead ten strijde trekken, of zal ik het nalaten? En zij zeiden: Trek op, want de Heere zal ze in de hand des konings geven.","7":"Maar Josafat zeide: Is hier niet nog een profeet des HEEREN, dat wij het van hem vragen mochten?","8":"Toen zeide de koning van Israël tot Josafat: Er is nog een man, om door hem den HEERE te vragen; maar ik haat hem, omdat hij over mij niets goeds profeteert, maar kwaad: Micha, de zoon van Jimla. En Josafat zeide: De koning zegge niet alzo!","9":"Toen riep de koning van Israël een kamerling, en hij zeide: Haal haastelijk Micha, den zoon van Jimla.","10":"De koning van Israël nu, en Josafat, de koning van Juda, zaten elk op zijn troon, bekleed met *hun* klederen, op het plein, aan de deur der poort van Samaria; en al de profeten profeteerden in hun tegenwoordigheid.","11":"En Zedekia, de zoon van Kenaana, had zich ijzeren horens gemaakt; en hij zeide: Zo zegt de HEERE: Met deze zult gij de Syriërs stoten, totdat gij hen gans verdaan zult hebben.","12":"En al de profeten profeteerden alzo, zeggende: Trek op naar Ramoth in Gilead, en gij zult voorspoedig zijn; want de HEERE zal hen in de hand des konings geven.","13":"De bode nu, die henengegaan was, om Micha te roepen, sprak tot hem, zeggende: Zie toch, de woorden der profeten zijn uit een mond goed tot den koning; dat toch uw woord zij, gelijk als het woord van een uit hen, en spreek het goede.","14":"Doch Micha zeide: *Zo* *waarachtig* *als* de HEERE leeft, hetgeen de HEERE tot mij zeggen zal, dat zal ik spreken.","15":"Als hij tot den koning gekomen was, zo zeide de koning tot hem: Micha, zullen wij naar Ramoth in Gilead ten strijde trekken, of zullen wij *het* nalaten? En hij zeide tot hem: Trek op, en gij zult voorspoedig zijn, want de HEERE zal ze in de hand des konings geven.","16":"En de koning zeide tot hem: Tot hoe vele reizen zal ik u bezweren, opdat gij tot mij niet spreekt, dan alleen de waarheid, in den Naam des HEEREN?","17":"En hij zeide: Ik zag het ganse Israël verstrooid op de bergen, gelijk schapen, die geen herder hebben; en de HEERE zeide: Dezen hebben geen heer; een iegelijk kere weder naar zijn huis in vrede.","18":"Toen zeide de koning van Israël tot Josafat: Heb ik tot u niet gezegd: Hij zal over mij niets goed, maar kwaads profeteren?","19":"Verder zeide hij: Daarom hoort het woord des HEEREN: Ik zag den HEERE, zittende op Zijn troon, en al het hemelse heir staande nevens Hem, aan Zijn rechter *hand* en aan Zijn linkerhand.","20":"En de HEERE zeide: Wie zal Achab overreden, dat hij optrekke en valle te Ramoth in Gilead? De een nu zeide aldus, en de andere zeide alzo.","21":"Toen ging een geest uit, en stond voor het aangezicht des HEEREN, en zeide: Ik zal hem overreden.","22":"En de HEERE zeide tot hem: Waarmede? En hij zeide: Ik zal uitgaan, en een leugengeest zijn in den mond van al zijn profeten. En Hij zeide: Gij zult overreden, en zult het ook vermogen; ga uit en doe alzo.","23":"Nu dan, zie, de HEERE heeft een leugengeest in den mond van al deze uw profeten gegeven; en de HEERE heeft kwaad over u gesproken.","24":"Toen trad Zedekia, de zoon van Kenaana, toe, en sloeg Micha op het kinnebakken; en hij zeide: Door wat *weg* is de geest des HEEREN van mij doorgegaan, om u aan te spreken?","25":"En Micha zeide: Zie, gij zult het zien, op dienzelfden dag, als gij zult gaan *van* kamer in kamer, om u te versteken.","26":"De koning van Israël nu zeide: Neem Micha, en breng hem weder tot Amon, den overste der stad, en tot Joas, den zoon des konings;","27":"En gij zult zeggen: Zo zegt de koning: Zet dezen in het gevangenhuis, en spijst hem met brood der bedruktheid, en met water der bedruktheid, totdat ik met vrede *weder* kom.","28":"En Micha zeide: Indien gij enigszins met vrede wederkomt, zo heeft de HEERE door mij niet gesproken! Verder zeide hij: Hoort, gij volken altegaar!","29":"Alzo toog de koning van Israël en Josafat, de koning van Juda, op naar Ramoth in Gilead.","30":"En de koning van Israël zeide tot Josafat: Als ik mij versteld heb, zal ik in den strijd komen; maar gij, trek uw klederen aan. Alzo verstelde zich de koning van Israël, en kwam in den strijd.","31":"De koning nu van Syrië had geboden aan de oversten der wagenen, van welke hij twee en dertig had, zeggende: Gij zult noch kleinen noch groten bestrijden, maar den koning van Israël alleen.","32":"Het geschiedde dan, als de oversten der wagenen Josafat zagen, dat zij zeiden: Gewisselijk, die is de koning van Israël, en zij keerden zich naar hem, om te strijden; maar Josafat riep uit.","33":"En het geschiedde, als de oversten der wagenen zagen, dat hij de koning van Israël niet was, dat zij zich van achter hem afkeerden.","34":"Toen spande een man den boog in zijn eenvoudigheid, en schoot den koning van Israël tussen de gespen en tussen het pantsier. Toen zeide hij tot zijn voerman: Keer uw hand, en voer mij uit het leger, want ik ben zeer verwond.","35":"En de strijd nam op denzelven dag toe, en de koning werd met den wagen staande gehouden tegenover de Syriërs; maar hij stierf des avonds, en het bloed der wonde vloeide in den bak des wagens.","36":"En er ging een uitroeping door het heirleger, als de zon onderging, zeggende: Een ieder kere naar zijn stad, en een ieder naar zijn land!","37":"Alzo stierf de koning, en werd naar Samaria gebracht; en zij begroeven den koning te Samaria.","38":"Als men nu den wagen in den vijver van Samaria spoelde, lekten de honden zijn bloed, waar de hoeren wiesen, naar het woord des HEEREN, dat Hij gesproken had.","39":"Het overige nu der geschiedenissen van Achab, en al wat hij gedaan heeft, en het elpenbenen huis, dat hij gebouwd heeft, en al de steden, die hij gebouwd heeft, zijn die niet geschreven in het boek der kronieken der koningen van Israël?","40":"Alzo ontsliep Achab met zijn vaderen; en zijn zoon Ahazia werd koning in zijn plaats.","41":"Josafat nu, de zoon van Asa, werd koning over Juda, in het vierde jaar van Achab, den koning van Israël.","42":"Josafat was vijf en dertig jaren oud, als hij koning werd, en regeerde vijf en twintig jaren te Jeruzalem; en de naam zijner moeder was Azuba, de dochter van Silchi.","43":"En hij wandelde in al den weg van zijn vader Asa; hij week niet daarvan, doende dat recht was in de ogen des HEEREN.","44":"Evenwel werden de hoogten niet weggenomen; het volk offerde en rookte nog op de hoogten.","45":"En Josafat maakte vrede met den koning van Israël.","46":"Het overige nu der geschiedenissen van Josafat, en zijn macht, die hij bewezen heeft, en hoe hij geoorloogd heeft, zijn die niet geschreven in het boek der kronieken der koningen van Juda?","47":"Ook deed hij uit het land weg de overige schandjongens, die in de dagen van zijn vader Asa overgebleven waren.","48":"Toen was er geen koning in Edom, *maar* een stadhouder des konings.","49":"*En* Josafat maakte schepen van Tharsis, om naar Ofir te gaan om goud; maar zij gingen niet, want de schepen werden gebroken te Ezeon-geber.","50":"Toen zeide Ahazia, de zoon van Achab, tot Josafat: Laat mijn knechten met uw knechten op de schepen varen; maar Josafat wilde niet.","51":"En Josafat ontsliep met zijn vaderen, en werd bij zijn vaderen begraven in de stad van zijn vader David; en zijn zoon Joram werd koning in zijn plaats.","52":"Ahazia, de zoon van Achab, werd koning over Israël te Samaria, in het zeventiende jaar van Josafat, den koning van Juda, en regeerde twee jaren over Israël.","53":"En hij deed dat kwaad was in de ogen des HEEREN; want hij wandelde in den weg van zijn vader, en in den weg van zijn moeder, en in den weg van Jerobeam, den zoon van Nebat, die Israël zondigen deed.","54":"En hij diende Baäl, en boog zich voor hem, en vertoornde den HEERE, den God Israëls, naar alles, wat zijn vader gedaan had."},"KJV":{"1":"And they continued three years without war between Syria and Israel.","2":"And it came to pass in the third year, that Jehoshaphat the king of Judah came down to the king of Israel.","3":"And the king of Israel said unto his servants, Know ye that Ramoth in Gilead is ours, and we be still, and take it not out of the hand of the king of Syria?","4":"And he said unto Jehoshaphat, Wilt thou go with me to battle to Ramothgilead? And Jehoshaphat said to the king of Israel, I am as thou art, my people as thy people, my horses as thy horses.","5":"And Jehoshaphat said unto the king of Israel, Enquire, I pray thee, at the word of the LORD to day.","6":"Then the king of Israel gathered ➔ the prophets together, about four hundred men, and said unto them, Shall I go against Ramothgilead to battle, or shall I forbear? And they said, Go up; for the Lord shall deliver it into the hand of the king.","7":"And Jehoshaphat said, Is there not here a prophet of the LORD besides, that we might enquire of him?","8":"And the king of Israel said unto Jehoshaphat, There is yet one man, Micaiah the son of Imlah, by whom we may enquire of the LORD: but I hate him; for he doth not prophesy good concerning me, but evil. And Jehoshaphat said, Let not the king say so.","9":"Then the king of Israel called an officer, and said, Hasten hither Micaiah the son of Imlah.","10":"And the king of Israel and Jehoshaphat the king of Judah sat each on his throne, having put on their robes, in a void place in the entrance of the gate of Samaria; and all the prophets prophesied before them.","11":"And Zedekiah the son of Chenaanah made him horns of iron: and he said, Thus saith the LORD, With these shalt thou push the Syrians, until thou have consumed them.","12":"And all the prophets prophesied so, saying, Go up to Ramothgilead, and prosper: for the LORD shall deliver it into the king's hand.","13":"And the messenger that was gone to call Micaiah spake unto him, saying, Behold now, the words of the prophets declare good unto the king with one mouth: let thy word, I pray thee, be like the word of one of them, and speak that which is good.","14":"And Micaiah said, As the LORD liveth, what the LORD saith unto me, that will I speak.","15":"So he came to the king. And the king said unto him, Micaiah, shall we go against Ramothgilead to battle, or shall we forbear? And he answered him, Go, and prosper: for the LORD shall deliver it into the hand of the king.","16":"And the king said unto him, How many times shall I adjure thee that thou tell me nothing but that which is true in the name of the LORD?","17":"And he said, I saw all Israel scattered upon the hills, as sheep that have not a shepherd: and the LORD said, These have no master: let them return every man to his house in peace.","18":"And the king of Israel said unto Jehoshaphat, Did I not tell thee that he would prophesy no good concerning me, but evil?","19":"And he said, Hear thou therefore the word of the LORD: I saw the LORD sitting on his throne, and all the host of heaven standing by him on his right hand and on his left.","20":"And the LORD said, Who shall persuade Ahab, that he may go up and fall at Ramothgilead? And one said on this manner, and another said on that manner.","21":"And there came forth a spirit, and stood before the LORD, and said, I will persuade him.","22":"And the LORD said unto him, Wherewith? And he said, I will go forth, and I will be a lying spirit in the mouth of all his prophets. And he said, Thou shalt persuade him, and prevail also: go forth, and do so.","23":"Now therefore, behold, the LORD hath put a lying spirit in the mouth of all these thy prophets, and the LORD hath spoken evil concerning thee.","24":"But Zedekiah the son of Chenaanah went near, and smote Micaiah on the cheek, and said, Which way went the Spirit of the LORD from me to speak unto thee?","25":"And Micaiah said, Behold, thou shalt see in that day, when thou shalt go into an inner chamber to hide thyself.","26":"And the king of Israel said, Take Micaiah, and carry him back unto Amon the governor of the city, and to Joash the king's son;","27":"And say, Thus saith the king, Put this fellow in the prison, and feed him with bread of affliction and with water of affliction, until I come in peace.","28":"And Micaiah said, If thou return at all in peace, the LORD hath not spoken by me. And he said, Hearken, O people, every one of you.","29":"So the king of Israel and Jehoshaphat the king of Judah went up to Ramothgilead.","30":"And the king of Israel said unto Jehoshaphat, I will disguise myself, and enter into the battle; but put thou on thy robes. And the king of Israel disguised himself, and went into the battle.","31":"But the king of Syria commanded his thirty and two captains that had rule over his chariots, saying, Fight neither with small nor great, save only with the king of Israel.","32":"And it came to pass, when the captains of the chariots saw Jehoshaphat, that they said, Surely it is the king of Israel. And they turned aside to fight against him: and Jehoshaphat cried out.","33":"And it came to pass, when the captains of the chariots perceived that it was not the king of Israel, that they turned back from pursuing him.","34":"And a certain man drew a bow at a venture, and smote the king of Israel between the joints of the harness: wherefore he said unto the driver of his chariot, Turn thine hand, and carry me out of the host; for I am wounded.","35":"And the battle increased that day: and the king was stayed up in his chariot against the Syrians, and died at even: and the blood ran out of the wound into the midst of the chariot.","36":"And there went a proclamation throughout the host about the going down of the sun, saying, Every man to his city, and every man to his own country.","37":"So the king died, and was brought to Samaria; and they buried the king in Samaria.","38":"And one washed the chariot in the pool of Samaria; and the dogs licked up his blood; and they washed his armour; according unto the word of the LORD which he spake.","39":"Now the rest of the acts of Ahab, and all that he did, and the ivory house which he made, and all the cities that he built, are they not written in the book of the chronicles of the kings of Israel?","40":"So Ahab slept with his fathers; and Ahaziah his son reigned in his stead.","41":"And Jehoshaphat the son of Asa began to reign over Judah in the fourth year of Ahab king of Israel.","42":"Jehoshaphat was thirty and five years old when he began to reign; and he reigned twenty and five years in Jerusalem. And his mother's name was Azubah the daughter of Shilhi.","43":"And he walked in all the ways of Asa his father; he turned not aside from it, doing that which was right in the eyes of the LORD: nevertheless the high places were not taken away; for the people offered and burnt incense yet in the high places.","44":"And he walked in all the ways of Asa his father; he turned not aside from it, doing that which was right in the eyes of the LORD: nevertheless the high places were not taken away; for the people offered and burnt incense yet in the high places.","45":"And Jehoshaphat made peace with the king of Israel.","46":"Now the rest of the acts of Jehoshaphat, and his might that he shewed, and how he warred, are they not written in the book of the chronicles of the kings of Judah?","47":"And the remnant of the sodomites, which remained in the days of his father Asa, he took out of the land.","48":"There was then no king in Edom: a deputy was king.","49":"Jehoshaphat made ships of Tharshish to go to Ophir for gold: but they went not; for the ships were broken at Eziongeber.","50":"Then said Ahaziah the son of Ahab unto Jehoshaphat, Let my servants go with thy servants in the ships. But Jehoshaphat would not.","51":"And Jehoshaphat slept with his fathers, and was buried with his fathers in the city of David his father: and Jehoram his son reigned in his stead.","52":"Ahaziah the son of Ahab began to reign over Israel in Samaria the seventeenth year of Jehoshaphat king of Judah, and reigned two years over Israel.","53":"And he did evil in the sight of the LORD, and walked in the way of his father, and in the way of his mother, and in the way of Jeroboam the son of Nebat, who made Israel to sin:","54":"For he served Baal, and worshipped him, and provoked to anger the LORD God of Israel, according to all that his father had done."}},"tsk":{"2":[{"kopje":"in het derde","refs":["1 Kon 22:1","Matt 12:40","Matt 16:21"]},{"kopje":"Josafat","refs":["1 Kon 22:41","1 Kon 22:45","1 Kon 15:24","2 Kon 8:18","2 Kron 18:1"]}],"3":[{"kopje":"Ramoth","refs":["1 Kon 4:13","Deut 4:43","Joz 20:8"]},{"kopje":"stil","refs":["Richt 16:2","2 Sam 19:10"]}],"4":[{"kopje":"Zult u met mij optrekken","refs":["2 Kon 3:7","2 Kron 18:3"]},{"kopje":"Ik zal zijn zoals u","refs":["2 Kron 19:2","Ps 139:21","Ps 139:22","Spr 13:20","1 Kor 15:33","2 Kor 6:16","2 Kor 6:17","Ef 5:11","2 Joh 1:11","Openb 2:26"]}],"5":[{"kopje":"Vraag","refs":["Num 27:21","Joz 9:14","Richt 1:1","Richt 20:18","Richt 20:23","Richt 20:29","1 Sam 14:18","1 Sam 23:2","1 Sam 23:4","1 Sam 23:9-12","1 Sam 30:8","2 Kon 1:3","2 Kon 3:11","1 Kron 10:13","2 Kron 18:4","2 Kron 18:5","Spr 3:5","Spr 3:6","Jer 21:2","Jer 42:2-6","Ezech 14:3","Ezech 20:1-3"]}],"6":[{"kopje":"de profeten","refs":["1 Kon 18:19","2 Tim 4:3"]},{"kopje":"Trek op","refs":["1 Kon 22:15","1 Kon 22:22","1 Kon 22:23","2 Kron 18:14","Jer 5:31","Jer 8:10","Jer 8:11","Jer 14:13","Jer 14:14","Jer 23:14-17","Jer 28:1-9","Ezech 13:7-16","Ezech 13:22","Matt 7:15","2 Petr 2:1-3","Openb 19:20"]}],"7":[{"kopje":"Is hier niet","refs":["2 Kon 3:11-13","2 Kron 18:6","2 Kro 98\">zondigen</span>.","54":"<span class=\"wl\" data-l=\"L1\" data-code=\"H5647\">En</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H5647\">hij</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H5647\">diende</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H1168\">Baäl</span>, <span class=\"wl\" data-l=\"L3\" data-code=\"H7812\">en</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H7812\">boog</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H7812\">zich</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H7812\">voor</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H3707\">hem</span> neer, <span class=\"wl\" data-l=\"L4\" data-code=\"H3707\">en</span> tergde <span class=\"wl\" data-l=\"L5\" data-code=\"H430\">de</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H430\">HEERE</span>, <span class=\"wl\" data-l=\"L5\" data-code=\"H430\">de</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H430\">God</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H430\">van</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H3478\">Israël</span>, <span class=\"wl\" data-l=\"L6\" data-code=\"H3478\">naar</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H3605\">alles</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H834\">wat</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H834\">zijn</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H1\">vader</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H6213\">gedaan</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H6213\">had</span>."},"koppeling_kjv":{"1":"And they <span class=\"wl wl-kjv\" data-code=\"H3427\">continued</span> <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> without <span class=\"wl wl-kjv\" data-code=\"H4421\">war</span> between <span class=\"wl wl-kjv\" data-code=\"H758\">Syria</span> and <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","2":"And it came to pass in the <span class=\"wl wl-kjv\" data-code=\"H7992\">third</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year,</span> that <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> came <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","3":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">Know</span> ye that <span class=\"wl wl-kjv\" data-code=\"H7433\">Ramoth</span> in <span class=\"wl wl-kjv\" data-code=\"H1568\">Gilead</span> is ours, and we be <span class=\"wl wl-kjv\" data-code=\"H2814\">still,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> it not out of the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H758\">Syria?</span>","4":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat,</span> Wilt thou <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> with me to <span class=\"wl wl-kjv\" data-code=\"H4421\">battle</span> to <span class=\"wl wl-kjv\" data-code=\"H7433\">Ramothgilead?</span> And <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> I am as <span class=\"wl wl-kjv\" data-code=\"H3644\">thou</span> art, my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> as thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> my <span class=\"wl wl-kjv\" data-code=\"H5483\">horses</span> as thy <span class=\"wl wl-kjv\" data-code=\"H5483\">horses.</span>","5":"And <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H1875\">Enquire,</span> I pray thee, at the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> to <span class=\"wl wl-kjv\" data-code=\"H3117\">day.</span>","6":"Then the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H6908\">gathered</span> ➔ the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> <span class=\"wl wl-kjv\" data-code=\"H6908\">together,</span> about <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, Shall I <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> against <span class=\"wl wl-kjv\" data-code=\"H7433\">Ramothgilead</span> to <span class=\"wl wl-kjv\" data-code=\"H4421\">battle,</span> or shall I <span class=\"wl wl-kjv\" data-code=\"H2308\">forbear?</span> And they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Go <span class=\"wl wl-kjv\" data-code=\"H5927\">up;</span> for the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> shall <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> it into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span>","7":"And <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Is there not here a <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5750\">besides,</span> that we might <span class=\"wl wl-kjv\" data-code=\"H1875\">enquire</span> of him?","8":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat,</span> There is yet <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> <span class=\"wl wl-kjv\" data-code=\"H4321\">Micaiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3229\">Imlah,</span> by whom we may <span class=\"wl wl-kjv\" data-code=\"H1875\">enquire</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> but I <span class=\"wl wl-kjv\" data-code=\"H8130\">hate</span> him; for he doth not <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesy</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> concerning me, but <span class=\"wl wl-kjv\" data-code=\"H7451\">evil.</span> And <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Let not the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> so.","9":"Then the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> <span class=\"wl wl-kjv\" data-code=\"H259\">an</span> <span class=\"wl wl-kjv\" data-code=\"H5631\">officer,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H4116\">Hasten</span> hither <span class=\"wl wl-kjv\" data-code=\"H4321\">Micaiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3229\">Imlah.</span>","10":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> and <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> <span class=\"wl wl-kjv\" data-code=\"H376\">each</span> on his <span class=\"wl wl-kjv\" data-code=\"H3678\">throne,</span> having put <span class=\"wl wl-kjv\" data-code=\"H3847\">on</span> their <span class=\"wl wl-kjv\" data-code=\"H899\">robes,</span> in a void <span class=\"wl wl-kjv\" data-code=\"H1637\">place</span> in the <span class=\"wl wl-kjv\" data-code=\"H6607\">entrance</span> of the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> of <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria;</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesied</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> them.","11":"And <span class=\"wl wl-kjv\" data-code=\"H6667\">Zedekiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3668\">Chenaanah</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> him <span class=\"wl wl-kjv\" data-code=\"H7161\">horns</span> of <span class=\"wl wl-kjv\" data-code=\"H1270\">iron:</span> and he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> With these shalt thou <span class=\"wl wl-kjv\" data-code=\"H5055\">push</span> the <span class=\"wl wl-kjv\" data-code=\"H758\">Syrians,</span> until thou have <span class=\"wl wl-kjv\" data-code=\"H3615\">consumed</span> them.","12":"And all the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesied</span> so, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H7433\">Ramothgilead,</span> and <span class=\"wl wl-kjv\" data-code=\"H6743\">prosper:</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> it into the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hand.</span>","13":"And the <span class=\"wl wl-kjv\" data-code=\"H4397\">messenger</span> that was <span class=\"wl wl-kjv\" data-code=\"H1980\">gone</span> to <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> <span class=\"wl wl-kjv\" data-code=\"H4321\">Micaiah</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Behold now, the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> declare <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> with <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth:</span> let thy <span class=\"wl wl-kjv\" data-code=\"H1697\">word,</span> I pray thee, be like the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of them, and <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> that which is <span class=\"wl wl-kjv\" data-code=\"H2896\">good.</span>","14":"And <span class=\"wl wl-kjv\" data-code=\"H4321\">Micaiah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> As the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> what the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> unto me, that will I <span class=\"wl wl-kjv\" data-code=\"H1696\">speak.</span>","15":"So he <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span> And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H4321\">Micaiah,</span> shall we <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> against <span class=\"wl wl-kjv\" data-code=\"H7433\">Ramothgilead</span> to <span class=\"wl wl-kjv\" data-code=\"H4421\">battle,</span> or shall we <span class=\"wl wl-kjv\" data-code=\"H2308\">forbear?</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">answered</span> him, <span class=\"wl wl-kjv\" data-code=\"H5927\">Go,</span> and <span class=\"wl wl-kjv\" data-code=\"H6743\">prosper:</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> it into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span>","16":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, How many <span class=\"wl wl-kjv\" data-code=\"H6471\">times</span> shall I <span class=\"wl wl-kjv\" data-code=\"H7650\">adjure</span> thee that thou <span class=\"wl wl-kjv\" data-code=\"H1696\">tell</span> me nothing but that which is <span class=\"wl wl-kjv\" data-code=\"H571\">true</span> in the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD?</span>","17":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H6327\">scattered</span> upon the <span class=\"wl wl-kjv\" data-code=\"H2022\">hills,</span> as <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep</span> that have not a <span class=\"wl wl-kjv\" data-code=\"H7462\">shepherd:</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> These have no <span class=\"wl wl-kjv\" data-code=\"H113\">master:</span> let them <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> to his <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> in <span class=\"wl wl-kjv\" data-code=\"H7965\">peace.</span>","18":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat,</span> Did I not <span class=\"wl wl-kjv\" data-code=\"H559\">tell</span> thee that he would <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesy</span> no <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> concerning me, but <span class=\"wl wl-kjv\" data-code=\"H7451\">evil?</span>","19":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">Hear</span> thou therefore the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> I <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">sitting</span> on his <span class=\"wl wl-kjv\" data-code=\"H3678\">throne,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">standing</span> by him on his right <span class=\"wl wl-kjv\" data-code=\"H3225\">hand</span> and on his <span class=\"wl wl-kjv\" data-code=\"H8040\">left.</span>","20":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Who shall <span class=\"wl wl-kjv\" data-code=\"H6601\">persuade</span> <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab,</span> that he may go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> and <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> at <span class=\"wl wl-kjv\" data-code=\"H7433\">Ramothgilead?</span> And one <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> on this <span class=\"wl wl-kjv\" data-code=\"H3541\">manner,</span> and another <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> on that <span class=\"wl wl-kjv\" data-code=\"H3541\">manner.</span>","21":"And there came <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> a <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit,</span> and <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will <span class=\"wl wl-kjv\" data-code=\"H6601\">persuade</span> him.","22":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Wherewith? And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will go <span class=\"wl wl-kjv\" data-code=\"H3318\">forth,</span> and I will be a <span class=\"wl wl-kjv\" data-code=\"H8267\">lying</span> <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> in the <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> of all his <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets.</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Thou shalt <span class=\"wl wl-kjv\" data-code=\"H6601\">persuade</span> him, and <span class=\"wl wl-kjv\" data-code=\"H3201\">prevail</span> also: go <span class=\"wl wl-kjv\" data-code=\"H3318\">forth,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> so.","23":"Now therefore, behold, the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> a <span class=\"wl wl-kjv\" data-code=\"H8267\">lying</span> <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> in the <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> of all these thy <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> concerning thee.","24":"But <span class=\"wl wl-kjv\" data-code=\"H6667\">Zedekiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3668\">Chenaanah</span> went <span class=\"wl wl-kjv\" data-code=\"H5066\">near,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> <span class=\"wl wl-kjv\" data-code=\"H4321\">Micaiah</span> on the <span class=\"wl wl-kjv\" data-code=\"H3895\">cheek,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Which <span class=\"wl wl-kjv\" data-code=\"H335\">way</span> <span class=\"wl wl-kjv\" data-code=\"H5674\">went</span> the <span class=\"wl wl-kjv\" data-code=\"H7307\">Spirit</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> from me to <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> unto thee?","25":"And <span class=\"wl wl-kjv\" data-code=\"H4321\">Micaiah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Behold, thou shalt <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> when thou shalt <span class=\"wl wl-kjv\" data-code=\"H935\">go</span> into an <span class=\"wl wl-kjv\" data-code=\"H2315\">inner</span> <span class=\"wl wl-kjv\" data-code=\"H2315\">chamber</span> to <span class=\"wl wl-kjv\" data-code=\"H2247\">hide</span> thyself.","26":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">Take</span> <span class=\"wl wl-kjv\" data-code=\"H4321\">Micaiah,</span> and carry him <span class=\"wl wl-kjv\" data-code=\"H7725\">back</span> unto <span class=\"wl wl-kjv\" data-code=\"H526\">Amon</span> the <span class=\"wl wl-kjv\" data-code=\"H8269\">governor</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and to <span class=\"wl wl-kjv\" data-code=\"H3101\">Joash</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son;</span>","27":"And <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">Put</span> this fellow in the <span class=\"wl wl-kjv\" data-code=\"H1004\">prison,</span> and <span class=\"wl wl-kjv\" data-code=\"H398\">feed</span> him with <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> of <span class=\"wl wl-kjv\" data-code=\"H3906\">affliction</span> and with <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> of <span class=\"wl wl-kjv\" data-code=\"H3906\">affliction,</span> until I <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> in <span class=\"wl wl-kjv\" data-code=\"H7965\">peace.</span>","28":"And <span class=\"wl wl-kjv\" data-code=\"H4321\">Micaiah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> If thou <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> at <span class=\"wl wl-kjv\" data-code=\"H7725\">all</span> in <span class=\"wl wl-kjv\" data-code=\"H7965\">peace,</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath not <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> by me. And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">Hearken,</span> O <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> every one of you.","29":"So the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> and <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H7433\">Ramothgilead.</span>","30":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat,</span> I will <span class=\"wl wl-kjv\" data-code=\"H2664\">disguise</span> myself, and <span class=\"wl wl-kjv\" data-code=\"H935\">enter</span> into the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle;</span> but put thou <span class=\"wl wl-kjv\" data-code=\"H3847\">on</span> thy <span class=\"wl wl-kjv\" data-code=\"H899\">robes.</span> And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H2664\">disguised</span> himself, and <span class=\"wl wl-kjv\" data-code=\"H935\">went</span> into the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle.</span>","31":"But the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H758\">Syria</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> his <span class=\"wl wl-kjv\" data-code=\"H7970\">thirty</span> and <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H8269\">captains</span> that had rule over his <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H3898\">Fight</span> neither with <span class=\"wl wl-kjv\" data-code=\"H6996\">small</span> nor <span class=\"wl wl-kjv\" data-code=\"H1419\">great,</span> save only with the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","32":"And it came to pass, when the <span class=\"wl wl-kjv\" data-code=\"H8269\">captains</span> of the <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat,</span> that they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Surely it is the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span> And they turned <span class=\"wl wl-kjv\" data-code=\"H5493\">aside</span> to <span class=\"wl wl-kjv\" data-code=\"H3898\">fight</span> against him: and <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat</span> cried <span class=\"wl wl-kjv\" data-code=\"H2199\">out.</span>","33":"And it came to pass, when the <span class=\"wl wl-kjv\" data-code=\"H8269\">captains</span> of the <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">perceived</span> that it was not the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> that they turned <span class=\"wl wl-kjv\" data-code=\"H7725\">back</span> from <span class=\"wl wl-kjv\" data-code=\"H310\">pursuing</span> him.","34":"And a certain <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H4900\">drew</span> a <span class=\"wl wl-kjv\" data-code=\"H7198\">bow</span> at a <span class=\"wl wl-kjv\" data-code=\"H8537\">venture,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> between the <span class=\"wl wl-kjv\" data-code=\"H1694\">joints</span> of the <span class=\"wl wl-kjv\" data-code=\"H8302\">harness:</span> wherefore he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the driver of his <span class=\"wl wl-kjv\" data-code=\"H7395\">chariot,</span> <span class=\"wl wl-kjv\" data-code=\"H2015\">Turn</span> thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and carry me <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H4264\">host;</span> for I am <span class=\"wl wl-kjv\" data-code=\"H2470\">wounded.</span>","35":"And the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle</span> <span class=\"wl wl-kjv\" data-code=\"H5927\">increased</span> that <span class=\"wl wl-kjv\" data-code=\"H3117\">day:</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> was stayed <span class=\"wl wl-kjv\" data-code=\"H5975\">up</span> in his <span class=\"wl wl-kjv\" data-code=\"H4818\">chariot</span> <span class=\"wl wl-kjv\" data-code=\"H5227\">against</span> the <span class=\"wl wl-kjv\" data-code=\"H758\">Syrians,</span> and <span class=\"wl wl-kjv\" data-code=\"H4191\">died</span> at <span class=\"wl wl-kjv\" data-code=\"H6153\">even:</span> and the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> ran <span class=\"wl wl-kjv\" data-code=\"H3332\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H4347\">wound</span> into the <span class=\"wl wl-kjv\" data-code=\"H2436\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H7393\">chariot.</span>","36":"And there <span class=\"wl wl-kjv\" data-code=\"H5674\">went</span> a <span class=\"wl wl-kjv\" data-code=\"H7440\">proclamation</span> throughout the <span class=\"wl wl-kjv\" data-code=\"H4264\">host</span> about the going <span class=\"wl wl-kjv\" data-code=\"H935\">down</span> of the <span class=\"wl wl-kjv\" data-code=\"H8121\">sun,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> to his <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> to his own <span class=\"wl wl-kjv\" data-code=\"H776\">country.</span>","37":"So the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">died,</span> and was <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> to <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria;</span> and they <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> in <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria.</span>","38":"And one <span class=\"wl wl-kjv\" data-code=\"H7857\">washed</span> the <span class=\"wl wl-kjv\" data-code=\"H7393\">chariot</span> in the <span class=\"wl wl-kjv\" data-code=\"H1295\">pool</span> of <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria;</span> and the <span class=\"wl wl-kjv\" data-code=\"H3611\">dogs</span> licked <span class=\"wl wl-kjv\" data-code=\"H3952\">up</span> his <span class=\"wl wl-kjv\" data-code=\"H1818\">blood;</span> and they <span class=\"wl wl-kjv\" data-code=\"H7364\">washed</span> his <span class=\"wl wl-kjv\" data-code=\"H2185\">armour;</span> according unto the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> which he <span class=\"wl wl-kjv\" data-code=\"H1696\">spake.</span>","39":"Now the <span class=\"wl wl-kjv\" data-code=\"H3499\">rest</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">acts</span> of <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab,</span> and all that he <span class=\"wl wl-kjv\" data-code=\"H6213\">did,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8127\">ivory</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> which he <span class=\"wl wl-kjv\" data-code=\"H1129\">made,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> that he <span class=\"wl wl-kjv\" data-code=\"H1129\">built,</span> are they not <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in the <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">chronicles</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel?</span>","40":"So <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> <span class=\"wl wl-kjv\" data-code=\"H7901\">slept</span> with his <span class=\"wl wl-kjv\" data-code=\"H1\">fathers;</span> and <span class=\"wl wl-kjv\" data-code=\"H274\">Ahaziah</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> in his stead.","41":"And <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H609\">Asa</span> began to <span class=\"wl wl-kjv\" data-code=\"H4427\">reign</span> over <span
