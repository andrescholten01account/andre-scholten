 amandelroede. En de HEERE zei tegen mij: U hebt goed gezien; want Ik zal wakker zijn over Mijn woord, om dat te doen. En het woord van de HEERE kwam voor de tweede keer tot mij, en zei: Wat ziet u? En ik zei: Ik zie een ziedende pot, waarvan het voorste deel tegen het noorden gekeerd is.","2 Tess 2:3":"Laat niemand u op enige manier verleiden; want die dag komt niet, tenzij eerst de afval gekomen is, en de mens van de zonde geopenbaard wordt, de zoon van het verderf;","Hand 25:23":"De volgende dag dan, toen Agrippa gekomen was en Bernice, met grote pracht, en zij het gerechtsgebouw waren binnengegaan met de aanvoerders en de mannen die de voornaamsten van de stad waren, werd Paulus op bevel van Festus voorgebracht.","Jes 5:18-25":"Wee hun die de ongerechtigheid trekken met koorden van ijdelheid, en de zonde als met dikke wagentouwen! Die zeggen: Laat Hij haasten, laat Hij Zijn werk bespoedigen, opdat wij het zien; en laat het raadsbesluit van de Heilige van Israël naderen en komen, opdat wij het vernemen! Wee hun die het kwade goed noemen, en het goede kwaad; die duisternis tot licht stellen, en het licht tot duisternis; die het bittere tot zoet stellen, en het zoete tot bitterheid!","1 Kor 15:33":"Dwaal niet. Slechte omgang bederft goede zeden.","2 Kron 16:2-9":"Toen bracht Asa het zilver en het goud voort, uit de schatten van het huis van de HEERE en van het huis van de koning, en zond het tot Benhadad, de koning van Syrië, die in Damaskus woonde, en zei: Er is een verbond tussen mij en u, en tussen mijn vader en uw vader; zie, ik zend u zilver en goud; ga heen, verbreek uw verbond met Baësa, de koning van Israël, zodat hij van tegen mij aftrekt. En Benhadad hoorde naar de koning Asa, en zond de aanvoerders van de legers die hij had, tegen de steden van Israël, en zij sloegen Ijon, en Dan, en Abel-Maim, en alle schatsteden van Naftali.","1 Kon 18:36":"En het gebeurde, toen men het spijsoffer offerde, dat de profeet Elia naderde en zei: HEERE, God van Abraham, Izak en Israël, laat het vandaag bekend worden, dat U God bent in Israël, en ik Uw knecht; en dat ik al deze dingen naar Uw woord gedaan heb.","Hand 21:11":"En hij kwam naar ons toe, nam de gordel van Paulus, bond daarmee zijn eigen handen en voeten, en zei: Dit zegt de Heilige Geest: De man van wie deze gordel is, zullen de Joden zo te Jeruzalem binden en overleveren in de handen van de heidenen.","Jer 18:20":"Zal dan kwaad voor goed vergolden worden? want zij hebben mijn ziel een kuil gegraven; gedenk dat ik voor Uw aangezicht gestaan heb om goed voor hen te spreken, om Uw grimmigheid van hen af te wenden.","1 Kon 16:27":"Het overige nu van de geschiedenis van Omri, wat hij gedaan heeft, en zijn macht die hij getoond heeft, is dat niet geschreven in het boek van de kronieken van de koningen van Israël?","Klaagl 3:53-55":"Tsade. Zij hebben mijn leven in een kuil uitgeroeid, en zij hebben een steen op mij geworpen. Tsade. Het water zwom over mijn hoofd; ik zei: Ik ben afgesneden! Koph. HEERE! Ik heb Uw Naam aangeroepen uit de onderste kuil.","Luk 18:12":"Ik vast tweemaal per week; ik geef tienden van alles wat ik bezit.","1 Kon 22:31-34":"De koning van Syrië nu had zijn tweeëndertig aanvoerders van de wagens geboden en gezegd: U zult niet vechten tegen klein of groot, maar alleen tegen de koning van Israël. Het gebeurde dan, toen de aanvoerders van de wagens Josafat zagen, dat zij zeiden: Zeker, dat is de koning van Israël; en zij keerden zich naar hem toe om te strijden; maar Josafat riep het uit. En het gebeurde, toen de aanvoerders van de wagens zagen dat hij de koning van Israël niet was, dat zij zich van hem afkeerden en niet meer achtervolgden.","2 Kron 25:7":"Maar er kwam een man van God tot hem, en hij zei: O koning! Laat het leger van Israël niet met u meegaan; want de HEERE is niet met Israël, met al de kinderen van Efraïm.","2 Kor 6:11":"Onze mond is opengegaan tegen u, Korinthiërs, ons hart is verruimd.","2 Petr 2:5":"en de oude wereld niet gespaard heeft, maar Noach, de prediker van de gerechtigheid, met zeven anderen bewaard heeft, toen Hij de zondvloed over de wereld van de goddelozen bracht;","Gal 1:10":"Want predik ik nu de mensen, of God? Of zoek ik mensen te behagen? Want als ik nog mensen behaagde, zou ik geen dienstknecht van Christus zijn.","1 Sam 15:5":"Toen Saul tot aan de stad Amalek kwam, legde hij een hinderlaag in het dal.","Fil 2:15":"Opdat u onberispelijk en oprecht mag zijn, kinderen van God, onstraffelijk te midden van een krom en verdraaid geslacht, onder wie u schijnt als lichten in de wereld;","Jer 29:26":"De HEERE heeft u tot priester gesteld, in plaats van de priester Jojada, opdat u opzichters zou zijn in het huis van de HEERE over iedere man die onzinnig is en zich voor een profeet uitgeeft, om die te stellen in de gevangenis en in het blok.","Ezech 1:4":"Toen zag ik, en zie, een stormwind kwam van het noorden af, een grote wolk, en een vuur dat zichzelf omvatte, en een glans was rondom die wolk; en uit het midden daarvan was iets als de kleur van amber, uit het midden van het vuur.","Zach 2:9":"Want zie, Ik zal Mijn hand over hen bewegen, en zij zullen hun knechten een roof wezen. Zo zult u weten, dat de HEERE van de heerscharen mij gezonden heeft.","2 Kon 8:21":"Daarom trok Joram over naar Zaïr, en alle wagens met hem; en hij stond 's nachts op, en versloeg de Edomieten, die hem omsingeld hadden, en ook de aanvoerders van de wagens; en het volk vluchtte naar zijn tenten.","2 Kon 21:9":"Maar zij luisterden niet; want Manasse deed hen dwalen, zodat zij erger deden dan de heidenvolken, die de HEERE voor de kinderen van Israël weggevaagd had.","Ezech 13:1-9":"En het woord van de HEERE gebeurde tot mij, en zei: Mensenkind, profeteer tegen de profeten van Israël, die profeteren, en zeg tegen hen die uit hun eigen hart profeteren: Hoor het woord van de HEERE. Zo zegt de Heere HEERE: Wee over die dwaze profeten, die hun eigen geest nawandelen, en wat zij niet gezien hebben!","Ezech 22:27":"Haar vorsten zijn in haar midden als wolven die een prooi roven, om bloed te vergieten en om zielen te verderven, opdat zij gierigheid zouden plegen.","Jes 28:15":"Omdat u zegt: Wij hebben een verbond met de dood gemaakt, en met het rijk van de dood hebben wij een voorzichtig verdrag gemaakt; wanneer de overstromende gesel doortrekt, zal hij bij ons niet komen; want wij hebben de leugen ons tot een toevlucht gesteld, en onder de valsheid hebben wij ons verborgen.","Jer 8:10":"Daarom zal Ik hun vrouwen aan anderen geven, hun akkers aan andere bezitters; want van de kleinste tot de grootste toe pleegt ieder van hen gierigheid; van de profeet tot de priester toe bedrijft ieder van hen valsheid.","Deut 29:20":"De HEERE zal hem niet willen vergeven; maar dan zal de toorn van de HEERE en Zijn ijver roken over die man, en de hele vloek, die in dit boek geschreven is, zal op hem liggen; en de HEERE zal zijn naam van onder de hemel uitwissen.","2 Kon 8:20":"In zijn dagen kwamen de Edomieten in opstand tegen het gezag van Juda, en stelden een koning over zich aan.","Neh 9:30":"Doch U hebt geduld met hen gehad, vele jaren lang, en tegen hen getuigd door Uw Geest, door de dienst van Uw profeten, maar zij neigden hun oor niet; daarom hebt U hen gegeven in de hand van de volken van de landen.","Hand 6:4":"Maar wíj zullen ons blijven wijden aan het gebed en aan de bediening van het Woord.","Spr 10:24":"Wat de goddeloze vreest, dat zal hem overkomen; maar wat de rechtvaardigen verlangen, zal God geven.","1 Petr 3:16":"en heb een goed geweten, opdat zij die uw goede wandel in Christus belasteren, beschaamd gemaakt worden in datgene waarin zij kwaad van u spreken, alsof u kwaaddoeners bent.","Ezech 27:25":"De schepen van Tarsis zongen van u, vanwege de onderlinge koophandel met u; en u was vervuld, en zeer verheerlijkt in het hart van de zeeën.","2 Kron 18:13":"Doch Micha zei: Zo waarachtig als de HEERE leeft, wat mijn God zeggen zal, dat zal ik spreken!","Jes 65:3":"Een volk dat Mij voortdurend tergt in Mijn aangezicht, terwijl het in de hoven offert en op tichelstenen wierook brandt;","1 Kon 22:41-47":"Josafat nu, de zoon van Asa, werd koning over Juda, in het vierde jaar van Achab, de koning van Israël. Josafat was vijfendertig jaar oud toen hij koning werd, en regeerde vijfentwintig jaar te Jeruzalem; en de naam van zijn moeder was Azuba, de dochter van Silchi. En hij wandelde in heel de weg van zijn vader Asa; hij week daar niet van af, en deed wat recht was in de ogen van de HEERE.","2 Kron 19:3-11":"Toch zijn er goede dingen bij u gevonden; want u hebt de bossen uit het land weggedaan, en uw hart erop gericht om God te zoeken. Josafat nu woonde in Jeruzalem; en hij trok opnieuw uit onder het volk, van Berseba af tot het gebergte van Efraïm toe, en bracht hen terug tot de HEERE, de God van hun vaderen. En hij stelde rechters aan in het land, in alle versterkte steden van Juda, van stad tot stad.","1 Kon 16:29":"En Achab, de zoon van Omri, werd koning over Israël, in het achtendertigste jaar van Asa, de koning van Juda; en Achab, de zoon van Omri, regeerde over Israël, te Samaria, tweeëntwintig jaren.","Micha 7:2":"De goedertierene is verdwenen uit het land, en er is niemand oprecht onder de mensen; zij loeren allemaal op bloed, zij jagen, ieder op zijn broeder, met een jachtnet.","2 Kron 28:16":"In diezelfde tijd zond koning Achaz tot de koningen van Assyrië, dat zij hem zouden helpen.","1 Kon 13:20":"En het gebeurde, terwijl zij aan tafel zaten, dat het woord van de HEERE kwam tot de profeet die hem had laten terugkeren;","2 Kon 13:10":"In het zevenendertigste jaar van Joas, de koning van Juda, werd Joas, de zoon van Joahaz, koning over Israël, te Samaria, en regeerde zestien jaren.","Luk 1:67":"En Zacharias, zijn vader, werd vervuld met de Heilige Geest, en profeteerde, en zei:","Joël 2:29":"Ja, ook over de dienstknechten, en over de dienstmaagden, zal Ik in die dagen Mijn Geest uitgieten.","Matt 22:16":"En zij stuurden hun discipelen naar Hem toe, met de Herodianen, en zeiden: Meester! wij weten dat U waarachtig bent, en de weg van God in waarheid leert, en U vraagt naar niemand; want U kijkt niet naar de persoon van de mensen.","Joz 9:14":"Toen namen de mannen van hun reiskost; en zij vroegen het de mond van de HEERE niet.","1 Sam 14:24":"En de mannen van Israël werden uitgeput op die dag, want Saul had het volk bezworen en gezegd: Vervloekt is de man die voedsel eet vóór de avond, totdat ik mij op mijn vijanden gewroken heb! Daarom proefde heel het volk geen voedsel.","2 Sam 19:8":"Toen stond de koning op, en ging in de poort zitten. En zij lieten heel het volk weten: Zie, de koning zit in de poort. Toen kwam heel het volk voor de koning, maar Israël was gevlucht, ieder naar zijn tent.","1 Kon 22:14-28":"Doch Micha zei: Zo waarachtig als de HEERE leeft, wat de HEERE tegen mij zeggen zal, dat zal ik spreken. Toen hij bij de koning gekomen was, zei de koning tegen hem: Micha, zullen wij naar Ramoth in Gilead ten strijde trekken, of zullen wij het nalaten? En hij zei tegen hem: Trek op, en u zult voorspoedig zijn, want de HEERE zal ze in de hand van de koning geven. En de koning zei tegen hem: Tot hoeveel keer zal ik u bezweren, dat u tegen mij niet anders spreekt dan de waarheid, in de Naam van de HEERE?","1 Sam 19:1-6":"Daarom sprak Saul tot zijn zoon Jonathan en tot al zijn knechten, om David te doden. Doch Jonathan, Sauls zoon, had groot welgevallen aan David. En Jonathan verkondigde het David en zei: Mijn vader Saul zoekt u te doden; nu dan, wees toch morgenochtend op uw hoede, en blijf op een geheime plaats, en verberg u. Doch ik zal uitgaan, en aan de hand van mijn vader staan op het veld waar u zult zijn; en ik zal met mijn vader over u spreken, en zien wat het is; dat zal ik u meedelen.","1 Sam 20:4-9":"Jonathan nu zei tegen David: Wat uw ziel zegt, dat zal ik voor u doen. En David zei tegen Jonathan: Zie, morgen is de nieuwe maan, wanneer ik zeker met de koning zou aanzitten om te eten; zo laat mij gaan, dat ik mij op het veld verberg tot aan de derde avond. Als uw vader mij zeker mist, zo zult u zeggen: David heeft mij met ernst gevraagd of hij naar zijn stad Bethlehem mocht lopen; want daar is een jaarlijks offer voor het hele geslacht.","Micha 1:2":"Hoort, u volken allemaal! Merk op, u aarde, alsook van die volheid! De Heere HEERE nu zal tot een getuige zijn tegen u, de Heere uit de tempel van Zijn heiligheid.","Ezech 33:17":"Toch zeggen de kinderen van uw volk: De weg van de Heere is niet recht; terwijl het toch hun eigen weg is die niet recht is.","1 Kon 14:2":"En Jerobeam zei tegen zijn vrouw: Sta nu op, en verkleed u, zodat men niet merkt dat u Jerobeams vrouw bent, en ga naar Silo. Zie, daar is de profeet Ahia, die tegen mij gezegd heeft dat ik koning zou zijn over dit volk.","Jer 1:4-10":"Het woord van de HEERE dan kwam tot mij, en zei: Voordat Ik u in moeders buik vormde, heb Ik u gekend, en voordat u uit de baarmoeder voortkwam, heb Ik u geheiligd; Ik heb u de volken tot een profeet gesteld. Toen zei ik: Ach, Heere HEERE! zie, ik kan niet spreken, want ik ben jong.","Ex 16:3":"En de Israëlieten zeiden tegen hen: Was ons maar in Egypte gestorven door de hand van de HEERE, toen wij bij de vleespotten zaten, toen wij tot verzadiging brood aten! Want u hebt ons naar deze woestijn gebracht, om deze hele gemeente door honger te laten sterven.","2 Kron 18:20-22":"Toen kwam een geest naar voren, en stond voor het aangezicht van de HEERE, en zei: Ik zal hem overreden. En de HEERE zei tegen hem: Waarmee? En Hij zei: Ik zal uitgaan, en een leugengeest zijn in de mond van al zijn profeten. En Hij zei: U zult overreden, en zult het ook klaarspelen; ga uit, en doe zo. Nu dan, zie, de HEERE heeft een leugengeest in de mond van deze uw profeten gegeven, en de HEERE heeft kwaad over u gesproken.","2 Kon 2:9":"Het gebeurde nu, toen zij overgekomen waren, dat Elia zei tegen Elisa: Vraag wat ik voor u doen zal, voordat ik van bij u weggenomen word. En Elisa zei: Laat toch een dubbel deel van uw geest op mij zijn!","Jes 6:3":"En de een riep tot de ander en zei: Heilig, heilig, heilig is de HEERE van de heerscharen! De hele aarde is vol van Zijn heerlijkheid!","1 Kon 22:17-23":"En hij zei: Ik zag heel Israël verstrooid op de bergen, als schapen die geen herder hebben; en de HEERE zei: Dezen hebben geen heer; ieder keert terug naar zijn huis in vrede. Toen zei de koning van Israël tegen Josafat: Heb ik u niet gezegd: Hij zal over mij niets goeds, maar kwaad profeteren? Verder zei hij: Daarom, hoor het woord van de HEERE: Ik zag de HEERE zitten op Zijn troon, en heel het hemelse leger stond naast Hem, aan Zijn rechterhand en aan Zijn linkerhand.","2 Kron 18:31":"Het gebeurde dan, toen de aanvoerders van de wagens Josafat zagen, dat zij zeiden: Dat is de koning van Israël; en zij trokken om hem heen om te strijden; maar Josafat riep, en de HEERE hielp hem, en God bracht hen ertoe van hem weg te trekken.","1 Kon 21:29":"Hebt u gezien dat Achab zich vernedert voor Mijn aangezicht? Omdat hij zich vernedert voor Mijn aangezicht, zal Ik dat kwaad in zijn dagen niet brengen; in de dagen van zijn zoon zal Ik dat kwaad over zijn huis brengen.","Hand 5:21":"Toen zij dit gehoord hadden, gingen zij tegen de vroege morgen de tempel in, en leerden. Maar de hogepriester kwam, en die met hem waren, en riepen de raad samen, en alle oudsten van de kinderen van Israël, en zonden naar de kerker om hen te halen.","Jes 50:6":"Ik geef Mijn rug aan hen die Mij slaan, en Mijn wangen aan hen die Mij het haar uitplukken; Mijn gezicht verberg Ik niet voor smaad en speeksel.","Ps 127:2":"Het is tevergeefs dat u vroeg opstaat, laat opblijft, brood eet met zorgen erbij; het is zo, dat Hij het aan hen die Hij liefheeft, geeft als in de slaap.","2 Kon 17:9":"En de kinderen van Israël hadden dingen die niet recht zijn tegen de HEERE, hun God, verborgen gedaan; en hadden zich hoogten gebouwd in al hun steden, van de wachttoren af tot de versterkte stad toe.","Jes 3:11":"Wee de goddeloze, het zal hem kwalijk gaan, want de vergelding van zijn handen zal hem overkomen.","2 Kon 6:17":"En Elisa bad, en zei: HEERE, open toch zijn ogen, dat hij ziet! En de HEERE opende de ogen van de knecht, dat hij zag; en zie, de berg was vol vurige paarden en wagens rondom Elisa.","2 Kron 18:8":"Toen riep de koning van Israël een kamerling en zei: Haal snel Micha, de zoon van Jimla.","Gen 40:8":"En zij zeiden tegen hem: Wij hebben een droom gehad, en er is niemand die hem uitlegt. En Jozef zei tegen hen: Zijn de uitleggingen niet van God? Vertel ze mij toch.","1 Sam 8:20":"en wij zullen ook zijn zoals alle volken; en onze koning zal ons richten, en hij zal voor ons uit gaan, en hij zal onze oorlogen voeren.","Ps 106:24":"Zij versmaadden ook het gewenste land; zij geloofden Zijn woord niet.","Ezech 44:15":"Maar de Levitische priesters, de kinderen van Zadok, die de wacht van Mijn heiligdom in acht genomen hebben, toen de kinderen van Israël van Mij afdwaalden, die zullen tot Mij naderen om Mij te dienen; en zullen voor Mijn aangezicht staan om Mij het vette en het bloed te offeren, spreekt de Heere HEERE;","Luk 12:1":"Ondertussen, toen er vele duizenden mensen uit de menigte bijeengebracht waren, zodat zij elkaar vertraden, begon Hij tegen Zijn discipelen te zeggen: Let vooral op uzelf voor het zuurdeeg van de Farizeeën, dat is huichelarij.","2 Kron 18:26":"En u zult zeggen: Zo zegt de koning: Zet deze man in de gevangenis, en geef hem brood en water van ellende te eten, totdat ik met vrede terugkom.","Job 33:14-16":"Maar God spreekt eens of tweemaal; doch men let daar niet op. In de droom, door het gezicht 's nachts, als een diepe slaap op de mensen valt, in de sluimering op het leger; Dan openbaart Hij het voor het oor der mensen, en Hij verzegelt hun kastijding;","2 Sam 23:3":"De God van Israël heeft gezegd, de Rotssteen van Israël heeft tot mij gesproken: Er zal een Heerser zijn over de mensen, een Rechtvaardige, een Heerser in de vreze van God.","Rom 3:5":"Als nu onze ongerechtigheid de gerechtigheid van God bevestigt, wat zullen wij zeggen? Is God onrechtvaardig, als Hij toorn over ons brengt? (Ik spreek naar de mens.)","Ps 101:3":"Ik zal geen slechte zaak voor mijn ogen stellen; ik haat het doen van de afvalligen, het zal mij niet aankleven.","Job 6:10":"Dat zou nog mijn troost zijn, en zou mij verkwikken in de weedom, zo Hij niet spaarde; want ik heb de redenen van de Heilige niet verborgen gehouden.","1 Kon 18:37":"Antwoord mij, HEERE, antwoord mij; opdat dit volk erkent dat U, HEERE, die God bent, en dat U hun hart weer terug hebt gebracht.","Micha 4:13":"Maak u op en dors, dochter van Sion! Want Ik zal uw hoorn ijzer maken, en uw hoeven koper maken, en u zult veel volken verpletteren; en Ik zal hun winst aan de HEERE toewijden, en hun bezit aan de Heere van de hele aarde.","Job 34:7":"Wat man is er, gelijk Job? Hij drinkt de bespotting in als water;","Ps 103:21":"Loof de HEERE, al Zijn heerscharen! U Zijn dienaars, die Zijn welbehagen doet!","Mark 12:37":"David zelf noemt Hem dan zijn Heere, en hoe is Hij dan zijn Zoon? En de menigte hoorde Hem graag.","Ps 101:8":"Elke morgen zal ik alle goddelozen van het land verdelgen, om uit de stad van de HEERE alle werkers van de ongerechtigheid uit te roeien.","Spr 29:1":"Een man die, vaak bestraft, zijn nek verhardt, zal plotseling verbroken worden, zodat er geen genezing meer mogelijk is.","Micha 4:14":"Nu, verzamel u met benden, dochter van de bende, hij heeft een belegering tegen ons gelegd; zij zullen de rechter van Israël met de roede op het kinnebak slaan.","Hand 5:18":"en zij sloegen hun handen aan de apostelen, en zetten hen in de gemeenschappelijke gevangenis.","1 Kon 22:1-4":"En zij bleven drie jaar stil, zodat er geen oorlog was tussen Syrië en Israël. En het gebeurde in het derde jaar, dat Josafat, de koning van Juda, naar de koning van Israël afkwam. Toen zei de koning van Israël tegen zijn knechten: Weet u dat Ramoth in Gilead van ons is? En wij blijven stil, zonder het uit de hand van de koning van Syrië te nemen.","Matt 11:8":"Maar wat bent u uitgegaan te zien? Een mens, met zachte klederen bekleed? Zie, wie zachte klederen dragen, zijn in de huizen van koningen.","1 Kon 18:29":"En het gebeurde, toen de middag voorbij was, dat zij profeteerden totdat men het spijsoffer zou offeren; maar er was geen stem, en geen die antwoordde, en geen die er acht op sloeg.","Jer 50:24":"Ik heb u een strik gesteld, en daardoor bent u ook gevangen, o Babel! Zonder dat u het wist; u bent gevonden, en ook gegrepen, omdat u zich tegen de HEERE in strijd gemengd hebt.","1 Kon 12:16":"Toen heel Israël zag dat de koning niet naar hen hoorde, gaf het volk de koning antwoord terug en zei: Wat deel hebben wij aan David? Ja, wij hebben geen erfdeel aan de zoon van Isaï; naar uw tenten, o Israël! Zie nu naar uw eigen huis om, o David! Zo ging Israël naar zijn tenten.","Hand 19:13":"En sommigen van de Joden die rondtrokken, en die duivelbezweerders waren, hebben zich eraan gewaagd de Naam van de Heere Jezus te noemen over hen die boze geesten hadden, en zeiden: Wij bezweren u bij Jezus, Die Paulus predikt!","Jona 1:1":"Het woord van de HEERE gebeurde tot Jona, de zoon van Amitthai, en Hij zei:","Matt 26:45":"Toen kwam Hij bij Zijn discipelen en zei tegen hen: Slaapt nu maar door en rust; zie, het uur is nabij gekomen, en de Zoon des mensen wordt overgeleverd in de handen van de zondaars.","1 Tim 1:9":"En als hij dit weet, dat de wet niet gemaakt is voor de rechtvaardige, maar voor de onrechtvaardigen en de weerspannigen, de goddelozen en de zondaars, de onheiligen en de ongodsdienstigen, de vadermoordenaars en de moedermoordenaars, de doodslagers,","Jer 29:21":"Zo zegt de HEERE van de heerscharen, de God van Israël, over Achab, zoon van Kolaja, en over Zedekia, zoon van Maaseja, die u in Mijn Naam leugenachtig profeteren: Ziet, Ik zal hen geven in de hand van Nebukadnezar, de koning van Babel, en hij zal hen voor uw ogen doden.","Jes 8:11":"Want zo heeft de HEERE tegen mij gezegd, met een sterke hand, en Hij onderwees mij om niet te wandelen op de weg van dit volk, en zei:","2 Kon 3:9":"Zo trok de koning van Israël op, en de koning van Juda, en de koning van Edom; en toen zij zeven dagreizen omgetrokken waren, had het leger en het vee dat hen volgde, geen water.","2 Sam 12:29":"Toen verzamelde David al het volk, en trok naar Rabba; en hij streed tegen haar, en nam haar in.","Ezech 2:4":"En deze kinderen zijn hard van gezicht, en stijf van hart; Ik zend u tot hen, en u zult tegen hen zeggen: Zo zegt de Heere HEERE!","2 Kor 11:13-15":"Want zulke valse apostelen zijn bedrieglijke arbeiders, die zich veranderen in apostelen van Christus. En het is geen wonder, want de satan zelf verandert zich in een engel van het licht. Zo is het dan niets groots, als ook zijn dienaars zich veranderen als waren zij dienaars van de gerechtigheid; van wie het einde zal zijn naar hun werken.","Ps 139:22":"Ik haat hen met volkomen haat, tot vijanden zijn zij mij.","2 Kron 14:11":"En Asa riep tot de HEERE, zijn God, en zei: HEERE, het is voor U niets, te helpen hetzij de machtige, hetzij de krachteloze; help ons, o HEERE, onze God! Want wij steunen op U, en in Uw Naam zijn wij gekomen tegen deze menigte; o HEERE! U bent onze God; laat een sterfelijk mens tegen U niets vermogen.","Spr 29:12":"Een heerser die op leugentaal let, al zijn dienaars worden goddeloos.","Jer 33:1":"Verder kwam het woord van de HEERE voor de tweede keer tot Jeremia, toen hij nog opgesloten was in het voorhof van de bewaring, en Hij zei:","Deut 33:17":"Hij heeft de heerlijkheid van de eerstgeborene van zijn os, en zijn horens zijn horens van de eenhoorn; daarmee zal hij de volken samen stoten tot aan de einden van het land. Dezen nu zijn de tienduizenden van Efraïm, en dezen zijn de duizenden van Manasse!","Ef 6:21":"En opdat ook u mag weten hoe het met mij gaat; en wat ik doe, dat alles zal Tychikus u bekendmaken, de geliefde broeder en trouwe dienaar in de Heere;","Jes 60:9":"Want de eilanden zullen Mij verwachten, en de schepen van Tarsis vooreerst, om uw kinderen van verre te brengen, hun zilver en hun goud met hen, tot de Naam van de HEERE, uw God, en tot de Heilige van Israël, omdat Hij u heerlijk gemaakt heeft.","Mark 15:19":"En zij sloegen Zijn hoofd met een rietstok, en bespuwden Hem, en vielen op de knieën, en aanbaden Hem.","Rom 9:20":"Maar toch, o mens, wie bent u, die tegen God antwoordt? Zal ook het maaksel tegen hem die het gemaakt heeft zeggen: Waarom hebt u mij zo gemaakt?","Matt 27:39-44":"En zij die voorbijgingen, beschimpten Hem en schudden hun hoofd, en zeiden: U Die de tempel afbreekt en in drie dagen opbouwt, verlos Uzelf. Als U de Zoon van God bent, kom dan van het kruis af. En evenzo zeiden ook de overpriesters, met de schriftgeleerden en oudsten, en Farizeeën, terwijl zij Hem bespotten:","Hand 16:23":"En toen zij hun veel slagen gegeven hadden, wierpen zij hen in de gevangenis, en gaven de stokbewaarder het bevel hen zorgvuldig te bewaken.","1 Sam 3:20":"En heel Israël, van Dan tot Berseba toe, wist dat Samuël bevestigd was tot een profeet van de HEERE.","Jes 49:7":"Zo zegt de HEERE, de Verlosser van Israël, Zijn Heilige, tegen de veracht ziel, tegen Hem aan Wie het volk een gruwel heeft, tegen de Knecht van hen die heersen: Koningen zullen het zien en opstaan, ook vorsten, en zij zullen zich voor U buigen; om de wil van de HEERE, Die getrouw is, om de Heilige van Israël, Die U verkozen heeft.","Kol 4:7-11":"Al mijn zaken zal Tychikus u bekendmaken, de geliefde broeder, en trouwe dienaar, en mededienstknecht in de Heere; hem heb ik met dit doel naar u toe gestuurd, opdat hij weet hoe het met u gaat, en uw harten troost; samen met Onesimus, de trouwe en geliefde broeder, die één van u is; zij zullen u alles bekendmaken wat hier gebeurt.","1 Sam 8:14":"En uw akkers, en uw wijngaarden, en uw olijfgaarden, die het beste zijn, zal hij nemen, en aan zijn knechten geven.","Jer 23:34":"En aangaande de profeet, of de priester, of het volk, dat zal zeggen: De last van de HEERE; dat Ik bezoeking zal doen over die man en over zijn huis.","Ezech 3:14":"Toen hief de Geest mij op, en nam mij weg, en ik ging heen, bitter bedroefd door de hitte van mijn geest; maar de hand van de HEERE was sterk op mij.","Rom 1:26":"Daarom heeft God hen overgegeven aan oneerlijke driften; want ook hun vrouwen hebben het natuurlijke gebruik veranderd in het gebruik tegen de natuur;","Luk 12:18-20":"En hij zei: Dit zal ik doen: ik zal mijn schuren afbreken en grotere bouwen, en daar zal ik al mijn koren en mijn goederen verzamelen; en ik zal tegen mijn ziel zeggen: Ziel, je hebt veel goederen liggen, voor vele jaren; neem rust, eet, drink, wees vrolijk. Maar God zei tegen hem: Jij dwaas! Nog deze nacht zal men uw ziel van u opeisen; en wat u hebt klaargemaakt, van wie zal het dan zijn?","1 Joh 4:6":"Wij zijn uit God. Die God kent, hoort ons; die niet uit God is, hoort ons niet. Hieraan herkennen wij de geest van de waarheid en de geest van de dwaling.","Jer 7:1":"Het woord dat tot Jeremia gebeurd is, van de HEERE, en Hij zei:","Jer 38:6":"Toen namen zij Jeremia en wierpen hem in de kuil van Malchia, de zoon van Hammelech, die in het voorhof van de bewaking was, en zij lieten Jeremia met touwen zakken; in de kuil nu was geen water, maar slijk; en Jeremia zonk in het slijk.","Ezech 18:2":"Wat is er met u, dat u dit spreekwoord gebruikt over het land Israël, en zegt: De vaders hebben onrijpe druiven gegeten, en de tanden van de kinderen zijn stomp geworden?","Gen 19:5-8":"En zij riepen Lot toe, en zeiden tegen hem: Waar zijn die mannen die deze nacht bij u gekomen zijn? Breng hen naar buiten, naar ons toe, opdat wij met hen gemeenschap hebben. Toen ging Lot naar buiten naar hen toe, bij de deur, en hij sloot de deur achter zich toe; en hij zei: Mijn broeders! Doe toch geen kwaad!","Jes 57:4-11":"Over wie maakt u zich vrolijk, tegen wie sperrt u de mond wijd open en steekt u de tong lang uit? Bent u geen kinderen van de overtreding, een nageslacht van de valsheid? U die verhit bent in de eikenbossen, onder elke groene boom; die de kinderen slacht bij de beken, onder de richels van de rotsen? Aan de gladde stenen van de beek is uw deel; die, die zijn uw lot; ook stort u daarover een drankoffer uit, u offert hun een spijsoffer; zou Ik Mij hierover laten troosten?","Dan 1:17":"Aan deze vier jongemannen nu gaf God kennis en verstand in alle boeken, en wijsheid; maar Daniël gaf Hij inzicht in allerlei visioenen en dromen.","Richt 14:19":"Toen kwam de Geest van de HEERE machtig over hem, en hij ging af naar de Askelonieten, en sloeg van hen dertig man; en hij nam hun kleren, en gaf de stellen (extra) kleren aan hen die het raadsel verklaard hadden. Maar zijn toorn ontstak, en hij ging naar het huis van zijn vader.","Jer 51:3":"De schutter spant zijn boog tegen wie spant, en tegen wie zich verheft in zijn pantser; en verschoont haar jongelingen niet, verbant heel haar leger;","Zef 1:12":"En het zal gebeuren in die tijd, Ik zal Jeruzalem met lantaarns doorzoeken; en Ik zal bezoeking doen over de mannen die star geworden zijn op hun droesem, die in hun hart zeggen: De HEERE doet geen goed, en Hij doet geen kwaad.","Zach 7:12":"En zij maakten hun hart als een diamant, zodat zij niet hoorden de wet en de woorden die de HEERE van de heerscharen zond door Zijn Geest, door de dienst van de vorige profeten, waardoor een grote toorn is ontstaan van de HEERE van de heerscharen.","Joh 7:38":"Wie in Mij gelooft, zoals de Schrift zegt: stromen van levend water zullen uit zijn buik vloeien.","1 Kon 9:22":"Doch van de kinderen van Israël maakte Salomo geen slaaf; maar zij waren krijgslieden, en zijn knechten, en zijn vorsten, en zijn hoofdlieden, en de aanvoerders van zijn wagens, en van zijn ruiters.","Jes 47:10":"Want u hebt op uw boosheid vertrouwd; u hebt gezegd: Niemand ziet mij; uw wijsheid en uw kennis heeft u afkerig gemaakt; en u hebt in uw hart gezegd: Ik ben het, en niemand meer dan ik.","Hand 17:18":"En sommigen van de Epicureïsche en Stoïcijnse wijsgeren streden met hem; en sommigen zeiden: Wat wil deze praatjesmaker toch zeggen? Maar anderen zeiden: Hij lijkt een verkondiger te zijn van vreemde goden; omdat hij hun Jezus en de opstanding verkondigde.","Ps 9:21":"O HEERE! jaag hun vrees aan; laat de heidenen weten, dat zij mensen zijn. Sela.","Dan 7:25":"En het zal woorden spreken tegen de Allerhoogste, en het zal de heiligen van de hoge plaatsen uitputten, en het zal proberen de tijden en de wet te veranderen, en zij zullen in zijn hand overgegeven worden tot een tijd, en tijden, en een deel van een tijd.","Jes 7:1-9":"Het gebeurde nu in de dagen van Achaz, de zoon van Jotham, de zoon van Uzzia, de koning van Juda, dat Rezin, de koning van Syrië, en Pekah, de zoon van Remalia, de koning van Israël, optrokken naar Jeruzalem, ten oorlog tegen haar; maar hij kon met strijden niet tegen haar op. Toen men het huis van David boodschapte en zei: De Syriërs liggen bij Efraïm, bewoog zijn hart zich, en het hart van zijn volk, zoals de bomen van het woud bewegen door de wind. En de HEERE zei tegen Jesaja: Ga nu uit, Achaz tegemoet, u en uw zoon, Schear-Jaschub, aan het einde van de watergang van de bovenste vijver, aan de hoge weg van het veld van de voller;","Ex 26:30":"Dan moet u de tabernakel oprichten volgens de manier die u op de berg getoond is.","Hand 13:11":"En nu, zie, de hand van de Heere is tegen u, en u zult blind zijn, en de zon een tijdlang niet zien. En meteen viel er op hem donkerheid en duisternis; en rondlopend zocht hij mensen die hem bij de hand mochten leiden.","2 Sam 12:1":"En de HEERE zond Nathan naar David. Toen hij bij hem kwam, zei hij tegen hem: Er waren twee mannen in één stad, de één rijk en de ander arm.","2 Kron 18:23":"Toen kwam Zedekia, de zoon van Kenaana, naar voren, en sloeg Micha op de wang, en zei: Langs welke weg is de Geest van de HEERE van mij weggegaan, om u toe te spreken?","Num 22:18":"Toen antwoordde Bileam, en zei tegen de dienaren van Balak: Al zou Balak mij zijn huis vol zilver en goud geven, dan nog zou ik het bevel van de HEERE, mijn God, niet kunnen overtreden, om iets kleins of groots te doen.","2 Kron 6:33":"Hoor U dan uit de hemel, uit de vaste plaats van Uw woning, en doe naar alles waarom die vreemdeling tot U roepen zal; opdat alle volken der aarde Uw Naam kennen, om U te vrezen, zoals Uw volk Israël, en om te weten dat Uw Naam genoemd wordt over dit huis, dat ik gebouwd heb.","Job 12:16":"Bij Hem is kracht en wijsheid; van Hem is hij die dwaalt, en hij die doet dwalen.","Fil 1:12-18":"En ik wil dat u weet, broeders, dat wat er met mij gebeurd is, meer tot bevordering van het Evangelie gekomen is; Zodat mijn banden in Christus openbaar geworden zijn in het hele rechthuis, en aan alle anderen; En dat het merendeel van de broeders in de Heere, doordat zij vertrouwen gekregen hebben door mijn banden, veel overvloediger het Woord onbevreesd durven spreken.","3 Joh 1:1":"De ouderling aan de geliefde Gajus, die ik in waarheid liefheb.","Ps 108:11":"Wie zal mij voeren in een vaste stad? Wie zal mij leiden tot in Edom?","Jer 26:2":"Zo zegt de HEERE: Sta in het voorhof van het huis van de HEERE, en spreek tot alle steden van Juda, die komen om aan te bidden in het huis van de HEERE, al de woorden die Ik u geboden heb tot hen te spreken; doe er niet één woord af.","1 Sam 14:19":"En het gebeurde, terwijl Saul nog tot de priester sprak, dat het rumoer dat in het leger van de Filistijnen was, steeds meer toenam en uitbreidde; zo zei Saul tegen de priester: Trek uw hand terug.","Hand 4:18-20":"En zij riepen hen en zeiden hun aan, dat zij helemaal niet meer zouden spreken, noch leren, in de Naam van Jezus. Maar Petrus en Johannes antwoordden hun: Oordeelt u zelf, of het recht is voor God, meer naar u te luisteren dan naar God. Want wij kunnen niet nalaten te spreken over wat wij gezien en gehoord hebben.","Mark 14:29-31":"En Petrus zei tegen Hem: Al zouden zij allen aanstoot nemen, ik zal het toch niet doen. En Jezus zei tegen hem: Voorwaar, Ik zeg u, dat u heden, in deze nacht, voordat de haan tweemaal gekraaid zal hebben, Mij driemaal zult verloochenen. Maar hij zei des te heftiger: Al moest ik met U sterven, ik zal U geenszins verloochenen! En evenzo zeiden zij ook allen.","1 Kon 22:8-28":"Toen zei de koning van Israël tegen Josafat: Er is nog een man om door hem de HEERE te vragen; maar ik haat hem, omdat hij over mij niets goeds profeteert, maar kwaad: Micha, de zoon van Jimla. En Josafat zei: De koning moet dat niet zeggen! Toen riep de koning van Israël een kamerling en zei: Haal snel Micha, de zoon van Jimla. De koning van Israël nu, en Josafat, de koning van Juda, zaten elk op zijn troon, bekleed met hun klederen, op het plein, aan de deur van de poort van Samaria; en al de profeten profeteerden in hun tegenwoordigheid.","Num 24:16":"Die hoort de woorden van God, spreekt, en die de kennis van de allerhoogste weet; die het gezicht van de Almachtige ziet, die in verrukking valt, en wiens ogen geopend worden.","Openb 3:19":"Ieder die Ik liefheb, die bestraf en tuchtig Ik; wees dan ijverig, en bekeer u.","Ex 35:31":"En de Geest van God heeft hem vervuld met wijsheid, met verstand, en met kennis, namelijk in alle handwerk;","1 Kon 18:4":"Want het gebeurde, toen Izebel de profeten van de HEERE uitroeide, dat Obadja honderd profeten nam, en ze verborg bij vijftig man in een grot, en hen onderhield met brood en water.","Jer 23:15":"Daarom zegt de HEERE van de heerscharen van deze profeten zo: Zie, Ik zal hen met alsem spijzigen, en met gallewater drenken; want van de profeten van Jeruzalem is de huichelarij uitgegaan in het hele land.","Jes 62:1":"Om Sion zal Ik niet zwijgen, en om Jeruzalem zal Ik niet stil zijn; totdat haar gerechtigheid voortkomt als een glans, en haar heil als een fakkel, die brandt.","2 Kron 36:15":"En de HEERE, de God van hun vaderen, zond tot hen, door de hand van Zijn boden, vroeg opstaand, om hen te zenden; want Hij spaarde Zijn volk en Zijn woning.","1 Kon 10:18":"Verder maakte de koning een grote ivoren troon, en overtrok die met zuiver goud.","Matt 1:8":"en Asa verwekte Josafat, en Josafat verwekte Joram, en Joram verwekte Uzzia;","Openb 9:9":"En zij hadden borstwapens als ijzeren borstwapens; en het gedruis van hun vleugels was als een gedruis van wagens, wanneer veel paarden naar de strijd lopen.","1 Kron 14:10":"Toen vroeg David aan God: Zal ik optrekken tegen de Filistijnen, en zult U hen in mijn hand geven? En de HEERE zei tegen hem: Trek op, want Ik zal hen in uw hand geven.","Mark 4:22":"Want er is niets verborgen, dat niet openbaar zal worden; en er is niets gebeurd om verborgen te blijven, maar opdat het openbaar zou worden.","Jak 4:13":"Kom nu, u die zegt: Wij zullen vandaag of morgen naar die en die stad reizen, en daar een jaar doorbrengen, en handel drijven, en winst maken.","Deut 29:19-21":"En het gebeurt, als hij de woorden van deze vloek hoort, dat hij zichzelf zegent in zijn hart, en zegt: Ik zal vrede hebben, ook al zal ik naar mijn eigen hart wandelen, om de dronkenschap toe te voegen aan de dorst. De HEERE zal hem niet willen vergeven; maar dan zal de toorn van de HEERE en Zijn ijver roken over die man, en de hele vloek, die in dit boek geschreven is, zal op hem liggen; en de HEERE zal zijn naam van onder de hemel uitwissen. En de HEERE zal hem ten kwade afscheiden van al de stammen van Israël, naar alle vloeken van het verbond, dat in het boek van deze wet geschreven is.","Micha 5:1":"En u, Bethlehem Efratha, bent u klein om te zijn onder de duizenden van Juda? Uit u zal Mij Iemand voortkomen, Die een Heerser zal zijn in Israël, en Wiens uitgangen zijn van oudsher, van de dagen van de eeuwigheid.","Mark 16:20":"En zij gingen heen, en predikten overal, en de Heere werkte mee, en bevestigde het Woord door tekenen die daarop volgden. Amen.","2 Kron 16:10":"Doch Asa werd toornig tegen de ziener, en zette hem in de gevangenis; want hij was hierover tegen hem ontstemd; daarbij onderdrukte Asa sommigen uit het volk op dezelfde tijd.","2 Kron 17:3":"En de HEERE was met Josafat; want hij wandelde in de eerdere wegen van zijn vader David, en zocht de Baäls niet.","Joh 7:7":"De wereld kan u niet haten, maar Mij haat zij, omdat Ik van haar getuig dat haar werken slecht zijn.","2 Kron 30:6":"De boodschappers dan gingen weg met de brieven uit de hand van de koning en zijn leiders, door heel Israël en Juda, en naar het bevel van de koning, en zeiden: Kinderen van Israël, bekeer u tot de HEERE, de God van Abraham, Izak en Israël, dan zal Hij Zich keren naar wie ontkomen waren, die voor u overgebleven zijn uit de hand van de koningen van Assyrië.","Matt 25:31":"En wanneer de Zoon des mensen komen zal in Zijn heerlijkheid, en alle heilige engelen met Hem, dan zal Hij zitten op de troon van Zijn heerlijkheid.","2 Kon 15:4":"Alleen werden de hoogten niet weggenomen; het volk offerde en bracht nog reukoffers op de hoogten.","Ezech 18:29":"Toch zegt het huis van Israël: De weg van de Heere is niet recht. Zouden Mijn wegen, o huis van Israël, niet recht zijn? Zijn niet uw wegen onrecht?","1 Kon 11:21":"Toen Hadad in Egypte hoorde dat David bij zijn vaderen ontslapen was, en dat Joab, de legeraanvoerder, dood was, zei Hadad tegen Farao: Laat mij gaan, dat ik naar mijn land trek.","1 Kon 14:23":"Want ook zij bouwden zich hoogten, en gewijde stenen, en gewijde palen, op elke hoge heuvel, en onder elke bladerrijke boom.","2 Kron 18:7":"Toen zei de koning van Israël tegen Josafat: Er is nog een man om de HEERE door hem te raadplegen; maar ik haat hem, want hij profeteert nooit iets goeds over mij, maar altijd kwaad; dat is Micha, de zoon van Jimla. En Josafat zei: Laat de koning zo niet spreken.","1 Tess 5:2":"Want u weet zelf zeer goed dat de dag van de Heere zo zal komen, zoals een dief in de nacht.","2 Tim 2:14":"Breng deze dingen in gedachtenis, en houd hun voor, voor de Heere, dat zij geen woordenstrijd voeren, wat tot niets nut is, dan tot verderf van de toehoorders.","1 Kon 2:10":"En David ontsliep met zijn vaderen, en werd begraven in de stad van David.","Jer 27:2":"Zo zei de HEERE tegen mij: Maak u banden en jukken, en doe die om uw hals.","2 Kron 25:16":"En het gebeurde, toen hij tot hem sprak, dat hij hem zei: Heeft men u tot raadgever van de koning aangesteld? Houd op; waarom zou men u slaan? Toen hield de profeet op, en zei: Ik merk dat God besloten heeft u te vernietigen, omdat u dit gedaan hebt, en naar mijn raad niet hebt geluisterd.","Hos 7:15":"Ik heb hen wel getuchtigd, en hun armen gesterkt; maar zij denken kwaad tegen Mij.","2 Kon 3:13":"Maar Elisa zei tegen de koning van Israël: Wat heb ik met u te doen? Ga naar de profeten van uw vader, en naar de profeten van uw moeder. Doch de koning van Israël zei tegen hem: Nee, want de HEERE heeft deze drie koningen bij elkaar geroepen, om hen in de hand van de Moabieten te geven.","2 Kron 18:14":"Toen hij bij de koning gekomen was, zei de koning tegen hem: Micha, zullen wij naar Ramoth in Gilead ten strijde trekken, of zal ik het nalaten? En hij zei: Trek op, en u zult voorspoedig zijn, want zij zullen in uw hand gegeven worden.","2 Kron 18:27":"En Micha zei: Als u werkelijk met vrede terugkomt, dan heeft de HEERE niet door mij gesproken. Verder zei hij: Hoor, alle volken!","1 Sam 13:2":"koos Saul zich drieduizend man uit Israël; er waren er bij Saul tweeduizend te Michmas en op het gebergte van Beth-el, en duizend waren er bij Jonathan te Gibea-benjamins; en de rest van het volk liet hij gaan, ieder naar zijn tent.","Openb 22:8":"En ik, Johannes, ben degene die deze dingen gezien en gehoord heeft. En toen ik ze gehoord en gezien had, viel ik neer om aan te bidden voor de voeten van de engel die mij deze dingen toonde.","Hos 1:2":"Het begin van het woord van de Heere door Hosea. De Heere zei toen tegen Hosea: Ga heen, neem u een vrouw van hoererijen, en kinderen van hoererijen; want het land hoereert helemaal van achter de Heere vandaan.","Jer 20:2":"sloeg Pashur de profeet Jeremia, en zette hem in de gevangenis die in de bovenste poort van Benjamin is, die aan het huis van de HEERE ligt.","Jes 59:17":"Want Hij trok gerechtigheid aan als een pantser, en de helm van het heil zette Hij op Zijn hoofd, en de kleren van de wraak trok Hij aan als kleding, en Hij deed de ijver aan als een mantel.","Jer 28:10":"Toen nam de profeet Hananja het juk van de hals van de profeet Jeremia, en verbrak het.","Num 7:89":"En toen Mozes de tent van de samenkomst inging om met Hem te spreken, hoorde hij een stem tot hem spreken, van boven het verzoendeksel dat op de ark van de getuigenis was, van tussen de twee cherubs. Zo sprak Hij tot hem.","2 Sam 8:14":"En hij legde bezettingen in Edom; in heel Edom legde hij bezettingen; en alle Edomieten werden David tot knechten; en de HEERE behoedde David overal waar hij heentrok.","Gen 3:4":"Toen zei de slang tegen de vrouw: U zult zeker niet sterven;","2 Kon 4:27":"Toen zij nu bij de man Gods op de berg kwam, greep zij zijn voeten vast. Maar Gehazi kwam dichterbij om haar weg te duwen. Maar de man Gods zei: Laat haar begaan; want haar ziel is in haar bitter bedroefd, en de HEERE heeft het voor mij verborgen, en het mij niet verteld.","Jer 11:1":"Het woord dat tot Jeremia gebeurd is, van de HEERE, en Hij zei:","1 Kor 2:14-16":"Maar de natuurlijke mens begrijpt niet de dingen die van de Geest van God zijn; want ze zijn hem dwaasheid, en hij kan ze niet verstaan, omdat ze geestelijk beoordeeld worden. Maar de geestelijke mens beoordeelt wel alle dingen, maar hijzelf wordt door niemand beoordeeld. Want wie heeft de gedachte van de Heere gekend, dat hij Hem zou onderrichten? Maar wij hebben de gedachte van Christus.","Ezech 11:1":"Toen tilde de Geest mij op en bracht mij naar de Oostpoort van het huis van de HEERE, die oostwaarts ziet; en zie, aan de deur van de poort waren vijfentwintig mannen, en in hun midden zag ik Jaazanja, de zoon van Azzur, en Pelatja, de zoon van Benaja, vorsten van het volk.","Ps 92:11":"Maar U zult mijn hoorn verhogen, zoals de hoorn van een eenhoorn; ik ben met verse olie overgoten.","Jer 4:10":"Toen zei ik: Ach, Heere HEERE! werkelijk, U hebt dit volk en Jeruzalem grotelijks bedrogen, door te zeggen: U zult vrede hebben; terwijl het zwaard tot aan de ziel raakt.","Job 2:4-6":"Toen antwoordde de satan de HEERE en zei: Huid voor huid, en alles wat iemand heeft, zal hij geven voor zijn leven. Strek toch Uw hand uit, en tast zijn gebeente en zijn vlees aan; dan zal hij U beslist in Uw aangezicht vervloeken! En de HEERE zei tegen de satan: Zie, hij is in uw hand, maar spaar zijn leven.","Ps 48:8":"Met een oostenwind verbreekt U de schepen van Tharsis.","Matt 6:29":"en Ik zeg u, dat zelfs Salomo, in al zijn heerlijkheid, niet gekleed was zoals één van deze.","Num 22:41":"En het gebeurde 's morgens, dat Balak Bileam meenam, en hem bracht naar de hoogten van Baäl, zodat hij vandaar het uiterste deel van het volk kon zien.","2 Kron 14:2-5":"En Asa deed dat goed en dat recht was in de ogen van de HEERE, zijn God. Want hij nam de altaren van de vreemde goden, en de hoogten weg, en brak de opgerichte beelden, en hieuw de bossen af. En hij zei tegen Juda, dat zij de HEERE, de God van hun vaderen, zoeken, en dat zij de wet en het gebod doen zouden.","Ex 4:21":"En de HEERE zei tegen Mozes: Terwijl u heentrekt, om terug te keren naar Egypte, zie erop toe, dat u al de wonderen doet voor Farao, die Ik in uw hand gesteld heb; doch Ik zal zijn hart verharden, zodat hij het volk niet zal laten gaan.","Num 24:2-4":"Toen Bileam zijn ogen ophief en Israël zag, wonend naar zijn stammen, kwam de Geest van God op hem. En hij hief zijn spreuk op en zei: Bileam, de zoon van Beor, spreekt, en de man wiens ogen geopend zijn, spreekt! Die hoort de woorden van God, spreekt, die het gezicht van de Almachtige ziet; die in verrukking valt, en wiens ogen geopend worden!","2 Kon 9:26":"Zeker heb Ik gisteravond het bloed van Naboth gezien, en het bloed van zijn zonen, zegt de HEERE, en Ik zal het u vergelden op dit stuk land, zegt de HEERE. Nu dan, neem hem op, werp hem op dat stuk land, naar het woord van de HEERE.","Spr 3:6":"Ken Hem in al uw wegen, en Hij zal uw paden recht maken.","Ps 91:15":"Hij zal Mij aanroepen, en Ik zal hem verhoren; in de benauwdheid zal Ik bij hem zijn. Ik zal hem eruit trekken, en zal hem verheerlijken.","Openb 2:10":"Vrees niets van de dingen die u lijden zult. Zie, de duivel zal sommigen van u in de gevangenis werpen, opdat u beproefd wordt; en u zult een verdrukking hebben van tien dagen. Wees getrouw tot de dood, en Ik zal u de kroon des levens geven.","1 Kon 11:41":"Het overige nu van de geschiedenissen van Salomo, en alles wat hij gedaan heeft, en zijn wijsheid, is dat niet geschreven in het boek van de geschiedenissen van Salomo?","1 Kon 14:19":"Het overige nu van de geschiedenis van Jerobeam, hoe hij oorlog voerde, en hoe hij geregeerd heeft, zie, dat staat geschreven in het boek van de kronieken van de koningen van Israël.","Hos 12:11":"En Ik zal spreken tot de profeten, en Ik zal het gezicht vermenigvuldigen; en door de dienst van de profeten zal Ik gelijkenissen voorstellen.","Hebr 3:5":"En Mozes is wel trouw geweest in heel Zijn huis, als een dienaar, tot getuigenis van de dingen die daarna gesproken zouden worden;","1 Kon 15:10":"En hij regeerde eenenveertig jaren te Jeruzalem, en de naam van zijn moeder was Maächa, een dochter van Abisalom.","2 Kron 20:1":"Het gebeurde nu hierna, dat de kinderen van Moab, en de kinderen van Ammon, en met hen anderen naast de Ammonieten, tegen Josafat kwamen om te strijden.","Ps 109:17":"Omdat hij de vloek heeft liefgehad, laat die hem overkomen, en heeft geen lust gehad tot de zegen, laat die dan ver van hem zijn.","Openb 14:13":"En ik hoorde een stem uit de hemel, die tegen mij zei: Schrijf, zalig zijn de doden die in de Heere sterven, van nu aan. Ja, zegt de Geest, opdat zij rusten van hun arbeid; en hun werken volgen met hen.","1 Kon 16:20":"Het overige nu van de geschiedenis van Zimri, en zijn verraad, dat hij gepleegd heeft, is dat niet geschreven in het boek van de kronieken van de koningen van Israël?","Job 15:25":"Want hij strekt tegen God zijn hand uit, en tegen de Almachtige stelt hij zich geweldig aan.","Jer 13:17":"Zult u dat dan nog niet horen, dan zal mijn ziel in verborgen plaatsen wenen vanwege de hoogmoed, en mijn oog zal bitter tranen, ja, van tranen neerstromen, omdat de kudde van de HEERE gevankelijk is weggevoerd.","1 Kor 10:9-12":"En laten wij Christus niet beproeven, zoals ook sommigen van hen Hem beproefd hebben, en werden door de slangen omgebracht. En mopper niet, zoals ook sommigen van hen gemopperd hebben, en werden omgebracht door de verderver. En al deze dingen zijn hun overkomen tot voorbeelden; en ze zijn beschreven tot waarschuwing voor ons, over wie het einde van de eeuwen gekomen is.","Jes 5:19":"Die zeggen: Laat Hij haasten, laat Hij Zijn werk bespoedigen, opdat wij het zien; en laat het raadsbesluit van de Heilige van Israël naderen en komen, opdat wij het vernemen!","Rom 1:2":"(Wat Hij van tevoren beloofd had door Zijn profeten, in de heilige Schriften),","1 Petr 3:1":"Evenzo, u vrouwen, wees uw eigen mannen onderdanig; opdat ook, als er sommigen zijn die het Woord ongehoorzaam zijn, zij door de wandel van de vrouwen zonder Woord gewonnen mogen worden;","Amos 5:18":"Wee hen die de dag van de HEERE verlangen! Waartoe toch zal de dag van de HEERE u zijn? Hij zal duisternis zijn en geen licht.","Joz 23:14":"En ziet, ik ga heden in de weg van de hele aarde; en u weet in uw hele hart en in uw hele ziel, dat er niet één woord gevallen is van al die goede woorden, die de HEERE, uw God, over u gesproken heeft; zij zijn u alle overkomen; er is daarvan niet één woord gevallen.","Job 21:15":"Wat is de Almachtige, dat wij Hem zouden dienen? En wat baat zouden wij hebben, dat wij Hem zouden aanroepen?","Ex 35:35":"Hij heeft hen vervuld met wijsheid van hart, om alle werk te maken van een werkmeester, en van de allervernuftigste handwerker, en van de borduurder in hemelsblauw, en in purper, in scharlaken, en in fijn linnen, en van de wever; die alle werk maken, en vernuftig werk bedenken.","Ex 4:12":"En nu ga heen, en Ik zal met uw mond zijn, en zal u leren, wat u spreken zult.","Openb 10:7":"maar in de dagen van de stem van de zevende engel, wanneer hij zal bazuinen, dan zal het geheimenis van God vervuld worden, zoals Hij aan Zijn dienstknechten, de profeten, verkondigd heeft.","Jona 1:3":"Maar Jona maakte zich op om te vluchten naar Tarsis, van het aangezicht van de HEERE; en hij kwam af te Jafo, en vond een schip dat naar Tarsis ging, en hij betaalde de vracht ervoor, en ging erin om met hen mee te gaan naar Tarsis, van het aangezicht van de HEERE.","2 Kron 33:9":"Zo deed Manasse Juda en de inwoners van Jeruzalem dwalen, dat zij erger deden dan de heidenen, die de HEERE voor het aangezicht van de kinderen van Israël verdelgd had.","1 Kron 28:12":"en een bereiding van alles wat bij hem was door de Geest, namelijk van de voorhoven van het huis van de HEERE, en van alle kamers rondom; van de schatten van het huis van God, en van de schatten van de heilige dingen;","Matt 22:23":"Diezelfde dag kwamen de Sadduceeën naar Hem toe, die zeggen dat er geen opstanding is, en vroegen Hem,","Luk 1:15-17":"Want hij zal groot zijn voor de Heere; hij zal geen wijn en geen sterke drank drinken, en hij zal met de Heilige Geest vervuld worden, al vanaf de moederschoot. En hij zal velen van de kinderen van Israël bekeren tot de Heere, hun God. En hij zal voor Hem uit gaan, in de geest en de kracht van Elia, om de harten van de vaders tot de kinderen te bekeren, en de ongehoorzamen tot de wijsheid van de rechtvaardigen, om voor de Heere een toegerust volk gereed te maken.","2 Sam 7:12":"Wanneer uw dagen vervuld zullen zijn, en u met uw vaderen zult ontslapen zijn, dan zal Ik uw nakomeling na u doen opstaan, die uit uw lijf voortkomen zal, en Ik zal zijn koninkrijk bevestigen.","Hos 9:4":"Zij zullen de Heere geen drankoffers doen van wijn, en die zouden Hem ook niet aangenaam zijn; hun offers zouden voor hen zijn als treurbrood; allen die daarvan zouden eten, zouden onrein worden; want hun brood zal voor henzelf zijn, het zal niet in het huis van de Heere komen.","Richt 9:23":"zond God een boze geest tussen Abimelech en de burgers van Sichem; en de burgers van Sichem handelden trouweloos tegen Abimelech;","Ezech 3:17-19":"Mensenkind! Ik heb u tot een wachter gesteld over het huis Israëls; zo zult u het woord uit Mijn mond horen, en hen namens Mij waarschuwen. Als Ik tot de goddeloze zeg: U zult zeker sterven, en u waarschuwt hem niet, en spreekt niet, om de goddeloze van zijn goddeloze weg te waarschuwen, opdat u hem in het leven behoudt; die goddeloze zal in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen. Doch als u de goddeloze waarschuwt, en hij zich van zijn goddeloosheid en van zijn goddeloze weg niet bekeert, zal hij in zijn ongerechtigheid sterven; maar u hebt uw ziel bevrijd.","2 Kon 3:3":"Toch hield hij vast aan de zonden van Jerobeam, de zoon van Nebat, die Israël deed zondigen; hij week daarvan niet af.","1 Tess 1:2-8":"Wij danken God altijd voor u allen, terwijl wij aan u denken in onze gebeden; Zonder ophouden gedenkend het werk van uw geloof, en de arbeid van de liefde, en de volharding van de hoop op onze Heere Jezus Christus, voor onze God en Vader; Wij weten, geliefde broeders, dat u door God uitgekozen bent;","Ps 107:11":"Omdat zij opstandig waren geweest tegen Gods geboden, en de raad van de Allerhoogste onwaardig verworpen hadden.","Hebr 1:14":"Zijn zij niet allemaal dienende geesten, die uitgezonden worden om te dienen, om hen die de zaligheid zullen beërven?","Dan 2:19":"Toen werd aan Daniël in een nachtvisioen het geheim geopenbaard; toen loofde Daniël de God van de hemel.","Job 35:3":"Want u hebt gezegd: Wat zou het u baten? Wat voor meer voordeel zal ik daarmee doen, dan met mijn zonde?","2 Kron 15:1":"Toen kwam de Geest van God op Azaria, de zoon van Oded.","1 Kon 22:24-27":"Toen kwam Zedekia, de zoon van Kenaana, dichterbij en sloeg Micha op de wang, en hij zei: Langs welke weg is de geest van de HEERE van mij weggegaan om u aan te spreken? En Micha zei: Zie, u zult het zien, op diezelfde dag, als u van kamer naar kamer zult gaan om u te verstoppen. De koning van Israël nu zei: Neem Micha, en breng hem terug naar Amon, de leider van de stad, en naar Joas, de zoon van de koning;","Luk 1:15":"Want hij zal groot zijn voor de Heere; hij zal geen wijn en geen sterke drank drinken, en hij zal met de Heilige Geest vervuld worden, al vanaf de moederschoot.","2 Kon 1:2-7":"En Ahazia viel door een traliewerk in zijn bovenzaal, die te Samaria was, en werd ziek. En hij zond boden en zei tegen hen: Ga heen, vraag Baäl-Zebub, de god van Ekron, of ik van deze ziekte genezen zal worden. Maar de Engel van de HEERE sprak tot Elia, de Thisbiet: Maak u op, ga de boden van de koning van Samaria tegemoet, en spreek tot hen: Is het omdat er geen God in Israël is, dat u heengaat om Baäl-Zebub, de god van Ekron, te vragen? Daarom nu zegt de HEERE zo: U zult niet afkomen van dat bed waarop u geklommen bent, maar u zult zeker sterven. En Elia ging weg.","Ps 131:1":"Een lied Hammaaloth, van David. HEERE, mijn hart is niet hoogmoedig, en mijn ogen zijn niet trots; ook heb ik niet gestreefd naar dingen die mij te groot en te wonderlijk zijn.","Ezech 14:3":"Mensenkind, deze mannen hebben hun drekgoden in hun hart opgezet, en hebben de aanstoot van hun ongerechtigheid recht voor hun aangezicht gezet; zou Ik dan werkelijk door hen geraadpleegd worden?","Joh 15:18":"Als de wereld u haat, weet dan, dat zij Mij eerder dan u gehaat heeft.","Ezech 11:24":"Daarna nam de Geest mij op, en bracht mij in een gezicht door de Geest van God naar Chaldea, tot de weggevoerde gevangenen; en het gezicht dat ik gezien had, steeg van mij op.","2 Kon 16:9":"Zo luisterde de koning van Assyrië naar hem; want de koning van Assyrië trok op tegen Damaskus, en nam het in, en voerde de bevolking gevankelijk weg naar Kir, en hij doodde Rezin.","Ps 78:19-22":"En zij spraken tegen God, zij zeiden: Zou God een tafel kunnen aanrichten in de woestijn? Zie, Hij heeft de rotssteen geslagen, zodat er water uitvloeide, en beken overvloedig uitbraken, zou Hij ook brood kunnen geven? Zou Hij aan Zijn volk vlees toebereiden? Daarom hoorde de HEERE, en werd verbolgen; en een vuur werd ontstoken tegen Jakob, en ook toorn ging op tegen Israël;","1 Sam 31:3":"En de strijd werd zwaar tegen Saul; en de mannen die met de boog schieten, troffen hem, en hij werd zeer bang voor de schutters.","Joh 1:47":"En Nathanaël zei tegen hem: Kan uit Nazareth iets goeds komen? Filippus zei tegen hem: Kom en zie.","Num 10:29":"Mozes nu zei tegen Hobab, de zoon van Rehuël, de Midianiet, de schoonvader van Mozes: Wij reizen naar die plaats waarvan de HEERE gezegd heeft: Ik zal u die geven; ga met ons mee, en wij zullen u goed doen, want de HEERE heeft over Israël het goede gesproken.","Jer 29:30":"Daarom kwam het woord van de HEERE tot Jeremia, en Hij zei:","Ezech 33:30":"En u, o mensenkind! De kinderen van uw volk spreken voortdurend over u bij de muren en in de deuren van de huizen; en de een spreekt met de ander, ieder met zijn broeder, en zegt: Kom toch en luister wat het woord is dat van de HEERE komt.","1 Kon 20:24":"Daarom doe deze zaak: Doe de koningen weg, elk uit zijn plaats, en stel landvoogden in hun plaats.","Num 15:30":"Maar de ziel die iets doet met opgeheven hand, hetzij van inboorlingen of van vreemdelingen, die smaadt de HEERE; en die ziel zal uitgeroeid worden uit het midden van haar volk;","Ezech 13:22":"Omdat u het hart van de rechtvaardige door valsheid bedroefd hebt gemaakt, terwijl Ik hem geen smart aangedaan heb; en omdat u de handen van de goddeloze gesterkt hebt, zodat hij zich van zijn boze weg niet zou afkeren, doordat ik hem in leven zou houden;","Rom 1:32":"die, hoewel zij het recht van God kennen, namelijk dat zij die zulke dingen doen de dood waard zijn, deze dingen niet alleen doen, maar ook nog instemming betonen aan hen die ze doen.","Joz 10:1-5":"Het gebeurde nu, toen Adoni-Zedek, de koning van Jeruzalem, gehoord had dat Jozua Ai ingenomen en verbannen had, en aan Ai en haar koning zo gedaan had als hij aan Jericho en haar koning gedaan had; en dat de inwoners van Gibeon vrede met Israël gemaakt hadden, en in hun midden waren; Zo vreesden zij zeer; want Gibeon was een grote stad, als een van de koninklijke steden; ja, zij was groter dan Ai, en al haar mannen waren sterk. Daarom stuurde Adoni-Zedek, koning van Jeruzalem, tot Hoham, de koning van Hebron, en tot Piram, de koning van Jarmuth, en tot Jafia, de koning van Lachis, en tot Debir, de koning van Eglon, en zei:","Jes 8:9-12":"Verzamel u samen, volken! Toch zult u verbroken worden; en neem het ter ore, allen die in verre landen bent, omgord u, toch zult u verbroken worden; omgord u, toch zult u verbroken worden! Beraadslaag een plan, toch zal het vernietigd worden; spreek een woord, toch zal het niet standhouden; want God is met ons! Want zo heeft de HEERE tegen mij gezegd, met een sterke hand, en Hij onderwees mij om niet te wandelen op de weg van dit volk, en zei:","1 Sam 19:20":"Toen zond Saul boden om David te halen; die zagen een groep profeten, die profeteerden, en Samuël stond daarbij, over hen aangesteld; en de Geest van God kwam over Sauls boden, en ook zij profeteerden.","Amos 9:1":"Ik zag de Heere staan op het altaar, en Hij zei: Sla die knop, zodat de posten beven, en kloof ze allen in het hoofd; en Ik zal hun achterste met het zwaard doden; wie van hen probeert te vluchten, zal niet ontkomen, en wie van hen probeert te ontkomen, zal niet gered worden.","2 Kon 8:27":"En hij ging de weg van het huis van Achab, en deed wat slecht was in de ogen van de HEERE, zoals het huis van Achab; want hij was een schoonzoon van het huis van Achab.","Micha 6:13":"zo zal Ik u ook slaan met ziekte, u treffend, en u verwoestend om uw zonden.","2 Kon 18:22":"Maar als u tot mij zegt: Wij vertrouwen op de HEERE, onze God; is Hij het niet, Wiens hoogten en Wiens altaren Hizkia weggenomen heeft, en tot Juda en tot Jeruzalem gezegd heeft: Voor dit altaar zult u zich buigen te Jeruzalem?","Luk 14:7-11":"En Hij zei tegen de genode gasten een gelijkenis, omdat Hij zag hoe zij de ereplaatsen uitkozen, en Hij zei tegen hen: Wanneer u door iemand op een bruiloft genodigd wordt, ga dan niet op de eerste plaats zitten; anders zou misschien iemand die voornamer is dan u door hem genodigd zijn, en zou hij die u en hem genodigd heeft, komen en tegen u zeggen: Geef deze plaats; en dan zou u met schaamte de laatste plaats moeten innemen.","Hand 8:12":"Maar toen zij Filippus geloofden, die het Evangelie van het Koninkrijk van God en van de Naam van Jezus Christus verkondigde, werden zij gedoopt, zowel mannen als vrouwen.","Amos 7:14":"Toen antwoordde Amos, en zei tegen Amazia: Ik was geen profeet, en ik was geen profetenzoon; maar ik was een ossenherder, en verzamelde wilde vijgen.","1 Kon 9:28":"En zij kwamen te Ofir, en haalden daar goud vandaan, vierhonderdtwintig talenten, en brachten het naar de koning Salomo.","Spr 22:25":"opdat u zijn paden niet leert, en een strik over uw ziel haalt.","Jes 48:3-5":"De vorige dingen heb Ik verkondigd van toen af, en uit Mijn mond zijn zij voortgekomen, en Ik heb ze doen horen; Ik heb ze snel gedaan, en zij zijn gekomen; Omdat Ik wist, dat u hard bent, en uw nek een ijzeren zenuw is, en uw voorhoofd koper; Daarom heb Ik het u van toen af verkondigd, voordat het kwam, heb Ik het u doen horen; opdat u niet misschien zou zeggen: Mijn afgod heeft die dingen gedaan, of mijn gesneden beeld, of mijn gegoten beeld heeft ze bevolen.","Hand 8:30":"En Filippus liep erheen en hoorde hem de profeet Jesaja lezen, en zei: Begrijpt u ook wat u leest?","1 Petr 1:11":"en onderzochten op welke of wat voor tijd de Geest van Christus, Die in hen was, doelde, toen Hij vooraf getuigde van het lijden dat over Christus zou komen, en de heerlijkheid daarna.","Rom 9:1-3":"Ik zeg de waarheid in Christus, ik lieg niet (mijn geweten geeft mij daarbij getuigenis door de Heilige Geest), dat het mij een grote droefheid en mijn hart een aanhoudend verdriet is. Want ik zou zelf wel wensen verbannen te zijn van Christus, voor mijn broeders, die mijn verwanten zijn naar het vlees;","2 Kron 17:3-6":"En de HEERE was met Josafat; want hij wandelde in de eerdere wegen van zijn vader David, en zocht de Baäls niet. Maar hij zocht de God van zijn vader, en wandelde in Zijn geboden, en niet naar het doen van Israël. En de HEERE bevestigde het koninkrijk in zijn hand, en heel Juda gaf Josafat geschenken; en hij had rijkdom en eer in overvloed.","Jer 39:3":"En alle vorsten van de koning van Babel trokken naar binnen, en hielden halt bij de middelste poort: namelijk Nergal-Sarezer, Samgar-Nebu, Sarsechim, Rab-Saris, Nergal-Sarezer, Rab-Mag, en al de overige vorsten van de koning van Babel.","Ezech 1:1":"In het dertigste jaar, in de vierde maand, op de vijfde dag van die maand, toen ik te midden van de weggevoerden was bij de rivier Chebar, gebeurde het dat de hemelen werden geopend, en ik zag visioenen van God.","Ezech 11:4":"Daarom, profeteer tegen hen; profeteer, o mensenkind!","Ps 64:6":"Zij sterken zichzelf in een boze zaak; zij overleggen om strikken te verbergen; zij zeggen: Wie zal ze zien?","1 Kon 18:21-24":"Toen naderde Elia tot heel het volk, en zei: Hoe lang hinkt u op twee gedachten? Als de HEERE God is, volg Hem na, en als het Baäl is, volg hem na! Maar het volk antwoordde hem geen woord. Toen zei Elia tegen het volk: Ik ben als enige profeet van de HEERE overgebleven, en de profeten van Baäl zijn vierhonderdvijftig mannen. Laat men ons dan twee stieren geven, en laat hen voor zich de ene stier kiezen, en die in stukken delen, en op het hout leggen, maar geen vuur eronder leggen; en ik zal de andere stier bereiden, en op het hout leggen, en geen vuur eronder leggen.","Ezech 2:1":"En Hij zei tegen mij: Mensenkind, sta op uw voeten, en Ik zal met u spreken.","1 Kon 11:4":"Want het gebeurde in de tijd van Salomo's ouderdom, dat zijn vrouwen zijn hart deden neigen naar andere goden; zodat zijn hart niet volkomen was met de HEERE, zijn God, zoals het hart van zijn vader David.","Joz 11:1-5":"Het gebeurde daarna, toen Jabin, de koning van Hazor, dit hoorde, dat hij een boodschap stuurde naar Jobab, de koning van Madon, en naar de koning van Simron, en naar de koning van Achsaf, En naar de koningen die tegen het noorden op het gebergte, en op het vlakke, tegen het zuiden van Cinneroth, en in de laagte, en in Nafoth-dor, aan de zee waren; Tot de Kanaänieten tegen het oosten en tegen het westen, en de Amorieten, en de Hethieten, en de Ferezieten; en de Jebusieten op het gebergte, en de Hevieten onder aan Hermon, in het land van Mizpa.","Jer 37:15":"En de vorsten werden zeer toornig op Jeremia en sloegen hem; en zij zetten hem in de gevangenis, in het huis van Jonathan, de schrijver; want dat hadden zij tot een gevangenis gemaakt.","Ezech 3:22":"En de hand van de HEERE was daar op mij, en Hij zei tot mij: Maak u op, ga uit naar de vallei, en Ik zal daar met u spreken.","Dan 1:18":"Aan het einde van de dagen nu, waarvan de koning gezegd had dat men hen zou binnenbrengen, bracht de leider van de kamerlingen hen bij Nebukadnezar,","2 Kron 17:1":"En zijn zoon Josafat werd koning in zijn plaats, en hij maakte zich sterk tegen Israël.","Mark 12:36":"Want David zelf heeft door de Heilige Geest gezegd: De Heere heeft gezegd tegen mijn Heere: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gemaakt heb.","Matt 6:20":"maar verzamel voor uzelf schatten in de hemel, waar mot noch roest ze verderft, en waar dieven niet inbreken of stelen;","Zach 1:18-21":"En ik hief mijn ogen op, en zag; en zie, er waren vier horens. En ik zei tegen de Engel Die met mij sprak: Wat zijn deze? En Hij zei tegen mij: Dat zijn de horens die Juda, Israël en Jeruzalem verstrooid hebben. En de HEERE toonde mij vier smeden.","Spr 1:22":"U eenvoudigen! hoe lang zult u de eenvoudigheid liefhebben, en de spotters voor zichzelf de spotternij begeren, en de dwazen wetenschap haten?","Jer 23:9":"Aangaande de profeten. Mijn hart wordt in mijn binnenste gebroken, al mijn beenderen beven; ik ben als een dronken man, en als een man die de wijn te boven gaat; vanwege de HEERE, en vanwege de woorden van Zijn heiligheid.","Luk 1:70":"zoals Hij gesproken heeft door de mond van Zijn heilige profeten, die er van oudsher geweest zijn;","2 Petr 1:13":"En ik acht het juist, zolang ik in deze tent ben, u door herinnering op te wekken;","2 Tim 4:3":"Want er zal een tijd komen dat zij de gezonde leer niet zullen verdragen, maar doordat hun oren jeuken, zullen zij zich naar hun eigen begeerten leraars in menigte bijeenzoeken;","1 Sam 3:1":"En de jongen Samuël diende de HEERE onder toezicht van Eli; en het woord van de HEERE was zeldzaam in die dagen; er was geen openbaar visioen.","Jer 42:15":"nu dan, daarom hoor het woord van de HEERE, overblijfsel van Juda! Zo zegt de HEERE van de heerscharen, de God van Israël: Als u vastbesloten uw aangezichten stelt om naar Egypte te gaan, en daar naartoe gaat om daar als vreemdelingen te wonen;","2 Tess 2:9":"hem, zeg ik, wiens komst is naar de werking van de satan, met alle kracht en tekenen en wonderen van de leugen;","Deut 1:5":"Aan deze kant van de Jordaan, in het land Moab, begon Mozes deze wet uit te leggen, en zei:","2 Kon 3:7":"En hij ging op weg, en zond een bode naar Josafat, de koning van Juda, en zei: De koning van de Moabieten is van mij afgevallen; wilt u met mij optrekken in de oorlog tegen de Moabieten? En hij zei: Ik zal opkomen; ik zal zijn zoals u bent, mijn volk als uw volk, mijn paarden als uw paarden.","Ezech 12:22":"Mensenkind, wat is dit voor een spreekwoord dat u hebt in het land Israël, namelijk: de dagen worden verlengd, en elk visioen vervalt?","Num 23:20":"Zie, ik heb opdracht ontvangen om te zegenen; omdat Hij zegent, zal ik het niet terugdraaien.","Richt 7:7":"En de HEERE zei tegen Gideon: Door deze driehonderd mannen die gelekt hebben, zal Ik u verlossen, en de Midianieten in uw hand geven; laat daarom al het andere volk weggaan, ieder naar zijn eigen plaats.","Richt 7:8":"En het volk nam de teerkost in hun hand, en hun bazuinen; en hij liet alle andere mannen van Israël gaan, ieder naar zijn tent, maar die driehonderd man hield hij bij zich. En het leger van de Midianieten lag beneden hem in het dal.","2 Sam 10:16":"En Hadad-Ezer zond heen, en liet de Syriërs uitkomen, die aan de overzijde van de rivier zijn, en zij kwamen te Helam; en Sobach, Hadad-Ezers legeraanvoerder, trok voor hun aangezicht heen.","Jer 43:2":"Toen zei Azaria, de zoon van Hosaja, en Johanan, de zoon van Kareah, en alle trotse mannen, tegen Jeremia: U spreekt leugen; de HEERE, onze God, heeft u niet gezonden, om te zeggen: U zult niet naar Egypte gaan, om daar als vreemdelingen te verblijven.","Matt 10:22":"En u zult door allen gehaat worden om Mijn Naam; maar wie volhardt tot het einde, die zal behouden worden.","2 Kron 19:4":"Josafat nu woonde in Jeruzalem; en hij trok opnieuw uit onder het volk, van Berseba af tot het gebergte van Efraïm toe, en bracht hen terug tot de HEERE, de God van hun vaderen.","2 Kron 19:2":"En Jehu, de zoon van Hanani, de ziener, ging naar buiten, hem tegemoet, en zei tegen koning Josafat: Zou u de goddeloze helpen, en hen liefhebben die de HEERE haten? Daarom is er nu van het aangezicht van de HEERE grote toorn over u.","Ps 11:1":"Een psalm van David, voor de koorleider. Ik vertrouw op de HEERE; hoe zegt u tegen mijn ziel: Vlucht naar uw gebergte, als een vogel?","Ps 139:21":"Zou ik niet haten, HEERE, wie U haten? En verdriet hebben over wie tegen U opstaan?","Gen 41:39":"Daarna zei Farao tegen Jozef: Omdat God u dit alles heeft bekendgemaakt, is er niemand zo verstandig en wijs als u.","Hand 19:13-16":"En sommigen van de Joden die rondtrokken, en die duivelbezweerders waren, hebben zich eraan gewaagd de Naam van de Heere Jezus te noemen over hen die boze geesten hadden, en zeiden: Wij bezweren u bij Jezus, Die Paulus predikt! Dit waren zeven zonen van een zekere Sceva, een Joodse overpriester, die dit deden. Maar de boze geest antwoordde en zei: Jezus ken ik, en Paulus weet ik; maar u, wie bent u?","1 Kron 28:19":"Dit alles, zei David, heeft men mij door geschrift laten verstaan, van de hand van de HEERE, namelijk al de werken van deze bereiding.","Jer 42:4":"En de profeet Jeremia zei tegen hen: Ik heb het gehoord; zie, ik zal tot de HEERE, uw God, bidden naar uw woorden; en het zal gebeuren, elk woord dat de HEERE u zal antwoorden, zal ik u bekendmaken, ik zal u niet één woord onthouden.","Zach 1:10":"Toen antwoordde de Man Die tussen de mirten stond, en zei: Deze zijn het die de HEERE uitgezonden heeft om het land te doorwandelen.","1 Kon 22:7-28":"Maar Josafat zei: Is hier niet nog een profeet van de HEERE, zodat wij het hem konden vragen? Toen zei de koning van Israël tegen Josafat: Er is nog een man om door hem de HEERE te vragen; maar ik haat hem, omdat hij over mij niets goeds profeteert, maar kwaad: Micha, de zoon van Jimla. En Josafat zei: De koning moet dat niet zeggen! Toen riep de koning van Israël een kamerling en zei: Haal snel Micha, de zoon van Jimla.","Hand 4:31":"En toen zij gebeden hadden, werd de plaats waarin zij bijeen waren, geschud. En zij werden allen vervuld met de Heilige Geest, en spraken het Woord van God met vrijmoedigheid.","Matt 12:24":"Maar de Farizeeën hoorden dit en zeiden: Deze werpt de duivels niet anders uit dan door Beëlzebul, de leider van de duivels.","Richt 20:29":"Toen stelde Israël hinderlagen op tegen Gibea rondom.","Openb 3:20":"Zie, Ik sta aan de deur, en Ik klop; als iemand Mijn stem hoort, en de deur opendoet, zal Ik bij hem binnenkomen, en Ik zal met hem avondmaal houden, en hij met Mij.","Jes 5:24":"Daarom, zoals de tong van het vuur de stoppel verteert, en het kaf door de vlam verteerd wordt, zo zal hun wortel als verrotting zijn; en hun bloesem zal als stof opstijgen; omdat zij de wet van de HEERE van de heerscharen verwerpen, en het woord van de Heilige van Israël versmaden.","Hand 16:24":"Deze, zo'n bevel ontvangen hebbend, wierp hen in de binnenste kerker, en zette hun voeten vast in het blok.","Hand 12:21":"En op een vastgestelde dag, nadat Herodes een koninklijk kleed had aangetrokken en op de troon was gaan zitten, hield hij een toespraak tot hen.","Ps 107:12":"Daarom heeft Hij hun hart door zwarigheid vernederd; zij zijn gestruikeld, en er was geen helper.","Lev 18:22":"Bij een man zult u niet liggen zoals bij een vrouw; dit is een gruwel.","1 Sam 17:49":"En David stak zijn hand in de tas, en nam er een steen uit, en slingerde die, en trof de Filistijn in zijn voorhoofd, zodat de steen in zijn voorhoofd wegzonk, en hij viel voorover op de grond.","Jer 13:1-3":"Zo heeft de HEERE tegen mij gezegd: Ga heen, en koop u een linnen gordel, en doe die om uw middel, maar breng hem niet in het water. En ik kocht een gordel naar het woord van de HEERE, en ik deed die om mijn middel. Toen kwam het woord van de HEERE voor de tweede keer tot mij, en Hij zei:","1 Kon 22:31-33":"De koning van Syrië nu had zijn tweeëndertig aanvoerders van de wagens geboden en gezegd: U zult niet vechten tegen klein of groot, maar alleen tegen de koning van Israël. Het gebeurde dan, toen de aanvoerders van de wagens Josafat zagen, dat zij zeiden: Zeker, dat is de koning van Israël; en zij keerden zich naar hem toe om te strijden; maar Josafat riep het uit. En het gebeurde, toen de aanvoerders van de wagens zagen dat hij de koning van Israël niet was, dat zij zich van hem afkeerden en niet meer achtervolgden.","2 Kon 5:1":"Naäman nu, de legeraanvoerder van de koning van Syrië, was een groot man voor het aangezicht van zijn heer, en van hoog aanzien; want door hem had de HEERE de Syriërs verlossing gegeven; zo was deze man een strijdbaar held, doch melaats.","Obadja 1:1":"Het visioen van Obadja. Zo zegt de Heere HEERE van Edom: Wij hebben een bericht gehoord van de HEERE, en er is een gezant gestuurd onder de heidenvolken: Sta op, en laten wij tegen haar opstaan ten strijde.","Ezech 3:27":"Maar als Ik met u spreken zal, zal Ik uw mond opendoen, en u zult tot hen zeggen: Zo zegt de Heere HEERE, wie hoort, laat hij horen, en wie het laat, laat hij het laten; want zij zijn een opstandig huis.","Jer 2:31":"Geslacht, let toch op het woord van de HEERE! Ben Ik Israël een woestijn geweest, of een land van de uiterste donkerheid? Waarom zegt Mijn volk dan: Wij zijn heren, wij zullen niet meer tot U komen?","Micha 7:10":"En mijn vijandin zal het zien, en schaamte zal haar bedekken; zij die tegen mij zegt: Waar is de HEERE, uw God? Mijn ogen zullen op haar neerzien; nu zal zij worden tot vertreding, als slijk van de straten.","1 Kon 22:8-11":"Toen zei de koning van Israël tegen Josafat: Er is nog een man om door hem de HEERE te vragen; maar ik haat hem, omdat hij over mij niets goeds profeteert, maar kwaad: Micha, de zoon van Jimla. En Josafat zei: De koning moet dat niet zeggen! Toen riep de koning van Israël een kamerling en zei: Haal snel Micha, de zoon van Jimla. De koning van Israël nu, en Josafat, de koning van Juda, zaten elk op zijn troon, bekleed met hun klederen, op het plein, aan de deur van de poort van Samaria; en al de profeten profeteerden in hun tegenwoordigheid.","1 Kon 9:27":"En Hiram zond met die schepen zijn knechten, scheepslieden, kenners van de zee, met de knechten van Salomo.","2 Kron 18:1":"Josafat had rijkdom en eer in overvloed; en hij verzwagerde zich aan Achab.","Ps 10:13":"Waarom lastert de goddeloze God? Hij zegt in zijn hart: U zult het niet zoeken?","Richt 6:34":"Toen bekleedde de Geest van de HEERE Gideon, en hij blies op de bazuin, en de Abiëzrieten werden achter hem bijeengeroepen.","Dan 3:15":"Nu dan, als u gereed bent om, op het moment dat u het geluid zult horen van de hoorn, de pijp, de citer, de vedel, de psalters, en het akkoordgezang, en allerlei soort muziek, neer te vallen en het beeld te aanbidden dat ik gemaakt heb, dan is het goed; maar als u het niet aanbidt, zult u op datzelfde moment geworpen worden in het midden van de brandende vuuroven; en wie is de god die u uit mijn handen zou kunnen verlossen?","Joz 3:7":"Want de HEERE had tegen Jozua gezegd: Deze dag zal Ik beginnen u groot te maken voor de ogen van heel Israël, opdat zij weten dat Ik met u zal zijn, zoals Ik met Mozes geweest ben.","Mark 6:17-28":"Want Herodes zelf had sommigen uitgezonden en Johannes gevangengenomen, en hem in de gevangenis geketend, vanwege Herodias, de vrouw van zijn broer Filippus, omdat hij haar getrouwd had. Want Johannes had tegen Herodes gezegd: Het is u niet geoorloofd de vrouw van uw broer te hebben. En Herodias had het op hem voorzien, en wilde hem doden, maar kon het niet;","Ps 89:25":"En Mijn getrouwheid en Mijn goedertierenheid zullen met hem zijn; en zijn hoorn zal in Mijn Naam verhoogd worden.","Mark 5:19":"Maar Jezus stond hem dat niet toe, maar zei tegen hem: Ga naar uw huis, naar de uwen, en vertel hun wat grote dingen de Heere aan u gedaan heeft, en hoe Hij Zich over u ontfermd heeft.","Jer 16:6":"Zodat groten en kleinen in dit land zullen sterven, zij zullen niet begraven worden; en men zal hen niet beklagen, noch zichzelf insnijden, noch zich kaal maken om hen.","Openb 4:2":"En meteen werd ik in de geest; en zie, er was een troon gezet in de hemel, en er zat Iemand op de troon.","Micha 7:1":"Ai mij! Want ik ben als wanneer de zomervruchten zijn ingezameld; als wanneer de nalezingen in de wijnoogst gebeurd zijn; er is geen druif om te eten; mijn ziel begeert vroegrijpe vrucht.","Jes 22:3":"Al uw leiders zijn samen weggevlucht; zij zijn door de schutters gebonden, allen die in u gevonden zijn, zijn samen gebonden, zij zijn van ver gevlucht.","Hand 11:19":"Degenen nu die verstrooid waren door de verdrukking die over Stefanus gebeurd was, trokken het land door tot Fenicië toe, en Cyprus, en Antiochië, en spraken tot niemand het Woord dan alleen tot de Joden.","Hand 17:32":"Toen zij nu van de opstanding van de doden hoorden, spotten sommigen daarmee; en sommigen zeiden: Wij zullen u hierover een andere keer horen.","1 Sam 23:2":"En David vroeg de HEERE: Zal ik heengaan en deze Filistijnen verslaan? En de HEERE zei tegen David: Ga heen, en u zult de Filistijnen verslaan en Kehila verlossen.","Matt 27:43":"Hij heeft op God vertrouwd; laat God Hem nu verlossen, als Hij Hem tenminste wil hebben; want Hij heeft gezegd: Ik ben Gods Zoon.","Rom 1:11":"Want ik verlang ernaar u te zien, opdat ik u enige geestelijke gave zou mogen meedelen, opdat u versterkt zou worden;","Spr 31:11":"Beth. Het hart van haar man vertrouwt op haar, zodat het hem aan geen goed zal ontbreken.","Ezech 11:5":"Toen viel de Geest van de HEERE op mij, en Hij zei tegen mij: Zeg: Zo zegt de HEERE: Zo hebt u gezegd, huis van Israël! Want Ik weet elk van de dingen die in uw geest opkomen.","Spr 5:12-14":"En zegt: Hoe heb ik de tucht gehaat, en heeft mijn hart de bestraffing versmaad! En heb niet geluisterd naar de stem van mijn onderwijzers, mijn oren niet geneigd tot mijn leraars! Ik ben bijna in alle kwaad geweest, midden in de gemeente en de vergadering!","Num 23:5":"Toen legde de HEERE het woord in de mond van Bileam, en zei: Keer terug naar Balak, en spreek zo.","Gen 19:5":"En zij riepen Lot toe, en zeiden tegen hem: Waar zijn die mannen die deze nacht bij u gekomen zijn? Breng hen naar buiten, naar ons toe, opdat wij met hen gemeenschap hebben.","2 Kron 17:3-10":"En de HEERE was met Josafat; want hij wandelde in de eerdere wegen van zijn vader David, en zocht de Baäls niet. Maar hij zocht de God van zijn vader, en wandelde in Zijn geboden, en niet naar het doen van Israël. En de HEERE be
