ekst":"Namelijk, de Syriërs en de Israëlieten, tussen welken tevoren oorlog was geweest. Zie boven, 1Ki 20."},{"catchword":"drie jaren","tekst":"Deze jaren zijn te rekenen van de tweede nederlaag, die de Syriërs in den oorlog tegen de Israëlieten gekregen hadden, waarvan te zien is boven, 1Ki 20:29, enz."}],"2":[{"catchword":"den koning van Israël","tekst":"Namelijk, Achab, met welken hij niet alleen in vrede stond, onder, vs.45, maar ook in zwagerschap getreden was, door het huwelijk van zijn zoon Joram met Athalia, de dochter van Achab, 2Ki 8:18, en 2Ch 18:1."}],"3":[{"catchword":"knechten zeide","tekst":"Zie Gen 20:8."},{"catchword":"Ramoth","tekst":"Zie van deze stad Deu 4:43, en boven, 1Ki 4:13."},{"catchword":"onze is?","tekst":"Want deze stad behoorde tot het land der Israëlieten, zijnde gelegen in den stam van Gad, en Benhadad, wiens vader haar den Israëlieten afgenomen had, had ze beloofd hun weder te geven; boven, 1Ki 20:34."},{"catchword":"zijn stil,","tekst":"Hebreeuws, zwijgen; doch het Hebreeuwse woord betekent nalating, niet allen van spreken, maar ook van iets te doen, gelijk Exo 14:14; Jdg 18:9; Isa 64:12."}],"4":[{"catchword":"Zo zal ik zijn","tekst":"Hebreeuws, gelijk mij, gelijk u, gelijk mijn volk, gelijk uw volk, gelijk mijn paarden, gelijk uw paarden; alzo 2Ki 3:7, en 2Ch 18:3. Dat is, ik zal met u in dezen strijd trekken, en zo getrouw zijn dat gij moogt steunen op mijn persoon als op den uwe, op mijn volk als op het uwe, enz."}],"5":[{"catchword":"Vraag toch","tekst":"Dat is, verneem door enigen profeet des Heeren of het ook zijn wil is dat wij dezen oorlog aannemen, en of Hij ons daarin voorspoed en victorie geven zal."}],"6":[{"catchword":"de profeten,","tekst":"Het schijnt dat dezen zouden mogen geweest zijn de vierhonderd profeten van het afgodische woud, van hetwelk gesproken is boven, 1Ki 18:19, en niet verschenen voor Elia, op den berg Karmel, met de vier honderd en vijftig profeten Baäls. Zie in 1Ki 18:22 de aantekeningen."}],"7":[{"catchword":"nog een profeet","tekst":"Versta, boven deze vierhonderd profeten, van welken de koning Josafat begon een kwaad nadenken te krijgen. Of, boven veel anderen profeten, die tevoren in Israël geweest waren."}],"8":[{"catchword":"den HEERE","tekst":"Merk dat deze afgodendienaars nog willen schijnen den waren God recht te kennen en te zoeken, om hem te gehoorzamen."},{"catchword":"goeds","tekst":"Dat is, dat mij aangenaam is. Zie boven, 1Ki 1:42."},{"catchword":"Micha,","tekst":"Die te onderscheiden is van den profeet Micha, toegenaamd de Morasthiet, omdat hij in de stad Morasa geboren was, Mic 1:1, die geleefd heeft ten tijde der koningen van Juda, Jotham, Achaz en Hizkia."},{"catchword":"zegge niet alzo","tekst":"Dat is, haat den persoon niet om des woords wil, en versmaad het woord niet om des persoons wil."}],"9":[{"catchword":"kamerling,","tekst":"Het Hebreeuwse woord betekent in het algemeen een hoveling, hofjonker, hofofficier. Zie Gen 37:36."}],"10":[{"catchword":"hun klederen,","tekst":"Te weten, met bijzondere koninklijke klederen, in welke zij hun majesteit, staat en heerlijkheid vertoonden. Anders, [hun] wapenen aanhebbende."},{"catchword":"plein,","tekst":"Versta, een effen, onbetimmerde en ledige plaats. Zie Gen 50:10. Zulke meent men voor aan de poorten der steden in vorige tijden geweest te zijn voor marktplaatsen, of ruimten, om daar een menigte van krijgslieden in slagorde te stellen, zo wanneer men den inval van enige vijanden vreesde."},{"catchword":"de profeten","tekst":"Namelijk, van welken gesproken is boven, vs.6; alzo ook onder, vs.12."}],"11":[{"catchword":"Zedekia,","tekst":"Een der voorgemelde profeten, die te onderscheiden is van een anderen valsen profeet van dezen naam, den zoon van Maäseja, Jer 29:21."},{"catchword":"ijzeren horens","tekst":"Om daarmede, als met een teken, zijn profetie voor te stellen, en daarna met het woord te verklaren, gelijk vele profeten gewoon waren te doen."},{"catchword":"HEERE","tekst":"Hij wendt den naam JHWH des enigen en waarachtigen Gods, en niet de namen zijner afgoden voor; gelijk ook onder, vs.12, 24. Niet alleen om aldus zijn voorzegging voor den koning Josafat te aangenamer te maken, maar ook om voor een ieder te betuigen dat hun ganse religie en profetering kwanswijs daarheen gericht was, om den God van dien naam eer en dienst te bewijzen. Vergelijk Exo 32:4-5; Jdg 17:3; 1Ki 12:28."},{"catchword":"Met deze","tekst":"De zin is dat hij hen lichtelijk zou overwinnen en vernielen. Want gelijk de gehoornde beesten de andere, die zonder hoornen zijn, licht beschadigen en verdrukken, alzo zou het hem niet zwaar zijn de Syriërs als zwakker dan hij was, tenonder te brengen."}],"12":[{"catchword":"gij zult voorspoedig zijn;","tekst":"Hebreeuws, zijt voorspoedig; dat is, gij zult voorspoedig zijn, alzo onder, vs.15. Vergelijk Psa 37:3, en Pro 3:25."}],"13":[{"catchword":"uit een mond","tekst":"Hebreeuws, één mond, of met één mond."},{"catchword":"het goede","tekst":"Dat is, de overwinning over de Syriërs en de verovering van Ramoth in Gilead. Vergelijk boven, vs.8, en de aantekeningen en onder, vs.18."}],"15":[{"catchword":"Trek op,","tekst":"De profeet zegt dit niet met ernst, maar bespottende het antwoord en de voorzegging der valse profeten, welker woorden hij daarom ook gebruikt, gelijk die verhaald staan boven, vs.12 [want de Heere had die hem geopenbaard]. Waarom Achab uit zijn manier van spreken, wezen en gebaren merkende dat hij het niet meende hetgeen hij zeide, beveelt hem een ernsthaftig antwoord te geven, in vs.16. Het is dan een bevel of raad, spottenderwijze gegeven. Vergelijk Jdg 10:14; Ecc 11:9; Eze 20:39; Amo 4:4-5; Mat 23:32."}],"16":[{"catchword":"in den Naam des HEEREN?","tekst":"Dat is, door des Heeren bevel en ingeving. Zie 2Ki 2:24."}],"17":[{"catchword":"Ik zag het ganse Israël","tekst":"Te weten, in een profetisch gezicht, hetwelk aan mijn geest geschied is. Zie van deze gezichten Gen 15:1. In dit gezicht zijn hem drie dingen geopenbaard:&lt;i&gt;I.&lt;/i&gt; Dat de Israëlieten geen victorie zouden bevechten, maar voor de Syriërs vluchten;&lt;i&gt;II.&lt;/i&gt; Dat Achab zou omkomen en sterven;&lt;i&gt;III.&lt;/i&gt; Dat het volk ditmaal niet in den strijd zou omkomen, maar naar huis wederkeren."},{"catchword":"Dezen hebben geen heer;","tekst":"Anders, deze zullen geen heer hebben."}],"18":[{"catchword":"Heb ik tot u niet gezegd","tekst":"Zie boven, vs.9."}],"19":[{"catchword":"hij","tekst":"Namelijk de profeet Micha."},{"catchword":"zag den HEERE,","tekst":"Te weten, niet in zijn wezen, maar in de tekenen zijner openbaring, welke den profeten zijn vertoond geweest, somtijds lichamelijk aan de ogen des lichaams, somtijds alleen geestelijk aan het verstand. Zie Gen 32:30, en Num 12:8."},{"catchword":"zittende","tekst":"God wordt ons aldus voorgesteld bij gelijkenis van een aards monarch, die met vele dienaren omsingeld zijnde, gezeten is om te richten. Het doel is om ons te onderwijzen van de heerlijkheid zijner majesteit, van de wijsheid zijner oordelen, en van de almogendheid zijner werken."},{"catchword":"hemelse heir","tekst":"Versta, de engelen, of hemelse geesten. Zie Gen 2:1, en boven, 1Ki 18:15, en vergelijk Psa 103:21, en Psa 148:2; Isa 45:12."}],"20":[{"catchword":"De een nu zeide","tekst":"Hebreeuws, deze zeide in, of, met alzo, en deze zeide in, of, met alzo; dat is, de een zeide op deze manier, en de andere zeide op die manier."}],"21":[{"catchword":"een geest uit,","tekst":"Deze is een der boze geesten geweest, die God naar zijn oneindelijke wijsheid, zonder met hun doen besmet te worden, weet te gebruiken, niet alleen om zijn kinderen te beproeven, Job 1:12, en Job 2:6, en te verootmoedigen, 2Co 12:7, maar ook om de goddelozen te straffen en te verderven, gelijk te zien is vs.21 en 1Sa 16:14; 2Th 2:9-11."}],"22":[{"catchword":"leugengeest zijn","tekst":"Hebreeuws, een geest der valsheid, of der leugen; alzo in vs.23, dat is, die onwaarheid en leugentaal uit zich voortbrengt en anderen wijsmaakt. Vergelijk Joh 8:44; Rev 12:9."},{"catchword":"zijn profeten","tekst":"Namelijk, van Achab, welverstaande dergenen, die hem in zijn afgoderij toegedaan zijn."},{"catchword":"Gij zult overreden,","tekst":"Dat is, uw leugen zal macht hebben om de valse profeten, en door dezen Achab te bedriegen. Vergelijk 2Th 2:11."},{"catchword":"doe alzo","tekst":"God wordt gezegd het kwade den redelijken schepselen te bevelen, als Hij hen gebruikt om zijn heilig voornemen daardoor uit te voeren. Hetwelk Hij doet, niet door denzelven enige zonde in te geven, of met het woord te belasten, maar door hun eigen boosheid niet alleen niet te beletten, maar ook buiten hun weten en wil naar zijn oneindelijke wijsheid te besturen tot een heilig einde, overeenkomende met zijn goedheid aan degenen, die behouden worden, en rechtvaardigheid tegen degenen, die verloren gaan. Vergelijk 2Sa 16:10."}],"23":[{"catchword":"kwaad over u","tekst":"Versta, het kwaad der straf. Zie Gen 19:19."}],"24":[{"catchword":"Zedekia,","tekst":"Zie boven, vs.11."},{"catchword":"sloeg Micha","tekst":"Tot een bewijs van grote vijandschap en verachting. Zie Job 16:10; Psa 3:8; Jer 20:2; Mar 14:65; Act 23:2; 2Co 12:7."},{"catchword":"weg","tekst":"Dit woord is hier ingevoegd uit 2Ch 18:23."}],"25":[{"catchword":"zien,","tekst":"Dat is, bevinden en gewaar worden dat de Geest Gods niet door u, maar door mij gesproken heeft. Zien, voor bevinden, Gen 26:28; Mat 2:16; Rom 7:23."},{"catchword":"van","tekst":"Zie boven, 1Ki 20:30."},{"catchword":"versteken","tekst":"Te weten, vrezende gevangen en gestraft te worden, omdat gij door uw valse profetie des konings dood zult veroorzaakt hebben."}],"26":[{"catchword":"zeide","tekst":"Namelijk, tot een zijner dienaren."}],"27":[{"catchword":"in het gevangenhuis,","tekst":"Hebreeuws, het huis der bedwinging, of besluiting. Alzo 2Ki 17:4, en 2Ki 25:27; Isa 42:7; Jer 37:15."},{"catchword":"der bedruktheid,","tekst":"Dit is, dat men den bedrukten en gevangenen placht te geven; of dat met grote spaarzaamheid, niet tot vermaking, maar alleen tot nodige onderhouding des lichaams gegeven, en in kommer, droefheid en benauwdheid des geestes genuttigd wordt. Hierom wordt ook brood en drank der tranen, der smarte en der benauwdheid voor den staat zelven der ellende en verdrukking genomen; Psa 80:6, en Psa 127:2; Isa 30:20."},{"catchword":"met water","tekst":"Voeg daarbij, drenk hem."},{"catchword":"met vrede","tekst":"Dat is, met overwinning der vijanden, met verovering der stad en met welstand mijns persoons."},{"catchword":"weder kom","tekst":"Dit woord is hier ingevoegd uit vs.28, en uit 2Ch 18:26."}],"28":[{"catchword":"enigszins","tekst":"Hebreeuws, wederkomende wederkomt."},{"catchword":"HEERE","tekst":"Vergelijk Num 16:29."},{"catchword":"Hoort,","tekst":"Hebreeuws, hoort gij volken, zij allen. Alzo Mic 1:2, enz. Of, hoort volken al deze dingen. Hij neemt hen allen tot getuigen, zowel van zijn profetie, als van hetgeen hij nu laatst den koning Achab geantwoord had."}],"30":[{"catchword":"mij versteld heb,","tekst":"Dat is, mijn klederen veranderd, om niet te tonen wie ik ben, opdat ik niet bekend worde. Zie boven, 1Ki 20:38, want hij vreesde den dood, die hem van Micha voorzegd was, hoewel hij wilde schijnen zijn woorden te verachten."},{"catchword":"uw klederen","tekst":"Zie boven, vs.10."}],"31":[{"catchword":"hij twee en dertig had,","tekst":"Namelijk, de oversten."},{"catchword":"kleinen","tekst":"Dat is, noch de slechtste, noch de voornaamste onder de krijgslieden. Alzo worden door de woorden van grote en kleine in de Heilige Schriftuur verstaan allerlei soorten van mensen, oude en jonge, hoge en lage, rijke en arme, enz., Gen 19:11; Est 1:5; Jer 16:6."}],"32":[{"catchword":"zij keerden","tekst":"Te weten, zich alzo van elkander delende en uitspreidende dat zij den koning Josafat omsingelden. Zie 2Ch 18:31."},{"catchword":"riep uit","tekst":"Te weten, tot den Heere, biddende om zijn tegenwoordige hulp, welke hij ook verkreeg. Zie 2Ch 18:31."}],"33":[{"catchword":"van achter hem","tekst":"Dat is, van hem te vervolgen."}],"34":[{"catchword":"spande","tekst":"Hebreeuws, trok met den boog."},{"catchword":"eenvoudigheid,","tekst":"Dat is, zonder enig voornemen of gedachten te hebben van den koning Achab met zijn schot te treffen. Zo wordt het Hebreeuwse woord ook genomen 2Sa 15:11; 2Ch 18:33."},{"catchword":"schoot den koning","tekst":"Hebreeuws, sloeg. Zie Gen 8:21."},{"catchword":"hij tot zijn voerman","tekst":"Namelijk, de koning AcHab."},{"catchword":"verwond","tekst":"Hebreeuws, ziek gemaakt, of, verzwakt."}],"35":[{"catchword":"koning","tekst":"Namelijk, Israëls; 2Ch 18:34."},{"catchword":"met den wagen","tekst":"Of, in den wagen; te weten om zijn leger, hetwelk tot de vlucht scheen genegen te zijn, door zijn tegenwoordigheid bijeen te houden en deszelfs nederlaag alzo te verhinderen. Vergelijk 2Ch 18:34."},{"catchword":"bak des wagens","tekst":"Hebreeuws, in den schoot des wagens."}],"36":[{"catchword":"een uitroeping","tekst":"Of, [de stem] ener uitroeping, of, [de man] eens uitroepens; dat is, een man die uitriep, welke de heraut pleegt genaamd te worden."}],"37":[{"catchword":"werd naar Samaria","tekst":"Hebreeuws, kwam; te weten, dood op zijn wagen gebracht zijnde."}],"38":[{"catchword":"waar de hoeren wiesen,","tekst":"Anders, als men de wapenen wies, of, en zij wiesen de wapenen."},{"catchword":"naar het woord","tekst":"Zie boven, 1Ki 21:19."}],"39":[{"catchword":"elpenbenen huis,","tekst":"Hebreeuws, het huis des tands; dat is, der olifantentanden. Zie boven, 1Ki 10:18."},{"catchword":"in het boek","tekst":"Zie boven, 1Ki 14:19; idem vergelijk de aantekeningen 1Ki 16:20."}],"42":[{"catchword":"vijf en dertig","tekst":"Hebreeuws, een zoon van vijf en dertig jaar."},{"catchword":"vijf en twintig","tekst":"Zijnde hierin begrepen de jaren, in welke zijn zoon Joram enige regering des koninkrijks gehad heeft, beginnende in het zeventiende jaar van zijns vaders regering, als de vader in den oorlog tegen de Syriërs zich met Achab vervoegde. Want de koningen in gevaar trekkende, plachten den staat des lands, met de verklaring van hun opvolger of navolger te verzekeren. Vergelijk 2Ki 1:17, en 2Ki 8:16, en de aantekeningen."}],"43":[{"catchword":"wandelde","tekst":"Zie boven, 1Ki 15:26."},{"catchword":"de hoogten","tekst":"Zie Lev 26:30."}],"44":[{"catchword":"wandelde","tekst":"Zie boven, 1Ki 15:26."},{"catchword":"de hoogten","tekst":"Zie Lev 26:30."}],"45":[{"catchword":"met den koning Israëls","tekst":"Namelijk, met Achab en zijn zoon, boven, vs.4, en 2Ki 3:7, waarover hij van den profeet Jehu gestraft wordt, 2Ch 19:2."}],"46":[{"catchword":"in het boek","tekst":"Zie boven, 1Ki 14:29."}],"47":[{"catchword":"schandjongens,","tekst":"Vergelijk boven, 1Ki 15:12, en de aantekeningen daarop."}],"48":[{"catchword":"Toen was","tekst":"Hetwelk zo geweest was van de tijden Davids af. Vergelijk 2Sa 8:14."},{"catchword":"stadhouder","tekst":"Of, bestelde. Versta, een die van den koning van Juda ingesteld was om in zijn naam te regeren."}],"49":[{"catchword":"maakte schepen","tekst":"Of, had tien schepen."},{"catchword":"Tharsis,","tekst":"Zie boven, 1Ki 10:22. Anders, schepen [om te gaan naar] Tarsis. Zie 2Ch 20:36-37."},{"catchword":"Ofir","tekst":"Zie boven, 1Ki 9:28."},{"catchword":"Ezéon-geber","tekst":"Zie boven, 1Ki 9:26."}],"50":[{"catchword":"wilde niet","tekst":"Te weten, nadat hij van den profeet was bestraft en schade geleden had. Zie 2Ch 20:35-37."}],"52":[{"catchword":"twee jaren","tekst":"Doch niet ten volle. Want het eerste jaar had hij gemeen met zijn vader Achab, en het tweede met zijn broeder Joram."}],"53":[{"catchword":"wandelde","tekst":"Zie boven, 1Ki 15:26."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And they [namely the Syrians and the Israelites between whom there had been war in time past see above chapter 20] sat still three years [ these years are to be counted from the second overthrow which the Syrians received in the war against the Israelites of which see above chapter 20 on verse 29&c.] so that there was no war between Syria and between Israel."}],"2":[{"catchword":null,"tekst":"But it came to pass in the third year when Josphat the king of Judah was come down to the king of Israel ?[Namely Achab with whom he not only was at peace below verse 45 but also had entered into the affirnity by the marriage of joram his son and Athalia the daughter of Achab 2Ki 8:18 & 2Ch 8:1.]"}],"3":[{"catchword":null,"tekst":"That the king of Israel said unto his servants [see Genesis 20 on verse 8] know ye that Rammoth in Gilead [see of this city Deu 4:43and above chapter 4.13] is ours? [for the city belonged to the land of the Israelites had promised to restore the same above chapter 10.34] and we be still [Heb. are silent or hold our peace but the Hebrew word signifieth omission not only of speaking but also of doing anything as Exo 14:14Jud 18:9 Isa 64:12] without taking the same out of the hand of king of Syria."}],"4":[{"catchword":null,"tekst":"Then he said unto Josphat wilt thou go with me into the battle to Rammoth in Gilead? and Josphat said unto the king of Israel i will be so as thou art my people so as thy people my horses so as thy horses[ Heb. as I so thou as my people so thou people as my horses so thy horses so 2Ki 3:7 and 2Ch 8:3 that is I will march forth with thee into the battle and be so trusty that thou mayst rely upon my person as upon thine own upon my people as upon thy people &c.]"}],"5":[{"catchword":null,"tekst":"Moreover Josaphat saying unto the king of Israel inquire I pray as today after the word of the Lord [tat is inquire by some prophet of the Lord whether it be also his will that we should undertake this war and he will give us success and victory therein."}],"6":[{"catchword":null,"tekst":"Then the king of Israel gathered the prophet together [it seemeth that these were the four hundred prophets of the idolatrous grove of whom mention is made above chapter 18.19 and who appeared not before Elia upon mount carmel with the four hundred and fifty prophets of Baal see in the same chapter the annotate on verse 22] about four hundred men and he said unto them shall I go against Rammoth in Gilead to battle or shall I for bear ? and they said go up for the Lord shall deliver it into the hands of the king."}],"7":[{"catchword":null,"tekst":"But Josaphat said is there not here a prophet yet of the Lord [understand besides these four hundred prophets of whom king Josaphat began to have suspicion or besides many other prophets that formerly had been in Israel] that we might enquire of him."}],"8":[{"catchword":null,"tekst":"Then said the king of Israel unto Josphat there is yet one men by whom to enquire of the Lord [observe that these idolators will yet to know the true the true God aright and to seek to obey him ] but I hate him because he doth not prophesy good upon me [ that is that which is pleasing and acceptable unto me see above chapter 1 on verse 42]but evil Micah surnamed the Marasthite being born in the city of Morasah Micah 1.1 which lived in the times of Jothaam, Ahaz, and Hizkia, Kings of Juda] the son of Jimla: and Josaphat said, Let not the King say so. [i.e. let him not hate the person for the words sake, nor despise the word for the persons sake.]"}],"9":[{"catchword":null,"tekst":"Then the King Israel called a Groom of the Chamber, [The Hebrew word signifieth generally a Courtier, Court-Gentleman, Court-Officers. See Genes.37.on vers.36.] and said; Fetch hastily Micha, the son of Jimla."}],"10":[{"catchword":null,"tekst":"Now the King of Israel, and Josaphat the King of Juda, sat each on his throne clothed with (their) robes [To wit, with special Royal Robes, in which they shewed their majesty, state, and glory. Oth. having on (their) armour] on the plain, [understand an even, unbuilt, and empty void place: see Gen.50.on ver.10. Such are conceived to have been in former times before the gates of the City for Market-places, or wide spacious places, there to put a number of souldiers in battle-aray, when they feared the in rode of enemies] at the door of the gate of Samaria: and all the Prophets [understand of whom is spoken above ver.6.as also below ver.12.] prophesied in their presence."}],"11":[{"catchword":null,"tekst":"And Zedekia [One of the fore-mentioned Prophets, who is to be distinguished from another false prophet of this name, the son of Maaseja, Jerem 29 21.] the son of Canaan had made himself iron horn; [To set, forth, or shew forth his prophecy by it, as by a token, and then to explain it by word of mouth, as Prophets frequently used to do] and he said; Thus saith the LORD; [he pretendeth the Name Jehovah, to wit, the Name of the onely true God, and not the names of his Idols; as also below ver.12,24 not onely to make his Prophecy the more acceptable before King Josaphat, but also to testify before every one, that their whole Religion, Worship, and prophesying, was as it were directed thither, and aimed threat, viz. to perform honour and service to the God of that name. Compare Exo 32:4 5. Judg.17.3. 1 Kings 12.28.] with these thou shalt push the Syrians, until thou shalt have utterly consumed them. [the meaning is, that he should easily vanquish, and destroy them. For as the horned beast easily shall overthrow the others that have no horns; so it would not be difficult for him to vanquish and subdue the Syrians, that were much weaker then he.]"}],"12":[{"catchword":null,"tekst":"And all the Prophesied so, saying: Go up to Ramoth in Gilead, and thou shalt be prosperous; [Heb. Be prosperous: so below v.15. Compare Psal.37.on vers.3. and Prov.3.on ver.25.] for the LORD shall deliver it into the Kings hand."}],"13":[{"catchword":null,"tekst":"Now the messenger that was gone to call Micha, spake unto him saying; Behold now, the words of the Prophets are out of one mouth [Heb. one mouth, or, with one mouth] good unto the King; Let thy word, I pray, he according as the word of one of them, and speak (that which is) good. [i.e. the Victory over the Syrians, and the subduing of Ramoth in Gilead. Compare above v.8.and the annotate. and below v.18.]"}],"14":[{"catchword":null,"tekst":"But Micha said; (As true as) the LORD liveth, that which the LORD shall say unto me, that will I speak."}],"15":[{"catchword":null,"tekst":"When he was come to the King, then the King said unto him; Micha, shall we go to Ramoth in Gilead to battle, or shall we for bear (it)? And he said unto him; deliver it into the Kings hand. [The Prophet doth not speak this in good earnest, but as it were mocking at the answer, and foretelling of the false prophets, whose words he therefore likewise useth, as they are related above verse 12. (for the Lord had revealed them unto him). ThereforeAchab perceiving by his phrase, countenance, and gestures, that he meant not in earnest what he said chargeth him in the following verse, to give a serious answer: it was therefore a command or counsel ironically. Compare Judg.10.14. Ecc 11:9. Eze 20:39. Amos 4 4,5. Mat 23:32.]"}],"16":[{"catchword":null,"tekst":"And the King said unto him; for how many times shall I adjure thee, that thou tell me nothing, but onely the truth, in the Name of the LORD? [i.e. By the command and inspiration of the LORD. See 2 King.2. on verse 24.]"}],"17":[{"catchword":null,"tekst":"And he said; I saw [To wit, in a Prophetical Vision, which happened to my spirit. See of these Visions, Gen.15.on v.1.] all Israel scattered upon the mountains, as sheep that have no sherperd: and the LORD said; These have no Lord; [oth. these shall have no Lord] every man return to his house in peace. [in this Vision three things were revealed to him: First, That the Israelites should get no Victory, but should flee before the Syrians. Secondly, that Achab should perish and die. Thirdly, that the people should not perish at this time in battle, but should return home to their houses]"}],"18":[{"catchword":null,"tekst":"Then said the King of Israel unto Josaphar; Did I not tell thee (that) he would prophesy no good concerning me, but evil? [See above v.8.]"}],"19":[{"catchword":null,"tekst":"Furthermore, he [Namely the Prophet Micha] said; Therefore hear ye the word of the LORD: I saw the LORD [viz. not in his essence, but in the tokens of his manifestation, which were shewed unto the Prophets, sometimes corporally to the eyes of the body, sometimes onely spiritually to the understand: see Genes.32.on v.30. and Numb.12.on v.3.] sitting on his throne, and all the heavenly host [understand the Angels, or heavenly spirits: see Gen.2. on v.1. and above chap.18.on v.15. and compare Psal.103.21. and 148.2. Isa. 45.12.] standing by him at his right hand, and at his left. [God is thus represented to us by resemblance of an Earthly Monarch, who being compassed about with many Ministers and Attendants, sitteth down to judge. The end is, to instruct us concerning the glory of his Majesty, the wisdom of his Government, and the righteousness of his judgement, and the omnipotency of his Works.]"}],"20":[{"catchword":null,"tekst":"And the LORD said; Who shall persuade Achab, that he may go up, and fall at Ramoth in Gilead? Now the one said, thus; and the other said, so. [Heb. This said in, or, with, so; and this said in, or, with so; that is, the one said, on this manner, and the other said, on that manner.]"}],"21":[{"catchword":null,"tekst":"Then a spirit came forth, and stood before the face of the LORD, and said, I will persuade him. [This was one evil spirits, which God, according to his infinite wisdom, knoweth to use, without being defiled by their evil practise, not onely to try his children, Job 1:12. and 2.6. and to humble them, 2 Cor.12.7. but also to punish, and destroy the wicked , as appeareth here, and 1 Sam.16.14. & 2 Thes.2.9,10,11.] and the LORD said unto him, Wherewith?"}],"22":[{"catchword":null,"tekst":"And he said; I will go forth, and he a Lying Spirit [Heb. a spirit of falseh // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];

    }).join('');
}

    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
