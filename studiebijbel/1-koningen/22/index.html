vestigde het koninkrijk in zijn hand, en heel Juda gaf Josafat geschenken; en hij had rijkdom en eer in overvloed.","Job 34:9":"Want hij heeft gezegd: Het baat een man niet, als hij welbehagen heeft aan God.","Klaagl 1:7":"Zain. Jeruzalem is, in de dagen van haar ellende en haar veelvuldige ballingschap, indachtig geworden aan al haar gewenste dingen, die zij van oude dagen af gehad heeft; omdat haar volk door de hand van de tegenstander valt, en zij geen helper heeft; de tegenstanders zien haar aan, zij spotten met haar rustdagen.","2 Kron 15:8":"Toen Asa nu deze woorden hoorde, en de profetie van de profeet Oded, vatte hij moed, en hij deed de afschuwelijke afgodsbeelden weg uit het hele land van Juda en Benjamin, en uit de steden die hij van het gebergte van Efraïm had ingenomen, en hij vernieuwde het altaar van de HEERE, dat vóór het voorhuis van de HEERE was.","Lev 1:1":"En de HEERE riep Mozes, en sprak tot hem uit de tent van de samenkomst, en zei:","Ps 108:10":"Moab is mijn waspot; op Edom zal ik mijn schoen werpen; over Palestina zal ik juichen.","Lev 20:13":"Wanneer ook een man gemeenschap heeft met een man, zoals met een vrouw, hebben zij beiden een gruwel gedaan; zij zullen zeker gedood worden; hun bloed is op hen!","Hand 5:25":"En er kwam iemand, en berichtte hun, en zei: Zie, de mannen die u in de gevangenis gezet hebt, staan in de tempel, en leren het volk.","Jer 50:29":"Laat u horen tegen Babel, u schutters! U allen die de boog spant! Leger u tegen haar rondom, laat niemand van hen ontkomen; vergeld haar naar haar werk, doe haar naar alles wat zij gedaan heeft; want zij heeft trots gehandeld tegen de HEERE, tegen de Heilige van Israël.","1 Sam 10:7":"En het zal gebeuren, als deze tekenen u overkomen, doe dan wat uw hand vindt te doen, want God zal met u zijn.","Mark 4:21":"En Hij zei tegen hen: Wordt de lamp soms binnengebracht om onder de korenmaat of onder het bed gezet te worden? Is het niet om op de standaard gezet te worden?","Openb 4:3":"En Hij Die daarop zat, zag er uit als de steen jaspis en sardius; en een regenboog was rondom de troon, die er uitzag als een smaragd.","Rom 10:1":"Broeders, de toegenegenheid van mijn hart en het gebed dat ik tot God doe voor Israël, is tot hun zaligheid.","1 Sam 28:8":"En Saul vermomde zich, en trok andere kleren aan, en ging op weg, met twee mannen bij hem, en zij kwamen 's nachts bij de vrouw, en hij zei: Voorspel mij toch door de waarzeggende geest, en laat opkomen wie ik u zeggen zal.","1 Kon 21:27-29":"Het gebeurde nu, toen Achab deze woorden hoorde, dat hij zijn kleren scheurde, en een zak om zijn lichaam legde, en vastte; hij lag ook neer in de zak, en ging langzaam. En het woord van de HEERE kwam tot Elia, de Thisbiet: Hebt u gezien dat Achab zich vernedert voor Mijn aangezicht? Omdat hij zich vernedert voor Mijn aangezicht, zal Ik dat kwaad in zijn dagen niet brengen; in de dagen van zijn zoon zal Ik dat kwaad over zijn huis brengen.","Dan 3:18":"Maar als dat niet zo is, laat het u bekend zijn, o koning, dat wij uw goden niet zullen eren, en ook het gouden beeld, dat u hebt opgericht, niet zullen aanbidden.","Richt 20:23":"En de kinderen van Israël trokken op, en weenden voor het aangezicht van de HEERE tot de avond, en vroegen de HEERE en zeiden: Zal ik weer naderen ten strijde tegen de kinderen van Benjamin, mijn broeder? En de HEERE zei: Trek tegen hem op.","Num 12:6-8":"En Hij zei: Hoor nu Mijn woorden! Als er een profeet onder u is, zal Ik, de HEERE, Mij door een gezicht aan hem bekendmaken, door een droom zal Ik met hem spreken. Zo is Mijn knecht Mozes niet, die in heel Mijn huis trouw is. Van mond tot mond spreek Ik met hem, en duidelijk zichtbaar, en niet door duistere woorden; en de gestalte van de HEERE aanschouwt hij; waarom hebt u er dan niet voor gevreesd om tegen Mijn knecht, tegen Mozes, te spreken?","Num 11:25":"Toen kwam de HEERE neer in de wolk, en sprak tot hem, en Hij nam van de Geest die op hem was, en legde die op de zeventig mannen, de oudsten; en het gebeurde, toen de Geest op hen rustte, dat zij profeteerden, maar daarna niet meer.","Ps 10:11":"Hij zegt in zijn hart: God heeft het vergeten, Hij heeft Zijn aangezicht verborgen, Hij ziet het nooit.","1 Kon 15:11":"En Asa deed wat recht was in de ogen van de HEERE, zoals zijn vader David.","Gen 41:16":"En Jozef antwoordde Farao: Het is niet aan mij! God zal Farao welzijn aanzeggen.","Job 34:17-19":"Zou Hij ook, Die het recht haat, de gewonde verbinden, en zou u de zeer Rechtvaardige veroordelen? Zou men tot een koning zeggen: U bent Belial; tot de vorsten: U bent goddelozen! Hoe dan tot Hem, Die het aangezicht van de vorsten niet aanneemt, en de rijke voor de arme niet kent? Want zij zijn allen het werk van Zijn handen.","Amos 7:17":"Daarom zegt de HEERE zo: Uw vrouw zal in de stad hoereren, en uw zonen en uw dochters zullen door het zwaard vallen, en uw land zal met het meetsnoer verdeeld worden; en u zult in een onrein land sterven, en Israël zal zeker uit zijn land gevankelijk worden weggevoerd.","2 Kon 6:32":"(Elisa nu zat in zijn huis, en de oudsten zaten bij hem.) En hij zond een man voor zijn aangezicht; maar voordat de bode bij hem gekomen was, had hij tegen de oudsten gezegd: Hebt u gezien hoe deze zoon van een moordenaar gezonden heeft om mijn hoofd af te nemen? Let op, wanneer die bode komt, sluit de deur toe, en houd hem tegen bij de deur; is niet het geluid van de voeten van zijn heer achter hem?","Job 15:26":"Hij loopt tegen Hem aan met de hals, met zijn dikke, hoog verheven schilden;","1 Kon 20:28":"En de man van God trad toe, en sprak tegen de koning van Israël, en zei: Zo zegt de HEERE: Omdat de Syriërs gezegd hebben: De HEERE is een God van de bergen, en Hij is niet een God van de laagten; zo zal Ik al deze grote menigte in uw hand geven, opdat u weet, dat Ik de HEERE ben.","Jer 34:1":"Het woord dat tot Jeremia gebeurde van de HEERE, toen Nebukadnezar, koning van Babel, en zijn hele leger, en alle koninkrijken van de aarde die onder de heerschappij van zijn hand waren, en alle volken tegen Jeruzalem streden, en tegen al haar steden, en zei:","Hand 18:12":"Maar toen Gallio stadhouder van Achaje was, stonden de Joden eensgezind tegen Paulus op, en brachten hem voor de rechterstoel,","1 Kon 21:19-24":"En u zult tot hem spreken en zeggen: Zo zegt de HEERE: Hebt u doodgeslagen, en ook een erfelijke bezitting ingenomen? Daartoe zult u tot hem spreken en zeggen: Zo zegt de HEERE: Op de plaats waar de honden het bloed van Naboth gelekt hebben, zullen de honden ook uw bloed lekken, ja, het uwe! En Achab zei tegen Elia: Hebt u mij gevonden, o mijn vijand? En hij zei: Ik heb u gevonden, omdat u uzelf verkocht hebt om te doen wat kwaad is in de ogen van de HEERE. Zie, Ik zal kwaad over u brengen, en uw nakomelingen wegdoen; en Ik zal van Achab uitroeien wie mannelijk is, alsook wie in Israël afgesloten is en wie verlaten is.","Richt 1:1":"En het gebeurde na de dood van Jozua, dat de Israëlieten de HEERE vroegen: Wie zal onder ons het eerst optrekken naar de Kanaänieten, om tegen hen te strijden?","Micha 2:11":"Als er iemand is die met wind omgaat en vals liegt, en zegt: Ik zal u profeteren van wijn en van sterke drank! dan is dat een profeet voor dit volk.","Jer 26:12-15":"Maar Jeremia sprak tot al de vorsten en tot al het volk, en zei: De HEERE heeft mij gezonden, om tegen dit huis en tegen deze stad te profeteren al de woorden die u gehoord hebt; Nu dan, maak uw wegen en uw daden goed, en gehoorzaam de stem van de HEERE, uw God; dan zal het de HEERE berouwen over het kwaad dat Hij tegen u gesproken heeft. Maar ik, zie, ik ben in uw handen; doe met mij zoals het goed en recht is in uw ogen;","Est 6:8":"laat men het koninklijke kleed brengen dat de koning gewoonlijk draagt, en het paard waarop de koning gewoonlijk rijdt, en laat de koninklijke kroon op zijn hoofd gezet worden.","Job 22:14":"De wolken zijn voor Hem een verberging, zodat Hij niet ziet; en Hij wandelt op de omgang van de hemel.","Ezech 37:1":"De hand van de HEERE was op mij, en de HEERE voerde mij uit in de geest, en zette mij neer in het midden van een vallei; die was nu vol beenderen.","Deut 34:9-11":"Jozua nu, de zoon van Nun, was vol van de Geest van wijsheid; want Mozes had zijn handen op hem gelegd; zo luisterden de kinderen van Israël naar hem, en deden zoals de HEERE Mozes geboden had. En er stond in Israël geen profeet meer op zoals Mozes, die de HEERE gekend had, van aangezicht tot aangezicht, In al de tekenen en de wonderen, waartoe de HEERE hem gezonden had, om die te doen in het land Egypte aan farao, en aan al zijn knechten, en aan heel zijn land;","Ezech 9:4":"En de HEERE zei tot hem: Ga door, door het midden van de stad, door het midden van Jeruzalem, en zet een teken op de voorhoofden van de mensen die zuchten en uitroepen over al die gruwelen die in haar midden gedaan worden.","2 Kon 8:25-27":"In het twaalfde jaar van Joram, de zoon van Achab, de koning van Israël, begon Ahazia, de zoon van Jehoram, de koning van Juda, te regeren. Ahazia was tweeëntwintig jaar oud toen hij koning werd, en regeerde één jaar in Jeruzalem; en de naam van zijn moeder was Athalia, de dochter van Omri, de koning van Israël. En hij ging de weg van het huis van Achab, en deed wat slecht was in de ogen van de HEERE, zoals het huis van Achab; want hij was een schoonzoon van het huis van Achab.","2 Kon 2:23":"En hij ging vandaar op naar Beth-el. Toen hij nu de weg opging, kwamen er kleine jongens uit de stad; die bespotten hem, en zeiden tegen hem: Kaalkop, ga op, kaalkop, ga op!","Pred 12:10":"De prediker zocht aangename woorden te vinden, en wat er geschreven is, is recht: woorden van de waarheid.","Ezech 3:10-12":"Verder zei Hij tot mij: Mensenkind, vat al Mijn woorden, die Ik tot u spreken zal, in uw hart, en hoor ze met uw oren. En ga heen, kom tot de weggevoerden, tot de kinderen van uw volk, en spreek tot hen, en zeg tot hen: Zo zegt de Heere HEERE, hetzij dat zij horen zullen, of hetzij dat zij het laten zullen. Toen nam de Geest mij op, en ik hoorde achter mij een stem van een groot ruisen, en zei: Geloofd zij de heerlijkheid van de HEERE uit Zijn plaats!","Jes 28:9":"Aan wie zou Hij dan de kennis leren, en aan wie zou Hij het gehoorde te verstaan geven? Aan hen die van de melk gespeend zijn, die van de borsten weggehaald zijn?","1 Kon 22:29-36":"Zo trok de koning van Israël en Josafat, de koning van Juda, op naar Ramoth in Gilead. En de koning van Israël zei tegen Josafat: Ik zal mij vermommen en dan in de strijd komen; maar u, trek uw kleren aan. Zo vermomde de koning van Israël zich, en kwam in de strijd. De koning van Syrië nu had zijn tweeëndertig aanvoerders van de wagens geboden en gezegd: U zult niet vechten tegen klein of groot, maar alleen tegen de koning van Israël.","1 Tess 3:2":"en wij hebben Timotheüs gezonden, onze broeder en Gods dienaar en onze medearbeider in het Evangelie van Christus, om u te versterken en u te vermanen aangaande uw geloof;","Matt 23:37":"Jeruzalem, Jeruzalem! U die de profeten doodt, en stenigt hen die tot u gezonden zijn! Hoe vaak heb Ik uw kinderen bijeen willen brengen, zoals een hen haar kuikens bijeenbrengt onder de vleugels; en u hebt niet gewild.","Num 33:35":"En zij vertrokken van Abrona, en legerden zich in Ezeon-geber.","Ex 19:3":"En Mozes klom op naar God. En de HEERE riep tot hem van de berg en zei: Zo zult u tot het huis van Jakob spreken, en de kinderen van Israël verkondigen:","Ps 74:18-23":"Denk hieraan; de vijand heeft de HEERE gesmaad, en een dwaas volk heeft Uw Naam gelasterd. Geef het leven van Uw tortelduif niet over aan het wilde gedierte; vergeet het leven van Uw ellendigen niet voor eeuwig. Zie naar het verbond; want de duistere plaatsen van het land zijn vol woningen van geweld.","Rom 15:18-21":"Want ik zou niet durven iets zeggen dat Christus niet door mij gewerkt heeft, tot gehoorzaamheid van de heidenen, met woorden en werken; door kracht van tekenen en wonderen, en door de kracht van de Geest van God, zodat ik, van Jeruzalem af en rondom, tot Illyricum toe, het Evangelie van Christus vervuld heb. En zo zeer begerig geweest ben om het Evangelie te verkondigen, niet waar Christus genoemd was, opdat ik niet op eens anders fundament zou bouwen;","Deut 18:20-22":"Maar de profeet die hoogmoedig handelt door een woord te spreken in Mijn Naam, dat Ik hem niet geboden heb te spreken, of die zal spreken in de naam van andere goden, die profeet zal sterven. Als u dan in uw hart zou zeggen: Hoe zullen wij het woord kennen dat de HEERE niet gesproken heeft? Wanneer die profeet in de Naam van de HEERE gesproken heeft, en dat woord gebeurt niet en komt niet uit, dan is dat het woord dat de HEERE niet gesproken heeft; door trots heeft die profeet dat gesproken; u hoeft niet bevreesd voor hem te zijn.","2 Kron 28:20":"En Tiglath-Pilneser, de koning van Assyrië, kwam tot hem; maar hij benauwde hem, en versterkte hem niet.","Ex 3:15":"Toen zei God verder tegen Mozes: Zo zult u tegen de kinderen van Israël zeggen: De HEERE, de God van uw vaderen, de God van Abraham, de God van Izak, en de God van Jakob, heeft mij tot u gezonden; dat is Mijn Naam eeuwig, en dat is Mijn gedachtenis van geslacht tot geslacht.","1 Kon 8:43":"hoor Ú in de hemel, de vaste plaats van Uw woning, en doe naar alles waarom die vreemdeling tot U roepen zal; opdat alle volken van de aarde Uw Naam kennen, om U te vrezen, zoals Uw volk Israël, en om te weten, dat Uw Naam genoemd wordt over dit huis, dat ik gebouwd heb.","Ezech 27:12":"Tarsis dreef koophandel met u vanwege de veelheid van allerlei goed; met zilver, ijzer, tin, en lood handelden zij op uw markten.","Jer 8:11":"En zij genezen de breuk van de dochter van Mijn volk op het lichtste, en zeggen: Vrede, vrede! Terwijl er geen vrede is.","1 Sam 28:15":"En Samuel zei tegen Saul: Waarom hebt u mij onrustig gemaakt, door mij te laten opkomen? Toen zei Saul: Ik ben erg beangstigd, want de Filistijnen strijden tegen mij, en God is van mij geweken, en antwoordt mij niet meer, niet door de dienst van de profeten, niet door dromen; daarom heb ik u geroepen, zodat u mij te kennen geeft wat ik doen zal.","2 Kon 2:15":"Toen de zonen van de profeten, die tegenover te Jericho waren, hem zagen, zeiden zij: De geest van Elia rust op Elisa; en zij kwamen hem tegemoet, en bogen zich voor hem neer ter aarde.","Hand 8:40":"Maar Filippus werd gevonden te Azote; en terwijl hij het land doortrok, verkondigde hij het Evangelie in alle steden, totdat hij in Cesarea kwam.","Est 6:9":"En men moet dat kleed en dat paard geven in de hand van een van de vorsten van de koning, van de aanzienlijkste heren, en men moet het die man aantrekken aan wie de koning graag eer wil bewijzen; en men moet hem op dat paard laten rijden door de straten van de stad, en men moet vóór hem uit roepen: Zo zal men doen met de man aan wie de koning graag eer wil bewijzen!","Openb 17:17":"Want God heeft hun in hun hart gegeven dat zij Zijn plan uitvoeren, en dat zij één en dezelfde gezindheid uitvoeren, en dat zij hun koninkrijk aan het beest geven, totdat de woorden van God vervuld zullen zijn.","Ex 32:32":"Nu dan, als Gij hun zonde wilt vergeven! Maar zo niet, delg mij dan nu uit Uw boek, dat Gij geschreven hebt.","1 Kon 12:31":"Hij maakte ook een huis der hoogten; en maakte priesters van de geringste mensen van het volk, die niet uit de zonen van Levi waren.","Judas 1:1":"Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:","2 Kron 18:25":"De koning van Israël nu zei: Neem Micha, en breng hem terug naar Amon, de leider van de stad, en naar Joas, de zoon van de koning;","Hebr 12:15":"Let er goed op dat niemand verachtert van de genade van God; dat niet enige wortel van bitterheid, die opwaarts uitspruit, opschudding maakt en daardoor velen ontreinigd worden.","1 Sam 19:24":"En hij trok zelf ook zijn kleren uit, en hij profeteerde zelf ook, voor het aangezicht van Samuël; en hij viel naakt neer, diezelfde hele dag en de hele nacht. Daarom zegt men: Is Saul ook onder de profeten?","Ps 59:8":"Zie, zij storten overvloedig uit met hun mond; zwaarden zijn op hun lippen; want wie hoort het?","2 Petr 1:12":"Daarom zal ik niet nalaten u er altijd aan te herinneren, hoewel u het weet en versterkt bent in de waarheid die u nu hebt.","Jer 24:4":"Toen kwam het woord van de HEERE tot mij, en Hij zei:","Ps 94:7-9":"En zeggen: De HEERE ziet het niet, en de God van Jakob merkt het niet. Let op, u onverstandigen onder het volk! En u dwazen! Wanneer zult u verstandig worden? Zou Hij, Die het oor plant, niet horen? Zou Hij, Die het oog vormt, niet zien?","1 Sam 3:21":"En de HEERE ging door met verschijnen te Silo; want de HEERE openbaarde Zich aan Samuël te Silo, door het woord van de HEERE.","Jes 63:11":"Toch dacht Hij aan de dagen van ouds, aan Mozes en Zijn volk; maar nu, waar is Hij, Die hen uit de zee opgebracht heeft, met de herders van Zijn kudde? Waar is Hij, Die Zijn Heilige Geest in het midden van hen stelde?","1 Sam 10:6":"En de Geest van de HEERE zal vaardig worden over u, en u zult met hen profeteren; en u zult in een andere man veranderd worden.","Joh 1:41-43":"Andreas, de broer van Simon Petrus, was een van de twee die het van Johannes gehoord hadden, en Hem gevolgd waren. Deze vond eerst zijn broer Simon, en zei tegen hem: Wij hebben de Messias gevonden, wat vertaald betekent: de Christus. En hij bracht hem tot Jezus. En Jezus keek hem aan, en zei: U bent Simon, de zoon van Jona; u zult Cefas genoemd worden, wat vertaald wordt als Petrus.","Jes 47:11":"Daarom zal er over u een kwaad komen, u zult de dageraad daarvan niet weten; en een verderf zal er op u vallen, dat u niet zult kunnen verzoenen; want er zal snel een onstuimige verwoesting over u komen, zodat u het niet weten zult.","Hand 11:20":"En er waren enige mannen uit Cyprus en Cyrene onder hen, die naar Antiochië gekomen waren en tot de Grieken spraken, terwijl zij de Heere Jezus verkondigden.","Ex 32:8":"Zij zijn snel afgeweken van de weg die Ik hun geboden had; zij hebben zich een gegoten kalf gemaakt, zich daarvoor neergebogen, er offers aan gebracht, en gezegd: Dit zijn uw goden, Israël, die u uit Egypteland hebben opgevoerd.","Amos 7:15":"Maar de HEERE nam mij van achter de kudde vandaan; en de HEERE zei tegen mij: Ga heen, profeteer tegen Mijn volk Israël.","Luk 4:9-11":"En hij leidde Hem naar Jeruzalem, en zette Hem op de rand van het dak van de tempel, en zei tegen Hem: Als U de Zoon van God bent, werp Uzelf van hier naar beneden; Want er is geschreven dat Hij Zijn engelen bevelen zal geven over U, dat zij U bewaren zullen; En dat zij U op de handen zullen dragen, opdat U uw voet niet ooit aan een steen stoot.","Jer 5:14":"Daarom zegt de HEERE, de God van de heerscharen, zo, omdat u dit woord spreekt: Zie, Ik zal Mijn woorden in uw mond tot vuur maken, en dit volk tot hout, en het zal hen verteren.","2 Kor 6:16":"Of welke samenvoeging heeft de tempel van God met de afgoden? Want u bent de tempel van de levende God; zoals God gezegd heeft: Ik zal in hen wonen, en Ik zal onder hen wandelen; en Ik zal hun God zijn, en zij zullen Mij een volk zijn.","Openb 20:10":"En de duivel, die hen verleidde, werd geworpen in de poel van het vuur en sulfer, waar het beest en de valse profeet zijn; en zij zullen gepijnigd worden dag en nacht in alle eeuwigheid.","Joh 15:20":"Denk aan het woord dat Ik u gezegd heb: Een dienstknecht is niet meer dan zijn heer. Als zij Mij vervolgd hebben, zullen zij ook u vervolgen; als zij Mijn woord bewaard hebben, zullen zij ook het uwe bewaren.","Ps 53:2":"De dwaas zegt in zijn hart: Er is geen God; zij verderven het, en zij bedrijven gruwelijk onrecht; er is niemand die goed doet.","1 Sam 23:4":"Toen vroeg David de HEERE nog verder; en de HEERE antwoordde hem en zei: Maak u op, trek af naar Kehila; want Ik geef de Filistijnen in uw hand.","1 Kon 15:2":"Hij regeerde drie jaren te Jeruzalem; en de naam van zijn moeder was Maächa, een dochter van Abisalom.","1 Kon 12:24":"Zo zegt de HEERE: U zult niet optrekken, noch strijden tegen uw broeders, de kinderen van Israël; ieder keert terug naar zijn huis, want deze zaak is van Mij gebeurd. En zij hoorden het woord van de HEERE, en keerden terug om weg te trekken naar het woord van de HEERE.","Spr 4:27":"Wijk niet naar rechts of naar links, wend uw voet af van het kwade.","Ps 94:16":"Wie zal voor mij opstaan tegen de kwaaddoeners? Wie zal zich voor mij stellen tegen de werkers van de ongerechtigheid?","1 Tess 5:3":"Want wanneer zij zullen zeggen: Het is vrede en veilig; dan zal een plotseling verderf hun overkomen, zoals de barensweeën een zwangere vrouw overkomen; en zij zullen het geenszins ontvluchten;","1 Sam 4:10":"Toen streden de Filistijnen, en Israël werd verslagen, en zij vluchtten ieder naar zijn tent; en er kwam een zeer grote nederlaag, zodat er van Israël dertigduizend man van het voetvolk vielen.","Luk 19:41":"En toen Hij dichtbij kwam en de stad zag, weende Hij over haar,","2 Kon 8:16-18":"In het vijfde jaar van Joram, de zoon van Achab, de koning van Israël, toen Josafat koning was van Juda, begon Jehoram, de zoon van Josafat, de koning van Juda, te regeren. Hij was tweeëndertig jaar oud toen hij koning werd, en hij regeerde acht jaar in Jeruzalem. En hij ging de weg van de koningen van Israël, zoals het huis van Achab deed; want de dochter van Achab was zijn vrouw geworden; en hij deed wat slecht was in de ogen van de HEERE.","1 Kon 17:24":"Toen zei die vrouw tegen Elia: Nu weet ik dat u een man van God bent, en dat het woord van de HEERE in uw mond waarheid is.","Fil 2:30":"Want om het werk van Christus is hij dicht bij de dood gekomen, terwijl hij zijn leven niet ontzag, opdat hij het gebrek van uw bediening aan mij zou aanvullen.","Ps 69:8-10":"Want om Uwentwil draag ik smaad; schande heeft mijn gezicht bedekt. Ik ben mijn broeders vreemd geworden, en onbekend aan de kinderen van mijn moeder. Want de ijver voor Uw huis heeft mij verteerd; en de smaad van hen die U smaden, is op mij gevallen.","Richt 20:18":"En de kinderen van Israël maakten zich op, en trokken op naar het huis van God, en vroegen God om raad, en zeiden: Wie zal onder ons als eerste optrekken ten strijde tegen de kinderen van Benjamin? En de HEERE zei: Juda als eerste.","2 Kon 3:11":"En Josafat zei: Is hier geen profeet van de HEERE, zodat wij door hem de HEERE kunnen raadplegen? Toen antwoordde een van de dienaren van de koning van Israël, en zei: Hier is Elisa, de zoon van Safat, die water op Elia's handen goot.","Dan 8:25":"En door zijn sluwheid zal hij de bedrieglijkheid doen slagen in zijn hand; en hij zal zich in zijn hart verheffen; en in een tijd van schijnbare rust zal hij velen te gronde richten, en hij zal opstaan tegen de Vorst der vorsten, maar hij zal gebroken worden, zonder mensenhand.","Amos 3:8":"De leeuw heeft gebruld, wie zou niet vrezen? De Heere HEERE heeft gesproken, wie zou niet profeteren?","Jer 50:6":"Mijn volk waren verloren schapen, hun herders hadden hen verleid, zij hadden hen naar de bergen gevoerd, zij gingen van berg tot heuvel, zij vergaten hun rustplaats.","Matt 7:15":"Maar wacht u voor de valse profeten, die in schaapskleren naar u toe komen, maar van binnen zijn het roofzuchtige wolven.","1 Kon 15:12":"Want hij nam de schandjongens weg uit het land, en deed alle drekgoden weg, die zijn vaders gemaakt hadden.","Jes 14:13":"En u zei in uw hart: Ik zal ten hemel opklimmen, ik zal mijn troon boven de sterren van God verhogen; en ik zal mij zetten op de berg van de samenkomst aan de zijden van het noorden.","Zach 1:7":"Op de vierentwintigste dag, in de elfde maand (dat is de maand Schebat), in het tweede jaar van Darius, kwam het woord van de HEERE tot Zacharia, de zoon van Berechja, de zoon van Iddo, de profeet, en hij zei:","1 Kon 22:3-29":"Toen zei de koning van Israël tegen zijn knechten: Weet u dat Ramoth in Gilead van ons is? En wij blijven stil, zonder het uit de hand van de koning van Syrië te nemen. Daarna zei hij tegen Josafat: Zult u met mij optrekken naar de strijd bij Ramoth in Gilead? En Josafat zei tegen de koning van Israël: Ik zal zijn zoals u bent, mijn volk zoals uw volk, mijn paarden zoals uw paarden. Verder zei Josafat tegen de koning van Israël: Vraag toch vandaag naar het woord van de HEERE.","Dan 7:10":"Een vurige rivier vloeide, en ging voor Hem uit, duizendmaal duizenden dienden Hem, en tien duizendmaal tien duizenden stonden voor Hem; het gericht zette zich, en de boeken werden geopend.","Amos 7:7":"Nog liet Hij mij dit zien: zie, de Heere stond op een muur, die met een paslood gemaakt was, en een paslood was in Zijn hand.","Ps 119:139":"Mijn ijver heeft mij doen vergaan, omdat mijn tegenstanders Uw woorden vergeten hebben.","Micha 3:11":"Haar hoofden rechtspreken om geschenken, en haar priesters leren om loon, en haar profeten waarzeggen om geld; nog steunen zij op de HEERE, en zeggen: Is de HEERE niet in ons midden? Ons zal geen kwaad overkomen.","Jes 5:18":"Wee hun die de ongerechtigheid trekken met koorden van ijdelheid, en de zonde als met dikke wagentouwen!","1 Sam 17:38":"En Saul kleedde David met zijn kleren, en zette een koperen helm op zijn hoofd, en kleedde hem met een pantser.","Jes 44:20":"Hij voedt zich met as, het bedrogen hart heeft hem terzijde afgeleid; zodat hij zijn ziel niet redden kan, en ook niet kan zeggen: Is er niet een leugen in mijn rechterhand?","1 Kon 15:34":"En hij deed wat kwaad was in de ogen van de HEERE, en wandelde in de weg van Jerobeam, en in zijn zonde, waarmee hij Israël had doen zondigen.","Job 2:1":"Er kwam weer een dag dat de kinderen van God kwamen om zich voor de HEERE te stellen, en de satan kwam ook in hun midden om zich voor de HEERE te stellen.","Matt 26:53":"Of denkt u dat Ik Mijn Vader nu niet kan bidden, en Hij zal Mij meer dan twaalf legioenen engelen ter beschikking stellen?","Luk 11:15":"Maar sommigen van hen zeiden: Hij drijft de demonen uit door Beëlzebul, de leider van de demonen.","Ps 50:15":"En roept Mij aan in de dag van benauwdheid; Ik zal u eruit helpen, en u zult Mij eren.","Joh 1:6":"Er was een mens door God gezonden, wiens naam Johannes was.","1 Sam 23:2-12":"En David vroeg de HEERE: Zal ik heengaan en deze Filistijnen verslaan? En de HEERE zei tegen David: Ga heen, en u zult de Filistijnen verslaan en Kehila verlossen. Maar de mannen van David zeiden tegen hem: Kijk, wij zijn al bang hier in Juda; hoeveel te meer als wij naar Kehila zullen gaan tegen de slagorden van de Filistijnen. Toen vroeg David de HEERE nog verder; en de HEERE antwoordde hem en zei: Maak u op, trek af naar Kehila; want Ik geef de Filistijnen in uw hand.","Mal 1:7":"U brengt op Mijn altaar verontreinigd brood, en zegt: Waarmee verontreinigen wij U? Daarmee, dat u zegt: De tafel van de HEERE is verachtelijk.","Deut 1:6":"De HEERE, onze God, sprak tot ons bij Horeb, en zei: U bent lang genoeg bij deze berg gebleven.","Joz 6:26":"En terzelfder tijd bezwoer Jozua hen, en zei: Vervloekt zij die man voor het aangezicht van de HEERE, die zich opmaakt en deze stad Jericho bouwen zal; dat hij haar grondvest op zijn eerstgeboren zoon, en haar poorten stelt op zijn jongste zoon!","Jer 23:28":"De profeet, bij wie een droom is, vertelt de droom; en bij wie Mijn woord is, spreekt Mijn woord waarachtig; wat heeft het stro met het koren te maken? spreekt de HEERE.","1 Petr 3:2":"Als zij uw kuise wandel in vreze zullen hebben gezien.","Hebr 10:29":"hoeveel zwaarder straf, denkt u, zal hij waard geacht worden, die de Zoon van God met voeten heeft getreden, en het bloed van het testament, waardoor hij geheiligd was, als onrein heeft beschouwd, en de Geest van de genade smaad heeft aangedaan?","Richt 1:3":"Toen zei Juda tegen zijn broeder Simeon: Trek met mij op in mijn lot, en laten we tegen de Kanaänieten strijden, dan zal ik ook met u optrekken in uw lot. Zo ging Simeon met hem mee.","Hand 19:38":"Als Demetrius dan, en de handwerkers die bij hem zijn, tegen iemand een zaak hebben, de rechtsdagen worden gehouden, en er zijn stadhouders; laat hen elkaar aanklagen.","1 Kon 15:31":"Het overige nu van de geschiedenissen van Nadab, en alles wat hij gedaan heeft, is dat niet geschreven in het boek van de kronieken van de koningen van Israël?","2 Kon 15:3":"En hij deed wat recht was in de ogen van de HEERE, precies zoals zijn vader Amazia gedaan had.","Gal 3:1":"O onverstandige Galaten, wie heeft u betoverd, dat u de waarheid niet zou gehoorzamen? U voor wie ogen Jezus Christus is voorgeschilderd, onder u gekruisigd.","1 Sam 30:8":"Toen vroeg David de HEERE: Zal ik deze bende achternajagen? Zal ik ze inhalen? En Hij zei tegen hem: Jaag na, want u zult zeker inhalen, en u zult zeker verlossen.","Openb 20:8":"En hij zal uitgaan om de volken te verleiden, die in de vier hoeken van de aarde zijn, Gog en Magog, om hen te verzamelen tot de strijd; hun aantal is als het zand aan de zee.","Hand 13:7":"Deze was bij de stadhouder Sergius Paulus, een verstandig man. Deze riep Barnabas en Saulus bij zich, en verlangde ernaar het Woord van God te horen.","Richt 13:25":"En de Geest van de HEERE begon hem soms te drijven in het leger van Dan, tussen Zora en Esthaol.","Luk 19:27":"Maar breng die vijanden van mij, die niet wilden dat ik koning over hen zou zijn, hier, en dood ze hier voor mij.","Hab 3:2":"HEERE! Toen ik Uw rede gehoord heb, ben ik bevreesd geworden; Uw werk, o HEERE! Behoud dat in het leven in het midden van de jaren, maak het bekend in het midden van de jaren; gedenk in de toorn aan het ontfermen.","Jes 28:10":"Want het is gebod op gebod, gebod op gebod, regel op regel, regel op regel, hier een weinig, daar een weinig.","1 Kon 16:28":"En Omri ontsliep met zijn vaderen, en werd begraven te Samaria; en zijn zoon Achab regeerde in zijn plaats.","Hand 13:8":"Maar Elymas, de tovenaar (want zo wordt zijn naam vertaald), weerstond hen, en probeerde de stadhouder van het geloof af te keren.","Jes 28:14-18":"Daarom, hoor het woord van de HEERE, u bespotters, u die heersen over dit volk, dat in Jeruzalem is! Omdat u zegt: Wij hebben een verbond met de dood gemaakt, en met het rijk van de dood hebben wij een voorzichtig verdrag gemaakt; wanneer de overstromende gesel doortrekt, zal hij bij ons niet komen; want wij hebben de leugen ons tot een toevlucht gesteld, en onder de valsheid hebben wij ons verborgen. Daarom, zo zegt de Heere HEERE: Zie, Ik leg een grondsteen in Sion, een beproefde steen, een kostbare hoeksteen, die stevig gegrondvest is; wie gelooft, die zal niet haasten.","1 Kon 20:42":"En hij zei tegen hem: Zo zegt de HEERE: Omdat u de man, die Ik verbannen had, uit uw hand hebt laten gaan, zal uw leven in de plaats van zijn leven zijn, en uw volk in de plaats van zijn volk.","2 Petr 2:4":"Want als God de engelen die gezondigd hebben niet gespaard heeft, maar hen in de hel geworpen heeft en overgegeven heeft aan de ketenen van de duisternis, om tot het oordeel bewaard te worden;","Ex 25:22":"En daar zal Ik bij u komen, en Ik zal met u spreken van boven het verzoendeksel af, van tussen de twee cherubs die op de ark van de getuigenis zullen zijn, alles wat Ik u gebieden zal aan de kinderen van Israël.","1 Kon 22:6-12":"Toen verzamelde de koning van Israël de profeten, ongeveer vierhonderd man, en hij zei tegen hen: Zal ik tegen Ramoth in Gilead ten strijde trekken, of zal ik het nalaten? En zij zeiden: Trek op, want de Heere zal ze in de hand van de koning geven. Maar Josafat zei: Is hier niet nog een profeet van de HEERE, zodat wij het hem konden vragen? Toen zei de koning van Israël tegen Josafat: Er is nog een man om door hem de HEERE te vragen; maar ik haat hem, omdat hij over mij niets goeds profeteert, maar kwaad: Micha, de zoon van Jimla. En Josafat zei: De koning moet dat niet zeggen!","Matt 5:13-16":"U bent het zout der aarde; maar als het zout smakeloos wordt, waarmee zal het gezouten worden? Het deugt nergens meer toe dan om buiten geworpen en door de mensen vertrapt te worden. U bent het licht der wereld; een stad die boven op een berg ligt, kan niet verborgen zijn. Ook steekt men geen kaars aan om die onder een korenmaat te zetten, maar op een kandelaar, en zij schijnt voor allen die in het huis zijn.","Mark 5:7":"En met luide stem roepend, zei hij: Wat heb ik met U te maken, Jezus, Zoon van God, de Allerhoogste? Ik bezweer U bij God, dat U mij niet pijnigt!","Jer 20:10":"Want ik heb de kwaadsprekerij van velen gehoord, schrik van alle kanten. \"Geef ons te kennen,\" zeggen ze, \"en wij zullen het bekendmaken\"; al mijn vertrouwde vrienden letten op mijn struikelen; ze zeggen: \"Misschien laat hij zich overhalen, dan zullen wij de overhand over hem krijgen, en onze wraak op hem nemen.\"","1 Kon 20:38":"Toen ging de profeet heen, en stond voor de koning op de weg; en hij vermomde zich met as over zijn ogen.","Ps 12:5":"Die zeggen: Wij zullen de overhand hebben met onze tong; onze lippen zijn onze! Wie is heer over ons?","Ezech 9:10":"Daarom ook, wat Mij aangaat, Mijn oog zal niet verschonen, en Ik zal niet sparen; Ik zal hun weg op hun hoofd geven.","Jak 4:14":"U weet niet wat morgen gebeuren zal, want hoe is uw leven? Het is immers een damp, die voor een korte tijd zichtbaar is, en daarna verdwijnt.","1 Tim 6:1":"Alle dienstknechten die onder het juk zijn, moeten hun eigen heren alle eer waardig achten, opdat de Naam van God en de leer niet gelasterd wordt.","Jer 23:25":"Ik heb gehoord wat de profeten zeggen, die in Mijn Naam leugen profeteren, en zeggen: Ik heb gedroomd, ik heb gedroomd.","2 Kon 8:18":"En hij ging de weg van de koningen van Israël, zoals het huis van Achab deed; want de dochter van Achab was zijn vrouw geworden; en hij deed wat slecht was in de ogen van de HEERE.","1 Kon 14:31":"En Rehabeam ontsliep met zijn vaderen, en werd begraven bij zijn vaderen in de stad van David; en de naam van zijn moeder was Naäma, de Ammonietische; en zijn zoon Abiam regeerde in zijn plaats.","1 Kon 18:46":"En de hand van de HEERE was op Elia, en hij gordde zijn lenden, en liep voor het aangezicht van Achab uit, tot waar men bij Jizreël komt.","1 Kon 20:35-42":"Toen zei een man uit de zonen van de profeten tegen zijn naaste, door het woord van de HEERE: Sla mij toch. En de man weigerde hem te slaan. En hij zei tegen hem: Omdat u de stem van de HEERE niet gehoorzaam bent geweest, zie, zodra u van mij weggegaan bent, zal een leeuw u doden. En toen hij van bij hem weggegaan was, vond een leeuw hem, die hem doodde. Daarna vond hij een andere man, en zei: Sla mij toch. En die man sloeg hem, en verwondde hem door hem te slaan.","1 Kon 4:13":"De zoon van Geber was te Ramoth in Gilead; hij had de dorpen van Jaïr, de zoon van Manasse, die in Gilead zijn; ook had hij de streek van Argob, die in Basan is, zestig grote steden met muren en koperen grendels.","1 Sam 9:6":"Hij daarentegen zei tegen hem: Zie toch, er is een man van God in deze stad, en hij is een geëerd man; alles wat hij zegt, komt zeker uit; laten wij nu daarheen gaan, misschien zal hij ons onze weg aanwijzen, die wij gaan zullen.","Openb 16:13":"En ik zag uit de mond van de draak, en uit de mond van het beest, en uit de mond van de valse profeet, drie onreine geesten komen, als kikvorsen;","Richt 2:1-11":"En een Engel van de HEERE kwam op van Gilgal naar Bochim, en Hij zei: Ik heb u uit Egypte opgevoerd, en u gebracht in het land dat Ik uw vaderen gezworen heb, en gezegd: Ik zal Mijn verbond met u niet verbreken in eeuwigheid. En wat u aangaat, u zult geen verbond maken met de inwoners van dit land; hun altaren zult u afbreken. Maar u bent Mijn stem niet gehoorzaam geweest; waarom hebt u dit gedaan? Daarom heb Ik ook gezegd: Ik zal hen voor uw aangezicht niet verdrijven; maar zij zullen u aan de zijden zijn, en hun goden zullen u tot een strik zijn.","Jer 48:42":"Want Moab zal verdelgd worden, zodat hij geen volk meer is, omdat hij zich groot gemaakt heeft tegen de HEERE.","Jes 9:13-15":"Daarom zal de HEERE uit Israël afhouwen de kop en de staart, de tak en de biezen, op één dag. (De oude en aanzienlijke, die is de kop; maar de profeet die valsheid leert, die is de staart.) Want de leiders van dit volk zijn verleiders, en die door hen geleid worden, worden ingeslokt.","Ps 132:17":"Daar zal Ik David een hoorn doen uitspruiten; Ik heb voor Mijn Gezalfde een lamp klaargemaakt.","2 Sam 14:2":"Zo zond Joab iemand naar Thekoa, en liet vandaar een wijze vrouw halen; en hij zei tegen haar: Doe toch alsof u rouw draagt, en trek nu rouwkleren aan, en zalf u niet met olie, en wees als een vrouw die al veel dagen rouw heeft gedragen over een dode;","Num 23:19":"God is geen man, dat Hij zou liegen, en ook geen mensenkind, dat het Hem berouwen zou; zou Hij het zeggen, en het niet doen, of spreken, en het niet waarmaken?","Lev 18:23":"Insgelijks zult u bij geen dier liggen, om daarmee onrein te worden; een vrouw zal ook niet gaan staan voor een dier, om daarmee gemeenschap te hebben; het is een gruwelijke vermenging.","2 Kron 9:21":"Want de schepen van de koning voeren naar Tharsis, met de knechten van Huram; eens in de drie jaar kwamen de schepen van Tharsis binnen, met goud, en zilver, ivoor, en apen, en pauwen.","Jes 39:7":"Daarbij zullen zij van uw zonen die uit u zullen voortkomen, die u zult verwekken, meenemen, om hovelingen te zijn in het paleis van de koning van Babel.","2 Kon 3:15":"Nu dan, brengt mij een speelman. En het gebeurde, toen de speelman op de snaren speelde, dat de hand van de HEERE op hem kwam.","1 Sam 12:21":"En wijk niet af; want dan zou u de nietige afgoden achterna gaan, die niet baten, noch verlossen, want zij zijn nietig.","Ps 116:2":"want Hij neigt Zijn oor tot mij; daarom zal ik Hem in mijn dagen aanroepen.","Job 32:8":"Zeker, de geest die in de mens is, en de inblazing van de Almachtige, maakt hen verstandig.","Ps 130:1-4":"Een lied van de hogere trappen. Uit de diepten roep ik tot U, o HEERE! Heere! Hoor naar mijn stem; laat Uw oren opmerkzaam zijn op de stem van mijn smekingen. Als U, HEERE, op de ongerechtigheden let, Heere, wie zal dan bestaan?","2 Petr 3:3-5":"Dit moet u eerst weten, dat er in de laatste dagen spotters zullen komen, die naar hun eigen begeerten zullen wandelen, En zeggen: Waar is de belofte van Zijn komst? Want vanaf de dag dat de vaders ontslapen zijn, blijven alle dingen zo, net zoals vanaf het begin van de schepping. Want willens en wetens is dit hun onbekend, dat door het woord van God de hemelen er van oudsher geweest zijn, en de aarde ontstaan is uit het water en door het water in stand blijft;","Ps 45:10":"Dochters van koningen zijn onder Uw kostbare hofdames; de Koningin staat aan Uw rechterhand, in het fijnste goud van Ofir.","1 Kon 19:9":"En hij kwam daar in een grot, en overnachtte daar; en zie, het woord van de HEERE kwam tot hem, en Hij zei tegen hem: Wat doet u hier, Elia?","2 Kron 18:9":"De koning van Israël nu, en Josafat, de koning van Juda, zaten elk op zijn troon, bekleed met hun kleren, en zij zaten op het plein bij de ingang van de poort van Samaria; en al de profeten profeteerden in hun bijzijn.","Jer 29:20":"U dan, hoort het woord van de HEERE, u allen die gevankelijk zijt weggevoerd, die Ik van Jeruzalem naar Babel heb weggezonden!","1 Kon 22:41-51":"Josafat nu, de zoon van Asa, werd koning over Juda, in het vierde jaar van Achab, de koning van Israël. Josafat was vijfendertig jaar oud toen hij koning werd, en regeerde vijfentwintig jaar te Jeruzalem; en de naam van zijn moeder was Azuba, de dochter van Silchi. En hij wandelde in heel de weg van zijn vader Asa; hij week daar niet van af, en deed wat recht was in de ogen van de HEERE.","2 Petr 2:11":"terwijl de engelen, die in sterkte en kracht groter zijn, geen lasterlijk oordeel tegen hen uitspreken voor de Heere.","Jer 50:17":"Israël is een verjaagd lam, dat de leeuwen weggejaagd hebben; de eerste die hem heeft opgegeten, was de koning van Assur, en deze, de laatste, Nebukadrezar, de koning van Babel, heeft hem de beenderen verbrijzeld.","2 Kron 18:30":"De koning van Syrië nu had de aanvoerders van de wagens die hij had, geboden en gezegd: U zult niet strijden tegen klein of groot, maar alleen tegen de koning van Israël.","Rom 1:24":"Daarom heeft God hen ook overgegeven in de begeerten van hun harten tot onreinheid, om hun lichamen onder elkaar te onteren;","Hand 5:42":"En zij hielden niet op, elke dag, in de tempel en bij de huizen, te leren, en Jezus Christus te verkondigen.","2 Kor 12:20":"Want ik vrees dat ik, als ik gekomen zal zijn, u niet zal vinden zoals ik wil, en dat ik door u gevonden zal worden zoals u niet wilt; dat er niet op enigerlei wijze twisten, jaloezie, toorn, ruzie, kwaadsprekerij, gefluister, opgeblazenheid, wanordelijkheden zijn;","Neh 2:14":"En ik ging verder naar de Fonteinpoort, en naar de vijver van de koning; maar daar was geen plaats voor het dier om onder mij door te gaan.","Ef 3:1":"Om deze reden ben ik, Paulus, de gevangene van Christus Jezus, voor u, die heidenen bent.","Joh 1:46":"Filippus vond Nathanaël en zei tegen hem: Wij hebben Hem gevonden, van Wie Mozes in de wet geschreven heeft, en de profeten, namelijk Jezus, de zoon van Jozef, van Nazareth.","Deut 29:19":"En het gebeurt, als hij de woorden van deze vloek hoort, dat hij zichzelf zegent in zijn hart, en zegt: Ik zal vrede hebben, ook al zal ik naar mijn eigen hart wandelen, om de dronkenschap toe te voegen aan de dorst.","2 Kor 4:2":"Maar wij hebben de bedekselen der schande verworpen, en wandelen niet in arglistigheid, en vervalsen ook het Woord van God niet, maar door openbaring van de waarheid maken wij onszelf aangenaam bij ieder geweten van de mensen, in de tegenwoordigheid van God.","2 Kon 14:3":"En hij deed wat recht was in de ogen van de HEERE, maar niet zoals zijn vader David; hij deed naar alles wat zijn vader Joas gedaan had.","Jer 11:18":"De HEERE nu heeft het mij te kennen gegeven, dat ik het weet; toen hebt U mij hun handelingen laten zien.","Spr 9:8":"Bestraf de spotter niet, opdat hij u niet haat; bestraf de wijze, en hij zal u liefhebben.","1 Sam 3:4-10":"dat de HEERE Samuël riep; en hij zei: Hier ben ik. En hij liep naar Eli en zei: Hier ben ik, want u hebt mij geroepen. Doch hij zei: Ik heb niet geroepen, keer terug, ga liggen. En hij ging heen en legde zich neer. Toen riep de HEERE Samuël opnieuw; en Samuël stond op en ging naar Eli, en zei: Hier ben ik, want u hebt mij geroepen. Hij dan zei: Ik heb u niet geroepen, mijn zoon; keer terug, ga liggen.","Amos 4:1":"Hoor dit woord, koeien van Basan, u die op de berg van Samaria bent, die de armen verdrukt, die de behoeftigen verplettert; u die tegen uw heren zegt: Breng aan, opdat wij drinken.","Jes 6:2":"De serafs stonden boven Hem; ieder had zes vleugels; met twee bedekte ieder zijn gezicht, en met twee bedekte hij zijn voeten, en met twee vloog hij.","Ezech 8:3":"En Hij stak de gelijkenis van een hand uit, en nam mij bij het haar van mijn hoofd; en de Geest voerde mij op tussen de aarde en de hemel, en bracht mij in visioenen van God naar Jeruzalem, tot de deur van de poort van de binnenste voorhof, die uitziet naar het noorden, waar de zitplaats was van een beeld van de ijver, dat tot ijver opwekt.","Amos 3:15":"En Ik zal het winterhuis met het zomerhuis slaan; en de ivoren huizen zullen vergaan, en de grote huizen zullen een einde nemen, spreekt de HEERE.","Jer 17:15":"Zie, zij zeggen tegen mij: Waar is het woord van de HEERE? Laat het nu komen!","2 Kor 8:16-18":"Doch God zij dank, Die dezelfde naarstigheid voor u in het hart van Titus gegeven heeft; Dat hij de vermaning heeft aangenomen, en zeer naarstig zijnde, gewillig naar u toe gereisd is. En wij hebben ook met hem gezonden de broeder, die lof heeft in het Evangelie door alle gemeenten;","1 Kon 18:17":"En het gebeurde, toen Achab Elia zag, dat Achab tegen hem zei: Bent u degene die Israël in beroering brengt?","Richt 16:2":"Toen werd aan de inwoners van Gaza gezegd: Simson is hier binnengekomen; zo gingen zij rondom, en legden hem de hele nacht een hinderlaag bij de stadspoort; maar zij hielden zich de hele nacht stil, en zeiden: Tot aan het morgenlicht, dan zullen wij hem doden.","Hand 8:39":"En toen zij uit het water waren opgekomen, nam de Geest van de Heere Filippus weg, en de kamerling zag hem niet meer; want hij reisde zijn weg met blijdschap.","2 Kon 3:11-13":"En Josafat zei: Is hier geen profeet van de HEERE, zodat wij door hem de HEERE kunnen raadplegen? Toen antwoordde een van de dienaren van de koning van Israël, en zei: Hier is Elisa, de zoon van Safat, die water op Elia's handen goot. En Josafat zei: Het woord van de HEERE is bij hem. Zo trokken naar hem toe de koning van Israël, en Josafat, en de koning van Edom. Maar Elisa zei tegen de koning van Israël: Wat heb ik met u te doen? Ga naar de profeten van uw vader, en naar de profeten van uw moeder. Doch de koning van Israël zei tegen hem: Nee, want de HEERE heeft deze drie koningen bij elkaar geroepen, om hen in de hand van de Moabieten te geven.","1 Kon 9:26":"De koning Salomo maakte ook schepen te Ezeon-geber, dat bij Eloth is, aan de oever van de Schelfzee, in het land van Edom.","1 Kon 12:28-33":"Daarom hield de koning een raad, en maakte twee gouden kalveren; en hij zei tegen hen: Het is voor u teveel om naar Jeruzalem op te gaan; zie uw goden, o Israël, die u uit het land Egypte hebben opgevoerd. En hij zette het ene te Beth-el, en het andere plaatste hij te Dan. En deze zaak werd tot zonde; want het volk ging heen voor het ene, tot Dan toe.","Zach 1:4-6":"Wees niet als uw vaderen, tot wie de vorige profeten riepen en zeiden: Zo zegt de HEERE van de heerscharen: Bekeer u toch van uw slechte wegen en uw slechte daden; maar zij hoorden niet, en zij luisterden niet naar Mij, spreekt de HEERE. Uw vaderen, waar zijn die? En de profeten, zullen zij eeuwig leven? Nochtans Mijn woorden en Mijn inzettingen, die Ik Mijn knechten, de profeten, geboden had, hebben die uw vaders niet getroffen? Zodat zij terugkerend zeiden: Zoals de HEERE van de heerscharen Zich voorgenomen had ons te doen, naar onze wegen en naar onze daden, zo heeft Hij met ons gedaan.","1 Kon 14:9-16":"maar kwaad gedaan hebt, meer dan allen die vóór u geweest zijn, en heengegaan bent, en u andere goden en gegoten beelden gemaakt hebt, om Mij tot toorn te verwekken, en Mij achter uw rug geworpen hebt; daarom, zie, Ik zal kwaad brengen over het huis van Jerobeam, en van Jerobeam uitroeien alwie mannelijk is, zowel wie in de macht is als wie is overgebleven in Israël; en Ik zal de nakomelingen van het huis van Jerobeam wegvegen, zoals men drek wegveegt, totdat het helemaal vergaan is. Wie van Jerobeam in de stad sterft, zullen de honden opeten; en wie in het veld sterft, zullen de vogels van de hemel opeten; want de HEERE heeft het gesproken.","Amos 2:12":"Maar u hebt aan de nazireeërs wijn te drinken gegeven, en u hebt de profeten geboden en gezegd: U zult niet profeteren.","Hand 2:13":"En anderen zeiden spottend: Zij zijn vol zoete wijn.","Ezech 8:1":"Het gebeurde nu in het zesde jaar, in de zesde maand, op de vijfde van de maand, terwijl ik in mijn huis zat, en de oudsten van Juda voor mij zaten, dat de hand van de Heere HEERE daar over mij viel.","Luk 12:45":"Maar als die dienstknecht in zijn hart zou zeggen: Mijn heer blijft nog lang weg voor hij komt; en zou beginnen de knechten en de dienstmeisjes te slaan, en te eten en te drinken en dronken te worden;","Joh 4:35":"Zegt u niet: Het zijn nog vier maanden, en dan komt de oogst? Zie, Ik zeg u: Sla uw ogen op en bekijk de velden; want ze zijn al wit om te oogsten.","Ps 73:11":"Zodat zij zeggen: Hoe zou God het weten, en zou er kennis zijn bij de Allerhoogste?","2 Petr 1:15":"Maar ik zal er ook mijn best voor doen, dat u bij elke gelegenheid, na mijn heengaan, hieraan kunt terugdenken.","2 Kron 16:7-12":"En op dezelfde tijd kwam de ziener Hanani tot Asa, de koning van Juda, en hij zei tegen hem: Omdat u gesteund hebt op de koning van Syrië, en niet gesteund hebt op de HEERE, uw God, daarom is het leger van de koning van Syrië uit uw hand ontkomen. Waren de Moren en de Libiërs niet een groot leger, met heel veel wagens en ruiters? Toen u echter op de HEERE steunde, heeft Hij hen in uw hand gegeven. Want wat de HEERE betreft, Zijn ogen doorlopen de hele aarde, om Zich sterk te bewijzen aan hen wier hart volkomen is tot Hem; hierin heeft u dwaas gedaan; want van nu af zullen er oorlogen tegen u zijn.","2 Kron 8:14":"Hij stelde ook, naar de wijze van zijn vader David, de verdelingen van de priesters aan over hun dienst, en van de Levieten over hun taken, om God te prijzen en voor de priesters te dienen, naar de eis van elke dag; en de poortwachters in hun verdelingen, bij elke poort; want zo was het gebod van David, de man Gods.","1 Kron 19:7":"zodat zij zich tweeëndertigduizend wagens huurden; en de koning van Maächa en zijn volk kwamen en legerden zich voor Medeba; ook verzamelden de kinderen van Ammon zich uit hun steden, en zij kwamen ten strijde.","Openb 22:6":"En hij zei tegen mij: Deze woorden zijn getrouw en waarachtig; en de Heere, de God van de heilige profeten, heeft Zijn engel gezonden om Zijn dienstknechten te tonen wat spoedig moet gebeuren.","1 Kon 22:34-36":"Toen spande een man zijn boog, zomaar, zonder te mikken, en schoot de koning van Israël tussen de gespen en het pantser. Toen zei hij tegen zijn voerman: Keer uw hand, en breng mij uit het leger, want ik ben zwaar gewond. En de strijd nam die dag toe, en de koning werd rechtop gehouden in de wagen tegenover de Syriërs; maar hij stierf 's avonds, en het bloed van de wond vloeide in de bak van de wagen. En er ging een oproep door het leger, toen de zon onderging, en men zei: Ieder keert naar zijn stad, en ieder naar zijn land!","Dan 7:9":"Dit zag ik, totdat er tronen gezet werden, en de Oude van dagen Zich zette, Wiens kleed wit was als de sneeuw, en het haar van Zijn hoofd als zuivere wol; Zijn troon was vuurvonken, de raderen ervan een brandend vuur.","Hos 7:13":"Wee hen, want zij zijn van Mij afgezworven; verwoesting over hen, want zij hebben tegen Mij overtreden! Ik zou hen wel verlossen, maar zij spreken leugens tegen Mij.","1 Kron 29:4":"Drieduizend talenten goud, van het goud van Ofir, en zevenduizend talenten gelouterd zilver, om de wanden van de huizen mee te bekleden;","Ex 6:28":"Zo sprak de HEERE tot Mozes en zei: Ik ben de HEERE! Spreek tot Farao, de koning van Egypte, alles wat Ik tot u spreek.","Openb 20:3":"En wierp hem in het afgrond, en sloot hem daarin, en verzegelde het boven hem, opdat hij de volken niet meer verleiden zou, totdat de duizend jaar geëindigd zouden zijn. En daarna moet hij een korte tijd losgelaten worden.","Amos 7:13-17":"Maar in Beth-el zult u voortaan niet meer profeteren; want dat is het heiligdom van de koning, en dat is het huis van het koninkrijk. Toen antwoordde Amos, en zei tegen Amazia: Ik was geen profeet, en ik was geen profetenzoon; maar ik was een ossenherder, en verzamelde wilde vijgen. Maar de HEERE nam mij van achter de kudde vandaan; en de HEERE zei tegen mij: Ga heen, profeteer tegen Mijn volk Israël.","Ezech 27:15":"De kinderen van Dedan waren uw kooplieden; veel eilanden waren de koophandel van uw hand; hoornen van ivoor en ebbenhout gaven zij u terug tot een geschenk.","Dan 11:37":"En op de goden van zijn vaderen zal hij geen acht geven, noch op de begeerte van de vrouwen; hij zal ook op geen God acht geven, maar hij zal zich boven alles groot maken.","Ps 115:2":"Waarom zouden de heidenen zeggen: Waar is nu hun God?","Jer 38:7":"Toen Ebed-Melech, de Moorman, een van de kamerlingen die toen in het huis van de koning was, hoorde dat zij Jeremia in de kuil gedaan hadden (de koning zat toen in de poort van Benjamin);","Ps 74:10":"Hoe lang, o God, zal de tegenstander smaden? Zal de vijand Uw Naam voor eeuwig lasteren?","Num 21:5":"En het volk sprak tegen God en tegen Mozes: Waarom hebt u ons laten optrekken uit Egypte, opdat wij zouden sterven in de woestijn? Want hier is geen brood, ook geen water, en onze ziel walgt van dit zeer lichte brood.","2 Sam 10:6":"Toen nu de kinderen Ammons zagen, dat zij zich bij David stinkend gemaakt hadden, zonden de kinderen Ammons heen, en huurden van de Syriërs van Beth-Rechob, en van de Syriërs van Zoba, twintigduizend man van het voetvolk, en van de koning van Maächa duizend man, en van de mannen van Tob twaalfduizend man.","1 Kon 20:33-42":"De mannen namen dat nauwkeurig waar, en vatten het snel op, of het van hem was, en zeiden: Uw broeder Benhadad leeft. En hij zei: Komt, brengt hem. Toen kwam Benhadad naar hem uit, en hij liet hem op de wagen klimmen. En hij zei tegen hem: De steden, die mijn vader van uw vader genomen heeft, zal ik teruggeven, en maak u straten in Damaskus, zoals mijn vader in Samaria gemaakt heeft. En ik, antwoordde Achab, zal u met dit verbond dan laten gaan. Zo sloot hij een verbond met hem, en liet hem gaan. Toen zei een man uit de zonen van de profeten tegen zijn naaste, door het woord van de HEERE: Sla mij toch. En de man weigerde hem te slaan.","Jer 28:10-14":"Toen nam de profeet Hananja het juk van de hals van de profeet Jeremia, en verbrak het. En Hananja sprak voor de ogen van het hele volk, en zei: Zo zegt de HEERE: Zo zal Ik verbreken het juk van Nebukadnezar, de koning van Babel, in nog twee volle jaren, van de hals van alle volken. En de profeet Jeremia ging zijns weegs. Doch het woord van de HEERE kwam tot Jeremia (nadat de profeet Hananja het juk van de hals van de profeet Jeremia verbroken had), en zei:","Amos 5:10":"Zij haten in de poort hem die bestraft, en verafschuwen hem die oprecht spreekt.","2 Tess 2:10-12":"en met alle verleiding van de onrechtvaardigheid in hen die verloren gaan; omdat zij de liefde voor de waarheid niet aangenomen hebben, om behouden te worden. En daarom zal God hun een kracht van de dwaling zenden, zodat zij de leugen zouden geloven; opdat zij allen veroordeeld worden, die de waarheid niet geloofd hebben, maar een welbehagen hebben gehad in de onrechtvaardigheid.","Luk 2:25-27":"En zie, er was een mens in Jeruzalem, wiens naam was Simeon; en deze mens was rechtvaardig en godvrezend, en verwachtte de vertroosting van Israël, en de Heilige Geest was op hem. En hem was door de Heilige Geest een goddelijke openbaring gedaan, dat hij de dood niet zien zou voordat hij de Christus van de Heere zou zien. En hij kwam door de Geest in de tempel. En toen de ouders het Kindje Jezus binnenbrachten, om naar de gewoonte van de wet met Hem te doen,","Gen 36:31-43":"En dit zijn de koningen die geregeerd hebben in het land Edom, voordat er een koning regeerde over de kinderen van Israël. Bela dan, de zoon van Beor, regeerde in Edom, en de naam van zijn stad was Dinhaba. En Bela stierf, en Jobab, de zoon van Zerah, uit Bozra, regeerde in zijn plaats.","Jer 43:3":"Maar Baruch, de zoon van Nerija, hitst u tegen ons op, opdat hij ons overgeeft in de hand van de Chaldeeën, zodat zij ons doden en ons gevankelijk naar Babel wegvoeren.","Dan 7:16":"Ik naderde tot een van hen die daar stonden, en vroeg hem naar de zekerheid over dit alles; en hij zei het mij, en maakte mij de uitleg van deze zaken bekend.","1 Sam 25:7":"En nu, ik heb gehoord dat u scheerders hebt; nu, de herders die u hebt, zijn bij ons geweest; wij hebben hun geen smaad aangedaan, en zij hebben ook niets gemist, al de dagen dat zij te Karmel geweest zijn.","2 Kron 20:36":"En hij verbond zich met hem om schepen te maken, om naar Tharsis te gaan; en zij maakten de schepen in Ezeon-Geber.","Hos 7:3":"Zij verblijden de koning met hun boosheid, en de vorsten met hun leugens.","Spr 22:24":"Ga geen vriendschap aan met een driftig man, en ga niet om met een zeer grimmig man;","2 Kron 22:5":"Hij wandelde ook naar hun raad, en ging met Joram, de zoon van Achab, de koning van Israël, ten strijde tegen Hazaël, de koning van Syrië, bij Ramoth in Gilead; en de Syriërs sloegen Joram.","Jes 44:25":"Die de tekenen van de leugendichters vernietigt, en de waarzeggers dol maakt; Die de wijzen achterwaarts doet keren, en die hun kennis verdwaast;","Jak 5:10":"Mijn broeders, neem als voorbeeld van het lijden en van de geduldigheid de profeten, die in de Naam van de Heere gesproken hebben.","1 Kon 20:41":"Toen haastte hij zich, en veegde de as van zijn ogen af; en de koning van Israël herkende hem, dat hij een van de profeten was.","Micha 2:6":"Profeteert u niet, zeggen zij; laat hen profeteren; zij profeteren niet zoals die anderen; men wijkt niet af van smaad.","1 Kon 22:21-23":"Toen ging een geest naar voren en stond voor het aangezicht van de HEERE, en zei: Ik zal hem overreden. En de HEERE zei tegen hem: Waarmee? En hij zei: Ik zal uitgaan en een leugengeest zijn in de mond van al zijn profeten. En Hij zei: U zult overreden, en het ook kunnen; ga uit en doe zo. Nu dan, zie, de HEERE heeft een leugengeest in de mond van al deze uw profeten gegeven; en de HEERE heeft kwaad over u gesproken.","Job 21:14":"Toch zeggen zij tegen God: Ga weg van ons, want in de kennis van Uw wegen hebben wij geen behagen.","1 Kon 15:23":"Het overige nu van alle geschiedenissen van Asa, en al zijn macht, en alles wat hij gedaan heeft, en de steden die hij gebouwd heeft, zijn die niet geschreven in het boek van de kronieken van de koningen van Juda? Doch in de tijd van het ouderdom werd hij ziek aan zijn voeten.","Deut 5:31":"Maar u, sta hier bij Mij, dan zal Ik tot u spreken al de geboden, en inzettingen, en rechten, die u hun leren zult, opdat zij ze doen in het land dat Ik hun geven zal, om dat te erven.","Hand 27:31":"zei Paulus tegen de hoofdman en tegen de soldaten: Als dezen niet in het schip blijven, kunt u niet gered worden.","2 Kron 17:1-21":"En zijn zoon Josafat werd koning in zijn plaats, en hij maakte zich sterk tegen Israël. En hij legde krijgsvolk in alle versterkte steden van Juda, en legde bezettingen in het land van Juda, en in de steden van Efraïm, die zijn vader Asa had ingenomen. En de HEERE was met Josafat; want hij wandelde in de eerdere wegen van zijn vader David, en zocht de Baäls niet.","Hand 8:29":"En de Geest zei tegen Filippus: Ga erheen, en voeg u bij deze wagen.","Ezech 11:3":"Die zeggen: Men moet niet snel huizen bouwen; deze stad is de pot, en wij zijn het vlees.","Ps 106:25":"Maar zij morden in hun tenten; naar de stem van de HEERE luisterden zij niet.","Mark 6:17":"Want Herodes zelf had sommigen uitgezonden en Johannes gevangengenomen, en hem in de gevangenis geketend, vanwege Herodias, de vrouw van zijn broer Filippus, omdat hij haar getrouwd had.","1 Sam 17:26":"Toen zei David tegen de mannen die bij hem stonden: Wat zal men de man doen die deze Filistijn verslaat en de smaad van Israël wegneemt? Want wie is deze onbesneden Filistijn, dat hij de slagorden van de levende God zou honen?","Hand 11:24":"Want hij was een goed man, en vol van de Heilige Geest en van het geloof; en er werd een grote menigte aan de Heere toegevoegd.","2 Kron 18:24":"En Micha zei: Zie, u zult het zien op diezelfde dag, als u van kamer naar kamer zult gaan om u te verbergen.","2 Kron 17:1-9":"En zijn zoon Josafat werd koning in zijn plaats, en hij maakte zich sterk tegen Israël. En hij legde krijgsvolk in alle versterkte steden van Juda, en legde bezettingen in het land van Juda, en in de steden van Efraïm, die zijn vader Asa had ingenomen. En de HEERE was met Josafat; want hij wandelde in de eerdere wegen van zijn vader David, en zocht de Baäls niet.","Job 1:6":"Er was nu een dag, dat de kinderen van God kwamen om zich voor de HEERE te stellen, dat de satan ook in hun midden kwam.","Spr 13:20":"Die met de wijzen omgaat, zal wijs worden; maar die de metgezel van de dwazen is, zal verbroken worden.","Richt 10:14":"Ga heen, roep tot de goden die u hebt uitgekozen; laten die u verlossen in de tijd van uw benauwdheid.","1 Kon 14:5":"Maar de HEERE zei tegen Ahia: Zie, Jerobeams vrouw komt om u iets te vragen over haar zoon, want hij is ziek. Zo en zo zult u tot haar spreken, en het zal gebeuren, als zij binnenkomt, dat zij zich als een andere vrouw zal voordoen.","1 Kon 21:25":"Doch er was niemand geweest zoals Achab, die zichzelf verkocht had om te doen wat kwaad is in de ogen van de HEERE, omdat Izebel, zijn vrouw, hem ophitste.","2 Kron 22:3-5":"Hij wandelde ook in de wegen van het huis van Achab; want zijn moeder was zijn raadgeefster, om goddeloos te handelen. En hij deed wat kwaad was in de ogen van de HEERE, net als het huis van Achab; want zij waren zijn raadgevers, na de dood van zijn vader, tot zijn verderf. Hij wandelde ook naar hun raad, en ging met Joram, de zoon van Achab, de koning van Israël, ten strijde tegen Hazaël, de koning van Syrië, bij Ramoth in Gilead; en de Syriërs sloegen Joram.","Mal 3:13":"Uw woorden zijn tegen Mij te sterk geworden, zegt de HEERE; maar u zegt: Wat hebben wij tegen U gesproken?","Hos 4:9":"Daarom, zoals het volk, zo zal de priester zijn; en Ik zal zijn wegen aan hem bezoeken¹, en zijn daden hem vergelden.","Jer 28:1-9":"Verder gebeurde het in datzelfde jaar, in het begin van het koninkrijk van Zedekia, koning van Juda, in het vierde jaar, in de vijfde maand, dat Hananja, zoon van Azur, de profeet, die van Gibeon was, tegen mij sprak, in het huis van de HEERE, voor de ogen van de priesters en van het hele volk, en zei: Zo spreekt de HEERE van de heerscharen, de God van Israël, en zegt: Ik heb het juk van de koning van Babel verbroken. In nog twee volle jaren zal Ik naar deze plaats terugbrengen al de voorwerpen van het huis van de HEERE, die Nebukadnezar, de koning van Babel, uit deze plaats heeft weggenomen en naar Babel gebracht.","Luk 18:11":"De Farizeeër stond en bad dit bij zichzelf: O God, ik dank U dat ik niet ben zoals de andere mensen: rovers, onrechtvaardigen, overspelers; of ook zoals deze tollenaar.","2 Kon 15:1-3":"In het zevenentwintigste jaar van Jerobeam, de koning van Israël, werd Azaria koning, de zoon van Amazia, de koning van Juda. Hij was zestien jaar oud toen hij koning werd, en hij regeerde tweeënvijftig jaar in Jeruzalem; en de naam van zijn moeder was Jecholia, uit Jeruzalem. En hij deed wat recht was in de ogen van de HEERE, precies zoals zijn vader Amazia gedaan had.","Ps 42:4":"Mijn tranen zijn mij tot voedsel, dag en nacht, omdat ze de hele dag tegen mij zeggen: Waar is uw God?","Ezech 20:49":"En ik zei: Ach, Heere HEERE, zij zeggen van mij: Spreekt hij niet in gelijkenissen?","Deut 31:16":"En de HEERE zei tegen Mozes: Zie, u zult slapen met uw vaderen; en dit volk zal opstaan, en overspelig achter de goden van de vreemden van dat land aan gaan, waar het naartoe gaat, in het midden ervan; en het zal Mij verlaten en Mijn verbond vernietigen, dat Ik met hen gesloten heb.","Matt 24:35":"De hemel en de aarde zullen voorbijgaan, maar Mijn woorden zullen beslist niet voorbijgaan.","2 Kron 18:15":"En de koning zei tegen hem: Hoeveel keer moet ik u onder ede laten zweren dat u tegen mij niets dan de waarheid spreekt, in de Naam van de HEERE?","1 Kon 14:24":"Er waren ook schandjongens in het land; zij deden naar al de gruwelen van de heidenvolken, die de HEERE van voor het aangezicht van de kinderen van Israël uit hun bezit verdreven had.","Jer 1:1":"De woorden van Jeremia, de zoon van Hilkia, uit de priesters die te Anathoth waren, in het land van Benjamin;","Jes 6:1-9":"In het jaar dat koning Uzzia stierf, zag ik de Heere zitten op een hoge en verheven troon, en Zijn zomen vulden de tempel. De serafs stonden boven Hem; ieder had zes vleugels; met twee bedekte ieder zijn gezicht, en met twee bedekte hij zijn voeten, en met twee vloog hij. En de een riep tot de ander en zei: Heilig, heilig, heilig is de HEERE van de heerscharen! De hele aarde is vol van Zijn heerlijkheid!","2 Kor 12:21":"opdat mijn God mij niet opnieuw vernedert bij u, als ik gekomen zal zijn, en ik verdriet heb over velen, die eerder gezondigd hebben, en die zich niet bekeerd zullen hebben van de onreinheid, en hoererij, en losbandigheid, die zij bedreven hebben.","Jer 29:32":"Daarom zegt de HEERE zo: Ziet, Ik zal bezoeking doen over Semaja, de Nechlamiet, en over zijn nageslacht; hij zal niemand hebben die in het midden van dit volk woont, en zal het goede niet zien dat Ik Mijn volk doen zal, spreekt de HEERE; want hij heeft een afval gesproken tegen de HEERE.","Jer 28:11":"En Hananja sprak voor de ogen van het hele volk, en zei: Zo zegt de HEERE: Zo zal Ik verbreken het juk van Nebukadnezar, de koning van Babel, in nog twee volle jaren, van de hals van alle volken. En de profeet Jeremia ging zijns weegs.","Jes 45:9":"Wee hem die met zijn Formeerder twist, zoals een potscherf met aarden potscherven! Zal ook het leem tegen zijn formeerder zeggen: Wat maakt u? of zal uw werk zeggen: Hij heeft geen handen?","1 Kon 15:14":"De hoogten werden wel niet weggenomen; toch was het hart van Asa volkomen met de HEERE, al zijn dagen.","Hand 5:4":"Zolang het bleef, bleef het niet uw eigendom? En verkocht zijnde, was het niet in uw macht? Wat is het, dat u deze daad in uw hart hebt voorgenomen? U hebt niet mensen gelogen, maar God.","Jer 23:24":"Zou iemand zich in verborgen plaatsen kunnen verbergen, zodat Ik hem niet zou zien? spreekt de HEERE; vervul Ik niet de hemel en de aarde? spreekt de HEERE.","2 Kon 18:19-21":"En Rabsake zei tot hen: Zeg nu tot Hizkia: Zo zegt de grote koning, de koning van Assyrië: Wat vertrouwen is dit, waarmee u vertrouwt? U zegt (doch het is een woord der lippen): Er is raad en macht tot de oorlog; op wie vertrouwt u nu, dat u tegen mij rebelleert? Zie nu, vertrouwt u op die gebroken rietstaf, op Egypte, waarop, als iemand daarop leunt, het in zijn hand zal gaan, en die doorboren; zo is Farao, de koning van Egypte, voor allen die op hem vertrouwen.","Ps 115:1":"Niet ons, o HEERE, niet ons, maar geef aan Uw Naam eer, om Uw goedertierenheid, om Uw waarheid.","Deut 4:43":"Bezer in de woestijn, in het effen land, voor de Rubenieten; en Ramoth in Gilead, voor de Gadieten; en Golan in Bazan, voor de Manassieten.","Hebr 11:4":"Door het geloof heeft Abel een beter offer aan God gebracht dan Kaïn, en daardoor heeft hij het getuigenis gekregen dat hij rechtvaardig was, doordat God over zijn gave getuigenis gaf; en door dit geloof spreekt hij nog, hoewel hij gestorven is.","1 Kron 3:10":"Salomo's zoon nu was Rehabeam; zijn zoon was Abia; zijn zoon was Asa; zijn zoon was Josafat;","Spr 27:22":"Al stampte u de dwaas in een vijzel met een stamper, midden tussen het gestoten graan, zijn dwaasheid zou niet van hem wijken.","Jer 29:22":"En van hen zal een vloek genomen worden bij al de gevankelijk weggevoerden van Juda die in Babel zijn, zodat men zegt: De HEERE stelt u als Zedekia en als Achab, die de koning van Babel aan het vuur heeft geroosterd;","Ps 51:15":"Zo zal ik de overtreders Uw wegen leren; en de zondaars zullen zich tot U bekeren.","Num 16:28":"Toen zei Mozes: Hieraan zult u herkennen dat de HEERE mij gezonden heeft om al deze daden te doen, dat ze niet uit mijn eigen hart komen.","1 Kor 5:6-8":"Uw roem is niet goed. Weet u niet dat een beetje zuurdesem het hele deeg zuur maakt? Zuiver dan de oude zuurdesem weg, opdat u een nieuw deeg mag zijn, zoals u ongezuurd bent. Want ook ons Pascha is voor ons geslacht, namelijk Christus. Laten we dan feest houden, niet met de oude zuurdesem, ook niet met de zuurdesem van kwaadheid en boosheid, maar met de ongezuurde broden van oprechtheid en waarheid.","1 Kor 12:7-11":"Maar aan ieder wordt de openbaring van de Geest gegeven tot wat nuttig is. Want aan de een wordt door de Geest het woord van wijsheid gegeven, en aan een ander het woord van kennis, door dezelfde Geest; en aan een ander het geloof, door dezelfde Geest; en aan een ander de gaven van gezondmaking, door dezelfde Geest.","2 Kon 8:16":"In het vijfde jaar van Joram, de zoon van Achab, de koning van Israël, toen Josafat koning was van Juda, begon Jehoram, de zoon van Josafat, de koning van Juda, te regeren.","Dan 8:10":"En hij werd groot tot aan het leger van de hemel; en hij wierp sommigen van dat leger, namelijk van de sterren, neer ter aarde, en vertrapte ze.","Jer 28:16":"Daarom, zo zegt de HEERE: Zie, Ik zal u wegwerpen van de aardbodem; dit jaar zult u sterven, omdat u een afval gesproken hebt tegen de HEERE.","Gal 4:16":"Ben ik dan uw vijand geworden, doordat ik u de waarheid vertel?","1 Kon 22:31-38":"De koning van Syrië nu had zijn tweeëndertig aanvoerders van de wagens geboden en gezegd: U zult niet vechten tegen klein of groot, maar alleen tegen de koning van Israël. Het gebeurde dan, toen de aanvoerders van de wagens Josafat zagen, dat zij zeiden: Zeker, dat is de koning van Israël; en zij keerden zich naar hem toe om te strijden; maar Josafat riep het uit. En het gebeurde, toen de aanvoerders van de wagens zagen dat hij de koning van Israël niet was, dat zij zich van hem afkeerden en niet meer achtervolgden.","Jer 23:1":"Wee de herders, die de schapen van Mijn weide ombrengen en verstrooien! spreekt de HEERE.","Matt 26:63":"Maar Jezus zweeg stil. En de hogepriester antwoordde en zei tegen Hem: Ik bezweer U bij de levende God dat U ons zegt of U de Christus bent, de Zoon van God.","Hand 5:29-32":"Maar Petrus en de apostelen antwoordden, en zeiden: Men moet God meer gehoorzaam zijn dan de mensen. De God van onze vaderen heeft Jezus opgewekt, Die u omgebracht hebt, door Hem aan het hout te hangen. Deze heeft God door Zijn rechterhand verhoogd tot een Vorst en Zaligmaker, om Israël bekering en vergeving van zonden te geven.","2 Kon 9:24":"Maar Jehu spande de boog met volle kracht, en schoot Joram tussen zijn armen, zodat de pijl door zijn hart naar buiten kwam; en hij zeeg neer in zijn wagen.","Jes 28:14":"Daarom, hoor het woord van de HEERE, u bespotters, u die heersen over dit volk, dat in Jeruzalem is!","1 Tess 1:8":"Want vanuit u heeft het Woord van de Heere weerklonken, niet alleen in Macedonië en Achaje; maar ook op elke plaats is uw geloof, dat u op God hebt, bekend geworden, zodat wij het niet nodig hebben daar iets over te zeggen.","Ezech 43:5":"En de Geest nam mij op, en bracht mij in het binnenste voorhof; en zie, de heerlijkheid van de HEERE had het huis vervuld.","Jona 3:1":"En het woord van de HEERE gebeurde voor de tweede keer tot Jona, en zei:","Ps 4:7":"Velen zeggen: Wie zal ons het goede laten zien? Verhef U over ons het licht van uw aangezicht, o HEERE!","Jes 29:20":"Wanneer de tiran een einde zal hebben, en het met de spotter voorbij zal zijn, en allen die op ongerechtigheid loeren, uitgeroeid zullen zijn;","2 Kron 18:5":"Toen verzamelde de koning van Israël de profeten, vierhonderd man, en hij zei tegen hen: Zullen wij tegen Ramoth in Gilead ten strijde trekken, of zal ik het nalaten? En zij zeiden: Trek op, want God zal het in de hand van de koning geven.","1 Kon 22:19-28":"Verder zei hij: Daarom, hoor het woord van de HEERE: Ik zag de HEERE zitten op Zijn troon, en heel het hemelse leger stond naast Hem, aan Zijn rechterhand en aan Zijn linkerhand. En de HEERE zei: Wie zal Achab overreden, zodat hij optrekt en valt bij Ramoth in Gilead? De één zei dit, en de ander zei dat. Toen ging een geest naar voren en stond voor het aangezicht van de HEERE, en zei: Ik zal hem overreden.","Ps 71:18":"Daarom ook, terwijl het ouderdom en de grijsheid daar zijn, verlaat mij niet, o God, totdat ik aan dit geslacht Uw arm verkondig, aan alle nakomelingen Uw macht.","2 Kon 17:29":"Maar elk volk maakte zijn eigen goden; en zij zetten ze in de huizen van de hoogten, die de Samaritanen gemaakt hadden, elk volk in hun steden waar zij woonden.","Deut 9:19":"Want ik vreesde vanwege de toorn en de grimmigheid waarmee de HEERE zeer op u vertoornd was, om u te verdelgen; toch verhoorde de HEERE mij ook op dat moment.","1 Kon 19:14":"En hij zei: Ik heb mij zeer sterk ingezet voor de HEERE, de God van de heerscharen; want de Israëlieten hebben Uw verbond verlaten, Uw altaren afgebroken en Uw profeten met het zwaard gedood; en ik alleen ben overgebleven, en zij zoeken mij te doden.","Jes 6:10":"Maak het hart van dit volk vet, en maak hun oren zwaar, en sluit hun ogen, opdat het niet ziet met zijn ogen, of met zijn oren hoort, of met zijn hart begrijpt, of zich bekeert, en Hij het geneest.","1 Kon 8:42":"(want zij zullen horen van Uw grote Naam, en van Uw sterke hand, en van Uw uitgestrekte arm) wanneer hij komen en bidden zal in dit huis;","1 Kron 9:1":"Heel Israël werd in geslachtsregisters geteld, en zie, zij zijn geschreven in het boek van de koningen van Israël. En die van Juda waren weggevoerd naar Babel, vanwege hun overtredingen.","Deut 5:4-6":"Van aangezicht tot aangezicht heeft de HEERE met u op de berg gesproken uit het midden van het vuur, (ik stond in die tijd tussen de HEERE en tussen u, om u het woord van de HEERE bekend te maken; want u was bang voor het vuur en klom niet op de berg) en Hij zei: Ik ben de HEERE, uw God, Die u uit Egypteland, uit het diensthuis, uitgeleid heb.","Hand 13:10":"O kind van de duivel, vol van alle bedrog en van alle arglistigheid, vijand van alle gerechtigheid, zult u niet ophouden de rechte wegen van de Heere te verdraaien?","Luk 16:14":"En al deze dingen hoorden ook de Farizeeën, die geldgierig waren, en zij beschimpten Hem.","2 Tim 3:8":"Zoals Jannes en Jambres Mozes tegenstonden, zo staan ook dezen de waarheid tegen; mensen, verdorven van verstand, verwerpelijk wat het geloof betreft.","Micha 3:8":"Maar waarlijk, ik ben vol van de kracht van de Geest van de HEERE; en vol van gericht en dapperheid, om Jakob zijn overtreding te verkondigen, en Israël zijn zonde.","2 Petr 2:1-3":"Maar er zijn ook valse profeten onder het volk geweest, zoals er ook onder u valse leraars zullen zijn, die verderfelijke ketterijen in het geheim zullen invoeren, en zelfs de Heere, Die hen gekocht heeft, verloochenen, en zo een snel verderf over zichzelf brengen; En velen zullen hun verderfelijke wegen navolgen, waardoor de weg van de waarheid belasterd zal worden. En zij zullen door hebzucht, met gemaakte woorden, van u een koopwaar maken; over hen is het oordeel van lang geleden niet werkeloos, en hun verderf sluimert niet.","1 Kron 12:18":"En de Geest bekleedde Amasai, de leider van de aanvoerders, en hij zei: Wij zijn van u, o David, en met u zijn wij, zoon van Isaï. Vrede, vrede zij u, en vrede uw helpers; want uw God helpt u. Toen nam David hen aan, en stelde hen tot aanvoerders van de benden.","Ezech 1:20":"Waarheen de geest wilde gaan, gingen zij, waarheen de geest wilde gaan; en de raderen werden tegenover hen opgeheven; want de geest van de levende wezens was in de raderen.","Ps 40:8-11":"Toen zei ik: Zie, ik kom; in de rol van het boek is van mij geschreven. Ik heb lust, o mijn God! om Uw welbehagen te doen; en Uw wet is in het midden van mijn ingewand. Ik verkondig de gerechtigheid in de grote gemeente; zie, mijn lippen bedwing ik niet; HEERE! Gij weet het.","Jes 3:8":"Want Jeruzalem is gestruikeld, en Juda is gevallen, omdat hun tong en hun daden tegen de HEERE zijn, om de ogen van Zijn heerlijkheid te verbitteren.","1 Kon 10:11":"Verder brachten ook de schepen van Hiram, die goud uit Ofir haalden, uit Ofir zeer veel almuggimhout en kostbaar gesteente.","Deut 2:30":"Maar Sihon, de koning van Hesbon, wilde ons daar niet doorheen laten trekken; want de HEERE, uw God, verhardde zijn geest en verstokte zijn hart, opdat Hij hem in uw hand zou geven, zoals het is op deze dag.","1 Kon 18:27":"En het gebeurde op de middag, dat Elia met hen spotte, en zei: Roep met luide stem, want hij is een god; misschien is hij in gedachten verzonken, of heeft hij iets te doen, of is hij op reis; misschien slaapt hij en moet hij wakker worden.","Openb 18:19":"En zij wierpen stof op hun hoofden, en riepen, wenend en rouw bedrijvend, en zeiden: Wee, wee, de grote stad, waarin allen die schepen op de zee hadden, rijk geworden zijn van haar kostbaarheid; want zij is in één uur verwoest.","Ezech 18:14-18":"Zie nu, heeft hij een zoon voortgebracht, die al de zonden van zijn vader, die hij doet, aanziet, en toeziet, en dergelijke niet doet; Niet eet op de bergen, noch zijn ogen opheft tot de drekgoden van het huis van Israël, de vrouw van zijn naaste niet onteert; En niemand verdrukt, het pand niet vasthoudt, en geen roof pleegt, zijn brood aan de hongerige geeft, en de naakte met kleding bedekt;","Ezech 13:7-16":"Ziet u niet een nietig gezicht, en spreekt u een leugenachtige voorzegging, als u zegt: De HEERE spreekt, terwijl Ik niet gesproken heb? Daarom zegt de Heere HEERE zo: Omdat u nietigheid spreekt, en leugen ziet; daarom, zie, Ik ben tegen u, spreekt de Heere HEERE. En Mijn hand zal zijn tegen de profeten die nietigheid zien, en leugen voorzeggen; zij zullen niet in de vergadering van Mijn volk zijn, en in het geschrift van het huis van Israël niet geschreven worden, en in het land van Israël niet komen; en u zult weten dat Ik de Heere HEERE ben.","Hand 13:45":"Doch de Joden, die de menigten zagen, werden vervuld met afgunst, en weerspraken wat door Paulus gezegd werd, en tegenspraken en lasterden.","2 Kon 17:21":"Want Hij scheurde Israël af van het huis van David, en zij maakten Jerobeam, de zoon van Nebat, koning; en Jerobeam dreef Israël weg van achter de HEERE vandaan, en liet hen een grote zonde zondigen.","Matt 25:24-27":"Maar hij die het ene talent ontvangen had, kwam ook en zei: Heer, ik kende u, dat u een hard mens bent, die maait waar u niet gezaaid hebt, en verzamelt vandaar waar u niet gestrooid hebt; En ik was bang, en ben weggegaan, en heb uw talent verborgen in de aarde; zie, u hebt het uwe. Maar zijn heer antwoordde en zei tegen hem: U slechte en luie dienstknecht! U wist dat ik maai waar ik niet gezaaid heb, en vandaar verzamel waar ik niet gestrooid heb.","Jes 30:20":"De Heere zal u wel brood van de benauwdheid, en water van de verdrukking geven; maar uw leraars zullen niet meer als met vleugels wegvliegen, maar uw ogen zullen uw leraars zien;","Jes 29:16":"Uw omkeren van de dingen is, alsof de pottenbakker geacht werd als leem, dat het maaksel zei van zijn maker: Hij heeft mij niet gemaakt; en het gevormde vat zei van zijn pottenbakker: Hij begrijpt het niet.","Micha 2:7":"O u, die het huis van Jakob genoemd wordt! Is de Geest van de HEERE dan verkort? Zijn dat Zijn werken? Doen Mijn woorden geen goed bij wie oprecht wandelt?","2 Kron 18:4":"Verder zei Josafat tegen de koning van Israël: Vraag toch vandaag naar het woord van de HEERE.","2 Kon 3:12":"En Josafat zei: Het woord van de HEERE is bij hem. Zo trokken naar hem toe de koning van Israël, en Josafat, en de koning van Edom.","Ex 14:7":"En hij nam zeshonderd uitgelezen wagens, ja, alle wagens van Egypte, en de hoofdlieden over die allemaal.","Joh 17:14":"Ik heb hun Uw woord gegeven; en de wereld heeft hen gehaat, omdat zij niet van de wereld zijn, zoals Ik niet van de wereld ben.","Hand 5:3":"En Petrus zei: Ananias, waarom heeft de satan uw hart vervuld, dat u de Heilige Geest zou liegen, en onttrekken van de prijs van het land?","Lev 20:15":"Verder, als een man gemeenschap heeft met enig dier, zal hij zeker gedood worden; ook zult u het dier doden.","1 Kon 22:1-54":"En zij bleven drie jaar stil, zodat er geen oorlog was tussen Syrië en Israël. En het gebeurde in het derde jaar, dat Josafat, de koning van Juda, naar de koning van Israël afkwam. Toen zei de koning van Israël tegen zijn knechten: Weet u dat Ramoth in Gilead van ons is? En wij blijven stil, zonder het uit de hand van de koning van Syrië te nemen.","Hand 4:8-13":"Toen zei Petrus, vervuld met de Heilige Geest, tegen hen: Leiders van het volk, en oudsten van Israël! Als wij vandaag ondervraagd worden over de weldaad aan een zieke mens gedaan, waardoor hij gezond geworden is; Laat het u allen bekend zijn, en het hele volk van Israël, dat door de Naam van Jezus Christus, de Nazarener, Die u gekruisigd hebt, Die God uit de doden heeft opgewekt, door Hem, zeg ik, staat deze man hier gezond voor u.","Luk 2:1-4":"En het gebeurde in diezelfde dagen, dat er een gebod uitging van de keizer Augustus, dat heel de wereld ingeschreven zou worden. Deze eerste inschrijvin
