1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"},"boeken":[{"naam":"Genesis","href":"../../genesis/1/"},{"naam":"Exodus","href":"../../exodus/1/"},{"naam":"Leviticus","href":"../../leviticus/1/"},{"naam":"Numeri","href":"../../numeri/1/"},{"naam":"Deuteronomium","href":"../../deuteronomium/1/"},{"naam":"Jozua","href":"../../jozua/1/"},{"naam":"Richteren","href":"../../richteren/1/"},{"naam":"Ruth","href":"../../ruth/1/"},{"naam":"1 Samuël","href":"../../1-samuel/1/"},{"naam":"2 Samuël","href":"../../2-samuel/1/"},{"naam":"1 Koningen","href":"../../1-koningen/1/"},{"naam":"2 Koningen","href":"../../2-koningen/1/"},{"naam":"1 Kronieken","href":"../../1-kronieken/1/"},{"naam":"2 Kronieken","href":"../../2-kronieken/1/"},{"naam":"Ezra","href":"../../ezra/1/"},{"naam":"Nehemia","href":"../../nehemia/1/"},{"naam":"Esther","href":"../../esther/1/"},{"naam":"Job","href":"../../job/1/"},{"naam":"Psalmen","href":"../../psalmen/1/"},{"naam":"Spreuken","href":"../../spreuken/1/"},{"naam":"Prediker","href":"../../prediker/1/"},{"naam":"Hooglied","href":"../../hooglied/1/"},{"naam":"Jesaja","href":"../../jesaja/1/"},{"naam":"Jeremia","href":"../../jeremia/1/"},{"naam":"Klaagliederen","href":"../../klaagliederen/1/"},{"naam":"Ezechiël","href":"../../ezechiel/1/"},{"naam":"Daniël","href":"../../daniel/1/"},{"naam":"Hosea","href":"../../hosea/1/"},{"naam":"Joël","href":"../../joel/1/"},{"naam":"Amos","href":"../../amos/1/"},{"naam":"Obadja","href":"../../obadja/1/"},{"naam":"Jona","href":"../../jona/1/"},{"naam":"Micha","href":"../../micha/1/"},{"naam":"Nahum","href":"../../nahum/1/"},{"naam":"Habakuk","href":"../../habakuk/1/"},{"naam":"Zefanja","href":"../../zefanja/1/"},{"naam":"Haggaï","href":"../../haggai/1/"},{"naam":"Zacharia","href":"../../zacharia/1/"},{"naam":"Maleachi","href":"../../maleachi/1/"},{"naam":"Mattheüs","href":"../../mattheus/1/"},{"naam":"Markus","href":"../../markus/1/"},{"naam":"Lukas","href":"../../lukas/1/"},{"naam":"Johannes","href":"../../johannes/1/"},{"naam":"Handelingen","href":"../../handelingen/1/"},{"naam":"Romeinen","href":"../../romeinen/1/"},{"naam":"1 Korinthe","href":"../../1-korinthe/1/"},{"naam":"2 Korinthe","href":"../../2-korinthe/1/"},{"naam":"Galaten","href":"../../galaten/1/"},{"naam":"Efeze","href":"../../efeze/1/"},{"naam":"Filippenzen","href":"../../filippenzen/1/"},{"naam":"Kolossenzen","href":"../../kolossenzen/1/"},{"naam":"1 Thessalonicenzen","href":"../../1-thessalonicenzen/1/"},{"naam":"2 Thessalonicenzen","href":"../../2-thessalonicenzen/1/"},{"naam":"1 Timotheüs","href":"../../1-timotheus/1/"},{"naam":"2 Timotheüs","href":"../../2-timotheus/1/"},{"naam":"Titus","href":"../../titus/1/"},{"naam":"Filemon","href":"../../filemon/1/"},{"naam":"Hebreeën","href":"../../hebreeen/1/"},{"naam":"Jakobus","href":"../../jakobus/1/"},{"naam":"1 Petrus","href":"../../1-petrus/1/"},{"naam":"2 Petrus","href":"../../2-petrus/1/"},{"naam":"1 Johannes","href":"../../1-johannes/1/"},{"naam":"2 Johannes","href":"../../2-johannes/1/"},{"naam":"3 Johannes","href":"../../3-johannes/1/"},{"naam":"Judas","href":"../../judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}]},"vertalingen":{"SVnu":{"1":"En zij bleven drie jaar stil, zodat er geen oorlog was tussen Syrië en Israël.","2":"En het gebeurde in het derde jaar, dat Josafat, de koning van Juda, naar de koning van Israël afkwam.","3":"Toen zei de koning van Israël tegen zijn knechten: Weet u dat Ramoth in Gilead van ons is? En wij blijven stil, zonder het uit de hand van de koning van Syrië te nemen.","4":"Daarna zei hij tegen Josafat: Zult u met mij optrekken naar de strijd bij Ramoth in Gilead? En Josafat zei tegen de koning van Israël: Ik zal zijn zoals u bent, mijn volk zoals uw volk, mijn paarden zoals uw paarden.","5":"Verder zei Josafat tegen de koning van Israël: Vraag toch vandaag naar het woord van de HEERE.","6":"Toen verzamelde de koning van Israël de profeten, ongeveer vierhonderd man, en hij zei tegen hen: Zal ik tegen Ramoth in Gilead ten strijde trekken, of zal ik het nalaten? En zij zeiden: Trek op, want de Heere zal ze in de hand van de koning geven.","7":"Maar Josafat zei: Is hier niet nog een profeet van de HEERE, zodat wij het hem konden vragen?","8":"Toen zei de koning van Israël tegen Josafat: Er is nog een man om door hem de HEERE te vragen; maar ik haat hem, omdat hij over mij niets goeds profeteert, maar kwaad: Micha, de zoon van Jimla. En Josafat zei: De koning moet dat niet zeggen!","9":"Toen riep de koning van Israël een kamerling en zei: Haal snel Micha, de zoon van Jimla.","10":"De koning van Israël nu, en Josafat, de koning van Juda, zaten elk op zijn troon, bekleed met *hun* klederen, op het plein, aan de deur van de poort van Samaria; en al de profeten profeteerden in hun tegenwoordigheid.","11":"En Zedekia, de zoon van Kenaana, had voor zichzelf ijzeren horens gemaakt, en hij zei: Zo zegt de HEERE: Met deze zult u de Syriërs neerstoten, totdat u hen helemaal hebt vernietigd.","12":"En al de profeten profeteerden zo en zeiden: Trek op naar Ramoth in Gilead, en u zult voorspoedig zijn; want de HEERE zal hen in de hand van de koning geven.","13":"De bode nu, die heengegaan was om Micha te roepen, sprak tegen hem en zei: Zie toch, de woorden van de profeten zijn eensgezind goed voor de koning; laat toch uw woord zijn als het woord van één van hen, en spreek het goede.","14":"Doch Micha zei: *Zo waarachtig als* de HEERE leeft, wat de HEERE tegen mij zeggen zal, dat zal ik spreken.","15":"Toen hij bij de koning gekomen was, zei de koning tegen hem: Micha, zullen wij naar Ramoth in Gilead ten strijde trekken, of zullen wij *het* nalaten? En hij zei tegen hem: Trek op, en u zult voorspoedig zijn, want de HEERE zal ze in de hand van de koning geven.","16":"En de koning zei tegen hem: Tot hoeveel keer zal ik u bezweren, dat u tegen mij niet anders spreekt dan de waarheid, in de Naam van de HEERE?","17":"En hij zei: Ik zag heel Israël verstrooid op de bergen, als schapen die geen herder hebben; en de HEERE zei: Dezen hebben geen heer; ieder keert terug naar zijn huis in vrede.","18":"Toen zei de koning van Israël tegen Josafat: Heb ik u niet gezegd: Hij zal over mij niets goeds, maar kwaad profeteren?","19":"Verder zei hij: Daarom, hoor het woord van de HEERE: Ik zag de HEERE zitten op Zijn troon, en heel het hemelse leger stond naast Hem, aan Zijn rechterhand en aan Zijn linkerhand.","20":"En de HEERE zei: Wie zal Achab overreden, zodat hij optrekt en valt bij Ramoth in Gilead? De één zei dit, en de ander zei dat.","21":"Toen ging een geest naar voren en stond voor het aangezicht van de HEERE, en zei: Ik zal hem overreden.","22":"En de HEERE zei tegen hem: Waarmee? En hij zei: Ik zal uitgaan en een leugengeest zijn in de mond van al zijn profeten. En Hij zei: U zult overreden, en het ook kunnen; ga uit en doe zo.","23":"Nu dan, zie, de HEERE heeft een leugengeest in de mond van al deze uw profeten gegeven; en de HEERE heeft kwaad over u gesproken.","24":"Toen kwam Zedekia, de zoon van Kenaana, dichterbij en sloeg Micha op de wang, en hij zei: Langs welke weg is de geest van de HEERE van mij weggegaan om u aan te spreken?","25":"En Micha zei: Zie, u zult het zien, op diezelfde dag, als u van kamer naar kamer zult gaan om u te verstoppen.","26":"De koning van Israël nu zei: Neem Micha, en breng hem terug naar Amon, de leider van de stad, en naar Joas, de zoon van de koning;","27":"En u zult zeggen: Zo zegt de koning: Zet deze man in de gevangenis, en geef hem brood van benauwdheid en water van benauwdheid, totdat ik in vrede terugkom.","28":"En Micha zei: Als u ooit in vrede terugkomt, dan heeft de HEERE niet door mij gesproken! Verder zei hij: Hoor, alle volken!","29":"Zo trok de koning van Israël en Josafat, de koning van Juda, op naar Ramoth in Gilead.","30":"En de koning van Israël zei tegen Josafat: Ik zal mij vermommen en dan in de strijd komen; maar u, trek uw kleren aan. Zo vermomde de koning van Israël zich, en kwam in de strijd.","31":"De koning van Syrië nu had zijn tweeëndertig aanvoerders van de wagens geboden en gezegd: U zult niet vechten tegen klein of groot, maar alleen tegen de koning van Israël.","32":"Het gebeurde dan, toen de aanvoerders van de wagens Josafat zagen, dat zij zeiden: Zeker, dat is de koning van Israël; en zij keerden zich naar hem toe om te strijden; maar Josafat riep het uit.","33":"En het gebeurde, toen de aanvoerders van de wagens zagen dat hij de koning van Israël niet was, dat zij zich van hem afkeerden en niet meer achtervolgden.","34":"Toen spande een man zijn boog, zomaar, zonder te mikken, en schoot de koning van Israël tussen de gespen en het pantser. Toen zei hij tegen zijn voerman: Keer uw hand, en breng mij uit het leger, want ik ben zwaar gewond.","35":"En de strijd nam die dag toe, en de koning werd rechtop gehouden in de wagen tegenover de Syriërs; maar hij stierf 's avonds, en het bloed van de wond vloeide in de bak van de wagen.","36":"En er ging een oproep door het leger, toen de zon onderging, en men zei: Ieder keert naar zijn stad, en ieder naar zijn land!","37":"Zo stierf de koning, en werd naar Samaria gebracht; en zij begroeven de koning te Samaria.","38":"Toen men de wagen in de vijver van Samaria spoelde, likten de honden zijn bloed, waar de hoeren zich wasten, naar het woord van de HEERE, dat Hij gesproken had.","39":"Het overige nu van de geschiedenis van Achab, en alles wat hij gedaan heeft, en het huis van ivoor dat hij gebouwd heeft, en al de steden die hij gebouwd heeft, staat dat niet geschreven in het boek van de kronieken van de koningen van Israël?","40":"Zo ontsliep Achab met zijn vaderen; en zijn zoon Ahazia werd koning in zijn plaats.","41":"Josafat nu, de zoon van Asa, werd koning over Juda, in het vierde jaar van Achab, de koning van Israël.","42":"Josafat was vijfendertig jaar oud toen hij koning werd, en regeerde vijfentwintig jaar te Jeruzalem; en de naam van zijn moeder was Azuba, de dochter van Silchi.","43":"En hij wandelde in heel de weg van zijn vader Asa; hij week daar niet van af, en deed wat recht was in de ogen van de HEERE.","44":"Toch werden de hoogten niet weggenomen; het volk offerde en bracht nog reukwerk op de hoogten.","45":"En Josafat maakte vrede met de koning van Israël.","46":"Het overige nu van de geschiedenis van Josafat, en zijn macht, die hij bewezen heeft, en hoe hij oorlog heeft gevoerd, staat dat niet geschreven in het boek van de kronieken van de koningen van Juda?","47":"Ook verwijderde hij uit het land de overige schandjongens, die in de dagen van zijn vader Asa overgebleven waren.","48":"Toen was er geen koning in Edom, *maar* een stadhouder van de koning.","49":"*En* Josafat maakte schepen van Tharsis, om naar Ofir te gaan voor goud; maar zij gingen niet, want de schepen werden gebroken bij Ezeon-Geber.","50":"Toen zei Ahazia, de zoon van Achab, tegen Josafat: Laat mijn knechten met uw knechten op de schepen meevaren; maar Josafat wilde niet.","51":"En Josafat ontsliep met zijn vaderen, en werd bij zijn vaderen begraven in de stad van zijn vader David; en zijn zoon Joram werd koning in zijn plaats.","52":"Ahazia, de zoon van Achab, werd koning over Israël te Samaria, in het zeventiende jaar van Josafat, de koning van Juda, en regeerde twee jaar over Israël.","53":"En hij deed wat kwaad was in de ogen van de HEERE; want hij wandelde in de weg van zijn vader, en in de weg van zijn moeder, en in de weg van Jerobeam, de zoon van Nebat, die Israël deed zondigen.","54":"En hij diende Baäl, en boog zich voor hem neer, en tergde de HEERE, de God van Israël, naar alles wat zijn vader gedaan had."},"SV":{"1":"En zij zaten drie jaren stil, dat er geen krijg was tussen Syrië en tussen Israël.","2":"Maar het geschiedde in het derde jaar, als Josafat, de koning van Juda, tot den koning van Israël afgekomen was,","3":"Dat de koning van Israël tot zijn knechten zeide: Weet gij, dat Ramoth in Gilead onze is? En wij zijn stil, zonder dat te nemen uit de hand van den koning van Syrië.","4":"Daarna zeide hij tot Josafat: Zult gij met mij trekken in den strijd naar Ramoth in Gilead? En Josafat zeide tot den koning van Israël: Zo zal ik zijn gelijk gij zijt, zo mijn volk als uw volk, zo mijn paarden als uw paarden.","5":"Verder zeide Josafat tot den koning van Israël: Vraag toch als heden naar het woord des HEEREN.","6":"Toen vergaderde de koning van Israël de profeten, omtrent vierhonderd man, en hij zeide tot hen: Zal ik tegen Ramoth in Gilead ten strijde trekken, of zal ik het nalaten? En zij zeiden: Trek op, want de Heere zal ze in de hand des konings geven.","7":"Maar Josafat zeide: Is hier niet nog een profeet des HEEREN, dat wij het van hem vragen mochten?","8":"Toen zeide de koning van Israël tot Josafat: Er is nog een man, om door hem den HEERE te vragen; maar ik haat hem, omdat hij over mij niets goeds profeteert, maar kwaad: Micha, de zoon van Jimla. En Josafat zeide: De koning zegge niet alzo!","9":"Toen riep de koning van Israël een kamerling, en hij zeide: Haal haastelijk Micha, den zoon van Jimla.","10":"De koning van Israël nu, en Josafat, de koning van Juda, zaten elk op zijn troon, bekleed met *hun* klederen, op het plein, aan de deur der poort van Samaria; en al de profeten profeteerden in hun tegenwoordigheid.","11":"En Zedekia, de zoon van Kenaana, had zich ijzeren horens gemaakt; en hij zeide: Zo zegt de HEERE: Met deze zult gij de Syriërs stoten, totdat gij hen gans verdaan zult hebben.","12":"En al de profeten profeteerden alzo, zeggende: Trek op naar Ramoth in Gilead, en gij zult voorspoedig zijn; want de HEERE zal hen in de hand des konings geven.","13":"De bode nu, die henengegaan was, om Micha te roepen, sprak tot hem, zeggende: Zie toch, de woorden der profeten zijn uit een mond goed tot den koning; dat toch uw woord zij, gelijk als het woord van een uit hen, en spreek het goede.","14":"Doch Micha zeide: *Zo* *waarachtig* *als* de HEERE leeft, hetgeen de HEERE tot mij zeggen zal, dat zal ik spreken.","15":"Als hij tot den koning gekomen was, zo zeide de koning tot hem: Micha, zullen wij naar Ramoth in Gilead ten strijde trekken, of zullen wij *het* nalaten? En hij zeide tot hem: Trek op, en gij zult voorspoedig zijn, want de HEERE zal ze in de hand des konings geven.","16":"En de koning zeide tot hem: Tot hoe vele reizen zal ik u bezweren, opdat gij tot mij niet spreekt, dan alleen de waarheid, in den Naam des HEEREN?","17":"En hij zeide: Ik zag het ganse Israël verstrooid op de bergen, gelijk schapen, die geen herder hebben; en de HEERE zeide: Dezen hebben geen heer; een iegelijk kere weder naar zijn huis in vrede.","18":"Toen zeide de koning van Israël tot Josafat: Heb ik tot u niet gezegd: Hij zal over mij niets goed, maar kwaads profeteren?","19":"Verder zeide hij: Daarom hoort het woord des HEEREN: Ik zag den HEERE, zittende op Zijn troon, en al het hemelse heir staande nevens Hem, aan Zijn rechter *hand* en aan Zijn linkerhand.","20":"En de HEERE zeide: Wie zal Achab overreden, dat hij optrekke en valle te Ramoth in Gilead? De een nu zeide aldus, en de andere zeide alzo.","21":"Toen ging een geest uit, en stond voor het aangezicht des HEEREN, en zeide: Ik zal hem overreden.","22":"En de HEERE zeide tot hem: Waarmede? En hij zeide: Ik zal uitgaan, en een leugengeest zijn in den mond van al zijn profeten. En Hij zeide: Gij zult overreden, en zult het ook vermogen; ga uit en doe alzo.","23":"Nu dan, zie, de HEERE heeft een leugengeest in den mond van al deze uw profeten gegeven; en de HEERE heeft kwaad over u gesproken.","24":"Toen trad Zedekia, de zoon van Kenaana, toe, en sloeg Micha op het kinnebakken; en hij zeide: Door wat *weg* is de geest des HEEREN van mij doorgegaan, om u aan te spreken?","25":"En Micha zeide: Zie, gij zult het zien, op dienzelfden dag, als gij zult gaan *van* kamer in kamer, om u te versteken.","26":"De koning van Israël nu zeide: Neem Micha, en breng hem weder tot Amon, den overste der stad, en tot Joas, den zoon des konings;","27":"En gij zult zeggen: Zo zegt de koning: Zet dezen in het gevangenhuis, en spijst hem met brood der bedruktheid, en met water der bedruktheid, totdat ik met vrede *weder* kom.","28":"En Micha zeide: Indien gij enigszins met vrede wederkomt, zo heeft de HEERE door mij niet gesproken! Verder zeide hij: Hoort, gij volken altegaar!","29":"Alzo toog de koning van Israël en Josafat, de koning van Juda, op naar Ramoth in Gilead.","30":"En de koning van Israël zeide tot Josafat: Als ik mij versteld heb, zal ik in den strijd komen; maar gij, trek uw klederen aan. Alzo verstelde zich de koning van Israël, en kwam in den strijd.","31":"De koning nu van Syrië had geboden aan de oversten der wagenen, van welke hij twee en dertig had, zeggende: Gij zult noch kleinen noch groten bestrijden, maar den koning van Israël alleen.","32":"Het geschiedde dan, als de oversten der wagenen Josafat zagen, dat zij zeiden: Gewisselijk, die is de koning van Israël, en zij keerden zich naar hem, om te strijden; maar Josafat riep uit.","33":"En het geschiedde, als de oversten der wagenen zagen, dat hij de koning van Israël niet was, dat zij zich van achter hem afkeerden.","34":"Toen spande een man den boog in zijn eenvoudigheid, en schoot den koning van Israël tussen de gespen en tussen het pantsier. Toen zeide hij tot zijn voerman: Keer uw hand, en voer mij uit het leger, want ik ben zeer verwond.","35":"En de strijd nam op denzelven dag toe, en de koning werd met den wagen staande gehouden tegenover de Syriërs; maar hij stierf des avonds, en het bloed der wonde vloeide in den bak des wagens.","36":"En er ging een uitroeping door het heirleger, als de zon onderging, zeggende: Een ieder kere naar zijn stad, en een ieder naar zijn land!","37":"Alzo stierf de koning, en werd naar Samaria gebracht; en zij begroeven den koning te Samaria.","38":"Als men nu den wagen in den vijver van Samaria spoelde, lekten de honden zijn bloed, waar de hoeren wiesen, naar het woord des HEEREN, dat Hij gesproken had.","39":"Het overige nu der geschiedenissen van Achab, en al wat hij gedaan heeft, en het elpenbenen huis, dat hij gebouwd heeft, en al de steden, die hij gebouwd heeft, zijn die niet geschreven in het boek der kronieken der koningen van Israël?","40":"Alzo ontsliep Achab met zijn vaderen; en zijn zoon Ahazia werd koning in zijn plaats.","41":"Josafat nu, de zoon van Asa, werd koning over Juda, in het vierde jaar van Achab, den koning van Israël.","42":"Josafat was vijf en dertig jaren oud, als hij koning werd, en regeerde vijf en twintig jaren te Jeruzalem; en de naam zijner moeder was Azuba, de dochter van Silchi.","43":"En hij wandelde in al den weg van zijn vader Asa; hij week niet daarvan, doende dat recht was in de ogen des HEEREN.","44":"Evenwel werden de hoogten niet weggenomen; het volk offerde en rookte nog op de hoogten.","45":"En Josafat maakte vrede met den koning van Israël.","46":"Het overige nu der geschiedenissen van Josafat, en zijn macht, die hij bewezen heeft, en hoe hij geoorloogd heeft, zijn die niet geschreven in het boek der kronieken der koningen van Juda?","47":"Ook deed hij uit het land weg de overige schandjongens, die in de dagen van zijn vader Asa overgebleven waren.","48":"Toen was er geen koning in Edom, *maar* een stadhouder des konings.","49":"*En* Josafat maakte schepen van Tharsis, om naar Ofir te gaan om goud; maar zij gingen niet, want de schepen werden gebroken te Ezeon-geber.","50":"Toen zeide Ahazia, de zoon van Achab, tot Josafat: Laat mijn knechten met uw knechten op de schepen varen; maar Josafat wilde niet.","51":"En Josafat ontsliep met zijn vaderen, en werd bij zijn vaderen begraven in de stad van zijn vader David; en zijn zoon Joram werd koning in zijn plaats.","52":"Ahazia, de zoon van Achab, werd koning over Israël te Samaria, in het zeventiende jaar van Josafat, den koning van Juda, en regeerde twee jaren over Israël.","53":"En hij deed dat kwaad was in de ogen des HEEREN; want hij wandelde in den weg van zijn vader, en in den weg van zijn moeder, en in den weg van Jerobeam, den zoon van Nebat, die Israël zondigen deed.","54":"En hij diende Baäl, en boog zich voor hem, en vertoornde den HEERE, den God Israëls, naar alles, wat zijn vader gedaan had."},"KJV":{"1":"And they continued three years without war between Syria and Israel.","2":"And it came to pass in the third year, that Jehoshaphat the king of Judah came down to the king of Israel.","3":"And the king of Israel said unto his servants, Know ye that Ramoth in Gilead is ours, and we be still, and take it not out of the hand of the king of Syria?","4":"And he said unto Jehoshaphat, Wilt thou go with me to battle to Ramothgilead? And Jehoshaphat said to the king of Israel, I am as thou art, my people as thy people, my horses as thy horses.","5":"And Jehoshaphat said unto the king of Israel, Enquire, I pray thee, at the word of the LORD to day.","6":"Then the king of Israel gathered ➔ the prophets together, about four hundred men, and said unto them, Shall I go against Ramothgilead to battle, or shall I forbear? And they said, Go up; for the Lord shall deliver it into the hand of the king.","7":"And Jehoshaphat said, Is there not here a prophet of the LORD besides, that we might enquire of him?","8":"And the king of Israel said unto Jehoshaphat, There is yet one man, Micaiah the son of Imlah, by whom we may enquire of the LORD: but I hate him; for he doth not prophesy good concerning me, but evil. And Jehoshaphat said, Let not the king say so.","9":"Then the king of Israel called an officer, and said, Hasten hither Micaiah the son of Imlah.","10":"And the king of Israel and Jehoshaphat the king of Judah sat each on his throne, having put on their robes, in a void place in the entrance of the gate of Samaria; and all the prophets prophesied before them.","11":"And Zedekiah the son of Chenaanah made him horns of iron: and he said, Thus saith the LORD, With these shalt thou push the Syrians, until thou have consumed them.","12":"And all the prophets prophesied so, saying, Go up to Ramothgilead, and prosper: for the LORD shall deliver it into the king's hand.","13":"And the messenger that was gone to call Micaiah spake unto him, saying, Behold now, the words of the prophets declare good unto the king with one mouth: let thy word, I pray thee, be like the word of one of them, and speak that which is good.","14":"And Micaiah said, As the LORD liveth, what the LORD saith unto me, that will I speak.","15":"So he came to the king. And the king said unto him, Micaiah, shall we go against Ramothgilead to battle, or shall we forbear? And he answered him, Go, and prosper: for the LORD shall deliver it into the hand of the king.","16":"And the king said unto him, How many times shall I adjure thee that thou tell me nothing but that which is true in the name of the LORD?","17":"And he said, I saw all Israel scattered upon the hills, as sheep that have not a shepherd: and the LORD said, These have no master: let them return every man to his house in peace.","18":"And the king of Israel said unto Jehoshaphat, Did I not tell thee that he would prophesy no good concerning me, but evil?","19":"And he said, Hear thou therefore the word of the LORD: I saw the LORD sitting on his throne, and all the host of heaven standing by him on his right hand and on his left.","20":"And the LORD said, Who shall persuade Ahab, that he may go up and fall at Ramothgilead? And one said on this manner, and another said on that manner.","21":"And there came forth a spirit, and stood before the LORD, and said, I will persuade him.","22":"And the LORD said unto him, Wherewith? And he said, I will go forth, and I will be a lying spirit in the mouth of all his prophets. And he said, Thou shalt persuade him, and prevail also: go forth, and do so.","23":"Now therefore, behold, the LORD hath put a lying spirit in the mouth of all these thy prophets, and the LORD hath spoken evil concerning thee.","24":"But Zedekiah the son of Chenaanah went near, and smote Micaiah on the cheek, and said, Which way went the Spirit of the LORD from me to speak unto thee?","25":"And Micaiah said, Behold, thou shalt see in that day, when thou shalt go into an inner chamber to hide thyself.","26":"And the king of Israel said, Take Micaiah, and carry him back unto Amon the governor of the city, and to Joash the king's son;","27":"And say, Thus saith the king, Put this fellow in the prison, and feed him with bread of affliction and with water of affliction, until I come in peace.","28":"And Micaiah said, If thou return at all in peace, the LORD hath not spoken by me. And he said, Hearken, O people, every one of you.","29":"So the king of Israel and Jehoshaphat the king of Judah went up to Ramothgilead.","30":"And the king of Israel said unto Jehoshaphat, I will disguise myself, and enter into the battle; but put thou on thy robes. And the king of Israel disguised himself, and went into the battle.","31":"But the king of Syria commanded his thirty and two captains that had rule over his chariots, saying, Fight neither with small nor great, save only with the king of Israel.","32":"And it came to pass, when the captains of the chariots saw Jehoshaphat, that they said, Surely it is the king of Israel. And they turned aside to fight against him: and Jehoshaphat cried out.","33":"And it came to pass, when the captains of the chariots perceived that it was not the king of Israel, that they turned back from pursuing him.","34":"And a certain man drew a bow at a venture, and smote the king of Israel between the joints of the harness: wherefore he said unto the driver of his chariot, Turn thine hand, and carry me out of the host; for I am wounded.","35":"And the battle increased that day: and the king was stayed up in his chariot against the Syrians, and died at even: and the blood ran out of the wound into the midst of the chariot.","36":"And there went a proclamation throughout the host about the going down of the sun, saying, Every man to his city, and every man to his own country.","37":"So the king died, and was brought to Samaria; and they buried the king in Samaria.","38":"And one washed the chariot in the pool of Samaria; and the dogs licked up his blood; and they washed his armour; according unto the word of the LORD which he spake.","39":"Now the rest of the acts of Ahab, and all that he did, and the ivory house which he made, and all the cities that he built, are they not written in the book of the chronicles of the kings of Israel?","40":"So Ahab slept with his fathers; and Ahaziah his son reigned in his stead.","41":"And Jehoshaphat the son of Asa began to reign over Judah in the fourth year of Ahab king of Israel.","42":"Jehoshaphat was thirty and five years old when he began to reign; and he reigned twenty and five years in Jerusalem. And his mother's name was Azubah the daughter of Shilhi.","43":"And he walked in all the ways of Asa his father; he turned not aside from it, doing that which was right in the eyes of the LORD: nevertheless the high places were not taken away; for the people offered and burnt incense yet in the high places.","44":"And Jehoshaphat made peace with the king of Israel.","45":"Now the rest of the acts of Jehoshaphat, and his might that he shewed, and how he warred, are they not written in the book of the chronicles of the kings of Judah?","46":"And the remnant of the sodomites, which remained in the days of his father Asa, he took out of the land.","47":"There was then no king in Edom: a deputy was king.","48":"Jehoshaphat made ships of Tharshish to go to Ophir for gold: but they went not; for the ships were broken at Eziongeber.","49":"Then said Ahaziah the son of Ahab unto Jehoshaphat, Let my servants go with thy servants in the ships. But Jehoshaphat would not.","50":"And Jehoshaphat slept with his fathers, and was buried with his fathers in the city of David his father: and Jehoram his son reigned in his stead.","51":"Ahaziah the son of Ahab began to reign over Israel in Samaria the seventeenth year of Jehoshaphat king of Judah, and reigned two years over Israel.","52":"And he did evil in the sight of the LORD, and walked in the way of his father, and in the way of his mother, and in the way of Jeroboam the son of Nebat, who made Israel to sin:","53":"For he served Baal, and worshipped him, and provoked to anger the LORD God of Israel, according to all that his father had done."}},"tsk":{"2":[{"kopje":"in het derde","refs":["1 Kon 22:1","Matt 12:40","Matt 16:21"]},{"kopje":"Josafat","refs":["1 Kon 22:41","1 Kon 22:45","1 Kon 15:24","2 Kon 8:18","2 Kron 18:1"]}],"3":[{"kopje":"Ramoth","refs":["1 Kon 4:13","Deut 4:43","Joz 20:8"]},{"kopje":"stil","refs":["Richt 16:2","2 Sam 19:10"]}],"4":[{"kopje":"Zult u met mij optrekken","refs":["2 Kon 3:7","2 Kron 18:3"]},{"kopje":"Ik zal zijn zoals u","refs":["2 Kron 19:2","Ps 139:21","Ps 139:22","Spr 13:20","1 Kor 15:33","2 Kor 6:16","2 Kor 6:17","Ef 5:11","2 Joh 1:11","Openb 2:26"]}],"5":[{"kopje":"Vraag","refs":["Num 27:21","Joz 9:14","Richt 1:1","Richt 20:18","Richt 20:23","Richt 20:29","1 Sam 14:18","1 Sam 23:2","1 Sam 23:4","1 Sam 23:9-12","1 Sam 30:8","2 Kon 1:3","2 Kon 3:11","1 Kron 10:13","2 Kron 18:4","2 Kron 18:5","Spr 3:5","Spr 3:6","Jer 21:2","Jer 42:2-6","Ezech 14:3","Ezech 20:1-3"]}],"6":[{"kopje":"de profeten","refs":["1 Kon 18:19","2 Tim 4:3"]},{"kopje":"Trek op","refs":["1 Kon 22:15","1 Kon 22:22","1 Kon 22:23","2 Kron 18:14","Jer 5:31","Jer 8:10","Jer 8:11","Jer 14:13","Jer 14:14","Jer 23:14-17","Jer 28:1-9","Ezech 13:7-16","Ezech 13:22","Matt 7:15","2 Petr 2:1-3","Openb 19:20"]}],"7":[{"kopje":"Is hier niet","refs":["2 Kon 3:11-13","2 Kron 18:6","2 Kron 18:7"]}],"8":[{"kopje":"nog een man","refs":["1 Kon 18:4","1 Kon 19:10","1 Kon 19:14","1 Kon 20:41","1 Kon 20:42"]},{"kopje":"maar ik haat hem","refs":["1 Kon 22:27","1 Kon 20:43","1 Kon 21:20","Gen 37:8","2 Kron 36:16","Ps c/?hl=1Kgs.22.53#i3745","refs":[{"disp":"1 Kon 22:52","href":"../../1-koningen/22/#v53","ref":"1 Kon 22:53","svLabel":"SV 53"}],"kinderen":[]}]}]}]}},"extern":{"Ps 119:126":"Het is tijd voor de HEERE, dat Hij werkt, want zij hebben Uw wet verbroken.","Richt 11:29":"Toen kwam de Geest van de HEERE op Jeftha, zodat hij Gilead en Manasse doortrok; want hij trok door tot Mizpa in Gilead, en van Mizpa in Gilead trok hij door naar de kinderen van Ammon.","Num 16:29":"Als dezen sterven zoals alle mensen sterven, en over hen een straf voltrokken wordt zoals over alle mensen, dan heeft de HEERE mij niet gezonden.","Hand 26:10":"Dat heb ik ook gedaan in Jeruzalem, en ik heb velen van de heiligen in de gevangenissen gesloten, nadat ik de macht van de overpriesters ontvangen had; en toen zij omgebracht werden, stemde ik ermee in.","Ezech 3:16":"Het gebeurde nu aan het einde van zeven dagen, dat het woord van de HEERE tot mij kwam, en zei:","Luk 1:41":"En het gebeurde, toen Elizabet de groet van Maria hoorde, dat het kindje opsprong in haar buik; en Elizabet werd vervuld met de Heilige Geest;","Spr 25:6":"Praal niet voor het aangezicht van de koning, en sta niet op de plaats van de groten;","2 Kon 9:32":"En hij hief zijn gezicht op naar het venster, en zei: Wie is met mij? Wie? Toen keken er twee, drie kamerlingen naar hem.","Ps 83:2-13":"O God! Zwijg niet, houd U niet doof, en blijf niet stil, o God! Want zie, Uw vijanden maken misbaar, en Uw haters steken het hoofd op. Zij maken listig een heimelijk plan tegen Uw volk, en spannen samen tegen wie U verborgen houdt.","2 Sam 7:3-7":"En Nathan zei tegen de koning: Ga heen, doe alles wat in uw hart is, want de HEERE is met u. Maar het gebeurde in diezelfde nacht, dat het woord van de HEERE tot Nathan kwam, en Hij zei: Ga, en zeg tegen Mijn knecht, tegen David: Zo zegt de HEERE: Zou u Mij een huis bouwen om in te wonen?","Ex 3:14":"En God zei tegen Mozes: IK ZAL ZIJN, DIE IK ZIJN ZAL! Ook zei Hij: Zo zult u tegen de kinderen van Israël zeggen: IK ZAL ZIJN heeft mij tot u gezonden!","Ps 34:22":"Thau. De boosheid zal de goddeloze doden; en die de rechtvaardige haten, zullen schuldig verklaard worden.","Ex 33:11":"En de HEERE sprak tot Mozes van aangezicht tot aangezicht, zoals een man met zijn vriend spreekt; daarna keerde hij terug naar het kamp; maar zijn dienaar Jozua, de zoon van Nun, de jongeman, week niet uit het midden van de tent.","Jes 14:14":"Ik zal boven de hoogten van de wolken klimmen, ik zal de Allerhoogste gelijk worden.","Deut 32:15":"Toen Jeschurun vet werd, sloeg hij achteruit (u bent vet geworden, u bent dik geworden, ja, met vet overdekt geworden!); en hij liet God varen, Die hem gemaakt heeft, en versmaadde de Rotssteen van zijn heil.","Mark 14:65":"En sommigen begonnen Hem te bespuwen, en Zijn gezicht te bedekken, en Hem met vuisten te slaan, en tegen Hem te zeggen: Profeteer! En de dienaars gaven Hem klappen in het gezicht.","Rom 1:27":"en evenzo hebben ook de mannen het natuurlijke gebruik van de vrouw verlaten, en zijn in hun begeerte naar elkaar in vuur geraakt, mannen die met mannen schandelijkheid bedrijven, en de vergelding voor hun dwaling, die daarbij hoorde, in zichzelf ontvangend.","Hand 20:27":"Want ik heb niet nagelaten u heel de raad van God te verkondigen.","Ex 14:12":"Is dit niet het woord dat wij in Egypte tot u spraken en zeiden: Houd op met ons, en laat ons de Egyptenaren dienen? Want het was ons beter geweest de Egyptenaren te dienen, dan in deze woestijn te sterven.","Amos 7:16":"Nu dan, hoor het woord van de HEERE: U zegt: U zult niet profeteren tegen Israël, en niets uitspreken tegen het huis van Izak.","Jer 10:9":"Uitgerekt zilver wordt van Tarsis gebracht, en goud van Ufaz, tot een werk van de werkmeester en van de handen van de goudsmid; hemelsblauw en purper is hun kleding, een werk van de wijzen zijn zij allemaal samen.","Ps 102:10":"Want ik eet as als brood, en vermeng mijn drank met tranen.","Gal 5:7-9":"U liep goed; wie heeft u verhinderd de waarheid niet gehoorzaam te zijn? Deze overtuiging komt niet van Hem, Die u roept. Een beetje zuurdesem verzuurt het hele deeg.","Luk 19:14":"Maar zijn burgers haatten hem, en stuurden gezanten achter hem aan, die zeiden: Wij willen niet dat deze man koning over ons wordt.","Ezech 8:12":"Toen zei Hij tegen mij: Hebt u gezien, mensenkind, wat de oudsten van het huis van Israël doen in de duisternis, ieder in zijn kamer vol afbeeldingen? Want zij zeggen: De HEERE ziet ons niet, de HEERE heeft het land verlaten.","Luk 3:2":"onder de hogepriesters Annas en Kajafas, kwam het woord van God tot Johannes, de zoon van Zacharias, in de woestijn.","2 Kron 30:10":"Zo trokken de boodschappers van stad tot stad, door het land van Efraïm en Manasse, tot Zebulon toe; maar zij lachten hen uit, en bespotten hen.","Ef 5:11":"En heb geen gemeenschap met de onvruchtbare werken van de duisternis, maar bestraf ze veeleer.","Jer 42:2-6":"en zij zeiden tegen de profeet Jeremia: Laat toch onze smeking voor uw aangezicht neervallen, en bid voor ons tot de HEERE, uw God, voor dit hele overblijfsel; want wij zijn nog maar met weinigen over van velen, zoals uw ogen ons zien; dat de HEERE, uw God, ons de weg bekendmaakt die wij zullen ingaan, en de zaak die wij zullen doen. En de profeet Jeremia zei tegen hen: Ik heb het gehoord; zie, ik zal tot de HEERE, uw God, bidden naar uw woorden; en het zal gebeuren, elk woord dat de HEERE u zal antwoorden, zal ik u bekendmaken, ik zal u niet één woord onthouden.","2 Kron 21:5":"Tweeëndertig jaar was Joram oud toen hij koning werd, en hij regeerde acht jaar in Jeruzalem.","Ps 119:158":"Ik heb gezien degenen, die trouweloos handelen, en het verdroot mij, dat zij Uw woord niet onderhielden.","Jer 42:3-6":"dat de HEERE, uw God, ons de weg bekendmaakt die wij zullen ingaan, en de zaak die wij zullen doen. En de profeet Jeremia zei tegen hen: Ik heb het gehoord; zie, ik zal tot de HEERE, uw God, bidden naar uw woorden; en het zal gebeuren, elk woord dat de HEERE u zal antwoorden, zal ik u bekendmaken, ik zal u niet één woord onthouden. Toen zeiden zij tegen Jeremia: De HEERE zij tussen ons tot een waarachtig en betrouwbaar Getuige: als wij niet handelen naar elk woord waarmee de HEERE, uw God, u naar ons toe zal zenden!","Luk 12:46":"dan zal de heer van die dienstknecht komen op een dag dat hij hem niet verwacht, en op een moment dat hij het niet weet; en hij zal hem in stukken houwen, en hem zijn deel geven met de ontrouwen.","Hand 10:11-17":"En hij zag de hemel geopend, en een zeker voorwerp op hem neerdalen, als een groot linnen laken, aan de vier hoeken gebonden, en neergelaten op de aarde; Waarin alle viervoetige dieren van de aarde waren, en de wilde dieren, en de kruipende dieren, en de vogels van de hemel. En er kwam een stem tot hem: Sta op, Petrus! Slacht en eet.","2 Kon 1:10":"Maar Elia antwoordde en sprak tot de leider over vijftig: Als ik dan een man van God ben, laat er dan vuur uit de hemel neerdalen, dat u en uw vijftigtal verteert. Toen daalde er vuur uit de hemel neer, en het verteerde hem en zijn vijftigtal.","Ps 148:2":"Looft Hem, al Zijn engelen! Looft Hem, al Zijn heerscharen!","1 Kon 21:19":"En u zult tot hem spreken en zeggen: Zo zegt de HEERE: Hebt u doodgeslagen, en ook een erfelijke bezitting ingenomen? Daartoe zult u tot hem spreken en zeggen: Zo zegt de HEERE: Op de plaats waar de honden het bloed van Naboth gelekt hebben, zullen de honden ook uw bloed lekken, ja, het uwe!","Spr 28:4":"Wie de wet verlaten, prijzen de goddelozen; maar wie de wet bewaren, gaan de strijd met hen aan.","Jona 2:1":"En Jona bad tot de HEERE, zijn God, uit het ingewand van de vis.","1 Kon 22:6-15":"Toen verzamelde de koning van Israël de profeten, ongeveer vierhonderd man, en hij zei tegen hen: Zal ik tegen Ramoth in Gilead ten strijde trekken, of zal ik het nalaten? En zij zeiden: Trek op, want de Heere zal ze in de hand van de koning geven. Maar Josafat zei: Is hier niet nog een profeet van de HEERE, zodat wij het hem konden vragen? Toen zei de koning van Israël tegen Josafat: Er is nog een man om door hem de HEERE te vragen; maar ik haat hem, omdat hij over mij niets goeds profeteert, maar kwaad: Micha, de zoon van Jimla. En Josafat zei: De koning moet dat niet zeggen!","Ezech 1:3":"Kwam het woord van de HEERE uitdrukkelijk tot Ezechiël, de zoon van Buzi, de priester, in het land van de Chaldeeën, bij de rivier Chebar; en de hand van de HEERE was daar op hem.","Num 22:38":"Toen zei Bileam tegen Balak: Zie, ik ben tot u gekomen; kan ik nu wel iets zeggen? Het woord dat God in mijn mond leggen zal, dat zal ik spreken.","Ezech 13:2":"Mensenkind, profeteer tegen de profeten van Israël, die profeteren, en zeg tegen hen die uit hun eigen hart profeteren: Hoor het woord van de HEERE.","2 Kron 20:37":"Maar Eliëzer, de zoon van Dodava, uit Maresa, profeteerde tegen Josafat en zei: Omdat u zich met Ahazia verbonden hebt, heeft de HEERE uw werken verscheurd. Zo werden de schepen verbroken, zodat zij niet naar Tharsis konden gaan.","2 Tim 2:17":"En hun woord zal voortvreten als de kanker; onder wie zijn Hymeneüs en Filetus;","1 Kon 15:5":"Omdat David gedaan had wat recht was in de ogen van de HEERE, en niet geweken was van alles wat Hij hem geboden had, al de dagen van zijn leven, behalve alleen in de zaak van Uria, de Hethiet.","Jer 38:4":"Toen zeiden de vorsten tegen de koning: Laat toch deze man gedood worden; want zo maakt hij de handen van de krijgslieden die in deze stad zijn overgebleven, en de handen van het hele volk slap, doordat hij zulke woorden tot hen spreekt; want deze man zoekt niet de vrede van dit volk, maar het kwaad.","2 Kon 1:2":"En Ahazia viel door een traliewerk in zijn bovenzaal, die te Samaria was, en werd ziek. En hij zond boden en zei tegen hen: Ga heen, vraag Baäl-Zebub, de god van Ekron, of ik van deze ziekte genezen zal worden.","2 Kron 18:9-11":"De koning van Israël nu, en Josafat, de koning van Juda, zaten elk op zijn troon, bekleed met hun kleren, en zij zaten op het plein bij de ingang van de poort van Samaria; en al de profeten profeteerden in hun bijzijn. En Zedekia, de zoon van Kenaana, had zich ijzeren hoornen gemaakt, en zei: Zo zegt de HEERE: Met deze zult u de Syriërs stoten, totdat u hen helemaal hebt vernietigd. En al de profeten profeteerden zo, en zeiden: Trek op naar Ramoth in Gilead, en u zult voorspoedig zijn, want de HEERE zal het in de hand van de koning geven.","Mark 6:24":"En zij ging naar buiten en zei tegen haar moeder: Wat zal ik vragen? En die zei: Het hoofd van Johannes de Doper.","1 Kor 7:16":"Want wat weet u, vrouw, of u de man zult redden? Of wat weet u, man, of u de vrouw zult redden?","Jer 28:2":"Zo spreekt de HEERE van de heerscharen, de God van Israël, en zegt: Ik heb het juk van de koning van Babel verbroken.","Hand 6:10":"En zij konden niet opgewassen zijn tegen de wijsheid en de Geest, door Wie hij sprak.","2 Kon 15:5":"En de HEERE plaagde de koning, zodat hij melaats werd tot de dag van zijn dood; en hij woonde in een afgezonderd huis, terwijl Jotham, de zoon van de koning, over het huis ging en het volk van het land rechtsprak.","1 Kon 20:30":"En de overgeblevenen vluchtten naar Afek, de stad in, en de muur viel op zeven en twintig duizend mannen, die overgebleven waren; ook vluchtte Benhadad, en kwam in de stad van kamer in kamer.","Jes 45:10":"Wee hem die tegen zijn vader zegt: Wat verwekt u? en tegen de vrouw: Wat baart u?","Ezech 36:2":"Zo zegt de Heere HEERE: Omdat de vijand van u zegt: Heah! Zelfs de eeuwige hoogten zijn ons ten erve geworden!","Hand 7:56":"En hij zei: Zie, ik zie de hemelen geopend, en de Zoon des mensen, staande aan de rechterhand van God.","Ezech 2:5":"En zij, hetzij dat zij het horen zullen, of hetzij dat zij het laten zullen (want zij zijn een opstandig huis), zo zullen zij weten, dat er een profeet in hun midden geweest is.","1 Kon 17:1":"En Elia, de Thisbiet, van de inwoners van Gilead, zei tegen Achab: Zo waarachtig als de HEERE, de God van Israël, leeft, voor Wiens aangezicht ik sta, indien deze jaren dauw of regen zijn zal, tenzij dan naar mijn woord!","2 Kron 36:16":"Maar zij spotten met de boden van God, en verachtten Zijn woorden; zij hielden Zijn profeten voor de gek, totdat de grimmigheid van de HEERE tegen Zijn volk opging, zodat er geen redding meer was.","Ex 19:9":"En de HEERE zei tot Mozes: Zie, Ik zal tot u komen in een dikke wolk, opdat het volk het hoort als Ik met u spreek, en dat zij ook eeuwig aan u geloven. Want Mozes had de HEERE de woorden van het volk verkondigd.","Openb 20:7":"En wanneer de duizend jaar geëindigd zullen zijn, zal de satan uit zijn gevangenis losgelaten worden.","2 Sam 23:2":"De Geest van de HEERE heeft door mij gesproken, en Zijn woord is op mijn tong geweest.","1 Kron 10:13":"Zo stierf Saul in zijn overtreding, waarmee hij overtreden had tegen de HEERE, tegen het woord van de HEERE dat hij niet gehouden had; en ook omdat hij de waarzegster geraadpleegd had, haar zoekende,","1 Kon 21:18-24":"Maak u op, ga naar beneden, Achab, de koning van Israël, tegemoet, die in Samaria is; zie, hij is in de wijngaard van Naboth, waarheen hij afgegaan is om die in bezit te nemen. En u zult tot hem spreken en zeggen: Zo zegt de HEERE: Hebt u doodgeslagen, en ook een erfelijke bezitting ingenomen? Daartoe zult u tot hem spreken en zeggen: Zo zegt de HEERE: Op de plaats waar de honden het bloed van Naboth gelekt hebben, zullen de honden ook uw bloed lekken, ja, het uwe! En Achab zei tegen Elia: Hebt u mij gevonden, o mijn vijand? En hij zei: Ik heb u gevonden, omdat u uzelf verkocht hebt om te doen wat kwaad is in de ogen van de HEERE.","Mark 3:22":"En de Schriftgeleerden die van Jeruzalem gekomen waren, zeiden: Hij heeft Beëlzebul, en door de leider van de duivels drijft Hij de duivels uit.","Richt 21:24":"Ook trokken de kinderen van Israël in die tijd vandaar, ieder naar zijn stam en naar zijn geslacht; zo trokken zij vandaar uit, ieder naar zijn erfenis.","2 Kron 24:20":"En de Geest van God bekleedde Zacharia, de zoon van Jojada, de priester, die boven het volk stond, en hij zei tegen hen: Zo zegt God: Waarom overtreedt u de geboden van de HEERE? Daarom zult u niet voorspoedig zijn; omdat u de HEERE verlaten hebt, zo zal Hij u verlaten.","Ezech 3:17":"Mensenkind! Ik heb u tot een wachter gesteld over het huis Israëls; zo zult u het woord uit Mijn mond horen, en hen namens Mij waarschuwen.","Richt 19:22":"Toen zij nu hun hart vrolijk maakten, zie, omringden de mannen van die stad (mannen, die kinderen van Belial waren) het huis, en klopten op de deur; en zij spraken tegen de oude man, de heer van het huis, en zeiden: Breng de man die in uw huis gekomen is naar buiten, zodat wij hem bekennen.","2 Sam 10:19":"Toen nu alle koningen die knechten van Hadad-Ezer waren, zagen dat zij voor Israëls aangezicht geslagen waren, sloten zij vrede met Israël, en dienden hen; en de Syriërs vreesden de kinderen Ammons niet meer te verlossen.","Gen 48:22":"En ik heb u één stuk land gegeven, boven uw broers; dat ik met mijn zwaard en met mijn boog uit de hand van de Amorieten genomen heb.","2 Kon 9:25":"Toen zei Jehu tegen Bidkar, zijn hoofdman: Neem hem op, werp hem op dat stuk land van Naboth, de Jizreëliet; want gedenk, toen ik en u samen achter zijn vader Achab reden, dat de HEERE hem deze last oplegde, en zei:","Ps 12:3":"Zij spreken valsheid, ieder met zijn naaste, met vleiende lippen; zij spreken met een dubbel hart.","Ezra 5:1":"De profeten Haggai, de profeet, en Zacharia, de zoon van Iddo, profeteerden tot de Joden die in Juda en te Jeruzalem waren; in de naam van de God van Israël profeteerden zij tot hen.","Hand 8:4":"Zij dan nu, die verstrooid waren, trokken het land door en verkondigden het Woord.","1 Kon 15:26":"En hij deed wat kwaad was in de ogen van de HEERE, en wandelde in de weg van zijn vader, en in zijn zonde, waarmee hij Israël had doen zondigen.","Jes 30:10":"Die tegen de zieners zeggen: Ziet niet; en tegen de schouwers: Schouwt ons niet wat recht is; spreekt tot ons zachte dingen, schouwt ons bedriegerijen.","2 Kron 32:15-19":"Laat Jehizkia u dan nu niet bedriegen, en laat hij u op deze manier niet opruien, en geloof hem niet; want geen god van enig volk en koninkrijk heeft zijn volk kunnen redden uit mijn hand en de hand van mijn vaderen; hoeveel te minder zal uw God u kunnen redden uit mijn hand? Daarbij spraken zijn dienaren nog meer tegen God, de HEERE, en tegen Zijn dienaar Jehizkia. Ook schreef hij brieven, om de HEERE, de God van Israël, te honen en om tegen Hem te spreken, en zei: Zoals de goden van de volken van de landen hun volk niet gered hebben uit mijn hand, zo zal de God van Jehizkia Zijn volk niet redden uit mijn hand.","Fil 2:26":"Omdat hij zeer begerig was naar u allen, en zeer beangst was, omdat u had gehoord dat hij ziek was geweest.","Spr 25:7":"Want het is beter dat men tegen u zegt: Kom hier bovenaan, dan dat men u vernedert voor het aangezicht van een vorst, die uw ogen gezien hebben.","Ps 119:53":"Grote beroering heeft mij bevangen vanwege de goddelozen, die Uw wet verlaten.","Num 11:29":"Maar Mozes zei tegen hem: Bent u ijverzuchtig voor mij? Och, was al het volk van de HEERE maar profeten, zodat de HEERE Zijn Geest over hen zou geven!","Ps 103:20":"Loof de HEERE, Zijn engelen! U krachtige helden, die Zijn woord doet, en die gehoorzamen aan de stem van Zijn woord.","Openb 16:14":"Want het zijn geesten van duivelen, die tekenen doen, die uitgaan naar de koningen van de aarde en van de hele wereld, om hen te verzamelen voor de strijd van die grote dag van de Almachtige God.","Openb 11:7-10":"En wanneer zij hun getuigenis geëindigd hebben, zal het beest, dat uit de afgrond opkomt, oorlog tegen hen voeren, en het zal hen overwinnen, en zal hen doden. En hun dode lichamen zullen liggen op de straat van de grote stad, die geestelijk genoemd wordt Sodom en Egypte, waar ook onze Heere gekruisigd is. En de mensen uit de volken, en geslachten, en talen, en naties, zullen hun dode lichamen zien, drie dagen en een halve, en zullen niet toelaten dat hun dode lichamen in graven gelegd worden.","Jes 57:19-21":"Ik schep de vrucht van de lippen: vrede, vrede voor hen die ver weg zijn, en voor hen die dichtbij zijn, zegt de HEERE, en Ik zal hen genezen. Maar de goddelozen zijn als een voortgejaagde zee, want die kan niet tot rust komen, en haar water werpt slijk en modder op. De goddelozen, zegt mijn God, hebben geen vrede.","Ex 25:9":"Naar alles wat Ik u tot een voorbeeld van deze tabernakel, en een voorbeeld van al zijn gereedschap wijzen zal, precies zo zult u dat maken.","Jer 27:1":"In het begin van het koningschap van Jojakim, zoon van Josia, koning van Juda, kwam dit woord van de HEERE tot Jeremia:","2 Kon 1:17":"Zo stierf hij, naar het woord van de HEERE, dat Elia gesproken had; en Joram werd koning in zijn plaats, in het tweede jaar van Joram, de zoon van Josafat, de koning van Juda; want hij had geen zoon.","Job 1:8-11":"En de HEERE zei tegen de satan: Hebt u ook acht geslagen op Mijn knecht Job? Want er is niemand op de aarde zoals hij, een man oprecht en vroom, godvrezend en afwijkend van het kwaad. Toen antwoordde de satan de HEERE en zei: Is het voor niets, dat Job God vreest? Hebt U niet een omheining gemaakt om hem heen, en om zijn huis, en om alles wat hij heeft rondom? Het werk van zijn handen hebt U gezegend, en zijn vee heeft zich in menigte uitgebreid in het land.","Ps 107:23-30":"Die met schepen ter zee afvaren, handel drijvend op grote wateren; Die zien de werken van de HEERE, en Zijn wonderwerken in de diepte. Als Hij spreekt, doet Hij een stormwind opsteken, die haar golven omhoog verheft.","Gen 27:40":"En van uw zwaard zult u leven, en u zult uw broer dienen; doch het zal gebeuren, wanneer u zult heersen, dan zult u zijn juk van uw hals afrukken.","1 Kron 28:11":"En David gaf zijn zoon Salomo een bereiding van het voorhuis, met zijn gebouwen, en zijn schatkamers, en zijn bovenzalen, en zijn binnenkamers, en van het huis van het verzoendeksel;","1 Petr 1:10":"Naar deze zaligheid hebben de profeten gezocht en onderzoek gedaan, zij die geprofeteerd hebben van de genade die voor u bestemd was;","Ex 19:19":"Toen het geluid van de bazuin aanhield en zeer sterk werd, sprak Mozes; en God antwoordde hem met een stem.","Jak 4:13-16":"Kom nu, u die zegt: Wij zullen vandaag of morgen naar die en die stad reizen, en daar een jaar doorbrengen, en handel drijven, en winst maken. U weet niet wat morgen gebeuren zal, want hoe is uw leven? Het is immers een damp, die voor een korte tijd zichtbaar is, en daarna verdwijnt. In plaats daarvan zou u moeten zeggen: Als de Heere het wil, en wij leven, zullen wij dit of dat doen.","Ps 106:29":"En zij hebben de Heere tot toorn verwekt met hun daden, zodat de plaag een inbreuk onder hen deed.","1 Kron 3:11":"zijn zoon was Joram; zijn zoon was Ahazia; zijn zoon was Joas;","Jer 25:3":"Vanaf het dertiende jaar van Josia, de zoon van Amon, de koning van Juda, tot op deze dag toe (dit is het drieëntwintigste jaar) is het woord van de HEERE tot mij gebeurd; en ik heb tot u gesproken, vroeg opstaand en sprekend, maar u hebt niet gehoord.","Jer 7:25":"Vanaf de dag dat uw vaders uit het land Egypte zijn uitgegaan, tot op deze dag, heb Ik tot u gezonden al Mijn knechten, de profeten, dagelijks vroeg opgestaan en hen zendend.","2 Kron 26:5":"Want hij begaf zich om God te zoeken, in de dagen van Zacharia, die verstandig was in de gezichten van God; en in de dagen dat hij de HEERE zocht, maakte God hem voorspoedig.","2 Sam 19:10":"En Absalom, die wij over ons gezalfd hadden, is in de strijd gestorven; waarom zwijgt u dan nu over het terughalen van de koning?","Ezech 14:3-5":"Mensenkind, deze mannen hebben hun drekgoden in hun hart opgezet, en hebben de aanstoot van hun ongerechtigheid recht voor hun aangezicht gezet; zou Ik dan werkelijk door hen geraadpleegd worden? Daarom, spreek met hen en zeg tegen hen: Zo zegt de Heere HEERE: Ieder man uit het huis van Israël die de drekgoden in zijn hart opzet, en de aanstoot van zijn ongerechtigheid recht voor zijn aangezicht zet, en komt tot de profeet, Ik, de HEERE, zal hem antwoorden als hij komt, naar de veelheid van zijn drekgoden; Opdat Ik het huis van Israël in hun hart grijp, omdat zij allen door hun drekgoden van Mij vervreemd zijn.","1 Kon 15:20":"En Benhadad luisterde naar de koning Asa, en zond de leiders van de legers die hij had tegen de steden van Israël; en sloeg Ijon, en Dan, en Abel-Beth-Maächa, en het gehele Cinneroth, met het gehele land Nafthali.","Jes 2:3":"En veel volken zullen heengaan en zeggen: Kom, laat ons opgaan tot de berg van de HEERE, tot het huis van de God van Jakob, opdat Hij ons leert van Zijn wegen, en dat wij wandelen in Zijn paden; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem.","Luk 3:20":"voegde hij daar bovenop ook nog dit aan toe, dat hij Johannes in de gevangenis opsloot.","1 Tess 3:1":"Daarom hebben wij, omdat we het verlangen niet langer konden verdragen, het goed gevonden om alleen in Athene achtergelaten te worden;","2 Sam 22:15":"En Hij zond pijlen uit en verstrooide ze; bliksemen en verschrikte ze.","Jes 44:26":"Die het woord van Zijn knecht bevestigt, en de raad van Zijn boden volbrengt; Die tot Jeruzalem zegt: U zult bewoond worden; en tot de steden van Juda: U zult herbouwd worden, en Ik zal haar verwoeste plaatsen oprichten.","Num 24:13":"Al zou Balak mij zijn huis vol zilver en goud geven, dan nog kan ik het bevel van de HEERE niet overtreden, door uit mijn eigen hart goed of kwaad te doen; wat de HEERE spreken zal, dat zal ik spreken.","Mark 6:6":"En Hij verwonderde Zich over hun ongeloof, en trok rond door de dorpen daar in de omgeving, terwijl Hij onderwees.","Amos 6:4":"Die daar liggen op ivoren bedsteden, en weelderig zijn op hun rustbanken, en de lammeren van de kudde eten, en de kalveren uit het midden van de meststal.","Fil 4:3":"En ik bid ook u, mijn oprechte metgezel, wees deze vrouwen behulpzaam, die met mij gestreden hebben in het Evangelie, ook met Clemens, en de andere medearbeiders van mij, van wie de namen in het boek van het leven staan.","Ex 16:7":"En morgen zult u de heerlijkheid van de HEERE zien, omdat Hij uw gemor tegen de HEERE gehoord heeft; want wat zijn wij, dat u tegen ons mort?","Num 27:17":"Die voor hen uitgaat, en die voor hen ingaat, en die hen uitleidt, en die hen inleidt; opdat de vergadering van de HEERE niet is als schapen die geen herder hebben.","Jes 6:1-3":"In het jaar dat koning Uzzia stierf, zag ik de Heere zitten op een hoge en verheven troon, en Zijn zomen vulden de tempel. De serafs stonden boven Hem; ieder had zes vleugels; met twee bedekte ieder zijn gezicht, en met twee bedekte hij zijn voeten, en met twee vloog hij. En de een riep tot de ander en zei: Heilig, heilig, heilig is de HEERE van de heerscharen! De hele aarde is vol van Zijn heerlijkheid!","2 Kron 18:4-27":"Verder zei Josafat tegen de koning van Israël: Vraag toch vandaag naar het woord van de HEERE. Toen verzamelde de koning van Israël de profeten, vierhonderd man, en hij zei tegen hen: Zullen wij tegen Ramoth in Gilead ten strijde trekken, of zal ik het nalaten? En zij zeiden: Trek op, want God zal het in de hand van de koning geven. Maar Josafat zei: Is hier niet nog een profeet van de HEERE, zodat wij hem konden raadplegen?","1 Kon 20:43":"En de koning van Israël ging heen, verdrietig en toornig, naar zijn huis, en kwam te Samaria.","Ps 80:6":"U voedt hen met tranenbrood, en drenkt hen met tranen uit een drieling.","Joz 23:15":"En het zal gebeuren, zoals al die goede dingen over u gekomen zijn, die de HEERE, uw God, tot u gesproken heeft, zo zal de HEERE over u laten komen al die kwade dingen, totdat Hij u verdelgt van dit goede land, dat de HEERE, uw God, u gegeven heeft.","Job 34:33":"Zal het van u zijn, hoe Hij iets vergelden zal, omdat u Hem versmaadt? Zou u dan verkiezen, en niet ik? Wat weet u dan? Spreek.","1 Kron 21:18":"Toen zei de engel van de HEERE tegen Gad, dat hij tegen David zou zeggen, dat David zou opgaan, om voor de HEERE een altaar op te richten op de dorsvloer van Ornan, de Jebusiet.","Dan 4:35":"En alle inwoners van de aarde worden als niets geacht, en Hij doet naar Zijn wil met het leger van de hemel en de inwoners van de aarde, en er is niemand die Zijn hand kan tegenhouden, of tegen Hem kan zeggen: Wat doet U?","Matt 24:25":"Kijk, Ik heb het u van tevoren gezegd!","2 Kron 8:18":"En Huram zond hem, door de hand van zijn knechten, schepen, alsook knechten die de zee kenden; en zij gingen met de knechten van Salomo naar Ofir, en zij haalden vandaar vierhonderdvijftig talenten goud, die zij naar koning Salomo brachten.","2 Petr 2:10":"maar vooral hen, die naar het vlees wandelen in onreine begeerte, en het gezag verachten; die vermetel zijn, zichzelf behagen, en die er niet voor terugschrikken de heerlijkheden te lasteren;","2 Tim 2:18":"die van de waarheid zijn afgeweken, en zeggen dat de opstanding al gebeurd is, en het geloof van sommigen omverwerpen.","Matt 13:13-15":"Daarom spreek Ik tot hen door gelijkenissen, omdat zij ziende niet zien, en horende niet horen, en ook niet begrijpen. En in hen wordt de profetie van Jesaja vervuld, die zegt: Met het gehoor zult u horen, en geenszins begrijpen; en ziende zult u zien, en geenszins opmerken. Want het hart van dit volk is dik geworden, en met de oren hebben zij zwaar gehoord, en hun ogen hebben zij gesloten; opdat zij niet op enig moment met de ogen zouden zien, en met de oren horen, en met het hart begrijpen, en zich bekeren, en Ik hen zou genezen.","Hos 1:1":"Het woord van de Heere, dat gebeurd is tot Hosea, de zoon van Beëri, in de dagen van Uzzia, Jotham, Achaz, Hizkia, koningen van Juda, en in de dagen van Jerobeam, zoon van Joas, koning van Israël.","2 Tess 2:10":"en met alle verleiding van de onrechtvaardigheid in hen die verloren gaan; omdat zij de liefde voor de waarheid niet aangenomen hebben, om behouden te worden.","Jes 23:1-14":"De last van Tyrus. Huil, u schepen van Tarsis! Want zij is verwoest, zodat er geen huis meer is, zodat niemand er meer in kan gaan; uit het land Chittim is het aan hen bekendgemaakt. Zwijg, u inwoners van het eiland! U, die de kooplieden van Sidon, die over zee voeren, rijk maakten, En wiens inkomsten het zaad van Sichor was over het grote water, de oogst van de rivier; en zij was de markt van de heidenvolken.","Gen 19:11":"En zij sloegen de mannen die bij de deur van het huis waren met blindheid, van de kleinste tot de grootste, zodat zij moe werden bij het zoeken naar de deur.","Joh 15:19":"Als u van de wereld was, zou de wereld het hare liefhebben; maar omdat u van de wereld niet bent, maar Ik u uit de wereld heb uitverkoren, daarom haat de wereld u.","Ezech 40:1":"In het vijfentwintigste jaar van onze wegvoering, in het begin van het jaar, op de tiende van de maand, in het veertiende jaar nadat de stad was ingenomen, op diezelfde dag was de hand van de HEERE op mij, en Hij bracht mij daarheen.","Jes 29:15":"Wee hun die zich diep willen verbergen voor de HEERE, hun raad verbergend; en wier werken in duisternis gebeuren, en zij zeggen: Wie ziet ons, en wie kent ons?","1 Kon 15:25":"Nadab nu, de zoon van Jerobeam, werd koning over Israël, in het tweede jaar van Asa, de koning van Juda; en hij regeerde twee jaren over Israël.","Ps 3:3":"Velen zeggen van mijn ziel: Hij heeft geen heil bij God. Sela.","1 Kon 14:21":"Rehabeam nu, de zoon van Salomo, regeerde in Juda; eenenveertig jaren was Rehabeam oud toen hij koning werd, en hij regeerde zeventien jaren te Jeruzalem, in de stad die de HEERE gekozen had uit al de stammen van Israël, om Zijn Naam daar te vestigen; en de naam van zijn moeder was Naäma, de Ammonietische.","Ezech 2:2":"Zo kwam in mij, toen Hij tot mij sprak, de Geest, Die mij op mijn voeten zette; en ik hoorde Hem, Die tot mij sprak.","Jer 28:3":"In nog twee volle jaren zal Ik naar deze plaats terugbrengen al de voorwerpen van het huis van de HEERE, die Nebukadnezar, de koning van Babel, uit deze plaats heeft weggenomen en naar Babel gebracht.","Amos 3:1":"Hoort dit woord, dat de HEERE tegen u spreekt, kinderen van Israël! Namelijk tegen het gehele geslacht, dat Ik uit Egypteland heb opgevoerd, en Hij zei:","1 Sam 9:9":"(Eertijds zei ieder in Israël dit, als hij ging om God te vragen: Kom, laten wij gaan naar de ziener; want wie tegenwoordig een profeet genoemd wordt, werd eertijds een ziener genoemd.)","1 Tess 1:7":"Zodat u voorbeelden geworden bent voor alle gelovigen in Macedonië en Achaje.","Num 1:1":"Verder sprak de HEERE tot Mozes, in de woestijn van Sinaï, in de tent van de samenkomst, op de eerste dag van de tweede maand, in het tweede jaar nadat zij uit het land Egypte vertrokken waren, en Hij zei:","2 Kron 35:23":"En de schutters schoten koning Josia. Toen zei de koning tegen zijn knechten: Voer mij weg, want ik ben zwaar gewond.","2 Kron 20:35":"Doch hierna verbond Josafat, de koning van Juda, zich met Ahazia, de koning van Israël; die handelde goddeloos in wat hij deed.","Hand 4:2":"Zeer ontevreden, omdat zij het volk leerden en in Jezus de opstanding uit de doden verkondigden.","Gen 3:1":"De slang was listiger dan al het gedierte van het veld, dat de HEERE God gemaakt had; en zij zei tegen de vrouw: Is het echt zo dat God gezegd heeft: U zult niet eten van alle bomen in de hof?","Openb 5:11":"En ik zag, en ik hoorde een stem van veel engelen rondom de troon, en van de dieren, en van de oudsten; en hun aantal was tienduizend maal tienduizend, en duizend maal duizend;","Ps 45:9":"Al Uw kleren zijn mirre, en aloë, en kassie; uit de ivoren paleizen, van waar zij U verblijden.","Spr 14:6":"De spotter zoekt wijsheid, en vindt niets; maar de kennis is voor de verstandige licht.","1 Kron 29:29":"De geschiedenissen nu van koning David, de eerste en de laatste, zie, die zijn geschreven in de geschiedenissen van Samuel, de ziener, en in de geschiedenissen van de profeet Nathan, en in de geschiedenissen van Gad, de ziener;","Jer 23:14-17":"Maar in de profeten van Jeruzalem zie Ik afschuwelijkheid; zij plegen overspel, en gaan om met valsheid, en sterken de handen van de boosdoeners, zodat zij zich niet bekeren, ieder van zijn boosheid; zij zijn Mij allen als Sodom, en haar inwoners als Gomorra. Daarom zegt de HEERE van de heerscharen van deze profeten zo: Zie, Ik zal hen met alsem spijzigen, en met gallewater drenken; want van de profeten van Jeruzalem is de huichelarij uitgegaan in het hele land. Zo zegt de HEERE van de heerscharen: Hoor niet naar de woorden van de profeten, die u profeteren; zij maken u ijdel; zij spreken het visioen van hun eigen hart, niet uit de mond van de HEERE.","Num 27:21":"En hij zal voor Eleazar, de priester, staan, die voor hem om raad zal vragen, volgens de wijze van Urim, voor de HEERE; naar zijn woord zullen zij uitgaan, en naar zijn woord zullen zij ingaan, hij, en alle kinderen van Israël met hem, en de hele vergadering.","1 Sam 19:23":"Toen ging hij daarheen naar Najoth bij Rama; en dezelfde Geest van God kwam ook op hem, en al voortgaande profeteerde hij, totdat hij in Najoth in Rama aankwam.","1 Kor 16:10":"Als Timotheüs nu komt, ziet erop dat hij zonder vrees bij u is; want hij doet het werk van de Heere, zoals ik ook.","Richt 14:6":"Toen kwam de Geest van de HEERE machtig over hem, zodat hij hem uiteenscheurde, zoals men een bokje uiteenscheurt, en er was niets in zijn hand; maar hij vertelde zijn vader en zijn moeder niet wat hij gedaan had.","2 Kron 18:18-22":"Verder zei hij: Daarom, hoor het woord van de HEERE: Ik zag de HEERE zitten op Zijn troon, en heel het hemelse leger staande aan Zijn rechterhand en Zijn linkerhand. En de HEERE zei: Wie zal Achab, de koning van Israël, overreden, zodat hij optrekt en valt bij Ramoth in Gilead? Daarna zei Hij: Deze zegt het zo, en die zegt het zo. Toen kwam een geest naar voren, en stond voor het aangezicht van de HEERE, en zei: Ik zal hem overreden. En de HEERE zei tegen hem: Waarmee?","Hagg 1:13":"Toen sprak Haggai, de bode van de HEERE, in de boodschap van de HEERE, tot het volk, en hij zei: Ik ben met u, spreekt de HEERE.","2 Kron 18:12":"De bode nu, die gegaan was om Micha te roepen, sprak tegen hem en zei: Zie, de woorden van de profeten zijn eensgezind goed voor de koning; laat toch uw woord zijn als dat van een van hen, en spreek het goede.","Hand 2:30":"Omdat hij dan een profeet was, en wist dat God hem met een eed gezworen had dat Hij uit de vrucht van zijn lichaam, wat het vlees betreft, de Christus zou verwekken om Hem op zijn troon te zetten;","1 Petr 2:12":"En houd uw levenswandel eerlijk onder de heidenen; opdat, waar zij nu kwaad van u spreken als van kwaaddoeners, zij door de goede werken die zij van u zien, God mogen verheerlijken op de dag dat Hij naar hen omziet.","Ps 103:7":"Hij heeft Mozes Zijn wegen bekendgemaakt, aan de kinderen van Israël Zijn daden.","Spr 21:30":"Er is geen wijsheid, en er is geen verstand, en er is geen raad tegen de HEERE.","1 Tim 4:1":"De Geest zegt uitdrukkelijk dat in de laatste tijden sommigen zullen afvallen van het geloof, doordat zij zich gaan richten op verleidende geesten en leringen van demonen,","1 Kon 11:43":"Daarna ontsliep Salomo met zijn vaderen, en werd begraven in de stad van zijn vader David; en Rehabeam, zijn zoon, werd koning in zijn plaats.","1 Kon 16:30-33":"En Achab, de zoon van Omri, deed wat kwaad was in de ogen van de HEERE, meer dan allen die voor hem geweest waren. En het gebeurde (was het een lichte zaak dat hij wandelde in de zonden van Jerobeam, de zoon van Nebat?), dat hij ook nog Izebel, de dochter van Eth-baal, de koning van de Sidoniërs, tot vrouw nam, en heenging, en Baäl diende, en zich voor hem neerboog. En hij richtte voor Baäl een altaar op, in het huis van Baäl, dat hij te Samaria gebouwd had.","Ezech 13:6-9":"Zij zien nietigheid en leugenachtige voorzegging, zij die zeggen: De HEERE heeft gesproken, terwijl de HEERE hen niet gezonden heeft; en zij geven hoop dat het woord vervuld zal worden. Ziet u niet een nietig gezicht, en spreekt u een leugenachtige voorzegging, als u zegt: De HEERE spreekt, terwijl Ik niet gesproken heb? Daarom zegt de Heere HEERE zo: Omdat u nietigheid spreekt, en leugen ziet; daarom, zie, Ik ben tegen u, spreekt de Heere HEERE.","2 Kron 18:16":"En hij zei: Ik zag heel Israël verstrooid op de bergen, als schapen die geen herder hebben; en de HEERE zei: Dezen hebben geen heer; ieder keert terug naar zijn huis in vrede.","Ex 22:19":"Al wie met een dier gemeenschap heeft, moet zeker gedood worden.","Hebr 1:1":"Nadat God voortijds veelmaal en op velerlei wijze tot de vaderen gesproken heeft door de profeten, heeft Hij in deze laatste dagen tot ons gesproken door de Zoon;","Jer 17:1":"De zonde van Juda is geschreven met een ijzeren griffie, met de punt van een diamant; gegraven in de tafel van hun hart, en aan de hoornen van uw altaren;","Richt 6:7-10":"En het gebeurde, toen de Israëlieten tot de HEERE riepen vanwege de Midianieten, dat de HEERE een man zond, die een profeet was, naar de Israëlieten; die zei tegen hen: Zo zegt de HEERE, de God van Israël: Ik heb u uit Egypte doen optrekken, en u uit het slavenhuis uitgeleid; en Ik heb u verlost uit de hand van de Egyptenaren, en uit de hand van allen die u onderdrukten; en Ik heb hen voor uw ogen verdreven, en u hun land gegeven;","Luk 4:23":"En Hij zei tegen hen: U zult zonder twijfel dit spreekwoord tegen Mij zeggen: Dokter, genees Uzelf; al wat wij gehoord hebben dat in Kapernaüm gebeurd is, doe dat ook hier in Uw vaderland.","Jes 2:5":"Kom, u huis van Jakob, en laat ons wandelen in het licht van de HEERE.","2 Kron 15:17":"De hoogten werden wel niet weggenomen uit Israël, het hart van Asa was echter volkomen al zijn dagen.","2 Kron 22:3":"Hij wandelde ook in de wegen van het huis van Achab; want zijn moeder was zijn raadgeefster, om goddeloos te handelen.","2 Kon 1:3":"Maar de Engel van de HEERE sprak tot Elia, de Thisbiet: Maak u op, ga de boden van de koning van Samaria tegemoet, en spreek tot hen: Is het omdat er geen God in Israël is, dat u heengaat om Baäl-Zebub, de god van Ekron, te vragen?","Hand 28:25":"En omdat zij het onderling oneens waren, gingen zij uiteen, nadat Paulus dit ene woord gezegd had, namelijk: Terecht heeft de Heilige Geest gesproken door de profeet Jesaja tot onze voorvaders,","Openb 2:7":"Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, hem zal Ik geven te eten van de boom des levens, die in het midden van het paradijs van God is.","Gen 37:8":"Toen zeiden zijn broers tegen hem: Zult u dan werkelijk over ons regeren? Zult u dan werkelijk over ons heersen? Zo haatten zij hem nog meer, om zijn dromen en om zijn woorden.","2 Kon 23:7":"Daartoe brak hij de huizen van de schandjongens af, die bij het huis van de HEERE waren, waar de vrouwen huisjes voor het beeld van het bos weefden.","1 Kon 11:3":"En hij had zevenhonderd vrouwen, vorstinnen, en driehonderd bijvrouwen, en zijn vrouwen deden zijn hart neigen.","Joz 20:8":"En aan de andere kant van de Jordaan, bij Jericho oostwaarts, gaven zij Bezer in de woestijn, in het platte land, uit de stam van Ruben; en Ramoth in Gilead, uit de stam van Gad; en Golan in Bazan, uit de stam van Manasse.","Pred 12:9":"En verder, omdat de prediker wijs geweest is, leerde hij het volk nog kennis, en lette hij op, en onderzocht hij; hij bracht veel spreuken in orde.","Hebr 1:7":"En tot de engelen zegt Hij wel: Die Zijn engelen maakt tot geesten, en Zijn dienaars tot een vlam van het vuur.","Hand 27:22":"Maar nu vermaan ik u om moed te houden; want er zal geen enkel leven onder u verloren gaan, alleen het schip.","Hand 18:24-28":"En een zekere Jood, met de naam Apollos, van geboorte een Alexandriër, een welsprekend man, kwam naar Efeze, machtig zoals hij was in de Schriften. Deze was onderwezen in de weg van de Heere; en omdat hij vurig was van geest, sprak en leerde hij nauwkeurig de zaken van de Heere, al kende hij alleen de doop van Johannes. En hij begon vrijmoedig te spreken in de synagoge. En toen Aquila en Priscilla hem gehoord hadden, namen zij hem tot zich, en legden hem de weg van God nauwkeuriger uit.","Ps 50:21":"Deze dingen doet u, en Ik zwijg; u meent dat Ik helemaal ben zoals u; Ik zal u straffen, en zal het ordelijk voor uw ogen op een rij zetten.","Jer 18:1":"Het woord dat van de HEERE tot Jeremia gebeurde, en Hij zei:","2 Kon 17:22":"Zo wandelden de kinderen van Israël in alle zonden van Jerobeam die hij gedaan had; zij weken daar niet van af;","2 Kron 21:5-7":"Tweeëndertig jaar was Joram oud toen hij koning werd, en hij regeerde acht jaar in Jeruzalem. En hij ging de weg van de koningen van Israël, zoals het huis van Achab deed; want hij had de dochter van Achab tot vrouw; en hij deed wat slecht was in de ogen van de HEERE. Doch de HEERE wilde het huis van David niet te gronde richten, omwille van het verbond dat Hij met David gesloten had; en zoals Hij gezegd had hem en zijn zonen voor altijd een lamp te zullen geven.","Mark 5:20":"En hij ging weg, en begon in het gebied van Dekapolis te verkondigen wat grote dingen Jezus aan hem gedaan had; en zij verwonderden zich allen.","2 Kon 13:13":"En Joas ontsliep met zijn vaderen, en Jerobeam zat op zijn troon. En Joas werd begraven te Samaria, bij de koningen van Israël.","1 Petr 2:11":"Geliefden, ik roep u dringend op, als inwoners en vreemdelingen, dat u zich onthoudt van de vleselijke begeerten, die strijd voeren tegen de ziel;","Matt 13:25":"En toen de mensen sliepen, kwam zijn vijand en zaaide onkruid midden tussen de tarwe, en ging weg.","Num 16:41":"Maar de volgende dag morde de hele vergadering van de kinderen van Israël tegen Mozes en tegen Aäron, en zei: U hebt het volk van de HEERE gedood!","2 Kon 9:8":"En het hele huis van Achab zal omkomen; en Ik zal van Achab uitroeien wie mannelijk is, ook wie in Israël opgesloten is en wie verlaten is.","Ps 71:17":"O God! Gij hebt mij geleerd van mijn jeugd af aan, en tot nog toe verkondig ik Uw wonderen.","Jes 54:15":"Zie, zij zullen zich zeker verzamelen, maar niet uit Mij; wie zich tegen u verzamelen zal, die zal om uw wil vallen.","Dan 3:17":"Als het zo is, onze God, Die wij eren, is machtig om ons te verlossen uit de brandende vuuroven, en Hij zal ons uit uw hand, o koning, verlossen.","2 Kron 20:14":"Toen kwam de Geest van de HEERE in het midden van de samenkomst, op Jahaziël, de zoon van Zecharja, de zoon van Benaja, de zoon van Jehiël, de zoon van Matthanja, de Leviet, uit de zonen van Asaf;","2 Petr 1:21":"Want de profetie is vroeger nooit voortgebracht door de wil van een mens, maar de heilige mensen van God hebben gesproken, gedreven door de Heilige Geest.","Joz 24:14-16":"En nu, vrees de HEERE, en dien Hem in oprechtheid en in waarheid; en doe de goden weg die uw vaders gediend hebben, aan de overkant van de rivier, en in Egypte; en dien de HEERE. Doch als het kwaad is in uw ogen om de HEERE te dienen, kies heden wie u dienen zult; hetzij de goden die uw vaders, die aan de andere kant van de rivier waren, gediend hebben, of de goden van de Amorieten, in wiens land u woont; maar wat mij en mijn huis aangaat, wij zullen de HEERE dienen! Toen antwoordde het volk en zei: Het zij verre van ons, dat wij de HEERE zouden verlaten om andere goden te dienen.","Jes 5:25":"Daarom is de toorn van de HEERE ontstoken tegen Zijn volk, en heeft Hij Zijn hand tegen hen uitgestrekt, en heeft Hij hen geslagen, zodat de bergen hebben gebeefd, en hun dode lichamen zijn geworden als vuil in het midden van de straten. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.","Jes 28:22":"Nu dan, drijf de spot niet, opdat uw banden niet vaster gemaakt worden; want ik heb van de Heere HEERE van de heerscharen een verdelging gehoord, ja, een die vast besloten is over het hele land.","2 Kor 6:17":"Daarom, ga uit hun midden weg, en scheid u af, zegt de Heere, en raak niet aan wat onrein is, en Ik zal u aannemen,","Ps 9:20":"Sta op, HEERE, laat de mens zich niet versterken; laat de heidenen voor Uw aangezicht geoordeeld worden.","Ef 4:26":"Word toornig, en zondig niet; laat de zon niet ondergaan over uw toorn;","Jer 1:2":"Tot wie het woord van de HEERE kwam, in de dagen van Josia, zoon van Amon, koning van Juda, in het dertiende jaar van zijn regering.","Dan 11:36":"En die koning zal doen naar zijn welgevallen, en hij zal zichzelf verheffen, en zich groot maken boven elke god, en hij zal tegen de God der goden wonderlijke dingen spreken; en hij zal voorspoedig zijn, totdat de gramschap voltooid is, want het is vast besloten, het zal gebeuren.","Mark 15:20":"En toen zij Hem bespot hadden, deden zij Hem de purperen mantel af, en deden Hem Zijn eigen kleren aan, en leidden Hem naar buiten, om Hem te kruisigen.","Jer 26:3":"Misschien zullen zij horen, en zich bekeren, ieder van zijn boze weg; zo zou Ik berouw hebben over het kwaad dat Ik hun denk te doen vanwege de boosheid van hun daden.","2 Kron 19:3":"Toch zijn er goede dingen bij u gevonden; want u hebt de bossen uit het land weggedaan, en uw hart erop gericht om God te zoeken.","Matt 16:21":"Van toen af begon Jezus Zijn discipelen te tonen dat Hij naar Jeruzalem moest gaan, en veel moest lijden van de oudsten, en overpriesters, en Schriftgeleerden, en gedood moest worden, en op de derde dag moest opstaan.","2 Kon 15:8":"In het achtendertigste jaar van Azaria, de koning van Juda, regeerde Zacharia, de zoon van Jerobeam, over Israël te Samaria, zes maanden.","1 Kon 22:32-36":"Het gebeurde dan, toen de aanvoerders van de wagens Josafat zagen, dat zij zeiden: Zeker, dat is de koning van Israël; en zij keerden zich naar hem toe om te strijden; maar Josafat riep het uit. En het gebeurde, toen de aanvoerders van de wagens zagen dat hij de koning van Israël niet was, dat zij zich van hem afkeerden en niet meer achtervolgden. Toen spande een man zijn boog, zomaar, zonder te mikken, en schoot de koning van Israël tussen de gespen en het pantser. Toen zei hij tegen zijn voerman: Keer uw hand, en breng mij uit het leger, want ik ben zwaar gewond.","Jer 9:1-3":"Och, dat mijn hoofd water was, en mijn oog een springader van tranen! Dan zou ik dag en nacht bewenen de verslagenen van de dochter van mijn volk. Och, dat ik in de woestijn een herberg voor reizigers had, dan zou ik mijn volk verlaten, en van hen wegtrekken; want zij zijn allemaal overspelers, een trouweloze hoop. En zij spannen hun tong als hun boog voor leugen; zij worden geweldig in het land, maar niet voor waarheid; want zij gaan voort van slechtheid tot slechtheid, maar Mij kennen zij niet, spreekt de HEERE.","Jes 6:8":"Daarna hoorde ik de stem van de Heere, die zei: Wie zal Ik zenden, en wie zal voor Ons heengaan? Toen zei ik: Zie, hier ben ik, zend mij heen.","2 Kron 18:29":"En de koning van Israël zei tegen Josafat: Ik zal mij vermommen en zo in de strijd komen; maar u, trek uw kleren aan. Zo vermomde de koning van Israël zich, en zij gingen de strijd in.","Ps 147:8":"Die de hemel met wolken bedekt, Die voor de aarde regen klaarmaakt; Die het gras op de bergen laat opkomen;","2 Kon 14:4":"Alleen de hoogten werden niet weggenomen; het volk offerde en brandde nog reukwerk op de hoogten.","2 Kron 36:12":"En hij deed wat slecht was in de ogen van de HEERE, zijn God; hij verootmoedigde zich niet voor het aangezicht van de profeet Jeremia, die sprak uit de mond van de HEERE.","Jer 44:21-23":"Het roken dat u in de steden van Juda en in de straten van Jeruzalem gerookt hebt, u en uw vaderen, uw koningen en uw vorsten, en het volk van het land, heeft de HEERE daar niet aan gedacht, en is dat niet in Zijn hart opgekomen? Zodat de HEERE het niet meer kon verdragen, vanwege de slechtheid van uw handelingen, vanwege de gruwelen die u deed; daarom is uw land geworden tot een woestheid, en tot ontzetting, en tot een vloek, zodat er niemand in woont, zoals het is op deze dag; Vanwege dat u wierook gebrand hebt, en dat u tegen de HEERE gezondigd hebt, en de stem van de HEERE niet gehoorzaam bent geweest, en in Zijn wet en in Zijn inzettingen, en in Zijn getuigenissen niet hebt gewandeld; daarom is u dit kwaad overkomen, zoals het is op deze dag.","Jer 48:26":"Maak hem dronken, omdat hij zich groot gemaakt heeft tegen de HEERE; zo zal Moab met de handen klappen in zijn uitspuwsel, en hij zelf zal ook tot bespotting zijn.","Spr 3:34":"Zeker, de spotters zal Hij bespotten, maar aan de zachtmoedigen zal Hij genade geven.","Ezech 33:20":"Toch zegt u: De weg van de Heere is niet recht; Ik zal u richten, ieder naar zijn wegen, o huis van Israël!","2 Kon 10:10":"Weet nu, dat niets van het woord van de HEERE, dat de HEERE tegen het huis van Achab gesproken heeft, op de aarde zal vallen; want de HEERE heeft gedaan, wat Hij door de dienst van Zijn knecht Elia gesproken heeft.","Jer 23:17":"Zij zeggen steeds tegen hen die Mij lasteren: De HEERE heeft het gesproken, u zult vrede hebben; en tegen ieder die naar het goeddunken van zijn eigen hart wandelt, zeggen zij: U zal geen kwaad overkomen.","1 Kor 14:32":"En de geesten der profeten zijn aan de profeten onderworpen.","2 Kron 33:18":"Het overige nu van de geschiedenissen van Manasse, en zijn gebed tot zijn God, ook de woorden van de zieners, die tot hem gesproken hebben in de Naam van de HEERE, de God van Israël, zie, die staan in de geschiedenissen van de koningen van Israël;","Jer 28:9":"De profeet die geprofeteerd zal hebben van vrede, als het woord van die profeet uitkomt, dan zal die profeet bekend worden, dat de HEERE hem werkelijk gezonden heeft.","Hand 4:33":"En de apostelen gaven met grote kracht getuigenis van de opstanding van de Heere Jezus; en er was grote genade over hen allen.","Jer 20:9":"Daarom zei ik: Ik zal Hem niet meer noemen, en niet meer in Zijn Naam spreken; maar het werd in mijn hart als een brandend vuur, opgesloten in mijn beenderen; en ik werd moe van het verdragen, maar ik kon het niet.","Jer 1:11-16":"Verder kwam het woord van de HEERE tot mij, en zei: Wat ziet u, Jeremia? En ik zei: Ik zie een
