lass=\"wl wl-kjv\" data-code=\"H1692\">clave</span> unto these in <span class=\"wl wl-kjv\" data-code=\"H157\">love.</span>","3":"And he had <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wives,</span> <span class=\"wl wl-kjv\" data-code=\"H8282\">princesses,</span> and <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H6370\">concubines:</span> and his <span class=\"wl wl-kjv\" data-code=\"H802\">wives</span> turned <span class=\"wl wl-kjv\" data-code=\"H5186\">away</span> his <span class=\"wl wl-kjv\" data-code=\"H3820\">heart.</span>","4":"For it came to pass, <span class=\"wl wl-kjv\" data-code=\"H6256\">when</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> was <span class=\"wl wl-kjv\" data-code=\"H2209\">old,</span> that his <span class=\"wl wl-kjv\" data-code=\"H802\">wives</span> turned <span class=\"wl wl-kjv\" data-code=\"H5186\">away</span> his <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> <span class=\"wl wl-kjv\" data-code=\"H430\">gods:</span> and his <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> was not <span class=\"wl wl-kjv\" data-code=\"H8003\">perfect</span> with the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> his <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> as was the <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father.</span>","5":"For <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> <span class=\"wl wl-kjv\" data-code=\"H6253\">Ashtoreth</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">goddess</span> of the <span class=\"wl wl-kjv\" data-code=\"H6722\">Zidonians,</span> and <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> <span class=\"wl wl-kjv\" data-code=\"H4445\">Milcom</span> the <span class=\"wl wl-kjv\" data-code=\"H8251\">abomination</span> of the <span class=\"wl wl-kjv\" data-code=\"H5984\">Ammonites.</span>","6":"And <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and went not <span class=\"wl wl-kjv\" data-code=\"H4390\">fully</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> as did <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father.</span>","7":"Then did <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> an high <span class=\"wl wl-kjv\" data-code=\"H1116\">place</span> for <span class=\"wl wl-kjv\" data-code=\"H3645\">Chemosh,</span> the <span class=\"wl wl-kjv\" data-code=\"H8251\">abomination</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab,</span> in the <span class=\"wl wl-kjv\" data-code=\"H2022\">hill</span> that is <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> and for <span class=\"wl wl-kjv\" data-code=\"H4432\">Molech,</span> the <span class=\"wl wl-kjv\" data-code=\"H8251\">abomination</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon.</span>","8":"And likewise <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> he for all his <span class=\"wl wl-kjv\" data-code=\"H5237\">strange</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wives,</span> which burnt <span class=\"wl wl-kjv\" data-code=\"H6999\">incense</span> and <span class=\"wl wl-kjv\" data-code=\"H2076\">sacrificed</span> unto their <span class=\"wl wl-kjv\" data-code=\"H430\">gods.</span>","9":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was <span class=\"wl wl-kjv\" data-code=\"H599\">angry</span> with <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon,</span> because his <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> was <span class=\"wl wl-kjv\" data-code=\"H5186\">turned</span> from the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> which had <span class=\"wl wl-kjv\" data-code=\"H7200\">appeared</span> unto him <span class=\"wl wl-kjv\" data-code=\"H6471\">twice,</span>","10":"And had <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> him concerning this <span class=\"wl wl-kjv\" data-code=\"H1697\">thing,</span> that he should not <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> <span class=\"wl wl-kjv\" data-code=\"H430\">gods:</span> but he <span class=\"wl wl-kjv\" data-code=\"H8104\">kept</span> not that which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded.</span>","11":"Wherefore the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon,</span> Forasmuch as this is done of thee, and thou hast not <span class=\"wl wl-kjv\" data-code=\"H8104\">kept</span> my <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> and my <span class=\"wl wl-kjv\" data-code=\"H2708\">statutes,</span> which I have <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> thee, I will <span class=\"wl wl-kjv\" data-code=\"H7167\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H7167\">rend</span> the <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdom</span> from thee, and will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> it to thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant.</span>","12":"Notwithstanding in thy <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> I will not <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> it for <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> thy <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> sake: but I will <span class=\"wl wl-kjv\" data-code=\"H7167\">rend</span> it out of the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of thy <span class=\"wl wl-kjv\" data-code=\"H1121\">son.</span>","13":"<span class=\"wl wl-kjv\" data-code=\"H7535\">Howbeit</span> I will not rend <span class=\"wl wl-kjv\" data-code=\"H7167\">away</span> all the <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdom;</span> but will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H7626\">tribe</span> to thy <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> for <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> my <span class=\"wl wl-kjv\" data-code=\"H5650\">servant's</span> sake, and for <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem's</span> sake which I have <span class=\"wl wl-kjv\" data-code=\"H977\">chosen.</span>","14":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> stirred <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> an <span class=\"wl wl-kjv\" data-code=\"H7854\">adversary</span> unto <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon,</span> <span class=\"wl wl-kjv\" data-code=\"H1908\">Hadad</span> the <span class=\"wl wl-kjv\" data-code=\"H130\">Edomite:</span> he was of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> in <span class=\"wl wl-kjv\" data-code=\"H123\">Edom.</span>","15":"For it came to pass, when <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> was in <span class=\"wl wl-kjv\" data-code=\"H123\">Edom,</span> and <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> the <span class=\"wl wl-kjv\" data-code=\"H8269\">captain</span> of the <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> was gone <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H6912\">bury</span> the <span class=\"wl wl-kjv\" data-code=\"H2491\">slain,</span> after he had <span class=\"wl wl-kjv\" data-code=\"H5221\">smitten</span> every <span class=\"wl wl-kjv\" data-code=\"H2145\">male</span> in <span class=\"wl wl-kjv\" data-code=\"H123\">Edom;</span>","16":"(For <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H2320\">months</span> did <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">remain</span> there with all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> until he had cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> every <span class=\"wl wl-kjv\" data-code=\"H2145\">male</span> in <span class=\"wl wl-kjv\" data-code=\"H123\">Edom:)</span>","17":"That <span class=\"wl wl-kjv\" data-code=\"H111\">Hadad</span> <span class=\"wl wl-kjv\" data-code=\"H1272\">fled,</span> he and <span class=\"wl wl-kjv\" data-code=\"H582\">certain</span> <span class=\"wl wl-kjv\" data-code=\"H130\">Edomites</span> of his <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> with him, to <span class=\"wl wl-kjv\" data-code=\"H935\">go</span> into <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt;</span> <span class=\"wl wl-kjv\" data-code=\"H1908\">Hadad</span> being yet a <span class=\"wl wl-kjv\" data-code=\"H6996\">little</span> <span class=\"wl wl-kjv\" data-code=\"H5288\">child.</span>","18":"And they <span class=\"wl wl-kjv\" data-code=\"H6965\">arose</span> out of <span class=\"wl wl-kjv\" data-code=\"H4080\">Midian,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H6290\">Paran:</span> and they <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> with them out of <span class=\"wl wl-kjv\" data-code=\"H6290\">Paran,</span> and they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> unto <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt;</span> which <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> him an <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">appointed</span> him <span class=\"wl wl-kjv\" data-code=\"H3899\">victuals,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> him <span class=\"wl wl-kjv\" data-code=\"H776\">land.</span>","19":"And <span class=\"wl wl-kjv\" data-code=\"H1908\">Hadad</span> <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> <span class=\"wl wl-kjv\" data-code=\"H3966\">great</span> <span class=\"wl wl-kjv\" data-code=\"H2580\">favour</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh,</span> so that he <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> him to <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> the <span class=\"wl wl-kjv\" data-code=\"H269\">sister</span> of his own <span class=\"wl wl-kjv\" data-code=\"H802\">wife,</span> the <span class=\"wl wl-kjv\" data-code=\"H269\">sister</span> of <span class=\"wl wl-kjv\" data-code=\"H8472\">Tahpenes</span> the <span class=\"wl wl-kjv\" data-code=\"H1377\">queen.</span>","20":"And the <span class=\"wl wl-kjv\" data-code=\"H269\">sister</span> of <span class=\"wl wl-kjv\" data-code=\"H8472\">Tahpenes</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> him <span class=\"wl wl-kjv\" data-code=\"H1592\">Genubath</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> whom <span class=\"wl wl-kjv\" data-code=\"H8472\">Tahpenes</span> <span class=\"wl wl-kjv\" data-code=\"H1580\">weaned</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">in</span> <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house:</span> and <span class=\"wl wl-kjv\" data-code=\"H1592\">Genubath</span> was in <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">household</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh.</span>","21":"And when <span class=\"wl wl-kjv\" data-code=\"H1908\">Hadad</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> in <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> that <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H7901\">slept</span> with his <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> and that <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> the <span class=\"wl wl-kjv\" data-code=\"H8269\">captain</span> of the <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> was <span class=\"wl wl-kjv\" data-code=\"H4191\">dead,</span> <span class=\"wl wl-kjv\" data-code=\"H1908\">Hadad</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh,</span> Let me <span class=\"wl wl-kjv\" data-code=\"H7971\">depart,</span> that I may <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> to mine own <span class=\"wl wl-kjv\" data-code=\"H776\">country.</span>","22":"Then <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, But what hast thou <span class=\"wl wl-kjv\" data-code=\"H2638\">lacked</span> with me, that, behold, thou <span class=\"wl wl-kjv\" data-code=\"H1245\">seekest</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> to thine own <span class=\"wl wl-kjv\" data-code=\"H776\">country?</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> Nothing: howbeit let me <span class=\"wl wl-kjv\" data-code=\"H7971\">go</span> in any <span class=\"wl wl-kjv\" data-code=\"H7971\">wise.</span>","23":"And <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> stirred him <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> another <span class=\"wl wl-kjv\" data-code=\"H7854\">adversary,</span> <span class=\"wl wl-kjv\" data-code=\"H7331\">Rezon</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H450\">Eliadah,</span> which <span class=\"wl wl-kjv\" data-code=\"H1272\">fled</span> from his <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> <span class=\"wl wl-kjv\" data-code=\"H1909\">Hadadezer</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H6678\">Zobah:</span>","24":"And he <span class=\"wl wl-kjv\" data-code=\"H6908\">gathered</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> unto him, and became <span class=\"wl wl-kjv\" data-code=\"H8269\">captain</span> over a <span class=\"wl wl-kjv\" data-code=\"H1416\">band,</span> when <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H2026\">slew</span> them of Zobah: and they <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> to <span class=\"wl wl-kjv\" data-code=\"H1834\">Damascus,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> therein, and <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> in <span class=\"wl wl-kjv\" data-code=\"H1834\">Damascus.</span>","25":"And he was an <span class=\"wl wl-kjv\" data-code=\"H7854\">adversary</span> to <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> all the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon,</span> beside the <span class=\"wl wl-kjv\" data-code=\"H7451\">mischief</span> that <span class=\"wl wl-kjv\" data-code=\"H1908\">Hadad</span> did: and he <span class=\"wl wl-kjv\" data-code=\"H6973\">abhorred</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> over <span class=\"wl wl-kjv\" data-code=\"H758\">Syria.</span>","26":"And <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5028\">Nebat,</span> an <span class=\"wl wl-kjv\" data-code=\"H673\">Ephrathite</span> of <span class=\"wl wl-kjv\" data-code=\"H6868\">Zereda,</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon's</span> <span class=\"wl wl-kjv\" data-code=\"H5650\">servant,</span> whose <span class=\"wl wl-kjv\" data-code=\"H517\">mother's</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> was <span class=\"wl wl-kjv\" data-code=\"H6871\">Zeruah,</span> a <span class=\"wl wl-kjv\" data-code=\"H490\">widow</span> <span class=\"wl wl-kjv\" data-code=\"H802\">woman,</span> even he lifted <span class=\"wl wl-kjv\" data-code=\"H7311\">up</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> against the <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span>","27":"And this was the <span class=\"wl wl-kjv\" data-code=\"H1697\">cause</span> that he lifted <span class=\"wl wl-kjv\" data-code=\"H7311\">up</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> against the <span class=\"wl wl-kjv\" data-code=\"H4428\">king:</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> <span class=\"wl wl-kjv\" data-code=\"H4407\">Millo,</span> and <span class=\"wl wl-kjv\" data-code=\"H5462\">repaired</span> the <span class=\"wl wl-kjv\" data-code=\"H6556\">breaches</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father.</span>","28":"And the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam</span> was a mighty <span class=\"wl wl-kjv\" data-code=\"H1368\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H2428\">valour:</span> and <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">seeing</span> the young <span class=\"wl wl-kjv\" data-code=\"H5288\">man</span> that he was <span class=\"wl wl-kjv\" data-code=\"H6213\">industrious,</span> he made him <span class=\"wl wl-kjv\" data-code=\"H6485\">ruler</span> over all the <span class=\"wl wl-kjv\" data-code=\"H5447\">charge</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph.</span>","29":"And it came to pass at that <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> when <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> that the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> <span class=\"wl wl-kjv\" data-code=\"H281\">Ahijah</span> the <span class=\"wl wl-kjv\" data-code=\"H7888\">Shilonite</span> <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> him in the <span class=\"wl wl-kjv\" data-code=\"H1870\">way;</span> and he had <span class=\"wl wl-kjv\" data-code=\"H3680\">clad</span> himself with a <span class=\"wl wl-kjv\" data-code=\"H2319\">new</span> <span class=\"wl wl-kjv\" data-code=\"H8008\">garment;</span> and they <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> were alone in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field:</span>","30":"And <span class=\"wl wl-kjv\" data-code=\"H281\">Ahijah</span> <span class=\"wl wl-kjv\" data-code=\"H8610\">caught</span> the <span class=\"wl wl-kjv\" data-code=\"H2319\">new</span> <span class=\"wl wl-kjv\" data-code=\"H8008\">garment</span> that was on him, and <span class=\"wl wl-kjv\" data-code=\"H7167\">rent</span> it in <span class=\"wl wl-kjv\" data-code=\"H8147\">twelve</span> <span class=\"wl wl-kjv\" data-code=\"H7168\">pieces:</span>","31":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam,</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">Take</span> thee <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H7168\">pieces:</span> for thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> Behold, I will <span class=\"wl wl-kjv\" data-code=\"H7167\">rend</span> the <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdom</span> out of the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon,</span> and will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H7626\">tribes</span> to thee:","32":"(But he shall have <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H7626\">tribe</span> for my <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David's</span> sake, and for <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem's</span> sake, the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> which I have <span class=\"wl wl-kjv\" data-code=\"H977\">chosen</span> out of all the <span class=\"wl wl-kjv\" data-code=\"H7626\">tribes</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:)</span>","33":"Because that they have <span class=\"wl wl-kjv\" data-code=\"H5800\">forsaken</span> me, and have <span class=\"wl wl-kjv\" data-code=\"H7812\">worshipped</span> <span class=\"wl wl-kjv\" data-code=\"H6253\">Ashtoreth</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">goddess</span> of the <span class=\"wl wl-kjv\" data-code=\"H6722\">Zidonians,</span> <span class=\"wl wl-kjv\" data-code=\"H3645\">Chemosh</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">god</span> of the <span class=\"wl wl-kjv\" data-code=\"H4124\">Moabites,</span> and <span class=\"wl wl-kjv\" data-code=\"H4445\">Milcom</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">god</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon,</span> and have not <span class=\"wl wl-kjv\" data-code=\"H1980\">walked</span> in my <span class=\"wl wl-kjv\" data-code=\"H1870\">ways,</span> to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> that which is <span class=\"wl wl-kjv\" data-code=\"H3477\">right</span> in mine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> and to keep my <span class=\"wl wl-kjv\" data-code=\"H2708\">statutes</span> and my <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments,</span> as did <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father.</span>","34":"Howbeit I will not <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> the whole <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdom</span> out of his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand:</span> but I will <span class=\"wl wl-kjv\" data-code=\"H7896\">make</span> him <span class=\"wl wl-kjv\" data-code=\"H5387\">prince</span> all the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of his <span class=\"wl wl-kjv\" data-code=\"H2416\">life</span> for <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> my <span class=\"wl wl-kjv\" data-code=\"H5650\">servant's</span> sake, whom I <span class=\"wl wl-kjv\" data-code=\"H977\">chose,</span> because he <span class=\"wl wl-kjv\" data-code=\"H8104\">kept</span> my <span class=\"wl wl-kjv\" data-code=\"H4687\">commandments</span> and my <span class=\"wl wl-kjv\" data-code=\"H2708\">statutes:</span>","35":"But I will <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> the <span class=\"wl wl-kjv\" data-code=\"H4410\">kingdom</span> out of his <span class=\"wl wl-kjv\" data-code=\"H1121\">son's</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> it unto thee, even <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H7626\">tribes.</span>","36":"And unto his <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> will I <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H7626\">tribe,</span> that <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> my <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> may have a <span class=\"wl wl-kjv\" data-code=\"H5216\">light</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">alway</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> me in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> which I have <span class=\"wl wl-kjv\" data-code=\"H977\">chosen</span> me to <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> my <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> there.","37":"And I will <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> thee, and thou shalt <span class=\"wl wl-kjv\" data-code=\"H4427\">reign</span> according to all that thy <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> <span class=\"wl wl-kjv\" data-code=\"H183\">desireth,</span> and shalt be <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> over <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","38":"And it shall be, if thou wilt <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> unto all that I <span class=\"wl wl-kjv\" data-code=\"H6680\">command</span> thee, and wilt <span class=\"wl wl-kjv\" data-code=\"H1980\">walk</span> in my <span class=\"wl wl-kjv\" data-code=\"H1870\">ways,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> that is <span class=\"wl wl-kjv\" data-code=\"H3477\">right</span> in my <span class=\"wl wl-kjv\" data-code=\"H5869\">sight,</span> to <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> my <span class=\"wl wl-kjv\" data-code=\"H2708\">statutes</span> and my <span class=\"wl wl-kjv\" data-code=\"H4687\">commandments,</span> as <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> my <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did;</span> that I will be with thee, and <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> thee a <span class=\"wl wl-kjv\" data-code=\"H539\">sure</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> as I <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> for <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> and will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> unto thee.","39":"And I will for this <span class=\"wl wl-kjv\" data-code=\"H6031\">afflict</span> the <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> but not for <span class=\"wl wl-kjv\" data-code=\"H3117\">ever.</span>","40":"<span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H1245\">sought</span> therefore to <span class=\"wl wl-kjv\" data-code=\"H4191\">kill</span> <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam.</span> And <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and <span class=\"wl wl-kjv\" data-code=\"H1272\">fled</span> into <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> unto <span class=\"wl wl-kjv\" data-code=\"H7895\">Shishak</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and was in <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> until the <span class=\"wl wl-kjv\" data-code=\"H4194\">death</span> of <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon.</span>","41":"And the <span class=\"wl wl-kjv\" data-code=\"H3499\">rest</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">acts</span> of <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon,</span> and all that he <span class=\"wl wl-kjv\" data-code=\"H6213\">did,</span> and his <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom,</span> are they not <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in the <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">acts</span> of <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon?</span>","42":"And the <span class=\"wl wl-kjv\" data-code=\"H3117\">time</span> that <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> over all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> was <span class=\"wl wl-kjv\" data-code=\"H705\">forty</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years.</span>","43":"And <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H7901\">slept</span> with his <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> and was <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> in the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father:</span> and <span class=\"wl wl-kjv\" data-code=\"H7346\">Rehoboam</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> in his stead."}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen bij dit vers.</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
</html>
