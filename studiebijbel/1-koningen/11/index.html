ren.","Richt 9:23":"zond God een boze geest tussen Abimelech en de burgers van Sichem; en de burgers van Sichem handelden trouweloos tegen Abimelech;","Ps 25:6":"Zain. Gedenk, HEERE! Uw barmhartigheden en Uw blijken van goedertierenheid, want die zijn er van eeuwigheid.","Jes 9:16":"Daarom zal de Heere Zich niet verblijden over hun jongelingen, en over hun wezen en hun weduwen zal Hij Zich niet ontfermen, want zij zijn allen samen huichelaars en boosdoeners, en elke mond spreekt dwaasheid. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.","Deut 1:1":"Dit zijn de woorden die Mozes tot heel Israël gesproken heeft, aan deze kant van de Jordaan, in de woestijn, op het vlakke veld tegenover Suf, tussen Paran en Tofel, en Laban, en Hazeroth, en Dizahab.","Ps 112:3":"He. In zijn huis zullen bezit en rijkdom zijn; Vau. en zijn gerechtigheid houdt stand tot in eeuwigheid.","Jona 4:2":"En hij bad tot de HEERE, en zei: Och HEERE! Was dit niet mijn woord, toen ik nog in mijn land was? Daarom kwam ik het voor, door naar Tarsis te vluchten; want ik wist dat U een genadig en barmhartig God bent, geduldig en groot van goedertierenheid, en berouw hebbend over het kwaad.","1 Kon 6:12":"Aangaande dit huis, dat u bouwt: als u wandelt in Mijn inzettingen, en Mijn rechten doet, en al Mijn geboden onderhoudt door erin te wandelen, dan zal Ik Mijn woord met u bevestigen, dat Ik tot uw vader David gesproken heb;","Dan 11:31":"En er zullen legers uit hem ontstaan, en zij zullen het heiligdom ontheiligen, en de sterkte, en zij zullen het voortdurende offer wegnemen, en een verwoestende gruwel opstellen.","1 Kon 13:1-10":"En zie, een man van God kwam uit Juda, door het woord van de HEERE, naar Beth-el; en Jerobeam stond bij het altaar om te roken. En hij riep tegen het altaar, door het woord van de HEERE, en zei: Altaar, altaar, zo zegt de HEERE: Zie, er zal aan het huis van David een zoon geboren worden, wiens naam Josia zal zijn; die zal op u de priesters van de hoogten offeren, die op u roken, en men zal mensenbeenderen op u verbranden. En hij gaf op dezelfde dag een wonderteken, en zei: Dit is het wonderteken waarvan de HEERE gesproken heeft: Zie, het altaar zal vaneen scheuren, en de as die erop ligt, zal eraf gestort worden.","2 Kon 23:26":"Toch keerde de HEERE Zich niet af van de brand van Zijn grote toorn, waarmee Zijn toorn tegen Juda ontbrand was, om alle tergingen waarmee Manasse Hem getergd had.","Deut 15:5":"Als u alleen maar de stem van de HEERE, uw God, vlijtig gehoorzaamt, zodat u erop let te doen al deze geboden die ik u vandaag gebied.","Jes 45:5":"Ik ben de HEERE, en niemand meer, buiten Mij is er geen God; Ik zal u gorden, hoewel u Mij niet kent.","Jak 1:17":"Elke goede gave en elk volmaakt geschenk is van boven, afkomstig van de Vader der lichten, bij Wie geen verandering is, of schaduw van omkering.","Jer 21:6":"En Ik zal de inwoners van deze stad slaan, zowel de mensen als de dieren; door een grote pest zullen zij sterven.","Spr 28:13":"Wie zijn overtredingen bedekt, zal geen voorspoed hebben; maar wie ze belijdt en laat, zal barmhartigheid ontvangen.","Deut 6:14":"U zult andere goden niet navolgen, van de goden van de volken, die rondom u zijn.","Ef 5:6":"Laat niemand u verleiden met loze woorden; want om deze dingen komt de toorn van God over de kinderen van de ongehoorzaamheid.","2 Kon 22:19":"Omdat uw hart week geworden is, en u zich voor het aangezicht van de HEERE vernederd hebt, toen u hoorde wat Ik gesproken heb tegen deze plaats en haar inwoners, dat zij tot een verwoesting en vloek zullen worden, en dat u uw kleren gescheurd en voor Mijn aangezicht geweend hebt; zo heb Ik u ook verhoord, spreekt de HEERE.","2 Kon 13:23":"Doch de HEERE was hun genadig, en ontfermde Zich over hen, en wendde Zich tot hen, omwille van Zijn verbond met Abraham, Izak en Jakob; en Hij wilde hen niet verderven, en heeft hen niet verworpen van Zijn aangezicht, tot nu toe.","Jer 23:6":"In Zijn dagen zal Juda verlost worden, en Israël zal zeker wonen; en dit zal Zijn naam zijn, waarmee men Hem zal noemen: De Heere: ONZE GERECHTIGHEID.","Spr 14:19":"De kwaden buigen neer voor de goeden, en de goddelozen voor de poorten van de rechtvaardige.","1 Kon 9:10":"En het gebeurde aan het einde van twintig jaren, waarin Salomo die twee huizen gebouwd had, het huis van de HEERE en het huis van de koning;","Hand 7:10":"en verloste hem uit al zijn verdrukkingen, en gaf hem genade en wijsheid voor Farao, de koning van Egypteland; en hij stelde hem aan als leider over Egypte en zijn hele huis.","Num 11:10":"Toen hoorde Mozes het volk wenen door hun huisgezinnen, ieder aan de deur van zijn tent; en de toorn van de HEERE ontstak zeer; ook was dat kwaad in de ogen van Mozes.","2 Kron 36:22":"Maar in het eerste jaar van Kores, koning van Perzië, opdat het woord van de HEERE volbracht werd, door de mond van Jeremia, wekte de HEERE de geest op van Kores, koning van Perzië, zodat hij een stem liet doorgaan door zijn hele koninkrijk, ook zelfs op schrift, en hij zei:","Jona 4:11":"En zou Ik dan die grote stad Ninevé niet ontzien? Daarin wonen meer dan honderdtwintigduizend mensen, die geen onderscheid weten te maken tussen hun rechterhand en hun linkerhand; en bovendien nog veel vee?","2 Sam 10:8":"En de kinderen Ammons trokken uit, en stelden de slagorde op voor de ingang van de poort; maar de Syriërs van Zoba, en Rechob, en de mannen van Tob en Maächa waren afzonderlijk in het veld.","Ezech 21:26":"Zo zegt de Heere HEERE: Doe die hoed weg, en neem die kroon af; deze zal niet dezelfde blijven; Ik zal verhogen wie nederig is, en vernederen wie hoog is.","Zach 10:6":"En Ik zal het huis van Juda versterken, en het huis van Jozef zal Ik behouden, en Ik zal hen weer terugzetten; want Ik heb Mij over hen ontfermd, en zij zullen zijn alsof Ik hen niet verstoten had; want Ik ben de HEERE, hun God, en Ik zal hen verhoren.","Jer 33:16":"In die dagen zal Juda verlost worden, en Jeruzalem zal veilig wonen; en dit is de naam waarmee zij genoemd zal worden: De Heere, ONZE GERECHTIGHEID.","Num 23:1-30":"Toen zei Bileam tegen Balak: Bouw hier zeven altaren voor mij, en maak hier zeven stieren en zeven rammen voor mij klaar. Balak deed wat Bileam had gezegd; en Balak en Bileam offerden een stier en een ram op elk altaar. Toen zei Bileam tegen Balak: Blijf bij uw brandoffer staan, en ik zal weggaan; misschien zal de HEERE mij tegemoetkomen; en wat Hij mij laat zien, dat zal ik u bekendmaken. Toen ging hij naar de hoogte.","Joh 1:7-9":"Deze kwam tot een getuigenis, om van het Licht te getuigen, opdat zij allen door hem geloven zouden. Hij was het Licht niet, maar was gezonden, opdat hij van het Licht getuigen zou. Dit was het waarachtige Licht, Dat ieder mens verlicht die in de wereld komt.","Ps 130:8":"En Hij zal Israël verlossen van al zijn ongerechtigheden.","Hand 5:39":"maar als het uit God is, dan kunt u dat niet breken; anders zou u misschien bevonden worden ook tegen God te strijden.","2 Kon 22:20":"Daarom zie, Ik zal u verzamelen bij uw vaderen, en u zult in vrede in uw graf verzameld worden, en uw ogen zullen al het kwaad niet zien dat Ik over deze plaats brengen zal. En zij brachten de koning het antwoord terug.","2 Kon 13:3":"Daarom ontstak de toorn van de HEERE tegen Israël; en Hij gaf hen in de hand van Hazaël, de koning van Syrië, en in de hand van Benhadad, de zoon van Hazaël, al die dagen.","Gen 18:29":"En hij ging voort tot Hem te spreken, en zei: Misschien zullen daar veertig gevonden worden! En Hij zei: Ik zal het niet doen omwille van de veertig.","Matt 22:7":"Toen de koning dat hoorde, werd hij toornig, en hij stuurde zijn legers en heeft die moordenaars omgebracht en hun stad in brand gestoken.","Gen 39:1-6":"Jozef werd naar Egypte afgevoerd; en Potifar, een hoveling van de farao, een aanvoerder van de lijfwacht, een Egyptisch man, kocht hem van de Ismaëlieten, die hem daarheen afgevoerd hadden. En de HEERE was met Jozef, zodat hij een voorspoedig man was; en hij was in het huis van zijn heer, de Egyptenaar. Toen zijn heer zag dat de HEERE met hem was, en dat de HEERE alles wat hij deed door zijn hand voorspoedig maakte,","Jes 5:25":"Daarom is de toorn van de HEERE ontstoken tegen Zijn volk, en heeft Hij Zijn hand tegen hen uitgestrekt, en heeft Hij hen geslagen, zodat de bergen hebben gebeefd, en hun dode lichamen zijn geworden als vuil in het midden van de straten. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.","Gen 47:5":"Toen sprak Farao tegen Jozef en zei: Uw vader en uw broers zijn tot u gekomen;","Gen 34:30":"Toen zei Jakob tegen Simeon en tegen Levi: U hebt mij in het ongeluk gestort, doordat u mij stinkend maakt onder de inwoners van dit land, onder de Kanaänieten en onder de Ferezieten; en ik heb weinig volk in aantal; als zij zich tegen mij verzamelen, zullen zij mij verslaan, en ik zal vernietigd worden, ik en mijn huis.","Ezech 5:13":"Zo zal Mijn toorn volbracht worden, en Ik zal Mijn grimmigheid op hen laten rusten, en Mij troosten; en zij zullen weten dat Ik, de HEERE, in Mijn ijver gesproken heb, als Ik Mijn grimmigheid tegen hen volbracht zal hebben.","2 Kon 20:17":"Zie, de dagen komen dat alles wat in uw huis is, en wat uw vaderen tot op deze dag opgeslagen hebben, naar Babel weggevoerd zal worden; er zal niets overblijven, zegt de HEERE.","Jes 22:9":"En u zult de scheuren van de stad van David bekijken, omdat ze veel zijn; en u zult het water van de onderste vijver verzamelen.","Ezra 5:17":"Als het de koning dan nu goeddunkt, laat er gezocht worden in het schathuis van de koning daar, dat te Babel is, of het zo is dat een bevel van de koning Kores gegeven is om dit huis van God te Jeruzalem te bouwen; en dat men ons het believen van de koning hierover laat weten.","Ps 18:51":"Die de verlossingen van Zijn koning groot maakt, en goedertierenheid doet aan Zijn gezalfde, aan David en aan zijn nageslacht tot in eeuwigheid.","Spr 22:29":"Hebt u een man gezien die vaardig is in zijn werk? Hij zal voor koningen komen te staan; hij zal niet voor onaanzienlijke mensen staan.","1 Kon 12:15-17":"Zo hoorde de koning niet naar het volk; want deze ommekeer kwam van de HEERE, opdat Hij Zijn woord zou bevestigen, dat de HEERE door de dienst van Ahia, de Siloniet, gesproken had tot Jerobeam, de zoon van Nebat. Toen heel Israël zag dat de koning niet naar hen hoorde, gaf het volk de koning antwoord terug en zei: Wat deel hebben wij aan David? Ja, wij hebben geen erfdeel aan de zoon van Isaï; naar uw tenten, o Israël! Zie nu naar uw eigen huis om, o David! Zo ging Israël naar zijn tenten. Doch wat betreft de kinderen van Israël die in de steden van Juda woonden, over hen regeerde Rehabeam ook.","Ps 103:8":"Barmhartig en genadig is de HEERE, geduldig en groot van goedertierenheid.","Ex 33:19":"Doch Hij zei: Ik zal al Mijn goedheid voorbij uw aangezicht laten gaan, en zal de Naam van de HEERE uitroepen voor uw aangezicht; maar Ik zal genadig zijn aan wie Ik genadig zal zijn, en Ik zal Mij ontfermen over wie Ik Mij ontfermen zal.","Joël 2:18":"Zo zal de HEERE ijveren over Zijn land, en Hij zal Zijn volk verschonen.","Pred 3:1":"Alles heeft een vastgestelde tijd, en alle voornemen onder de hemel heeft zijn tijd.","Neh 13:26":"Heeft Salomo, de koning van Israël, daarin niet gezondigd, hoewel er onder veel heidenvolken geen koning was zoals hij, en hij door zijn God bemind was, en God hem tot koning over heel Israël gesteld had? Ook hem lieten de vreemde vrouwen zondigen.","1 Kon 11:23-25":"Ook verwekte God tegen hem een tegenstander, Rezon, de zoon van Eljada, die gevlucht was van zijn heer Hadad-ezer, de koning van Zoba, tegen wie hij ook mannen verzameld had, en hij werd aanvoerder van een bende, toen David hen doodde; en zij trokken naar Damascus, woonden daar en regeerden in Damascus. En hij was Israëls tegenstander al de dagen van Salomo, naast het kwaad dat Hadad deed; want hij had een afkeer van Israël, en hij regeerde over Syrië.","Jes 8:9":"Verzamel u samen, volken! Toch zult u verbroken worden; en neem het ter ore, allen die in verre landen bent, omgord u, toch zult u verbroken worden; omgord u, toch zult u verbroken worden!","Hebr 4:16":"Laat ons dan met vrijmoedigheid toegaan tot de troon van de genade, opdat wij barmhartigheid mogen verkrijgen en genade vinden om geholpen te worden op de tijd dat wij het nodig hebben.","Ps 89:50":"Heere! waar zijn Uw vorige blijken van goedertierenheid, die Gij David gezworen hebt bij Uw trouw?","1 Tim 1:13":"Ik was voorheen een godslasteraar, en een vervolger, en een geweldenaar; maar mij is barmhartigheid overkomen, omdat ik het onwetend gedaan heb in mijn ongeloof.","Jer 4:27":"Want zo zegt de HEERE: Dit hele land zal een woestijn zijn (toch zal Ik geen volledig einde maken);","Jes 44:19":"En niemand van hen brengt het in zijn hart, en er is geen kennis en geen verstand, zodat hij zou zeggen: De helft daarvan heb ik verbrand in het vuur, ja, ook op de kolen daarvan heb ik brood gebakken, ik heb vlees daarbij gebraden, en heb het gegeten; en zou ik het overblijfsel daarvan tot een gruwel maken, zou ik neerknielen voor iets dat van een boom gekomen is?","Ezech 39:11-14":"En op die dag zal het gebeuren dat Ik aan Gog daar een graf zal geven in Israël, het dal van de doorgangers ten oosten van de zee; en dat zal de doorgangers de neus stoppen; en daar zullen zij Gog begraven en zijn hele menigte, en zij zullen het noemen: Het dal van Gogs menigte. Het huis van Israël nu zal hen begraven, om het land te reinigen, zeven maanden lang. Ja, heel het volk van het land zal begraven, en het zal hun tot een naam zijn, op de dag dat Ik verheerlijkt zal zijn, spreekt de Heere HEERE.","1 Kon 5:4":"Maar nu heeft de HEERE, mijn God, mij van rondom rust gegeven; er is geen tegenstander, en geen tegenslag van kwaad.","Ex 22:24":"en Mijn toorn zal ontbranden, en Ik zal u met het zwaard doden; en uw vrouwen zullen weduwen worden, en uw kinderen wezen.","Jes 65:8":"Zo zegt de HEERE: Zoals wanneer men most in een tros druiven vindt, men zegt: Verderf ze niet, want er is een zegen in; zo zal Ik het om Mijn knechten doen, dat Ik hen niet allen verderf.","Num 25:4":"En de HEERE zei tot Mozes: Neem alle hoofden van het volk, en hang hen op voor de HEERE tegen de zon, zo zal de gloed van de toorn van de HEERE gekeerd worden van Israël.","Richt 3:7":"En de kinderen van Israël deden wat kwaad was in de ogen van de HEERE, en vergaten de HEERE, hun God, en zij dienden de Baäls en de gewijde palen.","Jer 33:15":"In die dagen, en te dien tijde zal Ik David een SPRUIT van gerechtigheid doen opkomen; en Hij zal recht en gerechtigheid doen op aarde.","Ezech 14:20":"Ofschoon Noach, Daniël en Job in het midden daarvan waren, zo waarachtig als Ik leef, spreekt de Heere HEERE, als zij een zoon of een dochter zouden willen bevrijden, zouden zij alleen hun eigen ziel door hun gerechtigheid bevrijden.","1 Petr 5:10":"En de God van alle genade, Die ons geroepen heeft tot Zijn eeuwige heerlijkheid in Christus Jezus, nadat u een tijdlang geleden zult hebben, Hij zal u volmaken, bevestigen, versterken en funderen.","Hos 4:17":"Efraïm is met de afgoden verbonden; laat hem begaan.","1 Kon 14:8":"en het koninkrijk van het huis van David weggescheurd heb, en dat aan u gegeven heb, en u niet geweest bent zoals Mijn dienaar David, die Mijn geboden hield, en Mij met heel zijn hart navolgde, om alleen te doen wat recht is in Mijn ogen;","Joz 23:16":"Wanneer u het verbond van de HEERE, uw God, overtreedt, dat Hij u geboden heeft, en u heengaat en dient andere goden, en u voor hen neerbuigt, zo zal de toorn van de HEERE over u ontsteken, en u zult haastig omkomen van het goede land, dat Hij u gegeven heeft.","Richt 2:12":"En zij verlieten de HEERE, de God van hun vaderen, Die hen uit Egypteland had uitgeleid, en volgden andere goden na, van de goden van de volken die rondom hen waren, en bogen zich voor die neer, en zij verwekten de HEERE tot toorn.","Jes 1:5":"Waartoe zou u nog meer geslagen worden? U zou van het afval des te meer maken; het hele hoofd is ziek, en het hele hart is mat.","Rom 1:32":"die, hoewel zij het recht van God kennen, namelijk dat zij die zulke dingen doen de dood waard zijn, deze dingen niet alleen doen, maar ook nog instemming betonen aan hen die ze doen.","Ps 33:10":"De HEERE vernietigt de raad van de heidenen; Hij breekt de gedachten van de volken.","Richt 3:15":"Toen riepen de kinderen van Israël tot de HEERE, en de HEERE verwekte hun een verlosser, Ehud, de zoon van Gera, een zoon van Jemini, een man die links was. En de kinderen van Israël zonden door zijn hand een geschenk aan Eglon, de koning van de Moabieten.","Ps 80:2":"O Herder van Israël! Neem het ter oor, U Die Jozef als schapen leidde; U Die tussen de cherubs zit, verschijn blinkend.","1 Kon 16:31-33":"En het gebeurde (was het een lichte zaak dat hij wandelde in de zonden van Jerobeam, de zoon van Nebat?), dat hij ook nog Izebel, de dochter van Eth-baal, de koning van de Sidoniërs, tot vrouw nam, en heenging, en Baäl diende, en zich voor hem neerboog. En hij richtte voor Baäl een altaar op, in het huis van Baäl, dat hij te Samaria gebouwd had. Ook maakte Achab een gewijd bos, zodat Achab nog meer deed om de HEERE, de God van Israël, tot toorn te verwekken, dan alle koningen van Israël die voor hem geweest waren.","Jes 13:3-5":"Ik heb Mijn geheiligden bevel gegeven; ook heb Ik tot Mijn toorn geroepen Mijn helden, hen die zich verheugen in Mijn hoogheid. Er is een ruisende stem op de bergen, gelijk aan een groot volk; een stem van gedruis van de koninkrijken, van de verzamelde heidenvolken; de HEERE van de heerscharen monstert het krijgsleger. Zij komen uit een ver land, van het einde van de hemel; de HEERE en de instrumenten van Zijn gramschap, om dat hele land te verderven.","Ps 69:17":"Verhoor mij, o HEERE, want Uw goedertierenheid is goed; zie mij aan naar de grootheid van Uw barmhartigheden.","Rom 11:27":"En dit is hun een verbond van Mij, als Ik hun zonden zal wegnemen.","1 Kon 14:25":"Het gebeurde nu in het vijfde jaar van koning Rehabeam, dat Sisak, de koning van Egypte, optrok tegen Jeruzalem.","1 Kon 12:20":"En het gebeurde, toen heel Israël hoorde dat Jerobeam teruggekomen was, dat zij heen zonden en hem in de vergadering riepen, en hem over heel Israël koning maakten; niemand volgde het huis van David, dan de stam van Juda alleen.","1 Kron 18:3-9":"David sloeg ook Hadar-ezer, de koning van Zoba, naar Hamath toe, toen hij optrok om zijn macht te vestigen aan de rivier de Eufraat. En David nam hem duizend wagens af, en zevenduizend ruiters, en twintigduizend man te voet; en David sneed bij alle wagenpaarden de hezenpezen door; maar hij hield honderd wagens daarvan over. En de Syriërs van Damaskus kwamen om Hadar-ezer, de koning van Zoba, te helpen; maar David sloeg van de Syriërs tweeëntwintigduizend man.","Spr 22:25":"opdat u zijn paden niet leert, en een strik over uw ziel haalt.","Richt 9:5":"En hij kwam in het huis van zijn vader te Ofra, en doodde zijn broers, de zonen van Jerubbaäl, zeventig mannen, op één steen; maar Jotham, de jongste zoon van Jerubbaäl, bleef over, want hij had zich verstopt.","Lev 18:21":"En van uw nageslacht zult u niet geven, niet geven om voor de Molech door het vuur te doen gaan; en de Naam van uw God zult u niet ontheiligen; Ik ben de HEERE!","Nahum 1:6":"Wie zal voor Zijn gramschap staan, en wie zal bestaan voor de gloed van Zijn toorn? Zijn grimmigheid is uitgestort als vuur, en de rotsen worden door Hem verbrijzeld.","Num 25:1-3":"Israël verbleef te Sittim, en het volk begon te hoereren met de dochters van de Moabieten. En zij nodigden het volk tot de offers van hun goden; en het volk at, en boog zich neer voor hun goden. Toen Israël zich koppelde aan Baäl-peor, ontstak de toorn van de HEERE tegen Israël.","Openb 15:7":"En een van de vier dieren gaf de zeven engelen zeven gouden schalen, vol van de toorn van God, Die leeft in alle eeuwigheid.","Ezech 5:15":"Zo zal de smaad en hoon een lering en ontzetting zijn voor de heidenvolken die rondom u zijn, wanneer Ik over u gerichten in toorn, en in grimmigheid, en in grimmige straffen oefenen zal; Ik, de HEERE, heb het gesproken!","Gen 18:26-32":"Toen zei de HEERE: Als Ik in Sodom, binnen de stad, vijftig rechtvaardigen zal vinden, dan zal Ik de hele plaats sparen omwille van hen. En Abraham antwoordde en zei: Zie toch, ik heb het aangedurfd te spreken tot de Heere, hoewel ik stof en as ben! Misschien zullen aan de vijftig rechtvaardigen vijf ontbreken; zult U dan om vijf de hele stad verwoesten? En Hij zei: Ik zal haar niet verwoesten, als Ik er vijfenveertig zal vinden.","Neh 9:27-31":"Daarom hebt U hen gegeven in de hand van hun belagers, die hen benauwd hebben; maar toen zij in de tijd van hun benauwdheid tot U riepen, hebt U vanuit de hemel gehoord, en hun naar Uw grote barmhartigheden verlossers gegeven, die hen uit de hand van hun belagers verlosten. Maar toen zij rust hadden, keerden zij weer terug om kwaad te doen voor Uw aangezicht; toen verliet U hen in de hand van hun vijanden, zodat zij over hen heersten; en toen zij zich dan bekeerden, en U aanriepen, hebt U hen vanuit de hemel gehoord, en hebt hen naar Uw barmhartigheden vele malen uitgered. En U hebt tegen hen getuigd, om hen te doen terugkeren tot Uw wet; maar zij hebben trots gehandeld, en niet geluisterd naar Uw geboden, en tegen Uw rechten gezondigd, waardoor een mens, als hij ze doet, zal leven; en zij hebben hun schouder teruggetrokken, en hun nek verhard, en niet geluisterd.","Ezech 18:31":"Werp van u weg al uw overtredingen, waarmee u overtreden hebt, en maak u een nieuw hart en een nieuwe geest; want waarom zou u sterven, o huis van Israël?","Matt 2:14":"Hij stond dan op, nam het Kindje en Zijn moeder 's nachts tot zich, en vertrok naar Egypte;","Jes 48:9":"Om Mijn Naams wil zal Ik Mijn toorn langer uitstellen, en om het roem van Mij wil zal Ik, u ten goede, Mij bedwingen, opdat Ik u niet afhouw.","Matt 6:14":"Want als u de mensen hun misdaden vergeeft, zal uw hemelse Vader ook u vergeven.","1 Sam 17:12":"David nu was de zoon van de Efrathitische man uit Bethlehem-Juda, wiens naam Isaï was, en die acht zonen had, en in de dagen van Saul was hij een man, oud, hoogbejaard onder de mannen.","1 Kon 12:15":"Zo hoorde de koning niet naar het volk; want deze ommekeer kwam van de HEERE, opdat Hij Zijn woord zou bevestigen, dat de HEERE door de dienst van Ahia, de Siloniet, gesproken had tot Jerobeam, de zoon van Nebat.","1 Kon 11:4-40":"Want het gebeurde in de tijd van Salomo's ouderdom, dat zijn vrouwen zijn hart deden neigen naar andere goden; zodat zijn hart niet volkomen was met de HEERE, zijn God, zoals het hart van zijn vader David. Want Salomo volgde Astoreth na, de god van de Sidoniërs, en Milchom, het verfoeisel van de Ammonieten. Zo deed Salomo wat kwaad was in de ogen van de HEERE; en hij volhardde niet in het volgen van de HEERE, zoals zijn vader David.","1 Kron 17:11-14":"En het zal gebeuren, als uw dagen vervuld zijn, dat u heengaat tot uw vaderen, dat Ik dan uw nageslacht na u zal doen opstaan, dat uit uw zonen zijn zal, en Ik zal zijn koninkrijk bevestigen. Die zal Mij een huis bouwen, en Ik zal zijn troon bevestigen tot in eeuwigheid. Ik zal hem tot een Vader zijn, en hij zal Mij tot een zoon zijn; en Mijn goedertierenheid zal Ik niet van hem wenden, zoals Ik die weggenomen heb van hem die vóór u geweest is;","1 Kon 6:13":"En Ik zal in het midden van de kinderen van Israël wonen; en Ik zal Mijn volk Israël niet verlaten.","1 Kron 18:12":"Ook sloeg Abisaï, de zoon van Zeruja, de Edomieten in het Zoutdal, achttienduizend man.","Ps 76:11":"Want de grimmigheid van de mens zal U loffelijk maken; het overblijfsel van de grimmigheden zult U opbinden.","Num 16:48":"En hij stond tussen de doden en tussen de levenden; zo werd de plaag tot stilstand gebracht.","Jes 37:35":"Want Ik zal deze stad beschermen om die te verlossen, omwille van Mijzelf, en omwille van David, Mijn knecht.","Hand 7:9":"En de aartsvaders, jaloers geworden, verkochten Jozef om naar Egypte gebracht te worden; maar God was met hem,","2 Kon 23:27":"En de HEERE zei: Ik zal Juda ook van Mijn aangezicht wegdoen, zoals Ik Israël weggedaan heb; en Ik zal deze stad Jeruzalem verwerpen, die Ik verkoren heb, en het huis waarvan Ik gezegd heb: Mijn Naam zal daar zijn.","1 Kon 20:34":"En hij zei tegen hem: De steden, die mijn vader van uw vader genomen heeft, zal ik teruggeven, en maak u straten in Damaskus, zoals mijn vader in Samaria gemaakt heeft. En ik, antwoordde Achab, zal u met dit verbond dan laten gaan. Zo sloot hij een verbond met hem, en liet hem gaan.","2 Kron 12:2-9":"Daarom gebeurde het, in het vijfde jaar van koning Rehabeam, dat Sisak, de koning van Egypte, tegen Jeruzalem optrok (want zij hadden tegen de HEERE overtreden), met duizend tweehonderd wagens, en met zestigduizend ruiters; en van het volk dat met hem uit Egypte kwam was geen getal: Libiërs, Sukkieten en Cusjieten. En hij nam de vestingsteden in die Juda had, en hij kwam tot bij Jeruzalem toe.","Dan 9:4":"Ik bad dan tot de HEERE, mijn God, en deed belijdenis, en zei: Och Heere! U grote en ontzagwekkende God, Die het verbond en de goedertierenheid houdt voor hen die Hem liefhebben en Zijn geboden houden.","Num 32:10":"Toen ontstak de toorn van de HEERE op die dag, en Hij zwoer en zei:","Matt 11:30":"Want Mijn juk is zacht, en Mijn last is licht.","Jer 3:22":"Keer terug, afkerige kinderen! Ik zal uw afkeringen genezen. Zie, hier zijn wij, wij komen tot U, want U bent de HEERE, onze God!","Pred 3:10":"Ik heb de bezigheid gezien, die God aan de kinderen van de mensen gegeven heeft, om zichzelf daarmee te bekommeren.","2 Sam 8:3":"David sloeg ook Hadad-Ezer, de zoon van Rechob, de koning van Zoba, toen hij op weg ging om zijn macht te herstellen tot aan de rivier Frath.","Num 24:18":"En Edom zal een erfelijk bezit zijn; en Seir zal voor zijn vijanden een erfelijk bezit zijn; doch Israël zal met kracht handelen.","Lev 18:18":"U zult ook geen vrouw tot haar zuster nemen, om haar te benauwen, en zo haar schaamte naast haar, tijdens haar leven, te ontdekken.","Openb 21:10":"En hij voerde mij weg in de geest op een grote en hoge berg, en hij toonde mij de grote stad, het heilige Jeruzalem, neerdalend uit de hemel van God.","Jer 32:39":"En Ik zal hun één hart en één weg geven, om Mij te vrezen alle dagen, hun ten goede, alsook hun kinderen na hen.","Ps 132:14":"Dit is Mijn rust tot in eeuwigheid, hier zal Ik wonen, want Ik heb het begeerd.","Lev 20:2-5":"U zult ook tegen de kinderen van Israël zeggen: Ieder van de kinderen van Israël, of van de vreemdelingen die als vreemdeling in Israël wonen, die van zijn nageslacht aan de Molech geeft, zal zeker gedood worden; het volk van het land zal hem met stenen stenigen. En Ik zal Mijn aangezicht tegen die man richten, en zal hem uit het midden van zijn volk uitroeien; want hij heeft van zijn nageslacht aan de Molech gegeven, om Mijn heiligdom te verontreinigen en Mijn heilige Naam te ontheiligen. En als het volk van het land hun ogen op enige manier verbergen zal voor die man, wanneer hij van zijn nageslacht aan de Molech geeft, zodat het hem niet doodt,","Jer 2:13":"Want Mijn volk heeft twee boosheden gedaan; Mij, de Springader van het levende water, hebben zij verlaten, om zichzelf bakken uit te houwen, gebroken bakken, die geen water houden.","Hos 2:13-22":"Daarom, zie, Ik zal haar lokken, en haar leiden in de woestijn; en Ik zal naar haar hart spreken. En Ik zal haar haar wijngaarden geven van daaraf, en het dal Achor, tot een deur van hoop; en daar zal zij zingen, als in de dagen van haar jeugd, en als op de dag dat zij optrok uit Egypteland. En het zal op die dag gebeuren, spreekt de Heere, dat u Mij zult noemen: Mijn Man; en Mij niet meer zult noemen: Mijn Baäl!","Ps 130:7":"Israël, hoop op de HEERE; want bij de HEERE is goedertierenheid, en bij Hem is veel verlossing.","Gen 4:8":"En Kaïn sprak met zijn broeder Abel; en het gebeurde, toen zij op het veld waren, dat Kaïn tegen zijn broeder Abel opstond en hem doodsloeg.","Pred 7:28":"Waar mijn ziel nog naar zoekt, maar ik heb haar niet gevonden: één man uit duizend heb ik gevonden; maar een vrouw onder die allen heb ik niet gevonden.","Spr 6:24":"om u te bewaren voor de slechte vrouw, voor het gevlei van de tong van de vreemde vrouw.","Jer 2:10-13":"Want ga over naar de eilanden van de Chittiërs, en zie toe, en zend naar Kedar, en let er goed op; en zie, of zoiets is gebeurd? Heeft ook een volk de goden veranderd, hoewel die geen goden zijn? Toch heeft Mijn volk zijn Eer veranderd in iets dat geen nut doet. Ontzet u hierover, hemelen, en wees verschrikt, word zeer woest, spreekt de HEERE.","Deut 14:26":"En geef dat geld voor alles wat uw ziel verlangt, voor runderen en voor schapen, en voor wijn, en voor sterke drank, en voor alles wat uw ziel van u begeren zal, en eet daar voor het aangezicht van de HEERE, uw God, en wees vrolijk, u en uw huis.","Gen 17:8":"En Ik zal u en uw nageslacht na u het land waar u als vreemdeling verblijft geven, het hele land Kanaän, tot eeuwig eigendom; en Ik zal hun tot een God zijn.","Ps 102:29":"De kinderen van Uw knechten zullen wonen, en hun nageslacht zal voor Uw aangezicht bevestigd worden.","Jes 58:8":"Dan zal uw licht voortbreken als de dageraad, en uw genezing zal snel uitspruiten; en uw gerechtigheid zal voor uw aangezicht heengaan, en de heerlijkheid van de HEERE zal uw achterhoede zijn.","Num 16:21":"Scheid u af uit het midden van deze vergadering, en Ik zal hen in een ogenblik verteren!","Jes 48:15":"Ik, Ik heb het gesproken, ook heb Ik hem geroepen; Ik zal hem doen komen, en hij zal voorspoedig zijn op zijn weg.","2 Kon 14:27":"En de HEERE had niet gesproken dat Hij de naam van Israël van onder de hemel zou uitwissen; maar Hij verloste hen door de hand van Jerobeam, de zoon van Joas.","Zef 1:5":"En hen die zich neerbuigen op de daken voor het leger van de hemel, en hen die zich neerbuigend zweren bij de HEERE, en zweren bij Malcham;","Deut 4:31":"Want de HEERE, uw God, is een barmhartig God; Hij zal u niet verlaten, en u niet te gronde richten; en Hij zal het verbond van uw vaderen, dat Hij hun gezworen heeft, niet vergeten.","Ps 31:8":"Ik zal mij verheugen en verblijden in Uw goedertierenheid, omdat U mijn ellende hebt aangezien, en mijn ziel in benauwdheden gekend hebt;","1 Kor 15:33":"Dwaal niet. Slechte omgang bederft goede zeden.","2 Kon 17:18":"Daarom werd de HEERE zeer toornig op Israël, zodat Hij hen wegdeed van Zijn aangezicht; er bleef niets over, behalve de stam van Juda alleen.","Jer 44:6":"Daarom is Mijn grimmigheid en Mijn toorn uitgestort, en heeft gebrand in de steden van Juda en in de straten van Jeruzalem; zodat ze tot eenzaamheid en tot verwoesting geworden zijn, zoals het is op deze dag.","Openb 19:15":"En uit Zijn mond ging een scherp zwaard, opdat Hij daarmee de heidenen slaan zou. En Hij zal hen hoeden met een ijzeren staf; en Hij treedt de wijnpersbak van de wijn van de toorn en van de gramschap van de Almachtige God.","Ezra 9:2":"Want zij hebben van hun dochters genomen voor zichzelf en voor hun zonen, zodat het heilig zaad zich vermengd heeft met de volken van deze landen; ja, de hand van de vorsten en overheden is de eerste geweest in deze overtreding.","1 Sam 12:10":"En zij riepen tot de HEERE, en zeiden: Wij hebben gezondigd, omdat wij de HEERE verlaten hebben, en de Baäls en Astharoths gediend hebben; en nu, red ons uit de hand van onze vijanden, en wij zullen U dienen.","Hand 26:18":"Om hun ogen te openen en hen te bekeren van de duisternis tot het licht, en van de macht van de satan tot God; opdat zij vergeving van de zonden ontvangen, en een erfdeel onder de geheiligden, door het geloof in Mij.","Dan 4:22-27":"Dat bent u, o koning, die groot en sterk bent geworden; want uw grootheid is zo toegenomen, dat zij reikt aan de hemel, en uw heerschappij aan het einde van het aardrijk. Dat nu de koning een wachter, namelijk een heilige, gezien heeft, uit de hemel neerkomend, die zei: Houwt deze boom om, en verderf hem; maar laat de stronk met zijn wortels in de aarde, en met een ijzeren en koperen band in het tedere gras van het veld, en in de dauw van de hemel nat gemaakt worden, en dat zijn deel zij met het gedierte van het veld, totdat er zeven tijden over hem voorbijgaan; Dit is de uitleg, o koning, en dit is een besluit van de Allerhoogste, dat over mijn heer de koning komen zal:","Matt 18:11-14":"Want de Zoon des mensen is gekomen om dat wat verloren was, zalig te maken. Wat denkt u? Als iemand honderd schapen had en één daarvan zou afdwalen, zal hij niet de negenennegentig achterlaten en de bergen op gaan om het afgedwaalde te zoeken? En als het gebeurt dat hij het vindt, voorwaar, Ik zeg u, dat hij zich meer verblijdt over dat schaap dan over de negenennegentig die niet afgedwaald zijn.","Hebr 3:11":"Zo heb Ik dan gezworen in Mijn toorn: Zij zullen Mijn rust niet binnengaan!","1 Sam 9:5":"Toen zij in het land van Zuf kwamen, zei Saul tegen zijn knecht, die bij hem was: Kom, laten we teruggaan; anders houdt mijn vader misschien op met zich zorgen te maken over de ezelinnen, en maakt hij zich zorgen om ons.","Luk 1:70":"zoals Hij gesproken heeft door de mond van Zijn heilige profeten, die er van oudsher geweest zijn;","Openb 2:4":"Maar Ik heb tegen u, dat u uw eerste liefde hebt verlaten.","Jes 62:7":"En zwijg niet stil voor Hem, totdat Hij bevestigt, en totdat Hij Jeruzalem stelt tot een lof op aarde.","2 Sam 18:23":"Wat er ook gebeurt, zei hij, laat mij lopen; toen zei hij tegen hem: Loop dan. En Ahimaäz liep via de weg door de vlakte, en haalde Cuschi in.","Jer 25:38":"Hij heeft, als een jonge leeuw, Zijn hut verlaten; want hun land is geworden tot een verwoesting, vanwege de gloed van de verdrukker, ja, vanwege de gloed van Zijn toorn.","1 Kon 11:9-13":"Daarom vertoornde de HEERE Zich tegen Salomo, omdat hij zijn hart van de HEERE, de God van Israël, had afgewend, Die hem tweemaal verschenen was, en hem in deze zaak geboden had dat hij geen andere goden zou navolgen; maar hij hield niet wat de HEERE geboden had. Daarom zei de HEERE tegen Salomo: Omdat dit bij u gebeurd is, dat u Mijn verbond en Mijn inzettingen, die Ik u geboden heb, niet gehouden hebt, zal Ik dit koninkrijk zeker van u scheuren, en het aan uw dienaar geven.","1 Kon 9:3":"En de HEERE zei tegen hem: Ik heb uw gebed en uw smeking gehoord, die u voor Mijn aangezicht smekend gedaan hebt; Ik heb dit huis geheiligd, dat u gebouwd hebt, om Mijn Naam daar tot in eeuwigheid te vestigen; en Mijn ogen en Mijn hart zullen daar alle dagen zijn.","1 Kon 3:1":"En Salomo verzwagerde zich met Farao, de koning van Egypte; hij nam de dochter van Farao en bracht haar naar de stad van David, totdat hij klaar zou zijn met het bouwen van zijn huis en het huis van de HEERE, en de muur van Jeruzalem rondom.","2 Kron 34:2":"En hij deed wat recht was in de ogen van de HEERE, en wandelde in de wegen van zijn vader David, en week niet af naar rechts of naar links.","Num 25:15":"En de naam van de gedode Midianietische vrouw was Kozbi, een dochter van Zur, die een hoofd was van de volken van een vaderlijk huis onder de Midianieten.","Ps 76:8":"U, vreselijk bent U; en wie zal voor Uw aangezicht bestaan, vanaf het moment van uw toorn?","Klaagl 2:6":"Vau. En Hij heeft Zijn hut met geweld afgerukt, als een hof, Hij heeft Zijn vergaderplaats verdorven; de HEERE heeft in Sion doen vergeten het hoogtijd en de sabbat, en Hij heeft in de gramschap van Zijn toorn de koning en de priester smadelijk verworpen.","Jes 10:5-7":"Wee de Assyriër, die de roede van Mijn toorn is, en Mijn grimmigheid is een stok in hun hand! Ik zal hem zenden tegen een huichelachtig volk, en Ik zal hem bevel geven tegen het volk van Mijn verbolgenheid; opdat hij de roof rooft, en plundert de plundering, en het stelt ter vertreding, als het slijk van de straten. Hoewel hij het zo niet meent, en zijn hart zo niet denkt, maar hij zal in zijn hart hebben te verdelgen, en niet weinige volken uit te roeien.","Jes 14:25":"Dat Ik Assur in Mijn land zal verbreken, en hem op Mijn bergen vertreden; opdat zijn juk van hen afwijkt, en zijn last van hun schouder wijkt.","Num 24:19":"En er zal iemand uit Jakob heersen, en hij zal de overigen uit de steden ombrengen.","Num 11:33":"Dat vlees was nog tussen hun tanden, voordat het gekauwd was, toen ontstak de toorn van de HEERE tegen het volk, en de HEERE sloeg het volk met een zeer grote plaag.","Hebr 12:22":"Maar u bent gekomen tot de berg Sion, en de stad van de levende God, tot het hemelse Jeruzalem, en de vele duizenden engelen;","Luk 2:4":"En Jozef ging ook op van Galilea, uit de stad Nazareth, naar Judea, naar de stad van David, die Bethlehem genoemd wordt (omdat hij uit het huis en geslacht van David was),","1 Kron 21:7":"En deze zaak was kwaad in de ogen van God; daarom sloeg Hij Israël.","Joz 23:12":"Want als u enigszins afkeert, en het overige van deze volken aanhangt, van deze, die bij u overgebleven zijn, en u met hen verzwagert, en u tot hen ingaat, en zij tot u;","2 Sam 10:6":"Toen nu de kinderen Ammons zagen, dat zij zich bij David stinkend gemaakt hadden, zonden de kinderen Ammons heen, en huurden van de Syriërs van Beth-Rechob, en van de Syriërs van Zoba, twintigduizend man van het voetvolk, en van de koning van Maächa duizend man, en van de mannen van Tob twaalfduizend man.","Spr 13:22":"De goede zal zijn kindskinderen doen erven; maar het vermogen van de zondaar is voor de rechtvaardige weggelegd.","Ps 78:4-72":"Wij zullen het niet verbergen voor hun kinderen, maar het navolgende geslacht vertellen de loffelijke daden van de HEERE, en Zijn sterkheid, en Zijn wonderen, die Hij gedaan heeft. Want Hij heeft een getuigenis opgericht in Jakob, en een wet gesteld in Israël, die Hij onze vaders geboden heeft, dat zij die aan hun kinderen bekend zouden maken; Opdat het navolgende geslacht ze zou weten, de kinderen die geboren zouden worden; en zouden opstaan en ze vertellen aan hun kinderen;","Rom 10:12":"Want er is geen onderscheid tussen Jood en Griek; want eenzelfde Heere is Heere van allen, rijk over allen die Hem aanroepen.","Ef 2:4-7":"Maar God, Die rijk is in barmhartigheid door Zijn grote liefde, waarmee Hij ons liefgehad heeft, heeft ons, ook toen wij dood waren door de misdaden, levend gemaakt met Christus; (uit genade bent u zalig geworden), en heeft ons mede opgewekt, en heeft ons mede gezet in de hemel in Christus Jezus;","2 Sam 6:7":"Toen ontstak de toorn van de HEERE tegen Uza, en God sloeg hem daar, om deze onbedachtzaamheid; en hij stierf daar bij de ark van God.","Zach 3:9":"Want zie, aangaande die steen, die Ik gelegd heb voor het aangezicht van Jozua, op die ene steen zullen zeven ogen zijn; zie, Ik zal zijn graveersel graveren, spreekt de HEERE van de heerscharen, en Ik zal de ongerechtigheid van dit land op één dag wegnemen.","Gen 33:2":"En hij zette de dienstmaagden en hun kinderen vooraan; en Lea en haar kinderen daarachter; en Rachel en Jozef achteraan.","1 Kon 15:29":"Het gebeurde nu, toen hij koning werd, dat hij het gehele huis van Jerobeam sloeg; hij liet niets van Jerobeam over wat adem had, totdat hij hem verdelgd had, naar het woord van de HEERE, dat Hij gesproken had door de dienst van Zijn knecht Ahia, de Siloniet;","Jes 55:3":"Neig uw oor, en kom tot Mij, hoor en uw ziel zal leven; want Ik zal met u een eeuwig verbond maken, en u geven de zekere weldaden van David.","2 Sam 8:12":"van Syrië, en van Moab, en van de kinderen van Ammon, en van de Filistijnen, en van Amalek, en van de buit van Hadad-Ezer, de zoon van Rechob, de koning van Zoba.","1 Kon 11:4-8":"Want het gebeurde in de tijd van Salomo's ouderdom, dat zijn vrouwen zijn hart deden neigen naar andere goden; zodat zijn hart niet volkomen was met de HEERE, zijn God, zoals het hart van zijn vader David. Want Salomo volgde Astoreth na, de god van de Sidoniërs, en Milchom, het verfoeisel van de Ammonieten. Zo deed Salomo wat kwaad was in de ogen van de HEERE; en hij volhardde niet in het volgen van de HEERE, zoals zijn vader David.","Jer 36:7":"Misschien zal hun smeking voor het aangezicht van de HEERE neervallen, en zullen zij zich bekeren, ieder van zijn boze weg; want groot is de toorn en de grimmigheid die de HEERE tegen dit volk heeft uitgesproken.","Fil 2:15":"Opdat u onberispelijk en oprecht mag zijn, kinderen van God, onstraffelijk te midden van een krom en verdraaid geslacht, onder wie u schijnt als lichten in de wereld;","2 Kon 20:21":"En Hizkia ontsliep met zijn vaderen; en zijn zoon Manasse werd koning in zijn plaats.","2 Sam 19:20":"Want uw knecht weet zeer goed dat ik gezondigd heb; maar zie, ik ben vandaag gekomen, als eerste van heel het huis van Jozef, om mijn heer de koning tegemoet te gaan.","Spr 3:33":"De vloek van de HEERE is in het huis van de goddeloze; maar de woning van de rechtvaardigen zal Hij zegenen.","1 Kon 12:1-24":"En Rehabeam ging naar Sichem, want het hele Israël was naar Sichem gekomen om hem koning te maken. Het gebeurde nu, toen Jerobeam, de zoon van Nebat, dit hoorde, terwijl hij nog in Egypte was (want hij was voor het aangezicht van koning Salomo gevlucht, en Jerobeam woonde in Egypte), dat zij heen zonden en hem lieten roepen; en Jerobeam en de hele gemeente van Israël kwamen en spraken tegen Rehabeam en zeiden:","Ps 85:3":"De misdaad van Uw volk hebt U weggenomen; U hebt al hun zonden bedekt. Sela.","Openb 14:11":"En de rook van hun pijniging gaat op tot in alle eeuwigheid, en zij hebben geen rust, dag en nacht, zij die het beest aanbidden en zijn beeld, en zo iemand het merkteken van zijn naam ontvangt.","2 Kron 24:19":"Toch zond Hij profeten onder hen, om hen tot de HEERE te doen terugkeren; die waarschuwden hen, maar zij luisterden niet.","Richt 1:23":"En het huis van Jozef stuurde verspieders naar Beth-el; de naam van deze stad was voorheen Luz.","1 Kon 1:21":"Anders zal het gebeuren, als mijn heer de koning bij zijn vaderen te ruste is gegaan, dat ik en mijn zoon Salomo als zondaars beschouwd zullen worden.","2 Kon 21:9":"Maar zij luisterden niet; want Manasse deed hen dwalen, zodat zij erger deden dan de heidenvolken, die de HEERE voor de kinderen van Israël weggevaagd had.","Num 22:4":"Daarom zei Moab tegen de oudsten van Midian: Nu zal deze menigte alles om ons heen opeten, zoals de os het groen van het veld opeet. Balak, de zoon van Zippor, was in die tijd koning van de Moabieten.","1 Sam 1:22":"Doch Hanna trok niet op; maar zij zei tegen haar man: Als de jongen gespeend is, dan zal ik hem brengen, zodat hij voor het aangezicht van de HEERE verschijnt, en daar blijft tot in eeuwigheid.","Deut 5:29":"Och, dat zij zo'n hart hadden om Mij te vrezen, en al Mijn geboden alle dagen te onderhouden, opdat het hun en hun kinderen goed gaat in eeuwigheid!","Ezech 20:17":"Doch Mijn oog spaarde hen, zodat Ik hen niet verdierf, en geen einde met hen maakte in de woestijn.","Spr 22:24":"Ga geen vriendschap aan met een driftig man, en ga niet om met een zeer grimmig man;","Kol 3:6":"Om deze dingen komt de toorn van God over de kinderen van de ongehoorzaamheid.","Ps 85:4":"U hebt al Uw verbolgenheid weggenomen; U hebt U afgewend van de gloed van Uw toorn.","2 Kron 1:7-12":"In diezelfde nacht verscheen God aan Salomo; en Hij zei tegen hem: Vraag wat Ik u geven zal. En Salomo zei tegen God: U hebt aan mijn vader David grote weldadigheid gedaan; en U hebt mij koning gemaakt in zijn plaats; Nu, HEERE God, laat Uw woord waar worden, gedaan aan mijn vader David; want U hebt mij koning gemaakt over een volk, talrijk als het stof van de aarde;","Job 33:14-30":"Maar God spreekt eens of tweemaal; doch men let daar niet op. In de droom, door het gezicht 's nachts, als een diepe slaap op de mensen valt, in de sluimering op het leger; Dan openbaart Hij het voor het oor der mensen, en Hij verzegelt hun kastijding;","1 Kron 8:8":"En Saharaim verwekte kinderen in het land van Moab (nadat hij zijn vrouwen weggezonden had) uit Husim en Baara, zijn vrouwen;","2 Kron 11:4":"Zo zegt de HEERE: U zult niet optrekken, en niet strijden tegen uw broeders; ieder keert terug naar zijn huis, want deze zaak is door Mij gebeurd. En zij hoorden de woorden van de HEERE, en zij keerden terug van het optrekken tegen Jerobeam.","Luk 21:37":"Overdag was Hij lerend in de tempel; maar 's nachts ging Hij uit, en overnachtte op de berg die de Olijfberg genoemd wordt.","Luk 1:77":"om Zijn volk kennis van het heil te geven, in vergeving van hun zonden,","1 Kon 15:24":"En Asa ontsliep met zijn vaderen, en werd begraven met zijn vaderen, in de stad van zijn vader David; en zijn zoon Josafat werd koning in zijn plaats.","2 Sam 11:27":"En toen de rouw voorbij was, stuurde David iemand heen, en nam haar in zijn huis; en zij werd hem tot vrouw, en baarde hem een zoon. Doch deze daad, die David gedaan had, was kwaad in de ogen van de HEERE.","2 Kron 19:2":"En Jehu, de zoon van Hanani, de ziener, ging naar buiten, hem tegemoet, en zei tegen koning Josafat: Zou u de goddeloze helpen, en hen liefhebben die de HEERE haten? Daarom is er nu van het aangezicht van de HEERE grote toorn over u.","Zach 3:7":"Zo zegt de HEERE van de heerscharen: Als u in Mijn wegen wandelt, en als u Mijn wacht waarneemt, dan zult u ook Mijn huis richten, en ook Mijn voorhoven bewaren; en Ik zal u wandelingen geven onder dezen, die hier staan.","2 Kor 12:9":"En Hij heeft tegen mij gezegd: Mijn genade is u genoeg; want Mijn kracht wordt in zwakheid volbracht. Zo zal ik dan veel liever roemen in mijn zwakheden, opdat de kracht van Christus in mij woont.","Jer 30:11":"Want Ik ben met u, spreekt de HEERE, om u te verlossen; want Ik zal een voleinding maken met al de heidenen, waarheen Ik u verstrooid heb; maar met u zal Ik geen voleinding maken; maar Ik zal u kastijden met mate, en u niet helemaal ongestraft laten.","Job 11:6":"En u bekend maakte de verborgenheden van de wijsheid, omdat zij dubbel zijn in wezen! Weet daarom, dat God voor u minder rekent van uw ongerechtigheid dan die verdient.","Ps 139:21":"Zou ik niet haten, HEERE, wie U haten? En verdriet hebben over wie tegen U opstaan?","Luk 1:79":"om te verschijnen aan hen die gezeten zijn in duisternis en schaduw van de dood, om onze voeten te richten op de weg van de vrede.","Lev 26:44":"En hierboven is dit ook: als zij in het land van hun vijanden zullen zijn, zal Ik hen niet verwerpen, en ook niet van hen walgen, om een einde aan hen te maken en Mijn verbond met hen te vernietigen; want Ik ben de HEERE, hun God!","1 Petr 2:9":"Maar u bent een uitverkoren geslacht, een koninklijk priesterschap, een heilig volk, een volk dat God Zich verworven heeft; opdat u de deugden zou verkondigen van Hem Die u uit de duisternis geroepen heeft tot Zijn wonderbaar licht;","Deut 23:5":"Doch de HEERE, uw God, heeft niet naar Bileam willen horen; maar de HEERE, uw God, heeft de vloek voor u in een zegen veranderd, omdat de HEERE, uw God, u liefhad.","1 Kron 18:9":"Toen Thou, de koning van Hamath, hoorde dat David de hele legermacht van Hadar-ezer, de koning van Zoba, verslagen had,","Matt 1:5":"en Salmon verwekte Boaz bij Rachab, en Boaz verwekte Obed bij Ruth, en Obed verwekte Isaï;","1 Kon 14:16":"En Hij zal Israël overgeven, vanwege de zonden van Jerobeam, die gezondigd heeft, en die Israël heeft doen zondigen.","2 Sam 16:11":"Verder zei David tegen Abisai en tegen al zijn knechten: Zie, mijn zoon, die uit mijn lijf is voortgekomen, zoekt mijn leven; hoeveel te meer dan nu deze zoon van Jemini? Laat hem begaan, laat hij vloeken, want de HEERE heeft het hem gezegd.","Deut 12:11":"Dan zal er een plaats zijn die de HEERE, uw God, zal uitkiezen om Zijn Naam daar te doen wonen; daarheen zult u brengen alles wat ik u gebied: uw brandoffers, en uw slachtoffers, uw tienden, en het hefoffer van uw hand, en alle beste keuze van uw geloften, die u de HEERE beloven zult.","Openb 6:17":"Want de grote dag van Zijn toorn is gekomen, en wie kan bestaan?","2 Kor 4:15":"Want al deze dingen zijn om uw wil, opdat de vermenigvuldigde genade, door de dankzegging van velen, overvloedig wordt tot heerlijkheid van God.","Jer 32:37":"Zie, Ik zal hen verzamelen uit al de landen waarheen Ik hen verdreven zal hebben in Mijn toorn, en in Mijn grimmigheid, en in grote verbolgenheid; en Ik zal hen naar deze plaats terugbrengen, en zal hen zeker doen wonen.","Joh 9:5":"Zolang Ik in de wereld ben, ben Ik het Licht van de wereld.","2 Sam 22:8":"Toen daverde en beefde de aarde; de fundamenten van de hemel beroerden zich, en daverden, omdat Hij in toorn ontstoken was.","Richt 16:4-21":"En daarna gebeurde het, dat hij een vrouw lief kreeg, bij de beek Sorek, wier naam Delila was. Toen kwamen de vorsten van de Filistijnen naar haar toe, en zeiden tegen haar: Overreed hem, en zie waarin zijn grote kracht ligt, en waarmee wij hem machtig zouden kunnen worden, en hem binden, om hem te onderwerpen; dan zullen wij u geven, ieder, duizend en honderd zilverstukken. Delila dan zei tegen Simson: Vertel mij toch, waarin uw grote kracht ligt, en waarmee u gebonden zou kunnen worden, zodat men u kan onderwerpen.","Deut 12:5":"Maar naar de plaats die de HEERE, uw God, uit al uw stammen zal uitkiezen om Zijn Naam daar te vestigen, naar Zijn woning zult u vragen, en daarheen zult u komen;","Est 6:1-11":"Diezelfde nacht kon de koning niet slapen, en hij zei dat men het boek van de gedenkwaardigheden, de kronieken, moest brengen; en die werden voorgelezen in de tegenwoordigheid van de koning. En men vond geschreven dat Mordechai had bekendgemaakt dat Bigthana en Theres, twee kamerlingen van de koning, uit de dorpelwachters, van plan waren de hand te leggen aan koning Ahasveros. Toen zei de koning: Welke eer en verhoging is Mordechai hiervoor gegeven? En de knechten van de koning, zijn dienaars, zeiden: Aan hem is niets gegeven.","1 Kon 22:44":"Toch werden de hoogten niet weggenomen; het volk offerde en bracht nog reukwerk op de hoogten.","2 Kon 23:14":"Insgelijks brak hij de opgerichte beelden, en roeide de bossen uit; en hij vulde hun plaats met mensenbeenderen.","Ex 20:2":"Ik ben de HEERE, uw God, Die u uit Egypteland, uit het diensthuis, uitgeleid heb.","2 Sam 21:17":"Maar Abisai, de zoon van Zeruja, hielp hem, en sloeg de Filistijn, en doodde hem. Toen zwoeren de mannen van David hem, en zeiden: U zult niet meer met ons uittrekken ten strijde, zodat u de lamp van Israël niet uitblust.","Ps 89:3":"Want ik heb gezegd: Uw goedertierenheid zal eeuwig gebouwd worden; in de hemelen zelf hebt Gij Uw waarheid bevestigd, en gezegd:","Deut 7:4":"Want zij zouden uw zonen van Mij doen afwijken, zodat zij andere goden zouden dienen; en de toorn van de HEERE zou tegen u ontsteken, en u snel verdelgen.","Neh 13:23":"Ook zag ik in die dagen Joden die Asdodische, Ammonietische en Moabietische vrouwen bij zich hadden laten wonen.","Jer 51:20":"U bent Mij een voorhamer, en oorlogswapens; en door u zal Ik volken in stukken slaan, en door u zal Ik koninkrijken verderven.","Ps 86:15":"Maar Gij, Heere! zijt een barmhartig en genadig God, geduldig, en groot van goedertierenheid en waarheid.","Jak 4:15":"In plaats daarvan zou u moeten zeggen: Als de Heere het wil, en wij leven, zullen wij dit of dat doen.","Jer 17:2":"Zoals hun kinderen aan hun altaren denken, en aan hun bossen, bij het groene geboomte, op de hoge heuvels.","Ezech 25:14-17":"En Ik zal Mijn wraak brengen over Edom, door de hand van Mijn volk Israël; en zij zullen tegen Edom handelen naar Mijn toorn en naar Mijn grimmigheid; zo zullen zij Mijn wraak leren kennen, spreekt de Heere HEERE. Zo zegt de Heere HEERE: Omdat de Filistijnen uit wraak gehandeld hebben, en van harte wraak geoefend hebben door plundering, om te vernielen vanuit een eeuwige vijandschap; Daarom, zo zegt de Heere HEERE: Zie, Ik strek Mijn hand uit tegen de Filistijnen, en Ik zal de Cherethieten uitroeien, en het overblijfsel van de zeehaven doen verdwijnen.","Fil 1:19":"Want ik weet dat dit mij ter zaligheid zal gedijen, door uw gebed en de toebrenging van de Geest van Jezus Christus.","Ps 106:1":"Halleluja! Loof de HEERE, want Hij is goed, want Zijn goedertierenheid is voor eeuwig.","Luk 11:34":"De lamp van het lichaam is het oog: wanneer dan uw oog zuiver is, dan is ook uw hele lichaam verlicht; maar als het slecht is, dan is ook uw lichaam duister.","Ps 110:5":"De Heere is aan Uw rechterhand; Hij zal koningen verslaan op de dag van Zijn toorn.","1 Kon 8:61":"En uw hart zij volkomen met de HEERE, onze God, om te wandelen in Zijn inzettingen, en Zijn geboden te houden, zoals op deze dag.","1 Kon 14:2":"En Jerobeam zei tegen zijn vrouw: Sta nu op, en verkleed u, zodat men niet merkt dat u Jerobeams vrouw bent, en ga naar Silo. Zie, daar is de profeet Ahia, die tegen mij gezegd heeft dat ik koning zou zijn over dit volk.","1 Sam 24:6":"Doch het gebeurde daarna, dat het hart van David hem sloeg, omdat hij de slip van Saul afgesneden had.","1 Kron 17:24-27":"Ja, laat het waar worden, en laat Uw Naam groot gemaakt worden tot in eeuwigheid, zodat men zegt: De HEERE van de heerscharen, de God van Israël, is Israëls God; en laat het huis van David, Uw knecht, bestendig zijn voor Uw aangezicht. Want U, mijn God, hebt aan het oor van Uw knecht geopenbaard dat U hem een huis bouwen zou; daarom heeft Uw knecht in zijn hart de vrijmoedigheid gevonden om voor Uw aangezicht te bidden. Nu dan, HEERE, U bent die God; en U hebt dit goede over Uw knecht gesproken.","Ezra 6:22":"En zij hielden het feest van de ongezuurde broden zeven dagen, met blijdschap; want de HEERE had hen verblijd, en het hart van de koning van Assur naar hen toe gewend, om hun handen te sterken in het werk van het huis van God, de God van Israël.","1 Kron 18:3-10":"David sloeg ook Hadar-ezer, de koning van Zoba, naar Hamath toe, toen hij optrok om zijn macht te vestigen aan de rivier de Eufraat. En David nam hem duizend wagens af, en zevenduizend ruiters, en twintigduizend man te voet; en David sneed bij alle wagenpaarden de hezenpezen door; maar hij hield honderd wagens daarvan over. En de Syriërs van Damaskus kwamen om Hadar-ezer, de koning van Zoba, te helpen; maar David sloeg van de Syriërs tweeëntwintigduizend man.","Neh 13:23-27":"Ook zag ik in die dagen Joden die Asdodische, Ammonietische en Moabietische vrouwen bij zich hadden laten wonen. En hun kinderen spraken half Asdodisch, en zij konden geen Joods spreken, maar naar de taal van ieder volk. Zo twistte ik met hen, en vloekte hen, en sloeg sommige mannen van hen, en trok hun het haar uit; en ik liet hen zweren bij God: U zult uw dochters niet aan hun zonen geven, en van hun dochters niet nemen voor uw zonen of voor uzelf!","Num 25:14":"De naam nu van de gedode Israëlitische man, die gedood werd met de Midianietische vrouw, was Zimri, de zoon van Salu, een leider van een vaderlijk huis van de Simeonieten.","1 Tim 6:16":"Die als enige onsterfelijkheid heeft, en een ontoegankelijk licht bewoont; aan Wie geen mens gezien heeft, en ook niet zien kan; aan Wie eer en eeuwige kracht zij. Amen.","1 Kron 19:6":"Toen de kinderen van Ammon zagen dat zij zich stinkend gemaakt hadden bij David, stuurden Hanun en de kinderen van Ammon duizend talenten van het zilver, om zich wagens en ruiters te huren uit Mesopotamië, en uit Syrië-Maächa, en uit Zoba;","Ps 103:10":"Hij doet ons niet naar onze zonden, en vergeldt ons niet naar onze ongerechtigheden.","Hebr 4:3":"Want wij die geloofd hebben, gaan de rust in, zoals Hij gezegd heeft: Zo heb Ik dan in Mijn toorn gezworen: Zij zullen Mijn rust niet ingaan! Hoewel Zijn werken al vanaf de grondlegging van de wereld volbracht waren.","1 Tess 5:5":"U bent allen kinderen van het licht en kinderen van de dag; wij zijn niet van de nacht, en ook niet van de duisternis.","2 Sam 8:3-8":"David sloeg ook Hadad-Ezer, de zoon van Rechob, de koning van Zoba, toen hij op weg ging om zijn macht te herstellen tot aan de rivier Frath. En David nam hem duizend wagens af, en zevenhonderd ruiters, en twintigduizend man voetvolk; en David sneed de pezen door van alle wagenpaarden, en hield daarvan honderd wagens over. En de Syriërs van Damaskus kwamen om Hadad-Ezer, de koning van Zoba, te helpen; maar David sloeg van de Syriërs tweeëntwintigduizend man.","Ps 119:130":"De opening van Uw woorden geeft licht, de eenvoudigen verstandig makend.","1 Petr 1:3":"Geloofd zij de God en Vader van onze Heere Jezus Christus, Die naar Zijn grote barmhartigheid ons opnieuw geboren heeft doen worden tot een levende hoop, door de opstanding van Jezus Christus uit de doden.","2 Sam 14:6":"Nu had uw dienares twee zonen, en deze twee vochten met elkaar in het veld, en er was niemand om hen uit elkaar te halen; zo sloeg de een de ander, en doodde hem.","Num 16:45":"Maak u op uit het midden van deze vergadering, en Ik zal hen verteren, in een ogenblik! Toen vielen zij op hun aangezichten.","Jes 45:13":"Ik heb hem verwekt in gerechtigheid, en al zijn wegen zal Ik recht maken; hij zal Mijn stad bouwen, en hij zal Mijn gevangenen loslaten, niet voor prijs, en ook niet voor geschenk, zegt de HEERE van de heerscharen.","1 Joh 1:9":"Als wij onze zonden belijden: Hij is getrouw en rechtvaardig, om ons de zonden te vergeven, en ons te reinigen van alle ongerechtigheid.","2 Kron 21:20":"Hij was tweeëndertig jaar oud toen hij koning werd, en regeerde acht jaar in Jeruzalem; en hij ging heen zonder dat men hem miste; en zij begroeven hem in de stad van David, maar niet in de graven van de koningen.","Ps 89:50-52":"Heere! waar zijn Uw vorige blijken van goedertierenheid, die Gij David gezworen hebt bij Uw trouw? Gedenk, Heere! aan de smaad van Uw knechten, die ik in mijn boezem draag, van alle grote volken. Waarmee, o HEERE! Uw vijanden smaden, waarmee zij de voetstappen van Uw gezalfde smaden.","Rom 1:10":"altijd in mijn gebeden biddend, of het mij misschien nog op een gegeven moment door de wil van God gegeven zou worden om naar u te komen.","Zef 2:7":"En dat gebied zal zijn voor het overblijfsel van het huis van Juda, zodat zij daarin weiden; 's avonds zullen zij in de huizen van Askelon liggen, want de HEERE, hun God, zal hen bezoeken, en Hij zal hun gevangenschap wenden.","Ezech 16:63":"opdat u eraan denkt, en zich schaamt, en niet meer uw mond opendoet vanwege uw schande, wanneer Ik verzoening voor u zal doen over alles wat u gedaan hebt, spreekt de Heere HEERE.","1 Kon 21:29":"Hebt u gezien dat Achab zich vernedert voor Mijn aangezicht? Omdat hij zich vernedert voor Mijn aangezicht, zal Ik dat kwaad in zijn dagen niet brengen; in de dagen van zijn zoon zal Ik dat kwaad over zijn huis brengen.","Mark 14:31":"Maar hij zei des te heftiger: Al moest ik met U sterven, ik zal U geenszins verloochenen! En evenzo zeiden zij ook allen.","2 Kron 21:7":"Doch de HEERE wilde het huis van David niet te gronde richten, omwille van het verbond dat Hij met David gesloten had; en zoals Hij gezegd had hem en zijn zonen voor altijd een lamp te zullen geven.","Ezech 20:28":"Toen Ik hen in het land had gebracht, waarover Ik Mijn hand had opgeheven om het hun te geven, zagen zij naar elke hoge heuvel en elke dichtbeboste boom, en offerden daar hun offers, en zij brachten daar hun tergende offergaven, en daar zetten zij hun liefelijke reuk neer, en daar goten zij hun drankoffers uit.","Num 21:29":"Wee u, Moab! U, volk van Kamoz, bent verloren! Hij heeft zijn zonen, die ontkwamen, en zijn dochters in de gevangenschap geleverd aan Sihon, de koning van de Amorieten.","2 Sam 22:9":"Rook ging op van Zijn neus, en een vuur uit Zijn mond verteerde; kolen werden daardoor aangestoken.","1 Kon 11:17-22":"Toen vluchtte Hadad, hij en enkele Edomitische mannen uit de dienaren van zijn vader met hem, om naar Egypte te gaan; Hadad was toen nog een kleine jongen. En zij trokken op vanuit Midian en kwamen naar Paran; en zij namen mannen uit Paran met zich mee, en kwamen in Egypte bij Farao, de koning van Egypte, die hem een huis gaf, en hem levensonderhoud toezei, en hem land gaf. En Hadad vond grote genade in de ogen van Farao, zodat hij hem tot vrouw gaf de zuster van zijn eigen vrouw, de zuster van Tachpenes, de koningin.","1 Sam 8:8":"Naar de werken die zij gedaan hebben, vanaf de dag dat Ik hen uit Egypte geleid heb, tot op deze dag toe, en Mij hebben verlaten en andere goden gediend; zo doen zij u ook.","Neh 1:10":"Zij zijn toch Uw dienaren en Uw volk, dat U verlost hebt door Uw grote kracht en door Uw sterke hand.","Jes 37:26":"Hebt u niet gehoord dat Ik dit lang tevoren gedaan heb, en dat Ik het van de oude dagen af gevormd heb? Nu heb Ik dat laten gebeuren, dat u de vaste steden zou verwoesten tot puinhopen.","1 Kon 9:4":"En als u voor Mijn aangezicht wandelt, zoals uw vader David gewandeld heeft, met een volkomen hart, en met oprechtheid, om te doen naar alles wat Ik u geboden heb, en Mijn inzettingen en Mijn rechten houdt;","1 Kon 9:24":"Doch de dochter van Farao trok van de stad van David op naar haar huis, dat hij voor haar gebouwd had; toen bouwde hij Millo.","2 Kon 17:9":"En de kinderen van Israël hadden dingen die niet recht zijn tegen de HEERE, hun God, verborgen gedaan; en hadden zich hoogten gebouwd in al hun steden, van de wachttoren af tot de versterkte stad toe.","Jes 57:17":"Ik was toornig over de ongerechtigheid van zijn hebzucht, en sloeg hem; Ik verborg Mij, en was toornig; toch ging hij afkerig zijn eigen weg, de weg van zijn hart.","Ps 127:2":"Het is tevergeefs dat u vroeg opstaat, laat opblijft, brood eet met zorgen erbij; het is zo, dat Hij het aan hen die Hij liefheeft, geeft als in de slaap.","Gal 4:25":"want Hagar is de berg Sinaï in Arabië, en komt overeen met het huidige Jeruzalem, dat met haar kinderen in dienstbaarheid is.","Jes 54:16":"Zie, Ik heb de smid geschapen, die de kolen in het vuur opblaast, en die het instrument voortbrengt tot zijn werk; ook heb Ik de verderver geschapen om te vernielen.","Jer 2:31":"Geslacht, let toch op het woord van de HEERE! Ben Ik Israël een woestijn geweest, of een land van de uiterste donkerheid? Waarom zegt Mijn volk dan: Wij zijn heren, wij zullen niet meer tot U komen?","Ps 60:4":"U hebt het land geschud, U hebt het gespleten; genees zijn breuken, want het wankelt.","Deut 17:3":"Doordat hij heengaat en andere goden dient, en zich voor die buigt, of voor de zon, of voor de maan, of voor het hele leger van de hemel, wat ik niet geboden heb;","Job 23:2-6":"Ook vandaag is mijn klacht bitter; mijn plaag is zwaarder dan mijn zuchten. Och, of ik wist waar ik Hem vinden zou, ik zou tot Zijn troon komen; Ik zou het recht voor Zijn aangezicht ordentelijk voorstellen, en mijn mond zou ik met verdedigingen vullen.","2 Sam 7:11":"En vanaf de dag dat Ik geboden heb richters te wezen over Mijn volk Israël. Toch heb Ik u rust gegeven van al uw vijanden. Ook maakt de HEERE u bekend, dat de HEERE u een huis maken zal.","Luk 16:8":"En de heer prees de onrechtvaardige rentmeester, omdat hij voorzichtig gehandeld had; want de kinderen van deze wereld zijn voorzichtiger dan de kinderen van het licht, in hun geslacht.","Ruth 1:4":"Die namen voor zich Moabitische vrouwen; de naam van de ene was Orpa, en de naam van de andere Ruth; en zij bleven daar ongeveer tien jaar.","Jes 66:15":"Want zie, de HEERE zal met vuur komen, en Zijn wagens als een wervelwind; om met grimmigheid Zijn toorn hiertoe te wenden, en Zijn bestraffing met vuurvlammen.","Fil 1:12":"En ik wil dat u weet, broeders, dat wat er met mij gebeurd is, meer tot bevordering van het Evangelie gekomen is;","Klaagl 3:37":"Mem. Wie zegt iets, en het gebeurt, als de Heere het niet beveelt?","1 Kon 15:8":"En Abiam ontsliep met zijn vaderen, en zij begroeven hem in de stad van David; en Asa, zijn zoon, regeerde in zijn plaats.","Zach 1:16":"Daarom zegt de HEERE zo: Ik ben tot Jeruzalem teruggekeerd met ontfermingen; Mijn huis zal daarin gebouwd worden, spreekt de HEERE van de heerscharen, en het meetlint zal over Jeruzalem uitgespannen worden.","Luk 6:36":"Wees dan barmhartig, zoals ook uw Vader barmhartig is.","1 Kon 21:25":"Doch er was niemand geweest zoals Achab, die zichzelf verkocht had om te doen wat kwaad is in de ogen van de HEERE, omdat Izebel, zijn vrouw, hem ophitste.","2 Kron 22:3-5":"Hij wandelde ook in de wegen van het huis van Achab; want zijn moeder was zijn raadgeefster, om goddeloos te handelen. En hij deed wat kwaad was in de ogen van de HEERE, net als het huis van Achab; want zij waren zijn raadgevers, na de dood van zijn vader, tot zijn verderf. Hij wandelde ook naar hun raad, en ging met Joram, de zoon van Achab, de koning van Israël, ten strijde tegen Hazaël, de koning van Syrië, bij Ramoth in Gilead; en de Syriërs sloegen Joram.","2 Kon 14:26":"Want de HEERE zag dat de ellende van Israël zeer bitter was, en dat er niemand was die opgesloten of achtergelaten was, en dat Israël geen helper had.","Jer 46:28":"U dan, Mijn knecht Jakob! Vrees niet, spreekt de HEERE; want Ik ben met u; want Ik zal een voleinding maken met al de heidenen, waarheen Ik u gedreven zal hebben, doch met u zal Ik geen voleinding maken, maar u kastijden met mate, en u niet geheel onschuldig houden.","Deut 6:15":"Want de HEERE, uw God, is een na-ijverig God in uw midden; dat de toorn van de HEERE, uw God, tegen u niet ontsteekt, en Hij u van de aardbodem verdelgt.","Ex 32:10":"En nu, laat Mij begaan, dat Mijn toorn tegen hen ontsteekt en hen verteert; dan zal Ik u tot een groot volk maken.","Ezech 36:25":"Dan zal Ik rein water op u sprenkelen, en u zult rein worden; van al uw onreinheden en van al uw drekgoden zal Ik u reinigen.","Deut 32:22":"Want een vuur is aangestoken in Mijn toorn, en zal branden tot in de onderste hel, en zal het land met zijn opbrengst verteren, en de gronden van de bergen in vlam zetten.","Hos 4:9":"Daarom, zoals het volk, zo zal de priester zijn; en Ik zal zijn wegen aan hem bezoeken¹, en zijn daden hem vergelden.","Deut 7:3":"U zult zich ook niet met hen verzwageren; uw dochters zult u niet geven aan hun zonen, en hun dochters niet nemen voor uw zonen.","1 Kon 14:26":"En hij nam de schatten van het huis van de HEERE, en de schatten van het huis van de koning weg, ja, hij nam alles weg; hij nam ook al de gouden schilden weg die Salomo gemaakt had.","Jes 30:27":"Ziet, de Naam van de HEERE komt van verre, Zijn toorn brandt, en de last is zwaar; Zijn lippen zijn vol gramschap, en Zijn tong als een verterend vuur;","Est 7:10":"Zo hingen zij Haman aan de galg, die hij voor Mordechai had laten maken; en de grimmigheid van de koning werd gestild.","Luk 12:1":"Ondertussen, toen er vele duizenden mensen uit de menigte bijeengebracht waren, zodat zij elkaar vertraden, begon Hij tegen Zijn discipelen te zeggen: Let vooral op uzelf voor het zuurdeeg van de Farizeeën, dat is huichelarij.","Deut 13:14":"dan zult u onderzoeken, en naspeuren, en goed navragen; en zie, als het de waarheid is, de zaak zeker vaststaat, zo'n gruwel in uw midden gedaan is;","Mal 2:11":"Juda handelt trouweloos, en er wordt een gruwel gedaan in Israël en in Jeruzalem; want Juda ontheiligt de heiligheid van de HEERE, die Hij liefheeft; want hij heeft de dochter van een vreemde god getrouwd.","Hand 7:21":"En toen hij te vondeling gelegd was, nam de dochter van Farao hem op, en voedde hem voor zichzelf op als een zoon.","1 Kon 12:2":"Het gebeurde nu, toen Jerobeam, de zoon van Nebat, dit hoorde, terwijl hij nog in Egypte was (want hij was voor het aangezicht van koning Salomo gevlucht, en Jerobeam woonde in Egypte),","Gen 17:7":"En Ik zal Mijn verbond oprichten tussen Mij en u, en uw nageslacht na u, in hun geslachten, tot een eeuwig verbond, om u en uw nageslacht na u tot een God te zijn.","Richt 3:9":"Toen riepen de kinderen van Israël tot de HEERE; en de HEERE verwekte de kinderen van Israël een verlosser, die hen verloste, Othniël, zoon van Kenaz, broer van Kaleb, die jonger was dan hij.","Est 6:1":"Diezelfde nacht kon de koning niet slapen, en hij zei dat men het boek van de gedenkwaardigheden, de kronieken, moest brengen; en die werden voorgelezen in de tegenwoordigheid van de koning.","Num 25:3":"Toen Israël zich koppelde aan Baäl-peor, ontstak de toorn van de HEERE tegen Israël.","Rom 8:28":"En wij weten dat voor hen die God liefhebben, alle dingen meewerken ten goede, namelijk voor hen die naar Zijn voornemen geroepen zijn.","1 Sam 13:14":"Maar nu zal uw koningschap niet blijven bestaan. De HEERE heeft Zich een man gezocht naar Zijn hart, en de HEERE heeft hem bevolen een voorganger te zijn over Zijn volk, omdat u niet gehouden hebt wat de HEERE u geboden had.","Deut 31:16":"En de HEERE zei tegen Mozes: Zie, u zult slapen met uw vaderen; en dit volk zal opstaan, en overspelig achter de goden van de vreemden van dat land aan gaan, waar het naartoe gaat, in het midden ervan; en het zal Mij verlaten en Mijn verbond vernietigen, dat Ik met hen gesloten heb.","Joz 18:1":"En de hele gemeenschap van de kinderen van Israël verzamelde zich te Silo, en zij richtten daar de tent van de samenkomst op, nadat het land aan hen onderworpen was.","Ps 103:17":"Maar de goedertierenheid van de HEERE is van eeuwigheid tot eeuwigheid over hen die Hem vrezen, en Zijn gerechtigheid over kindskinderen;","Joz 18:5":"Zij nu zullen het verdelen in zeven delen; Juda zal blijven op zijn gebied van het zuiden, en het huis van Jozef zal blijven op zijn gebied van het noorden.","Ex 34:7":"Die de goedertierenheid bewaart aan vele duizenden, Die de ongerechtigheid, en overtreding, en zonde vergeeft; Die de schuldige geenszins onschuldig houdt, en de ongerechtigheid van de vaders bezoekt aan de kinderen, en aan de kindskinderen, tot in het derde en vierde geslacht.","Num 31:2":"Neem wraak voor de kinderen van Israël op de Midianieten; daarna zult u verzameld worden tot uw volken.","Matt 26:30":"En toen zij de lofzang gezongen hadden, gingen zij naar de Olijfberg.","1 Kon 11:14-22":"Zo verwekte de HEERE tegen Salomo een tegenstander, Hadad de Edomiet; hij was van het koninklijk geslacht in Edom. Want het was gebeurd, toen David in Edom was, en Joab, de legeraanvoerder, optrok om de gesneuvelden te begraven, dat hij alles wat mannelijk was in Edom versloeg; want Joab bleef daar zes maanden met heel Israël, totdat hij alles wat mannelijk was in Edom had uitgeroeid.","Deut 9:8":"Want bij Horeb vertoornde u de HEERE zeer, zodat Hij Zich tegen u vertoornde, om u te verdelgen.","2 Kron 20:34":"Het overige nu van de geschiedenissen van Josafat, de eerste en de laatste, zie, die zijn geschreven in de geschiedenissen van Jehu, de zoon van Hanani, die men optekende in het boek van de koningen van Israël.","Ps 117:2":"Want Zijn goedertierenheid is machtig over ons, en de waarheid van de HEERE is er voor eeuwig! Halleluja!","Ps 103:18":"Over hen die Zijn verbond houden, en die aan Zijn bevelen denken, om die te doen.","Ezech 14:16":"Al waren die drie mannen in het midden daarvan, zo waarachtig als Ik leef, spreekt de Heere HEERE, zij zouden zonen noch dochters bevrijden, zij zelf alleen zouden bevrijd worden, maar het land zou woest worden.","Nahum 1:3":"De HEERE is geduldig, maar van grote kracht, en Hij houdt de schuldige zeker niet onschuldig. De weg van de HEERE is in wervelwind en in storm, en de wolken zijn het stof van Zijn voeten.","Ezech 29:20":"Als zijn arbeidsloon, omdat hij tegen haar gediend heeft, heb Ik hem Egypteland gegeven, omdat zij voor Mij gewerkt hebben, spreekt de Heere HEERE.","Ezech 14:22":"Doch zie, daarin zullen mensen die ontkomen zijn overblijven, die uitgevoerd zullen worden, zonen en dochters; zie, zij zullen tot u uitkomen, en u zult hun weg zien en hun handelingen; en u zult vertroost worden over het kwaad dat Ik over Jeruzalem gebracht zal hebben, ja, al wat Ik over haar zal hebben gebracht.","Ex 2:15":"Toen Farao deze zaak hoorde, zocht hij Mozes te doden; maar Mozes vluchtte voor Farao, en woonde in het land Midian, en hij ging bij een waterput zitten.","2 Sam 12:13":"Toen zei David tegen Nathan: Ik heb gezondigd tegen de HEERE! En Nathan zei tegen David: De HEERE heeft ook uw zonde weggenomen, u zult niet sterven.","Jer 36:3":"Misschien zullen die van het huis van Juda al het kwaad horen dat Ik hun van plan ben te doen, zodat zij zich bekeren, ieder van zijn boze weg, en Ik hun ongerechtigheid en hun zonde vergeef.","1 Kon 14:5-16":"Maar de HEERE zei tegen Ahia: Zie, Jerobeams vrouw komt om u iets te vragen over haar zoon, want hij is ziek. Zo en zo zult u tot haar spreken, en het zal gebeuren, als zij binnenkomt, dat zij zich als een andere vrouw zal voordoen. En het gebeurde, toen Ahia het geluid van haar voeten hoorde, terwijl zij bij de deur binnenkwam, dat hij zei: Kom binnen, vrouw van Jerobeam! Waarom stelt u zich zo vreemd aan? Want ik ben naar u toe gestuurd met een harde boodschap. Ga heen, zeg tegen Jerobeam: Zo zegt de HEERE, de God van Israël: Omdat Ik u verheven heb uit het midden van het volk, en u tot een leider over Mijn volk Israël gesteld heb;","Richt 8:31":"En zijn bijvrouw, die in Sichem woonde, baarde hem ook een zoon; en hij noemde hem Abimelech.","1 Kron 17:14":"Maar Ik zal hem in Mijn huis bestendig maken, en in Mijn Koninkrijk tot in eeuwigheid; en zijn troon zal vast zijn tot in eeuwigheid.","2 Kron 7:3":"En toen alle kinderen van Israël dat vuur zagen neerdalen, en de heerlijkheid van de HEERE over het huis, bogen zij met hun gezichten ter aarde op de vloer, en aanbaden en loofden de HEERE, dat Hij goed is, dat Zijn goedertierenheid tot in eeuwigheid is.","Num 10:12":"En de kinderen van Israël trokken op naar hun tochten, uit de woestijn Sinaï; en de wolk bleef in de woestijn Paran.","Klaagl 2:3":"Gimel. Hij heeft, in ontsteking van de toorn, de gehele hoorn van Israël afgehouwen; Hij heeft Zijn rechterhand achterwaarts getrokken, toen de vijand kwam, en Hij is tegen Jakob ontstoken als een vlammend vuur, dat rondom verteert.","Gen 25:4":"En de zonen van Midian waren Efa en Efer, en Henoch en Abida, en Eldaä. Deze allen waren zonen van Ketura.","Spr 21:1":"Het hart van de koning is in de hand van de HEERE als waterbeken. Hij neigt het tot alles wat Hij wil.","1 Kron 18:2-9":"Hij sloeg ook de Moabieten, zodat de Moabieten Davids knechten werden, die geschenken brachten. David sloeg ook Hadar-ezer, de koning van Zoba, naar Hamath toe, toen hij optrok om zijn macht te vestigen aan de rivier de Eufraat. En David nam hem duizend wagens af, en zevenduizend ruiters, en twintigduizend man te voet; en David sneed bij alle wagenpaarden de hezenpezen door; maar hij hield honderd wagens daarvan over.","Hebr 8:12":"Want Ik zal hun ongerechtigheden genadig zijn, en aan hun zonden en hun overtredingen zal Ik geenszins meer denken.","2 Kon 21:18":"En Manasse ontsliep met zijn vaderen, en werd begraven in de tuin van zijn huis, in de tuin van Uzza; en zijn zoon Amon werd koning in zijn plaats.","Richt 1:22":"En het huis van Jozef trok ook op naar Beth-el. En de HEERE was met hen.","Hos 14:5":"Ik zal hun afkering genezen, Ik zal hen vrijwillig liefhebben; want Mijn toorn is van hem gekeerd.","Openb 8:4":"En de rook van het reukwerk steeg, met de gebeden van de heiligen, op uit de hand van de engel voor God.","2 Kon 11:2":"Maar Joseba, de dochter van koning Joram, de zuster van Ahazia, nam Joas, de zoon van Ahazia, en stal hem uit het midden van de zonen van de koning die gedood werden. Zij zette hem en zijn voedster in een slaapkamer en verborg hem voor Athalia, zodat hij niet gedood werd.","Spr 11:21":"Hand aan hand zal de boze niet onschuldig blijven; maar het nageslacht van de rechtvaardigen zal ontkomen.","Matt 25:23-30":"Zijn heer zei tegen hem: Goed gedaan, goede en trouwe dienstknecht, over weinig ben je trouw geweest; over veel zal ik je aanstellen; ga in, in de vreugde van uw heer. Maar hij die het ene talent ontvangen had, kwam ook en zei: Heer, ik kende u, dat u een hard mens bent, die maait waar u niet gezaaid hebt, en verzamelt vandaar waar u niet gestrooid hebt; En ik was bang, en ben weggegaan, en heb uw talent verborgen in de aarde; zie, u hebt het uwe.","Hos 11:8":"Hoe zou Ik u overgeven, o Efraïm? U overleveren, o Israël? Hoe zou Ik u maken als Adama, u stellen als Zeboïm? Mijn hart is in Mij omgekeerd, al Mijn medelijden is samen ontstoken.","1 Kon 15:14":"De hoogten werden wel niet weggenomen; toch was het hart van Asa volkomen met de HEERE, al zijn dagen.","Richt 8:30":"Gideon nu had zeventig zonen, die uit hem waren voortgekomen; want hij had veel vrouwen.","Ps 36:6":"O HEERE! Uw goedertierenheid is tot in de hemelen; Uw waarheid tot de bovenste wolken toe.","Jes 29:13":"Want de Heere heeft gezegd: Omdat dit volk tot Mij nadert met zijn mond, en zij Mij met hun lippen eren, maar hun hart ver van Mij houden; en hun vrees, waarmee zij Mij vrezen, mensengeboden zijn, die hun geleerd zijn;","Deut 9:13":"Verder sprak de HEERE tot mij en zei: Ik heb dit volk aangemerkt, en zie, het is een hardnekkig volk.","1 Kon 11:29-39":"Het gebeurde nu in die tijd, toen Jerobeam uit Jeruzalem wegging, dat de profeet Ahia, de Siloniet, hem op de weg vond; hij had zich een nieuw kleed aangedaan, en zij beiden waren alleen op het veld; toen greep Ahia het nieuwe kleed dat hij aanhad, en scheurde het in twaalf stukken. En hij zei tegen Jerobeam: Neem tien stukken voor uzelf; want zo zegt de HEERE, de God van Israël: Zie, Ik zal het koninkrijk uit de hand van Salomo scheuren, en u tien stammen geven.","Deut 5:10":"en doe barmhartigheid aan duizenden van hen die Mij liefhebben en Mijn geboden onderhouden.","Jes 45:1-6":"Zo zegt de HEERE tegen Zijn gezalfde, tegen Kores, wiens rechterhand Ik vastheb, om de volken voor zijn aangezicht neer te werpen; en Ik zal de lendenen van de koningen ontbinden, om voor zijn aangezicht de deuren te openen, en de poorten zullen niet gesloten worden: Ik zal voor uw aangezicht gaan, en Ik zal de kromme wegen recht maken; de koperen deuren zal Ik verbreken, en de ijzeren grendels zal Ik in stukken slaan. En Ik zal u de schatten geven die in de duisternissen zijn, en de verborgen rijkdommen; opdat u weet dat Ik de HEERE ben, Die u bij uw naam roept, de God van Israël;","Gen 21:13":"Maar Ik zal ook de zoon van deze slavin tot een volk maken, omdat hij uw nageslacht is.","Ef 1:6-8":"Tot prijs van de heerlijkheid van Zijn genade, waardoor Hij ons begenadigd heeft in de Geliefde; In Wie wij de verlossing hebben door Zijn bloed, namelijk de vergeving van de misdaden, naar de rijkdom van Zijn genade, Waarmee Hij overvloedig is geweest over ons in alle wijsheid en voorzichtigheid;","Nahum 1:2":"Een ijverig God en een wreker is de HEERE, een wreker is de HEERE, en zeer grimmig; een wreker is de HEERE aan Zijn tegenstanders, en Hij bewaart de toorn voor Zijn vijanden.","Deut 9:14":"Laat Mij begaan, dat Ik hen verdelg, en hun naam van onder de hemel uitwis; en Ik zal u tot een machtiger en groter volk maken dan dit is.","1 Kon 9:2":"Dat de HEERE voor de tweede keer aan Salomo verscheen, zoals Hij hem in Gibeon verschenen was."},"noten":{},"koppeling":{"1":"<span class=\"wl\" data-l=\"L1\" data-code=\"H4428\">En</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H4428\">koning</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H8010\">Salomo</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H8010\">had</span>, behalve <span class=\"wl\" data-l=\"L7\" data-code=\"H1323\">de</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H1323\">dochter</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H1323\">van</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H6547\">Farao</span>, <span class=\"wl\" data-l=\"L4\" data-code=\"H7227\">veel</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H5237\">vreemde</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H802\">vrouwen</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H157\">lief</span>: <span class=\"wl\" data-l=\"L9\" data-code=\"H4125\">Moabitische</span>, <span class=\"wl\" data-l=\"L10\" data-code=\"H5984\">Ammonitische</span>, <span class=\"wl\" data-l=\"L11\" data-code=\"H130\">Edomitische</span>, <span class=\"wl\" data-l=\"L12\" data-code=\"H6722\">Sidonische</span> <span class=\"
