n grote lasteringen gedaan hadden; Hebt U hen toch door Uw grote barmhartigheid niet verlaten in de woestijn; de wolkkolom week niet van hen overdag, om hen op de weg te leiden, noch de vuurkolom 's nachts, om hen licht te geven, op de weg waarin zij zouden gaan.","Jer 25:37":"Want de landerijen van de vrede zullen uitgeroeid worden, vanwege de gloed van de toorn van de HEERE.","1 Kon 15:3":"En hij wandelde in al de zonden van zijn vader, die hij vóór hem gedaan had; en zijn hart was niet volkomen met de HEERE, zijn God, zoals het hart van zijn vader David.","2 Kron 5:13":"het gebeurde dan, toen zij eenparig trompetten en zongen, om één stem te laten horen, terwijl zij de HEERE prezen en loofden; en toen zij de stem verhieven met trompetten, en met cimbalen, en andere muzikale instrumenten, en toen zij de HEERE prezen, omdat Hij goed is, omdat Zijn goedertierenheid tot in eeuwigheid is; dat het huis met een wolk vervuld werd, namelijk het huis van de HEERE.","1 Kon 19:15":"En de HEERE zei tegen hem: Ga, keer terug op uw weg, naar de woestijn van Damaskus; en als u daar aankomt, zalf dan Hazaël tot koning over Syrië.","Ex 14:4":"En Ik zal het hart van Farao verstokken, dat hij hen najaagt; en Ik zal aan Farao en aan zijn hele leger verheerlijkt worden, zodat de Egyptenaren zullen weten dat Ik de HEERE ben. En zij deden zo.","Ex 32:14":"Toen kreeg de HEERE berouw over het kwaad, dat Hij gezegd had Zijn volk te zullen aandoen.","1 Kon 9:4-7":"En als u voor Mijn aangezicht wandelt, zoals uw vader David gewandeld heeft, met een volkomen hart, en met oprechtheid, om te doen naar alles wat Ik u geboden heb, en Mijn inzettingen en Mijn rechten houdt; Dan zal Ik de troon van uw koninkrijk over Israël bevestigen in eeuwigheid; zoals Ik gesproken heb over uw vader David, en zei: Er zal u geen man afgesneden worden van de troon van Israël. Maar als u zich helemaal afkeert, u en uw kinderen, van Mij, om Mij niet meer te volgen, en Mijn geboden en Mijn inzettingen, die Ik voor uw aangezicht gegeven heb, niet houdt, maar heengaat en andere goden dient, en u voor hen neerbuigt;","Spr 20:7":"De rechtvaardige wandelt steeds in zijn oprechtheid; gelukkig zijn zijn kinderen na hem.","1 Kon 15:4":"Maar om Davids wil gaf de HEERE, zijn God, hem een lamp in Jeruzalem, door zijn zoon na hem te verwekken en Jeruzalem te bevestigen.","2 Kron 28:27":"En Achaz ontsliep met zijn vaderen, en zij begroeven hem in de stad, in Jeruzalem; maar zij brachten hem niet in de graven van de koningen van Israël; en zijn zoon Jehizkia werd koning in zijn plaats.","Dan 9:16":"O Heere! naar al Uw gerechtigheden, laat toch Uw toorn en Uw grimmigheid afgekeerd worden van Uw stad Jeruzalem, Uw heilige berg; want om onze zonden en om de ongerechtigheden van onze vaderen zijn Jeruzalem en Uw volk tot smaad bij allen die rondom ons zijn.","2 Kron 11:21":"En Rehabeam had Maächa, Absaloms dochter, liever dan al zijn vrouwen en zijn bijvrouwen; want hij had achttien vrouwen genomen, en zestig bijvrouwen; en hij verwekte achtentwintig zonen en zestig dochters.","1 Sam 7:4":"De kinderen van Israël deden toen de Baäls en de Astharoths weg, en zij dienden de HEERE alleen.","Gen 6:18":"Maar met u zal Ik Mijn verbond oprichten; en u zult in de ark gaan, u, en uw zonen, en uw vrouw, en de vrouwen van uw zonen met u.","Job 24:12":"Uit de stad zuchten de mensen, en de ziel van de verwonden schreeuwt uit; toch rekent God het niet aan als ongerijmd.","2 Sam 5:7":"Maar David nam de burcht Sion in; dat is de stad van David.","Ps 89:39-46":"Maar Gij hebt hem verstoten en verworpen; Gij bent verbolgen geworden tegen Uw gezalfde. Gij hebt het verbond van Uw knecht teniet gedaan; Gij hebt zijn kroon ontheiligd tegen de aarde. Gij hebt al zijn muren doorgebroken; Gij hebt zijn vestingen neergeworpen.","2 Kron 21:6":"En hij ging de weg van de koningen van Israël, zoals het huis van Achab deed; want hij had de dochter van Achab tot vrouw; en hij deed wat slecht was in de ogen van de HEERE.","2 Kon 21:4":"En hij bouwde altaren in het huis van de HEERE, waarvan de HEERE gezegd had: Te Jeruzalem zal Ik Mijn Naam vestigen.","2 Kon 16:20":"En Achaz ontsliep met zijn vaderen, en werd begraven bij zijn vaderen, in de stad van David; en Hizkia, zijn zoon, werd koning in zijn plaats.","Jes 41:4":"Wie heeft dit gedaan en tot stand gebracht, terwijl Hij de geslachten riep van het begin af? Ik, de HEERE, Die de Eerste ben, en met de Laatste ben Ik Dezelfde.","1 Kon 12:19":"Zo vielen de Israëlieten van het huis van David af, tot op deze dag.","1 Kon 11:1-3":"En koning Salomo had, behalve de dochter van Farao, veel vreemde vrouwen lief: Moabitische, Ammonitische, Edomitische, Sidonische en Hethitische vrouwen; van de volken waarvan de HEERE tegen de kinderen van Israël gezegd had: U zult tot hen niet ingaan, en zij zullen tot u niet inkomen; zij zouden zeker uw hart naar hun goden doen neigen; aan deze hing Salomo met liefde. En hij had zevenhonderd vrouwen, vorstinnen, en driehonderd bijvrouwen, en zijn vrouwen deden zijn hart neigen.","Jes 63:3-6":"Ik heb de pers alleen getreden, en er was niemand van de volken met Mij; en Ik heb hen getreden in Mijn toorn, en heb hen vertrapt in Mijn grimmigheid; en hun bloed is gesprenkeld op Mijn kleren, en heel Mijn gewaad heb Ik bezoedeld. Want de dag van de wraak was in Mijn hart, en het jaar van Mijn verlosten was gekomen. En Ik zag toe, en er was niemand die hielp; en Ik ontzette Mij, en er was niemand die ondersteunde; daarom heeft Mijn arm Mij heil beschikt, en Mijn grimmigheid heeft Mij ondersteund,","Openb 8:3":"En er kwam een andere engel, en hij stond aan het altaar met een gouden wierookvat; en hem werd veel van het reukwerk gegeven, opdat hij dat met de gebeden van alle heiligen zou leggen op het gouden altaar dat voor de troon is.","Gen 21:7":"Verder zei ze: Wie zou tegen Abraham gezegd hebben dat Sara zonen zou zogen? Want ik heb een zoon gebaard in zijn ouderdom.","Ps 112:2":"Gimel. Zijn nakomelingen zullen machtig zijn op aarde; Daleth. het geslacht van de oprechten zal gezegend worden.","Joh 12:35":"Jezus dan zei tegen hen: Nog een korte tijd is het Licht bij u; wandel zolang u het Licht hebt, opdat de duisternis u niet overvalt. En wie in de duisternis wandelt, weet niet waar hij heengaat.","Openb 6:16":"En zeiden tot de bergen en tot de steenrotsen: Valt op ons, en verbergt ons van het aangezicht van Hem Die op de troon zit, en van de toorn van het Lam.","Jes 62:1":"Om Sion zal Ik niet zwijgen, en om Jeruzalem zal Ik niet stil zijn; totdat haar gerechtigheid voortkomt als een glans, en haar heil als een fakkel, die brandt.","2 Sam 20:21":"De zaak is niet zo; maar een man van het gebergte van Efraïm, wiens naam Seba is, de zoon van Bichri, heeft zijn hand opgeheven tegen de koning, tegen David; lever hem alleen uit, dan zal ik van deze stad aftrekken. Toen zei de vrouw tegen Joab: Zie, zijn hoofd zal naar u toe over de muur geworpen worden.","2 Kron 7:12-22":"En de HEERE verscheen aan Salomo 's nachts, en Hij zei tegen hem: Ik heb uw gebed verhoord, en heb Mij deze plaats uitgekozen tot een offerhuis. Als Ik de hemel toesluit, zodat er geen regen is, of als Ik de sprinkhaan gebied het land te verteren, of als Ik pest onder Mijn volk zend; En Mijn volk, over wie Mijn Naam genoemd wordt, zich verootmoedigt en bidt, en zij Mijn aangezicht zoeken, en zich bekeren van hun slechte wegen; dan zal Ik uit de hemel horen, en hun zonden vergeven, en hun land genezen.","Joz 14:14":"Daarom werd Hebron aan Kaleb, de zoon van Jefunne, de Keneziet, tot erfdeel tot op deze dag; omdat hij had volhard in het navolgen van de HEERE, de God van Israël.","2 Kron 31:21":"En in al het werk dat hij begon in de dienst van het huis van God, en in de wet en in het gebod, om zijn God te zoeken, deed hij dat met zijn hele hart, en had voorspoed.","1 Kon 14:20":"De dagen nu dat Jerobeam geregeerd heeft, zijn tweeëntwintig jaren; en hij ontsliep met zijn vaderen, en Nadab, zijn zoon, regeerde in zijn plaats.","Spr 21:18":"De goddeloze is een rantsoen voor de rechtvaardigen, en de trouweloze voor de oprechten.","Ps 119:64":"HEERE! de aarde is vol van Uw goedertierenheid; leer mij Uw inzettingen.","2 Kron 36:15":"En de HEERE, de God van hun vaderen, zond tot hen, door de hand van Zijn boden, vroeg opstaand, om hen te zenden; want Hij spaarde Zijn volk en Zijn woning.","Openb 17:4":"En de vrouw was bekleed met purper en scharlaken, en versierd met goud en kostbaar gesteente en parels, en had in haar hand een gouden drinkbeker, vol van gruwelen en van de onreinheid van haar hoererij.","Ruth 1:2":"De naam van deze man was Elimelech, en de naam van zijn vrouw Naomi, en de naam van zijn twee zonen Machlon en Chiljon, Efrathieten, uit Bethlehem-juda; en zij kwamen in de velden van Moab, en bleven daar.","Deut 27:15":"Vervloekt is de man die een gesneden of gegoten beeld, een gruwel voor de HEERE, een werk van vakmansen handen, maakt en in het verborgene neerzet! En heel het volk zal antwoorden en zeggen: Amen.","Jes 9:6":"De grootheid van deze heerschappij en van de vrede zal geen einde hebben op de troon van David en in zijn koninkrijk, om dat te bevestigen en te sterken met recht en met gerechtigheid, van nu af tot in eeuwigheid toe. De ijver van de HEERE van de heerscharen zal dit doen.","Spr 19:21":"In het hart van de man zijn veel gedachten; maar de raad van de HEERE, die zal standhouden.","Ps 62:13":"En de goedertierenheid, o Heere! is van U; want U zult ieder vergelden naar zijn werk.","1 Sam 18:14":"En David gedroeg zich voorzichtig op al zijn wegen; en de HEERE was met hem.","Richt 3:8":"Toen ontstak de toorn van de HEERE tegen Israël; en Hij verkocht hen in de hand van Cuschan-Rischataïm, koning van Mesopotamië; en de kinderen van Israël dienden Cuschan-Rischataïm acht jaren.","Jes 48:14":"Verzamel u, u allen, en hoor; wie onder hen heeft deze dingen verkondigd? De HEERE heeft hem lief, Hij zal Zijn welbehagen tegen Babel doen, en Zijn arm zal tegen de Chaldeeën zijn.","Ps 146:8":"De HEERE opent de ogen van de blinden; de HEERE richt de gebogenen op; de HEERE heeft de rechtvaardigen lief.","Ex 4:14":"Toen ontstak de toorn van de HEERE over Mozes, en Hij zei: Is Aäron, de Leviet, uw broer, niet? Ik weet, dat hij zeer goed spreken zal, en ook, zie, hij zal u tegemoet gaan; wanneer hij u ziet, zal hij in zijn hart blij zijn.","Deut 9:5":"Niet om uw gerechtigheid, noch om de oprechtheid van uw hart, komt u daar binnen om hun land te erven; maar om de goddeloosheid van deze volken verdrijft de HEERE, uw God, hen voor uw aangezicht uit de bezitting: en om het woord te bevestigen dat de HEERE, uw God, aan uw vaderen, Abraham, Izak en Jakob, gezworen heeft.","Hand 13:22":"En nadat Hij hem afgezet had, verwekte Hij hun David tot koning; aan wie Hij ook getuigenis gaf, en zei: Ik heb David gevonden, de zoon van Isaï, een man naar Mijn hart, die al Mijn wil zal doen.","Openb 17:5":"En op haar voorhoofd was een naam geschreven: namelijk Verborgenheid; het grote Babylon, de moeder van de hoererijen en van de gruwelen van de aarde.","2 Kon 22:13":"Ga heen, vraag de HEERE voor mij, en voor het volk, en voor heel Juda, over de woorden van dit boek dat gevonden is; want de grimmigheid van de HEERE is groot, die tegen ons ontstoken is, omdat onze vaderen niet geluisterd hebben naar de woorden van dit boek, om te doen naar alles wat voor ons geschreven is.","Gen 27:40":"En van uw zwaard zult u leven, en u zult uw broer dienen; doch het zal gebeuren, wanneer u zult heersen, dan zult u zijn juk van uw hals afrukken.","Ps 145:8":"Cheth. Genadig en barmhartig is de HEERE, geduldig en groot van goedertierenheid.","Jes 24:13":"Want in het binnenste van het land, in het midden van deze volken, zal het zo zijn als de afschudding van het olijfboom, als de nalezingen, wanneer de wijnoogst geëindigd is.","Est 9:1":"In de twaalfde maand nu (dat is de maand Adar), op de dertiende dag daarvan, toen het woord en de wet van de koning nabij gekomen waren om uitgevoerd te worden, op de dag dat de vijanden van de Joden hoopten over hen te heersen, gebeurde het omgekeerde: de Joden zelf heersten over hun haters.","Ps 78:58":"En zij verwekten Hem tot toorn door hun hoogten, en verwekten Hem tot ijver door hun gesneden beelden.","2 Kon 8:16-18":"In het vijfde jaar van Joram, de zoon van Achab, de koning van Israël, toen Josafat koning was van Juda, begon Jehoram, de zoon van Josafat, de koning van Juda, te regeren. Hij was tweeëndertig jaar oud toen hij koning werd, en hij regeerde acht jaar in Jeruzalem. En hij ging de weg van de koningen van Israël, zoals het huis van Achab deed; want de dochter van Achab was zijn vrouw geworden; en hij deed wat slecht was in de ogen van de HEERE.","1 Sam 9:26":"En zij stonden vroeg op; en het gebeurde, omstreeks het opkomen van het dageraad, dat Samuel Saul riep op het dak, en zei: Sta op, dan zal ik u laten gaan. Toen stond Saul op, en zij gingen beiden naar buiten, hij en Samuel.","Ps 145:9":"Teth. De HEERE is voor allen goed, en Zijn barmhartigheden zijn over al Zijn werken.","Amos 5:6":"Zoek de HEERE, en leef; anders doorbreekt Hij in het huis van Jozef als een vuur, dat verteert, zodat er niemand is die het blust in Beth-el;","Ezra 1:1":"In het eerste jaar nu van Kores, koning van Perzië, opdat het woord van de HEERE, uit de mond van Jeremia, volbracht werd, wekte de HEERE de geest van Kores, koning van Perzië, op, zodat hij een boodschap liet doorgeven door heel zijn koninkrijk, zelfs ook op schrift, en zei:","1 Kon 11:14-16":"Zo verwekte de HEERE tegen Salomo een tegenstander, Hadad de Edomiet; hij was van het koninklijk geslacht in Edom. Want het was gebeurd, toen David in Edom was, en Joab, de legeraanvoerder, optrok om de gesneuvelden te begraven, dat hij alles wat mannelijk was in Edom versloeg; want Joab bleef daar zes maanden met heel Israël, totdat hij alles wat mannelijk was in Edom had uitgeroeid.","1 Kon 11:17-19":"Toen vluchtte Hadad, hij en enkele Edomitische mannen uit de dienaren van zijn vader met hem, om naar Egypte te gaan; Hadad was toen nog een kleine jongen. En zij trokken op vanuit Midian en kwamen naar Paran; en zij namen mannen uit Paran met zich mee, en kwamen in Egypte bij Farao, de koning van Egypte, die hem een huis gaf, en hem levensonderhoud toezei, en hem land gaf. En Hadad vond grote genade in de ogen van Farao, zodat hij hem tot vrouw gaf de zuster van zijn eigen vrouw, de zuster van Tachpenes, de koningin.","Dan 9:9":"Bij de Heere, onze God, zijn de barmhartigheden en vergevingen, hoewel wij tegen Hem gerebelleerd hebben.","Jer 52:3":"Want het gebeurde vanwege de toorn van de HEERE tegen Jeruzalem en Juda, totdat Hij hen van Zijn aangezicht weggeworpen had; en Zedekia kwam in opstand tegen de koning van Babel.","Jer 25:15-17":"Want zo heeft de HEERE, de God van Israël, tot mij gezegd: Neem deze beker van de wijn van de grimmigheid van Mijn hand, en geef die te drinken aan alle volken, tot wie Ik u zend; Dat zij drinken, en beven, en dol worden, vanwege het zwaard, dat Ik onder hen zal zenden. En ik nam de beker uit de hand van de HEERE, en ik gaf te drinken aan alle volken, tot wie de HEERE mij gezonden had;","Mal 1:2":"Ik heb u liefgehad, zegt de HEERE; maar u zegt: Waarin hebt U ons liefgehad? Was Ezau niet Jakobs broeder? spreekt de HEERE; toch heb Ik Jakob liefgehad,","Ps 106:29":"En zij hebben de Heere tot toorn verwekt met hun daden, zodat de plaag een inbreuk onder hen deed.","Deut 32:21":"Zij hebben Mij tot ijver verwekt door wat geen God is; zij hebben Mij tot toorn verwekt door hun ijdelheden; Ik dan zal hen tot ijver verwekken door hen die geen volk zijn; door een dwaas volk zal Ik hen tot toorn verwekken.","2 Kron 17:3":"En de HEERE was met Josafat; want hij wandelde in de eerdere wegen van zijn vader David, en zocht de Baäls niet.","2 Kron 16:10":"Doch Asa werd toornig tegen de ziener, en zette hem in de gevangenis; want hij was hierover tegen hem ontstemd; daarbij onderdrukte Asa sommigen uit het volk op dezelfde tijd.","Matt 25:14":"Want het is net als bij een mens, die naar het buitenland reisde, zijn dienstknechten riep, en hun zijn bezittingen toevertrouwde.","Deut 7:9":"U zult dan weten dat de HEERE, uw God, dié God is, de getrouwe God, Die het verbond en de goedertierenheid houdt met wie Hem liefhebben en Zijn geboden houden, tot in duizend geslachten.","2 Kon 21:3":"Want hij bouwde de hoogten weer op, die Hizkia, zijn vader, verwoest had; en hij richtte altaren voor Baäl op, en maakte een gewijde paal, zoals Achab, de koning van Israël, gemaakt had, en boog zich neer voor heel het leger van de hemel, en diende het.","Joh 8:12":"Jezus sprak dan weer tegen hen en zei: Ik ben het licht van de wereld; wie Mij volgt, zal in de duisternis niet wandelen, maar zal het licht van het leven hebben.","Hand 17:30":"God dan, Die de tijden van de onwetendheid door de vingers gezien heeft, verkondigt nu aan alle mensen, overal, dat zij zich bekeren.","1 Kron 29:19":"En geef mijn zoon Salomo een volkomen hart, om Uw geboden, Uw getuigenissen en Uw inzettingen te houden; en om alles te doen, en om dit paleis te bouwen, dat ik klaargemaakt heb.","Luk 1:78":"door de innerlijke ontferming van onze God, waarmee de Opgang uit de hoogte naar ons omgezien heeft;","Rom 12:9":"De liefde moet ongeveinsd zijn. Heb een afkeer van het kwade, en houd vast aan het goede.","Num 25:6":"En zie, een man uit de kinderen van Israël kwam, en bracht een Midianietische vrouw naar zijn broeders, voor de ogen van Mozes en voor de ogen van de hele vergadering van de kinderen van Israël, terwijl zij weenden voor de deur van de tent van de samenkomst.","2 Kron 8:8":"van hun kinderen, die na hen in het land overgebleven waren, die de kinderen van Israël niet uitgeroeid hadden, hen liet Salomo dienstplichtig werken tot op deze dag.","Gen 21:8":"En het kind werd groot en werd gespeend; toen maakte Abraham een grote maaltijd op de dag dat Izak gespeend werd.","Ps 135:14":"Want de HEERE zal Zijn volk recht doen, en het zal Hem berouwen over Zijn knechten.","1 Kon 3:5":"Te Gibeon verscheen de HEERE aan Salomo in een droom 's nachts, en God zei: Vraag wat Ik u geven zal.","Num 14:11":"En de HEERE zei tegen Mozes: Hoelang zal dit volk Mij tergen? En hoelang zullen zij niet aan Mij geloven, ondanks alle tekenen die Ik onder hen gedaan heb?","2 Tim 4:10":"Want Demas heeft mij verlaten, omdat hij de tegenwoordige wereld heeft liefgekregen, en is naar Thessalonica gereisd; Krescens naar Galatië, Titus naar Dalmatië.","Hos 4:11":"Hoererij, en wijn, en jonge wijn neemt het hart weg.","Jer 23:5":"Zie, de dagen komen, spreekt de HEERE, dat Ik voor David een rechtvaardige Spruit zal doen opstaan; Die zal Koning zijnde regeren, en voorspoedig zijn, en recht en gerechtigheid doen op de aarde.","Jer 4:26":"Ik keek, en zie, het vruchtbare land was een woestijn, en al zijn steden waren afgebroken, vanwege de HEERE, vanwege de gloed van Zijn toorn.","Jer 51:21":"En door u zal Ik in stukken slaan het paard en zijn ruiter; en door u zal Ik in stukken slaan de wagen en zijn ruiter.","Num 21:8":"En de HEERE zei tegen Mozes: Maak u een vurige slang, en zet die op een stang; en het zal gebeuren, dat ieder die gebeten is, als hij haar aanziet, zal leven.","Num 16:20":"En de HEERE sprak tot Mozes en tot Aäron, en zei:","2 Sam 10:15-19":"Toen nu de Syriërs zagen, dat zij voor Israëls aangezicht geslagen waren, verzamelden zij zich weer samen. En Hadad-Ezer zond heen, en liet de Syriërs uitkomen, die aan de overzijde van de rivier zijn, en zij kwamen te Helam; en Sobach, Hadad-Ezers legeraanvoerder, trok voor hun aangezicht heen. Toen dat aan David werd bekendgemaakt, verzamelde hij heel Israël, en trok over de Jordaan, en kwam te Helam, en de Syriërs stelden de slagorde op tegen David, en streden met hem.","1 Kor 10:20-22":"Nee, maar ik zeg dat wat de heidenen offeren, zij dat aan de duivelen offeren en niet aan God; en ik wil niet dat u gemeenschap hebt met de duivelen. U kunt niet de drinkbeker van de Heere drinken én de drinkbeker van de duivelen; u kunt niet deelhebben aan de tafel van de Heere én aan de tafel van de duivelen. Of willen wij de Heere tot jaloersheid tergen? Zijn wij soms sterker dan Hij?","Ps 106:43-46":"Hij heeft hen dikwijls gered; maar zij verbitterden Hem door hun raad, en werden uitgeteerd door hun ongerechtigheid. Toch zag Hij hun benauwdheid aan, toen Hij hun geschrei hoorde. En Hij dacht tot hun voordeel aan Zijn verbond, en het berouwde Hem naar de veelheid van Zijn blijken van goedertierenheid.","1 Petr 2:10":"U, die vroeger geen volk was, maar nu het volk van God bent; die vroeger niet ontfermd was, maar nu ontfermd bent geworden.","Ef 5:14":"Daarom zegt Hij: Ontwaak, u die slaapt, en sta op uit de doden; en Christus zal over u lichten.","Jer 9:24":"Maar wie zich beroemt, beroemt zich hierin, dat hij begrijpt, en Mij kent, dat Ik de HEERE ben, Die weldadigheid, recht en gerechtigheid doe op de aarde, want in die dingen heb Ik behagen, spreekt de HEERE.","Ex 23:32":"U zult met hen, noch met hun goden, een verbond sluiten.","Hand 15:16":"Hierna zal Ik terugkeren, en de tabernakel van David, die vervallen is, weer opbouwen; en wat ervan verwoest is, zal Ik weer opbouwen, en Ik zal hem weer oprichten,","1 Kon 21:22":"En Ik zal uw huis maken als het huis van Jerobeam, de zoon van Nebat, en als het huis van Baësa, de zoon van Ahia; om de terging waarmee u Mij getergd hebt, en dat u Israël hebt doen zondigen.","Rom 11:32":"Want God heeft hen allen onder de ongehoorzaamheid besloten, opdat Hij hun allen barmhartig zou zijn.","Gen 14:6":"en de Horieten op hun gebergte Seir, tot aan het effen veld van Paran, dat aan de woestijn is.","Ps 106:32":"Zij maakten Hem ook zeer toornig aan het twistwater, en het ging Mozes kwalijk om hunnentwil.","Joz 7:1":"Maar de kinderen van Israël overtraden door overtreding met het verbannene; want Achan, de zoon van Charmi, de zoon van Zabdi, de zoon van Zerah, uit de stam van Juda, nam van het verbannene. Toen ontstak de toorn van de HEERE tegen de kinderen van Israël.","Ps 90:8":"U stelt onze ongerechtigheden voor U, onze heimelijke zonden in het licht van uw aangezicht.","Matt 2:13":"Toen zij vertrokken waren, zie, de engel van de Heere verschijnt aan Jozef in de droom en zegt: Sta op, neem het Kindje en Zijn moeder tot u, en vlucht naar Egypte, en blijf daar totdat ik het u zeg; want Herodes zal het Kindje zoeken om Het te doden.","Num 24:10-13":"Toen ontstak de toorn van Balak tegen Bileam, en hij sloeg zijn handen samen; en Balak zei tegen Bileam: Ik heb u geroepen om mijn vijanden te vervloeken; maar zie, u hebt hen nu al driemaal gezegend! En nu, pak u weg naar uw plaats! Ik had gezegd dat ik u hoog zou eren; maar zie, de HEERE heeft u die eer onthouden! Toen zei Bileam tegen Balak: Heb ik ook niet tegen uw boden, die u naar mij gezonden hebt, gesproken en gezegd:","Gen 19:12":"Toen zeiden die mannen tegen Lot: Wie hebt u hier nog meer? Een schoonzoon, of uw zonen, of uw dochters, en allen die u in deze stad hebt, breng hen weg uit deze plaats;","Spr 16:33":"Het lot wordt in de schoot geworpen; maar de hele beschikking daarover is van de HEERE.","1 Kon 14:23":"Want ook zij bouwden zich hoogten, en gewijde stenen, en gewijde palen, op elke hoge heuvel, en onder elke bladerrijke boom.","2 Sam 15:30":"En David ging op door de opgang van de olijven, terwijl hij opging en weende, en zijn hoofd was bedekt; en hij zelf ging blootsvoets; ook had heel het volk dat bij hem was, ieder zijn hoofd bedekt, en zij gingen op, terwijl zij opgingen en weenden.","Ex 2:25":"En God zag de kinderen van Israël aan, en God kende hen.","2 Sam 24:16":"Toen nu de engel zijn hand uitstrekte over Jeruzalem om haar te verderven, kreeg de HEERE berouw over dat kwaad, en Hij zei tegen de engel die het verderf onder het volk aanrichtte: Het is genoeg, trek uw hand nu terug. De engel van de HEERE was nu bij de dorsvloer van Arauna, de Jebusiet.","Ex 20:5":"U zult zich daarvoor niet buigen, en ze niet dienen; want Ik, de HEERE, uw God, ben een ijverig God, Die de misdaad van de vaders bezoek aan de kinderen, aan het derde en aan het vierde geslacht van hen die Mij haten;","2 Tim 2:14":"Breng deze dingen in gedachtenis, en houd hun voor, voor de Heere, dat zij geen woordenstrijd voeren, wat tot niets nut is, dan tot verderf van de toehoorders.","1 Kon 2:10":"En David ontsliep met zijn vaderen, en werd begraven in de stad van David.","Luk 22:35":"En Hij zei tegen hen: Toen Ik u uitzond zonder buidel en tas en schoenen, heeft u toen iets ontbroken? En zij zeiden: Niets.","2 Sam 24:1":"En de toorn van de HEERE ging verder tegen Israël ontsteken; en Hij porde David tegen hen aan en zei: Ga, tel Israël en Juda.","Jes 10:26":"Want de HEERE van de heerscharen zal tegen hem een gesel verwekken, gelijk de slachting van Midian was bij de rots van Oreb; en zoals Zijn staf over de zee was, die Hij verheffen zal, naar de wijze van de Egyptenaren.","Jer 22:19":"Met een ezelsbegrafenis zal hij begraven worden; men zal hem slepen en wegwerpen, ver weg van de poorten van Jeruzalem.","Matt 13:24":"Een andere gelijkenis heeft Hij hun voorgehouden en zei: Het Koninkrijk der hemelen is gelijk aan een mens die goed zaad zaaide in zijn akker.","Jes 26:11":"HEERE, is Uw hand verhoogd, zij zien het niet; maar zij zullen het zien, en beschaamd worden, vanwege de ijver over Uw volk, ook zal het vuur Uw tegenstanders verteren.","Gen 25:23":"En de HEERE zei tegen haar: Twee volken zijn in uw buik, en twee naties zullen zich uit uw ingewand van elkaar scheiden; en het ene volk zal sterker zijn dan het andere volk; en de oudste zal de jongste dienen.","Ezra 9:7-14":"Vanaf de dagen van onze vaderen zijn wij in grote schuld tot op deze dag; en wij zijn om onze ongerechtigheden overgegeven, wij, onze koningen en onze priesters, in de hand van de koningen van de landen, aan het zwaard, aan gevangenschap, en aan roof, en aan schaamte van het aangezicht, zoals het is op deze dag. En nu is er, als een klein ogenblik, een genade gebeurd van de HEERE, onze God, om ons een ontkoming over te laten, en ons een nagel te geven in Zijn heilige plaats, om onze ogen te verlichten, o onze God, en om ons een weinig leven te geven in onze dienstbaarheid. Want wij zijn knechten; maar in onze dienstbaarheid heeft onze God ons niet verlaten; maar Hij heeft weldadigheid tot ons geneigd voor het aangezicht van de koningen van Perzië, dat Hij ons een weinig leven zou geven, om het huis van onze God te verhogen, en de woestenijen ervan op te richten, en om ons een muur te geven in Juda en te Jeruzalem.","Hand 9:2":"en vroeg hem om brieven aan de synagogen in Damaskus, opdat hij, als hij daar iemand zou vinden die van die weg was, zowel mannen als vrouwen, hen gebonden naar Jeruzalem zou brengen.","Deut 23:4":"Vanwege dat zij u onderweg niet tegemoet gekomen zijn met brood en met water, toen u uit Egypte wegtrok; en omdat hij tegen u Bileam gehuurd heeft, de zoon van Beor, uit Pethor in Mesopotamië, om u te vloeken.","Joz 7:26":"En zij richtten over hem een grote steenhoop op, die er tot op deze dag nog is. Zo keerde de HEERE zich af van de gloed van Zijn toorn. Daarom noemde men de naam van die plaats het dal van Achor, tot op deze dag toe.","Ps 60:3":"O God! U had ons verstoten, U had ons uiteengescheurd, U bent toornig geweest; keer terug tot ons.","1 Kon 11:1-5":"En koning Salomo had, behalve de dochter van Farao, veel vreemde vrouwen lief: Moabitische, Ammonitische, Edomitische, Sidonische en Hethitische vrouwen; van de volken waarvan de HEERE tegen de kinderen van Israël gezegd had: U zult tot hen niet ingaan, en zij zullen tot u niet inkomen; zij zouden zeker uw hart naar hun goden doen neigen; aan deze hing Salomo met liefde. En hij had zevenhonderd vrouwen, vorstinnen, en driehonderd bijvrouwen, en zijn vrouwen deden zijn hart neigen.","Openb 5:8":"En toen Het dat boek genomen had, vielen de vier dieren en de vierentwintig oudsten voor het Lam neer, elk met een citer en gouden schalen vol reukwerk, dat zijn de gebeden van de heiligen.","Est 9:25":"Maar toen zij voor de koning gekomen was, heeft hij door brieven bevolen dat zijn boze plan, dat hij bedacht had tegen de Joden, op zijn eigen hoofd zou terugkeren; en men heeft hem en zijn zonen aan de galg gehangen.","Jer 33:8":"En Ik zal hen reinigen van al hun ongerechtigheid, waarmee zij tegen Mij gezondigd hebben; en Ik zal al hun ongerechtigheden vergeven, waarmee zij tegen Mij gezondigd en waarmee zij tegen Mij overtreden hebben.","Ps 78:50":"Hij baande een pad voor Zijn toorn; Hij onttrok hun ziel niet aan de dood; en hun gedierte gaf Hij over aan de pestilentie.","Dan 2:21":"Want Hij verandert de tijden en de tijdperken; Hij zet koningen af en Hij stelt koningen aan; Hij geeft de wijzen wijsheid, en kennis aan hen die verstand hebben.","2 Kor 6:14-16":"Trek niet een ander juk aan met de ongelovigen; want wat heeft de gerechtigheid gemeen met de ongerechtigheid, en welke gemeenschap heeft het licht met de duisternis? En welke overeenstemming heeft Christus met Belial, of welk deel heeft de gelovige met de ongelovige? Of welke samenvoeging heeft de tempel van God met de afgoden? Want u bent de tempel van de levende God; zoals God gezegd heeft: Ik zal in hen wonen, en Ik zal onder hen wandelen; en Ik zal hun God zijn, en zij zullen Mij een volk zijn.","2 Kron 10:15-17":"Zo luisterde de koning niet naar het volk; want deze ommekeer kwam van God, opdat de HEERE Zijn woord zou bevestigen, dat Hij door de dienst van Ahia, de Siloniet, gesproken had tot Jerobeam, de zoon van Nebat. Toen heel het volk Israël zag dat de koning niet naar hen luisterde, antwoordde het volk de koning en zei: Wat deel hebben wij aan David? Ja, geen erfdeel hebben wij aan de zoon van Isaï; ieder naar uw tenten, o Israël! Zorg nu voor uw eigen huis, o David! Zo ging heel Israël naar zijn tenten. Doch over de kinderen van Israël die in de steden van Juda woonden, over hen regeerde Rehabeam wel.","1 Kor 10:11":"En al deze dingen zijn hun overkomen tot voorbeelden; en ze zijn beschreven tot waarschuwing voor ons, over wie het einde van de eeuwen gekomen is.","2 Kon 23:13":"De hoogten ook, die vooraan bij Jeruzalem waren, die aan de rechterhand van de berg Mashith lagen, die Salomo, de koning van Israël, gebouwd had voor Astoreth, het verfoeisel van de Sidoniërs, en voor Kamos, het verfoeisel van de Moabieten, en voor Milchom, de gruwel van de kinderen van Ammon, verontreinigde de koning.","2 Sam 7:26-29":"En laat Uw Naam groot gemaakt worden tot in eeuwigheid, zodat men zegt: De HEERE van de heerscharen is God over Israël; en het huis van Uw knecht David zal bestendig zijn voor Uw aangezicht. Want U, HEERE van de heerscharen, God van Israël! U hebt het voor het oor van Uw knecht geopenbaard, en gezegd: Ik zal u een huis bouwen; daarom heeft Uw knecht in zijn hart gevonden, dit gebed tot U te bidden. Nu dan, Heere HEERE! U bent die God, en Uw woorden zullen waarheid zijn, en U hebt dit goede tot Uw knecht gesproken.","Jer 31:34":"En zij zullen niet meer, ieder zijn naaste, en ieder zijn broeder, onderwijzen door te zeggen: Kent de HEERE! Want zij zullen Mij allen kennen, van hun kleinste tot hun grootste toe, spreekt de HEERE; want Ik zal hun ongerechtigheid vergeven, en aan hun zonden niet meer denken.","2 Tim 2:18":"die van de waarheid zijn afgeweken, en zeggen dat de opstanding al gebeurd is, en het geloof van sommigen omverwerpen.","Richt 2:18":"En wanneer de HEERE hun richters verwekte, zo was de HEERE met de richter, en verloste hen uit de hand van hun vijanden, al de dagen van de richter; want het berouwde de HEERE vanwege hun zuchten om hen die hen drongen en die hen drukten.","Gen 12:2":"En Ik zal u tot een groot volk maken, en u zegenen, en uw naam groot maken; en wees een zegen!","Rom 15:9":"en dat de heidenen God zouden verheerlijken vanwege de barmhartigheid; zoals geschreven is: Daarom zal ik U belijden onder de heidenen, en Uw Naam lofzingen.","1 Kon 16:2-13":"Omdat Ik u uit het stof heb verheven, en u tot een voorganger over Mijn volk Israël heb aangesteld, en u gewandeld hebt in de weg van Jerobeam, en Mijn volk Israël hebt doen zondigen, en Mij tot toorn hebt verwekt door hun zonden; Zie, zo zal Ik de nakomelingen van Baësa, en de nakomelingen van zijn huis wegdoen; en Ik zal uw huis maken zoals het huis van Jerobeam, de zoon van Nebat. Wie van Baësa in de stad sterft, zullen de honden opeten, en wie van hem in het veld sterft, zullen de vogels van de hemel opeten.","Matt 2:12":"En omdat zij door God in een droom gewaarschuwd waren dat zij niet naar Herodes zouden terugkeren, vertrokken zij via een andere weg naar hun land.","Jes 1:18":"Kom dan, en laten wij samen rechten, zegt de HEERE; al waren uw zonden als scharlaken, zij zullen wit worden als sneeuw, al waren zij rood als karmozijn, zij zullen worden als witte wol.","Dan 11:27":"En het hart van beide koningen zal erop gericht zijn kwaad te doen, en aan één tafel zullen zij leugen spreken; en het zal niet lukken, want het zal nog een einde hebben op de vastgestelde tijd.","2 Petr 3:9":"De Heere stelt Zijn belofte niet uit (zoals sommigen dat als uitstel zien), maar Hij is geduldig voor ons, omdat Hij niet wil dat er iemand verloren gaat, maar dat allen tot bekering komen.","2 Kron 29:2":"En hij deed wat recht was in de ogen van de HEERE, naar alles wat zijn vader David gedaan had.","1 Kon 15:30":"Om de zonden van Jerobeam, die hij gezondigd had, en die hij Israël had doen zondigen, en om zijn terging, waarmee hij de HEERE, de God van Israël, getergd had.","Gal 3:1":"O onverstandige Galaten, wie heeft u betoverd, dat u de waarheid niet zou gehoorzamen? U voor wie ogen Jezus Christus is voorgeschilderd, onder u gekruisigd.","2 Kron 30:9":"Want als u zich bekeert tot de HEERE, zullen uw broeders en uw kinderen barmhartigheid vinden bij hen die hen gevangen hebben genomen, zodat zij in dit land zullen terugkomen; want de HEERE, uw God, is genadig en barmhartig, en zal Zijn aangezicht niet van u afwenden, als u zich tot Hem bekeert.","Ps 99:8":"O HEERE, onze God! U hebt hen verhoord, U bent hun geweest een vergevend God, hoewel U wraak deed over hun daden.","Gen 7:1":"Daarna zei de HEERE tegen Noach: Ga u, en heel uw huis in de ark; want u heb Ik gezien als rechtvaardige voor Mijn aangezicht in dit geslacht.","Jes 44:3-5":"Want Ik zal water gieten op de dorstige, en stromen op het droge; Ik zal Mijn Geest op uw nageslacht gieten, en Mijn zegen op uw nakomelingen. En zij zullen uitspruiten tussen het gras, als de wilgen aan de waterbeken. Deze zal zeggen: Ik ben van de HEERE; en die zal zich noemen met de naam van Jakob; en weer een ander zal met zijn hand schrijven: Ik ben van de HEERE, en zich noemen met de naam van Israël.","Ps 130:4":"Maar bij U is vergeving, opdat U gevreesd wordt.","Openb 21:23":"En de stad heeft de zon en de maan niet nodig, om in haar te schijnen; want de heerlijkheid van God heeft haar verlicht, en het Lam is haar lamp.","Jes 17:6":"Toch zal er een nalezing in overblijven, zoals bij het afschudden van de olijfboom, twee of drie bezien in de top van de opperste twijg, en vier of vijf aan zijn vruchtbare takken, spreekt de HEERE, de God van Israël.","Gen 26:24":"En de HEERE verscheen hem diezelfde nacht, en zei: Ik ben de God van Abraham, uw vader; wees niet bang; want Ik ben met u; en Ik zal u zegenen, en uw nageslacht vermenigvuldigen, omwille van Abraham, Mijn knecht.","Luk 1:50":"En Zijn barmhartigheid is van geslacht tot geslacht over hen die Hem vrezen.","Hand 3:18":"Maar God heeft zo vervuld wat Hij door de mond van al Zijn profeten van tevoren had verkondigd, dat de Christus zou lijden.","2 Sam 8:14":"En hij legde bezettingen in Edom; in heel Edom legde hij bezettingen; en alle Edomieten werden David tot knechten; en de HEERE behoedde David overal waar hij heentrok.","2 Kon 20:3":"Och, HEERE, gedenk toch dat ik voor Uw aangezicht in waarheid en met een volkomen hart gewandeld heb, en gedaan heb wat goed is in Uw ogen. En Hizkia huilde erg veel.","2 Sam 3:2-5":"En David werden zonen geboren in Hebron. Zijn eerstgeborene was Amnon, van Ahinoam, de Jizreëlietische; en zijn tweede was Chileab, van Abigaïl, de vrouw van Nabal, de Karmeliet; en de derde, Absalom, de zoon van Maächa, de dochter van Thalmai, koning van Gesur; en de vierde, Adonia, de zoon van Haggith; en de vijfde Sefatja, de zoon van Abital;","Ps 127:1":"Een lied Hammaaloth¹, van Salomo. Als de HEERE het huis niet bouwt, werken de bouwers eraan tevergeefs; als de HEERE de stad niet bewaart, waakt de wachter tevergeefs.","Hos 4:12":"Mijn volk vraagt zijn hout om raad, en zijn stok zal het hem bekendmaken; want de geest van de hoererijen verleidt hen, zodat zij van onder hun God weghoereren.","Hab 3:2":"HEERE! Toen ik Uw rede gehoord heb, ben ik bevreesd geworden; Uw werk, o HEERE! Behoud dat in het leven in het midden van de jaren, maak het bekend in het midden van de jaren; gedenk in de toorn aan het ontfermen.","Jes 29:14":"daarom, zie, Ik zal verder wonderlijk handelen met dit volk, wonderlijk en wonderbaarlijk; want de wijsheid van zijn wijzen zal vergaan, en het verstand van zijn verstandigen zal zich verbergen.","Ezra 9:1":"Toen deze dingen voltooid waren, kwamen de vorsten naar mij toe en zeiden: Het volk van Israël, en de priesters, en de Levieten, hebben zich niet afgezonderd van de volken van deze landen, naar hun gruwelen, namelijk van de Kanaänieten, de Hethieten, de Ferezieten, de Jebusieten, de Ammonieten, de Moabieten, de Egyptenaren en de Amorieten.","Ps 74:1":"Een onderwijzing, voor Asaf. O God! Waarom verstoot U ons voor eeuwig? Waarom zou Uw toorn roken tegen de schapen van Uw weide?","Luk 1:32":"Hij zal groot zijn, en de Zoon van de Allerhoogste genoemd worden; en God, de Heere, zal Hem de troon van Zijn vader David geven.","Spr 6:23":"Want het gebod is een lamp, en de wet is een licht, en de vermaningen van de tucht zijn de weg van het leven;","Joz 11:20":"Want het was van de HEERE om hun harten te verharden, zodat zij Israël in de strijd tegemoet gingen, opdat Hij hen met de ban zou treffen, zodat hun geen genade te beurt viel, maar opdat Hij hen zou vernietigen, zoals de HEERE Mozes geboden had.","1 Kon 11:7-10":"Toen bouwde Salomo een hoogte voor Kamos, het verfoeisel van de Moabieten, op de berg die tegenover Jeruzalem ligt, en voor Molech, het verfoeisel van de kinderen Ammons. En zo deed hij voor al zijn vreemde vrouwen, die hun goden reukoffers brachten en offerden. Daarom vertoornde de HEERE Zich tegen Salomo, omdat hij zijn hart van de HEERE, de God van Israël, had afgewend, Die hem tweemaal verschenen was,","1 Kon 15:25":"Nadab nu, de zoon van Jerobeam, werd koning over Israël, in het tweede jaar van Asa, de koning van Juda; en hij regeerde twee jaren over Israël.","Spr 4:23":"Behoed uw hart boven alles wat te bewaren is, want daaruit komt het leven voort.","2 Kron 7:17-22":"En wat u betreft, als u voor Mijn aangezicht wandelt, zoals uw vader David gewandeld heeft, en doet naar alles wat Ik u geboden heb, en Mijn inzettingen en Mijn rechten houdt; Dan zal Ik de troon van uw koninkrijk bevestigen, zoals Ik een verbond met uw vader David gemaakt heb, en zei: Er zal u geen man afgesneden worden die in Israël heerst. Maar als u zich afkeert, en Mijn inzettingen en Mijn geboden, die Ik voor uw aangezicht gegeven heb, verlaat, en heengaat, en andere goden dient, en u voor die neerbuigt;","Ezech 13:5":"U bent niet in de bressen opgetreden, en hebt de muur niet toegemuurd voor het huis van Israël, om in de strijd te staan, op de dag van de HEERE.","1 Kon 8:23":"en hij zei: HEERE, God van Israël, er is geen God zoals U, boven in de hemel, noch beneden op de aarde, Die het verbond en de goedertierenheid houdt aan Uw dienaren, die voor Uw aangezicht met hun hele hart wandelen;","Jer 7:31":"En zij hebben de hoogten van Tofeth gebouwd, dat in het dal van de zoon van Hinnom is, om hun zonen en hun dochters met vuur te verbranden; wat Ik niet heb geboden, en wat niet in Mijn hart is opgekomen.","1 Kon 11:29-36":"Het gebeurde nu in die tijd, toen Jerobeam uit Jeruzalem wegging, dat de profeet Ahia, de Siloniet, hem op de weg vond; hij had zich een nieuw kleed aangedaan, en zij beiden waren alleen op het veld; toen greep Ahia het nieuwe kleed dat hij aanhad, en scheurde het in twaalf stukken. En hij zei tegen Jerobeam: Neem tien stukken voor uzelf; want zo zegt de HEERE, de God van Israël: Zie, Ik zal het koninkrijk uit de hand van Salomo scheuren, en u tien stammen geven.","Matt 2:20":"en zegt: Sta op, neem het Kindje en Zijn moeder tot u, en ga naar het land Israël; want zij zijn gestorven die het leven van het Kindje zochten.","Hand 3:19":"Kom dus tot inkeer en bekeer u, opdat uw zonden uitgewist worden, wanneer de tijden van verkwikking gekomen zijn van het aangezicht van de Heere,","1 Kron 28:9":"En u, mijn zoon Salomo, ken de God van uw vader, en dien Hem met een volkomen hart en met een gewillige ziel; want de HEERE doorzoekt alle harten, en Hij doorziet elk bedenksel van de gedachten; als u Hem zoekt, zal Hij door u gevonden worden; maar als u Hem verlaat, zal Hij u voor altijd verstoten.","2 Sam 5:13-16":"En David nam nog meer bijvrouwen en vrouwen uit Jeruzalem, nadat hij uit Hebron gekomen was; en David werden nog meer zonen en dochters geboren. En dit zijn de namen van hen die hem in Jeruzalem geboren zijn: Schammua, en Schobab, en Nathan, en Salomo. En Ibchar, en Elischua, en Nefeg, en Jafia,","Num 25:18":"want zij hebben vijandig tegen u gehandeld door hun listen, waarmee zij u listig bedrogen hebben in de zaak van Peor, en in de zaak van Kozbi, de dochter van de leider van de Midianieten, hun zuster, die gedood is ten dage van de plaag, om de zaak van Peor.","Jer 43:7-9":"en zij trokken naar Egypteland, want zij waren aan de stem van de HEERE niet gehoorzaam; en zij kwamen tot Tachpanhes. Toen kwam het woord van de HEERE tot Jeremia te Tachpanhes, en Hij zei: Neem grote stenen in uw hand, en verberg ze in de klei in de ticheloven, die bij de deur van Farao's huis te Tachpanhes is, voor de ogen van de Joodse mannen;","1 Kon 2:34":"En Benaja, de zoon van Jojada, ging omhoog, en viel op hem aan, en doodde hem; en hij werd begraven in zijn huis, in de woestijn.","2 Kon 20:19":"Maar Hizkia zei tegen Jesaja: Het woord van de HEERE, dat u gesproken hebt, is goed. Ook zei hij: Zou het niet goed zijn, als er vrede en waarheid in mijn dagen zal zijn?","1 Kron 27:24":"Joab, de zoon van Zeruja, had begonnen te tellen, maar hij maakte het niet af, omdat er vanwege deze telling grote toorn over Israël gekomen was; daarom is het getal niet opgenomen in de rekening van de kronieken van koning David.","Joz 14:8":"Maar mijn broeders, die met mij opgegaan waren, deden het hart van het volk smelten; maar ik volhardde erin de HEERE, mijn God, na te volgen.","Num 14:35":"Ik, de HEERE, heb gesproken: zo zal Ik zeker doen aan deze hele slechte vergadering van hen die zich tegen Mij verzameld hebben; zij zullen in deze woestijn omkomen, en zullen daar sterven!","2 Sam 12:9-12":"Waarom hebt u dan het woord van de HEERE veracht, door te doen wat kwaad is in Zijn ogen? U hebt Uria, de Hethiet, met het zwaard verslagen, en zijn vrouw hebt u tot uw vrouw genomen; en hem hebt u met het zwaard van de kinderen van Ammon gedood. Nu dan, het zwaard zal niet van uw huis wijken tot in eeuwigheid, omdat u Mij veracht hebt, en de vrouw van Uria, de Hethiet, genomen hebt, zodat zij uw vrouw is geworden. Zo zegt de HEERE: Zie, Ik zal kwaad over u verwekken uit uw eigen huis, en Ik zal uw vrouwen nemen voor uw ogen, en zal ze aan uw naaste geven; die zal bij uw vrouwen liggen, voor de ogen van deze zon.","Ps 37:26":"De hele dag ontfermt hij zich, en leent; en zijn nageslacht is tot zegen.","Spr 16:6":"Door goedertierenheid en trouw wordt de misdaad verzoend; en door de vreze van de HEERE wijkt men af van het kwade.","Num 22:12-18":"Toen zei God tegen Bileam: U mag niet met hen meegaan; u mag dat volk niet vervloeken, want het is gezegend. Toen stond Bileam 's morgens op, en zei tegen de vorsten van Balak: Ga naar uw land; want de HEERE weigert mij toe te staan met u mee te gaan. Toen stonden de vorsten van Moab op, en kwamen bij Balak, en zij zeiden: Bileam heeft geweigerd met ons mee te gaan.","Jes 11:1-10":"Want er zal een Rijsje voortkomen uit de afgehouwen tronk van Isaï, en een Scheut uit zijn wortels zal vrucht voortbrengen. En op Hem zal de Geest van de HEERE rusten, de Geest van wijsheid en van verstand, de Geest van raad en van sterkte, de Geest van kennis en van vreze van de HEERE. En Zijn vreugde zal zijn in de vreze van de HEERE; en Hij zal niet oordelen naar wat Zijn ogen zien, en niet bestraffen naar wat Zijn oren horen.","Jer 36:6":"Ga daarom zelf heen, en lees uit de rol waarin u uit mijn mond geschreven hebt de woorden van de HEERE, voor de oren van het volk, in het huis van de HEERE, op de vastendag; en u zult ze ook lezen voor de oren van heel Juda, die uit hun steden komen.","1 Kon 14:21":"Rehabeam nu, de zoon van Salomo, regeerde in Juda; eenenveertig jaren was Rehabeam oud toen hij koning werd, en hij regeerde zeventien jaren te Jeruzalem, in de stad die de HEERE gekozen had uit al de stammen van Israël, om Zijn Naam daar te vestigen; en de naam van zijn moeder was Naäma, de Ammonietische.","1 Kor 15:10":"Maar door de genade van God ben ik wat ik ben; en Zijn genade die aan mij bewezen is, is niet tevergeefs geweest, maar ik heb overvloediger gewerkt dan zij allen; toch niet ik, maar de genade van God, Die met mij is.","Num 33:52":"dan zult u alle inwoners van het land voor uw aangezicht uit hun bezit verdrijven, en al hun afbeeldingen vernietigen; ook zult u al hun gegoten beelden vernietigen, en al hun hoogten met de grond gelijkmaken.","Jer 33:5":"Er zijn er wel gekomen om te strijden tegen de Chaldeeën, maar het is om die te vullen met de dode lichamen van mensen die Ik verslagen heb in Mijn toorn en in Mijn grimmigheid; en omdat Ik Mijn aangezicht van deze stad verborgen heb, vanwege al hun slechtheid.","Joël 3:21":"En Ik zal hun bloed reinigen, dat Ik niet gereinigd had; en de HEERE zal wonen op Sion.","Jer 17:4":"Zo zult u aflaten (en dat om uzelf) van uw erfenis, die Ik u gegeven heb, en Ik zal u uw vijanden doen dienen in een land, dat u niet kent; want u hebt een vuur aangestoken in Mijn toorn, tot in eeuwigheid zal het branden.","2 Kon 21:26":"En men begroef hem in zijn graf, in de tuin van Uzza; en zijn zoon Josia werd koning in zijn plaats.","2 Kon 25:26":"Toen maakte heel het volk zich op, van de minste tot de grootste, en de aanvoerders van de legers, en zij kwamen in Egypte; want zij waren bang voor de Chaldeeën.","Num 22:41":"En het gebeurde 's morgens, dat Balak Bileam meenam, en hem bracht naar de hoogten van Baäl, zodat hij vandaar het uiterste deel van het volk kon zien.","Joh 1:4":"In Hem was het Leven, en het Leven was het Licht van de mensen.","2 Sam 14:14":"Want wij moeten sterven, en zijn als water dat, uitgestort op de aarde, niet meer verzameld kan worden. God zal echter het leven niet wegnemen, maar Hij zal er middelen op bedenken, dat Hij de verstotene niet van Zich verstoot.","Luk 2:32":"een licht tot verlichting van de heidenen, en tot heerlijkheid van Uw volk Israël.","2 Sam 8:3-13":"David sloeg ook Hadad-Ezer, de zoon van Rechob, de koning van Zoba, toen hij op weg ging om zijn macht te herstellen tot aan de rivier Frath. En David nam hem duizend wagens af, en zevenhonderd ruiters, en twintigduizend man voetvolk; en David sneed de pezen door van alle wagenpaarden, en hield daarvan honderd wagens over. En de Syriërs van Damaskus kwamen om Hadad-Ezer, de koning van Zoba, te helpen; maar David sloeg van de Syriërs tweeëntwintigduizend man.","Ps 90:7":"Want wij vergaan door Uw toorn; en door Uw grimmigheid worden wij verschrikt.","Gen 19:15":"En toen de dageraad opging, drongen de engelen bij Lot aan en zeiden: Maak u klaar, neem uw vrouw, en uw twee dochters die hier zijn, opdat u niet omkomt door de ongerechtigheid van deze stad.","Ps 118:1-4":"Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig. Laat Israël nu zeggen, dat Zijn goedertierenheid voor eeuwig is. Laat het huis van Aäron nu zeggen, dat Zijn goedertierenheid voor eeuwig is.","Jes 55:7-9":"De goddeloze verlaat zijn weg, en de onrechtvaardige man zijn gedachten; en hij bekeert zich tot de HEERE, zo zal Hij Zich over hem ontfermen, en tot onze God, want Hij vergeeft menigvuldig. Want Mijn gedachten zijn niet uw gedachten, en uw wegen zijn niet Mijn wegen, spreekt de HEERE. Want zoals de hemelen hoger zijn dan de aarde, zo zijn Mijn wegen hoger dan uw wegen, en Mijn gedachten dan uw gedachten.","Jes 57:18":"Ik zie zijn wegen, en Ik zal hem genezen; en Ik zal hem leiden, en hem vertroostingen teruggeven, namelijk aan hen die om hem treuren.","Gen 45:24":"En hij zond zijn broers heen; en zij vertrokken; en hij zei tegen hen: Maak geen ruzie op de weg.","Ps 118:29":"Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig.","Hand 5:38":"En nu zeg ik u: Houd u afzijdig van deze mensen, en laat hen gaan; want als deze raad of dit werk uit mensen is, zal het gebroken worden;","Ps 138:2":"Ik zal mij neerbuigen naar het paleis van Uw heiligheid, en ik zal Uw Naam loven, om Uw goedertierenheid en om Uw waarheid; want Gij hebt vanwege Uw hele Naam Uw woord groot gemaakt.","Ex 2:1-10":"En een man van het huis van Levi ging heen, en nam een dochter van Levi tot vrouw. En de vrouw werd zwanger en baarde een zoon. Toen zij zag dat hij mooi was, verborg zij hem drie maanden. Maar toen zij hem niet langer verbergen kon, nam zij voor hem een mandje van biezen, en bestreek het met lijm en met pek; en zij legde het kind daarin, en legde het in de biezen, aan de oever van de rivier.","Ps 65:4":"Onrechtvaardige dingen hadden de overhand over mij; maar onze overtredingen, die verzoent U.","Tit 3:5":"Heeft Hij ons zalig gemaakt, niet uit de werken van de rechtvaardigheid die wij gedaan hadden, maar naar Zijn barmhartigheid, door het bad van de wedergeboorte en de vernieuwing door de Heilige Geest;","1 Kron 28:6":"En Hij heeft tegen mij gezegd: Uw zoon Salomo, die zal Mijn huis en Mijn voorhoven bouwen; want Ik heb hem voor Mij verkoren tot een zoon, en Ik zal hem tot een Vader zijn.","1 Kon 5:16":"Behalve de leiders van Salomo's aanvoerders, die over dat werk waren, drieduizend driehonderd, die heerschappij hadden over het volk, dat dat werk deed.","Jes 41:2":"Wie heeft van de opgang die rechtvaardige verwekt? Heeft hem geroepen om hem op zijn voet te doen staan? De heidenvolken voor zijn aangezicht gegeven, en gemaakt dat hij over koningen heerste? Heeft hun zijn zwaard gegeven als stof, zijn boog als een voortgedreven stoppel?","Est 6:1-12":"Diezelfde nacht kon de koning niet slapen, en hij zei dat men het boek van de gedenkwaardigheden, de kronieken, moest brengen; en die werden voorgelezen in de tegenwoordigheid van de koning. En men vond geschreven dat Mordechai had bekendgemaakt dat Bigthana en Theres, twee kamerlingen van de koning, uit de dorpelwachters, van plan waren de hand te leggen aan koning Ahasveros. Toen zei de koning: Welke eer en verhoging is Mordechai hiervoor gegeven? En de knechten van de koning, zijn dienaars, zeiden: Aan hem is niets gegeven.","Jer 21:5":"En Ik Zelf zal tegen u strijden, met een uitgestrekte hand en met een sterke arm, ja, met toorn, en met grimmigheid, en met grote verbolgenheid.","1 Kon 9:15":"Dit is nu de reden van het uitschot, dat de koning Salomo liet opkomen, om het huis van de HEERE te bouwen, en zijn huis, en Millo, en de muur van Jeruzalem, alsook Hazor, en Megiddo, en Gezer.","Richt 10:16":"En zij deden de vreemde goden uit hun midden weg, en dienden de HEERE. Toen werd Zijn ziel verdrietig over de ellende van Israël.","Matt 5:14":"U bent het licht der wereld; een stad die boven op een berg ligt, kan niet verborgen zijn.","Ezra 9:12":"Zo zult u nu uw dochters niet geven aan hun zonen, en hun dochters niet nemen voor uw zonen, en zult hun vrede en hun welvaart niet zoeken, tot in eeuwigheid; opdat u sterk wordt, en het goede van het land eet, en uw kinderen het laat erven tot in eeuwigheid.","Ezech 14:14":"Ofschoon deze drie mannen, Noach, Daniël en Job, in het midden daarvan zouden zijn, zouden zij door hun gerechtigheid alleen hun eigen ziel bevrijden, spreekt de Heere HEERE.","2 Kron 26:23":"En Uzzia ontsliep met zijn vaderen, en zij begroeven hem bij zijn vaderen, in het veld van de begrafenis dat van de koningen was; want zij zeiden: hij is melaats; en zijn zoon Jotham werd koning in zijn plaats.","Jes 13:13":"Daarom zal Ik de hemel beroeren, en de aarde zal bewogen worden van haar plaats, vanwege de verbolgenheid van de HEERE van de heerscharen, en vanwege de dag van Zijn hevige toorn.","1 Kon 3:14":"En als u in Mijn wegen wandelt en Mijn inzettingen en Mijn geboden onderhoudt, zoals uw vader David gewandeld heeft, dan zal Ik ook uw dagen verlengen.","Gen 26:3":"Woon als vreemdeling in dat land, en Ik zal met u zijn, en zal u zegenen; want aan u en uw nageslacht zal Ik al deze landen geven, en Ik zal de eed bevestigen die Ik Abraham, uw vader, gezworen heb.","Jes 65:23":"Zij zullen niet tevergeefs arbeiden, noch baren voor verstoring; want zij zijn het nageslacht van de gezegenden van de HEERE, en hun nakomelingen met hen.","Ps 100:5":"Want de HEERE is goed; Zijn goedertierenheid is eeuwig, en Zijn trouw van geslacht tot geslacht.","Jes 57:19":"Ik schep de vrucht van de lippen: vrede, vrede voor hen die ver weg zijn, en voor hen die dichtbij zijn, zegt de HEERE, en Ik zal hen genezen.","Joh 3:19-21":"En dit is het oordeel: dat het licht in de wereld gekomen is, en de mensen hebben de duisternis liever gehad dan het licht; want hun werken waren slecht. Want ieder die kwaad doet, haat het licht en komt niet tot het licht, opdat zijn werken niet bestraft worden. Maar wie de waarheid doet, komt tot het licht, opdat van zijn werken openbaar wordt dat zij in God gedaan zijn.","Jes 57:16":"Want Ik zal niet eeuwig twisten, en Ik zal niet voortdurend toornig zijn; want de geest zou van voor Mijn aangezicht bezwijken, en de zielen die Ik gemaakt heb.","Jes 65:2":"Ik heb Mijn handen uitgebreid, de hele dag, tot een opstandig volk, dat wandelt op een weg die niet goed is, naar hun eigen gedachten.","2 Sam 7:15":"Maar Mijn goedertierenheid zal van hem niet wijken, zoals Ik die weggenomen heb van Saul, die Ik van voor uw aangezicht heb weggenomen.","Num 32:13":"Zo ontstak de toorn van de HEERE tegen Israël, en Hij liet hen ronddwalen in de woestijn, veertig jaar lang, totdat heel het geslacht verteerd was dat gedaan had wat kwaad was in de ogen van de HEERE.","Ps 86:5":"Want Gij, Heere! zijt goed, en vergeeft graag, en van grote goedertierenheid voor allen die U aanroepen.","1 Kon 14:19":"Het overige nu van de geschiedenis van Jerobeam, hoe hij oorlog voerde, en hoe hij geregeerd heeft, zie, dat staat geschreven in het boek van de kronieken van de koningen van Israël.","Jer 42:18":"Want zo zegt de HEERE van de heerscharen, de God van Israël: Zoals Mijn toorn en Mijn grimmigheid uitgestort is over de inwoners van Jeruzalem, zo zal Mijn grimmigheid over u uitgestort worden, als u in Egypte gekomen zult zijn; en u zult tot een vervloeking zijn, en tot een ontzetting, en tot een vloek, en tot smaad, en u zult deze plaats niet meer zien.","1 Sam 24:5":"Toen zeiden de mannen van David tegen hem: Zie de dag waarop de HEERE tegen u zegt: Zie, Ik geef uw vijand in uw hand, en u zult hem doen zoals het goed zal zijn in uw ogen. En David stond op, en sneed stilletjes een slip van Sauls mantel af.","Ps 89:31-35":"Als zijn kinderen Mijn wet verlaten, en in Mijn rechten niet wandelen; als zij Mijn inzettingen ontheiligen, en Mijn geboden niet houden; dan zal Ik hun overtreding met de roede bezoeken, en hun ongerechtigheid met plagen.","1 Kor 16:7":"Want ik wil u nu niet zien terwijl ik onderweg ben, maar ik hoop enige tijd bij u te blijven, als de Heere het zal toelaten.","Gen 39:4":"vond Jozef genade in zijn ogen, en diende hem; en hij stelde hem aan over zijn huis, en alles wat hij had, gaf hij in zijn hand.","Jer 31:37":"Zo zegt de HEERE: Als de hemelen daarboven gemeten, en de fundamenten van de aarde beneden doorgrond kunnen worden, dan zal Ik ook het hele nageslacht van Israël verwerpen, om alles wat zij gedaan hebben, spreekt de HEERE.","Ezech 33:11":"Zeg tegen hen: Zo waarachtig als Ik leef, spreekt de Heere HEERE, Ik heb geen behagen in de dood van de goddeloze! Maar hierin heb Ik behagen, dat de goddeloze zich bekeert van zijn weg en leeft. Bekeert u, bekeert u van uw slechte wegen, want waarom zou u sterven, o huis van Israël?","1 Kron 29:29":"De geschiedenissen nu van koning David, de eerste en de laatste, zie, die zijn geschreven in de geschiedenissen van Samuel, de ziener, en in de geschiedenissen van de profeet Nathan, en in de geschiedenissen van Gad, de ziener;","Ps 131:2":"Zeker heb ik mijn ziel tot rust gebracht en stilgehouden, zoals een gespeend kind bij zijn moeder! Mijn ziel is in mij als een gespeend kind.","1 Kron 28:7":"En Ik zal zijn koninkrijk bevestigen tot in eeuwigheid, als hij standvastig is om Mijn geboden en Mijn rechten te doen, zoals op deze dag.","Jes 12:1":"En diezelfde dag zult u zeggen: Ik dank U, HEERE! Dat U toornig op mij geweest bent, maar Uw toorn is afgekeerd, en U troost mij.","Ps 32:1":"Een onderwijzing van David. Gelukkig is hij, wiens overtreding vergeven is, wiens zonde bedekt is.","Deut 12:28":"Neem het waar, en hoor al deze woorden die ik u gebied, opdat het u, en uw kinderen na u, goed gaat tot in eeuwigheid, als u zult gedaan hebben wat goed en recht is in de ogen van de HEERE, uw God.","1 Kron 2:19":"Toen Azuba gestorven was, nam Kaleb voor zich Efrath, die baarde hem Hur.","1 Kon 14:31":"En Rehabeam ontsliep met zijn vaderen, en werd begraven bij zijn vaderen in de stad van David; en de naam van zijn moeder was Naäma, de Ammonietische; en zijn zoon Abiam regeerde in zijn plaats.","Num 32:11":"Zeker, deze mannen die uit Egypte zijn opgetrokken, van twintig jaar oud en daarboven, zullen het land niet zien dat Ik Abraham, Izak en Jakob gezworen heb! Want zij hebben Mij niet volledig gevolgd;","1 Kon 16:3":"Zie, zo zal Ik de nakomelingen van Baësa, en de nakomelingen van zijn huis wegdoen; en Ik zal uw huis maken zoals het huis van Jerobeam, de zoon van Nebat.","Richt 9:24":"opdat het geweld, gedaan aan de zeventig zonen van Jerubbaäl, tot uiting zou komen, en opdat hun bloed gelegd zou worden op Abimelech, hun broer, die hen gedood had, en op de burgers van Sichem, die zijn handen gesterkt hadden om zijn broers te doden.","2 Kon 21:25":"Het overige van de geschiedenis van Amon, wat hij gedaan heeft, staat dat niet geschreven in het boek van de kronieken van de koningen van Juda?","Jer 33:17-26":"Want zo zegt de HEERE: Aan David zal het nooit ontbreken aan een Man, Die op de troon van het huis van Israël zit. Ook zal het de Levitische priesters nooit ontbreken aan een Man voor Mijn aangezicht, die brandoffer offert, en spijsoffer aansteekt, en slachtoffer bereidt, alle dagen. En het woord van de HEERE kwam tot Jeremia, en Hij zei:","Hab 3:3":"God kwam van Theman, en de Heilige van de berg Paran. Sela. Zijn heerlijkheid bedekte de hemelen, en het aardrijk was vol van Zijn lof.","1 Kon 12:20-24":"En het gebeurde, toen heel Israël hoorde dat Jerobeam teruggekomen was, dat zij heen zonden en hem in de vergadering riepen, en hem over heel Israël koning maakten; niemand volgde het huis van David, dan de stam van Juda alleen. Toen Rehabeam nu in Jeruzalem gekomen was, verzamelde hij het hele huis van Juda en de stam van Benjamin, honderdtachtigduizend uitgelezen mannen, geoefend ten oorlog, om tegen het huis van Israël te strijden, opdat hij het koninkrijk weer aan Rehabeam, de zoon van Salomo, zou brengen. Doch het woord van God kwam tot Semaja, de man van God, en zei:","Ezech 18:12":"De ellendige en de arme verdrukt, veel van het roof rooft, het pand niet teruggeeft, en zijn ogen opheft tot de drekgoden, gruwel doet;","Ps 86:13":"Want Uw goedertierenheid is groot over mij; en Gij hebt mijn ziel uit het onderste van het graf gered.","Jes 14:32":"Wat zal men dan antwoorden aan de boden van het volk? Dat de HEERE Sion gegrond heeft, opdat de bedrukten van Zijn volk daarin een toevlucht zouden hebben.","Ps 119:156":"HEERE! Uw barmhartigheden zijn vele; maak mij levend naar Uw rechten.","1 Kon 11:1-11":"En koning Salomo had, behalve de dochter van Farao, veel vreemde vrouwen lief: Moabitische, Ammonitische, Edomitische, Sidonische en Hethitische vrouwen; van de volken waarvan de HEERE tegen de kinderen van Israël gezegd had: U zult tot hen niet ingaan, en zij zullen tot u niet inkomen; zij zouden zeker uw hart naar hun goden doen neigen; aan deze hing Salomo met liefde. En hij had zevenhonderd vrouwen, vorstinnen, en driehonderd bijvrouwen, en zijn vrouwen deden zijn hart neigen.","Ex 25:17":"U zult ook een verzoendeksel maken van zuiver goud; twee el en een halve zal de lengte daarvan zijn, en anderhalve el de breedte daarvan.","Num 12:9":"Zo ontstak de toorn van de HEERE tegen hen, en Hij ging weg.","Ex 23:33":"Zij zullen in uw land niet wonen, opdat zij u niet tegen Mij laten zondigen; als u hun goden dient, zal het u zeker tot een valstrik zijn.","Ps 136:3-26":"Loof de Heere der heren; want Zijn goedertierenheid is voor eeuwig. Hem, Die alleen grote wonderen doet; want Zijn goedertierenheid is voor eeuwig. Hem, Die de hemelen met verstand gemaakt heeft; want Zijn goedertierenheid is voor eeuwig.","Ps 132:17":"Daar zal Ik David een hoorn doen uitspruiten; Ik heb voor Mijn Gezalfde een lamp klaargemaakt.","Micha 7:19":"Hij zal Zich weer over ons ontfermen; Hij zal onze ongerechtigheden dempen; ja, U zult al hun zonden in de diepten van de zee werpen.","1 Kor 10:12":"Wie dan meent te staan, laat hij toezien dat hij niet valt.","2 Kron 7:14":"En Mijn volk, over wie Mijn Naam genoemd wordt, zich verootmoedigt en bidt, en zij Mijn aangezicht zoeken, en zich bekeren van hun slechte wegen; dan zal Ik uit de hemel horen, en hun zonden vergeven, en hun land genezen.","Neh 13:27":"Zouden wij dan naar u luisteren, dat u al dit grote kwaad zou doen, door tegen onze God te overtreden, door vreemde vrouwen bij u te laten wonen?","Jes 57:11":"Maar voor wie bent u bang geweest of hebt u gevreesd? Want u hebt gelogen, en aan Mij hebt u niet gedacht, u hebt Mij niet op uw hart gelegd; is het niet omdat Ik zwijg, en dat al lang, dat u Mij niet vreest?","Spr 21:30":"Er is geen wijsheid, en er is geen verstand, en er is geen raad tegen de HEERE.","Rom 9:15":"Want Hij zegt tegen Mozes: Ik zal Mij ontfermen over wie Ik Mij ontferm, en zal barmhartig zijn voor wie Ik barmhartig ben.","2 Kron 12:15":"De geschiedenis van Rehabeam nu, van begin tot eind, is die niet geschreven in de woorden van Semaja, de profeet, en Iddo, de ziener, die de geslachtsregisters vermelden? Daarbij ook de oorlogen van Rehabeam en Jerobeam, al hun dagen door.","Luk 1:33":"En Hij zal over het huis van Jakob Koning zijn tot in eeuwigheid, en aan Zijn koninkrijk zal geen einde zijn.","Gen 45:5-7":"Maar nu, weest niet bekommerd, en de toorn ontsteekt niet in uw ogen, omdat u mij hierheen verkocht hebt; want God heeft mij voor uw aangezicht gezonden, tot behoud van het leven. Want het zijn nu twee jaren van de honger in het midden van het land; en er zijn nog vijf jaren, waarin geen ploeging noch oogst zal zijn. Doch God heeft mij voor uw aangezicht heen gezonden, om u een overblijfsel te stellen op de aarde, en om u bij het leven te behouden, door een grote verlossing.","Luk 15:4-7":"Welk mens onder u, die honderd schapen heeft, en één daarvan verliest, laat niet de negenennegentig achter in de woestijn, en gaat achter het verlorene aan, totdat hij dat vindt? En als hij het gevonden heeft, legt hij het op zijn schouders, verblijd. En als hij thuiskomt, roept hij de vrienden en de buren bijeen, en zegt tegen hen: Wees blij met mij; want ik heb mijn schaap gevonden, dat verloren was.","1 Sam 9:4":"Hij dan ging door het gebergte van Efraïm, en hij ging door het land van Salisa, maar zij vonden ze niet; daarna gingen zij door het land van Sahalim, maar zij waren er niet; verder ging hij door het land van Jemini, maar zij vonden ze niet.","Ps 78:38":"Doch Hij, barmhartig zijnde, verzoende de ongerechtigheid, en verdierf hen niet; maar wendde dikwijls Zijn toorn af, en wekte Zijn hele grimmigheid niet op.","Jes 10:5":"Wee de Assyriër, die de roede van Mijn toorn is, en Mijn grimmigheid is een stok in hun hand!","1 Sam 2:30-32":"Daarom spreekt de HEERE, de God van Israël: Ik had wel duidelijk gezegd: Uw huis en het huis van uw vader zouden voor Mijn aangezicht wandelen tot in eeuwigheid; maar nu spreekt de HEERE: Dat zij verre van Mij; want die Mij eren, zal Ik eren, maar die Mij versmaden, zullen licht geacht worden. Zie, de dagen komen dat Ik uw arm zal afhouwen, en de arm van het huis van uw vader, zodat er geen oud man in uw huis zal zijn. En u zult de benauwdheid van de woning van God aanschouwen, in plaats van al het goede dat Hij Israël zou hebben gedaan; en er zal op geen dag een oud man in uw huis zijn.","Zach 11:8":"En ik heb drie herders in één maand afgesneden; want mijn ziel was verdrietig over hen geworden, en ook had hun ziel een walg van mij.","Zach 1:17":"Roep nog, en zeg: Zo zegt de HEERE van de heerscharen: Mijn steden zullen nog uitgespreid worden vanwege de voorspoed; want de HEERE zal Sion nog troosten, en Hij zal Jeruzalem nog verkiezen.","1 Kon 11:14-40":"Zo verwekte de HEERE tegen Salomo een tegenstander, Hadad de Edomiet; hij was van het koninklijk geslacht in Edom. Want het was gebeurd, toen David in Edom was, en Joab, de legeraanvoerder, optrok om de gesneuvelden te begraven, dat hij alles wat mannelijk was in Edom versloeg; want Joab bleef daar zes maanden met heel Israël, totdat hij alles wat mannelijk was in Edom had uitgeroeid.","1 Kon 16:6":"En Baësa ontsliep met zijn vaderen, en werd begraven te Thirza; en zijn zoon Ela regeerde in zijn plaats.","1 Kor 4:19":"Maar ik zal spoedig naar u toe komen, als de Heere het wil, en dan zal ik niet de woorden leren kennen van hen die opgeblazen zijn, maar de kracht.","Ps 85:11":"De goedertierenheid en waarheid zullen elkaar ontmoeten; de gerechtigheid en vrede zullen elkaar kussen.","Num 14:18-20":"De HEERE is geduldig en groot van goedertierenheid, Hij vergeeft de ongerechtigheid en overtreding, maar houdt de schuldige geenszins onschuldig, en bezoekt de ongerechtigheid van de vaderen aan de kinderen, tot het derde en vierde geslacht. Vergeef toch de ongerechtigheid van dit volk, naar de grootte van Uw goedertierenheid, en zoals U dit volk vergeven hebt, van Egypteland af tot hiertoe! En de HEERE zei: Ik heb hun vergeven naar uw woord.","Jer 17:1":"De zonde van Juda is geschreven met een ijzeren griffie, met de punt van een diamant; gegraven in de tafel van hun hart, en aan de hoornen van uw altaren;","Deut 17:17":"Ook mag hij voor zichzelf de vrouwen niet vermeerderen, opdat zijn hart niet afwijkt; hij mag voor zichzelf ook geen zilver en goud in overvloed vermeerderen.","Gen 19:29":"En het gebeurde, toen God de steden van deze vlakte verwoestte, dat God aan Abraham dacht, en Hij leidde Lot weg uit het midden van deze omkering, toen Hij de steden omkeerde waarin Lot gewoond had.","Dan 12:11":"En vanaf de tijd dat het voortdurende offer weggenomen zal zijn, en de verwoestende gruwel zal zijn opgesteld, zullen er duizend tweehonderd en negentig dagen zijn.","1 Kon 14:7-14":"Ga heen, zeg tegen Jerobeam: Zo zegt de HEERE, de God van Israël: Omdat Ik u verheven heb uit het midden van het volk, en u tot een leider over Mijn volk Israël gesteld heb; en het koninkrijk van het huis van David weggescheurd heb, en dat aan u gegeven heb, en u niet geweest bent zoals Mijn dienaar David, die Mijn geboden hield, en Mij met heel zijn hart navolgde, om alleen te doen wat recht is in Mijn ogen; maar kwaad gedaan hebt, meer dan allen die vóór u geweest zijn, en heengegaan bent, en u andere goden en gegoten beelden gemaakt hebt, om Mij tot toorn te verwekken, en Mij achter uw rug geworpen hebt;","Ezech 14:18":"Ofschoon die drie mannen in het midden daarvan waren, zo waarachtig als Ik leef, spreekt de Heere HEERE, zij zouden zonen noch dochters bevrijden, maar zij zelf alleen zouden bevrijd worden.","Ps 107:1":"Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig.","2 Sam 16:21":"En Achitofel zei tegen Absalom: Ga naar de bijvrouwen van uw vader, die hij heeft achtergelaten om het huis te bewaren; zo zal heel Israël horen dat u zich bij uw vader gehaat gemaakt hebt, en de handen van allen die bij u zijn, zullen gesterkt worden.","2 Kron 10:15":"Zo luisterde de koning niet naar het volk; want deze ommekeer kwam van God, opdat de HEERE Zijn woord zou bevestigen, dat Hij door de dienst van Ahia, de Siloniet, gesproken had tot Jerobeam, de zoon van Nebat.","Ezech 16:22-29":"Ook hebt u bij al uw gruwelen en uw hoererijen niet gedacht aan de dagen van uw jeugd, toen u naakt en bloot was, toen u vertrapt was in uw bloed. Het is ook gebeurd na al uw slechtheid (wee, wee u, spreekt de Heere HEERE), dat u zich een verhoging gebouwd hebt, en u een hoge plaats gemaakt hebt in elke straat.","Gen 14:15":"En hij verdeelde zich tegen hen 's nachts, hij en zijn knechten, en versloeg hen; en hij achtervolgde hen tot Hoba toe, dat ten noorden van Damaskus ligt.","2 Kron 33:9":"Zo deed Manasse Juda en de inwoners van Jeruzalem dwalen, dat zij erger deden dan de heidenen, die de HEERE voor het aangezicht van de kinderen van Israël verdelgd had.","Gen 12:10":"En er was hongersnood in dat land; zo trok Abram af naar Egypte om daar als vreemdeling te wonen, omdat de hongersnood zwaar was in dat land.","Joz 23:13":"Weet voorzeker, dat de HEERE, uw God, niet zal voortgaan deze volken van voor uw aangezicht te verdrijven; maar zij zullen u zijn tot een strik, en tot een net, en tot een gesel aan uw zijden, en tot doornen in uw ogen, totdat u omkomt van dit goede land, dat de HEERE, uw God, u gegeven heeft.","Openb 15:1":"En ik zag een ander groot en wonderlijk teken in de hemel: namelijk zeven engelen, die de zeven laatste plagen hadden; want in deze is de toorn van God geëindigd.","Matt 5:16":"Laat uw licht zo schijnen voor de mensen, dat zij uw goede werken mogen zien en uw Vader, Die in de hemelen is, verheerlijken.","1 Kon 22:52-54":"Ahazia, de zoon van Achab, werd koning over Israël te Samaria, in het zeventiende jaar van Josafat, de koning van Juda, en regeerde twee jaar over Israël. En hij deed wat kwaad was in de ogen van de HEERE; want hij wandelde in de weg van zijn vader, en in de weg van zijn moeder, en in de weg van Jerobeam, de zoon van Nebat, die Israël deed zondigen. En hij diende Baäl, en boog zich voor hem neer, en tergde de HEERE, de God van Israël, naar alles wat zijn vader gedaan had.","Spr 30:32":"Als u dwaas gehandeld hebt door uzelf te verheffen, en als u kwaad bedacht hebt: de hand op de mond!","Ex 19:5":"Nu dan, als u nauwgezet Mijn stem gehoorzaamt en Mijn verbond houdt, zult u Mijn eigendom zijn uit alle volken, want de hele aarde is Mijn;","Neh 4:7":"En het gebeurde, toen Sanballat, Tobia, de Arabieren, de Ammonieten en de Asdodieten hoorden dat het herstel van de muren van Jeruzalem vorderde, dat de scheuren begonnen dichtgemaakt te worden, dat zij erg boos werden.","1 Kon 6:1":"Het gebeurde nu in het vierhonderdtachtigste jaar, na de uittocht van de kinderen van Israël uit Egypte, in het vierde jaar van het koninkrijk van Salomo over Israël, in de maand Ziv (dat is de tweede maand), dat hij het huis van de HEERE bouwde.","2 Kron 12:13":"Zo maakte koning Rehabeam zich sterk in Jeruzalem, en regeerde; want Rehabeam was eenenveertig jaar oud toen hij koning werd, en hij regeerde zeventien jaar in Jeruzalem, de stad die de HEERE uit alle stammen van Israël uitgekozen had om Zijn Naam daar te vestigen; en de naam van zijn moeder was Naäma, een Ammonitische.","2 Kron 8:7":"Wat betreft al het volk dat overgebleven was van de Hethieten, de Amorieten, de Ferezieten, de Hevieten en de Jebusieten, die niet uit Israël waren,","1 Kon 2:11":"De dagen nu dat David over Israël geregeerd heeft, zijn veertig jaar; zeven jaar heeft hij geregeerd in Hebron, en in Jeruzalem heeft hij drieëndertig jaar geregeerd.","1 Kon 11:41-43":"Het overige nu van de geschiedenissen van Salomo, en alles wat hij gedaan heeft, en zijn wijsheid, is dat niet geschreven in het boek van de geschiedenissen van Salomo? De tijd nu dat Salomo in Jeruzalem over heel Israël regeerde, was veertig jaar. Daarna ontsliep Salomo met zijn vaderen, en werd begraven in de stad van zijn vader David; en Rehabeam, zijn zoon, werd koning in zijn plaats.","Spr 7:5":"Opdat zij u bewaren voor een vreemde vrouw, voor de onbekende, die met haar woorden vleit.","2 Kon 8:19":"Toch wilde de HEERE Juda niet verderven, omwille van David, Zijn dienaar; zoals Hij hem gezegd had dat Hij hem altijd een lamp zou geven voor zijn zonen.","Jer 33:11":"De stem van vreugde en de stem van blijdschap, de stem van de bruidegom en de stem van de bruid, de stem van hen die zeggen: Looft de HEERE van de heerscharen, want de HEERE is goed, want Zijn goedertierenheid is tot in eeuwigheid! de stem van hen die lof brengen naar het huis van de HEERE; want Ik zal de gevangenschap van het land wenden, als in het begin, zegt de HEERE.","2 Kron 13:6":"Toch is Jerobeam, de zoon van Nebat, de knecht van Salomo, de zoon van David, opgestaan en heeft hij tegen zijn heer gerebelleerd.","Ps 103:8-14":"Barmhartig en genadig is de HEERE, geduldig en groot van goedertierenheid. Hij zal niet altijd twisten, en ook niet eeuwig de toorn behouden. Hij doet ons niet naar onze zonden, en vergeldt ons niet naar onze ongerechtigheden.","Spr 2:16":"Om u te redden van de vreemde vrouw, van de onbekende, die met haar woorden vleit;","Deut 10:15":"Alleen heeft de HEERE behagen gehad in uw vaderen, om hen lief te hebben, en heeft hun nageslacht na hen, u, uit alle volken uitverkoren, zoals het op deze dag is.","Matt 4:16":"het volk dat in duisternis zat, heeft een groot licht gezien; en over hen die zaten in het land en de schaduw van de dood, is een licht opgegaan.","Ps 111:4":"Zain. Hij heeft Zijn wonderen tot een gedachtenis gemaakt; Cheth. de HEERE is genadig en barmhartig.","Spr 16:7":"Als iemands wegen de HEERE behagen, zo zal Hij ook zijn vijanden met hem verzoenen.","Jes 42:25":"Daarom heeft Hij over hen uitgestort de grimmigheid van Zijn toorn en de macht van de oorlog; en Hij heeft ze rondom in vlam gezet, doch zij merken het niet; en Hij heeft ze in brand gestoken, doch zij nemen het niet ter harte.","Zach 14:4":"En Zijn voeten zullen op die dag staan op de Olijfberg, die voor Jeruzalem ligt, tegen het oosten; en de Olijfberg zal in tweeën gespleten worden naar het oosten en naar het westen, zodat er een zeer grote vallei zal zijn; en de ene helft van de berg zal wijken naar het noorden, en de helft daarvan naar het zuiden.","Ps 89:34-38":"Maar Mijn goedertierenheid zal Ik van hem niet wegnemen, en in Mijn getrouwheid niet feilen. Ik zal Mijn verbond niet ontheiligen, en wat uit Mijn lippen gegaan is, zal Ik niet veranderen. Ik heb eens gezworen bij Mijn heiligheid: Zeker zal Ik aan David niet liegen!","Gen 41:45":"En Farao noemde Jozef Zafnath-Paaneah, en gaf hem Asnath, de dochter van Potifera, priester van On, tot vrouw; en Jozef trok door het land van Egypte.","Ps 50:21":"Deze dingen doet u, en Ik zwijg; u meent dat Ik helemaal ben zoals u; Ik zal u straffen, en zal het ordelijk voor uw ogen op een rij zetten.","Ezech 38:16":"en u zult optrekken tegen Mijn volk Israël, als een wolk, om het land te bedekken; in het laatste van de dagen zal het gebeuren; dan zal Ik u aanbrengen tegen Mijn land, opdat de heidenen Mij kennen, als Ik aan u, o Gog! voor hun ogen geheiligd zal worden.","2 Kron 9:29":"Het overige nu van de geschiedenissen van Salomo, van de eerste tot de laatste, is dat niet geschreven in de woorden van Nathan, de profeet, en in de profetie van Ahia, de Siloniet, en in de gezichten van Jedi, de ziener, over Jerobeam, de zoon van Nebat?","Richt 2:13":"Want zij verlieten de HEERE, en dienden de Baäl en de Astartes.","Jes 57:15":"Want zo zegt de Hoge en Verhevene, Die in de eeuwigheid woont, en Wiens Naam heilig is: Ik woon in de hoogte en in het heilige, en bij hem die een verbrijzelde en nederige geest heeft, om de geest van de nederigen levend te maken, en om het hart van de verbrijzelden levend te maken.","Jer 4:8":"Hierom, doe zakken aan, bedrijf misbaar en huil; want de gloed van de toorn van de HEERE is niet van ons afgekeerd.","Ps 7:12":"God is een rechtvaardige Rechter, en een God, Die iedere dag toornt.","2 Kon 17:22":"Zo wandelden de kinderen van Israël in alle zonden van Jerobeam die hij gedaan had; zij weken daar niet van af;","Jer 48:7":"Want om uw vertrouwen op uw werken, en op uw schatten, zult u ook ingenomen worden; en Kamos zal weggaan in gevangenschap, zijn priesters en zijn vorsten samen.","Ex 22:27":"want dat is zijn enige bedekking, het is zijn kleding voor zijn huid; waarin zou hij anders slapen? Het zal dan gebeuren, wanneer hij tot Mij roept, dat Ik hem zal horen; want Ik ben genadig!","Jer 51:5":"Want Israël of Juda zal niet in weduwschap gelaten worden door zijn God, door de HEERE van de heerscharen (hoewel hun land vol schuld is), door de Heilige van Israël.","Hand 1:12":"Toen keerden zij terug naar Jeruzalem, van de berg die de Olijfberg genoemd wordt, die dicht bij Jeruzalem ligt, op een sabbatsreis afstand vandaan.","Mal 1:3":"en Ezau heb Ik gehaat; en Ik heb zijn bergen gesteld tot een verwoesting, en zijn erfdeel voor de jakhalzen van de woestijn.","Hos 14:2-9":"Bekeer u, o Israël! tot de Heere, uw God, toe; want u bent gevallen om uw ongerechtigheid. Neem deze woorden met u, en bekeer u tot de Heere; zeg tegen Hem: Neem weg alle ongerechtigheid, en geef het goede, zo zullen wij betalen de stieren van onze lippen. Assur zal ons niet behouden, wij zullen niet rijden op paarden, en tegen het werk van onze handen niet meer zeggen: U bent onze God. Zeker zal een wees bij U ontfermd worden.","1 Kon 11:1-8":"En koning Salomo had, behalve de dochter van Farao, veel vreemde vrouwen lief: Moabitische, Ammonitische, Edomitische, Sidonische en Hethitische vrouwen; van de volken waarvan de HEERE tegen de kinderen van Israël gezegd had: U zult tot hen niet ingaan, en zij zullen tot u niet inkomen; zij zouden zeker uw hart naar hun goden doen neigen; aan deze hing Salomo met liefde. En hij had zevenhonderd vrouwen, vorstinnen, en driehonderd bijvrouwen, en zijn vrouwen deden zijn hart neigen.","Klaagl 3:22":"Cheth. Het zijn de blijken van goedertierenheid van de HEERE, dat wij niet vernietigd zijn, dat Zijn barmhartigheden geen einde hebben;","Klaagl 3:31":"Caph. Want de Heere zal niet verstoten in eeuwigheid.","Matt 13:25":"En toen de mensen sliepen, kwam zijn vijand en zaaide onkruid midden tussen de tarwe, en ging weg.","Ex 34:16":"En u voor uw zonen vrouwen neemt van hun dochters; en hun dochters, die hun goden nahoereren, maken dat ook uw zonen hun goden nahoereren.","Matt 18:23-27":"Daarom wordt het Koninkrijk der hemelen vergeleken met een zekere koning die met zijn dienstknechten rekening wilde houden. Toen hij nu begon te rekenen, werd er iemand bij hem gebracht die hem tienduizend talenten schuldig was. En omdat hij niet had waarmee hij kon betalen, beval zijn heer dat men hem zou verkopen, en zijn vrouw en kinderen, en alles wat hij had, en dat de schuld zo betaald zou worden.","Num 11:1":"En het gebeurde dat het volk zich beklaagde, en dat was kwaad in de oren van de HEERE; want de HEERE hoorde het, zodat Zijn toorn ontstak, en het vuur van de HEERE onder hen ontbrandde en verteerde hen die in het uiterste van het leger wa
