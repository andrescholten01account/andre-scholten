Lukas","href":"../../lukas/1/"},{"naam":"Johannes","href":"../../johannes/1/"},{"naam":"Handelingen","href":"../../handelingen/1/"},{"naam":"Romeinen","href":"../../romeinen/1/"},{"naam":"1 Korinthe","href":"../../1-korinthe/1/"},{"naam":"2 Korinthe","href":"../../2-korinthe/1/"},{"naam":"Galaten","href":"../../galaten/1/"},{"naam":"Efeze","href":"../../efeze/1/"},{"naam":"Filippenzen","href":"../../filippenzen/1/"},{"naam":"Kolossenzen","href":"../../kolossenzen/1/"},{"naam":"1 Thessalonicenzen","href":"../../1-thessalonicenzen/1/"},{"naam":"2 Thessalonicenzen","href":"../../2-thessalonicenzen/1/"},{"naam":"1 Timotheüs","href":"../../1-timotheus/1/"},{"naam":"2 Timotheüs","href":"../../2-timotheus/1/"},{"naam":"Titus","href":"../../titus/1/"},{"naam":"Filemon","href":"../../filemon/1/"},{"naam":"Hebreeën","href":"../../hebreeen/1/"},{"naam":"Jakobus","href":"../../jakobus/1/"},{"naam":"1 Petrus","href":"../../1-petrus/1/"},{"naam":"2 Petrus","href":"../../2-petrus/1/"},{"naam":"1 Johannes","href":"../../1-johannes/1/"},{"naam":"2 Johannes","href":"../../2-johannes/1/"},{"naam":"3 Johannes","href":"../../3-johannes/1/"},{"naam":"Judas","href":"../../judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}]},"vertalingen":{"SVnu":{"1":"En koning Salomo had, behalve de dochter van Farao, veel vreemde vrouwen lief: Moabitische, Ammonitische, Edomitische, Sidonische en Hethitische vrouwen;","2":"van de volken waarvan de HEERE tegen de kinderen van Israël gezegd had: U zult tot hen niet ingaan, en zij zullen tot u niet inkomen; zij zouden zeker uw hart naar hun goden doen neigen; aan deze hing Salomo met liefde.","3":"En hij had zevenhonderd vrouwen, vorstinnen, en driehonderd bijvrouwen, en zijn vrouwen deden zijn hart neigen.","4":"Want het gebeurde in de tijd van Salomo's ouderdom, dat zijn vrouwen zijn hart deden neigen naar andere goden; zodat zijn hart niet volkomen was met de HEERE, zijn God, zoals het hart van zijn vader David.","5":"Want Salomo volgde Astoreth na, de god van de Sidoniërs, en Milchom, het verfoeisel van de Ammonieten.","6":"Zo deed Salomo wat kwaad was in de ogen van de HEERE; en hij volhardde niet in het volgen van de HEERE, zoals zijn vader David.","7":"Toen bouwde Salomo een hoogte voor Kamos, het verfoeisel van de Moabieten, op de berg die tegenover Jeruzalem ligt, en voor Molech, het verfoeisel van de kinderen Ammons.","8":"En zo deed hij voor al zijn vreemde vrouwen, die hun goden reukoffers brachten en offerden.","9":"Daarom vertoornde de HEERE Zich tegen Salomo, omdat hij zijn hart van de HEERE, de God van Israël, had afgewend, Die hem tweemaal verschenen was,","10":"en hem in deze zaak geboden had dat hij geen andere goden zou navolgen; maar hij hield niet wat de HEERE geboden had.","11":"Daarom zei de HEERE tegen Salomo: Omdat dit bij u gebeurd is, dat u Mijn verbond en Mijn inzettingen, die Ik u geboden heb, niet gehouden hebt, zal Ik dit koninkrijk zeker van u scheuren, en het aan uw dienaar geven.","12":"In uw dagen echter zal Ik dat niet doen, omwille van uw vader David; van de hand van uw zoon zal Ik het scheuren.","13":"Maar Ik zal het hele koninkrijk niet afscheuren; één stam zal Ik uw zoon geven, omwille van Mijn dienaar David, en omwille van Jeruzalem, dat Ik verkozen heb.","14":"Zo verwekte de HEERE tegen Salomo een tegenstander, Hadad de Edomiet; hij was van het koninklijk geslacht in Edom.","15":"Want het was gebeurd, toen David in Edom was, en Joab, de legeraanvoerder, optrok om de gesneuvelden te begraven, dat hij alles wat mannelijk was in Edom versloeg;","16":"want Joab bleef daar zes maanden met heel Israël, totdat hij alles wat mannelijk was in Edom had uitgeroeid.","17":"Toen vluchtte Hadad, hij en enkele Edomitische mannen uit de dienaren van zijn vader met hem, om naar Egypte te gaan; Hadad was toen nog een kleine jongen.","18":"En zij trokken op vanuit Midian en kwamen naar Paran; en zij namen mannen uit Paran met zich mee, en kwamen in Egypte bij Farao, de koning van Egypte, die hem een huis gaf, en hem levensonderhoud toezei, en hem land gaf.","19":"En Hadad vond grote genade in de ogen van Farao, zodat hij hem tot vrouw gaf de zuster van zijn eigen vrouw, de zuster van Tachpenes, de koningin.","20":"En de zuster van Tachpenes baarde hem zijn zoon Genubath, die Tachpenes grootbracht in het huis van Farao; zodat Genubath in het huis van Farao was, onder de zonen van Farao.","21":"Toen Hadad in Egypte hoorde dat David bij zijn vaderen ontslapen was, en dat Joab, de legeraanvoerder, dood was, zei Hadad tegen Farao: Laat mij gaan, dat ik naar mijn land trek.","22":"Maar Farao zei: Wat ontbreekt u toch bij mij, dat u naar uw land wilt trekken? En hij zei: Niets, maar laat mij toch gaan.","23":"Ook verwekte God tegen hem een tegenstander, Rezon, de zoon van Eljada, die gevlucht was van zijn heer Hadad-ezer, de koning van Zoba,","24":"tegen wie hij ook mannen verzameld had, en hij werd aanvoerder van een bende, toen David hen doodde; en zij trokken naar Damascus, woonden daar en regeerden in Damascus.","25":"En hij was Israëls tegenstander al de dagen van Salomo, naast het kwaad dat Hadad deed; want hij had een afkeer van Israël, en hij regeerde over Syrië.","26":"Verder kwam Jerobeam, de zoon van Nebat, een Efrathiet uit Zereda, dienaar van Salomo (wiens moeder Zerua heette, een weduwe), ook tegen de koning in opstand.","27":"Dit is nu de zaak waarom hij tegen de koning in opstand kwam. Salomo bouwde Millo, en herstelde de bres in de stad van zijn vader David.","28":"De man Jerobeam was een dapper held. Toen Salomo deze jongeman zag, dat hij hard werkte, stelde hij hem aan over al de lastdienst van het huis van Jozef.","29":"Het gebeurde nu in die tijd, toen Jerobeam uit Jeruzalem wegging, dat de profeet Ahia, de Siloniet, hem op de weg vond; hij had zich een nieuw kleed aangedaan, en zij beiden waren alleen op het veld;","30":"toen greep Ahia het nieuwe kleed dat hij aanhad, en scheurde het in twaalf stukken.","31":"En hij zei tegen Jerobeam: Neem tien stukken voor uzelf; want zo zegt de HEERE, de God van Israël: Zie, Ik zal het koninkrijk uit de hand van Salomo scheuren, en u tien stammen geven.","32":"Maar één stam zal hij hebben, omwille van Mijn dienaar David, en omwille van Jeruzalem, de stad die Ik verkozen heb uit alle stammen van Israël.","33":"Omdat zij Mij verlaten hebben, en zich neergebogen hebben voor Astoreth, de god van de Sidoniërs, Kamos, de god van de Moabieten, en Milchom, de god van de kinderen Ammons; en niet in Mijn wegen gewandeld hebben om te doen wat recht is in Mijn ogen, namelijk Mijn inzettingen en Mijn rechten, zoals zijn vader David.","34":"Toch zal Ik niets van dit koninkrijk uit zijn hand nemen; maar Ik stel hem tot vorst al de dagen van zijn leven, omwille van Mijn dienaar David, die Ik verkozen heb, die Mijn geboden en Mijn inzettingen gehouden heeft.","35":"Maar uit de hand van zijn zoon zal Ik het koninkrijk nemen; en Ik zal u daarvan tien stammen geven.","36":"En aan zijn zoon zal Ik één stam geven; opdat Mijn dienaar David altijd een lamp voor Mijn aangezicht heeft in Jeruzalem, de stad die Ik Mij verkozen heb, om Mijn Naam daar te vestigen.","37":"Zo zal Ik u nemen, en u zult regeren over alles wat uw ziel zal begeren; en u zult koning zijn over Israël.","38":"En het zal gebeuren, als u zult horen naar alles wat Ik u zal gebieden, en in Mijn wegen zult wandelen, en zult doen wat recht is in Mijn ogen, door Mijn inzettingen en Mijn geboden te houden, zoals Mijn dienaar David gedaan heeft; dat Ik met u zal zijn, en u een blijvend huis zal bouwen, zoals Ik David gebouwd heb, en Ik zal u Israël geven.","39":"En Ik zal om die reden het nageslacht van David vernederen; maar niet voor altijd.","40":"Daarom zocht Salomo Jerobeam te doden; maar Jerobeam maakte zich op en vluchtte naar Egypte, naar Sisak, de koning van Egypte, en was in Egypte totdat Salomo stierf.","41":"Het overige nu van de geschiedenissen van Salomo, en alles wat hij gedaan heeft, en zijn wijsheid, is dat niet geschreven in het boek van de geschiedenissen van Salomo?","42":"De tijd nu dat Salomo in Jeruzalem over heel Israël regeerde, was veertig jaar.","43":"Daarna ontsliep Salomo met zijn vaderen, en werd begraven in de stad van zijn vader David; en Rehabeam, zijn zoon, werd koning in zijn plaats."},"SV":{"1":"En de koning Salomo had veel vreemde vrouwen lief, en dat benevens de dochter van Farao: Moabietische, Ammonietische, Edomietische, Sidonische, Hethietische;","2":"Van die volken, waarvan de HEERE gezegd had tot de kinderen Israëls: Gijlieden zult tot hen niet ingaan, en zij zullen tot u niet inkomen; zij zouden zekerlijk uw hart achter hun goden neigen; aan deze hing Salomo met liefde.","3":"En hij had zevenhonderd vrouwen, vorstinnen, en driehonderd bijwijven en zijn vrouwen neigden zijn hart.","4":"Want het geschiedde in den tijd van Salomo’s ouderdom, *dat* zijn vrouwen zijn hart achter andere goden neigden; dat zijn hart niet volkomen was met den HEERE, zijn God, gelijk het hart van zijn vader David.","5":"Want Salomo wandelde Astoreth, den god der Sidoniërs, na, en Milchom, het verfoeisel der Ammonieten.","6":"Alzo deed Salomo, dat kwaad was in de ogen des HEEREN; en volhardde niet den HEERE te volgen, gelijk zijn vader David.","7":"Toen bouwde Salomo een hoogte voor Kamos, het verfoeisel der Moabieten, op den berg, die voor Jeruzalem is, en voor Molech, het verfoeisel der kinderen Ammons.","8":"En alzo deed hij voor al zijn vreemde vrouwen, die haar goden rookten en offerden.","9":"Daarom vertoornde Zich de HEERE tegen Salomo, omdat hij zijn hart geneigd had van den HEERE, den God Israëls, Die hem tweemaal verschenen was.","10":"En hem van deze zaak geboden had, dat hij andere goden niet zou nawandelen; doch hij hield niet, wat de HEERE geboden had.","11":"Daarom zeide de HEERE tot Salomo: Dewijl dit bij u geschied is, dat gij niet hebt gehouden Mijn verbond en Mijn inzettingen, die Ik u geboden heb; Ik zal gewisselijk dit koninkrijk van u scheuren, en datzelve uw knecht geven.","12":"In uw dagen nochtans zal Ik dat niet doen, om uws vaders Davids wil, van de hand uws zoons zal Ik het scheuren.","13":"Doch Ik zal het gehele koninkrijk niet afscheuren; een stam zal Ik uw zoon geven, om Mijns knechts Davids wil, en om Jeruzalems wil, dat Ik verkoren heb.","14":"Zo verwekte de HEERE Salomo een tegenpartijder, Hadad, den Edomiet; hij was van des konings zaad in Edom.","15":"Want het was geschied, als David in Edom was, toen Joab, de krijgsoverste, optoog, om de verslagenen te begraven, dat hij al wat mannelijk was in Edom sloeg;","16":"Want Joab bleef aldaar zes maanden, met het ganse Israël, totdat hij al wat mannelijk was in Edom uitgeroeid had.","17":"Doch Hadad was ontvloden, hij en *enige* Edomietische mannen uit zijns vaders knechten met hem, om in Egypte te komen; Hadad nu was een klein jongsken.","18":"En zij maakten zich op van Midian, en kwamen tot Paran; en namen met zich mannen van Paran, en kwamen in Egypte tot Farao, den koning van Egypte, die hem een huis gaf, en hem voeding toezeide, en hem een land gaf.","19":"En Hadad vond grote genade in de ogen van Farao, zodat hij hem tot een vrouw gaf de zuster zijner huisvrouw, de zuster van Tachpenes, de koningin.","20":"En de zuster van Tachpenes baarde hem zijn zoon Genubath, denwelken Tachpenes optoog in het huis van Farao; zodat Genubath in het huis van Farao was, onder de zonen van Farao.","21":"Toen nu Hadad in Egypte hoorde, dat David met zijn vaderen ontslapen, en dat Joab, de krijgsoverste, dood was, zeide Hadad tot Farao: Laat mij gaan, dat ik in mijn land trekke.","22":"Doch Farao zeide: Maar wat ontbreekt u bij mij, dat, zie, gij in uw land zoekt te trekken? En hij zeide: Niets, maar laat mij evenwel gaan.","23":"Ook verwekte God hem een wederpartijder, Rezon, den zoon van Eljada, die gevloden was van zijn heer Hadad-ezer, den koning van Zoba,","24":"Tegen welken hij ook mannen vergaderd had, en werd overste ener bende, als David die doodde; en getrokken zijnde naar Damaskus, woonden zij aldaar, en regeerden in Damaskus.","25":"En hij was Israëls tegenpartijder al de dagen van Salomo, en dat benevens het kwaad, dat Hadad *deed*; want hij had een afkeer van Israël, en hij regeerde over Syrië.","26":"Daartoe Jerobeam, de zoon van Nebat, een Efrathiet van Zereda, Salomo’s knecht (wiens moeders naam was Zerua, een weduwvrouw), hief ook de hand op tegen den koning.","27":"Dit is nu de zaak, waarom hij de hand tegen den koning ophief. Salomo bouwde Millo, *en* sloot de breuk der stad van zijn vader David toe.","28":"En de man Jerobeam was een dapper held. Toen Salomo dezen jongeling zag, dat hij arbeidzaam was, zo stelde hij hem over al den last van het huis van Jozef.","29":"Het geschiedde nu te dier tijd, als Jerobeam uit Jeruzalem uitging, dat de profeet Ahia, de Siloniet, hem op den weg vond, en hij zich een nieuw kleed aangedaan had, en zij beiden alleen op het veld waren;","30":"Zo vatte Ahia het nieuwe kleed, dat aan hem was, en scheurde het, in twaalf stukken.","31":"En hij zeide tot Jerobeam: Neem u tien stukken; want alzo zegt de HEERE, de God Israëls: Zie, Ik zal het koninkrijk van de hand van Salomo scheuren, en u tien stammen geven.","32":"Maar een stam zal hij hebben, om Mijns knechts Davids wil, en om Jeruzalems wil, de stad, die Ik verkoren heb uit alle stammen van Israël.","33":"Daarom dat zij Mij verlaten, en zich nedergebogen hebben voor Astoreth, den god der Sidoniërs, Kamos, den god der Moabieten, en Milchom, den god der kinderen Ammons; en niet gewandeld hebben in Mijn wegen, om te doen wat recht is in Mijn ogen, te weten Mijn inzettingen en Mijn rechten; gelijk zijn vader David.","34":"Doch niets van dit koninkrijk zal Ik uit zijn hand nemen; maar Ik stel hem tot een vorst al de dagen zijns levens, om Mijns knechts Davids wil, dien Ik verkoren heb, die Mijn geboden en Mijn inzettingen gehouden heeft.","35":"Maar uit de hand zijns zoons zal Ik het koninkrijk nemen; en Ik zal u daarvan tien stammen geven.","36":"En zijn zoon zal Ik een stam geven; opdat Mijn knecht David altijd een lamp voor Mijn aangezicht hebbe in Jeruzalem, de stad, die Ik Mij verkoren heb, om Mijn Naam daar te stellen.","37":"Zo zal Ik u nemen, en gij zult regeren over al wat uw ziel zal begeren; en gij zult koning zijn over Israël.","38":"En het zal geschieden, zo gij horen zult al wat Ik u zal gebieden, en in Mijn wegen zult wandelen, en doen wat recht in Mijn ogen is, houdende Mijn inzettingen en Mijn geboden, gelijk als Mijn knecht David gedaan heeft; dat Ik met u zal zijn, en u een bestendig huis bouwen, gelijk als Ik David gebouwd heb, en zal u Israël geven.","39":"En Ik zal om diens wil het zaad van David verootmoedigen; nochtans niet altijd.","40":"Daarom zocht Salomo Jerobeam te doden; maar Jerobeam maakte zich op, en vlood in Egypte, tot Sisak, den koning van Egypte, en was in Egypte, totdat Salomo stierf.","41":"Het overige nu der geschiedenissen van Salomo, en al wat hij gedaan heeft, en zijn wijsheid, is dat niet geschreven in het boek der geschiedenissen van Salomo?","42":"De tijd nu, dien Salomo te Jeruzalem over het ganse Israël regeerde, was veertig jaar.","43":"Daarna ontsliep Salomo met zijn vaderen, en werd begraven in de stad van zijn vader David; en Rehabeam, zijn zoon, werd koning in zijn plaats."},"KJV":{"1":"But king Solomon loved many strange women, together with the daughter of Pharaoh, women of the Moabites, Ammonites, Edomites, Zidonians, and Hittites;","2":"Of the nations concerning which the LORD said unto the children of Israel, Ye shall not go in to them, neither shall they come in unto you: for surely they will turn away your heart after their gods: Solomon clave unto these in love.","3":"And he had seven hundred wives, princesses, and three hundred concubines: and his wives turned away his heart.","4":"For it came to pass, when Solomon was old, that his wives turned away his heart after other gods: and his heart was not perfect with the LORD his God, as was the heart of David his father.","5":"For Solomon went after Ashtoreth the goddess of the Zidonians, and after Milcom the abomination of the Ammonites.","6":"And Solomon did evil in the sight of the LORD, and went not fully after the LORD, as did David his father.","7":"Then did Solomon build an high place for Chemosh, the abomination of Moab, in the hill that is before Jerusalem, and for Molech, the abomination of the children of Ammon.","8":"And likewise did he for all his strange wives, which burnt incense and sacrificed unto their gods.","9":"And the LORD was angry with Solomon, because his heart was turned from the LORD God of Israel, which had appeared unto him twice,","10":"And had commanded him concerning this thing, that he should not go after other gods: but he kept not that which the LORD commanded.","11":"Wherefore the LORD said unto Solomon, Forasmuch as this is done of thee, and thou hast not kept my covenant and my statutes, which I have commanded thee, I will surely rend the kingdom from thee, and will give it to thy servant.","12":"Notwithstanding in thy days I will not do it for David thy father's sake: but I will rend it out of the hand of thy son.","13":"Howbeit I will not rend away all the kingdom; but will give one tribe to thy son for David my servant's sake, and for Jerusalem's sake which I have chosen.","14":"And the LORD stirred up an adversary unto Solomon, Hadad the Edomite: he was of the king's seed in Edom.","15":"For it came to pass, when David was in Edom, and Joab the captain of the host was gone up to bury the slain, after he had smitten every male in Edom;","16":"(For six months did Joab remain there with all Israel, until he had cut off every male in Edom:)","17":"That Hadad fled, he and certain Edomites of his father's servants with him, to go into Egypt; Hadad being yet a little child.","18":"And they arose out of Midian, and came to Paran: and they took men with them out of Paran, and they came to Egypt, unto Pharaoh king of Egypt; which gave him an house, and appointed him victuals, and gave him land.","19":"And Hadad found great favour in the sight of Pharaoh, so that he gave him to wife the sister of his own wife, the sister of Tahpenes the queen.","20":"And the sister of Tahpenes bare him Genubath his son, whom Tahpenes weaned in Pharaoh's house: and Genubath was in Pharaoh's household among the sons of Pharaoh.","21":"And when Hadad heard in Egypt that David slept with his fathers, and that Joab the captain of the host was dead, Hadad said to Pharaoh, Let me depart, that I may go to mine own country.","22":"Then Pharaoh said unto him, But what hast thou lacked with me, that, behold, thou seekest to go to thine own country? And he answered, Nothing: howbeit let me go in any wise.","23":"And God stirred him up another adversary, Rezon the son of Eliadah, which fled from his lord Hadadezer king of Zobah:","24":"And he gathered men unto him, and became captain over a band, when David slew them of Zobah: and they went to Damascus, and dwelt therein, and reigned in Damascus.","25":"And he was an adversary to Israel all the days of Solomon, beside the mischief that Hadad did: and he abhorred Israel, and reigned over Syria.","26":"And Jeroboam the son of Nebat, an Ephrathite of Zereda, Solomon's servant, whose mother's name was Zeruah, a widow woman, even he lifted up his hand against the king.","27":"And this was the cause that he lifted up his hand against the king: Solomon built Millo, and repaired the breaches of the city of David his father.","28":"And the man Jeroboam was a mighty man of valour: and Solomon seeing the young man that he was industrious, he made him ruler over all the charge of the house of Joseph.","29":"And it came to pass at that time when Jeroboam went out of Jerusalem, that the prophet Ahijah the Shilonite found him in the way; and he had clad himself with a new garment; and they two were alone in the field:","30":"And Ahijah caught the new garment that was on him, and rent it in twelve pieces:","31":"And he said to Jeroboam, Take thee ten pieces: for thus saith the LORD, the God of Israel, Behold, I will rend the kingdom out of the hand of Solomon, and will give ten tribes to thee:","32":"(But he shall have one tribe for my servant David's sake, and for Jerusalem's sake, the city which I have chosen out of all the tribes of Israel:)","33":"Because that they have forsaken me, and have worshipped Ashtoreth the goddess of the Zidonians, Chemosh the god of the Moabites, and Milcom the god of the children of Ammon, and have not walked in my ways, to do that which is right in mine eyes, and to keep my statutes and my judgments, as did David his father.","34":"Howbeit I will not take the whole kingdom out of his hand: but I will make him prince all the days of his life for David my servant's sake, whom I chose, because he kept my commandments and my statutes:","35":"But I will take the kingdom out of his son's hand, and will give it unto thee, even ten tribes.","36":"And unto his son will I give one tribe, that David my servant may have a light alway before me in Jerusalem, the city which I have chosen me to put my name there.","37":"And I will take thee, and thou shalt reign according to all that thy soul desireth, and shalt be king over Israel.","38":"And it shall be, if thou wilt hearken unto all that I command thee, and wilt walk in my ways, and do that is right in my sight, to keep my statutes and my commandments, as David my servant did; that I will be with thee, and build thee a sure house, as I built for David, and will give Israel unto thee.","39":"And I will for this afflict the seed of David, but not for ever.","40":"Solomon sought therefore to kill Jeroboam. And Jeroboam arose, and fled into Egypt, unto Shishak king of Egypt, and was in Egypt until the death of Solomon.","41":"And the rest of the acts of Solomon, and all that he did, and his wisdom, are they not written in the book of the acts of Solomon?","42":"And the time that Solomon reigned in Jerusalem over all Israel was forty years.","43":"And Solomon slept with his fathers, and was buried in the city of David his father: and Rehoboam his son reigned in his stead."}},"tsk":{"1":[{"kopje":"lief","refs":["1 Kon 11:8","Gen 6:2-5","Deut 17:17","Neh 13:23-27","Spr 2:16","Spr 5:8-20","Spr 6:24","Spr 7:5","Spr 22:14","Spr 23:33"]},{"kopje":"behalve","refs":["1 Kon 3:1","Lev 18:18"]}],"2":[{"kopje":"U zult tot hen niet ingaan","refs":["Ex 23:32","Ex 23:33","Ex 34:16","Deut 7:3","Deut 7:4","Joz 23:12","Joz 23:13","Ezra 9:12","Ezra 10:2-17","Mal 2:11"]},{"kopje":"zeker","refs":["1 Kon 16:31-33","Num 25:1-3","Richt 3:6","Richt 3:7","2 Kron 21:6","2 Kor 6:14-16"]},{"kopje":"Salomo","refs":["Gen 2:24","Gen 34:3","Richt 16:4-21","2 Kron 19:2","Ps 139:21","Rom 1:32","Rom 12:9","1 Kor 15:33","Openb 2:4"]}],"3":[{"kopje":"zevenhonderd","refs":["Richt 8:30","Richt 8:31","Richt 9:5","2 Sam 3:2-5","2 Sam 5:13-16","2 Kron 11:21","Pred 7:28"]}],"4":[{"kopje":"in de tijd van Salomo's ouderdom","refs":["1 Kon 11:42","1 Kon 6:1","1 Kon 9:10","1 Kon 14:21"]},{"kopje":"zijn vrouwen","refs":["1 Kon 11:2","Deut 7:4","Deut 17:17","Neh 13:26","Neh 13:27"]},{"kopje":"zijn hart","refs":["1 Kon 11:6","1 Kon 11:38","1 Kon 6:12","1 Kon 6:13","1 Kon 8:61","1 Kon 9:4","1 Kon 15:3","1 Kon 15:14","2 Kon 20:3","1 Kron 28:9","1 Kron 29:19","2 Kron 17:3","2 Kron 25:2","2 Kron 31:20","2 Kron 31:21","2 Kron 34:2"]}],"5":[{"kopje":"Astoreth","refs":["1 Kon 11:33","Richt 2:13","Richt 10:6","1 Sam 7:3","1 Sam 7:4","1 Sam 12:10","2 Kon 23:13","Jer 2:10-13"]},{"kopje":"Milchom","refs":["1 Kon 11:7","Lev 18:21","Lev 20:2-5","Zef 1:5"]}],"6":[{"kopje":"volhardde niet in het volgen","refs":["Num 14:24","Joz 14:8","Joz 14:14"]}],"7":[{"kopje":"hoogte","refs":["Lev 26:30","Num 33:52","2 Kon 21:2","2 Kon 21:3","2 Kon 23:13","2 Kon 23:14","Ps 78:58","Ezech 20:28","Ezech 20:29"]},{"kopje":"Kamos","refs":["Num 21:29","Richt 11:24","Jer 48:13"]},{"kopje":"verfoeisel },{"disp":"2 Kon 21:25","href":"../../2-koningen/21/#v25","ref":"2 Kon 21:25","svLabel":null},{"disp":"1 Kron 9:1","href":"../../1-kronieken/9/#v1","ref":"1 Kron 9:1","svLabel":null},{"disp":"1 Kron 27:24","href":"../../1-kronieken/27/#v24","ref":"1 Kron 27:24","svLabel":null},{"disp":"1 Kron 29:29","href":"../../1-kronieken/29/#v29","ref":"1 Kron 29:29","svLabel":null},{"disp":"2 Kron 9:29","href":"../../2-kronieken/9/#v29","ref":"2 Kron 9:29","svLabel":null},{"disp":"2 Kron 12:15","href":"../../2-kronieken/12/#v15","ref":"2 Kron 12:15","svLabel":null},{"disp":"2 Kron 20:34","href":"../../2-kronieken/20/#v34","ref":"2 Kron 20:34","svLabel":null},{"disp":"2 Kron 26:22","href":"../../2-kronieken/26/#v22","ref":"2 Kron 26:22","svLabel":null},{"disp":"2 Kron 32:32","href":"../../2-kronieken/32/#v32","ref":"2 Kron 32:32","svLabel":null},{"disp":"Ezra 5:17","href":"../../ezra/5/#v17","ref":"Ezra 5:17","svLabel":null},{"disp":"Est 6:1","href":"../../esther/6/#v1","ref":"Est 6:1","svLabel":null}],"kinderen":[]}]}],"torrey":[{"topic":"Books","href":"../../torrey/b/#t-books","kinderen":[{"label":"Not Extant, But Mentioned In Scripture","href":"../../torrey/b/?hl=1Kgs.11.41#i1976","refs":[],"kinderen":[{"label":"Acts of Solomon","href":"../../torrey/b/?hl=1Kgs.11.41#i1981","refs":[{"disp":"1 Kon 11:41","href":"../../1-koningen/11/#v41","ref":"1 Kon 11:41","svLabel":null}],"kinderen":[]}]}]}]},"43":{"nave":[{"topic":"Rehoboam","href":"../../nave/r/#t-rehoboam","kinderen":[{"label":"Successor to Solomon as king","href":"../../nave/r/?hl=1Kgs.11.43#i17076","refs":[{"disp":"1 Kon 11:43","href":"../../1-koningen/11/#v43","ref":"1 Kon 11:43","svLabel":null},{"disp":"2 Kron 9:31","href":"../../2-kronieken/9/#v31","ref":"2 Kron 9:31","svLabel":null}],"kinderen":[]}]}]}},"extern":{"1 Kon 12:16":"Toen heel Israël zag dat de koning niet naar hen hoorde, gaf het volk de koning antwoord terug en zei: Wat deel hebben wij aan David? Ja, wij hebben geen erfdeel aan de zoon van Isaï; naar uw tenten, o Israël! Zie nu naar uw eigen huis om, o David! Zo ging Israël naar zijn tenten.","Deut 32:43":"Juich, heidenen, met Zijn volk! want Hij zal het bloed van Zijn knechten wreken; en Hij zal de wraak op Zijn tegenpartijen doen wederkeren, en verzoenen Zijn land en Zijn volk.","Jer 33:17-21":"Want zo zegt de HEERE: Aan David zal het nooit ontbreken aan een Man, Die op de troon van het huis van Israël zit. Ook zal het de Levitische priesters nooit ontbreken aan een Man voor Mijn aangezicht, die brandoffer offert, en spijsoffer aansteekt, en slachtoffer bereidt, alle dagen. En het woord van de HEERE kwam tot Jeremia, en Hij zei:","Jer 4:4":"Besnijd u voor de HEERE en doe de voorhuiden van uw hart weg, mannen van Juda en inwoners van Jeruzalem! Anders zal Mijn grimmigheid uitvaren als een vuur, en branden zodat niemand het kan blussen, vanwege de slechtheid van uw daden.","Jes 49:6":"Verder zei Hij: Het is te gering, dat U Mij een Knecht zou zijn, om op te richten de stammen van Jakob, en om terug te brengen de bewaarden in Israël; Ik heb U ook gegeven tot een Licht van de heidenen, om Mijn heil te zijn tot aan het einde van de aarde.","Jes 60:20":"Uw zon zal niet meer ondergaan, en uw maan zal haar licht niet intrekken; want de HEERE zal u tot een eeuwig licht zijn, en de dagen van uw treuren zullen een einde nemen.","2 Petr 1:19":"En wij hebben het profetische woord, dat zeer vast is, en u doet er goed aan daarop acht te geven, als op een licht dat schijnt in een duistere plaats, totdat de dag aanlicht en de morgenster opgaat in uw harten.","1 Kron 3:10":"Salomo's zoon nu was Rehabeam; zijn zoon was Abia; zijn zoon was Asa; zijn zoon was Josafat;","Mal 3:6":"Want Ik, de HEERE, word niet veranderd; daarom zijn u, kinderen van Jakob, niet verteerd.","Amos 9:12":"Opdat zij het overblijfsel van Edom erfelijk bezitten, en alle heidenvolken die naar Mijn Naam genoemd worden, spreekt de HEERE, Die dit doet.","Gen 19:16":"Maar hij aarzelde; toen grepen die mannen zijn hand, en de hand van zijn vrouw, en de hand van zijn twee dochters, omdat de HEERE hem genadig was; en zij brachten hem naar buiten, en zetten hem buiten de stad neer.","Ps 30:6":"Want een ogenblik is er in Zijn toorn, maar een leven in Zijn goedgunstigheid; 's avonds vernacht het geween, maar 's morgens is er gejuich.","Spr 5:8-20":"Maak uw weg ver van haar vandaan, en kom niet bij de deur van haar huis; Opdat u anderen uw eer niet geeft, en uw jaren aan de wrede; Opdat vreemden zich niet verzadigen van uw vermogen, en al uw smartelijke arbeid niet komt in het huis van de onbekende;","Ps 146:7":"Die de verdrukte recht doet, Die de hongerige brood geeft; de HEERE maakt de gevangenen los.","1 Sam 28:18":"Zoals u naar de stem van de HEERE niet geluisterd hebt, en de gloed van Zijn toorn niet uitgevoerd hebt tegen Amalek; daarom heeft de HEERE u deze zaak aangedaan op deze dag.","Jer 51:45":"Ga uit, Mijn volk, uit haar midden, en red ieder zijn ziel, vanwege de gloed van de toorn van de HEERE.","Ps 132:11":"De HEERE heeft David de waarheid gezworen, waarvan Hij niet wijken zal, en zei: Van de vrucht van uw buik zal Ik op uw troon zetten.","Jer 10:10":"Maar de HEERE God is de Waarheid, Hij is de levende God, en een eeuwige Koning; van Zijn verbolgenheid beeft de aarde, en de heidenen kunnen Zijn gramschap niet verdragen.","Jer 3:12":"Ga heen, en roep deze woorden uit naar het noorden, en zeg: Bekeer u, afgekeerd Israël! spreekt de HEERE, dan zal Ik Mijn toorn niet op u laten vallen; want Ik ben goedertieren, spreekt de HEERE. Ik zal de toorn niet voor eeuwig behouden.","2 Kron 22:7":"De val van Ahazia nu was van God, doordat hij naar Joram kwam; want toen hij gekomen was, ging hij met Joram uit naar Jehu, de zoon van Nimsi, aan wie de HEERE gezalfd had om het huis van Achab uit te roeien.","Rom 1:18":"Want de toorn van God wordt geopenbaard van de hemel over alle goddeloosheid en ongerechtigheid van de mensen, die de waarheid in ongerechtigheid ten onder houden.","Richt 3:6":"namen zij zich van hun dochters tot vrouwen, en gaven hun eigen dochters aan hun zonen; en zij dienden hun goden.","1 Sam 13:13":"Toen zei Samuël tegen Saul: U hebt dwaas gedaan; u hebt het gebod van de HEERE, uw God, niet gehouden, dat Hij u geboden had; want de HEERE zou nu uw koningschap over Israël voor eeuwig bevestigd hebben.","2 Kron 7:6":"Ook stonden de priesters op hun posten, en de Levieten met de muzikale instrumenten van de HEERE, die de koning David gemaakt had, om de HEERE te loven, dat Zijn goedertierenheid in eeuwigheid is, wanneer David door hun dienst Hem prees; en de priesters bliezen de trompetten tegenover hen, en heel Israël stond.","Ezech 20:29":"En Ik zei tegen hen: Wat is die hoogte, waarheen u gaat? Toch wordt de naam daarvan tot op deze dag hoogte genoemd.","1 Kor 5:6-8":"Uw roem is niet goed. Weet u niet dat een beetje zuurdesem het hele deeg zuur maakt? Zuiver dan de oude zuurdesem weg, opdat u een nieuw deeg mag zijn, zoals u ongezuurd bent. Want ook ons Pascha is voor ons geslacht, namelijk Christus. Laten we dan feest houden, niet met de oude zuurdesem, ook niet met de zuurdesem van kwaadheid en boosheid, maar met de ongezuurde broden van oprechtheid en waarheid.","Hand 3:17":"En nu, broeders, ik weet dat u het door onwetendheid hebt gedaan, zoals ook uw leiders.","Gen 18:30":"Verder zei hij: Laat de Heere toch niet boos worden, dat ik spreek; misschien zullen daar dertig gevonden worden! En Hij zei: Ik zal het niet doen, als Ik daar dertig zal vinden.","Gen 8:21":"En de HEERE rook die liefelijke reuk, en de HEERE zei in Zijn hart: Ik zal voortaan de aardbodem niet meer vervloeken om de mens; want het gedichtsel van het hart van de mens is slecht van zijn jeugd aan; en Ik zal voortaan niet meer al het levende slaan, zoals Ik gedaan heb.","1 Kon 9:5":"Dan zal Ik de troon van uw koninkrijk over Israël bevestigen in eeuwigheid; zoals Ik gesproken heb over uw vader David, en zei: Er zal u geen man afgesneden worden van de troon van Israël.","Gen 41:38-44":"Toen zei Farao tegen zijn dienaars: Zouden wij wel een man vinden zoals deze, in wie de Geest van God is? Daarna zei Farao tegen Jozef: Omdat God u dit alles heeft bekendgemaakt, is er niemand zo verstandig en wijs als u. U zult over mijn huis zijn, en op uw bevel zal heel mijn volk de hand kussen; alleen door de troon zal ik groter zijn dan u.","Gen 35:16":"En zij reisden verder van Bethel; en er was nog een kleine afstand om tot Efrath te komen; en Rachel baarde, en zij had het zwaar bij haar bevalling.","1 Sam 7:3":"Toen sprak Samuël tot heel het huis van Israël en zei: Als u zich met heel uw hart tot de HEERE bekeert, doe dan de vreemde goden uit uw midden weg, ook de Astharoths; en richt uw hart op de HEERE, en dien Hem alleen, dan zal Hij u uit de hand van de Filistijnen rukken.","1 Joh 1:5":"En dit is de verkondiging die wij van Hem gehoord hebben, en wij verkondigen u, dat God een Licht is, en dat er in Hem helemaal geen duisternis is.","Ps 37:8":"He. Laat af van toorn, en verlaat de woede; wind u niet op, zeker niet, om kwaad te doen.","Lev 26:40-45":"Dan zullen zij hun ongerechtigheid belijden, en de ongerechtigheid van hun vaderen met hun overtredingen, waarmee zij tegen Mij overtreden hebben, en ook dat zij tegen Mij in gewandeld hebben. Dat Ik ook tegen hen in gewandeld heb, en hen in het land van hun vijanden gebracht heb. Als dan hun onbesneden hart gebogen wordt, en zij dan de straf voor hun ongerechtigheid aanvaarden; Dan zal Ik denken aan Mijn verbond met Jakob, en ook aan Mijn verbond met Izak, en ook aan Mijn verbond met Abraham zal Ik denken, en aan het land zal Ik denken;","Klaagl 3:32":"Caph. Maar als Hij bedroefd heeft, zo zal Hij Zich ontfermen, naar de grootheid van Zijn blijken van goedertierenheid.","Spr 29:12":"Een heerser die op leugentaal let, al zijn dienaars worden goddeloos.","2 Kron 26:22":"Het overige nu van de geschiedenissen van Uzzia, de eerste en de laatste, heeft de profeet Jesaja, de zoon van Amos, beschreven.","Ezra 5:5":"Doch het oog van hun God was over de oudsten van de Joden, zodat men hen niet kon tegenhouden, totdat de zaak bij Darius kwam, en zij daarna daarover een brief terugbrachten.","Ps 75:8":"Maar God is Rechter; Hij vernedert deze, en verhoogt die.","Ps 119:105":"Nun. Uw woord is een lamp voor mijn voet, en een licht voor mijn pad.","Jer 7:20":"Daarom zegt de Heere HEERE zo: Zie, Mijn toorn en Mijn grimmigheid zal uitgestort worden over deze plaats, over de mensen en over de dieren, en over de bomen van het veld, en over de vrucht van het aardrijk; en het zal branden, en niet uitgeblust worden.","2 Sam 7:29":"Zo belieft het U nu, en zegen het huis van Uw knecht, dat het in eeuwigheid voor Uw aangezicht blijft; want U, Heere HEERE, hebt het gesproken, en met Uw zegen zal het huis van Uw knecht gezegend worden in eeuwigheid.","Ps 32:5":"Mijn zonde maakte ik U bekend, en mijn ongerechtigheid bedekte ik niet. Ik zei: Ik zal belijdenis van mijn overtredingen doen voor de HEERE; en U vergaf de ongerechtigheid van mijn zonde. Sela.","Jona 4:10":"En de HEERE zei: U hebt medelijden met de wonderboom, waarvoor u niet gewerkt hebt en die u niet hebt laten groeien; die in één nacht ontstond, en in één nacht verging.","Klaagl 3:23":"Cheth. Zij zijn elke morgen nieuw, Uw trouw is groot.","Amos 9:11":"Op die dag zal Ik de vervallen hut van David weer oprichten, en Ik zal haar scheuren dichtmaken, en wat aan haar is afgebroken weer oprichten, en zal haar bouwen, als in de dagen van vroeger;","Jer 31:20":"Is Efraïm Mij niet een dierbare zoon, is hij Mij niet een troetelkind? Want sinds Ik tegen hem gesproken heb, denk Ik nog met ernst aan hem; daarom rommelt Mijn binnenste over hem; Ik zal Mij zijn zeker ontfermen, spreekt de HEERE.","Deut 20:13":"En de HEERE, uw God, zal haar in uw hand geven; en u zult alles wat mannelijk daarin is, slaan met de scherpte van het zwaard;","Klaagl 4:11":"Caph. De HEERE heeft Zijn grimmigheid volbracht, Hij heeft de gloed van Zijn toorn uitgestort; en Hij heeft in Sion een vuur aangestoken, dat haar fundamenten verteerd heeft.","Gen 19:22":"Haast u, vlucht daarheen; want Ik zal niets kunnen doen, totdat u daar aangekomen bent. Daarom noemde men de naam van deze stad Zoar.","1 Sam 14:47":"Toen nam Saul het koningschap over Israël in bezit; en hij streed rondom tegen al zijn vijanden: tegen Moab, en tegen de kinderen van Ammon, en tegen Edom, en tegen de koningen van Zoba, en tegen de Filistijnen; en overal waarheen hij zich wendde, strafte hij hen.","Jak 4:8":"Kom dicht bij God, en Hij zal dicht bij u komen. Reinig de handen, zondaars, en zuiver de harten, dubbelhartigen!","1 Sam 26:19":"En nu, laat mijn heer de koning toch luisteren naar de woorden van zijn dienaar. Als de HEERE u tegen mij opzet, laat Hem dan het spijsoffer ruiken; maar als het mensenkinderen zijn, dan zijn zij vervloekt voor het aangezicht van de HEERE, omdat zij mij vandaag verjaagd hebben, zodat ik niet vast verbonden kan blijven aan het erfdeel van de HEERE, en zeggen: Ga heen, dien andere goden.","Spr 22:14":"De mond van vreemde vrouwen is een diepe kuil; op wie de HEERE vertoornd is, zal daarin vallen.","2 Sam 7:16":"Doch uw huis zal bestendig zijn, en uw koninkrijk tot in eeuwigheid, voor uw aangezicht; uw troon zal vast zijn tot in eeuwigheid.","Gal 4:26":"Maar het Jeruzalem dat boven is, is vrij, en dat is onze aller moeder.","Jes 8:10":"Beraadslaag een plan, toch zal het vernietigd worden; spreek een woord, toch zal het niet standhouden; want God is met ons!","Deut 17:4":"En het wordt u aangezegd, en u hoort het; dan moet u het goed onderzoeken; en zie, het is de waarheid, de zaak staat vast, zo'n gruwel is in Israël gedaan;","1 Kon 11:1-13":"En koning Salomo had, behalve de dochter van Farao, veel vreemde vrouwen lief: Moabitische, Ammonitische, Edomitische, Sidonische en Hethitische vrouwen; van de volken waarvan de HEERE tegen de kinderen van Israël gezegd had: U zult tot hen niet ingaan, en zij zullen tot u niet inkomen; zij zouden zeker uw hart naar hun goden doen neigen; aan deze hing Salomo met liefde. En hij had zevenhonderd vrouwen, vorstinnen, en driehonderd bijvrouwen, en zijn vrouwen deden zijn hart neigen.","Ps 106:23":"Daarom zei Hij dat Hij hen zou verdelgen, ware het niet dat Mozes, Zijn uitverkorene, in de scheur voor Zijn aangezicht gestaan had, om Zijn grimmigheid af te keren, zodat Hij hen niet verdierf.","Rom 11:28":"Zo zijn zij wel vijanden aangaande het Evangelie, om uwentwil, maar aangaande de verkiezing zijn zij geliefden, om de vaderen wil;","Deut 32:29":"O, dat zij wijs waren; zij zouden dit vernemen, zij zouden op hun einde letten.","Deut 32:36":"Want de HEERE zal Zijn volk recht doen, en het zal Hem berouwen over Zijn knechten; want Hij zal zien, dat de hand is weggegaan, en er niemand meer over is, gebonden of vrij.","Ex 34:6":"Toen de HEERE nu voor zijn aangezicht voorbijging, riep Hij: HEERE, HEERE, God, barmhartig en genadig, geduldig en groot van goedertierenheid en waarheid.","Ezech 29:19":"Daarom, zo zegt de Heere HEERE: Zie, Ik zal Nebukadrezar, de koning van Babel, Egypteland geven; en hij zal haar menigte wegvoeren, en haar buit buitmaken, en haar roof roven, en het zal het loon zijn voor zijn leger.","Gen 12:7":"Toen verscheen de HEERE aan Abram, en zei: Aan uw nageslacht zal Ik dit land geven. Toen bouwde hij daar een altaar voor de HEERE, Die hem verschenen was.","1 Kron 18:13":"En hij legde bezetting in Edom, zodat alle Edomieten Davids knechten werden; en de HEERE gaf David de overwinning overal waar hij heenging.","1 Kon 9:5-7":"Dan zal Ik de troon van uw koninkrijk over Israël bevestigen in eeuwigheid; zoals Ik gesproken heb over uw vader David, en zei: Er zal u geen man afgesneden worden van de troon van Israël. Maar als u zich helemaal afkeert, u en uw kinderen, van Mij, om Mij niet meer te volgen, en Mijn geboden en Mijn inzettingen, die Ik voor uw aangezicht gegeven heb, niet houdt, maar heengaat en andere goden dient, en u voor hen neerbuigt; Dan zal Ik Israël uitroeien van het land, dat Ik hun gegeven heb, en dit huis, dat Ik voor Mijn Naam geheiligd heb, zal Ik van Mijn aangezicht wegwerpen; en Israël zal tot een spreekwoord en spotrede zijn onder alle volken.","Ps 32:2":"Gelukkig is de mens, die de HEERE de ongerechtigheid niet toerekent, en in wiens geest geen bedrog is.","Jak 2:13":"Want een onbarmhartig oordeel zal komen over hem die geen barmhartigheid bewezen heeft; en de barmhartigheid triomfeert over het oordeel.","1 Kon 11:26-35":"Verder kwam Jerobeam, de zoon van Nebat, een Efrathiet uit Zereda, dienaar van Salomo (wiens moeder Zerua heette, een weduwe), ook tegen de koning in opstand. Dit is nu de zaak waarom hij tegen de koning in opstand kwam. Salomo bouwde Millo, en herstelde de bres in de stad van zijn vader David. De man Jerobeam was een dapper held. Toen Salomo deze jongeman zag, dat hij hard werkte, stelde hij hem aan over al de lastdienst van het huis van Jozef.","Deut 33:2":"Hij zei: De HEERE is van Sinaï gekomen, en is hun opgegaan van Seïr; Hij is blinkend verschenen van het gebergte Paran, en is aangekomen met tienduizenden van de heiligen; tot Zijn rechterhand was een vurige wet aan hen.","Ps 17:14":"Met Uw hand van de mensen, o HEERE! Van de mensen, die van de wereld zijn, wier deel in dit leven is, wier buik U vult met Uw verborgen schat; de kinderen worden verzadigd, en zij laten hun overschot achter aan hun kinderen.","Ps 78:21":"Daarom hoorde de HEERE, en werd verbolgen; en een vuur werd ontstoken tegen Jakob, en ook toorn ging op tegen Israël;","Ef 5:8":"Want u was eertijds duisternis, maar nu bent u licht in de Heere; wandel als kinderen van het licht.","Richt 10:6":"Toen gingen de Israëlieten opnieuw doen wat slecht was in de ogen van de HEERE: zij dienden de Baäls en de Astartes, de goden van Syrië, de goden van Sidon, de goden van Moab, de goden van de Ammonieten, alsook de goden van de Filistijnen; zij verlieten de HEERE en dienden Hem niet meer.","Richt 11:24":"Zou u niet erven wat uw god Kamos voor u uit het bezit verdreef? Zo zullen wij alles erven wat de HEERE, onze God, voor ons aangezicht uit het bezit verdrijft.","2 Kron 9:29-31":"Het overige nu van de geschiedenissen van Salomo, van de eerste tot de laatste, is dat niet geschreven in de woorden van Nathan, de profeet, en in de profetie van Ahia, de Siloniet, en in de gezichten van Jedi, de ziener, over Jerobeam, de zoon van Nebat? En Salomo regeerde te Jeruzalem over heel Israël, veertig jaar. En Salomo ontsliep met zijn vaderen, en zij begroeven hem in de stad van zijn vader David; en zijn zoon Rehabeam werd koning in zijn plaats.","2 Sam 17:14":"Toen zeiden Absalom en alle mannen van Israël: De raad van Husai, de Archiet, is beter dan de raad van Achitofel. Doch de HEERE had het zo bepaald, om de goede raad van Achitofel te vernietigen, opdat de HEERE het kwaad over Absalom zou brengen.","Jes 9:18":"Vanwege de verbolgenheid van de HEERE van de heerscharen, zal het land verduisterd worden; en het volk zal zijn als een voedsel van het vuur: de een zal de ander niet ontzien.","Klaagl 3:31-33":"Caph. Want de Heere zal niet verstoten in eeuwigheid. Caph. Maar als Hij bedroefd heeft, zo zal Hij Zich ontfermen, naar de grootheid van Zijn blijken van goedertierenheid. Caph. Want Hij plaagt of bedroeft de kinderen van de mensen niet van harte.","Ps 27:1":"Een psalm van David. De HEERE is mijn Licht en mijn Heil, voor wie zou ik vrezen? De HEERE is de kracht van mijn leven, voor wie zou ik bang zijn?","2 Kon 19:34":"Want Ik zal deze stad beschermen, om die te verlossen, om Mijnentwil, en om de wil van David, Mijn knecht.","2 Kron 9:31":"En Salomo ontsliep met zijn vaderen, en zij begroeven hem in de stad van zijn vader David; en zijn zoon Rehabeam werd koning in zijn plaats.","2 Kon 17:29":"Maar elk volk maakte zijn eigen goden; en zij zetten ze in de huizen van de hoogten, die de Samaritanen gemaakt hadden, elk volk in hun steden waar zij woonden.","Gal 5:7-9":"U liep goed; wie heeft u verhinderd de waarheid niet gehoorzaam te zijn? Deze overtuiging komt niet van Hem, Die u roept. Een beetje zuurdesem verzuurt het hele deeg.","Jer 32:18":"U, Die goedertierenheid bewijst aan duizenden, en de ongerechtigheid van de vaders vergeldt in de schoot van hun kinderen na hen; U grote, U geweldige God, Wiens Naam is HEERE van de heerscharen!","Gen 26:5":"omdat Abraham Mijn stem gehoorzaam is geweest, en Mijn bevel heeft onderhouden, Mijn geboden, Mijn inzettingen en Mijn wetten.","Jer 29:11":"Want Ik weet de gedachten die Ik over u koester, spreekt de HEERE, gedachten van vrede en niet van kwaad, om u het einde en de verwachting te geven.","Ezech 16:6":"Toen Ik bij u voorbijkwam, zag Ik u, vertrapt in uw bloed, en Ik zei tegen u in uw bloed: Leef; ja, Ik zei tegen u in uw bloed: Leef!","Jes 60:10":"En de vreemden zullen uw muren bouwen, en hun koningen zullen u dienen; want in Mijn verbolgenheid heb Ik u geslagen, maar in Mijn welbehagen heb Ik Mij over u ontfermd.","2 Kron 13:7":"Daarbij hebben zich nietswaardige mannen, kinderen van Belial, bij hem verzameld en zich sterk gemaakt tegen Rehabeam, de zoon van Salomo, toen Rehabeam jong was en teder van hart, zodat hij zich tegen hen niet kon verzetten.","Gen 26:4":"En Ik zal uw nageslacht vermenigvuldigen als de sterren van de hemel, en zal aan uw nageslacht al deze landen geven; en in uw nageslacht zullen alle volken van de aarde gezegend worden,","Gen 50:20":"U wel, u hebt kwaad tegen mij gedacht; doch God heeft dat ten goede gedacht; opdat Hij deed, zoals het op deze dag is, om een groot volk in het leven te behouden.","2 Kron 36:23":"Zo zegt Kores, koning van Perzië: De HEERE, de God van de hemel, heeft mij alle koninkrijken van de aarde gegeven; en Hij heeft mij bevolen Hem een huis te bouwen te Jeruzalem, dat in Juda is; wie is er onder u van al Zijn volk? De HEERE, zijn God, zij met hem, en hij trekt op.","1 Sam 25:28":"Vergeef toch uw dienstmaagd de overtreding, want de HEERE zal mijn heer zeker een bestendig huis maken, omdat mijn heer de oorlogen van de HEERE voert, en er geen kwaad bij u gevonden is al uw dagen.","Gen 18:32":"Nog zei hij: Laat de Heere toch niet boos worden, dat ik alleen deze keer nog spreek: misschien zullen er tien gevonden worden. En Hij zei: Ik zal haar niet verwoesten omwille van de tien.","Pred 2:26":"Want Hij geeft wijsheid, kennis en vreugde aan de mens die goed is voor Zijn aangezicht; maar aan de zondaar geeft Hij de bezigheid om te verzamelen en te vergaderen, opdat Hij het geeft aan wie goed is voor Gods aangezicht. Dit is ook ijdelheid en kwelling van de geest.","Ps 106:40":"Daarom is de toorn van de HEERE ontstoken tegen Zijn volk, en Hij heeft een gruwel gehad aan Zijn erfdeel.","2 Kron 21:5":"Tweeëndertig jaar was Joram oud toen hij koning werd, en hij regeerde acht jaar in Jeruzalem.","Openb 16:19":"En de grote stad werd in drie delen gescheurd, en de steden van de heidenvolken vielen; en aan het grote Babylon werd gedacht voor God, om haar de drinkbeker te geven van de wijn van de toorn van Zijn gramschap.","1 Kron 17:13":"Ik zal hem tot een Vader zijn, en hij zal Mij tot een zoon zijn; en Mijn goedertierenheid zal Ik niet van hem wenden, zoals Ik die weggenomen heb van hem die vóór u geweest is;","1 Kor 7:14":"Want de ongelovige man is geheiligd door de vrouw, en de ongelovige vrouw is geheiligd door de man; want anders waren uw kinderen onrein, maar nu zijn zij heilig.","Num 22:7":"Toen gingen de oudsten van Moab en de oudsten van Midian, met het loon voor de waarzeggerij in hun hand; zo kwamen zij bij Bileam, en spraken tot hem de woorden van Balak.","1 Kon 11:14-26":"Zo verwekte de HEERE tegen Salomo een tegenstander, Hadad de Edomiet; hij was van het koninklijk geslacht in Edom. Want het was gebeurd, toen David in Edom was, en Joab, de legeraanvoerder, optrok om de gesneuvelden te begraven, dat hij alles wat mannelijk was in Edom versloeg; want Joab bleef daar zes maanden met heel Israël, totdat hij alles wat mannelijk was in Edom had uitgeroeid.","1 Kron 9:1":"Heel Israël werd in geslachtsregisters geteld, en zie, zij zijn geschreven in het boek van de koningen van Israël. En die van Juda waren weggevoerd naar Babel, vanwege hun overtredingen.","Joz 2:21":"Zij nu zei: Het is zo, naar uw woorden. Toen liet zij hen gaan; en zij gingen weg; en zij bond het scharlaken snoer aan het venster.","Ezech 16:42":"Zo zal Ik Mijn grimmigheid op u laten rusten, en Mijn ijver zal van u wijken; en Ik zal stil zijn, en niet meer toornig zijn.","2 Petr 3:15":"En beschouw het geduld van onze Heere als redding; zoals ook onze geliefde broeder Paulus, naar de wijsheid die hem gegeven is, aan u geschreven heeft;","Ezech 18:32":"Want Ik heb geen lust aan de dood van hem die sterft, spreekt de Heere HEERE; daarom bekeer u en leef.","2 Kron 32:32":"Het overige van de geschiedenissen van Jehizkia, en zijn goeddadigheden, zie, die zijn geschreven in het visioen van de profeet Jesaja, de zoon van Amoz, en in het boek van de koningen van Juda en Israël.","Spr 28:8":"Wie zijn bezit vermeerdert met woeker en met overwinst, verzamelt dat voor hem die zich over de arme ontfermt.","2 Kron 31:20":"Zo deed Hizkia in heel Juda; en hij deed wat goed, en recht, en waarachtig was, voor het aangezicht van de HEERE, zijn God.","1 Kron 18:5":"En de Syriërs van Damaskus kwamen om Hadar-ezer, de koning van Zoba, te helpen; maar David sloeg van de Syriërs tweeëntwintigduizend man.","1 Kron 2:34":"En Sesan had geen zonen, maar dochters. En Sesan had een Egyptische knecht, wiens naam was Jarha.","1 Kron 19:6-19":"Toen de kinderen van Ammon zagen dat zij zich stinkend gemaakt hadden bij David, stuurden Hanun en de kinderen van Ammon duizend talenten van het zilver, om zich wagens en ruiters te huren uit Mesopotamië, en uit Syrië-Maächa, en uit Zoba; zodat zij zich tweeëndertigduizend wagens huurden; en de koning van Maächa en zijn volk kwamen en legerden zich voor Medeba; ook verzamelden de kinderen van Ammon zich uit hun steden, en zij kwamen ten strijde. Toen David dit hoorde, stuurde hij Joab en het hele leger met de helden.","Gen 39:21":"Maar de HEERE was met Jozef, en bewees hem Zijn goedertierenheid; en gaf hem genade in de ogen van de leider van de gevangenis.","Jer 48:46":"Wee u, Moab! Het volk van Kamos is verloren; want uw zonen zijn weggenomen in gevangenschap; ook zijn uw dochters in gevangenschap.","Ex 20:22":"Toen zei de HEERE tegen Mozes: Zo zult u tegen de kinderen van Israël zeggen: U hebt gezien dat Ik met u vanuit de hemel gesproken heb.","Gen 47:4":"Verder zeiden zij tegen Farao: Wij zijn gekomen om als vreemdelingen in dit land te wonen; want er is geen weide voor de schapen die uw knechten hebben, omdat de honger zwaar is in het land Kanaän; en laat nu toch uw knechten in het land Gosen wonen!","Ezech 20:42":"En u zult weten dat Ik de HEERE ben, wanneer Ik u in het land van Israël gebracht zal hebben, in het land waarover Ik Mijn hand heb opgeheven om het aan uw vaderen te geven.","Ps 105:17":"Hij zond een man voor hun aangezicht heen; Jozef werd verkocht tot een slaaf.","Klaagl 2:1":"Aleph. Hoe heeft de Heere de dochter Sion in Zijn toorn bewolkt? Hij heeft de heerlijkheid van Israël van de hemel op de aarde neergeworpen; en Hij heeft aan de voetbank van Zijn voeten niet gedacht in de dag van Zijn toorn.","1 Kon 11:26-40":"Verder kwam Jerobeam, de zoon van Nebat, een Efrathiet uit Zereda, dienaar van Salomo (wiens moeder Zerua heette, een weduwe), ook tegen de koning in opstand. Dit is nu de zaak waarom hij tegen de koning in opstand kwam. Salomo bouwde Millo, en herstelde de bres in de stad van zijn vader David. De man Jerobeam was een dapper held. Toen Salomo deze jongeman zag, dat hij hard werkte, stelde hij hem aan over al de lastdienst van het huis van Jozef.","Jak 5:15":"En het gebed van het geloof zal de zieke behouden, en de Heere zal hem oprichten; en als hij zonden gedaan heeft, zal het hem vergeven worden.","Num 14:23":"zij zullen het land dat Ik hun vaderen gezworen heb, zeker niet zien. Ja, niemand van hen die Mij getergd hebben, zal dat zien!","Filem 1:1":"Paulus, een gevangene van Christus Jezus, en Timotheüs, de broeder, aan Filemon, de geliefde, en onze medearbeider,","Ps 116:5":"De HEERE is genadig en rechtvaardig, en onze God ontfermt Zich.","Jak 5:11":"Zie, wij noemen hen gelukkig die volharden; u hebt van de volharding van Job gehoord, en u hebt gezien hoe de Heere het einde bracht, dat de Heere zeer barmhartig is en vol ontferming.","Matt 24:22":"En als die dagen niet verkort werden, zou geen vlees behouden worden; maar omwille van de uitverkorenen zullen die dagen verkort worden.","Ex 20:6":"en Die barmhartigheid doe aan duizenden van hen die Mij liefhebben en Mijn geboden onderhouden.","Spr 23:33":"Uw ogen zullen naar vreemde vrouwen zien, en uw hart zal verkeerde dingen spreken.","Pred 2:13":"Toen zag ik dat de wijsheid uitmunt boven de dwaasheid, zoals het licht uitmunt boven de duisternis.","1 Kon 12:16-21":"Toen heel Israël zag dat de koning niet naar hen hoorde, gaf het volk de koning antwoord terug en zei: Wat deel hebben wij aan David? Ja, wij hebben geen erfdeel aan de zoon van Isaï; naar uw tenten, o Israël! Zie nu naar uw eigen huis om, o David! Zo ging Israël naar zijn tenten. Doch wat betreft de kinderen van Israël die in de steden van Juda woonden, over hen regeerde Rehabeam ook. Toen zond koning Rehabeam Adoram, die over de belastingheffing was; en heel Israël stenigde hem met stenen, zodat hij stierf; maar koning Rehabeam maakte zich haastig gereed om op een wagen te klimmen, om naar Jeruzalem te vluchten.","Jes 13:17":"Zie, Ik zal de Meden tegen hen opwekken, die het zilver niet zullen achten, en aan het goud zullen zij geen lust hebben.","Deut 3:26":"Maar de HEERE was zeer toornig op mij vanwege u, en luisterde niet naar mij; maar de HEERE zei tegen mij: Laat het u genoeg zijn; spreek niet meer tot Mij over deze zaak.","Jer 2:9":"Daarom zal Ik nog met u twisten, spreekt de HEERE; ja, met uw kindskinderen zal Ik twisten.","2 Sam 7:14":"Ik zal hem tot een Vader zijn, en hij zal Mij tot een zoon zijn; wanneer hij misdoet, zal Ik hem straffen met een mensenroede en met plagen van de mensenkinderen.","Jer 30:24":"De gloed van de toorn van de HEERE zal zich niet afwenden, totdat Hij het gedaan heeft, en totdat Hij tot stand gebracht heeft de gedachten van Zijn hart; in het laatste van de dagen zult u daarop letten.","Jes 43:14":"Zo zegt de HEERE, uw Verlosser, de Heilige van Israël: Om uw wil heb Ik naar Babel gezonden, en heb hen allen als vluchtelingen doen neerdalen, te weten de Chaldeeën, in de schepen, waarop zij juichten.","Ps 90:11":"Wie kent de sterkte van de toorn van U, en Uw verbolgenheid, naarmate U te vrezen bent?","1 Kon 11:30-32":"toen greep Ahia het nieuwe kleed dat hij aanhad, en scheurde het in twaalf stukken. En hij zei tegen Jerobeam: Neem tien stukken voor uzelf; want zo zegt de HEERE, de God van Israël: Zie, Ik zal het koninkrijk uit de hand van Salomo scheuren, en u tien stammen geven. Maar één stam zal hij hebben, omwille van Mijn dienaar David, en omwille van Jeruzalem, de stad die Ik verkozen heb uit alle stammen van Israël.","Gen 25:2":"En zij baarde hem Zimran en Joksan, en Medan en Midian, en Jisbak en Suah.","Ex 4:19":"Ook zei de HEERE tegen Mozes in Midian: Ga heen, keer terug naar Egypte, want al de mannen zijn dood, die u naar het leven stonden.","Gen 2:24":"Daarom zal de man zijn vader en zijn moeder verlaten, en zich hechten aan zijn vrouw; en zij zullen tot een vlees zijn.","2 Sam 3:21":"Toen zei Abner tegen David: Ik zal opstaan en heengaan, en heel Israël verzamelen bij mijn heer de koning, zodat zij een verbond met u sluiten, en u regeert over alles wat uw hart begeert. Zo liet David Abner gaan, en hij ging in vrede.","Dan 1:17-21":"Aan deze vier jongemannen nu gaf God kennis en verstand in alle boeken, en wijsheid; maar Daniël gaf Hij inzicht in allerlei visioenen en dromen. Aan het einde van de dagen nu, waarvan de koning gezegd had dat men hen zou binnenbrengen, bracht de leider van de kamerlingen hen bij Nebukadnezar, En de koning sprak met hen; maar er werd onder hen allen niemand gevonden zoals Daniël, Hananja, Misaël en Azarja; en zij stonden voor de koning.","Deut 2:30":"Maar Sihon, de koning van Hesbon, wilde ons daar niet doorheen laten trekken; want de HEERE, uw God, verhardde zijn geest en verstokte zijn hart, opdat Hij hem in uw hand zou geven, zoals het is op deze dag.","Jer 5:10":"Beklim haar muren, en verwoest ze (maar maak er geen einde aan); haal haar tinnen weg, want zij zijn niet van de HEERE.","1 Sam 2:6-9":"De HEERE doodt en maakt levend; Hij doet naar het graf neerdalen, en Hij doet weer opkomen. De HEERE maakt arm en maakt rijk; Hij vernedert, ook verhoogt Hij. Hij verheft de geringe uit het stof, en de nooddruftige verhoogt Hij uit de vuilnis, om hen te doen zitten bij de vorsten, dat Hij hen de stoel van de eer laat beërven; want de fundamenten van het aardrijk zijn van de HEERE, en Hij heeft de wereld daarop gezet.","2 Tim 2:17":"En hun woord zal voortvreten als de kanker; onder wie zijn Hymeneüs en Filetus;","Ps 108:5":"Want Uw goedertierenheid is groot tot boven de hemelen, en Uw waarheid tot aan de bovenste wolken.","1 Kon 15:5":"Omdat David gedaan had wat recht was in de ogen van de HEERE, en niet geweken was van alles wat Hij hem geboden had, al de dagen van zijn leven, behalve alleen in de zaak van Uria, de Hethiet.","Jer 48:13":"En Moab zal beschaamd worden vanwege Kamos, zoals het huis van Israël beschaamd is geworden vanwege Bethel, hun vertrouwen.","Joh 12:36":"Zolang u het Licht hebt, geloof in het Licht, opdat u kinderen van het Licht mag zijn. Dit sprak Jezus; en Hij ging weg en verborg Zich voor hen.","Jes 9:20":"Manasse Efraïm, en Efraïm Manasse, en zij zullen samen tegen Juda zijn. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.","2 Sam 7:12-16":"Wanneer uw dagen vervuld zullen zijn, en u met uw vaderen zult ontslapen zijn, dan zal Ik uw nakomeling na u doen opstaan, die uit uw lijf voortkomen zal, en Ik zal zijn koninkrijk bevestigen. Die zal voor Mijn Naam een huis bouwen; en Ik zal de troon van zijn koninkrijk bevestigen tot in eeuwigheid. Ik zal hem tot een Vader zijn, en hij zal Mij tot een zoon zijn; wanneer hij misdoet, zal Ik hem straffen met een mensenroede en met plagen van de mensenkinderen.","Hand 15:17":"opdat de overige mensen de Heere zoeken, en alle heidenen, over wie Mijn Naam aangeroepen is, zegt de Heere, Die dit alles doet.","Neh 6:16":"En het gebeurde, toen al onze vijanden dit hoorden, dat alle heidenvolken die rondom ons waren, bevreesd werden en zeer in aanzien daalden in hun eigen ogen; want zij begrepen dat dit werk door onze God tot stand gebracht was.","Joz 1:5":"Niemand zal voor uw aangezicht standhouden al de dagen van uw leven; zoals Ik met Mozes geweest ben, zal Ik met u zijn; Ik zal u niet begeven, en zal u niet verlaten.","Joh 1:5":"En het Licht schijnt in de duisternis, en de duisternis heeft het niet begrepen.","2 Kor 1:3":"Geloofd zij de God en Vader van onze Heere Jezus Christus, de Vader van de barmhartigheden, en de God van alle vertroosting;","Hos 13:11":"Ik gaf u een koning in Mijn toorn en nam hem weg in Mijn woede.","Lev 26:45":"Maar Ik zal hun ten goede denken aan het verbond van hun voorouders, die Ik uit het land Egypte voor de ogen van de heidenen uitgevoerd heb, opdat Ik hun tot een God zou zijn; Ik ben de HEERE!","2 Sam 18:22":"Doch Ahimaäz, de zoon van Zadok, hield vol en zei tegen Joab: Wat er ook gebeurt, laat mij toch ook achter Cuschi aan lopen. En Joab zei: Waarom zou u nu gaan lopen, mijn zoon, als u toch geen bericht hebt waarmee u iets bereikt?","Num 14:24":"Maar Mijn dienaar Kaleb, omdat een andere geest met hem geweest is, en hij Mij trouw is blijven volgen, zal Ik hem brengen tot het land waarin hij gekomen was, en zijn nageslacht zal het erfelijk bezitten.","2 Kon 8:25-27":"In het twaalfde jaar van Joram, de zoon van Achab, de koning van Israël, begon Ahazia, de zoon van Jehoram, de koning van Juda, te regeren. Ahazia was tweeëntwintig jaar oud toen hij koning werd, en regeerde één jaar in Jeruzalem; en de naam van zijn moeder was Athalia, de dochter van Omri, de koning van Israël. En hij ging de weg van het huis van Achab, en deed wat slecht was in de ogen van de HEERE, zoals het huis van Achab; want hij was een schoonzoon van het huis van Achab.","Jes 6:7":"En hij raakte daarmee mijn mond aan, en zei: Zie, dit heeft uw lippen aangeraakt; zo is uw misdaad van u geweken, en uw zonde is verzoend.","1 Sam 1:1":"Er was een man van Ramathaïm-Zofim, van het gebergte van Efraïm, wiens naam was Elkana, een zoon van Jerocham, de zoon van Elihu, de zoon van Tochu, de zoon van Zuf, een Efrathiet.","Deut 9:18-20":"En ik wierp mij neer voor het aangezicht van de HEERE, zoals de eerste keer, veertig dagen en veertig nachten; ik at geen brood, en dronk geen water; om al uw zonde, die u had gezondigd door te doen wat kwaad is in de ogen van de HEERE, om Hem tot toorn te verwekken. Want ik vreesde vanwege de toorn en de grimmigheid waarmee de HEERE zeer op u vertoornd was, om u te verdelgen; toch verhoorde de HEERE mij ook op dat moment. Ook vertoornde de HEERE Zich zeer tegen Aäron, om hem te verdelgen; toch bad ik ook op datzelfde tijdstip voor Aäron.","Gen 47:6":"Egypteland ligt voor u; laat uw vader en uw broers wonen in het beste deel van het land; laat hen in het land Gosen wonen. En als u weet dat er onder hen bekwame mannen zijn, zet hen dan aan als veemeesters over wat ik heb.","1 Kon 11:9-14":"Daarom vertoornde de HEERE Zich tegen Salomo, omdat hij zijn hart van de HEERE, de God van Israël, had afgewend, Die hem tweemaal verschenen was, en hem in deze zaak geboden had dat hij geen andere goden zou navolgen; maar hij hield niet wat de HEERE geboden had. Daarom zei de HEERE tegen Salomo: Omdat dit bij u gebeurd is, dat u Mijn verbond en Mijn inzettingen, die Ik u geboden heb, niet gehouden hebt, zal Ik dit koninkrijk zeker van u scheuren, en het aan uw dienaar geven.","1 Kon 11:21-22":"Toen Hadad in Egypte hoorde dat David bij zijn vaderen ontslapen was, en dat Joab, de legeraanvoerder, dood was, zei Hadad tegen Farao: Laat mij gaan, dat ik naar mijn land trek. Maar Farao zei: Wat ontbreekt u toch bij mij, dat u naar uw land wilt trekken? En hij zei: Niets, maar laat mij toch gaan.","Richt 10:7":"Toen ontstak de toorn van de HEERE tegen Israël; en Hij verkocht hen in de hand van de Filistijnen en in de hand van de Ammonieten.","Jes 28:9":"Aan wie zou Hij dan de kennis leren, en aan wie zou Hij het gehoorde te verstaan geven? Aan hen die van de melk gespeend zijn, die van de borsten weggehaald zijn?","2 Sam 4:4":"En Jonathan, Sauls zoon, had een zoon die aan beide voeten gewond was; hij was vijf jaar oud toen het bericht over Saul en Jonathan uit Jizreël kwam; en zijn voedster nam hem op en vluchtte; en het gebeurde, toen zij zich haastte om te vluchten, dat hij viel en kreupel werd; en zijn naam was Mefiboseth.","Ps 17:13":"Sta op, HEERE, kom hem voor, werp hem neer; bevrijd mijn ziel met Uw zwaard van de goddeloze;","Joël 2:13":"En scheurt uw hart en niet uw kleren, en bekeert u tot de HEERE, uw God; want Hij is genadig en barmhartig, geduldig en groot van goedertierenheid, en Hij heeft berouw over het kwade.","Jer 23:20":"De toorn van de HEERE zal zich niet afwenden, totdat Hij het zal hebben gedaan, en totdat Hij de gedachten van Zijn hart tot stand zal hebben gebracht; in de laatste dagen zult u dat met verstand inzien.","Deut 23:7":"De Edomiet zult u voor geen gruwel houden, want hij is uw broeder; de Egyptenaar zult u voor geen gruwel houden, want u bent een vreemdeling geweest in zijn land.","Deut 1:12":"Hoe zou ik alleen uw moeite, en uw last, en uw geschillen dragen?","Gen 13:15":"Want al dit land, dat u ziet, zal Ik u geven, en aan uw nageslacht, tot in eeuwigheid.","Matt 25:15":"En aan de één gaf hij vijf talenten, en aan de ander twee, en aan de derde één, ieder naar zijn vermogen, en hij vertrok meteen.","Jes 7:14":"Daarom zal de Heere Zelf u een teken geven; zie, een maagd zal zwanger worden, en zij zal een Zoon baren, en Zijn naam Immanuel noemen.","Rom 10:13":"Want ieder die de Naam van de Heere zal aanroepen, zal zalig worden.","Ps 89:29":"Ik zal hem Mijn goedertierenheid in eeuwigheid bewaren, en Mijn verbond zal hem vast blijven.","Ps 132:1":"Een lied Hammaaloth. O HEERE, denk aan David, aan al zijn lijden;","Ps 57:11":"Want Uw goedertierenheid is groot tot aan de hemelen, en Uw waarheid tot aan de hoogste wolken.","Hos 11:9":"Ik zal de gloed van Mijn toorn niet uitvoeren; Ik zal niet terugkeren om Efraïm te verderven; want Ik ben God en geen mens, de Heilige in uw midden, en Ik zal niet in de stad komen.","1 Kon 9:22":"Doch van de kinderen van Israël maakte Salomo geen slaaf; maar zij waren krijgslieden, en zijn knechten, en zijn vorsten, en zijn hoofdlieden, en de aanvoerders van zijn wagens, en van zijn ruiters.","Ps 78:58-60":"En zij verwekten Hem tot toorn door hun hoogten, en verwekten Hem tot ijver door hun gesneden beelden. God hoorde het en werd verbolgen, en versmaadde Israël zeer. Daarom verliet Hij de tabernakel te Silo, de tent, die Hij tot een woning gesteld had onder de mensen.","2 Kon 17:21":"Want Hij scheurde Israël af van het huis van David, en zij maakten Jerobeam, de zoon van Nebat, koning; en Jerobeam dreef Israël weg van achter de HEERE vandaan, en liet hen een grote zonde zondigen.","Luk 19:12-27":"Hij zei dan: Een man van hoge afkomst reisde naar een ver land om voor zichzelf een koninkrijk te ontvangen, en dan terug te keren. En hij riep zijn tien dienstknechten, gaf hun tien ponden, en zei tegen hen: Doe er zaken mee totdat ik terugkom. Maar zijn burgers haatten hem, en stuurden gezanten achter hem aan, die zeiden: Wij willen niet dat deze man koning over ons wordt.","Openb 2:21":"En Ik heb haar tijd gegeven, opdat zij zich zou bekeren van haar hoererij, en zij heeft zich niet bekeerd.","1 Sam 1:24":"Daarna, toen zij hem gespeend had, bracht zij hem met zich mee, met drie stieren, en een efa van het meel, en een fles met wijn; en zij bracht hem in het huis van de HEERE te Silo; en het jongetje was nog zeer jong.","Luk 1:69":"en heeft een hoorn van heil voor ons opgericht, in het huis van David, Zijn knecht;","1 Kron 16:34":"Looft de HEERE, want Hij is goed, want Zijn goedertierenheid is tot in eeuwigheid.","1 Sam 15:26-28":"Doch Samuël zei tegen Saul: Ik zal niet met u terugkeren; omdat u het woord van de HEERE verworpen hebt, zo heeft de HEERE u verworpen, dat u geen koning over Israël meer zult zijn. Toen Samuël zich omkeerde om weg te gaan, greep hij een slip van zijn mantel, en die scheurde. Toen zei Samuël tegen hem: De HEERE heeft heden het koninkrijk van Israël van u afgescheurd, en heeft het aan uw naaste gegeven, die beter is dan u.","1 Sam 15:28":"Toen zei Samuël tegen hem: De HEERE heeft heden het koninkrijk van Israël van u afgescheurd, en heeft het aan uw naaste gegeven, die beter is dan u.","1 Kron 19:16-19":"Toen de Syriërs zagen dat zij door Israël verslagen waren, stuurden zij boden, en lieten de Syriërs komen die aan de overkant van de rivier woonden; en Sofach, de legeraanvoerder van Hadar-Ezer, trok voor hen uit. Toen dit aan David werd bericht, verzamelde hij heel Israël, en trok over de Jordaan, en kwam tot hen, en stelde de slagorde tegen hen op. Toen David de slagorde tegen de Syriërs opgesteld had, streden zij met hem. Maar de Syriërs vluchtten voor Israël, en David versloeg van de Syriërs zevenduizend wagens, en veertigduizend man te voet; daarbij doodde hij Sofach, de legeraanvoerder.","1 Kon 11:5-8":"Want Salomo volgde Astoreth na, de god van de Sidoniërs, en Milchom, het verfoeisel van de Ammonieten. Zo deed Salomo wat kwaad was in de ogen van de HEERE; en hij volhardde niet in het volgen van de HEERE, zoals zijn vader David. Toen bouwde Salomo een hoogte voor Kamos, het verfoeisel van de Moabieten, op de berg die tegenover Jeruzalem ligt, en voor Molech, het verfoeisel van de kinderen Ammons.","2 Sam 10:15-18":"Toen nu de Syriërs zagen, dat zij voor Israëls aangezicht geslagen waren, verzamelden zij zich weer samen. En Hadad-Ezer zond heen, en liet de Syriërs uitkomen, die aan de overzijde van de rivier zijn, en zij kwamen te Helam; en Sobach, Hadad-Ezers legeraanvoerder, trok voor hun aangezicht heen. Toen dat aan David werd bekendgemaakt, verzamelde hij heel Israël, en trok over de Jordaan, en kwam te Helam, en de Syriërs stelden de slagorde op tegen David, en streden met hem.","Hand 2:39":"Want voor u is de belofte, en voor uw kinderen, en voor allen die ver weg zijn, zoveel als de Heere, onze God, ertoe roepen zal.","2 Kon 21:2":"En hij deed wat kwaad was in de ogen van de HEERE, naar de gruwelen van de heidenvolken, die de HEERE voor de kinderen van Israël uit de bezitting verdreven had.","Jes 8:20":"Tot de wet en tot de getuigenis! Als zij niet spreken naar dit woord, zal het zijn dat zij geen dageraad zullen hebben.","Hand 1:9":"En toen Hij dit gezegd had, werd Hij opgenomen, terwijl zij het zagen, en een wolk nam Hem weg van voor hun ogen.","Openb 14:10":"die zal ook drinken uit de wijn van de toorn van God, die onvermengd ingeschonken is in de drinkbeker van Zijn toorn; en hij zal gepijnigd worden met vuur en zwavel voor de heilige engelen en voor het Lam.","Ex 32:34":"Ga nu heen, leid dit volk naar waar Ik u gezegd heb; zie, Mijn Engel zal voor u uit gaan! Maar op de dag van het bezoeken zal Ik hun zonde over hen bezoeken!","Openb 17:17":"Want God heeft hun in hun hart gegeven dat zij Zijn plan uitvoeren, en dat zij één en dezelfde gezindheid uitvoeren, en dat zij hun koninkrijk aan het beest geven, totdat de woorden van God vervuld zullen zijn.","1 Kon 12:31":"Hij maakte ook een huis der hoogten; en maakte priesters van de geringste mensen van het volk, die niet uit de zonen van Levi waren.","1 Kron 18:11-13":"Deze heiligde koning David ook aan de HEERE, met het zilver en het goud dat hij had meegebracht van alle heidenvolken: van de Edomieten, en van de Moabieten, en van de kinderen van Ammon, en van de Filistijnen, en van de Amalekieten. Ook sloeg Abisaï, de zoon van Zeruja, de Edomieten in het Zoutdal, achttienduizend man. En hij legde bezetting in Edom, zodat alle Edomieten Davids knechten werden; en de HEERE gaf David de overwinning overal waar hij heenging.","Jes 44:28":"Die van Kores zegt: Hij is Mijn herder, en hij zal al Mijn welbehagen volbrengen; en zegt ook tot Jeruzalem: Word gebouwd; en tot de tempel: Word gegrondvest.","Ezech 18:23":"Zou Ik enigszins lust hebben aan de dood van de goddeloze, spreekt de Heere HEERE; is het niet zo, dat als hij zich bekeert van zijn wegen, hij zal leven?","Job 5:12":"Hij maakt teniet de gedachten van de arglistigen; zodat hun handen niets uitrichten.","Hebr 12:15":"Let er goed op dat niemand verachtert van de genade van God; dat niet enige wortel van bitterheid, die opwaarts uitspruit, opschudding maakt en daardoor velen ontreinigd worden.","Jer 5:1":"Ga rond door de wijken van Jeruzalem, en kijk nu goed, en onderzoek, en zoek op haar straten, of u iemand vindt, of er iemand is die recht doet, die waarheid zoekt; dan zal Ik haar genadig zijn.","Ps 132:13":"Want de HEERE heeft Sion verkozen, Hij heeft het begeerd tot Zijn woonplaats, en zei:","Jes 46:10":"Die vanaf het begin aan verkondigt het einde, en van oudsher af die dingen, die nog niet gebeurd zijn; Die zegt: Mijn raad zal standhouden, en Ik zal al Mijn welbehagen doen.","Luk 2:11":"namelijk dat u heden geboren is de Zaligmaker, Die is Christus, de Heere, in de stad van David.","Deut 9:20":"Ook vertoornde de HEERE Zich zeer tegen Aäron, om hem te verdelgen; toch bad ik ook op datzelfde tijdstip voor Aäron.","Spr 12:7":"De goddelozen worden omgekeerd, zodat zij niet meer zijn; maar het huis van de rechtvaardigen zal bestaan.","1 Kron 17:10":"En vanaf die dagen dat Ik geboden heb dat er richters zouden zijn over Mijn volk Israël; en Ik heb al uw vijanden vernederd; ook heb Ik u bekendgemaakt dat de HEERE u een huis bouwen zal.","Ezech 21:27":"Ik zal die kroon omgekeerd, omgekeerd, omgekeerd neerzetten; ja, zij zal er niet zijn, totdat hij komt die daartoe recht heeft, en aan wie Ik hem geven zal.","Jes 60:19":"De zon zal voor u niet meer zijn tot een licht overdag, en tot een glans zal de maan u niet lichten; maar de HEERE zal u tot een eeuwig licht zijn, en uw God tot uw sierlijkheid.","2 Kron 25:2":"En hij deed wat recht was in de ogen van de HEERE, maar niet met een volkomen hart.","Ex 2:24":"En God hoorde hun gekerm, en God dacht aan Zijn verbond met Abraham, met Izak, en met Jakob.","1 Kron 2:35":"Sesan nu gaf zijn dochter aan zijn knecht Jarha tot vrouw; en zij baarde hem Attai.","Matt 22:13":"Toen zei de koning tegen de dienaars: Bind zijn handen en voeten, neem hem mee en werp hem in de buitenste duisternis; daar zal het huilen zijn en het geknars van de tanden.","Gen 34:3":"En zijn ziel hechtte zich aan Dina, Jakobs dochter; en hij had de jonge vrouw lief, en sprak naar het hart van de jonge vrouw.","Ex 33:5":"En de HEERE had tot Mozes gezegd: Zeg tegen de Israëlieten: U bent een hardnekkig volk; in één ogenblik zou Ik in uw midden optrekken, en u vernietigen; doch nu, leg uw sieraad van u af, en Ik zal weten wat Ik u doen zal.","Rom 2:5":"Maar naar uw hardheid en onbekeerlijk hart, verzamelt u voor uzelf toorn als een schat, voor de dag van de toorn en de openbaring van het rechtvaardig oordeel van God.","Gen 6:2-5":"dat Gods zonen de dochters der mensen aanzagen, dat zij mooi waren, en zij namen zich vrouwen uit allen die zij verkozen hadden. Toen zei de HEERE: Mijn Geest zal niet in eeuwigheid twisten met de mens, omdat hij ook vlees is; doch zijn dagen zullen honderdtwintig jaren zijn. In die dagen waren er reuzen op de aarde, en ook daarna, toen Gods zonen tot de dochters der mensen ingegaan waren, en zich kinderen verwekt hadden; deze zijn de geweldigen, die van ouds geweest zijn, mannen van naam.","1 Sam 15:27":"Toen Samuël zich omkeerde om weg te gaan, greep hij een slip van zijn mantel, en die scheurde.","Ps 69:25":"Stort over hen Uw gramschap uit; en de gloed van Uw toorn grijpt hen aan.","Ps 78:49":"Hij zond onder hen de gloed van Zijn toorn, verbolgenheid, en verstoordheid, en benauwdheid, met uitzending van boden van veel kwaad.","1 Kron 5:26":"Zo verwekte de God van Israël de geest van Pul, de koning van Assyrië, en de geest van Tiglath-Pilneser, de koning van Assyrië, die voerde hen gevankelijk weg, te weten de Rubenieten, en de Gadieten, en de halve stam van Manasse; en hij bracht hen naar Halah, en Habor, en Hara, en aan de rivier Gozan, tot op deze dag.","Lev 26:30":"En Ik zal uw hoogten verderven, en uw zonnebeelden uitroeien, en Ik zal uw dode lichamen op de dode lichamen van uw drekgoden werpen; en Mijn ziel zal van u walgen.","Ps 103:3":"Die al uw ongerechtigheid vergeeft, die al uw ziekten geneest;","Num 25:11":"Pinehas, de zoon van Eleazar, de zoon van Aäron, de priester, heeft Mijn grimmigheid van over de kinderen van Israël afgewend, omdat hij Mijn ijver geijverd heeft in hun midden, zodat Ik de kinderen van Israël in Mijn ijver niet vernietigd heb.","Jer 50:20":"In die dagen en op die tijd, spreekt de HEERE, zal de ongerechtigheid van Israël gezocht worden, maar zij zal er niet zijn, en de zonden van Juda, maar zullen niet gevonden worden; want Ik zal het vergeven aan hen die Ik zal doen overblijven.","Jes 14:24-27":"De HEERE van de heerscharen heeft gezworen: Voorzeker, zoals Ik gedacht heb, zo zal het gebeuren, en zoals Ik beraadslaagd heb, zo zal het bestaan! Dat Ik Assur in Mijn land zal verbreken, en hem op Mijn bergen vertreden; opdat zijn juk van hen afwijkt, en zijn last van hun schouder wijkt. Dit is de raadslag, die beraadslaagd is over dat hele land; en dit is de hand, die uitgestrekt is over alle volken.","Deut 31:8":"De HEERE nu is Degene, Die voor u uitgaat; Die zal met u zijn; Hij zal u niet loslaten, en u niet verlaten; vrees niet, en wees niet ontsteld.","Ex 15:13":"U leidde door Uw goedheid dit volk, dat U verlost hebt; U voert hen zachtjes door Uw sterkte naar de liefelijke woning van Uw heiligheid.","Amos 7:3":"Toen kreeg de HEERE berouw hierover; het zal niet gebeuren, zei de HEERE.","Rom 9:18":"Zo ontfermt Hij Zich dan over wie Hij wil, en Hij verhardt wie Hij wil.","Micha 7:18":"Wie is een God gelijk U, Die de ongerechtigheid vergeeft, en de overtreding van het overblijfsel van Zijn erfenis voorbijgaat? Hij houdt Zijn toorn niet voor eeuwig vast; want Hij heeft lust aan goedertierenheid.","Gen 18:26":"Toen zei de HEERE: Als Ik in Sodom, binnen de stad, vijftig rechtvaardigen zal vinden, dan zal Ik de hele plaats sparen omwille van hen.","Ps 130:3":"Als U, HEERE, op de ongerechtigheden let, Heere, wie zal dan bestaan?","2 Kron 15:2":"En hij ging Asa tegemoet, en hij zei tegen hem: Hoor mij, Asa, en heel Juda en Benjamin! De HEERE is met u, zolang u met Hem bent; en als u Hem zoekt, zal Hij door u gevonden worden; maar als u Hem verlaat, zal Hij u verlaten.","Joh 5:35":"Hij was een brandende en lichtende lamp; en u hebt u een korte tijd in zijn licht willen verheugen.","Num 31:17":"Nu dan, dood alles wat mannelijk is onder de kinderen; en dood elke vrouw die door gemeenschap met een man, een man heeft gekend.","1 Kon 15:26":"En hij deed wat kwaad was in de ogen van de HEERE, en wandelde in de weg van zijn vader, en in zijn zonde, waarmee hij Israël had doen zondigen.","Jes 13:9":"Zie, de dag van de HEERE komt, gruwelijk, met verbolgenheid en hevige toorn, om het land tot verwoesting te stellen, en de zondaars daaruit te verdelgen.","Ps 108:11":"Wie zal mij voeren in een vaste stad? Wie zal mij leiden tot in Edom?","Jes 54:17":"Elk instrument dat tegen u gemaakt wordt, zal niet gelukken, en elke tong, die in het gericht tegen u opstaat, zult u verdoemen; dit is het erfdeel van de knechten van de HEERE, en hun gerechtigheid is uit Mij, spreekt de HEERE.","1 Joh 1:7":"Maar als wij in het licht wandelen, zoals Hij in het licht is, dan hebben wij gemeenschap met elkaar, en het bloed van Jezus Christus, Zijn Zoon, reinigt ons van alle zonde.","Jes 54:9":"Want dat zal Mij zijn als de wateren van Noach, toen Ik zwoer dat de wateren van Noach niet meer over de aarde zouden gaan; zo heb Ik gezworen dat Ik niet meer op u toornen, of u bestraffen zal.","Ezra 10:2-17":"Toen antwoordde Sechanja, de zoon van Jehiel, een van de zonen van Elam, en zei tegen Ezra: Wij hebben overtreden tegen onze God, en wij hebben vreemde vrouwen van de volken van het land bij ons laten wonen; maar nu is er hoop voor Israël wat dit betreft. Laten wij dan nu een verbond maken met onze God, dat wij al die vrouwen, en wat van hen geboren is, zullen wegsturen, naar de raad van de Heere, en van hen die beven voor het gebod van onze God; en laat er gedaan worden naar de wet. Sta op, want deze zaak komt u toe; en wij zullen met u zijn; wees sterk en doe het.","Deut 4:37":"En omdat Hij uw vaderen liefhad, en hun nageslacht na hen verkoren had, zo heeft Hij u voor Zijn aangezicht door Zijn grote kracht uit Egypte weggevoerd;","2 Sam 24:14":"Toen zei David tegen Gad: Het is mij zeer bang te moede; laat ons toch in de hand van de HEERE vallen, want Zijn barmhartigheden zijn groot, maar laat mij niet in de hand van mensen vallen.","Gen 21:21":"En hij woonde in de woestijn Paran; en zijn moeder nam voor hem een vrouw uit Egypteland.","Neh 9:17-20":"En zij hebben geweigerd te horen, en niet gedacht aan Uw wonderen, die U bij hen gedaan had, en hebben hun nek verhard, en in hun weerspannigheid een hoofd aangesteld, om terug te keren tot hun dienstbaarheid. Doch U, een God van vergevingen, genadig en barmhartig, geduldig, en groot van weldadigheid, hebt hen toch niet verlaten. Zelfs, toen zij zich een gegoten kalf gemaakt hadden, en gezegd hadden: Dit is uw God, Die u uit Egypte heeft opgevoerd; e
