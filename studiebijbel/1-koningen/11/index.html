"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"En koning Salomo had, behalve de dochter van Farao, veel vreemde vrouwen lief: Moabitische, Ammonitische, Edomitische, Sidonische en Hethitische vrouwen;","2":"van de volken waarvan de HEERE tegen de kinderen van Israël gezegd had: U zult tot hen niet ingaan, en zij zullen tot u niet inkomen; zij zouden zeker uw hart naar hun goden doen neigen; aan deze hing Salomo met liefde.","3":"En hij had zevenhonderd vrouwen, vorstinnen, en driehonderd bijvrouwen, en zijn vrouwen deden zijn hart neigen.","4":"Want het gebeurde in de tijd van Salomo's ouderdom, dat zijn vrouwen zijn hart deden neigen naar andere goden; zodat zijn hart niet volkomen was met de HEERE, zijn God, zoals het hart van zijn vader David.","5":"Want Salomo volgde Astoreth na, de god van de Sidoniërs, en Milchom, het verfoeisel van de Ammonieten.","6":"Zo deed Salomo wat kwaad was in de ogen van de HEERE; en hij volhardde niet in het volgen van de HEERE, zoals zijn vader David.","7":"Toen bouwde Salomo een hoogte voor Kamos, het verfoeisel van de Moabieten, op de berg die tegenover Jeruzalem ligt, en voor Molech, het verfoeisel van de kinderen Ammons.","8":"En zo deed hij voor al zijn vreemde vrouwen, die hun goden reukoffers brachten en offerden.","9":"Daarom vertoornde de HEERE Zich tegen Salomo, omdat hij zijn hart van de HEERE, de God van Israël, had afgewend, Die hem tweemaal verschenen was,","10":"en hem in deze zaak geboden had dat hij geen andere goden zou navolgen; maar hij hield niet wat de HEERE geboden had.","11":"Daarom zei de HEERE tegen Salomo: Omdat dit bij u gebeurd is, dat u Mijn verbond en Mijn inzettingen, die Ik u geboden heb, niet gehouden hebt, zal Ik dit koninkrijk zeker van u scheuren, en het aan uw dienaar geven.","12":"In uw dagen echter zal Ik dat niet doen, omwille van uw vader David; van de hand van uw zoon zal Ik het scheuren.","13":"Maar Ik zal het hele koninkrijk niet afscheuren; één stam zal Ik uw zoon geven, omwille van Mijn dienaar David, en omwille van Jeruzalem, dat Ik verkozen heb.","14":"Zo verwekte de HEERE tegen Salomo een tegenstander, Hadad de Edomiet; hij was van het koninklijk geslacht in Edom.","15":"Want het was gebeurd, toen David in Edom was, en Joab, de legeraanvoerder, optrok om de gesneuvelden te begraven, dat hij alles wat mannelijk was in Edom versloeg;","16":"want Joab bleef daar zes maanden met heel Israël, totdat hij alles wat mannelijk was in Edom had uitgeroeid.","17":"Toen vluchtte Hadad, hij en enkele Edomitische mannen uit de dienaren van zijn vader met hem, om naar Egypte te gaan; Hadad was toen nog een kleine jongen.","18":"En zij trokken op vanuit Midian en kwamen naar Paran; en zij namen mannen uit Paran met zich mee, en kwamen in Egypte bij Farao, de koning van Egypte, die hem een huis gaf, en hem levensonderhoud toezei, en hem land gaf.","19":"En Hadad vond grote genade in de ogen van Farao, zodat hij hem tot vrouw gaf de zuster van zijn eigen vrouw, de zuster van Tachpenes, de koningin.","20":"En de zuster van Tachpenes baarde hem zijn zoon Genubath, die Tachpenes grootbracht in het huis van Farao; zodat Genubath in het huis van Farao was, onder de zonen van Farao.","21":"Toen Hadad in Egypte hoorde dat David bij zijn vaderen ontslapen was, en dat Joab, de legeraanvoerder, dood was, zei Hadad tegen Farao: Laat mij gaan, dat ik naar mijn land trek.","22":"Maar Farao zei: Wat ontbreekt u toch bij mij, dat u naar uw land wilt trekken? En hij zei: Niets, maar laat mij toch gaan.","23":"Ook verwekte God tegen hem een tegenstander, Rezon, de zoon van Eljada, die gevlucht was van zijn heer Hadad-ezer, de koning van Zoba,","24":"tegen wie hij ook mannen verzameld had, en hij werd aanvoerder van een bende, toen David hen doodde; en zij trokken naar Damascus, woonden daar en regeerden in Damascus.","25":"En hij was Israëls tegenstander al de dagen van Salomo, naast het kwaad dat Hadad deed; want hij had een afkeer van Israël, en hij regeerde over Syrië.","26":"Verder kwam Jerobeam, de zoon van Nebat, een Efrathiet uit Zereda, dienaar van Salomo (wiens moeder Zerua heette, een weduwe), ook tegen de koning in opstand.","27":"Dit is nu de zaak waarom hij tegen de koning in opstand kwam. Salomo bouwde Millo, en herstelde de bres in de stad van zijn vader David.","28":"De man Jerobeam was een dapper held. Toen Salomo deze jongeman zag, dat hij hard werkte, stelde hij hem aan over al de lastdienst van het huis van Jozef.","29":"Het gebeurde nu in die tijd, toen Jerobeam uit Jeruzalem wegging, dat de profeet Ahia, de Siloniet, hem op de weg vond; hij had zich een nieuw kleed aangedaan, en zij beiden waren alleen op het veld;","30":"toen greep Ahia het nieuwe kleed dat hij aanhad, en scheurde het in twaalf stukken.","31":"En hij zei tegen Jerobeam: Neem tien stukken voor uzelf; want zo zegt de HEERE, de God van Israël: Zie, Ik zal het koninkrijk uit de hand van Salomo scheuren, en u tien stammen geven.","32":"Maar één stam zal hij hebben, omwille van Mijn dienaar David, en omwille van Jeruzalem, de stad die Ik verkozen heb uit alle stammen van Israël.","33":"Omdat zij Mij verlaten hebben, en zich neergebogen hebben voor Astoreth, de god van de Sidoniërs, Kamos, de god van de Moabieten, en Milchom, de god van de kinderen Ammons; en niet in Mijn wegen gewandeld hebben om te doen wat recht is in Mijn ogen, namelijk Mijn inzettingen en Mijn rechten, zoals zijn vader David.","34":"Toch zal Ik niets van dit koninkrijk uit zijn hand nemen; maar Ik stel hem tot vorst al de dagen van zijn leven, omwille van Mijn dienaar David, die Ik verkozen heb, die Mijn geboden en Mijn inzettingen gehouden heeft.","35":"Maar uit de hand van zijn zoon zal Ik het koninkrijk nemen; en Ik zal u daarvan tien stammen geven.","36":"En aan zijn zoon zal Ik één stam geven; opdat Mijn dienaar David altijd een lamp voor Mijn aangezicht heeft in Jeruzalem, de stad die Ik Mij verkozen heb, om Mijn Naam daar te vestigen.","37":"Zo zal Ik u nemen, en u zult regeren over alles wat uw ziel zal begeren; en u zult koning zijn over Israël.","38":"En het zal gebeuren, als u zult horen naar alles wat Ik u zal gebieden, en in Mijn wegen zult wandelen, en zult doen wat recht is in Mijn ogen, door Mijn inzettingen en Mijn geboden te houden, zoals Mijn dienaar David gedaan heeft; dat Ik met u zal zijn, en u een blijvend huis zal bouwen, zoals Ik David gebouwd heb, en Ik zal u Israël geven.","39":"En Ik zal om die reden het nageslacht van David vernederen; maar niet voor altijd.","40":"Daarom zocht Salomo Jerobeam te doden; maar Jerobeam maakte zich op en vluchtte naar Egypte, naar Sisak, de koning van Egypte, en was in Egypte totdat Salomo stierf.","41":"Het overige nu van de geschiedenissen van Salomo, en alles wat hij gedaan heeft, en zijn wijsheid, is dat niet geschreven in het boek van de geschiedenissen van Salomo?","42":"De tijd nu dat Salomo in Jeruzalem over heel Israël regeerde, was veertig jaar.","43":"Daarna ontsliep Salomo met zijn vaderen, en werd begraven in de stad van zijn vader David; en Rehabeam, zijn zoon, werd koning in zijn plaats."},"SV":{"1":"En de koning Salomo had veel vreemde vrouwen lief, en dat benevens de dochter van Farao: Moabietische, Ammonietische, Edomietische, Sidonische, Hethietische;","2":"Van die volken, waarvan de HEERE gezegd had tot de kinderen Israëls: Gijlieden zult tot hen niet ingaan, en zij zullen tot u niet inkomen; zij zouden zekerlijk uw hart achter hun goden neigen; aan deze hing Salomo met liefde.","3":"En hij had zevenhonderd vrouwen, vorstinnen, en driehonderd bijwijven en zijn vrouwen neigden zijn hart.","4":"Want het geschiedde in den tijd van Salomo’s ouderdom, *dat* zijn vrouwen zijn hart achter andere goden neigden; dat zijn hart niet volkomen was met den HEERE, zijn God, gelijk het hart van zijn vader David.","5":"Want Salomo wandelde Astoreth, den god der Sidoniërs, na, en Milchom, het verfoeisel der Ammonieten.","6":"Alzo deed Salomo, dat kwaad was in de ogen des HEEREN; en volhardde niet den HEERE te volgen, gelijk zijn vader David.","7":"Toen bouwde Salomo een hoogte voor Kamos, het verfoeisel der Moabieten, op den berg, die voor Jeruzalem is, en voor Molech, het verfoeisel der kinderen Ammons.","8":"En alzo deed hij voor al zijn vreemde vrouwen, die haar goden rookten en offerden.","9":"Daarom vertoornde Zich de HEERE tegen Salomo, omdat hij zijn hart geneigd had van den HEERE, den God Israëls, Die hem tweemaal verschenen was.","10":"En hem van deze zaak geboden had, dat hij andere goden niet zou nawandelen; doch hij hield niet, wat de HEERE geboden had.","11":"Daarom zeide de HEERE tot Salomo: Dewijl dit bij u geschied is, dat gij niet hebt gehouden Mijn verbond en Mijn inzettingen, die Ik u geboden heb; Ik zal gewisselijk dit koninkrijk van u scheuren, en datzelve uw knecht geven.","12":"In uw dagen nochtans zal Ik dat niet doen, om uws vaders Davids wil, van de hand uws zoons zal Ik het scheuren.","13":"Doch Ik zal het gehele koninkrijk niet afscheuren; een stam zal Ik uw zoon geven, om Mijns knechts Davids wil, en om Jeruzalems wil, dat Ik verkoren heb.","14":"Zo verwekte de HEERE Salomo een tegenpartijder, Hadad, den Edomiet; hij was van des konings zaad in Edom.","15":"Want het was geschied, als David in Edom was, toen Joab, de krijgsoverste, optoog, om de verslagenen te begraven, dat hij al wat mannelijk was in Edom sloeg;","16":"Want Joab bleef aldaar zes maanden, met het ganse Israël, totdat hij al wat mannelijk was in Edom uitgeroeid had.","17":"Doch Hadad was ontvloden, hij en *enige* Edomietische mannen uit zijns vaders knechten met hem, om in Egypte te komen; Hadad nu was een klein jongsken.","18":"En zij maakten zich op van Midian, en kwamen tot Paran; en namen met zich mannen van Paran, en kwamen in Egypte tot Farao, den koning van Egypte, die hem een huis gaf, en hem voeding toezeide, en hem een land gaf.","19":"En Hadad vond grote genade in de ogen van Farao, zodat hij hem tot een vrouw gaf de zuster zijner huisvrouw, de zuster van Tachpenes, de koningin.","20":"En de zuster van Tachpenes baarde hem zijn zoon Genubath, denwelken Tachpenes optoog in het huis van Farao; zodat Genubath in het huis van Farao was, onder de zonen van Farao.","21":"Toen nu Hadad in Egypte hoorde, dat David met zijn vaderen ontslapen, en dat Joab, de krijgsoverste, dood was, zeide Hadad tot Farao: Laat mij gaan, dat ik in mijn land trekke.","22":"Doch Farao zeide: Maar wat ontbreekt u bij mij, dat, zie, gij in uw land zoekt te trekken? En hij zeide: Niets, maar laat mij evenwel gaan.","23":"Ook verwekte God hem een wederpartijder, Rezon, den zoon van Eljada, die gevloden was van zijn heer Hadad-ezer, den koning van Zoba,","24":"Tegen welken hij ook mannen vergaderd had, en werd overste ener bende, als David die doodde; en getrokken zijnde naar Damaskus, woonden zij aldaar, en regeerden in Damaskus.","25":"En hij was Israëls tegenpartijder al de dagen van Salomo, en dat benevens het kwaad, dat Hadad *deed*; want hij had een afkeer van Israël, en hij regeerde over Syrië.","26":"Daartoe Jerobeam, de zoon van Nebat, een Efrathiet van Zereda, Salomo’s knecht (wiens moeders naam was Zerua, een weduwvrouw), hief ook de hand op tegen den koning.","27":"Dit is nu de zaak, waarom hij de hand tegen den koning ophief. Salomo bouwde Millo, *en* sloot de breuk der stad van zijn vader David toe.","28":"En de man Jerobeam was een dapper held. Toen Salomo dezen jongeling zag, dat hij arbeidzaam was, zo stelde hij hem over al den last van het huis van Jozef.","29":"Het geschiedde nu te dier tijd, als Jerobeam uit Jeruzalem uitging, dat de profeet Ahia, de Siloniet, hem op den weg vond, en hij zich een nieuw kleed aangedaan had, en zij beiden alleen op het veld waren;","30":"Zo vatte Ahia het nieuwe kleed, dat aan hem was, en scheurde het, in twaalf stukken.","31":"En hij zeide tot Jerobeam: Neem u tien stukken; want alzo zegt de HEERE, de God Israëls: Zie, Ik zal het koninkrijk van de hand van Salomo scheuren, en u tien stammen geven.","32":"Maar een stam zal hij hebben, om Mijns knechts Davids wil, en om Jeruzalems wil, de stad, die Ik verkoren heb uit alle stammen van Israël.","33":"Daarom dat zij Mij verlaten, en zich nedergebogen hebben voor Astoreth, den god der Sidoniërs, Kamos, den god der Moabieten, en Milchom, den god der kinderen Ammons; en niet gewandeld hebben in Mijn wegen, om te doen wat recht is in Mijn ogen, te weten Mijn inzettingen en Mijn rechten; gelijk zijn vader David.","34":"Doch niets van dit koninkrijk zal Ik uit zijn hand nemen; maar Ik stel hem tot een vorst al de dagen zijns levens, om Mijns knechts Davids wil, dien Ik verkoren heb, die Mijn geboden en Mijn inzettingen gehouden heeft.","35":"Maar uit de hand zijns zoons zal Ik het koninkrijk nemen; en Ik zal u daarvan tien stammen geven.","36":"En zijn zoon zal Ik een stam geven; opdat Mijn knecht David altijd een lamp voor Mijn aangezicht hebbe in Jeruzalem, de stad, die Ik Mij verkoren heb, om Mijn Naam daar te stellen.","37":"Zo zal Ik u nemen, en gij zult regeren over al wat uw ziel zal begeren; en gij zult koning zijn over Israël.","38":"En het zal geschieden, zo gij horen zult al wat Ik u zal gebieden, en in Mijn wegen zult wandelen, en doen wat recht in Mijn ogen is, houdende Mijn inzettingen en Mijn geboden, gelijk als Mijn knecht David gedaan heeft; dat Ik met u zal zijn, en u een bestendig huis bouwen, gelijk als Ik David gebouwd heb, en zal u Israël geven.","39":"En Ik zal om diens wil het zaad van David verootmoedigen; nochtans niet altijd.","40":"Daarom zocht Salomo Jerobeam te doden; maar Jerobeam maakte zich op, en vlood in Egypte, tot Sisak, den koning van Egypte, en was in Egypte, totdat Salomo stierf.","41":"Het overige nu der geschiedenissen van Salomo, en al wat hij gedaan heeft, en zijn wijsheid, is dat niet geschreven in het boek der geschiedenissen van Salomo?","42":"De tijd nu, dien Salomo te Jeruzalem over het ganse Israël regeerde, was veertig jaar.","43":"Daarna ontsliep Salomo met zijn vaderen, en werd begraven in de stad van zijn vader David; en Rehabeam, zijn zoon, werd koning in zijn plaats."},"KJV":{"1":"But king Solomon loved many strange women, together with the daughter of Pharaoh, women of the Moabites, Ammonites, Edomites, Zidonians, and Hittites;","2":"Of the nations concerning which the LORD said unto the children of Israel, Ye shall not go in to them, neither shall they come in unto you: for surely they will turn away your heart after their gods: Solomon clave unto these in love.","3":"And he had seven hundred wives, princesses, and three hundred concubines: and his wives turned away his heart.","4":"For it came to pass, when Solomon was old, that his wives turned away his heart after other gods: and his heart was not perfect with the LORD his God, as was the heart of David his father.","5":"For Solomon went after Ashtoreth the goddess of the Zidonians, and after Milcom the abomination of the Ammonites.","6":"And Solomon did evil in the sight of the LORD, and went not fully after the LORD, as did David his father.","7":"Then did Solomon build an high place for Chemosh, the abomination of Moab, in the hill that is before Jerusalem, and for Molech, the abomination of the children of Ammon.","8":"And likewise did he for all his strange wives, which burnt incense and sacrificed unto their gods.","9":"And the LORD was angry with Solomon, because his heart was turned from the LORD God of Israel, which had appeared unto him twice,","10":"And had commanded him concerning this thing, that he should not go after other gods: but he kept not that which the LORD commanded.","11":"Wherefore the LORD said unto Solomon, Forasmuch as this is done of thee, and thou hast not kept my covenant and my statutes, which I have commanded thee, I will surely rend the kingdom from thee, and will give it to thy servant.","12":"Notwithstanding in thy days I will not do it for David thy father's sake: but I will rend it out of the hand of thy son.","13":"Howbeit I will not rend away all the kingdom; but will give one tribe to thy son for David my servant's sake, and for Jerusalem's sake which I have chosen.","14":"And the LORD stirred up an adversary unto Solomon, Hadad the Edomite: he was of the king's seed in Edom.","15":"For it came to pass, when David was in Edom, and Joab the captain of the host was gone up to bury the slain, after he had smitten every male in Edom;","16":"(For six months did Joab remain there with all Israel, until he had cut off every male in Edom:)","17":"That Hadad fled, he and certain Edomites of his father's servants with him, to go into Egypt; Hadad being yet a little child.","18":"And they arose out of Midian, and came to Paran: and they took men with them out of Paran, and they came to Egypt, unto Pharaoh king of Egypt; which gave him an house, and appointed him victuals, and gave him land.","19":"And Hadad found great favour in the sight of Pharaoh, so that he gave him to wife the sister of his own wife, the sister of Tahpenes the queen.","20":"And the sister of Tahpenes bare him Genubath his son, whom Tahpenes weaned in Pharaoh's house: and Genubath was in Pharaoh's household among the sons of Pharaoh.","21":"And when Hadad heard in Egypt that David slept with his fathers, and that Joab the captain of the host was dead, Hadad said to Pharaoh, Let me depart, that I may go to mine own country.","22":"Then Pharaoh said unto him, But what hast thou lacked with me, that, behold, thou seekest to go to thine own country? And he answered, Nothing: howbeit let me go in any wise.","23":"And God stirred him up another adversary, Rezon the son of Eliadah, which fled from his lord Hadadezer king of Zobah:","24":"And he gathered men unto him, and became captain over a band, when David slew them of Zobah: and they went to Damascus, and dwelt therein, and reigned in Damascus.","25":"And he was an adversary to Israel all the days of Solomon, beside the mischief that Hadad did: and he abhorred Israel, and reigned over Syria.","26":"And Jeroboam the son of Nebat, an Ephrathite of Zereda, Solomon's servant, whose mother's name was Zeruah, a widow woman, even he lifted up his hand against the king.","27":"And this was the cause that he lifted up his hand against the king: Solomon built Millo, and repaired the breaches of the city of David his father.","28":"And the man Jeroboam was a mighty man of valour: and Solomon seeing the young man that he was industrious, he made him ruler over all the charge of the house of Joseph.","29":"And it came to pass at that time when Jeroboam went out of Jerusalem, that the prophet Ahijah the Shilonite found him in the way; and he had clad himself with a new garment; and they two were alone in the field:","30":"And Ahijah caught the new garment that was on him, and rent it in twelve pieces:","31":"And he said to Jeroboam, Take thee ten pieces: for thus saith the LORD, the God of Israel, Behold, I will rend the kingdom out of the hand of Solomon, and will give ten tribes to thee:","32":"(But he shall have one tribe for my servant David's sake, and for Jerusalem's sake, the city which I have chosen out of all the tribes of Israel:)","33":"Because that they have forsaken me, and have worshipped Ashtoreth the goddess of the Zidonians, Chemosh the god of the Moabites, and Milcom the god of the children of Ammon, and have not walked in my ways, to do that which is right in mine eyes, and to keep my statutes and my judgments, as did David his father.","34":"Howbeit I will not take the whole kingdom out of his hand: but I will make him prince all the days of his life for David my servant's sake, whom I chose, because he kept my commandments and my statutes:","35":"But I will take the kingdom out of his son's hand, and will give it unto thee, even ten tribes.","36":"And unto his son will I give one tribe, that David my servant may have a light alway before me in Jerusalem, the city which I have chosen me to put my name there.","37":"And I will take thee, and thou shalt reign according to all that thy soul desireth, and shalt be king over Israel.","38":"And it shall be, if thou wilt hearken unto all that I command thee, and wilt walk in my ways, and do that is right in my sight, to keep my statutes and my commandments, as David my servant did; that I will be with thee, and build thee a sure house, as I built for David, and will give Israel unto thee.","39":"And I will for this afflict the seed of David, but not for ever.","40":"Solomon sought therefore to kill Jeroboam. And Jeroboam arose, and fled into Egypt, unto Shishak king of Egypt, and was in Egypt until the death of Solomon.","41":"And the rest of the acts of Solomon, and all that he did, and his wisdom, are they not written in the book of the acts of Solomon?","42":"And the time that Solomon reigned in Jerusalem over all Israel was forty years.","43":"And Solomon slept with his fathers, and was buried in the city of David his father: and Rehoboam his son reigned in his stead."}},"tsk":{"1":[{"kopje":"lief","refs":["1 Kon 11:8","Gen 6:2-5","Deut 17:17","Neh 13:23-27","Spr 2:16","Spr 5:8-20","Spr 6:24","Spr 7:5","Spr 22:14","Spr 23:33"]},{"kopje":"behalve","refs":["1 Kon 3:1","Lev 18:18"]}],"2":[{"kopje":"U zult tot hen niet ingaan","refs":["Ex 23:32","Ex 23:33","Ex 34:16","Deut 7:3","Deut 7:4","Joz 23:12","Joz 23:13","Ezra 9:12","Ezra 10:2-17","Mal 2:11"]},{"kopje":"zeker","refs":["1 Kon 16:31-33","Num 25:1-3","Richt 3:6","Richt 3:7","2 Kron 21:6","2 Kor 6:14-16"]},{"kopje":"Salomo","refs":["Gen 2:24","Gen 34:3","Richt 16:4-21","2 Kron 19:2","Ps 139:21","Rom 1:32","Rom 12:9","1 Kor 15:33","Openb 2:4"]}],"3":[{"kopje":"zevenhonderd","refs":["Richt 8:30","Richt 8:31","Richt 9:5","2 Sam 3:2-5","2 Sam 5:13-16","2 Kron 11:21","Pred 7:28"]}],"4":[{"kopje":"in de tijd van Salomo's ouderdom","refs":["1 Kon 11:42","1 Kon 6:1","1 Kon 9:10","1 Kon 14:21"]},{"kopje":"zijn vrouwen","refs":["1 Kon 11:2","Deut 7:4","Deut 17:17","Neh 13:26","Neh 13:27"]},{"kopje":"zijn hart","refs":["1 Kon 11:6","1 Kon 11:38","1 Kon 6:12","1 Kon 6:13","1 Kon 8:61","1 Kon 9:4","1 Kon 15:3","1 Kon 15:14","2 Kon 20:3","1 Kron 28:9","1 Kron 29:19","2 Kron 17:3","2 Kron 25:2","2 Kron 31:20","2 Kron 31:21","2 Kron 34:2"]}],"5":[{"kopje":"Astoreth","refs":["1 Kon 11:33","Richt 2:13","Richt 10:6","1 Sam 7:3","1 Sam 7:4","1 Sam 12:10","2 Kon 23:13","Jer 2:10-13"]},{"kopje":"Milchom","refs":["1 Kon 11:7","Lev 18:21","Lev 20:2-5","Zef 1:5"]}],"6":[{"kopje":"volhardde niet in het volgen","refs":["Num 14:24","Joz 14:8","Joz 14:14"]}],"7":[{"kopje":"hoogte","refs":["Lev 26:30","Num 33:52","2 Kon 21:2","2 Kon 21:3","2 Kon 23:13","2 Kon 23:14","Ps 78:58","Ezech 20:28","Ezech 20:29"]},{"kopje":"Kamos","refs":["Num 21:29","Richt 11:24","Jer 48:13"]},{"kopje":"verfoeisel","refs":["Deut 13:14","Deut 1  class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> concerning which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> Ye shall not go <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> to them, neither shall they come <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> unto you: for <span class=\"wl wl-kjv\" data-code=\"H403\">surely</span> they will turn <span class=\"wl wl-kjv\" data-code=\"H5186\">away</span> your <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> their <span class=\"wl wl-kjv\" data-code=\"H430\">gods:</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H1692\">clave</span> unto these in <span class=\"wl wl-kjv\" data-code=\"H157\">love.</span>","3":"And he had <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wives,</span> <span class=\"wl wl-kjv\" data-code=\"H8282\">princesses,</span> and <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H6370\">concubines:</span> and his <span class=\"wl wl-kjv\" data-code=\"H802\">wives</span> turned <span class=\"wl wl-kjv\" data-code=\"H5186\">away</span> his <span class=\"wl wl-kjv\" data-code=\"H3820\">heart.</span>","4":"For it came to pass, <span class=\"wl wl-kjv\" data-code=\"H6256\">when</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> was <span class=\"wl wl-kjv\" data-code=\"H2209\">old,</span> that his <span class=\"wl wl-kjv\" data-code=\"H802\">wives</span> turned <span class=\"wl wl-kjv\" data-code=\"H5186\">away</span> his <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> <span class=\"wl wl-kjv\" data-code=\"H430\">gods:</span> and his <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> was not <span class=\"wl wl-kjv\" data-code=\"H8003\">perfect</span> with the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> his <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> as was the <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father.</span>","5":"For <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> <span class=\"wl wl-kjv\" data-code=\"H6253\">Ashtoreth</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">goddess</span> of the <span class=\"wl wl-kjv\" data-code=\"H6722\">Zidonians,</span> and <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> <span class=\"wl wl-kjv\" data-code=\"H4445\">Milcom</span> the <span class=\"wl wl-kjv\" data-code=\"H8251\">abomination</span> of the <span class=\"wl wl-kjv\" data-code=\"H5984\">Ammonites.</span>","6":"And <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and went not <span class=\"wl wl-kjv\" data-code=\"H4390\">fully</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> as did <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father.</span>","7":"Then did <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> an high <span class=\"wl wl-kjv\" data-code=\"H1116\">place</span> for <span class=\"wl wl-kjv\" data-code=\"H3645\">Chemosh,</span> the <span class=\"wl wl-kjv\" data-code=\"H8251\">abomination</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab,</span> in the <span class=\"wl wl-kjv\" data-code=\"H2022\">hill</span> that is <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> and for <span class=\"wl wl-kjv\" data-code=\"H4432\">Molech,</span> the <span class=\"wl wl-kjv\" data-code=\"H8251\">abomination</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon.</span>","8":"And likewise <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> he for all his <span class=\"wl wl-kjv\" data-code=\"H5237\">strange</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wives,</span> which burnt <span class=\"wl wl-kjv\" data-code=\"H6999\">incense</span> and <span class=\"wl wl-kjv\" data-code=\"H2076\">sacrificed</span> unto their <span class=\"wl wl-kjv\" data-code=\"H430\">gods.</span>","9":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was <span class=\"wl wl-kjv\" data-code=\"H599\">angry</span> with <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon,</span> because his <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> was <span class=\"wl wl-kjv\" data-code=\"H5186\">turned</span> from the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> which had <span class=\"wl wl-kjv\" data-code=\"H7200\">appeared</span> unto him <span class=\"wl wl-kjv\" data-code=\"H6471\">twice,</span>","10":"And had <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> him concerning this <span class=\"wl wl-kjv\" data-code=\"H1697\">thing,</span> that he should not <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> <span class=\"wl wl-kjv\" data-code=\"H430\">gods:</span> but he <span class=\"wl wl-kjv\" data-code=\"H8104\">kept</span> not that which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded.</span>","11":"Wherefore the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon,</span> Forasmuch as this is done of thee, and thou hast not <span class=\"wl wl-kjv\" data-code=\"H8104\">kept</span> my <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> and my <span class=\"wl wl-kjv\" data-code=\"H2708\">statutes,</span> which I have <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> thee, I will <span class=\"wl wl-kjv\" data-code=\"H7167\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H7167\">rend</span> the <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdom</span> from thee, and will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> it to thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant.</span>","12":"Notwithstanding in thy <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> I will not <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> it for <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> thy <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> sake: but I will <span class=\"wl wl-kjv\" data-code=\"H7167\">rend</span> it out of the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of thy <span class=\"wl wl-kjv\" data-code=\"H1121\">son.</span>","13":"<span class=\"wl wl-kjv\" data-code=\"H7535\">Howbeit</span> I will not rend <span class=\"wl wl-kjv\" data-code=\"H7167\">away</span> all the <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdom;</span> but will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H7626\">tribe</span> to thy <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> for <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> my <span class=\"wl wl-kjv\" data-code=\"H5650\">servant's</span> sake, and for <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem's</span> sake which I have <span class=\"wl wl-kjv\" data-code=\"H977\">chosen.</span>","14":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> stirred <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> an <span class=\"wl wl-kjv\" data-code=\"H7854\">adversary</span> unto <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon,</span> <span class=\"wl wl-kjv\" data-code=\"H1908\">Hadad</span> the <span class=\"wl wl-kjv\" data-code=\"H130\">Edomite:</span> he was of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> in <span class=\"wl wl-kjv\" data-code=\"H123\">Edom.</span>","15":"For it came to pass, when <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> was in <span class=\"wl wl-kjv\" data-code=\"H123\">Edom,</span> and <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> the <span class=\"wl wl-kjv\" data-code=\"H8269\">captain</span> of the <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> was gone <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H6912\">bury</span> the <span class=\"wl wl-kjv\" data-code=\"H2491\">slain,</span> after he had <span class=\"wl wl-kjv\" data-code=\"H5221\">smitten</span> every <span class=\"wl wl-kjv\" data-code=\"H2145\">male</span> in <span class=\"wl wl-kjv\" data-code=\"H123\">Edom;</span>","16":"(For <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H2320\">months</span> did <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">remain</span> there with all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> until he had cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> every <span class=\"wl wl-kjv\" data-code=\"H2145\">male</span> in <span class=\"wl wl-kjv\" data-code=\"H123\">Edom:)</span>","17":"That <span class=\"wl wl-kjv\" data-code=\"H111\">Hadad</span> <span class=\"wl wl-kjv\" data-code=\"H1272\">fled,</span> he and <span class=\"wl wl-kjv\" data-code=\"H582\">certain</span> <span class=\"wl wl-kjv\" data-code=\"H130\">Edomites</span> of his <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> with him, to <span class=\"wl wl-kjv\" data-code=\"H935\">go</span> into <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt;</span> <span class=\"wl wl-kjv\" data-code=\"H1908\">Hadad</span> being yet a <span class=\"wl wl-kjv\" data-code=\"H6996\">little</span> <span class=\"wl wl-kjv\" data-code=\"H5288\">child.</span>","18":"And they <span class=\"wl wl-kjv\" data-code=\"H6965\">arose</span> out of <span class=\"wl wl-kjv\" data-code=\"H4080\">Midian,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H6290\">Paran:</span> and they <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> with them out of <span class=\"wl wl-kjv\" data-code=\"H6290\">Paran,</span> and they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> unto <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt;</span> which <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> him an <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">appointed</span> him <span class=\"wl wl-kjv\" data-code=\"H3899\">victuals,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> him <span class=\"wl wl-kjv\" data-code=\"H776\">land.</span>","19":"And <span class=\"wl wl-kjv\" data-code=\"H1908\">Hadad</span> <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> <span class=\"wl wl-kjv\" data-code=\"H3966\">great</span> <span class=\"wl wl-kjv\" data-code=\"H2580\">favour</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh,</span> so that he <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> him to <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> the <span class=\"wl wl-kjv\" data-code=\"H269\">sister</span> of his own <span class=\"wl wl-kjv\" data-code=\"H802\">wife,</span> the <span class=\"wl wl-kjv\" data-code=\"H269\">sister</span> of <span class=\"wl wl-kjv\" data-code=\"H8472\">Tahpenes</span> the <span class=\"wl wl-kjv\" data-code=\"H1377\">queen.</span>","20":"And the <span class=\"wl wl-kjv\" data-code=\"H269\">sister</span> of <span class=\"wl wl-kjv\" data-code=\"H8472\">Tahpenes</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> him <span class=\"wl wl-kjv\" data-code=\"H1592\">Genubath</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> whom <span class=\"wl wl-kjv\" data-code=\"H8472\">Tahpenes</span> <span class=\"wl wl-kjv\" data-code=\"H1580\">weaned</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">in</span> <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house:</span> and <span class=\"wl wl-kjv\" data-code=\"H1592\">Genubath</span> was in <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">household</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh.</span>","21":"And when <span class=\"wl wl-kjv\" data-code=\"H1908\">Hadad</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> in <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> that <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H7901\">slept</span> with his <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> and that <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> the <span class=\"wl wl-kjv\" data-code=\"H8269\">captain</span> of the <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> was <span class=\"wl wl-kjv\" data-code=\"H4191\">dead,</span> <span class=\"wl wl-kjv\" data-code=\"H1908\">Hadad</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh,</span> Let me <span class=\"wl wl-kjv\" data-code=\"H7971\">depart,</span> that I may <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> to mine own <span class=\"wl wl-kjv\" data-code=\"H776\">country.</span>","22":"Then <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, But what hast thou <span class=\"wl wl-kjv\" data-code=\"H2638\">lacked</span> with me, that, behold, thou <span class=\"wl wl-kjv\" data-code=\"H1245\">seekest</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> to thine own <span class=\"wl wl-kjv\" data-code=\"H776\">country?</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> Nothing: howbeit let me <span class=\"wl wl-kjv\" data-code=\"H7971\">go</span> in any <span class=\"wl wl-kjv\" data-code=\"H7971\">wise.</span>","23":"And <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> stirred him <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> another <span class=\"wl wl-kjv\" data-code=\"H7854\">adversary,</span> <span class=\"wl wl-kjv\" data-code=\"H7331\">Rezon</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H450\">Eliadah,</span> which <span class=\"wl wl-kjv\" data-code=\"H1272\">fled</span> from his <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> <span class=\"wl wl-kjv\" data-code=\"H1909\">Hadadezer</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H6678\">Zobah:</span>","24":"And he <span class=\"wl wl-kjv\" data-code=\"H6908\">gathered</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> unto him, and became <span class=\"wl wl-kjv\" data-code=\"H8269\">captain</span> over a <span class=\"wl wl-kjv\" data-code=\"H1416\">band,</span> when <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H2026\">slew</span> them of Zobah: and they <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> to <span class=\"wl wl-kjv\" data-code=\"H1834\">Damascus,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> therein, and <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> in <span class=\"wl wl-kjv\" data-code=\"H1834\">Damascus.</span>","25":"And he was an <span class=\"wl wl-kjv\" data-code=\"H7854\">adversary</span> to <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> all the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon,</span> beside the <span class=\"wl wl-kjv\" data-code=\"H7451\">mischief</span> that <span class=\"wl wl-kjv\" data-code=\"H1908\">Hadad</span> did: and he <span class=\"wl wl-kjv\" data-code=\"H6973\">abhorred</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> ode=\"H4714\">Egypt,</span> unto <span class=\"wl wl-kjv\" data-code=\"H7895\">Shishak</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and was in <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> until the <span class=\"wl wl-kjv\" data-code=\"H4194\">death</span> of <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon.</span>","41":"And the <span class=\"wl wl-kjv\" data-code=\"H3499\">rest</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">acts</span> of <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon,</span> and all that he <span class=\"wl wl-kjv\" data-code=\"H6213\">did,</span> and his <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom,</span> are they not <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in the <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">acts</span> of <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon?</span>","42":"And the <span class=\"wl wl-kjv\" data-code=\"H3117\">time</span> that <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> over all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> was <span class=\"wl wl-kjv\" data-code=\"H705\">forty</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years.</span>","43":"And <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H7901\">slept</span> with his <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> and was <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> in the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father:</span> and <span class=\"wl wl-kjv\" data-code=\"H7346\">Rehoboam</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> in his stead."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"de koning Sálomo","tekst":"Te weten, naar sommiger gevoelen, nadat hij vijf of zes en twintig jaren geregeerd had. Men rekent deze jaren aldus: Drie jaren vóór de bouwing des tempels, zeven jaren in die bouwing besteed; dertien jaren in de bouwing van zijn huis en andere gestichten; eindelijk nog twee of drie jaren in welke de koningin van Scheba hem bezocht heeft."},{"catchword":"vreemde","tekst":"Of, uitlandse."},{"catchword":"benevens","tekst":"Zo wordt het Hebreeuwse woord genomen onder, vs.25, en 2Ch 11:18."}],"2":[{"catchword":"gezegd had","tekst":"Zie Exo 34:16, en Deu 7:3-4."},{"catchword":"niet ingaan,","tekst":"Dat is, door huwelijken u met hen verenigen. Zie Gen 6:4."}],"3":[{"catchword":"bijwijven;","tekst":"Die van lageren staat waren dan de huisvrouwen, en in minder waarde gehouden. Zie Gen 22:24."},{"catchword":"neigden zijn hart","tekst":"Te weten, om van den waren God af te wijken en de afgoden aan te hangen, gelijk de volgende woorden uitwijzen."}],"4":[{"catchword":"volkomen","tekst":"Zie boven, 1Ki 8:61."}],"5":[{"catchword":"wandelde","tekst":"Achter de afgoden te gaan, of te wandelen, is, hen aan te hangen en na te volgen, in het geheel of ten dele, zelfs ook met toelating en bevordering; op welke laatste manier Salomo, om zijne vrouwen te behagen, zich aan deze zonde schuldig gemaakt heeft. Vergelijk onder, 1Ki 18:18, en 1Ki 21:25-26; Jer 2:23."},{"catchword":"Astoreth,","tekst":"Dit is de naam van een afgod, of afgodin der Sidoniërs. Zie breder daarvan Jdg 2:13."},{"catchword":"Milchom,","tekst":"Een afgod, die ook Molech genaamd wordt, onder, vs.7. Zie van dezen Lev 18:21."},{"catchword":"het verfoeisel","tekst":"Dat is, dat zeer verfoeilijk en gruwelijk voor God en te verfoeien is van alle godvrezenden; alzo onder, vs.7."}],"6":[{"catchword":"dat kwaad was","tekst":"Versta, bijzonderlijk de afgoderij en den valsen godsdienst. Vergelijk hiermede Gen 38:7."},{"catchword":"volhardde","tekst":"Hebreeuws, en vervulde niet achter den Heere. Zie Num 14:24."}],"7":[{"catchword":"hoogte","tekst":"Zie Lev 26:30."},{"catchword":"Kamos,","tekst":"De naam van een afgod der Moabieten en Ammonieten, van denwelken zie ook Num 21:29; Jdg 11:24; Jer 48:7. Dezen met de twee afgoden, gemeld vs.5, heeft de vrome koning Josia weggenomen; 2Ki 23:13."},{"catchword":"der Moabieten,","tekst":"Die daarom het volk van Chemos genaamd worden; Num 21:29."},{"catchword":"berg,","tekst":"Namelijk, den Olijfberg. Van denwelken zie 2Sa 15:30, en wordt genaamd, 2Ki 23:13, de berg Maschith, dat is, des verdervers, omdat de Joden zich daar door afgoderij verdierven."},{"catchword":"Molech,","tekst":"Ook Milcom genaamd, boven, vs.5."}],"9":[{"catchword":"van den HEERE,","tekst":"Dat is, van hem. Vergelijk boven, 1Ki 8:1, en zie de aantekeningen."},{"catchword":"tweemaal verschenen was","tekst":"Te weten, de eerste maal te Gibeon, boven 1Ki 3:5, en de tweede maal te Jeruzalem na de inwijding des tempels, 1Ki 9:2."}],"11":[{"catchword":"zeide de HEERE","tekst":"Of, Hij zelf, of door enigen profeet, die Nathan kon zijn, zo hij nog leefde; of Ahia de Siloniet, van welken gewag wordt gemaakt onder, vs.30."},{"catchword":"Ik zal gewisselijk","tekst":"Hebreeuws, scheurende scheuren; dat is, Ik zal zekerlijk een groot deel des koninkrijks met geweld van u afrukken. Zie deze manier van spreken onder, vs.12,13, 31."},{"catchword":"uw knecht geven","tekst":"Dat is, een uwer dienaren, namelijk Jerobeam; van wien, zie onder, vs.26-28, enz."}],"12":[{"catchword":"om uws vaders Davids wil,","tekst":"Dat is, om de belofte, die Ik uwen vader gedaan heb, 2Sa 7:13; 1Ch 28:5-6, in welke belofte de Messias mede beloofd wordt, om wiens wil eigenlijk God den zijnen goeddoet."},{"catchword":"zoons","tekst":"Namelijk, van Rehabeam, alzo ook vs.35. Zie de vervulling van dit dreigement, onder, 1Ki 12, en 1Sa 15:28; de verklaring hebben wij onder, vs.35."}],"13":[{"catchword":"Jeruzalems wil,","tekst":"Dat is, om de belofte, die ik aan de stad Jeruzalem gegeven heb, 2Ch 6:6."}],"15":[{"catchword":"in Edom was,","tekst":"Daar oorlog voerende. Zie 2Sa 8:14; 1Ch 18:12-13."},{"catchword":"verslagenen","tekst":"Te weten, Israëlieten, die in den strijd, welken David tegen de Edomieten gehad had, omgekomen waren, of met welken David, na zijn victorie over de Edomieten, hun land bezet had, om het onder zijn gehoorzaamheid te behouden, doch die na zijn vertrek van de inwoners waren verslagen geweest."}],"18":[{"catchword":"Midian,","tekst":"Zie Gen 25:2."},{"catchword":"Paran,","tekst":"Zie Gen 14:6."},{"catchword":"voeding toezeide,","tekst":"Hebreeuws, brood; dat is, kost, voedsel, kleding. Zie Gen 3:19."}],"19":[{"catchword":"vond grote genade","tekst":"Hebreeuws, vond zeer genade; wat het zij, genade in iemands ogen te vinden, zie Gen 18:3."},{"catchword":"koningin","tekst":"Het Hebreeuwse woord betekent eigenlijk de oppervrouw des huisgezins, alsof men zeide, de herin; daarom, als van des konings huis of gezin verstaan zijn huisvrouw, of moeder, de koningin, gelijk hier en onder, 1Ki 15:13; 2Ki 10:13; Jer 13:18, en Jer 29:2."}],"20":[{"catchword":"optoog","tekst":"Hebreeuws, speende."},{"catchword":"in het huis van Faraö;","tekst":"Hebreeuws, in het midden van Farao's huis."}],"22":[{"catchword":"laat mij evenwel gaan","tekst":"Hebreeuws, latende gaan laat mij gaan."}],"23":[{"catchword":"gevloden","tekst":"Te weten, als hij merkte dat David tegen Hadad-Ezer de overhand had in den strijd, waarvan te zien is 2Sa 8:3."},{"catchword":"Zoba,","tekst":"De naam van een landschap van Syrië, gelegen tussen Damaskus en den Eufraat. Zie daarvan 1Sa 14:47, en 2Ch 8:3; Psa 60:2."}],"24":[{"catchword":"mannen","tekst":"Versta, krijgslieden, die den koning van Zoba gediend hadden, en nu onder het beleid van Rezon, die van zijn heer afgevallen was, zich lieten gebruiken om zijn land en het land daaromtrent gelegen af te lopen en te plunderen."},{"catchword":"vergaderd had,","tekst":"Namelijk, zijn heer Hadad-Ezer."},{"catchword":"die doodde;","tekst":"Namelijk, Syriërs van Zoba."},{"catchword":"Damaskus,","tekst":"Zie van deze stad Gen 14:15. Deze stad heeft Rezon overweldigd, en daaruit het garnizoen [van David daarin gelegd, om die onder zich te houden, 2Sa 8:6 ] , uitgedreven, en alzo het regiment daarvan ingenomen."}],"25":[{"catchword":"hij was","tekst":"Namelijk, Rezon."},{"catchword":"al de dagen van Sálomo,","tekst":"Te weten, als Salomo van den Heere afgeweken en tot afgoderij vervallen was. Zie 1Ki 5:4."},{"catchword":"Hadad","tekst":"Versta, Hadad, van welken gesproken is boven, vs.14."},{"catchword":"hij had","tekst":"Namelijk, Rezon."}],"26":[{"catchword":"een Efrathiet","tekst":"Dat is, een Efraïmiet, of, die van den stam van Efraïm was; alzo Jdg 12:5."},{"catchword":"Zeréda,","tekst":"De naam van de stad zijner geboorte, gelegen in den stam Efraïms. Zie Jos 3:16."},{"catchword":"hief ook de hand op","tekst":"Dat is, viel af van den koning, of maakte moeite en oproer tegen den koning; alzo in vs.27, en 2Sa 20:21, en vergelijk onder, vs.40."}],"27":[{"catchword":"Millo,","tekst":"Zie boven, 1Ki 9:15."},{"catchword":"de breuk","tekst":"Te weten, die David gemaakt had als hij de Jebusieten daar uit verdreef, en den burg Zion won. Zie 2Sa 5:6-7."}],"28":[{"catchword":"En de man Jeróbeam","tekst":"Te weten, in het werk van bouwing van grote gestichten en sterkten, waarover hem Salomo als opziener gesteld had. Want hier worden twee gelegenheden verhaald, door welke hij zijn koning ontrouw geworden is, inplaats van dankbaar te zijn. De eerste, dat hij tot het voorzegde ambt verheven was; de andere, dat hij daarna nog tot een hogere staat gekomen is, gelijk de volgende woorden verklaren."},{"catchword":"jongeling zag,","tekst":"Dit woord wordt ook van mannen gebruikt, en voornamelijk als zij iemands dienaren zijn. Zie Gen 22:5."},{"catchword":"arbeidzaam was,","tekst":"Dat is, naarstig, zeer toeziende, en bezig in het verzorgen en uitvoeren van het werk waarover hij van den koning gesteld was. Hebreeuws, doende werk."},{"catchword":"over al den last","tekst":"Versta, de stammen van Efraïm en Manasse."}],"29":[{"catchword":"Ahia,","tekst":"Hij is te onderscheiden van anderen van dezen naam, als van Ahia den priester, 1Sa 14:3, van Ahia den Leviet, die over de schatten van het huis des Heeren was, 1Ch 26:20, van Ahia den schrijver van Salomo, 1Ki 4:3, enz."},{"catchword":"vond,","tekst":"Dat is, ontmoette."},{"catchword":"zich","tekst":"Hebreeuws, zich met een nieuw kleed bedekt had."}],"32":[{"catchword":"een stam","tekst":"Versta, den stam van Juda; hoewel daarin de stam van Simeon enigszins vermengd was, mitsgaders een deel van den stam van Benjamin. Nu in de tien stammen worden Efraïm en Manasse voor twee stammen gerekend, maar de stam van Levi, hebbende geen bijzonder land en zijnde onder de andere stammen verstrooid, komt niet in rekening."},{"catchword":"Mijns knechts","tekst":"Zie boven, vs.12,13."}],"33":[{"catchword":"nedergebogen","tekst":"Te weten, om aan te bidden."},{"catchword":"den god der Sidoniërs,","tekst":"Of, godin."},{"catchword":"gewandeld","tekst":"In den weg des Heeren te wandelen is te leven naar het voorschrift van zijn woord, gelijk de navolgende woorden verklaren. Zie 2Ki 21:22; Psa 119:2, en Psa 128:1."},{"catchword":"wat recht is","tekst":"Wat recht is in de ogen des Heeren verklaren de volgende woorden, namelijk, hetgeen naar zijn heilig woord en ordinantie, niet naar menselijke instellingen geschiedt; alzo onder, 1Ki 15:5, 11, en 1Ki 22:43."}],"34":[{"catchword":"niets van dit koninkrijk","tekst":"Hebreeuws, en dit gehele koninkrijk zal Ik uit zijn hand niet nemen; dat is, niets daarvan. Deze manier van spreken, betekenende niet een particuliere of bijzondere, maar een generale of algemene afzegging en loochening, vindt men zeer dikwijls in de Heilige Schrift, gelijk Gen 23:6; Jos 11:14; Psa 143:2; Mat 24:22; Rom 3:20. Zie ook Gen 39:23."}],"35":[{"catchword":"Ik zal","tekst":"Hebreeuws, en Ik zal dat geven, [te weten] tien stammen."}],"36":[{"catchword":"zal Ik een stam geven;","tekst":"Zie boven, vs.32."},{"catchword":"altijd","tekst":"Hebreeuws, alle dagen. Versta, in den stam van Juda, tot op de toekomst van den Messias. Want van David af tot de Babylonische gevangenis is de koninklijke regering in Juda gebleven; daarna de vorstelijke macht en het Sanhedrin, tot op Christus, wiens koninkrijk eeuwig is."},{"catchword":"lamp","tekst":"Of, kaars, of licht; dat is, navolgens in het koninkrijk, zijnde voorbeelden des Heeren Christus. Zo wordt dit woord ook genomen 2Sa 21:17. Zie mede onder, 1Ki 15:4; 2Ch 21:7; Psa 132:17."},{"catchword":"Mijn Naam","tekst":"Zie boven, 1Ki 8:16."}],"37":[{"catchword":"over al wat uw ziel zal begeren;","tekst":"Dat is, als een souverein vorst over een groot, machtig en welgezegend land; gelijk deze dingen gemeenlijk van koningen begeerd worden."},{"catchword":"over Israël","tekst":"Dat is, over het merendeel des volks."}],"38":[{"catchword":"met u zal zijn,","tekst":"Zie Gen 21:22, en Gen 26:24."},{"catchword":"u een bestendig huis bouwen,","tekst":"Dat is, uw koninkrijk zo bevestigen, dat het bij uw nakomelingen blijven zal. Vergelijk 1Sa 2:35; 2Sa 7:16."}],"39":[{"catchword":"niet altijd","tekst":"Hebreeuws, niet ten allen dage. Want de Messias, die uit het zaad Davids naar het vlees voortkomen zou en in het koninkrijk op het geestelijke manier opvolgen, zou niet alleen over al de stammen Israëls, maar ook over de gehele wereld heerschappij hebben."}],"41":[{"catchword":"der geschiedenissen van Sálomo,","tekst":"Hebreeuws, der woorden."},{"catchword":"in het boek","tekst":"Hiermede moet men niet verstaan de twee boeken der Kronieken, die lang daarna, zo men houdt, van Ezra eerst geschreven zijn, maar een ander boek, in hetwelk de handelingen en geschiedenissen van Salomo in het lange verhaald waren, hetwelk niet meer voorhanden is."}],"42":[{"catchword":"De tijd nu,","tekst":"Hebreeuws, de dagen."}],"43":[{"catchword":"Rehábeam,","tekst":"Genoemd, Mat 1:7, Roboam."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And King Salomon loved many strange [Or, out landish] women, [viz. according to the opinion of some, after that he had reigned five or six and twenty years. These years are counted thus: three years before the building of the Temple; seven years bestowed in the building thereof; thirteen years in the building of his own house, and other fabrics; lastly, two or three years more, wherein the Queen of Scheba visited him] and that besides [so is the Hebrew word taken below v.25. and 2 Chron.11.18.] the daughter of Pharao: Moabitish, Ammonitish, Edomitish, Zidonitish, Hethitish:"}],"2":[{"catchword":null,"tekst":"Of those Nations, concerning which the LORD had said unto the children of Israel; ye shall not go in to them, [i.e. unite your selves with them by marriages. See Gen.6.on v.4.] neither shall they come in unto you, they will surely inclined your heart after their Gods: [see Exo 34:16. and Deut.7.3,4.] Salomon clave unto these with love."}],"3":[{"catchword":null,"tekst":"And he had seven hundred wives, Princesses, and three hundred concubines; [Which were of meaner or lower condition then the wives, and held in less esteem. See Gen.22.on v.24.] and his wives inclined his heart. [viz. to depart from the true God, and to cleave unto Idols, as the Following words declare.]"}],"4":[{"catchword":null,"tekst":"For it came to pass in the time of Solomons old age, (that) his wives inclined his heart unto other Gods: that his heart was not perfect [see above chap.8.on v.61.] with the LORD hos God, as (was) the heart of David his Father."}],"5":[{"catchword":null,"tekst":"For Salomon walked after Astoreth the God of the Zidonians, [Astoreth is the name of an Idol, whether male, or female, of the Zidonians. See further thereof, judg.2.13.] and after Milcon [an Idol called also Molech, below v.7. See of this Idol, Lev.18.on v.21.] the abomination [i.e. which is very loathsome and abominable in the sight of God, and to be abhorred of all godly and truly religious persons. So below v.7.] of the Ammonites. [to go or walk after Idols, is to cleave unto them, and to follow after them, in whole, or in part, yea even by permitting and furthering or advancing the same: In which last manner Salomon to please his wives made himself guilty of this sin. Compare below chap.18.18. and 21.25, 26. Jer 2:23.]"}],"6":[{"catchword":null,"tekst":"So Salomon did that which was evil in the eyes of the LORD: [Understand especially the idolatry, and the false worship of God. Compare herewith, Gen.38.v.7.] and continued not to follow the LORD, [Heb.fulfilled not after the LORD. See Num.14.on v.24.] as David his father (did)."}],"7":[{"catchword":null,"tekst":"Then Salomon built an high place [See Lev.26.on v.30.] for Camos, [the name of an Idol of the Moabites and Ammonites, of which see also Num 21:29. and Judg.11.24. and Jer 48:7. This, with the two Idols mentioned v.5. did good King Josias take away, 2 Kings 23.13.] the loath someness of the Moabites, [who are therefore called the people of Chamos, Nu.21.29.] on the mount [viz. the mount of Olives, of which, see 2 Sam.15 30. and is called (2 Kings 23.13.) mount Maschith, that is, the mount of the corrupter, because the Jews did there corrupt themselves by Idolatry] which is before Jerusalem: and for Moleh [called also Milcom, above v.5.] the loathsomeness of the children of Ammon."}],"8":[{"catchword":null,"tekst":"And he did so for all his strange wives: which burnt incense, and offered unto their Gods."}],"9":[{"catchword":null,"tekst":"Wherefore the LORD was angry with Salomon, because he had inclined his heart from the LORD [i.e. from him. Compare above chap.8.1. and see the annotate.] the God of Israel who had appeared unto him twice; [viz. the first time at Gibeon, above chap.3.5. and the second time at Jerusalem after the building of the Temple chap.9. v.2.]"}],"10":[{"catchword":null,"tekst":"And had commanded him concerning this thing, that he should not walk after others Gods: but he kept not that which the LORD had commanded."}],"11":[{"catchword":null,"tekst":"Wherefore the LORD said [Either he himself, or by some Prophet, possibly by Nathan, if he were yet alive: or Ahia the Silonite, of whom mention is made below v.30.] unto Salomon: Forasmuch as this is done by thee, that thou hast not kept my covenant, and my statutes, which I have commanded thee: I will certainly rend [Heb. rending, rend] this Kingdom from thee, [i.e. I will surely in a violent manner take away a great part of this Kingdom from thee. See of this phrase, below v.12.13,31.] and give the same unto thy servant. [i.e. to one of thy Ministers, namely, Jeroboam, of whom see below v.26,27,28, &c.]"}],"12":[{"catchword":null,"tekst":"Notwithstanding, I will not do it in thy days, for David thy Fathers sake: [i.e. because of the promise which I have made unto thy Father, 2 Sam.7.13. 1 Chron.28.5,6. in which promise the Messiah is likewise promised, for whose sake God properly doeth good to those that be his] I will rend it out of the hand of thy [son. namely, Rehabeam; see also v.35 See the accomplishment of this threatening below chap.12. and 1 Sam.15.28. the explaining whereof we have below v.35.]"}],"13":[{"catchword":null,"tekst":"Howbeit I will not rend away all the Kingdom, I will give one tribe to thy son; for my servant Davids sake, and for Jerusalem sake which I have chosen. [The explaining whereof we have below v,36.]"}],"14":[{"catchword":null,"tekst":"So the LORD stirred up an adversary unto Solomon, Hadad an Edomite: he was of the Kings seed in Edom."}],"15":[{"catchword":null,"tekst":"For it came to pass when David was in Edom, [Waging war there. See 2 Sam.8.14. 1 Chron.18 12,13.] when Joab the commander in chief marched up to bury the slain: [viz. Israelites, that perished in the battle which David had against the Edomites, or whom he had out in Garrison in the Land of the Edomites, after his victory against them, to keep them still in subjection unto him, but after his departure were slain of the inhabitants] that he smote every man in Edom."}],"16":[{"catchword":null,"tekst":"(For Joab continued there six months, with all Israel; until he had destroyed all that was male in Edom.)"}],"17":[{"catchword":null,"tekst":"But Hadad was fled away, he, and (certain) Edomitish men of his Fathers servant with him, to go unto Egypt; Now Hadad was a little youth."}],"18":[{"catchword":null,"tekst":"And they gat them up from Midian, [See Gen.25.on v.3.] and came to Paran; [see Gen.14on vers.6.] and took with them men of Paran, and came into Egypt unto Pharao the King of Egypt; who gave him house, and promised him food, [Heb. bread, i.e. victuals, apparel. See Gen.3.on v.19.] and gave him a land."}],"19":[{"catchword":null,"tekst":"And Halad found great favour in the eyes of Pharao: [Heb. found greatly grace, or favour, etc. What it is, to find grace, or favour in any mans eyes, see Gen. 18.on v.3.] so that he gave him his wives sister to wife, the sister of Tachpenes the Queen. [The Hebrew word signifieth properly the chief woman of the household: as if they should lay the Lordess, or mistress. Therefore mention is made of the Kings house, or family, then is there to be understood withal his wife, or mother the Queen, as here 2 Kings 13. and 15.13. Jer 13:18. and 29.2.]"}],"20":[{"catchword":null,"tekst":"And the sister of Tachpenes bares him Gembath his son, whom Tachpenes brought up [Heb. weaned] in Pharaos house: [Heb. in the midst of Pharaos house] (so) that Gembath was in Pharaos house among Pharaos sons."}],"21":[{"catchword":null,"tekst":"Now when Hadad heard in Egypt that David was fallen a sleep with his Fathers, and that Joab the Commander in cheif was dead: Hadad said unto Pharoa: Let me depart, that I may go into mine (own) Land."}],"22":[{"catchword":null,"tekst":"But Pharoa said unto him: but what lackest thou with me, that behold, thou sleekest to go into thine (own) land? and he said; nothing, but notwithstanding let me go. [Heb. letting go let me go.]"}],"23":[{"catchword":null,"tekst":"Also God stirred up unto him an adversary, Rezon, the son of Eljada, who was fled from his Lord Hadad-Ezer, [viz. when he perceived that David had the victory over Hadad-Ezer, [viz. when he perceive that David had the victory over Hadad-Ezer in battle; of which see 2 Sam.8.3.] the son of Zoba. [the name of a Country in Syria, lying between Damascus and Euphrates. See hereof 1 Sam.14.47. and 2 Chron.8.3. and Psal.60.2.]"}],"24":[{"catchword":null,"tekst":"Against whom he had also gathered [viz. unto his lord Hadad-Ezer] men, [understand souldiers who served the King of Zoba, and now were used under the conduct of Rezon (that revolted from his Lord) to spoil and plunder his Land, and the land lying thereabout] and became Captain of a band when David slew them: [namely, the Syrians of Zoba. See 2 Sam.8.3.] and being gone to Damascus, [See of this City, Gen.14.on v.15. This city Rezon then subdued, and drave our thence the Garrison, (place therein by David, to keep the same under him, 2 Sam.8.6.) and took also the government thereof in his own hands] dwelt there, and reigned in Damascus."}],"25":[{"catchword":null,"tekst":"And he [Namely, Razon] was Israels adversary all the days of Solomon, [viz. when Salomon had departure from the Lord, and was fallen to Idolatry. See 1 Kings 5.4.] and that besiege the evil that Hadad (did): [understand the same man, of whom mention is made above v.14.] for he [viz. Rezon] abhorred Israel, and he reigned over Syria."}],"26":[{"catchword":null,"tekst":"Moreover, Jeroboam the son of Nebat an Eprathite [i.e. an Ephraimite, or that was of the tribe of Ephraim. So judg.12.5.] of Zereda, [the name of the city where he was bo // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte

function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}
