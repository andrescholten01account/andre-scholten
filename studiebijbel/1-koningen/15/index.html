beam, al de dagen van zijn leven.","7":"Het overige nu van de geschiedenissen van Abiam, en alles wat hij gedaan heeft, is dat niet geschreven in het boek van de kronieken van de koningen van Juda? Er was ook oorlog tussen Abiam en Jerobeam.","8":"En Abiam ontsliep met zijn vaderen, en zij begroeven hem in de stad van David; en Asa, zijn zoon, regeerde in zijn plaats.","9":"In het twintigste jaar van Jerobeam, de koning van Israël, werd Asa koning over Juda.","10":"En hij regeerde eenenveertig jaren te Jeruzalem, en de naam van zijn moeder was Maächa, een dochter van Abisalom.","11":"En Asa deed wat recht was in de ogen van de HEERE, zoals zijn vader David.","12":"Want hij nam de schandjongens weg uit het land, en deed alle drekgoden[1] weg, die zijn vaders gemaakt hadden.","13":"Ja, zelfs zijn moeder Maächa zette hij ook af, zodat zij geen koningin meer was, omdat zij een afgrijselijke afgod in een bos gemaakt had; ook roeide Asa haar afgrijselijke afgod uit, en verbrandde die aan de beek Kidron.","14":"De hoogten werden wel niet weggenomen; toch was het hart van Asa volkomen met de HEERE, al zijn dagen.","15":"En hij bracht in het huis van de HEERE de geheiligde dingen van zijn vader, en zijn eigen geheiligde dingen: zilver, en goud, en vaten.","16":"En er was oorlog tussen Asa en Baësa, de koning van Israël, al hun dagen.","17":"Want Baësa, de koning van Israël, trok op tegen Juda, en bouwde Rama; om niemand toe te laten uit te gaan en in te komen tot Asa, de koning van Juda.","18":"Toen nam Asa al het zilver en goud, dat overgebleven was in de schatten van het huis van de HEERE, en de schatten van het huis van de koning, en gaf ze in de hand van zijn knechten; en de koning Asa zond ze tot Benhadad, de zoon van Tabrimmon, de zoon van Hezion, de koning van Syrië, die te Damaskus woonde, en zei:","19":"Er is een verbond tussen mij en u, tussen mijn vader en uw vader; zie, ik zend u een geschenk, zilver en goud; ga heen, maak uw verbond met Baësa, de koning van Israël, teniet, zodat hij van tegen mij aftrekt.","20":"En Benhadad luisterde naar de koning Asa, en zond de leiders van de legers die hij had tegen de steden van Israël; en sloeg Ijon, en Dan, en Abel-Beth-Maächa, en het gehele Cinneroth, met het gehele land Nafthali.","21":"En het gebeurde, toen Baësa dit hoorde, dat hij ophield Rama te bouwen, en hij bleef te Thirza.","22":"Toen liet de koning Asa door heel Juda uitroepen (niemand was vrijgesteld), dat zij de stenen van Rama, en het hout daarvan, zouden wegdragen, waarmee Baësa gebouwd had; en de koning Asa bouwde daarmee Geba-Benjamins, en Mizpa.","23":"Het overige nu van alle geschiedenissen van Asa, en al zijn macht, en alles wat hij gedaan heeft, en de steden die hij gebouwd heeft, zijn die niet geschreven in het boek van de kronieken van de koningen van Juda? Doch in de tijd van het ouderdom werd hij ziek aan zijn voeten.","24":"En Asa ontsliep met zijn vaderen, en werd begraven met zijn vaderen, in de stad van zijn vader David; en zijn zoon Josafat werd koning in zijn plaats.","25":"Nadab nu, de zoon van Jerobeam, werd koning over Israël, in het tweede jaar van Asa, de koning van Juda; en hij regeerde twee jaren over Israël.","26":"En hij deed wat kwaad was in de ogen van de HEERE, en wandelde in de weg van zijn vader, en in zijn zonde, waarmee hij Israël had doen zondigen.","27":"En Baësa, de zoon van Ahia, van het huis van Issaschar, smeedde een samenzwering tegen hem, en Baësa sloeg hem te Gibbethon, dat aan de Filistijnen toebehoort, toen Nadab en heel Israël Gibbethon belegerden.","28":"En Baësa doodde hem, in het derde jaar van Asa, de koning van Juda, en werd koning in zijn plaats.","29":"Het gebeurde nu, toen hij koning werd, dat hij het gehele huis van Jerobeam sloeg; hij liet niets van Jerobeam over wat adem had, totdat hij hem verdelgd had, naar het woord van de HEERE, dat Hij gesproken had door de dienst van Zijn knecht Ahia, de Siloniet;","30":"Om de zonden van Jerobeam, die hij gezondigd had, en die hij Israël had doen zondigen, en om zijn terging, waarmee hij de HEERE, de God van Israël, getergd had.","31":"Het overige nu van de geschiedenissen van Nadab, en alles wat hij gedaan heeft, is dat niet geschreven in het boek van de kronieken van de koningen van Israël?","32":"En er was oorlog tussen Asa en Baësa, de koning van Israël, al hun dagen.","33":"In het derde jaar van Asa, koning van Juda, werd Baësa, de zoon van Ahia, koning over heel Israël, te Thirza, en regeerde vierentwintig jaren.","34":"En hij deed wat kwaad was in de ogen van de HEERE, en wandelde in de weg van Jerobeam, en in zijn zonde, waarmee hij Israël had doen zondigen."},"SV":{"1":"In het achttiende jaar nu van den koning Jerobeam, den zoon van Nebat, werd Abiam koning over Juda.","2":"Hij regeerde drie jaren te Jeruzalem; en de naam zijner moeder was Maacha, een dochter van Abisalom.","3":"En hij wandelde in al de zonden zijns vaders, die hij voor hem gedaan had; en zijn hart was niet volkomen met den HEERE, zijn God, gelijk het hart van zijn vader David.","4":"Maar om Davids wil, gaf de HEERE, zijn God, hem een lamp in Jeruzalem, verwekkende zijn zoon na hem, en bevestigende Jeruzalem.","5":"Omdat David gedaan had wat recht was in de ogen des HEEREN, en niet geweken was van alles, wat Hij hem geboden had, al de dagen zijns levens, dan alleen in de zaak van Uria, den Hethiet.","6":"En er was krijg geweest tussen Rehabeam en tussen Jerobeam, al de dagen zijns levens.","7":"Het overige nu der geschiedenissen van Abiam, en alles, wat hij gedaan heeft, is dat niet geschreven in het boek der kronieken der koningen van Juda? Er was ook krijg tussen Abiam en tussen Jerobeam.","8":"En Abiam ontsliep met zijn vaderen, en zij begroeven hem in de stad Davids; en Asa, zijn zoon, regeerde in zijn plaats.","9":"In het twintigste jaar van Jerobeam, den koning van Israël, werd Asa koning over Juda.","10":"En hij regeerde een en veertig jaren te Jeruzalem, en de naam zijner moeder was Maacha, een dochter van Abisalom.","11":"En Asa deed wat recht was in de ogen des HEEREN, gelijk zijn vader David.","12":"Want hij nam weg de schandjongens uit het land, en deed weg al de drekgoden, die zijn vaders gemaakt hadden.","13":"Ja, zelfs zijn moeder Maacha zette hij ook af, dat zij geen koningin ware, omdat zij een afgrijselijken afgod in een bos gemaakt had; ook roeide Asa uit haar afgrijselijken afgod, en verbrandde *hem* aan de beek Kidron.","14":"De hoogten werden wel niet weggenomen; nochtans was het hart van Asa volkomen met den HEERE, al zijn dagen.","15":"En hij bracht in het huis des HEEREN de geheiligde dingen zijns vaders, en *zijn* geheiligde dingen, zilver, en goud, en vaten.","16":"En er was krijg tussen Asa en tussen Baësa, den koning van Israël, al hun dagen.","17":"Want Baësa, de koning van Israël, toog op tegen Juda, en bouwde Rama; opdat hij niemand toeliet uit te gaan en in te komen tot Asa, den koning van Juda.","18":"Toen nam Asa al het zilver en goud, dat overgebleven was in de schatten van het huis des HEEREN, en de schatten van het huis des konings, en gaf ze in de hand zijner knechten; en de koning Asa zond ze tot Benhadad, den zoon van Tabrimmon, den zoon van Hezion, den koning van Syrië, die te Damaskus woonde, zeggende:","19":"Er is een verbond tussen mij en tussen u, tussen mijn vader en tussen uw vader; zie, ik zend u een geschenk, zilver en goud; ga heen, maak uw verbond te niet met Baësa, den koning van Israël, dat hij aftrekke van tegen mij.","20":"En Benhadad hoorde naar den koning Asa, en zond de oversten der heiren, die hij had, tegen de steden van Israël; en sloeg Ijon, en Dan, en Abel Beth-maacha, en het ganse Cinneroth, met het ganse land Nafthali.","21":"En het geschiedde, als Baësa *zulks* hoorde, dat hij afliet van Rama te bouwen, en hij bleef te Thirza.","22":"Toen liet de koning Asa door gans Juda uitroepen (niemand was vrij), dat zij de stenen van Rama, en het hout daarvan, zouden wegdragen, waarmede Baësa gebouwd had; en de koning Asa bouwde daarmede Geba-benjamins, en Mizpa.","23":"Het overige nu van alle geschiedenissen van Asa, en al zijn macht, en al wat hij gedaan heeft, en de steden, die hij gebouwd heeft, zijn die niet geschreven in het boek der kronieken der koningen van Juda? Doch in den tijd zijns ouderdoms werd hij krank aan zijn voeten.","24":"En Asa ontsliep met zijn vaderen, en werd begraven met zijn vaderen, in de stad van zijn vader David; en zijn zoon Josafat werd koning in zijn plaats.","25":"Nadab nu, de zoon van Jerobeam, werd koning over Israël, in het tweede jaar van Asa, den koning van Juda; en hij regeerde twee jaren over Israël.","26":"En hij deed wat kwaad was in de ogen des HEEREN, en wandelde in den weg zijns vaders, en in zijn zonde, waarmede hij Israël had doen zondigen.","27":"En Baësa, de zoon van Ahia, van het huis van Issaschar, maakte een verbintenis tegen hem, en Baësa sloeg hem te Gibbethon, hetwelk der Filistijnen is, als Nadab en gans Israël Gibbethon belegerden.","28":"En Baësa doodde hem, in het derde jaar van Asa, den koning van Juda, en werd koning in zijn plaats.","29":"Het geschiedde nu, als hij regeerde, dat hij het ganse huis van Jerobeam sloeg; hij liet niets over van Jerobeam, wat adem had, totdat hij hem verdelgd had, naar het woord des HEEREN, dat Hij gesproken had door den dienst van Zijn knecht Ahia, den Siloniet;","30":"Om de zonden van Jerobeam, die zondigde, en die Israël zondigen deed, *en* om zijn terging, waarmede hij den HEERE, den God Israëls, getergd had.","31":"Het overige nu der geschiedenissen van Nadab, en al wat hij gedaan heeft, is dat niet geschreven in het boek der kronieken der koningen van Israël?","32":"En er was oorlog tussen Asa en tussen Baësa, den koning van Israël, al hun dagen.","33":"In het derde jaar van Asa, koning van Juda, werd Baësa, de zoon van Ahia, koning over gans Israël, te Thirza, *en* *regeerde* vier en twintig jaren.","34":"En hij deed wat kwaad was in de ogen des HEEREN, en wandelde in den weg van Jerobeam, en in zijn zonde, waarmede hij Israël had doen zondigen."},"KJV":{"1":"Now in the eighteenth year of king Jeroboam the son of Nebat reigned Abijam over Judah.","2":"Three years reigned he in Jerusalem. And his mother's name was Maachah, the daughter of Abishalom.","3":"And he walked in all the sins of his father, which he had done before him: and his heart was not perfect with the LORD his God, as the heart of David his father.","4":"Nevertheless for David's sake did the LORD his God give him a lamp in Jerusalem, to set up his son after him, and to establish Jerusalem:","5":"Because David did that which was right in the eyes of the LORD, and turned not aside from any thing that he commanded him all the days of his life, save only in the matter of Uriah the Hittite.","6":"And there was war between Rehoboam and Jeroboam all the days of his life.","7":"Now the rest of the acts of Abijam, and all that he did, are they not written in the book of the chronicles of the kings of Judah? And there was war between Abijam and Jeroboam.","8":"And Abijam slept with his fathers; and they buried him in the city of David: and Asa his son reigned in his stead.","9":"And in the twentieth year of Jeroboam king of Israel reigned Asa over Judah.","10":"And forty and one years reigned he in Jerusalem. And his mother's name was Maachah, the daughter of Abishalom.","11":"And Asa did that which was right in the eyes of the LORD, as did David his father.","12":"And he took away the sodomites out of the land, and removed all the idols that his fathers had made.","13":"And also Maachah his mother, even her he removed from being queen, because she had made an idol in a grove; and Asa destroyed her idol, and burnt it by the brook Kidron.","14":"But the high places were not removed: nevertheless Asa's heart was perfect with the LORD all his days.","15":"And he brought in the things ➔ which his father had dedicated, and the things which himself had dedicated, into the house of the LORD, silver, and gold, and vessels.","16":"And there was war between Asa and Baasha king of Israel all their days.","17":"And Baasha king of Israel went up against Judah, and built Ramah, that he might not suffer any to go out or come in to Asa king of Judah.","18":"Then Asa took all the silver and the gold that were left in the treasures of the house of the LORD, and the treasures of the king's house, and delivered them into the hand of his servants: and king Asa sent them to Benhadad, the son of Tabrimon, the son of Hezion, king of Syria, that dwelt at Damascus, saying,","19":"There is a league between me and thee, and between my father and thy father: behold, I have sent unto thee a present of silver and gold; come and break thy league with Baasha king of Israel, that he may depart from me.","20":"So Benhadad hearkened unto king Asa, and sent the captains of the hosts which he had against the cities of Israel, and smote Ijon, and Dan, and Abelbethmaachah, and all Cinneroth, with all the land of Naphtali.","21":"And it came to pass, when Baasha heard thereof, that he left off building of Ramah, and dwelt in Tirzah.","22":"Then king Asa made a proclamation throughout all Judah; none was exempted: and they took away the stones of Ramah, and the timber thereof, wherewith Baasha had builded; and king Asa built with them Geba of Benjamin, and Mizpah.","23":"The rest of all the acts of Asa, and all his might, and all that he did, and the cities which he built, are they not written in the book of the chronicles of the kings of Judah? Nevertheless in the time of his old age he was diseased in his feet.","24":"And Asa slept with his fathers, and was buried with his fathers in the city of David his father: and Jehoshaphat his son reigned in his stead.","25":"And Nadab the son of Jeroboam began to reign over Israel in the second year of Asa king of Judah, and reigned over Israel two years.","26":"And he did evil in the sight of the LORD, and walked in the way of his father, and in his sin wherewith he made Israel to sin.","27":"And Baasha the son of Ahijah, of the house of Issachar, conspired against him; and Baasha smote him at Gibbethon, which belonged to the Philistines; for Nadab and all Israel laid siege to Gibbethon.","28":"Even in the third year of Asa king of Judah did Baasha slay him, and reigned in his stead.","29":"And it came to pass, when he reigned, that he smote all the house of Jeroboam; he left not to Jeroboam any that breathed, until he had destroyed him, according unto the saying of the LORD, which he spake by his servant Ahijah the Shilonite:","30":"Because of the sins of Jeroboam which he sinned, and which he made Israel sin, by his provocation wherewith he provoked the LORD God of Israel to anger.","31":"Now the rest of the acts of Nadab, and all that he did, are they not written in the book of the chronicles of the kings of Israel?","32":"And there was war between Asa and Baasha king of Israel all their days.","33":"In the third year of Asa king of Judah began Baasha the son of Ahijah to reign over all Israel in Tirzah, twenty and four years.","34":"And he did evil in the sight of the LORD, and walked in the way of Jeroboam, and in his sin wherewith he made Israel to sin."}},"tsk":{"2":[{"kopje":"zijn moeder","refs":["1 Kon 15:13","2 Kron 11:20-22"]},{"kopje":"Maächa","refs":["2 Kron 13:2"]},{"kopje":"Abisalom","refs":["2 Kron 11:21"]}],"3":[{"kopje":"al de zonden","refs":["1 Kon 14:21","1 Kon 14:22"]},{"kopje":"en zijn hart","refs":["1 Kon 3:14","1 Kon 11:4","1 Kon 11:33","2 Kon 20:3","2 Kron 25:2","2 Kron 31:20","2 Kron 31:21","Ps 119:80"]}],"4":[{"kopje":"om Davids wil","refs":["1 Kon 11:12","1 Kon 11:32","Gen 12:2","Gen 19:29","Gen 26:5","Deut 4:37","2 Sam 7:12-16","Jes 37:35","Jer 33:20-26","Rom 11:28"]},{"kopje":"hem","refs":["1 Kon 11:36","2 Kron 21:7","Ps 132:17","Luk 1:69-79","Luk 2:32","Joh 8:12","Openb 22:16"]},{"kopje":"lamp","refs":["Ps 18:29"]},{"kopje":"en te bevestigen","refs":["Ps 87:5","Jes 9:6","Jes ">son</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> him, and to <span class=\"wl wl-kjv\" data-code=\"H5975\">establish</span> <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem:</span>","5":"Because <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> that which was <span class=\"wl wl-kjv\" data-code=\"H3477\">right</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and turned not <span class=\"wl wl-kjv\" data-code=\"H5493\">aside</span> from any thing that he <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> him all the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of his <span class=\"wl wl-kjv\" data-code=\"H2416\">life,</span> save only in the <span class=\"wl wl-kjv\" data-code=\"H1697\">matter</span> of <span class=\"wl wl-kjv\" data-code=\"H223\">Uriah</span> the <span class=\"wl wl-kjv\" data-code=\"H2850\">Hittite.</span>","6":"And there was <span class=\"wl wl-kjv\" data-code=\"H4421\">war</span> between <span class=\"wl wl-kjv\" data-code=\"H7346\">Rehoboam</span> and <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam</span> all the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of his <span class=\"wl wl-kjv\" data-code=\"H2416\">life.</span>","7":"Now the <span class=\"wl wl-kjv\" data-code=\"H3499\">rest</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">acts</span> of <span class=\"wl wl-kjv\" data-code=\"H38\">Abijam,</span> and all that he <span class=\"wl wl-kjv\" data-code=\"H6213\">did,</span> are they not <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in the <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">chronicles</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah?</span \">Asa</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> that which was <span class=\"wl wl-kjv\" data-code=\"H3477\">right</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> as did <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father.</span>","12":"And he took <span class=\"wl wl-kjv\" data-code=\"H5674\">away</span> the <span class=\"wl wl-kjv\" data-code=\"H6945\">sodomites</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and <span class=\"wl wl-kjv\" data-code=\"H5493\">removed</span> all the <span class=\"wl wl-kjv\" data-code=\"H1544\">idols</span> that his <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> had <span class=\"wl wl-kjv\" data-code=\"H6213\">made.</span>","13":"And also <span class=\"wl wl-kjv\" data-code=\"H4601\">Maachah</span> his <span class=\"wl wl-kjv\" data-code=\"H517\">mother,</span> even her he <span class=\"wl wl-kjv\" data-code=\"H5493\">removed</span> from being <span class=\"wl wl-kjv\" data-code=\"H1377\">queen,</span> because she had <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> an <span class=\"wl wl-kjv\" data-code=\"H4656\">idol</span> in a <span class=\"wl wl-kjv\" data-code=\"H842\">grove;</span> and <span class=\"wl wl-kjv\" data-code=\"H609\">Asa</span> <span class=\"wl wl-kjv\" data-code=\"H3772\">destroyed</span> her <span class=\"wl wl-kjv\" data-code=\"H4656\">idol,</span> and <span class=\"wl wl-kjv\" data-code=\"H8313\">burnt</span> it by the <span class=\"wl wl-kjv\" data-code=\"H5158\">brook</span> <span class=\"wl wl-kjv\" data-code=\"H6939\">Kidron.</span>","14":"But the high <span class=\"wl wl-kjv\" data-code=\"H1116\">places</span> were not <span class=\"wl wl-kjv\" data-code=\"H5493\">removed:</span> nevertheless <span class=\"wl wl-kjv\" data-code=\"H609\">Asa's</span> <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> was <span class=\"wl wl-kjv\" data-code=\"H8003\">perfect</span> with the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> all his <span class=\"wl wl-kjv\" data-code=\"H3117\">days.</span>","15":"And he <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> in the <span class=\"wl wl-kjv\" data-code=\"H6944\">things</span> ➔ which his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> had <span class=\"wl wl-kjv\" data-code=\"H6944\">dedicated,</span> and the things which himself had <span class=\"wl wl-kjv\" data-code=\"H6944\">dedicated,</span> into the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> and <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> and <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels.</span>","16":"And there was <span class=\"wl wl-kjv\" data-code=\"H4421\">war</span> between <span class=\"wl wl-kjv\" data-code=\"H609\">Asa</span> and <span class=\"wl wl-kjv\" data-code=\"H1201\">Baasha</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> all their <span class=\"wl wl-kjv\" data-code=\"H3117\">days.</span>","17":"And <span class=\"wl wl-kjv\" data-code=\"H1201\">Baasha</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> against <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> <span class=\"wl wl-kjv\" data-code=\"H7414\">Ramah,</span> that he might not <span class=\"wl wl-kjv\" data-code=\"H5414\">suffer</span> any to go <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> or come <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> to <span class=\"wl wl-kjv\" data-code=\"H609\">Asa</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah.</span>","18":"Then <span class=\"wl wl-kjv\" data-code=\"H609\">Asa</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> all the <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> and the <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> that were <span class=\"wl wl-kjv\" data-code=\"H3498\">left</span> in the <span class=\"wl wl-kjv\" data-code=\"H214\">treasures</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and the <span class=\"wl wl-kjv\" data-code=\"H214\">treasures</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> them into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants:</span> and <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H609\">Asa</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> them to <span class=\"wl wl-kjv\" data-code=\"H1130\">Benhadad,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H2886\">Tabrimon,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H2383\">Hezion,</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H758\">Syria,</span> that <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> at <span class=\"wl wl-kjv\" data-code=\"H1834\">Damascus,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span>","19":"There is a <span class=\"wl wl-kjv\" data-code=\"H1285\">league</span> between me and thee, and between my <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> and thy <span class=\"wl wl-kjv\" data-code=\"H1\">father:</span> behold, I have <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> unto thee a <span class=\"wl wl-kjv\" data-code=\"H7810\">present</span> of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> and <span class=\"wl wl-kjv\" data-code=\"H2091\">gold;</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">come</span> and <span class=\"wl wl-kjv\" data-code=\"H6565\">break</span> thy <span class=\"wl wl-kjv\" data-code=\"H1285\">league</span> with <span class=\"wl wl-kjv\" data-code=\"H1201\">Baasha</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> that he may <span class=\"wl wl-kjv\" data-code=\"H5927\">depart</span> from me.","20":"So <span class=\"wl wl-kjv\" data-code=\"H1130\">Benhadad</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">hearkened</span> unto <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H609\">Asa,</span> and <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> the <span class=\"wl wl-kjv\" data-code=\"H8269\">captains</span> of the <span class=\"wl wl-kjv\" data-code=\"H2428\">hosts</span> which he had against the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> <span class=\"wl wl-kjv\" data-code=\"H5859\">Ijon,</span> and <span class=\"wl wl-kjv\" data-code=\"H1835\">Dan,</span> and <span class=\"wl wl-kjv\" data-code=\"H62\">Abelbethmaachah,</span> and all <span class=\"wl wl-kjv\" data-code=\"H3672\">Cinneroth,</span> with all the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H5321\">Naphtali.</span>","21":"And it came to pass, when <span class=\"wl wl-kjv\" data-code=\"H1201\">Baasha</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> thereof, that he left <span class=\"wl wl-kjv\" data-code=\"H2308\">off</span> <span class=\"wl wl-kjv\" data-code=\"H1129\">building</span> of <span class=\"wl wl-kjv\" data-code=\"H7414\">Ramah,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in <span class=\"wl wl-kjv\" data-code=\"H8656\">Tirzah.</span>","22":"Then <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H609\">Asa</span> made a <span class=\"wl wl-kjv\" data-code=\"H8085\">proclamation</span> throughout all <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah;</span> none was <span class=\"wl wl-kjv\" data-code=\"H5355\">exempted:</span> and they <span class=\"wl wl-kjv\" data-code=\"H5375\">took</span> away the <span class=\"wl wl-kjv\" data-code=\"H68\">stones</span> of <span class=\"wl wl-kjv\" data-code=\"H7414\">Ramah,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6086\">timber</span> thereof, wherewith <span class=\"wl wl-kjv\" data-code=\"H1201\">Baasha</span> had <span class=\"wl wl-kjv\" data-code=\"H1129\">builded;</span> and <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H609\">Asa</span> <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> with them <span class=\"wl wl-kjv\" data-code=\"H1387\">Geba</span> of <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin,</span> and <span class=\"wl wl-kjv\" data-code=\"H4709\">Mizpah.</span>","23":"The <span class=\"wl wl-kjv\" data-code=\"H3499\">rest</span> of all the <span class=\"wl wl-kjv\" data-code=\"H1697\">acts</span> of <span class=\"wl wl-kjv\" data-code=\"H609\">Asa,</span> and all his <span class=\"wl wl-kjv\" data-code=\"H1369\">might,</span> and all that he <span class=\"wl wl-kjv\" data-code=\"H6213\">did,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> which he <span class=\"wl wl-kjv\" data-code=\"H1129\">built,</span> are they not <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in the <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">chronicles</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah?</span> Nevertheless in the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> of his old <span class=\"wl wl-kjv\" data-code=\"H2209\">age</span> he was <span class=\"wl wl-kjv\" data-code=\"H2470\">diseased</span> in his <span class=\"wl wl-kjv\" data-code=\"H7272\">feet.</span>","24":"And <span class=\"wl wl-kjv\" data-code=\"H609\">Asa</span> <span class=\"wl wl-kjv\" data-code=\"H7901\">slept</span> with his <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> and was <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> with his <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> in the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father:</span> and <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> in his stead.","25":"And <span class=\"wl wl-kjv\" data-code=\"H5070\">Nadab</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam</span> began to <span class=\"wl wl-kjv\" data-code=\"H4427\">reign</span> over <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> in the <span class=\"wl wl-kjv\" data-code=\"H8147\">second</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H609\">Asa</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> over <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years.</span>","26":"And he <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">walked</span> in the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of his <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> and in his <span class=\"wl wl-kjv\" data-code=\"H2403\">sin</span> wherewith he made <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> to <span class=\"wl wl-kjv\" data-code=\"H2398\">sin.</span>","27":"And <span class=\"wl wl-kjv\" data-code=\"H1201\">Baasha</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H281\">Ahijah,</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3485\">Issachar,</span> <span class=\"wl wl-kjv\" data-code=\"H7194\">conspired</span> against him; and <span class=\"wl wl-kjv\" data-code=\"H1201\">Baasha</span> <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> him at <span class=\"wl wl-kjv\" data-code=\"H1405\">Gibbethon,</span> which belonged to the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines;</span> for <span class=\"wl wl-kjv\" data-code=\"H5070\">Nadab</span> and all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> laid <span class=\"wl wl-kjv\" data-code=\"H6696\">siege</span> to <span class=\"wl wl-kjv\" data-code=\"H1405\">Gibbethon.</span>","28":"Even in the <span class=\"wl wl-kjv\" data-code=\"H7969\">third</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H609\">Asa</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> did <span class=\"wl wl-kjv\" data-code=\"H1201\">Baasha</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">slay</span> him, and <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> in his stead.","29":"And it came to pass, when he <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned,</span> that he <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> all the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam;</span> he <span class=\"wl wl-kjv\" data-code=\"H7604\">left</span> not to <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam</span> any that <span class=\"wl wl-kjv\" data-code=\"H5397\">breathed,</span> until he had <span class=\"wl wl-kjv\" data-code=\"H8045\">destroyed</span> him, according unto the <span class=\"wl wl-kjv\" data-code=\"H1697\">saying</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> which he <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">by</span> his <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H281\">Ahijah</span> the <span class=\"wl wl-kjv\" data-code=\"H7888\">Shilonite:</span>","30":"Because of the <span class=\"wl wl-kjv\" data-code=\"H2403\">sins</span> of <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam</span> which he <span class=\"wl wl-kjv\" data-code=\"H2398\">sinned,</span> and which he made <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H2398\">sin,</span> by his <span class=\"wl wl-kjv\" data-code=\"H3708\">provocation</span> wherewith he provoked the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> to <span class=\"wl wl-kjv\" data-code=\"H3707\">anger.</span>","31":"Now the <span class=\"wl wl-kjv\" data-code=\"H3499\">rest</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">acts</span> of <span class=\"wl wl-kjv\" data-code=\"H5070\">Nadab,</span> and all that he <span class=\"wl wl-kjv\" data-code=\"H6213\">did,</span> are they not <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in the <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">chronicles</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel?</span>","32":"And there was <span class=\"wl wl-kjv\" data-code=\"H4421\">war</span> between <span class=\"wl wl-kjv\" data-code=\"H609\">Asa</span> and <span class=\"wl wl-kjv\" data-code=\"H1201\">Baasha</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> all their <span class=\"wl wl-kjv\" data-code=\"H3117\">days.</span>","33":"In the <span class=\"wl wl-kjv\" data-code=\"H7969\">third</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H609\">Asa</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> began <span class=\"wl wl-kjv\" data-code=\"H1201\">Baasha</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H281\">Ahijah</span> to <span class=\"wl wl-kjv\" data-code=\"H4427\">reign</span> over all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> in <span class=\"wl wl-kjv\" data-code=\"H8656\">Tirzah,</span> <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> and <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years.</span>","34":"And he <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">walked</span> in the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam,</span> and in his <span class=\"wl wl-kjv\" data-code=\"H2403\">sin</span> wherewith he made <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> to <span class=\"wl wl-kjv\" data-code=\"H2398\">sin.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Abiam","tekst":"Anders, Abia; 2Ch 12:16, en 2Ch 13:1, enz."}],"2":[{"catchword":"drie jaren","tekst":"Beginnende van het achttiende jaar des koninkrijks van Jerobeam, vs.1, en eindigende met het twintigste. Zie onder, vs.9."},{"catchword":"Máächa,","tekst":"Ook geheten Michaja; 2Ch 13:2."},{"catchword":"Abisalom","tekst":"Deze wordt ook Absalom genoemd, 2Ch 11:21. Eenigen houden hem geweest te zijn de zoon Davids; vele anderen, een ander van denzelfden naam, die van Gibea was, anders ook genoemd Uriël, 2Ch 13:2. Zie aldaar de aantekeningen."}],"3":[{"catchword":"volkomen","tekst":"Zie boven, 1Ki 8:61."}],"4":[{"catchword":"om Davids wil,","tekst":"Zie boven, 1Ki 11:12."},{"catchword":"lamp","tekst":"Zie boven, 1Ki 11:36."},{"catchword":"bevestigende","tekst":"Te weten, in zijn voorgaanden staat der politie en der religie, behoudende nog daarin de koninklijke majesteit, met de overblijfselen van de rechte leer en den zuiveren godsdienst."}],"5":[{"catchword":"wat recht","tekst":"Alzo onder, vs.11. Zie boven, 1Ki 11:33."},{"catchword":"dan alleen","tekst":"Versta deze uitneming, ten aanzien van zeer grove zonden, die geschieden met een zeker voorweten van hetgeen God verboden heeft, zonder voorgaande onbedachtheid, vergetenheid, of misgrijping des oordeels."}],"6":[{"catchword":"zijns levens","tekst":"Namelijk, van Rehabeam. Van dezen oorlog is ook gewag gemaakt boven, 1Ki 14:30. Hetzelfde wordt hier nu weder vernieuwd, om aan te wijzen dat zijn zoon Abiam in denzelfden oorlog volduurd heeft; gelijk te zien is in vs.7 en 2Ch 13:2-3."}],"7":[{"catchword":"in het boek","tekst":"Zie boven, 1Ki 14:19."}],"8":[{"catchword":"ontsliep","tekst":"Zie boven, 1Ki 1:21; Deu 31:16."},{"catchword":"stad Davids;","tekst":"Zie boven, 1Ki 2:10."}],"9":[{"catchword":"twintigste","tekst":"Te weten, omtrent het einde dezes jaars."}],"10":[{"catchword":"moeder","tekst":"Versta, grootmoeder, alzo onder, vs.13, want zij was de moeder van zijn vader Abiam, boven, vs.2; alzo worden bij de Hebreën vaders en moeders genaamd, niet alleen de naaste ouders uit welken men eigenlijk geboren is, maar ook die hoger in de rechte linie opgerekend worden. Zie de volgende verzen, enz."},{"catchword":"Abisalom","tekst":"Zie boven, vs.2."}],"11":[{"catchword":"recht was","tekst":"Zie boven, 1Ki 11:33."},{"catchword":"vader David","tekst":"Zijns grootvaders Rehabeams grootvader."}],"12":[{"catchword":"schandjongens","tekst":"Zie Deu 23:17."},{"catchword":"drekgoden,","tekst":"Zie Lev 26:30."},{"catchword":"vaders","tekst":"Namelijk, zijn vader Abiam, zijn grootvader Rehabeam, en zijn oudgrootvader Salomo."}],"13":[{"catchword":"koningin ware,","tekst":"Zie van dit woord boven, 1Ki 11:19. Hebreeuws, van herin [namelijk] te zijn. De zin is, dat hij haar van het gebied, hetwelk zij als weduwe van den koning Rehabeam en als moeder van zijn vader Abiam aangenomen had, afgezet heeft. Anders, heeft hij ook geweerd van de koningin; dat is, van de huisvrouw, opdat zij niet zou verdorven worden."},{"catchword":"afgrijselijken","tekst":"Het Hebreeuwse woord betekent beving der leden en vrees des harten. Zo wordt deze afgod genoemd, omdat hij door de gruwzaamheid zijns gelaats en schandelijke afgoderij de mensen beide naar ziel en lijf verschrikte, en zij hem met beiderlei schrik dienden. Eenigen houden hem voor den afgod bij de heidenen genaamd Priapus, anderen voor Pan. Zie hiervan ook 2Ch 15:16."},{"catchword":"verbrandde","tekst":"Te weten, nadat hij hem in stukken gebroken en vermorzeld had; 2Ch 15:16."},{"catchword":"Kidron","tekst":"Zie boven, 1Ki 2:37."}],"14":[{"catchword":"hoogten","tekst":"Zie Lev 26:30."},{"catchword":"volkomen","tekst":"Zie boven, 1Ki 8:61. En versta deze volkomenheid en oprechtheid des konings eigenlijk ten aanzien van zijn genegenheid, betrachting en ijver in en voor den zuiveren godsdienst, hoewel hij in zijn volgend leven verscheidene gebreken gehad heeft."}],"15":[{"catchword":"zijn","tekst":"Dit woord zijne wordt hier ingevoegd uit 2Ch 15:18."}],"16":[{"catchword":"al hun dagen","tekst":"Welverstaande, uitgenomen de eerste jaren, die zij tezamen geregeerd hebben. Want Juda is de eerste tien jaren onder de regering van Asa in stilheid geweest, 2Ch 14:1; en Baesa begon te regeren over Israël in het derde jaar des konings Asa, onder vs.28. Of, men moet zeggen, dat in de eerste jaren dezer koningen van wederzijden wel uitvallen zijn geschied, maar geen volkomen oorlog. Vergelijk de aantekeningen 2Ch 14:1."}],"17":[{"catchword":"Rama;","tekst":"Een stad, gelegen in den stam Benjamins, omtrent de grenzen van het koninkrijk Israëls, en op den weg naar Jeruzalem. Zie van deze stad breder Jdg 4:5."},{"catchword":"opdat hij","tekst":"Hebreeuws, om niet toe te laten den uitgaande en den komende tot Asa, enz. Versta van Benjamin, Efraïm, Manasse en andere nabijgelegen stammen, uit welke, als velen zagen dat Asa den zuiveren godsdienst behartigde, zijn tot hem overgekomen, om den Heere te Jeruzalem naar zijn woord te dienen, 2Ch 15:9; om dit te beletten heeft de koning Baesa zijn stad Rama laten sterk maken. Vergelijk hierbij boven, 1Ki 12:26-27, enz."}],"18":[{"catchword":"overgebleven was","tekst":"Te weten, van de tijden Rehabeams. Zie boven, 1Ki 14:26, en vergelijk hiermede de aantekeningen daarop."},{"catchword":"knechten;","tekst":"Zie Gen 20:8."},{"catchword":"Hézion,","tekst":"Sommigen menen deze geweest te zijn dezelfde, die boven, 1Ki 11:23, genaamd wordt Rezon."},{"catchword":"Damaskus woonde,","tekst":"Zie Gen 14:15."}],"19":[{"catchword":"is een verbond","tekst":"Hoewel Rezon een vijand geweest was van Israël, zolang Salomo leefde, boven, 1Ki 11:25, nochtans schijnt uit deze woorden dat hij na de verdeling des rijks met beide de koningen in vrede en verbintenis gestaan heeft."},{"catchword":"aftrekke","tekst":"Hebreeuws, optrekke."}],"20":[{"catchword":"Ijon,","tekst":"Een stad, naar eniger gevoelen, in den stam van Aser gelegen, anderen stellen haar in den stam van Naftali. Zie van dezelve ook 2Ki 15:29, en 2Ch 16:4."},{"catchword":"Dan,","tekst":"Zie Gen 14:14."},{"catchword":"Abel Beth-máächa,","tekst":"Anders genaamd, Abel-Maïm, 2Ch 16:4, gelegen, zo sommigen menen, in Manasse, of, alzo enige kaarten uitwijzen, in Nafthali. Zie van deze stad ook 2Sa 20:15; 2Ch 16:4."},{"catchword":"het ganse land Nafthali","tekst":"Een landschap, gelegen in Nafthali omtrent de zee Gennesareth. Zie Jos 11:2."}],"21":[{"catchword":"Thirza","tekst":"Zie van deze stad boven, 1Ki 14:17."}],"22":[{"catchword":"liet de koning","tekst":"Hebreeuws, deed gans Juda horen."},{"catchword":"vrij","tekst":"Hebreeuws, onnozel, onschuldig, zuiver; dat is, niemand mocht enige ontschuldiging voortbrengen om te mogen achterblijven; welverstaande, geen bedaagde manschap, die in dit werk gebruikt kon worden, niet verhinderd zijnde door ziekte, ouderdom, uitlandigheid, of openbare ambten, waarover de gecommitteerden des konings oordelen moesten."},{"catchword":"Geba-benjamins,","tekst":"Een stad in den stam van Benjamin, aan de grenzen van Efraïm op een heuvel gelegen, Jos 18:24, den Levieten toegeëigend, Jos 21:17, is ten tijde des konings Josia de noordpale geweest van het koninkrijk Juda, 2Ki 23:8."},{"catchword":"Mizpa","tekst":"Zie van deze stad Jdg 11:11."}],"23":[{"catchword":"in den tijd","tekst":"Te weten, in de laatste drie jaren zijner regering; gelijk dit af te nemen is uit 2Ch 16:12-13."},{"catchword":"krank","tekst":"In welke krankheid hij de medicijnen meer dan God gezocht heeft; 2Ch 16:12."},{"catchword":"zijn voeten","tekst":"Dewelke men houdt de jicht geweest te zijn."}],"24":[{"catchword":"stad van zijn vader","tekst":"Zie boven, 1Ki 2:10."}],"25":[{"catchword":"twee jaren","tekst":"Versta niet ten volle; gelijk af te nemen is uit vs.28, 33."}],"26":[{"catchword":"wat kwaad was","tekst":"Zie boven, 1Ki 11:6."},{"catchword":"wandelde","tekst":"In zijner vorouderen weg te wandelen, is hen na te volgen, òf in het goede, dat is, in hun geloof en goede werken, 1Sa 8:3; 2Ki 22:2; 2Ch 17:3; òf in het kwade, dat is, in hun ongeloof en zonden, gelijk hier en onder, vs.34, en 1Ki 16:19, en 1Ki 22:53."},{"catchword":"zijn zonde,","tekst":"Versta, de zonde der afgoderij. Zie boven, 1Ki 14:16."}],"27":[{"catchword":"Ahia,","tekst":"Een ander dan Ahia, de profeet van Silo, boven, 1Ki 11:29, en dan Ahia, de schrijver van Salomo, boven, 1Ki 4:2, en dan Ahia de priester, 1Sa 14:3, enz."},{"catchword":"huis van Issaschar,","tekst":"Dat is, van den stam van Issaschar; alzo wordt gezegd het huis Efraïms, Jdg 10:9; het huis van Juda, Hos 1:7; het huis van Levi, Psa 135:20, enz."},{"catchword":"maakte een verbintenis","tekst":"Het Hebreeuwse woord betekent eigenlijk binden, aanbinden. Daarom als het van de gemoederen der mensen gebruikt wordt, zo is het wel somtijds genomen in het goede, voor ene verbintenis der liefde, gelijk Gen 44:30, maar zeer dikwijls voor een verbintenis der vijandschap, waardoor heimelijke samenspanningen tegen personen of staten gemaakt worden, gelijk hier en 1Sa 22:8, en onder, 1Ki 16:9, 1Ki 16:20, en 2Ki 10:9, en 2Ki 12:20; Neh 4:8; Amo 7:10."},{"catchword":"Gibbethon,","tekst":"Een stad, gelegen in den stam van Dan, Jos 19:44, die den Levieten tot woning geëigend was, Jos 21:23, maar van de Filistijnen overheerd en bewoond, en daarom van Nadab alsnu belegerd, doch niet gewonnen; en is de belegering naderhand van de Israëlieten hervat geworden. Zie onder, 1Ki 16:17."}],"29":[{"catchword":"huis van Jeróbeam","tekst":"Dat is, geslacht. Zie boven, 1Ki 14:10."},{"catchword":"liet niets","tekst":"Hebreeuws, hij liet niet over allen adem van Jerobeam; dat is, geen mens liet hij van den huize Jerobeams overblijven. Alzo is het woord adem voor mens genomen, Deu 20:16; Jos 10:40, en Jos 11:14."},{"catchword":"hem verdelgd had,","tekst":"Namelijk Jerobeam, of, totdat hij het verdelgde; te weten, huis, dat is, geslacht Jerobeams."},{"catchword":"het woord des HEEREN,","tekst":"Dit is niet te duiden op het voornemen van Baesa, alsof hij in het verdelgen van Jerobeams huis gezien zou hebben op de voorzegging des Heeren en de zonden Jerobeams; maar de zin is dat God door de wrede tirannie van Baesa het woord zijner voorzegging vervuld en de zonden Jerobeams gestraft heeft. Alzo onder, 1Ki 16:12."}],"30":[{"catchword":"die zondigde,","tekst":"Alzo boven, 1Ki 14:16, zie de aantekeningen."}],"31":[{"catchword":"in het boek","tekst":"Zie boven, 1Ki 14:19."}],"33":[{"catchword":"en regeerde","tekst":"Dit is hier ingevoegd uit de volle manier van spreken, die wij hebben 2Sa 2:10, idem boven, vs.8, 10, 25; onder, 1Ki 16:11, enz., en hier betekent het woord regeren hoelang eens konings regering geduurd heeft. Wanneer het van het begin der regering gebruikt werd, zo zetten wij het over, koning worden."}],"34":[{"catchword":"in de ogen","tekst":"Zie boven, 1Ki 11:6."},{"catchword":"en wandelde","tekst":"Zie boven, vs.26."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Now in the eighteenth year of king Jerobeam the son of Nebat Abiam [otherwise called Abia 2Ch 12:16 and 13.1 &c.] became king over Judah[see 2Ch 13:1.]"}],"2":[{"catchword":null,"tekst":"He reigned three years at Jerusalem [beginning from the eighteenth year of Jerubeams reign verse 1 and ending with the twentieth see below on verse 9] and his mothers names was // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
