udt;","5":"Dan zal Ik de troon van uw koninkrijk over Israël bevestigen in eeuwigheid; zoals Ik gesproken heb over uw vader David, en zei: Er zal u geen man afgesneden worden van de troon van Israël.","6":"*Maar* als u zich helemaal afkeert, u en uw kinderen, van Mij, om Mij niet meer te volgen, en Mijn geboden *en* Mijn inzettingen, die Ik voor uw aangezicht gegeven heb, niet houdt, maar heengaat en andere goden dient, en u voor hen neerbuigt;","7":"Dan zal Ik Israël uitroeien van het land, dat Ik hun gegeven heb, en dit huis, dat Ik voor Mijn Naam geheiligd heb, zal Ik van Mijn aangezicht wegwerpen; en Israël zal tot een spreekwoord en spotrede zijn onder alle volken.","8":"En aangaande dit huis, *dat* verheven zal geweest zijn, ieder die eraan voorbijgaat zal zich ontzetten en fluiten; men zal zeggen: Waarom heeft de HEERE zo gedaan aan dit land en aan dit huis?","9":"En men zal zeggen: Omdat zij de HEERE, hun God, verlaten hebben, Die hun vaderen uit het land Egypte uitgevoerd had, en zich aan andere goden gehouden hebben, en zich voor hen neergebogen, en hen gediend; daarom heeft de HEERE al dit kwaad over hen gebracht.","10":"En het gebeurde aan het einde van twintig jaren, waarin Salomo die twee huizen gebouwd had, het huis van de HEERE en het huis van de koning;","11":"(*Waartoe* Hiram, de koning van Tyrus, Salomo van cederbomen, en van dennenbomen, en van goud, naar al zijn wens voorzien had), dat toen de koning Salomo aan Hiram twintig steden gaf in het land van Galilea.","12":"En Hiram trok uit van Tyrus, om de steden te bezien, die Salomo hem gegeven had, maar ze bevielen hem niet.","13":"Daarom zei hij: Wat zijn dat voor steden, mijn broeder, die u mij gegeven hebt? En hij noemde ze het land Kabul, tot op deze dag.","14":"En Hiram had de koning honderdtwintig talenten goud gezonden.","15":"Dit is nu de reden van het uitschot, dat de koning Salomo liet opkomen, om het huis van de HEERE te bouwen, en zijn huis, en Millo, en de muur van Jeruzalem, alsook Hazor, en Megiddo, en Gezer.","16":"*Want* Farao, de koning van Egypte, was opgekomen, en had Gezer ingenomen, en het met vuur verbrand, en de Kanaänieten, die in de stad woonden, gedood, en had het aan zijn dochter, de vrouw van Salomo, tot een geschenk gegeven.","17":"Zo bouwde Salomo Gezer, en het lage Beth-horon.","18":"En Baälath, en Tamor in de woestijn, in dat land;","19":"En al de schatsteden, die Salomo had, en de wagensteden, en de steden van de ruiters, en wat de begeerte van Salomo begeerde te bouwen, in Jeruzalem, en op de Libanon, en in het hele land van zijn heerschappij.","20":"Aangaande al het volk, dat overgebleven was van de Amorieten, Hethieten, Ferezieten, Hevieten, en Jebusieten, die niet van de kinderen van Israël waren;","21":"Hun kinderen, die na hen in het land overgebleven waren, die de kinderen van Israël niet hadden kunnen verbannen, die heeft Salomo gebracht tot slaafs uitschot, tot op deze dag.","22":"Doch van de kinderen van Israël maakte Salomo geen slaaf; maar zij waren krijgslieden, en zijn knechten, en zijn vorsten, en zijn hoofdlieden, en de aanvoerders van zijn wagens, en van zijn ruiters.","23":"Dezen waren de leiders van de opzichters, die over het werk van Salomo waren, vijfhonderdvijftig, die heerschappij hadden over het volk, dat aan het werk was.","24":"Doch de dochter van Farao trok van de stad van David op naar haar huis, dat hij voor haar gebouwd had; toen bouwde hij Millo.","25":"En Salomo offerde driemaal per jaar brandoffers en dankoffers, op het altaar, dat hij voor de HEERE gebouwd had, en hij brandde reukwerk op dat altaar, dat voor het aangezicht van de HEERE was, toen hij het huis voltooid had.","26":"De koning Salomo maakte ook schepen te Ezeon-geber, dat bij Eloth is, aan de oever van de Schelfzee, in het land van Edom.","27":"En Hiram zond met die schepen zijn knechten, scheepslieden, kenners van de zee, met de knechten van Salomo.","28":"En zij kwamen te Ofir, en haalden daar goud vandaan, vierhonderdtwintig talenten, en brachten het naar de koning Salomo."},"SV":{"1":"Het geschiedde nu, als Salomo voleind had te bouwen het huis des HEEREN en het huis des konings, en al de begeerte van Salomo, die hem gelust had te maken;","2":"Dat de HEERE ten anderen male aan Salomo verscheen, gelijk als Hij hem in Gibeon verschenen was.","3":"En de HEERE zeide tot hem: Ik heb uw gebed en uw smeking gehoord, die gij voor Mijn aangezicht smekende gedaan hebt; Ik heb dat huis geheiligd, hetwelk gij gebouwd hebt, opdat Ik Mijn Naam aldaar tot in eeuwigheid zette; en Mijn ogen en Mijn hart zullen daar zijn te allen dage.","4":"En zo gij voor Mijn aangezicht wandelen zult, gelijk als uw vader David gewandeld heeft, met volkomenheid des harten, en met oprechtheid, om te doen naar al wat Ik u geboden heb, en Mijn inzettingen en Mijn rechten houden zult;","5":"Zo zal Ik den troon uws koninkrijks over Israël bevestigen in eeuwigheid; gelijk als Ik gesproken heb over uw vader David, zeggende: Geen man zal u afgesneden worden van den troon van Israël.","6":"*Maar* zo gijlieden u te enen male afkeren zult, gij en uw kinderen, van Mij na *te* *volgen*, en niet houden zult Mijn geboden *en* Mijn inzettingen, die Ik voor uw aangezicht gegeven heb; maar heengaan, en andere goden dienen, en u voor dezelve nederbuigen zult;","7":"Zo zal Ik Israël uitroeien van het land, dat Ik hun gegeven heb, en dit huis, hetwelk Ik Mijn Naam geheiligd heb, zal Ik van Mijn aangezicht wegwerpen; en Israël zal tot een spreekwoord en spotrede zijn onder alle volken.","8":"En aangaande dit huis, *dat* verheven zal geweest zijn, al wie voor hetzelve zal voorbijgaan, zal zich ontzetten en fluiten; men zal zeggen: Waarom heeft de HEERE alzo gedaan aan dit land en aan dit huis?","9":"En men zal zeggen: Omdat zij den HEERE, hun God, verlaten hebben, Die hun vaderen uit Egypteland uitgevoerd had, en hebben zich aan andere goden gehouden, en zich voor dezelve nedergebogen, en hen gediend; daarom heeft de HEERE al dit kwaad over hen gebracht.","10":"En het geschiedde ten einde van twintig jaren, in dewelke Salomo die twee huizen gebouwd had, het huis des HEEREN en het huis des konings;","11":"(*Waartoe* Hiram, de koning van Tyrus, Salomo van cederbomen, en van dennenbomen, en van goud, naar al zijn lust opgebracht had), dat alstoen de koning Salomo aan Hiram twintig steden gaf in het land van Galilea.","12":"En Hiram toog uit van Tyrus, om de steden te bezien, die Salomo hem gegeven had, maar zij waren niet recht in zijn ogen.","13":"Daarom zeide hij: Wat zijn dat voor steden, mijn broeder, die gij mij gegeven hebt? En hij noemde ze het land Kabul, tot op dezen dag.","14":"En Hiram had den koning gezonden honderd en twintig talenten gouds.","15":"Dit is nu de oorzaak van het uitschot, dat de koning Salomo deed opkomen, om het huis des HEEREN te bouwen, en zijn huis, en Millo, en den muur van Jeruzalem, mitsgaders Hazor, en Megiddo, en Gezer.","16":"*Want* Farao, de koning van Egypte, was opgekomen, en had Gezer ingenomen, en haar met vuur verbrand, en de Kanaänieten, die in de stad woonden, gedood, en had haar aan zijn dochter, de huisvrouw van Salomo, tot een geschenk gegeven.","17":"Alzo bouwde Salomo Gezer, en het lage Beth-horon.","18":"En Baälath, en Tamor in de woestijn, in dat land;","19":"En al de schatsteden, die Salomo had, en de wagensteden, en de steden der ruiteren, en wat de begeerte van Salomo begeerde te bouwen, in Jeruzalem, en op den Libanon, en in het ganse land zijner heerschappij.","20":"Aangaande al het volk, dat overgebleven was van de Amorieten, Hethieten, Ferezieten, Hevieten, en Jebusieten, die niet waren van de kinderen Israëls;","21":"Hun kinderen, die na hen in het land overgebleven waren, die de kinderen Israëls niet hadden kunnen verbannen, die heeft Salomo gebracht op slaafsen uitschot tot op dezen dag.","22":"Doch van de kinderen Israëls maakte Salomo geen slaaf; maar zij waren krijgslieden, en zijn knechten, en zijn vorsten, en zijn hoofdlieden, en de oversten zijner wagenen, en zijner ruiteren.","23":"Dezen waren de oversten der bestelden, die over het werk van Salomo waren, vijfhonderd en vijftig, die heerschappij hadden over het volk, dat in het werk doende was.","24":"Doch de dochter van Farao toog van de stad Davids op tot haar huis, hetwelk hij voor haar gebouwd had; toen bouwde hij Millo.","25":"En Salomo offerde driemaal des jaars brandofferen en dankofferen, op het altaar, dat hij den HEERE gebouwd had, en rookte op dat, hetwelk voor het aangezicht des HEEREN was, als hij het huis volmaakt had.","26":"De koning Salomo maakte ook schepen te Ezeon-geber, dat bij Eloth is, aan den oever der Schelfzee, in het land van Edom.","27":"En Hiram zond met die schepen zijn knechten, scheepslieden, kenners van de zee, met de knechten van Salomo.","28":"En zij kwamen te Ofir, en haalden van daar aan goud, vierhonderd en twintig talenten, en brachten het tot den koning Salomo."},"KJV":{"1":"And it came to pass, when Solomon had finished the building of the house of the LORD, and the king's house, and all Solomon's desire which he was pleased to do,","2":"That the LORD appeared to Solomon the second time, as he had appeared unto him at Gibeon.","3":"And the LORD said unto him, I have heard thy prayer and thy supplication, that thou hast made before me: I have hallowed this house, which thou hast built, to put my name there for ever; and mine eyes and mine heart shall be there perpetually.","4":"And if thou wilt walk before me, as David thy father walked, in integrity of heart, and in uprightness, to do according to all that I have commanded thee, and wilt keep my statutes and my judgments:","5":"Then I will establish the throne of thy kingdom upon Israel for ever, as I promised to David thy father, saying, There shall not fail thee a man upon the throne of Israel.","6":"But if ye shall at all turn from following me, ye or your children, and will not keep my commandments and my statutes which I have set before you, but go and serve other gods, and worship them:","7":"Then will I cut off Israel out of the land which I have given them; and this house, which I have hallowed for my name, will I cast out of my sight; and Israel shall be a proverb and a byword among all people:","8":"And at this house, which is high, every one that passeth by it shall be astonished, and shall hiss; and they shall say, Why hath the LORD done thus unto this land, and to this house?","9":"And they shall answer, Because they forsook the LORD their God, who brought forth their fathers out of the land of Egypt, and have taken hold upon other gods, and have worshipped them, and served them: therefore hath the LORD brought upon them all this evil.","10":"And it came to pass at the end of twenty years, when Solomon had built the two houses, the house of the LORD, and the king's house,","11":"(Now Hiram the king of Tyre had furnished Solomon with cedar trees and fir trees, and with gold, according to all his desire,) that then king Solomon gave Hiram twenty cities in the land of Galilee.","12":"And Hiram came out from Tyre to see the cities which Solomon had given him; and they pleased him not.","13":"And he said, What cities are these which thou hast given me, my brother? And he called them the land of Cabul unto this day.","14":"And Hiram sent to the king sixscore talents of gold.","15":"And this is the reason of the levy which king Solomon raised; for to build the house of the LORD, and his own house, and Millo, and the wall of Jerusalem, and Hazor, and Megiddo, and Gezer.","16":"For Pharaoh king of Egypt had gone up, and taken Gezer, and burnt it with fire, and slain the Canaanites that dwelt in the city, and given it for a present unto his daughter, Solomon's wife.","17":"And Solomon built Gezer, and Bethhoron the nether,","18":"And Baalath, and Tadmor in the wilderness, in the land,","19":"And all the cities of store that Solomon had, and cities for his chariots, and cities for his horsemen, and that which Solomon desired to build in Jerusalem, and in Lebanon, and in all the land of his dominion.","20":"And all the people that were left of the Amorites, Hittites, Perizzites, Hivites, and Jebusites, which were not of the children of Israel,","21":"Their children that were left after them in the land, whom the children of Israel also were not able utterly to destroy, upon those did Solomon levy a tribute of bondservice unto this day.","22":"But of the children of Israel did Solomon make no bondmen: but they were men of war, and his servants, and his princes, and his captains, and rulers of his chariots, and his horsemen.","23":"These were the chief of the officers that were over Solomon's work, five hundred and fifty, which bare rule over the people that wrought in the work.","24":"But Pharaoh's daughter came up out of the city of David unto her house which Solomon had built for her: then did he build Millo.","25":"And three times in a year did Solomon offer burnt offerings and peace offerings upon the altar which he built unto the LORD, and he burnt incense upon the altar that was before the LORD. So he finished the house.","26":"And king Solomon made a navy of ships in Eziongeber, which is beside Eloth, on the shore of the Red sea, in the land of Edom.","27":"And Hiram sent in the navy his servants, shipmen that had knowledge of the sea, with the servants of Solomon.","28":"And they came to Ophir, and fetched from thence gold, four hundred and twenty talents, and brought it to king Solomon."}},"tsk":{"1":[{"kopje":"het gebeurde","refs":["1 Kon 6:37","1 Kon 6:38","1 Kon 7:1","1 Kon 7:51","2 Kron 7:11-22"]},{"kopje":"het huis","refs":["2 Kron 8:1-6","Pred 2:4"]},{"kopje":"al de begeerte van Salomo","refs":["1 Kon 9:11","1 Kon 9:19","Pred 2:10","Pred 6:9"]}],"2":[{"kopje":"zoals Hij","refs":["1 Kon 3:5","1 Kon 11:9","2 Kron 1:7-12","2 Kron 7:12"]}],"3":[{"kopje":"gehoord","refs":["2 Kon 20:5","Ps 10:17","Ps 66:19","Ps 116:1","Dan 9:23","Joh 11:42","Hand 10:31","1 Joh 5:14"]},{ ">Solomon</span> had <span class=\"wl wl-kjv\" data-code=\"H3615\">finished</span> the <span class=\"wl wl-kjv\" data-code=\"H1129\">building</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and all <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon's</span> <span class=\"wl wl-kjv\" data-code=\"H2837\">desire</span> which he was <span class=\"wl wl-kjv\" data-code=\"H2654\">pleased</span> to <span class=\"wl wl-kjv\" data-code=\"H6213\">do,</span>","2":"That the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">appeared</span> to <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> the second <span class=\"wl wl-kjv\" data-code=\"H8145\">time,</span> as he had <span class=\"wl wl-kjv\" data-code=\"H7200\">appeared</span> unto him at <span class=\"wl wl-kjv\" data-code=\"H1391\">Gibeon.</span>","3":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, I have <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> thy <span class=\"wl wl-kjv\" data-code=\"H8605\">prayer</span> and thy <span class=\"wl wl-kjv\" data-code=\"H8467\">supplication,</span> that thou hast <span class=\"wl wl-kjv\" data-code=\"H2603\">made</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> me: I have <span class=\"wl wl-kjv\" data-code=\"H6942\">hallowed</span> this <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> which thou hast <span class=\"wl wl-kjv\" data-code=\"H1129\">built,</span> to <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> my <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> there <span class=\"wl wl-kjv\" data-code=\"H5704\">for</span> <span class=\"wl wl-kjv\" data-code=\"H5769\">ever;</span> and mine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> and mine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> shall be there <span class=\"wl wl-kjv\" data-code=\"H3117\">perpetually.</span>","4":"And if thou wilt <span class=\"wl wl-kjv\" data-code=\"H3212\">walk</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> me, as <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> thy <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">walked,</span> in <span class=\"wl wl-kjv\" data-code=\"H8537\">integrity</span> of <span class=\"wl wl-kjv\" data-code=\"H3824\">heart,</span> and in <span class=\"wl wl-kjv\" data-code=\"H3476\">uprightness,</span> to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> according to all that I have <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> thee, and wilt <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> my <span class=\"wl wl-kjv\" data-code=\"H2706\">statutes</span> and my <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments:</span>","5":"Then I will <span class=\"wl wl-kjv\" data-code=\"H6965\">establish</span> the <span class=\"wl wl-kjv\" data-code=\"H3678\">throne</span> of thy <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdom</span> upon <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever,</span> as I <span class=\"wl wl-kjv\" data-code=\"H1696\">promised</span> to <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> thy <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> There shall not <span class=\"wl wl-kjv\" data-code=\"H3772\">fail</span> thee a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> upon the <span class=\"wl wl-kjv\" data-code=\"H3678\">throne</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","6":"But if ye shall at <span class=\"wl wl-kjv\" data-code=\"H7725\">all</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">turn</span> from <span class=\"wl wl-kjv\" data-code=\"H310\">following</span> me, ye or your <span class=\"wl wl-kjv\" data-code=\"H1121\">children,</span> and will not <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> my <span class=\"wl wl-kjv\" data-code=\"H4687\">commandments</span> and my <span class=\"wl wl-kjv\" data-code=\"H2708\">statutes</span> which I have <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> you, but <span class=\"wl wl-kjv\" data-code=\"H1980\">go</span> and <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> <span class=\"wl wl-kjv\" data-code=\"H430\">gods,</span> and <span class=\"wl wl-kjv\" data-code=\"H7812\">worship</span> them:","7":"Then will I cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H127\">land</span> which I have <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> them; and this <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> which I have <span class=\"wl wl-kjv\" data-code=\"H6942\">hallowed</span> for my <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> will I cast <span class=\"wl wl-kjv\" data-code=\"H7971\">out</span> of my <span class=\"wl wl-kjv\" data-code=\"H6440\">sight;</span> and <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> shall be a <span class=\"wl wl-kjv\" data-code=\"H4912\">proverb</span> and a <span class=\"wl wl-kjv\" data-code=\"H8148\">byword</span> among all <span class=\"wl wl-kjv\" data-code=\"H5971\">people:</span>","8":"And at this <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> which is <span class=\"wl wl-kjv\" data-code=\"H5945\">high,</span> every one that <span class=\"wl wl-kjv\" data-code=\"H5674\">passeth</span> by it shall be <span class=\"wl wl-kjv\" data-code=\"H8074\">astonished,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H8319\">hiss;</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Why hath the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> thus unto this <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and to this <span class=\"wl wl-kjv\" data-code=\"H1004\">house?</span>","9":"And they shall <span class=\"wl wl-kjv\" data-code=\"H559\">answer,</span> Because they <span class=\"wl wl-kjv\" data-code=\"H5800\">forsook</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> their <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> who brought <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> their <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and have taken <span class=\"wl wl-kjv\" data-code=\"H2388\">hold</span> upon <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> <span class=\"wl wl-kjv\" data-code=\"H430\">gods,</span> and have <span class=\"wl wl-kjv\" data-code=\"H7812\">worshipped</span> them, and <span class=\"wl wl-kjv\" data-code=\"H5647\">served</span> them: therefore hath the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> upon them all this <span class=\"wl wl-kjv\" data-code=\"H7451\">evil.</span>","10":"And it came to pass at the <span class=\"wl wl-kjv\" data-code=\"H7097\">end</span> of <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years,</span> when <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> had <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">houses,</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span>","11":"(Now <span class=\"wl wl-kjv\" data-code=\"H2438\">Hiram</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H6865\">Tyre</span> had <span class=\"wl wl-kjv\" data-code=\"H5375\">furnished</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> with <span class=\"wl wl-kjv\" data-code=\"H730\">cedar</span> <span class=\"wl wl-kjv\" data-code=\"H6086\">trees</span> and <span class=\"wl wl-kjv\" data-code=\"H1265\">fir</span> <span class=\"wl wl-kjv\" data-code=\"H6086\">trees,</span> and with <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> according to all his <span class=\"wl wl-kjv\" data-code=\"H2656\">desire,)</span> that <span class=\"wl wl-kjv\" data-code=\"H227\">then</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> <span class=\"wl wl-kjv\" data-code=\"H2438\">Hiram</span> <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H1551\">Galilee.</span>","12":"And <span class=\"wl wl-kjv\" data-code=\"H2438\">Hiram</span> came <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> from <span class=\"wl wl-kjv\" data-code=\"H6865\">Tyre</span> to <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> which <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> had <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> him; and they <span class=\"wl wl-kjv\" data-code=\"H3474\">pleased</span> him not.","13":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> What <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> are these which thou hast <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> me, my <span class=\"wl wl-kjv\" data-code=\"H251\">brother?</span> And he <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> them the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3521\">Cabul</span> unto this <span class=\"wl wl-kjv\" data-code=\"H3117\">day.</span>","14":"And <span class=\"wl wl-kjv\" data-code=\"H2438\">Hiram</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">sixscore</span> <span class=\"wl wl-kjv\" data-code=\"H3603\">talents</span> of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold.</span>","15":"And this is the <span class=\"wl wl-kjv\" data-code=\"H1697\">reason</span> of the <span class=\"wl wl-kjv\" data-code=\"H4522\">levy</span> which <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H5927\">raised;</span> for to <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and his own <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and <span class=\"wl wl-kjv\" data-code=\"H4407\">Millo,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2346\">wall</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> and <span class=\"wl wl-kjv\" data-code=\"H2674\">Hazor,</span> and <span class=\"wl wl-kjv\" data-code=\"H4023\">Megiddo,</span> and <span class=\"wl wl-kjv\" data-code=\"H1507\">Gezer.</span>","16":"For <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> had gone <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> and <span class=\"wl wl-kjv\" data-code=\"H3920\">taken</span> <span class=\"wl wl-kjv\" data-code=\"H1507\">Gezer,</span> and <span class=\"wl wl-kjv\" data-code=\"H8313\">burnt</span> it with <span class=\"wl wl-kjv\" data-code=\"H784\">fire,</span> and <span class=\"wl wl-kjv\" data-code=\"H2026\">slain</span> the <span class=\"wl wl-kjv\" data-code=\"H3669\">Canaanites</span> that <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> it for a <span class=\"wl wl-kjv\" data-code=\"H7964\">present</span> unto his <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter,</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon's</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wife.</span>","17":"And <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> <span class=\"wl wl-kjv\" data-code=\"H1507\">Gezer,</span> and <span class=\"wl wl-kjv\" data-code=\"H1032\">Bethhoron</span> the <span class=\"wl wl-kjv\" data-code=\"H8481\">nether,</span>","18":"And <span class=\"wl wl-kjv\" data-code=\"H1191\">Baalath,</span> and <span class=\"wl wl-kjv\" data-code=\"H8412\">Tadmor</span> in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness,</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span>","19":"And all the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of <span class=\"wl wl-kjv\" data-code=\"H4543\">store</span> that <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> had, and <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> for his <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots,</span> and <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> for his <span class=\"wl wl-kjv\" data-code=\"H6571\">horsemen,</span> and <span class=\"wl wl-kjv\" data-code=\"H2837\">that</span> which <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H2836\">desired</span> to <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> and in <span class=\"wl wl-kjv\" data-code=\"H3844\">Lebanon,</span> and in all the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of his <span class=\"wl wl-kjv\" data-code=\"H4475\">dominion.</span>","20":"And all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that were <span class=\"wl wl-kjv\" data-code=\"H3498\">left</span> of the <span class=\"wl wl-kjv\" data-code=\"H567\">Amorites,</span> <span class=\"wl wl-kjv\" data-code=\"H2850\">Hittites,</span> <span class=\"wl wl-kjv\" data-code=\"H6522\">Perizzites,</span> <span class=\"wl wl-kjv\" data-code=\"H2340\">Hivites,</span> and <span class=\"wl wl-kjv\" data-code=\"H2983\">Jebusites,</span> which were not of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span>","21":"Their <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> that were <span class=\"wl wl-kjv\" data-code=\"H3498\">left</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> them in the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> whom the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> also were not <span class=\"wl wl-kjv\" data-code=\"H3201\">able</span> utterly to <span class=\"wl wl-kjv\" data-code=\"H2763\">destroy,</span> upon those did <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H5927\">levy</span> a <span class=\"wl wl-kjv\" data-code=\"H4522\">tribute</span> of <span class=\"wl wl-kjv\" data-code=\"H5647\">bondservice</span> unto this <span class=\"wl wl-kjv\" data-code=\"H3117\">day.</span>","22":"But of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> did <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">make</span> no <span class=\"wl wl-kjv\" data-code=\"H5650\">bondmen:</span> but they were <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H4421\">war,</span> and his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> and his <span class=\"wl wl-kjv\" data-code=\"H8269\">princes,</span> and his <span class=\"wl wl-kjv\" data-code=\"H7991\">captains,</span> and <span class=\"wl wl-kjv\" data-code=\"H8269\">rulers</span> of his <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots,</span> and his <span class=\"wl wl-kjv\" data-code=\"H6571\">horsemen.</span>","23":"These were the <span class=\"wl wl-kjv\" data-code=\"H8269\">chief</span> of the <span class=\"wl wl-kjv\" data-code=\"H5324\">officers</span> that were over <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon's</span> <span class=\"wl wl-kjv\" data-code=\"H4399\">work,</span> <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> and <span class=\"wl wl-kjv\" data-code=\"H2572\">fifty,</span> which bare <span class=\"wl wl-kjv\" data-code=\"H7287\">rule</span> over the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that <span class=\"wl wl-kjv\" data-code=\"H6213\">wrought</span> in the <span class=\"wl wl-kjv\" data-code=\"H4399\">work.</span>","24":"But <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh's</span> <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> came <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> out of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> unto her <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> which Solomon had <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> for her: then did he <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> <span class=\"wl wl-kjv\" data-code=\"H4407\">Millo.</span>","25":"And <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H6471\">times</span> in a <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> did <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H5927\">offer</span> burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offerings</span> and peace <span class=\"wl wl-kjv\" data-code=\"H8002\">offerings</span> upon the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> which he <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and he burnt <span class=\"wl wl-kjv\" data-code=\"H6999\">incense</span> upon the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> that was <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span> So he <span class=\"wl wl-kjv\" data-code=\"H7999\">finished</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house.</span>","26":"And <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> a navy of <span class=\"wl wl-kjv\" data-code=\"H590\">ships</span> in <span class=\"wl wl-kjv\" data-code=\"H6100\">Eziongeber,</span> which is beside <span class=\"wl wl-kjv\" data-code=\"H359\">Eloth,</span> on the <span class=\"wl wl-kjv\" data-code=\"H8193\">shore</span> of the <span class=\"wl wl-kjv\" data-code=\"H5488\">Red</span> <span class=\"wl wl-kjv\" data-code=\"H3220\">sea,</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H123\">Edom.</span>","27":"And <span class=\"wl wl-kjv\" data-code=\"H2438\">Hiram</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> in the <span class=\"wl wl-kjv\" data-code=\"H590\">navy</span> his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> <span class=\"wl wl-kjv\" data-code=\"H582\">shipmen</span> that had <span class=\"wl wl-kjv\" data-code=\"H3045\">knowledge</span> of the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea,</span> with the <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> of <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon.</span>","28":"And they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H211\">Ophir,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">fetched</span> from thence <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> and <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H3603\">talents,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> it to <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"al de begeerten","tekst":"Dat is, al zijn begeerte."},{"catchword":"hem gelust had","tekst":"Dat is, al wat Salomo in het hart gekomen was om te maken, gelijk verklaard wordt 2Ch 7:11."}],"2":[{"catchword":"ten anderen male","tekst":"Te weten, na de bouwing en inwijding des tempels, maar niet na de bouwing van het koninklijke huis, welke dertien jaren daarna volbracht is. Eenigen verstaan dat deze verschijning geschied is nadat beide huizen voltrokken waren."}],"3":[{"catchword":"geheiligd,","tekst":"Dat is, tot een heilig gebruik afgezonderd; alzo Gen 2:3."},{"catchword":"opdat Ik Mijn Naam","tekst":"Zie boven, 1Ki 8:29."},{"catchword":"in eeuwigheid zette;","tekst":"Zie boven, 1Ki 8:13."},{"catchword":"Mijn ogen en Mijn hart","tekst":"Versta door de ogen des Heeren zijn voorzienigheid in het bewaren van den tempel en in het voorstaan van den godsdienst, die daarin plaats moest hebben, welverstaande naar de conditie die hierbij gevoegd wordt; en versta door zijn hart, zijn genade en liefde tegen degenen, die hem in dit huis oprechtelijk dienen zouden."}],"4":[{"catchword":"voor Mijn aangezicht","tekst":"Zie Gen 17:1, en boven, 1Ki 8:23."},{"catchword":"volkomenheid des harten,","tekst":"Dat is, ongeveinsdheid, onvalsheid, eenvoudigheid. Zie Gen 6:9."}],"5":[{"catchword":"Geen man","tekst":"Zie boven, 1Ki 2:4."}],"6":[{"catchword":"te enen male","tekst":"Hebreeuws, afkerende afkeren zult."},{"catchword":"van Mij","tekst":"Hebreeuws, van achter mij; namelijk, te komen, of te volgen, dat is, van Mij, naar mijn woord te horen, te geloven, te vrezen en te dienen. Alzo 1Sa 12:20; 2Ki 18:6. Vergelijk 2Sa 2:21."}],"7":[{"catchword":"van Mijn aangezicht","tekst":"Dat is, uit mijn ogen en uit mijn hart. Zie boven, vs.3."}],"8":[{"catchword":"dat","tekst":"Dit woord is hier ingevoegd uit 2Ch 7:21."},{"catchword":"verheven","tekst":"Te weten, door de verkondiging van mijn leer en mijn werken."},{"catchword":"fluiten;","tekst":"Als over degenen, die men bespottelijk wil smaden. Zie ook zulke manier van spreken Jer 19:8, en Jer 49:17, en Jer 50:13. Somtijds wordt bij dit woord ook gevoegd het schudden des hoofds, het kloppen en bewegen der handen, welke alle uiterlijke tekenen en gebaren zijn van smadelijke bespotting. Zie Lam 2:15; Zep 2:15."}],"9":[{"catchword":"verlaten hebben,","tekst":"Te weten, door een trouweloze snoodheid, over welke zich de heidenen zelf schamen, die hun gewaande goden niet veranderen willen; Jer 2:10-11."}],"10":[{"catchword":"het huis des HEEREN","tekst":"Te weten, het huis des Heeren in zeven jaren, boven, 1Ki 6:38; en de andere huizen in dertien jaren, boven, 1Ki 7:1."}],"11":[{"catchword":"twintig steden","tekst":"Dewelke waren gelegen in de noordpale des lands Kanaän, omtrent de Syriërs en Sidoniërs, en grenzende aan den stam van Aser, doch [zo enigen menen] daaronder niet behorende; omdat anders Salomo die niet had mogen weggeven. Anderen houden dat bij hem het gebruik alleen, en niet den eigendom derzelve gegeven heeft."},{"catchword":"Galiléa","tekst":"Hetwelk westwaarts aan het landschap van Tyrus paalde. Want Galilea is een land, hebbende tegen het oosten de Jordaan, tegen het zuiden het land van Samaria, tegen het noorden het gebergte Libanon, tegen het westen Fenicië, waarin Tyrus gelegen is. Galilea wordt verdeeld in opper- en onder-Galilea. Van het opper-Gallilea, toegenaamd het Galilea der heidenen, wordt hier gesproken en Mat 4:15."}],"12":[{"catchword":"waren niet recht","tekst":"Dat is, zij behaagden hem niet. Alzo Jdg 14:3; 1Ch 13:4; uit welke oorzaak Hiram dezelve den koning Salomo wedergegeven heeft, gelijk men afnemen kan uit 2Ch 8:2, want aldaar moet het woord geven voor wedergeven verstaan worden."}],"13":[{"catchword":"Kabul,","tekst":"Te weten, omdat het hem mishaagde; want dit woord in Fenicië, waaronder Tyrus behoorde, betekende zulks, gelijk enigen melden. Anderen vertalen dit woord slijkig, zandig, of moerassig."}],"14":[{"catchword":"twintig talenten gouds","tekst":"Versta dit van gemene talenten; en zie van dezer waarde Exo 25:39."}],"15":[{"catchword":"uitschot,","tekst":"Zie hiervan boven, 1Ki 5:13. De zin is: Dewijl Salomo zulk een voorraad van geld en ander gereedschap tot den bouw des tempels had, zo heeft hij zeker uitschot van mannen opgenomen, die in dit werk zouden bezig zijn, om het met allen vlijt te bevorderen, totdat het volmaakt zou worden."},{"catchword":"Millo,","tekst":"Men meent dat dit enig groot bolwerk is geweest, omtrent het paleis des konings, waar het volk, eerst inkomende, ontvangen werd; dienende tot een vertrek of wachthuis voor de koninklijke wacht. Zie hiervan 2Sa 5:9; 1Ki 11:27."},{"catchword":"Hazor,","tekst":"Een stad, gelegen in den stam van Nafthali, aan de Jordaan. Zie Jos 11:10, en Jos 19:36."},{"catchword":"Megiddo,","tekst":"Gelegen in de halven stam van Manasse op de zijde van de Jordaan. Zie Jos 12:21, en Jos 17:11; Jdg 1:27."},{"catchword":"Gezer","tekst":"Gelegen in den stam van Efraïm. Zie Jos 10:33."}],"17":[{"catchword":"lage Beth-hóron","tekst":"Gelegen in de stam van Benjamin. Voeg hierbij, uit 2Ch 8:5, het opper Beth-horon, gelegen in den stam van Efraïm; Jos 21:22."}],"18":[{"catchword":"Baälath,","tekst":"Gelegen in den stam van Dan; Jos 19:44."},{"catchword":"Tamor","tekst":"Of, Tadmor. Sommigen houden deze plaats voor een stad, gelegen in de woestijn van Juda, niet ver van Engedi; anderen voor de stad Palmyra, gelegen in de woestijn van Syrië."},{"catchword":"dat land;","tekst":"Dat is, in het land van Israël."}],"19":[{"catchword":"schatsteden,","tekst":"In welken allen voorraad, tuig en gereedschap ten oorlog, of ook van lijftocht weggelegd wordt; anders genoemd ammunitie- en proviandhuizen. Vergelijk Exo 1:11."},{"catchword":"de wagensteden,","tekst":"Alwaar de oorlogswagens, die men toen in den krijg gebruikte, bewaard werden."},{"catchword":"in Jeruzalem,","tekst":"Zie boven, 1Ki 7:2, en 2Ch 8:6."}],"21":[{"catchword":"verbannen,","tekst":"Zie Deu 2:34."},{"catchword":"op slaafsen uitschot","tekst":"Dat is, hij schatte hem als lijfeigenen. Zij woonden onder de Israëlieten, en worden genaamd de slaven, of knechten van Salomo, Ezr 2:55; Neh 7:57, omdat Salomo de ordinantie aangaande deze slaven gemaakt had. Deze hebben zich eerst moeten begeven tot de ware religie, anders zou Salomo hun deze weldaad niet hebben mogen doen, Deu 7:2. Van het woord uitschot, zie ook boven, 1Ki 5:13."}],"23":[{"catchword":"vijfhonderd","tekst":"2Ch 8:10 staat van twee honderd vijftig, maar versta dat deze in alles zijn geweest vijfhonderd, gelijk hier staat, maar dat zij, bij beurte het opzicht nemende, telkens waren twee honderd vijftig."},{"catchword":"vijftig,","tekst":"Die bij beurten bedienden het ambt van tien mannen, om de anderen tot het werk aan te drijven. Zie 1Ki 5:16, en de aantekening."}],"24":[{"catchword":"stad Davids","tekst":"Zie boven, 1Ki 8:1."},{"catchword":"hij voor haar","tekst":"Namelijk, Salomo."},{"catchword":"Millo","tekst":"Zie boven, vs.15."}],"25":[{"catchword":"driemaal des jaars","tekst":"Te weten, op het paas-, pinkster- en loofhuttenfeest; 2Ch 8:13."},{"catchword":"het aangezicht des HEEREN","tekst":"Dat is, in het heilige, recht voor het allerheiligste, waarin de ark was een teken van Gods tegenwoordigheid."}],"26":[{"catchword":"Ezéon-geber,","tekst":"Dit is de twee en dertigste legerplaats der Israëlieten geweest, Num 33:35. Zij was een stad met een haven, liggende aan de Schelfzee of Rode zee."},{"catchword":"Eloth is,","tekst":"Anders, Elath genaamd, 2Ki 14:22, een stad, gelegen in het land Edom aan den oever der Schelfzee. Zie Deu 2:8. Deze stad heeft Azaria, anders Uzzia genaamd, de koning van Juda, gewonnen en aan Juda wedergebracht, en dezelve herbouwd, 2Ki 14:22, maar onder Achaz, den koning van Juda, heeft haar Rezin, de koning van Syrië, den Joden weder afgenomen, 2Ki 16:6."}],"27":[{"catchword":"scheepslieden,","tekst":"Hebreeuws, mannen der schepen; dat is, die zich met de scheepvaart bezighouden."}],"28":[{"catchword":"Ofir,","tekst":"Men houdt dit voor een eiland in Oost-Indië, en wordt van Jozefus, Lib.8, Antiq. cap.2, Aurea Chersonesus genaamd, dat wij nu Malakka noemen. Sommigen willen dat dit Peru is geweest in West-Indië."},{"catchword":"vierhonderd en twintig","tekst":"Vergelijk dit met 2Ch 8:18, met de aantekeningen."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Now it came to pass, when Salomon had made an end of building the house of the LORD, and the house of the King: [See 2 Chron.7.11.] and all the desire of Salomon, [i.e. all his desire] which he had a mind to make, [i.e. all that came into Salomons heart to make, as is explained 2 Chron.7.11.]"}],"2":[{"catchword":null,"tekst":"That the LORD appeareth to Salomon the second time, [viz. After the building, and dedication of the Temple, but not after the building of the Kings house, which was finished thirteen years after the Temple was built. Some conceive that this appearance happened after that both houses were finished] according as he had appeared unto him in Gibeon. [see above chap.3.5.]"}],"3":[{"catchword":null,"tekst":"And the LORD said unto him; I have heard thy prayer, and thy supplication, which thou hast made supplicating before my face; I have hallowed that house; [i.e. separated it to any holy use: so Gen.2.on v.3.] which thou hast built, to set my Name there, [see above Chap.8.on ver.13.] and mine eyes, and mine heart shall be there [understand by the eyes of the LORD, his providence in keeping and preserving the Temple, and in protecting, and maintaining the Worship of God, which was to be performed there, understanding withal, according to the condition that is here annexed. And understand by his heart, his mercy, and love toward those that should serve him upright in this house] at all days."}],"4":[{"catchword":null,"tekst":"And if thou shalt walk before my face, [See Gen.17.on ver.1. and above chap.8.23.] according as David thy Father walked with perfectness [i.e. unfeignedness, truth, simplicity; see Gen.6.on v.9.] of heart, and with uprightness, to do according to all that I have commanded thee, (and) shalt keep my statutes, and my judgements."}],"5":[{"catchword":null,"tekst":"Then I will establish the throne of thy Kingdom over Israel for ever: according as I spake concerning David thy father, [See 2 Sam.7.12,16. above chap.6.12. 1 Chron.2.10. Psal.132.12.] saying; (There) shall not a man be cut off unto thee from the throne of Israel. [see above chap.2.on v.4.]"}],"6":[{"catchword":null,"tekst":"But if ye shall wholly turn away, [Heb. Turning away, shall turn away] ye, and your children, from (following) after me, [Heb. from after me, namely, coming, or following, that is, from hearing, believing, fearing, and serving me according to my Word. So 1 Sam.12.20. 2 King.18.6. Compare 2 Sam.2.21.] and shall not keep my Commandements, (and) my statutes, which I have given before your face: but shall go and serve other gods, and bow your selves down before them:"}],"7":[{"catchword":null,"tekst":"Then will I destroy Israel out of the Land which I have given them, and this house, which I have hallowed unto my Name, [See Jer 7:15.] will I cast away from my face: [i.e. out of my sight, and out of mine heart: see above on v.3.] and Israel shall be a Proverb, and a By-word among all Nations. [see Deuteromony 28.37.]"}],"8":[{"catchword":null,"tekst":"And concerning this house, (which) [This word here inserted out of 2 Chron.7.21.] shall have been exalted, [namely by the declaration of my word and works] whosoever shall pas by it, shall be astonished, and whistle: [as at those, whom they scorn and deride. See also such kind of phrase, Jer 19:8. & 49.17. & 50. 13. Sometimes unto this word is also added the nodding of the head, the clapping, and moving of the hands, which are all outward tokens and gestures of scornful division. See Lament.2 15. Zephan.2.15.] they shall say, Why hath the LORD done thus unto this Land, and to this house? [see Deu 20:24. Jer 22:8.]"}],"9":[{"catchword":null,"tekst":"And they shall say, Because they forsook the LORD their God, [viz. By a faithless wretchedness, at which the very Heathens themselves did blush, that would not part with their seigned Gods, Jer 2:10,11.] who had brought forth their Fathers out of the Land of Egypt, and have taken hold upon other Gods, and bowed themselves down before them, and served them: therefore the LORD hath brought upon them all this evil."}],"10":[{"catchword":null,"tekst":"And it came to pass at the end of twenty years, in which Salomon had built those two houses; the houses of the LORD and the Kings house; [viz. the house of the Lord in seven years, above chap.6. v.38. and the other houses in thirteen years, above chap.7.v.1.]"}],"11":[{"catchword":null,"tekst":"(Whereunto) Hiram the King of Tyre, had furnished Salomon with Cedar-trees, and with Fir-trees, and with gold, according to all his desire) that then King Solomon gave unto Hiram twenty cities [Which lay in the North-border of the Land of Canaan, about the Syrians and Sidonians, and bordering upon the tribe of Aser, but (as some conceive) not belonging unto that tribe: because otherwise Salomon might not have given them away. Others are of opinion, that he gave him only the use, and not the propriety thereof] in the land of Galilee. [which bordered West-ward upon the Country of Tyre. For Galilee is a land, Having East-ward the Jordan, South-ward the land of Samaria, North-ward the land of Libanon, West-ward Phaenicia, wherein Tyre lay. Galilee is divided into the upper and lower Galilee. Of the upper Galilee sirnamed the Galilee of the Gentiles is here spoken, ands Mat 4:15.]"}],"12":[{"catchword":null,"tekst":"And Hiram came out from Tyre, to see the cities, which Salomon had given him; but they were not right in his eyes. [i.e. they pleased him not. So judg.14.3.1. 1 Chron.13.4. for which cause Hiram gave them to King Solomon again, as may be gathered out of 2 Chron.8.2. for there the word give must be taken for giving again.]"}],"13":[{"catchword":null,"tekst":"Therefore he said; What Cities are those, my brother, which thou hast given me? and he called them the Land of Cabal, [viz. Because it misliked him, for this word signifieth so in Phaenicia (unto which Tyrus belonged) as some hold. Others interpret this word, mirie, sandy, or, Moorish] unto this day."}],"14":[{"catchword":null,"tekst":"And Hiram had sent the King an hundred and twenty talents of gold. [Understand this of common talents, and see the value hereof, Exod.25.on v.39.]"}],"15":[{"catchword":null,"tekst":"Now this is the cause of the Leavie, [See hereof above chap.5.on v.13.] which King Salomon raised to build the house of the LORD, [the meaning is, for asmuch as Salomon had such a stock of money, and other furniture for the building of the Temple, he caused a certain Leavy of men, that were to be employed in this work, to further the same with all speed and diligence, until it should be finished] and his (own) house, and mills, [it&acirc;&euro;&trade;s thought that this was some great Fort or Bulwark, about the Kings Palace, where the people at their first entering in were received; serving for a place of retreat, or Watch house for the Kings Guard. See hereof, 2 Sam.5 9. & 1 King.11.27.] and the Wall of Jerusalem; as also Hazor, [a city lying in the tribe of Naphtali, at the Jordan: see Jos.11.10. & 19.36.] and Megiddo, [lying in the tribe of Manasseh, on the side of the Jordan. See Jos.12.17. & 17.15. Judg.1.27.] and Gezer. [lying in the tribe of Ephraim: see Jos.10.33.]"}],"16":[{"catchword":null,"tekst":"For Pharao the King of Egypt was come up, and had taken Gezer, and burnt the same with fire, and slain the Canaanites that dwelt in the city, and had given it for a Present unto his daughter, Salomons wife."}],"17":[{"catchword":null,"tekst":"So Salomon built Gezer, and the nether Beth-Horon: [Lying in the tribe of Benjamin. Add hereunto out of 2 Chron.8.17. the upper Beth-Horon, lying in the tribe of Ephraim.Jos.21.22.]"}],"18":[{"catchword":null,"tekst":"And Baalath [Lying in the tribe of Dan, Jos.19.44.] and Tamor, [or. Tadmor] in the wilderness, in that Land: [i.e. in the Land of Israel. Some hold this place to be a city lying in the Wilderness of Juda, not far from Engedi: Others to be the city of Palmyra, lying in the Wilderness of Syria.]"}],"19":[{"catchword":null,"tekst":"And all the cities of store, [In which all manner of stone, provision, and furniture for war, and likewise of victual, was stored and laid up: otherwise called Magazines, or, houses of ammunition and provision. Compare Exod.11.] which Salomon had, and the charet-cities, [where the arms that were used in war were kept] and the cities of the horsemen; and what the desire of Salomon desired to build, in Jerusalem, and in Libanon, [see above chap.7.on ver.2. &2 Chron.8.6.] and in all the Land of his Dominion."}],"20":[{"catchword":null,"tekst":"Concerning all the people that were left of the Amorites, Hethites, Perezites, Hivites, and Jebusites, which were not of the children of Israel."}],"21":[{"catchword":null,"tekst":"Their Children that were left after them in the Land, which the children of Israel were not able to ban: [See Deut.2.on ver.34.] those Salomon brought to a slavish Leavie [i.e. he taxed them as his own slaves, or bond-men. They dwelt among the Israelites, and were called the slaves, or, servants of Salomon, Ezra 2.55. Nehem.7.57. because Salomon had made the Ordinance or Law concerning these slaves. The bond-men were firm to embrace the true Religion first, otherwise Salomon might not have shewed them this kindness, Deut.7.2. Of the word Leavie, see also above chap.5.3.] unto this day."}],"22":[{"catchword":null,"tekst":"But of the children of Israel did Salomon make no bond-men: [See Levit.25. ver.39.] but they were men of war, and his Servants, and his Princes, and his Captains, and Rulers of his charets, and of his Horsemen."}],"23":[{"catchword":null,"tekst":"These were the chief of the appointed that were over Salomons work, five hundred and fifty: [2 Chron.8.10. there are mentioned two hundred and fifty; but know, that these were in all five hundred, as is mentioned here, but taking the charge of overseeing by turns (function bouwHfdnav() {

  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');

    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  document.getElementById('hfdnav').innerHTML =

    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
