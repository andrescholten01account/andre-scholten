40\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> from <span class=\"wl wl-kjv\" data-code=\"H3766\">kneeling</span> on his <span class=\"wl wl-kjv\" data-code=\"H1290\">knees</span> with his <span class=\"wl wl-kjv\" data-code=\"H3709\">hands</span> spread <span class=\"wl wl-kjv\" data-code=\"H6566\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven.</span>","55":"And he <span class=\"wl wl-kjv\" data-code=\"H5975\">stood,</span> and <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed</span> all the <span class=\"wl wl-kjv\" data-code=\"H6951\">congregation</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> with a <span class=\"wl wl-kjv\" data-code=\"H1419\">loud</span> <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span>","56":"<span class=\"wl wl-kjv\" data-code=\"H1288\">Blessed</span> be the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> that hath <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> <span class=\"wl wl-kjv\" data-code=\"H4496\">rest</span> unto his <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> according to all that he <span class=\"wl wl-kjv\" data-code=\"H1696\">promised:</span> there hath not <span class=\"wl wl-kjv\" data-code=\"H5307\">failed</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of all his <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">promise,</span> which he <span class=\"wl wl-kjv\" data-code=\"H1696\">promised</span> by the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> his <span class=\"wl wl-kjv\" data-code=\"H5650\">servant.</span>","57":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> our <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> be with us, as he was with our <span class=\"wl wl-kjv\" data-code=\"H1\">fathers:</span> let him not <span class=\"wl wl-kjv\" data-code=\"H5800\">leave</span> us, nor <span class=\"wl wl-kjv\" data-code=\"H5203\">forsake</span> us:","58":"That he may <span class=\"wl wl-kjv\" data-code=\"H5186\">incline</span> our <span class=\"wl wl-kjv\" data-code=\"H3824\">hearts</span> unto him, to <span class=\"wl wl-kjv\" data-code=\"H3212\">walk</span> in all his <span class=\"wl wl-kjv\" data-code=\"H1870\">ways,</span> and to <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> his <span class=\"wl wl-kjv\" data-code=\"H4687\">commandments,</span> and his <span class=\"wl wl-kjv\" data-code=\"H2706\">statutes,</span> and his <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments,</span> which he <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> our <span class=\"wl wl-kjv\" data-code=\"H1\">fathers.</span>","59":"And let these my <span class=\"wl wl-kjv\" data-code=\"H1697\">words,</span> wherewith I have made <span class=\"wl wl-kjv\" data-code=\"H2603\">supplication</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> be <span class=\"wl wl-kjv\" data-code=\"H7138\">nigh</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> our <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H3119\">day</span> and <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> that he <span class=\"wl wl-kjv\" data-code=\"H6213\">maintain</span> the <span class=\"wl wl-kjv\" data-code=\"H4941\">cause</span> of his <span class=\"wl wl-kjv\" data-code=\"H5650\">servant,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4941\">cause</span> of his <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> at all <span class=\"wl wl-kjv\" data-code=\"H3117\">times,</span> as the <span class=\"wl wl-kjv\" data-code=\"H1697\">matter</span> shall require:","60":"That all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> may <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and that there is none else.","61":"Let your <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> therefore be <span class=\"wl wl-kjv\" data-code=\"H8003\">perfect</span> with the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> our <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">walk</span> in his <span class=\"wl wl-kjv\" data-code=\"H2706\">statutes,</span> and to <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> his <span class=\"wl wl-kjv\" data-code=\"H4687\">commandments,</span> as at this <span class=\"wl wl-kjv\" data-code=\"H3117\">day.</span>","62":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> and all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> with him, <span class=\"wl wl-kjv\" data-code=\"H2076\">offered</span> <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifice</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","63":"And <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H2076\">offered</span> a <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifice</span> of peace <span class=\"wl wl-kjv\" data-code=\"H8002\">offerings,</span> which he <span class=\"wl wl-kjv\" data-code=\"H2076\">offered</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> and <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H1241\">oxen,</span> and an <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> and <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep.</span> So the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> and all the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H2596\">dedicated</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","64":"The same <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> did the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H6942\">hallow</span> the <span class=\"wl wl-kjv\" data-code=\"H8432\">middle</span> of the <span class=\"wl wl-kjv\" data-code=\"H2691\">court</span> that was <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> for there he <span class=\"wl wl-kjv\" data-code=\"H6213\">offered</span> burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offerings,</span> and meat <span class=\"wl wl-kjv\" data-code=\"H4503\">offerings,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2459\">fat</span> of the peace <span class=\"wl wl-kjv\" data-code=\"H8002\">offerings:</span> because the <span class=\"wl wl-kjv\" data-code=\"H5178\">brasen</span> <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> that was <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was too <span class=\"wl wl-kjv\" data-code=\"H6996\">little</span> to <span class=\"wl wl-kjv\" data-code=\"H3557\">receive</span> the burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offerings,</span> and meat <span class=\"wl wl-kjv\" data-code=\"H4503\">offerings,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2459\">fat</span> of the peace <span class=\"wl wl-kjv\" data-code=\"H8002\">offerings.</span>","65":"And at that <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">held</span> a <span class=\"wl wl-kjv\" data-code=\"H2282\">feast,</span> and all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> with him, a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H6951\">congregation,</span> from the <span class=\"wl wl-kjv\" data-code=\"H935\">entering</span> in of <span class=\"wl wl-kjv\" data-code=\"H2574\">Hamath</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5158\">river</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> our <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> and <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days,</span> even <span class=\"wl wl-kjv\" data-code=\"H702\">fourteen</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days.</span>","66":"On the <span class=\"wl wl-kjv\" data-code=\"H8066\">eighth</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> he <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> ➔ the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">away:</span> and they <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> unto their <span class=\"wl wl-kjv\" data-code=\"H168\">tents</span> <span class=\"wl wl-kjv\" data-code=\"H8056\">joyful</span> and <span class=\"wl wl-kjv\" data-code=\"H2896\">glad</span> of <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> for all the <span class=\"wl wl-kjv\" data-code=\"H2896\">goodness</span> that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> had <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> for <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> his <span class=\"wl wl-kjv\" data-code=\"H5650\">servant,</span> and for <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> his <span class=\"wl wl-kjv\" data-code=\"H5971\">people.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"de oudsten van Israël,","tekst":"Zie Lev 4:15."},{"catchword":"hoofden der stammen,","tekst":"Zie Num 1:4, Num 1:16."},{"catchword":"der vaderen,","tekst":"Iedere stam der Israëlieten bestond uit zekere huisgezinnen of geslachten, welk elk bijzonder hun opperste vaderen hadden. Benevens deze warenin elken stam hoofdlieden over honderd, over duizend, enz., welker voornaamsten en principalen hier moeten verstaan worden. Vergelijk Exo 18:21; Num 3:24, Num 3:30, Num 3:35; 1Ch 4:38."},{"catchword":"tot den koning","tekst":"Dat is, tot hem, naar de manier van spreken der Hebreën. Zie boven, 1Ki 2:19."},{"catchword":"op te brengen","tekst":"Te weten, in den tempe; tot denwelken, omdat hij op den berg Moria gebouwd was, men met trappen opklimmen moest."},{"catchword":"de stad Davids,","tekst":"Die David gewonnen, betimmerd en bewoond had. Zie boven, 1Ki 2:10."}],"2":[{"catchword":"Ethanim","tekst":"Deze maand komt meest overeen met onzen September. Zij wordt Ethanim genoemd, dat is, der sterken, of der sterkten; omdat, [gelijk enigen menen] in dezelve de vruchten des lands ingezameld werden, die als de kracht der aarde zijn, van God verordend om het leven des mensen te onderhouden en te versterken."},{"catchword":"het feest;","tekst":"Versta, het feest der inwijding, gaande vóór het loofhuttenfeest. Zie onder, vs.65, en van het feest der loofhutten Lev 23:24; Deu 16:13; 2Ch 5:3."},{"catchword":"de zevende maand","tekst":"Te weten, naar de rekening der kerkelijke maanden van God verordend, Exo 12:2. Anders, vóór den uittocht der Israëlieten uit Egypte was deze maand de eerste, te weten van het burgerlijk jaar."}],"3":[{"catchword":"ark op","tekst":"Die te dezen tijde te Jeruzalem was, 2Ch 1:4."}],"4":[{"catchword":"en de tent","tekst":"Die op dezen tijd met het koperen altaar van Bezaleël, in de woestijn gemaakt, te Gibeon was, 2Ch 1:3, 2Ch 1:5."},{"catchword":"heilige vaten,","tekst":"Hebreeuws, vaten der heiligheid; dat is, die tot een heilig gebruik verordend waren. Zie Lev 16:4."},{"catchword":"de priesters en de Levieten","tekst":"Te weten, met dit onderscheid, dat de priesters de ark en de heilige vaten droegen, maar de Levieten de tent der samenkomst met haar toebehoren. Vergelijk de aantekeningen Num 4:15."}],"5":[{"catchword":"met hem voor de ark,","tekst":"Namelijk, met den koning Salomo. Anders [gingen] met hem voor de ark. Versta, dat de offeranden, hier vermeld, op den weg, door denwelken de ark gedragen werd, hier en daar zouden geofferd zijn. Vergelijk 2Sa 6:13."}],"6":[{"catchword":"van het huis,","tekst":"Dat is, des tempels."},{"catchword":"cherubim","tekst":"Die Salomo had laten maken, en die veel groter waren dan de cherubim, die Mozes in de woestijn had laten maken. Zie Exo 25:20, boven, 1Ki 6:27."}],"7":[{"catchword":"handbomen","tekst":"Waarmede de ark gedragen moest worden, Exo 25:14."}],"8":[{"catchword":"schoven zij","tekst":"Hebreeuws, verlengden ze; te weten, door die verder en langer uit te trekken. Want geheel uit te nemen, was van God verboden, Exo 25:15. Zie Num 4:6."},{"catchword":"hoofden der handbomen","tekst":"Dat is, de einden."},{"catchword":"uit het heiligdom","tekst":"Dat is, van degenen, die in het deel des tempels, dat meer uitwaarts was, [genoemd het heilige ] waren; 2Ch 5:9 staat dat ze gezien werden uit de ark. Hetwelk zo niet te nemen is, alsof men de ark gezien had; maar de zin is dat de uiterste einden der handbomen, die uit de ark voortkwamen, zich in het heiligdom vertoonden, te weten, niet bloot maar bedekt met het voorhangsel."},{"catchword":"buiten niet gezien werden;","tekst":"Namelijk, het heilige."},{"catchword":"tot op dezen dag","tekst":"Te weten, als dit boek geschreven werd."}],"9":[{"catchword":"Er was niets in de ark,","tekst":"Zie Deu 10:5."},{"catchword":"alleen de twee stenen tafelen,","tekst":"De woorden des apostels, door welke hij schijnt te zeggen, Heb 9:4, dat in de ark ook geweest is de gouden kruik met manna en de staf van Aäron, die gebloeid had, moet men aldus verstaan, dat ze in dezelfde plaats van den tabernakel, waar de ark was, ja bij dezelve geweest zijn, Exo 16:34; Num 17:10. Gelijk het woord in dikwijls voor bij genomen wordt, gelijk Jos 5:13, en Jos 10:10, enz., ja zelfs hier in vs.9"},{"catchword":"een verbond","tekst":"Gelijke manier van spreken, in welke dit woord verzwegen wordt, vindt men 1Sa 20:16, en 1Sa 22:8; 2Ch 5:10."}],"10":[{"catchword":"heilige uitgingen,","tekst":"Dat is, het voorste deel des tempels, Exo 26:33, en Exo 28:43."}],"11":[{"catchword":"heerlijkheid des HEEREN","tekst":"Dat is, de wolk, in welke God den Israëlieten verscheen. Vergelijk Exo 16:10, en Exo 24:16, en Exo 40:34-35; Num 16:19; 2Ch 5:13-14, en 2Ch 7:1-3."}],"12":[{"catchword":"heeft gezegd,","tekst":"Dat is, Hij heeft verklaard dat Hij door een zodanig zichtbaar teken, als de wolk of de donkerheid was, zijn tegenwoordigheid wilde openbaren. Zie Lev 16:2; hetwelk Hij ook menigmaal gedaan heeft. Zie de aantekeningen op vs.11; idem Exo 13:22, en Exo 14:19, en Exo 19:16, en Exo 20:21; Num 9:15."}],"13":[{"catchword":"immers een huis gebouwd,","tekst":"Hebreeuws, bouwende gebouwd; dat is, ik heb immers, of gewisselijk of ganselijk gebouwd, of ik heb volbouwd."},{"catchword":"woonstede,","tekst":"Te weten, waarin Gij wonen zoudt bij uw volk, door uw woord en de zichtbare tekenen uwer genade. Alzo 2Ch 6:2."},{"catchword":"vaste plaats","tekst":"Of, bereide plaats."},{"catchword":"eeuwige woning","tekst":"Versta deze eeuwigheid van den tijd der wet, en zie Gen 13:15. Daartoe is hierbij te voegen de conditie van gehoorzaamheid, die de Israëlieten God schuldig waren, opdat dit woord zou vast blijven. Zie boven, 1Ki 6:12-13, en onder 1Ki 9:4; Psa 89:29-31."}],"14":[{"catchword":"zegende","tekst":"Dat is, wenste de gemeente van den Heere toe alle welvaren naar ziel en lichaam. Alzo onder, vs.55. Vergelijk Num 6:23; Psa 118:26. Anderen verstaan dit alzo, dat de koning met de ganse gemeente God gezegend, dat is, gedankt en geloofd heeft; het woord God tot dit einde in den tekst inlatende."}],"15":[{"catchword":"met Zijn mond","tekst":"Dat is, door den profeet Nathan, 2Sa 7:6; 1Ch 17:4. De profeten zijn als de mond Gods, omdat zijn woord in hun mond is; Exo 4:12; 1Ki 17:24; Isa 51:16; Jer 5:14."}],"16":[{"catchword":"heb Ik","tekst":"Dat is, Ik heb mijn verkiezing niet geopenbaard, noch in het werk gesteld. Alzo is het woord verkiezing genomen voor de uitvoering der verkiezing, Deu 12:11; 2Ch 6:5; Zec 2:12, want Gode zijn al zijne werken van eeuwigheid aan bekend; Act 15:18."},{"catchword":"dat Mijn Naam","tekst":"Dat is, dat mijn leer daar luidbaar zij, de godsdienst van mij ingesteld, bediend worde, het volk, dat naar mijn naam genoemd wordt, bijeenkome, mijn Geest ook daar krachtiglijk werke. Vergelijk Deu 12:11, onder vs.29, en 1Ki 14:21; 2Ki 21:4; 2Ch 6:6; Psa 132:13-14."}],"17":[{"catchword":"Het was ook","tekst":"Dat is, hij had voorgenomen. Zie gelijke manier van spreken, 1Sa 14:7; 2Sa 7:3; 1Ki 10:2; 1Ch 17:2, en 1Ch 22:7, en vergelijk boven de aantekenigen op 1Ki 5:5."}],"19":[{"catchword":"uit uw lendenen","tekst":"Zie Gen 35:11."}],"21":[{"catchword":"het verbond","tekst":"Dat is, de tafelen des verbonds, of der getuigenis; versta de wetten des verbonds, naar dewelke het verbond is gemaakt geweest, die in twee stenen tafelen geschreven waren. Vergelijk Deu 31:26."}],"22":[{"catchword":"stond","tekst":"Te weten, op het koperen en verheven gestoelte, hetwelk was in het voorhof des volks, recht tegenover het brandofferaltaar, dat hij uit zijn stoel zien Kon. Zie hiervan 2Ki 11:14, en 2Ki 23:3, en 2Ch 6:13."},{"catchword":"breidde","tekst":"Tot een bewijs, dat hij zijn hart tot God, dien hij aanriep, opgeheven had, en van hem alleen alles goeds verwachtte. Van welke ceremonie, bij de ouden in het bidden gebruikt, zie ook Ezr 9:5; Job 11:13; Psa 44:21, en Psa 63:5; 1Ti 2:8."}],"23":[{"catchword":"voor Uw aangezicht","tekst":"Zie Gen 17:1."},{"catchword":"ganse hart wandelen;","tekst":"Zie boven, 1Ki 2:4."}],"24":[{"catchword":"vervuld,","tekst":"Dat is, beginnen te vervullen."}],"25":[{"catchword":"Geen man","tekst":"Anders, geen man zal u van voor mijn aangezicht ontbreken. De zin is dat er altijd iemand zou zijn in het geslacht Davids, die hem in het rijk opvolgen zou. Welke belofte ten volle vervuld is in Christus, wiens koninkrijk is zonder einde, Luk 1:33."},{"catchword":"hun weg bewaren,","tekst":"Zie boven, 1Ki 2:4."},{"catchword":"wandelen","tekst":"Zie Gen 17:1."}],"27":[{"catchword":"Maar waarlijk,","tekst":"Het is alsof hij zeide: Hoewel dit huis niet bekwaam is om U, die hemel en aarde vervult, te bevatten, laat het nochtans U welgevallen, daarin te wonen en de gebeden te verhoren."},{"catchword":"zou God","tekst":"Hij wil niet loochenen dat God op de aarde is, maar hij wil zeggen dat Hij daar niet besloten is, ten aanzien van zijn wezen, hoewel Hij in den tempel als een zichtbaar teken zijner tegenwoordigheid zich openbaarde, ten aanzien van zijn genade."},{"catchword":"de hemel der hemelen","tekst":"Alzo Psa 148:4. Versta, den oppersten hemel, die de allerruimste is, van Paulus genaamd de derde hemel, 2Co 12:2; en zie de manier van spreken Lev 2:3, en in de aantekeningen."}],"28":[{"catchword":"van Uw knecht,","tekst":"Dat is, tot mijn gebed."}],"29":[{"catchword":"ogen","tekst":"Menselijkerwijze van God gesproken, wiens ogen gezegd worden open te zijn over de zijnen, als Hij zich over hen ontfermt, hen verhoort en hun goeddoet. Vergelijk onder, vs.52, en Psa 33:18, en Psa 34:16; Zec 12:4."},{"catchword":"Mijn Naam","tekst":"Zie boven, vs.16."},{"catchword":"in deze plaats","tekst":"Anders, naar deze plaats; te weten, zich wendende naar dit huis, en ziende op de beloften van uw tegenwoordigheid; zie Dan 6:11."}],"30":[{"catchword":"die in deze plaats","tekst":"Anders, dewelke zij, enz."}],"31":[{"catchword":"hij hem","tekst":"Te weten, de naaste, tegen denwelken gezondigd is."},{"catchword":"eed des vloeks","tekst":"Hebreeuws eigenlijk, vloek, of vervloeking. Versta, een eed van den rechter opgelegd, die in gewichtige zaken geschiedde, met zijns zelfs vervloeking zo men valselijk zwoer, en dat zeer plechtig voor het altaar, om den zweerder te meer tot aandacht en vrees te verwekken. Vergelijk Exo 22:8; Num 5:15-18, enz."}],"32":[{"catchword":"veroordelende","tekst":"Zie van dit woord Deu 25:1."},{"catchword":"gevende zijn weg","tekst":"Dat is, mits zijn zonden door de welverdiende straffen te plagen. Zie gelijke manier van spreken, 2Ch 6:23; Eze 9:10, en vergelijk onder, vs.39."},{"catchword":"rechtvaardigende den gerechtige,","tekst":"Dat is, vrij achtende en rechtvaardig sprekende. Zie van dit woord Gen 44:16; Deu 25:1."}],"33":[{"catchword":"Uw Naam belijden,","tekst":"Dat is, zichzelven de schuld der straf en U de eer der gerechtigheid toeschrijven zullen. Alzo onder, vs.35. Zie Jos 7:19."}],"35":[{"catchword":"gesloten zijn,","tekst":"Zie Deu 11:17. Hetwelk anders geheten wordt de hemel als ijzer of als koper maken, Lev 26:19; Deu 28:23."},{"catchword":"Gij hen","tekst":"Anders, omdat Gij tegen hen getuigd zult hebben; te weten, door uw profeten of door de straf der dorrigheid, alzo 2Ch 6:26."}],"36":[{"catchword":"goeden weg","tekst":"Alzo mede genaamd 1Sa 12:23. Anders, den weg des Heeren, Psa 27:11; der waarheid, Psa 119:30; des verstands, Pro 9:6; der heiligheid, Isa 36:8; der gerechtigheid, 2Pe 2:21; des levens, Pro 6:23, enz."}],"37":[{"catchword":"in het land","tekst":"Dat is, in zijn eigen land en steden. Het woord poorten wordt hier voor steden genomen. Zie Gen 22:17. Het land nu zijner steden betekent de steden zijns lands. Alzo 2Ch 6:28."},{"catchword":"of enige krankheid","tekst":"Dit woord is in den oorspronkelijken tekst uitgedrukt, 2Ch 6:28."}],"38":[{"catchword":"van enig mens,","tekst":"Dat is, van elk een in zijn bijzonder, of van de vergadering des volks in het algemeen."},{"catchword":"de plage zijns harten,","tekst":"Dat is, die hun ter harte gaat, en hen inwendiglijk zo smart, dat zij tot het gebed door het vertrouwen op God, met ware bekering des harten gedrongen worden."},{"catchword":"in dit huis","tekst":"Of, naar dit huis. Zie onder, vs.44."}],"39":[{"catchword":"al zijn wegen,","tekst":"Zie Gen 6:12."},{"catchword":"alle kinderen der mensen;","tekst":"Dat is, alle mensen. Alzo Num 23:19; Job 16:21; Psa 8:5; Ecc 3:21."}],"40":[{"catchword":"zij U vrezen","tekst":"Dat is, wandelen in uw wegen, gelijk verklaard wordt 2Ch 6:31; want de vreze des Heeren verwekt den mens om het kwade te laten en het goede te doen; Pro 1:7, en Pro 3:13, en Pro 16:6."}],"41":[{"catchword":"vreemde,","tekst":"Versta, degenen, die van hun afgoderij tot den waren God zouden bekeerd zijn."},{"catchword":"Uws Naams","tekst":"Dat is, om den roem en lof, dien Gij hebt, zo van de schepping, onderhouding en regering aller dingen in het algemeen, als van de bezorging, bewaring en verlossing uwer kerk in het bijzonder. Zie vs.42, en 2Ch 6:32."}],"42":[{"catchword":"hand,","tekst":"Dat is, kracht, vermogen, alzo Deu 3:24; Psa 136:12. Zie Num 11:23."},{"catchword":"uitgestrekten arm","tekst":"Alzo Psa 136:12; Jer 32:17."}],"43":[{"catchword":"Uw Naam","tekst":"Dat is, dat zijn naam heeft van U. Vergelijk boven de aantekeningen op vs.16."}],"44":[{"catchword":"zal door den weg,","tekst":"Dat is, in een rechtvaardigen en wettelijken oorlog, die van U zal geboden zijn."},{"catchword":"naar den weg","tekst":"Dat is, zich wendende in het bidden naar de plaats, tot een bewijs dat zij dien God alleen voor den waren God bekenden en aanriepen, die in den tempel te Jeruzalem naar zijn woord gediend werd. Alzo onder, vs.48, en zie hiervan een exempel in Dan 6:11."}],"45":[{"catchword":"voer hun recht uit","tekst":"Of, handhaaf hun recht. Hebreeuws, doe hun gericht, of recht. God nu doet zijn volk gericht of recht wanneer Hij gelijk een rechter hetzelve voorstaat, en zijn vijanden rechtvaardiglijk straft. Alzo onder, vs.49; 2Ch 6:35, 2Ch 6:39; Psa 9:5, en Psa 140:13."}],"47":[{"catchword":"hun hart","tekst":"Dat is, uit een recht gevoel en berouw hunner zonden, een ongeveinsd voornemen hebben, om met een vast betrouwen op uw genade het kwaad te laten en het goede te doen. Alzo 2Ch 6:37."}],"48":[{"catchword":"ganse hart,","tekst":"Zie 1Ki 2:4."},{"catchword":"naar den weg","tekst":"Zie boven, vs.44."}],"49":[{"catchword":"voer hun recht uit;","tekst":"Hebreeuws, doe hun gericht. Als vs.45."}],"50":[{"catchword":"geef hun","tekst":"Hebreeuws, stel hen, of geef hen ter barmhartigheden; dat is, om ontfermd te worden, of om ontferming te verkrijgen. Zie een bijna gelijke manier van spreken Gen 43:14. De zin is dat God den gevangen Israëlieten zou geven genade en medelijden te vinden in de ogen hunner vijanden, in de plaats van wrede mishandeling en verdrukking. Zie enige vervullingen hiervan Neh 2:2, enz.; Est 10:2-3; Dan 1:9-10, enz."}],"51":[{"catchword":"ovens;","tekst":"Het Hebreeuwse woord betekent eigenlijk een plaats, of een vat, waarin allerlei metaal door het vuur gesmolten wordt; waarbij Egypte vergeleken wordt, omdat zij daar vele verdrukkingen en zware beproevingen uitgestaan hadden. Zie Deu 4:20, en vergelijk Isa 48:10."}],"52":[{"catchword":"ogen open","tekst":"Zie boven, vs.29."}],"53":[{"catchword":"door den dienst","tekst":"Hebreeuws, door de hand. Alzo ook vs.56."}],"54":[{"catchword":"het knielen","tekst":"De ceremonie der kniebuiging hebben de heiligen in het bidden gebruikt tot een teken van ootmoedigheid des harten, met welke wij voor God verschijnen moeten. Zie 2Ch 6:13; Dan 6:11; Luk 22:41."},{"catchword":"uitgebreid","tekst":"Zie boven, vs.22."}],"55":[{"catchword":"zegende","tekst":"Zie boven, vs.14."},{"catchword":"luider stem","tekst":"Hebreeuws, groter stem."}],"56":[{"catchword":"Niet een enig woord","tekst":"Dat is, Hij heeft al zijn beloften vervuld en geen daarvan gebroken. Alzo ook Jos 21:45, en Jos 23:14; 2Ki 10:10."},{"catchword":"al Zijn goede woorden,","tekst":"Hebreeuws, van al zijn goed woord."},{"catchword":"den dienst van Mozes,","tekst":"Hebreeuws, door de hand. Zie Exo 4:13."}],"57":[{"catchword":"zij met ons,","tekst":"Zie Gen 21:22, en Gen 26:24."}],"58":[{"catchword":"Zijn geboden,","tekst":"Zie het onderscheid dezer drie woorden, boven, 1Ki 2:3."}],"59":[{"catchword":"knecht uitvoere,","tekst":"Hij verstaat hiermede zichzelven, gelijk boven, vs.28-30, 52."},{"catchword":"elkeen","tekst":"Hebreeuws, het woord, of het ding des daags op zijn dag; dat is, ten allen dage, naardat dagelijks enige nood mag voorvallen. Gelijke manier van spreken is, Exo 5:13; Lev 23:37."}],"61":[{"catchword":"volkomen zij","tekst":"Versta, de volkomenheid dezes levens, bestaande in al de leden der godvruchtigheid, en niet in derzelver vollen wasdom, welke is de volkomenheid des anderen levens. Alzo onder, 1Ki 11:4, en 1Ki 15:3, 1Ki 15:14; 2Ki 20:3; 1Ch 28:9, en 1Ch 29:9, 1Ch 29:19; 2Ch 15:17, en 2Ch 19:9. Vergelijk Phi 3:12, Phi 3:15."},{"catchword":"gelijk te dezen dage","tekst":"Versta, voortaan altijd, gelijk Gij doet ten huidigen dage."}],"62":[{"catchword":"voor het aangezicht","tekst":"Voor den tempel. Zie Lev 1:3."}],"64":[{"catchword":"heiligde","tekst":"Zie Lev 8:10."},{"catchword":"des voorhofs,","tekst":"Versta dit van het voorhof der priesters, welks middelste deel hij door den Geest Gods geleid zijnde in dit extraordinaire werk gebruikt heeft om daar offeranden te offeren, en tot dien einde altaren op te richten, omdat het brandofferaltaar de offeranden, vanwege haar menigte, alle niet kon dragen."},{"catchword":"voor het huis","tekst":"Dat is, dicht voor aan het voorste deel des tempels, genoemd het heilige."},{"catchword":"voor het aangezicht","tekst":"Zie boven, vs.62."}],"65":[{"catchword":"het feest,","tekst":"Versta, het feest der loofhutten, hetwelk zeven dagen moest gehouden worden. Zie hiervan Lev 23:34."},{"catchword":"Hamath","tekst":"Zie hiervan Num 13:21. Dit was de uiterste landpale van Kanaän tegen het noorden."},{"catchword":"rivier van Egypte,","tekst":"Deze wordt Sichor genoemd, Jos 13:3, en was de uiterste landpale tegen het zuiden. Zie Gen 15:18."},{"catchword":"zeven dagen,","tekst":"Versta, zeven dagen tot de inwijding des altaars en des tempels; en dan nog eens zeven dagen tot onderhouding van het feest der loofhutten, 2Ch 7:9."}],"66":[{"catchword":"achtsten dag","tekst":"Versta, dat hij het volk verlof gegeven heeft op den achtsten dag, welke was dde twee en twintigste der zevende maand; maar omdat die dag ook moest gevierd worden, zijn zij vertrokken den volgenden dag, zijnde de drie en twintigste. Zie 2Ch 7:10, en de aantekening."},{"catchword":"goedsmoeds","tekst":"Hebreeuws, goed van harten."},{"catchword":"aan David,","tekst":"Dat is, den huize Davids en zijn nakomelingen in het koninkrijk."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Then Salomon assembled the Eldest of Israel, [See Lev.4. on ver.15.] and all the heads of the tribes, Father among the children of Israel, [each tribe of the Israelites consisted of certain Households or Families, which had each in particular their cheif Fathers. Besides these, there were in every tribe Captains of hundreds, of thousands, &c whose chiefest and most principal are here to be understood. Compare Exo 18:21. Num 3:24,30,35. 1 Chron.4 38.] unto King Salomon [i.e. unto him, according to the Hebrew phrase. See above chap.2.on ver.19.] at Jerusalem, to bring up [viz. Into the Temple, into which, because it was built upon mount Morija, they were to ascend by steps or stairs] the Ark of the Covenant of the LORD out of the City of David, [viz. Which David had taken, built, and inhabited. See above chap.2.on v.10.] which is Zion. [see 2 Sam.5.9. & 6 12,17.]"}],"2":[{"catchword":null,"tekst":"And all the men of Israel assembled themselves unto King Salomon at the Feast, [Meaning the Feast of dedication, going before the Feast of Leaf-huts. See below ver.65. and of the Feast of Leaf-huts, Levit.23.34. Deut.16 13 2 Chron.5.3.] in the month Ethanaim: [This months agreeth mostly with our September. It is called Ethanaim, i.e. of strong, or of strengths; because (as some conceive) in it the fruits of the Land were gathered in, which are as the strength of the earth, ordained by God to preserve and strengthen the life of man] the same is the seventh month: [viz. according to the account of Ecclesiastical months ordained by God, Exo 12:2. otherwise, before the departure of the Israelites out of Egypt, this month was the first, viz. of the civil year.]"}],"3":[{"catchword":null,"tekst":"And all the Eldest of Israel came; and the Priests took up the Ark. [Which was at this time at Jerusalem 2 Chron.1.4.]"}],"4":[{"catchword":null,"tekst":"And they brought up the Ark of the LORD, and the Tent of the Congregation, [which with the Copper Altar made by Bazaleel in the Wilderness, was at this time at Gibeon, 2 Chron.1.3,5.] together with all the holy vessels, [Heb. vessels of holiness; that is, which are ordained for an holy use. See Levit.16.on verse 4.] that were in the Tent, and the Priests, and the Levites brought the same up, [viz. With this difference, that the Priests carried the Ark, and the holy vessels, but the Levites the Tent of the Congregation, with its appurtences. Compare Numb.4. the annotate. on verse 15.]"}],"5":[{"catchword":null,"tekst":"Now King Salomon, and all the Congregation of Israel that were assembled with him, were with him before the Ark, [viz. With King Salomon. Otherw.(went) with him before the Ark.] offering sheep and oxen, [understand, that the offerings here mentioned, were here and there offered by the way, which the Ark was carried. Compare 2 Sam 6.13.] which could not be numbered nor for multitude."}],"6":[{"catchword":null,"tekst":"So the Priests brought the Ark of the Covenant of the LORD unto its place, unto the Oracles place of the house, [i.e. Of the Temple] to the Holy of Holies, even under the wings of The Cherubims. [which Salomon had caused to be made, and were much bigger then those which Moseh had caused to be made in the Wilderness. See above chap.6.v.27. Exo 25:20.]"}],"7":[{"catchword":null,"tekst":"For the Cherubims spread (forth) both wings over the place of the Ark; and the Cherubims covered the Ark, and the hand-beams thereof [By which the Ark was carried] above."}],"8":[{"catchword":null,"tekst":"Then they shoved the hand-beams further out, [Heb. Lengthened them; viz. by drawing them longer and further out: for to take them quite out, was forbidden by God, Exo 25:15. See Numb.4.on v.6.] that the heads [i.e. the ends] of the hand-beams were seen forth of the holy place [i.e. by those that were in that part of the temple which was more outward, called the holy place. 2 Chron.5.8. it is said, that they were seen out of the Ark: which is not so to understood, as if the Ark had been seen: but the meaning is, that the outmost ends of the hand-beams, which came forth out of the Ark, shewed themselves in the holy place, viz. not bare, but covered with the veil] before the Oracle place, but were not seen without: [viz. the holy place] and are there unto this day. [viz. when this book was written.]"}],"9":[{"catchword":null,"tekst":"There was nothing in the Ark, but onely the two tables of stone, [The Apostles words, whereby he seemeth to say, Heb 9:4. that there were also in Ark the golden pot with manna, and Aarons rod that budded, must thus be understood, that they were in the same place of the Tabernacle, where the Ark stood, yea were by it, Exo 16:34. Num 17:10. as the word in is often taken for by; as Jos.5.13. & 10.10, &c. yea even here in this verse in horeb, for, by horeb] which Moseh put in it [see Deut.10.5.] by Horeb, when the LORD made (a covenant) [the like phrase, wherein this word is concealed, yet to be understood, we find, 1 Sam.20.16.& 22.8. 2 Chron.5.10.] with the children of Israel, [see Exo 34:27.] when they were come forth out of the land of Egypt."}],"10":[{"catchword":null,"tekst":"And it came to pass, when the Priests came forth out of the holy place, [i.e. The fore-part of the Temple, Exo 20:33. & 28.43.] that a cloud filled the house of the LORD:"}],"11":[{"catchword":null,"tekst":"And the Priests cloud not stand to minister, because of the cloud; for the glory of the LORD [i.e. The Cloud, wherein God appeared to the Israelites. Compare Exo 16:10. & 24.16. & 40.34.35. Num 16:19. 2 Chron.15.13,14.&7.1,2,3.] had filled the house of the LORD."}],"12":[{"catchword":null,"tekst":"Then said Salomon, The Lord said, that he would dwell in darkness. [i.e. He declared, that he would manifest his presence by such a visible token as the Cloud, or the darkness was. See Levit.16.2. which he also oftentimes did. See the annotate. on the former verse; also Exo 13:22. & 14 19 & 19.16. & 20.21. Num 9:15. Deut.4.11. & 5.22.]"}],"13":[{"catchword":null,"tekst":"I have surely built [Heb. Building built; that is, I have surely, or certainly, or wholly built, or I have fully built] an house, for a dwelling place for thee; [viz. wherein thou wilt dwell with thy people by thy Word, and by the visible tokens of thy grace: so 2 Chron.6.2.] a settled [ort, prepared] place, for thine everlasting dwelling. [understand this everlastingness of the time of the Law; and see Gen.13.on verse 15. Here is to be added the condition of obedience, which the Israelites did owe unto God, that this Word might continue firm and stedfast. See above chap.6.12,13. and below chap 9.4. Psal 89.29,30,31.]"}],"14":[{"catchword":null,"tekst":"Then the King turned his face about, and blessed all the Congregation of Israel; [i.e. Wished them from the LORD all happiness both in soul and body. So below verse 55. Compare Num 6:23. Psal.118 26. Others understand this thus; that the King with all the Congregation blessed God, that is, thanked and praised him: to this end taking in the Word God into the text] and all the Congregation of Israel stood."}],"15":[{"catchword":null,"tekst":"And he said, Praised be the LORD the God of Israel, who spake with his mouth, [i.e. By the Prophet Nathan, 2 Sam.7.6. 1 Chron.17.4. The prophets are as it were the mouth of God, because his Word is in their mouth, Exo 4:12. 1 King.17.24. Isa 51:16. Jer 5:14.] unto David my father, and hath fulfilled it with his hand, saying:"}],"16":[{"catchword":null,"tekst":"From the day that I brought forth my people Israel out of the Land of Egypt, I chose [i.e. I did not manifest nor put in practice my choice. So the word chasing is taken for the execution of the choice, Deut.12.1. 2 Chron.6.5. Zach.2.12. for unto God all his works are known from eternity, Act.15.18.] no city, out of all the cities of Israel, to build an house, that my name might be there: [i.e. that my doctrine might be heard and published, the worship instituted by me might be administered, the people, that is called by my Name, might meet together, and my spirit might likewise powerfully work there. Compare Deut.13 11. below ver.29.& 14.21. 2 Kings 21.4. 2 Chron.6.6. Psal.132.13,14.] but I chose David to be over my people Israel."}],"17":[{"catchword":null,"tekst":"It was also in the heart of David my father, [i.e. He purposed. See the like phrase, 1 Sam.10.7. & 14.7. 2 Sam.7.3. 1 King.10.2. 1 Chron.27.2. & 22.7. also compare above chap.5. the annotate. on ver.5.] to build an house for the Name of the LORD the God of Israel. [See 2 Sam.7.2. 1 Chron.17 1. 2 Chron.6.7.]"}],"18":[{"catchword":null,"tekst":"But the LORD said unto David my father, seeing it was in thine heart to build an house unto my Name; thou didst well, that it was in thine heart."}],"19":[{"catchword":null,"tekst":"Nevertheless, thou shalt not build that house; but thy son that shall come forth out of thy loins, he shall build that house unto my Name."}],"20":[{"catchword":null,"tekst":"So the LORD hath stablished his word, which he had spoken: for I am risen in the place of David my Father, and I sit upon the throne of Israel, according as the LORD hath spoken; and I have built an house for the Name of the LORD, the God of Israel."}],"21":[{"catchword":null,"tekst":"And I have appointed there a place for the Ark wherein is the Covenant [i.e. The Tables of the Covenant, or of the Testimony; understand the Laws of the Covenant, according to which the Covenant was made, which were written in two Tables of stone. Compare Deut.31.on verse 26.] of the LORD, which he made with our Fathers, when he brought them out of the Land of Egypt."}],"22":[{"catchword":null,"tekst":"And Salomon stood [viz. Upon the Copper and exalted Scaffold, which was in the peoples Court, over against the altar of burnt-offering, which he could behold from his seat. See hereof, 2 Chron.6.13. also. 2 King.11.14. and 23.3.] before the altar of the LORD, over against all the Congregation of Israel, and spread forth his hands toward heaven: [In token that he lifted up his heart unto God, upon whom he called, and from whom alone he expected all good things. Of which Ceremony used by the Ancients in prayers, see likewise, Ezra 9.5. & Job 11:13. Psal.44.2. & 63.5. 1 Tim.2.8.]"}],"23":[{"catchword":null,"tekst":"And he said; LORD God of Israel, there is no God like thee, in heaven above, nor on earth beneath; keeping Covenants, and bounty with thy servants, that walk before thy face [See Genesis 17.on verse 10.] with all their heart. [see above chap.2.on verse 4.]"}],"24":[{"catchword":null,"tekst":"Who hast kept with thy servant David my Father, that which thou hadst spoken unto him, for with thy mouth thou hast spoken, and with thine hand fulfilled, [i.e. begun to fulfil] as it is this day."}],"25":[{"catchword":null,"tekst":"And now LORD God of Israel; keep unto thy servant David my father, that thou hast spoken to him, saying: No man shall be cut off unto thee before my face, [Otherwise, no man shall be lacking unto thee before my face] to sit upon the throne of Israel: [the meaning is, that there should be ever some in Davids family, to succeed him in the Kingdom: which promised was fully accomplished in Christ, whose Kingdom is without end Luk 1:53.] onely if thy sons keep their way [see above chap.2.v.4.] to walk before my face [see Gen.17.on ver.1.] according as thou hast walked before my face."}],"26":[{"catchword":null,"tekst":"Now then, O God of Israel, let thy word (I pray) he verified, which thou hast spoken unto thy servant David my father."}],"27":[{"catchword":null,"tekst":"But will God indeed dwell on the earth? [He denieth not that God is on the earth, but he implies that he is not there circumscribed or shut up, in regard of his effence, or being; although he manifested himself in the Temple, a visible token of his presence, in respect of his grace] Behold, the heavens, yea the heavens of the heavens [so Psal.148.4. understand the highest or uppermost heaven, which is the most spatious, or, the most capacious heaven, called by Paul the third heaven, 3 Cor.12.2. And see this phrase, Lev. chap.2.vers.3. and in the annotate.] cannot contain thee, nd give rain upon thy Land, which thou hast given thy people for an inheritance."}],"37":[{"catchword":null,"tekst":"When there shall be famine in the Land, when there shall be pestilence, when there shall be blasting, mill-dew, Locusts, Caterpillars, when his Enemy shall besiege him in the Land of his Gates, [i.e. In his own Land and Cities. The word gates, is here taken for Cities. See Genesis 2. on verse 17. Now the Land of his Cities, signifieth the cities of his Land. So 2 Chron.6.28.] (or there) shall be any plague, (or) [this particle is expressed in the original text, 2 Chron.6.28.] any sickness."}],"38":[{"catchword":null,"tekst":"What prayer soever, what supplication so ever that shall be made by any man, by all thy people Israel: [i.e. by every one in particular, or by the Congregation of the people in general] when they shall acknowledge every man the plague of his (own) heart, [i.e. which goeth to their very heart, and doth inwardly so afflicted them, that they are forced unto prayer, by confidence in God, with true repentance of heart] and (every man) shall spread forth his hands in this house; [or, towards this house. See below on v.44.]"}],"39":[{"catchword":null,"tekst":"Then hear thou in heaven, the sure place of thy dwelling, and forgive, and do, and give to every man, according to all his ways, [See Genes.6.on ver.12.] as thou knowest his heart; for thou onely knowest the hearts of all the children of men. [i.e. Of all men. So Num 23:19. Job 16:21. Psal.8.5. Ecc 3:21.]"}],"40":[{"catchword":null,"tekst":"That they may fear thee [i.e. Walk in thy ways; as is explained, 2 Chron.6.31. for the fear of the Lord exciteth a man to cease from evil, and to do good, Pro 1:7. and 8.13. and 10.6.] all the days, that they shall live in the land, which thou gavest unto our fathers."}],"41":[{"catchword":null,"tekst":"Yea also concerning the stranger, [Understand those that should be converted from their Idolatry to the true God] that shall not be of thy people b. hand. See Exod.4.on v.13.] of Moseh his servant. [The meaning is, he hath fulfilled all his promises, and broken not one of them: so likewise Jos.21.45. & 23.14. 2 King.10.10.]"}],"57":[{"catchword":null,"tekst":"The LORD our God be with us, [See Gen.21.on vers.22. & 26. on ver.24.] according as he was with our fathers: let him not leave us, nor forsake us:"}],"58":[{"catchword":null,"tekst":"Inclining our heart unto him; to walk in all his ways, and to keep his commandements, and his statutes, and his judgements, [See the difference of these three words above, chap..on vers.3.] which he commanded our fathers."}],"59":[{"catchword":null,"tekst":"And that these my words, wherewith I have made supplication before the LORD, may be nigh before the LORD our God, day and night: that he may execute the right of his servant, [He understandeth hereby himself, as above ver.28,29,30,32.] and the right of thy people Israel, every man daily on his day. [Heb. the word, or, the thing of the day on his day: i.e. every day, according as daily any need shall happen. The like phrase is found, Exo 5:13. Lev.23.37.]"}],"60":[{"catchword":null,"tekst":"That all the Nations of the earth may know, that the LORD is that God; (and that there is) none else. [see Deut.4.35,39.]"}],"61":[{"catchword":null,"tekst":"And let your heart be perfect [Understand the perfection of this life, consisting in all the parts of godliness, and not in the full increase thereof, which is the perfection of the life to come: so below chap.11.4. and 15.3,4. 2 Kings 20.3. 1 Chron.28.9. & 29.9, 19. 2 Chron.15.17. & 19.9. Compare Philip 3.12,15.] with the LORD our God: to walk in his statutes, and to keep his commandements, as at this day. [Understand henceforth for ever, as ye do this day.]"}],"62":[{"catchword":null,"tekst":"And the King and all Israel with him offered slay offerings before the face of the LORD. [Before the Temple; see Lev. on v.3.]"}],"63":[{"catchword":null,"tekst":"And Salomon offered a thank const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"

let vertaling = 'SVnu';

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);

      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    const inhoud = lijst.map(it => it.catchword
      ? `<div class="uitleg-item"><span class="uitleg-cw">${md(it.catchword)}</span>${md(it.tekst)}</div>`
      : `<div class="uitleg-item">${md(it.tekst)}</div>`
    ).join('');
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
