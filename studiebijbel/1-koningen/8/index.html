href":"../../lukas/1/"},{"naam":"Johannes","href":"../../johannes/1/"},{"naam":"Handelingen","href":"../../handelingen/1/"},{"naam":"Romeinen","href":"../../romeinen/1/"},{"naam":"1 Korinthe","href":"../../1-korinthe/1/"},{"naam":"2 Korinthe","href":"../../2-korinthe/1/"},{"naam":"Galaten","href":"../../galaten/1/"},{"naam":"Efeze","href":"../../efeze/1/"},{"naam":"Filippenzen","href":"../../filippenzen/1/"},{"naam":"Kolossenzen","href":"../../kolossenzen/1/"},{"naam":"1 Thessalonicenzen","href":"../../1-thessalonicenzen/1/"},{"naam":"2 Thessalonicenzen","href":"../../2-thessalonicenzen/1/"},{"naam":"1 Timotheüs","href":"../../1-timotheus/1/"},{"naam":"2 Timotheüs","href":"../../2-timotheus/1/"},{"naam":"Titus","href":"../../titus/1/"},{"naam":"Filemon","href":"../../filemon/1/"},{"naam":"Hebreeën","href":"../../hebreeen/1/"},{"naam":"Jakobus","href":"../../jakobus/1/"},{"naam":"1 Petrus","href":"../../1-petrus/1/"},{"naam":"2 Petrus","href":"../../2-petrus/1/"},{"naam":"1 Johannes","href":"../../1-johannes/1/"},{"naam":"2 Johannes","href":"../../2-johannes/1/"},{"naam":"3 Johannes","href":"../../3-johannes/1/"},{"naam":"Judas","href":"../../judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}]},"vertalingen":{"SVnu":{"1":"Toen verzamelde Salomo de oudsten van Israël, en alle hoofden van de stammen, de leiders van de vaderen, onder de kinderen van Israël, bij de koning Salomo te Jeruzalem, om de ark van het verbond van de HEERE op te brengen uit de stad van David, dat is Sion.","2":"En alle mannen van Israël verzamelden zich bij de koning Salomo, in de maand Ethanim, op het feest; dat is de zevende maand.","3":"En al de oudsten van Israël kwamen; en de priesters namen de ark op.","4":"En zij brachten de ark van de HEERE en de tent van de samenkomst omhoog, alsook alle heilige voorwerpen die in de tent waren; en de priesters en de Levieten brachten die omhoog.","5":"De koning Salomo nu en de hele gemeente van Israël, die bij hem vergaderd waren, waren met hem voor de ark, terwijl zij schapen en runderen offerden, die vanwege de menigte niet te tellen en niet te berekenen waren.","6":"Zo brachten de priesters de ark van het verbond van de HEERE naar haar plaats, naar het binnenste heiligdom¹ van het huis, naar het heilige der heiligen, tot onder de vleugels van de cherubs².","7":"Want de cherubs spreidden hun beide vleugels uit over de plaats van de ark; en de cherubs overdekten de ark en haar draagstokken van boven.","8":"Daarna schoven zij de draagstokken verder naar buiten, zodat de uiteinden van de draagstokken gezien werden vanuit het heiligdom, vóór het binnenste heiligdom, maar buiten werden zij niet gezien; en zij zijn daar tot op deze dag.","9":"Er was niets in de ark, dan alleen de twee stenen platen, die Mozes bij Horeb daarin gelegd had, toen de HEERE een verbond maakte met de kinderen van Israël, toen zij uit Egypteland waren uitgetrokken.","10":"En het gebeurde, toen de priesters uit het heilige naar buiten gingen, dat een wolk het huis van de HEERE vervulde.","11":"En de priesters konden niet blijven staan om te dienen, vanwege de wolk; want de heerlijkheid van de HEERE had het huis van de HEERE vervuld.","12":"Toen zei Salomo: De HEERE heeft gezegd, dat Hij in donkerheid zou wonen.","13":"Ik heb *immers*³ een huis gebouwd, U tot woonstede, een vaste plaats tot Uw eeuwige woning.","14":"Daarna wendde de koning zijn aangezicht om, en zegende de hele gemeente van Israël; en de hele gemeente van Israël stond.","15":"En hij zei: Geloofd zij de HEERE, de God van Israël, Die met Zijn mond tot mijn vader David gesproken heeft, en het met Zijn hand vervuld heeft, en zei:","16":"Van die dag af, dat Ik Mijn volk Israël uit Egypteland uitgevoerd heb, heb Ik geen stad verkoren uit alle stammen van Israël, om een huis te bouwen, dat Mijn Naam daar zou wezen; maar Ik heb David verkoren, dat hij over Mijn volk Israël wezen zou.","17":"Het was ook in het hart van mijn vader David, een huis voor de Naam van de HEERE, de God van Israël, te bouwen.","18":"Maar de HEERE zei tot David, mijn vader: Omdat het in uw hart geweest is Mijn Naam een huis te bouwen, hebt u welgedaan, dat het in uw hart geweest is.","19":"Evenwel, u zult dat huis niet bouwen; maar uw zoon, die uit uw lendenen voortkomen zal, die zal Mijn Naam dat huis bouwen.","20":"Zo heeft de HEERE Zijn woord bevestigd, dat Hij gesproken had; want ik ben opgestaan in de plaats van mijn vader David, en ik zit op de troon van Israël, zoals de HEERE gesproken heeft; en ik heb een huis gebouwd voor de Naam van de HEERE, de God van Israël.","21":"En ik heb daar een plaats vastgesteld voor de ark, waarin het verbond van de HEERE is, dat Hij met onze vaderen maakte, toen Hij hen uit Egypteland uitvoerde.","22":"En Salomo stond voor het altaar van de HEERE, tegenover de hele gemeente van Israël, en breidde zijn handen uit naar de hemel;","23":"en hij zei: HEERE, God van Israël, er is geen God zoals U, boven in de hemel, noch beneden op de aarde, Die het verbond en de goedertierenheid houdt aan Uw dienaren, die voor Uw aangezicht met hun hele hart wandelen;","24":"Die Uw dienaar, mijn vader David, gehouden hebt wat U tot hem gesproken had; want met Uw mond hebt U gesproken, en met Uw hand vervuld, zoals het op deze dag is.","25":"En nu, HEERE, God van Israël, houd Uw dienaar, mijn vader David, wat U tot hem gesproken hebt, en zei: Er zal u geen man van voor Mijn aangezicht afgesneden worden, die op de troon van Israël zit; alleen als uw zonen hun weg bewaren, om te wandelen voor Mijn aangezicht, zoals u gewandeld hebt voor Mijn aangezicht.","26":"Nu dan, o God van Israël, laat toch Uw woord waar worden, dat U gesproken hebt tot Uw dienaar, mijn vader David.","27":"Maar zou God werkelijk op de aarde wonen? Zie, de hemelen, ja, de hemel der hemelen kunnen U niet bevatten, hoeveel te minder dit huis, dat ik gebouwd heb!","28":"Wend U dan nog tot het gebed van Uw dienaar, en tot zijn smeking, o HEERE, mijn God, om te horen naar het geroep en naar het gebed, dat Uw dienaar heden voor Uw aangezicht bidt.","29":"Dat Uw ogen open zijn, nacht en dag, over dit huis, over deze plaats, waarvan U gezegd hebt: Mijn Naam zal daar zijn; om te horen naar het gebed, dat Uw dienaar bidden zal op deze plaats.","30":"Hoor dan naar de smeking van Uw dienaar, en van Uw volk Israël, die op deze plaats zullen bidden; en hoor Ú in de plaats van Uw woning, in de hemel, ja, hoor, en vergeef.","31":"Wanneer iemand tegen zijn naaste zal gezondigd hebben, en hij hem een vloekeed opgelegd zal hebben, om zichzelf te vervloeken; en de vloekeed voor Uw altaar in dit huis komen zal;","32":"hoor Ú dan in de hemel, en doe, en oordeel Uw dienaren, veroordeel de onrechtvaardige door zijn weg op zijn hoofd te leggen, en verklaar de rechtvaardige rechtvaardig door hem te geven naar zijn gerechtigheid.","33":"Wanneer Uw volk Israël verslagen wordt voor het aangezicht van de vijand, omdat zij tegen U gezondigd zullen hebben, en zich tot U bekeren, en Uw Naam belijden, en tot U in dit huis bidden en smeken zullen;","34":"hoor Ú dan in de hemel, en vergeef de zonde van Uw volk Israël, en breng hen terug in het land, dat U hun vaderen gegeven hebt.","35":"Als de hemel gesloten zal zijn, zodat er geen regen is, omdat zij tegen U gezondigd zullen hebben; en zij op deze plaats bidden, en Uw Naam belijden, en zich van hun zonden bekeren zullen, wanneer U hen geplaagd zult hebben;","36":"hoor Ú dan in de hemel, en vergeef de zonde van Uw dienaren en van Uw volk Israël, wanneer U hun de goede weg geleerd zult hebben waarin zij wandelen zullen; en geef regen op Uw land, dat U Uw volk tot een erfenis gegeven hebt.","37":"Als er honger in het land zal zijn, als er pest zal zijn, als er brandkoren, honingdauw, sprinkhanen, of kevers zullen zijn, als zijn vijand hem in het land van zijn poorten belegeren zal, of welke plaag of welke ziekte er ook zal zijn;","38":"elk gebed, elke smeking, die door enig mens, door al Uw volk Israël gebeuren zal; wanneer zij erkennen, ieder de plaag van zijn eigen hart, en ieder zijn handen in dit huis uitbreiden zal;","39":"hoor Ú dan in de hemel, de vaste plaats van Uw woning, en vergeef, en doe, en geef ieder naar al zijn wegen, zoals U zijn hart kent; want U alleen kent het hart van alle kinderen van de mensen;","40":"opdat zij U vrezen al de dagen, die zij leven zullen in het land, dat U onze vaderen gegeven hebt.","41":"Zelfs ook aangaande de vreemdeling, die niet van Uw volk Israël zal zijn, maar uit ver land komt om Uw Naam wil;","42":"(want zij zullen horen van Uw grote Naam, en van Uw sterke hand, en van Uw uitgestrekte arm) wanneer hij komen en bidden zal in dit huis;","43":"hoor Ú in de hemel, de vaste plaats van Uw woning, en doe naar alles waarom die vreemdeling tot U roepen zal; opdat alle volken van de aarde Uw Naam kennen, om U te vrezen, zoals Uw volk Israël, en om te weten, dat Uw Naam genoemd wordt over dit huis, dat ik gebouwd heb.","44":"Wanneer Uw volk in de oorlog tegen zijn vijand uittrekken zal, langs de weg die U hen zenden zult, en tot de HEERE bidden zullen in de richting van deze stad, die U verkoren hebt, en van dit huis, dat ik voor Uw Naam gebouwd heb;","45":"hoor dan in de hemel hun gebed en hun smeking, en voer hun recht uit.","46":"Wanneer zij tegen U gezondigd zullen hebben (want er is geen mens die niet zondigt), en U tegen hen vertoornd zult zijn, en hen leveren zult voor het aangezicht van de vijand, zodat hun overwinnaars hen gevankelijk wegvoeren naar het land van de vijand, veraf of nabij;","47":"en zij in het land, waar zij gevankelijk weggevoerd zijn, weer tot inkeer komen, en zich bekeren, en tot U smeken in het land van hen die ze gevankelijk hebben weggevoerd, en zeggen: Wij hebben gezondigd, en verkeerd gedaan, wij hebben goddeloos gehandeld;","48":"en zij zich tot U bekeren, met hun hele hart, en met hun hele ziel, in het land van hun vijanden, die hen gevankelijk zullen hebben weggevoerd; en tot U bidden zullen in de richting van hun land (dat U hun vaderen gegeven hebt), naar deze stad, die U verkoren hebt, en naar dit huis, dat ik voor Uw Naam gebouwd heb;","49":"hoor dan in de hemel, de vaste plaats van Uw woning, hun gebed en hun smeking, en voer hun recht uit;","50":"en vergeef aan Uw volk, dat zij tegen U gezondigd zullen hebben, en al hun overtredingen, waarmee zij tegen U overtreden zullen hebben; en geef hun barmhartigheid voor het aangezicht van hen die ze gevangen houden, opdat zij zich over hen ontfermen;","51":"want zij zijn Uw volk en Uw erfdeel, die U uitgevoerd hebt uit Egypteland, uit het midden van de ijzeren oven;","52":"opdat Uw ogen open zijn tot de smeking van Uw dienaar, en tot de smeking van Uw volk Israël, om naar hen te horen, in al hun roepen tot U.","53":"Want U hebt hen voor Uzelf tot een erfdeel afgezonderd, uit alle volken van de aarde; zoals U gesproken hebt door de dienst van Mozes, Uw dienaar, toen U onze vaderen uit Egypte uitvoerde, Heere HEERE!","54":"En het gebeurde, toen Salomo dit hele gebed en deze smeking tot de HEERE geëindigd had te bidden, dat hij opstond van voor het altaar van de HEERE, van het knielen op zijn knieën, met zijn handen uitgebreid naar de hemel;","55":"zo stond hij, en zegende de hele gemeente van Israël, met luide stem, en zei:","56":"Geloofd zij de HEERE, Die aan Zijn volk Israël rust gegeven heeft, naar alles wat Hij gesproken heeft! Niet één woord is er gevallen van al Zijn goede woorden, die Hij gesproken heeft door de dienst van Mozes, Zijn dienaar.","57":"De HEERE, onze God, zij met ons, zoals Hij geweest is met onze vaderen; Hij verlate ons niet, en begeve ons niet;","58":"terwijl Hij ons hart tot Zich neigt, om in al Zijn wegen te wandelen, en om Zijn geboden te houden, en Zijn inzettingen, en Zijn rechten, die Hij onze vaderen geboden heeft.","59":"En dat deze mijn woorden, waarmee ik voor de HEERE gesmeekt heb, nabij mogen zijn bij de HEERE, onze God, dag en nacht; opdat Hij het recht van Zijn dienaar uitvoert, en het recht van Zijn volk Israël, elke dag opnieuw.","60":"Opdat alle volken van de aarde weten, dat de HEERE die God is, niemand anders.","61":"En uw hart zij volkomen met de HEERE, onze God, om te wandelen in Zijn inzettingen, en Zijn geboden te houden, zoals op deze dag.","62":"En de koning, en heel Israël met hem, offerden slachtoffers voor het aangezicht van de HEERE.","63":"En Salomo offerde als dankoffer, dat hij de HEERE offerde, tweeëntwintigduizend runderen, en honderdtwintigduizend schapen. Zo hebben zij het huis van de HEERE ingewijd, de koning en al de kinderen van Israël.","64":"Op diezelfde dag heiligde de koning het middelste van de voorhof, dat voor het huis van de HEERE was, omdat hij daar het brandoffer en het spijsoffer bereid had, alsook het vet van de dankoffers; want het koperen altaar, dat voor het aangezicht van de HEERE was, was te klein, om de brandoffers, en de spijsoffers, en het vet van de dankoffers te bevatten.","65":"Op diezelfde tijd hield Salomo ook het feest, en heel Israël met hem, een grote gemeente, vanaf de ingang van Hamath tot de rivier van Egypte, voor het aangezicht van de HEERE, onze God, zeven dagen en zeven dagen, dat is veertien dagen.","66":"Op de achtste dag liet hij het volk gaan, en zij zegenden de koning; daarna gingen zij naar hun tenten, blij en welgemoed vanwege al het goede, dat de HEERE aan David, Zijn dienaar, en aan Israël, Zijn volk, gedaan had."},"SV":{"1":"Toen vergaderde Salomo de oudsten van Israël, en al de hoofden der stammen, de oversten der vaderen, onder de kinderen Israëls, tot den koning Salomo te Jeruzalem, om de ark des verbonds des HEEREN op te brengen uit de stad Davids, dewelke is Sion.","2":"En alle mannen van Israël verzamelden zich tot den koning Salomo, in de maand Ethanim op het feest; die is de zevende maand.","3":"En al de oudsten van Israël kwamen; en de priesters namen de ark op.","4":"En zij brachten de ark des HEEREN en de tent der samenkomst opwaarts mitsgaders al de heilige vaten, die in de tent waren; en de priesters en de Levieten brachten dezelve opwaarts.","5":"De koning Salomo nu en de ganse vergadering van Israël, die bij hem vergaderd waren, waren met hem voor de ark, offerende schapen en runderen, die vanwege de menigte niet konden geteld, noch gerekend worden.","6":"Alzo brachten de priesteren de ark des verbonds des HEEREN tot haar plaats, tot de aanspraakplaats van het huis, tot het heilige der heiligen, tot onder de vleugelen der cherubim.","7":"Want de cherubim spreidden beide vleugelen over de plaats der ark; en de cherubim overdekten de ark en haar handbomen van boven.","8":"Daarna schoven zij de handbomen verder uit, dat de hoofden der handbomen gezien werden uit het heiligdom voor aan de aanspraakplaats, maar buiten niet gezien werden; en zij zijn aldaar tot op dezen dag.","9":"Er was niets in de ark, dan alleen de twee stenen tafelen, die Mozes bij Horeb daarin gelegd had, als de HEERE *een* *verbond* maakte met de kinderen Israëls, toen zij uit Egypteland uitgetogen waren.","10":"En het geschiedde, als de priesters uit het heilige uitgingen, dat een wolk het huis des HEEREN vervulde.","11":"En de priesters konden niet staan om te dienen, vanwege de wolk; want de heerlijkheid des HEEREN had het huis des HEEREN vervuld.","12":"Toen zeide Salomo: De HEERE heeft gezegd, dat Hij in donkerheid zou wonen.","13":"Ik heb immers een huis gebouwd, U ter woonstede, een vaste plaats tot Uw eeuwige woning.","14":"Daarna wendde de koning zijn aangezicht om, en zegende de ganse gemeente van Israël; en de ganse gemeente van Israël stond.","15":"En hij zeide: Geloofd zij de HEERE, de God Israëls, Die met Zijn mond tot mijn vader David gesproken heeft, en heeft het met Zijn hand vervuld, zeggende:","16":"Van dien dag af, dat Ik Mijn volk Israël uit Egypteland uitgevoerd heb, heb Ik geen stad verkoren uit alle stammen van Israël, om een huis te bouwen, dat Mijn Naam daar zou wezen; maar Ik heb David verkoren, dat hij over Mijn volk Israël wezen zou.","17":"Het was ook in het hart van mijn vader David, een huis den Naam van den HEERE, den God Israëls, te bouwen.","18":"Maar de HEERE zeide tot David, mijn vader: Dewijl dat in uw hart geweest is Mijn Naam een huis te bouwen, gij hebt welgedaan, dat het in uw hart geweest is.","19":"Evenwel gij zult dat huis niet bouwen; maar uw zoon, die uit uw lendenen voortkomen zal, die zal Mijn Naam dat huis bouwen.","20":"Zo heeft de HEERE bevestigd Zijn woord, dat Hij gesproken had; want ik ben opgestaan in de plaats van mijn vader David, en ik zit op den troon van Israël, gelijk als de HEERE gesproken heeft; en ik heb een huis gebouwd den Naam des HEEREN, des Gods van Israël.","21":"En ik heb daar een plaats beschikt voor de ark, waarin het verbond des HEEREN is, hetwelk Hij met onze vaderen maakte, als Hij hen uit Egypteland uitvoerde.","22":"En Salomo stond voor het altaar des HEEREN, tegenover de ganse gemeente van Israël, en breidde zijn handen uit naar den hemel;","23":"En hij zeide: HEERE, God van Israël, er is geen God, gelijk Gij, boven in den hemel, noch beneden op de aarde, houdende het verbond en de weldadigheid aan Uw knechten, die voor Uw aangezicht met hun ganse hart wandelen;","24":"Die Uw knecht, mijn vader David, gehouden hebt, wat Gij tot hem gesproken hadt; want met Uw mond hebt Gij gesproken, en met Uw hand vervuld, gelijk het te dezen dage is.","25":"En nu HEERE, God van Israël, houd Uw knecht, mijn vader David, wat Gij tot hem gesproken hebt, zeggende: Geen man zal u van voor Mijn aangezicht afgesneden worden, die op den troon van Israël zitte; alleenlijk zo uw zonen hun weg bewaren, om te wandelen voor Mijn aangezicht, gelijk als gij gewandeld hebt voor Mijn aangezicht.","26":"Nu dan, o God van Israël, laat toch Uw woord waar worden, hetwelk Gij gesproken hebt tot Uw knecht, mijn vader David.","27":"Maar waarlijk, zou God op de aarde wonen? Zie, de hemelen, ja, de hemel der hemelen zouden U niet begrijpen, hoeveel te min dit huis, dat ik gebouwd heb!","28":"Wend U dan nog tot het gebed van Uw knecht, en tot zijn smeking, o HEERE, mijn God, om te horen naar het geroep en naar het gebed, dat Uw knecht heden voor Uw aangezicht bidt.","29":"Dat Uw ogen open zijn, nacht en dag, over dit huis, over deze plaats, van dewelke Gij gezegd hebt: Mijn Naam zal daar zijn; om te horen naar het gebed, hetwelk Uw knecht bidden zal in deze plaats.","30":"Hoor dan naar de smeking van Uw knecht, en van Uw volk Israël, die in deze plaats zullen bidden; en Gij, hoor in de plaats Uwer woning, in den hemel, ja, hoor, en vergeef.","31":"Wanneer iemand tegen zijn naaste zal gezondigd hebben, en hij hem een eed des vloeks opgelegd zal hebben, om zichzelven te vervloeken; en de eed des vloeks voor Uw altaar in dit huis komen zal;","32":"Hoor Gij dan in den hemel, en doe, en richt Uw knechten, veroordelende den ongerechtige, gevende zijn weg op zijn hoofd, en rechtvaardigende den gerechtige, gevende hem naar zijn gerechtigheid.","33":"Wanneer Uw volk Israël zal geslagen worden voor het aangezicht des vijands, omdat zij tegen U gezondigd zullen hebben, en zich tot U bekeren, en Uw Naam belijden, en tot U in dit huis bidden en smeken zullen;","34":"Hoor Gij dan in den hemel, en vergeef de zonde van Uw volk Israël, en breng hen weder in het land, dat Gij hun vaderen gegeven hebt.","35":"Als de hemel zal gesloten zijn, dat er geen regen is, omdat zij tegen U gezondigd zullen hebben; en zij in deze plaats bidden, en Uw Naam belijden, en van hun zonden zich bekeren zullen, als Gij hen geplaagd zult hebben;","36":"Hoor Gij dan in den hemel, en vergeef de zonde van Uw knechten en van Uw volk Israël, als Gij hun zult geleerd hebben den goeden weg in denwelken zij wandelen zullen; en geef regen op Uw land, dat Gij Uw volk tot een erfenis gegeven hebt.","37":"Als er honger in het land wezen zal, als er pest wezen zal, als er brandkoren, honigdauw, sprinkhanen, kevers wezen zullen, als zijn vijand in het land zijner poorten hem belegeren zal, *of* enige plage, *of* enige krankheid wezen zal;","38":"Alle gebed, alle smeking, die van enig mens, van al Uw volk Israël, geschieden zal; als zij erkennen, een ieder de plage zijns harten, en *een* *ieder* zijn handen in dit huis uitbreiden zal;","39":"Hoor Gij dan in den hemel, de vaste plaats Uwer woning, en vergeef, en doe, en geef een iegelijk naar al zijn wegen, gelijk Gij zijn hart kent; want Gij alleen kent het hart van alle kinderen der mensen;","40":"Opdat zij U vrezen al de dagen, die zij leven zullen in het land, dat Gij onzen vaderen gegeven hebt.","41":"Zelfs ook aangaande den vreemde, die van Uw volk Israël niet zal zijn, maar uit verren lande om Uws Naams wil komen zal;","42":"( Want zij zullen horen van Uw groten Naam, en van Uw sterke hand, en van Uw uitgestrekten arm) als hij komen en bidden zal in dit huis;","43":"Hoor Gij in den hemel, de vaste plaats Uwer woning, en doe naar alles, waarom die vreemde tot U roepen zal; opdat alle volken der aarde Uw Naam kennen, om U te vrezen, gelijk Uw volk Israël, en om te weten, dat Uw Naam genoemd wordt over dit huis, hetwelk ik gebouwd heb.","44":"Wanneer Uw volk in den krijg tegen zijn vijand uittrekken zal door den weg, dien Gij hen henen zenden zult, en zullen tot den HEERE bidden naar den weg dezer stad, die Gij verkoren hebt, en naar dit huis, hetwelk ik Uw Naam gebouwd heb;","45":"Hoor dan in den hemel hun gebed en hun smeking, en voer hun recht uit.","46":"Wanneer zij gezondigd zullen hebben tegen U ( want geen mens is er, die niet zondigt), en Gij tegen hen vertoornd zult zijn, en hen leveren zult voor het aangezicht des vijands, dat degenen, die hen gevangen hebben, hen gevankelijk wegvoeren in des vijands land, dat verre of nabij is.","47":"En zij in het land, waar zij gevankelijk weggevoerd zijn, weder aan hun hart brengen zullen, dat zij zich bekeren, en tot U smeken in het land dergenen, die ze gevankelijk weggevoerd hebben, zeggende: Wij hebben gezondigd, en verkeerdelijk gedaan, wij hebben goddelooslijk gehandeld;","48":"En zij zich tot U bekeren, met hun ganse hart, en met hun ganse ziel, in het land hunner vijanden, die hen gevankelijk weggevoerd zullen hebben; en tot U bidden zullen naar den weg van hun land ( hetwelk Gij hun vaderen gegeven hebt), naar deze stad, die Gij verkoren hebt, en naar dit huis, dat ik Uw Naam gebouwd heb;","49":"Hoor dan in den hemel, de vaste plaats Uwer woning, hun gebed en hun smeking en voer hun recht uit;","50":"En vergeef aan Uw volk, dat zij tegen U gezondigd zullen hebben, en al hun overtredingen, waarmede zij tegen U zullen overtreden hebben; en geef hun barmhartigheid voor het aangezicht dergenen, die ze gevangen houden, opdat zij zich hunner ontfermen;","51":"Want zij zijn Uw volk en Uw erfdeel, die Gij uitgevoerd hebt uit Egypteland, uit het midden des ijzeren ovens;","52":"Opdat Uw ogen open zijn tot de smeking van Uw knecht, en tot de smeking van Uw volk Israël, om naar hen te horen, in al hun roepen tot U.","53":"Want Gij hebt hen U tot een erfdeel afgezonderd, uit alle volken der aarde; gelijk als Gij gesproken hebt door den dienst van Mozes, Uw knecht, als Gij onze vaderen uit Egypte uitvoerdet, Heere HEERE!","54":"Het geschiedde nu, als Salomo voleind had dit ganse gebed, en deze smeking tot den HEERE te bidden, *dat* hij van voor het altaar des HEEREN opstond, van het knielen op zijn knieën, met zijn handen uitgebreid naar den hemel;","55":"Zo stond hij, en zegende de ganse gemeente van Israël, zeggende met luider stem:","56":"Geloofd zij de HEERE, Die aan Zijn volk Israël rust gegeven heeft, naar alles, wat Hij gesproken heeft! Niet een enig woord is er gevallen van al Zijn goede woorden, die Hij gesproken heeft door den dienst van Mozes, Zijn knecht.","57":"De HEERE, onze God, zij met ons, gelijk als Hij geweest is met onze vaderen; Hij verlate ons niet, en begeve ons niet;","58":"Neigende tot Zich ons hart, om in al Zijn wegen te wandelen, en om te houden Zijn geboden, en Zijn inzettingen, en Zijn rechten, dewelke Hij onzen vaderen geboden heeft.","59":"En dat deze mijn woorden, waarmede ik voor den HEERE gesmeekt heb, mogen nabij zijn voor den HEERE, onzen God, dag en nacht; opdat Hij het recht van Zijn knecht uitvoere, en het recht van Zijn volk Israël, elkeen dagelijks op zijn dag.","60":"Opdat alle volken der aarde weten, dat de HEERE die God is, niemand meer;","61":"En ulieder hart volkomen zij met den HEERE, onzen God, om te wandelen in Zijn inzettingen, en Zijn geboden te houden, gelijk te dezen dage.","62":"En de koning, en gans Israël met hem, offerden slachtofferen voor het aangezicht des HEEREN.","63":"En Salomo offerde ten dankoffer, dat hij den HEERE offerde, twee en twintig duizend runderen, en honderd en twintig duizend schapen. Alzo hebben zij het huis des HEEREN ingewijd, de koning en al de kinderen Israëls.","64":"Ten zelfden dage heiligde de koning het middelste des voorhofs, dat voor het huis des HEEREN was, omdat hij aldaar het brandoffer en het spijsoffer bereid had, mitsgaders het vet der dankofferen; want het koperen altaar, dat voor het aangezicht des HEEREN was, was te klein, om de brandofferen, en de spijsofferen, en het vet der dankofferen te vatten.","65":"Terzelfder tijd ook hield Salomo het feest, en gans Israël met hem, een grote gemeente, van den ingang af van Hamath tot de rivier van Egypte, voor het aangezicht des HEEREN, onzes Gods, zeven dagen en zeven dagen, zijnde veertien dagen.","66":"Op den achtsten dag liet hij het volk gaan, en zij zegenden den koning; daarna gingen zij naar hun tenten, blijde en goedsmoeds over al het goede, dat de HEERE aan David, Zijn knecht, en aan Israël, Zijn volk, gedaan had."},"KJV":{"1":"Then Solomon assembled the elders of Israel, and all the heads of the tribes, the chief of the fathers of the children of Israel, unto king Solomon in Jerusalem, that they might bring up the ark of the covenant of the LORD out of the city of David, which is Zion.","2":"And all the men of Israel assembled themselves unto king Solomon at the feast in the month Ethanim, which is the seventh month.","3":"And all the elders of Israel came, and the priests took up the ark.","4":"And they brought up the ark of the LORD, and the tabernacle of the congregation, and all the holy vessels that were in the tabernacle, even those did the priests and the Levites bring up.","5":"And king Solomon, and all the congregation of Israel, that were assembled unto him, were with him before the ark, sacrificing sheep and oxen, that could not be told nor numbered for multitude.","6":"And the priests brought in the ark of the covenant of the LORD unto his place, into the oracle of the house, to the most holy place, even under the wings of the cherubims.","7":"For the cherubims spread forth their two wings over the place of the ark, and the cherubims covered the ark and the staves thereof above.","8":"And they drew out the staves, that the ends of the staves were seen out in the holy place before the oracle, and they were not seen without: and there they are unto this day.","9":"There was nothing in the ark save the two tables of stone, which Moses put there at Horeb, when the LORD made a covenant with the children of Israel, when they came out of the land of Egypt.","10":"And it came to pass, when the priests were come out of the holy place, that the cloud filled the house of the LORD,","11":"So that the priests could not stand to minister because of the cloud: for the glory of the LORD had filled the house of the LORD.","12":"Then spake Solomon, The LORD said that he would dwell in the thick darkness.","13":"I have surely built thee an house to dwell in, a settled place for thee to abide in for ever.","14":"And the king turned ➔ his face about, and blessed all the congregation of Israel: (and all the congregation of Israel stood;)","15":"And he said, Blessed be the LORD God of Israel, which spake with his mouth unto David my father, and hath with his hand fulfilled it, saying,","16":"Since the day that I brought forth my people Israel out of Egypt, I chose no city out of all the tribes of Israel to build an house, that my name might be therein; but I chose David to be over my people Israel.","17":"And it was in the heart of David my father to build an house for the name of the LORD God of Israel.","18":"And the LORD said unto David my father, Whereas it was in thine heart to build an house unto my name, thou didst well that it was in thine heart.","19":"Nevertheless thou shalt not build the house; but thy son that shall come forth out of thy loins, he shall build the house unto my name.","20":"And the LORD hath performed his word that he spake, and I am risen up in the room of David my father, and sit on the throne of Israel, as the LORD promised, and have built an house for the name of the LORD God of Israel.","21":"And I have set there a place for the ark, wherein is the covenant of the LORD, which he made with our fathers, when he brought them out of the land of Egypt.","22":"And Solomon stood before the altar of the LORD in the presence of all the congregation of Israel, and spread forth his hands toward heaven:","23":"And he said, LORD God of Israel, there is no God like thee, in heaven above, or on earth beneath, who keepest covenant and mercy with thy servants that walk before thee with all their heart:","24":"Who hast kept with thy servant David my father that thou promisedst him: thou spakest also with thy mouth, and hast fulfilled it with thine hand, as it is this day.","25":"Therefore now, LORD God of Israel, keep with thy servant David my father that thou promisedst him, saying, There shall not fail thee a man in my sight to sit on the throne of Israel; so that thy children take heed to their way, that they walk before me as thou hast walked before me.","26":"And now, O God of Israel, let thy word, I pray thee, be verified, which thou spakest unto thy servant David my father.","27":"But will God indeed dwell on the earth? behold, the heaven and heaven of heavens cannot contain thee; how much less this house that I have builded?","28":"Yet have thou respect unto the prayer of thy servant, and to his supplication, O LORD my God, to hearken unto the cry and to the prayer, which thy servant prayeth before thee to day:","29":"That thine eyes may be open toward this house night and day, even toward the place of which thou hast said, My name shall be there: that thou mayest hearken unto the prayer which thy servant shall make toward this place.","30":"And hearken thou to the supplication of thy servant, and of thy people Israel, when they shall pray toward this place: and hear thou in heaven thy dwelling place: and when thou hearest, forgive.","31":"If any man trespass against his neighbour, and an oath be laid upon him to cause him to swear, and the oath come before thine altar in this house:","32":"Then hear thou in heaven, and do, and judge thy servants, condemning the wicked, to bring his way upon his head; and justifying the righteous, to give him according to his righteousness.","33":"When thy people Israel be smitten down before the enemy, because they have sinned against thee, and shall turn again to thee, and confess thy name, and pray, and make supplication unto thee in this house:","34":"Then hear thou in heaven, and forgive the sin of thy people Israel, and bring them again unto the land which thou gavest unto their fathers.","35":"When heaven is shut up, and there is no rain, because they have sinned against thee; if they pray toward this place, and confess thy name, and turn from their sin, when thou afflictest them:","36":"Then hear thou in heaven, and forgive the sin of thy servants, and of thy people Israel, that thou teach them the good way wherein they should walk, and give rain upon thy land, which thou hast given to thy people for an inheritance.","37":"If there be in the land famine, if there be pestilence, blasting, mildew, locust, or if there be caterpiller; if their enemy besiege them in the land of their cities; whatsoever plague, whatsoever sickness there be;","38":"What prayer and supplication soever be made by any man, or by all thy people Israel, which shall know every man the plague of his own heart, and spread forth his hands toward this house:","39":"Then hear thou in heaven thy dwelling place, and forgive, and do, and give to every man according to his ways, whose heart thou knowest; (for thou, even thou only, knowest the hearts of all the children of men;)","40":"That they may fear thee all the days that they live in the land which thou gavest unto our fathers.","41":"Moreover concerning a stranger, that is not of thy people Israel, but cometh out of a far country for thy name's sake;","42":"(For they shall hear of thy great name, and of thy strong hand, and of thy stretched out arm;) when he shall come and pray toward this house;","43":"Hear thou in heaven thy dwelling place, and do according to all that the stranger calleth to thee for: that all people of the earth may know thy name, to fear thee, as do thy people Israel; and that they may know that this house, which I have builded, is called by thy name.","44":"If thy people go out to battle against their enemy, whithersoever thou shalt send them, and shall pray unto the LORD toward the city which thou hast chosen, and toward the house that I have built for thy name:","45":"Then hear thou in heaven their prayer and their supplication, and maintain their cause.","46":"If they sin against thee, (for there is no man that sinneth not,) and thou be angry with them, and deliver them to the enemy, so that they carry them away captives unto the land of the enemy, far or near;","47":"Yet if they shall bethink themselves in the land whither they were carried captives, and repent, and make supplication unto thee in the land of them that carried them captives, saying, We have sinned, and have done perversely, we have committed wickedness;","48":"And so return unto thee with all their heart, and with all their soul, in the land of their enemies, which led them away captive, and pray unto thee toward their land, which thou gavest unto their fathers, the city which thou hast chosen, and the house which I have built for thy name:","49":"Then hear thou their prayer and their supplication in heaven thy dwelling place, and maintain their cause,","50":"And forgive thy people that have sinned against thee, and all their transgressions wherein they have transgressed against thee, and give them compassion before them who carried them captive, that they may have compassion on them:","51":"For they be thy people, and thine inheritance, which thou broughtest forth out of Egypt, from the midst of the furnace of iron:","52":"That thine eyes may be open unto the supplication of thy servant, and unto the supplication of thy people Israel, to hearken unto them in all that they call for unto thee.","53":"For thou didst separate them from among all the people of the earth, to be thine inheritance, as thou spakest by the hand of Moses thy servant, when thou broughtest our fathers out of Egypt, O Lord GOD.","54":"And it was so, that when Solomon had made an end of praying all this prayer and supplication unto the LORD, he arose from before the altar of the LORD, from kneeling on his knees with his hands spread up to heaven.","55":"And he stood, and blessed all the congregation of Israel with a loud voice, saying,","56":"Blessed be the LORD, that hath given rest unto his people Israel, according to all that he promised: there hath not failed one word of all his good promise, which he promised by the hand of Moses his servant.","57":"The LORD our God be with us, as he was with our fathers: let him not leave us, nor forsake us:","58":"That he may incline our hearts unto him, to walk in all his ways, and to keep his commandments, and his statutes, and his judgments, which he commanded our fathers.","59":"And let these my words, wherewith I have made supplication before the LORD, be nigh unto the LORD our God day and night, that he maintain the cause of his servant, and the cause of his people Israel at all times, as the matter shall require:","60":"That all the people of the earth may know that the LORD is God, and that there is none else.","61":"Let your heart therefore be perfect with the LORD our God, to walk in his statutes, and to keep his commandments, as at this day.","62":"And the king, and all Israel with him, offered sacrifice before the LORD.","63":"And Solomon offered a sacrifice of peace offerings, which he offered unto the LORD, two and twenty thousand oxen, and an hundred and twenty thousand sheep. So the king and all the children of Israel dedicated the house of the LORD.","64":"The same day did the king hallow the middle of the court that was before the house of the LORD: for there he offered burnt offerings, and meat offerings, and the fat of the peace offerings: because the brasen altar that was before the LORD was too little to receive the burnt offerings, and meat offerings, and the fat of the peace offerings.","65":"And at that time Solomon held a feast, and all Israel with him, a great congregation, from the entering in of Hamath unto the river of Egypt, before the LORD our God, seven days and seven days, even fourteen days.","66":"On the eighth day he sent ➔ the people away: and they blessed the king, and went unto their tents joyful and glad of heart for all the goodness that the LORD had done for David his servant, and for Israel his people."}},"tsk":{"1":[{"kopje":"Salomo","refs":["2 Kron 5:2-10"]},{"kopje":"verzamelde","refs":["Joz 23:2","Joz 24:1","1 Kron 28:1","2 Kron 30:1","Ezra 3:1"]},{"kopje":"leiders van de vaderen","refs":["Num 7:3"]},{"kopje":"op te brengen","refs":["2 Sam 6:1","2 Sam 6:2","2 Sam 6:6","2 Sam 6:12","1 Kron 13:1-5","1 Kron 15:3","1 Kron 15:25"]},{"kopje":"uit de stad","refs":["1 Kon 3:15","2 Sam 5:7-9","2 Sam 6:12-17","1 Kron 11:7","1 Kron 15:29","1 Kron 16:1","Ps 9:12","Ps 102:22","Jes 28:16","Jes 46:1  class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> unto <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> that they might bring <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> of the <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> out of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> which is <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion.</span>","2":"And all the <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H6950\">assembled</span> themselves unto <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> at the <span class=\"wl wl-kjv\" data-code=\"H2282\">feast</span> in the <span class=\"wl wl-kjv\" data-code=\"H3391\">month</span> <span class=\"wl wl-kjv\" data-code=\"H388\">Ethanim,</span> which is the <span class=\"wl wl-kjv\" data-code=\"H7637\">seventh</span> <span class=\"wl wl-kjv\" data-code=\"H2320\">month.</span>","3":"And all the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> took <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H727\">ark.</span>","4":"And they brought <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the <span class=\"wl wl-kjv\" data-code=\"H4150\">congregation,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels</span> that were in the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle,</span> even those did the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> and the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> bring <span class=\"wl wl-kjv\" data-code=\"H5927\">up.</span>","5":"And <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> that were <span class=\"wl wl-kjv\" data-code=\"H3259\">assembled</span> unto him, were with him <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H727\">ark,</span> <span class=\"wl wl-kjv\" data-code=\"H2076\">sacrificing</span> <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep</span> and <span class=\"wl wl-kjv\" data-code=\"H1241\">oxen,</span> that could not be <span class=\"wl wl-kjv\" data-code=\"H5608\">told</span> nor <span class=\"wl wl-kjv\" data-code=\"H4487\">numbered</span> for <span class=\"wl wl-kjv\" data-code=\"H7230\">multitude.</span>","6":"And the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> brought <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> of the <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> unto his <span class=\"wl wl-kjv\" data-code=\"H4725\">place,</span> into the <span class=\"wl wl-kjv\" data-code=\"H1687\">oracle</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> to the <span class=\"wl wl-kjv\" data-code=\"H6944\">most</span> <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> place, even under the <span class=\"wl wl-kjv\" data-code=\"H3671\">wings</span> of the <span class=\"wl wl-kjv\" data-code=\"H3742\">cherubims.</span>","7":"For the <span class=\"wl wl-kjv\" data-code=\"H3742\">cherubims</span> spread <span class=\"wl wl-kjv\" data-code=\"H6566\">forth</span> their two <span class=\"wl wl-kjv\" data-code=\"H3671\">wings</span> over the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> of the <span class=\"wl wl-kjv\" data-code=\"H727\">ark,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3742\">cherubims</span> <span class=\"wl wl-kjv\" data-code=\"H5526\">covered</span> the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> and the <span class=\"wl wl-kjv\" data-code=\"H905\">staves</span> thereof <span class=\"wl wl-kjv\" data-code=\"H4605\">above.</span>","8":"And they drew <span class=\"wl wl-kjv\" data-code=\"H748\">out</span> the <span class=\"wl wl-kjv\" data-code=\"H905\">staves,</span> that the <span class=\"wl wl-kjv\" data-code=\"H7218\">ends</span> of the <span class=\"wl wl-kjv\" data-code=\"H905\">staves</span> were seen <span class=\"wl wl-kjv\" data-code=\"H7200\">out</span> in the <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> place <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H1687\">oracle,</span> and they were not <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> <span class=\"wl wl-kjv\" data-code=\"H2351\">without:</span> and there they are unto this <span class=\"wl wl-kjv\" data-code=\"H3117\">day.</span>","9":"There was nothing in the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> <span class=\"wl wl-kjv\" data-code=\"H7535\">save</span> the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H3871\">tables</span> of <span class=\"wl wl-kjv\" data-code=\"H68\">stone,</span> which <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H3240\">put</span> there at <span class=\"wl wl-kjv\" data-code=\"H2722\">Horeb,</span> when the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H3772\">made</span> a covenant with the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> when they came <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt.</span>","10":"And it came to pass, when the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> were come <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> place, that the <span class=\"wl wl-kjv\" data-code=\"H6051\">cloud</span> <span class=\"wl wl-kjv\" data-code=\"H4390\">filled</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span>","11":"So that the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> <span class=\"wl wl-kjv\" data-code=\"H3201\">could</span> not <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> to <span class=\"wl wl-kjv\" data-code=\"H8334\">minister</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">because</span> of the <span class=\"wl wl-kjv\" data-code=\"H6051\">cloud:</span> for the <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> had <span class=\"wl wl-kjv\" data-code=\"H4390\">filled</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","12":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon,</span> The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> that he would <span class=\"wl wl-kjv\" data-code=\"H7931\">dwell</span> in the thick <span class=\"wl wl-kjv\" data-code=\"H6205\">darkness.</span>","13":"I have <span class=\"wl wl-kjv\" data-code=\"H1129\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> thee an <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> to dwell <span class=\"wl wl-kjv\" data-code=\"H2073\">in,</span> a settled <span class=\"wl wl-kjv\" data-code=\"H4349\">place</span> for thee to abide <span class=\"wl wl-kjv\" data-code=\"H3427\">in</span> for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever.</span>","14":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H5437\">turned</span> ➔ his <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> <span class=\"wl wl-kjv\" data-code=\"H5437\">about,</span> and <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed</span> all the <span class=\"wl wl-kjv\" data-code=\"H6951\">congregation</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> (and all the <span class=\"wl wl-kjv\" data-code=\"H6951\">congregation</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">stood;)</span>","15":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H1288\">Blessed</span> be the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> which <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> with his <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> unto <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> my <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> and hath with his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> <span class=\"wl wl-kjv\" data-code=\"H4390\">fulfilled</span> it, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span>","16":"Since the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that I brought <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> out of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> I <span class=\"wl wl-kjv\" data-code=\"H977\">chose</span> no <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> out of all the <span class=\"wl wl-kjv\" data-code=\"H7626\">tribes</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> to <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> an <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> that my <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> might be therein; but I <span class=\"wl wl-kjv\" data-code=\"H977\">chose</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> to be over my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","17":"And it was in the <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> my <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> to <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> an <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> for the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","18":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> my <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> <span class=\"wl wl-kjv\" data-code=\"H3282\">Whereas</span> it was in thine <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> to <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> an <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> unto my <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> thou didst <span class=\"wl wl-kjv\" data-code=\"H2895\">well</span> that it was in thine <span class=\"wl wl-kjv\" data-code=\"H3824\">heart.</span>","19":"<span class=\"wl wl-kjv\" data-code=\"H7535\">Nevertheless</span> thou shalt not <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house;</span> but thy <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> that shall come forth <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of thy <span class=\"wl wl-kjv\" data-code=\"H2504\">loins,</span> he shall <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> unto my <span class=\"wl wl-kjv\" data-code=\"H8034\">name.</span>","20":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H6965\">performed</span> his <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> that he <span class=\"wl wl-kjv\" data-code=\"H1696\">spake,</span> and I am risen <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> in the room of <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> my <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">sit</span> on the <span class=\"wl wl-kjv\" data-code=\"H3678\">throne</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">promised,</span> and have <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> an <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> for the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","21":"And I have <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> there a <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> for the <span class=\"wl wl-kjv\" data-code=\"H727\">ark,</span> wherein is the <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> which he <span class=\"wl wl-kjv\" data-code=\"H3772\">made</span> with our <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> when he brought them <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt.</span>","22":"And <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> in the presence <span class=\"wl wl-kjv\" data-code=\"H5048\">of</span> all the <span class=\"wl wl-kjv\" data-code=\"H6951\">congregation</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and spread <span class=\"wl wl-kjv\" data-code=\"H6566\">forth</span> his <span class=\"wl wl-kjv\" data-code=\"H3709\">hands</span> toward <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven:</span>","23":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> there is no <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> like thee, in <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> <span class=\"wl wl-kjv\" data-code=\"H4605\">above,</span> or on <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> beneath, who <span class=\"wl wl-kjv\" data-code=\"H8104\">keepest</span> <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> and <span class=\"wl wl-kjv\" data-code=\"H2617\">mercy</span> with thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> that <span class=\"wl wl-kjv\" data-code=\"H1980\">walk</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thee with all their <span class=\"wl wl-kjv\" data-code=\"H3820\">heart:</span>","24":"Who hast <span class=\"wl wl-kjv\" data-code=\"H8104\">kept</span> with thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> my <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> that thou <span class=\"wl wl-kjv\" data-code=\"H1696\">promisedst</span> him: thou <span class=\"wl wl-kjv\" data-code=\"H1696\">spakest</span> also with thy <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> and hast <span class=\"wl wl-kjv\" data-code=\"H4390\">fulfilled</span> it with thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> as it is this <span class=\"wl wl-kjv\" data-code=\"H3117\">day.</span>","25":"Therefore now, <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> with thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> my <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> that thou <span class=\"wl wl-kjv\" data-code=\"H1696\">promisedst</span> him, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> There shall not <span class=\"wl wl-kjv\" data-code=\"H3772\">fail</span> thee a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> in my <span class=\"wl wl-kjv\" data-code=\"H6440\">sight</span> to <span class=\"wl wl-kjv\" data-code=\"H3427\">sit</span> on the <span class=\"wl wl-kjv\" data-code=\"H3678\">throne</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> <span class=\"wl wl-kjv\" data-code=\"H7535\">so</span> that thy <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> take <span class=\"wl wl-kjv\" data-code=\"H8104\">heed</span> to their <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> that they <span class=\"wl wl-kjv\" data-code=\"H3212\">walk</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> me as thou hast <span class=\"wl wl-kjv\" data-code=\"H1980\">walked</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> me.","26":"And now, O <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> let thy <span class=\"wl wl-kjv\" data-code=\"H1697\">word,</span> I pray thee, be <span class=\"wl wl-kjv\" data-code=\"H539\">verified,</span> which thou <span class=\"wl wl-kjv\" data-code=\"H1696\">spakest</span> unto thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> my <span class=\"wl wl-kjv\" data-code=\"H1\">father.</span>","27":"But will <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H552\">indeed</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> on the <span class=\"wl wl-kjv\" data-code=\"H776\">earth?</span> behold, the <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> and <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> of <span class=\"wl wl-kjv\" data-code=\"H8064\">heavens</span> cannot <span class=\"wl wl-kjv\" data-code=\"H3557\">contain</span> thee; how much <span class=\"wl wl-kjv\" data-code=\"H637\">less</span> this <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> that I have <span class=\"wl wl-kjv\" data-code=\"H1129\">builded?</span>","28":"Yet have thou <span class=\"wl wl-kjv\" data-code=\"H6437\">respect</span> unto the <span class=\"wl wl-kjv\" data-code=\"H8605\">prayer</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant,</span> and to his <span class=\"wl wl-kjv\" data-code=\"H8467\">supplication,</span> O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> my <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> to <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> unto the <span class=\"wl wl-kjv\" data-code=\"H7440\">cry</span> and to the <span class=\"wl wl-kjv\" data-code=\"H8605\">prayer,</span> which thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H6419\">prayeth</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thee to <span class=\"wl wl-kjv\" data-code=\"H3117\">day:</span>","29":"That thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> may be <span class=\"wl wl-kjv\" data-code=\"H6605\">open</span> toward this <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> <span class=\"wl wl-kjv\" data-code=\"H3915\">night</span> and <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> even toward the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> of which thou hast <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> My <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> shall be there: that thou mayest <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> unto the <span class=\"wl wl-kjv\" data-code=\"H8605\">prayer</span> which thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> shall <span class=\"wl wl-kjv\" data-code=\"H6419\">make</span> toward this <span class=\"wl wl-kjv\" data-code=\"H4725\">place.</span>","30":"And <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> thou to the <span class=\"wl wl-kjv\" data-code=\"H8467\">supplication</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant,</span> and of thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> when they shall <span class=\"wl wl-kjv\" data-code=\"H6419\">pray</span> toward this <span class=\"wl wl-kjv\" data-code=\"H4725\">place:</span> and <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> thou in <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> thy <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelling</span> <span class=\"wl wl-kjv\" data-code=\"H4725\">place:</span> and when thou <span class=\"wl wl-kjv\" data-code=\"H8085\">hearest,</span> <span class=\"wl wl-kjv\" data-code=\"H5545\">forgive.</span>","31":"If any <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H2398\">trespass</span> against his <span class=\"wl wl-kjv\" data-code=\"H7453\">neighbour,</span> and an <span class=\"wl wl-kjv\" data-code=\"H423\">oath</span> be <span class=\"wl wl-kjv\" data-code=\"H5375\">laid</span> upon him to cause him to <span class=\"wl wl-kjv\" data-code=\"H422\">swear,</span> and the <span class=\"wl wl-kjv\" data-code=\"H423\">oath</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thine <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> in this <span class=\"wl wl-kjv\" data-code=\"H1004\">house:</span>","32":"Then <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> thou in <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">do,</span> and <span class=\"wl wl-kjv\" data-code=\"H8199\">judge</span> thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> <span class=\"wl wl-kjv\" data-code=\"H7561\">condemning</span> the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked,</span> to <span class=\"wl wl-kjv\" data-code=\"H5414\">bring</span> his <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> upon his <span class=\"wl wl-kjv\" data-code=\"H7218\">head;</span> and <span class=\"wl wl-kjv\" data-code=\"H6663\">justifying</span> the <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous,</span> to <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> him according to his <span class=\"wl wl-kjv\" data-code=\"H6666\">righteousness.</span>","33":"When thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> be smitten <span class=\"wl wl-kjv\" data-code=\"H5062\">down</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H341\">enemy,</span> because they have <span class=\"wl wl-kjv\" data-code=\"H2398\">sinned</span> against thee, and shall turn <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> to thee, and <span class=\"wl wl-kjv\" data-code=\"H3034\">confess</span> thy <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> and <span class=\"wl wl-kjv\" data-code=\"H6419\">pray,</span> and make <span class=\"wl wl-kjv\" data-code=\"H2603\">supplication</span> unto thee in this <span class=\"wl wl-kjv\" data-code=\"H1004\">house:</span>","34":"Then <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> thou in <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> and <span class=\"wl wl-kjv\" data-code=\"H5545\">forgive</span> the <span class=\"wl wl-kjv\" data-code=\"H2403\">sin</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and bring them <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> unto the <span class=\"wl wl-kjv\" data-code=\"H127\">land</span> which thou <span class=\"wl wl-kjv\" data-code=\"H5414\">gavest</span> unto their <span class=\"wl wl-kjv\" data-code=\"H1\">fathers.</span>","35":"When <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> is shut <span class=\"wl wl-kjv\" data-code=\"H6113\">up,</span> and there is no <span class=\"wl wl-kjv\" data-code=\"H4306\">rain,</span> because they have <span class=\"wl wl-kjv\" data-code=\"H2398\">sinned</span> against thee; if they <span class=\"wl wl-kjv\" data-code=\"H6419\">pray</span> toward this <span class=\"wl wl-kjv\" data-code=\"H4725\">place,</span> and <span class=\"wl wl-kjv\" data-code=\"H3034\">confess</span> thy <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">turn</span> from their <span class=\"wl wl-kjv\" data-code=\"H2403\">sin,</span> when thou <span class=\"wl wl-kjv\" data-code=\"H6031\">afflictest</span> them:","36":"Then <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> thou in <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> and <span class=\"wl wl-kjv\" data-code=\"H5545\">forgive</span> the <span class=\"wl wl-kjv\" data-code=\"H2403\">sin</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> and of thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> that thou <span class=\"wl wl-kjv\" data-code=\"H3384\">teach</span> them the <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> wherein they should <span class=\"wl wl-kjv\" data-code=\"H3212\">walk,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> <span class=\"wl wl-kjv\" data-code=\"H4306\">rain</span> upon thy <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> which thou hast <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> to thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> for an <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance.</span>","37":"If there be in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> <span class=\"wl wl-kjv\" data-code=\"H7458\">famine,</span> if there be <span class=\"wl wl-kjv\" data-code=\"H1698\">pestilence,</span> <span class=\"wl wl-kjv\" data-code=\"H7711\">blasting,</span> <span class=\"wl wl-kjv\" data-code=\"H3420\">mildew,</span> <span class=\"wl wl-kjv\" data-code=\"H697\">locust,</span> or if there be <span class=\"wl wl-kjv\" data-code=\"H2625\">caterpiller;</span> if their <span class=\"wl wl-kjv\" data-code=\"H341\">enemy</span> <span class=\"wl wl-kjv\" data-code=\"H6887\">besiege</span> them in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of their <span class=\"wl wl-kjv\" data-code=\"H8179\">cities;</span> whatsoever <span class=\"wl wl-kjv\" data-code=\"H5061\">plague,</span> whatsoever <span class=\"wl wl-kjv\" data-code=\"H4245\">sickness</span> there be;","38":"What <span class=\"wl wl-kjv\" data-code=\"H8605\">prayer</span> and <span class=\"wl wl-kjv\" data-code=\"H8467\">supplication</span> soever be made by any <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> or by all thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> which shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> the <span class=\"wl wl-kjv\" data-code=\"H5061\">plague</span> of his own <span class=\"wl wl-kjv\" data-code=\"H3824\">heart,</span> and spread <span class=\"wl wl-kjv\" data-code=\"H6566\">forth</span> his <span class=\"wl wl-kjv\" data-code=\"H3709\">hands</span> toward this <span class=\"wl wl-kjv\" data-code=\"H1004\">house:</span>","39":"Then <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> thou in <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> thy <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelling</span> <span class=\"wl wl-kjv\" data-code=\"H4349\">place,</span> and <span class=\"wl wl-kjv\" data-code=\"H5545\">forgive,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">do,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> to every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> according to his <span class=\"wl wl-kjv\" data-code=\"H1870\">ways,</span> whose <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> thou <span class=\"wl wl-kjv\" data-code=\"H3045\">knowest;</span> (for thou, even thou only, <span class=\"wl wl-kjv\" data-code=\"H3045\">knowest</span> the <span class=\"wl wl-kjv\" data-code=\"H3824\">hearts</span> of all the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">men;)</span>","40":"That they may <span class=\"wl wl-kjv\" data-code=\"H3372\">fear</span> thee all the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> that they <span class=\"wl wl-kjv\" data-code=\"H2416\">live</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">in</span> the <span class=\"wl wl-kjv\" data-code=\"H127\">land</span> which thou <span class=\"wl wl-kjv\" data-code=\"H5414\">gavest</span> unto our <span class=\"wl wl-kjv\" data-code=\"H1\">fathers.</span>","41":"Moreover concerning a <span class=\"wl wl-kjv\" data-code=\"H5237\">stranger,</span> that is not of thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> but cometh <span class=\"wl wl-kjv\" data-code=\"H935\">out</span> of a <span class=\"wl wl-kjv\" data-code=\"H7350\">far</span> <span class=\"wl wl-kjv\" data-code=\"H776\">country</span> <span class=\"wl wl-kjv\" data-code=\"H4616\">for</span> thy <span class=\"wl wl-kjv\" data-code=\"H8034\">name's</span> sake;","42":"(For they shall <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> of thy <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> and of thy <span class=\"wl wl-kjv\" data-code=\"H2389\">strong</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and of thy stretched <span class=\"wl wl-kjv\" data-code=\"H5186\">out</span> <span class=\"wl wl-kjv\" data-code=\"H2220\">arm;)</span> when he shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> and <span class=\"wl wl-kjv\" data-code=\"H6419\">pray</span> toward this <span class=\"wl wl-kjv\" data-code=\"H1004\">house;</span>","43":"<span class=\"wl wl-kjv\" data-code=\"H8085\">Hear</span> thou in <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> thy <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelling</span> <span class=\"wl wl-kjv\" data-code=\"H4349\">place,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> according to all that the <span class=\"wl wl-kjv\" data-code=\"H5237\">stranger</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">calleth</span> to thee for: that all <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> may <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> thy <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> to <span class=\"wl wl-kjv\" data-code=\"H3372\">fear</span> thee, as do thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> and that they may <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that this <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> which I have <span class=\"wl wl-kjv\" data-code=\"H1129\">builded,</span> is <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> by thy <span class=\"wl wl-kjv\" data-code=\"H8034\">name.</span>","44":"If thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> go <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> to <span class=\"wl wl-kjv\" data-code=\"H4421\">battle</span> against their <span class=\"wl wl-kjv\" data-code=\"H341\">enemy,</span> <span class=\"wl wl-kjv\" data-code=\"H1870\">whithersoever</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> them, and shall <span class=\"wl wl-kjv\" data-code=\"H6419\">pray</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1870\">toward</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> which thou hast <span class=\"wl wl-kjv\" data-code=\"H977\">chosen,</span> and toward the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> that I have <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> for thy <span class=\"wl wl-kjv\" data-code=\"H8034\">name:</span>","45":"Then <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> thou in <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> their <span class=\"wl wl-kjv\" data-code=\"H8605\">prayer</span> and their <span class=\"wl wl-kjv\" data-code=\"H8467\">supplication,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">maintain</span> their <span class=\"wl wl-kjv\" data-code=\"H4941\">cause.</span>","46":"If they <span class=\"wl wl-kjv\" data-code=\"H2398\">sin</span> against thee, (for there is no <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> that <span class=\"wl wl-kjv\" data-code=\"H2398\">sinneth</span> not,) and thou be <span class=\"wl wl-kjv\" data-code=\"H599\">angry</span> with them, and <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> them to the <span class=\"wl wl-kjv\" data-code=\"H341\">enemy,</span> so that they carry them <span class=\"wl wl-kjv\" data-code=\"H7617\">away</span> <span class=\"wl wl-kjv\" data-code=\"H7617\">captives</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">unto</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of the <span class=\"wl wl-kjv\" data-code=\"H341\">enemy,</span> <span class=\"wl wl-kjv\" data-code=\"H7350\">far</span> or <span class=\"wl wl-kjv\" data-code=\"H7138\">near;</span>","47":"Yet if they shall <span class=\"wl wl-kjv\" data-code=\"H7725\">bethink</span> themselves in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> whither they were carried <span class=\"wl wl-kjv\" data-code=\"H7617\">captives,</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">repent,</span> and make <span class=\"wl wl-kjv\" data-code=\"H2603\">supplication</span> unto thee in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of them that carried them <span class=\"wl wl-kjv\" data-code=\"H7617\">captives,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> We have <span class=\"wl wl-kjv\" data-code=\"H2398\">sinned,</span> and have done <span class=\"wl wl-kjv\" data-code=\"H5753\">perversely,</span> we have committed <span class=\"wl wl-kjv\" data-code=\"H7561\">wickedness;</span>","48":"And so <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> unto thee with all their <span class=\"wl wl-kjv\" data-code=\"H3824\">heart,</span> and with all their <span class=\"wl wl-kjv\" data-code=\"H5315\">soul,</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of their <span class=\"wl wl-kjv\" data-code=\"H341\">enemies,</span> which led them away <span class=\"wl wl-kjv\" data-code=\"H7617\">captive,</span> and <span class=\"wl wl-kjv\" data-code=\"H6419\">pray</span> unto thee <span class=\"wl wl-kjv\" data-code=\"H1870\">toward</span> their <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> which thou <span class=\"wl wl-kjv\" data-code=\"H5414\">gavest</span> unto their <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> which thou hast <span class=\"wl wl-kjv\" data-code=\"H977\">chosen,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> which I have <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> for thy <span class=\"wl wl-kjv\" data-code=\"H8034\">name:</span>","49":"Then <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> thou their <span class=\"wl wl-kjv\" data-code=\"H8605\">prayer</span> and their <span class=\"wl wl-kjv\" data-code=\"H8467\">supplication</span> in <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> thy <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelling</span> <span class=\"wl wl-kjv\" data-code=\"H4349\">place,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">maintain</span> their <span class=\"wl wl-kjv\" data-code=\"H4941\">cause,</span>","50":"And <span class=\"wl wl-kjv\" data-code=\"H5545\">forgive</span> thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that have <span class=\"wl wl-kjv\" data-code=\"H2398\">sinned</span> against thee, and all their <span class=\"wl wl-kjv\" data-code=\"H6588\">transgressions</span> wherein they have <span class=\"wl wl-kjv\" data-code=\"H6586\">transgressed</span> against thee, and <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> them <span class=\"wl wl-kjv\" data-code=\"H7356\">compassion</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> them who carried them <span class=\"wl wl-kjv\" data-code=\"H7617\">captive,</span> that they may have <span class=\"wl wl-kjv\" data-code=\"H7355\">compassion</span> on them:","51":"For they be thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and thine <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance,</span> which thou broughtest <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> out of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> from the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H3564\">furnace</span> of <span class=\"wl wl-kjv\" data-code=\"H1270\">iron:</span>","52":"That thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> may be <span class=\"wl wl-kjv\" data-code=\"H6605\">open</span> unto the <span class=\"wl wl-kjv\" data-code=\"H8467\">supplication</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant,</span> and unto the <span class=\"wl wl-kjv\" data-code=\"H8467\">supplication</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> to <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> unto them in all that they <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> for unto thee.","53":"For thou didst <span class=\"wl wl-kjv\" data-code=\"H914\">separate</span> them from among all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> to be thine <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance,</span> as thou <span class=\"wl wl-kjv\" data-code=\"H1696\">spakest</span> by the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant,</span> when thou <span class=\"wl wl-kjv\" data-code=\"H3318\">broughtest</span> our <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> out of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> O <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD.</span>","54":"And it was so, that when <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> had made an <span class=\"wl wl-kjv\" data-code=\"H3615\">end</span> of <span class=\"wl wl-kjv\" data-code=\"H6419\">praying</span> all this <span class=\"wl wl-kjv\" data-code=\"H8605\">prayer</span> and <span class=\"wl wl-kjv\" data-code=\"H8467\">supplication</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> he <span class=\"wl wl-kjv\" data-code=\"H6965\">arose</span> from <span class=\"wl wl-kjv\" data-code=\"H64
