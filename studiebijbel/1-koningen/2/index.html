href":"../../lukas/1/"},{"naam":"Johannes","href":"../../johannes/1/"},{"naam":"Handelingen","href":"../../handelingen/1/"},{"naam":"Romeinen","href":"../../romeinen/1/"},{"naam":"1 Korinthe","href":"../../1-korinthe/1/"},{"naam":"2 Korinthe","href":"../../2-korinthe/1/"},{"naam":"Galaten","href":"../../galaten/1/"},{"naam":"Efeze","href":"../../efeze/1/"},{"naam":"Filippenzen","href":"../../filippenzen/1/"},{"naam":"Kolossenzen","href":"../../kolossenzen/1/"},{"naam":"1 Thessalonicenzen","href":"../../1-thessalonicenzen/1/"},{"naam":"2 Thessalonicenzen","href":"../../2-thessalonicenzen/1/"},{"naam":"1 Timotheüs","href":"../../1-timotheus/1/"},{"naam":"2 Timotheüs","href":"../../2-timotheus/1/"},{"naam":"Titus","href":"../../titus/1/"},{"naam":"Filemon","href":"../../filemon/1/"},{"naam":"Hebreeën","href":"../../hebreeen/1/"},{"naam":"Jakobus","href":"../../jakobus/1/"},{"naam":"1 Petrus","href":"../../1-petrus/1/"},{"naam":"2 Petrus","href":"../../2-petrus/1/"},{"naam":"1 Johannes","href":"../../1-johannes/1/"},{"naam":"2 Johannes","href":"../../2-johannes/1/"},{"naam":"3 Johannes","href":"../../3-johannes/1/"},{"naam":"Judas","href":"../../judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}]},"vertalingen":{"SVnu":{"1":"Toen de dagen van David naderden dat hij zou sterven, gaf hij zijn zoon Salomo deze opdracht en zei:","2":"Ik ga heen in de weg van de hele aarde, wees dus sterk en wees een man.","3":"En neem de wacht van de HEERE, uw God, in acht, om te wandelen in Zijn wegen, om Zijn inzettingen te onderhouden, en Zijn geboden, en Zijn rechten, en Zijn getuigenissen, zoals geschreven is in de wet van Mozes; opdat u verstandig handelt in alles wat u doet, en overal waar u zich heen wendt;","4":"opdat de HEERE Zijn woord bevestigt, dat Hij over mij gesproken heeft, toen Hij zei: Als uw zonen hun weg bewaren, om voor Mijn aangezicht trouw, met hun hele hart en met hun hele ziel te wandelen, dan zal het u nooit ontbreken, zei Hij, aan een man op de troon van Israël.","5":"U weet ook zelf wat Joab, de zoon van Zeruja, mij heeft aangedaan, en wat hij heeft gedaan aan de twee legeraanvoerders van Israël, Abner, de zoon van Ner, en Amasa, de zoon van Jether, die hij heeft gedood, en hij heeft krijgsbloed vergoten in vredestijd; en hij heeft krijgsbloed gedaan aan zijn gordel, die om zijn middel was, en aan zijn schoenen, die aan zijn voeten waren.","6":"Doe dan naar uw wijsheid, en laat zijn grijze hoofd niet in vrede naar het graf afdalen.","7":"Maar aan de zonen van Barzillai, de Gileadiet, zult u vriendelijkheid bewijzen, en zij zullen bij hen horen die aan uw tafel eten; want zo kwamen zij naar mij toe, toen ik vluchtte voor het aangezicht van uw broer Absalom.","8":"En zie, bij u is Simeï, de zoon van Gera, de zoon van Jemini, uit Bahurim, die mij vervloekte met een zware vloek, op de dag dat ik naar Mahanaïm ging; maar hij kwam mij tegemoet bij de Jordaan, en ik zwoer hem bij de HEERE en zei: Ik zal u niet met het zwaard doden!","9":"Maar nu, houd hem niet onschuldig, omdat u een wijs man bent; en u zult weten wat u hem moet doen, opdat u zijn grijze hoofd met bloed naar het graf laat afdalen.","10":"En David ontsliep met zijn vaderen, en werd begraven in de stad van David.","11":"De dagen nu dat David over Israël geregeerd heeft, zijn veertig jaar; zeven jaar heeft hij geregeerd in Hebron, en in Jeruzalem heeft hij drieëndertig jaar geregeerd.","12":"En Salomo zat op de troon van zijn vader David; en zijn koninkrijk werd zeer bevestigd.","13":"Toen kwam Adonia, de zoon van Haggith, naar Bathseba, de moeder van Salomo; en zij zei: Komt u in vrede? En hij zei: In vrede.","14":"Daarna zei hij: Ik heb een woord voor u. En zij zei: Spreek.","15":"Hij zei dan: U weet dat het koninkrijk van mij was, en dat heel Israël zijn aangezicht op mij gericht had, dat ik koning zou worden; hoewel het koninkrijk is omgewend en van mijn broer geworden is; want het is van de HEERE aan hem gekomen.","16":"En nu vraag ik u één ding, wijs mijn aangezicht niet af. En zij zei tegen hem: Spreek.","17":"En hij zei: Spreek toch tot de koning Salomo, want hij zal uw aangezicht niet afwijzen, dat hij mij Abisag, de Sunamitische, tot vrouw geeft.","18":"En Bathseba zei: Het is goed, ik zal namens u met de koning spreken.","19":"Zo kwam Bathseba naar de koning Salomo, om hem namens Adonia aan te spreken. En de koning stond op, haar tegemoet, en boog voor haar; daarna ging hij op zijn troon zitten, en liet een stoel neerzetten voor de moeder van de koning; en zij zat aan zijn rechterhand.","20":"Toen zei zij: Ik vraag u één klein ding, wijs mijn aangezicht niet af. En de koning zei tegen haar: Vraag maar, mijn moeder, want ik zal uw aangezicht niet afwijzen.","21":"En zij zei: Laat Abisag, de Sunamitische, aan Adonia, uw broer, tot vrouw gegeven worden.","22":"Toen antwoordde de koning Salomo, en zei tegen zijn moeder: En waarom vraagt u Abisag, de Sunamitische, voor Adonia? Vraag ook het koninkrijk voor hem (want hij is mijn oudere broer), ja, voor hem, en voor Abjathar, de priester, en voor Joab, de zoon van Zeruja.","23":"En de koning Salomo zwoer bij de HEERE en zei: Zo doe God mij, en zo doet Hij daar nog aan toe, zeker zal Adonia dat woord met zijn leven bekopen!","24":"En nu, zo waarachtig als de HEERE leeft, Die mij bevestigd heeft, en mij heeft doen zitten op de troon van mijn vader David, en Die mij een huis gemaakt heeft, zoals Hij gesproken had; zeker, Adonia zal vandaag gedood worden!","25":"En de koning Salomo stuurde Benaja, de zoon van Jojada; die viel op hem aan, zodat hij stierf.","26":"En tegen Abjathar, de priester, zei de koning: Ga naar Anathoth, naar uw akkers; want u verdient de dood; maar op deze dag zal ik u niet doden, omdat u de ark van de Heere HEERE gedragen hebt voor het aangezicht van mijn vader David, en omdat u verdrukt bent geweest in alles waarin mijn vader verdrukt was.","27":"Salomo verdreef dan Abjathar, zodat hij geen priester van de HEERE meer was, om het woord van de HEERE te vervullen, dat Hij over het huis van Eli in Silo gesproken had.","28":"Toen het bericht Joab bereikte (want Joab had zich achter Adonia geschaard, hoewel hij zich niet achter Absalom had geschaard), vluchtte Joab naar de tent van de HEERE, en greep de hoornen van het altaar vast.","29":"En het werd de koning Salomo verteld dat Joab naar de tent van de HEERE gevlucht was, en zie, hij is bij het altaar. Toen stuurde Salomo Benaja, de zoon van Jojada, en zei: Ga, val op hem aan.","30":"En Benaja kwam bij de tent van de HEERE, en zei tegen hem: Zo zegt de koning: Kom naar buiten. En hij zei: Nee, hier zal ik sterven! En Benaja bracht het antwoord terug aan de koning en zei: Zo heeft Joab gesproken, en zo heeft hij mij geantwoord.","31":"En de koning zei tegen hem: Doe zoals hij gesproken heeft, en val op hem aan, en begraaf hem, zodat u van mij en van het huis van mijn vader wegneemt het bloed dat Joab zonder reden vergoten heeft.","32":"Zo zal de HEERE zijn bloed op zijn eigen hoofd doen terugkeren, omdat hij twee mannen heeft aangevallen die rechtvaardiger en beter waren dan hij, en hen met het zwaard gedood heeft, terwijl mijn vader David het niet wist: Abner, de zoon van Ner, de legeraanvoerder van Israël, en Amasa, de zoon van Jether, de legeraanvoerder van Juda.","33":"Zo zal hun bloed terugkeren op het hoofd van Joab, en op het hoofd van zijn nakomelingen voor eeuwig; maar David, en zijn nakomelingen, en zijn huis, en zijn troon zal vrede hebben van de HEERE tot in eeuwigheid.","34":"En Benaja, de zoon van Jojada, ging omhoog, en viel op hem aan, en doodde hem; en hij werd begraven in zijn huis, in de woestijn.","35":"En de koning stelde Benaja, de zoon van Jojada, in zijn plaats aan over het leger; en Zadok, de priester, stelde de koning aan in de plaats van Abjathar.","36":"Daarna stuurde de koning, en riep Simeï, en zei tegen hem: Bouw u een huis in Jeruzalem, en woon daar, en ga vandaar niet naar hier of daar.","37":"Want het zal gebeuren op de dag dat u weggaat, wanneer u over de beek Kidron trekt, weet u zeker, dat u zult sterven; uw bloed zal op uw eigen hoofd zijn.","38":"En Simeï zei tegen de koning: Dat woord is goed; zoals mijn heer de koning gesproken heeft, zo zal uw dienaar doen. En Simeï woonde in Jeruzalem vele dagen.","39":"Maar het gebeurde na drie jaar, dat twee knechten van Simeï wegliepen naar Achis, de zoon van Maächa, de koning van Gath; en men liet het Simeï weten en zei: Zie, uw knechten zijn in Gath.","40":"Toen maakte Simeï zich klaar, en zadelde zijn ezel, en ging naar Gath, naar Achis, om zijn knechten te zoeken; zo ging Simeï, en bracht zijn knechten terug uit Gath.","41":"En het werd Salomo verteld, dat Simeï van Jeruzalem naar Gath getrokken was, en teruggekomen was.","42":"Toen stuurde de koning, en riep Simeï, en zei tegen hem: Heb ik u niet beëdigd bij de HEERE, en tegen u verklaard: Op de dag dat u weggaat, en naar hier of daar gaat, weet u zeker, dat u zult sterven? En u zei tegen mij: Dat woord is goed, dat heb ik gehoord.","43":"Waarom hebt u dan de eed van de HEERE niet gehouden, en het gebod dat ik u opgelegd had?","44":"Verder zei de koning tegen Simeï: U weet zelf al de boosheid die uw hart kent, die u aan mijn vader David gedaan hebt; daarom heeft de HEERE uw boosheid op uw eigen hoofd doen terugkeren.","45":"Maar de koning Salomo is gezegend; en de troon van David zal bevestigd zijn voor het aangezicht van de HEERE tot in eeuwigheid.","46":"En de koning gaf Benaja, de zoon van Jojada, de opdracht; die ging naar buiten, en viel op hem aan, zodat hij stierf. Zo is het koninkrijk bevestigd in de hand van Salomo."},"SV":{"1":"Als nu de dagen van David nabij waren, dat hij sterven zou, zo gebood hij zijn zoon Salomo, zeggende:","2":"Ik ga heen in den weg der ganse aarde, zo wees sterk, en wees een man.","3":"En neem waar de wacht des HEEREN, uws Gods, om te wandelen in Zijn wegen, om te onderhouden Zijn inzettingen, en Zijn geboden, en Zijn rechten, en Zijn getuigenissen, gelijk geschreven is in de wet van Mozes; opdat gij verstandelijk handelt in al wat gij doen zult, en al waarheen gij u wenden zult;","4":"Opdat de HEERE bevestige Zijn woord, dat Hij over mij gesproken heeft, zeggende: Indien uw zonen hun weg bewaren, om voor Mijn aangezicht trouwelijk, met hun ganse hart en met hun ganse ziel te wandelen, zo zal geen man, zeide Hij, u afgesneden worden van den troon Israëls.","5":"Zo weet gij ook, wat Joab, de zoon van Zeruja, mij gedaan heeft, *en* wat hij gedaan heeft aan de twee krijgsoversten van Israël, Abner, den zoon van Ner, en Amasa, den zoon van Jether, dien hij gedood heeft, en heeft krijgsbloed vergoten in vrede; en hij heeft krijgsbloed gedaan aan zijn gordel, die aan zijn lendenen was, en aan zijn schoenen, die aan zijn voeten waren.","6":"Doe dan naar uw wijsheid, dat gij zijn grauwe haar niet met vrede in het graf laat dalen.","7":"Maar aan de zonen van Barzillai, den Gileadiet, zult gij weldadigheid bewijzen, en zij zullen zijn onder degenen, die aan uw tafel eten; want alzo naderden zij tot mij, als ik vluchtte voor het aangezicht van uw broeder Absalom.","8":"En zie, bij u is Simeï, de zoon van Gera, de zoon van Jemini, uit Bahurim, die mij vloekte met een geweldige vloek, ten dage als ik ging naar Mahanaim; doch hij kwam af mij tegemoet aan de Jordaan, en ik zwoer hem bij den HEERE, zeggende: Zo ik hem met het zwaard dode!","9":"Maar nu, houd hem niet onschuldig, dewijl gij een wijs man zijt; en gij zult weten, wat gij hem doen zult, opdat gij zijn grauwe haar met bloed in het graf doet dalen.","10":"En David ontsliep met zijn vaderen, en werd begraven in de stad Davids.","11":"De dagen nu, die David geregeerd heeft over Israël, zijn veertig jaren; zeven jaren heeft hij geregeerd in Hebron, en in Jeruzalem heeft hij drie en dertig jaren geregeerd.","12":"En Salomo zat op den troon van zijn vader David; en zijn koninkrijk werd zeer bevestigd.","13":"Toen kwam Adonia, de zoon van Haggith, tot Bathseba, de moeder van Salomo; en zij zeide: Is uw komst vrede? En hij zeide: Vrede.","14":"Daarna zeide hij: Ik heb een woord aan u. En zij zeide: Spreek.","15":"Hij zeide dan: Gij weet, dat het koninkrijk mijn was, en het ganse Israël zijn aangezicht op mij gezet had, dat ik koning zijn zou; hoewel het koninkrijk omgewend en mijns broeders geworden is; want het is van den HEERE hem geworden.","16":"En nu begeer ik van u een enige begeerte; wijs mijn aangezicht niet af. En zij zeide tot hem: Spreek.","17":"En hij zeide: Spreek toch tot den koning Salomo, want hij zal uw aangezicht niet afwijzen, dat hij mij Abisag, de Sunamietische, ter vrouwe geve.","18":"En Bathseba zeide: Het is goed, ik zal den koning voor u aanspreken.","19":"Zo kwam Bathseba tot den koning Salomo, om hem voor Adonia aan te spreken. En de koning stond op, haar tegemoet, en boog zich voor haar; daarna zat hij op zijn troon, en deed een stoel voor de moeder des konings zetten; en zij zat aan zijn rechterhand.","20":"Toen zeide zij: Ik begeer van u een enige kleine begeerte, wijs mijn aangezicht niet af. En de koning zeide tot haar: Begeer, mijn moeder, want ik zal uw aangezicht niet afwijzen.","21":"En zij zeide: Laat Abisag, de Sunamietische, aan Adonia, uw broeder, ter vrouwe gegeven worden.","22":"Toen antwoordde de koning Salomo, en zeide tot zijn moeder: En waarom begeert gij Abisag, de Sunamietische, voor Adonia? Begeer ook voor hem het koninkrijk ( want hij is mijn broeder, die ouder is dan ik ben), ja, voor hem, en voor Abjathar, den priester, en voor Joab, den zoon van Zeruja.","23":"En de koning Salomo zwoer bij den HEERE, zeggende: Zo doe mij God, en zo doe Hij daartoe, voorzeker Adonia zal dat woord tegen zijn leven gesproken hebben!","24":"En nu, *zo* *waarachtig* *als* de HEERE leeft, Die mij bevestigd heeft, en mij heeft doen zitten op den troon van mijn vader David, en Die mij een huis gemaakt heeft, gelijk als Hij gesproken had; voorzeker, Adonia zal heden gedood worden!","25":"En de koning Salomo zond door de hand van Benaja, den zoon van Jojada; die viel op hem aan, dat hij stierf.","26":"En tot Abjathar, den priester, zeide de koning: Ga naar Anathoth, op uw akkers; want gij zijt een man des doods; maar op dezen dag zal ik u niet doden, omdat gij de ark des Heeren HEEREN voor het aangezicht van mijn vader David gedragen hebt, en omdat gij verdrukt zijt geweest, in alles, waarin mijn vader verdrukt was.","27":"Salomo dan verdreef Abjathar, dat hij des HEEREN priester niet ware, om te vervullen het woord des HEEREN, hetwelk Hij over het huis van Eli te Silo gesproken had.","28":"Als het gerucht tot Joab kwam ( want Joab had zich gewend achter Adonia, hoewel hij zich niet had gewend achter Absalom), zo vluchtte Joab tot de tent des HEEREN, en vatte de hoornen des altaars.","29":"En het werd den koning Salomo aangezegd, dat Joab tot de tent des HEEREN gevloden was, en zie, hij is bij het altaar. Toen zond Salomo Benaja, den zoon van Jojada, zeggende: Ga heen, val op hem aan.","30":"En Benaja kwam tot de tent des HEEREN, en zeide tot hem: Zo zegt de koning: Kom uit. En hij zeide: Neen, maar hier zal ik sterven! En Benaja bracht het antwoord weder aan den koning, zeggende: Zo heeft Joab gesproken, en zo heeft hij mij geantwoord.","31":"En de koning zeide tot hem: Doe gelijk als hij gesproken heeft, en val op hem aan, en begraaf hem, opdat gij wegdoet, van mij en van mijns vaders huis, dat bloed, dat Joab zonder oorzaak vergoten heeft.","32":"Zo zal de HEERE zijn bloed op zijn hoofd doen wederkeren, omdat hij op twee mannen, rechtvaardiger en beter dan hij, aangevallen is, en die met het zwaard gedood heeft, daar het mijn vader David niet wist, Abner, den zoon van Ner, den krijgsoverste van Israël, en Amasa, den zoon van Jether, den krijgsoverste van Juda.","33":"Alzo zal hun bloed wederkeren op het hoofd van Joab, en op het hoofd van zijn zaad in eeuwigheid; maar David, en zijn zaad, en zijn huis, en zijn troon zal vrede hebben van den HEERE tot in eeuwigheid.","34":"En Benaja, de zoon van Jojada, ging op, en viel op hem aan, en doodde hem; en hij werd begraven in zijn huis, in de woestijn.","35":"En de koning zette Benaja, den zoon van Jojada, in zijn plaats over het heir; en Zadok, den priester, zette de koning in de plaats van Abjathar.","36":"Daarna zond de koning, en riep Simeï, en zeide tot hem: Bouw u een huis in Jeruzalem, en woon aldaar; en ga van daar niet uit herwaarts of derwaarts.","37":"Want het zal geschieden ten dage van uw uitgaan, als gij over de beek Kidron zult gaan, weet voorzeker, dat gij den dood sterven zult; uw bloed zal op uw hoofd zijn.","38":"En Simeï zeide tot den koning: Dat woord is goed; gelijk als mijn heer de koning gesproken heeft, alzo zal uw knecht doen. En Simeï woonde te Jeruzalem vele dagen.","39":"Doch het geschiedde met het einde van drie jaren, dat twee knechten van Simeï wegliepen tot Achis, den zoon van Maacha, den koning van Gath; en men gaf het Simeï te kennen, zeggende: Zie, uw knechten zijn in Gath.","40":"Toen maakte zich Simeï op, en zadelde zijn ezel, en toog heen naar Gath tot Achis, om zijn knechten te zoeken; zo toog Simeï heen, en bracht zijn knechten van Gath.","41":"En het werd Salomo aangezegd, dat Simeï uit Jeruzalem naar Gath getogen, en wedergekomen was.","42":"Toen zond de koning, en riep Simeï, en zeide tot hem: Heb ik u niet beedigd bij den HEERE, en tegen u betuigd, zeggende: Ten dage van uw uitgaan, als gij zult herwaarts of derwaarts gaan, weet voorzeker, dat gij den dood zult sterven? En gij zeidet tot mij: Dat woord is goed, *dat* ik gehoord heb.","43":"Waarom dan hebt gij den eed des HEEREN niet gehouden, en het gebod, dat ik over u geboden had?","44":"Verder zeide de koning tot Simeï: Gij weet al de boosheid, die uw hart weet, die gij aan mijn vader David gedaan hebt; daarom heeft de HEERE uw boosheid op uw hoofd doen wederkeren.","45":"Maar de koning Salomo is gezegend; en de troon van David zal bevestigd zijn voor het aangezicht des HEEREN tot in eeuwigheid.","46":"En de koning gebood Benaja, den zoon van Jojada; die ging uit, en viel op hem aan, dat hij stierf. Alzo is het koninkrijk bevestigd in de hand van Salomo."},"KJV":{"1":"Now the days of David drew nigh that he should die; and he charged Solomon his son, saying,","2":"I go the way of all the earth: be thou strong therefore, and shew thyself a man;","3":"And keep the charge of the LORD thy God, to walk in his ways, to keep his statutes, and his commandments, and his judgments, and his testimonies, as it is written in the law of Moses, that thou mayest prosper in all that thou doest, and whithersoever thou turnest thyself:","4":"That the LORD may continue his word which he spake concerning me, saying, If thy children take heed to their way, to walk before me in truth with all their heart and with all their soul, there shall not fail thee (said he) a man on the throne of Israel.","5":"Moreover thou knowest also what Joab the son of Zeruiah did to me, and what he did to the two captains of the hosts of Israel, unto Abner the son of Ner, and unto Amasa the son of Jether, whom he slew, and shed the blood of war in peace, and put the blood of war upon his girdle that was about his loins, and in his shoes that were on his feet.","6":"Do therefore according to thy wisdom, and let not his hoar head go down to the grave in peace.","7":"But shew kindness unto the sons of Barzillai the Gileadite, and let them be of those that eat at thy table: for so they came to me when I fled because of Absalom thy brother.","8":"And, behold, thou hast with thee Shimei the son of Gera, a Benjamite of Bahurim, which cursed me with a grievous curse in the day when I went to Mahanaim: but he came down to meet me at Jordan, and I sware to him by the LORD, saying, I will not put thee to death with the sword.","9":"Now therefore hold him not guiltless: for thou art a wise man, and knowest what thou oughtest to do unto him; but his hoar head bring thou down to the grave with blood.","10":"So David slept with his fathers, and was buried in the city of David.","11":"And the days that David reigned over Israel were forty years: seven years reigned he in Hebron, and thirty and three years reigned he in Jerusalem.","12":"Then sat Solomon upon the throne of David his father; and his kingdom was established greatly.","13":"And Adonijah the son of Haggith came to Bathsheba the mother of Solomon. And she said, Comest thou peaceably? And he said, Peaceably.","14":"He said moreover, I have somewhat to say unto thee. And she said, Say on.","15":"And he said, Thou knowest that the kingdom was mine, and that all Israel set their faces on me, that I should reign: howbeit the kingdom is turned about, and is become my brother's: for it was his from the LORD.","16":"And now I ask one petition of thee, deny me not. And she said unto him, Say on.","17":"And he said, Speak, I pray thee, unto Solomon the king, (for he will not say ➔ thee nay,) that he give me Abishag the Shunammite to wife.","18":"And Bathsheba said, Well; I will speak for thee unto the king.","19":"Bathsheba therefore went unto king Solomon, to speak unto him for Adonijah. And the king rose up to meet her, and bowed himself unto her, and sat down on his throne, and caused a seat to be set for the king's mother; and she sat on his right hand.","20":"Then she said, I desire one small petition of thee; I pray thee, say ➔ me not nay. And the king said unto her, Ask on, my mother: for I will not say ➔ thee nay.","21":"And she said, Let Abishag the Shunammite be given to Adonijah thy brother to wife.","22":"And king Solomon answered and said unto his mother, And why dost thou ask Abishag the Shunammite for Adonijah? ask for him the kingdom also; for he is mine elder brother; even for him, and for Abiathar the priest, and for Joab the son of Zeruiah.","23":"Then king Solomon sware by the LORD, saying, God do so to me, and more also, if Adonijah have not spoken this word against his own life.","24":"Now therefore, as the LORD liveth, which hath established me, and set me on the throne of David my father, and who hath made me an house, as he promised, Adonijah shall be put to death this day.","25":"And king Solomon sent by the hand of Benaiah the son of Jehoiada; and he fell upon him that he died.","26":"And unto Abiathar the priest said the king, Get thee to Anathoth, unto thine own fields; for thou art worthy of death: but I will not at this time put thee to death, because thou barest the ark of the Lord GOD before David my father, and because thou hast been afflicted in all wherein my father was afflicted.","27":"So Solomon thrust out Abiathar from being priest unto the LORD; that he might fulfil the word of the LORD, which he spake concerning the house of Eli in Shiloh.","28":"Then tidings came to Joab: for Joab had turned after Adonijah, though he turned not after Absalom. And Joab fled unto the tabernacle of the LORD, and caught hold on the horns of the altar.","29":"And it was told king Solomon that Joab was fled unto the tabernacle of the LORD; and, behold, he is by the altar. Then Solomon sent Benaiah the son of Jehoiada, saying, Go, fall upon him.","30":"And Benaiah came to the tabernacle of the LORD, and said unto him, Thus saith the king, Come forth. And he said, Nay; but I will die here. And Benaiah brought ➔ the king word again, saying, Thus said Joab, and thus he answered me.","31":"And the king said unto him, Do as he hath said, and fall upon him, and bury him; that thou mayest take away the innocent blood, which Joab shed, from me, and from the house of my father.","32":"And the LORD shall return his blood upon his own head, who fell upon two men more righteous and better than he, and slew them with the sword, my father David not knowing thereof, to wit, Abner the son of Ner, captain of the host of Israel, and Amasa the son of Jether, captain of the host of Judah.","33":"Their blood shall therefore return upon the head of Joab, and upon the head of his seed for ever: but upon David, and upon his seed, and upon his house, and upon his throne, shall there be peace for ever from the LORD.","34":"So Benaiah the son of Jehoiada went up, and fell upon him, and slew him: and he was buried in his own house in the wilderness.","35":"And the king put Benaiah the son of Jehoiada in his room over the host: and Zadok the priest did the king put in the room of Abiathar.","36":"And the king sent and called for Shimei, and said unto him, Build thee an house in Jerusalem, and dwell there, and go not forth thence any whither.","37":"For it shall be, that on the day thou goest out, and passest over the brook Kidron, thou shalt know for certain that thou shalt surely die: thy blood shall be upon thine own head.","38":"And Shimei said unto the king, The saying is good: as my lord the king hath said, so will thy servant do. And Shimei dwelt in Jerusalem many days.","39":"And it came to pass at the end of three years, that two of the servants of Shimei ran away unto Achish son of Maachah king of Gath. And they told Shimei, saying, Behold, thy servants be in Gath.","40":"And Shimei arose, and saddled his ass, and went to Gath to Achish to seek his servants: and Shimei went, and brought his servants from Gath.","41":"And it was told Solomon that Shimei had gone from Jerusalem to Gath, and was come again.","42":"And the king sent and called for Shimei, and said unto him, Did I not make thee to swear by the LORD, and protested unto thee, saying, Know for a certain, on the day thou goest out, and walkest abroad any whither, that thou shalt surely die? and thou saidst unto me, The word that I have heard is good.","43":"Why then hast thou not kept the oath of the LORD, and the commandment that I have charged thee with?","44":"The king said moreover to Shimei, Thou knowest all the wickedness which thine heart is privy to, that thou didst to David my father: therefore the LORD shall return thy wickedness upon thine own head;","45":"And king Solomon shall be blessed, and the throne of David shall be established before the LORD for ever.","46":"So the king commanded Benaiah the son of Jehoiada; which went out, and fell upon him, that he died. And the kingdom was established in the hand of Solomon."}},"tsk":{"1":[{"kopje":"de dagen","refs":["Gen 47:29","Deut 31:14","Deut 33:1","2 Tim 4:6","2 Petr 1:13-15"]},{"kopje":"gaf opdracht","refs":["Num 27:19","Deut 3:28","Deut 31:23","Hand 20:28-31","1 Tim 1:18","1 Tim 6:13","2 Tim 4:1"]}],"2":[{"kopje":"Ik ga","refs":["Joz 23:14","Job 16:22","Job 30:23","Ps 89:49","Hebr 9:27"]},{"kopje":"wees","refs":["Deut 17:19","Deut 17:20","Deut 31:6","Joz 1:6","Joz 1:7","1 Kron 28:20","Ef 6:10","2 Tim 2:1"]},{"kopje":"en wees","refs":["1 Kon 3:7","2 Sam 10:12","Pred 12:13","1 Kor 16:13","1 Tim 4:12"]}],"3":[{"kopje":"En neem in acht","refs":["Deut 29:9","Joz 1:7","Joz 22:5","1 Kron 22:12","1 Kron 22:13","1 Kron 28:8","1 Kron 28:9","1 Kron 29:19"]},{"kopje":"inzettingen","refs":["Deut 4:1","Deut 4:5","Deut 4:8","Deut 5:1","Deut 6:1","Deut 6:2"]},{"kopje":"getuigenissen","refs":["Deut 4:45","Ps 19:8","Ps 119:2","Ps 119:111","Ps 119:138"]},{"kopje":"geschreven","refs":["Deut 17:18-20","Mal 4:4"]},{"kopje":"dat u","refs":["Deut 29:9"]},{"kopje":"verstandig handelt","refs":["Joz 1:7","Joz 1:8","1 Sam 18:5","1 Sam 18:14","1 Sam 18:30","2 Kron 31:20","2 Kron 31:21","Ps 1:2","Ps 1:3","Ps 119:98-100","Spr 3:1-4"]},{"kopje":"overal waar","refs":["2 Sam 8:6","2 Sam 8:14","2 Kon 18:7"]}],"4":[{"kopje":"Dat de HEERE","refs":["Gen 18:19","Deut 7:12","1 Kron 28:9","Joh 15:9","Joh 15:10","Judas 1:20","Judas 1:21","Judas 1:24"]},{"kopje":"Zijn woord","refs":["2 Sam 7:11-16","2 Sam 7:25","1 Kron 17:11-15","1 Kron 22:9-11","1 Kron 28:5-7","Ps 89:30-38","Ps 132:11","Ps 132:12"]},{"kopje":"wandelen","refs":["1 Kon 3:3","1 Kon 3:14","1 Kon 8:23","Gen 17:1","Lev 26:3","2 Kon 20:3","2 Kon 23:3","2 Kon 23:25","2 Kron 17:3","Luk 1:6"]},{"kopje":"met hun hele hart","refs":["Deut 6:5","Deut 10:12","Deut 11:1 ","href":"../../nave/p/#t-punishment","kinderen":[{"label":"Death Penalty","href":"../../nave/p/?hl=1Kgs.2.46#i16689","refs":[],"kinderen":[{"label":"The sword","href":"../../nave/p/?hl=1Kgs.2.46#i16718","refs":[{"disp":"Ex 32:27","href":"../../exodus/32/#v27","ref":"Ex 32:27","svLabel":null},{"disp":"Ex 32:28","href":"../../exodus/32/#v28","ref":"Ex 32:28","svLabel":null},{"disp":"1 Kon 2:25","href":"../../1-koningen/2/#v25","ref":"1 Kon 2:25","svLabel":null},{"disp":"1 Kon 2:34","href":"../../1-koningen/2/#v34","ref":"1 Kon 2:34","svLabel":null},{"disp":"1 Kon 2:46","href":"../../1-koningen/2/#v46","ref":"1 Kon 2:46","svLabel":null},{"disp":"Hand 12:2","href":"../../handelingen/12/#v2","ref":"Hand 12:2","svLabel":null}],"kinderen":[]}]}]}]}},"extern":{"Pred 2:24":"Is het dan niet goed voor de mens dat hij eet en drinkt, en dat hij zijn ziel het goede laat genieten in zijn arbeid? Ik heb ook gezien dat dit uit de hand van God is.","Pred 9:10":"Alles wat uw hand vindt om te doen, doe dat met al uw kracht; want er is geen werk, geen overleg, geen kennis en geen wijsheid in het graf, waar u heengaat.","Deut 26:16":"Op deze dag gebiedt de HEERE, uw God, u deze inzettingen en rechten te doen; houd ze dan en doe ze, met heel uw hart en met heel uw ziel.","Lev 19:3":"Want ieder zal zijn moeder en zijn vader vrezen, en Mijn sabbatten houden; Ik ben de HEERE, uw God!","2 Petr 1:19":"En wij hebben het profetische woord, dat zeer vast is, en u doet er goed aan daarop acht te geven, als op een licht dat schijnt in een duistere plaats, totdat de dag aanlicht en de morgenster opgaat in uw harten.","Deut 11:12-15":"Een land, dat de HEERE, uw God, verzorgt; de ogen van de HEERE, uw God, zijn er voortdurend op gericht, van het begin van het jaar tot het einde van het jaar. En het zal gebeuren, als u zorgvuldig zult horen naar Mijn geboden, die Ik u heden gebied, om de HEERE, uw God, lief te hebben, en Hem te dienen, met uw hele hart en met uw hele ziel; Zo zal Ik de regen van uw land geven op zijn tijd, vroege regen en late regen, opdat u uw koren, en uw most, en uw olie inzamelt.","Deut 31:23":"En Hij gebood Jozua, de zoon van Nun, en zei: Wees sterk en heb goede moed, want u zult de kinderen van Israël brengen in het land, dat Ik hun gezworen heb; en Ik zal met u zijn.","Matt 11:24":"Maar Ik zeg u, dat het het land van Sodom draaglijker zal zijn op de dag van het oordeel, dan u.","Ps 85:13":"Ook zal de HEERE het goede geven; en ons land zal zijn vrucht geven.","Ps 88:4":"Want mijn ziel is verzadigd van tegenspoed, en mijn leven raakt tot aan het graf.","2 Sam 20:8-12":"Toen zij nu bij de grote steen waren, die bij Gibeon is, kwam Amasa voor hun aangezicht. En Joab had zijn kleed omgord, dat hij aan had, en daarop was een gordel, waaraan het zwaard vastgemaakt was op zijn heupen in zijn schede; en toen hij vooruitging, viel het eruit. En Joab zei tegen Amasa: Is het goed met u, mijn broeder? En Joab pakte met de rechterhand de baard van Amasa, om hem te kussen. En Amasa lette niet op het zwaard dat in Joabs hand was; zo sloeg hij hem daarmee aan de vijfde rib, en hij stortte zijn ingewanden op de aarde uit, en hij sloeg hem niet ten tweeden male, en hij stierf. Toen jaagden Joab en zijn broeder Abisai Seba, de zoon van Bichri, achterna.","Deut 32:47":"Want dat is geen leeg woord voor u; maar het is uw leven; en door ditzelfde woord zult u de dagen verlengen op het land, waar u over de Jordaan naartoe gaat, om dat te erven.","Ps 89:37":"Zijn zaad zal in eeuwigheid zijn, en zijn troon zal voor Mij zijn als de zon.","Ps 132:12":"Als uw zonen Mijn verbond zullen houden, en Mijn getuigenissen die Ik hun leren zal, dan zullen ook hun zonen tot in eeuwigheid op uw troon zitten.","Spr 20:8":"Een koning, die op de troon van het gericht zit, verstrooit alle kwaad met zijn ogen.","Ps 132:11":"De HEERE heeft David de waarheid gezworen, waarvan Hij niet wijken zal, en zei: Van de vrucht van uw buik zal Ik op uw troon zetten.","2 Kon 23:25":"En voor hem was er geen koning zijns gelijke, die zich tot de HEERE, met heel zijn hart, en met heel zijn ziel, en met heel zijn kracht, naar heel de wet van Mozes, bekeerd had; en na hem stond zijns gelijke niet op.","Matt 27:25":"En al het volk antwoordde en zei: Laat Zijn bloed komen over ons, en over onze kinderen.","Ezech 17:19":"Daarom, zo zegt de Heere HEERE: Zo waarachtig als Ik leef, Ik zal Mijn eed, die hij veracht heeft, en Mijn verbond, dat hij gebroken heeft, op zijn hoofd geven!","Luk 8:18":"Let er dan op hoe u hoort; want wie heeft, aan hem zal gegeven worden; en wie niet heeft, ook wat hij meent te hebben zal van hem afgenomen worden.","Hoogl 8:6":"Zet mij als een zegel op Uw hart, als een zegel op Uw arm; want de liefde is sterk als de dood; de ijver is hard als het graf; haar kolen zijn vurige kolen, vlammen van de Heere.","Ps 72:3":"De bergen zullen aan het volk vrede dragen, ook de heuvels, met gerechtigheid.","Ps 49:16":"Maar God zal mijn ziel uit de macht van het graf verlossen, want Hij zal mij opnemen. Sela.","2 Sam 8:6":"En David legde bezettingen in Syrië van Damaskus, en de Syriërs werden David tot knechten, en zij brachten geschenken; en de HEERE behoedde David overal waar hij heentrok.","Luk 19:22":"Maar hij zei tegen hem: Naar uw eigen woorden zal ik u oordelen, u slechte dienstknecht! U wist dat ik een streng mens ben, die wegneemt wat ik niet gelegd heb, en oogst wat ik niet gezaaid heb.","Spr 2:21":"Want de vromen zullen de aarde bewonen, en de oprechten zullen daarin overblijven;","Gen 22:14":"En Abraham noemde de naam van die plaats: De Heere zal het voorzien! Waarom tot op deze dag gezegd wordt: Op de berg van de HEERE zal het voorzien worden!","2 Sam 12:24":"Daarna troostte David zijn vrouw Bathseba, en ging naar haar toe, en lag bij haar; en zij baarde een zoon, wiens naam zij Salomo noemde; en de HEERE had hem lief,","Jes 48:17":"Zo zegt de HEERE, uw Verlosser, de Heilige van Israël: Ik ben de HEERE, uw God, Die u leert wat nuttig is, Die u leidt op de weg, die u gaan moet.","Ps 136:5-25":"Hem, Die de hemelen met verstand gemaakt heeft; want Zijn goedertierenheid is voor eeuwig. Hem, Die de aarde op het water uitgespreid heeft; want Zijn goedertierenheid is voor eeuwig. Hem, Die de grote lichten heeft gemaakt; want Zijn goedertierenheid is voor eeuwig.","Jer 2:34":"Ja, het bloed van de zielen van de onschuldige behoeftigen is in uw zomen gevonden; Ik heb dat niet door opgraven gevonden, maar aan dat alles.","Luk 11:10":"Want ieder die bidt, die ontvangt; en die zoekt, die vindt; en die klopt, voor die zal opengedaan worden.","2 Kron 33:20":"En Manasse ontsliep met zijn vaderen, en zij begroeven hem in zijn huis; en zijn zoon Amon werd koning in zijn plaats.","Spr 14:34":"Gerechtigheid verhoogt een volk, maar de zonde is een schandvlek voor de naties.","1 Sam 16:5":"Hij zei: Met vrede; ik ben gekomen om de HEERE een offer te brengen; heilig uzelf, en kom met mij naar het offer; en hij heiligde Isaï en zijn zonen, en nodigde hen uit voor het offer.","1 Kon 9:5":"Dan zal Ik de troon van uw koninkrijk over Israël bevestigen in eeuwigheid; zoals Ik gesproken heb over uw vader David, en zei: Er zal u geen man afgesneden worden van de troon van Israël.","2 Kron 29:16":"Maar de priesters gingen naar binnen, in het huis van de HEERE, om dat te reinigen, en zij brachten al de onreinheid die zij in de tempel van de HEERE vonden, naar buiten in het voorhof van het huis van de HEERE; en de Levieten namen het op, om het naar buiten te brengen, naar de beek Kidron.","Job 39:9":"Die Ik de wildernis tot zijn huis besteld heb, en het ziltige tot zijn woningen.","1 Kron 27:34":"En na Achitofel was Jojada, de zoon van Benaja, en Abjathar; maar Joab was de legeraanvoerder van de koning.","Joh 2:3":"En toen de wijn ontbrak, zei de moeder van Jezus tegen Hem: Zij hebben geen wijn.","Jer 22:4":"Want als u deze zaak ernstig zult doen, dan zullen door de poorten van dit huis koningen binnengaan, zittend op de troon van David, rijdend op wagens en op paarden, hij, en zijn dienaren, en zijn volk.","Zach 9:10":"En Ik zal de wagens uit Efraïm uitroeien, en de paarden uit Jeruzalem; ook zal de strijdboog uitgeroeid worden, en Hij zal tot de heidenen vrede spreken; en Zijn heerschappij zal zijn van zee tot aan zee, en van de rivier tot aan de einden van de aarde.","Lev 19:32":"Voor het grauwe haar zult u opstaan, en het aangezicht van de oude vereren; en u zult vrezen voor uw God; Ik ben de HEERE!","Hebr 9:27":"En zoals het de mensen beschikt is eenmaal te sterven, en daarna het oordeel;","2 Sam 7:29":"Zo belieft het U nu, en zegen het huis van Uw knecht, dat het in eeuwigheid voor Uw aangezicht blijft; want U, Heere HEERE, hebt het gesproken, en met Uw zegen zal het huis van Uw knecht gezegend worden in eeuwigheid.","2 Kron 1:12":"De wijsheid en de kennis is u gegeven; daartoe zal Ik u rijkdom, en goederen, en eer geven, zoals geen koningen die vóór u geweest zijn, gehad hebben, en na u zal niemand zoiets hebben.","2 Sam 16:5":"Toen koning David tot bij Bahurim kwam, zie, daar kwam een man vandaan uit het geslacht van het huis van Saul, van wie de naam Simeï was, de zoon van Gera; hij liep almaar door en vloekte.","Deut 10:12":"Nu dan, Israël! Wat vraagt de HEERE, uw God, van u, dan de HEERE, uw God, te vrezen, in al Zijn wegen te wandelen, en Hem lief te hebben, en de HEERE, uw God, te dienen, met heel uw hart en met heel uw ziel;","Ezech 24:7":"Want haar bloed is in haar midden; op een gladde rots heeft zij het gelegd; zij heeft het niet op de aarde uitgestort, om het met stof te bedekken.","1 Kron 6:50-53":"Dit nu zijn de kinderen van Aäron: Eleazar, was zijn zoon; Pinehas zijn zoon; Abisua zijn zoon; Bukki zijn zoon; Uzzi zijn zoon; Serahja zijn zoon; Merajoth zijn zoon; Amarja zijn zoon; Ahitub zijn zoon;","Matt 7:7-11":"Bid, en u zal gegeven worden; zoek, en u zult vinden; klop, en u zal opengedaan worden. Want ieder die bidt, ontvangt; en wie zoekt, vindt; en wie klopt, voor hem zal opengedaan worden. Of welk mens is er onder u die, als zijn zoon hem om brood zou vragen, hem een steen zal geven?","2 Sam 7:16":"Doch uw huis zal bestendig zijn, en uw koninkrijk tot in eeuwigheid, voor uw aangezicht; uw troon zal vast zijn tot in eeuwigheid.","Deut 7:13-24":"en Hij zal u liefhebben, en zal u zegenen, en u meer maken; en Hij zal de vrucht van uw buik zegenen, en de vrucht van uw land, uw koren, en uw most, en uw olie, de nakomelingen van uw koeien, en de kudden van uw kleinvee, in het land dat Hij uw vaderen gezworen heeft aan u te geven. Gezegend zult u zijn boven alle volken; er zal onder u geen man of vrouw onvruchtbaar zijn, ook niet onder uw beesten; en de HEERE zal alle ziekte van u afweren, en Hij zal u geen van de kwade ziekten van de Egyptenaren, die u kent, opleggen, maar zal ze leggen op allen die u haten.","Ps 34:11":"Caph. De jonge leeuwen lijden armoede en honger; maar die de HEERE zoeken hebben geen gebrek aan enig goed.","Deut 5:33":"In heel de weg die de HEERE, uw God, u gebiedt, zult u gaan; opdat u leeft, en opdat het u goed gaat, en u de dagen verlengt in het land dat u erven zult.","Pred 3:13":"Ja ook, dat ieder mens eet en drinkt, en het goede geniet van al zijn arbeid, dit is een gave van God.","2 Sam 1:13-16":"Verder zei David tegen de jongeman die hem de boodschap gebracht had: Waar komt u vandaan? En hij zei: Ik ben de zoon van een vreemdeling, van een Amalekiet. En David zei tegen hem: Hoe hebt u niet gevreesd uw hand uit te strekken om de gezalfde van de HEERE te doden? En David riep een van de jongens, en zei: Kom dichterbij, val hem aan. En hij sloeg hem, zodat hij stierf.","2 Kron 9:17-19":"Verder maakte de koning een grote ivoren troon, en overtrok die met zuiver goud. En de troon had zes treden en een voetbank van goud, vastgemaakt aan de troon, en leuningen aan beide zijden, tot bij de zitplaats; en twee leeuwen stonden bij de leuningen. En twaalf leeuwen stonden daar aan beide zijden, op de zes treden; zoiets is in geen ander koninkrijk gemaakt geweest.","Ps 78:60":"Daarom verliet Hij de tabernakel te Silo, de tent, die Hij tot een woning gesteld had onder de mensen.","Jes 25:4":"Want U bent voor de arme een Sterkte geweest, een Sterkte voor de nooddruftige, toen het hem bang was; een Toevlucht tegen de vloed, een Schaduw tegen de hitte; want het blazen van de tirannen is als een vloed tegen een wand.","2 Sam 5:5":"In Hebron regeerde hij over Juda zeven jaar en zes maanden; en in Jeruzalem regeerde hij drieëndertig jaar over heel Israël en Juda.","Dan 2:22":"Hij openbaart diepe en verborgen dingen; Hij weet wat in het duister is, want het licht woont bij Hem.","Ex 32:27":"En hij zei tegen hen: Zo zegt de HEERE, de God van Israël: Ieder doe zijn zwaard om zijn heup; ga heen en weer, van poort tot poort in het kamp, en ieder dode zijn broeder, en elk zijn vriend, en elk zijn naaste!","Joh 14:14":"Als u iets zult vragen in Mijn Naam, Ik zal het doen.","Spr 29:26":"Velen zoeken de gunst van de heerser; maar ieders recht is van de HEERE.","Spr 18:6":"De lippen van de dwaas komen in twist, en zijn mond roept om slagen.","Deut 6:5":"Zo zult u de HEERE, uw God, liefhebben, met uw hele hart, en met uw hele ziel, en met al uw kracht.","2 Sam 16:5-8":"Toen koning David tot bij Bahurim kwam, zie, daar kwam een man vandaan uit het geslacht van het huis van Saul, van wie de naam Simeï was, de zoon van Gera; hij liep almaar door en vloekte. En hij gooide David met stenen, en ook alle knechten van koning David, hoewel al het volk en alle helden aan zijn rechter- en aan zijn linkerhand waren. Zo zei Simeï, terwijl hij vloekte: Ga weg, ga weg, man van bloed, en man van Belial!","Deut 8:3":"En Hij verootmoedigde u, en liet u hongeren, en voedde u met het manna, dat u niet kende, dat ook uw vaderen niet gekend hadden; opdat Hij u bekend zou maken dat de mens niet alleen van brood leeft, maar dat de mens leeft van alles wat uit de mond van de HEERE komt.","Joz 22:5":"Neem alleen nauwgezet in acht om te doen het gebod en de wet, die Mozes, de dienaar van de HEERE, u geboden heeft: dat u de HEERE, uw God, liefhebt, en dat u wandelt in al Zijn wegen, en Zijn geboden houdt, en Hem aanhangt, en dat u Hem dient met uw hele hart en met uw hele ziel.","Gen 49:25":"Van de God van uw vader, Die u zal helpen, en van de Almachtige, Die u zal zegenen, met zegeningen van de hemel van boven, met zegeningen van het afgrond, dat daaronder ligt, met zegeningen van de borsten en van de baarmoeder!","2 Sam 19:13":"En tegen Amasa moet u zeggen: Bent u niet mijn gebeente en mijn vlees? God doe mij zo, en meer dan dat, als u niet legeraanvoerder wordt voor mijn aangezicht, alle dagen, in de plaats van Joab.","Matt 25:33":"En Hij zal de schapen aan Zijn rechterhand zetten, maar de bokken aan Zijn linkerhand.","Hand 28:4":"En toen de inwoners het beest aan zijn hand zagen hangen, zeiden zij tegen elkaar: Deze man is zeker een moordenaar, die, hoewel hij uit de zee ontkomen is, door de wraak niet in leven gelaten wordt.","Spr 3:1":"Mijn zoon! Vergeet mijn wet niet, maar uw hart bewaart mijn geboden.","Ps 122:9":"Om het huis van de HEERE, onze God, zal ik het goede voor u zoeken.","Matt 20:20":"Toen kwam de moeder van de zonen van Zebedeüs met haar zonen naar Hem toe, boog zich voor Hem neer, en vroeg Hem iets.","Deut 4:9":"Wacht u alleen, en let goed op uzelf, dat u niet vergeet wat uw ogen gezien hebben; en dat het niet uit uw hart wijkt, al de dagen van uw leven; en u zult het aan uw kinderen en uw kleinkinderen bekendmaken.","2 Sam 15:35":"En zijn niet Zadok en Abjathar, de priesters, daar bij u? Zo zal het gebeuren, dat u alles wat u uit het huis van de koning zult horen, aan de priesters, Zadok en Abjathar, zult bekendmaken.","1 Kon 3:6":"En Salomo zei: U hebt aan Uw knecht David, mijn vader, grote goedertierenheid bewezen, zoals hij voor Uw aangezicht gewandeld heeft, in waarheid en in gerechtigheid en in oprechtheid van hart met U; en U hebt hem deze grote goedertierenheid bewaard, dat U hem een zoon gegeven hebt, die op zijn troon zit, zoals op deze dag.","1 Kor 16:2":"Op elke eerste dag van de week legt ieder van u iets bij zichzelf weg en verzamelt een schat, naardat hij welvaren verkregen heeft, opdat de verzamelingen niet eerst gebeuren wanneer ik gekomen zal zijn.","Ps 30:4":"HEERE! U hebt mijn ziel uit het graf opgevoerd; U hebt mij bij het leven behouden, zodat ik niet in de kuil neerdaalde.","2 Sam 19:23":"En de koning zei tegen Simeï: U zult niet sterven. En de koning zwoer het hem.","1 Kron 17:11-15":"En het zal gebeuren, als uw dagen vervuld zijn, dat u heengaat tot uw vaderen, dat Ik dan uw nageslacht na u zal doen opstaan, dat uit uw zonen zijn zal, en Ik zal zijn koninkrijk bevestigen. Die zal Mij een huis bouwen, en Ik zal zijn troon bevestigen tot in eeuwigheid. Ik zal hem tot een Vader zijn, en hij zal Mij tot een zoon zijn; en Mijn goedertierenheid zal Ik niet van hem wenden, zoals Ik die weggenomen heb van hem die vóór u geweest is;","2 Sam 7:25":"Nu dan, HEERE God, doe dit woord, dat U over Uw knecht en over zijn huis gesproken hebt, blijven bestaan tot in eeuwigheid, en doe zoals U gesproken hebt.","Gen 26:5":"omdat Abraham Mijn stem gehoorzaam is geweest, en Mijn bevel heeft onderhouden, Mijn geboden, Mijn inzettingen en Mijn wetten.","1 Sam 2:7":"De HEERE maakt arm en maakt rijk; Hij vernedert, ook verhoogt Hij.","1 Tess 5:4":"Maar u, broeders, u bent niet in duisternis, zodat die dag u als een dief zou overvallen.","Gen 26:4":"En Ik zal uw nageslacht vermenigvuldigen als de sterren van de hemel, en zal aan uw nageslacht al deze landen geven; en in uw nageslacht zullen alle volken van de aarde gezegend worden,","Amos 4:7-12":"Daarbij heb Ik ook de regen van u geweerd, toen er nog drie maanden waren tot de oogst, en heb doen regenen over de ene stad, maar over de andere stad niet doen regenen; het ene stuk land werd beregend, maar het andere stuk land, waar het niet op regende, verdorde. En twee, drie steden trokken rond naar één stad, opdat zij water zouden kunnen drinken, maar werden niet verzadigd; toch hebt u zich niet bekeerd tot Mij, spreekt de HEERE. Ik heb u geslagen met brandkoren en met honingdauw; de veelheid van uw hoven, en uw wijngaarden, en uw vijgenbomen, en uw olijfbomen at de rups op; toch hebt u zich niet bekeerd tot Mij, spreekt de HEERE.","1 Sam 25:28":"Vergeef toch uw dienstmaagd de overtreding, want de HEERE zal mijn heer zeker een bestendig huis maken, omdat mijn heer de oorlogen van de HEERE voert, en er geen kwaad bij u gevonden is al uw dagen.","1 Tim 4:16":"Let op uzelf en op de leer; volhard daarin; want als u dat doet, zult u zowel uzelf behouden als hen die u horen.","Deut 13:18":"wanneer u de stem van de HEERE, uw God, gehoorzaam zult zijn, om al Zijn geboden te houden, die ik u heden gebied, om te doen wat recht is in de ogen van de HEERE, uw God.","Pred 2:26":"Want Hij geeft wijsheid, kennis en vreugde aan de mens die goed is voor Zijn aangezicht; maar aan de zondaar geeft Hij de bezigheid om te verzamelen en te vergaderen, opdat Hij het geeft aan wie goed is voor Gods aangezicht. Dit is ook ijdelheid en kwelling van de geest.","Ps 19:8":"De wet van de HEERE is volmaakt, en zet de ziel om; de getuigenis van de HEERE is betrouwbaar, en geeft de eenvoudigen wijsheid.","Joh 14:13":"En wat u ook zult vragen in Mijn Naam, dat zal Ik doen, opdat de Vader in de Zoon verheerlijkt wordt.","1 Kon 2:28-34":"Toen het bericht Joab bereikte (want Joab had zich achter Adonia geschaard, hoewel hij zich niet achter Absalom had geschaard), vluchtte Joab naar de tent van de HEERE, en greep de hoornen van het altaar vast. En het werd de koning Salomo verteld dat Joab naar de tent van de HEERE gevlucht was, en zie, hij is bij het altaar. Toen stuurde Salomo Benaja, de zoon van Jojada, en zei: Ga, val op hem aan. En Benaja kwam bij de tent van de HEERE, en zei tegen hem: Zo zegt de koning: Kom naar buiten. En hij zei: Nee, hier zal ik sterven! En Benaja bracht het antwoord terug aan de koning en zei: Zo heeft Joab gesproken, en zo heeft hij mij geantwoord.","Matt 26:40":"En Hij kwam bij de discipelen en vond hen slapend, en zei tegen Petrus: Kunt u dan niet één uur met Mij waken?","1 Kon 1:5":"Adonia nu, de zoon van Haggith, verhief zich en zei: Ik zal koning zijn; en hij bereidde zich wagens en ruiters, en vijftig mannen die voor hem uit liepen.","1 Kon 1:1-4":"De koning David was oud en had veel jaren geleefd; en zij dekten hem toe met kleren, maar hij kreeg er geen warmte van. Toen zeiden zijn knechten tegen hem: Laat men voor mijn heer de koning een jonge dochter, een maagd zoeken, die voor het aangezicht van de koning staat en hem koestert; en zij slaapt in uw schoot, zodat mijn heer de koning warm wordt. Zo zochten zij een mooie jonge dochter in alle gebieden van Israël; en zij vonden Abisag, een Sunamitische, en brachten haar tot de koning.","Est 1:3-8":"in het derde jaar van zijn regering, dat hij een maaltijd gaf voor al zijn vorsten en zijn knechten; de machthebbers van Perzië en Medië, de grootste heren en de leiders van de landschappen waren voor hem aanwezig. Hij liet daarbij de rijkdom van de heerlijkheid van zijn koninkrijk zien, en de kostbaarheid van het sieraad van zijn grootheid, vele dagen lang: honderdtachtig dagen. Toen die dagen voorbij waren, gaf de koning een maaltijd voor heel het volk dat zich op de burcht Susan bevond, van de grootste tot de kleinste, zeven dagen lang, in het voorhof van de tuin van het koninklijk paleis.","Spr 3:1-4":"Mijn zoon! Vergeet mijn wet niet, maar uw hart bewaart mijn geboden. Want lengte van dagen, en jaren van leven, en vrede zullen zij u vermeerderen. Laat de goedertierenheid en de trouw u niet verlaten; bind ze aan uw hals, schrijf ze op de tafel van uw hart.","Job 5:6-11":"Want uit het stof komt het verdriet niet voort, en de moeite spruit niet uit de aarde; Maar de mens wordt tot moeite geboren; zoals de vonken van het vuur zich verheffen om te vliegen. Doch ik zou
