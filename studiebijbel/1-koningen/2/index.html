ay</span> of all the <span class=\"wl wl-kjv\" data-code=\"H776\">earth:</span> be thou <span class=\"wl wl-kjv\" data-code=\"H2388\">strong</span> therefore, and shew thyself a <span class=\"wl wl-kjv\" data-code=\"H376\">man;</span>","3":"And <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> the <span class=\"wl wl-kjv\" data-code=\"H4931\">charge</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">walk</span> in his <span class=\"wl wl-kjv\" data-code=\"H1870\">ways,</span> to <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> his <span class=\"wl wl-kjv\" data-code=\"H2708\">statutes,</span> and his <span class=\"wl wl-kjv\" data-code=\"H4687\">commandments,</span> and his <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments,</span> and his <span class=\"wl wl-kjv\" data-code=\"H5715\">testimonies,</span> as it is <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in the <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> of <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> that thou mayest <span class=\"wl wl-kjv\" data-code=\"H7919\">prosper</span> in all that thou <span class=\"wl wl-kjv\" data-code=\"H6213\">doest,</span> and whithersoever thou <span class=\"wl wl-kjv\" data-code=\"H6437\">turnest</span> thyself:","4":"That the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> may <span class=\"wl wl-kjv\" data-code=\"H6965\">continue</span> his <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> which he <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> concerning me, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> If thy <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> take <span class=\"wl wl-kjv\" data-code=\"H8104\">heed</span> to their <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">walk</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> me in <span class=\"wl wl-kjv\" data-code=\"H571\">truth</span> with all their <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> and with all their <span class=\"wl wl-kjv\" data-code=\"H5315\">soul,</span> there shall not <span class=\"wl wl-kjv\" data-code=\"H3772\">fail</span> thee <span class=\"wl wl-kjv\" data-code=\"H559\">(said</span> he) a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> on the <span class=\"wl wl-kjv\" data-code=\"H3678\">throne</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","5":"Moreover thou <span class=\"wl wl-kjv\" data-code=\"H3045\">knowest</span> also what <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H6870\">Zeruiah</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> to me, and what he <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> to the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H8269\">captains</span> of the <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> unto <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5369\">Ner,</span> and unto <span class=\"wl wl-kjv\" data-code=\"H6021\">Amasa</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3500\">Jether,</span> whom he <span class=\"wl wl-kjv\" data-code=\"H2026\">slew,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">shed</span> the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> of <span class=\"wl wl-kjv\" data-code=\"H4421\">war</span> in <span class=\"wl wl-kjv\" data-code=\"H7965\">peace,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> of <span class=\"wl wl-kjv\" data-code=\"H4421\">war</span> upon his <span class=\"wl wl-kjv\" data-code=\"H2290\">girdle</span> that was about his <span class=\"wl wl-kjv\" data-code=\"H4975\">loins,</span> and in his <span class=\"wl wl-kjv\" data-code=\"H5275\">shoes</span> that were on his <span class=\"wl wl-kjv\" data-code=\"H7272\">feet.</span>","6":"<span class=\"wl wl-kjv\" data-code=\"H6213\">Do</span> therefore according to thy <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom,</span> and let not his hoar <span class=\"wl wl-kjv\" data-code=\"H7872\">head</span> go <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to the <span class=\"wl wl-kjv\" data-code=\"H7585\">grave</span> in <span class=\"wl wl-kjv\" data-code=\"H7965\">peace.</span>","7":"But <span class=\"wl wl-kjv\" data-code=\"H6213\">shew</span> <span class=\"wl wl-kjv\" data-code=\"H2617\">kindness</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H1271\">Barzillai</span> the <span class=\"wl wl-kjv\" data-code=\"H1569\">Gileadite,</span> and let them be of those that <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> at thy <span class=\"wl wl-kjv\" data-code=\"H7979\">table:</span> for so they <span class=\"wl wl-kjv\" data-code=\"H7126\">came</span> to me when I <span class=\"wl wl-kjv\" data-code=\"H1272\">fled</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">because</span> of <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> thy <span class=\"wl wl-kjv\" data-code=\"H251\">brother.</span>","8":"And, behold, thou hast with thee <span class=\"wl wl-kjv\" data-code=\"H8096\">Shimei</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H1617\">Gera,</span> a <span class=\"wl wl-kjv\" data-code=\"H1145\">Benjamite</span> of <span class=\"wl wl-kjv\" data-code=\"H980\">Bahurim,</span> which <span class=\"wl wl-kjv\" data-code=\"H7043\">cursed</span> me with a <span class=\"wl wl-kjv\" data-code=\"H4834\">grievous</span> <span class=\"wl wl-kjv\" data-code=\"H7045\">curse</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> when I <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> to <span class=\"wl wl-kjv\" data-code=\"H4266\">Mahanaim:</span> but he came <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> me at <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan,</span> and I <span class=\"wl wl-kjv\" data-code=\"H7650\">sware</span> to him by the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> I will not put thee to <span class=\"wl wl-kjv\" data-code=\"H4191\">death</span> with the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword.</span>","9":"Now therefore hold him not <span class=\"wl wl-kjv\" data-code=\"H5352\">guiltless:</span> for thou art a <span class=\"wl wl-kjv\" data-code=\"H2450\">wise</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> and <span class=\"wl wl-kjv\" data-code=\"H3045\">knowest</span> what thou oughtest to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> unto him; but his hoar <span class=\"wl wl-kjv\" data-code=\"H7872\">head</span> bring thou <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to the <span class=\"wl wl-kjv\" data-code=\"H7585\">grave</span> with <span class=\"wl wl-kjv\" data-code=\"H1818\">blood.</span>","10":"So <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H7901\">slept</span> with his <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> and was <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> in the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David.</span>","11":"And the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> that <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> over <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> were <span class=\"wl wl-kjv\" data-code=\"H705\">forty</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years:</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> he in <span class=\"wl wl-kjv\" data-code=\"H2275\">Hebron,</span> and <span class=\"wl wl-kjv\" data-code=\"H7970\">thirty</span> and <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> he in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem.</span>","12":"Then <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> upon the <span class=\"wl wl-kjv\" data-code=\"H3678\">throne</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father;</span> and his <span class=\"wl wl-kjv\" data-code=\"H4438\">kingdom</span> was <span class=\"wl wl-kjv\" data-code=\"H3559\">established</span> <span class=\"wl wl-kjv\" data-code=\"H3966\">greatly.</span>","13":"And <span class=\"wl wl-kjv\" data-code=\"H138\">Adonijah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H2294\">Haggith</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H1339\">Bathsheba</span> the <span class=\"wl wl-kjv\" data-code=\"H517\">mother</span> of <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon.</span> And she <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H935\">Comest</span> thou <span class=\"wl wl-kjv\" data-code=\"H7965\">peaceably?</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H7965\">Peaceably.</span>","14":"He <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> moreover, I have somewhat to <span class=\"wl wl-kjv\" data-code=\"H1697\">say</span> unto thee. And she <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Say <span class=\"wl wl-kjv\" data-code=\"H1696\">on.</span>","15":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Thou <span class=\"wl wl-kjv\" data-code=\"H3045\">knowest</span> that the <span class=\"wl wl-kjv\" data-code=\"H4410\">kingdom</span> was mine, and that all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> their <span class=\"wl wl-kjv\" data-code=\"H6440\">faces</span> on me, that I should <span class=\"wl wl-kjv\" data-code=\"H4427\">reign:</span> howbeit the <span class=\"wl wl-kjv\" data-code=\"H4410\">kingdom</span> is turned <span class=\"wl wl-kjv\" data-code=\"H5437\">about,</span> and is become my <span class=\"wl wl-kjv\" data-code=\"H251\">brother's:</span> for it was his from the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","16":"And now I <span class=\"wl wl-kjv\" data-code=\"H7592\">ask</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H7596\">petition</span> of thee, <span class=\"wl wl-kjv\" data-code=\"H7725\">deny</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">me</span> not. And she <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Say <span class=\"wl wl-kjv\" data-code=\"H1696\">on.</span>","17":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">Speak,</span> I pray thee, unto <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> (for he will not <span class=\"wl wl-kjv\" data-code=\"H7725\">say</span> ➔ <span class=\"wl wl-kjv\" data-code=\"H6440\">thee</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">nay,)</span> that he <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> me <span class=\"wl wl-kjv\" data-code=\"H49\">Abishag</span> the <span class=\"wl wl-kjv\" data-code=\"H7767\">Shunammite</span> to <span class=\"wl wl-kjv\" data-code=\"H802\">wife.</span>","18":"And <span class=\"wl wl-kjv\" data-code=\"H1339\">Bathsheba</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">Well;</span> I will <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> for thee unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span>","19":"<span class=\"wl wl-kjv\" data-code=\"H1339\">Bathsheba</span> therefore <span class=\"wl wl-kjv\" data-code=\"H935\">went</span> unto <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon,</span> to <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> unto him for <span class=\"wl wl-kjv\" data-code=\"H138\">Adonijah.</span> And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> rose <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> her, and <span class=\"wl wl-kjv\" data-code=\"H7812\">bowed</span> himself unto her, and sat <span class=\"wl wl-kjv\" data-code=\"H3427\">down</span> on his <span class=\"wl wl-kjv\" data-code=\"H3678\">throne,</span> and caused a <span class=\"wl wl-kjv\" data-code=\"H3678\">seat</span> to be <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> for the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H517\">mother;</span> and she <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> on his right <span class=\"wl wl-kjv\" data-code=\"H3225\">hand.</span>","20":"Then she <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I <span class=\"wl wl-kjv\" data-code=\"H7592\">desire</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H6996\">small</span> <span class=\"wl wl-kjv\" data-code=\"H7596\">petition</span> of thee; I pray thee, <span class=\"wl wl-kjv\" data-code=\"H7725\">say</span> ➔ <span class=\"wl wl-kjv\" data-code=\"H6440\">me</span> not <span class=\"wl wl-kjv\" data-code=\"H7725\">nay.</span> And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, Ask <span class=\"wl wl-kjv\" data-code=\"H7592\">on,</span> my <span class=\"wl wl-kjv\" data-code=\"H517\">mother:</span> for I will not <span class=\"wl wl-kjv\" data-code=\"H7725\">say</span> ➔ <span class=\"wl wl-kjv\" data-code=\"H6440\">thee</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">nay.</span>","21":"And she <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Let <span class=\"wl wl-kjv\" data-code=\"H49\">Abishag</span> the <span class=\"wl wl-kjv\" data-code=\"H7767\">Shunammite</span> be <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> to <span class=\"wl wl-kjv\" data-code=\"H138\">Adonijah</span> thy <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> to <span class=\"wl wl-kjv\" data-code=\"H802\">wife.</span>","22":"And <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto his <span class=\"wl wl-kjv\" data-code=\"H517\">mother,</span> And why dost thou <span class=\"wl wl-kjv\" data-code=\"H7592\">ask</span> <span class=\"wl wl-kjv\" data-code=\"H49\">Abishag</span> the <span class=\"wl wl-kjv\" data-code=\"H7767\">Shunammite</span> for <span class=\"wl wl-kjv\" data-code=\"H138\">Adonijah?</span> <span class=\"wl wl-kjv\" data-code=\"H7592\">ask</span> for him the <span class=\"wl wl-kjv\" data-code=\"H4410\">kingdom</span> also; for he is mine <span class=\"wl wl-kjv\" data-code=\"H1419\">elder</span> <span class=\"wl wl-kjv\" data-code=\"H251\">brother;</span> even for him, and for <span class=\"wl wl-kjv\" data-code=\"H54\">Abiathar</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> and for <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H6870\">Zeruiah.</span>","23":"Then <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H7650\">sware</span> by the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> so to me, and more <span class=\"wl wl-kjv\" data-code=\"H3254\">also,</span> if <span class=\"wl wl-kjv\" data-code=\"H138\">Adonijah</span> have not <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> this <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> against his own <span class=\"wl wl-kjv\" data-code=\"H5315\">life.</span>","24":"Now therefore, as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> which hath <span class=\"wl wl-kjv\" data-code=\"H3559\">established</span> me, and <span class=\"wl wl-kjv\" data-code=\"H3427\">set</span> me on the <span class=\"wl wl-kjv\" data-code=\"H3678\">throne</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> my <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> and who hath <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> me an <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> as he <span class=\"wl wl-kjv\" data-code=\"H1696\">promised,</span> <span class=\"wl wl-kjv\" data-code=\"H138\">Adonijah</span> shall be put to <span class=\"wl wl-kjv\" data-code=\"H4191\">death</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day.</span>","25":"And <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> by the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H1141\">Benaiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3077\">Jehoiada;</span> and he <span class=\"wl wl-kjv\" data-code=\"H6293\">fell</span> upon him that he <span class=\"wl wl-kjv\" data-code=\"H4191\">died.</span>","26":"And unto <span class=\"wl wl-kjv\" data-code=\"H54\">Abiathar</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Get</span> thee to <span class=\"wl wl-kjv\" data-code=\"H6068\">Anathoth,</span> unto thine own <span class=\"wl wl-kjv\" data-code=\"H7704\">fields;</span> for thou art <span class=\"wl wl-kjv\" data-code=\"H376\">worthy</span> of <span class=\"wl wl-kjv\" data-code=\"H4194\">death:</span> but I will not at this <span class=\"wl wl-kjv\" data-code=\"H3117\">time</span> put thee to <span class=\"wl wl-kjv\" data-code=\"H4191\">death,</span> because thou <span class=\"wl wl-kjv\" data-code=\"H5375\">barest</span> the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> of the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> my <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> and because thou hast been <span class=\"wl wl-kjv\" data-code=\"H6031\">afflicted</span> in all wherein my <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> was <span class=\"wl wl-kjv\" data-code=\"H6031\">afflicted.</span>","27":"So <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> thrust <span class=\"wl wl-kjv\" data-code=\"H1644\">out</span> <span class=\"wl wl-kjv\" data-code=\"H54\">Abiathar</span> from being <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> that he might <span class=\"wl wl-kjv\" data-code=\"H4390\">fulfil</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> which he <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> concerning the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H5941\">Eli</span> in <span class=\"wl wl-kjv\" data-code=\"H7887\">Shiloh.</span>","28":"Then <span class=\"wl wl-kjv\" data-code=\"H8052\">tidings</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab:</span> for <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> had <span class=\"wl wl-kjv\" data-code=\"H5186\">turned</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> <span class=\"wl wl-kjv\" data-code=\"H138\">Adonijah,</span> though he <span class=\"wl wl-kjv\" data-code=\"H5186\">turned</span> not <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom.</span> And <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> <span class=\"wl wl-kjv\" data-code=\"H5127\">fled</span> unto the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and caught <span class=\"wl wl-kjv\" data-code=\"H2388\">hold</span> on the <span class=\"wl wl-kjv\" data-code=\"H7161\">horns</span> of the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar.</span>","29":"And it was <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> that <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> was <span class=\"wl wl-kjv\" data-code=\"H5127\">fled</span> unto the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> and, behold, he is <span class=\"wl wl-kjv\" data-code=\"H681\">by</span> the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar.</span> Then <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H1141\">Benaiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3077\">Jehoiada,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Go,</span> <span class=\"wl wl-kjv\" data-code=\"H6293\">fall</span> upon him.","30":"And <span class=\"wl wl-kjv\" data-code=\"H1141\">Benaiah</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> Come <span class=\"wl wl-kjv\" data-code=\"H3318\">forth.</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Nay; but I will <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> here. And <span class=\"wl wl-kjv\" data-code=\"H1141\">Benaiah</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">brought</span> ➔ the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">again,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H1696\">said</span> <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab,</span> and thus he <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> me.","31":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H6213\">Do</span> as he hath <span class=\"wl wl-kjv\" data-code=\"H1696\">said,</span> and <span class=\"wl wl-kjv\" data-code=\"H6293\">fall</span> upon him, and <span class=\"wl wl-kjv\" data-code=\"H6912\">bury</span> him; that thou mayest take <span class=\"wl wl-kjv\" data-code=\"H5493\">away</span> the <span class=\"wl wl-kjv\" data-code=\"H2600\">innocent</span> <span class=\"wl wl-kjv\" data-code=\"H1818\">blood,</span> which <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> <span class=\"wl wl-kjv\" data-code=\"H8210\">shed,</span> from me, and from the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of my <span class=\"wl wl-kjv\" data-code=\"H1\">father.</span>","32":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> his <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> upon his own <span class=\"wl wl-kjv\" data-code=\"H7218\">head,</span> who <span class=\"wl wl-kjv\" data-code=\"H6293\">fell</span> upon <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> more <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous</span> and <span class=\"wl wl-kjv\" data-code=\"H2896\">better</span> than he, and <span class=\"wl wl-kjv\" data-code=\"H2026\">slew</span> them with the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> my <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> not <span class=\"wl wl-kjv\" data-code=\"H3045\">knowing</span> thereof, to wit, <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5369\">Ner,</span> <span class=\"wl wl-kjv\" data-code=\"H8269\">captain</span> of the <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and <span class=\"wl wl-kjv\" data-code=\"H6021\">Amasa</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3500\">Jether,</span> <span class=\"wl wl-kjv\" data-code=\"H8269\">captain</span> of the <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah.</span>","33":"Their <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> shall therefore <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> upon the <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> of <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab,</span> and upon the <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> of his <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever:</span> but upon <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> and upon his <span class=\"wl wl-kjv\" data-code=\"H2233\">seed,</span> and upon his <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and upon his <span class=\"wl wl-kjv\" data-code=\"H3678\">throne,</span> shall there be <span class=\"wl wl-kjv\" data-code=\"H7965\">peace</span> <span class=\"wl wl-kjv\" data-code=\"H5704\">for</span> <span class=\"wl wl-kjv\" data-code=\"H5769\">ever</span> from the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","34":"So <span class=\"wl wl-kjv\" data-code=\"H1141\">Benaiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3077\">Jehoiada</span> went <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> and <span class=\"wl wl-kjv\" data-code=\"H6293\">fell</span> upon him, and <span class=\"wl wl-kjv\" data-code=\"H4191\">slew</span> him: and he was <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> in his own <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness.</span>","35":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> <span class=\"wl wl-kjv\" data-code=\"H1141\">Benaiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3077\">Jehoiada</span> in his room over the <span class=\"wl wl-kjv\" data-code=\"H6635\">host:</span> and <span class=\"wl wl-kjv\" data-code=\"H6659\">Zadok</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> did the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> in the room of <span class=\"wl wl-kjv\" data-code=\"H54\">Abiathar.</span>","36":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> and <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> for <span class=\"wl wl-kjv\" data-code=\"H8096\">Shimei,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H1129\">Build</span> thee an <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> there, and go not <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> thence any <span class=\"wl wl-kjv\" data-code=\"H575\">whither.</span>","37":"For it shall be, that on the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> thou goest <span class=\"wl wl-kjv\" data-code=\"H3318\">out,</span> and passest <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> the <span class=\"wl wl-kjv\" data-code=\"H5158\">brook</span> <span class=\"wl wl-kjv\" data-code=\"H6939\">Kidron,</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> for <span class=\"wl wl-kjv\" data-code=\"H3045\">certain</span> that thou shalt <span class=\"wl wl-kjv\" data-code=\"H4191\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">die:</span> thy <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> shall be upon thine own <span class=\"wl wl-kjv\" data-code=\"H7218\">head.</span>","38":"And <span class=\"wl wl-kjv\" data-code=\"H8096\">Shimei</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> The <span class=\"wl wl-kjv\" data-code=\"H1697\">saying</span> is <span class=\"wl wl-kjv\" data-code=\"H2896\">good:</span> as my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> hath <span class=\"wl wl-kjv\" data-code=\"H1696\">said,</span> so will thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">do.</span> And <span class=\"wl wl-kjv\" data-code=\"H8096\">Shimei</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days.</span>","39":"And it came to pass at the <span class=\"wl wl-kjv\" data-code=\"H7093\">end</span> of <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years,</span> that <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> of the <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> of <span class=\"wl wl-kjv\" data-code=\"H8096\">Shimei</span> ran <span class=\"wl wl-kjv\" data-code=\"H1272\">away</span> unto <span class=\"wl wl-kjv\" data-code=\"H397\">Achish</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H4601\">Maachah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H1661\">Gath.</span> And they <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> <span class=\"wl wl-kjv\" data-code=\"H8096\">Shimei,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Behold, thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> be in <span class=\"wl wl-kjv\" data-code=\"H1661\">Gath.</span>","40":"And <span class=\"wl wl-kjv\" data-code=\"H8096\">Shimei</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and <span class=\"wl wl-kjv\" data-code=\"H2280\">saddled</span> his <span class=\"wl wl-kjv\" data-code=\"H2543\">ass,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> to <span class=\"wl wl-kjv\" data-code=\"H1661\">Gath</span> to <span class=\"wl wl-kjv\" data-code=\"H397\">Achish</span> to <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants:</span> and <span class=\"wl wl-kjv\" data-code=\"H8096\">Shimei</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> from <span class=\"wl wl-kjv\" data-code=\"H1661\">Gath.</span>","41":"And it was <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> that <span class=\"wl wl-kjv\" data-code=\"H8096\">Shimei</span> had <span class=\"wl wl-kjv\" data-code=\"H1980\">gone</span> from <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> to <span class=\"wl wl-kjv\" data-code=\"H1661\">Gath,</span> and was come <span class=\"wl wl-kjv\" data-code=\"H7725\">again.</span>","42":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> and <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> for <span class=\"wl wl-kjv\" data-code=\"H8096\">Shimei,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Did I not make thee to <span class=\"wl wl-kjv\" data-code=\"H7650\">swear</span> by the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H5749\">protested</span> unto thee, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">Know</span> for a <span class=\"wl wl-kjv\" data-code=\"H3045\">certain,</span> on the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> thou goest <span class=\"wl wl-kjv\" data-code=\"H3318\">out,</span> and <span class=\"wl wl-kjv\" data-code=\"H1980\">walkest</span> abroad any <span class=\"wl wl-kjv\" data-code=\"H575\">whither,</span> that thou shalt <span class=\"wl wl-kjv\" data-code=\"H4191\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">die?</span> and thou <span class=\"wl wl-kjv\" data-code=\"H559\">saidst</span> unto me, The <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> that I have <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> is <span class=\"wl wl-kjv\" data-code=\"H2896\">good.</span>","43":"Why then hast thou not <span class=\"wl wl-kjv\" data-code=\"H8104\">kept</span> the <span class=\"wl wl-kjv\" data-code=\"H7621\">oath</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4687\">commandment</span> that I have <span class=\"wl wl-kjv\" data-code=\"H6680\">charged</span> thee with?","44":"The <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> moreover to <span class=\"wl wl-kjv\" data-code=\"H8096\">Shimei,</span> Thou <span class=\"wl wl-kjv\" data-code=\"H3045\">knowest</span> all the <span class=\"wl wl-kjv\" data-code=\"H7451\">wickedness</span> which thine <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> is privy <span class=\"wl wl-kjv\" data-code=\"H3045\">to,</span> that thou <span class=\"wl wl-kjv\" data-code=\"H6213\">didst</span> to <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> my <span class=\"wl wl-kjv\" data-code=\"H1\">father:</span> therefore the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> thy <span class=\"wl wl-kjv\" data-code=\"H7451\">wickedness</span> upon thine own <span class=\"wl wl-kjv\" data-code=\"H7218\">head;</span>","45":"And <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> shall be <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3678\">throne</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> shall be <span class=\"wl wl-kjv\" data-code=\"H3559\">established</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5704\">for</span> <span class=\"wl wl-kjv\" data-code=\"H5769\">ever.</span>","46":"So the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> <span class=\"wl wl-kjv\" data-code=\"H1141\">Benaiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3077\">Jehoiada;</span> which went <span class=\"wl wl-kjv\" data-code=\"H3318\">out,</span> and <span class=\"wl wl-kjv\" data-code=\"H6293\">fell</span> upon him, that he <span class=\"wl wl-kjv\" data-code=\"H4191\">died.</span> And the <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdom</span> was <span class=\"wl wl-kjv\" data-code=\"H3559\">established</span> in the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"Ik ga heen","tekst":"Deze manier van spreken hebben wij ook Jos 23:14, en betekent de scheiding des mensen uit deze wereld, door den lichamelijken dood, welken niemand kan ontgaan; Heb 9:27."},{"catchword":"wees een man","tekst":"Hebreeuws, tot een man; dat is, hoewel gij nog jong zijt; 1Ch 22:5 sta nochtans naar de deugden van een man, meest gelegen in verstand, kloeken moed en gestadigheid."}],"3":[{"catchword":"neem waar de wacht des HEEREN,","tekst":"Deze manier van spreken wordt elders van den dienst des tabernakels gebruikt, gelijk Lev 8:35; Num 3:7, maar hier en elders van de burgerlijke plichten, die de prinsen en andere oversten moesten waarnemen, achtervolgens de orde hun van God voorgeschreven. Zie Jos 22:3; 2Ki 11:5. Doch het woord wacht wordt ook overgezet bevel, betekenende in het gemeen al hetgeen de Heere ons voorgeschreven heeft te doen of te laten. Zie Gen 26:5."},{"catchword":"inzettingen,","tekst":"Deze eerste drie woorden worden zo onderscheiden, die het eerste genomen wordt voor de ceremoniëele wetten; het tweede voor de wetten der zeden; het derde voor de burgerlijke rechten. Zie Gen 26:5; Deu 5:31."},{"catchword":"getuigenissen,","tekst":"Versta, de leer der zaligheid, die van Gods wil tegen ons en van onzen schuldigen plicht tegen hem volkomenlijk betuigen. Zie Deu 4:45."},{"catchword":"verstandelijk","tekst":"Of, voorspoedig maakt alles, enz. Zie deze manier van spreken, Deu 29:9."}],"4":[{"catchword":"weg bewaren,","tekst":"Dat is, zich in genegenheden, voornemen, woorden en werken naar mijn wil schikken; alzo onder, 1Ki 8:25; 2Ki 20:3; 2Ch 6:16. Dit noemt Mozes zijn ziel bewaren, Deu 4:15."},{"catchword":"voor Mijn aangezicht","tekst":"Dat is, oprechtelijk als in de tegenwoordigheid Gods [die het hart kent], naar alle geboden te leven. Zie 2Ki 20:2, en 2Ch 6:16."},{"catchword":"hun ganse hart","tekst":"Dat is, God te gehoorzamen, oprechtelijk, en zonder geveinsdheid, niet naar sommige maar naar al zijn geboden; welke gehoorzaamheid Hij aanziet niet in haar natuur, maar naar zijn genade in Christus, in denwelken zij volmaakt is; Col 2:10."},{"catchword":"u afgesneden worden","tekst":"De zin is, dat niemand van zijn nakomelingen ontbreken zou om te regeren; te weten, totdat de Messias komen zou, wiens koninkrijk eeuwig zou zijn."}],"5":[{"catchword":"mij gedaan heeft,","tekst":"Te weten, altijd zeer trots tegen mij geweest zijnde, omdat hij den krijgslieden zeer aangenaam was. Zie 2Sa 3:39, en 2Sa 3:19."},{"catchword":"krijgsbloed","tekst":"Hebreeuws, heeft bloeden des krijgs gezet; dat is, moorderijen aangericht. Nu heet krijgsbloed dat in den krijg vergoten wordt, maar Joab had bloed vergoten in tijd van vrede."},{"catchword":"aan zijn gordel,","tekst":"Te weten, stekende zijn bloedig zwaard in de schede nadat hij die twee mannen vermoord had."},{"catchword":"aan zijn schoenen,","tekst":"Op welke van het bloed der doorstekenen gevallen is."}],"6":[{"catchword":"naar uw wijsheid,","tekst":"Te weten, naar welke gij wel gelegenheid vinden zult om hem te straffen, alzo hij een man is tot nieuwigheden en beroerten genegen."},{"catchword":"zijn grauwe haar","tekst":"Hebreeuws, zijn grijzigheid, of grauwigheid; dat is, zijn grauwe ouderdom. De zin is, dat Salomo Joab niet zou laten sterven zijn natuurlijken dood, maar een geweldigen hem aandoen. Zie de verklaring onder, vs.8, en vergelijk Gen 42:38, en Gen 44:29, Gen 44:31."}],"7":[{"catchword":"onder degenen,","tekst":"Hebreeuws, onder uw tafeleters; dat is, die van de spijs uwer tafel eten."},{"catchword":"naderden","tekst":"Te weten, mij toebrengende en voorstellende allerlei leeftocht, dien ik in een dorre en woeste plaats wel van doen had. Zie 2Sa 17:27-29."}],"8":[{"catchword":"de Ben aminiet","tekst":"Anders, een Benjaminiet. Zie Jdg 19:16, en 2Sa 16:11."},{"catchword":"Mahanáïm;","tekst":"Een stad gelegen over de Jordaan in het land Gilead, in den stam van Gad bij de beek Jabbok. Van den oorsprong harer benaming, zie Gen 32:2."},{"catchword":"zwoer hem bij den HEERE,","tekst":"Zie 2Sa 19:23."},{"catchword":"Zo ik hem met het zwaard dode","tekst":"Hebreeuws, zo ik u met het zwaard dode, [God straffe mij] of [doe mij dit of dat]. Want de Hebreën plegen in het zweren de straf te verzwijgen. Zie Gen 14:23."}],"9":[{"catchword":"niet onschuldig,","tekst":"Dat is, laat hem niet ongestraft blijven. Alzo Exo 20:7, en Exo 34:7, en Job 9:28."},{"catchword":"wat gij hem doen zult,","tekst":"Namelijk, naar de wijsheid, die u de Heere gegeven heeft, latende aan deze bevolen zijn de manier hoe gij hem ter dood brengen zult. Vergelijk boven, vs.6."}],"10":[{"catchword":"ontsliep met zijn vaderen,","tekst":"Zie boven, 1Ki 1:21, en Deu 31:16."},{"catchword":"stad Davids","tekst":"Versta, den burg, waar David zijn huis had. Alzo onder, 1Ki 3:1. Zie 2Sa 5:7; 1Ch 11:5; 2Ch 5:2."}],"11":[{"catchword":"dagen nu,","tekst":"Dat is, de tijd."},{"catchword":"Hebron,","tekst":"De naam ener stad, van welke zie Gen 23:2."}],"13":[{"catchword":"Is uw komst vrede?","tekst":"Hebreeuws, is uw komen vrede? Alzo 1Sa 16:4. Zij spreekt uit vrees dat hij moeite maken zou, omdat hij naar het koninkrijk gestaan had. Het is zoveel alsof zij zeide: Dient uw komst tot welstand van het koninkrijk en van het gemenebest? Wat vrede bij de Hebreën betekent, zie Gen 37:14."}],"15":[{"catchword":"mijn was,","tekst":"Te weten, omdat ik de oudste van mijns vaders zonen ben. Zie boven, 1Ki 1:5."},{"catchword":"zijn aangezicht","tekst":"Dat is, had zijn ogen op mij geworpen, hopende dat het koninkrijk mijne zou worden, en mij hetzelve gunnende. Vergelijk Jer 42:15 met de aantekening."},{"catchword":"want het is van den HEERE hem geworden","tekst":"Hij gelaat zich dat hij zijn broeder Salomo het koninkrijk gunde, misbruikende tot dit einde den naam des Heeren, en zeer listiglijk verbergende zijn voornemen, hetwelk was door middel van de Sunamietische een aanhang te maken, en alzo het koninkrijk tot zich te trekken, hetwelk de koning Salomo terstond wel gemerkt heeft, gelijk blijkt uit vs.22."}],"16":[{"catchword":"wijs mijn aangezicht niet af","tekst":"Dat is, wil mijn bede niet afslaan; alzo vs.17, 20; 2Ch 6:42; Psa 132:10. Het tegendeel dezer manier van spreken is, iemands aangezicht opnemen. Zie Gen 19:21."}],"19":[{"catchword":"des konings zetten;","tekst":"Dat is, voor zijn moeder. Het is een manier van spreken der Hebreën. Alzo onder, 1Ki 8:1, en 1Ki 9:1, en 1Ki 11:9. Vergelijk Gen 5:1."},{"catchword":"zij zat aan zijn rechterhand","tekst":"Zijnde aldus vereerd met gelijke waardigheid en hoogheid als haar zoon, en dat naar de manier van doen der grote heren, welke dengenen, wien zij gelijke eer of de eerste naast hen toestaan, plegen tot hun rechterhand te stellen. Vergelijk Mat 20:21."}],"20":[{"catchword":"kleine begeerte,","tekst":"Te weten, kleine naar haar gevoelen, maar niet naar het oordeel des konings, gelijk blijkt uit zijn antwoord."}],"22":[{"catchword":"Begeer ook voor hem","tekst":"Salomo merkt waarheen de bede van Adonia strekte, namelijk tot een nieuwe beroerte om, door middel van het verzochte huwelijk, te bekwamelijker tot het koninkrijk te geraken. Hierom, die zich begeerden groot te maken, hebben deze praktijk meermalen gebruikt. Zie 2Sa 3:7, en 2Sa 16:21."},{"catchword":"ouder is","tekst":"Hebreeuws, groter, of, meerder; te weten, van ouderdom."},{"catchword":"Abjathar,","tekst":"Dewelken Adonia toegedaan waren, zonder twijfel opdat zij in hun ambten en staten zouden mogen blijven, en vrij van gevaar zijn."}],"23":[{"catchword":"leven gesproken hebben","tekst":"Hebreeuws, tegen zijn ziel; dat is, tot nadeel van zijn leven. Het woord ziel wordt voor het leven dikwijls genomen. Zie Gen 19:17."}],"24":[{"catchword":"doen zitten","tekst":"Dat is, als koning doen regeren. Alzo 2Ki 10:3, en 2Ch 23:20. Vergelijk boven, 1Ki 1:13 de aantekeningen."},{"catchword":"een huis gemaakt heeft,","tekst":"Dat is, een huisgezin, en hof naar den staat en waardigheid van een koning; want het woord huis betekent dikwijls het gehele hof en den gansen trein der hovelingen. Zie Gen 34:19."},{"catchword":"gedood worden","tekst":"Als hebbende de koninklijke majesteit gekwetst."}],"25":[{"catchword":"zond","tekst":"Dat is, zond Benaja, hem bevelende dat hij door zijn hand Adonia doden zou. Zie Gen 12:15."},{"catchword":"viel op hem aan,","tekst":"Te weten, met wapen, bekwaam om hem te doden. Alzo ook vs.31, 32, 34, 46. vs.32 spreekt van twee aanvallen, die met het zwaard geschiedden."}],"26":[{"catchword":"Anathoth,","tekst":"De naam van een priesterlijke stad, gelegen in den stam van Benjamin, waar Abjathar de prieser en Jeremia de profeet geboren zijn. Zie van deze Jos 21:18; Jer 1:1."},{"catchword":"een man des doods;","tekst":"Dat is, des doods schuldig, of die den dood waardig is. Alzo 2Sa 12:5; idem, zonen des doods, 1Sa 26:16."},{"catchword":"op dezen dag","tekst":"Hetwelk aldus kan verstaan worden, dat Salomo met een mindere straf zich voor dezen tijd heeft laten genoegen, hem houdende ondertussen onder de doodsschuld, alzo dat zo hij in toekomende tijden iets dergelijks kwam te bedrijven, hij het met den dood bezuren zou."}],"27":[{"catchword":"verdreef Abjathar,","tekst":"Niet dat Salomo hem van zijn priesterambt eigenlijk heeft afgezet, want hij was reeds bij het leven van David, om zijn misdaad tegen de koninklijke majesteit begaan, afgezet, toen Zadok in zijn plaats gezalfd werd, 1Ch 29:22, maar hij heeft hem verdreven, dat is gebannen in zijn huis te Anathoth, waaruit noodzakelijk moest volgen dat hij het priesterambt te Jeruzalem niet kon bedienen; zijnde ook als politiek dood."},{"catchword":"dat hij des HEEREN priester niet ware,","tekst":"Hebreeuws, van den Heere, of des Heeren priester te zijn."},{"catchword":"om te vervullen","tekst":"Hetwelk wel aldus van Salomo geschied is, maar door het verborgen beleid des heren, waarop Salomo misschien op dien tijd niet heeft gedacht. Zie de voorzeggingen dezer vervulling 1Sa 2:33, en vergelijk Mat 13:35, en Mat 27:9; Joh 12:38, en Joh 19:24, welke plaatsen aanwijzen dat de profetieën Gods zeer dikwijls door de mensen buiten hun weten vervuld worden."},{"catchword":"het woord des HEEREN,","tekst":"Namelijk dat het huis van Eli, hetwelk van Ithamar afkomstig was, van het hogepriesterambt verstoten zou worden, en een ander huis in zijne plaats zou komen. Hetwelk vervuld is in Zadok, die uit het geslacht van Eleazar voortkomstig was. Zie 1Sa 2:35, en vergelijk Eze 44:15."},{"catchword":"Silo gesproken had","tekst":"Een stad in den stam van Efraïm, waar de ark des Heeren langen tijd geweest is; Jos 18:1; Jdg 21:19; Psa 78:60."}],"28":[{"catchword":"vatte de hoornen des altaars","tekst":"Zie boven, 1Ki 1:50."}],"29":[{"catchword":"de tent des HEEREN","tekst":"Welke met het altaar, door het bevel Gods in de woestijn gemaakt, Exo 36:1-3, enz., en Exo 38:1, enz., te dezen tijde waren binnen Gibeon, 2Ch 1:3, 2Ch 1:5."}],"31":[{"catchword":"hij gesproken heeft,","tekst":"Namelijk Joab. En versta dit naar de wet, Exo 21:14."}],"32":[{"catchword":"zijn bloed","tekst":"Te weten, dat hij met onrecht vergoten heeft. God keert het bloed van een ander op iemands hoofd, als Hij den dood, dien hij een ander moedwilliglijk aangedaan heeft, wederom het met den dood vergeldt, of door hem zelven, Gen 4:11, of door den mens, Gen 9:6; alzo onder, vs.44; Jdg 9:24, Jdg 9:57; 2Sa 16:8."},{"catchword":"daar het mijn vader David niet wist,","tekst":"Dat is, waarvan mijn vader geen kennis had eer het geschiedde, en dat hij niet toestond toen het geschied was. Zie 2Sa 3:28-29, en boven, vs.5."}],"33":[{"catchword":"bloed","tekst":"Hebreeuws, bloeden. Het woord bloed wordt gesteld in het getal van velen, niet alleen omdat Joab twee mannen vermoord had, maar omdat dikwijls dit woord, alzo gesteld zijnde, betekent de schuld en straf des doods, die de doodslagers over zich brengen, Exo 22:2-3; Psa 51:16, hoewel somtijds ook in het enkel getal, Gen 42:22."},{"catchword":"in eeuwigheid;","tekst":"Dat is, een lange tijd, zolang als Joabs vaderlijk huis duren zal. Zie 2Sa 3:29, en vergelijk boven, 1Ki 1:31, en de aantekeningen."},{"catchword":"eeuwigheid","tekst":"Versta ten aanzien van den uiterlijken welstand een langen tijd, gelijk recht tevoren, en ten aanzien van den geestelijken in Christus, een tijd zonder einde."}],"35":[{"catchword":"Zadok,","tekst":"Die al tevoren bij het leven van David met toestemming van de ganse vergadering was gezalfd. Zie 1Ch 29:22, hetwelk Salomo hier metterdaad goedkeurt."}],"37":[{"catchword":"Kidron","tekst":"Is geweest een beek, vloeiende tussen Jeruzalem en den Olijfberg, door een duister dal oostwaarts van de stad. Zie van deze 2Sa 15:23; 2Ki 23:4; Joh 18:1."},{"catchword":"weet voorzeker,","tekst":"Hebreeuws, wetende weet; alzo onder, vs.42."},{"catchword":"den dood sterven zult;","tekst":"Hebreeuws, stervende zult sterven; alzo onder, vs.42."},{"catchword":"bloed","tekst":"Zie Lev 20:9."}],"39":[{"catchword":"Achis,","tekst":"Zie van dezen, 1Sa 21:10."},{"catchword":"Máächa,","tekst":"Anders genoemd Maoch; 1Sa 27:1."},{"catchword":"Gath;","tekst":"De naam van een stad in den stam van Dan, die bewoond was van reuzen, afkomstig uit de Filistijnen, Jos 11:22, gelijk ook de reus Goliath van deze stad was, 1Sa 17:4."}],"43":[{"catchword":"eed des HEEREN","tekst":"Versta, den eed bij den naam des Heeren gedaan, denwelken Salomo had gevoegd bij zijn dreigementen tegen Simeï uitgesproken. Zie het voorgaande vs.42."}],"44":[{"catchword":"op uw hoofd","tekst":"Zie boven, vs.32."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Now when Davids days were near that he should die, then he charged his son Salomon, saying;"}],"2":[{"catchword":null,"tekst":"Depart in the way of all the earth: [This phrase is also found, Jos.23.14. and signifieth the departure of man out of this world, by bodily death, which none can escape, Heb 9:27.] so be strong, and be a man. [Heb. for, or, to a man: although thou art yet but young, 1 Chron.22. 5. nevertheless labour to get the vertues of a man, consisting chiefly in wisdom and understanding, a courageous mind, and stedfastness.]"}],"3":[{"catchword":null,"tekst":"And take heed to the guard of the LORD thy God, [This phrase is elsewhere used of the service of the Tabernacle, as Lev 8.35. Num 3:7. but here and in some other places of the civil Duties, which Princes and other Governors were to mind and observe, according to the order prescribed them by God. See Jos.22.3. 2 King.11.5. But the word guard is also translated command, or, charge, signifying in general all that the Lord hath prescribed us, either to do, or to omit. See Genes.26.on ver.5.] to walk in his ways, to keep his statutes, and his commandements, and his judgments. [These three first words are thus distinguished, that the first is taken for the ceremonial, the second for the moral, the third for the judicial or civil laws. See Genes.26.on ver.5. Deut.5.on ver.31.] and his testimonies, [understand the doctrine of salvation, which fully testifieth of Gods will toward us, and of our duty toward him. See Deut.4.on ver.45.] as is written in the law of Moseh: [See Deut.17 18.] that thou mayest deal understandingly in all that thou shalt do, and whithersoever thou shalt turn thyself. [or, make all prosper, &c. See this phrase, Deut.29.9. Jos.1.7.]"}],"4":[{"catchword":null,"tekst":"That the LORD may confirm his word, which he spake concerning me, saying: If thy sons keep their way, [i.e. Order themselves in affections, purpose, words and works, according to my will: so below chap.8.25. 2 King.20.3. 2 Chron.6 16. This Moses calleth keeping of the soul, Deut.4.15.] to walk faithfully before my face, [i.e. to live uprightly, as in the presence of God, (who knoweth the heart) according to all the commandements: see 2 King.20.3. & 2 Chron.6.18.] with all their heart, and with all their soul: [i.e. to obey God uprightly, and without dissembling, not according to some, but according to all his Commandements, which obedience he looketh on, not in its own nature, (according to which it is here yet defective and wanting) but according to his grace in Christ, in whom it is perfect, Colos.2.10.] then shall not a man, said he, be cut off unto thee from the throne of Israel. [The meaning is, that none of his Posterity should fail to govern; to wit, until the Messiah shall come, whose Kingdom shall be everlasting.]"}],"5":[{"catchword":null,"tekst":"So thou knowest also what Joab the son of Zeruja did to me, [viz. Being ever most proud and spiteful against me, because he was very gracious with the souldiers: see 2 Sam.3.39. & chap.19. of the same book] (and) what he did to the two Commanders of Israel, Abner the son of Ner, and Amasa the son of Jether, whom he slew, [see 2 Sam.3.27. & 2 Sam.20.10.] and shed the blood of war in peace: [Heb. set bloods of war, etc. that is, committed murders. Now that is called the blood of war, which is shed in war; but Joab had shed in war; but Joab had shed blood in time of peace] and he put the blood of war upon his girdle, [viz. putting up his bloody sword into the scabbard, after that he had murdered those two men] that was on his Loines, and upon his shoes, [on which some of the blood of the parties that were stabbed sell] that wereon his feet."}],"6":[{"catchword":null,"tekst":"Do thou according to thy wisdom, [viz. According to which thou shalt surely find occasion to punish him, he being a man inclined to changed and commotions,] that thou let not his gray hair, [Heb. his hoariness, or, grayness, i.e. his gray rage] go down into grave in peace. [The meaning is, that Salomon should not let Joab die his natural death, but cause him to suffer a violent death, or inflicted a violent death upon him. See the Exposition below vers.8. & compare Gen 42:38. & 44.29. and 31.]"}],"7":[{"catchword":null,"tekst":"But thou shalt shew kindness unto the sons of Barzillai the Gileadite, [See 2 Sam.17.27. & 19.31.] and they shall be among those that eat at thy table: [Hebr. Among thy table-eaters: i.e. that eat of the meat of thy table] for they drew near to me, [viz. Bringing to me, and setting before me all manner of provision, which I indeed lacked in a day and desert place: see 2 Sam.17.27.28, 29.] when I fled before the face of thy brother Absalom."}],"8":[{"catchword":null,"tekst":"And behold, Simei, the son of Gera, the son of Jemini [Oth. a Benjamite: see Judg.19.on ver.16 & 2 Sam.16.on ver.11.] of Bahurim, is with thee, who cursed me with a grievious curse, [see 2 Sam.16.5. & 19.19.] in the day when I went to Mahanaim: [a city lying beyond Jordan in the Land of Gilead, in the tribe of Gad, by the brook Jabbok. Why it was so called, see Gen.32.on verse 2.] but he came down to meet me at the Jordan, and I sware unto him by the LORD, [see 2 Sam.19.23.] saying; If I slay him with the sword! [Heb. If I slay thee with the sword, (let God punish me) or, (do this, or that unto me:) for the Hebrews in swearing are wont to conceal the punishment: see Genes.14.on verse 23.]"}],"9":[{"catchword":null,"tekst":"But now, hold him not guiltless [i.e. Let him not go unpunished: so Exo 20:7. & 34 7. & Job 9:28.] for thou art a wise man; and thou shalt know what thou shalt do unto him, [viz. according to the wisdom which the Lord hath given thee, leaving to him the manner how thou shalt put him to death: compare above ver.6.]"}],"10":[{"catchword":null,"tekst":"And David fell a sleep [See above chap.1.on verse 21. & Deut.31.on verse 16.] with his fathers, and was buried [See Act.2.29. & 13.36.] in the city of David. [meaning the hold, where Davids house was: so below chap.3.1. see 2 Sam.5.7. 1 Chron.11.5. 2 Chron.5.2.]"}],"11":[{"catchword":null,"tekst":"Now the days [i.e. The time] that David reigned over Israel, are fourty years; seven years reigned he in Hebron, [the name of a city; of which see Genes.23.on verse 2.] and thirty and three years reigned he in Jerusalem. [see 1 Chron.29.23.]"}],"12":[{"catchword":null,"tekst":"And Salomon sat upon the throne of David his father, and his Kingdom was established greatly. [See 1 Chr.29.23. 2 Chron.1.1.]"}],"13":[{"catchword":null,"tekst":"Then come Adonia, the son of Haggith, unto Bathseba, the mother of Salomon, and she said: Is thy coming peace? [Heb. Is thy coming ( a verb of the infinitive mood) peace? She speaketh out of fear, that he would raise some trouble or commotion, because he had aspired after the Kingdom. &acirc;&euro;&tilde;Tis as much as if she had said; tendeth thy coming to the welfare of the Kingdom, and of the Common-wealth? What Peace signifoeth with the Hebrews, see Genes.37.on verse 14.] and he said Peace."}],"14":[{"catchword":null,"tekst":"After that he said, I have a word to thee; and she said, speak."}],"15":[{"catchword":null,"tekst":"Then he said, Thou knowest that the Kingdom was mine, [viz. Because I am the eldest of my fathers son; see above chap.1.on ver.5.] and all Israel had set his face on me, that I should be King: [i.e. all the men of Israel had kept their eyes on me, expecting that the Kingdom should be mine, and wishing the same with all their heart. Compare Jer 42:15. with the annotate.] howheit, the Kingdom is turned about, and is become my brothers, for it became his from the Lord. [He feigneth, as if he desired with all his heart that the Kingdom might be his brother Salomons, to this end taking Gods name in vain, and very cunningly hiding his sinister intent and design, which was by means of the Sun amine to make a party, and so to draw the Kingdom to himself: which King Salomon straightway perceived; as appeareth by v.22.]"}],"16":[{"catchword":null,"tekst":"And now Lask one Petition of thee, refuse not my face, [i.e. Reject not my Petition: so v.17. & 20.2 Chron.6.42. Psal.132.v.10. contrary to this phrase, to accept a mans face: see Gen.19.on v.21.] and she said to him."}],"17":[{"catchword":null,"tekst":"And he said, speak, I pray, unto Salomon the King, for he will not refuse thy face, that he give me Abisag the Sunamite to wife."}],"18":[{"catchword":null,"tekst":"And Bethseba said, It is good, I will speak for thee unto the King."}],"19":[{"catchword":null,"tekst":"So Bathseba came unto King Salomon, to speak unto him for Adonia; and the King rose up, to meet her, and bowed himself before her, after that he sat upon his throne,and caused a seat to be set for the Kings mother, [i.e. For his mother; it is an Hebrew phrase: so below chap.8.1. & 9.1. & 11.9. Compare Gen 5:5.] and she sat on his right hand. [Being thus honoured with equal dignity and worship, as herson, and that according to the custom and practise of the great ones, who are wont to place them on their right hand, to whom they will give equal honour with themselves, or the next honour to themselves: compare Mat 20:21.]"}],"20":[{"catchword":null,"tekst":"Then she said, I desire one small Petition of thee, [viz. Small in her opinion, but not in the Kings judgment; as appeareth by his answer] refuse not my face, and the King said unto her, Ask on, my mother, for I will not refuse thy face."}],"21":[{"catchword":null,"tekst":"And she said, let Abisag, the Sunamite, be given to Adonia, thy brother, to wife."}],"22":[{"catchword":null,"tekst":"Then King Salomon answered, and said unto his mother,; And why doest thou ask Abisag the Sunamate for Adonia? Ask for him the Kingdom also, [Salomon perceived whither Adonia&acirc;&euro;&trade;s Petition tended, viz. to a new tumult and commotion, by means of the desired match the better and easier to attain to the Crown. Hence those that aspired to be great, have frequently used this course: see 2 Sam.3.7. & 16.21.] (for he is my brother, who is elder [Heb. greater, or, bigger, viz.of age] then I am) yea for him, and for Abiathar the Priest, and for Joab the son of Zeruja [Who were addicted to Adonia, doubtless they might continue in their offices and places, and be free from danger.]"}],"23":[{"catchword":null,"tekst":"And King Salomon sware by the LORD, saying, Let God do so to me, and let him so add thereunto, assuredly Adonia shall have spoken that word against his (own) life. [Heb. against his (own) soul: that is, to the endangering of his life. The word soul is oftentimes taken for life. See Gen.19on v.17.]"}],"24":[{"catchword":null,"tekst":"And now (as true as) the LORD liveth, who hath established me, and hath caused me to sit on the throne [i.e. Caused me to reign as King. So 2 King.10.3. and 2 Chron.23.20. Compare above chap.1. the annotat. on verse 13.] of David my father, and who hath made me an house [i.e. a Family, and Court according to the seat and dignity of a King: for the word House signifieth often the whole train or retinue of Courtiers. See Gen.34.on ver.19.] according as he had promised: Assuredly Adonia shall be put to death this day. [as being guilty of High-Treason against the King.]"}],"25":[{"catchword":null,"tekst":"And King Salomon sent by the hand of Benaja, the son of Jojada, [i.e. Sent Benaja, commanding him with his own hand to slay Adonia. See Gen.12.on verse 15.] the same sell upon him, that he died. [viz. he fell upon him with a weapon, sit to kill. So also ver.31, 32, 34 46. the 32. Versespeaketh of two fallings on that were done with the sword.]"}],"26":[{"catchword":null,"tekst":"And the King said unto Abjathar the Priest: Go 10 Anothoth, [The name of a city belonging to the Priest, lying in the tribe Benjamin, where Abiathar the Priest, and Jeremiah the Prophet were born. See of this city, Jos.21.18: Jer 1:1.] unto thine (own) fields, for thou art a man of death; [i.e. guilty of death, or, that is worthy of death. So 2 Sam.12.5. Item, sons of death, [Which may be thus understood, that Salomon was for the present satisfied with inflicted a lesser punishment upon him then death, keeping him in the mean while still under the guilt of death, so that if in time to come he should commit the like offence again, he should be sure to die for it] because thou barest the Ark of the Lord the LORD, before the face of David my father, and because thou hast been afflicted an all wherein my father was afflicted [See 1 Sam.22.20, etc.]"}],"27":[{"catchword":null,"tekst":"Then Salomon thrust out Abjathar, that he should not be the LORDS Priest: [Heb. From being Priest unto the Lord, or, of the Lord: Not that Salomon properly deposed, or removed him from his Priestly Office; for he was already deposed in Davids life-time, for his offence committed against the Kings Majesty, when Zadok was anointed Priest in his room, 1 Chron.29.22. but he thrust him out, that is, banished him to his own house at Anothoth; from whence it must needs follow, that he could not administer the office of Priest at Jerusalem, being as it were dead in law] to fulfil the word of the LORD, which he had spoken [which indeed was thus performed by Salomon, but the secret over-ruling providence of God, which it may be Salomon thought not of at that time. See the fore-telling of this fulfilling, 1 Sam.2.33. and compare Mat 13:35. and 27.5. John.12.38. and 19 25. Which places shew that the Prophecies of God are very often fulfilled by men without their knowledge] concerning the house of Eli [viz. that the house of Eli, which descended from Itharmar, should be removed from the Priesthood, and that another house should come into its room: which was fulfilled in Zadok, who descended from the family of Eleazar. See 1 Sam.2.35. and compare Eze 44:15.] at Silo. [a city in the tribe of Ephraim, where the Ark of the Lord was a long time, Jos.18.1. Judg.21.19. Psa 78:60.]"}],"28":[{"catchword":null,"tekst":"When tidings came to Joab, (for Joab had turned after Adonia, though he had not turned after Absalom) then Joab fled to the tent of the LORD, and caught hold on the horns of the Altar. [see above chap.1. on verse 50.]"}],"29":[{"catchword":null,"tekst":"And it was told King Salomon, that Joab was fled to the tent of the LORD; [Which together with the Altar, being made in the Wilderness by Gods appointment. Exo 36:1,2,3, & 38.1, &c. were at this time in Gibeon, 2 Chron.1.3, 5.] and behold he is by the altar: Then Salomon sent Benaja, the son of Jojada, saying, Go thy ways, fall upon him."}],"30":[{"catchword":null,"tekst":"And Benaja came to the Tent of the LORD, and said unto him, Thus saith the King, Come forth; and he said, Nay, but I will die here: and Benaja brought the King answer again, saying; Thus spake Joab, and thus he answered me."}],"31":[{"catchword":null,"tekst":"And the King said unto him; Do according as he [viz. Joab] hath spoken, [Understanding this according to the Law, Exo 21:14.] and fall upon him, and bury him, that thou mayest take away from me, and from my fathers house, the blood which Joab hath shed without a cause."}],"32":[{"catchword":null,"tekst":"So the LORD shall cause his blood to return upon his own head, [viz. which he hath shed unjustly. God returneth the blood of another man upon a mans own head, when he recompenseth the death of another wilfully procured by him, with his own death; and that either immediately by himself, Gen 4:11. or mediately by the means of man, Gen.9 6. So below ver.44. Judg.9.24, 27. 2 Sam.15.8.] because he fell upon two men more righteous and better then he, and slew them with the sword, whereas my Father David knew it not, [i.e. My Father not being privie thereunto before it was done, // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
