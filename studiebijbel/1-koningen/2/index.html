p een kwade weg, zal zelf in zijn eigen kuil vallen; maar de vromen zullen het goede beërven.","2 Sam 3:29":"Het moet blijven op het hoofd van Joab, en op heel het huis van zijn vader; en het mag van het huis van Joab niet ontbreken dat er iemand is die een vloed heeft, of melaats is, of zich aan de kruk moet vasthouden, of door het zwaard valt, of gebrek aan brood heeft!","Deut 13:17":"Ook zal er niets van het verbannene aan uw hand kleven, opdat de HEERE Zich wendt van de hitte van Zijn toorn, en u barmhartigheid geeft, en Zich over u erbarmt, en u vermenigvuldigt, zoals Hij uw vaders gezworen heeft;","Mark 4:24":"En Hij zei tegen hen: Let op wat u hoort. Met de maat waarmee u meet, zal u gemeten worden, en aan u die hoort, zal meer gegeven worden.","1 Petr 1:13":"Omgord daarom de lenden van uw verstand, wees nuchter, en hoop volkomen op de genade die u gebracht wordt bij de openbaring van Jezus Christus.","Deut 5:10":"en doe barmhartigheid aan duizenden van hen die Mij liefhebben en Mijn geboden onderhouden.","Deut 27:9":"Vervolgens sprak Mozes, samen met de Levitische priesters, tot heel Israël: Luister toe en hoor, o Israël! Op deze dag bent u het volk van de HEERE, uw God, geworden.","Ps 39:2":"Ik zei: Ik zal op mijn wegen letten, dat ik niet zondig met mijn tong; ik zal mijn mond met een breidel in toom houden, terwijl de goddeloze nog tegenover mij is.","Ps 104:10-19":"Die de bronnen laat stromen door de dalen, zodat zij tussen de bergen door lopen. Zij drenken al het gedierte van het veld; de wilde ezels lessen er hun dorst mee. Daarbij woont het gevogelte van de hemel, een geluid latend horen van tussen de takken.","Deut 10:18":"Die het recht van de wees en van de weduwe doet; en de vreemdeling liefheeft, door hem brood en kleding te geven.","Ezech 9:6":"Dood oude mensen, jonge mannen en meisjes, en kinderen en vrouwen, tot het verderven toe; maar kom niemand nabij op wie het teken is, en begin bij Mijn heiligdom. En zij begonnen bij de oude mannen, die vó v\" data-code=\"H2708\">statutes,</span> and his <span class=\"wl wl-kjv\" data-code=\"H4687\">commandments,</span> and his <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments,</span> and his <span class=\"wl wl-kjv\" data-code=\"H5715\">testimonies,</span> as it is <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in the <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> of <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> that thou mayest <span class=\"wl wl-kjv\" data-code=\"H7919\">prosper</span> in all that thou <span class=\"wl wl-kjv\" data-code=\"H6213\">doest,</span> and whithersoever thou <span class=\"wl wl-kjv\" data-code=\"H6437\">turnest</span> thyself:","4":"That the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> may <span class=\"wl wl-kjv\" data-code=\"H6965\">continue</span> his <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> which he <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> concerning me, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> If thy <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> take <span class=\"wl wl-kjv\" data-code=\"H8104\">heed</span> to their <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">walk</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> me in <span class=\"wl wl-kjv\" data-code=\"H571\">truth</span> with all their <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> and with all their <span class=\"wl wl-kjv\" data-code=\"H5315\">soul,</span> there shall not <span class=\"wl wl-kjv\" data-code=\"H3772\">fail</span> thee <span class=\"wl wl-kjv\" data-code=\"H559\">(said</span> he) a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> on the <span class=\"wl wl-kjv\" data-code=\"H3678\">throne</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","5":"Moreover thou <span class=\"wl wl-kjv\" data-code=\"H3045\">knowest</span> also what <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H6870\">Zeruiah</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> to me, and what he <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> to the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H8269\">captains</span> of the <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> unto <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5369\">Ner,</span> and unto <span class=\"wl wl-kjv\" data-code=\"H6021\">Amasa</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3500\">Jether,</span> whom he <span class=\"wl wl-kjv\" data-code=\"H2026\">slew,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">shed</span> the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> of <span class=\"wl wl-kjv\" data-code=\"H4421\">war</span> in <span class=\"wl wl-kjv\" data-code=\"H7965\">peace,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> of <span class=\"wl wl-kjv\" data-code=\"H4421\">war</span> upon his <span class=\"wl wl-kjv\" data-code=\"H2290\">girdle</span> that was about his <span class=\"wl wl-kjv\" data-code=\"H4975\">loins,</span> and in his <span class=\"wl wl-kjv\" data-code=\"H5275\">shoes</span> that were on his <span class=\"wl wl-kjv\" data-code=\"H7272\">feet.</span>","6":"<span class=\"wl wl-kjv\" data-code=\"H6213\">Do</span> therefore according to thy <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom,</span> and let not his hoar <span class=\"wl wl-kjv\" data-code=\"H7872\">head</span> go <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to the <span class=\"wl wl-kjv\" data-code=\"H7585\">grave</span> in <span class=\"wl wl-kjv\" data-code=\"H7965\">peace.</span>","7":"But <span class=\"wl wl-kjv\" data-code=\"H6213\">shew</span> <span class=\"wl wl-kjv\" data-code=\"H2617\">kindness</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H1271\">Barzillai</span> the <span class=\"wl wl-kjv\" data-code=\"H1569\">Gileadite,</span> and let them be of those that <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> at thy <span class=\"wl wl-kjv\" data-code=\"H7979\">table:</span> for so they <span class=\"wl wl-kjv\" data-code=\"H7126\">came</span> to me when I <span class=\"wl wl-kjv\" data-code=\"H1272\">fled</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">because</span> of <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> thy <span class=\"wl wl-kjv\" data-code=\"H251\">brother.</span>","8":"And, behold, thou hast with thee <span class=\"wl wl-kjv\" data-code=\"H8096\">Shimei</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H1617\">Gera,</span> a <span class=\"wl wl-kjv\" data-code=\"H1145\">Benjamite</span> of <span class=\"wl wl-kjv\" data-code=\"H980\">Bahurim,</span> which <span class=\"wl wl-kjv\" data-code=\"H7043\">cursed</span> me with a <span class=\"wl wl-kjv\" data-code=\"H4834\">grievous</span> <span class=\"wl wl-kjv\" data-code=\"H7045\">curse</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> when I <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> to <span class=\"wl wl-kjv\" data-code=\"H4266\">Mahanaim:</span> but he came <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> me at <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan,</span> and I <span class=\"wl wl-kjv\" data-code=\"H7650\">sware</span> to him by the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> I will not put thee to <span class=\"wl wl-kjv\" data-code=\"H4191\">death</span> with the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword.</span>","9":"Now therefore hold him not <span class=\"wl wl-kjv\" data-code=\"H5352\">guiltless:</span> for thou art a <span class=\"wl wl-kjv\" data-code=\"H2450\">wise</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> and <span class=\"wl wl-kjv\" data-code=\"H3045\">knowest</span> what thou oughtest to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> unto him; but his hoar <span class=\"wl wl-kjv\" data-code=\"H7872\">head</span> bring thou <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to the <span class=\"wl wl-kjv\" data-code=\"H7585\">grave</span> with <span class=\"wl wl-kjv\" data-code=\"H1818\">blood.</span>","10":"So <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H7901\">slept</span> with his <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> and was <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> in the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David.</span>","11":"And the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> that <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> over <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> were <span class=\"wl wl-kjv\" data-code=\"H705\">forty</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years:</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> he in <span class=\"wl wl-kjv\" data-code=\"H2275\">Hebron,</span> and <span class=\"wl wl-kjv\" data-code=\"H7970\">thirty</span> and <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> he in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem.</span>","12":"Then <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> upon the <span class=\"wl wl-kjv\" data-code=\"H3678\">throne</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father;</span> and his <span class=\"wl wl-kjv\" data-code=\"H4438\">kingdom</span> was <span class=\"wl wl-kjv\" data-code=\"H3559\">established</span> <span class=\"wl wl-kjv\" data-code=\"H3966\">greatly.</span>","13":"And <span class=\"wl wl-kjv\" data-code=\"H138\">Adonijah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H2294\">Haggith</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H1339\">Bathsheba</span> the <span class=\"wl wl-kjv\" data-code=\"H517\">mother</span> of <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon.</span> And she <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H935\">Comest</span> thou <span class=\"wl wl-kjv\" data-code=\"H7965\">peaceably?</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H7965\">Peaceably.</span>","14":"He <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> moreover, I have somewhat to <span class=\"wl wl-kjv\" data-code=\"H1697\">say</span> unto thee. And she <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Say <span class=\"wl wl-kjv\" data-code=\"H1696\">on.</span>","15":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Thou <span class=\"wl wl-kjv\" data-code=\"H3045\">knowest</span> that the <span class=\"wl wl-kjv\" data-code=\"H4410\">kingdom</span> was mine, and that all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> their <span class=\"wl wl-kjv\" data-code=\"H6440\">faces</span> on me, that I should <span class=\"wl wl-kjv\" data-code=\"H4427\">reign:</span> howbeit the <span class=\"wl wl-kjv\" data-code=\"H4410\">kingdom</span> is turned <span class=\"wl wl-kjv\" data-code=\"H5437\">about,</span> and is become my <span class=\"wl wl-kjv\" data-code=\"H251\">brother's:</span> for it was his from the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","16":"And now I <span class=\"wl wl-kjv\" data-code=\"H7592\">ask</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H7596\">petition</span> of thee, <span class=\"wl wl-kjv\" data-code=\"H7725\">deny</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">me</span> not. And she <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Say <span class=\"wl wl-kjv\" data-code=\"H1696\">on.</span>","17":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">Speak,</span> I pray thee, unto <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> (for he will not <span class=\"wl wl-kjv\" data-code=\"H7725\">say</span> ➔ <span class=\"wl wl-kjv\" data-code=\"H6440\">thee</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">nay,)</span> that he <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> me <span class=\"wl wl-kjv\" data-code=\"H49\">Abishag</span> the <span class=\"wl wl-kjv\" data-code=\"H7767\">Shunammite</span> to <span class=\"wl wl-kjv\" data-code=\"H802\">wife.</span>","18":"And <span class=\"wl wl-kjv\" data-code=\"H1339\">Bathsheba</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">Well;</span> I will <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> for thee unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span>","19":"<span class=\"wl wl-kjv\" data-code=\"H1339\">Bathsheba</span> therefore <span class=\"wl wl-kjv\" data-code=\"H935\">went</span> unto <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon,</span> to <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> unto him for <span class=\"wl wl-kjv\" data-code=\"H138\">Adonijah.</span> And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> rose <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> her, and <span class=\"wl wl-kjv\" data-code=\"H7812\">bowed</span> himself unto her, and sat <span class=\"wl wl-kjv\" data-code=\"H3427\">down</span> on his <span class=\"wl wl-kjv\" data-code=\"H3678\">throne,</span> and caused a <span class=\"wl wl-kjv\" data-code=\"H3678\">seat</span> to be <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> for the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H517\">mother;</span> and she <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> on his right <span class=\"wl wl-kjv\" data-code=\"H3225\">hand.</span>","20":"Then she <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I <span class=\"wl wl-kjv\" data-code=\"H7592\">desire</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H6996\">small</span> <span class=\"wl wl-kjv\" data-code=\"H7596\">petition</span> of thee; I pray thee, <span class=\"wl wl-kjv\" data-code=\"H7725\">say</span> ➔ <span class=\"wl wl-kjv\" data-code=\"H6440\">me</span> not <span class=\"wl wl-kjv\" data-code=\"H7725\">nay.</span> And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, Ask <span class=\"wl wl-kjv\" data-code=\"H7592\">on,</span> my <span class=\"wl wl-kjv\" data-code=\"H517\">mother:</span> for I will not <span class=\"wl wl-kjv\" data-code=\"H7725\">say</span> ➔ <span class=\"wl wl-kjv\" data-code=\"H6440\">thee</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">nay.</span>","21":"And she <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Let <span class=\"wl wl-kjv\" data-code=\"H49\">Abishag</span> the <span class=\"wl wl-kjv\" data-code=\"H7767\">Shunammite</span> be <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> to <span class=\"wl wl-kjv\" data-code=\"H138\">Adonijah</span> thy <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> to <span class=\"wl wl-kjv\" data-code=\"H802\">wife.</span>","22":"And <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto his <span class=\"wl wl-kjv\" data-code=\"H517\">mother,</span> And why dost thou <span class=\"wl wl-kjv\" data-code=\"H7592\">ask</span> <span class=\"wl wl-kjv\" data-code=\"H49\">Abishag</span> the <span class=\"wl wl-kjv\" data-code=\"H7767\">Shunammite</span> for <span class=\"wl wl-kjv\" data-code=\"H138\">Adonijah?</span> <span class=\"wl wl-kjv\" data-code=\"H7592\">ask</span> for him the <span class=\"wl wl-kjv\" data-code=\"H4410\">kingdom</span> also; for he is mine <span class=\"wl wl-kjv\" data-code=\"H1419\">elder</span> <span class=\"wl wl-kjv\" data-code=\"H251\">brother;</span> even for him, and for <span class=\"wl wl-kjv\" data-code=\"H54\">Abiathar</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> and for <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H6870\">Zeruiah.</span>","23":"Then <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H7650\">sware</span> by the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> so to me, and more <span class=\"wl wl-kjv\" data-code=\"H3254\">also,</span> if <span class=\"wl wl-kjv\" data-code=\"H138\">Adonijah</span> have not <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> this <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> against his own <span class=\"wl wl-kjv\" data-code=\"H5315\">life.</span>","24":"Now therefore, as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> which hath <span class=\"wl wl-kjv\" data-code=\"H3559\">established</span> me, and <span class=\"wl wl-kjv\" data-code=\"H3427\">set</span> me on the <span class=\"wl wl-kjv\" data-code=\"H3678\">throne</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> my <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> and who hath <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> me an <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> as he <span class=\"wl wl-kjv\" data-code=\"H1696\">promised,</span> <span class=\"wl wl-kjv\" data-code=\"H138\">Adonijah</span> shall be put to <span class=\"wl wl-kjv\" data-code=\"H4191\">death</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day.</span>","25":"And <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> by the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H1141\">Benaiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3077\">Jehoiada;</span> and he <span class=\"wl wl-kjv\" data-code=\"H6293\">fell</span> upon him that he <span class=\"wl wl-kjv\" data-code=\"H4191\">died.</span>","26":"And unto <span class=\"wl wl-kjv\" data-code=\"H54\">Abiathar</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Get</span> thee to <span class=\"wl wl-kjv\" data-code=\"H6068\">Anathoth,</span> unto thine own <span class=\"wl wl-kjv\" data-code=\"H7704\">fields;</span> for thou art <span class=\"wl wl-kjv\" data-code=\"H376\">worthy</span> of <span class=\"wl wl-kjv\" data-code=\"H4194\">death:</span> but I will not at this <span class=\"wl wl-kjv\" data-code=\"H3117\">time</span> put thee to <span class=\"wl wl-kjv\" data-code=\"H4191\">death,</span> because thou <span class=\"wl wl-kjv\" data-code=\"H5375\">barest</span> the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> of the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> my <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> and because thou hast been <span class=\"wl wl-kjv\" data-code=\"H6031\">afflicted</span> in all wherein my <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> was <span class=\"wl wl-kjv\" data-code=\"H6031\">afflicted.</span>","27":"So <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> thrust <span class=\"wl wl-kjv\" data-code=\"H1644\">out</span> <span class=\"wl wl-kjv\" data-code=\"H54\">Abiathar</span> from being <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> that he might <span class=\"wl wl-kjv\" data-code=\"H4390\">fulfil</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> which he <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> concerning the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H5941\">Eli</span> in <span class=\"wl wl-kjv\" data-code=\"H7887\">Shiloh.</span>","28":"Then <span class=\"wl wl-kjv\" data-code=\"H8052\">tidings</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab:</span> for <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> had <span class=\"wl wl-kjv\" data-code=\"H5186\">turned</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> <span class=\"wl wl-kjv\" data-code=\"H138\">Adonijah,</span> though he <span class=\"wl wl-kjv\" data-code=\"H5186\">turned</span> not <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom.</span> And <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> <span class=\"wl wl-kjv\" data-code=\"H5127\">fled</span> unto the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and caught <span class=\"wl wl-kjv\" data-code=\"H2388\">hold</span> on the <span class=\"wl wl-kjv\" data-code=\"H7161\">horns</span> of the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar.</span>","29":"And it was <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> that <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> was <span class=\"wl wl-kjv\" data-code=\"H5127\">fled</span> unto the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> and, behold, he is <span class=\"wl wl-kjv\" data-code=\"H681\">by</span> the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar.</span> Then <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H1141\">Benaiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3077\">Jehoiada,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Go,</span> <span class=\"wl wl-kjv\" data-code=\"H6293\">fall</span> upon him.","30":"And <span class=\"wl wl-kjv\" data-code=\"H1141\">Benaiah</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> Come <span class=\"wl wl-kjv\" data-code=\"H3318\">forth.</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Nay; but I will <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> here. And <span class=\"wl wl-kjv\" data-code=\"H1141\">Benaiah</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">brought</span> ➔ the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">again,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H1696\">said</span> <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab,</span> and thus he <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> me.","31":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H6213\">Do</span> as he hath <span class=\"wl wl-kjv\" data-code=\"H1696\">said,</span> and <span class=\"wl wl-kjv\" data-code=\"H6293\">fall</span> upon him, and <span class=\"wl wl-kjv\" data-code=\"H6912\">bury</span> him; that thou mayest take <span class=\"wl wl-kjv\" data-code=\"H5493\">away</span> the <span class=\"wl wl-kjv\" data-code=\"H2600\">innocent</span> <span class=\"wl wl-kjv\" data-code=\"H1818\">blood,</span> which <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> <span class=\"wl wl-kjv\" data-code=\"H8210\">shed,</span> from me, and from the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of my <span class=\"wl wl-kjv\" data-code=\"H1\">father.</span>","32":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> his <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> upon his own <span class=\"wl wl-kjv\" data-code=\"H7218\">head,</span> who <span class=\"wl wl-kjv\" data-code=\"H6293\">fell</span> upon <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> more <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous</span> and <span class=\"wl wl-kjv\" data-code=\"H2896\">better</span> than he, and <span class=\"wl wl-kjv\" data-code=\"H2026\">slew</span> them with the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> my <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> not <span class=\"wl wl-kjv\" data-code=\"H3045\">knowing</span> thereof, to wit, <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5369\">Ner,</span> <span class=\"wl wl-kjv\" data-code=\"H8269\">captain</span> of the <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and <span class=\"wl wl-kjv\" data-code=\"H6021\">Amasa</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3500\">Jether,</span> <span class=\"wl wl-kjv\" data-code=\"H8269\">captain</span> of the <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah.</span>","33":"Their <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> shall therefore <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> upon the <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> of <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab,</span> and upon the <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> of his <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever:</span> but upon <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> and upon his <span class=\"wl wl-kjv\" data-code=\"H2233\">seed,</span> and upon his <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and upon his <span class=\"wl wl-kjv\" data-code=\"H3678\">throne,</span> shall there be <span class=\"wl wl-kjv\" data-code=\"H7965\">peace</span> <span class=\"wl wl-kjv\" data-code=\"H5704\">for</span> <span class=\"wl wl-kjv\" data-code=\"H5769\">ever</span> from the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","34":"So <span class=\"wl wl-kjv\" data-code=\"H1141\">Benaiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3077\">Jehoiada</span> went <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> and <span class=\"wl wl-kjv\" data-code=\"H6293\">fell</span> upon him, and <span class=\"wl wl-kjv\" data-code=\"H4191\">slew</span> him: and he was <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> in his own <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness.</span>","35":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> <span class=\"wl wl-kjv\" data-code=\"H1141\">Benaiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3077\">Jehoiada</span> in his room over the <span class=\"wl wl-kjv\" data-code=\"H6635\">host:</span> and <span class=\"wl wl-kjv\" data-code=\"H6659\">Zadok</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> did the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> in the room of <span class=\"wl wl-kjv\" data-code=\"H54\">Abiathar.</span>","36":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> and <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> for <span class=\"wl wl-kjv\" data-code=\"H8096\">Shimei,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H1129\">Build</span> thee an <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> there, and go not <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> thence any <span class=\"wl wl-kjv\" data-code=\"H575\">whither.</span>","37":"For it shall be, that on the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> thou goest <span class=\"wl wl-kjv\" data-code=\"H3318\">out,</span> and passest <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> the <span class=\"wl wl-kjv\" data-code=\"H5158\">brook</span> <span class=\"wl wl-kjv\" data-code=\"H6939\">Kidron,</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> for <span class=\"wl wl-kjv\" data-code=\"H3045\">certain</span> that thou shalt <span class=\"wl wl-kjv\" data-code=\"H4191\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">die:</span> thy <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> shall be upon thine own <span class=\"wl wl-kjv\" data-code=\"H7218\">head.</span>","38":"And <span class=\"wl wl-kjv\" data-code=\"H8096\">Shimei</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> The <span class=\"wl wl-kjv\" data-code=\"H1697\">saying</span> is <span class=\"wl wl-kjv\" data-code=\"H2896\">good:</span> as my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> hath <span class=\"wl wl-kjv\" data-code=\"H1696\">said,</span> so will thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">do.</span> And <span class=\"wl wl-kjv\" data-code=\"H8096\">Shimei</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days.</span>","39":"And it came to pass at the <span class=\"wl wl-kjv\" data-code=\"H7093\">end</span> of <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years,</span> that <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> of the <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> of <span class=\"wl wl-kjv\" data-code=\"H8096\">Shimei</span> ran <span class=\"wl wl-kjv\" data-code=\"H1272\">away</span> unto <span class=\"wl wl-kjv\" data-code=\"H397\">Achish</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H4601\">Maachah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H1661\">Gath.</span> And they <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> <span class=\"wl wl-kjv\" data-code=\"H8096\">Shimei,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Behold, thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> be in <span class=\"wl wl-kjv\" data-code=\"H1661\">Gath.</span>","40":"And <span class=\"wl wl-kjv\" data-code=\"H8096\">Shimei</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and <span class=\"wl wl-kjv\" data-code=\"H2280\">saddled</span> his <span class=\"wl wl-kjv\" data-code=\"H2543\">ass,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> to <span class=\"wl wl-kjv\" data-code=\"H1661\">Gath</span> to <span class=\"wl wl-kjv\" data-code=\"H397\">Achish</span> to <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants:</span> and <span class=\"wl wl-kjv\" data-code=\"H8096\">Shimei</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> from <span class=\"wl wl-kjv\" data-code=\"H1661\">Gath.</span>","41":"And it was <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> that <span class=\"wl wl-kjv\" data-code=\"H8096\">Shimei</span> had <span class=\"wl wl-kjv\" data-code=\"H1980\">gone</span> from <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> to <span class=\"wl wl-kjv\" data-code=\"H1661\">Gath,</span> and was come <span class=\"wl wl-kjv\" data-code=\"H7725\">again.</span>","42":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> and <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> for <span class=\"wl wl-kjv\" data-code=\"H8096\">Shimei,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Did I not make thee to <span class=\"wl wl-kjv\" data-code=\"H7650\">swear</span> by the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H5749\">protested</span> unto thee, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">Know</span> for a <span class=\"wl wl-kjv\" data-code=\"H3045\">certain,</span> on the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> thou goest <span class=\"wl wl-kjv\" data-code=\"H3318\">out,</span> and <span class=\"wl wl-kjv\" data-code=\"H1980\">walkest</span> abroad any <span class=\"wl wl-kjv\" data-code=\"H575\">whither,</span> that thou shalt <span class=\"wl wl-kjv\" data-code=\"H4191\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">die?</span> and thou <span class=\"wl wl-kjv\" data-code=\"H559\">saidst</span> unto me, The <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> that I have <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> is <span class=\"wl wl-kjv\" data-code=\"H2896\">good.</span>","43":"Why then hast thou not <span class=\"wl wl-kjv\" data-code=\"H8104\">kept</span> the <span class=\"wl wl-kjv\" data-code=\"H7621\">oath</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4687\">commandment</span> that I have <span class=\"wl wl-kjv\" data-code=\"H6680\">charged</span> thee with?","44":"The <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> moreover to <span class=\"wl wl-kjv\" data-code=\"H8096\">Shimei,</span> Thou <span class=\"wl wl-kjv\" data-code=\"H3045\">knowest</span> all the <span class=\"wl wl-kjv\" data-code=\"H7451\">wickedness</span> which thine <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> is privy <span class=\"wl wl-kjv\" data-code=\"H3045\">to,</span> that thou <span class=\"wl wl-kjv\" data-code=\"H6213\">didst</span> to <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> my <span class=\"wl wl-kjv\" data-code=\"H1\">father:</span> therefore the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> thy <span class=\"wl wl-kjv\" data-code=\"H7451\">wickedness</span> upon thine own <span class=\"wl wl-kjv\" data-code=\"H7218\">head;</span>","45":"And <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> shall be <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3678\">throne</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> shall be <span class=\"wl wl-kjv\" data-code=\"H3559\">established</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5704\">for</span> <span class=\"wl wl-kjv\" data-code=\"H5769\">ever.</span>","46":"So the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> <span class=\"wl wl-kjv\" data-code=\"H1141\">Benaiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3077\">Jehoiada;</span> which went <span class=\"wl wl-kjv\" data-code=\"H3318\">out,</span> and <span class=\"wl wl-kjv\" data-code=\"H6293\">fell</span> upon him, that he <span class=\"wl wl-kjv\" data-code=\"H4191\">died.</span> And the <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdom</span> was <span class=\"wl wl-kjv\" data-code=\"H3559\">established</span> in the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon.</span>"}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen bij dit vers.</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
