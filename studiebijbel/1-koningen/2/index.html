d doe aan duizenden van hen die Mij liefhebben en Mijn geboden onderhouden.","2 Sam 16:9-13":"Toen zei Abisai, de zoon van Zeruja, tegen de koning: Waarom zou deze dode hond mijn heer de koning vloeken? Laat mij toch oversteken en zijn kop wegnemen. Maar de koning zei: Wat heb ik met u te doen, zonen van Zeruja? Ja, laat hem vloeken; want de HEERE heeft immers tegen hem gezegd: Vloek David; wie zou dan zeggen: Waarom hebt u dat gedaan? Verder zei David tegen Abisai en tegen al zijn knechten: Zie, mijn zoon, die uit mijn lijf is voortgekomen, zoekt mijn leven; hoeveel te meer dan nu deze zoon van Jemini? Laat hem begaan, laat hij vloeken, want de HEERE heeft het hem gezegd.","Job 16:22":"Want er zullen nog maar weinige jaren in aantal aankomen, en ik zal het pad heengaan waardoor ik niet zal terugkeren.","Gen 9:6":"Wie het bloed van een mens vergiet, diens bloed zal door de mens vergoten worden; want God heeft de mens naar Zijn beeld gemaakt.","Job 29:20":"Mijn heerlijkheid was nieuw bij mij, en mijn boog vernieuwde zich in mijn hand.","Deut 8:4":"Uw kleding is aan u niet versleten, en uw voet is niet gezwollen, deze veertig jaar.","1 Kron 12:18":"En de Geest bekleedde Amasai, de leider van de aanvoerders, en hij zei: Wij zijn van u, o David, en met u zijn wij, zoon van Isaï. Vrede, vrede zij u, en vrede uw helpers; want uw God helpt u. Toen nam David hen aan, en stelde hen tot aanvoerders van de benden.","Ps 21:7":"Want U zet hem tot zegeningen in eeuwigheid; U vervrolijkt hem door vreugde met Uw aangezicht.","1 Sam 15:33":"Maar Samuël zei: Zoals uw zwaard vrouwen van hun kinderen beroofd heeft, zo zal uw moeder van haar kinderen beroofd worden onder de vrouwen. Toen hieuw Samuël Agag in stukken, voor het aangezicht van de HEERE te Gilgal.","1 Tim 4:12":"Laat niemand uw jeugdige leeftijd verachten, maar wees een voorbeeld voor de gelovigen in woord, in levenswandel, in liefde, in geest, in geloof, in reinheid.","1 Sam 23:6-9":"En het gebeurde, toen Abjathar, de zoon van Achimelech, naar David vluchtte naar Kehila, dat hij afkwam met de efod in zijn hand. Toen aan Saul te kennen gegeven werd dat David in Kehila gekomen was, zei Saul: God heeft hem in mijn hand overgegeven, want hij zit vast, nu hij in een stad met poorten en grendels is gekomen. Toen liet Saul heel het volk oproepen voor de strijd, om af te trekken naar Kehila, om David en zijn mannen te belegeren.","1 Kon 3:3-13":"En Salomo had de HEERE lief en wandelde in de inzettingen van zijn vader David; alleen offerde hij en brandde reukwerk op de hoogten. En de koning ging naar Gibeon om daar te offeren, omdat dat de grote hoogte was; duizend brandoffers offerde Salomo op dat altaar. Te Gibeon verscheen de HEERE aan Salomo in een droom 's nachts, en God zei: Vraag wat Ik u geven zal.","Neh 6:17-19":"Ook stuurden in die dagen edelen van Juda veel brieven naar Tobia, en de brieven van Tobia kwamen bij hen aan. Want velen in Juda hadden hem gezworen trouw te zijn, omdat hij een schoonzoon was van Sechanja, de zoon van Arah; en zijn zoon Johanan had de dochter van Mesullam, de zoon van Berechja, tot vrouw genomen. Ook vertelden zij mij over zijn goede daden, en mijn woorden brachten zij aan hem over. Tobia dan stuurde brieven om mij bang te maken.","1 Kon 8:25":"En nu, HEERE, God van Israël, houd Uw dienaar, mijn vader David, wat U tot hem gesproken hebt, en zei: Er zal u geen man van voor Mijn aangezicht afgesneden worden, die op de troon van Israël zit; alleen als uw zonen hun weg bewaren, om te wandelen voor Mijn aangezicht, zoals u gewandeld hebt voor Mijn aangezicht.","Luk 11:35":"Kijk dan uit, dat niet het licht dat in u is, duisternis is.","2 Sam 16:23":"In die dagen was de raad die Achitofel gaf, als had men naar het woord van God gevraagd; zo was alle raad van Achitofel, zowel bij David als bij Absalom.","Jak 4:3":"U bidt, en u ontvangt niet, omdat u verkeerd bidt, met de bedoeling het in uw lusten door te brengen.","1 Sam 14:50":"En de naam van Sauls vrouw was Ahinoam, een dochter van Ahimaäz; en de naam van zijn legeraanvoerder was Abner, een zoon van Ner, Sauls oom.","Luk 22:28":"En u bent degenen die met Mij steeds gebleven zijn in Mijn beproevingen.","Gal 3:4":"Hebt u zoveel tevergeefs geleden? Als het echt tevergeefs is!","Ex 21:14":"Maar als iemand tegen zijn naaste moedwillig handelt om hem met list te doden, zult u die man van bij Mijn altaar weghalen, zodat hij moet sterven.","1 Kron 22:6-13":"Toen riep hij zijn zoon Salomo, en gebood hem voor de HEERE, de God van Israël, een huis te bouwen. En David zei tegen Salomo: Mijn zoon, wat mij betreft, het lag in mijn hart om voor de Naam van de HEERE, mijn God, een huis te bouwen; maar het woord van de HEERE kwam tot mij en zei: U hebt bloed in overvloed vergoten, want u hebt grote oorlogen gevoerd; u zult voor Mijn Naam geen huis bouwen, omdat u veel van het bloed op de aarde voor Mijn aangezicht vergoten hebt.","Spr 14:15":"De onnozele gelooft elk woord; maar de kloekzinnige let goed op zijn gang.","Luk 11:9":"En Ik zeg u: Bid, en u zal gegeven worden; zoek, en u zult vinden; klop, en u zal opengedaan worden.","Ps 128:2-6":"Want u zult eten van het werk van uw handen; gelukkig zult u zijn, en het zal u goed gaan. Uw vrouw zal zijn als een vruchtbare wijnstok aan de zijkant van uw huis; uw kinderen als olijfplanten rondom uw tafel. Zie, zo zal die man zeker gezegend worden, die de HEERE vreest.","Jes 10:30":"Roep luid met uw stem, dochter van Gallim! Laat het horen tot Lais toe, o ellendige Anathoth!","Hos 2:21":"En de aarde zal het koren verhoren, alsook de nieuwe wijn en de olie; en die zullen Jizreël verhoren.","Pred 1:12":"Ik, de prediker, was koning over Israël te Jeruzalem.","Deut 30:15-20":"Zie, ik heb u heden voorgesteld het leven en het goede, en de dood en het kwade. Want ik gebied u heden, de HEERE, uw God, lief te hebben, in Zijn wegen te wandelen, en Zijn geboden, en Zijn inzettingen, en Zijn rechten te houden, opdat u leeft en meer wordt, en de HEERE, uw God, u zegent in het land waar u naartoe gaat, om dat te erven. Maar als uw hart zich zal afwenden, en u niet horen zult, en u gedreven wordt om u voor andere goden te buigen, en die te dienen;","Deut 17:18-20":"Verder moet het gebeuren, wanneer hij op de troon van zijn koninkrijk zit, dat hij voor zichzelf een afschrift van deze wet in een boek schrijft, overgenomen van wat voor de Levitische priesters ligt; En het moet bij hem blijven, en hij moet daarin lezen al de dagen van zijn leven; opdat hij de HEERE, zijn God, leert vrezen, om al de woorden van deze wet en deze inzettingen te bewaren en te doen; Zodat zijn hart zich niet verheft boven zijn broeders, en hij niet afwijkt van het gebod, naar rechts of naar links; opdat hij de dagen verlengt in zijn koninkrijk, hij en zijn zonen, te midden van Israël.","1 Kon 1:11":"Toen sprak Nathan tot Bathseba, de moeder van Salomo, en zei: Hebt u niet gehoord dat Adonia, de zoon van Haggith, koning is? En onze heer David weet dat niet.","Ruth 1:6":"Toen maakte zij zich klaar met haar schoondochters, en keerde terug uit de velden van Moab; want zij had in het land van Moab gehoord dat de HEERE naar Zijn volk had omgezien en hun brood gaf.","Joh 19:36":"Want deze dingen zijn gebeurd, opdat de Schrift vervuld wordt: Geen been van Hem zal verbroken worden.","2 Sam 16:22":"Zo spanden zij voor Absalom een tent op op het dak; en Absalom ging naar de bijvrouwen van zijn vader, voor de ogen van heel Israël.","Gen 9:1-3":"En God zegende Noach en zijn zonen, en Hij zei tegen hen: Wees vruchtbaar en word talrijk, en vervul de aarde! En vrees en angst voor u zal er zijn over al het gedierte van de aarde, en over al het gevogelte van de hemel; over alles wat zich op de aardbodem beweegt, en over alle vissen van de zee; zij zijn in uw hand overgegeven. Alles wat zich beweegt, dat leeft, zal u tot voedsel zijn; Ik heb het u allemaal gegeven, zoals het groene kruid.","Jes 57:21":"De goddelozen, zegt mijn God, hebben geen vrede.","Joh 2:4":"Jezus zei tegen haar: Vrouw, wat heb Ik met u te maken? Mijn uur is nog niet gekomen.","Spr 5:22":"De goddeloze zullen zijn eigen ongerechtigheden vangen, en met de banden van zijn zonden zal hij vastgehouden worden.","Deut 28:2-13":"En al deze zegeningen zullen over u komen, en u aantreffen, wanneer u naar de stem van de HEERE, uw God, luistert. Gezegend zult u zijn in de stad, en gezegend zult u zijn op het veld. Gezegend zal zijn de vrucht van uw schoot, en de vrucht van uw land, en de vrucht van uw vee, de aanwas van uw koeien, en de kudden van uw kleinvee.","Ps 146:7-9":"Die de verdrukte recht doet, Die de hongerige brood geeft; de HEERE maakt de gevangenen los. De HEERE opent de ogen van de blinden; de HEERE richt de gebogenen op; de HEERE heeft de rechtvaardigen lief. De HEERE bewaart de vreemdelingen; Hij houdt de wees en de weduwe staande; maar de weg van de goddelozen keert Hij om.","Hos 2:20":"En het zal op die dag gebeuren, dat Ik verhoren zal, spreekt de Heere; Ik zal de hemel verhoren, en die zal de aarde verhoren.","Ps 119:9":"Beth. Waarmee zal de jongeling zijn pad zuiver houden? Als hij dat houdt naar Uw woord.","2 Sam 20:8-13":"Toen zij nu bij de grote steen waren, die bij Gibeon is, kwam Amasa voor hun aangezicht. En Joab had zijn kleed omgord, dat hij aan had, en daarop was een gordel, waaraan het zwaard vastgemaakt was op zijn heupen in zijn schede; en toen hij vooruitging, viel het eruit. En Joab zei tegen Amasa: Is het goed met u, mijn broeder? En Joab pakte met de rechterhand de baard van Amasa, om hem te kussen. En Amasa lette niet op het zwaard dat in Joabs hand was; zo sloeg hij hem daarmee aan de vijfde rib, en hij stortte zijn ingewanden op de aarde uit, en hij sloeg hem niet ten tweeden male, en hij stierf. Toen jaagden Joab en zijn broeder Abisai Seba, de zoon van Bichri, achterna.","Jer 22:15":"Zou u regeren, omdat u zich omringt met ceder? Heeft uw vader niet gegeten en gedronken, en recht en gerechtigheid gedaan, en ging het hem toen niet goed?","Matt 25:13":"Waak dan; want u weet de dag niet, en ook het uur niet, waarop de Zoon des mensen komen zal.","Pred 12:13":"Van alles wat gehoord is, is dit de slotsom: Vrees God, en houd Zijn geboden, want dit is de hele plicht van de mens.","Jes 65:13":"Daarom zegt de Heere HEERE zo: Zie, Mijn knechten zullen eten, maar u zult hongeren; zie, Mijn knechten zullen drinken, maar u zult dorsten; zie, Mijn knechten zullen blij zijn, maar u zult beschaamd zijn.","Ex 23:13":"In alles wat Ik tegen u gezegd heb, zult u op uw hoede zijn; en de naam van andere goden zult u niet noemen; uit uw mond zal hij niet gehoord worden!","1 Tess 5:6":"Laten wij dan niet slapen, zoals de anderen, maar laten wij waken en nuchter zijn.","Gen 9:5":"En zeker, Ik zal uw bloed, het bloed van uw zielen, opeisen; van de hand van elk dier zal Ik het opeisen; ook van de hand van de mens, van de hand van ieders broeder zal Ik de ziel van de mens opeisen.","Ps 119:112":"Ik heb mijn hart geneigd, om Uw inzettingen eeuwig te doen, tot het einde toe.","Deut 5:1":"En Mozes riep het hele Israël bijeen en zei tegen hen: Hoor, Israël! De inzettingen en rechten die ik vandaag voor uw oren spreek: leer ze en neem ze in acht, om ze te doen.","Est 2:23":"Toen men de zaak onderzocht, werd het zo bevonden, en zij beiden werden aan een galg gehangen; en het werd in de kronieken geschreven voor het aangezicht van de koning.","Gen 42:38":"Maar hij zei: Mijn zoon zal niet met u meegaan; want zijn broer is dood, en hij is alleen overgebleven; als hem een ongeluk zou overkomen op de weg die u zult gaan, dan zou u mijn grijze haren met verdriet naar het graf doen afdalen.","1 Kon 20:4":"En de koning van Israël antwoordde en zei: Naar uw woord, mijn heer de koning, ik ben van u, en al wat ik heb.","Ezech 18:13":"Uitleent op woeker, en overwinst neemt; zou die leven? Hij zal niet leven, al die gruwelen heeft hij gedaan; hij zal zeker gedood worden; zijn bloed zal op hem zijn!","Neh 9:25":"En zij hebben vaste steden en een vet land ingenomen, en erfelijk bezeten, huizen, vol van allerlei goed, uitgehouwen waterputten, wijngaarden, olijfgaarden en fruitbomen, in overvloed; en zij hebben gegeten, en zijn verzadigd en vet geworden, en hebben in weelde geleefd, door Uw grote goedheid.","Luk 1:31-33":"En zie, u zult zwanger worden, en een Zoon baren, en u zult Hem de naam JEZUS geven. Hij zal groot zijn, en de Zoon van de Allerhoogste genoemd worden; en God, de Heere, zal Hem de troon van Zijn vader David geven. En Hij zal over het huis van Jakob Koning zijn tot in eeuwigheid, en aan Zijn koninkrijk zal geen einde zijn.","1 Kon 2:13-21":"Toen kwam Adonia, de zoon van Haggith, naar Bathseba, de moeder van Salomo; en zij zei: Komt u in vrede? En hij zei: In vrede. Daarna zei hij: Ik heb een woord voor u. En zij zei: Spreek. Hij zei dan: U weet dat het koninkrijk van mij was, en dat heel Israël zijn aangezicht op mij gericht had, dat ik koning zou worden; hoewel het koninkrijk is omgewend en van mijn broer geworden is; want het is van de HEERE aan hem gekomen.","Ps 78:52-55":"En Hij voerde Zijn volk als schapen, en leidde hen, als een kudde, door de woestijn. Ja, Hij leidde hen zeker, zodat zij niet vreesden; want de zee had hun vijanden overdekt. En Hij bracht hen tot het gebied van Zijn heiligheid, tot deze berg, die Zijn rechterhand verkregen heeft.","Jer 10:13":"Als Hij Zijn stem geeft, zo is er een gedruis van water in de hemel, en Hij doet de dampen opklimmen van het einde van de aarde; Hij maakt de bliksems met de regen, en doet de wind voortkomen uit Zijn schatkamers.","Zach 8:5":"En de straten van die stad zullen vol worden met jongens en meisjes, spelend op haar straten.","Deut 11:16":"Wacht uzelf, dat uw hart niet verleid wordt, dat u afwijkt, en andere goden dient, en u voor die buigt;","1 Tess 5:21":"Beproef alle dingen; behoud het goede.","Ef 6:6":"niet uit ogendienst, als mensenbehagers, maar als dienstknechten van Christus, terwijl u de wil van God doet van harte;","2 Sam 3:16":"En haar man ging met haar mee, huilend achter haar aan lopend, tot Bahurim toe. Toen zei Abner tegen hem: Ga weg, keer terug. En hij keerde terug.","2 Tim 4:6":"Want ik word al als een drankoffer geofferd, en de tijd van mijn heengaan is nabij.","1 Sam 15:28":"Toen zei Samuël tegen hem: De HEERE heeft heden het koninkrijk van Israël van u afgescheurd, en heeft het aan uw naaste gegeven, die beter is dan u.","2 Kron 27:6":"Zo werd Jotham machtig, want hij richtte zijn wegen voor het aangezicht van de HEERE, zijn God.","Ps 71:7":"Ik ben voor velen als een wonder geweest; doch Gij zijt mijn sterke Toevlucht.","Luk 12:6":"Worden niet vijf musjes verkocht voor twee penningen? En niet één van die is bij God vergeten.","1 Sam 25:1":"En Samuël stierf; en heel Israël verzamelde zich, en zij bedreven rouw over hem, en begroeven hem in zijn huis te Rama. En David maakte zich op, en trok af naar de woestijn Paran.","2 Sam 1:16":"En David zei tegen hem: Uw bloed komt op uw hoofd; want uw mond heeft tegen u getuigd, toen u zei: ik heb de gezalfde van de HEERE gedood.","Jes 61:9":"En hun nageslacht zal onder de heidenvolken bekend worden, en hun nakomelingen te midden van de volken; allen die hen zien zullen, zullen hen erkennen, dat zij een nageslacht zijn, dat de HEERE gezegend heeft.","2 Petr 3:17":"U dan, geliefden, omdat u dit van tevoren weet, wees op uw hoede, dat u niet mede weggesleept wordt door de dwaling van de verdorven mensen, en afvalt van uw eigen standvastigheid;","Ps 119:138":"U hebt de gerechtigheid van Uw getuigenissen, en de waarheid ten zeerste geboden.","2 Sam 12:8":"en Ik heb u het huis van uw heer gegeven, en de vrouwen van uw heer in uw schoot; ja, Ik heb u het huis van Israël en Juda gegeven; en als dat weinig was, zou Ik u dit en dat er nog bij gegeven hebben.","Mark 10:38":"Maar Jezus zei tegen hen: U weet niet wat u vraagt. Kunt u de drinkbeker drinken die Ik drink, en gedoopt worden met de doop waarmee Ik gedoopt word?","Ps 141:3":"HEERE, zet een wacht voor mijn mond, bewaak de deur van mijn lippen.","Judas 1:1":"Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:","1 Kron 23:1":"Toen David nu oud was en verzadigd van dagen, maakte hij zijn zoon Salomo koning over Israël.","Hebr 12:15":"Let er goed op dat niemand verachtert van de genade van God; dat niet enige wortel van bitterheid, die opwaarts uitspruit, opschudding maakt en daardoor velen ontreinigd worden.","1 Kron 8:3":"Bela nu had deze kinderen: Addar, en Gera, en Abihud,","Ps 119:111":"Ik heb Uw getuigenissen genomen tot een eeuwige erve, want zij zijn de vrolijkheid van mijn hart.","Gen 44:31":"Dan zal het gebeuren, als hij ziet dat de jongen er niet is, dat hij sterft; en uw knechten zullen de grijze haren van uw knecht, onze vader, met verdriet naar het graf doen afdalen.","Ps 147:13":"Want Hij maakt de grendels van uw poorten sterk; Hij zegent uw kinderen binnen in u.","2 Sam 4:12":"En David gaf zijn knechten bevel, en zij doodden hen, en hakten hun handen en hun voeten af, en hingen ze op bij de vijver te Hebron; maar het hoofd van Isboseth namen zij en begroeven het in Abners graf te Hebron.","Deut 26:19":"opdat Hij u zo boven alle volken die Hij gemaakt heeft, hoog zet, tot lof, en tot een naam, en tot heerlijkheid; en opdat u een heilig volk bent voor de HEERE, uw God, zoals Hij gesproken heeft.","Ps 128:6":"En u zult uw kleinkinderen zien. Vrede over Israël!","1 Kron 17:10":"En vanaf die dagen dat Ik geboden heb dat er richters zouden zijn over Mijn volk Israël; en Ik heb al uw vijanden vernederd; ook heb Ik u bekendgemaakt dat de HEERE u een huis bouwen zal.","Openb 3:21":"Wie overwint, hem zal Ik geven met Mij te zitten op Mijn troon, zoals Ik ook overwonnen heb, en Mij gezet heb met Mijn Vader op Zijn troon.","Deut 4:4":"U daarentegen, die de HEERE, uw God, aanhing, u bent vandaag allemaal nog in leven.","Ps 36:7":"Uw gerechtigheid is als de bergen van God, Uw oordelen zijn een grote afgrond; HEERE! U behoudt mensen en beesten.","Spr 27:10":"Verlaat uw vriend, en ook de vriend van uw vader niet; en ga op de dag van uw tegenspoed niet naar het huis van uw broer. Beter is een buur die dichtbij is, dan een broer die ver weg is.","Deut 6:2-25":"Opdat u de HEERE, uw God, vreest, om al Zijn inzettingen en Zijn geboden te houden, die ik u gebied; u, en uw kind, en kindskind, al de dagen van uw leven; en opdat uw dagen verlengd worden. Hoor dan, Israël! en let erop dat u ze doet, opdat het u goed gaat, en opdat u zeer vermenigvuldigt (zoals de HEERE, de God van uw vaderen, u gesproken heeft) in het land, dat overvloeit van melk en honing. Hoor, Israël! De HEERE, onze God, is een enig HEERE!","Dan 5:1-4":"De koning Belsazar maakte een grote maaltijd voor zijn duizend leiders, en hij dronk wijn ten overstaan van die duizend. Toen Belsazar de wijn geproefd had, zei hij dat men de gouden en zilveren vaten voor moest brengen, die zijn vader Nebukadnezar uit de tempel die te Jeruzalem geweest was, weggevoerd had; opdat de koning en zijn leiders, zijn vrouwen en zijn bijvrouwen daaruit zouden drinken. Toen bracht men de gouden vaten, die men uit de tempel van het huis van God, die te Jeruzalem geweest was, weggevoerd had; en de koning en zijn leiders, zijn vrouwen en zijn bijvrouwen dronken daaruit.","Ef 6:18":"Met alle bidden en smeken, terwijl u altijd bidt in de Geest, en daartoe waakt met alle volharding en smeking voor al de heiligen;","Hebr 6:12":"opdat u niet traag wordt, maar navolgers bent van hen die door geloof en geduld de beloften beërven.","Ps 127:1-5":"Een lied Hammaaloth¹, van Salomo. Als de HEERE het huis niet bouwt, werken de bouwers eraan tevergeefs; als de HEERE de stad niet bewaart, waakt de wachter tevergeefs. Het is tevergeefs dat u vroeg opstaat, laat opblijft, brood eet met zorgen erbij; het is zo, dat Hij het aan hen die Hij liefheeft, geeft als in de slaap. Zie, de kinderen zijn een erfdeel van de HEERE; de vrucht van de buik is een beloning.","Job 22:28":"Als u een zaak besluit, zal zij voor u bestendig zijn; en op uw wegen zal het licht schijnen.","2 Sam 7:11-13":"En vanaf de dag dat Ik geboden heb richters te wezen over Mijn volk Israël. Toch heb Ik u rust gegeven van al uw vijanden. Ook maakt de HEERE u bekend, dat de HEERE u een huis maken zal. Wanneer uw dagen vervuld zullen zijn, en u met uw vaderen zult ontslapen zijn, dan zal Ik uw nakomeling na u doen opstaan, die uit uw lijf voortkomen zal, en Ik zal zijn koninkrijk bevestigen. Die zal voor Mijn Naam een huis bouwen; en Ik zal de troon van zijn koninkrijk bevestigen tot in eeuwigheid.","Micha 4:4":"Maar zij zullen zitten, ieder onder zijn wijnstok en onder zijn vijgenboom, en er zal niemand zijn die hen verschrikt; want de mond van de HEERE van de heerscharen heeft het gesproken.","Ps 119:2":"Gelukkig zijn zij, die Zijn getuigenissen onderhouden, die Hem van ganser harte zoeken;","Ex 23:22":"Maar als u Zijn stem echt gehoorzaamt, en doet al wat Ik zeggen zal, dan zal Ik de vijand van uw vijanden zijn, en de tegenstander van wie u tegenstaat.","Ps 23:1-6":"Een psalm van David. De HEERE is mijn Herder, mij zal niets ontbreken. Hij laat mij neerliggen in grazige weiden; Hij voert mij zachtjes naar zeer stille wateren. Hij verkwikt mijn ziel; Hij leidt mij in het spoor van de gerechtigheid, omwille van Zijn Naam.","Deut 17:20":"Zodat zijn hart zich niet verheft boven zijn broeders, en hij niet afwijkt van het gebod, naar rechts of naar links; opdat hij de dagen verlengt in zijn koninkrijk, hij en zijn zonen, te midden van Israël.","Ex 15:26":"en zei: Als u met ernst naar de stem van de HEERE, uw God, luistert, en doet wat recht is in Zijn ogen, en uw oren neigt naar Zijn geboden, en al Zijn inzettingen houdt, zal Ik geen van de ziekten op u leggen die Ik op Egypte gelegd heb; want Ik ben de HEERE, uw Heelmeester!","Ps 65:10-14":"U bezoekt het land, en hebt het begerig gemaakt, U verrijkt het overvloedig; de rivier van God is vol water; wanneer U het zo bereid hebt, maakt U hun koren gereed. U maakt zijn opgeploegde aarde dronken; U doet ze dalen in zijn voren; U maakt het zacht door de druppels; U zegent zijn uitspruitsel. U kroont het jaar van Uw goedheid; en Uw voetstappen druipen van vettigheid.","Job 38:25-27":"Wie deelt voor de stortregen een waterloop uit, en een weg voor het weerlicht van de donderen? Om te regenen op het land, waar niemand is, op de woestijn, waarin geen mens is; Om het woeste en het verwoeste te verzadigen, en om het uitspruitsel van de grasscheutjes te doen meer worden.","Jer 11:1-5":"Het woord dat tot Jeremia gebeurd is, van de HEERE, en Hij zei: Hoor u de woorden van dit verbond, en spreek tot de mannen van Juda, en tot de inwoners van Jeruzalem; Zeg dan tegen hen: Zo zegt de HEERE, de God van Israël: Vervloekt is de man die niet hoort naar de woorden van dit verbond.","Deut 4:23":"Wacht u ervoor dat u het verbond van de HEERE, uw God, dat Hij met u gesloten heeft, vergeet, zodat u een gesneden beeld zou maken, de gelijkenis van iets dat de HEERE, uw God, u verboden heeft.","Jer 13:1":"Zo heeft de HEERE tegen mij gezegd: Ga heen, en koop u een linnen gordel, en doe die om uw middel, maar breng hem niet in het water.","Matt 3:1":"En in die dagen kwam Johannes de Doper, en preekte in de woestijn van Judea,","1 Kon 2:18-34":"En Bathseba zei: Het is goed, ik zal namens u met de koning spreken. Zo kwam Bathseba naar de koning Salomo, om hem namens Adonia aan te spreken. En de koning stond op, haar tegemoet, en boog voor haar; daarna ging hij op zijn troon zitten, en liet een stoel neerzetten voor de moeder van de koning; en zij zat aan zijn rechterhand. Toen zei zij: Ik vraag u één klein ding, wijs mijn aangezicht niet af. En de koning zei tegen haar: Vraag maar, mijn moeder, want ik zal uw aangezicht niet afwijzen.","Spr 11:10":"Een stad springt op van vreugde over het welvaren van de rechtvaardigen; en als de goddelozen vergaan, is er gejuich.","Hebr 6:11":"Maar wij verlangen ernaar dat ieder van u dezelfde ijver bewijst, tot de volle zekerheid van de hoop, tot het einde toe;","Ps 132:10":"Wend het gezicht van Uw gezalfde niet af, om Davids wil, Uw dienaar.","Jes 46:4":"En tot de ouderdom toe zal Ik Dezelfde zijn, ja, tot de grijsheid toe zal Ik u dragen; Ik heb het gedaan, en Ik zal u opnemen, en Ik zal dragen en redden.","Jer 14:22":"Zijn er onder de nietige afgoden van de heidenvolken die het kunnen laten regenen, of kan de hemel regenbuien geven? Bent U dat niet, o HEERE, onze God? Daarom zullen wij op U wachten, want U doet al die dingen.","Mark 13:32-37":"Maar van die dag en dat uur weet niemand, ook de engelen in de hemel niet, en ook de Zoon niet, maar alleen de Vader. Let op, waak en bid; want u weet niet wanneer de tijd is. Zoals een man die naar het buitenland reisde, zijn huis verliet, en zijn dienaren macht gaf, en ieder zijn werk, en de deurwachter gebood dat hij zou waken;","Ps 15:4":"In wiens ogen de verworpene veracht is, maar hij eert hen die de HEERE vrezen; heeft hij gezworen tot zijn eigen schade, toch verandert hij niet;","1 Kron 2:17":"En Abigaïl baarde Amasa; en de vader van Amasa was Jether, een Ismaëliet.","1 Sam 22:20-23":"Doch een van de zonen van Achimelech, de zoon van Ahitub, ontkwam; zijn naam was Abjathar; die vluchtte David achterna. En Abjathar vertelde David dat Saul de priesters van de HEERE gedood had. Toen zei David tegen Abjathar: Ik wist het al op die dag, toen Doeg, de Edomiet, daar was, dat hij het zeker aan Saul zou vertellen; ik heb er de oorzaak van gegeven tegen alle mensen van het huis van uw vader.","Ef 6:10":"Vervolgens, mijn broeders, word krachtig in de Heere, en in de sterkte van Zijn macht.","Jes 65:20":"Vandaar zal niet meer een zuigeling zijn die maar weinig dagen leeft, noch een oud man, die zijn dagen niet zal vervullen; want een jongeling zal sterven, honderd jaar oud zijnde, maar een zondaar, honderd jaar oud zijnde, zal vervloekt worden.","2 Tim 4:1":"Ik roep u dus dringend op, voor het aangezicht van God en de Heere Jezus Christus, Die de levenden en doden zal oordelen bij Zijn verschijning en in Zijn Koninkrijk:","Jer 30:19":"En van hen zal dankzegging uitgaan, en een stem van spelende mensen; en Ik zal hen vermeerderen, en zij zullen niet minder worden, en Ik zal hen verheerlijken, en zij zullen niet gering worden.","1 Kron 8:5":"En Gera, en Sefufan, en Huram.","Spr 30:7":"Twee dingen heb ik van U gevraagd, onthoud ze mij niet, voordat ik sterf;","Hab 2:1":"Ik stond op mijn wachtpost, en ik ging op de vestingmuur staan, en ik hield wacht om te zien wat Hij tot mij spreken zou, en wat ik antwoorden zou op mijn bestraffing.","Luk 10:5":"En in welk huis u ook binnengaat, zeg eerst: Vrede zij dit huis!","1 Kon 1:50-53":"Maar Adonia was bevreesd voor Salomo, en hij stond op, en ging heen, en greep de hoornen van het altaar vast. En men maakte aan Salomo bekend en zei: Zie, Adonia is bevreesd voor de koning Salomo, want zie, hij heeft de hoornen van het altaar gegrepen, en gezegd: Laat de koning Salomo mij vandaag zweren dat hij zijn knecht niet met het zwaard zal doden! En Salomo zei: Als hij een oprecht man zal zijn, zal er geen haar van hem op de aarde vallen; maar als er kwaad in hem gevonden wordt, zal hij sterven.","Pred 8:2":"Ik zeg: let op de mond van de koning; maar houd rekening met de eed van God.","Ezech 17:18":"Want hij heeft de eed veracht, door het verbond te breken, terwijl hij, zie, zijn hand gegeven had; omdat hij al deze dingen gedaan heeft, zal hij niet ontkomen.","2 Sam 20:9":"En Joab zei tegen Amasa: Is het goed met u, mijn broeder? En Joab pakte met de rechterhand de baard van Amasa, om hem te kussen.","2 Kron 8:10":"Van dezen dan waren de leiders van de aangestelden die koning Salomo had, tweehonderdvijftig, die over het volk heerschappij hadden.","2 Sam 9:7":"En David zei tegen hem: Wees niet bang, want ik zal zeker goedheid aan u bewijzen, omwille van uw vader Jonathan; en ik zal u alle akkers van uw vader Saul teruggeven; en u zult voortdurend brood eten aan mijn tafel.","Deut 6:1":"Dit zijn dan de geboden, de inzettingen en de rechten, die de HEERE, uw God, geboden heeft om u te leren; opdat u ze doet in het land, waar u naartoe gaat, om het te bezitten;","Deut 29:9":"Houdt dan de woorden van dit verbond, en doet ze; opdat u verstandig handelt in alles, wat u doen zult.","2 Sam 21:2":"Toen riep de koning de Gibeonieten, en zei tegen hen: (De Gibeonieten nu waren niet van de kinderen van Israël, maar van het overblijfsel van de Amorieten; en de kinderen van Israël hadden hun gezworen, maar Saul zocht hen te doden in zijn ijver voor de kinderen van Israël en Juda.)","Spr 15:6":"In het huis van de rechtvaardige is een grote schat; maar in de inkomst van de goddeloze is opschudding.","Est 1:19":"Als het de koning goeddunkt, laat er dan een koninklijk bevel van hem uitgaan, dat wordt opgeschreven in de wetten van de Perzen en de Meden, en dat niet overtreden mag worden: dat Vasthi niet meer voor het aangezicht van de koning Ahasveros mag komen, en dat de koning haar koningschap geeft aan haar naaste, die beter is dan zij.","Richt 8:21":"Toen zeiden Zebah en Tsalmuna: Sta zelf op en val ons aan, want zoals de man is, zo is zijn kracht. Toen stond Gideon op en doodde Zebah en Tsalmuna, en nam de maantjes die aan de halzen van hun kamelen zaten.","2 Sam 5:7":"Maar David nam de burcht Sion in; dat is de stad van David.","2 Kon 23:6":"Hij bracht ook het beeld van het bos weg uit het huis van de HEERE, buiten Jeruzalem, naar de beek Kidron, en verbrandde het bij de beek Kidron, en vergruisde het tot stof; en hij wierp het stof daarvan op de graven van de kinderen van het volk.","1 Kron 22:12":"Laat de HEERE u alleen wijsheid en verstand geven, en u bevel geven over Israël, en dat om de wet van de HEERE, van uw God, te onderhouden.","1 Kron 22:6-19":"Toen riep hij zijn zoon Salomo, en gebood hem voor de HEERE, de God van Israël, een huis te bouwen. En David zei tegen Salomo: Mijn zoon, wat mij betreft, het lag in mijn hart om voor de Naam van de HEERE, mijn God, een huis te bouwen; maar het woord van de HEERE kwam tot mij en zei: U hebt bloed in overvloed vergoten, want u hebt grote oorlogen gevoerd; u zult voor Mijn Naam geen huis bouwen, omdat u veel van het bloed op de aarde voor Mijn aangezicht vergoten hebt.","1 Kron 29:28":"En hij stierf op hoge leeftijd, verzadigd van dagen, rijkdom en eer; en zijn zoon Salomo regeerde in zijn plaats.","1 Kon 1:52":"En Salomo zei: Als hij een oprecht man zal zijn, zal er geen haar van hem op de aarde vallen; maar als er kwaad in hem gevonden wordt, zal hij sterven.","Jes 33:16":"Die zal in de hoogten wonen, de sterkten van de steenrotsen zullen zijn hoge schuilplaats zijn; zijn brood wordt hem gegeven, zijn water is gewis.","Lev 26:6":"Ook zal Ik vrede geven in het land, zodat u zult gaan slapen, en niemand is er die u verschrikt; en Ik zal het boze gedierte uit het land doen ophouden, en het zwaard zal door uw land niet doorgaan.","2 Kron 31:21":"En in al het werk dat hij begon in de dienst van het huis van God, en in de wet en in het gebod, om zijn God te zoeken, deed hij dat met zijn hele hart, en had voorspoed.","Ezech 36:9-11":"Want ziet, Ik ben bij u, en Ik zal u aanzien, en u zult gebouwd en bezaaid worden. En Ik zal mensen op u vermenigvuldigen, het hele huis van Israël, ja, dat geheel; en de steden zullen bewoond, en de eenzame plaatsen bebouwd worden. Ja, Ik zal mensen en beesten op u vermenigvuldigen, en zij zullen vermenigvuldigd worden en vruchtbaar zijn; en Ik zal u doen bewonen, als in uw vorige tijden, ja, Ik zal het beter maken dan in uw beginselen; en u zult weten dat Ik de HEERE ben.","Spr 11:11":"Door de zegen van de oprechten wordt een stad verheven; maar door de mond van de goddelozen wordt zij verbroken.","Matt 5:45":"opdat u kinderen mag zijn van uw Vader, Die in de hemelen is; want Hij laat Zijn zon opgaan over bozen en goeden, en laat het regenen over rechtvaardigen en onrechtvaardigen.","2 Sam 7:27":"Want U, HEERE van de heerscharen, God van Israël! U hebt het voor het oor van Uw knecht geopenbaard, en gezegd: Ik zal u een huis bouwen; daarom heeft Uw knecht in zijn hart gevonden, dit gebed tot U te bidden.","Ef 5:15":"Kijk dan goed hoe u voorzichtig wandelt, niet als onwijzen, maar als wijzen,","Job 24:19":"De droogte alsook de hitte nemen de sneeuwwateren weg; zo neemt het graf hen weg die gezondigd hebben.","2 Sam 15:36":"Zie, hun beide zonen zijn daar bij hen, Ahimaäz, de zoon van Zadok, en Jonathan, de zoon van Abjathar; zo zult u door hun hand alles wat u zult horen, naar mij laten overbrengen.","Ps 103:3-5":"Die al uw ongerechtigheid vergeeft, die al uw ziekten geneest; Die uw leven verlost van het verderf, die u kroont met goedertierenheid en barmhartigheden; Die uw mond verzadigt met het goede, uw jeugd vernieuwt als die van een arend.","Deut 32:11-14":"Zoals een arend zijn nest opwekt, over zijn jongen zweeft, zijn vleugels uitbreidt, ze neemt en ze draagt op zijn vleugels; Zo leidde de HEERE hem alleen, en er was geen vreemde god met hem. Hij deed hem rijden op de hoogten van de aarde, zodat hij at van de opbrengsten van het veld; en Hij deed hem honing zuigen uit de steenrots, en olie uit de harde rots;","Ps 107:1-43":"Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig. Laat dat de bevrijden van de HEERE zeggen, die Hij uit de hand van de tegenstander bevrijd heeft. En hen die Hij uit de landen verzameld heeft, van het oosten en van het westen, van het noorden en van de zee.","Ps 113:6-9":"Die zeer laag ziet, in de hemel en op de aarde. Die de arme uit het stof opricht, en de behoeftige uit de vuilnis verhoogt; Om hem te doen zitten bij de vorsten, bij de vorsten van Zijn volk.","Gen 49:20":"Van Aser, zijn brood zal vet zijn; en hij zal koninklijke lekkernijen leveren.","Jes 9:6":"De grootheid van deze heerschappij en van de vrede zal geen einde hebben op de troon van David en in zijn koninkrijk, om dat te bevestigen en te sterken met recht en met gerechtigheid, van nu af tot in eeuwigheid toe. De ijver van de HEERE van de heerscharen zal dit doen.","Ps 1:2":"Maar zijn vreugde is in de wet van de HEERE, en hij overdenkt Zijn wet dag en nacht.","1 Sam 18:14":"En David gedroeg zich voorzichtig op al zijn wegen; en de HEERE was met hem.","Spr 4:26":"Weeg de gang van uw voet, en laat al uw wegen vast staan.","Hos 13:14":"Toch zal Ik hen verlossen van de macht van het graf, Ik zal hen vrijmaken van de dood: o dood, waar zijn uw pestilentiën? Graf, waar is uw verderf? Berouw zal voor Mijn ogen verborgen zijn,","Joh 12:38":"Opdat het woord van Jesaja, de profeet, vervuld werd, dat hij gesproken heeft: Heere, wie heeft onze prediking geloofd, en aan wie is de arm van de Heere geopenbaard?","Ex 1:21":"En het gebeurde, omdat de vroedvrouwen God vreesden, dat Hij hun huizen gaf.","Ps 145:15":"Ain. Aller ogen wachten op U; en U geeft hun hun voedsel op de juiste tijd.","1 Kon 1:46":"En ook zit Salomo op de troon van het koninkrijk.","Judas 1:21":"Bewaar uzelf in de liefde van God, terwijl u de barmhartigheid van onze Heere Jezus Christus verwacht, tot het eeuwige leven.","Hos 2:7":"Zij erkent echter niet dat Ik haar het koren, de nieuwe wijn, en de olie gegeven heb, en haar het zilver en goud vermeerderd heb, dat zij voor de Baäl gebruikt hebben.","Job 21:13":"In het goede verslijten zij hun dagen; en in een ogenblik dalen zij af in het graf.","Jer 7:23":"Maar deze zaak heb Ik hun geboden, en Ik zei: Hoor naar Mijn stem, dan zal Ik u tot een God zijn, en u zult Mij tot een volk zijn; en wandel in heel de weg die Ik u gebieden zal, opdat het u goed gaat.","2 Kron 24:16":"En zij begroeven hem in de stad van David, bij de koningen; want hij had goed gedaan in Israël, zowel aan God als aan Zijn huis.","Ps 67:7":"De aarde geeft haar opbrengst; God, onze God, zal ons zegenen.","Matt 24:13":"Maar wie zal volharden tot het einde, die zal behouden worden.","1 Sam 2:11":"Daarna ging Elkana naar Rama, naar zijn huis; maar de jongen diende de HEERE voor het aangezicht van de priester Eli.","Jer 4:2":"Maar zweer: Zo waarachtig als de HEERE leeft! in waarheid, in recht en in gerechtigheid; dan zullen de heidenvolken zich in Hem zegenen, en zich in Hem beroemen.","1 Sam 28:2":"Toen zei David tegen Achis: Zo zult u weten wat uw dienaar doen zal. En Achis zei tegen David: Daarom zal ik u voor altijd tot bewaarder van mijn hoofd aanstellen.","Fil 3:2":"Let op de honden, let op de kwade arbeiders, let op de versnijding.","Ps 102:8":"Ik waak, en ben geworden als een eenzame mus op het dak.","1 Kron 17:17":"En dit is nog klein geweest in Uw ogen, o God! Daarom hebt U over het huis van Uw knecht ook gesproken voor een verre toekomst, en U hebt mij naar menselijke maatstaf voorzien met deze verhoging, o HEERE God!","Deut 7:12":"Dan zal het gebeuren, omdat u deze rechten zult horen, en houden, en die doen, dat de HEERE, uw God, voor u het verbond en de goedertierenheid zal houden, die Hij uw vaderen gezworen heeft;","1 Kor 9:27":"Maar ik bedwing mijn lichaam, en breng het tot dienstbaarheid, opdat ik niet, nadat ik anderen gepredikt heb, zelf verwerpelijk word.","1 Sam 22:17":"En de koning zei tegen de lijfwachten die bij hem stonden: Wend u om, en dood de priesters van de HEERE, omdat hun hand ook met David is, en omdat zij geweten hebben dat hij vluchtte, en het mij niet hebben laten horen. Doch de knechten van de koning wilden hun hand niet uitsteken om de priesters van de HEERE aan te vallen.","1 Kon 1:5-10":"Adonia nu, de zoon van Haggith, verhief zich en zei: Ik zal koning zijn; en hij bereidde zich wagens en ruiters, en vijftig mannen die voor hem uit liepen. En zijn vader had hem nooit bedroefd door te zeggen: Waarom hebt u zo gedaan? En ook was hij zeer knap van gedaante, en Haggith had hem gebaard na Absalom. En hij overlegde met Joab, de zoon van Zeruja, en met Abjathar, de priester; die hielpen hem, en volgden Adonia.","Joz 1:8":"Laat het boek van deze wet niet wijken van uw mond, maar overleg het dag en nacht, opdat u waarneemt te doen naar alles wat daarin geschreven is; want dan zult u uw wegen voorspoedig maken, en dan zult u verstandig handelen.","Hand 2:29":"Mannen broeders, ik mag vrijuit tegen u spreken over de aartsvader David: hij is zowel gestorven als begraven, en zijn graf is bij ons tot op deze dag.","Gen 28:21":"en ik in vrede naar het huis van mijn vader terugkeer, dan zal de HEERE mij tot een God zijn!","Ps 147:9":"Die het vee zijn voer geeft; aan de jonge raven, als zij roepen.","Matt 18:19":"Verder zeg Ik u: als twee van u het op de aarde over enige zaak eens worden waar zij om zouden vragen, dat zal hun gebeuren van Mijn Vader, Die in de hemelen is.","Ex 27:2":"En u moet zijn hoorns maken op zijn vier hoeken; uit hetzelfde stuk zullen zijn hoorns zijn, en u moet het met koper overtrekken.","Ps 89:30":"En Ik zal zijn zaad in eeuwigheid vestigen, en zijn troon als de dagen van de hemelen.","Job 22:18":"Hij had immers hun huizen met goed gevuld; daarom is de raad van de goddelozen ver van mij.","2 Kron 17:3":"En de HEERE was met Josafat; want hij wandelde in de eerdere wegen van zijn vader David, en zocht de Baäls niet.","Deut 7:9":"U zult dan weten dat de HEERE, uw God, dié God is, de getrouwe God, Die het verbond en de goedertierenheid houdt met wie Hem liefhebben en Zijn geboden houden, tot in duizend geslachten.","2 Petr 1:13-15":"En ik acht het juist, zolang ik in deze tent ben, u door herinnering op te wekken; Want ik weet dat het afleggen van mijn tent spoedig zal zijn, zoals ook onze Heere Jezus Christus mij heeft geopenbaard. Maar ik zal er ook mijn best voor doen, dat u bij elke gelegenheid, na mijn heengaan, hieraan kunt terugdenken.","2 Sam 7:9":"En Ik ben met u geweest, overal waar u gegaan bent, en heb al uw vijanden voor uw aangezicht uitgeroeid; en Ik heb u een grote naam gemaakt, als de naam van de groten die op de aarde zijn.","Jer 17:25":"Zo zullen door de poorten van deze stad ingaan koningen en vorsten, zittende op de troon van David, rijdend op wagens en op paarden, zij en hun vorsten, de mannen van Juda en de inwoners van Jeruzalem; en deze stad zal bewoond worden in eeuwigheid.","Job 39:3":"Wie bereidt de raaf haar kost, als haar jongen tot God schreeuwen, als zij dwalen, omdat er geen eten is?","1 Kon 3:7":"Nu dan, HEERE, mijn God! U hebt Uw knecht koning gemaakt in de plaats van mijn vader David; en ik ben een jonge man, ik weet niet uit te gaan of in te gaan.","Deut 4:40":"En u zult Zijn inzettingen en Zijn geboden houden, die ik u vandaag gebied, opdat het u en uw kinderen na u goed gaat, en opdat u de dagen verlengt in het land dat de HEERE, uw God, u geeft, voor altijd.","2 Kron 26:5":"Want hij begaf zich om God te zoeken, in de dagen van Zacharia, die verstandig was in de gezichten van God; en in de dagen dat hij de HEERE zocht, maakte God hem voorspoedig.","Job 17:13":"Als ik wacht, het graf zal mijn huis wezen; in de duisternis zal ik mijn bed spreiden.","Joz 15:61":"In de woestijn: Beth-araba, Middin en Sechacha,","2 Sam 16:5-13":"Toen koning David tot bij Bahurim kwam, zie, daar kwam een man vandaan uit het geslacht van het huis van Saul, van wie de naam Simeï was, de zoon van Gera; hij liep almaar door en vloekte. En hij gooide David met stenen, en ook alle knechten van koning David, hoewel al het volk en alle helden aan zijn rechter- en aan zijn linkerhand waren. Zo zei Simeï, terwijl hij vloekte: Ga weg, ga weg, man van bloed, en man van Belial!","Ps 109:8":"Laat zijn dagen weinig zijn; een ander neemt zijn ambt;","1 Kron 29:19":"En geef mijn zoon Salomo een volkomen hart, om Uw geboden, Uw getuigenissen en Uw inzettingen te houden; en om alles te doen, en om dit paleis te bouwen, dat ik klaargemaakt heb.","Zach 8:12":"Want het zaad zal voorspoedig zijn, de wijnstok zal zijn vrucht geven, en de aarde zal haar opbrengst geven, en de hemel zal zijn dauw geven; en Ik zal het overblijfsel van dit volk dit alles doen erven.","2 Sam 19:5-7":"Toen kwam Joab bij de koning in huis, en zei: U hebt vandaag het gezicht van al uw knechten beschaamd gemaakt, terwijl zij vandaag uw leven hebben gered, en het leven van uw zonen en uw dochters, en het leven van uw vrouwen, en het leven van uw bijvrouwen; Door hen lief te hebben die u haten, en te haten die u liefhebben; want u geeft vandaag te kennen dat leiders en knechten voor u niets betekenen; want ik merk vandaag dat als Absalom in leven was gebleven, en wij vandaag allemaal dood waren, dat het u dan goed zou uitkomen. Zo sta nu op, ga naar buiten, en spreek uw knechten moed in; want ik zweer bij de HEERE: als u niet naar buiten gaat, zal er vannacht niemand bij u blijven! En dat zal erger voor u zijn dan al het kwaad dat u overkomen is vanaf uw jeugd tot nu toe.","Ps 71:15":"Mijn mond zal Uw gerechtigheid vertellen, de hele dag Uw heil; hoewel ik de getallen ervan niet weet.","1 Sam 27:2":"Toen maakte David zich op en trok weg, hij en de zeshonderd mannen die bij hem waren, naar Achis, de zoon van Maoch, de koning van Gath.","Zach 10:1":"Vraag van de HEERE regen, in de tijd van de late regen; de HEERE maakt de bliksemwolken¹, en Hij zal hun regen genoeg geven, voor ieder kruid op het veld.","Deut 33:1":"Dit nu is de zegen, waarmee Mozes, de man Gods, de kinderen Israëls gezegend heeft, voor zijn dood.","2 Sam 14:24":"En de koning zei: Laat hij naar zijn huis gaan, en mijn gezicht niet zien. Zo ging Absalom naar zijn huis, en zag het gezicht van de koning niet.","Joh 19:28":"Hierna, omdat Jezus wist dat nu alles volbracht was, zei Hij, opdat de Schrift vervuld zou worden: Ik heb dorst.","Matt 24:4":"En Jezus antwoordde en zei tegen hen: Kijk uit dat niemand u misleidt.","Kol 4:17":"En zeg tegen Archippus: Let op de bediening die u hebt aangenomen in de Heere, dat u die vervult.","2 Kon 18:7":"Zo was de HEERE met hem; overal waar hij heen trok, handelde hij kloek; daartoe viel 1 Kon 3:28":"En heel Israël hoorde dat oordeel dat de koning geveld had, en zij hadden ontzag voor het aangezicht van de koning; want zij zagen dat de wijsheid van God in hem was, om recht te doen.","1 Kon 2:1-10":"Toen de dagen van David naderden dat hij zou sterven, gaf hij zijn zoon Salomo deze opdracht en zei: Ik ga heen in de weg van de hele aarde, wees dus sterk en wees een man. En neem de wacht van de HEERE, uw God, in acht, om te wandelen in Zijn wegen, om Zijn inzettingen te onderhouden, en Zijn geboden, en Zijn rechten, en Zijn getuigenissen, zoals geschreven is in de wet van Mozes; opdat u verstandig handelt in alles wat u doet, en overal waar u zich heen wendt;","1 Kron 29:14":"Want wie ben ik, en wat is mijn volk, dat wij de macht zouden hebben gekregen om zo vrijwillig te geven als dit? Want het is alles van U, en wij geven het U uit Uw hand.","Ps 71:6":"Op U heb ik gesteund van de buik af aan; van de ingewanden van mijn moeder af aan zijt Gij mijn Uithelper; mijn lof is voortdurend van U.","Luk 12:7":"Ja, ook de haren van uw hoofd zijn allemaal geteld. Wees dan niet bang; u gaat vele musjes te boven.","Openb 16:15":"Zie, Ik kom als een dief. Zalig is hij die waakt en zijn kleren bewaart, zodat hij niet naakt hoeft te wandelen, en men zijn schaamte niet ziet.","Deut 12:13":"Wacht u ervoor dat u uw brandoffers niet offert op elke plaats die u zien zult.","Num 25:11-13":"Pinehas, de zoon van Eleazar, de zoon van Aäron, de priester, heeft Mijn grimmigheid van over de kinderen van Israël afgewend, omdat hij Mijn ijver geijverd heeft in hun midden, zodat Ik de kinderen van Israël in Mijn ijver niet vernietigd heb. Zeg daarom: Zie, Ik geef hem Mijn verbond van vrede. En hij zal hebben, en zijn nageslacht na hem, het verbond van het eeuwige priesterschap, omdat hij voor zijn God geijverd heeft, en verzoening gedaan heeft voor de kinderen van Israël.","Jer 50:34":"Maar hun Verlosser is sterk, HEERE van de heerscharen is Zijn Naam; Hij zal hun geschil zeker beslechten, opdat Hij het land tot rust brengt, maar de inwoners van Babel verontrust.","1 Kon 2:13-25":"Toen kwam Adonia, de zoon van Haggith, naar Bathseba, de moeder van Salomo; en zij zei: Komt u in vrede? En hij zei: In vrede. Daarna zei hij: Ik heb een woord voor u. En zij zei: Spreek. Hij zei dan: U weet dat het koninkrijk van mij was, en dat heel Israël zijn aangezicht op mij gericht had, dat ik koning zou worden; hoewel het koninkrijk is omgewend en van mijn broer geworden is; want het is van de HEERE aan hem gekomen.","1 Kron 28:8":"Welnu, voor de ogen van heel Israël, de gemeente van de HEERE, en voor de oren van onze God: houd en zoek al de geboden van de HEERE, uw God; opdat u dit goede land erfelijk bezit, en het na u nalaat als erfenis aan uw kinderen tot in eeuwigheid.","Jes 60:17":"Voor koper zal Ik goud brengen, en voor ijzer zal Ik zilver brengen, en voor hout koper, en voor stenen ijzer; en Ik zal uw opzieners vreedzaam maken, en uw drijvers rechtvaardig.","Spr 18:7":"De mond van de dwaas is voor hemzelf een verstoring, en zijn lippen zijn een strik voor zijn ziel.","2 Sam 17:15-22":"En Husai zei tegen Zadok en tegen Abjathar, de priesters: Zo en zo heeft Achitofel Absalom en de oudsten van Israël geraden, maar zo en zo heb ik geraden. Nu dan, stuur haastig iemand, en laat David weten: Overnacht deze nacht niet bij de vlakke velden van de woestijn, en ga ook snel over; anders wordt de koning verslonden, en al het volk dat bij hem is. Jonathan nu en Ahimaäz stonden bij de bron Rogel; en een dienstmeisje ging heen en vertelde het hun; en zij gingen heen en vertelden het aan koning David; want zij mochten zich niet laten zien door in de stad te komen.","1 Sam 2:8":"Hij verheft de geringe uit het stof, en de nooddruftige verhoogt Hij uit de vuilnis, om hen te doen zitten bij de vorsten, dat Hij hen de stoel van de eer laat beërven; want de fundamenten van het aardrijk zijn van de HEERE, en Hij heeft de wereld daarop gezet.","1 Sam 2:27-36":"En er kwam een man van God naar Eli, en zei tegen hem: Zo zegt de HEERE: Heb Ik Mij klaar geopenbaard aan het huis van uw vader, toen zij in Egypte waren, in het huis van Farao? En Ik heb hem uit alle stammen van Israël voor Mij tot priester verkozen, om te offeren op Mijn altaar, om het reukwerk aan te steken, om de efod voor Mijn aangezicht te dragen; en heb aan het huis van uw vader al de vuuroffers van de kinderen van Israël gegeven. Waarom trapt u achteruit tegen Mijn slachtoffer en tegen Mijn spijsoffer, dat Ik geboden heb in de woning; en eert u uw zonen meer dan Mij, dat u zich mest van het voornaamste van alle spijsoffers van Mijn volk Israël?","1 Kon 2:28-33":"Toen het bericht Joab bereikte (want Joab had zich achter Adonia geschaard, hoewel hij zich niet achter Absalom had geschaard), vluchtte Joab naar de tent van de HEERE, en greep de hoornen van het altaar vast. En het werd de koning Salomo verteld dat Joab naar de tent van de HEERE gevlucht was, en zie, hij is bij het altaar. Toen stuurde Salomo Benaja, de zoon van Jojada, en zei: Ga, val op hem aan. En Benaja kwam bij de tent van de HEERE, en zei tegen hem: Zo zegt de koning: Kom naar buiten. En hij zei: Nee, hier zal ik sterven! En Benaja bracht het antwoord terug aan de koning en zei: Zo heeft Joab gesproken, en zo heeft hij mij geantwoord.","Pred 8:11-13":"Omdat het oordeel over de boze daad niet snel wordt uitgevoerd, daarom is het hart van de mensenkinderen in hen vol om kwaad te doen. Hoewel een zondaar honderd maal kwaad doet, en God zijn dagen verlengt, weet ik toch zeker, dat het hun goed zal gaan die God vrezen, die voor Zijn aangezicht vrezen. Maar de goddeloze zal het niet goed gaan, en hij zal zijn dagen niet verlengen; hij zal zijn als een schaduw, omdat hij niet vreest voor het aangezicht van God.","Ps 37:19":"Zij zullen niet beschaamd worden in de kwade tijd, en in de dagen van het honger zullen zij verzadigd worden.","Ps 141:7":"Onze beenderen zijn verstrooid bij de mond van het graf, zoals wanneer iemand op de aarde iets kloofde en verdeelde.","Luk 22:35":"En Hij zei tegen hen: Toen Ik u uitzond zonder buidel en tas en schoenen, heeft u toen iets ontbroken? En zij zeiden: Niets.","Lev 26:10":"En u zult het oude, dat verouderd is, eten; en het oude zult u wegdoen vanwege het nieuwe.","Jer 31:35":"Zo zegt de HEERE, Die de zon overdag tot een licht geeft, de ordeningen van de maan en van de sterren tot een licht in de nacht, Die de zee klieft, zodat haar golven bruisen, HEERE van de heerscharen is Zijn Naam:","Jer 27:5-8":"Ik heb de aarde gemaakt, de mens en het vee die op de aardbodem zijn, door Mijn grote kracht en door Mijn uitgestrekte arm, en Ik geef ze aan wie het goed is in Mijn ogen. En nu, Ik heb al deze landen gegeven in de hand van Nebukadnezar, de koning van Babel, Mijn knecht; zelfs ook de dieren van het veld heb Ik hem gegeven, om hem te dienen. En alle volken zullen hem dienen, en zijn zoon, en de zoon van zijn zoon, totdat ook de tijd van zijn eigen land komt; dan zullen machtige volken en grote koningen hem zich dienstbaar maken.","Hos 11:3":"Ik echter leerde Efraïm lopen; Hij nam ze op Zijn armen, maar zij erkenden niet dat Ik ze genas.","2 Sam 3:37":"En al het volk en heel Israël merkten op die dag dat het niet van de koning was gekomen dat Abner, de zoon van Ner, gedood was.","1 Kron 3:5":"Dit nu zijn hem in Jeruzalem geboren: Simea, en Sobab, en Nathan, en Salomo; deze vier zijn van Bath-Sua, de dochter van Ammiël;","1 Kon 1:18":"En nu, zie, Adonia is koning; en nu, mijn heer koning, u weet het niet.","1 Kor 7:29-31":"Maar dit zeg ik, broeders: dat de tijd voortaan kort is; opdat ook zij die vrouwen hebben, zouden zijn alsof zij ze niet hadden; en zij die wenen, alsof zij niet weenden; en zij die blij zijn, alsof zij niet blij waren; en zij die kopen, alsof zij niet bezaten; en zij die deze wereld gebruiken, alsof zij die niet misbruikten; want de gedaante van deze wereld gaat voorbij.","Jes 62:9":"Maar wie het inzamelen, zullen het eten wees zorgvuldig, en doe het; want bij de HEERE, onze God, is geen onrecht, geen aanneming van personen, en geen ontvangst van geschenken.","Spr 25:5":"Doe de goddeloze weg van het aangezicht van de koning, en zijn troon zal door gerechtigheid bevestigd worden.","Kol 1:23":"als u maar blijft in het geloof, gefundeerd en vast, en niet wordt weggebracht van de hoop van het Evangelie dat u gehoord hebt, dat gepredikt is onder alle schepselen die onder de hemel zijn; waarvan ik, Paulus, een dienaar geworden ben;","Jes 51:2":"Kijk naar Abraham, uw vader, en naar Sara, die u gebaard heeft; want Ik riep hem, toen hij nog alleen was, en Ik zegende hem, en Ik vermenigvuldigde hem.","Gen 46:21":"En de zonen van Benjamin: Bela, Becher en Asbel, Gera en Naäman, Echi en Ros, Muppim en Huppim, en Ard.","Ex 20:7":"U zult de naam van de HEERE, uw God, niet ijdel gebruiken; want de HEERE zal niet onschuldig houden wie Zijn naam ijdel gebruikt.","2 Sam 16:18":"En Husai zei tegen Absalom: Nee, maar wie de HEERE verkiest, en dit hele volk, en alle mannen van Israël, van hem zal ik zijn, en bij hem zal ik blijven.","Hebr 3:14":"Want wij zijn deelgenoten van Christus geworden, als wij tenminste het begin van dit vaste vertrouwen tot het einde toe onwrikbaar vasthouden;","2 Sam 8:14":"En hij legde bezettingen in Edom; in heel Edom legde hij bezettingen; en alle Edomieten werden David tot knechten; en de HEERE behoedde David overal waar hij heentrok.","2 Kon 20:3":"Och, HEERE, gedenk toch dat ik voor Uw aangezicht in waarheid en met een volkomen hart gewandeld heb, en gedaan heb wat goed is in Uw ogen. En Hizkia huilde erg veel.","2 Sam 3:35":"Daarna kwam al het volk om David brood te laten eten, terwijl het nog dag was; maar David zwoer: God moet mij zo doen, en er nog meer aan toevoegen, als ik vóór het ondergaan van de zon brood of iets anders smaak!","Ps 127:1":"Een lied Hammaaloth¹, van Salomo. Als de HEERE het huis niet bouwt, werken de bouwers eraan tevergeefs; als de HEERE de stad niet bewaart, waakt de wachter tevergeefs.","Ps 49:15":"Men zet hen als schapen in het graf, de dood zal hen afweiden; en de oprechten zullen over hen heersen in die morgenstond; en het graf zal hun gedaante verslijten, elk uit zijn woning.","Ezech 34:25-28":"En Ik zal een verbond van vrede met hen maken, en zal het boze gedierte uit het land doen ophouden; en zij zullen zeker wonen in de woestijn, en slapen in de wouden. Want Ik zal hen, en de plaatsen rondom Mijn heuvel, stellen tot een zegen; en Ik zal de plasregen doen neerdalen op zijn tijd, plasregens van zegen zullen er zijn. En het geboomte van het veld zal zijn vrucht geven, en het land zal zijn opbrengst geven, en zij zullen zeker zijn in hun land; en zullen weten, dat Ik de HEERE ben, als Ik de disselbomen van hun juk zal hebben verbroken, en hen gered heb uit de hand van hen die zich door hen deden dienen.","1 Sam 18:30":"Als de vorsten van de Filistijnen uittrokken, gebeurde het, zo dikwijls als zij uittrokken, dat David verstandiger was dan al de knechten van Saul; zodat zijn naam zeer geacht werd.","Ezech 36:28-38":"En u zult wonen in het land dat Ik uw vaderen gegeven heb, en u zult Mij tot een volk zijn, en Ik zal u tot een God zijn. En Ik zal u verlossen van al uw onreinheden; en Ik zal roepen tot het koren, en zal dat vermenigvuldigen, en Ik zal geen honger op u leggen. En Ik zal de vrucht van het geboomte en de opbrengst van het veld vermenigvuldigen, opdat u de smaad van het honger niet meer ontvangt onder de heidenen.","2 Sam 19:28":"Want heel mijn vaders huis was voor mijn heer de koning niets anders dan mensen die de dood verdienen; toch hebt u uw knecht een plaats gegeven onder hen die aan uw tafel eten; wat recht heb ik dan nog om verder te klagen bij de koning?","2 Sam 15:29":"Zo brachten Zadok en Abjathar de ark van God terug naar Jeruzalem, en zij bleven daar.","Spr 30:16":"Het graf, de gesloten baarmoeder, de aarde die van water niet verzadigd wordt, en het vuur dat niet zegt: Het is genoeg!","Luk 1:32":"Hij zal groot zijn, en de Zoon van de Allerhoogste genoemd worden; en God, de Heere, zal Hem de troon van Zijn vader David geven.","Hand 14:17":"hoewel Hij Zichzelf toch niet zonder getuigenis gelaten heeft, doordat Hij goeddeed, ons vanuit de hemel regen en vruchtbare tijden gaf, en onze harten vervulde met voedsel en vreugde.","1 Sam 25:36":"Toen Abigaïl nu bij Nabal kwam, zie, zo had hij een maaltijd in zijn huis, als een koningsmaaltijd; en het hart van Nabal was vrolijk in hem, en hij was zeer dronken; daarom vertelde zij hem niets, klein of groot, tot het morgenlicht.","2 Kon 4:12":"Toen zei hij tegen zijn knecht Gehazi: Roep deze Sunamitische. En toen hij haar geroepen had, stond zij voor hem.","Pred 8:11":"Omdat het oordeel over de boze daad niet snel wordt uitgevoerd, daarom is het hart van de mensenkinderen in hen vol om kwaad te doen.","Richt 9:57":"Op dezelfde manier liet God al het kwaad van de mensen van Sichem op hun hoofd terugkomen; en de vloek van Jotham, de zoon van Jerubbaäl, kwam over hen.","Job 11:17-19":"Ja, uw levenstijd zal helderder dan de middag oprijzen; u zult stralen, als de morgenstond zult u zijn. En u zult vertrouwen, omdat er verwachting zal zijn; en u zult graven, gerust zult u slapen; En u zult neerliggen, en niemand zal u verschrikken; en velen zullen uw gezicht smeken.","1 Joh 5:18":"Wij weten dat ieder die uit God geboren is, niet zondigt; maar wie uit God geboren is, bewaart zichzelf, en de boze krijgt geen vat op hem.","2 Sam 12:5":"Toen ontstak Davids woede erg tegen die man, en hij zei tegen Nathan: Zo waar de HEERE leeft, de man die dat gedaan heeft, is een kind des doods!","Spr 4:23":"Behoed uw hart boven alles wat te bewaren is, want daaruit komt het leven voort.","2 Kron 7:17-22":"En wat u betreft, als u voor Mijn aangezicht wandelt, zoals uw vader David gewandeld heeft, en doet naar alles wat Ik u geboden heb, en Mijn inzettingen en Mijn rechten houdt; Dan zal Ik de troon van uw koninkrijk bevestigen, zoals Ik een verbond met uw vader David gemaakt heb, en zei: Er zal u geen man afgesneden worden die in Israël heerst. Maar als u zich afkeert, en Mijn inzettingen en Mijn geboden, die Ik voor uw aangezicht gegeven heb, verlaat, en heengaat, en andere goden dient, en u voor die neerbuigt;","1 Kon 8:23":"en hij zei: HEERE, God van Israël, er is geen God zoals U, boven in de hemel, noch beneden op de aarde, Die het verbond en de goedertierenheid houdt aan Uw dienaren, die voor Uw aangezicht met hun hele hart wandelen;","Ps 37:25":"Nun. Ik ben jong geweest, ook ben ik oud geworden, maar heb de rechtvaardige niet verlaten gezien, of zijn nageslacht zoekend naar brood.","2 Sam 2:1-4":"Daarna gebeurde het, dat David de HEERE vroeg en zei: Zal ik optrekken in een van de steden van Juda? En de HEERE zei tegen hem: Trek op. En David zei: Waarheen zal ik optrekken? En Hij zei: Naar Hebron. Zo trok David daarheen op, en ook zijn twee vrouwen, Ahinoam, de Jizreëlietische, en Abigaïl, de vrouw van Nabal, de Karmeliet. Ook liet David zijn mannen optrekken, die bij hem waren, ieder met zijn huisgezin; en zij woonden in de steden van Hebron.","1 Kron 28:9":"En u, mijn zoon Salomo, ken de God van uw vader, en dien Hem met een volkomen hart en met een gewillige ziel; want de HEERE doorzoekt alle harten, en Hij doorziet elk bedenksel van de gedachten; als u Hem zoekt, zal Hij door u gevonden worden; maar als u Hem verlaat, zal Hij u voor altijd verstoten.","2 Kon 20:19":"Maar Hizkia zei tegen Jesaja: Het woord van de HEERE, dat u gesproken hebt, is goed. Ook zei hij: Zou het niet goed zijn, als er vrede en waarheid in mijn dagen zal zijn?","Jes 14:4-7":"dan zult u deze spreuk aanheffen tegen de koning van Babel, en zeggen: Hoe houdt de onderdrukker op! Hoe houdt de gouden stad op! De HEERE heeft de stok van de goddelozen gebroken, de scepter van de heersers. Die de volken sloeg in verbolgenheid met een plaag zonder ophouden, die in toorn over de heidenvolken heerste, wordt vervolgd, zonder dat iemand het kan afweren.","1 Kon 1:25":"Want hij is vandaag afgegaan en heeft ossen geslacht, en gemest vee, en schapen in overvloed, en heeft alle zonen van de koning genodigd, en de aanvoerders van het leger, en Abjathar, de priester; en zie, zij eten en drinken voor zijn aangezicht, en zeggen: Leve de koning Adonia!","1 Kor 11:28":"Maar laat de mens zichzelf beproeven, en laat hij zo van het brood eten, en van de drinkbeker drinken.","Job 14:13":"Och, wilde U mij toch in het graf verbergen, mij verstoppen, totdat Uw toorn zich afkeerde; dat U mij een vaste tijd stelde, en aan mij zou denken!","Jona 4:6":"En God, de HEERE, liet een wonderboom groeien en die opschieten boven Jona, zodat er schaduw zou zijn over zijn hoofd, om hem te bevrijden van zijn ellende. En Jona verheugde zich over de wonderboom met grote blijdschap.","Ps 37:22":"Want zijn gezegenden zullen de aarde erfelijk bezitten; maar zijn vervloekten zullen uitgeroeid worden.","1 Kron 22:13":"Dan zult u voorspoedig zijn, als u erop toeziet om te doen de inzettingen en de rechten die de HEERE aan Mozes geboden heeft over Israël. Wees sterk en heb goede moed, wees niet bevreesd, en wees niet verslagen!","Luk 10:6":"En als daar een zoon van de vrede is, zal uw vrede op hem rusten; maar zo niet, dan zal uw vrede tot u terugkeren.","Richt 8:20":"En hij zei tegen Jether, zijn eerstgeborene: Sta op, dood hen; maar de jongeman trok zijn zwaard niet, want hij was bang, omdat hij nog een jongeman was.","Jer 51:16":"Als Hij Zijn stem geeft, is er een gedruis van water in de hemel, en Hij doet de dampen opklimmen van het einde van de aarde; Hij maakt de bliksems met de regen, en doet de wind voortkomen uit Zijn schatkamers.","2 Sam 5:4":"Dertig jaar was David oud, toen hij koning werd; veertig jaar heeft hij geregeerd.","Ps 31:18":"HEERE! laat mij niet beschaamd worden, want ik roep U aan; laat de goddelozen beschaamd worden, laat hen zwijgen in het graf.","Ezra 8:22":"Want ik schaamde mij om van de koning een leger en ruiters te vragen om ons te helpen tegen de vijand, op de weg; omdat wij tegen de koning gesproken hadden en gezegd: De hand van onze God is ten goede over allen die Hem zoeken, maar Zijn sterkte en Zijn toorn over allen die Hem verlaten.","Gen 44:29":"Als u nu deze ook van mijn gezicht wegneemt, en hem een ongeluk overkomt, zult u mijn grijze haren met verdriet naar het graf doen afdalen!","Spr 5:16":"Laat uw bronnen zich naar buiten verspreiden, en de waterbeken op de straten;","Deut 1:10":"De HEERE, uw God, heeft u talrijk gemaakt, en zie, u bent vandaag zo talrijk als de sterren aan de hemel.","Ex 24:14":"En hij zei tegen de oudsten: Blijft u hier voor ons, totdat wij weer tot u komen; en zie, Aäron en Hur zijn bij u; wie een zaak heeft, moet naar hen toe gaan.","2 Sam 7:8":"Nu dan, zo zult u tegen Mijn knecht, tegen David, zeggen: Zo zegt de HEERE van de heerscharen: Ik heb u genomen van de schaapskooi, van achter de schapen, om een voorganger te zijn over Mijn volk, over Israël.","1 Sam 22:18":"Toen zei de koning tegen Doeg: Wend u om, en val de priesters aan. Toen wendde Doeg, de Edomiet, zich om, en hij viel de priesters aan, en doodde op die dag vijfentachtig mannen die de linnen priesterrok droegen.","2 Kon 9:26":"Zeker heb Ik gisteravond het bloed van Naboth gezien, en het bloed van zijn zonen, zegt de HEERE, en Ik zal het u vergelden op dit stuk land, zegt de HEERE. Nu dan, neem hem op, werp hem op dat stuk land, naar het woord van de HEERE.","Matt 26:56":"maar dit alles is gebeurd, opdat de Schriften van de profeten vervuld zouden worden. Toen vluchtten alle discipelen en lieten Hem in de steek.","2 Sam 3:26":"Toen Joab bij David wegging, stuurde hij boden achter Abner aan, die hem terughaalden van de put van Sira; maar David wist dat niet.","Deut 18:8":"dan zullen zij een gelijk deel eten, boven wat hij krijgt uit de verkoop van het vaderlijk bezit.","Job 7:9":"Een wolk vergaat en vaart heen; zo zal hij die in het graf daalt, niet weer opkomen.","Gen 1:29":"En God zei: Zie, Ik heb u al het zaadvormende gewas gegeven dat op de hele aarde is, en alle bomen waaraan zaaddragende boomvruchten zitten; het zal u tot voedsel zijn.","Luk 2:14":"Ere zij God in de hoogste hemelen, en vrede op aarde, in de mensen een welbehagen.","Openb 2:10":"Vrees niets van de dingen die u lijden zult. Zie, de duivel zal sommigen van u in de gevangenis werpen, opdat u beproefd wordt; en u zult een verdrukking hebben van tien dagen. Wees getrouw tot de dood, en Ik zal u de kroon des levens geven.","Spr 16:9":"Het hart van de mens overdenkt zijn weg; maar de HEERE bestuurt zijn gang.","Ps 145:16":"Pe. U doet Uw hand open, en verzadigt alles wat leeft, naar Uw welbehagen.","Amos 9:13":"Zie, de dagen komen, spreekt de HEERE, dat de ploeger de maaier zal bereiken, en de druiventreder de zaadzaaier; en de bergen zullen van zoete wijn druipen, en alle heuvels zullen smelten.","Ex 22:28":"U mag de rechters niet vervloeken, en de leiders van uw volk mag u niet belasteren.","Ps 140:10":"Wat het hoofd betreft van hen die mij omringen, de overlast van hun lippen overdekt hen.","Spr 14:11":"Het huis van de goddelozen zal weggevaagd worden; maar de tent van de oprechten zal bloeien.","Neh 4:9":"Maar wij baden tot onze God, en zetten wacht tegen hen, dag en nacht, vanwege hen.","Job 22:25":"Ja, de Almachtige zal uw overvloedige goud zijn, en uw krachtig zilver zijn;","1 Kron 11:7":"David nu woonde op de burcht; daarom noemt men die de stad van David.","Zach 14:11":"En zij zullen daarin wonen, en er zal geen verbanning meer zijn; want Jeruzalem zal zeker wonen.","1 Kon 3:14":"En als u in Mijn wegen wandelt en Mijn inzettingen en Mijn geboden onderhoudt, zoals uw vader David gewandeld heeft, dan zal Ik ook uw dagen verlengen.","Jes 65:23":"Zij zullen niet tevergeefs arbeiden, noch baren voor verstoring; want zij zijn het nageslacht van de gezegenden van de HEERE, en hun nakomelingen met hen.","Mal 4:4":"Denk aan de wet van Mozes, Mijn knecht, die Ik hem geboden heb op Horeb voor heel Israël, met de inzettingen en rechten.","Dan 5:10-12":"Vanwege deze woorden van de koning en zijn leiders, ging de koningin het huis van de maaltijd binnen. De koningin sprak en zei: O koning, leef in eeuwigheid! Laat uw gedachten u niet verschrikken, en laat uw gezichtskleur niet veranderen. Er is een man in uw koninkrijk, in wie de geest van de heilige goden is, want in de dagen van uw vader is bij hem licht, en verstand, en wijsheid gevonden, zoals de wijsheid van de goden is; daarom stelde de koning Nebukadnezar, uw vader, hem aan tot leider van de tovenaars, de sterrenkijkers, de Chaldeeën, en de waarzeggers, uw vader, o koning! Omdat een voortreffelijke geest, en wetenschap, en verstand van iemand die dromen uitlegt, en raadsels aanwijst, en knopen ontbindt, in hem gevonden werd, in Daniël, aan wie de koning de naam Beltsazar gaf; laat nu Daniël geroepen worden, die zal de uitleg bekendmaken.","Rom 11:21":"Want als God de natuurlijke takken niet gespaard heeft, zie toe, dat Hij ook mogelijk u niet spaart.","Deut 30:1-10":"Verder zal het gebeuren, wanneer al deze dingen over u gekomen zijn, deze zegen of deze vloek, die ik u voorgesteld heb; zo zult u het weer ter harte nemen, onder alle volken, waarheen de HEERE, uw God, u gedreven heeft; En u zult zich bekeren tot de HEERE, uw God, en Zijn stem gehoorzaam zijn, naar alles wat ik u heden gebied, u en uw kinderen, met uw ganse hart en met uw ganse ziel. En de HEERE, uw God, zal uw gevangenschap wenden, en Zich over u ontfermen; en Hij zal u weer bijeenbrengen uit al de volken waarheen de HEERE, uw God, u verstrooid had.","1 Kron 16:39":"En de priester Zadok, en zijn broeders, de priesters, voor de tabernakel van de HEERE op de hoogte, die te Gibeon is;","Deut 11:13":"En het zal gebeuren, als u zorgvuldig zult horen naar Mijn geboden, die Ik u heden gebied, om de HEERE, uw God, lief te hebben, en Hem te dienen, met uw hele hart en met uw hele ziel;","1 Kron 12:17":"En David ging hun tegemoet, en antwoordde en zei tegen hen: Als u in vrede tot mij gekomen bent om mij te helpen, dan zal mijn hart met u verbonden zijn; maar als het is om mij bedrieglijk over te leveren aan mijn vijanden, terwijl er toch geen onrecht in mijn handen is, dan zie de God van onze vaderen het en straffe het!","Lev 26:3-43":"Als u in Mijn inzettingen wandelt, en Mijn geboden houdt, en die doet; Dan zal Ik uw regens geven op hun tijd; en het land zal zijn opbrengst geven, en het geboomte van het veld zal zijn vrucht geven; En de dorstijd zal u reiken tot de wijnoogst, en de wijnoogst zal reiken tot de zaaitijd; en u zult uw brood eten tot verzadiging toe, en u zult zeker in uw land wonen.","2 Sam 3:4":"en de vierde, Adonia, de zoon van Haggith; en de vijfde Sefatja, de zoon van Abital;","1 Kron 15:12":"En hij zei tegen hen: U bent hoofden van de families onder de Levieten; heilig uzelf, u en uw broers, zodat u de ark van de HEERE, de God van Israël, opbrengt naar de plaats, die ik voor haar bereid heb.","1 Kron 28:7":"En Ik zal zijn koninkrijk bevestigen tot in eeuwigheid, als hij standvastig is om Mijn geboden en Mijn rechten te doen, zoals op deze dag.","Luk 1:6":"En zij waren beiden rechtvaardig voor God, en wandelden onberispelijk in alle geboden en voorschriften van de Heere.","1 Kron 29:26":"Zo heeft dan David, de zoon van Isaï, geregeerd over heel Israël.","Deut 28:1-14":"En het zal gebeuren, als u naar de stem van de HEERE, uw God, vlijtig luistert en oplet dat u al Zijn geboden doet, die ik u heden gebied, zo zal de HEERE, uw God, u hoog boven alle volken van de aarde plaatsen. En al deze zegeningen zullen over u komen, en u aantreffen, wanneer u naar de stem van de HEERE, uw God, luistert. Gezegend zult u zijn in de stad, en gezegend zult u zijn op het veld.","Deut 12:28":"Neem het waar, en hoor al deze woorden die ik u gebied, opdat het u, en uw kinderen na u, goed gaat tot in eeuwigheid, als u zult gedaan hebben wat goed en recht is in de ogen van de HEERE, uw God.","Job 36:11":"Als zij horen, en Hem dienen, dan zullen zij hun dagen eindigen in het goede, en hun jaren in liefelijkheden.","2 Kron 20:3-30":"Josafat nu werd bevreesd, en richtte zich erop om de HEERE te zoeken; en hij riep een vasten uit in heel Juda. En Juda kwam bijeen om hulp te zoeken bij de HEERE; ook kwamen zij uit alle steden van Juda om de HEERE te zoeken. En Josafat stond in de samenkomst van Juda en Jeruzalem, in het huis van de HEERE, voor het nieuwe voorhof.","Job 5:24-26":"En u zult bevinden dat uw tent in vrede is; en u zult uw woning verzorgen, en zult niet feilen. Ook zult u bevinden dat uw nageslacht talrijk zal zijn, en uw spruiten als het kruid van de aarde. U zult in ouderdom naar het graf gaan, zoals de korenhoop op zijn tijd wordt opgevoerd.","Ps 81:14-17":"Och, dat Mijn volk naar Mij geluisterd had, dat Israël in Mijn wegen had gewandeld! In korte tijd zou Ik hun vijanden onderworpen hebben, en Mijn hand gewend hebben tegen hun tegenstanders. Zij die de HEERE haten, zouden zich Hem geveinsd onderworpen hebben, maar hun tijd zou eeuwig geweest zijn.","1 Kron 8:7":"En Naäman, en Ahia, en Gera; dezen voerde hij weg; en hij verwekte Uzza en Ahihud.","Richt 9:24":"opdat het geweld, gedaan aan de zeventig zonen van Jerubbaäl, tot uiting zou komen, en opdat hun bloed gelegd zou worden op Abimelech, hun broer, die hen gedood had, en op de burgers van Sichem, die zijn handen gesterkt hadden om zijn broers te doden.","2 Sam 15:23":"En heel het land weende met luide stem, terwijl heel het volk overging; ook ging de koning over de beek Kidron, en heel het volk ging over, recht in de richting van de weg naar de woestijn.","Job 9:28":"Dan schroom ik voor al mijn smarten; ik weet dat U mij niet onschuldig zult houden.","Ps 109:6-15":"Stel een goddeloze over hem, en de satan sta aan zijn rechterhand. Als hij geoordeeld wordt, laat hij dan schuldig uitgaan, en zijn gebed moet tot zonde worden. Laat zijn dagen weinig zijn; een ander neemt zijn ambt;","1 Kon 9:3-9":"En de HEERE zei tegen hem: Ik heb uw gebed en uw smeking gehoord, die u voor Mijn aangezicht smekend gedaan hebt; Ik heb dit huis geheiligd, dat u gebouwd hebt, om Mijn Naam daar tot in eeuwigheid te vestigen; en Mijn ogen en Mijn hart zullen daar alle dagen zijn. En als u voor Mijn aangezicht wandelt, zoals uw vader David gewandeld heeft, met een volkomen hart, en met oprechtheid, om te doen naar alles wat Ik u geboden heb, en Mijn inzettingen en Mijn rechten houdt; Dan zal Ik de troon van uw koninkrijk over Israël bevestigen in eeuwigheid; zoals Ik gesproken heb over uw vader David, en zei: Er zal u geen man afgesneden worden van de troon van Israël.","1 Sam 14:6":"Jonathan nu zei tegen de jongen die zijn wapens droeg: Kom, laten we naar de bezetting van deze onbesnedenen oversteken; misschien zal de HEERE voor ons werken, want bij de HEERE is geen belemmering om te verlossen door velen of door weinigen.","Gen 50:24":"En Jozef zei tot zijn broeders: Ik sterf; maar God zal u zeker bezoeken, en Hij zal u doen optrekken uit dit land, naar het land, dat Hij aan Abraham, Izak en Jakob gezworen heeft.","Deut 7:12-15":"Dan zal het gebeuren, omdat u deze rechten zult horen, en houden, en die doen, dat de HEERE, uw God, voor u het verbond en de goedertierenheid zal houden, die Hij uw vaderen gezworen heeft; en Hij zal u liefhebben, en zal u zegenen, en u meer maken; en Hij zal de vrucht van uw buik zegenen, en de vrucht van uw land, uw koren, en uw most, en uw olie, de nakomelingen van uw koeien, en de kudden van uw kleinvee, in het land dat Hij uw vaderen gezworen heeft aan u te geven. Gezegend zult u zijn boven alle volken; er zal onder u geen man of vrouw onvruchtbaar zijn, ook niet onder uw beesten;","Zach 9:17":"Want hoe groot zal zijn goed wezen en hoe groot zal zijn schoonheid wezen! Het koren zal de jongelingen, en de most zal de jonkvrouwen sprekend maken.","Hand 2:30":"Omdat hij dan een profeet was, en wist dat God hem met een eed gezworen had dat Hij uit de vrucht van zijn lichaam, wat het vlees betreft, de Christus zou verwekken om Hem op zijn troon te zetten;","1 Kon 4:22":"Het voedsel nu van Salomo was voor één dag: dertig kor meelbloem, en zestig kor meel;","2 Sam 15:13-15":"Toen kwam er een boodschapper naar David, en zei: Het hart van ieder in Israël volgt Absalom na. Toen zei David tegen al zijn knechten die met hem te Jeruzalem waren: Maak u op, en laten we vluchten, want anders zou er voor ons geen ontkomen zijn voor Absalom; haast u om weg te gaan, opdat hij ons niet misschien plotseling haast, en ons achterhaalt, en een kwaad over ons brengt, en deze stad slaat met de scherpte van het zwaard. Toen zeiden de knechten van de koning tegen de koning: Naar alles wat mijn heer de koning zal verkiezen, zie, hier zijn uw knechten.","Matt 10:29-31":"Worden niet twee musjes voor een penninkje verkocht? En niet één daarvan zal op de aarde vallen zonder uw Vader. En ook uw haren van het hoofd zijn alle geteld. Vreest dan niet; u gaat vele musjes te boven.","Mal 2:15":"Heeft Hij niet maar één gemaakt, hoewel Hij van de Geest overvloed had? En waarom die ene? Hij zocht een zaad van God. Daarom, wees op uw hoede met uw geest, en laat niemand trouweloos handelen tegen de vrouw van zijn jeugd.","1 Sam 2:6":"De HEERE doodt en maakt levend; Hij doet naar het graf neerdalen, en Hij doet weer opkomen.","Joz 2:19":"Dan zal het gebeuren: iedereen die door de deuren van uw huis naar buiten gaat, diens bloed komt op zijn eigen hoofd, en wij zullen vrij zijn; maar iedereen die bij u in huis zal zijn, diens bloed komt op ons hoofd, als er een hand tegen hem zal zijn.","Zach 14:2":"Want Ik zal alle heidenen tegen Jeruzalem ten strijde verzamelen; en de stad zal ingenomen worden, en de huizen zullen geplunderd worden, en de vrouwen zullen geschonden worden; en de helft van de stad zal uitgaan in de gevangenis, maar het overige van het volk zal uit de stad niet uitgeroeid worden.","Ps 115:16":"Wat de hemel betreft, de hemel is van de HEERE; maar de aarde heeft Hij aan de mensenkinderen gegeven.","Deut 31:14":"En de HEERE zei tegen Mozes: Zie, uw dagen zijn genaderd om te sterven; roep Jozua, en stel u op in de tent van de samenkomst, zodat Ik hem een opdracht geef. Zo ging Mozes, en Jozua, en zij stelden zich op in de tent van de samenkomst.","1 Kon 1:7":"En hij overlegde met Joab, de zoon van Zeruja, en met Abjathar, de priester; die hielpen hem, en volgden Adonia.","1 Tim 1:18":"Dit gebod beveel ik u, mijn zoon Timotheüs, dat u naar de profetieën die eerder over u uitgesproken zijn, daarmee de goede strijd strijdt;","Joël 2:18-26":"Zo zal de HEERE ijveren over Zijn land, en Hij zal Zijn volk verschonen. En de HEERE zal antwoorden en tegen Zijn volk zeggen: Ziet, Ik zend u het koren, en de most, en de olie, zodat u daarvan verzadigd zult worden; en Ik zal u niet meer overgeven tot een smaad onder de heidenen. En Ik zal hem die uit het noorden komt ver van u doen vertrekken, en hem wegdrijven in een dor en woest land, zijn voorkant naar de Oostzee, en zijn achterkant naar de verste zee; en zijn stank zal opgaan, en zijn vuiligheid zal opgaan; want hij heeft grote dingen gedaan.","2 Kon 4:13":"(Want hij had hem gezegd: Zeg toch tegen haar: Zie, u bent zo bezorgd voor ons geweest, met al deze zorg; wat kan er voor u gedaan worden? Moet er voor u gesproken worden tot de koning, of tot de legeraanvoerder? En zij had gezegd: Ik woon te midden van mijn volk.","1 Sam 21:10-15":"En David stond op, en vluchtte diezelfde dag van het aangezicht van Saul weg; en hij kwam bij Achis, de koning van Gath. Doch de knechten van Achis zeiden tegen hem: Is dit niet David, de koning van het land? Zong men niet van hem in de reidansen, en zei: Saul heeft zijn duizenden verslagen, maar David zijn tienduizenden? En David nam deze woorden ter harte; en hij was zeer bevreesd voor het aangezicht van Achis, de koning van Gath.","Jes 48:22":"Maar de goddelozen hebben geen vrede, zegt de HEERE.","1 Sam 20:5":"En David zei tegen Jonathan: Zie, morgen is de nieuwe maan, wanneer ik zeker met de koning zou aanzitten om te eten; zo laat mij gaan, dat ik mij op het veld verberg tot aan de derde avond.","1 Kor 10:12":"Wie dan meent te staan, laat hij toezien dat hij niet valt.","Ps 36:8":"Hoe dierbaar is Uw goedertierenheid, o God! Daarom nemen de mensenkinderen onder de schaduw van Uw vleugels toevlucht.","Spr 21:30":"Er is geen wijsheid, en er is geen verstand, en er is geen raad tegen de HEERE.","2 Sam 17:18":"Een jongen zag hen echter, en vertelde het aan Absalom; doch die beiden gingen haastig weg, en kwamen in het huis van een man te Bahurim, die een put had in zijn binnenplaats, en zij daalden daarin af.","Fil 4:5":"Uw vriendelijkheid moet bij alle mensen bekend zijn. De Heere is nabij.","1 Sam 3:12-14":"Op diezelfde dag zal Ik over Eli alles tot stand brengen wat Ik tegen zijn huis gesproken heb; Ik zal het beginnen en voltooien. Want Ik heb hem laten weten dat Ik zijn huis zal oordelen tot in eeuwigheid, vanwege het ongerecht dat hij gekend heeft; want toen zijn zonen zich vervloekt hebben gemaakt, heeft hij hen niet eens streng aangezien. Daarom heb Ik het huis van Eli gezworen: Nooit zal het ongerecht van het huis van Eli tot in eeuwigheid verzoend worden door slachtoffer of door spijsoffer!","2 Sam 15:6":"En op die manier deed Absalom met heel Israël, die tot de koning kwamen voor een rechtszaak. Zo stal Absalom het hart van de mannen van Israël.","Job 29:5":"Toen de Almachtige nog met mij was, en mijn jongens rondom mij;","Ps 118:6":"De HEERE is bij mij, ik zal niet vrezen; wat zal een mens mij doen?","Matt 24:42-51":"Waak dan, want u weet niet in welk uur uw Heere komen zal. Maar weet dit, dat als de heer des huizes geweten had in welke nachtwake de dief komen zou, hij gewaakt zou hebben en niet zou hebben toegelaten dat zijn huis werd doorgraven. Daarom, wees ook u bereid, want op een uur dat u het niet verwacht, zal de Zoon des mensen komen.","1 Kon 2:41-4
