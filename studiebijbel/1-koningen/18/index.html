],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"En het gebeurde na veel dagen, dat het woord van de HEERE tot Elia gebeurde, in het derde jaar: Ga heen, vertoon u aan Achab; want Ik zal regen geven op de aardbodem.","2":"En Elia ging heen om zich aan Achab te vertonen. En de honger was sterk in Samaria.","3":"En Achab had Obadja, de hofmeester, geroepen; en Obadja was de HEERE zeer vrezende.","4":"Want het gebeurde, toen Izebel de profeten van de HEERE uitroeide, dat Obadja honderd profeten nam, en ze verborg bij vijftig man in een grot, en hen onderhield met brood en water.","5":"En Achab had tegen Obadja gezegd: Trek door het land, naar alle waterfonteinen en naar alle rivieren; misschien vinden wij gras, zodat wij de paarden en de muilezels in leven houden, en niets van het vee hoeven uit te roeien.","6":"En zij verdeelden het land onder zich om het te doortrekken; Achab ging op zichzelf één weg, en Obadja ging ook op zichzelf één weg.","7":"Toen Obadja nu op de weg was, zie, daar kwam Elia hem tegemoet; en hem herkennend, viel hij op zijn gezicht en zei: Bent u mijn heer Elia?","8":"Hij zei: Ik ben het; ga heen, zeg tegen uw heer: Zie, Elia is hier.","9":"Maar hij zei: Wat heb ik gezondigd, dat u uw knecht geeft in de hand van Achab, om mij te doden?","10":"Zo waarachtig als de HEERE, uw God, leeft: er is geen volk of koninkrijk waar mijn heer niet naartoe gezonden heeft om u te zoeken; en als zij zeiden: Hij is hier niet, liet hij dat koninkrijk en dat volk zweren dat zij u niet hadden gevonden.","11":"En nu zegt u: Ga heen, zeg tegen uw heer: Zie, Elia is hier.","12":"En het zou kunnen gebeuren, zodra ik van u weggegaan ben, dat de Geest van de HEERE u wegneemt, ik weet niet waarheen; en dan kom ik om dat aan Achab te melden, en hij vindt u niet, dan zou hij mij doden; terwijl ik, uw knecht, de HEERE al van mijn jeugd af aan vrees.","13":"Is mijn heer niet verteld wat ik gedaan heb, toen Izebel de profeten van de HEERE doodde? Dat ik van de profeten van de HEERE honderd man heb verborgen, elk vijftig man in een grot, en hen met brood en water heb onderhouden?","14":"En nu zegt u: Ga heen, zeg tegen uw heer: Zie, Elia is hier; en hij zou mij doodslaan.","15":"En Elia zei: Zo waarachtig als de HEERE van de heerscharen[1] leeft, voor Wiens aangezicht ik sta, ik zal mij vandaag zeker aan hem vertonen!","16":"Toen ging Obadja Achab tegemoet, en meldde het hem; en Achab ging Elia tegemoet.","17":"En het gebeurde, toen Achab Elia zag, dat Achab tegen hem zei: Bent u degene die Israël in beroering brengt?","18":"Toen zei hij: Ik heb Israël niet in beroering gebracht, maar u en het huis van uw vader, doordat u de geboden van de HEERE verlaten hebt en de Baäls bent gaan navolgen.","19":"Nu dan, zend heen, verzamel bij mij heel Israël op de berg Karmel, en de vierhonderdvijftig profeten van Baäl, en de vierhonderd profeten van het bos, die van de tafel van Izebel eten.","20":"Zo zond Achab boden onder alle kinderen van Israël, en verzamelde de profeten op de berg Karmel.","21":"Toen naderde Elia tot heel het volk, en zei: Hoe lang hinkt u op twee gedachten? Als de HEERE God is, volg Hem na, en als het Baäl is, volg hem na! Maar het volk antwoordde hem geen woord.","22":"Toen zei Elia tegen het volk: Ik ben als enige profeet van de HEERE overgebleven, en de profeten van Baäl zijn vierhonderdvijftig mannen.","23":"Laat men ons dan twee stieren geven, en laat hen voor zich de ene stier kiezen, en die in stukken delen, en op het hout leggen, maar geen vuur eronder leggen; en ik zal de andere stier bereiden, en op het hout leggen, en geen vuur eronder leggen.","24":"Roep u dan de naam van uw god aan, en ik zal de Naam van de HEERE aanroepen; en de God Die door vuur antwoorden zal, Die zal God zijn. En heel het volk antwoordde en zei: Dat is goed gezegd.","25":"En Elia zei tegen de profeten van Baäl: Kies voor u de ene stier, en bereid hem eerst, want u bent met velen; en roep de naam van uw god aan, en leg er geen vuur aan.","26":"En zij namen de stier die hij hun gegeven had, en bereidden hem, en riepen de naam van Baäl aan, van de morgen tot de middag, en zeiden: O Baäl, antwoord ons! Maar er was geen stem en geen die antwoordde. En zij sprongen tegen het altaar dat men gemaakt had.","27":"En het gebeurde op de middag, dat Elia met hen spotte, en zei: Roep met luide stem, want hij is een god; misschien is hij in gedachten verzonken, of heeft hij iets te doen, of is hij op reis; misschien slaapt hij en moet hij wakker worden.","28":"En zij riepen met luide stem, en zij sneden zichzelf met messen en priemen, naar hun gewoonte, totdat zij bloed over zich uitstortten.","29":"En het gebeurde, toen de middag voorbij was, dat zij profeteerden totdat men het spijsoffer zou offeren; maar er was geen stem, en geen die antwoordde, en geen die er acht op sloeg.","30":"Toen zei Elia tegen heel het volk: Kom naar mij toe. En heel het volk kwam naar hem toe; en hij herstelde het altaar van de HEERE, dat was afgebroken.","31":"En Elia nam twaalf stenen, naar het getal van de stammen van de kinderen van Jakob, tot wie het woord van de HEERE gekomen was: Israël zal uw naam zijn.","32":"En hij bouwde met die stenen het altaar in de Naam van de HEERE; daarna maakte hij een geul rondom het altaar, zo breed als voor twee maten zaaigoed nodig is.","33":"En hij schikte het hout, en verdeelde de stier in stukken, en legde hem op het hout. En hij zei: Vul vier kruiken met water, en giet het over het brandoffer en over het hout.","34":"En hij zei: Doe het voor de tweede keer. En zij deden het voor de tweede keer. Verder zei hij: Doe het voor de derde keer. En zij deden het voor de derde keer.","35":"Zodat het water rondom het altaar liep; ook vulde hij de geul met water.","36":"En het gebeurde, toen men het spijsoffer offerde, dat de profeet Elia naderde en zei: HEERE, God van Abraham, Izak en Israël, laat het vandaag bekend worden, dat U God bent in Israël, en ik Uw knecht; en dat ik al deze dingen naar Uw woord gedaan heb.","37":"Antwoord mij, HEERE, antwoord mij; opdat dit volk erkent dat U, HEERE, die God bent, en dat U hun hart weer terug hebt gebracht.","38":"Toen viel het vuur van de HEERE, en verteerde dat brandoffer, en dat hout, en die stenen, en dat stof, ja, likte dat water op dat in de geul was.","39":"Toen heel het volk dat zag, vielen zij op hun gezicht, en zeiden: De HEERE is God, de HEERE is God!","40":"En Elia zei tegen hen: Grijp de profeten van Baäl, laat niemand van hen ontkomen. En zij grepen hen; en Elia voerde hen af naar de beek Kison, en slachtte hen daar.","41":"Daarna zei Elia tegen Achab: Trek op, eet en drink; want er is een geluid van een overvloedige regen.","42":"Zo trok Achab op om te eten en te drinken; maar Elia ging naar de top van Karmel, en boog zich voorover ter aarde; daarna legde hij zijn gezicht tussen zijn knieën.","43":"En hij zei tegen zijn knecht: Ga nu op, en kijk uit naar de zee. Toen ging hij op, en keek uit, en zei: Er is niets. Toen zei hij: Ga weer terug, zevenmaal.","44":"En het gebeurde bij de zevende keer, dat hij zei: Zie, een kleine wolk, als de hand van een man, komt op vanuit de zee. En hij zei: Ga op, zeg tegen Achab: Span aan, en kom naar beneden, zodat de regen u niet ophoudt.","45":"En het gebeurde ondertussen, dat de hemel zwart werd van wolken en wind; en er kwam een grote regen; en Achab reed weg, en trok naar Jizreël.","46":"En de hand van de HEERE was op Elia, en hij gordde zijn lenden,[2] en liep voor het aangezicht van Achab uit, tot waar men bij Jizreël komt."},"SV":{"1":"En het gebeurde *na* vele dagen, dat het woord des HEEREN geschiedde tot Elia, in het derde jaar, zeggende: Ga heen, vertoon u aan Achab; want Ik zal regen geven op den aardbodem.","2":"En Elia ging heen, om zich aan Achab te vertonen. En de honger was sterk in Samaria.","3":"En Achab had, Obadja, den hofmeester, geroepen; en Obadja was den HEERE zeer vrezende.","4":"Want het geschiedde, als Izebel de profeten des HEEREN uitroeide, dat Obadja honderd profeten nam, en verborg ze bij vijftig man in een spelonk, en onderhield hen met brood en water.","5":"En Achab had gezegd tot Obadja: Trek door het land, tot alle waterfonteinen en tot alle rivieren; misschien zullen wij gras vinden, opdat wij de paarden en de muilezelen in het leven behouden, en niets uitroeien van de beesten.","6":"En zij deelden het land onder zich, dat zij het doortogen; Achab ging bijzonder op een weg, en Obadja ging ook bijzonder op een weg.","7":"Als nu Obadja op den weg was, ziet, zo was hem Elia tegemoet; en hem kennende, zo viel hij op zijn aangezicht, en zeide: Zijt gij mijn heer Elia?","8":"Hij zeide: Ik ben het; ga heen, zeg uw heer: Zie, Elia is *hier*.","9":"Maar hij zeide: Wat heb ik gezondigd, dat gij uw knecht geeft in de hand van Achab, dat hij mij dode?","10":"*Zo* *waarachtig* *als* de HEERE, uw God, leeft, zo er een volk of koninkrijk is, waar mijn heer niet gezonden heeft, om u te zoeken; en als zij zeiden: Hij is hier niet; zo nam hij dat koninkrijk en dat volk een eed af; dat zij u niet hadden gevonden.","11":"En nu zegt gij: Ga heen, zeg uw heer: Zie, Elia is *hier*.","12":"En het mocht geschieden, wanneer ik van u zou weggegaan zijn, dat de Geest des HEEREN u wegnam, ik weet niet waarheen; en ik kwam, om *dat* Achab aan te zeggen, en hij vond u niet, zo zou hij mij doden; ik, uw knecht, nu vrees den HEERE van mijn jonkheid af.","13":"Is mijn heer niet aangezegd, wat ik gedaan heb, als Izebel de profeten des HEEREN doodde? Dat ik van de profeten des HEEREN honderd man heb verborgen, elk vijftig man in een spelonk, en die met brood en water onderhouden heb?","14":"En nu zegt gij: Ga heen, zeg uw heer: Zie, Elia is *hier*, en hij zou mij doodslaan.","15":"En Elia zeide: *Zo* *waarachtig* *als* de HEERE der heirscharen leeft, voor Wiens aangezicht ik sta, ik zal voorzeker mij heden aan hem vertonen!","16":"Toen ging Obadja Achab tegemoet, en zeide het hem aan; en Achab ging Elia tegemoet.","17":"En het geschiedde, als Achab Elia zag, dat Achab tot hem zeide: Zijt gij die beroerder van Israël?","18":"Toen zeide hij: Ik heb Israël niet beroerd, maar gij en uws vaders huis, daarmede, dat gijlieden de geboden des HEEREN verlaten hebt en de Baäls nagevolgd zijt.","19":"Nu dan, zend heen, verzamel tot mij het ganse Israël op den berg Karmel, en de vierhonderd en vijftig profeten van Baäl, en de vierhonderd profeten van het bos, die van de tafel van Izebel eten.","20":"Zo zond Achab onder alle kinderen Israëls, en verzamelde de profeten op den berg Karmel.","21":"Toen naderde Elia tot het ganse volk, en zeide: Hoe lang hinkt gij op twee gedachten? Zo de HEERE God is, volgt Hem na, en zo het Baäl is, volgt hem na! Maar het volk antwoordde hem niet een woord.","22":"Toen zeide Elia tot het volk: Ik ben alleen een profeet des HEEREN overgebleven, en de profeten van Baäl zijn vierhonderd en vijftig mannen.","23":"Dat men ons dan twee varren geve, en dat zij voor zich den enen var kiezen, en denzelven in stukken delen, en op het hout leggen, maar geen vuur daaraan leggen; en ik zal den anderen var bereiden, en op het hout leggen, en geen vuur daaraan leggen.","24":"Roept gij daarna den naam van uw god aan, en ik zal den Naam des HEEREN aanroepen; en de God, Die door vuur antwoorden zal, Die zal God zijn. En het ganse volk antwoordde en zeide: Dat woord is goed.","25":"En Elia zeide tot de profeten van Baäl: Kiest gijlieden voor u den enen var, en bereidt gij *hem* eerst, want gij zijt velen; en roept den naam uws gods aan, en legt geen vuur daaraan.","26":"En zij namen den var, dien hij hun gegeven had, en bereidden *hem*, en riepen den naam van Baäl aan, van den morgen tot op den middag, zeggende: O Baäl, antwoord ons! Maar er was geen stem en geen antwoorder. En zij sprongen tegen het altaar, dat men gemaakt had.","27":"En het geschiedde op den middag, dat Elia met hen spotte, en zeide: Roept met luider stem, want hij is een god; omdat hij in gepeins is, of omdat hij wat te doen heeft, of omdat hij een reize heeft; misschien slaapt hij en zal wakker worden.","28":"En zij riepen met luider stem, en zij sneden zichzelven messen en met priemen, naar hun wijze, totdat zij bloed over zich uitstortten.","29":"Het geschiedde nu, als de middag voorbij was, dat zij profeteerden totdat men het spijsoffer zou offeren; maar er was geen stem, en geen antwoorder, en geen opmerking.","30":"Toen zeide Elia tot het ganse volk: Nadert tot mij. En al het volk naderde tot hem; en hij heelde het altaar des HEEREN, dat verbroken was.","31":"En Elia nam twaalf stenen, naar het getal der stammen van de kinderen Jakobs, tot welke het woord des HEEREN geschied was, zeggende: Israël zal uw naam zijn.","32":"En hij bouwde met die stenen het altaar in den Naam des HEEREN; daarna maakte hij een groeve rondom het altaar, naar de wijdte van twee maten zaads.","33":"En hij schikte het hout, en deelde den var in stukken, en leide *hem* op het hout. En hij zeide: Vult vier kruiken met water, en giet het op het brandoffer en op het hout.","34":"En hij zeide: Doet het ten tweeden male. En zij deden het ten tweeden male. Voorts zeide hij: Doet het ten derden male. En zij deden het ten derden male;","35":"Dat het water rondom het altaar liep; daartoe vulde hij ook de groeve met water.","36":"Het geschiedde nu, als men het spijsoffer offerde, dat de profeet Elia naderde, en zeide: HEERE, God van Abraham, Izak en Israël, dat het heden bekend worde, dat Gij God in Israël zijt, en ik Uw knecht; en dat ik al deze dingen naar Uw woord gedaan heb.","37":"Antwoord mij, HEERE, antwoord mij; opdat dit volk erkenne, dat Gij, o HEERE, die God zijt, en dat Gij hun hart achterwaarts omgewend hebt.","38":"Toen viel het vuur des HEEREN, en verteerde dat brandoffer, en dat hout, en die stenen, en dat stof, ja, lekte dat water op, hetwelk in de groeve was.","39":"Als nu het ganse volk dat zag, zo vielen zij op hun aangezichten, en zeiden: De HEERE is God, de HEERE is God!","40":"En Elia zeide tot hen: Grijpt de profeten van Baäl, dat niemand van hen ontkome. En zij grepen ze; en Elia voerde hen af naar de beek Kison, en slachtte hen aldaar.","41":"Daarna zeide Elia tot Achab: Trek op, eet en drink; want er is een geruis van een overvloedigen regen.","42":"Alzo toog Achab op, om te eten en te drinken; maar Elia ging op naar de hoogte van Karmel, en breidde zich uit voorwaarts ter aarde; daarna leide hij zijn aangezicht tussen zijn knieën.","43":"En hij zeide tot zijn jongen: Ga nu op, en zie uit naar de zee. Toen ging hij op, en zag uit, en zeide: Er is niets. Toen zeide hij: Ga weder henen, zevenmaal.","44":"En het geschiedde op de zevende maal, dat hij zeide: Zie, een kleine wolk, als eens mans hand, gaat op van de zee. En hij zeide: Ga op, zeg tot Achab: Span aan, en kom af, dat u de regen niet ophoude.","45":"En het geschiedde ondertussen, dat de hemel van wolken en wind zwart werd; en er kwam een grote regen; en Achab reed weg, en toog naar Jizreël.","46":"En de hand des HEEREN was over Elia, en hij gordde zijn lenden, en liep voor het aangezicht van Achab henen, tot daar men te Jizreël komt."},"KJV":{"1":"And it came to pass after many days, that the word of the LORD came to Elijah in the third year, saying, Go, shew thyself unto Ahab; and I will send rain upon the earth.","2":"And Elijah went to shew himself unto Ahab. And there was a sore famine in Samaria.","3":"And Ahab called Obadiah, which was the governor of his house. (Now Obadiah feared the LORD greatly:","4":"For it was so, when Jezebel cut off the prophets of the LORD, that Obadiah took an hundred prophets, and hid them by fifty in a cave, and fed them with bread and water.)","5":"And Ahab said unto Obadiah, Go into the land, unto all fountains of water, and unto all brooks: peradventure we may find grass to save the horses and mules alive, that we lose not all the beasts.","6":"So they divided the land between them to pass throughout it: Ahab went one way by himself, and Obadiah went another way by himself.","7":"And as Obadiah was in the way, behold, Elijah met him: and he knew him, and fell on his face, and said, Art thou that my lord Elijah?","8":"And he answered him, I am: go, tell thy lord, Behold, Elijah is here.","9":"And he said, What have I sinned, that thou wouldest deliver thy servant into the hand of Ahab, to slay me?","10":"As the LORD thy God liveth, there is no nation or kingdom, whither my lord hath not sent to seek thee: and when they said, He is not there; he took an oath of the kingdom and nation, that they found thee not.","11":"And now thou sayest, Go, tell thy lord, Behold, Elijah is here.","12":"And it shall come to pass, as soon as I am gone from thee, that the Spirit of the LORD shall carry thee whither I know not; and so when I come and tell Ahab, and he cannot find thee, he shall slay me: but I thy servant fear the LORD from my youth.","13":"Was it not told my lord what I did when Jezebel slew the prophets of the LORD, how I hid an hundred men of the LORD'S prophets by fifty in a cave, and fed them with bread and water?","14":"And now thou sayest, Go, tell thy lord, Behold, Elijah is here: and he shall slay me.","15":"And Elijah said, As the LORD of hosts liveth, before whom I stand, I will surely shew myself unto him to day.","16":"So Obadiah went to meet Ahab, and told him: and Ahab went to meet Elijah.","17":"And it came to pass, when Ahab saw Elijah, that Ahab said unto him, Art thou he that troubleth Israel?","18":"And he answered, I have not troubled Israel; but thou, and thy father's house, in that ye have forsaken the commandments of the LORD, and thou hast followed Baalim.","19":"Now therefore send, and gather to me all Israel unto mount Carmel, and the prophets of Baal four hundred and fifty, and the prophets of the groves four hundred, which eat at Jezebel's table.","20":"So Ahab sent unto all the children of Israel, and gathered ➔ the prophets together unto mount Carmel.","21":"And Elijah came unto all the people, and said, How long halt ye between two opinions? if the LORD be God, follow him: but if Baal, then follow him. And the people answered him not a word.","22":"Then said Elijah unto the people, I, even I only, remain a prophet of the LORD; but Baal's prophets are four hundred and fifty men.","23":"Let them therefore give us two bullocks; and let them choose one bullock for themselves, and cut it in pieces, and lay it on wood, and put no fire under: and I will dress the other bullock, and lay it on wood, and put no fire under:","24":"And call ye on the name of your gods, and I will call on the name of the LORD: and the God that answereth by fire, let him be God. And all the people answered and said, It is well spoken.","25":"And Elijah said unto the prophets of Baal, Choose you one bullock for yourselves, and dress it first; for ye are many; and call on the name of your gods, but put no fire under.","26":"And they took the bullock which was given them, and they dressed it, and called on the name of Baal from morning even until noon, saying, O Baal, hear us. But there was no voice, nor any that answered. And they leaped upon the altar which was made.","27":"And it came to pass at noon, that Elijah mocked them, and said, Cry aloud: for he is a god; either he is talking, or he is pursuing, or he is in a journey, or peradventure he sleepeth, and must be awaked.","28":"And they cried aloud, and cut themselves after their manner with knives and lancets, till the blood gushed out upon them.","29":"And it came to pass, when midday was past, and they prophesied until the time of the offering of the evening sacrifice, that there was neither voice, nor any to answer, nor any that regarded.","30":"And Elijah said unto all the people, Come near unto me. And all the people came near unto him. And he repaired the altar of the LORD that was broken down.","31":"And Elijah took twelve stones, according to the number of the tribes of the sons of Jacob, unto whom the word of the LORD came, saying, Israel shall be thy name:","32":"And with the stones he built an altar in the name of the LORD: and he made a trench about the altar, as great as would contain two measures of seed.","33":"And he put ➔ the wood in order, and cut the bullock in pieces, and laid him on the wood, and said, Fill four barrels with water, and pour it on the burnt sacrifice, and on the wood.","34":"And he said, Do it the second time. And they did it the second time. And he said, Do it the third time. And they did it the third time.","35":"And the water ran round about the altar; and he filled the trench also with water.","36":"And it came to pass at the time of the offering of the evening sacrifice, that Elijah the prophet came near, and said, LORD God of Abraham, Isaac, and of Israel, let it be known this day that thou art God in Israel, and that I am thy servant, and that I have done all these things at thy word.","37":"Hear me, O LORD, hear me, that this people may know that thou art the LORD God, and that thou hast turned ➔ their heart back again.","38":"Then the fire of the LORD fell, and consumed the burnt sacrifice, and the wood, and the stones, and the dust, and licked up the water that was in the trench.","39":"And when all the people saw it, they fell on their faces: and they said, The LORD, he is the God; the LORD, he is the God.","40":"And Elijah said unto them, Take the prophets of Baal; let not one of them escape. And they took them: and Elijah brought them down to the brook Kishon, and slew them there.","41":"And Elijah said unto Ahab, Get thee up, eat and drink; for there is a sound of abundance of rain.","42":"So Ahab went up to eat and to drink. And Elijah went up to the top of Carmel; and he cast himself down upon the earth, and put his face between his knees,","43":"And said to his servant, Go up now, look toward the sea. And he went up, and looked, and said, There is nothing. And he said, Go again seven times.","44":"And it came to pass at the seventh time, that he said, Behold, there ariseth a little cloud out of the sea, like a man's hand. And he said, Go up, say unto Ahab, Prepare thy chariot, and get thee down, that the rain stop thee not.","45":"And it came to pass in the mean while, that the heaven was black with clouds and wind, and there was a great rain. And Ahab rode, and went to Jezreel.","46":"And the hand of the LORD was on Elijah; and he girded up his loins, and ran before Ahab to the entrance of Jezreel."}},"tsk":{"1":[{"kopje":"na veel dagen","refs":["Luk 4:25","Jak 5:17","Openb 11:2","Openb 11:6"]},{"kopje":"in het derde jaar","refs":["1 Kon 17:1","1 Kon 17:7","1 Kon 17:15","Luk 4:25","Jak 5:17"]},{"kopje":"Ga heen","refs":["1 Kon 18:2"]},{"kopje":"Ik zal regen geven","refs":["Lev 26:4","Deut 28:12","Ps 65:10-14","Jes 5:6","Jer 10:13","Jer 14:22","J data-code=\"H3947\">took</span> an <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets,</span> and <span class=\"wl wl-kjv\" data-code=\"H2244\">hid</span> them by <span class=\"wl wl-kjv\" data-code=\"H376\">fifty</span> in a <span class=\"wl wl-kjv\" data-code=\"H4631\">cave,</span> and <span class=\"wl wl-kjv\" data-code=\"H3557\">fed</span> them with <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> and <span class=\"wl wl-kjv\" data-code=\"H4325\">water.)</span>","5":"And <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H5662\">Obadiah,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Go</span> into the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> unto all <span class=\"wl wl-kjv\" data-code=\"H4599\">fountains</span> of <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and unto all <span class=\"wl wl-kjv\" data-code=\"H5158\">brooks:</span> <span class=\"wl wl-kjv\" data-code=\"H194\">peradventure</span> we may <span class=\"wl wl-kjv\" data-code=\"H4672\">find</span> <span class=\"wl wl-kjv\" data-code=\"H2682\">grass</span> to <span class=\"wl wl-kjv\" data-code=\"H2421\">save</span> the <span class=\"wl wl-kjv\" data-code=\"H5483\">horses</span> and <span class=\"wl wl-kjv\" data-code=\"H6505\">mules</span> <span class=\"wl wl-kjv\" data-code=\"H2421\">alive,</span> that we <span class=\"wl wl-kjv\" data-code=\"H3772\">lose</span> not all the <span class=\"wl wl-kjv\" data-code=\"H929\">beasts.</span>","6":"So they <span class=\"wl wl-kjv\" data-code=\"H2505\">divided</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> between them to pass <span class=\"wl wl-kjv\" data-code=\"H5674\">throughout</span> it: <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> by himself, and <span class=\"wl wl-kjv\" data-code=\"H5662\">Obadiah</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> <span class=\"wl wl-kjv\" data-code=\"H259\">another</span> <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> by himself.","7":"And as <span class=\"wl wl-kjv\" data-code=\"H5662\">Obadiah</span> was in the <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> behold, <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah</span> <span class=\"wl wl-kjv\" data-code=\"H7125\">met</span> him: and he <span class=\"wl wl-kjv\" data-code=\"H5234\">knew</span> him, and <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> on his <span class=\"wl wl-kjv\" data-code=\"H6440\">face,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Art thou that my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah?</span>","8":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">answered</span> him, I am: <span class=\"wl wl-kjv\" data-code=\"H3212\">go,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">tell</span> thy <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> Behold, <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah</span> is here.","9":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> What have I <span class=\"wl wl-kjv\" data-code=\"H2398\">sinned,</span> that thou wouldest <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab,</span> to <span class=\"wl wl-kjv\" data-code=\"H4191\">slay</span> me?","10":"As the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> there is <span class=\"wl wl-kjv\" data-code=\"H3426\">no</span> <span class=\"wl wl-kjv\" data-code=\"H1471\">nation</span> or <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdom,</span> <span class=\"wl wl-kjv\" data-code=\"H834\">whither</span> my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> hath not <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> to <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> thee: and when they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> He is not there; he took an <span class=\"wl wl-kjv\" data-code=\"H7650\">oath</span> of the <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdom</span> and <span class=\"wl wl-kjv\" data-code=\"H1471\">nation,</span> that they <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> thee not.","11":"And now thou <span class=\"wl wl-kjv\" data-code=\"H559\">sayest,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Go,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">tell</span> thy <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> Behold, <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah</span> is here.","12":"And it shall come to pass, as soon as I am <span class=\"wl wl-kjv\" data-code=\"H3212\">gone</span> from thee, that the <span class=\"wl wl-kjv\" data-code=\"H7307\">Spirit</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H5375\">carry</span> thee whither I <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> not; and so when I <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> and <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab,</span> and he cannot <span class=\"wl wl-kjv\" data-code=\"H4672\">find</span> thee, he shall <span class=\"wl wl-kjv\" data-code=\"H2026\">slay</span> me: but I thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H3372\">fear</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> from my <span class=\"wl wl-kjv\" data-code=\"H5271\">youth.</span>","13":"Was it not <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> what I <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> when <span class=\"wl wl-kjv\" data-code=\"H348\">Jezebel</span> <span class=\"wl wl-kjv\" data-code=\"H2026\">slew</span> the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> how I <span class=\"wl wl-kjv\" data-code=\"H2244\">hid</span> an <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S</span> <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> by <span class=\"wl wl-kjv\" data-code=\"H2572\">fifty</span> in a <span class=\"wl wl-kjv\" data-code=\"H4631\">cave,</span> and <span class=\"wl wl-kjv\" data-code=\"H3557\">fed</span> them with <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> and <span class=\"wl wl-kjv\" data-code=\"H4325\">water?</span>","14":"And now thou <span class=\"wl wl-kjv\" data-code=\"H559\">sayest,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Go,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">tell</span> thy <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> Behold, <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah</span> is here: and he shall <span class=\"wl wl-kjv\" data-code=\"H2026\">slay</span> me.","15":"And <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> As the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> whom I <span class=\"wl wl-kjv\" data-code=\"H5975\">stand,</span> I will surely <span class=\"wl wl-kjv\" data-code=\"H7200\">shew</span> myself unto him to <span class=\"wl wl-kjv\" data-code=\"H3117\">day.</span>","16":"So <span class=\"wl wl-kjv\" data-code=\"H5662\">Obadiah</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab,</span> and <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> him: and <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah.</span>","17":"And it came to pass, when <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah,</span> that <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Art thou he that <span class=\"wl wl-kjv\" data-code=\"H5916\">troubleth</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel?</span>","18":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> I have not <span class=\"wl wl-kjv\" data-code=\"H5916\">troubled</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> but thou, and thy <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> in that ye have <span class=\"wl wl-kjv\" data-code=\"H5800\">forsaken</span> the <span class=\"wl wl-kjv\" data-code=\"H4687\">commandments</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and thou hast <span class=\"wl wl-kjv\" data-code=\"H3212\">followed</span> <span class=\"wl wl-kjv\" data-code=\"H1168\">Baalim.</span>","19":"Now therefore <span class=\"wl wl-kjv\" data-code=\"H7971\">send,</span> and <span class=\"wl wl-kjv\" data-code=\"H6908\">gather</span> to me all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> unto <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H3760\">Carmel,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> of <span class=\"wl wl-kjv\" data-code=\"H1168\">Baal</span> <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> and <span class=\"wl wl-kjv\" data-code=\"H2572\">fifty,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> of the <span class=\"wl wl-kjv\" data-code=\"H842\">groves</span> <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred,</span> which <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> at <span class=\"wl wl-kjv\" data-code=\"H348\">Jezebel's</span> <span class=\"wl wl-kjv\" data-code=\"H7979\">table.</span>","20":"So <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> unto all the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and <span class=\"wl wl-kjv\" data-code=\"H6908\">gathered</span> ➔ the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> <span class=\"wl wl-kjv\" data-code=\"H6908\">together</span> unto <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H3760\">Carmel.</span>","21":"And <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah</span> <span class=\"wl wl-kjv\" data-code=\"H5066\">came</span> unto all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> How <span class=\"wl wl-kjv\" data-code=\"H5921\">long</span> <span class=\"wl wl-kjv\" data-code=\"H6452\">halt</span> ye between <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H5587\">opinions?</span> if the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> be <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> follow him: but if <span class=\"wl wl-kjv\" data-code=\"H1168\">Baal,</span> then <span class=\"wl wl-kjv\" data-code=\"H3212\">follow</span> him. And the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> him not a <span class=\"wl wl-kjv\" data-code=\"H1697\">word.</span>","22":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> I, even I only, <span class=\"wl wl-kjv\" data-code=\"H3498\">remain</span> a <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> but <span class=\"wl wl-kjv\" data-code=\"H1168\">Baal's</span> <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> are <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> and <span class=\"wl wl-kjv\" data-code=\"H2572\">fifty</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men.</span>","23":"Let them therefore <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> us <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H6499\">bullocks;</span> and let them <span class=\"wl wl-kjv\" data-code=\"H977\">choose</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H6499\">bullock</span> for themselves, and cut it in <span class=\"wl wl-kjv\" data-code=\"H5408\">pieces,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">lay</span> it on <span class=\"wl wl-kjv\" data-code=\"H6086\">wood,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> no <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> under: and I will <span class=\"wl wl-kjv\" data-code=\"H6213\">dress</span> the <span class=\"wl wl-kjv\" data-code=\"H259\">other</span> <span class=\"wl wl-kjv\" data-code=\"H6499\">bullock,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">lay</span> it on <span class=\"wl wl-kjv\" data-code=\"H6086\">wood,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> no <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> under:","24":"And <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> ye on the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of your <span class=\"wl wl-kjv\" data-code=\"H430\">gods,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> on the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> and the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> that <span class=\"wl wl-kjv\" data-code=\"H6030\">answereth</span> by <span class=\"wl wl-kjv\" data-code=\"H784\">fire,</span> let him be <span class=\"wl wl-kjv\" data-code=\"H430\">God.</span> And all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> It is <span class=\"wl wl-kjv\" data-code=\"H2896\">well</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">spoken.</span>","25":"And <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> of <span class=\"wl wl-kjv\" data-code=\"H1168\">Baal,</span> <span class=\"wl wl-kjv\" data-code=\"H977\">Choose</span> you <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H6499\">bullock</span> for yourselves, and <span class=\"wl wl-kjv\" data-code=\"H6213\">dress</span> it <span class=\"wl wl-kjv\" data-code=\"H7223\">first;</span> for ye are <span class=\"wl wl-kjv\" data-code=\"H7227\">many;</span> and <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> on the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of your <span class=\"wl wl-kjv\" data-code=\"H430\">gods,</span> but <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> no <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> under.","26":"And they <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> the <span class=\"wl wl-kjv\" data-code=\"H6499\">bullock</span> which was <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> them, and they <span class=\"wl wl-kjv\" data-code=\"H6213\">dressed</span> it, and <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> on the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of <span class=\"wl wl-kjv\" data-code=\"H1168\">Baal</span> from <span class=\"wl wl-kjv\" data-code=\"H1242\">morning</span> even until <span class=\"wl wl-kjv\" data-code=\"H6672\">noon,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> O <span class=\"wl wl-kjv\" data-code=\"H1168\">Baal,</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">hear</span> us. But there was <span class=\"wl wl-kjv\" data-code=\"H369\">no</span> <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> nor any that <span class=\"wl wl-kjv\" data-code=\"H6030\">answered.</span> And they <span class=\"wl wl-kjv\" data-code=\"H6452\">leaped</span> upon the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> which was <span class=\"wl wl-kjv\" data-code=\"H6213\">made.</span>","27":"And it came to pass at <span class=\"wl wl-kjv\" data-code=\"H6672\">noon,</span> that <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah</span> <span class=\"wl wl-kjv\" data-code=\"H2048\">mocked</span> them, and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">Cry</span> <span class=\"wl wl-kjv\" data-code=\"H1419\">aloud:</span> for he is a <span class=\"wl wl-kjv\" data-code=\"H430\">god;</span> either he is <span class=\"wl wl-kjv\" data-code=\"H7879\">talking,</span> or he is <span class=\"wl wl-kjv\" data-code=\"H7873\">pursuing,</span> or he is in a <span class=\"wl wl-kjv\" data-code=\"H1870\">journey,</span> or <span class=\"wl wl-kjv\" data-code=\"H194\">peradventure</span> he <span class=\"wl wl-kjv\" data-code=\"H3463\">sleepeth,</span> and must be <span class=\"wl wl-kjv\" data-code=\"H3364\">awaked.</span>","28":"And they <span class=\"wl wl-kjv\" data-code=\"H7121\">cried</span> <span class=\"wl wl-kjv\" data-code=\"H6963\">aloud,</span> and <span class=\"wl wl-kjv\" data-code=\"H1413\">cut</span> themselves after their <span class=\"wl wl-kjv\" data-code=\"H4941\">manner</span> with <span class=\"wl wl-kjv\" data-code=\"H2719\">knives</span> and <span class=\"wl wl-kjv\" data-code=\"H7420\">lancets,</span> till the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> gushed <span class=\"wl wl-kjv\" data-code=\"H8210\">out</span> upon them.","29":"And it came to pass, when <span class=\"wl wl-kjv\" data-code=\"H6672\">midday</span> was <span class=\"wl wl-kjv\" data-code=\"H5674\">past,</span> and they <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesied</span> until the time of the <span class=\"wl wl-kjv\" data-code=\"H5927\">offering</span> of the evening <span class=\"wl wl-kjv\" data-code=\"H4503\">sacrifice,</span> that there was neither <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> nor any to <span class=\"wl wl-kjv\" data-code=\"H6030\">answer,</span> nor any that <span class=\"wl wl-kjv\" data-code=\"H7182\">regarded.</span>","30":"And <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> Come <span class=\"wl wl-kjv\" data-code=\"H5066\">near</span> unto me. And all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> came <span class=\"wl wl-kjv\" data-code=\"H5066\">near</span> unto him. And he <span class=\"wl wl-kjv\" data-code=\"H7495\">repaired</span> the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> that was broken <span class=\"wl wl-kjv\" data-code=\"H2040\">down.</span>","31":"And <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">twelve</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stones,</span> according to the <span class=\"wl wl-kjv\" data-code=\"H4557\">number</span> of the <span class=\"wl wl-kjv\" data-code=\"H7626\">tribes</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> unto whom the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> came, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> shall be thy <span class=\"wl wl-kjv\" data-code=\"H8034\">name:</span>","32":"And with the <span class=\"wl wl-kjv\" data-code=\"H68\">stones</span> he <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> an <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> in the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> and he <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> a <span class=\"wl wl-kjv\" data-code=\"H8585\">trench</span> <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar,</span> as great as would <span class=\"wl wl-kjv\" data-code=\"H1004\">contain</span> two <span class=\"wl wl-kjv\" data-code=\"H5429\">measures</span> of <span class=\"wl wl-kjv\" data-code=\"H2233\">seed.</span>","33":"And he <span class=\"wl wl-kjv\" data-code=\"H6186\">put</span> ➔ the <span class=\"wl wl-kjv\" data-code=\"H6086\">wood</span> in <span class=\"wl wl-kjv\" data-code=\"H6186\">order,</span> and <span class=\"wl wl-kjv\" data-code=\"H5408\">cut</span> the <span class=\"wl wl-kjv\" data-code=\"H6499\">bullock</span> in pieces, and <span class=\"wl wl-kjv\" data-code=\"H7760\">laid</span> him on the <span class=\"wl wl-kjv\" data-code=\"H6086\">wood,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H4390\">Fill</span> <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H3537\">barrels</span> with <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and <span class=\"wl wl-kjv\" data-code=\"H3332\">pour</span> it on the burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">sacrifice,</span> and on the <span class=\"wl wl-kjv\" data-code=\"H6086\">wood.</span>","34":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Do it the second <span class=\"wl wl-kjv\" data-code=\"H8138\">time.</span> And they did it the second <span class=\"wl wl-kjv\" data-code=\"H8138\">time.</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Do it the third <span class=\"wl wl-kjv\" data-code=\"H8027\">time.</span> And they did it the third <span class=\"wl wl-kjv\" data-code=\"H8027\">time.</span>","35":"And the <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">ran</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar;</span> and he <span class=\"wl wl-kjv\" data-code=\"H4390\">filled</span> the <span class=\"wl wl-kjv\" data-code=\"H8585\">trench</span> also with <span class=\"wl wl-kjv\" data-code=\"H4325\">water.</span>","36":"And it came to pass at the time of the <span class=\"wl wl-kjv\" data-code=\"H5927\">offering</span> of the evening <span class=\"wl wl-kjv\" data-code=\"H4503\">sacrifice,</span> that <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah</span> the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> came <span class=\"wl wl-kjv\" data-code=\"H5066\">near,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham,</span> <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac,</span> and of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> let it be <span class=\"wl wl-kjv\" data-code=\"H3045\">known</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that thou art <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> in <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and that I am thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant,</span> and that I have <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> all these things at thy <span class=\"wl wl-kjv\" data-code=\"H1697\">word.</span>","37":"<span class=\"wl wl-kjv\" data-code=\"H6030\">Hear</span> me, O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">hear</span> me, that this <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> may <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that thou art the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and that thou hast <span class=\"wl wl-kjv\" data-code=\"H5437\">turned</span> ➔ their <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> <span class=\"wl wl-kjv\" data-code=\"H5437\">back</span> <span class=\"wl wl-kjv\" data-code=\"H322\">again.</span>","38":"Then the <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5307\">fell,</span> and <span class=\"wl wl-kjv\" data-code=\"H398\">consumed</span> the burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">sacrifice,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6086\">wood,</span> and the <span class=\"wl wl-kjv\" data-code=\"H68\">stones,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6083\">dust,</span> and licked <span class=\"wl wl-kjv\" data-code=\"H3897\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> that was in the <span class=\"wl wl-kjv\" data-code=\"H8585\">trench.</span>","39":"And when all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> it, they <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> on their <span class=\"wl wl-kjv\" data-code=\"H6440\">faces:</span> and they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> he is the <span class=\"wl wl-kjv\" data-code=\"H430\">God;</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> he is the <span class=\"wl wl-kjv\" data-code=\"H430\">God.</span>","40":"And <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, <span class=\"wl wl-kjv\" data-code=\"H8610\">Take</span> the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> of <span class=\"wl wl-kjv\" data-code=\"H1168\">Baal;</span> let not <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> of them <span class=\"wl wl-kjv\" data-code=\"H4422\">escape.</span> And they <span class=\"wl wl-kjv\" data-code=\"H8610\">took</span> them: and <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah</span> brought them <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to the <span class=\"wl wl-kjv\" data-code=\"H5158\">brook</span> <span class=\"wl wl-kjv\" data-code=\"H7028\">Kishon,</span> and <span class=\"wl wl-kjv\" data-code=\"H7819\">slew</span> them there.","41":"And <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab,</span> Get thee <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> and <span class=\"wl wl-kjv\" data-code=\"H8354\">drink;</span> for there is a <span class=\"wl wl-kjv\" data-code=\"H6963\">sound</span> of <span class=\"wl wl-kjv\" data-code=\"H1995\">abundance</span> of <span class=\"wl wl-kjv\" data-code=\"H1653\">rain.</span>","42":"So <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> and to <span class=\"wl wl-kjv\" data-code=\"H8354\">drink.</span> And <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah</span> went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to the <span class=\"wl wl-kjv\" data-code=\"H7218\">top</span> of <span class=\"wl wl-kjv\" data-code=\"H3760\">Carmel;</span> and he cast himself <span class=\"wl wl-kjv\" data-code=\"H1457\">down</span> upon the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> his <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> between his <span class=\"wl wl-kjv\" data-code=\"H1290\">knees,</span>","43":"And <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to his <span class=\"wl wl-kjv\" data-code=\"H5288\">servant,</span> Go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> now, <span class=\"wl wl-kjv\" data-code=\"H5027\">look</span> <span class=\"wl wl-kjv\" data-code=\"H1870\">toward</span> the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea.</span> And he went <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> and <span class=\"wl wl-kjv\" data-code=\"H5027\">looked,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> There is <span class=\"wl wl-kjv\" data-code=\"H3972\">nothing.</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Go <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H6471\">times.</span>","44":"And it came to pass at the seventh <span class=\"wl wl-kjv\" data-code=\"H7637\">time,</span> that he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Behold, there <span class=\"wl wl-kjv\" data-code=\"H5927\">ariseth</span> a <span class=\"wl wl-kjv\" data-code=\"H6996\">little</span> <span class=\"wl wl-kjv\" data-code=\"H5645\">cloud</span> out of the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea,</span> like a <span class=\"wl wl-kjv\" data-code=\"H376\">man's</span> <span class=\"wl wl-kjv\" data-code=\"H3709\">hand.</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Go <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab,</span> <span class=\"wl wl-kjv\" data-code=\"H631\">Prepare</span> thy chariot, and get thee <span class=\"wl wl-kjv\" data-code=\"H3381\">down,</span> that the <span class=\"wl wl-kjv\" data-code=\"H1653\">rain</span> <span class=\"wl wl-kjv\" data-code=\"H6113\">stop</span> thee not.","45":"And it came to pass in the mean <span class=\"wl wl-kjv\" data-code=\"H3541\">while,</span> that the <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> was <span class=\"wl wl-kjv\" data-code=\"H6937\">black</span> with <span class=\"wl wl-kjv\" data-code=\"H5645\">clouds</span> and <span class=\"wl wl-kjv\" data-code=\"H7307\">wind,</span> and there was a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H1653\">rain.</span> And <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> <span class=\"wl wl-kjv\" data-code=\"H7392\">rode,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> to <span class=\"wl wl-kjv\" data-code=\"H3157\">Jezreel.</span>","46":"And the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was on <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah;</span> and he girded <span class=\"wl wl-kjv\" data-code=\"H8151\">up</span> his <span class=\"wl wl-kjv\" data-code=\"H4975\">loins,</span> and <span class=\"wl wl-kjv\" data-code=\"H7323\">ran</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> to the <span class=\"wl wl-kjv\" data-code=\"H935\">entrance</span> of <span class=\"wl wl-kjv\" data-code=\"H3157\">Jezreel.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"vele dagen,","tekst":"Te weten, drie jaren en zes maanden; Luk 4:25, en Jam 5:17."},{"catchword":"in het derde jaar,","tekst":"Te weten, nadat hij bij de weduwe in Sarepta was geherbergd geweest. Zie 1Ki 17:7."},{"catchword":"vertoon u aan Achab;","tekst":"Om hem van mijnentwege den regen te beloven en te gebieden, dat hij de priesters van Baäl op den berg Karmel doe vergaderen. Zie onder, vs.19 en de volgende."}],"2":[{"catchword":"in Samaria","tekst":"Versta dit, niet alleen van de stad Samaria, maar van het ganse koninkrijk Israëls."}],"3":[{"catchword":"Obadja,","tekst":"Hebreeuws, Obadjahu; die te onderscheiden is van anderen, de dezen naam gehad hebben, 1Ch 27:19, en 2Ch 34:12, en van den profeet Obadja, Oba 1:1, tenware hij dezelfde geweest ware, gelijk enigen gemeend hebben."},{"catchword":"den hofmeester,","tekst":"Hebreeuws, die over zijn huis was; dat is, zijn hofmeester. Zie boven, 1Ki 4:6, en 1Ki 16:9."}],"4":[{"catchword":"bij vijftig man","tekst":"Hebreeuws, vijftig man in een spelonk; te weten, en vijftig in een andere, dat is, bij, met, of elke vijftig samen."},{"catchword":"met brood en water","tekst":"Dat is, met spijs en drank. Zie boven, 1Ki 13:8."}],"5":[{"catchword":"gras vinden,","tekst":"Het Hebreeuwse woord betekent allerlei kruid, hetwelk den beesten tot voeder dient, groeiende in onbebouwde plaatsen, en dat met de zeisen afgemaaid en onder het hooi gerekend wordt. Vergelijk Job 8:12, en Job 40:10; Psa 104:14, en Psa 129:6, en Psa 147:8."},{"catchword":"niets uitroeien","tekst":"Te weten, mits die door onachtzaamheid van voeder onverzorgd te laten."}],"7":[{"catchword":"hem Elia tegemoet;","tekst":"Hebreeuws, in zijn ontmoeting."},{"catchword":"viel hij","tekst":"Te weten, om hem burgerlijke eer te bewijzen, naar de manier des lands. Zie Gen 18:2."}],"9":[{"catchword":"Wat heb ik","tekst":"Hij wil zeggen dat Elia, hem bevelende hetgeen in vs.8 vermeld is, hem niets goeds scheen te gunnen, alsof hij zich ergens in misdaan had; want hij kon dat bevel niet wel volbrengen, zonder zijn leven in groot gevaar bij Achab te stellen. De reden hiervan verhaald hij onder, vs.12."}],"10":[{"catchword":"zoeken;","tekst":"Voeg hierbij de straf, die in het eedzweren van de Hebreën verzwegen wordt, als: God doe mij dit of dat, enz. Zie Gen 14:23."},{"catchword":"dat koninkrijk","tekst":"Achab had niet alleen in zijn land mannen uitgezonden, om Elia te zoeken, maar ook verzocht aan enige naburige koninkrijken en volken, die met hem in vriendschap stonden, hetzelfde onder hun gebied te willen doen; welke toen zij daarna zeiden, dat zij hem niet hadden kunnen vinden, begeerde hij dat zij de waarheid van hun zeggen met een eed bevestigen zouden."}],"12":[{"catchword":"Geest des HEEREN","tekst":"Versta dit van den Heiligen Geest, die dit doen kon door zijn goddelijke kracht, of door middelen, naar zijn welgevallen."},{"catchword":"u wegnam,","tekst":"Dat dit geschieden kon en somtijds geschied is, kan men afnemen uit 2Ki 2:16; Act 8:39."},{"catchword":"dat Achab","tekst":"Te weten, dat gij hier tegenwoordig zijt, en bereid om met hem te spreken."},{"catchword":"mij doden;","tekst":"Te weten, als een die hem door leugentaal zou bedrogen en bespot hebben."},{"catchword":"knecht,","tekst":"Dat is, ik die tot uw dienst genegen en bereid ben; alzo in vs.13. Vergelijk boven, 1Ki 1:51."}],"13":[{"catchword":"elk vijftig man","tekst":"Hebreeuws, een vijftig een vijftig man; dat is, in een spelonk vijftig, en in een andere vijftig; of elke vijftig in een spelonk. Zie Gen 7:2."}],"15":[{"catchword":"de HEERE","tekst":"Versta, door de heirscharen, alle schepselen, hemelse en aardse, zienlijke en onzienlijke, redelijke en redeloze, levende en levenloze. De redenen om welke zij heiren genoemd worden, zie Gen 2:1. Dezer aller opperste Heere is God; niet alleen, omdat Hij hen allen geschapen heeft en nog onderhoudt, zodat zij eigenlijk hem alleen toebehoren, maar ook omdat Hij hen zo regeert, dat zij hem steeds in het uitvoeren van zijn heiligen wil in grote menigte ten dienste staan; en werd deze naam Gode dikwijls toegeschreven gelijk 1Sa 1:3, en 1Sa 4:4; 2Sa 5:10; Psa 24:10; Isa 1:9, enz."},{"catchword":"voor Wiens","tekst":"Alzo boven, 1Ki 17:1. Zie Deu 10:8."},{"catchword":"ik zal voorzeker","tekst":"Dat is, zo waar is het dat ik heden voor Achab zal verschijnen, als het waarachtig is dat de Heere leeft."}],"16":[{"catchword":"zeide het hem","tekst":"Te weten, dat Elia kwam en begeerde voor hem te verschijnen."},{"catchword":"ging Elia tegemoet","tekst":"Niet om hem met vriendelijke eerbieding, maar met smadige scheldwoorden te onthalen, en te beschuldigen over de langdurige droogte."}],"17":[{"catchword":"beroerder","tekst":"Het Hebreeuwse woord betekent eigenlijk, beroerte, moeite en onrust, verenigd met kommer en ontstelling des harten, door woorden en werken aanrichten. Vergelijk Gen 34:30; Jos 7:25; Jdg 11:35; Pro 15:27. Hierover wordt Elia van Achab beschuldigd, niet alleen omdat hij de afgoderij gams tegen was, maar ook omdat hij hem meende te zijn de oorzaak van de droogte en van den honger, waarmede het land nu lang was geplaagd geweest."}],"18":[{"catchword":"Baäls nagevolgd zijt","tekst":"Zie boven, 1Ki 16:31."}],"19":[{"catchword":"Nu dan,","tekst":"Te weten, opdat gij van deze droogte verlost wordt. Want in dat bevel is de belofte begrepen, dat God het land van die verlossen zou, indien hij dit nakwam."},{"catchword":"Karmel,","tekst":"Gelegen in den stam van Issaschar bij de Middellandse zee, Jos 19:26; Jer 46:18. Deze berg was zeer hoog, Amo 9:3, wel bewassen met bomen, wijngaarden en welriekende kruiden; in somma, zeer vruchtbaar, Isa 35:2; op deze berg heeft zich ook de profeet Elisa onthouden, 2Ki 4:25, en is te onderscheiden van den berg Karmel, gelegen in den stam van Juda, in de woestijn Maon, waar Nabal woonde; 1Sa 25:2."},{"catchword":"van het bos,","tekst":"Te weten, het afgodische bos, waarvan te zien is boven, 1Ki 16:33. Van zulke bossen, zie Exo 34:13; Deu 7:5, met de aantekeningen. Anders, bosgod, of, boomgod."},{"catchword":"van de tafel","tekst":"Of, aan de tafel."}],"21":[{"catchword":"op twee gedachten?","tekst":"Anders, springende op twee takken; want het Hebreeuwse woord betekent ook een tak, gelijk Isa 17:6, maar voor gedachten wordt het genomen Job 4:13, en Job 20:2. Hij beschuldigt hen van twee dingen:&lt;i&gt;I.&lt;/i&gt; Dat zij God en Baäl tezamen wilden dienen;&lt;i&gt;II.&lt;/i&gt; Dat zij niet besloten, wien van beiden alleen zij zouden aanhangen, dewijl zij wel behoorden geweten te hebben, dat er maar één God is."},{"catchword":"God is,","tekst":"Dat is, die enige en ware God, wien men alleen de godsdienstige eer schuldig is."}],"22":[{"catchword":"alleen","tekst":"Te weten, die de waarheid van de leer en de zuiverheid van den godsdienst in Israël openlijk verdedig en voorsta, zijnde de andere profeten of gestorven, of vermoord, of verjaagd en in spelonken schuilende."},{"catchword":"vierhonderd en vijftig","tekst":"Men houdt dat onder dezen niet begrepen zijn enigen der vierhonderd profeten der afgodische boschaadje, die Elia mede tot deze verzameling had laten roepen, boven, vs.19, maar dat Izebel die zou achtergehouden hebben, en geboden niet te verschijnen, hetwelk wordt afgenomen uit hetgeen verhaald wordt onder, 1Ki 22:6. Zie aldaar de aantekeningen."}],"23":[{"catchword":"leggen, en geen vuur","tekst":"Hebreeuws eigenlijk, geven."}],"24":[{"catchword":"door vuur","tekst":"Versta, met het zenden des vuurs van den hemel, om door hetzelve de offerande aan te steken en te verteren, tot een bewijs wie de ware God, welke de rechte leer en zuivere godsdienst was."},{"catchword":"God zijn","tekst":"Gelijk boven, vs.21."},{"catchword":"Dat woord is goed","tekst":"Of, die zaak."}],"26":[{"catchword":"dien hij hun","tekst":"Dat is, die Elia recht tevoren hun toegelaten had te kiezen. Zie boven, vs.23."},{"catchword":"zij sprongen","tekst":"Versta dit van het altaar, dat Elia gemaakt had, hetwelk zij uit enkele kwaadheid met hun bespringen zochten om te stoten, hen gelatende door den ijver van een profetischen geest hiertoe gedreven te zijn. Zie onder, vs.29,30."},{"catchword":"tegen het altaar,","tekst":"Of, op over."}],"27":[{"catchword":"hij in gepeins is,","tekst":"Dat is, omdat hij wat heeft te denken, en met zijn zinnen te overleggen; of omdat hij met iemand heeft te spreken. Want het Hebreeuwse woord betekent zowel met den mond spreken als met het hart iets bedenken."},{"catchword":"wat te doen heeft,","tekst":"Anders, vervolg heeft; te weten, waardoor hij wordt aangezocht van anderen of hij zelf anderen zoekt en najaagt als mensen of beesten."},{"catchword":"en zal wakker worden","tekst":"Te weten, indien gij luide genoeg roept."}],"28":[{"catchword":"wijze,","tekst":"Met welke zij de ijdele heidenen navolgen, Deu 14:1, gelijk degenen, die zichzelven uit schijnheiligheid geselen, dat zij hun eigen bloed storten, navolgers van beiden zijn."},{"catchword":"totdat zij bloed","tekst":"Anders, totdat zij met bloed overgoten waren."}],"29":[{"catchword":"profeteerden","tekst":"Dat is, met hun uitwendig gelaat en gebaren zich zo aanstellen, alsof zij door den geest der profetie in vertrekking der zinnen geweest waren. Zie 1Sa 18:10."},{"catchword":"spijsoffer","tekst":"Hetwelk binnen Jeruzalem geschiedde in het laatste kwartier des daags, of, gelijk de Schriftuur spreekt, tussen twee avonden. Zie Exo 29:41; Act 3:1. Alzo werd ook dagelijks een spijsoffer geofferd des morgens; Exo 29:39; 2Ki 3:20."}],"30":[{"catchword":"altaar des HEEREN,","tekst":"Hetwelk hij tevoren gemaakt, en de profeten Baäls met hun springen verbroken hadden. Zie boven, vs.26."}],"31":[{"catchword":"Elia","tekst":"Hij wilde tonen met deze daad dat de twaalf stammen, niettegenstaande hun scheuring in de politie, evenwel behoorden tezamen verenigd te zijn in den godsdienst, om den Heere gelijkelijk met vermijding van alle afgoderij en ijdele superstitie naar zijn woord den schuldigen dienst en eer te bewijzen."}],"32":[{"catchword":"hij bouwde","tekst":"Dit is een extraordinair werk geweest, komende van een speciaal en bijzonder bevel Gods, en daarom uit te nemen van den algemenen regel; Lev 17:3; Deu 12:13-14."},{"catchword":"in den Naam des HEEREN;","tekst":"Dat is, uit last en bevel van God en tot zijn eer. Zie onder, vs.36."},{"catchword":"groeve","tekst":"Of, een waterloop."},{"catchword":"naar de wijdte","tekst":"Hebreeuws, naar het huis van twee maten zaads; dat is, naar de wijdte. Sommigen verstaan dat de groef zo wijd was als een zak, waar men twee maten zaads in deed; of twee maten zaads in konden gaan. Anderen verstaan dit van de wijdte niet der groef, maar der ruimte, die tussen de groef en het altaar is, begrijpende zoveel plaats als met twee maten zaads kan bezaaid worden."},{"catchword":"maten zaads","tekst":"Zie van deze maat Gen 18:6."}],"34":[{"catchword":"kruiken","tekst":"Of, emmers."},{"catchword":"met water,","tekst":"De profeet heeft dit water willen gebruiken, en dat in groten overvloed, om alle kwaad nadenken te benemen, en het wonderwerk, dat geschieden zou, te beter openbaar te maken."}],"35":[{"catchword":"groeve met water","tekst":"Van welke boven, vs.32 gesproken is."}],"36":[{"catchword":"als men","tekst":"Zie boven, vs.29."},{"catchword":"naderde,","tekst":"Te weten, tot het altaar."},{"catchword":"van Abraham,","tekst":"Deze naam Gods moest den Israëlieten indachtig maken dat zij en de Joden niet alleen dezelfde vleselijke afkomst hadden, die hen tot enigheid moest vermanen; maar ook in de gemeenschap der heilige leer en godsdienst, door middel dezer vaderen van God ontvangen, behoorden te volharden. Vergelijk de aantekeningen op Gen 26:24."},{"catchword":"al deze dingen","tekst":"Versta, niet alleen van hetgeen alreeds voor hem gedaan was, maar ook nog gedaan zou worden."}],"37":[{"catchword":"Antwoord mij,","tekst":"Dat is, verhoor mij, en openbaar door een zichtbaar teken, dat Gij mij verhoord hebt, doende vuur uit den hemel vallen om mijn offerande te verteren, gelijk ik het volk naar uw bevel dit teken gegeven heb, boven, vs.24."},{"catchword":"achterwaarts","tekst":"Van de afgoderij, waarin zij verzopen liggen. Want een van de bedoelingen zijns gebeds was, opdat degenen, die uit het volk bekeerd zouden worden, Gode de eer van hun bekering zouden toeschrijven."}],"38":[{"catchword":"Toen viel","tekst":"Zie gelijke exempelen Lev 9:24; Jdg 6:21; 2Ch 7:1."}],"39":[{"catchword":"zo vielen zij","tekst":"Tot een teken dat zij den Heere voor den waren God kenden en aanriepen. Zie Gen 24:26."},{"catchword":"God,","tekst":"Zie boven, vs.24."}],"40":[{"catchword":"Kison,","tekst":"Zie van deze beek Jdg 4:7."},{"catchword":"slachtte hen aldaar","tekst":"O, keelde hen; dat is, hij doodde hen met het zwaard, onder, 1Ki 19:1. Dit is ook begrepen geweest in het bevel Gods, van hetwelk Elia gewag maakt yself unto Achab [to promise him rain from me and to charge him to gather Baal priest together upon mount camel see below verse 19and the sequel]for I will give rain upon the earth."}],"2":[{"catchword":null,"tekst":"And Elia went to shew himself unto Achab and the famine was strong in Samaria [understand this not only of the city of Samaria but of all kingdom of Israel.]"}],"3":[{"catchword":null,"tekst":"And Achab had called Abadja who is to be distinguished from others that had this name 1Ch 27:19 and 2Ch 34:12 and from the prophet Abadja Obadea verse1 unless he were the same as some conceive he was] the steward [Heb. who was over his house that is his steward see above chapter 4.6 and 16.9] and Abadja feared the Lord greatly."}],"4":[{"catchword":null,"tekst":"For it came to pass when Izebel destroyed the prophets of the lord that Abadja took an hundred prophets and his them by fifty men in one cave [Heb. hid them fifty men in one cave to wit and fifty in another that is by with every time fifty together and sustained them with bread and water [that is with meat and drink see above chapter 13 on verse 8.]"}],"5":[{"catchword":null,"tekst":"And Achab had said unto Abadja pass throughout the land unto all fountains of water and unto all river peradventure they shall find grass[the Hebrew word signifieth all kind of herb that serveth for food to beast growing in unmanured places and mowed down with these they and made up with the hay compare Job 8:12and 40.10 Psa 104:14 and 129.6 and 147.8] that we may serve the horses and mules alive and destroy nothing of the beast [viz. by leaving them through neglect and carelessness unprovided of fodder.]"}],"6":[{"catchword":null,"tekst":"And they divided the land among themselves to pass it through Achab went one way by himself and Obaja went one way by himself."}],"7":[{"catchword":null,"tekst":"Now when Obadja was upon the way he met Elia [Heb. was in his meeting] and knew him so he fell on his face [viz. to shew him civil
