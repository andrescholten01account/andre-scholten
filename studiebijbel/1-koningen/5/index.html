href":"../../lukas/1/"},{"naam":"Johannes","href":"../../johannes/1/"},{"naam":"Handelingen","href":"../../handelingen/1/"},{"naam":"Romeinen","href":"../../romeinen/1/"},{"naam":"1 Korinthe","href":"../../1-korinthe/1/"},{"naam":"2 Korinthe","href":"../../2-korinthe/1/"},{"naam":"Galaten","href":"../../galaten/1/"},{"naam":"Efeze","href":"../../efeze/1/"},{"naam":"Filippenzen","href":"../../filippenzen/1/"},{"naam":"Kolossenzen","href":"../../kolossenzen/1/"},{"naam":"1 Thessalonicenzen","href":"../../1-thessalonicenzen/1/"},{"naam":"2 Thessalonicenzen","href":"../../2-thessalonicenzen/1/"},{"naam":"1 Timotheüs","href":"../../1-timotheus/1/"},{"naam":"2 Timotheüs","href":"../../2-timotheus/1/"},{"naam":"Titus","href":"../../titus/1/"},{"naam":"Filemon","href":"../../filemon/1/"},{"naam":"Hebreeën","href":"../../hebreeen/1/"},{"naam":"Jakobus","href":"../../jakobus/1/"},{"naam":"1 Petrus","href":"../../1-petrus/1/"},{"naam":"2 Petrus","href":"../../2-petrus/1/"},{"naam":"1 Johannes","href":"../../1-johannes/1/"},{"naam":"2 Johannes","href":"../../2-johannes/1/"},{"naam":"3 Johannes","href":"../../3-johannes/1/"},{"naam":"Judas","href":"../../judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}]},"vertalingen":{"SVnu":{"1":"En Hiram, de koning van Tyrus, zond zijn knechten naar Salomo (want hij had gehoord, dat zij Salomo tot koning gezalfd hadden in de plaats van zijn vader), omdat Hiram David altijd bemind had.","2":"Daarna zond Salomo naar Hiram en zei:","3":"U weet, dat mijn vader David voor de Naam van de HEERE, zijn God, geen huis kon bouwen, vanwege de oorlogen, waarmee zij hem omsingelden, totdat de HEERE hen onder zijn voetzolen gaf.","4":"Maar nu heeft de HEERE, mijn God, mij van rondom rust gegeven; er is geen tegenstander, en geen tegenslag van kwaad.","5":"En zie, ik ben van plan voor de Naam van de HEERE, mijn God, een huis te bouwen; zoals de HEERE gesproken heeft tot mijn vader David, en zei: Uw zoon, die Ik in uw plaats op uw troon zetten zal, die zal Mijn Naam dat huis bouwen.","6":"Zo gebied nu, dat men mij ceders uit de Libanon houwt, en mijn knechten zullen met uw knechten zijn, en het loon van uw knechten zal ik u geven, naar alles wat u zeggen zult; want u weet, dat onder ons niemand is, die weet hout te houwen zoals de Sidoniërs.","7":"En het gebeurde, toen Hiram de woorden van Salomo gehoord had, dat hij zich zeer verblijdde, en zei: Gezegend zij de HEERE heden, Die David een wijze zoon gegeven heeft over dit grote volk!","8":"En Hiram zond naar Salomo en zei: Ik heb gehoord, waarom u naar mij gezonden hebt; ik zal al uw wil doen met het cederhout en met het dennenhout.","9":"Mijn knechten zullen het afbrengen van de Libanon naar de zee; en ik zal het op vlotten over de zee laten voeren, tot die plaats, die u aan mij zult ontbieden, en zal het daar los maken, en u zult het wegnemen; u zult ook mijn wil doen, dat u mijn huis voedsel geeft.","10":"Zo gaf Hiram aan Salomo cederhout en dennenhout, naar al zijn wil.","11":"En Salomo gaf Hiram twintigduizend kor tarwe, tot voedsel van zijn huis, en twintig kor gestoten olie; dit gaf Salomo aan Hiram jaar op jaar.","12":"De HEERE dan gaf Salomo wijsheid, zoals Hij tot hem gesproken had; en er was vrede tussen Hiram en Salomo, en zij beiden sloten een verbond.","13":"En de koning Salomo liet een uitschot opkomen uit heel Israël; en het uitschot was dertigduizend man.","14":"En hij zond hen naar de Libanon, tienduizend van het maand bij beurten; een maand waren zij op de Libanon; twee maanden elk in zijn huis; en Adoniram was over dit uitschot.","15":"Daartoe had Salomo zeventigduizend, die lasten droegen, en tachtigduizend houwers op het gebergte.","16":"Behalve de leiders van Salomo's aanvoerders, die over dat werk waren, drieduizend driehonderd, die heerschappij hadden over het volk, dat dat werk deed.","17":"Toen de koning het nu gebood, voerden zij grote stenen aan, kostelijke stenen, gehouwen stenen, om de grond van dat huis te leggen.","18":"En de bouwlieden van Salomo, en de bouwlieden van Hiram, en de Giblieten behieuwen ze, en bereidden het hout toe, en de stenen, om dat huis te bouwen."},"SV":{"1":"En Hiram, de koning van Tyrus, zond zijn knechten tot Salomo ( want hij had gehoord, dat zij Salomo tot koning gezalfd hadden in zijns vaders plaats), dewijl Hiram David altijd bemind had.","2":"Daarna zond Salomo tot Hiram, zeggende:","3":"Gij weet, dat mijn vader David den Naam des HEEREN, zijns Gods, geen huis kon bouwen, vanwege de oorlogen, waarmede zij hem omsingelden, totdat de HEERE hen onder zijn voetzolen gaf.","4":"Maar nu heeft de HEERE, mijn God, mij van rondom rust gegeven; er is geen tegenpartijder, en geen bejegening van kwaad.","5":"En zie, ik denk voor den Naam van den HEERE, mijn God, een huis te bouwen; gelijk als de HEERE gesproken heeft tot mijn vader David, zeggende: Uw zoon, dien Ik in uw plaats op uw troon zetten zal, die zal Mijn Naam dat huis bouwen.","6":"Zo gebied nu, dat men mij cederen uit den Libanon houwe, en mijn knechten zullen met uw knechten zijn, en het loon uwer knechten zal ik u geven, naar al wat gij zeggen zult; want gij weet, dat onder ons niemand is, die weet hout te houwen, gelijk de Sidoniërs.","7":"En het geschiedde, als Hiram de woorden van Salomo gehoord had, dat hij zich zeer verblijdde, en zeide: Gezegend zij de HEERE heden, Die David een wijzen zoon gegeven heeft over dit grote volk!","8":"En Hiram zond tot Salomo, zeggende: Ik heb gehoord, waarom gij tot mij gezonden hebt; ik zal al uw wil doen met het cederenhout, en met het dennenhout.","9":"Mijn knechten zullen het afbrengen van den Libanon aan de zee; en ik zal het op vlotten over de zee doen voeren, tot die plaats, die gij aan mij ontbieden zult, en zal het aldaar los maken, en gij zult het wegnemen; gij zult ook mijn wil doen, dat gij mijn huis spijze geeft.","10":"Alzo gaf Hiram aan Salomo cederenhout en dennenhout, *naar* al zijn wil.","11":"En Salomo gaf Hiram twintig duizend kor tarwe, tot spijze van zijn huis, en twintig kor gestoten olie; zulks gaf Salomo aan Hiram jaar op jaar.","12":"De HEERE dan gaf Salomo wijsheid, gelijk als Hij tot hem gesproken had; en er was vrede tussen Hiram en tussen Salomo, en zij beiden maakten een verbond.","13":"En de koning Salomo deed een uitschot opkomen uit gans Israël; en het uitschot was dertig duizend man.","14":"En hij zond hen naar den Libanon, tien duizend des maands bij beurten; een maand waren zij op den Libanon; twee maanden elk in zijn huis; en Adoniram was over dit uitschot.","15":"Daartoe had Salomo zeventig duizend, die last droegen, en tachtig duizend houwers op het gebergte.","16":"Behalve de oversten van Salomo’s bestelden, die over dat werk waren, drie duizend en driehonderd, die heerschappij hadden over het volk, hetwelk dat werk deed.","17":"Als de koning het nu gebood, zo voerden zij grote stenen toe, kostelijke stenen, gehouwen stenen, om den grond van dat huis te leggen.","18":"En de bouwlieden van Salomo, en de bouwlieden van Hiram, en de Giblieten behieuwen ze, en bereidden het hout toe, en de stenen, om dat huis te bouwen."},"KJV":{"1":"And Hiram king of Tyre sent his servants unto Solomon; for he had heard that they had anointed him king in the room of his father: for Hiram was ever a lover of David.","2":"And Solomon sent to Hiram, saying,","3":"Thou knowest how that David my father could not build an house unto the name of the LORD his God for the wars which were about him on every side, until the LORD put them under the soles of his feet.","4":"But now the LORD my God hath given me rest on every side, so that there is neither adversary nor evil occurrent.","5":"And, behold, I purpose to build an house unto the name of the LORD my God, as the LORD spake unto David my father, saying, Thy son, whom I will set upon thy throne in thy room, he shall build an house unto my name.","6":"Now therefore command thou that they hew me cedar trees out of Lebanon; and my servants shall be with thy servants: and unto thee will I give hire for thy servants according to all that thou shalt appoint: for thou knowest that there is not among us any that can skill to hew timber like unto the Sidonians.","7":"And it came to pass, when Hiram heard the words of Solomon, that he rejoiced greatly, and said, Blessed be the LORD this day, which hath given unto David a wise son over this great people.","8":"And Hiram sent to Solomon, saying, I have considered the things which thou sentest to me for: and I will do all thy desire concerning timber of cedar, and concerning timber of fir.","9":"My servants shall bring them down from Lebanon unto the sea: and I will convey them by sea in floats unto the place that thou shalt appoint me, and will cause them to be discharged there, and thou shalt receive them: and thou shalt accomplish my desire, in giving food for my household.","10":"So Hiram gave Solomon cedar trees and fir trees according to all his desire.","11":"And Solomon gave Hiram twenty thousand measures of wheat for food to his household, and twenty measures of pure oil: thus gave Solomon to Hiram year by year.","12":"And the LORD gave Solomon wisdom, as he promised him: and there was peace between Hiram and Solomon; and they two ➔ made a league together.","13":"And king Solomon raised a levy out of all Israel; and the levy was thirty thousand men.","14":"And he sent them to Lebanon, ten thousand a month by courses: a month they were in Lebanon, and two months at home: and Adoniram was over the levy.","15":"And Solomon had threescore and ten thousand that bare burdens, and fourscore thousand hewers in the mountains;","16":"Beside the chief of Solomon's officers which were over the work, three thousand and three hundred, which ruled over the people that wrought in the work.","17":"And the king commanded, and they brought great stones, costly stones, and hewed stones, to lay the foundation of the house.","18":"And Solomon's builders and Hiram's builders did hew them, and the stonesquarers: so they prepared timber and stones to build the house."}},"tsk":{"1":[{"kopje":"Hiram","refs":["1 Kon 5:10","1 Kon 5:13","1 Kon 9:12-14","2 Kron 2:3"]},{"kopje":"zond","refs":["2 Sam 8:10","2 Sam 10:1","2 Sam 10:2","Ps 45:13"]},{"kopje":"Hiram","refs":["2 Sam 5:11","1 Kron 14:1","Amos 1:9"]}],"3":[{"kopje":"kon","refs":["2 Sam 7:5-11","1 Kron 22:4-6","2 Kron 6:6-8"]},{"kopje":"de oorlogen","refs":["1 Kron 22:8","1 Kron 28:3"]},{"kopje":"gaf","refs":["Joz 10:24","Ps 8:7","Ps 110:1","Mal 4:3","1 Kor 15:25","Ef 1:22"]}],"4":[{"kopje":"rust gegeven","refs":["1 Kon 4:24","1 Kron 22:9","Ps 72:7","Jes 9:6","Hand 9:31"]}],"5":[{"kopje":"zie","refs":["2 Kron 2:1-4","2 Kron 2:5-8"]},{"kopje":"zoals de HEERE","refs":["2 Sam 7:12","2 Sam 7:13","1 Kron 17:12","1 Kron 22:10","1 Kron 28:6","1 Kron 28:10","Zach 6:12","Zach 6:13"]}],"6":[{"kopje":"ceders","refs":["1 Kon 6:9","1 Kon 6:10","1 Kon 6:16","1 Kon 6:20","2 Kron 2:8","2 Kron 2:10","Ps 29:5"]},{"kopje":"het loon van uw knechten zal ik u geven","refs":["Rom 12:17","Fil 4:8"]},{"kopje":"dat niemand is","refs":["1 Kor 12:14-21","Ef 4:7"]},{"kopje":"Sidoniërs","refs":["Gen 10:15","Ezra 3:7"]}],"7":[{"kopje":"Gezegend","refs":["1 Kon 10:9","2 Kron 2:11","2 Kron 2:12","2 Kron 9:7","2 Kron 9:8","Ps 122:6","Ps 122:7","Ps 137:6"]},{"kopje":"Die","refs":["1 Kon 1:48","Gen 33:5","Jes 8:18","Jes 9:5"]},{"kopje":"een wijze zoon","refs":["1 Kon 3:9","2 Kron 2:11","Spr 10:1","Spr 13:1","Spr 15:20","Spr 23:24"]}],"8":[{"kopje":"dennenhout","refs":["1 Kon 6:15","1 Kon 6:34","2 Sam 6:5","2 Kron 3:5"]}],"9":[{"kopje":"Libanon","refs":["Deut 3:25"]},{"kopje":"en ik zal","refs":["2 Kron 2:16"]},{"kopje":"dat u voedsel geeft","refs":["2 Kron 1:15","Ezra 3:7","Ezech 27:17","Hand 12:20"]}],"11":[{"kopje":"kor","refs":["1 Kon 4:22","2 Kron 2:10"]}],"12":[{"kopje":"zoals Hij tot hem gesproken had","refs":["1 Kon 3:12","1 Kon 4:29","2 Kron 1:12","Jak 1:5"]},{"kopje":"zij beiden","refs":["1 Kon 15:19","Gen 21:32","Amos 1:9"]}],"13":[{"kopje": ":"1 Kon 5:14","href":"../../1-koningen/5/#v14","ref":"1 Kon 5:14","svLabel":null},{"disp":"1 Kon 5:18","href":"../../1-koningen/5/#v18","ref":"1 Kon 5:18","svLabel":null}],"kinderen":[]}]}]}]}},"extern":{"Ef 4:7":"Maar aan ieder van ons is de genade gegeven, naar de maat van de gave van Christus.","1 Kron 22:9":"Zie, de zoon die u geboren zal worden, die zal een man van rust zijn, want Ik zal hem rust geven van al zijn vijanden rondom; want zijn naam zal Salomo zijn, en Ik zal vrede en rust over Israël geven in zijn dagen.","1 Kon 5:1-12":"En Hiram, de koning van Tyrus, zond zijn knechten naar Salomo (want hij had gehoord, dat zij Salomo tot koning gezalfd hadden in de plaats van zijn vader), omdat Hiram David altijd bemind had. Daarna zond Salomo naar Hiram en zei: U weet, dat mijn vader David voor de Naam van de HEERE, zijn God, geen huis kon bouwen, vanwege de oorlogen, waarmee zij hem omsingelden, totdat de HEERE hen onder zijn voetzolen gaf.","Jak 1:5":"En als iemand van u wijsheid ontbreekt, laat hij die van God vragen, Die ieder mild geeft en niet verwijt; en ze zal hem gegeven worden.","Ezech 27:9":"De oudsten van Gebal en haar wijzen waren in u, zij verbeterden uw breuken; alle schepen van de zee en hun zeelieden waren in u, om onderlinge handel met u te drijven.","Ps 45:13":"En de dochter van Tyrus, de rijken onder het volk, zullen uw gunst met een geschenk smeken.","1 Petr 2:7":"Voor u dan, die gelooft, is Hij kostbaar; maar voor de ongehoorzamen geldt: de Steen die de bouwers verworpen hebben, Die is geworden tot een hoeksteen,","1 Kron 28:3":"Maar God heeft tegen mij gezegd: U zult voor Mijn Naam geen huis bouwen, want u bent een krijgsman en u hebt veel van het bloed vergoten.","Amos 1:9":"Zo zegt de HEERE: Om drie overtredingen van Tyrus, en om vier zal Ik dat niet afwenden; omdat zij Mijn volk met een volledige wegvoering hebben overgeleverd aan Edom, en niet gedacht hebben aan het verbond van de broeders.","1 Kon 4:29":"En God gaf Salomo wijsheid en zeer veel verstand, en een wijd begrip van hart, als het zand dat aan de oever van de zee is.","1 Kon 5:1-11":"En Hiram, de koning van Tyrus, zond zijn knechten naar Salomo (want hij had gehoord, dat zij Salomo tot koning gezalfd hadden in de plaats van zijn vader), omdat Hiram David altijd bemind had. Daarna zond Salomo naar Hiram en zei: U weet, dat mijn vader David voor de Naam van de HEERE, zijn God, geen huis kon bouwen, vanwege de oorlogen, waarmee zij hem omsingelden, totdat de HEERE hen onder zijn voetzolen gaf.","2 Kon 22:6":"Aan de timmerlieden en de bouwlieden, en de metselaars, en om hout en gehouwen stenen te kopen, om het huis te herstellen.","Ps 122:6":"Bid om de vrede van Jeruzalem; het moet goed gaan met hen die u liefhebben.","1 Kor 12:14-21":"Want ook het lichaam is niet één lid, maar veel leden. Als de voet zei: Omdat ik de hand niet ben, hoor ik niet bij het lichaam; hoort hij daarom niet bij het lichaam? En als het oor zei: Omdat ik het oog niet ben, hoor ik niet bij het lichaam; hoort het daarom niet bij het lichaam?","Ezra 7:22":"tot honderd talenten van het zilver toe, en tot honderd kor tarwe, en tot honderd bath wijn, en tot honderd bath olie, en zout zonder voorschrift.","1 Kon 4:22":"Het voedsel nu van Salomo was voor één dag: dertig kor meelbloem, en zestig kor meel;","1 Kron 27:1-15":"Dit nu zijn de kinderen van Israël naar hun getal, de hoofden van de families, en de aanvoerders van de duizenden en van de honderden, met hun opzichters, die de koning dienden in alle zaken van de verdelingen, aankomend en weggaand van maand tot maand, in al de maanden van het jaar; elke verdeling was vierentwintigduizend man. Over de eerste verdeling, in de eerste maand, was Jasobam, de zoon van Zabdiël; en in zijn verdeling waren er vierentwintigduizend. Hij was uit de kinderen van Perez, het hoofd van alle aanvoerders van de legers in de eerste maand.","1 Kron 14:1":"Toen zond Hiram, de koning van Tyrus, boden naar David, en cederhout, en metselaars, en timmerlieden, om hem een huis te bouwen.","1 Petr 2:6":"Daarom staat er ook in de Schrift: Zie, Ik leg in Sion een uitverkoren, kostbare hoeksteen; en wie in Hem gelooft, zal niet beschaamd worden.","2 Kron 2:1-4":"Salomo dacht erover een huis te bouwen voor de Naam van de HEERE, en een huis voor zijn koninkrijk. En Salomo telde zeventigduizend lastdragende mannen, en tachtigduizend mannen die in het gebergte zouden houwen, alsook drieduizend zeshonderd opzieners over hen. En Salomo zond een boodschap tot Huram, de koning van Tyrus, en zei: Zoals u met mijn vader David gedaan hebt, en hem cederen gezonden hebt om voor hem een huis te bouwen om daarin te wonen, doe zo ook met mij.","Klaagl 3:9":"Gimel. Hij heeft mijn wegen toegemuurd met uitgehouwen stenen, Hij heeft mijn paden krom gemaakt.","Gen 21:32":"Zo sloten zij een verbond te Berseba. Daarna stond Abimelech op, en Pichol, zijn legeraanvoerder, en zij keerden terug naar het land van de Filistijnen.","1 Kon 9:23":"Dezen waren de leiders van de opzichters, die over het werk van Salomo waren, vijfhonderdvijftig, die heerschappij hadden over het volk, dat aan het werk was.","1 Kon 6:7":"Het huis nu werd, toen het gebouwd werd, gebouwd met volmaakte steen, zoals die aangevoerd was; zodat geen hamer, noch bijl, noch enig ijzeren gereedschap gehoord werd in het huis, toen het gebouwd werd.","Ef 1:22":"En heeft alle dingen aan Zijn voeten onderworpen, en heeft Hem aan de Gemeente gegeven tot een Hoofd boven alle dingen;","Ezra 6:3":"In het eerste jaar van koning Kores gaf koning Kores dit bevel: Het huis van God te Jeruzalem, dat huis moet gebouwd worden op de plaats waar zij offeranden offeren, en de fundamenten daarvan moeten zwaar zijn; zijn hoogte zestig el, en zijn breedte zestig el;","1 Kron 22:15":"Ook zijn er bij u in overvloed die het werk kunnen doen: houwers, en werkmeesters in steen en hout, en allerlei wijze mensen in allerlei werk.","1 Kon 5:8-18":"En Hiram zond naar Salomo en zei: Ik heb gehoord, waarom u naar mij gezonden hebt; ik zal al uw wil doen met het cederhout en met het dennenhout. Mijn knechten zullen het afbrengen van de Libanon naar de zee; en ik zal het op vlotten over de zee laten voeren, tot die plaats, die u aan mij zult ontbieden, en zal het daar los maken, en u zult het wegnemen; u zult ook mijn wil doen, dat u mijn huis voedsel geeft. Zo gaf Hiram aan Salomo cederhout en dennenhout, naar al zijn wil.","1 Kon 15:19":"Er is een verbond tussen mij en u, tussen mijn vader en uw vader; zie, ik zend u een geschenk, zilver en goud; ga heen, maak uw verbond met Baësa, de koning van Israël, teniet, zodat hij van tegen mij aftrekt.","2 Sam 7:5-11":"Ga, en zeg tegen Mijn knecht, tegen David: Zo zegt de HEERE: Zou u Mij een huis bouwen om in te wonen? Want Ik heb in geen huis gewoond, vanaf de dag dat Ik de kinderen van Israël uit Egypte opvoerde, tot op deze dag; maar Ik heb rondgetrokken in een tent en in een tabernakel. Overal waar Ik met al de kinderen van Israël heb rondgetrokken, heb Ik ooit een woord gesproken met een van de stammen van Israël, aan wie Ik geboden heb Mijn volk Israël te weiden, en gezegd: Waarom bouwt u Mij geen huis van cederhout?","Spr 15:20":"Een wijze zoon verblijdt de vader; maar een dwaas mens veracht zijn moeder.","Spr 23:24":"De vader van de rechtvaardige zal zich zeer verheugen; en wie een wijze zoon verwekt, zal zich over hem verblijden.","2 Kon 19:23":"Door uw boden hebt u de Heere gehoond, en gezegd: Ik heb met de menigte van mijn wagens de hoogten van de bergen beklommen, de flanken van de Libanon; en ik zal zijn hoge cederbomen en zijn uitgelezen dennenbomen omhakken; en ik zal komen tot in zijn verste herberg, in het woud van zijn mooie veld.","2 Sam 7:4-12":"Maar het gebeurde in diezelfde nacht, dat het woord van de HEERE tot Nathan kwam, en Hij zei: Ga, en zeg tegen Mijn knecht, tegen David: Zo zegt de HEERE: Zou u Mij een huis bouwen om in te wonen? Want Ik heb in geen huis gewoond, vanaf de dag dat Ik de kinderen van Israël uit Egypte opvoerde, tot op deze dag; maar Ik heb rondgetrokken in een tent en in een tabernakel.","Mal 4:3":"En u zult de goddelozen vertreden, want zij zullen as worden onder de zolen van uw voeten, op die dag die Ik maken zal, zegt de HEERE van de heerscharen.","2 Kron 6:6-8":"Maar Ik heb Jeruzalem verkoren, dat Mijn Naam daar zou zijn; en Ik heb David verkoren, dat hij over Mijn volk Israël zou zijn. Het was ook in het hart van mijn vader David om een huis te bouwen voor de Naam van de HEERE, de God van Israël. Maar de HEERE zei tot mijn vader David: Omdat het in uw hart geweest is om voor Mijn Naam een huis te bouwen, hebt u er goed aan gedaan dat het in uw hart geweest is.","Hand 9:31":"De gemeenten dan, door heel Judea, en Galilea, en Samaria, hadden vrede en werden opgebouwd; en terwijl zij wandelden in de vreze van de Heere en de vertroosting van de Heilige Geest, werden zij talrijker.","Deut 11:24":"Elke plaats, waar uw voetzool op treedt, zal de uwe zijn; van de woestijn en de Libanon, van de rivier, de rivier de Eufraat, tot aan de verste zee, zal uw gebied zijn.","Jes 9:5":"Want een Kind is ons geboren, een Zoon is ons gegeven, en de heerschappij is op Zijn schouder; en men noemt Zijn naam Wonderlijk, Raad, Sterke God, Vader van de eeuwigheid, Vredevorst;","2 Kron 1:12":"De wijsheid en de kennis is u gegeven; daartoe zal Ik u rijkdom, en goederen, en eer geven, zoals geen koningen die vóór u geweest zijn, gehad hebben, en na u zal niemand zoiets hebben.","Ps 8:7":"U doet hem heersen over de werken van Uw handen; U hebt alles onder zijn voeten gezet;","2 Kron 9:8":"Geloofd zij de HEERE, uw God, Die behagen in u gehad heeft, om u op Zijn troon te zetten, tot een koning voor de HEERE, uw God; omdat uw God Israël liefheeft, om het voor eeuwig op te richten, daarom heeft Hij u tot koning over hen gesteld, om recht en gerechtigheid te doen.","1 Kon 9:21":"Hun kinderen, die na hen in het land overgebleven waren, die de kinderen van Israël niet hadden kunnen verbannen, die heeft Salomo gebracht tot slaafs uitschot, tot op deze dag.","1 Kon 9:11":"(Waartoe Hiram, de koning van Tyrus, Salomo van cederbomen, en van dennenbomen, en van goud, naar al zijn wens voorzien had), dat toen de koning Salomo aan Hiram twintig steden gaf in het land van Galilea.","Neh 7:60":"Alle Nethinim, en de kinderen van de knechten van Salomo, waren driehonderdtweeënnegentig.","1 Kon 5:6-12":"Zo gebied nu, dat men mij ceders uit de Libanon houwt, en mijn knechten zullen met uw knechten zijn, en het loon van uw knechten zal ik u geven, naar alles wat u zeggen zult; want u weet, dat onder ons niemand is, die weet hout te houwen zoals de Sidoniërs. En het gebeurde, toen Hiram de woorden van Salomo gehoord had, dat hij zich zeer verblijdde, en zei: Gezegend zij de HEERE heden, Die David een wijze zoon gegeven heeft over dit grote volk! En Hiram zond naar Salomo en zei: Ik heb gehoord, waarom u naar mij gezonden hebt; ik zal al uw wil doen met het cederhout en met het dennenhout.","Jes 9:6":"De grootheid van deze heerschappij en van de vrede zal geen einde hebben op de troon van David en in zijn koninkrijk, om dat te bevestigen en te sterken met recht en met gerechtigheid, van nu af tot in eeuwigheid toe. De ijver van de HEERE van de heerscharen zal dit doen.","1 Kon 9:12-14":"En Hiram trok uit van Tyrus, om de steden te bezien, die Salomo hem gegeven had, maar ze bevielen hem niet. Daarom zei hij: Wat zijn dat voor steden, mijn broeder, die u mij gegeven hebt? En hij noemde ze het land Kabul, tot op deze dag. En Hiram had de koning honderdtwintig talenten goud gezonden.","Spr 13:1":"Een wijze zoon hoort de tucht van de vader; maar een spotter hoort de bestraffing niet.","Ps 72:7":"In zijn dagen zal de rechtvaardige bloeien, en de veelheid van vrede, totdat de maan niet meer is.","1 Kon 4:29-34":"En God gaf Salomo wijsheid en zeer veel verstand, en een wijd begrip van hart, als het zand dat aan de oever van de zee is. En de wijsheid van Salomo was groter dan de wijsheid van allen uit het oosten, en dan alle wijsheid van de Egyptenaren; Ja, hij was wijzer dan alle mensen; dan Ethan, de Ezrahiet, en Heman, en Chalcol, en Darda, de zonen van Mahol; en zijn naam was bekend onder alle heidenvolken rondom.","Jer 51:26":"En zij zullen uit u geen steen nemen voor een hoek, ook geen steen voor fundamenten; want u zult tot eeuwige woestenijen zijn, spreekt de HEERE.","Ps 137:6":"Mijn tong kleeft aan mijn gehemelte, als ik aan u niet gedenk, als ik Jeruzalem niet verhef boven het hoogste van mijn blijdschap!","Neh 7:57":"De kinderen van de knechten van Salomo: de kinderen van Sotai, de kinderen van Sofereth, de kinderen van Perida;","Zach 6:13":"Ja, Hij zal de tempel van de HEERE bouwen, en Hij zal het sieraad dragen, en Hij zal zitten, en heersen op Zijn troon; en Hij zal priester zijn op Zijn troon; en de raad van vrede zal tussen die Beiden zijn.","1 Kon 6:34":"En de twee deuren waren van dennenhout; de twee zijden van de ene deur konden opzij gezet worden; en zo konden de twee gegraveerde zijden van de andere deur ook opzij gezet worden.","1 Kron 28:10":"Zie nu toe, want de HEERE heeft u verkoren om een huis te bouwen tot heiligdom; wees sterk en doe het.","1 Kon 12:18":"Toen zond koning Rehabeam Adoram, die over de belastingheffing was; en heel Israël stenigde hem met stenen, zodat hij stierf; maar koning Rehabeam maakte zich haastig gereed om op een wagen te klimmen, om naar Jeruzalem te vluchten.","Ps 29:5":"De stem van de HEERE breekt de ceders; ja, de HEERE verbreekt de ceders van Libanon.","Luk 16:6":"En hij zei: Honderd vaten olie. En hij zei tegen hem: Neem uw schuldbekentenis, en ga zitten, en schrijf haastig vijftig.","Ex 29:2":"En ongezuurd brood, en ongezuurde koeken, met olie gemengd, en ongezuurde vladen, met olie bestreken; van tarwemeelbloem zult u ze maken.","Ps 122:7":"Vrede zij binnen uw vesting, welvaart in uw paleizen.","Hand 12:20":"En Herodes was zeer verbolgen op de Tyriërs en Sidoniërs; maar zij kwamen eensgezind naar hem toe, en nadat zij Blastus, de kamerheer van de koning, hadden overreed, vroegen zij om vrede, omdat hun land werd bevoorraad vanuit het land van de koning.","1 Kon 6:36":"Daarna bouwde hij het binnenste voorhof met drie rijen gehouwen stenen, en een rij cederen balken.","Ps 104:17":"Waar de vogeltjes nestelen; het huis van de ooievaar zijn de dennenbomen.","2 Kron 34:11":"Want zij gaven het aan de werkmeesters en de bouwlieden, om gehouwen stenen te kopen, en hout voor de verbindingen, en om de huizen te voorzien van vloeren en balken, die de koningen van Juda hadden laten vervallen.","2 Kron 2:3":"En Salomo zond een boodschap tot Huram, de koning van Tyrus, en zei: Zoals u met mijn vader David gedaan hebt, en hem cederen gezonden hebt om voor hem een huis te bouwen om daarin te wonen, doe zo ook met mij.","1 Kon 6:20":"En het binnenste heiligdom¹ was vooraan twintig ellen in lengte, en twintig ellen in breedte, en twintig ellen in zijn hoogte, en hij overtrok het met gelouterd goud; ook overtrok hij het cederen altaar.","2 Kron 2:10":"En zie, ik zal uw knechten, de houwers die het hout houwen, twintigduizend kor uitgeslagen tarwe geven, en twintigduizend kor gerst; daartoe twintigduizend bath wijn, en twintigduizend bath olie.","2 Kron 2:17":"En Salomo telde alle vreemde mannen die in het land van Israël waren, volgens de telling waarmee zijn vader David hen geteld had; en er werden honderddrieënvijftigduizend zeshonderd gevonden.","2 Kron 27:5":"Hij streed ook tegen de koning van de Ammonieten, en had de overhand over hen, zodat de Ammonieten hem in datzelfde jaar honderd talenten van het zilver gaven, en tienduizend kor tarwe, en tienduizend gerst; dit brachten de Ammonieten hem opnieuw, ook in het tweede en in het derde jaar.","1 Kon 9:10-14":"En het gebeurde aan het einde van twintig jaren, waarin Salomo die twee huizen gebouwd had, het huis van de HEERE en het huis van de koning; (Waartoe Hiram, de koning van Tyrus, Salomo van cederbomen, en van dennenbomen, en van goud, naar al zijn wens voorzien had), dat toen de koning Salomo aan Hiram twintig steden gaf in het land van Galilea. En Hiram trok uit van Tyrus, om de steden te bezien, die Salomo hem gegeven had, maar ze bevielen hem niet.","1 Kon 5:3-5":"U weet, dat mijn vader David voor de Naam van de HEERE, zijn God, geen huis kon bouwen, vanwege de oorlogen, waarmee zij hem omsingelden, totdat de HEERE hen onder zijn voetzolen gaf. Maar nu heeft de HEERE, mijn God, mij van rondom rust gegeven; er is geen tegenstander, en geen tegenslag van kwaad. En zie, ik ben van plan voor de Naam van de HEERE, mijn God, een huis te bouwen; zoals de HEERE gesproken heeft tot mijn vader David, en zei: Uw zoon, die Ik in uw plaats op uw troon zetten zal, die zal Mijn Naam dat huis bouwen.","2 Kron 2:16":"En wij zullen hout houwen uit de Libanon, naar al uw behoefte, en zullen het met vlotten over de zee naar Jafo brengen; en u zult het laten ophalen naar Jeruzalem.","Rom 12:17":"Vergeld niemand kwaad voor kwaad. Zorg voor wat eerlijk is voor alle mensen.","Ps 83:8":"Gebal, en Ammon, en Amalek, Palestina met de inwoners van Tyrus.","2 Sam 7:5-9":"Ga, en zeg tegen Mijn knecht, tegen David: Zo zegt de HEERE: Zou u Mij een huis bouwen om in te wonen? Want Ik heb in geen huis gewoond, vanaf de dag dat Ik de kinderen van Israël uit Egypte opvoerde, tot op deze dag; maar Ik heb rondgetrokken in een tent en in een tabernakel. Overal waar Ik met al de kinderen van Israël heb rondgetrokken, heb Ik ooit een woord gesproken met een van de stammen van Israël, aan wie Ik geboden heb Mijn volk Israël te weiden, en gezegd: Waarom bouwt u Mij geen huis van cederhout?","2 Sam 7:12":"Wanneer uw dagen vervuld zullen zijn, en u met uw vaderen zult ontslapen zijn, dan zal Ik uw nakomeling na u doen opstaan, die uit uw lijf voortkomen zal, en Ik zal zijn koninkrijk bevestigen.","1 Kon 3:9":"Geef dan Uw knecht een verstandig hart om Uw volk te richten, en om onderscheid te kunnen maken tussen goed en kwaad; want wie zou dit zware volk van U kunnen richten?","Ezech 28:5":"Door de grootheid van uw wijsheid in uw koophandel hebt u uw vermogen vermeerderd, en uw hart verheft zich vanwege uw vermogen.","Ezra 3:7":"Zo gaven zij geld aan de houwers en werkmeesters, ook eten en drinken, en olie aan de Sidoniërs en aan de Tyriërs, om cederhout van de Libanon te brengen naar de zee bij Jafo, naar de vergunning die Kores, koning van Perzië, hun gegeven had.","Fil 4:8":"Verder, broeders, alles wat waar is, alles wat eerbaar is, alles wat rechtvaardig is, alles wat rein is, alles wat lieflijk is, alles wat goed klinkt, als er enige deugd is, en als er enige lof is, denk daaraan;","2 Sam 5:11":"En Hiram, de koning van Tyrus, zond boden naar David, en cederhout, en timmerlieden, en metselaars; en zij bouwden David een huis.","2 Kron 2:12":"Verder zei Huram: Geloofd zij de HEERE, de God van Israël, Die de hemel en de aarde gemaakt heeft, dat Hij aan de koning David een wijze zoon gegeven heeft, kloek in voorzichtigheid en verstand, die een huis voor de HEERE, en een huis voor zijn koninkrijk zal bouwen!","Spr 10:1":"De spreuken van Salomo. Een wijze zoon verblijdt de vader; maar een dwaze zoon is het verdriet van zijn moeder.","2 Kron 2:18":"En hij maakte daaruit zeventigduizend lastdragers, en tachtigduizend houwers in het gebergte, alsook drieduizend zeshonderd opzieners, om het volk te laten werken.","1 Kon 4:6":"En Ahisar was hofmeester; en Adoniram, de zoon van Abda, was over de schatting.","2 Kron 2:9":"En dat om voor mij hout in overvloed te bereiden; want het huis dat ik zal bouwen, zal groot en wonderlijk zijn.","1 Kon 3:12":"zie, Ik heb gedaan naar uw woorden; zie, Ik heb u een wijs en verstandig hart gegeven, zodat er vóór u niemand geweest is zoals u, en na u ook niemand zal opstaan zoals u.","1 Kon 8:13":"Ik heb immers³ een huis gebouwd, U tot woonstede, een vaste plaats tot Uw eeuwige woning.","Jer 25:22":"En alle koningen van Tyrus, en alle koningen van Sidon; en de koningen van de eilanden, die aan de andere kant van de zee zijn.","2 Kron 2:8":"Zend mij ook cederen, dennen, en algummimhout uit Libanon; want ik weet dat uw knechten het hout van Libanon weten te houwen; en zie, mijn knechten zullen met uw knechten zijn.","1 Kor 3:12":"En als iemand op dit fundament bouwt: goud, zilver, kostbare stenen, hout, hooi, stoppels;","Ex 34:1":"Toen zei de HEERE tegen Mozes: Houw u twee stenen tafelen, gelijk de eerste waren, zo zal Ik op de tafelen dezelfde woorden schrijven, die op de eerste tafelen geweest zijn, die u gebroken hebt.","2 Sam 7:13":"Die zal voor Mijn Naam een huis bouwen; en Ik zal de troon van zijn koninkrijk bevestigen tot in eeuwigheid.","1 Kon 9:10":"En het gebeurde aan het einde van twintig jaren, waarin Salomo die twee huizen gebouwd had, het huis van de HEERE en het huis van de koning;","2 Kron 2:3-16":"En Salomo zond een boodschap tot Huram, de koning van Tyrus, en zei: Zoals u met mijn vader David gedaan hebt, en hem cederen gezonden hebt om voor hem een huis te bouwen om daarin te wonen, doe zo ook met mij. Zie, ik zal een huis bouwen voor de Naam van de HEERE, mijn God, om Hem te heiligen, om reukwerk van welriekende specerijen voor Zijn aangezicht aan te steken, en voor de bereiding van het voortdurende brood, en voor de brandoffers van de morgen en de avond, op de sabbatten, en op de nieuwe manen, en op de vastgestelde hoogtijden van de HEERE, onze God; dit is voor eeuwig een verordening in Israël. En het huis dat ik zal bouwen, zal groot zijn; want onze God is groter dan alle goden.","1 Kon 10:24":"En heel de aarde zocht het aangezicht van Salomo, om zijn wijsheid te horen, die God in zijn hart gegeven had.","1 Kon 6:10":"Hij bouwde ook de kamers tegen het hele huis, vijf ellen hoog; en hij voegde ze vast aan dat huis met cederhout.","1 Kor 15:25":"Want Hij moet als Koning heersen, totdat Hij alle vijanden onder Zijn voeten zal hebben gelegd.","2 Sam 10:2":"Toen zei David: Ik zal weldadigheid doen aan Hanun, de zoon van Nahas, zoals zijn vader weldadigheid aan mij gedaan heeft. Zo zond David heen, om hem door de dienst van zijn knechten te troosten over zijn vader. En de knechten van David kwamen in het land van de kinderen Ammons.","1 Kon 10:9":"Geloofd zij de HEERE, uw God, Die behagen in u heeft gehad, om u op de troon van Israël te zetten! Omdat de HEERE Israël in eeuwigheid liefheeft, daarom heeft Hij u tot koning gesteld, om recht en gerechtigheid te doen.","Zach 6:12":"En spreek tegen hem, en zeg: Zo spreekt de HEERE van de heerscharen: Zie, een Man, Wiens naam is SPRUIT, Die zal uit Zijn plaats opgroeien, en Hij zal de tempel van de HEERE bouwen.","Ezech 27:17":"Juda en het land Israël waren uw kooplieden; met tarwe van Minnit en Pannag, en honing, en olie, en balsem, dreven zij onderlinge handel met u.","1 Kron 22:4":"en cederhout zonder getal, want de Sidoniërs en de Tyriërs brachten David cederhout in overvloed.","1 Kon 3:16-28":"Toen kwamen er twee vrouwen, die hoeren waren, bij de koning, en zij stonden voor zijn aangezicht. En de ene vrouw zei: Och, mijn heer. Ik en deze vrouw wonen in één huis; en ik heb bij haar in dat huis een kind gekregen. Het is nu gebeurd op de derde dag na mijn bevalling, dat deze vrouw ook een kind gekregen heeft; en wij waren samen, er was geen vreemde bij ons in dat huis, behalve wij tweeën in het huis.","1 Kron 22:2":"En David zei dat men de vreemdelingen moest verzamelen die in het land Israël waren; en hij stelde steenhouwers aan om stenen uit te houwen, om het huis van God te bouwen.","1 Kon 7:9-12":"Al deze dingen waren van kostbare stenen, naar de maten gehouwen, van binnen en van buiten met de zaag gezaagd; en dat van de fundering tot aan de kroonlijst, een handbreed, en van buiten tot aan de grote voorhof. Het was ook gegrondvest met kostbare stenen, grote stenen: stenen van tien el, en stenen van acht el. En daarboven kostbare stenen, naar de maten gehouwen, en cederhout.","Ps 147:14":"Die uw grondgebied in vrede stelt; Hij verzadigt u met het beste van de tarwe.","1 Kon 10:11":"Verder brachten ook de schepen van Hiram, die goud uit Ofir haalden, uit Ofir zeer veel almuggimhout en kostbaar gesteente.","Luk 19:44":"en zij zullen u tot de grond toe neerwerpen, en uw kinderen in u; en zij zullen in u geen steen op de andere steen laten liggen, omdat u de tijd waarin u bezocht werd niet hebt herkend.","2 Kon 17:4":"Maar de koning van Assyrië ontdekte een samenzwering bij Hosea, doordat hij boden gezonden had naar So, de koning van Egypte, en het geschenk aan de koning van Assyrië niet meer, zoals voorheen, van jaar tot jaar bracht; daarom sloot de koning van Assyrië hem op en bond hem vast in de gevangenis.","2 Kron 2:11":"Huram nu, de koning van Tyrus, antwoordde per brief, en zond die naar Salomo: Omdat de HEERE Zijn volk liefheeft, heeft Hij u over hen tot koning gesteld.","Luk 21:6":"Wat deze dingen aangaat, die u aanschouwt: er zullen dagen komen waarin geen steen op de andere steen gelaten zal worden, die niet zal worden afgebroken.","Gen 33:5":"Daarna sloeg hij zijn ogen op en zag die vrouwen en die kinderen, en zei: Wie zijn dit bij u? En hij zei: De kinderen die God aan uw knecht genadig gegeven heeft.","2 Kron 2:5-8":"En het huis dat ik zal bouwen, zal groot zijn; want onze God is groter dan alle goden. Doch wie zou de kracht hebben om voor Hem een huis te bouwen, aangezien de hemelen, ja, de hemel der hemelen, Hem niet bevatten kunnen? En wie ben ik, dat ik voor Hem een huis zou bouwen, behalve om reukwerk voor Zijn aangezicht aan te steken? Zend mij nu daarom een wijze man, om te werken in goud, en in zilver, en in koper, en in ijzer, en in purper, en karmozijn, en hemelsblauw, en die weet graveersels te graveren, samen met de wijzen die bij mij zijn in Juda en in Jeruzalem, die mijn vader David aangesteld heeft.","2 Kron 3:5":"Het grote huis nu overdekte hij met dennenhout; daarna overtrok hij dat met goed goud; en hij bracht daarop palmen en ketenwerk aan.","Joz 13:5":"Daarbij het land van de Giblieten, en de hele Libanon naar de opgang van de zon toe, van Baäl-gad af, onder aan de berg Hermon, tot aan de ingang van Hamath toe.","1 Kon 4:7-19":"En Salomo had twaalf bestelmeesters over heel Israël, die de koning en zijn huis van voedsel voorzagen; voor ieder was er een maand in het jaar om te verzorgen. En dit zijn hun namen: de zoon van Hur was in het gebergte van Efraïm. De zoon van Deker in Makaz, en in Saalbim, en Beth-semes, en Elon-beth-hanan.","Deut 3:25":"Laat mij toch oversteken, en dat goede land bezien, dat aan de overkant van de Jordaan is, dat goede gebergte, en de Libanon!","2 Kron 2:1-6":"Salomo dacht erover een huis te bouwen voor de Naam van de HEERE, en een huis voor zijn koninkrijk. En Salomo telde zeventigduizend lastdragende mannen, en tachtigduizend mannen die in het gebergte zouden houwen, alsook drieduizend zeshonderd opzieners over hen. En Salomo zond een boodschap tot Huram, de koning van Tyrus, en zei: Zoals u met mijn vader David gedaan hebt, en hem cederen gezonden hebt om voor hem een huis te bouwen om daarin te wonen, doe zo ook met mij.","2 Kron 2:2":"En Salomo telde zeventigduizend lastdragende mannen, en tachtigduizend mannen die in het gebergte zouden houwen, alsook drieduizend zeshonderd opzieners over hen.","1 Kon 1:48":"Ja, ook heeft de koning aldus gezegd: Geprezen zij de HEERE, de God van Israël, Die vandaag gegeven heeft iemand die op mijn troon zit, terwijl mijn eigen ogen het gezien hebben!","1 Kon 5:9-11":"Mijn knechten zullen het afbrengen van de Libanon naar de zee; en ik zal het op vlotten over de zee laten voeren, tot die plaats, die u aan mij zult ontbieden, en zal het daar los maken, en u zult het wegnemen; u zult ook mijn wil doen, dat u mijn huis voedsel geeft. Zo gaf Hiram aan Salomo cederhout en dennenhout, naar al zijn wil. En Salomo gaf Hiram twintigduizend kor tarwe, tot voedsel van zijn huis, en twintig kor gestoten olie; dit gaf Salomo aan Hiram jaar op jaar.","Ps 81:17":"En Hij zou het gevoed hebben met het beste van de tarwe; ja, Ik zou u verzadigd hebben met honing uit de rotsen.","2 Sam 10:1":"En het gebeurde daarna, dat de koning van de kinderen Ammons stierf, en zijn zoon Hanun werd koning in zijn plaats.","Gen 10:15":"En Kanaän verwekte Sidon, zijn eerstgeborene, en Heth,","Ezra 2:58":"Al de Nethinim, en de kinderen van de knechten van Salomo, waren driehonderdtweeënnegentig.","1 Kon 9:27":"En Hiram zond met die schepen zijn knechten, scheepslieden, kenners van de zee, met de knechten van Salomo.","Joz 10:24":"En het gebeurde, toen zij die koningen uitgebracht hadden tot Jozua, dat Jozua al de mannen van Israël riep, en hij zei tot de aanvoerders van het krijgsvolk, die met hem opgetrokken waren: Treed toe, zet uw voeten op de nekken van deze koningen. En zij traden toe, en zetten hun voeten op hun nekken.","1 Kon 6:9":"Zo bouwde hij het huis, en voltooide het; en bedekte dat huis met gewelven en rijen cederhout.","2 Sam 6:5":"En David en het hele huis van Israël speelden voor het aangezicht van de HEERE, met allerlei snarenspel van dennenhout, met harpen, en met luiten, en met trommels, ook met schellen, en met cimbalen.","Ps 110:1":"Een psalm van David. De HEERE heeft tot mijn Heere gesproken: Zit aan Mijn rechterhand, totdat Ik Uw vijanden gezet zal hebben tot een voetbank van Uw voeten.","1 Kon 5:6-10":"Zo gebied nu, dat men mij ceders uit de Libanon houwt, en mijn knechten zullen met uw knechten zijn, en het loon van uw knechten zal ik u geven, naar alles wat u zeggen zult; want u weet, dat onder ons niemand is, die weet hout te houwen zoals de Sidoniërs. En het gebeurde, toen Hiram de woorden van Salomo gehoord had, dat hij zich zeer verblijdde, en zei: Gezegend zij de HEERE heden, Die David een wijze zoon gegeven heeft over dit grote volk! En Hiram zond naar Salomo en zei: Ik heb gehoord, waarom u naar mij gezonden hebt; ik zal al uw wil doen met het cederhout en met het dennenhout.","1 Kon 5:6-8":"Zo gebied nu, dat men mij ceders uit de Libanon houwt, en mijn knechten zullen met uw knechten zijn, en het loon van uw knechten zal ik u geven, naar alles wat u zeggen zult; want u weet, dat onder ons niemand is, die weet hout te houwen zoals de Sidoniërs. En het gebeurde, toen Hiram de woorden van Salomo gehoord had, dat hij zich zeer verblijdde, en zei: Gezegend zij de HEERE heden, Die David een wijze zoon gegeven heeft over dit grote volk! En Hiram zond naar Salomo en zei: Ik heb gehoord, waarom u naar mij gezonden hebt; ik zal al uw wil doen met het cederhout en met het dennenhout.","Luk 16:7":"Daarna zei hij tegen een ander: En u, hoeveel bent u schuldig? En hij zei: Honderd mudden tarwe. En hij zei tegen hem: Neem uw schuldbekentenis, en schrijf tachtig.","Hos 12:2":"Efraïm weidt zich met wind, en jaagt de oostenwind na; de hele dag vermenigvuldigt hij leugen en verwoesting; en zij maken een verbond met Assur, en de olie wordt naar Egypte gevoerd.","Dan 2:45":"Daarom hebt u gezien dat uit de berg een steen zonder handen werd afgehouwen, die het ijzer, koper, leem, zilver en goud verbrijzelde; de grote God heeft de koning bekendgemaakt wat hierna gebeuren zal; de droom is dus waar, en de uitleg ervan betrouwbaar.","2 Sam 20:24":"En Adoram was over de schatting; en Josafat, de zoon van Ahilud, was kanselier;","Luk 21:5":"En toen sommigen spraken over de tempel, dat hij met mooie stenen en geschenken versierd was, zei Hij:","Deut 10:1":"In die tijd zei de HEERE tegen mij: Houw u twee stenen platen, zoals de eerste, en klim naar Mij op deze berg; daarna zult u zich een kist van hout maken.","1 Kron 22:4-6":"en cederhout zonder getal, want de Sidoniërs en de Tyriërs brachten David cederhout in overvloed. Want David zei: Mijn zoon Salomo is een jongeman en teder; en het huis dat men voor de HEERE bouwen zal, moet buitengewoon groot gemaakt worden, tot een naam en tot glorie in alle landen; ik zal er nu voorraad voor bereiden. Zo bereidde David voorraad in overvloed voor zijn dood. Toen riep hij zijn zoon Salomo, en gebood hem voor de HEERE, de God van Israël, een huis te bouwen.","Openb 21:14-21":"En de muur van de stad had twaalf fundamenten, en daarop de namen van de twaalf apostelen van het Lam. En hij die met mij sprak, had een gouden rietstok, opdat hij de stad zou meten, en haar poorten, en haar muur. En de stad lag vierkant, en haar lengte was zo groot als haar breedte. En hij mat de stad met de rietstok op twaalfduizend stadiën; de lengte, en de breedte, en de hoogte daarvan waren gelijk.","1 Kon 9:26":"De koning Salomo maakte ook schepen te Ezeon-geber, dat bij Eloth is, aan de oever van de Schelfzee, in het land van Edom.","Jes 8:18":"Zie, ik en de kinderen die de HEERE mij gegeven heeft, zijn tot tekenen en tot wonderen in Israël, van de HEERE van de heerscharen, Die op de berg Sion woont.","2 Kon 12:12":"En de metselaars en de steenhouwers, en om hout en gehouwen stenen te kopen, om de breuken van het huis van de HEERE te herstellen, en voor alles wat uitgegeven werd voor het huis, om dat te herstellen.","1 Kor 3:11":"Want niemand kan een ander fundament leggen dan hetgeen gelegd is, hetwelk is Jezus Christus.","1 Kon 7:51":"Zo werd al het werk voltooid dat koning Salomo voor het huis van de HEERE maakte. Daarna bracht Salomo de geheiligde dingen van zijn vader David: het zilver, het goud, en de voorwerpen legde hij bij de schatten van het huis van de HEERE.","1 Kon 9:20-22":"Aangaande al het volk, dat overgebleven was van de Amorieten, Hethieten, Ferezieten, Hevieten, en Jebusieten, die niet van de kinderen van Israël waren; Hun kinderen, die na hen in het land overgebleven waren, die de kinderen van Israël niet hadden kunnen verbannen, die heeft Salomo gebracht tot slaafs uitschot, tot op deze dag. Doch van de kinderen van Israël maakte Salomo geen slaaf; maar zij waren krijgslieden, en zijn knechten, en zijn vorsten, en zijn hoofdlieden, en de aanvoerders van zijn wagens, en van zijn ruiters.","1 Kron 22:8":"maar het woord van de HEERE kwam tot mij en zei: U hebt bloed in overvloed vergoten, want u hebt grote oorlogen gevoerd; u zult voor Mijn Naam geen huis bouwen, omdat u veel van het bloed op de aarde voor Mijn aangezicht vergoten hebt.","1 Kron 17:12":"Die zal Mij een huis bouwen, en Ik zal zijn troon bevestigen tot in eeuwigheid.","1 Kon 4:24":"Want hij had heerschappij over alles wat aan deze kant van de rivier was, van Thifsah tot aan Gaza toe, over alle koningen aan deze kant van de rivier; en hij had vrede van al zijn zijden rondom.","2 Kron 8:7-9":"Wat betreft al het volk dat overgebleven was van de Hethieten, de Amorieten, de Ferezieten, de Hevieten en de Jebusieten, die niet uit Israël waren, van hun kinderen, die na hen in het land overgebleven waren, die de kinderen van Israël niet uitgeroeid hadden, hen liet Salomo dienstplichtig werken tot op deze dag. Maar van de kinderen van Israël maakte Salomo niemand tot slaaf voor zijn werk; want zij waren krijgslieden, en leiders van zijn hoofdlieden, en aanvoerders van zijn wagens en van zijn ruiters.","2 Sam 8:10":"zond Thoi zijn zoon Joram naar de koning David om hem naar zijn welstand te vragen, en om hem te zegenen, omdat hij tegen Hadad-Ezer had gevochten en hem geslagen had (want Hadad-Ezer voerde steeds oorlog tegen Thoi); en in zijn hand waren zilveren vaten, en gouden vaten, en koperen vaten;","1 Kon 6:16":"Daartoe bouwde hij twintig ellen met cederen planken aan de zijden van het huis, van de vloer af tot de wanden; dit bouwde hij Hem van binnen tot een binnenste heiligdom¹, tot het heilige der heiligen.","2 Kron 2:8-10":"Zend mij ook cederen, dennen, en algummimhout uit Libanon; want ik weet dat uw knechten het hout van Libanon weten te houwen; en zie, mijn knechten zullen met uw knechten zijn. En dat om voor mij hout in overvloed te bereiden; want het huis dat ik zal bouwen, zal groot en wonderlijk zijn. En zie, ik zal uw knechten, de houwers die het hout houwen, twintigduizend kor uitgeslagen tarwe geven, en twintigduizend kor gerst; daartoe twintigduizend bath wijn, en twintigduizend bath olie.","1 Kron 28:6":"En Hij heeft tegen mij gezegd: Uw zoon Salomo, die zal Mijn huis en Mijn voorhoven bouwen; want Ik heb hem voor Mij verkoren tot een zoon, en Ik zal hem tot een Vader zijn.","2 Kron 9:7":"Gelukkig zijn uw mannen, en gelukkig deze uw knechten, die voortdurend voor uw aangezicht staan en uw wijsheid horen.","1 Kon 9:15":"Dit is nu de reden van het uitschot, dat de koning Salomo liet opkomen, om het huis van de HEERE te bouwen, en zijn huis, en Millo, en de muur van Jeruzalem, alsook Hazor, en Megiddo, en Gezer.","1 Kon 5:13-16":"En de koning Salomo liet een uitschot opkomen uit heel Israël; en het uitschot was dertigduizend man. En hij zond hen naar de Libanon, tienduizend van het maand bij beurten; een maand waren zij op de Libanon; twee maanden elk in zijn huis; en Adoniram was over dit uitschot. Daartoe had Salomo zeventigduizend, die lasten droegen, en tachtigduizend houwers op het gebergte.","1 Kon 7:9":"Al deze dingen waren van kostbare stenen, naar de maten gehouwen, van binnen en van buiten met de zaag gezaagd; en dat van de fundering tot aan de kroonlijst, een handbreed, en van buiten tot aan de grote voorhof.","1 Kon 5:6-11":"Zo gebied nu, dat men mij ceders uit de Libanon houwt, en mijn knechten zullen met uw knechten zijn, en het loon van uw knechten zal ik u geven, naar alles wat u zeggen zult; want u weet, dat onder ons niemand is, die weet hout te houwen zoals de Sidoniërs. En het gebeurde, toen Hiram de woorden van Salomo gehoord had, dat hij zich zeer verblijdde, en zei: Gezegend zij de HEERE heden, Die David een wijze zoon gegeven heeft over dit grote volk! En Hiram zond naar Salomo en zei: Ik heb gehoord, waarom u naar mij gezonden hebt; ik zal al uw wil doen met het cederhout en met het dennenhout.","Jes 28:16":"Daarom, zo zegt de Heere HEERE: Zie, Ik leg een grondsteen in Sion, een beproefde steen, een kostbare hoeksteen, die stevig gegrondvest is; wie gelooft, die zal niet haasten.","1 Kron 22:10":"Die zal voor Mijn Naam een huis bouwen, en die zal Mij tot een zoon zijn, en Ik hem tot een Vader; en Ik zal de troon van zijn rijk over Israël bevestigen tot in eeuwigheid.","2 Kron 1:15":"En de koning maakte het zilver en het goud in Jeruzalem zo overvloedig als stenen, en de ceders maakte hij zo overvloedig als wilde vijgenbomen die in de laagten zijn, in menigte.","1 Kon 6:15":"Ook bouwde hij de wanden van het huis van binnen met cederen planken; van de vloer van het huis tot aan het dak van de wanden beschoot hij ze van binnen met hout; en bedekte de vloer van het huis met dennen planken.","Jes 23:8":"Wie heeft dit besloten tegen Tyrus, de stad die anderen kroont, wier kooplieden vorsten zijn, wier handelaars de heerlijkste van het land zijn?","Matt 24:2":"En Jezus zei tegen hen: Ziet u niet al deze dingen? Voorwaar, Ik zeg u: hier zal geen steen op de andere steen gelaten worden, die niet zal worden afgebroken."},"noten":{},"koppeling":{"1":"<span class=\"wl\" data-l=\"L1\" data-code=\"H2438\">En</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H2438\">Hiram</span>, <span class=\"wl\" data-l=\"L1\" data-code=\"H2438\">de</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H4428\">koning</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H4428\">van</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H6865\">Tyrus</span>, <span class=\"wl\" data-l=\"L4\" data-code=\"H7971\">zond</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H7971\">zijn</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H5650\">knechten</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H5650\">naar</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H8010\">Salomo</span> (<span class=\"wl\" data-l=\"L8\" data-code=\"H3588\">want</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H8085\">hij</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H8085\">had</span> <span class=\"wl\" data-l=\"L9\" data-c /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {

    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],

).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>

      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];

        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;

  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;

    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>

      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>

}

  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
</html>
