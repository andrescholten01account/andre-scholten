uis bouwen.","6":"Zo gebied nu, dat men mij ceders uit de Libanon houwt, en mijn knechten zullen met uw knechten zijn, en het loon van uw knechten zal ik u geven, naar alles wat u zeggen zult; want u weet, dat onder ons niemand is, die weet hout te houwen zoals de Sidoniërs.","7":"En het gebeurde, toen Hiram de woorden van Salomo gehoord had, dat hij zich zeer verblijdde, en zei: Gezegend zij de HEERE heden, Die David een wijze zoon gegeven heeft over dit grote volk!","8":"En Hiram zond naar Salomo en zei: Ik heb gehoord, waarom u naar mij gezonden hebt; ik zal al uw wil doen met het cederhout en met het dennenhout.","9":"Mijn knechten zullen het afbrengen van de Libanon naar de zee; en ik zal het op vlotten over de zee laten voeren, tot die plaats, die u aan mij zult ontbieden, en zal het daar los maken, en u zult het wegnemen; u zult ook mijn wil doen, dat u mijn huis voedsel geeft.","10":"Zo gaf Hiram aan Salomo cederhout en dennenhout, naar al zijn wil.","11":"En Salomo gaf Hiram twintigduizend kor tarwe, tot voedsel van zijn huis, en twintig kor gestoten olie; dit gaf Salomo aan Hiram jaar op jaar.","12":"De HEERE dan gaf Salomo wijsheid, zoals Hij tot hem gesproken had; en er was vrede tussen Hiram en Salomo, en zij beiden sloten een verbond.","13":"En de koning Salomo liet een uitschot opkomen uit heel Israël; en het uitschot was dertigduizend man.","14":"En hij zond hen naar de Libanon, tienduizend van het maand bij beurten; een maand waren zij op de Libanon; twee maanden elk in zijn huis; en Adoniram was over dit uitschot.","15":"Daartoe had Salomo zeventigduizend, die lasten droegen, en tachtigduizend houwers op het gebergte.","16":"Behalve de leiders van Salomo's aanvoerders, die over dat werk waren, drieduizend driehonderd, die heerschappij hadden over het volk, dat dat werk deed.","17":"Toen de koning het nu gebood, voerden zij grote stenen aan, kostelijke stenen, gehouwen stenen, om de grond van dat huis te leggen.","18":"En de bouwlieden van Salomo, en de bouwlieden van Hiram, en de Giblieten behieuwen ze, en bereidden het hout toe, en de stenen, om dat huis te bouwen."},"SV":{"1":"En Hiram, de koning van Tyrus, zond zijn knechten tot Salomo ( want hij had gehoord, dat zij Salomo tot koning gezalfd hadden in zijns vaders plaats), dewijl Hiram David altijd bemind had.","2":"Daarna zond Salomo tot Hiram, zeggende:","3":"Gij weet, dat mijn vader David den Naam des HEEREN, zijns Gods, geen huis kon bouwen, vanwege de oorlogen, waarmede zij hem omsingelden, totdat de HEERE hen onder zijn voetzolen gaf.","4":"Maar nu heeft de HEERE, mijn God, mij van rondom rust gegeven; er is geen tegenpartijder, en geen bejegening van kwaad.","5":"En zie, ik denk voor den Naam van den HEERE, mijn God, een huis te bouwen; gelijk als de HEERE gesproken heeft tot mijn vader David, zeggende: Uw zoon, dien Ik in uw plaats op uw troon zetten zal, die zal Mijn Naam dat huis bouwen.","6":"Zo gebied nu, dat men mij cederen uit den Libanon houwe, en mijn knechten zullen met uw knechten zijn, en het loon uwer knechten zal ik u geven, naar al wat gij zeggen zult; want gij weet, dat onder ons niemand is, die weet hout te houwen, gelijk de Sidoniërs.","7":"En het geschiedde, als Hiram de woorden van Salomo gehoord had, dat hij zich zeer verblijdde, en zeide: Gezegend zij de HEERE heden, Die David een wijzen zoon gegeven heeft over dit grote volk!","8":"En Hiram zond tot Salomo, zeggende: Ik heb gehoord, waarom gij tot mij gezonden hebt; ik zal al uw wil doen met het cederenhout, en met het dennenhout.","9":"Mijn knechten zullen het afbrengen van den Libanon aan de zee; en ik zal het op vlotten over de zee doen voeren, tot die plaats, die gij aan mij ontbieden zult, en zal het aldaar los maken, en gij zult het wegnemen; gij zult ook mijn wil doen, dat gij mijn huis spijze geeft.","10":"Alzo gaf Hiram aan Salomo cederenhout en dennenhout, *naar* al zijn wil.","11":"En Salomo gaf Hiram twintig duizend kor tarwe, tot spijze van zijn huis, en twintig kor gestoten olie; zulks gaf Salomo aan Hiram jaar op jaar.","12":"De HEERE dan gaf Salomo wijsheid, gelijk als Hij tot hem gesproken had; en er was vrede tussen Hiram en tussen Salomo, en zij beiden maakten een verbond.","13":"En de koning Salomo deed een uitschot opkomen uit gans Israël; en het uitschot was dertig duizend man.","14":"En hij zond hen naar den Libanon, tien duizend des maands bij beurten; een maand waren zij op den Libanon; twee maanden elk in zijn huis; en Adoniram was over dit uitschot.","15":"Daartoe had Salomo zeventig duizend, die last droegen, en tachtig duizend houwers op het gebergte.","16":"Behalve de oversten van Salomo’s bestelden, die over dat werk waren, drie duizend en driehonderd, die heerschappij hadden over het volk, hetwelk dat werk deed.","17":"Als de koning het nu gebood, zo voerden zij grote stenen toe, kostelijke stenen, gehouwen stenen, om den grond van dat huis te leggen.","18":"En de bouwlieden van Salomo, en de bouwlieden van Hiram, en de Giblieten behieuwen ze, en bereidden het hout toe, en de stenen, om dat huis te bouwen."},"KJV":{"1":"And Hiram king of Tyre sent his servants unto Solomon; for he had heard that they had anointed him king in the room of his father: for Hiram was ever a lover of David.","2":"And Solomon sent to Hiram, saying,","3":"Thou knowest how that David my father could not build an house unto the name of the LORD his God for the wars which were about him on every side, until the LORD put them under the soles of his feet.","4":"But now the LORD my God hath given me rest on every side, so that there is neither adversary nor evil occurrent.","5":"And, behold, I purpose to build an house unto the name of the LORD my God, as the LORD spake unto David my father, saying, Thy son, whom I will set upon thy throne in thy room, he shall build an house unto my name.","6":"Now therefore command thou that they hew me cedar trees out of Lebanon; and my servants shall be with thy servants: and unto thee will I give hire for thy servants according to all that thou shalt appoint: for thou knowest that there is not among us any that can skill to hew timber like unto the Sidonians.","7":"And it came to pass, when Hiram heard the words of Solomon, that he rejoiced greatly, and said, Blessed be the LORD this day, which hath given unto David a wise son over this great people.","8":"And Hiram sent to Solomon, saying, I have considered the things which thou sentest to me for: and I will do all thy desire concerning timber of cedar, and concerning timber of fir.","9":"My servants shall bring them down from Lebanon unto the sea: and I will convey them by sea in floats unto the place that thou shalt appoint me, and will cause them to be discharged there, and thou shalt receive them: and thou shalt accomplish my desire, in giving food for my household.","10":"So Hiram gave Solomon cedar trees and fir trees according to all his desire.","11":"And Solomon gave Hiram twenty thousand measures of wheat for food to his household, and twenty measures of pure oil: thus gave Solomon to Hiram year by year.","12":"And the LORD gave Solomon wisdom, as he promised him: and there was peace between Hiram and Solomon; and they two ➔ made a league together.","13":"And king Solomon raised a levy out of all Israel; and the levy was thirty thousand men.","14":"And he sent them to Lebanon, ten thousand a month by courses: a month they were in Lebanon, and two months at home: and Adoniram was over the levy.","15":"And Solomon had threescore and ten thousand that bare burdens, and fourscore thousand hewers in the mountains;","16":"Beside the chief of Solomon's officers which were over the work, three thousand and three hundred, which ruled over the people that wrought in the work.","17":"And the king commanded, and they brought great stones, costly stones, and hewed stones, to lay the foundation of the house.","18":"And Solomon's builders and Hiram's builders did hew them, and the stonesquarers: so they prepared timber and stones to build the house."}},"tsk":{"1":[{"kopje":"Hiram","refs":["1 Kon 5:10","1 Kon 5:13","1 Kon 9:12-14","2 Kron 2:3"]},{"kopje":"zond","refs":["2 Sam 8:10","2 Sam 10:1","2 Sam 10:2","Ps 45:13"]},{"kopje":"Hiram","refs":["2 Sam 5:11","1 Kron 14:1","Amos 1:9"]}],"3":[{"kopje":"kon","refs":["2 Sam 7:5-11","1 Kron 22:4-6","2 Kron 6:6-8"]},{"kopje":"de oorlogen","refs":["1 Kron 22:8","1 Kron 28:3"]},{"kopje":"gaf","refs":["Joz 10:24","Ps 8:7","Ps 110:1","Mal 4:3","1 Kor 15:25","Ef 1:22"]}],"4":[{"kopje":"rust gegeven","refs":["1 Kon 4:24","1 Kron 22:9","Ps 72:7","Jes 9:6","Hand 9:31"]}],"5":[{"kopje":"zie","refs":["2 Kron 2:1-4","2 Kron 2:5-8"]},{"kopje":"zoals de HEERE","refs":["2 Sam 7:12","2 Sam 7:13","1 Kron 17:12","1 Kron 22:10","1 Kron 28:6","1 Kron 28:10","Zach 6:12","Zach 6:13"]}],"6":[{"kopje":"ceders","refs":["1 Kon 6:9","1 Kon 6:10","1 Kon 6:16","1 Kon 6:20","2 Kron 2:8","2 Kron 2:10","Ps 29:5"]},{"kopje":"het loon van uw knechten zal ik u geven","refs":["Rom 12:17","Fil 4:8"]},{"kopje":"dat niemand is","refs":["1 Kor 12:14-21","Ef 4:7"]},{"kopje":"Sidoniërs","refs":["Gen 10:15","Ezra 3:7"]}],"7":[{"kopje":"Gezegend","refs":["1 Kon 10:9","2 Kron 2:11","2 Kron 2:12","2 Kron 9:7","2 Kron 9:8","Ps 122:6","Ps 122:7","Ps 137:6"]},{"kopje":"Die","refs":["1 Kon 1:48","Gen 33:5","Jes 8:18","Jes 9:5"]},{"kopje":"een wijze zoon","refs":["1 Kon 3:9","2 Kron 2:11","Spr 10:1","Spr 13:1","Spr 15:20","Spr 23:24"]}],"8":[{"kopje":"dennenhout","refs":["1 Kon 6:15","1 Kon 6:34","2 Sam 6:5","2 Kron 3:5"]}],"9":[{"kopje":"Libanon","refs":["Deut 3:25"]},{"kopje":"en ik zal","refs":["2 Kron 2:16"]},{"kopje":"dat u voedsel geeft","refs":["2 Kron 1:15","Ezra 3:7","Ezech 27:17","Hand 12:20"]}],"11":[{"kopje":"kor","refs":["1 Kon 4:22","2 Kron 2:10"]}],"12":[{"kopje":"zoals Hij tot hem gesproken had","refs":["1 Kon 3:12","1 Kon 4:29","2 Kron 1:12","Jak 1:5"]},{"kopje":"zij beiden","refs":["1 Kon 15:19","Gen 21:32","Amos 1:9"]}],"13":[{"kopje":"uitschot","refs":["1 Kon span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span>","3":"Thou <span class=\"wl wl-kjv\" data-code=\"H3045\">knowest</span> how that <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> my <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H3201\">could</span> not <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> an <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> unto the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> his <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">for</span> the <span class=\"wl wl-kjv\" data-code=\"H4421\">wars</span> which were about him on every <span class=\"wl wl-kjv\" data-code=\"H5437\">side,</span> until the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> them under the <span class=\"wl wl-kjv\" data-code=\"H3709\">soles</span> of his <span class=\"wl wl-kjv\" data-code=\"H7272\">feet.</span>","4":"But now the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> my <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> hath given me <span class=\"wl wl-kjv\" data-code=\"H5117\">rest</span> on every <span class=\"wl wl-kjv\" data-code=\"H5439\">side,</span> so that there is neither <span class=\"wl wl-kjv\" data-code=\"H7854\">adversary</span> nor <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"wl wl-kjv\" data-code=\"H6294\">occurrent.</span>","5":"And, behold, I <span class=\"wl wl-kjv\" data-code=\"H559\">purpose</span> to <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> an <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> unto the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> my <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> -code=\"H8085\">heard</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon,</span> that he <span class=\"wl wl-kjv\" data-code=\"H8055\">rejoiced</span> <span class=\"wl wl-kjv\" data-code=\"H3966\">greatly,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H1288\">Blessed</span> be the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> which hath <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> unto <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> a <span class=\"wl wl-kjv\" data-code=\"H2450\">wise</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> over this <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">people.</span>","8":"And <span class=\"wl wl-kjv\" data-code=\"H2438\">Hiram</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> to <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> I have <span class=\"wl wl-kjv\" data-code=\"H8085\">considered</span> the things which thou <span class=\"wl wl-kjv\" data-code=\"H7971\">sentest</span> to me for: and I will <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> all thy <span class=\"wl wl-kjv\" data-code=\"H2656\">desire</span> concerning <span class=\"wl wl-kjv\" data-code=\"H6086\">timber</span> of <span class=\"wl wl-kjv\" data-code=\"H730\">cedar,</span> and concerning <span class=\"wl wl-kjv\" data-code=\"H6086\">timber</span> of <span class=\"wl wl-kjv\" data-code=\"H1265\">fir.</span>","9":"My <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> shall bring them <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> from <span class=\"wl wl-kjv\" data-code=\"H3844\">Lebanon</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea:</span> and I will <span class=\"wl wl-kjv\" data-code=\"H7760\">convey</span> them by <span class=\"wl wl-kjv\" data-code=\"H3220\">sea</span> in <span class=\"wl wl-kjv\" data-code=\"H1702\">floats</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> that thou shalt <span class=\"wl wl-kjv\" data-code=\"H7971\">appoint</span> me, and will cause them to be <span class=\"wl wl-kjv\" data-code=\"H5310\">discharged</span> there, and thou shalt <span class=\"wl wl-kjv\" data-code=\"H5375\">receive</span> them: and thou shalt <span class=\"wl wl-kjv\" data-code=\"H6213\">accomplish</span> my <span class=\"wl wl-kjv\" data-code=\"H2656\">desire,</span> in <span class=\"wl wl-kjv\" data-code=\"H5414\">giving</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">food</span> for my <span class=\"wl wl-kjv\" data-code=\"H1004\">household.</span>","10":"So <span class=\"wl wl-kjv\" data-code=\"H2438\">Hiram</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H730\">cedar</span> <span class=\"wl wl-kjv\" data-code=\"H6086\">trees</span> and <span class=\"wl wl-kjv\" data-code=\"H1265\">fir</span> <span class=\"wl wl-kjv\" data-code=\"H6086\">trees</span> according to all his <span class=\"wl wl-kjv\" data-code=\"H2656\">desire.</span>","11":"And <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> <span class=\"wl wl-kjv\" data-code=\"H2438\">Hiram</span> <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H3734\">measures</span> of <span class=\"wl wl-kjv\" data-code=\"H2406\">wheat</span> for <span class=\"wl wl-kjv\" data-code=\"H4361\">food</span> to his <span class=\"wl wl-kjv\" data-code=\"H1004\">household,</span> and <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H3734\">measures</span> of <span class=\"wl wl-kjv\" data-code=\"H3795\">pure</span> <span class=\"wl wl-kjv\" data-code=\"H8081\">oil:</span> thus <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> to <span class=\"wl wl-kjv\" data-code=\"H2438\">Hiram</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> by <span class=\"wl wl-kjv\" data-code=\"H8141\">year.</span>","12":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom,</span> as he <span class=\"wl wl-kjv\" data-code=\"H1696\">promised</span> him: and there was <span class=\"wl wl-kjv\" data-code=\"H7965\">peace</span> between <span class=\"wl wl-kjv\" data-code=\"H2438\">Hiram</span> and <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon;</span> and they <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> ➔ <span class=\"wl wl-kjv\" data-code=\"H3772\">made</span> a <span class=\"wl wl-kjv\" data-code=\"H1285\">league</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">together.</span>","13":"And <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H5927\">raised</span> a <span class=\"wl wl-kjv\" data-code=\"H4522\">levy</span> out of all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> and the <span class=\"wl wl-kjv\" data-code=\"H4522\">levy</span> was <span class=\"wl wl-kjv\" data-code=\"H7970\">thirty</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men.</span>","14":"And he <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> them to <span class=\"wl wl-kjv\" data-code=\"H3844\">Lebanon,</span> <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> a <span class=\"wl wl-kjv\" data-code=\"H2320\">month</span> by <span class=\"wl wl-kjv\" data-code=\"H2487\">courses:</span> a <span class=\"wl wl-kjv\" data-code=\"H2320\">month</span> they were in <span class=\"wl wl-kjv\" data-code=\"H3844\">Lebanon,</span> and <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H2320\">months</span> at <span class=\"wl wl-kjv\" data-code=\"H1004\">home:</span> and <span class=\"wl wl-kjv\" data-code=\"H141\">Adoniram</span> was over the <span class=\"wl wl-kjv\" data-code=\"H4522\">levy.</span>","15":"And <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> had threescore and <span class=\"wl wl-kjv\" data-code=\"H7657\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> that <span class=\"wl wl-kjv\" data-code=\"H5375\">bare</span> <span class=\"wl wl-kjv\" data-code=\"H5449\">burdens,</span> and <span class=\"wl wl-kjv\" data-code=\"H8084\">fourscore</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H2672\">hewers</span> in the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains;</span>","16":"Beside the <span class=\"wl wl-kjv\" data-code=\"H8269\">chief</span> of <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon's</span> <span class=\"wl wl-kjv\" data-code=\"H5324\">officers</span> which were over the <span class=\"wl wl-kjv\" data-code=\"H4399\">work,</span> <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> and <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred,</span> which <span class=\"wl wl-kjv\" data-code=\"H7287\">ruled</span> over the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that <span class=\"wl wl-kjv\" data-code=\"H6213\">wrought</span> in the <span class=\"wl wl-kjv\" data-code=\"H4399\">work.</span>","17":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded,</span> and they <span class=\"wl wl-kjv\" data-code=\"H5265\">brought</span> <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stones,</span> <span class=\"wl wl-kjv\" data-code=\"H3368\">costly</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stones,</span> and <span class=\"wl wl-kjv\" data-code=\"H1496\">hewed</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stones,</span> to lay the <span class=\"wl wl-kjv\" data-code=\"H3245\">foundation</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house.</span>","18":"And <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon's</span> <span class=\"wl wl-kjv\" data-code=\"H1129\">builders</span> and <span class=\"wl wl-kjv\" data-code=\"H2438\">Hiram's</span> <span class=\"wl wl-kjv\" data-code=\"H1129\">builders</span> did <span class=\"wl wl-kjv\" data-code=\"H6458\">hew</span> them, and the <span class=\"wl wl-kjv\" data-code=\"H1382\">stonesquarers:</span> so they <span class=\"wl wl-kjv\" data-code=\"H3559\">prepared</span> <span class=\"wl wl-kjv\" data-code=\"H6086\">timber</span> and <span class=\"wl wl-kjv\" data-code=\"H68\">stones</span> to <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Hiram,","tekst":"Hij wordt ook Hirom genoemd, onder vs.10, 18; idem Huram, 2Ch 2:3, en is te onderscheiden van een anderen Hiram, die een zeer kundig werkmeester was, ener weduwe zoon; van wien zie onder 1Ki 7:13-14, en 2Ch 2:13."},{"catchword":"Tyrus,","tekst":"De hoofdstad van Fenicië, gelegen in de Middellandse zee, zevenhonderd treden van het vasteland, vóór den tijd van Alexander den Grote zeer rijk, machtig en vermaard door haar zeevaart en koophandel. Zie Isa 23; idem Eze 26, Eze 27, en Eze 28."},{"catchword":"zond zijn knechten","tekst":"Om zijn blijdschap te verklaren dat Salomo in zijns vaders plaats koning geworden was, om zijn vriendschap te bekomen en in een verbond met hem te treden; gelijk dit ook geschied is. Zie vs.12."},{"catchword":"altijd","tekst":"Hebreeuws, al de dagen."},{"catchword":"bemind had","tekst":"Of, Davids vriend geweest was."}],"3":[{"catchword":"Naam des HEEREN,","tekst":"Dat is, den HEERE zelf, die zich in zijn woord en werken geopenbaard heeft. Alzo onder en Psa 20:2, en Psa 52:11, enz. Zie Deu 28:58."},{"catchword":"geen huis kon bouwen,","tekst":"Vergelijk Gen 28:17, Gen 28:22."},{"catchword":"zij hem omsingelden,","tekst":"Te weten, de vijanden, die hem oorlog aandeden."},{"catchword":"onder zijn voetzolen gaf","tekst":"Dat is, onderwierp en onder zijne heerschappij bracht. Zie een gelijke manier van spreken, Psa 8:7; 1Co 15:27; Eph 1:22."}],"4":[{"catchword":"bejegening van kwaad","tekst":"Of kwaad toeval, te weten, die mij verhinderen zou den Heere een huis te bouwen."}],"5":[{"catchword":"ik denk","tekst":"Hebreeuws, ik zeg; te weten, in mijn hart, gelijk zulk zeggen verklaard wordt, Gen 17:17; Psa 14:1, en Psa 36:2; Rom 10:6. Zeggen in mijn hart is zoveel als denken, overleggen, gevoelen, voornemen, besluiten. Zie Gen 20:11. De zin is hier dat Salomo niet alleen dacht, maar ook voornam en vastelijk besloot den Heere een huis te bouwen."}],"6":[{"catchword":"cederen","tekst":"Zie boven, 1Ki 4:33."},{"catchword":"Sidoniërs","tekst":"Inboorlingen en burgers der stad Sidon; van dewelke zie Gen 10:15."}],"7":[{"catchword":"Gezegend","tekst":"Zie Gen 14:20."}],"8":[{"catchword":"dennenhout","tekst":"Of, een soort van cederen, waarvan men pijlen, spiesen, kisten, muzikale instrumenten, enz. maakte. Anders, abelenhout. Zie van hetzelve 2Sa 6:5; onder, 1Ki 6:15, 1Ki 6:34; 2Ki 19:23; 2Ch 3:5."}],"9":[{"catchword":"Libanon","tekst":"Zie boven, 1Ki 4:33."},{"catchword":"aan de zee;","tekst":"Namelijk van Jaffo, of Joppe; 2Ch 2:16."},{"catchword":"doen voeren,","tekst":"Hebreeuws, doen leggen; dat is, ik zal het op vlotten leggen en over de zee doen voeren. Het is een Hebreeuwse manier van spreken, die dikwijls voorvalt. Zie Gen 12:15."},{"catchword":"die gij","tekst":"Hebreeuws, die gij mij zenden zult; dat is, door zending laten weten."},{"catchword":"los maken,","tekst":"Of, ontdoen, ontbinden. Het Hebreeuwse woord betekent eigenlijk iets verstrooien, verdelen, of losmaken van elkander; gelijk dit ook met de vlotten geschiedt."},{"catchword":"spijze geeft","tekst":"Hebreeuws, brood; waaronder ook andere spijs begrepen is, gelijk vs.11 uitwijst. Zie Gen 3:19. Daarom, ofschoon Tyrus en Sidon door de zeevaart rijke steden waren, zo hadden zij nochtans een dor land, dat niet veel vruchten voortbracht; om welke oorzaak zij uit andere landen met voorraad der spijs moesten geholpen zijn, en voornamelijk uit het land Israëls; Act 12:20."}],"11":[{"catchword":"kor tarwe,","tekst":"Zie van deze maat boven, 1Ki 4:22."},{"catchword":"kor gestoten olie;","tekst":"Uit deze plaats, alsook uit Eze 45:14, blijkt dat deze maat ook in natte waren gebruikt is geweest, hoewel zij eigenlijk is geweest van droge waren. Er staat 2Ch 2:10 van 20.000 bathen olie; idem worden nog hierbij gevoegd 20.000 kor gerst en 20.000 bathen wijns. Maar men houdt dat vs.11 en 2Ch 2:10 van verscheidene leveringen gesproken wordt; hier van hetgeen tot jaarlijkse onderhoud van Hirams huisgezin behoorde, en daar van hetgeen de werklieden behoefden."}],"13":[{"catchword":"uitschot","tekst":"Hierdoor wordt verstaan een schatting niet van goed of geld, maar van personen en mannen, die verkoren en opgenomen werden om op het gebergte Libanon, tot de bouwing van den tempel, hout te houwen, enz. Vergelijk onder, 1Ki 9:21, en de aantekeningen."}],"14":[{"catchword":"bij beurten;","tekst":"Hebreeuws, met veranderingen."},{"catchword":"was over dit uitschot","tekst":"Dat is, hij had last om dit uitschot op te nemen, of opzicht daarover te hebben nadat het opgenomen was; of beide was het hem toevertrouwd. Zie van dezen Adoniram ook boven, 1Ki 4:6."}],"15":[{"catchword":"zeventig duizend,","tekst":"Dezen waren vreemdelingen, gelijk te zien is 2Ch 2:17-18."},{"catchword":"houwers","tekst":"Het Hebreeuwse woord betekent zowel steenhouwers, 1Ch 22:2, als houthouwers, Ezr 3:7."}],"16":[{"catchword":"bestelden,","tekst":"Dat is, ambtlieden, officieren, commiezen. Vergelijk boven, 1Ki 4:5, en de aantekeningen."},{"catchword":"driehonderd,","tekst":"2Ch 2:2 staat zeshonderd, hetwelk aldus verstaan wordt, dat de driehonderd, hier nagelaten, de opzieners dezer oversten geweest zijn. Anderen menen dat er drieduizend en driehonderd waren over de lastdragende mannen en steenhouwers, en driehonderd over degenen, die in het gebergte Libanon bezig waren."}],"17":[{"catchword":"kostelijke stenen,","tekst":"Versta niet edelgesteenten, die ook aldus genoemd worden, onder, 1Ki 10:2, 1Ki 10:10, maar die van fatsoen en grootte zeer uitnemend waren."}],"18":[{"catchword":"de Giblieten","tekst":"Eeniger gevoelen is, dat dezen zijn geweest de inwoners der stad Gebal."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And Hiram [He is also called Hirom, below v.10 &18. also Haram, 2. Chron.2.3. and is to be distinguished from another Hiram, who was a skilful artificer, a widows son; of whom see below chap.17.13, 14. & 2 Chron.2.14.] King of Tyrus, [the Metropolis or chief city of Phaenicia, lying in the midland sea, seven hundred paces from the Continent or firm land, before Alexander the Great his time, very rich, mighty and renowned for their Navigation and Merchandise. See Isa.23. Item, chap.26, & 27, & 28.] sent his servants unto Salomon [to declare his joy, that Salomon was made King in his Fathers room, to obtain his friendship, and to enter into a Covenant with him; as it came to pass also: see ver.12.] (for he had heard that they had anointed Salomon King in the room of his Father,) because Hiram had ever [Heb. all the days] loved David. [or, been Davids friend, see 2 Sam.5.11. 1 Chron.chap.14. verse 1.]"}],"2":[{"catchword":null,"tekst":"After that, Salomon sent to Hiram, saying:"}],"3":[{"catchword":null,"tekst":"Thou knowest that David my father could not build an house [Compare Gen.28.on v.27. and 22.] unto the name of the LORD his God, [i.e. unto the LORD himself, who revealed himself in his word and works: so below, and Psa 20:2. and 52.11. &c. See Deut.28.on v.58.] because of the war, wherewith they [viz.the enemies that made war against him] compassed him about; until the LORD gave them under the soles of his feet. [i.e. subdued and brought them under his dominion. See the like phrase, Psa 8:7. 1 Cor.15.27. Eph.1.22.]"}],"4":[{"catchword":null,"tekst":"But now the LORD my God hath given me rest round about: there is no adversary, nor entreating of evil. [Or, evil occurrent: viz. which might hinder me from building the LORD an house.]"}],"5":[{"catchword":null,"tekst":"And behold, I purpose [Heb. I say, viz. In mine heart, as such saying is expounded, gen.17.17. Psal.14.1. & 36.2. Rom 10:6. saying in his heart, is as much as thinking, pondering, conceiving, purposing, concluding; see Gen.20.on v.11. And the meaning here is, that Salomon not onely thought, but also purposed, and firmly determined to build an house unto the LORD] to build an house for the Name of the LORD my God: according as the LORD spake unto David my father, saying; Thy son whom I will set upon thy throne in thy room, he shall build that house unto my Name. [see 2 Sam.7.13. 2 Chron.22 10.]"}],"6":[{"catchword":null,"tekst":"Now then command that they hew me Cedars [See above chap.4.on v.33.] out of Lebanon, and my servants shall be with thy servants, and I will give the hire of thy servants unto thee, according to all that thou shalt say: for thou knowest, that (there) is none among us, that knoweth to hew wood, like unto the Sidonians. [i.e. the Natives and Citizens of the city of Zidon: of which see Gen.10.on v.15.]"}],"7":[{"catchword":null,"tekst":"And it came to pass, when Hiram had heard the words of Salomon, that he rejoiced greatly: and said, Blessed [see gen.14.on v.20.] be the Lord this day, who hath given unto David a wise son, over this great people."}],"8":[{"catchword":null,"tekst":"And Hiram sent unto Salomon, saying; I have heard whereof thou hast sent unto me: I will do all thy will concerning Cedar-wood, and concerning Fir-wood. [Or, a sort of Cedars, of which they made Arrows, Lances, Chests, Musical Instruments, &c. Others Poplar-wood: see of this 2 Sam.6.5. below chap.6.15, 34. 2 King.19.23. 2 Chron.3.5.]"}],"9":[{"catchword":null,"tekst":"My servants shall bring them down from Libanon [See above chap.4.on v.33.] unto the sea, [viz. of Japho, or Joppe, 2 Chron.2.16.] and I will cause them to be carried over the sea in floats [Heb. cause them to be laid, etc.i.e. I will lay them on floats, and cause them to be transported by sea. It is an Hebrew phrase, which often occurreth, see Gen.12.on ver.15.] unto the place that thou shalt signifie unto me, [Heb. that thou shalt send me: by sending, acquaint me, or let me know] and will loosen [or, undo, untie. The Hebrew word signifieth properly to scatter, divide, loosen one thing from another: as this also is done with the floats] them there, and thou shalt take them away; thou shalt also do my will, that thou give food [Heb. bread: under which other food is likewise comprehended, as the 11. verse sheweth: see Gen.3 on verse 19.] for my house. [Although Tyre and Zidon were rich cities, in respect of navigation, yet they had but a dry and barren country that they yielded not much fruit, for which cause they were to be furnished with provision of food out of other countries, and especially out of the Land of Israel, Act.12.20.]"}],"10":[{"catchword":null,"tekst":"So Hiram gave Salomon Cedar-wood, and Fir-wood (according to) all his will."}],"11":[{"catchword":null,"tekst":"And Salomon gave Hiram twenty thousand Cor[See of this measure above chap.4.on ver.22.] of Wheat, for food of his house, and twenty Cor of beaten oil: [It appeareth by this place, as also by Ezek 45.14. that this measure was likewise used in liquid wares, although it was properly of dry wares, 2 Chron.2.10. mention is made of twenty thousand baths of oil: Item, hereunto are yet added twenty thousand Cor of Barley; and twenty thousand haths of wine. But it&acirc;&euro;&trade;s conceived, that both here, and 2 Chron.2.10. is spoken of divers delivering in: here, of that which belonged to the yearly maintenance of Hirams household; and there, of that which the work-folks and labourers had need of] such gave Salomon to Hiram year by year."}],"12":[{"catchword":null,"tekst":"The LORD then gave Salomon wisdom, according as he had spoken unto him: [See 1 King.3.12.] and there was peace between Hiram, and between Salomon, and they both made a Covenant."}],"13":[{"catchword":null,"tekst":"And King Salomon raised a Leavie out of all Israel, and the Leavie was thirty thousand men. [By Leavy here is meant a Tax, not of goods, or monies, but of persons and men, that were chosen and taken up, to hew wood, &c. upon mount Libanon, for the building of the Temple. Compare below chap.9.21. and the annotations.]"}],"14":[{"catchword":null,"tekst":"And he sent then to Libanon ten thousand a month by turns, [Heb. with changes] a month they were in Libanon, two months every man in his (own) house; and Adoniram was over this Leavie. [i.e. He had a charge to raise this Leavie, or to be an Overseer thereof, after it was raised, or he was put in trust for both. See likewise of this Adoniram above chap.4 6.]"}],"15":[{"catchword":null,"tekst":"Besides, Salomon had threescore and ten thousand that bare burdens: [These were strangers, as appeareth 2 Chron.2.17.18.] and fourscore thousand hewers [The Hebrew word signifieth as well hewers of stone, 1 Chron.22.2. as hewers of wood, Eze 3:7.] on the mountains."}],"16":[{"catchword":null,"tekst":"Besides the Commanders of Salomons appointed men [i.e. Officers, Commissioners, Overseers. Compare above chap.4.5. and the annotat.] which were over that work, three thousand and three hundred [2 Chron.2.2. is mentioned six hundred, which is thus understood, that the three hundred here omitted, were the overseers of these Commanders. Some conceive that there were three thousand and three hundred over those that carried burdens, and hewed stone, and three hundred over those that were employed in mount Libanon] which ruled over the people that did that work."}],"17":[{"catchword":null,"tekst":"Now when the King commanded, then they brought great stones, costly stones, [understand, not precious stones, which are likewise so called below chap.10. ver.2, 10.] but such as were eminent for size and greatness] bewed stones, to lay the foundation of that house."}],"18":[{"catchword":null,"tekst":"And Salomon builders, and Hirams builders, and the Giblites [The opinion of some is, that these were the Inhabitants of the city of Gebal, which lay by Zidon in Phenicia: of which see Psal.83.8. & Eze 27:9. It&acirc;&euro;&trade;s conceived likewise that Gilblin was the name of name famous Artificers in stone-works] did hew them, and prepared the wood, and the stones, to build that house."}]}}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"

const BASIS_URL = D.meta.basis_url;

let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +

// popup positioneren bij een element

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;

function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;

document.addEventListener('click', e => {

  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
