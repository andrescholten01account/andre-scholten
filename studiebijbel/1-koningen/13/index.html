Moet ik er niet op letten te spreken wat de HEERE in mijn mond gelegd heeft?","Num 7:89":"En toen Mozes de tent van de samenkomst inging om met Hem te spreken, hoorde hij een stem tot hem spreken, van boven het verzoendeksel dat op de ark van de getuigenis was, van tussen de twee cherubs. Zo sprak Hij tot hem.","1 Petr 4:18":"En als de rechtvaardige nauwelijks behouden wordt, waar zal dan de goddeloze en de zondaar verschijnen?","Hand 3:18":"Maar God heeft zo vervuld wat Hij door de mond van al Zijn profeten van tevoren had verkondigd, dat de Christus zou lijden.","2 Kron 26:18":"En zij weerstonden de koning Uzzia, en zeiden tegen hem: Het komt u niet toe, Uzzia, om de HEERE te roken, maar aan de priesters, de zonen van Aäron, die geheiligd zijn om te roken; ga uit het heiligdom, want u hebt overtreden, en het zal u niet tot eer zijn van de HEERE God.","Richt 13:25":"En de Geest van de HEERE begon hem soms te drijven in het leger van Dan, tussen Zora en Esthaol.","Gen 19:11":"En zij sloegen de mannen die bij de deur van het huis waren met blindheid, van de kleinste tot de grootste, zodat zij moe werden bij het zoeken naar de deur.","Gen 3:4":"Toen zei de slang tegen de vrouw: U zult zeker niet sterven;","2 Kon 4:27":"Toen zij nu bij de man Gods op de berg kwam, greep zij zijn voeten vast. Maar Gehazi kwam dichterbij om haar weg te duwen. Maar de man Gods zei: Laat haar begaan; want haar ziel is in haar bitter bedroefd, en de HEERE heeft het voor mij verborgen, en het mij niet verteld.","Hab 3:2":"HEERE! Toen ik Uw rede gehoord heb, ben ik bevreesd geworden; Uw werk, o HEERE! Behoud dat in het leven in het midden van de jaren, maak het bekend in het midden van de jaren; gedenk in de toorn aan het ontfermen.","Jer 11:1":"Het woord dat tot Jeremia gebeurd is, van de HEERE, en Hij zei:","Ezra 4:10":"en de overige volken die de grote en vermaarde Asnappar heeft weggevoerd en heeft laten wonen in de stad Samaria, ook de overigen aan deze kant van de rivier, en zo verder.","Lev 10:2":"Toen ging er een vuur uit van het aangezicht van de HEERE, en verteerde hen; en zij stierven voor het aangezicht van de HEERE.","Ezech 40:1":"In het vijfentwintigste jaar van onze wegvoering, in het begin van het jaar, op de tiende van de maand, in het veertiende jaar nadat de stad was ingenomen, op diezelfde dag was de hand van de HEERE op mij, en Hij bracht mij daarheen.","Ezech 11:1":"Toen tilde de Geest mij op en bracht mij naar de Oostpoort van het huis van de HEERE, die oostwaarts ziet; en zie, aan de deur van de poort waren vijfentwintig mannen, en in hun midden zag ik Jaazanja, de zoon van Azzur, en Pelatja, de zoon van Benaja, vorsten van het volk.","Hos 8:6":"Want ook dat komt uit Israël; een vakman heeft het gemaakt, en het is geen God, maar het zal in stukken worden gebroken, het kalf van Samaria.","Jona 3:2":"Maak u op, ga naar de grote stad Nineve, en predik tegen haar de prediking, die Ik tot u spreek.","1 Sam 9:7":"Toen zei Saul tegen zijn knecht: Maar zie, als wij gaan, wat zullen we die man dan brengen? Want het brood is op uit onze zakken, en wij hebben geen geschenk om de man van God te brengen; wat hebben wij?","Jer 5:12":"Zij verloochenen de HEERE, en zeggen: Hij is het niet, en ons zal geen kwaad overkomen, wij zullen geen zwaard en geen honger zien.","Job 34:32":"Behalve wat ik zie, leer Gij mij; heb ik onrecht gewrocht, ik zal het niet meer doen.","Dan 6:28":"Hij verlost en redt, en Hij doet tekenen en wonderen in de hemel en op de aarde; Hij heeft Daniël uit de macht van de leeuwen verlost.","Jer 26:1":"In het begin van het koningschap van Jojakim, de zoon van Josia, koning van Juda, kwam dit woord van de HEERE, en Hij zei:","Klaagl 3:20":"Zain. Mijn ziel denkt er wel terdege aan, en zij buigt zich neer in mij.","2 Kon 6:18-20":"Toen zij nu naar hem afkwamen, bad Elisa tot de HEERE, en zei: Sla toch dit volk met verblindheid. En Hij sloeg hen met verblindheid, naar het woord van Elisa. Toen zei Elisa tegen hen: Dit is de weg niet, en dit is de stad niet; volg mij, en ik zal u leiden tot de man die u zoekt; en hij leidde hen naar Samaria. En het gebeurde, toen zij in Samaria gekomen waren, dat Elisa zei: HEERE, open de ogen van dezen, dat zij zien! En de HEERE opende hun ogen, dat zij zagen; en zie, zij waren midden in Samaria.","1 Sam 10:11":"En het gebeurde, toen ieder die hem vroeger gekend had, zag dat hij, zie, profeteerde met de profeten, dat het volk zei, de een tegen de ander: Wat is dit, dat de zoon van Kis is overkomen? Is Saul ook onder de profeten?","Ex 25:22":"En daar zal Ik bij u komen, en Ik zal met u spreken van boven het verzoendeksel af, van tussen de twee cherubs die op de ark van de getuigenis zullen zijn, alles wat Ik u gebieden zal aan de kinderen van Israël.","Jes 35:9":"Er zal geen leeuw zijn, en geen verscheurend gedierte zal daarop komen, en het zal daar niet gevonden worden; maar de verlosten zullen daarop wandelen.","Luk 19:40":"En Hij antwoordde en zei tegen hen: Ik zeg u dat, als dezen zwijgen, de stenen het meteen zullen uitroepen.","Ezech 2:2":"Zo kwam in mij, toen Hij tot mij sprak, de Geest, Die mij op mijn voeten zette; en ik hoorde Hem, Die tot mij sprak.","Joh 4:6":"En daar was de fontein van Jakob. Jezus dan, vermoeid van de reis, ging zo bij de fontein zitten. Het was ongeveer het zesde uur.","Jer 5:23":"Maar dit volk heeft een afvallig en opstandig hart; zij zijn afgevallen en weggegaan;","1 Kon 13:29-32":"Toen nam de profeet het dode lichaam van de man van God op, en legde het op de ezel, en bracht het terug; zo kwam de oude profeet in de stad om rouw te bedrijven en hem te begraven. En hij legde zijn dode lichaam in zijn eigen graf; en zij weeklaagden over hem: Ach, mijn broeder! Het gebeurde nu, nadat hij hem begraven had, dat hij sprak tot zijn zonen, en zei: Als ik gestorven ben, begraaf mij dan in dat graf waarin de man van God begraven is, en legt mijn beenderen bij zijn beenderen.","Luk 6:27":"Maar Ik zeg u die luistert: Heb uw vijanden lief; doe goed aan hen die u haten.","1 Kon 16:2":"Omdat Ik u uit het stof heb verheven, en u tot een voorganger over Mijn volk Israël heb aangesteld, en u gewandeld hebt in de weg van Jerobeam, en Mijn volk Israël hebt doen zondigen, en Mij tot toorn hebt verwekt door hun zonden;","Num 24:2-4":"Toen Bileam zijn ogen ophief en Israël zag, wonend naar zijn stammen, kwam de Geest van God op hem. En hij hief zijn spreuk op en zei: Bileam, de zoon van Beor, spreekt, en de man wiens ogen geopend zijn, spreekt! Die hoort de woorden van God, spreekt, die het gezicht van de Almachtige ziet; die in verrukking valt, en wiens ogen geopend worden!","Ps 78:34":"Toen Hij hen doodde, zochten zij Hem, en keerden weer, en zochten God vroeg;","2 Kon 5:5":"Toen zei de koning van Syrië: Ga heen, kom, en ik zal een brief aan de koning van Israël sturen. En hij ging heen, en nam in zijn hand tien talenten van het zilver, en zesduizend sikkelen goud, en tien stellen kleren.","Num 1:1":"Verder sprak de HEERE tot Mozes, in de woestijn van Sinaï, in de tent van de samenkomst, op de eerste dag van de tweede maand, in het tweede jaar nadat zij uit het land Egypte vertrokken waren, en Hij zei:","Hebr 12:28":"Daarom, omdat wij een onwankelbaar Koninkrijk ontvangen, laten wij de genade vasthouden, waardoor wij God welgevallig mogen dienen, met eerbied en godsvrucht.","Ps 119:71":"Het is mij goed, dat ik verdrukt ben geweest, opdat ik Uw inzettingen leerde.","1 Kon 13:3-5":"En hij gaf op dezelfde dag een wonderteken, en zei: Dit is het wonderteken waarvan de HEERE gesproken heeft: Zie, het altaar zal vaneen scheuren, en de as die erop ligt, zal eraf gestort worden. Het gebeurde nu, toen de koning het woord van de man van God hoorde, dat hij tegen het altaar te Beth-el geroepen had, dat Jerobeam zijn hand van het altaar uitstrekte en zei: Grijpt hem! Maar zijn hand die hij tegen hem uitgestrekt had, verdorde, zodat hij ze niet meer naar zich toe kon trekken. En het altaar scheurde vaneen, en de as werd van het altaar afgestort, volgens het wonderteken dat de man van God gegeven had, door het woord van de HEERE.","Hand 2:2-4":"En er kwam plotseling uit de hemel een geluid, als van een geweldige, gedreven wind, en het vervulde het hele huis waar zij zaten. En er werden door hen verdeelde tongen gezien, als van vuur, en het zat op ieder van hen. En zij werden allen vervuld met de Heilige Geest, en begonnen te spreken met andere talen, zoals de Geest hun gaf uit te spreken.","Hos 12:11":"En Ik zal spreken tot de profeten, en Ik zal het gezicht vermenigvuldigen; en door de dienst van de profeten zal Ik gelijkenissen voorstellen.","Ex 10:7":"En de knechten van Farao zeiden tegen hem: Hoe lang zal deze man ons tot een valstrik zijn? Laat de mannen gaan, dat zij de HEERE, hun God, dienen! Weet u nog niet dat Egypte verloren is?","Hebr 3:5":"En Mozes is wel trouw geweest in heel Zijn huis, als een dienaar, tot getuigenis van de dingen die daarna gesproken zouden worden;","Num 1:51":"En als de tabernakel zal optrekken, zullen de Levieten hem afbreken; en wanneer de tabernakel neergezet moet worden, zullen de Levieten hem oprichten; en de vreemde die daarbij komt, zal gedood worden.","1 Kon 16:26":"En hij wandelde in alle wegen van Jerobeam, de zoon van Nebat, en in zijn zonden, waarmee hij Israël had doen zondigen, en verwekte de HEERE, de God van Israël, tot toorn, door hun nietige afgoden.","Gen 42:21":"Toen zeiden zij de één tegen de ander: Voorwaar, wij zijn schuldig aan onze broer, wiens angst van zijn ziel wij zagen, toen hij ons om genade smeekte; maar wij luisterden niet! Daarom komt deze benauwdheid over ons.","Deut 32:1":"Neig de oren, hemel, en ik zal spreken; en de aarde hoort de woorden van mijn mond.","1 Sam 19:23":"Toen ging hij daarheen naar Najoth bij Rama; en dezelfde Geest van God kwam ook op hem, en al voortgaande profeteerde hij, totdat hij in Najoth in Rama aankwam.","Richt 14:6":"Toen kwam de Geest van de HEERE machtig over hem, zodat hij hem uiteenscheurde, zoals men een bokje uiteenscheurt, en er was niets in zijn hand; maar hij vertelde zijn vader en zijn moeder niet wat hij gedaan had.","1 Kon 18:46":"En de hand van de HEERE was op Elia, en hij gordde zijn lenden, en liep voor het aangezicht van Achab uit, tot waar men bij Jizreël komt.","Num 14:32":"Maar wat u betreft, uw dode lichamen zullen in deze woestijn vallen!","1 Kon 12:31-33":"Hij maakte ook een huis der hoogten; en maakte priesters van de geringste mensen van het volk, die niet uit de zonen van Levi waren. En Jerobeam maakte een feest in de achtste maand, op de vijftiende dag van de maand, gelijk het feest dat in Juda was, en offerde op het altaar; op dezelfde manier deed hij te Beth-el, terwijl hij de kalveren offerde die hij gemaakt had; hij stelde ook te Beth-el priesters der hoogten aan, die hij gemaakt had. En hij offerde op het altaar, dat hij te Beth-el gemaakt had, op de vijftiende dag van de achtste maand, van de maand die hij uit zijn eigen hart bedacht had; zo maakte hij voor de kinderen van Israël een feest, en offerde op dat altaar, en bracht reukwerk.","Num 21:7":"Daarom kwam het volk tot Mozes, en zij zeiden: Wij hebben gezondigd, omdat wij tegen de HEERE en tegen u gesproken hebben; bid tot de HEERE, dat Hij deze slangen van ons wegneemt. Toen bad Mozes voor het volk.","Openb 14:13":"En ik hoorde een stem uit de hemel, die tegen mij zei: Schrijf, zalig zijn de doden die in de Heere sterven, van nu aan. Ja, zegt de Geest, opdat zij rusten van hun arbeid; en hun werken volgen met hen.","Jer 38:4-6":"Toen zeiden de vorsten tegen de koning: Laat toch deze man gedood worden; want zo maakt hij de handen van de krijgslieden die in deze stad zijn overgebleven, en de handen van het hele volk slap, doordat hij zulke woorden tot hen spreekt; want deze man zoekt niet de vrede van dit volk, maar het kwaad. En de koning Zedekia zei: Zie, hij is in uw hand; want de koning kan niets tegen u. Toen namen zij Jeremia en wierpen hem in de kuil van Malchia, de zoon van Hammelech, die in het voorhof van de bewaking was, en zij lieten Jeremia met touwen zakken; in de kuil nu was geen water, maar slijk; en Jeremia zonk in het slijk.","Hagg 1:13":"Toen sprak Haggai, de bode van de HEERE, in de boodschap van de HEERE, tot het volk, en hij zei: Ik ben met u, spreekt de HEERE.","Hebr 11:34":"de kracht van het vuur hebben geblust, aan de scherpte van het zwaard zijn ontkomen, vanuit zwakheid kracht hebben gekregen, in de strijd sterk zijn geworden, legers van vreemden op de vlucht hebben gebracht;","Joël 2:28":"En daarna zal het gebeuren, dat Ik Mijn Geest zal uitgieten over alle vlees, en uw zonen en uw dochters zullen profeteren; uw ouden zullen dromen dromen, uw jongelingen zullen gezichten zien;","1 Sam 9:6":"Hij daarentegen zei tegen hem: Zie toch, er is een man van God in deze stad, en hij is een geëerd man; alles wat hij zegt, komt zeker uit; laten wij nu daarheen gaan, misschien zal hij ons onze weg aanwijzen, die wij gaan zullen.","1 Kon 20:33":"De mannen namen dat nauwkeurig waar, en vatten het snel op, of het van hem was, en zeiden: Uw broeder Benhadad leeft. En hij zei: Komt, brengt hem. Toen kwam Benhadad naar hem uit, en hij liet hem op de wagen klimmen.","Richt 6:11":"Toen kwam een Engel van de HEERE, en ging zitten onder de eik die in Ofra is, die aan Joas, de Abiëzriet, toebehoorde; en zijn zoon Gideon dorste tarwe bij de wijnpers, om die te verbergen voor de Midianieten.","Hand 2:30":"Omdat hij dan een profeet was, en wist dat God hem met een eed gezworen had dat Hij uit de vrucht van zijn lichaam, wat het vlees betreft, de Christus zou verwekken om Hem op zijn troon te zetten;","Ex 8:13":"En de HEERE deed naar het woord van Mozes; en de kikkers stierven, uit de huizen, uit de voorzalen, en uit de velden.","Jer 26:20-23":"Er was ook een man, die in de Naam van de HEERE profeteerde, Uria, de zoon van Semaja, van Kirjath-jearim; die profeteerde tegen deze stad en tegen dit land, naar al de woorden van Jeremia. En toen de koning Jojakim, alsook al zijn geweldigen, en al de vorsten zijn woorden hoorden, zocht de koning hem te doden; toen Uria dat hoorde, vreesde hij, en vluchtte, en kwam in Egypte; Maar de koning Jojakim zond mannen naar Egypte, Elnathan, de zoon van Achbor, en andere mannen met hem, naar Egypte;","1 Sam 10:10":"Toen zij daar bij de heuvel kwamen, zie, toen kwam hem een groep profeten tegemoet; en de Geest van de HEERE werd vaardig over hem, en hij profeteerde in hun midden.","Jer 23:25-27":"Ik heb gehoord wat de profeten zeggen, die in Mijn Naam leugen profeteren, en zeggen: Ik heb gedroomd, ik heb gedroomd. Hoe lang? Is er dan een droom in het hart van de profeten, die de leugen profeteren? Ja, het zijn profeten van de bedriegerij van hun eigen hart. Die daar denken om Mijn volk Mijn Naam te doen vergeten, door hun dromen, die zij, ieder aan zijn naaste, vertellen; net zoals hun vaders Mijn Naam vergeten hebben door Baäl.","Rom 1:2":"(Wat Hij van tevoren beloofd had door Zijn profeten, in de heilige Schriften),","Ps 103:7":"Hij heeft Mozes Zijn wegen bekendgemaakt, aan de kinderen van Israël Zijn daden.","2 Joh 1:10":"Als iemand tot u komt en deze leer niet brengt, ontvang hem niet in huis, en zeg tegen hem niet: wees gegroet.","Zach 1:1":"In de achtste maand, in het tweede jaar van Darius, kwam het woord van de HEERE tot Zacharia, de zoon van Berechja, de zoon van Iddo, de profeet, en hij zei:","Num 9:8-10":"En Mozes zei tot hen: Blijf staan, dat ik hoor wat de HEERE u gebieden zal. Toen sprak de HEERE tot Mozes en zei: Spreek tot de kinderen van Israël en zeg: Wanneer iemand onder u, of onder uw geslachten, onrein is door een dood lichaam, of op een verre reis zal zijn, dan zal hij toch de HEERE het pascha houden.","2 Kon 5:8":"Maar het gebeurde, toen Elisa, de man van God, gehoord had dat de koning van Israël zijn kleren had gescheurd, dat hij naar de koning stuurde, om te zeggen: Waarom hebt u uw kleren gescheurd? Laat hem nu naar mij toe komen, dan zal hij weten dat er een profeet in Israël is.","Gen 41:38":"Toen zei Farao tegen zijn dienaars: Zouden wij wel een man vinden zoals deze, in wie de Geest van God is?","Ex 35:35":"Hij heeft hen vervuld met wijsheid van hart, om alle werk te maken van een werkmeester, en van de allervernuftigste handwerker, en van de borduurder in hemelsblauw, en in purper, in scharlaken, en in fijn linnen, en van de wever; die alle werk maken, en vernuftig werk bedenken.","Ex 5:6":"Daarom beval Farao, op dezelfde dag, aan de aandrijvers onder het volk, en hun opzichters, en zei:","Joh 15:10":"Als u Mijn geboden bewaart, dan zult u in Mijn liefde blijven; zoals Ik de geboden van Mijn Vader bewaard heb, en blijf in Zijn liefde.","Ex 8:8":"En Farao riep Mozes en Aäron, en zei: Bid vurig tot de HEERE, dat Hij de kikkers van mij en van mijn volk wegneemt; dan zal ik het volk laten trekken, opdat zij de HEERE offeren.","Hebr 1:1":"Nadat God voortijds veelmaal en op velerlei wijze tot de vaderen gesproken heeft door de profeten, heeft Hij in deze laatste dagen tot ons gesproken door de Zoon;","2 Kon 3:15":"Nu dan, brengt mij een speelman. En het gebeurde, toen de speelman op de snaren speelde, dat de hand van de HEERE op hem kwam.","2 Kon 5:15":"Toen keerde hij terug naar de man van God, hij en zijn hele leger, en kwam, en stond voor zijn aangezicht en zei: Zie, nu weet ik dat er geen God is op de hele aarde, dan alleen in Israël! Neem dan nu toch een geschenk aan van uw knecht.","Richt 6:7-10":"En het gebeurde, toen de Israëlieten tot de HEERE riepen vanwege de Midianieten, dat de HEERE een man zond, die een profeet was, naar de Israëlieten; die zei tegen hen: Zo zegt de HEERE, de God van Israël: Ik heb u uit Egypte doen optrekken, en u uit het slavenhuis uitgeleid; en Ik heb u verlost uit de hand van de Egyptenaren, en uit de hand van allen die u onderdrukten; en Ik heb hen voor uw ogen verdreven, en u hun land gegeven;","Hebr 11:33":"die door het geloof koninkrijken hebben overwonnen, gerechtigheid gedaan, de beloften verkregen, de muilen van de leeuwen toegestopt,","Hand 28:25":"En omdat zij het onderling oneens waren, gingen zij uiteen, nadat Paulus dit ene woord gezegd had, namelijk: Terecht heeft de Heilige Geest gesproken door de profeet Jesaja tot onze voorvaders,","Ex 4:12":"En nu ga heen, en Ik zal met uw mond zijn, en zal u leren, wat u spreken zult.","Openb 10:7":"maar in de dagen van de stem van de zevende engel, wanneer hij zal bazuinen, dan zal het geheimenis van God vervuld worden, zoals Hij aan Zijn dienstknechten, de profeten, verkondigd heeft.","Ex 10:16":"Toen haastte Farao zich om Mozes en Aäron te roepen, en zei: Ik heb gezondigd tegen de HEERE, uw God, en tegen u.","Openb 2:7":"Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, hem zal Ik geven te eten van de boom des levens, die in het midden van het paradijs van God is.","Hand 11:28":"En een van hen, met de naam Agabus, stond op en maakte door de Geest bekend dat er een grote hongersnood zou komen over de hele wereld; die is ook gekomen onder keizer Claudius.","1 Kron 28:12":"en een bereiding van alles wat bij hem was door de Geest, namelijk van de voorhoven van het huis van de HEERE, en van alle kamers rondom; van de schatten van het huis van God, en van de schatten van de heilige dingen;","1 Kon 12:33":"En hij offerde op het altaar, dat hij te Beth-el gemaakt had, op de vijftiende dag van de achtste maand, van de maand die hij uit zijn eigen hart bedacht had; zo maakte hij voor de kinderen van Israël een feest, en offerde op dat altaar, en bracht reukwerk.","Jer 42:7":"En het gebeurde na tien dagen, dat het woord van de HEERE tot Jeremia kwam.","Job 32:8":"Zeker, de geest die in de mens is, en de inblazing van de Almachtige, maakt hen verstandig.","1 Kon 12:30":"En deze zaak werd tot zonde; want het volk ging heen voor het ene, tot Dan toe.","Ex 10:17":"En nu, vergeef mij toch mijn zonde alleen deze keer, en bid vurig tot de HEERE, uw God, dat Hij alleen deze dood van mij wegneemt.","1 Kon 13:1-24":"En zie, een man van God kwam uit Juda, door het woord van de HEERE, naar Beth-el; en Jerobeam stond bij het altaar om te roken. En hij riep tegen het altaar, door het woord van de HEERE, en zei: Altaar, altaar, zo zegt de HEERE: Zie, er zal aan het huis van David een zoon geboren worden, wiens naam Josia zal zijn; die zal op u de priesters van de hoogten offeren, die op u roken, en men zal mensenbeenderen op u verbranden. En hij gaf op dezelfde dag een wonderteken, en zei: Dit is het wonderteken waarvan de HEERE gesproken heeft: Zie, het altaar zal vaneen scheuren, en de as die erop ligt, zal eraf gestort worden.","2 Kon 2:24":"En hij keerde zich achterom, en hij zag hen, en vervloekte hen, in de Naam van de HEERE. Toen kwamen er twee berinnen uit het woud, en verscheurden van hen tweeënveertig kinderen.","2 Kron 9:29":"Het overige nu van de geschiedenissen van Salomo, van de eerste tot de laatste, is dat niet geschreven in de woorden van Nathan, de profeet, en in de profetie van Ahia, de Siloniet, en in de gezichten van Jedi, de ziener, over Jerobeam, de zoon van Nebat?","Jer 18:1":"Het woord dat van de HEERE tot Jeremia gebeurde, en Hij zei:","Openb 3:9":"Zie, Ik geef u er sommigen uit de synagoge van de satan, van hen die zeggen dat zij Joden zijn, en het niet zijn, maar liegen; zie, Ik zal maken dat zij zullen komen, en aanbidden voor uw voeten, en erkennen dat Ik u liefheb.","Joh 15:9":"Zoals de Vader Mij liefgehad heeft, heb Ik ook u liefgehad; blijft in deze Mijn liefde.","1 Kon 19:9":"En hij kwam daar in een grot, en overnachtte daar; en zie, het woord van de HEERE kwam tot hem, en Hij zei tegen hem: Wat doet u hier, Elia?","Gen 18:5":"En ik zal een stuk brood halen, dat U Uw hart sterkt; daarna kunt U verdergaan, want daarom bent U immers naar Uw knecht gekomen. En zij zeiden: Doe zoals u gesproken hebt.","2 Kon 5:26":"Maar hij zei tegen hem: Ging mijn hart niet mee, toen die man zich van zijn wagen omkeerde, u tegemoet? Was dit het moment om dat zilver aan te nemen, en om kleren aan te nemen, en olijfbomen, en wijngaarden, en schapen, en runderen, en knechten, en dienstmaagden?","Richt 10:10":"Toen riepen de Israëlieten tot de HEERE en zeiden: Wij hebben tegen U gezondigd, omdat wij onze God hebben verlaten en de Baäls gediend hebben.","2 Kron 33:13":"En bad tot Hem; en Hij liet Zich door hem verbidden, en hoorde zijn smeking, en Hij bracht hem terug naar Jeruzalem, in zijn koninkrijk. Toen erkende Manasse, dat de HEERE God is.","Job 38:11":"En zei: Tot hiertoe zult u komen, en niet verder, en hier zal hij zich stellen tegen de hoogmoed van uw golven.","1 Kon 12:26-33":"En Jerobeam zei in zijn hart: Nu zal het koninkrijk weer naar het huis van David terugkeren. Als dit volk zal opgaan om offers te brengen in het huis van de HEERE te Jeruzalem, dan zal het hart van dit volk terugkeren naar hun heer, naar Rehabeam, de koning van Juda; ja, zij zullen mij doden, en terugkeren naar Rehabeam, de koning van Juda. Daarom hield de koning een raad, en maakte twee gouden kalveren; en hij zei tegen hen: Het is voor u teveel om naar Jeruzalem op te gaan; zie uw goden, o Israël, die u uit het land Egypte hebben opgevoerd.","Jes 42:9":"Zie, de vroegere dingen zijn gekomen, en nieuwe dingen verkondig Ik; voordat ze uitspruiten, doe Ik u die horen.","1 Kon 13:1-10":"En zie, een man van God kwam uit Juda, door het woord van de HEERE, naar Beth-el; en Jerobeam stond bij het altaar om te roken. En hij riep tegen het altaar, door het woord van de HEERE, en zei: Altaar, altaar, zo zegt de HEERE: Zie, er zal aan het huis van David een zoon geboren worden, wiens naam Josia zal zijn; die zal op u de priesters van de hoogten offeren, die op u roken, en men zal mensenbeenderen op u verbranden. En hij gaf op dezelfde dag een wonderteken, en zei: Dit is het wonderteken waarvan de HEERE gesproken heeft: Zie, het altaar zal vaneen scheuren, en de as die erop ligt, zal eraf gestort worden.","Dan 2:19":"Toen werd aan Daniël in een nachtvisioen het geheim geopenbaard; toen loofde Daniël de God van de hemel.","Ex 5:3":"Zij dan zeiden: De God van de Hebreeën is ons ontmoet; laat ons toch heengaan, de weg van drie dagen in de woestijn, en de HEERE, onze God, offeren, zodat Hij ons niet overkomt met pest, of met het zwaard.","2 Kron 15:1":"Toen kwam de Geest van God op Azaria, de zoon van Oded.","1 Tess 4:15":"Want dit zeggen wij u door het Woord van de Heere, dat wij, die levend overblijven tot de komst van de Heere, hen die ontslapen zijn niet zullen voorgaan.","2 Kor 11:10":"De waarheid van Christus is in mij: dat deze roem in de gewesten van Achaje aan mij niet verhinderd zal worden.","Jak 5:16":"Belijd elkaar de misdaden, en bid voor elkaar, opdat u gezond wordt; een krachtig gebed van de rechtvaardige vermag veel.","1 Kon 13:11-32":"Er woonde nu een oude profeet te Beth-el; en zijn zoon kwam en vertelde hem al het werk dat de man van God die dag in Beth-el gedaan had, met de woorden die hij tegen de koning gesproken had; dat vertelden zij ook aan hun vader. En hun vader zei tegen hen: Welke weg is hij gegaan? En zijn zonen hadden de weg gezien waarlangs de man van God gegaan was, die uit Juda gekomen was. Toen zei hij tegen zijn zonen: Zadelt mij de ezel. En zij zadelden hem de ezel, en hij reed erop.","1 Kon 20:35":"Toen zei een man uit de zonen van de profeten tegen zijn naaste, door het woord van de HEERE: Sla mij toch. En de man weigerde hem te slaan.","2 Kron 20:14":"Toen kwam de Geest van de HEERE in het midden van de samenkomst, op Jahaziël, de zoon van Zecharja, de zoon van Benaja, de zoon van Jehiël, de zoon van Matthanja, de Leviet, uit de zonen van Asaf;","2 Petr 1:21":"Want de profetie is vroeger nooit voortgebracht door de wil van een mens, maar de heilige mensen van God hebben gesproken, gedreven door de Heilige Geest.","Jer 22:18":"Daarom zegt de HEERE zo van Jojakim, zoon van Josia, koning van Juda: Zij zullen hem niet beklagen: Och, mijn broeder! of, och, zuster! Zij zullen hem niet beklagen: Och, heer! of, och, zijn majesteit!","Luk 1:15":"Want hij zal groot zijn voor de Heere; hij zal geen wijn en geen sterke drank drinken, en hij zal met de Heilige Geest vervuld worden, al vanaf de moederschoot.","Dan 10:7-9":"En ik, Daniël, zag alleen dat gezicht, maar de mannen die bij mij waren, zagen dat gezicht niet; maar er viel een grote schrik op hen, en zij vluchtten om zich te verbergen. Ik dan bleef alleen achter, en zag dit grote gezicht, en er bleef in mij geen kracht over; en mijn schoonheid veranderde in verval, zodat ik geen kracht behield. En ik hoorde de stem van Zijn woorden; en toen ik de stem van Zijn woorden hoorde, viel ik in een diepe slaap op mijn gezicht, met mijn gezicht op de grond.","Richt 19:21":"En hij bracht hem in zijn huis, en gaf voer aan de ezels; en nadat zij hun voeten gewassen hadden, aten en dronken zij.","1 Sam 4:18":"En het gebeurde, toen hij de ark van God noemde, dat hij achterover van de stoel viel, bij de kant van de poort, en zijn nek brak, en stierf; want de man was oud en zwaar. En hij had Israël veertig jaar geleid.","Jer 31:19":"Zeker, nadat ik bekeerd ben, heb ik berouw gehad, en nadat ik mijzelf ben bekendgemaakt, heb ik op de heup geklopt, ik ben beschaamd, ja, ook schaamrood geworden, omdat ik de smaad van mijn jeugd gedragen heb.","1 Petr 5:2":"Weid de kudde van God die onder u is, en houd daar toezicht op, niet uit dwang, maar gewillig; ook niet om vuil gewin, maar met een bereidwillig gemoed;","1 Petr 4:17":"Want het is de tijd dat het oordeel moet beginnen bij het huis van God; en als het eerst bij ons begint, wat zal dan het einde zijn van hen die het Evangelie van God ongehoorzaam zijn?","Ex 28:41":"En u zult die uw broeder Aäron en ook zijn zonen aantrekken; en u zult hen zalven, en hun hand vullen, en hen heiligen, zodat zij Mij het priesterambt bedienen.","Jer 11:18":"De HEERE nu heeft het mij te kennen gegeven, dat ik het weet; toen hebt U mij hun handelingen laten zien.","1 Kon 13:1-6":"En zie, een man van God kwam uit Juda, door het woord van de HEERE, naar Beth-el; en Jerobeam stond bij het altaar om te roken. En hij riep tegen het altaar, door het woord van de HEERE, en zei: Altaar, altaar, zo zegt de HEERE: Zie, er zal aan het huis van David een zoon geboren worden, wiens naam Josia zal zijn; die zal op u de priesters van de hoogten offeren, die op u roken, en men zal mensenbeenderen op u verbranden. En hij gaf op dezelfde dag een wonderteken, en zei: Dit is het wonderteken waarvan de HEERE gesproken heeft: Zie, het altaar zal vaneen scheuren, en de as die erop ligt, zal eraf gestort worden.","Ezech 11:24":"Daarna nam de Geest mij op, en bracht mij in een gezicht door de Geest van God naar Chaldea, tot de weggevoerde gevangenen; en het gezicht dat ik gezien had, steeg van mij op.","Jer 1:2":"Tot wie het woord van de HEERE kwam, in de dagen van Josia, zoon van Amon, koning van Juda, in het dertiende jaar van zijn regering.","1 Sam 3:4-10":"dat de HEERE Samuël riep; en hij zei: Hier ben ik. En hij liep naar Eli en zei: Hier ben ik, want u hebt mij geroepen. Doch hij zei: Ik heb niet geroepen, keer terug, ga liggen. En hij ging heen en legde zich neer. Toen riep de HEERE Samuël opnieuw; en Samuël stond op en ging naar Eli, en zei: Hier ben ik, want u hebt mij geroepen. Hij dan zei: Ik heb u niet geroepen, mijn zoon; keer terug, ga liggen.","Hand 21:10":"En toen wij daar veel dagen gebleven waren, kwam er een zekere profeet uit Judea aan, met de naam Agabus.","Jes 14:18-20":"Al de koningen van de heidenvolken, zij liggen allemaal neer met eer, ieder in zijn huis; maar u bent verworpen van uw graf, als een gruwelijke scheut, als een kleed van de gedoden, die met het zwaard doorstoken zijn; als wie neerdalen in een steenkuil, als een vertreden dood lichaam. U zult niet bij hen gevoegd worden in de begrafenis; want u hebt uw land verdorven, en uw volk gedood; het nageslacht van de boosdoeners zal in eeuwigheid niet genoemd worden.","Ex 33:9":"En het gebeurde, als Mozes de tent binnengegaan was, dat de wolkkolom neerdaalde en bleef staan in de deur van de tent, en Hij sprak met Mozes.","Jer 2:19":"Uw boosheid zal u kastijden, en uw afkeringen zullen u straffen; weet dan en zie, dat het kwaad en bitter is, dat u de HEERE, uw God, verlaat, en Mijn vreze niet bij u is, spreekt de Heere, de HEERE van de heerscharen.","Dan 3:22":"Omdat het bevel van de koning zo dringend was, en de oven zeer heet was, hebben de vonken van het vuur die mannen die Sadrach, Mesach en Abed-nego opgetild hadden, gedood.","2 Kon 5:16":"Maar hij zei: Zo waarachtig als de HEERE leeft, voor Wiens aangezicht ik sta: ik zal het niet aannemen! En hij drong bij hem aan opdat hij het zou aannemen, maar hij weigerde het.","Openb 19:20":"En het beest werd gegrepen, en met hem de valse profeet, die de tekenen in de tegenwoordigheid van hem gedaan had, waardoor hij verleid had hen die het merkteken van het beest ontvangen hadden, en die zijn beeld aanbaden. Deze twee zijn levend geworpen in de poel van het vuur, die met sulfer brandt.","Jer 29:30":"Daarom kwam het woord van de HEERE tot Jeremia, en Hij zei:","Ezech 13:22":"Omdat u het hart van de rechtvaardige door valsheid bedroefd hebt gemaakt, terwijl Ik hem geen smart aangedaan heb; en omdat u de handen van de goddeloze gesterkt hebt, zodat hij zich van zijn boze weg niet zou afkeren, doordat ik hem in leven zou houden;","Hand 8:39":"En toen zij uit het water waren opgekomen, nam de Geest van de Heere Filippus weg, en de kamerling zag hem niet meer; want hij reisde zijn weg met blijdschap.","1 Sam 19:20":"Toen zond Saul boden om David te halen; die zagen een groep profeten, die profeteerden, en Samuël stond daarbij, over hen aangesteld; en de Geest van God kwam over Sauls boden, en ook zij profeteerden.","1 Kon 12:32":"En Jerobeam maakte een feest in de achtste maand, op de vijftiende dag van de maand, gelijk het feest dat in Juda was, en offerde op het altaar; op dezelfde manier deed hij te Beth-el, terwijl hij de kalveren offerde die hij gemaakt had; hij stelde ook te Beth-el priesters der hoogten aan, die hij gemaakt had.","Joh 13:20":"Voorwaar, voorwaar, Ik zeg u: Als Ik iemand zend, wie hem ontvangt, die ontvangt Mij, en wie Mij ontvangt, die ontvangt Hem Die Mij gezonden heeft.","1 Kon 14:10":"daarom, zie, Ik zal kwaad brengen over het huis van Jerobeam, en van Jerobeam uitroeien alwie mannelijk is, zowel wie in de macht is als wie is overgebleven in Israël; en Ik zal de nakomelingen van het huis van Jerobeam wegvegen, zoals men drek wegveegt, totdat het helemaal vergaan is.","2 Tim 3:13":"Maar de slechte mensen en bedriegers zullen van kwaad tot erger gaan, zij verleiden en worden verleid.","Amos 9:1":"Ik zag de Heere staan op het altaar, en Hij zei: Sla die knop, zodat de posten beven, en kloof ze allen in het hoofd; en Ik zal hun achterste met het zwaard doden; wie van hen probeert te vluchten, zal niet ontkomen, en wie van hen probeert te ontkomen, zal niet gered worden.","2 Kon 23:15-18":"Daartoe ook het altaar dat te Beth-el was, en de hoogte, die Jerobeam, de zoon van Nebat, die Israël liet zondigen, gemaakt had; zowel dat altaar als die hoogte brak hij af; ja, hij verbrandde de hoogte, hij vergruisde ze tot stof, en hij verbrandde het bos. En toen Josia zich omkeerde, zag hij de graven die daar op de berg waren, en hij zond boden, en nam de beenderen uit de graven, en verbrandde ze op dat altaar, en verontreinigde dat; naar het woord van de HEERE, dat de man van God had uitgeroepen, die deze woorden uitriep. Verder zei hij: Wat is dat voor een grafteken, dat ik zie? En de mannen van de stad zeiden tegen hem: Het is het graf van de man van God, die uit Juda kwam, en deze dingen, die u tegen dit altaar van Beth-el gedaan hebt, uitgeroepen heeft.","Jer 26:8-11":"Zo gebeurde het, toen Jeremia geëindigd had te spreken alles wat de HEERE geboden had tot al het volk te spreken, dat de priesters en de profeten en al het volk hem grepen, en zeiden: U zult zeker sterven! Waarom hebt u in de Naam van de HEERE geprofeteerd, en gezegd: Dit huis zal worden als Silo, en deze stad zal woest worden, zodat er niemand meer woont? En het hele volk werd verzameld tegen Jeremia, in het huis van de HEERE. Toen nu de vorsten van Juda deze woorden hoorden, gingen zij op uit het huis van de koning naar het huis van de HEERE; en zij zetten zich bij de deur van de nieuwe poort van de HEERE.","Jer 37:3":"Toch stuurde koning Zedekia Juchal, de zoon van Selemja, en de priester Sefanja, de zoon van Maaseja, naar de profeet Jeremia, om te zeggen: Bid toch voor ons tot de HEERE, onze God!","Amos 7:14":"Toen antwoordde Amos, en zei tegen Amazia: Ik was geen profeet, en ik was geen profetenzoon; maar ik was een ossenherder, en verzamelde wilde vijgen.","2 Kron 36:12":"En hij deed wat slecht was in de ogen van de HEERE, zijn God; hij verootmoedigde zich niet voor het aangezicht van de profeet Jeremia, die sprak uit de mond van de HEERE.","2 Kon 23:16-19":"En toen Josia zich omkeerde, zag hij de graven die daar op de berg waren, en hij zond boden, en nam de beenderen uit de graven, en verbrandde ze op dat altaar, en verontreinigde dat; naar het woord van de HEERE, dat de man van God had uitgeroepen, die deze woorden uitriep. Verder zei hij: Wat is dat voor een grafteken, dat ik zie? En de mannen van de stad zeiden tegen hem: Het is het graf van de man van God, die uit Juda kwam, en deze dingen, die u tegen dit altaar van Beth-el gedaan hebt, uitgeroepen heeft. En hij zei: Laat hem liggen, dat niemand zijn beenderen verroert. Zo lieten zij zijn beenderen met rust, met de beenderen van de profeet die uit Samaria gekomen was.","Ps 141:4":"Neig mijn hart niet tot een kwade zaak, om enige handel in goddeloosheid te bedrijven, met mannen die ongerechtigheid bedrijven; en laat mij niet eten van hun lekkernijen.","1 Kon 14:13":"En heel Israël zal hem beklagen en hem begraven; want deze alleen van Jerobeam zal in het graf komen, omdat in hem iets goeds gevonden is voor de HEERE, de God van Israël, in het huis van Jerobeam.","Micha 1:1":"Het woord van de HEERE, dat gebeurd is tot Micha, de Morastiet, in de dagen van Jotham, Achaz en Jehizkia, koningen van Juda; dat hij gezien heeft over Samaria en Jeruzalem.","Num 16:40":"Ter herinnering voor de kinderen van Israël, opdat geen vreemdeling, die niet uit het nageslacht van Aäron is, nadert om reukwerk aan te steken voor het aangezicht van de HEERE; opdat hij niet wordt als Korach en zijn vergadering, zoals de HEERE hem door de hand van Mozes gezegd had.","Ezech 8:1":"Het gebeurde nu in het zesde jaar, in de zesde maand, op de vijfde van de maand, terwijl ik in mijn huis zat, en de oudsten van Juda voor mij zaten, dat de hand van de Heere HEERE daar over mij viel.","Est 6:13":"En Haman vertelde aan zijn vrouw Zeres en al zijn vrienden alles wat hem overkomen was. Toen zeiden zijn wijzen, en Zeres, zijn vrouw, tegen hem: Als Mordechai, voor wie u begonnen bent te vallen, uit het nageslacht van de Joden is, zult u tegen hem niets kunnen uitrichten; maar u zult zeker voor zijn aangezicht vallen.","2 Kon 10:10":"Weet nu, dat niets van het woord van de HEERE, dat de HEERE tegen het huis van Achab gesproken heeft, op de aarde zal vallen; want de HEERE heeft gedaan, wat Hij door de dienst van Zijn knecht Elia gesproken heeft.","1 Petr 1:11":"en onderzochten op welke of wat voor tijd de Geest van Christus, Die in hen was, doelde, toen Hij vooraf getuigde van het lijden dat over Christus zou komen, en de heerlijkheid daarna.","Jer 23:17":"Zij zeggen steeds tegen hen die Mij lasteren: De HEERE heeft het gesproken, u zult vrede hebben; en tegen ieder die naar het goeddunken van zijn eigen hart wandelt, zeggen zij: U zal geen kwaad overkomen.","1 Kor 14:32":"En de geesten der profeten zijn aan de profeten onderworpen.","Ezech 1:1":"In het dertigste jaar, in de vierde maand, op de vijfde dag van die maand, toen ik te midden van de weggevoerden was bij de rivier Chebar, gebeurde het dat de hemelen werden geopend, en ik zag visioenen van God.","Ezech 11:4":"Daarom, profeteer tegen hen; profeteer, o mensenkind!","2 Kron 33:18":"Het overige nu van de geschiedenissen van Manasse, en zijn gebed tot zijn God, ook de woorden van de zieners, die tot hem gesproken hebben in de Naam van de HEERE, de God van Israël, zie, die staan in de geschiedenissen van de koningen van Israël;","Ezech 2:1":"En Hij zei tegen mij: Mensenkind, sta op uw voeten, en Ik zal met u spreken.","Joh 15:14":"U bent Mijn vrienden, als u doet wat Ik u gebied.","Hand 8:24":"Maar Simon antwoordde en zei: Bid u voor mij tot de Heere, opdat niets van wat u gezegd hebt over mij komt.","Num 17:13":"Al wie ook maar enigszins nadert tot de tabernakel van de HEERE, zal sterven; zullen wij dan allen stervend omkomen?","Jer 20:9":"Daarom zei ik: Ik zal Hem niet meer noemen, en niet meer in Zijn Naam spreken; maar het werd in mijn hart als een brandend vuur, opgesloten in mijn beenderen; en ik werd moe van het verdragen, maar ik kon het niet.","Ezech 3:22":"En de hand van de HEERE was daar op mij, en Hij zei tot mij: Maak u op, ga uit naar de vallei, en Ik zal daar met u spreken.","Hos 6:1":"Kom, laten wij terugkeren tot de Heere, want Hij heeft verscheurd, en Hij zal ons genezen; Hij heeft geslagen, en Hij zal ons verbinden.","Hand 8:18-20":"En toen Simon zag dat door het opleggen van de handen van de apostelen de Heilige Geest gegeven werd, bood hij hun geld aan, en zei: Geef ook mij deze macht, opdat ieder aan wie ik de handen opleg, de Heilige Geest ontvangt. Maar Petrus zei tegen hem: Laat uw geld met u verloren gaan, omdat u gemeend hebt dat de gave van God door geld verkregen wordt!","Luk 3:19":"Maar toen Herodes, de viervorst, door hem bestraft werd vanwege Herodias, de vrouw van Filippus, zijn broer, en vanwege alle slechte dingen die Herodes gedaan had,","Richt 10:6-8":"Toen gingen de Israëlieten opnieuw doen wat slecht was in de ogen van de HEERE: zij dienden de Baäls en de Astartes, de goden van Syrië, de goden van Sidon, de goden van Moab, de goden van de Ammonieten, alsook de goden van de Filistijnen; zij verlieten de HEERE en dienden Hem niet meer. Toen ontstak de toorn van de HEERE tegen Israël; en Hij verkocht hen in de hand van de Filistijnen en in de hand van de Ammonieten. Die verdrukten en vertrapten de Israëlieten in datzelfde jaar; achttien jaar lang onderdrukten zij alle Israëlieten die aan de overkant van de Jordaan waren, in het land van de Amorieten, dat in Gilead ligt.","1 Kon 12:25-33":"Jerobeam nu bouwde Sichem op het gebergte van Efraïm, en woonde daarin, en trok van daar verder, en bouwde Penuël. En Jerobeam zei in zijn hart: Nu zal het koninkrijk weer naar het huis van David terugkeren. Als dit volk zal opgaan om offers te brengen in het huis van de HEERE te Jeruzalem, dan zal het hart van dit volk terugkeren naar hun heer, naar Rehabeam, de koning van Juda; ja, zij zullen mij doden, en terugkeren naar Rehabeam, de koning van Juda.","Richt 6:12":"Toen verscheen de Engel van de HEERE aan hem, en zei tegen hem: De HEERE is met u, dappere held!","Hand 7:55":"Maar hij, vol van de Heilige Geest, hield de ogen gericht naar de hemel, en zag de heerlijkheid van God, en Jezus, staande aan de rechterhand van God.","1 Tim 3:5":"(want als iemand niet weet hoe hij zijn eigen huis moet besturen, hoe zal hij dan voor de Gemeente van God zorgen?)","2 Kon 6:8-12":"En de koning van Syrië voerde oorlog tegen Israël, en overlegde met zijn knechten, en zei: Mijn legerplaats zal zijn bij die en die plaats. Maar de man van God zond bericht aan de koning van Israël, en zei: Wacht u ervoor dat u door die plaats trekt, want de Syriërs zijn daarheen afgekomen. Daarom zond de koning van Israël bericht naar die plaats, waarover de man van God hem gezegd en gewaarschuwd had, en hij wachtte zich daar, niet één keer, en niet twee keer.","Hand 21:4":"En wij vonden de discipelen en bleven daar zeven dagen; die zeiden door de Geest tegen Paulus dat hij niet naar Jeruzalem moest gaan.","2 Kron 34:1":"Josia was acht jaar oud, toen hij koning werd, en hij regeerde eenendertig jaar te Jeruzalem.","1 Kon 22:28":"En Micha zei: Als u ooit in vrede terugkomt, dan heeft de HEERE niet door mij gesproken! Verder zei hij: Hoor, alle volken!","2 Kron 8:14":"Hij stelde ook, naar de wijze van zijn vader David, de verdelingen van de priesters aan over hun dienst, en van de Levieten over hun taken, om God te prijzen en voor de priesters te dienen, naar de eis van elke dag; en de poortwachters in hun verdelingen, bij elke poort; want zo was het gebod van David, de man Gods.","Mark 12:36":"Want David zelf heeft door de Heilige Geest gezegd: De Heere heeft gezegd tegen mijn Heere: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gemaakt heb.","Luk 16:23":"En toen hij in de hel zijn ogen ophief, terwijl hij in de pijn was, zag hij Abraham van verre, en Lazarus in zijn schoot.","1 Sam 12:10":"En zij riepen tot de HEERE, en zeiden: Wij hebben gezondigd, omdat wij de HEERE verlaten hebben, en de Baäls en Astharoths gediend hebben; en nu, red ons uit de hand van onze vijanden, en wij zullen U dienen.","Jer 23:9":"Aangaande de profeten. Mijn hart wordt in mijn binnenste gebroken, al mijn beenderen beven; ik ben als een dronken man, en als een man die de wijn te boven gaat; vanwege de HEERE, en vanwege de woorden van Zijn heiligheid.","Dan 3:28":"Nebukadnezar antwoordde en zei: Geloofd zij de God van Sadrach, Mesach en Abed-nego, Die Zijn engel gezonden en Zijn dienaren verlost heeft, die op Hem vertrouwd hebben, en het woord van de koning hebben veranderd, en hun lichamen overgegeven hebben, opdat zij geen god zouden eren of aanbidden dan hun eigen God.","Openb 22:6":"En hij zei tegen mij: Deze woorden zijn getrouw en waarachtig; en de Heere, de God van de heilige profeten, heeft Zijn engel gezonden om Zijn dienstknechten te tonen wat spoedig moet gebeuren.","Jer 23:14":"Maar in de profeten van Jeruzalem zie Ik afschuwelijkheid; zij plegen overspel, en gaan om met valsheid, en sterken de handen van de boosdoeners, zodat zij zich niet bekeren, ieder van zijn boosheid; zij zijn Mij allen als Sodom, en haar inwoners als Gomorra.","Luk 1:70":"zoals Hij gesproken heeft door de mond van Zijn heilige profeten, die er van oudsher geweest zijn;","Ps 119:120":"Het haar van mijn vlees is te berge gerezen van verschrikking voor U, en ik heb gevreesd voor Uw oordelen.","Ex 6:28":"Zo sprak de HEERE tot Mozes en zei: Ik ben de HEERE! Spreek tot Farao, de koning van Egypte, alles wat Ik tot u spreek.","1 Kon 18:36":"En het gebeurde, toen men het spijsoffer offerde, dat de profeet Elia naderde en zei: HEERE, God van Abraham, Izak en Israël, laat het vandaag bekend worden, dat U God bent in Israël, en ik Uw knecht; en dat ik al deze dingen naar Uw woord gedaan heb.","Luk 6:10":"En Hij keek hen allen rondom aan, en zei tegen de man: Strek uw hand uit. En hij deed het; en zijn hand werd hersteld, gezond als de andere.","Neh 6:12":"Want ik merkte dat God hem niet gestuurd had; hij had deze profetie tegen mij uitgesproken, omdat Tobia en Sanballat hem gehuurd hadden.","2 Kor 11:9":"Want mijn gebrek hebben de broeders vervuld die van Macedonië kwamen; en ik heb mijzelf in alles gehouden zonder u te bezwaren, en ik zal mij nog zo houden.","Hos 2:4":"Want hun moeder hoereert, zij die hen ontvangen heeft, handelt schandelijk; want zij zegt: Ik zal mijn minnaars nagaan, die mij mijn brood en mijn water, mijn wol en mijn vlas, mijn olie en mijn drank geven.","Hand 21:11":"En hij kwam naar ons toe, nam de gordel van Paulus, bond daarmee zijn eigen handen en voeten, en zei: Dit zegt de Heilige Geest: De man van wie deze gordel is, zullen de Joden zo te Jeruzalem binden en overleveren in de handen van de heidenen.","Jer 42:2-4":"en zij zeiden tegen de profeet Jeremia: Laat toch onze smeking voor uw aangezicht neervallen, en bid voor ons tot de HEERE, uw God, voor dit hele overblijfsel; want wij zijn nog maar met weinigen over van velen, zoals uw ogen ons zien; dat de HEERE, uw God, ons de weg bekendmaakt die wij zullen ingaan, en de zaak die wij zullen doen. En de profeet Jeremia zei tegen hen: Ik heb het gehoord; zie, ik zal tot de HEERE, uw God, bidden naar uw woorden; en het zal gebeuren, elk woord dat de HEERE u zal antwoorden, zal ik u bekendmaken, ik zal u niet één woord onthouden.","1 Sam 12:23":"Wat mij aangaat, het zij verre van mij, dat ik tegen de HEERE zou zondigen door op te houden voor u te bidden; maar ik zal u de goede en rechte weg leren.","Gen 3:7":"Toen werden hun beider ogen geopend, en zij merkten dat zij naakt waren; en zij hechtten vijgenbladeren aan elkaar en maakten zich schorten.","1 Kon 13:3-6":"En hij gaf op dezelfde dag een wonderteken, en zei: Dit is het wonderteken waarvan de HEERE gesproken heeft: Zie, het altaar zal vaneen scheuren, en de as die erop ligt, zal eraf gestort worden. Het gebeurde nu, toen de koning het woord van de man van God hoorde, dat hij tegen het altaar te Beth-el geroepen had, dat Jerobeam zijn hand van het altaar uitstrekte en zei: Grijpt hem! Maar zijn hand die hij tegen hem uitgestrekt had, verdorde, zodat hij ze niet meer naar zich toe kon trekken. En het altaar scheurde vaneen, en de as werd van het altaar afgestort, volgens het wonderteken dat de man van God gegeven had, door het woord van de HEERE.","Ezech 38:4":"En Ik zal u omkeren, en haken in uw kaken leggen, en Ik zal u uitvoeren, alsook uw hele leger, paarden en ruiters, die allemaal volkomen goed gekleed zijn, een grote verzameling, met rondas en schild, die allemaal zwaarden hanteren;","1 Sam 3:1":"En de jongen Samuël diende de HEERE onder toezicht van Eli; en het woord van de HEERE was zeldzaam in die dagen; er was geen openbaar visioen.","Jer 20:4-6":"Want zo zegt de HEERE: Zie, Ik maak u tot een schrik voor uzelf en voor al uw vrienden; die zullen vallen door het zwaard van hun vijanden, zodat uw ogen het zien; en Ik zal heel Juda geven in de hand van de koning van Babel, die hen naar Babel gevankelijk zal wegvoeren en hen zal doden met het zwaard. Ook zal Ik al het bezit van deze stad geven, en al haar opbrengst, en al haar kostbaarheden, en alle schatten van de koningen van Juda, Ik zal ze geven in de hand van hun vijanden, die zullen ze roven, ze meenemen en ze naar Babel brengen. En u, Pashur, en alle bewoners van uw huis! U zult in gevangenschap gaan; en u zult in Babel komen, en daar sterven, en daar begraven worden, u en al uw vrienden, aan wie u vals geprofeteerd hebt.","2 Sam 6:7":"Toen ontstak de toorn van de HEERE tegen Uza, en God sloeg hem daar, om deze onbedachtzaamheid; en hij stierf daar bij de ark van God.","1 Kon 15:29":"Het gebeurde nu, toen hij koning werd, dat hij het gehele huis van Jerobeam sloeg; hij liet niets van Jerobeam over wat adem had, totdat hij hem verdelgd had, naar het woord van de HEERE, dat Hij gesproken had door de dienst van Zijn knecht Ahia, de Siloniet;","Num 11:17":"Dan zal Ik neerkomen en daar met u spreken; en van de Geest die op u is, zal Ik afnemen, en op hen leggen; en zij zullen met u de last van dit volk dragen, opdat u die niet alleen draagt.","Hos 8:5":"Uw kalf, Samaria! heeft u verstoten; Mijn toorn is tegen hen ontstoken; hoe lang zullen zij de reinheid niet verdragen?","Luk 2:25-27":"En zie, er was een mens in Jeruzalem, wiens naam was Simeon; en deze mens was rechtvaardig en godvrezend, en verwachtte de vertroosting van Israël, en de Heilige Geest was op hem. En hem was door de Heilige Geest een goddelijke openbaring gedaan, dat hij de dood niet zien zou voordat hij de Christus van de Heere zou zien. En hij kwam door de Geest in de tempel. En toen de ouders het Kindje Jezus binnenbrachten, om naar de gewoonte van de wet met Hem te doen,","2 Sam 1:26":"Ik ben benauwd om uwentwil, mijn broeder Jonathan! U was mij zeer liefelijk; uw liefde was mij wonderlijker dan liefde van vrouwen.","Deut 1:5":"Aan deze kant van de Jordaan, in het land Moab, begon Mozes deze wet uit te leggen, en zei:","Lev 10:3":"En Mozes zei tegen Aäron: Dit is het wat de HEERE gesproken heeft: In hen die tot Mij naderen zal Ik geheiligd worden, en voor het aangezicht van heel het volk zal Ik verheerlijkt worden. Maar Aäron zweeg stil.","Zach 2:9":"Want zie, Ik zal Mijn hand over hen bewegen, en zij zullen hun knechten een roof wezen. Zo zult u weten, dat de HEERE van de heerscharen mij gezonden heeft.","Richt 17:12":"En Micha stelde de Leviet aan, zodat hij hem tot priester werd; zo was hij in het huis van Micha.","2 Petr 2:6":"en de steden Sodom en Gomorra tot as heeft laten verbranden en met een omkering veroordeeld heeft, en tot een voorbeeld gesteld heeft voor hen die goddeloos zouden leven;","Num 3:10":"Maar Aäron en zijn zonen zult u aanstellen, dat zij hun priesterambt waarnemen; en de vreemde die nadert, zal gedood worden.","Joh 4:34":"Jezus zei tegen hen: Mijn voedsel is dat Ik de wil doe van Hem die Mij gezonden heeft, en Zijn werk volbreng.","1 Kon 13:8-10":"Maar de man van God zei tegen de koning: Al gaf u mij de helft van uw huis, dan zou ik niet met u meegaan, en ik zou op deze plaats geen brood eten, en geen water drinken. Want zo heeft de HEERE mij geboden door Zijn woord: U zult geen brood eten en geen water drinken; en u zult niet terugkeren via de weg die u gegaan bent. En hij ging via een andere weg, en keerde niet terug via de weg waardoor hij naar Beth-el gekomen was.","Dan 7:16":"Ik naderde tot een van hen die daar stonden, en vroeg hem naar de zekerheid over dit alles; en hij zei het mij, en maakte mij de uitleg van deze zaken bekend.","2 Kron 33:12":"En toen hij in nood verkeerde, zocht hij het aangezicht van de HEERE, zijn God, met ernst, en vernederde zich zeer voor het aangezicht van de God van zijn vaderen,","Pred 8:10":"Zo heb ik ook gezien dat de goddelozen begraven werden, en degenen die kwamen en uit de heilige plaats gingen, werden vergeten in die stad, waarin zij zo gehandeld hadden. Dit is ook vluchtigheid.","Dan 8:16":"En ik hoorde tussen de oevers van de Ulai een mensenstem, die riep en zei: Gabriël! leg deze man het gezicht uit.","Hand 9:4":"en hij viel op de grond en hoorde een stem, die tegen hem zei: Saul, Saul, waarom vervolgt u Mij?","Hand 13:8-11":"Maar Elymas, de tovenaar (want zo wordt zijn naam vertaald), weerstond hen, en probeerde de stadhouder van het geloof af te keren. Doch Saulus (die ook Paulus genoemd wordt), vervuld met de Heilige Geest, en de ogen op hem gericht houdend, zei: O kind van de duivel, vol van alle bedrog en van alle arglistigheid, vijand van alle gerechtigheid, zult u niet ophouden de rechte wegen van de Heere te verdraaien?","Jer 5:22":"Zult u Mij niet vrezen? spreekt de HEERE; zult u voor Mijn aangezicht niet beven? Ik heb het zand tot een grens voor de zee gesteld, met een eeuwige verordening, zodat zij daar niet overheen zal gaan; al bewegen haar golven zich, toch zullen zij niets vermogen, al bruisen zij, toch zullen zij daar niet overheen gaan.","Mal 1:10":"Wie is er ook onder u, die de deuren voor niets toesluit? En u steekt het vuur niet aan op Mijn altaar voor niets. Ik heb geen behagen in u, zegt de HEERE van de heerscharen, en het spijsoffer is Mij van uw hand niet aangenaam.","Num 23:20":"Zie, ik heb opdracht ontvangen om te zegenen; omdat Hij zegent, zal ik het niet terugdraaien.","Ps 78:35":"En zij dachten eraan, dat God hun Rotssteen was, en God, de Allerhoogste, hun Verlosser.","Jer 20:2-4":"sloeg Pashur de profeet Jeremia, en zette hem in de gevangenis die in de bovenste poort van Benjamin is, die aan het huis van de HEERE ligt. Maar het gebeurde de volgende dag dat Pashur Jeremia uit de gevangenis liet halen; toen zei Jeremia tegen hem: De HEERE noemt uw naam niet Pashur, maar Magor-missabib. Want zo zegt de HEERE: Zie, Ik maak u tot een schrik voor uzelf en voor al uw vrienden; die zullen vallen door het zwaard van hun vijanden, zodat uw ogen het zien; en Ik zal heel Juda geven in de hand van de koning van Babel, die hen naar Babel gevankelijk zal wegvoeren en hen zal doden met het zwaard.","Amos 6:11":"Want zie, de HEERE geeft bevel, en Hij zal het grote huis slaan met scheuren, en het kleine huis met spleten.","2 Kon 23:17":"Verder zei hij: Wat is dat voor een grafteken, dat ik zie? En de mannen van de stad zeiden tegen hem: Het is het graf van de man van God, die uit Juda kwam, en deze dingen, die u tegen dit altaar van Beth-el gedaan hebt, uitgeroepen heeft.","Neh 9:30":"Doch U hebt geduld met hen gehad, vele jaren lang, en tegen hen getuigd door Uw Geest, door de dienst van Uw profeten, maar zij neigden hun oor niet; daarom hebt U hen gegeven in de hand van de volken van de landen.","Jak 5:10":"Mijn broeders, neem als voorbeeld van het lijden en van de geduldigheid de profeten, die in de Naam van de Heere gesproken hebben.","1 Sam 12:9":"Maar zij vergaten de HEERE, hun God; zo verkocht Hij hen in de hand van Sisera, de legeraanvoerder van Hazor, en in de hand van de Filistijnen, en in de hand van de koning van de Moabieten, die tegen hen streden.","Matt 25:40":"En de Koning zal antwoorden en tegen hen zeggen: Voorwaar, Ik zeg u: Voor zoveel u dit voor één van deze Mijn minste broeders gedaan hebt, hebt u dat Mij gedaan.","Num 16:26":"En hij sprak tot de vergadering en zei: Ga toch weg van de tenten van deze goddeloze mannen, en raak niets aan van wat van hen is, anders wordt u misschien meegesleurd in al hun zonden.","Jer 22:29":"O land, land, land! hoor het woord van de HEERE!","Gen 41:39":"Daarna zei Farao tegen Jozef: Omdat God u dit alles heeft bekendgemaakt, is er niemand zo verstandig en wijs als u.","1 Kon 14:16":"En Hij zal Israël overgeven, vanwege de zonden van Jerobeam, die gezondigd heeft, en die Israël heeft doen zondigen.","2 Kon 23:18":"En hij zei: Laat hem liggen, dat niemand zijn beenderen verroert. Zo lieten zij zijn beenderen met rust, met de beenderen van de profeet die uit Samaria gekomen was.","Jes 9:14":"(De oude en aanzienlijke, die is de kop; maar de profeet die valsheid leert, die is de staart.)","Dan 3:27":"Toen verzamelden zich de stadhouders, de overheden, de landvoogden, en de raadsheren van de koning, en zij zagen deze mannen, dat het vuur geen macht had gehad over hun lichamen, en dat het haar van hun hoofd niet verbrand was, en hun mantels niet veranderd waren, ja, dat de geur van het vuur er zelfs niet doorheen gegaan was.","1 Kon 13:20-23":"En het gebeurde, terwijl zij aan tafel zaten, dat het woord van de HEERE kwam tot de profeet die hem had laten terugkeren; en hij riep tegen de man van God die uit Juda gekomen was, en zei: Zo zegt de HEERE: Omdat u opstandig bent geweest tegen de mond van de HEERE, en het gebod niet gehouden hebt dat de HEERE, uw God, u geboden had, maar bent teruggekeerd en hebt brood gegeten en water gedronken op de plaats waarvan Hij tegen u gezegd had: U zult geen brood eten en geen water drinken; zo zal uw dode lichaam niet in het graf van uw vader komen.","Luk 1:67":"En Zacharias, zijn vader, werd vervuld met de Heilige Geest, en profeteerde, en zei:","Joël 2:29":"Ja, ook over de dienstknechten, en over de dienstmaagden, zal Ik in die dagen Mijn Geest uitgieten.","Ps 148:7":"Looft de HEERE, vanaf de aarde; zeemonsters en alle diepe wateren!","1 Kron 28:19":"Dit alles, zei David, heeft men mij door geschrift laten verstaan, van de hand van de HEERE, namelijk al de werken van deze bereiding.","Jer 42:4":"En de profeet Jeremia zei tegen hen: Ik heb het gehoord; zie, ik zal tot de HEERE, uw God, bidden naar uw woorden; en het zal gebeuren, elk woord dat de HEERE u zal antwoorden, zal ik u bekendmaken, ik zal u niet één woord onthouden.","2 Kron 11:15":"En hij had zichzelf priesters aangesteld voor de hoogte, en voor de duivelen, en voor de kalveren die hij gemaakt had.","1 Kor 4:11":"Tot op dit huidige uur lijden wij honger, en lijden wij dorst, en zijn naakt, en worden met vuisten geslagen, en hebben geen vaste woonplaats;","Ezra 9:5-15":"En rond het avondoffer stond ik op uit mijn bedruktheid, nadat ik mijn kleed en mijn mantel gescheurd had; en ik boog mij op mijn knieën, en breidde mijn handen uit tot de HEERE, mijn God; En ik zei: Mijn God, ik ben beschaamd en schaamrood om mijn aangezicht tot U op te heffen, mijn God; want onze ongerechtigheden zijn vermenigvuldigd tot boven ons hoofd, en onze schuld is groot geworden tot aan de hemel. Vanaf de dagen van onze vaderen zijn wij in grote schuld tot op deze dag; en wij zijn om onze ongerechtigheden overgegeven, wij, onze koningen en onze priesters, in de hand van de koningen van de landen, aan het zwaard, aan gevangenschap, en aan roof, en aan schaamte van het aangezicht, zoals het is op deze dag.","Spr 11:31":"Zie, de rechtvaardige wordt vergolden op de aarde, hoeveel te meer de goddeloze en de zondaar!","Deut 5:31":"Maar u, sta hier bij Mij, dan zal Ik tot u spreken al de geboden, en inzettingen, en rechten, die u hun leren zult, opdat zij ze doen in het land dat Ik hun geven zal, om dat te erven.","Jer 1:4-10":"Het woord van de HEERE dan kwam tot mij, en zei: Voordat Ik u in moeders buik vormde, heb Ik u gekend, en voordat u uit de baarmoeder voortkwam, heb Ik u geheiligd; Ik heb u de volken tot een profeet gesteld. Toen zei ik: Ach, Heere HEERE! zie, ik kan niet spreken, want ik ben jong.","1 Sam 15:22-24":"Doch Samuël zei: Heeft de HEERE evenveel behagen in brandoffers en slachtoffers, als in het gehoorzamen aan de stem van de HEERE? Zie, gehoorzamen is beter dan slachtoffer, opmerken beter dan het vet van rammen. Want weerspannigheid is een zonde als toverij, en weerstreven is afgoderij en beeldendienst. Omdat u het woord van de HEERE verworpen hebt, zo heeft Hij u verworpen, dat u geen koning meer zult zijn. Toen zei Saul tegen Samuël: Ik heb gezondigd, omdat ik het bevel van de HEERE en uw woorden overtreden heb; want ik heb het volk gevreesd en naar hun stem geluisterd.","Ezra 5:2":"Toen maakten Zerubbabel, de zoon van Sealthiël, en Jesua, de zoon van Jozadak, zich op en begonnen het huis van God te bouwen, Dat te Jeruzalem woont; en met hen de profeten van God, die hen ondersteunden.","Hand 6:12-14":"En zij hitsten het volk op, en de oudsten en de schriftgeleerden; en zij overvielen hem, grepen hem, en brachten hem voor de Raad; en zetten valse getuigen in, die zeiden: Deze man houdt niet op lasterlijke woorden te spreken tegen deze heilige plaats en de wet. Want wij hebben hem horen zeggen dat deze Jezus, de Nazarener, deze plaats zal afbreken, en de gebruiken zal veranderen die Mozes ons heeft overgeleverd.","1 Kon 13:24-28":"Zo ging hij weg, en een leeuw vond hem op de weg, en doodde hem; en zijn dode lichaam lag geworpen op de weg, en de ezel stond ernaast; ook stond de leeuw bij het dode lichaam. En zie, er kwamen lieden voorbij, en zagen het dode lichaam liggen op de weg, en de leeuw die bij het dode lichaam stond; en zij kwamen en vertelden het in de stad waar de oude profeet woonde. Toen de profeet die hem van de weg had laten terugkeren, dit hoorde, zei hij: Het is de man van God, die opstandig is geweest tegen de mond van de HEERE; daarom heeft de HEERE hem aan de leeuw overgegeven, die hem verscheurd en gedood heeft, naar het woord van de HEERE dat Hij tot hem gesproken had.","Hand 8:29":"En de Geest zei tegen Filippus: Ga erheen, en voeg u bij deze wagen.","Openb 18:4":"En ik hoorde een andere stem uit de hemel, die zei: Ga uit haar weg, Mijn volk, opdat u geen deel hebt aan haar zonden, en opdat u niet ontvangt van haar plagen.","2 Kon 2:9":"Het gebeurde nu, toen zij overgekomen waren, dat Elia zei tegen Elisa: Vraag wat ik voor u doen zal, voordat ik van bij u weggenomen word. En Elisa zei: Laat toch een dubbel deel van uw geest op mij zijn!","2 Sam 24:13":"Zo kwam Gad bij David, en maakte het hem bekend, en zei tegen hem: Zal er een hongersnood van zeven jaar in uw land tot u komen? Of wilt u drie maanden vluchten voor uw vijanden, terwijl zij u achtervolgen? Of dat er drie dagen pestilentie in uw land is? Merk nu op, en zie toe, wat antwoord ik terug moet brengen aan Hem die mij gezonden heeft.","1 Kon 13:18-26":"En hij zei tegen hem: Ik ben ook een profeet, net als u, en een engel heeft tot mij gesproken door het woord van de HEERE, en gezegd: Breng hem met u terug naar uw huis, zodat hij brood eet en water drinkt. Doch hij loog tegen hem. En hij keerde met hem terug, en at brood in zijn huis, en dronk water. En het gebeurde, terwijl zij aan tafel zaten, dat het woord van de HEERE kwam tot de profeet die hem had laten terugkeren;","Rom 1:1":"Paulus, een dienstknecht van Jezus Christus, een geroepen apostel, afgezonderd tot het Evangelie van God,","Ps 66:10-12":"Want U hebt ons beproefd, o God! U hebt ons gelouterd, zoals men zilver loutert; U had ons in het net gebracht; U had een engs band om onze lenden gelegd; U had de mens over ons hoofd laten rijden; wij waren in het vuur en in het water gekomen; maar U hebt ons uitgevoerd naar een overvloeiende verversing.","2 Kron 21:20":"Hij was tweeëndertig jaar oud toen hij koning werd, en regeerde acht jaar in Jeruzalem; en hij ging heen zonder dat men hem miste; en zij begroeven hem in de stad van David, maar niet in de graven van de koningen.","Jer 13:1-3":"Zo heeft de HEERE tegen mij gezegd: Ga heen, en koop u een linnen gordel, en doe die om uw middel, maar breng hem niet in het water. En ik kocht een gordel naar het woord van de HEERE, en ik deed die om mijn middel. Toen kwam het woord van de HEERE voor de tweede keer tot mij, en Hij zei:","Jes 44:26-28":"Die het woord van Zijn knecht bevestigt, en de raad van Zijn boden volbrengt; Die tot Jeruzalem zegt: U zult bewoond worden; en tot de steden van Juda: U zult herbouwd worden, en Ik zal haar verwoeste plaatsen oprichten. Die tot de diepte zegt: Verdroog, en uw rivieren zal Ik doen verdrogen. Die van Kores zegt: Hij is Mijn herder, en hij zal al Mijn welbehagen volbrengen; en zegt ook tot Jeruzalem: Word gebouwd; en tot de tempel: Word gegrondvest.","Jona 2:1-10":"En Jona bad tot de HEERE, zijn God, uit het ingewand van de vis. En hij zei: Ik riep uit mijn benauwdheid tot de HEERE, en Hij antwoordde mij; uit de buik van het graf schreide ik, en U hoorde mijn stem. Want U had mij geworpen in de diepte, in het hart van de zeeën, en de stroom omving mij; al Uw baren en Uw golven gingen over mij heen.","Obadja 1:1":"Het visioen van Obadja. Zo zegt de Heere HEERE van Edom: Wij hebben een bericht gehoord van de HEERE, en er is een gezant gestuurd onder de heidenvolken: Sta op, en laten wij tegen haar opstaan ten strijde.","2 Kron 13:8":"En nu, u denkt zich te kunnen verzetten tegen het koninkrijk van de HEERE, dat in de hand is van de zonen van David; u bent wel een grote menigte, maar u hebt gouden kalveren bij u, die Jerobeam voor u tot goden gemaakt heeft.","Ezech 3:27":"Maar als Ik met u spreken zal, zal Ik uw mond opendoen, en u zult tot hen zeggen: Zo zegt de Heere HEERE, wie hoort, laat hij horen, en wie het laat, laat hij het laten; want zij zijn een opstandig huis.","1 Kon 12:22":"Doch het woord van God kwam tot Semaja, de man van God, en zei:","Ex 24:16":"En de heerlijkheid van de HEERE woonde op de berg Sinaï, en de wolk bedekte hem zes dagen, en op de zevende dag riep Hij Mozes uit het midden van de wolk.","1 Kon 14:9":"maar kwaad gedaan hebt, meer dan allen die vóór u geweest zijn, en heengegaan bent, en u andere goden en gegoten beelden gemaakt hebt, om Mij tot toorn te verwekken, en Mij achter uw rug geworpen hebt;","2 Kon 6:17":"En Elisa bad, en zei: HEERE, open toch zijn ogen, dat hij ziet! En de HEERE opende de ogen van de knecht, dat hij zag; en zie, de berg was vol vurige paarden en wagens rondom Elisa.","1 Sam 16:13":"Toen nam Samuël de oliehoorn, en zalfde hem te midden van zijn broers. En de Geest van de HEERE kwam vanaf die dag over David, en bleef. Daarna stond Samuël op, en ging naar Rama.","Gen 40:8":"En zij zeiden tegen hem: Wij hebben een droom gehad, en er is niemand die hem uitlegt. En Jozef zei tegen hen: Zijn de uitleggingen niet van God? Vertel ze mij toch.","Gal 1:9":"Zoals wij al eerder gezegd hebben, zeg ik het nu ook weer: als iemand u een evangelie verkondigt naast wat u ontvangen hebt, laat hij vervloekt zijn.","1 Kon 14:5":"Maar de HEERE zei tegen Ahia: Zie, Jerobeams vrouw komt om u iets te vragen over haar zoon, want hij is ziek. Zo en zo zult u tot haar spreken, en het zal gebeuren, als zij binnenkomt, dat zij zich als een andere vrouw zal voordoen.","2 Joh 1:11":"Want die tegen hem zegt: wees gegroet, die heeft gemeenschap aan zijn slechte werken.","Jer 11:12":"Dan zullen de steden van Juda en de inwoners van Jeruzalem heengaan, en roepen tot de goden aan wie zij wierook gebracht hebben; maar die zullen hen zeker niet kunnen verlossen ten tijde van hun kwaad.","Jes 1:2":"Hoor, hemelen! en neem het ter oor, aarde! Want de HEERE spreekt: Ik heb kinderen groot gemaakt en verhoogd, maar zij hebben tegen Mij overtreden.","Luk 16:22":"En het gebeurde dat de bedelaar stierf, en door de engelen gedragen werd in de schoot van Abraham; en de rijke stierf ook, en werd begraven.","Ezech 33:22":"Nu was de hand van de HEERE 's avonds op mij geweest, voordat wie ontkomen was kwam, en Hij had mijn mond geopend, totdat hij 's morgens tot mij kwam. Zo werd mijn mond geopend, en ik was niet meer stom.","Ezech 3:24":"Toen kwam de Geest in mij, en stelde mij op mijn voeten, en Hij sprak met mij, en zei tot mij: Ga, sluit u binnen in uw huis.","Jes 26:16":"HEERE, in benauwdheid hebben zij U bezocht; zij hebben hun stil gebed uitgestort, toen Uw tuchtiging over hen was.","Job 33:14-16":"Maar God spreekt eens of tweemaal; doch men let daar niet op. In de droom, door het gezicht 's nachts, als een diepe slaap op de mensen valt, in de sluimering op het leger; Dan openbaart Hij het voor het oor der mensen, en Hij verzegelt hun kastijding;","Job 39:34-38":"En de HEERE antwoordde Job, en zei: Is het twisten met de Almachtige onderrichten? Wie God bestraft, die antwoordt daarop. Toen antwoordde Job de HEERE, en zei:","1 Sam 13:14":"Maar nu zal uw koningschap niet blijven bestaan. De HEERE heeft Zich een man gezocht naar Zijn hart, en de HEERE heeft hem bevolen een voorganger te zijn over Zijn volk, omdat u niet gehouden hebt wat de HEERE u geboden had.","Ps 105:15":"Raak Mijn gezalfden niet aan, en doe Mijn profeten geen kwaad.","1 Kon 13:7-10":"En de koning zei tegen de man van God: Kom met mij mee naar huis, en sterk u, en ik zal u een geschenk geven. Maar de man van God zei tegen de koning: Al gaf u mij de helft van uw huis, dan zou ik niet met u meegaan, en ik zou op deze plaats geen brood eten, en geen water drinken. Want zo heeft de HEERE mij geboden door Zijn woord: U zult geen brood eten en geen water drinken; en u zult niet terugkeren via de weg die u gegaan bent.","Richt 6:34":"Toen bekleedde de Geest van de HEERE Gideon, en hij blies op de bazuin, en de Abiëzrieten werden achter hem bijeengeroepen.","Joz 3:7":"Want de HEERE had tegen Jozua gezegd: Deze dag zal Ik beginnen u groot te maken voor de ogen van heel Israël, opdat zij weten dat Ik met u zal zijn, zoals Ik met Mozes geweest ben.","2 Sam 23:3":"De God van Israël heeft gezegd, de Rotssteen van Israël heeft tot mij gesproken: Er zal een Heerser zijn over de mensen, een Rechtvaardige, een Heerser in de vreze van God.","Ps 26:9":"Raap mijn ziel niet weg met de zondaars, en mijn leven niet met de mannen van het bloed;","Jer 1:1":"De woorden van Jeremia, de zoon van Hilkia, uit de priesters die te Anathoth waren, in het land van Benjamin;","Jes 6:1-9":"In het jaar dat koning Uzzia stierf, zag ik de Heere zitten op een hoge en verheven troon, en Zijn zomen vulden de tempel. De serafs stonden boven Hem; ieder had zes vleugels; met twee bedekte ieder zijn gezicht, en met twee bedekte hij zijn voeten, en met twee vloog hij. En de een riep tot de ander en zei: Heilig, heilig, heilig is de HEERE van de heerscharen! De hele aarde is vol van Zijn heerlijkheid!","Gen 3:5":"Maar God weet dat, op de dag dat u daarvan eet, uw ogen geopend zullen worden, en u als God zult zijn, kennend het goed en het kwaad.","2 Petr 2:1":"Maar er zijn ook valse profeten onder het volk geweest, zoals er ook onder u valse leraars zullen zijn, die verderfelijke ketterijen in het geheim zullen invoeren, en zelfs de Heere, Die hen gekocht heeft, verloochenen, en zo een snel verderf over zichzelf brengen;","1 Kon 17:4":"En het zal gebeuren dat u uit de beek zult drinken; en Ik heb de raven geboden dat zij u daar onderhouden.","1 Kor 5:11":"Maar nu heb ik u geschreven dat u zich niet moet inlaten namelijk met iemand die een broeder genoemd wordt, en toch een hoereerder is, of een gierigaard, of een afgodendienaar, of een lasteraar, of een dronkaard, of een rover; met zo iemand moet u zelfs niet eten.","1 Joh 4:1":"Geliefden, geloof niet elke geest, maar beproef de geesten, of zij uit God zijn; want veel valse profeten zijn uitgegaan in de wereld.","2 Kon 23:15-17":"Daartoe ook het altaar dat te Beth-el was, en de hoogte, die Jerobeam, de zoon van Nebat, die Israël liet zondigen, gemaakt had; zowel dat altaar als die hoogte brak hij af; ja, hij verbrandde de hoogte, hij vergruisde ze tot stof, en hij verbrandde het bos. En toen Josia zich omkeerde, zag hij de graven die daar op de berg waren, en hij zond boden, en nam de beenderen uit de graven, en verbrandde ze op dat altaar, en verontreinigde dat; naar het woord van de HEERE, dat de man van God had uitgeroepen, die deze woorden uitriep. Verder zei hij: Wat is dat voor een grafteken, dat ik zie? En de mannen van de stad zeiden tegen hem: Het is het graf van de man van God, die uit Juda kwam, en deze dingen, die u tegen dit altaar van Beth-el gedaan hebt, uitgeroepen heeft.","2 Kon 5:27":"Daarom zal de melaatsheid van Naäman u aankleven, en uw nageslacht voor eeuwig! Toen ging hij van voor zijn aangezicht weg, melaats, wit als de sneeuw.","Mark 6:23":"En hij zwoer haar: Wat u mij ook zult vragen, ik zal het u geven, zelfs tot de helft van mijn koninkrijk!","Rom 16:17":"En ik bid u, broeders, let op degenen die tweedracht en ergernissen veroorzaken, tegen de leer die u geleerd hebt; en blijf bij hen vandaan.","Dan 6:23":"Mijn God heeft Zijn engel gezonden, en Hij heeft de bek van de leeuwen dichtgehouden, zodat zij mij niet beschadigd hebben, omdat voor Zijn aangezicht onschuld in mij gevonden is; en ook heb ik, o koning, tegen u geen misdaad begaan.","Jer 5:31":"De profeten profeteren vals, en de priesters heersen door hun eigen hand; en Mijn volk heeft het graag zo; maar wat zult u aan het einde daarvan doen?","Ps 119:67":"Eer ik verdrukt werd, dwaalde ik, maar nu onderhoud ik Uw woord.","Num 24:15":"Toen hief hij zijn spreuk op en zei: Bileam, de zoon van Beor, spreekt, en die man wiens ogen geopend zijn, spreekt!","Jer 18:4":"En het vat dat hij maakte werd verdorven, als leem, in de hand van de pottenbakker; toen maakte hij daarvan weer een ander vat, zoals het goed was in de ogen van de pottenbakker om te maken.","1 Kon 13:11-22":"Er woonde nu een oude profeet te Beth-el; en zijn zoon kwam en vertelde hem al het werk dat de man van God die dag in Beth-el gedaan had, met de woorden die hij tegen de koning gesproken had; dat vertelden zij ook aan hun vader. En hun vader zei tegen hen: Welke weg is hij gegaan? En zijn zonen hadden de weg gezien waarlangs de man van God gegaan was, die uit Juda gekomen was. Toen zei hij tegen zijn zonen: Zadelt mij de ezel. En zij zadelden hem de ezel, en hij reed erop.","1 Sam 15:22":"Doch Samuël zei: Heeft de HEERE evenveel behagen in brandoffers en slachtoffers, als in het gehoorzamen aan de stem van de HEERE? Zie, gehoorzamen is beter dan slachtoffer, opmerken beter dan het vet van rammen.","2 Petr 2:16":"maar hij kreeg een terechtwijzing voor zijn onrechtvaardigheid; want het jukdragende, stomme dier sprak met mensenstem en verhinderde de dwaasheid van de profeet.","Ezech 9:6":"Dood oude mensen, jonge mannen en
