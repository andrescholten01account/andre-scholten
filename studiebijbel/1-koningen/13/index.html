pan> <span class=\"wl wl-kjv\" data-code=\"H2977\">Josiah</span> by <span class=\"wl wl-kjv\" data-code=\"H8034\">name;</span> and upon thee shall he <span class=\"wl wl-kjv\" data-code=\"H2076\">offer</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> of the high <span class=\"wl wl-kjv\" data-code=\"H1116\">places</span> that burn <span class=\"wl wl-kjv\" data-code=\"H6999\">incense</span> upon thee, and <span class=\"wl wl-kjv\" data-code=\"H120\">men's</span> <span class=\"wl wl-kjv\" data-code=\"H6106\">bones</span> shall be <span class=\"wl wl-kjv\" data-code=\"H8313\">burnt</span> upon thee.","3":"And he <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> a <span class=\"wl wl-kjv\" data-code=\"H4159\">sign</span> the same <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> This is the <span class=\"wl wl-kjv\" data-code=\"H4159\">sign</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken;</span> Behold, the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> shall be <span class=\"wl wl-kjv\" data-code=\"H7167\">rent,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1880\">ashes</span> that are upon it shall be poured <span class=\"wl wl-kjv\" data-code=\"H8210\">out.</span>","4":"And it came to pass, when <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">saying</span> of the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> which had <span class=\"wl wl-kjv\" data-code=\"H7121\">cried</span> against the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> in <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel,</span> that he put <span class=\"wl wl-kjv\" data-code=\"H7971\">forth</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> from the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Lay <span class=\"wl wl-kjv\" data-code=\"H8610\">hold</span> on him. And his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> which he put <span class=\"wl wl-kjv\" data-code=\"H7971\">forth</span> against him, dried <span class=\"wl wl-kjv\" data-code=\"H3001\">up,</span> so that he <span class=\"wl wl-kjv\" data-code=\"H3201\">could</span> not pull it in <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> to him.","5":"The <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> also was <span class=\"wl wl-kjv\" data-code=\"H7167\">rent,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1880\">ashes</span> poured <span class=\"wl wl-kjv\" data-code=\"H8210\">out</span> from the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar,</span> according to the <span class=\"wl wl-kjv\" data-code=\"H4159\">sign</span> which the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> had <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> by the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","6":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> <span class=\"wl wl-kjv\" data-code=\"H2470\">Intreat</span> now the <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and <span class=\"wl wl-kjv\" data-code=\"H6419\">pray</span> for me, that my <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> may be restored me <span class=\"wl wl-kjv\" data-code=\"H7725\">again.</span> And the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H2470\">besought</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> was restored him <span class=\"wl wl-kjv\" data-code=\"H7725\">again,</span> and became as it was <span class=\"wl wl-kjv\" data-code=\"H7223\">before.</span>","7":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> <span class=\"wl wl-kjv\" data-code=\"H935\">Come</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">home</span> with me, and <span class=\"wl wl-kjv\" data-code=\"H5582\">refresh</span> thyself, and I will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thee a <span class=\"wl wl-kjv\" data-code=\"H4991\">reward.</span>","8":"And the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> If thou wilt <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> me <span class=\"wl wl-kjv\" data-code=\"H2677\">half</span> thine <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> I will not go <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> with thee, neither will I <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> nor <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> in this <span class=\"wl wl-kjv\" data-code=\"H4725\">place:</span>","9":"For so was it <span class=\"wl wl-kjv\" data-code=\"H6680\">charged</span> me by the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H398\">Eat</span> no <span class=\"wl wl-kjv\" data-code=\"H3899\">bread,</span> nor <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> nor turn <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> by the same <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> that thou <span class=\"wl wl-kjv\" data-code=\"H1980\">camest.</span>","10":"So he <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> <span class=\"wl wl-kjv\" data-code=\"H312\">another</span> <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> not by the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> that he <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel.</span>","11":"Now there <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> <span class=\"wl wl-kjv\" data-code=\"H259\">an</span> <span class=\"wl wl-kjv\" data-code=\"H2205\">old</span> <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> in <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel;</span> and his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> and <span class=\"wl wl-kjv\" data-code=\"H5608\">told</span> him all the <span class=\"wl wl-kjv\" data-code=\"H4639\">works</span> that the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> had <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> in <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel:</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> which he had <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> them they <span class=\"wl wl-kjv\" data-code=\"H5608\">told</span> also to their <span class=\"wl wl-kjv\" data-code=\"H1\">father.</span>","12":"And their <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">said</span> unto them, What <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> he? For his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> had <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> <span class=\"wl wl-kjv\" data-code=\"H335\">what</span> <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">went,</span> which <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> from <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah.</span>","13":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> <span class=\"wl wl-kjv\" data-code=\"H2280\">Saddle</span> me the <span class=\"wl wl-kjv\" data-code=\"H2543\">ass.</span> So they <span class=\"wl wl-kjv\" data-code=\"H2280\">saddled</span> him the <span class=\"wl wl-kjv\" data-code=\"H2543\">ass:</span> and he <span class=\"wl wl-kjv\" data-code=\"H7392\">rode</span> thereon,","14":"And <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> him <span class=\"wl wl-kjv\" data-code=\"H3427\">sitting</span> under an <span class=\"wl wl-kjv\" data-code=\"H424\">oak:</span> and he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Art thou the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> that <span class=\"wl wl-kjv\" data-code=\"H935\">camest</span> from <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah?</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I am.","15":"Then he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H3212\">Come</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">home</span> with me, and <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread.</span>","16":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I <span class=\"wl wl-kjv\" data-code=\"H3201\">may</span> not <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> with thee, nor go <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> with thee: neither will I <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> nor <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> with thee in this <span class=\"wl wl-kjv\" data-code=\"H4725\">place:</span>","17":"For it was <span class=\"wl wl-kjv\" data-code=\"H1697\">said</span> to me by the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> Thou shalt <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> no <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> nor <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> there, nor turn <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> by the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> that thou <span class=\"wl wl-kjv\" data-code=\"H1980\">camest.</span>","18":"He <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, I am a <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> also as thou art; and an <span class=\"wl wl-kjv\" data-code=\"H4397\">angel</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto me by the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Bring him <span class=\"wl wl-kjv\" data-code=\"H7725\">back</span> with thee into thine <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> that he may <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> and <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water.</span> But he <span class=\"wl wl-kjv\" data-code=\"H3584\">lied</span> unto him.","19":"So he went <span class=\"wl wl-kjv\" data-code=\"H7725\">back</span> with him, and did <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> in his <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and <span class=\"wl wl-kjv\" data-code=\"H8354\">drank</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water.</span>","20":"And it came to pass, as they <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> at the <span class=\"wl wl-kjv\" data-code=\"H7979\">table,</span> that the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> came unto the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> that brought him <span class=\"wl wl-kjv\" data-code=\"H7725\">back:</span>","21":"And he <span class=\"wl wl-kjv\" data-code=\"H7121\">cried</span> unto the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> that <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> from <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> Forasmuch <span class=\"wl wl-kjv\" data-code=\"H3282\">as</span> thou hast <span class=\"wl wl-kjv\" data-code=\"H4784\">disobeyed</span> the <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and hast not <span class=\"wl wl-kjv\" data-code=\"H8104\">kept</span> the <span class=\"wl wl-kjv\" data-code=\"H4687\">commandment</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> thee,","22":"But camest <span class=\"wl wl-kjv\" data-code=\"H7725\">back,</span> and hast <span class=\"wl wl-kjv\" data-code=\"H398\">eaten</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> and <span class=\"wl wl-kjv\" data-code=\"H8354\">drunk</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> in the <span class=\"wl wl-kjv\" data-code=\"H4725\">place,</span> of the which the LORD did <span class=\"wl wl-kjv\" data-code=\"H1696\">say</span> to thee, <span class=\"wl wl-kjv\" data-code=\"H398\">Eat</span> no <span class=\"wl wl-kjv\" data-code=\"H3899\">bread,</span> and <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> no <span class=\"wl wl-kjv\" data-code=\"H4325\">water;</span> thy <span class=\"wl wl-kjv\" data-code=\"H5038\">carcase</span> shall not <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> unto the <span class=\"wl wl-kjv\" data-code=\"H6913\">sepulchre</span> of thy <span class=\"wl wl-kjv\" data-code=\"H1\">fathers.</span>","23":"And it came to pass, <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> he had <span class=\"wl wl-kjv\" data-code=\"H398\">eaten</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread,</span> and <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> he had <span class=\"wl wl-kjv\" data-code=\"H8354\">drunk,</span> that he <span class=\"wl wl-kjv\" data-code=\"H2280\">saddled</span> for him the <span class=\"wl wl-kjv\" data-code=\"H2543\">ass,</span> to wit, for the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> whom he had brought <span class=\"wl wl-kjv\" data-code=\"H7725\">back.</span>","24":"And when he was <span class=\"wl wl-kjv\" data-code=\"H3212\">gone,</span> a <span class=\"wl wl-kjv\" data-code=\"H738\">lion</span> <span class=\"wl wl-kjv\" data-code=\"H4672\">met</span> him by the <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> and <span class=\"wl wl-kjv\" data-code=\"H4191\">slew</span> him: and his <span class=\"wl wl-kjv\" data-code=\"H5038\">carcase</span> was <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> in the <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2543\">ass</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> <span class=\"wl wl-kjv\" data-code=\"H681\">by</span> it, the <span class=\"wl wl-kjv\" data-code=\"H738\">lion</span> also <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> by the <span class=\"wl wl-kjv\" data-code=\"H5038\">carcase.</span>","25":"And, behold, <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> passed <span class=\"wl wl-kjv\" data-code=\"H5674\">by,</span> and <span class=\ const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    if (!kjvTekst && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
</html>
