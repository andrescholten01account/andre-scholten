],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"En zie, een man van God kwam uit Juda, door het woord van de HEERE, naar Beth-el; en Jerobeam stond bij het altaar om te roken.","2":"En hij riep tegen het altaar, door het woord van de HEERE, en zei: Altaar, altaar, zo zegt de HEERE: Zie, er zal aan het huis van David een zoon geboren worden, wiens naam Josia zal zijn; die zal op u de priesters van de hoogten offeren, die op u roken, en men zal mensenbeenderen op u verbranden.","3":"En hij gaf op dezelfde dag een wonderteken, en zei: Dit is het wonderteken waarvan de HEERE gesproken heeft: Zie, het altaar zal vaneen scheuren, en de as die erop ligt, zal eraf gestort worden.","4":"Het gebeurde nu, toen de koning het woord van de man van God hoorde, dat hij tegen het altaar te Beth-el geroepen had, dat Jerobeam zijn hand van het altaar uitstrekte en zei: Grijpt hem! Maar zijn hand die hij tegen hem uitgestrekt had, verdorde, zodat hij ze niet meer naar zich toe kon trekken.","5":"En het altaar scheurde vaneen, en de as werd van het altaar afgestort, volgens het wonderteken dat de man van God gegeven had, door het woord van de HEERE.","6":"Toen antwoordde de koning en zei tegen de man van God: Zoek toch met ernst het aangezicht van de HEERE, uw God, en bid voor mij, dat mijn hand weer bij mij komt! Toen zocht de man van God met ernst het aangezicht van de HEERE; en de hand van de koning kwam weer bij hem terug, en werd zoals eerst.","7":"En de koning zei tegen de man van God: Kom met mij mee naar huis, en sterk *u*, en ik zal u een geschenk geven.","8":"Maar de man van God zei tegen de koning: Al gaf u mij de helft van uw huis, dan zou ik niet met u meegaan, en ik zou op deze plaats geen brood eten, en geen water drinken.","9":"Want zo heeft de HEERE mij geboden door Zijn woord: U zult geen brood eten en geen water drinken; en u zult niet terugkeren via de weg die u gegaan bent.","10":"En hij ging via een andere weg, en keerde niet terug via de weg waardoor hij naar Beth-el gekomen was.","11":"Er woonde nu een oude profeet te Beth-el; en zijn zoon kwam en vertelde hem al het werk dat de man van God die dag in Beth-el gedaan had, met de woorden die hij tegen de koning gesproken had; dat vertelden zij ook aan hun vader.","12":"En hun vader zei tegen hen: Welke weg is hij gegaan? En zijn zonen hadden de weg gezien waarlangs de man van God gegaan was, die uit Juda gekomen was.","13":"Toen zei hij tegen zijn zonen: Zadelt mij de ezel. En zij zadelden hem de ezel, en hij reed erop.","14":"En hij ging de man van God achterna, en vond hem zittend onder een eik; en hij zei tegen hem: Bent u de man van God die uit Juda gekomen is? En hij zei: Ik ben het.","15":"Toen zei hij tegen hem: Kom met mij mee naar huis, en eet brood.","16":"Doch hij zei: Ik kan niet met u terugkeren, en niet met u meegaan; ik zal ook geen brood eten en geen water drinken met u op deze plaats.","17":"Want er is een woord tot mij gekomen door het woord van de HEERE: U zult daar geen brood eten en geen water drinken; u zult niet terugkeren door de weg te gaan waardoor u gegaan bent.","18":"En hij zei tegen hem: Ik ben ook een profeet, net als u, en een engel heeft tot mij gesproken door het woord van de HEERE, en gezegd: Breng hem met u terug naar uw huis, zodat hij brood eet en water drinkt. *Doch* hij loog tegen hem.","19":"En hij keerde met hem terug, en at brood in zijn huis, en dronk water.","20":"En het gebeurde, terwijl zij aan tafel zaten, dat het woord van de HEERE kwam tot de profeet die hem had laten terugkeren;","21":"en hij riep tegen de man van God die uit Juda gekomen was, en zei: Zo zegt de HEERE: Omdat u opstandig bent geweest tegen de mond van de HEERE, en het gebod niet gehouden hebt dat de HEERE, uw God, u geboden had,","22":"maar bent teruggekeerd en hebt brood gegeten en water gedronken op de plaats waarvan Hij tegen u gezegd had: U zult geen brood eten en geen water drinken; zo zal uw dode lichaam niet in het graf van uw vader komen.","23":"En het gebeurde, nadat hij brood gegeten had en nadat hij gedronken had, dat hij hem de ezel zadelde, *te weten voor* de profeet die hij had laten terugkeren.","24":"Zo ging hij weg, en een leeuw vond hem op de weg, en doodde hem; en zijn dode lichaam lag geworpen op de weg, en de ezel stond ernaast; ook stond de leeuw bij het dode lichaam.","25":"En zie, er kwamen lieden voorbij, en zagen het dode lichaam liggen op de weg, en de leeuw die bij het dode lichaam stond; en zij kwamen en vertelden het in de stad waar de oude profeet woonde.","26":"Toen de profeet die hem van de weg had laten terugkeren, *dit* hoorde, zei hij: Het is de man van God, die opstandig is geweest tegen de mond van de HEERE; daarom heeft de HEERE hem aan de leeuw overgegeven, die hem verscheurd en gedood heeft, naar het woord van de HEERE dat Hij tot hem gesproken had.","27":"Verder sprak hij tegen zijn zonen, en zei: Zadelt mij de ezel. En zij zadelden *hem*.","28":"Toen ging hij weg, en vond zijn dode lichaam liggen op de weg, en de ezel, en de leeuw die bij het dode lichaam stond; de leeuw had het dode lichaam niet gegeten, en de ezel niet verscheurd.","29":"Toen nam de profeet het dode lichaam van de man van God op, en legde het op de ezel, en bracht het terug; zo kwam de oude profeet in de stad om rouw te bedrijven en hem te begraven.","30":"En hij legde zijn dode lichaam in zijn eigen graf; en zij weeklaagden over hem: Ach, mijn broeder!","31":"Het gebeurde nu, nadat hij hem begraven had, dat hij sprak tot zijn zonen, en zei: Als ik gestorven ben, begraaf mij dan in dat graf waarin de man van God begraven is, *en* legt mijn beenderen bij zijn beenderen.","32":"Want de zaak zal zeker gebeuren, die hij door het woord van de HEERE uitgeroepen heeft tegen het altaar dat te Beth-el is, en tegen alle huizen van de hoogten die in de steden van Samaria zijn.","33":"Na deze geschiedenis keerde Jerobeam zich niet af van zijn slechte weg; maar maakte opnieuw priesters van de hoogten uit de geringste mensen van het volk; wie wilde, diens hand vulde hij, en werd een van de priesters van de hoogten.","34":"En dit werd voor het huis van Jerobeam tot zonde, om *het* te doen afsnijden en te verdelgen van de aardbodem."},"SV":{"1":"En ziet, een man Gods kwam uit Juda, door het woord des HEEREN tot Beth-el; en Jerobeam stond bij het altaar, om te roken.","2":"En hij riep tegen het altaar, door het woord des HEEREN, en zeide: Altaar, altaar, zo zegt de HEERE: Zie, een zoon zal aan het huis Davids geboren worden, wiens naam zal zijn Josia; die zal op u offeren de priesters der hoogten, die op u roken, en men zal mensenbeenderen op u verbranden.","3":"En hij gaf ten zelfden dage een wonderteken, zeggende: Dit is dat wonderteken, waarvan de HEERE gesproken heeft; ziet, het altaar zal vaneen gescheurd, en de as, die daarop is, afgestort worden.","4":"Het geschiedde nu, als de koning het woord van den man Gods hoorde, hetwelk hij tegen het altaar te Beth-el geroepen had, dat Jerobeam zijn hand van op het altaar uitstrekte, zeggende: Grijpt hem! Maar zijn hand, die hij tegen hem uitgestrekt had, verdorde, dat hij ze niet weder tot zich trekken kon.","5":"En het altaar werd vaneen gescheurd, en de as van het altaar afgestort, naar dat wonderteken, dat de man Gods gegeven had, door het woord des HEEREN.","6":"Toen antwoordde de koning, en zeide tot den man Gods: Aanbid toch het aangezicht des HEEREN, uws Gods, ernstelijk, en bid voor mij, dat mijn hand weder tot mij kome! Toen bad de man Gods het aangezicht des HEEREN ernstelijk; en de hand des konings kwam weder tot hem, en werd gelijk te voren.","7":"En de koning sprak tot den man Gods: Kom met mij naar huis, en sterk *u*, en ik zal u een geschenk geven.","8":"Maar de man Gods zeide tot den koning: Al gaaft gij mij de helft van uw huis, zo zou ik niet met u gaan, en ik zou in deze plaats geen brood eten, noch water drinken.","9":"Want zo heeft mij de HEERE geboden door Zijn woord, zeggende: Gij zult geen brood eten, noch water drinken; en gij zult niet wederkeren door den weg, dien gij gegaan zijt.","10":"En hij ging door een anderen weg, en keerde niet weder door den weg, door welken hij te Beth-el gekomen was.","11":"Een oud profeet nu woonde te Beth-el; en zijn zoon kwam, en vertelde hem al het werk, dat de man Gods te dien dage in Beth-el gedaan had, met de woorden, die hij tot den koning gesproken had; deze vertelden zij ook hun vader.","12":"En hun vader sprak tot hen: Wat weg is hij getogen? En zijn zonen hadden den weg gezien, welken de man Gods was getogen, die uit Juda gekomen was.","13":"Toen zeide hij tot zijn zonen: Zadelt mij den ezel. En zij zadelden hem den ezel, en hij reed daarop.","14":"En hij toog den man Gods na, en vond hem zittende onder een eik; en hij zeide tot hem: Zijt gij de man Gods, die uit Juda gekomen zijt? En hij zeide: Ik ben het.","15":"Toen zeide hij tot hem: Kom met mij naar huis, en eet brood.","16":"Doch hij zeide: Ik kan niet met u wederkeren, noch met u inkomen; ik zal ook geen brood eten, noch met u water drinken, in deze plaats.","17":"Want een woord is tot mij *geschied* door het woord des HEEREN: Gij zult aldaar noch brood eten, noch water drinken; gij zult niet wederkeren, gaande door den weg, door denwelken gij gegaan zijt.","18":"En hij zeide tot hem: Ik ben ook een profeet, gelijk gij, en een engel heeft tot mij gesproken door het woord des HEEREN, zeggende: Breng hem weder met u in uw huis, dat hij brood ete en water drinke. *Doch* hij loog hem.","19":"En hij keerde met hem wederom, en at brood in zijn huis, en dronk water.","20":"En het geschiedde, als zij aan de tafel zaten, dat het woord des HEEREN geschiedde tot den profeet, die hem had doen wederkeren;","21":"En hij riep tot den man Gods, die uit Juda gekomen was, zeggende: Zo zegt de HEERE: Daarom dat gij den mond des HEEREN zijt wederspannig geweest, en niet gehouden hebt het gebod, dat u de HEERE, uw God, geboden had,","22":"Maar zijt wedergekeerd, en hebt brood gegeten en water gedronken ter plaatse, waarvan Hij tot u gesproken had: Gij zult geen brood eten noch water drinken; zo zal uw dood lichaam in uw vaderen graf niet komen.","23":"En het geschiedde, nadat hij brood gegeten, en nadat hij gedronken had, dat hij hem den ezel zadelde, *te* *weten* *voor* den profeet, dien hij had doen wederkeren.","24":"Zo toog hij heen, en een leeuw vond hem op den weg, en doodde hem; en zijn dood lichaam lag geworpen op den weg, en de ezel stond daarbij; ook stond de leeuw bij het dode lichaam.","25":"En ziet, er gingen lieden voorbij, en zagen het dode lichaam geworpen op den weg, en den leeuw, staande bij het dode lichaam; en zij kwamen en zeiden het in de stad, waarin de oude profeet woonde.","26":"Als de profeet, die hem van den weg had doen wederkeren, *dit* hoorde, zo zeide hij: Het is de man Gods, die den mond des HEEREN wederspannig is geweest; daarom heeft de HEERE hem den leeuw overgegeven, die hem gebroken, en hem gedood heeft, naar het woord des HEEREN, dat Hij tot hem gesproken had.","27":"Verder sprak hij tot zijn zonen, zeggende: Zadelt mij den ezel. En zij zadelden *hem*.","28":"Toen toog hij heen, en vond zijn dood lichaam geworpen op den weg, en den ezel, en den leeuw, staande bij het dode lichaam; de leeuw had het dode lichaam niet gegeten, en den ezel niet gebroken.","29":"Toen nam de profeet het dode lichaam van den man Gods op, en leide dat op den ezel, en voerde het wederom; zo kwam de oude profeet in de stad om rouw te bedrijven en hem te begraven.","30":"En hij leide zijn dood lichaam in zijn graf; en zij maakten over hem een weeklage: Ach, mijn broeder!","31":"Het geschiedde nu, nadat hij hem begraven had, dat hij sprak tot zijn zonen, zeggende: Als ik zal gestorven zijn, zo begraaft mij in dat graf, waarin de man Gods begraven is, *en* legt mijn beenderen bij zijn beenderen.","32":"Want de zaak zal gewisselijk geschieden, die hij door het woord des HEEREN uitgeroepen heeft tegen het altaar, dat te Beth-el is, en tegen al de huizen der hoogten, die in de steden van Samaria zijn.","33":"Na deze geschiedenis keerde zich Jerobeam niet van zijn bozen weg; maar maakte wederom priesters der hoogten van de geringsten des volks; wie wilde, diens hand vulde hij, en werd een van de priesters der hoogten.","34":"En hij werd in deze zaak het huis van Jerobeam tot zonde, om *hetzelve* te doen afsnijden en te verdelgen van den aardbodem."},"KJV":{"1":"And, behold, there came a man of God out of Judah by the word of the LORD unto Bethel: and Jeroboam stood by the altar to burn incense.","2":"And he cried against the altar in the word of the LORD, and said, O altar, altar, thus saith the LORD; Behold, a child shall be born unto the house of David, Josiah by name; and upon thee shall he offer the priests of the high places that burn incense upon thee, and men's bones shall be burnt upon thee.","3":"And he gave a sign the same day, saying, This is the sign which the LORD hath spoken; Behold, the altar shall be rent, and the ashes that are upon it shall be poured out.","4":"And it came to pass, when king Jeroboam heard the saying of the man of God, which had cried against the altar in Bethel, that he put forth his hand from the altar, saying, Lay hold on him. And his hand, which he put forth against him, dried up, so that he could not pull it in again to him.","5":"The altar also was rent, and the ashes poured out from the altar, according to the sign which the man of God had given by the word of the LORD.","6":"And the king answered and said unto the man of God, Intreat now the face of the LORD thy God, and pray for me, that my hand may be restored me again. And the man of God besought the LORD, and the king's hand was restored him again, and became as it was before.","7":"And the king said unto the man of God, Come home with me, and refresh thyself, and I will give thee a reward.","8":"And the man of God said unto the king, If thou wilt give me half thine house, I will not go in with thee, neither will I eat bread nor drink water in this place:","9":"For so was it charged me by the word of the LORD, saying, Eat no bread, nor drink water, nor turn again by the same way that thou camest.","10":"So he went another way, and returned not by the way that he came to Bethel.","11":"Now there dwelt an old prophet in Bethel; and his sons came and told him all the works that the man of God had done that day in Bethel: the words which he had spoken unto the king, them they told also to their father.","12":"And their father said unto them, What way went he? For his sons had seen what way the man of God went, which came from Judah.","13":"And he said unto his sons, Saddle me the ass. So they saddled him the ass: and he rode thereon,","14":"And went after the man of God, and found him sitting under an oak: and he said unto him, Art thou the man of God that camest from Judah? And he said, I am.","15":"Then he said unto him, Come home with me, and eat bread.","16":"And he said, I may not return with thee, nor go in with thee: neither will I eat bread nor drink water with thee in this place:","17":"For it was said to me by the word of the LORD, Thou shalt eat no bread nor drink water there, nor turn again to go by the way that thou camest.","18":"He said unto him, I am a prophet also as thou art; and an angel spake unto me by the word of the LORD, saying, Bring him back with thee into thine house, that he may eat bread and drink water. But he lied unto him.","19":"So he went back with him, and did eat bread in his house, and drank water.","20":"And it came to pass, as they sat at the table, that the word of the LORD came unto the prophet that brought him back:","21":"And he cried unto the man of God that came from Judah, saying, Thus saith the LORD, Forasmuch as thou hast disobeyed the mouth of the LORD, and hast not kept the commandment which the LORD thy God commanded thee,","22":"But camest back, and hast eaten bread and drunk water in the place, of the which the LORD did say to thee, Eat no bread, and drink no water; thy carcase shall not come unto the sepulchre of thy fathers.","23":"And it came to pass, after he had eaten bread, and after he had drunk, that he saddled for him the ass, to wit, for the prophet whom he had brought back.","24":"And when he was gone, a lion met him by the way, and slew him: and his carcase was cast in the way, and the ass stood by it, the lion also stood by the carcase.","25":"And, behold, men passed by, and saw the carcase cast in the way, and the lion standing by the carcase: and they came and told it in the city where the old prophet dwelt.","26":"And when the prophet that brought him back from the way heard thereof, he said, It is the man of God, who was disobedient unto the word of the LORD: therefore the LORD hath delivered him unto the lion, which hath torn him, and slain him, according to the word of the LORD, which he spake unto him.","27":"And he spake to his sons, saying, Saddle me the ass. And they saddled him.","28":"And he went and found his carcase cast in the way, and the ass and the lion standing by the carcase: the lion had not eaten the carcase, nor torn the ass.","29":"And the prophet took up the carcase of the man of God, and laid it upon the ass, and brought it back: and the old prophet came to the city, to mourn and to bury him.","30":"And he laid his carcase in his own grave; and they mourned over him, saying, Alas, my brother!","31":"And it came to pass, after he had buried him, that he spake to his sons, saying, When I am dead, then bury me in the sepulchre wherein the man of God is buried; lay my bones beside his bones:","32":"For the saying which he cried by the word of the LORD against the altar in Bethel, and against all the houses of the high places which are in the cities of Samaria, shall surely come to pass.","33":"After this thing Jeroboam returned not from his evil way, but made again of the lowest of the people priests of the high places: whosoever would, he consecrated him, and he became one of the priests of the high places.","34":"And this thing became sin unto the house of Jeroboam, even to cut it off, and to destroy it from off the face of the earth."}},"tsk":{"1":[{"kopje":"kwam","refs":["1 Kon 12:22","2 Kon 23:17","2 Kron 9:29"]},{"kopje":"door het woord","refs":["1 Kon 13:5","1 Kon 13:9","1 Kon 13:26","1 Kon 13:32","1 Kon 20:35","Jer 25:3","1 Tess 4:15"]},{"kopje":"Jerobeam","refs":["1 Kon 12:32","1 Kon 12:33","2 Kron 26:18"]},{"kopje":"roken","refs":["Num 16:40","Jer 11:12","Jer 32:29","Mal 1:11","Openb 8:3"]}],"2":[{"kopje":"Altaar, altaar","refs":["Deut 32:1","Jes 1:2","Jes 58:1","Jer 22:29","Ezech 36:1","Ezech 36:4","Ezech 38:4","Luk 19:40"]},{"kopje":"Josia zal zijn","refs":["2 Kon 22:1","2 Kon 22:2","2 Kon 23:15-18","2 Kron 34:1","2 Kron 34:4-7","Jes 42:9","Jes 44 "L7\" data-code=\"H6440\">de</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H6440\">aardbodem</span>."},"koppeling_kjv":{"1":"And, behold, there <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> out of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> by the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> unto <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel:</span> and <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> by the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> to burn <span class=\"wl wl-kjv\" data-code=\"H6999\">incense.</span>","2":"And he <span class=\"wl wl-kjv\" data-code=\"H7121\">cried</span> against the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> in the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> O <span class=\"wl wl-kjv\" data-code=\"H4196\">altar,</span> <span class=\"wl wl-kjv\" data-code=\"H4196\">altar,</span> thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> Behold, a <span class=\"wl wl-kjv\" data-code=\"H1121\">child</span> shall be <span class=\"wl wl-kjv\" data-code=\"H3205\">born</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> <span class=\"wl wl-kjv\" data-code=\"H2977\">Josiah</span> by <span class=\"wl wl-kjv\" data-code=\"H8034\">name;</span> and upon thee shall he <span class=\"wl wl-kjv\" data-code=\"H2076\">offer</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> of the high <span class=\"wl wl-kjv\" data-code=\"H1116\">places</span> that burn <span class=\"wl wl-kjv\" data-code=\"H6999\">incense</span> upon thee, and <span class=\"wl wl-kjv\" data-code=\"H120\">men's</span> <span class=\"wl wl-kjv\" data-code=\"H6106\">bones</span> shall be <span class=\"wl wl-kjv\" data-code=\"H8313\">burnt</span> upon thee.","3":"And he <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> a <span class=\"wl wl-kjv\" data-code=\"H4159\">sign</span> the same <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> This is the <span class=\"wl wl-kjv\" data-code=\"H4159\">sign</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken;</span> Behold, the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> shall be <span class=\"wl wl-kjv\" data-code=\"H7167\">rent,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1880\">ashes</span> that are upon it shall be poured <span class=\"wl wl-kjv\" data-code=\"H8210\">out.</span>","4":"And it came to pass, when <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">saying</span> of the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> which had <span class=\"wl wl-kjv\" data-code=\"H7121\">cried</span> against the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> in <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel,</span> that he put <span class=\"wl wl-kjv\" data-code=\"H7971\">forth</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> from the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Lay <span class=\"wl wl-kjv\" data-code=\"H8610\">hold</span> on him. And his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> which he put <span class=\"wl wl-kjv\" data-code=\"H7971\">forth</span> against him, dried <span class=\"wl wl-kjv\" data-code=\"H3001\">up,</span> so that he <span class=\"wl wl-kjv\" data-code=\"H3201\">could</span> not pull it in <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> to him.","5":"The <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> also was <span class=\"wl wl-kjv\" data-code=\"H7167\">rent,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1880\">ashes</span> poured <span class=\"wl wl-kjv\" data-code=\"H8210\">out</span> from the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar,</span> according to the <span class=\"wl wl-kjv\" data-code=\"H4159\">sign</span> which the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> had <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> by the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","6":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> <span class=\"wl wl-kjv\" data-code=\"H2470\">Intreat</span> now the <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and <span class=\"wl wl-kjv\" data-code=\"H6419\">pray</span> for me, that my <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> may be restored me <span class=\"wl wl-kjv\" data-code=\"H7725\">again.</span> And the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H2470\">besought</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> was restored him <span class=\"wl wl-kjv\" data-code=\"H7725\">again,</span> and became as it was <span class=\"wl wl-kjv\" data-code=\"H7223\">before.</span>","7":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> <span class=\"wl wl-kjv\" data-code=\"H935\">Come</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">home</span> with me, and <span class=\"wl wl-kjv\" data-code=\"H5582\">refresh</span> thyself, and I will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thee a <span class=\"wl wl-kjv\" data-code=\"H4991\">reward.</span>","8":"And the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> If thou wilt <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> me <span class=\"wl wl-kjv\" data-code=\"H2677\">half</span> thine <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> I will not go <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> with thee, neither will I <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> nor <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> in this <span class=\"wl wl-kjv\" data-code=\"H4725\">place:</span>","9":"For so was it <span class=\"wl wl-kjv\" data-code=\"H6680\">charged</span> me by the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H398\">Eat</span> no <span class=\"wl wl-kjv\" data-code=\"H3899\">bread,</span> nor <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> nor turn <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> by the same <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> that thou <span class=\"wl wl-kjv\" data-code=\"H1980\">camest.</span>","10":"So he <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> <span class=\"wl wl-kjv\" data-code=\"H312\">another</span> <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> not by the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> that he <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel.</span>","11":"Now there <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> <span class=\"wl wl-kjv\" data-code=\"H259\">an</span> <span class=\"wl wl-kjv\" data-code=\"H2205\">old</span> <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> in <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel;</span> and his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> and <span class=\"wl wl-kjv\" data-code=\"H5608\">told</span> him all the <span class=\"wl wl-kjv\" data-code=\"H4639\">works</span> that the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> had <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> in <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel:</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> which he had <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> them they <span class=\"wl wl-kjv\" data-code=\"H5608\">told</span> also to their <span class=\"wl wl-kjv\" data-code=\"H1\">father.</span>","12":"And their <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">said</span> unto them, What <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> he? For his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> had <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> <span class=\"wl wl-kjv\" data-code=\"H335\">what</span> <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">went,</span> which <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> from <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah.</span>","13":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> <span class=\"wl wl-kjv\" data-code=\"H2280\">Saddle</span> me the <span class=\"wl wl-kjv\" data-code=\"H2543\">ass.</span> So they <span class=\"wl wl-kjv\" data-code=\"H2280\">saddled</span> him the <span class=\"wl wl-kjv\" data-code=\"H2543\">ass:</span> and he <span class=\"wl wl-kjv\" data-code=\"H7392\">rode</span> thereon,","14":"And <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> him <span class=\"wl wl-kjv\" data-code=\"H3427\">sitting</span> under an <span class=\"wl wl-kjv\" data-code=\"H424\">oak:</span> and he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Art thou the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> that <span class=\"wl wl-kjv\" data-code=\"H935\">camest</span> from <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah?</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I am.","15":"Then he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H3212\">Come</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">home</span> with me, and <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread.</span>","16":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I <span class=\"wl wl-kjv\" data-code=\"H3201\">may</span> not <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> with thee, nor go <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> with thee: neither will I <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> nor <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> with thee in this <span class=\"wl wl-kjv\" data-code=\"H4725\">place:</span>","17":"For it was <span class=\"wl wl-kjv\" data-code=\"H1697\">said</span> to me by the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> Thou shalt <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> no <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> nor <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> there, nor turn <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> by the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> that thou <span class=\"wl wl-kjv\" data-code=\"H1980\">camest.</span>","18":"He <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, I am a <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> also as thou art; and an <span class=\"wl wl-kjv\" data-code=\"H4397\">angel</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto me by the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Bring him <span class=\"wl wl-kjv\" data-code=\"H7725\">back</span> with thee into thine <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> that he may <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> and <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water.</span> But he <span class=\"wl wl-kjv\" data-code=\"H3584\">lied</span> unto him.","19":"So he went <span class=\"wl wl-kjv\" data-code=\"H7725\">back</span> with him, and did <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> in his <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and <span class=\"wl wl-kjv\" data-code=\"H8354\">drank</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water.</span>","20":"And it came to pass, as they <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> at the <span class=\"wl wl-kjv\" data-code=\"H7979\">table,</span> that the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> came unto the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> that brought him <span class=\"wl wl-kjv\" data-code=\"H7725\">back:</span>","21":"And he <span class=\"wl wl-kjv\" data-code=\"H7121\">cried</span> unto the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> that <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> from <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> Forasmuch <span class=\"wl wl-kjv\" data-code=\"H3282\">as</span> thou hast <span class=\"wl wl-kjv\" data-code=\"H4784\">disobeyed</span> the <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and hast not <span class=\"wl wl-kjv\" data-code=\"H8104\">kept</span> the <span class=\"wl wl-kjv\" data-code=\"H4687\">commandment</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> thee,","22":"But camest <span class=\"wl wl-kjv\" data-code=\"H7725\">back,</span> and hast <span class=\"wl wl-kjv\" data-code=\"H398\">eaten</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> and <span class=\"wl wl-kjv\" data-code=\"H8354\">drunk</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> in the <span class=\"wl wl-kjv\" data-code=\"H4725\">place,</span> of the which the LORD did <span class=\"wl wl-kjv\" data-code=\"H1696\">say</span> to thee, <span class=\"wl wl-kjv\" data-code=\"H398\">Eat</span> no <span class=\"wl wl-kjv\" data-code=\"H3899\">bread,</span> and <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> no <span class=\"wl wl-kjv\" data-code=\"H4325\">water;</span> thy <span class=\"wl wl-kjv\" data-code=\"H5038\">carcase</span> shall not <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> unto the <span class=\"wl wl-kjv\" data-code=\"H6913\">sepulchre</span> of thy <span class=\"wl wl-kjv\" data-code=\"H1\">fathers.</span>","23":"And it came to pass, <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> he had <span class=\"wl wl-kjv\" data-code=\"H398\">eaten</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread,</span> and <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> he had <span class=\"wl wl-kjv\" data-code=\"H8354\">drunk,</span> that he <span class=\"wl wl-kjv\" data-code=\"H2280\">saddled</span> for him the <span class=\"wl wl-kjv\" data-code=\"H2543\">ass,</span> to wit, for the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> whom he had brought <span class=\"wl wl-kjv\" data-code=\"H7725\">back.</span>","24":"And when he was <span class=\"wl wl-kjv\" data-code=\"H3212\">gone,</span> a <span class=\"wl wl-kjv\" data-code=\"H738\">lion</span> <span class=\"wl wl-kjv\" data-code=\"H4672\">met</span> him by the <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> and <span class=\"wl wl-kjv\" data-code=\"H4191\">slew</span> him: and his <span class=\"wl wl-kjv\" data-code=\"H5038\">carcase</span> was <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> in the <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2543\">ass</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> <span class=\"wl wl-kjv\" data-code=\"H681\">by</span> it, the <span class=\"wl wl-kjv\" data-code=\"H738\">lion</span> also <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> by the <span class=\"wl wl-kjv\" data-code=\"H5038\">carcase.</span>","25":"And, behold, <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> passed <span class=\"wl wl-kjv\" data-code=\"H5674\">by,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> the <span class=\"wl wl-kjv\" data-code=\"H5038\">carcase</span> <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> in the <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> and the <span class=\"wl wl-kjv\" data-code=\"H738\">lion</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">standing</span> <span class=\"wl wl-kjv\" data-code=\"H681\">by</span> the <span class=\"wl wl-kjv\" data-code=\"H5038\">carcase:</span> and they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> and <span class=\"wl wl-kjv\" data-code=\"H1696\">told</span> it in the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> where the <span class=\"wl wl-kjv\" data-code=\"H2205\">old</span> <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt.</span>","26":"And when the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> that brought him <span class=\"wl wl-kjv\" data-code=\"H7725\">back</span> from the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> thereof, he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> It is the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> who was <span class=\"wl wl-kjv\" data-code=\"H4784\">disobedient</span> unto the <span class=\"wl wl-kjv\" data-code=\"H6310\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> therefore the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> him unto the <span class=\"wl wl-kjv\" data-code=\"H738\">lion,</span> which hath <span class=\"wl wl-kjv\" data-code=\"H7665\">torn</span> him, and <span class=\"wl wl-kjv\" data-code=\"H4191\">slain</span> him, according to the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> which he <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto him.","27":"And he <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> to his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H2280\">Saddle</span> me the <span class=\"wl wl-kjv\" data-code=\"H2543\">ass.</span> And they <span class=\"wl wl-kjv\" data-code=\"H2280\">saddled</span> him.","28":"And he <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> and <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> his <span class=\"wl wl-kjv\" data-code=\"H5038\">carcase</span> <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> in the <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2543\">ass</span> and the <span class=\"wl wl-kjv\" data-code=\"H738\">lion</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">standing</span> <span class=\"wl wl-kjv\" data-code=\"H681\">by</span> the <span class=\"wl wl-kjv\" data-code=\"H5038\">carcase:</span> the <span class=\"wl wl-kjv\" data-code=\"H738\">lion</span> had not <span class=\"wl wl-kjv\" data-code=\"H398\">eaten</span> the <span class=\"wl wl-kjv\" data-code=\"H5038\">carcase,</span> nor <span class=\"wl wl-kjv\" data-code=\"H7665\">torn</span> the <span class=\"wl wl-kjv\" data-code=\"H2543\">ass.</span>","29":"And the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> took <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H5038\">carcase</span> of the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and <span class=\"wl wl-kjv\" data-code=\"H3240\">laid</span> it upon the <span class=\"wl wl-kjv\" data-code=\"H2543\">ass,</span> and brought it <span class=\"wl wl-kjv\" data-code=\"H7725\">back:</span> and the <span class=\"wl wl-kjv\" data-code=\"H2205\">old</span> <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> to <span class=\"wl wl-kjv\" data-code=\"H5594\">mourn</span> and to <span class=\"wl wl-kjv\" data-code=\"H6912\">bury</span> him.","30":"And he <span class=\"wl wl-kjv\" data-code=\"H3240\">laid</span> his <span class=\"wl wl-kjv\" data-code=\"H5038\">carcase</span> in his own <span class=\"wl wl-kjv\" data-code=\"H6913\">grave;</span> and they <span class=\"wl wl-kjv\" data-code=\"H5594\">mourned</span> over him, saying, <span class=\"wl wl-kjv\" data-code=\"H1945\">Alas,</span> my <span class=\"wl wl-kjv\" data-code=\"H251\">brother!</span>","31":"And it came to pass, <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> he had <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> him, that he <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> to his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> When I am <span class=\"wl wl-kjv\" data-code=\"H4191\">dead,</span> then <span class=\"wl wl-kjv\" data-code=\"H6912\">bury</span> me in the <span class=\"wl wl-kjv\" data-code=\"H6913\">sepulchre</span> wherein the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> is <span class=\"wl wl-kjv\" data-code=\"H6912\">buried;</span> <span class=\"wl wl-kjv\" data-code=\"H3240\">lay</span> my <span class=\"wl wl-kjv\" data-code=\"H6106\">bones</span> <span class=\"wl wl-kjv\" data-code=\"H681\">beside</span> his <span class=\"wl wl-kjv\" data-code=\"H6106\">bones:</span>","32":"For the <span class=\"wl wl-kjv\" data-code=\"H1697\">saying</span> which he <span class=\"wl wl-kjv\" data-code=\"H7121\">cried</span> by the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> against the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> in <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel,</span> and against all the <span class=\"wl wl-kjv\" data-code=\"H1004\">houses</span> of the high <span class=\"wl wl-kjv\" data-code=\"H1116\">places</span> which are in the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria,</span> shall surely come to pass.","33":"<span class=\"wl wl-kjv\" data-code=\"H310\">After</span> this <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> not from his <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> but <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> of the <span class=\"wl wl-kjv\" data-code=\"H7098\">lowest</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> of the high <span class=\"wl wl-kjv\" data-code=\"H1116\">places:</span> whosoever <span class=\"wl wl-kjv\" data-code=\"H2655\">would,</span> he <span class=\"wl wl-kjv\" data-code=\"H4390\">consecrated</span> him, and he became one of the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> of the high <span class=\"wl wl-kjv\" data-code=\"H1116\">places.</span>","34":"And this <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> became <span class=\"wl wl-kjv\" data-code=\"H2403\">sin</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam,</span> even to cut it <span class=\"wl wl-kjv\" data-code=\"H3582\">off,</span> and to <span class=\"wl wl-kjv\" data-code=\"H8045\">destroy</span> it from off the <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> of the <span class=\"wl wl-kjv\" data-code=\"H127\">earth.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"een man Gods","tekst":"Zie van deze benaming Jdg 13:6."},{"catchword":"door het woord des HEEREN","tekst":"Dat is, door het bevel des Heeren, alzo in vs.2; of met het woord des Heeren; dat is, met zekeren last, dien hij den koning Jerobeam aandienen moest."},{"catchword":"om te roken","tekst":"Vergelijk boven, 1Ki 12:32-33, en de aantekeningen daarop; idem onder, vs.4."}],"2":[{"catchword":"Altaar,","tekst":"Hij spreekt het altaar toe, omdat de koning tot deze en dergelijke vermaningen geen gehoor gaf. Ondertussen de gehele uiterlijke afgodendienst wordt gedreigd door het woord altaar, hetwelk somtijds voor den gehelen uitwendigen godsdienst genomen wordt, gelijk Isa 19:19; 1Co 9:13."},{"catchword":"geboren worden,","tekst":"Te weten, omtrent drie honderd en dertig jaren na dezen."},{"catchword":"die zal op u offeren","tekst":"Waardoor het altaar verontreinigd en de priesters, die daarop offerden, gestraft zouden worden. Zie de vervulling hiervan 2Ki 23:15, enz."}],"3":[{"catchword":"gaf ten zelfden","tekst":"Dat is, hij verklaarde dat er dadelijk een wonder geschieden zou, tot bevestiging van hetgeen hij voorzeide. Alzo onder, vs.5, en zo spreekt ook Mozes, Deu 13:1."},{"catchword":"vaneen gescheurd,","tekst":"Te weten, vanzelf, zonder dat enig mens zijn hand daartoe brengen zal."}],"4":[{"catchword":"hand van op","tekst":"Waarmede hij over en omtrent het altaar met offeren en roken bezig was."},{"catchword":"hem uitgestrekt had,","tekst":"Hij meent den man Gods, die het altaar gedreigd had."}],"6":[{"catchword":"antwoordde","tekst":"Antwoorden heet hier, een rede of aanspraak beginnen. Zie Jdg 18:14."}],"7":[{"catchword":"sterk u,","tekst":"Het Hebreeuwse woord betekent eigenlijk ondersteunen, hetwelk hier zoveel is als het lichaam door nuttiging van spijs en drank nieuwe sterkte toebrengen. Vergelijk Gen 18:5; Jdg 19:5, Jdg 19:8, en Psa 104:15."}],"8":[{"catchword":"gaaft gij","tekst":"Gelijke manier van spreken gebruikt Bileam, Num 22:13, maar niet met een oprecht hart."},{"catchword":"deze plaats","tekst":"Dat is, hier te Beth-el; alzo onder, 1Ki 12:16."},{"catchword":"brood","tekst":"Dat is geen spijs noch drank nuttigen; alzo onder, vs.9, 16,17, enz. Vergelijk 1Sa 30:11; 2Ki 6:22-23."}],"9":[{"catchword":"zo heeft","tekst":"Hebreeuws, zo heeft Hij mij geboden door het woord des HEEREN; dat is, alzo heeft Hij, te weten de Heere, mij geboden door zijn woord. Zie gelijke manier van spreken Gen 1:27, en Gen 5:1, en de aantekeningen."},{"catchword":"Gij zult geen","tekst":"Namelijk, te Beth-el. Vergelijk het vs.7. Want dit verbod, gelijk het persoonlijk was, alzo was het ook te verstaan ten aanzien van de plaats, tot welke hij gezonden was, en zonder twijfel van den tijd dezer uitzending."}],"11":[{"catchword":"oud profeet","tekst":"In dagen, en misschien ook in ambt, doch hierin niet altijd vroom en getrouw, want hoewel hij de gave der profetie en enige vreze Gods gehad heeft, en een liefhebber der ware profeten schijnt geweest te zijn, gelijk af te nemen is uit hetgeen hierna verhaald wordt, vs.20-22,, 26,27, 29-32, nochtans wordt hij hier bevonden in leugentaal en valsheid, vs.18, waardoor hij den vromen profeet bedrogen en in het lijden gebracht heeft, vs.24."},{"catchword":"zij ook hun vader","tekst":"Namelijk, de voorgemelde zoon met zijn broeders, die zijn verhaal met hun toestemming bevestigden."}],"12":[{"catchword":"gezien,","tekst":"Dat is, zij hadden gelet, of vernomen wat weg hij ingegaan was, vertrekkende van Beth-el, en gaven hun vader dat te kennen."}],"14":[{"catchword":"eik;","tekst":"Hier schijnt de profeet gerust te hebben uit vermoeidheid, met honger verenigd."}],"16":[{"catchword":"deze plaats","tekst":"Te weten, Beth-el, gelijk boven, vs.8."}],"17":[{"catchword":"een woord is","tekst":"Dat is, een bevel en last is mij gegeven, door de aanspraak des Heeren."}],"18":[{"catchword":"gij,","tekst":"Deze oude profeet zondigt hier driezins:&lt;i&gt;I.&lt;/i&gt; omdat hij God tegen zichzelven stelt;&lt;i&gt;II.&lt;/i&gt; omdat hij den profeet van Juda niet toelaat het bevel, hem van den Heere gegeven, te volbrengen;&lt;i&gt;III.&lt;/i&gt; omdat hij een valse openbaring of aanspraak voortbrengt."}],"19":[{"catchword":"hij keerde","tekst":"Hier zondigt ook deze profeet, verlatende het ware woord Gods, waarvan hij zeker was, en aannemende het valse, waarvan hij niet zeker kon wezen."}],"20":[{"catchword":"geschiedde tot","tekst":"Te weten, inwendiglijk door openbaring aan zijn gemoed."},{"catchword":"profeet,","tekst":"Versta, den ouden profeet, die te Beth-el woonde. En men kan hieruit afnemen, dat God dezen ook als een profeet gebruikte."},{"catchword":"hem","tekst":"Te weten, de profeet van Juda."},{"catchword":"had doen wederkeren;","tekst":"Namelijk, van de plaats, waar hij hem op den weg gevonden had, tot de stad Beth-el."}],"21":[{"catchword":"riep","tekst":"Dat is, hij sprak hem toe, met een luide, klare en zeer verzekerde stem."},{"catchword":"den mond","tekst":"Dat is, het gebod des HEEREN, hier tevoren uitgedrukt vs.9, 17, en in het volgende, vs.22 wederom vernieuwd."}],"22":[{"catchword":"zo zal","tekst":"Hetwelk voor een straf geoordeeld wordt, niet omdat de plaats der begrafenis den afgestorvene iets goeds of kwaads doen kan, maar omdat degenen, die tot de gewone plaats hunner begrafenis niet geraken kunnen, gemeenlijk meer ongemak hebben eer zij sterven, en min burgerlijk eer als zij begraven worden, en sommigen enig openbaar kwaad gedaan hebben in hun leven. Zie onder, 1Ki 14:13; Isa 14:19-20; Jer 22:19, en Jer 26:23."}],"23":[{"catchword":"hij brood gegeten,","tekst":"Namelijk, de man Gods, die van Juda gekomen was."},{"catchword":"hij hem den ezel","tekst":"Namelijk, de oude profeet van Bethel; hetwelk hij gedaan heeft, of door zijn zonen, of door zichzelven, om door deze gedienstigheid, [gelijk sommigen menen] te bewijzen het leed, dat hij had van het kwaad, dat hij den profeet van Juda gedaan had, wensende in zijn vriendschap nog te mogen blijven."}],"24":[{"catchword":"vond hem","tekst":"Dat is, ontmoette hem."},{"catchword":"stond daarbij;","tekst":"Als door de hand der goddelijke voorzienigheid daar gehouden, om het dode lichaam ter begrafenis te dragen."},{"catchword":"stond de leeuw","tekst":"Niet als een roofdier om dat te verslinden, maar als een wacht om dat ter begrafenis te bewaren."}],"26":[{"catchword":"den mond","tekst":"Zie boven, vs.21."},{"catchword":"gesproken had","tekst":"Te weten, door mij. Zie boven, vs.22."}],"28":[{"catchword":"niet gebroken","tekst":"Dat is, niet verscheurd noch enige leed gedaan, om hem te verslinden."}],"29":[{"catchword":"rouw","tekst":"Zie van het gebruik, waardoor men de doden heeft beklaagd, Gen 23:2."}],"30":[{"catchword":"in zijn graf;","tekst":"Te weten, in zijn eigen graf, dat hij daar in het land Israëls had. En hiermede werd vervuld de voorzegging Gods, vermeld boven, vs.22, want het lichaam van den doden profeet is niet gekomen in zijner vaderen graf, maar in het graf eens vreemden, namelijk van dezen ouden profeet van Bethel."},{"catchword":"zij maakten","tekst":"Namelijk, niet alleen de oude profeet, maar ook zijn huisgezin, ja ook [zo enigen menen] velen van de stad."},{"catchword":"Ach, mijn broeder","tekst":"Sommiger gevoelen is dat dit de eerste woorden zijn geweest van een lijklied, hetwelk over hem gezongen werd."}],"31":[{"catchword":"legt","tekst":"Sommigen menen dat hij dit expresselijk belast heeft, opdat zijn beenderen na zijn dood niet zouden geraken onder de beenderen, van welke gesproken is boven, vs.2."}],"32":[{"catchword":"gewisselijk","tekst":"Hebreeuws, geschiedende geschieden, of zijnde zijn."},{"catchword":"hoogten,","tekst":"Wat de hoogten voor plaatsen geweest zijn, zie Lev 26:30."},{"catchword":"Samaria","tekst":"Hebreeuws, Schomeron; het is een landschap, alhier zo genoemd bij voorkoming, omdat het naderhand eerst dezen naam kreeg van de koninklijke stad Schomeron [anders genaamd Samaria ], daarin gelegen, en van een berg van denzelfden naam, waarop de koning Omri die stad gebouwd heeft. Anderen verstaan dit van den berg zelf, die door zijn wijdte, ruimte en grootte veel kleine stedekens op zich zou gehad hebben. Vergelijk onder, vs.16, de aantekeningen vs.24."}],"33":[{"catchword":"deze geschiedenis","tekst":"Te weten, na de wonderwerken, die God gedaan had aan zijn hand, die haastelijk dorde en weder gezond geworden was; aan het altaar, dat vanzelf, zonder toedoen der mensen, spleet en scheurde, aan den profeet van Juda, die naar de goddelijke voorzegging in zijner vaderen graf niet gekomen was."},{"catchword":"wederom","tekst":"Zie boven, 1Ki 12:31-32."},{"catchword":"van de geringsten","tekst":"Zie boven, 1Ki 12:31."},{"catchword":"wie wilde,","tekst":"Anders, wien hij wilde, enz."},{"catchword":"diens hand","tekst":"Dat is, dien maakte hij priester. Zie Exo 28:41, en Lev 7:37."}],"34":[{"catchword":"hij werd","tekst":"Namelijk, Jerobeam. Anders, en dit werd, enz."},{"catchword":"het huis","tekst":"Dat is, zijn huis. Zie boven, 1Ki 2:19."},{"catchword":"tot zonde,","tekst":"Dat is, hij is met dit zijn doen oorzaak geweest, dat zijn nakomelingen tot gruwel en afgoderij vervallen zijn, en dat over hen gekomen is Gods straf, waardoor zij ten enenmale uitgeroeid zijn geweest, gelijk in de volgende hoofdstukken beschreven wordt."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And behold a man of God [See of this appellation Judg, 13. 6.]came out of Juda, by the word of the LORD, [i.e. by the command of the Lord; so in the following verse. Or with the word of the Lord, that is, with a certain charge, which he was to deliver unto King Jerobeam] unto Bethel: and Jerobeam stood by the Altar, to burn incense. [Compare above chap. 12. v. 32, 33. And the annotat, thereon, item below verse 4.]"}],"2":[{"catchword":null,"tekst":"And he cryed against the altar by the word of the LORD, and said, altar, altar, [He speaketh to the altar, because the King hearkened no to this, an the like exhortations. In the men while the whole outward idol-worship is threatened by the word altar, which is sometimes taken for the whole outward divine worship, as Isa. 19. 19. 1 Cor, 9. 13.] thus saith the LORD, behold, a son shall be born [viz. About three hundred thirty years after this time] unto the house o David, whose name shall be Josia, he shall offer upon thee, the Priests of the high places, whereby the alter should be polluted, and the Priests that offered thereon be punished. See the fulfilling hereof, 2 Kin. 23. 15, &c.] that burn incense upon thee."}],"3":[{"catchword":null,"tekst":"And he gave a token [i.e. he declared that straightway a miracle should happen, for confirmation of that which he foretold so below vers. And so doth Moses also speak. Duet. 18 on ver. 1.] the same day, saying; This is that token of which the LORD spake: behold, the altar shall be rent asunder, [i.e. of this own accord, no man laying a hand thereon] and the ashes that are upon it shall be poured out."}],"4":[{"catchword":null,"tekst":"Now it came to pass, when the King heard the Word of the man of God, which he had cried against the altar at Bethel, that Jeroboam stretched forth his hand from the altar,[i.e. Wherewith he was busie upon, and about the altar; in offering and burning incense] saying, Lay hold on him ;but his hand which he had stretched forth against him,[meaning the man of God, that had threatened the Altar] withered,(so) that he could not pull it (in) again to him."}],"5":[{"catchword":null,"tekst":"And the altar was rent asunder, and the ashes poured out from the altar, according to that token, which the man of God had given, by the Word of the LORD."}],"6":[{"catchword":null,"tekst":"Then the King answered, [Answering signifieth here to begin a speech, or discourse. See Judg. 18. on v. 14.] and said unto the man of God; Call now earnestly upon the face of the LORD thy God, and pray for me that my band may come to me again: Then the man of God be sought the face of the LORD earnestly, and the Kings had come to him again, and became as it was before."}],"7":[{"catchword":null,"tekst":"And the king spake to the man of God; come hence with me, and strengthen thyself, [the Hebrew word rendered here strengthening, signifieth properly under propping , which here is as much as to bring new strength to the body by the use of meat and drink compare Gen 18:5 Jud 13:5,8 and Psa 104:15] and I will give thee a present."}],"8":[{"catchword":null,"tekst":"But the man of God said unto the king if thou wouldst give me the half of thine house , I would not go with thee [the like phrase doth Bileam use Num 22:18 but not with an upright heart ] neither would I eat bread, nor drink water in this place [that is use no meat nor drink so below verse 9.16,17&c. Compare 1samuel 30.11 2Ki 6:22,23.]"}],"9":[{"catchword":null,"tekst":"For so the LORD charged me by his word, [Heb. So he charged me by the word of the LORD. That is, so he, to wit, the LORD, charged me by his Word. See the like phrase, Gen. 1. 27. & 5. 1. And the annotate.] saying, Thou shalt eat no bread, nor drink water. [Namely, at Bethel. Compare the last foregoing verse: for this prohibition, as it was personal, so was it likewise to be understood in regard of the place unto which he was sent, and doubtless also of the time of this sending forth] neither shalt thou return by the way that thou wentest."}],"10":[{"catchword":null,"tekst":"And he went another way; and turned not again by the way, that he came to Bethel."}],"11":[{"catchword":null,"tekst":"Now an old Prophet [Old in days, and perhaps in office also, but herein not always honest and faithful: for though he had the gift of Prophecy, and some fear of God before his eyes, and seemeth to have been a lover of the true Prophets, as may appear by that which is related hereafter, vers. 20, 21, 22, 26, 27, 29, 30, 31, 32. Yet here he is found in a lie and falsehood, vers. 18. Whereby he deceived the true Prophet, and brought him to suffering, vers. 24.] dwelt at Bethel; and his son came, and told him all the work which the man of God had done // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

function bereaHtml(n) {

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
